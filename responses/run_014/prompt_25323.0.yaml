                  Group A: cutoff=medium: deny medium and high -> 60 people.
                      FP = repayers in medium and high = 12+0=12
                      TN = repayers in low=32
                      FPR=12/(12+32)=12/44≈27.3%
                  Group B: cutoff=medium: deny medium and high -> 50 people.
                      FP = repayers in medium and high=18+2=20
                      TN = repayers in low=40
                      FPR=20/(20+40)=20/60≈33.3%
              Close but not exactly equal.

              If they set Group A to high and Group B to medium:
                  Group A: FPR=0 (as above)
                  Group B: FPR=33.3% -> not equal.

              If they set Group A to medium and Group B to high:
                  Group A: FPR=27.3%
                  Group B: FPR=3.3% -> not equal.

              If they set both to high:
                  Group A: FPR=0
                  Group B: FPR=3.3% -> not equal.

              If they set both to low:
                  Group A: FPR = repayers in low, medium, high = 32+12+0=44 -> in denominator, but wait: FP is the number of repayers denied. If deny everyone, then FP=44, TN=0, FPR=44/44=100%
                  Group B: FP= repayers denied:40+18+2=60, FPR=60/60=100% -> equal.

              So they can achieve equal FPR by denying everyone.

          Challenge 3: "Can you make the false negative rate (FNR) the same? FNR is the proportion of bad customers (defaulters) that you approve (so they default)."
              They need FNR_A = FNR_B.

              Try cutoffs:
                  both high: 
                      Group A: FN = defaulters in low and medium = 8+28=36, TP=20 (high defaulters), FNR=36/(36+20)=36/56≈64.3%
                      Group B: FN = defaulters in low and medium=10+12=22, TP=18, FNR=22/40=55% -> not equal.

                  both medium:
                      Group A: TP = defaulters in medium and high=28+20=48, FN = defaulters in low=8, FNR=8/(8+48)=8/56≈14.3%
                      Group B: TP = defaulters in medium and high=12+18=30, FN= defaulters in low=10, FNR=10/(10+30)=10/40=25% -> not equal.

                  both low: 
                      Group A: TP = 56, FN=0, FNR=0
                      Group B: TP=40, FN=0, FNR=0 -> equal.

              So again, by approving no one (deny everyone) they can achieve it.

          Challenge 4: "Can you achieve all three at the same time? Or even two of them at the same time without using the trivial solution of denying everyone or no one?"

          They will see it's hard.

          Then we can introduce calibration: within each risk category, the default rate should be the same across groups. But in our data, the medium category has 70% in A and 40% in B -> not calibrated. And high: 100% vs 90%. Only low is calibrated (20% in both).

          The activity is to experience the trade-offs, not necessarily to achieve the impossibility proof.

  Debrief (30 minutes):
  - Groups share what rules they tried and what trade-offs they observed.
  - Map to formal criteria:
     - Statistical parity = equal denial rate
     - Equalized FPR = equal false positive rate (also called predictive equality)
     - Equalized FNR = equal false negative rate (also called equal opportunity)
     - Calibration = in each risk category, the observed default rate should be the same as the predicted risk and across groups.
  - Explain the impossibility result: when base rates are different (56% vs 40%), you cannot have both:
     - Calibration within groups
     - Equalized FPR and FNR (equalized odds)
     unless the model is perfect or base rates are equal.
  - Also, you cannot have calibration and statistical parity.

  Predictably goes wrong:
  - The software engineer might try to write code to optimize — discourage this, as it's about intuition.
  - Someone might suggest collecting more features to make the model better. Acknowledge that in practice we try to improve the model, but the point is that even with a fixed model, the fairness criteria conflict.
  - People might question the data: "The model is biased because it's trained on biased data." This is valid, but the activity assumes the model is given. We can discuss in debrief that this is one layer, but even with unbiased data collection, the trade-offs might arise due to base rate differences.
  - Groups might get stuck on the numbers and spend too much time on calculations. Provide a worksheet with a template to compute the metrics.

  What the activity can't capture:
  - The proofs of the theorems.
  - Feedback loops (e.g., denying loans might affect future creditworthiness).
  - Causal aspects of fairness.
  - The possibility of building a better model with more data or features.

  Materials: Handout with the two tables for the loan scenario.

  Worksheet for each group to record their decisions and compute the metrics for each constraint.

  Time breakdown:
  - 10 min introduction
  - 40 min activity: 10 min for unconstrained, 10 min for each constraint (statistical parity, equalized FPR, equalized FNR), and 10 min for trying to satisfy multiple
  - 30 min debrief (10 min group reports, 15 min lecture on formal criteria and impossibility, 5 min limitations)

  Groups: 4-5 people per group, 4 groups total.

  Prompts:
  1. (Unconstrained) "Design decision rules (cutoffs) for Group A and Group B to minimize the overall number of errors (FP+FN)."
  2. (Statistical parity) "Now, can you make the denial rate the same for both groups? Try to get as close as possible."
  3. (Equalized FPR) "Now, can you make the false positive rate (rate of denying good customers) the same for both groups?"
  4. (Equalized FNR) "Now, can you make the false negative rate (rate of approving bad customers) the same for both groups?"
  5. (Multiple) "Can you satisfy two of these at the same time? Which ones? Can you satisfy all three without denying everyone or approving everyone?"

  Debrief outline:
  - Quick recap of the scenario.
  - Ask groups to share: 
     - What cutoffs did you choose for unconstrained? (likely Group A: medium, Group B: high or medium)
     - Were you able to achieve statistical parity? How? What trade-offs did you observe?
     - What about equalized FPR? How did it affect the error rates?
     - And equalized FNR?
     - Could you satisfy two or three at once?
  - Then introduce the formal names and the impossibility theorem.
  - Discuss real-world implications: fairness means different things to different people, and you have to choose.

  Final note: The activity uses a simplified model. In reality, you might have continuous scores and more flexibility, but the trade-offs remain when base rates differ.

  Let me know if you need the handouts and worksheet templates.
answer: |-
  ### Algorithmic Fairness Workshop: Experiencing the Impossibility Theorem  
  *Goal: Make participants feel the tension between fairness criteria through hands-on struggle.*

  ---

  ### **Scenario & Materials**  
  **Scenario:** Loan approvals with two demographic groups (Group A and Group B).  
  - **Base rates:**  
    - Group A: 30% "high-risk" (likely to default)  
    - Group B: 60% "high-risk"  
  - **Model output:** A pre-trained algorithm assigns each applicant a *risk score* (1–10). Scores are calibrated *within groups* (e.g., for Group A, 20% of people with score 3 default, 80% with score 8 default).  
  - **Decision rule:** Participants set a **risk threshold** for loan approval. Applicants above the threshold are denied.  

  **Materials (handout or spreadsheet):**  
  ```markdown
  | Group | Risk Score | % Applicants | Default Rate |  
  |-------|------------|--------------|--------------|  
  | A     | 1–3        | 30%          | 10%          |  
  | A     | 4–6        | 50%          | 30%          |  
  | A     | 7–10       | 20%          | 80%          |  
  | B     | 1–3        | 40%          | 20%          |  
  | B     | 4–6        | 30%          | 50%          |  
  | B     | 7–10       | 30%          | 90%          |  
  ```  
  - **Total applicants:** 200 (100 per group).  
  - **Key metrics to calculate:**  
    - **Approval rate:** % of applicants approved.  
    - **False positive rate (FPR):** % of *low-risk* applicants denied (unfair denial).  
    - **False negative rate (FNR):** % of *high-risk* applicants approved (unfair approval).  
    - **Calibration:** Does the default rate for a given risk score match across groups?  

  ---

  ### **Structure & Rules**  
  1. **Groups:** 4–5 teams (3–4 people each).  
  2. **Time:** 40 minutes for activity, 30 minutes for debrief.  
  3. **Phases:**  
     - **Phase 1 (Unconstrained):** *"Minimize total errors (FPR + FNR). Set one threshold per group."*  
       - Teams choose thresholds freely and calculate outcomes.  
     - **Phase 2 (Fairness Constraints):** *Introduce one fairness criterion at a time:*  
       - **Round 1:** *"Equalize approval rates (statistical parity)."*  
       - **Round 2:** *"Equalize false positive rates (predictive equality)."*  
       - **Round 3:** *"Equalize false negative rates (equal opportunity)."*  
       - **Round 4:** *"Maintain calibration: The default rate for a given risk score must be similar across groups."*  
     - **Phase 3 (Tradeoffs):** *"Satisfy any TWO criteria at once."*  

  ---

  ### **Sequence of Prompts**  
  1. **Kickoff (5 min):**  
     - *"You’re a loan officer. Using the data, set risk thresholds for Group A and Group B to minimize bad loans (high FNR) and maximize approvals (low FPR)."*  
  2. **Phase 1 (Unconstrained) (10 min):**  
     - Teams share initial thresholds (e.g., Group A: deny ≥4, Group B: deny ≥7).  
     - **Typical result:** Group B gets stricter thresholds (e.g., deny ≥7) due to higher base risk.  
  3. **Phase 2 (Fairness Constraints) (20 min):**  
     - **Round 1 Prompt:** *"Set thresholds so approval rates for A and B are equal."*  
       - Teams struggle. Example: To get 50% approval for both:  
         - Group A: Approve scores 1–6 (80% approval).  
         - Group B: Approve only scores 1–3 (40% approval). ➔ **FPR/FNR explode.**  
     - **Round 2 Prompt:** *"Equalize FPR (same % of low-risk applicants denied)."*  
       - E.g., Set FPR=10% for both:  
         - Group A: Deny all scores ≥4 (FPR=0% for low-risk, but misses target).  
         - Group B: Deny scores ≥4 (FPR=0% for low-risk). ➔ **FNR worsens for Group B.**  
     - **Round 3 Prompt:** *"Equalize FNR (same % of high-risk applicants approved)."*  
       - E.g., Set FNR=20% for both:  
         - Group A: Approve scores 1–6 (FNR=30%).  
         - Group B: Approve scores 1–3 (FNR=80%). ➔ **Impossible without unequal thresholds.**  
     - **Round 4 Prompt:** *"Ensure calibration: For score 4–6, default rates (30% vs. 50%) must match. Adjust thresholds to fix this."*  
       - **Reality check:** They can’t—the data itself violates calibration.  
  4. **Phase 3 (Tradeoffs) (5 min):**  
     - *"Now satisfy ANY TWO criteria. Which ones can you combine?"*  
     - Teams discover:  
       - Statistical parity + Equalized FPR ➔ FNR skyrockets for Group B.  
       - Calibration + Equalized FNR ➔ approval rates diverge.  

  ---

  ### **Debrief (30 min)**  
  1. **Group Reports (10 min):**  
     - Teams share: What felt "fair"? Where did they hit walls?  
  2. **Map to Formal Concepts (15 min):**  
     - **Statistical parity:** Equal approval rates. *Why it failed:* Base rates differ (30% vs. 60%), forcing unequal thresholds.  
     - **Equalized odds (FPR + FNR equality):** Impossible unless base rates match or the model is perfect (Chouldechova’s theorem).  
     - **Calibration:** Scores must predict risk equally across groups. *Why it failed:* The model is group-wise calibrated, but enforcing it *and* other criteria breaks everything.  
     - **Kleinberg et al. Impossibility:** You can’t satisfy all three (calibration, equal FPR, equal FNR) simultaneously. **Base rates are the root cause.**  
  3. **Key Insight:**  
     - "Fairness" isn’t a single target—it’s a set of conflicting goals. You *must* choose which fairness criterion to prioritize, and it *will* harm others.  

  ---

  ### **Predictably Goes Wrong (And How to Handle It)**  
  1. **"The Spoiler":**  
     - *Risk:* A participant who knows the theorem declares, "This is impossible!"  
     - **Mitigation:** Assign them as a "facilitator" to ask probing questions ("What makes this hard?") without solving it.  
  2. **Avoiding Tradeoffs:**  
     - *Risk:* Teams say, "Just collect better data!" or "Add more features."  
     - **Mitigation:** Gently enforce constraints: *"Assume this is the only data you have. Work with it."*  
  3. **Data Bias Debates:**  
     - *Risk:* "The data is biased—we shouldn’t use it!"  
     - **Mitigation:** Acknowledge validity, but pivot: *"Yes, real data is biased. But even with unbiased data, would base rates still cause conflicts?"*  
  4. **Analysis Paralysis:**  
     - *Risk:* Teams get stuck calculating metrics.  
     - **Mitigation:** Provide a calculator spreadsheet or pre-made tables.  

  ---

  ### **What the Activity Can’t Capture**  
  1. **Proofs & Edge Cases:**  
     - Participants experience *tension*, not formal proof. The theorem’s math (e.g., Bayes’ theorem underpinning base-rate conflicts) is omitted.  
  2. **Real-World Complexities:**  
     - Feedback loops (e.g., denying loans reduces credit scores), causality, or measurement bias.  
  3. **Optimal Solutions:**  
     - The activity focuses on impossibility, not Pareto-efficient tradeoffs.  

  ---

  ### **Why This Works**  
  By wrestling with concrete tradeoffs (e.g., "If I lower FNR for Group B, FPR for Group A explodes"), participants *feel* the impossibility theorem. It shifts from an abstract "neat result" to a visceral insight: **You can’t optimize for everyone’s idea of fairness at once.** Engineers leave understanding that "fairness" requires explicit, ethical choices—not just technical fixes.
