  Finkish cases involve the disposition disappearing as soon as the stimulus is applied. Martin's example: a sorcerer protects a fragile glass by making it non-fragile when struck. So the glass is fragile, but when struck, the sorcerer instantly changes it, so it doesn't break. Masking is different—like a poison pill coated to prevent dissolution. The disposition is still there, but something external blocks the manifestation.

