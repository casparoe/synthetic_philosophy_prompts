  ### Preamble
  This quiz helps you discover your implicit views on higher-order evidence—information about the quality of your own evidence. You'll encounter scenarios where a person learns something that casts doubt on their reasoning (e.g., "You might be impaired" or "Experts disagree with you"). For each, choose what you think they rationally ought to believe. Avoid overthinking; select what feels right. The quiz uses no technical jargon—just everyday dilemmas. After completing it, you'll receive a classification of your view. Remember: real philosophical positions are nuanced, so this is a diagnostic tool, not a final verdict.

