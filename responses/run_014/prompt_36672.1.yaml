  Okay, let me start by unpacking this user's query. They're a PhD student in economics, specifically in social choice and decision theory, and they've been attending a value theory seminar. The core debate they're frustrated with is whether "better than" is transitive. Economists assume transitivity for practical tools like money pump arguments and representation theorems, but philosophers present spectrum arguments that challenge this. 

  The user mentions two main camps: Temkin/Rachels who argue betterness isn't transitive, and Broome's side which insists it must be, comparing it to "longer than." The user notes that responses to spectrum cases are repetitive—denying strict preference in small steps, questioning endpoint intuitions, or distinguishing betterness from other relations. They're frustrated that the debate hasn't progressed since the 90s.

  Their main question isn't about who's right but diagnosing the nature of the disagreement. They propose a hypothesis: economists focus on rational choice while Temkin's side looks at the world's evaluative structure, leading to a terminological stretch. But they're unsure because Broome's metaphysical claims complicate this.

  I need to address their hypothesis and provide a deeper diagnosis. Let me break down the key elements. First, the user's hypothesis about two different relations seems plausible. Economists are concerned with choice behavior and consistency, hence transitivity is necessary to avoid money pumps. Philosophers like Temkin are examining axiological evaluations independent of choice, where small differences might aggregate in non-transitive ways. 

  But Broome's analogy to "longer than" suggests a stronger claim—that betterness is inherently transitive, like length comparisons. This isn't just about choice but about the nature of value. So the disagreement might be substantive. Temkin is arguing that our actual evaluative judgments don't align with transitivity when faced with spectra, implying a feature of the world's structure. Broome counters that such non-transitivity is conceptually incoherent.

  The user asks what would count as progress. Formal results haven't resolved it because both sides interpret them differently. A cleaner separation of relations might help, but Broome explicitly rejects reducing betterness to choice. Clarifying the core question—whether axiology must be action-guiding—could be key. If axiology is about reasons for choice, transitivity might be necessary. If it's about impersonal value, spectra might show non-transitivity.

  The impasse might stem from differing starting points. Economists prioritize coherence in decision-making, while philosophers explore intuitive judgments. Recognizing this could reframe the debate. Progress might involve interdisciplinary dialogue or exploring meta-axiological questions. Ultimately, the difficulty lies in balancing conceptual coherence with phenomenological accuracy, making it a genuinely hard problem rather than a confused one.
answer: |-
  Your frustration is palpable and entirely justified – this is one of the most entrenched debates in value theory. Your working hypothesis is insightful, but I think the reality is even messier, involving layers of disagreement. Here's a diagnosis, drawing directly from the arguments and methodologies of each side:

  **Diagnosis: A Multi-Layered Impasse**

  1.  **Verbal/Conceptual Core Disagreement ("What is 'Betterness'?")**:
      *   **Broomean View (Transitivists):** They treat "A is better than B" as expressing a *fundamental, objective, comparative relation* akin to "longer than" or "heavier than." For them, transitivity is part of the *concept* of "betterness." Denying it is like denying that "taller than" is transitive – it renders the concept incoherent. Their analogy to physical comparisons is meant *metaphysically*, not just pragmatically. They see the spectrum arguments as revealing a *conceptual confusion* in our intuitions, not a flaw in the concept itself. Their target is the *nature of value* itself, which they believe must have a transitive structure to be coherent.
      *   **Temkin/Rachels View (Non-Transitivists):** They treat "A is better than B" as expressing a *judgment* we make based on our evaluative capacities and responses. Spectrum arguments reveal that these judgments, applied consistently step-by-step, lead to an intransitive *pattern*. They argue that the *phenomenon of value* (as we experience and judge it) simply doesn't map neatly onto a transitive ordering, especially when dealing with small differences, incommensurability, or complex multi-dimensional changes. For them, insisting on transitivity *despite* these arguments is imposing an artificial, unrealistic structure on value. Their target is the *structure of our actual evaluative practices and experiences*.

      **Conflict:** This *is* fundamentally verbal/conceptual at its root. **The two sides are using "better than" with different implicit definitions: one prescriptive/conceptual/metaphysical (Broome), the other descriptive/psychological/phenomenological (Temkin).** Broome is defining "betterness" as a relation that must, by its very nature, be transitive. Temkin is investigating the properties of the relation we *call* "betterness" when we make actual evaluations, finding it sometimes intransitive. They are talking past each other *at this foundational level*.

  2.  **Substantive Disagreement ("What is the Structure of Value/Axiology?")**:
      *   **Broomean View:** If we accept their conceptual starting point, then the substantive claim is that value *must* form a transitive ordering. Any apparent counterexample (like the spectrum) *must* be explained away by a misapplication of the concept (e.g., confusing "not worse than" with "better than," confusing evaluative categories, misjudging endpoints, or illicitly aggregating small differences). The substantive reality of value is transitive.
      *   **Temkin/Rachels View:** If we accept their descriptive starting point, then the substantive claim is that value itself (as we access and reason about it) has a non-transitive structure. Spectrum arguments aren't tricks; they are revealing a genuine feature of the evaluative landscape, perhaps due to vagueness, context-dependence, or the nature of aggregation across dimensions (like pain intensity vs. duration). The substantive reality of value (as we engage with it) is non-transitive in certain cases.

      **Conflict:** This *is* substantive, but it's built *on top of* the verbal/conceptual disagreement. **The substantive disagreement is about *which initial conception of "betterness" accurately captures the nature of value or our core evaluative relation*.** Broome thinks his conception captures the necessary structure of normativity. Temkin thinks his conception better reflects how evaluation actually works in the world we inhabit.

  3.  **Upstream Disagreement ("What is the Purpose of Axiology?")**:
      *   **Economist/Decision-Theoretic Priority (Implied by your tools):** Axiology must serve *rational choice*. Its primary function is to guide action coherently. Transitivity is non-negotiable to avoid money pumps, ensure consistent choice, and underpin welfare economics. If an "axiology" isn't action-guiding in a coherent way, it's failing its core job. This aligns strongly with Broome's conceptual view.
      *   **Broomean Priority:** While *connected* to rational choice, their claim is stronger: the transitivity of "better than" is a *metaphysical* truth about value itself, independent of its role in choice. Choice *should* track it because it's true.
      *   **Temkin/Rachels Priority:** Axiology's primary job is to *accurately describe and reflect our evaluative landscape*, even if that landscape is messy and sometimes leads to patterns inconsistent with perfect rational choice models. We shouldn't *distort* our understanding of value to fit a preconceived model of rationality; we should adjust our models of rationality to fit value. The "upstream" question for them is: **"Must axiology be *definable* solely in terms of its implications for *binary choice* under certainty?"** They implicitly answer "no."

      **Conflict:** This is the crucial upstream battle. **Is the primary purpose of axiology to be the *foundation for coherent rational choice* (demanding transitivity), or is it to provide the *most accurate possible map of evaluative relations* as we find them (which may be messy)?** Broome and economists prioritize the former; Temkin prioritizes the latter. This explains why spectrum arguments feel like "cheap tricks" to economists/Broome (they violate a core requirement for the tool to work) and like devastating revelations to Temkin (they show the tool doesn't fit the material).

  **Why the Impasse? Why No Movement?**

  1.  **Different Foundational Commitments:** Each side starts from a different bedrock assumption about the nature of "betterness" (conceptual necessity vs. descriptive accuracy). Arguments are interpreted through these lenses.
  2.  **Different Standards of Success:** For Broome/economists, success is preserving conceptual coherence and avoiding money pumps. For Temkin, success is capturing the full complexity of intuitive evaluative judgments, even if it sacrifices neatness. A "solution" satisfying one standard often violates the other.
  3.  **Spectrum Arguments are Robust:** They are powerful thought experiments that genuinely expose a tension. Neither side's standard menu responses fully satisfy the other because they don't address the core commitments. Denying strict small differences can feel ad hoc. Questioning endpoints feels like avoiding the problem. Introducing new relations ("not worse than," "excellence") feels like changing the subject from "better than."
  4.  **Different Tolerances for Paradox:** Broome/economists see intransitivity as a fatal *contradiction* to be eliminated at all costs. Temkin sees it as a *surprising feature* to be acknowledged and explained within a more complex model. They have different thresholds for accepting "messiness."

  **What Would Count as Progress?**

  1.  **Explicit Meta-Axiological Agreement (Unlikely but Ideal):** Getting both sides to explicitly agree on:
      *   **Q1:** Are we analyzing the *concept* "better than" (implying necessary properties) or the *relation we apply* when we call things better?
      *   **Q2:** Is the primary purpose of this inquiry to serve as a foundation for *rational choice* or to provide the *most descriptively accurate map of evaluation*?
      *   **Q3:** Can these potentially be *different relations* (e.g., "choice-better" vs. "evaluative-better")?
      This wouldn't resolve the substantive debate but would clarify *what* is being debated.
  2.  **Formal Results with New Interpretations:** Results showing that certain types of non-transitivity (e.g., semi-orders, interval orders) *can* be incorporated into models of rational choice under uncertainty or resource limitations, avoiding money pumps in more realistic settings. This might loosen the economist's *necessity* claim for strict transitivity in *all* rational choice contexts, offering Temkin a way to accommodate spectra without abandoning rationality. Conversely, a compelling formal model showing that *any* persistent non-transitivity *inevitably* leads to exploitable inconsistency under plausible assumptions would strengthen Broome/economists.
  3.  **Clarifying the "Aggregation Mistake":** Broomeans often accuse spectrum arguments of illicitly aggregating tiny differences. Progress might involve a rigorous formal analysis of *exactly what aggregation principle* is being assumed and why it's deemed faulty, moving beyond hand-waving. Can the intuition behind the spectrum be captured *without* relying on the contested aggregation principle? If not, does that strengthen Broome or just highlight the gulf?
  4.  **Phenomenology of Small Differences:** Deepening the empirical/psychological investigation: *Do* we genuinely make strict "better than" judgments between adjacent members of a finely grained spectrum? Or are these steps better characterized as indifference or indeterminacy? This could challenge the empirical premise of the spectrum argument. (Though Temkin might argue this just pushes the problem into defining the boundaries of indifference).
  5.  **Embracing the Difficulty:** Recognizing that **this *is* a genuinely hard problem** at the intersection of metaphysics, logic, decision theory, and phenomenology. The impasse reflects the deep tension between our desire for evaluative coherence (transitivity) and the complexity/fuzziness we encounter in actual evaluation (spectra). Progress might involve both sides acknowledging the genuine pull of the other's position and the limitations of their own standard responses.

  **Conclusion:**

  Your working hypothesis is largely correct: economists (and Broome) are focused on **rational choice coherence**, while Temkin is focused on **evaluative structure/phenomenology**. This *does* create a terminological stretch. However, Broome's "longer than" analogy pushes it beyond mere choice; he stakes a claim about the **metaphysical necessity** of transitivity for the concept of betterness itself. This elevates it from a pragmatic requirement to a conceptual truth.

  **Therefore, the disagreement is simultaneously:**

  *   **Verbal/Conceptual:** What does "better than" fundamentally *mean*? (Necessarily transitive relation vs. pattern of evaluative judgments).
  *   **Substantive:** Does value *have* a transitive structure? (Yes, necessarily vs. No, as evidenced by spectra).
  *   **Upstream:** What is the *primary purpose* of axiology? (To ground coherent choice vs. to map evaluative reality).

  **Progress seems most likely along paths that either:**

  1.  **Formalize and soften the choice coherence requirements** to accommodate plausible non-transitivities without collapse (challenging the *necessity* claim for strict transitivity in practice).
  2.  **Forge a clearer separation** between "choice-relevant betterness" (which *must* be transitive to avoid exploitation) and "evaluative betterness" (which might exhibit non-transitivity in spectra), *and* then argue about which one deserves the label "better than" or if both are valid concepts. Broome would likely resist this separation, seeing it as conceding that true betterness isn't transitive.
  3.  **Provide a decisive analysis of the aggregation step** in spectrum arguments that one side *must* accept.

  Until one of these happens, or a genuinely new argumentative strategy emerges, the impasse is likely to persist. It's not *just* confusion; it's a deep clash between powerful intuitions about coherence and powerful intuitions about the complexity of value. The frustration is the sound of two fundamentally different philosophical methodologies grinding against each other.
