  ### Decision Procedure for Random Chord Sampling in Circular Cross-Sections

  **Objective**: Determine a defensible Monte Carlo sampling scheme for random chords in a circular region based on the physical generating mechanism. If no unique scheme exists, bracket the probability across plausible measures and specify data needed to collapse the bracket.

  **Input**: Physical scenario description (e.g., crack, scratch, fault path) and available mechanistic details.  
  **Output**: A specific sampling method, custom simulation, or bracketed probability range with data requirements.  
  **Time Limit**: 15 minutes.  
  **Core Principle**: Prioritize mechanism-driven sampling over symmetry; use symmetry only when mechanisms are ambiguous. Default to bracketing when mechanisms are unknown or conflicting.

  ---

  ### Procedure Steps  
  *(Analysts answer sequentially; stop at first definitive verdict or Step 5.)*

  1. **Mechanism Fully Known?**  
     - **Question**: Can the physical process generating the chord be directly simulated?  
       - *Sufficient answer*: Detailed parameters are known (e.g., crack nucleation follows a documented stress model; tool-drop height/orientation has measured distributions).  
     - **Verdict**:  
       - **Yes** → Simulate the mechanism directly (e.g., sample nucleation sites from client data, propagate cracks via fracture mechanics). Document as "Direct mechanism simulation."  
       - **No** → Proceed to Step 2.  
     - **Kill early**: If simulation is feasible, use it. Avoids philosophical ambiguity.

  2. **Boundary-Initiated Process?**  
     - **Question**: Does the chord start at the boundary and propagate inward? (e.g., fatigue crack at weld circumference).  
       - *Sufficient answer*: Physical description confirms boundary initiation (e.g., "crack nucleates at weld edge").  
     - **Verdict**:  
       - **Yes** → Proceed to Subquestions.  
       - **No** → Proceed to Step 3.  
     - **Subquestions (must both hold)**:  
       - a. *Uniform Start?*: Is the nucleation point uniformly distributed on the circumference?  
       - b. *Uniform Propagation?*: Is the propagation direction uniform relative to the local tangent/normal?  
     - **Verdict**:  
       - **Both yes** → Use **endpoint method** (sample two points uniformly on circumference). Justification: Matches geometry of radial growth from boundary.  
       - **One/both no, but distributions known** → Simulate with provided distributions.  
       - **Distributions unknown** → Proceed to Step 5 (bracket).  

  3. **Whole-Plane Uniform Line?**  
     - **Question**: Is the chord a "global" line segment with uniform position/orientation in the plane? (e.g., scratch from a dropped tool).  
       - *Sufficient answer*: Mechanism implies uniform randomness over the entire plane (e.g., "tool position/orientation is arbitrary").  
     - **Verdict**:  
       - **Yes** → Use **direction-offset method** (sample direction θ ~ Uniform[0, π); perpendicular distance d ~ Uniform[0, r]). Justification: Matches invariant measure for lines in the plane (dθ dd).  
       - **No, but distributions known** → Simulate with provided distributions.  
       - **Distributions unknown** → Proceed to Step 5 (bracket).  

  4. **Midpoint-Determined Chord?**  
     - **Question**: Is the chord defined by a midpoint chosen inside the circle? (e.g., "impact center" models).  
       - *Sufficient answer*: Explicit midpoint-based mechanism (e.g., "crack radiates from a central flaw").  
     - **Verdict**:  
       - **Yes, midpoint uniform** → Use **midpoint method** (sample midpoint uniformly in disk; chord perpendicular to radius).  
       - **No** → Proceed to Step 5 (bracket).  

  5. **No Principled Choice (Bracketing)**:  
     - **Verdict**:  
       - Compute probabilities via the three classic methods:  
         - Endpoint method (P₁).  
         - Direction-offset method (P₂).  
         - Midpoint method (P₃).  
       - Report probability in range [min(P₁, P₂, P₃), max(P₁, P₂, P₃)]. For the *standard event* (chord > √3r): **[0.25, 0.50]**.  
       - **Deliverable to client**:  
         > "The probability of the event ranges from [min] to [max] due to ambiguity in the generating mechanism. This bracket covers all physically plausible interpretations of 'random.' To narrow it, provide data on: [specific missing data]."  
       - **Key mitigation**: Specify data to collapse the bracket (e.g., "crack nucleation distribution" or "tool-drop height profile").

  ---

  ### Worked Applications  

  #### Case (a): Fatigue crack at weld circumference  
  - **Step 1**: Mechanism not fully simulable (no fracture model) → Proceed.  
  - **Step 2**: Boundary-initiated (yes).  
    - Subquestions:  
      - Uniform start? (Yes, "random point on circumference").  
      - Uniform propagation? (Yes, "propagates inward" + "random" implies direction uniformity).  
  - **Verdict**: **Endpoint method** (P = 1/3 for standard event).  

  #### Case (b): Scratch from dropped tool  
  - **Step 1**: Not fully known (no drop dynamics) → Proceed.  
  - **Step 2**: Not boundary-initiated (no) → Step 3.  
  - **Step 3**: Whole-plane uniform (yes, "position/orientation uniform").  
  - **Verdict**: **Direction-offset method** (P = 1/2 for standard event).  

  #### Case (c): Unknown crack in composite  
  - **Step 1**: Mechanism unknown → Proceed.  
  - **Step 2**: Boundary-initiated? Unknown → Step 3.  
  - **Step 3**: Whole-plane? Unknown → Step 4.  
  - **Step 4**: Midpoint-determined? Unknown → **Step 5 (bracket)**.  
    - **Verdict**: P ∈ [0.25, 0.50] for standard event.  
    - **Deliverable**:  
      > "Probability of severing safety zone: 25–50%. To narrow, provide crack-nucleation data or propagation physics."  

  ---

  ### Annotation: Steps vs. Judgments  
  - **Determinate tests (mechanism-driven)**:  
    - Step 1 (known mechanism), Step 2a/b (boundary uniformity), Step 3 (whole-plane), Step 4 (midpoint).  
    *Output is fixed if answers are sufficient.*  
  - **Judgment calls (symmetry-driven)**:  
    - Assuming "uniform propagation" (Step 2b) or "uniform position" (Step 3) when client says "random" without details.  
    - **Mitigation**: Document assumptions explicitly (e.g., "assumed uniform propagation per rotational symmetry").  
  - **Philosophical choice**: Occurs only in Step 5 (bracketing). Analysts *must* disclose: "No unique 'random'; used Bertrand-classic measures."  

  ---

  ### Limitations  
  - **Invariance arguments**: Not used. Rotational symmetry is satisfied by all three classic methods; translational/scaling symmetries are broken by the circle. Invariance cannot resolve ambiguity.  
  - **Conflicting symmetries**: If physical symmetries conflict (e.g., rotational vs. translational), the procedure defaults to Step 5 (bracket).  
  - **Non-circular regions**: Procedure valid only for circles (symmetry assumptions fail otherwise).  
  - **Event-specificity**: Bracketing in Step 5 requires recomputing P₁, P₂, P₃ for non-standard events (e.g., "sever safety zone" vs. "> √3r").  

  ---

  ### Documentation Protocol  
  For each analysis, record:  
  1. **Mechanism assumption**: (e.g., "boundary-initiated with uniform propagation").  
  2. **Chosen method/range**: (e.g., "endpoint method, P=0.33" or "P ∈ [0.25, 0.50]").  
  3. **Physical falsifier**: (e.g., "invalid if cracks nucleate preferentially at weld flaws").  
  4. **Audit trail**: Answers to procedure questions (1–2 sentences).  

  *Example*:  
  > "Fatigue crack (Case a): Boundary-initiated. Uniform start/propagation assumed per client 'random' description. Endpoint method (P=0.33). Falsified if propagation direction correlates with stress hotspots."  

  ---

  ### Final Compliance Test  
  - **Two analysts, same scenario**:  
    - With identical inputs, they will:  
      - Match on Steps 1–4 (determinate with sufficient answers).  
      - Match on Step 5 (same bracket/computation).  
    - Differences only if mechanistic interpretations diverge (documented as judgments).  

  **Run this on Monday**. No philosophy—just mechanics, symmetries, and brackets.
