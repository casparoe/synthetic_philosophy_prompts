reasoning: |-
  Okay, the user is sharing a really personal and uncomfortable situation. They hooked up with someone who lied about being recently tested for STIs and being single—turns out the test was a year old and he's still living with his ex. The user feels violated because they wouldn't have consented if they'd known the truth. Now they're spiraling, questioning whether their consent was invalidated by these lies and where the ethical line is.

