answer: |-
  That is absolutely not awkward for *you* to feel weird about – **his lies are the problem here, not your reaction.** You're spiraling because this is a genuine violation of trust and informed consent. Let's break it down:

  1.  **These weren't "little lies":** He lied about two **major, material facts** directly relevant to your decision to have sex:
      *   **"Clean" (Recent STI Test):** Saying he was "just tested" implies recent results showing current STI status. A test from a year ago is completely irrelevant and deceptive. STI status is a *core component* of informed consent for sexual activity. Lying about it fundamentally changes the risk assessment you were able to make.
      *   **"Single":** He presented himself as unentangled and available. Still living with an ex (especially if there's ambiguity or ongoing involvement) is a significant relationship status that many people would absolutely factor into their decision about a hookup. It involves emotional entanglement, potential for drama, and possibly even ethical concerns depending on the ex's understanding.

  2.  **Yes, this likely invalidates your *informed* consent:** Consent isn't just saying "yes" to sex. **Informed consent means agreeing based on accurate and relevant information.** You agreed to sex under specific conditions he presented: low STI risk and no current romantic entanglement.
      *   You did NOT agree to sex under the *actual* conditions: unknown/potentially higher STI risk and involvement with an ex he lives with.
      *   Your "yes" was obtained under false pretenses regarding factors that reasonably impact the decision. **Consent based on significant deception is not fully informed or valid consent.**

  3.  **Where's the line? (Materiality is Key):** You're right, not *every* lie undoes consent. The line is often drawn at **materiality**:
      *   **Material Lies:** Lies about things that would *reasonably* cause someone to decline sex if they knew the truth. **STI status and current significant relationships are CLASSIC examples of material facts.** Lying about age (if it involves legality or a major power imbalance), fertility status (if relevant), identity, or hiding a camera would be others.
      *   **Immaterial Lies:** Lies that wouldn't reasonably change someone's decision in that context (e.g., lying about your job title on a dating app before a casual hookup where that wasn't discussed, exaggerating your gym routine). These are still dishonest and crummy, but they don't necessarily invalidate consent in the same fundamental way regarding the *nature of the act itself*.

  4.  **Your Feelings Are Valid:**
      *   **Violated:** You were misled about core risks and circumstances.
      *   **Angry/Betrayed:** He deliberately deceived you to get what he wanted.
      *   **Anxious/Spiraling:** Uncertainty about health risks (STIs) and the emotional weirdness of the situation is completely understandable.
      *   **Questioning:** Wondering "what did I consent to?" is a natural reaction to deception.

  **What to Do Now:**

  1.  **Prioritize Your Health:**
      *   **Get STI Tested:** Do this ASAP and follow up as recommended (some tests need a window period). Be honest with your healthcare provider about the situation. *Do not rely on his word or that year-old test.*
  2.  **Cut Contact:** Block him. You don't owe him explanations, confrontation, or access to you. He violated your trust.
  3.  **Don't Blame Yourself:** This is 100% on him. You made a decision based on the information *he provided*. You are not stupid or at fault for believing someone lied to you.
  4.  **Talk to Someone:** Confide in a trusted friend, family member, or counselor. Processing the violation and anxiety is crucial. If the spiraling continues or impacts your daily life, professional support can be very helpful.
  5.  **Define Your Boundaries:** This experience clarifies what *you* need to know for future informed consent. Use that knowledge moving forward.

  **Bottom Line:** His lies about his STI status and relationship situation were significant, material deceptions directly related to your decision to have sex. Your "yes" was based on false information he provided. This absolutely calls the validity of your *informed* consent into question and justifies your feelings of violation and anger. Your reaction is completely normal and understandable. Focus on your health, well-being, and surrounding yourself with support.
