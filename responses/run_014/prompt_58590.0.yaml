prompt: |-
  I am a novelist invited to lead a ninety minute craft session for eighteen adult fiction writers with no formal training in philosophy. My purpose is practical: I want participants to leave with a more precise repertoire for rendering characters whose emotional lives diverge from what those characters avowedly believe.

  Please design a complete participatory exercise that allows the group to feel from the inside the force of three competing accounts of what emotions are: emotions as evaluative judgments, emotions as perceptions of value on the model of sensory perception, and emotions as patterns of bodily feeling and readiness to act.

  Build the exercise around the following three invented cases, presented in plain language suitable for nonphilosophers. First, a cellist who sincerely judges that her late husband did nothing wrong in his final year and takes herself to have forgiven him, yet each evening is overtaken by grief tinged with anger as if she had been wronged. Second, a hiker who judges with full confidence that a glass walkway over a gorge is safe and can explain the engineering behind that confidence, yet freezes in terror when stepping onto it. Third, a juror who judges that a defendant has done something truly contemptible and can defend that evaluation at length, yet reports feeling entirely flat and unmoved when facing the defendant in person.

  Provide a detailed facilitation plan with timing for each phase, grouping, materials needed, and wording of instructions that can be read aloud without prior lecture and without introducing technical terminology until the end. The central task should involve writing or revision decisions and bodily or interactive elements, so that the philosophical difference emerges from what participants do and from the difficulty of revising the emotion by revising the judgment.

  Conclude with a debrief that maps specific moments in the activity onto the differences among the three accounts, with particular attention to what each account predicts about whether and how the emotion should change if the underlying evaluation changes. Add a candid note on what is likely to go wrong on a first run with writers resistant to abstraction and how to handle it, and a clear statement of which aspect of the disagreement the activity cannot reproduce and must be supplied by discussion.
reasoning: |-
  We are designing a 90-minute participatory exercise for writers to experience three theories of emotion through character cases. The goal is to give them practical tools for depicting emotional complexity.

  The three theories:
  1. Emotions as evaluative judgments (e.g., to feel angry is to judge that one has been wronged).
  2. Emotions as perceptions of value (like sensory perceptions, they can be recalcitrant - e.g., feeling fear even when you judge there's no danger).
  3. Emotions as patterns of bodily feeling and readiness to act (e.g., fear as a racing heart and an urge to flee).

  We have three cases:
  A. The cellist: judges she has forgiven her late husband but experiences grief-tinged anger.
  B. The hiker: judges the walkway is safe but freezes in terror.
  C. The juror: judges the defendant is contemptible but feels flat when facing him.

  Structure of the session:
  - Introduction (5 min)
  - Case Rotation in Small Groups (45 min total: 15 min per case, 3 groups rotating through each case)
  - Group Sharing and Debrief (25 min)
  - Connecting to Theories and Writing Application (15 min)

  Materials needed:
  - Three large posters, each with one case written at the top and three columns labeled: 
     Column 1: "What the character judges (evaluation)"
     Column 2: "What the character feels (bodily/action tendency)"
     Column 3: "What the character perceives (if different from judgment?)"
  - Markers for each group.
  - Index cards for participants to write revision attempts (one set per group per case).
  - Timer.

  Detailed Facilitation Plan:

  0. Preparation (before session):
     - Set up three stations, each with a poster for one case and markers.
     - Divide participants into three groups (6 per group).

  1. Introduction (5 minutes):
     - "Welcome! As writers, we know that characters often feel things that don't align with what they think they should feel. Today we're going to explore that gap through three character scenarios. We'll work in groups to get inside these characters and then think about how to write such moments. There's no philosophy lecture - we'll jump right in and reflect at the end."

  2. Case Rotation (45 minutes total, 15 minutes per case):
     - Instructions: "Each group will start at one case. You'll have 15 minutes per case. For each case, do two things:
          (a) As a group, fill in the three columns on the poster. 
              - Column 1: What the character judges (the evaluation they hold consciously). 
              - Column 2: What they feel in their body and what they are pulled to do (e.g., in the juror case, he might feel a blankness, a lack of energy, no urge to act).
              - Column 3: What they perceive (if it's different from judgment). For example, the hiker might perceive the walkway as dangerous even though they judge it safe.
          (b) Then, take an index card and write a brief revision of the scene that tries to change the emotion by changing the judgment. For example, for the cellist: what if she were to change her judgment about her husband? Would that change her emotion? Try a rewrite that alters the judgment and see if the emotion shifts. Note: You might find it easy or hard to shift the emotion by changing the judgment. That's the point! We'll talk about why later."

     - Rotate groups every 15 minutes (use a timer). Each group will do all three cases.

  3. Group Sharing (25 minutes):
     - Bring everyone together. For each case, ask one group to share their poster and revision attempt. Then ask other groups if they had different takes. Focus on:
          - What did they put in the columns?
          - How easy was it to change the emotion by changing the judgment? What happened when they tried?
          - Did the bodily feeling or perception change? How?

     - Example prompts:
          Case A (cellist): "Did changing her judgment (say, to 'he did wrong') make the grief-tinged anger go away? Or did it just change the anger? What about if she changed to 'he was perfect'? Did the evening feelings shift?"
          Case B (hiker): "If the hiker changes their judgment to 'this is dangerous', does the terror go away? Or does it become appropriate? What if they change to 'this is safe and fun'? Did the bodily feeling change in the rewrite?"
          Case C (juror): "If the juror changes their judgment to 'this defendant is innocent', does the flatness lift? Or if they change to 'this defendant is a monster', does that create feeling? What did you try?"

  4. Debrief: Connecting to the Three Theories (15 minutes):
     - "Now let's step back and see what we've experienced. In philosophy, there are three main ways to think about emotions. We've been playing with them without the jargon. Let me name them now and connect to your work."
          a. Emotions as judgments: If emotion is just a judgment, then changing the judgment should immediately change the emotion. But in the cases, we often found it hard to change the emotion by changing the judgment. (Point to examples where the rewrite didn't shift the feeling.)
          b. Emotions as perceptions: Like seeing an optical illusion, you might perceive the walkway as dangerous even when you know it's safe. Changing the judgment doesn't change the perception. (Point to the hiker case.) Similarly, the cellist might perceive her husband as having wronged her even though she judges he didn't. The emotion might not change until the perception shifts.
          c. Emotions as bodily feelings and action tendencies: The juror's flatness is a bodily state (lethargy) and lack of action tendency. Changing the judgment might not affect the body. Or, in the hiker, the terror is a bodily state (freezing) that doesn't change just because the judgment does.

     - Highlight predictions:
          - Judgment theory: Change the judgment, the emotion should change immediately and completely.
          - Perception theory: The emotion might persist even after the judgment changes because it's a perception. It might require a different kind of intervention (e.g., exposure, new evidence).
          - Bodily feeling theory: The emotion is tied to the body. To change it, you might need to change the bodily state (e.g., deep breathing for fear, or a shock to jolt the juror).

     - Writing application: "In your writing, if you want to show a character whose feelings don't match their thoughts, you can use these insights. For example:
          - The cellist: Her judgment and perception are at odds. You might write her inner monologue saying one thing while her body reacts with another.
          - The hiker: Show the bodily terror even as the character recites engineering facts.
          - The juror: Describe the flatness in the body and lack of impulse, despite the strong judgment.

  5. Candid Note on Challenges:
     - What might go wrong: Writers may resist the abstract structure of the exercise. They might want to dive into storytelling and character development rather than filling out columns. The revision task might feel forced. Some groups might get stuck on one case and not rotate well. The bodily/perception distinction might be blurry.
     - How to handle: Emphasize the practical goal: "This is a tool to help you write more precisely. The columns are just a way to break down the emotion." Keep the timing strict. During sharing, focus on concrete examples. If they get stuck on the perception column, ask: "What does the character see/hear/sense that contradicts their judgment?" 

     - What the activity cannot reproduce: The activity focuses on the relationship between judgment and emotion, but it doesn't capture the full philosophical debate about which theory is correct. Also, the activity doesn't show how emotions might be changed by non-cognitive means (e.g., therapy, medication, time). We must discuss that the theories have different implications for how emotions can be changed and how long that takes.

  Total time: 5+45+25+15 = 90 minutes.

  Now, let's write the exact wording for the posters and instructions.

  Poster for Case A (cellist):
    Title: The Cellist
    Description: "A cellist sincerely judges that her late husband did nothing wrong in his final year and takes herself to have forgiven him. Yet each evening, as she plays, she is overtaken by grief tinged with anger as if she had been wronged."
    Columns:
      1. What she judges: [blank]
      2. What she feels (bodily/action): [blank]
      3. What she perceives (if different): [blank]

  Poster for Case B (hiker):
    Title: The Hiker
    Description: "A hiker judges with full confidence that a glass walkway over a gorge is safe and can explain the engineering behind that confidence. Yet when stepping onto it, they freeze in terror."
    Columns:
      1. What they judge: [blank]
      2. What they feel (bodily/action): [blank]
      3. What they perceive (if different): [blank]

  Poster for Case C (juror):
    Title: The Juror
    Description: "A juror judges that a defendant has done something truly contemptible and can defend that evaluation at length. Yet when facing the defendant in person, they report feeling entirely flat and unmoved."
    Columns:
      1. What they judge: [blank]
      2. What they feel (bodily/action): [blank]
      3. What they perceive (if different): [blank]

  Instructions for the revision task (on index card): 
     "Try to change the character's emotion by changing their judgment. Write a brief revision (1-2 sentences) of the scene where the character holds a new judgment. Then note: does the emotion change? If so, how? If not, why not?"

  Example of what groups might write:
     For the cellist: 
        Original judgment: "He did nothing wrong; I have forgiven him."
        New judgment in revision: "Actually, what he did was terrible and selfish."
        Revision: "As she plays, she thinks about how he betrayed her trust. She feels a surge of anger, but then a wave of grief that he's gone and they never resolved it."
        Emotion change? Anger becomes more prominent, but grief remains. The bodily feeling might intensify.

  Debrief mapping:
     - Cellist case: 
          Judgment theory: Changing the judgment to "he did wrong" should resolve the conflict (anger becomes appropriate) but the grief might remain. However, the anger might not go away even if she changes her judgment to "he did nothing wrong" again? This shows the recalcitrance (perception theory) or bodily persistence.
     - Hiker case:
          Judgment theory: If the hiker judges it safe, fear should vanish. But it doesn't. Perception theory: The walkway still looks dangerous. Bodily: The fear is a bodily response that might need time to subside.
     - Juror case:
          Judgment theory: If the juror judges the defendant contemptible, they should feel contempt. But they don't. Bodily: The flatness is a bodily state that might be due to fatigue or desensitization. Changing the judgment to "innocent" might not create feeling, but changing to "monster" might if it triggers a bodily response.

  This exercise should help writers see the three theories in action and give them tools for writing emotional complexity.
answer: |-
  ### Complete Participatory Exercise: Emotion-Junction Workshop

  **Materials Needed:**
  - 3 large posters (one per case) with case descriptions
  - 18 index cards (one per participant)
  - Markers
  - Timer
  - Whistle/bell for transitions
  - 3 station tables labeled A, B, C

  **Case Posters (Plain Language):**
  ```text
  CASE A: THE CELLIST
  "Sofia judges her late husband did nothing wrong and believes she's forgiven him. Yet every night while practicing her cello, grief mixed with anger washes over her like she'd been betrayed."

  CASE B: THE HIKER
  "Sam knows the glass walkway is 100% safe (and can explain why!), but when stepping onto it, their body locks in terror as if facing certain death."

  CASE C: THE JUROR
  "Lee believes the defendant committed a vile crime and can list all the reasons why. But sitting three feet from them in court, Lee feels numb and disconnected."
  ```

  ---

  ### FACILITATION PLAN (90 MINUTES)

  #### **PHASE 1: SETUP & INTRODUCTION (10 MIN)**
  - **Grouping:** Pre-assign 3 groups of 6 via colored index cards
  - **Instructions (Read Aloud):**  
    "Writers! We craft characters whose insides battle their outsides. Today you'll become three characters whose feelings clash with their beliefs. No philosophy lectures - we'll *do* first, name later. Your mission: Help these characters by rewriting their judgments. Notice how stubborn their emotions are. Ready?"

  #### **PHASE 2: ROTATING STATIONS (45 MIN - 15 MIN PER STATION)**
  **Station Instructions (Printed at Each Table):**  
  ```text
  1. READ the case aloud together (2 min)  
  2. BODILY MIMICRY: Physically act out the character's emotional state (e.g., freeze like the hiker) (3 min)  
  3. JUDGMENT REWRITE: Each writer crafts a new judgment on index card to CHANGE the emotion (see prompts) (5 min)  
  4. TEST THE REWRITE: Re-attempt the bodily mimicry while holding your new judgment. Notice shifts (or not!) (3 min)  
  5. DISCUSS: Did the emotion budge? Why/why not? (2 min)  
  ```

  **Rewriting Prompts per Case:**  
  - **CELLIST:** "Make Sofia judge her husband *did* betray her. Or double down on forgiveness."  
  - **HIKER:** "Make Sam judge the walkway as *dangerous*. Or imagine it's solid ground."  
  - **JUROR:** "Make Lee judge the defendant is *innocent*. Or visualize them as a monster."  

  **Facilitator Script During Rotation:**  
  "Switch stations now! Remember: Don't fight the emotion - notice how it resists your rewrite. Body before words!"

  #### **PHASE 3: GROUP SYNTHESIS (20 MIN)**  
  1. **Gallery Walk:** Groups post rewritten judgments at each station (5 min)  
  2. **Guided Discussion (15 min):**  
     - "Which rewrites *most* changed the emotion? Which failed?"  
     - "When you froze as Sam, could thinking 'This is safe!' stop your shaking?"  
     - "Did Lee's numbness lift when you imagined the defendant as a monster?"  
     - "Sofia's anger: Did calling her husband 'innocent' dissolve it?"  

  #### **PHASE 4: DEBRIEF & THEORY MAPPING (15 MIN)**  
  **Reveal the Three Accounts (Simple Terms):**  
  ```text
  1. JUDGMENT THEORY: Emotions = Thoughts (e.g., "Anger IS judging you were wronged")  
  2. PERCEPTION THEORY: Emotions = Senses (e.g., "Fear SEES danger like eyes see color")  
  3. BODY THEORY: Emotions = Flesh + Urge (e.g., "Terror IS a racing heart + urge to flee")  
  ```

  **Map Moments to Theories:**  
  | **Case** | **Judgment Theory Prediction**          | **Perception Theory Prediction**       | **Body Theory Prediction**            | **What You Experienced**              |  
  |----------|------------------------------------------|----------------------------------------|----------------------------------------|----------------------------------------|  
  | Cellist  | Change judgment → Anger vanishes        | Anger persists like optical illusion   | Anger = body memory resisting thoughts | Rewrites didn't dissolve evening grief |  
  | Hiker    | "Safe!" thought → Calm body             | Walkway STILL looks/feels terrifying   | Freezing = automatic bodily reflex     | "Safe!" judgment ≠ calm legs           |  
  | Juror    | "Monster!" thought → Contempt flares    | Flatness = failing to "see" the evil   | Numbness = body's shutdown response    | Intellectual rage ≠ gut feeling        |  

  **Key Insight:**  
  "Notice how Judgment Theory underestimated emotion's stubbornness? That's why your rewrites struggled! Perception Theory explains why Sofia's anger *feels* true even when she knows it's 'wrong.' Body Theory explains Sam's terror as reflexes overriding thoughts."

  ---

  ### CANDID FACILITATOR NOTES
  **Likely Pitfalls & Solutions:**  
  - **"This feels artificial!"** → Preempt: "Lean into the awkwardness! We're magnifying subtle tensions."  
  - **Resisting bodily mimicry** → Model first: Step onto imaginary glass bridge trembling.  
  - **Over-intellectualizing** → Redirect: "Did your *fingertips* believe your new judgment?"  
  - **Time crunches** → Cut synthesis to prioritize bodily exercises.  

  **Limitation of Activity:**  
  The exercise *cannot* replicate how **time** mediates emotion-judgment conflicts (e.g., Sofia's anger fading over years). Must explicitly discuss:  
  - "Judgment Theory works best for slow-burn emotional shifts"  
  - "Perception/Body Theories explain why instant rewrites often fail"  

  **Why This Works for Writers:**  
  Participants leave with:  
  1. **3 concrete tools** for drafting emotional dissonance  
  2. **Bodily templates** (freezing/numbness/anger-waves)  
  3. **Revision filters:** "Which theory is this character's emotion obeying?"  

  > "You've felt philosophy in your bones today. Now when your character's hands shake while their voice says 'I'm fine,' you'll know *why* the lie rings true."
