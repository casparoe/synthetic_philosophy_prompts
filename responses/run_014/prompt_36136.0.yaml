prompt: |-
  I'm the research director for a constitutional reform commission in a mid-sized parliamentary democracy. The commission's mandate is to draft, within two years, a proposal for adding a sortition-based chamber to the legislature — a few hundred citizens selected by lot, most likely serving a single non-renewable term — alongside the existing elected chamber. We have money to commission roughly a dozen academic studies over the next eighteen months. My question is not whether sortition is a good idea, but which open questions we most need answered to produce a workable design, and in what order.

  Please rank the research questions you would have us fund, and defend the ordering. The open questions I'm already aware of include the following, but you should add others if you think they matter more:

  1. Self-selection. A lottery only delivers descriptive representativeness if the people drawn actually serve. If acceptance is voluntary and correlates with education, income, and civic engagement, the chamber is biased before deliberation begins. What compensation levels, duty framing (jury-style compulsion versus invitation), and opt-out designs best preserve the representativeness that is sortition's main selling point?

  2. Facilitation and agenda capture. Members serve briefly and cannot accumulate expertise, so professional staff, facilitators, and expert briefers may end up exercising the real power. Is there any institutional arrangement that secures informed judgment without a permanent unelected elite effectively doing the thinking for a rotating amateur membership?

  3. Mandate design. The chamber could hold binding legislative power, agenda-setting power only, or a veto over the elected chamber. How does each allocation make the other problems — capture, legitimacy, self-selection — better or worse?

  4. Term limits and professionalization. The anti-career-politician case for sortition assumes the one-term lottery member is a virtue. But does a chamber of perpetual amateurs merely relocate career-politician pathologies to whichever actors are permanent: staff, parties, the civil service?

  5. Legitimacy. Does a body nobody chose have the standing to make binding law, and does the answer change once citizens have lived experience with its output?

  For each item you would fund, explain what makes it upstream of the others, how tractable it is within eighteen months (e.g., through mini-public pilots, survey experiments, or natural experiments such as jury service), and what evidence would move it up or down your list. Equally important, tell me which of these you would deliberately refuse to fund, and why — either because the answer would not change the design, or because it is a question for political philosophers to argue about for the next thirty years rather than one the commission's timeline can resolve.
reasoning: |-
  Okay, the user is the research director for a constitutional reform commission in a parliamentary democracy. They're tasked with drafting a proposal to add a sortition-based chamber to the legislature. They've got funds for about a dozen academic studies over 18 months and need to prioritize research questions that will inform a workable design. The user already listed some key questions but wants to know which ones are most critical and in what order.

  First, I need to understand the core challenge. The commission needs actionable data to design this new chamber effectively. The questions they've mentioned—self-selection, facilitation, mandate, term limits, legitimacy—are all important, but some are more foundational than others. The key is identifying which questions will have the biggest impact on the design and which can be tested within the timeframe.

  Self-selection seems crucial. If the chamber isn't representative, the whole point of sortition is undermined. The user mentioned that acceptance rates could bias the sample. So methods to ensure participation—compensation, duty framing, opt-out designs—need empirical testing. This is tractable through surveys, pilots, and natural experiments like jury studies. Since representativeness affects every other aspect, it should be prioritized.

  Next, mandate design. The powers given to the chamber (binding, veto, agenda-setting) will influence how other issues like legitimacy or capture play out. Without knowing the mandate, it's hard to design other elements. Comparative analysis of existing bodies and simulations could provide insights within 18 months. This is upstream because it shapes the chamber's structure and interactions with the elected house.

  Facilitation and agenda capture come next. Staff and experts might wield too much influence. Testing facilitation models through mini-publics and observing other assemblies can reveal how to balance expert input with member autonomy. This is dependent on mandate and self-selection, so it comes after those.

  Term limits and professionalization address long-term risks like institutional capture. But since the chamber is non-renewable, this might be less urgent. Surveys on role perception and mini-publics can explore if short terms shift power to permanent staff. However, this might not change the initial design much, so it's lower priority.

  Legitimacy is tricky. Public perception is vital, but it's hard to study pre-implementation. Surveys and vignettes can gauge initial reactions, but real legitimacy comes from lived experience. Funding extensive studies now might not yield actionable data. Philosophical debates here won't resolve in 18 months, so it's lower priority.

  The user also needs to know which studies to skip. Legitimacy studies are important but not immediately actionable. Term limits are relevant but secondary to core design. Questions about specific powers (like veto vs. binding) might be too detailed for now. Instead, focus on foundational issues that will shape the entire structure.

  In summary, the order should start with practical, testable issues that affect the chamber's basic functionality. Self-selection and mandate are top priorities because they define who's in the room and what they can do. Facilitation follows as it's about how they operate. Term limits and legitimacy are important but can be deferred or studied minimally since they won't change the initial design as much. The commission should avoid funding studies that are too speculative or philosophical, focusing instead on empirical, tractable research that directly informs the drafting process.
answer: |-
  Based on your mandate, timeline, and the need for actionable design insights, here's a prioritized research agenda focusing on questions that are **upstream, tractable within 18 months, and have the highest leverage on design decisions**. I've added critical missing questions and explicitly flagged what *not* to fund.

  **Core Ranking Principle:** Prioritize questions where answers *fundamentally constrain or enable* subsequent design choices and where empirical evidence can be gathered *before* finalizing the chamber's structure.

  **Ranked Research Questions (Highest to Lowest Priority):**

  1.  **Self-Selection & Participation Guarantees (Your Q1 - Elevated):**
      *   **Why Highest Priority & Upstream:** This is the *sine qua non* of sortition's legitimacy. If the body isn't descriptively representative due to low/unrepresentative participation, the entire project fails. It directly impacts every other aspect (mandate, legitimacy, effectiveness). Decisions here (compensation, compulsion, opt-outs) are foundational and must be made early.
      *   **Tractability & Methods:**
          *   **Survey Experiments:** Test willingness-to-serve under varying compensation levels (e.g., 0.5x, 1x, 1.5x, 2x median wage), duty framings ("civic duty" vs. "opportunity"), opt-out conditions (easy, hardship-based, impossible), and support structures (childcare, eldercare, job protection guarantees).
          *   **Mini-Public Pilots:** Run multiple small-scale (100-200 person) citizens' assemblies on real but non-binding topics. Vary recruitment protocols (mandatory summons with opt-out vs. invitation with incentives) and compensation/support models. Track acceptance rates, demographics of participants vs. non-participants, and attrition rates.
          *   **Natural Experiments:** Deep dive analysis of *actual* jury duty participation rates, demographics, and reasons for non-participation/excusal in your jurisdiction, controlling for case type and compensation.
      *   **Evidence Impact:** High acceptance rates (>70%) with minimal demographic skew (especially education/income) under specific models would validate those designs. Persistently low/skewed participation despite high incentives would necessitate radical solutions (stronger compulsion) or force a re-think of the entire premise.

  2.  **Mandate & Powers: Interaction with Legitimacy and Effectiveness (Your Q3 - Expanded):**
      *   **Why Critical & Upstream:** The chamber's powers define its purpose, its relationship with the elected chamber, and the *stakes* for all other design elements (e.g., needed expertise, potential for capture, required legitimacy). Is it advisory, a veto player, a co-legislator? This choice shapes staffing needs, member workload, and public perception.
      *   **Tractability & Methods:**
          *   **Comparative Case Studies:** Deep analysis of bodies with different powers (e.g., Irish CA (agenda-setting/influential), ancient Athenian Boule (agenda/administration), G1000 (consultative), versus powerful upper houses). Focus on *interactions* with elected bodies, perceived legitimacy, and de facto influence.
          *   **Constitutional/Legal Analysis:** Study veto points, override mechanisms, and power-sharing arrangements in bicameral systems (especially where chambers have different bases of legitimacy - elected vs. appointed/federal).
          *   **Deliberative Polls/Mini-Publics:** Present citizens with scenarios involving different powers (e.g., "Should the Citizens' Chamber be able to delay a bill? Block it entirely? Force a referendum? Initiate its own bills?"). Gauge perceived legitimacy and effectiveness *before* implementation.
          *   **Agent-Based Modeling/Simulations:** Model interactions between an elected chamber and a sortition chamber with varying powers under different political conditions (majority/minority govt, polarized/consensus politics).
      *   **Evidence Impact:** Evidence showing certain powers consistently lead to deadlock or capture would rule them out. Evidence showing how specific powers (e.g., suspensive veto, agenda initiative) enhance deliberation without gridlock would validate them. Public acceptance data is crucial.

  3.  **Facilitation, Expertise & Agenda Control: Avoiding Capture (Your Q2 - Reframed):**
      *   **Why High Priority & Dependent:** Staff/facilitator influence is inevitable, but design can mitigate *undue* control. However, optimal models depend *heavily* on the Mandate (Q2 - complex bills need more support) and Member capacity (affected by Selection/Q1). This needs testing *after* core parameters are set.
      *   **Tractability & Methods:**
          *   **Mini-Public Pilots:** The *primary tool*. Run assemblies on complex topics (e.g., climate policy, constitutional amendment). Systematically vary:
              *   *Facilitator Role:* Neutral moderators vs. content-guiding chairs.
              *   *Expert Selection & Presentation:* Who chooses experts? Balanced panels? "Witness" models? Pre-digested briefs vs. raw testimony?
              *   *Staff Role:* Pure administrative/logistical vs. analytical/policy-drafting support. Transparency of staff memos.
              *   *Agenda Setting:* Pre-set by commission? Chosen by members from a list? Fully open?
          *   **Process Observation & Ethnography:** Embed researchers in existing mini-publics (e.g., Climate Assemblies) to track influence dynamics between members, staff, and experts.
          *   **Survey Experiments:** Test public trust in outputs based on descriptions of different facilitation/staff influence levels.
      *   **Evidence Impact:** Pilots showing members retain clear agency over final judgments under specific support models would be green lights. Evidence of significant staff/facilitator steering of outcomes would demand design safeguards (e.g., member oversight on staff, transparent processes, rotating facilitators).

  4.  **Term Length, Staggering, and Institutional Memory (Your Q4 - Refined):**
      *   **Why Medium Priority & Practical:** While "amateurism" is a virtue, practical operation requires managing turnover. Key questions: How long is a single term (6 months? 1 year? 3 years?)? Is the chamber fully replaced at once or staggered? How is institutional knowledge transferred without creating a permanent elite?
      *   **Tractability & Methods:**
          *   **Comparative Analysis:** Study legislative bodies with high turnover or fixed terms (e.g., some city councils, EU Parliament pre-2004, jury systems for long trials).
          *   **Mini-Public Pilots:** Run sequential mini-publics on related topics, testing knowledge transfer mechanisms (e.g., final reports, video archives, "handover" sessions with outgoing members, dedicated non-partisan secretariat summaries).
          *   **Simulations:** Model the impact of different term lengths and staggering cycles on policy continuity, learning curves, and vulnerability to external lobbying during transition periods.
          *   **Expert Elicitation:** Consult with clerks/secretariats of existing parliaments on practical challenges of high member turnover.
      *   **Evidence Impact:** Evidence showing significant efficiency/effectiveness gains from slightly longer terms (e.g., 18 months vs 6) or staggered cohorts would justify deviating from the purest "single short term" model. Evidence that simple knowledge transfer tools work effectively supports the amateur model.

  5.  **Integration with Existing Institutions & Workflow:**
      *   **Why Necessary but Later Stage:** How will the sortition chamber interact procedurally with the government, civil service, elected chamber, and judiciary? When does it get involved (pre-legislative scrutiny, post-committee, final vote)? This depends entirely on the Mandate (Q2) but needs practical mapping.
      *   **Tractability & Methods:**
          *   **Legal/Procedural Analysis:** Map existing legislative processes and identify potential insertion points for sortition chamber input/veto.
          *   **Stakeholder Workshops:** Facilitate discussions with current MPs, civil servants, parliamentary clerks, and judges to identify practical hurdles and potential conflicts.
          *   **Process Mapping & Scenario Planning:** Develop detailed flowcharts for different bill types under different mandate scenarios.
      *   **Evidence Impact:** Uncover fatal procedural roadblocks or resource constraints early. Identify points of friction requiring specific design solutions (e.g., timelines for sortition chamber review).

  **Questions to Explicitly NOT Fund (Within This Project):**

  1.  **"Is Sortition Legitimate?" (Your Q5 - Philosophical Core):**
      *   **Why Not:** This is foundational political philosophy. Your commission's mandate *assumes* this body will exist; the question is *how* to make it work *and* gain legitimacy through design and operation. Funding abstract legitimacy studies won't yield actionable design insights within 18 months. Public perception *post-launch* (Q5b) is different (see below).
      *   **Alternative:** Focus research on *design features that influence perceived legitimacy* (covered under Mandate, Selection, and Facilitation research). Use pre-implementation surveys (as part of Q2 & Q1 research) to gauge *conditional* legitimacy ("Would you accept a decision from a body like *this*?").

  2.  **Long-Term Legitimacy Evolution (Part of Your Q5):**
      *   **Why Not:** "Does the answer change once citizens have lived experience?" is vital but *impossible* to study definitively before the body exists. It's a longitudinal question beyond your 18-month horizon.
      *   **Alternative:** Fund *baseline* surveys *now* on attitudes toward the *concept* under different designs (as part of Q1/Q2 research). Plan for rigorous longitudinal evaluation *after* implementation, but don't spend precious pre-drafting resources trying to predict the unpredictable.

  3.  **Optimal Size (Beyond Initial Scope):**
      *   **Why Not:** While size matters, the rough order (hundreds) is likely fixed by the need for representativeness and manageability. Detailed size optimization (e.g., 350 vs. 400) is unlikely to be the decisive factor compared to mandate, selection, or powers. Resources are better spent elsewhere.
      *   **Alternative:** Note size implications discovered in other research (e.g., mini-public pilots on facilitation effectiveness at different scales) but don't make it a primary study.

  4.  **Direct Comparisons to Elected Politics Pathologies (Your Q4 - Overly Broad):**
      *   **Why Not:** While the risk of shifting power to permanent actors is real (and covered under Facilitation), funding broad studies comparing "career politician pathologies" to potential unelected staff pathologies is too vague and philosophical for your needs.
      *   **Alternative:** Focus research *specifically* on mitigating undue influence by permanent staff/facilitators within the sortition chamber's design (covered under Q3 - Facilitation research).

  **Summary of Order & Logic:**

  1.  **Selection (Q1):** Get the *people* right. Without representativeness, nothing else matters. Highly tractable.
  2.  **Mandate (Q3):** Define *what the body does*. This sets the stage for everything else - required resources, potential conflicts, legitimacy needs. Answerable through comparative study and modeling.
  3.  **Facilitation (Q2):** Design *how it works internally* to ensure member agency. Needs piloting, but depends on knowing the mandate's complexity.
  4.  **Term/Structure (Q4):** Optimize the *practical operation* over time. Important, but less fundamental than *who* and *what*.
  5.  **Integration (New):** Work out the *nuts and bolts* of fitting it into the system. Essential detail work, but flows from Mandate.

  **Rejected Funding:** Philosophical legitimacy (Q5 core), long-term legitimacy prediction, minute size optimization, broad pathology comparisons. Focus on empirically testable design choices within the commission's mandate and timeline.

  This sequence ensures you tackle the most fundamental, constraining questions first using the most appropriate methods, providing your commission with actionable evidence to draft a robust and implementable design for the sortition chamber. Good luck!
