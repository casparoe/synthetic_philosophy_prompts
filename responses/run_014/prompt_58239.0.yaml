answer: |-
  Here's a self-contained exam question and model answer package designed to test conceptual understanding of SSA/SIA while meeting your specifications:

  ---

  **PHIL/CSCI 2XX: Anthropic Reasoning Take-Home Exam**  
  **Time Allotment:** 75 minutes  
  **Total Points:** 20  

  **Stem:**  
  Physicists are evenly divided between two theories:  
  - **Small Universe (S):** Only 100 billion (10¹¹) observers will ever exist.  
  - **Big Universe (B):** 100 trillion (10¹⁴) observers will ever exist.  

  You initially assign P(S) = P(B) = 0.5. You then learn:  
  > "My birth rank (temporal position among all observers) is approximately 60 billion (6 × 10¹⁰)."  

  Later, you learn an additional fact:  
  > Only 10,000 observers ever explicitly consider anthropic reasoning. I am one of them.  

  **Questions:**  
  **A.** Calculate the posterior probability P(S | birth rank ≈ 60 billion) under:  
   (i) *SSA alone* (Self-Sampling Assumption)  
   (ii) *SIA alone* (Self-Indicating Assumption)  
   (iii) *SSA+SIA combined*  
  Explain each step. *(12 points)*  

  **B.** Does learning "I am among the 10,000 who consider anthropic reasoning" *screen off* the birth rank evidence (i.e., make it irrelevant to S vs. B), *double-count* it, or something else? Analyze whether the answer differs between SSA-only and SIA-only frameworks. *(8 points)*  

  ---

  **Model Answer & Grading Scheme**  
  **Word Count:** 550  

  ### Part A: Core Updates  
  *(Settled Bayesian mechanics - uncontroversial)*  

  **(i) SSA Alone (4 points)**  
  - SSA treats "my birth rank" as random sampling from all observers.  
  - Likelihoods:  
   P(rank ≈6e10 | S) = 1/10¹¹ (possible ranks: 1 to 10¹¹)  
   P(rank ≈6e10 | B) = 1/10¹⁴ (ranks: 1 to 10¹⁴)  
  - Posterior ratio:  
   P(S|rank)/P(B|rank) = [P(rank|S)P(S)] / [P(rank|B)P(B)] = (1/10¹¹) / (1/10¹⁴) = 10³  
   → P(S | rank) = 10³ / (10³ + 1) ≈ 99.9%  

  **(ii) SIA Alone (4 points)**  
  - SIA updates *before* birth rank evidence: it weights hypotheses by predicted # of observers ("full non-indexical conditioning").  
  - Prior shift: P_{SIA}(S) ∝ P(S) × 10¹¹, P_{SIA}(B) ∝ P(B) × 10¹⁴  
   → P_{SIA}(S) = (0.5×10¹¹)/(0.5×10¹¹ + 0.5×10¹⁴) ≈ 1/1000  
   → P_{SIA}(B) ≈ 999/1000  
  - *Birth rank provides no new information under pure SIA:* My rank is consistent with both theories, and SIA already accounted for observer counts.  
   → Posterior unchanged: P(S | rank) ≈ 0.1%  

  **(iii) SSA+SIA Combined (4 points)**  
  - Apply SIA's prior shift first, *then* SSA update:  
   P_{SIA}(S) ≈ 0.001, P_{SIA}(B) ≈ 0.999  
  - Now apply SSA likelihoods as in (i):  
   P(S | rank) ∝ P_{SIA}(S) × P(rank|S) ≈ 0.001 × (1/10¹¹)  
   P(B | rank) ∝ P_{SIA}(B) × P(rank|B) ≈ 0.999 × (1/10¹⁴)  
  - Posterior ratio ≈ [0.001 / 10¹¹] / [0.999 / 10¹⁴] ≈ 100  
   → P(S | rank) ≈ 99%  

  ### Part B: The "Anthropic Reasoner" Twist  
  *(Contested territory - full credit for coherent framework application)*  

  - **SSA-only (4 points):**  
    Learning "I am an anthropic reasoner (AR)" is *new indexical information*. Under SSA, we must condition on all indexical data. Only 10,000 ARs exist, so:  
    P(I am AR | S) = 10⁴ / 10¹¹ = 10⁻⁷  
    P(I am AR | B) = 10⁴ / 10¹⁴ = 10⁻¹⁰  
    This likelihood ratio (10⁻⁷ / 10⁻¹⁰ = 1000) *strongly favors B*. Crucially, birth rank and AR status are *separate conditions* under SSA. The AR evidence **does not screen off** birth rank; both must be multiplied:  
    Posterior ∝ [P(rank|S) × P(AR|S) × P(S)] vs [P(rank|B) × P(AR|B) × P(B)]  

  - **SIA-only (4 points):**  
    Pure SIA already weights theories by observer count. Since "I am AR" is an indexical fact *about myself*, and SIA treats "my existence" as given, this provides no new non-indexical information. The 10,000 ARs are proportionally represented in both universes, so learning I'm one of them **screens off birth rank evidence** (which also provided no update under pure SIA). No double-counting occurs.  

  ---

  **Grading Rubric (Total 20)**  
  **Must-Hit Moves (A-grade = 17-20):**  
  1. Correct likelihoods under SSA (A-i)  
  2. SIA prior shift *before* birth rank update (A-ii)  
  3. Distinction: SIA shifts priors, SSA shifts via likelihood (A-i vs A-ii)  
  4. Correct combined SIA→SSA sequence (A-iii)  
  5. AR analysis: SSA treats as new evidence, SIA as non-informative (B)  

  **Classic Mistakes (Point Deductions):**  
  | **Error** | **Points Lost** | **Why** |  
  |-----------|-----------------|---------|  
  | Treating SIA as "P(S) ∝ 1/observers" (misapplication) | -3 | Confuses SIA's *update rule* with its output |  
  | Using birth rank likelihoods under pure SIA (A-ii) | -2 | Misses SIA's "no update" implication |  
  | SSA+SIA: Applying SSA before SIA | -3 | Violates consensus update order |  
  | Claiming SIA means "larger universes are more likely [ontologically]" | -1 | Misrepresents SIA as metaphysical claim |  
  | Saying AR info screens off under SSA | -2 (B) | Fails to recognize new indexical evidence |  
  | No mention of presumptuousness in SIA (implied by A-ii) | -1 | Missed key philosophical consequence |  

  **Neutrality & Controversy Notes:**  
  - Part A math is uncontested. Disagreement arises in *which update rule to use*.  
  - The Presumptuous Philosopher (SIA-only) *is* mathematically coherent but debated for allowing extreme confidence in large universes without empirical data.  
  - In Part B, SIA's screening-off is *consistent within its framework* but contested by SSA advocates who view all indexicals as evidentiary.  

  ---

  **Rationale:**  
  - Tests **mechanism separation** (A-i vs A-ii) and **integration** (A-iii)  
  - **Forces conceptual engagement**: Students can't parrot "SIA favors big universes" without deriving *how* (A-ii) and why birth rank doesn't update it  
  - **Twist design**: AR condition challenges whether anthropic evidence is "special" (tests if students see indexical info as modular)  
  - **Meets timing**: Core calculations are short; depth comes from interpreting interactions  
  - **Philosophy-sensitive**: Flags presumptuousness as a *consequence* of SIA's math, not a flaw  

  Let me know if you'd like a more condensed rubric or adjustments to the twist complexity!
