  First, I need to recall the core differences between these two frameworks. Rational choice theory, rooted in equilibrium analysis, focuses on Nash equilibria and best responses. The folk theorem shows multiple equilibria in repeated games, including cooperative ones, but doesn't address how agents settle on one. Evolutionary game theory, however, uses dynamics like replication and mutation to model how strategies evolve over time in a population.

  The user's main puzzle is the slow decay of cooperation below the threshold. Rational choice might struggle here because it's static—equilibria are either stable or not, without temporal dynamics. Evolutionary theory, with its focus on population dynamics and path dependence, naturally explains inertia through concepts like stochastic stability and mutation-selection balance.

  Next, the user asks about path dependence and decay. Rational choice doesn't inherently model time-dependent processes, so it would need added machinery like learning models. Evolutionary theory, through replicator dynamics and mutation rates, can show how past states affect current outcomes, making it better suited for explaining slow decay.

  The third point is whether cooperative inertia is an artifact. In rational choice, it might be seen as an artifact since below-threshold shouldn't sustain cooperation. Evolutionary theory, however, views it as inherent due to population heterogeneity and mutation. Testing this in-simulation involves varying mutation rates and observing decay patterns—slower decay with lower mutation rates would support evolutionary explanations.

  Considering the frameworks' relationship, they're complementary. Rational choice explains possible equilibria, while evolutionary theory shows how populations reach them. The real explanatory work, especially for inertia, lies in evolutionary dynamics and stochastic processes, as they capture the temporal and path-dependent aspects the user observed.

  I should also address the user's background. As a physiological ecologist turned philosopher, they value both technical rigor and conceptual clarity. Their simulation suggests hands-on experience, so practical suggestions for in-simulation tests (like varying mutation rates) would be helpful. Their deeper interest might be in understanding whether cooperation's persistence is a robust feature of dynamic systems, linking their empirical work with philosophical questions on rationality and cooperation.
answer: |-
  Below is a systematic comparison of rational choice theory (RCT) and evolutionary game theory (EGT) as frameworks for explaining your observed "cooperative inertia" phenomenon. I'll address your core questions in sequence, emphasizing conceptual divergences and explanatory capacities.

  ---

  ### **1. Divergent Conceptions of Stability and Equilibrium**
  **Rational Choice Theory (RCT):**  
  - **Core Premise:** Agents are hyperrational, optimizing expected payoffs. Stability is defined by **Nash equilibria** (no agent benefits from unilateral deviation).  
  - **One-Shot Game:** Only mutual defection (DD) is a Nash equilibrium. Mutual cooperation (CC) is unstable as defection yields a higher payoff.  
  - **Indefinitely Repeated Game:** The **folk theorem** shows *multiple* Nash equilibria exist, including sustained mutual cooperation (via strategies like Tit-for-Tat), if the discount parameter *δ* exceeds the threshold *δ<sup>*</sup>* (where *δ ≥ (T-R)/(T-P)*).  
  - **Stability Critique:** RCT treats equilibria as static. Below *δ<sup>*</sup>*, CC is **not an equilibrium**—defection becomes the unique best response. Cooperation should collapse *immediately* in a rational population. RCT cannot natively explain persistence below threshold without ad hoc additions (e.g., bounded rationality).  

  **Evolutionary Game Theory (EGT):**  
  - **Core Premise:** Strategies spread via evolutionary dynamics (e.g., replicator equation: strategies grow if they outperform the population average). Stability is **dynamical** (attractor states) and **stochastic** (robustness to mutations).  
  - **One-Shot Game:** Defection is an **evolutionarily stable strategy (ESS)**—it resists invasion by cooperators.  
  - **Indefinitely Repeated Game:** Cooperation can be stably maintained if *δ > δ<sup>*</sup>* (e.g., via ESS or neutrally stable strategies). Crucially, **below *δ<sup>*</sup>***, cooperation may decay *slowly* due to:  
    - **Mutation-selection balance:** Mutations reintroduce cooperators despite selection favoring defectors.  
    - **Basins of attraction:** Populations historically above *δ<sup>*</sup>* may be in a "cooperative basin," requiring many stochastic events to escape.  

  **Divergence:**  
  - RCT asks: *"What is optimal for a rational agent?"* → Cooperation collapses instantly below *δ<sup>*</sup>*.  
  - EGT asks: *"What strategies evolve under selection/mutation?"* → Cooperation decays slowly due to population heterogeneity and path dependence.  

  ---

  ### **2. Modeling Path Dependence and Slow Decay**
  **Rational Choice Theory:**  
  - **Limitation:** RCT is inherently **static** and **ahistorical**. Nash equilibria depend only on current payoffs, not historical trajectories.  
  - **Accommodating Path Dependence:** Requires importing dynamic concepts (e.g., **learning models** like fictitious play or reinforcement learning). Even then, RCT struggles with hysteresis—your observation that prior history above *δ<sup>*</sup>* slows decay.  

  **Evolutionary Game Theory:**  
  - **Native Capacity:** EGT **explicitly models dynamics**:  
    - **Replicator dynamics:** Strategy frequencies change based on fitness differences.  
    - **Stochasticity:** In finite populations (like your simulation), **random drift** and **mutation** create path dependence.  
    - **Hysteresis:** Populations lingering in cooperative states develop a larger basin of attraction. Escaping requires traversing a "fitness valley" of lower-payoff states, slowing decay.  
  - **Key Mechanism:** **Stochastic stability** (long-run equilibrium under infinitesimal mutation rates) explains why populations near all-cooperation resist collapse.  

  **Conclusion:** EGT natively captures path dependence; RCT must retrofit dynamics.  

  ---

  ### **3. Is Cooperative Inertia an Artifact?**
  **Rational Choice Perspective:**  
  - Inertia is **an artifact** of irrationality or computational limits. RCT predicts immediate collapse below *δ<sup>*</sup>*, so persistence implies agents aren't optimizing.  

  **Evolutionary Perspective:**  
  - Inertia is **a feature** of evolutionary dynamics:  
    - Low mutation rates preserve cooperation longer.  
    - Prior high-*δ* periods increase homogeneity of cooperative strategies, raising the "energy barrier" to defect.  
  - **Distinguishing Artifact vs. Feature in Simulation:**  
    - **Vary mutation rate (*μ*):** If decay accelerates as *μ* increases, inertia is evolutionarily driven.  
    - **Track strategy diversity:** After *δ* drops, measure time until first mutant defector invades (*t<sub>invade</sub>*). If *t<sub>invade</sub>* correlates with prior *δ*-exposure, path dependence is confirmed.  
    - **Phase transitions:** Plot cooperation decay rate vs. *δ*. RCT predicts a step-function collapse at *δ<sup>*</sup>*; EGT predicts a smooth decay gradient.  

  ---

  ### **4. Complementary or Rival Frameworks?**
  - **Not Direct Rivals:** They address **distinct questions**. RCT asks what *should* happen under rationality; EGT asks what *does* happen under evolutionary pressures.  
  - **Complementarity:**  
    - RCT identifies *possible* equilibria (e.g., via folk theorem).  
    - EGT explains *which* equilibria emerge dynamically and *how* (e.g., stochastic stability favors "risk-dominant" strategies).  
  - **Explanatory Primacy in Your Case:**  
    A philosopher of biology would argue that **EGT does the "real explanatory work"** for cooperative inertia:  
    - Your phenomenon hinges on **population dynamics**, **stochasticity**, and **historical contingency**—all central to EGT.  
    - RCT’s equilibrium logic is a necessary but insufficient backdrop; it defines the threshold (*δ<sup>*</sup>*) but cannot explain transient persistence.  
    - **Key EGT Concepts at Play:**  
      - Mutation-selection balance → Slow erosion of cooperation.  
      - Hysteresis → Dependence on prior cooperative history.  
      - Stochastic tunneling → Time for defectors to invade cooperative clusters.  

  ---

  ### **Synthesis**
  Your "cooperative inertia" emerges from **evolutionary dynamics in finite populations with stochasticity**—a domain where EGT excels. Rational choice theory illuminates why cooperation is fragile below *δ<sup>*</sup>* but cannot explain inertia without abandoning core assumptions. The frameworks are complementary: RCT sets the game-theoretic stage, while EGT directs the dynamical play. To deepen this analysis:  
  - **In-simulation tests:** Quantify the correlation between historical *δ*-exposure and cooperation half-life while varying mutation rates.  
  - **Theoretical refinement:** Apply **adaptive dynamics** (EGT extension) to model how strategies evolve in response to changing *δ*.  

  This duality mirrors biology itself: genetics defines possible phenotypes (analogous to RCT’s equilibria), but natural selection governs their realization (EGT’s dynamics). Your soil invertebrates, much like your agents, persist not by rationality but by the rugged landscapes of evolutionary contingency.
