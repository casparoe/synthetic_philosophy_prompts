answer: |-
  ### Exam Question  
  **Part (a)** (10 points)  
  Eleonore Stump’s "no-flicker" Frankfurt-style case aims to neutralize the "flicker of freedom" response to Frankfurt’s original argument against the Principle of Alternative Possibilities (PAP). Explain:  
  (i) How Stump’s case attempts to eliminate *all* alternative possibilities (including "flickers") in the actual sequence of events, and  
  (ii) Why this is meant to undermine the "flicker" defender’s claim that a *weak* form of PAP (requiring *some* alternative possibility, however minimal) survives Frankfurt’s original case.  

  **Part (b)** (10 points)  
  Suppose we apply Stump’s no-flicker setup to an **"atomic decider"**: an agent whose decisions occur instantaneously, with no prior detectable mental states (e.g., inclinations, deliberations, or urges) that could trigger a counterfactual intervener. Does this scenario:  
  (i) Preserve Stump’s conclusion that the agent is morally responsible *without* any alternative possibilities, or  
  (ii) Reveal a flaw in the no-flicker strategy’s reliance on the *detectability* of decision-precursors? Defend your answer.  

  ---

  ### Model Answer (650 words)  
  **Part (a)**  
  Stump’s no-flicker case refines Frankfurt’s original thought experiment by targeting the "flicker of freedom" strategy. Frankfurt’s initial case involved a counterfactual intervener (e.g., Black) who would force an agent (Jones) to perform action A if Jones showed *any* sign of choosing otherwise. Flicker defenders (e.g., Widerker, Kane) argued that Jones still possessed a "flicker" of freedom: the ability to *begin* choosing non-A, triggering intervention. This flicker, they claimed, satisfies a weak PAP requiring *some* alternative possibility for moral responsibility (MR).  

  Stump’s innovation blocks this by making the intervener trigger on the *earliest detectable precursor* to a decision (e.g., a nascent inclination toward non-A), *before* Jones forms even a preliminary intention. In her case, Black monitors Jones’s subconscious inclinations and intervenes preemptively if *any* inclination toward non-A emerges. Crucially, in the actual sequence where Jones chooses A, *no* such inclination occurs, so Black never acts. However, had Jones *started* to develop an inclination toward non-A, Black would have forced A. Thus, Jones has *no* alternative possibilities at any point: he cannot even *begin* to choose non-A without triggering intervention. This eliminates flickers by ensuring that (i) the actual sequence contains zero opportunities for doing otherwise, and (ii) any alternative sequence requires external manipulation. Stump thereby argues that MR persists *without* weak PAP: Jones is responsible for A despite having no alternatives whatsoever.  

  **Part (b)**  
  The atomic decider scenario challenges Stump’s case by testing its dependence on *detectable decision-precursors*. An atomic decider decides instantaneously, with no prior mental states that could signal an impending choice. For Stump’s intervener to work, it must detect a precursor (e.g., an inclination) to block alternatives. But if no such precursors exist, two problems arise:  

  First, **the intervener cannot be triggered preemptively**. Suppose Jones the atomic decider chooses A. In the actual sequence, no precursors exist, so Black does nothing. But what about alternative sequences? Had Jones chosen non-A, he would have done so *without* prior detectable states. Black, programmed to intervene only upon detecting precursors, would *not* activate, since no precursors precede atomic decisions. Thus, Jones *could* have done otherwise (chosen non-A freely), as Black remains inactive. This reintroduces a robust alternative possibility—directly contradicting Stump’s no-flicker goal.  

  Second, **Stump’s case implicitly assumes non-atomic decision-making**. Her model requires that decisions emerge from prior, monitorable mental events (e.g., inclinations). If decisions are atomic, however, the intervener lacks a reliable trigger. To "fix" this, one might redesign Black to intervene upon the *decision itself*. But if Black forces A *after* Jones non-atomically "decides" non-A, Jones is not responsible for A (he was coerced). If Black intervenes *before* any decision, Jones’s responsibility is undermined. Thus, Stump’s case collapses: either alternatives exist, or responsibility is negated.  

  This reveals a flaw in the no-flicker strategy. Stump’s case succeeds only if decisions *necessarily* have precursors. But atomic deciders show this is contingent. Without precursors, Stump cannot simultaneously eliminate alternatives *and* preserve responsibility. The atomic decider thus exposes that her argument against weak PAP depends on a disputable empirical claim—that decisions *always* have monitorable antecedents. If atomic decisions are metaphysically possible, weak PAP (requiring *some* alternative) may survive.  

  **Conclusion**: Stump’s case effectively counters flicker strategies *if* decisions are non-atomic. But for atomic deciders, it fails to eliminate alternatives without sacrificing responsibility. This suggests Stump’s rejection of weak PAP is not universally valid but relies on specific (and challengeable) assumptions about how decisions unfold.  

  ---

  ### Marking Scheme (20 points total)  
  **Must-hit moves**:  
  1. **Stump’s preemptive trigger** (4 pts)  
     *Note: Must specify intervention on precursors (e.g., inclinations) BEFORE decision formation.*  
     *Common error: Claiming intervention occurs after choice or on actions.*  

  2. **Flicker elimination mechanism** (4 pts)  
     *Note: Must explain why no alternatives exist in actual sequence (no precursors) AND alternatives require coercion.*  
     *Common error: Only stating alternatives are blocked, not how precursors fix this.*  

  3. **Weak PAP undermined** (3 pts)  
     *Note: Must tie Stump’s case to defeating even minimal alternatives (flickers).*  
     *Common error: Conflating weak PAP with strong PAP.*  

  4. **Atomic decider breaks intervention** (5 pts)  
     *Note: Must show intervener CAN’T trigger without precursors, allowing alternatives.*  
     *Common error: Asserting atomic decisions are impossible or redescribing non-atomic cases.*  

  5. **Contingency of Stump’s success** (4 pts)  
     *Note: Must conclude Stump’s argument depends on non-atomic decisions.*  
     *Common error: Generalizing that PAP is true/false without nuance.*  

  ---

  **Verdict:** The top answer identifies that Stump’s no-flicker case presupposes decisions *must* have detectable precursors, and atomic deciders expose this as a contingent—not necessary—feature of agency.
