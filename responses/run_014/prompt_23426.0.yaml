prompt: |-
  I run a small podcast for the rationalist-blog crowd, and next week's guest is a decision theorist who defends the difference principle as the way out of the Pasadena paradox: when a gamble's expected value is undefined because the positive and negative parts each diverge, you should compare it to the alternatives by the expected value of the difference, which is often well definded even when the individual values aren't. I've been reading this literature for years, so skip the Nover and Hájek setup rehash. Draft eight to ten questions that press the actual position. I want at least one on the natural-order sum: the coin-flip process picks out a specific order of outcomes, and in that order the expected-value series is just 1 − 1/2 + 1/3 − 1/4 + …, which sums to ln 2 — so why isnt ln 2 the expected value, and does the Riemann rearrangement point really do any work once the physical process is fixed? One on the Altadena game (Pasadena with a dollar added to every payoff), which beats Pasadena in every possible world, and what his framework says when the difference has an undefined expectation, like comparing Pasadena to simply not playing. And one on the decomposition problem: EV(Altadena − Pasadena) is exactly 1 computed directly, but if you first rewrite the difference as (Altadena − StP) + (StP − Pasadena), one piece is −∞ and the other is +∞, so the answer depends on how you slice it — what makes the direct computation authoritative? For each, give a follow-up keyed to the answer he's most likely to give; he's the type to wave at "assume the difference is well-defined" and I want to make that harder to use.
reasoning: |-
  Okay, the user runs a small podcast focused on rationalist and decision theory topics, and they're preparing for an interview with a decision theorist who uses the difference principle to resolve the Pasadena paradox. They want me to draft 8-10 targeted questions that really challenge the guest's position, specifically focusing on three key issues: the natural-order sum (why it shouldn't be ln2), the Altadena game comparison, and the decomposition problem. They also want follow-ups for each main question that prevent the guest from easily relying on the "assume well-defined difference" escape hatch.

  Hmm, this is quite sophisticated stuff. The user clearly has deep familiarity with the literature - they name-dropped Nover and Hájek but explicitly don't want rehashing of basics. They're focused on technical pressure points. The three specified issues are indeed the cruxes where difference principle defenses get shaky.

  Let me unpack what they're asking about each point. First, the natural-order sum objection: in the actual coin-flip sequence of Pasadena, the payoffs naturally order as +1, -1/2, +1/3 etc., whose partial sums converge to ln2. So why isn't that the "real" EV? The guest will likely invoke Riemann rearrangement, but as the user notes - the physical process fixes an order. This needs a question that forces the guest to explain why mathematical divergence should override the physical sequence.

  For Altadena: since it dominates Pasadena in every state (payoff always $1 higher), any sane person would prefer it. But difference principle requires computing EV(Altadena - Pasadena) which is undefined since both diverge. How does the framework justify dominance when the difference isn't well-defined? Must prevent "just assume it's defined" handwave.

  The decomposition problem is nastiest: computing EV(A-P) directly gives 1, but if you split it as (A - StP) + (StP - P), you get ∞ - ∞. Why privilege direct computation? Guest will probably appeal to "canonical representation" - so follow-up should challenge what makes one representation more canonical when both are mathematically valid.

  Beyond these three, I should add 5-7 more angles to reach 8-10 total. Good candidates: how the principle handles non-comparable alternatives (like Pasadena vs nothing); whether it satisfies strong dominance; how it relates to actual choice sequences; what happens with tail events; whether it implies context-dependent value; and perhaps a "gotcha" with St. Petersburg variations.

  For follow-ups, need to anticipate standard defenses. The guest will likely say: (1) for natural order, that we must consider all possible orderings (but why, when process fixes one?), (2) for Altadena, claim the difference is "effectively" well-defined (but mathematically it's not), (3) for decomposition, insist on "natural" slicing (but "natural" is undefined). Follow-ups must pin down why mathematical formalisms override intuitive choices.

  User's tone suggests impatience with superficial answers - they've "read this literature for years". Questions must be precise and unsparing. Should avoid softball questions entirely since they want to "press the actual position". Might include one on whether the principle is a descriptive or prescriptive solution given its counterintuitive implications.

  Structure will be: main question cutting to the issue, immediate follow-up targeting the predicted dodge, and maybe secondary follow-ups where needed. Need to maintain rigorous tone matching the audience's sophistication. No warmup questions - dive straight into contradictions.
answer: |-
  Here are 10 targeted questions pressing the difference principle's foundations, designed to block the "assume well-defined difference" escape and focus on your specified pain points:

  1.  **Natural Order Sum & Process Fixing:** "The Pasadena game's actual coin-flip *process* generates a *fixed* temporal sequence of outcomes: first flip pays +1, second pays -1/2, third pays +1/3, etc. In this specific, physically determined order, the partial sums of the payoffs converge to ln(2). Why isn't this the *definitive* expected value of the gamble? Doesn't the physical process pick out the 'natural' ordering, rendering the Riemann rearrangement theorem irrelevant for *this specific implementation* of the gamble?"
      *   *Likely Defense/Follow-Up:* If he argues the *description* of the gamble doesn't specify the order, or that EV must be order-invariant: "But the *physical mechanism* (sequential fair coin flips stopping on heads) *does* specify the order – outcome n *always* occurs on the n-th trial. Isn't the difference principle, by insisting on order-invariance for the EV concept itself, potentially ignoring crucial information about how the gamble is physically realized? Why should mathematical properties of divergent series override the actual sequence generated by the world?"

  2.  **Altadena Dominance & Undefined Difference:** "The Altadena game strictly dominates the Pasadena game: in every single possible world (every finite sequence of flips), Altadena pays exactly $1 more. Any plausible decision rule should prefer Altadena. Yet, EV(Altadena - Pasadena) is undefined because the individual EVs diverge. How does the difference principle *formally* justify preferring Altadena over Pasadena when the very difference it relies on is undefined? Doesn't this expose a conflict between the difference principle and statewise dominance?"
      *   *Likely Defense/Follow-Up:* If he claims the difference is "effectively well-defined" or relies on dominance intuition: "But the principle's *formal requirement* is that EV(A-B) be well-defined. Here it isn't. Are you saying the difference principle needs to be supplemented by an *additional* dominance principle? If so, doesn't that undermine its claim to be the *fundamental* resolution to cases like Pasadena where dominance alone (e.g., vs. status quo) often fails? Why isn't dominance primary?"

  3.  **Decomposition Problem (Direct vs. Sliced):** "Computing EV(Altadena - Pasadena) directly yields a clear expected difference of 1. However, decomposing it as EV((Altadena - StP) + (StP - Pasadena)) gives EV(-∞ + ∞), which is undefined. What makes the direct computation of the difference authoritative over this equally valid algebraic decomposition? What principle determines the 'correct' way to calculate EV(A-B) when multiple decompositions are possible?"
      *   *Likely Defense/Follow-Up:* If he argues the direct pairing is "natural" or the decomposition is "artificial": "What defines 'natural' here beyond mathematical convenience? Both calculations are algebraically valid representations of the same difference. If the difference principle's output depends on *how* we represent the difference operation before taking the expectation, doesn't that introduce a crippling ambiguity? How do you formally specify *which* representation of A-B to use for the expectation?"

  4.  **Comparison to Status Quo (Undefined Difference):** "Consider comparing the Pasadena game (P) to the status quo (S) of not playing, paying 0. EV(P - S) = EV(P), which is undefined. EV(S - P) is also undefined. How does the difference principle *formally* adjudicate between P and S? Does it imply indifference? Or does it simply fail to give an answer? If it fails, how is this a satisfactory resolution to the paradox for a decision-maker facing this choice?"
      *   *Likely Defense/Follow-Up:* If he suggests dominance or another rule applies, or claims indifference: "But the difference principle's core promise is to handle cases where standard EV fails. Here, directly applying it yields no defined comparison. If we must fall back to dominance or something else to compare P to S, why not use that *instead* of the difference principle for comparing P to Altadena? Doesn't this show the principle lacks universality precisely where it's most needed?"

  5.  **The Scope of "Well-Defined Difference":** "You argue the difference principle applies when EV(A-B) is well-defined, even if EV(A) and EV(B) aren't. Can you precisely characterize the class of gambles A and B for which EV(A-B) *is* guaranteed to be well-defined? Specifically, does it require that A-B has *absolutely* convergent expectations (i.e., both the positive and negative parts of (A-B) have finite expectation), or merely that the series for EV(A-B) converges conditionally? If the latter, doesn't the decomposition problem (Q3) resurface?"
      *   *Likely Defense/Follow-Up:* If he emphasizes conditional convergence is sufficient: "If conditional convergence is sufficient for EV(A-B) to be 'well-defined' in your sense, then the decomposition in Q3 (Altadena-Pasadena = (Altadena-StP) + (StP-Pasadena)) *also* has a conditionally convergent expectation (∞ - ∞). Yet it gives a different result than the direct computation. Doesn't this mean 'well-defined difference' based *only* on conditional convergence is insufficient to avoid representation-dependence?"

  6.  **Tail Events & Strong Dominance:** "Suppose we modify Altadena (A) very slightly: in the vanishingly unlikely event of 100 tails followed by heads, instead of paying +$101, it pays +$100 (matching Pasadena's +$100 in that world). Call this A'. A' *strongly dominates* Pasadena (P) – it pays at least as much in every world and strictly more in some (all finite sequences ending before 100 tails). EV(A' - P) is *still* undefined (both diverge, their difference diverges). How does the difference principle justify preferring A' over P?"
      *   *Likely Defense/Follow-Up:* If he appeals to dominance again: "Similar to Q2, doesn't this show the difference principle *itself* cannot formally capture the superiority of A' over P based solely on EV(A'-P)? If we must *always* rely on an independent dominance principle when EV(A-B) is undefined, doesn't that make the difference principle redundant or secondary for justifying intuitive preferences in these paradoxes? Is it more of a technical trick for specific comparisons than a foundational justification?"

  7.  **Context Dependence of Value:** "The difference principle makes the *value* of a gamble A depend crucially on what alternative B it's being compared *to*. The Pasadena game might be preferable to B1, indifferent to B2, and dispreferred to B3, depending solely on whether EV(A-Bx) is positive, zero, or negative/undefined. Does this mean the difference principle rejects the idea that a gamble has an intrinsic value (or ordinal ranking) independent of the comparison set? Isn't this a radical departure from standard decision theory?"
      *   *Likely Defense/Follow-Up:* If he downplays this or says value *is* relational: "Doesn't this relationality create problems? For example, if A > B via EV(A-B)>0, and B > C via EV(B-C)>0, but EV(A-C) is undefined (or negative), we lack transitivity. How does the principle resolve such cycles or gaps? Does it imply rational preferences can be non-transitive or incomplete?"

  8.  **The St. Petersburg Anchor:** "The decomposition problem (Q3) and the Altadena comparison rely heavily on using the St. Petersburg game (StP) as a benchmark. Yet StP *itself* has infinite expectation, a property often seen as paradoxical. Doesn't building the resolution on comparisons to another 'pathological' infinite-expectation gamble feel unstable? How sensitive are the difference principle's recommendations to the choice of benchmark gambles used in decompositions or comparisons?"
      *   *Likely Defense/Follow-Up:* If he argues StP is a useful tool or specific comparisons don't need it: "But in Q3, the problematic decomposition *uses* StP. If we avoid StP, how do we resolve the ambiguity between direct EV(A-B) and *other* potential decompositions (e.g., comparing to a different infinite-expectation gamble) that might yield different results? What anchors the 'correct' decomposition besides the direct comparison?"

  9.  **Physical Realization vs. Abstract Description:** "Returning to Q1 (Natural Order): Defenders often argue the Pasadena game is just an abstract mathematical object described by the payoff series, not tied to a specific physical process. But in real-world applications (or even thought experiments), a gamble *is* implemented by some physical process (like coin flips) that *does* impose an order. Shouldn't a decision theory account for how the uncertainty is *actually resolved*? Doesn't insisting on order-invariance for the abstract description potentially misrepresent the value an agent experiences when facing a *concrete* instantiation of the gamble?"
      *   *Likely Defense/Follow-Up:* If he maintains the abstract description is primary: "Doesn't this create a disconnect? If an agent is offered a *specific* sequential coin-flip version of Pasadena generating the ln(2) sum, why should they value it according to an order-invariant property that ignores the actual process they face? Isn't this demanding they ignore available information?"

  10. **Ultimate Justification & Burden of Proof:** "Given the challenges—potential conflict with dominance (Q2, Q6), representation-dependence/decomposition (Q3, Q5), inability to compare to status quo (Q4), context-dependence (Q7), and reliance on other pathological games (Q8)—what is the *positive* case that the difference principle, despite these issues, is *still* the *best* or *only* coherent way to make decisions when expectations are undefined? Why shouldn't we explore alternatives (e.g., weak expectations, finite approximations, relative utilities, dropping countable additivity) that might avoid these specific pitfalls?"
      *   *Likely Defense/Follow-Up:* If he argues alternatives have worse problems or the difference principle uniquely satisfies certain axioms: "Which specific axioms does it uniquely satisfy that are both compelling *and* sufficient to outweigh the intuitive costs like the potential violation of statewise dominance? If satisfying certain mathematical consistency axioms forces us to reject the seemingly obvious superiority of Altadena over Pasadena in some comparisons (Q6), doesn't that suggest the axioms might be the problem, not our intuition?"

  These questions directly target the core tensions in the difference principle approach, particularly the conflict between its formal mathematical requirements (well-defined EV(A-B)) and strong intuitive principles like statewise dominance, the ambiguity introduced by decomposition, and the implications of the physical process fixing an order. The follow-ups are designed to force engagement beyond the initial stipulation that the difference must be well-defined by challenging *why* that stipulation overrides other compelling considerations or how it can be maintained consistently in the face of decomposition and dominance.
