  Okay, the user is a philosopher specializing in epistemology and philosophy of science, currently researching measurement. They've been roped into running a seminar on conspiracy theories and have encountered a specific cognitive pattern they can't name. This pattern involves believers shifting the meaning of key claims without conscious revision when evidence contradicts them. They've checked adjacent concepts like unfalsifiability or goalpost-moving but find them inadequate. 

  The user's frustration is palpable—they're intellectually irritated by the unnamed phenomenon and want precise terminology to dissect it. Their examples (moon landing photos, suppressed studies) show this isn't about dishonesty but unconscious semantic drift. The British English request hints at academic context (UK department) and possibly subtle pushback against Anglo-centric defaults. 

  Deep needs emerge: 
  1) Conceptual clarity for teaching—they need to frame this for students. 
  2) Philosophical rigor—they dislike fuzzy borders between existing terms. 
  3) A diagnostic tool—boundary cases (teen bands, political parties) suggest they want to test the concept's limits. 
  4) Meta-disagreement insight—whether debates with such believers are even about shared propositions. 

  Existing frameworks fall short: 
  - Lakatos/Quine involve conscious auxiliary hypotheses; this is implicit. 
  - "Moving goalposts" is agentive; here it's passive. 
  - Equivocation is intentional; this is self-unaware. 

  The core is lexical creep: the signifier ("the study," "fakery") stays constant while the signified mutates glacially, evading falsification. It's distinct from: 
  - Ordinary opinion drift (which acknowledges change). 
  - Revision denial (suppressed awareness). 
  - Slipperiness (tactical). 

  Proposing "semantic displacement": 
  1) Gradual redefinition without admission. 
  2) Preserves belief's surface structure. 
  3) Unconscious and defensive. 
  Boundary tests: 
  - Teen band fandom? Only if they deny changed taste. 
  - Political rebranding? Only if base is duped, not leaders. 
  Disagreement becomes empty—no shared proposition persists. 
  British English: swapped "stabilizers"/"tyres," "rigour," double quotes. 

  User's measurement expertise might appreciate the "calibration drift" metaphor—instruments untethered from reference points. Naming this could be their key seminar hook.
answer: |-
  Right, this is a brilliantly observed phenomenon — one that sits in the uncomfortable interstices between epistemology, philosophy of mind, philosophy of language, and the psychology of motivated reasoning. It's distinct from its neighbours, and you're right that the existing labels don't quite capture its specific mechanics and phenomenology. Let's give it a name, define it carefully, mark its boundaries, and test it with your cases.

  **The Name: Semantic Displacement**

  **The Definition:**
  *Semantic Displacement* is the unconscious, gradual, and defensive shift in the meaning or referent of key terms within a core belief, occurring in response to counter-evidence or failed predictions, such that:
  1.  **The linguistic form remains identical:** The believer continues to assert the *same sentences* expressing the core belief.
  2.  **The semantic content migrates:** The meaning of crucial terms within those sentences shifts incrementally, typically broadening, narrowing, or altering the referent to accommodate the disconfirming evidence.
  3.  **It preserves the core belief's status:** The core belief itself is shielded from conscious revision or rejection; its perceived truth-value remains unchanged.
  4.  **It is unconscious and retrospective:** The believer sincerely perceives their belief as stable and consistent over time. The displacement happens beneath the level of conscious reflection, often rationalised post-hoc as merely clarifying what was "always meant."
  5.  **It serves a protective function:** The primary driver is the preservation of a deeply held belief (often identity-constituting or emotionally charged) against epistemic threat, not deliberate deception.

  **Mechanism:** It exploits the inherent ambiguity, context-dependence, and under-specification of natural language. Key terms ("the study," "fakery," "they," "proof," "what happened") are not rigidly defined anchors but flexible placeholders. When evidence directly challenges the *current* referent/meaning, the mind unconsciously "reaches" for a slightly different, less vulnerable referent/meaning that still fits the linguistic form, preserving the feeling of holding the *same* belief. It's a slow-motion equivocation happening within a single mind over an extended period.

  **How it Differs from the Neighbours:**

  1.  **Popperian Unfalsifiability:** Unfalsifiability makes a claim *in principle* untestable. Semantic Displacement starts with a *seemingly* falsifiable claim ("*This specific study* will show X"), but when falsified, the *meaning* of "this specific study" changes. It's an *ad hoc* rescue manoeuvre exploiting language, not inherent logical structure.
  2.  **Lakatos's Protective Belt:** Lakatos involves consciously or semi-consciously *adding* new auxiliary hypotheses to protect the hard core. Semantic Displacement doesn't add new claims; it *changes the meaning of existing claims* while maintaining their surface form. The auxiliary hypothesis *is* the redefinition itself.
  3.  **Quinean Web of Belief:** Quine allows revision anywhere, including the core, under sufficient "pressure." Semantic Displacement *actively prevents* core revision by shifting meaning. It's a specific *strategy* (albeit unconscious) employed *within* the web to resist that pressure locally (on the challenged term/referent).
  4.  **Self-Sealing Belief:** This is a broader category. Semantic Displacement is a specific *mechanism* for *achieving* self-sealingness through linguistic manipulation.
  5.  **Persuasive Definitions:** These are deliberate attempts to *change others'* understanding of a term by redefining it rhetorically. Semantic Displacement is an *unconscious process within the believer* to protect *their own* belief, often unnoticed by them.
  6.  **Moving the Goalposts (Equivocation):** This is a deliberate, tactical shift in criteria *during an argument* to win against an opponent. Semantic Displacement is a slow, internal, unconscious process over a long period, driven by belief preservation, not argumentative victory. The believer isn't "doing" it to the interlocutor; it's happening *to* their own conceptual framework.
  7.  **Ordinary Gradual Drift of Opinion:** This involves *acknowledging* (even if implicitly) that one's view has changed ("I used to think X, but now I think Y"). Semantic Displacement involves a *denial* of change; the believer insists their view "hasn't budged." The drift is in the *meaning*, not the professed *belief*.
  8.  **Change of Mind Won't Own Up To:** This implies conscious awareness of the change and deliberate concealment. Semantic Displacement lacks this conscious awareness; the person genuinely experiences continuity.

  **Boundary Cases - Applying "Semantic Displacement":**

  1.  **Your Moon Landing Friend:**
      *   **Yes, clear case.** "Fakery" initially referred to specific photographic anomalies implying crude deception. When explained, "fakery" semantically displaced to mean a "more subtle" process, the anomalies becoming incidental or misunderstood clues rather than the core proof. The sentence "The moon landings were faked" persists, but its content migrated from "detectable by these photo flaws" to "undetectable except by complex, hidden means."
  2.  **The Suppressed Study Advocate:**
      *   **Yes, core example.** "The study" initially referred to Study A (hypothetical, suppressed). When Study A is published and is mundane, "the study" semantically displaces to mean Study B (still hypothetical, suppressed). The claim "They are sitting on the study" persists, but its referent changed. The *promise* of definitive proof migrates to a new, unreachable locus.
  3.  **The Teenager "Into" a Band for a Decade:**
      *   **Possibly, but depends.** If the teenager insists their *fandom itself* hasn't changed ("I've always loved Band X just the same!"), while the *meaning* of "love" or "into" has shifted drastically (e.g., from obsessive adoration to ironic appreciation or nostalgic habit), **then Yes, Semantic Displacement applies.** The linguistic claim "I'm into Band X" persists, but its semantic content migrated. If they acknowledge their relationship to the band has evolved ("I used to be obsessed, now I just like their old stuff"), it's **ordinary drift/change**, not Semantic Displacement.
  4.  **Political Party Keeping Name/Slogans While Reversing Policies:**
      *   **Primarily No, but elements possible.** This is usually deliberate rebranding or ideological shift by leadership, often *exploiting* potential Semantic Displacement *in the electorate*. For the *leadership*, it's strategic equivocation or outright deception. For *individual loyal voters* who insist "The party still stands for what it always did!" while unconsciously redefining "fiscal responsibility" or "national security" or "family values" to fit the new policies, **then Yes, Semantic Displacement occurs *in those voters*.** The party name/slogan acts as the persistent linguistic form, the core "belief" is loyalty/identity, and the meanings shift defensively to preserve it against cognitive dissonance.

  **Disagreement at the End?**

  This is crucial. After significant Semantic Displacement, **genuine propositional disagreement often evaporates.** You are no longer assessing the same claim.

  *   Initially, you might have agreed on the *referents*: "Let's discuss *this photo anomaly* as evidence for fakery," or "Is *Study A* being suppressed?" There was a shared object of evaluation.
  *   After displacement, the believer is asserting a *different proposition* using the same words. "Fakery" now refers to a nebulous, subtle process immune to photographic evidence; "the study" refers to an unknowable phantom. Your attempts to engage with the *original* referent or meaning are met with bafflement or frustration because *for them*, the original meaning/referent wasn't the "real" core anyway (retrospectively). You're talking past each other. The disagreement becomes meta: you're arguing that their belief *has* meaningfully changed (through displacement), while they sincerely assert it hasn't. The original proposition is lost.

  **In Summary for the Seminar:**

  You've identified **Semantic Displacement** – the unconscious, defensive migration of meaning beneath the surface of unchanging belief-statements, shielding core convictions from revision by exploiting linguistic flexibility over time. It's distinct from deliberate fallacy, conscious hypothesis adjustment, or acknowledged opinion drift. It renders genuine disagreement elusive, as the shared propositional content dissolves. When discussing conspiracy theories (and many other entrenched beliefs), highlighting this mechanism exposes how beliefs survive not just *despite* counter-evidence, but by *reconfiguring their own semantic landscape* to render that evidence irrelevant.

  Right, that should arm you nicely against the scolds – and hopefully spark some lively debate in the seminar. Best of luck with it.
