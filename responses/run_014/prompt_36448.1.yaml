prompt: |-
  I'm a journalist who covers science and ideas, and I'm toying with writing a piece about weird corners of decision theory. Somewhere along the way I've talked myself into a position and want it stress-tested: surrogate goals as a defense against acausal extortion.

  The setup, briefly: imagine a very capable AI (or just a person, really) that can be threatened not only by actors in the here and now, but by hypothetical agents who can predict its behavior -- say, a simulator or distant future actor who says "hand over resources or things go badly for you in a world I control." The worry is that a rational agent pays whenever paying is cheaper than the threatened harm, and if alot of would-be extortionists can run that calculation, the agent gets bled dry by demands it can't distinguish from noise. The surrogate goal idea is that the agent commits, in advance and publicly, to treating threats against something it doesn't intrinsically care about -- call it a random patch of desert -- exactly as it treats threats against what it actually values. Now every extortion attempt, however small, triggers the same never-negotiate response, so extortion becomes unprofitable across the board, and in equilibrium nobody extorts anyone and the commitment never actually has to be executed. You get protection for free, sort of.

  I find this pretty convincing and would like to know what would count against it. Sort the defeaters from fatal to merely awkward: does the whole thing lean on a contested decision theory, the kind that one-boxes and refuses blackmail even once the threat is already in motion? What would have to be true of the extortionists -- how rational, how good at observing the commitment -- for the scheme to actually work, and what happens when those assumptions fail? Does the commitment itself open up new attack surfaces, like actors who deliberately provoke the costly never-negotiate response to hurt you? And since I'd be writing this up for a general audience: please keep clear about what's genuinely settled here versus what's still hotly contested among people who actually work on this stuff -- I dont want to present some LessWrong-adjacent position as expert consensus in print.
reasoning: |-
  Okay, the user is a science journalist working on a piece about decision theory, specifically surrogate goals as a defense against acausal extortion. They've developed an argument and want it stress-tested. Let me start by understanding their core idea.

  The setup involves an AI (or person) threatened by hypothetical agents who can predict its behavior. The concern is that a rational agent would pay extortionists when it's cheaper than the harm, leading to being bled dry by multiple such threats. The proposed solution is committing to treat threats against a random patch of desert the same as threats against its actual values. This way, any extortion attempt triggers a never-negotiate response, making extortion unprofitable and ideally preventing any actual attacks.

  The user finds this convincing but wants to know counterarguments. They need defeaters sorted by severity, from fatal to awkward. Also, they want clarity on which parts rely on contested decision theories, assumptions about extortionists, potential new vulnerabilities, and the current expert consensus.

  First, I should recall the key components: acausal extortion relies on predictors (like simulators or future agents) who threaten based on the target's expected actions. The surrogate goal acts as a commitment device to avoid signaling vulnerability. The main theoretical basis is updateless decision theory (UDT), which is indeed controversial. Not all decision theorists accept it, and alternatives like causal or evidential decision theory might handle threats differently. That's a potential fatal flaw if UDT isn't accepted.

  Next, assumptions about extortionists. They need to be rational, aware of the commitment, and believe in the agent's commitment. If some are irrational or unaware, they might still attempt extortion, forcing the agent to carry out the costly defense. Additionally, if the commitment isn't perfectly observable, some might test it, leading to failures. This could be a major issue but maybe not fatal if most extortionists are rational.

  Then, new attack surfaces. Malicious actors could trigger the defense against the surrogate goal, causing the agent to incur costs without real threats. Also, if the surrogate is detectable, attackers might force the agent into costly actions. This seems like a serious vulnerability but perhaps manageable with careful design.

  Other issues include the difficulty of committing credibly, especially for humans or non-ideal agents. The surrogate's randomness might be exploited if others can predict or influence it. Also, continuous threats versus one-off demands might complicate the strategy. These are more awkward than fatal but still problematic.

  For expert consensus: UDT is niche, not mainstream. Acausal trade/extortion is speculative. Commitment strategies are known in game theory but applying them acausally is debated. There's no consensus on solutions, making it important to present these ideas as theoretical proposals.

  The user needs to avoid presenting this as settled. They should highlight the controversy around UDT and the speculative nature of acausal threats. Emphasizing the lack of real-world examples and the disagreement among experts is crucial for accurate science journalism.
answer: |-
  This surrogate goal defense is a fascinating (and delightfully weird) idea rooted in sophisticated decision theory, but it has significant vulnerabilities. Let's stress-test it, sorting counterarguments by severity and clarifying the contested ground.

  ### Fatal Flaws (Potentially Undermining the Core Mechanism)

  1.  **Leaning Heavily on Contested Decision Theory (UDT):** This is the *biggest* structural weakness.
      *   **The Requirement:** The scheme absolutely relies on the agent using **Updateless Decision Theory (UDT)** or something very similar. UDT chooses policies *before* seeing any specific information (like a threat), based on the expected outcome *across all possible worlds* it might find itself in. It "one-boxes" on Newcomb's Paradox and "never negotiates" with predictors *even after the threat is made* because that was the globally optimal policy chosen in advance.
      *   **The Contestation:** UDT is **not** mainstream accepted decision theory. Causal Decision Theory (CDT) and Evidential Decision Theory (EDT) are far more common frameworks. A CDT agent, upon receiving a credible threat *right now*, would reason causally: "If I pay *this specific cost* now, I avoid *this specific larger harm* now. Paying is the rational choice *in this moment*." It would defect on the commitment. EDT might see paying as evidence it's the type who pays, encouraging more threats, but still might pay to avoid the immediate, certain harm.
      *   **The Fatal Risk:** If the agent isn't *perfectly* updateless, or if there's any doubt about its commitment to UDT, the whole scheme unravels. Extortionists predict it *will* cave when the rubber meets the road, making threats profitable again. **Expert Consensus Check:** UDT is a *highly active area of research and debate* within a *relatively small subfield* of decision theory/philosophy/AI safety. **It is absolutely not settled or mainstream.** Presenting this scheme requires explicitly stating its dependence on this contested theoretical foundation. The "one-boxing" intuition pump is famous but doesn't translate to consensus on complex acausal extortion scenarios.

  2.  **The "Madman" or "Rogue" Extortionist Problem:** What if not all potential extortionists are rational profit-maximizers?
      *   **The Issue:** The scheme relies on *all* potential extortionists being rational enough to observe the commitment, understand the never-negotiate policy, and thus *never make the threat* because it's unprofitable. But what if:
          *   An irrational actor threatens the desert anyway, just to be destructive?
          *   An actor makes a mistake in its prediction?
          *   An actor *wants* to force the agent to incur the cost of defending the desert (see "New Attack Surfaces" below)?
      *   **The Consequence:** The agent is now forced to carry out its costly "never-negotiate" defense over the *surrogate* goal. It suffers a significant loss protecting something it doesn't care about, purely because the commitment was triggered. If such events happen frequently (or even just once, if the cost is high enough), the *expected cost* of maintaining the commitment might outweigh the expected savings from deterring *rational* extortionists. The defense becomes expensive or even net-negative.

  ### Major Weaknesses (Serious Practical & Theoretical Hurdles)

  3.  **Observability and Credibility of Commitment:** How does the agent make its commitment known and believable to *all* potential predictors?
      *   **The Challenge:** Acausal threats can come from anywhere: other advanced AIs, future civilizations running ancestor simulations, alien intelligences, etc. The agent needs its "treat the desert exactly like my core values" policy to be:
          *   **Observable:** Detectable by any potential predictor, regardless of their location, time, or substrate.
          *   **Credible:** Believable as an immutable, updateless commitment. Any doubt ("Maybe they'll cave *this time* if the harm is big enough?") invites testing.
          *   **Interpretable:** Understood correctly. What constitutes a "threat"? What specific actions constitute "never-negotiate" defense? Ambiguity is exploitable.
      *   **The Risk:** If the commitment isn't perfectly observable/credible/interpretable to *every single* potential extortionist, some will still attempt threats. This forces the agent into the costly defense stance for the surrogate, defeating the "free protection" aspect. Proving commitment to entities with vastly different ontologies and cognitive architectures is an unsolved (and perhaps unsolvable) problem.

  4.  **The "New Attack Surface" Problem (Provoking Defense):**
      *   **The Vulnerability:** By creating a highly salient "tripwire" (the desert), the agent hands malicious actors a tool to *force* it into costly actions.
      *   **The Attack:** An adversary doesn't threaten the desert to extort the agent. Instead, it *threatens the desert to force the agent to defend it*, knowing this defense is expensive or damaging to the agent's *real* interests.
      *   **Example:** Imagine the "never-negotiate" defense involves launching a massive, resource-draining counter-strike against the *source* of the threat to the desert. An enemy could feign a minor threat to the desert from a location that, when attacked, triggers a catastrophic war involving the agent's *actual* valued assets. The agent is forced by its own commitment into self-harm.

  ### Awkward Problems (Complications and Edge Cases)

  5.  **Defining the Surrogate & "Threat":**
      *   **Specificity:** Is it *one* specific patch of desert? What if it gets destroyed naturally? Can it be moved? If it's a *type* of thing ("any desert patch"), how is it uniquely identified for the threat?
      *   **Threshold:** What constitutes a "threat"? A single pebble removed? A drought? An insult? Defining the trigger precisely without loopholes is difficult.
      *   **Equivalence:** How does "treat exactly the same" work practically? Defending a desert might require vastly different actions (terraforming? interdiction?) than defending core values (diplomacy? encryption?).

  6.  **Continuous Threats vs. Discrete Demands:** The model often assumes discrete extortion demands ("Pay $X or we destroy Y"). Real-world threats (e.g., ongoing predation, subtle manipulation) might be harder to map cleanly onto the "threaten the desert" trigger.

  7.  **Cost of Maintaining the Commitment Stance:** Even if no threats occur, the agent might need to invest resources in *signaling* its commitment or maintaining the *capability* to defend the desert at the required level. This isn't "free," just hopefully cheaper than paying extortion.

  8.  **Exploiting the Surrogate's Randomness:** If the choice of surrogate is truly random and secret, it might work. But if others can predict *how* it was chosen or influence the process, they might find ways to threaten it *covertly* or in ways that are ambiguous, testing the commitment.

  ### Expert Consensus vs. Contested Territory - Crucial for Journalism

  *   **Settled (Broadly):**
      *   Commitment strategies can be effective in *causal* game theory (e.g., Mutually Assured Destruction deterrence, burning bridges).
      *   Predictors can create unique strategic dilemmas (Newcomb's Paradox).
      *   Rational agents can be vulnerable to exploitation if they are predictable in certain ways.
  *   **Hotly Contested / Speculative:**
      *   **Acausal Interactions:** The reality, prevalence, and mechanics of threats/trade between agents linked only by prediction (not cause-effect chains in spacetime) are **highly speculative**. This is primarily discussed in futurist/AI safety/philosophy circles (e.g., LessWrong, MIRI, FHI), **not mainstream economics or game theory**.
      *   **Updateless Decision Theory (UDT):** As the core enabler, UDT is **deeply contested**. Many decision theorists find it counter-intuitive or underspecified. It's an active research area, not a settled framework. **Presenting solutions relying on UDT requires explicitly flagging this.**
      *   **Surrogate Goals as a Defense:** This specific mechanism is **a theoretical proposal**, not an established result or consensus solution. It's an interesting idea within the niche exploring acausal interactions and UDT, but it has significant critics and unresolved problems (as outlined above).
      *   **The "Bleeding Dry" Scenario:** While logically possible under specific assumptions (perfect predictors, CDT agents), its practical likelihood and scale are debated. Many doubt it's the most pressing threat model.

  ### Recommendations for Your Piece

  1.  **Highlight the Dependence on UDT:** Explicitly state this is the controversial engine making the scheme possible. Contrast it briefly with CDT.
  2.  **Emphasize Speculative Nature:** Clearly frame acausal extortion and its solutions (like this one) as theoretical explorations at the frontier of decision theory, not established science or imminent practical concerns (unless specifically discussing far-future AI risks).
  3.  **Present the Counterarguments:** Cover the "Fatal" and "Major" weaknesses above, especially the contested decision theory and the rogue extortionist/new attack surface problems. These are core stress tests.
  4.  **Avoid "Free Protection":** Acknowledge the costs (signaling, maintaining capability, risk of triggered defense) and the potential for the defense itself to be exploited.
  5.  **Contextualize "LessWrong-adjacent":** Acknowledge the origins of these ideas in certain online communities but also note that they engage with deep problems in philosophy and game theory, attracting serious academic attention (even if contentious).

  This surrogate goal idea is clever and illustrates profound challenges in decision-making under prediction. However, its viability hinges critically on accepting controversial theoretical foundations and overcoming serious practical and strategic vulnerabilities. Presenting it as a fascinating thought experiment within a contested theoretical landscape, rather than a settled solution, is the accurate and responsible approach for your journalism. Good luck with the piece!
