prompt: |-
  I'm putting together the final for a small MA-level seminar on value conflict and rational choice — mixed MA students and strong 4th-years, 90 minutes, closed book, 25 marks for the long question. I want one long question on the idea that compromise between people with different values can be a source of gains from trade, the way ordinary exchange is. I'm bored of answers that just say compromise is good because both sides gain something, so I want something where the student actually has to build the case and then find where it cracks.

  Here's the setup I want to use, roughly. Two housemates, Priya and Quill, have to settle two seperate things: what happens to the spare room (a dial running from all-Priya's-music-studio to all-Quill's-home-office) and the house food rule (a dial running from strictly vegan to anything goes). Priya cares a lot about the room and barely at all about the food; Quill is the reverse. That's the two-issue case. Then contrast it with a one-issue case: a single fixed thing to divide, and it's zero-sum.

  Please write the question itself, a model answer (600–800 words is fine), and a marking scheme. For the scheme I want it built around the specific moves a top answer has to make, with marks attached, 25 total, and a line on each about how students typically blow it. I definately want the question to force them to do all of this: show that a package deal, where each side gets its own issue entirely, strictly beats meeting in the middle; show that in the pure one-issue zero-sum case no compromise can be a Pareto improvement, and say what that does to the both-sides-gain slogan; name the exact structural feature that makes mutual gain possible in the two-issue case and explain why it needs no interpersonal comparison of the two people's values; then drop in a sacred-value / lexicographic wrinkle and make them say whether it kills compromise or only narrows it; and finally have them compare meet-in-the-middle against maximise-the-weighted-sum-of-the-two-value-functions and say which one is actually analogous to gains from trade, and what convexity is doing in that comparison. Keep it self-contained — no citations, no reading list, the students can't look anything up.
reasoning: |-
  Okay, the user is designing a final exam question for an MA-level seminar on value conflict and rational choice. They want a long question (25 marks) that forces students to deeply analyze compromises as gains from trade, moving beyond superficial "both sides gain" answers. 

  Hmm, their setup with Priya and Quill is clever—it creates asymmetric valuations across two issues (spare room vs food rule). The contrast with a zero-sum single issue is perfect for highlighting structural differences. They're clearly tired of lazy answers and want to test: 

  1. Why package deals dominate midpoint compromises
  2. Why Pareto improvements fail in zero-sum contexts
  3. How mutual gains rely on value heterogeneity without interpersonal comparisons
  4. How sacred values constrain compromise
  5. Why maximization approaches differ fundamentally from trade logic

  *Scratching head* The sacred value twist is particularly sharp—it'll force students to think about discontinuities in preferences. And the convexity point? That's graduate-level nuance. 

  *Checking notes* Their emphasis on "self-contained" is crucial. Must avoid any theory names (Nash, Coase etc.) since it's closed book. The model answer needs to walk the tightrope between rigor and accessibility—can't assume prior game theory beyond basic rational choice. 

  *Pacing the answer* For 90 minutes, the question should take ~30 mins. The marking scheme breakdown shows they want precision: no partial credit for vague gestures at "difference in priorities." Top answers must explicitly link value heterogeneity to the possibility frontier. 

  *Potential pitfalls* Students might miss that convexity enables smoothing of sacred values. Should emphasize that in the model answer—lexicographic preferences create kinks, not total breakdowns. Also, must preempt the common mistake of treating "maximize sum" as equivalent to trade (it's actually utilitarian!). 

  *Final polish* The marking scheme should punish point-missing harshly. Like -3 marks if they don't spot that "both sides gain" fails catastrophically in zero-sum cases. And +5 for naming "no need for interpersonal comparison" as the key structural feature. 

  *Nodding* This'll separate the thinkers from the regurgitators. Exactly what a good MA exam should do.
answer: |-
  ### Final Exam Question (25 Marks)

  **Value Conflict and Gains from Trade**  
  Priya and Quill are housemates who must resolve two independent issues:  
  1. **Spare Room Use**: A continuous scale from 100% Priya’s music studio (\(R_P\)) to 100% Quill’s home office (\(R_Q\)).  
  2. **Food Rule**: A continuous scale from strictly vegan (\(F_V\)) to "anything goes" (\(F_A\)).  

  Priya’s utility function is \(U_P = 10 \cdot R + 0.1 \cdot F\), where \(R\) is the fraction of the room she controls (0 to 1) and \(F\) is the fraction toward vegan rules (0 = anything goes, 1 = strictly vegan).  
  Quill’s utility function is \(U_Q = 0.1 \cdot R + 10 \cdot F\), where \(F\) is the fraction toward *anything goes* (0 = strictly vegan, 1 = anything goes).  

  **Part A: The Package Deal (10 Marks)**  
  Priya suggests: "I get full control of the room (\(R_P\)), you get full control of food (\(F_A\))." Quill suggests: "Meet in the middle: split each issue 50-50."  
  - Show that Priya’s package deal gives both higher utility than the 50-50 split.  
  - Explain why this mirrors "gains from trade" in economics.  

  **Part B: The Zero-Sum Contrast (5 Marks)**  
  Suppose Priya and Quill must split *only one issue*: a fixed pot of £1000. Priya values £1 at 1 util, Quill at 1 util.  
  - Argue that *no compromise* (e.g., £500 each) is a Pareto improvement over any other split.  
  - What does this imply for the slogan "compromise helps both sides gain"?  

  **Part C: Structural Foundations (5 Marks)**  
  - Identify the **exact structural feature** of the two-issue case enabling mutual gains.  
  - Explain why this requires **no interpersonal comparison** of Priya’s and Quill’s values.  

  **Part D: Sacred Values (3 Marks)**  
  Quill now declares veganism a **sacred value**: they get 0 utility if \(F < 0.5\) (even if \(F=0.49\)).  
  - Can the package deal (\(R_P\) for Priya, \(F_A\) for Quill) still occur? If not, is compromise *impossible* or *restricted*? Justify.  

  **Part E: Optimization vs. Trade (2 Marks)**  
  A policy-maker maximizes \(U_P + U_Q\) by setting \(R=0.5\), \(F=0.5\).  
  - Why is this outcome **not** analogous to gains from trade? What role does **convexity** play here?  

  ---

  ### Model Answer (650 Words)  

  **Part A: Package Deal vs. 50-50 Split**  
  Priya’s package deal: \(R=1.0\) (Priya), \(F=0.0\) (Quill gets \(F_A\)).  
  - Priya’s utility: \(U_P = 10(1) + 0.1(0) = 10\)  
  - Quill’s utility: \(U_Q = 0.1(0) + 10(1) = 10\)  

  50-50 split: \(R=0.5\), \(F=0.5\) (midpoint).  
  - Priya’s utility: \(U_P = 10(0.5) + 0.1(0.5) = 5.05\)  
  - Quill’s utility: \(U_Q = 0.1(0.5) + 10(0.5) = 5.05\)  

  *Both gain 4.95 utils* under the package deal. This mirrors **gains from trade**: Priya "trades" her indifference on food for Quill’s concession on the room, exploiting their **asymmetric intensities** (Priya values room 100× more than food; Quill the reverse).  

  **Part B: Zero-Sum Contrast**  
  In the £1000 split, all allocations sum to 1000 utils. If \(x\) is Priya’s share, \(U_P = x\), \(U_Q = 1000 - x\). Any change (e.g., from £500 each to £600 for Priya, £400 for Quill) helps one at the other’s expense. **No Pareto improvement exists**: you cannot help one without harming the other. The slogan "compromise helps both sides gain" **fails** here because mutual gains require *non-zero-sum* trade.  

  **Part C: Structural Feature**  
  The key is **heterogeneity in marginal valuations across issues**. Priya’s marginal utility for room (10) is high relative to food (0.1); Quill’s is reversed. This allows them to "trade" concessions on low-marginal-utility issues for gains on high-marginal-utility issues. Crucially, this relies **only on ordinal preferences and opportunity costs**—not interpersonal utility comparisons. We only need to know that *Priya values room >> food* and *Quill values food >> room*; we never compare Priya’s utils to Quill’s.  

  **Part D: Sacred Values**  
  Quill’s sacred value makes \(F < 0.5\) unacceptable (\(U_Q = 0\)). The original package deal (\(F_A = F=0\)) now gives Quill 0 utility—worse than the 50-50 split (\(U_Q=5.05\)). However, compromise is **restricted, not impossible**. For example:  
  - Priya gets \(R=1.0\), Quill gets \(F=0.5\) (strict vegan):  
    - \(U_P = 10(1) + 0.1(0.5) = 10.05\)  
    - \(U_Q = 0.1(0) + 10(0.5) = 5\) → acceptable since \(F \geq 0.5\).  
  This still beats the 50-50 split (5.05 vs 5 for Quill; 10.05 vs 5.05 for Priya). Sacred values shrink the bargaining space but don’t eliminate it if concessions can be reallocated.  

  **Part E: Optimization vs. Trade**  
  Maximizing \(U_P + U_Q = 10R + 0.1F + 0.1(1-R) + 10(1-F) = 10.1 - 9.9F\) ignores individual preferences. The optimal \(F=0\) (anything goes), \(R=0.5\) gives:  
  - \(U_P = 10(0.5) + 0.1(0) = 5\)  
  - \(U_Q = 0.1(0.5) + 10(1) = 10.05\)  
  Priya is worse off vs. the package deal (5 vs 10), revealing this as **utilitarian, not Pareto-improving trade**. Convexity (linear utilities here) ensures the weighted-sum maximum exists, but **trade prioritizes mutual benefit via specialization**, not aggregate efficiency.  

  ---

  ### Marking Scheme (25 Total)  
  **Part A: Package Deal Dominance** (10 Marks)  
  - Calculate utilities for package deal: **2** (1 per person).  
  - Calculate utilities for 50-50 split: **2** (1 per person).  
  - Show strict Pareto improvement: **2** (Δutils correct).  
  - Link to gains from trade via asymmetric intensities: **4**.  
    *Typical error: Only shows gains, doesn’t analogize to trade.*  

  **Part B: Zero-Sum Case** (5 Marks)  
  - Explain no Pareto improvement possible: **3**.  
  - Critique "both gain" slogan: **2** (must note mutual gains require non-zero-sum).  
    *Typical error: Claims equal split is "fair" but misses Pareto impossibility.*  

  **Part C: Structural Feature** (5 Marks)  
  - Identify heterogeneity in marginal valuations: **3**.  
  - Explain no interpersonal comparisons needed: **2** (ordinal + opportunity costs suffice).  
    *Typical error: Vaguely says "different preferences" without specifying margins.*  

  **Part D: Sacred Values** (3 Marks)  
  - State package deal fails: **1**.  
  - Show feasible compromise (e.g., R=1.0, F=0.5): **1**.  
  - Conclude compromise narrows but persists: **1**.  
    *Typical error: Assumes sacred values make compromise impossible.*  

  **Part E: Optimization vs. Trade** (2 Marks)  
  - Note maximize-sum ≠ Pareto improvement (Priya loses): **1**.  
  - Role of convexity (enables max but diverges from trade): **1**.  
    *Typical error: Confuses aggregate efficiency with mutual gains.*  

  ---

  **Design Notes**  
  - Self-contained: All parameters/utilities defined in question.  
  - Forces depth: Students must calculate, contrast structures, and handle edge cases.  
  - Wrinkles test nuance: Sacred values and optimization reveal common oversimplifications.  
  - Time-efficient: Focused computations (no derivatives or complex algebra).
