answer: |-
  ## Brainstorm: Hospice & the Fractured Self
  * **Core Tension:** Nurse's professional duty (objective attitude - seeing patient as ill, exempt from blame) vs. human reactive attitude (resentment at cruel words). Strawson’s "exemption" becomes blurred, messy.
  * **Setting:** NHS hospice. Sensory details vital: antiseptic (TCP?), overboiled veg, weak tea, worn linoleum, institutional lighting, muffled sounds of pain/confusion. British specifics: NHS lanyard, "DNACPR" form, Radio 4 in background.
  * **Characters:**
      * **Nurse (Protagonist - POV):** Experienced, usually compassionate, fraying edges. British pragmatism warring with deep hurt. Name: Fiona (grounded, no-nonsense).
      * **Patient:** Mr. Finch. Former headmaster? Explains articulate cruelty. Physically diminished but eyes retain intensity. Dementia erratic – lucid flashes are sharp, cruel; confusion is childlike, vulnerable.
  * **Philosophical Hook:** The flicker is key. Just as Fiona *achieves* objective detachment ("It’s the disease"), he becomes lucid and targets her precisely. Just as resentment flares ("He *means* that!"), he dissolves into confusion, becoming pitiable/exempt. She can't settle into either attitude. Exhaustion amplifies the failure.
  * **Emotional Arc:**
      1. **Resentment Simmering:** Routine care, internal monologue replaying his barbs ("useless", "clumsy oaf").
      2. **Objective Attempt:** Reminding herself of pathology, clinical focus.
      3. **The Flicker & Collapse:** A lucid, cruel attack *mid-detachment*. Then immediate, bewildered confusion. Her control shatters – reactive anger flares, then guilt as he becomes childlike.
      4. **Ambiguous Resolution:** No neat philosophical answer. Maybe just presence, a weary hand on his, acknowledging the messy, exhausting reality of holding two contradictory truths.
  * **Key Scene:** Crucial medication time. He's lucid, delivers a calculated insult about her competence. As she reacts internally, he suddenly doesn't recognise the spoon, asks for his long-dead mother. Her anger has nowhere to land.
  * **Language:** British English throughout. Restrained prose reflecting Fiona’s professionalism, punctuated by raw, internal bursts of feeling. Free indirect discourse to blend her thoughts with narration.

  ---

  ## Flicker

  The smell of TCP and overcooked sprouts clung to the air in Beechwood Hospice, a scent Fiona associated more with institutional defeat than comfort. Outside Room 7, she paused, squaring her shoulders beneath her crumpled tunic. *Objective attitude*, she recited silently, the phrase feeling flimsy against the familiar knot of resentment tightening in her chest. *He’s exempt. It’s the Lewy bodies, the plaques, the tangles. Not him.*

  Pushing the door open, the familiar tableau: Mr. Finch, shrunken beneath the NHS-standard blankets, his hawkish profile sharp against the pillow. The lucidity was unpredictable, a faulty bulb flickering in a condemned building. Sometimes, like now, his eyes held a disconcerting clarity.

  “Ah. The Incompetent.” His voice, though weak, was precise, cutting. No trace of confusion. “Come to fumble with the pillows again? Or perhaps spill more water? Remarkable, really, how one person can consistently fail at the simplest tasks.”

  Fiona’s jaw tightened. *Objective. Exempt.* She focused on the practical: straightening the sheet, checking the water jug. “Good afternoon, Mr. Finch. Time for your medication.” Her voice was level, a professional monotone honed over fifteen years.

  “Medication?” He snorted, a dry, papery sound. “To prolong *this*? Or your employment? Tell me, Nurse… Fiona, isn’t it? Do they measure competence here by the sheer volume of indignity inflicted? Because you excel.”

  The words landed like shards. Yesterday, confused and trembling, he’d called her ‘Mummy’. Today, the headmaster who’d terrorised generations of schoolboys was back, and his target was her. Resentment, hot and acrid, surged – the pure, reactive desire to snap back, to make him *feel* the sting. *He knows exactly what he’s saying. He sees me. This isn’t the disease, this is him.*

  She reached for the pill pot, fingers trembling slightly. *No. Strawson was right. This *is* the disease. The cruel clarity *is* the pathology manifesting. He’s not choosing this malice; it’s erupting from the ruin. Objective. Detached. See the illness.* She took a slow breath, the clinical mantra a shield. “Just open wide, Mr. Finch. This’ll help.”

  His eyes locked onto hers, that unnerving lucidity burning. “Help? You think doling out chemical oblivion constitutes ‘help’? You’re a glorified caretaker of decay. A useless custodian of the inevitable.” Each word was a scalpel, probing for weakness.

  *Useless.* The word echoed. The shield cracked. The objective attitude dissolved like smoke. Fury, white-hot and personal, flared. He *was* responsible, in this moment! He saw her, recognised her, and chose cruelty. She opened her mouth, a sharp retort forming on her tongue—

  And the light vanished from his eyes. Just… snuffed out. His gaze slid past her shoulder, wide and bewildered, filling with a child’s panic. The fierce intelligence crumpled into vacant fear. His hand, parchment-thin, fluttered weakly on the blanket. “Mummy?” he whispered, his voice suddenly thin, reedy, lost. “Mummy, where’s my satchel? The headmaster… he’ll be ever so cross if I’m late.”

  The shift was instantaneous, absolute. The vengeful headmaster gone, replaced by a terrified little boy awaiting punishment. Fiona’s anger, poised to strike, met only empty air. It recoiled, twisting instantly into a sickening wave of guilt that stole her breath. He wasn’t exempt *or* responsible. He was both, flickering between states faster than she could adjust her moral compass.

  The reactive resentment curdled, sour and useless. The objective detachment felt like a lie, a denial of the very real, very personal hurt he’d inflicted seconds ago. How could she detach from *that*? Yet, how could she hold this trembling, lost child accountable?

  The pill pot felt heavy in her hand. The silence stretched, thick with the hum of the overhead light and Mr. Finch’s shallow, frightened breaths. Philosophy offered no clean category for this fracture.

  “It’s alright,” Fiona murmured, her voice rough. The professional calm was gone, replaced by a weary, emotional rawness she rarely showed. Not detached. Not reacting. Just… present in the impossible mess of it. She didn’t try to explain he was in a hospice, not school. She simply placed a hand, gently, over his fluttering fingers on the blanket. His skin was cool, papery. “Nobody’s cross. You’re alright.”

  He didn’t seem to hear, his eyes still searching the ceiling for his long-dead mother and the missing satchel. The resentment hadn’t vanished; it lay like cold ash in her gut, mixed with pity, exhaustion, and the profound frustration of a puzzle with no solution. Strawson’s neat boxes – reactive or objective, responsible or exempt – lay shattered on the worn linoleum.

  Fiona picked up the water glass, her reflection warped in its curve – a tired woman in blue, holding space in the unbearable, flickering limbo between the man who wounded and the child who was lost. She lifted the spoon again, not as a custodian of decay, but as a witness to the cruel, confounding flicker of a vanishing self. The only attitude left was a heavy, bruised endurance. “Just a sip, Mr. Finch,” she said, the words tasting of TCP and unshed tears. “Just a little sip.”
