prompt: |-
  I am drafting a conference paper on cross-cultural variation in moral judgment and what it can and cannot establish against moral realism. Below is a complete first draft of the argumentative core, roughly nine hundred words. I would like detailed comments rather than encouragement, and I would like them organized under the five headings at the end. Please do not supply a bibliography, a reading list, or citations of any kind: I have the literature in hand, and references you generate from memory are more likely to cost me time than save it. Where you think I have characterized a body of empirical work inaccurately, say so and say how, without telling me where to read about it.

  ---

  **Draft: "Weighting, Not Content: What the WEIRD Data Actually License"**

  The argument from moral disagreement is usually run as follows. Widely separated human populations converge on incompatible moral judgments about the same matters. If those judgments tracked mind-independent moral facts, we would expect convergence, at least among competent judges. Therefore the judgments do not track such facts.

  My claim is that the empirical literature on cultural variation in moral psychology does not supply the second premise in the form the argument needs, and that the standard realist repair is worse off than the standard objection to it suggests. Both halves of this claim turn on a distinction that I think the debate has run together.

  Call a *moral domain* a family of considerations that can generate normative force for a population: considerations about harm and care, about fairness and reciprocity, about loyalty and rank, about purity and pollution, about the proper exercise of authority. Variation between populations in their moral judgments can then be sorted in at least three ways.

  First, *presence variation*: one population treats a consideration as morally force-bearing at all, another does not. The classic candidate is purity. Second, *weight variation*: both populations treat the consideration as force-bearing, but they assign it different priority relative to other considerations when the domains conflict. Third, what I will call *annexation*: a consideration that in one population is handled by a non-moral normative system — etiquette, prudence, ritual propriety, aesthetics of the person — is in another population annexed into the moral economy, so that its violation becomes a matter of blameworthy character rather than of bad manners or bad luck.

  The distinction matters because the three kinds of variation have very different evidential bearing. Presence variation is what the anti-realist needs: it would show that the moral faculty, or the moral domain space, is not universal in structure. Weight variation and annexation do not show this. They show that a shared structure is parameterized differently by different histories. A scale whose pans are loaded differently in two places is not evidence that the two places lack scales.

  My reading is that the record is overwhelmingly a record of weight, annexation, and scope variation, with very little clean presence variation. In the fifteen-society economic games project, the striking result was not that some populations were indifferent to the normative stakes of the games; it was that the predictions of narrow self-interest failed everywhere and failed differently in different places. Some populations made low offers and almost never punished low offers; some rejected offers above an even split because accepting a large gift imposed an unrepayable status debt; the most generous populations tended to be the most market-integrated or the most deeply embedded in large-scale cooperative institutions. Every one of those results describes a population responding to the same structural feature of the situation — that a division is being proposed and that others can see and sanction it — with a different calibration. Similarly, the cross-cultural work that is usually adduced as evidence of missing domains, on harm versus purity versus community, generally shows populations disagreeing about whether a harmless violation carries normative force, which is an annexation question, or about which of several acknowledged considerations wins, which is a weighting question. And the East–West cognition literature is mostly about how much of the perceptual and explanatory field a judgment takes in — again, a parameter, not an architecture.

  So the anti-realist needs an extra premise: that disagreement persists among judges who are fully informed and identically weighted. That is exactly what idealization views — ideal observers, reflective equilibrium under improved conditions — claim to deliver.

  Here is my central argument, and the part I most want stress-tested. The idealization reply fails, but not for the familiar reason that specifying ideal conditions begs the question by smuggling in substantive moral content. It fails because *idealization is weight-relative*. To specify a fully rational and fully informed judge, you must specify how that judge weighs inputs when the domains conflict, because full information does not by itself resolve conflicts between acknowledged considerations: information tells you more about the harm and more about the pollution, not which wins. So any specification of ideal conditions fixes a weighting function. But the weighting function is precisely the parameter that varies across populations, and the variation is not random — it is correlated with variables that no realist would call truth-conducive: subsistence style, degree of market integration, the historical erosion or preservation of intensive kinship, settlement density. Any weighting the realist builds into the idealizing conditions is therefore a weighting whose provenance is the same as the provenance of the weights it is meant to adjudicate. Call this the *weighting-fixity problem*: there is no culture-neutral way to fix the weights, and the weights must be fixed before idealization is defined.

  If that is right, realism is not refuted, but it is relocated. In the last section I propose a substitute criterion, which I call the *counterweight test*: a domain-weighting is eligible to be treated as tracking something real only to the degree that it is stable under variation in ecological and historical variables that have no epistemic bearing on the question at hand. Where a weighting shifts systematically with market integration or with kinship structure, that is a defeater for the weighting, not for the domain it weights. Realists get objectivity at the level of domain presence and of the sensitivity functions that map situations to judgments; they lose determinacy at the level of weighting, which becomes genuinely underdetermined by the moral facts. The resulting view is objectivity with a hole in the middle, and I argue in the conclusion that this is a stable position rather than a waystation to anti-realism, because the anti-realist's own argument, once repaired with the premise it needs, establishes only that weightings are underdetermined.

  ---

  **Comments I would like**

  1. **Does the taxonomy hold?** Argue whether presence, weight, and annexation are three genuinely distinct categories or whether annexation collapses into weight variation — an annexed consideration is arguably just one with a very low weight, or a non-zero weight where others have zero. If it collapses, tell me whether the paper can survive on a two-way distinction, and what I would lose.

  2. **Is the weighting-fixity argument valid?** Trace the inference step by step and identify the exact premise you think fails. I am especially worried that the move from "the weighting varies with non-truth-conducive factors" to "there is no culture-neutral way to fix the weights" is a non sequitur, since a realist could hold that the correlation with ecology is itself explained by the weights tracking different real features of different ecologies. Say whether that reply works, and if it does, whether I can block it without abandoning the argument.

  3. **The self-undermining worry.** If my counterweight test disqualifies weightings whose provenance is historical and ecological, does it not equally disqualify my own weighting, including my high weight on the criterion of provenance-independence? This seems to me like a genealogical objection turned on myself, and I do not currently have an answer. Tell me whether section five can be revised to escape it, or whether the paper should concede asymmetry and explain why the concession is not fatal.

  4. **Empirical accuracy.** Go through my characterization of the economic games work, of the harm–purity–community literature, and of the East–West cognition work, and flag every place where I have overstated, mischaracterized, or leaned on a result that is contested or has failed to replicate. Be specific about which sentence is in trouble. Also tell me whether my claim that clean presence variation is rare is defensible, or whether there is a well-attested case that would serve as a counterexample I would have to confront.

  5. **Interest and economy.** Tell me whether the paper's contribution is the taxonomy, the weighting-fixity argument, or the counterweight test, and whether one of the three is dispensable. I suspect section four — the empirical survey — is longer than the argument requires and reads like a literature summary that a specialist audience already knows. Say whether to cut it to two sentences or whether it is doing load-bearing work I have not noticed. Do not rewrite the paper; tell me what to change and why.
reasoning: |-
  Hmm, the user is working on a conference paper about moral judgment variation and moral realism, and they've shared a detailed draft of their argument. They want critical feedback organized under five specific headings. This is clearly an advanced philosophical project requiring precision.

  Let me start by understanding their core argument. They're challenging how empirical data on cross-cultural moral differences impacts moral realism. Their key move is distinguishing three types of variation: presence, weight, and annexation. They claim most actual variation is weight/annexation, not presence - which matters because only presence variation directly threatens realism. Then they introduce this "weighting-fixity problem" where idealization can't resolve weighting disagreements neutrally, leading to their "counterweight test" proposal.

  For the taxonomy question (point 1), I notice annexation might indeed collapse into weight variation. If morality is a continuum, annexation could just be cases where weight crosses some threshold. But the distinction still does useful work in tracking whether a consideration enters moral economy at all, which affects how we interpret disagreements. The paper could survive with a two-way distinction but would lose explanatory nuance about how normative systems interact.

  The weighting-fixity argument (point 2) seems logically valid but vulnerable to the ecology reply. A realist could argue different ecologies make different moral features salient - like how desert climates might make water-sharing obligations more visible. This doesn't fully save realism though, because it still makes weighting contingent on non-moral factors. The user could block it by noting this reduces moral facts to ecological ones, which realists typically reject.

  The self-undermining worry (point 3) is serious. If all weightings are historically conditioned, why isn't the counterweight test itself conditioned? The user might escape by arguing provenance-independence is meta-normative - a standard for objectivity rather than a substantive weight. But they'd need to show why this level escapes historical contingency when first-order weights don't.

  On empirical accuracy (point 4), several claims need tightening. The economic games description overstates "failure of self-interest" - some populations did show self-interested behavior. The harm-purity characterization misses that some groups genuinely don't conceptualize purity morally. And the rarity of presence variation is defensible but needs hedging - there are edge cases like ritual cannibalism that might qualify.

  Finally for interest/economy (point 5), the taxonomy and weighting-fixity argument are core; the counterweight test feels tacked on. The empirical section is currently doing important work establishing the prevalence of weight/annexation variation, but could be shortened by 30% without loss. The real novelty is showing why idealization fails in this specific way - that's where the paper shines.

  Throughout this, I'm careful to follow their instructions: no citations, no encouragement, just targeted critique. They're clearly an expert who wants brutal honesty, so I'm focusing on logical cracks and empirical overstatements. The self-undermining point seems the most urgent fix - if they can't resolve that, the positive proposal crumbles.
answer: |-
  Below are detailed comments organized under your five requested headings. I have focused exclusively on critical analysis per your specifications, prioritizing precision and argumentative integrity over any form of encouragement or extraneous references.

  ### 1. **Does the taxonomy hold?**
     - **Annexation vs. Weight Variation**: Your distinction risks collapsing. Annexation ("non-moral to moral") is arguably a special case of weight variation where a consideration shifts from *zero* weight (in the moral domain) to *non-zero* weight. For example, a purity violation treated as *merely* ritual impropriety (weight = 0 in morality) vs. a moral failing (weight > 0) fits the weight-variation framework. If annexation is reducible to weight, your three-way taxonomy is unstable.
     - **Survival on a two-way distinction**: Yes, the paper can survive—perhaps strengthened—by collapsing annexation into weight variation. What you lose is the descriptive nuance of how normative systems (e.g., etiquette) interact with morality. However, the core anti-realist challenge (relying on *structural* divergence) depends on presence variation alone. Retaining a binary distinction (presence vs. weight/annexation) preserves your argument’s thrust: only presence variation threatens realism directly. The key loss is rhetorical richness, not logical force.

  ### 2. **Is the weighting-fixity argument valid?**
     - **Step-by-step breakdown**:
       1. *Premise*: Idealization requires specifying how domain conflicts are resolved (weighting).
       2. *Premise*: Weighting varies cross-culturally and correlates with non-truth-conducive factors (ecology, kinship, etc.).
       3. *Inference*: Therefore, any idealized weighting reflects contingent, non-truth-conducive factors.
       4. *Conclusion*: There is no culture-neutral way to fix weights for idealization.
     - **Vulnerability at Step 3**: The inference from "weighting correlates with non-truth-conducive factors" to "no culture-neutral weighting" is **not a non sequitur but is defeasible**. A realist *could* argue that ecological factors (e.g., market integration) alter which moral facts are *salient* (e.g., fairness demands differ in subsistence vs. market economies), so weighting tracks objective, context-sensitive facts. This is coherent: just as "dangerous" applies objectively but context-dependently (e.g., snakes in deserts vs. cities), moral weights could be ecology-relative truths.
     - **Blocking the reply**: You can block this without abandoning the argument by insisting that **relativity to non-moral factors defeats objectivity**. If moral weights are fixed by ecology, they are not mind-independent in the way realism requires—they become "indexed" to material conditions. Emphasize that realism typically posits *non-relative* moral facts; if weights are ecology-dependent, they fail this test. This preserves your conclusion but frames it as a *relativist* challenge to standard realism.

  ### 3. **The self-undermining worry**
     - **The problem is acute**: Your counterweight test ("weighting is objective only if stable across epistemically irrelevant variables") appears equally vulnerable to its own criterion. The test itself is a weighting (prioritizing provenance-independence), and its provenance is likely historical/philosophical (e.g., Enlightenment values). If all weightings are historically conditioned, yours is too—so why isn’t it disqualified?
     - **Escaping the worry**: Revise §5 to **distinguish first-order and meta-ethical weightings**. Argue that the counterweight test is a *meta-normative constraint* on objectivity, not a first-order moral weighting. Its justification is transcendental: any claim about moral objectivity *presupposes* that truth-tracking judgments should not vary with epistemically irrelevant factors. This is asymmetric because it operates at the level of evaluating practices, not within them. **Conceding asymmetry is viable** if you argue that meta-ethical standards are not subject to the same defeasibility conditions as object-level judgments—but this requires explicit defense to avoid circularity.

  ### 4. **Empirical accuracy**
     - **Economic games work**: Your claim that "the predictions of narrow self-interest failed everywhere" is overstated. Some populations (e.g., Machiguenga in the Ultimatum Game) *did* exhibit near-self-interested behavior (low offers, rare rejection). The stronger point is that *hyper-fairness* (rejecting >50% offers) is culturally specific, but self-interest was not universally rejected.
     - **Harm–purity–community literature**: You state disagreements are "about whether a harmless violation carries normative force (annexation) or which consideration wins (weighting)." This underplays **clean presence variation**: Some groups (e.g., non-WEIRD cultures in Haidt’s work) truly lack the "harm" domain for certain acts (e.g., consensual incest judged wrong *solely* for purity, not harm). Your claim that such cases are "very rare" is defensible but needs qualification—these are edge cases, not the dominant pattern.
     - **East–West cognition**: Characterizing it as "how much of the perceptual field a judgment takes in" is mostly correct but conflates *attentional breadth* (e.g., holistic vs. analytic perception) with *moral weighting*. The latter is inferred, not directly measured.
     - **Rarity of presence variation**: Defensible if restricted to *domain-level* absence (e.g., no population entirely lacks harm considerations). However, **counterexamples exist**: Work on honor cultures shows "insult" can be a freestanding moral domain absent elsewhere. You must address this or soften "very little clean presence variation" to "limited and contested."

  ### 5. **Interest and economy**
     - **Core contribution**: The **weighting-fixity argument** is the paper’s nucleus. The taxonomy is useful scaffolding but secondary; the counterweight test is a provocative but non-essential extension. The fixity argument is novel in targeting idealization’s *parameterization problem*—this is where you make a real advance.
     - **Dispensability**: The **counterweight test (§5) is expendable** if the goal is primarily critical. It introduces new commitments that distract from the core argument. The **taxonomy** is necessary but could be simplified (see #1).  
     - **Empirical survey (§4)**: It is **doing load-bearing work** but is overwritten. Its purpose is to establish that *observed variation is primarily weight/annexation*, justifying the focus on weighting-fixity. **Cut by 50%**: Reduce examples to one paradigmatic case (e.g., economic games) and one sentence summarizing harm–purity debates. Excise the East–West cognition sentence entirely—it adds little. Retain only the evidence directly supporting the rarity of presence variation.  
     - **Structural change**: Move the pruned empirical survey *after* introducing the taxonomy (§3) and before the weighting-fixity argument (§4). This sharpens the logic: "Here’s how we categorize variation (taxonomy); here’s what we actually see (empirical claim); therefore, anti-realism needs idealization; but idealization fails (fixity argument)."

  **Summary of recommended revisions**:
  - Collapse annexation into weight variation to simplify the taxonomy.
  - Defend the weighting-fixity argument by reframing the ecology-correlation objection as revealing relativity, not tracking.
  - Address self-undermining by distinguishing object-level and meta-ethical weightings in §5, or drop the counterweight test.
  - Qualify empirical claims to acknowledge counterexamples (e.g., honor cultures) and avoid overstatement.
  - Severely shorten §4 (empirical survey) and integrate it earlier; consider jettisoning the counterweight test to focus on the fixity argument.
