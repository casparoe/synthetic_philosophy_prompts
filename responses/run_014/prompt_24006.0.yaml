prompt: |-
  ok so I've been chewing on the problem of old evidence and I want a consistency check before I write it up for a seminar. Here's roughly where I've landed:

  (1) I think confirmation is basically the likelihood ratio — H confirms E just in P(E|H) > P(E|~H), and the strength is the size of that ratio.

  (2) I think the problem of old evidence is a genuine live problem for this view — on my own account, the anomalous precession of Mercury's perihelion and the success of Newtonian gravity in nailing down planetary orbits just plain fail to confirm general relativity, and I think that's a real defect, not a quirk.

  (3) I'm pretty sure the fix is NOT to switch to an explanatory / inference to the best explanation account of confirmation, which would make confirmation a matter of theoritical virtues instead of probability — the problem should be solved inside the probabilistic framework.

  (4) The key, I think, is that P(E|~H) isn't actually 1 for old evidence, because the pre-existing theory that already explains E is itself fallible, so P(E|~H) < 1 and the likelihood ratio can come out above 1 after all.

  (5) I also think that for old evidence to confirm a hypothesis, the hypothesis has to do something the old theory can't — a pure redundant restatement shouldn't get any confirmatory credit.

  Can you go through these and tell me which ones actually pull against each other, wich only look like they do, and what the cheapest revision is? I genuinely don't know where the crack is, so don't assume I'd give up any particular one — rank the tensions by severity and say what would have to give in each case.
reasoning: |-
  Okay, the user is working on the problem of old evidence in confirmation theory and wants a consistency check before presenting it in a seminar. They've outlined five key points about their position. Let me unpack each of these to understand their argument.

  First, they define confirmation using the likelihood ratio: H confirms E if P(E|H) > P(E|~H). That's a standard Bayesian approach. The issue arises with old evidence like Mercury's perihelion precession, which was known before General Relativity (GR). Since E is already known, P(E) is 1, making P(E|H) also 1 if H entails E. But P(E|~H) is tricky because ~H includes all alternative hypotheses, some of which might have explained E already (like Newtonian gravity). If E is certain, P(E|~H) might be seen as 1, making the likelihood ratio 1, which means no confirmation. The user thinks this is a real problem, not just a quirk.

  Their third point rejects switching to explanation-based accounts, wanting to stay within probabilistic frameworks. Then they propose that P(E|~H) isn't 1 because the pre-existing theory (Newtonian gravity) is fallible. So even though E was observed, the probability of E given ~H could be less than 1 because ~H includes possibilities where Newton's theory is wrong. That opens up room for P(E|H) > P(E|~H). 

  The fifth point adds that H must do something new—redundant restatements shouldn't get credit. So GR must explain Mercury's precession in a way Newton couldn't, otherwise it doesn't get confirmatory boost.

  Now, where might the tensions lie? The main issue is between (1)/(2) and (4). (4) suggests that P(E|~H) < 1 because the old theory is fallible. But in a Bayesian framework, if E is already known, conditionalizing on all background knowledge K would include E. So P(E|~H, K) should be 1 because E is in K. That's the standard problem. The user's fix requires not conditioning on the full K, which includes E, but that seems necessary for confirmation to be relative to current knowledge. 

  Another tension is between (4) and (5). If we accept that P(E|~H) < 1 due to the old theory's fallibility, then any new hypothesis that entails E would get confirmatory boost, even if it's just restating the old theory. But the user wants only hypotheses that provide new explanations to get credit. So (4) might be too permissive without (5) to restrict it.

  The user might not realize how deeply (4) challenges standard Bayesian conditioning. If their solution requires omitting E from background knowledge when calculating P(E|~H), that's a significant departure. They need to justify why, in some contexts, we don't condition on known evidence. Maybe by considering the counterfactual scenario where E isn't known yet. 

  Also, ensuring that (5) is enforced probabilistically is tricky. How to differentiate between genuinely new explanations and redundant ones using probabilities alone? The user might need additional criteria beyond likelihoods, which could nudge towards explanatory virtues, but they want to avoid that. 

  Potential revisions: Embrace counterfactual probability (like Howson or Garber), where we assess what P(E|~H) would be if E weren't known. That saves (1)-(3) and addresses (4), but requires careful handling to avoid subjectivity. For (5), incorporate the ability to explain other novel predictions as part of H's confirmatory strength, which might need more than likelihoods. 

  The user's intuition about the old theory's fallibility is key. They need to formalize that ~H includes possibilities where the old theory is false, so E isn't certain under ~H. But balancing this with background knowledge inclusion remains the core tension. A possible path is to restrict background knowledge to exclude E when evaluating the likelihood, but include the old theory's existence and its fallibility. This maintains the probabilistic framework while allowing P(E|~H) < 1. 

  In summary, the biggest crack is making (4) consistent with standard Bayesian conditioning. The cheapest fix is adopting a counterfactual approach. (5) adds a constraint that might require additional machinery, but the user could argue that hypotheses failing (5) wouldn't have high P(E|H) if they're mere restatements. Overall, their points can cohere with careful adjustments, mainly around how background knowledge is handled in likelihood assessments.
answer: |-
  Here's a breakdown of your points, ranking tensions by severity and outlining the cheapest revisions needed to achieve consistency. Your core intuition is strong, but point (4) creates the most significant friction with standard Bayesianism, requiring the most substantial revision or reinterpretation.

  **Ranking of Tensions by Severity:**

  1.  **Severe Tension: (4) P(E|~H) < 1 for Old Evidence vs. Standard Bayesian Conditioning (Implied by 1 & 2)**
      *   **The Conflict:** This is *the* core tension in your proposal relative to standard Bayesianism. According to standard conditionalization, once evidence `E` is known (old evidence), it becomes part of the background knowledge `K`. Therefore:
          *   `P(E | K) = 1`
          *   `P(E | H, K) = 1` (if H entails E given K)
          *   `P(E | ~H, K) = 1` (because E is already known to be true given K, regardless of H).
      *   **Consequence:** The likelihood ratio `P(E | H, K) / P(E | ~H, K) = 1/1 = 1`. Confirmation (as defined in 1) is zero. Your point (2) correctly identifies this as a defect for the standard view.
      *   **Why (4) Pulls Against (1):** Your solution (4) requires `P(E | ~H, K) < 1`. However, within the standard framework where `K` includes `E`, this probability *must* be 1. Saying the old theory (T_old) explaining E within `~H` is fallible doesn't change this. `K` tells us `E` *is* true. Conditional on `K` (which includes E), the probability of E is 1, *even if* T_old is false. `~H` includes worlds where T_old is false *but E is still true* (because we know E is true!). The fallibility of T_old affects `P(E | T_old, K)` *before* E is known, not `P(E | ~H, K)` *after* E is known.
      *   **Cheapest Revision (Necessary):** You **must** abandon the strict requirement that `K` *always* includes the *known truth* of `E` when calculating the likelihoods for confirmation of `H` by `E`. This is the crux of the "problem of old evidence" solutions within Bayesianism. The cheapest revisions compatible with your points are:
          *   **Counterfactual Probability:** Evaluate `P(E | H, K')` and `P(E | ~H, K')` where `K'` is background knowledge *minus the fact that E is true* (but including the existence of T_old, its successful prediction of E, its dominance, *and crucially, its perceived fallibility/anomalies regarding E*). This imagines the epistemic state *just before* E was confirmed/had its significance realized for H. (Howson & Urbach, Garber styles). This directly supports your (4) and (5).
          *   **Logical Uncertainty:** Treat `E` as a logical consequence of `H` + `K`, but where the agent hasn't yet *deduced* `E` from `H`. `P(E | H, K)` represents the agent's degree of belief that `H` logically implies `E`, which could be <1 even after `E` is known, until the deduction is made/recognized. `P(E | ~H, K)` remains 1. This salvages a ratio >1 via `P(E | H, K) < 1`. (Garber, Jeffrey, et al. styles). This supports (1) & (2) but makes (4) less central and might clash slightly with the intuition behind it.
      *   **Your (4) Focus:** The counterfactual approach (`K'` without E's truth) is the best fit for your emphasis on T_old's fallibility within `~H`. In the counterfactual state `K'`, `P(E | ~H, K')` genuinely reflects the probability of E given ~H *without knowing E is true*. This probability *can* be less than 1 precisely because `K'` includes the knowledge that T_old (the best existing explanation in `~H`) is known to be flawed/anomalous regarding E (or other things, undermining complete confidence in its prediction of E).

  2.  **Moderate Tension: (5) Novel Explanation Requirement vs. Purely Probabilistic Confirmation (1)**
      *   **The Conflict:** Your definition of confirmation (1) is purely probabilistic: `P(E|H) > P(E|~H)`. Point (5) adds a *semantic* or *explanatory* constraint: H must do something "the old theory can't" and avoid being a "redundant restatement". Probability theory alone doesn't inherently distinguish between hypotheses that provide genuinely novel explanations and those that are just redescriptions or entail E trivially.
      *   **Why (5) Pulls Against (1):** A purely redundant hypothesis `H_red` (logically equivalent to T_old or a trivial consequence) *could* satisfy `P(E | H_red) > P(E | ~H_red)` under the counterfactual interpretation of (4). `~H_red` would exclude T_old (since H_red entails it), leaving only theories that arguably predict E less well. `H_red` would get confirmatory credit. You want to deny it this credit.
      *   **Cheapest Revision:** You need to incorporate the novelty requirement *into the probabilistic framework*.
          *   **`~H` Specification:** Ensure that `~H` explicitly includes the *old, successful theory* `T_old` (and its close variants) in the set of alternatives. If `H` is just `T_old` restated, then `T_old` is part of `~H` *only if* `H` is defined narrowly enough to exclude it. Defining `H` as a genuinely new theory (like GR) and `~H` as "GR is false" naturally includes Newtonian gravity (and many other things). `H` gets credit because `P(E | H, K')` is high and `P(E | ~H, K')` is lower than it would be if `~H` *only* contained viable alternatives – precisely because `~H` contains many possibilities where E is unlikely, even though it also contains `T_old` which predicts E. The fallibility of `T_old` (part of `K'`) prevents `P(E | ~H, K')` from being *as high* as `P(E | T_old, K')` alone would be. The *contrast* between `H` and the disjunction `~H` (which includes `T_old` but also many worse alternatives) creates room for `P(E | H, K') > P(E | ~H, K')` *only if* `H` is significantly *better* than `T_old` at predicting E (or other things, indirectly).
          *   **Focus on Comparative Fit:** Emphasize that the value of `P(E | ~H, K')` crucially depends on the perceived viability of `T_old` *within* `~H` at the time `K'`. If `T_old` is seen as highly reliable (low fallibility), `P(E | ~H, K')` might be close to 1, giving little confirmation to any `H`. If `T_old` is seen as flawed or anomalous regarding `E` (high fallibility - key to your (4)), `P(E | ~H, K')` drops significantly. A new `H` only provides *strong* confirmation if it offers a *better* explanation (higher `P(E | H, K')` or resolving the anomaly) *and* `T_old` is seen as inadequate (`P(E | ~H, K')` is low). A redundant `H` wouldn't change the explanatory landscape within `~H` or offer a higher `P(E | H, K')` than `T_old` already does. This leverages probability to capture the intuition behind (5).

  3.  **Minor Tension / Synergy: (3) Probabilistic Fix vs. (4) & (5)**
      *   **Assessment:** Point (3) (probabilistic fix) is *supported* by your solutions for (4) (counterfactual `K'`) and (5) (careful `~H` specification). You are explicitly rejecting IBE as the *source* of confirmation and seeking to model the confirmatory effect *within* the probability calculus. The counterfactual approach is a standard Bayesian move for old evidence. The emphasis on `T_old`'s fallibility influencing `P(E | ~H, K')` is a specific and valuable instantiation of what needs to be in `K'`. Point (5) guides how to interpret the probabilistic result. There's no inherent conflict here; (3) states the desired domain of the solution, (4) and (5) provide the specific mechanism within that domain.

  4.  **Synergy: (1) Likelihood Ratio & (2) Problem is Genuine**
      *   **Assessment:** These are foundational and perfectly aligned. (1) clearly defines confirmation. (2) correctly identifies a major weakness of (1) under standard conditionalization for old evidence. This motivates the entire project.

  **Summary of Revisions Needed for Consistency:**

  1.  **Adopt Counterfactual Probabilities (Essential for 4):** To make `P(E | ~H) < 1` meaningful for *old* evidence `E`, you must calculate likelihoods relative to background knowledge `K'` that *excludes the known truth of `E`*, but includes everything else (especially the existence, past success, and *perceived fallibility/anomalies* of the old theory `T_old`). This is the cheapest revision resolving the severe tension.
  2.  **Define `~H` Comprehensively to Include `T_old` (Essential for 5):** Ensure that the alternative hypothesis `~H` ("GR is false") includes the previously successful theory `T_old` (Newtonian gravity) as one of the possibilities within it. This allows the fallibility of `T_old` (part of `K'`) to directly impact `P(E | ~H, K')`.
  3.  **Interpret the Likelihood Ratio via Comparative Fit (Supporting 5):** The confirmatory power arises because `P(E | H, K')` is high (H predicts E), while `P(E | ~H, K')` is lowered by the disjunction of many alternatives (included in `~H`) that predict E poorly *and* crucially, by the diminished confidence in `T_old`'s prediction of E due to its recognized fallibility/anomalies (also part of `K'`). A redundant hypothesis wouldn't improve `P(E | H, K')` over `P(E | T_old, K')` and wouldn't alter the landscape within `~H`, thus gaining little confirmatory boost. This leverages probability to satisfy (5).

  **Conclusion:** Your core insights (1, 2, 3, 4, 5) are compatible and form a coherent position *if* you adopt the **counterfactual probability approach** to old evidence. The severe tension between (4) and standard conditioning is resolved by this move. The moderate tension between (5) and pure probabilism is resolved by carefully defining `~H` and interpreting the likelihood ratio as reflecting the comparative explanatory fit within the counterfactual epistemic state `K'`, where the fallibility of the old theory plays a crucial role in lowering `P(E | ~H, K')`. This approach keeps the solution firmly within the probabilistic framework (satisfying 3) while capturing why old evidence like Mercury's perihelion *did* confirm GR (satisfying 2) by making the likelihood ratio genuinely greater than 1 (satisfying 1 and 4) and requiring genuine novelty (satisfying 5).

  This is a defensible and well-motivated position for your seminar. Be explicit about adopting the counterfactual (`K'`) framework!
