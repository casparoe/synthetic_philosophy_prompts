  - Ruling 1 (weak pupils as the target).
  - Ruling 3 (overweight children as the clinic's focus).

  **Ruth's Predicted Ruling**:  
  Based on her principles, Ruth will:
  1. **Focus on the subgroup specified by the director**: "Young people [the scheme] actually reaches" means regular attendees.
  2. **Compare outcomes for that subgroup**:  
     - Halden: 55% success rate for regular attendees.  
     - Ives: 70% success rate for regular attendees.  
     Ives performs better in this subgroup.
  3. **Reinforce with absolute numbers (if applicable)**:  
     Ives had 175 successes among regular attendees vs. Halden's 55. This aligns with Ruling 1, where absolute numbers in the target group mattered.
  4. **Dismiss irrelevant metrics**:  
     - The overall rate (Halden 61% vs. Ives 55%) is less relevant because the director prioritized the reached group.  
     - Non-attendees' outcomes (Halden 63% vs. Ives 30%) are not part of the "reached" group, so they won't factor in. The unexplained discrepancy might be noted but not used, as in Ruling 3 (where study demographics were ignored).

  **Prediction**: Ruth will rule that **Ives is better** because it has a higher success rate (70% vs. 55%) and more absolute successes (175 vs. 55) among the young people the schemes actually reach.  

  **Why Bet on This Prediction?**  
  - It directly applies Ruth's subgroup-focused reasoning from Rulings 1 and 3.  
  - The director's statement provides a clear context, making the regular attendees the target subgroup. Ignoring this (e.g., defaulting to overall rates) would contradict Ruling 3.  
  - The argument about Halden's attendees being "hardest cases" is not supported by data (we lack comparability between schemes), so Ruth would likely disregard it, as in her prior rulings where subgroup definitions were taken at face value.

  ### What if the Rules Come Apart? A Further Case to Separate Them:
  Ruth's principles could conflict if:
  - The overall rate favors one option, but a mission-critical subgroup favors another.
  - No explicit context (e.g., from a director) is given to prioritize a subgroup.

  **Example Case to Test**:  
  Two tutoring programs, Alpha and Beta, serve 500 students each.  
  - **Alpha**: Overall pass rate 65%.  
