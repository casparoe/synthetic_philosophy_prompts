  Based on Ruth's three rulings, her approach consistently involves **tailoring the analysis to the most relevant subgroup or perspective for the decision-maker's specific context**, rather than defaulting to the overall rate. She prioritizes the subgroup that aligns with the program's mission, the target population, or the decision-maker's explicit goals. Here's how her rulings reveal this pattern:

  ### Summary of Ruth's Rulings and Inferred Principles:
  1. **Ruling 1 (Maths Coaching Programmes)**:
     - **Data**: Northgate had a higher overall pass rate (64% vs. Southgate's 42.5%), but Southgate had a higher pass rate for weak pupils (30% vs. 25%) and a higher absolute number of weak passes (48 vs. 20).
     - **Ruling**: Ruth favored Southgate because it served more weak pupils (the group needing help) and achieved better outcomes for them.
     - **Principle**: Focus on the subgroup that the program is primarily intended to help (e.g., disadvantaged or high-need groups), especially if they constitute the program's mission. Absolute numbers in that subgroup may reinforce the decision.

  2. **Ruling 2 (Job-Search Schemes)**:
     - **Data**: Step-Up had a higher overall employment rate (55% vs. Bridgeway's 48.75%), even though Bridgeway had slightly higher rates in both subgroups (those who got interviews and those who didn't).
     - **Ruling**: Ruth favored Step-Up because the overall rate directly measures the scheme's success for all clients.
     - **Principle**: When the goal is broad impact across the entire group (with no specific subgroup emphasized), use the overall rate. Intermediate outcomes (e.g., interviews) do not override the primary outcome.

  3. **Ruling 3 (Diets)**:
     - **Data**: Diet X had a higher overall improvement rate (60% vs. Y's 55%), but Y was better for overweight children (60% vs. 50%), while X was better for non-overweight children (62.5% vs. 50%).
     - **Ruling**: Ruth favored Y for the clinic because most of its children were overweight, making that subgroup the relevant one. She dismissed the overall rate as reflecting the study's population, not the diets' inherent effectiveness.
     - **Principle**: When the decision-maker's context defines a specific target population (e.g., a subgroup like overweight children), evaluate based on that subgroup. Ignore the overall rate if it doesn't match the target population.

  **Consistent Rule for Ruth**:  
  Ruth **chooses the metric (overall or subgroup) that best reflects the decision-maker's goals and context**. She:
  - Uses **subgroup analysis** when:
    - The program targets a specific group (e.g., weak pupils in Ruling 1).
    - The decision-maker's population aligns with a subgroup (e.g., overweight children in Ruling 3).
  - Uses the **overall rate** when:
    - The goal is to maximize aggregate outcomes for all participants, with no subgroup prioritized (e.g., Ruling 2).

  ### Application to the New Case (Mentoring Schemes):
  **Data Summary**:
  - **Halden**:
    - Overall: 244/400 in work/training (61%).
    - Regular attendees: 55/100 succeeded (55%).
    - Non-attendees: 189/300 succeeded (63%).
