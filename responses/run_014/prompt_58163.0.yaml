prompt: |-
  I'm a philosophy prof heading to a conference abroad next month and I'm realy unsure how to handle a few everyday things. At home I tip 20% even though I hate the system, I wait at empty crosswalks if kids are around, and I always join the back of the queue even when I could slip in. Where I'm going, locals basically don't tip but shops near hotels expect tourists to tip big, everyone crosses wherever, and lines are more like loose scrums. Should I just do what locals do or stick with my own habits? Give me some practical advice on what to do, and when you explain the reasoning please separate out what is pretty settled vs what is genuinely contested among people who work on norms and obligations — dont present a contested view as the consensus.
reasoning: |-
  Okay, the user is a philosophy professor heading to a conference abroad. They're unsure whether to follow local norms or stick to their own habits regarding tipping, crossing the street, and queuing. They specifically want practical advice and a clear distinction between settled views and contested areas in normativity.

  First, I need to address each of the three issues separately. For tipping, the settled view is that you should follow local customs to avoid harming workers. But in places with dual systems, like tourist areas, it's contested whether to tip or not. The professor might feel conflicted because of their dislike for tipping systems. They need actionable steps: research local practices, prepare small bills, and avoid over-tipping beyond local standards.

  Next, jaywalking. The settled view is to prioritize safety and legality. If locals cross mid-block but it's illegal, the professor should weigh safety and law. Contested areas include whether to follow local behavior when safe but illegal. Practical advice: observe locals, use crosswalks when possible, and follow pedestrian signals to avoid accidents.

  Queuing is trickier. Settled consensus is to avoid line-cutting and respect the local queue style. Contested is how assertive to be in scrum-like situations without being pushy. Tips include watching how locals form lines, being flexible, and using body language to signal position without confrontation.

  The user's deeper needs might include wanting to act ethically without feeling they're compromising principles. They might also want to navigate social situations smoothly without drawing negative attention. As a philosophy prof, they appreciate nuanced reasoning, so highlighting settled vs. contested areas is crucial. Emphasize contextual judgment and respect for local practices while maintaining personal integrity where it doesn't cause harm.
answer: |-
  Here's a practical guide tailored to your situation, clearly separating settled consensus from contested philosophical ground regarding norms and obligations:

  **Core Principle (Settled Consensus):** **Respect the local context.** Your primary obligation as a visitor is to avoid causing harm, offense, or disruption. This generally means *observing and adapting* to local conventions where they differ significantly from your own, *especially* when your actions directly impact others (like service workers or fellow pedestrians/queuers).

  ## 1. Tipping: The Pay-to-Play Tourist Trap
  *   **Settled Consensus:**
      *   **Follow the *genuine* local standard for locals.** If locals truly don't tip in restaurants, cafes, or taxis (e.g., Japan, South Korea, much of Europe outside tourist zones), *do not tip*. Tipping where it's not expected can be awkward, confusing, or even insulting (implying the worker relies on charity).
      *   **Avoid perpetuating harmful dual systems.** Tipping "tourist rates" (e.g., 20%+) in places where locals don't tip reinforces an exploitative system targeting visitors and creating wage disparities. This actively harms the local labor market norm.
  *   **Contested / Context-Dependent:**
      *   **"Tourist Zone" Pressure:** Near hotels/conference centers, workers *might* expect tips *from tourists* even if locals don't tip. Is it obligatory to tip here?
          *   **Argument For (Pragmatic):** Workers in these zones may rely on tips due to employer expectations shaped by tourists. Withholding could harm *that specific worker* expecting it.
          *   **Argument Against (Principle/Pragmatic):** Tipping feeds the harmful dual system. A small, *local-custom-aligned* token (e.g., rounding up, 5-10% max *only* if exceptional service, or leaving small change) might suffice without endorsing the 20% expectation. *Never* feel pressured to tip 20% if that's not local.
      *   **Exceptional Service:** Is there an obligation to tip *anywhere* for truly exceptional service, even if not customary? Most agree this is supererogatory (beyond obligation), not obligatory.
  *   **Practical Advice:**
      *   **Research BEFORE you go:** Look beyond travel blogs. Check government tourism sites, expat forums, or reputable travel guides for the *actual* tipping norms for locals in your destination city/country.
      *   **Prepare Small Bills/Change:** Have local currency in small denominations. If you decide a small token is appropriate in a tourist zone, you can leave it discreetly.
      *   **Observe & Ask (Subtly):** Watch what locals do. At a hotel bar, you could ask the concierge (tipping *them* might be customary!) "What's the usual practice for tipping bartenders/cafe staff here?"
      *   **Action:** **Do NOT tip 20%.** If genuine local custom is *no tip*, follow that. If in a blatant tourist trap where pressure is high, consider a *small* token (rounding up, €1/£1/$1 equivalent on a coffee, max 5-10% on a meal *only* if service was genuinely good and you feel pressured) – but view this as minimizing harm in a flawed system, not fulfilling an obligation. **Prioritize avoiding the dual system over matching your home habit.**

  ## 2. Jaywalking: Safety, Law, and the Flow
  *   **Settled Consensus:**
      *   **Obey Traffic Signals & Laws:** Your primary obligation is safety (yours and others') and respecting the law. If crossing mid-block is illegal, don't do it just because others are.
      *   **"When in Rome..." for *Safe* Conventions:** If crossing mid-block is *legal, safe*, and the *universal local practice* (e.g., observing traffic flow like in Berlin or Amsterdam), it is generally acceptable (and often expected) to adapt. Standing rigidly at an empty crosswalk when everyone else flows with safe gaps disrupts traffic and marks you as oblivious.
      *   **Context Matters (Kids!):** Your instinct re: kids is spot-on universally. Modeling safe/legal behavior near children is a settled positive obligation, even if locals are reckless. Err on the side of caution.
  *   **Contested / Context-Dependent:**
      *   **Following Unsafe/Illegal Local Behavior:** Is there *any* obligation to follow locals if they are jaywalking unsafely or illegally? Consensus is **NO.** Safety and law trump local convention in this case. Your obligation is to be safe and legal.
      *   **The "Empty Crosswalk" Dilemma:** If it's legal to cross mid-block safely, but you *prefer* using an empty crosswalk on principle, is it obligatory to adapt to the local flow? Most argue adaptation is respectful *if safe and legal*, but sticking to crosswalks *where available and functional* is never blameworthy.
  *   **Practical Advice:**
      *   **Prioritize Safety & Legality ALWAYS:** Never cross against a light just because others do, especially with fast traffic. Never step out without ensuring drivers see you and yield (or you have a safe gap).
      *   **Observe the Local Flow:** How do locals cross? Do they use crosswalks when available, or just cross anywhere with gaps? Do they wait for signals religiously?
      *   **Adapt When Safe, Legal, and Efficient:** If locals confidently cross a quiet street mid-block legally and safely, join the flow. Don't stand at an empty crosswalk pointlessly if safe crossing is possible nearby. **But:**
      *   **Stick to Crosswalks Near Kids/Chaos:** Always use designated crossings near schools, busy areas, or when your action might influence others (especially children).
      *   **Action:** **Adapt to the safe and legal local flow.** Don't recklessly jaywalk, but don't performatively wait at an utterly empty crosswalk either, if safe crossing elsewhere is the norm. Near kids or in doubt, use the crosswalk. **Prioritize safety and legality over both blind local conformity *and* rigid home-habit adherence.**

  ## 3. Queuing: The Scrum vs. The Line
  *   **Settled Consensus:**
      *   **Avoid Aggressive Cutting/Elbowing:** The core obligation is fairness and avoiding intentional disadvantage to others. Purposefully pushing past people who were clearly waiting before you is universally rude.
      *   **Respect the *De Facto* Order:** Even in a "scrum," there's usually an implicit understanding of who arrived roughly when. Your obligation is to discern and respect that rough order, not exploit chaos to jump ahead. Joining the "back" means integrating yourself behind the last person who was clearly waiting, even if the formation isn't linear.
      *   **Clarity Trumps Form:** If there *is* a clear line (e.g., ropes, signs, a very obvious queue), join the end. Ignoring a clear structure is rude anywhere.
  *   **Contested / Context-Dependent:**
      *   **"Scrum" Navigation:** How assertive can you be in a fluid environment without being unfair? How much space must you yield?
          *   **Pragmatic View:** Gentle forward movement within the scrum, maintaining awareness of who was roughly there before you, is acceptable. Don't force, but don't be a passive doormat.
          *   **Strict Fairness View:** Any movement that gains you position relative to someone who was clearly waiting before you, even without physical force, is blameworthy if it violates the perceived order.
      *   **Efficiency vs. Rigidity:** Is joining a loose scrum inefficiently ("I must find *the* absolute end") itself disruptive? Some argue adapting to the local fluidity *is* the respectful and efficient thing to do.
  *   **Practical Advice:**
      *   **Observe First:** Stand back for 30 seconds. How are people forming order? Is there a cluster near the counter? Is there a loose line snaking?
      *   **Identify the "Back":** Find the point where the last person who clearly intends to be served is positioned. Insert yourself *behind* that point.
      *   **Gentle Assertion in Scrums:** Move calmly towards the service point within the scrum. Maintain polite body language. A quiet "Excuse me" or slight gesture is better than shoving. Be aware of people near you who arrived around the same time or before.
      *   **Accept Some Fluidity:** Don't expect a rigid British queue. Be prepared for the group to move as a unit towards a new counter opening, or for the order to be slightly less precise. Focus on not *obviously* jumping ahead of someone who was waiting before you.
      *   **Action:** **Adapt to the local queue style while respecting de facto order.** Don't rigidly form a single-file line if it's a scrum, but *absolutely* do not exploit chaos to slip ahead of people who were clearly waiting before you. Find the "back" of the amorphous group and integrate. Be calmly assertive but not aggressive. **Prioritize fairness and de facto order over both rigid line-forming *and* opportunistic cutting.**

  **Overall Philosophical Summary:**

  *   **Settled:** Obligations to avoid harm, respect safety/law, and be fair are paramount. Respecting *genuine* local customs that achieve these aims is generally obligatory for visitors. Blindly imposing your home norms can be disruptive or harmful.
  *   **Contested:** The *degree* of adaptation required, especially when local practices involve ambiguity (tourist tipping, fluid queues) or potential minor safety/legal risks (jaywalking), is debated. Context, intent, and consequences matter deeply. There's no consensus that you *must* abandon your principles entirely (e.g., you can still *prefer* lines), but there *is* consensus that you must not disrupt the local equilibrium or harm individuals through rigid adherence to foreign norms.
  *   **Your Role:** As a visitor, your strongest obligations are negative: *don't* harm, *don't* disrupt, *don't* exploit. Positive obligations to perfectly mimic locals are weaker, *except* where mimicry is necessary to avoid those negative outcomes (e.g., not tipping 20% in a no-tip culture avoids perpetuating harm; moving with the pedestrian flow avoids disruption). Use your philosophical judgment, prioritize context, and err on the side of respect and non-disruption. Enjoy the conference!
