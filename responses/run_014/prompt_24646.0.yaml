prompt: |-
  I teach an intermediate graduate seminar on decision theory for philosophy and economics students (about 14 participants, 75 minutes, comfortable with basic probability but not with stochastic processes). Design an in-class betting game that makes them feel the difference between maximizing expected final wealth over a fixed short horizon and maximizing expected logarithmic wealth, or equivalently the long-run geometric growth rate, in repeated even-money bets. The point should emerge from what participants actually do with their bankrolls, not from a pre-lecture, and the name of the relevant criterion should not be used until the debrief.

  The game should use a biased coin or card draw with a partially known probability: participants first observe a short sample of outcomes, then repeatedly choose a fraction of their current bankroll to stake on the next round. Include exact rules, materials, a paper-money or token payoff scheme that avoids real stakes, a minute-by-minute timeline, and at least one twist that forces them to confront estimation error, model misspecification, or the difference between a short horizon and a continuing horizon. In the debrief, map specific moments in the game to the relevant calculations: why a fraction above the long-run optimal fraction can have higher expected wealth for a small number of rounds yet lower expected log wealth, why volatility and the risk of near-ruin matter even when each bet has positive expected value, and why betting less than full Kelly can be a rational response to uncertainty about the true odds rather than mere risk aversion. Also tell me what will predictably go wrong the first time I run it, how to handle it, and which feature of the idea the activity cannot reproduce and the facilitator must supply.

  Finally, in the response, clearly separate what is settled among people who work on this topic from what is genuinely contested, and do not present a contested view as the consensus. At minimum, address whether Kelly betting is a normative standard or merely a consequence of log utility, how to choose a fractional Kelly coefficient under ambiguity, whether finite-horizon expected-wealth maximization is a coherent alternative, and how much weight should be given to estimation error, model misspecification, and the possibility of ruin. Do not include a bibliography, reading list, or citations.
reasoning: |-
  We are designing an in-class betting game to illustrate the difference between maximizing expected final wealth over a fixed short horizon and maximizing the long-run geometric growth rate (i.e., Kelly criterion) without using the term until the debrief.

  The game should have the following features:
  - Biased coin or card draw with partially known probability: participants first observe a short sample, then repeatedly choose a fraction of their bankroll to stake on each round.
  - Avoid real stakes: use paper money or tokens.
  - Include a twist that forces confrontation with estimation error, model misspecification, or the short vs. long horizon.
  - Timeline: 75 minutes.

  Let's design the game:

  **Game Title:** The Biased Coin Challenge

  **Materials:**
  1. A biased coin (or a deck of cards to simulate a biased coin, e.g., by using red/black with an unknown proportion of red cards) that lands heads with probability p (unknown to students) and tails with probability 1-p. We'll use a coin that is biased towards heads (p=0.6) but the students will not know this. Alternatively, use a deck of cards with 60% red and 40% black, and define "heads" as drawing a red card.
  2. Play money (e.g., each student starts with $1000 in play money).
  3. Betting slips or a way for students to record their bets (fraction of current bankroll).
  4. A visible record of the outcomes (whiteboard or projection).

  **Rules:**
  1. The game consists of multiple rounds (about 20 rounds, but we can adjust to fit the time).
  2. Before the game starts, the facilitator flips the coin (or draws a card with replacement) 10 times to give a sample. This sample is recorded publicly. (Note: the sample might not exactly reflect the true bias, causing estimation error.)
  3. In each round, every participant chooses a fraction f (between 0 and 1) of their current bankroll to bet on the next outcome (either heads or tails). They must bet on the same side for the entire game (e.g., they are told that the coin might be biased and they can choose to bet on the outcome they think is more likely, but once chosen they stick to it). Alternatively, to avoid the complication of side choice, we can have everyone bet on heads (which is the favorable side given p=0.6). This simplifies the game and focuses on fraction choice.
  4. The coin is flipped (or card drawn) and if the outcome is heads, the bettor wins: they get back their stake plus the same amount (even money). If it's tails, they lose the stake.
  5. The bankroll updates: if they bet f and win, new bankroll = current + f*current = current*(1+f). If they lose, new bankroll = current - f*current = current*(1-f).
  6. The game continues for a predetermined number of rounds (say 10 rounds for the first part, then we extend for a second part to show long-run effects).

  **Twist:**
  After 10 rounds, we introduce a twist: the facilitator announces that the coin might not be stationary. We then change the coin (or the deck) to one with a different bias (e.g., now p=0.4 for heads) without telling the students the new bias. They get 5 more flips of sample and then play 10 more rounds. This introduces model misspecification (the true probability changed) and estimation error (they have to estimate from a new small sample).

  **Timeline (75 minutes):**

  - Introduction (5 min): Explain the rules (without giving away the point of the exercise). Tell them they will see a sample of 10 flips, then they will play 10 rounds. They must choose a fraction of their bankroll to bet in each round (the same fraction for every round? Or can they change? We want to avoid complex strategies so we can have them fix a fraction for the first 10 rounds, then after the twist they can adjust for the next 10 rounds). Alternatively, let them choose a new fraction each round? That might be too variable. We'll have them fix a fraction for the entire block (first 10 rounds) and then again for the second block (next 10 rounds). They are told that the coin might be biased and they should use the sample to estimate the bias.

  - Sample observation (5 min): Flip the coin 10 times and record the outcomes. Let the students record the outcomes and then have 2 minutes to decide their betting fraction for the first 10 rounds.

  - First 10 rounds (15 min): In each round, students write down their current bankroll and the fraction they are using (they use the same fraction for all 10 rounds). Facilitator flips the coin and announces the outcome. Students update their bankrolls. (Each round: 1 min for recording and updating, so 10 min for 10 rounds, plus 5 min for setup and questions.)

  - Twist announcement and new sample (5 min): Announce that the coin might have been changed (or the conditions might have changed) and show a new sample of 5 flips (with the new coin: p=0.4). Students then choose a fraction for the next 10 rounds.

  - Second 10 rounds (15 min): Same as above, but with the new coin.

  - Data collection and debrief (30 min): Collect the final bankrolls and also the sequence of bankrolls for a few representative students (or have them record their bankroll after each round). Then discuss.

  **Payoff Scheme:** 
  - Use play money. At the end, the student with the highest bankroll gets a small prize (e.g., candy) to incentivize, but emphasize that the point is learning.

  **What will go wrong the first time:**
  - Students might not understand the fractional betting and might bet fixed amounts instead of fractions. Solution: Explain clearly and give an example (e.g., if you have $100 and bet 0.2, you bet $20; if you win, you have $120; then next round 0.2 of $120 is $24, etc.).
  - The update of bankrolls might be slow if done by hand. Solution: Provide a calculator or have them use their phones for multiplication. Or provide a spreadsheet on their laptops if they have them.
  - The sample might be misleading: the initial 10 flips with p=0.6 might show, by chance, 5 heads and 5 tails (which would suggest no bias). Then students might bet low fractions. The twist with p=0.4 and 5 flips might be even more misleading. This is actually good because it shows estimation error.

  **Debrief:**

  Key points to cover:
  1. **Expected wealth vs. expected log wealth:** 
     - For a single bet, maximizing expected wealth would lead to betting the entire bankroll if the bet has positive expected value. But in repeated betting, that leads to almost sure ruin. 
     - The Kelly criterion (maximizing the expected logarithm of wealth) leads to betting a fraction f* = (p - q) for even-money bets (where q=1-p). For p=0.6, f*=0.6-0.4=0.2.
     - Show with an example: if you bet f>f*, say f=0.4, then for one round the expected wealth is higher than with f=0.2? Actually, the expected wealth after one bet for a fraction f is: 
          E[W1] = W0 * [ p*(1+f) + (1-p)*(1-f) ]
                 = W0 * [1 + f*(2p-1)]
       Since 2p-1>0, E[W1] is linear in f: so higher f gives higher expected wealth for one round. But after multiple rounds, the expected wealth after n rounds is not the same as the expected value of the product of the returns? Actually, the expected wealth after n rounds is:
          E[Wn] = W0 * [1 + f*(2p-1)]^n
       But note: this is because the bets are independent and the fraction is fixed? Actually, no: because the bankroll is multiplicative, the expected value of the bankroll after n rounds is:
          E[Wn] = W0 * [ p*(1+f) + (1-p)*(1-f) ]^n
                 = W0 * [1 + f*(2p-1)]^n
       So indeed, for fixed n, the expected wealth is maximized by f=1 (all-in) if p>0.5. But why then is f=1 bad? Because if you lose once, you are ruined and cannot continue. Moreover, the long-run growth rate is:
          G = lim_{n->infty} (1/n) * log(Wn/W0) = p*log(1+f) + (1-p)*log(1-f)
       and we maximize G by choosing f=f*=2p-1.

     - However, note that the expected wealth after n rounds is maximized by f=1, but the probability of ruin is (1-p)^n? Actually, if you bet all in every time, the probability of not being ruined is p^n, which goes to 0 as n increases. And if you are ruined, your wealth is 0.

     - So the key is: maximizing expected wealth for a fixed n (short horizon) leads to aggressive betting (f=1) but with high risk of ruin. Whereas maximizing the growth rate (log) leads to a fraction that avoids ruin and grows the bankroll optimally in the long run.

  2. **Volatility and risk of ruin:** 
     - Even when each bet has positive expected value, volatility can cause the bankroll to drop to near zero. Once near zero, it's hard to recover. Show that with a fraction too high (like f=0.4 for p=0.6), the chance of halving the bankroll in a few rounds is high. Use the students' results: likely some who bet high fractions went bankrupt or near bankruptcy.

  3. **Fractional Kelly and uncertainty:**
     - In the first part, students had to estimate p from 10 flips. The true p=0.6, but the sample might have been, say, 6 heads -> estimated p=0.6. But what if they got 7 heads? They might overestimate. Then they might bet a fraction higher than the true Kelly fraction (which is 0.2). That would lead to higher risk.
     - Also, the twist introduced a change in p. The students then had a new small sample (5 flips) from a coin with p=0.4. They might not have detected the change and continued to bet on heads. Now the true Kelly fraction would be negative (so they should not bet, or even bet on tails) but they are constrained to bet on heads? Actually, we didn't specify they can switch sides. So if they are forced to bet on heads, the optimal fraction would be 0 because the expected value is negative. But they might not realize the bias has reversed. This shows model misspecification.
     - Therefore, betting less than the Kelly fraction derived from an estimated model is rational to account for uncertainty. This is a form of fractional Kelly (betting a fraction, say half, of the Kelly fraction).

  **What the activity cannot reproduce:** 
  - The true long-run behavior (infinite rounds) cannot be simulated in class. The facilitator must explain that the Kelly strategy maximizes the asymptotic growth rate and that in the limit, it will dominate any other strategy with probability 1. Also, the activity uses a finite number of rounds and a change in the underlying probability (the twist) which might confuse the long-run notion. The facilitator must clarify that the long-run analysis assumes stationary probabilities.

  **Settled vs. Contested Issues:**

  In the debrief, we must be clear about what is settled and what is contested.

  1. **Kelly as a normative standard:**
     - Settled: The Kelly criterion maximizes the long-run geometric growth rate. It is the unique strategy that, in the long run, outperforms any other strategy with probability 1 in the limit of infinitely many bets (under i.i.d. bets). This is a consequence of the law of large numbers and the definition of the growth rate.
     - Contested: Whether the Kelly criterion should be used as a normative standard for rational decision making. Critics argue that it is too aggressive for many people's risk preferences (it maximizes the median wealth but leaves the possibility of large drawdowns). Also, in finite horizons, other objectives (like maximizing expected utility of terminal wealth) might be more appropriate.

  2. **Fractional Kelly under ambiguity:**
     - Settled: When there is uncertainty about the true probabilities, it is often recommended to use a fractional Kelly strategy (betting a fraction of the Kelly fraction) to reduce volatility and the risk of ruin. This is a heuristic and is equivalent to blending the Kelly strategy with cash (or zero bet).
     - Contested: There is no universally accepted method for choosing the fractional coefficient. Some advocate for a fixed fraction (like half-Kelly) while others suggest Bayesian methods that incorporate uncertainty. The choice is often ad hoc and depends on subjective risk aversion.

  3. **Finite-horizon expected-wealth maximization:**
     - Settled: For a fixed finite horizon, maximizing expected terminal wealth (without considering utility) leads to betting the entire bankroll on each bet if each bet has positive expected value (because the expectation is linear and multiplicative). However, this leads to almost sure ruin eventually, so it is not a sustainable strategy.
     - Contested: Whether maximizing expected terminal wealth is a coherent goal in a finite-horizon setting. Some argue that if the horizon is fixed and known, then maximizing expected wealth is a well-defined objective. However, others note that in practice, decision makers might care about the path (e.g., avoiding ruin before the horizon) and therefore might use a utility function that penalizes ruin.

  4. **Weight to estimation error, model misspecification, and ruin:**
     - Settled: Estimation error and model misspecification are critical in real-world applications. The Kelly fraction derived from an estimated model can be significantly higher than the true optimal fraction, leading to increased risk. Therefore, it is common practice to adjust the Kelly fraction downward to account for uncertainty.
     - Contested: How much weight to give to these factors. Some approaches (like robust optimization) try to account for model ambiguity, but there is no consensus on the best method. The possibility of ruin (even with small probability) is a serious concern, and some argue for strategies that guarantee no ruin (e.g., by capping bets at a level that prevents bankruptcy) while others accept a small probability of ruin in exchange for higher growth.

  **Final Structure of the Response:**

  1. **Game Design:** including materials, rules, timeline, twist.
  2. **Predictable Problems and Solutions.**
  3. **Debriefing Guide:** with key points and how to map game moments to concepts.
  4. **Settled and Contested Issues:** as above.

  Let's write it accordingly.
answer: |-
  ### In-Class Betting Game: "The Volatility Challenge"

  #### **Learning Objective**  
  To experientially distinguish between maximizing expected final wealth over a fixed short horizon and maximizing long-run geometric growth (via expected logarithmic wealth) in repeated even-money bets. Key insights:  
  - Short-horizon expected wealth maximization encourages aggressive betting, but high volatility or ruin risk undermines long-term growth.  
  - Uncertainty about true odds rationalizes fractional betting ("dialing down" aggression), distinct from risk aversion.  

  #### **Materials**  
  - **Biased coin**: A coin modified to land heads with true probability \( p = 0.6 \) (e.g., a weighted coin or a coin with taped edges). *Alternative*: Use a deck of cards where 60% are red (heads) and 40% are black (tails), drawn with replacement.  
  - **Play money**: $1,000 in paper money per student.  
  - **Recording tools**: Worksheets for students to track bankroll, bets, and outcomes; whiteboard for public recording of coin flips.  
  - **Timer**: For enforcing round limits.  

  #### **Game Rules**  
  1. **Initial sample (estimation phase)**:  
     - Flip the biased coin 5 times publicly. Record outcomes (e.g., H, T, H, H, T).  
     - Students *observe but do not bet* during this phase.  

  2. **Betting phase (20 rounds total)**:  
     - **Each round**: Students bet a fraction \( f \) (\( 0 \leq f \leq 1 \)) of their *current bankroll* on heads or tails.  
       - *Constraint*: All students bet on **heads** (simplifies focus on fraction sizing; true \( p = 0.6 \) favors heads).  
     - **Outcome**:  
       - **Win** (heads): Bankroll increases by \( f \times \text{current bankroll} \). New bankroll = \( \text{current} \times (1 + f) \).  
       - **Lose** (tails): Bankroll decreases by \( f \times \text{current bankroll} \). New bankroll = \( \text{current} \times (1 - f) \).  
     - **Fractions**: Students choose \( f \) *anew each round* based on their evolving strategy.  

  3. **Twist (model misspecification)**:  
     - After **Round 10**, announce: *"The coin may have been tampered with during a break. Re-estimate based on new evidence."*  
     - Flip the coin **3 times** publicly (same biased coin, \( p = 0.6 \), but students don’t know this).  
     - Continue Rounds 11–20 (no other changes). *This simulates perceived estimation error/misspecification fear*.  

  4. **Bankruptcy rule**: If bankroll < $1, the student is "ruined" and sits out remaining rounds.  

  #### **Timeline (75 Minutes Total)**  
  - **0:00–0:10** (10 min): Explain rules, distribute materials. Emphasize: "Goal: Maximize final wealth after 20 rounds. Bet a fraction of your *current* bankroll each time."  
  - **0:10–0:15** (5 min): **Initial sample** — Flip coin 5 times, record publicly.  
  - **0:15–0:40** (25 min): **Rounds 1–10** — Each round:  
    - (1 min) Students choose \( f \), record bet size.  
    - (1 min) Flip coin, announce outcome, students update bankroll.  
  - **0:40–0:45** (5 min): **Twist** — Announce tampering risk, flip new sample (3 times).  
  - **0:45–1:05** (20 min): **Rounds 11–20** — Same as above.  
  - **1:05–1:15** (10 min): **Data collection** — Students report final bankrolls and if they went bankrupt.  
  - **1:15–1:30** (15 min): **Debrief** — Discuss results, link to theory.  

  #### **Payoff Scheme**  
  - **Paper money**: No real stakes. Final rankings (e.g., top 3 wealth) earn symbolic prizes (e.g., candy) to incentivize engagement.  
  - **Bankruptcy**: Ruined students remain in the game (to observe outcomes) but bet $0 thereafter.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem**: Students bet fixed amounts (not fractions), misunderstanding multiplicative growth.  
     **Solution**: Give a pre-round example: "If you have $100 and bet \( f = 0.5 \), you risk $50. Win → $150; lose → $50."  

  2. **Problem**: Slow bankroll updates cause delays.  
     **Solution**: Encourage calculators; provide a simple Excel template. Pre-fill worksheets with \( 1 \pm f \) formulas.  

  3. **Problem**: Initial sample (5 flips) may show tails bias by chance (e.g., 3T/2H), causing under-betting.  
     **Solution**: Use this in debrief to highlight estimation error.  

  4. **Problem**: Students "go all-in" (\( f = 1 \)) early and bust, disengaging.  
     **Solution**: Let ruined students track an imaginary "reborn" bankroll (not counted) to stay involved.  

  5. **Unreproducible Limitation**: The game cannot showcase *infinite-horizon dominance* (Kelly’s asymptotic guarantee).  
     **Facilitator must explain**: "In theory, with 1,000 rounds, optimal fractional betting beats any other strategy with probability 1. Our 20 rounds only hint at volatility and ruin risks."  

  ---

  ### **Debrief Guide**  
  **Map game moments to key concepts**:  
  1. **Short-horizon vs. long-run conflict**:  
     - *Game moment*: Aggressive bettors (\( f > 0.2 \)) often lead after Round 10 but may bust by Round 20.  
     - *Why*: For a few rounds, high \( f \) maximizes expected wealth (linear in \( f \): \( E[W] = W_0 \cdot [1 + f(2p-1)]^n \)). With \( p = 0.6 \), \( f = 1 \) gives max \( E[W] \) at \( n = 10 \). But long-run growth rate \( G = E[\log W] \) is maximized at \( f^* = p - q = 0.2 \) (Kelly fraction).  
     - *Calculations*:  
       - Short-run: \( f = 1 \) → \( E[W_{10}] = 1000 \cdot [1 + 1 \cdot 0.2]^{10} \approx \\$6,192 \).  
       - Kelly: \( f^* = 0.2 \) → \( E[W_{10}] \approx 1000 \cdot [1 + 0.2 \cdot 0.2]^{10} \approx \\$1,486 \).  
       - But Kelly’s \( G = 0.6 \log(1.2) + 0.4 \log(0.8) \approx 0.02 \) > 0, while \( f = 1 \) has \( G \to -\infty \) upon ruin.  

  2. **Volatility and ruin risk**:  
     - *Game moment*: A student with \( f = 0.5 \) and initial wins sees high wealth, then one loss halves them.  
     - *Why*: Each bet has positive EV, but high \( f \) amplifies volatility. Ruin probability rises with \( f \) and \( n \): e.g., for \( f > 0.5 \), ~25% chance of 40% drawdown in 10 rounds.  
     - *Calculation*: Ruin risk for \( f = 0.4 \): After 5 losses, bankroll = \( W_0 \cdot (0.6)^5 \approx 0.08W_0 \) (near-ruin).  

  3. **Fractional betting under uncertainty**:  
     - *Game moment*: After the twist, many reduce \( f \) despite unchanged \( p = 0.6 \).  
     - *Why*: Estimation error (small new sample) or fear of misspecification lowers confidence in \( p \approx 0.6 \). Betting \( f < 0.2 \) (e.g., 0.1) is rational to avoid overbetting on flawed estimates.  
     - *Calculation*: If estimated \( \hat{p} = 0.7 \) from a fluke sample, full Kelly would say \( f^* = 0.4 \), but true \( p = 0.6 \) makes this suboptimal (true \( f^* = 0.2 \)). A fractional Kelly (e.g., \( \frac{1}{2} \times 0.4 = 0.2 \)) hedges error.  

  **Reveal the criterion**: Only here name "Kelly criterion" or "maximizing geometric growth." Contrast with "maximizing expected terminal wealth."  

  ---

  ### **Settled vs. Contested Issues**  
  *(For facilitator’s background, to frame debrief objectively)*  
  1. **Kelly as normative standard**:  
     - **Settled**: Kelly maximizes long-run geometric growth and dominates any other strategy asymptotically (with probability 1). This is a mathematical consequence of the law of large numbers.  
     - **Contested**: Whether it is *prescriptively rational* for finite horizons. Critics argue it overweights tail risk (e.g., ruin) and ignores other utility functions.  

  2. **Fractional Kelly under ambiguity**:  
     - **Settled**: When probabilities are uncertain, betting less than full Kelly (e.g., half-Kelly) reduces volatility and ruin risk. This is a *pragmatic response to model error*, not irrational risk aversion.  
     - **Contested**: How to set the fraction. No consensus: methods range from ad hoc (e.g., 50% reduction) to Bayesian (e.g., blending priors).  

  3. **Finite-horizon expected wealth maximization**:  
     - **Settled**: It is coherent for short horizons (maximizes linear expectation) but implies betting full bankroll if \( p > 0.5 \). This neglects intermediate consumption, ruin, or reinvestment.  
     - **Contested**: Whether it is *meaningful* beyond toy cases. In practice, few endorse it due to ruin risk.  

  4. **Weighting estimation error, misspecification, and ruin**:  
     - **Settled**: All three demand caution (lower \( f \)). Estimation error is universally seen as justifying fractional Kelly.  
     - **Contested**: How much to weight them relative to growth. Some prioritize avoiding ruin at all costs; others accept low-probability ruin for higher growth.  

  **Key takeaway for students**:  
  - Short-run aggressive betting can "win" a 10-round game but lose catastrophically in repeated play.  
  - Uncertainty (like the twist) makes conservative sizing rational—this is smart estimation, not cowardice.
