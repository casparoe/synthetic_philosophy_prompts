answer: |-
  ### Exam Question Stem (5 lines)
  In *Descent of Man* Chapter 5, Darwin describes a thought experiment where beings structured like social insects would find duties like sibling sacrifice instinctively obligatory. Contrast this with his claims in Chapters 3-5 that the human moral sense, arising when reflection compares transient impulses against enduring social instincts and leading to an expanding circle of sympathy, constitutes humanity's most vital distinction from lower animals. Analyze critically whether Darwin’s framework provides grounds for asserting that a wider human sympathy is *morally superior* rather than merely more evolutionarily successful or widely held, given the insect scenario suggests radically different instincts could generate equally authoritative, yet contradictory, moral imperatives.

  ### Model Answer (780 words)

  Darwin’s insect thought experiment exposes a fundamental tension within his account of morality: while he posits the human moral sense as uniquely significant and progressive, grounded in social instincts and reflection, the experiment demonstrates that the *feeling* of moral obligation is contingent on evolved instincts, not inherent moral truth. This tension reveals that Darwin lacks the resources to normatively justify the superiority of expanding human sympathy beyond its contingent evolutionary success and psychological authority.

  The thought experiment serves primarily a *diagnostic* function. By imagining beings for whom infanticide feels as obligatory as parental care feels to humans, Darwin demonstrates that the psychological *authority* of conscience – its insistent "ought" – stems wholly from the specific content of the enduring social instincts upon which reflection acts. The feeling of duty is not a perception of objective moral facts but a product of evolved psychology. This directly challenges any simple reading of the expanding circle of sympathy as inherently progressive in a moral sense. If the authoritative feeling of obligation can attach to behaviors humans find abhorrent (like killing fertile siblings), then the mere fact that human sympathy *feels* right as it expands, or that it provides group advantages, cannot establish its objective moral superiority. The insect scenario shows that radically different, contradictory "oughts" can possess equivalent subjective authority and evolutionary functionality within their respective contexts.

  Darwin’s description of conscience formation – reflection pitting a transient impulse against a "more enduring" social instinct – explains *why* a specific impulse feels wrong to a particular agent (e.g., why neglecting kin feels wrong to a human). It explains the *origin* and *psychological force* of the moral sense. However, it provides no criterion for adjudicating *between* competing sets of social instincts, like those governing the human versus the imagined insect community. The mechanism explains the feeling of obligation but is silent on whether the *content* generating that feeling in humans (e.g., widening sympathy) possesses any normative validity beyond its origin and consequences. When Darwin calls the moral sense humanity's "noblest" attribute or implies the expansion of sympathy is an "advance," he is making a *normative* claim. Yet his naturalistic account, underscored by the insect experiment, seems only to provide *descriptive* explanations for why certain codes arise and feel binding.

  Can Darwin bridge this gap? He might appeal to the *consequences* of wider sympathy – increased cooperation, reduced suffering, tribal success. However, while these explain the *evolution* and *persistence* of the trait, they remain descriptive of outcomes valued *within* the human instinctive framework. The insect community also experiences "success" defined by *its* instincts (e.g., efficient reproduction). Consequentialist arguments only gain normative traction if we presuppose the moral worth of the specific consequences (human welfare vs. hive efficiency), which Darwin's naturalism cannot justify without circularity. The "nobility" of the human moral sense appears, ultimately, to be a value judgment Darwin makes *from within* the human perspective, a perspective his own theory reveals as contingent.

  Furthermore, the claim that reflection distinguishes human morality seems insufficient. The imagined insects presumably also possess instincts they reflect upon as obligatory; Darwin does not deny them cognition. Human reflection operates on different instincts, leading to different "permanent" impulses. Reflection explains the *form* of conscience (comparative judgment) but not the normative validity of the *content* it compares. The expansion of sympathy feels authoritative because reflection approves impulses aligned with the underlying, evolved social instincts favoring broader cooperation. Its "betterness" is experienced subjectively and confirmed by group success, but Darwin cannot demonstrate its objective moral superiority over the insect alternative. He is left with a sophisticated account of how human morality *arises* and *feels*, and why it *spreads*, but not why it is *truer* or *better* in a sense that transcends our species-specific psychology and history.

  Ultimately, the insect thought experiment functions as a powerful reductio ad absurdum against any straightforward reading of Darwin as providing a normative foundation for moral progress. It forces the recognition that his evolutionary account brilliantly explains the origins and variations of the *sense* of morality, including its powerful subjective authority, but it cannot provide independent grounds for claiming that the specific trajectory of human moral development – the widening circle – represents genuine moral improvement rather than merely contingent psychological and evolutionary adaptation. Darwin’s framework descriptively explains why we *believe* our expanding sympathy is better; the insect scenario tragically reveals why, within that framework, we cannot prove it objectively *is*.

  ---

  ### Marking Scheme (Total: 25 Marks)

  1.  **Identification of Core Tension (4 marks):** Clearly establishes the conflict between the subjective authority/evolutionary functionality of morals in both human and insect scenarios vs. Darwin's apparent normative claims about human moral superiority.
  2.  **Diagnostic Function of Experiment (4 marks):** Accurately explains how the insect thought experiment primarily reveals the instinct-contingent nature of moral authority/feeling, not inherent moral truth.
  3.  **Distinction Descriptive/Normative (5 marks):** Effectively separates Darwin's explanation of conscience *origins/psychology* (descriptive) from the need for justifying moral *content superiority* (normative), using the insect contrast. *(A/B Boundary: A answers maintain this distinction rigorously; B answers conflate explaining the feeling of obligation with justifying the code.)*
  4.  **Critique of Appeal to Consequences (5 marks):** Critically evaluates whether appeals to consequences (cooperation, reduced suffering, tribal success) can bridge the normative gap, recognizing their dependence on presupposed human values/circularity.
  5.  **Limits of Reflection (4 marks):** Assesses whether human reflection provides a sufficient normative resource, arguing it operates *on* contingent instincts, explaining form/feeling but not validating content against alternatives.
  6.  **Overall Synthesis & Conclusion (3 marks):** Draws a coherent, critical conclusion about Darwin's inability to normatively justify the moral superiority of expanding sympathy beyond contingency.

  * **Solid but Unexceptional (B) Answer:** Competently summarizes Darwin's account of moral origins (social instincts, reflection, expanding sympathy) and narrates the insect experiment. Identifies *that* the experiment poses a problem for seeing sympathy as "better" but struggles to articulate *why* beyond noting variation. Relies heavily on describing Darwin's mechanisms. May weakly appeal to consequences as justification without critical analysis. Lacks rigorous descriptive/normative distinction.
  * **A Answer:** As per model, rigorously distinguishes descriptive origins/psychology from normative justification, uses the insect scenario precisely to expose this gap, and systematically dismantles potential ways Darwin might bridge it (instincts, consequences, reflection), concluding on the inescapable contingency.

  ---

  ### Specific Mistakes & Deductions

  1.  **Anachronism - Attributing Utilitarianism:** Stating Darwin provides a consequentialist *criterion* for right action (e.g., "Darwin believes right action maximizes group fitness/happiness"). (-3) *He describes how certain behaviors *are* selected for, not that they *ought* to be.*
  2.  **Anachronism - Debunking Moral Knowledge:** Claiming Darwin's aim is to show all morality is illusory or "just evolved," ignoring his clear belief in the reality/nobility of the human moral sense. (-3) *He explains origins, not necessarily illusion.*
  3.  **Misreading Experiment's Role:** Treating the insect scenario *only* as an illustration of moral diversity or instinct power, failing to see its critical role in challenging normative progress. (-2)
  4.  **Conflation of Authority & Justification:** Equating the explanation of *why* a moral code feels obligatory/authoritative to its adherents with a justification for *why that code is objectively right*. (-4) *Core error.*
  5.  **Ignoring Normative Ambition:** Overlooking Darwin's own evaluative language ("noblest," "advance") implying he *wants* to claim moral superiority for human sympathy. (-2)

  ---

  ### Penalized Opening Sentence

  **Likely Sentence:** "Darwin argues that human morality, arising from social instincts and reflection, evolves as sympathy expands to include wider circles, which is advantageous for group survival."

  **Why Penalize:** This sentence exemplifies the narrative summary approach the question forbids. It merely restates Darwin's descriptive account of origin and mechanism, completely ignoring the central problematic raised by the insect thought experiment regarding the *normative status* of this expansion. It fails to engage with the crux of whether expansion is "better" or merely later/successful, and sidesteps the challenge posed by the insect counterfactual. It would earn minimal credit for basic recall but demonstrates a failure to grasp the specific, critical demand of the question. (Deduct accordingly within the "Core Tension" and "Diagnostic Function" criteria).
