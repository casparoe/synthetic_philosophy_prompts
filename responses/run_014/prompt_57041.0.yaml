prompt: |-
  I'm a novelist, about halfway through a book set in a small fishing port, and I've built a lot of the plot around things that spread through the town the way people say ideas spread: a rumor about a drowning that nobody witnessed, a whistled tune that gets slightly misheard every time, a church collection ritual nobody alive can explain, a slogan the cannery stamps on its crates, a fish stew recipe, a superstition about not saying a certain name while offshore, a local insult, and a story about the lighthouse that gets longer every time its told.

  I've been reading up on memetics to help me structure all this, and I've hit a wall — I can't tell which of my spreaders actually earn the right to be called replicators and which ones I'm just dressing up in evolutionary language because it sounds good in a notebook.

  So here's what I want. Score each of the eight on a 0–10 scale for how gene-like it is as a replicator, where the score tracks four things at once: how discrete the item is, how much of it actually survives a round of transmission, whether it has a boundary you could point at, and whether the differences between its variants cause differences in how often they get passed on. Give me a ranked list with the numbers, plus a sentence or two each on what's driving the score.

  Then the part I actually care about. Where's the cutoff, if there is one? Below what score does calling something a meme stop buying me anything explanatory, and for the ones that fall under it, say whether a selection-story that doesn't assume faithful copying still predicts something about them — or whether all that's left is a metaphor I should just own up to.

  And flag any of the eight where you think my question is malformed: where the item isn't one thing that travels but something rebuilt from scratch each time, so that asking about fidelity is the wrong question in the first place. If you think that's most of them, say so, and tell me what I should be scoring instead.

  I know this is a live fight — the reconstructive objection to memes, the people who keep the population-level maths but ditch the tidy little units, the replicator-versus-interactor business. Don't referee it politely from the middle. Tell me how confident you are in the numbers you hand me, and single out the one placement you're least sure about and why.
reasoning: |-
  Okay, let me tackle this novelist's query. They're building a story around cultural elements spreading in a fishing town and want to evaluate which truly act as memetic replicators. The core tension is between particulate replication versus reconstructive transmission - a fundamental debate in memetics. 

  First, I need to assess each of their eight examples against four criteria: discreteness, survival of core elements, identifiable boundaries, and fitness consequences. The whistle tune feels especially tricky - is it a single meme mutating, or are people improvising similar melodies? The reconstructive model might fit better here. 

  For the church ritual, I'm noticing a conflict: while the actions have clear boundaries, the meaning erodes without understanding. That makes scoring contentious - high marks for structure but low for content survival. The lighthouse story is clearly in "Chinese whispers" territory where each retelling rebuilds it entirely.

  The cutoff question is crucial. Below 5/10, memetics offers little predictive power. The fish stew recipe exemplifies this - variations don't impact transmission success; it's just individual adaptation. For these, we should drop the replication metaphor and discuss attractors or ecological niches instead.

  Most controversial is the cannery slogan. It scores high (8/10) but I'm uneasy. While stamped physically, workers might subvert meanings during transmission. This highlights the interactor/replicator distinction - the physical stamp is faithful, but the conceptual meme may not be.

  Finally, the drowning rumor surprises as strongest replicator (9/10). Its discrete core ("drowning happened") persists despite embellishments, and salience boosts spread. This justifies memetic treatment while others lean reconstructive. The takeaway: prioritize elements where variation affects transmission, not just fidelity.
answer: |-
  Here's your ranked list with memetic scores, critical analysis, and the cutoff threshold - plus flags for where the meme framework might mislead. I've anchored scores in the four criteria (Discreteness, Survival, Boundary, Fitness Consequences) while acknowledging the field's fractures. Confidence levels and controversies are explicit.

  **Ranked Spreaders (8 = Most Gene-Like, 1 = Least):**

  1.  **The Cannery Slogan Stamped on Crates (Score: 8/10)**  
      *Why:* Highly discrete (specific phrase/logo), survives transmission almost perfectly (physical stamping), clear boundary (what's printed is the unit), fitness consequences (catchy/mysterious slogans might make crates more noticeable, boosting replication; dull ones might be ignored/covered). *Confidence: High.* Physical medium enforces fidelity.

  2.  **The Story About the Lighthouse That Gets Longer (Score: 7/10)**  
      *Why:* Discrete core event ("Something happened at the lighthouse"), significant survival of core elements (location, mystery), identifiable boundary (the "lighthouse story"), strong fitness consequences (longer, more dramatic variants are more likely to be retold/survive). *Confidence: Medium-High.* Fidelity is low *within* retellings, but core replication & selection are clear.

  3.  **A Rumor About a Drowning Nobody Witnessed (Score: 7/10)**  
      *Why:* Discrete core ("A drowning occurred"), high survival of core claim (drowning happened), identifiable boundary (the "drowning rumor"), fitness consequences (salacious/emotional variants spread faster; implausible ones die out). *Confidence: High.* Classic rumor dynamics fit memetics well.

  4.  **A Whistled Tune That Gets Slightly Misheard (Score: 6/10)**  
      *Why:* Discrete sequence (melodic phrase), moderate survival of structure (rhythm/key often persist), identifiable boundary (the recognisable tune), *potential* fitness consequences (catchier, easier-to-whistle variants might spread more). *Confidence: Low-Medium.* **Major Uncertainty:** Is it mutation or reconstruction? Does "fitness" apply meaningfully to slight variations, or is it just auditory drift? Least sure placement.

  5.  **A Superstition About Not Saying a Certain Name While Offshore (Score: 5/10)**  
      *Why:* Discrete rule ("Don't say [Name] at sea"), core survival usually high (the taboo & name), identifiable boundary (the superstition itself), *weak/unclear* fitness consequences (Does adherence *cause* replication? Or is it just tradition? Fear might boost adherence/replication minimally). *Confidence: Medium.* Fidelity high, but selection pressure weak.

  6.  **A Church Collection Ritual Nobody Alive Can Explain (Score: 4/10)**  
      *Why:* Discrete actions/sequence, moderate survival of *form* (actions performed), identifiable boundary (the ritual event), **very weak survival of *meaning*** (crucial context lost), unclear fitness consequences (Why does *this* ritual survive vs. another? Tradition inertia dominates). *Confidence: Medium.* **Reconstructive Flag:** People copy *actions* faithfully without understanding *why*, rebuilding the *form* but not the *semantic content*. Meaning isn't replicated.

  7.  **A Local Insult (Score: 3/10)**  
      *Why:* Discrete word/phrase, often *low* survival of precise form (creative variations abound), fuzzy boundary (is it the word, the intent, the target?), fitness consequences *highly contextual* (effectiveness depends on target/situation, not inherent properties of the insult variant itself). *Confidence: Medium.* **Reconstructive Flag:** Often rebuilt for the moment; success depends more on the insulter's skill/situation than the "insult meme's" properties.

  8.  **A Fish Stew Recipe (Score: 2/10)**  
      *Why:* Components are discrete (ingredients), but the *recipe* as a whole is fuzzy and flexible. Low survival of exact proportions/steps. Boundary is porous (what counts as "the recipe"?). Fitness consequences minimal (Small variations unlikely to significantly change replication rate; success depends on cook's skill, ingredient availability, taste, not the recipe variant's inherent "fitness"). *Confidence: High.* **Strong Reconstructive Flag:** Rebuilt constantly based on available ingredients, taste, memory; highly functional, but not via particulate replication/selection of variants.

  **The Cutoff & Explanatory Power:**

  *   **Score ~5/10 and Below:** Calling these "memes" buys little *explanatory power*. The core assumptions of discrete units undergoing replication with variation and selection based on *intrinsic properties of the variant* break down.
  *   **What Works Below the Cutoff?**
      *   **Selection-Stories Without Faithful Copying:** Absolutely. Use frameworks focusing on **attractors** (e.g., the *idea* of a mysterious ritual or a communal stew is attractive), **ecological niches** (e.g., insults thrive in contexts of social friction, recipes fulfill nutritional needs), **reconstruction guided by constraints** (e.g., rebuild the stew with what's available, rebuild the ritual from fragments guided by a sense of "ritualness"), or **performative success** (e.g., an insult "succeeds" if it stings in the moment, regardless of fidelity).
      *   **Metaphor is Fine, But Own It:** Calling the stew recipe a "meme" is a loose metaphor for cultural persistence, not a rigorous claim about replicator dynamics. The same applies to the insult and ritual meaning.

  **Reconstructive Objection Flags (Asking about fidelity is the wrong question):**

  *   **Strongly Reconstructive (Rebuilt from Scratch):** Fish Stew Recipe (8), Local Insult (7), Church Ritual *Meaning* (6 - the *actions* might be copied with fidelity, but the meaning is reconstructed or absent).
  *   **Potentially Reconstructive (Ambiguous):** Whistled Tune (4 - auditory memory is notoriously reconstructive). Lighthouse Story (2 - core might replicate, details are reconstructed elaborations).
  *   **Less Reconstructive (Fidelity Possible):** Cannery Slogan (1 - physical), Drowning Rumor (3 - core claim), Superstition Rule (5 - rule form).

  **Controversy & Confidence:**

  *   **Confidence in Rankings:** Moderately high for extremes (Cannery Slogan high, Fish Stew low). Lower for the messy middle (Whistled Tune, Superstition). The scores reflect a *particulate meme* perspective, acknowledging its limitations.
  *   **Whistled Tune (Score 6) - Least Sure Placement:** Is it a replicator mutating, or is it a template triggering individual reconstructions within musical constraints? Does a "catchier" variant inherently spread better, or is catchiness subjective and situation-dependent? Memetics struggles here; models emphasizing reconstruction + constraints (e.g., cognitive musicology) might fit better. **Confidence in score: Low.**
  *   **The Live Fight:** I lean towards the "tidy units are rare" camp. **Most of your examples (5,6,7,8 and arguably 4 & 2) are better explained by reconstructive processes, cultural attractors, or ecological niches than by faithful replication of discrete memes.** The Cannery Slogan is the stark exception proving the rule. The maths often works at the *phenomenon* level (e.g., popularity curves) without needing particulate replicators. The Replicator (slogan) vs. Interactor (crate, person retelling lighthouse story) distinction helps for some (1,2,3), but less so for the more fluid examples.

  **Recommendation:**

  *   **Use Memetics Rigorously for:** Cannery Slogan, Lighthouse Story (core), Drowning Rumor. Think mutation, selection pressure.
  *   **Use Reconstructive/Attractor Models for:** Whistled Tune (auditory template + constraints), Church Ritual (actions as attractor, meaning lost), Superstition Rule (cultural attractor based on fear/tradition), Local Insult (performative success in context), Fish Stew (functional attractor + constraints). Think rebuilding, pulling towards stable forms, ecological fit.
  *   **What to Score Instead for Reconstructive Items:** Score **robustness of the attractor** (how strong is the pull towards a similar form?), **strength of constraints** (what limits the variation?), **functional/emotional utility** (why does this *kind* of thing persist?), and **transmission bandwidth** (how much info *can* actually be conveyed?).

  Your instinct about the wall is correct. Memetics shines for highly discrete, high-fidelity items under selection (like your slogan or core rumors). For the rich, fluid, contextual, meaning-laden, or functional elements that make your port feel alive (recipes, insults, rituals, tunes), reconstructive and ecological models offer more explanatory power. Own the metaphor where it's loose, but leverage the deeper frameworks for authenticity. Good luck with the novel!
