prompt: |-
  I am at work on a novel whose central scene has a harbour pilot choosing, in the few minutes before a rescue launch goes out, whose child to go after: his own, or a stranger's, who is likelier to survive. A philosopher friend who read the draft says I have the ethics backwards, and offered an image to prove it. Justice wears a blindfold precisely so that she cannot see who stands before her; a moral agent occupies the same position; my pilot's fault is that he looked. On her account, Williams's charge that the man who justifies saving his wife by noting that she is his wife has one thought too many only shows the blindfold chafes, not that it may be removed. Audit the image for me: who plays Justice, who the litigants, what the bench, the procedure, the verdict, and what the blindfold itself amounts to. Then say which features of the courtroom the comparison quietly lends my pilot's situation and which it cannot lend, whether her conclusion survives the subtraction, and, if the figure cannot bear that weight, what figure could.
reasoning: |-
  Okay, the user is working on a novel with a critical scene where a harbor pilot must decide between saving his own child or a stranger's child, with the stranger's child having a higher chance of survival. Their philosopher friend criticized the ethics, using the image of Lady Justice's blindfold to argue that the pilot shouldn't have looked at who the children are—meaning he should be impartial. The user wants me to audit this metaphor: break down the courtroom analogy, see what fits the pilot's situation, what doesn't, and if the conclusion holds. If not, suggest a better figure.

  First, I need to unpack the friend's argument. The blindfold symbolizes impartiality in justice—decisions should be based on facts, not identities. The friend is saying the pilot erred by considering personal ties; he should be like Justice, blind to who is involved. The reference to Bernard Williams' "one thought too many" is key. Williams argued that justifying saving a loved one with reasons (like "she's my wife") is overthinking—it should be instinctual. Here, the friend twists it: the blindfold might feel uncomfortable, but it's necessary for morality. So, the pilot's fault is prioritizing emotion over impartial duty.

  Now, auditing the courtroom analogy. Let me map the elements:
  - Justice: Represents the moral agent, here the pilot.
  - Litigants: The two children—one his own, one a stranger.
  - Bench: Could be the pilot's conscience or the rules he should follow.
  - Procedure: The decision-making process under time pressure.
  - Verdict: The choice of who to save.
  - Blindfold: Impartiality, ignoring personal relationships.

  In a courtroom, this works because justice requires fairness. But the pilot's situation is different: it's personal, urgent, and involves deep relationships, not abstract disputes. The courtroom is about resolving conflicts with evidence; the rescue is about acting in a crisis with emotional stakes.

  Where the analogy fits: Both involve high-stakes decisions where bias could skew outcomes. Impartiality aims for fairness, which in rescue might mean maximizing survival chances. So, the stranger's child has better odds, so saving them could be seen as "just."

  Where it doesn't fit: Real life isn't a trial. Relationships matter morally; we have special obligations to loved ones. Williams' point is that love shouldn't need justification—it's fundamental. Also, courts have time for deliberation; the pilot has minutes, forcing instinct over reason. Plus, justice is about desert (who deserves what), while rescue is about need and ability—different ethical frameworks.

  The friend's conclusion relies on the blindfold being essential. But if the analogy breaks under scrutiny—because personal ties are valid in ethics—then her point might not survive. For instance, if we subtract the courtroom elements that don't apply, like formal procedures or the idea of litigants as equal parties, the blindfold becomes less compelling. In rescue scenarios, partiality isn't always wrong; it's human and often morally accepted.

  Now, for a better figure: I need something that captures the conflict between impartial duty and personal love. A ship's captain in a storm choosing who to save? Or a battlefield medic with triage—but that's still impartial. Maybe a parent in a fire: they'd instinctively save their child first, and society accepts that. This highlights how roles create different obligations. The pilot is both a rescuer (public role) and a father (private role), so the tension comes from clashing duties. A better metaphor could be Janus, or a scale with unequal weights—acknowledging that some ties are heavier.

  Ultimately, the friend's view might be too rigid. Ethics isn't just blind impartiality; context matters. The pilot looking isn't a "fault"—it's inevitable and morally significant. Suggesting a figure that embraces this complexity would strengthen the novel's ethical depth.
answer: |-
  Your philosopher friend's courtroom analogy is powerful but misapplied to your pilot's dilemma. Let's audit the image systematically, then assess its fit for your scene.

  ### Audit of the Courtroom Analogy
  1.  **Justice:** Represents the *ideal moral agent* or the *demands of impartial morality itself*. In your pilot's case, this is the abstract principle that "all lives have equal weight" or "maximize overall good."
  2.  **Litigants:** Represent the *parties with competing claims*. Here, the two children are the litigants. One has the claim of being the pilot's own child; the other has the claim of being the child with a higher statistical chance of survival.
  3.  **The Bench:** Represents the *decision-making faculty* within the moral agent. For the pilot, this is his rational capacity for judgment, ideally guided by impartial principles.
  4.  **The Procedure:** Represents the *process of fair deliberation*. This involves weighing evidence (survival chances), hearing arguments (the internal moral conflict), and applying rules (impartial morality).
  5.  **The Verdict:** Represents the *final moral decision*. Whose claim prevails? Who gets saved?
  6.  **The Blindfold:** Represents *strict impartiality*. It specifically means **ignoring all particularizing characteristics irrelevant to the abstract case being judged** – personal relationships, wealth, status, identity. Its purpose is to guarantee fairness based *only* on the relevant facts of the case (here, survival probability) and abstract rights/claims. It prevents favoritism or prejudice.

  ### What the Analogy Lends to the Pilot's Situation
  1.  **The Demand for Fairness:** It powerfully evokes the core ethical tension: a duty exists to treat claims neutrally, especially regarding life-or-death stakes.
  2.  **The Conflict of Interests:** It frames the decision as a competition between two valid but incompatible claims presented to the decision-maker.
  3.  **The Role of Rational Deliberation:** It suggests the pilot *should* strive to be a rational judge, setting aside bias.
  4.  **The Abstract Stakes:** It highlights that, from a purely impartial viewpoint, the survival probability *is* the most relevant "fact."
  5.  **The "Fault" of Looking:** It clearly identifies the pilot's recognition of his personal bond as a violation of this impartial stance – peeking under the blindfold to see "this one is mine."

  ### What the Analogy Cannot Lend to the Pilot's Situation
  1.  **The Nature of the Relationship:** The courtroom assumes *strangers* presenting claims to a *disinterested* judge. The pilot is **not a disinterested judge**; he is an *interested party* with a **pre-existing, profound, morally significant relationship** to one claimant. His role as father isn't an irrelevant bias to be blinded to; it's a core part of his identity and obligations *within* the situation. This is the analogy's fatal flaw.
  2.  **The Source of Obligation:** Courtroom justice derives from abstract social contracts and rules. Parental obligation is primal, instinctive, and arguably foundational to ethics itself. It doesn't arise from deliberation; it precedes it.
  3.  **The "Procedure" (Time & Context):** Courtrooms have rules, time for deliberation, and appeals processes. The pilot has seconds/minutes, immense emotional pressure, and no higher authority. Deliberation is visceral, not formal.
  4.  **The Relevant "Facts":** In strict justice, only survival probability matters. In real-life ethics, the nature of the relationships *is* a relevant fact. The claim "This is *my child*" isn't just noise; it carries intrinsic moral weight that impartialism struggles to accommodate. Williams' point about "one thought too many" highlights this: reducing the love for one's spouse/child to a mere factor *within* an impartial calculation feels like a betrayal of the relationship itself.
  5.  **The Goal:** Courtroom justice aims for a fair resolution *between* claimants. The pilot's primary goal is *rescue*, not adjudication between claims. The rescue context inherently involves personal agency, risk, and sacrifice, unlike a judge's pronouncement.

  ### Does the Conclusion Survive the Subtraction?
  *   **No.** The analogy collapses under the weight of what it cannot lend – specifically, the pilot's **inescapable role as a father** and the **intrinsic moral significance of that relationship**.
  *   The friend's conclusion ("the pilot's fault is that he looked") relies entirely on the courtroom model where the *only* relevant facts are abstract and generalizable (survival chance). Subtract the artificial context of the disinterested judge and the formal procedure, and the "blindfold" becomes an inappropriate constraint.
  *   Recognizing his child isn't a moral failing of partiality; it's the unavoidable recognition of a fundamental reality of his existence and obligations. **The fault lies not in *seeing* the relationship, but in potentially letting it *overwhelm* the other morally relevant factor (survival probability) in a way that leads to a worse outcome.** The pilot isn't Justice; he's a man torn between two profound, *different* kinds of moral demands: general beneficence/impartial rescue *and* special obligation/filial love.

  ### A More Apt Figure: The Weighted Scale on the Storm-Rocked Deck
  *   **The Figure:** Imagine the pilot standing on the heaving deck of the rescue launch. In one hand, he holds a scale. On one side is a heavy, familiar weight – his child. On the other side is a lighter weight – the stranger's child – but this weight is tied to a fragile cord labeled "Chance." The sea itself (circumstance/survival odds) violently tilts the deck, threatening to throw the lighter weight off entirely unless he steadies the scale *towards* it. He must choose which weight to actively counterbalance against the storm.
  *   **Why it's Better:**
      *   **Acknowledges Agency & Action:** He's an actor in the storm (rescue context), not a passive judge.
      *   **Embodies Relationships:** One weight is inherently heavier (the special obligation/attachment), visualizing its moral pull.
      *   **Incorporates Consequences:** The "fragile cord" represents the higher survival chance of the stranger's child – a crucial factor demanding consideration, potentially outweighing the inherent "heaviness" of his own child.
      *   **Captures Urgency & Instability:** The storm represents the time pressure and chaotic reality, forcing a visceral, immediate choice.
      *   **Avoids False Impartiality:** It doesn't pretend the weights are equal or that he can be blind to them. His relationship *is* weight. The ethical dilemma is *how to weigh that inherent weight against the countervailing force of probable consequences*.
      *   **Aligns with Williams:** Saving his own child wouldn't require "because it's mine" as a *justification added to impartial calculation*; the pull of the heavy weight *is* the primary reason, instinctively felt. But the storm (survival odds) forces him to potentially *override* that instinctive pull because the consequence (likely losing both if he goes for his own) is catastrophic. The "one thought too many" would be calculating impartial utility *first* to justify saving his own child; saving his child needs no such justification *unless* the consequences demand otherwise.

  ### Implications for Your Scene
  The philosopher friend's critique stems from a rigid impartialist framework. Your scene's power lies in exposing the *tragic conflict* between that framework and the deep realities of human attachment and partiality. The pilot *must* "look." His anguish comes from seeing *both* the irreplaceable value of his child *and* the cold calculus suggesting he might save a life (perhaps even two, including his own) by choosing the stranger's child. The ethical tension isn't resolved by a blindfold; it's agonizingly lived in the moments before the launch. The more apt figure emphasizes the terrible burden of weighing the unweighable – primal love against probable survival – while standing on the unstable ground of imminent disaster. This is the core of the human drama you're crafting.
