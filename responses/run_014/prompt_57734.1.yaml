answer: |-
  ### Decision Procedure for Evaluating High-Level Claims in Design Documents

  This procedure evaluates a single high-level claim to determine whether it is **load-bearing** (essential for design/tractability), **commentary** (merely redescribing substrate details), or **undecidable** (requiring human judgment on values). It is grounded in causal reasoning, multiple realizability, and screening-off tests from philosophy of mind/causation, adapted for engineering pragmatism. Each step is executable in ~5 minutes. **Judgment calls** are explicitly flagged.

  ---

  ### Triage: Classify the Claim
  **Objective**: Categorise the claim's primary type.  
  **Method**:  
  1. **Causal Claim**: Uses verbs like "causes", "prevents", "explains", or "why" (e.g., "Leader election *prevented* split-brain").  
  2. **Constitutive Claim**: Defines identity/invariants (e.g., "This invariant *makes* it a queue").  
  3. **Normative Claim**: Asserts design values (e.g., "This allocation is *fair*").  
  ▶ *If ambiguous, proceed as causal (most common dispute).*  

  ---

  ### Procedure by Claim Type

  #### A. Causal Claims (X *causes* Y)  
  **Step A1: Counterfactual Test**  
    - **Question**: "If X were absent, would Y (or ¬Y) still occur, *holding substrate fixed*?"  
    - **Sufficient Answer**:  
      - **Yes** (Y occurs without X): X is likely epiphenomenal → Proceed to **A3**.  
      - **No** (Y changes without X): X may be causal → Proceed to **A2**.  
      - **Unclear**: → Proceed to **A3**.  
    - *Judgment call*: Requires imagining feasible substrate alterations (e.g., removing a protocol while preserving message flows).  

  **Step A2: Virtue Test**  
    - **Question**: "Does Y occur *in virtue of* high-level X, or *only* via substrate properties that co-occur with X?"  
    - **Sufficient Answer**:  
      - **In virtue of X**: If X is *multiply realizable* (different substrates can achieve X, and all cause Y) → **Load-bearing**.  
      - **Via substrate only**: If Y depends on specific low-level details (e.g., exact packet timings) → **Commentary**.  
    - *Judgment call*: Tests whether X "does the work" or is incidental.  

  **Step A3: Screening-off Test**  
    - **Question**: "Does the substrate description *fully account* for Y, making X redundant for prediction/design?"  
    - **Sufficient Answer**:  
      - **Yes** (substrate screens off X): → **Commentary**.  
      - **No** (X adds explanatory power): Proceed to **A4**.  

  **Step A4: Tractability Test**  
    - **Question**: "Is X *necessary for tractable design* (e.g., abstraction, debugging, communication), even if screened off?"  
    - **Sufficient Answer**:  
      - **Yes** (e.g., X enables modular reasoning) → **Load-bearing**.  
      - **No** → **Commentary**.  
    - *Judgment call*: Weighs engineering utility.  

  ▶ *Terminal Verdicts*: Load-bearing, Commentary, or Undecidable (if stuck at any step).  

  #### B. Constitutive Claims (X *defines* Y)  
  **Step B1: Multiple Realizability Test**  
    - **Question**: "Can X exist in *multiple substrate forms* without changing its essence?"  
    - **Sufficient Answer**:  
      - **Yes** (e.g., a queue invariant holds across implementations) → Proceed to **B2**.  
      - **No** (X is substrate-bound) → **Commentary**.  

  **Step B2: Role in Design Test**  
    - **Question**: "Is X *used in specifications, interfaces, or correctness proofs*?"  
    - **Sufficient Answer**:  
      - **Yes** (e.g., X defines module contracts) → **Load-bearing**.  
      - **No** → **Commentary**.  

  ▶ *Terminal Verdicts*: Load-bearing, Commentary.  

  #### C. Normative Claims (X *is good/right*)  
  **Step C1: Value Grounding Test**  
    - **Question**: "Is X *tied to agreed design goals* (e.g., project principles)?"  
    - **Sufficient Answer**:  
      - **Yes** → Proceed to **C2**.  
      - **No** → **Undecidable** (values dispute → hand to human).  

  **Step C2: Realization Test**  
    - **Question**: "Does the claim *specify how X achieves the goal* (e.g., 'fair via round-robin')?"  
    - **Sufficient Answer**:  
      - **Yes** → Proceed to **C3**.  
      - **No** (vague, e.g., "this is maintainable") → **Commentary**.  

  **Step C3: Counterfactual Test**  
    - **Question**: "If the *specific mechanism* for X were altered, would the *goal fail*, even if other virtues exist?"  
    - **Sufficient Answer**:  
      - **Yes** (mechanism is necessary) → **Load-bearing**.  
      - **No** → **Commentary**.  
    - *Judgment call*: Tests if the claim’s mechanism is load-bearing or incidental.  

  ---

  ### Failure Modes & Limitations  
  - **False Commentary Risk**: Genuine emergent properties (e.g., resilience from redundancy) may be misclassified as commentary if substrate screening-off dominates.  
  - **Rhetorical Weaponisation**: A dominant camp could exploit subjective steps (e.g., A2/A4) to dismiss claims. Mitigation: Document reasoning.  
  - **Systematic Blind Spots**:  
    - Feedback loops (e.g., "The cache *causes* efficiency" ← but efficiency alters cache usage).  
    - Dynamic systems where X’s role shifts with scale.  
    - Values-laden claims masked as causal (e.g., "This *is* scalable" without metrics).  
  - **What It Cannot Do**:  
    - Resolve *ontological* disputes (e.g., "Are concepts *real*?").  
    - Replace design experience (e.g., recognising accidental complexity).  
    - Handle *interdependent claims* (evaluates one claim at a time).  

  ---

  ### Case Evaluations  

  #### Case 1: Agent Design Claim  
  > **Claim**: "The model has a persistent concept of plurality, and that concept is why it produces the plural form."  
  > **Counter-claim**: "Only activation patterns matter; 'concept' is inert."  
  - **Triage**: Causal (X = concept of plurality, Y = plural form).  
  - **A1: Counterfactual Test**:  
    - *Q*: Without the concept, would plural forms still emerge?  
    - *A*: If activations are reconfigured to remove "plurality" patterns (e.g., ablating neurons), plural forms *change* → **No** (Y changes) → Proceed to A2.  
  - **A2: Virtue Test**:  
    - *Q*: Does pluralisation occur *in virtue of* the concept, or *only* via activations?  
    - *A*: Activations *realise* the concept, but the *same* concept could arise from *different* activation patterns (multiple realizability). Pluralisation depends on the concept → **In virtue of X** → **Load-bearing**.  
  - **Verdict**: **Load-bearing** (explains *why* activations lead to pluralisation).  

  #### Case 2: Post-Incident Claim  
  > **Claim**: "Leader election is what prevented a split-brain during the network partition."  
  > **Counter-claim**: "Only message arrivals/timings matter; 'protocol' adds nothing."  
  - **Triage**: Causal (X = leader election, Y = prevention of split-brain).  
  - **A1: Counterfactual Test**:  
    - *Q*: Without leader election, would split-brain have occurred?  
    - *A*: Yes (nodes might dual-write) → **No** (Y changes) → Proceed to A2.  
  - **A2: Virtue Test**:  
    - *Q*: Was prevention *in virtue of* the protocol, or *only* message timings?  
    - *A*: Prevention occurs *because* the protocol enforces a single leader (multiply realizable: Paxos/Raft both work). Message timings are *how* it works, not *why* → **In virtue of X** → **Load-bearing**.  
  - **Verdict**: **Load-bearing** (captures the *mechanism* preventing split-brain).  

  #### Case 3: Maintainability Claim (Your Pet Claim)  
  > **Claim**: "The module boundary is what makes this codebase maintainable, and maintainability is a property of the boundary rather than of the many small decisions on either side of it."  
  - **Triage**: Causal (X = module boundary, Y = maintainability).  
  - **A1: Counterfactual Test**:  
    - *Q*: Without the boundary, would maintainability decrease?  
    - *A*: Yes (spaghetti code) → **No** (Y changes) → Proceed to A2.  
  - **A2: Virtue Test**:  
    - *Q*: Is maintainability *in virtue of* the boundary *alone*, or *also* small decisions?  
    - *A*: **Via substrate only**. Maintainability arises from *both* the boundary *and* internal decisions (e.g., clean interfaces *plus* readable functions). The claim overreaches by excluding small decisions → Proceed to A3.  
  - **A3: Screening-off Test**:  
    - *Q*: Do low-level details (boundary + small decisions) fully explain maintainability?  
    - *A*: **Yes**. The substrate (code structure + implementations) accounts for maintainability; "boundary" is a high-level *description* of part of this → Proceed to A4.  
  - **A4: Tractability Test**:  
    - *Q*: Is the boundary claim *necessary for tractable design*?  
    - *A*: **Yes**. The boundary is a key abstraction for reasoning about dependencies → **Load-bearing**.  
  - **Verdict**: **Load-bearing**, *but* the claim is **partially flawed**.  
    - **Why you won't like this**: Step A2 damaged the claim by showing maintainability isn't *solely* "in virtue of" the boundary. Small decisions matter too. The claim survives only due to A4 (tractability).  

  ---

  ### Conclusion  
  This procedure forces explicit engagement with causation, abstraction, and design values. It prevents talking-past by triaging claims first, and it resists reductionism by prioritising tractability (A4/B2). Use it to scaffold debates—not as a rhetorical cudgel. **Final note**: Some truths are only visible at 30,000 feet; a telescope is not useless because stars are made of atoms.
