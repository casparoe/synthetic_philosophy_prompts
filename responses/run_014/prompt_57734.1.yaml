  We are designing a decision procedure for evaluating high-level claims in design documents. The goal is to determine whether a claim is load-bearing (essential for understanding and design), merely commentary (a redescription of substrate details), or undecidable at review time (requiring human judgment on design values).

   The procedure has a triage step to classify the claim into one of three types:
     A. Causal: The claim asserts that X caused Y or that X prevented Z.
     B. Constitutive/Definitional: The claim asserts that X is what makes Y what it is (e.g., an invariant defines a queue).
     C. Normative/Design-level: The claim asserts a value or design goal (e.g., fairness, maintainability).

   Then, for each type, we have a set of ordered questions. The procedure terminates with one of three verdicts:
     1. Load-bearing: The claim is essential and belongs in the document.
     2. Commentary: The claim is a redescription and should be marked as such.
     3. Undecidable: The claim involves design values and must be handed to a named human.

   We'll ground the steps in philosophical concepts but only when they change the step's execution. We'll use:
     - Counterfactual tests (what if X hadn't been there?).
     - Intervention tests (if we change X, does Y change?).
     - Screening-off (does the substrate description fully account for the effect, leaving no role for the high-level property?).
     - The question of whether the effect happens in virtue of the high-level property or merely in virtue of a substrate property that happens to co-occur.

   Steps that are judgment calls will be explicitly noted.

   Failure modes:
     - A load-bearing claim might be incorrectly marked as commentary (false negative).
     - The procedure might be used as a rhetorical weapon by one camp to dismiss valid high-level claims.
     - It might systematically get wrong claims that involve emergent properties or complex feedback loops.

   The procedure must be executable in about 5 minutes per claim.

   Now, the procedure:

   Triage Step:
     Read the claim and assign it to one of the following categories based on the primary assertion:
       A. Causal: Look for words like "caused", "prevented", "led to", "because", "why".
       B. Constitutive/Definitional: Look for words like "is", "defines", "makes it a", "constitutes", "invariant".
       C. Normative/Design-level: Look for words like "should", "fair", "maintainable", "efficient", "good", "goal", "purpose".

     If the claim fits more than one, choose the dominant one. If unclear, note and proceed cautiously.

   Then, for each category:

   A. Causal Claim Procedure:
     Step A1: Counterfactual Test.
        Question: "If the high-level property (X) had been absent, would the outcome (Y) have been different, holding the substrate fixed in all other relevant respects?"
        How to answer: Consider a scenario without X but with the substrate arranged so that the low-level events that are supposed to realize X are absent or altered. Would Y still occur?
          - If clearly no (Y would not have occurred or would have been different), then proceed to Step A2.
          - If yes (Y would have occurred anyway) or if it's unclear, then the claim may be epiphenomenal. Proceed to Step A3 to check for overdetermination or screening-off.
          - If the counterfactual scenario is too vague or impossible to construct, note and go to Step A3.

     Step A2: Virtue Test.
        Question: "Did the outcome occur in virtue of the high-level property X, or merely in virtue of a substrate property that happens to be associated with X?"
        How to answer: Consider whether the causal chain depends on the high-level property as such. For example, if X is "fairness", did the outcome (preventing a split-brain) happen because the system was fair, or because of a particular message timing? If the high-level property is multiply realizable and the effect occurs only when the high-level property is present (regardless of realization), then it's in virtue of X. If the effect occurs only because of a specific low-level detail (which might be changed without affecting the high-level property, but then the effect changes), then it's not in virtue of X.
          - If in virtue of X, then verdict: Load-bearing.
          - If not, then verdict: Commentary.

     Step A3: Screening-off Test.
        Question: "Does the substrate description (states, transitions, packets, etc.) fully account for the outcome, such that adding the high-level claim adds no new predictive or explanatory power beyond what the substrate description provides?"
        How to answer: Consider whether knowing the substrate details makes the high-level claim redundant for explaining the outcome. If the substrate description is sufficient to predict the outcome and the high-level claim doesn't add any insight that helps in design or debugging, then it's screened off.
          - If screened off, verdict: Commentary.
          - If not, then the high-level claim might be providing a necessary abstraction (e.g., for tractability). Proceed to Step A4.

     Step A4: Tractability Test (Judgment Call).
        Question: "Is the high-level claim necessary for the tractability of design, communication, or reasoning about the system, even if it is screened off at the substrate level?"
        How to answer: Consider whether the claim is used in making design decisions, whether it helps in modular reasoning, or whether it is referenced in other parts of the document or in discussions. If yes, then it is load-bearing as an abstraction. Otherwise, it is commentary.
          - If necessary for tractability, verdict: Load-bearing.
          - Otherwise, verdict: Commentary.

   B. Constitutive/Definitional Claim Procedure:
     Step B1: Multiple Realizability Test.
        Question: "Is the high-level property (X) multiply realizable? That is, could the same property be achieved by different substrate arrangements?"
        How to answer: Think of two different ways to implement the module (e.g., two different queue implementations) that both satisfy the invariant. If yes, then the high-level property is not tied to a specific substrate, so it is not merely commentary. Proceed to Step B2.
          - If no (the property is tied to one specific substrate arrangement), then verdict: Commentary.

     Step B2: Role in Design Test.
        Question: "Is the high-level property used in the design to ensure correctness, compatibility, or to define interfaces?"
        How to answer: Check if the property is part of the specification that other components rely on, or if it is used to reason about the system. If yes, then it is load-bearing. Otherwise, it is commentary.
          - If yes, verdict: Load-bearing.
          - If no, verdict: Commentary.

   C. Normative/Design-level Claim Procedure:
     Step C1: Value Grounding Test.
        Question: "Is the high-level property (e.g., fairness, maintainability) tied to a specific design goal that is agreed upon by the team and documented?"
        How to answer: Check if the design goal is stated in the project's requirements, principles, or charter. If not, then the claim may be subjective. Proceed to Step C2.
          - If it is tied to an agreed goal, then the claim is load-bearing as it justifies design choices. Verdict: Load-bearing.

