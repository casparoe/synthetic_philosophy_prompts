answer: |-
  Below is a decision-tree handout designed to sort students' views on future contingents based on concrete cases, not preconceived labels. The tree starts from the sentence "There will be a sea battle tomorrow" asserted today and uses key questions to navigate the logical space. It includes your required cases (LEM for future contingents and the historian retrodiction case), fits within 9–10 nodes, and flags unresolvable positions and deterministic implications.  

  ---

  ### **Decision Tree: Future Contingents**  
  *Start with: "There will be a sea battle tomorrow" (asserted today).*

  1. **Q1: Is this sentence true or false today? (Bivalence)**  
     - **YES** → Go to Q2.  
     - **NO** → Go to Q3.  

  2. **Q2: Is "Either there will be a sea battle tomorrow or there won't" true today? (LEM)**  
     - **YES** → **Leaf: Ockhamism or Thin Red Line**  
       - *Bivalence holds. Truth is fixed but unknown; no present "truthmaker" required. Past/future are real. Ockhamism and Thin Red Line agree here—both assert a unique actual future.*  
       - *🔍 Collapse note: These views are indistinguishable in the tree. Thin Red Line adds a "privileged branch," but it doesn't affect truth-value assignments.*  
     - **NO** → **Leaf: Incoherent View**  
       - *Bivalence requires LEM (if "will" and "won’t" exhaust options, their disjunction must be true). This combination is logically untenable.*  

  3. **Q3: Is "Either there will be a sea battle tomorrow or there won't" true today? (LEM)**  
     - **YES** → **Leaf: Supervaluationism**  
       - *The disjunction (LEM) is true, but the original sentence is indeterminate. Truth requires supertruth (true on all futures).*  
       - *⚠️ Conflation note: Differs from Peirceanism ("will" = "inevitably will"). Peirceanism rejects LEM and often lands in Lukasiewicz (Q4–Q5).*  
     - **NO** → Go to Q4.  

  4. **Q4: In 2060, a historian (with lost records) asks: "Was there a sea battle on March 3rd?" Does her sentence have a truth value now? (Retrodiction)**  
     - **YES** → Go to Q5.  
     - **NO** → **Leaf: Open Past (Unoccupied)**  
       - *Past truths can be indeterminate. No major theory holds this—it undermines the fixity of the past and is highly unattractive.*  

  5. **Q5: After tomorrow, if a sea battle occurs, was today’s assertion "There will be a sea battle tomorrow" true? (Retrospective Truth)**  
     - **YES** → **Leaf: Growing-Block Open Futurism**  
       - *Future contingents lack truth values (future not real), but past utterances gain truth as events join the "growing block" of reality.*  
     - **NO** → **Leaf: Lukasiewicz Three-Valued Logic**  
       - *Future contingents were indeterminate when uttered and remain so. Truth values are "fixed" at utterance time.*  

  ---

  ### **Key Notes**  
  - **Unresolvable Positions**:  
    - **Ockhamism vs. Thin Red Line**: The tree *cannot* distinguish them (both answer Q1=YES, Q2=YES). Thin Red Line adds a "silently actual" future branch, but it doesn’t alter truth-value assignments.  
    - **Supervaluationism vs. Peirceanism**: Students often conflate these. Supervaluationism accepts LEM (Q3=YES); Peirceanism rejects LEM (Q3=NO, branching to Lukasiewicz).  
  - **Determinism Break**:  
    - In deterministic worlds, the future is fixed by the present. **Q1=YES becomes necessary**, collapsing non-bivalent views (all paths from Q1=NO vanish). Only Ockhamism/Thin Red Line and the incoherent view remain viable.  
  - **Tree Stats**:  
    - 5 nodes (Q1–Q5), 6 leaves (all major positions + 1 unoccupied).  
    - Combines your cases:  
      - LEM (Q2/Q3) splits three-valued logic (Lukasiewicz) from supervaluationism.  
      - Historian retrodiction (Q4) separates truthmaker-based views (Growing Block/Lukasiewicz) from an unoccupied "open past" view.  

  ---

  ### **How to Use**  
  1. Students answer questions **cold** (no prior knowledge of positions).  
  2. Follow the path to a leaf—each corresponds to a named theory.  
  3. Discuss unresolvable pairs (Ockhamism/Thin Red Line) and conflations (Peirceanism) in class.  

  This tree forces students to confront concrete intuitions about truth, time, and indeterminacy, moving beyond labels to underlying commitments.
