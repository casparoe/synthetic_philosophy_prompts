prompt: |-
  I've recently been asked to run the professional-development seminars at my firm, and a senior partner wants me to teach ethics the biographical way — Plutarch's way, he says: put admirable lives in front of the young associates and let imitation do the rest. Preparing for it, I've run into a problem I can't name. Every biography worth assigning was chosen because things ended well, and the virtues it credits look reverse-engineered from the ending: in a founder whose gamble paid off, stubbornness reads as conviction; in one whose identical gamble ruined him, the same trait reads as vanity. When I deliberately pair each success with a matched failure, the failure teaches the opposite lesson with what seems like the same textual support. I get the same impression from saints' lives, where childhood anecdotes count as signs of holiness only because the ending was already known. And when a life ends ambiguously — a brilliant career wrecked by one late mistake — colleagues extract opposite lessons from the very same life depending on which ending they weight. So the moral lesson of a life seems to be manufactured by selection and hindsight rather than found in the life itself. Is there an established concept for exactly this? I can see it's somewhere near moral luck, survivorship bias, and hindsight bias, but none of those, as far as I can tell, is about whether a life can function as a moral lesson at all, which is the question I actually face. Please answer in four sections, in this order: "Nearest concepts and where they miss" (about 200 words), "A name and definition, or why none fits" (about 150), "Boundary cases" (about 150), and "Verdict on the biographical method" (about 200). In the last section, don't just lay out the options — commit to a definite position on whether teaching ethics through lives survives this problem, and tell me on what terms.
reasoning: |-
  Okay, the user is dealing with a challenge in teaching ethics through biographies. They've noticed that virtues are often assigned based on outcomes, and when they pair successful and unsuccessful individuals with similar traits, the lessons conflict. They want to know if there's a specific term for this issue, but they've already ruled out concepts like moral luck and survivorship bias.

  First, I need to recall relevant philosophical concepts. Moral luck is when judgment depends on factors beyond control. Survivorship bias focuses on successes while ignoring failures. Hindsight bias involves viewing past events as predictable. But the user mentions these don't quite fit because the problem is about deriving moral lessons from lives where the ending dictates the virtue ascribed. The core issue is retroactive attribution based on outcomes. 

  The user also mentions saints' lives and ambiguous cases where people draw opposite lessons. So the biographical method itself might be flawed in how it assigns morality. I remember that Nietzsche discussed "monumental history," where past figures are idealized to serve present values. Also, William James's pragmatism might relate, where the truth of an attribute is tied to its success. But is there a specific term? "Teleological distortion" comes to mind, meaning interpreting the past based on its outcomes. Or "virtue reification," where traits are solidified only after success. However, these aren't established terms. The closest might be "outcome bias," but that's more about judging decisions rather than life lessons. 

  For boundary cases, consider figures like Oppenheimer, whose legacy is mixed. Successful individuals might have flaws overlooked, like Churchill's wartime leadership versus his colonial policies. Cases where failure was due to external factors, like Joan of Arc, where her execution could be seen as martyrdom despite the outcome. 

  The verdict needs to address whether the biographical method can still be useful. Acknowledge the problem but suggest it's about critical engagement. Use biographies to discuss how context and contingency affect moral judgments rather than presenting them as straightforward exemplars. Emphasize the process of ethical reasoning over imitation.
answer: |-
  Here is the analysis structured as requested:

  **I. Nearest Concepts and Where They Miss (≈200 words)**  
  Your core problem touches several established ideas but isn't fully captured by any:  
  *   **Moral Luck (Nagel/Williams):** Focuses on how *outcomes beyond control* alter moral judgment of *identical actions/choices*. Your observation includes this (gambles succeeding/failing due to luck), but extends further. You highlight how the *entire narrative arc* of a life becomes reinterpreted *retrospectively* based on the outcome, attributing virtues/vices based on success/failure, not just judging isolated actions. It's about *biographical construction*, not just luck's impact on judgment.  
  *   **Survivorship Bias:** This explains why we study successful founders (only their stories survive), ignoring similar failures. You incorporate this (pairing successes with matched failures), but your problem goes deeper: it's about how the *interpretation of traits within the surviving narrative* is fundamentally shaped by the known success. The bias infects the *meaning* assigned to the life, not just the selection of which lives are studied.  
  *   **Hindsight Bias:** Crucial for understanding why past events (childhood anecdotes) seem like inevitable signs leading to a known outcome. This explains the *narrative illusion* within a single biography. However, your problem involves the *comparative* aspect: identical traits interpreted oppositely based on divergent outcomes. It's hindsight shaping *moral categorization*, not just perceived predictability.  

  These concepts address *components* (luck's role, sample distortion, narrative distortion) but not the *synthetic core*: the fundamental *contingency of moral exemplarity* derived from a life story, where the ending dictates the virtue/vice labels applied to antecedent traits and actions.

  **II. A Name and Definition, or Why None Fits (≈150 words)**  
  There is no single, universally established term for *exactly* this phenomenon. The closest descriptive phrase is **"Teleological Moralization of Biography"** or **"Outcome-Dependent Virtue Attribution."**  

  *   **Definition:** The process whereby the perceived moral valence (virtue/vice) of character traits and actions within a biographical narrative is *retrospectively assigned* or *fundamentally altered* primarily based on the known final outcome (success/failure) of the subject's life or key endeavors, rather than inherent qualities or consistent principles. This renders the extracted moral lesson contingent on that outcome, undermining claims of universal applicability derived from the life itself.  

  No existing term perfectly fits because the phenomenon sits at the *intersection* of the biases mentioned: it's the *product* of survivorship bias filtering lives, hindsight bias structuring their narratives, and moral luck determining the outcome that then triggers the teleological moralization. The unique focus is on the *manufacture of moral meaning* from the life story relative to its ending.

  **III. Boundary Cases (≈150 words)**  
  The problem's severity varies:  
  *   **Strong Cases:** Founders/entrepreneurs (gambles paid/ruined), military leaders (audacity as genius/folly), saints/martyrs (childhood "signs" validated by sainthood). The outcome dominates interpretation.  
  *   **Weaker Cases (but still present):**  
      *   Figures with complex, multi-stage lives (e.g., Oppenheimer: scientific brilliance vs. political downfall - lessons depend on which "ending" is weighted).  
      *   Lives where success involved morally ambiguous means later overshadowed by the result (e.g., historical figures lauded for achievements built on exploitation; the "success" sanitizes the means).  
      *   "Failures" reinterpreted as moral victories *because* of the failure (e.g., Socrates' execution, Joan of Arc's burning - the *manner* of failure becomes the virtue signal, still outcome-dependent).  
  *   **Potential Counter-Cases:** Lives defined by unwavering adherence to principle *despite* catastrophic personal outcomes, where the virtue is precisely in the defiance of consequence (e.g., Antigone, Thomas More). Yet, even here, their status as exemplars often relies on *our* hindsight valuing that principle highly.

  **IV. Verdict on the Biographical Method (≈200 words)**  
  **The biographical method *can* survive this problem, but only by radically shifting its goal and execution away from simple imitation towards critical engagement with narrative construction and contingency.**  

  Abandon the premise that lives *inherently* offer clear, imitable moral lessons. Instead, explicitly frame biographies as:  

  1.  **Case Studies in Contingency & Interpretation:** Use matched pairs (success/failure) or ambiguous lives *to expose* teleological moralization. Ask: "How does knowing the ending shape how we read this trait? What if the coin-toss had landed differently?"  
  2.  **Tools for Ethical Reasoning:** Focus on the *process* of decision-making *within* the subject's context and constraints, analyzing the reasoning (flawed or sound) *before* the outcome was known. Discuss the role of luck and unforeseen consequences.  
  3.  **Catalysts for Discussion, Not Blueprints:** Use lives to spark debate on "What *should* we admire here, regardless of outcome?" and "Can we separate the virtue of an action/intention from its result?" Challenge the narrative itself.  

  **Commitment:** Yes, the method *can* be valuable, but **only if it explicitly confronts the problem of outcome-dependence rather than ignoring it.** Teach ethics *through* the critical analysis of biography, not *by* presenting biographies as straightforward moral exemplars. The lesson becomes about the complexity of judgment, the role of luck, and the construction of virtue narratives – far more valuable for professionals than simplistic imitation. Plutarch's method, naively applied, is fundamentally flawed; but used critically, it becomes powerful.
