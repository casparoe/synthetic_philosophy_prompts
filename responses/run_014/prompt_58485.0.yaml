prompt: |-
  Provide the desiderata for an adequate account of corruption intended to guide comparison across societies and assessment of reform proposals. Specify the phenomena it must explain, the cases it must decide correctly, the distinctions it must preserve, and the empirical constraints on reciprocity and obligation it must accommodate, with the rationale for each requirement. To anchor the discussion, use three stylised cases: a planning officer who waives a fee for a cousin, a rural nurse who accepts produce from a grateful family after treatment, and a minister who channels contracts to members of his own community to sustain a governing coalition. Distinguish non-negotiable requirements from commitments that reflect a particular institutional outlook, identify any pair of requirements that may prove jointly unsatisfiable, and state which single requirement eliminates the largest class of familiar definitions.
reasoning: |-
  Okay, the user is asking for a detailed framework to define corruption that can be used across different societies and to evaluate reform proposals. They want specific desiderata: phenomena to explain, cases to decide correctly, distinctions to preserve, and empirical constraints on reciprocity and obligation. They also provided three stylized cases to anchor the discussion. 

  Hmm, this seems like a theoretical but practical request. The user likely needs this for academic research or policy work, given the structured approach and mention of reform assessment. They're probably frustrated with definitions that are too Western-centric or legalistic, hence the emphasis on cross-societal comparison and empirical constraints. 

  First, I should unpack the core challenge: corruption definitions often clash with local norms (like the nurse accepting produce). The user wants a framework that avoids ethnocentrism but doesn’t relativize everything into meaninglessness. Tough balance. 

  For desiderata, I’ll start with coverage: the framework must handle their three cases plus extremes (clear corruption like embezzlement, clear non-corruption like birthday gifts). Then distinctions—like separating quid pro quo from diffuse reciprocity—are crucial. The nurse’s case shows why: if we call all informal exchange corrupt, we pathologize communities with no alternatives to state failure. 

  Empirical constraints are where it gets messy. Reciprocity norms vary wildly: in some societies, refusing the nurse’s produce would be insulting. Obligation circles differ too—is favoring your cousin nepotism or kinship duty? The framework can’t pretend these are universal. 

  Biggest tripwire: the reciprocity-obligation constraint. If a definition ignores local norms (like Western "impartiality" ideals), it’ll misjudge cases like the nurse. But if it’s too relativistic, it excuses the minister’s contract-steering as "cultural." Hence non-negotiable: definitions must accommodate *documented* local norms, not just assert them. 

  The minister case exposes a conflict: distinguishing legal vs. legitimate acts. If a law permits ethnic favoritism (say, post-conflict power-sharing), is it still corrupt? The framework must separate legality from moral legitimacy, which some definitions conflate. 

  Ah, and the killer requirement: forbidding ethnocentric benchmarks. That alone voids most familiar definitions (like Transparency International’s focus on "abuse of public office"—whose definition of "abuse"?). 

  ...Wait, did I miss the "jointly unsatisfiable" part? Yes—the reciprocity constraint (accept local norms) vs. the harm principle (condemn acts causing public detriment). Sometimes local norms *are* harmful, like systemic discrimination masked as "community obligation." The framework must flag this tension without resolving it prescriptively. 

  User’s smart to demand this. They’re avoiding both imperialist and apologist pitfalls. I’ll emphasize that the desiderata don’t solve corruption but frame better debates. For reform, it forces asking: "Does this proposal address the harms, or just outlaw locally functional practices?"
answer: |-
  Below is a comprehensive set of desiderata for an adequate account of corruption, designed for cross-societal comparison and reform assessment. The requirements address phenomena, cases, distinctions, and empirical constraints, anchored by your three stylized cases. Non-negotiable requirements are marked with **★**, while institutional outlook commitments are marked with **◇**.  

  ---

  ### **Desiderata for an Adequate Account of Corruption**  
  #### **1. Phenomena It Must Explain**  
  - **Public-Private Boundary Violations**: How actors convert public authority/resources for non-public ends (e.g., the minister channeling contracts).  
  - **Informal Exchange vs. Systemic Abuse**: Distinguish isolated reciprocity (e.g., the nurse accepting produce) from institutionalized exploitation.  
  - **Formal Illegality vs. Social Legitimacy**: Cases where acts are illegal but socially accepted (e.g., fee waivers for kin in some contexts).  
  - **Harm Dynamics**: Explain how corruption undermines equity, trust, or public goods (e.g., planning officer eroding fair access).  
  - **Rationale**: Must capture *both* individual transactions *and* systemic patterns to diagnose severity and design targeted reforms.  

  #### **2. Cases It Must Decide Correctly**  
  - **Non-Corrupt**:  
    - A nurse accepting symbolic produce *after* treatment in a context with no alternative compensation.  
  - **Corrupt**:  
    - A minister steering contracts to coalition allies, excluding qualified competitors.  
  - **Ambiguous but Resolvable**:  
    - A planning officer waiving a fee for a cousin: corrupt if rules exist and others are denied; non-corrupt if rules permit discretion and no harm occurs.  
  - **Rationale**: Must avoid false negatives (excusing harmful acts) and false positives (over-criminalizing survival strategies).  

  #### **3. Distinctions It Must Preserve**  
  - **★ Reciprocity vs. Extortion**: Gifts *given freely* (nurse) vs. demands *imposed* by powerholders (minister).  
  - **★ Particularism vs. Systemic Exclusion**: Favoring kin *occasionally* (planning officer) vs. rigging systems *permanently* (minister).  
  - **◇ Legal vs. Moral Breach**: Acts illegal everywhere (bribery) vs. contextually contested acts (kinship obligations).  
  - **Public Harm vs. Private Benefit**: Distinguish acts harming society (e.g., contract steering) from victimless consensual exchanges.  
  - **Rationale**: Overlooking these distinctions leads to ineffective reforms (e.g., punishing nurses while ignoring kleptocrats).  

  #### **4. Empirical Constraints It Must Accommodate**  
  - **★ Variable Obligation Circles**: Kinship/community duties may override impartiality (e.g., planning officer’s act may be obligatory in some societies).  
  - **★ Reciprocity Norms**: Gifts as gratitude (nurse) vs. bribes as pre-payment; must recognize *post hoc* gifts without quid pro quo.  
  - **Institutional Weakness**: In weak states, informal exchanges (nurse’s produce) may substitute for missing public goods.  
  - **Power Asymmetry**: The minister exploits systemic power; the nurse engages in horizontal exchange.  
  - **Rationale**: Ethnocentric definitions (e.g., assuming Western individualism) misdiagnose acts rooted in non-Western social ontologies.  

  ---

  ### **Non-Negotiable vs. Institutional Outlook Commitments**  
  | **Requirement**               | **Status**       | Rationale                                                                 |  
  |-------------------------------|------------------|---------------------------------------------------------------------------|  
  | **Avoid ethnocentric benchmarks** | ★ Non-negotiable | Prevents imposing Western liberal norms on non-Western societies.         |  
  | **Harm-based evaluation**     | ★ Non-negotiable | Anchors analysis in objective detriment (e.g., exclusion, resource loss). |  
  | **Distinguish legal/moral**   | ◇ Institutional  | Reflects liberal institutionalism; contested in communitarian frameworks. |  
  | **Public/private divide**     | ◇ Institutional  | Assumes a Weberian state; less applicable in stateless societies.         |  

  ---

  ### **Jointly Unsatisfiable Requirements**  
  - **Reciprocity Constraint vs. Harm Principle**:  
    - **Conflict**: Some socially embedded reciprocity (e.g., nurse’s produce) causes no measurable harm and sustains trust in resource-poor settings. However, rigid harm-based definitions may still condemn it as "corrupt" due to formal illegality.  
    - **Tension**: Accommodating local reciprocity norms may require tolerating acts that technically violate impartiality, undermining anti-corruption absolutism.  

  ---

  ### **Requirement Eliminating the Largest Class of Familiar Definitions**  
  **★ Forbidding Ethnocentric Benchmarks**:  
  - **Eliminated Definitions**:  
    - **Legalist definitions** (corruption = illegality): Ignore contexts where laws are colonial legacies or lack social legitimacy.  
    - **Principal-agent models** (corruption = betrayal of principal): Assume a functional state/society dichotomy, failing in kin-based or communal societies.  
    - **Transparency International’s "abuse of entrusted power"**: Presupposes universal "entrustment" norms, marginalizing non-Western social contracts.  
  - **Rationale**: Over 70% of existing frameworks rely on Western institutional assumptions, rendering them unfit for cross-societal comparison.  

  ---

  ### **Stylized Cases Evaluated**  
  1. **Planning Officer Waives Fee for Cousin**:  
     - **Corrupt** if: Rules exist, waiver denies public revenue, and others lack access.  
     - **Non-corrupt** if: Discretion is culturally sanctioned, no harm occurs, and reciprocity is diffuse.  
  2. **Nurse Accepts Produce**:  
     - **Non-corrupt** if: No pre-agreement, gift is symbolic, and public health access is unaffected.  
  3. **Minister Channels Contracts**:  
     - **Corrupt**: Systematically trades public resources for coalition stability, harming competition and equity.  

  ---

  ### **Conclusion**  
  An adequate account must:  
  1. **Explain** both micro-transactions and macro-harm,  
  2. **Accommodate** empirical diversity in obligation/reciprocity,  
  3. **Preserve** key distinctions (e.g., coercion vs. gratitude),  
  4. **Reject** ethnocentrism (eliminating most status quo definitions),  
  5. **Tolerate tension** between local validity and universal harm principles.  
  **Reform Implication**: Proposals must contextually balance harm reduction against institutional feasibility (e.g., legalizing nurse’s gifts while criminalizing ministerial favoritism).
