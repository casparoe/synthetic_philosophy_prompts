  For ordering by damage: The decision theorist's dynamic choice objection could be most damaging since it attacks practical rationality. Then reductionism - if their view just reduces to Bayesianism, it loses novelty. The self-undermining point might hit hard psychologically. The betting question is fundamental but perhaps more expected. Updating speed is important but might be seen as technical. Other objections like the ally's actionability concern or ambiguity aversion might be less critical.

