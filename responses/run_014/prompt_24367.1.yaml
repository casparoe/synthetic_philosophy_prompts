  We are designing a decision procedure for assigning a subject to one of Dennett's four cognitive levels:

  Level 1: Darwinian Creatures (fixed competence by evolution, no individual learning)
  Level 2: Skinnerian Creatures (Level 1 + individual learning from reinforcement, where the creature bears the cost of failed attempts)
  Level 3: Popperian Creatures (Level 2 + offline simulation in an internal model, so hypotheses bear the cost of being wrong)
  Level 4: Gregorian Creatures (Level 3 + externalized competence in shared cultural artifacts, so generate-and-test is distributed across the population and tools)

  The procedure is a step-by-step test, starting from Level 1 and moving up. We stop as soon as a level fails and assign the lower level. Some steps may require judgment and if so, we note it.

  The procedure:

  Step 1: Test for Level 1 (Darwinian)
     Question: Does the subject show any evidence of individual learning (i.e., changes in behavior as a result of experience during its lifetime) that cannot be attributed to maturation, injury, or other non-cognitive factors?
     Evidence: Look for changes in behavior over the subject's lifetime in response to specific events. If there is any such change, then Level 1 fails (because Level 1 requires no individual learning) and we must proceed to Level 2. If there is no evidence of individual learning, then assign Level 1 and stop.

  Step 2: Test for Level 2 (Skinnerian)
     Question: Does the subject learn by reinforcement (trial-and-error learning) where the subject itself bears the cost (e.g., time, energy, risk) of failed attempts?
     Evidence: Look for behavior that is shaped by rewards and punishments. The key is that the subject must show trial-and-error: it tries different actions and adjusts based on the outcomes, and the costs of the errors are incurred by the subject. If there is no evidence of this kind of learning, then assign Level 1 and stop. If there is, then proceed to Level 3.

     Note: We must be cautious to avoid misclassifying innate or pre-programmed behaviors as learning. Also, if the learning is very rapid and without observable external trial-and-error, we might suspect Level 3, but we don't jump ahead. We only assign Level 2 at this step if there is evidence of reinforcement learning with the subject bearing the cost.

  Step 3: Test for Level 3 (Popperian)
     Question: Does the subject have the ability to simulate actions and their consequences internally (offline) without having to actually perform the actions and bear the cost of failure? 
     Evidence: Look for behavior that suggests planning or internal simulation. The subject should be able to solve novel problems without visible trial-and-error. However, note that fast trial-and-error that is not easily observable might be misinterpreted. Therefore, we require one of the following:
        a) Evidence of "insight" or "aha" moments where the solution appears without overt trial.
        b) Evidence that the subject can mentally simulate: for example, pausing to "think" before acting, or making errors in simulation that do not incur real-world costs (e.g., vicarious trial and error in rodents, or brain activity indicating internal models).
        c) If the subject is an AI/robot, we can inspect its architecture for an explicit world model and planning module.

     But note: The critical point is that the subject must be able to generate and test hypotheses internally. If we cannot find evidence for this, we assign Level 2 and stop.

     Judgment call: Sometimes the evidence might be ambiguous. For example, if a subject solves a problem quickly, is that due to fast internal simulation or just very efficient trial-and-error? We need to look for signs that the trial-and-error is internal (e.g., neural correlates, or behavior like hesitation, or the ability to learn without acting). If the evidence is not clear, we must note that it's a judgment call and then we have two options: 
          - If the committee judges that internal simulation is occurring, then proceed to Level 4 test.
          - If not, then assign Level 2.

     However, the procedure must be as objective as possible. We might require multiple tests or specific experimental setups to rule out overt trial-and-error.

  Step 4: Test for Level 4 (Gregorian)
     Question: Does the subject externalize its cognitive competence into shared, cumulative cultural artifacts (e.g., language, tools, symbols, codes) that are transmitted and improved upon across the population and over time?
     Evidence: Look for:
        a) The creation or modification of artifacts (physical or symbolic) that are used by others.
        b) Cumulative cultural evolution: improvements in the artifacts over time and across individuals.
        c) The artifacts must be shared and the generate-and-test process must be distributed (i.e., the testing of ideas is done by the population and the artifacts, not just by the individual).

     Note: Mere tool use is not enough. The tool must be part of a shared, cumulative cultural system. If the subject uses tools but does not share or cumulatively improve them, then it is not Level 4.

     Judgment call: It can be hard to distinguish between individual tool use and true cultural externalization. We require evidence of transmission and cumulative improvement.

  If the subject passes all four steps, assign Level 4.

  Now, let's run the procedure on the three subjects.

  Subject 1: A foraging insect
     - Step 1: Does it show individual learning? The description says: "route choices vary from day to day but which never appears to adjust its behavior in response to rewards or punishments over its lifetime". 
          So, there is no evidence of individual learning. Therefore, we assign Level 1 (Darwinian) and stop.

     Assignment: Level 1.

  Subject 2: A cephalopod
     - Step 1: Does it show individual learning? We are not given explicit information about learning over its lifetime, but the description focuses on a single trial. However, since it is a long-term resident, we assume that we have behavior logs. The description does not say that it doesn't learn at all, so we must assume that cephalopods are known to learn. In fact, cephalopods are known for their learning abilities. So, we proceed.

          But note: The procedure requires evidence of individual learning. If we have no evidence of learning in the log, we might have to assign Level 1. However, since it is a cephalopod (and we know they are capable of learning), we might have prior evidence. The procedure is based on the behavior log. Let's assume the log shows evidence of learning (because if it didn't, we wouldn't be considering higher levels). So, we proceed to Step 2.

     - Step 2: Does it learn by reinforcement with the subject bearing the cost? The description does not directly address this. We are told about a single trial. However, cephalopods are known to learn by trial and error. The key event is that it solved a novel puzzle on the first attempt without visible trial-and-error. But note: the description says "on close observation, is running a very fast internal search and does receive environmental feedback on each micro-attempt". 

          This is critical: the cephalopod is doing internal simulation (Level 3) but Step 2 is about whether it does reinforcement learning (Level 2). The fact that it can do internal simulation does not mean it doesn't also do reinforcement learning. In fact, the procedure is sequential: we are now at Step 2, and we are only looking for evidence of reinforcement learning. Since cephalopods are known to learn from experience (and we assume the log shows that), then Step 2 is passed. We proceed to Step 3.

     - Step 3: Test for Level 3 (Popperian). The description explicitly says: the cephalopod "is running a very fast internal search and does receive environmental feedback on each micro-attempt". This sounds like internal simulation. However, note that the feedback is environmental. That means that the internal search is not entirely offline? 

          Let's parse: 
            - "Internal search": this suggests the generation of hypotheses internally.
            - "Environmental feedback on each micro-attempt": this suggests that the testing of each hypothesis is done by interacting with the environment. So, the cost of being wrong is still being borne by the subject? Because even if it's "micro", it's still in the environment and might incur some cost (e.g., time, energy, risk of detection).

          This is a critical boundary. The definition of Level 3 is that the hypotheses bear the cost, meaning the cost is not in the real world but in an internal model. If the cephalopod is getting feedback from the environment on micro-attempts, then it is doing very fast trial-and-error in the real world, not offline simulation. 

          Therefore, we might conclude that this is not Level 3 but very fast Level 2. 

          But the description says "internal search". How do we reconcile? 

          The procedure requires that the simulation is offline. If the micro-attempts are physical (even very small movements) and they are observable in the environment, then it is not offline. The feedback is environmental, meaning it is not using an internal model to predict the outcome without acting.

          Therefore, the evidence does not meet the criteria for Level 3. We would assign Level 2.

          However, note that the user is confident it is Level 3. This step is a judgment call? 

          The procedure says: if we see observable trial-and-error (even if fast and micro) then it is not offline. The key is whether the testing is done without real-world consequences. In this case, the environmental feedback implies real-world consequences. So, by the strict procedure, we assign Level 2.

          But let's note the possibility of judgment: if the micro-attempts are so minimal that they incur negligible cost and are merely a way to sample the environment, then we might argue that it's a hybrid. However, the procedure is strict: if the testing involves environmental interaction (and thus the subject bears the cost, however small), then it's Level 2.

          Therefore, the procedure assigns Level 2.

          The step that produced this result is Step 3: we did not find evidence of offline simulation because the feedback was environmental. The procedure requires that the testing is done in an internal model so that the cost is not real. Here, the cost is real (even if small).

     Assignment: Level 2.

     But note: the user believes it is Level 3. The problem is that the procedure is designed to avoid over-interpreting internal states without clear evidence. The evidence of environmental feedback is the sticking point. If we had evidence that the cephalopod was using an internal model without environmental interaction (e.g., if it paused and then produced the correct solution without any micro-attempts), then we would assign Level 3.

     Therefore, the procedure might be over-strict in cases where the internal simulation is so tightly coupled with the environment that it requires minimal environmental feedback. However, the conceptual work of Step 3 is to ensure that the cost is borne by the hypotheses (in the model) and not by the creature. In this case, the creature is bearing the cost (of the micro-attempts).

  Subject 3: A fleet of identical robots
     - Step 1: Individual learning? The robots were trained by reinforcement learning. That means during their training phase, they learned individually. So, we proceed.

     - Step 2: Reinforcement learning? Yes, they were trained by RL, so they have learned by trial and error (with the robots bearing the cost during training). So, we proceed.

     - Step 3: Offline simulation? The description says: "now plan by simulating action sequences in an internal world-model before executing". This is exactly offline simulation. They generate and test hypotheses internally. So, we proceed.

     - Step 4: Gregorian? The description: "share their models and planning code across the fleet through a common repository the population updates cumulatively." This sounds like externalization and sharing. The competence (the models and code) is stored in a shared repository and updated cumulatively. Therefore, the generate-and-test machinery is distributed: one robot can generate a model, and the others can test it and improve upon it. The artifacts (the code and models) are the medium of cultural transmission.

          So, we assign Level 4.

     Assignment: Level 4.

     Note: The robots are identical, but that doesn't prevent cumulative improvement because the repository is updated. Also, note that during training they did individual learning, but now they share. The procedure is about the current state.

  Summary of assignments:
    Insect: Level 1
    Cephalopod: Level 2 (with the note that Step 3 failed due to environmental feedback on micro-attempts)
    Robots: Level 4

  What the procedure cannot do:
     - It may misclassify creatures that have internal simulation but for which we cannot observe the absence of environmental feedback (e.g., if the simulation is entirely covert and leaves no behavioral trace). In that case, we might assign Level 2 when it should be Level 3.
     - It may also misclassify creatures that are Level 3 but in a way that requires minimal environmental feedback (like the cephalopod example) because the procedure requires that the simulation is entirely offline (no environmental feedback during the testing of hypotheses).
     - For Level 4, it might be too strict because cumulative culture requires long-term observation. We might not be able to observe it in an hour of behavior log. We would have to rely on prior knowledge or specific tests.
     - The levels are imposed from outside (they are Dennett's framework). The procedure is a way to map observed behavior to these levels. It does not discover the levels in the subject but rather categorizes the subject based on the evidence. The levels are a theoretical framework.

  Finally, note that the procedure requires that we have sufficient data in the behavior log. For a new subject, we might need to run specific tests during the hour to get the necessary evidence.
answer: |-
  ### Decision Procedure for Dennett's Cognitive Levels

  #### Procedure Structure
  1. **Sequential Testing**: Start at Level 1. Proceed upward only if the subject passes all criteria for the current level. If a level fails, assign the previous level and stop.
  2. **Judgment Flags**: Explicitly note where evidence is ambiguous, requiring committee judgment.
  3. **Time Budget**: Designed for ~1 hour with a behavior log. Use simple tests (e.g., novel object interactions, reward/punishment trials) if logs are insufficient.
  4. **Key Boundaries**:
     - **Level 2 vs. 3**: Focus on *offline simulation* (cost-free internal hypothesis testing).
     - **Level 3 vs. 4**: Focus on *externalized, cumulative cultural artifacts* (not just tool use).

  ---

  #### Step-by-Step Procedure

  **Level 1: Darwinian Creature**  
  *(Fixed competence; no lifetime learning)*  
  - **Question 1.1**: Does the subject show *any* lifetime behavioral changes in response to rewards/punishments or novel experiences (beyond maturation/innate decay)?  
    - **Evidence**: Look for:  
      - Increased/decreased attraction to stimuli after positive/negative outcomes.  
      - Altered behavior after exposure to new environments.  
    - **Sufficiency**: Any unambiguous change = **FAIL** (proceed to Level 2). No change = **PASS** (assign Level 1).  
    - **Judgment**: If changes are subtle (e.g., hormonal fluctuations), flag for committee.  
  - **Outcome**: Fail → Proceed to Level 2. Pass → Assign Level 1, stop.

  **Level 2: Skinnerian Creature**  
  *(Lifetime reinforcement learning; subject bears error costs)*  
  - **Question 2.1**: Does the subject learn through trial-and-error, with behavioral adjustments *after* receiving real-world feedback (rewards/punishments)?  
    - **Evidence**: Look for:  
      - Gradual improvement in success rate (e.g., faster puzzle-solving over trials).  
      - Avoidance of actions previously punished.  
    - **Sufficiency**: Clear improvement or adaptation = **PASS** (proceed to Level 3). No improvement = **FAIL** (assign Level 1).  
    - **Judgment**: If learning is extremely rapid (e.g., one-trial), flag—may be Level 3.  
  - **Question 2.2** (If 2.1 passed): Are error costs (time, energy, risk) borne *by the subject* during learning?  
    - **Evidence**: Observe failed attempts (e.g., physical effort, exposure to threats).  
    - **Sufficiency**: Costs observed = **PASS**. No costs (e.g., errors are "simulated") = **FAIL** (assign Level 1).  
  - **Outcome**: Fail → Assign Level 1. Pass → Proceed to Level 3.

  **Level 3: Popperian Creature**  
  *(Offline simulation; hypotheses bear error costs)*  
  - **Question 3.1**: Can the subject solve *novel* problems without observable trial-and-error?  
    - **Evidence**: Look for:  
      - Success on first attempt after a delay (suggesting internal processing).  
      - "Insight" behaviors (e.g., abrupt solution after inactivity).  
    - **Sufficiency**: First-attempt success = **PASS**. Overt trial-and-error = **FAIL** (assign Level 2).  
    - **Judgment**: If no novel problems in logs, use a quick test (e.g., new puzzle). Flag if rapid micro-adjustments occur (boundary issue).  
  - **Question 3.2** (If 3.1 passed): Is there evidence that errors occur *offline* (i.e., no real-world cost)?  
    - **Evidence**: Look for:  
      - Absence of physical/energetic costs during problem-solving (e.g., no failed actions).  
      - Neurological/algorithmic data (if available) showing internal "search" (e.g., neural replay).  
    - **Sufficiency**: Clear offline processes = **PASS** (proceed to Level 4). Feedback-dependent micro-adjustments = **FAIL** (assign Level 2).  
    - **Judgment**: High—e.g., if internal search uses environmental feedback, committee must decide if costs are negligible.  
  - **Outcome**: Fail → Assign Level 2. Pass → Proceed to Level 4.

  **Level 4: Gregorian Creature**  
  *(Externalized competence; cumulative culture)*  
  - **Question 4.1**: Does the subject use or create tools/symbols that *externalize* knowledge (e.g., maps, language, code)?  
    - **Evidence**: Look for:  
      - Tool modification/creation beyond innate use.  
      - Symbolic communication (e.g., alerts to others).  
    - **Sufficiency**: Externalization observed = **PASS**. No externalization = **FAIL** (assign Level 3).  
    - **Judgment**: Flag if tools are simple/unmodified (e.g., a chimp using a stick).  
  - **Question 4.2** (If 4.1 passed): Are these artifacts *shared and cumulatively improved* across a population?  
    - **Evidence**: Look for:  
      - Transmission (e.g., teaching, imitation).  
      - Iterative refinement (e.g., more efficient tools over generations).  
    - **Sufficiency**: Clear transmission + refinement = **PASS**. Isolated use = **FAIL** (assign Level 3).  
    - **Judgment**: High—e.g., if sharing is centralized (e.g., a server), committee must decide if it enables distributed cognition.  
  - **Outcome**: Fail → Assign Level 3. Pass → Assign Level 4.

  ---

  ### Subject Classifications

  #### 1. **Foraging Insect**  
  *(Route varies daily; no lifetime adjustment to rewards)*  
  - **Level 1 (Q1.1)**: No lifetime learning observed → **PASS**.  
  - **Outcome**: **Level 1 (Darwinian)**.  
  - **Judgment Flags**: None.  
  - **Trace**:  
    - Q1.1: No behavioral changes post-rewards → **Level 1 assigned**.

  #### 2. **Cephalopod**  
  *(Solves novel puzzle on first attempt; fast internal search with environmental feedback)*  
  - **Level 1 (Q1.1)**: Assumed capable of learning (e.g., from logs) → **FAIL** → Proceed.  
  - **Level 2 (Q2.1)**: Learns from reinforcement → **PASS** (proceed).  
  - **Level 2 (Q2.2)**: Bears error costs (e.g., energy in past trials) → **PASS** → Proceed.  
  - **Level 3 (Q3.1)**: Solves novel puzzle on first attempt → **PASS** → Proceed.  
  - **Level 3 (Q3.2)**: Uses environmental feedback on micro-attempts → **FAIL** (costs incurred offline? **No**).  
  - **Outcome**: **Level 2 (Skinnerian)**.  
  - **Judgment Flags**:  
    - Q3.2: Environmental feedback blurs offline/online boundary. Committee must judge if feedback costs are trivial.  
  - **Why Level 2?**  
    - **Step**: Q3.2 failure (environmental feedback = hypotheses incur real-world costs).  
    - **Conceptual Work**: Step Q3.2 enforces Dennett's "hypotheses bear costs" requirement. It *is* strict but necessary—internal search with environmental feedback is still trial-and-error (Level 2), even if accelerated. Your confidence suggests the committee should override here, but the procedure flags it for judgment.  

  #### 3. **Robot Fleet**  
  *(Reinforcement-learned; plans via internal simulation; shares models/code via repository)*  
  - **Level 1 (Q1.1)**: Trained by RL → lifetime learning → **FAIL** → Proceed.  
  - **Level 2 (Q2.1 & Q2.2)**: RL involves trial-and-error with costs → **PASS** → Proceed.  
  - **Level 3 (Q3.1 & Q3.2)**: Plans via internal simulation → errors cost-free → **PASS** → Proceed.  
  - **Level 4 (Q4.1)**: Models/code are externalized artifacts → **PASS** → Proceed.  
  - **Level 4 (Q4.2)**: Shared repository enables cumulative updates → **PASS**.  
  - **Outcome**: **Level 4 (Gregorian)**.  
  - **Judgment Flags**: None (artifacts are explicitly shared and cumulative).  
  - **Trace**:  
    - Q1.1: RL training → **FAIL** → L2.  
    - Q2.1/Q2.2: RL confirms error costs → **PASS** → L3.  
    - Q3.1/Q3.2: Internal simulation → **PASS** → L4.  
    - Q4.1/Q4.2: Shared, updatable repository → **PASS** → **Level 4 assigned**.

  ---

  ### Limitations of the Procedure
  1. **Misclassified Minds**:  
     - **False Negatives for Level 3**: Subjects with "covert" offline simulation (e.g., no observable pause before action) may fail Q3.1.  
     - **False Positives for Level 4**: Centralized systems (e.g., bees with a hive mind) might pass Q4.2 without true cultural accumulation.  
     - **Anomalous Learners**: Creatures blending levels (e.g., instinct-guided learners) may force arbitrary assignments.  
     - **Non-Western Cognition**: Frameworks prioritizing collective over individual intelligence (e.g., Indigenous epistemologies) may not map cleanly.  

  2. **Levels as Imposed Frameworks**:  
     - The procedure **imposes Dennett's hierarchy** (nested, competence-based). It does not "discover" levels but tests for predefined criteria. Subjects with non-hierarchical cognition (e.g., distributed neural nets) may be misrepresented.  

  3. **Practical Constraints**:  
     - **Judgment Overreliance**: Ambiguities in Q3.2 (offline simulation) and Q4.2 (cumulative culture) may require expert input.  
     - **Static Logs**: Requires rich longitudinal data; brief logs may miss key evidence (e.g., slow cultural transmission).  

  ### Recommendations
  - **For Cephalopod**: Override to Level 3 if micro-attempt costs are negligible (e.g., neural energy only).  
  - **Procedure Refinement**: Add neuroimaging/AI-architecture checks for Level 3, and transmission experiments for Level 4.  
  - **Philosophical Note**: This procedure operationalizes Dennett's functionalism; it may not capture phenomenological or embodied aspects of cognition.  

  This balances efficiency with rigor, but committee expertise remains essential for borderline cases.
