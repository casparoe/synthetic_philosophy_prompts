prompt: |-
  Quick bit of context: I TA for a moral responsibility seminar, and this term the professor is trying something a little unusual -- pairing the standing-to-blame literature with a play. The play is Measure for Measure, whose title is lifted straight from the Sermon on the Mount -- judge not, lest ye be judged, for "with what measure ye mete, it shall be measured to you again" -- and the reading packet has the usual suspects on hypocrisy and standing: the Cohen piece on who has standing to condemn terrorists, Wallace on hypocrisy and equal standing, the argument over whether a hypocrite's blame is undercut by a real fairness problem or whether that's just tu quoque and shouldn't touch whether the blamed act was actually wrong. I don't need help finding more of that stuff, I can go chase down papers myself -- what I want from you is the actual reading, worked out scene by scene rather than in generalities, since that's the part I keep going in circles on for my discussion notes.

  Here's where I'm stuck. Angelo sentences Claudio to death for fornication under a law Angelo has, as far as anyone in the play knows, never had to resist breaking himself -- so is his standing already shaky before he ever lays eyes on Isabella, on some "untested virtue isn't standing" principle, or does standing really require he be guilty of something comparable, so it's only the later attempt to blackmail Isabella into bed that actually costs him his standing? And if it's the later thing, does that damage travel backwards and unmake the legitimacy of Claudio's sentence, or is the sentence's validity a seperate question from whether Angelo personally had any business handing it down? Then there's the Duke, an even weirder case -- he all but admits that enforcing his own long-neglected laws himself would make him look tyrannical, so he hands the dirty work to a deputy and hides in a friar's disguise to watch what happens -- does manufacturing someone else's temptation and then judging them for failing it launder your own standing problem or just relocate it onto someone else? And I'd love your take on Isabella, who is savage to Claudio in the cell for begging her to trade her body for his life, then in the last scene kneels next to Mariana to beg mercy for Angelo -- while still believing he'd had her brother executed -- on the oddly legalistic ground that his "act did not o'ertake his bad intent." Is that forgiveness doing work a standing argument would otherwise do, or is she making a standing argument of a different kind?

  Don't feel you need to tie it up neatly -- tell me where the plays ending (the public unmasking, marriages handed out like sentences, Claudio turning up alive after all) actually resolves the standing question, and where it just changes the subject to mercy instead. And if the philosophical literature and the play are pulling in different directions somewhere, say so rather than smoothing it over, I'd genuinely rather know. Take your time on this one and think it through properly, like you're about to defend the reading in front of the seminar rather than hand in a tidy study guide.
