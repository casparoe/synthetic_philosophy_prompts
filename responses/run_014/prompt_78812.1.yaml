  I remember that self-pumping is indeed a thing: someone with cyclic preferences might trade away an item only to later trade back, effectively paying to cycle through their own loop. That’s perfect for the joke—it makes the victim complicit in their own downfall and adds irony. 

  For structure: 
  Setup introduces the three characters in a bar setting (tea, coffee, hot choc—classic trio). 
  Punchline comes from Ulysses, embodying precommitment by literally binding their hands. The visual of wrapped hands sells the absurdity of "tying oneself down." 

  Why this works: 
