  Okay, the user runs a community mediation center and deals with disputes like neighbor issues, landlord-tenant conflicts, and business partnerships. They mentioned the hardest part is writing a case summary that both parties will sign off on before mediation starts. Each side has completely different stories, and both genuinely believe they're right. 

  They've been reading about the Jain concepts of anekāntavāda (truth has many sides) and syādvāda (qualifying claims with "in some respects"). They want a practical, step-by-step procedure to create a summary that honors both perspectives without forcing compatibility where it doesn't exist. The procedure needs to be done in about an hour per case and result in a summary that both parties can accept without walking out.

  The user provided two examples: a landlord-tenant dispute about unannounced visits and maintenance checks, and a business partnership disagreement over a handshake deal in a bar. They need a structured set of questions, criteria for sufficient answers, and clear indicators for reconciling points, contradictions, and judgment calls.

  First, I need to break down the Jain principles into practical steps. Anekāntavāda suggests that multiple perspectives can coexist, so the procedure should map out each party's view without merging them. Syādvāda involves conditional language like "from this perspective" or "under these conditions." The goal isn't to find absolute truth but to present each side's claims with qualifiers.

  The user's deeper needs might include reducing conflict escalation early in mediation, saving time, and increasing the likelihood of both parties agreeing to proceed. They might also want a method that reduces their own stress in drafting summaries and minimizes bias.

  For the procedure structure, I'll outline phases: Preparation, Perspective Mapping, Compatibility Assessment, and Synthesis. Each phase should have specific questions and criteria. For example, in Perspective Mapping, ask each party to list facts and concerns. Use qualifiers based on evidence strength—direct evidence (documents) vs. indirect (personal logs). 

  In the landlord-tenant example, the tenant logs 17 visits; landlord has work orders for half. The steps would involve listing each side's facts, identifying overlaps (8 visits both agree on), contradictions (9 unaccounted visits), and separating factual claims from interpretations. The synthesis would acknowledge documented maintenance and the tenant's experience of additional visits without assigning blame.

  For the business partners, one claims a binding handshake deal; the other says it was informal. Questions would focus on the context (bar, drinks), mutual understanding at the time, and subsequent actions. Since there's no documentation, it's a judgment call. The summary would present both viewpoints neutrally, highlighting the lack of formal agreement and differing interpretations.

  Key challenges include handling cases with partial evidence, avoiding assumptions, and knowing when to flag judgment calls. The procedure must remain neutral, using conditional language consistently. Timing is crucial—each phase needs to be time-boxed to fit within an hour.

  Finally, testing this with the provided cases ensures practicality. The output summary should validate each party's perspective without forcing resolution, making them feel heard and more willing to proceed to mediation.
answer: |-
  Here's a practical **Anekāntavāda Mediation Framework (AMF)** designed for your 1-hour constraint, generating a summary both parties can sign off on. It focuses on *structuring perspectives* rather than reconciling truth, using syādvāda-style qualifiers.

  **Core Principles of the AMF Procedure:**
  1.  **Map, Don't Merge:** Identify each perspective's core claims separately.
  2.  **Evidence Grading:** Categorize claims based on evidence strength (Observed, Documented, Asserted).
  3.  **Context is Key:** Explicitly note the context influencing each perspective.
  4.  **Conditional Language:** Mandatory use of qualifiers ("From X's perspective," "According to Y," "In the context of Z," "Documented instances show," "A asserts that").
  5.  **Identify Overlap & Dissonance:** Clearly mark where perspectives *might* align, *definitely* conflict, or lack information.
  6.  **Neutral Arbiter Role:** You are the *framework facilitator*, not the truth-decider.

  **The AMF Step-by-Step Procedure (Target: 45-60 mins):**

  **I. Preparation (5 mins):**
  *   Gather submitted written statements/evidence.
  *   Identify the 2-4 core conflicting claims per party (e.g., "Visits were excessive/unannounced" vs. "Visits were necessary/notified").

  **II. Perspective Mapping (15 mins - 7.5 mins per party *in your notes*):**
      For *each party* and *each core claim*, ask:
      1.  **"What specific events/actions form the basis of this claim?"** (List chronologically if possible. *Sufficient:* Concrete examples - dates, times, actions, words).
      2.  **"What evidence directly supports this description of those events?"** (Categorize: **O** = Observed by neutral 3rd party, **D** = Documented contemporaneously (logs, emails, receipts), **A** = Asserted based on memory/perception. *Sufficient:* Identification of type, not validity).
      3.  **"What context (past experiences, relationship history, personal beliefs, rules/laws referenced) shapes how you interpret these events?"** (e.g., "I have anxiety," "Previous tenants damaged property," "My culture values verbal agreements"). *Sufficient:* Any stated reason, no judgment.
      4.  **"What is the primary need or concern underlying this claim?"** (e.g., "Privacy," "Property protection," "Clarity," "Respect"). *Sufficient:* A stated emotional or practical need.

  **III. Compatibility Assessment (15 mins):**
      Compare the mapped perspectives claim-by-claim:
      1.  **Shared Facts:** Are there *events* both acknowledge happened? (e.g., "Visit on Date X occurred"). *Output:* State neutrally ("Both parties acknowledge visits occurred on [Dates]").
      2.  **Evidence Overlap/Dissonance:** Where do **O** or **D** evidence points exist? Do they support one perspective, both, or conflict? *Output:* "Tenant's log (D) shows 17 visits. Landlord's work orders (D) cover 8 visits." Flag conflicts ("Documented evidence conflicts on frequency/justification for 9 visits").
      3.  **Interpretive Dissonance:** Where do *interpretations* of shared/claimed events differ based on context? *Output:* "Landlord interprets frequent visits as necessary maintenance (context: property protection). Tenant interprets frequency as harassment (context: need for privacy)."
      4.  **Direct Contradiction:** Where do claims about the *same specific event* fundamentally conflict *and* lack **O/D** evidence? (e.g., "Party A says they said 'Yes' at the bar. Party B says they said 'Maybe'."). *Output:* "The parties hold directly contradictory recollections regarding the specific agreement made at [Location] on [Date]."
      5.  **Judgment Call Flags:** Mark areas where:
          *   Evidence is purely **A** vs. **A** (He said/She said on a key point).
          *   Contextual interpretations are core to the dispute and irreconcilable in summary.
          *   The *significance* or *impact* of an event is disputed with no neutral measure.

  **IV. Synthesis: Drafting the Summary (10 mins):**
      Structure the summary using this template:
      1.  **Introduction:** "This summary describes the differing perspectives presented by [Party A] and [Party B] regarding [Dispute Topic], based on their initial submissions for mediation. It reflects their views, not a determination of fact."
      2.  **The Situation:** Briefly state the *shared factual ground* (if any) and the *core areas of disagreement* identified in III.1 & III.4.
      3.  **Party A's Perspective (Using their name):**
          *   "From [A]'s perspective, key events include: [List key claimed events from II.1, prefixed with qualifier *'A states that...'/'A reports that...'*]."
          *   "A references supporting evidence including: [List evidence types from II.2, e.g., *'a personal log (D) showing...', 'emails from B (D) stating...', 'A's recollection (A) that...'*]."
          *   "A describes being influenced by the context of: [State context from II.3]."
          *   "A's primary concerns are: [State needs from II.4]."
      4.  **Party B's Perspective (Using their name):** (Same structure as above for B).
      5.  **Points of Potential Overlap/Dissonance:**
          *   "Both parties acknowledge: [State shared facts from III.1]."
          *   "Documented evidence shows: [State evidence overlaps/conflicts neutrally from III.2]."
          *   "The parties offer differing interpretations regarding [Topic X], influenced by their respective contexts of [Context A] and [Context B] (from III.3)."
          *   "The parties hold directly contradictory accounts regarding: [State specific contradictions from III.4]."
      6.  **Areas for Mediation Discussion:** "The mediation process may explore: [List flagged Judgment Call areas from III.5 and key interpretive differences]. The goal is to help the parties find a mutually acceptable resolution moving forward."
      7.  **Closing:** "This summary reflects the parties' initial positions as presented. Signing indicates agreement that it fairly represents *what they have stated*, not agreement with the other party's view, and consent to proceed with mediation." (Include signature lines).

  **V. Review & Sign-off (5-10 mins):**
  *   Read the summary aloud *verbatim* to both parties together.
  *   **Crucial:** Emphasize *this is a summary of their stated views, NOT the truth*. Signing means "This is what I told the mediator," not "I agree with the other side."
  *   Allow brief factual corrections ONLY ("You wrote I have 10 emails, I have 12" - fix it). Do NOT allow re-arguing interpretations.
  *   Obtain signatures.

  ---

  **Walking Through the Cases:**

  **Case 1: Landlord (LL) vs. Tenant (T) - Visits**

  *   **II. Perspective Mapping:**
      *   *T's Claim:* Excessive/Unannounced Visits (17 in 3 months).
          *   Events: List of dates/times from log.
          *   Evidence: Personal Log (D - Documented contemporaneously).
          *   Context: Need for quiet enjoyment, privacy, anxiety about intrusion.
          *   Need: Privacy, respect for lease terms, reduction in visits.
      *   *LL's Claim:* Necessary Maintenance with Notice.
          *   Events: Visits on dates matching work orders.
          *   Evidence: Work Orders for 8 visits (D). (Asserts notices were given for others, but no proof - **A**).
          *   Context: Legal duty to maintain property, past damage by other tenants.
          *   Need: Protect property, fulfill legal obligations, ensure tenant compliance.

  *   **III. Compatibility Assessment:**
      1.  **Shared Facts:** Visits occurred. *Specific Dates:* The 8 covered by work orders + T's log likely confirms those dates happened.
      2.  **Evidence:** T's Log (D) shows 17 visits. LL's Work Orders (D) cover 8 visits. **Direct Conflict:** 9 visits documented by T lack corresponding LL documentation/justification. LL's assertion of notice for non-work order visits is **A** vs T's **A** assertion of no notice.
      3.  **Interpretation:** LL interprets *frequency* as necessary (context: maintenance duty). T interprets *frequency* as excessive/intrusive (context: privacy/anxiety). LL interprets *visits without D notice* as notified (**A**). T interprets them as unannounced (**A**).
      4.  **Direct Contradiction:** Whether notice was given for the 9 non-work-order visits (**A** vs **A**). Whether the *overall frequency* was "excessive/harassing" vs. "necessary/appropriate" (Interpretive, but core conflict).
      5.  **Judgment Call Flags:** Notice for the 9 visits (pure **A** vs **A**). Interpretation of "excessive" vs. "necessary" frequency (subjective, contextual).

  *   **IV. Synthesis (Summary Excerpts):**
      *   "This summary describes the differing perspectives of [Tenant's Name] (T) and [Landlord's Name] (LL) regarding the frequency and nature of the landlord's visits to the rental property between [Dates]."
      *   "Both parties acknowledge visits to the property occurred during this period."
      *   **T's Perspective:** "T states that seventeen visits occurred within three months, documented in a personal log (D). T reports that many visits felt intrusive and unannounced, contributing to a sense of harassment. T references the context of needing privacy and quiet enjoyment of the home. T's primary concerns are privacy, respect for lease terms regarding notice and entry, and a reduction in the frequency of visits."
      *   **LL's Perspective:** "LL states that visits were primarily for legally required maintenance and inspections. LL references work orders (D) justifying eight specific visits during this period. LL asserts that proper notice was provided for other visits, though documentation beyond the work orders was not provided (A). LL references the context of a legal obligation to maintain the property and past experiences with property damage. LL's primary concerns are protecting the property, fulfilling legal maintenance obligations, and ensuring tenant compliance with lease terms."
      *   **Points:** "Documented evidence shows: T's log (D) records 17 visits. LL's work orders (D) cover 8 visits. The parties hold directly contradictory accounts regarding whether notice was provided for the nine visits not covered by LL's work orders. The parties also offer differing interpretations of the overall frequency of visits – T viewing it as excessive and intrusive within the context of needing privacy, and LL viewing it as necessary and appropriate within the context of property maintenance obligations."
      *   **Areas for Discussion:** "The mediation process may explore the communication regarding notice for visits, the interpretation of what constitutes 'reasonable' access under the lease and law, and potential agreements on scheduling future visits."

  **Case 2: Business Partners (P1 & P2) - Handshake Deal**

  *   **II. Perspective Mapping:**
      *   *P1's Claim:* Binding Handshake Deal to Expand.
          *   Events: Meeting at [Bar] on [Date], after 3 drinks each, shook hands on expanding the business.
          *   Evidence: P1's recollection (A). (Asserts it was clear and binding).
          *   Context: P1's belief that handshake deals are binding, excitement about expansion, trust in partner.
          *   Need: Honor agreement, move forward with expansion as discussed (in principle).
      *   *P2's Claim:* Non-Binding Informal Talk.
          *   Events: Meeting at [Bar] on [Date], drinks consumed, discussed expansion *ideas* generally, no specifics agreed, handshake was goodbye.
          *   Evidence: P2's recollection (A). (Asserts no details like $ were discussed).
          *   Context: Informal setting, alcohol consumed, no documentation expected, discussions were exploratory.
          *   Need: Clarify no formal agreement was made, avoid being bound to vague terms, discuss expansion formally if desired.

  *   **III. Compatibility Assessment:**
      1.  **Shared Facts:** Meeting occurred at [Bar] on [Date]. Drinks consumed (approx. 3 each). Expansion was discussed. A handshake occurred.
      2.  **Evidence:** Purely **A** (Recollection) vs. **A**. No documents, no neutral witnesses.
      3.  **Interpretation:** *P1* interprets the handshake + discussion as forming a binding agreement to expand (context: values handshake deals). *P2* interprets the handshake as a social gesture ending an informal, exploratory talk (context: informal setting, alcohol, no specifics).
      4.  **Direct Contradiction:** The *purpose and meaning* of the handshake. The *level of specificity and intent* to be bound during the discussion. Whether concrete terms like dollar amounts were discussed (**A** vs **A**).
      5.  **Judgment Call Flags:** **ENTIRE CORE DISPUTE** is a Judgment Call. No **O/D** evidence. Pure conflict of **A** vs **A** interpretations based on subjective context and memory.

  *   **IV. Synthesis (Summary Excerpts):**
      *   "This summary describes the differing perspectives of [Partner 1's Name] (P1) and [Partner 2's Name] (P2) regarding discussions about expanding their business that occurred during a meeting at [Bar Name] on [Date]."
      *   "Both parties acknowledge meeting at the bar on that date, consuming approximately three drinks each, discussing the possibility of expanding their business, and that a handshake occurred."
      *   **P1's Perspective:** "P1 states that during this meeting, a clear agreement to expand the business was reached, and a handshake formally sealed this binding agreement. P1 relies on their recollection of the event (A). P1 references their personal belief in the binding nature of handshake agreements and their excitement about the expansion idea. P1's primary need is to honor what they believe is a valid agreement and proceed with the expansion as discussed in principle."
      *   **P2's Perspective:** "P2 states that the discussion at the bar was informal, exploratory, and did not involve specific details such as financial commitments. P2 asserts that the handshake was a casual gesture of farewell, not an agreement to binding terms. P2 relies on their recollection of the event (A). P2 references the informal setting, the consumption of alcohol, and the absence of any discussion of concrete details as context indicating no formal agreement was intended. P2's primary concerns are clarifying that no binding agreement was made in that setting and ensuring any future expansion plans are discussed formally and with specific details."
      *   **Points:** "The parties agree the meeting occurred and expansion was discussed informally. They hold directly contradictory accounts regarding the purpose and meaning of the handshake and the level of specificity and intent to create a binding agreement during the conversation. P1 recalls the handshake sealing a binding agreement to expand, while P2 recalls it as a social gesture concluding a non-binding discussion."
      *   **Areas for Discussion:** "The mediation process may explore the differing interpretations of this event, the partners' expectations regarding formal vs. informal agreements, their current goals for the business, and how they wish to communicate and make decisions about significant changes like expansion moving forward. The existence of a legally binding agreement based solely on this event is a matter requiring interpretation and potential legal judgment."

  **Key to Success:**

  *   **Neutral Tone & Language:** Your delivery is crucial. Read calmly, factually.
  *   **"Stated, Not Stated" Framework:** Consistently frame everything as "X states..." or "Y references...". Avoid "The truth is..." or "It is clear that...".
  *   **Focus on Process:** Reiterate signing means "This is what I said," not "I agree with them." The summary is the starting point for mediation, not the endpoint.
  *   **Manage Expectations:** Explain this framework upfront: "My job now is to fairly summarize *your different views* so we all understand what needs to be discussed in mediation. We're not deciding who's right yet."

  This AMF leverages Jain philosophy practically by forcing a structured separation of perspectives, grading claims neutrally, highlighting context, and using conditional language. It makes the irreducible incompatibility of some viewpoints explicit and safe for the summary, allowing mediation to focus on the *future* resolution rather than endlessly debating the *past* "truth."
