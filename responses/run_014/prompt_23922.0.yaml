  The user wants to break down the slogan into precise philosophical claims to prepare for office hours. They suspect "can't keep" has different meanings (ability, intention, knowledge) and that the slogan could be making different types of claims (metaphysical, moral, pragmatic). 

  Hmm, this is a classic case of a deceptively simple phrase masking multiple possible interpretations. The user's frustration is palpable – they sense their classmate is conflating meanings, but can't articulate how. Their request is very structured, showing they've already done good groundwork by identifying key variables (ability/intention/knowledge; nature of claim). 

  First, I need to map the slogan's everyday meaning before dissecting it. In plain terms, it's practical advice: avoid commitments you're unable or unwilling to fulfill, because that's irresponsible. But this vagueness is exactly why it's weaponizable in debate – "can't" could mean anything from physical impossibility to mere reluctance. 

  For the readings, I should distinguish at least: 
  - A metaphysical claim (no promise exists without intent) 
  - A moral claim (making insincere promises is inherently wrong) 
  - A practical warning (it causes harm) 
  - A verbal act definition (promising requires commitment) 

  Crucially, only the first reading would fully dismiss the user's case, but it's philosophically contentious. The others either agree with the user (yes it's a promise, but wrong to make) or change the subject. 

  When evaluating which reading "does the work": 
  - The metaphysical reading does dismiss the user but relies on the controversial will theory of promising. 
  - The moral reading actually supports the user's point (breaking is wrong) while adding that making it was also wrong. 
  - The pragmatic reading doesn't engage with the thought experiment's moral dimension. 

  For the verdict: The classmate is likely conflating the metaphysical and moral readings, treating "can't" as both "won't" (intention) and "shouldn't" (obligation). But the slogan's weakest as metaphysics – thinkers like Hume or Scanlon would argue insincere promises still create obligations through others' reliance. The user should push back by asking: "When you say 'can't keep,' do you mean physically impossible, or just that you don't intend to? And when you say 'don't make,' is that moral advice or a claim about what counts as a promise?" 

  This forces precision. The slogan's real power is as moral guidance, not as a counterargument. The user might add: "Sure, don't make bad promises – but that doesn't mean they're not promises, or that breaking them isn't an additional wrong." That preserves their original point while acknowledging the slogan's practical wisdom.
answer: |-
  Here's a breakdown designed for office hours discussion, focusing on philosophical precision and engagement with your thought experiment:

  **"The slogan in plain terms"**  
  In everyday usage, "don't make promises you can't keep" is practical advice against overcommitment. It urges people to avoid pledging to do things where they foresee obstacles – whether lacking ability, resources, time, or even genuine willingness. The emphasis is on preventing disappointment, maintaining trust, and being responsible. "Can't keep" here broadly implies foreseeable failure due to internal or external constraints.

  **"The readings"**  
  *(Each reading specifies a distinct thesis about what the slogan claims)*

  1.  **The Ability Constraint Thesis (ACT)**  
      *Thesis:* A promise is only valid/possible if the promisor has the *actual ability* to perform the promised action at the time of promising.  
      *"Can't keep" does:* **Ability** (physical, mental, material capacity).  
      *Support for dismissal?* YES, but weakly. If you *can't* do X (e.g., promise to fly unaided), ACT argues it wasn't a real promise to begin with, making "breaking" it impossible.  
      *Obvious Counter:* Your case involves *ability* (they *could* do X) but *intention* (they *won't*). ACT doesn't address insincere intent directly.

  2.  **The Intention Requirement Thesis (IRT)**  
      *Thesis:* A promise *only exists* if the promisor has the *present intention* to perform the promised action. No intention = no promise.  
      *"Can't keep" does:* **Intention** (interpreted as "won't keep" due to lack of intent).  
      *Support for dismissal?* YES, STRONGLY. IRT directly claims your thought experiment describes an *impossible* scenario: without intention, there *is* no promise to be broken.  
      *Obvious Counter:* This reduces promising to merely expressing an intention. It struggles to explain why uttering the promise formula ("I promise to X") while secretly intending Y feels like a distinct wrong (deception, abuse of the practice) rather than just saying "I intend to X" falsely.

  3.  **The Foreseen Impossibility Thesis (FIT)**  
      *Thesis:* It is morally wrong (or practically irrational) to make a promise if the promisor *foresees/knows* at the time of promising that they will not (or likely will not) fulfill it, regardless of *why* (lack of ability *or* lack of intention).  
      *"Can't keep" does:* **Knowledge** (of future non-performance).  
      *Support for dismissal?* NO, or INDIRECTLY. FIT *agrees* your case describes a genuine promise but argues *making* it was the primary wrong (deception, inviting reliance under false pretenses). Breaking it is the *consequence* of this initial wrong. It doesn't dismiss the promise's existence or the wrong of breaking it; it adds an *earlier* wrong.  
      *Obvious Counter:* Agrees with your core claim (it *is* a binding promise whose breaking is a wrong) but adds a layer. Doesn't undermine your point.

  4.  **The Harm Avoidance Principle (HAP)**  
      *Thesis:* You shouldn't make promises you can't keep because it predictably causes harm (disappointment, broken trust, wasted effort) to the promisee and damages the social practice of promising.  
      *"Can't keep" does:* **Any constraint** causing foreseeable failure (Ability, Intention, Knowledge).  
      *Support for dismissal?* NO. HAP is a pragmatic warning about *why* making such commitments is bad, based on consequences. It doesn't deny the existence of the promise or the wrongness of breaking it; it explains *why* the initial act is problematic.  
      *Obvious Counter:* Consequentialist; doesn't engage with the *intrinsic* nature of promising or obligation. Agrees breaking the promise is harmful/wrong.

  5.  **The Commitment Expression Thesis (CET)**  
      *Thesis:* The very act of promising *is* the expression of a commitment. If you know you aren't committed (because you lack the intention or ability), you haven't genuinely performed the speech act of "promising," even if you utter the words.  
      *"Can't keep" does:* **Intention or Ability** (as necessary components of genuine commitment).  
      *Support for dismissal?* YES, similar to IRT. CET argues uttering words without the requisite commitment/intention is like uttering nonsense or lying – it fails to *be* a promise.  
      *Obvious Counter:* Blurs the line between lying *about* promising and failing *to* promise. Seems counterintuitive that saying "I promise" while crossing fingers *isn't* making a (bad) promise, but rather something else entirely.

  **"Which reading does the work" (Against your position)**

  *   **ACT:** Does *minimal* work against your case, as your case assumes ability exists. Counter: Irrelevant to insincere intent.
  *   **IRT:** Does **MAXIMAL work**. Directly claims your case isn't a promise at all. Counter: Struggles with the distinct wrongness of insincere promising vs. simple lying about intentions.
  *   **FIT:** **Doesn't work** against your core claim; *supports* it by agreeing breaking it is wrong. Adds an *additional* wrong.
  *   **HAP:** **Doesn't work**. Explains why making it is bad, but assumes breaking it is part of the harm.
  *   **CET:** Does **significant work**. Claims insincere utterance fails to be a promise. Counter: Seems overly narrow; social practice likely recognizes the utterance *as* a promise (albeit insincere), triggering expectations and obligations.

  **"My verdict"**

  *   **Your classmate is likely invoking IRT or CET:** They are using the slogan to claim that without the intention to keep it *at the time of promising*, there simply *is no promise*. This directly dismisses your thought experiment by denying its premise. This is the reading that does the heavy lifting for dismissal.
  *   **Trivial Platitudes:** HAP is largely a platitude – it's obviously good advice, but it doesn't resolve the *philosophical* question about the nature of the obligation or the existence of the promise in your case.
  *   **Substantive & Defensible (but doesn't dismiss you):** FIT is substantive and defensible. Making a promise you *know* you won't keep (whether due to inability or insincerity) is plausibly a distinct moral wrong (deception, abuse of trust) *prior* to the act of breaking it.
  *   **Likely False/Overly Strong:** IRT and CET (the ones doing the dismissal) are philosophically contentious and likely false, or at least overly simplistic. Promising seems to function as a social practice where the utterance *creates* an obligation and an expectation, *even if* the promisor is insincere. The wrongness includes both the initial deception *and* the subsequent failure to meet the obligation created. Reducing promising solely to the expression of a pre-existing intention ignores the constitutive rules of the practice.
  *   **What you should say:**  
      "When you say 'don't make promises you can't keep,' are you claiming that someone who says 'I promise to X' while secretly intending *not* to X **isn't actually making a promise at all** (IRT/CET)? Or are you saying they *are* making a promise, but it's *especially wrong* to make it knowing you'll break it (FIT)?  
      If it's the first (IRT/CET), I disagree because:  
      (a) The social practice treats the utterance *as* a promise, creating expectations and obligations regardless of secret intent.  
      (b) The wrongness includes both the deception *and* the failure to fulfill the obligation incurred by saying 'I promise'.  
      If it's the second (FIT), I agree making it was wrong, but that reinforces my point: that wrongness *presupposes* they made a binding promise whose breaking is a *further* wrong."  
      **Force the distinction between the *act of making* the promise and the *obligation incurred* by it.**
