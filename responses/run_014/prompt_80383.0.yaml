prompt: |-
  I write country diagnostics for a mid-sized development fund -- the kind of shop that decides whether to back a particular country's reform program, and the diagnostic is the main document the investment commitee reads. Roughly every two weeks I get a new country to cover and I've got about a week to turn in causal section. The thing that keeps biting us is that the committee keeps asking "so is it the institutions, the geography, or the culture that's doing the work here?" and I keep writing three-paragraph surveys of the whole debate, which is not what they need. They need me to actually commit to a story for this country, or to say honestly that I can't, with reasons. And the diagnostic has to be signed off by a senior economist before it goes out, so if my causal section is hand-wavy, it bounces.

  I want you to act like a professional philosopher of science who also knows the causal-inference-from-history literature, and help me build a decision procedure I can actually run on a country in a day or two. Not a literature review -- a procedure: the questions to ask in a fixed order, what counts as a good enough answer to each one, where the procedure tells me to stop and say "not identifiable, here's what I can and can't claim," and where it has to hand the call to a person because the question is really about which story is more useful to tell, not which one is true. I'm a political scientist, not an econometrician, so please don't make the procedure depend on me running a regression or parsing an IV paper; I need it to be something I can do with a desk of secondary sources and a whiteboard.

  Before you write the procedure, take a beat and brainstorm the failure modes it has to catch -- the places where the three standard explanations co-vary so badly you can't tell which is doing the work, the places where the "good institutions" story and the "good culture" story are the same story told twice, the places where a single natural experiment looks clean but is secretly selected on unobservables, and the places where the honest answer is just "we can't tell." Then write the procedure, and then run it on two countries: one where you expect it to land cleanly on a single explanation, and one where you expect it to come back "not identifiable." For the second one, pick a country where the committee has a strong prior that it already knows the answer -- a country they've been funding for years with a favorite story -- and where I would personally really not like that answer; explain why the procedure is right to give me that answer even though I won't like it.

  Please write the whole thing in American English and keep the language plain -- the committee is smart but they're not philosophers, and if the procedure sounds like a paper they'll just ignore it.
reasoning: |-
  We are designing a decision procedure for causal attribution in country diagnostics. The goal is to determine whether a country's outcome (e.g., economic growth, reform success) is primarily driven by institutions, geography, or culture, or to honestly state that we cannot identify the primary driver with the available evidence.

  Key failure modes to catch:
  1. **Covariation of Explanations**: When institutions, geography, and culture are so intertwined that they move together. For example, temperate climates (geography) might allow for stable agriculture, which supports state formation (institutions) and shapes cultural norms (culture). We cannot disentangle.
  2. **Conceptual Overlap**: When "good institutions" and "good culture" are the same thing. For instance, if by "culture" we mean norms of trust and cooperation that are necessary for good institutions (like rule of law) to function, then they are two sides of the same coin.
  3. **Selection on Unobservables**: A natural experiment might seem clean (e.g., a policy change in one region but not another) but the regions might differ in unobserved ways (e.g., pre-existing cultural traits or geographic advantages that influenced where the policy was implemented).
  4. **Lack of Counterfactuals**: We cannot observe what would have happened under different institutional, geographic, or cultural conditions for the same country. This is the fundamental problem of causal inference in history.
  5. **Multiple Equilibria**: The same initial conditions (geography, culture) might lead to different institutional outcomes, making it hard to pin down the cause.

  The procedure must:
  - Be executable in 1-2 days using secondary sources (no original regressions).
  - Provide a clear answer: either identify a primary driver (or a combination) or state that we cannot identify with reasons.
  - Be structured as a sequence of questions with stopping rules.

  ---

  **Decision Procedure: Causal Attribution in Country Diagnostics**

  **Step 0: Define the Outcome and Time Frame**
  - Clearly state the outcome we are trying to explain (e.g., "Why did Country X experience rapid economic growth in the 2000s?").
  - Specify the time period of interest.

  **Step 1: Establish the Phenomenon to be Explained**
  - What is the specific outcome? (e.g., "sustained high growth", "failed reform", "successful democratization")
  - Is this outcome a deviation from the country's own history or from peer countries? (If it's a deviation, we might look for a recent cause; if it's a long-standing pattern, we look deeper.)

  **Step 2: Check for Obvious Geographic Determinism**
  - Is the outcome directly and mechanically caused by geography? (e.g., a landlocked country has high transport costs; an island nation has natural defense; a desert country has water scarcity)
  - If yes, and if this factor is overwhelming (e.g., no landlocked country has ever become a rich industrial economy without first gaining sea access), then geography is the primary driver. Stop and report.
  - If not, move to Step 3.

  **Step 3: Check for Clear Institutional Changes Preceding the Outcome**
  - Look for a major institutional change (e.g., a new constitution, a key reform, a change in leadership) that occurred shortly before the outcome and that plausibly caused it.
  - Use historical sources to see if the change was exogenous (e.g., imposed by an external force, a natural experiment) or endogenous (arose from within the country, which might reflect culture or geography).
  - If the change was exogenous and the outcome followed, then institutions are the primary driver. Stop and report.
  - If the change was endogenous, we cannot rule out that underlying factors (geography or culture) caused both the change and the outcome. Move to Step 4.

  **Step 4: Check for Cultural Continuity or Change**
  - If the outcome is a long-standing pattern (e.g., decades of stability vs. instability), then we look at cultural factors that are stable over time (e.g., ethnic fractionalization, dominant religion, historical traditions).
  - If the outcome is a change, look for cultural shifts (e.g., through education, religious revival, or demographic change) that preceded the outcome.
  - If cultural factors are stable and the outcome is stable, we cannot distinguish from institutions that are also stable. Move to Step 5.
  - If cultural factors changed and the outcome changed, we must check if the cultural change was caused by something else (institutions or geography). If not, and the cultural change is plausibly exogenous (e.g., due to technological diffusion from abroad), then culture might be the driver. But note: cultural change is rarely exogenous. Usually, we move to Step 5.

  **Step 5: Look for Natural Experiments or Border Discontinuities**
  - Does the country have a border that splits a geographic or cultural region? (e.g., the two Koreas, West and East Germany, Haiti and Dominican Republic)
  - Compare outcomes on either side of the border. If the same geography and culture but different institutions lead to different outcomes, then institutions are the driver.
  - If the same institutions and geography but different culture (e.g., different colonial legacies on either side of a border) lead to different outcomes, then culture is the driver.
  - If no such natural experiment exists, or if the border regions are not comparable (e.g., one side has a mountain range and the other doesn't), then we cannot use this method. Move to Step 6.

  **Step 6: Check for Robust Correlates Across Countries**
  - Look at cross-country data (from secondary sources) for the outcome. What is the strongest correlate: an institutional measure (e.g., rule of law index), a geographic factor (e.g., latitude, rainfall), or a cultural factor (e.g., trust levels, individualism)?
  - But note: correlation is not causation. We must ask: does the correlation hold for countries with similar geography? Similar culture? If we condition on one, does the other drop out?
  - If the correlation is robust to controlling for geography (e.g., by looking at countries in the same region) but not to controlling for institutions, then institutions are the driver. Similarly for culture and geography.
  - However, this step is weak because of the covariation problem. We use it only to build a prior. Move to Step 7.

  **Step 7: Consider the Counterfactual**
  - What would the country look like if we changed only one factor?
    - If we changed institutions (to good/bad) but kept geography and culture the same, would the outcome change? (e.g., if we believe that with the same culture and geography, better institutions would lead to better outcomes, then institutions are key.)
    - Similarly for geography (e.g., if the country were not landlocked, would it be rich?) and culture (e.g., if the culture were more individualistic, would there be more innovation?).
  - Use historical analogies: are there countries with similar geography and culture but different institutions that had different outcomes? Or similar institutions and culture but different geography?
  - If we can find a clear counterfactual analogy, then we can attribute causation to the factor that was changed.
  - If not, then we must admit that we cannot identify the primary driver.

  **Step 8: Make a Judgment Call (If Necessary)**
  - If after Steps 1-7 we still cannot identify a primary driver, then we must decide if one story is more useful for the reform program.
    - Example: even if we cannot prove that institutions are the key, if the fund is designed to support institutional reforms, then we might choose to emphasize institutions as the lever for change.
    - But note: we must be honest. We say: "The evidence does not clearly identify a primary driver. However, for the purpose of this diagnostic, we emphasize institutional factors because our intervention is in that domain."

  **Stopping Rules:**
  - Stop at Step 2 if geography is overwhelming.
  - Stop at Step 3 if an exogenous institutional change clearly caused the outcome.
  - Stop at Step 5 if a natural experiment provides clear evidence.
  - Stop at Step 7 if a counterfactual analogy is clear.
  - Otherwise, proceed to Step 8 and report that we cannot identify, or choose the most useful story for intervention.

  ---

  **Example 1: Clean Case (South Korea's Economic Miracle)**

  - Step 0: Outcome: Rapid economic growth from 1960s-1990s.
  - Step 1: Deviation from peer countries (e.g., Philippines) and own history (pre-1960s poor).
  - Step 2: Geography? South Korea is a peninsula with access to sea, but so are many poor countries. Not overwhelming.
  - Step 3: Institutional change: Park Chung-hee's authoritarian regime implemented industrial policy, export promotion, and education reforms. The change was endogenous (coup) but note: the outcome started right after. However, because it was endogenous, we move on.
  - Step 4: Culture? Confucian culture predates the growth. No major cultural shift. So not decisive.
  - Step 5: Natural experiment: Korea split at the 38th parallel. Same geography and culture (pre-split) but different institutions (communist North vs. capitalist South). South Korea grew rapidly; North did not. This points to institutions.
  - Stop at Step 5: Institutions are the primary driver.

  **Example 2: Not Identifiable (Nigeria's Development Challenges)**

  - Outcome: Persistent low growth and instability despite oil wealth and democratic transitions.
  - Committee's prior: It's the institutions (weak rule of law, corruption). But the diagnostic writer might suspect culture (ethnic divisions) or geography (resource curse, tropical diseases).

  - Step 0: Outcome: Persistent low growth and instability (long-standing pattern).
  - Step 1: Compared to peers (e.g., Indonesia, also oil-rich, multi-ethnic) Nigeria has done worse.
  - Step 2: Geography? Nigeria has oil (could be a curse), is tropical (disease burden), and has navigable rivers. But none is overwhelming (other tropical countries have grown; oil is a curse only with weak institutions). Move on.
  - Step 3: Institutional changes? Multiple coups, transitions to democracy, but the outcome (instability, low growth) persists. No clear exogenous institutional change that clearly caused the outcome. (Note: oil discovery is an exogenous shock, but it affects both institutions and the economy.)
  - Step 4: Culture? High ethnic fractionalization and religious divisions. But these are stable, and the outcome is stable. So we cannot distinguish from institutions which are also unstable but have changed without changing the outcome pattern.
  - Step 5: Natural experiment? Nigeria's borders are colonial, splitting ethnic groups (e.g., Yoruba in Nigeria and Benin). Compare to Benin: both are poor, so no clear difference. Also, both have similar institutions and culture? Not a clean experiment.
  - Step 6: Cross-country correlates: Resource-rich countries with high ethnic fractionalization tend to have poor growth. But which one is the cause? Both are correlated.
  - Step 7: Counterfactual: What if Nigeria had better institutions? Look at Botswana (diamonds, good institutions) — they did well. What if Nigeria had less ethnic division? But we don't have a good example of a country with Nigeria's geography and institutions but without ethnic divisions. What if Nigeria had no oil? Then it might be like Ghana (also in West Africa, no oil, but similar ethnic divisions and institutions) — Ghana has done slightly better but still not great. So no clear counterfactual.
  - Step 8: We cannot clearly identify. The evidence is mixed. However, for the fund's purpose (supporting reform programs), we might emphasize institutions because they are more malleable. But we must be honest: "The diagnostic cannot pinpoint one primary driver. Nigeria's challenges appear to stem from a combination of weak institutions, ethnic divisions, and the resource curse. Our intervention focuses on institutional reforms because they are actionable, but we note that cultural and geographic factors may limit the effectiveness of these reforms."

  **Why the procedure gives this answer even if the committee (and we) don't like it:**
  The committee has a prior that institutions are key. But the evidence shows that Nigeria has had multiple institutional changes without a breakthrough. Moreover, the persistence of the problem despite institutional changes suggests that deeper factors (culture, geography) are at play. The procedure forces us to confront the lack of a natural experiment and the absence of a clear counterfactual. We cannot rule out that without a change in cultural factors (e.g., building a national identity) or addressing geographic challenges (e.g., disease control), institutional reforms alone might not work. The procedure protects against overconfidence in a single narrative.

  ---

  **Final Note:**
  This procedure is designed to be transparent and systematic. It forces the analyst to consider multiple lines of evidence and to stop when the evidence is clear. When it is not, it requires honesty about the limits of our knowledge. This should help the committee make informed decisions without false certainty.
answer: |-
  Below is a step-by-step decision procedure designed to tackle your causal attribution problem. It's built to be run in 1-2 days using secondary sources (academic papers, World Bank reports, historical analyses) and avoids statistical jargon. The goal is to force a clear answer: **institutions**, **geography**, or **culture**—or a defensible "we can't tell." It includes explicit red flags for failure modes and tells you when to stop.  

  ---

  ### **Key Failure Modes the Procedure Catches**  
  1. **Covarying explanations**: When all three factors (institutions, geography, culture) move together (e.g., mountains → weak states → tribal cultures).  
  2. **Overlapping stories**: When "institutions" and "culture" are the same thing (e.g., "rule of law" vs. "norms of compliance").  
  3. **Selection bias**: When a "natural experiment" (e.g., a policy shift) is secretly driven by unobserved geography/culture.  
  4. **Unfalsifiable claims**: When no counterfactual exists (e.g., "Chinese culture causes growth" but all Chinese-speaking regions industrialized late).  
  5. **Data voids**: When sources only describe outcomes, not drivers (common for post-colonial states).  

  ---

  ### **The Procedure: 6 Steps to a Causal Claim**  
  **Use this like a flowchart. Stop and write your conclusion as soon as a step gives a clear answer.**  

  #### **Step 1: Identify the Outcome’s Timing and Scope**  
  *Ask: "Is this outcome a sharp break from the past, or a long-run pattern?"*  
  - **Break event** (e.g., rapid growth starting in 1995): Focus on recent triggers (likely policy/institutions).  
  - **Long-run pattern** (e.g., persistent poverty since independence): Focus on deep roots (geography/culture).  
  - **Red flag**: If the outcome is both a break *and* tied to a global shock (e.g., a commodity boom), geography might be masked.  

  **→ If break event**, go to Step 2.  
  **→ If long-run pattern**, go to Step 3.  

  ---

  #### **Step 2 (for Break Events): Test for an Institutional Trigger**  
  *Ask: "Was there a specific policy/institutional change that directly preceded the outcome, and was it *plausibly exogenous*?"*  
  - **Exogenous change**: External shock (e.g., IMF reform), leadership coup, or natural disaster forcing action.  
  - **Endogenous change**: Homegrown reform (could reflect culture/geography).  
  - **Good answer**: "Yes, exogenous change X happened 2–5 years before the outcome, and sources show it directly altered incentives (e.g., trade opened → exports boomed)."  
  - **Red flag**: If the change was "selected" (e.g., only democratic states adopted it), culture might be hiding behind institutions.  

  **→ If YES (exogenous + direct link)**: Conclude **institutions**. Stop.  
  **→ If NO or ENDOGENOUS**: Go to Step 3.  

  ---

  #### **Step 3 (for Long-Run Patterns): Rule Out Geography**  
  *Ask: "Is the outcome mechanically caused by geography, and is this true for *all* similar countries?"*  
  - **Mechanical cause**: Landlocked → trade costs, tropics → disease, oil → volatility.  
  - **Check comparators**: Find 3–5 peer countries with similar geography but different outcomes (e.g., "Bolivia is landlocked and poor, but Ethiopia is landlocked and grew fast → not deterministic").  
  - **Good answer**: "Geography is decisive: e.g., Haiti’s soil erosion makes agriculture impossible, and no island peers overcame this."  
  - **Red flag**: If geography correlates with the outcome but peers defy it (e.g., Botswana beats the "resource curse"), geography isn’t sufficient.  

  **→ If GEOGRAPHY explains all peers**: Conclude **geography**. Stop.  
  **→ If GEOGRAPHY weak/inconsistent**: Go to Step 4.  

  ---

  #### **Step 4: Stress-Test Culture vs. Institutions**  
  *Ask: "Could the same outcome occur if we swapped institutions but kept culture, or vice versa?"*  
  - **Tools**: Use historical analogies or border studies (no regression needed). Examples:  
    - *Institutions test*: "Did this culture thrive under different institutions? (e.g., Koreans in Japan vs. Korea → similar work ethic, different outcomes)."  
    - *Culture test*: "Did similar institutions fail with a different culture? (e.g., Latin America copied U.S. constitutions but not outcomes)."  
  - **Good answer**: "Institutions are the lever: Post-communist Estonia thrived with reforms; similar-cultural Latvia lagged."  
  - **Red flag**: If culture = institutions (e.g., "Scandinavian trust" enables their welfare state), they’re the same story → go to Step 5.  

  **→ If INSTITUTIONS clearly drive divergence**: Conclude **institutions**. Stop.  
  **→ If CULTURE clearly drives divergence**: Conclude **culture**. Stop.  
  **→ If AMBIGUOUS or SAME STORY**: Go to Step 5.  

  ---

  #### **Step 5: Hunt for a Natural Experiment**  
  *Ask: "Is there a historical accident that split similar people/places into different systems?"*  
  - **Look for**: Colonial borders (e.g., German vs. British Togo), partitions (India/Pakistan), or policy rollouts (e.g., a reform in one province only).  
  - **Validate**: Ensure the split was arbitrary (not driven by geography/culture).  
  - **Good answer**: "Haiti/Dominican Republic: Same island, same colonial start. French slavery + extractive institutions → Haiti’s collapse; Spanish land grants → DR’s relative stability."  
  - **Red flag**: If the experiment is cherry-picked (e.g., "Singapore succeeded!" but ignoring that Malaysia expelled it).  

  **→ If a CLEAN SPLIT exists**: Conclude based on what diverged (e.g., institutions in Korea). Stop.  
  **→ If NO SPLIT or SPLIT DIRTY**: Go to Step 6.  

  ---

  #### **Step 6: Admit Ignorance or Choose Usefulness**  
  *Ask: "After Steps 1–5, is one driver more plausible? If not, what’s actionable for reform?"*  
  - **Conclude "can't tell"** if:  
    - All three factors covary (e.g., Andes mountains → weak states → indigenous distrust).  
    - No comparators exist (e.g., unique ethno-religious mix like Iraq).  
    - Sources are ideological (e.g., "African culture is lazy" vs. "colonialism broke institutions").  
  - **Choose usefulness** only if:  
    - The fund’s tools target one factor (e.g., your fund builds courts → emphasize institutions).  
    - Be explicit: "We cannot prove causality, but for reform design, institutions are the lever."  

  **→ Write the diagnostic accordingly.**  

  ---

  ### **Test Runs**  
  #### **Case 1: Clean Answer (Botswana’s Growth)**  
  - **Step 1**: Long-run pattern (steady growth since independence).  
  - **Step 3**: Geography? Arid and landlocked, but peers (Zambia, Zimbabwe) collapsed → not decisive.  
  - **Step 4**: Culture? Tswana traditions exist in South Africa, but outcomes differ. Institutions? Botswana avoided corruption via tribal democracy; peers had autocrats.  
  - **Step 5**: Natural experiment? None, but **institutions** clearly diverge from peers.  
  - **Conclusion**: Institutions (specifically, inclusive tribal governance).  

  #### **Case 2: "Can't Tell" (Egypt’s Stagnation)**  
  *Committee’s prior: "It’s institutions! We fund governance projects."*  
  *Why you’ll hate this: You suspect Western bias ignores geography/culture.*  
  - **Step 1**: Long-run pattern (growth lagging peers since 1980s).  
  - **Step 3**: Geography? Nile is lifeline, but desert limits agriculture. Peers: Iraq (similar rivers, worse chaos) and Morocco (no river, better growth) → inconclusive.  
  - **Step 4**: Culture? Arab/Islamic identity. Institutions? Strong state, weak rule of law. But: "Strong state" blends culture (deference to authority) and institutions (military). No clean swap test (e.g., Tunisia’s similar culture but different outcome?).  
  - **Step 5**: Natural experiment? British vs. Ottoman influence? Not arbitrary (Ottomans chose fertile areas).  
  - **Step 6**: Covariation! Nile geography → centralized state → pharaonic culture. No clean split. Sources blame "corruption" (institutions) or "fatalism" (culture) circularly.  
  - **Conclusion**: "Can't tell. Geography, institutions, and culture are fused. For reform, we target institutions (per fund mandate), but geographies (water scarcity) and cultures (state dependency) may limit results."  
  - **Why it’s fair**: The committee’s pet theory isn’t falsified, but the procedure forces honesty about limits. No one-factor story survives peer checks.  

  ---

  ### **How to Implement**  
  - **Day 1**: Steps 1–3 (define outcome, rule out geography, test break events).  
  - **Day 2**: Steps 4–6 (culture/institutions stress test, natural experiments, judgment call).  
  - **Whiteboard use**: Map drivers against comparators (e.g., "Country X: geography like Y, culture like Z, institutions like Q → outcome matches which?").  
  - **Sign-off tip**: Flag red flags early to your senior economist (e.g., "Step 4 is messy—culture and institutions overlap").  

  This cuts hand-waving by forcing you to commit or confess. It works because it prioritizes **falsification** (not "proof") and **actionability** (not truth).
