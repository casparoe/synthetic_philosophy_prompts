prompt: |-
  I am three-quarters of the way through a novel whose narrator is a historian seconded to a national commemorations board, where he rules on the inherited myths of defeat. He never states his criterion, and this is deliberate: he believes a principle announced in advance is a species of cheating. The chapters already drafted give his rulings. Masada, inadmissible. The Vidovdan cult around Kosovo, inadmissible. The Alamo, inadmissible. Dunkirk, admissible — although he spends forty pages on the French rearguard left on the beaches and does not permit it to move his verdict. The Foreign Legion's annual commemoration of Camerone in Mexico, admissible, invasion notwithstanding. Verdun, admissible.

  In the chapter I have not yet written he must rule on Gallipoli as Australians keep it: a defeat commemorated as a nation's birth; an evacuation carried off with almost no loss and given almost no mention; the opposing commander folded into the mourning by a consolation attributed to Kemal and carved at the cove and in two southern capitals, whose attribution my researcher cannot pin down; Indigenous men who served in the first contingents and were for decades afterwards kept out of the associations of returned soldiers; and a day that has come to carry the weight of every subsequent war the country has joined.

  Tell me how he rules, and on what principle you take him to be proceeding. Then give me at least one further principle that fits every ruling I have listed and reaches a different verdict on Gallipoli, so that I can see what I have accidentally committed him to. Finally, tell me which myth I should bring before him next if I want an attentive reader to be able to discriminate between those principles.
reasoning: |-
  Okay, the user is writing a novel about a historian on a commemorations board who judges myths of defeat without revealing his criteria. They've given examples of his rulings: rejecting Masada, Kosovo, the Alamo; accepting Dunkirk, Camerone, Verdun. Now they're stuck on the Gallipoli chapter and need help determining how their character would rule on it. 

  Hmm, this is fascinating—the historian clearly has a pattern. Let me connect the dots. All rejected myths share a core of futile sacrifice (Masada's mass suicide, Kosovo's martyrdom complex) or deliberate distortion (Alamo's slavery erasure). The accepted ones? Dunkirk transformed disaster into collective resilience; Camerone celebrated loyalty despite being invaders; Verdun became mutual Franco-German reconciliation. So the hidden principle seems to be: Does the myth transcend its defeat to forge *forward-looking* unity? Not just glorifying loss.

  Gallipoli as Australians frame it... tricky. Birth-of-nation narrative? Classic transcendence—but wait. The user mentions suppressed Indigenous contributions and that contested Kemal quote. That undermines inclusive unity. Plus "carrying weight of all later wars" suggests stagnation, not growth. So he'd likely reject it: the myth calcifies rather than evolves. 

  Now for an alternate principle... What if he valued myths that *confront* uncomfortable truths? Masada/Kosovo/Alamo all avoid hard realities (Roman pragmatism, Ottoman tolerance, Texan slavery). Dunkirk/Camerone/Verdun acknowledge darkness (abandoned French, colonial violence, mutual slaughter). Gallipoli? It buries Indigenous erasure and romanticizes evacuation. Under *this* lens? Admissible—because exposing the Kemal quote's fragility *is* confronting truth. 

  Next test case... Ah, the Charge of the Light Brigade! Perfect. It's pure futile sacrifice (rejected under Principle 1) but also brutally honest about leadership failure (admissible under Principle 2). The user can use this to force readers to spot the difference. 

  ...Did I just spend 20 minutes mentally arguing with a fictional historian? Worth it.
answer: |-
  Here’s how your historian would rule on Gallipoli, the hidden principle unifying his prior rulings, an alternative principle yielding a *different* Gallipoli verdict, and a discriminating test case:

  **His Ruling on Gallipoli: Inadmissible**  
  He rejects the Australian myth. While acknowledging its potency ("birth of a nation"), he dissects its exclusions: the suppressed role of Indigenous soldiers, the sanitized evacuation narrative overshadowing the preceding slaughter, the uncritical adoption of the contested Kemal quote used to ennoble the defeat, and the myth's burden as a blank cheque for future wars. He argues Gallipoli functions as **redemptive sentimentalism masking unresolved fractures and encouraging martial nostalgia**, not genuine national cohesion born of confronting the past. It mirrors Masada (romanticized suicide), Kosovo (martyrdom fueling future conflict), and the Alamo (erasure of context) in its refusal to integrate uncomfortable truths.

  **His Hidden Principle:**  
  **A defeat is admissible only if its commemoration *transcends victimhood or triumphalism* to forge a *forward-looking, inclusive unity* grounded in *shared vulnerability and mutual recognition*.**  
  *   **Masada/Kosovo/Alamo:** Cultivate eternal victimhood, martyrdom, or righteous defiance—*inadmissible*.  
  *   **Dunkirk:** Focuses on collective resilience, civilian sacrifice, and rescue (shared vulnerability), avoiding blame—*admissible* (despite French exclusion being a flaw noted).  
  *   **Camerone:** Celebrates loyalty and sacrifice *abstracted entirely from the colonial invasion context*, creating pure Legion identity—*admissible* as internal unity (ignoring external impact).  
  *   **Verdun:** Evolved into a shared Franco-German site of mourning, recognizing mutual suffering and the futility of the slaughter—*admissible* as transcendent reconciliation.  
  *   **Gallipoli (Aus):** Fixates on birth-through-sacrifice, obscures internal exclusions (Indigenous soldiers), uses contested foreign solace (Kemal), fuels uncritical militarism—*inadmissible*. It fails to build unity on vulnerability; it builds identity on selective heroism.

  **Alternative Principle (Fits Past Rulings, Different Gallipoli Verdict):**  
  **A defeat is admissible if its commemoration primarily serves a *cohesive group identity* for the participants/their direct descendants, *regardless of historical accuracy or broader ethical context*, provided it doesn't *explicitly incite imminent violence*.**  
  *   **Masada:** Served Jewish/Zionist identity powerfully—*would be admissible* (contradicts his ruling).  
  *   **Kosovo:** Served Serbian nationalist identity—*would be admissible* (contradicts).  
  *   **Alamo:** Served Texan/American identity—*would be admissible* (contradicts).  
  *   **Dunkirk:** Serves British national identity ("Dunkirk spirit")—*admissible* (matches).  
  *   **Camerone:** Serves Legion identity absolutely—*admissible* (matches).  
  *   **Verdun:** Serves *both* French and German veteran identity, later evolving into shared identity—*admissible* (matches).  
  *   **Gallipoli (Aus):** Serves core Australian national identity—***Admissible*** under this principle. The exclusions, contested quotes, and militarism are secondary to its fundamental role in defining "Australianness" for the nation.

  **Discriminating Test Case: The Charge of the Light Brigade (Balaklava, 1854)**  
  *   **Why it Discriminates:**  
      *   **Under His Principle (Transcendence/Unity):** *Likely Inadmissible.* It's the epitome of futile sacrifice, immortalized in myth (Tennyson's poem) as noble obedience and doomed courage. It reinforces blind loyalty to command, ignores catastrophic incompetence, and serves primarily as a symbol of British military stoicism ("Ours not to reason why..."). It doesn't forge broader unity or confront vulnerability; it glorifies fatalism within a martial caste.  
      *   **Under the Alternative Principle (Group Identity):** *Clearly Admissible.* It's a cornerstone of British military lore, especially for cavalry traditions. It fosters intense group identity among soldiers (past and present) and national pride in enduring courage against hopeless odds, irrespective of the cause's folly.  

  Presenting the Light Brigade myth forces the reader (and perhaps your historian) to confront the core question: Is the value of a commemorated defeat found in its ability to bind a group together through shared symbols (Alternative Principle), or in its capacity to move *beyond* tribal loyalty towards a more honest, inclusive, and future-oriented understanding of shared human fallibility and cost (His Principle)? The stark difference in rulings here reveals the fundamental ethical commitment driving his seemingly opaque decisions.
