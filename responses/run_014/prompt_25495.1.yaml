answer: |-
  ### Final Exam Question  
  **Dispositions, Finks, and Masks: A Unified Problem?**  
  *(Answer in 500–600 words)*  

  "The simple conditional analysis (SCA) claims that an object has a disposition (e.g., fragility) iff it would break if struck. Critically evaluate whether *finks* (e.g., Martin’s electro-fragile wire) and *masks* (e.g., a carefully packed fragile vase) expose *fundamentally distinct* metaphysical problems for SCA, or whether they are merely two manifestations of the *same underlying flaw*. In your view, does preserving the distinction between finks and masks matter for advancing a plausible theory of dispositions? Justify your position with original examples."  

  ---

  ### Model Answer (500 words)  
  The simple conditional analysis (SCA) reduces dispositions to subjunctive conditionals: "x is fragile iff x would break if struck." Both finks and masks falsify SCA by presenting scenarios where the conditional fails to align with the disposition’s presence or absence. Yet, while they appear distinct, they reveal a unified problem: SCA’s inability to account for *extrinsic interference* in dispositional manifestation.  

  **Finks** (e.g., Martin’s wire that loses fragility when struck) involve a *change in the disposition itself* during the test. Here, the object has the disposition (fragility) but fails to satisfy the conditional because the disposition vanishes *before* manifestation. For instance, consider soluble salt guarded by a nanobot that dissolves upon contact with water, rendering the salt insoluble before water touches it. The salt is soluble but wouldn’t dissolve if placed in water.  

  **Masks** (e.g., a fragile vase wrapped in bubble wrap) involve *blocked manifestation* without disposition-loss. The object retains the disposition but external factors prevent the conditional’s antecedent from producing the manifestation. Imagine conductive copper coated in an insulator: it remains conductive but wouldn’t conduct electricity if a current were applied.  

  Superficially, finks and masks seem distinct: finks destroy the disposition *during* testing, while masks allow the disposition to endure. However, both exploit SCA’s *contextual naïveté*. SCA assumes a "clean" test environment where only the stimulus (striking, dissolving) is present. Finks and masks violate this by introducing extrinsic factors (nanobots, bubble wrap) that disrupt the causal chain. Both phenomena thus expose SCA’s core flaw: dispositions cannot be reduced to *bare* conditionals because their truth depends on *absence of interferers*, which SCA cannot specify.  

  Yet the distinction *does* matter metaphysically. Finks challenge the *stability* of dispositions, suggesting they can be ephemeral properties. Masks challenge *intrinsicness*, implying dispositions can persist inertly despite extrinsic blockers. Treating them identically obscures these nuances. For example, solving finks may require dispositions to be intrinsic *and* stable (e.g., Lewis’ reformed conditional analysis), while solving masks may require ceteris paribus clauses (e.g., "if nothing masks the disposition"). A unified solution (e.g., Bird’s dispositional essentialism) must address both: dispositions are intrinsic properties whose manifestations are governed by natural laws, where finks/masks represent law-governed exceptions.  

  Ultimately, finks and masks are variations of SCA’s vulnerability to interference, but preserving their distinction advances dispositional metaphysics. It forces theories to explain *how* dispositions persist (finks) and *why* they sometimes fail (masks), moving beyond conditional analyses toward robust causal or modal frameworks.  

  ---

  ### Marking Scheme (Total: 20 marks)**  
  **A (18–20): Outstanding (A+ range: 17–20)**  
  - **Defines SCA, finks, masks accurately** (2 marks).  
  - **Clearly contrasts finks (disposition loss) vs. masks (manifestation blockage)** with *original examples* (4 marks).  
  - **Argues persuasively that they share an "underlying flaw"** (SCA’s blindness to extrinsic interference) while **acknowledging key differences** (stability vs. intrinsicness) (6 marks).  
  - **Evaluates the distinction’s metaphysical significance**: e.g., impacts on dispositional ontology, need for causal/law-based theories (4 marks).  
  - **Originality**: Examples not from lectures/texts; synthesizes ideas (e.g., connects to ceteris paribus laws) (2 marks).  
  - **Structure**: Logical flow; precise terminology (2 marks).  

  **B (14–17: Good)**  
  - Correctly defines SCA/finks/masks but with less nuance (e.g., conflates finks with masks).  
  - Contrasts finks/masks but uses textbook examples (e.g., Martin’s wire).  
  - Identifies shared flaw (interference) but doesn’t explore *why* it’s unified.  
  - Discusses distinction’s importance superficially (e.g., "they’re different so we need different solutions").  
  - Competent structure but less cohesive argument.  

  **C (10–13: Adequate)**  
  - Partial/muddled definitions (e.g., misstates SCA).  
  - Describes finks/masks separately without systematic comparison.  
  - No original examples; relies on lecture material.  
  - Neglects to evaluate the distinction’s metaphysical role.  
  - Weak organization; tangential points.  

  **D/F (0–9: Poor)**  
  - Major errors (e.g., claims masks destroy dispositions).  
  - No engagement with "unified flaw" or distinction’s significance.  
  - Insufficient length; incoherent structure.  

  ---

  **Key A vs. B Differentiators**:  
  1. **A students** create *original examples* demonstrating deep understanding (e.g., nanobots for finks, insulated copper for masks). B students reuse Martin/Lewis.  
  2. **A students** argue that finks/masks *jointly* expose SCA’s *contextual fragility* while *still distinguishing* their implications (stability vs. inert persistence). B students list differences without unifying them.  
  3. **A students** explicitly discuss why preserving the distinction *matters* (e.g., for theories of intrinsicality, causal grounding). B students note it cursorily.  

  This question pushes students to analyze structure over scholarship, rewarding creativity and metaphysical insight—exactly what your chemistry-trained perspective would demand.
