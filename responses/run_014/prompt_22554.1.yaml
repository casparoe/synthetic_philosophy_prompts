    2. Proper vs. Improper Priors:
        - A proper prior is a probability distribution that integrates to 1. It assigns a finite total probability to the entire space.
        - An improper prior does not integrate to a finite value. For example, a uniform prior over the entire real line (or all positive reals) is improper because the integral of a constant over an infinite range is infinite.

        In the two-envelope problem, if we assume a proper prior, then we can compute the conditional probability that the other envelope has 2y or y/2 given we observed y. This conditional probability may not be 1/2 for both, and in fact, it depends on the prior.

