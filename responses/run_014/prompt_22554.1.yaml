    Final note: The standard argument assumes that for every observed y, the other envelope is equally likely to be 2y or y/2. This is only true if the prior on x is such that the events {x=y} and {x=y/2} have the same probability density. This happens if the prior on x is constant (uniform) and the range of x is the entire positive real line (or at least symmetric under doubling and halving). However, that prior is improper and leads to infinite expectations. In any proper prior, the symmetry under doubling and halving is broken, and the conditional probabilities are not always 1/2. Therefore, the standard argument fails because it relies on an improper prior that is not tenable.

    The precise point of symmetry breaking is the observation of y. After that, the prior distribution must be taken into account to compute the conditional probabilities, and they may not be 1/2.
