  The two-envelope paradox arises from an expected-value argument that suggests switching envelopes is always beneficial, regardless of the observed amount. This argument fails not due to the physical indistinguishability of the envelopes, but because it implicitly relies on an improper prior distribution over the total amount of money. The resolution lies in distinguishing between proper and improper priors, understanding the bounded case, and identifying the point of symmetry breaking.

  ### Standard Argument and Its Flaw
  The standard argument assumes that if you observe \(y\) in your envelope, the other envelope contains either \(2y\) or \(y/2\) with equal probability \(1/2\). Thus, the expected value of switching is:
  \[
  \frac{1}{2} \cdot 2y + \frac{1}{2} \cdot \frac{y}{2} = \frac{5}{4}y > y,
  \]
  implying switching is always advantageous. However, this assumes that for any observed \(y\), the values \(y\) (if your envelope is smaller) and \(2y\) (if your envelope is larger) are equally likely. This assumption requires a prior distribution where the probabilities of the total being \(3y\) (if \(y\) is the smaller amount) and \(3y/2\) (if \(y\) is the larger amount) are equal. Such a prior is uniform over the positive reals and **improper**.

  ### Proper vs. Improper Priors
  - **Improper prior**: A prior that is not integrable (e.g., uniform over all positive reals, with density \(f(x) = c > 0\)). This prior assigns infinite probability mass, making expectations undefined or infinite. The standard argument uses this implicitly: it assumes the conditional probability of having the smaller/larger envelope given \(y\) is always \(1/2\), which holds only under a uniform improper prior. However, the expected gain \(E[\text{gain}] = E[Y/4]\) diverges to infinity, invalidating the calculation.
    
  - **Proper prior**: A prior that integrates to 1 (e.g., uniform over \([0, M]\) for some finite \(M\)). Here, expectations are finite, and the conditional probabilities depend on \(y\). The assumption that \(P(\text{smaller} \mid y) = 1/2\) does not hold universally.

  ### The Bounded Case
  Consider a proper uniform prior: the smaller amount \(x \sim \text{Uniform}[0, M]\), so the total is at most \(3M\). The observed amount \(y\) has density:
  - \(f_Y(y) = \frac{9}{4M}\) for \(0 \leq y \leq \frac{M}{3}\) (both smaller and larger possible),
  - \(f_Y(y) = \frac{3}{4M}\) for \(\frac{M}{3} < y \leq \frac{2M}{3}\) (only larger possible, since \(y > M/3\) implies it must be the larger envelope).

  The expected gain from switching is:
  \[
  E[\text{gain} \mid Y = y] = 
  \begin{cases} 
  \frac{y}{4} & \text{if } y \leq \frac{M}{3}, \\
  -\frac{y}{2} & \text{if } y > \frac{M}{3}.
  \end{cases}
  \]
  Averaging over \(y\):
  \[
  E[\text{gain}] = \int_0^{M/3} \frac{y}{4} \cdot \frac{9}{4M}  dy + \int_{M/3}^{2M/3} \left(-\frac{y}{2}\right) \cdot \frac{3}{4M}  dy = -\frac{M}{32}.
  \]
  This is negative, so switching is harmful on average. The naive argument fails because it ignores that for \(y > M/3\), the other envelope must be \(y/2\), violating the \(1/2\) probability assumption.

  ### Point of Symmetry Breaking
  The envelopes are symmetric before observation: \(E[Y] = E[Z]\) (where \(Z\) is the other envelope), so unconditionally, \(E[Z - Y] = 0\). **Symmetry is broken precisely when \(y\) is observed.** After observation:
  - The conditional probability \(P(\text{smaller} \mid y)\) is \(1/2\) only if the prior density satisfies \(f_x(y) = f_x(y/2)\), which holds for a uniform improper prior but not generally.
  - In the bounded case, \(P(\text{smaller} \mid y) = 1/2\) for \(y \leq M/3\), but for \(y > M/3\), \(P(\text{smaller} \mid y) = 0\), breaking the symmetry.

  ### Conclusion
  The standard argument fails because it assumes an improper uniform prior, leading to divergent expectations. With a proper prior, the conditional probabilities are not always \(1/2\), and the expected gain can be negative. Physical indistinguishability does not prevent symmetry breaking upon observation; the prior distribution determines the conditional probabilities. The flaw is in the lack of a well-defined prior, not the envelopes' indistinguishability.
