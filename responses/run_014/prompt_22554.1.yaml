    The paradox is that this seems to imply that no matter which envelope you have, the other is better on average. But that can't be because the envelopes are symmetric.

    We are to argue that the problem is not the indistinguishability of the envelopes but the failure to specify a prior distribution over the total amount of money. We must discuss proper and improper priors, the bounded case, and the point at which symmetry is broken.

