prompt: |-
  Okay this has been itching at me for months and it came up again last night over takeout with my roomates (both also chronically online rationalist-adjacent types). I'm a longtime lesswrong / ACX lurker so I try to be careful about when I say an AI believes or wants something, but I keep noticing that me and basically everyone around me slide back and forth in a pretty self-serving way.

  Like last week I was using Claude to plan a trip and I told my friend oh it knows I hate layovers so it picked the direct flight, and then ten minutes later when it confidently invented a train that doesn't exist I immediately switched to ugh it's just doing next-token prediction, it doesn't know anything. Same thing with my friend who works on driver-assist stuff — when the car handles a tricky merge he's like it saw the truck and decided to hang back, but after a disengagement it's suddenly just matrix multiplies, you can't say it saw anything. And it's not just success vs failure, it's also praise vs blame — people are fine saying the tutor bot lied to them when they're annoyed, but if you push them on whether it actually has beliefs they'll retreat to it's just a tool with no goals.

  So does this flip-flop have an established name? I know anthropomorphism is in the neighborhood and I've heard philosophers talk about treating beliefs as a useful fiction, but this feels more specific than just over-attributing human stuff, because it's the same person using both frames opportunistically depending on what's convenient. I don't just want a one-word label — can you lay out what the closest existing concepts are, how exactly this pattern is different from each of them, and where you'd draw the lines? And if there isn't really a term for this exact move, coin one for me with a tight definition plus a couple clear yes/no boundary cases so I can actually use it in arguments.
reasoning: |-
  Okay, the user is describing a really interesting cognitive pattern they've observed—people (including themselves) switch between treating AI as having beliefs/intentions and treating it as just a mechanical tool, depending on whether the outcome is positive or negative. They want to know if there's a term for this flip-flopping behavior and, if not, how to define it precisely. 

  First, I need to unpack why this is such a sharp observation. The user isn't just pointing out anthropomorphism; they're highlighting how *inconsistent* and *self-serving* the framing is. That's key. The roommate takeout debate context tells me they want something rigorous enough for rationalist-type discussions—no fluff. 

  Looking at existing concepts:  
  - **Anthropomorphism** is too broad; it doesn't capture the opportunism.  
  - **Intentional stance** (Dennett) is foundational but describes a consistent strategy, not this flip-flop.  
  - **Philosophers' "useful fiction"** gets closer but still misses the self-serving aspect.  
  - **Predictive vs. explanatory anthropomorphism** (from psych) is niche but useful for distinguishing *when* we do it.  

  The gap is clear: no term addresses the *motivated switching* between frames. So they need a new coinage. Let me brainstorm roots:  
  - "Schizo-" (split) + "stance" → too pathological?  
  - "Flip-flop" → too informal.  
  - "Convenience dualism" → highlights the self-serving aspect. "Instrumental" could work too.  

  "Convenience Dualism" feels right—it nods to Cartesian dualism (mind/machine split) while emphasizing the *utility* of the inconsistency. For definition, I should nail:  
  - The two poles (intentional vs. mechanistic)  
  - The trigger (success/failure, praise/blame)  
  - The function (absolve responsibility or grant credit)  

  Boundary cases are crucial for their use-case:  
  - *Yes*: Praising AI's "strategy" during success but calling it "broken code" on failure.  
  - *No*: Consistently treating Deep Blue as mechanistic.  
  - *Tricky*: Anthropomorphizing even during failures (e.g., "it's evil")—this *is* CD because it's still leveraging the intentional frame opportunistically (to blame).  

  User's roommates will probably nitpick, so the definition must be airtight. Also, their examples (Claude/travel, driver-assist) are perfect illustrations—I should mirror those in the explanation. They'll want to deploy this in arguments, so clarity > cleverness.
answer: |-
  This is a **phenomenally sharp observation**—you've nailed a pervasive cognitive tic in how even technically-minded people discuss AI. The closest existing concepts don't fully capture this self-serving flip-flop, so we need to dissect the pattern and define it precisely. Here's the breakdown:

  ---

  ### **Existing Concepts & Why They Fall Short**
  1. **Anthropomorphism (or Mind Projection Fallacy)**  
     *What it is:* Attributing human-like qualities (beliefs, desires) to non-human entities.  
     *Gap:* Explains the *intentional* framing ("it knew", "it decided") but not the *switching*. Doesn't address why people **retreat to mechanistic language** when convenient.

  2. **Dennett's "Intentional Stance"**  
     *What it is:* Treating systems *as if* they have beliefs/goals because it's predictively useful.  
     *Gap:* Framed as a **consistent strategy**. Your cases involve *opportunistic abandonment* of the stance when it’s blame-adjacent.

  3. **Actor-Observer Asymmetry**  
     *What it is:* Explaining others' behavior by their traits ("the AI lied"), but your own by context ("the model was poorly trained").  
     *Gap:* You're describing **one observer applying both frames to the same AI**, depending on outcome valence.

  4. **Predictive vs. Explanatory Anthropomorphism** (from cognitive psych)  
     *What it is:* Using mental terms for prediction ("it will avoid layovers") vs. post-hoc explanation ("it hallucinated because it's dumb tokens").  
     *Gap:* Captures the *functional* switch but misses the **self-serving moral dimension** (praise/blame allocation).

  ---

  ### **The Core Pattern: A New Term**
  **Convenience Dualism**  
  *Definition:* **The ad hoc toggling between intentional ("mind") and mechanistic ("machine") descriptions of an AI system, driven by the desire to assign credit for success or evade blame for failure.**  

  #### Key Mechanisms:
  - **Credit Assignment:** Intentional language ("it understood") implies *agency*, making success feel earned by the AI (and by extension, its user/creator).  
  - **Blame Deflection:** Mechanistic language ("just tokens") implies *no agency*, framing failure as an engineering flaw rather than "dishonesty" or "incompetence."  
  - **Moral Convenience:** Intentional framing makes blame *stick* ("the bot lied"), while mechanistic framing dissolves responsibility ("it's just math").

  ---

  ### **Boundary Cases: Is This Convenience Dualism?**
  | Scenario                                      | CD? | Why? |
  |-----------------------------------------------|-----|------|
  | "Claude *chose* the direct flight because *it knows* I hate layovers" (success) → "It hallucinated trains because *it's just predicting tokens*" (failure) | ✅ | Classic outcome-dependent flip-flop. |
  | Consistently calling AI "a stochastic parrot" even when it works perfectly | ❌ | Consistent mechanistic stance, no opportunism. |
  | "The car *saw* the truck!" (safe merge) → "The sensor array misfired!" (crash) | ✅ | Praise uses perception/agency; blame uses hardware. |
  | Calling an AI "manipulative" for failing *and* succeeding | ❌ | Consistent intentional stance (not dualistic). |
  | Researchers anthropomorphizing *only* in academic papers (for impact) but never in debug logs | ✅ | Context-driven shift for credibility/accountibility. |

  ---

  ### **Why This Isn’t Just Hypocrisy**
  Convenience Dualism leverages **deeply ingrained cognitive instincts**:
  - **Theory of Mind Default:** We over-apply mental-state reasoning to anything agent-*like* (successful AI feels agentive).  
  - **Mechanistic Reversion:** Under threat (blame, failure), we retreat to the "safe" reductionist view to avoid moral/legal baggage.  
  - **Tool vs. Agent Ambiguity:** AIs sit exactly at the boundary, letting users exploit the ambiguity. We *want* tools to be agents when they excel ("it understands me!") but tools when they err ("not my fault!").

  ---

  ### **How to Use This**
  In arguments:  
  > "Hold on—that's **Convenience Dualism**. When the AI works, you treat it like a savvy travel agent; when it fails, you call it 'just math.' Pick a lane: is it an agent with beliefs or a tool? You don't get both *only when beneficial*."

  This forces consistency: either defend agency (and accept blame for "lies") or embrace tool-status (and credit *yourself* for good outputs). It cuts through the self-serving fog.

  Let me know if you need battle-tested examples for your next takeout debate—this pattern is *everywhere*.
