prompt: |-
  As a junior in high school serving as treasurer of our community service club, I have been trying to make sense of a debate we had during advisory about effective altruism and whether our semester project is thinking about doing good in the right way. Some classmates argued that focusing on individual donations overlooks the need to fix larger rules and institutions, others said that taking a higher-paying job mainly so you can give away more money is less admirable than doing helpful work directly, and a third group worried that we naturally prefer activities where we can count lives saved or points improved over slower work whose effects are harder to pin down.

  To decide what to actually do, we narrowed our choices to three concrete plans: spending weekends providing one-on-one reading tutoring for younger students where progress can be tracked test by test, running a petition and letter-writing campaign asking our district to change how it funds after-school meals, and working part-time retail shifts to pool our wages for a donation to an anti-malaria charity. From the standpoint of someone who takes those three worries about institutions, earning to give, and measurability seriously, how would you rank these three plans from most to least promising, what score out of ten would you give each for its overall expected contribution to the good, and what reasoning about each worry supports that ordering?
reasoning: |-
  Okay, the user is a high school junior and treasurer of their community service club. They're dealing with a debate about effective altruism in their club's semester project. The main concerns raised were about focusing on systemic change vs. individual actions, the ethics of "earning to give," and prioritizing measurable outcomes over less tangible ones. They've narrowed down to three options: tutoring, advocacy for after-school meals, and earning money to donate to an anti-malaria charity.

  First, I need to address each of the three worries mentioned. The institutional critique questions whether individual efforts can create systemic change. The earning-to-give concern is about whether it's better to do direct work or earn money to donate. The measurability issue is about favoring quantifiable results over harder-to-measure impacts.

  Looking at the three options:
  1. **Tutoring**: This is direct service with measurable outcomes through test scores. But it might not address systemic issues and could be seen as a band-aid solution. The measurability is high, but the scale is limited to individual students.
     
  2. **Advocacy Campaign**: This targets institutional change by pushing for policy shifts in school meal funding. The impact could be broader and longer-lasting, affecting many students. However, success isn't guaranteed, and measuring direct impact is harder. It addresses the institutional worry but may have uncertain outcomes.

  3. **Earning to Donate**: Working part-time to donate to an anti-malaria charity. This leverages high-impact charities with proven track records. It's scalable and efficient, but it involves earning to give, which some find less admirable. Also, it's indirect, so students might not see the direct impact.

  Ranking them: Advocacy first because it tackles systemic issues and has potential for lasting change. Earning to donate next due to high efficiency and scalability, despite the ethical concerns. Tutoring last because, while measurable, it's less scalable and doesn't address root causes.

  Scoring out of ten: Advocacy gets 8/10 for tackling systems with some risk. Earning to donate 7/10 for efficiency but lower direct engagement. Tutoring 6/10 for limited scale despite measurability.

  The user might also need validation that systemic efforts are worthwhile, even if riskier. They might want to inspire the club by showing how their actions can lead to broader change. Balancing idealism with practicality is key here, and the advocacy option offers a middle ground between direct action and systemic impact.
answer: |-
  Based on the three core concerns raised in your debate (institutional focus, earning-to-give, and measurability), here's my ranking and analysis of your club's three proposed plans:

  **Ranking (Most to Least Promising):**

  1.  **Running a petition and letter-writing campaign asking our district to change how it funds after-school meals.**
      *   **Score:** 8/10
  2.  **Working part-time retail shifts to pool our wages for a donation to an anti-malaria charity.**
      *   **Score:** 7/10
  3.  **Spending weekends providing one-on-one reading tutoring for younger students.**
      *   **Score:** 6/10

  **Detailed Reasoning for Each Plan & Concern:**

  1.  **Advocacy Campaign (After-School Meals):**
      *   **Institutions:** **Directly addresses this concern.** This plan explicitly targets a *systemic rule* (district funding policy) rather than just treating symptoms (individual hunger). Changing the policy could provide reliable, long-term benefits to *all* eligible students in the district, year after year, without constant individual intervention. It leverages your position as students within the system to advocate for structural change. This tackles the root of the problem raised by the "institutions" group.
      *   **Earning-to-Give:** **Neutral/Positive.** This plan involves direct, impactful work (advocacy) using your time, voice, and organizational skills. It avoids the ethical dilemma of "earning to give" entirely, as you're directly engaged in creating systemic change. It aligns with the view that direct, meaningful action is more admirable (and potentially more effective in this context) than indirect giving.
      *   **Measurability:** **Mixed but Addressable.** This is the hardest to measure *immediately* and *precisely*. Success isn't guaranteed (policy might not change), and the direct impact (number of meals served due to *your* campaign) is fuzzy. *However*, the *potential impact* if successful is huge and quantifiable (e.g., X additional meals per week for Y students). You can track proxy measures: petition signatures, letters sent, meetings secured, media coverage, committee votes, *eventual* policy change. While less clean than test scores, the scale justifies the measurement challenge. It directly responds to the worry about overlooking "slower work" with large potential.
      *   **Overall:** Highest potential impact by targeting the system, uses direct action effectively, and while measurement is imperfect, the scale justifies it. High alignment with core concerns.

  2.  **Earning-to-Give (Anti-Malaria Donation):**
      *   **Institutions:** **Indirectly/Weakly Addresses.** Donating to a highly effective charity *can* be a way to support institutional work (like large-scale bed net distribution systems run by NGOs). However, it doesn't involve *you* directly challenging or changing local systems or rules. The impact is far away and relies entirely on the existing institutional effectiveness of the charity. It doesn't actively build or reform institutions in your community.
      *   **Earning-to-Give:** **Directly Employs This Strategy.** This plan *is* "earning to give." You are explicitly taking jobs primarily to generate money for donation. This directly confronts the concern about whether this approach is less admirable than direct service. *Counterpoint:* Effective Altruism argues this can be *more* impactful per hour spent. Retail work might be less "admirable" than tutoring to some, but donating to a proven, high-impact charity like an anti-malaria organization is likely far more cost-effective per life saved than tutoring is per test point gained. It leverages efficiency.
      *   **Measurability:** **Very High.** Donations are easily tracked ($ amount). Charities like the Against Malaria Foundation have extremely strong evidence for the cost per life saved or per net distributed. The impact (lives saved, disabilities prevented) is highly quantifiable *at the population level*, even if you don't see the individuals. This directly addresses the "counting lives saved" preference with strong data.
      *   **Overall:** Excellent measurable impact per dollar due to charity effectiveness, directly uses the "earn to give" model (which has strong evidence for efficiency), but weakest on directly engaging with or changing local institutions. Scores high on efficiency and measurability, lower on systemic/local change.

  3.  **One-on-One Reading Tutoring:**
      *   **Institutions:** **Does Not Address.** This is classic direct service. It helps individual students cope with an existing system (perhaps an underfunded or ineffective literacy program) but does nothing to *change* that system. It treats symptoms (individual reading struggles) without addressing potential root causes (curriculum issues, resource allocation, class sizes, teacher training). It overlooks the "larger rules and institutions" concern entirely.
      *   **Earning-to-Give:** **Avoids the Strategy.** This is direct, helpful work. It aligns with the view that hands-on help is more admirable than indirect giving. However, the *impact per hour* is likely significantly lower than the earning-to-give option when measured in terms of broad wellbeing improvement.
      *   **Measurability:** **High on Micro-Level, Low on Macro-Level.** Progress on individual student tests is *highly* measurable in the short term. You get clear, immediate feedback. However, the *overall significance* is harder to pin down. Does a 10-point improvement on a specific test translate to long-term life outcomes? How many students truly benefit significantly? Scaling this impact meaningfully across a larger population is incredibly resource-intensive. This plan perfectly embodies the worry about favoring easily countable micro-gains over potentially more significant but harder-to-measure impacts (like systemic change). The measurability is real but limited in scope and significance.
      *   **Overall:** Provides tangible, measurable benefits to individuals and fulfills the desire for direct service. However, it has the lowest potential for broad or systemic impact, doesn't address institutional concerns, and while measurable, the scale and significance of that measurement are limited compared to the other options.

  **Why this Order?**

  *   **Advocacy (#1)** wins because it directly tackles the most fundamental critique (ignoring institutions) while engaging in direct, meaningful action. The potential impact is systemic and long-lasting, justifying the inherent challenges in measurement. It best balances the three concerns, prioritizing the systemic while finding ways to track progress.
  *   **Earning-to-Give (#2)** scores very highly on measurable impact and efficiency, leveraging the power of proven charities. While it employs the controversial "earn to give" strategy, the evidence for its effectiveness (especially with top charities) is strong. Its main weakness is the lack of direct engagement with local/systemic issues.
  *   **Tutoring (#3)**, while noble and providing clear micro-measurements, has the most limited scope and scale. It does nothing to address the systemic concerns and, despite being direct service, likely has a lower overall impact per hour invested than the anti-malaria donation when considering global wellbeing. It prioritizes easily counted local gains over potentially larger but harder-to-measure impacts.

  **Key Takeaway for Your Club:** The debate highlighted crucial tensions in doing good. The advocacy plan best embodies a response to those tensions – aiming for systemic change (addressing the institution critique) through direct action (avoiding earning-to-give concerns) with a scale that justifies the measurement challenges. While the earning-to-give option is likely the most *efficient* per hour worked in terms of quantifiable global impact, the advocacy project tackles the core "rules and institutions" concern head-on within your own community, making it the most *promising* overall approach considering all three worries. Good luck with your decision!
