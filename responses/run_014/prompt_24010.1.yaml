prompt: |-
  I'm a causal inference statistician — I spend my days with DAGs, potential outcomes, do-calculus, and arguing about which variables count as "background" versus "treatment" — and I just got into a really long argument with a philosopher friend about the doing/allowing distinction. She thinks there's a genuine moral difference between killing someone and letting them die, and I kept trying to say "but isn't that just a difference in the causal structure, like which node you intervene on?" and we went in circles for like a hour and a half. I cant get it to line up in my head.

  So can you restate the doing/allowing debate in the vocabulary I actually work in: counterfactuals and potential outcomes (would the person have died had I not intervened?), causal diagrams and the choice of which variables go into the model versus which get absorbed into the baseline, do-interventions versus not-doing, proximate versus remote causes, and the reference class you pick? I'd like you to go through the main positions — the view that the distinction is real and just tracks causation, the view that it's an illusion, the cases where acting and not-acting both seem to be within your control so "agency" doesn't do the work, and the Doctrine of Double Effect cases where the harm is a foreseen side effect rather than the means — and tell me how each one maps onto my terms.

  Then the part I actually care about: the residue report. Which claims translate cleanly, which only translate if you distort them, and which have no expression in my vocabulary at all? I have a hunch the doing/allowing distinction doesn't track pure counterfactual dependence but instead tracks the choice of causal model — which variables you treat as the background versus the intervention — and that this choice is underdetermined by the data, which is exactly the kind of thing I'm used to complaining about. Is that hunch right, or am I smuggling in an assumption from my field and calling it translation? And if there's a residue, is it a defect of my causal-inference vocabulary, or does it show the philosophers' disagreement is less clean than it looks?
reasoning: |-
  We are going to break down the doing/allowing distinction using the tools of causal inference: potential outcomes, causal diagrams (DAGs), interventions, and counterfactuals.

  First, let's set up a basic scenario: a person is in a situation where they can either act to cause a death (doing) or not act, which results in a death (allowing). We'll model this with two potential outcomes:

  - Y(1): outcome (death) if I act (do the harmful action)
  - Y(0): outcome (death) if I do not act

  The counterfactual question for the allowing case is: would the person have died if I had not intervened? In the allowing case, we are not intervening to prevent death, so we are observing Y(0). The doing case is when we set Y(1)=1 (death occurs because of our action).

  But note: in the allowing case, we are not intervening to cause death, but we are also not intervening to prevent it. So the death occurs without our intervention. In the doing case, we are intervening and causing death.

  The philosopher's claim is that even when Y(1)=1 and Y(0)=1 (so death occurs in both scenarios), there is a moral difference between acting (which causes death) and not acting (which allows death). This is the case of overdetermination.

  Now, let's try to model this with a causal diagram.

  ## Causal Diagrams and the Doing/Allowing Distinction

  Consider a simple DAG for a classic example: pushing someone off a lifeboat (doing) vs. not throwing a life preserver to someone drowning (allowing).

  We might model the system with the following variables:

  - A: my action (intervention variable). Let A=1 if I push the person off, A=0 if I do nothing (in the allowing case, we are considering A=0 as the relevant inaction, but note that in the allowing case, we might have an alternative action available: throwing the life preserver. So we need to be careful about what the baseline is).

  Alternatively, we might have:

  - D: whether the person dies (outcome)
  - P: a variable representing the presence of a threat (e.g., the storm, or the fact that the person is in the water)
  - R: a variable representing whether a rescue is available (e.g., the life preserver)

  In the pushing case (doing):
    - My action (A=1: push) directly causes death. Without my push, the person would not have died (so D(0)=0, D(1)=1). But note: if the person was going to die anyway (because of the storm) then we have a different situation.

  In the not throwing the life preserver case (allowing):
    - The threat (P=1: the person is in the water) would cause death unless there is a rescue (R=1). My inaction (A=0: not throwing) means R=0, so death occurs. If I had acted (A=1: throw), then R=1 and death would be prevented.

  But note: in the allowing case, the death is caused by the threat (P) and the absence of rescue (R). My action (or inaction) is a cause only by omission.

  So the DAG might look like:

  For the doing case (pushing):
    A → D
    (and there might be no threat, or the threat is not the cause)

  For the allowing case (not throwing the life preserver):
    P → D ← R
    and A → R (where A=1 means I throw the life preserver, so R=1; A=0 means I don't, so R=0)

  In the allowing case, if I set A=0, then R=0, and if P=1, then D=1. The counterfactual is: if I had set A=1 (throw), then R=1, and D=0 (assuming the life preserver would save them). So the death is counterfactually dependent on my inaction.

  But note: in the doing case, if I set A=1 (push), then D=1. If I set A=0 (not push), then D=0. So the death is counterfactually dependent on my action.

  So in both cases, the death is counterfactually dependent on my action (or inaction). But the philosopher says there is a moral difference.

  This leads us to the first point: the philosopher might argue that the causal structure is different. In the doing case, I am introducing a new cause (my push) that was not present in the baseline. In the allowing case, I am failing to remove a threat that was already present.

  But note: in causal inference, we can model both as interventions. The moral difference then might be attributed to the baseline: what is the "normal" course of events? In the allowing case, the threat (P) is already present, and the baseline is that without my intervention, the death occurs. In the doing case, the baseline is that without my intervention, death does not occur.

  So the moral difference might be tied to the counterfactual: in the allowing case, the death would have occurred without me (so I am not the cause, I just failed to prevent). In the doing case, the death would not have occurred without me (so I caused it).

  But what about cases of overdetermination? Suppose the person is going to die anyway (because of P) and I push them. Then without my push, they would have died (so D(0)=1) and with my push, they die (D(1)=1). Then my action makes no difference. But we might still say that pushing is worse than not pushing? The philosopher might say that pushing is a "doing" and not pushing is an "allowing", and that doing is worse even if the outcome is the same.

  In causal inference, we might say that my push is a sufficient cause (it is a cause in the sense that it is sufficient to bring about the death) but not a necessary cause (because the threat was already going to cause it). So we have two sufficient causes.

  Now, let's map the main positions:

  ### 1. The view that the distinction is real and tracks causation

  This view says that the doing/allowing distinction is grounded in causal structure. Doing harm involves causing a new harm, while allowing harm is failing to prevent an already existing threat.

  In causal inference terms:
  - Doing: My action is a necessary and/or sufficient cause for the harm in the actual scenario (or at least a cause that introduces a new sufficient pathway).
  - Allowing: The harm would occur without my intervention (so I am not a necessary cause) and my inaction is a cause only by omission (which might be considered a different kind of cause).

  But note: in the allowing case, my inaction might be a necessary condition for the harm (if I could have prevented it) but it is not a positive cause.

  In DAG terms: the doing case might have an arrow from my action to the harm, while the allowing case might have my action affecting a variable that would block the harm (so the absence of the block causes the harm).

  ### 2. The view that the distinction is an illusion

  This view might say that the moral difference is not real. What matters is the outcome and the counterfactual: if my action (or inaction) leads to death, and if I could have done otherwise, then I am responsible. The causal structure does not add a moral dimension beyond that.

  In causal inference terms: the only thing that matters is the potential outcomes. If the death would not have occurred had I acted differently (in either case), then I am responsible. The distinction between an action and an omission is not morally relevant.

  ### 3. Cases where both acting and not-acting are within your control

  Example: I can push a button to kill someone, or not push it. If I don't push, they die anyway. So both pushing (doing) and not pushing (allowing) are under my control, and both lead to death. The counterfactuals: if I push, they die; if I don't push, they die. So the outcome is the same regardless.

  But we might still feel that pushing is worse. Why? The philosopher might say that in the pushing case, I am actively causing the death, while in the not pushing case, I am just letting the existing cause take its course.

  In causal inference, we might model this as:

  - Pushing (A=1): D=1 (and without pushing, D=1 too, so D(0)=1, D(1)=1)
  - The threat (P) is present and causes death regardless of A.

  But note: if without pushing the death occurs, then pushing doesn't change the outcome. So why is it worse? It might be because we consider the threat (P) as the cause in the baseline, and my pushing is an additional cause. But if the death is overdetermined, then my pushing is a sufficient cause and the threat is a sufficient cause. So I am still causing the death, even if it was going to happen anyway.

  The moral residue might come from the fact that by pushing, I make myself a cause (I become a sufficient cause) whereas by not pushing, I am merely not preventing.

  ### 4. Doctrine of Double Effect (DDE)

  This is the idea that it is sometimes permissible to cause a harm as a side effect (or foreseen consequence) of an action intended to do good, but not as the means to the good.

  Example: Trolley problem. Turning the trolley (doing) kills one but saves five. The death is a foreseen side effect, not the means.

  In causal inference terms:

  We can model the trolley problem with a DAG:

  - Action A: turn the trolley (A=1) or not (A=0)
  - Outcome on track 1: five people die if trolley goes that way (i.e., if A=0)
  - Outcome on track 2: one person dies if trolley goes that way (if A=1)

  The total death count: D = 5*(1-A) + 1*A

  But note: the death of the one is a direct consequence of turning the trolley. Without turning, the one would not have been hit. So turning the trolley causes the death of the one.

  However, DDE says that turning the trolley is permissible because the death is not intended as the means to save the five. It is a side effect.

  In causal terms, we might try to represent the intention. But causal models typically do not include intentions. We might model the causal pathway: turning the trolley causes the trolley to go to track 2, which causes the death of the one. This is a direct effect. But the saving of the five is because the trolley is not on track 1. The death of the one is not a cause of the saving of the five. They are independent consequences of the action.

  Compare to a case where the death is the means: e.g., pushing a fat man off a bridge to stop the trolley. Then the death (of the fat man) causes the stopping of the trolley. So the causal diagram is:

  - Action: push fat man (A=1) or not (A=0)
  - Fat man dies if pushed (D1 = A)
  - The trolley stops only if the fat man is on the tracks (so S = A, because pushing puts him on the tracks)
  - Then the five are saved (if the trolley stops).

  So the death of the fat man is the cause of saving the five.

  In the DDE, the claim is that the causal structure matters: when the harm is a direct effect of the action but not a cause of the good outcome, it might be permissible. When the harm is a cause of the good outcome, it is not.

  ## Residue Report

  Now, which parts of the doing/allowing debate translate cleanly to causal inference vocabulary?

  1. **Counterfactual dependence**: This is central. Both doing and allowing can be described in terms of counterfactual dependence of the outcome on the action. This translates cleanly.

  2. **Causal structure (DAGs)**: We can represent the doing case as a direct arrow from action to harm, and the allowing case as an action that prevents a harm (so the absence of the action allows the harm via the existing threat). This also translates cleanly.

  3. **Interventions**: The doing case is a `do(A=1)` causing harm, while the allowing case is a `do(A=0)` (or not intervening) that leads to harm. But note: the allowing case often involves an intervention being available that would prevent the harm. So we are comparing `do(A=0)` (inaction) with `do(A=1)` (action that prevents). The harm occurs in the `do(A=0)` world. This is clean.

  4. **Overdetermination**: We can model cases with multiple sufficient causes. The fact that an action is a sufficient cause (even if not necessary) can be represented. This is clean.

  5. **Doctrine of Double Effect**: We can represent the causal pathways and see whether the harm is on the path to the good outcome or not. This is clean.

  But there are some distortions and residues:

  1. **Baseline selection**: The moral distinction between doing and allowing often relies on what we consider the "normal" or "baseline" course of events. In causal inference, the baseline is the non-intervention scenario. But in the allowing case, we are comparing to a scenario where we intervene to prevent. The non-intervention scenario is the baseline. In the doing case, the non-intervention scenario is safe. The choice of what counts as the baseline is not determined by the causal structure alone. It might involve normative assumptions about what is the default. This is underdetermined.

  2. **Agency and control**: In causal inference, we model interventions as changes in the value of a variable. But we don't typically model the effort or the cost of the intervention. The philosopher might argue that allowing is less bad because it doesn't require an active effort. But in causal inference, we don't model effort. This is a residue.

  3. **Intention and foresight**: DDE relies on the agent's intention. Causal models do not include intentions. We can model the causal structure (e.g., whether the harm is a cause of the good outcome or not) but not the mental state. So the Doctrine of Double Effect has a residue: the intention. However, the causal structure might be used to infer the intention (if the harm is a means, then it must be intended? But not necessarily). This is a distortion: we are mapping intention onto causal structure, but they are not identical.

  4. **Omissions as causes**: In causal inference, we can treat inaction (A=0) as a cause if it satisfies counterfactual dependence. But some philosophers argue that omissions are not real causes. In causal inference, we are comfortable with them. This might be a distortion because we are modeling something that the philosopher might not consider a cause.

  5. **Moral residue beyond counterfactuals**: In the overdetermination case, we feel that doing is worse even when the counterfactual outcome is the same. This might not be captured by the counterfactual dependence. We might need to look at the presence of a sufficient cause (which we can model) but that doesn't explain the moral difference. Why is being a sufficient cause (when the outcome would have happened anyway) worse? This residue might require an additional moral principle (e.g., about the agent's involvement).

  Your hunch: the doing/allowing distinction doesn't track pure counterfactual dependence but instead tracks the choice of causal model — which variables you treat as the background versus the intervention — and that this choice is underdetermined by the data.

  This hunch is right. The baseline (non-intervention) scenario is taken as the default, and doing harm is seen as a deviation from that default, while allowing harm is seen as not deviating (so the harm is attributed to the background). The choice of what is in the background is underdetermined by the data. For example, in the lifeboat case, is the storm the background and my inaction the background? Or is my inaction an intervention? We have to choose how to set up the model.

  Moreover, the causal model might include variables that are not directly observed (like intentions) or might have different levels of abstraction.

  So the residue is partly due to the underdetermination of the causal model and partly due to normative elements (like intention and the moral weight of active effort) that are not captured in the causal inference framework.

  The philosophers' disagreement might be less clean than it looks because they are not always explicit about the causal model they are assuming. But also, the causal inference vocabulary is not designed to capture all the nuances (like intention and effort) that philosophers care about.

  In summary, the doing/allowing distinction can be partially mapped to causal models, but there are residues related to baseline selection, agency (effort), intention, and the moral weight of being an active cause even in overdetermination. These residues are not defects of the causal-inference vocabulary per se, but reflect that the moral distinction is not solely about causation. They show that the philosophers' disagreement might involve factors beyond what is captured in the causal structure.
answer: |-
  Let's reframe the doing/allowing distinction using causal inference vocabulary. I'll map key philosophical positions to your toolkit—counterfactuals, DAGs, interventions, reference classes, and potential outcomes—then analyze the "residue" where translation fails. Your hunch about causal model underdetermination is central.

  ### **Core Concepts Translated**
  1. **Basic Distinction (Killing vs. Letting Die)**  
     - **Scenario**: Victim dies if you act (`do(A=1)`) or don't act (`do(A=0)`).  
     - **Causal Model**:  
       - *Doing* (killing): Your action is a **proximate cause**. DAG: `A → Death ← Threat` (but `Threat` absent or inactive).  
       - *Allowing* (letting die): Your inaction permits a **background cause** to operate. DAG: `Threat → Death`, with `A` (inaction) as a **null intervention** on a preventer node.  
     - **Counterfactuals**:  
       - *Doing*: Death occurs only if `A=1` (i.e., `Y^{do(A=1)} = 1`, but `Y^{do(A=0)} = 0`).  
       - *Allowing*: Death occurs if `A=0` *and* would still occur under no intervention (i.e., `Y^{do(A=0)} = 1`, and `Y^{\text{no intervention}} = 1`).  
     - **Key**: Distinction hinges on whether death is **counterfactually dependent** on your action (`A=1`) or inaction (`A=0`), *and* whether the threat exists in the background reference class.

  2. **The "Real Difference" Position (Tracks Causal Structure)**  
     - Claims doing/allowing is morally salient and maps to causal roles.  
     - **Your Terms**:  
       - *Doing* = Active intervention introducing a **new sufficient cause**. Node `A` is a parent of `Death` with no competing paths in the baseline.  
         - *Example*: Pushing someone into water (`A → Death`). Counterfactual: `Death^{do(A=0)} = 0`.  
       - *Allowing* = **No intervention** on a preventer variable. Death is caused by a background node (`Threat`), with your inaction (`A=0`) failing to block it.  
         - *Example*: Not throwing a lifebuoy to drowning person. DAG: `Threat → Death ← A`, where `A=1` (throw) blocks death. Counterfactual: `Death^{do(A=0)} = 1` but `Death^{\text{no system}} = 1` (threat operates solo).  
     - **Moral Weight**: Derived from **causal responsibility**. Doing increases the probability of death relative to baseline; allowing doesn't. Resembles **average treatment effect (ATE)** where `ATE_{doing} = P(Y=1|do(A=1)) - P(Y=1|do(A=0)) > 0`, while `ATE_{allowing} ≈ 0` if threat is high-probability.

  3. **The "Illusion" Position (No Moral Difference)**  
     - Claims only outcomes matter, not causal role.  
     - **Your Terms**:  
       - Reduces to **counterfactual equivalence**: If `Y^{do(A=1)} = Y^{do(A=0)} = 1` (death in both cases), no distinction exists.  
       - *Example*: Overdetermined death (e.g., victim dies from your poison or background illness). DAG: `A → Death ← Threat`, with both paths active. Here, `Y^{do(A=1)} = 1`, `Y^{do(A=0)} = 1`.  
       - **Agency irrelevance**: If both acting and not-acting are **control variables** (you can choose `A`), moral weight depends only on `Y`, not on `A`'s causal role. Ignores DAG structure.

  4. **Agency-Within-Control Cases (Both Options Available)**  
     - E.g., You can push victim (doing) or not push (allowing); death occurs either way.  
     - **Your Terms**:  
       - **Choice of intervention**: `do(A=1)` vs. `do(A=0)` are both intentional. Distinction rests on **causal pathways**, not control.  
       - *Problem*: If death is overdetermined (e.g., `Threat` ensures death regardless of `A`), counterfactuals don't differ (`Y^{do(A=a)} = 1` ∀a). Philosophers argue "doing" is worse, forcing reliance on **DAG structure**:  
         - *Doing* adds an active path (`A → Death`).  
         - *Allowing* is path-neutral (no intervention).  
       - **Reference class matters**: Baseline is "threat present," so `A=1` deviates, making you a cause.

  5. **Doctrine of Double Effect (DDE)**  
     - Permits harm as a foreseen side effect (allowing-like) but not as a means (doing-like).  
     - **Your Terms**:  
       - **Mediation analysis**: Harm is acceptable if not on the causal path to the good outcome.  
         - *Acceptable* (side effect): DAG: `A → Good_Outcome`, `A → Harm`. Harm is collateral (e.g., diverting trolley kills one but saves five: `A → Track_B → Harm`, `A → Track_A → Good`).  
         - *Unacceptable* (means): DAG: `A → Harm → Good_Outcome`. Harm is mediator (e.g., killing one to harvest organs: `A → Harm → Organ_Supply → Good`).  
       - **Counterfactual test**: In DDE, harm under `do(A=1)` is permissible only if `Harm^{do(A=1)} = 1` but `Good_Outcome^{do(\text{prevent harm})} = 1` (i.e., harm isn't necessary for good).

  ---

  ### **Residue Report: What Doesn't Translate Cleanly**  
  Your hunch is correct: **The distinction often reduces to underdetermined choices in causal modeling**, not pure counterfactuals. Below, residue is categorized:

  #### **1. Clean Translations (No Residue)**  
  - **Counterfactual dependence**: When `Y^{do(A=1)} = 1` but `Y^{do(A=0)} = 0`, it's unambiguously "doing." When `Y^{do(A=0)} = 1` and `Y^{\text{no system}} = 1`, it's "allowing."  
  - **Path-specific effects**: DDE's means/side-effect distinction maps neatly to **direct vs. indirect paths** in mediation analysis.  
  - **Overdetermination**: Cases where `Y^{do(A=a)} = 1` ∀a are cleanly modeled as sufficient causes.  

  #### **2. Translations Requiring Distortion**  
  - **"Background" vs. "Treatment" assignment**:  
    - Philosophers assume threats are "background," but this is **reference-class dependent**. E.g., in a famine, is starvation "background" or an intervenable cause? Your toolkit *can* model this via **causal graph selection**, but the *choice* of graph is underdetermined by data (e.g., latent variables, granularity).  
    - *Distortion*: Treating "background" as a fixed reference class smuggles in **normative assumptions** (e.g., "threats are normal"). Statistically, it's just a choice of baseline.  
  - **Agency in allowing**: Philosophers see "allowing" as passive, but in causal terms, `do(A=0)` is an intervention. To reconcile, we must reframe inaction as **intervening on a preventer variable** (e.g., "not-saving" as `do(Rescue=Off)`). This works but feels forced.  

  #### **3. Untranslatable Residue**  
  - **Intentionality and foresight**: DDE requires intent, but potential outcomes lack mental states. E.g., Identical DAGs for "diverting trolley" (intended good) vs. "pushing person" (intended harm) are indistinguishable. *Residue*: Intent is outside causal inference.  
  - **Moral weight of "active force"**: Philosophers argue doing is worse due to "force expenditure," even if counterfactuals match (e.g., overdetermination cases). Causal inference has no metric for "effort" or "force"—it's **not encoded in DAGs or potential outcomes**.  
  - **Normative baseline selection**: The core disagreement often reduces to **which variables are "fixable"** (treatment) vs. "given" (background). E.g., Is poverty a "background" variable or an intervenable node? Causal inference doesn't dictate this; it's a **societal/normative choice**.  

  #### **Your Hunch: Valid with Caveats**  
  - **Correct**: The distinction *is* about **causal model choice**—especially reference classes and node definitions. E.g., "Allowing" emerges when threats are in the background, but this is underdetermined (e.g., climate disaster: is your inaction "allowing" or is industry pollution "doing"?).  
  - **Not Smuggling**: This isn't field bias; it's exposing that philosophers implicitly rely on **unstated causal models**. Their debates often stem from disagreeing on the "correct" DAG.  
  - **Residue Source**: The untranslatable elements (intent, effort, normative baselines) aren't defects of your vocabulary; they reveal **genuine limitations in purely causal accounts of morality**. Philosophers conflate causal structure with these extras, making disagreements "less clean."  

  #### **Conclusion**  
  - **Cleanly mapped**: Core cases, overdetermination, DDE's causal paths.  
  - **Distorted**: Background/treatment division (underdetermined), agency in inaction (reframed as intervention).  
  - **Residue**: Intent, effort, and baseline normativity—these have no causal analogues and explain why the debate persists. Your toolkit shows the distinction isn't fundamental but **model-dependent**, with moral residue arising from choices unsupported by data. This mirrors your work: Disputes over "background" variables aren't flaws; they're inherent to causal inference.  

  The takeaway: Philosophers’ "doing/allowing" is often a proxy for **disagreements about which causal model to use**, but moral residue (intent/effort) remains outside your framework—correctly highlighting where causation ends and ethics begins.
