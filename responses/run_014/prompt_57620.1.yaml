answer: |-
  I’ve spent some time with your question, turning it over much as you have, and I appreciate you pushing for numerical clarity over a survey of the literature—it’s a refreshing challenge. Your working example of the lying friend feels viscerally right as a testing ground, and I’ll try to decompose my own credence as requested, though I’ll confess these probabilities feel more like waypoints in a foggy landscape than precise coordinates. Here’s how I see it, broken down term by term.

  On "standing" picking out a genuine normative status rather than a loose conversational convention, I’d put my credence at **0.85**. It strikes me that the discomfort we feel in your example isn’t merely about social awkwardness or inefficacy—it’s a deeper sense that the blamer’s moral authority is corroded, violating a structural condition for legitimate blame that transcends pragmatics. Conversational conventions might codify it, but they don’t invent it.  

  For blame being essentially a claim to a standard the blamer holds, such that their own violation undermines the claim, I’m at **0.90**. Blame, when sincere, implicitly asserts "this standard binds us both, and I acknowledge its force"—so when the blamer flouts it, their act becomes performatively inconsistent, like demanding honesty while shouting lies; the contradiction isn’t just ironic but invalidating.  

  On the person being blamed having an entitlement to object that survives the criticism’s truth, I land at **0.80**. Even when the criticism is accurate, the blamed party retains a defeasible right to reject the *source*—not the content—of the rebuke, akin to how valid legal evidence can be thrown out if obtained unlawfully; the truth doesn’t cleanse the taint of hypocrisy.  

  As for whether there’s a real difference between the attitude of blaming and the act of expressing it (when sincere, private, and gentle), I’m less certain, assigning **0.65**. While the *attitude* might privately fester without expression, the *normative force* of blame—its claim to relational accountability—only crystallizes in the act, however subdued; a silent judge has no courtroom.  

  To combine these into a headline credence that the defect lies in the blaming itself (not tact, timing, etc.), I multiply the probabilities as interdependent premises: 0.85 × 0.90 × 0.80 × 0.65 ≈ **0.40**, but this feels artificially low—it overlooks how these elements reinforce one another. Using a geometric mean (better for correlated convictions) gives me ≈ **0.80**. After weighting the core "claim to a standard" premise more heavily, I settle on **0.82**.  

  This headline number is most sensitive to **whether blame essentially claims a standard the blamer must hold (0.90)**. If I revised that downward—say, if I became convinced blame functions like a public health warning (where the smoker’s habit doesn’t negate the truth about smoking’s risks)—my credence would collapse toward 0.50. Conversely, if new examples solidified the performative contradiction (e.g., hypocritical blame consistently provoking resentment even when privately delivered), it could push me to 0.90+. What might move me? A compelling case where hypocritical blame *strengthens* moral persuasion—but I struggle to imagine it.  

  Yours at 0.75 feels eminently reasonable—I’d wager our difference lies mainly in how sharply we distinguish attitude from expression. If you’ve found anchors for your view these past months, I’d be keen to hear them.
