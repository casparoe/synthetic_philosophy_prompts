prompt: |-
  I'm a PhD student in philosophy (decision theory / epistemology side) and I'm moderating a Q&A in a couple of months with a guest who's just come out with a book defending the view that the Dutch book argument is the single best and most rigorous justification for expected utility maximization — his whole framing is that coherence, i.e. avoiding Dutch books, is the core rationality requirement and everything else (the axioms, the representation theorems) is just elaboration. He's a great speaker but he's also the type who, when pushed, will just say "the betting framework isn't a metaphor, it's the point," and I want to be ready for that. I was discussing this with my advisor last week and she kept saying I should press on the fact that Dutch book avoidance is necesary but not sufficient for EU maximization, which I think is the main place where his "coherence = rationality" slogan quietly does more work than it should.

  Can you draft me a sequence of six to eight interview questions that make it progressively harder for him to lean on the betting-framework framing? I specifically want at least one question that nails down the necessary-not-sufficient point (does avoiding Dutch books actually pin down EU maximization, or is it compatible with a bunch of other decision rules and value structures — like coherent credences but incoherent values, or a maximin rule?), with a follow-up keyed to the reply he's most likely to give (I'm betting on "coherence is a minimal requirement, not the whole story," so the follow-up should press on what, if anything, the 'whole story' adds and whether that 'whole story' is itself justified). I also want one question on the pragmatic vs. epistemic Dutch book distinction — is the money/transferability assumption load-bearing, or does the epistemic-utility version generalize it cleanly? — and one on why the betting framework is needed at all, as opposed to just stating "your credences should form a probability measure" as a purely logical consistency requirement. And please end with one question about what evidence or argument could actually count against his view, since I want to leave the room with something concrete.
reasoning: |-
  Okay, let's tackle this. The user is a PhD student in philosophy, specifically in decision theory and epistemology. They're moderating a Q&A with an author who strongly defends the Dutch book argument as the best justification for expected utility maximization. The author's core idea is that coherence (avoiding Dutch books) is the fundamental rationality requirement, and everything else is just elaboration. 

  The user's advisor suggested pressing on the point that Dutch book avoidance is necessary but not sufficient for EU maximization. The user wants to challenge the author's betting-framework framing and needs a sequence of tough questions. 

  First, I need to understand the key weaknesses in the author's position. The necessary-but-not-sufficient point is crucial: avoiding Dutch books ensures probabilistic coherence but doesn't enforce EU maximization. People could have coherent credences but non-EU-compliant values, like ambiguity aversion or maximin rules. The author might respond that coherence is minimal, so the follow-up should push on what additional principles are needed and how they're justified.

  Then there's the pragmatic vs. epistemic Dutch books distinction. The author claims the betting framework isn't a metaphor, but if the epistemic version works without money, does that undermine the necessity of actual bets? Also, why use bets at all if probabilistic coherence can be framed as a logical consistency requirement?

  The user also wants to end with what could falsify the view. That's important for a robust discussion. 

  I'll structure questions to start friendly and escalate. Begin with exposition to let the author explain his view, then move to necessary-but-not-sufficient, pressing on examples like ambiguity aversion. The follow-up should challenge whether adding EU axioms is ad hoc. Next, tackle the money assumption in Dutch books—does epistemic utility generalize it? Then question why betting is essential versus pure logic. End with falsifiability. 

  I need to ensure each question builds on the last, boxing the author into defending his core claims without retreating to "betting is the point." The ambiguity aversion example is key—it's a clear case where coherent credences don't lead to EU. The falsifiability question forces him to confront counterexamples. 

  Also, the user mentioned the author might say "coherence is minimal," so the follow-up must ask what "more" is and if it's justified independently. That exposes whether the EU part is tacked on without the same rigor. 

  Overall, the sequence should systematically dismantle the betting framework's necessity while appearing respectful. Ending on falsifiability leaves the audience with critical tools.
answer: |-
  Here’s a targeted 8-question sequence designed to progressively challenge the betting-centric framing and press the necessary-but-not-sufficient critique, while ending with falsifiability. Each question builds on the prior reply, anticipating common defenses:

  1. **Exposition Softball**:  
     "Your book argues that Dutch book avoidance is the *core* justification for expected utility (EU) maximization. To frame the discussion, could you briefly explain why coherence-as-avoiding-sure-losses is more fundamental than, say, Savage’s axioms or von Neumann-Morgenstern’s approach?"  
     *(Lets him state his thesis without confrontation)*

  2. **The Gap: Necessary-but-Not-Sufficient**:  
     "You emphasize that coherence is the minimal rationality requirement. But as you know, probabilistic coherence (avoiding Dutch books) is *necessary* for EU maximization but not *sufficient*. For instance, an agent with probabilistic credences could still violate EU by using a **maximin rule** or having **non-linear utility in probabilities** (e.g., ambiguity aversion). Doesn’t this imply that coherence alone is too weak to pin down EU maximization?"  
     *(Forces acknowledgment of the gap; primes ambiguity aversion example)*

  3. **Follow-Up on "Minimal Requirement" Evasion**:  
     "Suppose you reply that coherence is just the ‘entry fee’ for rationality, and we need *additional* principles (like independence axioms) to get EU. If those further principles *aren’t* justified by Dutch-book avoidance, **what *independent* justification do they have**? And if they *are* justified by Dutch books, how? For example, can you Dutch-book an ambiguity-averse agent with coherent credences?"  
     *(Preempts the "minimal requirement" dodge; demands internal consistency)*

  4. **Betting or Bust? The Pragmatic Epistemic Split**:  
     "You’ve said betting isn’t a metaphor—it’s the point. But ‘epistemic’ Dutch book arguments replace money with scoring rules. **If we can derive coherence via non-pragmatic accuracy measures (like Brier scores), doesn’t this undermine the claim that *actual betting* is essential?** Or is the money/transferability assumption doing hidden work?"  
     *(Tests whether money is load-bearing; exposes tension in "not a metaphor" stance)*

  5. **Why Betting at All? The Logical Consistency Challenge**:  
     "Even if coherence is necessary, why invoke bets? **Couldn’t we just demand credences form a probability measure as a logical consistency constraint** (e.g., avoiding contradictory valuations of equivalent propositions), *without* appealing to losses? If so, isn’t the betting framework superfluous?"  
     *(Directly challenges the necessity of the betting framework)*

  6. **The Value Structure Problem**:  
     "Dutch books target *credal* coherence, but EU also requires **coherent *values*** (e.g., utility linearity in money). Yet an agent could have incoherent values (e.g., cyclical preferences) while avoiding Dutch books if their credences are probabilistic. **How does your ‘coherence = rationality’ slogan address this?** Is there a Dutch book for cyclical preferences *without* probabilistic incoherence?"  
     *(Highlights that "coherence" is ambiguous; isolates value-rationality)*

  7. **Edge Case: When Coherence and EU Diverge**:  
     "Consider an agent who assigns sharp, coherent probabilities but uses a **non-EU decision rule** (e.g., *minimax regret*) in a bounded loss scenario. They avoid Dutch books yet violate EU. **Is this agent irrational *solely* for violating EU, even though they’re coherent?** If so, on what grounds beyond Dutch-book avoidance?"  
     *(Concrete case where coherence ≠ EU; forces a stance on rationality beyond coherence)*

  8. **Falsifiability/Evidence Question**:  
     "Finally, to test the robustness of your view: **What empirical finding or theoretical result *would* convince you that Dutch-book avoidance is *not* the best foundation for EU?** For instance, if agents we intuitively deem rational (e.g., logically omniscient AI) were shown to be Dutch-bookable in principle but practically robust, would that challenge you?"  
     *(Ends with falsifiability—key for a rigorous debate)*

  ### Strategic Notes:
  - **Anticipated Replies & Traps**:  
    - At Q2/Q3, he may grant the necessity/sufficiency gap but call coherence "necessary for any rational framework." *Response (Q3)*: Press what justifies *adding* EU specifically. If he claims EU axioms "complete" coherence, ask how (e.g., can you Dutch-book non-EU maximizers who are probabilistically coherent? Spoiler: Often no).  
    - On epistemic Dutch books (Q4): He might argue epistemic scoring rules "are still bets on accuracy." *Response*: Ask why "accuracy" isn’t the core rationale, making money incidental.  
    - On cyclical preferences (Q6): He may invoke "money pump" arguments. *Response*: Note that money pumps require *sequential* choice, while Dutch books are synchronic.  
  - **Why This Works**:  
    The sequence moves from exposition → exposing the necessity/sufficiency gap → challenging the betting framework’s uniqueness → isolating value coherence → ending on falsifiability. It forces him to either:  
    (a) Admit Dutch books *alone* don’t justify EU (undermining his "single best" claim), or  
    (b) Argue that coherence *logically extends* to EU—which is mathematically false and easy to counter with examples.  

  Bring printouts of classic counterexamples (e.g., Schervish’s non-EU coherent agents, ambiguity aversion in Ellsberg paradox) to cite if he dodges. Good luck—this is a great line of attack!
