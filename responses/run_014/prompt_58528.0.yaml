prompt: |-
  I am a philosophy professor chairing our department's decision whether to grant a junior colleague an additional semester of leave to finish a first book she is confident will be completed on schedule. Draft the joint statement of an adversarial collaboration between an advocate of the outside view, who stresses base rates and epistemic modesty, and an advocate of the inside view, who stresses the causal details of this author and project. Present it as a numbered list of claims both sides can sign followed by a table of residual disagreements. The agreed claims should cover when base rates are informative, when case-specific details override them, and what responsible confidence requires in this context. Formulate each disagreement so that the side holding it would endorse the wording, identify the cruxes that would move at least one side if settled, and for each crux describe a concrete test, comparison case, or departmental record both sides agree would bear on it, recording each side's prediction in advance.
reasoning: |-
  We are drafting a joint statement from an adversarial collaboration between two perspectives: the Outside View (OV) and the Inside View (IV). The OV emphasizes base rates and epistemic modesty, while the IV stresses the causal details of the specific case. The statement will include a numbered list of agreed claims and a table of residual disagreements. The agreements should cover when base rates are informative, when case-specific details override them, and what responsible confidence requires in this context. The disagreements should be worded so that each side would endorse their own, and for each we must identify cruxes (key points that, if settled, would change at least one side's view) and describe a concrete test or comparison case that both sides agree would bear on it, along with each side's prediction.

  Step 1: Agreed Claims (Numbered List)
  We need to draft claims that both OV and IV can sign. These should cover:
  - When base rates are informative.
  - When case-specific details override base rates.
  - What responsible confidence requires in this context.

  Let me propose:

  1. Base rates derived from the historical completion patterns of similar academic books by junior faculty are informative and should be considered as a starting point for any prediction about project timelines.

  2. However, base rates are not deterministic and may be overridden by compelling case-specific evidence that indicates a particular project is an exception to the general pattern.

  3. Case-specific evidence must be detailed and causal (e.g., evidence about the author's work habits, project stage, and specific obstacles or supports) to have the potential to override base rates.

  4. Responsible confidence in project completion requires both:
     - A systematic review of the base rates and an acknowledgment of the uncertainty they imply (epistemic modesty).
     - A careful and unbiased assessment of the case-specific details.

  5. In this context, the junior colleague's own confidence is a relevant piece of evidence but must be weighed against known biases such as the planning fallacy.

  6. The department has a responsibility to balance the needs of the individual (including career development) with institutional resources and fairness to other faculty.

  Step 2: Residual Disagreements (Table)
  Now, we need to formulate disagreements. Each side should endorse the wording of their own position. We then identify the crux that could change at least one side's mind, and a concrete test or comparison case that both sides agree would bear on it, and record each side's prediction.

  Let me propose two or three disagreements:

  Disagreement 1: 
  - OV Position: Given the base rate of delays in academic book completion (e.g., 70% of similar projects are delayed), the department should assign a high probability to delay and be reluctant to grant an additional semester without strong evidence of exceptionality.
  - IV Position: The specific evidence about this author (her track record, the current state of the manuscript, and her detailed plan) is sufficiently compelling to override the base rate, so the department should grant the leave with high confidence in on-time completion.

  Crux: The key issue is whether the case-specific evidence is strong enough to override the base rate. Both sides agree that if the case-specific evidence is of a type that has historically been predictive of on-time completion (i.e., if similar evidence in past cases was associated with a high on-time rate), then it would be reasonable to override the base rate.

  Concrete Test: 
  - Review department records (or a broader academic database) of past junior faculty book projects that were at a similar stage (e.g., 80% draft complete) and had similar case-specific evidence (e.g., a detailed plan, a track record of meeting deadlines, and advisor endorsements). Calculate the on-time completion rate for these "similar evidence" cases.
  - OV Prediction: Even in this subset, the on-time completion rate will be less than 50%, indicating that case-specific evidence is not strong enough to override the base rate.
  - IV Prediction: The on-time completion rate in this subset will be above 80%, indicating that such evidence is highly predictive and thus overrides the base rate.

  Disagreement 2:
  - OV Position: The author's confidence is subject to the planning fallacy and optimism bias, which are well-documented, so it should be discounted heavily.
  - IV Position: While optimism bias exists, this author's confidence is based on a realistic assessment of the remaining work and her proven ability to meet deadlines in the past, so it should be taken at face value.

  Crux: The extent to which this author's past confidence in project timelines has been calibrated (i.e., whether she has been accurate in her past predictions).

  Concrete Test:
  - Examine the author's past project predictions (e.g., for previous chapters, articles, or other deadlines) and compare them to actual outcomes. Calculate the accuracy of her past predictions (e.g., the percentage of times she met her self-imposed deadlines).
  - OV Prediction: Her past predictions will show a pattern of overoptimism (e.g., she met deadlines less than 60% of the time).
  - IV Prediction: Her past predictions will show high accuracy (e.g., she met deadlines at least 80% of the time).

  Disagreement 3 (if needed, but two may suffice; let's do two for conciseness):
  Alternatively, we can have a third about the cost of delay.

  But let's stick to two.

  Now, we must present the table. Columns might be: 
  - Disagreement Number
  - Position (with labels for OV and IV)
  - Crux (what would resolve it)
  - Concrete Test / Comparison Case
  - OV Prediction
  - IV Prediction

  But note: the crux is the key point that, if settled, would move at least one side. The concrete test is the method to settle the crux.

  So:

  Table of Residual Disagreements:

  | Disagreement | Position | Crux | Concrete Test | OV Prediction | IV Prediction |
  |--------------|----------|------|--------------|---------------|--------------|
  | 1 | OV: Base rates indicate high probability of delay; leave should not be granted without strong evidence of exceptionality. <br> IV: Case-specific evidence is strong enough to override base rates; leave should be granted. | Whether case-specific evidence of the type presented (detailed plan, current manuscript state, author's track record) is reliably associated with on-time completion in similar past cases. | Review past junior faculty book projects in the department (or a comparable set) that had similar case-specific evidence (e.g., 80% draft complete, detailed plan, and positive advisor assessment). Calculate the on-time completion rate for these cases. | On-time completion rate in such cases is <=50%. | On-time completion rate in such cases is >=80%. |
  | 2 | OV: The author's confidence is subject to cognitive biases and should be heavily discounted. <br> IV: The author's confidence is well-calibrated based on her history and thus reliable. | Whether the author has a history of well-calibrated confidence (i.e., her past predictions about project completion were accurate). | Examine the author's past predictions for project milestones (e.g., chapter submissions, article revisions) and the actual outcomes. Calculate the percentage of times she met her predicted deadlines. | Her past deadline accuracy rate is <=60%. | Her past deadline accuracy rate is >=80%. |

  We can now draft the full response.

  Note: The joint statement should be in the form of a numbered list of agreed claims, then the table of disagreements.

  Let's write it.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Junior Colleague's Leave Request  
  **Participants:**  
  - **Outside View Advocate (OV):** Emphasizes base rates from historical data and epistemic modesty.  
  - **Inside View Advocate (IV):** Emphasizes causal details of the junior colleague's specific project and capabilities.  

  #### Agreed Claims (Numbered List)  
  Both parties endorse the following principles regarding the evaluation of the leave request:  

  1. **Base rates as foundational evidence:** Base rates of academic book completion (e.g., historical data on delays among junior faculty) are inherently informative and should serve as the initial benchmark for predictions. They provide a necessary guard against overconfidence by contextualizing individual cases within broader patterns.  
  2. **Overriding base rates with case-specific evidence:** Base rates may be overridden when case-specific causal details (e.g., the author’s work habits, manuscript progress, or external support) are sufficiently strong, unique, and well-documented to indicate a high likelihood of deviation from the norm.  
  3. **Necessity of causal granularity:** For case-specific details to override base rates, they must include objective, verifiable evidence (e.g., chapter drafts, timeline adherence history) rather than subjective assurances alone. Anecdotal or ambiguous details are insufficient.  
  4. **Responsible confidence requires integration:** Responsible confidence in the author’s on-time completion necessitates synthesizing both views: epistemic modesty (acknowledging base-rate-driven uncertainty) and causal analysis (evaluating project-specific drivers of success or failure).  
  5. **Author confidence as one factor:** The author’s self-assurance is a relevant but non-decisive input. It must be weighed against documented cognitive biases (e.g., the planning fallacy) and corroborated with tangible evidence (e.g., milestone completions).  
  6. **Departmental obligations:** The decision must balance support for the colleague’s career development with institutional resource constraints, fairness to peers, and the department’s scholarly reputation. Leave should only be granted if the probability of timely completion justifies the costs.  

  #### Table of Residual Disagreements  
  The parties disagree on key aspects of applying these principles to this case. Each position is worded as its advocate would endorse it. For each disagreement, we identify the crux (a point that, if resolved, could alter at least one advocate’s stance), a mutually agreed-upon test to resolve it, and predictions.  

  | # | Position (Endorsed by Advocate)                                                                                                                                 | Crux (What Would Change a View)                                                                                                | Concrete Test / Comparison Case                                                                                                                               | OV Prediction                                                                 | IV Prediction                                                                 |
  |---|------------------------------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------|-------------------------------------------------------------------------------|
  | 1 | **OV:** Base rates (e.g., 70% delay rate for similar first books) strongly favor skepticism; leave should be denied absent extraordinary evidence of exceptionality. <br> **IV:** Case-specific details (e.g., manuscript completeness, author’s discipline) decisively override base rates; leave should be granted. | Whether case-specific evidence of this type (e.g., detailed chapter drafts + advisor validation) historically predicts on-time completion when present. | Review 20 past department cases where junior faculty submitted comparable evidence (e.g., >75% draft completion, detailed chapter outlines, and advisor affirmations). Calculate the on-time completion rate in this subgroup. | ≤40% on-time rate (showing evidence is unreliable; base rates dominate).      | ≥80% on-time rate (showing evidence reliably overrides base rates).           |
  | 2 | **OV:** The author’s confidence is likely biased (e.g., by optimism or sunk-cost fallacy) and thus low-weight evidence. <br> **IV:** The author’s confidence is rationally grounded in her process (e.g., consistent drafting rate) and is high-weight evidence. | Whether the author’s past deadline predictions correlate with actual outcomes (indicating calibrated judgment).                | Audit 10–15 of the author’s past professional deadlines (e.g., article submissions, conference abstracts, grant reports). Calculate her prediction accuracy (% met within 1 month of forecast). | ≤50% accuracy (indicating chronic overoptimism; confidence is untrustworthy). | ≥85% accuracy (indicating well-calibrated confidence; trust is warranted).   |
  | 3 | **OV:** Resource risks (e.g., course coverage costs, precedent setting) outweigh uncertain benefits; denial is prudent. <br> **IV:** Project success benefits (e.g., tenure prospects, department prestige) outweigh risks; denial is overly conservative. | Whether granting leave in similar past cases yielded net positive departmental outcomes (e.g., timely book completion without resource strain). | Analyze 5–10 prior leave grants for junior faculty books in the department. Assess outcomes: (1) % completed on schedule, (2) impact on teaching coverage, (3) reputational effects via post-tenure reviews. | High costs (≥60% delayed; ≥50% course disruptions; net negative impact).     | Low costs (≥70% on-time; ≤20% disruptions; net reputational gain).           |

  **Methodology for Tests:**  
  - **Test 1:** Uses department archives to ensure comparability (e.g., projects at similar career stages). Both sides agree a ≥65% on-time rate would shift OV toward IV; ≤50% would shift IV toward OV.  
  - **Test 2:** Relies on the colleague’s employment records (e.g., email timelines, annual reviews). Both sides agree a 65–80% accuracy rate would moderate their positions.  
  - **Test 3:** Incorporates peer-department benchmarks to avoid insularity. Both sides agree reputational effects should be measured via post-publication citations or external reviews.  

  **Conclusion:**  
  This statement reflects consensus on principles but divergence in application. Resolving the cruxes via the proposed tests would aid the department in making an evidence-based decision. We recommend conducting Test 1 immediately, as it most directly addresses the core tension between base rates and case-specific details.
