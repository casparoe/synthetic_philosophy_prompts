prompt: |-
  As part of a metaethics workshop, I am organizing an adversarial collaboration between two philosophers who disagree about the wrong kind of reasons problem. One of them, call her the bifurcationist, holds that the distinction between the right kind and the wrong kind of reasons for an attitude — roughly, between considerations that bear on the attitude's correctness and considerations that bear on the benefits of having it — tracks a genuine normative joint, and that the WKR problem, though difficult to formulate precisely, cannot be dissolved by any unified theory of reasons. The other, call him the reductivist, holds that the WKR problem is an artifact of an overly narrow conception of reasons, and that a properly expansive account of normative reasons — one that takes all reasons to bear on the question of what to do, believe, or feel, without a primitive bifurcation — can handle the canonical cases without remainder.

  They have agreed to produce a joint document with the following structure.

  First, a numbered list of claims both can sign. These should include: agreement on the canonical cases that motivate the WKR problem (e.g., the demon who will punish you unless you admire him, the grant that depends on your believing the grantor's work is excellent); agreement on what a satisfactory account must explain — the data points, the intuitive judgments, the structural features of the cases; and agreement on which proposed solutions have been ruled out, or at least on what their shared desiderata rule out.

  Second, a disagreements table with the following columns: the precise statement of the disagreement, in wording each side would accept for its own position; why it matters — what downstream philosophical question turns on it; and whether either side suspects the disagreement is partly verbal, and if so, how they propose to test that.

  Third, a crux list: the sub-questions such that, if both sides came to agree on the answer, at least one side would change its view. For each crux, include a concrete case or argument both agree bears on it, each side's prediction about what the case or argument shows, and what each side would count as a serious concession — the thing they would have to give up if the other side's prediction held up.

  The document should be written so that both parties could sign it without reservation about the fairness of the presentation. It should not resolve the disagreement but should make it exact. Please draft this document.
reasoning: |-
  Okay, the user is organizing a metaethics workshop and wants me to draft a joint document for two philosophers with opposing views on the "wrong kind of reasons" (WKR) problem. This is quite a sophisticated philosophical task! 

  First, I need to understand the core disagreement: the bifurcationist believes there's a fundamental normative distinction between right-kind reasons (bearing on attitude correctness) and wrong-kind reasons (bearing on benefits), while the reductivist thinks this is artificial and advocates for a unified theory of reasons. 

  The user specified a very structured document with three parts: agreed claims, disagreements table, and crux list. I should make sure each section meets their requirements precisely. 

  For the agreed claims section, I'm listing canonical cases like the demon case and grant case that both sides accept as motivation for the WKR problem. I'm also including shared desiderata - what any solution must explain - and ruling out problematic approaches like primitive bifurcation or brute-force solutions. This establishes common ground.

  The disagreements table is tricky. I need to phrase each position in neutral terms both would accept. Column 1 states their core theses neutrally. Column 2 explains why it matters - for example, how it affects the normativity of rationality or the unity of normativity. Column 3 addresses verbal disputes - notably about "correctness" - and proposes testing through intuition probes about attitude-constituting norms.

  For the crux list, I'm identifying three key sub-questions: the nature of correctness conditions, the scope of rationality, and the possibility of reductive explanation. Each has a concrete test case, predictions from both sides, and what would count as concession. This makes the disagreement testable.

  Throughout, I'm maintaining strict neutrality - no favoring either position. The language stays precise but accessible for workshop participants. I'm avoiding technical jargon where possible, but some is unavoidable given the topic. 

  The user clearly knows metaethics well, so I don't need to oversimplify. But I should ensure the document facilitates productive debate - hence including "concession" criteria that force both sides to specify what would make them change their minds. That's often missing in philosophical disputes.

  I wonder if the user will want to add specific cases beyond the canonical ones. The document leaves room for that in the crux section. The tone stays formal but collaborative, matching the "adversarial collaboration" spirit.
answer: |-
  ## Joint Document: Bifurcationism vs. Reductivism on the Wrong Kind of Reasons Problem

  **Preamble:** This document represents a collaborative effort between the Bifurcationist ("B") and the Reductivist ("R"). It aims to precisely characterize our agreement, disagreement, and the crucial points ("cruxes") upon which our views turn, concerning the "Wrong Kind of Reasons" (WKR) problem in metaethics. We have worked diligently to ensure the presentation is fair and accurate to both positions. Signing indicates agreement *only* with the accuracy of this characterization, not with the opposing view.

  ### I. Points of Agreement (Signed by Both B & R)

  We agree on the following:

  1.  **Canonical Cases Motivate the Problem:** Certain cases reliably generate the intuition that there are "wrong kind" reasons for attitudes. These include:
      *   **The Evil Demon:** A powerful demon credibly threatens to inflict severe suffering unless you admire him. While you have a strong reason *to bring it about that you admire him*, the demon's threat does not seem like a reason that bears on whether the demon is genuinely *admirable*.
      *   **The Grant Case:** A foundation credibly offers a large, beneficial grant conditional on your believing that the grantor's philosophical work is excellent. While you have a strong reason *to bring it about that you believe this*, the grant offer does not seem like an epistemic reason bearing on the *truth* of the proposition about the grantor's work.
      *   **The Envy Case:** An eccentric benefactor credibly offers you a large sum of money if you envy a particular saintly and fortunate person. While you have a strong reason *to bring it about that you envy this person*, the monetary offer does not seem like a reason bearing on whether the person is genuinely *enviable* (i.e., possessing goods it's appropriate to resent them for having).

  2.  **The Core Phenomenon:** In these cases, there is a clear distinction between:
      *   Reasons that intuitively bear on the *correctness*, *fittingness*, or *merit* of the attitude itself (e.g., reasons bearing on admirability, truth, enviability). (B calls these the "right kind of reasons" (RKR); R calls them "correctness-constituting reasons" or "attitude-specific normative reasons").
      *   Reasons that intuitively provide incentives or disincentives *for having or bringing about* the attitude, but seem irrelevant to its correctness/fittingness/merit (e.g., threats, bribes, contingent benefits). (B calls these the "wrong kind of reasons" (WKR); R calls them "extrinsic practical reasons for attitude-regulation").

  3.  **Desiderata for a Satisfactory Account:** Any adequate solution to the WKR problem must:
      *   **Explain the Intuition:** Provide a principled account of *why* the reasons in the "wrong kind" column (threats, bribes) feel distinct from and inappropriate as direct determinants of the attitude's correctness/fittingness, despite being strong reasons *related* to the attitude.
      *   **Preserve Normative Significance:** Account for the genuine normative force of both types of consideration without implausibly dismissing the normative significance of either. The WKRs *are* real reasons for action (or attitude-regulation).
      *   **Avoid Overgeneration/Undergeneration:** Not classify clear correctness-reasons (e.g., evidence for truth, features of admirability) as WKRs, nor classify clear incentive-reasons (e.g., the demon's threat) as RKRs.
      *   **Provide a Principled Distinction (or Explain Its Absence):** Either provide a clear, non-ad-hoc criterion distinguishing the two kinds (B's goal), or explain convincingly why no such fundamental distinction exists and how the intuitions arise from other normative structures (R's goal).
      *   **Be General:** Apply to a range of attitudes (e.g., belief, intention, admiration, fear, envy, regret).

  4.  **Ruled Out (or Highly Problematic) Approaches:** Based on shared desiderata, we agree the following types of solutions are inadequate:
      *   **Brute Distinction:** Simply asserting the distinction as primitive without explanation fails desideratum 3 (Principled Distinction/Explanation of Absence).
      *   **Ignoring WKRs:** Dismissing WKRs as not genuine reasons fails desideratum 2 (Preserve Normative Significance).
      *   **Collapsing to RKRs:** Treating WKRs (like the demon's threat) as direct reasons *for the attitude itself* (e.g., a reason *to admire* the demon) fails desideratum 1 (Explain the Intuition) and 3 (Avoid Overgeneration).
      *   **Overly Narrow Conceptions of Correctness:** Defining correctness/fittingness in a way that *trivially* excludes WKRs (e.g., defining belief correctness *only* in terms of truth-conduciveness) without deeper justification risks circularity or failing desideratum 4 (Generality) for other attitudes.

  ### II. Disagreements Table

  | Statement of Disagreement (Neutral Wording)                                                                                                | Why it Matters (Downstream Consequences)                                                                                                   | Verbal Dispute? & Test                                                                                                                               |
  | :----------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Normative Joint:** Does the intuitive distinction between RKRs (correctness/fittingness reasons) and WKRs (incentive reasons) reflect a fundamental, irreducible distinction in the *nature of normative reasons*? | **Matters For:** The structure of normativity. Does normativity fundamentally bifurcate based on attitude-type? Implications for the unity of "reason", the normativity of rationality, and the relationship between reasons for attitudes and reasons for actions regulating them. | **B:** No. Intuitions track a real normative joint. **R:** Possibly. Core dispute is whether "correctness" refers to a primitive normative property (B) or a functional/constitutive role potentially reducible to broader reasons (R). **Test:** Probe intuitions about the *source* of correctness norms (e.g., "Is the fact that belief aims at truth a brute normative fact (B) or explicable by the functional role of belief within agency (R)?"). |
  | **2. Primitive Bifurcation:** Is a primitive distinction between two *kinds* of normative reasons (RKRs vs. WKRs) necessary to adequately explain the phenomena? | **Matters For:** Theoretical parsimony and explanatory power. Can a unified theory of reasons (all reasons bearing on the question "what to do/think/feel?") account for the data without positing a fundamental split? | **B:** Yes. Unified theories inevitably fail to capture the distinctive normative role of correctness. **R:** No. Primitive bifurcation is unnecessary and obscures the unified structure of practical rationality governing attitude-regulation. **Test:** Assess proposed unified accounts (R) vs. bifurcated accounts (B) against desiderata (esp. 1, 2, 3). Does unified account *explain* the felt distinction or merely explain it *away*? |
  | **3. Reductive Potential:** Can the normative significance of attitude correctness/fittingness be fully explained (reduced) in terms of a broader, unified theory of normative reasons governing what to do, think, and feel? | **Matters For:** Metaethical commitments. Does correctness require irreducible, attitude-specific normative facts (B), or can it be grounded in facts about agency, value, or constitutive aims within a unified normative framework (R)? Implications for naturalism, non-naturalism, and the scope of reductive explanations in normativity. | **B:** No. Correctness is a primitive normative property not reducible to other normative notions. **R:** Yes. Correctness is a functional/constitutive concept whose normative force derives from its role within a broader economy of reasons. **Test:** Evaluate success/failure of specific reductive proposals (R) to capture the *normative authority* of correctness without circularity or loss. Can R explain why correctness feels like a distinct *demand*? |

  ### III. Crux List

  1.  **Crux: The Nature of Correctness Conditions**
      *   **Question:** What is the source and nature of the norms governing the "correctness" or "fittingness" of an attitude (e.g., truth for belief, admirability for admiration)?
      *   **Test Case:** Consider *regret*. What makes regret correct/fitting? Is it (a) Primarily that the regretted event was genuinely bad *and* one was agentially involved (suggesting correctness is attitude-specific and primitive)? Or (b) That feeling regret serves a functional role (e.g., acknowledging responsibility, learning) and reasons for/against regret derive from reasons concerning whether fulfilling that role is good/all-things-considered supported (suggesting reducibility)?
      *   **B's Prediction & Concession:** Prediction: Intuitions strongly favor (a); regret feels fitting only for genuine agential misfortunes, regardless of functional benefits. Concession: If compelling arguments showed regret's correctness *wholly* derived from functional benefits assessed by unified reasons, B would reconsider the primitiveness of correctness.
      *   **R's Prediction & Concession:** Prediction: Analysis reveals (b) captures the normativity; reasons concerning the functional role (e.g., learning, reconciliation) ground when regret is "correct". Concession: If no plausible functional/constitutive account of correctness for core attitudes like belief or admiration could be given without relying on primitive normative correctness facts, R would concede the need for primitive bifurcation.

  2.  **Crux: The Scope of Rational Requirement**
      *   **Question:** Does rationality fundamentally require us to form attitudes *based on their correctness reasons (RKRs)*, or does it require us to be *responsive to all relevant normative reasons* bearing on what to do/think/feel, including WKRs understood as reasons for attitude-regulation?
      *   **Test Case:** **Modified Demon:** The demon credibly threatens to punish you *unless you form the belief that 2+2=5 based solely on the threat* (not on mathematical error). Are you rationally *required*, rationally *permitted*, or rationally *forbidden* to form this belief *for the threat reason*?
      *   **B's Prediction & Concession:** Prediction: You are rationally *forbidden* to form the belief for the threat reason; rationality requires basing belief *only* on truth-relevant (RKR) reasons. Forming it for the threat is akratic or irrational. Concession: If it became undeniable that rationality *requires* forming the belief in this case (due to the overwhelming reason to avoid punishment), B would concede a major point to reductivism.
      *   **R's Prediction & Concession:** Prediction: You are rationally *required* (or at least strongly rationally permitted) to form the belief. The overwhelming reason to avoid punishment makes forming the belief (via whatever reliable means, including self-manipulation) the rational thing to *do*, and forming the belief is part of that rational action. Concession: If clear consensus emerged that forming the belief *for the threat reason* is *always* paradigmatically irrational (akin to believing against overwhelming evidence), regardless of the practical stakes, R would concede the need for a distinct rational requirement tied solely to correctness.

  3.  **Crux: Reductive Explanation of the Intuition**
      *   **Question:** Can a unified theory provide a compelling, non-ad-hoc explanation for why WKRs *feel* distinct and inappropriate as *direct* reasons for the attitude, without appealing to a primitive difference in kind?
      *   **Test Case:** **The Envious Benefactor (Revisited):** The benefactor pays you to envy the saint. Why does the money feel like a "wrong kind" reason *for envy itself*, even though it's a good reason to *make yourself feel envy*?
      *   **B's Prediction & Concession:** Prediction: Unified accounts will either (i) fail to explain the distinct *phenomenology* of inappropriateness, (ii) explain it away as confusion, or (iii) covertly reintroduce a correctness standard. Concession: If R provided an explanation that convincingly derived the distinct phenomenology *entirely* from differences in the *practical structure* of responding to different types of reasons (e.g., reasons for action vs. reasons constitutive of the attitude's internal aim) within a unified framework, without residue, B would accept the reductivist solution.
      *   **R's Prediction & Concession:** Prediction: The "wrong kind" intuition arises because WKRs are reasons for *actions that cause or sustain the attitude*, not reasons whose acceptance *constitutively counts as* forming the attitude based on its correctness conditions. The feeling of inappropriateness reflects the *practical indirection* involved. Concession: If the intuition persists strongly even in cases where the WKR *directly* and non-manipulatively causes the attitude (e.g., a pill making you admire the demon instantly) *and* this is judged as normatively deficient *in the same way* as forming a belief against evidence, R would concede that a deeper, non-reducible distinction is needed.

