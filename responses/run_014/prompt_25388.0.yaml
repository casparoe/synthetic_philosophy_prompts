prompt: |-
  I'm a retired neuroscientist and I've been getting into philosophy of mind lately — reading Dennett, Frankish, Chalmers, the whole lot. My old lab partner (she does comparative cognition) has been humouring me with her verdicts on which creatures are phenomenally conscious. Here's what she's said so far:

  Conscious: humans, chimpanzees, dogs, octopuses, crows.
  Not conscious: salmon, honeybees, current large language models, a human in deep dreamless sleep, a human under propofol anesthesia.

  She's pretty consistant about it and she's clearly thought this through, but she's never spelled out the rule she's running. I can see at least two or three principles that fit her verdicts equally well. The new case I want to pin her down with: an artificial system that runs a global workspace architecture, maintains a self-model it uses for planning, and passes a battery of behavioral tests for flexible, domain-general learning — but it's running on silicon, no biology at all. What would she say, and why?

  I'd like your response in these sections:

  1. Candidate Rules (about 300 words): Lay out the two or three most plausible principles that fit her verdicts. Give each a name and state it clearly.

  2. What Each Rule Predicts (about 200 words): Apply each rule to the silicon global-workspace system. Say where they agree and where they diverge.

  3. Best Guess (about 200 words): Which rule do you think she's actually running, and why? What in her pattern of verdicts tips you off?

  4. The Decisive Case (about 150 words): Name one further case — real or invented — that would cleanly separate the leading candidate rules, and say what her answer would mean.

  Think carefully and reason step by step. Respond in the style of an expert philosopher of mind who's comfortable with the empirical details.
reasoning: |-
  Okay, the user is a retired neuroscientist diving into philosophy of mind, specifically interested in their lab partner's criteria for phenomenal consciousness in various entities. They've provided a list of creatures and systems their partner deems conscious or not, and they want to test a hypothetical AI system with a global workspace architecture. 

  Hmm, the user is clearly sophisticated - they're familiar with key thinkers (Dennett, Frankish, Chalmers) and the consciousness debate landscape. Their frustration is palpable though; they've spotted multiple consistent principles behind their colleague's judgments but can't pinpoint which one she operates by. The silicon global workspace case is their proposed litmus test.

  *scratches head* Let me unpack the partner's verdicts first. The conscious list includes mammals (humans/chimps/dogs), complex invertebrates (octopuses), and corvids (crows) - all known for behavioral flexibility and complex cognition. The non-conscious list has simpler vertebrates (salmon), insects (bees), digital systems (LLMs), and humans in unconscious states. Notably, biology seems necessary but not sufficient (since salmon/bees are out).

  *steeples fingers* Three principles emerge: Biological Naturalism (consciousness requires specific biological substrates), Adaptive Complexity (needs sophisticated information integration for survival), and Embodied Cognition (requires sensorimotor grounding in a body). Each fits the verdicts but diverges sharply on the silicon system.

  *checks notes* For the AI case: Biological Naturalism rejects it outright. Adaptive Complexity accepts it. Embodied Cognition is ambiguous but leans no unless the system has physical embodiment. The user's "why?" demand is crucial - they want the underlying rationale exposed.

  *nods* I think the partner leans toward Biological Naturalism. Why? Two clues: First, she excludes LLMs while fully acknowledging their behavioral complexity. Second, she includes octopuses/crows whose neural architectures differ radically from mammals - suggesting shared biology matters more than computational similarity. Her anesthesia/dreamless sleep examples also highlight biological state changes.

  *lights bulb* The decisive test? A biological system with global workspace architecture but minimal behavioral complexity - say, a genetically engineered mouse with human-derived global workspace neurons but limited cognition. Biological Naturalism says conscious; Adaptive Complexity says not. That'd force the issue.

  *adjusts glasses* The user's deeper aim seems to be probing whether their colleague is a biological chauvinist. By designing cases that decouple behavior from substrate, they're testing if she truly believes consciousness could be non-biological. Smart move - this cuts to the heart of the hard problem.
answer: |-
  ### 1. Candidate Rules (300 words)  
  Based on the verdicts, three principles fit the data consistently:  

  **a. Biological Naturalism (BN)**  
  *Consciousness requires specific biological substrates.* Phenomenal consciousness emerges only from evolved neurobiological systems with particular structural/functional properties (e.g., vertebrate/invertebrate brains with recurrent processing, neuromodulation). Silicon, being non-biological, cannot support subjective experience regardless of functional equivalence.  

  **b. Adaptive Complexity (AC)**  
  *Consciousness arises in systems capable of domain-general learning, environmental flexibility, and self-modeling for adaptive problem-solving.* This focuses on computational capabilities: integrating multimodal information into a global workspace, generating flexible responses to novel challenges, and maintaining a self-representation for planning ("what it's like" to navigate uncertainty). Biology is incidental but correlates with complexity.  

  **c. Embodied Cognition (EC)**  
  *Consciousness depends on sensorimotor embodiment and ecological embeddedness.* Phenomenality requires being a situated agent navigating a physical world via a body (e.g., vertebrates/invertebrates with sensory organs and motility). Passive data processors (LLMs) or biologically inert systems (anesthetized brain) lack the feedback loops of embodied action-perception cycles.  

  *All three rules exclude salmon (limited behavioral flexibility), honeybees (domain-specific cognition), current LLMs (no self-model/embodiment), and unconscious humans (loss of global access/embodiment). All include mammals, birds, and cephalopods due to advanced cognition and embodiment.*

  ---

  ### 2. What Each Rule Predicts (200 words)  
  For the **silicon global workspace (Si-GW) system**:  
  - **Biological Naturalism (BN)**: *Not conscious.* Silicon lacks biological "hardware" (e.g., protein signaling, neuromodulators) deemed essential for subjective experience.  
  - **Adaptive Complexity (AC)**: *Conscious.* The system meets all functional criteria: global information integration, self-modeling for planning, and domain-general learning. Substrate is irrelevant.  
  - **Embodied Cognition (EC)**: *Not conscious* (unless physically embodied). Without a body interacting dynamically with an environment (e.g., robotic actuators/sensors), it remains a disembodied planner, akin to an LLM.  

  *Agreement*: BN and EC both reject Si-GW consciousness, while AC accepts it.  
  *Divergence*: BN and EC differ in rationale (biology vs. embodiment). If the Si-GW controlled a robot (embodied), EC *might* accept it, but BN would still reject it. AC remains substrate-agnostic.  

  ---

  ### 3. Best Guess (200 words)  
  I suspect she operates on **Biological Naturalism (BN)**. Key evidence:  
  - **Exclusion of LLMs despite functional sophistication**: She dismisses even advanced AI, implying that non-biological systems are categorically excluded, not just functionally deficient.  
  - **Inclusion of phylogenetically diverse biological systems**: Octopuses (decentralized cognition) and crows (non-mammalian) share no unique computational architecture with humans, but all possess complex neurobiology. Her verdicts align with biological continuity, not just behavioral complexity.  
  - **Treatment of unconscious states**: Propofol and dreamless sleep disrupt biological processes (e.g., neural integration), not just cognition. This prioritizes biological mechanisms over functional output.  

  *Why not AC?* She excludes honeybees, which show domain-general learning (e.g., symbolic reasoning). If AC were primary, bees might qualify. BN better explains their exclusion: their neural architecture lacks vertebrate/invertebrate complexity.  
  *Why not EC?* LLMs or unembodied Si-GW could theoretically control a body, yet she preemptively rejects "current LLMs" – suggesting biology, not just embodiment, is key.  

  ---

  ### 4. The Decisive Case (150 words)  
  **Case**: A genetically engineered mouse with a simplified, *non*-adaptive global workspace. Its brain has human-derived global workspace neurons but only performs rigid, insect-like behaviors (e.g., fixed action patterns).  

  - **Biological Naturalism (BN)**: *Conscious*. Biological substrate is preserved, regardless of reduced cognition.  
  - **Adaptive Complexity (AC)**: *Not conscious*. Lacks domain-general learning/planning.  
  - **Embodied Cognition (EC)**: *Ambiguous* – embodied but minimally cognitive.  

  **Her verdict's implication**:  
  If she calls it *conscious*, BN is confirmed (biology is sufficient).  
  If she calls it *not conscious*, AC/EC is favored (function/embodiment matters more).  
  *This dissociates biology from function*, isolating her core principle. Given her pattern, I predict she’d call it conscious – affirming BN.
