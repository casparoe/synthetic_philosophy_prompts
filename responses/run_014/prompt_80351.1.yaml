prompt: |-
  So I got into a long argument last night with my roommate about Borges, and I dont think he was right. His take is that "The Garden of Forking Paths" is basically the many-worlds interpretation of quantum mechanics in story form. I pushed back, and here's my position: the story's conception of time (the 1941 story, first published as its own one-story collection and then republished in Ficciones in 1944) is closer to the relative state formulation Hugh Everett laid out in 1957 than to the many-worlds picture as it's usually told. In the story there isn't a bundle of parallel universes that split off and live seperately; there's one continuous time that is itself labyrinthine, with paths that diverge, converge, and cross. A big part of the reason people connect Borges to Everett at all is that DeWitt himself drew the parallel in the preface to his 1971 book, after which the many-worlds label stuck, so I think the usual reading is a 1970s retrofit. Can you compare Borges's conception of time in that story with Everett's 1957 relative state formulation on three axes: (a) whether the branching is fundamental or emergent, (b) whether the branches interact or merely correlate, and (c) whether there's a single underlying entity whose state is relative to the observer? And one specific thing: in the story the ancestor's letter says he leaves the garden of forking paths to "several futures (not to all)" — is that "not to all" detail a real difference between Borges's time and Everett's, or just a plot device? Keep the whole thing under 350 words, and don't hedge: pick a side in my argument and say why.
