prompt: |-
  I'm doing a history project on my town in the 1920s and I spent a day in the county record office and now I'm a bit confused about what any of it actually means. The way the place works is: the official stuff — council minutes, court files, rate books — is there because the law says the departments have to send it, but everything else, like photos, diaries and shop ledgers, only exists there if someone donated it, and the community shelf is basically the same five families' photo albums. There's also a waiting period before recent files come out, so anything from the last couple of decades is off limits. The wierdest bit for me: the catalog is written by the archivists using the same headings as the people who made the records, so I could find "domestic servants" listed in a household's accounts, but there was no way to search for a servant's own life. My teacher keeps saying "the sources just are what they are" as if that settles it. But does the whole setup presuppose that the past is whatever got filed, and that the state is the natural witness? What does it rule out, and what would an archive look like if it didn't assume that?

  Can you do it in these sections in this order: "The practice, restated" (a short one, just making sure we're describing the same thing), "The theory it presupposes" (the main bit, maybe 2-3 paragraphs), "What it quietly rules out" (a paragraph or so), "Where it contradicts itself" (a paragraph), and "What would have to change" (a final paragraph, keep it concrete).
