prompt: |-
  A competent adult can sign an advance directive stating that, should they later lose the capacity to decide -- for example, from advanced dementia -- their life support is to be withdrawn. When that crisis arrives the patient usually can no longer confirm or withdraw the directive, yet physicians and surrogates are expected to carry it out as though it were the patient's own present decision. The practice is strikingly asymmetric: a competent person may revoke a directive at any moment, so the present self outranks the past one, but an incapacitated person may do no such thing, so the past self outranks the present one -- authority tracks competence, not time. What view of the self over time does that practice presuppose? Does it commit us to the claim that one person persists through large psychological change and that the earlier, competent self retains authority over the later, altered one? Reconstruct the implicit theory of diachronic authority the practice rests on, say which rival views of personal identity or of reasons it quietly rules out, mark where the practice is underdetermined and could be licensed by more than one theory, and describe what would have to change in how we treat advance directives if we rejected the assumption that the earlier self outranks the later one.
reasoning: |-
  Hmm, the user is asking about advance directives and what they imply about our view of the self over time. They've presented an interesting asymmetry: when competent, you can revoke an advance directive at any time (present self overrules past self), but once incapacitated, the past self's directive binds the present self. They want to know what theory of personal identity or authority this presupposes.

  The asymmetry is indeed striking. The practice seems to treat the competent self as having authority regardless of when it existed. This raises philosophical questions about persistence through change - does the person remain the same through dementia? And who gets to decide for whom?

  I think the core presupposition is that personal identity persists despite psychological changes. The law and medical ethics operate on this assumption - we treat the dementia patient as the same person who signed the directive. The practice also assumes rational authority is tied to competence - only competent selves get to decide.

  This view contrasts with several philosophical positions. Psychological reductionists like Parfit might argue that severe dementia creates a different person, making the directive inapplicable. Narrative identity theorists would focus on whether the directive fits the person's life story. And present-oriented theories would privilege the current self's interests.

  The practice is underdetermined in some areas. It doesn't specify how much psychological change is too much, or how to handle cases where the directive clashes with the current self's apparent preferences. Different theories could justify the same practice - Locke's psychological continuity view supports it, but so might a Kantian view emphasizing autonomy as a rational capacity.

  If we rejected the past self's authority, everything would change. Advance directives might become advisory rather than binding. We'd prioritize current well-being over past instructions. Surrogates might make decisions based on substituted judgment or best interests without being constrained by the directive. This could respect the altered self but potentially undermine autonomy.

  I should also note that in practice, many jurisdictions require clear evidence that the directive applies to the current situation, and some allow surrogates to override if circumstances have changed dramatically. The philosophical assumptions aren't always absolute in real-world application.
answer: |-
  The practice of honoring advance directives rests on a specific **theory of diachronic authority and personal identity**, with clear philosophical commitments and exclusions. Here's a reconstruction:

  ### Implicit Theory of Diachronic Authority
  1. **Persisting Personal Identity**: The practice presupposes that the person who signed the directive *remains numerically identical* to the incapacitated patient, despite radical psychological discontinuity (e.g., dementia). Identity is grounded in biological continuity or a minimal "human organism" view, not psychological connectedness.  
  2. **Authority Tied to Competence**: Moral/legal authority resides exclusively in competent versions of the self. The *competent past self* retains decision-making priority over the *incompetent present self* because:  
     - Competence enables rational autonomy (the capacity to make binding commitments).  
     - Incompetence voids the present self's moral standing as a decision-maker.  
  3. **Temporal Neutrality**: The directive is treated as an extension of the person's *enduring autonomous will*. Time itself is irrelevant; what matters is the *competence-status* at the moment of decision-making.  

  ### Rival Views Ruled Out
  The practice **quietly excludes**:  
  - **Parfitian Reductionism**: If identity is reduced to psychological connectedness (Parfit), severe dementia may create a "new person" for whom the directive lacks force. The practice assumes identity persists *despite* psychological rupture.  
  - **Present-Oriented Theories**: Views prioritizing the current self's preferences (e.g., "experiential interests" of the demented patient) are overruled. The practice dismisses the present self’s apparent will (e.g., a dementia patient seeming content) as non-authoritative.  
  - **Narrative Identity Views**: If personhood depends on an ongoing narrative thread (MacIntyre, Schechtman), advanced dementia’s disruption of autobiographical memory could invalidate the past self's authority. The practice assumes no such narrative continuity is necessary.  
  - **Consequentialist Approaches**: Pure well-being considerations (e.g., maximizing the present self’s comfort) are subordinated to the past self’s instructions, even if contrary.  

  ### Underdetermined Aspects
  The practice **could be licensed by multiple theories**:  
  - **Lockean Internalism**: If identity requires psychological continuity (Locke), one could argue the directive binds *if* the past self anticipated future states (e.g., via "precedent autonomy").  
  - **Kantian Autonomy**: The competent self’s directive embodies rational agency, creating a moral obligation to honor it as a categorical imperative, regardless of later incapacity.  
  - **Biological Identity Theories**: Even without psychological continuity, the same human organism persists, justifying the binding force of prior directives.  

  ### Rejecting Past-Self Authority: Implications
  If we denied the past self’s priority:  
  1. **Directives Become Advisory**: Surrogates/physicians would weigh the directive against the *current self’s observable interests* (e.g., signs of well-being in dementia).  
  2. **Shift to Substituted Judgment**: Decisions would prioritize inferring what the *present self* would want if competent, based on *current* preferences or values (e.g., joy in simple activities).  
  3. **Best Interests Standard**: Without binding directives, care would default to maximizing the present self’s welfare, potentially extending life-sustaining treatment against prior wishes.  
  4. **Revocation by Proxy**: Surrogates could "revoke" directives if the present self exhibits contrary preferences (e.g., resisting treatment withdrawal).  
  5. **Temporal Limitation**: Directives might expire after significant psychological change or require periodic reaffirmation.  

  ### Conclusion
  The practice presupposes a **competence-based hierarchical self**: the competent self (whenever it exists) holds sovereign authority over incompetent future selves. This commits to a view of personal identity as *biologically persistent* and morally agency as *contingent on rationality*. Rejecting this hierarchy would dissolve the binding power of advance directives, replacing them with fluid, present-centered decision-making—prioritizing the lived experience of the current self over the abstract autonomy of the past.
