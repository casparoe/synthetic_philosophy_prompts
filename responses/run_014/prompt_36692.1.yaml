answer: |-
  Here’s the philosophical framework of valid consent translated into your novelist’s vocabulary, followed by the residue report:

  ### The Philosopher's Consent Framework (Novelist's Translation)
  1.  **Character Competence (The Competence Condition):**
      *   **What it means:** The character must be in a state to truly *own* their choice. This isn't about intelligence, but about their capacity for self-authorship *in that moment*. Is their inner compass functioning? Are they flooded by grief, clouded by delusion, lost in mania, or numbed by substances to the point where their "yes" feels like it's coming from somewhere *other* than their core self? If their internal monologue is shattered or their perception of reality is fundamentally warped, their consent lacks the necessary anchor in their own will.
      *   **Your Tool:** Interiority, showing the disconnection or instability. Does the reader feel the character *isn't* steering?

  2.  **The Reader Knows What the Character Doesn't? (The Information Requirement):**
      *   **What it means:** The character must grasp the *essential nature* of what they're agreeing to. This isn't about every detail, but the fundamental stakes.
      *   **Crucial Distinction (Bypassing the Will vs. Making it Appealing):**
          *   **Lie about the Act Itself (Bypasses Will):** If the character is deceived about the *core reality* of the action ("I'm proposing as John Smith" when they're really Lord Blackwood heir; "This is medical treatment" when it's experimentation), their "yes" is attached to a phantom act. It's not consent *to the thing that happens*. The reader sees the character stepping onto a trapdoor disguised as solid ground.
          *   **Lie/Omission about Attractive Circumstances:** If the character knows the core act (e.g., marrying "John Smith," accepting the inheritance) but is deceived about *why* it's desirable (John's true wealth/identity, the inheritance's hidden poisonous clause), the consent is flawed but *exists*. It's consent to the *act*, just under false pretenses. The reader sees the character choosing the path, but based on a distorted map. Their will is *misdirected*, not bypassed.
      *   **Your Tools:** Dramatic irony (reader knows the truth the character lacks), unreliable narration (if the *character* is self-deceiving about the nature of the act), stakes (how big is the gap between what the character thinks they're getting and the reality?).

  3.  **Was the "Yes" Truly Theirs? (The Non-Coercion Condition):**
      *   **What it means:** The character must feel they have a meaningful choice *they* can author. Was the "yes" squeezed out of them?
      *   **Crucial Distinction (Offer vs. Threat):**
          *   **Offer (Widens Options):** "Marry me, and I'll fund your art school." This adds a new, positive path the character *can* freely choose. Even if life is hard, this improves their landscape.
          *   **Threat (Narrows Options):** "Marry me, or I'll ruin your father." This takes existing, baseline options *away* (financial security, father's reputation). The character feels backed into a corner; their "choice" is defense, not authorship.
      *   **The Hard Case (Created Desperation):** The villain who bankrupts the family *then* offers the inheritance/loan with strings? Philosophically, this often blurs into a threat. By creating the desperation, they've *already* narrowed the character's baseline options. The "offer" isn't truly making things better *from the original state*, but offering an escape *from the harm they inflicted*. The character's "yes" feels like grabbing a lifeline thrown by the person who pushed them overboard. The reader feels the trap closing.
      *   **Your Tools:** Showing stakes, interiority (the character's feeling of pressure, panic, trapped-ness), point of view (does the *character* perceive it as an offer or a threat? Does the *reader*, with more context, see it differently?).

  4.  **Flawed Consent vs. No Consent (The Validity Distinction):**
      *   **No Consent (Invalid):** The "yes" is attached to a phantom act (deception about the nature) OR comes from someone fundamentally incapable of owning a choice (deep incompetence) OR is purely a scream under direct, overwhelming duress ("Hand over the money or I shoot!"). There is no meaningful "yes" *to the actual thing happening*. It's a legal/moral nullity.
      *   **Flawed Consent (Wrong but Exists):** The character chooses the *actual act* but with crucial misunderstandings (lies about attractive circumstances) or under significant, manipulative pressure (exploiting grief, manufactured desperation, emotional blackmail). The "yes" *exists* but is tainted. The act might still be wrong because it exploits vulnerability or deception, but it's not the same as *no consent*. The character bears *some* ownership, however compromised.
      *   **Your Tool:** This is core to your question about a character's "yes" feeling authored *by them* or *by the situation/scene-setter*. Does the reader feel the character truly chose *this path*, even if under bad info/pressure (flawed consent), or was the choice an illusion (no consent)?

  ### Residue Report: Philosophy vs. Novelist's Toolkit

  1.  **Distinctions Captured Well:**
      *   **Bypassing Will vs. Misdirecting Will (Deception):** Your tools are *excellent* here. Dramatic irony directly exposes lies about the nature of the act (reader sees the trapdoor). Showing a character acting on incomplete or falsely attractive information explores misdirection. You can vividly portray the difference between consenting to *the wrong thing entirely* vs. consenting to *the right thing for the wrong reasons*.
      *   **Flawed Consent vs. No Consent:** This is the *heart* of your craft – showing agency, its absence, or its distortion. Interiority, POV, and the "weight" of a character's choice are your primary instruments. Readers instinctively feel the difference between a coerced "yes" and a non-existent one.
      *   **Character Competence:** Interiority is key. You can show the fractured self, the overwhelming fog, the detachment that signals a character isn't truly "in command" of their choice.

  2.  **Distinctions with Friction/Partial Expression:**
      *   **Offer vs. Threat (Especially Created Desperation):** Your toolkit *shows* the pressure and the character's feeling of constraint beautifully. However, the philosophical line between "This makes your bad situation better (offer)" and "This saves you from the bad situation *I made* (threat)" is a subtle *interpretive* distinction. You can depict the *history* (the villain creating the desperation) and the *character's experience*, but the *categorization* itself is an analytical layer readers may or may not explicitly engage with. Your tools reveal the *dynamics* (power imbalance, exploitation) that lead philosophy to call it a threat, rather than labeling it directly.
      *   **Sufficiency of Information:** You brilliantly show *what* the character knows and doesn't know. The philosophical question ("Was it *enough* core information?") is often a judgment call. Your narrative shows the *gap* and its *impact* on the character's decision; whether it crosses the line to invalidate consent entirely (bypassing the will) is often left to the reader's ethical sense, informed by your portrayal. The toolkit reveals the *situation*, not always an absolute verdict.

  3.  **Residue & Implications:**
      *   **Missing Philosopher Insight?** The main potential gap is the *explicit framework* for analyzing "created desperation" as coercive. While you *show* the villain's machinations and the character's entrapment, the philosophical *conclusion* that this constitutes a threat (narrowing options) rather than an offer is a specific analytical lens. Your toolkit might not inherently *label* it this way, though it powerfully *demonstrates* why it functions that way.
      *   **Philosophy's Lack of Clarity?** The residue confirms that philosophy *strives* for bright lines (invalid vs. flawed; threat vs. offer; bypass vs. misdirect) but often relies on nuanced interpretations of context, intention, and impact – precisely the terrain where fiction thrives. Your toolkit exposes the *messiness* that philosophical categories sometimes struggle to contain neatly:
          *   **Competence is Fluid:** Philosophy wants binary (competent/incompetent), but fiction shows gradients (grief impairing judgment, suggestibility exploited).
          *   **Pressure is Multifaceted:** Distinguishing coercion from "mere" persuasion or intense desire is often clearer in theory than in the complex emotional landscapes you depict.
          *   **"Essential Nature" is Subjective:** Defining the absolute core of an act (marriage vs. marriage *to this specific person with this secret*) can be debatable; fiction explores the character's *perception* of what's essential.
      *   **Your Toolkit's Strength:** It captures the *lived experience* of consent and its violations – the interior feeling of agency or its absence, the dramatic weight of hidden truths, the palpable pressure of circumstance. It shows *why* a "yes" might feel hollow or coerced, often more viscerally than philosophical categories can dictate.
      *   **Conclusion:** Your novelist's vocabulary isn't *missing* the core philosophical distinctions; it *embodies* them dramatically. The "residue" isn't so much a lack in your tools, but the inherent complexity of human choice that philosophy tries to categorize and fiction excels at portraying in all its ambiguous, contradictory, and pressured reality. The philosophical framework provides a useful analytical grid, but your toolkit reveals the human texture within (and sometimes overflowing) its boxes. Your focus on whether the "yes" feels authored by the character or the scene captures the *essence* of the consent question, even if it doesn't always map perfectly onto every philosophical sub-distinction. The framework is a useful map; your writing is the journey through the actual, messy terrain.
