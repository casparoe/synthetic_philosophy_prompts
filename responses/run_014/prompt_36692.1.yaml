  Hmm, the coffin confession example is telling - they're wrestling with how pressure interacts with authenticity. As a novelist, they likely care more about how consent *feels* on the page than abstract ethics. The inheritance scenario suggests interest in blurred lines (was the suggestible character truly free?).

  The residue analysis is where it gets juicy. Philosophers draw bright lines where literature sees gradients. Take competence: while ethics might say "this person lacks capacity," fiction shows competence as fluid - that grieving widow might be coherent yet swayed by vulnerability. 

  Biggest gap seems to be in the coercion/threat distinction. Novelists show power dynamics organically through context (that inheritance scene implies lifelong manipulation), while philosophy categorizes. But fiction's tools - like making a "yes" feel hollow through subtext - might actually capture more complexity than philosophical binaries.

  The deception distinction translates well though. When a character lies about their identity during a proposal (the alias scenario), that's clearly crossing a will-bypassing line - easy to show via dramatic irony. But nondisclosure? That's murkier terrain where fiction shines, like when readers know financial secrets the love-confessing character doesn't.

