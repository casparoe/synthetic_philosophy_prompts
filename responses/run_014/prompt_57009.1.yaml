prompt: |-
  I cover science and ideas, and I'm working on a piece about what biography can actually do for a reader morally — not the sentimental version, but whether there is a coherent mechanism behind the claim. The clearest statement of Plutarch's own is at the opening of the Life of Aemilius Paulinus (Loeb edition, trans. Perrin):

  "I began the writing of my 'Lives' for the sake of others, but I find that I am continuing the work and delighting in it now for my own sake also, using history as a mirror and endeavouring in a manner to fashion and adorn my life in conformity with the virtues therein depicted. For the result is like nothing else than daily living and associating together, when I receive and welcome each subject of my history in turn as my guest, so to speak, and observe carefully 'how large he was and of what mien,' and select from his career what is most important and most beautiful to know."

  A few sections later he describes the effect quite differently: keeping the records of the noblest characters in his soul lets him repel whatever base or ignoble suggestion his enforced associations intrude upon him, turning his thoughts away to the fairest of his examples. And in the opening of the Life of Alexander he makes his methodological claim — that he writes lives rather than histories because the most glorious deeds do not always disclose virtue or vice, whereas a trifling act, a phrase, or a jest often reveals character better than battles in which thousands fall.

  My difficulty: does the mirror image commit him to imitation? If it does, it sits badly with the small-signs method, since a jest or an unguarded remark is diagnostic precisely because it was not chosen, and what is not chosen cannot be the thing the reader copies. Tell me what the mirror passage actually commits him to, whether the guest-and-associating language and the repelling language point to a mechanism other than imitation, and whether that dissolves the conflict with Alexander or merely relocates it. I want a definite answer with your reasons, not a survey of the options — and please flag anywhere you are leaning on a reading of the Greek or of Plutarch's project that specialists would contest. Lead with your bottom line in the first sentence, then the reasoning; no preamble and no restating the question.
reasoning: |-
  Okay, the user is working on a piece about the moral value of biography, specifically focusing on Plutarch's claims. They're wrestling with a contradiction: Plutarch talks about using lives as a mirror to imitate virtues, but he also says small, unchosen actions reveal character best. The user wants to know if the mirror metaphor commits Plutarch to imitation and how that fits with the small-signs method.

  First, I need to tackle the core conflict. The mirror passage in Aemilius Paulus suggests Plutarch sees biography as a way to shape one's life by emulating virtues. But the Alexander passage emphasizes that small, unchosen acts are better indicators of character than grand deeds. How can someone imitate something that wasn't a conscious choice?

  The key here is understanding what Plutarch means by "imitation." It's not about copying specific actions, like a particular jest or remark. Instead, it's about internalizing the virtues those actions reveal. For example, a spontaneous jest might show Alexander's sharp wit or humility. The reader isn't meant to repeat that exact joke but to cultivate the underlying virtue. So the diagnostic small signs serve to identify the virtues to emulate, not the actions themselves.

  Next, the user mentions two other metaphors: associating with guests and repelling base thoughts. The guest metaphor suggests a deeper engagement, like learning from a mentor through observation. The repelling mechanism is about using these virtuous examples as mental guards against vice. Both support the idea that the process is about character formation through exposure, not mere imitation.

  Specialists might debate whether Plutarch's approach is about moral emulation or just historical insight. But I think his explicit statements in the texts support the moral purpose. Also, the Greek term for "fashion and adorn" (kosmein) implies an active shaping of one's character, aligning with virtue ethics.

  The resolution is that the small signs reveal virtues to emulate, not actions to copy. This dissolves the conflict because the unchosen acts are windows into character, providing the raw material for shaping one's virtues. So the mechanisms—mirror, guest, repelling—all point to character formation through reflective engagement, not literal imitation.
answer: |-
  **Plutarch's mirror passage commits him not to literal imitation of actions, but to the emulation of revealed character virtues, a mechanism dissolved by the "small-signs" method which provides the very material for discerning those virtues.** Here's why:

  1.  **The "Mirror" Demands Discernment, Not Copying:** Plutarch explicitly states he aims to "fashion and adorn my life *in conformity with the virtues* therein depicted" (emphasis added). The mirror reflects *character* (virtues/vices), not specific deeds for replication. He observes "how large he was and of what mien" – assessing the subject's *moral stature and disposition*. The goal is conformation to the *virtues revealed*, not the deeds themselves. The small signs (jest, phrase) are the diagnostic tools Plutarch (and the reader) uses to accurately discern the *true underlying character and virtues* worthy of emulation (or avoidance).

  2.  **"Guest-and-Associating" Deepens Character Insight:** Framing the subjects as "guests" with whom he "associates" daily emphasizes prolonged, intimate acquaintance. This mechanism is about *internalization through familiarity*. Close observation over time allows for a deeper understanding of the subject's *stable character traits* beyond isolated grand (or small) actions. It fosters a relationship where the subject's *overall virtue* becomes a living presence in the reader's mind, a model for ethical orientation rather than a script for action.

  3.  **"Repelling" Leverages Internalized Exemplars:** The mechanism described later – using the "records of the noblest characters" to "repel" base suggestions – relies entirely on the *internalized moral presence* achieved through the "guest-and-associate" process. The virtuous exemplar, fully apprehended (often *via* those small signs revealing true character), becomes a cognitive and moral resource. When faced with temptation or negative influence, the reader *turns their thoughts* to this internalized ideal, contrasting its nobility with the baseness of the present suggestion, thereby strengthening resolve. This is character armor built from absorbed virtue, not imitation of specific historical acts.

  4.  **Resolution of the "Small-Signs" Conflict:** The apparent conflict vanishes because the "small-signs" method is *essential* to the mechanism Plutarch describes. Literal imitation *would* be impossible and nonsensical for unchosen jests or remarks. However, these signs are invaluable precisely because they *uniquely reveal the authentic, unchosen character* Plutarch seeks to reflect in his mirror. They provide the raw, credible evidence *for* the virtues the reader is meant to discern, internalize through "association," conform to, and use as a shield ("repelling"). The small signs diagnose the character; the mirror reflects it; association internalizes it; repelling utilizes it. The small signs enable, rather than contradict, Plutarch's moral project.

  **Specialist Caveats:**
  *   Some scholars (e.g., Duff, Pelling) emphasize Plutarch's focus on the *reader's active moral reasoning* triggered by the Lives, arguing he presents complex, sometimes flawed figures to provoke judgment, not simple emulation. My reading incorporates this – discernment of virtue is key.
  *   The interpretation of *kosmein* ("adorn") could be debated; does it imply superficial shaping or profound ethical formation? The context of "fashion... in conformity with the virtues" and the repelling mechanism strongly supports the latter.
  *   While Plutarch states his *personal* moral aim clearly, scholars debate the extent to which he expected *all* readers to engage this deeply. His opening ("for the sake of others") suggests he hoped they would. My analysis focuses on the coherent mechanism *he* describes for achieving this moral effect.
