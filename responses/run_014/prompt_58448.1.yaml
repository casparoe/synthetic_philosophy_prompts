  The core challenge is translating: victor's justice → selective enforcement, retroactive laws → new handbook rules, and crimes against humanity → extreme cheating. Their example about junior phone cheating with post-facto AI rules and football player immunity is perfect. 

  Hmm, the tricky parts will be:
  - "Crimes against peace" (starting wars) has no school equivalent - maybe "disrupting the whole school schedule"?
  - The scale difference: school punishments vs death penalties. But since they're focused on fairness principles, we can sidestep severity.
  - The "allies did bad things too" argument → teachers helping cheaters becoming judges. That's actually a sharp parallel.

  For the residue report: 
  What works perfectly: selective enforcement (athlete favoritism = victor's justice), ex post facto rules (new handbook after cheating). 
  What's stretched: Aggressive war as "coordinated cheating disrupting school" feels weak but serviceable. 
  What's missing entirely: The global legitimacy angle - there's no "UN" in school discipline. But that's okay because their essay seems focused on fairness critiques.

  Smart kid - they're using what they know (school hierarchy) to scaffold new knowledge (international law). Their self-awareness about "knowing detention better than tribunals" shows great metacognition. Friday deadline means I should keep this practical. 

