prompt: |-
  ok so im 17 and a junior and we just did a unit on the trials after WWII in Nuremberg and Tokyo and my teacher kept talking about two big criticisms, like that they were victors justice cause only the losers got punished and that they used retroactive law cause they punished stuff that wasnt technically a crime when it was done, and then the defenses like it was still fair cause everyone knew it was wrong and they had to do something new to stop it happening again

  i kinda get it but not really, and i know way more about how discipline works at my school than about international law tbh. like handbook rules, detention vs suspension, honor council hearings run by seniors and a teacher, the principal making a new rule mid-year, selective enforcement when athletes get off easier, that whole world.

  so can you restate both sides of that debate, the critics and the defenders, using only my school discipline vocabulary as much as possible. like translate crimes against peace and crimes against humanity and the no punishment without a pre-existing law idea and the what about what you guys did too arguement into handbook and honor council stuff. to make it concrete use this made up example from my school: imagine a bunch of juniors do this coordinated phone cheating thing during finals, then over the summer the principal writes a brand new cheating with AI rule and in the fall the school holds a big honor council trial for those juniors but not for the football players who definately did the exact same thing, plus teachers who helped share answers end up as judges not defendants.

  then give me a residue report or whatever, like what parts translated cleanly, what parts you had to stretch or fudge to fit into school language, and what parts just have no version in school world at all. and tell me if that leftover stuff means my school analogy is missing something important or if it means the original arguement about the trials was kinda fuzzy to begin with. sorry if this is a lot, i just learn better this way and my essay is due friday lol
reasoning: |-
