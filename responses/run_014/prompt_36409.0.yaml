answer: |-
  What a fascinating (and frustrating!) position to be in – emerging from decades of rigorous population genetics into a philosophical debate that seems to resurrect settled scores. Your intuition is razor-sharp, and your diagnosis touches on the core tensions. Let's dissect why the argument persists *despite* the formal equivalence proofs (Gardner, Grafen, et al.), building on your excellent working hypothesis.

  **The Core of the Persistent Disagreement:**

  1.  **Explanatory Aims vs. Ontological Commitment (Your Hypothesis is Largely Correct):**
      *   **Gene-Centered View (Beneficiary Focus):** This perspective asks: *"Where does the cumulative, long-term benefit of adaptations ultimately reside?"* The answer is genes (or replicators). Fitness differences *manifest* at various levels (organism, group), but the *beneficiary* of the selective process, the entity whose frequency is tracked over evolutionary time with sufficient fidelity, is the gene. Selection is a *filter* acting on phenotypic variance, but the *currency* of evolutionary change is allele frequency change. This is fundamentally a bookkeeping perspective focused on the *outcome* and the *unit of inheritance*.
      *   **Multilevel Selection (MLS) / Interactor Focus:** This perspective asks: *"At what level(s) does the causal interaction with the environment *actually occur* to produce differential survival/reproduction *in a given episode*?"* It focuses on the *mechanism* and *locus of causal efficacy* during selection. Organisms interact with their physical and biotic environment. Groups *can* function as cohesive units interacting with other groups or their shared environment in ways that cause differential group survival/reproduction. This view emphasizes the *causal structure of the selective event* itself.
      *   **The Equivalence:** The Price Equation/Contextual Analysis beautifully shows that the *net change* in gene frequency can be partitioned in multiple ways (e.g., partitioning variance *within* vs. *between* groups is equivalent to the kin selection regression). Both frameworks accurately predict the *outcome*.

  2.  **Why Equivalence Doesn't End the Debate:**
      *   **Causal Parity Problem:** The equivalence shows the *net effect* is the same, but it doesn't dictate *how we describe the causal pathway*. Proponents of the interactor view argue that focusing *only* on the gene-level outcome obscures the causal biology. For example, explaining the evolution of worker sterility in ants *only* in terms of inclusive fitness coefficients feels like a description of the mathematical consequence, not the causal mechanism (queen survival, colony efficiency, inter-colony competition). The gene-centered view counters that the interactor description is just proximate mechanism; the ultimate explanation still resides in gene frequency change.
      *   **The "Bookkeeper" vs. "Interactor" Metaphysics (Your Colleague's Point):** This is where it gets metaphysical. Is the gene-centric view *merely* a convenient accounting method, or does it reveal a fundamental ontological truth – that genes *are* the *only* true units of selection *because* they are the only entities with the requisite transgenerational fidelity? The interactor view argues that selection *acts* on phenotypes (interactors) at various levels; genes are the *record* of that action, not the actor itself. This is a dispute about what constitutes a "real" unit of selection in the causal structure of evolution. Is "unit of selection" defined solely by being the beneficiary/locus of inheritance, or must it also be the locus of causal interaction?
      *   **Heuristic & Pedagogical Value:** Even with equivalence, different partitions can offer vastly different conceptual clarity and insight for specific problems.
          *   **Gene/Kin Selection:** Often vastly simpler for traits clearly tied to relatedness (e.g., sibling rivalry, parental care). It highlights conflicts of interest within groups.
          *   **MLS/Interactor Selection:** Often more intuitive and causally transparent for traits clearly tied to group structure and function (e.g., cooperative hunting, colony defense mechanisms, virulence evolution in pathogens where transmission depends on host survival). It highlights the role of population structure and emergent properties. What's "convenient" depends heavily on the biological question and the biologist's perspective.
      *   **The "Ghost of Group Selection Past":** Many biologists (especially those of your vintage!) associate "group selection" with the naive, often adaptationist, Wynne-Edwards style arguments thoroughly dismantled in the 60s/70s. The modern, rigorous MLS framework (Sober & Wilson, Trait-Group models, Contextual Analysis) is fundamentally different, but the *term* itself carries baggage, triggering suspicion. Conversely, proponents of MLS sometimes portray the gene-centric view as overly reductionist, ignoring important biological context.
      *   **Focus on Different Types of MLS:**
          *   **MLS1:** Selection acts on *particles* (organisms), but the *context* (group membership) affects their fitness (e.g., altruism within groups). This is where equivalence with kin selection is strongest.
          *   **MLS2:** Groups themselves are the *interactors* – they vary, reproduce (found new groups), and die, with group-level traits influencing group fitness *and* being heritable (e.g., the productivity/stability of a wasp colony influencing how many new queens it produces to found new colonies). Here, the gene-centered view argues it's still just selection on genes affecting group traits, while MLS proponents argue the group-level heritability and selection are causally significant. This is a harder case for pure gene-centric bookkeeping to feel intuitively satisfying, though the Price equation can still formally describe it.

  **Is it Verbal, Substantive, Metaphysical, or Pedagogical?**

  It's **all of the above**, but layered:

  1.  **Verbal:** Disagreement often stems from inconsistent definitions of "unit of selection" (replicator? interactor? beneficiary? vehicle?). Hull's (1980) replicator/interactor distinction was an attempt to clarify this.
  2.  **Substantive (about Causation):** The core *scientific* disagreement is about the *appropriate level of causal description*. Is focusing solely on gene-frequency change sufficient to explain the *process*, or does it omit crucial causal factors operating at higher levels, even if the net outcome is the same? This is a debate about scientific explanation, not prediction. The equivalence proofs show they predict the same outcome, not that they offer the same *explanation*.
  3.  **Metaphysical:** Beneath the causation debate lies the ontological question: Are groups (or organisms) *real* agents in the selective process, or are they just temporary collections of genes upon which selection acts, with genes being the only persistent entities with "interests"? This is your colleague's point.
  4.  **Pedagogical/Political:** There are genuine disagreements about which framework provides better intuition, avoids historical pitfalls, and fosters more productive research. There's also an element of tribal identity and investment in particular paradigms.

  **Will it be Settled? Will Grandchildren's Textbooks Argue?**

  *   **Settled Empirically? No.** The formal equivalence means no experiment can distinguish between the frameworks *as predictive tools* for the net outcome. A case perfectly explained by kin selection can be perfectly redescribed in MLS terms and vice-versa.
  *   **Settled Conceptually? Perhaps Partially.** Wider adoption of clear distinctions like Replicator (gene) vs. Interactor (organism, group) or Sober's "Beneficiary" vs. "Vehicle" helps. Recognition that these are *complementary perspectives* focusing on different aspects of the evolutionary process (long-term beneficiary vs. locus of causal interaction) is growing. Modern textbooks (e.g., Freeman & Herron, Stearns & Hoekstra) often present both views, emphasizing their mathematical equivalence and different heuristics.
  *   **Grandchildren's Textbooks?** They likely won't feature the *same* heated arguments. The *strict* Dawkinsian view that *only* genes are units of selection is less dominant. MLS is accepted as a valid, rigorous framework. However:
      *   Debates about the *primary usefulness* or *causal primacy* of different perspectives for specific problems will continue.
      *   Discussions about MLS2 (groups as interactors with heritability) and its significance will persist.
      *   Philosophical discussions about causation, explanation, and reductionism in biology are perennial. The levels-of-selection question is a prime case study for these issues.

  **In Conclusion:**

  Your working hypothesis is remarkably accurate. The core residue is about **explanatory goals and causal attribution**. The gene-centered view prioritizes identifying the beneficiary and locus of inheritance ("Where does the benefit land?"). The interactor/MLS view prioritizes describing the locus of causal interaction during selection ("How does the selection actually happen?"). The mathematical equivalence proves these are different ways of accounting for the *same net outcome*, not that one is right and the other wrong.

  The disagreement persists because:

  1.  **Causal Descriptions Differ:** Equivalence of outcome ≠ equivalence of causal explanation.
  2.  **Metaphysics Creeps In:** Is the gene's-eye view just accounting, or does it reveal fundamental reality?
  3.  **Heuristics Matter:** Different frameworks illuminate different biological aspects.
  4.  **Baggage:** Historical connotations of terms like "group selection" fuel suspicion.

  While the *ferocity* may diminish, and textbooks will increasingly present both as valid perspectives, the fundamental tension between explaining *outcome* (beneficiary) and *process* (interactor) ensures this won't vanish entirely. It's a deep question about how we understand causality and explanation in complex, hierarchical systems like biology. Your pragmatic population genetics instinct ("pick what's convenient") remains scientifically sound for *prediction*, but the philosophical debate reveals that explanation in biology often demands more.
