prompt: |-
  Quick context: I share a house with three other guys, and for months we've had this recurring standoff where some chore needs doing (trash, dishes, whatever) and each of us individually decides whether to just do it or wait and hope someone else caves. Last month I read Hofstadter's Metamagical Themas stuff, the superrationality idea and the Luring Lottery experiment he ran in the magazine, and it honestly felt like it was written for me. The way I understand it: if you're in a symmetric dilemma with people who reason the way you do, you can treat your own decision as a sample of what everyone's deciding, so you should pick the move that's best when everyone like you picks it, instead of the game-theory move. So last week the kitchen was a disaster and I thought, the other three are basically facing the same situation I am and we all think roughly alike, so if I decide not to clean they'll decide not to clean too, and we're stuck in the defect-defect box. So I cleaned. Kitchen's clean. Felt like the system works.

  Here's where it gets personally urgent. Me and another guy at work both put in for the same promotion, and the decision on who gets extra training slots etc. lands next month. I've been trying to run it the superrational way: whatever I do (study nights and weekends for the cert, going to the boss directly, whatever), he'll do the same thing, so I should pick the strategy that's best for both of us when we both do it. But my coworker is not a copy of me — different background, he's got kids so no weekend studying, and honestly he's more cutthroat than I am. So my question is: what's the actual cutoff? Like, how much do two people have to be alike, in reasoning style or situation, before superrationality kicks in and becomes valid? Is it something you can estimate, like a similarity score, where above it I should reason as if we'll mirror eachother and below it I fall back to normal game theory? And in the promotion case, does it even apply, since only one of us can win — if superrational reasoning says we'd both pick the same strategy, does that mean we should both pick "go all out," or both pick "split the effort," or does the whole thing break when the game is zero-sum?

  I guess what I really want is a practical way to use this. If I could put even a rough number on the similarity threshold I could apply it to alot of stuff in my life — the chores, the promotion, even group buys with my roommates. Does anyone know if there's a worked-out version of this, like a sliding scale between fully rational and fully superrational? Or am I maybe drawing the line in the wrong place, and the question isn't similarity at all?
reasoning: |-
  Okay, let me unpack this user's dilemma. They're grappling with applying superrationality from Hofstadter's work across different life scenarios—first successfully with roommate chores, now anxiously with a zero-sum promotion competition. 

  The core tension is about transferability: why did symmetric reasoning work perfectly in the chore situation but feels unstable here? I notice they're already spotting key differences—their coworker has kids (asymmetric constraints) and a more competitive temperament. Smart observation. 

  Hmm... they're asking for a "similarity score" threshold, which is fascinating because it reveals how deeply they want this to be a calculable system. But human behavior isn't that neat. Maybe instead of a quantitative line, we should think about necessary conditions? Like: for superrationality to apply, you need (1) symmetric payoffs, (2) shared reasoning style, and (3) non-zero-sum structure. The promotion case fails all three. 

  Ah! And they haven't considered the boss's role here. This isn't just a two-player game—the decision-maker introduces a third axis. Superrationality collapses when outcomes depend on external judgment. 

  ...Wait, their last question suggests they might be overextending the concept. "Group buys" with roommates could work if all value the item equally, but zero-sum promotions? No. Need to protect them from misapplying it competitively. 

  *scribbles mentally* Should emphasize: superrationality is for cooperative dilemmas, not battles. For the promotion, framing it as "how would I want us both to act?" might backfire because their coworker won't reciprocate. Game theory with tit-for-tat seems safer here. 

  ...And maybe offer a hybrid approach? Like using superrationality to coordinate with roommates on presenting a united front to the boss about training needs. Redirect that cooperative impulse productively.
answer: |-
  You've hit on the **core tension in applying superrationality**: it requires a specific type of symmetry that rarely exists perfectly in reality. Hofstadter's thought experiments (like the Luring Lottery) assume *perfectly identical reasoning* and *identical situations*. Your roommate chore example worked because it **approximated those conditions well enough**. Your promotion dilemma fails because the **asymmetries are too great**. Here's a breakdown:

  ### Key Asymmetries Killing Superrationality in Your Promotion Case
  1.  **Payoff Structure:** The promotion is **zero-sum** (only one wins). Superrationality thrives in **non-zero-sum dilemmas** (like chores, where mutual cooperation or mutual defection are possible outcomes). In zero-sum, "doing the same thing" often leads directly to conflict if the resources are scarce.
  2.  **Situation:** You have different constraints (kids vs. no kids = different availability for studying/lobbying). Your actions don't have identical costs/benefits.
  3.  **Reasoning Style:** You describe him as "more cutthroat." Superrationality assumes all players use *identical superrational reasoning*. If he's using standard competitive game theory (or just instinct), your "sample of one" logic doesn't apply. He won't mirror your decision process.
  4.  **Goals:** While you both want the promotion, your underlying utility functions might differ (e.g., how much risk you tolerate, how much you value work-life balance vs. the title).

  ### The "Similarity Score" Challenge (It's Fuzzy, Not Numerical)
  There's no universal similarity score. Instead, ask these **practical diagnostic questions** to gauge if superrationality might apply:

  1.  **Is the dilemma symmetric?** Do all players face *identical choices, costs, benefits, and information*? (Chores: Mostly Yes | Promotion: No - different costs/benefits/strategies).
  2.  **Is the outcome non-zero-sum?** Is mutual cooperation better than mutual defection? Is mutual defection worse than mutual cooperation? (Chores: Yes - clean kitchen vs. mess is better for all | Promotion: No - mutual effort likely means intense competition where one still loses; mutual lack of effort might mean neither gets it).
  3.  **Do I reasonably believe the others use superrational reasoning?** Have they demonstrated it? Are they familiar with the concept? Are they generally cooperative thinkers? (Roommates: Maybe, based on shared experience | Coworker: Explicitly "more cutthroat" - likely No).
  4.  **Is the "mirroring" assumption plausible?** If I choose strategy X, is it *realistic* that others in this group, facing *my exact situation*, would also choose X? (Chores: Plausible - "If *I* think it's someone else's turn, maybe *they* do too" | Promotion: Implausible - Your situations and temperaments differ too much).

  **Threshold Estimate:** If the answer to **all four questions leans strongly "Yes"**, superrationality has a good chance. If **any one leans strongly "No"**, especially #2 (Non-Zero-Sum) or #3 (Shared Reasoning), it likely fails. **#2 (Non-Zero-Sum) is often the deal-breaker.**

  ### Applying This to Your Cases
  *   **Chores (Shared House):**
      *   Symmetric? **High** (Same mess, same cost to clean, same benefit from clean).
      *   Non-Zero-Sum? **High** (Mutual Clean > Mutual Mess).
      *   Shared Reasoning? **Moderate/High** (You live together, likely similar enough mindset to grasp mutual benefit).
      *   Mirroring Plausible? **High** (You all experience the same standoff).
      *   **Conclusion:** Superrationality valid & successful. "I clean, knowing if we all thought this way, someone would always step up when needed, avoiding mutual mess."

  *   **Promotion (Zero-Sum Competition):**
      *   Symmetric? **Low** (Different situations, constraints, likely different strategies).
      *   Non-Zero-Sum? **Very Low** (Only one winner; mutual effort doesn't guarantee mutual benefit).
      *   Shared Reasoning? **Very Low** (He's cutthroat, you're considering cooperation).
      *   Mirroring Plausible? **Very Low** (He won't mirror your cooperative restraint).
      *   **Conclusion:** Superrationality **invalid and dangerous**. Assuming he mirrors your "hold back" strategy is naive. You need standard game theory.

  ### What To Do About the Promotion (Game Theory Approach)
  1.  **Acknowledge the Conflict:** It's competitive. Pretending otherwise hurts you.
  2.  **Assess His Likely Moves:** Based on his "cutthroat" nature: Will he study intensely? Lobby the boss hard? Undermine you? Prepare accordingly.
  3.  **Focus on Your Strengths:** What unique value do *you* bring? Certifications? Specific skills? Better relationships? Double down there.
  4.  **Manage Upward:** Have professional, evidence-based conversations with your boss about *your* contributions, goals, and readiness. Don't badmouth him; focus on your value. ("Cutthroat" often backfires long-term).
  5.  **Consider Tit-for-Tat (Cautiously):** If cooperation *is* possible on *specific, non-promotion-related* tasks (e.g., covering for each other on minor things), reciprocate positively but be ready to match defection if he exploits it. **Do NOT apply this to promotion-seeking behavior itself.**

  ### Group Buys (A Middle Ground Example)
  *   **Symmetric?** Moderate (All pay same share? All value the item equally?).
  *   **Non-Zero-Sum?** **High** (If all pay, all get the item cheaper. If none pay, no one gets it. Mutual cooperation wins).
  *   **Shared Reasoning?** Moderate (Roommates, familiar with mutual benefit concepts).
  *   **Mirroring Plausible?** Moderate (You all see the benefit).
  *   **Conclusion:** Superrationality **could work well here**. "I commit to paying my share, assuming if we all think this way, the group buy succeeds." **Mitigation:** Set a clear deadline and minimum participants to reduce risk.

  **In essence:** Superrationality is a powerful tool for **symmetrical, cooperative dilemmas among like-minded agents**. Your promotion battle is **asymmetrical, zero-sum, and involves an adversarial agent**. Use cooperative thinking for the chores and group buys; use competitive, game-theoretic thinking (with integrity) for the promotion. The "similarity" needed is high symmetry in situation, payoffs, *and* reasoning style – especially the *reasoning style*.
