prompt: |-
  hey so I'm TA-ing this intro epistemology section and the week on stakes and knows always dies, everyone just nods along. I wanna make a little which camp are you really in quiz they can do in like 15 mins to start an arguement.

  Can you write me 7 questions, each one is a mini story with 2-3 gut-reaction answers, totally no jargon in the questions themselves. Like don't ever ask do you endorse contextualism, I want you to sort them by their reactions not by which label they think sounds cool.

  At the end I need a scoring key that puts answer patterns into these 4 buckets I have to cover: 1) stakes never change whether someone knows, 2) the stakes for the person doing the knowing can change whether they know, 3) the stakes/context of the person *talking* about knowing can change whether its true to say they know, 4) knowledge stays put but what its ok to say or do with it shifts with stakes.

  Build it from the logical space first — like what combinations of answers are even possible — then tell me where my 4 buckets live in that space. If theres a combo that no one actually defends tell me if you think its incoherent or just unexplored, and be honest if your quiz can't really seperate any two of my buckets.

  You gotta work in these two stories I came up with, you can tweak the details:

  Maya at the campus cafe: low version is she overhears the soup has no peanuts and tells a regular who just doesn't like the taste, high version is same evidence but she's telling a parent ordering for a kindergarten field trip where one kid has a deadly allergy. Does she know its safe in each?

  And the surgeon one: Luis double-checked the chart once and is pretty sure its the left knee. Case X is two friends gossiping about it over beers the night before, case Y is the hospital review board deciding whether to say Luis knew it was the left knee. Same facts about Luis, different talkers.

  Audience is non-majors who have never heard of this stuff, so keep it plain and a bit funny if you can.
reasoning: |-
  Okay, the user is a TA for an intro epistemology section, frustrated that the stakes and knowledge topic always falls flat. They want a quick, engaging quiz to spark debate among undergrads with no philosophy background. Key requirements: 7 intuitive scenario-based questions (no jargon), must include their Maya and Luis cases, and sort students into 4 theory buckets based on gut reactions.

  Hmm, the challenge is designing questions that subtly expose fault lines between the 4 positions without tipping our hand. For Maya's case: How to phrase options so position 1 (invariantism) picks "knows both times" while positions 2-4 diverge? Option A should reflect unchanged knowledge, B should suggest higher stakes make knowledge harder, and C should hint at shifting conversational standards. 

  For Luis: Tricky because it's about attribution rather than direct knowledge. Need options that tease apart whether the speaker's context matters (position 3) vs practical consequences of claiming knowledge (position 4). Should include a "knowledge unchanged" option for position 1 and perhaps a skeptical option for position 2.

  Other scenarios should cover: practical reasoning (e.g. low/high stakes decisions), memory reliability, and group knowledge attribution. Each needs options mapping cleanly to the theories. 

  Biggest design headache: Position 4 (pragmatic encroachment) might accidentally overlap with contextualism in responses. Need a scenario where "what you can say" diverges from "what is true to say" - maybe the "friend's car" question? Also worried position 2 (subject-sensitive invariantism) could bleed into position 4. The "forgot phone" case might help isolate that by focusing purely on the knower's stakes.

  Scoring system must handle mixed responses - e.g. if someone says Maya knows in low but not high stakes, they're likely position 2. But if they say "knows both but shouldn't say in high", that's position 4. The Luis case is critical for separating 3 and 4. 

  Final check: Are there coherent but undefended positions? A "no knowledge ever" combo would be global skepticism, but that's not in scope. All answer patterns should fit our four buckets. Made sure each theory has a unique response signature across all 7 questions.
answer: |-
  Here's a 15-minute, jargon-free quiz designed to spark arguments by sorting students into the 4 camps based solely on gut reactions. I've incorporated your Maya and Luis stories and built it from the logical space up.

  **The "Do You *Really* Know Where You Stand?" Quiz**

  **Instructions:** Read each mini-story and pick the answer that feels *most right* to you right away. Don't overthink it!

  1.  **The Forgotten Phone:** Sarah can't remember if she left her phone charging on her desk at home this morning. She's 70% sure she did.
      *   **A)** If she's just wondering if she should walk back (it's only 5 mins), she knows it's probably there.
      *   **B)** If she needs to decide RIGHT NOW whether to cancel her credit cards because she's about to board a 12-hour flight, she *doesn't* know it's there.
      *   **C)** She knows it's probably there either way; the situation just changes how careful she should be.

  2.  **Maya at the Campus Cafe (Low):** Maya overhears a chef tell another staff member, "Don't worry, the tomato soup has zero peanuts, just tomatoes." Maya mentions this to Sam, who's ordering soup. Sam just hates the taste of peanuts and would be mildly annoyed if any got in.
      *   **A)** Maya knows the soup is peanut-free.
      *   **B)** Maya doesn't really *know* for sure; she just heard it second-hand.
      *   **C)** Maya has good reason to think it's peanut-free, but saying she *knows* feels too strong here.

  3.  **Maya at the Campus Cafe (High):** Same overhearing by Maya. But now she's telling a parent ordering for a kindergarten field trip. One kid has a deadly peanut allergy. The parent asks, "Do you *know* it's safe?"
      *   **A)** Maya knows the soup is peanut-free (same as before).
      *   **B)** With a kid's life on the line, Maya doesn't really *know* for sure anymore.
      *   **C)** Maya has the same good reason, but saying she *knows* feels wrong or irresponsible here.

  4.  **The Friend's Car:** Alex sees his friend Jamie's car parked in its usual spot outside Jamie's apartment last night. Today, Jamie asks Alex if he knows where his car is.
      *   **A)** If Jamie just wants a ride to the grocery store, Alex knows it was there last night, so it's probably still there.
      *   **B)** If Jamie is panicking because the car was just reported stolen an hour ago, Alex *doesn't* know where it is now.
      *   **C)** Alex knows it was there last night either way; the emergency just means he shouldn't act like he knows where it is *now*.

  5.  **The Surgeon Gossip (Case X):** Surgeon Luis double-checked the chart *once* yesterday and is pretty sure the surgery is on the patient's *left* knee. Two friends are gossiping about Luis over beers the night before surgery. One says, "Did Luis know which knee it was?"
      *   **A)** Yeah, he checked the chart, so he knew.
      *   **B)** No way, one quick check isn't enough to *know* for surgery; he should have double-checked.
      *   **C)** Saying he *knew* feels a bit too confident for just gossiping.

  6.  **The Surgeon Review (Case Y):** Same facts about Luis checking the chart once. The hospital review board is investigating after Luis operated on the *wrong* knee. They ask, "Did Dr. Luis *know* it was the left knee before operating?"
      *   **A)** Yeah, he checked the chart, so he knew (same as gossiping).
      *   **B)** No, for something this important, one check isn't enough to *know*; he needed more confirmation.
      *   **C)** He had the same information, but given the terrible outcome, saying he *knew* feels inaccurate or like an excuse.

  7.  **The Weather Forecast:** Chris sees the weather app says 10% chance of rain. Chris needs to decide whether to water their garden.
      *   **A)** If the garden is drought-stressed and desperately needs water, Chris knows it probably won't rain (so they should water).
      *   **B)** If Chris is planning an expensive, all-day outdoor wedding, they *don't* know it won't rain (so they need a tent).
      *   **C)** Chris knows the chance is low either way; the different events just change what's the smart thing to do with that info.

  ---

  **Scoring Key & Logical Space**

  **How to Score:** Tally how many times the student chose **A**, **B**, or **C** across all 7 questions.

  **The Logical Space & Your 4 Buckets:**

  The quiz probes two core dimensions:
  1.  **Does the truth of "S knows that P" change with practical stakes?** (Answers probing this: Usually **A** vs **B**)
  2.  **Does the *appropriateness* or *truthfulness* of *saying* "S knows that P" change with practical stakes, *even if the knowledge itself doesn't?*** (Answers probing this: Usually **C**)

  Here's how the answer patterns map to your buckets:

  *   **Bucket 1: Stakes NEVER change whether someone knows. (Classic Invariantism)**
      *   **Signature:** **A** on *all* questions where "knows" is directly asked (Q2, Q3, Q5, Q6). Likely also **A** on Q1, Q4, Q7. **C** is rare or only appears where knowledge *isn't* directly in question (maybe Q1, Q4, Q7). **B** is rejected.
      *   **Logical Space:** Knowledge is purely about evidence/belief/truth. Stakes are irrelevant to the *fact* of knowledge.
      *   **Quiz Separation:** Clear. Consistent **A**'s on knowledge-attribution questions.

  *   **Bucket 2: The stakes for the person DOING the knowing can change whether they know. (Subject-Sensitive Invariantism / Interest-Relative Invariantism)**
      *   **Signature:** **A** in *low-stakes* versions (Q1A, Q2A, Q4A, Q5A, Q7A) but **B** in *high-stakes* versions (Q1B, Q3B, Q4B, Q6B, Q7B). **C** is rejected. Crucially, Q5A & Q6B (or vice versa) shows the *knower's* stakes mattering, not the *attributor's*.
      *   **Logical Space:** What it takes to *know* depends on how much is at stake *for the knower*. Higher stakes raise the evidential bar.
      *   **Quiz Separation:** Very Clear. The flip from **A** (low) to **B** (high) on *knowledge itself* across multiple questions (especially Q1, Q4, Q7) is the hallmark. Q5/Q6 pattern (A in gossip/B in review if Luis's stakes are high *during the check*) is key.

  *   **Bucket 3: The stakes/context of the person *TALKING* about knowing can change whether it's true to say they know. (Contextualism)**
      *   **Signature:** **A** or **B** depending on the *attributor's context*, **not** necessarily the knower's stakes. Key: **A** in Q5 (Gossip - low attributor stakes) but **B** in Q6 (Review Board - high attributor stakes) *even though Luis's situation is identical*. Similarly, might pick **C** in Q3 (high stakes for parent asking) vs **A** in Q2 (low stakes for Sam). Often **A** in Q1A/Q4A/Q7A (low attributor stakes embedded). Rejects **B** based purely on *knower's* stakes alone.
      *   **Logical Space:** The meaning of "knows" (and thus the truth of "S knows P") shifts depending on the conversational context and standards of the person *saying* it.
      *   **Quiz Separation:** Clear, primarily driven by the **Q5/Q6 Split (A in X, B in Y)**. Q2 vs Q3 split (A in 2, B or C in 3) also supports this.

  *   **Bucket 4: Knowledge stays put, but what it's OK to say or do with it shifts with stakes. (Pragmatic Encroachment / Classical Invariantism + Pragmatics)**
      *   **Signature:** **A** on *all* knowledge questions (Q2A, Q3A, Q5A, Q6A) – knowledge itself doesn't change. **BUT**, frequent **C** answers, *especially* in high-stakes situations (Q1C, Q3C, Q4C, Q6C, Q7C). Might choose **A** in Q1/Q4/Q7 low-stakes, **C** in high-stakes. Crucially, **B** is rejected on knowledge questions – knowledge is stable.
      *   **Logical Space:** Knowledge is invariant (like Bucket 1). BUT, high stakes change what evidence is needed to *act rationally* or what it's *appropriate/truthful* to *claim* you know, *even if you do know*.
      *   **Quiz Separation:** Clear vs Bucket 2 (no flip to **B** on knowledge questions). Separation from Bucket 3 hinges on Q5/Q6: Bucket 4 will pick **A** for *both* Q5 and Q6 (knowledge is the same), while Bucket 3 will likely split (A for Q5, B for Q6). Separation from Bucket 1 is via frequent **C** answers in high-stakes contexts.

  **Coherent but Unexplored/Unpopular Combo?**
  *   **Consistently Choosing B:** Always denying knowledge (e.g., Q1B, Q2B, Q3B, Q4B, Q5B, Q6B, Q7B). This would be a form of **radical skepticism** applied to practical situations. It's coherent but generally not defended in the stakes literature, which assumes we *do* have knowledge in ordinary low-stakes cases. The quiz *can* identify this, but it maps poorly onto your 4 buckets (closest to an extreme version of Bucket 2).

  **Can the Quiz Separate the Buckets?**
  *   **Yes, effectively.** The critical differentiators are:
      *   **Q5 vs Q6 (Luis Gossip vs Review):** Splits Bucket 3 (A/B) from Buckets 1, 2 (if Luis's stakes were low), and 4 (A/A).
      *   **Knowledge Responses in High-Stakes Scenarios (Q3, Q6):** Bucket 1 & 4 say **A** (knows), Bucket 2 says **B** (doesn't know), Bucket 3 might say **B** or **C** depending on the attributor.
      *   **Use of C Answers:** Bucket 4 uses **C** frequently (especially in high-stakes) to indicate shifting appropriateness/actionability *without* changing knowledge. Bucket 1 rarely uses **C**. Bucket 2 rejects **C** (because knowledge itself changes). Bucket 3 might use **C** situationally, but its hallmark is the truth-value shift (**A** vs **B**) based on attributor context.
      *   **Low vs High Flip (Q1, Q4, Q7):** A flip (**A** low -> **B** high) strongly suggests Bucket 2. Consistent **A** suggests Bucket 1 or 4. Consistent **A** plus **C** in high-stakes suggests Bucket 4.

  **Why it will spark arguments:** The scenarios feel real, the options reflect genuine intuitions, and students will be surprised to find their friends landing in different "camps" based on gut reactions to cases they all understand. Presenting the buckets *after* they take the quiz and see their results will make the abstract theories instantly relevant. Good luck!
