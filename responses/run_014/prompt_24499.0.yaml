          If the interval for A was not so wide (for example, if we had more data for A), then the lower bound for A might be higher, and maxmin might choose A if its lower bound is above B's lower bound. Also, the Bayesian mean for A might be even more clearly above B's, and maximality might still show both as admissible if there's overlap, but in this case if the interval for A is [a1, a2] and for B [b1, b2] and a1 < b1 and a2 > b2, then we still have the same structure. But if we have more data for A and the interval narrows and shifts, then the example might break.

     What would a defender of the criterion that comes out worst (say, maxmin) say to stop it from counting as a real disagreement?
          A maxmin defender might argue that in the face of sparse and ambiguous data, it is prudent to choose the option that has the least bad worst-case scenario. In this case, the worst-case scenario for B (10% success) is better than the worst-case scenario for A (1% success). They might argue that the Bayesian's choice of A is too optimistic because it relies on a central tendency that is not robust to the uncertainty. The fact that the Bayesian's point estimate for A is based on only two data points is highly unstable. The maxmin criterion is designed to protect against the worst possible scenario within the set of possibilities, which is a form of robustness.

     Alternatively, a defender of maximality might argue that since both options are admissible, the decision maker should not be forced to choose one over the other arbitrarily. They might suggest gathering more data or using a secondary criterion.

     A Bayesian might argue that the maxmin criterion is overly conservative and that the maximality criterion is too permissive. The Bayesian approach uses the available data in a coherent manner and produces a clear recommendation. They might also point out that the uniform prior is a reasonable default and that the posterior mean is a good summary.

     In summary, the example is:

          Drug A: 1 success out of 2 patients -> interval [0.01, 0.99] for the success probability.
          Drug B: 4 successes out of 10 patients -> interval [0.1, 0.7] for the success probability.

     And the recommendations:
          - Maxmin: B
          - Maximality: both A and B
          - Precise Bayesian (uniform prior): A

     This meets the specification.
