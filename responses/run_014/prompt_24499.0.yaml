prompt: |-
  I'm taking a course on decision theory under uncertainty and I keep geting confused about when imprecise probabilities actually change the recommendation, as opposed to just making the agent more timid. I was talking this through with a friend who works in clinical trial design, and she keeps saying that the "obvious" imprecise-probabilist move (just refuse to choose when the evidence is sparse) is not what the formalism actually says, and that different criteria within the imprecise-probabilist camp can give different answers to the same case. I'd like a concrete example to pin this down.

  So: construct a decision problem where a doctor (or an investor, your pick) has to choose between two options, A and B, each of which has an unknown success probability, and the evidence supports interval estimates rather than point estimates — so the imprecise model entertains a credal set, a whole set of probability distributions, one for each point estimate compatible with the evidence. The case has to be realistic — a small trial, a sparse reference class, something a normal person could actualy face — no exotic physics, and the intervals have to be justifiable from the evidential situation, not stipulated out of thin air (so briefly say what the evidence is and why it supports those intervals). The payoffs should be simple (success vs. failure, no weird utility twists).

  The spec I want the case to meet: (1) the maxmin criterion — pick the option with the higher lower bound on success probability — recommends B; (2) the maximality or E-admissibility criterion — an option is admissible if there's some probability in the credal set under which it's optimal — recommends both A and B, i.e., it gives no unique recommendation; and (3) a precise Bayesian who starts from the same evidence and picks a single probability distribution that the imprecise model would accept as admissible (i.e., within the credal set) recommends A. So all three approaches give different answers. After the scenario, walk through each of the three approaches (what it recommends and why, in terms of the actual numbers), tell me which structural feature of the case is doing the work (I'm guessing it has to do with the intervals overlapping in a particular way, but I want it isolated and explained) and what happens if I remove that feature (does the case collapse back into one where all three agree?), and finish with what a defender of the criterion that comes out worst would say to stop it from counting as a real disagreement.
