prompt: |-
  I'm a second-year philosophy graduate student, and I've been stuck for a week on the difference between epistemic contextualism and pragmatic encroachment. The problem is that in real life the two putative sources of variation — the conversational context in which I'm making a knowledge attribution, and my own practical stakes in the matter — tend to change together, so I can't tell which one is actually doing the work. For instance, when I was deciding whether to trust a structural engineer's assurance that a building was safe, my sense of "knowing" shifted as I moved from casually considering the apartment to having signed a lease and paid a deposit, but I can't tell whether that shift was because the conversational standards changed (I was now making the attribution in a high-stakes, decision-relevant context) or because my practical stakes changed (I now had real money on the line) — or both.

  I'm trying to figure out which of the two theories is the better account of that kind of shift, and more generally what each one says is doing the work. Could you compare epistemic contextualism and pragmatic encroachment for me, focusing on (1) where each locates the context-sensitivity — in the attributor's conversational context or in the subject's practical situation — (2) what each predicts should happen in the two clean cases: one where my evidence and stakes are held fixed but the attributor's conversational context changes, and one where the attributor's context is held fixed but my stakes rise, and (3) whether pragmatic encroachment is a genuine rival to contextualism or just a special case of it? I'd also like the strongest objection to each, and a sense of where they genuinely diverge rather than where they merely sound different, because I'm deciding which one to defend in my term paper and I don't want to build my argument on a distinction that collapses under scrutiny.
reasoning: |-
  Okay, let me tackle this philosophy student's problem. They're stuck on distinguishing epistemic contextualism and pragmatic encroachment, especially since both seem to explain shifts in knowledge attributions when stakes change. The key issue they're facing is that in real-life scenarios, conversational context and practical stakes often change together, making it hard to isolate which factor is actually responsible.

  First, I need to clearly outline both theories. Epistemic contextualism says that the meaning of "knows" changes based on the attributor's conversational context. So when someone says "S knows that P," the standards for what counts as knowledge depend on the context of the person making that statement. For example, in a high-stakes situation, the standards might be higher. 

  Pragmatic encroachment, on the other hand, argues that knowledge itself depends on practical stakes. It's not just about how we talk about knowledge; what you actually know can change based on how important being right is. If the stakes are high, you might need more evidence to truly know something. 

  The student mentioned their apartment example: when they were just considering it, they felt they knew it was safe, but after signing the lease and paying a deposit, that certainty shifted. Contextualism would say the act of attributing knowledge now happens in a high-stakes context, raising the standards. Pragmatic encroachment would say the student's own stakes changed, altering what they actually know. 

  To help them differentiate, I should present thought experiments where only one factor changes. For contextualism, imagine a low-stakes attributor discussing a high-stakes subject. Contextualism predicts that the attributor's low standards apply, so they might say the subject knows, even if the subject's stakes are high. Pragmatic encroachment would say the subject's high stakes mean they don't know, regardless of the attributor's context. 

  For the other case, if the attributor's context is high-stakes but the subject's stakes are low, contextualism might say the attributor denies knowledge due to their strict standards. Pragmatic encroachment would say the subject does know because their stakes are low. 

  The student also wants to know if pragmatic encroachment is a rival to contextualism or a subset. I should explain that pragmatic encroachment is a distinct theory. It rejects contextualism's semantic claims and instead ties knowledge directly to practical factors. 

  Strong objections matter too. For contextualism, the main issue is semantic blindness: people don't seem aware that "knows" is context-sensitive. For pragmatic encroachment, the worry is that it collapses the distinction between epistemic and practical rationality, which many philosophers want to keep separate. 

  I need to ensure the student understands where these theories genuinely diverge. Highlighting cases where they make different predictions is key. Also, clarifying that contextualism is about language while pragmatic encroachment is about the nature of knowledge itself. 

  Considering their term paper, I should suggest they explore scenarios where stakes and context come apart, like third-party attributions or fixed-context varying-stakes cases. Empirical studies on folk attributions could also be useful. 

  Finally, I'll emphasize that choosing a theory might depend on whether they prioritize linguistic data or the connection between knowledge and action. Both have strengths and weaknesses, so their argument should address the core objections.
answer: |-
  Let's break down the distinction between epistemic contextualism and pragmatic encroachment with precision, addressing your core concerns about disentangling their mechanisms. Both theories aim to explain shifting knowledge attributions in response to practical factors, but they locate the source of variation differently, leading to genuine theoretical divergence.

  **Core Distinctions:**

  1.  **Locus of Context-Sensitivity:**
      *   **Epistemic Contextualism (EC):** Locates sensitivity in the **attributor's conversational context**. The semantic content of the word "know(s)" varies with the context of the person *making the knowledge attribution*. The subject's practical situation is irrelevant to the truth conditions of the *attributor's statement* "S knows that p." What changes is the *standard* required for "knows" to be true in that conversational context.
      *   **Pragmatic Encroachment (PE):** Locates sensitivity in the **subject's practical situation**. The truth of *whether the subject S knows that p* depends partly on the practical stakes *for S* (or sometimes for the attributor *if* they are the subject). PE claims that practical factors directly affect the *epistemic* status of the subject's belief – what it takes to *have knowledge* is partly determined by practical stakes surrounding the belief.

  2.  **Predictions in Clean Cases:**

      *   **Case 1: Subject's Evidence & Stakes Fixed; Attributor's Context Changes (e.g., Low -> High Stakes)**
          *   **EC Prediction:** The truth-value of the *attributor's statement* "S knows that p" **changes**. In the low-stakes context, the attributor's statement is true (S meets the low standard). In the high-stakes context, the attributor's statement is false (S doesn't meet the high standard). *S's actual epistemic state (relative to their fixed evidence/stakes) hasn't changed, but the meaning of the attribution has.*
          *   **PE Prediction:** The truth-value of "S knows that p" **stays the same** (assuming S's stakes are genuinely fixed). Since S's practical situation hasn't changed, S's knowledge state hasn't changed. The attributor's changing context might make them *say* different things, but it doesn't change whether S *actually knows*. The attributor in the high-stakes context might be *mistaken* in denying knowledge if S's fixed low stakes mean S *does* know.

      *   **Case 2: Attributor's Context Fixed; Subject's Stakes Rise (Evidence Fixed)**
          *   **EC Prediction:** The truth-value of the *attributor's statement* "S knows that p" **stays the same** (assuming the attributor's context is genuinely fixed). The meaning of "knows" is stable in the attributor's context. If S met the standard before, they still meet it now *for this attributor*, even though S's practical situation changed. The attributor might truly say "S knows" both before and after, even though S might now *feel* uncertain or *act* differently.
          *   **PE Prediction:** The truth-value of "S knows that p" **changes** (assuming the rise in stakes is significant). Because S's practical stakes increased, the *epistemic bar* S must meet to count as *knowing* has also risen. With fixed evidence, S likely no longer meets this higher bar. The attributor, using a fixed context, would have to either (a) correctly change their attribution from "S knows" to "S does not know" as they learn of the changed stakes, or (b) be mistaken if they stick with "S knows".

  3.  **Relationship: Rival or Special Case?**
      *   PE is a **genuine rival** to EC, not merely a special case.
      *   **Why not a special case?** EC is fundamentally a *semantic theory* about the word "knows," proposing it is context-sensitive like indexicals ("I," "here," "now"). PE is primarily a *metaphysical/epistemic theory* about the nature of knowledge itself, proposing that practical factors are partial *determinants* of knowledge.
      *   **Conflict:** EC typically assumes that *what knowledge is* (the underlying epistemic relation) is invariant; only the semantic standards for attributing it shift. PE explicitly claims that *what knowledge is* varies with practical stakes. For PE, knowledge itself is stakes-sensitive, not just the word used to describe it. An EC theorist could *adopt* a PE-like account as *the invariant epistemic relation* that contextual standards track, but this would be a hybrid view, not pure EC. Pure PE rejects the core semantic claim of EC.

  **Strong Objections to Each Theory:**

  *   **Epistemic Contextualism (EC):**
      *   **The Semantic Blindness/Objection:** This is the most persistent critique. If "knows" is context-sensitive like "tall" or "flat," why aren't competent speakers aware of this? We don't typically think disagreements about knowledge (e.g., "You knew yesterday! / No I didn't!") are merely verbal misunderstandings due to shifting standards; they feel like substantive disagreements about a stable property. EC struggles to explain this *lack of metalinguistic awareness* and the *sense of genuine disagreement* without attributing widespread error to speakers.
      *   **The "Fancy" Contexts Objection:** Can contexts really set standards arbitrarily high ("Do you *really* know you're not a brain in a vat?")? If so, we arguably *never* meet the standards in *some* contexts, making knowledge attributions almost useless in those contexts. This seems counterintuitive.

  *   **Pragmatic Encroachment (PE):**
      *   **The Purity of Epistemology Objection:** Knowledge is supposed to be about truth and justification, distinct from practical concerns. PE allegedly "encroaches" on the purity of epistemology by making knowledge depend on non-truth-related factors (stakes). Critics argue this blurs the line between epistemic justification (what you *should* believe) and practical rationality (what you *should do*).
      *   **The Stability of Knowledge Objection:** Does my knowledge *really* vanish the moment stakes rise, even if my evidence is unchanged? This seems implausible. If I knew the building was safe when casually looking, did I *cease* to know it when I signed the lease, even though I gained no new evidence *against* its safety? PE struggles to explain the apparent stability of knowledge over short periods absent new evidence.
      *   **The Subject/Object Problem:** Whose stakes matter? The subject's? The attributor's (if different)? The agent acting on the knowledge? PE needs a principled answer, and different choices lead to different counterexamples.

  **Where They Genuinely Diverge (Beyond Terminology):**

  1.  **Nature of Knowledge:** EC treats knowledge (the underlying epistemic state) as invariant; variation is in attribution standards. PE treats knowledge itself as variant with stakes.
  2.  **Explanatory Target:** EC primarily explains *linguistic data* (patterns of knowledge *attributions*). PE primarily explains *actionability* (why knowledge seems closely tied to rational action; high stakes require stronger justification to rationally act).
  3.  **Response to Fixed-Stakes Cases:** This is the litmus test. Imagine a subject (S) in a *fixed* low-stakes situation (e.g., considering a building casually). Now consider two attributors:
      *   Attributor A: In a low-stakes context (chatting at a café).
      *   Attributor B: In a high-stakes context (discussing building safety regulations).
      *   **EC Prediction:** A truly says "S knows it's safe." B truly says "S does *not* know it's safe" (due to B's higher standards). Both statements are true relative to their contexts. There's no genuine conflict; it's like A saying "S is tall" (for a jockey) and B saying "S is not tall" (for a basketball player).
      *   **PE Prediction:** Since S's stakes are low, S *actually knows*. Therefore, A is correct in saying "S knows." B, however, is *incorrect* in saying "S does not know," even though B is in a high-stakes context. B's high stakes affect what *B needs to know* to act rationally themselves, but not whether *S* knows. PE would typically say B's statement is false, though perhaps *pragmatically warranted* (it would be risky for B to *rely* on S's knowledge).

  **Implications for Your Apartment Case & Paper:**

  Your intuition that both factors shifted together is astute. EC says the *act of attributing knowledge to yourself* occurred in a new, higher-standard conversational context triggered by the lease signing. PE says *your own knowledge state changed* because your practical stakes increased, raising the epistemic bar you needed to meet.

  *   **To Defend EC:** Focus on the semantic blindness objection and how EC handles it. Argue that the "disagreement" you felt with your past self is actually a shift in conversational scorekeeping. Emphasize cases where an *external* attributor's context shifts while the subject's stakes are fixed (e.g., a regulator vs. a friend commenting on *your* low-stakes belief). Show how EC provides a cleaner semantic account of knowledge *attributions*.
  *   **To Defend PE:** Focus on the tight link between knowledge and rational action. Argue that your shift wasn't just about how you *spoke*, but about whether you genuinely possessed knowledge *sufficient for your high-stakes decision*. Emphasize cases where the *subject's* stakes shift within a *fixed* attributional context (e.g., *you* truly said "I know it's safe" while casually looking, but later, *you* truly say "I didn't *really* know it was safe back then" after signing, even though your evidence was the same). Argue that epistemology *should* connect to practical reason.

  **Recommendation for Your Paper:**

  1.  **Clarify the Core Divergence:** Anchor your paper in the **fixed-stakes cases** (attributor context changes) and **fixed-attribution-context cases** (subject stakes change). This is where the theories make *different, testable predictions*. Analyze thought experiments designed to isolate these variables (e.g., DeRose's "Airport" case, Fantl & McGrath's "Train" cases).
  2.  **Engage the Key Objections:** Don't just describe; critically evaluate how well each theory handles its major objection (Semantic Blindness for EC, Purity of Epistemology for PE). Which response is more plausible?
  3.  **Consider Hybrids/Avoid Collapse:** Explicitly discuss whether PE genuinely threatens EC's core semantic claim or if they can be combined. Argue for why one framework offers a more fundamental explanation. Does PE collapse into EC if we say the "invariant epistemic state" is stakes-sensitive? (PE proponents would say no, because EC still treats "knows" as semantically context-sensitive, whereas PE might allow the *word* to be invariant while the *state* varies).
  4.  **Leverage Your Example:** Use your apartment case, but *disentangle* the factors conceptually. What *would* EC say happened? What *would* PE say happened? Then, design a variant where *only* the attributor's context changes or *only* the subject's stakes change. Which theory's explanation feels more compelling for these variants *and* for your original case?

  By focusing on the predictions in the clean cases and the fundamental metaphysical/semantic commitments, you can build a robust argument that doesn't collapse under scrutiny. Good luck!
