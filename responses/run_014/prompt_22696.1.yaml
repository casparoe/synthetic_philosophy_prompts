prompt: |-
  I've been reading a lot about time-inconsistent preferences lately — the hyperbolic discounting literature, and the whole "Ulysses contract" and precommitment apparatus that comes up so often on the rationalist forums — and it has me wondering whether it is really the same phenomenon that the philosophers mean by akrasia, or whether we have been quietly conflating two different things. I raised it at a dinner with two friends, and they got into it in a way I could not referee. One, let's call her Mara, keeps insisting that hyperbolic discounting is not akrasia at all; the other, Dev, thinks it is actually a cleaner case of akrasia than the stock "I meant to go to the gym" examples.

  Here is roughly how it went. Mara opened by saying that akrasia, properly understood, is acting against one's own *synchronous* judgment: at the very moment of action, one judges A to be the best thing to do and then does B. Hyperbolic discounting does not produce that. At any given moment the discounting agent's preferences are internally consistent — given where it is on the clock, it genuinely judges the immediate option to be better, and there is no gap between its judgment and its action. What changes is the judgment itself, as time passes, in exactly the way that someone who prefers coffee in the morning and tea in the afternoon does not have a weakness of will but simply has time-indexed preferences. So what we have been calling "weakness of will," she said, is really just ordinary, unremarkable preference change over time, and the label "akrasia" has been doing a lot of work it cannot support.

  Dev pushed back on two fronts. First, he said the synchronous-judgment criterion is too narrow and quietly assumes the very thing in dispute. The hallmark of the hyperbolically discounting agent is that it *knows* its future self will flip: at the planning stage it judges that it would be better to follow the plan, and at the moment of temptation it does the impulsive thing anyway. So there is a violated judgment after all — just a diachronic or higher-order one, a judgment about what the agent ought to do given what it knows about its own future behavior. Second, he said that the move "I override my past self all the time, that is just how I change my mind" is doing too much work. Changing one's mind in light of new evidence is one thing; being systematically captured by a transient, steeply-discounted impulse is another. The signature of the hyperbolic agent, he said, is precisely that it would *pay to precommit* — it would prefer to be a creature that does not have this preference-reversal property, but it cannot bring itself to be one. That "I know I should commit but I cannot" is, he argued, the very signature of weakness of will, not its absence.

  Mara conceded that the agent would pay to precommit, but said that fact does not make it akratic; it only makes the agent's preferences *expensive*, in the way that a person with a strong but mistaken fear of flying is paying a cost. And she returned to the multiple-selves framing: if each time-slice is treated as a distinct agent, then the present slice is not violating any of its *own* judgments at all — it is just a different agent making a different choice, the way I can rationally refuse to honor a promise my younger self made. Dev replied that the multiple-selves framing does not dissolve the problem, it only relocates it. If the present slice is a different agent, then it is *harming* a future slice it genuinely cares about, which is a form of akrasia at the individual level; and the fact that the agent cannot "just make a plan and stick to it" is exactly the weakness of will that Mara wants to deny. They were still going when I had to leave, and I honestly could not tell who was more right. So please go through their exchange and tell me, move by move, who is right about which specific point — and then say what, if anything, both of them are missing.
reasoning: |-
  Okay, the user is grappling with a philosophical debate about whether hyperbolic discounting qualifies as akrasia (weakness of will). They witnessed a heated discussion between Mara and Dev, each presenting compelling arguments. Mara argues that hyperbolic discounting isn't akrasia because preferences are consistent at each moment, while Dev insists it's a classic case due to violated diachronic judgments and precommitment dilemmas.  

  First, I need to unpack Mara's core thesis: she claims akrasia requires synchronous inconsistency—acting against your *current* best judgment. By her definition, the hyperbolic discounter isn't akratic because at T=2 (when skipping the gym), they genuinely prefer leisure over exercise. Their earlier commitment at T=1 is irrelevant; it's just preference change over time, like switching from coffee to tea. Her multiple-selves analogy frames each time-slice as a distinct agent, making "breaking promises" to past selves rational.  

  Dev counters with two key points: (1) Synchronous consistency is a red herring—the true conflict is between the agent's *planned* judgment and their *action*. At T=1, they judge "I should gym at T=2," but at T=2 they act against that prior, endorsed plan. (2) The precommitment urge proves weakness of will: they'd *pay* to bind themselves because they recognize their future self's irrationality. Unlike ordinary preference shifts (e.g., new evidence), hyperbolic discounting involves predictable self-sabotage.  

  Now, evaluating their points:  
  - Mara is technically correct about *synchronous* akrasia (per Davidson/Bratman), but this feels like dodging the spirit of weakness of will. Her flying-phobia analogy misfires—fear isn't a *judgment* error but an emotional response, whereas hyperbolic discounting involves recursive self-distrust.  
  - Dev nails the phenomenology: the agony of "I knew I'd do this!" captures akrasia's essence. Philosophers like Holton or McClennen support his diachronic view. But he underplays how *all* preference changes could be pathologized under his framing.  

  Both miss nuances:  
  1. **Preference vs. Judgment**: Mara conflates "preferring X now" with "judging X best." One can *prefer* cake while *judging* salad better (true akrasia). Hyperbolic discounting blurs this—does the agent *judge* leisure better at T=2, or just desire it?  
  2. **Agency Unity**: Mara's multiple-selves model avoids synchronic akrasia but creates inter-temporal conflict. If future selves share identity, harming them *is* akratic.  
  3. **The Precommitment Test**: Dev's strongest point—only akratic agents seek precommitments. But does this apply to *all* time-inconsistent preferences? What if I "precommit" to morning coffee because I *genuinely* value it more then?  

  Verdict:  
  - Dev wins on capturing the *experience* of akrasia (self-frustration, precommitment urges).  
  - Mara wins on strict philosophical definitions but diminishes the problem's real-world weight.  
  - Both underdiscuss *why* hyperbolic discounting feels irrational: it violates rationality axioms (stationarity), while tea/coffee shifts don't.  

  User's deeper need: They want clarity on whether "rationalist" solutions (Ulysses contracts) truly address akrasia or misunderstand it. Answer: Yes—but only if akrasia includes diachronic failures of agency, not just synchronic ones.
answer: |-
  Let's break down Mara and Dev's debate point by point, drawing on philosophy (e.g., Davidson, Bratman), economics (hyperbolic discounting models), and psychology (akrasia literature). Neither is entirely wrong, but both oversimplify key aspects. Here's the analysis:

  ### **Mara's Core Argument: Hyperbolic Discounting ≠ Akrasia**
  1. **Synchronous Judgment Criterion**:  
     Mara insists akrasia requires acting against your *current* best judgment at the moment of action (e.g., "I know I should go to the gym *right now*, but I scroll TikTok instead"). Hyperbolic discounting fails this: at T=2 (the "temptation" moment), the agent genuinely prefers the immediate reward (e.g., leisure) and acts consistently.  
     - **Why this has merit**: Classical philosophers (e.g., Donald Davidson) define akrasia as synchronic conflict between judgment and action. Mara is correct that hyperbolic discounting involves *preference reversals* (like switching from coffee to tea), not synchronic self-contradiction.  

  2. **Preference Change vs. Weakness of Will**:  
     She analogizes hyperbolic discounting to innocuous time-indexed preferences (morning coffee vs. afternoon tea). The agent isn't "weak-willed" but simply has context-dependent preferences.  
     - **Strength**: This aligns with revealed preference theory in economics: if choices reflect consistent preferences at each moment, there's no irrationality.  

  3. **Multiple-Selves Defense**:  
     Treating each time-slice as a distinct agent, the "present self" isn't violating its own judgment—it's rationally pursuing its current interests, just as we might ignore a past self's outdated promise.  
     - **Strength**: Avoids pathologizing ordinary preference changes.  

  ### **Dev's Core Argument: Hyperbolic Discounting = Akrasia**
  1. **Diachronic Judgment Violation**:  
     Dev argues that akrasia isn't limited to synchronic conflict. At T=1 (planning), the agent judges that *following the plan* (e.g., gym at T=2) is best overall. At T=2, they act against that prior, endorsed judgment. The "violated judgment" is the agent's *diachronic* commitment.  
     - **Why this has merit**: Philosophers like Richard Holton and Michael Bratman emphasize that intentions/plans *are* judgments about future action. Hyperbolic discounting involves abandoning prior intentions despite no new information—a hallmark of weak-willed action.  

  2. **The Precommitment Test**:  
     Dev's key insight: The hyperbolic agent *would pay to precommit* (e.g., bet money they’ll go to the gym). This reveals a conflict between the agent's "meta-judgment" (I wish I were the type who sticks to plans) and their actions.  
     - **Strength**: This captures the *self-defeating* nature of akrasia. Unlike Mara's coffee/tea example, the agent regrets their preference reversal and seeks to "bind" themselves (like Ulysses).  

  3. **Systematic Self-Sabotage**:  
     Unlike rational preference shifts (e.g., new evidence), hyperbolic discounting involves predictable, transient impulses the agent *disavows* at the planning stage. Dev argues this is akrasia’s essence: being "captured" by a local impulse against your global values.  

  ### **Who Wins Each Point?**
  - **Synchronous Judgment (Mara's Point)**:  
    Mara wins *technically*—hyperbolic discounting isn't synchronic akrasia per Davidson. But Dev is right that this definition is too narrow. Modern philosophers (e.g., Sarah Paul) expand akrasia to include diachronic failures.  
    - **Verdict**: Mara's strict criterion is defensible but incomplete.  

  - **Preference Change Analogy (Mara's Coffee/Tea Example)**:  
    Mara overreaches. Coffee/tea preferences lack the *self-referential conflict* of hyperbolic discounting. No one pays to precommit to drinking tea. Dev wins: hyperbolic discounting involves a "tragic" structure where the agent is at war with their own future selves.  

  - **Multiple-Selves Framing (Mara's Defense)**:  
    Mara's analogy fails. If time-slices are "distinct agents," why does the agent care about precommitment? Real agents have *cross-temporal identity*—they care about future well-being. Dev wins: the present self *harms* the future self it identifies with, creating an intra-personal conflict akin to akrasia.  

  - **Precommitment Urge (Dev's Key Point)**:  
    Dev wins decisively. The fact that hyperbolic agents seek Ulysses contracts reveals a *judgment* that their future preferences are untrustworthy. This is absent in benign preference shifts (e.g., seasonal food cravings).  

  - **Systematic Capture (Dev's Second Front)**:  
    Dev wins. Hyperbolic discounting isn't just "changing your mind"—it’s a predictable cycle of planning and capitulation the agent laments. This mirrors Aristotle’s description of akrasia as "knowing better but doing otherwise."  

  ### **What Both Are Missing**
  1. **The Role of Judgment vs. Preference**:  
     Both conflate "preference" (what I want) with "judgment" (what I deem best). Akrasia requires a normative judgment ("I should do X") overridden by desire. In hyperbolic discounting, does the agent *judge* gym-going best at T=2? Or does their judgment *change* with their preference?  
     - **Key Insight**: If the agent *endorses* their T=2 preference ("I now think leisure is best"), it’s not akrasia. If they feel "swept away" by impulse while judging gym better, it is. Hyperbolic models often leave this ambiguous.  

  2. **Two Types of Akrasia?**:  
     Philosophers distinguish:  
     - **Synchronic akrasia**: Acting against current judgment (e.g., "I should stop scrolling now but can't").  
     - **Diachronic akrasia**: Abandoning prior plans/intentions (e.g., "I vowed to gym daily, but I skip").  
     Hyperbolic discounting fits diachronic akrasia perfectly. Mara ignores this; Dev underemphasizes the distinction.  

  3. **Hyperbolic Discounting Isn't Always Irrational**:  
     Both treat preference reversals as flaws, but sometimes context *should* shift preferences (e.g., fatigue making gym unsafe). Dev’s "systematic capture" point only holds if reversals are *globally disavowed*.  

  4. **The Self-Binding Paradox**:  
     Why would a rational agent precommit? Mara dismisses this as "expensive preferences," but it reveals a *hierarchy of values*: the agent values "being a planner" more than momentary desires. This hierarchical conflict is akrasia’s heart (Frankfurt, Bratman).  

  ### **Synthesis: Who’s More Right?**
  - **Dev wins the overall debate**. He correctly identifies hyperbolic discounting as a mechanism for *diachronic akrasia*—violating prior, reflective judgments due to transient impulses. The precommitment impulse is the smoking gun: it shows the agent recognizes their "weakness."  
  - **Mara is right that it’s not *synchronic* akrasia**, but her definition is dated. Modern accounts (e.g., in neuroeconomics) treat time inconsistency as a core form of weakness of will.  
  - **The core conflation**: Rationalists often *expand* "akrasia" to include hyperbolic discounting, while some philosophers retain a narrower view. Both are valid, but Dev’s framing better explains why we feel "guilty" for procrastinating or overeating—we’re failing our *own* standards.  

  **Final Takeaway**: Hyperbolic discounting isn't merely preference change—it’s a predictable failure of *diachronic self-governance*. When an agent disavows their future self’s preferences and seeks precommitment, they’re confessing to akrasia. Mara’s view risks normalizing self-sabotage; Dev’s nails why it feels like a battle against oneself.
