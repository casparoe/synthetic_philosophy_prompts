  Now, the second part: what are both missing about the relationship between the premise/conclusion orderings and the impossibility result?

  The key is that both the premise-based and conclusion-based methods are specific aggregation procedures that avoid the inconsistency by sacrificing one of the desiderata. The impossibility result (List and Pettit, 2002) shows that no aggregation procedure can satisfy:
  - Unrestricted domain (any profile of consistent individual judgments is allowed)
  - Collective rationality (the group judgment is consistent and complete)
  - Systematicity (the group judgment on each proposition is determined in the same way, by looking only at the individual judgments on that proposition, and by a proposition-wise majority-like rule)

  The premise-based method violates systematicity because the conclusion is not voted on independently but derived from the premises. The conclusion-based method, if we vote only on the conclusion and ignore the premises (or derive the premises from the conclusion? which is not straightforward), would also violate systematicity and also collective rationality (if we then derive the premises, we might get inconsistency with the voted conclusion). 

  But note: the conclusion-based method as described by Dev is to vote on the conclusion and then let the premises be? Or vote on the conclusion and then derive the premises? That might not be possible. Typically, the conclusion-based method in the literature is to vote only on the conclusion and not on the premises. Then the group does not take a stand on the premises, so collective completeness is sacrificed. Alternatively, if the group votes on both but gives priority to the conclusion, then we might have inconsistency in the premises.

  So both methods are workarounds that violate one or more of the conditions. The domain restriction (as in List, 2003) avoids the dilemma by restricting the set of profiles (unrestricted domain is violated) so that the majority judgment is always consistent. This is achieved when the agenda of propositions has a certain structure (e.g., being "medially" structured).

  Therefore, "pick an ordering" (premise or conclusion) is not a genuine escape from the impossibility because it does not satisfy all the desiderata. It is a choice of which property to sacrifice. The premise-based method sacrifices the independence of the conclusion (it is not voted on independently) and also might sacrifice the completeness of the individual judgments on the premises (if we only derive the conclusion, we don't vote on the conclusion, so the group judgment on the conclusion is not directly expressed by the members). Similarly, the conclusion-based method sacrifices the group's judgment on the premises (if we don't vote on them) or risks inconsistency (if we do vote on them but after the conclusion).

  The domain restriction, on the other hand, is a genuine escape because it allows for a majoritarian aggregation that satisfies collective rationality and systematicity, but only for a restricted set of profiles (so unrestricted domain is sacrificed). The cost is that we cannot allow any possible profile of individual judgments. In practice, this means that the group must be such that their judgments are not too diverse, which might be a substantive limitation in a pluralistic society.

  So both Marina and Dev are missing that the two methods (premise-based and conclusion-based) are both partial solutions that violate some of the conditions of the impossibility theorem. Neither is a perfect solution. The domain restriction is a different kind of solution that avoids the dilemma by limiting the inputs, which is a cost in terms of the range of opinions the group can handle.

  Moreover, they might be missing that the choice between premise-based and conclusion-based methods is not just a matter of preference but a substantive decision about what the group values more: collective consistency (premise-based) or direct expression of the bottom line (conclusion-based) and the avoidance of strategic manipulation (as Dev argued). But neither method satisfies all the original conditions.

  Finally, note that the impossibility result holds for any aggregation rule that tries to satisfy all three conditions. The two methods they are debating are specific rules that drop one or more conditions. The domain restriction is a way to keep a rule (like majority voting) that satisfies systematicity and collective rationality but only for a restricted set of inputs.

  Therefore, the domain restriction is a genuine escape from the impossibility, but at the cost of limiting the domain of allowable individual judgments. The premise/conclusion orderings are not an escape but a choice of which condition to drop.
