  I'm a third year PhD student in philosophy of history and I keep going back and forth between the covering-law model (Hempel, nomological subsumption) and the narrative-explanation side (the Hayden White line, emplotment, history as story), and reading about the debate just isnt clicking for me. Can you write me a short story that lets me feel the difference instead of just describing it? Setup: a historian has to write a memorial for a close colleague who just died, and the story stages both ways of explaining that death. One part does the covering-law move—find a law-like generalization plus the initial conditions that subsume this particular case. The other part does the narrative move—shape it into a story with character and a plot so it reads as an intelligible life. What I really want is for the reader to feel, through how the two sections actually read, why the covering-law version goes thin and empty for a single unrepeatable person while the narrative one carries the weight. Please keep it literary and don't turn it into a lecture or a philosophy paper in prose—let the form do the arguing.
