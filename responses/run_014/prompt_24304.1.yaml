answer: |-
  ## Joint Statement on Diachronic Rationality and Money Pumps  
  **Agreed by Representatives of Synchronic Rationality (SR) and Diachronic Rationality (DR)**  
  *Adversarial Collaboration Draft, October 2023*  

  ### Preamble  
  We, proponents of SR and DR, agree on the descriptive mechanics of money pumps and Dutch books while diverging on their normative implications for rationality. This document clarifies shared ground and precise disagreements.  

  ---

  ### Section 1: Agreed Claims  
  1. **Money Pump Definition**: A money pump is a sequence of transactions where an agent, offered choices individually acceptable under their current beliefs/preferences, is guaranteed (or highly likely) to incur a net loss.  
  2. **Dutch Book Theorem**: An agent with probabilistically incoherent credences (violating Kolmogorov axioms) can be offered a set of bets, each appearing fair or favorable individually, that collectively guarantee a loss.  
  3. **Exploitability Mechanics**:  
     - Incoherent credences enable a Dutch book.  
     - Intransitive preferences (e.g., A≻B, B≻C, C≻A) enable a money pump via a cycle of trades.  
     - Non-stationary preferences/credences (e.g., time-inconsistent discounting) may enable exploitation through sequential offers.  
  4. **Local-Global Tension**: An agent maximizing expected utility (EU) at each decision node, using current beliefs/preferences, may accept every step of a money pump sequence.  
  5. **AI Relevance**: For artificial agents making sequential decisions, this debate directly impacts the design of belief-updating and preference-stability constraints.  

  ---

  ### Section 2: Disagreements Table  
  | **Disagreement**                                                                 | **SR Position**                                                                 | **DR Position**                                                                 | **Crux Question**                                                                                                                                 | **Test Case / Evidence**                                                                                                                               | **SR Prediction**                                                                 | **DR Prediction**                                                                | **Nature of Dispute** |  
  |----------------------------------------------------------------------------------|---------------------------------------------------------------------------------|---------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------|----------------------------------------------------------------------------------|----------------------|  
  | **1. Normative Status of Pumpability**                                           | Pumpability reveals instrumental risk, not inherent irrationality. Refusing locally EU-optimal choices to avoid future exploitation violates synchronic rationality. | Pumpability is a constitutive flaw in rationality. A rational agent must be unexploitable; diachronic coherence is a necessary condition for rationality. | *Is avoiding guaranteed exploitability a core requirement of rationality, or merely a practical heuristic?*                                                                 | **Case**: An agent with intransitive preferences (A≻B, B≻C, C≻A) faces a known money-pump sequence. Must they precommit to refusing any trade?          | Refusing a locally optimal trade is irrational; better to accept and "patch" preferences later. | Refusing is rational; unexploitability is primary.                               | Substantive          |  
  | **2. Authority in Decision Conflicts**                                           | When synchronic EU-maximization clashes with diachronic coherence, the former governs. A "rational" choice is defined solely at the decision node. | When synchronic EU-maximization conflicts with diachronic coherence, the latter governs. A sequence of "locally rational" choices can be globally irrational. | *In a conflict, does synchronic or diachronic coherence take priority?*                                                                          | **Case**: An agent discounts hyperbolically (βδ-model). Offered $100 now or $110 tomorrow, they take $100. Offered $100 in 30 days or $110 in 31 days, they prefer $110. Is taking $100 now rational? | Taking $100 now is rational (maximizes EU at t=0). | Taking $100 now is irrational (violates stationarity; enables exploitation by others). | Substantive          |  
  | **3. Unit of Rational Agency**                                                   | Rationality applies to time-slice agents ("selves"). The present self owes no duties to future selves; it may rationally sacrifice future utility for present gain. | Rationality applies to the temporally extended agent. The present self must act as a fiduciary for future selves, enforcing cross-temporal consistency. | *Is the rational agent a momentary decision-maker or a persistent entity over time?*                                                            | **Case**: A naïve hyperbolic discounter knowingly avoids a commitment mechanism (e.g., locking savings). Is this avoidance rational?                    | Avoidance is rational (present self maximizes its EU).                             | Avoidance is irrational (violates extended agency; enables self-exploitation).   | Substantive          |  
  | **4. Role of Commitment Mechanisms**                                             | Commitment devices (e.g., precommitment contracts) are instrumentally useful but not rationally obligatory. Using them reflects preference adaptation, not a rationality constraint. | Commitment devices are rationally mandatory when they prevent foreseeable incoherence. Refusing to precommit is irrational if it enables exploitation. | *Is foresight of future incoherence sufficient to make precommitment rationally required?*                                                       | **Case**: An agent knows they will face a known Dutch book unless they precommit to coherent credences today. Must they precommit?                      | Precommitment is optional; updating beliefs later is rational.                     | Precommitment is obligatory; failure is irrational.                              | Substantive          |  

  ---

  ### Section 3: Synthesis of Disputes  
  1. **Verbal Disagreement**: None. Both sides use "rationality" normatively but disagree on its *scope* (temporal and agential boundaries) and *content* (whether unexploitability is intrinsic to rationality).  
  2. **Substantive Cruxes**: The four disagreements above are genuine. Resolving them requires:  
     - A meta-normative theory of whether rationality is solely criterion-based (SR) or also goal-based (avoiding guaranteed loss, DR).  
     - Empirical work on whether humans/AIs with DR constraints outperform SR agents in iterated environments.  
     - Philosophical analysis of personal identity over time (Crux 3).  
  3. **Predictive Divergence**: SR expects DR constraints to reduce flexibility in dynamic environments; DR expects SR agents to be systematically exploited by adversarial actors.  

  ---  
  **Signatories**  
  [Name], Synchronic Rationality Camp  
  [Name], Diachronic Rationality Camp  

  ---  
  **Notes for Implementation in AI**  
  - SR Approach: Optimize per-step EU with online belief updates (e.g., Bayesian RL).  
  - DR Approach: Add constraints (e.g., preference stability penalties, precommitment APIs) to ensure unexploitability.  
  - Both agree: In non-adversarial environments with no exploitation risk, SR and DR often converge.
