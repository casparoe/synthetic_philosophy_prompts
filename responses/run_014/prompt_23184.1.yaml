answer: |-
  Here’s a dialogue between two philosophers of science, **Alex** (who argues old evidence *cannot* confirm a new theory in the standard Bayesian sense) and **Sam** (who argues it *can*). They’re grounded in the Mercury perihelion example, but touch on deeper conceptual issues. Both engage directly with each other’s points:

  ---

  **Setting:** *A coffee shop after a philosophy of science conference. Sam stirs their coffee, eyeing Alex’s skeptical expression.*

  **Sam:** Alex, I still think you’re too dismissive about old evidence. Take Mercury’s perihelion precession—it was *the* unsolved problem in celestial mechanics for decades. Then Einstein publishes GR, *derives* the exact 43 arcseconds per century from pure theory, and suddenly it’s a triumph. How is that *not* confirmation?

  **Alex:** Because confirmation requires *raising* a theory’s probability via evidence. But in the Bayesian framework, if the evidence *e* (Mercury’s orbit) was already known with certainty *before* GR was proposed, then *P(e) = 1*. And if *P(e) = 1*, then by Bayes’ theorem, *P(GR|e) = P(GR)*. The probability doesn’t budge! It’s mathematically inert.

  **Sam:** But that’s the rub—you’re treating *e* as a static fact. Before GR, Mercury’s orbit wasn’t just "known"; it was an **anomaly**. Newtonian mechanics couldn’t explain it, so *e* wasn’t fully absorbed into our background knowledge. It was a live problem screaming for resolution. When GR explains it, that *resolution* is new information.

  **Alex:** Okay, but how does that translate to probabilities? Let’s say I’m a Bayesian agent in 1915. I already know *e*. My credence for *e* is 1. Einstein says, "My theory predicts *e*." Great! But since I already know *e*, learning that GR entails it doesn’t teach me anything new about the world. It’s like being surprised that a known apple is red, then learning a new theory "predicts" apples are red. Why should that boost the theory?

  **Sam:** Because you’re ignoring the **counterfactual**! Before GR, what was *P(e | Newton)*? Close to 1, but not quite—Newtonians were hunting for Vulcan or fiddling with parameters. Worse, *P(e | ~Newton)* was a mystery—no competitor could explain it. When GR arrives, we see *P(e | GR) ≈ 1* while *P(e | Alternatives) ≪ 1*. That contrast *is* new information. We learn GR uniquely solves a persistent puzzle.

  **Alex:** But Sam, *P(e | GR)* being high doesn’t matter if *e* is already certain! Let me formalize it:  
  - *P(GR | e) = [P(e | GR) × P(GR)] / P(e)*  
  If *P(e) = 1* and *P(e | GR) = 1*, this reduces to *P(GR | e) = P(GR)*. Zero confirmation. Your "contrast" doesn’t enter the equation.

  **Sam:** Then maybe we shouldn’t set *P(e) = 1*. If *e* was an anomaly, it was probabilistically *isolated*—not fully integrated. When GR explains it, we effectively **re-conditionalize**. Imagine I temporarily "forget" that *e* is known. I ask: "If I *didn’t* know about Mercury’s orbit, how much would *predicting* it support GR?" The answer is "a lot!" Then I remember, "Oh right, it *does* fit." That mental reset captures why scientists feel confirmed.

  **Alex:** That’s psychologizing, not Bayesianism! "Forgetting" is subjective. The formalism demands we conditionalize on *all* we know. If *e* is in the background knowledge (*K*), then *P(GR | K) = P(GR | e, K)*—because *e* is part of *K*. No boost. We can’t cherry-pick which knowledge to "forget."

  **Sam:** But anomalies *aren’t* inert parts of *K*—they’re **tensions** in *K*. Bayesianism needs to account for that. Look at the periodic table: Mendeleev used known elements to predict new ones (e.g., gallium), but he also *retrodicted* corrections (e.g., atomic weights). Those retrodictions—old evidence—boosted confidence in his table. Chemists didn’t say, "We already knew the weights, so no confirmation."

  **Alex:** And they were right—but not for Bayesian reasons! The old evidence was **reinterpreted** in light of the new theory. Mercury’s orbit didn’t change; its *relationship to theory* did. But that’s about the theory’s unifying power or elegance—not confirmation qua probability-raising. Maybe we should call it "explanatory satisfaction," not confirmation.

  **Sam:** Ah, but that’s where you concede the point! If explaining old anomalies makes scientists rationally *more confident* in GR—enough to accept its radical spacetime curvature—then Bayesianism *must* capture that, or it’s inadequate. Here’s a fix: when *e* was anomalous, *P(e | K) < 1* because *K* contained competing theories failing to explain *e*. GR *raises* the probability of *e* by resolving the anomaly—so *P(GR | e) > P(GR)* after all.

  **Alex:** But *P(e | K) < 1* would mean scientists weren’t *certain* of Mercury’s orbit pre-GR, which is absurd! They measured it meticulously. The uncertainty wasn’t about *e* itself, but about *why e held*. Bayesianism deals in *what* we know, not *why* we’re puzzled.

  **Sam:** Exactly—so perhaps we need to include the **anomaly status** in *K*. Let *A* = "e is an unexplained anomaly." Then when GR explains *e*, we learn *P(e | GR, K) = 1* while *P(e | ~GR, K) < 1*. *Now* Bayes’ theorem gives *P(GR | e, A) > P(GR | A)*. The old evidence confirms relative to the anomaly context.

  **Alex:** Hmm... that’s clever. But isn’t *A* just a psychological label? If *e* is deducible from past observations, *P(e | K)* *should* be 1. Calling it an "anomaly" feels like smuggling in pragmatic factors.

  **Sam:** Not pragmatic—**structural**. Anomalies reveal gaps in the theoretical network. Plugging a gap strengthens the whole structure. Bayesianism models that by recognizing that *P(e | K)* isn’t monolithic; it depends on *which theories K includes*. When GR arrives, *K* expands, and *e*’s probability *given the old rivals* drops—making GR shine.

  **Alex:** ...I’ll admit that saves intuition. But the purist in me says: if you want strict confirmation, wait for *new* predictions. GR’s 1919 eclipse test *did* raise its probability because *P(starlight bending) < 1* pre-observation. Mercury’s orbit is why GR seemed *plausible*—not why it was *probably true*.

  **Sam:** Fair—but without Mercury, would anyone have taken GR seriously enough to test it? Old evidence isn’t the hammer; it’s the crowbar that pries open the door for new theories to *be* tested. And in that role, it’s indispensable.

  **Alex:** *[Smiles]* So we agree: it’s not confirmation in the textbook Bayesian sense, but it’s rationally compelling for other reasons.

  **Sam:** Or... textbook Bayesianism needs a footnote: "Anomalies are special." Pass the sugar?

  ---

  ### Key Issues Explored:
  1. **The Bayesian Formal Problem:** If *P(e) = 1*, *e* cannot raise *P(T|e)*.  
  2. **The Anomaly Loophole:** Unresolved anomalies may mean *P(e | background knowledge) < 1*, restoring confirmatory power.  
  3. **Explanation vs. Confirmation:** Explaining *e* may not raise *P(T)* if *e* is certain, but it resolves tension in the web of belief.  
  4. **Pragmatic vs. Formal:** Scientists *treat* anomaly-resolution as confirmation, suggesting Bayesianism may need refinement.  

  This mirrors real debates (e.g., Glymour vs. Garber/Earman). The takeaway: whether old evidence "confirms" depends on how we model background knowledge and anomalies—and whether Bayesianism should accommodate scientific practice.
