  I recall that philosophers like Hobbes and Locke have debated this, with functionalists emphasizing purpose over material. The harbor setting with ceremonial duties adds a layer of institutional intentionality - the ship's identity is tied to its role in community rituals. The rot-resistant timber detail suggests material is secondary to function, as replacements are designed to maintain integrity.

  For my argument, I'll need to establish that artifacts derive identity from purpose. A ship isn't just wood - it's a vessel commissioned for specific duties. The continuous service creates an unbroken thread of identity through each voyage, repair, and crew shift. When authority transfers a ship's commission to a new hull, that's when identity shifts, but here no such transfer occurs.

  The strongest counterargument will be material-based: the reassembled ship has more original planks. I'll counter that material similarity alone doesn't capture "ship-ness" - a pile of planks has identical material but isn't a ship. The reassembled hull lacks the history of service; it's merely a replica. 

