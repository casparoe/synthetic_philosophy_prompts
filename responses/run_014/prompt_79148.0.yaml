prompt: |-
  I have recently become the analyst who prepares the risk assessments on which my agency's scientific advisory committee decides whether to adopt a proposed intervention. My colleagues keep handing me a single best-estimate number for the relevant probability, and I no longer think that number is honest: what we actually have is a set of disagreeing estimates, a model identified only within bounds, and sparse data. Once the probability is a set rather than a point, expected-utility maximisation stops telling me what to do, and I know there are rival replacements -- maximin (do as well as possible in the worst case), maximin expected utility (do as well as possible under the worst admissible distribution), Hurwicz (a blend of the best and worst cases), E-admissibility (admit any option that is optimal under some admissible distribution), and maximality (admit any option that no other option beats under every admissible distribution). Write me a procedure my team can run on any proposal, within about a week and recorded on a page: how to elicit, bound and record the set; how to choose among these rules and defend the choice, given that choosing a rule is itself a decision under the uncertainty we are trying to handle; what to do when the rules disagree; how to avoid the trap in which collecting more evidence makes the set wider rather than narrower; where the procedure stops with a no; and where it must hand the decision to a named person because the residual question is how much risk we are willing to accept rather than a question of fact. Then run it on two proposals -- a screening programme whose benefit and harm are both uncertain, and a novel vector-control intervention with an imprecise ecological risk -- including one whose answer I will not like, and close by saying what the procedure cannot settle.
reasoning: |-
  We are designing a procedure for risk assessment when probabilities are sets (or intervals, or more generally, uncertainty sets) rather than point estimates. The procedure must be executable within about a week and recorded on one page. It should cover:

  1. Elicitation, bounding, and recording of the uncertainty set for the probability.
  2. Choosing among decision rules (maximin, maximin expected utility, Hurwicz, E-admissibility, maximality) and defending the choice.
  3. Handling disagreements among the rules.
  4. Avoiding the trap where more evidence widens the set.
  5. When to stop with a "no" and when to hand the decision to a named person (for value judgments).

  We'll structure the procedure as follows:

  **Procedure for Risk Assessment under Deep Uncertainty**

  **Step 1: Elicit and bound the uncertainty set for the probability (2 days)**
     - Gather all available data, models, and expert judgments.
     - For each source of uncertainty (disagreement among estimates, model bounds, sparse data), represent the uncertainty as an interval or a set of possible probabilities.
     - Combine these into a single uncertainty set, S, for the probability of the key event (e.g., harm from intervention). This set could be an interval [p_min, p_max] or a more complex set if necessary.
     - Record: S, the sources, and the reasoning for the bounds.

  **Step 2: Choose decision rule(s) (1 day)**
     - Since choosing a rule is a decision under uncertainty, we pre-specify a rule for choosing rules based on the nature of S and the stakes:
          a) If the stakes are high (catastrophic losses possible) and S is wide, use maximin or maximin expected utility (if we can assign a set of priors) to avoid worst-case disasters.
          b) If the stakes are moderate and we have some optimism, use Hurwicz with a coefficient α (between 0 and 1) that reflects our degree of optimism (e.g., α=0.5 for neutral). We set α by agency policy or by committee vote on the level of optimism.
          c) If we want to avoid ruling out options that might be good, use E-admissibility or maximality. These are more permissive and might be used when we are more uncertain and want to keep options open.
     - Defend the choice by the agency's risk attitude (pre-specified in charter: e.g., "We are cautious about catastrophic risks") and the width of S. If in doubt, use multiple rules and proceed to Step 4.

  **Step 3: Compute the recommendation for each rule (1 day)**
     - For the chosen rule(s), compute the recommended decision (adopt or reject) based on the utility model (which we assume is given or can be simply modeled by net benefit = benefit - harm).

  **Step 4: Handle disagreement among rules (1 day)**
     - If all rules agree, adopt that recommendation.
     - If they disagree:
          - If the disagreement is due to a few outlier scenarios, re-examine the uncertainty set S (tighten if possible) and re-run.
          - Else, if the decision is time-sensitive, use a tie-breaking rule: by agency policy, the more cautious rule (e.g., maximin) wins when in doubt about high-stakes harms.
          - If not time-sensitive, flag for more evidence (go to Step 5) or hand to the named person (Step 6).

  **Step 5: Collect more evidence? (1 day)**
     - To avoid widening the set, only collect evidence that can narrow S. Design a study or analysis that can reduce the range (e.g., a pilot study targeting the biggest uncertainty). If such evidence is available and feasible within the decision timeline, do so and update S. Then restart from Step 1.
     - If no such evidence is available, or the set remains wide, proceed to Step 6.

  **Step 6: Hand to named person (1 day)**
     - When the residual uncertainty is about risk tolerance (how much risk we are willing to accept) and not about facts, hand the decision to the named person (e.g., the agency director) with a clear summary of the uncertainty set S and the range of expected utilities for each option. The named person decides based on the agency's risk appetite.

  **Stopping with "no":**
     - The process stops with a "no" (reject the intervention) if:
          a) Under maximin (or the chosen rule) the worst-case scenario is unacceptable (e.g., catastrophic harm with no offsetting benefit).
          b) The uncertainty set S is so wide that even the best-case scenario does not show a net benefit (if we are using Hurwicz and the best case is still negative, then reject).

  **Procedure Output:**
     - A one-page report with:
          1. Uncertainty set S for the probability(ies) of key events.
          2. Chosen decision rule(s) and why.
          3. Recommendation from each rule.
          4. Final decision (adopt, reject, or hand to named person) and reason.

  Now, we run the procedure on two proposals.

  **Proposal 1: Screening Programme**
     - Benefit: early detection of disease (reduces mortality), but uncertain because of overdiagnosis and false positives.
     - Harm: psychological distress, unnecessary treatments, and direct harm from screening.
     - We have sparse data and model uncertainty.

  *Step 1: Elicit uncertainty set for net benefit probability*
     - Let p be the probability that the screening does more harm than good for a randomly selected individual. We have:
          - Expert estimates: [0.1, 0.3] from one group, [0.05, 0.2] from another, and a model that gives [0.15, 0.25] due to parameter uncertainty.
          - Combined, we take S = [0.05, 0.3] (the convex hull of all intervals).
     - Record: S = [0.05, 0.3] for the probability of net harm.

  *Step 2: Choose decision rule*
     - The stakes: moderate (harm is not catastrophic but can be significant). Agency policy is cautious but not extreme. We choose Hurwicz with α=0.3 (slightly optimistic) because we are hopeful about the benefits and the harm is not catastrophic.

  *Step 3: Compute*
     - We need utilities. Assume:
          - If net benefit: utility = 1 (per person)
          - If net harm: utility = -2 (because harm is considered twice as bad as the benefit is good)
     - Then the expected utility (EU) for adopting the programme is:
          EU = (1 - p) * 1 + p * (-2) = 1 - 3p
     - For Hurwicz: we consider the best and worst EU over S.
          - Best case (p=0.05): EU = 1 - 3*0.05 = 0.85
          - Worst case (p=0.3): EU = 1 - 3*0.3 = 0.1
          - Hurwicz EU = α * best + (1-α) * worst = 0.3*0.85 + 0.7*0.1 = 0.255 + 0.07 = 0.325
     - Compare to not adopting (EU=0). Since 0.325>0, adopt.

  *Step 4: Check other rules for disagreement?*
     - We only used Hurwicz, but let's check others for robustness:
          - Maximin: worst EU=0.1 (which is >0), so adopt.
          - Maximin EU (if we had multiple priors, but we have an interval, so same as maximin) -> adopt.
          - E-admissibility: for any p in [0.05,0.3], the EU of adopting is 1-3p. This is positive when p<1/3. Since 0.3<1/3, then for every p in S, adopting is better than not (EU=0). So adopt.
          - Maximality: same as above, no other option (not adopting) beats adopting in every scenario (because when p<1/3, adopting is better; when p>1/3, it would be worse, but our S only goes up to 0.3, and 0.3<1/3). So adopt.
     - All rules agree: adopt.

  *Step 5: More evidence?* Not needed because we have agreement and the worst-case EU is still positive.

  *Step 6: Not needed.*

  *Output:* Adopt the screening programme.

  **Proposal 2: Novel Vector-Control Intervention**
     - This is a genetic modification of mosquitoes to reduce disease transmission, but there is ecological risk: the modified genes might spread beyond target area and harm ecosystems.
     - Benefit: reduce disease burden (e.g., malaria).
     - Harm: uncertain ecological disruption, which could be catastrophic.

  *Step 1: Elicit uncertainty set*
     - We have very sparse data and model uncertainty. Experts disagree:
          - Optimistic model: probability of ecological harm p in [0.001, 0.01]
          - Pessimistic model: p in [0.05, 0.2]
          - Also, the magnitude of harm is highly uncertain: if harm occurs, it could be moderate (utility = -100) or catastrophic (utility = -10000). We must account for this.
     - We break the problem:
          Let p be the probability of ecological harm.
          Let q be the conditional probability that, given harm occurs, it is catastrophic (vs moderate). We have:
              - p: we take the union of the two models: [0.001, 0.2]
              - q: experts give [0.1, 0.5] (i.e., 10% to 50% chance that harm, if it occurs, is catastrophic).
     - Utilities:
          - Benefit (if no harm): utility = 100 (from reduced disease)
          - If harm occurs and is moderate: utility = 100 - 100 = 0? But note the benefit is still there? Actually, the harm might be in addition. Let's define:
              - If no ecological harm: utility = 100 (just the benefit)
              - If moderate harm: utility = 100 - 100 = 0 (so net zero)
              - If catastrophic harm: utility = 100 - 10000 = -9900
          - But note: the benefit might be independent of the harm? We assume the benefit occurs regardless, but then we subtract the harm.
          - Alternatively, we might model: 
              - With probability (1-p): utility = 100
              - With probability p*(1-q): utility = 100 - 100 = 0
              - With probability p*q: utility = 100 - 10000 = -9900
          - So expected utility (EU) = 100*(1-p) + 0*(p*(1-q)) + (-9900)*(p*q) = 100 - 100p - 9900*p*q = 100 - 100p (1 + 99q)

  *Step 2: Choose decision rule*
     - Stakes: catastrophic loss possible (if catastrophic harm occurs). Agency policy is very cautious about catastrophes. We choose maximin (because we want to avoid the worst-case scenario).

  *Step 3: Compute*
     - We need to find the worst-case EU over the uncertainty set: p in [0.001, 0.2] and q in [0.1, 0.5].
     - The expression: EU = 100 - 100p (1 + 99q)
          This is decreasing in both p and q. So the worst case (minimum EU) occurs at p=0.2 and q=0.5.
          Worst EU = 100 - 100*0.2*(1+99*0.5) = 100 - 20*(1+49.5) = 100 - 20*50.5 = 100 - 1010 = -910

     - Compare to not doing the intervention: EU=0 (assuming status quo utility 0).

     - Under maximin, we choose the option with the best worst-case outcome. The worst-case EU for intervention is -910, which is worse than 0. So reject.

  *Step 4: Check other rules for disagreement?*
     - Hurwicz: We choose α. Since catastrophic risk, we are pessimistic. Set α=0 (only care about worst case) -> same as maximin: reject.
          But if we set α=0.1: 
              Best case: p=0.001, q=0.1 -> EU = 100 - 100*0.001*(1+99*0.1) = 100 - 0.1*(1+9.9) = 100 - 0.1*10.9 = 100-1.09=98.91
              Worst case: -910
              Hurwicz EU = 0.1*98.91 + 0.9*(-910) = 9.891 - 819 = -809.109 -> still negative, so reject.

     - Maximin expected utility: if we had a set of priors, we would take the worst prior. We are already using an interval, so same as maximin.

     - E-admissibility: Is the intervention optimal under some (p,q) in the set?
          We compare EU(intervention) and EU(not)=0.
          We need: 100 - 100p(1+99q) > 0
          => 100 > 100p(1+99q)
          => 1 > p(1+99q)

          The maximum of p(1+99q) in the set: when p=0.2, q=0.5 -> 0.2*50.5=10.1 > 1 -> so for that point, EU(intervention) is negative.
          But at p=0.001, q=0.1: p(1+99q)=0.001*(1+9.9)=0.001*10.9=0.0109<1 -> then EU>0.

          So for some (p,q) in the set, intervention is better, and for others, it's worse. Then intervention is E-admissible because there exists a prior (within the set) for which it is optimal.

     - Maximality: We must check if there is another option (not intervening) that beats intervention in every scenario? 
          Compare intervention vs not intervening:
              Intervention: EU = 100 - 100p(1+99q)
              Not: 0
          We need: Is there any (p,q) such that intervention is better? Yes (e.g., p=0.001, q=0.1). So not intervening does not beat intervention in every scenario. Therefore, intervention is maximal.

     - Disagreement: maximin and Hurwicz (with low α) say reject. E-admissibility and maximality say that intervention is admissible. So we have a disagreement.

  *Step 5: More evidence?*
     - We can try to narrow the uncertainty set, especially on the high end of p and q. But collecting evidence on catastrophic risks is hard. A pilot might not reveal much about the probability of catastrophe. We decide that more evidence is unlikely to narrow S sufficiently, especially for q (the chance that harm is catastrophic). So we skip.

  *Step 6: Hand to named person*
     - The residual issue is risk tolerance: are we willing to accept a small chance of catastrophic harm for the sake of the benefits? We hand to the agency director.

     - We summarize:
          - If we intervene, the expected utility could be as high as 98.91 (in the best case) and as low as -910 (in the worst case).
          - There is a scenario (p=0.001, q=0.1) where the intervention is beneficial (EU=98.91) and another (p=0.2, q=0.5) where it is disastrous (EU=-910).
          - The director must decide whether to take the risk.

     - The director, considering the agency's mandate and risk appetite, might reject the intervention because the catastrophic risk is too great (even though it is a low probability event, the consequences are extreme). This might be the answer you won't like.

  *Final decision:* Handed to the director, who rejects.

  **What the procedure cannot settle:**
     - The procedure cannot settle value judgments (how much risk we are willing to accept, especially for catastrophic events). It also cannot resolve fundamental scientific disagreements that lead to a wide uncertainty set when more evidence is not available. In such cases, the decision must be elevated.
answer: |-
  ### **Risk Assessment Procedure for Uncertain Probabilities**  
  *(One-Page Summary for Team Use)*  

  **1. Elicit & Bound the Uncertainty Set (Days 1-2)**  
     - **Inputs:** Collect all data, models, and expert estimates. Flag disagreements, model bounds, and data sparsity.  
     - **Elicitation:**  
       - For each uncertain parameter (e.g., probability of harm/benefit), experts provide *ranges* (e.g., [0.05, 0.3]) or scenarios (optimistic/pessimistic bounds).  
       - Use structured expert judgment (e.g., Delphi method) to reconcile disagreements.  
     - **Bounding:**  
       - Define the uncertainty set \(S\) as the convex hull of all estimates (e.g., interval \([p_{\text{min}}, p_{\text{max}}]\)).  
       - If models imply non-interval sets (e.g., "probability is low or high but not medium"), represent as disjoint intervals.  
     - **Recording:** Document \(S\), sources, and justification (e.g., "\(S = [0.1, 0.4]\) based on Models A, B and sparse field data").  

  **2. Choose Decision Rule (Day 3)**  
     - **Rule Selection Protocol (defended by agency policy):**  
       - **High-stakes harm?** (e.g., catastrophe risk) → **Maximin** or **Maximin Expected Utility** (avoid worst-case losses).  
       - **Moderate stakes with optimism?** → **Hurwicz** (blend best/worst cases). Set \(\alpha\) (optimism weight) via committee vote (e.g., \(\alpha = 0.3\) for caution).  
       - **Preserve optionality?** → **E-admissibility** or **Maximality** (avoid rejecting possibly optimal choices).  
     - **Defense:** "Our charter prioritizes avoiding catastrophe (e.g., bio-risk), thus we use Maximin when harm is irreversible. Hurwicz \(\alpha=0.3\) balances prudence with evidence."  
     - *Always compute all rules but pre-commit to one primary rule for consistency.*  

  **3. Resolve Rule Disagreements (Day 4)**  
     - **If rules agree →** Adopt/reject.  
     - **If rules disagree →**  
       - **Tighten \(S\):** Revisit evidence; exclude implausible extremes (e.g., "pessimist estimate assumes outdated model").  
       - **Tiebreakers:**  
         - Stakes are high → Favor **Maximin**.  
         - Options are irreplaceable → Favor **Maximality**.  
       - **Deadlock?** → Escalate to Step 5 or 6.  

  **4. Avoid Evidence Traps (Day 5)**  
     - **Before collecting new data:**  
       - Require a *falsifiability plan*: "This study will narrow \(S\) by targeting [specific uncertainty]."  
       - Reject evidence if it *increases* uncertainty (e.g., contradictory pilot results).  
     - **Update \(S\) only if:**  
       - New data reduces interval width (e.g., from \([0.1, 0.4]\) to \([0.15, 0.3]\)).  
       - If \(S\) widens, halt and use prior \(S\).  

  **5. Stopping Conditions & Handoff**  
     - **Stop with "No" if:**  
       - Maximin EU < 0 (worst-case loss is unacceptable).  
       - E-admissibility rejects *all* options.  
     - **Handoff to Named Person (e.g., Director):**  
       - When residual uncertainty is *value-laden* (e.g., "How much extinction risk is tolerable?").  
       - Document: "\(S\) is irreducible; decision hinges on risk tolerance."  

  ---  
  ### **Application to Proposals**  
  **Proposal 1: Cancer Screening Program**  
  - **Uncertainties:** Benefit (early detection) probability \(b \in [0.2, 0.4]\), harm (overdiagnosis) probability \(h \in [0.05, 0.15]\).  
  - **Utilities:** Benefit = +1 QALY, harm = −0.5 QALY. Net EU = \(b - 0.5h\).  
  - **Uncertainty Set:** \(S = \{b, h\}\) with independent intervals.  
  - **Rules:**  
    - **Maximin:** Worst net EU = \(0.2 - 0.5 \times 0.15 = 0.125\) → Adopt.  
    - **Hurwicz (\(\alpha=0.3\)):** Best EU = \(0.4 - 0.5 \times 0.05 = 0.375\); Worst EU = \(0.125\); Blend = \(0.3 \times 0.375 + 0.7 \times 0.125 = 0.195\) → Adopt.  
    - **E-admissibility:** Adopt is optimal if \(b > 0.5h\) (true in 100% of \(S\)) → Adopt.  
  - **Outcome:** All rules agree → **Adopt**.  

  **Proposal 2: Novel Vector-Control Intervention**  
  - **Uncertainties:** Ecological harm probability \(p \in [0.01, 0.1]\), but harm severity is catastrophic (utility = −1,000 if triggered). Benefit utility = +10 (disease reduction).  
  - **Utilities:** Net EU = \(10 - 1,000p\).  
  - **Uncertainty Set:** \(S = [0.01, 0.1]\) for \(p\).  
  - **Rules:**  
    - **Maximin:** Worst EU = \(10 - 1,000 \times 0.1 = -90\) → **Reject**.  
    - **Hurwicz (\(\alpha=0.3\)):** Best EU = \(10 - 1,000 \times 0.01 = 0\); Worst EU = \(-90\); Blend = \(0.3 \times 0 + 0.7 \times (-90) = -63\) → **Reject**.  
    - **Maximality:** Not adopting (EU=0) beats intervention when \(p > 0.01\) (90% of \(S\)) → **Reject**.  
    - **E-admissibility:** Adopt is optimal only if \(p < 0.01\) (excluded in \(S\)) → **Reject**.  
  - **Outcome:** All rules agree → **Reject** (the answer you won’t like).  
  - **Why?** Catastrophic risk dominates even low probabilities.  

  **Residual Uncertainty Handoff:**  
  - **Example:** If vector-control harm probability was \(p \in [0.001, 0.01]\) (best-case EU = \(10 - 1,000 \times 0.001 = 9\)), rules disagree:  
    - Maximin rejects (worst EU = \(-90\)), but E-admissibility admits adoption (optimal if \(p = 0.001\)).  
  - **Handoff to Director:** "Decision hinges on whether a 0.1% catastrophe risk is acceptable for +10 utility."  

  ---  
  ### **What the Procedure Cannot Settle**  
  1. **Deep value conflicts** (e.g., "Is any extinction risk acceptable?").  
  2. **Unresolvable uncertainty** (e.g., "No evidence can narrow \(S\); risk tolerance is political").  
  3. **Rule selection deadlocks** with no agency policy (rare; pre-commitment avoids this).  

  **Final Output:** One-page report with \(S\), rule justifications, and final call (adopt/reject/handoff).
