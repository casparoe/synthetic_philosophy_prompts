prompt: |-
  I'm a retired theoretical physicist who has only in the last year or so started taking metaphysics seriously, and I've been stuck on the identity of indiscernibles for weeks. Part of what hooks me is that I spent thirty years working in a framework where "identical particles" is a perfectly ordinary phrase, and I keep wondering whether physics has already answered a question the metaphysicians are still debating. Let me state the proposition I want a number on, since I think the usual loose talk is what's been confusing me: I'm interested in the modal formulation, namely the claim that in every metaphysically possible world, any two distinct concrete objects differ in at least one property we would not count as a haecceity — so "being this particular sphere" does not count as a difference, but "being two meters from the other sphere" does. Equivalently, I want a credence in the negation: that there is a possible world in which two distinct concrete objects share all their non-haecceitist properties. My own credence that the principle is a necessary truth has settled around 0.75; a philosopher friend of mine puts it at roughly 0.35, and I honestly cannot tell which sub-question we are actually disagreeing about.

  So please give me your own credence, but more importantly, decompose it. I'd like you to break the question into at least these terms: (i) whether the condition "sharing all non-haecceitist properties" is even determinate and coherent once haecceities are excluded — for instance, whether the logic of property attribution makes the scenario self-refuting or trivial in some way I haven't seen; (ii) whether Black's mirror-image spheres — two perfect spheres in an otherwise empty universe, arranged as exact mirror images of one another — describe a genuinely possible world, or whether distinctness itself somehow requires a qualitative difference, so that the scenario is incoherent and the principle comes out necessary after all; (iii) whether quantum mechanics gives us actual counterexamples, i.e., whether identical particles are genuine individuals with determinate property sets such that some pair of them in the actual world shares all of its properties — if so, the modal claim is settled immediately, since the actual world is among the possible worlds; and (iv) whatever other terms you think belong, including whether taking the modal reading rather than a merely actual one is the right thing to be asking about in the first place.

  For each term, give me a rough probability with a sentence of justification, then show how the terms combine into your final number. After that, tell me which term you are least confident in and what evidence or argument would move it the most. And one last thing, since I keep going back and forth in my own head: of the two of us — the physicist at 0.75 and the philosopher at 0.35 — in which of your sub-questions does the disagreement most likely live, and what specific question should I put to my friend to find out?
