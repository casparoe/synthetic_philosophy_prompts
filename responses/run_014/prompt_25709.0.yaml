  Calling truth "redundant" is tricky. While the concept might be reducible via the T-schema, it's not useless. Without "true," we couldn't make generalizations. So it's redundant in specific uses but indispensable in others. The user might confuse redundancy with uselessness, so clarifying that is important.

  The "pseudo-problems" claim is a big point. The host suggests that debates like correspondence vs. coherence are misguided. But deflationists don't dismiss all problems. They argue that the nature of truth isn't substantive, but truth-bearers, facts, and logic still matter. Horwich, for example, thinks traditional theories are unnecessary but doesn't call them pseudo-problems outright. He might say they're confused but still meaningful in some contexts.

