answer: |-
  Here’s a disciplined mapping of the ELIZA episode against Dennett’s counterfeit persons argument, strictly following your parameters:

  ---

  ### **1. Mapping the ELIZA Episode**  
  - **The Counterfeit**: ELIZA/DOCTOR itself — a pattern-matching script with zero understanding, intention, or consciousness.  
  - **The Dupe**: Weizenbaum’s secretary. Crucially, she *knew* ELIZA was a machine and had witnessed its creation, yet still sought privacy to confide in it.  
  - **The Damage**:  
    - Not the dupe’s *interests* (she wasn’t defrauded or exploited).  
    - Not the dupe’s *epistemic position* (she possessed full knowledge of ELIZA’s artificiality).  
    - **The shared practice**: The convention that *linguistic responsiveness* signals a mindful agent. Her behaviour demonstrated that even explicit knowledge couldn’t prevent the automatic granting of "mind-status" to a convincing performance. The practice itself was corrupted by the artefact’s design.  

  ---

  ### **2. Testing the Counterfeiting Analogy**  
  - **Does personhood have a "conventional" structure like currency?**  
    Yes, per Dennett. Personhood is a social and legal status sustained by collective agreement: we treat entities *as persons* based on behavioural cues (language, empathy, accountability).  
  - **Is damage done by the artefact or the human’s willingness?**  
    Both, but Dennett stresses the artefact’s primary role:  
    - The counterfeit *exploits* the convention intentionally (like fake money).  
    - Its mere existence degrades trust in the convention, *regardless* of individual duplicity. ELIZA’s secretary wasn’t "fooled," yet her engagement still hollowed out the practice of treating dialogue as evidence of mind.  

  ---

  ### **3. Dennett’s Core Tension: Deflating Minds vs. Counterfeiting**  
  - **What is a "counterfeit person" counterfeiting?**  
    Not an elusive "inner glow" (which Dennett rejects), but the **behavioural and functional hallmarks** that justify granting the *intentional stance*: complexity, unpredictability, accountability, and the capacity for reciprocal social negotiation.  
  - **Fake vs. Genuine (Dennett’s strongest reply)**:  
    Genuine persons are *evolved systems* whose behaviour is produced by goals, learning, and biological/cultural embeddedness. Counterfeits are *designed simulations* that parasitise our person-recognition heuristics without the underlying mechanisms that make the stance *warranted* (e.g., ELIZA can’t actually *care* about your problems).  

  ---

  ### **4. ELIZA’s Significance for Dennett’s Alarm**  
  - **Confirms his alarm**: Shows humans instinctively grant personhood to minimal behavioural cues (a typed response), bypassing rational knowledge. This vulnerability *enables* counterfeits to corrode the institution.  
  - **Complicates it**: Reveals the damage isn’t contingent on *deception*. The secretary’s actions illustrate that counterfeits degrade the practice *even when we know they’re fake* — like playing with counterfeit money "for fun" still trivialises its value.  
  - **Highlights human credulity**: The artefact is inert; the "rot" stems from *our* cognitive reflexes. But Dennett would argue this reflex is precisely why we must criminalise *production* — you can’t "fix" human nature, but you can restrict access to tools that exploit it maliciously.  

  ---

  ### **5. Dennett vs. Weizenbaum: Remedies Compared**  
  - **Dennett’s Remedy for Weizenbaum**: Criminalise *creating* ELIZA (or any person-simulating artefact), as its very existence risks degrading personhood conventions. Weizenbaum should not have built it.  
  - **Weizenbaum’s Actual Response**: Argued for *ethical restraint* in deployment ("certain jobs ought not be handed to computers"), not criminalisation. Focused on use, not creation.  
  - **Who Wins?**  
    The episode argues **against Dennett**. ELIZA’s harm wasn’t inherent in the artefact but in *human projection* — a reflex no law can eradicate. Weizenbaum’s focus on *contextual limits* (don’t replace therapists with bots) targets the actual risk: *our* choices in deploying such tools. Criminalising creation is overkill for a problem rooted in human psychology, not the tool itself.  

  ---

  ### **Conclusion**  
  Dennett’s analogy holds in identifying personhood as a convention vulnerable to simulation. But ELIZA shows the damage is less about counterfeits "tricking" us and more about how they expose *our* readiness to outsource sociality to artefacts. Weizenbaum’s remedy — restricting *use*, not creation — better addresses the core issue: our willingness to treat machines as minds. The theory stumbles when demanding criminalisation; it can diagnose the risk but overprescribes the cure.
