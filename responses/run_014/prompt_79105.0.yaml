  But the tension arises with Dennett's life's work. If minds are "real patterns" we project via the intentional stance, what distinguishes "counterfeit" persons? Dennett's strongest reply would be: Genuine persons have *rich, adaptive, responsibility-bearing* patterns that withstand scrutiny across contexts. Counterfeits are brittle; they hijack the stance without the underlying complexity that justifies it. ELIZA confirms his alarm by showing how easily humans grant the stance, but also complicates it—the secretary wasn't deceived cognitively yet *behaved* as if ELIZA warranted person-like engagement. The vulnerability lies in human social reflexes, not the artefact's sophistication. 

