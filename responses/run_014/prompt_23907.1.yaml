prompt: |-
  I'm teaching a graduate seminar on the epistemology of testimony, and the moral testimony problem has come up repeatedly in student papers, and I've realized I can't articulate the full set of requirements a theory of moral testimony actually has to meet. I keep seeing people argue about it by pointing at one case — the "should I just trust the moral philosopher on abortion?" case, the "does deferring to a moral expert make me less responsible?" case, the "how do we explain moral progress?" case — and I'd like the full spec first.

  Write the desiderata: what any adequate theory of moral testimony has to be able to deliver. For each desideratum, give the case or consideration behind it, and mark whether it's a genuine requirement or a prejudice of one camp (e.g., the anti-authoritarianism intuition, the "ethics is not like science" objection). I want the list to cover at least the "ethics as expertise" camp (moral knowledge comes from experts, as in science), the "ethics as perception" camp (moral knowledge is non-inferential, like perception), and the "ethics as skill" camp (moral knowledge is a practical skill, like chess or medicine). I specifically want you to engage with the "safety" condition (moral knowledge requires that you wouldn't be wrong in nearby possible worlds), the "moral progress" problem (if moral knowledge only comes from perception or skill, how do we explain moral progress over time?), and the "moral error" problem for the ethics-as-perception camp (if moral knowledge is non-inferential, how do we explain moral error?). Tell me which single desideratum does the most work to exclude candidates, and flag any pair of desiderata you suspect can't be jointly satisfied. Then, briefly, score the three camps against the list.

  Respond in the style of an expert in the epistemology of testimony. Think very carefully before answering; this is for a seminar handout, so precision matters more than length. A table is fine for the scorecard.
reasoning: |-
  Okay, the user is teaching a graduate seminar on the epistemology of testimony and needs a clear set of desiderata for theories of moral testimony. They've noticed students keep referencing isolated cases without a comprehensive framework. Let me unpack their request.

  First, the core ask: a systematic list of requirements any adequate theory must meet, with each desideratum tied to concrete cases or considerations. They want explicit markers for whether each is a genuine requirement or camp-specific prejudice. The camps to cover are expertise, perception, and skill models. Specific demanded engagements: safety condition, moral progress, and moral error problems. Plus meta-analysis on which desideratum is most exclusionary, potential conflicts, and a comparative scorecard.

  Hmm, the user's frustration with piecemeal case arguments suggests they want structural clarity. As a seminar leader, they likely need pedagogical scaffolding - this handout will anchor discussions. The "full spec" language implies desire for architecture, not just scattered insights. Underneath, they might be wrestling with how to reconcile realist intuitions (progress, expertise) with anti-deference sentiments.

  Breaking this down:
  The desiderata must cover five key tensions: 
  (1) Epistemic justification (can testimony transfer warrant?) 
  (2) Anti-authoritarian concerns (deference vs. autonomy) 
  (3) Phenomenology of moral learning (is it inferential?) 
  (4) Error vs. progress dialectics 
  (5) Semantic-pragmatic boundaries (when can testimony replace judgment?)

  For each, I'll anchor to classic cases: 
  - Abortion philosopher (epistemic) 
  - Nazi collaborator (responsibility) 
  - Child learning not to lie (development) 
  - Slavery abolition (progress) 
  - Concentration camp guard (error) 
  - Promise-keeping (context-sensitivity)

  Safety matters because moral realism often assumes factivity - if moral facts exist, reliable access should be modally robust. Progress challenges non-cognitivist-leaning views; error challenges intuitionist views. The perception camp's "non-inferential" claim creates tension with how we correct mistakes.

  Ah, the Nazi case (#2) might be the sharpest knife - it cuts against pure deference models by exposing responsibility erosion. And conflict likely between epistemic justification (#1) and contextual sensitivity (#6): if testimony works only when contextually identical, it rarely transfers.

  For scoring: 
  - Expertise handles progress and safety well but stumbles on responsibility and context. 
  - Perception explains phenomenology but fails progress/error. 
  - Skill captures context/responsibility yet struggles with justification/progress.

  Better emphasize that some desiderata reflect meta-ethical commitments (e.g., #2 assumes responsibility requires first-hand engagement). The handout should flag these as "contested" so students can debate foundations. Might add that #4 and #5 together pressure any static view of moral facts - useful for historicism discussions.

  Table format for scoring keeps it seminar-ready. Need absolute clarity on why each camp fails/passes items - no handwaving. Example: "Skill model fails epistemic justification because..." 

  This should equip the user to dissect student papers systematically. Might even suggest they assign desiderata-ranking as an exercise - "which matter most and why?" Could reveal disciplinary rifts.
answer: |-
  ## Desiderata for a Theory of Moral Testimony: A Framework for Evaluation

  An adequate theory of moral testimony must navigate complex epistemic, metaphysical, and practical demands. Below are the core desiderata, grounded in problematic cases or persistent philosophical tensions. I mark contested desiderata where a significant camp explicitly rejects them as requirements (though they remain *explananda*). Each camp ("Expertise," "Perception," "Skill") faces distinct challenges.

  ### The Desiderata

  | # | Desideratum                                                                 | Case/Consideration                                                                                                                              | Genuine Requirement or Contested?                                         | Primary Challenge For                              |
  |---|-----------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------|----------------------------------------------------|
  | **1** | **Epistemic Justification**: Must explain how testimony *can* (sometimes) yield justified moral belief or knowledge. | *The Philosopher on Abortion*: A non-expert justifiably believes abortion is permissible based solely on a trusted ethicist's well-argued testimony. | Genuine Requirement (Foundational for testimony epistemology).            | Perception (if purely non-inferential), Skill (if skill precludes testimony) |
  | **2** | **Responsibility & Autonomy**: Must account for why deferring seems *problematic* for moral agency/responsibility. | *The Nazi Collaborator*: "I was just following orders/the ethicist's decree" feels inadequate as a moral excuse for participating in atrocities. | Contested (Strongly held by "Skill" camp; rejected/weakened by "Expertise" camp). | Expertise (if pure deference is epistemically sufficient) |
  | **3** | **Developmental Necessity**: Must explain how novices (e.g., children) initially acquire moral competence. | *The Child Learning*: A child learns "lying is wrong" primarily via parental testimony before developing independent judgment. How is this possible/knowledge? | Genuine Requirement (Explains moral learning).                            | Perception (if mature competence requires direct "seeing"), Skill (if it requires practice) |
  | **4** | **Moral Progress**: Must explain how moral knowledge/understanding *advances* across time/cultures. | *Slavery Abolition*: How did societies move from widespread acceptance to recognizing slavery as profoundly wrong? Does testimony play a role? | Genuine Requirement (Historical fact needing explanation).                | Perception (if truths are eternally "seen"), Skill (if skills are static) |
  | **5** | **Moral Error & Correction**: Must explain widespread moral disagreement and how errors are identified/corrected. | *The Concentration Camp Guard*: Many "saw" their actions as dutiful. How was this error possible/corrected? Does testimony help correct error? | Genuine Requirement (Pervasive phenomenon).                              | Perception (if error implies defective "faculty") |
  | **6** | **Context Sensitivity**: Must account for why moral judgments often seem to require sensitivity to non-codifiable particulars. | *The Promise Case*: Testimony that "one should keep promises" doesn't tell me *whether* keeping *this* specific promise (e.g., to meet a friend) overrides helping someone in sudden, severe distress. | Genuine Requirement (Reflects moral phenomenology/practice).              | Expertise (if expertise yields universal codifiable rules) |
  | **7** | **Safety/Reliability (Conditional)**: If moral facts are objective, testimony-based belief should be *safe* (couldn't easily be wrong in relevantly similar circumstances). | *The Biased "Expert"*: Relying on an esteemed but secretly bigoted "moral authority" leads to reliably wrong beliefs about racial equality. | Contested (Assumes robust moral realism; challenged by anti-realists/non-cognitivists). | All camps (if robust realism is assumed) |
  | **8** | **Anti-Authoritarianism / First-Person Engagement**: Must explain the intuition that *understanding* the moral reasons oneself is often crucial. | *The Unreflective Deferrer*: Someone who always outsources hard moral decisions to an expert lacks genuine moral understanding, even if their beliefs are true. | Contested (Core commitment of "Skill" camp; moderated/rejected by others). | Expertise (if expertise licenses pure deference) |

  **Key Analysis:**

  *   **Most Exclusionary Desideratum:** **#2 (Responsibility & Autonomy)** does the most work to exclude candidates. Theories prioritizing pure epistemic justification (#1) and developmental necessity (#3) struggle significantly with #2, as seen in the Nazi Collaborator case. This desideratum is the primary wedge between the "Expertise" and "Skill" camps. A theory failing here faces deep objections concerning the nature of moral agency.
  *   **Likely Irreconcilable Pair:** **#1 (Epistemic Justification)** and **#2 (Responsibility & Autonomy)** present the sharpest tension. Maximizing the justification testimony can provide (#1) often seems to undermine the need for first-person engagement crucial for responsibility (#2). Conversely, emphasizing responsibility (#2) can make robust epistemic justification via testimony (#1) seem impossible or severely limited. Bridging this gap is the central challenge.
  *   **Safety (#7) & Progress (#4) Interaction:** If safety is demanded (#7), explaining radical moral progress (#4) becomes harder – how could a *safe* belief-forming method (e.g., testimony) lead societies from pervasive error (e.g., accepting slavery) to truth? This pressures theories to explain progress via *improved* methods/sources, not just accumulation of testimony.
  *   **Perception Camp's Core Tension:** It handles #3 (Development) poorly (how do children "perceive" via testimony?) and struggles profoundly with #4 (Progress) and #5 (Error). If moral perception is fundamental and reliable, how do entire societies systematically "misperceive" for centuries (#5), and how does new "perception" correct this (#4)? Error must be attributed to non-moral factors (ignorance, bias), raising questions about the perception faculty's reliability.

  ### Camp Scorecard

  | Desideratum       | Expertise Camp                                                                 | Perception Camp                                                                | Skill Camp                                                                 |
  | :---------------- | :----------------------------------------------------------------------------- | :----------------------------------------------------------------------------- | :------------------------------------------------------------------------- |
  | **1. Epistemic Justification** | **Strong** (Models science; testimony central)                                | **Weak** (If knowledge *requires* direct perception; testimony secondary)      | **Weak-Moderate** (Testimony can guide, but knowledge requires exercise of skill) |
  | **2. Responsibility & Autonomy** | **Weak** (Pure deference possible; responsibility issue acute)                 | **Moderate** (Perception requires engagement; but deference to "seers" possible) | **Strong** (Core commitment: Skill requires first-hand engagement)        |
  | **3. Developmental Necessity** | **Strong** (Testimony is primary learning vector)                             | **Weak** (How does testimony enable "perception"? Requires auxiliary theory)   | **Moderate** (Testimony as instruction/rules-of-thumb scaffolds skill development) |
  | **4. Moral Progress**         | **Strong** (Accumulation/refinement of expert knowledge)                      | **Weak** (Struggles to explain systematic societal error/correction)           | **Moderate-Weak** (Progress as refinement of shared practices? Slow/limited) |
  | **5. Moral Error & Correction** | **Strong** (Error from bad experts/methods; corrected by better expertise)    | **Weak** (Error implies defective perception; correction mechanism unclear)    | **Moderate** (Error from poor skill execution; corrected by practice/guidance) |
  | **6. Context Sensitivity**    | **Weak** (Risk of codification; expertise may yield rigid rules)               | **Strong** (Perception is inherently particular)                               | **Strong** (Skill is inherently contextual/practical)                      |
  | **7. Safety/Reliability**     | **Strong** (If experts are reliable, testimony inherits safety)                | **Moderate** (Perception reliable *if* faculty functions properly)             | **Moderate** (Skill reliable *if* well-developed; testimony less direct)   |
  | **8. Anti-Authoritarianism**  | **Weak** (Deference to expertise is legitimate)                               | **Moderate** (Perception requires engagement; but deference possible)          | **Strong** (Essential: Understanding requires skilled judgment)            |

  **Synthesis:** No camp satisfies all desiderata perfectly. **Expertise** handles epistemic transmission (#1), progress (#4), and error-correction (#5) well but founders on responsibility (#2), context-sensitivity (#6), and anti-authoritarianism (#8). **Perception** captures context-sensitivity (#6) and some phenomenology but struggles mightily with testimony-based justification (#1), development (#3), progress (#4), and error (#5). **Skill** excels at responsibility/autonomy (#2, #8) and context-sensitivity (#6) but has difficulty explaining robust epistemic justification via testimony (#1) and the mechanics of large-scale moral progress (#4). The tension between **#1 (Justification)** and **#2 (Responsibility)** remains the central fault line. An adequate theory likely needs elements from multiple camps or must significantly reinterpret one core commitment (e.g., weakening #2 or finding a novel way testimony satisfies #2). The "Progress" (#4) and "Error" (#5) problems consistently pressure non-cognitivist or static conceptions of moral knowledge.
