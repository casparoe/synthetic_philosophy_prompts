  The user wants to know if there's a name for this phenomenon where a skilled person gives a confidently wrong description of their own skill, but it still helps others learn. They mention the "knowing how" vs. "knowing that" distinction but feel it's not quite right. They want to understand the boundaries: is it only physical skills, does it include simplifications or metaphors, and what's actually happening underneath.

  First, I recall related concepts. "Know-how" vs. "propositional knowledge" comes to mind. The gap here is that experts can perform the skill (know-how) but misdescribe it (wrong propositional knowledge). Then there's cognitive science terms like "procedural knowledge" which is unconscious and automatic. Experts might have automated their skills so much that they can't consciously access the correct steps. The instructions they give might be reconstructive—they're creating a plausible explanation after the fact, which may not be accurate.

  The user's examples show that these incorrect instructions still work. Why? Maybe because the cues serve as heuristics that trigger the right actions. For swimming, "let your head sink" might counter the instinct to lift the head, which causes sinking. The cue addresses a common error, not the exact mechanics. So the false instruction works as an effective countermeasure to a mistake the learner is making.

  The user also asks about the scope. Does it apply beyond physical skills? Therapists or negotiators might use metaphors or simplified models that aren't technically accurate but help trainees grasp concepts. Simplifications and metaphors definitely fit here. The key is whether the cue directs attention appropriately, even if it's not factually correct.

  The underlying mechanism might involve attentional focus. Cues that promote external focus (like "let your head sink") could be more effective than internal, technical details. Also, placebo effect could play a role—believing the cue works might reduce anxiety, leading to better performance. 

  The user needs a term. "Procedural heuristic" or "corrective cue" might work. But established terms like "focus cue" or "alief" also relate. Since there's no single term, explaining the components: misattribution of expertise, functional cues, and attentional redirection. 

  They also want to know the edges. It counts with simplifications and metaphors as long as they're functional. It's not limited to physical skills. The false cue works by targeting the learner's specific error, not by describing the expert's action accurately. The expert's introspection is flawed, but the cue is effective for teaching because it addresses the learner's hurdle.
answer: |-
  This is a fascinating and **extremely common** phenomenon, especially in embodied skills like swimming, music, sports, and movement arts. While there isn't one universally agreed-upon *single* term, the phenomenon is well-recognized and can be dissected using several established concepts. The closest fit for the *core phenomenon* is often called **Expertise Misattribution** or **Procedural Misdescription**, but it sits at the intersection of several ideas.

  Here's a breakdown addressing your points:

  1.  **The Core Phenomenon & Its Names:**
      *   **Expertise Misattribution:** This highlights that the expert *attributes* their successful action to the wrong cause or body part. They know *how* to do it, but misidentify *what* physically creates the result. ("I thought I was relaxing my neck, but really it was my core and breathing.")
      *   **Procedural Misdescription:** This focuses on the inaccurate verbal description of the procedural knowledge (the "how").
      *   **The Explanatory Gap of Embodied Cognition:** This is the broader philosophical/cognitive science idea that our conscious, verbal understanding of complex physical skills often fails to capture the intricate, unconscious, sensorimotor processes involved.
      *   **Implicit Knowledge vs. Explicit Report:** The skill is held implicitly (unconsciously, in the body), but the attempt to make it explicit (verbal instruction) fails or distorts it.
      *   **Related to "Knowing How" vs. "Knowing That":** You're right to recall Gilbert Ryle's distinction. This phenomenon *extends* it. Experts have the "knowing how" (procedural knowledge). They *believe* they have the correct "knowing that" (propositional knowledge about *how* they do it), but their "knowing that" is actually flawed. Crucially, **this flawed "knowing that" can still facilitate learning.**

  2.  **Why the "Wrong" Instruction Still Works (The Mechanism):**
      *   **Attention Direction (Focus Cue):** The instruction, while factually inaccurate about the expert's *mechanics*, acts as a powerful **focus cue** for the *learner*. It directs their attention to a specific area or creates a specific *sensation* that counteracts a common error.
          *   *Swimming Example:* "Let your head sink back" isn't what *you* do, but it powerfully counteracts the learner's instinctive, disastrous head-lifting reflex ("turtle head") that sinks the hips. It makes them relax the neck *enough* and shift their center of buoyancy, even if the *primary* expert action is elsewhere.
          *   *Guitar Example:* "Press harder up the neck" likely counteracts the learner's tendency to apply *too much* pressure lower down (causing tension and fatigue) or not adjusting finger angle/position as they move, making their overall pressure *feel* inadequate higher up. The expert subconsciously adjusts position and angle, but "press harder" cues the learner to apply sufficient force *despite* the awkwardness.
      *   **Counteracting a Faulty Internal Model:** Learners often have incorrect internal models of how their body works or what the task requires. The "wrong" instruction overwrites *their* worse wrong model. It replaces "I must hold my head up to breathe!" with "Let it sink," which is closer to the truth *for achieving buoyancy*, even if it's not the expert's precise action.
      *   **Functional Heuristic:** The instruction acts as a simple, actionable **rule of thumb** or **heuristic** that gets the learner into the functional *ballpark* of the correct movement pattern, bypassing complex biomechanical analysis they couldn't process anyway.
      *   **Alief vs. Belief:** The instruction might tap into an "alief" (automatic, associative state) rather than a factual "belief." "Head sinks = float" creates an automatic association that overrides the panic reflex, even if the conscious belief about the expert's neck is wrong.
      *   **Placebo/Expectation Effect:** Belief in the teacher and the instruction can reduce anxiety and allow natural, more fluid movement to emerge. Confidence *in the cue* helps.

  3.  **Where the Edges Are (Your Questions Answered):**
      *   **Simplifications & Metaphors:** **Absolutely count.** "Hold the club like it's a small bird" is a deliberate metaphor, not a literal description. "Press harder up the neck" is likely a simplification/functional cue. The key isn't absolute falsehood, but **functional inaccuracy as a literal description of the expert's biomechanics.** If the cue *works* by directing attention effectively or creating the right sensation/intention, it fits the phenomenon. The line between "simplification" and "outright falsehood" is often blurry.
      *   **Beyond Body Skills:** **Definitely happens.** A therapist might say "Just reflect their feelings back" as a simplification, while their actual process involves complex pattern recognition, timing, and micro-adjustments they can't articulate. A negotiator might say "Always find common ground first," while their actual skill involves reading subtle cues and strategic sequencing they perform unconsciously. The *core* of the phenomenon – experts misdescribing their own processes while giving functional instructions – applies widely.
      *   **What's Actually Going On:** It's **not primarily placebo**, though that can be a component. The core mechanism is **effective attention direction and error correction.** The "false" cue is **tracking the learner's *hurdle*** rather than the expert's *anatomy*. It diagnoses the common mistake and provides a counteracting intention or focus. It gets the learner to *stop doing the wrong thing* or *start approximating the right thing* in a way they can understand and execute, even if the explanation of *why* it works is flawed or misattributed. It leverages the expert's intuitive understanding of the *goal state* and the *common pitfalls*, even if their introspective access to their own motor control is poor.

  **Putting it Together: A Suggested Term & Definition**

  While established terms exist for the components, the *specific scenario* you describe – a functional instruction based on the expert's flawed introspection – could be called a **"Corrective Misattribution Cue"** or a **"Functional Introspection Error."**

  **Core Definition:** A **Functional Introspection Error** occurs when a skilled practitioner, due to the implicit nature of procedural knowledge and poor introspective access to their own sensorimotor processes, provides an instruction that inaccurately describes their own biomechanics or cognitive processes. Despite this inaccuracy, the instruction functions effectively as a **focus cue** or **heuristic** for learners by directing attention, counteracting a common error, or creating a target sensation, thereby facilitating skill acquisition.

  **Why this works:**

  *   **Functional:** Highlights that the instruction *works*, even if it's not factually correct.
  *   **Introspection Error:** Directly addresses the expert's flawed self-reporting.
  *   **Cue:** Emphasizes its role in directing the learner's focus or intention.

  **In essence:** Experts are brilliant at *doing* and intuitively understanding the *goal state* and *common errors*. They are often terrible at accurately reporting their own *internal mechanics*. Their teaching cues leverage the former brilliance to overcome the latter limitation, using (sometimes inaccurate) verbal instructions as tools to guide the learner's attention and intention towards the functional outcome. It's the *functional effect* on the *learner* that matters, not the anatomical accuracy of the expert's self-report.
