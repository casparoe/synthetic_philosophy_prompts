  I am in a seminar on properties and dispositions, and I am trying to get the exact contrast between finkish and mask cases straight. I understand that both threaten the simple manifestation condition, but I do not see why they are usually treated as different kinds of problem: finks seem to remove the disposition before the relevant counterfactual is evaluated, whereas masks seem to keep the disposition in place while blocking its manifestation. Could you explain this distinction in enough detail to be useful for an essay, including why the simple biconditional that x has a disposition iff x would manifest it under the relevant stimulus fails in each case, what precisely is supposed to be gained by replacing it with an ability condition or by adding safe conditions to the antecedent, and why the safe-condition strategy appears to generate a regress once finks and masks are allowed to be finkish or masked themselves.
