prompt: |-
  My friend from graduate school is unusually decisive about decision-theory cases, and before I make any bets with her about next week's seminar topics I want to figure out what theory she is implicitly running. Her verdicts so far are as follows. In the smoking lesion case, where a lesion independently causes both a fondness for smoking and a high chance of cancer while smoking itself neither causes nor prevents anything, she smokes. In the XOR blackmail setup, where a perfect and honest predictor sends you a message exactly if either you will pay it a thousand dollars or termites have infested your house, and an infestation would cost you vastly more than the payment, she refuses to pay. In a Newcomb case where the box contents are known to have been determined by a coin flip rather than by any prediction, she takes both boxes. And in an ordinary one-shot blackmail with no leverage, where the blackmailer has already sent the letter regardless and nothing further depends on her paying, she refuses and dismisses any reputation-based argument for paying as beside the point.

  Next week's cases are these: standard Newcomb's problem with a predictor who is right ninety percent of the time; the counterfactual mugging, where a perfect predictor simulated her before flipping a fair coin, will give her ten thousand dollars if it lands heads but asks her for a hundred if it lands tails, and would never have made either offer had it anticipated refusal, with the coin having now landed tails and the request having been made; and Parfit's hitchhiker, where she is rescued from a desert by a driver who carried her on the strength of a prediction that she would pay him a reward at the destination, and who cannot retaliate once she is safely in town. What will she say about each of the three? I am less interested in the answers than in the rule she seems to be running, the other rules that fit her verdicts just as well, and which of the new cases would best tell those rules apart. Give a best guess with your reasons for preferring it, and if some further case would settle the question more cleanly than any of the three, describe it.

  Please write your response as continuous prose only, with no headings, bullet points, bold text, or tables, the way one would write a letter.
reasoning: |-
  Hmm, the user is describing a friend with very specific decision-theory stances across several classic thought experiments. They want to understand the underlying principle guiding these decisions to predict how she'll respond to three upcoming cases: standard Newcomb, counterfactual mugging, and Parfit's hitchhiker. More importantly, they want to identify the decision rule she's implicitly using, alternative rules that could explain the same pattern, and which case best distinguishes between them.

  Let me analyze the friend's existing positions first. In the smoking lesion case, she smokes despite the correlation between smoking and cancer because the lesion is the common cause - this suggests she rejects evidential decision theory (EDT) which would avoid smoking due to the bad news. Her refusal in XOR blackmail is interesting: paying would indicate either she paid or has termites (both costly), but not paying means she only risks actual termites. This seems like a causal stance where you don't pay to avoid confirming the disjunction. Taking both boxes in the coin-flip Newcomb variant makes sense if she's causal - no prediction means no reason to leave money behind. Finally, dismissing reputation in ordinary blackmail confirms she's focused on direct consequences rather than signaling.

  The consistent thread appears to be causal decision theory (CDT), which maximizes expected utility based on how actions causally influence outcomes rather than correlations. But let's consider alternatives. Could she be a sophisticated evidential theorist? Unlikely, given her smoking lesion stance. What about timeless decision theory (TDT) or updateless decision theory (UDT)? These would typically pay in XOR blackmail to precommit against unfavorable correlations, which she doesn't do. Her refusal there and in regular blackmail suggests she's not optimizing for acausal influences either.

  For the upcoming cases: in standard Newcomb with 90% predictor, CDT usually takes both boxes while EDT/TDT take one. Given her prior choices, she'll probably take both. Counterfactual mugging is trickier - CDT refuses to pay in tails since it can't affect the past simulation, while UDT pays to satisfy the precommitment. Her refusal in XOR blackmail (another acausal scenario) hints she'll refuse here too. Parfit's hitchhiker should be a clear refuse for CDT since payment can't affect the rescue after the fact, matching her blackmail stance.

  The most discriminating case among these is counterfactual mugging. If she pays, it suggests UDT-like thinking; refusal strongly points to CDT. Standard Newcomb might be ambiguous if she defects from CDT for high-accuracy predictors (though unlikely given her coin-flip stance), and hitchhiker is too similar to regular blackmail to add new information. 

  If I could design a cleaner test, I'd use a transparent Newcomb variant: boxes are already filled, but she learns the prediction *before* choosing. CDT would still take both regardless of prediction (since the money is fixed), while TDT/UDT might one-box if predicted to do so to maintain correlation. Her smoking lesion choice suggests she'd ignore the prediction and take both, further confirming CDT.

  The user seems analytically sophisticated - they're mapping decision theories through behavioral patterns rather than just seeking answers. Their underlying need is likely academic curiosity about rational choice frameworks, possibly with playful stakes regarding the seminar bets. By articulating the distinctions between CDT and alternatives, I can help them appreciate why certain cases serve as better litmus tests.
answer: |-
  Your friend's pattern of verdicts reveals a remarkably consistent application of causal decision theory (CDT). Let me reconstruct her implicit rule. CDT evaluates actions solely by their causal consequences, ignoring purely evidential correlations. When an action doesn't causally influence a desired outcome—even if it correlates with it—CDT rejects it if the action itself carries a cost or risk. This explains her choices: she smokes in the lesion case because smoking doesn't *cause* cancer; refuses XOR blackmail because paying doesn't *cause* the absence of termites (it merely correlates with their presence via the disjunction); takes both boxes in the coin-flip Newcomb because no prediction links choice to outcome; and dismisses the ordinary blackmail because paying can't retroactively prevent the letter's release or alter future events causally.

  For next week's cases, her CDT reasoning would likely produce these responses. In the standard Newcomb's problem, she takes both boxes. The predictor's 90% accuracy is evidential, not causal. Choosing only one box might correlate with riches, but *taking* Box B doesn't cause Box A to contain $1,000,000—the prediction and filling happened earlier. Grabbing both boxes causally nets her an extra $1,000 regardless. In counterfactual mugging, she refuses to pay the $100. The coin has landed tails, and her payment now cannot retroactively cause the heads outcome where she would have gained $10,000. Paying only costs her money without causal benefit. In Parfit's hitchhiker, she refuses to pay at the destination. The driver's prediction-based rescue is already complete; payment now doesn't cause the rescue and retaliation is impossible. Like the blackmail case, any reputational argument is dismissed as irrelevant to causal efficacy.

  Alternative theories also fit her prior verdicts, however. Updateless Decision Theory (UDT) could align if she values precommitments to decision rules across similar "nodes." Her XOR refusal fits UDT if she sees paying as a flawed policy that encourages exploitative correlations. Timeless Decision Theory (TDT) might explain her smoking (it doesn't control the lesion) and coin-flip Newcomb choice (no prediction link), while potentially differing elsewhere. Crucially, both UDT and TDT often prescribe paying in counterfactual mugging to honor the hypothetical precommitment that made the $10,000 possible—unlike her predicted refusal. Thus, counterfactual mugging best distinguishes CDT from these alternatives. If she pays, it suggests UDT/TDT reasoning; refusal strongly confirms CDT.

  Standard Newcomb is less decisive. While CDT takes both boxes, some sophisticated CDT variants might one-box against high-accuracy predictors if they model the predictor as a "causal mediator"—though her coin-flip Newcomb stance suggests she doesn't. Parfit's hitchhiker is too similar to her ordinary blackmail verdict to provide new information; refusal is consistent with all theories fitting her pattern.

  To settle this more cleanly than the three cases, consider a transparent Newcomb variant: the boxes are filled in advance, but she learns the prediction *before* choosing. CDT still takes both boxes regardless of prediction (as causation is unchanged). TDT/UDT often one-box upon learning they were predicted to do so, to "ratify" the correlation. Her likely choice—taking both boxes even knowing the prediction—would confirm CDT beyond doubt, as it mirrors her rejection of evidence in the smoking lesion case. This leverages her demonstrated indifference to non-causal information when the causal structure is clear. Until then, counterfactual mugging remains the pivotal test among the seminar cases.
