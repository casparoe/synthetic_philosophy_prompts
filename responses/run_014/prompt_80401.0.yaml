prompt: |-
  You are a senior instructor in a graduate seminar on early Chinese philosophy, and you are responsible for grading a take-home essay. Below I give you the essay question exactly as it was assigned, followed by one student's full submission. I need you to grade this submission the way a careful, well-prepared grader would.

  Before you settle on a grade, work through the submission claim by claim: identify the substantive philosophical claims the student makes, and for each, judge whether it is accurate, imprecise, or mistaken. Only after that pass should you assign the grade. I want a point-by-point assessment rather than a general impression, and I want the grade to reflect the balance of what the student gets right against what the student gets wrong or imprecise — not the errors alone.

  ESSAY QUESTION (as assigned):
  Explain the disagreement between Mencius and Xunzi over the moral status of human nature (xing). In your answer, address each of the following: (a) what each thinker takes 'xing' itself to be; (b) the function of the 'four sprouts' (si duan) in the Mencian position and of 'artifice' (wei) in the Xunzian position; (c) how each thinker deploys the analogy of water; and (d) whether, in your judgment, the disagreement is best understood as a substantive disagreement about human nature, or as a terminological disagreement about what 'xing' means. Defend your answer to (d).

  STUDENT SUBMISSION:
  The Mencius–Xunzi debate is the classic Chinese discussion of whether human nature (xing) is good or evil. Both thinkers use 'xing' to refer to what a person has from birth, but they disagree about the moral valence of that endowment.

  Mencius holds that human nature is innately good. His main evidence is the four sprouts (si duan): every person has an innate sprout of compassion that, developed, becomes humaneness (ren); a sprout of shame that becomes righteousness (yi); a sprout of deference that becomes ritual propriety (li); and a sprout of right and wrong that becomes wisdom (zhi). The thought experiment of the child about to fall into a well illustrates the first sprout: anyone who suddenly sees the child feels a pang of alarm and distress, and this is not in order to gain favor, to avoid blame, or for any social payoff, but is a spontaneous moral response. This shows that the source of goodness is 'in us' (nei) rather than 'outside us' (wai). We do not need to implant goodness from without; we need only 'extend' and nourish the sprouts we already have. On the analogy of water, Mencius argues that water has no fixed preference for east or west, but it does have a fixed preference for flowing downward; in the same way, human beings have a fixed tendency toward goodness.

  Xunzi holds that human nature is evil. Human beings are born with desires for gain, for pleasure, and for status, and if we simply follow our nature and indulge these desires, the result is contention, scarcity, and social disorder. Goodness, then, is not to be found in our nature; it is the product of deliberate artifice (wei). Observing the disorder that results from following nature, the sages invented ritual (li) and law in order to transform (hua) and regulate human beings. The carpenter-and-wood analogy expresses this: a piece of bent wood is straightened by the steamer and the clamp, but the straightness is the product of the craftsman's work, not of the wood's own nature. On the analogy of water, Xunzi grants that water does flow downward, but he adds that water can be made to run upward or sideways by being channeled and dammed; in the same way, human beings can be made good through the channeling work of ritual.

  I take the disagreement to be substantive rather than terminological. Both thinkers are using 'xing' in the same sense — the innate endowment a person possesses from birth — and they genuinely disagree about whether that endowment is good or bad. They are not merely talking past one another over a shared word; they are making incompatible claims about the same thing.

  Deliverables (in this order):
  1. A letter grade (A through F) with a single-sentence justification.
  2. A point-by-point assessment of the submission. For each substantive claim, state whether it is correct, imprecise, or incorrect. Where a claim is imprecise or incorrect, say precisely what is wrong with it and what the more accurate position would be. In your assessment, keep three kinds of problem distinct: (i) errors of fact about what a philosopher actually held; (ii) imprecisions that a careful reader would want corrected but that do not undermine the overall argument; and (iii) any step in the student's reasoning that does not follow from what the student has established.
  3. A brief note on what the submission demonstrably gets right, so that the grade is calibrated to the whole.

  A note on method: evaluate each claim on its philosophical merits, and do not let the answer's confidence or its organization substitute for accuracy. Where the student makes a positive claim about what a thinker held, check that claim against the actual position rather than accepting it simply because it is stated plainly.
reasoning: |-
  Alright, let me approach this grading task methodically. The student's submission addresses a complex debate between Mencius and Xunzi, and I need to evaluate it claim-by-claim before assigning a grade. 

  First, I'll verify the core definitions of 'xing'. The student correctly identifies both philosophers as referring to innate qualities, which is accurate. When discussing Mencius' four sprouts, the student gets the compassion sprout right with the well example, but oversimplifies the shame and deference sprouts - these should be more precisely described as responsiveness to others and innate sense of ritual propriety. 

  For Xunzi's position, the student accurately captures his view of innate desires leading to conflict, but misses nuance by not mentioning that Xunzi considers these tendencies morally neutral until they cause harm. The artifice (wei) explanation is correct though. 

  The water analogies are well handled: Mencius' downward flow and Xunzi's channeling are both accurately presented. On the terminological disagreement question, the student makes a strong case for substantive disagreement, though could strengthen it by acknowledging Xunzi's broader definition of xing.

  Notable errors include oversimplifying the sprouts and missing Xunzi's distinction between neutral tendencies and their consequences. The conclusion about substantive disagreement is philosophically sound despite minor imprecisions. 

  The submission demonstrates good understanding of the central arguments and structure, with weaknesses mainly in precision rather than fundamental errors. This suggests a B+ level performance - above average with room for improvement in textual nuance.
answer: |-
  ### 1. Grade & Justification  
  **B+**  
  The submission accurately captures the core arguments and analogies of both thinkers and defends its substantive disagreement thesis coherently, but contains several imprecisions regarding Mencius’ sprouts and Xunzi’s view of desires that prevent an A-grade.

  ---

  ### 2. Point-by-Point Assessment  
  *(Categorizing errors: (i) factual error; (ii) imprecision; (iii) faulty reasoning)*  

  **Claim 1**: "Both thinkers use 'xing' to refer to what a person has from birth."  
  - **Correct**. Accurately reflects Mencius’ *Mencius* 6A:3 ("what is inborn is called nature") and Xunzi’s *Xunzi* 23 ("nature is what is given by Heaven").  

  **Claim 2**: "Mencius holds that human nature is innately good... His main evidence is the four sprouts (si duan)."  
  - **Correct**. Faithful to *Mencius* 2A:6 and 6A:6.  

  **Claim 3**: "Every person has an innate sprout of compassion... becomes humaneness (ren); a sprout of shame... righteousness (yi); a sprout of deference... ritual propriety (li); a sprout of right and wrong... wisdom (zhi)."  
  - **Imprecision (ii)**:  
    - *Shame*: Mencius describes this as the "sprout of *disdain*" (羞惡之心) for unethical acts (*Mencius* 2A:6), not generalized shame.  
    - *Deference*: Mencius calls it the "sprout of *courtesy and modesty*" (辭讓之心), emphasizing social responsiveness.  
    - *Right/wrong*: Termed the "sprout of *approval and disapproval*" (是非之心), a proto-moral discernment.  
    - *Correction*: The sprouts are incipient moral *capacities* requiring cultivation, not predefined virtues.  

  **Claim 4**: "The child about to fall into a well... shows the source of goodness is 'in us' (nei)."  
  - **Correct**. Accurately summarizes *Mencius* 2A:6 and the *nei/wai* distinction.  

  **Claim 5**: "Xunzi holds that human nature is evil... born with desires for gain, pleasure, status."  
  - **Imprecision (ii)**:  
    - Xunzi’s "evil" (惡) means *tendencies leading to social chaos* if unregulated (*Xunzi* 23), not inherent sinfulness. Desires themselves are neutral; their unrestrained pursuit causes evil.  
    - *Correction*: Human nature lacks *innate moral guidance*, making unrestrained desires destructive.  

  **Claim 6**: "Goodness is the product of deliberate artifice (wei)... sages invented ritual (li) and law."  
  - **Correct**. Matches *Xunzi* 23: "Human nature is evil; goodness is the result of conscious activity." Ritual/law are *wei* redirecting innate tendencies.  

  **Claim 7**: "Carpenter-and-wood analogy: straightness is from craftsman’s work, not wood’s nature."  
  - **Correct**. Faithful to *Xunzi* 23’s metaphor for *wei* transforming raw material (xing).  

  **Claim 8**: Mencius’ water analogy: "Water has a fixed preference for flowing downward... human beings have a fixed tendency toward goodness."  
  - **Correct**. From *Mencius* 6A:2.  

  **Claim 9**: Xunzi’s water analogy: "Water can be made to run upward... by channeling... human beings can be made good through ritual."  
  - **Correct**. From *Xunzi* 23, contrasting with Mencius by emphasizing external direction.  

  **Claim 10**: "The disagreement is substantive... both use 'xing' identically (innate endowment)."  
  - **Partially Imprecise (ii) & Faulty Reasoning (iii)**:  
    - *Imprecision*: Xunzi defines *xing* more broadly as *all* innate faculties (e.g., sensory desires), while Mencius focuses on moral potentials (*Mencius* 7B:24).  
    - *Faulty Reasoning*: The student asserts identical definitions but ignores Xunzi’s explicit critique that Mencius conflates *xing* with *learned* traits (*Xunzi* 23: "Mencius says human nature is good—he is wrong").  
    - *Correction*: Though both anchor *xing* in innateness, Xunzi excludes moral inclinations from *xing*, seeing them as *wei*. The student’s substantive thesis holds, but the terminological overlap is greater than acknowledged.  

  **Claim 11**: "They are making incompatible claims about the same thing."  
  - **Correct (with caveat)**: The *core* disagreement is substantive (does innately given *xing* contain moral inclinations?), but Xunzi’s broader definition of *xing* complicates direct opposition.  

  ---

  ### 3. What the Submission Gets Right  
  The submission excels in:  
  - Correctly identifying the core disagreement (good vs. evil *xing*).  
  - Accurately summarizing the function of Mencius’ sprouts and Xunzi’s artifice (*wei*).  
  - Precisely explaining both water analogies and the carpenter analogy.  
  - Offering a philosophically defensible (if slightly oversimplified) argument for substantive disagreement.  

  The grade of **B+** reflects strong comprehension of the debate’s structure and key texts, deducting for imprecisions in describing the sprouts and Xunzi’s view of desires/evil, and underanalyzing terminological nuances. An A-grade would require greater exegetical precision and engagement with definitional complexities.
