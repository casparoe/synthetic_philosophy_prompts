  **Key Moves for Outline:**
  1.  Concede pragmatic defenses address externalities, but argue the core wrong is intrinsic/relational (to subject).
  2.  Ground duty in respect for the deceased's moral autonomy and personhood.
  3.  Define "narrative identity" as core to personhood; distinguish its violation from permissible alterations.
  4.  Qualitatively differentiate *degrading character inventions* (betrayal, false confession) from *neutral/permissible narrative tools* (compression, functional dialogue).
  5.  State the duty: fidelity to the subject's attested character/values, violated by degrading fictionalizations.
