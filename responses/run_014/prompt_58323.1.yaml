  Here’s a concise argument addressing your core concern, grounded in the **violation of the subject’s moral autonomy and narrative identity**, independent of harm to the living or audience deception:

  1.  **Acknowledge Defenses, Then Transcend Them:**  
      Accept that pragmatic defenses (no living relatives harmed, audience knows it’s fictionalized) address *external* harms. However, the core wrong is *intrinsic* to the representation itself: a violation of the *deceased subject*.

  2.  **Moral Autonomy Extends Posthumously:**  
      We owe duties to persons *as persons*, not merely as relational entities (e.g., family members). A core duty is respect for their moral autonomy – their capacity to shape their own character and life story through choices. Inventing a degrading, secret betrayal fundamentally rewrites her *character* and *motivations*, attributes central to her moral agency. This treats her not as an end-in-herself, but as raw material for a narrative arc, violating her dignity.

  3.  **Narrative Identity Violation:**  
      A person’s life constitutes a "narrative identity" – the intelligible story of *who they were*. While compression or plausible dialogue aid in telling *that* story, inventing a *core moral failing* (jealous betrayal) and a fabricated deathbed confession constructs a *fundamentally different narrative identity*. It misrepresents the *meaning* of her life and struggles, imposing an alien moral psychology she didn’t possess. This is qualitatively different from altering non-character-defining details.

  4.  **Degrading Inventions vs. Neutral/Permissible Ones:**  
      Compressing timelines or inventing functional dialogue maintains fidelity to the subject’s *attested character and values*; it serves the *actual story*. Inventing a secret moral flaw and confession, especially one contradicting her public legacy (sympathetic politics), *degrades* her identity by attributing base motives and hypocrisy. This isn't narrative efficiency; it's a character assassination for dramatic effect, exploiting her name and legacy while betraying her essence.

  5.  **The Duty to the Subject:**  
      Therefore, the wrong lies in failing a duty *to her*: the duty to represent her character and inner life with a minimum fidelity commensurate with claiming her *real* life as the subject. We owe the dead respect for the truth of who they demonstrably were, especially when depicting them to the world. This duty is violated by degrading inventions, regardless of their impact on the living or informed audiences.

