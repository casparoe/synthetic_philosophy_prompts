answer: |-
  Below is a complete activity design for your game theory session on reasoning by dominance, centered on the discovery that a strategy can be strictly dominated by a mixed strategy even when it isn't dominated by any pure strategy. The design includes the payoff matrix, grouping instructions, gameplay mechanics, and debriefing points. It also addresses timing, potential pitfalls, and limitations. The activity uses a symmetric 3x3 game to ensure clarity and focuses on **Row player payoffs** for dominance reasoning (Column payoffs are symmetric and only used for scoring). All arithmetic is kept at an arithmetic level.

  ---

  ### **Payoff Matrix and Dominance Arithmetic**
  **Symmetric Bimatrix (Row, Column Payoffs):**
  |          | Column X | Column Y | Column Z |
  |----------|----------|----------|----------|
  | **Row X**| (5, 5)   | (0, 0)   | (3, 3)   |
  | **Row Y**| (0, 0)   | (5, 5)   | (3, 3)   |
  | **Row Z**| (2, 2)   | (2, 2)   | (0, 0)   |

  **Row Player Payoffs (Simplified for Dominance Analysis):**
  |          | Col X | Col Y | Col Z |
  |----------|-------|-------|-------|
  | **Row X**| 5     | 0     | 3     |
  | **Row Y**| 0     | 5     | 3     |
  | **Row Z**| 2     | 2     | 0     |

  #### **Key Arithmetic:**
  1. **Why Z isn’t dominated by any pure strategy (head-to-head comparisons):**
     - **Z vs. X:**  
       - If Col plays X: Z (2) < X (5) → X better.  
       - If Col plays Y: Z (2) > X (0) → Z better.  
       → *Z not dominated by X (Z wins when Col plays Y).*
     - **Z vs. Y:**  
       - If Col plays X: Z (2) > Y (0) → Z better.  
       - If Col plays Y: Z (2) < Y (5) → Y better.  
       → *Z not dominated by Y (Z wins when Col plays X).*
     - **Conclusion:** Participants will correctly eliminate no strategies after pure comparisons. Z survives.

  2. **Why Z is strictly dominated by a mixed strategy (50-50 X-Y mixture):**
     - **Mixture payoff = 0.5(X) + 0.5(Y)**  
       - Against Col X: (0.5 × 5) + (0.5 × 0) = 2.5  
       - Against Col Y: (0.5 × 0) + (0.5 × 5) = 2.5  
       - Against Col Z: (0.5 × 3) + (0.5 × 3) = 3  
     - **Compare to Z’s payoff:**  
       - Against Col X: 2.5 > 2  
       - Against Col Y: 2.5 > 2  
       - Against Col Z: 3 > 0  
     → *Mixture strictly dominates Z in every case.*  
     - **Why this isn’t obvious:** Z beats X head-to-head when Col plays Y and beats Y when Col plays X. The mixture’s superiority only appears when averaging outcomes across multiple plays.

  ---

  ### **Activity Structure: 90-Minute Session**
  #### **Grouping and Roles (9 Participants):**
  - **3 groups of 3 players each.**  
  - **Each group:** 1 **Row Player**, 1 **Column Player**, 1 **Recorder**.  
  - **Rotate roles** every 10 rounds (Row → Column → Recorder → Row). This ensures everyone experiences all perspectives.  
  - **Recorder’s task:** Track choices and payoffs on a simple tally sheet (see "Points Scheme" below).

  #### **Points Scheme (No Money Required):**
  - Players earn **points equal to their payoff** in the matrix.  
  - **Example:** If Row plays X and Column plays Z, Row gets 3 points, Column gets 3 points.  
  - **Scoring:** Recorder tallies points per round. After all rounds, players compare total points to see who "won" in their group.  
  - **Why this works:** Points mirror real payoffs, incentivizing rational choices without money. Low numbers allow easy arithmetic.

  #### **Gameplay Rounds:**
  1. **Stage 1: Pure Strategies Only (35–40 minutes)**  
     - **Each group plays 15 rounds.** In each round:  
       - Row and Column secretly choose X, Y, or Z.  
       - They reveal simultaneously.  
       - Recorder logs choices and awards points.  
     - **Debrief prompt (after 15 rounds):**  
       > _"Look at your tally sheets. Are any strategies always worse than others? If so, eliminate them from future rounds. You can only use pure strategies (no mixing) for now."_  
     - **Predictable outcome:**  
       - Groups will notice Z is sometimes better than X/Y (e.g., Z=2 vs. X=0 when Col plays Y).  
       - **No strategies are eliminated.** Groups announce, "Reduction is finished—nothing is dominated!"  
       - *(This sets up the discovery.)*  

  2. **Stage 2: Mixed Strategies Introduced (20–25 minutes)**  
     - **Moment mixing becomes available:** After groups declare elimination complete, announce:  
       > _"Now, players may use mixed strategies. Instead of choosing one action, you can assign weights (probabilities) to multiple actions. For example, 50% X and 50% Y means flipping a coin to decide."_  
     - **New rule:** Each group plays 10 rounds with these changes:  
       - Row and Column players **submit weights** (e.g., "X: 50%, Y: 50%, Z: 0%").  
       - Recorder uses a **coin/die** to convert weights into actions (e.g., coin flip: heads = X, tails = Y).  
       - Points are awarded as before.  
     - **Key instruction:**  
       > _"Test mixtures against each other. Ask: Is there a mixture that makes Z a bad choice?"_  
     - **Predictable discovery:**  
       - Groups using 50-50 X-Y mixtures will see average payouts of 2.5/3 (vs. Z’s 2/0).  
       - Recorders report Z is "beaten" by the mixture. Participants realize Z is strictly dominated.  

  #### **Debrief: Mapping Gameplay to Definitions (15 minutes)**  
  Link each moment of play to game theory concepts:  
  - **Pure Dominance (Stage 1):**  
    - *"When you compared Z to X or Y head-to-head, you checked for pure strategy dominance. Z survived because no pure strategy dominates it: Z wins in some columns."*  
  - **Mixed Dominance (Stage 2):**  
    - *"When you used mixtures, you discovered a mixed strategy (50% X, 50% Y) that strictly dominates Z. It yields more than Z no matter what the opponent does."*  
  - **Key Insight:**  
    - *"Dominance reasoning isn’t complete until we consider mixtures. A strategy can be non-dominated by pures but dominated by a mixture."*  

  ---

  ### **Predictable Problems and Recovery**  
  1. **Problem:** Groups eliminate Z prematurely in Stage 1 (e.g., if they only compare Z to X when Col plays X).  
     - **Recovery:** Ask recorders to share data. Show that Z beats X when Col plays Y (e.g., "In round 3, Z=2 > X=0").  

  2. **Problem:** Participants struggle with mixed strategy arithmetic.  
     - **Recovery:** Use a **visual aid** (e.g., a poster calculating 50-50 X-Y payoffs). Emphasize averages: *"Over 10 rounds, 50-50 X-Y earned 2.5 per round vs. Z’s 2."*  

  3. **Problem:** Column players avoid Z, denying Row the chance to see Z’s weaknesses.  
     - **Recovery:** In Stage 1, require each player to use Z at least 3 times.  

  ---

  ### **Optional Stage 3: Weak Dominance and Order-Dependence (15 minutes)**  
  If time permits, add a brief extension to contrast strict and weak dominance.  

  **New Payoff Matrix (Symmetric):**  
  |          | Col X | Col Y | Col Z |
  |----------|-------|-------|-------|
  | **Row X**| 3     | 0     | 3     |
  | **Row Y**| 0     | 3     | 3     |
  | **Row Z**| 1     | 1     | 0     |  

  **Activity:**  
  - Groups play 10 rounds (pure only), then eliminate strategies.  
  - **Discovery:**  
    - Z is **weakly dominated** by X or Y (e.g., X ≥ Z in all columns, with strict inequality in X).  
    - If groups eliminate Z first, they’re left with X and Y (neither dominates the other).  
    - If they eliminate nothing and compare X/Y first, they might miss the weak dominance.  
  - **Debrief:**  
    > _"Order matters in weak dominance: Eliminating Z first is correct, but skipping it blocks elimination. This contrasts with strict dominance (Stage 1), where domination is absolute and order-independent."_  
  - **Why Stage 1’s result differs:** Strict dominance (by mixtures or pures) is order-independent—if a strategy is dominated, it remains so regardless of elimination order. Weak dominance depends on which strategies are present.  

  ---

  ### **Limitation: What the Activity Cannot Teach**  
  **You must explicitly state this:**  
  > *"This activity shows how mixed strategies can dominate non-dominated pures, but it assumes players know all payoffs (complete information). In real life, dominance reasoning often fails when payoffs are uncertain or players learn adaptively. Mixed dominance also requires common knowledge of rationality—which we simulated but didn’t discuss."*  

  ---

  ### **Materials and Timing Summary**  
  - **Materials:**  
    - Printed payoff matrices (one per group).  
    - Tally sheets for recorders.  
    - Coins/dice for mixing.  
    - Visual aids for mixture arithmetic.  
  - **Timing (90 min):**  
    - Intro (5 min).  
    - Stage 1: Pure play and debrief (40 min).  
    - Stage 2: Mixed play and debrief (25 min).  
    - Stage 3: Weak dominance (optional, 15 min).  
    - Final Q&A (5 min).  

  This design ensures participants "discover" mixed dominance through gameplay, with clear links to theory and minimal lecture. The matrix was chosen to make the phenomenon inevitable yet non-obvious, and the grouping maximizes engagement for 9 players.
