    - 20 min: first round of play (in pairs) and discussion.
    - 20 min: second round with mixed strategy for Column and discussion.
    - 20 min: debrief and explanation of dominance by mixed strategies.
    - 20 min: optional second stage with weak dominance.

  Optional second stage: weak dominance and order-dependence.

