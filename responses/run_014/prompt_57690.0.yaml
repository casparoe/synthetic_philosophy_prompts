     - so expected payoff: 0.5*5 + 0.5*0 = 2.5

     Similarly, Y: 0.5*0 + 0.5*5 = 2.5

     So both X and Y give 2.5>2.

     And playing a mixture of X and Y might give even more? But in this case, any mixture of X and Y gives 2.5.

     So they see that Z is worse than X or Y when Column is playing this mixture.

  8. Then we can explain: even though Z was not dominated by any pure strategy, it is dominated by the mixed strategy (0.5,0.5,0) of X and Y.

  But we want the discovery to happen without us saying it.

  Revised plan:

  - First, have them play in pairs without mixed strategies. Each pair plays 10 rounds. They record their choices and payoffs.

  - After that, we gather and ask: "Did you find any strategy that is always bad?" They will say no, because Z sometimes is good (when the opponent plays X or Y, it gives 2 which is better than the 0 that X gives against Y and Y gives against X).

  - Then we say: "But what if your opponent plays a mixed strategy? Let's try an experiment. In your groups, one of you will be the Column player and will play a mixed strategy: half the time X and half the time Y. The other two will be Row players. Each Row player will play against the same Column player for 10 rounds. The Column player will flip a coin: heads for X, tails for Y. The Row players choose freely in each round. Record your payoffs."

  - Then after 10 rounds, the Row players compare: they will see that when they played Z, they got on average 2 (because regardless of the coin, they get 2). When they played X, they got on average 2.5 (because half the time 5 and half the time 0). Similarly for Y.

  - So they see that Z is worse.

  - Then we can ask: "Was there any pure strategy that was always better than Z? (No) But this mixed strategy of the opponent makes Z look bad. In fact, we can see that if the Row player uses a mixed strategy of X and Y, they can get 2.5 on average against this Column mixed strategy, which is better than Z's 2. But more importantly, note that against any fixed strategy of the Column player, the mixed strategy of the Row player (playing X and Y) would also do better than Z? Let's check:"

    - If Column plays X: mixture of X and Y (0.5,0.5): 0.5*5 + 0.5*0 = 2.5 > Z's 2.
    - If Column plays Y: 0.5*0+0.5*5=2.5>2.
    - If Column plays Z: 0.5*3+0.5*3=3>0.

    So the mixed strategy (0.5 X, 0.5 Y) for Row strictly dominates Z.

  - This is the discovery.

  Debrief:

  - Pure strategy dominance: We say a pure strategy A dominates pure strategy B if for every column, A gives at least as much as B and for at least one column, strictly more. We saw that Z is not dominated by X or by Y.

  - Mixed strategy dominance: A mixed strategy can dominate a pure strategy even if no pure strategy does. In this case, the mixture of X and Y (with equal weights) dominates Z.

  - The key point: when we only consider pure strategies, we might not eliminate a strategy that is in fact dominated by a mixed strategy.

  What will go wrong:

  - In the first round, participants might not play in a way that explores all possibilities. We can mitigate by having them play many rounds or by having multiple pairs.

  - They might not see that Z is sometimes better. We can collect data from all pairs and show the payoffs.

  - When we introduce the mixed strategy for Column, they might not understand the coin flip. We can do a demonstration.

  - The arithmetic of expected value might be a barrier. We can calculate together.

  Timing:

  - 90 minutes.

