  ### Textbook Consensus on Sen's Paradox
  - **Core argument**: Sen's liberal paradox (1970) shows that no social choice rule can simultaneously satisfy:
    1. **Unrestricted Domain (UD)**: All possible individual preference orderings are allowed.
    2. **Pareto Principle (P)**: If everyone prefers outcome X over Y, society must prefer X over Y.
    3. **Minimal Liberty (ML)**: At least two individuals each have decisiveness over one pair of outcomes (e.g., person A decides between alternatives differing only in A's "private sphere").
  - **Classic impossibility**: In the racy-novel case (your Case 1), ML grants each person decisiveness over their own reading choice, but their "nosy" preferences create a cycle (e.g., Prude > Lewd via ML, Lewd > Prude via ML, but both prefer a different ordering via P). This is a **genuine impossibility** under UD + P + ML.
  - **Contested interpretations**: There's no consensus on "resolving" the paradox. Debates focus on:
    - Whether ML should be redefined (e.g., using "game forms" to model rights as actions rather than preferences).
    - Whether some preferences should be restricted (e.g., excluding "meddlesome" preferences from UD or P).
    - Whether the paradox reveals a flaw in P or ML.
    - Your professor's Case 2 ruling (ignoring Blake's preference) **deviates from textbook treatments**, where preferences are typically taken as given under UD. This suggests she endorses a non-standard view.

