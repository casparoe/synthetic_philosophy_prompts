answer: |-
  Here’s a step-by-step **Akrasia Diagnostic Procedure** designed for novelists. It uses plain language, incorporates hyperbolic discounting, and flags philosophical gray areas. Run it *after* drafting a scene where a character appears to act against their better judgment.

  ---

  ### **The Akrasia Diagnostic Procedure**
  **Ask these questions in order. Stop if any answer fails criteria.**

  1. **Was there a CLEAR PRIOR JUDGMENT?**  
     *Question:* Did the character firmly believe, *before the moment of action*, that Action X was worse than Alternative Y?  
     *Evidence Needed:* Internal monologue, dialogue, narration, or consistent behavior proving this judgment was settled.  
     *Fail If:* Judgment was vague, hypothetical, or newly abandoned *(excludes b, e)*.  

  2. **Was the judgment ACTIVE at the moment of choice?**  
     *Question:* Did the character *consciously recall* their judgment *while* choosing Action X?  
     *Evidence Needed:* Sensory details, fleeting thoughts, or physical tension showing the judgment was present (e.g., "She heard her sponsor's voice as her fingers touched the glass").  
     *Fail If:* Judgment was forgotten/overridden by new values *(b)* or self-deception obscured it *(c)*.  

  3. **Was the action GENUINELY VOLUNTARY?**  
     *Question:* Could the character have physically/mentally chosen otherwise *in that moment* without supernatural effort?  
     *Evidence Needed:* No coercion, psychosis, or debilitating addiction symptoms (shaking, blackouts).  
     *Fail If:* Action felt inevitable/mechanistic *(a)* or required superhuman willpower.  

  4. **Did PREFERENCE REVERSE due to PROXIMITY?**  
     *Question:* Was the "temptation" significantly more appealing *because* it was immediately available, despite the character still valuing the long-term goal more?  
     *Evidence Needed:* The character acknowledges the delayed reward (sobriety, freedom) is bigger, but the immediate reward (champagne buzz, avoiding confrontation) *feels* heavier *now*.  
     *Fail If:* The character no longer values the long-term goal *(b)* or the temptation isn’t time-sensitive.  

  5. **Is POST-ACTION REGRET/ CONFLICT EVIDENT?**  
     *Question:* After acting, does the character feel dissonance (shame, guilt, frustration) *without* revising their original judgment?  
     *Evidence Needed:* Self-recrimination, metaphorical language ("I handed the devil my wrist"), or renewed commitment to the original goal.  
     *Fail If:* Relief, justification, or amnesia dominates *(b, c, e)*.  

  ---

  ### **Gray Areas to Flag**
  - **Philosophical Murk:** If all steps pass *but* the action feels "out of character," note: Philosophers debate whether akrasia requires irrationality or if subconscious motives explain it.  
  - **Hyperbolic Discounting Edge Case:** If the character *almost* passes step 4 but the timing feels off (e.g., temptation is days away), flag: Preference reversal weakens with temporal distance.  
  - **Addiction Adjacency:** If step 3 is borderline (e.g., strong craving but no physical dependency), flag: This overlaps with compulsive behavior.  

  ---

  ### **Analysis of Your Characters**

  #### **1. The Sober Woman at the Wedding**  
  - **Step 1:** PASS. 14 months of sobriety + "genuine commitment" = clear prior judgment.  
  - **Step 2:** PASS. "She knows what she is doing as she does it" = judgment is active.  
  - **Step 3:** PASS. "She could refuse" + no addiction symptoms = voluntary.  
  - **Step 4:** PASS. Hyperbolic discounting in action: The immediacy of champagne (small-sooner reward) outweighs distant sobriety benefits (larger-later reward) *at that moment*.  
  - **Step 5:** PASS (Implied). Regret is likely given her history; no suggestion she abandons sobriety as a value.  
  - **Verdict:** **GENUINE AKRASIA**. Driven by time-sensitive preference reversal (step 4).  
  - *Why it works:* The champagne’s proximity makes the lapse feel inevitable yet psychologically credible.

  #### **2. The Husband Who Stays Silent**  
  - **Step 1:** PASS. Morning rehearsal + "resolved to leave" = clear prior judgment.  
  - **Step 2:** **FAIL**. He "looks across the table and says nothing" with no internal evidence he recalled his resolution *in the moment*. Instead, he later rationalizes ("the moment wasn’t right").  
  - **Analysis:** Steps 3–4 are irrelevant once Step 2 fails.  
  - **Verdict:** **NOT AKRASIA**. Likely **SELF-DECEPTION (c)** or **UNFORMED INTENTION (e)**. His rehearsal may have been performative (for himself or an imagined audience), not a binding commitment. Post-hoc justification suggests he never *fully* accepted the judgment at dinner.  
  - *Why you might dislike this:* It feels like weakness, but the procedure flags that his inaction lacks the *simultaneous awareness of judgment* required for akrasia. He avoids conflict, not his own conviction.  

  ---

  ### **What the Procedure CANNOT Do**  
  1. **Judge Emotional Validity:** It confirms structural akrasia but can’t guarantee the scene feels emotionally true. A technically perfect akratic act might still ring hollow if the character’s desire isn’t visceral.  
  2. **Handle Ambiguous Motivations:** If a character’s judgment is entangled with self-deception (e.g., "I quit smoking for health" but secretly craves approval), the lines blur.  
  3. **Replace Characterization:** It won’t work if you haven’t established the character’s values *before* the lapse. Akrasia requires knowing what "better judgment" means *to them*.  
  4. **Explain Akrasia Without Reward:** Hyperbolic discounting relies on a "reward" framework. If the lapse is driven by nihilism, trauma reflexes, or ineffable urges, the model fails.  
  5. **Resolve Philosophical Disputes:** Some philosophers deny akrasia exists (arguing all actions align with dominant desires). The procedure assumes it’s real but flags contested edges.  

  ---

  ### **Key Takeaways for Your Draft**  
  - **The Wedding Scene:** Strengthen by emphasizing the *physical immediacy* of the champagne (cool glass, bubbles catching light) vs. the *abstraction* of sobriety’s benefits. This heightens the time-discounting effect.  
  - **The Husband Scene:** Revisit his morning rehearsal. If he’s practicing lines but feels detached ("This is what I’m supposed to say"), lean into **(e)**. If he actively dismisses doubts during dinner ("Not tonight—she looks happy"), lean into **(c)**. Both are richer than akrasia.  

  This procedure forces you to *locate* the lapse: in the collision of judgment and proximate desire (akrasia), or in the unraveling of the judgment itself (other phenomena). Use it to replace clichés with specific mechanics of failure.
