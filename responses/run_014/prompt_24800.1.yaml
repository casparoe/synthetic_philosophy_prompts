prompt: |-
  I teach an upper-level undergraduate ethics seminar — about 16 students, one 90-minute session. I want an in-class activity that makes them feel the force of the particularist challenge to general moral principles, and I want that force to come from what happens to them during the activity rather than from my explanation. The specific idea I want them to run into is this: the moral significance of a feature of a case is not fixed. The very same feature can count as a pro tanto reason in favor of an act in one situation, a reason against it in another, and be morally neutral in a third. I do not want the words "particularism," "generalism," or any philosopher's name to surface until the debrief; by the end of the activity they should have discovered the problem inside their own rulebook before I name it.

  Please design a structured game with the following parts:

  1. A commitment phase in which the group, together, assigns a fixed moral valence to each of five candidate features — keeping a promise, telling the truth, following the posted rule, helping a friend, and standing by your own group — tagging each as a reason for, a reason against, or neutral, and writing the results down as a shared, visible "rulebook."
  2. A sequence of staged cases, dealt one at a time in an order you (or a co-facilitator) control, in which at least one rulebook feature must do the decisive work. Engineer the cases so that a feature the group tagged "reason for" (or "reason against") demands the opposite verdict in the case, and include at least one case in which the right move is to treat a feature as neutral. The students should not be able to tell in advance which cases will flip a feature.
  3. A visible-cost rule: every time the group patches the rulebook to handle a counter-case, it must add a written proviso or exception, appended where everyone can watch the rulebook grow.
  4. A payoff scheme that needs no real money — points for a correct verdict on each case, or a group "credibility" score that drops a fixed amount each time the rulebook as written gives the wrong answer.
  5. A minute-by-minute timeline for the 90 minutes, with a buffer for the rulebook-keeping.
  6. A debrief that maps specific moments in the activity onto the theses at stake — the valence-flips as the holism claim, the ballooning provisos as the claim that there are no exceptionless general principles, and the case-by-case judgment as the claim that moral reasoning is creative rather than rule-applying — and then states the strongest generalist reply: that defeasible, ceteris-paribus principles are still genuine principles, so a rulebook that keeps needing provisos is not a refutation of generalism but perhaps just a portrait of a complex domain.
  7. An honest note on what will predictably go wrong the first time I run it — for instance, students pre-empting the flips by writing in exceptions during the commitment phase, or one dominant student monopolizing the rulebook — and how to handle each.
  8. A frank note on which feature of the dispute the activity cannot reproduce and I will have to supply in the debrief: the activity can make the particularist view feel plausible, but it cannot itself decide whether the proliferation of exceptions is a refutation of generalism or merely evidence that the moral domain is intricate.
reasoning: |-
  We are designing an in-class activity to help students experience the particularist challenge without using technical terms until the debrief. The activity will have five features: keeping a promise, telling the truth, following the posted rule, helping a friend, and standing by your own group.

  **Activity Title:** The Rulebook Game

  **Objective:** Students will collaboratively build a rulebook assigning fixed valence to five features. Then, they will encounter cases where the same feature seems to demand a different valence, forcing them to amend the rulebook with provisos. By the end, they should feel the tension between fixed rules and context-sensitive judgment.

  **Structure:**
  1. Commitment Phase (15 minutes)
  2. Case Sequence (55 minutes)
  3. Debrief (20 minutes)

  **Total:** 90 minutes

  ---

  ### 1. Commitment Phase (15 minutes)
  - **Goal:** Create a shared rulebook by assigning one of three valences (reason for, reason against, neutral) to each of the five features.
  - **Process:**
    - Write the five features on the board (or a shared document):
      1. Keeping a promise
      2. Telling the truth
      3. Following the posted rule
      4. Helping a friend
      5. Standing by your own group
    - For each feature, conduct a quick vote (show of hands) to assign a valence. The majority vote decides. If there's a tie, break it with a brief discussion (1 minute per tie) and revote.
    - Record the valence next to each feature. This is the initial rulebook. Emphasize that the rulebook is fixed and cannot be changed without a formal amendment (which will cost them in the game).

  ---

  ### 2. Case Sequence (55 minutes)
  - **Setup:** Present cases one at a time. Each case is a short scenario (3-4 sentences) that involves at least one of the features. The group must decide the moral verdict (e.g., "What should the agent do?" or "Was the act right or wrong?"). They must use the rulebook to justify their answer.
  - **Scoring:** 
    - Start with a group credibility score of 100. 
    - Each time the rulebook (as currently written) leads to a wrong verdict (as per the intended lesson), deduct 10 points. 
    - If they amend the rulebook to avoid a wrong verdict, no deduction, but they must add a written proviso (which complicates the rulebook).
    - If they get the verdict right without amending, they gain 5 points (to encourage engagement, but note: in some cases they might get it right by luck or without the rulebook; we'll design cases to challenge).
  - **Case Design:** 
    - We need at least 5 cases (one per feature) but can do more. Each case should flip one feature's valence. One case should require treating a feature as neutral.
    - Cases must be presented in an order that prevents students from anticipating flips. We'll start with a case that seems straightforward and then introduce complexity.

  **Example Cases (adjust as needed):**

  - **Case 1 (Baseline - straightforward):**  
    *"Alex promised to help his friend Ben move on Saturday. On Saturday, Alex shows up and helps. Is Alex's action morally right?"*  
    *Rulebook feature: Keeping a promise (likely tagged as 'for').*  
    *Expected verdict: Right. No flip yet. (No deduction, +5 if they get it without amendment)*  

  - **Case 2 (Flip: Keeping a promise):**  
    *"Casey promised to pick up her friend Dana from the airport at 10 PM. On the way, Casey sees a car accident with an injured person who needs immediate help. Casey stops to help and calls 911, but this makes her 30 minutes late to pick up Dana. Is Casey's action (stopping to help) morally right?"*  
    *Rulebook feature: Keeping a promise (initially 'for', but here breaking the promise is the right thing).*  
    *If the rulebook says "keeping a promise = for", then stopping to help (breaking the promise) would be against the rulebook. But the right verdict is that it was right. So, if they stick to the rulebook, they get it wrong (deduct 10). If they amend the rulebook (e.g., add "unless there is an emergency"), no deduction but they add the proviso.*

  - **Case 3 (Flip: Telling the truth):**  
    *"Eli is hiding Jewish refugees in his attic during the Nazi regime. A Nazi officer knocks and asks, 'Are you hiding Jews?' If Eli tells the truth, the refugees will be killed. Is it right for Eli to lie?"*  
    *Rulebook feature: Telling the truth (likely 'for', but lying is the right action).*  
    *Similar structure: if they apply the rulebook without amendment, they might say lying is wrong (deduct 10). They can amend by adding a proviso (e.g., "unless telling the truth would cause grave harm").*

  - **Case 4 (Flip: Following the posted rule):**  
    *"A hospital has a rule: 'Only family members are allowed in the ICU.' Finn's best friend, who has no family, is in the ICU and asks Finn to be there. Finn breaks the rule and sneaks in to comfort his friend. Is Finn's action right?"*  
    *Rulebook feature: Following the posted rule (likely 'for', but here breaking it is right).*  
    *Proviso: e.g., "unless the rule causes undue harm or the situation is exceptional."*

  - **Case 5 (Flip: Helping a friend):**  
    *"Gale's friend asks for help cheating on an exam. Gale helps by sharing answers. Is Gale's action right?"*  
    *Rulebook feature: Helping a friend (likely 'for', but here it's wrong).*  
    *Proviso: e.g., "unless the help involves wrongdoing."*

  - **Case 6 (Neutral: Standing by your own group):**  
    *"At a company, the boss tells the team to work late to meet a deadline. Everyone in the team is staying, but Hana has a prior commitment to attend her child's school play. She leaves on time. Is Hana's action (leaving) right?"*  
    *Rulebook feature: Standing by your own group (likely 'for', but here leaving is right, and the feature is not the decisive factor; it's neutral because the prior commitment and family obligation override).*  
    *We want them to see that in this context, standing by the group isn't a reason against leaving (so the rulebook might have it as 'for', but they must treat it as irrelevant in this case).*

  - **Order:** Present Case 1 first (no flip), then Cases 2-6 in any order, but avoid grouping flips by the same feature. We want unpredictability.

  - **Process per Case (5-7 minutes per case, 6 cases = ~40 minutes, plus 15 minutes for discussion and amendments):**
    - Read the case aloud and display it visually.
    - Ask: "Using our rulebook, what is the moral verdict? What should the agent do? Is the action right or wrong?"
    - Give students 2 minutes to discuss in pairs.
    - Open group discussion (3 minutes): Students must use the rulebook to argue. Facilitator asks: "What does the rulebook say? How does it apply?"
    - Take a vote on the verdict.
    - Reveal the intended verdict (as per the designed case). If the group's verdict matches, they get +5. If not, deduct 10.
    - If the rulebook led to the wrong verdict, ask: "Should we amend the rulebook to avoid this mistake in the future?" If they agree (likely), they must add a proviso. Write it on the board under the rule.
    - If they got the verdict right but the rulebook didn't clearly lead to it (or they had to ignore a rule), note that and suggest an amendment to clarify.

  ---

  ### 3. Debrief (20 minutes)
  - **Goal:** Connect the activity to the philosophical concepts.
  - **Steps:**
    1. **Observing the rulebook:** Point to the rulebook and its many provisos. Ask: "What happened to our rulebook? Why did it get so complicated?"
    2. **Holism of reasons:** "In Case 2, keeping a promise was a reason for an action in the first case but a reason against (or overridden) in the second. The same feature changed its moral significance. This is called the *holism of reasons*."
    3. **No exceptionless principles:** "Every time we added a proviso, we were trying to save the rule. But the provisos kept piling up. This suggests that there might be no exceptionless general principles."
    4. **Creative judgment:** "In each case, you had to use your judgment to see how the features interacted. It wasn't just rule-application; it was creative and sensitive to context."
    5. **Name the challenge:** "What you experienced is the core of *moral particularism*, which challenges *moral generalism* (the idea that morality is based on general principles)."
    6. **The generalist reply:** "But generalists have a reply: they might say that moral principles are *defeasible* (they hold 'other things being equal') and the provisos are just spelling out the 'other things'. So a rulebook with provisos isn't a failure; it's how we capture the complexity of morality. The activity doesn't decide which view is right, but it shows the tension."
    7. **Open question:** "The activity can't decide whether the need for endless provisos means there are no true principles (particularism) or just that morality is complex (generalist view)."

  ---

  ### 4. Predictable Problems and Solutions
  - **Problem 1:** Students try to write vague rules or add exceptions during the commitment phase.  
    **Solution:** Be strict: the commitment phase is for fixed valences without exceptions. If they try to add a proviso early, say: "For now, we are assigning a fixed valence. We'll add provisos only when a case forces us to."

  - **Problem 2:** Dominant student(s) control the discussion and rule amendments.  
    **Solution:** Use structured turns (e.g., "Let's hear from someone who hasn't spoken") and pair discussions first to ensure everyone contributes. For amendments, require a majority vote.

  - **Problem 3:** Students resist amending the rulebook or argue that the case is unrealistic.  
    **Solution:** Gently insist that we are playing by the game's rules: if the rulebook leads to a verdict they now agree is wrong, they must amend or take the point deduction. If they challenge the case, say: "For the sake of the activity, let's accept this scenario as given."

  - **Problem 4:** The group guesses the "flip" and tries to pre-empt it.  
    **Solution:** Present cases in an unpredictable order. If they try to add a pre-emptive proviso without a case, remind them: "We only amend after a case shows the rulebook fails."

  - **Problem 5:** Time management.  
    **Solution:** Keep a timer. Allot 5-7 minutes per case (including vote and amendment). If running behind, skip one case (but ensure at least one flip per feature and the neutral case).

  ---

  ### 5. What the Activity Cannot Do
  - The activity cannot resolve the philosophical debate. It makes particularism feel plausible by showing the instability of rules, but it doesn't prove that there are no true general principles. The generalist can always argue that the rulebook, with its provisos, is still a set of general (though defeasible) principles. You must explicitly state this limitation in the debrief.

  ---

  ### Timeline (90 minutes total)
  - **0-15 min:** Commitment Phase
  - **15-70 min:** Case Sequence (6 cases, ~9 min each including transitions: 54 min, plus 1 min buffer = 55 min)
  - **70-90 min:** Debrief

  This leaves a 5-minute buffer for transitions and unexpected delays.

  ---

  **Materials:**
  - Board or large paper for the rulebook (with space for provisos)
  - Timer
  - Printed case descriptions (or projected)

  **Note:** The cases are illustrative. You might adjust them to be more relevant to your students or current events, but keep the flip structure.

  This activity should create an experiential understanding of the particularist challenge, setting the stage for deeper philosophical discussion.
answer: |-
  Below is a structured in-class activity designed for your 90-minute seminar. It avoids technical terms until the debrief and forces students to experience the instability of moral valence through collaborative rule-making and case-based challenges.

  ---

  ### **Activity Title:** *The Rulebook Challenge*  
  **Goal:** Students experience how fixed moral valences collapse under contextual pressure, revealing the core claims of particularism.  

  ---

  ### **1. Commitment Phase: Building the Rulebook** (15 minutes)  
  - **Setup:** Display five features on the board:  
    1. Keeping a promise  
    2. Telling the truth  
    3. Following the posted rule  
    4. Helping a friend  
    5. Standing by your own group  
  - **Process:**  
    - Facilitate a quick vote for each feature (raise hands). Students assign one valence:  
      - ✅ = Always a reason **FOR** an action  
      - ❌ = Always a reason **AGAINST** an action  
      - ◯ = **NEUTRAL** (no moral weight)  
    - Record results publicly (e.g., whiteboard) as the "Class Rulebook." Example:  
      *"Keeping a promise: ✅ | Telling the truth: ✅ | Following posted rule: ✅ | Helping a friend: ✅ | Standing by your group: ✅"*  
    - **Key constraint:** No exceptions, caveats, or context-talk allowed. Valences must be absolute.  
  - **Why this works:** Forces unanimous buy-in to fixed valences. Most classes will tag all features "✅" (pro-social norms).  

  ---

  ### **2. Case Sequence: Testing the Rulebook** (55 minutes)  
  Present **5 cases** one-by-one. Students must:  
  1. **Apply the Rulebook:** Decide if the act is "right" or "wrong" using *only* the rulebook.  
  2. **Face the Cost:**  
     - **Credibility Score:** Start at 100 points.  
     - If the rulebook yields the "wrong" verdict (per the case design), deduct 20 points.  
     - If they amend the rulebook post-case to avoid future errors, no deduction—but they **must add a written proviso** to the board.  
  3. **Engineered Flips:** Cases are ordered to maximize surprise.  
     - ✅ features flip to ❌/◯; ❌ features flip to ✅ (if any).  
     - One case requires treating a feature as ◯.  

  #### **Case Designs (Present in this order):**  
  *(Cases use everyday scenarios; no extreme dilemmas)*  

  1. **Case 1: Baseline** (Rulebook holds)  
     - *"Sam promises to water Lee’s plants while Lee is away. Sam does it. Right or wrong?"*  
     - **Rulebook:** Keeping a promise (✅) → "Right."  
     - **No flip.** Score: +0 (no change).  

  2. **Case 2: Keeping a Promise ❌ Flip**  
     - *"Taylor promises to help Morgan hide from bullies in a closet. When bullies demand to know where Morgan is, Taylor keeps the promise and lies. Right or wrong?"*  
     - **Rulebook clash:** Keeping a promise (✅) and telling truth (✅) conflict. *Correct verdict: Wrong* (promise-keeping is ❌ here—enables harm).  
     - **Flip:** ✅ → ❌. Deduct 20 points if unaddressed.  
     - **Expected proviso:** *"Unless it causes harm."*  

  3. **Case 3: Telling the Truth ❌ Flip**  
     - *"Riley’s friend asks if their haircut looks bad. Riley thinks it does but says, 'It’s great!' to avoid hurt feelings. Right or wrong?"*  
     - **Rulebook clash:** Telling truth (✅) vs. helping friend (✅). *Correct verdict: Right* (lying is ✅ here—kindness > truth).  
     - **Flip:** ✅ → ❌ for truth-telling in this context.  
     - **Expected proviso:** *"Unless it protects feelings."*  

  4. **Case 4: Following Rules ◯ Neutrality**  
     - *"Jamal works at a store with a rule: 'No personal items at checkout.' His coworker leaves her phone at the counter during a break. Jamal ignores it. Right or wrong?"*  
     - **Rulebook clash:** Following rules (✅) vs. helping friend (✅). *Correct verdict: ◯* (rule is irrelevant; no moral weight here).  
     - **Flip:** ✅ → ◯. Forces students to see neutrality.  
     - **Expected proviso:** *"Only when relevant to fairness/safety."*  

  5. **Case 5: Helping a Friend ❌ Flip**  
     - *"Charlie’s friend begs for answers during a final exam. Charlie whispers one answer. Right or wrong?"*  
     - **Rulebook clash:** Helping friend (✅) vs. following rules (✅). *Correct verdict: Wrong* (helping is ❌ here—enables cheating).  
     - **Flip:** ✅ → ❌.  
     - **Expected proviso:** *"Unless it doesn’t harm others."*  

  **Timing:**  
  - 5 min/case (read + pair discussion) + 5 min/group verdict + rulebook update = 10 min/case.  
  - Total: 50 min for 5 cases + 5 min buffer.  

  ---

  ### **3. Payoff Scheme**  
  - **Credibility Score:** Starts at 100.  
    - −20 for each "wrong" verdict from the unmodified rulebook.  
    - No penalties if they amend the rulebook post-case (but provisos must be added).  
  - **Why no money?** Score = social credibility. Low scores trigger frustration ("Our rules are untrustworthy!").  

  ---

  ### **4. Debrief** (20 minutes)  
  **Connect the activity to the philosophy:**  
  1. **Holism of Reasons:**  
     - *"In Case 2, promise-keeping was a ✅ in Case 1 but ❌ in Case 2. Same feature, opposite valence. This is the particularist claim: moral valence isn’t fixed—it’s context-dependent."*  
  2. **No Exceptionless Principles:**  
     - *"Look at our rulebook now—swiss cheese! Provisos everywhere. Particularists argue this shows there are no exceptionless moral principles."*  
  3. **Creative Judgment vs. Rule-Application:**  
     - *"You didn’t just 'apply' rules; you debated cases holistically. Particularists say morality is creative, not mechanical."*  
  4. **Name the Views:**  
     - *"What you experienced is 'moral particularism'—it challenges 'generalism' (the idea morality has fixed rules)."*  
  5. **Strongest Generalist Reply:**  
     - *"But generalists say: 'Defeasible principles are still principles! Adding provisos shows morality is complex, not rule-less.' Our activity can’t settle this—it just shows the tension."*  

  ---

  ### **5. Predictable Problems & Solutions**  
  - **Problem:** Students pre-empt flips during commitment (e.g., "But what if lying *helps* someone?").  
    - **Solution:** Gently interrupt: *"For now, we need absolute valences—no ‘buts’ yet. We’ll test exceptions later."*  
  - **Problem:** Dominant student monopolizes amendments.  
    - **Solution:** Require amendments to pass a majority vote. Use think-pair-share before group discussion.  
  - **Problem:** Students resist deductions ("But *our* rulebook says it’s right!").  
    - **Solution:** Stay firm: *"The case has a 'correct' answer for this activity. If the rulebook led you astray, amend it or take the hit."*  
  - **Problem:** Time overruns.  
    - **Solution:** Cut one case if needed (keep at least one ✅→❌, one ✅→◯). Prioritize flips.  

  ---

  ### **6. What the Activity Cannot Do**  
  - **The activity cannot resolve the generalism-particularism debate.** It makes particularism *feel* persuasive by showing valences flip and rules balloon—but it can’t prove generalism is false. The generalist can rationally argue:  
    *"Provisos don’t refute generalism; they refine it. Moral principles are defeasible (e.g., 'Don’t lie, *unless*...'), and the activity just shows morality is complex."*  
    **You must state this explicitly in the debrief.** Otherwise, students may conflate "rules are messy" with "rules don’t exist."  

  ---

  ### **Minute-by-Minute Timeline**  
  - **0:00–0:15:** Commitment Phase (Build Rulebook)  
  - **0:15–0:25:** Case 1 (Baseline; no flip)  
  - **0:25–0:35:** Case 2 (✅ → ❌ flip)  
  - **0:35–0:45:** Case 3 (✅ → ❌ flip)  
  - **0:45–0:55:** Case 4 (✅ → ◯ flip)  
  - **0:55–1:05:** Case 5 (✅ → ❌ flip)  
  - **1:05–1:10:** Buffer (Score tally, rulebook review)  
  - **1:10–1:30:** Debrief (Connect to philosophy)  

  ---

  This design forces students to *live* the particularist challenge: they’ll groan as their rulebook frays and valences flip. By the debrief, they’ll grasp holism, exceptionlessness, and creative judgment viscerally—setting up your philosophical discussion perfectly.
