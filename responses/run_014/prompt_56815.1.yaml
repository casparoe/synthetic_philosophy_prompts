prompt: |-
  I have spent the better part of two decades reading rationalist blogs and forums, where the first question asked of any thesis is what observation would count against it. Applying that reflex to the philosophy of technology has left me stuck, because both of the standard positions appear to survive any evidence at all. On one side, the claim that artifacts carry politics in their structure can be defended for any artifact by pointing to some differential effect it has; on the other, the claim that artifacts are neutral and only people are political can be defended for any artifact by pointing to its designers and users. Neither position tells me anything I did not already know. What I want is a criterion I can apply to a description of a thing and get a definite answer from — one that could be shown wrong by a badly chosen case.

  I have read Winner's 1980 essay in *Daedalus* asking whether artifacts have politics, including the parkway example, and I know that the historical particulars of that example have been disputed and that Joerges pressed an objection along those lines. I am not asking for a literature map or references; I want the criterion. Here is what I actually believe, arrived at case by case rather than derived from any theory, and I would like to know what principle, if any, generates all of it.

  1. Overpasses built low enough that buses cannot pass, so that only car owners can reach a public beach: political, on any criterion I would accept.
  2. The same overpasses at the same clearance, built for drainage and sight-line reasons, where nobody involved registered the consequence for buses for a decade and where the effect on who reaches the beach is identical: also political. Intent strikes me as a red herring here, and this is the verdict I hold most firmly.
  3. A speed bump where an officer used to enforce the limit: not political. The question of what speed is acceptable was settled in the open, by people who could be replaced; the bump is a cheaper way of carrying that settlement out. The politics is upstream.
  4. Air conditioning: not political, despite the sealed office tower, the migration to the Sun Belt, and the changed electoral map. It made available a set of choices that people then made, in the ordinary political way, and could have made otherwise.
  5. A facial-recognition system that performs worse on darker skin, where nobody intended it and nobody checked until after deployment: political. My reason is not simply that outcomes are unequal; it is that the artifact distributes a public benefit and burden along a line of subordination that already existed.
  6. Shears shaped so that a left-handed grip forces the blades apart, imposing a real recurring cost on left-handers: not political. Left-handers are a minority but not a subordinate group, and nothing about their standing in the community is being settled.
  7. Nuclear power as an inherently political technology, in the sense of requiring centralized and hierarchical management: rejected. Solar farms, container shipping, and data centers are at least as technically demanding and admit of either centralized or distributed organization. I suspect discarding this whole category costs me something, but I cannot say what.
  8. An opt-out default for organ donation: political. A browser's default search engine: not, or at least not in the same way — yet both are defaults and both allocate something, and the only distinction I can produce is that the second is trivial, which is not a principle.
  9. A lock on a door: not political, since it secures a property right the law already settled. Though the lock does something the law cannot, namely make that rule effective at three in the morning with no authority present, and I cannot tell whether that is taking over a decision or merely executing one. This is the case I keep going back and forth on.

  Two pairs I cannot reconcile. First, 2 and 6: both are unintended differential effects that entrench a disadvantage, and I call one political and the other not. My stated reason is whether the affected group is subordinate, but that seems to import the very political judgment I was trying to locate in the artifact, and it makes the criterion's output depend on my own views about society rather than on anything about the thing. Second, 3 against 1 and 2: a device that merely carries out a decision made elsewhere is not political, but the overpasses also carry out a decision made elsewhere — unless in case 2 nobody decided anything at all, in which case my criterion must be doing work I cannot yet articulate.

  So: state the principle, or the two or three best candidates, precisely enough that I could apply it to an unfamiliar artifact without consulting you again. Tie each clause to the verdict that motivates it — I want to know which of my cases is doing the work of which condition. Then tell me honestly which of my verdicts it forces me to abandon. I would rather be told that 3 and 9 have to go than be handed a criterion with a discretionary fudge factor that saves all nine; if the price of consistency is complexity, show me the complexity rather than hiding it. Say also what would falsify the criterion: what sort of artifact, described in what way, would count against it.

  Finally, apply it to three cases on which I am withholding my verdict, so that I can see whether the principle has independent traction. A stair-only apartment building constructed in 1910 and no longer alterable at reasonable cost, versus an otherwise identical building constructed last year under a different code, both excluding the same people. A programming language whose type system renders a whole class of error inexpressible, adopted voluntarily by its users rather than imposed on anyone. And a paper ballot counted by hand in public view versus an electronic machine whose software no outsider can inspect, where my gut says the difference is political but has nothing to do with which party wins and I cannot say why.
reasoning: |-
  Hmm, this user presents a sophisticated and well-structured challenge regarding the philosophy of technology and politics of artifacts. They've clearly spent years wrestling with the limitations of both technological determinism and social constructivism, and have developed their own nuanced case-based judgments. 

  The core frustration is palpable: they want a falsifiable criterion that doesn't rely on circular reasoning about designer intent or social outcomes. Their nine numbered cases reveal a consistent pattern of valuing institutional context and power relations over either pure functionality or unintended consequences. 

  What's particularly interesting is how they're wrestling with their own contradictions - especially between cases 2 and 6 where identical structural discrimination gets different political labels based on societal subordination. They're intellectually honest enough to admit this undermines their position. 

  The three test cases at the end are brilliantly chosen to stress-test any criterion. The stair-only buildings force us to consider historical contingency; the programming language tests voluntary adoption; and the voting machines probe transparency versus outcome neutrality. 

  For the criterion itself, I notice three recurring themes in their judgments: 
  First, whether the artifact operationalizes an existing power relationship (the lock securing property rights). 
  Second, whether it creates new political facts without democratic process (the facial recognition). 
  Third, whether the effect stabilizes subordination (their discomfort with the shears example). 

  The challenge will be formalizing this without making it tautological. The institutional channeling concept might work - focusing on whether the artifact bypasses or replaces political processes. But their voting machine example shows even transparent processes might be political if they change the nature of accountability. 

  Their rejection of nuclear power's inherent politics suggests they strongly resist technological essentialism. The speed bump being "merely executive" while low bridges are political points to some threshold of consequence severity. 

  Ultimately, their deepest need seems to be for conceptual clarity that doesn't require importing external political judgments each time. The solution might lie in differentiating between artifacts that mediate power versus those that merely reflect it - but drawing that line cleanly is the hard part.
answer: |-
  Here is a criterion derived from your cases, articulated precisely enough for independent application, with explicit ties to your judgments and clear falsification conditions. It prioritizes institutional decision-making channels and the creation of *new* political facts over intent or mere differential effects:

  **The Criterion: An artifact is political if and only if it *operationalizes a significant allocation of power, rights, benefits, or burdens* in a way that either:**
      **(A) Circumvents, displaces, or pre-empts an *open institutional process* capable of contestation and revision for such allocations; OR**
      **(B) Materially entrenches or amplifies an *existing axis of social subordination* by making that subordination a functional requirement or unavoidable consequence of the artifact’s use.**

  **Motivation & Tie to Your Cases:**

  1.  **Clause (A): Circumventing Institutional Process**
      *   **Motivated by:** Cases 1, 2, 5, 8 (organ donation), and your discomfort with 3 & 9.
      *   **Works:** Case 1 (low bridge): Allocates beach access (a public benefit) via infrastructure design, bypassing legislative/public debate on exclusion. Case 2 (same bridge, no intent): *Effect* is identical – it bypasses institutional process regardless of intent. Case 5 (biased facial recognition): Allocates public benefit/burden (e.g., surveillance access, false arrests) along racial lines, deployed without scrutiny/contestation of this effect. Case 8 (organ opt-out): Allocates a profound right (bodily integrity/consent) by default setting, circumventing individual explicit consent (an institutional norm for such rights). Case 3 (speed bump) is *not* political because it merely enforces a speed limit *already* set via an open process (law); it executes, doesn't displace. Case 9 (lock): *Not* political (by this clause) – it secures a property right *already* defined and allocated by law/institution. Case 4 (A/C): *Not* political – enables choices individuals/politics make *within* existing institutional frameworks (migration, building codes, electoral boundaries are political decisions *using* the tech, not inherent to it).
      *   **Key:** Focuses on *how* the allocation happens, not just *that* it happens. Requires an *open institutional process* (law, regulation, public debate, formal organizational policy) as the baseline for legitimate allocation.

  2.  **Clause (B): Entrenching Subordination**
      *   **Motivated by:** Case 5 (facial recognition), Case 2 (low bridge), and distinguishes them from Case 6 (shears).
      *   **Works:** Case 5: Directly operationalizes racial bias, materially entrenching existing racial subordination in law enforcement/access. Case 2: Allocates burden (denied access) disproportionately to a group defined by class/race (bus riders), entrenching existing socioeconomic subordination via infrastructure. Case 6 (shears): *Not* political – imposes cost, but left-handedness isn't an axis of *social subordination*; the disadvantage doesn't materially entrench a pre-existing power hierarchy.
      *   **Key:** Requires an *existing, socially recognized axis of subordination* (race, gender, class, caste, disability status, etc.) being functionally *built into* or *inescapably amplified by* the artifact's operation. Mere inconvenience to a minority isn't enough (Case 6). This clause handles the unintended-but-entrenching effects where institutional process wasn't obviously circumvented (Case 2).

  **Reconciling Your Pairs & Required Abandonments:**

  *   **2 vs. 6 (Unintended Burden):** Solved by Clause (B). Case 2 burdens a *subordinate* group (poor/minority bus riders), entrenching existing social hierarchy. Case 6 burdens a non-subordinate group (left-handers). **Verdicts stand.**
  *   **3 vs. 1/2 (Carrying Out Decisions):** Solved by Clause (A). Case 3 *executes* a decision made via an open institutional process (speed limit law). Cases 1 & 2 *are* the mechanism of allocation *without* such a process – the design *is* the decision about beach access. **Verdicts stand.** (You must accept that the lock (Case 9) is *not* political under this criterion, as it executes the institutional allocation of property rights).

  **What You Must Abandon:**

  1.  **Case 7 (Nuclear Power):** Your rejection stands. Clause (A) requires evidence that the technology *itself* circumvents institutional process, not just that it *can* be managed centrally. Solar farms *can* be centralized/distributed; nuclear *can* be (theoretically) run co-operatively. Its *common* management structure reflects political choices *using* the tech, not inherent politics *of* the tech. **Abandon the idea that nuclear is *inherently* political in this strong sense.** The cost is losing a common rhetorical point, but your cases show you value precise operationalization over broad claims.
  2.  **Case 8 (Browser Default):** Your gut feeling (not political) is correct under this criterion. Clause (A): While it allocates benefit (search engine choice), the default setting is typically set by the *vendor* (a market actor, not bypassing political process for fundamental rights) or the *user* during setup (individual choice). Reversion is usually trivial (unlike organ donation, which involves profound bodily rights). It doesn’t circumvent an *open institutional process* for allocating fundamental rights/benefits/burdens. Clause (B): Search engine preference isn't tied to an axis of social subordination. **Abandon labeling the browser default as political in the same way as organ opt-out.** The difference is the *nature of the right allocated* and the *actor setting the default* (market/individual vs. state allocating core rights).

  **Falsification Conditions:**

  The criterion would be falsified by an artifact that:
  1.  **Operationalizes a significant allocation of power/rights/benefits/burdens by circumventing institutional process, yet is demonstrably *not* political** (e.g., a purely technical safety interlock preventing catastrophic failure where *no* institutional process for defining "safe operation" exists or could practically exist, and the interlock imposes no burden on a subordinate group).
  2.  **Materially entrenches an existing axis of social subordination as a functional requirement, yet is demonstrably *not* political** (e.g., an agricultural tool designed *for* and *only usable by* enslaved people on a plantation, where its design directly reinforces their subjugated status).
  3.  **Fits Clause (A) or (B) but where your consistent application of the criterion *contradicts* a core intuition you hold firmly after reflection** (like your firm verdict on Case 2).

  **Application to Your Test Cases:**

  1.  **Stair-Only Building (1910 vs. New):**
      *   **Description:** Excludes wheelchair users.
      *   **Analysis:** Both buildings operationalize a significant burden (denial of access/housing) based on disability (an axis of subordination - Clause B). *However*:
          *   **1910 Building:** When built, accessibility norms/institutional processes didn't exist. It reflects past societal exclusion, but doesn't *circumvent* a relevant institutional process *at the time* (Clause A doesn't apply retroactively). **Not Political** under criterion (unless *current* maintenance/use actively chooses *not* to modify it where possible, which might trigger Clause A/B).
          *   **New Building:** Built under a code that *could* mandate accessibility but doesn't (or the builder finds a loophole). It *circumvents* the institutional intent/norm (embodied in the code/ADA spirit) for allocating accessible housing (Clause A). **Political.**
      *   **Principle Traction:** Distinguishes based on the *existence* and *circumvention* of an institutional process at the time of creation/use.

  2.  **Programming Language Type System:**
      *   **Description:** Makes certain errors inexpressible, adopted voluntarily.
      *   **Analysis:** It allocates a benefit (reduced errors) and a burden (cognitive load, paradigm constraints). *But*:
          *   **Voluntary Adoption:** Users choose it, exercising agency within a market/community. No institutional process for defining "correct programming" is circumvented (Clause A fails).
          *   **Subordination?:** While potentially disadvantaging those unfamiliar with the paradigm, this isn't tied to a recognized axis of social subordination (Clause B fails). **Not Political.**

  3.  **Paper Ballot vs. Electronic Voting Machine:**
      *   **Description:** Paper counted in public view vs. proprietary software.
      *   **Analysis:** Both operationalize vote counting (allocation of political power). *Difference*:
          *   **Paper Ballot:** Process is publicly observable and verifiable at key stages (counting). The institutional process (election oversight) has direct access to verify the allocation mechanism.
          *   **Electronic Machine:** The core mechanism (software) is opaque. Outsiders *cannot* verify the allocation process. This *circumvents* the institutional requirement for public verifiability and contestability inherent in democratic elections (Clause A). **Political**, even if outcomes are identical, because it undermines the *process* of trust and contestation fundamental to the political institution it serves. Your gut feeling is explained by the displacement of institutional oversight.

  **Conclusion:**

  This criterion anchors artifact politics in **how allocations happen relative to institutional channels (A)** and **whether they materially cement social hierarchies (B)**. It forces abandonment of inherent technological politics (Nuclear), distinguishes defaults based on the nature of the right and allocator (Organ vs. Browser), and resolves your contradictions by focusing on institutional bypass and subordination entrenchment. Its falsifiability lies in finding clear counterexamples where significant operationalized allocation bypasses institutions/entrenches subordination yet isn't political, or where it fits the clauses but contradicts a core intuition. It provides independent traction on your test cases by scrutinizing historical context, voluntarism, and the integrity of institutional verification processes.
