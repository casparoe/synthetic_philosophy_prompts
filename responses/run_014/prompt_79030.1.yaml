prompt: |-
  Construct a thought experiment that separates epistemicism from supervaluationism about vagueness without rigging it in either theory's favour. I want it for a seminar exercise, so the aim is a case where the two theories agree on everything an ordinary person inside the case would look at and diverge only underneath. It must be realistic — a committee, a clinic, a workplace, a family — fit in a single paragraph, and turn on one vague predicate applied to three or four borderline items; no sorites series, no grain-counting, and none of the textbook props (heaps, baldness, colour patches). Build it so that the theories agree on whether the claim may be asserted, whether to act on it, and whether the answer could in principle be found out. Two further constraints are the point of the exercise: (i) both theories must hold that, for each borderline item, 'it is F or it is not F' is true, while disagreeing about the disjuncts; (ii) the case must be built so that 'at least one of these is F' is true on every admissible sharpening of the predicate while no single item is. The case may not stipulate either theory's verdicts; the divergence has to be generated by the theories applied to the facts.

  Then do the check. Answer as exactly five numbered items and nothing else — no introduction, no conclusion: (1) the scenario, one paragraph; (2) the epistemicist's verdicts on each question above, with the reasoning that produces them; (3) the supervaluationist's verdicts on the same questions; (4) the one feature of the case the divergence depends on, and what becomes of constraint (ii) if the items can simply be lined up on a single scale; (5) how an epistemicist would attack the case as rigged, and what it still shows if that attack fails. Items 2–5 should be a sentence or two each.
reasoning: |-
  We are to construct a thought experiment that distinguishes epistemicism from supervaluationism without bias. The scenario must be realistic, involve a single vague predicate applied to 3-4 borderline items, and satisfy the following:
  - Both theories agree that for each borderline item, "it is F or it is not F" is true, but they disagree about the disjuncts.
  - The case must be built so that "at least one of these is F" is true on every admissible sharpening, but no single item is F on every sharpening (so that no particular one is determinately F).
  - The theories must agree on the practical aspects: whether the claim may be asserted, whether to act on it, and whether the answer could in principle be found out.

  We are to avoid sorites series, grain-counting, and classic examples.

  After the scenario, we have five numbered items:

  1. The scenario (one paragraph)
  2. Epistemicist's verdicts and reasoning (sentence or two)
  3. Supervaluationist's verdicts (sentence or two)
  4. The key feature that the divergence depends on, and what happens to constraint (ii) if the items are on a single scale
  5. How an epistemicist might attack the case as rigged, and what it shows if the attack fails

  Let me design the scenario:

  **Scenario: A hiring committee must decide whether to offer a position to candidates who are borderline "team players".**

  The committee is evaluating three candidates (A, B, C) for a role that requires being a "team player". All three have mixed records: A is collaborative but sometimes dominates conversations, B is supportive but occasionally misses team meetings for personal reasons, C is generally amiable but has had one heated disagreement with a colleague. Each candidate is a borderline case of a "team player". The committee must decide whether to make an offer to at least one candidate, because the position must be filled. They have full dossiers but no further investigation is possible. The committee agrees that at least one candidate is a team player (so they can make an offer) but cannot agree on which one. 

  Now, note the constraints:

  - For each candidate, it is either a team player or not, but we don't know which (epistemicism). For supervaluationism, it is indeterminate for each candidate whether they are a team player (so the disjunction holds but neither disjunct is true/supertrue).

  - The key: "at least one is a team player" must be true on every admissible sharpening (so supertrue) but no single candidate is a team player on every sharpening (so no candidate is determinately a team player). This is achieved by having in each sharpening exactly one candidate counted as a team player (but different candidates in different sharpenings). For example:
    - Sharpening 1: A is a team player (by being more collaborative than in others), B and C are not.
    - Sharpening 2: B is a team player (by being more supportive than in others), A and C are not.
    - Sharpening 3: C is a team player (by being more amiable than in others), A and B are not.

  Thus, in every sharpening, at least one is a team player, but no candidate is a team player in every sharpening.

  Now, the committee must act: they can assert that there is at least one team player among the three (because it is true on every sharpening, so supertrue) and they can make an offer to one candidate. However, because no candidate is determinately a team player (on supervaluationism) and because on epistemicism one candidate is actually a team player (but we don't know which) they might make an offer arbitrarily.

  But note: the theories must agree on whether the claim may be asserted (yes, because even for supervaluationism "at least one is a team player" is supertrue), whether to act on it (yes, because they must fill the position), and whether the answer could in principle be found out (no, because by stipulation no further investigation is possible and the facts are as they are).

  Now, let's break down:

  **Item 1: The scenario (one paragraph)**

  In a university hiring committee, three candidates (A, B, C) are being considered for a faculty position that requires being a "team player". Each candidate has a borderline case: A is usually collaborative but sometimes overbearing, B is supportive but has missed some meetings, C is generally amiable but had one notable conflict. The committee must fill the position and believes at least one candidate is a team player. They have complete information but no decisive fact to break the borderline status. They agree to assert that at least one is a team player and proceed to randomly select one candidate to offer the job. The committee cannot know which candidate is the team player (if any) even in principle with the available information.

  **Item 2: Epistemicist's verdicts and reasoning**

  The epistemicist holds that for each candidate, either they are a team player or not, but we are irremediably ignorant of which. However, the disjunction "at least one is a team player" is true because in fact one candidate is a team player (though we cannot know which). Therefore, the committee may assert it (since it's true), should act (by making an offer to one candidate, arbitrarily chosen since they cannot know which one is the team player), and it is in principle possible that the truth could be found out (if our epistemic situation improved) but in this case it cannot due to the limitations.

  **Item 3: Supervaluationist's verdicts**

  The supervaluationist holds that for each candidate, it is indeterminate whether they are a team player (so the disjuncts are neither true nor false), but the disjunction "at least one is a team player" is supertrue (true on every sharpening). Therefore, the committee may assert it (because it is supertrue), should act (by making an offer arbitrarily because no candidate is determinately a team player and they must choose one), and the answer could not be found out (because there is no fact of the matter to discover beyond the admissible interpretations).

  **Item 4: Key feature and constraint (ii) with a single scale**

  The key feature is that the borderline cases are arranged such that in every admissible sharpening exactly one candidate is sharpened as a team player, but which candidate it is varies across sharpenings. If the items were on a single scale (like a sorites series), then constraint (ii) would be violated because the items would be ordered and the sharpenings would typically form a contiguous block, making it impossible to have every sharpening have at least one F without having a particular item that is F in every sharpening (if the items are too similar on the scale).

  **Item 5: Epistemicist's attack and what it shows**

  An epistemicist might attack the case as rigged by arguing that the scenario artificially constrains the admissible sharpenings to avoid any candidate being determinately a team player, when in reality there is a fact about each candidate. If the attack fails (i.e., if the supervaluationist can defend the admissibility of the sharpenings as reflecting genuine semantic indecision), then the case shows that supervaluationism can account for the truth of "at least one is F" without requiring that any particular one is F, whereas epistemicism must posit an unknown fact that one candidate is F.

  Now, let's write the five items exactly as required.
answer: |-
  **1.** In a hospital committee reviewing patient referrals for a specialized therapy requiring "severe pain", three cases (P1, P2, P3) are borderline: P1 has chronic back pain that limits work but not daily chores; P2 has migraines causing weekly bedrest but responsive to OTC drugs; P3 has neuropathic pain disrupting sleep but not social functioning. The committee must approve at least one referral to meet quotas, has exhaustive records, and agrees that at least one case qualifies as "severe pain" to justify action, but cannot determine which one. They assert this, randomly select P2 for approval, and accept that no further inquiry could resolve individual statuses due to irreducibly vague criteria.

  **2.** The epistemicist holds that "severe pain" has sharp boundaries unknown to us: each patient either has it or not, so "at least one has severe pain" is true (exactly one does, but we cannot know which); thus, assertion and action are warranted, and the truth could in principle be found with perfect knowledge, though not here.

  **3.** The supervaluationist holds that "severe pain" has multiple admissible sharpenings: each sharpening makes exactly one patient count as severe (varying by case), so "at least one has severe pain" is supertrue (true on all sharpenings), but no patient is severe on all sharpenings; thus, assertion and action are warranted, but no fact exists to discover—indeterminacy is ontological.

  **4.** The divergence depends on the multidimensional variation in pain manifestations (e.g., frequency, intensity, functional impact), preventing any patient from being severe in all sharpenings; if cases were on a single scale (e.g., pain intensity only), constraint (ii) would fail, as sharpenings might agree on a "least severe" item being non-severe, violating "at least one is F is true on every sharpening".

  **5.** An epistemicist might attack the case as rigged by arguing that real-world "severe pain" must have context-independent sharp boundaries, making one patient determinately severe; if this fails (e.g., due to genuine multidimensional vagueness), it still shows that supervaluationism avoids positing arbitrary hidden facts.
