prompt: |-
  I've spent a lot of time over the past few years thinking about when an action is morally required and when it's just especially good — the kind of thing we admire but don't think someone has failed at if they don't do it. I've kept a running list of cases and my gut reactions to them, and I'm trying to figure out whether there's a single principle behind my judgments or whether I'm just inconsistent. I'd like you to help me work through this.

  Here are the cases and my verdicts:

  1. **The pond.** A child is drowning in a shallow pond. You can wade in and save them, but it will ruin your suit. Verdict: you have a duty to save the child. This isn't heroic; it's basic.

  2. **The kidney.** You learn you're a tissue match for a stranger who will die without a kidney transplant. The surgery carries real risks and requires weeks of recovery. Verdict: donating would be supererogatory — deeply admirable, but not something you've failed at if you don't do it.

  3. **The ten percent.** You earn a comfortable salary in a wealthy country. You could give ten percent of your income to organizations that reliably save lives in very poor countries — bed nets, deworming, that sort of thing. Verdict: I cannot settle on one. Some days it feels like a duty, some days it feels supererogatory. This is the case that bothers me most.

  4. **The 911 call.** You witness a car crash. Calling 911 costs you nothing. Verdict: duty, obviously.

  5. **The grenade.** A soldier throws themselves onto a live grenade to absorb the blast and save their squad. Verdict: supererogatory. No one is required to do this.

  6. **The lonely neighbor.** Your elderly neighbor has no family nearby and is clearly lonely. You could visit for an hour each week. It's not an emergency and the cost is modest but ongoing. Verdict: supererogatory, though I'd think less of someone who never did it.

  7. **The doctor after hours.** A doctor at a rural clinic has a patient who will deteriorate badly unless someone stays three hours past the end of the shift to stabilize them. No one else is available. Verdict: duty. It comes with the role.

  8. **The mugging.** You're walking home at night and see someone being attacked. Calling the police is a duty, but physically intervening would put you at serious risk of injury. Verdict: intervening is supererogatory.

  9. **The life's work.** Someone spends their entire career working in disaster relief, living modestly and taking real risks, for decades. Verdict: the whole shape of the life feels supererogatory. But I'm not sure why it feels different from a whole life of doing many small duties — if each individual act were a duty, would the whole life still be supererogatory? Or does the fact that it feels supererogatory mean I don't really think the individual acts are duties?

  What I'm stuck on is this: cases 1 and 8 both involve helping a stranger at some physical cost to yourself, but one feels like a duty and the other feels supererogatory. You might say the difference is the level of risk — but then case 2 involves serious risk and feels supererogatory, while case 7 involves no physical risk and feels like a duty because of the role. And case 3 involves no physical risk at all, yet I can't decide. So I suspect I'm using at least two or three different factors — magnitude of sacrifice, immediacy of the need, whether you have a special role, whether you're the only one who can help — but I can't state how they combine.

  What I'm asking for: Is there a principle, or a small set of principles, that captures most of these verdicts? State it as precisely as you can. Tell me which of my verdicts it preserves and which it overturns. Tell me what it says about case 3 — the ten percent — and about case 9. And if you have to overturn some of my verdicts, tell me which ones and why I should let them go. I'd also like you to test your principle against a case I haven't listed — one that might reveal a weakness in it.

  Please think very carefully before answering, and respond in the style of an expert moral philosopher working through the problem step by step. I'm less interested in a label for the view than in seeing the reasoning laid out clearly.
reasoning: |-
  Hmm, the user has presented a sophisticated moral dilemma about distinguishing between duties and supererogatory acts. They've compiled nine carefully considered cases with their intuitive judgments and are struggling to find a unifying principle. What they're really seeking is moral consistency - they want to understand whether their intuitions can be systematized or if they're fundamentally contradictory.

  Looking at their cases, I notice several tension points: The pond case (minimal cost) is obligatory while kidney donation (significant cost) isn't; the 911 call (zero cost) is required but ongoing charity giving divides them; professional roles create duties (doctor case) while life commitments remain optional. The user seems particularly troubled by case 3 (10% income donation) and case 9 (lifetime commitment), where their intuitions feel unstable.

  I think the key factors emerging are: cost magnitude (both immediate and cumulative), relational proximity (including roles), preventability of harm, and agency uniqueness. But what's interesting is how these interact - for instance in the grenade case, extreme cost overrides uniqueness, while in the doctor case, professional role overrides personal cost.

  For a unifying framework, I'm considering a modified version of the standard model of moral requirements with two key thresholds: a harm prevention baseline modulated by cost ceilings. The professional role element seems particularly important - it creates a "duty multiplier" effect. For the charity case, the ongoing nature creates a "cost accumulation" problem that makes it feel differently from one-time rescues.

  The lifetime commitment case is especially revealing - it suggests our intuitions track aggregate sacrifice differently than individual acts. This might explain why the user feels differently about repeated charitable donations versus the pond rescue, even if the principle is similar.

  When testing against new cases, I should consider something that pits professional ethics against extreme personal cost, or situations where small recurring costs create large cumulative burdens. The challenge will be articulating how the "reasonable cost" threshold operates differently for one-time versus ongoing commitments.
answer: |-
  I appreciate the rigor and introspection in your approach. You've identified a core tension in moral philosophy: distinguishing **duties** (what morality demands) from **supererogation** (what morality admires but doesn't demand). Your cases reveal nuanced intuitions that resist simple categorization. After analyzing your judgments, I propose a principle that integrates your key factors (sacrifice, role, immediacy, uniqueness, harm severity) into a coherent framework.

  ### The Proposed Principle
  **An agent has a moral duty to prevent significant harm to others if:**
  1.  **The harm is severe and imminent;**
  2.  **The agent can prevent it at a cost that is:**
      *   **Minimal or moderate** (considering magnitude, nature, and cumulative burden);
      *   **Not substantially disproportionate** to the harm prevented;
      *   **Significantly discounted** if the agent bears special responsibility due to role, relationship, or causal involvement.
  3.  **The agent is uniquely or critically positioned to help.**

  If the cost exceeds this threshold—especially if it involves severe risk, extreme sacrifice, or substantial cumulative burden—the act becomes supererogatory.

  ### How the Principle Applies to Your Cases

  | **Case**          | **Your Verdict**      | **Principle's Verdict** | **Reasoning** |
  |-------------------|----------------------|------------------------|--------------|
  | **1. Pond**       | Duty                 | **Duty**               | **Severe, imminent harm.** Cost (ruined suit) is minimal and not disproportionate. You are uniquely positioned. |
  | **2. Kidney**     | Supererogatory       | **Supererogatory**     | Severe harm, but cost (surgery risk, recovery) is substantial and disproportionate to normal expectations. No special role. |
  | **3. Ten Percent**| Mixed                | **Duty (qualified)**   | Severe, ongoing harm (preventable deaths). Cost (10% income) is moderate and not disproportionate for affluent individuals. You are broadly positioned to help. *Caveat: Cumulative burden matters—duty may allow flexibility in timing/methods.* |
  | **4. 911 Call**   | Duty                 | **Duty**               | Severe, imminent harm. Cost is negligible. You are uniquely positioned as witness. |
  | **5. Grenade**    | Supererogatory       | **Supererogatory**     | Severe, imminent harm. Cost (certain death) is extreme and disproportionate. Role (soldier) increases expectation but doesn't mandate self-sacrifice. |
  | **6. Lonely Neighbor**| Supererogatory   | **Supererogatory**     | Harm (loneliness) is non-imminent and less severe. Cost (ongoing time) is moderate but cumulative. No special role beyond proximity. |
  | **7. Doctor**     | Duty                 | **Duty**               | Severe, imminent harm. Cost (extra hours) is moderate. **Special role (doctor)** significantly discounts the cost threshold. Uniquely positioned. |
  | **8. Mugging**    | Supererogatory (intervene) | **Supererogatory (intervene)** | Severe, imminent harm. Physical intervention cost (injury risk) is high and disproportionate. Calling police (negligible cost) remains a duty. |
  | **9. Life's Work**| Supererogatory       | **Supererogatory**     | Individual acts (e.g., specific aid missions) likely meet duty thresholds. **Cumulative burden** of lifelong risk and sacrifice exceeds reasonable cost ceiling, elevating the whole beyond duty. |

  ### Key Insights from the Principle
  1.  **Cost Threshold is Dynamic:** The "reasonable cost" ceiling isn't fixed. It's lowered by roles (doctor), relationships (neighbor), or culpability (causing harm). It's raised by extreme sacrifice (grenade) or cumulative burden (life's work).
  2.  **Cumulative Burden Matters:** Case 9 feels supererogatory because a life of high sacrifice exceeds what duty demands, even if individual acts are obligatory. Similarly, Case 3's recurring cost creates hesitation—our intuitions track aggregate sacrifice.
  3.  **Role as a Duty Multiplier:** Professional/contractual roles (Case 7) create stronger obligations by lowering the cost threshold. Social roles (neighbor) are weaker multipliers.
  4.  **Harm Severity/Immediacy vs. Cost:** The pond (low cost, high immediacy) is obligatory; the kidney (high cost, less immediacy) is not. Case 3's harm is severe but diffuse, making cost assessment harder.

  ### Reconciling Your Conflicts
  *   **Case 1 vs. Case 8:** The difference isn't just risk magnitude. The pond involves *certain*, *immediate* death preventable at *minimal* cost. The mugging intervention involves *uncertain*, *extreme* risk to yourself. The cost-risk profile is categorically different.
  *   **Case 3 (Ten Percent):** Your hesitation is understandable. The principle clarifies:
      *   **Duty:** Preventing severe harm at moderate cost (for affluent earners) is obligatory.
      *   **Qualification:** The *ongoing* nature introduces a legitimate concern about cumulative burden. Duty likely permits flexibility (e.g., pausing during personal hardship, choosing effective charities) but doesn't negate the core obligation.
  *   **Case 9 (Life's Work):** The principle explains why it feels supererogatory: a life defined by high sacrifice exceeds the aggregate "reasonable cost" ceiling of duty, even if individual acts are obligatory. This doesn't imply those individual acts *weren't* duties—it reflects that perpetually operating at the upper limit of cost transforms the *whole* into supererogation.

  ### Testing the Principle: A New Case
  **The Factory Manager:** You manage a factory. A fire breaks out. You can attempt to shut down a critical valve to prevent an explosion that would kill 20 workers. Success is likely but not guaranteed; attempting it carries a 10% risk of fatal burns to you. *Is attempting shutdown a duty or supererogatory?*

  *   **Principle Analysis:**
      *   **Harm:** Severe, imminent (certain death for 20).
      *   **Uniqueness:** As manager, you likely know the system best.
      *   **Role:** Significant responsibility for worker safety.
      *   **Cost:** High (10% fatality risk) but arguably not *disproportionate* to preventing 20 deaths, especially given your role.
      *   **Verdict:** **Duty.** The role and uniqueness lower the cost threshold; the risk, while serious, is not extreme/inevitable like the grenade. Most would condemn a manager who fled.

  ### Conclusion
  Your intuitions are largely consistent under a principle where **duty arises when preventing severe harm requires costs within a dynamic, role-sensitive threshold of reasonableness.** The overturned verdict is Case 3: giving 10% is a duty (with flexibility), not supererogatory. This aligns with philosophers like Peter Singer (on effective altruism) and Barbara Herman (on role morality).

  **Why accept this overturn?** Your conflicting feelings about Case 3 likely stem from discomfort with the *implications* of the duty, not its logic. The principle forces consistency: if saving a child in a pond (minimal cost) is a duty, saving a child via malaria nets (moderate cost) must be too, unless the cost exceeds reasonableness. For affluent individuals, 10% doesn't meet that threshold—it preserves a comfortable life while preventing grave harm. Recognizing this duty is challenging but necessary for moral coherence.

  This framework doesn't eliminate all hard choices (e.g., precise cost ceilings remain debatable), but it systematizes your core intuitions and provides a tool for navigating new dilemmas.
