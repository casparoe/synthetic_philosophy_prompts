  First, I need to disentangle the six distinct objections bundled under "separateness of persons" in the literature: 
  - The ontological objection (Rawls' core argument about social entities)
  - The subject-of-compensation objection (Nagel's point about compensation across lives)
  - The integrity objection (Williams' alienation critique)
  - The distribution-insensitivity objection (ignoring how utility is distributed)
  - The demandingness objection (supererogation problem)
