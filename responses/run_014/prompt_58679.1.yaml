prompt: |-
  As facilitator of an 80-minute university extension workshop on collective reasoning for 16 non-specialist adults, I need a structured voting exercise in which participants produce an inconsistent group verdict from consistent individual votes before the phenomenon is named or explained. Base the exercise on this admissions case: a candidate is to be admitted only if judged both qualified on merit and admissible given capacity, with privately assigned viewpoints distributed so that majorities favor each criterion separately while a majority opposes admission. Specify the step-by-step procedure, ballot materials and tabulation method, followed by a debrief that connects each stage of what happened to premise-based versus conclusion-based aggregation. Include likely facilitation problems with remedies, and identify one central aspect of the general impossibility results that the exercise necessarily simplifies and must be stated explicitly.
reasoning: |-
  We are going to design a workshop exercise that demonstrates the discursive dilemma (or doctrinal paradox) in collective reasoning. The scenario: a candidate is to be admitted only if judged both qualified on merit and admissible given capacity. We want each participant to vote on two premises (merit and capacity) and the conclusion (admission). We will set up the individual votes so that a majority thinks the candidate is qualified on merit, a majority thinks the candidate is admissible on capacity, but a majority votes against admission (which would require both). This leads to an inconsistency when we aggregate: if we aggregate by premises, we get admission (because both premises are approved by majority), but if we aggregate by conclusion, we get non-admission (because a majority voted against admission).

   Steps:

   1. Preparation:
      - We have 16 participants. We will assign viewpoints to them so that:
          - On merit: 9 vote "Yes" (qualified), 7 vote "No".
          - On capacity: 9 vote "Yes" (admissible), 7 vote "No".
          - However, we want the votes on admission to be such that at least 9 vote "No" (so majority against admission).

      How to assign? We want the individual votes to be consistent: each participant votes on admission based on their merit and capacity votes (i.e., they vote for admission only if both are yes). So we need to assign the pairs (merit, capacity) such that we have:

          Group A: (Yes, Yes) -> they vote Yes for admission. We want less than 8 of these (so that majority against admission). Let's set 5 participants in this group.
          Group B: (Yes, No) -> No for admission. We need 4 to get 9 on merit? Wait, let me recast:

          We need:
            merit: 9 yes, 7 no -> so 9 yes on merit must come from:
              Group A: (Yes, Yes) -> 5
              Group B: (Yes, No) -> 4   (so 5+4=9 yes on merit)

            capacity: 9 yes, 7 no -> the yes on capacity must come from:
              Group A: (Yes, Yes) -> 5
              Group C: (No, Yes) -> 4   (so 5+4=9 yes on capacity)

          Then we have:
            Group D: (No, No) -> 3   (to make 16: 5+4+4+3=16)

          Now, let's see the votes on admission:
            Group A: 5 vote Yes
            Group B: 4 vote No (because they have capacity No)
            Group C: 4 vote No (because they have merit No)
            Group D: 3 vote No (both No)
            Total No on admission: 4+4+3 = 11 -> which is a majority (11 > 5).

          So we have:
            merit: Group A (5) + Group B (4) = 9 yes -> majority for merit.
            capacity: Group A (5) + Group C (4) = 9 yes -> majority for capacity.
            admission: only Group A (5) yes, the rest (11) no -> majority against.

      So we assign:
          - 5 participants: (merit: Yes, capacity: Yes) -> admission: Yes
          - 4 participants: (merit: Yes, capacity: No) -> admission: No
          - 4 participants: (merit: No, capacity: Yes) -> admission: No
          - 3 participants: (merit: No, capacity: No) -> admission: No

   2. Materials:
      - Ballot papers that have:
          [ ] The candidate is qualified on merit.
          [ ] The candidate is admissible given capacity.
          [ ] The candidate should be admitted.

          Each participant will get a ballot with these three questions. But note: we are assigning their viewpoints. So we will actually pre-assign the votes by giving them a slip that tells them how to vote? Alternatively, we can assign them to groups and tell each group how to vote.

      - Alternatively, we can assign the participants to groups (without telling them the group labels) and give each group a card with their assigned votes. We have four groups: A, B, C, D.

      - We need to prepare:
          - Group A (5 people): card says:
              "You believe:
               - The candidate is qualified on merit. (Yes)
               - The candidate is admissible given capacity. (Yes)
               Therefore, you vote to admit the candidate. (Yes)"

          - Group B (4 people): card says:
              "You believe:
               - The candidate is qualified on merit. (Yes)
               - The candidate is NOT admissible given capacity. (No)
               Therefore, you vote NOT to admit the candidate. (No)"

          - Group C (4 people): card says:
              "You believe:
               - The candidate is NOT qualified on merit. (No)
               - The candidate is admissible given capacity. (Yes)
               Therefore, you vote NOT to admit the candidate. (No)"

          - Group D (3 people): card says:
              "You believe:
               - The candidate is NOT qualified on merit. (No)
               - The candidate is NOT admissible given capacity. (No)
               Therefore, you vote NOT to admit the candidate. (No)"

      - Alternatively, to make it more engaging, we might give them a scenario and then let them form their own opinion? But we need the specific distribution. So it's better to assign the viewpoints to get the desired result.

   3. Procedure:

      Step 1: Introduction (5 minutes)
          - Explain the context: We are an admissions committee. The rule: admit only if the candidate is both qualified on merit and admissible given capacity (which means we have enough space/resources).
          - Each member will vote on three things: merit, capacity, and admission.

      Step 2: Assign roles and distribute ballots (5 minutes)
          - Divide the 16 participants into four groups without revealing the group labels. Assign the group sizes: 5, 4, 4, 3. Give each participant in a group the same instruction card (as above) that tells them their beliefs and how they should vote.

      Step 3: Voting (10 minutes)
          - Each participant fills out a ballot with their votes for:
              P1: Merit (qualified on merit?): Yes/No
              P2: Capacity (admissible given capacity?): Yes/No
              C: Admission (admit?): Yes/No

          - They are instructed to vote according to their assigned beliefs.

      Step 4: Collect and tabulate (20 minutes)
          - We will tabulate in two ways:

            a. Premise-based aggregation:
               - Collect all votes on merit: count the yes and no.
               - Collect all votes on capacity: count the yes and no.
               - Then, according to the rule: if both premises have a majority yes, then the collective decision should be to admit.

            b. Conclusion-based aggregation:
               - Collect all votes on admission: count the yes and no.

          We expect:
            Premise-based: 
               Merit: 9 yes -> majority yes.
               Capacity: 9 yes -> majority yes.
               Therefore, collective decision by premises: admit.

            Conclusion-based:
               Admission: 5 yes, 11 no -> majority no, so collective decision: do not admit.

          This is the inconsistency.

      Step 5: Reveal the results (5 minutes)
          - Show the counts for merit, capacity, and admission.

      Step 6: Debrief (35 minutes)
          - Explain the two methods of aggregation: premise-based vs. conclusion-based.
          - Highlight the inconsistency: the group says the candidate meets both criteria (by majority on each premise) but also says the candidate should not be admitted (by majority on the conclusion).
          - Discuss: 
              - Which method seems more logical? 
              - Why did this happen? (Because the majority on the conclusion is formed by different coalitions: those who think one premise fails. But when we look at premises separately, each premise has a majority.)

          - Connect to the doctrinal paradox: when a group must decide on both premises and a conclusion that is a function of the premises, the method of aggregation can lead to different outcomes.

          - Discuss the implications for collective decision-making.

   4. Likely facilitation problems and remedies:

      a. Problem: Participants might not understand their assigned role.
          Remedy: Clearly explain the role on the card and the reasoning (they are given beliefs and must vote accordingly). Have a practice round.

      b. Problem: The participants might be confused by the two aggregation methods.
          Remedy: Use clear visual aids (flip charts, slides) to show the two paths: 
              Path 1 (premise): 
                  Step 1: Count merit -> majority says yes.
                  Step 2: Count capacity -> majority says yes.
                  Step 3: Therefore, by the rule, admit.

              Path 2 (conclusion):
                  Step 1: Count the admission votes -> majority says no.
                  Step 2: Therefore, do not admit.

      c. Problem: Participants might question the realism of the assigned viewpoints.
          Remedy: Explain that the scenario is constructed to illustrate a theoretical point, but that such situations can occur in real committees. Alternatively, if time allows, let them discuss in small groups why they hold their assigned beliefs (but without changing the votes).

      d. Problem: Time management: the exercise might run long.
          Remedy: Allocate time strictly. Have a timer.

   5. One central aspect of the general impossibility results that the exercise necessarily simplifies:

      The exercise simplifies the fact that in reality, individual judgments may be more complex and the group may have more than two premises and a conclusion. The general impossibility results (like the List-Pettit theorem) show that there is no aggregation rule that can simultaneously satisfy a set of desirable conditions (such as universal domain, collective rationality, anonymity, and systematicity) when the group is deciding on multiple interconnected propositions. The exercise focuses on a specific case (three propositions) and two aggregation methods. We must explicitly state that the exercise does not cover the full range of impossibility results but illustrates a specific paradox that can occur.

      We must state that the impossibility results show that it is generally impossible to design an aggregation method that always produces consistent collective judgments in all possible configurations of individual judgments (that are themselves consistent) while also satisfying other basic democratic conditions.

      In the debrief, we can note that the exercise illustrates a particular instance of a larger problem: collective decision-making on multiple interconnected issues can lead to inconsistencies, and no perfect aggregation method exists that avoids all such problems.

   6. Materials:

      - Instruction cards for each group (with the group's votes).
      - Ballot papers for each participant (with the three questions and Yes/No checkboxes).
      - Flip chart or whiteboard for tabulation.

      Ballot paper example:

          Admission Committee Ballot

          Candidate: [Name]

          Please indicate your vote by checking the appropriate box:

          The candidate is qualified on merit:
              [ ] Yes      [ ] No

          The candidate is admissible given capacity (space/resources):
              [ ] Yes      [ ] No

          The candidate should be admitted:
              [ ] Yes      [ ] No

          Note: According to the rules, the candidate should be admitted only if both of the first two criteria are met.

      However, note that we are assigning the votes. So the ballot is just a form to record their assigned votes.

   7. Adjustments for non-specialists:

      - Use simple language.
      - Avoid jargon until the debrief.
      - Make the scenario relatable (e.g., admitting a student to a popular program with limited spaces).

  Let's now write the step-by-step procedure with estimated times.
answer: |-
  ### Structured Voting Exercise: Admissions Committee Dilemma  
  **Objective:** Demonstrate how consistent individual votes can lead to an inconsistent group verdict via premise-based vs. conclusion-based aggregation.  

  ---

  #### **Step-by-Step Procedure**  
  **Total Time:** 80 minutes  
  **Participants:** 16 non-specialist adults  

  1. **Introduction (10 min)**  
     - Context: "We are an admissions committee deciding whether to admit a candidate. Rules: Admit **only** if the candidate is **qualified on merit** (Premise 1) **and** **admissible given capacity** (Premise 2)."  
     - Task: "Each of you will vote privately on three questions: Premise 1, Premise 2, and the Conclusion (admission)."  
     - Distribute **ballot cards** (see *Materials* below) and pens.  

  2. **Role Assignment & Voting (15 min)**  
     - Assign participants to **four hidden groups** using numbered cards (Group A: 5 people, B: 4, C: 4, D: 3).  
     - Give each group a **private viewpoint card**:  
       - **Group A (5)**: "Vote YES on Merit, YES on Capacity, YES on Admission."  
       - **Group B (4)**: "Vote YES on Merit, NO on Capacity, NO on Admission."  
       - **Group C (4)**: "Vote NO on Merit, YES on Capacity, NO on Admission."  
       - **Group D (3)**: "Vote NO on Merit, NO on Capacity, NO on Admission."  
     - Participants mark ballots **individually** based on their group’s viewpoint.  

  3. **Ballot Collection & Tabulation (15 min)**  
     - Collect ballots in three separate boxes: **Premise 1 (Merit)**, **Premise 2 (Capacity)**, **Conclusion (Admission)**.  
     - Publicly tally votes on a whiteboard:  
       | **Question**          | **Yes** | **No** |  
       |------------------------|---------|--------|  
       | Premise 1 (Merit)      | 9       | 7      |  
       | Premise 2 (Capacity)   | 9       | 7      |  
       | Conclusion (Admission) | 5       | 11     |  

  4. **Reveal the Inconsistency (5 min)**  
     - Announce:  
       - "Majority says YES: Candidate is qualified (9–7)."  
       - "Majority says YES: Candidate is admissible (9–7)."  
       - "But majority says NO to admission (11–5)."  
     - Pause for reactions: *"What’s wrong here? The group says the candidate meets both criteria, yet rejects admission!"*  

  ---

  #### **Debrief: Connecting to Aggregation Methods (25 min)**  
  **Facilitator Script:**  
  > "Let’s break down what happened using two decision-making approaches:  

  1. **Premise-Based Aggregation** (10 min):  
     - "We aggregated votes **separately on each premise** (merit/capacity). The rule was: *Admit only if both premises pass*."  
     - Result: Both premises had majority support (9–7), so **admission should occur**.  
     - **Conflict:** This clashes with the direct vote on admission (11 rejected it).  

  2. **Conclusion-Based Aggregation** (10 min):  
     - "We aggregated votes **only on the final conclusion** (admission), ignoring premises."  
     - Result: Majority rejected admission (11–5), so **no admission**.  
     - **Conflict:** This ignores that most members accepted the premises!  

  3. **Key Insight** (5 min):  
     - "Individually, everyone voted consistently: *If both premises YES → Admission YES; else NO*.  
     - But collectively:  
       - Premise-based: Admits (due to separate majorities).  
       - Conclusion-based: Rejects (due to majority on conclusion).  
     - **The paradox:** Both methods are logical, but they contradict! This is the **doctrinal paradox**."  

  ---

  #### **Materials**  
  - **Ballot Cards** (16 copies):  
    > **Admissions Committee Ballot**  
    > Candidate: Alex Chen  
    > Rule: Admit ONLY if BOTH criteria are met.  
    >   
    > 1. Qualified on merit?  
    >    [ ] Yes  [ ] No  
    > 2. Admissible given capacity?  
    >    [ ] Yes  [ ] No  
    > 3. Should Alex be admitted?  
    >    [ ] Yes  [ ] No  

  - **Viewpoint Cards** (4 sets, size-adjusted for groups):  
    - Group A: "Vote: YES, YES, YES."  
    - Group B: "Vote: YES, NO, NO."  
    - Group C: "Vote: NO, YES, NO."  
    - Group D: "Vote: NO, NO, NO."  

  - **Tally Sheets** for public counting.  

  ---

  #### **Facilitation Problems & Remedies**  
  1. **Problem:** Participants resist assigned viewpoints.  
     - *Remedy:* Emphasize role-playing: "This is a simulation—your card reflects a committee member’s stance."  

  2. **Problem:** Confusion between premises/conclusion.  
     - *Remedy:* Use simple icons (e.g., ✅ for premises, 🎓 for conclusion). Repeat the rule: "BOTH ✅ → 🎓."  

  3. **Problem:** Time crunch during tabulation.  
     - *Remedy:* Assign two volunteers to count ballots; use pre-formatted tally sheets.  

  4. **Problem:** Debrief becomes abstract.  
     - *Remedy:* Anchor discussion in the admissions example: "Why might a committee member vote NO on admission despite YES/YES?" (e.g., strategic voting).  

  ---

  #### **Simplification of Impossibility Results**  
  The exercise **simplifies the general impossibility of consistent group decisions** (as in Arrow’s Theorem or List-Pettit). Crucially, we assume:  
  - **Fixed decision rule** ("Admit iff both premises pass").  
  - **No strategic voting** (participants vote sincerely).  

  **Explicit Statement for Debrief:**  
  > "In reality, **no perfect voting system exists** that guarantees consistent group decisions across all scenarios while respecting individual preferences. This exercise shows one paradox, but broader theorems prove it’s *impossible* to avoid all contradictions under basic democratic principles."  

  ---  
  **Outcome:** Participants experience the doctrinal paradox firsthand, setting the stage for deeper discussion on deliberation, voting systems, and collective rationality.
