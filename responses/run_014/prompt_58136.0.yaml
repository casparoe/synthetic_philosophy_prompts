  Okay, let me tackle this user's problem. They had a long argument with their friend about voting rights and can't figure out her underlying rule. The user provided six specific cases where their friend made decisions about who should vote, and now they want to predict her stance on seasonal Jamaican farmworkers in their county.

  First, I need to analyze the friend's existing positions. She supports voting rights for long-term documented immigrants without citizenship but opposes it for expats living abroad long-term. She also denies voting rights to Canadians affected by US runoff and short-term exchange students, while supporting incarcerated individuals' voting rights. She opposes voting for 15-year-olds despite their stake in climate policy.

  Looking at these cases, two possible rules emerge: the "Life-Linked Stake" rule and the "Formal Membership" rule. The Life-Linked Stake focuses on whether a person's daily life is governed by local rules and if they have a long-term stake in the community, even without formal citizenship. This would explain her support for immigrants and prisoners. The Formal Membership rule prioritizes legal status and permanence, which aligns with excluding expats and teenagers.

  For the Jamaican farmworkers, they spend most of the year in the county, live under local regulations, and are directly affected by the housing measure. But their visas prohibit permanent settlement. If the friend uses Life-Linked Stake, she might support their voting rights due to their prolonged seasonal presence and direct impact. If she uses Formal Membership, she'd likely oppose it because they aren't permanent residents.

  Considering her past emphasis on "settled presence" over legal status (like with immigrants) and her rejection of expats who no longer live locally, I suspect she'll lean toward Life-Linked Stake and support the farmworkers' right to vote. Her reasoning might highlight their recurring long-term involvement and direct subjection to county laws.

  To distinguish between the rules, a test case could involve someone with permanent residency who lives abroad temporarily versus a long-term visa holder deeply integrated locally. The Life-Linked Stake rule would support the latter, while Formal Membership would support the former.
