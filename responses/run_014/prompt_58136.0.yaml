  Based on your friend's existing verdicts, two distinct but internally consistent rules emerge. Here's the breakdown, the prediction for the Jamaican orchard workers, my best guess, and a test case to separate the rules:

  **Two Possible Rules Fitting All Six Verdicts:**

  1.  **Rule 1: Life-Linked Stake & Governance Principle**
      *   **Core Idea:** Voting rights belong to those whose *daily lives and long-term well-being are demonstrably shaped by the government's decisions in the jurisdiction*, and who are subject to its *direct, comprehensive governance* on a sustained basis. Citizenship status is secondary; presence, integration, and being governed are primary. Temporary presence or lack of long-term stake disqualifies.
      *   **Fits Verdicts:**
          *   **Documented Immigrant (Yes):** Lives, works, raises family, governed daily for 8 years. High life-linked stake.
          *   **Expat Cousin (No):** Not governed daily, life not shaped by local US decisions despite interest/family. Long-term stake severed.
          *   **Downstream Canadians (No):** *Affected* by US actions, but not *governed* by US laws in their daily Canadian lives. No sustained subjection to US jurisdiction.
          *   **Exchange Student (No):** Temporary presence, minimal long-term stake, subject to *some* rules but not comprehensive governance.
          *   **Incarcerated (Yes):** Entire daily life is governed by the state, profoundly affected by its laws. Life-linked stake undeniable.
          *   **15-Year-Olds (No):** Lacks full independence and sustained responsibility under governance (e.g., cannot sign contracts fully, parental authority); while affected long-term, current *daily governance* relationship isn't that of an independent adult.
      *   **Prediction for Orchard Workers:** **YES, they should vote.** They live under comprehensive county governance (sheriff, housing codes, health inspections) for the majority of the year, year after year. The specific ballot measure directly impacts their immediate living conditions. They have a demonstrable life-linked stake *while present* and are subject to sustained, comprehensive local authority during their seasonal residency.

  2.  **Rule 2: Formal Membership & Permanent Settlement Principle**
      *   **Core Idea:** Voting rights belong to those formally recognized as *permanent members of the political community*, implying a settled intention to remain indefinitely and participate fully in society. Citizenship is the clearest marker, but long-term permanent residency (with a path to citizenship or indefinite stay) can qualify. Temporary status, regardless of impact, disqualifies. Presence matters, but permanence is key.
      *   **Fits Verdicts:**
          *   **Documented Immigrant (Yes):** Implied long-term/permanent presence (8 years, job, family). Likely on a path to citizenship or permanent residency. Settled member.
          *   **Expat Cousin (No):** Formally a citizen, but has permanently settled elsewhere, abandoning membership in the *active* US political community.
          *   **Downstream Canadians (No):** Not citizens or permanent residents; belong to a separate political community.
          *   **Exchange Student (No):** Explicitly temporary status, no intention/permission for permanent settlement.
          *   **Incarcerated (Yes):** Retains formal citizenship/permanent residency status; incarceration is temporary; they remain members of the community.
          *   **15-Year-Olds (No):** Lacks the formal status of legal adulthood required for full political membership. The cutoff is based on legal recognition.
      *   **Prediction for Orchard Workers:** **NO, they should not vote.** Their visas explicitly prohibit permanent settlement and require annual departure. They are temporary workers, not permanent residents. While impacted *while present*, they lack formal permanent membership status in the county/state/nation. Their permanent home and political community are in Jamaica.

  **Best Guess for Your Friend's Verdict (with Reasons):**

  I strongly suspect your friend will say **YES, the Jamaican orchard workers SHOULD be able to vote in the county elections.**

  *   **Why?** Her most distinctive position is supporting non-citizen voting for the documented immigrant. This strongly leans towards **Rule 1 (Life-Linked Stake & Governance)**, prioritizing being governed and having a daily-life stake over formal citizenship. Her reasoning against the expat cousin ("hasn't lived here in 18 years") emphasizes *local presence and governance*, not just formal citizenship. Her "no" on the exchange student highlights *temporary* presence, contrasting with the *sustained, recurring* presence of the orchard workers (10 years, 8 months/year).
  *   **Predicted Reasoning:** She will likely focus on:
      *   **Sustained, Recurring Presence:** "They've been coming back for *years*, spending most of the year here. It's not temporary like the exchange student."
      *   **Direct Subjection to Governance:** "They live under the sheriff's rules, the housing codes, the health inspections *every single day* they're here. The county *directly* governs their lives while they're in the camp."
      *   **Direct Impact of Ballot Measure:** "This housing measure is literally *about* where they live! They have the biggest stake in it right now."
      *   **Contrast with Downstream Canadians:** "They aren't just *affected* like the Canadians; they live *inside* the county and are *ruled by* the county government."
      *   **Minimizing Visa Status:** "Yeah, they have to leave, but for 8 months a year, this *is* their home, and they're governed like anyone else here. The rule about no permanent settlement shouldn't block their voice on the rules they live under *now*."

  **Test Case to Separate Rule 1 vs. Rule 2:**

  **The Case:** A highly skilled foreign worker on a **5-year H-1B visa** (non-immigrant intent, but renewable/extendable). They have lived and worked in the county for **4 years**, own a home, pay property and income taxes, have kids in local schools, volunteer in the community, and actively participate in neighborhood associations. Their visa status *requires* them to maintain foreign residency intent and doesn't guarantee permanent residency (though they might be eligible to apply eventually). A crucial county referendum on school funding and property tax rates is coming up.

  *   **Rule 1 (Life-Linked Stake & Governance) Prediction:** **YES.** They live under comprehensive local governance daily, have a major life-linked stake (kids in schools, property taxes, home ownership), and are integrated into the community. The 4-year sustained presence and the direct impact of the referendum outweigh the technically "temporary" visa status.
  *   **Rule 2 (Formal Membership & Permanent Settlement) Prediction:** **NO.** Despite integration and impact, they lack permanent resident status (Green Card). Their visa is temporary (even if extendable) and explicitly requires non-immigrant intent. They are not formally recognized as permanent members of the political community yet.

  This case cleanly separates the rules because it features deep integration and high life-linked stake (appealing to Rule 1) but lacks the formal status of permanent residency or citizenship (the requirement for Rule 2). Your friend's verdict here would be highly revealing.
