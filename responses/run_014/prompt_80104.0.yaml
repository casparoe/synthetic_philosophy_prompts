prompt: |-
  Quick one, sorry if it's a bit rambling, I typed this up between office hours. I keep reaching for an analogy in my intro ethics course to motivate expressivism: moral judgments are a bit like 'Bless you' or 'Thank you' — they don't report a moral fact the way 'it's raining' reports weather, they just express the speaker's attitude, the way 'Bless you' expresses sympathy at a sneeze. It lands well for the flat cases ('Killing is wrong' ≈ 'Boo to killing'), and a colleague of mine recently used the same picture in a talk to argue that moral disagreement is just a clash of attitudes, with no fact of the matter to be discovered.

  Can you audit how far this analogy actually holds? I want the correspondence table first — what plays the role of the sneeze, the blessing, the speaker's feeling, and so on — and then the places where the mapping breaks, especially when moral sentences get embeded in conditionals, negations, and questions: 'If it's wrong to break promises, then it's wrong to break a promise even to save a friend', 'It's not the case that lying is wrong', 'Is it wrong to...?'. You might recognize those as the Frege–Geach problem, but I want the audit of the analogy, not a survey of the problem. I suspect the analogy is quietly doing all the work for the conclusion about moral disagreement, but I want to know precisely where it fails, which features of the greeting side it imports that moral sentences don't have, and whether an expressivist has any real way to patch it (I've heard of 'prejudgments' and 'higher-order attitudes' but don't trust my memory on what they actually accomplsh). And please say whether my colleague's conclusion about moral disagreement survives once the disanalogies are on the table, or whether the analogy was carrying it the whole time. If there's a better analogy for the same job, I'd love to hear it.
reasoning: |-
  Okay, let me tackle this ethics professor's query. They're using a politeness ritual analogy ("Bless you"/"Thank you") to explain expressivism in class, but want to audit its limits - especially regarding embedded contexts and disagreement. 

  First, I need to map their analogy systematically. The sneeze corresponds to the non-moral event (like killing), "Bless you" maps to "Killing is wrong," and the speaker's sympathy maps to disapproval. This works neatly for simple exclamations but breaks when we consider complex sentences. 

  Hmm, the core issue is that politeness rituals don't embed logically. You can't say "If bless you, then..." meaningfully, whereas moral conditionals ("If breaking promises is wrong...") clearly function as premises. The analogy smuggles in three problematic features: non-cognitive force, non-compositionality, and non-disputability. 

  For the colleague's disagreement claim - that it's just clashing attitudes - this analogy supports it superficially. But once we see moral sentences can embed in logical structures unlike politeness formulas, that conclusion looks oversimplified. Modern expressivists like Blackburn try to patch this with "higher-order attitudes" (tolerating others' disapproval attitudes) or "prejudgments" (abstract policy commitments). These help, but feel like workarounds. 

  Maybe a better analogy would be etiquette rules? "It's rude to X" expresses disapproval but can conditionally embed ("If it's rude to interrupt..."). Still imperfect, but handles logic better. Ultimately the politeness analogy does heavy lifting for the disagreement thesis - once corrected, we see moral arguments involve clashing reason-giving attitudes, not just bare emotions.
answer: |-
  Here's a full audit of your "Bless you"/"Thank you" analogy for expressivism, including a correspondence table, disanalogy analysis, implications for disagreement, and potential alternatives.

  ### Correspondence Table
  | **Politeness/Greeting Ritual** | **Expressivist Moral Judgment** | **Role** |
  |--------------------------------|----------------------------------|----------|
  | Sneeze                         | Non-moral event/action (e.g., killing) | Triggering stimulus |
  | "Bless you!"                   | "Killing is wrong!"              | Surface utterance |
  | Speaker's sympathy/social concern | Speaker's disapproval/negative attitude | Expressed attitude |
  | Social convention of responding to sneezes | Moral framework/normative sensibility | Cultural context |
  | Listener's expectation of acknowledgement | Interlocutor's expectation of moral evaluation | Social expectation |
  | No literal "blessing" occurs | No objective moral fact/property | Lack of descriptive truth-maker |

  ### Where the Analogy Holds (Successfully)
  1. **Simple Assertions**: For "Killing is wrong = Boo to killing!" it perfectly captures non-descriptive, attitude-expressing function.
  2. **Disagreement as Clash**: Two people saying "Boo!" vs. "Hooray!" to the same act mirrors expressivist "attitude clash" view of moral disagreement.
  3. **Non-Factualism**: Like "Bless you" doesn't report a metaphysical blessing event, "wrong" doesn't report a moral fact.

  ### Where the Analogy Breaks Down (The Disanalogies)
  The cracks appear in embedded contexts, revealing features the analogy imports but moral language lacks:

  1. **Non-Embeddability** (Critical Failure):  
     - **Politeness Rituals**: Can't be embedded in conditionals/negations/questions.  
       *"If bless you, then...?"* ❌ (Meaningless)  
       *"It is not the case that bless you."* ❌ (Absurd)  
       *"Is it bless you to sneeze?"* ❌ (Nonsense)  
     - **Moral Language**: Embeds logically and meaningfully:  
       *"If promise-breaking is wrong, then it's wrong even to save a friend."* ✅ (Valid reasoning)  
       *"Is lying wrong?"* ✅ (Coherent question demanding reasons)  
       *"It's not that lying is wrong; it's context-dependent."* ✅ (Meaningful negation)  

  2. **Non-Compositionality**:  
     - "Bless you" is a fixed idiom – its meaning doesn't derive from parts ("bless" + "you").  
     - "Killing is wrong" is compositional – "wrong" contributes predictable meaning across contexts (e.g., "If killing is wrong..." relies on "wrong" having consistent logical content).

  3. **Non-Disputability**:  
     - Disagreeing with "Bless you!" is pragmatically odd, not substantive.  
     - Disagreeing with "Killing is wrong" invites reason-giving and argumentation, suggesting more than attitude-expression.

  4. **Lack of Inferential Integration**:  
     - "Bless you" doesn't serve as a premise in practical reasoning (no one infers *"She said 'bless you,' so I should hand her a tissue"* as logical necessity).  
     - Moral judgments *do* serve as premises (e.g., *"If stealing is wrong, I shouldn't steal this bread"*).

  ### Why the Analogy Smuggles in Problematic Features
  It implicitly attributes these features to moral language that expressivism must *deny* to handle embedding:  
  - **Logical inertness** (rituals aren't truth-apt components of logic)  
  - **Non-reason-responsive character** (rituals don't demand justification)  
  - **Pragmatic isolation** (rituals don't combine with descriptive content in complex claims)

  ### Can Expressivism Patch This? (Prejudgments & Higher-Order Attitudes)
  Expressivists *have* developed tools to address embedding (e.g., Blackburn's *quasi-realism*, Gibbard's *norm-expressivism*):
  - **"Prejudgments" (Blackburn)**: Attitudes towards *types* of acts (not tokens).  
    *"If promise-breaking is wrong..."* → Expresses a *higher-order attitude*: disapproval of *not disapproving* of promise-breaking in hypotheticals.  
    **Patch?**: Partial. Allows logical form but risks becoming a notational variant of cognitivism.
  - **Higher-Order Attitudes**:  
    *"Lying is not wrong"* → Expresses *acceptance* of societies that permit lying.  
    **Patch?**: Handles negation but makes disagreement opaque (are we clashing over lying or social policies?).

  **Do they fully work?** They salvage logical coherence but strain psychological plausibility. The patches work better in theory than in intuitive moral discourse.

  ### Does Your Colleague's Disagreement Conclusion Survive?
  **Yes, but weakened and complicated.**  
  - **Analogy-Driven Conclusion**: "Disagreement is *just* attitude clash (like preferring different greetings)" – this *doesn't* survive. The analogy was carrying it by ignoring moral language's logical behavior.  
  - **Surviving Expressivist View**: Disagreement is a clash of *reason-responsive, commitment-laden attitudes* that mimic factual dispute.  
    - **Key Difference**: Moral attitudes aren't bare preferences ("Boo!"); they involve *accepting norms* that demand shared acceptance and provide reasons.  
    - **Survival Condition**: The conclusion holds *only if* expressivism can successfully explain embedded contexts (via patches) *without* collapsing into fact-stating. Many think it can; critics (e.g., Schroeder) argue it can't.

  ### A Better Analogy? Etiquette Judgments
  *"It's rude to chew with your mouth open"*:  
  - **Holds Better**: Expresses disapproval but embeds logically:  
    *"If it's rude, we shouldn't do it at formal dinners."*  
    *"Is it really rude?"* (Invites reasons: "Because it offends others").  
    *"It's not rude among close friends."*  
  - **Disagreement**: Clash of attitudes grounded in social expectations/reasons.  
  - **Limits**: Still differs from morality in objectivity-claims and authority.

  ### Verdict
  - **Analogy Usefulness**: Excellent for *simple* expressivism and introducing non-factualism.  
  - **Analogy Danger**: Actively misleading for embedded contexts, hiding expressivism's hardest problem (Frege-Geach).  
  - **Recommendation**: Use it to introduce the core idea, then *explicitly break it* to motivate quasi-realist developments. Transition to the etiquette analogy when discussing complex judgments.  
  - **Colleague's Argument**: Likely overrelied on the analogy. The "no fact of the matter" claim needs defense via expressivist logic (e.g., Blackburn's projectivism), not the greeting ritual comparison.

  **Bottom Line**: The analogy is a good starter pistol for expressivism, but it misfires when moral language starts doing logical work. Its simplicity for disagreement comes at the cost of ignoring what makes moral discourse distinctive and challenging for non-cognitivism.
