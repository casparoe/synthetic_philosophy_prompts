answer: |-
  The duality you describe—systematic theodicy in academic settings versus its suspension in pastoral contexts—rests on an implicit philosophical architecture that can be reconstructed through several compatible (though sometimes competing) frameworks. Below, I distinguish **strict presuppositions** (what the practice *requires* to be coherent) from **compatible theories** (what it *accommodates*), and demarcate consensus from controversy in philosophy of religion.

  ---

  ### **I. What the Practice Strictly Presupposes**
  These are necessary conditions for the duality to be intelligible:
  1. **Distinction Between Intellectual and Existential Modes of Suffering**  
     - The problem of evil operates on two distinct levels:  
       - *Intellectual*: A logical/evidential puzzle about divine attributes (omnipotence, benevolence) and suffering's existence.  
       - *Existential*: The lived experience of anguish, which demands response rather than explanation.  
     - **Presupposition**: Theodicy addresses the intellectual problem but is inadequate or inappropriate for the existential one.  
     - *Consensus*: This distinction is widely accepted (e.g., Adams, Plantinga, Stump).  

  2. **Ethical Limitation of Theodicy in Existential Contexts**  
     - Offering justifications for suffering to the traumatized risks:  
       - Moral harm (e.g., trivializing pain, implying victims "deserved" suffering).  
       - Epistemic injustice (overriding the sufferer's testimony with abstract theory).  
     - **Presupposition**: Pastoral restraint reflects a *duty of care* that prioritizes solidarity over explanation.  
     - *Consensus*: Philosophers like Marilyn McCord Adams and D.Z. Phillips argue this.

  3. **Recognition of Theodicy's Pastoral Insufficiency**  
     - Even if a theodicy is intellectually successful, it fails to provide existential solace. Silence/lament acknowledges this gap.  
     - **Presupposition**: Existential suffering cannot be resolved through propositional justification alone.  
     - *Consensus*: Uncontested among those who study pastoral theology (e.g., Swinton, Pattison).

  ---

  ### **II. Compatible Philosophical Theories**
  The duality accommodates multiple underlying frameworks:  
  1. **Anti-Theodicy Views**  
     - *Thesis*: Theodicy is morally bankrupt (e.g., Kenneth Surin, Terrence Tilley). Suffering must be *resisted*, not justified.  
     - *Compatibility*: Pastoral silence aligns with rejecting the very project of theodicy.  
     - *Controversy*: Opposed by traditional theists (e.g., Swinburne) who defend theodicy’s necessity.  

  2. **Skeptical Theism**  
     - *Thesis*: Humans cannot discern God’s reasons for permitting evil (e.g., Bergmann, Rea).  
     - *Compatibility*: Academic theodicy explores logical possibility; pastoral restraint admits cognitive limitation.  
     - *Controversy*: Critics (e.g., Almeida, Oppy) argue it undermines all knowledge of God’s goodness.  

  3. **Narrative/Relational Theodicies**  
     - *Thesis*: Meaning emerges from divine *companionship* in suffering (e.g., Eleonore Stump, Sarah Coakley), not abstract justification.  
     - *Compatibility*: Pastoral presence embodies this; academic theodicy analyzes its structure.  
     - *Consensus*: Growing influence in post-analytic philosophy of religion.  

  4. **Divine Hiddenness/Weakness**  
     - *Thesis*: God’s power is kenotic (self-limiting) or suffering is part of divine ontology (e.g., Moltmann, process theology).  
     - *Compatibility*: Theodicy defends God’s goodness; pastoral lament mirrors God’s solidarity with pain.  
     - *Controversy*: Classical theists reject divine passibility (e.g., Feser).  

  ---

  ### **III. Where the Practice Leaves Philosophy Open**
  1. **The Success of Theodicy**  
     - The duality *does not require* theodicies to fail intellectually. One can affirm theodicy’s academic validity while rejecting its pastoral use.  
     - *Open Question*: Does the pastoral suspension imply tacit doubt about theodicy’s truth? Anti-theodicists say yes; others see mere contextual appropriateness.  

  2. **The Nature of Religious Language**  
     - The practice fits both:  
       - *Cognitivist* views: Theodicy offers true propositions, but their utterance is contextually unethical.  
       - *Non-cognitivist* views: Theodicy constructs useful models; lament expresses irreducible emotion (e.g., Wittgensteinian fideism).  
     - *Controversy*: Deep split between analytic and continental/postmodern approaches.  

  3. **The Problem of Evil’s Core Identity**  
     - Is it primarily a logical puzzle, a moral crisis, or a rupture in relational trust? The duality allows all three, prioritizing each in different contexts.  
     - *Settled Point*: No single formulation captures "the" problem of evil (per Adams, van Inwagen).  

  ---

  ### **IV. Controversies to Flag**
  - **Anti-Theodicy’s Status**: I presented anti-theodicy as one compatible view, but it is *not* consensus. Traditionalists (e.g., Swinburne) see it as capitulation to secular critique.  
  - **Divine Passibility**: While pastoral presence suggests a suffering God, classical theism (e.g., Aquinas) rejects this—a live debate.  
  - **Skeptical Theism’s Scope**: Whether it "solves" the intellectual problem remains hotly contested (e.g., the *de jure* vs. *de facto* debate).  

  ---

  ### **Conclusion**
  The duality presupposes:  
  (1) A categorical split between intellectual and existential evil,  
  (2) The ethical impermissibility of theodicy in trauma,  
  (3) Theodicies' inadequacy for existential solace.  

  It accommodates theories from anti-theodicy to skeptical theism but leaves open whether theodicy succeeds *as truth*. The practice reflects broader philosophical tensions: between explanation and experience, proposition and presence, God’s power and God’s pity. What remains non-negotiable is that *suffering demands different responses in different contexts*—a pragmatic wisdom that precedes metaphysics.
