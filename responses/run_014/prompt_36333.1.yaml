  ### **Why Your Half-Formed Sense Was Almost Right**  
  You noted CM involves "honoring a disposition" and XB involves "being exploited by your reputation." That’s correct! The missing precision:  
  - **CM’s disposition is "pre-reveal"**: Your trustworthiness *precedes* knowing the coin outcome.  
  - **XB’s reputation is "post-reveal"**: Predictability is weaponized *after* the scandal/prediction is set.  

  ### **Key Takeaways for Your Piece**  
  - **CM is cross-world cooperation**: You lose locally to win globally.  
  - **XB is adversarial gaming**: Predictability lets the sender force you into lose-lose scenarios.  
  - **The flip trigger**: Does the prediction *leverage your behavior in the current state* (XB) or *reward behavior in a counterfactual state* (CM)?  
  - **Real-world hook**: XB mirrors scams targeting predictable marks; CM resembles insurance—paying for protection against unseen risks.  

