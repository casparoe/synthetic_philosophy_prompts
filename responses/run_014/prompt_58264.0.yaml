  longtime lesswrong lurker here, finally volunteered to do a short talk for our uni game theory reading group next week and kinda regretting it lol. group is mostly econ PhDs plus one evo bio postdoc, all orthodox CDT/Nash/ESS types who think simulation-based cooperation is semantic trickery and really care about causal dominance and whether a strategy is actually stable in the wild. im defending that cooperating in a one-shot PD against a copy that can simulate you can be rational, and that this kind of assortative matching explains the evolution of cooperation better than just TFT in repeated play does. my basic arguement is if we both run the same decision procedure my choice logically controls theirs so dominance reasoning misfires. can you make me a Q&A prep sheet as exactly five numbered items with no intro or conclusion, each just one or two sentences, ordered by how much damage theyd do coming from this crowd and phrased like theyd actually say it, each with a comeback line plus where the comeback is soft, with #5 being the question im praying nobody asks?
