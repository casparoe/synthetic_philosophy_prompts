prompt: |-
  I'm a novelist and I'm about three quarters of the way into a book about a populist leader, a composite of a few real ones so I don't need to name any, and I'm stuck on the the thing the whole plot turns on: his relationship to the vote. In one chapter he tells reporters he doesn't need to ask the people anything because he is them, that he can feel what they want before they do. In the next he's holding a referendum on a bill he already signed, and he calls it the people's decision before the count is in. In the chapter after that the vote goes the other way and he calls it rigged, or says the voters were confused and the real people would have voted different. I dont know the philosophy vocabulary for this, but I suspect there's a name for the assumption he's making, and I need to know whether his whole operating system is coherent or whether he's just a self-deceiver, because I want to write him as someone who is consistent in a specific, nameable way, not a cartoon. So: what view of the will of the people does that practice only make sense under? Reconstruct it as concretely as you can. Then tell me whether the three things I listed can all be true on that view, or where exactly they break — I have a feeling that any result confirming him counts as the real will and any result that doesn't counts as manipulation, which would make his position unfalsifiable in a way I can't articulate. Also tell me which parts of what he does would work under any view of the will, so I know where I have freedom as the writer and where the logic is forced on me. And if I made him a proceduralist instead, where the will just is whatever the vote outputs, what would have to change in those scenes? No reading list, I'll look up the theorists myself — I need the thinking.
reasoning: |-
  Okay, the user is a novelist stuck on developing a populist leader character's relationship with voting. They've outlined three key scenes: claiming to embody the people's will, holding a referendum on an already-signed bill while preemptively calling it "the people's decision," then rejecting unfavorable results as rigged or invalid. 

  First, I need to unpack the philosophical underpinnings. The character seems to operate on a "substantive" view of popular will—where the will isn't determined by procedures but exists as an almost mystical entity he alone channels. This echoes Rousseau's "general will" but twisted into a leader-centric version. 

  The user's suspicion about unfalsifiability is spot-on. Any pro-result validates his embodiment claim; any contra-result proves "false consciousness" or corruption. It's a closed loop. I should emphasize how this differs from proceduralism, where the vote itself creates legitimacy regardless of outcome. 

  For writerly freedom: the preemptive referendum declaration works under any framework (it's just propaganda), but rejecting results only fits the substantive view. If the character were a proceduralist, he'd have to accept unfavorable outcomes or expose his hypocrisy. 

  The user wants consistency, not cartoonishness. So I'll stress that substantive populism is internally coherent (if toxic)—leaders like this genuinely believe they're oracles of the people's true will. The cognitive dissonance comes from conflating his intuition with objective truth. 

  Noticing they're 3/4 through the book, I'll avoid theory deep dives and focus on actionable logic. The key is making the referendum rejection feel inevitable within his worldview, not just a tantrum. Might add that proceduralism would force a tragic/moral choice: obey votes and betray his agenda, or override them and reveal his authoritarian core.
answer: |-
  This is brilliant material – you're wrestling with the core tension of populist legitimacy. The philosophical framework you're looking for is **Substantive Popular Sovereignty (specifically, in its "Embodied" or "Vanguardist" Populist variant)**. Let's break it down.

  **I. The Philosophical View: Substantive, Embodied Popular Sovereignty**

  1.  **The "Will of the People" is a Real, Substantive Thing:** It exists independently of any specific procedure (like voting). It's not *created* by the vote; the vote is merely a (potentially flawed) *instrument* for *discovering* or *manifesting* it. Think of it as a Platonic Form of the People's True Desire.
  2.  **It is Homogeneous and Unified:** The "Real People" (often defined emotionally, ethnically, or culturally by the leader) possess a single, coherent Will. Divergence from this Will represents false consciousness, manipulation by elites, or the influence of "non-people" (internal enemies, outsiders).
  3.  **It is Accessible Through Intuition/Embodiment:** The True Leader, *because* they are authentically *of* the People (or claim an almost mystical connection), can directly perceive, feel, or *embody* this Will. Their intuition *is* the Will of the People made flesh. This transcends mere empirical data or messy democratic processes.
  4.  **Legitimacy Comes from Representing this Substantive Will:** The leader's authority stems solely from their claimed fidelity to this pre-existing, unified Will. Procedures (elections, referenda, legislatures) are only legitimate *if and when* they affirm this Will. If they contradict it, the procedures themselves are illegitimate, corrupted, or misunderstood.

  **II. Coherence of Your Character's Actions Under This View:**

  | **Character Action** | **Plausibility on Substantive View** | **Logic/Rationalization** |
  |----------------------|--------------------------------------|---------------------------|
  | **"I don't need to ask; I am them."** | ✔️ Perfectly coherent | Leader embodies the People's Will. Asking is redundant; their intuition *is* the Will. |
  | **Holds referendum *after* signing bill, calls it "the people's decision" pre-count** | ✔️ Coherent (though revealing) | Leader *knows* the True Will, so the referendum outcome is predetermined. Calling it early confirms their embodiment. The vote is ritual, not decision. |
  | **Rejects adverse result as "rigged" or "voter confusion"** | ✔️ Inherently coherent | The result contradicts the known substantive Will. Therefore, the procedure must be flawed ("rigged") or the voters expressing the "wrong" view weren't the "Real People" or were tricked ("confused"). |
  | **Pattern: Confirming result = Real Will; Adverse result = Manipulation** | ✔️ Core feature | **This is the unfalsifiable heart of it.** The leader's claimed embodiment of the substantive Will is the primary truth. Any vote aligning with it validates the procedure *and* their claim. Any vote contradicting it invalidates the procedure *because* it contradicts the primary truth (their claimed embodiment). It's a self-sealing system. |

  **III. Where the Logic Breaks (Internally & Externally):**

  1.  **The Source of the Leader's Knowledge:** If the Will exists independently, *how* does the leader access it flawlessly? The view handwaves this ("embodiment," "intuition," "connection"), making it fundamentally unverifiable and authoritarian. This is its core weakness – it relies on an unchallengeable assertion.
  2.  **Defining the "Real People":** Who exactly constitutes the "Real People" whose Will matters? This definition is always exclusionary and shifts to serve the leader. Those who disagree are easily labeled "not real people" or "confused/manipulated." This exposes the view's inherent arbitrariness and potential for tyranny.
  3.  **The Purpose of Voting:** If the leader *is* the Will, why hold votes at all? This is the **critical tension** in your second scene. The answer within the logic is usually:
      *   **Ritual/Legitimation:** To provide a veneer of legitimacy to outsiders or less fervent supporters.
      *   **Mobilization:** To energize the base and demonstrate support.
      *   **Trap for Opponents:** To force opponents to participate in a process the leader controls and can delegitimize if needed (as in your third scene).
      *   **The leader might believe their embodiment *ensures* the "correct" outcome**, making the vote safe. The shock in the third scene comes when the ritual unexpectedly produces the "wrong" result despite their certainty, forcing the "rigged" claim.

  **IV. Writerly Freedom vs. Forced Logic:**

  *   **Freedom:**
      *   **The Referendum Mechanism:** Holding a referendum on a signed bill is bizarre procedurally but works as a *character choice* showing arrogance or a need for spectacle. It's not *philosophically* required but is a believable *tactic*.
      *   **Specific Rationalizations:** "Rigged" vs. "Confused" vs. "Foreign interference" vs. "Traitors within" – you can choose the flavor of denial that fits your character best.
      *   **The Leader's Sincerity:** Does he *truly believe* his embodiment, or is it cynical performance? The *logic* works either way, but his internal state changes the character profoundly (True Believer vs. Cynical Manipulator – both exist historically).
  *   **Forced Logic (by the Substantive View):**
      *   **Rejecting Adverse Results:** Under this view, he **MUST** reject an adverse vote. Accepting it would shatter the core premise – that *he* is the arbiter of the substantive Will. His legitimacy, in his own eyes and his core followers', depends on maintaining that his understanding of the Will is primary and infallible. Accepting defeat would mean admitting his intuition/embodiment was wrong, undermining his entire claim to authority.
      *   **Pre-emptive Declaration:** Calling the result *before* the count is a natural, almost inevitable, expression of his certainty derived from embodying the Will. It reinforces the idea that the vote is just a formality confirming what he already *knows*.

  **V. The Proceduralist Alternative: Will as Vote Output**

  *   **Core Principle:** The "Will of the People" *is* defined by the outcome of the agreed-upon democratic procedure (e.g., a free and fair vote). There is no independent, substantive Will waiting to be discovered. Legitimacy comes from following the rules, not from the "correctness" of the outcome according to some external standard. The vote *creates* the will at that moment for that question.
  *   **Required Changes in Your Scenes:**
      1.  **"I don't need to ask...":** This statement becomes nonsensical or blatantly authoritarian. A proceduralist leader *must* value asking (the vote) because that's *how* the Will is known. They might say, "I *believe* I know what they want, but we'll let the vote confirm it," or "My duty is to enact the people's decision *as expressed through the vote*."
      2.  **Pre-emptive Declaration:** Calling the result "the people's decision" *before* the count is directly contradictory. It violates the fundamental principle that the Will *is* the *result* of the procedure. He might *predict* victory, but he couldn't declare the outcome as settled fact before the count. Doing so exposes contempt for the process itself.
      3.  **Rejecting Adverse Result:** **This is the biggest change.** A true proceduralist **MUST** accept the outcome, even if they dislike it. They might:
          *   Respect the result and change course.
          *   Resign (if the vote is a referendum on them).
          *   *Or* expose their hypocrisy by rejecting it. **This is the dramatic moment.** If he rejects it *as a proceduralist*, he reveals himself as a fraud who never truly believed in the procedure – he only valued it when it served him. His "proceduralism" was a mask. His rejection now needs a *different* justification (e.g., claiming the vote *wasn't* fair/procedurally correct – but this requires evidence of malfeasance, not just "confusion" of the "real people"). The unfalsifiable substantive claim is gone; he'd need to attack the *process* itself with specific allegations to maintain any veneer of legitimacy.

  **Conclusion:**

  Your character's actions are **highly coherent** under the framework of **Substantive, Embodied Popular Sovereignty**. This view makes the vote an optional tool for affirmation, allows for pre-emptive declarations based on the leader's certainty, and **absolutely requires the rejection of adverse results** to maintain the leader's claimed legitimacy as the embodiment of the True Will. The unfalsifiability is a feature, not a bug, of this worldview.

  The forced logic point is crucial: **Rejecting the adverse vote is non-negotiable for this character type if he is to remain consistent (and powerful) within his own substantive framework.** Accepting it would be a catastrophic failure of his core premise.

  Shifting him to a proceduralist fundamentally changes the character and the required plot points, especially forcing a moment of either acceptance of defeat or exposed hypocrisy upon an adverse vote. The pre-emptive declaration also becomes illogical under proceduralism.

  You've grasped the essential dynamic perfectly. This leader's consistency lies precisely in his unwavering belief in his own embodiment of a mythical, homogeneous Popular Will that transcends and judges any mere procedural outcome. Writing him this way avoids cartoonishness by grounding his actions in a recognizable (though dangerous and anti-democratic) internal logic. Good luck unlocking the rest of your novel!
