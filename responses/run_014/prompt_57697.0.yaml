prompt: |-
  So — 40 minute talk at a department that's basically a behavioral ecology / cooperation lab with a philosophy-of-biology reading group bolted onto the side of it. Call it eight evolutionary biologists and psych people who work on cooperation and fairness, two who do cultural evolution and dual-inheritance modeling, one philosopher of biology who works on functions and teleosemantics, and a single moral psychologist who is politely skeptical of everything including her own data. Nobody in the room does metaethics. I've given versions of this to philosophers three times and the Q&A was all relitigating the tracking story and whether the coincidence argument begs the question; I expect literally none of that here, so I need to prep for a different set of questions entirely.

  The thesis is an evolutionary debunking argument against moral realism that never uses the words "reliability" or "sensitivity." Sketch, so you have something for the objections to bite on. Call it the inertness test. Take a complete geneology of some moral belief — mutation, selection, ontogeny, transmission, the whole causal story, written out at whatever level you like. Now delete every moral fact from it. If the story explains exactly as much afterwards as it did before, then moral facts were doing no work in producing the belief. So any realist reply has to be either (a) deny inertness — insist that moral facts figure in the causal/explanatory account of how we came to hold the beliefs we hold, which costs the non-naturalist their non-naturalism and turns them into an adaptationist about truth-tracking, a claim that now owes empirical detail they can't supply; or (b) grant inertness and argue it isn't epistemically damning. My claim is that the familiar third-factor replies all quietly take horn (a) while talking as if they were taking horn (b), because a third-factor story either smuggles the moral fact into the causal chain or is just the genealogy with a decorative label stuck on it. And my claim about (b) is that inertness-plus-a-complete-competing-causal-story is precisely the configuration in which, everywhere else, we let pedigree defeat a belief.

  Room's commitments as best I can read them: most would call themselves vaguely realist about morality without ever having had to defend it; several are convinced moral judgment is mostly post-hoc rationalization and will think that already wins my argument for me (it doesn't — that's a claim about psychology, not about whether moral facts are inert in the genealogy, and I need to say so without sounding like I'm rejecting an ally); at least two hold that "morality" is a grab bag of separate systems — disgust, reciprocity, coalition psychology, harm avoidance — with different histories, so they'll want to know which one I'm debunking; one of the cultural evolution people thinks genetic timescales are the wrong level of analysis altogether; and everybody has an allergy to arguments that sound like theyre doing philosophy at them.

  What I want: the eight-ish objections this room actually raises, ordered by how much damage each would do to the talk rather than by how interesting it is. For each one — who asks it, since the adaptationists won't ask what the modelers ask; how they'd phrase it in their own register (proximate vs ultimate, just-so story, exaptation, phylogenetic signal, WEIRD samples, whatever fits); a reply I can deliver standing up in about two minutes; and a blunt note on where that reply is soft, so I know when to stop talking and concede instead of digging in. Then tell me what to give away in the first five minutes so I'm not spending the Q&A defending positions I don't hold, and which single reply has to land for the talk to count as a success with these people specifically.

  And separately, the question I'm dreading. There is one, I can feel it, and I'd rather see it written out with the answer I'd give if I were brave than get ambushed by it in front of a room that thinks philosophers are evasive.

  No reading lists or lit reviews please, I know the papers — I want this room's objections, not the journals'.
reasoning: |-
  Okay, let me start by understanding the user's scenario. They're preparing a 40-minute talk for a mixed audience of behavioral ecologists, evolutionary biologists, psychologists, and a philosopher. The thesis is an evolutionary debunking argument against moral realism, framed as the "inertness test." The user has presented this to philosophers before, but now the audience is different, so the Q&A will shift from theoretical debates to practical, empirical objections.

  First, I need to anticipate the objections this specific group might raise. The audience includes cooperation/fairness researchers, cultural evolution modelers, a moral psychologist, and a philosopher of biology. Their concerns will likely focus on methodology, empirical evidence, and applicability rather than metaethics. 

  The user mentions several key aspects of the audience: some see morality as separate systems with different histories, others emphasize cultural over genetic evolution, and most are skeptical of philosophical arguments. I should categorize potential objections by who might raise them and how they'd phrase them in their respective jargon.

  Let me brainstorm the top objections:
  1. **Proximate vs. Ultimate Causation**: The adaptationists might question if the inertness test confuses levels of explanation. They'd use terms like "Tinbergen's questions" or "mechanism vs. function." This is critical because it challenges the argument's core structure.
  2. **Modularity/Object Plurality**: Researchers who view morality as multiple systems (e.g., disgust, reciprocity) might ask which module is being debunked. If the argument only applies to some modules, its scope is limited.
  3. **Cultural Evolution Critique**: The cultural evolutionist might argue that genetic timescales are irrelevant. They'd mention gene-culture coevolution or cultural phylogenetics, which could undermine the genealogy's completeness.
  4. **Exaptation/Spandrel**: Someone might point out that even if a trait wasn't selected for truth-tracking, it could be co-opted later. Terms like "exaptation" or "cognitive redeployment" would come up, suggesting the original genealogy isn't damning.
  5. **Epiphenomenalism Charge**: The moral psychologist might claim the argument assumes moral judgments are post-hoc rationalizations, which they already agree with. This could make the inertness test seem redundant.
  6. **Methodological Naturalism Assumption**: The philosopher might argue that the test presupposes naturalism, which non-naturalists reject. This targets the argument's foundational premise.
  7. **WEIRD Samples Problem**: The cultural folks might note that most studies use Western subjects, so the genealogy isn't universal. This questions the evidence's validity.
  8. **Functional Equivalence**: A cooperation researcher might argue that even without moral facts, the belief's function (e.g., promoting cooperation) makes it "truth-tracking enough." This could co-opt the argument for realism-lite.

  Next, I need to order these by potential damage. The proximate/ultimate objection is most damaging because it strikes at the argument's logic. The cultural evolution critique is next, as it questions the genealogy's relevance. Modularity and exaptation follow, then the rest.

  For each objection, I'll outline who raises it, their phrasing, a concise reply, and where the reply might be weak. For example, for the proximate/ultimate issue, the reply should clarify that inertness applies to causal explanations, not functional ones. But the weakness is that realists might still argue for non-causal roles.

  The user also needs to preemptively clarify what they're not claiming. They should emphasize that they're not dismissing psychology or cultural evolution, not targeting all moral judgments uniformly, and not claiming post-hoc rationalization alone debunks realism. This prevents misunderstandings during Q&A.

  The dreaded question might be about whether the inertness test applies to scientific beliefs, which could lead to global skepticism. The brave reply would distinguish moral facts from scientific ones by their causal efficacy or argue that science has a track record of intervention, unlike morality.

  The single crucial reply to land is against the proximate/ultimate confusion. If the audience accepts that the inertness test targets causal explanations without conflating functional roles, the argument holds. Otherwise, it falls apart.

  I'll structure the response with the preemptive concessions, the objections ordered by damage, and the dreaded question. Each objection will include the asker, their phrasing, the reply, and the soft spot. The key is to keep replies concise and empirical, avoiding philosophical jargon to resonate with the audience.
answer: |-
  Here's your Q&A battle plan, tailored to this room's triggers and ordered by potential damage to your core argument. I'll flag soft spots so you know when to fold.

  ### Preemptive Concessions (First 5 Minutes)
  **Give these away upfront to avoid defensive Q&A:**
  1. **"I'm not dismissing psychology/cultural evolution."**  
     *"This argument doesn't rely on moral judgments being *post-hoc rationalizations*. Even if they're adaptive, the problem is the inertness of moral facts in their genealogy."*  
  2. **"I'm not claiming all moral beliefs are equally debunked."**  
     *"Inertness may apply differently to harm-avoidance vs. purity norms. The test is per-belief, not global. Show me a genealogy where moral facts *aren't* inert."*  
  3. **"This isn't an argument for anti-realism."**  
     *"It's a challenge to realists: explain why inertness isn't fatal when it kills beliefs elsewhere (e.g., phlogiston)."*  

  ---

  ### The Objections (Ordered by Damage Potential)
  1. **"You're conflating proximate/ultimate causation."**  
     **Who:** Behavioral ecologists (esp. cooperation/fairness folks).  
     **Phrasing:** *"But the *function* of moral beliefs is coordination/cooperation. The moral fact 'fairness is good' isn't in the causal chain? Fine! Its *utility* is what was selected for. Why is tracking truth the only game in town?"*  
     **Reply:** *"Tinbergen's questions are orthogonal. Inertness asks: if you surgically remove moral facts from the *causal* history (proximate *or* ultimate), does the explanation change? If not, the belief's survival doesn't require truth—just utility. We don't accept 'utility' as truth-conducive for phrenology or divine right."*  
     **Soft Spot:** If they insist utility *is* a truth-tracking proxy (e.g., "cooperative groups track moral truth"), they're sneaking horn (a). But this group may happily bite that bullet, making your argument seem "philosophical."  

  2. **"Cultural evolution makes genetic genealogy irrelevant."**  
     **Who:** Cultural evolution / dual-inheritance modeler.  
     **Phrasing:** *"Your 'complete genealogy' is genes-up. But moral norms spread via cultural group selection. Delete moral facts from *that* story—does it change? Unlikely! But cultural evolution *can* track truth (e.g., technology). Why not morality?"*  
     **Reply:** *"Run the test on the cultural genealogy! Does removing moral facts alter why *H. sapiens* has *this* norm rather than a different one? If cultural selection favors cohesion, not truth, inertness holds. Show me a model where moral facts *do* explanatory work."*  
     **Soft Spot:** They might cite Boyd/Richerson on norm psychology "tracking" group benefits. Reply: *"That's horn (a)—you're making moral facts naturalistically reducible. Realists can't accept that."*  

  3. **"Which moral module? Harm vs. reciprocity have different etiologies."**  
     **Who:** Modularity proponents (e.g., disgust vs. fairness researchers).  
     **Phrasing:** *"You talk 'moral belief' like it's monolithic. But harm avoidance has deep vertebrate roots; disgust is parasite-avoidance; fairness is coalitional. Inertness might work for one but not others. Specify!"*  
     **Reply:** *"Pick your strongest candidate for realism—say, 'unnecessary suffering is wrong.' Build its genealogy. If inertness holds there, realism loses its flagship. If one module passes the test, realists win. I bet none do."*  
     **Soft Spot:** They might argue disgust tracks contamination (truth-adjacent). Concede: *"Even if true, that reduces morality to biology—which realists reject."*  

  4. **"Exaptation! Truth-tracking could be a spandrel."**  
     **Who:** Evolutionary psych folks.  
     **Phrasing:** *"So moral beliefs evolved for coordination. But later, we *exapted* them to track truths! Like math: evolved for foraging, now tracks abstract truths. Why not morality?"*  
     **Reply:** *"Exaptation needs a mechanism. Math works because 2+2=4 *causally interacts* with our revised beliefs (e.g., via counting apples). Moral facts? No feedback loop. Show me how 'suffering is wrong' corrects beliefs post-exaptation."*  
     **Soft Spot:** They might cite moral progress (slavery abolition). Reply: *"That relied on naturalistic facts (suffering), not moral ones."* If pressed, concede this needs more argument.  

  5. **"This assumes moral facts *should* cause beliefs. Why?"**  
     **Who:** Philosopher of biology / moral psychologist.  
     **Phrasing:** *"Non-naturalists already deny moral facts are causal. You're rigging the test! Inertness is built into non-naturalism. So what?"*  
     **Reply:** *"Then realism owes us an *alternative* explanation for why we shouldn't treat moral beliefs like phlogiston beliefs. Pedigree matters: if a belief exists *only* because it was useful, and truth played no role, we discard it. What's different here?"*  
     **Soft Spot:** They'll say "intuition" or "reasons." Digging in here loses the room. Retreat to: *"Then realism is immune to evidence—which is my point."*  

  6. **"Your 'complete genealogy' is a just-so story."**  
     **Who:** Cultural evolutionist or skeptical moral psychologist.  
     **Phrasing:** *"We don't have *complete* genealogies for any complex trait. You're knocking over a straw man. Show me inertness in a real model!"*  
     **Reply:** *"Agreed—but we have robust partial genealogies (e.g., kin selection explains altruism; disgust explains taboo). Find *any* link where moral facts *must* appear. I'll wait."*  
     **Soft Spot:** They're right about incompleteness. Use it: *"So realists should *welcome* this test. If they can't point to where moral facts enter, even hypothetically, that's telling."*  

  7. **"Moral beliefs *do* cause things (e.g., cooperation)."**  
     **Who:** Cooperation lab members.  
     **Phrasing:** *"Belief that 'cheating is wrong' *causes* punishment, which sustains cooperation. So moral facts aren't inert—they're functional!"*  
     **Reply:** *"You're confusing the *belief* (a mental state) with its *content* (the moral fact). The *content* is inert. The belief's causal power comes from psychology, not the fact it represents. 'Phlogiston exists' also caused actions—but phlogiston didn't."*  
     **Soft Spot:** If they conflate content/psychology, you risk semantic trench warfare.  

  8. **"WEIRD samples! Your genealogy assumes universality."**  
     **Who:** Cultural folks / moral psychologist.  
     **Phrasing:** *"Moral diversity shows beliefs are culturally contingent. Inertness is trivial—if no universal moral facts exist, *of course* they're inert!"*  
     **Reply:** *"Realists believe some moral facts *are* universal (e.g., 'torture for fun is wrong'). Test those! If even *they* have inert genealogies shaped by local ecology, realism is in trouble."*  
     **Soft Spot:** They may deny universals entirely. Concede: *"Then we agree realism is false—just for different reasons."*  

  ---

  ### The Must-Land Reply
  **Focus everything on Objection #1 (Proximate/Ultimate).** If they accept that **utility ≠ truth-tracking** in the causal genealogy, you've won the room. Cooperation researchers respect selective pressures—but they know selection optimizes for fitness, not truth. Hammer: *"We don't trust beliefs *just* because they're useful. Realism needs more."*  

  ---

  ### The Dreaded Question  
  **"Doesn't this debunk *all* beliefs (e.g., logic, science) using evolution?"**  
  **Who:** Philosopher of biology or moral psychologist (polite but sharp).  
  **Why it's dreaded:** If *everything* is debunked, your argument is self-defeating.  

  **Brave Reply:**  
  *"No—because some beliefs *pass* the inertness test. Take logical reasoning: delete '2+2=4' from its genealogy, and our ability to count predators *fails*. Moral facts? Remove 'suffering is wrong,' and the genealogy of harm-avoidance (e.g., kin selection, pain sensitivity) runs fine. Science? Remove 'atoms exist,' and the causal story of microscopy, cloud chambers, etc., collapses. Moral facts don't show up in the lab that way. They’re causally idle passengers."*  

  **Soft Spot:**  
  - They might argue logic/science *also* rely on useful fictions.  
  - **Exit Strategy:** *"If you're *that* skeptical, we agree on global anti-realism. But moral realists think morality is *special*. I'm showing it isn't."*  

  ---

  ### Summary for Success  
  **Goal:** Get them to see inertness as a **causal/explanatory criterion**, not philosophical hand-waving. Win by making them demand realists put up (a causal role) or shut up. If the cooperation folks walk out muttering, *"Yeah, why *would* evolution care about moral truth?"*, you've nailed it.
