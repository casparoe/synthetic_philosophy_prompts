prompt: |-
  ok so me and dana have been arguing for like two hours and i need a third party. we play nomic on thursdays — hofstadter's game where changing the rules *is* the game. our local rulebook is short:

  - Rule 101: any player may propose a change to any rule, including Rule 101 itself. A change is adopted on a majority of players voting yes.
  - Rule 102: the chair rules on all questions of order and admissibility. The chair's ruling stands.
  - Rule 103: a proposal must not conflict with any rule in force.

  dana has been chair since game one and she has never once said something is against the spirit of the game — she always cites text. i've been keeping her rulings:

  **turn 3** — proposal requiring two-thirds for repeals. admissible, passed on a plain majority. she certified that vote under the old majority standard and said the new threshold governs proposals made after certification.

  **turn 7** — proposal adding a rule reading "no rule may be repealed." admissible. her reasoning: 101 lets you change any rule, and nothing forbids adding a rule that constrains later proposals. passed.

  **turn 9** — proposal to repeal the no-repeals rule. inadmissible under 103, since it conflicts with a rule in force.

  **turn 10** — proposal to *suspend* the no-repeals rule for two turns. admissible; she said suspension isn't repeal and the no-repeals rule by its own text only bars repeal. it passed, we used the window to kill a scoring rule, and the no-repeals rule came back on schedule.

  **turn 14** — proposal whose first clause repealed Rule 208 and whose second clause did something 208 forbade. admissible. she said the repealing clause takes logical priority, so there's no conflict at any single moment.

  **turn 16** — proposal declaring that a change adopted at turn 6 never took effect. inadmissible. she said the turn 6 change was valid when she certified it and everything done under it stands; you can undo a rule going forward, you can't unmake the past.

  **turn 19** — proposal amending Rule 101 to read exactly what it already reads. admissible. she called it a no-op amendment but said it still counted as an amendment of 101. (i've argued she was inconsistant there, she says no.)

  tonight's proposal is one motion with three clauses:

  (a) Rule 101 is amended by adding: from now on, any amendment to Rule 101 requires the unanimous consent of all players, and this sentence may not be repealed *or suspended*.

  (b) Rule 102 is amended by adding: a proposal the chair rules inadmissible is adopted anyway if a majority votes yes in the same turn.

  (c) if any part of this proposal is inadmissible, the remainder is adopted.

  whoever drafted (a) obviously learned something from turn 10, which is part of what's bugging me.

  so — what does dana rule, clause by clause? and more than that: what's the single rule she's actually running that makes turns 3, 7, 9, 10, 14, 16 and 19 all come out right? i want the candidate rules written out, what each one has to say about 101 being special vs. 101 being just another rule, and which one further proposal we could table next week that would tell them apart cleanly. also does (c) change anything, given she's never had to sever a motion before?

  and the argument itself: i keep saying (a) is the unremarkable part, because we already entrenched a no-repeals rule at turn 7 and she already let 101 be amended at turn 19, whereas (b) is the genuinely scary one because it makes the vote the judge of the ruling that licenses the vote. she says i have it exactly backwards. one of us is wrong and i'd like to know which, and why. then, supposing it goes to a floor vote with dana abstaining — what should we actually do, and what principle would we be adopting by voting yes versus voting no? i care more about that than about winning the argument, though i'd still like to win it.
