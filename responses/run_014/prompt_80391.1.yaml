  Hmm, the user wants me to act as a cognitive scientist with expertise in Bongard problems and concept learning. They need me to create a set of desiderata - requirements for any adequate theory of Bongard problem solving - with justifications for each. I need to mark which are non-negotiable versus preferences, identify potential conflicts between requirements, and determine which requirement eliminates the most candidate theories.

  First, I should brainstorm candidate requirements based on my knowledge of Bongard problems. Key aspects include: the need to identify the intended concept despite multiple possible solutions, the role of simplicity as a tiebreaker, the presence of distracting surface features, the requirement for generalization beyond the given examples, and the fact that the intended concept comes from the puzzle setter's mind rather than being logically determined by the examples.

  Important considerations for requirements would include: concept induction ability (going beyond pattern matching to extract abstract concepts), robustness to distractors (ignoring irrelevant variations), generalization capability (applying to novel instances), recovering the intended concept (the "human-natural" solution), simplicity bias (preference for simpler explanations), and human-legibility of the concept representation.

  Now I'll organize these into formal desiderata with justifications. For each, I'll determine whether it's non-negotiable (essential to the nature of Bongard problems) or preferential (more about specific implementations or interpretations).

  The non-negotiables would include:
  1. Concept Induction: Must produce abstract concepts rather than just memorizing patterns
  2. Robustness to Distractors: Must ignore irrelevant variations in the examples
  3. Generalization: Must be able to correctly classify novel instances
  4. Recovery of Intended Concept: Must align with the puzzle setter's intended solution
  5. Underdetermination Tolerance: Must handle cases where multiple concepts fit the examples

  Preferences might include:
  1. Simplicity Bias: Preference for simpler concepts
  2. Human-Legibility: Concepts expressible in natural language
  3. Efficiency: Reasonable computational complexity
  4. Feature Learning: Capacity to discover relevant features
  5. Transfer Learning: Ability to apply learning across problems

  I also need to analyze conflicts between these requirements. The most significant tension exists between the requirement to recover the intended concept (which is external to the examples) and the underdetermination tolerance (since logic alone can't determine the solution). This creates an inherent challenge for any theory. There's also tension between simplicity bias and the existence of anti-simplicity puzzles designed to trick naive simplicity-based approaches.

  For which requirement knocks out the most candidate theories, recovery of the intended concept is particularly challenging. It eliminates approaches like pure minimum-description-length solvers (which might choose overly simplistic concepts), black-box few-shot classifiers (which might capture surface patterns rather than intended abstractions), symbolic search with fixed features (which might miss the relevant features), and connectionist models (which might struggle with explicit concept formulation).

  I'll present these in a structured way, clearly marking non-negotiables versus preferences, explaining the conflicts, and providing a scorecard of which theories fail against key requirements.
answer: |-
  Here are the desiderata for any adequate theory of Bongard problem solving, derived from the core nature of the task and its documented wrinkles. I'll first list candidate requirements from my brainstorm, then refine them into the final desiderata with justifications and classifications.

  **Brainstorm of Candidate Requirements:**  
  Concept induction (not pattern matching), robustness to distractors, generalization to novel instances, recovery of the *intended* concept, tolerance for underdetermination (multiple concepts fit), simplicity bias, human-legibility of concepts, efficiency (speed), feature discovery (not predefined), resistance to "trick" puzzles (anti-simplicity cases), abstraction over irrelevant transformations (position/size/etc.), alignment with human priors.

  ---

  ### **Final Desiderata List**  
  *(Non-negotiable: **Bold**; Preferences: *Italic*)*  

  1.  **Concept Induction (Non-Pattern-Matching):**  
      The solver must induce an *abstract concept* (e.g., "convexity," "containment," "parity") that explains the classification, not just memorize pixel patterns, statistical correlations, or surface features.  
      *Motivation:* Bongard problems (BPs) explicitly include distractors (size, position, etc.) that are shared *within* each box but are irrelevant to the core concept. A pattern matcher would fixate on these.  
      *Non-negotiable:* Yes. This defines BPs as concept induction tasks.  

  2.  **Robustness to Distractors:**  
      The solver must ignore irrelevant variations in the examples (e.g., size, orientation, position, added noise shapes) that are consistent within each box but orthogonal to the intended concept.  
      *Motivation:* BPs are constructed with "a bunch of surface features that are NOT the concept" shared per box. Failing this means solving the *distractor* concept, not the intended one.  
      *Non-negotiable:* Yes. Without this, the solver misses the point of the puzzle.  

  3.  **Generalization to Novel Instances:**  
      The solver must apply the induced concept to correctly classify *new, unseen figures* consistent with the intended rule.  
      *Motivation:* The "intended concept" is defined as the one that would correctly classify a 13th figure. BPs test inductive generalization, not just memorization.  
      *Non-negotiable:* Yes. This is core to concept learning.  

  4.  **Recovery of the Intended Concept:**  
      The solver must identify the *setter's intended concept* as the solution, even when multiple abstract concepts fit the given examples.  
      *Motivation:* BPs have a solution key; success is measured against human consensus on the "natural" concept. Solvers must resolve underdetermination *correctly*.  
      *Non-negotiable:* **Controversial, but essential.** If the theory doesn't require recovering the *intended* concept, it's not a theory of *Bongard solving*—just of finding *some* concept.  

  5.  **Underdetermination Tolerance:**  
      The solver must function when multiple abstract concepts (beyond distractors) are logically consistent with all 12 examples.  
      *Motivation:* BPs are "usually consistent with more than one concept." Any adequate solver must navigate this ambiguity.  
      *Non-negotiable:* Yes. This is a defining wrinkle of BPs.  

  6.  ***Simplicity Bias (Preferential Tiebreaker):***  
      The solver *should* prefer simpler concepts (e.g., fewer primitives, less complex logical forms) when multiple concepts fit, as this aligns with human performance on most BPs.  
      *Motivation:* The "intended concept is usually the simplest one that fits." This is a cognitive heuristic humans use.  
      *Non-negotiable:* **No.** Anti-simplicity puzzles exist where the intended concept is *not* the simplest (e.g., a complex shape property beats a simple but incorrect geometric rule). A theory must handle these without relying solely on simplicity.  

  7.  ***Human-Legible Concept Representation:***  
      The induced concept *should* be expressible in concise natural language or simple symbolic form (e.g., "all shapes have exactly one hole").  
      *Motivation:* Bongard intended solutions to be statable "out loud" by humans. This aligns with cognitive plausibility and interpretability.  
      *Non-negotiable:* **No.** While desirable for human-like solving, a theory could posit unconscious/inarticulable representations (e.g., neural nets) if it satisfies #4.  

  8.  **Resistance to Anti-Simplicity Traps:**  
      The solver must not fail on puzzles where the intended concept is *deliberately* more complex than a decoy concept that fits the examples.  
      *Motivation:* Some BPs are "constructed so that a naive 'pick the shortest description' strategy picks the wrong answer." A theory must explain how humans avoid these traps.  
      *Non-negotiable:* **Yes.** This tests if the solver goes beyond naïve Occam's razor.  

  9.  ***Feature/Relation Discovery:***  
      The solver *should* infer relevant features or relations not predefined in its vocabulary (e.g., discovering "tangency" or "topological genus" from pixel input).  
      *Motivation:* Humans solve BPs by perceiving novel relational structures. Fixed feature sets limit scalability to hard BPs.  
      *Non-negotiable:* **No.** A theory could use a rich predefined ontology, but this may limit generality.  

  ---

  ### **Conflicts and Tensions**  
  1.  **Core Tension: #4 (Recovery of Intended Concept) vs. #5 (Underdetermination Tolerance)**  
      - **Why conflicting?** #4 demands alignment with an *external* intention, while #5 states that the examples alone *underdetermine* the concept. This creates a "frame problem": How does the solver access the setter's mind? Humans use *shared cognitive priors* (simplicity, familiarity, Gestalt principles), but these are not logically derivable from the examples. A theory must incorporate these biases without making them absolute (due to #8).  
      - **Resolution:** Any adequate theory must include *inductive biases* (e.g., preference for symmetry, topological invariants) that match human/setter cognition. Without this, #4 is unreachable.  

  2.  **Secondary Tension: #6 (Simplicity Bias) vs. #8 (Anti-Simplicity Traps)**  
      - **Why conflicting?** #6 suggests simplicity as a default, but #8 requires overriding it when simplicity leads to decoy concepts.  
      - **Resolution:** This is *not* a deep conflict. Humans use simplicity *conditionally*—e.g., preferring it only when prior knowledge suggests it's reliable. A theory must integrate simplicity with other biases (e.g., familiarity of concepts).  

  ---

  ### **The Requirement That Knocks Out Most Theories: #4 (Recovery of Intended Concept)**  
  This requirement eliminates theories that solve "a" concept but not the *intended* one, as judged by human consensus. Casualties include:  
  - **Pure Minimum Description Length (MDL) solvers:** Fail on anti-simplicity puzzles (#8) where MDL picks the decoy concept.  
  - **Black-box few-shot classifiers (e.g., meta-learning NN):** May fit distractors (#2) or pick non-intended concepts (#4) due to lack of human-like priors.  
  - **Symbolic search over fixed features:** Fails if features miss the intended concept (e.g., no "hole count" feature) or pick decoy concepts in underdetermined cases (#5).  
  - **Connectionist models without strong inductive biases:** May learn superficial patterns (#1, #2) or diverge from human-intended solutions (#4).  

  **Scorecard of Theories vs. Key Requirements:**  
  | Theory                     | #1 | #2 | #4 | #5 | #8 | Verdict                     |  
  |----------------------------|----|----|----|----|----|-----------------------------|  
  | Pure MDL                   | ✓  | ~  | ✗  | ✓  | ✗  | Fails #4 (decoy concepts)   |  
  | Fixed-feature symbolic     | ~  | ✗  | ~  | ✗  | ~  | Fails #2, #5 (rigid features)|  
  | Black-box few-shot NN      | ✗  | ✗  | ✗  | ✓  | ~  | Fails #1, #2, #4            |  
  | Human cognitive model      | ✓  | ✓  | ✓  | ✓  | ✓  | Ideal target                |  

  **Conclusion:** The indispensable core is **concept induction robust to distractors and underdetermination, generalizing to novel instances while recovering the human-intended solution**. #4 is the linchpin, demanding cognitive alignment beyond formal logic. Theories must incorporate *human-like inductive biases* (e.g., preference for symmetry, closure, or causal relations) to resolve underdetermination in a setter-aligned way. Without this, they solve a different problem.
