prompt: |-
  I'm a compliance officer at a mid-size software company and we get asked to screen proposed policies and product decisions for ethical red flags before they go to the exec team. I've been leaning on Kant's universalizability test as a backstop but I'm running it the lazy way, just "could everyone do this?", and I know thats not what the test actually is. Can you turn the real test into a procedure my team can actually run? I need it to capture the two-tier structure (the contradiction-in-conception test vs the contradiction-in-the-will test) and, most importantly, to handle the maxim-formulation problem, because I've noticed the whole thing collapses if you write the maxim too narrow or too broad. Give me the steps in order, what counts as a pass or fail at each tier, where the procedure stops and hands the call to a human because it's a judgment I have to own, and be honest about where it'll misfire. Then run it on three cases: (1) a policy of making vague but technically true performance claims in marketing, (2) a policy of never disclosing a known but minor defect to a customer who is unlikely to notice it, and (3) a policy of lying to a customer to stop them from making a purchase they'd regret, which is the one where your answer is going to annoy me. I get maybe twenty minutes per case, I'm not a philosopher, and I have to sign off, so flag every step that's really a a judgment call dressed up as procedure.

  Format: I want it in this order — "The procedure" (the steps, ~300 words), "The two tiers" (~200 words), "Where judgment can't be eliminated" (~150 words), "Worked cases" (all three, ~400 words), "Where this misfires" (~150 words).
reasoning: |-
  Okay, the user is a compliance officer at a mid-sized software company who needs a practical, step-by-step procedure based on Kant's universalizability test to screen policies for ethical red flags. They've been using a simplified version ("could everyone do this?") but recognize it's inadequate. 

  First, I need to unpack what they're really asking for. They want:
  - A concrete procedure that captures both tiers of Kant's test (contradiction-in-conception and contradiction-in-the-will)
  - Clear handling of the maxim-formulation problem (the core weakness where outcomes hinge on how you phrase the maxim)
  - Honesty about where the method fails
  - Three real-world case applications within tight time constraints

  Hmm... the user's pain points are palpable: 
  They're time-pressed (20 mins/case), not a philosopher, and must own the final judgment call. That "judgment call dressed up as procedure" line suggests they've been burned by overly theoretical ethics frameworks before. The annoyance warning about case 3 (lying to prevent buyer's remorse) is telling - they likely expect Kant to forbid it rigidly but need to justify that to stakeholders.

  For the procedure itself:
  The maxim formulation is the make-or-break. I'll need to give very specific instructions on abstraction level - not too narrow (e.g. "lie to customer X on Tuesday") nor too broad (e.g. "deceive"). Goldilocks zone: include core action + context. 

  The two-tier testing needs distinct failure conditions:
  - Tier 1 fails if universalizing destroys the practice (e.g. universal lying kills trust)
  - Tier 2 fails if universalizing makes rational agents reject it (e.g. universal non-disclosure would make you not want to participate in commerce)

  Must flag every subjective step: 
  Maxim-writing is inherently interpretive, the "rational agent" assessment in Tier 2 is debatable, and Kant's rigorism means no exceptions - which feels counterintuitive in business contexts. That's why case 3 will annoy them.

  For misfires:
  I'll highlight how it can't handle conflicts between duties (e.g. truth-telling vs preventing harm) and its blindness to consequences. Also, the "minor defect" case might technically pass Tier 1 but feel icky - that's where human judgment kicks in.

  The worked cases need to show the procedure's bite:
  Case 1 (vague marketing) should fail Tier 1 - universal puffery destroys meaning of claims.
  Case 2 (minor defect) passes Tier 1 (concealment doesn't destroy commerce) but fails Tier 2 (no rational agent would want to participate in such a system).
  Case 3 (lying to protect) fails immediately at Tier 1 - universal deception collapses communication. User will hate this but Kant offers no out.

  ...Time to structure this tightly within their requested format. The challenge is making 18th-century philosophy feel like a compliance checklist without oversimplifying.
answer: |-
  ### The Procedure (9 steps)  
  1. **Define the policy** in one sentence.  
  2. **Formulate the maxim**: State the *agent’s intention* + *action* + *context* in a rule-like form. Avoid extremes:  
     - ❌ Too narrow: "Lie *to Customer X* about *this specific defect*."  
     - ❌ Too broad: "Deceive *when convenient*."  
     - ✅ Balanced: "Withhold known minor defects *to secure sales* when the customer *is unlikely to discover them*."  
  3. **Universalize**: Imagine *everyone* always acts on this maxim in *relevantly similar situations*.  
  4. **Tier 1: Contradiction-in-Conception Test**  
     - Does universalizing create a logical contradiction?  
     - *Pass*: No contradiction → Proceed to Tier 2.  
     - *Fail*: The practice becomes impossible → **Reject policy**. Stop.  
  5. **Tier 2: Contradiction-in-the-Will Test** (Only if Tier 1 passes)  
     - Could a rational agent *willingly* endorse this universalized world?  
     - *Pass*: Rational agents could accept it → **Proceed to human review**.  
     - *Fail*: Agents would reject it → **Reject policy**.  
  6. **Document rationale** for steps 4–5.  
  7. **Human judgment**: If Tier 2 passes, assess real-world risks/consequences.  

  > ⏱️ *Time saver*: Steps 2–5 take ~15 mins; steps 6–7 allocate 5 mins for documentation/judgment.  

  ---

  ### The Two Tiers  
  - **Tier 1 (Strict Logic Test)**: Asks if the *practice self-destructs* when universalized.  
    - *Fail example*: Universal lying kills trust, making lying impossible.  
    - *Pass example*: Universal charity remains logically possible.  
  - **Tier 2 (Rational Acceptance Test)**: Asks if the universalized world is *compatible with rational goals*.  
    - *Fail example*: Universal neglect of promises would make rational agents avoid all agreements.  
    - *Pass example*: Universal punctuality aligns with rational planning.  

  > 🔑 Kant’s core: Tier 1 blocks intrinsically immoral acts; Tier 2 blocks acts that undermine rational agency.  

  ---

  ### Where Judgment Can’t Be Eliminated  
  1. **Maxim formulation** (Step 2): Defining the "right" abstraction is interpretive. *You must own this*.  
  2. **Identifying contradictions** (Steps 4–5): Is a contradiction "logical" (Tier 1) or "volitional" (Tier 2)? Philosophers debate edge cases.  
  3. **"Rational agent" standard** (Tier 2): What’s "rational" involves normative assumptions.  
  4. **Human review** (Step 7): Kant ignores consequences; you can’t. *You must weigh outcomes if Tier 2 passes*.  

  > ⚖️ *Your call*: Steps 2, 4, 5, and 7 are judgment-dressed-as-procedure.  

  ---

  ### Worked Cases  
  **Case 1: Vague performance claims**  
  - Maxim: "Make technically true but vague claims *to persuade customers* when *specific benchmarks aren’t guaranteed*."  
  - Tier 1: Universalize → All marketing uses vague claims. Contradiction? **Yes**. If all claims are non-committal, *no claim carries meaning*; persuasion becomes impossible. **FAIL (Tier 1)**.  
  - **Verdict**: Reject.  

  **Case 2: Never disclosing minor defects**  
  - Maxim: "Withhold known minor defects *to avoid losing sales* when *customers are unlikely to detect them*."  
  - Tier 1: Universalize → All sellers hide minor defects. Contradiction? **No**. Commerce continues; no logical collapse. *Pass*.  
  - Tier 2: Rational acceptance? **No**. As a buyer, you’d reject a world where defects are always hidden (you’d avoid transactions). **FAIL (Tier 2)**.  
  - **Verdict**: Reject.  

  **Case 3: Lying to stop a regrettable purchase**  
  - Maxim: "Lie to customers *to prevent buyer’s remorse* when *we believe the product harms their interests*."  
  - Tier 1: Universalize → Everyone lies to "protect" others. Contradiction? **Yes**. Trust erodes; *communication* (and thus "protective lying") becomes impossible. **FAIL (Tier 1)**.  
  - **Verdict**: Reject. (Kant forbids lying *even to save a life*; this will annoy you, but the procedure is rigid.)  

  ---

  ### Where This Misfires  
  - **Maxim elasticity**: A self-interested team could frame maxims to evade detection (e.g., defining "minor defect" too narrowly).  
  - **Conflicting duties**: Kant prioritizes truth-telling over harm-prevention. This clashes with consequentialist ethics (e.g., lying to prevent regret *might* reduce net harm).  
  - **Rigorism**: Fails case 3 despite good intent. Kant offers no exceptions, which feels counterintuitive in business.  
  - **Cultural blind spots**: Universalizability assumes shared rationality; it may not capture context-specific harms (e.g., "minor" defects affecting vulnerable groups).  

  > 🚨 *Bottom line*: This flags *formal* ethical violations well but can’t replace nuanced human judgment on trade-offs. Use it as a first-pass filter, not a final arbiter.
