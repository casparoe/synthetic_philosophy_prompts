  ## Term Paper Proposal: The Teleological Trap - How "Function" Undermines Naturalism in the Biostatistical Theory of Health

  **1. Title:** The Teleological Trap: Can the Biostatistical Theory of Health Escape Normativity Through "Function"?

  **2. Abstract (100 words):**
  This paper critically examines Christopher Boorse's Biostatistical Theory (BST) of health, which defines health as statistically normal species-typical function, claiming to be value-free naturalism. I argue that while the BST appears descriptively robust, its core concept of "function" relies on an irreducibly teleological understanding – identifying what a part *is for*. This teleology either smuggles normative judgments back into the theory (contradicting its naturalist aims) or renders "function" a purely statistical notion devoid of its essential normative force needed to distinguish health from mere statistical commonality. The paper concludes that the BST fails to resolve the naturalism/normativism debate, highlighting the persistent challenge of defining function non-normatively within health concepts.

  **3. Introduction: The Stakes and the Puzzle (300 words)**
  The naturalism/normativism debate concerning health and disease is foundational to medicine, philosophy, and bioethics. **Naturalism** (e.g., Boorse) argues health/disease concepts are objective, value-free scientific facts, discernible through biological investigation alone. **Normativism** (e.g., Nordenfelt, Engelhardt) contends these concepts inherently involve value judgments about what constitutes a good life or undesirable biological state. Christopher Boorse's influential Biostatistical Theory (BST) represents the most sophisticated naturalist attempt, defining health as the statistically normal functional efficiency of parts/processes within a reference class of organisms of similar age, sex, and species. Disease is then a statistically subnormal part-function.

  Boorse explicitly aims for a value-free, descriptive science of pathology. However, the BST's plausibility hinges entirely on its definition of the "function" of bodily parts and processes. **The core problem I identify is this:** Boorse needs a notion of function that is both 1) *biologically objective/purely descriptive* (to maintain naturalism) and 2) *normatively significant* (to ground the distinction between "normal function" and "disease" – mere statistical abnormality isn't inherently bad). My central thesis is that these two requirements are in tension, perhaps irreconcilable. The concept of "function" itself seems inherently teleological – it points to what a part *is supposed to do*, what its *purpose* or *goal* is. This teleology threatens to reintroduce normativity at the very heart of the supposedly naturalist theory. The question this paper tackles is: **Does the BST's reliance on "function" inevitably collapse its naturalist aspirations, either by smuggling in normativity or by evacuating "function" of its necessary normative force?**

  **4. Why the Question Remains Open: Failures on Both Sides (400 words)**

  *   **Naturalism's (BST's) Claim & Vulnerability:** Boorse defines function in terms of a part's statistically typical causal contribution to the organism's survival and reproduction within its natural environment. He insists this is purely descriptive, relying on evolutionary biology (contributing to fitness) and physiology (causal role). However, critics persistently argue:
      *   **Teleology:** Identifying a part's *proper* contribution requires knowing its *evolutionary purpose* or *design* – inherently normative concepts implying "what it *should* do." Is "survival and reproduction" itself a value-laden goal? Defining the "natural environment" also involves selection that might imply norms.
      *   **Reference Class Problems:** Defining the relevant reference class (age, sex, species) can involve normative choices (e.g., excluding certain variations deemed "abnormal").
      *   **The "Merely Statistical" Problem:** If function is defined *purely* statistically (what most parts *actually* do), then statistically common dysfunctions (like dental caries or myopia in modern humans) would paradoxically count as "healthy function" under the BST, which is counterintuitive and undermines the disease concept. Avoiding this requires a non-statistical criterion for the *right kind* of function – which points towards teleology/normativity.
  *   **Normativism's Response & Shortcoming:** Normativists readily point out the apparent teleological/normative elements in "function" as proof that health concepts cannot be value-free. However, strong normativism often struggles:
      *   **Relativism/Subjectivity:** If health is purely a matter of social values or individual preferences, it risks becoming too relativistic, potentially losing its grounding in biological reality and making medical diagnosis arbitrary.
      *   **Ignoring Biology:** It can seem to downplay the crucial *biological basis* of disease states. There's a strong intuition that a broken bone or a viral infection is objectively dysfunctional, regardless of societal values.
  *   **The Impasse:** Both sides leave the question open. Naturalists haven't convincingly explicated a non-teleological, non-normative concept of "function" that simultaneously avoids the merely statistical problem *and* grounds the normative weight of "disease." Normativists haven't fully accounted for the objective biological constraints on what can count as healthy or diseased. The BST's "function" sits precisely at this fault line.

  **5. Method: Dissecting the Concept of "Function" in the BST (300 words)**

  My investigation will proceed through conceptual analysis and critical argumentation, structured as follows:

  1.  **Exposition:** Precisely reconstruct Boorse's BST, focusing on his definitions of "function," "reference class," "statistical normality," and "disease." Highlight his explicit claims regarding value-freedom. (Primary Source: Boorse's key texts).
  2.  **Isolating "Function":** Delve deeply into Boorse's account of biological function. Analyze his attempts to ground it in evolutionary biology (etiological function) and/or causal role function within the organism's physiology. Examine his arguments against teleology/normativity in this definition.
  3.  **The Teleological Critique:** Argue that both the etiological and causal-role accounts of function, *as employed by the BST to ground health/disease*, rely implicitly or explicitly on teleology.
      *   *Etiological:* Defining function based on evolutionary history requires identifying *selected effects* – what the part was *for* in the past. This "for-ness" is teleological.
      *   *Causal-Role:* Defining the *relevant* causal contribution (e.g., the heart's role in circulation vs. making sounds) requires selecting effects *based on their contribution to goals* like survival/reproduction – again, teleological.
  4.  **The Dilemma:** Demonstrate that this teleology presents the BST with a dilemma:
      *   **Horn 1 (Smuggling Normativity):** If "function" incorporates teleological goals (e.g., survival/reproduction), then judgments about deviation (disease) inherently involve normative judgments about failing to meet those goals, violating naturalism.
      *   **Horn 2 (Evacuated Function):** If "function" is stripped of teleology and defined *purely* statistically (what most parts *actually* do), the BST loses its normative force. Common dysfunctions become "normal function," rendering "disease" merely statistical deviance without inherent negative connotation – an outcome Boorse explicitly rejects and which seems to gut the concept.
  5.  **Evaluation:** Assess whether alternative naturalist accounts of function (e.g., propensity theories) escape this dilemma within the context of the BST. Conclude that the dilemma persists, undermining the BST's claim to pure naturalism and indicating a fundamental problem for naturalist projects reliant on "function."

  **6. Scope, Success, and Failure Conditions: An Honest Read (200 words)**

  *   **Success Conditions:** The project succeeds if it:
      *   Provides a clear and accurate reconstruction of the BST's core claims, especially regarding function.
      *   Articulates a compelling argument that "function" within the BST is irreducibly teleological.
      *   Clearly presents the dilemma (Smuggling Normativity vs. Evacuated Function) as a direct consequence of this teleology.
      *   Demonstrates that this dilemma significantly undermines the BST's claim to be a purely naturalistic, value-free theory.
      *   Shows that this problem highlights a persistent challenge at the heart of the naturalism/normativism debate.
  *   **Failure/Too Big Conditions:** The project would fail or be too ambitious if:
      *   It attempts to *definitively prove* teleology is *logically necessary* in *all* possible naturalist accounts of function (a much larger metaphysical debate). Success lies in showing it's unavoidable *within the specific framework and aims of the BST*.
      *   It tries to survey *every* naturalist or normativist theory in depth. Focus remains tightly on the BST and the specific problem of "function."
      *   It attempts to *resolve* the entire naturalism/normativism debate. The goal is to show how the BST fails to resolve it due to this specific problem.
      *   It delves deeply into technical evolutionary biology debates about function beyond what's necessary to understand Boorse's usage and the core critique.
      *   It cannot move beyond simply stating the intuition that function seems normative, instead of providing a structured argument based on the BST's internal logic.

  **Conclusion:** This project is ambitious but feasible for a 5000-word paper. By rigorously focusing on the concept of "function" within Boorse's specific framework and exposing the teleological dilemma it faces, the paper will make a significant contribution to understanding why the naturalism/normativism debate remains stubbornly unresolved, pinpointing a critical vulnerability in the most prominent naturalist theory. Success hinges on disciplined argumentation within these defined boundaries.
