  Prioritizing these: extending dialetheism beyond paradoxes first, as it's a direct test for ontology's viability. Then negation, because its resolution affects the field's legitimacy. Finally, metaphysical frameworks to solidify the ontology. 

  Questions to deprioritize: technical hygiene advancements, as they're covered elsewhere, and paradox solutions with new connectives, which might not address ontology. Also, universal paraconsistency debates, as they conflate the two projects. 

  Assessing the user's unspoken needs: they might want to establish their foundation's impact by targeting unresolved, high-stakes issues. Funding ontology could shift the field's focus, providing clearer outcomes. They might also seek to avoid funding redundant technical work, ensuring resources address philosophical gaps.
answer: |-
  Based on your insightful hunch about the hygiene/ontology distinction, here's a defended priority ordering for funding, emphasizing the underdeveloped ontological project while acknowledging necessary hygiene interfaces:

  1.  **Question:** **"Beyond the Liar: Are there sustainable, non-semantic dialetheias?"**
      *   **Project:** Primarily Ontological (directly tests dialetheism's core claim).
      *   **Placement:** Upstream & Foundational. This is *the* key test for ontological dialetheism's significance. If only semantic paradoxes generate true contradictions, dialetheism risks being a sophisticated technical response to a localized problem rather than a deep metaphysical insight. Downstream: Answers directly impact the scope and motivation for ontological dialetheism, influencing debates on negation, truthmakers, and applicability.
      *   **Tractability:** High for Philosophers (conceptual analysis, case studies in law, change, vagueness, quantum mechanics), Medium for Logicians (formal modeling of candidate dialetheias). Requires interdisciplinary dialogue.
      *   **Settlement:** Consensus on 1-2 compelling, non-semantic candidate dialetheias that withstand sustained critique *or* a strong case that no such candidates exist beyond semantic phenomena (settling ontology as essentially "Liar-only"). Mere re-argument involves rehashing known examples without novel analysis or formalization.

  2.  **Question:** **"What is the metaphysical framework for true contradictions? (Truthmaking, Grounding, Nature of Properties/Relations)"**
      *   **Project:** Ontological (seeks the 'how' and 'what' of true contradictions).
      *   **Placement:** Upstream & Foundational for Ontology. Without a coherent metaphysics, ontological dialetheism remains programmatic. It's downstream from the motivation provided by potential non-semantic dialetheias (Q1), but necessary to make sense of *any* dialetheia, including Liars. Clarifying this blocks the common objection that true contradictions are "inconceivable" or metaphysically unintelligible.
      *   **Tractability:** High for Philosophers (metaphysics, philosophy of language), Medium-Low for Logicians (formal ontology interfaces). Deeply conceptual.
      *   **Settlement:** Development and comparative assessment of 2-3 robust metaphysical models for dialetheias (e.g., glutty truthmakers, contradictory states of affairs, grounding loops) that address key challenges (causal efficacy, individuation). Settlement involves these models being seen as viable contenders within broader metaphysics, not just dialetheic circles.

  3.  **Question:** **"Is paraconsistent negation a genuine (metaphysically revealing) negation? Or merely a useful technical operator?"**
      *   **Project:** Interface (Ontology/Hygiene). Crucial for *ontological interpretation* of logical systems.
      *   **Placement:** Gatekeeper for Ontology. If deontic or database "negation" is just technical hygiene, it doesn't license ontological conclusions. But if paraconsistent negation captures a fundamental aspect of reality (like exclusion-failure), it underpins ontology. It's upstream for interpreting logical results ontologically but downstream from needing *some* coherent ontology (Q2) to interpret.
      *   **Tractability:** High for Philosophers (philosophy of logic, semantics, metaphysics), Medium for Logicians (comparing properties of negations). Revolves around conceptual arguments.
      *   **Settlement:** A refined understanding emerges where specific paraconsistent negations (e.g., in relevant logics with strong model theory) are defensible as metaphysically loaded *for dialetheists* based on Q2, while others are clearly hygienic. The debate shifts from "is *any* PC neg genuine?" to "under *which* metaphysical picture (Q2) is *this specific* neg operator genuine?".

  **Justification for Order & Distinction:**
  *   **Q1 First:** Ontological dialetheism lives or dies by its scope. Funding this directly addresses the "underdeveloped" core. Hygiene doesn't need non-semantic dialetheias, but ontology desperately does.
  *   **Q2 Second:** Even with candidates (Q1), without metaphysics, ontology feels hand-wavy. This provides the necessary foundations *for* ontology implied by Q1 and needed for Q3.
  *   **Q3 Third:** The negation debate often derails progress through equivocation. Resolving its *ontological relevance* (via Q2) clarifies when logical results bear on metaphysics. It's vital but parasitic on prior ontological work.

  **Questions to Deprioritize (for this cycle):**
  *   **Refining technical solutions to the Liar paradox using new paraconsistent connectives:** Primarily Hygiene. While important, the field has many sophisticated options. Further refinements offer diminishing returns for ontology unless directly tied to Q2 or testing negation (Q3).
  *   **Developing highly specialized paraconsistent logics for niche computational/DB applications:** Purely Hygiene. Important work, but often driven by CS/IT needs and better funded elsewhere.
  *   **Debating whether *all* reasoning *must* be paraconsistent:** Conflates Hygiene (universal need for explosion control?) and Ontology (is reality fundamentally inconsistent?). Too diffuse; progress on Q1-Q3 will clarify this.

  **Does this Dissolve the Distinction?**
  No, it reinforces it. Q1 and Q2 are *purely* ontological. Q3 explicitly addresses the interface. Funding Q1 and Q2 forces the ontological project to stand on its own feet, reducing equivocation. Hygiene remains vital for applications but doesn't entail ontology. Answering these questions will make the distinction *clearer*, not dissolve it.

  **Final Priority:**

  \answer{Beyond the Liar, Metaphysical Framework, Genuine Negation}
