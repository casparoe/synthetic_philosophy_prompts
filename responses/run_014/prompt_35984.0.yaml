  Their deeper need might be to clarify the field's direction. By funding ontology, they could resolve foundational debates and strengthen dialetheism's credibility. But I should verify if this split is valid. Are there areas where the distinction blurs? For example, debates about negation might straddle both, but the user wants to prioritize questions that address the core of ontology.

