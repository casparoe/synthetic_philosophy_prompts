prompt: |-
  I'm building a seminar handout on the moral equality of combatants and I want a case that isn't one of the ones everybody already reaches for. Build me a thought experiment in which a Walzerian moral-equality theorist and a McMahan-style revisionist land on the *same* verdict about whether a particular killing is permitted — but for reasons that can't both be right, and where the case shows that the ground usually credited to Walzer (combatants may be targeted because they've become dangerous, because they carry arms) isn't actually load-bearing.

  Here's the shape I want. The target is a combatant who is temporarily but genuinely harmess without being surrendered, wounded, a POW, or otherwise out of the war — those routes are already handled by both views, so they're off limits. He's still in the fight, still willing, still a member of the armed force, and his side's cause is plainly the unjust one; he knows it and fights anyway, so there's no non-culpable-ignorance escape hatch for the revisionist either. The killer should be someone whose own side is fighting a just defensive war, so the usual "both are just combatants" mush doesn't apply.

  Constraints: realistic, no sci-fi tech, no trolley-ish abstraction, the scenario itself in one paragraph. And the agreement between the two views has to be *generated* by running each theory over the facts, not stipulated by how I've set things up — I want to be able to check it. No citations, I'll add them; name the positions and the people if it helps, but don't put words in anyone's mouth.

  Then give me: the two verdicts with the reasoning spelled out step by step; the single feature of the case that does the work for the dangerousness ground, and what the case turns into if I remove that feature; how a Walzerian who thinks I've misrendered the ground would attack it (if you do think my gloss is off, say so in the analysis rather than hedging the whole thing, and tell me which formulation the case actually targets); and how much of the agreement survives if I make the harmless period permanent instead of temporary.

  Start with the scenario itself — no preface, no restating what I asked for. And at the end be straight with me about where this is most likely to fall apart: which step in the design you'd bet against, and what argument or consideration would make you give up on the conclusion that the two views only look like they agree.
