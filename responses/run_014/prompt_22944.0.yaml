  **Classic Example: The "Bimatrix Game" (Fudenberg & Tirole style)**
  Consider this 2-player game:

  ```
  Player 2:       L          R
  Player 1:
  U             (1, 1)     (0, 0)
  D             (0, 0)     (0, 0)
  M             (0, 0)     (1, 1)
  ```
  *(Payoffs: (Player1, Player2))*

  *   **Pure Weak Dominance (Player1):**
