      *   **Correction:** `N` is *not* weakly dominating `Y` because `N` is strictly *worse* than `Y` if (Bob `Y`, Chair `N`). My mistake.

  **Revised Payoffs for Clarity: The "Blended Threat" Game**
  Let's simplify Alice's payoffs to make mixed dominance clearer:
  *   **Opponent Profiles (Bob, Chair):** (`YY`, `YN`, `NY`, `NN`)
  *   **Alice's Payoff from `Y`:** (3, 3, -10, 0)
  *   **Alice's Payoff from `N`:** (3, 0, 0, 0)

  **Now, check Pure vs Pure:**
  *   `Y` vs `N`: (3 vs 3 Tie), (3 vs 0 `Y` better), (-10 vs 0 `N` better), (0 vs 0 Tie). Neither dominates the other.

  **Can a Mixed Strategy Dominate `Y`?**
  *   Consider Mix: Play `N` with probability `p`, `Y` with `1-p`.
  *   Find `p` such that Mix >= `Y` for all (Bob, Chair), and > for at least one.
      *   Vs (`YY`): p*3 + (1-p)*3 = 3 >= `Y`'s 3. **OK (Tie)**
      *   Vs (`YN`): p*0 + (1-p)*3 = 3(1-p) >= `Y`'s 3? Only true if 3(1-p) >= 3 => 1-p >= 1 => p <= 0. **Conflict!**
      *   Vs (`NY`): p*0 + (1-p)*(-10) = -10(1-p) >= `Y`'s -10? -10(1-p) >= -10 => 1-p <= 1 (Always true). Strictly better if p > 0: -10(1-p) > -10.
      *   Vs (`NN`): p*0 + (1-p)*0 = 0 >= `Y`'s 0. **OK (Tie)**
  *   **Problem:** To be >= `Y` in (`YN`), we need 3(1-p) >= 3, which forces p <= 0. But to be strictly better than `Y` in (`NY`), we need p > 0. **No mixed strategy dominates `Y`.** Similarly, can we dominate `N`?

  **Dominating `N`:**
  *   Compare Mix(p) vs Pure `N` (payoffs 3, 0, 0, 0)
      *   Vs (`YY`): 3 >= 3? **OK (Tie if Mix=3)**
      *   Vs (`YN`): 3(1-p) >= 0? Always true for p in [0,1]. Strictly better if p < 1.
      *   Vs (`NY`): -10(1-p) >= 0? Only true if -10(1-p) >= 0 => 1-p <= 0 => p >= 1.
      *   Vs (`NN`): 0 >= 0. **OK (Tie)**
  *   **Problem:** To be >= `N` in (`NY`), we need p >= 1. To be strictly better than `N` in (`YN`), we need p < 1. **No mixed strategy dominates `N`.**

  **A Game Where Mixed Dominance Matters: The "Ambiguous Incentive"**
  Let's design a simpler 2x2 game between Row and Column:

  ```
  Column:        Left (L)     Right (R)
  Row:
  Top (T)       (1,  *)      (1,  *)
  Bottom (B)    (0,  *)      (2,  *)
  ```
  *(Row's Payoffs Shown; Column's payoffs don't affect Row's dominance)*

  *   **Pure vs. Pure (Row):** Compare `T` vs `B`.
      *   If Column plays `L`: `T` gets 1, `B` gets 0. `T` better.
      *   If Column plays `R`: `T` gets 1, `B` gets 2. `B` better.
      *   **Result:** Neither `T` nor `B` weakly dominates the other using pure strategies. Each is better under one Column action.
  *   **Mixed Strategy Dominance (Row):** Consider Row playing a mixed strategy: `T` with probability 0.5, `B` with probability 0.5.
      *   Expected payoff of Mix vs `L`: (0.5 * 1) + (0.5 * 0) = **0.5**
