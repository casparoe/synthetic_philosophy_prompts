      *   `U` vs `M`: Vs L: 1>0 (`U` better). Vs R: 0<1 (`M` better). Neither dominates.
      *   `D` vs `M`: Vs L: 0=0 (Tie). Vs R: 0<1 (`M` better). `M` weakly dominates `D`.
      *   `D` is weakly dominated by `U` *and* by `M` (pure strategies). Delete `D`.
  *   **After deleting `D`:** Game reduces to:
      ```
      Player 2: L          R
      Player 1:
      U         (1, 1)     (0, 0)
      M         (0, 0)     (1, 1)
      ```
      *   Now, `U` vs `M`: Vs L: 1>0 (`U` better). Vs R: 0<1 (`M` better). **No dominance remains. Surviving strategies: `U`, `M`.**

