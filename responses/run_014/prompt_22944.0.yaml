answer: |-
  You've identified the core tension beautifully—the definitional choice between *pure*-strategy and *mixed*-strategy dominance is indeed the hidden hinge that makes iterated elimination of weakly dominated strategies (IEWDS) so controversial. Let's unpack the conceptual difference, why mixed strategies change everything, and tie it to the puzzles you mention. I'll use a minimal, custom-built example to anchor the intuition.

  ---

  ### **Core Conceptual Difference: The Power of Blending**
  1.  **Pure-Strat Weak Dominance:** Strategy A *weakly dominates* strategy B (pure vs. pure) if A gives a player **at least as good** a payoff as B **no matter what opponents do**, and **strictly better** for **at least one** opponent action.
  2.  **Mixed-Strat Weak Dominance:** Strategy B is *weakly dominated* if there exists **some mixed strategy** (a probability distribution over the player's *other* pure strategies) that yields **at least as good** a payoff as B **against every possible profile of opponent actions**, and **strictly better** for **at least one** opponent action.

  **The Crucial Insight:** A mixed strategy can "threaten" to **conditionally punish** an opponent action in a way *no single pure strategy can*. A pure strategy commits you to one response. A mixed strategy lets you say: "If you do X, I might do Y (with some probability), and if you do Z, I might do W." This creates a *broader spectrum of credible threats/promises*.

  ---

  ### **The Anchor Example: The "Committee Vote" Game**
  Imagine a 3-person committee (Alice, Bob, Chair) voting on a project:
  *   **Players:** Alice (A), Bob (B), Chair (C).
  *   **Actions:** Each votes `Yes (Y)` or `No (N)`.
  *   **Payoffs (Alice's Perspective - Others are symmetric):**
      *   Alice wants the project to pass *only if* Bob also votes Yes (she distrusts the Chair alone). Otherwise, she prefers it fails.
      *   Project passes if at least 2 vote `Y`.
      *   Alice's Payoffs:
          *   Project Passes & Bob Voted `Y`: **+3** (Ideal)
          *   Project Fails: **0** (Safe)
          *   Project Passes & Bob Voted `N`: **-10** (Disaster - Chair is unreliable)
  *   **Alice's Strategies:** `Y`, `N`.
  *   **Opponent Profiles:** (Bob's Vote, Chair's Vote): (`YY`, `YN`, `NY`, `NN`).

  **Analyzing Alice's Dominance (Pure vs. Mixed):**

  1.  **Pure vs. Pure?** Does `N` weakly dominate `Y`?
      *   Compare `Y` vs `N` for each opponent profile:
          *   If (Bob `Y`, Chair `Y`): `Y` -> Project Passes (Bob `Y`) -> **+3**; `N` -> Project Passes? Bob `Y` + Chair `Y` + Alice `N` = 2 `Y` -> Passes -> **+3**. *Tie (3=3)*.
          *   If (Bob `Y`, Chair `N`): `Y` -> Project Passes? (Alice `Y` + Bob `Y` = 2 `Y`) -> **+3**; `N` -> Project Fails? (Alice `N` + Bob `Y` + Chair `N` = 1 `Y`) -> **0**. `N` **worse** (0 < 3).
          *   If (Bob `N`, Chair `Y`): `Y` -> Project Passes (Alice `Y` + Chair `Y`) -> **-10** (Disaster!); `N` -> Project Fails? (Alice `N` + Bob `N` + Chair `Y` = 1 `Y`) -> **0**. `N` **better** (0 > -10).
          *   If (Bob `N`, Chair `N`): `Y` -> Project Fails? (Alice `Y` + Bob `N` + Chair `N` = 1 `Y`) -> **0**; `N` -> Project Fails -> **0**. *Tie (0=0)*.
      *   **Result:** `N` is **NOT** weakly dominated by `Y` using pure strategies. Why? In the profile (Bob `Y`, Chair `N`), playing `Y` (+3) is strictly better than `N` (0). `Y` beats `N` here, so `Y` doesn't dominate `N`, and `N` doesn't dominate `Y` because `Y` loses badly when (Bob `N`, Chair `Y`).

  2.  **Mixed Strategy to the Rescue:** Now consider a mixed strategy where Alice plays `Y` with 50% probability and `N` with 50% probability.
      *   Compare this mix **vs. Pure `Y`**:
          *   If (Bob `Y`, Chair `Y`): Mix -> (50% * +3) + (50% * +3) = **+3**; Pure `Y` -> **+3**. *Tie*.
          *   If (Bob `Y`, Chair `N`): Mix -> (50% * +3) + (50% * 0) = **+1.5**; Pure `Y` -> **+3**. Pure `Y` **better** (3 > 1.5).
          *   If (Bob `N`, Chair `Y`): Mix -> (50% * -10) + (50% * 0) = **-5**; Pure `Y` -> **-10**. Mix **better** (-5 > -10).
          *   If (Bob `N`, Chair `N`): Mix -> (50% * 0) + (50% * 0) = **0**; Pure `Y` -> **0**. *Tie*.
      *   **Result:** The mixed strategy (50/50) is **NOT** weakly dominating pure `Y` because it loses when (Bob `Y`, Chair `N`).
      *   **Compare the mix vs. Pure `N`**:
          *   If (Bob `Y`, Chair `Y`): Mix -> **+3**; Pure `N` -> **+3**. *Tie*.
          *   If (Bob `Y`, Chair `N`): Mix -> **+1.5**; Pure `N` -> **0**. Mix **better** (1.5 > 0).
          *   If (Bob `N`, Chair `Y`): Mix -> **-5**; Pure `N` -> **0**. Pure `N` **better** (0 > -5).
          *   If (Bob `N`, Chair `N`): Mix -> **0**; Pure `N` -> **0**. *Tie*.
      *   **Result:** The mixed strategy (50/50) is **NOT** weakly dominating pure `N` because it loses when (Bob `N`, Chair `Y`).

  **Wait... So what dominates what?** The key is to find a mix that dominates a *specific* pure strategy. Crucially, **Pure `Y` *is* weakly dominated by Pure `N`? NO! But let's find the right mix.**

  *   **Dominating `Y`:** Consider a mix that plays `N` with **100%** probability. Compare Mix(`N` 100%) vs Pure `Y`:
      *   (Bob `Y`, Chair `Y`): Mix `N` -> **+3**; Pure `Y` -> **+3**. Tie.
      *   (Bob `Y`, Chair `N`): Mix `N` -> **0**; Pure `Y` -> **+3**. Pure `Y` better.
      *   **(Bob `N`, Chair `Y`): Mix `N` -> **0**; Pure `Y` -> **-10**. Mix `N` better.**
      *   (Bob `N`, Chair `N`): Mix `N` -> **0**; Pure `Y` -> **0**. Tie.
