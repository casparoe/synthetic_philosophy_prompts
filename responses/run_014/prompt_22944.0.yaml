      *   Now compare this Mix to **Pure `T`** (payoff 1, regardless):
          *   Vs `L`: Mix=0.5 < Pure `T`=1 → Mix *worse*.
          *   Vs `R`: Mix=1.5 > Pure `T`=1 → Mix *better*.
          *   Mix does NOT dominate `T` (it's worse against `L`).
      *   Compare Mix to **Pure `B`** (payoff 0 or 2):
          *   Vs `L`: Mix=0.5 > Pure `B`=0 → Mix *better*.
          *   Vs `R`: Mix=1.5 < Pure `B`=2 → Mix *worse*.
          *   Mix does NOT dominate `B`.
  *   **The Winning Mix:** Consider Row playing `T` with probability **2/3**, `B` with probability **1/3**.
      *   Expected Mix vs `L`: (2/3)*1 + (1/3)*0 = **2/3 ≈ 0.666**
      *   Expected Mix vs `R`: (2/3)*1 + (1/3)*2 = **4/3 ≈ 1.333**
      *   Compare this Mix (2/3 T, 1/3 B) to **Pure `T`**:
          *   Vs `L`: Mix ≈0.666 < Pure `T`=1 → Mix *worse*.
          *   **Vs `R`: Mix ≈1.333 > Pure `T`=1 → Mix *better*.**
          *   Mix does NOT dominate `T` (worse against `L`).
      *   **Compare this Mix to Pure `B`:**
          *   **Vs `L`: Mix ≈0.666 > Pure `B`=0 → Mix *better*.**
          *   Vs `R`: Mix ≈1.333 < Pure `B`=2 → Mix *worse*.
          *   Mix does NOT dominate `B` (worse against `R`).
  *   **Dominating `T`:** Find a mix that is always >= `T` and strictly better somewhere.
      *   We need a mix (p * T + (1-p) * B) such that:
          *   Vs `L`: p*1 + (1-p)*0 = p >= 1? Only if p=1 (pure T).
