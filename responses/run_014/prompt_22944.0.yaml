  ### **Answering Your Core Questions**

  1.  **Can a strategy survive pure-IEWDS but be eliminated by mixed-IEWDS?**
      *   **Yes, absolutely.** This happens when a strategy (`B`) isn't beaten uniformly by any *single* other pure strategy, but a *blend* of other strategies *can* create a "conditional threat profile" that matches or beats `B` in every scenario and strictly beats it in at least one.
      *   **Intuition for the Blend:** Think of the blend as a way for the player to say, "Depending on what you (the opponent) do, I will *effectively* respond with the pure strategy in my mix that handles your choice best." No single pure strategy can cover all opponent actions optimally if the payoffs are conflicting (like `U` being great against `L` but terrible against `R`, and `M` being terrible against `L` but great against `R`). A mix allows the player to hedge their bets, ensuring a *minimum level of performance* across all opponent moves that a single pure strategy cannot guarantee. If one pure strategy (`B`) fails to meet this minimum performance bar set by the best possible hedge (the mix), it gets eliminated under mixed dominance, even if no single pure alternative beats it everywhere.

  2.  **Why does order matter under weak dominance?**
      *   **The "Tie Problem":** Weak dominance allows ties ("at least as good"). Deleting a strategy (`A`) that is *only* weakly dominated *because* of ties with another strategy (`B`) can inadvertently make `B` look worse later.
      *   **Example:** Imagine a game with 3 strategies: `A`, `B`, `C` for a player.
          *   `B` weakly dominates `A` (they are equal in all cases except one where `B` is strictly better).
          *   `C` weakly dominates `B` ONLY IF `A` is still present (maybe against some opponent action, `C` ties `B`, but `B` only beats `A`; if `A` is gone, `B` might now strictly beat `C` somewhere else).
      *   **Sequence 1:** Delete `A` first (because `B` >~ `A`). Now compare `B` and `C` in the absence of `A`. `C` no longer dominates `B`; maybe `B` even dominates `C` now! `B` survives.
      *   **Sequence 2:** Delete `B` first (because `C` >~ `B`, relying on the presence of `A` to make this true). Now compare `A` and `C`. `C` might dominate `A` directly. `C` survives.
      *   **Result:** Final surviving set depends on order: `B` (Seq1) vs `C` (Seq2). The "weak" aspect (ties) makes dominance conditional on the presence of other strategies that create those specific tie-breaking scenarios. Mixed dominance can amplify this by introducing more complex conditional relationships.

  3.  **Why can iterated elimination strip away Nash equilibrium strategies?**
      *   **Off-Equilibrium Credibility vs. Equilibrium Stability:** IEWDS (especially with weak dominance) is about *initial* rationality under *all possible* opponent play, including irrational or off-equilibrium paths. It asks: "Could a rational player *ever* justify playing this strategy, no matter what they think opponents *might* do (even crazy things)?"
      *   A Nash Equilibrium (NE) is about *stable* play where *no player wants to deviate*, **given that the opponents are playing their NE strategies**. A strategy might be optimal *only* if opponents play their specific NE strategies. It might be a terrible choice if opponents play something else.
      *   **The Conflict:** If a strategy (`S_i`) for player `i` is part of a NE, it's optimal *given the NE strategies of others*. However, `S_i` might be weakly dominated *in the full game* by another strategy (`T_i`) because `T_i` gives the *same* payoff as `S_i` if opponents play their NE strategies, but gives a *strictly better* payoff if opponents play some *other* (non-NE) strategy. Rationality under *all possible* opponent play (IEWDS) demands deleting `S_i`. Stability given *specific* opponent play (NE) allows `S_i` to persist.
      *   **Example:** In the "Bimatrix Game" above (`U/L` and `M/R` are both NE):
          *   `D` is strictly dominated (by mixes) and is deleted by IEWDS. `D` is not part of any NE. So far, so good.
          *   But suppose we had a different game where `D` *was* part of a NE (e.g., if payoff for `D/R` was (1, 1)). Mixed-IEWDS might *still* eliminate `D` if a blend of `U` and `M` beat it universally. However, in the NE where P1 plays `D` and P2 plays `R`, neither wants to deviate *if they believe the other is playing their NE strategy*. IEWDS doesn't care about this belief; it cares if `D` could *ever* be a uniquely rational choice *before* any play happens, considering all opponent possibilities. If it's dominated, it gets deleted, even if it sits happily in a NE.

  ---

  ### **Key Takeaways for Your Readers**

  1.  **Dominance Isn't Just Pure:** Rational players consider *randomized plans* (mixed strategies). A strategy can be "obviously bad" compared to a clever blend, even if no single alternative beats it outright.
  2.  **Blending Creates New Threats:** Mixing lets players implicitly threaten different responses to different opponent moves. This creates a stronger benchmark for rationality – a strategy must be robust against this broader spectrum of conditional play.
  3.  **Weak Dominance is Slippery:** Because it allows ties, what counts as "dominated" can depend crucially on what other strategies are still present. Deleting one strategy can change whether a tie exists elsewhere, altering the dominance relationship. Order matters.
  4.  **Rationality vs. Stability:** Eliminating a strategy means "No rational player would *ever* play this, given *any* belief about opponents." Finding a Nash Equilibrium means "Players won't want to change *if* they believe opponents are playing *this specific way*." These are different concepts. Something too risky to play upfront (`S_i`) might be perfectly rational to play once an equilibrium is established and trusted.

  By highlighting the power of mixed strategies and the conditional nature of weak ties, you can help your readers see why IEWDS gets messy and why game theorists debate what "rational" pre-play deletion should entail. The core tension is between requiring robustness against *all conceivable play* (mixed-IEWDS) versus a more focused notion of dominance (pure-IEWDS) and the stability found in equilibrium.
