prompt: |-
  ok, context first, sorry. My roommate Sam is doing a cog sci PhD and last night we ended up in the kitchen at like 2am with cold pad thai going in circles about the multiple drafts model, again. His line: nobody needs to *read* the drafts, the reports ARE the drafts, and if I keep asking "who's watching" I'm just smuggling the little man back in through the vocabulary. My line: the theory is a promissory note, it dissolves the question instead of answering it, and I can't see how there's a fact about *which* draft became the story unless somebody somewhere took delivery of it. We did not resolve it. We bet a bottle of the good whisky and agreed to commission a neutral third party — you — to produce something that makes us both laugh, for different reasons.

  So: write me a deadpan internal document from a mid-sized media company whose only product is a single continuous, first-person, apparently-live broadcast. The company is announcing the closure of its Theater division — the one with the stage, the single screen, the finish line where incoming material either had or hadn't arrived — and its replacement by Distributed Editorial, a reorg in which content is fixed in various places at various times, propagates, and eventually gets spoken out loud, with no central sign-off at any point. I want three parts stitched into one document: (1) the reorg memo proper, with an effective date, a rationale section, and an org chart rendered in plain text; (2) an FAQ for anxious staff; (3) a short town hall transcript where the questions come from the floor. Include a "legacy systems" footnote about the deprecated pineal-gland integration, and — this is the bit Sam will like — make the official incident-report taxonomy literally distinguish Orwellian revisions (record altered after the fact) from Stalinesque ones (reconciled before publication), and have HR insist that neither is a defect, just two ways of filing. Work in at least three real escalations as case studies: a report that went out describing a light changing colour mid-flight *before* the second light was ever received, a tactile incident where the client felt taps at points on the arm nobody ever touched, and a timing audit showing the decision was executed a good half-second before the editor logged having made it. Each one gets resolved in a way that is technically correct and completely unsatisfying.

  The fairness constraint is the important one, so please don't fudge it. Nothing about the theory in this document should be invented or exaggerated — no screen, no finish line, no moment of arrival, no central witness, reports not read off anything. A defender should read it and say "yes, that's exactly right, that's the whole point," while I read the same sentences and say "and that's precisely the problem." The jokes have to come from the theory being implemented faithfully, not from the theory being dumb; the easy gag about a tiny person at a desk is banned, since the entire memo is about there not being one. What I actually want is for the document to keep slipping — the CEO post is formally abolished in paragraph two and the memo keeps routing things to "the CEO's inbox" anyway, the SOP for reconciling conflicting drafts has a numbered step for a tie that the theory says can't occur, and the FAQ answer to "if nobody reads the drafts, how do we know the show went out" is evasive in a way that is simultaneously a good answer and no answer at all. Stay deadpan the whole way, never wink, don't name any real philosopher as the butt (the target is the position and the house style of explaining it, not a person), and don't quote any actual book — anything in quotation marks should be invented corporate-speak. Aim for 800ish words, formatted like a real internal document with headers and numbering, with the town hall transcript as the last 250.
