prompt: |-
  When a self-driving car causes a collision, the emerging legal consensus routes liability to the manufacturer under product liability law, not to the human occupant under negligence or criminal law. Yet the same legal frameworks require that a human remain behind the wheel, attentive and ready to take over, and prosecutors have charged occupants who were plainly not supervising — watching a movie, asleep — with serious offenses. So the law seems to say both that the car is responsible and that you are. What theory of moral agency and responsibility does this two-part practice presuppose? Is it a coherent theory, or does it try to have things both ways? Reconstruct the implicit view as precisely as you can, distinguish what the practice strictly presupposes from what it merely fits well with, and say what would have to change in the liability framework if we adopted instead a view on which autonomous systems can be full moral agents — or, at the opposite extreme, a view on which they are mere instruments and the human supervisor always bears full responsibility. Finally, identify which assumptions your analysis depends on most heavily and how your conclusions would shift if those assumptions were relaxed.
reasoning: |-
  Okay, the user is asking about the legal and moral implications when self-driving cars cause accidents. They point out the contradiction between holding manufacturers liable under product liability law while also charging inattentive human supervisors. I need to figure out the underlying moral theory here.

  First, I should break down the current legal practice. Product liability targets manufacturers for defects, which treats the car as a product. But when humans are charged criminally for negligence, it's because they failed their duty to supervise. So there's a split: the manufacturer is liable for the car's flaws, while the human is responsible for their own failures in supervision.

  The user wants to know the implicit moral agency theory. It seems like the law sees the car as a tool, not a moral agent. The manufacturer is responsible for ensuring the tool is safe, but the human has a duty to use it properly. This suggests a functionalist view where responsibility is distributed based on roles rather than assigning full agency to the car.

  I need to consider coherence. Is this contradictory? Not necessarily. The manufacturer's liability is for the design and production, while the human's liability is for their conduct. They address different failures: one is a product flaw, the other is a failure in supervision. So it's consistent within a framework that separates product safety from user conduct.

  Next, the user asks about alternative views. If we treat autonomous systems as full moral agents, that would shift liability entirely to the car or manufacturer. The human might only be liable if they misused the system. But current law doesn't recognize AI as legal persons, so this would require significant legal changes. On the other extreme, treating cars as mere tools would make the human always responsible, even if they were reasonably attentive. That seems impractical and unfair.

  The key assumptions here are about the capabilities of autonomous systems and the feasibility of human supervision. If the car is highly reliable, expecting constant human vigilance is unrealistic. But if the tech is unreliable, human oversight becomes crucial. Also, the law's distinction between different types of failures (design vs. conduct) hinges on whether we can clearly separate those in accidents.

  If we relax the assumption that humans can effectively supervise, the current model falls apart. Then, either manufacturers must ensure full autonomy, or we need new liability categories. Similarly, if AI becomes truly agential, legal personhood might be necessary. But that's a big shift.

  The user might be interested in how evolving tech challenges existing legal frameworks. They might also be probing the ethical justifications behind current laws and whether they hold up. Their deeper need could be understanding how society should adapt to increasingly autonomous systems, balancing innovation with accountability.

  I should make sure to address both legal and moral aspects, clarify the implicit theory, evaluate coherence, explore alternatives, and identify critical assumptions. Also, highlight how changing tech could force legal evolution, which might be the user's underlying concern.
answer: |-
  The current liability framework for self-driving cars reflects a **Functionalist Partitioning Theory of Responsibility**, which implicitly denies full moral agency to autonomous systems while imposing conditional duties on human supervisors. This theory is *provisionally coherent* but faces tensions under technological realities.

  ### Reconstructing the Implicit View
  1.  **Moral Agency:** Only humans possess full moral agency. Autonomous systems are sophisticated *artifacts* – tools or products – lacking intentionality, consciousness, or the capacity for true moral reasoning or culpability.
  2.  **Manufacturer Responsibility (Product Liability):** The manufacturer is the *creator and guarantor* of the artifact. Liability attaches based on:
      *   **Design Defect:** The system was inherently unsafe when used as intended.
      *   **Manufacturing Defect:** The specific unit deviated from the intended design.
      *   **Failure to Warn:** Inadequate instructions or warnings about limitations.
      *   **Implied Warranty:** The product wasn't reasonably fit for its ordinary purpose.
      *   **Theory:** The manufacturer controls the artifact's capabilities and risks; they bear responsibility for its failures as a product. This is *strict liability* (no fault needed) or *negligence* regarding design/manufacture.

  3.  **Human Supervisor Responsibility (Negligence/Criminal Law):** The human occupant occupies a specific *functional role* defined by the system's current limitations:
      *   **Conditional Duty:** Because the system is *not fully autonomous or reliable* in all foreseeable scenarios, the human has a non-delegable duty to be attentive and ready to intervene. This duty arises from:
          *   *Instrumental Imperative:* The tool requires competent supervision to be used safely.
          *   *Risk Assumption:* By choosing to use an imperfect system, the user assumes a residual responsibility for safe operation.
          *   *Proximate Control:* The human is the only potential *intervener* present.
      *   **Breach of Duty:** Failure to be attentive/ready constitutes negligence. Gross negligence (e.g., sleeping, watching TV) can rise to criminal recklessness if it creates a substantial and unjustifiable risk.

  4.  **Partitioning Principle:** Responsibility is partitioned based on the *nature of the failure*:
      *   A crash caused by a *system malfunction* (software bug, sensor failure) → **Manufacturer Liability.**
      *   A crash caused by a *failure to supervise* when intervention was possible and necessary → **Human Liability.**
      *   (Crucially) A crash caused by a system malfunction *that could not have been prevented by reasonable human intervention* → **Manufacturer Liability ONLY.**

  ### Coherence Assessment
  *   **Internally Coherent?** Yes, provisionally. It consistently applies existing legal categories (product liability for artifacts, negligence for human conduct) to distinct types of failures. It avoids attributing agency to non-sentient machines.
  *   **Tensions & "Having it Both Ways"?** Tensions arise primarily from *technological capability vs. human capacity*:
      *   **Expectation Gap:** If the system is marketed/perceived as highly autonomous ("self-driving"), expecting constant human vigilance is psychologically unrealistic ("automation complacency"). The duty imposed may exceed human cognitive capabilities for sustained monitoring.
      *   **Causation Ambiguity:** Accidents often involve complex interactions. Was it a latent software defect that manifested unpredictably, or was it a failure of the human to recognize an ambiguous situation demanding intervention? Assigning fault can be highly contested.
      *   **Mixed Liability Scenarios:** Could both a system defect *and* negligent supervision contribute? (Yes, leading to apportionment, but this complicates the "partitioning").
      *   **"Responsible but not Liable"?** The law effectively says: "The *car* (via its maker) is responsible for *being defective*, but *you* are responsible for *failing to catch its defect* if reasonably possible." This is logically distinct but feels like double responsibility to the public.

  ### Distinction: Presupposed vs. Compatible
  *   **Strictly Presupposed:**
      1.  Autonomous systems lack moral agency/culpability.
      2.  Product liability law is the appropriate framework for harms caused by defective artifacts.
      3.  Humans using complex, potentially dangerous tools have a duty of care, which includes supervision if the tool is imperfect.
      4.  Responsibility can be partitioned based on the distinct causal contribution (artifact failure vs. human conduct failure).
  *   **Fits Well With (but not strictly required):**
      1.  A "reasonable person" standard for human supervision.
      2.  Strict liability regimes for inherently dangerous activities/products.
      3.  The idea that creators bear responsibility for the risks their creations impose.
      4.  Current levels of autonomy (SAE Level 2/3) where human takeover is realistically expected.

  ### Shifting the Liability Framework Under Alternative Theories

  1.  **Full Moral Agency for Autonomous Systems:**
      *   **View:** The AI system itself is considered a moral agent capable of intentionality, decision-making, and culpability.
      *   **Changes Required:**
          *   **Legal Personhood:** Grant AI systems (or their embodiment) legal personhood status to bear duties and liabilities directly.
          *   **New Liability Category:** Develop "AI Negligence" or "AI Recklessness" torts/crimes focused on the *system's* decisions and actions. Manufacturer liability might shift to *vicarious liability* (for actions of its agent, the AI) or remain for design flaws enabling harmful agency.
          *   **Human Liability:** Severely limited. The human supervisor might only be liable for *intentional misuse* or *grossly negligent enabling* (e.g., hacking the system to be dangerous). The duty of constant supervision evaporates if the AI is truly autonomous and agential. "Product liability" becomes largely irrelevant as the AI is an agent, not a product.
      *   **Impact:** Manufacturer liability could become immense (vicarious liability for autonomous agents). Causation disputes would focus on the AI's "state of mind" or decision algorithms. Human users gain significant freedom from oversight burdens.

  2.  **Mere Instruments (Human Always Bears Full Responsibility):**
      *   **View:** Autonomous systems are *always* just tools, like a hammer or chainsaw. The human operator bears full responsibility for any outcome caused by the tool's operation, regardless of automation level or system defects.
      *   **Changes Required:**
          *   **Abolish/Avoid Product Liability for Crashes:** Treat crashes solely as operator error. Manufacturer liability would be limited to warranty claims (you bought a defective product, get a refund) or perhaps fraud, but not for *harm caused* by the defect during use.
          *   **Strict Liability or Heightened Negligence for Users:** Users could face strict liability for any crash (like ultra-hazardous activity) or a very high standard of care, making them liable even for reasonably unforeseeable system failures.
          *   **Eliminate "Supervision Duty" Nuance:** The duty isn't "supervision," it's *absolute control and responsibility*. Sleeping would be automatic liability, regardless of whether intervention was possible.
      *   **Impact:** Drastically reduces manufacturer incentive for safety (beyond market forces). Places an immense, likely uninsurable, burden on users. Stifles adoption of autonomy. Ignores the reality that highly automated systems *remove* direct control from the user.

  ### Critical Assumptions & Impact of Relaxation
  1.  **Assumption: Humans *Can* Effectively Supervise:** The framework depends on the feasibility of a human maintaining situational awareness and readiness to intervene during automated operation.
      *   **Relaxation:** If automation complacency is inherent and unavoidable, or reaction times are insufficient, the human liability pillar collapses. Liability would shift overwhelmingly to manufacturers for failing to make the system safe *without* reliable human oversight. The "duty to supervise" becomes an unfair burden.
  2.  **Assumption: Failures are Partitionable:** The framework assumes crashes can be clearly attributed *either* to a system defect *or* a human supervision failure.
      *   **Relaxation:** If failures are intrinsically complex and interactive (e.g., system presents ambiguous data confusing human, human confusion triggers a system error), partitioning becomes arbitrary. This could lead to unpredictable outcomes, increased litigation, and pressure for enterprise liability (manufacturer always liable) or no-fault compensation schemes.
  3.  **Assumption: Current Autonomy Levels (L2/L3) are Representative:** The framework fits best with conditional automation where takeover is expected.
      *   **Relaxation:** With true L4/L5 autonomy (no driver, no steering wheel), human supervisor liability evaporates. Manufacturer/product liability becomes the *sole* framework. The "duty to supervise" concept vanishes. Conversely, if systems remain perpetually L3, the tension around unrealistic human expectations intensifies.

  **Conclusion:** The current "Functionalist Partitioning" approach is a logical extension of existing legal categories to a novel technology. Its coherence hinges on the practical feasibility of human supervision and the ability to cleanly separate causes of failure – assumptions increasingly challenged by the nature of automation and complex system interactions. As autonomy advances, the framework will strain, likely necessitating a significant shift towards greater manufacturer responsibility and potentially redefining the very concepts of agency and control in the law.
