  I'm drafting a piece on Quine's radical translation and I keep getting confused by two claims that people seem to conflate: inscrutability of reference and indeterminacy of translation. Can you explain the difference between them, ideally using the gavagai example, and why the second one is a much stronger (and more controverial) claim than the first? I'm specifially curious about the bit where Quine says there's no fact of the matter — is he really claiming there's no fact of the matter, or just that we can never figure out which translation manual is the right one?
