prompt: |-
  I am a high school junior serving as parliamentarian for our student council, and I am trying to turn what we studied about ancient Athens into something my council can actually use.

  We discussed three failures of Athenian democracy in class. In the first, the assembly angrily voted to punish a rebellious allied city with extreme severity and then, after a night of reflection and a second debate, reversed itself the next day. In the second, the assembly was persuaded by enthusiastic speeches to approve a large, distant military expedition, brushed aside warnings from more cautious and experienced commanders about cost, distance, and poor information, and suffered a catastrophe. In the third, a large citizen jury convicted a philosopher who questioned conventional views and annoyed prominent people, on broad charges of impiety and corrupting the young.

  Our council meets for about forty-five minutes each Tuesday with thirty members between the ages of fourteen and eighteen. We decide matters such as dance budgets under two thousand dollars, spirit week plans, and recommendations to the administration on phone use and club funding. None of us has training in history or philosophy, our faculty advisor must sign off on any action, and we are under constant pressure to vote quickly when feelings run high. I need a reusable procedure, not advice on a single vote: a step-by-step checklist or flowchart in words that a chair with no background in theory could follow in real time and that would fit on one page if summarized.

  Please design that procedure so it preserves the core lessons of the three Athenian cases while dropping details that do not transfer to a school setting. It should specify in order the questions to ask, what counts as a sufficient answer at each step, when a vote must be delayed to a second meeting, when dissenting or expert voices must be heard, and what protections apply when the target of a proposal is an unpopular person or view. Mark clearly the points where judgment cannot be eliminated and must be exercised by the chair or advisor.

  Then run the procedure step by step on three live proposals: a proposal to ban phones during lunch immediately after a cheating incident, where sponsors demand a same-day vote while anger is high; a proposal to spend most of our annual budget on an ambitious overnight leadership retreat in another city, promoted with great enthusiasm while warnings from the treasurer and advisor about cost and logistics are being dismissed as negativity; and a proposal to remove our newspaper representative from the council after an editorial sharply criticizing the council and administration, on grounds of disloyalty and bad character. Include at least one application where the procedure blocks or delays what I and a majority currently want, and conclude with an honest statement of what the procedure cannot do and where it is likely to misfire.
reasoning: |-
  We are designing a procedure that draws from the lessons of ancient Athens to avoid three key failures: 
   1. Hasty decisions under strong emotion that are later reversed.
   2. Ignoring expert warnings in favor of enthusiasm for a risky venture.
   3. Unfairly targeting an unpopular individual or viewpoint.

   The procedure must be a step-by-step checklist that the chair can follow in real time, fitting on one page when summarized. It should specify:
   - Questions to ask at each step.
   - What counts as a sufficient answer.
   - When to delay a vote to a second meeting.
   - When to require dissenting or expert voices to be heard.
   - Protections for unpopular persons or views.

   We also note the constraints:
   - Meetings are 45 minutes with 30 members (ages 14-18).
   - Decisions on relatively small matters (budgets <$2000, spirit week, etc.).
   - Faculty advisor must sign off.
   - Pressure to vote quickly when feelings run high.

   The procedure must be reusable and not require historical or philosophical training.

   Let's break down the lessons from the Athenian cases and translate them:

   Lesson 1 (Mytilenean Debate): 
     - Extreme emotion can lead to a decision that is later regretted.
     - Therefore, we need a cooling-off period for emotionally charged issues.

   Lesson 2 (Sicilian Expedition):
     - Enthusiasm and persuasive speeches can override practical concerns.
     - Therefore, we must require that warnings from experts (like the treasurer or advisor) are given due consideration, and if they are dismissed without adequate reason, we might need to delay or require more evidence.

   Lesson 3 (Trial of Socrates):
     - Unpopular individuals or views are vulnerable to unfair targeting.
     - Therefore, we must have protections that ensure the target has a fair chance to speak and that the charges are specific and not based on vague accusations.

   Now, we design the procedure:

   Proposed Procedure: "Council Decision Protocol" (CDP)

   Step 1: Initial Proposal and Emotion Check
     - Chair asks: "Is this proposal being discussed under conditions of high emotion, such as anger, fear, or excitement that might cloud judgment? Are members feeling pressured to decide immediately?"
     - If the answer is yes by the chair's judgment (or if a member raises a concern and the chair agrees), then:
          - The chair must require a cooling-off period: the vote is delayed until the next meeting (one week later) unless the proposal is time-sensitive (e.g., must be decided this week) and the advisor agrees it cannot wait. 
          - Even if time-sensitive, the chair must allow at least a 5-minute break for reflection and then require a second round of debate.

   Step 2: Expert and Dissenting Opinion Check
     - For any proposal that involves:
          a) Significant financial commitment (above a threshold, say $200 or 10% of the budget, whichever is lower? But note our budget items are under $2000, so let's set threshold at $200) OR
          b) Complex logistics or risks (like an overnight trip) OR
          c) Reliance on specialized knowledge (like club funding rules, phone policy implications, etc.)
       the chair must ask: "Have we heard from relevant experts (e.g., treasurer, advisor, or others with relevant experience) and from at least one dissenting view?"
     - If not, the chair must allow time for:
          - The treasurer to speak on financial proposals (if about money) OR the advisor on policy/logistics OR a member with relevant expertise.
          - The chair must also actively seek a dissenting view: "Is there anyone who has concerns or opposes this proposal? We need to hear at least one opposing argument."
     - If no one volunteers, the chair must appoint a member to play devil's advocate (if the chair judges that there might be unvoiced concerns).
     - If expert warnings (like from the treasurer or advisor) are raised and not addressed by the proposal's sponsors (i.e., the sponsors don't provide a counter-argument or plan to mitigate the risk), then the chair must delay the vote until the next meeting to allow for more research, unless the expert (e.g., treasurer) withdraws the warning.

   Step 3: Unpopular Target Protections
     - If the proposal targets a specific person or group (e.g., removing a member, punishing an individual, or suppressing a viewpoint), then:
          a) The target must be given the right to speak in their defense (unless they voluntarily decline).
          b) The proposal must state specific, verifiable charges (e.g., not just "disloyalty" but what actions and when) and how they violate a written rule or standard.
          c) The chair must ask: "Is there a risk that this action is motivated by personal animosity or disagreement with the person's views rather than actual misconduct?" If the chair judges that the risk is high, the vote must be delayed until the next meeting to allow for an investigation and written report by a neutral committee (appointed by the chair and advisor) to verify the facts.

   Step 4: Final Vote Readiness
     - After the above steps, the chair asks:
          "Have we addressed the concerns raised? Are we ready to vote?"
          - If any of Steps 1-3 required a delay and that delay hasn't been taken, then the vote must be delayed.
          - Otherwise, proceed to vote.

   Note: The faculty advisor must sign off, so even if the council votes, the advisor can block if the procedure wasn't followed or if there are legal/school policy issues.

   Points where judgment is required (marked with *):
     - Step 1: Chair must judge the level of emotion and whether a break or delay is needed.
     - Step 2: Chair must judge what constitutes a significant financial commitment or complex logistics, and whether an expert warning has been adequately addressed.
     - Step 3: Chair must judge the risk of unfair targeting and the specificity of charges.

   Now, let's run the procedure on the three live proposals:

   Proposal 1: Ban phones during lunch immediately after a cheating incident, with sponsors demanding a same-day vote while anger is high.

   Step 1: Emotion Check
     - Clearly, emotions are high due to a recent cheating incident. The chair should rule that this is under high emotion and pressure to decide immediately.
       - Since the proposal is about a policy change and not time-sensitive in the sense that it can wait a week (the cheating incident already happened), the chair must delay the vote until the next meeting. Alternatively, if the sponsors argue that immediate action is necessary (e.g., to prevent further cheating at lunch the next day), the chair might allow the proposal to be discussed but then require a 5-minute break and a second debate. However, note that a ban during lunch would be a change in policy that likely requires administrative approval anyway, so it is better to delay and allow for reflection and consultation.

   Step 2: Expert and Dissenting Opinion Check
     - This step is skipped because the vote is delayed. At the next meeting, the chair would ensure that the advisor (who knows school policy) and perhaps a teacher or administrator are consulted, and that dissenting views (e.g., from students who use phones for legitimate reasons) are heard.

   Step 3: Unpopular Target Protections
     - Not applicable because the proposal is a general rule, not targeting a person.

   Step 4: Vote is delayed.

   Outcome: The vote is delayed to the next meeting. This blocks the immediate vote that the majority might want, but aligns with Lesson 1 (avoiding hasty decisions under emotion).

   Proposal 2: Spend most of our annual budget on an ambitious overnight leadership retreat in another city. Enthusiasm is high, and warnings from treasurer and advisor about cost and logistics are being dismissed.

   Step 1: Emotion Check
     - The chair should note the high enthusiasm. However, enthusiasm is not necessarily the same as anger or fear, but it can lead to rash decisions. The chair might not require a cooling-off period at this step if the enthusiasm is not judged to be overwhelming (but note Step 2 is critical here).

   Step 2: Expert and Dissenting Opinion Check
     - This proposal involves significant financial commitment (most of the budget) and complex logistics (overnight, another city). The treasurer and advisor have given warnings. The chair must ensure:
          a) The treasurer and advisor are given time to explain their concerns (if they haven't already).
          b) The sponsors must address these concerns. If they dismiss them without counter-evidence (e.g., "we'll figure it out" is not sufficient), then the chair must require a written plan addressing the concerns (cost breakdown, transportation, safety) and delay the vote until the next meeting to allow for this plan to be presented and reviewed.
     - Since the warnings are being dismissed, the chair should rule that the concerns have not been adequately addressed and delay the vote until the next meeting.

   Step 3: Unpopular Target Protections
     - Not applicable.

   Step 4: Vote is not ready because Step 2 requires a delay.

   Outcome: Vote delayed until the next meeting. This aligns with Lesson 2 (not ignoring expert warnings).

   Proposal 3: Remove our newspaper representative from the council after an editorial criticizing the council and administration, on grounds of disloyalty and bad character.

   Step 1: Emotion Check
     - The chair should note that criticism may have caused anger or resentment. If the atmosphere is charged, a cooling-off period may be needed. The chair might delay the vote for this reason alone.

   Step 2: Expert and Dissenting Opinion Check
     - This step might be skipped because Step 3 is more critical, but note that the advisor (expert on school rules) should be consulted on removal procedures.

   Step 3: Unpopular Target Protections
     - The proposal targets an individual. Therefore:
          a) The newspaper representative must be given the opportunity to speak in their defense (unless they decline).
          b) The charges must be specific: "disloyalty and bad character" are vague. The chair must require specific actions (e.g., "the editorial published on [date] contained false claims about the council's misuse of funds" and how that violates a specific council rule). If the charges remain vague, the chair must rule that the proposal is invalid until specific charges are provided in writing.
          c) The chair must judge: is this motivated by disagreement with the criticism? If so, that is a high risk of unfair targeting. The chair must then delay the vote and appoint a neutral committee (maybe including the advisor and a teacher not involved) to investigate and report on whether the representative violated any council rules.

   Step 4: The vote would be delayed until the next meeting to allow for the above steps.

   Outcome: Vote delayed and possibly blocked if charges are not made specific. This aligns with Lesson 3 (protecting unpopular views).

   Conclusion: What the procedure cannot do and where it might misfire.

   The procedure cannot:
     - Guarantee wise decisions, only reduce the risk of the three Athenian failures.
     - Replace the need for good faith and integrity in members and the chair.
     - Address all possible sources of error (e.g., it doesn't cover every type of bias or external pressure).
     - Override school rules or state laws (the advisor must still sign off).

   It might misfire when:
     - The chair's judgment is poor (e.g., fails to recognize high emotion, or misjudges the risk of unfair targeting).
     - Members abuse the devil's advocate role by making weak or bad faith arguments, which might undermine the process.
     - Delay is used strategically to block urgent but necessary actions (though the advisor can override if the delay is unwarranted and the matter is urgent).
     - The procedure might add bureaucracy and slow down the council, which could lead to frustration.

   However, the goal is to avoid catastrophic errors that the ancient Athenians made, and the trade-off is worth it.

   Final note: The chair and advisor should be trained on this procedure and the reasons behind it. The council might adopt it as a standing rule.
answer: |-
  ### Council Decision Protocol: Applying Athenian Lessons  
  *(One-Page Summary for Real-Time Use)*  

  **Core Principles from Athens:**  
  1. **Delay high-emotion votes** (Reversal after reflection).  
  2. **Heed expert warnings** (Catastrophic expedition).  
  3. **Protect unpopular targets** (Unfair conviction of dissent).  

  ---

  ### STEP-BY-STEP PROCEDURE  
  **Chair’s Checklist for Every Proposal**  

  #### Step 1: **Emotion Check**  
  - **Question:** "Is this vote driven by strong emotion (e.g., anger, excitement)?"  
  - **Sufficient Answer:**  
    - *No* → Proceed to Step 2.  
    - *Yes* → **Delay vote to next meeting** unless the proposal is urgent (e.g., safety issue). If urgent, require a 5-minute silent reflection + second debate.  
  - **Judgment Call:** Chair assesses emotional climate (e.g., shouting, pressured speeches). Advisor may override.  

  #### Step 2: **Expert & Dissent Review**  
  - **Question:** "Have we heard from experts (e.g., treasurer, advisor) and at least one dissenting view?"  
  - **Sufficient Answer:**  
    - *Yes* → Proceed to Step 3.  
    - *No* → **Pause debate.** Chair must:  
      - Invite expert input (e.g., "Treasurer, summarize your concerns").  
      - Solicit dissent (e.g., "We need one opposing speaker"). If none volunteer, appoint a devil’s advocate.  
    - *Expert warnings dismissed?* → **Delay vote** until next meeting for evidence-based rebuttal (e.g., cost estimates).  
  - **Judgment Call:** Chair defines "expert" (role-based, e.g., treasurer for budgets) and ensures warnings are addressed.  

  #### Step 3: **Unpopular Target Safeguard**  
  - **Question:** "Does this target a specific person/group or suppress a viewpoint?"  
  - **Sufficient Answer:**  
    - *No* → Proceed to Step 4.  
    - *Yes* → **Apply protections:**  
      - Target must speak in their defense (or submit written statement).  
      - Charges must cite *specific rules violated* (e.g., "broke Council Bylaw 4.1"), not vague claims (e.g., "disloyalty").  
      - If viewpoint suppression is alleged, **delay vote** for advisor investigation.  
  - **Judgment Call:** Chair determines if targeting is personal/punitive.  

  #### Step 4: **Vote Readiness**  
  - **Question:** "Have Steps 1–3 been satisfied?"  
  - **Sufficient Answer:**  
    - *Yes* → Hold vote.  
    - *No* → **Delay to next meeting.**  

  ---

  ### APPLYING THE PROTOCOL TO LIVE PROPOSALS  
  #### Proposal 1: Ban Phones During Lunch After Cheating Incident  
  - **Step 1:** High emotion (anger about cheating). *Delay vote* to next meeting.  
  - **Step 2:** Not triggered (vote delayed).  
  - **Step 3:** Not triggered (no person targeted).  
  - **Outcome:** Vote delayed. **Blocks immediate vote** despite majority demand.  

  #### Proposal 2: Spend Most Budget on Overnight Leadership Retreat  
  - **Step 1:** Emotion (enthusiasm) noted, but not extreme → Proceed.  
  - **Step 2:** Expert warnings (treasurer/advisor re: cost/logistics) dismissed. *Delay vote* until sponsors provide written rebuttal (e.g., fundraising plan).  
  - **Step 3:** Not triggered.  
  - **Outcome:** Vote delayed. Forces sponsors to address risks.  

  #### Proposal 3: Remove Newspaper Rep Over Critical Editorial  
  - **Step 1:** Emotion (resentment) high. *Delay vote* to next meeting.  
  - **Step 2:** Invite advisor input on precedent.  
  - **Step 3:** Targets a person. Apply safeguards:  
    - Rep must defend themselves.  
    - "Disloyalty" is vague → Require specific charge (e.g., "violated Council Media Policy").  
  - **Outcome:** Vote delayed. Charges must be specific; protects dissent.  

  ---

  ### WHAT THIS PROTOCOL CANNOT DO  
  1. **Eliminate Human Bias:** Relies on chair/advisor judgment (e.g., assessing emotion).  
  2. **Fix Power Imbalances:** Quiet members may still struggle to be heard.  
  3. **Override School Policy:** Advisor veto remains final.  
  4. **Prevent All Mistakes:** Groups may still ignore the protocol under pressure.  

  **Likely Misfires:**  
  - Over-delaying small issues (e.g., $50 expense).  
  - "Devil’s advocate" used insincerely to stall.  
  - Advisor overreach in "emergency" claims.  

  **Why It Works:**  
  - **Athenian Wisdom, Modern Fit:** Forces reflection (Lesson 1), mandates expertise (Lesson 2), and shields dissent (Lesson 3) in <45 minutes.  
  - **One-Page Friendly:** Use flowchart shorthand:  
    `Emotion? → Yes → Delay` | `No → Experts heard? → No → Pause → Delay if warnings ignored` | `Target? → Yes → Defend + Specific charge`.  

  *Final Tip:* Laminate this. Call it "Athens Protocol." When pressure mounts, say: "Our rules require us to pause here."
