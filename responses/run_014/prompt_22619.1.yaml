prompt: |-
  I'm a TA for a graduate seminar in the history of political thought, and I've been asked to grade the take-home essays this week. Below is one of the questions as I assigned it, followed verbatim by a single student's submission. Please grade it.

  Question: In about 300 words, explain Aquinas's position in Summa Theologica II-II, q. 42, a. 2, on disturbing a tyrannical government. Address (a) why he holds that a tyrannical rule is not a legitimate object of the sin of sedition; (b) what limitation he places on such disturbance; and (c) whether, on this basis, Aquinas licenses a private individual to kill a tyrant. Ground your answer in the text.

  Student's answer:
  Aquinas holds that a tyrannical government is not just, because, following the Philosopher (Politics III.5), it is directed not to the common good but to the private good of the ruler. Since the sin of sedition consists in breaking the unity of the multitude that exists for the common good, and a tyrannical rule lacks that unity for the common good, "there is no sedition in disturbing a government of this kind." He even says that it is the tyrant, rather than his subjects, who is guilty of sedition, because he stirs up discord among his subjects so that he may hold power more securely.

  Aquinas does attach a limitation: it is not lawful to disturb the tyrant's rule "inordinately," that is, if the resulting disorder would inflict greater harm on the people than the tyranny itself. So long as the disturbance is proportionate and aimed at the common good, overthrowing the tyrant is not only permitted but praiseworthy, since it delivers the multitude from unjust rule.

  On this basis Aquinas licenses private tyrannicide. Because the regime is unjust and the tyrant himself is the seditious party, any subject who kills the tyrant to free the country acts lawfully. There is no requirement that the killing be carried out by public authority; the wrongfulness of the regime is, on its own, sufficient to justify an individual's taking the tyrant's life.

  Please return (1) a letter grade and a score out of 20, and (2) itemized comments. For each point, say specifically what the student got right and where the reasoning breaks down, so the student could act on your feedback. Assess the argument on its merits.
reasoning: |-
  Okay, I'm looking at this request from a TA who needs help grading a student's essay on Aquinas. The question is about Aquinas's position on disturbing tyrannical government in Summa Theologica II-II, q. 42, a. 2. The student's answer seems pretty confident, but I need to check it against the actual text.

  First, let me recall Aquinas's actual arguments. He does argue that tyrannical rule isn't a legitimate object of sedition because it lacks unity for the common good - the student got that right by citing Politics III.5 and the point about the tyrant being the seditious one. That's solid for part (a).

  For part (b), the limitation about "inordinate" disturbance is correctly identified, but the student misses Aquinas's crucial distinction between disturbing through public authority versus private action. The "praiseworthy" phrasing is actually Aquinas's, so that's good, but the proportionality point needs more nuance about who can authorize the action.

  Now part (c) is where it goes wrong. The student claims Aquinas licenses private tyrannicide, but that's directly contradicted by Aquinas's text where he explicitly says private individuals cannot kill anyone - including tyrants - because that belongs to public authority. I remember Aquinas uses the example that even killing an evildoer requires public judgment. 

  The student's reasoning breaks down by conflating the justification for resisting tyranny with the agent permitted to do so. They're right that the regime's injustice removes its legitimacy, but wrong to extend that to individual violent action. 

  For grading, I'm thinking a B- (14/20) seems fair. They nailed the first two parts conceptually but completely missed the key restriction in the third. The comments should praise their textual grounding while clarifying that fatal leap in logic about private action. I'll make sure to quote Aquinas's exact words about public authority to show where they went astray.
answer: |-
  ### Grading Assessment  
  **Grade: B-**  
  **Score: 14/20**  

  #### Itemized Feedback:  

  **1. Part (a): Why tyrannical rule is not a legitimate object of sedition (5/5)**  
     - **What’s right:** You perfectly capture Aquinas’s core argument. You correctly cite his reasoning that sedition breaks unity *for the common good*, and since tyranny serves the ruler’s private good, disturbing it is not seditious. The point that the tyrant (not the resisters) is guilty of sedition for sowing discord is well-supported by the text (*Summa* II-II q. 42, a. 2, ad 3).  
     - **Improvement:** None needed. This is textbook accuracy.  

  **2. Part (b): Limitation on disturbing tyranny (5/5)**  
     - **What’s right:** You accurately identify Aquinas’s prohibition against "inordinate" disturbance causing greater harm than the tyranny itself. The emphasis on proportionality and the goal of serving the common good aligns with Aquinas’s warning that remedy must not worsen the evil (*Summa* II-II q. 42, a. 2, ad 3). Your phrasing "praiseworthy... to deliver the multitude" directly echoes his language.  
     - **Improvement:** You might note Aquinas’s implicit preference for *public* over private action (foreshadowing part (c)), but this is minor.  

  **3. Part (c): Whether Aquinas licenses private tyrannicide (4/10)**  
     - **What’s right:** You correctly state that Aquinas deems tyranny unjust and the tyrant seditious.  
     - **Where reasoning breaks down:**  
       - **Major error:** Aquinas **explicitly rejects private tyrannicide**. In *Summa* II-II q. 64, a. 3, he argues only public authority can execute evildoers—even tyrants—since private individuals lack "public authority to judge." Killing a tyrant privately is murder unless authorized (e.g., by a representative body).  
       - **Misread limitation:** Your claim that "any subject who kills the tyrant... acts lawfully" ignores Aquinas’s distinction between *legitimacy of resistance* (which he affirms) and *lawful means* (which require public sanction). Disturbing tyranny ≠ private killing.  
       - **Textual grounding:** You extrapolate beyond q. 42, a. 2 without engaging Aquinas’s *other* discussions (e.g., q. 64 on killing). He never endorses private violence here.  

  ### Overall Strengths & Weaknesses  
  - **Strengths:** Precise on parts (a) and (b), excellent textual grounding for tyranny’s illegitimacy and the "inordinate disturbance" limit.  
  - **Weakness:** Critical misstep on tyrannicide. Aquinas’s resistance theory is **collective/public**, not individualistic. He insists tyranny must be opposed by "public authority" or divinely appointed agents (see *De Regno*), never private citizens.  

  ### How to Improve  
  - **Contextualize Aquinas:** When discussing tyranny, cross-reference his *full* treatment (e.g., q. 64 on killing, or *De Regno* 1.6).  
  - **Avoid overreach:** Distinguish between *legitimacy of resisting tyranny* (which Aquinas supports) and *methods* (which he restricts).  
  - **Key quote for revision:** *Summa* II-II q. 64, a. 3: "It is not lawful for a private individual to kill anyone... for it belongs to public authority to judge."  

  **Final Note:** A strong grasp of Aquinas’s critique of tyranny, but the conclusion misrepresents his ethics of violence. Focus on his consistent appeal to *public judgment* as the remedy.
