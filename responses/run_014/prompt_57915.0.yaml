prompt: |-
  So I help organise our uni philosophy soc socials and we had this whole late-night arguement about why everything on campus feels like a race to the bottom at the moment — our house groupchat where nobody dares to be the slow replier, the chicken shops on our road all staying open till 3am even though the owners all say they're knackered, our revision arms race where everyone does extra readings nobody enjoys, that sort of thing. Someone brought up the whole Moloch / multipolar trap idea that everyone can hate the outcome but no one can unilaterally stop, and I thought it'd make a fun freshers' handout that actually sorts people by their instincts rather than just explaining the theory at them.

  Could you write me a 9-question 'which trap-logic do you actually buy' quiz for first-years with no background? Each question should be a concrete everyday case (cleaning rota cheating, societies spamming insta to keep up, two departments competing on email response times, that kind of behaviour) with two or three answer options, phrased so readers can't tell which view an answer leads to, plus a scoring key that maps answer patterns onto these five leaves I want: the doomster who thinks bad equilibria are basically inevitable, the enforcer who wants binding rules with teeth, the culture person who thinks informal norms and social pressure can shift things without formal enforcement, the exiter who says just leave and start a smaller better group, and the techy who thinks a clever mechanism or app can redesign incentives. Please flag any pair of leaves your quiz can't really seperate, note any weird answer combo that doesn't fit anywhere and say whether that's incoherent or just unexplored, and at the end say how confident you are in the sorting overall and which mapping you're least sure of. No need for citations or reading lists, I'll add context myself if needed.
