answer: |-
  Here’s a 9-question quiz designed to sort first-years into five "trap-logic" instincts. Each scenario is grounded in uni life, with answers masking their underlying philosophy. The scoring key flags ambiguities and confidence levels.

  ---

  ### **The "Which Trap-Logic Do You Actually Buy?" Quiz**
  *(Circle your instinctive answer for each)*

  1.  **Study Group Sabotage:** Your seminar group agrees to split readings, but two members consistently skip their sections. The rest quietly cover their work to avoid conflict.  
      A) *"They’re selfish, but calling them out just makes everyone tense. Easier to adapt."*  
      B) *"Next time, we sign a shared doc assigning sections. Skip = automatic peer feedback."*  
      C) *"This is why I work alone. Less stress, less disappointment."*  

  2.  **Chicken Shop Wars:** All 5 takeaways near campus stay open until 3am. Owners complain they’re exhausted, but each fears closing earlier will lose them the drunk crowd.  
      A) *"They’ll never close early unless ALL agree. But good luck organising that."*  
      B) *"If the Student Union brokered a 'midnight closing pact' with penalties, it could work."*  
      C) *"Someone should open a chill 10pm-close café. Night owls need saner options."*  

  3.  **Society Spam:** Clubs you follow post 10+ Instagram stories daily to "stay visible." Execs admit it’s exhausting, but if they post less, engagement drops.  
      A) *"It’s unsustainable, but if one club stops, others will eat their audience. No way out."*  
      B) *"Societies should agree to ‘quiet hours’ – say, no posts after 8pm or during exams."*  
      C) *"I mute them all. Real connection happens at in-person events anyway."*  

  4.  **Library Seat Hoarding:** People "reserve" study desks with water bottles for hours while they’re elsewhere. Everyone hates it, but you do it too or you lose a spot.  
      A) *"It’s the only way to get a seat during exams. Annoying, but necessary evil."*  
      B) *"Librarians should patrol and clear unattended seats after 30 mins. Strict policy = fair play."*  
      C) *"If we all shamed people who do it ("Desk Hogger!" notes?), behaviour might shift."*  

  5.  **Reply-Time Arms Race:** Your house chat expects replies within 10 mins. Slow replies spark "u ok??" texts. Everyone feels pressured, but no one suggests relaxing the norm.  
      A) *"It’s toxic, but unspoken rules are powerful. Easier to just reply fast."*  
      B) *"We need a house meeting: ‘No urgency = 24hr reply window.’ Write it on the fridge!"*  
      C) *"I left the chat. Smaller messenger groups with close mates are way less intense."*  

  6.  **Seminar Silence:** No one answers the tutor’s questions, fearing looking stupid. Yet privately, everyone wishes *someone* would speak up.  
      A) *"It’s awkward, but breaking the silence feels riskier. Just wait for the tutor to move on."*  
      B) *"Tutors should use anonymous polling apps first. Low risk = more participation."*  
      C) *"I try to be the first to say *something*, even if it’s simple. Often others join in after."*  

  7.  **Feedback Freeze:** Module surveys stay bland (“fine, thanks”) because students fear critical comments aren’t truly anonymous and might affect grades.  
      A) *"They’re pointless. Staff see what they want to see. I just tick ‘satisfactory’."*  
      B) *"Surveys need a uni-wide, audited anonymity guarantee signed by the VC to be trusted."*  
      C) *"If reps collected verbal feedback in small groups, people might be more honest."*  

  8.  **Revision Olympics:** Course mates secretly do extra readings "just in case" others do. Everyone’s exhausted, but grades are curved.  
      A) *"If others are grinding, I have to. It’s self-defense in a competitive system."*  
      B) *"Module leaders should publish a strict ‘exam scope’ list to cap unnecessary work."*  
      C) *"I form a pact with 2 friends: we stick to core texts only. Support beats suspicion."*  

  9.  **Event RSVP Ghosting:** Big free-pizza society events get 100+ "attending" on Facebook, but only 30 show up. Organisers waste money and trust.  
      A) *"People flake. It’s inevitable with free/low-cost events. Budget for 50% turnout."*  
      B) *"Require a £1 refundable deposit via an app. You show up, scan a QR code, get £1 back."*  
      C) *"Focus on smaller, sign-up-only events for committed folks. Build a real community."*  

  ---

  ### **Scoring Key**
  Tally how many times you chose **A**, **B**, or **C** across all 9 questions.

  | **Your Dominant "Leaf"** | **Answer Pattern**                                                                 | **What You Believe**                                                                 |
  | :----------------------- | :--------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------- |
  | **The Doomster**         | **Mostly A's**                                                                     | Bad equilibria are sticky. Individual action can’t beat systemic incentives.         |
  | **The Enforcer**         | **Mostly B's (Emphasis on rules/penalties/central authority)**                     | Binding, formal rules with teeth are needed to override destructive competition.     |
  | **The Culture Person**   | **Strong B/C Mix (B=C or 1-2 difference; B's lean social, C's lean informal)**     | Shifting group norms, trust, and peer pressure can create cooperation without laws.  |
  | **The Exiter**           | **Mostly C's (Especially exit/opt-out choices: Q1C, Q3C, Q5C, Q9C)**               | Leave broken systems. Build smaller, better groups with aligned incentives.          |
  | **The Techy**            | **Mostly B's (Emphasis on clever systems/apps: Q4B, Q6B, Q8B, Q9B)**               | Smart design (tech, mechanisms, incentives) can nudge behaviour without heavy rules. |

  ---

  ### **Key Ambiguities & Notes**
  1.  **Enforcer vs. Techy:** Hardest to separate! Both pick "B", but **Enforcer** leans toward penalties/authority (Q2B, Q4B, Q7B), while **Techy** leans toward clever redesigns (Q6B, Q8B, Q9B). If you have a mix, you’re likely a hybrid "systems thinker".
  2.  **Culture Person vs. Exiter:** Can blur if **C answers** focus on *changing* norms (Q6C, Q8C = Culture) vs. *leaving* (Q1C, Q5C = Exiter). Culture needs some "B" social solutions too.
  3.  **Weird Combos:**  
      -   **All A's + Some C's:** "Doomster-Exiter" – Systems are doomed, so opt out. Logically consistent.  
      -   **Mostly B's + Q5C/Q9C:** "Enforcer-Exiter" – Loves rules but bails if they fail. Unexplored tension.  
      -   **Equal A/B/C:** True centrist? Or just context-dependent. Doesn’t fit cleanly – might be "pragmatist".
  4.  **Confidence Level:**  
      -   **High Confidence:** Sorting **Doomster (A)**, **Exiter (C-heavy)**, and **Techy (B-mechanism)**.  
      -   **Medium Confidence:** Sorting **Enforcer (B-authority)** and **Culture Person (B/C social)**. Overlap is real (both want cooperation, differ on *how* formal).  
      -   **Least Sure Mapping:** **Culture Person** (relies on nuanced B/C balance). Least distinct from Enforcer-lite.

  ---

  ### **Handout Ready?**
  This quiz creates self-reflection and debate without lecturing. The scenarios feel familiar, answers hide their bias, and the scoring acknowledges real-world messiness. Pair it with a 2-minute intro to "traps" (e.g., *"When everyone acts ‘logically’ but makes life worse for all"*) and you’re golden. Enjoy the freshers' chaos! 🍃
