prompt: |-
  I am a warehouse supervisor in Sheffield with no university education, but for some years I have been thinking in my spare time about whether a piece of art can still be good when there is something morally wrong with it or with the person who made it. I have some settled reactions that do not seem to fit together, and I would like help finding the rule behind them, if there is one.

  These are the cases I keep returning to. First, there is a long novel about two brothers where the revenge killing at the end is presented as honourable and satisfying. I believe that outlook is morally mistaken, yet I still think it is a powerful and well made novel. The moral mistake does not seem to ruin it for me.

  Second, there is a catchy pop song whose chorus turns a boy's stammer into a joke. Once a friend explained the words to me, I stopped enjoying it and I stopped thinking it was a good song. That feels different from the novel, though I cannot quite say why.

  Third, there are the early series of a sitcom I grew up with. The central performance is still, to my mind, brilliantly timed and the episodes are carefully built. Since learning that the lead actor seriously abused his partner in private life, I still think the episodes are good as comedy, but I feel uneasy about buying the box set because part of the money would go to him.

  Fourth, there was a much praised news photograph of an exhausted homeless man asleep on a night bus, which turned out to have been taken after the photographer paid the driver to keep the man awake for two previous nights so the picture would look more desperate. The image is striking to look at, but I find myself thinking it is a worse piece of work because of how it was obtained. I am puzzled why the way of making matters here but the actor's private behaviour did not seem to spoil the sitcom.

  Fifth, there is a stand-up routine I saw that got large laughs by doing an exaggerated voice to portray newly arrived asylum seekers as stupid and dishonest. I did not laugh, and my view was not only that it was cruel but that it failed as comedy, because the cruelty did the work that observation should have done.

  The case I go back and forth on concerns a set of gentle adventure stories I read to my daughter. There is nothing cruel in the stories themselves, but I have recently learned that their author has spent years campaigning for harsh measures against homeless people, which I strongly oppose. I do not know whether to keep telling her they are good stories, or whether continuing to admire them and recommend them is already a kind of approval of him.

  Can you set out, as precisely as you can, what principle or small set of principles would make best sense of most of these reactions, explaining which of my cases motivates each part of the principle? Please also say what your proposed principle would imply for two further situations I have not described, one where the moral fault lies only in what the work says and one where it lies only in what the maker did apart from the work, and give an honest account of which of my present verdicts you think I would have to give up to hold the principle consistently. Please answer in British English.
reasoning: |-
  Okay, let me try to unpack this warehouse supervisor's dilemma. He's clearly spent years wrestling with how art's quality relates to moral flaws - either in the work itself or its creator. His concrete examples show he's not just theorizing but genuinely troubled by real-life contradictions in his reactions. 

  First, I notice he distinguishes between different types of moral problems: the novel's immoral message vs the photographer's unethical process vs the comedian's cruel content vs the actor's personal misconduct. His reactions vary - he rejects the song and photo entirely, enjoys the novel despite its message, and feels conflicted about funding the actor. This suggests his moral calculus has multiple variables.

  The key might lie in separating three elements: the work's inherent qualities (is it well-made?), its moral content (does it express harm?), and its creation process (was it made unethically?). His discomfort seems strongest when the immorality is baked into the work's fabric (like the stammer-mocking chorus) or when consuming it directly supports harm (like buying the actor's box set).

  For the novel where revenge is glorified, he can apparently compartmentalize because the craftsmanship outweighs the problematic theme. But the asylum jokes fail as comedy precisely because the cruelty replaces genuine wit - here the moral flaw undermines the artistic merit itself. That's an important distinction: sometimes the immorality corrupts the art's function.

  The photo case is particularly telling. What makes it "worse as a piece of work" is probably that the deception is fundamental to the image's power - the artistry relies on the ethical violation. Whereas the sitcom's humor stands apart from the actor's private sins, even if profiting from it feels dirty.

  His daughter's storybook dilemma cuts deepest because it involves nurturing a child's values while opposing the author's politics. Here, the principle might be that when art contains no harmful content, we can appreciate it while condemning the creator - but must we actively promote it? That's where his unease lives.

  I'll need to formulate principles that explain why the song's mockery invalidates it as art while the novel's violence doesn't; why the photo's process taints it permanently but the sitcom's craftsmanship remains intact. The solution probably involves both artistic coherence (does the immorality break the work's internal logic?) and complicity (does engaging with it perpetuate harm?).

  Testing these against his examples will show where the principles hold - and where he'd need to adjust his views. For instance, if he accepts that private sins don't inherently spoil art, he might need to soften his stance on the storybooks. But that photo case... that unethical process really does seem to poison the well.
answer: |-
  Based on your thoughtful reflections, here's a principle that best explains your reactions across most cases, built from the distinctions you're grappling with:

  **The Principle of Artistic Integrity and Complicity:**

  1.  **A work's artistic merit can survive a moral flaw *within* the work itself, *if* that flaw isn't essential to the work's core artistic effect or achievement.** The work must still function effectively *as art* on its own terms, even if those terms are morally problematic.
  2.  **A work's artistic merit *is* diminished or destroyed if:**
      *   **The moral flaw *is* essential to its core artistic effect** (e.g., cruelty *is* the joke, deception *is* the image's power).
      *   **Engaging with the work *directly* or *significantly* supports, endorses, or perpetuates the moral harm itself.** This harm could stem from the work's content *or* the creator's actions.

  **Applying the Principle to Your Cases (Motivating Each Part):**

  1.  **The Novel (Revenge Killing):**
      *   **Verdict:** Artistically good despite moral flaw.
      *   **Why:** The moral flaw (glorifying revenge) is *present* but arguably not *essential* to its core power as a novel (character study, plot structure, prose). The novel functions effectively as art on its own (flawed) terms. *(Supports Part 1)*.
  2.  **The Pop Song (Stammer Joke):**
      *   **Verdict:** Artistically ruined.
      *   **Why:** The moral flaw (mocking disability) *is* the core of the chorus, its main "hook" and source of catchiness. The cruelty *is* the artistic effect. Removing the moral flaw removes the song's central mechanism. *(Motivates Part 2a - Flaw essential to effect)*.
  3.  **The Sitcom (Abusive Actor):**
      *   **Verdict:** Artistically good, but unease about purchasing.
      *   **Why:** The artistic merit (timing, writing, structure) exists independently of the actor's private actions. Enjoying the episodes doesn't inherently endorse his abuse *(Part 1 applies)*. However, *buying the box set* feels wrong because it financially supports the abuser, directly benefiting him from his past harm. This is a *complicity* concern, not an inherent flaw in the work's artistry *(Motivates Part 2b - Complicity in harm)*.
  4.  **The News Photograph (Staged Desperation):**
      *   **Verdict:** Artistically worse because of how it was made.
      *   **Why:** The image's power *depends entirely* on the unethical deception (staging suffering). The "artistic achievement" of capturing desperation is fraudulent; the deception *is* essential to the effect. It fails as honest photojournalism. *(Motivates Part 2a - Flaw essential to effect)*. This contrasts with the sitcom actor because the harm here is *baked into the work's creation and meaning*, not separate.
  5.  **The Stand-up Routine (Cruel Asylum Seeker Portrayal):**
      *   **Verdict:** Fails as comedy.
      *   **Why:** The cruelty *replaces* genuine comedic observation or wit. It relies on prejudice and dehumanization to get laughs, not insight or cleverness. The bigotry *is* the mechanism, making it fail *as art* (comedy). *(Motivates Part 2a - Flaw essential to effect)*.
  6.  **The Adventure Stories (Author's Harsh Campaigning):**
      *   **Verdict:** Uncertain (Principle suggests they remain artistically good, but complicity is the issue).
      *   **Why (Per Principle):** The stories themselves contain no moral flaw. Their artistic merit (gentle adventures) is separate from the author's abhorrent views. Enjoying them doesn't inherently endorse his politics *(Part 1 applies)*. **However:** Recommending them *might* feel like indirect endorsement or support for the author. Purchasing new copies *would* financially support him. The unease stems from potential *complicity* via promotion or financial gain *(Motivates Part 2b - Complicity in harm)*. The principle suggests the *stories themselves* are still good, but your actions *around* them (buying, promoting) raise legitimate ethical concerns separate from artistic merit.

  **Applying the Principle to New Situations:**

  *   **Moral Fault ONLY in What the Work Says (e.g., a beautifully painted propaganda poster advocating genocide):**
      *   **Principle Implication:** The work *could* retain artistic merit (skilful painting, composition) if the hateful message isn't *essential* to appreciating those technical aspects *as painting*. However, the moral flaw is severe, and engaging with it might promote the hateful ideas (complicity). Its value *as art* is likely overwhelmed by its toxicity, but the principle allows for acknowledging the craftsmanship while utterly rejecting the message and refusing to support it.
  *   **Moral Fault ONLY in What the Maker Did Apart from the Work (e.g., a brilliant, morally sound symphony composed by someone later convicted of a terrible, unrelated crime):**
      *   **Principle Implication:** The symphony's artistic merit remains intact. The composer's crime, while horrific, doesn't alter the structure, harmony, or emotional impact of the music itself. Enjoying the symphony isn't an endorsement of the crime. Purchasing it *might* financially benefit the criminal (or their estate), raising complicity concerns, but this doesn't diminish the *inherent artistic quality* of the symphony.

  **Honest Assessment: Which Verdicts Might Need Adjustment?**

  To hold this principle consistently, you might need to slightly adjust your view on two cases:

  1.  **The Novel (Revenge Killing):** The principle strongly supports your view that it *can* be artistically good despite the moral flaw. No change needed.
  2.  **The Pop Song (Stammer Joke):** The principle fully supports your view that it's artistically ruined. No change.
  3.  **The Sitcom (Abusive Actor):** The principle supports your distinction: artistic merit intact, complicity concern with purchase. No change needed.
  4.  **The News Photograph (Staged Desperation):** The principle fully supports your view that it's worse *as a piece of work*. No change.
  5.  **The Stand-up Routine (Cruel Asylum Seeker Portrayal):** The principle fully supports your view that it fails *as comedy*. No change.
  6.  **The Adventure Stories (Author's Harsh Campaigning):** This is the main point of potential adjustment. The principle suggests that **the stories themselves retain their artistic merit** because the moral fault lies entirely *outside* the work and isn't reflected within it. Your feeling that admiring/recommending them feels like "approval of him" is a *complicity* concern (Part 2b), not a flaw in the work's artistry (Part 1). To be consistent, you'd need to accept that the *stories are good stories* (artistically), while deciding whether purchasing/recommending them is an acceptable level of complicity in supporting the author. You wouldn't *have* to keep buying or recommending them – the complicity concern is valid – but the principle suggests the stories *as artistic objects* remain good.
  7.  **Potential Implication for the Novel?** A very strict application *might* lead someone to question if glorifying revenge *is* actually essential to the novel's power for *some* readers. However, your experience suggests it isn't essential *for you*, which the principle allows for.

  **Conclusion:**

  Your reactions are remarkably consistent with the principle that **artistic merit can exist independently of moral flaws, *unless* the flaw is fundamental to the work's artistic effect or engaging with the work actively supports the harm.** The core distinction lies in whether the immorality is *integral* to the art itself (ruining it) or *extrinsic* (leaving artistic merit intact but raising ethical questions about support/complicity). Your struggle with the adventure stories highlights the tension between appreciating the art and avoiding complicity when the creator is morally reprehensible. The principle suggests the stories are still good *as stories*, but your unease about supporting the author is a separate, and valid, ethical consideration.
