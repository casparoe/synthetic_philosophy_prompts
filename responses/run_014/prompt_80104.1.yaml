prompt: |-
  Quick one, sorry if it's a bit rambling, I typed this up between office hours. I keep reaching for an analogy in my intro ethics course to motivate expressivism: moral judgments are a bit like 'Bless you' or 'Thank you' — they don't report a moral fact the way 'it's raining' reports weather, they just express the speaker's attitude, the way 'Bless you' expresses sympathy at a sneeze. It lands well for the flat cases ('Killing is wrong' ≈ 'Boo to killing'), and a colleague of mine recently used the same picture in a talk to argue that moral disagreement is just a clash of attitudes, with no fact of the matter to be discovered.

  Can you audit how far this analogy actually holds? I want the correspondence table first — what plays the role of the sneeze, the blessing, the speaker's feeling, and so on — and then the places where the mapping breaks, especially when moral sentences get embeded in conditionals, negations, and questions: 'If it's wrong to break promises, then it's wrong to break a promise even to save a friend', 'It's not the case that lying is wrong', 'Is it wrong to...?'. You might recognize those as the Frege–Geach problem, but I want the audit of the analogy, not a survey of the problem. I suspect the analogy is quietly doing all the work for the conclusion about moral disagreement, but I want to know precisely where it fails, which features of the greeting side it imports that moral sentences don't have, and whether an expressivist has any real way to patch it (I've heard of 'prejudgments' and 'higher-order attitudes' but don't trust my memory on what they actually accomplsh). And please say whether my colleague's conclusion about moral disagreement survives once the disanalogies are on the table, or whether the analogy was carrying it the whole time. If there's a better analogy for the same job, I'd love to hear it.
reasoning: |-
  Okay, the user is an ethics professor who uses an analogy between moral judgments and social expressions like "Bless you" to teach expressivism. They want me to audit this analogy's strengths and weaknesses, especially regarding embedded contexts (conditionals, negations, questions) which relate to the Frege-Geach problem. 

  Hmm, they're clearly time-pressed ("typed between office hours") but deeply familiar with the philosophical terrain - they name-drop Frege-Geach and expressivist solutions like "prejudgments" without needing explanation. The real urgency seems to be about intellectual honesty: they suspect the analogy is doing heavy lifting for their colleague's claim that moral disagreement is purely attitudinal, and want to verify if that conclusion survives scrutiny.

  First I should map the analogy precisely. The sneeze is the non-moral event (like killing), "Bless you" is the moral utterance ("Killing is wrong"), and the speaker's sympathy is the attitude (disapproval). The surface correspondence works beautifully for simple declaratives - both express reactions rather than stating facts. 

  But ah, the cracks show in embedded contexts. When we say "If breaking promises is wrong...", we're not expressing current disapproval of promise-breaking - unlike "If bless you..." which would sound bizarre. Same for moral questions like "Is lying wrong?" - we're not emoting but inquiring. The analogy smuggles in two problematic features: (1) that moral utterances must involve occurrent emotions (they don't - I can dispassionately discuss wrongdoing), and (2) that they're non-propositional (but we embed them logically like propositions).

  The colleague's anti-realist conclusion about moral disagreement feels prematurely bolstered by this leaky analogy. Expressivists *have* developed patches - Blackburn's attitude+prejudgment approach, Gibbard's plan-laden norms - but these are complex and arguably stretch "expression" beyond recognition. The analogy's simplicity is pedagogically useful but philosophically dangerous here. 

  For teaching, I might suggest supplementing with aesthetic judgments ("This painting is beautiful") which share similar embedding issues but feel less ritualized than "Bless you." Or emphasize that moral language *behaves* fact-stating even if expressivists think it's ultimately attitudinal - like how "I'm in pain" expresses pain but can still be negated or queried. 

  Ultimately the colleague's disagreement thesis doesn't *collapse* without the analogy - sophisticated expressivism survives Frege-Geach - but the "just a clash of attitudes" rhetoric relies entirely on the oversimplified picture. The real work is in those technical solutions they vaguely recall.
answer: |-
  Your analogy is pedagogically brilliant for introducing expressivism's core intuition, but it breaks down under logical pressure—especially regarding embedding. Here's a full audit:

  ### Correspondence Table
  | **"Bless You" Context** | **Moral Judgment Context** | **Expressivist Role** |
  |-------------------------|----------------------------|------------------------|
  | Sneeze                  | Non-moral event (e.g., killing) | The stimulus triggering the attitude |
  | Speaker's sympathy      | Speaker's disapproval/approval | The expressed attitude (e.g., "Boo!"/"Hooray!") |
  | "Bless you" utterance   | "Killing is wrong"         | The linguistic vehicle for expression |
  | Social ritual function  | Moral discourse function   | Social coordination/pressure |

  ### Where the Analogy Holds
  1. **Simple declaratives**: "Killing is wrong" ≈ "Boo to killing!" mirrors "Bless you" expressing sympathy.  
  2. **Non-descriptive function**: Neither reports objective facts; both express reactive attitudes.  
  3. **Disagreement as attitude clash**: "Killing is wrong!" vs. "No, it's permissible!" parallels conflicting reactions to a sneeze (sympathy vs. indifference).  

  ### Where the Analogy Breaks (Crucially)
  1. **Embedding in Conditionals**:  
     - *Analogy*: "If bless you, then gesundheit" is nonsensical. "Bless you" can't be antecedently supposed.  
     - *Moral case*: "If lying is wrong, then telling your mom is wrong" is logically coherent and common. Expressivists must explain how "lying is wrong" in the antecedent expresses an attitude *without the speaker currently disapproving of lying*.  

  2. **Negation**:  
     - *Analogy*: "Not bless you" might express *withholding* sympathy but lacks truth-apt contrast (e.g., "It's not that I sympathize; I just want silence").  
     - *Moral case*: "Lying is not wrong" isn't merely *withholding* "Boo!"—it actively opposes the attitude expressed by "Lying is wrong."  

  3. **Questions**:  
     - *Analogy*: "Is bless you?" is gibberish. Ritual phrases aren't inquiry-apt.  
     - *Moral case*: "Is lying wrong?" is a meaningful question inviting reasons/correction—not an expression of current uncertainty.  

  4. **Attitude Stability**:  
     - *Analogy*: "Bless you" requires an *occurrent* feeling (I won't say it without sympathy).  
     - *Moral case*: I can dispassionately assert "Killing is wrong" without current disapproval (e.g., in a philosophy debate).  

  ### Why This Matters for Your Colleague's Conclusion
  - **The Disagreement Thesis**: If moral disagreements were *just* attitude clashes like conflicting "Bless you"/silence after a sneeze, there'd be no fact of the matter.  
  - **The Problem**: Embedded contexts show moral language has **logical structure** and **inferential roles** that ritual exclamations lack. This suggests moral judgments aren't *merely* expressions of occurrent attitudes—they function like truth-apt propositions in reasoning.  
  - **Survival of the Thesis?**: The analogy *alone* can't support the "no fact of the matter" conclusion. Sophisticated expressivism (e.g., Blackburn, Gibbard) is needed to explain embedding, preserving attitude-expression as the *core* function while accommodating logic.  

  ### Expressivist Patches (Briefly)
  1. **Blackburn's "Prejudgments" (Quasi-Realism)**:  
     - Treats moral vocabulary as expressing *higher-order attitudes* about which lower-order attitudes to have.  
     - E.g., "If lying is wrong..." ≈ "Boo to lying! So, boo to endorsing lying!"  
     - *Accomplishment*: Mimics logical inference via attitudes about attitudes. Still rejects moral facts.  

  2. **Gibbard's "Planning"**:  
     - Moral judgments express plans/norms for feeling guilt/anger.  
     - "If lying is wrong..." ≈ "If my plan norms guilt for lying, then it norms guilt for lying to your mom."  
     - *Accomplishment*: Embeds attitudes in a normative logic of planning.  

  ### Is a Better Analogy Possible?
  Yes—**aesthetic judgments** ("This painting is beautiful"):  
  - Expresses appreciation but embeds logically ("If this is beautiful, the artist is talented").  
  - Disagreement feels "attitudinal" yet allows reasoned debate.  
  - *Advantage*: Aesthetic language handles conditionals/questions naturally.  
  - *Limitation*: Still faces Frege-Geach (though less acutely than rituals).  

  ### Verdict
  - **Analogy's Role**: Perfect for motivating expressivism’s core insight vs. realism, but overextends by implying moral language is *non-cognitive* in all contexts.  
  - **Colleague's Conclusion**: The "no fact of the matter" thesis *can* survive with quasi-realist tools, but **the analogy alone smuggles in the conclusion** by ignoring logical complexity. Once embedding is addressed, expressivism becomes a technical project—not a simple intuition.  
  - **Recommendation**: Keep the analogy for Week 1, then pivot to embedded cases to show why expressivists need quasi-realism. Aesthetic analogies bridge the gap better.  

  **Bottom line**: The analogy is a ladder to kick away—useful for motivation, but the real work happens in the logic. Your colleague's anti-realism isn't dead, but it needs more than "Bless you" to walk.
