prompt: |-
  Before I read any more of the panpsychist ethics literature, I want the spec first. Write the desiderata that an adequate theory of the moral status of panpsychist entities must meet: which cases it has to handle (the moral weight of experience in regions of the universe where no integrated system exists, the boundary between micro-experience and the experiences we report, and whether the total moral picture of the physical world is a catastrophe or not), which distinctions it has to respect (having experience versus having more of it, experience versus suffering, moral patienthood versus moral agency), and which results from physics and consciousness science it cannot contradict, with the consideration behind each requirement. Flag which desiderata you judge non-negotiable and which you take to be prejudices of a particular camp; identify at least one pair of desiderata you take to be jointly unsatisfiable, and say so with reasons rather than leaving it open; and name the single requirement you think does the most work excluding the existing candidates — for instance the view that moral status scales with complexity, the view that it is restricted to integrated systems, and the view that the background of micro-experience is a vast source of suffering — with a brief score of how each fares against the list.
reasoning: |-
  Okay, the user is asking for a set of desiderata for a theory of moral status in panpsychism. Let me start by understanding their request. They want a spec that outlines what such a theory must address: cases like moral weight in non-integrated systems, boundaries between micro and macro experiences, and whether the total moral picture is catastrophic. They also want distinctions like experience vs suffering, patienthood vs agency, and compatibility with science. Plus, they want me to flag non-negotiables, identify conflicting desiderata, and point out the biggest challenge for existing theories.

  First, I need to recall what panpsychism entails. It's the view that consciousness is fundamental and ubiquitous. So, everything has some level of experience. That leads to questions about moral status: if everything is conscious, does everything have moral worth? How do we assign moral weight to things like electrons or integrated systems like humans?

  The user mentioned specific cases. Handling non-integrated systems means regions where there's no complex structure. Then there's the boundary problem: how micro-experiences combine into macro ones. And the catastrophe question—is the universe filled with suffering if even basic entities experience?

  Distinctions are crucial. Experience itself versus the intensity or amount of it. Then suffering as a specific type of experience. Moral patienthood (entities that can be wronged) versus agency (entities that can act morally). These need clear definitions to avoid confusion.

  Scientific constraints are non-negotiable. The theory must align with physics and consciousness research. For example, if IIT is considered, integration might be key, but it's controversial. Also, supervenience: moral status should depend on physical facts without overstepping.

  Now, conflicting desiderata. Universality and non-catastrophe might clash. If every particle has moral weight, the total could be overwhelming. Saying only integrated systems matter avoids this but might violate universality. That's a tension I need to highlight.

  The biggest challenge for existing theories? Probably the boundary problem. Theories like complexity-based or integration-based struggle to define where moral status emerges. Complexity is vague, integration might exclude too much. The suffering background view leads to catastrophe, which is problematic.

  I should structure the desiderata into categories: scope, distinctions, scientific constraints. Non-negotiables would be scientific consistency and avoiding dualism. Prejudices might include favoring integration due to IIT or rejecting micro-experience moral weight.

  The user's deeper needs: they might be looking for a framework to evaluate panpsychist ethics before diving into literature. They want a clear, critical overview to guide their reading. Identifying conflicts and key challenges helps them focus on viable theories. They might also be concerned about practical implications, like whether panpsychism leads to untenable moral obligations.
answer: |-
  Here is a specification outlining the desiderata for a theory of moral status under panpsychism, structured as requested:

  **Desiderata for a Panpsychist Theory of Moral Status**

  **I. Cases the Theory Must Handle:**
  1.  **Non-integrated Substrate ("Cosmic Dust"):** Must assign plausible moral weight (if any) to regions of the universe where fundamental particles/fields exist but no complex, functionally integrated systems (like brains) have formed. *(Consideration: Panpsychism's core claim is that consciousness is fundamental & ubiquitous. Ignoring the substrate contradicts this; assigning it full weight risks absurdity.)*
  2.  **The Boundary Problem ("Aggregation Gap"):** Must explain the transition in moral status (if any) between fundamental micro-experiential entities (e.g., electrons, quarks) and the unified macro-experiential subjects we report (e.g., humans, animals). How does moral weight scale/emerge? *(Consideration: The Hard Problem of Combination applies here. Our moral intuitions are calibrated to macro-subjects; bridging the gap is central to panpsychist ethics.)*
  3.  **The Cosmic Moral Sum ("Is Reality a Horror?"):** Must provide a coherent assessment of the *total* moral value/suffering inherent in the universe's fundamental structure. Is it neutral, net positive, net negative (catastrophic), or indeterminate? *(Consideration: Panpsychism implies consciousness permeates the cosmos. The moral implications of this totality are unavoidable and deeply consequential for our worldview.)*

  **II. Distinctions the Theory Must Respect:**
  4.  **Presence vs. Intensity/Abundance:** Must distinguish between the *mere presence* of experience (having some minimal moral standing) and the *degree* or *intensity* or *richness* of experience (warranting greater moral weight). *(Consideration: Avoids flattening all consciousness into equal status, respecting intuitions that richer experiences matter more.)*
  5.  **Experience vs. Suffering (Valence):** Must clearly differentiate neutral or positive experiences from negative ones (suffering). Moral significance, especially urgency, hinges critically on valence. *(Consideration: Suffering imposes stronger moral demands. Conflating all experience with suffering leads to cosmic catastrophe.)*
  6.  **Patienthood vs. Agency:** Must distinguish moral *patienthood* (entities that can be wronged/have interests) from moral *agency* (entities capable of recognizing and acting upon moral reasons). Panpsychism primarily speaks to patienthood. *(Consideration: Rocks might be patients (if conscious) but not agents. Confusion here leads to category errors in responsibility.)*

  **III. Constraints from Science:**
  7.  **Physics Compatibility:** Must not contradict well-established physics, particularly regarding the fundamental nature of matter/energy, causality, and the closure of the physical world. *(Consideration: Moral weight must supervene on the physical without requiring spooky non-physical interactions.)* **<-- NON-NEGOTIABLE**
  8.  **Consciousness Science Compatibility:** Must align with robust empirical findings regarding the neural correlates of consciousness (NCCs) in macro-subjects and plausible theories linking physical complexity to experiential richness/unification. *(Consideration: Any plausible theory must fit the empirical data on *how* consciousness arises (or manifests) in complex systems like brains.)* **<-- NON-NEGOTIABLE**
  9.  **Supervenience:** Moral status must supervene on the underlying physical (and thus experiential, per panpsychism) facts. No "brute" moral facts independent of the experiential substrate. *(Consideration: Maintains a naturalistic framework essential for coherence with science.)* **<-- NON-NEGOTIABLE**

  **IV. Flagging Key Aspects:**
  *   **Non-Negotiables:** Desiderata **7 (Physics Compatibility)**, **8 (Consciousness Science Compatibility)**, and **9 (Supervenience)**. These are foundational for a scientifically credible and naturalistic theory.
  *   **Potential Prejudices:**
      *   *Insistence on Integration for Moral Weight:* Favors Integrated Information Theory (IIT) camp. Might prejudge desideratum 1 (Non-integrated Substrate) as having zero weight.
      *   *Dismissal of Micro-Experience Moral Weight:* Favors emergentist/biological naturalist intuitions. Might prejudge desideratum 1 & 2.
      *   *Assumption of Universal Suffering:* Favors pessimistic interpretations of valence. Might prejudge desideratum 3 (Cosmic Sum) catastrophically and desideratum 5 (Experience vs Suffering).

  **V. Jointly Unsatisfiable Desiderata:**
  *   **Desideratum 1 (Universality: Assign Moral Weight to Non-integrated Substrate)** and **Desideratum 3 (Non-Catastrophic Cosmic Sum)** are **jointly unsatisfiable** under the common assumption that fundamental micro-experience has *some* non-zero moral weight.
      *   *Reason:* The sheer scale of the fundamental substrate (particles/fields throughout the vast universe, throughout cosmic time) is incomprehensibly larger than the integrated macro-subjects (brains). If each fundamental entity has even a tiny non-zero moral weight (especially if suffering is possible at that level), the cumulative sum will almost inevitably be catastrophic (overwhelming suffering) unless:
          1.  Micro-experience is *exclusively* neutral or positive (highly speculative & contradicts pessimism),
          2.  Moral weight is precisely zero at the fundamental level (contradicting desideratum 1's demand for plausible weight), or
          3.  Moral weight scales *non-linearly* in a way that makes vast quantities of simple experience negligible compared to small quantities of complex experience (a radical solution requiring strong justification and potentially undermining desideratum 2).

  **VI. Key Requirement Excluding Existing Candidates:**
  *   **The Single Most Excluding Requirement:** **Desideratum 2 (The Boundary Problem / Aggregation Gap)** does the most work in eliminating existing candidates. It forces the theory to bridge the gap between micro-experience and the moral weight of macro-subjects in a non-arbitrary way consistent with science and intuition.
      *   **Score of Existing Views:**
          *   **Complexity-Scaling:** Fails Desideratum 2. Lacks a principled, non-arbitrary definition of "complexity" relevant to *moral weight* (beyond correlating with macro-subjects). Why should complexity *per se* confer moral weight, and how does it emerge from micro-complexity? Scores poorly on 1 (likely assigns trivial weight) and 2 (no clear mechanism).
          *   **Integration-Restricted (e.g., IIT-based):** Fails Desideratum 1 & 2. Denies moral weight to the non-integrated substrate (fails 1). Struggles with 2 because while it defines a clear threshold (Φ > 0), the *moral significance* of that threshold remains unexplained ("magic Φ"). Why does integrated information *necessarily* imply morally relevant experience? Also struggles with the vastness implied by 3 if integration is rare.
          *   **Suffering Background:** Fails Desideratum 3 & 5 catastrophically. Assumes micro-experience is inherently suffering (violates 5 by conflating experience with suffering) and leads directly to a catastrophic cosmic sum (violates 3). Ignores valence distinctions at the micro-level and lacks evidence. May conflict with 8 (NCCs suggest suffering arises from specific complex neural processes).
          *   **Radical Devaluation of Micro-Experience:** Fails Desideratum 1. Effectively denies panpsychism's core ethical implication by assigning zero or negligible moral weight to the fundamental experiential substrate, making it ethically inert. Appears ad hoc to avoid catastrophe (3) but violates the spirit of universality (1).

  This spec provides a rigorous framework for evaluating panpsychist ethical theories, highlighting the core challenges (especially the Boundary Problem and the tension between Universality and Non-Catastrophe) and the non-negotiable scientific constraints. Any viable theory must navigate these treacherous waters with exceptional clarity and justification.
