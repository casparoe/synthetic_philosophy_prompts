answer: |-
  Below is a decision-tree handout designed for your reading group. It starts from the core question of whether one event or variable made a difference to another and branches through concrete diagnostic cases (preemption, masking, overdetermination, omissions, probabilistic causes, variable vs. token level, and intervention feasibility). Each branch node is a self-contained question that doesn't require prior knowledge of philosophical positions. The tree has **8 branch nodes** and **8 leaf positions**, with notes on unoccupied combinations and indistinguishable leaves. The level is graduate-seminar, focused on diagnostic distinctions.

  ---

  ### **Decision Tree: What Theory of Causation Fits Your View?**  
  *Start: You want to say event/variable A made a difference to event/variable B.*

  ---

  #### **Branch 1: Are you analyzing a specific occurrence (e.g., "the spark caused *this* forest fire") or a general relationship (e.g., "sparks cause forest fires")?**
  - **Token (specific occurrence)** → Go to Branch 2.  
  - **Type (general relationship)** → Go to Branch 5.  

  ---

  #### **Branch 2 (Token): Must A’s absence imply B’s absence? (i.e., if A hadn’t happened, B wouldn’t have happened)**
  - **Yes** → Go to Branch 3.  
  - **No** → Go to Branch 4.  

  ---

  #### **Branch 3 (Token, counterfactual dependence required): In preemption (e.g., A causes B, but if A failed, backup C would have caused B), is A still a cause?**
  - **Yes** → **Leaf: Lewis-Style Counterfactual**  
    *Position:* A causes B if there’s a chain of counterfactual dependencies (A→D→B), even if direct dependence fails. Preemption is handled via intermediate steps. Rejects simple "if not A, then not B" as sufficient.  
  - **No** → **Leaf: Simple Counterfactual Dependence**  
    *Position:* A causes B only if B counterfactually depends directly on A (if not A, then not B). Preemption is denied as true causation. Rare due to preemption cases.  

  ---

  #### **Branch 4 (Token, no counterfactual dependence required): Can A cause B via an absence (e.g., "lack of rain caused this crop failure")?**
  - **Yes** → Go to Branch 7.  
  - **No** → Go to Branch 8.  

  ---

  #### **Branch 5 (Type): Is causation defined by what happens under interventions (e.g., "if we force A to change, does B change?")?**
  - **Yes** → Go to Branch 6.  
  - **No** → **Leaf: Probabilistic Causation**  
    *Position:* A causes B if A raises the probability of B (e.g., smoking causes cancer by increasing its likelihood). Handles indeterminism but struggles with masking (e.g., a gene that masks smoking’s effect).  

  ---

  #### **Branch 6 (Type, interventionist): Must interventions be physically possible (e.g., obeying laws of nature), or just conceivable?**
  - **Physically possible** → **Leaf: Interventionism**  
    *Position:* A causes B if feasible interventions on A change B (e.g., Woodward’s theory). Replaces "if not A" with "if we change A." Requires interventions to be testable.  
  - **Logically/conceivably possible** → **Leaf: Broad Interventionism**  
    *Position:* A causes B if *any* conceivable intervention on A changes B, even if physically impossible. Blurs into counterfactual theories.  

  ---

  #### **Branch 7 (Token, omissions allowed): In overdetermination (e.g., two fires simultaneously destroy a cabin; either alone would suffice), are both A and C causes?**
  - **Yes** → **Leaf: Difference-Making**  
    *Position:* A causes B if A made an actual difference in the outcome, even with omissions or overdetermination. Rejects physical or counterfactual necessity.  
  - **No** → **Leaf: Process Theory**  
    *Position:* A causes B only if a physical process (e.g., energy transfer) connects A to B. Rejects omissions, overdetermination, and absences as causes.  

  ---

  #### **Branch 8 (Token, no omissions): In masking (e.g., A is poised to cause B, but a blocker prevents it), can A still be a cause?**
  - **Yes** → *This combination is unoccupied.*  
    *Why?* If you reject both counterfactual dependence and omissions, yet accept masked causes, no major theory fits. Masking requires counterfactuals or physical processes.  
  - **No** → **Leaf: Process Theory** (as above)  

  ---

  ### **Notes on the Tree**  
  1. **Unoccupied Combinations:**  
     - **Token-level, no counterfactual dependence, no omissions, but yes to masking**: No theory occupies this. Masking is typically handled by counterfactuals (if blocker were absent, A would cause B) or processes (blocker physically interrupts), but rejecting these leaves no basis for causation here.  
     - **Token-level, no counterfactual dependence, no omissions, no masking → Process Theory**: Covered.  

  2. **Indistinguishable Leaves (Tree Can’t Separate):**  
     - **Lewis-Style Counterfactual vs. Broad Interventionism**: Both use similar counterfactual reasoning. Lewis focuses on token-events with chains; Broad Interventionism uses type-variables with conceivable interventions. In practice, they often converge, but differ in level (token vs. type).  
     - **Difference-Making vs. Probabilistic Causation**: Both emphasize "raising probabilities" or "actual impact," but Difference-Making is token-level (e.g., "this absence mattered"), while Probabilistic is type-level (e.g., "smoking raises cancer risk").  

  3. **Diagnostic Strengths/Weaknesses:**  
     - **Preemption**: Sorts counterfactual theories (Lewis handles it; Simple Counterfactual denies it).  
     - **Omissions**: Distinguishes Process Theory (rejects) from others (accepts).  
     - **Intervention Feasibility**: Splits interventionist theories (physical vs. conceivable).  
     - **Overdetermination**: Tests if causes must be necessary (Difference-Making accepts overdetermination; others vary).  

  ---

  ### **Summary of Leaf Positions**  
  1. **Lewis-Style Counterfactual**: Token-level, handles preemption with chains.  
  2. **Simple Counterfactual Dependence**: Token-level, rejects preemption.  
  3. **Interventionism**: Type-level, requires physically possible interventions.  
  4. **Broad Interventionism**: Type-level, allows conceivable interventions.  
  5. **Probabilistic Causation**: Type-level, probabilistic relationships.  
  6. **Difference-Making**: Token-level, accepts omissions/overdetermination.  
  7. **Process Theory**: Token-level, requires physical connections; rejects omissions/masking.  
  8. **Regularity Theory**: *Omitted* – Humean regularity (A always followed by B) is covered under **Probabilistic** (if deterministic) or not featured due to probabilistic/overdetermination challenges.  

  This tree helps map intuitions to positions using real cases. For deeper discussion, apply cases like "Billy and Suzy throw rocks; Billy’s hits first (preemption)" or "untested gene masks a drug’s effect (masking)."
