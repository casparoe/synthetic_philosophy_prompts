  For the extinction scenario, I'll create a species on the brink. Let's use the Ivory-billed Woodpecker. Start with the epistemicist arguing it's either extinct or not, but we don't know. Supervaluationist counters that without evidence, we can't say it's extinct because there might be admissible scenarios where it exists.

  Higher-order vagueness: Epistemicist points out that supervaluationism just shifts vagueness to "admissible precisification." Supervaluationist responds that it's a different kind of vagueness, handled by repeated supervaluations.

