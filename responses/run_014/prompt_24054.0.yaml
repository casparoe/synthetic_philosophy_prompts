prompt: |-
  Im been trying to figure out what I actually think about believing what people tell me, and I keep running into this debate between two camps: people who say that when I believe something on someone's word, the justification has to come from something other than their saying it — their track record, their incentives, my background beliefs about people in that situation — so testimony is never a basic source; and people who say that being told something is itself a source of justification, defeasible but not reducible to anything else. I can't tell which side I'm on. Here are my gut verdicts on some cases:

  - A stranger on the street says it's 3:15. I believe it, even though I have zero evidence about that person.
  - The same kind of stranger says their neighbor's dog bit someone last Tuesday. I dont really believe it.
  - My friend tells me what Dave said about me at the party. I believe it, even though I can't check it and they have no reason to lie to me.
  - My friend says "I think Dave is jealous of you." I'm much less convinced than I am about the report of what he actually said.
  - A celebrity says a certain vaccine causes a certain disease. I don't believe it. A doctor says my scan shows a tumor. I believe that.
  - My 5-year-old says the dog is under the bed. Believe. My 5-year-old says the dog is sad. Less convinced.
  - A whistleblower leaks a memo from their company and I read the memo itself: I believe it. A news article the next day reporting on the memo: I'm more skeptical.
  - A history book written 500 years after the events it describes: I believe it, but with a big shrug that a recent news report doesn't get.

  My tentative principle is "I trust people who seem sincere and have no reason to lie," but I already know that fails the stranger/time case, since I have no idea whether the stranger is sincere. So: is there a single principle, or a small set of candidates, that captures all of these, stated precisely enough that I could apply it to a case I haven't listed — say, a stranger telling me something I can't check, but which, if true, would be very bad for me? Be honest about which of my verdicts the principle can't accommodate. And does the principle that comes out put me on the "ground it in other evidence" side or the "testimony is its own source" side, or is it a hybrid that smuggles one in through the back door?
reasoning: |-
  Okay, the user is grappling with the epistemology of testimony—how we justify beliefs based on what others tell us. They've presented several intuitive judgments about different scenarios, trying to discern whether testimony is a fundamental source of justification or reducible to other factors like evidence or reliability. 

  First, I notice their examples reveal a pattern: trust seems tied to perceived competence and context. The stranger's time-telling is trusted because time-telling is low-stakes and easily verifiable (people rarely lie about it), while the neighbor's dog-bite story feels higher-stakes and unverifiable. This suggests their intuition weighs the cost of error and availability of counter-evidence. 

  Their proposed principle ("trust sincere people without reason to lie") fails for the stranger case because sincerity can't be assessed—yet they still believe the time. This exposes a gap: sometimes we default to trust absent red flags, especially for trivial claims. 

  For a unified principle, I'm considering a two-tier framework: 
  (1) **Baseline trust** in testimony unless defeaters exist (red flags like bias, inconsistency, or high stakes).  
  (2) **Calibration** by competence (e.g., doctor > celebrity on medical facts) and claim-type (empirical reports vs. interpretations). 

  This hybridizes reductionism and anti-reductionism: baseline trust treats testimony as fundamental, but calibration leans on background evidence. The "stranger with bad news" case would likely trigger high scrutiny—skepticism aligns with risk-aversion, not inconsistency. 

  Their verdicts mostly fit, except the 500-year-old history book: they accept it but with "a big shrug," implying reliance on institutional credibility (historians' methods) despite temporal distance. That's reducible to background evidence about historical scholarship, so it doesn't break the model.  

  Ultimately, they're leaning toward anti-reductionism with pragmatic filters—a position closer to Jennifer Lackey's "dualism" than pure reductionism or Reid-style fundamentalism. The unresolved tension is whether calibration *undermines* testimony's basicality. I should note that many epistemologists now view this as a false dichotomy.
answer: |-
  Based on your case verdicts and the core philosophical tension, here's a precise principle that captures your intuitions, grounded in **justification-calibrated anti-reductionism**—a hybrid position leaning toward testimony as a *defeasible basic source*, but calibrated by context-sensitive factors:

  ### The Principle of Contextual Testimonial Justification (CTJ)
  > **Hearing an assertion P from a speaker S provides immediate, defeasible justification to believe P, unless:**  
  > **(a)** The claim type is inherently high-stakes, speculative, or interpretive (e.g., mental states, complex causation, distant historical claims), **OR**  
  > **(b)** Contextual factors indicate elevated risk of error or deception (e.g., S's incompetence, conflict of interest, or high personal/cultural stakes for P's truth/falsity).  
  > **The strength of justification scales inversely with (a) and (b).**

  ---

  ### How CTJ Explains Your Verdicts
  1. **Stranger says it's 3:15:**  
     - ✅ *No (a):* Telling time is low-interpretation, empirical fact.  
     - ✅ *No (b):* Trivial stakes; no deception incentive.  
     → **Justified belief** (testimony as basic source).

  2. **Stranger says neighbor's dog bit someone:**  
     - ⚠️ *Moderate (a):* Unverifiable event involving blame/liability (higher interpretation stakes).  
     - ⚠️ *Moderate (b):* Potential bias (e.g., grudge against neighbor).  
     → **Weak justification → Skepticism** (contextual defeaters).

  3. **Friend reports Dave's exact words:**  
     - ✅ *No (a):* Direct quotation is empirical (if friend was present).  
     - ✅ *No (b):* No incentive to lie; friend competent for recall.  
     → **Justified belief** (testimony basic).

  4. **Friend says "Dave is jealous":**  
     - ❗**Strong (a):* Interpretation of mental state (highly speculative).  
     - ✅ *No (b):* No deception incentive.  
     → **Weak justification → Skepticism** (claim-type defeater).

  5. **Celebrity vs. doctor on medical claims:**  
     - *Celebrity:* ❗**Strong (b):* Incompetence on medical topics.  
     - *Doctor:* ✅ *No (b):* Competence + role-based integrity.  
     → **Skepticism vs. justified belief** (competence as calibrator).

  6. **5-year-old on dog's location vs. sadness:**  
     - *Location:* ✅ *No (a):* Observable fact. Mild (b): Child generally reliable on visible things.  
     - *Sadness:* ❗**Strong (a):* Subjective mental state attribution.  
     → **Belief vs. skepticism** (claim-type difference).

  7. **Whistleblower's memo vs. news report:**  
     - *Memo:* ✅ Direct evidence (bypasses testimony).  
     - *News report:* ⚠️ *Moderate (b):* Institutional biases, simplification, secondary sourcing.  
     → **Stronger belief in memo** (testimony weakened by mediation).

  8. **500-year-old history book:**  
     - ❗**Strong (a):* Temporal distance → interpretation/loss of evidence.  
     - ⚠️ *Moderate (b):* Cultural/political biases accumulate over time.  
     → **Belief with low confidence** (claim-type + contextual risk).

  ---

  ### What CTJ *Doesn't* Fully Capture
  - **The stranger/time case success:** CTJ works here because absence of (a)/(b) enables basic testimony.  
  - **Your "trust if sincere/no reason to lie" failure:** CTJ replaces sincerity with *contextual risk assessment*. Sincerity is hard to gauge (e.g., the stranger), but trivial stakes + low deception risk suffice.  

  **One tension:** Your "shrug" for ancient history implies *reductionism* (relying on institutional credibility as evidence). CTJ accommodates this by treating scholarly norms as reducing (b), but it still classes historical claims under (a). This is a **soft hybrid**—testimony is basic, but heavily modulated by reducible factors.

  ---

  ### Applying CTJ to Your Unlisted Case  
  **"A stranger tells me something I can't check, which, if true, would be very bad for me."**  
  - ❗**Strong (a):** Unverifiable + high-stakes → weak baseline justification.  
  - ❗**Strong (b):** High stakes → elevated deception/error risk (e.g., scam, panic-inducing lie).  
  → **CTJ verdict: Skepticism is justified.**  
  *This aligns with intuition: We distrust unverified bad news from strangers (e.g., "Your family was in an accident! Send money!").*

  ---

  ### Philosophical Positioning  
  Your principle places you in the **"hybrid" camp**, but closer to **anti-reductionism**:  
  - Testimony provides *immediate justification* (anti-reductionist core).  
  - Justification strength is *calibrated* by reducible factors: competence, stakes, claim-type (reductionist elements).  
  - **No smuggling:** Reducible factors are *defeaters*, not the justificatory basis. When absent, testimony stands alone.  

  **Why not pure reductionism?** Your stranger/time case rejects it—you require no prior evidence about the speaker.  
  **Why not pure anti-reductionism?** Your skepticism in high-interpretation/high-stakes cases demands contextual modulation.  

  This mirrors epistemologists like **Jennifer Lackey** ("dual justification in testimony") or **Elizabeth Fricker** ("contextual reductionism")—acknowledging testimony's distinctive role while accepting that trust is rationally sensitive to evidence.
