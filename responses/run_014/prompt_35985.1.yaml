  First, I need to understand the key points. It's not just experience; it's reliable knowledge that can be wrong, corrected, and generalized. They compare it to a pianist's fingerings, which might be procedural memory, but they think it's different. The user is looking for a specific concept that fits their description.

  I recall terms like intuition, tacit knowledge, and implicit learning. Intuition is too vague. Tacit knowledge (Polanyi) seems close—knowing more than we can tell. But is that too broad? They want something more precise. Implicit learning is about acquiring knowledge without awareness, which fits the learning process. Then there's System 1 thinking from Kahneman's dual-process theory—fast, automatic thinking. That could explain the immediacy.

  Also, Gestalt perception in radiology is mentioned in literature. Radiologists develop a holistic sense of what's normal. That might be part of it. Pattern recognition and chunking are related concepts where experts perceive complex patterns as a whole. 

  The user mentioned that constructed rules don't capture their actual process. That's important. Explicit rules are approximations, not the real mechanism. This aligns with the idea that expertise relies on implicit systems. 

  I should check if there's a specific term combining these. Neurobiology? Right hemisphere pattern recognition? But that's speculative. The closest might be the integration of implicit learning and System 1. 

  Also, considering the pianist example: fingerings are procedural memory, which is different. The radiologist's skill is perceptual and cognitive, not motor. So distinguishing that is key. 

