prompt: |-
  I'm a PhD student in political philosophy, and my dissertation keeps circling the separateness of persons objection without ever landing on it. My advisor's line is that the objection is a family of complaints wearing one coat, and that most responses in the literature answer only one member of the family. I half believe her, but I also can't find anywhere that just lays out what the family members are. So before I read yet another paper I want the spec first: what does any adequate theory of moral aggregation have to deliver in order to count as respecting the separateness of persons? For my purposes the theory needs to be good enough for institutional choice -- how a state may trade off harms and benefits across its citizens -- not necessarily for private ethics, though say so if you think that restriction is doing suspicious work.

  Some of the cases I'd want on the list, though I'm sure I'm missing some: why I can accept a headache now to avoid my own agony later but can't impose your headache to relieve my agony (the intra- vs interpersonal tradeoff asymmetry); one person's torture versus tiny benefits spread over millions (transplant-adjacent but the budget version: a public health program that foreseeably kills a few to spare many small burdens); the utility monster; the fact that we're allowed to favor our kids over strangers, which pure aggregation seems to deny; whether aggregation is fine among strangers but not when a single person's life gets used up, or whether that's just a threshold effect and not a difference in kind; and whether there's any real distinction left between separateness of persons and the separateness of agents that anyone has to respect (states aggregate the choices of citizens all the time and nobody objects on these grounds). For each requirement I want the case or consideration that motivates it, and I want you to mark which are genuinely non-negotiable and which are just preferences of the anti-aggregation camp dressed up as constraints -- I suspect "no aggregation ever" and "aggregation is fine but not across life prospects" get conflated constantly.

  The part I most want to see: which pairs of requirements, if any, can't be jointly satisfied, because if the list itself is unsatisfiable that's actually my thesis chapter and not a problem. And which single requirement knocks out the most candidates -- my bet is it's something about interpersonal compensation, the idea that gains to one person can't count as compensating losses to another, and that it kills not just utilitarianism but prioritarianism too, which is awkward for people who present prioritarianism as the separateness-respecting reform of utilitarianism. At the end, briefly, score utilitarianism with diminishing marginal utility, prioritarianism, Rawlsian maximin, and Scanlon-style contractualism against your own list -- but keep that part short, the scoring is the least interesting bit and I can do it myself; the criteria are where the thinking is. A table is fine if it helps.
reasoning: |-
  Okay, let's break down this user's query. They're a PhD student in political philosophy struggling with the separateness of persons objection in their dissertation. Their advisor says it's a family of complaints, but the user can't find a clear breakdown of what those are. They need a specification of what any moral aggregation theory must deliver to respect separateness, especially for institutional choices like state policies.

  First, I need to recall the core issues around separateness of persons. Nozick's objection to utilitarianism is key here—rights as side constraints rather than part of a social good calculation. But the user’s advisor is right; it’s not one thing. The user listed cases: intra vs. interpersonal trade-offs, torture vs. tiny benefits, utility monsters, partiality to family, thresholds in aggregation, and state vs. individual agency. Each case points to different aspects of separateness.

  The user wants to know which requirements are non-negotiable and which might be anti-aggregationist preferences. They suspect that compensation—gains not offsetting losses—is a critical point that even rules out prioritarianism. They also want to see conflicting requirements and which single criterion eliminates most theories.

  Breaking down the requirements: Start with interpersonal compensation. If a loss to A can't be justified by a gain to B, that's fundamental. Then, non-substitutability—persons aren't replaceable. Aggregation limits when individual stakes are high, like survival. Personal prerogative allowing partiality. Distribution sensitivity, not just total utility. Consent and agency, especially for states acting on behalf of citizens. The threshold effect might be where aggregation is acceptable until vital interests are at stake.

  Now, conflicts: Personal prerogative (favoring your kids) clashes with distribution sensitivity in large-scale trade-offs. Consent in institutions is tricky—states aggregate citizen preferences, but that might not cover harming minorities. Non-substitutability and compensation together might challenge any aggregation, but thresholds could resolve this.

  The user’s bet is that interpersonal compensation is the killer. Utilitarianism and prioritarianism both fail here because they allow compensating losses across persons. Maximin avoids this but falls short on other points. Contractualism handles compensation and non-substitutability but struggles with large numbers and thresholds.

  Deep needs: The user might be looking for a structured framework to organize their dissertation. They need clarity on the components of separateness to evaluate theories systematically. They might also want to show that some requirements are incompatible, making the objection itself problematic. Identifying interpersonal compensation as central could strengthen their thesis, especially if prioritarianism is exposed as not separateness-respecting.

  Scoring theories briefly: Utilitarianism fails compensation, non-substitutability. Prioritarianism similar but worse on partiality. Maximin handles compensation but ignores small stakes. Contractualism strong on key points but may have scale issues. This helps the user see where each theory stands without getting bogged down.

  In summary, the user needs a clear taxonomy of separateness requirements, conflicts between them, and which requirements are fundamental versus debatable. Highlighting interpersonal compensation as a major hurdle aligns with their thesis direction. Ensuring the analysis focuses on institutional contexts is crucial, as state actions involve collective agency and representation, adding layers to consent and justification.
answer: |-
  Here’s a specification of requirements for any institutional aggregation theory to respect the separateness of persons (SoP), structured by core complaints, with motivations, non-negotiability markers, conflicts, and key eliminators. I’ve distilled the "family" into 6 core requirements, separating genuine constraints from contested preferences.

  ### The Requirements (and What Motivates Them)
  | **Requirement** | **Motivating Case/Consideration** | **Non-Negotiable?** | **Anti-Aggregation Preference?** |
  |----------------|----------------------------------|---------------------|----------------------------------|
  | **1. Interpersonal Compensation (IC)** | Can't impose a headache on you to relieve my agony (intra- vs. interpersonal asymmetry). Gains to B don't morally "cancel out" losses to A. | **YES** (Core to SoP) | No – foundational to the objection. |
  | **2. Non-Substitutability (NS)** | Transplant case (killing one to save five). Persons aren't fungible resources; one life cannot be traded as a means for others' benefit. | **YES** (Core to SoP) | No – tied to personhood/rights. |
  | **3. Aggregation Limits Under High Individual Stakes (AHL)** | "Torture vs. Dust Specks" (can't torture one to save millions from minor itches). Aggregation fails when one individual faces catastrophic loss. | **Strong Presumption** (≈Non-Neg) | Partially – the *threshold* is contested, but the *asymmetry* is core. |
  | **4. Personal Prerogative (PP)** | Favoring your child over a stranger. Institutions may need impartiality, but SoP demands *space* for non-harmful partiality in personal life. | **NO** (For *institutional* theory) | **YES** – Crucial for private ethics, but institutional role is distinct. |
  | **5. Distribution Sensitivity (DS)** | Utility Monster (massive gains to one outweighing many small losses). Aggregated totals aren't sufficient; *how* benefits/burdens are distributed matters. | **Contested** | Partially – Anti-aggregationists insist; utilitarians deny it's SoP-specific. |
  | **6. Consent/Agent-Integrity (CAI)** | State using citizen A as resource for B's gain (vs. state aggregating *choices*). Institutions act *for* individuals; using them without possible endorsement violates agency. | **YES** (For institutional legitimacy) | No – Links SoP to democratic justification. |

  ### Key Conflicts Between Requirements
  1.  **PP vs. DS/IC (in large-N cases):** Allowing robust partiality (PP) might conflict with distributional fairness (DS) or IC when scaled up (e.g., nepotism in resource allocation). *Institutional focus partially sidesteps this.*
  2.  **AHL vs. Practicality:** Defining the high-stakes threshold (AHL) is inherently vague. Strict thresholds risk paralysis (no small harms ever aggregated, even for huge gains elsewhere?).
  3.  **NS/IC vs. Any Large-Scale Aggregation:** If NS and IC are absolute, *any* policy imposing net losses on some for others' gain seems impermissible. This is **the core tension**. Solutions require either thresholds (AHL) or justificatory structures bypassing direct compensation (CAI).

  ### The Eliminator: Interpersonal Compensation (IC)
  Your bet is correct. **IC is the primary eliminator.** It directly invalidates:
  *   **Classic Utilitarianism:** Explicitly allows trading losses for gains across persons.
  *   **Prioritarianism:** Weighting benefits to the worse off still *compensates* A's loss with B's gain (even if B is worse off). It respects *equality* concerns better, but **not core SoP** about cross-person compensation. (This is the awkward truth).
  *   Most forms of **Cost-Benefit Analysis:** Rests on interpersonal compensation.
  **IC + NS together** eliminate virtually all simple summing models. Only theories with strong agent-relative constraints, thresholds, or non-aggregative justifications survive.

  ### Brief Theory Scoring (Against Core Non-Negotiables: IC, NS, CAI; AHL/DS as important)
  | **Theory** | **IC** | **NS** | **AHL** | **DS** | **CAI** | **Verdict** |
  |------------|--------|--------|---------|--------|---------|-------------|
  | **Utilitarianism (w/ DMU)** | ❌ (Direct trade-offs) | ❌ (Persons are vessels) | ❌ (No threshold) | ⚠️ (DMU helps equality, not DS per se) | ❌ (Outcomes trump consent) | Fails Core SoP |
  | **Prioritarianism** | ❌ (Still trades losses/gains) | ❌ (Same as Util) | ❌ (No threshold) | ✅ (Built-in) | ❌ | Fails Core SoP (IC/NS) |
  | **Rawlsian Maximin** | ✅ (No justifying losses to worst-off) | ✅ (Rights constrain) | ✅ (Protects worst-off) | ✅ (Focuses on distribution) | ⚠️ (Hypothetical consent) | **Strong on SoP Core** (Weak on small-stakes aggregation) |
  | **Scanlonian Contractualism** | ✅ (No justification A can't reasonably reject) | ✅ (Implied by rejection rights) | ✅ (Catastrophic loss = veto) | ✅ (Rejectability sensitive) | ✅ (Justification to each) | **Strongest on SoP Core** (Scale/Imprecision challenges) |

  ### Why Your Suspicion is Spot On
  1.  **"No Aggregation Ever" vs. "No Aggregation Over Vital Interests":** Conflated constantly. SoP (via IC/NS) primarily objects to *using persons as means*, not aggregation *per se*. AHL specifies *when* interests are vital. Many anti-aggregationists push towards the former; viable institutional theories need the latter.
  2.  **Prioritarianism's Misrepresentation:** It *is* often sold as "SoP-respecting." Your analysis (and this framework) shows this is largely false regarding IC/NS. It addresses *different* concerns (inequality).
  3.  **The State/Agency Distinction:** Crucial. States aggregating *choices* (voting) respects CAI. States aggregating *welfare* by imposing losses violates IC/NS unless justified *to* those bearing costs (linking back to CAI). This is where institutional theory *must* focus.

  ### The Takeaway for Your Chapter
  The "family" is united by rejecting **interpersonal compensation as moral justification** (IC) and **person fungibility** (NS). Other requirements (AHL, CAI) specify *how* IC/NS constrain action, while PP is largely external (for private life). **The central thesis is viable:** Most aggregation theories fail IC/NS. Surviving theories (Maximin, Contractualism) either impose near-absolute constraints (problematic for policy) or rely on complex justificatory structures (CAI) that may not yield determinate answers. **The unsatisfiability lies here:** Strict IC/NS forbid standard aggregation *precisely where institutions need it most* (distributing inevitable burdens). Resolutions require either weakening IC/NS (risking SoP) or embracing justification-via-consent (CAI), which is messy but essential for institutions. Your contribution is rigorously separating these strands and showing why IC is the linchpin.
