prompt: |-
  I'm a quantitative risk analyst at a mid-size firm, and I maintain a standing set of probability forecasts — the chance that a given project will be delayed, that a supplier will default, that a regulatory change will take effect by a set date — and I know in advance exactly which scheduled pieces of evidence will arrive and when: a monthly loss report, the result of a quarterly stress test, the next earnings release, a court ruling on a known docket date. Before each of those scheduled evidence events I want to check that my current forecasts are coherent with what I expect to believe once the evidence lands, using the diachronic constraint on credences that van Fraassen calls the reflection principle.

  Please turn that principle into a decision procedure my team can actually run in the thirty minutes before a weekly forecast review: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops and flags a reflection violation rather than spitting out a number, and where it hands the decision to a person because the question is one of judgment rather than arithmetic. It has to say explicitly what to do when I can't get a precise number for one of the future credences, and it has to be honest about which steps are judgment calls dressed up as procedure and which are genuine checks. Any forecast the procedure changes has to be signed off by the head of the risk team, so mark clearly which outputs are automatic and which require that sign-off.

  Then run the procedure on two concrete forecasts. First, my current 30% forecast that a project will be delayed, where I am certain that if the scheduled stress test comes back clean I will move to 10% and if it comes back dirty I will move to 60%, and where I currently put a 70% chance on the clean outcome — show the full arithmetic and the decision. Second, a forecast about a project I personally champion, where I have a strong incentive to keep the success probability high and where the scheduled evidence is ambiguous enough that I am not actually sure what I will believe after seeing it — I want this one to end in an answer I will not like, and I want the procedure to show me exactly why it is entitled to that answer.

  Finally, say plainly what this procedure cannot do: the cases where reflection is silent, where its preconditions fail, or where following it would be a mistake.

  Respond in the style of an expert in Bayesian epistemology who also has to be useful to a practitioner, not a philosophy seminar. Think very carefully before answering; the value of this is in the translation — keeping what the principle actually says while making it runnable by someone who has never read it.
reasoning: |-
  We are implementing the reflection principle as a decision procedure. The principle states that your current credence in an event A, P(A), should be equal to your expectation of your future credence in A after seeing evidence E. That is:

      P(A) = ∑_{e} P(e) * P(A | e)

  But note: in the reflection principle, the "P(A | e)" is actually your current expectation of what your future credence in A will be upon learning e. We denote the future credence upon learning e as P_future(A | e). Then the principle is:

      P_current(A) = ∑_{e} P_current(e) * P_future(A|e)

  However, note that in the standard setup, the evidence e is such that when you learn it, you update to P_future(A|e). The principle requires that you currently expect your future credences to be coherent and to be the result of conditionalizing on the evidence.

  The procedure:

  We have:
  - A: the event we are forecasting (e.g., project delay, supplier default, etc.)
  - A set of possible evidence outcomes E1, E2, ... En that are mutually exclusive and exhaustive, which we will observe at a scheduled time.

  Steps:

  1. For the event A, identify the possible evidence outcomes that are about to be observed (say, at the next scheduled evidence event). Let these outcomes be {E1, E2, ..., En}. We require that these are mutually exclusive and exhaustive.

  2. For each evidence outcome Ei, ask: "If I were to observe Ei, what would be my updated forecast for A?" This is P_future(A | Ei). Note that this is a judgment call. The procedure cannot compute this; it must be provided by the forecaster. If the forecaster cannot provide a number, then we must handle that (see step 3).

  3. If for any Ei, the forecaster cannot provide a precise number for P_future(A | Ei), then we must ask for a range or an interval. If the forecaster can provide an interval [L_i, U_i] that they are confident contains their future credence, then we proceed with that interval. If they cannot even provide an interval, then the procedure stops and flags that the reflection principle cannot be applied because the future credences are not sufficiently specified.

  4. Ask for the current probabilities for each evidence outcome Ei, i.e., P_current(Ei). These must form a probability distribution (non-negative, sum to 1). If they don't, then the procedure stops and flags an incoherence in the evidence probabilities.

  5. Now, compute the expected future credence:

      Expected = ∑_{i} [ P_current(Ei) * P_future(A | Ei) ]

     But note: if any P_future(A|Ei) is given as an interval, then we compute an interval for Expected. We do this by computing the lower and upper bounds:

      Lower = ∑_{i} P_current(Ei) * L_i
      Upper = ∑_{i} P_current(Ei) * U_i

     Then we compare the current forecast P_current(A) to the interval [Lower, Upper].

     - If P_current(A) is within [Lower, Upper], then there is no violation. The forecast is coherent with reflection and no change is needed.
     - If P_current(A) < Lower, then we flag a violation and the procedure suggests that the current forecast should be increased to at least Lower (or perhaps to the point of the interval closest to the current value? But the principle says they should be equal, so we must adjust). However, note that the interval might be due to imprecision. So we do not automatically set to a number. Instead, we flag for review and require the forecaster to either:
          a) Provide a precise P_future(A|Ei) for the Ei that had intervals, and then recalc to get a precise expected value, or
          b) If they cannot, then we note that the current forecast is below the lower bound of the expected future credence. The procedure then requires that the current forecast be adjusted upward to at least the lower bound (if we are to satisfy reflection). But note: the reflection principle requires equality. Hence, if the current forecast is outside the interval, we have a violation.

     We might then set the new forecast to the midpoint of the interval? But the principle doesn't tell us what to do in the interval case. So we must be cautious.

     Actually, the procedure should:

     - If we have precise numbers and the current forecast does not equal the expected value (within a tolerance, say 1% or 0.5% to account for rounding), then we adjust the current forecast to the expected value. This adjustment is automatic and requires sign-off only because it's a change? But the head of risk must sign off on any change.

     - If we have an interval and the current forecast is below the lower bound, we suggest setting to the lower bound. If above, to the upper bound. But note: this might be too extreme? Alternatively, we might require the forecaster to refine the intervals until they become point estimates? But in practice, we might not have time.

     Given the time constraint (30 minutes), we do:

     - If any future credence is given as an interval and the current forecast is outside the interval of the expected value, we require the forecaster to re-assess and provide a point estimate. If they cannot, then the head of risk must decide on a point estimate for the future credence for that Ei. This is a judgment call.

     Therefore, we design:

     Step 5a: If all future credences are point estimates, then compute the expected value. If |P_current(A) - Expected| > tolerance (e.g., 0.5% absolute difference), then set a flag: violation. The procedure then automatically changes the current forecast to the expected value. This change requires sign-off by the head of risk (because it's a change to the forecast).

     Step 5b: If there are intervals and the current forecast is not within the [Lower, Upper] interval, then we require the forecaster to either provide point estimates or the head of risk to provide point estimates for the problematic Ei. Then we recalc as in 5a. If the head of risk cannot provide a point estimate, then we set the current forecast to the closest bound of the interval (if below, set to lower; if above, set to upper). This change is made and requires sign-off by the head of risk. Additionally, we note that this is a forced adjustment to the reflection principle because of the imprecision.

     Step 5c: If the current forecast is within the interval (when intervals are used), then no change is needed.

  6. The procedure must also note that the head of risk sign-off is required for any change made by the procedure. The output of the procedure is either:
     - "No violation: current forecast is coherent with reflection." (no change, no sign-off needed for change, but the head of risk must note the check passed)
     - "Violation found and corrected: forecast changed from X to Y." (requires sign-off for the change)
     - "Violation found but future credences are imprecise: current forecast adjusted to [bound]." (requires sign-off and also judgment by the head of risk on the adjustment)
     - "Insufficient information: future credences not specified for some evidence outcomes." (procedure stops, no change, but the head of risk must be notified to address the gap)

  7. Where are the judgment calls?
     - Step 2: Assigning P_future(A|Ei) is a judgment call. The procedure only asks for it.
     - Step 4: Assigning P_current(Ei) is a judgment call.
     - Step 5b: If intervals are provided and the current forecast is outside the interval, then the head of risk must make a judgment call to either force a point estimate or accept the bound adjustment.

  Now, run two examples.

  Example 1:
  - Event A: project delay, current forecast P(A) = 30% (0.3)
  - Evidence: stress test, two outcomes: clean (E1) and dirty (E2)
  - P_future(A | E1) = 10% (0.1)
  - P_future(A | E2) = 60% (0.6)
  - P_current(E1) = 70% (0.7), P_current(E2)=30% (0.3)

  Compute expected future credence:
     Expected = 0.7 * 0.1 + 0.3 * 0.6 = 0.07 + 0.18 = 0.25

  Current forecast is 0.3, which is not equal to 0.25. Difference is 0.05 (5%) which is above tolerance (say 0.5%). So violation.

  The procedure changes the current forecast to 0.25 (25%). This change requires sign-off by the head of risk.

  Example 2:
  - Event A: success of a project you personally champion. Current forecast: P(A) = 90% (0.9)
  - Scheduled evidence: a report that could be either "positive", "neutral", or "negative" (E1, E2, E3). 
  - You are not sure what you will believe after seeing the report because the evidence is ambiguous. You provide:
     - If positive: P_future(A|E1) = 95% (0.95)
     - If neutral: you are unsure, so you give an interval: [50%, 70%] (0.5 to 0.7)
     - If negative: you are also unsure, but you think you might lower a lot, so interval [10%, 40%] (0.1 to 0.4)
  - Your current probabilities for the report:
     - P(E1) = 40% (0.4)
     - P(E2) = 50% (0.5)
     - P(E3) = 10% (0.1)

  Compute the expected future credence interval:

  Lower bound = (0.4 * 0.95) + (0.5 * 0.5) + (0.1 * 0.1) = 0.38 + 0.25 + 0.01 = 0.64
  Upper bound = (0.4 * 0.95) + (0.5 * 0.7) + (0.1 * 0.4) = 0.38 + 0.35 + 0.04 = 0.77

  So the expected future credence is between 64% and 77%.

  The current forecast is 90%, which is above the upper bound (77%). Therefore, we have a violation.

  The procedure requires that we either get point estimates for E2 and E3 or have the head of risk make a judgment. Since the forecaster is unsure, we try to get point estimates. If the forecaster cannot provide them, then the head of risk must decide on point estimates for P_future(A|E2) and P_future(A|E3). 

  But note: the head of risk might be aware of the forecaster's incentive to keep the forecast high. The head might then require the forecaster to justify the intervals and then choose a value within the interval. Alternatively, the head might decide to use the midpoint for E2 (60%) and for E3 (25%) and recalc:

  Expected = 0.4*0.95 + 0.5*0.6 + 0.1*0.25 = 0.38 + 0.30 + 0.025 = 0.705 (70.5%)

  Then the current forecast (90%) is still above 70.5%. The procedure would then change the current forecast to 70.5% and require sign-off.

  Alternatively, if the head of risk decides to use the lower bounds (to be conservative, given the incentive issue) then the expected is 64% and the forecast is set to 64%. 

  But the procedure does not specify how the head of risk chooses the point estimate. It only requires that a point estimate is chosen when the intervals lead to a violation. Then we recalc and adjust to the new expected value (which is now a point).

  In the absence of a point estimate from the forecaster and if the head of risk does not want to make a judgment call on the point estimates, we fall back to setting the current forecast to the upper bound of the interval (because the current forecast is above the interval, we set it to the upper bound to be the least disruptive change that brings it into line with the reflection principle). But note: the reflection principle requires equality. Setting to the upper bound does not achieve equality. However, it is a conservative adjustment.

  But given the incentive issue, the head of risk might be more comfortable using the lower bound? Actually, the reflection principle says that the current forecast should equal the expected future forecast. The expected future forecast is in [64%,77%]. The current forecast is 90%, which is too high. The head of risk should choose a value within [64%,77%] to set the current forecast? But note: we don't know the exact expected value. The procedure then says: set to the upper bound? That would be 77%. But 77% is still below 90%. 

  Alternatively, the head of risk might decide that the current forecast is too high and set it to 77% (the upper bound of the expected interval) as a conservative adjustment. This change requires sign-off.

  In any case, the procedure ends by lowering the forecast (which the forecaster will not like) because the current forecast is too high relative to the expected future credence. The reason is the reflection principle: you must currently set your credence to what you expect your future credence to be. Since you expect your future credence to be at most 77%, your current credence should not be 90%.

  What the procedure cannot do:

  1. The reflection principle assumes that you are certain that when you see the evidence, you will update to P_future(A|Ei). If there is uncertainty about how you will update (for example, if you think you might change your mind about the meaning of the evidence after seeing it), then the principle does not apply in the simple form.

  2. The principle does not apply if the evidence is not "in the future" in the sense that it might change your beliefs. If the evidence is already known, then the future credence should be the same as the current.

  3. The procedure requires that the future credences are specified for each possible evidence outcome. If the evidence is continuous or there are too many outcomes, then the procedure becomes impractical.

  4. The reflection principle does not apply if there is a possibility of memory loss, or if you expect to learn other relevant information in between. The principle assumes that the only change in belief comes from learning the scheduled evidence.

  5. The procedure does not help with unscheduled evidence.

  6. The procedure does not address cases where the forecaster is not rational or where there is self-deception. The reflection principle assumes that the forecaster is rational and will update correctly.

  7. The principle might be violated if the forecaster has incentives to misreport their future beliefs. The procedure relies on honest reporting of future credences.

  8. In cases where the evidence might change the forecaster's understanding of the event A (e.g., if A is redefined), then the principle does not apply.

  9. The procedure is not a substitute for proper Bayesian updating when the evidence arrives. It is only a coherence check between current beliefs and anticipated future beliefs.

  10. The procedure cannot be run if the evidence is not mutually exclusive and exhaustive. The forecaster must define the evidence outcomes appropriately.

  Finally, note that the reflection principle is a requirement of rationality. However, there are known counterexamples (e.g., if you expect to forget, or if you expect to become irrational). Therefore, the head of risk must also be aware of the limitations and context.
answer: |-
  ### Reflection Principle Decision Procedure for Forecast Coherence Check

  **Core Principle**: Your current forecast \(P_{\text{now}}(A)\) (probability of event \(A\)) must equal your *expected future forecast* after seeing scheduled evidence \(E\). Formally:  
  \[
  P_{\text{now}}(A) = \sum_{i} P_{\text{now}}(E_i) \times P_{\text{future}}(A \mid E_i)
  \]  
  where \(E_i\) are mutually exclusive/exhaustive evidence outcomes, \(P_{\text{now}}(E_i)\) is your current belief in each outcome, and \(P_{\text{future}}(A \mid E_i)\) is your forecast for \(A\) *if* you see \(E_i\).

  **Procedure** (run in ≤30 min before forecast review):  
  1. **Identify evidence outcomes**  
     - List all possible outcomes of the upcoming scheduled evidence event (e.g., "stress test clean/dirty").  
     - *Check*: Outcomes must be mutually exclusive and exhaustive.  
     - *Stop if violated*: Flag "evidence partition invalid."  

  2. **Elicit future forecasts**  
     - Ask: "If you observe outcome \(E_i\), what will your *new forecast* for \(A\) be?"  
     - *Sufficient answer*: A probability (e.g., 10%) or a range (e.g., [20%, 40%]).  
     - *Judgment call*: Forecaster must honestly project their future beliefs.  
     - *Stop if insufficient*: If any \(P_{\text{future}}(A \mid E_i)\) cannot be answered (even as a range), flag "future forecast undefined for \(E_i\)."  

  3. **Elicit current evidence probabilities**  
     - Ask: "What is your current probability for each \(E_i\)?"  
     - *Check*: Probabilities must sum to 100% and be ≥0.  
     - *Stop if violated*: Flag "evidence probabilities incoherent."  

  4. **Compute expected future forecast**  
     - If all \(P_{\text{future}}(A \mid E_i)\) are point estimates:  
       \[
       \text{Expected} = \sum_{i} \left[ P_{\text{now}}(E_i) \times P_{\text{future}}(A \mid E_i) \right]
       \]  
     - If any \(P_{\text{future}}(A \mid E_i)\) is a range \([L_i, U_i]\):  
       \[
       \text{Lower Bound} = \sum_{i} \left[ P_{\text{now}}(E_i) \times L_i \right], \quad \text{Upper Bound} = \sum_{i} \left[ P_{\text{now}}(E_i) \times U_i \right]
       \]  

  5. **Compare and decide**  
     - **Case A (precise match)**:  
       If \(P_{\text{now}}(A)\) = Expected (within ±0.5% tolerance) → "No violation. No change needed."  
     - **Case B (point estimate mismatch)**:  
       If \(P_{\text{now}}(A)\) ≠ Expected → **Violation**. Automatically adjust forecast to Expected. *Requires head of risk sign-off*.  
     - **Case C (range mismatch)**:  
       - If \(P_{\text{now}}(A)\) outside [Lower Bound, Upper Bound] → **Violation**. Force forecaster to provide point estimates for all ranges (if possible) and recalc (→ Case A or B).  
       - If forecaster *cannot* provide point estimates → Set \(P_{\text{now}}(A)\) to nearest bound (if below Lower Bound, set to Lower Bound; if above Upper Bound, set to Upper Bound). *Requires head of risk sign-off and judgment*.  
     - **Case D (range match)**:  
       If \(P_{\text{now}}(A)\) ∈ [Lower Bound, Upper Bound] → "No violation. No change needed."  

  **Output Key**:  
  - Automatic change: Only in Case B (exact arithmetic adjustment).  
  - Sign-off required: All forecast changes (Cases B and C).  
  - Judgment calls: Steps 2 and 3 (forecaster honesty), and Case C (handling ranges).  
  - Genuine checks: Steps 1, 3 (coherence), and 5 (arithmetic violation).  

  ---

  ### Concrete Examples  
  **Example 1: Project Delay Forecast**  
  - Current forecast (\(P_{\text{now}}(A)\)): 30% chance of delay.  
  - Evidence (\(E_i\)): Quarterly stress test (clean or dirty).  
  - Future forecasts:  
    - If clean (\(E_1\)): \(P_{\text{future}}(A \mid E_1) = 10\%\)  
    - If dirty (\(E_2\)): \(P_{\text{future}}(A \mid E_2) = 60\%\)  
  - Current evidence probabilities:  
    - \(P_{\text{now}}(E_1) = 70\%\) (clean), \(P_{\text{now}}(E_2) = 30\%\) (dirty).  

  **Procedure**:  
  1. Evidence outcomes {clean, dirty} are mutually exclusive/exhaustive → Pass.  
  2. Future forecasts are point estimates (10%, 60%) → Pass.  
  3. Evidence probabilities sum to 100% → Pass.  
  4. Compute expected future forecast:  
     \[
     \text{Expected} = (0.70 \times 0.10) + (0.30 \times 0.60) = 0.07 + 0.18 = 0.25 \quad (25\%)  
     \]  
  5. Compare: Current forecast = 30% ≠ 25% → **Violation (Case B)**.  
     **Decision**: Automatically adjust forecast to 25%. *Requires head of risk sign-off*.  

  **Example 2: Personally Championed Project**  
  - Current forecast (\(P_{\text{now}}(A)\)): 90% chance of success.  
  - Evidence (\(E_i\)): Ambiguous report (positive, neutral, negative).  
  - Future forecasts:  
    - If positive: \(P_{\text{future}}(A \mid E_1) = 95\%\)  
    - If neutral: Unsure → Range \([50\%, 70\%]\)  
    - If negative: Unsure → Range \([10\%, 40\%]\)  
  - Current evidence probabilities:  
    - \(P_{\text{now}}(E_1) = 40\%\) (positive), \(P_{\text{now}}(E_2) = 50\%\) (neutral), \(P_{\text{now}}(E_3) = 10\%\) (negative).  

  **Procedure**:  
  1. Evidence outcomes are mutually exclusive/exhaustive → Pass.  
  2. Future forecasts include ranges → Proceed to range calculation.  
  3. Evidence probabilities sum to 100% → Pass.  
  4. Compute bounds for expected future forecast:  
     \[
     \begin{align*}
     \text{Lower Bound} &= (0.40 \times 0.95) + (0.50 \times 0.50) + (0.10 \times 0.10) = 0.38 + 0.25 + 0.01 = 0.64 \quad (64\%) \\
     \text{Upper Bound} &= (0.40 \times 0.95) + (0.50 \times 0.70) + (0.10 \times 0.40) = 0.38 + 0.35 + 0.04 = 0.77 \quad (77\%) \\
     \end{align*}
     \]  
  5. Compare: Current forecast = 90% > Upper Bound (77%) → **Violation (Case C)**.  
     - Force forecaster to provide point estimates for neutral/negative outcomes.  
     - *Forecaster cannot* (due to ambiguity/incentive).  
     **Decision**: Current forecast (90%) exceeds Upper Bound (77%) → Set forecast to 77%. *Requires head of risk sign-off and judgment*.  

  **Why you won't like this (but why it's valid)**:  
  The procedure forces you to confront your incentive to overestimate success. You expect that even in the *best-case* scenario (weighted average of future forecasts), your future forecast will be ≤77%. Holding 90% now violates reflection—you’d be "surprised by your future self." The range adjustment prevents you from hiding behind ambiguity.  

  ---

  ### What This Procedure Cannot Do  
  1. **Silent on unscheduled evidence**: Only applies to pre-defined evidence events. Ignores ad-hoc updates.  
  2. **Fails with memory loss/forgetting**: Assumes you recall your current model when updating.  
  3. **Requires honesty about future beliefs**: If forecasters misrepresent \(P_{\text{future}}(A \mid E_i)\) (e.g., due to incentive conflicts), outputs are garbage.  
  4. **No substitute for proper Bayesian updating**: Only checks coherence—doesn’t validate if \(P_{\text{future}}(A \mid E_i)\) is well-calibrated.  
  5. **Breaks with non-exclusive evidence**: If \(E_i\) overlap (e.g., "report positive" and "report contains red flags"), coherence checks fail.  
  6. **Limited by range imprecision**: Handling ranges (Case C) is a band-aid; it forces conservatism but loses precision.  
  7. **Cannot resolve self-deception**: If you *believe* you’ll update to an extreme value unreasonably, reflection won’t catch it.  

  **When to Override**:  
  - If evidence could redefine event \(A\) (e.g., regulatory change alters what "default" means).  
  - If you expect to learn *unscheduled* information before \(E_i\) arrives.  
  - If the head of risk judges that \(P_{\text{future}}(A \mid E_i)\) is irrational (e.g., "I’ll panic and set it to 0%").  

  **Final Note**: This is a *coherence check*, not a truth oracle. It ensures you’re not at odds with your future beliefs—not that those beliefs are correct. Run it weekly to catch drift, but pair with calibration training for accuracy.  

  ---  
  *Procedure v1.1 | Authored by Risk Team | Approved by Head of Risk*
