prompt: |-
  For three years I've sat on my city's petition review committee: nine of us, all volunteers, who recommend to the council whether a citizen petition goes on the ballot. Our record so far, in order: a ban on single-use plastic bags, sent to the voters and passed; a petition that would have instructed our two state representatives to vote against a highway project, turned down because we cannot direct other bodies; a petition requiring a two-thirds council vote for any future tax increase, turned down as an attempt to bind councils that have not been elected yet; a petition requiring the city to publish its contracts online within thirty days, sent to the voters; a petition to fund a second ambulance by raising parking meter rates, turned down on the ground that spending is the council's business; a petition banning new distribution warehouses that by its own terms would take effect only if two neighboring towns adopted the same ban, turned down as "a measure that might never become one"; and an advisory question asking whether the city should explore merging its water system with the neighboring district, sent to the voters even though it bound nobody, because we wanted to know how people felt before deciding.

  Next week we take up a petition to create a nine-member civilian board with power to subpoena internal police-affairs files and to require the city manager to explain publicly any decision not to discipline an officer. Its signatures are comfortably over the threshold. It appropriates no new money, using existing council chambers and up to forty staff hours a year, and it takes effect only once the city attorney certifies in writing that the subpoena power is lawful under state law.

  Which way should we vote to be most consistent with our own record? Tell me which precedent is the closest analog, what more than one rule could be extracted from that record, what each of those rules says about this petition, and what principle we would be committing ourselves to by each possible vote — including if the honest answer is that we should send a narrower version instead. I voted for the advisory water question and against the warehouse ban and I still can't say what I was following when I did, so please tell me how confident you are in your recommendation and which single step in it you are least sure of.
reasoning: |-
  Okay, the user is part of a petition review committee and needs to decide on a new petition regarding a civilian police oversight board. They've provided their committee's past decisions and want to know how to vote consistently based on their record. Let me start by analyzing each precedent they mentioned.

  First, they approved the plastic bag ban and the contract publication petition. Both were straightforward legislative actions within the city's authority. Then they rejected petitions that tried to direct state reps or bind future councils, which makes sense because those overstepped their jurisdiction. The ambulance funding was turned down because it involved spending, which is the council's purview. The warehouse ban was rejected because it was conditional on other towns' actions, which meant it might never take effect. The advisory water question was allowed even though non-binding because it sought public opinion.

  Now, the current petition creates a civilian board with subpoena power over police files and requires explanations for not disciplining officers. It doesn't appropriate money and only takes effect if the city attorney certifies the subpoena's legality. 

  Looking for the closest precedent, the warehouse ban comes to mind because both have conditional enactments. But here, the condition is legal certification, which is different from depending on other towns. The advisory question is similar in that it's non-binding in some aspects, but this petition does create binding powers. 

  The key rules from past decisions seem to be: 1) Don't interfere with other governmental bodies. 2) Don't bind future councils. 3) Avoid conditional measures that might never activate. 4) Allow advisory questions for gauging public opinion. 5) Reject petitions that usurp council spending authority.

  For this petition, does it bind future councils? Not really, since it's establishing a board now. The subpoena power might face state law issues, but the city attorney's certification addresses that. The spending is minimal and uses existing resources, so it doesn't infringe on the council's budget role. 

  The user mentioned voting for the water advisory but against the warehouse ban. Their inconsistency might stem from unclear principles. Here, the petition's conditional aspect is mitigated by the legal check, making it more acceptable than the warehouse ban. Also, it's not advisory but has enforceable powers, which is new. However, the committee allowed the plastic bag ban and contract publication, which were enforceable, so that's consistent.

  The user's deeper need might be understanding the underlying principles to avoid arbitrary decisions. They want clarity for future cases. The recommendation to send it to voters seems consistent, but the uncertainty is whether the subpoena power oversteps into executive functions, which hasn't been tested in their precedents. That's the part where confidence is lower. They need to decide if the certification by the city attorney sufficiently addresses potential overreach, similar to the warehouse condition but with a legal rather than external dependency.
answer: |-
  Based on your committee's record and principles, **you should vote to send this police oversight board petition to the voters.** The closest analog is the **advisory water merger question**, but significant differences necessitate extracting multiple rules from your record.

  ### 1. Closest Analog: The Advisory Water Merger Question
     - **Why**: Both involve oversight of executive functions (water system management vs. police discipline) and prioritize public input on governance structure.
     - **Key Distinction**: The water question was purely advisory; this petition creates binding investigative powers (if lawful). This makes it more akin to the plastic bag ban or contract publication petitions in creating new policy.

  ### 2. Rules Extracted from Your Record
     - **Rule 1: Jurisdictional Boundaries**  
       *Precedents*: Rejecting petitions directing state reps (highway) or binding future councils (tax vote).  
       *Implication for this petition*: The board operates within city government and doesn't direct external bodies or bind future councils (it’s a standing body). **Supports sending it**.
       
     - **Rule 2: Non-Conditional Enactment**  
       *Precedent*: Rejecting the warehouse ban due to contingent activation.  
       *Implication*: This petition’s activation depends *only* on the city attorney’s legal certification (an internal check), not external unknowns. **Distinguishes it from the warehouse ban**.
       
     - **Rule 3: Council Prerogative Over Spending**  
       *Precedent*: Rejecting ambulance funding due to spending mandates.  
       *Implication*: This petition explicitly avoids appropriations, using existing resources. **Supports sending it**.
       
     - **Rule 4: Permissibility of Advisory/Investigative Bodies**  
       *Precedent*: Approving the non-binding water question to gauge public sentiment.  
       *Implication*: This petition goes further but shares the goal of enhancing transparency/oversight. The committee has endorsed non-binding public consultation on governance. **Supports sending it**.

  ### 3. Principle Committed to by Each Vote
     - **Vote to Send to Voters**:  
       *Principle*: "Citizens may legislate structural government reforms via petition, provided they:  
       (a) Operate within city jurisdiction,  
       (b) Don’t mandate spending or bind future councils,  
       (c) Have a clear path to enactment without external contingencies."  
       *Alignment with Record*: Consistent with plastic bag ban, contract publication, and water question precedents.

     - **Vote to Reject**:  
       *Principle*: "Only purely advisory questions or routine legislative actions (like bag bans) are permissible; petitions creating empowered oversight bodies encroach on executive/council authority."  
       *Alignment with Record*: Inconsistent—you allowed structural changes (contract publishing) and advisory executive oversight (water). Rejecting this would imply a new, stricter rule.

     - **Send a Narrower Version?**  
       Not required for consistency. The petition’s self-limiting features (no funding, legal certification) address past rejection grounds (spending in ambulance petition, uncertainty in warehouse ban).

  ### 4. Your Past Votes Explained
     - **Water Question (Yes)**: Aligns with Rule 4 (public sentiment on governance is valuable).  
     - **Warehouse Ban (No)**: Aligns with Rule 2 (contingent on external towns).  
     Your uncertainty likely arose because the water question tested Rule 4 in isolation, while this petition combines Rules 1–4.

  ### 5. Confidence & Uncertainty
     - **Confidence Level**: **85%**. This recommendation reconciles all precedents without contradiction.  
     - **Least Confident Step**: Whether the **subpoena power** violates jurisdictional boundaries (Rule 1).  
       *Why*: Your committee hasn’t ruled on petitions granting subpoena authority. The city attorney certification mitigates this, but if subpoenas are inherently a state/judicial function, it *could* be seen as directing other bodies (like courts). Still, the self-certification clause makes this unlikely.

  ### Final Recommendation
  **Vote YES to send to voters**. The petition:  
  - Avoids past pitfalls (no spending mandates, no binding future councils, no external contingencies),  
  - Mirrors the *intent* of the water question (enhancing accountability),  
  - Shares the enforceable nature of the bag ban/contract petitions.  
  Rejecting it would create inconsistency with your approval of non-advisory structural changes. The subpoena concern is addressed by the legal certification requirement, preserving jurisdictional integrity.
