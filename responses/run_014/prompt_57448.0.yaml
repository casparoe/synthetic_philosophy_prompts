  We will have four candidate rules (though not named as such in the game):
  1. Belief rule: You may assert only what you believe.
  2. Justified belief rule: You may assert only what you are justified in believing.
  3. Knowledge rule: You may assert only what you know.
  4. Truth rule: You may assert only what is true.

  However, in the game, we will not use these terms. Instead, we will frame the rules in neutral language. But note: the scoring system will have three streams:

  Stream 1 (Truth-conduciveness for hearers): Rewards when the hearers act correctly based on the testimony. This proxies the truth rule because if the assertion is true, then acting on it leads to good outcomes. But note: hearers must act on the testimony, so if the assertion is false and they act, they might lose.

