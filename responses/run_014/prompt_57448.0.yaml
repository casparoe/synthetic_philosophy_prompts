  Stream 3 (Group blame): After the round, the group will discuss and decide whether the speaker was to blame for the assertion. This should come apart from the truth: sometimes the group might blame the speaker even if the assertion was true (because the evidence was weak) and sometimes not blame even if false (because the evidence was strong).

