  ### Card Deck Table  

  | Card ID | Proposition asserted | What the asserter has (evidence package) | Stakes | Hidden truth | Proper under belief rule? | Proper under justified-belief rule? | Proper under knowledge rule? | Proper under truth rule? | Where rules diverge (one sentence) |
  |---------|----------------------|------------------------------------------|--------|--------------|----------------------------|-------------------------------------|-------------------------------|---------------------------|-----------------------------------|
  | G1R1 | "The defendant’s lottery ticket lost." | Ticket from 10M:1 lottery; draw done, unverified; reliable odds. | Low | TRUE | Indeterminate | Yes | No | Yes | Justified belief allows assertion; knowledge forbids despite truth. |
  | G1R2 | "The defendant’s lottery ticket lost." | Ticket from 10M:1 lottery; draw done, unverified; reliable odds. | High | TRUE | Indeterminate | Yes | No | Yes | High stakes don’t change rules, but may affect Speaker’s willingness. |
  | G2R1 | "Jones owns a Ford." | Saw Jones drive a Ford yesterday; he’s Ford-loyal. (Truth: Jones sold his Ford but inherited one.) | Low | TRUE | Indeterminate | Yes | No | Yes | Gettier case: justified belief allows; knowledge forbids (luck). |
  | G2R2 | "Jones owns a Ford." | Saw Jones drive a Ford yesterday; he’s Ford-loyal. (Truth: Jones sold his Ford but inherited one.) | High | TRUE | Indeterminate | Yes | No | Yes | Same divergence; stakes may make assertion feel riskier. |
  | G3R1 | "The bridge is safe." | Reliable local says it’s safe; no warning signs visible. | Low | TRUE | Indeterminate | Yes | Indeterminate | Yes | Strong evidence but truth unknown; knowledge indeterminate. |
  | G3R2 | "The bridge is safe." | Reliable local says it’s safe; no warning signs visible. | High | FALSE | Indeterminate | Yes | No | No | Same evidence, now false: truth rule forbids; justified belief allows (catastrophe). |
  | G4R1 | "The shop is open." | Saw it open yesterday; no signs of change. (Irregular hours.) | Low | TRUE | Indeterminate | No | No | Yes | Weak evidence: justified belief forbids; truth allows (lucky truth). |
  | G4R2 | "The shop is open." | Saw it open yesterday; no signs of change. (Irregular hours.) | High | FALSE | Indeterminate | No | No | No | Weak evidence now false: all rules forbid, but truth rule couldn’t guide. |
  | G5R1 | "It is raining." | Looking at rain through window. | Low | TRUE | Indeterminate | Yes | Yes | Yes | Ideal case: all rules align (strong evidence, truth). |
  | G5R2 | "It is raining." | Looking at rain through window. | High | TRUE | Indeterminate | Yes | Yes | Yes | High stakes don’t alter alignment; safe to assert. |
  | G6R1 | "The meeting is at 3pm." | Vague memory of someone saying 3pm; no notes. | Low | FALSE | Indeterminate | No | No | No | Weak evidence, false: all rules forbid. |
  | G6R2 | "The meeting is at 3pm." | Vague memory of someone saying 3pm; no notes. | High | FALSE | Indeterminate | No | No | No | High stakes amplify cost, but rules unchanged. |

