  ### Activity Plan: Assertion Under Scrutiny

  **Setup**  
  Arrange movable tables into six clusters. Assign students to groups of three. Designate roles: Speaker, Hearer 1, and Hearer 2. Rotate roles in Round 2 (e.g., Hearer 1 becomes Speaker). Distribute materials: one evidence card, ten counters (chips), and one blame token (red index card) per group. Explain: "You’re in a tribunal where Speakers share claims, Hearers act on them, and we track consequences. Truths are hidden until revealed. Score for Hearers’ outcomes, Speakers’ evidence-handling, and group blame."

  **Materials**  
  - **Counters**: 10 per group (represent points).  
  - **Blame token**: Red index card labelled "BLAME" on one side, "NO BLAME" on the other.  
  - **Evidence cards**: 12 unique cards (6 scenarios × 2 stakes levels), printable on A4. Example card front:  

  > **ROUND 1: LOW STAKES**  
  > **Proposition**: "The defendant's lottery ticket lost."  
  > **Evidence**: You hold a ticket from a 10,000,000-to-1 lottery. The draw happened, but you haven't checked results. A reliable source confirms the odds.  
  > **If Hearers act on assertion**: Gain 1 chip if true; lose 1 chip if false.  
  > **If no assertion**: Lose 0.5 chips (inaction cost).  

  Card back: **Hidden Truth: TRUE** (visible only after decisions).  
  - **Score sheets**: For tracking three streams (provided separately).  

  **Roles**  
  - **Speaker**: Reads card, decides to assert the proposition or stay silent. Justifies briefly.  
  - **Hearers**: Discuss (1 min) and decide whether to act on the assertion (e.g., "convict defendant"). If no assertion, they cannot act.  
  - **All**: Post-reveal, discuss blame for Speaker (2 min) and vote with token.  

  **Round Sequence (Total: 30 minutes)**  
  - **Min 0-5**: Setup and role assignment.  
  - **Round 1 (Low Stakes)**:  
    - **Min 5-7**: Distribute low-stakes cards. Speakers decide.  
    - **Min 7-8**: Speakers announce: "I assert [proposition]" or "I withhold assertion."  
    - **Min 8-10**: Hearers discuss and decide action.  
    - **Min 10-11**: Facilitator reveals truth for all groups.  
    - **Min 11-14**: Groups score outcomes, discuss blame, and vote.  
  - **Round 2 (High Stakes)**:  
    - **Min 14-16**: Distribute high-stakes cards (same scenario, higher risks). Rotate roles.  
    - **Min 16-17**: Speakers announce.  
    - **Min 17-19**: Hearers decide (e.g., acting now risks -5 chips if false).  
    - **Min 19-20**: Truth revealed.  
    - **Min 20-23**: Score and blame.  
  - **Min 23-30**: Groups tally scores.  

  **Scoring**  
  Three independent streams:  
  1. **Hearers’ Truth-Conduciveness**: Chips gained/lost from acting/inaction. Proxies the *truth rule* (rewards outcomes from true assertions).  
  2. **Speaker’s Epistemic Standing**: Predefined points:  
     - +3: Asserting with strong evidence / Withholding with weak evidence.  
     - -3: Asserting with weak evidence / Withholding with strong evidence.  
     - *Proxies justified-belief rule* (rewards evidence-based decisions).  
  3. **Group Blame**: If "BLAME" voted, Speaker loses 3 points. *Proxies community norms of propriety*.  

  **Debrief (65 minutes)**  
  1. **Group reports** (15 min): Each shares when Speakers/Hearers succeeded/failed.  
  2. **Contrast rounds** (20 min): Ask:  
     - "When did withholding an assertion cause harm despite truth?" (e.g., lottery paralysis).  
     - "When did a 'lucky' true assertion lead to disaster later?" (e.g., weak evidence in high-stakes).  
     - "Did blame align with truth? With evidence strength?"  
  3. **Reveal hidden rules** (20 min): Introduce (but do not name) the four candidate rules via patterns:  
     - "Did anyone feel they needed *certainty* to speak? That’s Rule C: assert only what you *know*."  
     - "Did anyone speak based on *evidence alone*? Rule B: assert what you’re *justified* in believing."  
  4. **Flatmate’s challenge** (10 min): Pose: "If a rule forbids true assertions when nothing goes wrong, is it just a philosopher’s tic? Can a rule you can’t ‘check’ (like truth) guide anyone?"  

  **Predictable Failures**  
  - **Law students debate admissibility**: They may fixate on legal evidence standards. *Fix*: Reframe: "This is about everyday claims, not courtrooms."  
  - **Gaming hidden truths**: Students might guess truths (e.g., lottery = likely true). *Fix*: Emphasise: "Your evidence doesn’t guarantee truth—focus on your decision, not outcomes."  
  - **Hearers ignore assertions**: Some may always/never act. *Fix*: Clarify: "Hearers must engage with the Speaker’s choice."  

