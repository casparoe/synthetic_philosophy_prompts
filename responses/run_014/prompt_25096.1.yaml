prompt: |-
  I am a novelist at work on my fourth book, and I have been studying Daniel Dennett's claim that the self is a center of narrative gravity — not an entity located in the brain but an abstraction that emerges from the stories told about a person, much as a physical center of gravity is an abstraction that emerges from the distribution of mass. I suspect I have been constructing characters backward: I begin with a list of traits, a backstory, and a putative inner life, and then I try to make the character cohere around that fixed point. Dennett's picture suggests I should be working in the opposite direction, letting the self precipitate out of the narratives rather than imposing it in advance.

  I would like you to design a character-construction procedure grounded in this narrative-gravity view — something I can use for each major and secondary character across novels. I write literary fiction with ensemble casts of roughly four to eight significant characters per book, and I produce a novel every two to three years, so the procedure will see regular but not daily use. I have time to work through it deliberately, but it must yield outputs I can actually write from: scenes, dialogue, decisions a character makes under pressure, moments of self-betrayal or self-revision. The procedure should take as its raw materials the events of the plot, the testimony of other characters, the character's own self-narrations (whether explicit in first-person narration or implicit in free indirect style), and the discrepancies among these accounts, and it should show how a self crystallizes — or fails to crystallize — out of that material. Flag every step at which the theory runs out and I, the author, must make a judgment call. Be explicit about which kinds of characters the procedure will handle badly.

  Then apply the procedure to two cases. The first is a protagonist who narrates her own story in the first person — a character whose self-narrative is unusually dominant and who may be unreliable. The second is a character who appears only in scenes reported by other characters and who never speaks in her own voice — a minor figure whose center of narrative gravity must be inferred entirely from external reports. For at least one of these cases, show me a result the procedure forces on me that I, as a novelist reaching for intuitive consistency, would resist, and explain why the resistance is itself informative.
reasoning: |-
  We are going to design a character-construction procedure based on Daniel Dennett's idea of the self as a center of narrative gravity. The procedure will use the events of the plot, the testimony of other characters, the character's own self-narrations (if available), and the discrepancies among these to build the character's self as an emergent phenomenon.

  ### Procedure Overview
  The procedure will be divided into phases:

  1. **Gather Narratives**: Collect all available narrative fragments about the character from the plot and other sources.
  2. **Identify Discrepancies**: Note contradictions and gaps between different sources (e.g., between a character's self-report and others' reports).
  3. **Trace Narrative Tensions**: Map how the character is pulled by competing narratives (e.g., how others see them vs. how they see themselves).
  4. **Crystallize the Self**: Determine the character's actions, decisions, and self-understanding as a result of the interplay of these narratives. This includes moments of crisis (self-betrayal, self-revision) when the narrative gravity might shift.
  5. **Authorial Intervention Points**: At each step, we will note where the theory leaves gaps and the author must make a judgment.

  The procedure must yield outputs that are actionable for writing: scenes, dialogue, decisions, etc.

  ### Detailed Procedure

  #### Step 1: Gather Narratives
  - **Objective**: Collect every piece of information about the character from:
    - Plot events: What happens to the character? What do they do?
    - Testimony of other characters: What do others say about the character? (Include multiple perspectives and note the relationship between the speaker and the character.)
    - The character's own self-narrations: If available, what does the character say about themselves? (In first-person narration or free indirect style.)
  - **Output**: A timeline of events and a collection of attributed quotes or thoughts.
  - **Authorial Judgment**: The author must decide which events and testimonies to include and how to interpret ambiguous statements. Also, the author must decide the reliability of the sources (but without imposing a fixed inner self).

  #### Step 2: Identify Discrepancies
  - **Objective**: Look for contradictions and gaps in the gathered data. Examples:
    - A character claims to be brave, but other characters describe them as cowardly.
    - The character's actions in one scene contradict their self-reported values.
    - A gap: the character is absent for a significant event that involves them indirectly.
  - **Output**: A list of discrepancies and gaps. This list becomes the raw material for character development.
  - **Authorial Judgment**: The author must decide which discrepancies are meaningful and which are noise. Also, the author must decide how much weight to give to each source.

  #### Step 3: Trace Narrative Tensions
  - **Objective**: Map the tensions between the competing narratives. Consider:
    - How does the character respond to the discrepancies? (e.g., Do they ignore, rationalize, or confront them?)
    - How do others' views of the character affect the character's behavior? (e.g., Does the character live up to or rebel against others' expectations?)
    - How do the plot events force the character to adjust their self-narrative?
  - **Output**: A set of narrative forces acting on the character. This should lead to specific scenes or moments that illustrate these tensions.
  - **Authorial Judgment**: The author must decide the direction and intensity of the tensions. The author also must invent the character's responses to the tensions, which are not dictated by the theory.

  #### Step 4: Crystallize the Self
  - **Objective**: Determine how the character's self emerges from the narratives. Look for:
    - **Moments of Decision**: When the character must act under pressure, which narrative wins out? How does that decision change the narrative gravity?
    - **Self-Betrayal**: When the character acts against their own stated narrative, how do they reconcile it? (e.g., denial, self-justification, or a revision of self.)
    - **Self-Revision**: When the character changes their self-narrative in response to events or others' views.
  - **Output**: Key scenes and character moments that define the character. These should be concrete: dialogue, actions, internal thoughts (if available).
  - **Authorial Judgment**: The author must decide the outcome of the crystallization. The theory does not predict whether a coherent self will emerge or not. The author must also decide the degree of unreliability in self-narrations and how it manifests.

  #### Step 5: Compile and Iterate
  - **Objective**: Review the outputs and ensure they form a pattern that feels like a "self" without being a fixed core. Then, use this to write scenes.
  - **Output**: A character profile that is dynamic and tied to the narrative, not a list of traits.

  ### Characters the Procedure Handles Badly
  The procedure will struggle with:
  1. **Characters with Minimal Narrative Presence**: If a character is rarely mentioned or seen, the narrative gravity may be too weak to form a distinct self.
  2. **Characters in Highly Stylized or Non-Realist Fiction**: Where the rules of narrative coherence are intentionally broken (e.g., absurdist fiction).
  3. **Characters Designed as Archetypes or Symbols**: Because the procedure relies on accumulating narrative fragments, a character meant to represent an idea may not gather enough varied narratives to emerge as a "self."

  ### Case Studies

  #### Case 1: First-Person Unreliable Narrator (Protagonist)
  - **Character**: Let's call her Alice. She is narrating her own story in the first person. The plot involves a family secret that she is uncovering.

  **Step 1: Gather Narratives**
  - Alice's self-narration: She describes herself as a truth-seeker, dedicated to uncovering her family's past.
  - Testimony of others: Her brother says she is obsessed and destructive. Her aunt says she is fragile and prone to fantasy.
  - Plot events: Alice breaks into her late father's study and steals documents. Later, she burns some of the documents when they reveal a painful truth.

  **Step 2: Identify Discrepancies**
  - Discrepancy 1: Alice claims she is a truth-seeker, but she burns documents that contain truth.
  - Discrepancy 2: Her brother says she is destructive, which aligns with the burning, but she sees her actions as necessary for protection.
  - Gap: Alice never explains why she burned the documents in her narration.

  **Step 3: Trace Narrative Tensions**
  - Tension between Alice's self-view (truth-seeker) and her actions (burning evidence). Also, tension between her view and her brother's (destructive).
  - How she responds: In her narration, she skips over the burning incident quickly, then later rationalizes it as protecting her mother.

  **Step 4: Crystallize the Self**
  - Moment of Decision: When Alice burns the documents, it's a moment of self-betrayal. She cannot face the truth, so she destroys it. This forces a self-revision: she now must see herself as someone who protects loved ones at the cost of truth.
  - Output Scene: Write a scene where Alice, in a panic, burns the documents. Then, in her narration, she tries to justify it by shifting her self-narrative: "I thought I was a seeker of truth, but I realized that some truths are too cruel to share. I am my mother's daughter, after all."

  **Authorial Resistance**: As a novelist, I might resist making Alice so clearly self-deceptive. I might want her to have a more complex, perhaps noble reason for burning the documents. But the procedure pushes me to see that the discrepancy must be resolved in a way that emerges from the narrative tension. The resistance is informative because it reveals my own bias toward wanting the character to be more sympathetic. The theory forces me to confront that the character's self-deception is the point: her center of narrative gravity is shifting from "truth-seeker" to "protector" to rationalize her action.

  #### Case 2: Minor Character Known Only Through Others
  - **Character**: Let's call her Beatrice. She is the deceased mother of the protagonist (Alice) and appears only in the recollections of other characters.

  **Step 1: Gather Narratives**
  - Testimony of others:
    - Alice: "My mother was a saint who sacrificed everything for us."
    - Brother: "Mom was always sad and distant; she had a secret life."
    - Aunt: "She was a free spirit trapped by marriage."
  - Plot events: None directly involving Beatrice (since she's dead), but events that reference her (e.g., finding her diary, which is empty).

  **Step 2: Identify Discrepancies**
  - Discrepancy 1: Alice sees her mother as a saint, but the brother sees her as distant and sad.
  - Discrepancy 2: The aunt's view (free spirit trapped) doesn't align with either.
  - Gap: The empty diary — why did she not write in it? Was she secretive or just not a writer?

  **Step 3: Trace Narrative Tensions**
  - The tension is between the competing narratives of Beatrice. The characters are projecting their own needs onto her. Alice needs a saint, the brother feels abandoned, the aunt romanticizes her sister.

  **Step 4: Crystallize the Self**
  - Beatrice's "self" is entirely constructed by others. The empty diary becomes a symbol: she is a blank page upon which others write.
  - Moment of Revision: When the empty diary is found, Alice must confront that her mother might not have been the saint she imagined. But since Beatrice never speaks, we don't get her self-narrative. The crystallization fails — Beatrice remains an enigma.
  - Output Scene: A scene where the siblings argue about the empty diary. Alice insists it means her mother was too pure to need words, while the brother says it shows she had nothing to say to them. The aunt suggests she might have been illiterate (which is a lie to protect her).

  **Authorial Judgment**: The procedure forces us to leave Beatrice as an unresolved set of narratives. As a novelist, I might be tempted to include a deathbed letter or a hidden note to give Beatrice a voice. But the procedure shows that by not giving her a voice, we see how the living characters use her memory to serve their own needs. The resistance to leaving her ambiguous is natural because we want closure, but the theory shows that the lack of closure is the point: the center of narrative gravity for a deceased person is entirely in the hands of the living.

  ### Final Note
  This procedure is a tool to help you build characters from the outside in. It will sometimes push you toward uncomfortable characterizations because it emphasizes the messiness of narrative construction. Embrace the discomfort — it may lead to more complex and lifelike characters.
answer: |-
  ### Character-Construction Procedure: Center of Narrative Gravity  
  **Core Principle**: The self is not a pre-existing core but an emergent pattern formed by overlapping, contradictory, and evolving narratives. Build characters *from* the raw material of plot events, testimonies, and self-narrations—not toward a predetermined "essence."  

  ---

  ### Step-by-Step Procedure  
  #### **Phase 1: Assemble Narrative Fragments**  
  **Goal**: Collect all data points that could contribute to the character's "gravity."  
  - **Inputs**:  
    - **Plot Events**: Actions involving the character (e.g., "Character A betrays Character B").  
    - **External Testimony**: How others describe/judge the character (e.g., "B says A is cruel").  
    - **Self-Narration**: The character’s own voice (e.g., "A claims she acted out of love").  
    - **Discrepancies**: Note contradictions (e.g., "A’s action (betrayal) clashes with her self-narration (love)").  
  - **Output**: A timeline of events and a "Narrative Dossier" (quotes, actions, gaps).  
  - **Author Judgment**: *You decide which fragments are included*. The theory doesn’t dictate what’s "relevant."  

  #### **Phase 2: Map Narrative Tensions**  
  **Goal**: Identify fault lines where narratives clash, forcing the self to adapt.  
  - **Inputs**: Discrepancies from Phase 1.  
  - **Process**:  
    1. **Weight the Sources**: Assign provisional reliability to narratives (e.g., "B’s testimony is biased; A’s self-narration is defensive").  
    2. **Spot Pressure Points**: Find where contradictions create cognitive dissonance (e.g., "A’s betrayal vs. her self-image as loyal").  
  - **Output**: A "Tension Map" highlighting conflicts (e.g., "Loyalty vs. Self-Preservation").  
  - **Author Judgment**: *You set the weight of each narrative*. The theory doesn’t resolve reliability.  

  #### **Phase 3: Simulate Emergence**  
  **Goal**: Force the character to "crystallize" through key decisions.  
  - **Inputs**: Tension Map + Plot Events requiring choices.  
  - **Process**:  
    1. **Crisis Points**: Place the character in a situation that exacerbates a tension (e.g., "A must choose between loyalty to B or self-preservation").  
    2. **Self-Betrayal/Revision**: Show how the character resolves dissonance:  
       - *Self-Betrayal*: They act against their self-narrative (e.g., A betrays B again but rationalizes it).  
       - *Self-Revision*: They update their self-narrative (e.g., A admits, "I’m not the loyal person I thought").  
  - **Output**: Concrete scenes/dialogue where the character’s "self" shifts.  
  - **Author Judgment**: *You design the crisis and choose the resolution*. The theory predicts tension but not the outcome.  

  #### **Phase 4: Test Coherence**  
  **Goal**: Check if narratives converge into a stable "gravity" or fragment.  
  - **Inputs**: Post-crisis actions and updated narratives.  
  - **Process**:  
    - **Coherence**: Do subsequent actions align with the revised self? (e.g., After self-revision, A avoids loyalty tests).  
    - **Fragmentation**: Do contradictions persist? (e.g., A still claims loyalty while acting selfishly).  
  - **Output**: A diagnosis: "Stable Self," "Fragmented Self," or "Unresolved."  
  - **Author Judgment**: *You define "coherence."* The theory doesn’t specify what makes a self "viable."  

  ---

  ### Limitations of the Procedure  
  **Avoid for**:  
  1. **Archetypal Characters**: Villains, mentors, or symbols with fixed roles resist emergence.  
  2. **Passive Observers**: Characters who don’t act or influence plots lack narrative mass.  
  3. **Highly Introspective Characters**: When internal monologue dominates, external narratives matter less.  

  ---

  ### Case Study 1: Unreliable First-Person Protagonist  
  **Character**: *Elena*, a historian writing a memoir about her role in a political scandal.  

  #### **Phase 1: Assemble Fragments**  
  - **Plot Events**: Elena leaks classified documents; her friend is fired.  
  - **External Testimony**: Colleagues call her "ruthless"; her daughter says she’s "a coward hiding behind ideals."  
  - **Self-Narration**: "I did it for truth. I’m no hero, but I’m not a villain."  
  - **Discrepancies**:  
    - Self vs. Plot: She claims altruism but gained fame from the leak.  
    - Self vs. Testimony: Daughter calls her a "coward"; she calls herself "courageous."  

  #### **Phase 2: Map Tensions**  
  - **Tension**: "Courage vs. Cowardice," "Altruism vs. Ambition."  
  - **Weighting**: Daughter’s testimony is weighted heavily (intimate but bitter); colleagues are partially dismissed (professional rivalry).  

  #### **Phase 3: Simulate Emergence**  
  - **Crisis Point**: Elena discovers her leak caused her friend’s suicide.  
  - **Self-Betrayal**: She burns evidence implicating herself while narrating, "I did it for his family’s peace."  
  - **Output Scene**:  
    - *Dialogue*: Daughter confronts her: "You’re not protecting them. You’re hiding."  
    - *Action*: Elena’s hands shake as she burns the papers.  
  - **Self-Revision**: She revises from "truth-teller" to "failed martyr": "I thought I was brave. I was just afraid of being forgotten."  

  #### **Author Resistance & Why It’s Useful**  
  - **Resistance**: You might want Elena to have a "core" bravery that shines through. The procedure forces her into *self-betrayal* (burning evidence), making her less heroic.  
  - **Why Informative**: Your resistance reveals an instinct to protect her from her contradictions. Lean into this—it mirrors how real humans cling to self-narratives. The procedural outcome feels more authentic because it’s uncomfortable.  

  ---

  ### Case Study 2: Silent Minor Character  
  **Character**: *Marian*, a deceased artist. Only appears in others’ stories.  

  #### **Phase 1: Assemble Fragments**  
  - **Plot Events**: None (she’s dead). Actions described: "Marian abandoned her family to paint."  
  - **External Testimony**:  
    - Husband: "She was selfish, chasing fantasies."  
    - Art Critic: "She was a genius martyred by domesticity."  
    - Daughter: "She left me a sketchbook with a note: ‘Sorry.’"  
  - **Self-Narration**: None.  
  - **Discrepancies**: Husband (selfish) vs. Critic (martyred). Daughter’s sketchbook implies regret.  

  #### **Phase 2: Map Tensions**  
  - **Tension**: "Selfishness vs. Sacrifice," "Genius vs. Responsibility."  
  - **Weighting**: Daughter’s testimony prioritized (direct evidence via sketchbook).  

  #### **Phase 3: Simulate Emergence**  
  - **Crisis Point**: Daughter considers selling the sketchbook.  
  - **Self-Revision (Projected)**:  
    - *Through Daughter*: "You weren’t selfish. You were just too alive for this world."  
    - *Through Husband*: "She chose paint over people. That’s all."  
  - **Output Scene**:  
    - *Dialogue*: Husband snaps at daughter: "Stop turning her into a saint! She left us!"  
    - *Action*: Daughter finds a hidden painting of herself in the sketchbook—Marian’s guilt made visible.  

  #### **Diagnosis (Phase 4)**: Fragmented Self  
  - Marian’s "self" is irreconcilable: she exists as competing myths. No crystallization occurs.  

  ---

  ### Why This Works for Your Practice  
  - **Scalable**: For 4–8 characters, Phase 1 can be a shared timeline; Phases 2–4 focus on individual tensions.  
  - **Action-Oriented**: Outputs are scenes and choices, not abstractions.  
  - **Theory Limits as Tools**: Each judgment call (weighting, crisis design) becomes a creative lever.  
  - **Resistance as Fuel**: When the procedure clashes with your intuition (e.g., Elena’s cowardice), interrogate why. That friction generates richer characters.  

  **Final Tip**: Use free indirect style to blur self-narration and external testimony—perfect for showcasing narrative gravity in action.
