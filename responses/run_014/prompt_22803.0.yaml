  ## The Unavoidable Equation: Pascal's Covert Doctrine of Power as Legitimacy

  Blaise Pascal’s poignant observation in the *Pensées* – "Justice without force is impotent; force without justice is tyrannical" – culminating in the resigned "not being able to make what is just, strong, one made what is strong, just," is often read as a lament, a tragic observation about the fallen state of human affairs. Classmates interpret Pascal as merely *describing* how power corrupts justice into a facade, an "accident" of history. However, a rigorous examination of Pascal's own epistemological foundations and the logical structure of his argument reveals that this conclusion is not an accidental tragedy he stumbles upon; it is the **inescapable and logically necessary consequence** of his prior assertions. Pascal is covertly committed to the principle that political legitimacy is fundamentally derived from and contingent upon effective power, not independent moral justification, and his own premises offer no viable escape route to a higher ground of "true" justice as the basis for law.

  The bedrock of Pascal's argument lies in his stark contrast between the nature of force and the nature of justice, established earlier in the *Pensées*. He presents **force as epistemologically privileged**: "Might is easily recognized and beyond dispute... It has no need to elaborate; it simply substitutes one fact for another" (Pensée 298, Brunschvicg numbering). Force operates in the realm of the undeniable, the immediate, and the concrete. Its presence or absence is a brute fact requiring no complex justification; it compels obedience through its sheer, observable reality. Justice, conversely, exists in a realm of **inherent contestability**. "Justice is subject to dispute," Pascal argues, "might is easily recognized and beyond dispute" (Pensée 298). The very *content* of justice – what is right, fair, or good – is perpetually debated, culturally relative ("on this side of the Pyrenees... on that"), and subject to the distortions of human self-interest and limited reason. There exists no universally accessible, objective tribunal to definitively arbitrate competing claims of justice in the real world.

  From this foundational dichotomy, Pascal's conclusion follows with logical necessity. If justice is always disputable, while force is immediately effective and undeniable, then **in any concrete political conflict over what constitutes the "just" course of action, the determining factor cannot be the inherent justice of the claim itself** (which is perpetually contested), **but rather the ability to impose one interpretation through force**. Consider two factions locked in a struggle over a law or a ruling. Each invokes its own conception of justice. According to Pascal's prior points, there is *no higher court of appeal* accessible to humans that can definitively settle which justice is "true." The resolution *must* come from the application of force. The faction that prevails does so not because its justice was demonstrably superior in some abstract sense (a sense Pascal argues is unavailable to us), but because it possessed the superior power to enforce its will. As Pascal observes, "It is right that what is just should be obeyed; it is necessary that what is strongest should be obeyed. Justice without might is helpless... thus it is necessary to combine justice and might" (Pensée 298). Yet, crucially, this "combination" isn't a harmonious merger of equals; it's the subordination of the disputable concept (justice) to the undeniable reality (force).

  Therefore, the statement "one made what is strong, just" is not merely a cynical observation about historical outcomes; it is the **operational definition of political legitimacy within Pascal's framework**. For a law or a ruling to function *as law* – to command obedience and maintain order – it must be enforceable. Enforceability requires power. A law embodying a perfectly "just" principle (by some standard) but utterly lacking the power to compel adherence is, in Pascal's terms, "impotent" – it ceases to function *as law* in the real world. Conversely, an edict backed by overwhelming force, regardless of its disputed moral content, *will* be obeyed and thus *functions* as law. Its very effectiveness in governing human behavior grants it a de facto legitimacy. This legitimacy stems precisely from its grounding in the undeniable reality of power, the only stable foundation available given the perpetual disputability of justice. To claim a law is "legitimate" because it is "just" is, for Pascal, ultimately circular and unsustainable without the backing of force, because the "justness" itself is always open to challenge.

  Could Pascal escape this conclusion? Could he appeal to a higher, divine justice? While Pascal certainly *believes* in divine justice, his argument about *human politics* is rigorously grounded in the limitations of human perception and reason. He explicitly states that "true justice" resides with God, utterly inaccessible to our flawed human faculties ("We know God only through Jesus Christ" - Pensée 548). **Within the immanent sphere of human governance and lawmaking, where decisions must be made and enforced amidst competing claims, the divine standard is irrelevant precisely because it is inaccessible for practical adjudication.** Human institutions cannot reliably access or implement this divine justice; they are stuck with the tools they have: disputable reason and undeniable force. His regret over the equation of the strong with the just ("not being able to make what is just, strong...") expresses a *moral* preference, but it does not negate the *descriptive and constitutive* logic he has laid bare. His epistemological skepticism about human justice traps him: without an objective, accessible standard for justice, power inevitably becomes the functional arbiter and thus the source of legitimacy for human laws.

  In conclusion, Pascal's statement is far more radical than a mere lament about power corrupting justice. It is the logical culmination of his profound skepticism regarding humanity's ability to know and agree upon objective justice. By establishing force as epistemologically undeniable and justice as perpetually contestable, Pascal constructs an argument where **the effective application of power becomes the necessary and sufficient condition for the legitimacy of human law in practice**. The "making just of the strong" is not an accidental tragedy he observes; it is the unavoidable consequence of the human condition he diagnoses. To demand that legitimacy stem solely from an independent, non-contestable justice is, within Pascal's own framework, to demand the impossible – the "impotent." Therefore, despite his personal yearning for a higher order, Pascal's analysis of earthly power dynamics commits him to the sobering view that legitimacy, in the only form humans can practically achieve it, is inextricably bound to, and flows from, the undeniable reality of force. The strength to enforce is what transforms a contested ideal into an operational law.
