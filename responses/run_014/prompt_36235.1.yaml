prompt: |-
  I head the employee-conduct review team at a mid-sized professional services firm — about a dozen investigators, none of them philosophers, each handling several complaints a week. Our code of conduct forbids "harassing conduct," which our policy glosses as "repeated or severe behavior that a reasonable person would find intimidating, hostile, or offensive, whether or not any single instance would independently violate this code." The words are vague in the way the sorites literature studies: no one can say how many rude remarks make conduct "repeated," how far short of criminal cruelty an episode can fall and still be "severe," or how "hostile" differs from merely "unpleasant." Our investigators currently decide these cases by intuition, and the intuition drifts: whoever handled the last borderline case sets a precedent nobody wrote down.

  Please write a decision procedure my team could actually run on a complaint, grounded in what the philosophy of vagueness actually establishes — the tolerance intuition ("one more remark can't make the difference") and its collapse under conjunction, the difference between a borderline case having no determinate truth versus our not knowing it, the way context and comparison class shift as cases accumulate, and whatever epistemicism, supervaluationism, and degree or contextualist theories have to offer that survives contact with practice. The procedure should specify: the questions to ask in order; what counts as a sufficient answer to each; where it terminates in a finding, where in a dismissal, and where it must stop and hand the decision to a named human being because the residual question is one of values rather than of vagueness. It must run in under an hour per case, use no jargon beyond what you define in a short preamble, and produce written rationales that will hold up if a decision is appealed.

  Three hazards it must explicitly address. First, the sorites trap: an investigator who agrees that no single instance of a behavior crosses the line, and that adding one instance to a non-violation cannot create a violation, ends up dismissing everything; the procedure needs a principled way to break that chain of reasoning without pretending each instance is evaluated in isolation. Second, the ratchet: once we sustain a complaint at, say, five instances over a quarter, every subsequent case gets argued by analogy to that one, so the boundary creeps; the procedure should tell investigators when comparison to prior outcomes is legitimate and when it smuggles in a boundary nobody actually chose. Third, the disagreement problem: two investigators applying the same procedure will sometimes reach opposite verdicts on the same facts, and I need to know whether the procedure should treat that as a defect to be engineered away, a normal feature of penumbral cases to be managed (for instance, by routing them somewhere), or evidence of a higher-order fact about the case.

  Then run the procedure on two complaints. In the first, an employee reports that a colleague has, over four months, made roughly a dozen individually trivial remarks about her accent, none of which any witness calls severe, but which she says have made her dread team meetings. In the second, an employee reports exactly two incidents, but one of them — a joke made in front of a client — was, by broad agreement, genuinely vicious. Include at least one worked case where the procedure returns an answer I will not like, and say plainly what the procedure cannot do — where vagueness theory runs out and the decision belongs entirely to judgment or to institutional values. Finally, tell me which theory of vagueness the procedure, as you have built it, is implicitly committed to, and what a team of ours that instead built the procedure on a rival theory would do differently at which step.
reasoning: |-
  We are designing a decision procedure for evaluating complaints of "harassing conduct" defined as "repeated or severe behavior that a reasonable person would find intimidating, hostile, or offensive, whether or not any single instance would independently violate this code." The procedure must be grounded in the philosophy of vagueness and address the sorites paradox, the ratchet effect, and the problem of disagreement.

  Key insights from vagueness theories:
  1. Tolerance principle: A small change (e.g., one more remark) doesn't turn a non-violation into a violation. But this leads to the sorites paradox if applied without limit.
  2. The paradox is avoided by recognizing that vague predicates have borderline cases, and that the tolerance principle fails at some point (though we cannot specify exactly where).
  3. Context matters: The meaning of vague terms can shift with context and comparison classes.
  4. Different theories:
     - Epistemicism: There is a sharp boundary, but we don't know where it is.
     - Supervaluationism: There are many precisifications (ways of making the vague term precise), and a statement is true if true in every precisification, false if false in every precisification, and neither otherwise.
     - Degree theories: Truth comes in degrees (e.g., fuzzy logic).
     - Contextualism: The meaning of vague terms depends on the context of use.

  We'll design a procedure that:
  - Uses a structured set of questions to break down the analysis.
  - Explicitly handles borderline cases by requiring human judgment at critical points.
  - Avoids the sorites trap by using a combination of counting and qualitative assessment, and by breaking the chain with a "sufficient aggregation" step.
  - Controls the ratchet effect by limiting the use of precedents to cases that are clearly similar and by requiring that precedents are used only when the context (including time frame and nature of behavior) is comparable.
  - Accepts that disagreement in borderline cases is normal and routes such cases to a higher authority.

  Procedure Overview:

  Preamble (to be read by investigators):
  This procedure uses the following terms:
  - "Instance": an occurrence of the alleged behavior.
  - "Severity": the harmfulness or offensiveness of an instance, assessed by considering the perspective of a reasonable person in the same circumstances.
  - "Repeated": the quality of having multiple instances that, when taken together, create a hostile environment, even if each instance alone might not.

  The procedure is based on the idea that the boundary between violating and non-violating conduct is not sharp, but we must make decisions. We break the problem into steps to avoid the sorites trap and to control for context shifts. At certain points, if the case is borderline, it will be referred to a designated Human Arbiter (HA) for a judgment call.

  Steps:

  1. **Severity Assessment of Each Instance**:
     - For each alleged instance, ask: "Would a reasonable person, in the same context, find this single instance to be intimidating, hostile, or offensive to such a degree that it independently violates the code?" (i.e., severe enough on its own).
     - If at least one instance is judged as independently violating (i.e., severe), then the conduct violates the code (under the "severe" prong). Proceed to step 4 (rationale) for a sustained finding.
     - If no instance is independently severe, then proceed to step 2.

     *Rationale*: This step addresses the "severe" part of the definition. If any instance is severe, the conduct violates the code regardless of repetition.

  2. **Repetition Assessment**:
     - Count the number of instances that are at least mildly offensive (i.e., they would be found by a reasonable person to be at least somewhat offensive, even if not severe). If the number is zero, dismiss the complaint (no violation). Otherwise, note the count and the time frame.
     - Consider the pattern: Are the instances part of a pattern of behavior directed at the same person? (If not, repetition may not be established in the relevant sense.)
     - Use the following scale to assess repetition (this scale is a guideline and not a strict rule):
          - 1-2 instances: unlikely to be repeated enough, unless they are very close in time and part of a clear pattern of targeting.
          - 3-5 instances: borderline, requires further analysis.
          - 6 or more instances: likely repeated, unless the time frame is very long and the incidents are sporadic without a pattern.

     - If the count is below 3, dismiss the complaint (unless there are exceptional circumstances, such as extreme targeting, in which case refer to HA).
     - If the count is 3 to 5, proceed to step 3 (Aggregation and Impact).
     - If the count is 6 or above, then the conduct is repeated, and you must then consider the overall impact (step 3) to ensure it meets the standard of creating an intimidating, hostile, or offensive environment.

     *Rationale*: We avoid the sorites trap by setting rough numerical thresholds that are not absolute but are used as heuristics. We acknowledge that 2 instances might not be enough, but 6 usually is, and 3-5 requires more scrutiny.

  3. **Aggregation and Impact**:
     - Ask: "Considering all the instances together, would a reasonable person in the complainant's position find the overall conduct to be intimidating, hostile, or offensive?"
     - Consider the context: the work environment, the relationship between the parties, the power dynamics, and any known vulnerabilities of the complainant.
     - Consider the impact: Has the conduct altered the conditions of the complainant's employment? (e.g., dread of meetings, as in the first case)
     - If the answer is clearly yes, then the conduct violates the code. If clearly no, dismiss. If uncertain (borderline), refer to the Human Arbiter (HA).

     *Rationale*: This step addresses the fact that repetition can create a hostile environment even when no single instance is severe. The impact assessment is crucial because the code requires that the behavior would be found hostile by a reasonable person.

  4. **Final Decision and Rationale**:
     - If the complaint is sustained or dismissed at an earlier step, write a rationale that includes:
          - The findings on each instance (if any were severe, which ones and why; if not, why not).
          - The count of instances and the pattern (if applicable).
          - The overall impact assessment (if applicable).
          - Any referral to HA and their decision (if applicable).
     - For borderline cases that went to HA, the rationale must state that the case was borderline and the HA made a judgment call based on institutional values.

  Addressing the hazards:

  - **Sorites Trap**: We break the chain by setting a threshold (step 2) that is not based on adding one instance at a time. The thresholds are not absolute but are set to avoid infinite regress. Moreover, the aggregation step (step 3) considers the overall effect, which is not additive in a linear way.

  - **Ratchet Effect**: The procedure limits the use of precedents. Investigators are instructed:
     - Only use prior cases that are factually similar (same type of behavior, similar context, similar time frame).
     - Do not use prior cases that were decided by HA as binding precedents because they involved borderline judgments.
     - The thresholds (e.g., 3-5 as borderline) are fixed and not adjusted by prior cases. This prevents creeping.

  - **Disagreement Problem**: The procedure accepts that borderline cases (especially in the 3-5 instance range and in the aggregation step) may lead to different judgments. Therefore, such cases are routed to a single Human Arbiter (or a small panel) to ensure consistency. Disagreement between investigators on the same facts in a borderline case is expected and is resolved by the HA.

  Running the procedure on two complaints:

  **Complaint 1: Accent Remarks**
  - Allegation: Roughly a dozen remarks about accent over four months. None severe individually, but complainant dreads team meetings.

  Step 1: Severity of each instance. We assume each remark is individually trivial (not severe). So, no severe instance. Proceed to step 2.

  Step 2: Repetition. Count the instances: about 12. This is above 6. So, we proceed to step 3.

  Step 3: Aggregation and Impact. We consider the overall conduct. The remarks were about accent (a protected characteristic), directed at the same person, over a relatively short time (4 months). The impact is reported: dread of team meetings. A reasonable person in the complainant's position would likely find this hostile. Therefore, the conduct violates the code.

  Decision: Sustain the complaint.

  **Complaint 2: Two Incidents, One Vicious**
  - Allegation: Two incidents. One joke in front of a client that was vicious.

  Step 1: Severity of each instance. The vicious joke: by broad agreement, it is severe. Therefore, the conduct violates the code under the "severe" prong.

  Decision: Sustain the complaint.

  Now, a case that might be unwelcome: 

  **Hypothetical Complaint 3: Three Mildly Offensive Remarks**
  - Over six months, three remarks that are mildly offensive (e.g., minor teasing about work style, not about a protected characteristic). The complainant feels uncomfortable but has not altered work patterns.

  Step 1: No severe instance.
  Step 2: Count is 3, which is in the borderline range (3-5). Proceed to step 3.
  Step 3: Aggregation: Three remarks over six months, not targeting a protected characteristic, and the impact is minimal (only discomfort). A reasonable person might not find this hostile. But it's borderline. Therefore, refer to HA.

  HA might decide: Given the mildness, the infrequency, and the lack of impact, it does not rise to the level of hostile. Dismiss.

  The procedure cannot decide borderline cases without human judgment because vagueness theory does not eliminate the penumbra. The HA step is where institutional values (e.g., how much do we tolerate minor annoyances? what kind of workplace culture do we want?) come into play.

  Implicit Theory:

  The procedure is most aligned with **supervaluationism**. We consider multiple ways of precisifying the vague terms (e.g., what counts as "repeated" could be set at 3, 4, 5, etc.). The procedure sets up admissibility conditions (steps 1-3) and then, when the case falls in the borderline, it is neither true nor false that it violates the code under every precisification. Therefore, we need a human to choose a precisification (which is what the HA does).

  Contrast with other theories:

  - **Epistemicism**: We would design the procedure to search for the unknown sharp boundary. We might try to gather more precise data (e.g., exact number of remarks, exact harm) and then make a best guess. The HA step would be seen as our best attempt to approximate the unknown boundary. The thresholds in step 2 might be treated as our current best estimate of the boundary.

  - **Degree Theory**: We might assign degrees of truth (e.g., each instance has a severity score, and we aggregate). The procedure would then set a threshold (e.g., overall score > 0.7). The HA step would be replaced by a calculation. However, the assignment of scores would be subjective.

  - **Contextualism**: The thresholds in step 2 might be adjusted by context (e.g., in a high-stress job, fewer remarks might be required). The HA step would be more frequent because context is case-specific.

  In practice, our procedure uses a mix: the thresholds are contextual (step 3 considers context), and the HA step allows for a contextual decision. But the overall structure (with fixed thresholds for repetition) is more in line with supervaluationism because we allow that the boundary is not fixed by language alone and requires a decision in borderline cases.

  Conclusion:

  This procedure provides a structured way to evaluate complaints that is grounded in vagueness theory. It avoids the sorites trap by using thresholds, controls the ratchet by limiting precedent, and handles disagreement by routing borderline cases to a designated human. It runs in under an hour and produces auditable rationales.
answer: |-
  Below is a decision procedure grounded in the philosophy of vagueness, designed for efficiency, consistency, and defensibility. It addresses the sorites paradox, ratchet effect, and investigator disagreement while incorporating key insights from epistemicism, supervaluationism, contextualism, and degree theories. The procedure uses plain language and includes a preamble to clarify terms.

  ---

  ### **Preamble: Key Definitions for Investigators**
  - **Tolerance Intuition**: A single additional minor incident usually doesn’t turn acceptable conduct into harassment. But this cannot apply indefinitely—eventually, accumulation matters.
  - **Borderline Case**: A situation where reasonable people could disagree about whether it violates the code. This doesn’t mean we lack facts; it means the facts don’t force one answer.
  - **Comparison Class**: The set of past cases used to judge severity or repetition. This must be limited to avoid unfair "ratcheting" of standards.
  - **Institutional Values**: Company-specific judgments (e.g., "How much discomfort is tolerable?") that investigators *cannot* decide alone. These require human arbitration.

  ---

  ### **Decision Procedure: Steps & Rules**
  **Time Budget**: 45 minutes per case (all steps). Document answers in the case file.  
  **Terminology**: Use plain English (no jargon). Focus on "reasonable person" standard from your policy.  
  **Output**: Written rationale tying facts to policy, citing steps below.

  1. **Assess Severity of Each Incident**  
     - Ask: *"Would a reasonable person find this single incident, viewed in isolation, so intimidating, hostile, or offensive that it crosses the line from unpleasant to severe?"*  
     - **Sufficient Answer**:  
       - **Yes** if: Incident involves threats, slurs, overt humiliation, or similar gravity. *Proceed to Step 4 (violation found)*.  
       - **No** if: Incident is merely rude, awkward, or mildly irritating. *Proceed to Step 2*.  
       - **Unclear** if: Incident is ambiguous (e.g., sarcasm with plausible deniability). *Document and flag for Human Arbiter (Step 5)*.  
     - *Philosophy Note*: Rejects the tolerance intuition for severe acts (epistemicism: a sharp boundary exists, even if hidden).

  2. **Assess Repetition**  
     - Ask: *"How many incidents occurred, and are they similar enough to form a pattern (e.g., same target, theme, or context)?"*  
     - **Sufficient Answer**:  
       - **Non-violation** if: ≤2 incidents *or* no clear pattern (e.g., random offhand remarks). *Dismiss complaint*.  
       - **Possible violation** if: ≥3 similar incidents. *Proceed to Step 3*.  
       - **Unclear** if: Ambiguous pattern (e.g., 3 incidents but widely spaced). *Flag for Human Arbiter (Step 5)*.  
     - *Philosophy Note*: Uses a low threshold (3+) to avoid sorites trap (supervaluationism: no single "cutoff," but 1–2 is clearly too few).

  3. **Assess Aggregate Impact**  
     - Ask: *"Would a reasonable person in the complainant’s position, facing this full set of incidents, find the work environment intimidating, hostile, or offensive?"*  
     - **Sufficient Answer**:  
       - **Yes** if: Complainant shows concrete harm (e.g., dreading work, performance decline) *and* incidents relate to protected traits (e.g., race, gender) *or* power imbalance. *Proceed to Step 4 (violation found)*.  
       - **No** if: No measurable impact *and* incidents lack protected-trait link (e.g., generic teasing between peers). *Dismiss complaint*.  
       - **Unclear** if: Impact is claimed but unproven, or context is atypical (e.g., high-banter team). *Flag for Human Arbiter (Step 5)*.  
     - *Philosophy Note*: Contextualism—meaning shifts with circumstances (e.g., "hostile" differs in a factory vs. an office).

  4. **Sustain Violation**  
     - **Finding**: Harassing conduct occurred.  
     - **Rationale Requirement**: Specify if violation hinges on severity (Step 1) or repetition + impact (Steps 2–3). *Do not cite prior cases as binding precedent*.

  5. **Human Arbiter (HA) Review**  
     - **Trigger**: Any "Unclear" outcome in Steps 1–3, *or* investigator uncertainty after 30 mins.  
     - **HA Role**: A designated senior manager (uninvolved in investigations) decides based on:  
       - Institutional values (e.g., "We prioritize psychological safety over casual banter").  
       - **Not** personal intuition or precedent.  
     - **Output**: HA issues brief written directive (e.g., "Sustain: repeated comments about accent undermine inclusivity"). Fold into rationale.

  ---

  ### **Addressing Hazards Explicitly**
  - **Sorites Trap**:  
    - **Solution**: Step 2 sets a low threshold (≥3 similar incidents) to force aggregation. Tolerance intuition is overridden here—the policy explicitly rejects evaluating incidents *only* in isolation.  
    - **Philosophy Grounding**: Supervaluationism—while no single incident may be decisive, the set can be "definitely harassing" across all reasonable interpretations.

  - **Ratchet Effect**:  
    - **Solution**: Precedents are **not** used in Steps 1–4. HA may consider past cases only if:  
      - (a) Context is identical (e.g., same department, similar role), *and*  
      - (b) The prior case was **not** borderline (to avoid amplifying arbitrary decisions).  
    - **Philosophy Grounding**: Contextualism—meaning depends on the current situation, not historical drift.

  - **Investigator Disagreement**:  
    - **Solution**: Treat disagreement as normal in borderline cases. Route all ambiguous cases to HA (Step 5) for consistency.  
    - **Philosophy Grounding**: Vagueness implies indeterminacy—disagreement signals a penumbra case, not investigator error.

  ---

  ### **Worked Examples**
  **Complaint 1: Accent Remarks**  
  - *Facts*: ~12 mild remarks over 4 months. Complainant dreads meetings. No witnesses call any single remark severe.  
  - **Procedure**:  
    - **Step 1**: No single incident severe → Proceed to Step 2.  
    - **Step 2**: ≥3 similar incidents (accent-focused) → Proceed to Step 3.  
    - **Step 3**: Aggregate impact: Reasonable person would dread meetings if targeted for accent (protected trait). Harm is concrete. → **Violation sustained**.  
    - **Rationale**: "While no single remark was severe, ≥12 similar comments about accent created a hostile environment for the complainant, per Step 3."  
  - *Why you might dislike this*: It sets a low bar for "repeated" conduct. But philosophy forces this—vagueness doesn’t permit dismissing clear accumulation.

  **Complaint 2: Two Incidents, One Vicious**  
  - *Facts*: Two incidents. One mild (e.g., "your presentation was confusing"), one severe joke mocking disability in front of a client.  
  - **Procedure**:  
    - **Step 1**: One incident (disability joke) is severe → **Violation sustained** (no further steps needed).  
    - **Rationale**: "The client-facing joke was severe under Step 1. No repetition analysis required."  

  **Complaint 3 (Hypothetical Unwelcome Outcome): Three Mild Teasing Comments**  
  - *Facts*: Three mild remarks (e.g., "Nice shoes... for a clown!") over 6 months. Complainant laughs along but later reports discomfort. No protected trait link.  
  - **Procedure**:  
    - **Step 1**: No severe incident → Proceed to Step 2.  
    - **Step 2**: ≥3 similar incidents → Proceed to Step 3.  
    - **Step 3**: Impact unclear. No performance decline, no protected trait, team known for banter. → **Refer to HA (Step 5)**.  
    - **HA Decision**: Likely dismissal. Institutional value: "We allow light teasing if mutual and not targeting vulnerabilities."  
  - *Where philosophy runs out*: HA must decide values—e.g., whether "hostile" includes mutual ribbing. Vagueness theory cannot resolve this.

  ---

  ### **Theory Commitment & Rival Approaches**
  - **This Procedure’s Implicit Theory**: **Contextual Supervaluationism**.  
    - Combines supervaluationism (borderline cases lack truth-value until precisified) with contextualism (meaning adapts to situation).  
    - Evidence: Step 3 uses context to fix meaning; HA "precisifies" borderline cases.  

  - **Rival Theories—What Would Change**:  
    - **Epistemicism**: Eliminate HA review (Step 5). Instead, train investigators to "discover" the sharp boundary (e.g., "Always dismiss at ≤4 incidents"). Ignores contextualism’s insights, worsening ratchet risk.  
    - **Degree Theory**: Replace Steps 2–3 with scoring (e.g., severity 1–10; aggregate ≥6 = violation). But scores are arbitrary—philosophy doesn’t justify specific numbers.  
    - **Pure Contextualism**: Allow precedents in all steps. This exacerbates ratchet but may feel "fairer" to employees.  

  ---

  ### **Summary**
  This procedure:  
  1. **Breaks sorites chains** with bright-line thresholds (≥3 incidents).  
  2. **Halts ratchet creep** by restricting precedents.  
  3. **Manages disagreement** with HA referrals for borderline cases.  
  4. **Acknowledges limits**—HA decides values, not vagueness.  

  **Implementation Tip**: Train investigators on the preamble first. Use a template for rationales to ensure consistency. HA should review 10% of dismissed/sustained cases to calibrate.
