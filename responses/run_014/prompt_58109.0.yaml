prompt: |-
  hey so I'm TA-ing this intro epistemology section and the week on stakes and knows always dies, everyone just nods along. I wanna make a little which camp are you really in quiz they can do in like 15 mins to start an arguement.

  Can you write me 7 questions, each one is a mini story with 2-3 gut-reaction answers, totally no jargon in the questions themselves. Like don't ever ask do you endorse contextualism, I want you to sort them by their reactions not by which label they think sounds cool.

  At the end I need a scoring key that puts answer patterns into these 4 buckets I have to cover: 1) stakes never change whether someone knows, 2) the stakes for the person doing the knowing can change whether they know, 3) the stakes/context of the person *talking* about knowing can change whether its true to say they know, 4) knowledge stays put but what its ok to say or do with it shifts with stakes.

  Build it from the logical space first — like what combinations of answers are even possible — then tell me where my 4 buckets live in that space. If theres a combo that no one actually defends tell me if you think its incoherent or just unexplored, and be honest if your quiz can't really seperate any two of my buckets.

  You gotta work in these two stories I came up with, you can tweak the details:

  Maya at the campus cafe: low version is she overhears the soup has no peanuts and tells a regular who just doesn't like the taste, high version is same evidence but she's telling a parent ordering for a kindergarten field trip where one kid has a deadly allergy. Does she know its safe in each?

  And the surgeon one: Luis double-checked the chart once and is pretty sure its the left knee. Case X is two friends gossiping about it over beers the night before, case Y is the hospital review board deciding whether to say Luis knew it was the left knee. Same facts about Luis, different talkers.

  Audience is non-majors who have never heard of this stuff, so keep it plain and a bit funny if you can.
reasoning: |-
  Okay, the user is a TA for an intro epistemology section and is struggling with the stakes and knowledge topic. Students just nod along without engaging. They want a quick 15-minute quiz to spark debate, using mini-stories with gut-reaction answers—no jargon. The quiz should sort students into four buckets about how stakes affect knowledge: whether stakes never matter, affect the knower, affect the speaker's context, or change what's appropriate to say or do.

  The user provided two stories: Maya at the campus cafe (low vs. high stakes for the person receiving info) and Luis the surgeon (low vs. high stakes for the person assessing knowledge). I need to build 5 more questions around these themes while keeping things simple and fun for non-majors. 

  I should map out the logical space first. The four buckets correspond to different philosophical positions: invariantism, subject-sensitive invariantism, contextualism, and pragmatic encroachment. To design the quiz, I need to see what combinations of answers are possible and how they align with these views. Some combinations might be incoherent or unexplored, and I should flag if the quiz can't cleanly separate certain buckets.

  For the stories, I'll tweak the user's examples: Maya's case tests if the receiver's stakes affect knowledge, while Luis's case examines if the assessor's context matters. I'll add more scenarios like a weather report (speaker's stakes), a lost phone (subject's stakes), and a bus schedule (pragmatic actions). Each question will have 2-3 plain-language options that feel intuitive.

  The scoring key must place answer patterns into the four buckets. I'll analyze how "yes/no" answers cluster across questions. For instance, consistently saying knowledge doesn't change points to invariantism, while varying answers based on the assessor's context suggest contextualism. I'll note if any combinations are messy—like the quiz might blur subject-sensitive invariantism and pragmatic encroachment since both focus on the knower's stakes affecting knowledge itself versus practical actions.

  I'll keep the language playful (e.g., "sweaty-palmed intern" in the surgeon story) to hold attention. Finally, I'll be honest about limitations: the quiz can distinguish invariantism and contextualism clearly but might have overlap between buckets 2 and 4. I'll suggest a disclaimer that real philosophers debate these nuances, and the quiz is a starting point for discussion.
answer: |-
  Here's a 15-minute quiz designed to spark debate by sorting students into your 4 buckets based purely on gut reactions to mini-stories, including your two requests. It avoids jargon like the plague and aims for clarity and a bit of humor.

  **The "Who Knew? Stakes & Knowledge Gut Check Quiz"**

  **Instructions:** Read each short story and pick the answer that feels *most right* to you *first*. Don't overthink it! There are no trick questions, just your gut instinct.

  1.  **The Lost Phone (Low Stakes):** Sam can't find their phone. They vaguely remember putting it on the charger in their bedroom this morning. They need to tell their roommate if it's definitely *not* in the living room so the roommate doesn't waste time looking. Sam quickly glances around the living room – no phone. Sam tells the roommate, "Yeah, I *know* it's not in the living room."
      *   **A)** Sam knows it's not in the living room. Good enough!
      *   **B)** Sam *doesn't* really know it's not in the living room. They barely looked!

  2.  **The Lost Phone (High Stakes):** Sam can't find their phone *which contains the only copy of their finished 50-page term paper due in 1 hour*. They vaguely remember putting it on the charger in their bedroom this morning. Sam *desperately* needs to know if it's *definitely* not in the living room before they tear apart their room. They quickly glance around the living room – no phone.
      *   **A)** Sam knows it's not in the living room. The glance was enough, even now.
      *   **B)** Sam *doesn't* know it's not in the living room anymore. They need to search way more carefully!

  3.  **Maya at the Cafe (Low Stakes):** Maya overhears the cafe worker tell the chef, "Remember, absolutely no peanuts in the special soup today." Her friend Alex, who just doesn't like the taste of peanuts, asks if the soup is peanut-free. Maya says, "Yeah, I *know* it is."
      *   **A)** Maya knows the soup is peanut-free. She heard it straight from the source.
      *   **B)** Maya *doesn't* really know. She just overheard it casually.

  4.  **Maya at the Cafe (High Stakes):** Same situation. Maya overhears the cafe worker tell the chef, "Remember, absolutely no peanuts in the special soup today." A parent, ordering soup for a kindergarten field trip where one child has a *deadly* peanut allergy, asks Maya if the soup is definitely peanut-free. Maya says, "Yeah, I *know* it is."
      *   **A)** Maya knows the soup is peanut-free. She heard the same thing as before.
      *   **B)** Maya *doesn't* know it's peanut-free *anymore*. This is too serious for just overhearing!

  5.  **The Weather Report (Chill Chat):** Lee is heading out for a casual walk in the park. They quickly check a free weather app on their phone, which says "0% chance of rain." Lee tells their friend, "I *know* it won't rain." It doesn't rain.
      *   **A)** Lee knew it wouldn't rain. The app said 0%!
      *   **B)** Lee didn't *really* know. Weather apps can be wrong.

  6.  **The Weather Report (Big Picnic):** Lee is organizing a large, expensive outdoor company picnic. They quickly check the same free weather app, which says "0% chance of rain." Relying on this, Lee tells the caterer to set up outdoors. Lee says, "I *know* it won't rain." It doesn't rain.
      *   **A)** Lee knew it wouldn't rain. Same app, same info!
      *   **B)** Lee *didn't* know it wouldn't rain. For something this important, they needed way more proof than just that app!

  7.  **Luis the Surgeon (Gossip Version):** Luis is a surgeon. He double-checked the patient's chart *once* earlier and is pretty sure (about 95%) it's the *left* knee needing surgery. The night before the surgery, two surgeon friends are gossiping over beers. One says, "Did Luis *know* it was the left knee before he scrubbed in?" (The surgery went fine on the left knee).
      *   **A)** Yeah, Luis knew it was the left knee. He checked the chart!
      *   **B)** No way, Luis didn't *know* it was the left knee. He only checked once? That's not enough for surgery!

  8.  **Luis the Surgeon (Review Board Version):** Same situation: Luis double-checked *once*, was 95% sure left knee. The surgery happened, but there was a complication (unrelated to the knee). The hospital review board is investigating *everything*. They ask, "Did Luis *know* it was the left knee before surgery?"
      *   **A)** Yes, Luis knew it was the left knee. His evidence was the same as always.
      *   **B)** No, Luis *didn't* know it was the left knee. For a formal review of a surgical procedure, just checking once isn't enough to say he *knew*.

  ---

  **Scoring Key & Logical Space Breakdown**

  **Step 1: Tally your answers.**

  For each question, note if you picked **A** (Knowledge is present/stable) or **B** (Knowledge is absent/shifted).

  **Step 2: The Logical Space & Your Buckets**

  The quiz tests reactions along two main axes (implicitly):
  1.  **Does the *Subject's* Stakes Matter?** (The person trying to know: Sam, Maya, Lee, Luis).
  2.  **Does the *Speaker/Assessor's* Stakes/Context Matter?** (The person saying "S knows" or judging if "S knows": Sam, Maya, Lee, the gossipers, the review board).

  Your 4 buckets map onto combinations of "Yes/No" to these axes:

  *   **Bucket 1: Stakes NEVER change whether someone knows. (Invariantism)**
      *   **Answers:** Consistently **A** on *all* questions, *especially* the High Stakes versions (Q2B, Q4B, Q6B) and the Review Board (Q8B). If stakes (subject's or assessor's) *never* matter, you always say the same evidence is enough for knowledge, regardless of the situation.
      *   **Logical Space:** "No" to both axes. Subject's stakes don't matter. Assessor's stakes/context don't matter. Knowledge is purely about the subject's evidence/facts.

  *   **Bucket 2: The stakes for the person *doing* the knowing can change whether they know. (Subject-Sensitive Invariantism / Interest-Relative Invariantism)**
      *   **Answers:** **B** on High Stakes for the *Subject* (Q2B - Sam's high stakes, Q6B - Lee's high stakes), but **A** on Low Stakes for the Subject (Q1A, Q5A) and **A** on questions focused on the *Assessor* (Q3A, Q4A, Q7A, Q8A). Maya's cafe is tricky; if you answered Q3A and Q4B, that points here (Maya's *subject* knowledge changes because the *receiver's* stakes *change the practical importance for Maya herself* in getting it right). If you answered Q3A and Q4A, that points away from this bucket.
      *   **Logical Space:** "Yes" to Subject's Stakes Mattering. "No" to Assessor's Stakes/Context Mattering. What it takes for *S* to know depends on *S's* practical situation.

  *   **Bucket 3: The stakes/context of the person *talking* about knowing can change whether its true to say they know. (Contextualism)**
      *   **Answers:** **A** on Low Stakes *Assessor* contexts (Q3A, Q7A - Gossip), but **B** on High Stakes *Assessor* contexts (Q4B - Parent, Q8B - Review Board). You should be consistent on the *Subject* focused questions: likely **A** on Q1A, Q2A, Q5A, Q6A (because the *subject's* situation/stakes isn't what shifts the meaning of "knows" - the *speaker's* context is). If you had **B** on Q2B or Q6B, it likely points *away* from pure Contextualism.
      *   **Logical Space:** "No" to Subject's Stakes Mattering. "Yes" to Assessor's Stakes/Context Mattering. The truth of "S knows P" depends on the standards in play *where the word "knows" is being used*.

  *   **Bucket 4: Knowledge stays put but what it's ok to say or do with it shifts with stakes. (Pragmatic Encroachment / Proper Function)**
      *   **Answers:** You lean **A** on *all* "Did they *know*?" questions (Q1A, Q2A, Q3A, Q4A, Q5A, Q6A, Q7A, Q8A). Knowledge itself is fixed by evidence. However, you strongly feel that in high stakes situations (Q2, Q4, Q6, Q8), while they *knew*, it was **reckless/irresponsible to act** or **claim knowledge** so confidently *based on that level of evidence*. You might have even wanted a "C) They knew, but shouldn't have said/acted like they *knew*" option. Luis (Q7/Q8) is key: You think Luis *knew* (A on both), but what was acceptable *for him to do* (operate based on one check) or *for the board to say* ("He knew" might imply sufficient diligence) changes.
      *   **Logical Space:** "No" to Subject's Stakes Mattering *for the truth of "S knows P"*. "No" to Assessor's Stakes Mattering *for the truth of "S knows P"*. BUT "Yes" to Stakes Mattering *for what actions/assertions are reasonable or proper* given that fixed knowledge state.

  **Crucial Notes on the Mapping & Limitations:**

  1.  **Maya's Cafe Ambiguity (Q3 & Q4):** This question straddles Bucket 2 and Bucket 3. Does the parent's high stake change *Maya's* epistemic position (Bucket 2) or just the standard for truthfully saying "Maya knows" in that conversation (Bucket 3)? The quiz *can't perfectly resolve this*. A student answering Q3A and Q4B could plausibly land in *either* Bucket 2 or Bucket 3. Use this as a discussion point! ("Why did Maya's answer change for you? Did *she* suddenly not know, or was it just wrong to *say* she knew?").
  2.  **Distinguishing Bucket 2 & Bucket 4:** This is the hardest split. The key is whether the student thinks knowledge *itself* vanishes in high stakes for the subject (Bucket 2 - "They didn't know!") or if knowledge *remains* but acting on it is reckless (Bucket 4 - "They knew, but wow, that was dumb!").
  3.  **Incoherent/Unexplored Combo?** A consistent "Yes" to *both* Subject's Stakes Mattering *and* Assessor's Stakes Mattering is theoretically possible ("Relativism" or complex hybrids), but it's less common and often seen as messy. The quiz doesn't strongly push anyone here. If someone answers **B** on *all* high-stakes variants (Subject *and* Assessor) but **A** on low-stakes, they might be flirting with this. It's not incoherent, just less defended and potentially unstable. It likely indicates deep stakes-sensitivity but unresolved tension about *whose* stakes matter most.
  4.  **Can the Quiz Separate All Buckets?** **Almost, but not perfectly:**
      *   **Bucket 1 (Invariantism)** is easily identified by all **A**s.
      *   **Bucket 3 (Contextualism)** is identified by **A**s on Subject-focused questions and **B**s on High-Stakes *Assessor* questions (especially Q8B - Review Board).
      *   **Bucket 4 (Pragmatic Encroachment/Proper Function)** is identified by all (or nearly all) **A**s on the "knows?" questions, coupled with a strong intuition that acting/asserting knowledge in high stakes was problematic *despite* knowing.
      *   **Bucket 2 (Subject-Sensitive)** is trickiest. Look for **B**s on *Subject*-High-Stakes (Q2B, Q6B) while having **A**s on Low-Stakes and *Assessor*-focused questions (Q3A, Q7A, Q8A). **The main overlap/confusion is with Bucket 3 on Q3/Q4 and with Bucket 4 on Q2/Q6.**
  5.  **The Luis Questions (Q7 & Q8) are Key Discriminators:** They most cleanly isolate **Bucket 3 (Contextualism)**. Someone in Bucket 3 *must* answer Q7A (Gossip - Low Standards = Knows) and Q8B (Review Board - High Standards = Doesn't Know). Other buckets will likely answer A on both or B on both.

  **How to Use It:**

  1.  Give the quiz (5-7 mins).
  2.  Have students tally their **A**s and **B**s.
  3.  **Don't reveal the buckets yet!** Ask for reactions: "Who mostly picked A? Mostly B? Who changed answers between low and high stakes? On which questions? Why?"
  4.  Let them argue briefly based on the stories.
  5.  **Then** reveal the 4 buckets and the scoring logic. Explain them simply using the stories:
      *   "Team Never Changes: You thought Sam knew his phone wasn't there even when his paper was on the line, and the review board should admit Luis knew."
      *   "Team Knower's Stakes Change Knowledge: You thought Sam *stopped* knowing where his phone was when the paper was due, but the gossipers and the review board should agree on whether Luis knew."
      *   "Team Talker's Context Changes Truth: You thought whether it's *true to say* Maya knew or Luis knew depended on who was asking and why, even if the facts about them were the same."
      *   "Team Knowledge Stays, Actions Shift: You thought Sam always knew where his phone was and Luis always knew the knee, but acting like you *knew* based on a glance or one check in those high-stakes situations was crazy risky."
  6.  Let them see which bucket they landed in and debate *that*. The ambiguity points (Maya, distinguishing 2 & 4) are perfect discussion fuel.

  This should definitely get them arguing! Good luck!
