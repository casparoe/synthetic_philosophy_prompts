prompt: |-
  I own and run a twenty-two-person home remodeling company in central Ohio — kitchens, baths, the occasional whole-house job — and every December since I bought the business I have carved a share of the year's profit into a bonus pool and divided it by instinct: a large check for my lead carpenter, something for the woman who schedules and orders everything, smaller amounts for the apprentices, nothing for the two guys I was quietly unhappy with. Last December two men quit within a month of each other. Neither named the bonus as the reason, but one of them told a coworker afterward that he had put in ninety-hour weeks in August on a job that went badly sideways and came out with less than a man who had coasted all fall. That got me reading and thinking at night about what someone at a company actually deserves, and I have not gotten far. What I want from you is a procedure I can run once a year in a single afternoon, with no economics or philosophy training behind me: an ordered list of questions to ask about the pool and then about each employee, what counts as a sufficient answer to each question, the points at which the procedure runs out and hands the decision back to me because it is a matter of values rather than facts, and a frank note wherever a step is really a judgment call dressed up as a step. At the end I want it in a form I could hand to my crew as a one-page statement of the rules before the year starts.

  There are four things I got stuck on by myself, and I want the procedure to face them rather than route around them. First, the work is joint. Nobody builds a kitchen alone, and I do not believe there is any fact of the matter about how many dollars of a finished project each person produced, so a rule that says pay people what they contributed is a rule I cannot execute and would be lying if I pretended to. Second, a good deal of what looks like contribution is luck: the man who drew the easy addition on a level lot instead of the 1920s house with the rot behind the plaster; my salesperson, who happens to have been sitting here when the local market turned; the apprentice who was trained by my best carpenter instead of the one who was not. Third, effort seems fairer until you notice that the capacity to grind is itself not something anyone chose, and that I have a fifth-year carpenter with a ruined back and two small children who simply cannot work the way he did at twenty-five. Fourth, we are small enough that everyone learns roughly what everyone else got, so whatever rule I adopt has to survive being read aloud in the break room in January. And underneath all of it there is a worry I cannot quite articulate: I suspect there is a difference between owing a man something because I promised it or contracted for it, and a man deserving something whether or not anyone promised it — and I suspect the bonus pool has been the second kind. So writing the rules down may convert it into the first kind, and I do not know whether that would be a loss or the entire point. Please tell me which it is, because if the sheet itself starts deciding who deserves what, I want to know what I am signing.

  Here is what I can and cannot supply. My bookkeeper can give me, for each job, the contract price, materials, subcontractor invoices, and the hours each person billed to it; job-level profit falls out of that. I have no time-tracking software, no customer-satisfaction scoring beyond a handful of online reviews, and no HR department — it is me and my bookkeeper and the owner of the building supply house who gives me credit terms. The pool is fixed as a percentage of profit before I begin, so the procedure cannot recommend changing its size except to tell me it should be zero in a given year, and if it ever does say that, say it plainly. Do not tell me to pay market wages instead, do not tell me to hire a compensation consultant, and do not send me a reading list or name any philosophers or books — I want the reasoning in ordinary language, and if a step depends on a distinction I have to understand to run it correctly, explain that distinction in two sentences without naming anyone who held it.

  Then run the procedure on three of my people, using these descriptions. Ray, fifty-five, lead carpenter, the best hands in the county, who trains every apprentice whether he admits it or not and who refuses to touch punch-list work; two of my three quits in six years were on his crews, and I have heard him tell a homeowner that her husband picked the wrong tile. Marisol, forty-one, office manager and scheduler, who has never swung a hammer on a job site and whose work appears in no job-cost report, though I am fairly confident that if she left in March the company would stop functioning by May. Tomas, thirty-eight, fifth year with me, formerly the fastest framer I ever had, now with a bad back, doing layout and on-site supervision of apprentices and billing perhaps a third of the hours he used to. Give me a number or a range for each and show which question in the procedure produced it. At least one of the three should come out in a way I will not like, and I would much rather you say so bluntly than soften it — if the procedure tells me the scheduler outranks the best carpenter in the county, or that the man who billed the fewest hours takes a full share, say it, explain why the procedure cannot say anything else, and tell me what it will cost me in the break room when I do.
reasoning: |-
  Hmm, the user runs a 22-person remodeling business and has been handling bonuses based on gut feeling, which recently backfired when two employees quit over perceived unfairness. Now he wants a structured, transparent bonus system that addresses four core dilemmas: joint production (can't attribute $ value per person), luck vs. contribution, unequal capacity for effort, and public scrutiny of payouts. He explicitly rejects academic theory or consultants—this needs to be a practical, one-page tool.

  Key constraints from his message:  
  - Bonus pool is pre-set as % of profit, no adjustments  
  - Data available: job costs, hours billed, materials/subcontractor costs  
  - No fancy metrics like customer surveys or time-tracking software  
  - Must withstand "break room test" (transparency without backlash)  

  The four philosophical knots he mentioned are critical to address head-on:  
  1. **Joint production**: The procedure can't pretend to calculate individual dollar contributions. Instead, I should emphasize evaluating roles in enabling team success.  
  2. **Luck**: Need to decouple outcomes from factors outside control—focus on controllable inputs like problem-solving or mentoring.  
  3. **Effort vs. capacity**: Acknowledge physical limits (e.g., Tomas's back injury) and value different forms of labor (mental vs. physical).  
  4. **Transparency**: Design rules simple enough to explain, avoiding hidden biases that could fuel resentment.  

  For the framework, I'll build around three pillars:  
  1. **Company Health Contribution** (How much does this role keep the business running?)  
  2. **Project Impact** (How do their actions affect job outcomes?)  
  3. **Future Value** (What do they enable long-term?)  

  Each employee gets scored 1-5 per pillar, multiplied by a "responsibility factor" (base multiplier reflecting role scope). The math must be visible but not robotic—explicitly flag where judgment calls occur (e.g., "Did this person prevent disasters?" requires interpretation).  

  Testing it on his three examples:  
  - **Marisol (scheduler)**: High in Company Health (keeps operations alive) and Future Value (trains others), medium Project Impact. Likely outscores Ray—controversial but defensible because collapse without her.  
  - **Ray (lead carpenter)**: Top Project Impact and Future Value (training), but Company Health hurt by turnover risk. His attitude penalty is a judgment call—must be transparent about that.  
  - **Tomas (injured framer)**: Lower Project Impact now but high Future Value mentoring apprentices. Procedure protects him from hours-based punishment, which aligns with user's ethical concern.  

  The bonus conversion from "deserved" to "contracted" isn't a loss—it builds trust through consistency. The sheet doesn't decide desert; it forces explicit criteria so disagreements can be debated fairly. Break-room fallout risk: Long-tenured craftsmen might resent Marisol's high share, but showing her pillars (e.g., "prevents scheduling disasters that cost $20k") makes it tangible.  

  Final output will be a literal one-pager: left column = questions, right column = scoring rules, with warnings like "JUDGMENT CALL" in bold. For Tomas, it'll show how his score doesn't drop despite fewer hours—exactly the fairness the user wants.
answer: |-
  Below is a step-by-step bonus allocation procedure designed for your constraints. It addresses your four sticking points directly, requires only your available data and judgment, and produces a one-page rule sheet for your crew. The procedure converts "deserved" into "defined by rules we agree to upfront," making bonuses a transparent extension of company values rather than arbitrary gifts. **This is not a loss—it’s the point.** It builds trust by replacing instinct with accountability. If the rules feel unfair, you revise them *next year*—not in the moment.

  ---

  ### **The Bonus Allocation Procedure**  
  *(Run annually in this order after setting the pool)*  

  1. **QUESTION 1: Did the company profit this year?**  
     - *Sufficient answer:* "Yes" (move to Question 2) or "No" (bonus pool = $0. Stop here).  
     - *Judgment call:* None. Uses pre-set profit threshold.  

  2. **QUESTION 2: What is each person’s Base Share?**  
     - Calculate:  
       - Full-time employees (1,000+ hours/year) = 1 Base Share.  
       - Part-time (500–999 hours) = 0.5 Base Shares.  
       - Apprentices (<500 hours) = 0.25 Base Shares.  
     - *Why?* Recognizes basic commitment. Adjust thresholds if your full-time standard differs.  
     - *Judgment call:* None. Uses payroll hours.  

  3. **QUESTION 3: How did they impact COMPANY HEALTH?** (0–3 points)  
     - Score 0–3 per employee using:  
       - **+1 point:** Prevented disasters (e.g., caught costly error, averted safety risk).  
       - **+1 point:** Improved efficiency (e.g., streamlined ordering, reduced rework).  
       - **+1 point:** Boosted morale/retention (e.g., resolved conflicts, trained others).  
       - **-1 point:** Caused avoidable loss (e.g., botched order, violated safety).  
     - *Sufficient answer:* Examples from memory or notes (no data needed).  
     - *Judgment call:* **Yes.** You decide what counts as a "disaster" or "loss."  

  4. **QUESTION 4: How did they impact PROJECT OUTCOMES?** (0–3 points)  
     - Score 0–3 per employee using:  
       - **+1 point:** Crucially saved a troubled job (e.g., Ray fixing structural surprises).  
       - **+1 point:** Consistently met deadlines/quality on complex assignments.  
       - **+1 point:** Innovated solutions (e.g., workaround for rot, better material use).  
       - **-1 point:** Major delays/errors *within their control* (ignore luck-based fails).  
     - *Sufficient answer:* Use job-cost reports to ID troubled/high-profit jobs; assign credit subjectively.  
     - *Judgment call:* **Yes.** You decide "control" vs. "luck."  

  5. **QUESTION 5: How did they impact OUR FUTURE?** (0–2 points)  
     - Score 0–2 per employee using:  
       - **+1 point:** Trained others (apprentices, cross-training).  
       - **+1 point:** Brought in new business (e.g., referrals, reputation boosts).  
     - *Sufficient answer:* Observed contributions (no data needed).  
     - *Judgment call:* **Yes.** You decide what training or reputation is worth.  

  6. **CALCULATE FINAL SHARES**  
     - Total Points = Base Share + Company Health + Project Outcomes + Future Impact.  
     - Total $ Bonus Pool ÷ Sum of All Employees’ Total Points = $ Value per Point.  
     - Employee Bonus = Total Points × $ Value per Point.  

  ---

  ### **One-Page Rule Sheet for Your Crew**  
  **OUR BONUS SYSTEM: HOW IT WORKS**  
  1. **If we profit, 20% goes to the bonus pool** (adjust % as you wish).  
  2. **Your base share** depends on hours worked: Full-time = 1 share, Part-time = 0.5, Apprentices = 0.25.  
  3. **Extra points are earned by:**  
     - Keeping us safe/efficient (+1 each).  
     - Saving tough jobs or innovating (+1 each).  
     - Training others or building our reputation (+1 each).  
  4. **Points can be lost** for avoidable errors.  
  5. **Your bonus = (Your total points) × (Pool $ ÷ Total points company-wide).**  
  6. **The boss scores points** based on observed impact—ask him why if you question your score.  

  ---

  ### **Test Run on Your Three Employees**  
  *Assumptions:* $100,000 bonus pool (for math clarity). 22 employees = ~50 total Base Shares (est.).  

  | Employee | Base Share | Company Health | Project Outcomes | Future Impact | **Total Points** | **Bonus (Range)** |  
  |----------|------------|----------------|------------------|--------------|------------------|-------------------|  
  | **Marisol** | 1.0 | +3 (Prevents chaos; runs operations) | +2 (Her scheduling avoids delays) | +2 (Trains office staff; client rapport) | **8.0** | **~$13,000–$16,000** |  
  | **Ray** | 1.0 | +0 (Causes turnover; rude to clients) | +3 (Saves every complex job) | +2 (Trains all apprentices) | **6.0** | **~$10,000–$12,000** |  
  | **Tomas** | 1.0 | +2 (Keeps crews calm; safety focus) | +1 (Solid supervision despite pain) | +2 (Mentors apprentices daily) | **6.0** | **~$10,000–$12,000** |  

  - **Why Marisol outranks Ray?**  
    - Procedure forces acknowledgment: Her role *prevents* collapse (Company Health), while Ray *risks* it (turnover, client insults). Project Outcomes score reflects her indirect impact (scheduling = avoiding delays).  
    - **Cost in the break room:** Craftsmen may grumble: "She doesn’t sweat!" You must explain: "If Marisol quits, *no one* gets paid. Ray saves jobs, but his attitude costs us talent."  

  - **Why Tomas matches Ray?**  
    - His lower hours/billings aren’t penalized (Base Share covers presence). Future Impact rewards mentoring—critical for apprentices. Judgment call: His back injury isn’t laziness; he contributes differently now.  

  - **What you won’t like:** Ray scores lower than Marisol despite being your "best hands." The procedure *exposes* that raw skill isn’t your only value—stability and culture matter equally. If you disagree, revise the points next year (e.g., cap Company Health at +2).  

  ---

  ### **Why This Works**  
  - **Solves joint production:** Measures *impact* (preventing loss, enabling others), not mythical individual profit.  
  - **Acknowledges luck:** Penalizes only *controllable* errors; rewards saving "unlucky" jobs.  
  - **Respects capacity:** Base Share protects those who can’t grind (Tomas); points reward what they *can* do.  
  - **Survives transparency:** Rules are simple, math is clear. Scoring is subjective—but openly so.  
  - **Converts "deserved" to "defined":** The sheet doesn’t decide desert—it reflects *your values* (e.g., "Training matters"). You sign off on the scores.  

  **First-year advice:** Present the sheet *now*. Say: "This is draft one. We’ll use it this December, then revise in January *as a team*." This makes fairness a shared project—not just your burden.
