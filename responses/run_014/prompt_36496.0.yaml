answer: |-
  Your analysis is sharp, and the frustration is warranted – the heterogeneity debate *does* feel stuck. Let's dissect the nature of the disagreement and prospects for progress:

  1.  **It's Not *Merely* Verbal (Though Language Plays a Role):**
      *   You're right that "pleasant" has dual uses: phenomenal ("feels good") and evaluative ("this is good for me"). Each camp prioritizes one.
      *   **But:** The *core* disagreement runs deeper. The felt-quality camp (e.g., Sidgwick, Moore, some modern qualia-focused philosophers) insists introspection reveals a distinct, intrinsic, non-intentional *feeling* common to all pleasures – a "hedonic glow" or "positive affect tone" that is *part of* the experience itself, irrespective of its object or consequences. The dispositional/appraisal camp (Ryle, Gilbert Ryle, Alston, perhaps Feldman) argues that introspection reveals only intentional states (focusing on the water, the proof, the relief) and dispositions (to seek more, to linger, to avoid interruption), with "pleasantness" being a *judgment* or *appraisal* *about* those states and dispositions.
      *   **Why not purely verbal?** Because both sides claim to be describing the *same introspective data* and *disagree fundamentally on what that data contains*. The felt-quality camp says the tone *is there* to be noticed; the dispositional camp says it *isn't there*, only the activities/dispositions are. This is a substantive disagreement about the *structure of consciousness*.

  2.  **It's Partly a "Bedrock" Introspective Disagreement (But Not Wholly):**
      *   At its heart, there is a clash of introspective reports. One group says, "Look inward at the relief when the headache lifts; besides the *absence* of pain, there's a *positive warmth/flush/glow*." The other says, "Look inward; the 'pleasantness' *just is* the relief itself (the removal of pain) and the disposition to welcome it and want that state to continue – there's no extra 'glow'."
      *   **Why "bedrock"?** Introspection is the ultimate court of appeal for phenomenal claims. If trained, honest observers fundamentally disagree on what they find when attending to their own experience, it's hard to see how argument alone can resolve it. Each side accuses the other of misdescription or projection. The felt-quality camp says dispositionalists are "tone-deaf" to their own experience; dispositionalists say felt-quality advocates are reifying a linguistic artifact ("pleasant") or misattributing other elements (like bodily sensations accompanying *some* pleasures).

  3.  **It Involves (Deeply Entrenched) Theoretical Commitments:**
      *   **Felt-Quality Camp:** Often grounded in a commitment to qualia, intrinsic properties of experience, and the idea that value/badness must have a direct phenomenal correlate. Hedonism *needs* this common phenomenal currency to make sense of "maximizing pleasure" as a coherent goal.
      *   **Dispositional/Appraisal Camp:** Often grounded in philosophical behaviorism, functionalism, or skepticism about "raw feels." They see "pleasantness" as a relational property (X is pleasant *for* S *at* t *because* S is disposed to...). Hedonism, for them, becomes about maximizing states of the subject that they are disposed to welcome/seek/maintain. This avoids the heterogeneity problem but raises questions about the unity of "disposition to welcome."

  4.  **Empirical Input *Can* Play a Role (But Won't Settle the Core Dispute):**
      *   **Neuroscience:** Work on reward systems (e.g., dopamine, opioid systems) shows diverse neural pathways involved in different pleasures (sensory, cognitive, social, relief). This *complicates* the felt-quality picture (is there *one* neural correlate for the "glow"? Probably not) but doesn't disprove it (maybe the glow is a higher-order integration?). Conversely, it supports the dispositional view by highlighting the role of motivation, learning, and wanting/liking distinctions (Berridge).
      *   **Psychology:** Studies on affective forecasting, miswanting, and the focus of attention during pleasure can inform *how* we appraise states and what we attend to. Does focusing on the "feeling itself" during different pleasures reveal a common element, or does it distort the experience? Results are mixed and interpretable by both sides.
      *   **Limits:** Neuroscience correlates neural activity, not subjective feels. Psychology studies appraisals and reports, not necessarily the intrinsic structure of experience. Neither can *directly* resolve the introspective disagreement about whether a common phenomenal quality exists *as experienced*.

  **What Progress Could Look Like (Realistically):**

  1.  **Reframing Hedonism's Needs:** The most promising path is questioning the *assumption* that hedonism *requires* a single, intrinsic phenomenal property. Progress might involve:
      *   **Sophisticated Dispositional/Appraisal Theories:** Developing robust accounts showing how diverse states unified *only* by the subject's concurrent appraisal ("this is good for me now") or disposition (to sustain/seek) can form a coherent basis for ethical hedonism, without needing a common "feel." Feldman's work on "attitudinal pleasure" (taking pleasure *in* something) is an example.
      *   **Family Resemblance or Cluster Concepts:** Acknowledging heterogeneity and arguing pleasures form a Wittgensteinian "family" sharing overlapping features (desired, welcome, intrinsically motivating to sustain, etc.) without one essential commonality. Hedonism becomes a claim about maximizing states bearing *enough* of these features.
      *   **Teleological Unification:** Pleasures are unified by their *role* or *function* in the organism's economy (states the organism is motivated to produce/consume for their own sake), not by a shared intrinsic feel.

  2.  **Sharpening the Distinction & Its Implications:** Progress often comes from clearer articulation of the *costs* of each view:
      *   What does the dispositionalist say about masochistic pleasure or "pleasures" one doesn't endorse? Can they handle Butler's point without smuggling in phenomenology?
      *   Can the felt-quality advocate *positively* characterize the "hedonic tone" beyond "it's the pleasant part"? Can they explain why it feels so different in such diverse experiences? Does their view lead to an implausible "pleasure atomism"?
      *   Clarifying how each view handles the relationship between pleasure and motivation, pleasure and attention, pleasure and pain relief.

  3.  **Empirical Constraints:** While not settling the core dispute, empirical findings can:
      *   Challenge simplistic versions of either view (e.g., showing distinct neural pathways undermines the simplest "one feel" view; showing dissociations between "liking" and "wanting" challenges simple dispositionalism).
      *   Inform our understanding of attention, appraisal, and report, helping to diagnose potential introspective errors or biases claimed by each side.

  **Honest Answer on Progress:**

  *   **Don't expect a knockout argument** that convinces the other side to abandon their core introspective conviction or theoretical commitments. The disagreement taps into fundamental divides in philosophy of mind (qualia realism vs. anti-realism, intentionalism) and meta-ethics (nature of value).
  *   **Progress is more likely in:**
      *   **Refinement and Nuance:** Developing more sophisticated versions of dispositional/appraisal hedonism that convincingly handle the diversity *without* needing a common feel.
      *   **Clarification:** Making the stakes, costs, and implications of each view clearer, helping others see where they stand.
      *   **Shifting the Debate:** Moving the focus *away* from the intractable "is there one feel?" question towards questions like "What *unifies* pleasures for the purpose of ethical hedonism, given their heterogeneity?" or "How does the appraisal/disposition function work across diverse cases?"
      *   **Conceptual Engineering:** Offering alternative frameworks for hedonism (like attitudinal pleasure) that bypass the heterogeneity problem altogether.

  **In essence:** The heterogeneity debate likely *won't* be resolved on its own terms. The felt-quality/dispositional impasse is probably fundamental. **Real progress lies in reformulating what hedonism needs to survive heterogeneity or developing compelling alternatives that don't rely on a dubious phenomenal unity.** The debate's persistence highlights the deep difficulty of grounding value directly in subjective experience when that experience appears irreducibly diverse. Your instinct to question the *premise* that hedonism needs one property is spot-on; that's where the path forward likely lies.
