prompt: |-
  I sit on the resource-allocation council of Taveta, a small island cooperative. The island runs on a single freshwater aquifer that, at our current technology, can sustain about 1,000 people year-round; we treat that number as a hard ceiling rather than a target. We currently number 990. When newcomers arrive, the council decides how many to admit and how to adjust water rations, and we record a short rationale for each decision.

  Our last three recorded decisions:

  - Two years ago, a landslide on a neighboring island displaced 24 people who were in immediate danger (no shelter, no water). We were at 950. We admitted all 24, taking us to 974, and, by resident vote, cut everyone's water ration 2% for the year to make room. Recorded rationale: "people in immediate danger of death or destitution."
  - Last year, a mainland government offered to send 120 seasonal workers; none were in danger, and admitting them would have taken us to 1,094, past the aquifer line. We declined. Recorded rationale: "admitting them would take us past the aquifer's carrying capacity."
  - Six months ago, 8 people fleeing an active war arrived, in immediate danger of being killed. We were at 980. We admitted all 8, taking us to 988, and, by resident vote, cut the ration 1%. Recorded rationale: "people in immediate danger."

  Now 40 survivors of an ongoing genocide have reached our harbor. They are in immediate, life-threatening danger, though not all equally: 12 come from a village under active attack that is expected to be destroyed within days, and the other 28 are in a besieged camp facing slow starvation. Admitting all 40 would take us to 1,030, past the aquifer line; at current technology we can sustain at most 1,000, so admitting all 40 would require either building a desalination plant (a large one-time cost plus a sustained ration cut for existing residents) or accepting a slow water shortage.

  Working only from this record, please address the following: (1) name the distinct rules or principles our three decisions are jointly consistent with; (2) say what each of those rules predicts we should do in the genocide case; (3) give your best guess for the decision that best coheres with our own precedents, identify which of the three precedents is the closest analog, and explain why that analog does not actually settle the new case; (4) for each of the three plausible decisions — admit all 40 and commit the residents to the desalination cost; admit only up to the 1,000 line and turn away the rest; admit only as many as the residents vote to bear the cost for — state plainly what principle the council would be adopting by choosing it; and (5) name one further case, different from the genocide case, whose outcome would tell us which of the candidate rules we have actually been running.

  If you think this framing is confused — for example, if the three precedents do not genuinely underdetermine the rule the way I believe they do, or if there is no real divergence among the candidate rules to work with — say so plainly rather than forcing an answer. Please keep the entire response under 800 words.
reasoning: |-
  Okay, let me approach this Taveta resource-allocation problem systematically. The user presents a complex ethical dilemma with clear precedents, and I need to extract coherent principles from their past decisions while respecting the constraints.

  First examining the precedents:
  - The landslide case (24 people admitted at 950 pop) shows willingness to exceed carrying capacity for imminent mortal danger, with residents absorbing a ration cut.
  - Rejecting seasonal workers at 120 over capacity demonstrates a hard limit when no danger exists.
  - The war refugees case (8 admitted at 980 pop) reinforces the life-threatening danger principle with proportional ration cuts.

  For the genocide case, three distinct principles emerge from these precedents:
  1) **Imminent mortality principle**: Only admit those facing certain death without help (predicts admitting the 12 from the village).
  2) **Absorption capacity principle**: Admit only as many as current residents vote to support via ration cuts (amount uncertain).
  3) **Carrying capacity principle**: Strictly prohibit exceeding 1000 regardless of circumstance.

  The war refugees case feels closest as analog due to "immediate danger" rationale, but it differs crucially because admitting all 40 would require infrastructure investment rather than simple ration cuts. This breaks direct precedent alignment.

  When evaluating decision options:
  - Admitting all 40 with desalination adopts a "collective burden principle" where residents permanently subsidize newcomers.
  - Admitting only to 1000 uses "strict scarcity realism" prioritizing system integrity.
  - Admission by vote implements "democratic sacrifice principle" making aid contingent on current residents' willingness.

  To resolve the ambiguity, I consider proposing a test case: What would Taveta do if 15 people arrived with contaminated water causing slow poisoning? The outcome would clarify whether "immediate danger" requires instant lethality or includes prolonged threats, thus distinguishing between principle 1 and 2.
answer: |-
  Based strictly on Taveta's decision record, I identify three distinct principles jointly consistent with all precedents:

  1.  **Immediate Mortality Principle:** Admit those facing *imminent, certain death* without rescue, even beyond aquifer capacity, requiring proportional ration cuts *by resident vote*.
  2.  **Absorption Capacity Principle:** Admit only as many as current residents vote to bear the cost for via ration cuts, strictly limiting newcomers to those in danger.
  3.  **Strict Carrying Capacity Principle:** Never exceed the aquifer's 1,000-person sustainability limit, regardless of circumstance.

  **Predictions for the Genocide Case:**
  *   **Immediate Mortality Principle:** Predicts admitting the 12 from the village under *active, imminent attack* (certain death within days), but not the 28 facing *slow starvation* (uncertain timing). Requires resident vote for ration cuts.
  *   **Absorption Capacity Principle:** Predicts admitting only as many as residents vote to support via ration cuts for the year. The number admitted could be 0, 12, 40, or anything in between, depending solely on the vote.
  *   **Strict Carrying Capacity Principle:** Predicts admitting *no one*, as 980 + any admission > 1,000.

  **Best Guess & Closest Analog:**
  Your decision record most strongly supports admitting the 12 villagers facing *imminent attack* under the **Immediate Mortality Principle**, with a resident vote for ration cuts. The **war refugee case (8 admitted)** is the closest analog due to the "immediate danger of being killed" rationale matching the villagers' plight. However, it does *not* settle the new case because:
  1.  The war case involved admission *without* exceeding the aquifer limit (980+8=988<1000). Admitting even 12 now (980+12=992) stays under, but the council must also decide on the 28 facing starvation.
  2.  The starvation group presents a new category: *severe, life-threatening danger* but *not imminent, certain death*. The precedents don't clarify if "immediate danger" includes slower threats like starvation.

  **Principles Adopted by Each Decision:**
  1.  **Admit all 40 + desalination:** Adopts a **Collective Burden Principle**. Taveta commits to permanently subsidizing newcomers' survival (via infrastructure costs) whenever faced with extreme humanitarian crises, regardless of aquifer limits or resident consent for the *permanent* burden.
  2.  **Admit only up to 1,000 (e.g., 20 people):** Adopts a **Scarcity Realism Principle**. Absolute resource limits override all humanitarian concerns, even imminent death. Exceptions only allowed if they don't breach the hard ceiling.
  3.  **Admit only as many as residents vote to fund:** Adopts a **Democratic Sacrifice Principle**. Aid is contingent solely on current residents' willingness to bear *immediate* costs (ration cuts). Danger provides eligibility but not a right to admission.

  **Test Case to Distinguish Rules:**
  The outcome for the following case would distinguish the principles:
  *   **The Contaminated Well Case:** 15 people arrive from an island where their sole water source has been poisoned. Death is certain within 3-4 weeks without rescue. Taveta is at 985.
      *   **Immediate Mortality Principle:** Likely *rejects* them ("immediate danger" requires more imminent threat).
      *   **Absorption Capacity Principle:** Admits only if residents vote for ration cuts (number admitted depends on vote).
      *   **Strict Carrying Capacity Principle:** *Rejects* them (985+15=1000, but likely seen as exceeding the sustainable "year-round" capacity).
      *   **(If admitted, it shows "immediate danger" includes slower, certain death; if rejected, it confirms only instant threats qualify.)**

  **Framing Assessment:** Your framing is coherent. The precedents genuinely underdetermine the rule because they don't address: 1) Danger with uncertain timing (starvation vs. bombardment), 2) Exceeding capacity *requiring permanent investment* rather than temporary ration cuts, and 3) Whether resident votes are *required* or merely *practical* for ration cuts. The principles above capture the core divergence in interpreting the rationales and constraints.
