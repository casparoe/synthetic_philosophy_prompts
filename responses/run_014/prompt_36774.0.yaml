prompt: |-
  I'm a retired radio astronomer who's spent the last two years catching up on philosophy, and decision theory has become my latest rabbit hole. In my working life expectations were always friendly things — you average enough noisy voltages, the noise converges, that's basically the whole job — so the classic paradoxes here hit me harder than they probably should. I've got a decent handle on St. Petersburg: flip a coin until it lands heads, the payoff doubles each time it lands tails, and the expected value ends up being a sum whose terms don't shrink, so it just diverges to infinity. Fine. I've seen a million divergent series in my life, I know how to not be scared of them. But then I ran into the so-called Pasadena game (I believe this is due to Nover and Hájek, though I might be garbling the details), and I'm struggling to see whether it's a genuinely *different* and deeper problem or just St. Petersburg in a costume. As I understand it, the payoffs alternate in sign with magnitudes something like 2 to the n divided by n, so that when you compute the expectation, the terms end up being basically the alternating harmonic series: summed in the natural order it converges to ln 2 (of all things!), but the positive terms alone sum to +infinity and the negative terms alone sum to -infinity, so the "total expectation" isn't infinite — it's undefined.

  So here's what I'd like from you: a proper comparison of the two paradoxes. Is my instinct right that the Pasadena game is basically the Riemann rearrangement theorem doing a cameo in decision theory, or does that analogy break down? (One thing that nags me: nobody actually re-orders the tosses of a single gamble — the order is fixed by the setup — so is the "rearrangement" business even a legitimate move here, or just a metaphor?) And which situation is worse for the expected-utility theorist: a gamble whose expectation is infinite, or a gamble with no expectation at all? My gut says "undefined" is the more corrosive one — with St. Petersburg you can at least mutter about utilities being bounded or real casinos having finite bankrolls, but with Pasadena it's not even clear what the question "what would you pay to play?" means, since different sensible-looking ways of adding up the same terms give different answers. But maybe I'm overreacting, and a divergent series was the deeper embarassment all along. Relatedly: do the standard patches — bounded utility functions, capping payoffs somewhere, whatever else is on offer — fix both paradoxes in one go, or are they genuinely separate repairs? Feel free to get technical with me, sums and convergence talk won't scare me off, I did this for a living.
reasoning: |-
  Okay, let's tackle this retired radio astronomer's question. They're deep into decision theory paradoxes, having grasped the St. Petersburg but now wrestling with the Pasadena game. Their core question is whether Pasadena is substantively different or just St. Petersburg in disguise, and which paradox poses a greater challenge to expected utility theory.

  First, I need to recall the key differences. St. Petersburg has an infinite expectation because the positive terms grow without bound, while Pasadena's expectation is conditionally convergent - it converges to ln2 when summed in order, but rearrangements can make it converge to any real number or diverge. That conditional convergence seems crucial.

  The astronomer's Riemann rearrangement analogy is sharp. But their nagging doubt about whether rearrangement is legitimate in a single gamble is spot-on. In a single play, the sequence is fixed, so summing in that fixed order gives ln2. But does that solve it? Not really, because decision theory needs to handle preferences before the gamble is played, when the actual sequence isn't known yet. So the "rearrangement" here is more about how we group possible outcomes when calculating expectation, not about physical reordering.

  For the "which is worse" question: infinite expectation might be handled with bounded utility or finite resources, but undefined expectation? That's more fundamental. It strikes at the heart of whether we can even define a preference. Different grouping methods yielding different sums means we can't assign a stable expected value.

  Standard fixes: bounded utility functions would cap both paradoxes, making expectations finite. But interestingly, for Pasadena, bounding utility would make the expectation well-defined and finite regardless of order, since absolute convergence kicks in. So both get resolved together, but Pasadena highlights a deeper pathology - that without bounded utility, expectation can be undefined even when convergent in order.

  The astronomer's instinct about "undefined" being more corrosive seems right. With St. Petersburg, you can still compare it to finite gambles using tools like weak dominance. But with undefined expectation, even that might fail. It's like comparing a number to something that isn't a number.

  I should emphasize how Pasadena breaks the "linearity" intuition - that expectation should be the sum of payoffs times probabilities. When that sum isn't absolutely convergent, this breaks down spectacularly. That's the deeper mathematical point beneath the rearrangement metaphor.

  Also worth noting: in physics terms, St. Petersburg is like a divergent integral while Pasadena is like a conditionally convergent one - and physicists know the latter can be treacherous (think Fourier series gibbs phenomenon or quantum operator ordering).
answer: |-
  Your instinct is razor-sharp, and the distinction you're probing is fundamental. Let's dissect St. Petersburg (SP) and Pasadena (PG) side-by-side, cutting through the formalism to the core conceptual differences. Your radio astronomy background gives you the perfect lens: think of expectations as integrals over probability space, and convergence as paramount.

  **1. The Mathematical Core: Divergent vs. Conditionally Convergent Series**

  *   **St. Petersburg (SP):** This is **divergent** pure and simple. The expectation is:
      `E[SP] = Σ (n=1 to ∞) (1/2)^n * 2^(n-1) = Σ (n=1 to ∞) 1/2 = ∞`
      The positive terms (`+1/2`) are constant and do not diminish. The series diverges monotonically to `+∞`. There's no ambiguity in *how* it diverges. It's like integrating a constant function over an infinite measure space.

  *   **Pasadena Game (PG):** This is **conditionally convergent**. The expectation, summed in the natural order (sequence of coin flips determining the payoff magnitude), is:
      `E[PG] = Σ (n=1 to ∞) (-1)^{n+1} * (2^n / n) * (1/2)^n = Σ (n=1 to ∞) (-1)^{n+1} / n = ln(2)`
      Crucially, while this converges to `ln(2)` *when summed in the natural order*, the series of absolute values is the harmonic series:
      `Σ |(-1)^{n+1}/n| = Σ 1/n = ∞`
      This conditional convergence is the heart of the paradox. The positive and negative parts separately diverge:
      `Σ_{k=1}^∞ 1/(2k-1) = ∞` (positive terms: odd n)
      `Σ_{k=1}^∞ -1/(2k) = -∞` (negative terms: even n)

  **2. The Riemann Rearrangement Analogy: Metaphor vs. Reality**

  *   **Your Insight is Correct:** The PG *is* essentially the Riemann Rearrangement Theorem (RRT) making a starring appearance in decision theory. RRT states that any conditionally convergent series can be rearranged to converge to any real number, or diverge to `±∞`. This directly maps to PG: different ways of grouping or "counting" the infinite possibilities yield different "expected values".
  *   **The Legitimacy of "Rearrangement" in a Single Gamble:** This is the critical subtlety. You're absolutely right that for a *single realized sequence* of flips (e.g., Tails, Tails, Heads), the payoff is fixed and finite. The "rearrangement" isn't temporal.
      *   **The Problem Lies in the Ex Ante Expectation:** Decision theory requires us to assign an expected value *before the game is played*, aggregating over *all possible infinite sequences*. This expectation is defined as the sum over the sample space: `Σ (ω ∈ Ω) P(ω) * U(ω)`. The sample space Ω consists of all possible infinite sequences of coin flips (or equivalently, the stopping times `n=1,2,3,...`).
      *   **Conditional Convergence Breaks Linearity:** The expectation `E[X] = Σ P(ω)X(ω)` is only guaranteed to be well-defined and independent of the summation order if `Σ P(ω)|X(ω)| < ∞` (absolute convergence). PG fails this. While the natural order (`n=1,2,3,...`) sums to `ln(2)`, RRT guarantees there are other *perfectly valid bijections* between the countable set of outcomes and the natural numbers that rearrange the terms `P(ω)X(ω)` to sum to `42`, `-1000`, `∞`, `-∞`, or oscillate forever. There's no "privileged" ordering of the entire sample space Ω that forces the natural `n`-ordering upon the expectation sum.
      *   **The Metaphor Holds:** The "rearrangement" corresponds to different ways of *enumerating the mutually exclusive possible outcomes* when performing the infinite sum defining the expectation. The physical temporal order of flips *within a single sequence* doesn't change, but the *mathematical order in which we sum over the infinity of distinct possible sequences* does change under rearrangement. The setup defines the payoff *for each sequence*, but it doesn't dictate the *order of summation* over all sequences. RRT exploits this freedom.

  **3. Which Paradox is Worse for Expected Utility Theory (EUT)?**

  **The Pasadena Game (Undefined Expectation) is categorically worse.** Here's why your gut is spot-on:

  *   **St. Petersburg (Infinite Expectation):** This is a problem of *scale*, not definition. EUT says the game has infinite value. The objections are practical/philosophical:
      *   **Bounded Utility:** A utility function saturating (e.g., `U(wealth) = min(wealth, M)` for some large `M`) instantly resolves it. `E[U]` becomes finite.
      *   **Finite Resources:** No real agent (casino, universe) has infinite wealth. The maximum possible payout is capped, making `E[U]` finite. (This is the "no one will sell it" argument).
      *   **Weak Dominance:** SP weakly dominates *any* finite game (for unbounded utility), which is counterintuitive but logically consistent *within EUT*. You can still compare SP to other gambles; the theory gives an answer, even if it's unpalatable.
  *   **Pasadena Game (Undefined Expectation):** This is a problem of *meaning*. EUT **fails to assign any value whatsoever** to the gamble. It's not infinite; it's *non-existent*.
      *   **"What would you pay?" is Unanswerable:** EUT provides *no guidance*. Different valid summation orders give different fair prices (`ln(2)`, `42`, `-1000`...). There is no "the" expectation to use.
      *   **Violates Core Axioms:** EUT relies on expectations being well-defined numbers to rank gambles. PG lacks this. Comparing PG to *any* other gamble (even a sure $0) becomes formally impossible within standard EUT. Which summation order do you use for the comparison?
      *   **Breaks Rationality Constraints:** Carefully crafted rearrangements could make PG appear to weakly dominate a good gamble or be dominated by a bad gamble, depending purely on the summation order. This undermines the consistency EUT aims for.
      *   **Patches are Less Satisfying:** While bounded utility *also* resolves PG (by forcing absolute convergence: `Σ |(-1)^{n+1}/n| * U(2^n/n) < ∞` if `|U(x)| < M`), the *reason* it needed fixing is deeper. SP exposed a sensitivity to unboundedness; PG exposes a foundational fragility in how expectation is *defined* for infinite state spaces when absolute convergence fails. It shows EUT isn't just sensitive to large payoffs, but to the very structure of the infinite sum defining expectation.

  **4. Do Standard Patches Fix Both?**

  *   **Bounded Utility/Capped Payoffs:** **Yes, this fixes both paradoxes in one go, and robustly.** It forces absolute convergence `Σ P(ω) |U(X(ω))| < ∞` for any gamble with finite maximum payout or bounded `U`. This eliminates the divergence of SP and the conditional convergence of PG. The expectation becomes a well-defined, finite number, independent of summation order.
  *   **Weak Dominance Principles (for SP):** These address the *implications* of SP's infinite value (e.g., "you should pay any finite price") but don't resolve the undefinedness of PG. PG needs its expectation defined *first* before dominance can even be applied.
  *   **Discounting/Time Preference:** Applying heavy discounting can dampen SP's divergence but doesn't reliably fix PG. A clever rearrangement could still exploit the conditional convergence under discounting.
  *   **Finitism (Rejecting Actual Infinities):** This dismisses both paradoxes as mathematical artifacts without real-world analogs, where all gambles are finite. While pragmatic, it avoids rather than resolves the theoretical challenge.

  **Conclusion: Deeper Waters in Pasadena**

  Your intuition is correct. The St. Petersburg paradox is primarily about the **implications of unbounded utility and infinite resources** leading to an infinite expectation. It's a problem of magnitude and practicality within a framework that still functions.

  The Pasadena paradox is fundamentally about the **failure of the expectation to be well-defined** due to conditional convergence. It leverages the Riemann Rearrangement Theorem to expose a profound ambiguity in how EUT aggregates infinite possibilities when the payoffs oscillate sufficiently wildly in sign and magnitude. It strikes at the mathematical definition of expectation itself within the standard Kolmogorov probability framework for infinite state spaces.

  SP asks, "How do we handle something infinitely valuable?" PG asks, "What *is* the value, when every calculation method gives a different answer?" Undefined expectation is indeed the more corrosive challenge to the foundations of standard EUT. While bounded utility acts as a powerful seawall against both storms, encountering PG reveals a deeper, more turbulent ocean beneath the surface of decision theory than SP alone suggested. It's a brilliant illustration of how conditional convergence isn't just a mathematical curiosity; it can be a decision-theoretic catastrophe.

  As a radio astronomer, think of SP as a source with a diverging flux density integral (`∫ S(ν) dν → ∞`), while PG is like a source where the complex visibility function's integral exists only conditionally – the image reconstruction (the expectation) becomes pathologically dependent on the `(u,v)`-plane sampling order. Bounded utility acts like a bandpass filter (`U` becomes the transfer function), making both integrals absolutely convergent and the image stable. The "rearrangement" in PG corresponds to different gridding/weighting schemes in the dirty map – only when the underlying function is absolutely integrable do you get a unique, stable clean map (expectation).
