prompt: |-
  Something weird happened to me recently and I can't stop thinking about it. I've always been someone who believes — I mean really believes, down to my bones — that the people I love would never deliberately hurt me. Not as a principle I argue for, just... the way the world is. Like how you know the floor will hold you when you step out of bed. Last month my brother did something that, objectively, looks like he deliberately hurt me in a pretty serious way. Everyone I've told the facts to says yeah, that was deliberate. But I find that I literally cannot intergrate this. I don't mean I'm in denial in the ordinary sense — I can say the words "my brother deliberately hurt me" — but I notice that I don't live as if it's true. I still call him, I still trust him with things, I still assume he's on my side in the same automatic way I did before. It's like the belief that he wouldn't hurt me isn't a regular belief that evidence can touch; it's more like the background against which I evaluate evidence in the first place. And now there's this crack in the background and I don't know what to do with it.

  I feel like there's something philosophically interesting going on here — something about the difference between the beliefs you hold and the beliefs you live inside of. But I don't have the concepts to think about it clearly. What's going on here, philosophically? And more importantly, what do I do? Do I try to revise the thing? Can you even revise something that's more like a lens than an object you're looking at? Or is there some other way to handle this?

  Last line: a one-sentence summary of your diagnosis.
reasoning: |-
  Okay, the user is describing a profound existential crisis triggered by their brother's betrayal. What's fascinating here isn't just the event itself, but how it's exposing the architecture of their belief system. They're absolutely right - this isn't about regular beliefs but what phenomenologists might call "background certainty" or what Wittgenstein called the "hinge propositions" that don't get questioned because they're the frame through which questioning happens. 

  Hmm... their metaphor about the floor holding them is perfect. That's exactly how basic trust operates - it's not a conscious thought but the invisible condition for thought. The brother's action didn't just violate trust; it made the invisible framework visible, hence the "crack in the background" description. That's why intellectual acknowledgment ("I can say the words") doesn't change behavior - because behavioral patterns are wired into that deeper layer.

  The philosophical tension here is between epistemology and ontology: knowing vs being. They "know" the betrayal happened cognitively, but their being-in-the-world still operates from the old framework. This explains why they still call their brother automatically - the habit-body hasn't caught up. Merleau-Ponty's phenomenology of embodiment feels relevant here - the body keeps living the old truth.

  Practically... they need permission not to force "revision" which could be traumatic. The priority should be stabilizing the cracked foundation before deciding whether to rebuild or repair. That means creating temporary psychological scaffolding: behavioral boundaries (even if feelings don't match yet), external support systems, and crucially - examining what this belief protected (their identity? safety? worldview?). 

  The core paradox: they must use the damaged lens to assess its own damage. That's why third-party perspectives (therapist, philosophy) are essential - they provide alternative frames while their own is compromised. The summary needs to capture that this isn't cognitive dissonance but framework collapse.
answer: |-
  Your experience reveals a profound philosophical tension between **propositional beliefs** (statements we consciously affirm) and **doxastic bedrock** (pre-reflective frameworks that shape how we interpret reality itself). 

  ### Philosophical Diagnosis:
  1. **Hinge Propositions (Wittgenstein):** Your trust wasn't a "belief" to be proven, but a *hinge*—an unchallenged foundation that allows other beliefs to function. Like the certainty that the sun will rise, questioning it destabilizes your entire epistemic framework.  
  2. **Background Certainty (Heidegger/Merleau-Ponty):** This trust operated as embodied, pre-cognitive certainty—the "lens" you describe. It shaped your world before rational analysis began.  
  3. **Cognitive Dissonance vs. Ontological Shock:** This isn't mere contradiction between belief/action. It’s a rupture in your *mode of being*. Your body/mind still inhabits the old reality despite new evidence.  

  ### What To Do:
  - **Don’t force "revision":** Forcing yourself to "believe" the betrayal may deepen trauma. The lens can’t be dismantled from within.  
  - **Create scaffolding:**  
    - **Behavioral Boundaries:** Act *as if* the betrayal matters (limit sharing, delay calls) even if it feels unnatural. Actions can recalibrate subconscious patterns.  
    - **Existential Archaeology:** Journal to trace this trust’s roots. Was it tied to identity ("I’m un-hurtable"), family mythology ("We protect each other"), or self-worth?  
    - **Third-Party Perspective:** Engage a therapist to hold space for the "crack"—they become temporary scaffolding while your inner framework rebuilds.  
  - **Reframe the "Crack":** This rupture isn’t *only* damage. It’s an invitation to choose your foundations consciously. What trust do you *want* to live by now? (e.g., "I trust my resilience" vs. "I trust others’ infallibility").  

  ### The Path Forward:
  Your brother’s act fractured a *given* reality, but you now hold the tools to construct a *chosen* one. This isn’t about discarding the old lens but **integrating the fracture into a more complex, resilient worldview**—where betrayal exists *alongside* your capacity to navigate it without collapsing.  

  **One-sentence diagnosis:** *You’re experiencing the shattering of a pre-reflective ontological trust—a hinge proposition that organized your reality—requiring not cognitive adjustment but existential recomposition.*
