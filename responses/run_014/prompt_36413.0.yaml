    1. The procedure relies on counterfactuals that may be difficult to prove. For example, in Step 2, we may need to know what would have happened if the action had been taken. This often requires expert testimony and may be uncertain.

    2. The proximate cause analysis (Step 4) is inherently normative and fact-specific. Different jurisdictions have different rules. The adjuster may need legal guidance.

    3. The procedure does not eliminate the role of duty; it separates it. But the adjuster's worry was about using duty to decide causation. The procedure ensures that causation is determined first without duty. However, in Step 4, the foreseeability test might be influenced by normative considerations. So there might still be some drift.

    4. The procedure cannot resolve deep metaphysical questions about omissions. For example, in the case of two omissions that are both but-for causes, we might wonder if we are overcounting causes. But the procedure follows the standard legal approach.

    5. The procedure might not handle cases of preemption or other complex causal structures well.

    6. The procedure does not address policy exclusions or conditions. It only addresses causation and duty. The adjuster must then apply the policy language.

    7. The procedure does not tell the adjuster how to weigh multiple causes. For example, if there are multiple causes (some covered, some excluded), the adjuster will need to apply the policy's anti-concurrent causation clause or other rules.

    Regarding the drift worry: The procedure should help because it forces the adjuster to first ask the but-for question and the proximate cause question without considering duty. Only after causation is established does duty come in. This reduces the bias of using duty to decide causation. However, in Step 4 (proximate cause), there is room for normative judgment. Therefore, the procedure does not entirely eliminate the drift but structures it.

  Final Procedure Outline:

    For a given omission in a claim file:

    1. State the harm and the omission.
    2. But-for test: If the action had been taken, would the harm have been avoided (or reduced)? 
        - If no, then the omission is not a cause in fact -> mark as "not a cause" and stop for this omission.
        - If yes, then it is a cause in fact -> proceed.
    3. Proximate cause:
