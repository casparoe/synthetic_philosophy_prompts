    - Example: Harm = burst pipe causing water damage; Omission = caretaker did not shut off the water.

  Step 2: Counterfactual Test for Causation (But-for Test)
    - Ask: "But for the omission, would the harm have occurred?"
      - If the omission had not occurred (i.e., if the action had been taken), would the harm have been avoided?
