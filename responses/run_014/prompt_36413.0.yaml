  We are dealing with the problem of omissions as causes in property insurance claims. The key issue is when an omission (a failure to act) can be considered a proximate cause of a loss. The procedure must be based on philosophical and causal reasoning, but also must be practical for an insurance adjuster to apply in 20-30 minutes per file.

  Philosophical Background:
  - Omissions are tricky because they are not events; they are absences of events.
  - The common approach in law and philosophy is to consider an omission as a cause only if:
    (a) there was a duty to act, and
    (b) the action, if taken, would have prevented the harm (with a high probability).
