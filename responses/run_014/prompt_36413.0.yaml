            - If yes, then not proximate -> mark as "not a proximate cause".
            - If no, proceed.
        b. Was the harm a reasonably foreseeable consequence of the omission?
            - If no, then not proximate.
            - If yes, then the omission is a proximate cause.
    4. Duty: Did the actor have a duty to act?
        - This is a legal question. If the adjuster is unsure, hand off to coverage counsel.

    Then, for coverage decisions, the adjuster must consider:
        - Is the cause covered under the policy? (e.g., burst pipe is usually covered, but see exclusions)
        - Are there exclusions for certain causes or for the insured's failure to maintain?
        - If the insured's own omission (like failure to mitigate) is a proximate cause, then the policy conditions may reduce or deny coverage.

    The procedure helps isolate the causal analysis and reduces the conflation of duty and causation. But it does not eliminate normative judgments in proximate cause.
answer: |-
  ### Procedure for Evaluating Omissions as Causes in Insurance Claims  
  This 20-30 minute procedure isolates **causal analysis** from normative judgments (duty/law). It draws on philosophical frameworks (e.g., counterfactual dependence, NESS test) and terminates with clear handoffs to coverage counsel or judgment where values/law dominate.  

  ---

  #### **Procedure Steps**  
  1. **Define the Harm and Omission**  
     - *Question:* "What is the specific harm, and what omission is alleged to have caused it?"  
     - *Sufficient Answer:* A clear description of the loss (e.g., "water damage from a burst pipe") and the omitted act (e.g., "caretaker failed to shut off water").  
     - *Termination Point:* If no omission is alleged, stop—causal analysis doesn’t apply.  

  2. **Counterfactual Test (But-For Causation)**  
     - *Question:* "Would the harm **not have occurred** if the omitted act had been performed?"  
     - *Sufficient Answer:*  
       - **Yes** → Omission is a *candidate cause*. Proceed to Step 3.  
       - **No** → Omission is **not a cause in fact** (e.g., the preventer would have failed anyway). Stop.  
     - *Handoff:* If facts are unclear (e.g., "would the inspection have caught the hazard?"), hand off to investigation.  

  3. **Identify Competing Causes**  
     - *Question:* "What other factors (acts/omissions/events) contributed to the harm?"  
     - *Sufficient Answer:* List all relevant factors (e.g., "hard freeze," "lack of insulation," "another party’s omission").  
     - *Purpose:* Prevents overlooking overdetermination or background conditions.  

  4. **Test for Causal Necessity (NESS Test)**  
     - *Question:* "Is the omission a **Necessary Element** of a **Sufficient Set** (NESS) of conditions for the harm?"  
       - *Sub-question:* "Is there a set of actual conditions including this omission that caused the harm, and would the set be **insufficient** without it?"  
     - *Sufficient Answer:*  
       - **Yes** → Omission is a cause. Proceed to Step 5.  
       - **No** → Omission is a **background condition** (e.g., bystander’s inaction). Stop.  
     - *Handles:*  
       - **Two omissions**: If either omission alone was sufficient to prevent harm (e.g., both landlord and contractor skipped inspections), each is a NESS cause (both were necessary for the harm to occur).  
       - **Omission + later event**: If the omission created vulnerability (e.g., unrepaired roof), but a storm caused damage, the omission is NESS if the storm was foreseeable.  

  5. **Proximate Cause Analysis**  
     - *Question:* "Was the harm a **foreseeable consequence** of the omission, and were there **no unforeseeable intervening causes**?"  
     - *Sufficient Answer:*  
       - **Foreseeable & no intervening cause** → Omission is a proximate cause.  
       - **Unforeseeable intervening cause** (e.g., unprecedented disaster) → Omission is **not proximate**. Stop.  
     - *Handoff:* If foreseeability is disputed (e.g., "Was the storm predictable?"), hand off to coverage counsel—this hinges on legal precedent, not causation.  

  6. **Handoff to Duty/Law**  
     - *Question:* "Does the omitter have a **legal duty** to act?"  
     - *Termination:*  
       - Duty exists → Proceed to coverage analysis (e.g., policy exclusions).  
       - No duty → Omission is causally relevant but **not actionable** (e.g., bystander).  
     - *Key Point:* **Causal analysis ends here**. Duty is a legal question for counsel.  

  ---

  ### **Application to Claims**  
  #### **Claim 1: Caretaker’s Omission & Burst Pipe**  
  - **Harm**: Water damage from burst pipe during freeze.  
  - **Omission**: Caretaker failed to shut off water.  
  1. **Counterfactual**: But-for shutting off water, no burst pipe → *Cause in fact*.  
  2. **NESS**: Freeze + omission = sufficient set; omission necessary → *Cause*.  
  3. **Proximate Cause**: Burst pipe is foreseeable in freeze → *Proximate*.  
  4. **Duty**: Caretaker likely had duty → Handoff to counsel for coverage impact.  
  - *Outcome*: Omission is a cause.  

  #### **Claim 2: Landlord & Alarm Contractor Skipped Inspections (Fire Loss)**  
  - **Harm**: Fire damage.  
  - **Omissions**: Landlord failed to inspect wiring; contractor failed to test alarms. Either would have caught hazard.  
  1. **Counterfactual**: But-for landlord’s inspection OR contractor’s test, fire avoided → *Both cause in fact*.  
  2. **NESS**: Both omissions are necessary elements of the sufficient set (vulnerable wiring + no alarms). Harm occurs only if *both* fail → *Both causes*.  
  3. **Proximate Cause**: Fire from faulty wiring is foreseeable → *Proximate for both*.  
  4. **Duty**: Both had contractual duties → Handoff for apportionment.  
  - *Outcome*: Both omissions are causes—even if adjuster prefers blaming one.  

  #### **Claim 3: Insured’s Failure to Mitigate (Mold Claim)**  
  - **Harm**: Severe mold from small leak.  
  - **Omission**: Insured failed to dry area post-leak.  
  1. **Counterfactual**: But-for mitigation, mold would not have spread → *Cause in fact*.  
  2. **NESS**: Leak + omission = sufficient set; omission necessary → *Cause*.  
  3. **Proximate Cause**: Mold growth from water exposure is foreseeable → *Proximate*.  
  4. **Duty**: Policy requires mitigation → Handoff for coverage reduction.  
  - *Outcome*: Omission is a cause—adjuster might dislike this, but procedure confirms causal role.  

  ---

  ### **Where the Procedure Misfires and Limitations**  
  1. **Misfires**:  
     - **Overdetermination with independent sufficiency**: If two omissions *each alone* could cause harm (rare in prevention cases), NESS may falsely exclude both. But prevention cases (e.g., inspections) usually require *all* failures, so NESS holds.  
     - **Foreseeability disputes**: If an intervening event (e.g., freak storm) is arguably foreseeable, the procedure flags it for counsel—but adjuster’s bias may creep in here.  
     - **Bystander omissions**: Procedure labels these "background conditions" (Step 4), avoiding misattribution.  

  2. **Limitations**:  
     - **Cannot resolve factual ambiguity**: E.g., "Would the inspection have found the hazard?" Requires evidence, not philosophy.  
     - **Does not eliminate bias in foreseeability**: Proximate cause (Step 5) is value-laden; the procedure exposes but doesn’t solve this.  
     - **No coverage decisions**: Determines causation only; policy terms, exclusions, and duties are handed off.  

  3. **Does It Solve Your Drift Worry?**  
     - **Yes**: By separating causal analysis (Steps 1–4) from duty (Step 6), it forces you to validate omissions as causes *before* considering norms. The NESS test (Step 4) explicitly filters out non-necessary omissions (e.g., bystanders) without invoking duty.  
     - **But**: Proximate cause (Step 5) still involves normative judgment. The procedure "launders" bias by confining it to a defined step where handoffs are required, making drift visible and manageable.  

  **Final Output**: A causation decision (cause/not cause) + flagged handoffs for legal judgment. Use this to ensure causal rigor while respecting legal boundaries.
