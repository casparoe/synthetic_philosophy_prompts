  We are going to analyze the Silicon Valley Bank (SVB) run in March 2023 through the lens of common knowledge of rationality (CKR). The idea is that a Nash equilibrium might break down when the iterated knowledge of rationality fails. We'll map the events to a coordination game with incomplete information, similar to a global game or the electronic mail game.

  **The Setup: Players, Payoffs, and Signals**

  *Players*: The depositors, specifically the venture capital (VC) firms and their portfolio companies (startups) that held accounts at SVB. We can think of each VC firm and each startup as a player. However, note that VCs often advised their portfolio companies, so there is a network effect.

  *Payoffs*: Each depositor has two possible actions: 
  - Withdraw: pull out their deposits immediately.
  - Keep: leave the money in the bank.

  The payoffs depend on the bank's fundamental state (solvent or insolvent) and the fraction of depositors who withdraw. We can model this as a coordination game with a payoff structure that has two equilibria: one where no one withdraws (if the bank is solvent) and one where everyone withdraws (if the bank is insolvent). However, the state is not perfectly known.

  We can think of the bank's fundamental state as a random variable θ, which can be either:
  - θ = G (good, i.e., solvent) or 
  - θ = B (bad, i.e., insolvent).

  Each depositor i receives a private signal x_i about θ. But in the SVB case, there was also a lot of public information and coordination.

  Instead, let us consider a global game framework where the fundamental state is a continuous variable (say, the bank's asset value) and depositors receive noisy private signals. However, in the SVB case, the public signals (like the CEO's letter, VC tweets) were crucial.

  Alternatively, we can think of the electronic mail game: in that game, two players must coordinate on an action in a coordination game, but they have noisy communication about whether they are in the "attack" or "safe" state. The key is that the probability of miscoordination is high when the state is borderline and the communication is imperfect.

  But in SVB, we have many players and a public signal that becomes common knowledge. So let's reframe:

  **Key Events as Signals**

  1. **March 8th: CEO's Letter**  
     - SVB's CEO, Greg Becker, sent a letter to shareholders announcing a $1.8 billion loss from bond sales and a plan to raise $2.25 billion in capital.  
     - This is a public signal that reveals the bank is under stress. However, it was intended to reassure (by showing a plan) but instead raised concerns.

  2. **March 9th: VC Partners Advising Withdrawals**  
     - Influential VCs (like Peter Thiel's Founders Fund, Coatue Management, Union Square Ventures) advised their portfolio companies to withdraw funds from SVB.  
     - This is a public signal that some players (VCs) are acting as if they believe the bank is in trouble. Moreover, it is a coordinated action by a subset of players.

  3. **Cascading Tweets and Messages**  
     - The advice spread rapidly on social media and private networks (e.g., WhatsApp groups). This created a public signal that many depositors were withdrawing.

  **Mapping to a Global Game or Coordination Game**

  Let's model the state θ as the bank's asset value relative to its liabilities. If θ is above a certain threshold, the bank is solvent; below, it is insolvent. However, depositors do not observe θ perfectly.

  Each depositor i receives a private signal x_i = θ + ε_i, where ε_i is noise. But in the SVB case, the public signals (the CEO letter, VC announcements) were much more influential.

  We can think of the CEO letter as a public signal y_public = θ + η, where η is a noise term. The content of the letter (the loss and the capital raise) was interpreted as bad news, so it shifted beliefs downward.

  Then the VC actions and the social media cascade are even more public. In fact, they are common knowledge events.

  **Breakdown of Common Knowledge of Rationality**

  The common knowledge of rationality (CKR) is the assumption that everyone is rational, everyone knows everyone is rational, and so on ad infinitum. In a bank run game, the efficient equilibrium (no run) is sustained if depositors believe that others will not run. But if there is a possibility that others might run (even if they are rational), then it becomes rational to run.

  In the SVB case:

  - Initially, depositors might have believed that the bank was fundamentally sound. The CEO letter introduced doubt. However, if each depositor believed that others would interpret the letter rationally and not panic, then they might have kept their money. But the letter was ambiguous: it was intended to be a reassurance but was taken as a sign of trouble.

  - The crucial break came when VCs started advising withdrawals. This broke the common knowledge of rationality because:
    1. The VCs are influential and their advice is public. When a VC firm advises withdrawal, it becomes known to many that this VC is acting as if it believes a run is likely.
    2. Moreover, the VCs were advising their portfolio companies to withdraw, which are also depositors. So the advice is a direct trigger for withdrawal by a group.

  At this point, a depositor (say, a startup) might think: 
  - "Even if I think the bank is solvent, if others withdraw, the bank will fail. Now, because I know that VCs are telling their companies to withdraw, I expect many withdrawals. Therefore, it is rational for me to withdraw."

  But note: the VCs themselves might have been acting on the same reasoning. Why did they break first?

  Let's break down the iterated knowledge:

  - Level 0: I am rational.
  - Level 1: I know that others are rational.
  - Level 2: I know that others know that everyone is rational.

  The VCs might have received the CEO letter and thought: 
  - "This letter might cause panic. Even if the bank is solvent, if enough depositors panic and withdraw, the bank will fail. And because the letter is public, everyone is seeing it. So I expect that some might run. Therefore, to avoid being last in line, I should run."

  But then, if the VCs are known to be sophisticated (and hence rational), their decision to run signals that they have lost faith in the common knowledge of rationality. Specifically, they are acting as if they believe that Level 0 and Level 1 might break for others.

  **The Moment of Breakdown**

  The moment when the VCs publicly advised withdrawals shattered the common knowledge. It became known that at least some players (the VCs) were not going to play the "keep" strategy. Consequently, even if a depositor believed the bank was solvent (and that others were rational), they now knew that some rational players (the VCs) were going to withdraw. Therefore, it became rational for them to withdraw as well.

  Moreover, the public nature of the advice (through tweets, etc.) made it common knowledge that a run was starting. This is similar to a public signal in a global game that shifts the beliefs of all players simultaneously.

  **The Model: Global Game with Public Signals**

  We can model this with a global game that has both private and public signals. The state θ is the bank's fundamental. Depositors get:
  - A public signal y_pub (the CEO letter) that is a noisy measure of θ.
  - Then, a second public signal: the VCs' actions (which we can model as a fraction of depositors who are withdrawing, but note that the VCs' advice is a commitment to withdraw).

  The VCs' advice is a signal that they have received a very bad private signal? Or that they believe the public signal is bad enough to warrant a run? Actually, it's a signal of their belief about what others will do.

  Alternatively, we can think of the VCs as a large player (or a coordination device) that can influence the actions of many. In that case, their action breaks the symmetry.

  **Where the Model Strains**

  1. **Network Effects**: The depositors were not anonymous. They were connected through VC networks, social media, and personal relationships. This dense network:
     - Makes common knowledge *easier to sustain* in normal times because information flows quickly and reliably. 
     - But it also makes common knowledge *easier to shatter* because a single public event (like a VC tweet) can become common knowledge instantly. In an anonymous setting, it might take time for a run to build.

     In fact, the dense network amplified the run because:
     - VCs could coordinate their actions quickly (e.g., via WhatsApp groups).
     - The advice from one VC to their portfolio companies was then observed by others, creating a cascade.

  2. **Role of Social Media and Coordinated Messaging**: 
     - The standard global game model assumes private signals and a public signal that is exogenously given. But in SVB, the public signals were endogenous: the VCs were players and their messages were strategic.
     - The model does not account for the fact that players can send messages to influence others. This breaks the standard framework because the signals are not just about the state but also about the actions of others.

     Moreover, the VCs were not just depositors; they were also advisors. Their role as advisors gave their messages extra weight.

  **What the Episode Tells Us About the Theory**

  - The theory is vindicated in the sense that the run unfolded very quickly once the public signal (VC advice) was out. This is consistent with the global game prediction that a small amount of public information can have a large effect when the state is in a critical region (i.e., when the bank is vulnerable).

  - However, the role of coordinated messaging and social media breaks the standard model in two ways:
    1. **Endogenous Public Signals**: Players (the VCs) created a public signal that was designed to coordinate actions. This is not captured in models where signals are exogenous.
    2. **Network Structure**: The dense network meant that the run could spread faster and more efficiently than in an anonymous setting. The standard global game does not model network structure.

  **Conclusion**

  The SVB run illustrates the fragility of common knowledge of rationality. The initial public signal (the CEO letter) raised doubts, but the run was triggered when influential players (VCs) publicly advised withdrawals. This shattered the common knowledge because it became known that these rational players were expecting a run, making it rational for others to run.

  The dense network made the common knowledge both easier to maintain in normal times and easier to break in a crisis because of the speed of information transmission. The episode shows that the standard global game model is useful for understanding the tipping point, but we must extend it to account for strategic communication and network effects.
answer: |-
  ### Analysis of the SVB Run Through the Lens of Common Knowledge of Rationality (CKR)

  The Silicon Valley Bank (SVB) run in March 2023 is a textbook example of how the breakdown of **common knowledge of rationality** (CKR) can trigger a coordination failure. CKR requires not only that all players are rational but that this rationality is infinitely iterated: everyone knows everyone is rational, everyone knows that everyone knows, ad infinitum. When this structure collapses—often due to ambiguous signals—Nash equilibria (like "no run" in a bank) become unstable. Below, I map the SVB run onto a formal global game framework, pinpoint where CKR broke down, and discuss the role of dense networks and social media.

  ---

  ### **Formal Framework: Global Game Model**
  We model the SVB run as a **global game** (Carlsson & van Damme, 1993) with incomplete information. This framework captures how small signals can trigger large-scale coordination failures when fundamentals are weak.

  1. **Players**:  
     - *N* depositors (VC firms, startups, and other clients).  
     - Key subsets:  
       - **VC firms** (e.g., Founders Fund, Coatue): Large, influential players.  
       - **Portfolio companies**: Startups advised by VCs.  
       - **Other depositors**: Smaller firms or individuals.  

  2. **State of the World (θ)**:  
     - θ represents SVB’s **fundamental health** (e.g., asset-liability gap).  
     - θ is drawn from a continuous distribution. Critical threshold:  
       - If θ ≥ θ*, SVB is solvent (run unnecessary).  
       - If θ < θ*, SVB is insolvent (run optimal).  
     - *Reality*: θ was weak (duration-risk mismatch in bonds) but not initially catastrophic. The run became self-fulfilling.

  3. **Payoffs**:  
     - Each depositor chooses: **Withdraw** or **Keep**.  
     - Payoffs depend on:  
       - *Fundamentals (θ)*: Withdrawing when θ < θ* yields higher returns.  
       - *Others’ actions*: If too many withdraw, SVB fails (even if θ ≥ θ*).  
     - **Payoff structure**:  
       - If θ ≥ θ* and few withdraw: **Keep** > **Withdraw**.  
       - If θ < θ* or many withdraw: **Withdraw** > **Keep**.  
     - *Nash Equilibria*:  
       - "No run" (all Keep) if θ ≥ θ*.  
       - "Run" (all Withdraw) if θ < θ*.  

  4. **Signals**:  
     - Depositors observe noisy **private signals** (e.g., balance sheets, rumors).  
     - Crucially, they also observe **public signals** that affect CKR:  
       - **March 8**: CEO Greg Becker’s letter announcing asset sales and capital raise.  
       - **March 9–10**: VC firms publicly advising withdrawals (e.g., Peter Thiel’s Founders Fund).  
       - **Social media**: Real-time tweets (e.g., @jason on VC pullouts) and WhatsApp groups.  

  ---

  ### **Breakdown of CKR: Key Moments Mapped to the Model**
  CKR breaks when depositors doubt others’ rationality. Iterated beliefs ("I know you know I’m rational") collapse, making the "no run" equilibrium untenable.  

  #### **Stage 1: March 8 – CEO’s Letter (Ambiguous Public Signal)**  
  - **Signal**: Becker’s letter reveals $1.8B loss and capital raise.  
  - **Effect on CKR**:  
    - The letter was intended to reassure (signaling proactive management).  
    - But it publicly *confirmed weakness* in fundamentals (θ).  
    - **CKR strain**: Level 1 beliefs erode. Depositors now suspect:  
      - "Others might interpret this as a reason to panic, even if they’re rational."  
    - *Formal shift*: The signal updates priors about θ, moving it closer to θ*. Depositors now assign higher probability to θ < θ*.  

  #### **Stage 2: March 9–10 – VC Coordination (Public Signal Shattering CKR)**  
  - **Signal**: VCs (e.g., Founders Fund) tweet/email portfolio companies: "Pull funds now."  
  - **Effect on CKR**:  
    - **Critical breakdown**: Depositors stop believing others are rational *conditional on public signals*.  
      - A VC-backed founder thinks: *"I’m pulling because others are panicking, not because SVB is insolvent. But if rational VCs are panicking, they must know something I don’t—or expect others to run."*  
    - **Iterated beliefs unravel**:  
      - Level 0: "I am rational."  
      - Level 1: "I know VCs are rational."  
      - Level 2: "I know VCs know I’m rational." → **Shattered here**.  
        VCs’ public advice signals they doubt *others’* rationality or stability. This makes "run" the unique equilibrium.  
    - *Global game analogy*: The VC advice acts as a **super-public signal** (Morris & Shin, 2002). It shifts depositors’ beliefs past the "run" threshold, regardless of private signals.  

  #### **Stage 3: Social Media Cascade (Common Knowledge of Panic)**  
  - **Signal**: Tweets (e.g., "SVB is melting down"), WhatsApp screenshots.  
  - **Effect on CKR**:  
    - These signals create **common knowledge of the run itself**.  
      - Depositor A: "I see tweets that VCs are fleeing, so I must flee."  
      - Depositor B: "I know A sees those tweets, so A will flee, so I must flee."  
    - *Formal outcome*: The "run" equilibrium becomes focal. Withdrawing is now rational even if θ ≥ θ*.  

  ---

  ### **Where the Model Strains: Dense Networks and Social Media**
  #### **1. Dense Networks: Easier to Shatter CKR**  
  - **Standard model**: Assumes anonymous players with no pre-existing relationships.  
  - **SVB reality**: A tight-knit network of VCs/founders who communicate directly.  
    - *Effect on CKR*:  
      - **Pre-crisis**: Dense networks *sustain* CKR. Shared norms (e.g., "rational VCs don’t panic") hold iterated beliefs together.  
      - **Crisis trigger**: Networks *amplify fragility*. A single public signal (e.g., Founders Fund’s email) becomes common knowledge instantly.  
        - *Mechanism*: When influential players (VCs) act, their rationality is unquestioned. But their defection signals that *they* believe CKR has collapsed. This makes coordination on "run" faster and more lethal.  
    - *Contrast with anonymous models*: In dense networks, Level *k* beliefs break at higher *k* (e.g., Level 5 fails, not Level 2), but the collapse is more abrupt.  

  #### **2. Social Media and Coordinated Messaging: Breaking the Framework**  
  - **Standard model**: Signals are exogenous and passive (e.g., news reports).  
  - **SVB reality**: VCs *strategically created signals* (tweets, emails) to coordinate withdrawals.  
    - **Problem**: This introduces **coordinated messaging as a strategy**, which:  
      - Turns signals into **actions** (e.g., VCs aren’t just observing—they’re *inducing* a run).  
      - Violates the global game assumption that players act solely on beliefs about θ.  
    - **Implication**: The run was not just a response to fundamentals—it was a **strategic cascade** engineered by influential players.  
      - *Example*: When Y Combinator advised startups to withdraw, it wasn’t a "signal" in the model—it was a **coordination device**.  

  #### **3. Vindication or Limitation of the Theory?**  
  - **Vindication**:  
    - The run unfolded with textbook precision once public signals crossed a threshold.  
    - CKR breakdown explains why a solvent bank (θ ≥ θ*) failed: Panic became rational *because* others panicked.  
  - **Limitations**:  
    - **Endogenous signals**: Models treat signals as exogenous, but VCs *chose* to create panic. This blurs the line between "belief" and "action."  
    - **Network asymmetry**: Influential players (VCs) have outsized power to shatter CKR. Global games assume homogeneous players.  
    - **Temporal scale**: The run happened in hours, not days. Models with iterative belief updates struggle with real-time cascades.  

  ---

  ### **Conclusion: Lessons for Epistemic Game Theory**
  - **CKR in practice**: SVB shows that CKR is robust until **public signals reveal mutual doubt**. The CEO’s letter ignited doubts; VCs’ actions confirmed them.  
  - **Role of networks**: Dense networks sustain CKR in stable times but accelerate its collapse in crises. Trust in "rational others" turns into fear of "rational panickers."  
  - **Theory extension needed**:  
    - Incorporate **strategic signaling** (players as signal-senders).  
    - Add **network hierarchies** (influencers vs. followers).  
    - Model **real-time information cascades** (e.g., social media velocity).  

  The SVB run is a canonical case of CKR failure, but it also exposes the need for models that account for modern coordination tools (Twitter, WhatsApp) and strategic actors who manipulate common knowledge. It suggests that in networked economies, the line between "fundamental" and "self-fulfilling" crises is thinner than ever.  

  **References for your seminar**:  
  - Global games: Carlsson & van Damme (1993), Morris & Shin (2002).  
  - Bank runs: Diamond & Dybvig (1983).  
  - Epistemic game theory: Aumann (1976) on common knowledge, Rubinstein (1989) on electronic mail game.
