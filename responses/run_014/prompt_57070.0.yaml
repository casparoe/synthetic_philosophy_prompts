prompt: |-
  I'm on the standards committee for a farmed-seafood certification scheme — we audit maybe 200 sites, mostly salmon and trout, plus a handful of shrimp farms and one crab operation. Our own precedents: we banned ice-slurry chilling for warm-water species because it seems to prolong consciousness rather than end it; we allowed CO2 narcosis for trout only after a phase-in and only where the water's buffered; we've never certified a decapod site that ships animals live to market; and last year we approved a pilot outcome metric alongside the methods list — no corneal or vestibulo-ocular response within 20 seconds of stun.

  Now a big member wants us to go fully outcome-based: scrap the approved-methods list, any slaughter method allowed as long as the site can demonstrate the metric at audit. The wrinkle is that nobody's got a validated unconsciousness indicator for shrimp or crab, so for those species the metric can't really be failed.

  Draft the memo I'll circulate before Thursday. I want an actual recommendation (accept, reject, or accept with conditions, and which conditions), reasons the applicant can engage with rather than welfare boilerplate, and a serious treatment of their best point — that our methods list is already out of date and quietly locks in expensive kit only big producers can afford. Also tell me what we'd be commiting to on decapods either way, since I suspect that's the real decision hiding in this one.
reasoning: |-
  Okay, the user is on a farmed-seafood certification committee and needs help drafting a memo about moving to outcome-based slaughter standards. They've got a big member pushing to scrap their approved-methods list entirely, relying solely on unconsciousness metrics. 

  Hmm, the tricky parts are: 
  First, they don't actually have validated unconsciousness indicators for shrimp and crab yet. So if they switch to outcome-only for those species, the metric becomes meaningless - farms couldn't fail even if their methods are terrible. That's a major loophole.

  Second, the user hinted that this might really be about decapod standards. The committee's never certified live-shipping operations before, but if they drop methods requirements now, they'd implicitly open the door to that practice since there's no way to measure consciousness. Sneaky.

  The big producer's argument about outdated methods locking in expensive equipment is valid though. Their current list probably does favor capital-intensive systems. I should acknowledge that fairly while showing why jumping straight to pure outcomes is premature.

  User's clearly worried about two things: not wanting to greenwash decapod slaughter, and not wanting the standards to become elitist. The memo needs to thread that needle - reject the full proposal but offer concrete improvements to address their valid concerns.

  For the recommendation... Conditional rejection makes sense. Keep mandatory methods for decapods until proper metrics exist, but relax prescriptive rules for fish where we do have reliable indicators. That plus accelerated research commitments shows we're taking their cost concerns seriously without compromising welfare.

  The decapod implications need to be spelled out bluntly: "If we drop methods requirements now, we're effectively endorsing live shipping and inhumane slaughter by default since we can't measure consciousness." That'll focus the committee's minds on Thursday.
answer: |-
  **MEMORANDUM**  
  To: Standards Committee Members  
  From: [Your Name/Position]  
  Date: 22 October 2023  
  Subject: Recommendation on Outcome-Based Slaughter Standard Proposal  

  ### **Proposal Summary**  
  A major member proposes transitioning to a fully outcome-based slaughter standard: eliminating the approved-methods list and requiring sites to demonstrate only the outcome metric (no corneal/vestibulo-ocular response within 20 seconds post-stun). For shrimp and crab, no validated unconsciousness indicator exists, rendering the metric non-enforceable for these species.  

  ---

  ### **Recommendation: Reject the Proposal, with Counteroffer**  
  We recommend **rejecting a fully outcome-based approach at this time**, but propose **phased adoption for finfish only**, alongside accelerated decapod research and methods-list modernization.  

  #### **Conditions for Counteroffer**  
  1. **Finfish (salmon/trout)**: Adopt outcome-based standards effective 2025, retaining baseline equipment requirements (e.g., percussive/electrical tools must meet force/voltage minima).  
  2. **Decapods (shrimp/crab)**: Maintain mandatory methods list until validated indicators exist. Launch a funded R&D initiative (with industry co-sponsorship) to develop species-specific indicators by 2026.  
  3. **Methods List Modernization**:  
     - Establish a Technical Working Group (TWG) to review/update methods quarterly.  
     - Allow alternative methods via expedited petition if outcome metrics are demonstrably met in trials.  
  4. **Pilot Expansion**: For decapods, require sites to participate in unconsciousness indicator validation trials as a certification condition.  

  ---

  ### **Rationale: Addressing Key Concerns**  
  #### **1. The Methods List Is Outdated and Costly (Applicant’s Best Point)**  
  *We agree.* Our current list risks entrenching expensive technology (e.g., high-end electrical stunners) and stifling innovation. Small producers cannot absorb the capital cost of "approved" systems, creating inequity.  
  **Our Solution**:  
  - The TWG will prioritize cost-effective alternatives (e.g., lower-voltage systems with proven efficacy).  
  - Petitions for novel methods (backed by outcome data) can receive provisional approval in 60 days, bypassing multi-year list revisions.  
  - *This addresses lock-in while ensuring welfare isn’t compromised during transition.*  

  #### **2. Outcome Metrics for Decapods Are Not Scientifically Valid**  
  Without validated indicators, an outcome-based standard for shrimp/crab is functionally **unenforceable**. Auditors could not fail a site even if animals show clear signs of distress (e.g., prolonged leg movements post-cut). Accepting this proposal would:  
  - **Eviscerate welfare safeguards** for decapods, effectively permitting any method (including live shipping).  
  - **Undermine credibility** by certifying methods we know may cause suffering due to measurement gaps.  
  - **Create legal risk** if certification is challenged for misrepresenting welfare oversight.  

  #### **3. The "Pilot Metric" Isn’t Ready for Primetime**  
  Our 20-second metric works for finfish due to validated neurology. For decapods:  
  - No peer-reviewed studies confirm corneal/vestibulo-ocular responses correlate to consciousness.  
  - Decapod nervous systems differ fundamentally; indicators may require tailored metrics (e.g., hemolymph biomarkers, behavioral clusters).  

  ---

  ### **The Hidden Decision: Decapod Live Shipping**  
  **If we adopt full outcome-based standards now:**  
  - We implicitly permit live shipping for decapods. Without a measurable outcome, sites could ship live animals to market *without consequence*. This contradicts our precedent (no certified live-shipping sites) and public welfare commitments.  

  **If we reject and modernize:**  
  - We maintain the live-shipping ban via the methods list.  
  - We commit to solving decapod indicators within 3 years (via R&D partnership), paving the way for future outcome-based inclusion.  

  ---

  ### **Conclusion**  
  The proposal rightly highlights flaws in our prescriptive approach but ignores critical gaps in decapod science and enforcement. **We recommend:**  
  - **Outcome-based standards for finfish** (with baseline tech requirements) to promote innovation and lower costs.  
  - **Retain methods lists for decapods** until validated metrics exist, coupled with urgent R&D.  
  - **Modernize the methods list** to avoid "gold-plating" and invite affordable alternatives.  

  This balances innovation, accessibility, and welfare integrity. Without these conditions, we risk certifying inhumane practices for species where suffering cannot currently be measured.  

  ---  
  **Vote Scheduled**: Thursday, 26 October. Full counterproposal draft to follow.  
  **Contact**: [Your Email/Phone] for amendments or data submissions.
