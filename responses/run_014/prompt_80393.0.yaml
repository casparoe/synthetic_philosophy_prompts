answer: |-
  ## Adversarial Collaboration Joint Statement: Extended Cognition Debate

  **Prepared by:**  
  Dr. Elara Vance (Committed Extended Mind Theorist)  
  Prof. Marcus Thorne (Committed Constitutive Internalist)  

  **After sustained good-faith dialogue, we jointly affirm the following agreed-upon claims:**

  1.  **Functional Equivalence in Retrieval:** External resources (notebooks, apps, etc.) can serve *functional roles* analogous to biological memory in guiding action. Otto’s notebook entry for "MoMA" functions *like* Inga’s biological memory in directing him to the museum.
  2.  **Reliable Access is Necessary:** For an external resource to be cognitively relevant in *any* significant sense, it must be reliably available and typically trustworthy. A randomly lost notebook or an unreliable app fails as a cognitive resource.
  3.  **Not All External Tools are Cognitive:** Hammers, thermometers, or seldom-consulted encyclopedias are *causal inputs* to cognition, not *parts of* the cognitive process itself. Cognition involves information processing, not just tool use.
  4.  **Biological Machinery is Fundamental:** All cognition fundamentally depends on and arises from the biological brain and nervous system. There is no cognition without this biological substrate.
  5.  **"Glue" Matters:** The nature of the *relationship* between the agent and the external resource is crucial for evaluating claims of extension. Mere proximity or occasional use is insufficient.
  6.  **The Parity Principle is a Heuristic:** The Parity Principle ("If a process in the world were done in the head, we would have no hesitation in accepting it as cognitive") is a useful *methodological tool* for identifying candidate cases for extension and challenging internalist biases. Its *interpretation* and *application* are contentious.
  7.  **Verbal Disagreement Potential:** Part of the dispute hinges on how broadly or narrowly "cognition" is defined. A narrower definition focused on intracranial processing favors Internalism; a broader definition focused on functionally integrated systems favors EMT.

  **Precise Statements of Disagreement:**

  | Disagreement Area              | Extended Mind Theorist (EMT) Position (Wording EMT Accepts)                                                                                             | Constitutive Internalist (CI) Position (Wording CI Accepts)                                                                                                 | Crux & Test Case (User's Cloud App)                                                                                                                                                                                                                                                                    |
  | :----------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------ | :---------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Constitutive vs. Causal Role** | External resources, when satisfying criteria of reliability, accessibility, and trust, can be **constitutive parts** of an individual's cognitive processes and mental states (e.g., beliefs). The notebook *is* part of Otto's belief system. | External resources are **causal contributors** to cognition, providing inputs processed by the internal cognitive system. They do not constitute cognitive states or processes themselves. The notebook is a prompt for Otto to form an internal belief. | **Crux:** Does the external resource literally *constitute* the cognitive state/process, or does it merely *cause* an internal state/process? <br> **Cloud App Case:** EMT: Reflexive, automatic checking integrates the app's output constitutively into ongoing cognition, forming a coupled system where the app *is* part of the memory retrieval process. CI: The app provides reliable input, but the cognitive act (remembering/retrieving) occurs entirely internally *in response to* the app's output. The *belief* is formed internally upon seeing the app's result. |
  | **2. The "Glue" Problem (Binding Mechanism)** | The "glue" is established by **reliable, automatic coupling** and **trusted integration** into the agent's behavioral patterns, creating a functionally unified cognitive system. Automaticity signifies deep integration. | The "glue" binding cognition intrinsically requires **direct, non-derivative biological mechanisms** (e.g., neural pathways, synaptic plasticity). Only processes governed by these mechanisms are cognitive. Automatic learned behavior using an external tool is still tool-use, not intrinsic cognition. | **Crux:** What constitutes the necessary "binding" for extension? Is functional integration sufficient, or is a specific biological mechanism mandatory? <br> **Cloud App Case:** EMT: The user's automatic, reflexive, and trusting reliance on the app *is* the glue – it creates a coupled system indistinguishable in functional role from biological memory retrieval. CI: However automatic, the app's function relies on sensory input, motor output, and internal interpretation. The *cognitive* glue – the binding of information into a belief state – occurs only internally via biological processes. The app itself is not bound by neural mechanisms. |
  | **3. The Parity Principle's Force** | The Parity Principle is a **substantive methodological rule**: if a process *functionally equivalent* to an uncontroversially internal cognitive process is performed reliably using an external resource, we *should* consider it cognitive. It reveals internalist bias. | The Parity Principle is a **useful heuristic for identifying functional analogs**, but not a decisive rule. Functional equivalence alone is insufficient for constitution; the *physical location and constitutive mechanisms* (internal) are paramount. It risks confusing simulation with reality. | **Crux:** Does the Parity Principle mandate accepting extension for functional equivalents, or merely highlight similarities while leaving the constitutive question open? <br> **Cloud App Case:** EMT: Since checking the app is functionally equivalent to introspecting a biological memory (speed, automaticity, trust, role in guiding action), Parity demands we count it as cognitive. CI: The functional similarity is interesting but irrelevant to constitution. The biological mechanisms of memory encoding/retrieval are fundamentally different from viewing a screen, regardless of speed or trust. Parity identifies analogy, not identity. |
  | **4. Cognition: Location vs. Process** | Cognition is best understood as a **process performed by an extended system** (brain-body-environment) when tightly coupled. The boundaries of the cognitive system are not fixed by the skull. | Cognition is fundamentally a **process occurring within the biological organism**. While causally dependent on and interacting with the environment, the *locus* of cognitive processing is internal. The skull/skin boundary is significant. | **Crux:** Is the cognitive *system* defined by functional role regardless of location, or is it inherently defined by being within the organism? <br> **Cloud App Case:** EMT: The user+app forms the cognitive system for memory retrieval in this context. CI: The user *has* a cognitive system (internal); the app is a tool *used by* that system. The user's cognition happens inside them as they perceive and interpret the app's display. |

  **Conclusion:**  
  While we agree on the functional importance of external resources and the necessity of reliable access, our fundamental disagreement lies in whether such resources can *constitute* cognition itself, or whether they only *cause* internal cognitive processes. The user's cloud app case highlights the crux: EMT sees automatic, reflexive reliance as deep functional integration sufficient for constitution, while CI sees it as highly efficient tool use still dependent on internal cognitive processing for its meaning and impact. The debate hinges on the nature of constitution ("glue"), the force of functional equivalence (Parity Principle), and the very definition of "cognition" – whether it is organism-bound or system-extendable. Further empirical work on the neural correlates of tool-use automatization and conceptual analysis of "constitution" may help resolve these differences.
