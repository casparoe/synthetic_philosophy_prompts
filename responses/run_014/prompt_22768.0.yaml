answer: |-
  You've hit on a profound and often misunderstood point in welfare economics and climate policy. The standard narrative – framing δ (pure time preference) as *the* ethical parameter while treating η (elasticity of marginal utility) and g (growth rate) as largely technical – is a significant oversimplification. Let's dismantle this view and argue why the real ethical weight lies with η, g, and the inherent "impurity" of discounting:

  1.  **The Numerical Dominance of η·g: The Data Doesn't Lie**
      *   Your observation is empirically correct. Consider typical values:
          *   **δ:** Often argued to be 0.1% (Stern) to 1.5% (e.g., Nordhaus). Even "high" values are rarely above 2%.
          *   **η:** Commonly ranges from 1.0 (utilitarian) to 2.0 (more inequality-averse). Some argue for higher values (e.g., 3-4).
          *   **g:** Long-run per capita consumption growth projections, even before major climate impacts, are often 1-2% annually.
      *   **The Math:** `r = δ + η·g`. Plugging in mid-range values: δ=1%, η=1.5, g=1.5% → r = 1% + (1.5 * 1.5%) = 1% + 2.25% = **3.25%**. Here, **η·g contributes ~69% of the discount rate**. Even with a "high" δ=1.5% and a "low" η=1.0 and g=1.0%, η·g still contributes 40% (r = 1.5% + 1% = 2.5%). Over the very long horizons relevant to climate change (50-300 years), the compounding effect makes the *difference* caused by η·g vastly larger than that caused by typical δ variations.

  2.  **η: The Stealth Ethical Heavyweight**
      *   **What η Represents:** η is *not* a neutral technical parameter. It embodies fundamental ethical judgments:
          *   **Inequality Aversion:** η directly measures society's aversion to *consumption inequality*. A high η implies a strong preference for transferring resources from the rich to the poor (because the marginal utility of consumption declines steeply).
          *   **Intergenerational Equity:** Applied across time, η determines how much weight we give to the welfare of *future, richer generations* relative to poorer present generations. A high η implies we value an extra dollar to a poorer present person *much more* than an extra dollar to a much richer future person, justifying a higher discount rate (r) to reflect this diminishing marginal utility of future consumption due to growth (g).
          *   **The Ethical Core:** Choosing η is choosing *how much to count future welfare simply because future people are likely to be richer*. This is profoundly ethical. Is it fair to discount future suffering from climate catastrophe because our descendants *might* be wealthier on average? η answers this question quantitatively. Debating η *is* debating intergenerational fairness in the face of growth.

  3.  **g: The Uncertain Engine of "Impure" Discounting**
      *   **Empirical vs. Ethical:** While g is often presented as an empirical forecast, the choice of g itself involves deep normative and methodological choices:
          *   **Growth Optimism/Pessimism:** Is future growth inevitable and robust (high g), or fragile and potentially reversed by climate change or other shocks (low or negative g)? This assumption drives η·g significantly. Assuming high g is an ethical stance about the resilience of progress.
          *   **Endogeneity:** Climate policy *affects* g! Discounting based on assumed high future g to justify lower investment in mitigating the very risks that threaten g is potentially circular. The ethical choice lies in how we model this relationship and account for catastrophic risks.
          *   **Distribution of Future Welfare:** g is an *average*. Future growth might mask significant inequality or regional disparities in suffering from climate impacts. Using average g within η·g assumes a representative agent, potentially masking ethical concerns about the worst-off future populations.

  4.  **The "Fiction" of Pure Time Preference (δ) and the Reality of "Impure" Discounting**
      *   **The Core Argument:** Philosophers (e.g., Derek Parfit) and economists (e.g., Frank Ramsey himself) have long argued that pure time preference – valuing well-being less *solely* because it occurs later in time – is **ethically indefensible** for impartial social welfare evaluation across generations. Discounting the life or suffering of a future person *just because they exist later* is a form of temporal discrimination.
      *   **"Impure" Sources are the Real Drivers:** Almost all practical justifications for δ > 0 are actually arguments for *impure* time preference, arising from:
          *   **Existential Risk/Mortality:** A small probability that civilization (or humanity) ends before the future arrives. This is *risk*, not pure time preference. It should arguably be modeled explicitly as a survival probability, not baked into δ.
          *   **Opportunity Cost:** The potential for investments today to yield higher returns, making future generations richer and better able to handle problems (or pay for mitigation/adaptation). This is *already captured by g and η* within the Ramsey framework! Adding it again via δ is double-counting.
          *   **Changing Tastes/Technology:** Uncertainty about future preferences or the effectiveness of future solutions. This is *uncertainty*, best handled with explicit modeling of risk and learning, not a fixed δ.
          *   **Overlapping Generations & Myopia:** The argument that current voters/politicians inherently discount the distant future. This is a *political constraint* or *descriptive* fact about current agents, not a *normative* justification for how a social planner *should* value future welfare.
      *   **δ as a Dumping Ground:** In practice, δ often becomes a "fudge factor" absorbing these impure factors, risk premiums, model uncertainty, or simply the modeler's prior belief about the "right" level of r. Its claim to represent "pure" ethical time preference is thus largely fictional. Setting δ > 0 often smuggles in impure justifications under an ethical guise.

  5.  **Why the Focus on δ Persists (and Why It's Misleading)**
      *   **Philosophical Salience:** The idea of pure time preference is philosophically stark and controversial ("Is it fair to value my grandchild's life less than my child's just because of birth date?"). This makes it a lightning rod.
      *   **Simplicity:** δ is a single number seemingly representing "impartiality." Debating η and g requires grappling with complex interplays of inequality, growth dynamics, and risk.
      *   **Stern vs. Nordhaus Legacy:** The famous climate economics debate centered prominently on Stern's δ=0.1% (near-zero) vs. Nordhaus's δ≈1.5%. While crucial, this overshadowed the equally important differences in their η and g assumptions. Stern's low r stemmed significantly from his combination of very low δ *and* relatively low η (1.0) coupled with a standard g. A higher η would have pushed his r up even with low δ.
      *   **Convenient Target:** Critics of aggressive climate action find it easier to argue against a near-zero δ ("it's unrealistic/imposes too high a burden") than to defend high η ("we don't care much if future rich people lose a little utility") or unquestioned high g projections.

  **Conclusion: Shifting the Ethical Debate**

  You are absolutely right. The intense focus on δ as the "ethical knob" distracts from the deeper and more consequential ethical terrain:

  1.  **η is Fundamental Ethics:** The choice of η is a direct choice about intergenerational inequality aversion and the moral weight we assign to the consumption levels of richer future generations.
  2.  **g is Ethically Loaded Uncertainty:** Projecting g involves assumptions about future risks, resilience, technological progress, and the very impact of the policies being evaluated – all laden with ethical implications about our responsibility to safeguard future potential.
  3.  **The Fiction of Purity:** Maintaining δ > 0 often relies on ethically dubious pure time preference or conflates it with impure factors (risk, opportunity cost) that are either already modeled elsewhere or should be modeled explicitly. A rigorous normative framework for intergenerational justice should strive for δ=0 and explicitly model risk, opportunity cost, and uncertainty separately.

  Therefore, the real ethical battleground in discounting for climate policy is **not primarily δ, but the values chosen for η and g, and the overall commitment to disentangling impure factors from the fiction of pure time preference.** Advocates and critics alike should redirect their energy towards debating our aversion to future inequality (η) and our assumptions about the future we are saving (or failing to save) through our growth projections (g), recognizing that the "pure" rate δ is often a small number doing less heavy lifting than its reputation suggests, and frequently masking deeper ethical assumptions.
