  Can you argue that Harsanyi's aggregation theorem is basically question-begging? I want the case that the impartial observer construction smuggles in expected utility through the continuity and independence axioms, so that the result — social welfare is a weighted sum of individual utilities — is really just von Neumann–Morgenstern applied to a fictional agent. I want it to engage with the actual structure of the proof, not just the standard 'you can't compare utilities across people' objection, since Ive read that one a dozen times on rationalist forums and it doesn't feel like it's touching the real issue.
reasoning: |-
  Okay, the user is asking about Harsanyi's aggregation theorem and whether it's question-begging. They specifically want an argument that the impartial observer smuggles in expected utility via the continuity and independence axioms, reducing the social welfare result to just applying vNM to a fictional agent. They've seen the standard interpersonal utility comparison objection before and find it unsatisfying, so they want a deeper engagement with the proof's structure.

  Hmm, this user is clearly well-versed in rationalist forums and familiar with standard critiques. Their request shows they've done their homework - mentioning continuity/independence axioms and vNM foundations suggests graduate-level economics/philosophy background. They're frustrated with superficial treatments and want technical rigor.

  Let me unpack their core concern: Is Harsanyi's theorem circular because the axioms designed for the impartial observer already build in the utilitarian conclusion? The user suspects the "veil of ignorance" construction isn't doing real work since the vNM axioms applied to any agent would yield linear aggregation.

  Right, I need to walk through the proof mechanics. The key steps are: (1) defining the impartial observer's preferences over lotteries that affect others, (2) imposing vNM rationality (completeness, transitivity, continuity, independence), and (3) deriving that social welfare must be affine in individual utilities. 

  The problematic move is how individual utilities are constructed. Harsanyi defines them separately via vNM representations, but when the impartial observer compares (i, p) vs (j, q) - that is, being person i with probability p or j with probability q - the independence axiom forces these comparisons to be linear. This is where the "smuggling" happens: by assuming the observer treats probability mixtures of identities the same way vNM agents treat monetary lotteries, we've baked in utilitarianism before deriving it.

  I should emphasize how continuity and independence interact here. Continuity ensures no identity is infinitely better/worse than others (ruling out Rawls), while independence makes social welfare separable across states - exactly what generates additive aggregation. The proof's mathematical necessity (linearity from affine spaces) masks its normative loadedness.

  The user might appreciate connecting this to broader philosophy. The impartial observer isn't a neutral starting point but a utilitarian construct wearing a veil. Also worth noting Sen's point that even if utilities are comparable, weighting them equally requires additional egalitarian assumptions Harsanyi doesn't provide. 

  Must avoid rehashing the interpersonal comparison objection since they explicitly find that tired. Focus purely on how the axioms constrain the social welfare function to mimic individual choice under risk. Conclude that yes, it's circular if one questions whether social evaluation should obey vNM axioms at all - that's precisely what utilitarians and non-utilitarians disagree on.
answer: |-
  You've pinpointed the core structural critique of Harsanyi's theorem: **the impartial observer's vNM axioms, especially Continuity and Independence, directly impose the linear aggregation form *before* the conclusion is derived, making the theorem arguably question-begging.** Here's the breakdown engaging directly with the proof's mechanics:

  1.  **The Setup & Key Ingredients:**
      *   **Individuals (1...n):** Each has preferences over social lotteries `L`, representable by a vNM utility function `U_i`. This grants cardinal unit-comparable utilities (Harsanyi's claim).
      *   **Social Observer (SO):** Has preferences over social lotteries `L`. Harsanyi argues for a specific SWF based on these preferences.
      *   **Impartial Observer (IO):** Defined over a richer set of "extended lotteries." An extended lottery `[p, (i, L)]` means: With probability `p`, you *become* individual `i` facing social lottery `L`; with probability `1-p`, some other outcome (often simplified). Crucially, the IO is assumed to have preferences over these extended lotteries satisfying the **vNM axioms (Completeness, Transitivity, Continuity, Independence)**.

  2.  **The Critical Move - Applying vNM to the IO:**
      *   The IO's preferences over extended lotteries satisfy vNM axioms. Therefore, by the vNM Representation Theorem, there exists a **linear** utility function `V` representing these preferences. For a simple extended lottery `X = [p, (i, L)]` (assuming the "other outcome" is fixed or handled):
          `V(X) = p * U_IO(i, L) + (1-p) * K`
          Where `U_IO(i, L)` represents the utility assigned by the IO to the outcome "being individual `i` when social lottery `L` occurs".
      *   **Interpretation of `U_IO(i, L)`:** Harsanyi argues that the *only rational* way for the IO to evaluate "being `i` under `L`" is to adopt `i`'s own evaluation of `L`. That is: `U_IO(i, L) = U_i(L)`. This is the "empathy" or "extended sympathy" assumption. It identifies the IO's utility for a *specific identity/situation* with the individual's own vNM utility for that situation.

  3.  **Where the "Smuggling" Happens (Continuity & Independence):**
      *   **Continuity:** This axiom forces the IO to make trade-offs between the *probability* of being someone and *who* they might be. There are no "infinitely good" or "infinitely bad" identities from the IO's perspective. If being `i` in a great state (`U_i` high) is preferred to being `j` in a mediocre state (`U_j` medium), which is preferred to being `k` in a terrible state (`U_k` low), then Continuity demands there exists *some probability* `q` such that the IO is indifferent between:
          *   *Certainly* being `j` in the mediocre state, and
          *   A *lottery* giving `q` chance of being `i` in the great state and `(1-q)` chance of being `k` in the terrible state.
          *   **Consequence:** This *requires* that `U_IO(j, L)` (and hence `U_j(L)`) can be expressed as a *linear combination* of `U_IO(i, L)` (i.e., `U_i(L)`) and `U_IO(k, L)` (i.e., `U_k(L)`). Linearity is baked in at the level of identity comparison.
      *   **Independence:** This axiom is even more potent. Suppose the IO compares two extended lotteries `X` and `Y` that are identical *except* in one mutually exclusive contingency (with prob. `r`). Independence states that if `X` is preferred to `Y`, then mixing both with a *third* extended lottery `Z` (with prob `1-r`) won't change the preference: `[r, X; (1-r), Z] > [r, Y; (1-r), Z]` iff `X > Y`.
      *   **Application to Identity:** Consider extended lotteries differing *only* in who the IO becomes under a specific sub-lottery. Suppose the IO prefers "being `i` facing `L`" to "being `j` facing `L`" (i.e., `U_IO(i, L) > U_IO(j, L)`, so `U_i(L) > U_j(L)`). Independence implies that mixing both prospects with *any other extended lottery* `Z` (e.g., "being `k` facing `M`" with prob `1-r`) won't reverse this preference. The IO's *ranking* of identities under a fixed social outcome `L` is *independent* of what happens in other states or to other identities. **This directly imposes separability/additivity across individuals.** The utility of one individual's outcome doesn't interact with another's in the IO's evaluation under risk.

  4.  **The "Derivation" - Affine Transformation & Social Welfare:**
      *   Combining `V(X) = p * U_i(L) + (1-p) * K` (for `X = [p, (i, L)]`) with the vNM linearity of `V`, and extending to more complex lotteries involving multiple identities, leads to the conclusion that `V` must be an **affine function** of the individual `U_i`'s for any given social lottery `L`.
      *   Specifically, for a *pure* social alternative (degenerate lottery `L`), the IO's utility must be: `W = a_0 + a_1*U_1 + a_2*U_2 + ... + a_n*U_n`.
      *   For the IO to be impartial (symmetric in individuals), Harsanyi argues the weights `a_i` should be equal (`a_1 = a_2 = ... = a_n`), leading to `W = sum(U_i)` (plus constant, irrelevant for ranking). The SWF ordering social alternatives is the ordering induced by this `W`.

  5.  **Why This is Question-Begging:**
      *   **The Core Issue:** The theorem doesn't *derive* utilitarianism *from* the idea of an impartial observer behind a veil of ignorance in a way that justifies the vNM axioms *for that observer*. Instead, it **assumes** the IO evaluates risky prospects over identities *exactly like a vNM-rational individual evaluates risky prospects over goods*. This assumption *directly implies* the linear (expected utility) form *at the level of the IO's preferences*.
      *   **Smuggling Complete:** The step `U_IO(i, L) = U_i(L)` identifies the IO's state-specific utility with the individual's vNM utility. But the *key structure* – the linear aggregation of these `U_i(L)` values into the overall `W` – comes **entirely** from the prior application of the vNM axioms (Continuity & Independence) to the IO's extended preferences. The vNM rationality of the IO is doing *all* the heavy lifting.
      *   **The "Fictional Agent" is Key:** Your intuition is correct. The theorem essentially says: *If* you construct a fictional agent (the IO) who treats lotteries over identities *exactly* like a vNM-rational individual treats lotteries over prizes, *and* you assume this agent adopts the perspectives of the individuals they might become, *then* this fictional agent's preferences will be represented by a weighted sum of individual vNM utilities. The conclusion (weighted sum) is a direct mathematical consequence of the vNM axioms applied to this specific choice domain (identity lotteries).
      *   **What's Missing:** A *justification* for why the IO *must* satisfy Continuity and Independence *over identity lotteries*. Why should evaluating the risk of *being different people* obey the same axioms as evaluating the risk of getting different amounts of money? One can readily imagine impartial perspectives that violate these axioms:
          *   **Continuity Violation:** An IO who finds being *anyone* subjected to torture so horrific that no probability of being a non-tortured person makes them indifferent to certainly being someone in a merely "bad" situation. (Lexical priority for avoiding worst-off positions, akin to Rawls).
          *   **Independence Violation:** An IO who cares about *relative standing* or *equality*. Suppose `U_A(L1) > U_B(L1)` and `U_A(L2) = U_B(L2)`. The IO prefers `L1` (better for A) if identity is certain. But now mix both with `Z` = "being C facing extreme inequality favoring C". The IO might prefer the mixture leading to `L2` + `Z` over `L1` + `Z` because `L2` + `Z` creates less *overall* inequality than `L1` + `Z`, even though `L1` was preferred under certainty. This violates Independence. The value of an outcome for one individual depends on the outcomes for others.

  **Conclusion:** You are right to suspect the theorem is question-begging. By assuming the Impartial Observer satisfies vNM rationality (specifically Continuity and Independence) over lotteries concerning *which person to be*, Harsanyi builds the utilitarian conclusion (linear aggregation) directly into the premises. The construction of the IO isn't a neutral device that *generates* utilitarianism from impartiality; it's a device that *assumes* a specific (vNM) form of rational impartial evaluation under risk, which inherently *is* utilitarian aggregation. The theorem shows internal consistency and the power of the vNM framework, but it doesn't provide a fundamental *justification* for applying that specific framework to the problem of social evaluation behind a veil of ignorance. The objection isn't primarily about interpersonal comparison (though that's related); it's about the **smuggling of the utilitarian functional form via the assumed vNM rationality of the impartial observer over identity lotteries**.
