prompt: |-
  I've been designing puzzles for a small escape-room company for about three years, and I've run into a vocabulary problem I can't seem to solve on my own. Here's the thing I keep needing to talk about. When a player walks into one of my rooms, some information gets across just from the fact that a thing in the room was placed there on purpose -- the padlock on the drawer, the book left face-down on the table. Nobody had to agree on a code for that to carry anything; it carries something because a person put it there and the player knows a person put it there. Then there's a second layer, information that only lands if the player and I already share a convention -- that the dial runs 0 through 9, that a scrap of paper with three digits on it is probably indexing something three digits long, that red usually means stop and blue usually means go. And then a third layer: the actual content, the combination, the word, the thing the puzzle is *for*. In a room that works, all three are running at once and nobody can tell them apart. When a room fails, it's usually because I skipped one, and it's almost always the middle one -- I assumed a convention the players had no reason to have.

  What bugs me is that I need to say these three things separately and I have no words for them. "Clue," "hint," and "answer" all cut straight across all three. I did a linguistics minor in college so I've poked around alot of the obvious places -- the natural-versus-deliberate meaning thing Grice does, Peirce's icon/index/symbol split, information-theoretic talk about how much a signal carries -- and none of them is quite it, because what I'm pointing at isn't about *kinds of signs* or about *amounts of information*, it's about layers of shared background that all have to be in place before a message does anything at all.

  Is there a settled name for this stratification? I'm definately not just after a label, though -- what I actually want is to know where the seams are. For instance: if a convention gets universal enough (that a locked door is meant to be opened, say), does it stop being middle-layer and become bottom-layer? Is the bottom layer really one layer, or is it secretly a stack of its own, since noticing that something was placed on purpose already requires me to know what "on purpose" looks like? And what about the case where the middle layer swallows the others -- where the fact that I chose to write a clue in French, or to leave a conspicuously fake red herring, is itself the message and the content is nearly beside the point? Same phenomenon, or does that want a fourth slot?
reasoning: |-
  Okay, the user is an escape room puzzle designer with three years of experience. They're struggling to define three distinct layers of information conveyance in their puzzles. Let me break down their layers clearly. 

  First layer: Intentionality. Things like a padlock on a drawer signal purpose simply because they're placed deliberately. Players recognize human design without explicit codes. 

  Second layer: Shared conventions. This includes cultural or contextual understandings—like dials going 0-9 or red meaning stop. The user notes most failures happen here when assumed conventions aren't shared. 

  Third layer: Actual content. The solution itself, like a combination or keyword. 

  The user rejects existing frameworks (Grice, Peirce, information theory) because their issue is about prerequisite shared understanding layers, not sign types or data volume. 

  Their deeper questions reveal theoretical curiosity: Can universal conventions (e.g., locked doors must open) shift from second to first layer? Is the first layer itself layered (e.g., recognizing intentionality requires its own framework)? And what about meta-cases where the convention choice *is* the message (e.g., French clues as intentional misdirection)? 

  This isn't just terminology hunting—they want to understand the boundaries between these cognitive layers to debug design failures. Their linguistics background means they'll appreciate precise conceptual distinctions but dislike forced jargon. 

  I recall "common ground" (Clark) fits well—it's the shared knowledge enabling communication. The layers map to:  
  - **Device-level common ground**: Recognizing intentional design (baseline human-environment interaction)  
  - **Convention-level common ground**: Cultural/contextual shorthand (vulnerable if mismatched)  
  - **Content-level common ground**: Puzzle-specific data exchange  

  For their edge cases:  
  - Universal conventions *do* become device-level over time (like locks).  
  - Device-level *is* layered—e.g., understanding "purpose" requires innate/learned pattern recognition.  
  - Meta-use of conventions (e.g., French clues as red herrings) exploits convention-level intentionally, so it's still second-layer—just repurposed.  

  They might also benefit from "affordance" (Gibson/Norman) for device-level (objects scream their functions) and "semiotics of the artificial" for designed intentionality. No need to overcomplicate with fourth layers—meta cases are convention-level flexing its muscles.  

  Key insight: Their layers are cumulative dependencies. Each requires the one below it. That's why convention-layer failures are fatal—it collapses the stack. Naming should reflect that interdependence.
answer: |-
  What you're describing is a beautifully precise dissection of escape room semiotics, and you're absolutely right – existing frameworks don't quite capture this specific stratification of *shared cognitive prerequisites* for puzzle communication. This isn't just about signs or information; it's about the **layered scaffolding of shared understanding** required for a deliberate communicative act to land. Here's a breakdown and proposed vocabulary based on your core insight:

  ### Proposed Terminology & Framework

  1.  **Grounding (or "Establishing Intentionality"):**
      *   **What it is:** The fundamental layer where the player recognizes that an element exists *as part of a designed experience*, not random environmental noise. It signals "This was placed here deliberately *for you to interact with*."
      *   **Examples:** Padlock on a drawer, book face-down, a distinctively colored object among clutter, a locked door, a conspicuously empty slot.
      *   **Shared Background:** Basic human understanding of agency, purposefulness, and the context of being in a designed game environment ("This is an escape room; things here are meant to be solved").
      *   **Why "Grounding"?** It establishes the *common ground* that this is a communicative situation. It answers the question: "*Why should I pay attention to this thing at all?*" (Because it was put here *for* you).

  2.  **Framing (or "Invoking Convention"):**
      *   **What it is:** The layer that signals *how* the player should interact with the grounded element or *what kind of meaning system* to apply. It leverages shared cultural, contextual, or game-specific conventions.
      *   **Examples:** Numbers 0-9 on a dial imply combination entry; a sequence of dots/dashes near a light suggests Morse code; red/blue wires imply a choice (often with stop/go connotations); a torn piece of paper with numbers implies indexing; a keyhole shape implies a key is needed; symbols matching symbols elsewhere imply correspondence.
      *   **Shared Background:** Cultural knowledge, common puzzle tropes, established escape room norms, *specific* instructions given pre-room, or patterns learned *within* the room itself. This is where mismatches happen ("I didn't know that symbol meant that!").
      *   **Why "Framing"?** It sets the *frame* or *lens* through which the player interprets the grounded element. It answers the question: "*What kind of thing is this, and how do I start thinking about it?*" (It's a combination lock; use the numbers you find elsewhere).

  3.  **Payload (or "Core Content"):**
      *   **What it is:** The specific, unique information needed to solve the puzzle step. This is the "answer" or the key data point.
      *   **Examples:** The actual combination "273", the word "LIBRARY" found by indexing, the correct wire color "blue" based on a clue, the specific key that fits the lock.
      *   **Shared Background:** Successfully applying the frame established in layer 2 to the specific instance within the room.
      *   **Why "Payload"?** It's the specific informational *content* delivered *after* grounding and framing have successfully established the channel and the codebook. It answers the question: "*What is the specific solution this element provides?*"

  ### Addressing Your Seam Questions

  1.  **Universal Conventions Shifting Layers:** **Absolutely yes.** When a convention becomes near-universal *within the escape room context* (or even broader culture), it can migrate downwards.
      *   *Example:* "A locked container means it can/should be opened" is so fundamental it moves from **Framing** (interpreting the lock) to **Grounding** (the lock itself signals intentionality and interactivity). Similarly, "a keyhole requires a key" is often Grounding in an escape room, whereas "this specific symbol requires *that* key" is Framing/Payload. The line is fluid and depends entirely on the expected audience's shared knowledge.

  2.  **Is Grounding a Stack? Yes, implicitly.** Recognizing "on purpose" relies on deeper cognitive layers:
      *   Recognizing objects vs. background.
      *   Understanding human agency and design intent.
      *   The meta-context of being in a game ("Everything here is potentially significant"). While we call it one layer for simplicity, its foundation rests on these more fundamental cognitive abilities and contextual awareness. For practical design purposes, treating it as "Did the player notice and accept this as part of the game?" is usually sufficient.

  3.  **When Framing Swallows the Others (Meta-Use):** **This is still Framing, pushed to its limits.** Choosing French, leaving a blatant red herring, or using an obscure convention *is itself a deliberate act of Framing*.
      *   *French Clue:* The **Grounding** is the clue itself. The **Framing** is "This clue is written in French, implying you either need to translate it or find someone/something that can." The **Payload** is the translated text or the action of finding the translator. The *choice* of French is part of the Framing message.
      *   *Conspicuous Red Herring:* The **Grounding** is the object. The **Framing** is "This object is *so obviously* a clue/puzzle piece, it might be a distraction." The **Payload** is the player's decision to *ignore* it. The *intention* to misdirect is communicated through the Framing (its conspicuousness relative to other elements).
      *   **Does it need a 4th layer?** Not really. This is Framing operating at a higher level of abstraction or reflexivity. The "message" *is* the framing choice itself. The Payload might be an action (ignore this, translate that) rather than traditional data. The core three-layer structure still holds: You recognize the thing (Grounding), you interpret *what its presentation means* (Framing: "this is probably a trick"), and you act based on that interpretation (Payload: ignore it). The "content" is the meta-instruction derived from the framing choice.

  ### Why This Framework Works for You

  *   **Focus on Shared Prerequisites:** It explicitly centers the *shared understanding* required at each step for communication to occur.
  *   **Action-Oriented:** Each layer answers a key question guiding player action (Pay attention? How to interact? What's the answer?).
  *   **Debugging Tool:** Pinpoints failure points:
      *   **Grounding Failure:** Player didn't notice/didn't think the element was part of the puzzle. (Solution: Make it more conspicuous, integrate better, ensure room context signals significance).
      *   **Framing Failure:** Player saw it was important but didn't know *how* to interpret it or what convention to apply. (Solution: Strengthen convention cues within the room, provide clearer "training" puzzles, avoid overly obscure tropes, ensure cultural fit).
      *   **Payload Failure:** Player applied the correct frame but couldn't extract/apply the specific information (e.g., combination didn't work). (Solution: Check clue logic, ensure information is present and unambiguous within the frame).
  *   **Acknowledges Fluidity:** Allows for conventions shifting layers (Grounding <-> Framing) and Framing carrying significant meta-meaning.

  While terms like "Grounding," "Framing," and "Payload" aren't universal standards in semiotics, they precisely capture the distinctions *you* need as a designer focusing on the *cognitive and communicative process* of puzzle-solving. They highlight the layered dependencies of shared understanding that make an escape room puzzle click (or fail). Your insight into the critical, often neglected middle layer (Framing/Convention) is spot-on – it's the fragile bridge between recognizing intent and extracting meaning.
