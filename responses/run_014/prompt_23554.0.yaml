  We know that in the PD, T > R and P > S. Also, T > R > P > S. Therefore, T-R > 0 and P-S > 0. However, note that P - R is negative because R > P.

  So:

  E[D] - E[C] = f*(P-R) + (1-f)*p*(T-R) + (1-f)*(1-p)*(P-S)

  Since P-R is negative, the first term is negative. The other two terms are positive. Therefore, the sign of E[D]-E[C] depends on the balance.

  We want to know when E[D] > E[C], i.e., when E[D]-E[C] > 0.

  So:

  f*(P-R) + (1-f)*p*(T-R) + (1-f)*(1-p)*(P-S) > 0

