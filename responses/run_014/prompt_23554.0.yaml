  We are in a large world with many one-shot Prisoner's Dilemma (PD) encounters. The PD payoff matrix (for a row player) is:

            Cooperate | Defect
          ---------------------
  Cooperate |   R     |   S
  Defect    |   T     |   P

  where T > R > P > S and 2R > T+S (so mutual cooperation is better than mutual defection, and defection is dominant in a one-shot without correlations).

  We face opponents that are of two types:
  1. Correlated: they run an algorithm that is highly evidentially correlated with ours. That is, they are likely to do the same as we do in the same situation.
  2. Uncorrelated: they run algorithms that are independent of ours.

  Let the fraction of correlated opponents in the population be `f`. Then the fraction of uncorrelated opponents is `1-f`.

  Our goal is to choose an action (C or D) that maximizes our expected payoff.

  Because of the evidential link, our own choice of action is evidence about what the correlated opponents will do. Specifically, if we choose to cooperate, then that is evidence that the correlated agents would also cooperate (because they are correlated with us). Similarly, if we defect, that is evidence that the correlated agents would defect.

  However, note that the uncorrelated agents are not influenced by our action (evidentially or causally). So the probability that an uncorrelated agent cooperates or defects is fixed (we assume) and independent of our action. Let the base rate of cooperation among uncorrelated agents be `p` (so they cooperate with probability `p` and defect with probability `1-p`).

  Now, consider the expected payoff if we choose to cooperate:

  - With probability `f`, we face a correlated opponent. Then, because of correlation, they are very likely to cooperate (we assume the correlation is strong enough that we can approximate it as perfect for simplicity). So we get R.
  - With probability `1-f`, we face an uncorrelated opponent. Then, they cooperate with probability `p` and defect with probability `1-p`. So we get: R (if they cooperate) with probability `p`, and S (if they defect) with probability `1-p`.

  Hence, the expected payoff for cooperation (C) is:

    E[C] = f * R + (1-f) * [ p * R + (1-p) * S ]

  Similarly, if we defect:

  - With probability `f`, we face a correlated opponent. Then, they are very likely to defect (because we defect). So we get P? Wait, note: if we defect and they defect, we get P. But if we defect and they cooperate, we get T. However, because of the strong correlation, if we defect they are very likely to defect. So we get P (with high probability, but let's assume perfect correlation so we get P for sure in this case).
  - With probability `1-f`, we face an uncorrelated opponent. Then, we get T if they cooperate (prob `p`) and P if they defect (prob `1-p`).

  Hence, the expected payoff for defection (D) is:

    E[D] = f * P + (1-f) * [ p * T + (1-p) * P ]

  We want to know when E[D] > E[C]. That is, when is defection the better choice?

