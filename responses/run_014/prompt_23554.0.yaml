  Alternatively, let's isolate the terms with f:

  f*(P-R) + (1-f)* [ p*(T-R) + (1-p)*(P-S) ] > 0

  = f*(P-R) + [ p*(T-R) + (1-p)*(P-S) ] - f*[ p*(T-R) + (1-p)*(P-S) ] > 0

  = f*[ (P-R) - ( p*(T-R) + (1-p)*(P-S) ) ] + [ p*(T-R) + (1-p)*(P-S) ] > 0

  But note: (P-R) is negative and the term we subtract in the bracket is positive, so the entire coefficient of f is negative. Therefore, as f increases, the expression becomes more negative. So we want to see when the entire expression is positive.

  Let me define:

  A = p*(T-R) + (1-p)*(P-S)

