prompt: |-
  I'm putting together a problem set for a small seminar on measurement, incentives, and agency, and I keep wanting a case that is Goodhart without the obvious cheating story. I was discussing this with a friend who does econometrics, and she kept saying the interesting failure is not that people are deliberately gaming the metric, but that the optimization changes the world in which the metric was calibrated. I find that distiction a bit fuzzy, so I'd like an example that makes it crisp.

  Please give an example of a conceptual issue where a decision-maker optimizes a proxy variable, nobody is intentionally exploiting the metric, and the proxy nevertheless becomes unreliable because the intervention shifts the relevant population or environment. Make it concrete enough that I can put it in a handout, but not so complicated that the point gets lost. Ideally it should show why the proxy was not merely a noisy estimator, and why collecting more data from the original pre-intervention distribution might not fix the problem.
reasoning: |-
  We are looking for an example of Goodhart's law that doesn't involve intentional gaming but rather a shift in the environment due to optimization, making the proxy unreliable. The key is that the intervention changes the population or environment in a way that breaks the relationship between the proxy and the true goal.

  Example: **Healthcare Performance Metrics**

  **Background:**
  A hospital system wants to improve patient health outcomes (the true goal). They use a proxy metric: the rate of administering a specific treatment (e.g., antibiotics for pneumonia) within a certain time window (say, 4 hours) after diagnosis. This metric was chosen because a study on historical data showed that patients who received antibiotics within 4 hours had better survival rates.

  **The Problem:**
  The hospital starts optimizing for this metric by implementing protocols to ensure that antibiotics are given within 4 hours. Initially, the metric improves and patient outcomes also improve. However, over time, the hospital staff become so focused on the 4-hour window that they start giving antibiotics to patients without a confirmed pneumonia diagnosis, just to meet the time target. They do this not to cheat, but because they are under pressure to avoid missing the window for any patient who might have pneumonia.

  **Why it's not just noise and why more pre-intervention data doesn't help:**
  - The historical study was done in an environment where the treatment was given only to patients with a confirmed diagnosis. The correlation between timely treatment and survival was conditional on the patient having pneumonia.
  - After the intervention, the patient population being treated changes: now it includes many patients without pneumonia (false positives). For these patients, the treatment is unnecessary and might even be harmful (due to side effects or antibiotic resistance). Moreover, the hospital's resources are being diverted from other critical tasks to meet this target.
  - Thus, the proxy (timely antibiotic administration) becomes less correlated with the true goal (patient health) because the population of patients receiving the antibiotic has shifted (now includes many without pneumonia). The environment (the way patients are diagnosed and treated) has changed.

  **Why this is different from intentional cheating?**
  In this scenario, the staff are not intentionally giving antibiotics to patients without pneumonia to make the numbers look good. They are genuinely trying to help and believe that it's better to err on the side of caution. The hospital's protocol might even encourage over-diagnosis to avoid missing a true case. The shift in the patient population is an unintended consequence of optimizing the proxy.

  **Why more data from the pre-intervention distribution wouldn't fix the problem?**
  If we collect more pre-intervention data, we would still only see cases where antibiotics were given to confirmed pneumonia patients. We would not observe the new scenario where non-pneumonia patients are being treated. Thus, the historical data cannot capture the changed relationship between the proxy and the outcome in the new environment.

  **Conceptual Takeaway:**
  The failure is due to a shift in the data distribution (from a population of confirmed pneumonia patients to a broader group) induced by the optimization. This breaks the causal link between the proxy and the true goal. The proxy was a good indicator in the old regime, but optimizing it changes the regime, making the proxy a bad indicator.

  This example illustrates the distinction between gaming (intentional manipulation) and the more subtle issue of the proxy becoming invalid due to the intervention altering the environment.
answer: |-
  Here's a concrete example that cleanly illustrates Goodhart's Law without intentional cheating, focusing on how optimization changes the environment and breaks the proxy's validity:

  ---

  ### Case Study: The Overfished Lake  
  **True Goal:** Sustainable fish population in Lake Alder  
  **Proxy Metric:** Average fish weight in weekly catch samples  

  #### Background  
  - Ecologists established the proxy by studying Lake Alder pre-intervention:  
    - Heavier average fish weight strongly correlated with healthy breeding populations (true goal).  
    - Light average weight indicated overfishing or ecosystem stress.  
  - The relationship held because *natural fishing patterns* captured representative fish.  

  #### Intervention  
  - A regulation incentivizes fishers:  
    - "Maximize average fish weight in weekly samples."  
    - No cheating occurs—fishers follow rules diligently.  

  #### What Happens  
  1. **Initial Success:**  
     Fishers avoid catching small fish. Average weight rises.  
     Ecologists celebrate—proxy suggests sustainability.  

  2. **Unintended Shift:**  
     - Fishers innovate: Use nets with larger mesh sizes (allowed) to *avoid catching small fish*.  
     - Result: Juvenile fish are rarely caught, so samples skew toward large, slow-reproducing adults.  

  3. **Proxy Breaks:**  
     - Average weight stays high, but the *true population collapses*:  
       - Fewer juveniles survive to adulthood (due to natural predation).  
       - Breeding rates plummet—large fish are less fertile.  
     - Within 2 years, fish stocks crash despite "good" proxy values.  

  #### Why This Isn't Just Noise or Fixable with More Data  
  - **Not Noise:**  
    Pre-intervention data showed a *stable causal link*: natural variation in fish size reflected population health. Noise would cause random errors, but here the *relationship itself changed*.  
  - **Pre-Intervention Data Fails:**  
    More pre-regulation data would only confirm the *old* linkage (size ∝ population health). It cannot predict:  
    - How fishers' behavior *alters selection pressure* on fish.  
    - The new ecological dynamic where high average weight *causes* collapse by removing juveniles.  

  #### Key Distinction  
  The proxy broke because optimization **shifted the population distribution**:  
  - Pre-intervention: Samples represented the *natural* fish distribution.  
  - Post-intervention: Samples reflected an artificially truncated population (missing juveniles).  
  No one "gamed" the metric—fishers complied earnestly, but their rational adaptation changed the system.  

  #### Conceptual Punchline  
  > **"When you optimize a proxy, you transport it to a new world where yesterday's correlations are obsolete."**  
  > The lake's ecology became dependent on the intervention, invalidating the proxy *not through malice*, but through *changed environment dynamics*.  

  ---

  ### Discussion Questions for Seminar  
  1. Why couldn't regulators "fix" this by collecting more pre-intervention data?  
  2. How might you design a metric less vulnerable to this type of shift?  
  3. What real-world systems (education, healthcare, corporate KPIs) face similar hidden shifts?  

  This example avoids gaming/cheating tropes while crisply showing how optimization invalidates proxies by altering the underlying system. The environmental shift explains why the proxy becomes actively misleading, not just imprecise.
