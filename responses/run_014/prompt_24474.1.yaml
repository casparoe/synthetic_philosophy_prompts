  **Kripke Frame Setup:**  
  - Let \((W, \leq)\) be a Kripke frame, where \(W\) is a set of nodes (temporal states) and \(\leq\) is a partial order (reflexive, transitive, antisymmetric) representing temporal accessibility.  
  - Let \(\Vdash\) be a monotone forcing relation: if \(w \leq v\) and \(w \Vdash \phi\), then \(v \Vdash \phi\) (truth is preserved forward in time).  
  - Atomic propositions: \(P\) (e.g., "sea battle occurs") is evaluated at nodes. We add a **future tense operator** \(F\) (e.g., \(FP\) = "there will be a sea battle").  
  - Semantics for \(F\):  
    \[
    w \Vdash FP \quad \text{iff} \quad \exists v \geq w : v \Vdash P
    \]
    \[
    w \Vdash \neg FP \quad \text{iff} \quad \forall v \geq w : v \not\Vdash P
    \]  
  - **Law of Excluded Middle (LEM)** for \(\phi\): \(\phi \lor \neg\phi\) (a schema, not universally valid in intuitionistic logic).

  #### Open-Future Position (Indeterminism)  
  - **Formalization**:  
    - Frame: Branching tree (e.g., \(W\) is a tree of histories, \(\leq\) is prefix ordering).  
    - At current node \(w_0\), for \(FP\):  
      \[
      w_0 \not\Vdash FP \quad \text{and} \quad w_0 \not\Vdash \neg FP.
      \]  
    - **Semantic justification**:  
      - \(w_0 \not\Vdash FP\) because no branch *guarantees* \(P\): \(\nexists v \geq w_0\) such that *all* branches through \(w_0\) contain \(v\) with \(v \Vdash P\).  
      - \(w_0 \not\Vdash \neg FP\) because no branch *precludes* \(P\): \(\nexists\) a branch where \(\forall v \geq w_0, v \not\Vdash P\) holds universally across all branches.  
    - **Frame condition**: Branching with **no shared futures** (no node beyond \(w_0\) lies on all branches).  
    - **Logic**: Rejects LEM for \(FP\) (i.e., \(\not\models FP \lor \neg FP\)). Validates **weak excluded middle** (\(\neg\phi \lor \neg\neg\phi\)) but not full LEM.  

  #### Determinism (Bivalence)  
  - **Formalization**:  
    - Frame: Linear order (e.g., \(W = \mathbb{N}\), \(\leq\) is total order).  
    - At current node \(w_0\), for \(FP\):  
      \[
      w_0 \Vdash FP \quad \text{or} \quad w_0 \Vdash \neg FP.
      \]  
    - **Semantic justification**: Linearity ensures all futures agree on \(P\):  
      - Either \(\exists v \geq w_0 : v \Vdash P\) (so \(w_0 \Vdash FP\)),  
      - or \(\forall v \geq w_0 : v \not\Vdash P\) (so \(w_0 \Vdash \neg FP\)).  
    - **Frame condition**: Linearity (totally ordered \(\leq\)).  
    - **Logic**: Validates LEM for all propositions, including \(FP\) (i.e., \(\models FP \lor \neg FP\)). Classical logic holds.  

  ### Residue Report  

  #### 1. Claims Translating Cleanly  
  - **Open-future as indeterminacy**: "Indeterminate" maps exactly to "not currently forced" (\(w_0 \not\Vdash \phi\)) and "not forcedly false" (\(w_0 \not\Vdash \neg\phi\)).  
  - **Determinism as bivalence**: "Already true/false" maps to \(w_0 \Vdash \phi\) or \(w_0 \Vdash \neg\phi\) for \(\phi = FP\).  
  - **Role of frame structure**:  
    - Branching frames \(\leftrightarrow\) openness (indeterminacy possible).  
    - Linear frames \(\leftrightarrow\) determinism (bivalence necessary).  
  - **LEM as crux**: Open-future rejects LEM for \(FP\); determinism validates it.  
  - **Intermediate logics**:  
    - Open-future: **KC (Jankov’s logic)** or **BD₂** (validates \(\neg\phi \lor \neg\neg\phi\), refutes \(\phi \lor \neg\phi\)).  
      Frame condition: No infinite ascending chains + convergence (all branches have common pasts but not futures).  
    - Determinism: **Classical logic** (validates LEM universally).  
      Frame condition: Linearity.  

  #### 2. Claims Translating with Distortion  
  - **"Indeterminate" vs. "not forced"**:  
    - **Match**: "Indeterminate" cleanly maps to \(w \not\Vdash \phi \land w \not\Vdash \neg\phi\) in branching frames.  
    - **Distortion**: Philosophical "indeterminacy" implies *metaphysical openness*, whereas \(w \not\Vdash \phi\) is purely epistemic (lack of verification). This is a **conceptual gap**; your framework doesn’t distinguish metaphysical from epistemic indeterminacy.  
  - **Open-future as LEM rejection**:  
    - **Match**: Rejecting LEM for \(FP\) is necessary and sufficient in branching frames.  
    - **Distortion**: Open-future requires branching (or analogues like histories). In linear frames, \(w \not\Vdash FP \land w \not\Vdash \neg FP\) is impossible—distorting the position.  
    - **Added condition**: Branching alone isn’t enough; you need **no inevitable futures** (i.e., \(\forall w, \exists \text{branches } B_1, B_2\) through \(w\) such that \(B_1\) satisfies \(FP\) and \(B_2\) satisfies \(\neg FP\)).  
  - **Role of negation**:  
    - \(\neg FP\) means "will never happen" (\(\forall v \geq w, v \not\Vdash P\)), not "not will happen." Philosophers might conflate \(\neg\) with a weaker "not necessarily," but your \(\neg\) is intuitionistically strong.  

  #### 3. Untranslatable Residue  
  - **Temporal ontology**:  
    - **Residue**: Philosophers debate if future events "exist" (eternalism) or are "unreal" (presentism). Your frames assume a fixed \(W\), implicitly eternalist. This is a **defect of framework** for presentists.  
  - **Agency and control**:  
    - **Residue**: Human ability to "choose" futures (e.g., sea battle avoidable). Your semantics lacks agents/choices—only branch structures. **Defect of framework** for libertarian positions.  
  - **Truthmakers vs. forcing**:  
    - **Residue**: Determinists might say \(FP\) is "true now" due to *current* truthmakers (e.g., fate), while you equate truth with forcing. If forcing requires future verification, this **distorts determinism** (they’d reject \(w \Vdash FP\) requiring future nodes).  
  - **Vagueness in "will"**:  
    - **Residue**: "Will" could mean "inevitably" (open-future) or "possibly" (determinism). Your \(F\) defaults to "possibly," but philosophers might dispute this. **Sign of philosophical unclarity**.  

  ### Summary of Translation Fidelity  
  - **Clean**: Core claims (indeterminacy, bivalence, LEM, frame dependence) translate exactly.  
  - **Distorted**: Metaphysical/epistemic indeterminacy distinction; negation strength; presentism.  
  - **Untranslatable**: Agency, truthmakers without verification, non-bivalent "will."  
  - **Defects**: Framework assumes eternalism and lacks agents. These are **framework limitations**, not philosophical vagueness.  
  - **Philosophical vagueness**: "Will" is ambiguous; your formalization forces a precisification ("possibly" for \(F\)), exposing unclarity.  

  This formalization shows that the debate reduces to frame structure (branching vs. linear) and LEM’s validity for \(F\)-propositions. The residue highlights where philosophy exceeds mathematical metaphysics.
