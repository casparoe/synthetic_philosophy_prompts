prompt: |-
  I teach a grad seminar on chance and time, and every year for the last session I put one deliberately bad argument on the board and make the students find the crack in it. This year the argument backfired: I can't find the crack myself, and one of the students has started defending the conclusion. Here it is, cleaned up but with the structure I actually used. Let C be a rational credence function, let X be the proposition that the chance of A at time t is x, and let E be whatever else the agent knows:

  1. The Principal Principle says: if E is admissible, then C(A | X ∧ E) = x.
  2. Admissible evidence, as I gloss it for the class, is evidence that tells you nothing about A over and above what the chance already tells you. The paradigms are evidence about the physical set-up of the chance process, and evidence about the past.
  3. The outcomes of a chance process up to time t are evidence about the past.
  4. So the observed relative frequency up to t is admissible. Take a coin you're certain is fair, chance of heads 0.5, and suppose you've just watched a run of 100 heads. Then C(heads on flip 101 | X ∧ F) = 0.5, where F is the proposition recording the run.
  5. Generalize: so long as you're certain of X, no finite body of frequency data from that very process can move your credence about the next trial off x. The Principle plus certainty about the chance is frequency-blind by construction.
  6. But a principle that makes it rationally required to disregard all frequency evidence from the process it governs is not a guide to life, which is precisely what Lewis wanted chance to be. And (5) doesn't even look like a fact about chance: if I'm certain the die is loaded 0.6 toward six, no run of non-sixes should move me either, and nobody thinks that's a deep discovery about dice. So the Principle isn't doing the work its fans claim for it.
  7. Therefore either the Principle is false, or certainty about chances is never available to us, or chance isn't a guide to life after all.

  My student's line, and the part I couldn't answer at the board: you wrote the certainty into (1) and (4) yourself, so you can't turn around and complain about what certainty licenses. If the Principle is a constraint on credence conditional on a chance hypothesis, its job was never to tell you how to respond to evidence that bears on which chance hypothesis is right, and (5) is a true theorem about a conditional you chose to set up rather than an indictment of it. Another student, who comes over from the statistics department, said it was just the old point that a likelihood is not a posterior, and I said that's a slogan and not an argument, and we went around in circles for twenty minutes. My own instinct is that (2) or (3) is the weak link — surely a long run of heads isn't merely evidence about the past, it's evidence about the chance — but I can't articulate why that isn't just begging the question against the Principle, since the whole point of (2) is to sort admissible from inadmissible evidence. So I'm not sure whether the argument is invalid, and if so exactly which step does the work, or valid with a conclusion I have to swallow.

  Two follow-ups I'd want folded into the diagnosis. First, what happens if you swap in the version Lewis moved to later, where the constraint lands on your unconditional credence in A and it's supposed to equal your expected chance — a weighted average over the competing chance hypotheses, weighted by your credence in each? Does that dissolve (5), or just relocate it one level up? Second, is there a leftover problem about chance functions that get shifted by the very evidence that would move your credence in them, and does the Humean part of the story end up load-bearing for whichever diagnosis you give, or can a non-Humean about chance dodge it?

  Please don't split the difference and don't hedge at me. Tell me which step you'd reject, how confident you are that it's the load-bearing one rather than a merely dispensable one, and what rejecting it costs — including whether it forces you to give up something attractive about the past being admissible, or to concede that admissibility is defined circularly (E is admissible just in case conditionalizing on it leaves your chance-conditional credence where the Principle puts it, which makes the Principle true by stipulation and unable to fail). Flag any place where you're leaning on a contested reading of Lewis rather than on anything he clearly says. And if you think my framing is broken — if there's no single thing worth calling the Principal Principle, or (2) is a bad enough gloss that (3) through (7) never get off the ground, or (6) is doing something illegitimate I'm not seeing — say so plainly instead of giving me a diplomatic walkthrough. I'd much rather be told the seminar exercise is broken in advance than watch it blow up in front of the room a second time.
reasoning: |-
  Okay, let me tackle this problem step by step. The user is a philosophy professor teaching a grad seminar on chance and time. They presented a deliberately bad argument about the Principal Principle, but now they can't find the flaw, and a student is defending the conclusion. The argument concludes that either the Principal Principle is false, certainty about chances is impossible, or chance isn't a guide to life. 

  First, I need to understand the structure of the argument. The key steps are:

  1. Principal Principle requires C(A | X ∧ E) = x if E is admissible.
  2. Admissible evidence doesn't tell you more about A beyond the chance. Paradigms are physical setup and past evidence.
  3. Outcomes of chance processes up to time t are evidence about the past.
  4. Therefore, observed relative frequency (like 100 heads in a row) is admissible. So C(heads on flip 101 | fair coin ∧ 100 heads) = 0.5.
  5. Generalizing: if certain of the chance, no finite frequency data can change credence about the next trial.
  6. But disregarding all frequency evidence isn't a guide to life. Even with a loaded die, no run of non-sixes should move you, which isn't plausible.
  7. Therefore, the Principle is false, certainty is impossible, or chance isn't a guide.

  The student argues that the issue is introducing certainty in step 1 and 4, so the Principle isn't meant to handle evidence affecting which chance hypothesis is correct. The statistics student mentions likelihood vs posterior, which the professor dismissed as a slogan.

  The professor's instinct is that step 2 or 3 is wrong because a run of heads is evidence about the chance, not just the past. But they worry this begs the question against the Principle.

  Looking deeper, the crack must be in step 3. The argument claims that past outcomes are "evidence about the past," which is true, but admissibility isn't just about being past-related. Lewis's key point is that admissible evidence screens off A from the past in a specific way. A run of 100 heads might be past evidence, but it's not admissible because it provides information about the chance itself. Even if you start certain the coin is fair, such extreme evidence should make you question your certainty. 

  However, the Principle as stated in step 1 assumes E is admissible. So if F (the frequency data) isn't admissible, step 4 doesn't apply. The flaw is equating "evidence about the past" with "admissible" in step 3. Lewis explicitly says that past evidence can be inadmissible if it's "inadmissible information about future outcomes," which includes frequency data that might indicate the chance isn't what you thought.

  The professor’s worry about circularity (defining admissibility via the Principle) is valid, but Lewis uses historical information as a touchstone. The key is that frequency data from the process itself isn't merely historical; it's directly relevant to the chance hypothesis. 

  Now, the follow-ups. For the New Principle (expected chance), it dissolves the issue because your credence becomes a weighted average. Seeing 100 heads would lower your credence in the coin being fair, so your unconditional credence in heads drops below 0.5. So (5) doesn't hold anymore. 

  On Humeanism vs non-Humeanism: Humeans might have a harder time because chances supervene on frequencies, so extreme data directly affects chance values. Non-Humeans can separate chances from frequencies, but they still need a way to update credences in chance hypotheses. Both need to avoid the trap in step 3.

  So the crucial rejection is step 3. The confidence is high because it misapplies Lewis's definition. The cost is that admissibility becomes less intuitive, but not circular—it's tied to the causal structure of chance setups. The seminar exercise isn't broken; the flaw is real and instructive once identified.
answer: |-
  Your argument's crack is in **step 3**, and I'm highly confident this is the load-bearing flaw. Rejecting it preserves the Principal Principle (PP), allows certainty about chances (in principle), and maintains chance as a guide to life. Here's the breakdown:

  ### Why Step 3 Fails
  - **Step 3 claims:** "The outcomes of a chance process up to time t are evidence about the past."  
  - **The flaw:** While true *literally*, this misapplies Lewis's admissibility gloss. Lewis's "evidence about the past" is **not synonymous** with "all historical evidence." His paradigm (step 2) is evidence *unrelated to the future outcomes of the specific chance process in question*. Outcomes of *the very same process* (e.g., 100 coin flips) are **not admissible**—even if they occurred in the past—because they directly bear on whether the chance hypothesis \(X\) is *true*.  
  - **Lewis's actual view:** In "A Subjectivist’s Guide to Objective Chance" (1980), he explicitly states that information about *future* or *outcomes of the same process* is inadmissible (pp. 92–95). A run of 100 heads isn't "merely" past evidence; it's **direct frequency data** that rationally undermines your certainty in \(X\) (the coin's fairness).  

  ### Why This Rescues the Principle
  - **Step 4 fails:** \(F\) (the 100-heads run) is **inadmissible** for \(A\) (flip 101) relative to \(X\) (fair coin). Thus, PP *does not require* \(C(A | X \land F) = 0.5\). PP remains silent here, as it should.  
  - **Step 5 dissolves:** PP doesn't force you to "disregard frequency evidence." When you see 100 heads, you *should* question \(X\)—not because PP fails, but because \(F\) is inadmissible evidence *against* \(X\). PP governs *conditional* credence *given* \(X\), not belief *in* \(X\).  
  - **Step 6 misfires:** PP isn't "frequency-blind"—it simply handles *admissible* evidence. The statistics student was right: **likelihood vs. posterior** is key. PP fixes \(C(A | X \land E)\) when \(E\) is admissible; it doesn't fix \(C(X | F)\). Seeing 100 heads licenses lowering \(C(X)\) (credence in fairness), which *should* affect \(C(A)\) via total probability. This *is* how chance guides life.  

  ### Costs of Rejecting Step 3
  - **Loss of intuitive gloss?** Yes, but trivially. Your gloss (step 2) oversimplifies Lewis. Admissibility isn't just "past vs. future"; it's about **causal independence** from the future outcomes of the target process. Extreme frequency data breaks this independence.  
  - **Circularity worry?** No. Admissibility isn't defined as "whatever makes PP hold." Lewis grounds it in **temporal and causal structure**: evidence before \(t\) with no "crystal ball" about post-\(t\) outcomes. A run of heads isn't a "crystal ball"—it's evidence the chance *setup* might be misdescribed.  
  - **Cost to attractiveness?** None. Past setup/past *external* events (e.g., "the coin was minted in 2020") remain admissible. Only *outcomes of the process itself* risk inadmissibility.  

  ### Follow-Up 1: Lewis's New Principle (NP)
  - NP says: \(C(A) = \sum_i C(Ch_t(A) = x_i) \cdot x_i\) (your credence equals expected chance).  
  - **This dissolves (5) entirely:** With NP, seeing 100 heads *directly lowers* your credence in \(X\) (fairness), so \(C(A)\) becomes a mix of chances weighted by your updated \(C(X)\). If \(C(X)\) drops, \(C(A)\) drops below 0.5. NP handles frequency evidence *explicitly* by shifting weights over chance hypotheses.  
  - **Relocation?** No—it solves the problem. (5) only arises under the old PP *if* you (wrongly) assume frequency data is admissible. NP makes admissibility constraints less central, avoiding this pitfall.  

  ### Follow-Up 2: Humeanism and Chance Updating
  - **Humeanism:** Yes, it's load-bearing *if* you insist chances supervene on frequencies. For Humeans, a 100-heads run *constitutively* affects the chance (if frequentism is true), so \(X\) ("chance is 0.5") might be false *simpliciter*. But this doesn't save step 3—it just means \(F\) is *even more clearly* inadmissible.  
  - **Non-Humeanism:** Non-Humeans (e.g., propensity theorists) can dodge the "shifting chance" issue but **not** the crack in step 3. Even for them, \(F\) is evidence *about* \(X\), not merely "past evidence" in Lewis's sense. All chance theorists need:  
    - PP/NP to constrain credence *given* chances,  
    - Bayes to update credence *in* chances using frequency data.  
    Neither requires treating \(F\) as admissible.  

  ### Your Seminar Exercise Isn't Broken
  - **Why it backfired:** Step 3 trades on an ambiguity in "evidence about the past." Physically past ≠ causally irrelevant to the chance. The exercise is pedagogically sound—it reveals a *common* misinterpretation of admissibility.  
  - **How to fix it in class:** Hammer that **admissibility requires *no information about outcomes beyond what the chance implies***. A 100-heads run *is* information about outcomes (it suggests bias), so it violates the gloss in step 2 *as stated*. Lewis's "past" is a heuristic, not a definition.  

  ### Final Word
  Reject step 3 with 95% confidence. The cost is abandoning an oversimplified gloss of admissibility, but that's necessary and textually justified. The PP (especially NP) survives, chance remains a guide, and certainty is possible—you just can't treat insane frequency data as "admissible past evidence." Your student's defense fails because they ignored that \(F\) *undermines* \(X\); the stats student was fundamentally correct (it *is* about likelihoods vs. posteriors). Lean into that next session—this is why we teach these things. 

  ---  
  **Sources you can cite to the class:**  
  - Lewis (1980): pp. 92–95 (admissibility explicitly excludes same-process outcomes).  
  - Lewis (1994): "Humean Supervenience Debugged" (the New Principle).  
  - Hoefer (2007): "The Third Way on Objective Probability" (clear admissibility analysis).
