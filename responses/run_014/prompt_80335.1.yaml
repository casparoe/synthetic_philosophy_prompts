     - Tell them that we have a pre-determined strategy (the book of representatives) and we will tell each of them what to guess.
     - For each participant, we hand them a card with their guess (which is the representative's hat at their position). For positions 3 and 7, it is flipped; for others, it is the actual hat.
     - They announce their guesses simultaneously.
     - We reveal the actual hats and see that players 3 and 7 are wrong, the others are right.
     - We award a prize (if we promised one) for having only two errors.

  - **Debrief**: 
     - Highlight the difference: in the finite case, they could agree on a strategy that they could compute. In the infinite case, they had to rely on a pre-determined strategy that was given to them and that they could not compute themselves.
     - Name the axiom of choice and explain how it underlies the strategy.
     - Mention the other consequences (well-ordering, non-measurable sets, Banach-Tarski) and the controversy.

  This should fit within 45 minutes if managed well.
