  Below is a complete, ready-to-run design for your 45-minute salon segment on the axiom of choice. It uses the hat puzzle as a central metaphor, progresses from finite to infinite, and emphasizes the experiential gap between existence and computability. The goal is to make the audience *feel* the conceptual leap required by the axiom of choice before naming it.

  ---

  ### **Materials List**
  1. **Hats/Cards**: 
     - For warm-up: 6 black/white cards (or actual hats) for volunteers.
     - For infinite game: 12 black/white cards (one per audience member).
  2. **Randomization**: Coin (to flip for hat colors).
  3. **Visibility Setup**: 
     - For warm-up: Arrange chairs in a semicircle so players see all others.
     - For infinite game: Whiteboard with numbers 1–12. Write each player's hat color next to their number, then cover their *own* number with a sticky note (so they see all others but not their own).
  4. **Guessing Aids**: Paper slips for guesses (infinite game).
  5. **Scoring**: Whiteboard tally for group errors.
  6. **Prize**: Small non-monetary prize (e.g., a book about infinity) for the group if they achieve ≤2 errors in the infinite game.
  7. **Timer**: For pacing.

  ---

  ### **Minute-by-Minute Pacing** (Total: 45 min)

  #### **Part 1: Finite Warm-Up** (12 min)
  - **0–2 min**: Introduce the hat problem.  
    *"Imagine you’re in a line wearing black or white hats. You can see everyone else’s hat, but not your own. On the count of three, everyone guesses their own hat color. Can we agree on a strategy to minimize wrong guesses?"*  
    Select 6 volunteers. Assign hats randomly (coin flip). Seats in a semicircle.  
  - **2–7 min**: Group strategy discussion.  
    *"You have 3 minutes to agree on a rule. What will you do?"*  
    → *Expected strategy*: Volunteers will likely use "parity" (e.g., "Assume the total number of black hats is even. If I see an odd number of black hats, I’ll guess black; else white").  
  - **7–10 min**: Run the game.  
    Volunteers announce guesses simultaneously. Reveal actual hats. Count errors (usually 0–2).  
  - **10–12 min**: Debrief warm-up.  
    *"You collaborated on a rule you could all compute. What made this possible?"*  
    → Key takeaway: Finite rules are *computable*—players derive answers from visible data.

  #### **Part 2: Infinite Hat Game** (25 min)
  - **12–15 min**: Introduce the infinite version.  
    *"Now imagine infinitely many people—one for each counting number 1,2,3...—each seeing all hats except their own. Can we ensure only finitely many are wrong? We’ll simulate this with 12 of you as the ‘first 12’ of infinity."*  
    Assign hats to all 12 audience members (coin flips). Use the whiteboard setup.  
  - **15–18 min**: Explain equivalence classes (without jargon).  
    *"Two hat sequences are ‘twins’ if they differ in only finitely many positions. These ‘twin families’ (equivalence classes) cover all possibilities. We need a strategy where everyone uses the same rulebook to pick a ‘twin family representative.’"*  
    → **Crucial metaphor**: *"Imagine a cosmic rulebook listing one ‘example sequence’ for every twin family. Players find their family in this book and guess their hat matches the example."*  
  - **18–22 min**: Assign roles and simulate non-computability.  
    - *Your role*: "Rulebook Oracle" (you hold the strategy).  
    - *Audience role*: Players who know the rulebook exists but can’t compute it.  
    *"You see all hats except your own, so you know which twin family you’re in. But I’m the only one with the rulebook. I’ll tell you what to guess."*  
    → Hand each player a slip with their guess:  
    - **How you generate guesses**:  
      Choose a representative that differs from the actual sequence in *finitely many positions* (e.g., flip hats 3 and 7). Players guess the representative’s color at their position.  
      *(e.g., If player 3’s actual hat is black, their slip says "WHITE").*  
  - **22–25 min**: Run the game.  
    Players read guesses simultaneously. Reveal actual hats. Tally errors (predictably ≤2).  
  - **25–32 min**: Repeat and score.  
    - Reset hats (new coin flips).  
    - Award prize if total errors across both rounds ≤4 (e.g., 2 per round).  
    → *Why scoring works*: The strategy ensures only finitely many errors. With 12 players, errors are bounded (≤2 in this setup).

  #### **Part 3: Debrief** (8 min)
  - **32–35 min**: Name the axiom and map the game to math.  
    *"What you experienced was the axiom of choice (AC). It lets us say the rulebook exists—but no one can ever write it down or compute their guess. AC guarantees infinitely many choices can be made at once, even if we can’t describe how."*  
    → **Link game moments to AC**:  
    - Finite warm-up: No AC needed (computable strategy).  
    - Infinite game: AC required (non-computable representatives).  
    - "Twin families": Equivalence classes under "equal almost everywhere."  
    - "Rulebook": Choice function selecting representatives.  
  - **35–38 min**: Consequences of AC.  
    *"AC gives us powerful tools but has counterintuitive costs. It implies:*  
    - *A well-ordering of the reals (every set has a ‘first’ element, but we can’t find it).*  
    - *Non-measurable sets (collections of points too jagged to assign length/area).*  
    - *Banach-Tarski paradox (a ball split into 5 pieces and reassembled into two identical balls!).*  
    *Some mathematicians reject AC because these results feel ‘unphysical.’"*  
  - **38–40 min**: Why AC is controversial.  
    *"AC lets us ‘point to one thing in each box’ of an infinite collection—but it doesn’t tell us *how*. You felt this when you had a winning strategy but couldn’t compute your guess. That’s the foundation of the debate."*  
  - **40–45 min**: Q&A.

  ---

  ### **What Will Go Wrong (and How to Handle It)**
  1. **Finite strategy stalls**:  
     - *Risk*: Volunteers struggle to find a strategy.  
     - *Fix*: Nudge toward parity ("What if you use even/odd?"). If needed, give the parity strategy.  

  2. **Equivalence classes confuse**:  
     - *Risk*: "Twin families" feel abstract.  
     - *Fix*: Use concrete examples (e.g., "Sequences with mostly whites vs. mostly blacks"). Emphasize *only finitely many differences*.  

  3. **Infinite game feels fake**:  
     - *Risk*: Audience doubts the oracle’s "rulebook."  
     - *Fix*: Stress *"This strategy exists mathematically, but I as the oracle am simulating it. In reality, no human could do this."*  

  4. **Errors exceed prediction**:  
     - *Risk*: More than 2 errors if reps are chosen poorly.  
     - *Fix*: Pre-choose flipped positions (e.g., 3 and 7) to control errors. Award the prize generously (e.g., ≤4 total errors).  

  5. **Time runs short**:  
     - *Risk*: Debrief rushed.  
     - *Fix*: Cut second round of infinite game. Use extra time for consequences of AC.

  ---

  ### **What the Game Cannot Reproduce (Requires Verbal Explanation)**
  - **Uncountable infinity**: The game uses 12 players to *simulate* infinity, but AC’s power lies in uncountable choice (e.g., one representative per equivalence class of $\mathbb{R}$). Verbally stress:  
    *"Real sequences are uncountably infinite—like all decimals between 0 and 1. AC lets us pick one ‘example’ for every family in this vastness, but we can’t write a rule to do it."*  

  - **Non-constructiveness**: Players experience being *given* a strategy, but the core tension—between "a strategy exists" and "no human can implement it"—must be articulated:  
    *"AC doesn’t just guarantee the rulebook exists; it guarantees it *cannot* be constructed algorithmically. That’s why you needed an oracle."*

  ---

  ### **Why This Works**
  - **Experiential learning**: The finite game builds intuition; the infinite game forces confrontation with non-computability.  
  - **Debrief roots abstraction in experience**: Players’ frustration ("I had to trust the oracle!") mirrors the mathematical controversy.  
  - **Prize and scoring**: Makes the collective outcome tangible, emphasizing AC’s "global success, local uncertainty."

  This design ensures the axiom of choice emerges not as a technicality, but as a visceral idea—one where existence and computability collide.
