prompt: |-
  I'm a graduate student taking a seminar in Confucian ethics this semester, and two days a week I work as a peer mediator at a community center, where most of the cases I get are intergenerational family disputes — caregiving, inheritance, expectations about marriage and money. I handle them with a loose sense of "figure out what each person's role actually is and what that role calls for," but I have no stable method, and my sessions come out different.

  Could you write me a decision procedure I can actually run inside a fifty-minute session, grounded in the conceptual machinery of role ethics rather than in generic mediation advice? I want it to use the parts of the theory that are doing real work: the self as the hub of a web of roles rather than a free-floating agent; the rectification-of-names move (正名) — establishing what each party actually stands in relation to the other before anything else; the fact that the classical five relations carry different characteristic virtues and that the obligations are asymmetric, so that a parent's obligation to a child is not the mirror image of the child's obligation to the parent; and the fact that, on this view, conflicts between roles are adjudicated by the relational context rather than by a universal ranking of rules. For the modern cases I get, I read the ruler–subject relation as something like employer–employee. I want the procedure in the form of a series of questions to ask in a fixed order, with what counts as a sufficient answer at each step, the point at which the procedure has to stop and refer the case out of mediation because of safety or legal concerns, and the steps at which it has to stop and say "this is a value judgment, not a factual one, and it belongs to the parties, not to me." The questions should be phrased in plain language I can actually ask out loud, with the theoretical rationale attached to each step so I can see what's doing the work. Please mark which steps are genuine judgment calls dressed up as procedure, and tell me which distinctions from the theory must survive the translation into a usable procedure and which can be safely dropped, and why.

  The procedure has to handle two kinds of hard cases. First, genuine role conflicts: an adult daughter who is the primary caregiver for her ailing mother and whose marriage requires moving out of state; a son who discovers that his father, who runs the family business, has been misappropriating funds, and is pressured by the family to stay silent. Second, cases where a role is being invoked to justify the harm itself: a parent invoking filial piety to demand that an adult child keep funding a lifestyle that is destroying the child. I think role ethics is most at risk of misfiring in the second kind, so I want the procedure to say clearly what it can and cannot do there.

  Then run the procedure on two or three of these cases end to end. The written plan I produce at the end of a session has to be countersigned by my supervisor, so the procedure has to end in either a concrete recommendation or a referral — not a "both sides should think about it" — and at least one of the worked cases should come out in a way the family, and probably I too, won't like. Finally, say plainly what the procedure cannot do.
reasoning: |-
  We are designing a decision procedure for mediation based on Confucian role ethics. The procedure will be structured as a series of steps with questions to ask, and it must fit within a 50-minute session. We will ground it in the concepts of role ethics: the self as a hub of roles, rectification of names (正名), the five classical relations with their asymmetric virtues, and resolution of role conflicts by relational context.

  Key elements:
  1. Start by rectifying names: establish the actual relationships between the parties.
  2. Identify the roles each party occupies in relation to the others and the virtues associated with those roles.
  3. Acknowledge that obligations are asymmetric (e.g., parent-child obligations differ).
  4. Resolve conflicts by the specific relational context, not by a universal rule hierarchy.
  5. Recognize when a role is being misused to justify harm and stop the procedure if safety or legal issues arise.

  The procedure must:
  - Be a fixed order of questions.
  - Specify what counts as a sufficient answer at each step.
  - Indicate when to stop for safety/legal concerns and when to defer to the parties' value judgments.
  - End with a concrete recommendation or referral.

  Hard cases to handle:
  A. Genuine role conflicts (e.g., caregiver daughter vs. wife; son in family business with father's misappropriation).
  B. Role invoked to justify harm (e.g., parent using filial piety to demand unsustainable financial support).

  We will design the procedure and then run it on 2-3 cases, including one that ends in an unpopular outcome.

  Procedure Steps:

  1. **Establish Safety and Legality (Time: 5 minutes)**
     - Question: "Is anyone in this room currently in physical danger or under threat because of this conflict? Are there any ongoing illegal activities that we need to address immediately?"
     - Rationale: Safety and legal issues take precedence. If there is immediate danger or criminal activity, mediation may not be appropriate.
     - Sufficient answer: Any indication of yes -> stop and refer to authorities/supervisor. If no, proceed.
     - Note: This step is non-negotiable and must be taken seriously. If there is any doubt, we err on the side of caution.

  2. **Rectify Names (Identify Relationships) (Time: 10 minutes)**
     - Question: "Let's start by clarifying how each of you is related to the others in this conflict. For each person involved, please state: (a) What role do you have in relation to [the other party]? (b) What role does [the other party] have in relation to you? (For example, parent-child, employer-employee, etc.)"
     - Rationale: This step implements 正名 (rectification of names). We must establish the actual relationships to understand the obligations and virtues that apply.
     - Sufficient answer: Clear articulation of the relationships. If there is disagreement, note the discrepancies and try to get consensus on the facts. If consensus cannot be reached, the mediation may be stuck at this step (and we may need to stop and refer). However, we can note that the parties see the relationships differently and proceed with caution, making that disagreement explicit.
     - Judgment call: Deciding when a relationship is "established enough" to move on. We require at least that each party can state the other's perspective even if they disagree.

  3. **Articulate Role-Specific Virtues and Obligations (Time: 15 minutes)**
     - Question: "Given the relationships we've identified, what do you believe are the key responsibilities and virtues that each role entails? For example, in a parent-child relationship, the parent has the responsibility to care and guide, and the child has the responsibility to respect and support. Let's list them for each role in each relationship."
     - Rationale: Each classical relation carries characteristic virtues (e.g., parent: benevolence; child: filial piety). We must make these explicit to understand the expectations.
     - Sufficient answer: Each party should be able to state what they believe the other's role requires and what their own role requires. We are looking for the asymmetric obligations. If a party cannot articulate, we can provide standard Confucian virtues for the named relationships (but note: we must be cautious not to impose). However, if the parties have fundamentally different understandings, we note the conflict and proceed to the next step to see if context can resolve it.
     - Judgment call: When to offer standard virtues? Only when the parties are completely stuck and ask for help, and then we present them as one possible traditional view, not the only one.

  4. **Identify the Conflict in Terms of Roles (Time: 10 minutes)**
     - Question: "Now, let's focus on the conflict. How does this situation create tension between the roles we've discussed? Are there multiple roles that one person holds that are coming into conflict? Or are the expectations of one role not being met by the other party?"
     - Rationale: The conflict may arise from a clash of roles (e.g., being a daughter and a wife) or from a failure to fulfill role obligations. We need to frame the conflict in terms of roles to apply role ethics.
     - Sufficient answer: A clear statement of the conflict in terms of role obligations. If the conflict is not about roles (e.g., it's about a legal dispute over property), then we may need to refer to legal services. If the parties cannot express the conflict in role terms, we may have to reexamine step 2.

  5. **Contextual Resolution (Time: 15 minutes)**
     - Question: "In this specific situation, considering the relationships and the context, what resolution would best honor the most important role obligations? Let's think about what would maintain harmony and the long-term health of the relationships. Also, note that obligations are not always reciprocal in the same way: for instance, a parent's obligation to a child is different from a child's to a parent. How can we balance these in this context?"
     - Rationale: Conflicts are resolved by the particular relational context, not by abstract rules. We are looking for a resolution that sustains the relationship and the web of roles.
     - Sufficient answer: The parties should be able to propose a resolution that addresses the role obligations. If they cannot, the mediator may suggest a resolution based on the role obligations articulated, but this is a judgment call and should be done cautiously. The mediator must be clear that the suggestion is based on the parties' own statements about roles and obligations.
     - Judgment call: The mediator must decide when to intervene with a suggestion. Only if the parties are stuck and after allowing sufficient time for them to generate ideas.

  6. **Concrete Plan and Referral (Time: 5 minutes)**
     - If a resolution is reached: "Let's write down the specific actions each person will take, by when, and how we will know it's done. I will draft a plan for you to sign and for my supervisor to countersign."
     - If no resolution: "It seems we cannot reach a resolution today. I will refer you to [appropriate service] for further assistance because [reason]." Reasons might include: legal issues, need for professional counseling, etc.

  Additional Notes:
  - The procedure must stop and refer out if at any point:
     - There is an immediate safety or legal concern (step 1).
     - The parties cannot agree on the basic relationships (step 2) and it becomes clear that the dispute is about facts that require legal determination (e.g., whether someone is an employee or not).
     - The conflict is not about roles but about, say, a legal title or a criminal act.
  - The procedure must stop and state that a value judgment belongs to the parties at steps 3 and 5. For example, in step 3, if a party says "I don't think a child has any obligation to a parent," that is a value judgment. The mediator can note that in the traditional view there is an obligation, but ultimately the parties must decide what they believe. The mediator can then say, "Given that you don't believe in that obligation, how do you want to proceed?" and then in step 5, if the resolution violates a core value of one party, the mediator cannot impose. The procedure must then either end without agreement or with a minimal agreement that both can live with.

  What the procedure cannot do:
  - Resolve disputes that are fundamentally about legal rights (e.g., who owns a property) without legal input.
  - Override the parties' deeply held values that are inconsistent with role ethics (though it may challenge them to think in relational terms).
  - Protect individuals from harm if the parties are not willing to acknowledge the harm or if the mediator does not have the authority to intervene.

  Now, we run the procedure on two cases.

  **Case 1: The Caregiver Daughter (Genuine Role Conflict)**
  - Parties: Daughter (primary caregiver for mother) and her husband (who wants to move out of state for a job).
  - Background: The daughter feels torn between her role as caregiver and her role as wife.

  Step-by-step:

  1. **Safety/Legality**: No immediate danger or illegal activity. Proceed.
  2. **Rectify Names**:
     - Daughter to mother: caregiver and daughter.
     - Daughter to husband: wife.
     - Husband to daughter: husband.
     - Mother to daughter: mother and care-recipient.
  3. **Role Virtues and Obligations**:
     - Daughter to mother: filial piety (care, respect, support).
     - Mother to daughter: benevolence (love, understanding, not being a burden?).
     - Wife to husband: loyalty, support (moving with him?).
     - Husband to wife: support, understanding (of her duty to mother?).
  4. **Conflict in Roles**: Daughter's role as daughter (caregiver) conflicts with her role as wife (moving with husband).
  5. **Contextual Resolution**: 
     - The resolution must balance the relationships. The mother's health and the daughter's marriage are both important. The virtues of the mother (benevolence) might call for her to accept alternative care so the daughter can move. The husband's virtue of understanding might call for flexibility (e.g., delaying the move, or helping find care for the mother). The daughter's virtue as a wife might require her to prioritize the marriage, but her filial piety requires care for her mother.
     - The mediator might suggest: explore alternative care for the mother (e.g., in-home help, assisted living) that would allow the daughter to move. The husband might agree to a delay to arrange this. The mother might agree to this arrangement as an act of benevolence (not wanting to hold her daughter back).
  6. **Concrete Plan**: Daughter and husband will research assisted living options in the next two weeks. Mother will cooperate with a social worker to assess her needs. If no suitable arrangement is found in one month, they will revisit. All sign the plan.

  **Case 2: Parent Demanding Financial Support (Role Invoked to Justify Harm)**
  - Parties: Adult child (son) and parent (father). The father demands money to support a lifestyle (gambling, luxury) that the son cannot afford, invoking filial piety.
  - Background: The son is struggling financially and feels guilty.

  Steps:

  1. **Safety/Legality**: No physical danger, but gambling may be illegal. If the father's activities are illegal, we must stop and refer? However, the son may not know the details. We proceed with caution.
  2. **Rectify Names**:
     - Son to father: son.
     - Father to son: father.
  3. **Role Virtues and Obligations**:
     - Son to father: filial piety (respect, support, but traditionally within reason and not enabling harm).
     - Father to son: benevolence (care, not exploiting, setting a good example).
     - The son states that his obligation is to support but not to enable destructive behavior. The father states that the son's obligation is to provide whatever the father asks.
     - This is a value judgment point: the father's view of filial piety is extreme. The mediator notes that traditionally, filial piety does not require supporting harmful behavior. The mediator states: "In the Confucian tradition, a father also has obligations to the son, including acting with benevolence and not causing harm. What do you think about that?"
     - If the father insists on his view, we note the disagreement and proceed.
  4. **Conflict in Roles**: The conflict is that the father is using his role to demand harmful support, and the son feels his role as son is being exploited.
  5. **Contextual Resolution**:
     - The resolution must consider the harm being caused. The mediator might say: "Given that the son's financial support is enabling gambling, which is harmful, and that the father's role calls for benevolence, what would be a way to fulfill the son's filial piety without enabling harm?"
     - Possibilities: The son provides support only for basic needs (e.g., housing, food) directly to providers, not cash. The father agrees to seek help for gambling. But if the father refuses, the son may have to set boundaries.
     - This is difficult: the father may not agree. The mediator must be clear that the procedure cannot force a parent to change. The mediator might suggest: "The son will arrange for payment of rent and utilities directly to the landlord and utility companies, and will not provide cash. The father agrees to attend a gambling support group. If the father refuses, then the son will only provide non-monetary support (e.g., visits, helping with errands)."
     - But the father may not agree. Then we have no resolution.
  6. **Concrete Plan/Referral**: If the father agrees to the conditions, we write a plan. If the father refuses, we have to end without agreement and refer the son to individual counseling to cope with the situation and set boundaries, and the father to addiction services (if willing). The mediator states: "We were unable to reach an agreement. I recommend that the son seek counseling to navigate this difficult situation, and I have information on gambling addiction services for the father. I will refer you both to these resources."

  This outcome (no agreement) may be unpopular, but it is necessary because the father's demand is harmful and the son cannot be forced to comply.

  **Case 3: Son in Family Business with Father's Misappropriation (Genuine Role Conflict with Legal Implications)**
  - Parties: Son and father (who runs the family business and has been misappropriating funds). The family pressures the son to stay silent.

  Steps:

  1. **Safety/Legality**: There is illegal activity (misappropriation). The mediator must stop the mediation and refer to legal authorities. We cannot mediate a cover-up of a crime. The mediator says: "I'm sorry, but because there are allegations of illegal activities, I cannot continue with mediation. I must refer this matter to my supervisor and recommend that you seek legal counsel immediately."

  Thus, this case would be stopped at step 1.

  Conclusion on the procedure:
  - It can handle genuine role conflicts by contextual resolution.
  - It can sometimes resolve cases of role misuse by reframing obligations and setting boundaries, but if the party invoking the role refuses to acknowledge the harm, it may end in referral.
  - It cannot mediate illegal acts and must stop immediately when they arise.
  - It cannot force parties to accept role obligations they reject, but it can challenge them by presenting the traditional view.

  The procedure is a tool to structure the conversation in a role-ethical framework, but it relies on the parties' willingness to engage and the mediator's judgment.
answer: |-
  Below is a structured decision procedure for your peer mediation sessions, grounded in Confucian role ethics. It's designed for a 50-minute session and directly uses the conceptual machinery you specified: the self as a relational hub, rectification of names (正名), asymmetric obligations in the five relations (with employer-employee as a modern analog for ruler-subject), and context-dependent resolution of role conflicts. The procedure prioritizes safety and legal concerns, flags value judgments that belong solely to the parties, and ends with concrete outcomes (agreement or referral). It explicitly handles your two hard cases—genuine role conflicts and harmful role invocations—while acknowledging where the theory's limitations require stopping or referring.

  The procedure is a **fixed sequence of steps with time allocations**, phrased in plain language for direct use. Each step includes:
  - **Question(s) to ask**: Verbatim scripts you can use.
  - **Rationale**: How it ties to Confucian role ethics.
  - **Sufficient answer**: What you need to proceed; if unmet, the step flags a stop point.
  - **Stop/referral points**: For safety, legality, or unresolvable value judgments.
  - **Judgment calls**: Where your discretion as mediator is needed (marked with ⚖️).

  **Key Theoretical Translations and Omissions**  
  - **Must-survive distinctions**:  
    - **Rectification of names (正名)**: Steps 1–2 enforce this by defining relationships before obligations. Without it, role ethics collapses.  
    - **Asymmetric virtues**: Step 3 explicitly asks about "different responsibilities" for each role (e.g., parent's benevolence vs. child's filial piety). Dropping this would reduce roles to generic duties.  
    - **Relational context over universal rules**: Step 4 rejects abstract rankings (e.g., "family always comes first") in favor of the specific web of roles.  
  - **Safely omitted**:  
    - **The fifth relation (friend-friend)**: Often symmetric and voluntary, it rarely causes the asymmetric disputes you see. Omit unless parties raise it.  
    - **Historical rituals (礼)**: While part of classical theory, modern mediation focuses on obligations, not ceremonial norms. Use "mutual respect" as a plain-language proxy.  
    - **Self-cultivation (修身)**: This is a long-term ideal, not a mediation tool. Focus on immediate role clarity.  

  ---

  ### **Role Ethics Mediation Procedure**  
  **Total Time**: 50 minutes (strictly enforced; use a timer).  
  **Goal**: Concrete agreement or referral by the end. No open-ended conclusions.  

  #### **Step 1: Safety and Legal Check (5 minutes)**  
  - **Question**: "Before we begin, I need to ask: Is anyone here afraid of physical harm, threats, or retaliation because of this conflict? Are there any illegal actions involved, like violence, theft, fraud, or abuse?"  
  - **Rationale**: Confucian ethics presupposes a baseline of social order. If safety or legality is compromised, the relational web cannot function.  
  - **Sufficient answer**: Clear "no" from all parties. If "yes" or hesitation, stop.  
  - **Stop/referral**:  
    - **Safety concern**: Stop and refer to supervisor/authorities. Say: "Mediation can't address this. I’m connecting you with [resource] for immediate help."  
    - **Legal concern (e.g., fraud, abuse)**: Stop and refer to legal services. Say: "This needs specialized input. I’ll help you contact [service]."  
  - **Value judgment note**: None here—this is factual.  

  #### **Step 2: Rectify Names (正名) – Map Relationships (10 minutes)**  
  - **Question**: "Let’s clarify how each of you is connected. For each person here:  
    - What role do you have in relation to [other party]? (e.g., parent, child, employer, employee).  
    - What role does [other party] have in relation to you?  
    Be specific—e.g., 'primary caregiver,' 'family business owner.'"  
  - **Rationale**: Roles define obligations. The self is a "hub" of relations; we must establish the actual ties (正名) before discussing conflicts.  
  - **Sufficient answer**: Consensus on the core roles (e.g., "We agree: I’m the mother, she’s the daughter and primary caregiver"). Minor disagreements (e.g., "I see myself as a mentor, not just an employer") can proceed if they don’t block the next step.  
  - **Stop/referral**: If parties fundamentally dispute roles (e.g., "He’s not my real father!"), stop and say: "This is a factual disagreement mediation can’t resolve. I recommend [DNA testing/legal counsel]."  
  - **Value judgment note**: None—this is about observable relationships.  
  - **⚖️ Judgment call**: Deciding if a role dispute is "fundamental." Err on the side of stopping if it involves legal status (e.g., inheritance rights).  

  #### **Step 3: Define Role Obligations and Asymmetries (15 minutes)**  
  - **Question**: "Now, for each role we’ve named:  
    - What are the key responsibilities of the person in that role? (e.g., 'A parent provides guidance; a child shows respect.')  
    - How are these responsibilities different for each person? (e.g., 'A parent’s duty to nurture isn’t the same as a child’s duty to obey.')"  
  - **Rationale**: Confucian virtues are asymmetric (e.g., parent’s benevolence vs. child’s filial piety). This prevents "mirroring" obligations and grounds the conflict in role-specific duties.  
  - **Sufficient answer**: Parties articulate distinct obligations for each role (e.g., "As an employer, I must pay fairly; as an employee, my son must be honest"). If stuck, ask: "What would a good [role] do here?"  
  - **Stop/referral**: If obligations are weaponized (e.g., "A child must always obey, no matter what"), flag a value judgment: "This is about your beliefs, not facts. My role isn’t to decide what’s 'right'—it’s to help you find a path forward based on your roles." If this stalls progress, move to Step 4.  
  - **Value judgment note**: Explicitly state here: "Obligations are based on your values. I won’t impose mine."  
  - **⚖️ Judgment call**: Whether to offer classical virtues (e.g., "Traditionally, a parent’s virtue is benevolence") only if parties are stuck. Use sparingly to avoid imposing values.  

  #### **Step 4: Identify Role Conflict and Contextual Resolution (15 minutes)**  
  - **Question**: "Where do these roles clash? For example:  
    - Is one person torn between two roles (e.g., caregiver and spouse)?  
    - Is someone failing in their role obligations?  
    Then, given your specific relationships, what solution:  
    - Honors the most important duties right now?  
    - Maintains long-term harmony?  
    Remember: Context matters—there’s no universal rule."  
  - **Rationale**: Conflicts are resolved through the relational context, not abstract hierarchies. The "web" of roles must be balanced situationally.  
  - **Sufficient answer**: Parties identify the conflict (e.g., "My role as daughter requires caregiving, but my role as wife requires moving") and suggest context-specific solutions (e.g., "For now, my sister can caregive while I settle out of state").  
  - **Stop/referral**:  
    - If harm is justified by role (e.g., "I must fund my parent’s gambling—it’s filial piety"), say: "This uses a role to cause harm. Mediation can’t fix that. I recommend [counseling/addiction services]."  
    - If parties deadlock, say: "We’ve hit a values gap. I’ll refer you to [long-term counseling]."  
  - **Value judgment note**: Reiterate: "What’s 'most important' is your call, not mine."  
  - **⚖️ Judgment call**: Assessing "harm" in role justifications. Use a low threshold (e.g., financial ruin, health risks).  

  #### **Step 5: Concrete Agreement or Referral (5 minutes)**  
  - **Question**: "Based on this, what specific actions will each person take? (e.g., 'I will research care homes by Friday.') If we can’t agree, what support do you need?"  
  - **Rationale**: Confucian ethics seeks harmonious outcomes, but only if roles are honored without harm.  
  - **Sufficient answer**:  
    - **Agreement**: Write a clear, signed plan (e.g., "Son will report father’s fraud to the board; father will seek legal counsel").  
    - **Referral**: If no agreement or harm is present, specify next steps (e.g., "Referred to elder abuse hotline").  
  - **Stop/referral**: Always ends here—no ambiguity.  

  ---

  ### **Worked Examples**  
  I’ll run two cases end-to-end: one genuine role conflict (caregiver daughter) and one harmful role invocation (parent demanding destructive support). I’ll include an unpopular outcome in the second case.  

  #### **Case 1: Genuine Role Conflict – Caregiver Daughter vs. Spousal Duty**  
  **Parties**: Daughter (caregiver for ailing mother), Husband (wants to move for work), Mother (needs care).  
  - **Step 1**: No safety/legal issues. Proceed.  
  - **Step 2**: Rectify names.  
    - Daughter: "I’m mother’s daughter and primary caregiver."  
    - Mother: "I’m her mother and care recipient."  
    - Husband: "I’m her husband."  
    - *Sufficient*: Consensus on roles.  
  - **Step 3**: Asymmetric obligations.  
    - Daughter: "As a daughter, I must care for Mom; as a wife, I must support my husband’s move. But they’re different—Mom needs daily help; my husband needs me with him."  
    - Mother: "As a parent, I should encourage her independence, not burden her."  
    - Husband: "As a spouse, I should prioritize our marriage, but I respect her duty to Mom."  
    - *Sufficient*: Asymmetries acknowledged.  
  - **Step 4**: Contextual resolution.  
    - Conflict: Daughter’s caregiver role vs. wife role.  
    - Solution: "For now, my sister (who lives nearby) will take over caregiving. We’ll move, but I’ll visit monthly. Mom agrees this is best."  
    - *Rationale*: Balances context—mother’s benevolence (not burdening) and daughter’s dual roles.  
  - **Step 5**: Agreement.  
    - Plan: "Daughter and husband move in 30 days. Sister becomes primary caregiver. Daughter visits monthly, funded by husband. Signed by all."  
    - *Supervisor note*: Concrete and role-based.  

  **Outcome**: Harmonious. Uses context to resolve conflict.  

  #### **Case 2: Harmful Role Invocation – Parent Demanding Destructive Support**  
  **Parties**: Son (financially strained), Father (demands money for gambling/luxuries, citing filial piety).  
  - **Step 1**: No safety, but gambling is illegal. *Not a stop yet* (son doesn’t allege active crime). Proceed.  
  - **Step 2**: Rectify names.  
    - Son: "He’s my father."  
    - Father: "He’s my son."  
    - *Sufficient*: Uncontested roles.  
  - **Step 3**: Asymmetric obligations.  
    - Son: "As a son, I should help, but not fund harm. A father should protect me, not exploit me."  
    - Father: "A son must obey and support me unconditionally. That’s filial piety."  
    - *Stop for value judgment*: Father weaponizes role. Say: "This is a values difference—I can’t decide what filial piety requires. Let’s see if we can find common ground." Proceed to Step 4.  
  - **Step 4**: Role conflict and harm.  
    - Conflict: Father’s view of "son’s duty" vs. son’s view of "father’s benevolence."  
    - Solution Attempted: Son offers budgeting help; father refuses, demands cash.  
    - *Harm identified*: Funding gambling destroys son’s finances. Father says: "He owes me."  
    - **Stop for harm justification**: "This role demand is causing harm. Mediation can’t solve it."  
  - **Step 5**: Referral.  
    - Plan: "No agreement. Father’s demand harms son. Referred: Son to financial counseling for boundaries; Father to gambling addiction services. Supervisor notified for legal review (gambling)."  
    - *Supervisor note*: Countersigned as "referred out—safety concern."  

  **Outcome**: Unpopular (no agreement), but necessary. Role ethics misfires here because the father corrupts filial piety into exploitation. The procedure flags harm and stops.  

  #### **Case 3 (Abbreviated): Genuine Conflict with Legal Risk – Son in Family Business**  
  **Parties**: Son (employee), Father (employer, misappropriating funds), Family (pressuring silence).  
  - **Step 1**: Legal concern (misappropriation = fraud).  
    - **Stop and refer**: "Mediation can’t address illegal acts. Referred to legal counsel and [state fraud reporting]."  
  - *No further steps*. Outcome protects all parties.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve value-based role distortions**: If a party weaponizes a role (e.g., "filial piety means unlimited obedience"), the procedure can only halt or refer—it can’t force a moral epiphany.  
  2. **Override legal/safety issues**: It stops hard at Step 1 for illegality (e.g., fraud, abuse), as role ethics assumes a just social order.  
  3. **Handle radical individualism**: If parties reject roles entirely (e.g., "I owe no one anything"), the foundation collapses. Refer to counseling.  
  4. **Create harmony without sacrifice**: In genuine conflicts (e.g., caregiver vs. spouse), someone may lose—the procedure facilitates contextual balance, not perfect wins.  
  5. **Replace specialized services**: Financial, legal, or mental health issues require experts. The procedure identifies these early.  

  This procedure gives you a stable, theory-grounded method while respecting mediation ethics. It works because it forces role clarification before problem-solving and uses Confucian asymmetries to avoid false equivalencies. In your practice, emphasize that "rectifying names" isn’t just stepwork—it’s the core insight that roles define us. Run this by your supervisor to stress-test it, and adapt timings as needed. Good luck with your seminar and mediation!
