answer: |-
  ### Plan for the Reading Group Session (70 Minutes)

  **Core Goal:** Participants leave able to classify interpretations as ψ-ontic or ψ-epistemic **themselves** using a clear criterion, applied to a concrete example. Avoid Hilbert spaces, complex numbers, and paradoxes. Use one example throughout.

  ---

  ### **Order of Introduction & Dependencies** (Total: 65 minutes)
  1. **Groundwork: Quantum States as Predictions (10 min)**  
     - **What:** Introduce quantum states as tools for predicting measurement outcomes (e.g., "State A predicts 100% chance of outcome X in experiment E").  
     - **Why:** Establishes that quantum states are *predictive* (Born rule).  
     - **Dependency:** None. Builds on familiarity with probability distributions.  
     - **Key Hook:** "We use states to assign probabilities. But what do they *represent* about reality?"

  2. **The Underlying Physical State (λ) (10 min)**  
     - **What:** Propose that predictions stem from an *underlying physical state* (denoted λ). A quantum state corresponds to a **probability distribution over λ**.  
     - **Why:** Sets up the distinction: is λ "tied" to one quantum state (ontic) or shared (epistemic)?  
     - **Dependency:** Must accept that quantum predictions imply *some* physical reality (λ) beneath the math.  
     - **Analogy:** "Like weather forecasts (quantum states) predicting rain—they could reflect distinct cloud systems (ontic) or overlapping atmospheric conditions (epistemic)."

  3. **Substantive Question via Example (15 min)**  
     - **The Carrying Example:** A system with two possible measurements, each with two outcomes:  
       - **Measurement 1 (M1):** Outcomes ↑ or ↓.  
       - **Measurement 2 (M2):** Outcomes ♢ or ♡.  
       - **Quantum State A (|A〉):**  
         - M1: ↑ at 100%, ↓ at 0%.  
         - M2: ♢ at 50%, ♡ at 50%.  
       - **Quantum State B (|B〉):**  
         - M1: ↑ at 50%, ↓ at 50%.  
         - M2: ♢ at 100%, ♡ at 0%.  
       - **Why this example:**  
         - Non-orthogonal states (critical for overlap).  
         - Identical predictions in some contexts (M2 for |A〉, M1 for |B〉), so distinction isn’t "verbal."  
         - No complex numbers, superpositions, or cats.  
     - **Activity:** Have participants sketch hypothetical λ-distributions for |A〉 and |B〉.  
       - *Guide:* "If λ were a hidden coin flip, how might |A〉 and |B〉 share some λs?"

  4. **Crystallize the Criterion (10 min)**  
     - **Reframe the Question:** "Can the same λ be compatible with both |A〉 and |B〉?"  
       - Show two scenarios:  
         - **Disjoint λ-sets (ψ-ontic):** λ for |A〉 and |B〉 never overlap.  
         - **Overlapping λ-sets (ψ-epistemic):** Some λ fit both |A〉 and |B〉.  
     - **Criterion (participant-generated):**  
       - "If two quantum states imply **overlapping probability distributions over λ**, it’s ψ-epistemic. If distributions are **always disjoint**, it’s ψ-ontic."  
     - **Apply to Example:**  
       - |A〉 and |B〉 *can* share λ (e.g., a λ that yields ↑ in M1 and ♢ in M2 fits both).  
       - Participants classify this as ψ-epistemic.

  5. **PBR Argument on the Same Example (15 min)**  
     - **Setup:** Consider two independent copies of the system.  
       - Preparations: Both |A〉 (AA), both |B〉 (BB), or one each (AB/BA).  
     - **PBR Intuition:**  
       - Assume a ψ-epistemic model: Some λ fits |A〉 and |B〉 for one system (e.g., λ₀).  
       - For two systems, (λ₀, λ₀) could come from AA, BB, AB, or BA.  
       - Quantum mechanics demands a joint measurement where:  
         - Outcome 1 is impossible if prepared as AA.  
         - Outcome 2 is impossible if prepared as BB.  
         - ... etc.  
       - But (λ₀, λ₀) must yield *some* outcome—and it might be one forbidden by its preparation.  
       - **Contradiction:** A single (λ₀, λ₀) can’t satisfy all predictions.  
     - **Bite:** Rules out ψ-epistemic models for |A〉 and |B〉 **if** systems are prepared independently.  
     - **Participant Task:** "Why does PBR *not* rule out ψ-ontic models here?"  
       - *Answer:* In ψ-ontic, λ for |A〉 and |B〉 are disjoint, so no universal (λ₀, λ₀).

  6. **Misconceptions & Interventions (5 min)**  
     - **"Epistemic = in the observer’s head"**:  
       - **When:** During "Underlying Physical State" (step 2).  
       - **Response:** "ψ-epistemic isn’t about ignorance—it’s about whether λ itself is shared. The physics could be objective (e.g., classical hidden variables)."  
     - **"Bohmian mechanics is epistemic since particles have positions"**:  
       - **When:** After criterion (step 4).  
       - **Response:** "In Bohmian mechanics, the wave function is part of λ. Two distinct wave functions = disjoint λ-sets. It’s ψ-*ontic*, even with particles."  
     - **"PBR settles it outright"**:  
       - **When:** During PBR discussion (step 5).  
       - **Response:** "PBR assumes independent preparations. If λ isn’t independent (e.g., retrocausal models), ψ-epistemic options survive."  
     - **Everettian Interjection ("No collapse, so the issue is confused!")**:  
       - **When:** During criterion (step 4) or PBR (step 5).  
       - **Response:** "Even without collapse, ask: Do distinct branches describe *overlapping realities* (epistemic) or *distinct realities* (ontic)? Everett typically treats the wave function as ontic."

  ---

  ### **Closing (5 minutes)**
  - **Check for Understanding:**  
    - **Question:** *"In a new interpretation, two quantum states always correspond to disjoint λ-sets. What is it? If an interpretation allows overlap for some states, what is it? Why might PBR *not* refute the second kind universally?"*  
      - Correct: ψ-ontic; ψ-epistemic; PBR assumes preparation independence.  
      - Memorizers will misapply PBR or conflate with "knowledge."
  - **Explicitly Decline to Cover:**  
    - "We won’t dive into Hilbert spaces, the PBR measurement basis, or the full scope of ψ-epistemic models (e.g., with contextuality). Today is about the core criterion."

  ---

  ### **Why This Works**
  - Participants **discover** the criterion via the example (|A〉/|B〉), then apply it to classify models.  
  - PBR uses the **same example**, showing its stakes.  
  - Misconceptions are preempted or corrected in context.  
  - The closing question tests **application**, not recall.
