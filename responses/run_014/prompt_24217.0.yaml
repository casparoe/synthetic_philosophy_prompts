prompt: |-
  I'm on the medical ethics commitee at a rural hospital and we've got a case that's split the room. A helicopter medevac can only carry one group at a time and teh weather window closes in about two hours. There's one hiker on the ground who's badly injured, and a group of five hikers who are injured about as badly. Both groups will be in real danger of dying if we don't get them out before the window closes. The flight crew can save either the one guy or the five, not both, in the time we have. Half the committee says obviously we save the five, more lives. The other half keeps saying the number of people shouldn't by itself be the reason — that each person's claim to be saved is the same and five of them doesn't add up to a stronger claim than one. I need to circulate a short written opinion before we brief the flight crew tomorrow: recommend a concrete call (which group we fly out first) with a time frame, and please engage the 'numbers don't count' side seriously instead of just defaulting to 'save the most people.'
