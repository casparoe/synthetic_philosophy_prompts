prompt: |-
  You're a philosopher of science who's spent real time on priority disputes and on the inevitabilist/contingentist debate — think carefully, and before you commit, jot two or three candidate setups and say in a line each why you're rejecting the ones you reject.

  I'm teaching a seminar where students reflexively slide from "two people found it at the same time" to "it was in the air, it was inevitable," and I want a case that jams that slide. Build me a thought experiment to spec:

  - Set it in present-day science, no sci-fi, and the scenario itself should be about one paragraph.
  - It has to be a genuine Merton-style multiple: two groups with no contact and no leakage produce substantially the same result inside about a year of each other.
  - But the counterfactuals have to be assymetric. Without group A, the result doesn't arrive for decades or maybe never; without group B, it arrives on schedule anyway. So the multiplicity is real and yet it licenses no inevitability inference — and the asymmetry has to be generated by something structural about the problem and the field, not by a lucky accident, not by A having a once-in-a-generation genius, not by A having some private advantage B lacks.
  - And you can't just assert the asymmetry in the last sentence. The machinery has to be in the scenario so a reader could run the counterfactuals themselves. Stipulating the verdict is cheating.

  Then do the work: run both counterfactuals explicitly and say what you're holding fixed across the nearby worlds; add one wrinkle where the field ends up citing and building almost exclusively on B's version, and tell me what that does to the question of whether it matters who discovered it — is the answer about credit, about the content, or about uptake? Name the single feature of the case that's doing the work, and tell me what happens if I delete it — does the case collapse into a singleton, or into a symmetric multiple the inevitabilist is happy with? Finish with the inevitabilist's best attack on your case, letting them redescribe it however they like, and say honestly whether the attack lands.
reasoning: |-
  We are building a thought experiment to challenge the inference from simultaneous discovery to inevitability. The scenario must be a genuine Merton-style multiple in present-day science, with asymmetric counterfactuals. The asymmetry should be structural, not due to luck or unique genius. We cannot simply assert the asymmetry; it must emerge from the setup.

  **Candidate Setups and Rejections:**

  1. **Candidate 1:** Two groups independently develop a machine learning algorithm for protein folding. Group A uses a novel, highly specialized hardware setup that is not widely available, while Group B uses standard cloud computing. Without A, the algorithm would be delayed because B's approach requires massive computational resources that become cheaper only in the future. Without B, A's method is too niche to be adopted. 
     *Rejection:* The asymmetry here relies on A having a private advantage (specialized hardware) and B's method being resource-intensive but becoming cheaper. This might be seen as a lucky accident (A having the hardware) or contingent on technological progress. Also, the delay without B is tied to cost reductions, which is external and not structural to the scientific problem.

  2. **Candidate 2:** Two groups discover a new class of high-temperature superconductors. Group A is in a country with strict export controls on rare-earth elements, forcing them to use a substitute that leads to a complex, hard-to-reproduce synthesis. Group B uses the standard, straightforward method. Without A, B's method becomes the standard quickly. Without B, the field struggles for years because A's method is too difficult and requires rare skills. 
     *Rejection:* The asymmetry is generated by geopolitical factors (export controls) and skill scarcity. This is not purely structural to the field but contingent on political and training factors. Also, it risks making A's contribution seem less valuable due to impracticality.

  3. **Candidate 3 (Chosen):** Two groups independently develop a computational method for predicting the 3D structure of RNA molecules. Group A is at a prestigious university with a strong tradition in molecular dynamics, so they build a method that requires extremely fine-grained simulations and expert tuning. Group B is at a tech company with vast data resources and uses a machine learning approach trained on a newly available, massive dataset of RNA sequences and structures. Without Group A, the field would have to wait until the machine learning approach becomes feasible (which it does because of B). Without Group B, the field would have the result on schedule because A's method works but is so resource-intensive and skill-dependent that only a few labs can use it. The structural asymmetry comes from the two different methodological paradigms and the resources required for each.

  **Why choose Candidate 3?** The asymmetry is structural: one method (A) is highly specialized and requires rare expertise and computational resources, while the other (B) leverages scalable data-driven approaches that are becoming mainstream. The availability of the massive dataset is a key structural feature (it's public but was just released) and the shift toward data science in the field is a trend, not an accident. The counterfactuals can be run by considering the accessibility and scalability of the methods.

  **Final Thought Experiment:**

  In 2023, two research groups independently develop a method to predict the 3D structure of RNA molecules from sequence. Group A (academic lab) uses a first-principles molecular dynamics approach, requiring supercomputing resources and deep expertise in physics-based simulations. Their method is accurate but demands weeks of computation for a single RNA and expert tuning. Group B (industry lab) uses a deep learning approach trained on a newly released public database of RNA structures (from a large-scale experimental project). Their model, once trained, predicts structures in seconds and is accessible via a web server. Both publish within three months of each other. The field quickly adopts Group B's method because it is fast and easy to use, despite Group A's method being slightly more accurate in certain edge cases.

  **Running the Counterfactuals:**

  - **Without Group A:** The field has Group B's method. The machine learning approach is feasible because the dataset was publicly released and the computational resources for training are available to Group B. The result (a practical RNA structure predictor) arrives on schedule via B. The molecular dynamics approach might have been developed eventually, but it would take much longer because it requires a convergence of expertise and computational advances that are not prioritized in the current data-centric environment. Without A, the field might never invest heavily in the first-principles approach because B's method is "good enough" and scalable. Thus, without A, the result (a practical tool) is still available via B, but the alternative approach (A's) is delayed or never developed.

  - **Without Group B:** The field has Group A's method. It works and is published, but because it is so resource-intensive and requires rare expertise, only a few elite labs can use it. However, the problem is solved and the result exists. The field might eventually develop a more accessible method, but in the short term, the result is available (though not widely). The machine learning approach might have emerged later when more data became available and computational resources improved, but without B's breakthrough in 2023, it could be delayed. However, note that the dataset was public and the ML approach was inevitable given the data boom. But without B, the specific implementation and timing might be delayed by a few years until another group (with ML expertise) picks it up. However, the structural trend (data-driven science) makes it likely to happen soon. But in this counterfactual, the result (a practical tool) is not yet widely available until someone else does B's work. However, the discovery (the method) exists via A, so the content is known. The uptake is limited.

  **Holding Fixed Across Worlds:**
  - The public release of the large RNA structure dataset (a one-time event).
  - The general trends in computational biology (move toward data-driven methods).
  - The availability of computational resources (e.g., cloud computing for B, supercomputers for A).
  - The existence of the two different research traditions (molecular dynamics and machine learning).

  **Wrinkle: The Field Cites and Builds Almost Exclusively on B's Version**

  After the discovery, the field adopts Group B's method because it is user-friendly and scalable. Papers cite B, and follow-up work uses B's tool. Group A's method is acknowledged but rarely used. 

  **What this does to the question of whether it matters who discovered it:**
  - **Credit:** Group B gets the lion's share of credit because their version is used. Group A is seen as having a parallel, but less practical, approach.
  - **Content:** The content of the discovery is similar (both methods predict RNA structures) but the implementations are different. The core idea might be considered the same (predicting structure from sequence), but the methods are distinct. However, the uptake of B's method shapes how the discovery is understood and extended.
  - **Uptake:** The uptake matters because it determines the trajectory of the field. B's method enables rapid progress because it is accessible, while A's method might lead to niche advances. The "discovery" becomes defined by the community's use. Thus, it matters who discovered it in terms of which version becomes the foundation for future work.

  **The Single Feature Doing the Work:**

  The structural asymmetry in the *accessibility and scalability* of the two methods. Group A's method is high-cost (in expertise and computation) and low-scalability, while Group B's is low-cost and high-scalability. This feature is structural because it stems from the inherent differences between the two methodological paradigms (first-principles simulation vs. data-driven ML) and the resources required.

  **What if we delete this feature?** If both methods were equally accessible, we would have a symmetric multiple. The inevitabilist would be happy to say the discovery was inevitable and both groups contributed equally. Without the asymmetry, the case collapses into a symmetric multiple.

  **The Inevitabilist's Best Attack:**

  The inevitabilist might argue: "The discovery was inevitable because both methods were bound to emerge given the state of the field. The dataset was public, so someone would have applied ML to it soon. Similarly, molecular dynamics approaches were being refined for years. The simultaneity proves it was ripe. The asymmetry in uptake is just about social and practical factors (which method is easier to use), not about the inevitability of the discovery. The content was discovered independently, and that's what matters. The fact that one method is more popular doesn't change the inevitability of the discovery itself."

  **Does the attack land?** Partially. The inevitabilist is right that both methods were likely to be developed given the field's state. However, the thought experiment challenges the inference from simultaneity to inevitability of the *practical realization* of the discovery. Without Group B, the field might have the result (from A) but not in a form that enables widespread progress. The inevitabilist might counter that the practical tool was also inevitable because the data and computational trends were clear. But the attack does not fully land because the counterfactual without A shows that the result (in a practical form) would still have arrived on time via B, while without B, the practical tool might be delayed. Thus, the simultaneity does not imply that the discovery (in a form that the field can use) was inevitable at that time without B. The inevitabilist might have to concede that the form of the discovery (the method that becomes standard) is contingent on which group gets there first and which approach they take. But they might hold that the core idea was inevitable.

  **Honest Assessment:** The attack lands in that it shows the core discovery (a method to predict RNA structures) might have been inevitable in some form. But it does not fully address the asymmetry in the counterfactuals about when and how the discovery becomes operational for the field. The thought experiment successfully jams the slide from simultaneity to inevitability by showing that one of the discoverers (B) was crucial for the timely and practical realization, while the other (A) was not. Thus, the simultaneity does not imply that the discovery was inevitable without both.
