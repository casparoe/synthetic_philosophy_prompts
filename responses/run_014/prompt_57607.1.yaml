  ### Thought Experiment: The RNA Folding Breakthrough

  **Scenario:** In 2024, two research groups independently develop a computational method to predict the 3D structure of RNA molecules from sequence data—a problem critical for drug design and gene therapy. Group A (a small university lab) uses a *physics-based approach*, building on decades of molecular dynamics simulations. Their method is theoretically elegant but requires bespoke supercomputing access and deep expertise in quantum chemistry, making it impractical for most labs. Group B (a large AI institute) uses a *machine learning approach*, training a neural network on a newly public, massive dataset of RNA structures (released in 2023 by a global consortium). Their method is fast, cloud-deployable, and requires only basic programming skills. Both groups publish within eight months of each other, with near-identical accuracy on benchmark tests. The field rapidly adopts Group B’s method due to its accessibility, while Group A’s work is cited as a "theoretical confirmation" but rarely used.

  #### Running the Counterfactuals
  **Holding fixed across worlds:**  
  - The 2023 public release of the RNA structure dataset.  
  - Existing trends in computational biology (e.g., rise of ML, physics-based simulation tools).  
  - Resource constraints (supercomputing scarcity, cloud computing availability).  
  - No contact or leakage between groups.  

  1. **Without Group A:**  
     Group B’s ML method emerges on schedule. The dataset is public, and ML expertise is widespread in industry/academia; other labs (e.g., tech companies) are already exploring similar models. The physics-based approach, however, stalls. Without Group A’s niche breakthrough, the field lacks the impetus to invest in computationally intensive simulations. Progress in *first-principles RNA folding* delays by 10–15 years, awaiting cheaper hardware and cross-disciplinary collaborations. The *result* (a practical predictor) arrives via B, but the *physics-based understanding* remains underdeveloped.  

  2. **Without Group B:**  
     Group A publishes their physics-based method, proving the concept. But its resource demands limit adoption: only 3–5 elite labs worldwide can run it. The ML approach—dependent on the public dataset—is inevitable; within 2 years, another group replicates B’s work. However, without B’s timely, user-friendly implementation, *widespread access* to the tool delays by 18–24 months, slowing applications in medicine. The *discovery* exists via A, but its *utility* is deferred.  

  #### The Wrinkle: Exclusive Uptake of B’s Version  
  The field cites and builds almost entirely on Group B’s method. Follow-up papers use B’s code; industry develops B’s approach into tools; grants prioritize ML extensions. This shapes the discovery’s impact:  
  - **Credit:** B receives primary credit (e.g., prizes, funding), as uptake favors perceived innovators.  
  - **Content:** The discovery’s "core" is identical (RNA folding is solvable), but B’s version defines *how* it’s solved—ML becomes the paradigm, marginalizing physics-based insights.  
  - **Uptake:** Uptake determines the discovery’s *trajectory*. B’s method enables rapid democratization, while A’s would have confined it to elites. Thus, "who discovered it" matters for *how science progresses*, not just for priority.  

  #### The Single Feature Doing the Work  
  **Methodological scalability asymmetry:** Group A’s approach is high-cost/low-scalability (rare expertise, custom hardware), while Group B’s is low-cost/high-scalability (public data, cloud-based). This is structural—rooted in the *problem’s inherent demands* (RNA folding requires massive computation/data) and the *field’s evolution* (ML democratization vs. simulation specialization).  

  - **If deleted:** Without scalability asymmetry, the case collapses into a symmetric multiple (e.g., two equally accessible methods). The inevitabilist happily claims simultaneity proves inevitability.  

  #### The Inevitabilist’s Best Attack and Whether It Lands  
  **Attack:** "The simultaneity *still* shows inevitability! Both methods emerged from structural forces: the dataset release made ML inevitable, and physics-based simulation was maturing. Scalability differences are irrelevant—science always converges on efficient solutions. Group B’s uptake was guaranteed by efficiency pressures, so the discovery’s form was inevitable too. The core insight (RNA folding is computable) was ‘in the air’—your asymmetry just shows *implementation* contingencies, not discovery contingencies."  

  **Does it land? Partially, but not fatally.**  
  - **Lands:** The inevitabilist correctly notes structural forces (dataset, ML trends) made *some* solution likely. Scalability *does* affect implementation, not the discovery’s bare existence.  
  - **Fails:** The attack ignores the counterfactual without B: the discovery’s *real-world impact* delays, and without A, a *whole approach* (physics-based) nearly vanishes. Simultaneity doesn’t prove the discovery was inevitable *in a socially consequential form*—only that the field was primed. The asymmetry shows that *who* discovers it shapes *what science does next*, undermining "inevitability" as a blanket inference.  

  **Verdict:** The case jams the slide by decoupling simultaneity from inevitability of impact. It forces students to confront that multiples can arise from asymmetric structural factors (scalability), where one discoverer enables timely uptake while the other does not—making credit, content, and uptake interdependent.
