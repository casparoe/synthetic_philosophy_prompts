  **Activity: The Perplexing Policy**  
  *(80 minutes total; materials: scenario handouts, timer, whiteboard)*  

  **1. Setup (5 min)**  
  - *Rules:* "Read this policy proposal silently. Note your immediate reaction. No discussion yet."  
  - *Materials:* Distribute handouts with this scenario:  

  > **The Equality Machine**  
  > Imagine a device that erases all innate talent differences. At age 18, everyone enters the Machine. It redistributes genetic aptitudes—math geniuses gain artistic talent but lose calculation skills, athletes trade reflexes for empathy, etc. Post-treatment, all have equal *potential*.  
  >   
  > **Proposal:** Mandatory use for all citizens.  
  > **Question:** Do you support this policy? Why/why not?  

  **2. Silent Reflection (7 min)**  
  - Students privately write:  
    - Their policy stance (support/oppose)  
    - The *strongest reason* for their view  
    - One emotional reaction (e.g., unease, relief)  
    - The story detail that most influenced them  

  **3. Group Reverse-Engineering (25 min)**  
  - *Rules:*  
    - Form groups of 4.  
    - **Task 1:** Share initial responses. Identify patterns in persuasion.  
    - **Task 2:** Reverse-engineer *how* the scenario swayed them. Answer:  
      > "What *specific storytelling tricks* made this proposal feel compelling (even if you disagreed)? List at least 3 tactics with examples from the text."  
    - *Critical constraint:* Forbid philosophical terms (e.g., "fairness," "identity"). Focus *only* on narrative/rhetorical devices (e.g., word choice, pacing, imagery).  

  **4. Class Synthesis (20 min)**  
  - Groups report tactics. Whiteboard examples:  
    - *Expected finds:*  
      - **Vivid labeling** ("*Erases* differences" implies violence)  
      - **False concreteness** (The "Machine" feels tangible)  
      - **Selective specificity** (Ages "18," but no technical details)  
      - **Emotional priming** ("*Mandatory*" triggers rebellion)  
      - **Binary framing** (Support/oppose ignores alternatives)  
  - *Push:* "Which tactic felt most manipulative? Why?"  

  **5. Theoretical Debrief (23 min)**  
  - **Reveal:** "You dissected an *intuition pump*—Dennett's term for thought experiments that ‘pump’ intuitions via narrative."  
  - **Map findings to theory:**  
    | Student Observations      | Dennett’s Categories          |  
    |---------------------------|-------------------------------|  
    | "Vivid labeling"          | *Striking Detail*             |  
    | "Binary framing"          | *False Dilemma*               |  
    | "Emotional priming"       | *Appeal to Fear/Outrage*      |  
    | "False concreteness"      | *Reification* (making abstract concrete)|  
  - **Key insight:** Thought experiments persuade by *exploiting narrative cognition*—we’re wired to accept story logic uncritically.  
  - **Gap:** The activity *can’t capture* **counterpumping**—how experts resist pumps by spotting hidden assumptions (e.g., "Does equality require sameness?"). *Fill this in next lecture.*  

  **Predictable Problems & Fixes:**  
  - **Problem:** Students debate policy, not rhetoric.  
    - *Fix:* Restate task: "I don’t care *what* you decided. I care *how* the story made you decide."  
  - **Problem:** Groups miss subtle tactics (e.g., "age 18" exploits youth transition symbolism).  
    - *Fix:* Seed one group with a hint: "Why *18* and not 21?"  
  - **Problem:** Overgeneralizing ("It was emotional").  
    - *Fix:* Demand text evidence: "Point to the *exact phrase* that caused emotion."  

  **Why This Works:**  
  - The fresh scenario triggers visceral responses, making the "pump" palpable.  
  - Forcing reverse-engineering *before* theory prevents intellectualization.  
  - Whiteboard mapping bridges experience to theory, revealing persuasion mechanics.  

  **Follow-Up:** Next session, analyze how this pump smuggles in assumptions (e.g., "equality = uniformity") to transition to counterpumping techniques.
