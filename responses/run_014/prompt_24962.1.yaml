prompt: |-
  i'm teaching an upper-level undergrad seminar called "thinking about thinking" — about 16 students, one 90-minute session. the unit is on intuition pumps and how thought experiments do their persuasive work. i don't want to just lecture about dennett's list of tricks (the striking detail, the strategic use of "surely", etc). i want them to feel the machinary from the inside.

  design an activity where students get subjected to an intuition pump they haven't seen before, and then have to reverse-engineer what made it work on them — ideally before they even hear the term "intuition pump." the activity should have them identify the specific narrative and rhetorical moves that did the persuading, and then in the debrief we map those onto the theoretical categories. rules, materials, timeline, and a debrief that connects what happened to the philosophical analysis of thought experiments. also tell me what will predictably go wrong and how to handle it, and which aspect of intuition pumps the activity can't capture (so i can fill it in afterwards).

  bottom line first, no preamble, no restating the question — just give me the activity.
reasoning: |-
  We are going to use a thought experiment that the students are unlikely to have encountered. The thought experiment is designed to pump the intuition that personal identity is not tied to physical continuity but rather to psychological continuity. We'll use a variation on the "teleportation" thought experiment, but with a twist to make it feel fresh.

  **Activity: The Teleportation Surprise**

  **Goal:** Students will experience an intuition pump and then reverse-engineer the persuasive techniques used.

  **Materials:** 
  - Handout with the thought experiment scenario (one per student)
  - Whiteboard or flip chart for recording student observations during debrief
  - Timer

  **Rules:**
  1. Students are not to discuss the scenario until the activity moves to the group discussion phase.
  2. During the initial reading and reflection, students should note their immediate intuitive response and any reasons they feel persuaded (if they are).

  **Timeline (90 minutes total):**

  **Part 1: Introduction (5 minutes)**
  - Briefly frame the session: "Today we're going to engage with a puzzling scenario about identity. I want you to read it and then we'll discuss your reactions. Don't overthink it — go with your gut."

  **Part 2: Individual Reading and Reflection (10 minutes)**
  - Distribute the handout with the following scenario:

  > **The Teleportation Surprise**
  > 
  > Imagine a futuristic teleportation device that works by scanning your entire body, destroying it, and then reconstructing an exact copy at the destination. The process is instantaneous and the copy is perfect down to the last atom. You've used it many times without incident.
  >
  > One day, you step into the teleporter and press the button. You feel a brief tingling sensation, but then nothing else happens. You look around and realize you're still in the departure room. The teleporter's display flashes: "ERROR: DESTRUCTION FAILED. RECONSTRUCTION SUCCESSFUL AT DESTINATION."
  >
  > You panic and call the destination site. They confirm: a perfect copy of you has arrived there, and it is behaving exactly as you would, claiming to be you and having all your memories up to the moment of teleportation.
  >
  > Meanwhile, you (in the departure room) are still here, with all your memories and experiences. You are told that the destruction phase of the teleportation failed, so the original body was not destroyed. Now there are two of you: the original (you) and a duplicate at the destination.
  > 
  > **Question:** Who is the real you? Are you the original? Is the duplicate also you? Or is the duplicate someone else? And what should happen next?

  - Ask students to write down:
    a) Their immediate intuitive answer to the question: "Who is the real you?" 
    b) Any feelings of unease, confusion, or certainty they experienced.
    c) What specific part of the scenario made them feel that way?

  **Part 3: Small Group Discussion (15 minutes)**
  - Divide students into groups of 4.
  - Instruct them to share their intuitive answers and the reasons they felt persuaded by the scenario (if they did). They should also note any disagreements within the group.
  - Prompt: "Identify the specific parts of the story that made you feel a certain way about who the real you is. What did the author do to make you think that?"

  **Part 4: Reverse-Engineering in Groups (20 minutes)**
  - Now, ask the groups to reverse-engineer the scenario. Their task: 
    "You are now the 'engineers' of this thought experiment. Your job is to figure out how it works. 
    - What narrative and rhetorical devices did the author use to guide your intuition? 
    - List at least three specific techniques or elements in the story that you think were designed to persuade you. 
    - For each, explain why it was effective."

  - Provide an example to get them started (if needed): 
    "For instance, the scenario starts with 'Imagine...' which invites you to visualize and become immersed."

  **Part 5: Class Discussion and Debrief (35 minutes)**
  - Bring the class together. 
  - First, ask groups to report their intuitive responses (Part 3) and note the diversity of responses (if any) on the board.
  - Then, have groups share the persuasive techniques they identified. Write these on the board. 
    (Expected answers might include: vivid details like "tingling sensation", the emotional punch of "panic", the step-by-step buildup, the use of technical-sounding error messages, the rhetorical question at the end, etc.)

  - **Connect to Theory (15 minutes of the debrief):**
    - Introduce the term "intuition pump" (defined by Dennett as a thought experiment that pushes our intuitions in a particular direction).
    - Map their observations to Dennett's tricks:
      - **The Striking Detail:** The error message and the tingling sensation make the scenario feel real.
      - **The Strategic Use of "Surely":** (Not in this scenario, but you can point out that sometimes thought experiments use words like "obviously" or "clearly" to nudge the reader.)
      - **Narrative Structure:** The step-by-step progression from a familiar concept (teleportation) to a twist (failure) and then the dilemma.
      - **Rhetorical Questions:** The questions at the end direct the reader to focus on the identity problem.
      - **Emotional Engagement:** The panic and the surprise of the error create an emotional hook.

    - Discuss how thought experiments work by:
      - Isolating variables (here, physical continuity vs. psychological continuity)
      - Using relatable scenarios to trigger pre-theoretical intuitions
      - Employing narrative to bypass analytical resistance

  - **What the Activity Can't Capture (5 minutes):**
    - Point out that intuition pumps often rely on background assumptions that are not explicitly stated. In this case, the scenario assumes that the duplicate has all your memories and personality, which is what makes the psychological continuity theory plausible. Also, the activity focuses on the experience of being pumped, but doesn't address how intuition pumps can sometimes be misleading or how they might be criticized (which you'll cover in a later session).

  **Part 6: Wrap-up (5 minutes)**
  - Summarize: "Today you experienced an intuition pump and then dissected it. You saw how narrative and rhetorical devices can guide our intuitions. Next time, we'll look at how philosophers analyze and sometimes debunk these pumps."

  **What Will Predictably Go Wrong:**
  1. **Students might get stuck on the metaphysics:** They may want to debate the philosophy of identity instead of analyzing the rhetorical devices. 
     - *Handling:* Gently redirect: "For now, we're focusing on how the story made you feel and why, not what the right answer is."

  2. **Groups may not dig deep enough into the rhetoric:** They might list surface features without connecting them to persuasion.
     - *Handling:* Provide probing questions during group work: "Why did the author include that detail? How did it make you feel? Did it make the scenario more believable?"

  3. **Some students may have encountered similar thought experiments:** This might reduce the surprise.
     - *Handling:* Acknowledge it: "Even if you've heard something similar, focus on how this particular version is constructed. What's different here?"

  4. **Time management:** The group discussions might run long.
     - *Handling:* Use a timer and announce time checks. Cut off discussions at the allotted time and move on.

  **Why this activity works:**
  - It immerses students in the experience of being pumped, making the subsequent analysis more grounded.
  - The scenario is engaging and likely to produce strong intuitions and disagreements, fueling the reverse-engineering.
  - The debrief explicitly connects their observations to theoretical concepts, reinforcing the learning.

  **Note:** The aspect of intuition pumps that this activity doesn't capture is the potential for misuse — how intuition pumps can sometimes be deceptive by smuggling in questionable assumptions. You will cover that in a follow-up session by analyzing flawed thought experiments.
