prompt: |-
  Right, so I'm a science journalist, I write a fortnightly column on physics and ideas, and I keep having this argument at dinner parties that I'm pretty sure I'm loosing. My line goes something like this: the 2022 physics Nobel, the one for the Bell-test experiments with entangled photons, basically settled the matter, didn't it? Local hidden variables are dead, so de Broglie–Bohm pilot-wave theory is finished, and everyone serious has quietly defected to Many-Worlds or just gone back to shutting up and calculating. Except a physicist friend of mine says I've got it exactly backwards, that the Nobel result is if anything *good* for Bohm, and that I'm confusing two completely different things. Surely that can't be right? If Bohm's theory needs those spooky instantaneous links between distant particles, and relativity says nothing outruns light, hasn't the Nobel just put the final nail in it? And on top of that — doesn't Bohm being nonlocal mean you could in principle use it to send a message faster than light, which would be an instant experimental refutation? So where does my argument actually go wrong, because I've got a horrible feeling it's somewhere deeply embarrassing and I'd rather find out from you than from him over pudding.
reasoning: |-
  Okay, the user is a science journalist who writes about physics and ideas. They're having an argument at dinner parties about the 2022 Nobel Prize in Physics and its implications for de Broglie-Bohm pilot-wave theory versus Many-Worlds interpretation. They believe the Nobel settled the matter against local hidden variables, hence against Bohmian mechanics, but their physicist friend says they've got it backwards. The user is confused and wants to understand where their argument goes wrong.

  First, I need to recall what the 2022 Nobel Prize was awarded for. It was for experiments confirming quantum entanglement and violating Bell inequalities, right? Bell's theorem shows that no local hidden variable theory can reproduce all quantum predictions. So the user thinks this rules out Bohmian mechanics because it's a hidden variable theory. But their friend says it's actually good for Bohm. Why?

  Ah, the key point is locality. Bell's theorem kills local hidden variables, but Bohmian mechanics is explicitly non-local. It never claimed to be local. So the Nobel result doesn't affect Bohm because it was already non-local. In fact, the Nobel confirms that non-locality is necessary, which Bohmian mechanics has built-in. That's why their friend says it's good for Bohm—it shows that any hidden variable theory must be non-local, which Bohm already is.

  The user also thinks that non-locality in Bohm would allow faster-than-light communication. But I remember that Bohmian mechanics reproduces all quantum predictions, including the no-communication theorem. Even though there's non-local interaction between particles, the wave function's evolution prevents signaling. The configuration of the system is such that any attempt to manipulate one particle doesn't allow useful information to be sent faster than light. So no, you can't use it for FTL communication.

  The user might be conflating "hidden variables" as a category with the specific local hidden variables Bell addressed. Bell's theorem only rules out local ones, not all hidden variables. Bohm is non-local, so it survives. Also, they might think that non-locality is a deal-breaker because of relativity, but Bohm handles it by having a preferred frame implicitly, though it's experimentally inaccessible. Relativity isn't violated because you can't detect that frame or send signals FTL.

  Another point: the user mentions Many-Worlds as a winner here. But Many-Worlds is non-local too, in a different way, through the universal wave function. Both interpretations require non-locality, so the Nobel doesn't favor one over the other in that regard. Shutting up and calculating is still popular because interpretations don't affect experimental outcomes.

  So the user's embarrassment probably comes from misunderstanding that Bell's theorem only refutes local hidden variables, not non-local ones like Bohm. They thought "hidden variables" meant Bohm was included, but it's not because Bohm is non-local. The Nobel actually supports the necessity of non-locality, which Bohm already incorporated. Their mistake was equating all hidden variable theories with local ones.
answer: |-
  Ah, the classic dinner party quantum debate! Don't worry, your confusion is incredibly common and stems from a subtle but crucial distinction that trips up many smart people. Your physicist friend is correct: **the 2022 Nobel Prize result is actually *consistent* with, and arguably *supports*, the possibility of de Broglie-Bohm (dBB) pilot-wave theory.** Your argument goes wrong in its fundamental characterization of what Bell's theorem *actually* disproved and what dBB *actually* is.

  Let's break down where the misunderstanding lies:

  1.  **What Bell's Theorem (and the Nobel-Winning Experiments) Actually Disproved:**
      *   Bell's theorem proved that **no *local* hidden variable theory** can reproduce *all* the statistical predictions of quantum mechanics.
      *   The experiments (like Aspect's, closing the major loopholes) spectacularly confirmed that quantum predictions hold and that these predictions **violate Bell inequalities**.
      *   **Conclusion:** Any theory claiming to underpin quantum mechanics must be **non-local** and/or **indeterministic** (if it avoids hidden variables). **Local realism (local hidden variables) is dead.**

  2.  **What de Broglie-Bohm Theory Actually Is:**
      *   dBB **is** a hidden variable theory. It postulates that particles have definite positions and trajectories at all times.
      *   Crucially, dBB **is explicitly and fundamentally NON-LOCAL.** The "pilot wave" (the quantum wave function) guiding the particles responds *instantaneously* to changes in the configuration of the *entire system*, no matter how far apart the particles are.
      *   dBB was specifically designed *to be* non-local from the start (by de Broglie and later Bohm) precisely to reproduce quantum mechanics. It never pretended to be local.

  3.  **The Crucial Mistake: Confusing "Hidden Variables" with "Local Hidden Variables"**
      *   Your argument: "Bell killed local hidden variables, dBB is a hidden variable theory, therefore Bell killed dBB."
      *   **The flaw:** Bell killed *specifically* **LOCAL** hidden variables. dBB is a **NON-LOCAL** hidden variable theory.
      *   **The Nobel result is *good* for dBB because:** It proved that *any* viable theory *must* be non-local (or abandon realism/definiteness altogether, like Copenhagen or Many-Worlds). dBB *embraces* and *builds in* this non-locality explicitly. The experiments confirm that the kind of non-locality inherent in dBB (and in the quantum wave function itself) is a fundamental feature of reality. They don't rule dBB out; they rule out dBB's *competitors* in the *local hidden variable* category (like early Einstein-type hopes).

  4.  **Addressing Your Specific Concerns:**
      *   **"Bohm needs spooky links, relativity forbids FTL, so Nobel killed it":**
          *   Relativity forbids **signalling** faster than light (FTL), not necessarily all forms of non-local connection ("spooky action at a distance").
          *   dBB **is** non-local, but it is carefully constructed so that this non-locality **cannot be used to send signals.** This is the **no-signalling theorem**, which holds in standard quantum mechanics *and* in dBB. The instantaneous connection affects the *hidden* particle trajectories, but the statistical outcomes observed in experiments (dictated by the wave function) always obey relativistic causality. You cannot *control* the non-locality to send a message. Experimentally, dBB makes *exactly the same predictions* as standard QM, including the *impossibility* of FTL signalling confirmed by countless experiments. The Nobel experiments themselves rely on this!
      *   **"Non-locality means FTL messages = instant refutation":**
          *   As above, this is incorrect. The non-locality in dBB is *hidden* and *contextual*. Manipulating one particle *does* instantaneously affect the trajectory of its entangled partner far away. However, the *observable outcome* for the distant partner, when measured, is still completely random and uncorrelated with any *controllable* setting change you make on the first particle *in a way that could encode a signal*. The randomness washes out any potential signal. It's deeply weird, but doesn't violate relativity's prohibition on FTL signalling.

  5.  **The Real Status of dBB and Many-Worlds (MWI):**
      *   **dBB:** The Nobel result **does not rule out dBB.** It rules out *local alternatives* to dBB. dBB remains a logically consistent, empirically equivalent (makes all the same experimental predictions), and fully deterministic interpretation of quantum mechanics. Its main "cost" is explicit, uncontrollable non-locality and arguably a more complex ontology (particles + pilot wave).
      *   **MWI:** The Nobel result is also consistent with MWI. MWI avoids non-locality *in the sense of instantaneous influence* by having everything happen locally within branches of the universal wave function. However, the wave function itself evolves non-locally (according to the Schrödinger equation across all space), and the "splitting" process maintaining consistency between branches involves a kind of global coordination. MWI's main "cost" is an infinite number of unobservable parallel universes.
      *   **Shut Up and Calculate:** Still popular! The interpretations don't change the predictive framework used for practical calculations.
      *   **Conclusion:** The Nobel result **forced non-locality onto the table** as an essential feature. dBB incorporates it explicitly. MWI incorporates it within the wave function dynamics. Neither was "killed"; both are consistent with the result. Local hidden variables were killed.

  **Where the Embarrassment Lies (Don't Worry, It's Common!):**

  You fell into the trap of thinking "Bell killed hidden variables" full stop. The critical nuance is that **Bell killed *LOCAL* hidden variables.** De Broglie-Bohm is the *archetypal* **NON-LOCAL** hidden variable theory. The experiments confirmed that reality *requires* the kind of non-locality that dBB has built into its core. So, your friend is right: the result is arguably *good* for dBB in the sense that it eliminates its local rivals and confirms the necessity of non-locality.

  **Next Dinner Party Strategy:**

  Concede gracefully! Say something like: "Ah, you're absolutely right. I was conflating 'hidden variables' with 'local hidden variables.' Bell killed the local ones, but Bohm's theory survives precisely *because* it embraces the non-locality that the Nobel experiments confirmed is necessary. My bad! Pass the port?" You'll earn serious intellectual honesty points.

  The deeper lesson is that interpretations of quantum mechanics are *metaphysical* frameworks *consistent with* the same experimental predictions. The Nobel confirmed the predictions and killed local realism, but didn't, and couldn't, single-handedly decide between the surviving non-local interpretations (dBB, MWI) or the non-realist ones (Copenhagen). The debate happily continues!
