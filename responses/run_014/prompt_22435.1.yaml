prompt: |-
  ok so I've been stuck on this superrationality idea you see on decision theory blogs (the one where in the prisoner's dilemma you're supposed to cooperate, because the other player is rational and will run the exact same reasoning you're running, so you can basically count on him cooperating too). my problem is I cant tell what's actually doing the work in the argument. is it just 'assume he cooperates' in a fancy coat, or is there a real logical step where your deciding to cooperate somehow logically pins his decision down? and the thing that really bugs me is what if the other guy is NOT running the same procedure as you, wich is the whole point of the 'he'll do what you'd do' move — like a smart agent who's figured out superrationalists are exploitable and just plans to defect against them. then that move seems to collapse, right? I want to understand exactly where the chain from 'both are rational' to 'so cooperate' holds and where it breaks, not just the clean symmetric case where everyone's the same.
