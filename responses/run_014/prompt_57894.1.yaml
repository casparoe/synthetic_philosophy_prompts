  My cousin beams with pride. "Told ya! Worth every penny!"

  St. Peter sighs. "There's just one problem... We had to run them through the Divine Authenticator™."

  My cousin's heart drops. "And?"

  **The Punchline:**  
  "...The laces were tied by someone who actually *cared* about the shoes. Welcome to Heaven, son. Head on in."

