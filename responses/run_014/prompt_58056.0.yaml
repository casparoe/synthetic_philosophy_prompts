prompt: |-
  Hey, could you act as a professional philosopher who works on ethics and global justice and help me sort out my messy intuitions about favoring compatriots? Please think really carefully through this and start with some brainstorming of a few different candidate principles before you lock one in, I care about the reasoning.

  Here is where I am at, case by case:

  1. If I am hiring for my little cafe and I have two equally good applicants, one is a local kid from my town and the other is applying from abroad and is actually a bit needier, I would pick the local and feel totally fine about it.

  2. But if I am voting on a tariff that would save like 100 jobs in my state while pushing thousands of foreign farmers into deep poverty, voting yes just because my people come first feels definately wrong to me.

  3. When our goverment after an earthquake sends most of its rescue budget to a small quake at home even though a much bigger quake happened abroad the same week, I think that is not just allowed but what it should do.

  4. But if an ER doctor has two patients bleeding equally badly, one is a citizen and one is a tourist, and she treats the citizen first just because of the passport, that feels wrong to me, she should do first-come first-served or a coin flip or medical need, not nationality.

  5. My own donations: I give most of my charity money to the local food bank even though I know the same money would feed way more kids if I sent it abroad, and I beleive that is fine, maybe even good.

  6. The one I keep going back and forth on and I want your principle to decide: my state university reserves most spots for in-state kids, so a pretty average local kid gets in over a brilliant refugee kid from a war zone who would benefit expecially hugely. Is that more like case 3 where the institution should favor its own, or more like case 4 where it should not?

  Is there one principle that gets all or most of these, and if not which of my verdicts should I drop? Please state the principle as clearly as you can, say which case motivates each part of it, be honest about where you have to bite the bullet and overturn one of my takes to keep it simple, and then show what your repaired principle predicts for a new case I did not list, like whether a mayor should fund a local arts center over sending that same money for flood relief abroad when foreigners need it more.
reasoning: |-
  Okay, the user is asking for help sorting out their conflicting intuitions about favoring compatriots in various scenarios. They've presented six cases where they feel differently about prioritizing locals versus foreigners, and they want a consistent ethical principle to resolve these tensions, especially focusing on the university admission dilemma.

  Hmm, this is a classic problem in partiality vs. impartiality debates within global justice ethics. The user clearly has nuanced instincts—they intuitively reject extreme nationalism but also resist pure cosmopolitanism. Their cases reveal tension between special obligations and universal needs. Interesting how their ER doctor example (case 4) triggers strong impartiality instincts while the earthquake response (case 3) feels legitimately partial—suggesting they distinguish crisis severity.

  Ah! The university case (6) is their sticking point because it straddles institutional mission (like the state's earthquake response) and individual merit (like the ER triage). They need a principle that explains why state universities might permissibly show partiality while ER doctors shouldn't. 

  *scribbles mentally* Key variables emerging: 
  - Scale of harm (tariffs ruin lives vs. cafe hiring is minor) 
  - Role-specific duties (doctors vs. voters) 
  - Reciprocity expectations (tax-funded institutions) 
  - Whether the "local" bond is direct (cafe hiring) or mediated (tariffs affect distant foreigners)

  *Pauses* The donation case (5) is particularly telling—they defend local charity while acknowledging its inefficiency, implying they value communal ties. But this clashes with their rejection of the tariff case (2) where communal ties cause massive harm. So the principle must have a harm threshold...

  *Starts drafting* The best framework might blend Miller's associative duties with a negative duty constraint. First principle: Special obligations exist but can't violate baseline rights. That explains why the tariff is wrong (causes poverty=rights violation) but the cafe hire is fine (no rights impacted). 

  *Checks against cases* 
  - ER triage: Nationality isn't relevant to medical duty, plus both have equal rights to care → impartiality required. 
  - Earthquake: Both disasters threaten rights, but state's primary jurisdiction over domestic rescue creates special obligation → partiality permitted. 
  - University: Tricky! If refugee lacks educational access elsewhere, favoring locals might violate their baseline right to opportunity. But if the university is tax-funded, reciprocity arguments could justify some partiality... 

  *Revises* Principle needs clearer harm conditions. Version 3: Strong partiality permitted only when (a) no severe harm to outsiders, or (b) institutional role mandates it AND outsiders' basic rights aren't undermined. 

  *Tests on new arts center case* Mayor's choice: Funding local arts doesn't violate foreigners' basic rights (unlike tariffs causing poverty), but flood relief might save lives. If the foreign flood threatens survival (basic rights), partiality is impermissible. If it's about rebuilding infrastructure, maybe permissible... 

  *User's deeper need* They're likely wrestling with guilt about local privilege. The principle should validate their community commitments while constraining harm—so they can give to food banks without feeling obligated to maximize every dollar globally. 

  Final principle must condemn the tariff and ER bias, justify the cafe hire and disaster response, and for the university... probably lean toward accepting some partiality if refugee has other options, but not if they're truly desperate. Bite the bullet on donations being permissible but suboptimal.
answer: |-
  You've hit on one of the deepest tensions in ethics: the conflict between **special obligations** to our community and **universal duties** to humanity. Your intuitions are actually remarkably consistent with sophisticated philosophical frameworks. Let's build a principle step by step, using your cases as guideposts. Here's my reasoning:

  **Candidate Principles Brainstormed:**
  1. *Pure Cosmopolitanism:* "All moral patients deserve equal consideration regardless of nationality."  
     → *Problem:* Rejects all your partialist intuitions (#1, #3, #5, likely #6). You clearly don't hold this.

  2. *Strong Nationalism:* "Compatriots always come first."  
     → *Problem:* Violates your intuitions in #2 (tariffs) and #4 (ER doctor).

  3. *Institutional Role Ethics:* "Agents must prioritize based on their role: individuals may show partiality; institutions must be impartial."  
     → *Problem:* Too rigid. You think *governments* may favor locals in disasters (#3), but ER doctors (#4) should not.

  4. *Reciprocity-Based Partiality:* "We owe more to those with whom we share cooperative frameworks."  
     → *Problem:* Doesn't explain why needier foreigners (#1, #5) or refugees (#6) might still lose out.

  **The Winning Principle (Refined Through Your Cases):**  
  **"Permissible Partiality Principle":**  
  *Special obligations to compatriots are justified when:  
  (a) The partiality arises from genuine relationships or cooperative institutions; AND  
  (b) It does not violate fundamental rights or cause severe harm to outsiders; AND  
  (c) The agent's role permits contextual prioritization.*  

  ---

  ### **How the Principle Handles Your Cases:**
  1. **Cafe Hiring (#1):**  
     ✅ *Permitted:* Minor benefit to a local within a cooperative community (shared taxes, norms). No severe harm to the foreign applicant (they remain at baseline). Your role as cafe owner isn't impartial.

  2. **Tariff Vote (#2):**  
     ❌ *Forbidden:* Causes severe harm (deep poverty) to thousands. Violates (b). National loyalty doesn't override basic rights to subsistence.

  3. **Earthquake Response (#3):**  
     ✅ *Permitted:* Government's primary fiduciary duty is to its citizens (#c). No *intentional* harm to foreigners—omission isn't equivalent to active harm like tariffs. Meets (a) and (b).

  4. **ER Doctor (#4):**  
     ❌ *Forbidden:* Medical ethics demands impartiality based on need (#c). Citizenship is irrelevant to life-saving treatment. Violates (b) if the tourist dies due to delay.

  5. **Donations (#5):**  
     ✅ *Permitted:* Personal charity reflects relational ties (a). Not causing active harm (b)—omissions in charity rarely violate rights. Your role as private citizen allows discretion.

  6. **University Admission (#6):**  
     ⚠️ **Debatable, but leaning ❌ under this principle:**  
     - *Why it might seem like #3:* Public university is a state institution (a).  
     - *Why it fails:* The "harm" here (denying education to a brilliant refugee) could be severe if it traps them in poverty/violence (violating b). Education is a human right; states may prioritize locals, but not when it *actively excludes* someone in dire need where alternatives are nonexistent.  
     → **Verdict:** The refugee should get priority. Bites the bullet against your initial intuition.

  ---

  ### **Where I Bite the Bullet:**  
  I override your tentative approval of favoring the local kid in #6 (university admission). Why? The refugee’s potential harm (being denied life-changing opportunity without alternatives) outweighs the state’s interest in moderately benefiting a local student. This aligns with your tariff (#2) and ER doctor (#4) rejections of nationality-based harm.

  ---

  ### **New Case: Mayor Funding Local Arts vs. Foreign Flood Relief**  
  **Scenario:** A mayor must choose between funding a local arts center or sending the same money to a flood-ravaged region abroad where it could save lives.  

  **Application of Principle:**  
  1. **(a)** The arts center benefits the mayor’s community (cooperative relationship).  
  2. **(b)** Flood relief addresses *severe harm* (famine, displacement). Arts funding does not.  
  3. **(c)** The mayor’s role is primarily local, but universal human rights constrain local decisions.  

  **Verdict:** ❌ Funding arts is *impermissible*.  
  → **Why?** Active deprivation of lifesaving aid when alternatives exist violates (b). This mirrors the tariff case (#2)—prioritizing local interests while knowingly causing severe suffering abroad. The arts center is a luxury; flood relief is a necessity.

  ---

  ### **Key Insights from Your Intuitions:**
  - You intuitively distinguish between **active harm** (tariffs, ER bias) and **non-prioritization** (donations, earthquake). Our principle makes this explicit.  
  - **Scale matters:** Minor local benefits rarely justify major foreign harms.  
  - **Agency matters:** Individuals have wider latitude than institutions (unless those institutions exist to serve a specific group, like a state government).  

  This principle preserves most of your judgments while grounding them in defensible ethics. It accepts *moderate* partiality but draws a hard line at inflicting severe harm on outsiders for communal gain. If this challenges your view on university admissions, it’s because that case reveals a tension between community and humanity—one requiring moral courage to resolve.
