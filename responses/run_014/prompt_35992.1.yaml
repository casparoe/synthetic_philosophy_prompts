  For the shadow catalogue proposal, the ethical implications are radical. Cataloguing destruction would force archives to acknowledge that "collective memory" is curated through exclusion. But practical challenges loom: how to document the absence of records about groups never deemed worthy of documentation? The colonial archive contains prisoner records but not the lived experiences of prisoners - how do we catalogue that second-order absence?

