answer: |-
  Your query cuts to the heart of archival paradoxes. Let's dissect this layer by layer, distinguishing necessary presuppositions from comfortable assumptions and underdetermined spaces.

  **Brainstorming the Practices:**

  1.  **Appraisal & Destruction via Retention Schedules:**
      *   **Assumes:** Records have primarily *administrative value* tied to their creator's function and legal obligations. Future value is largely extrapolated from current bureaucratic needs ("continuing value"). Efficiency and manageability are paramount – archives cannot and *should not* keep everything. The creator (or its successor) is the primary legitimate arbiter of what constitutes "value" for its own records, at least initially. Destruction is not loss, but responsible management.
      *   **Implies but Doesn't Strictly Require:** That the state/institution is the primary legitimate source of societal memory and accountability evidence. That future historical or social needs can be adequately predicted by current bureaucratic logic. That destruction itself is a neutral, technical act.
      *   **Underdetermined/Problematic:** *Whose* administrative perspective dominates? Why are creators deemed reliable judges of their own records' long-term value? The criteria for "historical value" often remain vague and institutionally-biased. The scale of destruction creates an inherent power imbalance in what survives.

  2.  **Arrangement & Description from Creator's Perspective (Provenance & Original Order):**
      *   **Strictly Requires:** Respecting the *context* of creation is essential for understanding the record. Records derive meaning primarily from their function within the creating body. Maintaining the creator's intellectual structure preserves evidence of how the institution operated and made decisions. This is foundational to archival science (Provenance Principle, Respect des fonds).
      *   **Assumes/Sits Comfortably With:** The creator's context is the *most important* or *only legitimate* context for understanding the records. The subjects documented (prisoners, welfare recipients, etc.) are passive objects, defined solely by their relationship to the institution. The institutional perspective is sufficient for accountability and historical understanding.
      *   **Underdetermined/Problematic:** This *methodology* doesn't *inherently* deny other perspectives, but *in practice* it privileges the creator's viewpoint and makes accessing other perspectives (e.g., the subject's experience) extremely difficult without significant additional labor. It risks reifying the power structures embedded in the records. The "original order" often reflects bureaucratic convenience, not inherent logic.

  3.  **Community Documentation Projects & Mission Statements (Collective Memory, Accountability):**
      *   **Assumes:** Archives *should* represent diverse societal experiences. Marginalized voices are currently underrepresented. Archives have a social responsibility beyond serving the state. "Collective memory" is an aspiration achievable through deliberate collecting. Archives *can* be instruments of accountability for the state, implying they hold evidence *against* the state.
      *   **Implies but Doesn't Strictly Require:** A recognition that the traditional acquisition model (state records only) is insufficient for representing "collectivity." Archives have an active role in shaping memory, not just passively receiving it. Accountability requires evidence from *outside* the state apparatus.
      *   **Underdetermined/Problematic:** How does "collective memory" reconcile with the *massive selective destruction* inherent in Practice 1? How does privileging the creator's perspective (Practice 2) serve the *community's* need for accountability or representation? Is "collective memory" merely additive (state records + community records), or does it require a fundamental rethinking of the core holdings? The mission statements often feel aspirational or compensatory against the grain of core practices.

  **Reconstructing the Underlying Theory:**

  The combination of practices presupposes a **hybrid but fundamentally state-centric theory of the archive:**

  1.  **Primary Function: Institutional Continuity & Accountability (Limited):**
      *   The *core necessity* driving Practices 1 & 2 is preserving evidence of *how the state/institution functioned*. This serves administrative continuity (reference), legal evidence (rights protection), and a specific form of accountability: demonstrating that procedures were followed, decisions were made according to the rules *as they existed at the time*. This is accountability *within the system*, auditing its own operations.
      *   **Whose Memory?** Primarily the *institution's operational memory*. It preserves the *process* of governance and administration.

  2.  **"Collective Memory" as Aspirational Add-On:**
      *   Practice 3 and the mission statements graft on a different aspiration: the archive as a repository of *societal* memory and a tool for *broader societal accountability* (holding power to account from the outside).
      *   **The Tension is Real:** This aspiration fundamentally *clashes* with the core logic.
          *   **Appraisal (1):** Systematic destruction based on creator-defined schedules inherently excludes perspectives deemed irrelevant to administrative function. It silences voices and experiences not captured by bureaucratic processes. This directly contradicts "collective memory."
          *   **Description (2):** Privileging the creator's viewpoint makes it difficult, if not impossible, to use the records effectively to challenge the institution *from the outside* or to recover the lived experience of the documented subjects. The structure reinforces the institution's framing.
      *   **Underdetermined Space:** The archive doesn't *have* to resolve this tension. It can hold both ideas: its *core* is institutional record-keeping for administrative/limited accountability purposes, and community archiving is a *separate*, supplementary activity addressing a different need (representation). This avoids incoherence but creates a jarring dissonance. The mission statements gloss over this disconnect.

  **The Shadow Catalogue: A Transformative Idea?**

  Your "shadow catalogue" (or "archival absences register") is a powerful conceptual tool to expose the inherent biases and power dynamics embedded in Practices 1 & 2.

  1.  **Impact on Presuppositions:**
      *   **Challenges Neutrality of Appraisal/Destruction:** Cataloging omissions/destructions forces explicit acknowledgment that appraisal is *not* neutral technical management, but *value-laden selection* (and de-selection) that reflects institutional priorities and power structures. It makes the "pattern of omission" itself a primary record.
      *   **Reframes the Archive's Scope:** The archive becomes responsible not just for *what it holds*, but for documenting *what it doesn't hold and why*. Its purview explicitly includes the *processes of exclusion*.
      *   **Shifts Accountability Dramatically:** Yes, the accountability function *must* extend to the record of destruction. The "shadow catalogue" becomes crucial evidence for:
          *   Holding the archive itself accountable for its appraisal decisions.
          *   Holding the *creating institutions* accountable for *what they chose to destroy* (often more revealing than what they kept) and for the inherent biases in what they created/documented in the first place.
          *   Demonstrating systemic patterns of neglect or silencing of specific communities or experiences. (e.g., "The archive holds no records from Agency X concerning Group Y between 1950-1970; retention schedules prioritized administrative reports over case files during this period").
      *   **Redefines "Collective Memory":** The archive can no longer claim to simply "guard collective memory" without simultaneously acknowledging, through the shadow catalogue, *which parts of the collective it systematically excluded* and *why*. Collective memory becomes explicitly fractured and contested, with the archive documenting both presence and absence.

  2.  **Practical and Philosophical Challenges:**
      *   **Documenting Absence:** How do you rigorously document something that *never existed* in the record? How do you capture the experiences of people or groups entirely outside the state's bureaucratic gaze? The shadow catalogue might primarily document *destruction* and *non-acquisition* of *potential* institutional records, but capturing broader societal absence is harder.
      *   **Causality:** Attributing *why* something is absent is complex. Was it never created? Destroyed immediately? Appraised out? Not offered? The shadow catalogue would need sophisticated contextual metadata.
      *   **Scale & Specificity:** The scale of omission is vast. Could this be feasible? Would it risk becoming another bureaucratic exercise, or could it be meaningfully accessible?
      *   **Institutional Will:** Implementing this requires archives to radically confront their own role in power structures and their complicity in silencing. It's a profound ethical shift, not just a technical one.

  **Conclusion:**

  The standard practices presuppose an archive whose *essential function* is preserving and contextualizing the *operational memory of state/institutional power* for purposes of administrative continuity and internal accountability. This inherently privileges the creator's perspective and necessitates massive, selective destruction. The "collective memory" and broad accountability missions are laudable aspirations grafted onto this core, creating significant, unresolved tension.

  Your "shadow catalogue" idea directly attacks the comfortable assumptions underpinning Practices 1 & 2. By forcing the archive to document its own omissions and the patterns of destruction, it would fundamentally shift its presuppositions:

  1.  **From Neutral Custodian to Self-Critical Documenter:** Acknowledging its active role in shaping (and limiting) the historical record.
  2.  **From State Memory to Critic of State Memory:** Making the processes of state record creation, selection, and destruction themselves objects of scrutiny and accountability.
  3.  **From Aspirational Collective Memory to Documented Fragmentation:** Explicitly showing *what* is missing from the "collective" picture and *why*, transforming the archive into a site that records both presence *and absence*, power *and its silences*.

  This wouldn't eliminate the core function of preserving institutional context (Practice 2 remains crucial for understanding *how* power operated via its records). However, it would force a profound reckoning with the implications of Practice 1 and demand that the lofty mission statements be operationalized in a way that directly confronts the archive's inherent biases and limitations. The archive would become, in part, the archivist of its own silences.
