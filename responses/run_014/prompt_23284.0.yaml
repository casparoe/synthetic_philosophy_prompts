  Hmm, this actually makes perfect sense from a neuroscience perspective. The key here is understanding that vision isn't just about eyes working - the brain needs to learn how to interpret visual information. Their friend's eyes are physically functional (she can see details well enough to recognize faces), but her visual cortex has zero experience processing shape information. 

  I recall that famous case of Sidney Bradford... the man who gained sight at 52 and could read clocks immediately (since he'd worked with them tactily) but couldn't visually distinguish triangles from squares. Exactly like this coffee mug versus metal ball situation! The mug is familiar through years of touch/memory association, but novel shapes are... well, novel. 

  The user seems both concerned ("is something wrong?") and intellectually curious. They're observant to notice this nuance. Their phrasing "turning this over in my head" suggests genuine fascination. Probably wants both reassurance about their friend's health and a deeper understanding of perception. 

