answer: |-
  What you're witnessing is a fascinating and well-documented phenomenon in neuroscience and philosophy of perception. **There is almost certainly nothing wrong with your friend's vision.** Her eyes are functioning correctly, as evidenced by her ability to recognize faces and objects she knew *tactilely* before sight. The issue lies in how her *brain* interprets brand-new visual information about shape.

  Here's the breakdown of the explanation:

  1.  **Vision is More Than Just Eyes:** Seeing isn't passive reception of light. It's an active process of the brain interpreting complex patterns of light, shadow, color, and motion to construct meaningful representations of the world. This interpretation is learned through experience.

  2.  **The "Binding" Problem:** Your friend spent her entire life learning about the world primarily through touch, sound, smell, and proprioception (sense of body position). Her brain built incredibly rich representations of objects (like your face, her mug) using these senses.
      *   When she gained sight, her brain suddenly received a massive influx of completely new data (visual signals).
      *   **The key challenge:** Her brain hasn't yet learned to reliably *bind* or *associate* the specific *visual patterns* it receives (e.g., the particular arrangement of light, shadow, and edges that define "roundness" visually) with the *tactile concepts* she already knows intimately (e.g., the smooth, continuous, curved feel of "roundness").
      *   She *knows* what round feels like, but she doesn't yet know what round *looks like* in a way that connects directly to that tactile knowledge.

  3.  **Recognition vs. Novel Shape Perception:**
      *   **Recognizing You & Her Mug:** She recognized *you* and *her mug* because she had incredibly strong, pre-existing tactile/auditory/contextual memories associated with those specific objects. Her brain could use the *whole pattern* of your face or her mug (which includes size, color, texture, context, maybe slight familiarity with general human form from touch) to trigger that stored memory and say "Yes, that's my friend/mug!" It's a holistic match based on prior multi-sensory knowledge, not an analysis of isolated geometric features.
      *   **Distinguishing Novel Ball vs. Cube:** The ball and cube were completely novel objects presented purely visually. Their only distinguishing feature at that moment was their geometric shape. Her brain had:
          *   No pre-existing visual memory for these objects.
          *   No learned association between the *visual pattern* of a smooth, continuous curve with highlights/shadows (sphere) and the *tactile concept* of roundness.
          *   No learned association between the *visual pattern* of straight edges, sharp corners, and flat planes (cube) and the *tactile concept* of squareness/corneredness.
      Her visual system was sending raw data ("light areas here, dark areas here, edges here"), but her higher cognitive systems couldn't interpret *what that pattern meant* in terms of shape she could feel. It was visual gibberish in terms of shape identification.

  4.  **Visual Agnosia (Specifically Form Agnosia or Integrative Agnosia):** While your friend doesn't have brain damage, her situation shares similarities with a neurological condition called **visual agnosia**. People with visual agnosia can *see* (their eyes work), but their brain cannot *recognize* or *interpret* what they see. One type is **form agnosia**, where people struggle to perceive shapes or copy drawings, even though they might navigate around objects (using the "where" pathway in the brain). Your friend is effectively experiencing a *developmental* or *experiential* form agnosia for novel shapes – her brain hasn't yet developed the neural pathways needed to interpret shape from vision alone.

  5.  **Molyneux's Problem:** Your observation directly mirrors a famous philosophical question posed by William Molyneux to John Locke in 1688: *If a man born blind, who learned to distinguish a globe and a cube by touch, suddenly gained sight, could he visually distinguish which was which without touching them?* Modern neuroscience and cases like your friend's strongly suggest the answer is **No**, at least not immediately. The visual and tactile concepts of shape are distinct and require learned association.

  6.  **Different Neural Pathways:** Neuroscientists know that recognizing faces, navigating space, guiding actions (like pouring water), and identifying object shapes rely on somewhat distinct neural pathways in the brain ("what" vs. "where/how" pathways). Your friend's ability to pour water without spilling demonstrates her brain is quickly learning to use visual information for **action guidance** (dorsal stream - "how"), which seems to develop faster. Recognizing *what* something *is* (ventral stream - "what"), especially abstract properties like geometric shape, takes longer to learn and associate with other senses.

  **Conclusion:**

  Your friend's vision is working fine physically. The challenge is entirely **cognitive and developmental**. Her brain is undergoing an immense learning process. It needs time and experience to:

  *   **Learn** the visual "language" of shapes, edges, shadows, and perspective.
  *   **Associate** these specific visual patterns with the tactile concepts she already possesses.
  *   **Build** the neural connections that allow the tactile concept "round" to be triggered *directly* by the visual pattern of a sphere, bypassing the need for touch.

  This process takes months and years. Her ability to recognize familiar people and objects is a huge step and shows progress. Her inability to name the shape of a novel object is completely normal and expected at this stage. Be patient and supportive – she's essentially learning to see the world from scratch, even though her eyes are functional. There's nothing wrong; her brain is just doing the incredible work of integrating a whole new sense into her existing model of the world.
