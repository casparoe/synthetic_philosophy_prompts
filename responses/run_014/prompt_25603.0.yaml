answer: |-
  Here's a systematic map of potential defeaters for the Pessimistic Meta-Induction (PMI), categorized by their strength and plausibility, addressing your specific queries:

  ### Fatal Defeaters (PMI Fundamentally Undermined)
  1.  **Current Theories Survive Indefinitely Without Radical Ontological Revision:** If our *core, mature* theories (e.g., Quantum Field Theory, General Relativity, Standard Model of Particle Physics) achieve permanent status, explaining all phenomena within their domains *without* being overthrown by radically different ontologies (e.g., no replacement discarding fields/particles/spacetime curvature for something unrecognizable), PMI's inductive basis collapses.
      *   **World Required:** Physics reaches a stable "final theory" framework where new discoveries fit existing ontological categories via refinement, not revolution.
      *   **Plausibility:** Highly contested. GR/QM are remarkably stable and broad, but unification (quantum gravity) remains elusive and could be revolutionary. **Live, but uncertain.**
      *   **PMI Defender's View:** Would dismiss as premature; history suggests revolutions are inevitable over long enough timescales. Conceding this *would* fatally wound PMI.

  2.  **Demonstrable Causal Chain to Truth:** If we could establish a clear, necessary link *from* the specific empirical success of past theories *to* the falsity of their core ontologies, showing why success *required* falsehood, it would break the inductive link. PMI assumes success is compatible with radical falsehood; showing success *depended* on falsehood would make past failures irrelevant for predicting the fate of *accurately* successful theories.
      *   **World Required:** A deep epistemological principle or historical analysis proving that (e.g.) Ptolemy's epicycles *had* to be false to successfully predict planetary positions, or phlogiston *had* to be false to explain combustion phenomena as it did.
      *   **Plausibility:** Highly implausible. Selective realists argue the *opposite*: success often depended on *aspects* that were *approximately true* (e.g., chemical affinities in phlogiston theory). **Logically possible, but historically unsupported and unlikely.**
      *   **PMI Defender's View:** Would vigorously contest, arguing success was achieved *despite* core falsehoods, not *because* of them.

  ### Significant Defeaters (PMI Seriously Weakened)
  3.  **Widespread Selective Survival of Past Ontology:** If the "divide-et-impera" strategy proves overwhelmingly successful – showing that the *specific entities/structures responsible for past theories' success* are largely preserved in current theories (e.g., Dalton's atoms, Fresnel's light waves/periodicity, Mendeleev's elements/periodicity) – then PMI's "radically false" characterization becomes inaccurate. Past theories weren't *wholly* false; their successful cores endured.
      *   **World Required:** Careful historical analysis consistently reveals referential continuity or structural isomorphism for the *working posits* behind key predictions in major past theories.
      *   **Plausibility:** **Live and strong.** Much selective realist scholarship aims precisely at this. Critics argue continuity is often retrospective and not always clear-cut (e.g., ether vs. spacetime/fields).
      *   **PMI Defender's View:** Would concede this weakens *naive* realism but argue PMI still applies to *non-selective* realism and that the *overall theoretical framework* was still discarded. Might argue selective continuity is overstated or contingent.

  4.  **Radical Theory Turnover Ceases:** If the pace of fundamental ontological revolutions dramatically slows down, and current theories show unprecedented longevity and resilience across expanding domains, the historical sample becomes less relevant for induction.
      *   **World Required:** Centuries pass without a revolution displacing the core ontology of GR/QM/SM, even as new phenomena are explained within or by extending them.
      *   **Plausibility:** **Live.** GR/QM/SM have dominated for ~100 years with immense explanatory breadth – far exceeding, say, the reign of the caloric theory. The stability is notable.
      *   **PMI Defender's View:** Would argue 100 years is too short, pointing to the millennia-long stability of Aristotelian physics before its fall. Might predict imminent revolution (e.g., from quantum gravity).

  ### Awkward Defeaters (PMI Less Compelling, But Not Refuted)
  5.  **Quantifiable Increase in Theory Stability/Approximation:** If a rigorous account shows a measurable trend of increasing ontological stability and approximate truth retention across theory transitions, PMI's flat induction from all past failures becomes simplistic.
      *   **World Required:** A defensible metric for "ontological stability" or "approximate truth" that shows a clear upward trend through scientific history.
      *   **Plausibility:** **Conceptually challenging, but live attempts exist** (e.g., structural realists on equations/invariants). Hard to quantify ontology directly.
      *   **PMI Defender's View:** Would question the metric and argue any perceived trend is illusory or temporary; past scientists likely felt equally confident.

  6.  **Explaining Past Failures Differently:** Providing compelling, non-realist explanations for why *specific* past theories succeeded despite falsity (e.g., instrumental efficacy within limited domains, sociological factors, mistaking model for reality) that don't generalize strongly to current theories.
      *   **World Required:** Convincing case studies showing past success was largely due to factors *other* than ontological accuracy, factors less applicable to modern, mature, rigorously tested theories.
      *   **Plausibility:** **Live.** Historical work often highlights these factors. However, PMI can absorb this by arguing these factors *still operate* today.
      *   **PMI Defender's View:** Would argue these factors *do* still apply and are sufficient to explain current success without realism.

  ### Insulation and Unfalsifiability
  PMI defenders often insulate it:
  *   **"Maturity" Clause:** PMI only applies to theories *we now deem mature*. Critics argue this is retrospective and question the criterion.
  *   **"Radical" Revolution:** Only future theories *radically* different in ontology count. What counts as "radical" can be stretched.
  *   **Long Timescales:** Revolutions might take centuries.

  **Is this a problem?** For a meta-induction based on historical interpretation, absolute falsification is difficult. Insulation risks making PMI non-empirical. However, defenders argue it's meant as a *defeasible challenge*, not a deductive proof. Fatal Defeater #1 (permanent stability) *would* empirically falsify it over sufficient time. Significant Defeaters #3 and #4, if borne out, make PMI progressively less compelling without making it formally false.

  **Regarding your quasiparticles:** PMI is weakest against *ontologically conservative* posits. Quasiparticles (e.g., phonons, excitons) are *emergent phenomena* rigorously derived from fundamental physics (QM, SM) known to apply to their substrates. Their "reality" is of a different, effective order than positing fundamental new stuff like phlogiston. Topological structures are mathematical features of our best physical models with immense predictive power. While *all* science is fallible, the PMI's historical parallels to these aspects of condensed matter theory are arguably less direct and compelling than the realist fears it initially provokes. The stability and fundamental grounding of the underlying theories provide significant insulation *from* the PMI's strongest bite.
