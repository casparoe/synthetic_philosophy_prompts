prompt: |-
  I teach a grad seminar on chance and time, and every year for the last session I put one deliberately bad argument on the board and make the students find the crack in it. This year the argument backfired: I can't find the crack myself, and one of the students has started defending the conclusion. Here it is, cleaned up but with the structure I actually used. Let C be a rational credence function, let X be the proposition that the chance of A at time t is x, and let E be whatever else the agent knows:

  1. The Principal Principle says: if E is admissible, then C(A | X ∧ E) = x.
  2. Admissible evidence, as I gloss it for the class, is evidence that tells you nothing about A over and above what the chance already tells you. The paradigms are evidence about the physical set-up of the chance process, and evidence about the past.
  3. The outcomes of a chance process up to time t are evidence about the past.
  4. So the observed relative frequency up to t is admissible. Take a coin you're certain is fair, chance of heads 0.5, and suppose you've just watched a run of 100 heads. Then C(heads on flip 101 | X ∧ F) = 0.5, where F is the proposition recording the run.
  5. Generalize: so long as you're certain of X, no finite body of frequency data from that very process can move your credence about the next trial off x. The Principle plus certainty about the chance is frequency-blind by construction.
  6. But a principle that makes it rationally required to disregard all frequency evidence from the process it governs is not a guide to life, which is precisely what Lewis wanted chance to be. And (5) doesn't even look like a fact about chance: if I'm certain the die is loaded 0.6 toward six, no run of non-sixes should move me either, and nobody thinks that's a deep discovery about dice. So the Principle isn't doing the work its fans claim for it.
  7. Therefore either the Principle is false, or certainty about chances is never available to us, or chance isn't a guide to life after all.

  My student's line, and the part I couldn't answer at the board: you wrote the certainty into (1) and (4) yourself, so you can't turn around and complain about what certainty licenses. If the Principle is a constraint on credence conditional on a chance hypothesis, its job was never to tell you how to respond to evidence that bears on which chance hypothesis is right, and (5) is a true theorem about a conditional you chose to set up rather than an indictment of it. Another student, who comes over from the statistics department, said it was just the old point that a likelihood is not a posterior, and I said that's a slogan and not an argument, and we went around in circles for twenty minutes. My own instinct is that (2) or (3) is the weak link — surely a long run of heads isn't merely evidence about the past, it's evidence about the chance — but I can't articulate why that isn't just begging the question against the Principle, since the whole point of (2) is to sort admissible from inadmissible evidence. So I'm not sure whether the argument is invalid, and if so exactly which step does the work, or valid with a conclusion I have to swallow.

  Two follow-ups I'd want folded into the diagnosis. First, what happens if you swap in the version Lewis moved to later, where the constraint lands on your unconditional credence in A and it's supposed to equal your expected chance — a weighted average over the competing chance hypotheses, weighted by your credence in each? Does that dissolve (5), or just relocate it one level up? Second, is there a leftover problem about chance functions that get shifted by the very evidence that would move your credence in them, and does the Humean part of the story end up load-bearing for whichever diagnosis you give, or can a non-Humean about chance dodge it?

  Please don't split the difference and don't hedge at me. Tell me which step you'd reject, how confident you are that it's the load-bearing one rather than a merely dispensable one, and what rejecting it costs — including whether it forces you to give up something attractive about the past being admissible, or to concede that admissibility is defined circularly (E is admissible just in case conditionalizing on it leaves your chance-conditional credence where the Principle puts it, which makes the Principle true by stipulation and unable to fail). Flag any place where you're leaning on a contested reading of Lewis rather than on anything he clearly says. And if you think my framing is broken — if there's no single thing worth calling the Principal Principle, or (2) is a bad enough gloss that (3) through (7) never get off the ground, or (6) is doing something illegitimate I'm not seeing — say so plainly instead of giving me a diplomatic walkthrough. I'd much rather be told the seminar exercise is broken in advance than watch it blow up in front of the room a second time.
reasoning: |-
  We are given an argument that purports to show a problem for the Principal Principle (PP). The argument concludes that either the PP is false, or certainty about chances is never available, or chance isn't a guide to life. The student defends the PP by pointing out that the argument builds in certainty about the chance and then complains about what that certainty implies. We are to find the crack in the argument.

  The argument steps:

  1. The Principal Principle: If E is admissible, then C(A | X ∧ E) = x, where X is "the chance of A at t is x" and E is admissible evidence.

  2. Admissible evidence is glossed as evidence that tells you nothing about A over and above what the chance already tells you. Paradigms: evidence about the physical set-up and about the past.

  3. The outcomes of a chance process up to time t are evidence about the past.

  4. Therefore, observed relative frequency up to t is admissible. Example: a fair coin (chance 0.5) and a run of 100 heads. Then C(heads on flip 101 | X ∧ F) = 0.5, where F records the run.

  5. Generalization: if you are certain of the chance hypothesis X, then no finite frequency data from the process can move your credence about the next trial off x.

  6. But such a principle (that requires disregarding frequency evidence) is not a guide to life, and (5) doesn't look like a deep fact about chance. So the PP isn't doing the work it's supposed to.

  7. Therefore, either the PP is false, or certainty about chances is never available, or chance isn't a guide to life.

  The student's rebuttal: The argument assumes certainty about the chance (in steps 1 and 4) and then complains that under certainty, frequency evidence doesn't matter. But the PP is a constraint conditional on a chance hypothesis. It doesn't tell you how to update your credence in the chance hypothesis itself. So (5) is a true consequence of the setup but not an indictment of the PP.

  The statistics student says: "a likelihood is not a posterior" — meaning that the PP gives a conditional credence (a likelihood in a sense) but not the posterior credence when you are uncertain about the chance.

  The instructor's instinct: step 2 or 3 is the weak link — the run of heads is not merely about the past but also about the chance. But why isn't that begging the question?

  Analysis:

  The key issue is that the run of heads (F) is not admissible when we are conditioning on X (the chance is 0.5) because F does provide information about A (the next flip) beyond what the chance alone provides? But the chance of 0.5 already tells us that the coin is fair, so how can a run of heads be informative about the next flip? It shouldn't be if the coin is fair. However, the run of heads might make us doubt that the coin is fair, but in this setup, we are conditional on X (the coin is fair). So conditional on the coin being fair, the run of 100 heads is just a fluke and doesn't change the probability of the next flip.

  But the problem is that in reality, when we see 100 heads, we doubt the coin is fair. So the issue is that we are not actually certain about X. The PP, as stated in step 1, requires admissibility of E. The argument in step 4 claims F is admissible because it's about the past. But is F admissible when we are conditional on X?

  Lewis's admissibility: E is admissible relative to (A, t) if E does not contain information about A that is not already contained in the chance at t. In the fair coin case, conditional on X (chance of heads is 0.5), the run F is just a sequence of independent events. So F is admissible? Because given X, the chance of A is fixed and independent of the past outcomes. So conditional on X, F doesn't tell us anything about A that we don't already know from X. Therefore, F is admissible. So step 4 is correct: C(A | X ∧ F) = 0.5.

  But then step 5 is also correct: if we are certain about X, then no frequency data (from the same process) can move our credence about the next trial. However, step 6 then objects that this makes the PP frequency-blind and hence not a guide to life. But the PP is not meant to be applied under certainty about the chance when we have evidence that should make us doubt that chance. The PP is a constraint on conditional credences, but it does not tell us how to update our credences over chance hypotheses.

  Therefore, the crack is in step 6: the PP is not requiring us to disregard frequency evidence when we are not certain about the chance. The PP, in its conditional form, only applies when we are conditional on a chance hypothesis. When we get frequency data, we should update our credences about the chance hypotheses. The PP does not prevent that.

  In fact, the PP in its original form is consistent with updating on frequency data to change our credences about the chance. For example, if we are not certain about the chance, then we have a prior over possible chance hypotheses. When we see frequency data, we update our credences on the chance hypotheses using Bayes' theorem. Then, for the next trial, we set our credence to the expected chance (which is the weighted average of the chances, weighted by our posterior credences). This is exactly what the later version of the PP (the New Principle) does.

  So the argument's mistake is in step 6: it conflates the conditional constraint (which holds under a fixed chance hypothesis) with the overall updating procedure. The PP does not require disregarding frequency evidence; it only requires that conditional on a chance hypothesis, we set our credence to the chance. But when we have frequency evidence, we use it to update which chance hypothesis we believe.

  Therefore, the argument fails because it misrepresents the Principal Principle as requiring us to ignore frequency evidence even when we are uncertain about the chance, but the Principle only applies conditionally.

  Now, the follow-ups:

  First, what if we swap in the later version (the New Principle)? The New Principle says that your unconditional credence in A should equal your expectation of the chance of A. That is, C(A) = ∑ ch C(ch), where the sum is over chance hypotheses and C(ch) is your credence that the chance is ch.

  In this version, we don't condition on a specific chance hypothesis. Instead, we set our credence in A to the expected chance. Now, when we get frequency data F, we update our credences over the chance hypotheses (so C(ch) becomes C(ch | F)) and then set C(A | F) = the new expected chance.

  In the fair coin example, if we start with certainty that the chance is 0.5, then our credence in heads is 0.5. After seeing 100 heads, if we remain certain that the chance is 0.5, then our credence in the next heads is still 0.5. But if we are not certain, and we have a prior that allows other chances, then the run of heads will increase our credence in higher chances of heads, and so our expected chance (and hence our credence in the next heads) will be greater than 0.5.

  So the New Principle does not dissolve (5) in the case of certainty: if we are certain of the chance, then no frequency data moves our credence for the next trial. But the New Principle does not require certainty. In the uncertain case, it allows frequency data to move our credence. So the issue of certainty remains: if we are certain, then we are stuck. But the argument in step 6 claims that a principle that requires disregarding frequency evidence is not a guide to life. The New Principle does not require disregarding frequency evidence when we are uncertain. And if we are certain, then by definition we have no evidence that moves us — but that is a problem of dogmatism, not of the chance concept.

  The second follow-up: is there a leftover problem about chance functions that get shifted by the evidence? This is the problem of undermining futures for Humeans. But the issue here is not specifically about Humeanism. The problem in the argument arises only under certainty about the chance, which we typically don't have. So for non-Humeans, they can say that we are never certain about chances, and that the chance is a primitive that doesn't depend on the frequencies in a way that would allow undermining. So they can dodge the problem by denying certainty. For Humeans, they have the New Principle to handle undermining, but the issue of certainty is independent.

  Diagnosis:

  The crack is in step 6. The argument misconstrues the Principal Principle. The PP, in its conditional form, does not require that we disregard frequency evidence in general; it only requires that when we condition on a particular chance hypothesis, we set our credence accordingly. The frequency evidence is used to update our credences over the chance hypotheses. Therefore, the PP does not forbid learning from frequencies; it only tells you what to do once you have fixed a chance hypothesis.

  Step 5 is true: if you are certain about the chance, then frequency data won't move your credence for the next trial. But that is a feature of certainty, not of the PP. And the PP does not require certainty. So step 6 is wrong to claim that the PP makes it rationally required to disregard frequency evidence. It does not: it only requires that conditional on the chance, you set your credence to that chance. But when you get frequency evidence, you should update your credences about the chance. The PP does not constrain how you update your credences over chance hypotheses (except that they must be updated in a way that respects the admissibility conditions when conditioning on a chance).

  Therefore, the argument is invalid because step 6 does not follow from the previous steps. The flaw is in the inference from step 5 to step 6.

  Confidence: I am very confident that this is the load-bearing flaw. Rejecting step 6 does not cost anything because step 6 is a misinterpretation of the PP. The attractive features of admissibility (the past being admissible) are preserved because in the conditional setting (given a chance hypothesis) the past is indeed admissible.

  Circularity: The definition of admissibility is not circular in a vicious way. Lewis defines admissibility in terms of the kind of evidence (e.g., about the past) and then the PP uses that to constrain credences. We don't define admissibility as "whatever makes the PP hold" but by independent criteria (like being about the past). So the PP is a substantive constraint.

  Framing: The framing is not broken. The exercise is good because it highlights the role of certainty and the conditional nature of the original PP. The crack is that the argument conflates conditional constraints with unconditional updating.

  Final answer: Reject step 6. The Principal Principle does not require disregarding frequency evidence when we are uncertain about the chance. It only requires that conditional on a chance hypothesis, we set our credence to the chance. The frequency evidence is used to update our credences about which chance hypothesis is true. Therefore, the PP is still a guide to life because it tells us how to set our credences given our beliefs about chances, and we can use frequency evidence to update those beliefs.
answer: |-
  Your argument is cleverly constructed, but it contains a critical flaw in **step 6**, and this flaw is the load-bearing crack that collapses the entire argument. I am highly confident (95%+) that this is the core issue, not a secondary or dispensable one. Below, I'll dismantle the argument step by step, explain why step 6 fails, address your follow-ups, and clarify the implications. I'll be blunt and avoid hedging, as requested.

  ### Step-by-Step Diagnosis
  1. **Steps 1–4 are technically correct** (within the framework of Lewis's original Principal Principle):  
     - The Principal Principle (PP) in its classic form is a constraint on rational credence *conditional* on a specific chance hypothesis \(X\) (e.g., "the chance of \(A\) is \(x\)") and admissible evidence \(E\).  
     - Your gloss on admissibility (step 2) is faithful to Lewis: evidence about the physical setup or the past is admissible because it doesn't provide "news" about \(A\) beyond what the chance already implies.  
     - Step 3 is unobjectionable: outcomes of a chance process before \(t\) are indeed evidence about the past.  
     - Step 4 follows: conditional on \(X\) (e.g., a coin is fair) and \(F\) (a run of 100 heads), \(C(A \mid X \land F) = x = 0.5\) because \(F\) is admissible (it's past evidence, and conditional on \(X\), it doesn't affect the future chance).

  2. **Step 5 is also correct, but trivial**:  
     - If you are *certain* of \(X\) (the chance is exactly \(x\)), then no finite frequency data \(F\) can alter your credence about the next trial. This is a direct consequence of the PP's conditional structure.  
     - However, this is not a deep insight about chance—it's a basic feature of *conditional probability*. When you fix \(X\) as a condition, \(F\) becomes irrelevant to \(A\) because \(X\) screens off \(F\) (assuming independence, as in the coin example). The statistics student was right: this is just "a likelihood is not a posterior." It’s a theorem, not a problem.

  3. **Step 6 is where the argument fails catastrophically**:  
     - You claim: "A principle that makes it rationally required to disregard all frequency evidence ... is not a guide to life." This misrepresents the PP.  
     - **The flaw**: The PP does **not** require disregarding frequency evidence *when you are uncertain about the chance*. It only applies *after* you've conditioned on a specific chance hypothesis. Frequency evidence is meant to update your credences *across* competing chance hypotheses—not to be ignored under certainty.  
     - **Why this misstep is fatal**: Your argument conflates two distinct roles of evidence:  
       - **Within** a conditional credence (governed by PP): Here, \(F\) is admissible and doesn't affect \(C(A \mid X \land F)\) because \(X\) is fixed.  
       - **Updating credences over chance hypotheses**: Here, \(F\) *should* affect your belief in \(X\) itself (e.g., 100 heads makes you doubt the coin is fair). The PP says nothing about this—it doesn't constrain how you form or update credences about chances.  
     - **Consequence**: The PP *is* a guide to life because it tells you how to set credences *given* your beliefs about chances. When uncertain, you use frequency evidence to update those beliefs (e.g., via Bayes' theorem), then apply the PP to your new conditional credences. Disregarding frequency data only happens under dogmatic certainty—which the PP doesn't require or endorse.  
     - **Analogy**: Complaining that \(C(A \mid X \land F) = x\) ignores \(F\) is like complaining that \(C(\text{rain} \mid \text{sky is blue}) = 0.1\) ignores dark clouds. But the whole point of conditioning is to isolate scenarios; dark clouds belong in updating your belief about the sky, not inside the condition.

  4. **Step 7 doesn't follow**:  
     - Since step 6 is invalid, the trilemma (PP false / no certainty / chance not a guide) is unsupported. The PP survives unscathed.

  ### Why Your Instinct About Steps 2–3 is Misguided
  - You suspected step 2 (admissibility gloss) or step 3 (outcomes as past evidence) might be weak. But this is a red herring.  
  - In the coin example, \(F\) *is* admissible *relative to \(X\)* because conditional on a fair coin, past outcomes don't affect future chances. If \(F\) were evidence about the chance (e.g., it made you doubt \(X\)), that would make it *inadmissible for updating credences over \(X\)*, but the PP doesn't govern that. Admissibility here is defined relative to fixed \(X\), not globally.  
  - Rejecting step 2 or 3 would beg the question and undermine Lewis's clear intent (e.g., in *Philosophical Papers Vol. II*, he explicitly calls past evidence admissible). The real issue is step 6's overreach.

  ### Follow-Up 1: What About Lewis's New Principal Principle?
  - **The New Principle (NP)** replaces conditional credences with unconditional ones: \(C(A) = \sum \text{ch}(A) \cdot C(\text{ch})\), where you average over chance hypotheses weighted by your credence.  
  - **Does it dissolve (5)?** No—under *certainty* about \(\text{ch}(A) = x\), it reduces to \(C(A) = x\), so frequency data still doesn't move your credence for the next trial. But this is the same non-problem as before.  
  - **Does it relocate the issue?** Yes, but harmlessly:  
    - **Under uncertainty**: NP handles frequency evidence gracefully. After seeing 100 heads, you update \(C(\text{ch})\) (e.g., shift credence toward higher chances of heads), then set \(C(A)\) to the new expected chance. Frequency data directly affects your credence about \(A\)—no disregard.  
    - **The lesson**: NP *reinforces* that the flaw is in step 6. Certainty locks your credences; NP doesn't change that. But NP shows the PP isn't to blame—it's your epistemic state (certainty) that causes trouble.  
  - **Verdict**: Your argument's core error is unchanged. NP is a red herring here.

  ### Follow-Up 2: Do Humean Chance Functions Cause Trouble?
  - **Humeanism**: For Humeans, chances supervene on patterns in events (e.g., frequencies), so a long run of heads *could* undermine the chance hypothesis itself (e.g., making "chance = 0.5" false). But this isn't a "problem" for the PP—it's a feature.  
    - In your setup, if \(F\) undermines \(X\), then \(F\) is *inadmissible relative to \(X\)* (it carries information about chances beyond \(X\)). But again, the PP only applies if \(E\) is admissible. If inadmissible, the PP doesn't constrain \(C(A \mid X \land E)\).  
    - Lewis's New Principle was designed to fix Humean undermining, but it doesn't save your argument. Even under NP, if you're *certain* of \(X\), undermining evidence won't move you. But certainty is the culprit, not Humeanism.  
  - **Non-Humeans** (e.g., primitivists) dodge undermining: chances aren't reducible to frequencies, so \(F\) doesn't threaten \(X\) directly. But they *also* face the certainty issue. If you're certain of a primitive chance, no frequency data moves you.  
  - **Key point**: The flaw in your argument is independent of metaphysics. It's about **epistemology**: the PP doesn't enforce certainty or forbid updating on frequencies. Humeanism vs. non-Humeanism is irrelevant to the crack in step 6.

  ### Costs and Implications of Rejecting Step 6
  - **Cost to your argument**: None. Step 6 misrepresents the PP, so rejecting it doesn't weaken Lewis's view.  
  - **Cost to Lewis's framework**: Zero. You keep admissibility (past evidence is still admissible) without circularity. Admissibility isn't defined as "whatever makes PP true" but by substantive criteria (e.g., temporal or logical grounds). Circularity worries arise only if you define admissibility *solely* by the PP—but Lewis doesn't.  
  - **Broader lesson**: The exercise isn't broken—it's pedagogically valuable. It exposes a common confusion: mistaking conditional constraints for unconditional norms. Your seminar didn't backfire; it succeeded in surfacing this nuance. Next time, hammer step 6: "The PP constrains your beliefs *given* a chance hypothesis; it doesn't tell you how to *get* that hypothesis. Frequency evidence is for the latter."

  ### Final Answer
  - **Reject step 6** with high confidence. The Principal Principle does not require disregarding frequency evidence; it only requires that *conditional on a chance hypothesis*, your credence matches the chance. When uncertain, you *should* use frequency data to update your beliefs about chances, then apply the PP.  
  - **Why the student is wrong**: Defending (5) is fine—it's true under certainty—but it doesn't indict the PP. The student missed that step 6 is a non sequitur.  
  - **What to tell your class**: "The argument's crack is in step 6. The PP isn't frequency-blind—*you* blinded it by assuming certainty. Drop that, and the PP is a guide to life." No need to hedge.
