  Ah yes, Quine's behaviorism is key here. He rejects mental meanings as "myths" because they're unobservable and lack explanatory power. For him, meaning just is what's publicly manifest in behavior. So when behavior underdetermines translation, there's literally nothing else to settle the matter. The user's hypothetical about neural states is clever, but Quine would dismiss that as changing the subject from linguistic meaning to physiology.

