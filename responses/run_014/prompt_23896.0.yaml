  For the residue report: the paradox mechanism carries over cleanly (self-reference + negation = explosion), but the set-theoretic "forced existence" feels different from type theory's "ill-typed term." In set theory, the paradox is ontological (a set that can't exist), while in type theory it's operational (a term that can't compute or type-check). That's not a distortion—it's revealing a genuine difference in perspective.  

  Proper classes are trickier. In type theory, we don't need them because we handle "collections too big to be sets" via universes or dependent types. The hierarchy of universes (Type_i : Type_{i+1}) mirrors the class/set distinction but in a stratified way. No direct counterpart exists because type theory rejects the idea of a single all-encompassing collection.  

