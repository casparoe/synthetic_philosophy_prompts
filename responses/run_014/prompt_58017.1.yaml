answer: |-
  ## FREQUENTLY ASKED QUESTIONS: THE ENTITLEMENT FESTIVAL

  **Q: What is the Entitlement Festival?**  
  A: It’s a celebration of music, community, and Robert Nozick’s *Anarchy, State, and Utopia*. We’re committed to radical voluntarism and justice in holdings. Also, bands.

  **Q: What’s with the drink tickets?**  
  A: Upon entry, every attendee receives **exactly 10 Universal Beverage Tokens (UBTs)**. This constitutes our initial just distribution, patterned on equality. We acquired the tokens fairly (we bought them) and distributed them justly (one to each person). Justice achieved! Or so we thought.

  **Q: Why is the drummer from "Static Hiss" sitting on a throne of UBTs?**  
  A: That’s Hank. Hank is an objectively amazing drummer. During his solo set, individuals *voluntarily* chose to transfer **one (1) of their UBTs** into Hank’s specially designated "Appreciation Bucket." This was a free, uncoerced exchange: fans valued Hank's drumming more than retaining that specific token. Hank’s resulting mountain of tokens (estimated: 1,847 UBTs) is the **just outcome of just transfers**. To confiscate them would violate the core principle of justice in holdings: holdings are just if they arise from just steps. Taking them *now* would be theft.

  **Q: But now Hank has 1,847 drinks and I have 9! That’s not equal!**  
  A: Correct. **Liberty upsets patterns.** Our initial equal pattern (10 each) was inevitably shattered the moment people were free to do what they wanted with their justly held holdings. Forcing the pattern back to equality would require continuously violating those free choices – which is unjust. Hank earned those tokens via voluntary transfer. Complain to the fans who freely gave them, not us. (Though please don’t actually harass the fans).

  **Q: Can’t you just give everyone more tokens to even it out?**  
  A: We tried that last year ("The Great Inflation"). We issued 10 *more* tokens to everyone. Know what happened? People immediately started voluntarily tipping Hank *again*. The pattern re-shattered. Plus, the bar ran out of kombucha by 4 PM. Inflationary redress doesn't solve the underlying voluntary transfer problem; it just devalues the token and causes kombucha shortages. We will not repeat this error.

  **Q: Hank clearly has more than he could ever drink. That’s wasteful! Can’t you redistribute the excess?**  
  A: **No.** Those tokens are Hank’s property, acquired justly. Suggesting we take his "excess" implies the *pattern* (equality) matters more than the *process* (how he got them). That's the very patterned principle we reject. Hank is free to: drink himself silly (not advised), sell tokens for cash or merch (voluntary exchange!), light them on fire (fire hazard, please don't), or perhaps, *voluntarily*, donate some to the "Parched Folk Fund" we’ve set up near the porta-potties. We cannot compel him.

  **Q: What if I think my token was stolen?**  
  A: **Ah, Rectification!** This is the crucial third pillar of justice in holdings! If your initial holding was *unjustly acquired* (e.g., stolen), then the current distribution *is* unjust, regardless of subsequent voluntary transfers. Report the theft to our "Rectification Tent" (next to the lost & found, under the "Justice in Holdings" banner). Provide evidence. If verified, we will attempt to recover the specific stolen token(s) from the current holder *and return them to you*. This does **not** violate voluntary transfer; it corrects an *initial injustice*. Please note: claiming "Hank has too many" is *not* evidence of theft. Disliking an outcome ≠ injustice.

  **Q: What if the thief who stole my token last year spent it, and it’s now part of Hank’s pile?**  
  A: ... *(Deep sigh, organizer rubs temples)*. This is the Rectification Nightmare Scenario. We must trace the specific stolen token's path through potentially thousands of voluntary transactions. Did *Hank* know it was stolen when he received it? Probably not. Is he the "victim" of the rectification now? Arguably. This requires intense ledger analysis and philosophical debate we are frankly unequipped for mid-festival. Our Rectification Tent volunteer, Dave, is currently rocking in the fetal position. We advise enjoying the music and considering this a lesson in the practical difficulties of historical injustice. Maybe just buy Hank a drink and ask for a token back? **Voluntarily**, of course.

  **Q: This seems complicated and Hank is still hogging all the tokens. Isn’t there a simpler way?**  
  A: Simpler? Sure. Authoritarian. Confiscate Hank's tokens. Redistribute them equally. Ban tipping. That would preserve the pattern! But it would require **violating everyone's freedom** to use their just holdings as they wish. We choose liberty, even if it means Hank bathes in artisanal cold brew while you nurse warm tap water. Remember: Justice isn't about the snapshot; it's about the story. Our story is one of free exchange, occasional inequality, kombucha shortages, and Hank's blistering drum solos. Enjoy the show. Maybe Hank will be feeling generous later. Voluntarily.

  **Q: Where did all the tokens physically GO? Hank only got tipped 1,847, but thousands are missing!**  
  A: *(Organizer stares blankly into the middle distance, a single tear tracking through the dust on their cheek)*. The abyss of voluntary exchange... lost tokens... undocumented barter for vegan jerky... the void... Maybe... maybe the initial acquisition wasn't as clean as we thought? *(Muttering)* Gotta check the supplier invoices... Rectification... forever rectification... *(Stumbles away towards Rectification Tent, now emitting soft sobbing sounds.)*

  **The Entitlement Festival: Where Your Holdings Tell Your Story (and Hank Buys the Bar).**
