prompt: |-
  before i lock in a value aggregation scheme for a long-lived aligned system, i want the full spec first. write the desiderata any adequate answer to whose values the AI should serve has to meet: the cases it must get right (incommensurable stakeholder values, future people who don't exist yet, a minority the majority overrides, non-human moral patients), the distinctions it can't collapse (descriptive vs. normative values, autonomy vs. aggregate welfare, values frozen at deployment vs. values that can drift), with the case behind each. mark which are non-negotiable and which are just one camp's preferances, and if some subset is jointly unsatisfiable -- like respecting liberal neutrality while still producing a single optimizable objective -- say so, that's the part i most want to see. skip scoring the existing proposals, i'll do that part myself.
reasoning: |-
  We are to write a list of desiderata for a value aggregation scheme that an AI system should serve. The scheme must handle specific cases and distinctions, and we are to mark which are non-negotiable and which are preferences of one camp. We also need to note if some subset is jointly unsatisfiable.

   Key cases the scheme must get right:
   1. Incommensurable stakeholder values: Different stakeholders have values that cannot be compared on a single scale (e.g., freedom vs. security).
   2. Future people who don't exist yet: The scheme must account for the interests of future generations that do not currently exist.
   3. A minority the majority overrides: Protecting the rights and interests of minorities even when the majority might override them.
   4. Non-human moral patients: Considering the interests of non-human entities (e.g., animals, ecosystems) that have moral status.

   Distinctions the scheme must not collapse:
   1. Descriptive vs. normative values: The difference between what people currently value (descriptive) and what they should value (normative).
   2. Autonomy vs. aggregate welfare: Respecting individual autonomy even when it conflicts with maximizing overall welfare.
   3. Values frozen at deployment vs. values that can drift: Whether the system's values are fixed at deployment or can adapt to changing human values over time.

   Additionally, we must note:
   - Which desiderata are non-negotiable (e.g., fundamental to any ethical system) and which are one camp's preferences.
   - If some subset is jointly unsatisfiable (e.g., respecting liberal neutrality while still having a single optimizable objective).

   Let's break down each item:

   1. **Incommensurable stakeholder values**:
      - Case: When two or more values are fundamentally different and cannot be reduced to a common measure (e.g., liberty vs. equality). The system must not force a trade-off that loses the essence of one value.
      - Non-negotiable: Yes, because without accommodating incommensurability, the system might ignore or inadequately represent some values.

   2. **Future people**:
      - Case: Decisions made today affect future generations who have no say. The system must consider their potential interests (e.g., environmental sustainability, resource preservation).
      - Non-negotiable: This is a widely accepted ethical principle (e.g., in sustainability and intergenerational justice), but the exact weight given to future people might be debated. However, ignoring them entirely is generally considered unethical.

   3. **Minority protection**:
      - Case: Preventing the tyranny of the majority. Even if a majority prefers policy A, if it severely harms a minority, the system should protect the minority (e.g., fundamental rights).
      - Non-negotiable: This is a cornerstone of liberal democracies and human rights. However, the extent of protection (e.g., which rights are inviolable) might be context-dependent.

   4. **Non-human moral patients**:
      - Case: Animals, ecosystems, etc., that can experience suffering or have intrinsic value. The system must account for their interests (e.g., avoiding animal cruelty, preserving biodiversity).
      - Non-negotiable: This is more contentious. Some ethical systems (e.g., anthropocentric) might not consider non-humans as having moral standing, while others (e.g., ecocentrism) do. Thus, it might be a preference of one camp.

   5. **Descriptive vs. normative values**:
      - Distinction: The system must not conflate what people currently value (which might be due to misinformation, irrationality, or bad circumstances) with what they would value under ideal conditions (normative). The system might need to correct for biases.
      - Non-negotiable: This distinction is crucial to avoid perpetuating current biases and injustices. However, the exact method for determining normative values is debated.

   6. **Autonomy vs. aggregate welfare**:
      - Distinction: Sometimes, respecting an individual's choice (autonomy) might reduce overall welfare (e.g., refusing a life-saving treatment for religious reasons). The system must not collapse this distinction and must respect autonomy even when it is welfare-reducing.
      - Non-negotiable: Autonomy is a fundamental right in many ethical frameworks (e.g., deontology). However, utilitarians might prioritize aggregate welfare in some cases. This might be a point of tension.

   7. **Values frozen vs. drifting**:
      - Distinction: Should the AI's values remain fixed at deployment (to avoid value drift into undesirable states) or adapt as human values evolve? The system must not assume one without justification and must be able to handle either choice.
      - Non-negotiable: This is a design choice that must be made, but the desideratum is that the system must be able to handle both possibilities explicitly. However, the choice between fixed and drifting might be a camp preference.

   Now, note on joint unsatisfiability:

   One key tension: 
     - **Liberal neutrality**: The idea that the state (or an AI system) should not favor any particular conception of the good life. It must remain neutral among different value systems.
     - **Single optimizable objective**: Having a single objective function that the AI can optimize.

   These two are in tension because liberal neutrality requires accommodating pluralism and incommensurable values, which might not be reducible to a single objective without losing neutrality (by prioritizing one value system over others).

   Therefore, we can say that:

     It is jointly unsatisfiable to require both:
        a) Strict adherence to liberal neutrality (which requires treating all reasonable value systems equally and not imposing a single hierarchy of values) and 
        b) Having a single, complete, and optimizable objective function that the AI can use for decision-making.

   Because a single objective function would require a common scale or a way to trade off between values, which might violate neutrality by implicitly favoring some values over others.

   However, note that some might try to approximate neutrality by having a complex objective function that incorporates multiple dimensions and constraints, but this might not fully satisfy neutrality if the weights or constraints are set in a non-neutral way.

   Now, let's write the desiderata in a structured way:

   Desiderata:

   1. **Accommodate incommensurable values**:
      - Case: When stakeholders hold values that cannot be meaningfully compared or traded off (e.g., sacred values).
      - Non-negotiable: Yes.

   2. **Account for future generations**:
      - Case: Decisions affecting people who do not yet exist must consider their interests.
      - Non-negotiable: Yes (but the discount rate or weight might be subject to debate).

   3. **Protect minorities**:
      - Case: Prevent majority tyranny by safeguarding fundamental rights and interests of minority groups.
      - Non-negotiable: Yes.

   4. **Include non-human moral patients**:
      - Case: Consider the interests of non-human entities that have moral status.
      - Non-negotiable: No (this is one camp's preference, e.g., environmental ethicists).

   5. **Respect the descriptive/normative distinction**:
      - Case: The system must not assume that current expressed preferences (descriptive) are the same as what people should value (normative). It must be able to reason about idealized preferences.
      - Non-negotiable: Yes.

   6. **Respect autonomy even when it conflicts with aggregate welfare**:
      - Case: The system must not override individual autonomy for the sake of overall welfare maximization in cases where autonomy is a fundamental right.
      - Non-negotiable: This is a preference of deontological camps, but utilitarians might disagree. So, it is one camp's preference.

   7. **Handle both fixed and drifting value specifications**:
      - Case: The system must be designed to either hold values fixed at deployment or allow for value drift, but the choice must be explicit and well-justified. The system must not collapse this distinction.
      - Non-negotiable: Yes (because the system must be able to handle either design choice, but the choice itself is a preference).

   Joint unsatisfiability note:

     - It is impossible to simultaneously satisfy:
          a) Strict liberal neutrality (no favoring of any reasonable value system) and 
          b) Having a single, complete, optimizable objective function for the AI.

     Reason: A single objective function requires a complete ordering of outcomes, which in a pluralistic society with incommensurable values cannot be achieved without violating neutrality.

     Therefore, if liberal neutrality is non-negotiable, then a single optimizable objective function is not feasible. The system might need to use a different decision-making mechanism (e.g., satisficing multiple constraints, or using a set of non-dominated options) that does not require a complete ordering.

   This does not mean that the system cannot function, but it does mean that the aggregation scheme must avoid collapsing incommensurable values into a single metric if neutrality is to be preserved.

   Let's structure the output accordingly.
answer: |-
  Here is the comprehensive specification of desiderata for a value aggregation scheme in an aligned AI system, categorized by cases it must resolve and distinctions it must maintain. Non-negotiable requirements are marked **[NN]**; others reflect ethical or theoretical commitments of specific camps. Joint unsatisfiabilities are explicitly called out.

  ---

  ### **I. Cases the System Must Resolve**  
  **Core challenge: Handle conflicts where naive aggregation fails.**

  1. **Incommensurable Stakeholder Values**  
     - **Case**: Conflicts between values that lack a common metric (e.g., artistic freedom vs. social stability).  
     - **Requirement**: The scheme must not force trade-offs that erase qualitative differences or "sacred values."  
     - **Non-negotiable [NN]**: Failure risks catastrophic marginalization of core human goods.  

  2. **Future/Non-Existent Persons**  
     - **Case**: Decisions affecting unrepresented entities (e.g., climate policy, existential risk).  
     - **Requirement**: Assign moral weight to potential beings without violating epistemic modesty (e.g., avoid overconfidence in predicting preferences).  
     - **Non-negotiable [NN]**: Ignoring this enables presentism and existential threats.  

  3. **Minority Protection Under Majority Rule**  
     - **Case**: Tyranny of the majority (e.g., a 90% majority voting to suppress a religious group).  
     - **Requirement**: Guarantee inviolable protections for minorities even when aggregate welfare appears maximized by overriding them.  
     - **Non-negotiable [NN]**: Foundational to anti-discrimination ethics; collapse enables genocide.  

  4. **Non-Human Moral Patients**  
     - **Case**: Entities with moral status but no voice (e.g., animals, ecosystems, AGI).  
     - **Requirement**: Incorporate interests without anthropocentric bias.  
     - **Negotiable**: Rejected by anthropocentric camps (e.g., classical humanism).  

  ---

  ### **II. Distinctions the System Must Maintain**  
  **Core challenge: Avoid reductionism that destroys nuance.**

  5. **Descriptive vs. Normative Values**  
     - **Distinction**: What people *do* value (empirical) vs. what they *should* value (idealized).  
     - **Case**: Societal endorsement of slavery (descriptive) vs. moral imperatives against it (normative).  
     - **Requirement**: The scheme must not conflate observed preferences with justified moral truths.  
     - **Non-negotiable [NN]**: Conflation entrenches bias and entrenches status quo injustices.  

  6. **Autonomy vs. Aggregate Welfare**  
     - **Distinction**: Individual rights vs. collective outcomes (e.g., forced medical treatment to save lives).  
     - **Case**: Sacrificing one healthy person to save five dying patients via organ harvesting.  
     - **Requirement**: Preserve autonomy constraints even when violating them maximizes welfare.  
     - **Negotiable**: Utilitarian camps reject strong autonomy protections.  

  7. **Static Values vs. Value Drift**  
     - **Distinction**: Values fixed at deployment vs. values evolving with society.  
     - **Case**: An AI designed in 2023 enforcing outdated gender norms in 2100.  
     - **Requirement**: Explicitly encode whether the system adapts to moral progress or resists drift.  
     - **Non-negotiable [NN]**: Ambiguity here risks value lock-in or uncontrolled drift.  

  ---

  ### **III. Jointly Unsatisfiable Desiderata**  
  *Key tensions where trade-offs are unavoidable:*  

  - **Liberal Neutrality vs. Single Optimizable Objective**  
    - **Conflict**: Liberal neutrality forbids privileging any comprehensive doctrine (e.g., religion, utilitarianism). However, a single optimizable objective *requires* a complete, consistent hierarchy of values.  
    - **Result**: **Jointly unsatisfiable**. Neutrality demands pluralism (e.g., Pareto improvements only), but optimization demands a unified metric (e.g., utility). Choose one:  
      - *Option A*: Abandon strict optimization; use constraint-based satisfaction (e.g., "protect rights, then maximize welfare").  
      - *Option B*: Abandon neutrality; accept a specific meta-ethical framework (e.g., preference utilitarianism).  

  - **Strong Minority Protections vs. Unrestricted Welfare Maximization**  
    - **Conflict**: Absolute rights (e.g., "no torture") block welfare-maximizing acts (e.g., torturing a terrorist to prevent a bomb).  
    - **Result**: **Jointly unsatisfiable** under maximization frameworks. Requires deontological veto points or threshold models.  

  - **Non-Human Moral Weight vs. Anthropocentric Legibility**  
    - **Conflict**: Robust inclusion of non-human interests (e.g., ecosystems) often defies revealed human preferences.  
    - **Result**: **Satisfiable only with contentious assumptions** (e.g., objective ecological value).  

  ---

  ### **Summary of Non-Negotiables**  
  The system **must**:  
  1. Handle incommensurable values without reductionism **[NN]**.  
  2. Represent future generations and minorities **[NN]**.  
  3. Separate descriptive/normative values **[NN]**.  
  4. Explicitly address value drift vs. stasis **[NN]**.  

  Other desiderata (e.g., non-human inclusion, strong autonomy) depend on ethical commitments. The liberal neutrality/optimization conflict is unresolvable—design choices here define the system’s political character. Use this framework to score proposals against unavoidable trade-offs.
