prompt: |-
  Okay so kinda weird ask but I need something practicle I can actually use at work. I'm a nurse practitioner doing intake and follow-ups at a busy pain clinic, like 10 to 12 patients a day, mostly chronic back pain, neuropathy, post-surgical stuff. I get like 15 minutes per person, I have zero philosophy background, and anything involving changing opioid doses or adding a psych referral has to get signed off by the attending.

  Throughout training we got the whole pain is whatever the patient says it is line, but then I learned about this thing called pain asymbolia where some folks with brain injuries will say yep that hurts but they don't seem bothered by it at all, don't pull away, even laugh, and philosophers fight about what that means for whether pain is bad because of how it feels vs because of the urge to make it stop vs because you dislike it or want it gone.

  Can you turn that debate into a step-by-step assessement I can run in the room? Like what to ask and check first, second, third, what counts as good enough to move on, when to stop and just treat, when to flag that this is no longer a factual question but a values call I need to kick upstairs. Keep the distinctions that actually matter for care and drop the rest, and be honest about where the checklist will misfire and where I just have to use judgment.

  Then run it on three made-up patients I keep seeing versions of: A, a post-stroke older man who rates his shoulder pain high on intensity but low on bother and keeps trying to leave to go smoke; B, a teen with CRPS who is super distressed even with light touch and can't sleep; C, someone where your procedure tells me to hold off on escalating meds even though my gut says help them now, I want to see the uncomfortable case where I won't like the answer.

  End with what the procedure cannot do.
reasoning: |-
  We are going to create a practical step-by-step assessment tool for a busy pain clinic NP, based on philosophical distinctions that matter for clinical care. The goal is to distinguish between the sensory intensity of pain and the affective/behavioral response to it, which can inform treatment decisions (e.g., when to focus on symptom management vs. when to address distress or behavioral factors).

  The procedure will have 4 steps:

  1. **Intensity & Sensory Qualities**: Assess the sensory dimension (location, intensity, quality).
  2. **Affective Response**: Assess the emotional experience and how much the pain bothers the patient.
  3. **Behavioral Impact**: Assess functional limitations and observable behaviors.
  4. **Decision Algorithm**: Based on steps 1-3, decide whether to treat primarily as sensory, affective, or a mix, and when to involve the attending (e.g., for non-standard cases or when values conflicts arise).

  We'll define thresholds for moving on and when to flag.

  ### Step-by-Step Assessment Tool

  **STEP 1: Intensity & Sensory Qualities (0-60 seconds)**
  - Ask: "On a scale of 0 to 10, where 0 is no pain and 10 is the worst pain imaginable, what is your pain right now?" 
  - Ask: "Can you describe the pain? (e.g., burning, stabbing, aching)"
  - Ask: "Where exactly do you feel it?"
  - *Why*: Establishes baseline sensory data. High intensity (≥7) is a red flag for potential under-treatment.
  - *Good enough to move on*: You have a number and a basic description. If the patient cannot rate, ask them to compare to a past experience (e.g., "Is it worse than a toothache?") and assign a rough number.
  - *Flag if*: Pain is severe (≥8) and new, or if there are red flags (e.g., neurological symptoms, signs of infection). Otherwise, move to Step 2.

  **STEP 2: Affective Response (Bothersome-ness) (0-60 seconds)**
  - Ask: "How much does this pain bother you? On a scale of 0 to 10, where 0 is not at all bothered and 10 is the most bothered you can imagine."
  - Ask: "What emotions do you feel when the pain is at its worst? (e.g., frustrated, scared, angry, indifferent)"
  - *Why*: Separates sensory intensity from emotional suffering. A big gap between intensity and bother (e.g., intensity 8, bother 2) suggests pain asymbolia-like dissociation or resilience. A high bother score (≥7) indicates significant distress.
  - *Good enough to move on*: You have a bother score and an emotional descriptor. If the patient struggles, ask: "Does the pain make you upset or can you ignore it?"
  - *Flag if*: Bother score is low (≤3) despite high intensity (≥7) – this is unusual and may indicate a neurological/psychiatric issue or misreporting. Also flag if bother is very high (≥8) regardless of intensity – this suggests affective overload.

  **STEP 3: Behavioral Impact (0-60 seconds)**
  - Ask: "What does this pain stop you from doing? (e.g., sleeping, working, walking)"
  - Observe: Guarding, grimacing, withdrawal during exam? (Note: CRPS may have allodynia; stroke may have flat affect.)
  - Ask: "How many hours of sleep do you get? How has your mood been?"
  - *Why*: Functional impact and observable behavior validate the patient's report and guide treatment (e.g., insomnia needs addressing).
  - *Good enough to move on*: You have 1-2 functional limitations and a note on sleep/mood. If the patient says "nothing" but observed behavior contradicts, note the discrepancy.
  - *Flag if*: Severe functional loss (e.g., cannot get out of bed) OR major mismatch (e.g., patient rates pain 10/10 but walks briskly, no distress on exam).

  **STEP 4: Decision Algorithm (30 seconds)**
  - **Pattern 1: High Intensity + Low Bother + Low Functional Impact** (e.g., Patient A: post-stroke man):  
    - *Action*: Focus on safety (e.g., risk of injury from not protecting a painful joint). Consider non-opioid options (e.g., topical) and education. Do not escalate opioids unless there's objective harm (e.g., tissue damage). Monitor for neglect.  
    - *Attending Flag*: Only if neglect is suspected or if there's pressure to escalate meds against clinical judgment.

  - **Pattern 2: Any Intensity + High Bother + High Functional Impact** (e.g., Patient B: teen with CRPS):  
    - *Action*: Address affective component (e.g., CBT, mindfulness, antidepressant) and functional restoration (PT). Optimize non-opioid meds (e.g., gabapentin). Sleep is priority.  
    - *Attending Flag*: For psych referral or if opioids are requested – this is high risk for misuse/overuse.

  - **Pattern 3: Discrepant Reporting** (e.g., pain 10/10 but laughing/smiling, or pain 2/10 but sobbing):  
    - *Action*: Treat based on functional impact. If low impact, avoid escalation; if high impact, investigate causes (e.g., depression).  
    - *Attending Flag*: Always – this is a values/complexity issue (e.g., is the patient minimizing/maximizing? Is there cognitive impairment?).

  - **Pattern 4: High Intensity + High Bother + High Functional Impact**:  
    - *Action*: Standard pain management – escalate as per guidelines (non-opioid first), but involve attending if opioids are needed.

  ### Applying to Cases

  **Patient A: Post-stroke older man, rates shoulder pain 8/10 intensity, 2/10 bother, tries to leave to smoke.**  
  - Step 1: 8/10, shoulder, aching.  
  - Step 2: Bother 2/10, "annoyed but whatever".  
  - Step 3: Minimal functional impact (can use arm, but you note he winces when moved). Sleeps fine.  
  - Step 4: Pattern 1. Do not escalate opioids. Check for shoulder subluxation/injury. Use sling, topical NSAID. Educate on protecting joint. Flag for attending only if neglect suspected (e.g., he denies pain but joint is inflamed).  

  **Patient B: Teen with CRPS, distressed by light touch, rates pain 9/10, can't sleep.**  
  - Step 1: 9/10, foot, burning.  
  - Step 2: Bother 10/10, "terrified, hopeless".  
  - Step 3: Cannot wear socks, sleeps 2-3 hours. Observed: withdraws from light touch, tearful.  
  - Step 4: Pattern 2. Prioritize sleep (e.g., low-dose amitriptyline) and PT for desensitization. Avoid opioids (high risk in teen). Flag for psych referral and attending co-sign.  

  **Patient C: (The uncomfortable case) - Middle-aged woman with chronic back pain post-fusion. Rates pain 7/10 intensity, 6/10 bother. Functional impact: "I can't work or do chores". Exam shows normal gait, no distress. Requests oxycodone refill.**  
  - Step 1: 7/10, low back, sharp.  
  - Step 2: Bother 6/10, "frustrated".  
  - Step 3: Self-reports high disability, but you observe her bending to pick up purse easily. Sleep is "okay".  
  - Step 4: Pattern 3 (discrepancy). Do not escalate opioids (risk outweighs benefit without objective signs). Address function (PT, activity pacing). Flag for attending – values conflict (patient expects opioids, but clinical picture doesn't support). Your gut said "help now" but the procedure says "hold" due to discrepancy.  

  ### What the Procedure Cannot Do  
  1. **Resolve existential suffering**: If pain is tied to meaning (e.g., "This pain is punishment"), the checklist won't capture that.  
  2. **Detect deception**: It flags discrepancies but can't prove malingering vs. cognitive dissonance.  
  3. **Override guidelines**: If the patient meets criteria for opioid escalation per clinic policy but the algorithm says "hold", you still need attending input.  
  4. **Handle acute emergencies**: If a patient has new red flags (e.g., cauda equina), skip to immediate care.  
  5. **Replace therapeutic alliance**: A patient who feels unheard may escalate demands – the checklist is a tool, not a substitute for empathy.  

  **Final Tip**: Use the first 1-2 minutes of the visit for Steps 1-3. If all steps align (e.g., high intensity, bother, impact), you can fast-track to treatment. If discrepancies arise, use the remaining time to explore why (e.g., "Help me understand – you rate pain high but seem relaxed. Is that because you've learned to cope?").  

  This tool makes the philosophy practical: it distinguishes the "ouch" from the "ugh" and the "can't".
answer: |-
  Here's a practical, step-by-step assessment tool distilled from the pain philosophy debate, designed for 15-minute clinic visits. It focuses on three core questions: **Sensory intensity** ("What do you feel?"), **Affective response** ("How much does it bother you?"), and **Functional impact** ("What does it stop you from doing?"). I'll flag where judgment is needed and where to involve the attending.

  ---

  ### **Quick-Use Pain Assessment Protocol (4-Step Checklist)**
  **Goal:** Separate pain sensation from suffering to guide treatment.  
  **Time Budget:** Steps 1-3 in ≤5 mins. Save Step 4 for charting/decisions.

  #### **STEP 1: Sensory Intensity & Localization**  
  *(What's the signal?)*  
  - **Ask:**  
    - "Rate your pain **right now** from 0 (no pain) to 10 (worst imaginable)."  
    - "What does it *feel* like? (e.g., burning, stabbing, numbness)"  
    - "Point to *exactly* where it hurts."  
  - **Check:**  
    - Guarding, grimacing, or withdrawal during exam?  
    - Allodynia (light touch hurts)?  
  - **Good Enough to Move On:** You have a number, description, and location.  
  - **Flag/Stop Here If:**  
    - Red flags (e.g., new weakness, bowel/bladder changes).  
    - Pain ≥8/10 with no prior workup → Needs urgent attending review.  
  - **Why:** Rules out emergencies and establishes baseline sensory data.  

  #### **STEP 2: Affective Response (Bothersome-ness)**  
  *(Does the signal "matter" to them?)*  
  - **Ask:**  
    - "How much does this pain **bother you** *emotionally*? 0 (not at all) to 10 (unbearable)."  
    - "When it’s bad, what emotions come up? (e.g., fear, anger, indifference)"  
  - **Check:**  
    - Mismatch between reported intensity and emotional distress (e.g., "Pain is 8/10 but bother is 2/10").  
    - Flat affect, smiling, or joking about severe pain.  
  - **Good Enough to Move On:** You have a bother score and emotion descriptor.  
  - **Flag/Stop Here If:**  
    - Bother score ≤3/10 despite intensity ≥7/10 → Possible pain asymbolia, frontal lobe injury, or maladaptive coping.  
    - Bother score ≥8/10 → High distress, needs psych/comanagement.  
  - **Why:** Identifies "suffering" vs. sensation. Low bother may mean less need for escalation; high bother needs behavioral/psych support.  

  #### **STEP 3: Functional Impact**  
  *(What does the signal disrupt?)*  
  - **Ask:**  
    - "What can’t you do because of pain? (e.g., sleep, work, walk 10 steps)"  
    - "How many hours of sleep do you get? Has your mood changed?"  
  - **Check:**  
    - ADL/IADL limitations (e.g., needing help dressing).  
    - Sleep log or mood screen (PHQ-2: "Felt down/hopeless last 2 weeks?").  
  - **Good Enough to Move On:** You know 1-2 key functional losses and sleep/mood status.  
  - **Flag/Stop Here If:**  
    - High disability (e.g., bedbound) despite low/moderate pain scores.  
    - Patient prioritizes functional goals over pain reduction (e.g., "I just want to walk my dog").  
  - **Why:** Functional goals > pain scores for treatment efficacy. High disability + low bother may indicate neglect or depression.  

  #### **STEP 4: Decision Algorithm**  
  *(Based on Steps 1-3, ≤2 mins)*  
  - **🚩 Pattern A: High Intensity + Low Bother + Low Disability**  
    (e.g., "Pain 8/10, bother 2/10, still gardens daily")  
    - **Action:** Safety first (e.g., protect insensate limb). Avoid opioids; use topicals, PT, or neuropathic agents.  
    - **Attending Flag:** If neglect/injury risk (e.g., painless joint destruction).  
    - *Philosophy Basis:* Pain sensation without suffering → treat to prevent harm, not reduce sensation.  

  - **💥 Pattern B: Any Intensity + High Bother + High Disability**  
    (e.g., "Pain 5/10, bother 9/10, can’t leave bed")  
    - **Action:** Target affective component first: psych referral, CBT-I for sleep, SNRI (e.g., duloxetine), PT for pacing. Avoid opioids (risk of misuse in distress).  
    - **Attending Flag:** For urgent psych/sleep comanagement.  
    - *Philosophy Basis:* Suffering drives disability → treat emotions/function, not just sensation.  

  - **⚠️ Pattern C: Mismatch All Fields**  
    (e.g., "Pain 10/10, bother 1/10, disability 10/10")  
    - **Action:** Hold escalations; investigate causes (cognitive impairment? Depression? Deception?). Order UDS, neuro exam, collateral history.  
    - **Attending Flag:** Immediately – requires complex discernment.  
    - *Philosophy Basis:* Data conflict → values/accuracy uncertainty. Attendings handle risk/benefit calls.  

  - **✅ Proceed with Treatment:** Only if all 3 steps align (e.g., medium scores, clear goals).  

  ---

  ### **Case Applications**
  **Patient A: Post-Stroke Man (Shoulder Pain)**  
  - **S1:** Pain 8/10, localized to shoulder.  
  - **S2:** Bother 2/10, "It’s whatever, I need a smoke." Flat affect.  
  - **S3:** Minimal disability (eats, dresses self). Sleeps well.  
  - **S4 Decision:** **Pattern A** → No opioid escalation. Focus: Shoulder ROM exercises, topical diclofenac, safety ed ("Protect your joint!"). Flag attending if neglect suspected.  

  **Patient B: Teen with CRPS**  
  - **S1:** Pain 9/10, burning foot, allodynia+.  
  - **S2:** Bother 10/10, "I’m terrified of touch!" Anxious.  
  - **S3:** Can’t wear shoes/socks; sleeps 2hrs/night. PHQ-2 positive.  
  - **S4 Decision:** **Pattern B** → Urgent psych/sleep intervention (trazodone, CBT), PT desensitization. Avoid opioids. Flag attending for psych referral.  

  **Patient C: The Uncomfortable Case**  
  - *Your Gut Says:* "Escalate meds!"  
  - **S1:** Low back pain 7/10 post-fusion.  
  - **S2:** Bother 6/10, "Frustrated but I’ll live."  
  - **S3:** Reports "can’t work or cook," but observed bending easily. Sleep stable.  
  - **S4 Decision:** **Pattern C** → Hold opioids. Mismatch suggests overreporting disability. Order UDS, activity log, PT re-eval. Flag attending: "Possible maladaptive illness behavior."  

  ---

  ### **Where the Protocol Will Fail (and Requires Judgment)**  
  1. **Cultural/Communication Gaps:** A patient who values stoicism may underreport bother.  
  2. **Psych Comorbidities:** Severe depression lowers pain threshold; anxiety amplifies bother.  
  3. **Neuropathic vs. Nociceptive:** CRPS (neuropathic) needs different meds than mechanical back pain.  
  4. **Acute vs. Chronic:** Acute pain escalations need imaging; chronic needs function-first.  
  5. **Patient Goals:** If a dying cancer patient wants opioids for comfort, ignore low bother scores.  

  **Critical Takeaway:**  
  - **Treat when:** Sensory + Affective + Functional data align.  
  - **Do NOT treat when:** Major mismatches exist (e.g., high disability + low bother).  
  - **Kick Upstairs when:** Uncertainty in values (e.g., "Is this suffering or sensation?") or risk (opioids, psych).  

  This tool converts "pain is what the patient says" into actionable layers. Use it to depersonalize tough calls – sometimes the right move is to *not* escalate, even when your gut protests. When in doubt, "See, Say, Sign-off" with the attending.
