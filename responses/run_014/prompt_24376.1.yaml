prompt: |-
  I'm trying to work out what I actually think about the problem of old evidence in Bayesian epistemology, going by my gut on a set of cases. Here are my verdicts:

  1. Mercury's perihelion anomaly strongly confirms general relativity, even though the anomaly had been known for decades before GR was proposed. The fact that GR "explains" the anomaly rather than predicting it in advance doesn't seem to matter much to me; the anomaly was a genuine puzzle, and GR solves it.

  2. A theory constructed after the fact specifically to fit Mercury's perihelion anomaly gets very little confirmation from that anomaly. If I had proposed a new theory whose only purpose was to account for the perihelion, I don't think the perihelion would confirm it much at all.

  3. The cosmic microwave background strongly confirms the Big Bang model. But I feel the CMB confirms the Big Bang model more than Mercury's perihelion confirms GR, because the CMB was (roughly) predicted by the Big Bang model before it was discovered, whereas the perihelion anomaly was not predicted by GR.

  4. The near-flatness of the universe confirms inflationary cosmology, even though the near-flatness was known before inflation was proposed. But I feel the flatness confirms inflation less than the CMB confirms the Big Bang, because the flatness is a fine-tuning problem that inflation solves, whereas the CMB was a genuinely surprising discovery.

  5. I don't think the total-evidence objection means that old evidence fails to confirm a theory. I take the total-evidence problem to be a technical artifact of how conditional probabilities are computed, not a genuine threat to the idea that old evidence can confirm a theory.

  6. I think a theory that unifies old evidence — explaining multiple pre-existing anomalies at once — gets more confirmation than the sum of what each piece of evidence would confirm on its own. For example, GR explains both Mercury's perihelion and the deflection of light; I think the unification adds confirmatory force beyond the two individual confirmations.

  Is there a coherent account of confirmation that captures all of these verdicts, or a close subset of them? If no single account captures all of them, which of my verdicts does the best available account force me to drop, and why? Please also say what would change your mind about the account you settle on: is there a case where old evidence seems to confirm a theory but your account says it doesn't, is there a case where your account forces you to say a theory gets no confirmation from old evidence (and is that a cost or a feature), and which of your assumptions about the cases is most likely to be wrong and how would the account change if it were?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're grappling with the problem of old evidence in Bayesian epistemology, and they've listed six specific verdicts based on their intuitions about various scientific cases. The core issue here is how to reconcile the idea that old evidence can confirm a theory with the Bayesian framework, which seems to struggle with this because old evidence should already have a probability of 1, making its conditional probability irrelevant.

  First, I need to understand each of their verdicts. The user mentions Mercury's perihelion confirming GR despite being known beforehand, but a theory built solely to fit that data doesn't get the same confirmation. They also distinguish between the predictive success of the CMB for Big Bang versus the explanatory fit of Mercury for GR, and they see unification as adding extra confirmatory weight. Plus, they dismiss the total-evidence objection as a technicality.

  The user is likely someone with a background in philosophy of science or a related field, given their familiarity with terms like Bayesian epistemology and specific scientific cases. Their deeper need seems to be finding a coherent philosophical framework that validates their intuitions without forcing them to abandon key judgments. They might be preparing for academic work, like a paper or thesis, or trying to solidify their own stance on confirmation theory.

  Looking at existing solutions, the Bayesian approach with counterfactual degrees of belief (like Garber's approach) comes to mind. It addresses old evidence by considering what the probability would have been if the theory was developed without the evidence. This fits verdicts 1 and 5. But then verdict 3, where prediction (CMB) is stronger than explanation (Mercury), needs something else. Prediction versus explanation might rely on how surprising the evidence was before the theory, which ties into Bayes factors.

  For verdict 2, where ad hoc theories get little confirmation, the solution might involve the theory's prior probability. If a theory is constructed just for one anomaly, its prior is low, so even fitting the evidence doesn't boost it much. Unification (verdict 6) could be explained by the ratio of likelihoods—theories explaining multiple pieces of evidence have higher P(e|T) compared to alternatives.

  But there's tension. Verdict 3 values prediction over explanation, but Bayesianism typically equates the two probabilistically. To capture this, we might need to incorporate the notion of novel predictions as more confirmatory because they're riskier. This could involve the Bayes factor being higher when evidence was unexpected before the theory. 

  The user's assumption in verdict 4 about fine-tuning vs. surprising discovery might also hinge on prior probabilities. Inflation solving flatness might have a high P(e|T), but if the alternative (fine-tuning) already had some plausibility, the confirmation isn't as strong as CMB, which was unexpected.

  Possible objections: If a theory is designed to fit old evidence but also makes novel predictions later, does that retroactively increase confirmation from old evidence? The account might need flexibility for theory evolutions. Also, distinguishing ad hoc theories from genuine ones might be tricky in practice. 

  To change my mind about the counterfactual Bayesian approach, I'd need a case where old evidence confirms a theory but the counterfactual probability difference is zero. For example, if scientists were certain of the evidence regardless of the theory, then even a good fit wouldn't raise the probability. But is that realistic? Or if a theory fits old evidence but is later falsified, should the initial confirmation be discounted? That points to the holistic nature of evidence over time.

  The user's verdict 6 on unification might challenge the strict Bayesian additive approach. If unification provides extra confirmation, it suggests that evidence isn't independent, so the joint likelihood is greater than the product of individual ones. Bayesianism can handle this if the theory's likelihood for combined evidence is higher than competitors', which is often the case for unifying theories.

  In summary, the counterfactual Bayesian framework covers most verdicts by adjusting priors and likelihoods, but capturing the predictive advantage (verdict 3) requires emphasizing the Bayes factor's sensitivity to prior evidence probability. The account's main weakness is handling the intuition that prediction is stronger than explanation, which might need additional elements like riskiness or diachronic factors. The user might need to accept that within strict Bayesianism, prediction and explanation are symmetric, or adjust their intuition that predictive success is inherently more confirmatory due to psychological or historical factors rather than formal probability.
answer: |-
  Your intuitions form a coherent and philosophically defensible pattern, largely aligning with a **sophisticated Bayesian account incorporating counterfactual degrees of belief and attention to prior probabilities**. Here's how it captures your verdicts and where tensions might arise:

  **The Core Account: Counterfactual Bayesianism with Novelty & Unification Weighting**
  1.  **Old Evidence CAN Confirm:** It rejects the "problem of old evidence" as a technical artifact (agreeing with Verdict 5). Confirmation is assessed counterfactually: *How much more likely would the evidence (e) be if the theory (T) were true, compared to if it weren't, **at a time before T was formulated and e was known/fully understood as problematic?*** (This is Garber's approach, often combined with Jeffrey's). This captures the idea that e confirms T if T *explains* e better than the background knowledge (K) did alone.

  2.  **Capturing Your Verdicts:**
      *   **Verdict 1 (Mercury/GR):** Yes. Pre-GR background physics (Newton + known anomalies) made Mercury's anomaly (`e`) very surprising/unlikely (`P(e|K)` was low). GR made `e` highly probable (`P(e|T&K) ≈ 1`). The *counterfactual likelihood ratio* `P(e|T&K) / P(e|K)` is very high → strong confirmation. The fact it was known beforehand doesn't matter because we assess the *explanatory power* counterfactually.
      *   **Verdict 2 (Ad Hoc Theory):** Yes. The key is the prior probability `P(T|K)`. A theory built *only* to fit `e` has an extremely low prior – it looks contrived, lacks independent motivation, and doesn't connect to other knowledge. While `P(e|T&K)` is high (by design), `P(T|K)` is so low that even after conditionalizing on `e`, the posterior `P(T|e&K)` remains low → little net confirmation. The evidence is "used up" in justifying the low prior.
      *   **Verdict 3 (CMB/Big Bang > Mercury/GR):** *Mostly Captured.* The key difference is `P(e|K)` *before the theory was proposed*.
          *   For CMB: Pre-Big Bang cosmology offered no compelling reason to expect a uniform ~3K background radiation. `P(CMB|K)` was *extremely* low. Big Bang (specifically, Gamow/Alpher/Herman's prediction) made it highly probable (`P(CMB|T&K) ≈ 1`) → very high likelihood ratio → very strong confirmation.
          *   For Mercury: Pre-GR physics *did* predict a perihelion shift (`P(e|K)` was high, but *not exactly matching observation*). The *discrepancy* `d` was the anomaly. `P(d|K)` was low (Newtonian physics couldn't explain it). GR made `P(d|T&K) ≈ 1`. The likelihood ratio `P(d|T&K)/P(d|K)` is high, but `P(d|K)` wasn't *as catastrophically low* as `P(CMB|K)`. Prediction of something genuinely *new and unexpected* (CMB) yields a higher likelihood ratio than explaining a known *discrepancy within an existing framework* (Mercury).
          *   **Tension Point:** A strict Bayesian might argue that if the likelihood ratios are comparable, the confirmation *should* be the same, regardless of whether `e` was known beforehand. Your intuition that prediction is stronger is widely shared and often linked to avoiding ad-hocness or measuring "riskiness." This account *can* accommodate it via `P(e|K)` being lower for genuinely novel predictions.
      *   **Verdict 4 (Flatness/Inflation < CMB/Big Bang):** Yes. Similar logic to Verdict 3.
          *   Pre-inflation cosmology *knew* the universe was flat (`e`). The problem was fine-tuning: `P(e|K)` under pre-inflation physics was *theoretically possible but required absurdly precise initial conditions*, making it seem *unreasonably* improbable (`P(e|K)` was *effectively* low due to fine-tuning). Inflation explains `e` naturally (`P(e|T&K) ≈ 1`), solving the fine-tuning → confirmation.
          *   However, `e` (flatness) was *known* and its puzzling nature (fine-tuning) was recognized. The CMB was a *completely unknown phenomenon* predicted by the Big Bang. `P(CMB|K)` was lower than `P(Flatness|K)` (even granting the fine-tuning worry) → higher likelihood ratio for CMB. Solving a recognized puzzle is confirmatory, but predicting something entirely new and unexpected is *more* confirmatory.
      *   **Verdict 5 (Total Evidence):** Agrees. The "problem" arises from naively setting `P(e) = 1` *after* learning `e`. The counterfactual approach avoids this by assessing confirmation relative to a time before `T` was developed and `e` was integrated into `K` *as a problem for T*.
      *   **Verdict 6 (Unification Bonus):** Yes, via likelihoods. A theory `T` that explains two *apparently independent* anomalies `e1` and `e2` often has a much higher `P(e1 & e2 | T & K)` than any combination of rival theories that explain each one separately. Crucially, `P(e1 & e2 | K)` (the probability of both anomalies under background knowledge) is often *much lower* than `P(e1|K) * P(e2|K)` if they seemed unrelated before `T`. `T`'s ability to show they are connected manifestations of a deeper principle drastically increases the likelihood ratio for the *conjunction*. This yields a "bonus" beyond simply adding the confirmation from each piece individually.

  **Best Available Account: Counterfactual Bayesianism (with emphasis on `P(e|K)` and Priors)**
  This account captures Verdicts 1, 2, 4, 5, and 6 robustly. It *mostly* captures Verdict 3 by linking the strength of confirmation to how surprisingly *low* `P(e|K)` was before the theory was proposed. The predictive novelty of the CMB makes `P(CMB|K)` lower than `P(MercuryDiscrepancy|K)`, justifying the difference in confirmatory strength.

  **What Might Need Adjustment & Costs:**
  1.  **Verdict 3 (Prediction > Explanation Strength):** This is the main tension point.
      *   **Cost of Strict Bayesianism:** A pure counterfactual Bayesian might insist that if the likelihood ratios `P(e|T&K)/P(e|K)` are identical, the confirmation *should* be identical, regardless of whether `e` was known beforehand. Your intuition that novel prediction is stronger is an extra-Bayesian intuition about scientific practice (avoiding ad-hocness, testing riskiness).
      *   **Possible Compromise:** The account *can* explain the difference via `P(e|K)`. The key is arguing that `P(CMB|K)` was *objectively lower* than `P(MercuryAnomaly|K)` pre-theory. If you accept that, the difference is captured. If you think the likelihood ratios *were* actually similar, then you'd need to drop the intuition that prediction is *inherently* stronger within this framework, or supplement it (e.g., with a notion of "severity" of tests).

  **What Would Change My Mind About This Account?**
  *   **Case where old evidence confirms but counterfactual account says it doesn't:** Imagine a theory `T` perfectly explains old evidence `e`, but `P(e|K)` (pre-`T`) was already 1. The counterfactual likelihood ratio `P(e|T&K)/P(e|K) = 1/1 = 1` → no confirmation. Is this a cost? *Yes and No.*
      *   **Cost:** It seems `T` explains `e`! Shouldn't that count?
      *   **Feature:** If `e` was already fully expected under `K`, then `T` explaining it adds nothing new; it doesn't solve any puzzle. `T` gets no confirmation credit for `e`. (E.g., a new theory "explaining" that dropped objects fall wouldn't be confirmed by that fact). This matches the intuition that confirmation requires *discriminating power*. If you found a case where `e` *was* puzzling (so `P(e|K)` < 1) but for some technical reason the counterfactual likelihood ratio was 1, *that* would be a serious problem.
  *   **Case where account forces "no confirmation" and it seems wrong:** Verdict 2 is exactly this! Ad hoc theories get little confirmation. The account *embraces* this as a feature, not a bug. It explains *why* such theories are rightly viewed with suspicion.

  **Most Likely Wrong Assumption & Impact:**
  *   **Assumption:** That the `P(e|K)` values pre-theory can be reasonably estimated or compared (especially for Verdicts 3 & 4). Assigning precise probabilities to complex scientific propositions pre-theory is notoriously difficult and subjective.
  *   **Impact:** If `P(e|K)` is poorly defined or incomparable across cases, the distinction between the confirmatory strength of Mercury/GR vs. CMB/Big Bang (Verdict 3) or Flatness/Inflation vs. CMB/Big Bang (Verdict 4) becomes murkier within the account. The core logic (high `P(e|T&K)` / low `P(e|K)` → confirmation) still holds, but the *relative strength* becomes harder to justify quantitatively. The account would still explain *that* confirmation occurs and *why* ad hoc theories fail, but precise comparisons might rely more on qualitative judgments about how surprising `e` was.

  **Conclusion:**
  Your intuitions are remarkably consistent with a counterfactual Bayesian framework that carefully considers:
  1.  The prior probability of the theory (`P(T|K)`), penalizing ad hoc constructions.
  2.  The prior probability of the evidence under background knowledge (`P(e|K)`), measuring how surprising/puzzling `e` was before the theory.
  3.  The likelihood (`P(e|T&K)`), measuring how well the theory explains the evidence.
  4.  The power of unification to drastically increase the likelihood for conjunctions of evidence.

  This account captures Verdicts 1, 2, 4, 5, and 6 directly. It captures the *spirit* of Verdict 3 by linking the strength of confirmation to how low `P(e|K)` was pre-theory, which is typically lower for genuinely novel predictions like the CMB than for recognized anomalies like Mercury's perihelion. The main philosophical cost is potentially downplaying a strict distinction between prediction and explanation *if* the likelihood ratios are deemed equal. However, the account strongly suggests they usually aren't, supporting your intuition.
