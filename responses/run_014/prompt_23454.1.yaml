answer: |-
  ## The Uncomfortable Truth About Promises: Why Harm, Not Vows, Is What Truly Binds Us

  My editor demanded a side, so here it is: the moral weight of a promise doesn’t spring magically from the act of promising itself. It flows entirely from the potential to harm another person. This "derivative" account – championed by T.M. Scanlon and often met with philosophical discomfort – is the only one that survives scrutiny, especially at the unsettling edges of promise-making where the others falter. The compelling authority we feel when we make (or break) a promise isn’t proof of some mystical self-binding power of the will; it’s the echo of consequences we instinctively know follow betrayal.

  **The Will Theory's Seductive Illusion: Coercion in Moral Clothing**

  The will theory (think Kant) feels profound: by uttering "I promise," we perform a unique act of moral self-legislation. We create a new right for the promisee and bind ourselves by pure volition. But this profound feeling is, I suspect, a profound confusion. It mistakes the *shadow* of consequences for inherent moral authority. Consider the uncanny parallel with a *threat*. When someone says, "Do this or I’ll harm you," the binding force isn't in the words themselves; it’s in the credible expectation of harm. The "authority" of the threatener derives entirely from their perceived capacity to inflict that harm.

  A promise functions similarly, but benevolently. "I promise to do X" implicitly carries the unspoken corollary: "If I don’t, I will harm you by frustrating the expectation I’ve just created and undermining the trust necessary for future cooperation." The feeling of binding obligation *is* the feeling of the potential fallout – the disappointment, the broken trust, the damaged relationship, the practical disarray caused by reliance. The will theorist mistakes this powerful, socially ingrained anticipation of harm for a free-standing moral fact created *ex nihilo* by the promise itself. They are smuggling in the logic of consequence (harm avoidance) while denying its foundational role. The binding force isn't conjured by the will; it's imposed by the potential wreckage of breaking faith.

  **The Cancelled Lecture: Where the Will Theory Falters and Harmlessness Prevails**

  Now, the case that keeps me up: I promise my colleague, Dr. Evans, I’ll attend her important lecture next week. She values my presence as a show of intellectual support. Later, she secretly cancels the entire lecture (say, due to illness) but tells no one. Oblivious, I skip the non-existent event, "breaking" my promise. No one was harmed: Dr. Evans didn’t expect me (she knew there was no lecture), no one relied on my attendance, no trust was damaged. On the will theory, I’ve still committed a grave moral wrong – I violated the sacred right I bestowed upon her through my act of promising. My will bound me, period.

  The derivative account delivers a more honest, albeit counterintuitive, verdict: **I committed no significant moral wrong.** Scanlon’s Principle of Fidelity (the core of his promise-keeping morality) states we have a duty not to lead others to form reasonable expectations about our future behavior and then intentionally disappoint them *when they would suffer significant loss* as a result. Here, Dr. Evans formed *no* expectation about my attendance at the non-existent lecture. My failure to show caused her no disappointment, no loss of trust, no practical setback. The conditions for moral wrongness simply aren’t met.

  So why does it *feel* like I did something wrong? This intuition is potent but misleading:

  1.  **Etiquette & Social Norms:** Breaking *any* commitment, even a harmless one, often violates social conventions. We call it "flaky," "unreliable." But confusing social awkwardness or mild disapproval with genuine *moral transgression* is a category error. Politeness isn't morality.
  2.  **Self-Image & Integrity:** *I* know I intended to break my word (until I learned otherwise). This can feel like a failure of personal integrity, a lapse in being the reliable person I aspire to be. But self-disappointment or failing one's own ideals is distinct from wronging *another person*. Morality governs our interactions with others, not necessarily our internal scorecards.
  3.  **The Institution's Shadow:** Promises *as an institution* rely on general trust. Every broken promise, even a harmless one, *could* theoretically erode that trust minutely. But this is highly abstract and attenuated harm. Holding an individual morally blameworthy for such diffuse, non-material "harm" is unfair and untethered from the concrete wrongs (disappointment, material loss) that give promise-keeping its moral gravity in the first place.

  The lecture case reveals the will theory's rigidity. It insists on moral wrongness where the essential element – harm to another stemming from created expectation – is utterly absent. The derivative account, by focusing on this concrete impact, offers a more nuanced and humane picture.

  **The Solitary Struggle: Promising Ourselves**

  What about pledging to quit smoking? On the derivative account, this isn't primarily a *moral* promise in the interpersonal sense. There's no separate promisee to form expectations or suffer harm from your failure. The "wrong" you feel is multifaceted:

  1.  **Prudential Harm:** You harm *yourself* practically (health, finances). This is a failure of prudence or self-care, not a moral wrong *to another*.
  2.  **Self-Trust & Integrity:** Repeatedly breaking resolutions damages your self-trust and sense of personal integrity. This is deeply significant, but again, it's a failure *to yourself* concerning your ideals and goals, not a moral violation of a duty *to* another person. Morality, in the interpersonal sense we've been discussing, doesn't neatly map onto self-relations.
  3.  **Implicit Social Dimensions:** Often, such resolutions *do* have interpersonal echoes. You might have vaguely promised family, or your resolution relies on social support structures. The primary "binding" force, however, remains practical and self-regarding, not a freestanding moral obligation created by an act of will directed inward.

  The derivative account doesn't struggle with "wrong to no one"; it clarifies that the strong feeling of self-betrayal belongs to a different ethical domain – personal integrity, prudence, or psychology – distinct from the interpersonal morality of promises governed by harm prevention.

  **The Unavoidable Vulnerability: Sacrificing the Sacred**

  The derivative account’s greatest strength – grounding promises in concrete human welfare – is also its most unsettling vulnerability. It sacrifices the sacredness of the promise itself. In the will theory, a promise is inviolable, a tiny moral universe created by an act of will. Scanlon makes promises contingent. If you can break one *without causing harm* (as in the lecture case), or where the harm is trivial, there is no significant *moral* wrong. This feels deeply unsatisfying for profound vows, like deathbed promises made with no witnesses and no practical consequences if broken. The derivative account must concede that, absent harm, the *moral* gravity vanishes, leaving only other considerations (personal integrity, perhaps a sense of sacredness *felt* by the promisor, but not a duty *to* the deceased). This reduction of the solemn vow to a calculus of consequences can feel cold, even profane. It forces us to admit that morality, at its core, is about how we affect other sentient beings, not about upholding abstract duties conjured by our own declarations, however solemn.

  This vulnerability is real. But it’s the price of intellectual honesty. The alternatives – inventing mystical self-binding powers or elevating social expectations into free-standing moral facts detached from human impact – create more problems than they solve. The derivative account, grounded in preventing harm and sustaining the trust necessary for human cooperation, offers the most coherent, practical, and ultimately humane explanation for why we *should* keep our promises – and when, against our intuitions, the moral ledger might actually be clear. It reminds us that promises matter because *people* matter.
