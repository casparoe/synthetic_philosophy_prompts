answer: |-
  Here's a rigorous set of standards for evaluating theories of genuine moral dilemmas, designed to help you assess the adequacy of any account you encounter. I've categorized the requirements, highlighted conflicts, and identified the critical failure point.

  **Core Definition & Non-Negotiables (Must-Haves for "Genuine Dilemma")**

  1.  **Acknowledge the Existence of Genuine Dilemmas:**
      *   **Requirement:** The theory must recognize that situations exist where an agent *cannot avoid* doing something morally wrong or failing to fulfill a stringent moral obligation, regardless of their choice. There is *no morally permissible all-things-considered option* available.
      *   **Consideration:** This is the defining feature of a genuine dilemma. Theories denying this possibility (e.g., some strict consequentialist or deontological theories) are immediately disqualified from being accounts *of* dilemmas.
      *   **Non-Negotiable? Absolutely.** This is the bedrock. Failure here means the theory isn't even trying to account for genuine dilemmas.
      *   **Critical Failure Point:** If a theory **denies the possibility of genuine dilemmas** (claiming there's always a single morally permissible choice), it has categorically "missed the point" and fails the core definition. This is the most direct disqualifier.

  2.  **Distinguish Genuine Dilemma ("No-Good-Option") from "Lesser-Evil" Scenarios:**
      *   **Requirement:** The theory must clearly differentiate between:
          *   **Genuine Dilemma (No-Good-Option):** *Every* available choice involves violating a stringent moral obligation or doing something seriously morally wrong. No option is morally permissible overall.
          *   **Lesser-Evil Choice:** There *is* a morally permissible (or even obligatory) all-things-considered choice, identified by weighing competing values/obligations correctly. Choosing the lesser evil is *the right thing to do* in that tragic situation.
      *   **Consideration:** Collapsing this distinction eliminates the core problem of dilemmas. It conflates tragic but correct choices with choices where *no correct path exists*. A theory of dilemmas must explain why the "lesser evil" in a dilemma is *still evil* (morally wrong) and not merely the best option.
      *   **Non-Negotiable? Absolutely.** Failure to make this distinction renders the concept of a "genuine" dilemma meaningless.
      *   **Conflict Alert:** Some consequentialist-leaning theories inherently struggle here, as they often frame *all* tragic choices as lesser-evil calculations where one option is obligatory.

  3.  **Preserve the "Tragic Residue" / Moral Distress:**
      *   **Requirement:** The theory must account for the strong intuition that agents in genuine dilemmas experience profound moral distress, guilt, or regret *even when they make the best choice possible under the circumstances* and even if they are ultimately not blameworthy. This lingering negative feeling isn't irrational but reflects the genuine wrong done.
      *   **Consideration:** This captures the experiential core of being caught in a dilemma. It signals that something morally significant was violated, regardless of justification or necessity. A theory that dismisses this distress as mere irrationality misses the moral gravity.
      *   **Non-Negotiable? Highly Recommended (Borderline Non-Negotiable).** While some theories might try to explain it away, a failure to capture this intuition strongly suggests the theory hasn't fully grasped the phenomenology of dilemmas. Most compelling accounts treat this residue as a crucial datum.

  **Essential Cases & Explanations (Must Get Right)**

  4.  **Handle "Sophie's Choice"-Type Cases Adequately:**
      *   **Requirement:** The theory must provide a plausible account of situations where an agent is forced to choose which of two (or more) innocent parties will suffer a terrible fate (e.g., a mother forced to choose which child dies). It must explain why choosing *either* child involves a grave moral wrong, not just a tragic necessity.
      *   **Consideration:** This is the quintessential example of a conflict between stringent, symmetric obligations (e.g., parental duty to protect each child) where violating one is unavoidable. It tests the core "no-good-option" claim.
      *   **Non-Negotiable? Absolutely.** Failure here is a major red flag. A theory that concludes Sophie *did nothing wrong* in choosing one child over the other likely collapses into lesser-evil, denying the dilemma. A theory that says *both* choices are equally wrong but offers no coherent account fails to explain the dilemma.

  5.  **Handle "Dirty Hands" Cases (e.g., Political Realism):**
      *   **Requirement:** The theory must account for situations where fulfilling a weighty public obligation (e.g., saving many lives) seems to *necessarily* involve violating a stringent personal/ethical prohibition (e.g., killing an innocent, breaking a solemn promise). It should explain why the necessary act remains morally tainted.
      *   **Consideration:** This tests the asymmetry of obligations and the idea that public necessity doesn't erase the personal moral violation. It often involves conflicts between different *types* of moral demands (e.g., consequentialist vs. deontological).
      *   **Non-Negotiable? Highly Recommended.** While interpretations of "dirty hands" vary, a robust theory of dilemmas should be able to engage with this common intuition in political/military ethics. Failure suggests the theory cannot handle asymmetric obligation conflicts.

  6.  **Handle Bernard Williams' "Jim and the Indians":**
      *   **Requirement:** The theory must engage with the intuition that Jim, offered the choice to shoot one Indian to save nineteen (while Pedro will shoot all twenty if Jim refuses), faces a profound moral burden *even if* shooting one is the lesser evil. It should explain the reluctance and sense of being "dirtied" by accepting the offer.
      *   **Consideration:** Williams used this to critique consequentialism's potential to alienate agents from their deepest projects and commitments (e.g., "I am someone who kills innocent people"). It highlights the tension between impersonal moral calculation and personal integrity.
      *   **Non-Negotiable? Highly Recommended.** This case powerfully illustrates the potential conflict between consequentialist reasoning and deep-seated moral identity/prohibitions within a dilemma-like structure. A theory ignoring this misses a critical dimension.

  **Crucial Distinctions (Must Not Collapse)**

  7.  **Distinguish the Agent's Epistemic Perspective from the Actual Moral Landscape:**
      *   **Requirement:** The theory must separate:
          *   **Epistemic Perspective:** What the agent *reasonably believes* about the situation, the options, their consequences, and the relevant obligations at the time of decision.
          *   **Actual Moral Landscape:** What was *objectively true* about the moral facts, obligations, and consequences, which may differ from the agent's beliefs (discovered later or known only to an omniscient observer).
      *   **Consideration:** This is vital for assessing blameworthiness vs. objective wrongness. An agent might blamelessly make the objectively worst choice due to ignorance, or blameworthily make an objectively necessary choice due to recklessness. The *existence* of the dilemma (whether "no good option" truly existed) depends on the actual landscape; the *agent's experience and blameworthiness* depend on their epistemic perspective.
      *   **Non-Negotiable? Absolutely.** Collapsing these leads to massive confusion about the nature of the dilemma and the assessment of the agent. A theory must account for both angles.

  8.  **Distinguish "Doing Wrong" (Objective Wrong-Making Features) from "Being Blameworthy" (Agent Culpability):**
      *   **Requirement:** The theory must clearly separate:
          *   **Doing Something Morally Wrong:** The action possesses features that make it objectively morally impermissible (e.g., violating a stringent obligation, causing grave harm without sufficient justification).
          *   **Being Blameworthy/Culpable:** The agent is an appropriate target of moral criticism, resentment, or sanction for performing the action, based on their epistemic state, intentions, alternatives, and control.
      *   **Consideration:** This is crucial for dilemmas. An agent in a genuine dilemma *does wrong* by choosing either option (as per Requirement 1), but they might *not be blameworthy* because they had no better option, acted with good intentions, and made a reasonable choice under duress. Conversely, an agent might avoid objective wrongdoing in a lesser-evil scenario but still be blameworthy if they chose recklessly.
      *   **Non-Negotiable? Absolutely.** This is perhaps the *most critical analytical distinction* for a theory of dilemmas. Failure here leads to the unjust condemnation of tragic heroes or the unwarranted exoneration of the reckless. **This distinction failing most clearly shows a theory has missed the point *after* accepting the existence of dilemmas.** If it can't separate the wrongness of the act from the culpability of the agent, it fundamentally misunderstands moral assessment in tragic contexts.

  **Important Intuitions to Preserve (Preferences/Emphases of Specific Camps - Negotiable but Desirable)**

  9.  **Preserve the Sense of Incommensurability/Incomparability:**
      *   **Requirement:** The theory should capture the intuition that the conflicting obligations/values in a genuine dilemma cannot be precisely weighed or traded off against each other on a single scale. The choice isn't just hard calculation, but involves a qualitative leap.
      *   **Consideration:** This emphasizes the tragic "loss" aspect – something of irreducible value is sacrificed regardless of choice. Rejects purely calculative models.
      *   **Non-Negotiable? Preference (Varies by Camp).** Strongly held by some (e.g., certain deontologists, value pluralists), rejected by others (e.g., consequentialists, some Kantians). A theory *can* be adequate without this, but capturing it adds depth.

  10. **Account for Moral Remainders/Residual Obligations:**
      *   **Requirement:** The theory should explain why agents often feel ongoing obligations stemming from the dilemma (e.g., to make amends, memorialize victims, reform institutions) *even after* making the necessary but wrong choice.
      *   **Consideration:** This reinforces the "tragic residue" and the idea that wrongdoing, even necessary, creates moral debts that persist.
      *   **Non-Negotiable? Preference.** Closely linked to tragic residue. A theory can explain distress without invoking formal remainders, but accounting for them provides a richer picture.

  11. **Avoid Overly Deflationary or Dissolving Accounts:**
      *   **Requirement:** The theory should not explain away the dilemmatic experience *solely* as epistemic limitation, psychological weakness, or moral confusion. While these factors play a role, the theory must acknowledge the *genuine* moral conflict at the objective level.
      *   **Consideration:** Protects the core reality of the dilemma. Overly deflationary accounts often collapse back into denying genuine dilemmas exist.
      *   **Non-Negotiable? Implied by Core Definition.** If a theory is truly deflationary, it likely fails Requirement 1.

  **Suspected Conflicts:**

  *   **Preserving Incommensurability (9) vs. Providing Action Guidance:** If obligations are truly incommensurable, how can an agent ever rationally choose? Some theories resolve this by acknowledging the necessity of choice despite incommensurability (e.g., "rational arbitrariness"), but it remains a tension.
  *   **Epistemic vs. Actual Landscape (7) & Blameworthiness (8) vs. Objective Wrongness (1 & 8):** Maintaining a strict separation between what the agent knew and what was actually true, while simultaneously holding that the agent objectively did wrong *and* might be blameless, requires careful theoretical construction. Some theories struggle to hold all these elements coherently without slippage.
  *   **Tragic Residue (3) vs. Moral Resolution:** Theories offering strong moral resolution (e.g., clear lesser-evil obligations) often struggle to explain the *depth* and *persistence* of the distress felt by agents who made the "right" choice. Conversely, theories emphasizing residue can struggle to provide clear guidance.

  **Summary of Non-Negotiables:**

  1.  Acknowledge the Existence of Genuine Dilemmas.
  2.  Distinguish Genuine Dilemma ("No-Good-Option") from Lesser-Evil.
  4.  Handle Sophie's Choice Cases Adequately.
  7.  Distinguish Epistemic Perspective from Actual Moral Landscape.
  8.  Distinguish Doing Wrong from Being Blameworthy **(Critical for Assessment)**.

  **Critical Failure Point:** Denying the existence of genuine dilemmas (Failure of Requirement 1) is the absolute deal-breaker. If a theory fails this, it hasn't even started on the topic.

  **First Major Sign of Missing the Point (Post-Acceptance):** Failure to distinguish **Doing Wrong** from **Being Blameworthy** (Requirement 8). If a theory conflates these, it fundamentally misconstrues the moral situation of the agent in a dilemma and leads to unjust assessments.

  This framework provides a robust set of criteria. Use it to interrogate theories: Do they accept the core? Can they explain the paradigmatic cases without dissolving the dilemma? Do they maintain the crucial distinctions? How do they handle the key intuitions? Good luck with your reading!
