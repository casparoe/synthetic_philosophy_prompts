  - The predictability horizon is the time at which the forecast error reaches a threshold (e.g., the standard deviation of the river flow). 
  - This time can be estimated from historical forecast errors. For example, we can compute the mean squared error (MSE) of past forecasts at different lead times and see when the MSE becomes comparable to the climatological variance.

