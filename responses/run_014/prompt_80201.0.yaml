  3. **Check the forecast against the predictability horizon**: If the forecast lead time (72 hours) is beyond the estimated predictability horizon for the current state, then the deterministic forecast should not be trusted as a single number. Instead, we should consider the entire distribution of possible outcomes.

  4. **Consider the forecast uncertainty**: If the forecast is within the predictability horizon, we still need to account for known sources of error (like initial condition uncertainty, model imperfection, etc.). However, if beyond, we must rely on climatological or historical distributions.

  5. **Make a decision on water release**: The decision will be based on the forecast if it is reliable, or on a risk-averse strategy (like releasing enough to cover a high percentile of the possible outcomes) if it is not.

