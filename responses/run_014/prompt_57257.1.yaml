prompt: |-
  I teach a graduate seminar on weakness of will and a colleague of mine over in the behavioral economics group keeps reaching for the same picture, and I want to know how much weight it can bare before I let it anywhere near my syllabus. The picture: a person with a self-control problem is like a household containing two members — a far-sighted planner who has the household's real long-run interests at heart and an impulsive doer who keeps spending the money the planner had set aside. Saving apps, hiding the credit card in a drawer, Odysseus lashed to the mast — all of these are just the planner tying the doer down. That part is descriptive. The problem is the work he makes it do. Because the planner's ends are supposedly the person's own true ends, outside help — an auto-enrollment default, a sin tax, a nudge — isn't overriding the person's will at all, it's enforcing it, so the autonomy objection just evaporates, and the doer's complaints are like the complaints of a kid who's been made to do his homework. He also says hyperbolic discounting is the mathematical version of the same story: the very shape of the discount function shows there are two agents pulling in seperate directions, and later regret is the planner saying I-told-you-so, which is why the planner's ranking gets to be the metric of welfare rather than the doer's.

  So give me the correspondence table — what plays the planner, the doer, the shared household, the budget, the tying-down, the helpful outsider — and then the audit. Which features of the household carry over and which don't, and among the ones that don't, which actually threaten his argument versus which are just cosmetic? Three things I especially want pinned down: (a) whether anything in the formal treatment of hyperbolic or quasi-hyperbolic discounting implies two agents rather than a single agent whose preference ordering shifts with the temporal perspective she happens to be taking up at the moment of choice; (b) what the analogy quietly imports about there being a true self whose preferences get to count — my suspicion is that it hands him a solved problem about aggregation and about whose preference is authoritative that the model itself never argues for, and I'd like to see exactly where the smuggling happens; and (c) whether the paternalism conclusion survives once you notice that the doer is the one who is literally present at the moment of choice while the planner is, at best, a set of dispositions laid down earlier. I should also say the analogy seems to get something right that a plain single-agent model struggles with — the phenomenology of inner conflict, and why commitment can feel like an exercise of agency rather than a restriction on it — so don't just pile up disanalogies, tell me which of them are load-bearing.

  And if you think there's a better source domain for time-inconsistent agency — a repeated game among successive selves, a thermostat, a parliament with an upper house, a principal-agent contract with hidden action, whatever you'd nominate — say which one and how far it carries before it starts begging the same questions. No bibliography needed, I just want the argument.
reasoning: |-
  Okay, the user teaches a graduate seminar on weakness of will and is grappling with a colleague's behavioral economics model that uses a two-agent household analogy. They want to critically evaluate this model before including it in their syllabus, specifically questioning its assumptions about dual agency, true selves, and paternalism. 

  Hmm, this is a sophisticated philosophical-economics crossover query. The user clearly knows their literature but suspects the analogy is doing illegitimate heavy lifting. Their three focal points (a/b/c) reveal deep concerns about agency metaphysics hiding in behavioral models. 

  First, let's unpack that household analogy. The planner/doer duality maps neatly to phenomena like commitment devices, but the user's worried about conceptual smuggling. Their suspicion about "true self" presuppositions is sharp - behavioral econ often implicitly privileges long-term preferences without justifying why. 

  On hyperbolic discounting: mathematically, it's just a preference reversal model. Nothing forces a dual-agent interpretation. The user's alternative - shifting perspectives of a unitary agent - is equally valid. That's crucial because the colleague's entire paternalism defense rests on that contested interpretation. 

  The moment-of-choice point is devastating. If the planner isn't present during temptation, calling interventions "autonomy-preserving" ignores whose will is actually operative. That's not a cosmetic flaw - it undermines the whole autonomy argument. 

  Interestingly, the user acknowledges the analogy's strengths: capturing inner conflict phenomenology and making sense of commitment as self-creation. A good critique should preserve those insights while challenging overreach. 

  For alternative models: principal-agent setups are promising but still risk privileging the principal. Successive selves games treat all time-slices equally, avoiding "true self" bias. But they struggle to explain why we identify more with some temporal perspectives. 

  The thermostat analogy is novel - no agency metaphysics, just feedback systems. But it might be too reductive for grad seminar material. Parliamentary models feel richest, showing how majority/minority coalitions shift, but still need rules to aggregate preferences. 

  Ultimately the colleague's model isn't wrong, but overclaims. The audit shows its paternalism defense depends on unsupported normative assumptions smuggled in through analogy. That's what the user needs to expose - not to discard the model, but to bracket its metaphysical baggage.
answer: |-
  Here's a breakdown of the two-agent household analogy, its correspondence to the weakness-of-will model, an audit of its load-bearing features, and alternative frameworks:

  **Correspondence Table:**

  | **Household Element** | **Model Element**                     | **Notes**                                                                 |
  | :-------------------- | :------------------------------------ | :------------------------------------------------------------------------- |
  | **Household**         | The Person                            | The unified entity encompassing both aspects.                              |
  | **Planner**           | Long-Term Preferences / Farsighted Self | Represents stable, considered goals and values (e.g., health, wealth).     |
  | **Doer**              | Short-Term Temptations / Impulsive Self | Represents immediate desires and impulses (e.g., indulgence, procrastination). |
  | **Budget**            | Resources (Time, Money, Willpower)    | What is allocated/squandered.                                              |
  | **Planner Setting Aside Money** | Forming Intentions/Plans          | Deciding on future actions aligned with long-term goals.                   |
  | **Doer Spending Money** | Succumbing to Temptation            | Acting against prior intentions due to immediate impulses.                 |
  | **Tying Down (Rope, App, Drawer)** | Commitment Devices                | External or internal constraints limiting the Doer's options.              |
  | **Helpful Outsider**  | Nudger, Policymaker, Default Rule     | External agent implementing commitment devices or altering choice architecture. |
  | **Doer's Complaints** | Experience of Constraint/Frustration  | The feeling of being restricted *in the moment* of temptation.             |
  | **Planner's "I-told-you-so"** | Later Regret                      | The retrospective judgment aligning with the Planner's perspective.        |

  **The Audit: Load-Bearing vs. Cosmetic**

  1.  **Cosmetic Disanalogies (Harmless):**
      *   **Literal vs. Figurative Agents:** No one believes in tiny homunculi. This is just vivid metaphor.
      *   **Physical Separation:** The Planner and Doer aren't in different rooms; their conflict is psychological/intrapersonal.
      *   **Communication:** They don't literally argue; conflict manifests as urges vs. resolutions, tension, regret.
      *   **"Household" as Container:** The "household" adds little beyond personifying the unity. The "Person" is sufficient.

  2.  **Load-Bearing Disanalogies (Threatening the Argument):**
      *   **(a) Dual Agency vs. Shifting Perspective (Threatens Descriptive Accuracy & Necessity):** The analogy **strongly implies two distinct agents**. However, hyperbolic/quasi-hyperbolic discounting **only mathematically describes inconsistent choices over time**. It is **perfectly consistent** with a single agent whose *valuation* changes dramatically based on temporal proximity. At t1 (distant perspective), the agent prefers larger-later (LL). At t2 (imminent perspective), the agent prefers smaller-sooner (SS) over LL. This is a *shifting preference ordering within one agent*, not necessarily evidence of two warring sub-agents. The analogy smuggles in ontological dualism where the math only shows functional inconsistency. The colleague's claim that "the very shape... shows two agents" is an **interpretation**, not a mathematical implication.
      *   **(b) The "True Self" Smuggle & Welfare Metric (Threatens Normative Foundation):** This is the **core problem**. The analogy **assumes**:
          *   The Planner *is* the "real" person/household ("has the household's real long-run interests at heart").
          *   The Planner's preferences *are* the person's "true" preferences.
          *   Therefore, the Planner's preferences define welfare ("the planner's ranking gets to be the metric of welfare").
      *   **Where the Smuggling Happens:**
          1.  **In the Planner's Characterization:** Calling it the "far-sighted planner who has the household's *real* long-run interests at heart" already loads the dice. Why are "long-run" interests more "real"? Why is farsightedness privileged? The model doesn't argue for this; it *defines* the Planner this way, importing a normative commitment.
          2.  **In Equating "Planner" with "Person":** The household *is* the person, but the Planner is defined *as* the entity representing the "real" interests *of* the person. This circularly defines the person's "true" interests as the Planner's interests.
          3.  **In Dismissing the Doer:** The Doer is framed as an impulsive spender, a "kid" needing control. There's no sense the Doer might represent *other* genuine values (immediacy, pleasure, relief, spontaneity) or information (current visceral state, changing circumstances). The analogy implicitly dismisses the Doer's perspective as illegitimate *by definition*.
      *   **The Threat:** This smuggles in a **contested normative claim** (long-term, cool-state preferences are authoritative) as a **descriptive fact** about the model's structure. It solves the aggregation problem ("whose preferences count?") by fiat, privileging one temporal perspective. The formal discounting model alone does **not** justify this; it merely shows inconsistency. Justifying the Planner as the "true self" requires *additional, independent normative argument* the analogy obscures.
      *   **(c) Presence at Choice & Paternalism (Threatens Autonomy Defense):** The analogy suggests the Planner's will is being enforced. But crucially, **at the moment of choice when the "paternalistic" intervention binds the Doer (or prevents the choice), the Planner is absent.** The Planner exists only as a *past* intention or a *disposition* formed in a different state. The **only agent phenomenologically present and actively willing *in that moment* is the Doer**. The intervention *overrides the expressed will of the agent present at the time of action*.
      *   **Why this threatens the paternalism defense:** The claim that "outside help... isn't overriding the person's will at all, it's enforcing it" relies entirely on identifying the *person's will* solely with the *absent Planner's past will*. It dismisses the agency and perspective of the *present-moment self* making the choice. The autonomy objection doesn't evaporate; it's redirected. You must argue *why* the past Planner's will should trump the present Doer's will in defining the person's autonomy *at the moment of constrained action*. The analogy masks this by making the Planner seem like the constant, rightful boss, when in reality, the temporal locus of agency matters.

  **What the Analogy Gets Right (Its Legitimate Load):**

  *   **Phenomenology of Conflict:** It vividly captures the *experience* of inner struggle between resolution and temptation, feeling "of two minds."
  *   **Function of Commitment:** It effectively explains why commitment devices (tying down) feel like *self*-binding, an *exercise* of agency (the Planner acting) rather than just an external restriction. It makes sense of pre-commitment as self-governance.
  *   **Source of Regret:** It intuitively links later regret ("I-told-you-so") to the reassertion of the long-term perspective.

  **Alternative Source Domains & Their Carrying Power:**

  1.  **Successive Selves as Players in a Repeated Game:**
      *   **How it Carries:** Each "time-slice" self is an independent player interacting strategically over time. Hyperbolic discounting emerges as a subgame-perfect equilibrium where earlier selves don't trust later selves. Commitment is a binding contract between temporal selves.
      *   **Where it Breaks/Begs Questions:** Still requires defining the welfare of the "person" across time. Which self's payoff counts? Do we average? Maximize the minimum? The aggregation problem remains. It might over-emphasize strategic conflict and under-emphasize the unity of identity. Doesn't inherently privilege the long-term self.
      *   **Advantage:** Avoids strong "true self" implications; treats all temporal perspectives as agents. Makes strategic sense of pre-commitment.

  2.  **Principal-Agent Model:**
      *   **How it Carries:** The Planner is the Principal (owner, long-term interest). The Doer is the Agent (actor, short-term interest). Hidden action (the Doer's choices are hard to monitor/control perfectly by the Planner) leads to the conflict. Commitment devices are monitoring/control mechanisms or incentive contracts set by the Principal.
      *   **Where it Breaks/Begs Questions:** Who is the ultimate "self"? Why is the Planner the Principal? This model most strongly begs the "true self" question – it *assumes* the Principal's interests *are* the interests of the whole. The autonomy objection is directly analogous to the Agent's complaint about restrictive controls imposed by the Principal. The welfare metric problem is central: the Principal's utility function defines welfare.
      *   **Advantage:** Formal economic framework, handles hidden action well.

  3.  **Parliamentary Model (Inc. Upper House):**
      *   **How it Carries:** The "self" is a parliament. Different factions/parties (impulses, values, long-term goals) debate and vote. The Planner might be a persistent coalition or an "upper house" (cooler, slower deliberation). Weakness of will is a shift in the governing coalition. Commitment is a constitutional rule binding future votes.
      *   **Where it Breaks/Begs Questions:** How are preferences aggregated? Majority rule? Supermajority? Who sets the rules? What defines the "will of the parliament" (person)? Still faces the aggregation problem. Why should the "Upper House" (Planner) have veto power? The paternalism question becomes: can an external force impose voting rules that favor a specific faction, claiming it represents the "true" will of the parliament?
      *   **Advantage:** Captures diversity of motivations and internal deliberation. Less binary than two agents. Constitutional rules model commitment well.

  4.  **Thermostat / Control System:**
      *   **How it Carries:** A unitary system with a set point (long-term goal). Disturbances (temptations) cause deviations. Commitment is raising the threshold needed for a disturbance to trigger a response or reducing the signal strength of the disturbance (hiding the cake).
      *   **Where it Breaks/Begs Questions:** Too mechanistic/reductive. Lacks agency, phenomenology of conflict, and reasons. Doesn't model choice, just deviation/correction. Welfare is trivially defined by the set point – but who sets it? Begs the same "true goal" question implicitly.
      *   **Advantage:** Avoids agency metaphysics entirely. Simple functional picture.

  **Conclusion:**

  The two-agent household analogy is a powerful heuristic for describing the *experience* of conflict and the *function* of commitment devices. Its **critical flaws** are **load-bearing** for your colleague's argument:

  1.  **It falsely implies dual agency is *required* by hyperbolic discounting** (a single agent with shifting perspectives suffices).
  2.  **It smuggles in the normative claim that the Planner is the "true self"** by definition, solving the preference aggregation/welfare metric problem by fiat without justification from the formal model.
  3.  **It masks the autonomy objection** by ignoring that "paternalistic" interventions override the *present-moment* will of the agent (the Doer), privileging an absent past self (the Planner).

  **Recommendation for Syllabus:** Use the analogy *descriptively* to illustrate conflict and commitment, but immediately subject it to rigorous critique focusing on points (a), (b), and (c) above. Contrast it explicitly with the shifting unitary agent interpretation of discounting models and explore the unresolved normative questions about aggregation, authority, and the temporal locus of autonomy. The Parliamentary or Successive Selves models offer richer, less normatively loaded starting points for discussion, though they ultimately confront similar questions about intertemporal welfare. The core issue isn't the analogy itself, but the unargued normative weight placed upon it.
