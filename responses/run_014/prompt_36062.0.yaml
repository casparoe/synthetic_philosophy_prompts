prompt: |-
  ok so, novelist here, and i'm stuck on something that turns out to be a philosophy problem wearing a plot problem's clothes. My next book is narrated by a coroner in a decaying coastal town, and the whole novel turns on whether she can bring herself to sign a death certificate for something that might not have ever been alive, or might still be. For it to work, the thing cant just be mysterious — the coroner (and the reader) needs to be able to fully understand what the thing is and what it does, and STILL not know if it counts as alive. The uncertainty has to come from the concept, not from ignorance of the facts. So here's what I want.

  Construct me the scenario. One paragraph, written in a literary register I could basically drop into the book, not textbook voice. It has to meet these specs:

  1. Once all the facts about the thing are on the table, at least two mainstream definitions of life give opposite verdicts. Not "unclear what it does" — full information, still a split. I'm imagining the NASA-flavored definition (self-sustaining chemistry plus the capacity for Darwinian evolution) on one side and an autopoiesis-style definition (a system that produces and maintains its own boundary and its own parts) on the other, but if you have a better pairing, go with yours — just tell me what you're using.
  2. It has to split along an interesting line, not the tired ones. No viruses, no prions, no fire, no crystals, no mules or worker bees, no computer programs, and none of that Gaia move where the whole biosphere gets to be the organism. Every essay on this goes to one of those and my eyes glaze over.
  3. It has to be placeable in a literary novel set roughly now — no space opera, no physics we don't have. And the coroner has to plausibly be the person who has to deal with it, so give it some connection to remains, decay, bodies, or an institution like a hospital or a morgue.

  Then after the paragraph, do the walkthrough for me as if I'm smart but not a biologist. State each definition, give its verdict on your thing, and explain the verdict in terms of the specific features you built into the case — not in generalities about how definitions differ. Then be honest with me about the engineering: which single feature of the scenario is doing all the work, what happens to the split if that feature gets removed (does it collapse back into a boring virus-style borderline case, or does something else hold it apart), and how a defender of the definition that comes out "dead" would say I rigged it.

  Last thing, and this one matters: tell me which verdict the coroner should come to in the end — not because it's the philosophically right answer, but because of what each choice does to the novel. Some context that might help: she's a narrator who needs the dead to stay dead, professionally and maybe personally, and I haven't decided whether that need is her flaw or her spine. If you can tell me what a death certificate means when it's signed on something the definitions can't agree on, that's the sentence I actually need for the book.
reasoning: |-
  Okay, the user is a novelist stuck on a philosophical problem disguised as a plot issue. They need a scenario for their novel where a coroner must decide whether to sign a death certificate for something that might or might not be alive. The key is that the uncertainty comes from conflicting definitions of life, not lack of information.

  First, I need to understand the requirements clearly. The scenario must:
  1. Present an entity that, with full information, gives opposite verdicts under two mainstream definitions of life.
  2. Avoid clichéd examples like viruses or fire.
  3. Fit into a contemporary literary setting with a coroner involved.
  4. Be written in a literary style that can be dropped into the book.

  The user suggests using NASA's definition (self-sustaining chemistry plus capacity for Darwinian evolution) versus autopoiesis (self-producing and maintaining boundaries and components). That's a good starting point. I need to create something original.

  Brainstorming ideas: Maybe something that evolves chemically but doesn't maintain itself? Or something that maintains itself but doesn't evolve? Needs to be organic and related to a morgue setting. Perhaps something involving decomposition or symbiotic systems.

  What about a symbiotic entity formed during decomposition? Like a biofilm or microbial mat that emerges from a corpse but becomes its own system. That could work in a coastal town with damp conditions. But biofilms might be too alive under both definitions.

  Another idea: A chemical reaction system that arises during decomposition, creating self-replicating structures. Maybe mineral-based? But the user said no crystals. Avoid that.

  Ooh, what about a prion-like protein that catalyzes its own formation but also builds structural membranes? Wait, prions are excluded. Need something else.

  Perhaps a synthetic biology angle? Like a protocell or chemical ecosystem. But has to be plausible now, not sci-fi. 

  What if it's a byproduct of modern burial practices? Like embalming fluid interacting with environmental bacteria, creating a new entity. That could be interesting. 

  Developing that: In a decaying coastal town, moisture and salt accelerate decay. A corpse treated with experimental embalming polymers gets exposed to coastal microbes. The polymers and microbes form a symbiotic system—microbes metabolize the polymer, producing energy, while the polymer self-assembles into compartments that protect the microbes. 

  This system:
  - Under NASA definition: It has self-sustaining chemistry (microbes metabolize polymer, polymer provides structure). Capacity for evolution? If the microbes evolve to better metabolize the polymer and the polymer's assembly changes based on microbial activity, that could mimic evolution. But the polymer itself doesn't evolve genetically; it's the microbial part that does. So NASA might say it's alive because the microbial component evolves.
  - Under autopoiesis: The whole system produces and maintains its boundary (polymer membranes) and internal components (microbes produce enzymes that maintain the polymer). So it might qualify.

  But does this clearly split? The microbial part is alive, but the polymer isn't. The system as a whole might be seen as alive under autopoiesis but not NASA if NASA requires genetic evolution.

  Refining: Make the polymer a synthetic protein that can undergo selective changes without genetic material. Maybe it has variants that replicate better in certain conditions, like a form of chemical evolution. Then:
  - NASA: Self-sustaining chemistry yes, and if the polymer variants are selected based on stability, that's like Darwinian evolution without genes. So alive.
  - Autopoiesis: The system maintains boundaries and components. Also alive. No split.

  Need more tension. What if the polymer doesn't evolve but the microbes do? Then NASA might say only microbes are alive, not the whole system. But autopoiesis might consider the whole system as a self-producing network.

  Still messy. 

  Another idea: A tissue-engineered organoid that escaped from a lab. But might be too sci-fi. The user wants contemporary.

  What about a complex slime mold-like entity found on a corpse? Slime molds are already borderline, but the user wants something new.

  Perhaps a necrobiome—the community of organisms decomposing a body—that starts exhibiting coordinated behavior. But that might be too similar to Gaia.

  Need originality. 

  Let's think about chemical gardens or silica-carbonate structures. They form self-assembling tubes that look organic. But they don't evolve.

  Unless... what if in the presence of specific bacteria, these structures incorporate organic material and the bacteria direct the mineral formation? Then the mineral structures protect the bacteria, and the bacteria's metabolism determines where minerals deposit. Over time, different bacterial strains produce different structures, and if one structure is more stable, that strain outcompetes others. That's evolution-like.

  But minerals aren't typically considered alive. 

  Make it a synthetic biology product: A company creates "biodegradable" burial pods that use engineered bacteria to decompose bodies quickly. The bacteria are designed to secrete a polymer that forms a sac around the remains. The sac maintains conditions for the bacteria but eventually breaks down. 

  However, in a coastal environment, salt causes the polymer to crystallize differently, becoming more stable. The crystallized polymer isn't metabolized by the bacteria, so it persists. The bacteria inside evolve to feed on the polymer itself, altering their metabolism. Now the sac is maintained by the bacteria (they secrete repair enzymes), and the bacteria depend on the sac for protection from salt. 

  But does the sac itself have the capacity for evolution? The bacterial genes evolve, but the sac's structure changes based on bacterial activity, not its own inheritance. 

  So:
  - NASA: The bacteria are alive, but the sac is a byproduct. No independent evolution, so not alive.
  - Autopoiesis: The entire system—bacteria plus sac—produces and maintains itself. The boundary (sac) is produced by bacteria, and bacteria are maintained by the sac. So alive.

  That's a split. The sac isn't alive alone, but the system might be.

  Call the entity a "carrion-sac." Found on a body in the morgue. The coroner sees it as a strange growth. Analysis shows it's a symbiotic system with evolving bacteria and a self-repairing polymer matrix. 

  Literary paragraph: Describe it as a shimmering sac enveloping organs, with internal currents. It persists even after the body is removed, growing slowly by drawing minerals from the air. When damaged, it seals itself. Microbiologists confirm the bacteria evolve rapidly, but the sac's structure changes too slowly to evolve in a Darwinian sense. 

  Definitions:
  - NASA: Life requires self-sustaining chemical system and capacity for Darwinian evolution. Here, the bacteria evolve, but the sac doesn't on its own. The whole system isn't a unit of evolution; only bacteria are. Verdict: not alive.
  - Autopoiesis: The system maintains its boundary (sac) and internal components (bacteria, enzymes) through bacterial secretions and polymer self-assembly. Verdict: alive.

  The key feature is the dual nature: The sac and bacteria are interdependent but only the bacteria evolve. If you remove the polymer's self-repair, autopoiesis fails. If you make the polymer evolve independently, NASA might call it alive.

  Critics: NASA defenders might say the sac is just scaffolding, not part of life. Autopoiesis defenders might argue the system is a cohesive unit.

  For the novel, the coroner signing the certificate represents her need for certainty. Signing it (declaring dead) might be her denying ambiguity, which could be her flaw. Not signing keeps the uncertainty alive, which might be more honest but unsettling. The sentence: Signing a death certificate for something undecidable is either "a kindness to the living" or "a lie that makes the world make sense."

  Coroner's choice: Should not sign, accepting ambiguity, showing growth. Or sign, reinforcing her need for order, leading to consequences when the sac persists.
