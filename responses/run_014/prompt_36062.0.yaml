  Here is the scenario paragraph, designed for your novel's voice, followed by the breakdown and narrative implications:

  **Scenario Paragraph (Literary Register):**  
  *It crouched in the stainless-steel basin like a collapsed lung made of oil-slick and salt rime—a viscous sac, fist-sized, peeled from the pleural cavity of the drowned logger they pulled from the estuary mud. It wasn’t tissue, not exactly: more a membrane-thick slurry of decaying cellulose fibers, iron-rich silt, and microbial mats woven into something that breathed. Not metaphorically. Cut it, and the edges puckered closed, sealing itself with a weep of briny fluid. Feed it estuary water and trace minerals through a tube, and it swelled, its internal currents quickening, spinning waste into complex sugars that sustained the microbes within. Yet it never divided, never changed its fundamental blueprint. It just… persisted. Like a wound that refused to scar. Like a self-repairing tomb for the dead algae and bacteria that birthed it. The microbiologists called it an ‘estuarine chemo-organism’; the fishermen called it ‘grave-slick’. It consumed. It healed. It maintained its own rotting integrity against the entropy of the coastal damp. And now it lay inert on her slab, the currents stilled, the membrane leaching opacity like a fading bruise. Did it die? Or did it merely cease functioning? The death certificate demanded her signature, but the weight in her gut wasn’t ignorance. It was the terrifying clarity: she knew exactly what it was, and knowing changed nothing.*

  ---

  **Walkthrough for the Novelist:**

  1.  **The Definitions & The Thing's Features:**
      *   **Definition 1: NASA-Style (Self-Sustaining Chemical System + Capacity for Darwinian Evolution):**
          *   **Verdict: NOT ALIVE.**
          *   **Why, based on the scenario:** The "grave-slick" has impressive self-sustaining chemistry: it takes in estuary water and minerals, converts them via internal microbial action into energy and complex sugars, and uses this to maintain its structure and heal damage. *However*, it lacks the **capacity for Darwinian evolution**. It never divides or reproduces ("never divided, never changed its fundamental blueprint"). It's a singular, persistent entity. There's no population, no variation, no inheritance, no selection pressure acting on replicators. The microbes *inside* it evolve, but the *system itself* does not generate heritable variation or produce offspring subject to selection. It's a static, self-maintaining chemical engine, not an evolving lineage.
      *   **Definition 2: Autopoiesis (Maturana & Varela - A system that continuously produces and maintains its own components and the boundary that defines it as a unity):**
          *   **Verdict: ALIVE.**
          *   **Why, based on the scenario:** The grave-slick is a masterpiece of self-production. Its boundary membrane isn't just a passive sack; it's **actively produced and maintained** ("Cut it, and the edges puckered closed... sealing itself"). Its internal components – the complex sugars, the microbial mats, the fluid matrix – are **continuously produced and regenerated** from external inputs ("Feed it estuary water and trace minerals... it swelled, its internal currents quickening, spinning waste into complex sugars that sustained the microbes within"). It defines its own spatial and functional unity ("maintained its own rotting integrity"). It's a closed network of processes that create the very components and boundary that constitute the network itself. It's a persistent, self-making *process* arising from the interaction of decaying organic matter and estuary chemistry.

  2.  **The Engineering & Honest Critique:**
      *   **The Single Feature Doing the Work:** **The complete absence of reproduction/division while possessing robust self-maintenance and repair.** This is the core tension.
      *   **What Happens if Removed:** If the grave-slick *could* divide or bud off smaller versions of itself (even imperfectly), the NASA definition would likely declare it alive, as the potential for evolution through variation and selection in its "offspring" would exist. It would collapse towards a more conventional (and arguably boring) borderline case, like a very simple, slow-reproducing organism. The autopoiesis verdict wouldn't change, making the split vanish. Conversely, if you removed the *active self-repair and internal component production* (e.g., if it was just a passive lump that microbes lived *on*, not *within as an integrated system*), autopoiesis would likely declare it not alive, while NASA still wouldn't care without reproduction. Again, the split collapses.
      *   **How the "Dead" Camp (NASA) Says You Rigged It:** A defender of the NASA definition would argue you've carefully constructed a fascinating *byproduct* of life (microbes) and chemistry, but not a new life form itself. They'd say: "You've taken the metabolic *output* of evolving microbes trapped in a self-sealing matrix formed by decay processes and called *that matrix* alive. But the matrix doesn't *evolve*. It's just sophisticated chemistry enabled by the *actual* living things inside it and the environmental conditions. It's a really complex compost heap or a particularly persistent biofilm scab – impressive, but not a unit of life. You've conflated the activity *within* the bag with the bag itself being alive. The capacity for evolution resides solely in the microbes, not the 'grave-slick' system as a distinct entity."

  3.  **The Coroner's Verdict & The Meaning of the Certificate:**
      *   **Narrative Context:** Your coroner *needs* the dead to stay dead. This is her professional anchor and likely a psychological bulwark against the messy ambiguity of existence, decay, and perhaps personal loss. Signing the certificate isn't just paperwork; it's imposing order, finality, and control over the chaos of death.
      *   **The Choice & Its Novelistic Impact:**
          *   **Signing (Declaring it Dead):** This reinforces her need for certainty and control. It's the "safe" professional choice, upholding the legal framework that defines her world (death certificates are legal documents first). **This choice likely emphasizes her FLAW.** It shows her clinging to a rigid definition (perhaps implicitly favoring the NASA view, or just the legal precedent of "no reproduction = not alive") to avoid confronting the profound, unsettling ambiguity the thing represents. It might offer temporary relief but leaves a lingering unease – did she lie to herself? What if it "wakes up"? It could foreshadow a later crisis when the ambiguity resurfaces violently or personally. The act becomes: *"A death certificate signed for the undecidable is the coroner's last rite, not for the body, but for her own need to believe the world bends to definitions."*
          *   **Not Signing (Refusing to Declare it Dead/Alive):** This is the act of confronting the ambiguity head-on. It's professionally risky, potentially career-ending ("failure to certify"), and deeply unsettling. **This choice likely emphasizes her SPINE.** It shows her prioritizing the terrifying truth (the genuine philosophical impasse) over professional comfort or societal expectation. It forces her (and the town) to live with the unresolved mystery. This opens rich narrative avenues: institutional pressure, scientific interest, local superstition flaring around the "undead slick," and her own psychological journey grappling with the implications for death, life, and her role. The act becomes: *"Refusing the pen was her oath to the dead, whispered not to corpses, but to the vast, unsettling silence where definitions dissolved."*
      *   **Recommended Verdict (For Narrative Power):** **She should NOT SIGN.** Why?
          1.  **Higher Stakes:** It immediately creates conflict (with authorities, colleagues, maybe the logger's family wanting closure) and raises the central ambiguity from an intellectual puzzle to an active, unresolved force in the story.
          2.  **Character Arc Potential:** It forces her out of her comfort zone of definitive endings. Does this refusal harden her? Break her? Lead her to seek answers? It directly challenges her "need for the dead to stay dead," making it the core conflict.
          3.  **Thematic Resonance:** It keeps the philosophical question alive (pun intended) within the narrative, allowing you to explore its implications through ongoing events and character reactions, rather than resolving it prematurely.
          4.  **The Sentence:** *"Signing a death certificate for something the definitions couldn't kill was either an act of mercy for the living or the final betrayal of the truth that flickered, unresolved, in the morgue's cold light."*

  The grave-slick scenario provides the factual clarity needed for genuine philosophical tension, avoids clichés, fits your setting perfectly, and offers a powerful fulcrum for your coroner's internal and external conflicts. The choice she makes about the certificate isn't about biology; it's about who she is when faced with the abyss of uncertainty her profession usually shields her from. Good luck!
