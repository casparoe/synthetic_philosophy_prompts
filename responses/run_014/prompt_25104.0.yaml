answer: |-
  Here's a reconstruction and critique of the asymmetry you've observed, followed by the requested JSON summary:

  ### Reconstructed Theory of Political Legitimacy
  The practice presupposes a **modified Rawlsian public reason liberalism**, where coercive laws must be justified by reasons that are "accessible" to all reasonable citizens. However, it implicitly defines "accessibility" in a way that systematically excludes religious doctrines while accepting secular comprehensive views.

  ---

  ### (1) The Supposed Principle
  **Principle:** Coercive laws must be justified by reasons grounded in *shared human reason* (e.g., empirical evidence, logical deduction, or neutral procedural values) rather than *reliance on non-falsifiable authority* (e.g., sacred texts or revelation).

  This principle aims to exclude justifications requiring acceptance of specific epistemic authorities (like religious institutions) while permitting those derived from purportedly universal rational methods.

  ---

  ### (2) Defensibility of the Distinction
  **The distinction is largely indefensible.** The rationale collapses under scrutiny:
  - **False Accessibility:** Utilitarianism requires accepting *interpersonal utility comparisons* and *radical impartiality*; Kantianism rests on *synthetic a priori truths* about autonomy. These are no more "accessible" to someone rejecting their foundations than biblical stewardship is to an atheist.
  - **Epistemic Parity:** Both religious and secular doctrines rely on contestable metaphysical premises (e.g., "utility is the sole good" vs. "the land is sacred"). Neither is derivable from neutral observation.
  - **Hidden Bias:** The practice privileges Enlightenment-derived rationalism as "neutral," while framing religious reasoning as sectarian. This reflects historical power dynamics, not philosophical coherence.

  **Verdict:** The asymmetry rests on a **mistake** – conflating "secular" with "universally accessible" and "religious" with "esoteric." True accessibility would require excluding *all* contested comprehensive doctrines.

  ---

  ### (3) Consistent Application
  If the underlying principle ("only reasons accessible to all reasonable people") were applied consistently:
  - **All comprehensive doctrines** (religious, utilitarian, Kantian, etc.) would require "translation" into a **thinner justificatory layer**.
  - **The "thinner" layer** would consist of:
    - Freestanding **political values** (e.g., equality, basic liberties, public order).
    - **Minimal instrumental reasons** (e.g., "this reduces traffic congestion").
    - **Procedural fairness** (e.g., "this followed democratic consultation").
  - **Practical Result:** Legislators could *use* comprehensive doctrines privately but would justify laws publicly via:
    - Overlapping consensus ("This policy serves liberty, public health, and fairness").
    - Pragmatic outcomes ("This meets agreed-upon safety standards").
    - Neutral procedures ("This resulted from a citizen assembly").

  ---

  ### Structured Summary (JSON)

  ```json
  {
    "practice_description": "Public institutions require coercive laws to be justified by 'public reasons,' excluding religious comprehensive doctrines but permitting secular ones like utilitarianism or Kantianism.",
    "presupposed_principle": "Laws must be justified by reasons grounded in shared human reason without reliance on non-falsifiable authority.",
    "asymmetry_rationale": "Secular doctrines are presumed accessible via universal rational faculties, while religious doctrines depend on contested epistemic authorities.",
    "is_defensible": false,
    "consistent_version": "All comprehensive doctrines (secular and religious) must be translated into freestanding political values, instrumental outcomes, or procedural fairness.",
    "rival_theories": [
      {
        "name": "Perfectionism",
        "gloss": "Allows state promotion of substantive goods (religious or secular) if deemed objectively valuable."
      },
      {
        "name": "Deliberative Democracy",
        "gloss": "Permits all reasons in public debate but requires mutual justification through dialogue."
      },
      {
        "name": "Critical Theory",
        "gloss": "Rejects 'neutrality' as illusory and focuses on exposing power imbalances in reason-giving."
      },
      {
        "name": "Integralism",
        "gloss": "Explicitly privileges religious authority as foundational to legitimate governance."
      }
    ]
  }
  ```

  ### Key Philosophical Takeaway
  The asymmetry persists not due to principled coherence but because **secular Enlightenment frameworks are hegemonically treated as "default" in liberal institutions**. A rigorous commitment to public justification would either:
  - **Exclude all comprehensive doctrines** (requiring a thin, political consensus), or  
  - **Permit all doctrines** but demand reciprocal engagement (e.g., Habermas' "translational" duty).

  Neither option is currently practiced consistently – revealing the asymmetry as a **cultural bias masquerading as neutrality**.
