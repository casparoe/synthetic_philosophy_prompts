  Okay, the user is an 11th-grade student rep on a committee rewriting their school's discipline code. They need to give a 3-minute speech advocating for restorative justice over out-of-school suspension at a public comment night. The audience includes skeptical parents, ex-cop board members, supportive teachers, and observing students. The user believes in determinism and rejects "basic desert" but worries that expressing this directly could alienate the audience and lose the vote. They also want to incorporate philosophical concepts from their class without jargon.

  First, I need to address their core concern: how to advocate for restorative justice without explicitly stating determinism or denying desert, which might turn off the audience. The key is framing. Instead of leading with philosophy, start with shared values—safety, accountability, growth. Everyone wants a safe school; the disagreement is about methods.

  Next, the parent's objection needs to be acknowledged upfront. They likely think restorative justice is lenient, letting kids off the hook. The user mentioned parents saying things like "we're letting kids off the hook." So, the speech must directly counter this by showing restorative justice as tough but constructive.

  Now, which philosophical concepts can be used subtly? Pereboom's "basic desert" is central but can't be named. Instead, focus on outcomes: suspensions don't fix behavior; they escalate harm. Semicompatibilism (Fischer) allows responsibility without alternative possibilities. This can be presented as "accountability isn't about punishment but making amends."

  Strawson's reactive attitudes vs. objective attitude is crucial. The user fears viewing students as objects to fix. The speech must emphasize engagement—restorative justice requires offenders to face those they hurt, which is more demanding than passive suspension. Galen Strawson's luck argument shows that factors beyond control influence actions, so we should focus on what can be controlled: repairing harm.

  Frankfurt cases and the consequence argument might be too complex to explain briefly. Better to imply that even if actions are determined, responsibility involves responding constructively. The speech should stress that the goal is changing future behavior, not retribution.

  Structure-wise, the first 15 seconds need to hook with shared values. Then, present restorative justice as true accountability, contrasting with suspension's ineffectiveness. Address parent concerns by redefining "toughness." Highlight the community aspect—repairing harm instead of exclusion. End with a call to action, framing RJ as the courageous choice.

  Technical choices: Avoid jargon. Use "accountability" instead of "responsibility," "repair" instead of "basic desert." Emphasize that RJ requires active engagement, countering the "soft" perception. Mentioning the student's role as a rep adds credibility.

  The trickiest part is balancing determinism without stating it. The speech implies that past-focused punishment is ineffective, shifting focus to future change. This aligns with semicompatibilism but remains practical. The least confident point is whether skeptical parents will buy the reframing of accountability. However, stressing RJ's demanding nature might resonate.
answer: |-
  Here’s a focused, philosophy-grounded speech that navigates your constraints while staying true to your core view, followed by breakdown notes and confidence assessment.

  **The Speech (3 minutes, ~400 words):**

  "Good evening. I’m [Your Name], the student representative on the discipline code committee. I’m here tonight asking you to choose restorative justice not because it’s *easier*, but because it demands *more* real accountability than suspension ever can.

  I know the fear: that by moving away from suspensions, we’re letting kids off the hook. I hear that. But let’s be honest about what suspension *actually* does. It removes a student. It doesn’t address the harm done. It doesn’t ask them to understand the impact of their actions on others. It doesn’t help them learn how to make things right. It just pushes the problem out the door, often making it worse for them and for the community they return to. Is that really ‘holding them accountable’? Or is it just making them disappear?

  Restorative justice flips the script. It says true accountability isn’t about suffering as payback for a past action we might not fully control. It’s about taking responsibility for the harm caused *right now*, in this community. It means sitting in a circle, facing the person you hurt, hearing how your actions landed, and being part of figuring out how to repair that damage. That takes guts. That’s hard. That requires owning your actions directly.

  Think about it. Which approach truly respects the person harmed? Being told the offender was sent away? Or having that offender listen to your pain and commit, face-to-face, to making amends? Which approach truly challenges the person who caused harm? Sitting alone at home? Or being confronted with the real human consequences of what they did and having to actively contribute to fixing it?

  This isn’t about being soft. It’s about being smart and truly just. Suspension pretends accountability is about taking punishment passively. Restorative justice demands active responsibility: understanding, repairing, and committing to change. It treats students not as objects to be simply fixed or punished, but as people capable of understanding consequences and capable of growth – people we *expect* to step up and fix what they broke.

  We have a chance to build a discipline system that doesn’t just react, but repairs and prevents. One that fosters real responsibility instead of resentment. I’ve seen how suspension fails. I believe in the tough, necessary work of restoration. Please vote for a system that asks more, not less, of our students and our community. Thank you."

  ---

  **Brainstorm & Technical Notes (The Choices Made):**

  1.  **First 15 Seconds:** Establish credibility (student rep, committee member), state the core ask (restorative justice), and immediately reframe the core parental objection ("letting kids off the hook") by asserting RJ demands *more* accountability. This disarms the primary opposition point upfront.
  2.  **Heavy Lifters (The 2-3 Ideas):**
      *   **Pereboom's "Basic Desert" vs. Forward-Looking Responsibility:** This is the core engine. The speech *never* says "no one deserves blame/suffering." Instead, it relentlessly contrasts *punishment as payback* (suspension) with *responsibility as repair and future change* (RJ). It argues the latter is the only meaningful form of accountability ("true accountability isn’t about suffering as payback... It’s about taking responsibility..."). This implicitly rejects basic desert without saying the triggering words.
      *   **Strawson's Reactive Attitudes vs. Objective Attitude (Your Worry):** The speech directly counters your fear. It portrays RJ *as engaging the reactive attitudes*, but constructively. The offender faces the victim, hears the anger/hurt (reactive attitudes), and must respond. This is presented as *more* respectful and demanding than the "objective" suspension (treating them like a "busted toaster" to be removed). "Treats students not as objects... but as people capable of understanding consequences and capable of growth" directly addresses this.
      *   **Fischer's Semicompatibilism (Responsibility without Alternative Possibilities):** This is subtly woven in. The speech focuses entirely on *guidance control* – holding students responsible for the actual choices they made ("owning your actions directly," "being part of figuring out how to repair") and their capacity to respond to reasons ("capable of understanding consequences," "commit to change"). It avoids *any* reliance on "could have done otherwise." The focus is on the actual action, its consequences, and the agent's capacity to engage in repair *now*.
  3.  **Parental Objection (In Their Words):** "We're just letting kids off the hook!" / "They need to face real consequences!" / "This is soft; they won't learn." The speech addresses this head-on in the second paragraph, reframing RJ as the *tougher*, more consequential path.
  4.  **Where to Stop:** End firmly on the core contrast – suspension = passive punishment (less accountability), RJ = active responsibility (more accountability) – and frame the vote as choosing a system that "asks more." Ends on a call to action rooted in the core argument.
  5.  **What Got Cut & Why:**
      *   **Consequence Argument & Frankfurt Cases:** Explicitly discussing "could have done otherwise" is a rabbit hole in 3 mins. Semicompatibilism bypasses this debate effectively for this context.
      *   **Galen Strawson's Regress/Luck:** Too meta and abstract. The practical focus on outcomes (what suspension *does* vs. what RJ *does*) is more persuasive.
      *   **Manipulation Argument:** While related, it distracts into sci-fi edge cases not relevant to school discipline policy.
      *   **Explicit Determinism/Free Will Talk:** The speech *implies* the underlying view by rejecting backward-looking desert and focusing on forward-looking reasons-responsiveness, but avoids the philosophical terminology entirely. The structure *does* the philosophical work without naming it.
  6.  **Jargon-Free Execution:** All concepts are translated into practical actions and outcomes: "payback" (basic desert), "taking responsibility for the harm caused" (semicompatibilist responsibility), "facing the person you hurt" (reactive attitudes), "treats students not as objects" (rejecting pure objective attitude), "active responsibility" (forward-looking, repair-focused).
  7.  **Core Technical Choice:** Prioritizing Pereboom (rejecting desert) + Fischer (keeping responsibility via reasons-responsiveness) + P.F. Strawson (framing RJ as engaging reactive attitudes constructively). This triad provides the strongest, most coherent foundation for the argument within the time limit.

  **Confidence & Uncertainty Assessment:**

  *   **Confidence in Speech Structure & Core Argument (High - 85%):** I'm highly confident this structure effectively addresses the political reality (parental fears, need for "toughness") while rigorously embedding your philosophical stance. It turns the "soft" accusation on its head by arguing RJ is *harder* and *more* accountable. The focus on practical consequences (what suspension fails to do, what RJ requires) is the most persuasive path.
  *   **Confidence in Philosophical Grounding (High - 80%):** The use of Pereboom, Fischer, and P.F. Strawson is accurate and does significant work. It avoids the pitfalls you fear (smuggling desert back in, treating people like objects) and stays true to a determinism-compatible view of responsibility.
  *   **Confidence in Persuading *This Specific* Audience (Moderate - 65%):** The arguments are sound and tailored, but changing minds deeply invested in retributive models is hard. The ex-cop board members are a wild card. The speech gives them a "tough accountability" framework they *might* respect.
  *   **The Point of Least Certainty (15%):** **Whether the reframing of RJ as "demanding *more* real accountability" will successfully land with skeptical parents.** It's logically sound and strategically necessary, but if their definition of accountability is *solely* "inflicting proportional suffering," they might remain unconvinced. This is the inherent risk, but it's the only honest and strategically viable approach given your views. Leaning into the victim's perspective ("Which approach truly respects the person harmed?") is the best counter here.

  **Final Advice:** Deliver this with conviction. Emphasize "real accountability," "demands more," "taking responsibility," "facing the person," "active responsibility," and "tough, necessary work." Your passion for a *better* system, grounded in this thoughtful approach, will resonate stronger than any attempt to hide your core beliefs. Good luck! You've got this.
