  ## Term Paper Proposal: The Pasadena Paradox and the Permutation Invariance Criterion for Well-Posed Decision Problems  

  **1. Core Question:**  
  Is the Pasadena paradox fundamentally a failure of decision problem specification rather than a limitation of expected utility theory (EUT)? Specifically: When is an infinite decision problem *well-posed* such that it warrants the application of EUT? I propose that a necessary condition for well-posedness is **permutation invariance of the expected utility summation**: the expected value must remain invariant (or converge absolutely) under all order-preserving bijections (permutations) of the state space. The Pasadena "game" fails this test, revealing it as ill-posed—not a genuine decision problem but a pathological artifact.  

  **2. The Pasadena Paradox & Existing "Fixes" (The Gap):**  
  The paradox involves a game where a fair coin is flipped until heads appears on trial *n*, yielding payoff *(-2)ⁿ/n* dollars. The expected value is the conditionally convergent series *Σ (-1)ⁿ/n*, which can be rearranged to sum to any real number or diverge. Standard responses fall short:  
  - **Weak Expectations/Regularization** (e.g., Colyvan & Hájek): Assign a "privileged" sum (e.g., *-ln(2)* via natural order). This is *ad hoc*—it arbitrarily fixes one ordering while ignoring that reordering yields any value, undermining objectivity.  
  - **Dominance/Relative Expectation** (e.g., Easwaran): Compare acts via dominance or truncated expectations. Fails as no strategy dominates, and truncation limits are order-dependent.  
  - **Decision-Theoretic Silence** (e.g., Seidenfeld et al.): EUT doesn’t prescribe a choice; agents should avoid the game. This is correct but *unexplanatory*—it doesn’t diagnose *why* EUT fails, treating the problem as legitimate but unsolvable.  
  **The Gap:** All approaches implicitly accept the problem’s formulation as valid. They miss that the paradox stems from *contingent structure*—the payoff’s dependence on an arbitrary ordering of states. The "gap" is a lack of criteria for when an infinite decision problem is structurally sound for EUT application.  

  **3. Proposed Approach & Methodology:**  
  I will develop and defend a **permutation invariance criterion** (PIC) for well-posed infinite decision problems:  
  - **Formalization:** Define PIC rigorously: A decision problem is well-posed only if its expected utility series converges absolutely, or (if conditionally convergent) is invariant under all permutations of the state space induced by natural bijections. The Pasadena game fails PIC spectacularly.  
  - **Case Studies:**  
    - *Pasadena Game:* Demonstrate how PIC diagnoses its pathology—its EV is order-relative, so it’s ill-posed.  
    - *St. Petersburg Paradox:* Contrast with PIC—its EV diverges absolutely (Σ (1/2^n)*2^n = Σ 1 → ∞), so permutations don’t change the outcome (∞). PIC deems it well-posed (though still normatively challenging).  
    - *Finite Analogues:* Show finite games trivially satisfy PIC since all summations are absolutely convergent.  
  - **Objection Handling:** Test PIC against potential counterexamples:  
    - Does PIC over-restrict? E.g., ban reasonable infinite problems? Analyze cases with non-identical distributions (e.g., a game with state-dependent probabilities) where PIC may still hold if payoffs decay sufficiently.  
    - Is PIC under-restrictive? E.g., allow other pathological games? Scrutinize variations (e.g., "Altadena" with shifted payoffs).  
  - **Philosophical Justification:** Argue that PIC reflects a pre-theoretic constraint: coherent preferences should not depend on arbitrary labeling of states.  

  **4. Success Criteria & Risks:**  
  - **Successful Paper:**  
    - Clearly articulates PIC as a novel, defensible necessary condition for well-posedness.  
    - Resolves the Pasadena paradox by showing it’s ill-posed, sidestepping summation debates.  
    - Distinguishes Pasadena from St. Petersburg and finite cases, preserving their legitimacy.  
    - Addresses major objections without collapsing into triviality or overbreadth.  
  - **Failure Modes:**  
    - PIC is too strong: It deems plausible infinite problems (e.g., with slow payoff decay but absolute convergence) ill-posed.  
    - PIC is too weak: New pathological games satisfy PIC but still produce order-dependence.  
    - The "natural bijection" clause is irredeemably vague, making PIC non-operational.  

  **5. Scope for One Semester:**  
  - Focus exclusively on *single-agent, under-risk* problems (known probabilities).  
  - Center analysis on Pasadena/St. Petersburg and 2–3 key variants (e.g., Altadena, a convergent-but-order-sensitive example).  
  - Formalize PIC mathematically but avoid overly technical measure-theoretic extensions.  
  - Acknowledge but defer discussions of ambiguity aversion, sequential choice, or subjective probability.  
  - Goal: A conceptual proof-of-concept for PIC, not a complete decision theory overhaul.  

  **Why This Matters:**  
  This project shifts the focus from *fixing* EUT to *qualifying* its domain. If successful, it reframes the Pasadena paradox as a cautionary tale about problem specification—advancing decision theory’s foundations by clarifying when infinite problems merit solution attempts.  

  ---  
  **Word Count:** ~650 (excluding this line). *To reach 1500 words, expand:*  
  - Detailed literature review on existing Pasadena responses.  
  - Technical appendix defining PIC formally.  
  - Extended case studies (e.g., Altadena, non-identical distributions).  
  - Deeper discussion of "natural" permutations vs. arbitrary relabelings.  
  - Connections to foundational issues (e.g., de Finetti’s exchangeability).
