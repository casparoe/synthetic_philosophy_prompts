  Okay, let me start by unpacking the user's query. They're a novelist struggling with how readers perceive omissions in their stories. Specifically, whether a character's inaction causes subsequent harm. The examples given are a father not intervening in his son's bullying and a woman resigning without exposing her employer's fraud. The key observation is that readers' judgments vary based on narrative elements like social roles, inner deliberation, and psychological depth.

  First, I need to recall philosophical concepts related to causation by omission. The user mentions counterfactual dependence—would the harm have occurred if the person acted? But they note that readers don't rely solely on this. Instead, narrative elements sway opinions. So, where does philosophy address the gap between counterfactuals and moral judgments?

  I remember the doing vs. allowing distinction. Philosophers like Philippa Foot and Jonathan Bennett discuss this. Allowing harm might not be seen as causing it, but roles change that. A parent has a duty, so their omission feels more like causing harm. The user noticed this with social roles. That connects to agent-relative duties. If a character has a responsibility, their inaction is more blameworthy. 

  Then there's the concept of moral luck. Nagel talks about how circumstances affect moral judgment. The same omission might be judged differently based on factors beyond control, like being in a role. The user's point about inner life making omissions feel deliberate ties here. If the character deliberates, the omission feels intentional, thus more causal. 

  The user also mentions dissociation reducing perceived causation. This relates to control and intentionality. If the character is overwhelmed, their inaction seems passive, not a choice. So autonomy matters. Frankfurt's ideas on identification might apply—whether the omission reflects their will. 

  The user's deeper need might be understanding why narrative techniques influence perception, possibly to manipulate reader sympathy or moral judgment in their writing. They might want philosophical terms to ground their themes or justify character development. Terms like "normative salience" or "agent-relativity" could help them structure scenes. Also, the concept of "narrative causation" isn't standard, but it encapsulates their observation. 

  I should also consider practical implications. The novelist can use these concepts to subtly guide readers. For example, fleshing out a bystander's thoughts makes their silence more culpable. Conversely, depicting a parent's trauma can mitigate blame. The philosophical framework provides tools to intentionally craft these perceptions. 

  Finally, synthesizing the terms: the core issue is the attribution gap. Philosophers might call the role-based aspect "role-dependent duties," the deliberation part "intentional omission," and psychological passivity "attenuated agency." The narrative influence ties into how moral responsibility is constructed through storytelling, which intersects with narrative ethics. Highlighting these terms can give the user a lexicon to analyze and discuss their work more deeply.
answer: |-
  Your observation is profoundly insightful, and philosophy *absolutely* has concepts to dissect this phenomenon. While no single term perfectly captures the *narrative dependency* you describe, several well-established distinctions converge here, explaining why reader judgments shift based on role, deliberation, and psychological depth. Here's the breakdown:

  1.  **Causation by Omission vs. Allowing Harm:**
      *   **The Core Distinction:** Philosophers explicitly debate whether *not acting* can be a genuine *cause*. Counterfactual dependence ("If X had acted, Y would not have happened") is necessary but often *insufficient* for attributing *causal responsibility* (and thus moral blame) to the omission itself. Instead, we often say the person *allowed* the harm caused by the primary agent (the bullies, the fraudster).
      *   **The Gap:** Your readers intuitively grapple with this gap. Those saying the father/bystander "merely allowed" it focus on the bullies/fraudster as the active, primary cause. Those saying the omission "caused" it are attributing a stronger form of responsibility to the inaction, implying the harm wouldn't have happened *but for* that specific failure.

  2.  **Doing vs. Allowing Harm (with Normative Weight):**
      *   **Philippa Foot, Judith Jarvis Thomson, Jonathan Bennett:** This distinction goes deeper. Generally, *doing* harm (actively causing it) is seen as morally worse than *merely allowing* the same harm to occur (failing to prevent it when you could). This explains the baseline intuition that the stranger/former employee is less responsible than the parent.
      *   **The Role Effect:** This distinction is heavily modulated by **duties and roles**. A parent has a *strong positive duty* to protect their child. A doctor has a duty to aid their patient. Failing in this duty makes their omission not just "allowing" but a *violation* that fundamentally changes the moral landscape. Their inaction becomes a *failure to fulfill an obligation they uniquely held*, making it feel much more like an active cause of the subsequent harm. Conversely, a stranger generally lacks such a specific, demanding positive duty.

  3.  **Intentional Omission vs. Non-Intentional Failure:**
      *   **The Deliberation Effect:** You've hit on a crucial point. When an omission is depicted as a *deliberate choice* – weighing options and deciding *not* to act – it transforms psychologically and morally. Philosophers (like those working on intentions, actions, and omissions, e.g., Michael Bratman) would argue:
          *   A deliberate omission is an **intentional action of refraining**. It involves the same mental states (belief, desire, intention) as a positive act. It's a *decision* manifested as inaction.
          *   An omission arising from chaos, dissociation, ignorance, or overwhelming incapacity lacks this intentional structure. It feels more like something that *happened to the character* rather than something they *chose*.
      *   **Moral Responsibility Link:** Intentional omissions are far more readily attributed with moral responsibility than unintentional failures. Readers intuitively grasp this. Rendering the inner deliberation makes the omission feel like a *chosen action* ("He *decided* not to intervene"), thus making it causally potent in the narrative and morally blameworthy.

  4.  **Agent-Relative vs. Agent-Neutral Reasons/Obligations:**
      *   **Bernard Williams, Thomas Nagel:** This distinction explains the power of roles. An **agent-relative** obligation binds a specific individual because of *who they are* or *their relationship* (e.g., a parent's duty to *their* child). An **agent-neutral** obligation applies to everyone equally (e.g., a general duty not to murder).
      *   **The Role Effect (Revisited):** The parent's duty is quintessentially agent-relative. The harm to *his son* triggers *his specific, unique duty*. This makes his omission a direct violation of a powerful, personalized obligation, amplifying its causal and moral weight. The stranger's potential duty (if any) is weaker and more agent-neutral ("one should help prevent harm"). The former employee's duty might be debated (whistleblowing), but it's generally weaker than the parent's.

  5.  **Moral Luck (Circumstantial):**
      *   **Nagel, Williams, Martha Nussbaum:** This concept acknowledges that moral judgments are often influenced by factors outside the agent's control. Your characters are judged partly based on the *circumstance* of their role (parent vs. stranger) or the *circumstance* of their psychological state (deliberate vs. dissociative) during the omission. Luck plays a role in whether they are *in the position* where their omission is seen as causal.

  **Synthesizing the Concepts & Naming the Phenomenon:**

  The phenomenon you describe – **the varying attribution of causal and moral responsibility for omissions based on narrative elements like role, deliberation, and psychological vividness – sits at the intersection of these distinctions.**

  *   **Role** primarily taps into **agent-relative duties** and the **doing/allowing distinction modulated by obligations**. A role creates a specific duty, turning a potential "mere allowing" into a culpable failure to act, making the omission feel more causal.
  *   **Deliberation/Inner Life Vividness** primarily taps into the **intentionality of the omission** and the **psychological basis for moral responsibility**. A depicted deliberation turns the omission into an *intentional act of refraining*, making it feel like a direct cause chosen by the agent.
  *   **Psychological Passivity/Chaos** primarily negates intentionality and potentially reduces **control**, weakening the link between the agent and the outcome.

  **What to Call This Narrative Phenomenon?**

  Philosophy doesn't have a single, universally agreed-upon term *just* for this narrative effect, but we can describe it precisely:

  1.  **"The Attribution Gap for Omissions"**: Highlights the space between counterfactual dependence and the assignment of causal/moral responsibility, which narrative elements fill.
  2.  **"Normative Salience in Causal Attribution"**: Emphasizes how the perceived *normative weight* (duty, intention) makes the omission "salient" or prominent as a cause in the reader's mind.
  3.  **"Role-Dependent and Intention-Modulated Causal Responsibility for Omissions"**: A precise but clunky description capturing the core factors.
  4.  **"Narrative Construction of Omissive Causality"**: Focuses on how the *storytelling itself* builds (or undermines) the perception of the omission as a cause.

  **The Nearest Philosophical Distinction:**

  The **Doing/Allowing distinction, heavily qualified by Agent-Relative Duties and the Intentionality of the Omission**, is the closest well-mapped territory. Your workshop disagreements are essentially debates about whether the character's inaction falls on the "allowing" side (less causal/moral weight) or whether factors like role and deliberation push it towards the "doing" side (more causal/moral weight, akin to causing).

  **Why This Matters for Your Writing (Conceptually):**

  Understanding these philosophical underpinnings empowers you to *intentionally manipulate* reader perception. By controlling the depiction of:
  *   The **strength and specificity of the character's role/duty** (parent vs. bystander).
  *   The **clarity and deliberateness of their choice *not* to act** (showing the conscious decision).
  *   The **psychological state** framing the omission (agentic choice vs. overwhelmed passivity).
  ...you directly influence whether readers perceive the omission as a pivotal, causal force in the narrative's tragedy or a passive background condition. You are navigating the complex philosophical terrain where inaction transforms into morally significant action through narrative context. This isn't just a writing technique; it's an exploration of how we understand agency, responsibility, and cause in the human condition.
