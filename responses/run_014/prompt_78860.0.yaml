prompt: |-
  I teach a ninety-minute session next week in a graduate applied ethics seminar, and the topic is consequentialist cluelessness. There are about fifteen students; they are comfortable with expected-value reasoning and have enough ethics behind them to be quick and a little overconfident. Several do effective-altruism-adjacent work, so they arrive believing uncertainty is essentially solved: assign credences, multiply, compare, proceed. Do not explain cluelessness to me. Plan the explanation.

  The session has to be built around a distinction I want to draw, and I need the plan to test it rather than assume it. The first half is causal cluelessness: we cannot trace the path from act to outcome because the chain is long, chaotic, or open-ended, so we cannot assign probabilities to outcomes in the first place. The second half is evaluative cluelessness: suppose the outcome distribution were handed to us, and we still could not compare the outcomes, because the comparison needs a common measure we do not have — the values at stake are not commensurable, or the moral status of the beings in the relevant outcomes is itself unsettled. I want students to leave able to say why cluelessness threatens the action-guidingness of consequentialism rather than its truth, and able to distinguish it from three neighbours they will inevitably collapse it into: ordinary empirical risk, moral uncertainty, and plain ignorance that better research would cure.

  If my distinction does not survive contact with a ninety-minute session — if one half collapses into the other, or into moral uncertainty, or if the two halves need the same examples and the same defusing moves — then say so plainly, tell me which half to drop, and tell me what to teach in its place.

  Structure the response under these headings, in this order, with roughly these lengths.

  **Starting point** (about 150 words). The one premise that must be in place before cluelessness is even visible to this audience as a problem, and why nothing later in the session works if this premise is not accepted first.

  **Order of construction** (about 500 words). The sequence in which the components must be introduced, with the dependency made explicit at each step: what has to be understood before the next thing can be stated, and why the obvious alternative order fails. Include where the two halves of my distinction enter, and where — if anywhere — the standard replies should appear. I want the problem to have bitten before any reply is offered; tell me if that is a mistake at this level.

  **The carrying example** (about 350 words). My candidate is a grantmaker choosing between a deworming programme with well-measured near-term effects and a campaign to shape AI policy whose effects run through decades of political contingency. Give me a verdict on it: can it carry both halves of the distinction or only the causal half? What must the carrying example have, and what must it lack, for the whole session to hang on it? If it fails, tell me what to replace it with and why the replacement works better.

  **Misconception map** (about 400 words). The misconceptions this audience will bring or form, each with the point in the sequence where it should be headed off and the specific move that defuses it. I am expecting at least these: that cluelessness amounts to knowing nothing and therefore to paralysis; that expected value absorbs it, since one can always widen the credences; that cluelessness just is moral uncertainty; that it is an objection to consequentialism specifically rather than to any act-based view; and the overcorrection that we should therefore stick to near-term measurable interventions. Add any I have missed. Say which single misconception, left unaddressed, poisons the rest of the session.

  **Check for understanding** (about 200 words). One question to put to the room at the end, what a good answer contains, and what an answer that sounds right but has not understood the distinction contains. Also one thing to watch for during discussion that would tell me the idea has not landed even if nobody objects.

  **Deliberate omissions** (about 150 words). What to leave out at this level and how to say so without seeming evasive — I would rather name the thing I am skipping and give the reason than have someone raise it and derail the last ten minutes.
reasoning: |-
  Okay, the user is teaching a graduate applied ethics seminar on consequentialist cluelessness and needs a detailed lesson plan. Let me start by understanding their main requirements. They want to introduce a distinction between causal and evaluative cluelessness without assuming it holds. The session must challenge students who are overconfident in expected-value reasoning, especially those into effective altruism.

  First, I need to establish the starting point. The key premise is the action-guiding requirement of consequentialism. If students don't accept that, the problem of cluelessness won't register. I should emphasize that consequentialism demands knowing which act maximizes value, which sets up the later issues.

  Next, the order of construction. I have to introduce causal cluelessness first since it's more intuitive. Start with examples like long-term interventions where causal chains are unpredictable. Then move to evaluative cluelessness, using scenarios with incommensurable values. Standard replies like widening credences should come after the problem is clear, so students see why those solutions fall short.

  The carrying example is a grantmaker choosing between deworming and AI policy. Deworming shows causal cluelessness due to unpredictable long-term effects. AI policy might touch on evaluative aspects if it involves value conflicts, but it's weak there. I should suggest pairing it with a different example, like population ethics, to better illustrate evaluative cluelessness.

  Misconceptions are crucial. Students might conflate cluelessness with moral uncertainty or think expected value can absorb it. The most dangerous misconception is that cluelessness equals total ignorance, leading to paralysis. This must be addressed early to prevent disengagement.

  For understanding checks, a good question is how causal and evaluative cluelessness threaten action-guidingness differently. Watch for students using examples interchangeably, which indicates confusion. Deliberate omissions should include decision theories other than expected utility and non-consequentialist views, explaining that the focus is on consequentialism's internal challenge.

  I need to ensure the distinction between causal and evaluative cluelessness holds. The AI example might not clearly separate them, so suggesting a paired example for evaluative cluelessness is better. Also, emphasizing that evaluative cluelessness isn't moral uncertainty but about commensurability is key. If the distinction collapses, dropping evaluative cluelessness might be necessary, but the user wants to test it. So structuring the session to compare both halves and see if students can differentiate them through discussion and examples.
answer: |-
  Here’s a structured plan for your session, testing your distinction while targeting student misconceptions:

  ---

  ### **Starting Point**  
  The essential premise is **consequentialism’s action-guiding requirement**: agents must identify which act *maximizes value* (e.g., well-being, preference satisfaction). Without this, cluelessness isn’t a problem—it’s just "we don’t know everything." Consequentialism *demands* comparative outcome assessments to prescribe acts. If students reject this (e.g., "consequentialism only requires trying"), cluelessness dissolves into generic uncertainty. Anchor this with a quick poll: *"Can consequentialism tell us what to do if we can’t compare outcomes?"* Consensus here is non-negotiable.

  ---

  ### **Order of Construction**  
  1. **Causal cluelessness first** (intuitive, empirical):  
     - **Why first?** Students grasp probability gaps. Use the deworming vs. AI policy example: near-term outcomes (deworming) allow reliable EV estimates; long-term/chaotic chains (AI policy) make outcome probabilities *incomputable* (e.g., predicting 2070 geopolitics).  
     - **Dependency:** Requires prior acceptance of action-guidingness. If skipped, students default to "more data solves this."  
     - **Problem bite:** Stress that *no* credence assignment is defensible here—not just low confidence.  

  2. **Introduce standard replies (midway)** after causal cluelessness bites:  
     - *"Can’t we use wider distributions/subjective probabilities?"* → Rebut: Arbitrary credences violate rationality (e.g., fanatical priors).  
     - *"Research will reduce uncertainty!"* → Rebut: Some systems are *chaotic* (e.g., climate-AI interactions); no research closes epistemic gap.  
     - **Timing:** Defang overconfidence *before* evaluative cluelessness, which is harder.  

  3. **Evaluative cluelessness second** (conceptual, not empirical):  
     - **Why after causal?** Students confuse it with moral uncertainty. Use a *new* example: "Suppose we *know* Outcome A creates 10^10 happy digital minds; Outcome B creates 10^5 biological humans. Which is better?"  
     - **Dependency:** Requires understanding that causal cluelessness isn’t the only barrier. Contrast: "Here, outcomes are clear—but comparing them requires a common measure we lack (e.g., moral weight of digital vs. biological life)."  
     - **Avoid collapse:** Emphasize this isn’t "I don’t know my values" (moral uncertainty) but "no common currency exists *even with perfect information*."  

  **Why not reverse order?** Evaluative first feels abstract/metaphysical; students dismiss it as "just philosophy." Causal cluelessness hooks them with tangible epistemic limits.  

  ---

  ### **The Carrying Example**  
  **Verdict:** Deworming vs. AI policy *works for causal cluelessness only*. AI policy’s long causal chain illustrates probability gaps vividly. But it *fails evaluative cluelessness*—AI outcomes (e.g., "democratic governance" vs. "authoritarian lock-in") *presume* commensurable values (e.g., well-being).  

  **Fix:** **Pair it with a dedicated evaluative example.**  
  - Keep deworming/AI for causal half.  
  - For evaluative: Use **population ethics**. *"Outcome A: 10 billion people at 80% well-being. Outcome B: 5 billion at 100%. Which maximizes value?"* → Reveals incommensurability (total vs. average utilitarianism; non-identity problems).  
  **Why better?** Outcomes are defined but incomparable without arbitrary weighting. Distinction holds.  

  ---

  ### **Misconception Map**  
  | Misconception | When to Defuse | Defusing Move |
  |---------------|---------------|--------------|
  | "Cluelessness = total ignorance → paralysis" | After introducing causal | *"It’s not ‘know nothing’—we know outcomes are incomparable/unpredictable. Consequentialism lacks tools, but other theories (e.g., deontology) may still guide action."* |
  | "Expected value absorbs it via wider credences" | During standard replies | *"Arbitrary credences yield arbitrary prescriptions. Consequentialism requires *warranted* comparisons."* |
  | "Cluelessness = moral uncertainty" | Start of evaluative half | *"Moral uncertainty: ‘I don’t know if digital beings matter.’ Evaluative cluelessness: ‘I know they matter, but incommensurably with biological life—no common scale exists.’"* |
  | "Only affects consequentialism" | During recap | *"Any theory requiring outcome comparisons (e.g., pragmatic deontology) faces this. Consequentialism is vulnerable because maximization is core."* |
  | "Stick to measurable interventions!" | Conclusion | *"That’s one response! But consequentialism can’t *endorse* it without comparing measurable vs. non-measurable outcomes—which is clueless."* |
  | **Most toxic if unaddressed:** "Cluelessness is ordinary ignorance" → Poisons the session by making students dismiss it as a practical hiccup. Defuse immediately in causal section by contrasting chaotic vs. complex-but-knowable systems.  

  **Added misconception:** "We can default to short-term EV." → Rebut: *Consequentialism evaluates long-term outcomes; ignoring them is ad hoc.*  

  ---

  ### **Check for Understanding**  
  **Question:** *"How does causal cluelessness threaten consequentialism differently than evaluative cluelessness?"*  
  - **Good answer:** Distinguishes barriers: causal = *can’t assign probabilities* to outcomes (epistemic); evaluative = *can’t compare values* even with outcomes (axiological). Both undermine action-guidingness uniquely.  
  - **Misleading answer:** Blurs lines (e.g., "Both mean we lack data") or conflates with moral uncertainty ("We need to clarify our values").  

  **During discussion:** Watch for **example misassignment**. If students use causal examples (e.g., AI policy) to "explain" evaluative cluelessness, the distinction hasn’t landed.  

  ---

  ### **Deliberate Omissions**  
  - **Non-consequentialist responses:** "We’ll skip whether virtue ethics avoids cluelessness—focus is whether consequentialism *internally* fails its own standard."  
  - **Decision theory beyond EV:** "We’re bracketing risk-weighted/maximin models to isolate cluelessness as distinct from aversion to uncertainty."  
  - **Metaphysical debates** (e.g., "Do values exist?"): "We’re assuming moral realism for today—cluelessness arises even if values are objective."  
  **Justification:** Frame omissions as "focusing on the core problem"—avoids derailment while signaling intentionality.  

  ---

  ### **Verdict on Your Distinction**  
  **It holds** if you:  
  1. Use separate examples (AI policy for causal; population ethics for evaluative).  
  2. Explicitly contrast evaluative cluelessness with moral uncertainty.  
  **If time runs short, drop evaluative cluelessness** (causal is more accessible). Replace it with **"Why cluelessness ≠ moral uncertainty"**, using the same examples to show how axiological gaps differ from unsure values.
