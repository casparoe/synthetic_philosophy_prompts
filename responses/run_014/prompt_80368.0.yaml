answer: |-
  Below is a decision tree addressing your core question of bankroll sizing, grounded in Kelly criterion mathematics and the key tradeoffs you described. The tree prioritizes conceptual clarity and logical coherence, with branch nodes representing fundamental philosophical splits (edge certainty, risk tolerance, horizon) and leaves specifying concrete positions. It explicitly handles the "fractional vs. full Kelly" debate by separating **edge uncertainty** from **risk of ruin** concerns.

  ### Decision Tree: Bankroll Sizing for Small Positive-Edge Sports Model
  ```mermaid
  graph TD
  A[Start: I have a model suggesting a small edge] --> B{Is my estimated edge <br> statistically significant?}
  B -->|No: Wide confidence intervals, <br> small sample, or p>0.05| L1[No bet / Minimal bet<br>• Awkward: May miss true edge<br>• Requires patience]
  B -->|Yes: Tight CIs, p<0.05, <br> survives backtests| C{Am I more concerned about <br> overestimating my edge <br> than underestimating?}
  C -->|Yes: Cost of overbetting <br> (ruin) >> cost of underbetting <br> (slower growth)| D{Risk tolerance to <br> drawdowns/ruin?}
  D -->|High: Can absorb 50%+ drawdowns, <br> bankroll is disposable| L2[0.5-0.7x Kelly<br>• Awkward: Grows 25-50% slower than full Kelly<br>• Still vulnerable to bad luck]
  D -->|Low: <20% drawdowns acceptable, <br> bankroll is critical| L3[0.1-0.3x Kelly<br>• Awkward: Growth ~10% of full Kelly potential<br>• May feel overly conservative]
  C -->|No: Trust my point estimate; <br> symmetric error cost| E{Horizon and ruin <br> constraints?}
  E -->|Finite: Need to hit $X <br> in <5 years| L4[0.6-0.8x Kelly<br>• Awkward: Suboptimal for both growth and safety<br>• Compromise position]
  E -->|Effectively infinite| F{Can I reload/recover <br> from ruin?}
  F -->|Yes: Backers, deep pockets, <br> no emotional cost| L5[Full Kelly<br>• Awkward: 13.5% risk of 50% drawdown<br>• Volatility may trigger doubt]
  F -->|No: Bankruptcy = game over| L6[0.7-0.9x Kelly<br>• Awkward: Voluntarily sacrifices ~10-30% growth<br>• 'Rational cowardice']
  ```

  ### Key Explanations & Distinctions
  1. **Edge Significance (Branch B)**  
     - Splits on whether your edge is measurable beyond noise. "Significant" means:  
       - p-value <0.05 on historical bets, OR  
       - Confidence interval doesn't include zero after 100+ trials.  
     - *Why it matters*: Non-significant edges make Kelly math invalid (growth rate optimizes noise).

  2. **Edge Uncertainty Asymmetry (Branch C)**  
     - **Core disagreement**: Fractional advocates (left branch) emphasize *Knightian uncertainty* – your model's edge is an estimate with error bars. Overbetting (f>f*) destroys growth logarithmically, while underbetting costs growth linearly. Full Kelly defenders (right branch) assume known probabilities.  
     - **Mathematics**: True growth rate 𝙶(𝚏) = 𝙿𝚕𝚗(𝟷+𝚋𝚏) + 𝚀𝚕𝚗(𝟷−𝚏) for win prob 𝙿, loss prob 𝚀, odds 𝚋.  
       - If 𝙿 is overestimated by 10%, 𝙶(𝚏*) can turn negative.  
       - If 𝙿 is exact, any 𝚏<𝚏* guarantees slower growth.

  3. **Risk of Ruin (Branches D, F)**  
     - Drawdown aversion ≠ edge uncertainty. Protects against *variance* and *bad sequences* even with perfect edge knowledge.  
     - Full Kelly has 13.5% risk of 50% drawdown; half Kelly has ~1.7% risk.

  4. **Horizon (Branch E)**  
     - Finite horizons break Kelly's infinite-bets assumption. Overbetting may be "optimal" to hit targets (e.g., 2x Kelly maximizes P(hitting 2x bankroll)).

  5. **Leaves Explained**  
     - **L1**: Mandatory if edge isn't proven. Betting without significance = gambling.  
     - **L2/L3**: Fractional Kelly as *uncertainty hedge*. Robust to model error but sacrifices growth.  
     - **L4**: Finite horizons require balancing growth probability against ruin probability.  
     - **L5**: Theorectically optimal *only* with exact probabilities and no bankruptcy risk.  
     - **L6": Partial hedge against variance without abandoning growth (e.g., half Kelly has 75% of growth with 25% of variance).

  ### Why Some Paths Are Unattractive/Unexplored
  - **Full Kelly with uncertain edge (C→Yes→E→Infinite→F:No)**: Incoherent – uncertainty invalidates f* optimality. Leads to high ruin risk.  
  - **Over-Kelly (e.g., 2x Kelly)**: Only rational for finite horizons with stretch targets. Guarantees negative growth long-term per Kelly math: max 𝙶(𝚏) at 𝚏*, and 𝙶''(𝚏)<0.  
  - **No-bet with significant edge**: Theoretically irrational for growth maximizers, but psychologically common.

  ### The Fractional vs. Full Kelly Split
  The tree isolates the debate to **Branch C**:  
  - **Fractional defenders** (take the "Yes" branch) believe:  
    *Edge estimates are unreliable, and the penalty for overbetting (ruin) dwarfs the penalty for underbetting (slower growth).*  
  - **Full Kelly advocates** (take the "No" branch) counter:  
    *If probabilities are known, any f<f* is irrational for infinite-horizon growth maximizers – it's leaving money on the table.*  

  Your intuition about asymmetry is correct: The derivative of growth w.r.t. betting fraction is steeper for f>f* than f<f*, making estimation errors more costly on the high side.

  ### Recommendation for Your Case
  Given a $3-4k bankroll and "small edge":  
  1. **Quantify edge uncertainty**: Run Monte Carlo simulations with your historical bets. If 95% CI includes zero, you're at L1.  
  2. **If edge is significant**, start at **0.3x Kelly** (L3) if drawdowns >20% would cause psychological failure, **0.5x Kelly** (L2) otherwise.  
  3. **Re-evaluate quarterly**: As sample size grows, edge uncertainty shrinks – you may migrate rightward in the tree (e.g., L2 → L6 → L5).  

  This balances growth optimization with survival while you gather data. Never jump to full Kelly (L5) without 500+ bets and razor-sharp CIs.
