   But note: the Kelly criterion is f* = (bp - q)/b for a bet that pays b:1 and win probability p, q=1-p. The growth rate is maximized at f*. If you overestimate p, then you will bet too much and your growth rate can become negative (which leads to ruin). Underestimation just leads to a lower growth rate.

