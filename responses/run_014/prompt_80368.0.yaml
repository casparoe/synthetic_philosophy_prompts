   Branch 4: Are you able to use leverage (borrow money) if needed?
     - Note: This branch is only relevant in some cases, but we can include it for completeness.

   However, we must note that some combinations might be rare. Also, the Kelly criterion is defined for bets that can be repeated and where the bettor can reinvest the entire bankroll.

   We'll design the tree with the following branch nodes:

   Node 1: Is your edge positive and reliably estimated? (High confidence in edge)
     - Yes: Go to node 2.
     - No: Then you might not have an edge -> consider no bet or minimal bet until you gather more data.

   Node 2: Are you solely focused on long-run growth and not concerned with volatility or risk of ruin?
     - Yes: Then full Kelly is optimal for maximizing growth rate in the long run (if edge is known exactly).
