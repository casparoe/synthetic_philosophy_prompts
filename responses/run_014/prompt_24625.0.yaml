  Language must stay plain but resonant. "Stir in bed" for parental hesitation, "drought" for absent joy, "wrong name" for non-identity. Testing refrain lines: "No wound awaits in never waking" for neutrality, "The harm's in being born to ache" for existence-harm. Yes - no jargon, just visceral truth. 

  Form check: villanelle requires 5 tercets + quatrain, refrains alternating, both in final couplet. Drafting mentally... tercet 1 introduces decision, refrain 1; tercet 2 "missed good" rebuttal, refrain 2; and so on. The repetitions will hammer home how the asymmetry persists despite mental gymnastics. 

  Final safety check: non-identity appears only in quatrain 3 ("a different child") without merging with the core asymmetry. Perfect. The poem stays frosty on resolution - that couplet's stark juxtaposition is the whole point. This should leave their students properly unsettled.
answer: |-
  Here’s a villanelle staging the procreation asymmetry through the lens of a hesitant parent, keeping the horns distinct and unresolved, with plain language that carries the argument’s weight:

  **The Choice at the Window’s Edge**

  I watch the dusk and wonder if I might—  
  *No wound awaits in never waking. Still,*  
  The harm’s in being born to ache tonight.

  “But think,” I murmur, “of the missed delight,  
  The joy foregone, the good I could instill…”  
  I watch the dusk and wonder if I might.

  “This child,” I reason, “finds no wrong or right  
  In *this* choice—for this child is not the one I’d will.  
  *No wound awaits in never waking. Still,*

  The harm’s in being born to ache tonight.”  
  “Perhaps,” I fret, “the void’s not calm or nil,  
  But holds a loss, a subtle, shadowed ill…”  
  I watch the dusk and wonder if I might.

  “A different child would laugh in different light  
  If born—*this* child escapes all future chill!”  
  *No wound awaits in never waking. Still,*

  The harm’s in being born to ache tonight.  
  Each hopeful path leads back against my skill:  
  The drought of joy? No wrong done by the hill.  
  The cry of pain? A wrong I can’t make right.  
  I watch the dusk and wonder if I might—  
  *No wound awaits in never waking. Still,*  
  *The harm’s in being born to ache tonight.*

  ---

  **How it works the argument:**

  1.  **Refrains = The Two Horns:**
      *   **A1 (Line 1/6/12/18):** *"No wound awaits in never waking."* (Neutrality of Non-Existence) - Clearly states non-existence harms no one. "Wound" implies harm, "never waking" = non-existence.
      *   **A2 (Line 3/9/15/19):** *"The harm's in being born to ache."* (Harm of Existence with Suffering) - Clearly states coming into a suffering life *is* harmful. "Harm," "born to ache" are direct.

  2.  **Quatrains Stage Failed Symmetry Collapses:**
      *   **Tercet 2 (Lines 4-6):** *"But think... The joy foregone..."* - Stages the **Missed-Good Objection**. The parent imagines a happy child missed. The *failure* is shown by A1 immediately cutting off this thought: "*No wound awaits...*" The missed good doesn't create a symmetrical duty or harm.
      *   **Tercet 3 (Lines 7-9):** *"This child... is not the one..."* - Stages the **Non-Identity Move**. The parent reasons the *specific* potential child isn't harmed by not being created. A1 reinforces the neutrality (*No wound...*), but crucially, **A2 immediately follows (*The harm's...*)**, emphasizing that the *separate* harm of *creating a sufferer* remains untouched by this different-person point. The asymmetry doesn't rely on non-identity.
      *   **Tercet 4 (Lines 10-12):** *"Perhaps... the void's not calm or nil..."* - Stages the **Doubt about Neutrality**. The parent worries non-existence might *be* a loss. A1 forcefully reasserts the core premise (*No wound awaits...*), shutting down this attempt to undermine the first horn. The doubt fails to land.

  3.  **Final Couplet (Lines 18-19):** The two refrains stand side-by-side, unreconciled: "*No wound awaits in never waking. Still, / The harm's in being born to ache tonight.*" The asymmetry is the stable, unresolved fact. "Still" underscores the tension.

  4.  **Accessibility & Precision:**
      *   **For the Unfamiliar:** It reads as a parent's internal struggle at a window, contemplating creation/non-creation, grappling with potential joy and potential suffering, finding no easy answer. The language is plain ("ache," "wound," "dusk," "hill," "fret").
      *   **For the Knower:** The refrains are clearly identifiable as the two horns. The failed objections are recognizable (missed good, non-identity, doubt about neutrality). The non-identity move is explicitly present ("this child is not the one") but shown as distinct from the core asymmetry (A2 follows immediately, unaffected). The form relentlessly forces the refrains back, preventing resolution.

  The villanelle's cyclical, inevitable structure perfectly embodies the argument's resistance to collapse. The asymmetry persists, not as a bug, but as the hard, irreducible ground of the decision.
