prompt: |-
  Ok so I'm trying to set up an adversarial collaboration between two camps on the old evidence problem, and I want the joint statement they'd both sign. The two camps: (1) the synchronists, who think confirmation is just a timelessly holding relation between a hypothesis and some evidence, defined as P(H|E) > P(H), and that old evidence confirms just fine — the whole diachronic asymetry is a red herring, a confusion about what confirmation is. (2) the diachronicists, who think confirmation is essentially a diachronic process — evidence confirms a hypothesis for an agent when and only when it raises the agent's credence in the hypothesis — so old evidence, by definition, can't confirm in the strict sense, and we need a special account (the 'fitting' relation, or conditionalization on the discovery of the connection, or something else).

  Write the document such a collaboration would produce. I want: the claims both sides can sign, including about the formalism and about what the old evidence problem actually is (not just the Mercury case, but the general structure); the precise statements of where they still differ, phrased so each side would accept the wording of their own view; the cruxes — I suspect one is whether 'confirming' is synchronic or diachronic, another is whether 'fitting' is a species of confirmation or a different relation altogether, and a third is whether the diachronicist's 'discovery of the connection' move is a genuine Bayesian update or just a fudge to save the diachronic thesis; and for each crux, a concrete case or argument both would agree bears on it, with each side's prediction written down in advance. Format it as a numbered agreed-claims section followed by a disagreements table.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between two philosophical camps regarding the old evidence problem in Bayesian confirmation theory.

  The two camps:
  (1) Synchronists: Confirmation is a timeless relation defined as P(H|E) > P(H). Old evidence can confirm.
  (2) Diachronicists: Confirmation is essentially diachronic, requiring an update in credence. Old evidence cannot confirm in the strict sense because it doesn't raise the agent's credence (since it's already known). They require a special account (like the 'fitting' relation or conditionalization on the discovery of the connection).

  Structure of the document:
  - A section of agreed claims (numbered) about the formalism and the old evidence problem (general structure, not just Mercury).
  - A table of disagreements, with each row having:
     a) The precise point of disagreement, worded so each side accepts the wording of their own view.
     b) The crux (the core issue) and a concrete case or argument both agree bears on it.
     c) Each side's prediction for that case.

  Key cruxes we suspect:
  1. Whether 'confirmation' is synchronic or diachronic.
  2. Whether 'fitting' (or a similar relation) is a species of confirmation or a different relation.
  3. Whether the diachronicist's 'discovery of the connection' move is a genuine Bayesian update or just a fudge.

  Let's outline:

  Agreed Claims:
  1. We agree that the standard Bayesian definition of confirmation is: evidence E confirms hypothesis H relative to background knowledge K if and only if P(H|E, K) > P(H|K).
  2. We agree that the old evidence problem arises when E is already known (i.e., E is in K). In such a case, P(E|K) = 1, and by Bayes' theorem, P(H|E, K) = P(H|K). Thus, the inequality P(H|E, K) > P(H|K) does not hold.
  3. We agree that the problem is not restricted to the historical case of Mercury's perihelion but applies generally to any situation where evidence is already known at the time a hypothesis is considered.
  4. We agree that both camps accept the formal Bayesian framework and the above definition as a starting point, but they interpret it differently.

  Disagreements Table:

  We will have a table with columns: 
  - Disagreement Number
  - Point of Disagreement (with both sides' views stated in a way they accept)
  - Crux
  - Concrete Case/Argument
  - Synchronist Prediction
  - Diachronicist Prediction

  Let's define the rows:

  Disagreement 1: The Nature of Confirmation
  - Synchronist view: Confirmation is a timeless logical relation between H and E given K, which holds independently of whether the agent knows E or when they learned it.
  - Diachronicist view: Confirmation is an epistemic process that occurs for an agent when they learn E and update their credence in H; thus, it is inherently diachronic.
  - Crux: Is confirmation fundamentally a synchronic or diachronic concept?
  - Concrete Case: Consider a scenario where an agent has known E for a long time (so E is in K). Then, at time t, they learn a new hypothesis H that entails E (so H ⊨ E). The synchronist will say that E confirms H at time t because P(H|E,K) > P(H|K) (if we can compute the probabilities appropriately). The diachronicist will deny that there is any confirmation at time t because the agent's credence in H doesn't change upon learning E (they already know E). However, the diachronicist may allow that if the agent had not known E, then learning E would have confirmed H.
  - Synchronist Prediction: In the case described, E does confirm H at time t (the relation holds) even though the agent doesn't change their credence at t.
  - Diachronicist Prediction: In the case described, there is no confirmation at time t because there is no change in credence. Confirmation only occurs if the agent learns E after H (or in a way that the connection is discovered).

  Disagreement 2: The Status of 'Fitting'
  - Synchronist view: The diachronicist's notion of 'fitting' (or the idea that the evidence fits the hypothesis) is either redundant or just another name for the synchronic confirmation relation.
  - Diachronicist view: 'Fitting' is a distinct relation that captures the explanatory connection between H and E, and it is important for understanding why old evidence seems to support a hypothesis, but it is not confirmation proper (which requires diachronic updating).
  - Crux: Is 'fitting' a species of confirmation or a different relation?
  - Concrete Case: Consider a case of old evidence: Einstein knows the perihelion of Mercury (E) and then develops his theory of general relativity (H). He then realizes that H entails E. The synchronist says that E confirms H (the relation holds). The diachronicist says that E does not confirm H (because Einstein already knew E) but that there is a fitting relation: H fits E. Now, consider a variant: Einstein first develops H (without knowing E) and then learns E and sees that H entails E. Then both agree that learning E confirms H. The question is: in the original case, when Einstein realizes the connection, is that realization an instance of confirmation? The diachronicist may say that the realization is a new piece of evidence (discovery of the connection) and that conditionalizing on that new evidence does raise the credence in H. But the synchronist thinks that the confirmation relation was already there and the realization is just coming to know it.
  - Synchronist Prediction: In the original case, the confirmation relation holds independently of the realization. The realization is just coming to know a logical truth (that H entails E) which does not change the confirmation relation (which is timeless).
  - Diachronicist Prediction: In the original case, the realization of the connection is a new piece of evidence (call it C, for connection) and conditionalizing on C (with the appropriate background) does lead to an increase in credence for H. This update is genuine confirmation. Without this, there is only the fitting relation.

  Disagreement 3: The Genuineness of the Diachronic Update
  - Synchronist view: The diachronicist's move to conditionalize on the discovery of the connection (C) is an artificial fudge because C is not genuinely new evidence; it is a logical truth that H entails E, which was always true. Therefore, the agent should have already assigned P(C)=1, and conditionalizing on C should not change the credence.
  - Diachronicist view: The discovery of the connection (C) is a genuine piece of new evidence because it represents a change in the agent's epistemic state (they didn't know the connection before) and thus conditionalization on C is a legitimate Bayesian update that raises the credence in H.
  - Crux: Is conditionalizing on the discovery of the connection (C) a genuine Bayesian update?
  - Concrete Case: Consider an agent who knows E and then considers H which entails E. The agent, however, does not initially realize that H entails E. Then, at time t, they realize that H entails E. The diachronicist claims that conditionalizing on the proposition "H entails E" (which we can denote as C) should increase the credence in H. The synchronist objects that the agent should have assigned P(C)=1 from the beginning because C is a logical truth. So the update is illegitimate. The diachronicist may argue that the agent did not know C, so they had P(C) < 1, and then they update to P(C)=1. But the synchronist counters that in the ideal Bayesian model, logical omniscience is assumed, so the agent should have known C already. 
  - Synchronist Prediction: If we assume logical omniscience, then P(C)=1 always, so conditionalizing on C does nothing. Therefore, the diachronicist update is not genuine and is a fudge.
  - Diachronicist Prediction: Logical omniscience is an unrealistic idealization. In real epistemic agents, we do not know all logical truths, so we can have P(C) < 1. Then, when we learn C (by proving it or being told), we update and increase our credence in H. This update is genuine.

  Now let's write the document accordingly.
answer: |-
  ### Joint Statement: Adversarial Collaboration on the Old Evidence Problem  
  **Collaborators**: Synchronist Camp (S) and Diachronicist Camp (D)  
  **Date**: October 26, 2027  

  #### **Agreed Claims**  
  1. **Formal Bayesian Framework**: Both camps agree that Bayesian confirmation theory is formally grounded in probability theory. The core definition of *absolute* confirmation is:  
     \[  
     \text{E confirms H relative to background knowledge K iff } P(H|E, K) > P(H|K).  
     \]  
     Here, \(P\) represents a rational credence function, \(H\) a hypothesis, \(E\) evidence, and \(K\) background knowledge.  

  2. **The Old Evidence Problem (General Structure)**:  
     - The problem arises when \(E\) is already known (i.e., \(E \in K\)), making \(P(E|K) = 1\).  
     - By Bayes’ theorem, if \(E \in K\), then \(P(H|E, K) = P(H|K)\). Thus, \(E\) cannot satisfy \(P(H|E, K) > P(H|K)\).  
     - This is not specific to historical cases (e.g., Mercury’s perihelion). It applies to any scenario where \(E\) is entailed by \(K\) before \(H\) is formulated.  

  3. **Epistemic Asymmetry**: Both camps agree that learning \(E\) *after* formulating \(H\) (diachronically) robustly confirms \(H\) for any Bayesian agent. The disagreement centers on whether \(E\) confirms \(H\) when \(E\) is *already known*.  

  4. **Role of Logical Knowledge**:  
     - If \(H \models E\), then \(E\) is entailed by \(H\) (relative to \(K\)).  
     - Both camps agree that discovering the logical connection \(H \models E\) can trigger a *change in credence* for agents unaware of the entailment.  

  5. **Common Goal**: To resolve whether "confirmation" is (A) solely a synchronic relation, (B) inherently tied to diachronic updating, or (C) ambiguous between the two.  

  ---

  #### **Disagreements**  
  *Table Format: Each row states a disagreement, the crux, a shared test case, and both camps’ predictions.*  

  | # | Point of Disagreement (Stated Neutrally) | Crux | Shared Test Case | Synchronist (S) Prediction | Diachronicist (D) Prediction |
  |---|------------------------------------------|------|------------------|----------------------------|------------------------------|
  | **1** | **The nature of confirmation**:<br>- S: Confirmation is a timeless, synchronic relation. \(E\) confirms \(H\) iff \(P(H\|E, K) > P(H\|K)\), regardless of when \(E\) was learned.<br>- D: Confirmation is a diachronic process. \(E\) confirms \(H\) iff learning \(E\) *causes* an increase in \(P(H)\) for a rational agent. | Is "confirmation" fundamentally synchronic or diachronic? | **Case: Timeless Entailment**<br>An agent knows \(E\) (e.g., Mercury’s perihelion) at \(t_0\). At \(t_1\), they formulate \(H\) (e.g., General Relativity) where \(H \models E\). Agent knows \(H \models E\) from \(t_1\). Does \(E\) confirm \(H\) at \(t_1\)? | **Yes.** \(P(H\|E, K) > P(H\|K)\) holds at \(t_1\) because \(H\)’s entailment of \(E\) (given \(K\)) makes \(H\) more probable than without \(E\), irrespective of diachronic credence changes. | **No.** At \(t_1\), \(P(E) = 1\) (since \(E \in K\)), so \(P(H\|E, K) = P(H\|K)\). No credence increase occurs upon "re-learning" \(E\), so no confirmation. |
  | **2** | **Status of "fitting"**:<br>- S: "Fitting" (explanatory coherence of \(H\) with \(E\)) is identical to synchronic confirmation. It is not a distinct relation.<br>- D: "Fitting" is a separate, non-confirmatory relation. It explains why \(E\) *seems* to support \(H\) but is not confirmation unless it triggers diachronic updating. | Is "fitting" a species of confirmation or a different relation? | **Case: Unexplained Old Evidence**<br>Agent knows \(E\) and \(H\), but is unaware \(H \models E\). At \(t_2\), they learn \(H \models E\). Does \(E\) confirm \(H\) at \(t_2\)? | **No change.** Confirmation existed at \(t_1\) (when \(H\) was formulated). Learning \(H \models E\) at \(t_2\) merely reveals a timeless truth; it does not alter the confirmation relation. | **Yes, via "fitting".** \(E\) does not confirm \(H\) at \(t_1\). At \(t_2\), learning \(H \models E\) confirms \(H\) *diachronically* by raising \(P(H)\), but this is due to updating on the *connection*—not \(E\) itself. "Fitting" is the reason for the update, but it is distinct from confirmation. |
  | **3** | **Legitimacy of the "discovery of connection" update**:<br>- S: Conditionalizing on \(C\) (where \(C = H \models E\)) is a fudge. \(C\) is a logical truth; agents should assign \(P(C) = 1\) if logically omniscient, so updating on \(C\) is invalid.<br>- D: Conditionalizing on \(C\) is a legitimate Bayesian update. Agents lack logical omniscience, so \(P(C) < 1\) before learning \(C\). | Is updating on \(C\) a genuine Bayesian move, or an ad hoc fix? | **Case: Non-Omniscient Agent**<br>A Bayesian agent knows \(E\) and \(H\) but has \(P(C) = 0.5\) (due to ignorance). At \(t_3\), they prove \(C\) and update to \(P_{new}(H) = P(H\|C)\). Does this update validly confirm \(H\)? | **Illegitimate.** Under logical omniscience, \(P(C) = 1\), so \(P(H\|C) = P(H)\). The update only "works" by relaxing rationality norms. It is a fudge to mimic synchronic confirmation. | **Valid.** Real agents are not logically omniscient. Updating on \(C\) is a standard Bayesian response to new information (the proof), raising \(P(H)\). This *is* genuine confirmation, as it satisfies \(P_{new}(H) > P_{old}(H)\). |

  ---

  #### **Commitment to Testing Cruxes**  
  Both camps agree to evaluate predictions using:  
  - **Formal Models**: Credence functions with explicit \(K\), \(E\), \(H\), and \(C\).  
  - **Cases**: Mercury’s perihelion, but also idealized variants (e.g., mathematical hypotheses).  
  - **Outcome Metrics**: Whether \(P(H)\) increases (D) or whether \(P(H\|E, K) > P(H\|K)\) holds (S).  

  **Signed**,  
  *Representatives of the Synchronist Camp*  
  *Representatives of the Diachronicist Camp*  

  ---  
  **Adversarial Collaboration Protocol**:  
  - Predictions will be tested in peer-reviewed simulations (omniscient vs. non-omniscient agents).  
  - A follow-up paper will assess which view best explains cases without diachronic credence changes.
