  I need to break down each position. Brouwerians focus on free choice sequences, which aren't computable and lead to continuity principles that contradict MP. The Russian school sees functions as computable procedures, making MP acceptable. Bishop's approach is minimalist, avoiding both MP and continuity, aiming for broad compatibility. 

  The user mentions arguments going on for decades with no resolution. Their frustration suggests they seek clarity on why dialogue is unproductive. They might also be looking for ways to facilitate progress or understand if the impasse is inevitable.

  Looking deeper, the user might be interested in reconciling these views or finding a framework where differences are clear but respectful. They might want tools to communicate across schools without conflict. Unspoken needs could include reducing community fragmentation or finding common ground for collaboration.

  Next, I should evaluate their hypothesis. The different domains of quantification seem central. When each school says "for all functions," they mean different things. Brouwerians include non-computable sequences, Russians only computable, Bishop leaves it open. This makes MP hold or fail based on the domain. 

  But is it just about terminology? The term "constructive" is used by all, but their criteria differ. Brouwerians emphasize mental constructions, Russians algorithmic, Bishop a neutral core. So there's a verbal layer, but it's tied to deeper ontological commitments. Proof-theoretically, they agree on base systems but add axioms reflecting their views. Ontologically, they disagree on what mathematical objects exist (free choices vs. computable functions).

  The impasse persists because each school's axioms are consistent with their ontology, so no internal contradiction forces change. Independence results might show MP is separate but won't resolve the ontological divide. Progress could involve formalizing shared frameworks like BISH to clarify minimal commitments, or using realizability/topos models to show how different domains lead to different validities. However, complete resolution is unlikely without a shift in foundational views.

  The user might benefit from recognizing that the disagreement is fundamental but manageable. Emphasizing Bishop's framework as a neutral base could help collaboration. Highlighting model differences can foster mutual understanding without expecting conversion. The key is accepting pluralism within constructivism rather than seeking a single answer.
answer: |-
  Your diagnosis is insightful and largely correct—the core disagreement stems from **fundamentally different conceptions of mathematical objects**, specifically the nature of the continuum and functions, leading to divergent domains of quantification. This is not merely a verbal, proof-theoretic, or isolated ontological dispute but a **holistic divergence in foundational frameworks**. Below is a structured analysis, supported by evidence from each camp's practice, and an assessment of potential progress:

  ### **Diagnosis: The Structure of the Disagreement**
  1. **Divergent Ontologies of the Continuum and Functions** (Your Hypothesis Confirmed):  
     - **Brouwerians**: Treat the continuum as constituted by *free choice sequences* (potentially lawless, non-computable paths). Functions are operations defined constructively *over this continuum*. MP is refuted because it would require extracting finite information from a choice sequence in a way that violates the continuity principle (all total functions are continuous).  
       - *Evidence*: Brouwer’s uniform continuity theorem and rejection of tertium non datur for infinite collections.  
     - **Russian Constructivists**: Identify "functions" with *algorithmically computable procedures*. The continuum is reduced to computable reals. MP holds because a computable procedure can search for a witness if failure is impossible (by Church’s Thesis).  
       - *Evidence*: Use of Turing machines, Gödel numbering, and MP as an axiom in formal systems like HA + MP + CT (Church’s Thesis).  
     - **Bishopians**: Deliberately *avoid ontological commitment*. "Functions" are mappings defined by rules meeting constructive set-theoretic criteria (e.g., in CZF or BISH). The continuum is the set of Cauchy reals. MP is neither affirmed nor denied in the core system—it’s a separate choice.  
       - *Evidence*: Bishop’s *Foundations of Constructive Analysis* explicitly avoids choice sequences and computability axioms, focusing on extensional equality and minimal logic.

  2. **Not Primarily Verbal or Proof-Theoretic**:  
     - All schools use "constructive" but with distinct criteria:  
       - Brouwer: Mental constructions (idealized time).  
       - Markov: Formal computability.  
       - Bishop: Algorithm-agnostic verifiability.  
     - Proof-theoretically, they agree on base systems (e.g., HA ⊢ ¬¬∃x P(x) → ∃x P(x) is unprovable), but their *extensions* reflect ontological priorities:  
       - Brouwer adds continuity (¬MP).  
       - Markov adds MP + CT.  
       - Bishop adds neither.  

  3. **Substantive Ontological Disagreement**:  
     - The dispute centers on **what constitutes a legitimate mathematical object**:  
       - Brouwerians reject computable-only universes as impoverished (choice sequences are "given").  
       - Russians reject choice sequences as non-constructive (uncomputable).  
       - Bishopians reject both as overly restrictive or speculative.  
     - **This cannot be resolved by argument** because each stance rests on unprovable normative commitments:  
       - What counts as a "construction"? (Mental act vs. algorithm vs. set-theoretic recipe).  
       - Is the continuum prior to discrete structures?  

  ### **Why the Impasse Persists**
  - **Incommensurable Semantics**: When one camp says "∀f: ℕ→ℕ", they mean:  
    - Brouwer: *"For all free choice sequences..."*  
    - Markov: *"For all Turing-computable functions..."*  
    - Bishop: *"For all mappings satisfying our set-theoretic conditions..."*  
    Thus, MP’s truth value changes with the domain.  
  - **No Shared Standard for "Constructive Validity"**: Each school’s axioms are consistent relative to their intended model (e.g., realizability for Russians, sheaf models for Brouwerians), so no internal contradiction forces revision.  
  - **Philosophical Entrenchment**: Arguments appeal to intuitions (e.g., "mathematics as human activity" vs. "mathematics as computation") that resist empirical or logical refutation.  

  ### **What Would Count as Progress?**
  1. **Formal Clarification of Domains**:  
     - Explicitly parameterize interpretations: e.g.,  
       `MP(ComputableFunctions) = true`,  
       `MP(FreeChoiceSequences) = false`.  
     - **Progress Indicator**: Wide adoption of frameworks like **BISH** (Bishop’s base system) as a neutral "lingua franca" where MP/continuity are optional axioms. This is already happening in proof assistants (e.g., Agda, Coq).  

  2. **Independence Results with Philosophical Weight**:  
     - Prove that MP is independent not just of HA, but of *any extensional, predicative base theory* (e.g., CZF). This would solidify Bishop’s neutrality.  
     - **Progress Indicator**: Consensus that no "core constructive logic" can decide MP without ontological bias.  

  3. **Model-Theoretic Distinctions**:  
     - Construct models where MP fails but computability holds (e.g., topological models with Brouwerian continuity), and vice versa (realizability with MP). Show that these models satisfy different intuitions.  
     - **Progress Indicator**: Textbooks presenting MP as "true in computable settings, false in choice-based settings".  

  4. **Shift from Truth to Pragmatism**:  
     - Focus on which principles enable *useful mathematics*:  
       - Russians: MP enables computable analysis.  
       - Brouwerians: Continuity enables differential topology.  
       - Bishopians: Neutrality enables classical collaboration.  
     - **Progress Indicator**: Cross-school recognition that no single framework is "correct", and domain-specific axioms are valid tools.  

  ### **Why Complete Resolution is Unlikely**
  - **Foundational Commitments Are Non-Negotiable**: A Markovian won’t accept lawless sequences; a Brouwerian won’t reduce math to Turing machines.  
  - **No "Test" for Constructivity**: Unlike set theory (e.g., large cardinal axioms), constructivism lacks extrinsic justifications (e.g., empirical consequences).  

  ### **Conclusion**
  Your hypothesis is correct: **The dispute is ontological, centering on the nature of functions and the continuum**. Progress lies in **formalizing the relativity of principles to domains** (e.g., "MP holds in computable analysis but not in intuitionistic topology") and **treating Bishop’s core as a shared, minimal foundation**. Expect enduring pluralism—but clarity about *why* disagreements exist can reduce talking past each other. The goal should be mutual understanding, not conversion. As Bishop put it: *"Mathematics belongs to man, not to God."* Different humans construct differently.
