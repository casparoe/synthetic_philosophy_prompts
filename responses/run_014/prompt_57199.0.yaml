  **MEMORANDUM**  
  **To:** Members of the Regional Flood Authority  
  **From:** [Your Name], Decision Theory Advisor  
  **Date:** [Current Date]  
  **Subject:** Recommended Decision Rule for Spillway Operations and Capital Investments  

  ---

  ### **Bottom Line Up Front**  
  We recommend adopting a **rank-dependent expected loss rule** (Option iii) with explicit risk weighting for catastrophic outcomes. For Tuesday’s spillway decision at noon, this rule requires **opening the spillway** to flood Willow Creek. The certain loss of $230 million from opening is marginally justified to avoid the risk-weighted expected loss of $231.6 million from not opening. The deadline for this operational decision is Tuesday at 12:00 PM.  

  ---

  ### **Recommended Decision Rule**  
  **Rule Statement:**  
  For any protective action (e.g., opening the spillway), compare:  
  - The **certain loss** of taking the action, and  
  - The **risk-weighted expected loss** of not taking it.  

  **How to Calculate Risk-Weighted Expected Loss:**  
  1. **Identify outcomes:** List all possible outcomes from inaction, ranked from worst to best (e.g., "levee fails with fatalities" is worse than "levee fails with only property damage," which is worse than "no damage").  
  2. **Assign weights:** For outcomes involving >10 fatalities or >$1 billion in damage ("catastrophic outcomes"), apply a **decision weight** = `min(2 × probability, 1.0)`. For non-catastrophic outcomes, use the actual probability.  
  3. **Calculate expected loss:**  
     \[
     \text{Risk-Weighted Loss} = \sum (\text{Decision Weight} \times \text{Loss})
     \]  
     Loss includes:  
     - Economic damage (direct valuation).  
     - Fatalities valued at $12 million per life (VSL).  

  **Inputs Required for Staff:**  
  1. Probability of each outcome (from hydrology models).  
  2. Economic damage for each outcome (from engineering assessments).  
  3. Estimated fatalities for each outcome (from emergency planning scenarios).  
  4. Thresholds for catastrophe: >10 lives or >$1 billion damage (fixed in the rule).  

  **Administrative Note:**  
  - Flagged for legal review: Define "catastrophic outcome" thresholds in the resolution to avoid ambiguity in litigation.  

  ---

  ### **Arithmetic for Tuesday’s Storm**  
  *Baseline Facts:*  
  - **Certain loss if open:** $230 million (floods Willow Creek).  
  - **Loss if levee fails (4% probability):** $2.4 billion + (40 fatalities × $12 million) = $2.88 billion.  
  - **Loss if levee holds (96% probability):** $0.  

  *Comparison of Rules:*  
  1. **Option (i): Expected Loss Minimization (Linear)**  
     \[
     \text{Expected Loss} = (0.04 \times \$2.88B) + (0.96 \times \$0) = \$115.2M
     \]  
     **Verdict:** Do NOT open spillway ($115.2M < $230M).  

  2. **Option (ii): Concave Valuation (Disproportionate Weighting)**  
     *Assumptions:* Use power-adjusted disutility—losses scaled by \(\sqrt{\text{loss}/10^6}\) to penalize large outcomes.  
     - Loss if levee fails: \(\sqrt{2,880} \approx 53.7\) (in \(\sqrt{\$M}\) units).  
     - Expected disutility: \(0.04 \times 53.7 = 2.15\).  
     - Certain loss disutility: \(\sqrt{230} \approx 15.2\).  
     **Verdict:** Do NOT open spillway (2.15 < 15.2).  
     *Note:* Concave valuation reduces the "bite" of extreme losses, making inaction preferable.  

  3. **Option (iii): Rank-Dependent (Risk-Weighted)**  
     - Levee failure is a catastrophic outcome (>10 fatalities).  
     - Decision weight = \(2 \times 0.04 = 0.08\).  
     \[
     \text{Risk-Weighted Loss} = (0.08 \times \$2.88B) + (0.92 \times \$0) = \$230.4M
     \]  
     **Verdict:** OPEN spillway ($230.4M > $230M).  

  *Where Rules Diverge:*  
  - Expected loss (i) and concave valuation (ii) both favor **inaction**.  
  - Risk-weighting (iii) favors **action** by assigning double weight (8%) to the 4% catastrophic scenario.  

  ---

  ### **Illustrative Case: When Concave vs. Rank-Dependent Rules Conflict**  
  To clarify the distinction between Options (ii) and (iii), consider this hypothetical:  

  - **Choice A:** 1% chance of 60 fatalities (loss = 60 × $12M = $720M).  
  - **Choice B:** Certain loss of $80M.  

  *Option (ii) Concave Valuation:*  
  - Disutility of 60 fatalities: \(\sqrt{720} \approx 26.8\).  
  - Expected disutility: \(0.01 \times 26.8 = 0.268\).  
  - Certain loss disutility: \(\sqrt{80} \approx 8.9\).  
  **Verdict:** Prefer Choice A (0.268 < 8.9).  

  *Option (iii) Rank-Dependent:*  
  - 60 fatalities is catastrophic. Decision weight = \(2 \times 0.01 = 0.02\).  
  - Risk-weighted loss: \(0.02 \times \$720M = \$14.4M\).  
  **Verdict:** Prefer Choice B ($14.4M < $80M).  

  *Why This Matters:*  
  - **Concave valuation** reduces the perceived severity of low-probability catastrophes.  
  - **Risk-weighting** amplifies concern for worst-case outcomes.  
  - The board must choose which philosophy aligns with public risk tolerance.  

  ---

  ### **Application to Capital Program**  
  *The Choice:* Two projects with identical expected annual loss reduction ($18M):  
  - **Project A:** Reduces frequent small events (e.g., 30 events/year averaging $0.6M each).  
  - **Project B:** Eliminates a 0.6% annual chance of a $3B catastrophe.  

  *Analysis Under Recommended Rule (iii):*  
  - **Project B:** The $3B event is catastrophic (>$1B damage). Decision weight = \(2 \times 0.006 = 0.012\).  
    \[
    \text{Risk-Weighted Benefit} = 0.012 \times \$3B = \$36M.
    \]  
  - **Project A:** Small events are non-catastrophic. Benefit = $18M (actual expected loss reduction).  
  **Verdict:** Project B is preferred ($36M > $18M).  

  *Implication:*  
  - Expected loss minimization (Option i) treats both projects equally.  
  - Risk-weighting prioritizes eliminating catastrophic tail risks.  

  ---

  ### **Addressing the Strongest Objections**  
  **If We Recommend Risk-Weighting (iii):**  
  *Objection: "Repeated application could flood Willow Creek excessively."*  
  - Acknowledge: If we act on every 4% forecast (e.g., 1–2 times/year), Willow Creek floods every 25–50 years, while the city never floods. This redistributes burden to a small community.  
  - Response: The rule intentionally prioritizes avoiding low-probability catastrophes. However, we can mitigate equity concerns by:  
    - Compensating Willow Creek landowners via targeted relief (e.g., tax abatements, buyouts).  
    - Requiring city floodplain developers to fund mitigation for upstream communities.  

  **If We Had Recommended Expected Loss Minimization (i):**  
  *Objection: "Lives and one-off losses aren’t fungible."*  
  - Acknowledge: Mathematical expectation assumes losses average out over time, but affected individuals do not get "rolled over" to the next disaster.  
  - Response: Expected loss minimization is tractable and prevents inconsistent decisions. Public transparency about VSL (value per life) makes trade-offs explicit.  

