  "To the residents of Willow Creek: We recognize that opening the spillway imposes a profound and certain loss on your community—homes, livelihoods, and land assessed at $230 million. This decision was not made lightly. Our rule places additional weight on avoiding the most catastrophic outcomes, including loss of life in the downstream city. While the forecast showed only a 4% chance of such a tragedy, the potential consequences were severe enough to warrant protective action. We understand that this places a disproportionate burden on you, and we are committed to exploring every avenue to mitigate the impacts of these operations in the future. Your sacrifice is seen, and we do not minimize it."  

