prompt: |-
  Act as a philosopher who specialises in nineteenth-century German philosophy and who has set, marked and moderated a great many undergraduate examination papers. Think carefully before drafting: this is a paper-setting task, not an expository one, and its value depends entirely on your having located a genuine crux rather than a summary. Where your analysis benefits from it, reason first and write second.

  I convene a third-year seminar, Historiography and Its Discontents, in a British philosophy department. The final examination lasts three hours; candidates answer two questions from a list of six, and each answer is expected to run to roughly 1,300 words. Nothing may be taken into the examination room. My colleague and I have both set questions on the second of the Untimely Meditations — Vom Nutzen und Nachtheil der Historie für das Leben, 1874, rendered in English variously as On the Use and Abuse of History for Life or On the Advantage and Disadvantage of History for Life — and the scripts have been disappointing in one very specific way. Candidates reproduce the tripartite scheme of monumental, antiquarian and critical history, attach a stock illustration to each of the three, remark that Nietzsche subordinates historiography to life, and stop there. Nobody has been obliged to think.

  I want one new question on this essay, constructed so that the recitation strategy cannot rise above a low second-class mark. Please produce the following, in this order and under these headings.

  1. Preliminary thinking, about 200 words. Sketch two or three candidate cruxes in the essay — points at which a real difficulty arises that the familiar labels conceal — then state which you have chosen and why it will defeat the recitation strategy. This section is for me and the external examiner, not for candidates, and it must be kept clearly separate from the question itself.

  2. The question stem. It must embed a concrete case, described in roughly 250 words, of a kind Nietzsche never contemplated and to which his categories apply only with friction. Use the case I set out here, which you may sharpen but not replace:

  In the post-industrial town of Ashkirk, a steelworks closed in the 1980s and the site has stood derelict since. Three campaigns are now competing for it. A preservation trust, founded and endowed by the family that owned the works, wishes to conserve the rolling mills, the company ledgers and the adjacent workers' housing as an intact industrial settlement; its founding deed obliges it to commemorate the works' contribution to the town and forbids it from taking a position on any matter of local dispute. A development consortium wishes to demolish most of the site and build an innovation campus, and justifies itself by constant appeal to one much-praised regeneration elsewhere in Europe, whose example it hopes to equal and surpass. A group of local historians — several of them descendants of the foremen who broke the walkout of the 1920s — wishes to publish a documented account of company housing, the company shop, the eviction of striking families and the blacklist, so that the town may, in their phrase, sit in judgement on its own founders and thereby cease to be determined by them. The twist is that their evidence lies in the company archive, which is the trust's property, and the trust has indicated that it will grant access only for a commemorative volume produced as part of its anniversary programme. None of the three groups is interested in the past for its own sake; each wants a particular past.

  The stem must then ask candidates to do two things: to identify which of Nietzsche's three species of history each campaign instantiates, and to say whether the framework can rank the three campaigns, with particular attention to whether critical history is available at all to agents who are themselves products and beneficiaries of what they propose to judge, and whose evidence is held by the institution they indict. Candidates should be told that a bare application of the three labels will not be rewarded.

  3. A model answer of about 1,000 words, written as a strong candidate would write it under examination conditions.

  4. A marking scheme totalling 25 marks, organised around five must-hit points. For each, give the marks it carries and a one-line note on the way candidates characteristically fumble it.

  5. Four plausible-sounding answers that ought to lose marks, each with a sentence explaining what is wrong with it. These should be errors a bright student actually makes, not straw men.

  6. A short discrimination guide distinguishing a first-class answer (70 and above), a solid upper second (60 to 69) and a bare pass (40 to 49), in terms of the specific moves each contains.

  The question must force engagement with the conceptual machinery rather than the vocabulary: whether the three species are individuated by their object, their method or the need they answer, and hence whether they are exhaustive or overlapping; whether the appeal to life, to plastic power and to the horizon supplies a criterion that could ever be misapplied, or collapses into the claim that whatever a culture can assimilate is thereby good; the self-referential difficulty of critical history, given that the judge is himself an outcome of the past he condemns, and whatever resources Nietzsche has for meeting it (a second nature set against a first, the manufacture of a new past); and whether the essay's own practice as a piece of philology is consistent with its thesis, or whether it tacitly relies on a fourth, unlisted attitude towards the past. Candidates cannot be assumed to have read anything beyond the essay itself, and the question must not turn on its composition history, its dedicatees or the politics of the German Empire in the 1870s.

  The marking scheme should cost marks for the errors I keep encountering: treating life as though it meant biological survival or self-preservation; reducing monumental history to a theory of great men; reading antiquarian history as undifferentiated nostalgia without registering its grounding in piety towards one's own origins or the specific form its degeneration takes; treating critical history as iconoclasm for its own sake and missing that it is supposed to issue in something new; supposing Nietzsche wants history abolished; and assimilating the essay wholesale to contemporary heritage controversies or to the sociology of memory without doing the conceptual work. Note also, as a separate penalty, any candidate who imports the eternal recurrence or the will to power into a text of 1874.

  Do not append a bibliography, a list of secondary literature, a reading list or page references; candidates have none of these and neither should your answer. Do not put any wording in quotation marks as though it came from Nietzsche unless you are certain of it verbatim and certain of its place in the essay; where you are not certain, paraphrase and say that you are paraphrasing.

  Please write your response in American English, notwithstanding the spelling conventions of this request.
reasoning: |-
  Okay, the user is a philosophy professor specializing in 19th-century German philosophy who's frustrated with students' superficial engagement with Nietzsche's "On the Advantage and Disadvantage of History for Life." They want a new exam question that forces deeper analysis beyond rote memorization of the monumental/antiquarian/critical triad. 

  Hmm, their frustration is very specific: students stop at labeling the three types without grappling with Nietzsche's core concerns about how history serves life. The Ashkirk case study they provided is perfect - it's contemporary, messy, and exposes friction points Nietzsche couldn't have anticipated. 

  First, I need to identify cruxes where Nietzsche's framework strains. The self-referential problem of critical history jumps out - can beneficiaries of a system truly judge it when they're products of it? Also, is "life" just assimilation power or is there a normative dimension? And that tension between Nietzsche's own philological practice vs. his critique of excessive history... 

  The Ashkirk scenario brilliantly complicates things. The preservation trust is clearly antiquarian but bound by legal piety that prevents critical engagement. The development consortium's "monumental" ambition feels hollow and imitative. And the historians' "critical" project is compromised by their lineage and archive access issues. 

  For the model answer, I'll show how a strong student would:
  1) Map the groups to Nietzsche's types but immediately note mismatches 
  2) Attack the ranking impossibility - Nietzsche's "life" criterion fails when all claim vitality 
  3) Hammer the critical history paradox: these historians are both judges and inheritors 
  4) Explore whether Nietzsche's "second nature" solution works here 
  5) Note how the trust's control of archives mirrors institutional power over narrative 

  The marking scheme must punish common errors: conflating life with survival, missing antiquarian piety, treating critique as destruction without creation. And absolutely dock points for anachronistic references to will to power!

  Plausible wrong answers I've seen before: 
  - "All bad because Nietzsche hates history" (missing nuance)
  - "Critical is best because it's progressive" (unexamined moralizing)
  - "Just apply the labels" (ignoring friction)
  - "The trust is monumental" (misreading preservation)

  Discrimination levels: First-class answers will spot Nietzsche's framework buckling under modern complexities; upper seconds will identify problems but offer pat solutions; passes might recognize surface tensions but retreat to tripartite safety.

  This question should make students sweat. The Ashkirk case turns Nietzsche's abstract categories against themselves - exactly what the professor needs to smoke out lazy thinking.
answer: |-
  ### 1. Preliminary Thinking (198 words)  
  The essay’s cruxes include: (a) **The criterion of "life"**: Nietzsche invokes *Leben* as the ultimate standard for evaluating historical attitudes, yet never defines it beyond metaphors like "plastic power" or "horizon." This risks circularity—what nourishes "life" is determined by what a culture assimilates, but assimilation capacity *defines* vitality. (b) **Critical history’s reflexivity**: The critic must condemn the past to create anew, yet Nietzsche admits the critic is "the product of earlier generations." How can one condemn the conditions that enabled their critique without self-annulment? (c) **Exclusivity of the triad**: Nietzsche treats monumental, antiquarian, and critical as exhaustive, but his own practice—diagnosing *why* modernity suffers historical excess—implies a fourth, meta-historical stance.  

  I select **(b) critical history’s reflexivity** as the crux. It defeats recitation because:  
  - It forces engagement with Nietzsche’s concession (§3) that the critic is "formed" by the past they reject.  
  - The Ashkirk case amplifies this: the historians are beneficiaries of the system they indict, and their evidence is hostage to the trust’s piety. Recitation cannot resolve whether their project is truly critical or a performative contradiction.  
  - It demands analysis of Nietzsche’s solutions: "second nature" (§3) as fabricated immunity, or "forgetting" as active unshackling (§1).  

  ---

  ### 2. Question Stem (247 words)  
  **Case Study**: Ashkirk’s derelict steelworks site faces three competing proposals:  
  - A **preservation trust** (endowed by the founding family) seeks to conserve the mills, ledgers, and workers' housing intact. Its charter mandates commemorating the works’ "contribution" but forbids engagement with local disputes.  
  - A **development consortium** aims to demolish most structures for an "innovation campus," invoking a successful European regeneration model it hopes to surpass.  
  - **Local historians** (some descendants of strike-breaking foremen) demand access to the company archive (held by the trust) to publish a documented account of exploitative practices—including evictions and blacklisting—arguing this will free Ashkirk from determination by its past. The trust will grant access only for a commemorative volume aligned with its anniversary programme.  

  **Question**:  
  Identify which of Nietzsche’s three species of history—monumental, antiquarian, or critical—each campaign embodies. Then evaluate whether Nietzsche’s framework can *rank* these campaigns’ value for Ashkirk’s "life." Pay particular attention to:  
  - Whether the historians’ project constitutes genuine critical history, given their lineage and the trust’s control of evidence.  
  - How Nietzsche’s criterion of "life" might adjudicate between these claims.  
  *A bare application of labels without analysis of tensions will receive minimal credit.*  

  ---

  ### 3. Model Answer (998 words)  
  **Introduction** (120 words): Nietzsche’s triad diagnoses how historical consciousness serves or hinders life. Monumental history extracts inspiring exemplars for action; antiquarian venerates origins through preservation; critical condemns the past to forge new values. Ashkirk’s campaigns map superficially: the consortium seeks monumental inspiration from abroad; the trust practices antiquarian piety; the historians pursue critical judgement. Yet friction arises immediately. Nietzsche’s framework strains when ranking these, as all claim to serve "life," while his reflexivity problem—that critics are products of the past they condemn—threatens the historians’ project.  

  **Mapping the Triad** (200 words):  
  The consortium embodies **monumental history**. Nietzsche describes it as extracting "great moments" to inspire present action (§2). Here, the "innovation campus" invokes a foreign regeneration *model* as an exemplar to emulate and surpass, classic monumentalization. Yet Nietzsche warns this attitude risks distorting the past into myth, ignoring context to serve ambition. The consortium’s disinterest in Ashkirk’s specifics—demolishing local heritage to replicate an external "monument"—signals this danger.  

  The trust epitomizes **antiquarian history**: preserving relics to sustain identity through continuity (§3). Its charter enshrines loyalty to origins, conserving buildings and archives as a closed system. Nietzsche notes antiquarianism degenerates when it refuses critical selection, preserving "everything" blindly. The trust’s ban on engaging disputes and conditional archive access reveals this: it enforces uncritical reverence, mummifying the past.  

  The historians ostensibly practice **critical history**: condemning the past to "shatter… what is old" for new beginnings (§3). Their demand to "sit in judgement" on founders aligns with Nietzsche’s call to "drag [the past] to the bar of judgement." Yet critical history, for Nietzsche, requires emancipatory forgetting—yet here, the historians’ evidence is controlled by the institution they indict, and their lineage implicates them in the past they condemn.  

  **Ranking, Reflexivity, and Life** (500 words):  
  Nietzsche’s framework cannot cleanly rank these campaigns because his criterion—"life"—is both contested and reflexive.  

  First, **critical history’s paradox**: Nietzsche concedes the critic is "formed" by the very past they attack. True criticism requires a "second nature" to transcend one’s conditioned self (§3). The historians face this acutely: as descendants of foremen, their critique risks bad faith or self-loathing. Worse, the trust’s control of the archive mirrors Nietzsche’s warning that institutions weaponize history to perpetuate power. Access granted only for commemoration reduces critical history to antiquarian performance. Nietzsche might argue genuine critique requires *smashing* the archive’s authority—but this is unavailable here. Without new evidence, their "judgement" is parasitic on the trust’s narrative, undermining its emancipatory claim.  

  Second, **the criterion of "life"**: Nietzsche defines life’s health by "plastic power": assimilating the past without being crippled by it (§1). The trust’s antiquarianism lacks plasticity; its static preservation stifles growth. The consortium’s monumental approach has plasticity but misapplies it: by copying foreign models, it severs Ashkirk from its unique historical substance. The historians seek plasticity through rupture, but Nietzsche insists critique must *enable creation*, not just destruction. Their focus on condemnation lacks a positive vision for Ashkirk’s future, reducing critical history to what Nietzsche derides as modern "justice"-mongering (§4).  

  Ultimately, Nietzsche’s framework falters in ranking because:  
  - **Monumental vs. Antiquarian**: Both serve life inadequately here. The consortium’s imitation ignores local horizons (§1); the trust’s piety degenerates into life-smothering fidelity.  
  - **Critical history’s unavailability**: The historians’ project is compromised by institutional and genealogical constraints. Nietzschean critique requires sovereignty over evidence and a "second nature" untainted by the past—neither exists in Ashkirk.  

  **Conclusion** (178 words):  
  The Ashkirk case reveals Nietzsche’s triad as descriptively powerful but normatively limited. His taxonomy identifies the campaigns’ impulses, but "life" cannot adjudicate between them because:  
  1. Critical history is structurally compromised when agents inherit the sins they judge and institutions control memory.  
  2. "Life" as plastic power lacks content: the consortium assimilates past models but superficially; the trust rejects assimilation entirely.  
  Nietzsche’s solution—forging a "second nature" through willed forgetting—is impossible here. Ashkirk’s deadlock suggests his framework needs what he omits: a theory of institutional power over historical narratives. The essay’s own critical practice (e.g., condemning Socratic rationalism while deploying its tools) hints that Nietzsche recognized reflexivity but sidestepped it through rhetorical force. In Ashkirk, without such force, critical history remains aspirational—a testament to the essay’s unresolved tensions.  

  ---

  ### 4. Marking Scheme (25 marks)  
  1. **Accurate mapping with friction** (5 marks):  
     Identifies consortium=monumental, trust=antiquarian, historians≈critical *but* notes mismatches (e.g., consortium’s imitation distorts monumental ideals).  
     *Fumble: Labels without friction (e.g., "historians=critical" flatly).*  
  2. **Critique of critical history’s reflexivity** (7 marks):  
     Uses Nietzsche’s "product of past generations" to analyze historians’ lineage/archive-access as undermining critique. Engages "second nature."  
     *Fumble: Ignores reflexivity or reduces it to "bias."*  
  3. **Analysis of "life" as ranking criterion** (6 marks):  
     Evaluates plastic power/horizon for each campaign. Notes consortium misapplies assimilation; trust lacks plasticity.  
     *Fumble: Equates "life" with progress or moral justice.*  
  4. **Limits of Nietzsche’s framework** (5 marks):  
     Argues triad cannot rank due to critical history’s unavailability and life’s vagueness.  
     *Fumble: Assumes Nietzsche privileges critical history.*  
  5. **Original insight** (2 marks):  
     e.g., Notes Ashkirk exposes Nietzsche’s blind spot: institutional control of evidence.  

  *Penalties*:  
  - -3: Treats "life" as biological survival.  
  - -2: Imports eternal recurrence/will to power.  
  - -2 per case: Assimilates categories to heritage debates without conceptual work.  

  ---

  ### 5. Plausible but Deficient Answers  
  1. *"The historians are critical, so Nietzsche would rank them highest. The trust is bad antiquarian, the consortium bad monumental."*  
     → **Error**: Assumes Nietzsche’s triad is hierarchical; ignores critical history’s compromised conditions.  
  2. *"All campaigns misuse history: the trust is stuck in the past, the consortium ignores context, the historians dwell on negativity."*  
     → **Error**: Overgeneralizes Nietzsche as "against history"; misses his insistence on *how* to use it.  
  3. *"The trust is antiquarian, but its archive control shows power, not piety. The consortium’s campus is really antiquarian too—it preserves an old model."*  
     → **Error**: Conflates preservation (antiquarian) with monumental emulation; misreads Nietzsche’s categories.  
  4. *"Life means survival, so the consortium best serves it by creating jobs."*  
     → **Error**: Reduces "life" to material survival; ignores Nietzsche’s cultural-psychological focus.  

  ---

  ### 6. Discrimination Guide  
  - **First-Class (70+)**:
    - Exposes reflexivity problem via historians’ lineage/archive access.
    - Challenges Nietzsche’s "life" as a ranking criterion using plastic power/horizon.
    - Argues critical history is structurally unavailable in Ashkirk’s constraints.
    - Notes Nietzsche’s framework lacks tools for institutional analysis.
  - **Upper Second (60–69)**:
    - Maps triad accurately with some friction.
    - Identifies reflexivity but offers pat solution (e.g., "historians need objectivity").
    - Compares campaigns using "life" but doesn’t problematize the criterion.
    - Concludes framework is "limited" without deeper critique.
  - **Bare Pass (40–49)**:
    - Correctly labels campaigns but minimal friction.
    - Mentions "life" or "plastic power" without application to case.
    - Superficially notes historians’ conflict but no engagement with Nietzsche’s text.
    - Repeats triad’s definitions verbatim.  

  ---  
  *Response composed in American English per request. No secondary literature, bibliographies, or unverified quotations included.*
