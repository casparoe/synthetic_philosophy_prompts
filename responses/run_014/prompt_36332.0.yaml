  Below is a decision tree designed to guide a student from the initial commitment ("I felt genuine sorrow at the ending of *King Lear*, and I am glad I watched it") to a named position on the paradox of tragedy. The tree is built from the logical space of the problem, using diagnostic claims that a student can agree/disagree with without prior knowledge of theories. It routes through the four required questions and includes the specified positions (catharsis, Hume's conversion, psychical distance, coexistence/rich-experience, control theories, meta-response). Unnamed leaves are included for unoccupied combinations, with explanations. Pairs of leaves that cannot be separated are flagged, and the exit point for a student who insists that sorrow is enjoyed *qua* sorrow (not as a carrier) is indicated.

  ### **Decision Tree**
  Each node is a yes/no question. Answers lead to branches, ending in named theories or unnamed leaves. The tree starts from the top-level question about whether sorrow itself is part of the enjoyment.

  1. **Q1: Is the sorrow itself part of what you enjoyed?**  
     (i.e., was the sorrow intrinsically valuable to your positive experience?)  
     - **Yes** → Go to Q3 (flat retelling).  
     - **No** → Go to Q3 (flat retelling).  

     *Rationale: This top split isolates whether sorrow is constitutive of the pleasure (e.g., coexistence views) or incidental to it (e.g., catharsis).*

  ---

  #### **Branch 1: Yes, sorrow itself is part of the enjoyment**  
  2. **Q3: Would your pleasure survive a "flat retelling" of *King Lear*?**  
     (A flat retelling conveys all events factually but lacks expressive power—poetry, acting, imagery—so it may not evoke sorrow.)  
     - **Yes** → Go to Q5 (real funeral).  
     - **No** → Go to Q5 (real funeral).  

     *Rationale: Tests if pleasure depends on artistry or merely narrative content.*

  3. **Q5: Would the same enjoyment be available at a real funeral?**  
     (You are powerless to affect events, but vividness is identical to *King Lear*; e.g., you observe a stranger's funeral with the same intensity.)  
     - **If Q3 was Yes**:  
       - **Yes to Q5** → Unnamed leaf A: "Unattractive: No major theory holds this, as it implies sorrow is enjoyable in real-life powerlessness without artistry, which is ethically or psychologically implausible."  
       - **No to Q5** → Unnamed leaf B: "Incoherent: You claim pleasure survives a flat retelling (no artistry) but not a real funeral (real consequences), yet both lack artistry—this is inconsistent."  
     - **If Q3 was No**:  
       - **Yes to Q5** → Unnamed leaf C: "Incoherent: You deny pleasure survives without artistry (flat retelling) but claim it would in a real funeral, which also lacks artistry—contradicts the need for art's frame."  
       - **No to Q5** → Go to Q2 (want sorrow to continue).  

     *Rationale: Isolates if art's context is essential. Real funeral tests if "safe distance" matters.*

  4. **Q2: Can you want the sorrow to continue and enjoy it at the very same time?**  
     (i.e., in the moment of sorrow, do you desire its persistence alongside your enjoyment?)  
     - **Yes** → Go to Q4 (relishes responsiveness).  
     - **No** → Unnamed leaf D: "Incoherent: If sorrow is enjoyed at time T, it implies a desire for its continuation at T; denying this undermines the claim it is enjoyed."  

     *Rationale: Coherent enjoyment of sorrow requires concurrent desire for its continuation.*

  5. **Q4: Do you relish your own responsiveness more than anything in the work?**  
     (i.e., is your enjoyment centered on your capacity to feel deeply, rather than the play's content?)  
     - **Yes** → **Meta-response theory**: Pleasure comes from appreciating your own emotional sensitivity or virtuous empathy (e.g., feeling "elevated" by your sorrow).  
     - **No** → **Coexistence/Rich-Experience view**: Sorrow is enjoyed as part of a complex, valuable whole—it is intrinsically worthwhile for its depth or meaning (e.g., sorrow enriches life's tapestry).  

     *Rationale: Distinguishes self-directed pleasure from object-directed value.*

  ---

  #### **Branch 2: No, sorrow itself is not part of the enjoyment**  
  6. **Q3: Would your pleasure survive a "flat retelling" of *King Lear*?**  
     - **Yes** → Unnamed leaf E: "Unexplored: No major theory holds this, as it suggests pleasure comes from events alone without artistry or emotion—but why feel sorrow?"  
     - **No** → Go to Q5 (real funeral).  

  7. **Q5: Would the same enjoyment be available at a real funeral?**  
     - **Yes** → Unnamed leaf F: "Incoherent: If sorrow isn't enjoyed and vividness is equal, there is no source of pleasure—real tragedy should elicit aversion, not enjoyment."  
     - **No** → Go to conversion question.  

  8. **Conversion question: Is the sorrow "converted" into a different kind of pleasure?**  
     (i.e., is the negative emotion transformed into something positive?)  
     - **Yes** → **Hume's conversion view**: Pain is converted into pleasure via artistry (e.g., sublime language "alchemizes" sorrow into delight).  
     - **No** → Go to catharsis question.  

  9. **Catharsis question: Does pleasure come from purgation/release?**  
     (i.e., is sorrow a vehicle for emotional cleansing?)  
     - **Yes** → **Catharsis** (modern sense): Sorrow is endured to achieve relief or purification (e.g., "getting it out" leaves you refreshed).  
     - **No** → Go to Q4 (relishes responsiveness).  

  10. **Q4: Do you relish your own responsiveness more than anything in the work?**  
      - **Yes** → **Meta-response theory** (as above).  
      - **No** → **Psychical distance or Control theories**: The enjoyment stems from art's frame.  
        - *Flag: The tree cannot separate Psychical Distance and Control Theories here. Both occupy this leaf because diagnostic claims do not isolate them—psychical distance (emotional disengagement due to art's "unreality") and control (pleasure from safety/agency) often overlap. A student might agree with both.*  

  ---

  ### **Key Notes**
  - **Unnamed Leaves**: All unnamed leaves are either incoherent (B, C, D, F), unattractive (A), or unexplored (E).  
  - **Flagged Unseparated Pair**: Psychical distance and control theories share a leaf at the end of Branch 2 (after "No" to Q4). The tree cannot distinguish them because:  
    - Both rely on art's frame providing safety/unreality.  
    - No diagnostic claim cleanly isolates "contemplative disinterest" (psychical distance) from "voluntary control" (control theories) without theory-laden terms.  
  - **Exit for "Sorrow Qua Sorrow"**: A student who insists sorrow is enjoyed *as sorrow* (not as a carrier of anything else) would answer:  
    - Q1: **Yes** (sorrow is enjoyed intrinsically).  
    - Q3: **Yes** (pleasure survives flat retelling).  
    - This leads to **Unnamed leaf A or B** (depending on Q5). Neither is a named theory, so the student "leaves without a home." *Why?* Major theories reject that raw sorrow (without artistry or context) is enjoyable—this is ethically fraught and empirically unsupported. If the student answers Q3 as **No**, they can reach the coexistence view (if they reject meta-response in Q4).

