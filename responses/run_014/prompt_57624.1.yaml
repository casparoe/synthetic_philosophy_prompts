prompt: |-
  I convene a monthly reading group in the philosophy of physics. The members can follow talk of probability distributions and have heard the Born rule stated, but none of them has seen a Hilbert space, and none has met the ψ-ontic/ψ-epistemic literature. Next month I have seventy minutes and one goal: that they leave able to classify an interpretation for themselves rather than recite my taxonomy. Don't explain the distinction to me — plan how I should explain it.

  Give me the order of introduction and what each step depends on, in particular what must already be in place before the thought that two distinct quantum states could correspond to overlapping ranges of underlying physical situation can mean anything to them, and at which point they, rather than I, should be in a position to produce that criterion themselves.

  I want one carrying example, used three times: first to make the question feel substantive rather than verbal, second to state the criterion, and third as the case the Pusey–Barrett–Rudolph argument bites on. It must be a case on which a ψ-ontic and a ψ-epistemic account make identical predictions, and it must work without double slits, cats, or complex numbers. Say what such an example has to have and what it has to lack.

  Then map the misconceptions. I expect "epistemic just means it's in the observer's head," "Bohmian mechanics must be epistemic since the particle has a definite position," and "PBR settles it outright." Tell me where in the sequence to head off each and with what. One member is a committed Everettian who will insist the issue is confused because nothing collapses; give me something to do with him at the moment he says it. Close with a single question that would separate someone who has the criterion from someone who has memorized the labels, and with what I should explicitly decline to cover at this level.
reasoning: |-
  We are going to introduce the ψ-ontic/ψ-epistemic distinction to a group that knows the Born rule and probability distributions but not Hilbert spaces or the technical literature. We have 70 minutes.

  The goal is for them to be able to classify an interpretation by themselves.

  We need:
  - A carrying example (used three times: to motivate, to define, and for PBR) that must:
      * Have two distinct quantum states that make the same predictions for some measurements but different for others.
      * Be simple: no double slits, no cats, no complex numbers (so we use real quantum mechanics, e.g., with a qubit or a system with two states).
      * Be a case where ψ-ontic and ψ-epistemic accounts make identical predictions (so we are comparing the underlying reality, not the predictions).

  I propose using a two-level system (a qubit) but described in a way that avoids complex numbers. We can use a spin-1/2 system but only with measurements in the x and z directions (and we can use real vectors for that). Alternatively, we can use a system with two boxes (or two paths) and measurements that are "which box" or "which path" and "interference" measurements. However, we want to avoid the double-slit setup. So let's use a qubit with measurements in the computational basis and one other basis (say, the Hadamard basis) and use real coefficients.

  Example: Consider a system that can be in one of two states, |0> or |1>, for the computational basis. We can also have a superposition: |+> = (|0> + |1>)/√2 and |-> = (|0> - |1>)/√2. These are all real.

  Now, the two states we consider are |0> and |+>. Note that these are non-orthogonal: <0|+> = 1/√2.

  We will design an experiment that has two parts:

  1. Preparation: We prepare the system either in |0> or in |+>.
  2. Measurement: We measure in the computational basis (gives 0 or 1) or in the Hadamard basis (gives + or -).

  The Born rule gives:
  - If prepared in |0> and measured in computational basis: always 0.
  - If prepared in |0> and measured in Hadamard basis: 50% + and 50% -.
  - If prepared in |+> and measured in computational basis: 50% 0 and 50% 1.
  - If prepared in |+> and measured in Hadamard basis: always +.

  Now, the key point: if we only measure in the computational basis, then both |0> and |+> give 50% for |0> and 50% for |1>? Wait, no: |0> gives 100% for 0 and |+> gives 50% for 0 and 50% for 1. So that's different.

  We need measurements for which the two states give the same statistics? Actually, we don't necessarily need that for the carrying example. The point of the example is to set up the question: what is the underlying reality when we prepare |0> versus |+>? 

  But note: for the PBR argument, we need two non-orthogonal states. And the example must be one where a ψ-epistemic model would say that sometimes the same underlying physical state could be responsible for either quantum state, while a ψ-ontic model would say that the underlying physical states are distinct for each quantum state.

  So let's design the example as follows:

  Step 1: Motivate the question by showing that |0> and |+> are different because they predict different statistics for some measurements (like the computational basis). But for other measurements (like measuring in the basis that includes |+> and |->), they also differ. However, note that they are non-orthogonal, so there is no measurement that perfectly distinguishes them.

  But we can ask: what is the physical reality when we prepare |0> versus when we prepare |+>? 

  We can imagine that the system has some underlying physical state λ. The quantum state |ψ> is a description of the system. The question is: could the same λ sometimes be assigned to both |0> and |+>? 

  We need to set up the idea that the quantum state might be a state of knowledge (epistemic) or a physical state (ontic).

  So the carrying example: two preparations, P0 (prepares |0>) and P+ (prepares |+>). We note that they are different because they give different statistics for the computational basis measurement. But we ask: is it possible that sometimes the same underlying physical state λ is produced by both preparations? 

  If yes, then we have overlap in the set of λs for the two quantum states. That would be a ψ-epistemic model. If not, then the sets of λs for |0> and for |+> are disjoint, which is ψ-ontic.

  But note: we must have a model that reproduces the Born rule. So the model must assign probabilities to outcomes given λ and the measurement. And the model must assign a probability distribution over λ for each preparation.

  So the example must have:

  - Two quantum states: |0> and |+> (non-orthogonal).
  - A set of measurements (at least two: computational and Hadamard) to show that they are different.

  But for the model to be consistent, the statistics for any measurement must be the same as the quantum predictions. So if we have a ψ-epistemic model, then the same λ might be present in both preparations, but then for any measurement, the probability of an outcome must be the same regardless of which preparation was used (if that λ occurs). But note: for a given λ, the outcome probabilities must be fixed. So if the same λ can come from two preparations, then that λ must not give away which preparation was used? Actually, no: the model is allowed to have the preparation procedure determine the distribution of λ, but the measurement outcome is determined by λ and the measurement. So if two preparations can produce the same λ, then when we have that λ, we cannot tell which preparation was done? But that's okay because the two preparations are not perfectly distinguishable.

  So the example must have the two states non-orthogonal so that they are not perfectly distinguishable. That's why we chose |0> and |+>.

  Now, the plan:

  Total time: 70 minutes.

  Order of introduction:

  1. (5 min) Set the stage: We know the Born rule gives probabilities for measurement outcomes. But what does the quantum state (ψ) represent? Is it a physical state or a state of knowledge?

  2. (10 min) Introduce the carrying example: a qubit with two preparations, P0 and P+. Show the statistics for two measurements: 
     - Measurement Mz (computational basis): P0 gives 0 with 100%, P+ gives 0 with 50%.
     - Measurement Mx (Hadamard basis): P0 gives + with 50% and - with 50%, P+ gives + with 100%.

     So they are different. But note that if we only did Mx, we could not tell P0 from P+ perfectly? Actually, we can: P+ always gives +, but P0 gives + only 50% of the time. So they are not the same. But they are not orthogonal.

  3. (10 min) Introduce the idea of an underlying physical state λ. Explain that we can imagine that when we prepare the system, we set it to some λ, and then when we measure, the outcome is determined by λ and the measurement. 

     We must have for each preparation a distribution over λ: μ0(λ) for P0 and μ+(λ) for P+.

     And for each measurement and each λ, we have a probability distribution over outcomes. For example, for Mz, we have p(0|λ, Mz) and p(1|λ, Mz). 

     The model must reproduce the quantum statistics. So for P0 and Mz: 
          ∫ dλ μ0(λ) p(0|λ, Mz) = 1
          ∫ dλ μ0(λ) p(1|λ, Mz) = 0

     And for P+ and Mz:
          ∫ dλ μ+(λ) p(0|λ, Mz) = 0.5
          ∫ dλ μ+(λ) p(1|λ, Mz) = 0.5

     Similarly for Mx.

  4. (10 min) The key question: could there be overlap between the distributions μ0 and μ+? That is, is there a set of λ that has positive probability under both μ0 and μ+? If yes, then that λ could be produced by both preparations. This is the core of the distinction.

     ψ-epistemic: yes, there is overlap. The quantum state is a state of knowledge because if you have a λ in the overlap, you don't know whether it was prepared by P0 or P+. But the model must ensure that the measurement probabilities are consistent.

     ψ-ontic: no overlap. The quantum state is directly tied to the physical state: each ψ corresponds to a disjoint set of λ.

     So the criterion: if for every pair of distinct quantum states, the distributions over λ are non-overlapping, then the model is ψ-ontic. If there exists at least one pair of distinct quantum states for which the distributions overlap, then the model is ψ-epistemic.

     At this point, the participants should be able to state the criterion: look at the underlying physical states. If the same physical state can sometimes be assigned to two different quantum states (i.e., if the set of physical states for two quantum states overlap), then it's ψ-epistemic; if not, then ψ-ontic.

  5. (15 min) Now, we use the same example to illustrate the Pusey-Barrett-Rudolph (PBR) argument. The PBR argument shows that under certain assumptions, ψ-epistemic models are impossible. We don't need to go into the full argument, but we can show the setup.

     PBR consider two non-orthogonal states (like |0> and |+>). They then consider a composite system of two such qubits, prepared independently. So we have four possible preparations:
        - P0 ⊗ P0: prepares |0>|0>
        - P0 ⊗ P+: prepares |0>|+>
        - P+ ⊗ P0: prepares |+>|0>
        - P+ ⊗ P+: prepares |+>|+>

     Now, they define a special measurement (which we can describe without complex numbers because we are in a real vector space). The measurement they define is a projection onto the following states (which are orthogonal and form a basis for the two-qubit system):

          |ξ1> = (|0>|1> + |1>|0>) / √2   [but note: we are using real coefficients, so we can use the Bell state? Actually, let's use the basis that PBR use: they use a measurement in the basis that includes the state orthogonal to |0>|0> in the symmetric subspace?]

     Actually, for simplicity, we can use the following: the PBR measurement for two qubits is designed to give an outcome that is impossible for the product state |0>|0> and also for |0>|+> and |+>|0> and |+>|+>? 

     PBR show that if the states are overlapping in the underlying λ space, then for the composite system, there is a nonzero probability for a λ that could have come from any of the four preparations. Then they design a measurement that, for such a λ, must give an outcome that is inconsistent with all four preparations? 

     We don't need to do the full argument, but we can state the conclusion: under the assumption that the systems are independent, such a model leads to a contradiction because it predicts an outcome that should have zero probability in quantum mechanics.

     So for our example: if we had a ψ-epistemic model for the single qubit (with overlap for |0> and |+>), then for two qubits, we could have a λ that is in the overlap for both qubits? And then we do a measurement that has an outcome that cannot occur for any of the four preparations? 

     The point: PBR shows that such an overlap leads to a contradiction. So if we accept their assumptions (like independence), then ψ-epistemic models are ruled out.

     But we don't prove it, we just use the example to show that PBR is about the same two states we have been considering.

  6. (10 min) Address misconceptions.

     a) "Epistemic just means it's in the observer's head."
          We head this off when we define ψ-epistemic as having overlapping distributions. We emphasize that the underlying physical state λ is real and objective, but the quantum state is a state of knowledge about λ. So it's not that λ is in the head; it's that the quantum state is. But we clarify that ψ-epistemic does not necessarily mean subjective or mind-dependent. It can be about incomplete knowledge of an objective reality.

     b) "Bohmian mechanics must be epistemic since the particle has a definite position."
          We address this when we talk about the criterion. Bohmian mechanics is ψ-ontic because the wave function is part of the physical state. The particle position is also part of the physical state. But note: the wave function is the same for all particles? Actually, no: in Bohmian mechanics, the wave function is a field that guides the particles. And importantly, two different wave functions would correspond to different physical states (because the wave function is part of the state). So the distributions over λ (which in Bohm includes both the wave function and the particle positions) for two different ψ would be disjoint because the wave function is different. So it's ψ-ontic. We can say: even though it has hidden variables (positions), the wave function is still a physical element.

     c) "PBR settles it outright."
          We address this when we present the PBR argument. We note that PBR makes assumptions (like independence of the systems when prepared separately) and that some ψ-epistemic models can avoid the theorem by denying independence. So it's not settled for all models.

  7. (5 min) The Everettian objection: "Nothing collapses, so the issue is confused."
          At the moment he says it (probably when we are introducing the underlying λ or when we talk about the quantum state as physical or not), we can say: in Everett, the wave function is the entire physical reality. So it is ψ-ontic. But note: Everett does not have hidden variables (like λ beyond the wave function). So the physical state is the wave function. Therefore, two different wave functions are two different physical states. Hence, it is ψ-ontic. We don't need collapse to talk about the physical state.

     We can also note that the distinction is about what the quantum state represents. In Everett, it is the whole physical state, so it is ontic.

  8. (5 min) Closing: 
     - A question to test understanding: "Suppose I have two quantum states, |ψ> and |φ>. In a hidden variable model, if the set of hidden variables that can occur for |ψ> and the set for |φ> have no overlap, then what would we call this model?" (Answer: ψ-ontic) 
       Then: "What if they do overlap?" (Answer: ψ-epistemic)

     - Explicitly decline to cover: 
          * The technical details of the PBR theorem (like the exact measurement they use). 
          * The full range of interpretations (we only used one example). 
          * Complex numbers and Hilbert spaces in full generality.

  Total: 5+10+10+10+15+10+5+5 = 70 minutes.

  But note: we might need to adjust timing.

  Let's map the misconceptions to the sequence:

  - For (a) "epistemic = in the head": we head it off when we define ψ-epistemic (step 4) by emphasizing that the physical state λ is real and objective, and the quantum state is a description of our knowledge about that objective state.

  - For (b) Bohm: we can address it when we give examples of ψ-ontic models (after step 4). We say: "Some models, like Bohmian mechanics, have additional variables (positions) and yet are still ψ-ontic because the wave function is part of the physical state and is different for different quantum states."

  - For (c) PBR settles it: when we present PBR (step 5), we note that it rules out a class of ψ-epistemic models under the assumption of independence, but not all. So it's not the final word.

  And the Everettian: we address when he brings it up, but we can anticipate it when we talk about the wave function as physical. We can say: "In Everett, there is no collapse, but the wave function is the entire physical reality. So it's ψ-ontic."

  Final question: as above.

  Decline to cover: the mathematical details of the PBR measurement, the full generality of the no-go theorems, and the technical definition of independence used in PBR.

  This should leave them able to classify a model: look at the underlying physical states (λ) and see if two different quantum states can correspond to the same λ (i.e., overlapping distributions). If yes, then ψ-epistemic; if no, then ψ-ontic.
answer: |-
  ### Teaching Plan: ψ-Ontic vs. ψ-Epistemic Distinction  
  **Time:** 70 minutes  
  **Goal:** Participants leave able to classify interpretations independently using a clear criterion.  

  ---

  #### **Order of Introduction** (45 minutes total)  
  1. **Groundwork: Quantum States and Predictions (10 min)**  
     - **Set up:** "We use quantum states (like |ψ⟩) to predict probabilities via the Born rule. But what does |ψ⟩ *represent*? Is it physical reality or our knowledge?"  
     - **Key dependency:** Participants know the Born rule → leverage this to question the *meaning* of |ψ⟩.  
     - **Example introduced:** A single particle with two possible states: |0⟩ (e.g., "left box") and |+⟩ = (|0⟩ + |1⟩)/√2 (e.g., "delocalized"). Use measurements:  
       - **M_z**: Is it in |0⟩ or |1⟩? (Computational basis)  
       - **M_x**: Is it in |+⟩ or |-⟩? (Hadamard basis; |-⟩ = (|0⟩ - |1⟩)/√2).  
     - **Statistics:**  
       - If prepared in |0⟩: M_z always gives |0⟩; M_x gives |+⟩/|-⟩ 50/50.  
       - If prepared in |+⟩: M_z gives |0⟩/|1⟩ 50/50; M_x always gives |+⟩.  
     - **Why this works:** No complex numbers (all real coefficients), no cats/slits. Participants see |0⟩ and |+⟩ are distinct (predict different outcomes for M_z and M_x).  

  2. **Introduce Underlying Physical States (λ) (15 min)**  
     - **Set up:** "Suppose quantum states |ψ⟩ describe a probability distribution over *real physical states* (call them λ). For example, λ could be a hidden variable or a particle position."  
     - **Key dependency:** Participants grasp probability distributions → map |ψ⟩ to distributions over λ.  
     - **Visualize:** Draw two overlapping bell curves:  
       - **μ_0(λ)**: Distribution of λ for preparations of |0⟩.  
       - **μ_+(λ)**: Distribution of λ for preparations of |+⟩.  
       - Overlap = some λ values can occur in both preparations.  
     - **Crucial insight:** "If distributions *overlap*, the same λ could be from |0⟩ *or* |+⟩. If *no overlap*, each λ belongs to one |ψ⟩."  
     - **Dependency for "overlap" to make sense:** Participants must see λ as physical (e.g., "a particle’s true location") and |ψ⟩ as a description.  

  3. **State the Criterion (5 min)**  
     - **Ask participants:** "When would |ψ⟩ be like a 'state of knowledge' (e.g., incomplete info about λ) vs. a direct physical state?"  
     - **Guide them to self-generate:**  
       - "If μ_0 and μ_+ overlap → |ψ⟩ is **ψ-epistemic** (knowledge about λ)."  
       - "If no overlap → |ψ⟩ is **ψ-ontic** (physical reality)."  
     - **Use the example:** "For |0⟩ and |+⟩, could λ be the same sometimes? If yes, epistemic; if no, ontic."  

  4. **PBR Argument (Using the Same Example) (15 min)**  
     - **Set up:** "Pusey-Barrett-Rudolph (PBR) ask: 'Can overlap exist if we prepare two particles?'"  
     - **Extend the example:** Prepare two particles independently:  
       - Case 1: Both in |0⟩ → state |0⟩⊗|0⟩.  
       - Case 2: Both in |+⟩ → state |+⟩⊗|+⟩.  
     - **PBR measurement:** A joint measurement with outcome "X" that:  
       - Never occurs for |0⟩⊗|0⟩ or |+⟩⊗|+⟩ (quantum prediction).  
       - But if λ-overlap exists (ψ-epistemic), "X" *can* occur.  
     - **Why it bites:** Identical predictions until this test. Overlap implies contradiction with QM → no ψ-epistemic models (under PBR assumptions).  

  ---

  #### **Addressing Misconceptions** (15 minutes total)  
  - **"Epistemic = in the observer’s head"**:  
    - **When:** During λ introduction (Step 2).  
    - **Response:** "Not about minds! ψ-epistemic means |ψ⟩ is *incomplete knowledge* of λ (e.g., λ is objective, but we don’t know it). Bohm has definite λ but is ontic!"  

  - **"Bohm must be epistemic since particles have positions"**:  
    - **When:** After stating the criterion (Step 3).  
    - **Response:** "Bohm *has* λ (positions), but |ψ⟩ is physical (guides particles). Distributions for different |ψ⟩ *don’t overlap* → ψ-ontic."  

  - **"PBR settles it outright"**:  
    - **When:** After PBR discussion (Step 4).  
    - **Response:** "PBR assumes *independent* preparations. Reject that? Overlap might survive (e.g., non-independent models)."  

  - **Everettian objection ("No collapse, so distinction confused")**:  
    - **When:** When introducing λ (Step 2) or criterion (Step 3).  
    - **Response:** "In Everett, |ψ⟩ *is* the full physical state → no λ beyond it. Distributions can’t overlap → ψ-ontic. Collapse isn’t needed!"  

  ---

  #### **Closing** (10 minutes)  
  - **Check Understanding:**  
    - **Question:** "Suppose a model says λ for |0⟩ and |+⟩ sometimes overlap. Is this ψ-ontic or ψ-epistemic?"  
      - *Correct:* ψ-epistemic (overlap = epistemic).  
      - *Memorization trap:* "ψ-ontic because |ψ⟩ is real" (misses overlap).  

  - **Explicitly Decline to Cover:**  
    - "We won’t dive into Hilbert spaces, PBR’s math, or complex-number QM. Focus: the *criterion*."  

  ---

  #### **Why This Works**  
  - **Carrying example (|0⟩ and |+⟩)**:  
    - **Must have:** Non-orthogonal states (〈0|+〉 ≠ 0) to allow overlap possibility; real coefficients.  
    - **Must lack:** Distractions (slits/cats/complex numbers); perfect distinguishability.  
    - **Used three times:**  
      1. **Substantive question:** Shows |0⟩ and |+⟩ predict differently → "Why are they distinct?"  
      2. **State criterion:** Overlap in λ-distributions?  
      3. **PBR bite:** Independent preparations → contradiction if overlap exists.  
  - **Self-classification:** By Step 3, participants generate the criterion from the example.  

  **Outcome:** They classify by asking: "Can one λ explain multiple |ψ⟩?"
