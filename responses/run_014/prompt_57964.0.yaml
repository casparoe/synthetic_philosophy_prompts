  Leftovers could be Wittgenstein's concepts of forms of life and the limits of language. Forms of life are the broader cultural practices that underpin language games. In the kitchen, it's the hustle and urgency; in soccer, the camaraderie. But these are hard to articulate with just tickets and stations. Also, the idea that some things can't be spoken (like mystical experiences) doesn't fit neatly into kitchen or soccer examples.

  I should be honest about why leftovers exist. Is it because kitchen talk misses something, or is Wittgenstein fuzzy? Probably both. Forms of life are abstract, but kitchen/soccer terms are concrete. However, the user's examples like "clean" and changing soccer rules effectively test the concepts. The leftovers might be due to the limitations of the analogy rather than Wittgenstein's fuzziness. His ideas are meant to describe how language works in practice, so using real-world examples actually strengthens understanding.

