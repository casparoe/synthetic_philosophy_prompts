  ## The Choice at Twin Tents

  Two stalls stand bright beneath the noon's warm gaze,  
  A quiet hint suggests the left might please.  
  But eyes read the shifting crowd's slow maze,  
  They join the longer row beneath the trees.

  A quiet hint suggests the left might please,  
  Yet seeing others stream towards the right,  
  They join the longer row beneath the trees,  
  Discounting their own spark of inner light.

  Yet seeing others stream towards the right,  
  They trust the gathered choice, the longer wait,  
  Discounting their own spark of inner light,  
  For reason weighs the many, seals their fate.

  They trust the gathered choice, the longer wait,  
  More than what they thought they faintly knew.  
  For reason weighs the many, seals their fate –  
  Until a single signal, sharp and new.

  More than what they thought they faintly knew,  
  A bitter scent now drifts from that long line.  
  Until a single signal, sharp and new –  
  One sniffs the air, and pauses to realign.

  A bitter scent now drifts from that long line.  
  But eyes read the shifting crowd's slow maze.  
  One sniffs the air, and pauses to realign –  
  Two stalls stand bright beneath the noon's warm gaze.

  ---

  **Explanation for Lecture Context:**

  This pantoum enacts the core concept of social learning and information cascades:

  1.  **Initial Uncertainty:** Starts with equal stalls ("twin tents") and a weak private signal ("quiet hint").
  2.  **Observation & Discounting:** Each diner observes the longer line ("shifting crowd's slow maze") and rationally decides the crowd's choice signals better information.
  3.  **Herding via Inference:** They "discount their own spark," trusting "the gathered choice" and "reason" (inference under uncertainty), leading them to join the longer line ("seals their fate"). The repeating, interlocking lines (pantoum structure) visually mimic the sequential, self-reinforcing choices.
  4.  **Cascade Vulnerability:** The final quatrain introduces the disruptive "single signal" – the "bitter scent." This strong, fresh private information ("sharp and new") is undeniable evidence causing one diner ("One sniffs the air") to question the herd and "realign."
  5.  **Rationality, Not Mindlessness:** Key phrases like "reason weighs the many" and "discounting their own spark" emphasize this is reasoned inference based on evidence (the crowd as a signal), not blind copying. The closing lines circle back to the beginning, showing how the pattern, once established, persists until strong contradictory evidence emerges.
