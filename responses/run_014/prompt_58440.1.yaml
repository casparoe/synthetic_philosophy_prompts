prompt: |-
  So I'm a junior in high school and me and my friends got into this huge arguement at lunch that lasted like two days in our group chat tbh. One side is basically team honor, like my friend Marcus says if someone disrespects you in front of everyone you have to answer back or everyone will think youre soft and just keep picking on you, reputation is everything and walking away is losing. The other side is team dignity, like my friend Priya says your worth doesnt come from what random people think, so you should just stay calm, ignore the bait, and use the actual rules instead of fighting about respect, and she thinks honor stuff just starts endless drama. Then our other friend brought up victimhood culture where its more about showing you were harmed and getting adults or the school to step in, and now we cant tell if any of these is actually morally better or just different ways to not get embarrassed. The cases we keep fighting about are definately these three from our school: when someone posted a slow-mo video of a kid tripping with his tray in the cafeteria to the sophomore chat and everyone spammed laughing emojis, when a guy got called a cheater out loud during math and the teacher told him to just shake it off, and our new rule where if you publicly call someone out you both get detention even if you were the one who got insulted first.

  Can you help me write up the thing they should have written if they were actually being fair instead of yelling, like a joint statement both Marcus and Priya could sign? First do a numbered list of like 6 to 8 claims they both actually agree on about what respect and snitching and standing up for yourself even mean at school, then do a disagreements table where each row is one leftover fight. For the table please use exactly these columns: Issue, Honor Version Stated Fairly So Marcus Would Say Yes Thats Me, Dignity Version Stated Fairly So Priya Would Say Yes Thats Me, Crux Question That Would Actually Change Someones Mind, Test Case From My Three Examples Or A New School One Both Sides Agree Is Relevant, What Honor Side Predicts Happens, What Dignity Side Predicts Happens. And at the end say which parts are just arguing about words like respect or snitching versus real moral disagreements, but keep the whole thing chill and using our school examples so I can actually show it to them.
reasoning: |-
  Okay, the user is a high school junior caught in a heated debate among friends about how to handle disrespect—team honor vs. team dignity, with victimhood culture also mentioned. They want help drafting a neutral document both sides could sign, starting with shared principles and then clarifying disagreements through a structured table. 

  First, I need to unpack their core request: they’re exhausted by the circular arguing and want a framework that feels fair to Marcus (honor) and Priya (dignity). The examples they gave—cafeteria video shaming, public cheating accusation, and the detention rule—are concrete anchors I should use heavily. 

  For the shared agreements section, I’ll focus on common ground: both sides likely agree bullying is wrong, that feelings matter, and that context changes everything. Listing 6-8 points should force them to see their overlap. Words like "snitching" and "respect" need careful handling since they’re emotionally loaded—I’ll define them neutrally. 

  The disagreements table is trickier. Each row must:  
  - Frame the honor/dignity positions so accurately that Marcus/Priya nod along  
  - Pose a "crux question" that could genuinely sway someone  
  - Use their school examples to test predictions  
  For instance, in the cafeteria video case, honor would predict escalation if ignored, while dignity would predict containment. The detention rule row will reveal if they prioritize justice (honor) or order (dignity). 

  Finally, I’ll flag semantic vs. moral disputes. Like, "respect" means reputation to Marcus but self-worth to Priya—that’s definitional, not ethical. But whether institutions protect victims? That’s a real values clash. 

  Keeping tone chill is vital. I’ll avoid academic jargon, use "you" statements, and remind them this isn’t about winning but understanding. Their examples make it relatable—the tripping video isn’t abstract; it’s *their* cafeteria. 

  Noticing the user’s frustration ("huge argument... lasted two days"), I sense they crave peace in their friend group more than philosophical answers. So the doc should feel like a truce tool, not a manifesto. Ending with the joint statement idea—"We disagree but value our community"—models the maturity they want.
answer: |-
  Here's a neutral framework for your group, designed to clarify the debate without declaring a winner. It uses your examples and structures the disagreement fairly so both Marcus and Priya can see their views represented accurately.

  **Joint Statement: Shared Ground Rules on Respect & Conflict**

  *We, Marcus and Priya, agree that navigating disrespect at school is complex. While we differ on the best response, we both value a school environment where students feel safe and respected. Here’s what we agree on:*

  1.  **Everyone Deserves Basic Respect:** Every student has inherent worth and deserves to be treated with basic human decency, regardless of reputation.
  2.  **Intentional Cruelty is Wrong:** Public humiliation, malicious rumors, or targeted insults (like the cafeteria video) are harmful and unacceptable, regardless of how you respond.
  3.  **Context Matters:** The severity of the insult, the relationship between people, the audience, and potential consequences (like the detention rule) all influence what the "right" response might be.
  4.  **"Snitching" Isn't Always Bad:** Reporting serious harm, bullying, threats, or dangerous situations (e.g., if the cafeteria video led to sustained harassment) is responsible, not weak. Reporting minor slights just to get someone in trouble *might* be seen differently.
  5.  **Self-Respect is Non-Negotiable:** Feeling hurt or angry by disrespect is valid. How you *express* and *act on* those feelings is where the choices lie.
  6.  **Passive Acceptance Isn't the Goal:** Neither side believes simply enduring repeated, targeted disrespect without any form of response is healthy or effective long-term.
  7.  **Institutions Should Be Fair:** Rules (like the detention rule) and adults (like the math teacher) should strive to be fair, protect victims, and address harm effectively. Both sides get frustrated when this fails.
  8.  **Our Goal is a Better Environment:** We both ultimately want less conflict, less humiliation, and a school where people feel secure.

  **Clarifying Our Disagreements: Honor vs. Dignity in Action**

  | Issue                          | Honor Version (Marcus: "Yes, that's me")                                                                 | Dignity Version (Priya: "Yes, that's me")                                                                                                | Crux Question That Could Change Minds                                                                 | Relevant Test Case (From School)                     | Honor Side Predicts If Their Way Isn't Used                     | Dignity Side Predicts If Their Way Isn't Used                     |
  | :----------------------------- | :-------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------- | :--------------------------------------------------- | :-------------------------------------------------------------- | :---------------------------------------------------------------- |
  | **Primary Goal in Response**   | Protect reputation & deter future disrespect by showing you won't be pushed around. Perception matters. | Protect inner peace & self-worth by not letting others dictate your emotional state or actions. Actions speak louder than reactions.      | **Does failing to visibly push back *invite* more disrespect, or does visibly reacting *fuel* the cycle?** | Cafeteria Video / Public Cheater Accusation          | More frequent/brazen disrespect; seen as an easy target.        | Escalation, unnecessary drama, losing control of your own frame. |
  | **Best Tool Against Public Disrespect** | Direct, proportional pushback *in the moment* (verbal counter, demand apology). Shows strength to peers. | Calm disengagement, ignoring bait, or using official channels *later* if needed. Shows emotional control and maturity.                   | **In a public shaming situation, which response is more likely to *deflate* the attacker & discourage bystanders?** | Cafeteria Video Spam / Public Cheater Accusation     | Ignoring emboldens the bully/bystanders; pushback shames them. | Engaging gives the bully the reaction they want; ignoring robs them of power. |
  | **Role of Authority/Rules**    | Rules are often too slow/unfair (like detention rule). Personal honor is the first line of defense.         | Rules exist to maintain order & protect everyone. Relying on them (when fair) prevents escalation and holds people accountable properly. | **Can personal enforcement of "respect" coexist with school rules without causing more conflict?**      | Detention Rule / Math Teacher Telling Victim to Shake it Off | Authorities fail too often; personal enforcement is necessary. | Personal enforcement is subjective and often escalates, bypassing fair process. |
  | **Definition of "Losing"**     | Walking away without defending yourself *is* losing face & invites future challenges.                      | Letting someone else provoke you into losing composure or getting punished (like detention) *is* losing control of yourself.             | **Is "winning" about controlling the *perception* of others or controlling your *own* actions/reactions?** | Public Cheater Accusation / Detention Rule           | Loss of status, increased targeting.                           | Loss of self-control, unnecessary punishment, playing the bully's game. |
  | **Handling Provocation (Bait)**| Ignoring bait *can* look like fear. Calling it out clearly establishes boundaries.                         | Responding to bait gives the provoker power & validates their tactic. Starving it of attention is the most effective dismissal.          | **Does visibly ignoring bait signal *strength* (disdain) or *weakness* (fear) to the provoker and bystanders?** | Cafeteria Video Spam / Detention Rule Scenario       | Provoker sees success, tries harder; bystanders see weakness.  | Provoker gets no reward, moves on; bystanders see maturity.       |

  **What We're *Really* Arguing About vs. Just Words:**

  *   **Real Moral/Strategic Disagreements:** These are core differences in values and predictions about human behavior:
      *   The core value: Is protecting external reputation (honor) or internal peace/autonomy (dignity) more important?
      *   Prediction: Does visible pushback *prevent* or *cause* more conflict?
      *   Trust: How much trust do we have in authority figures/rules to handle interpersonal conflict fairly?
      *   Effectiveness: What actually *works* best to stop a bully or deter disrespect in a high school setting?
  *   **Arguments About Words (Semantics):** Sometimes we get stuck defining terms differently:
      *   **"Respect":** Honor often means *deference/acknowledgment of status*. Dignity often means *basic human decency*. ("He didn't show me respect!" vs. "They disrespected my humanity").
      *   **"Snitching":** Honor often sees *any* official reporting as potentially weak if it's for personal slights. Dignity sees a clear line between reporting *harm/bullying* (responsible) and petty tattling.
      *   **"Strength" vs. "Weakness":** Honor sees public confrontation as strength, disengagement as weakness. Dignity sees emotional control as strength, losing composure as weakness.
      *   **"Winning":** Honor defines it by public perception and deterrence. Dignity defines it by maintaining self-control and avoiding negative consequences.

  **Final Joint Note:** *Understanding these differences helps us see where we genuinely disagree on values and strategy, and where we're just using the same words differently. Using the school examples shows how messy it is in real life – there's rarely one perfect answer. Maybe the best approach depends on the specific situation, the people involved, and what outcome you value most: immediate reputation defense or long-term peace of mind. Let's keep discussing, but focus on the real disagreements and test our predictions against what actually happens.* – *Marcus & Priya (via [Your Name])*

  **Why this works for your group:**

  1.  **Validates Both Sides:** Each viewpoint is stated fairly in their own words.
  2.  **Focuses on Core Issues:** The "Crux Questions" and "Predictions" move past yelling to testable ideas.
  3.  **Uses Your Examples:** Grounds the abstract debate in real school drama.
  4.  **Separates Words from Morals:** Highlights where confusion is just semantic.
  5.  **Promotes Discussion:** Ends by acknowledging complexity and encouraging future talk based on evidence.
  6.  **Chill Tone:** Avoids judgment, uses "we," focuses on understanding.

  Show this to Marcus and Priya. Ask them: "Does this capture your side fairly? What would you tweak? Can we look at the next argument using this table?" Good luck!
