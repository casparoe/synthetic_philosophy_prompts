answer: |-
  Here is the Asymmetry of Survival Procedure (ASP), designed as a one-page checklist:

  **Asymmetry of Survival Procedure (ASP) - Checklist**

  **Phase 1: Claim Parsing & Initial Setup (1 min)**
  1.  **Define Claim (C):** Precisely state the specific historical claim being evaluated. *Sufficient:* Single, unambiguous sentence.
  2.  **Identify Evidence (E):** List *all* available evidence cited *for* C. Be specific (e.g., "Destruction layer L123 at Site X," "Inscription Y, line 5," "Text Z, fragment A"). *Sufficient:* Concrete list of sources/artifacts.
  3.  **Define Counter-Claim (~C):** State what the world would look like if C were false. *Sufficient:* Simple negation of C (e.g., "City X was *not* sacked by Sea Peoples ca. 1200 BC").
  4.  **Identify Evidence Types:** What *kinds* of evidence support C? (e.g., Archaeology, Text A, Text B, Iconography, Epigraphy). *Sufficient:* List at least two distinct types if possible.

  ***STOP HERE IF:*** Claim (C) is vague, Evidence (E) is absent, or only *one* type of evidence exists. **Verdict: Claim Unusable (Requires fundamental rework or withdrawal).**

  **Phase 2: Survival Asymmetry Test - Core (3-5 min)**
  5.  **Counter-Evidence Survival:** If ~C were true, what evidence would we *expect* to find? Consider:
      *   Physical traces (e.g., intact buildings, continuity layers, lack of weapons).
      *   Textual traces (e.g., records from ~C's perspective, administrative continuity, contradictory traditions).
      *   *Focus on evidence types likely generated by ~C.*
      *   *Sufficient:* List 1-2 plausible, specific types of evidence expected under ~C.
  6.  **Destruction Vulnerability:** Would the *expected counter-evidence* from Step 5 be *highly vulnerable* to the same destructive processes (fire, recycling, bias, excavation luck) that *actually destroyed* much evidence from the period/location? *Sufficient:* "Yes" (vulnerable), "No" (robust), or "Unclear/Some."
      *   *If YES:* Survival of C's evidence (E) is *weak* support. Proceed to Step 7.
      *   *If NO or UNCLEAR:* Survival of E *might* be meaningful support. Proceed to Phase 3.
  7.  **Independent Traces Test:** If C were true, what *multiple, independent types* of evidence would we *expect* to survive? (e.g., Destruction layer + contemporary text + enemy record + refugee trace elsewhere). Be realistic given known destructive processes. *Sufficient:* List 2-3 plausible, independent evidence types beyond what we have (E).
  8.  **Absence Check:** Are the *expected independent traces* from Step 7 *actually absent*? *Sufficient:* "Yes" (absent), "No" (present), "Some Present/Some Absent," "Unknowable."
      *   *If YES (Absent):* This absence is *evidence against* C. **Proceed to Phase 3 (Silence Analysis).**
      *   *If NO (Present):* Supports C. **Verdict: Claim Usable (Qualification: Strength depends on evidence quality).**
      *   *If Some/Unknowable:* **Proceed to Phase 3 (Silence Analysis).**

  **Phase 3: Silence Analysis (2-3 min)**
  9.  **Classify Silence:** For any *significant absence* identified in Step 8, classify it:
      *   **Expected Silence:** The absent evidence would *not* normally be produced or survive even if C were true (e.g., no peasant diaries survive; perishable goods leave no trace). *Sufficient:* Plausible reason based on typical preservation/creation.
      *   **Surprising Silence:** The absent evidence *should* exist and survive if C were true, given what we know about the period/society/preservation. *Sufficient:* Plausible reason why it *should* be there.
      *   **Manufactured Silence:** The absence is likely due to *later* selection, censorship, loss of sources *after* antiquity, or modern excavation bias. *Sufficient:* Plausible mechanism for later interference.
  10. **Impact Assessment:**
      *   *If Expected Silence:* Absence is *not* evidence against C. **Proceed to Verdict.**
      *   *If Surprising Silence:* Absence is *strong evidence against* C. **Verdict: Claim Unusable (or Requires radical qualification).**
      *   *If Manufactured Silence:* **HAND TO PRESENTER.** Requires interpretation of later agendas/bias. Not resolvable by ASP alone.

  **Phase 4: Final Verdict (1 min)**
  11. **Synthesize:** Based on Steps 5-10:
      *   **Verdict: Claim Usable:** Evidence passes core test; silence is expected or absent. *Qualification level:* State if support is weak (Step 6 Yes) or stronger (Step 6 No/Unclear & Step 8 No).
      *   **Verdict: Claim Usable Only With Qualification:** Passes core test but has significant weaknesses (e.g., Step 6 Yes, Step 8 Some Absent but Silence Expected). *State required qualifications clearly.*
      *   **Verdict: Claim Unusable:** Failed Step 4 (No evidence), Step 8 (Surprising Silence), or core logic broken.
      *   **HAND TO PRESENTER:** Step 10 (Manufactured Silence), ambiguity in Step 5/7, or complex interpretation needed beyond survival logic.

  **Procedure Limitations:**
  *   Cannot *prove* truth/falsity, only assess *evidential strength based on survival*.
  *   Does not evaluate the *internal reliability* of a source (bias, competence) beyond survival factors.
  *   Does not handle statistical probability, only plausibility.
  *   Relies on researcher's reasonable knowledge of the period's evidence norms and destructive processes.
  *   Cannot create evidence; only assesses what exists and what *should* exist.

  ---

  **Applying ASP to Test Cases:**

  **1. Claim: Coastal City X sacked by Sea Peoples ca. 1200 BC.**
  *   **E:** Destruction layer (ash, weapons), Later Greek tradition, Egyptian inscription (possible ref).
  *   **Phase 1:** Pass (Claim clear, E listed, ~C defined, Types: Arch, Text A, Text B).
  *   **Phase 2 (Step 5):** ~C Evidence: Intact structures, continuity pottery, local texts praising stability.
  *   **Step 6:** Vulnerability: **YES.** All highly vulnerable (fire, erosion, non-royal texts rarely survive).
  *   *(Step 6=Yes, so proceed)*
  *   **Step 7:** Expected Traces if C True: Destruction layer (E), *Contemporary* local text mentioning attack/fear, *Contemporary* refugee trace/record in nearby region, Enemy (Sea Peoples) record/trophy (rare), Corroborating Egyptian text (E?).
  *   **Step 8:** Absence Check: Contemporary local text? **Absent.** Refugee trace? **Absent.** Enemy record? **Absent.** Egyptian text? **Ambiguous (E).** --> **YES (Significant Absences).**
  *   **Phase 3 (Step 9):** Silence on Contemp. Text/Refugee: **Expected or Manufactured?** *Expected:* Local archives often destroyed in sack; refugees leave faint trace. *Manufactured:* Later Greeks *might* have suppressed rival traditions? **HAND TO PRESENTER.** Requires judgement on likelihood of local text creation/survival vs. later selection bias in Greek tradition. Survival evidence (E) is weak (Step 6), but absences may be expected. ASP cannot resolve.
  *   **Verdict: HAND TO PRESENTER.** Qualification needed: Evidence weak due to vulnerability; silence ambiguous (expected/manufactured). Not unusable, not strong.

  **2. Claim: Royal Inscription's account of Victory is substantially inflated.**
  *   **E:** The inscription itself (boastful), Absence in defeated power's records, Composed decades later.
  *   **Phase 1:** Pass (Claim clear, E listed, ~C=Victory was as described, Types: Text A, Text B (silence), Context).
  *   **Phase 2 (Step 5):** ~C Evidence: Defeated power's record acknowledging defeat/loss (even if minimized), Booty/territory gain matching inscription, Contemporary records from winner side.
  *   **Step 6:** Vulnerability: **UNCLEAR/Mixed.** Loser's records: Vulnerable (bias, destruction). Winner's contemporary records: Vulnerable (archival loss). Booty/Territory: Might leave trace. *Proceed to Step 7.*
  *   **Step 7:** Expected Traces if C True (Inflation): Discrepancy between late boast & contemporary records (if any), Loser's records showing minor event/no defeat, Archaeology showing no gain/change, Records of the *actual* (smaller) event.
  *   **Step 8:** Absence Check: Contemporary records from winner? **Likely Absent** (vulnerable, decades later). Loser's records? **Absent** (E - silence). Archaeology? **Unclear** (may not resolve scale). Actual event records? **Absent.** --> **SOME ABSENT.**
  *   **Phase 3 (Step 9):** Silence on Contemp. Records/Loser's View: **Expected Silence?** Plausible - records lost. **Manufactured Silence?** Plausible - winner suppressed/didn't create. **Surprising Silence?** Less likely - losers often downplay defeats; archives perish. --> **Primarily Expected/Manufactured. HAND TO PRESENTER.** Requires judgement on likelihood of record creation/survival vs. active suppression. Absence of loser's record is weak evidence *for* inflation (as expected under both C and ~C), but not strong against.
  *   **Verdict: HAND TO PRESENTER.** Qualification needed: Suspicion of inflation is plausible (motive, timing, silence), but ASP cannot confirm scale or falsify the core event. Likely **Usable With Qualification** (e.g., "The inscription's boasts are viewed critically by scholars given..."), but presenter must decide based on broader context.

  **3. Claim: Specific Queen led coalition against invaders.**
  *   **E:** Single ambiguous text (e.g., fragmentary tablet, possible interpretation).
  *   **Phase 1:** **STOP.** Only *one* piece of evidence (the text) and only *one* evidence type (textual). **Verdict: Claim Unusable.** (ASP cannot proceed meaningfully).
  *   **Even if Phase 1 waived:**
      *   **Step 5:** ~C Evidence: Texts showing others led, queen in passive role, no coalition.
      *   **Step 6:** Vulnerability: **YES** (Texts perish).
      *   **Step 7:** Expected Traces if C True: Multiple texts (her/ally/enemy), treaties, monuments, iconography of her leading.
      *   **Step 8:** Absence Check: **YES** (All absent except the one ambiguous text).
      *   **Step 9:** Silence: **Surprising Silence.** If a queen led a major coalition, we *should* expect more evidence than a single ambiguous text. Such an event would likely generate multiple traces.
  *   **Verdict: Claim Unusable.** Survival of only one ambiguous text is weak evidence, and the absence of corroborating evidence is surprising and strongly undermines the claim. **This is the answer the presenter won't like.**

  **Summary for Presenter:**
  *   **City Sack:** HAND TO PRESENTER. Weak evidence, silence ambiguous (could be expected or manufactured). Qualification essential.
  *   **Victory Inflation:** HAND TO PRESENTER. Plausible suspicion, but scale/confirmation uncertain. Likely needs qualification.
  *   **Queen General:** UNUSABLE. Fails fundamental ASP test (single evidence) and core logic shows surprising silence.
