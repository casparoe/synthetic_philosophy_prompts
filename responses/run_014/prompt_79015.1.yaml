  I'll structure the procedure with four main phases: Claim Parsing, Survival Asymmetry Test, Silence Analysis, and Final Verdict. Each phase has specific questions. The researchers should stop early if evidence fails basic checks or if the claim is unsupported. 

  For the Silence Analysis, distinguishing the three silences is key. Expected silence isn't problematic, surprising silence undermines the claim, and manufactured silence requires editorial judgment. The procedure must flag when human judgment is needed.

  The test cases will show how it works. The city sacking might pass with qualifications. The victory inflation could be usable but qualified. The queen claim should fail due to lack of multiple evidence streams and surprising silence. That should please the user since the presenter likes that story but the procedure rejects it.

  I need to ensure the checklist fits one page. Avoid academic jargon. Use simple language: "stop here if..." and "if no, claim fails." Specify what "sufficient answer" means for each step, like "identify at least two independent evidence types."

