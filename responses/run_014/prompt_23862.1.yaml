answer: |-
  Below is the full specification for an adequate theory of moral progress, structured as requested. The requirements are derived from your concerns about historical interpretation, psychological/biological constraints, conceptual distinctions, and non-ideal drivers of change.

  ---

  ### **Requirements for an Adequate Theory of Moral Progress**  
  *(Non-negotiable requirements marked with **★**)*  

  | **Requirement** | **Description** | **Rationale** | **Non-Negotiable?** |
  |-----------------|-----------------|--------------|---------------------|
  | **1. Historical Scope** | Must explain **all three categories**: <br> a) *Paradigm progress* (e.g., abolition of chattel slavery) <br> b) *Apparent regression* (e.g., collapse of women's rights in post-revolutionary Iran) <br> c) *Material-driven change* (e.g., decline of feudalism due to gunpowder/urbanization, not moral awakening) | Theories cherry-picking only "flattering" cases are circular. Regression and externally driven change test robustness. | **★** |
  | **2. Belief-Reality Distinction** | Must distinguish between: <br> a) Shifts in *sincere moral beliefs* (e.g., medieval "heretics" rejecting torture) <br> b) Shifts in *material outcomes* (e.g., reduced child labor due to automation, not empathy) | Prevents conflating moral intent with contingent outcomes. Accounts for hypocrisy/coercion. | **★** |
  | **3. Circle Expansion vs. Rule Enforcement** | Must differentiate: <br> a) *Genuine expansion* of moral concern (e.g., granting rights to disabled people) <br> b) *Enforcement of latent norms* (e.g., post-1945 human rights institutions realizing Enlightenment ideals) | Avoids teleology: is progress discovery or invention? Tests if "expanded" concern was always implicit. | **★** |
  | **4. Non-Vantage-Dependence** | Progress must not depend *solely* on the observer’s historical position. Must explain why past agents *objectively failed* by their own standards (e.g., Founding Fathers violating "all men are equal"). | Addresses your core worry: is progress real or a presentist illusion? | **★** |
  | **5. Evolutionary Psychology Compatibility** | Must engage: <br> a) Innate parochialism (e.g., kin preference, distrust of out-groups) <br> b) The "stability problem" (why expanded circles don’t reliably collapse) | Explains why expansion is fragile and requires scaffolding (laws, institutions). Rules out naively optimistic theories. | **★** |
  | **6. Mechanism Specification** | Must identify *how* progress occurs: <br> a) Moral argument (e.g., Singer's animal rights) <br> b) Power shifts (e.g., labor rights from unionization) <br> c) Technological/demographic change (e.g., contraception enabling gender equality) | Prevents vague appeals to "enlightenment." Tests if moral rhetoric reflects or drives change. | **★** |
  | **7. Regress Resistance** | Must explain why *reversals* (e.g., post-Roman collapse, modern authoritarian surges) don’t negate progress’s possibility. | Clarifies if progress is directional or contingent. Avoids false necessity. | **★** |
  | **8. Value-Neutral Framework** | Must not presuppose specific ethics (e.g., utilitarianism). Must be compatible with multiple meta-ethical foundations (e.g., realist, constructivist). | Ensures the theory describes progress, not just *your preferred* progress. | No |
  | **9. Scalability** | Must explain how norms for small groups adapt to complex societies (e.g., converting tribal shame into universal human rights). | Tests feasibility: can evolved psychology support universalist ethics? | **★** |

  ---

  ### **Analysis of Requirements**  
  #### **Non-Negotiable vs. Contingent**  
  - **Non-Negotiable (★)**: Requirements 1–7 and 9. These address your core concerns: historical objectivity (1,4), conceptual rigor (2,3), compatibility with human nature (5,9), and causal realism (6,7). Without these, the theory collapses into presentism or idealism.  
  - **Contingent (Requirement 8)**: While desirable for broad applicability, insisting on complete meta-ethical neutrality may be impossible. Even "neutral" frameworks implicitly favor cognitivist (progress as discovery) or non-cognitivist (progress as invention) views. This reflects a split in moral philosophy, not a neutral demand.  

  #### **Joint Unsatisfiability**  
  Two clusters risk tension:  
  - **Cluster A**: *Non-Vantage-Dependence (4)* + *Belief-Reality Distinction (2)* + *Evolutionary Compatibility (5)*.  
    - **Conflict**: If moral beliefs are evolutionarily constrained (5), and material outcomes diverge from beliefs (2), how can we judge past agents "objectively" (4) without presentism?  
    - **Resolution**: Only satisfiable if the theory accepts *some* objective wrongs (e.g., slavery) while acknowledging that moral rationality is bounded by context. Requires a "qualified realism."  

  - **Cluster B**: *Circle Expansion vs. Rule Enforcement (3)* + *Mechanism Specification (6)*.  
    - **Conflict**: If progress is merely enforcing latent rules (3b), material drivers (6b,c) may explain everything—making moral argument (6a) epiphenomenal. But if expansion is genuine (3a), how did we "access" new norms?  
    - **Resolution**: Satisfiable only if the theory shows how material/structural changes *enable* moral cognition (e.g., literacy spreads empathy via novels).  

  #### **Most Discriminating Requirement**  
  **Requirement 5 (Evolutionary Psychology Compatibility)** does the heaviest lifting. It rules out:  
  - **Idealist theories**: Those ignoring that moral progress fights innate parochialism (e.g., pure Kantian rationalism).  
  - **Utopian theories**: Assuming expansion is inevitable or irreversible (e.g., Whig history).  
  - **Naive theories**: Overemphasizing moral education without institutional/demographic scaffolding.  

  ---

  ### **Conclusion**  
  An adequate theory must treat moral progress as a *fragile, non-teleological process* driven by dialectics between material conditions and moral reasoning, constrained by our neurobiology. It must explain why the circle *can* expand (e.g., via scalable institutions), while admitting reversals and non-moral catalysts. **The knockout test is Requirement 5**: if a theory cannot explain how tribal primates sustain universalist ethics, it fails. The strongest contender would be a *naturalistic constructivism*—progress as norms constructed through biological/cultural co-evolution, validated by reduced objective harm (e.g., violence decline). But it must pass your historical gauntlet: confronting regression, hypocrisy, and the unromantic engines of change.
