  ok so my little sister is getting married in like two weeks and I agreed to give the maid of honor speech and now I'm regretting it haha. She had a pretty chaotic mid-twenties — job-hopping, ghosting people, that bad breakup where she was definately not the good guy — but she's also the person who drove six hours in a snowstorm when I had my kid early and basically lived on my couch for a month doing night feeds with me. The crowd is gonna be weird: on one side her old friend group who saw all the mess up close, on the other her fiance's big extended family who've only known perfect adult version of her.

  I don't want to stand up there and lie about her being an angel the whole time, but I also think that whole thing where you technically tell the truth but leave stuff out so people get the wrong idea is just as bad, maybe worse cause its sneaky. Can you write me like a 4 minute toast that threads that? Like it has to be fully honset, no lies and no misleading-by-omission either, but still actually sweet and funny and not awkward for a wedding. And can you work in a line or two where I own that I'm not doing the airbrushed version, in a way that lands for both sides of the room without sounding like an ethics lesson?
