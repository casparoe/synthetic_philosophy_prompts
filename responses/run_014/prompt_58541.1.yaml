prompt: |-
  I coordinate maintenance for a shared laboratory kitchen and help moderate a volunteer-run discussion forum, and the same obstacle recurs in both settings. In the kitchen, disorder grows not because anyone overuses the facilities but because restoring order would require confronting those who leave messes, a task each member hopes another will undertake. In the forum, inaccurate posts stand uncorrected not for lack of knowledgeable readers but because correction invites protracted dispute that each reader prefers someone else absorb. The trouble is plainly related to failures around shared resources, yet nothing is depleted by use; what is missing is willingness to enforce a norm. Has this arrangement received an established designation, how should it be distinguished from straightforward free riding on a shared benefit and from depletion through overuse, and if no designation exists, what term and definition would you propose together with the boundary cases that separate it from those neighboring phenomena?
reasoning: |-
  Okay, the user coordinates a shared lab kitchen and moderates a volunteer forum. Both settings face the same issue: messes in the kitchen aren't cleaned up because no one wants to confront the mess-makers, and inaccuracies in the forum persist because no one wants to deal with the arguments that corrections might spark. 

  Hmm, the user points out that this isn't about resource depletion or free-riding—no one's overusing the facilities or avoiding contributions. Instead, it's about enforcing norms. The problem is that everyone hopes someone else will step up to enforce rules, leading to collective inaction. 

  First, I need to recall if there's an established term for this. The Bystander Effect comes to mind—where individuals don't help because they assume others will—but that's more about emergencies. The Tragedy of the Commons involves resource depletion, which doesn't fit here. Free-riding is when someone benefits without contributing, but here, the issue isn't about contribution; it's about enforcement. 

  Then there's the Volunteer's Dilemma, where one person must bear a cost for the group's benefit. That seems closer. In the kitchen, confronting someone is a cost; in the forum, correcting a post risks a dispute. Each person hopes another will do it, leading to inaction. So the Volunteer's Dilemma is relevant, but maybe not comprehensive enough because it's more about discrete actions rather than ongoing norm enforcement. 

  The user might be looking for a term that specifically addresses the enforcement gap in communal settings. Since no perfect term exists, coining one makes sense. "Norm Enforcement Paralysis" or "Collective Enforcement Failure" could work. The key elements are: shared norms, avoidance of enforcement due to personal cost, and the expectation that others will handle it. 

  Boundary cases are important to distinguish this from similar concepts. For example, free-riding involves not contributing, but here, members contribute otherwise—they just avoid enforcement. Depletion problems like the Tragedy of the Commons involve physical resources running out, which isn't the case here. The Bystander Effect is about immediate help in crises, whereas this is about sustaining norms over time. 

  The user's deeper need might be to understand and communicate this issue effectively to their team or forum members. Having a clear term and definition could help in addressing the problem systematically. They might also need strategies to overcome this paralysis, like assigning rotating enforcers or creating easier reporting mechanisms. 

  In summary, the core issue is the lack of norm enforcement due to dispersed responsibility and personal cost. The proposed term should encapsulate this, distinguishing it from related concepts with clear boundaries.
answer: |-
  This phenomenon you describe has a well-established conceptual framework but lacks a single universally accepted term. It sits at the intersection of several social dilemmas, primarily the **Volunteer's Dilemma**, amplified by **Diffusion of Responsibility**, specifically concerning **norm enforcement**.

  Here's the breakdown:

  1.  **Core Concept: Volunteer's Dilemma (VD)**
      *   **Definition:** A social dilemma where a collective good (a clean kitchen, accurate forum) requires at least one individual to bear a personal cost to provide it. Everyone benefits if *someone* acts, but each individual prefers that *someone else* pays the cost.
      *   **Mapping:**
          *   **Kitchen:** The "cost" is the social discomfort/effort/time of confronting the mess-maker. The good is a clean space.
          *   **Forum:** The "cost" is the time, emotional energy, and risk of conflict involved in correcting an inaccurate post. The good is accurate information.
      *   **Outcome:** As the number of potential "volunteers" (enforcers) increases, the probability that *anyone* will volunteer decreases. Everyone waits for someone else, and the norm erodes.

  2.  **Amplifying Mechanism: Diffusion of Responsibility (DoR)**
      *   **Definition:** In group settings, individuals feel less personal responsibility to act because they believe others are equally responsible and capable of acting.
      *   **Mapping:** This directly explains *why* each member hopes another will undertake the confrontation/correction. "Someone else will do it" or "It's not specifically *my* job" becomes the dominant thought.

  3.  **Specific Focus: Norm Enforcement Cost Avoidance**
      *   The shared resource isn't being *physically depleted* (like fish in a lake) or *free-ridden upon* in the classic sense (like enjoying streetlights without paying taxes). The resource suffering is the **shared norm itself** (cleanliness, accuracy).
      *   The failure is the **collective unwillingness to bear the personal cost (social, temporal, emotional) of enforcing the norm**, due to the VD structure and DoR. The norm decays not from violation *alone*, but from the lack of *sanctioning* for violations.

  **Proposed Designation: Norm Enforcement Paralysis (NEP)**

  *   **Definition:** A state of collective inaction within a group where a shared norm is eroding due to violations, and the restoration of the norm requires at least one member to bear a personal cost (social discomfort, time, conflict risk) to enforce it. Each member, recognizing the collective benefit of enforcement but wishing to avoid the personal cost, refrains from acting based on the expectation or hope that another member will undertake the enforcement action, leading to a persistent failure to uphold the norm.
  *   **Key Characteristics:**
      *   Existence of a clear, shared norm.
      *   Observable norm violations occurring.
      *   Enforcement requires a cost (non-monetary, usually social/emotional/temporal) borne by the enforcer.
      *   Enforcement benefits the whole group (non-excludable).
      *   Group members are aware of the violation and the need for enforcement.
      *   Inaction stems from the desire to avoid the enforcement cost coupled with the belief that others are equally responsible/able to act (DoR).

  **Distinguishing from Neighboring Phenomena:**

  1.  **Classic Free Riding:**
      *   **Focus:** Avoiding *contributing* to the *provision* or *maintenance* of a shared resource (e.g., not paying dues, not helping build the well).
      *   **Distinction from NEP:** In NEP, members *are* generally willing to *use* the resource according to the norm (clean the kitchen *they* used, post accurately *themselves*) and may even contribute to its maintenance *if it doesn't involve confronting others*. The failure is *specifically* in the *enforcement* action against *others'* violations. A free rider avoids contributing labor/money; an NEP sufferer avoids contributing *sanctioning*.
      *   **Boundary Case:** If someone *both* leaves messes *and* avoids confronting others, they are free-riding *on the norm enforcement system itself*. Pure NEP involves members who follow the norm personally but fail to enforce it on violators.

  2.  **Depletion through Overuse (Tragedy of the Commons):**
      *   **Focus:** Physical consumption or degradation of a finite resource because individual users benefit directly from overuse, while the costs are shared by the group.
      *   **Distinction from NEP:** In NEP, the problem is **not resource depletion**. The kitchen space isn't used up; forum bandwidth isn't maxed out. The resource suffering is the *intangible norm* (cleanliness, accuracy), decaying due to *lack of sanctioning*, not over-consumption. The cost avoided is social/confrontational, not the cost of *using* the resource.
      *   **Boundary Case:** If messes physically block access to equipment (e.g., a sink piled high with dishes), then depletion/blockage *is* occurring. Pure NEP involves messes that are inconvenient/annoying/violate norms but don't physically prevent use.

  3.  **Bystander Effect:**
      *   **Focus:** Individuals are less likely to help a victim in an emergency when others are present (due to DoR, pluralistic ignorance).
      *   **Distinction from NEP:** The Bystander Effect typically involves a sudden, unambiguous emergency requiring immediate aid to a specific victim. NEP involves *ongoing, chronic norm violations* requiring enforcement action *against a violator* to benefit the *collective*, not necessarily an immediate rescue. The cost in NEP is often the *interpersonal confrontation*, whereas in the Bystander Effect, it's often general hesitation or uncertainty.
      *   **Boundary Case:** If a single, egregious, immediate violation occurs in the kitchen/forum (e.g., someone starts a fire, posts dangerous misinformation requiring *immediate* takedown), and no one acts due to DoR, it's closer to the Bystander Effect. NEP involves the gradual decay from repeated, smaller violations.

  **In Summary:**

  *   **You are observing:** **Norm Enforcement Paralysis (NEP)**.
  *   **Core Mechanism:** A **Volunteer's Dilemma** structure applied to the costly act of norm enforcement, amplified by **Diffusion of Responsibility**.
  *   **Distinct from Free Riding:** Free riding avoids *contributing*; NEP avoids *enforcing* against others' violations.
  *   **Distinct from Resource Depletion:** NEP erodes *norms*, not finite physical resources. The resource isn't consumed; the *rule* is ignored due to lack of sanctioning.

  **Addressing NEP requires strategies to reduce the perceived cost of enforcement (e.g., clear reporting channels, anonymous feedback, rotating "enforcer" roles) and combat diffusion of responsibility (e.g., making individual responsibility explicit, fostering a stronger shared identity, celebrating enforcers).** Recognizing it as a specific type of social dilemma is the first step towards finding solutions.
