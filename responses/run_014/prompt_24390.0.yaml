prompt: |-
  I run a small expert-dispute desk, and we keep getting cases where two credible experts give conflicting probability estimates on the same factual question and the client has to make a decision that cant be reversed. Right now we just average the two numbers or go with whoever is more senior, which I know is basically a coin flip. Can you turn the common-prior assumption and Aumann's agreeing-to-disagree result (that whole line of work) into a decision procedure my team can actually run on a case, even though none of us have a decision-theory background and we've got roughly a day per case: the questions to put to each expert in order, what counts as a sufficient answer to each, how to tell whether the disagreement is just asymmetric information we can elicit, versus one of them being incoherent, versus the two of them genuinely holding different priors, and where the procedure stops and hands the call to a person because it has become a values question rather than a facts question. Be honest about which steps are judgment calls dressed up as procedure and where the whole thing will misfire, including the case where the common-prior assumption is just false and we should say so instead of forcing a verdict. Then run it on two worked cases: a structural engineer and a geologist disagreeing on the probability a bridge deck fails within ten years, and two epidemiologists disagreeing on whether a new treatment actually reduces mortality. Make sure at least one of the two lands somewhere the client would not want it to.
reasoning: |-
  We are going to design a procedure that uses the common-prior assumption and Aumann's agreement theorem as a basis. The key idea is that if two experts have common priors and their information is common knowledge, then they cannot agree to disagree (i.e., they must have the same posterior). If they disagree, it must be because they have different priors or because they have not fully shared their information.

  However, note that in real life, the common prior assumption might not hold, and full sharing of information might be impractical. Our procedure will try to elicit as much information as possible to see if the disagreement can be resolved by information sharing. If not, we will have to conclude that the experts have different priors (or that one is making a mistake) and then we must use a different approach.

  The procedure:

  1. **Initial Assessment:**
     - Each expert provides their probability estimate and a brief summary of the reasoning and key evidence they used.

  2. **Information Sharing Round:**
     - We arrange a structured discussion (or exchange of written responses) where each expert is asked:
       a. What information do you have that the other expert might not have considered?
       b. What assumptions are you making that might differ from the other expert?
     - After this exchange, each expert is asked to update their probability estimate.

  3. **Check for Agreement:**
     - If after the information sharing the experts' estimates converge (or become very close), then we can take the average or the updated estimate as the consensus.
     - If they still disagree, we proceed to the next step.

  4. **Elicit the Experts' Information Structures:**
     - We ask each expert to break down their reasoning by providing:
       - The key factors (variables) they considered.
       - How they weighted each factor (qualitatively or quantitatively).
       - Any dependencies between factors.
     - We then try to reconcile the factors. If there are factors that one expert considered and the other did not, we ask the other expert to incorporate that factor and re-estimate.

  5. **Check for Common Prior and Coherence:**
     - We try to see if the disagreement might be due to a mistake in reasoning (incoherence). We can ask:
       - Are the probability estimates internally consistent? (e.g., do they obey the laws of probability?)
       - We might use a simple calibration check or ask for the probability of related events to see if the estimates cohere.
     - If we find an incoherence, we point it out and ask the expert to adjust.

  6. **If Disagreement Persists:**
     - We conclude that the experts have different priors (or different models) and that the common prior assumption does not hold in this case.
     - We then have two options:
       a. Present both estimates and the reasoning to the client and let the client decide (based on which model they trust more, which might be a values question).
       b. Use a weighted average based on the track record of the experts (if available) or other meta-information (like expertise in the specific sub-area).

  However, note that step 6b is a judgment call and not derived from the common prior framework.

  **When the procedure stops and hands over to a person:**
  - When we determine that the disagreement is due to different priors (which are not objectively right or wrong) or different models, then it becomes a question of which model the client trusts more. This is a values-based decision because it might depend on the client's risk aversion, past experiences, or other subjective factors.

  **Where the procedure might misfire:**
  - If the experts are not truthful in sharing information.
  - If the common prior assumption is false and we force a consensus when we shouldn't.
  - If the problem is too complex to break down in a day.
  - If the disagreement is due to a fundamental uncertainty that cannot be resolved by information sharing.

  **Worked Example 1: Bridge Deck Failure**

  Experts:
  - Structural Engineer (SE): Probability of failure in 10 years = 20%
  - Geologist (G): Probability of failure in 10 years = 5%

  Step 1: Initial reasoning:
  - SE: Focuses on the aging of the bridge structure, recent inspections showing corrosion, and increased traffic load.
  - G: Focuses on the stability of the ground, the absence of seismic activity in the region, and the bedrock quality.

  Step 2: Information sharing:
  - SE shares: The bridge has been showing signs of fatigue in the deck supports, and there have been several reports of cracks. Also, the original design did not account for the current traffic volume.
  - G shares: The soil tests from last year showed very stable conditions, and the region has not had an earthquake above magnitude 4 in 100 years.

  After sharing, both experts update:
  - SE: "I didn't know the soil was that stable. That reduces the chance of sudden foundation failure. I lower my estimate to 15%."
  - G: "I was not aware of the corrosion and increased traffic. That increases the risk. I raise my estimate to 10%."

  Step 3: They are still at 15% and 10%. We proceed.

  Step 4: Factor breakdown:
  - SE's factors: corrosion (weight: high), traffic load (high), material aging (high), soil stability (now medium after update).
  - G's factors: soil stability (very high), seismic risk (low), climate impact on soil (low), structural condition (now medium after update).

  We note that SE has considered material aging and traffic load in more detail, while G has considered long-term soil stability and seismic risks. We ask each to incorporate the other's main factor:

  - SE is asked: What if we assume the soil is as stable as the geologist says? SE recalculates and says 12%.
  - G is asked: What if the structural issues are as bad as the engineer says? G recalculates and says 12%.

  Now they agree at 12%. We stop and report 12%.

  **Worked Example 2: Epidemiologists on a New Treatment**

  Experts:
  - Epidemiologist A (from a public health background): Probability that the treatment reduces mortality = 80% (i.e., 80% chance that the treatment is effective).
  - Epidemiologist B (from a clinical trials background): Probability that the treatment reduces mortality = 40%.

  Step 1: Initial reasoning:
  - A: Based on observational studies and biological plausibility, and the fact that similar drugs have worked.
  - B: Based on a recent randomized controlled trial (RCT) that showed no significant reduction in mortality (p=0.1).

  Step 2: Information sharing:
  - A shares: There are several large observational studies that show a 30% reduction in mortality, and the mechanism is well understood.
  - B shares: The RCT is the gold standard and the observational studies might be confounded. The RCT had 5000 patients and the effect was not significant.

  After sharing:
  - A: "I didn't know about the RCT. But the RCT might have been underpowered or had issues. I lower my estimate to 60%."
  - B: "I know about the observational studies, but I don't trust them because of potential confounding. The RCT trumps. I maintain 40%."

  Step 3: They are at 60% and 40%. We proceed.

  Step 4: Factor breakdown:
  - A: Observational data (weight: high), biological plausibility (high), RCT (medium, but with concerns about power).
  - B: RCT (very high), observational data (low, because of confounding), biological plausibility (medium).

  We ask each to incorporate the other's main concern:

  - A is asked: If we assume the RCT is the best evidence and we ignore the observational studies, what would you say? A: "Then I would have to rely on the RCT, which is inconclusive. But my prior belief based on biology is still strong. I'd say 45%."
  - B is asked: If we assume the observational studies are not confounded and are as good as the RCT, what would you say? B: "Then I would combine the evidence. The observational studies show an effect and the RCT doesn't contradict it strongly. I'd say 55%."

  Now they are at 45% and 55%. Still a gap.

  Step 5: Check for coherence. We ask both to estimate the probability that the treatment is effective given the RCT result. We also ask for the probability that the RCT was underpowered (if that's a point of contention).

  - A: "The RCT had 80% power to detect a 20% reduction. The observed reduction was 10%, so it might be underpowered. I think there's a 70% chance the treatment has at least a 10% reduction."
  - B: "The RCT was designed to have 90% power for a 25% reduction. The observed effect was small and not significant. I think there's only a 40% chance of any mortality reduction."

  We note that they are still not agreeing. Moreover, we see that they interpret the same RCT differently.

  Step 6: We conclude that the disagreement is due to different priors (A has a higher prior belief in the treatment) and different weighting of evidence (A weights observational studies and biology more, B weights RCTs more). This is a fundamental difference in how they interpret evidence.

  We cannot force a consensus. We present both estimates (45% and 55%) and their reasoning to the client. The client must decide which line of reasoning they trust more. This becomes a values question: does the client trust the public health perspective (which might be more holistic) or the clinical trial perspective (which is more rigorous but might miss real-world effects)?

  **In this second case, the client might not want to see a split decision, but the procedure has revealed that there is no objective way to merge these two views. Forcing an average (50%) would hide the underlying disagreement and the reasons for it.**

  **Honest Assessment:**
  - The procedure requires the experts to be cooperative and willing to update. In practice, experts might be entrenched.
  - The common prior assumption might be false. We try to resolve by information sharing, but if the priors are different, we don't force a consensus.
  - The procedure relies on the ability to break down the reasoning into factors, which might be difficult in complex cases.
  - We use judgment in how we ask the experts to incorporate each other's factors (step 4). We are essentially asking for counterfactual estimates.
  - The procedure might not work well if the disagreement is due to a complex interaction of factors that cannot be disentangled in a day.
  - The procedure might also misfire if one expert is simply wrong (incoherent) but we fail to detect it.

  **Conclusion:**
  This procedure is a structured way to elicit and share information to try to resolve disagreements. It works best when the disagreement is due to asymmetric information. When it becomes clear that the disagreement is due to different priors, we stop and hand over to the client with a clear explanation. This is better than a coin flip because it uncovers the reasons for the disagreement and sometimes resolves it. However, it does not eliminate the need for judgment.
answer: |-
  Below is a practical, step-by-step decision procedure based on the **common-prior assumption** and **Aumann's agreeing-to-disagree theorem**. The goal is to resolve disagreements between credible experts by systematically uncovering whether their disagreement stems from:  
  - **Asymmetric information** (fixable by sharing),  
  - **Incoherent reasoning** (fixable by correction), or  
  - **Genuinely different priors** (unfixable, requiring human judgment).  

  The procedure is designed for your team (no decision-theory background) and fits within a 1-day timeline. I'll specify:  
  - **Questions to ask** (structured to minimize ambiguity),  
  - **What counts as a sufficient answer**,  
  - **How to diagnose the root cause**,  
  - **When to stop** (and hand off to a human).  

  I'll also flag:  
  - 🚩 **Judgment calls** (where subjectivity is unavoidable),  
  - ⚠️ **Failure modes** (when the common-prior assumption breaks).  

  Finally, I'll run two worked examples (bridge failure and epidemiology), ensuring one lands uncomfortably for the client.  

  ---

  ### **The 5-Step Dispute Resolution Procedure**  
  **Time:** 3–5 hours per case (fits within 1 day).  
  **Tools Needed:** Whiteboard, shared document, or basic form-filling software.  

  #### **Step 1: Elicit Initial Estimates & Reasoning**  
  - **Ask each expert:**  
    > "What is your probability estimate for [event]? List the top 3–5 pieces of evidence or assumptions driving this number. Assign a confidence score (1–10) to each piece."  
  - **Sufficient answer:**  
    - A clear probability (e.g., "20%") and a numbered list of evidence/assumptions.  
    - Confidence scores must be provided (no vagueness).  
  - **Diagnostic goal:**  
    - Identify obvious gaps or contradictions. If experts share key evidence but assign wildly different weights (e.g., one rates seismic data as "critical" and the other as "irrelevant"), flag potential incoherence.  

  #### **Step 2: Structured Information Sharing**  
  - **Ask each expert:**  
    > "Review the other expert’s evidence list. For any evidence you didn’t consider: Does this change your estimate? If yes, give a revised probability. If no, explain why."  
  - **Sufficient answer:**  
    - Revised probability (if updated) or a specific rebuttal (e.g., "I disregarded this due to sample size issues in Study X").  
    - No "digging in" without justification.  
  - **Diagnostic goal:**  
    - If estimates converge → **asymmetric information** was the cause. Stop and report the new estimate.  
    - If estimates diverge or stay apart → proceed to Step 3.  

  #### **Step 3: Resolve Incoherence**  
  - **Joint session (or mediator-led):**  
    - **Ask both:**  
      > "Identify areas where your assumptions conflict. Are these conflicts due to:  
      > (a) Different interpretations of the same data?  
      > (b) One of you having data the other lacks?  
      > (c) A logical error (e.g., misapplying Bayes' rule)?"  
    - **Test for coherence:**  
      > "If [key assumption] is false, how would your estimate change? Does this obey probability rules (e.g., estimates for mutually exclusive events sum to ≤100%)?"  
  - **Sufficient answer:**  
    - Clear "yes/no" on conflicts, with examples. For coherence tests, experts must show rough calculations (e.g., "If seismic risk is 0, my estimate drops by 10%").  
  - **Diagnostic goal:**  
    - If an expert violates probability rules → **incoherence** is confirmed. Ask them to recompute.  
    - If assumptions still conflict after sharing data → **different priors** likely. Proceed to Step 4.  

  #### **Step 4: Test Common-Prior Assumption**  
  - **Ask each expert:**  
    > "Imagine we combined all shared evidence into a single report. Would a third expert, seeing only this report, arrive at a single probability? Why or why not?"  
  - **Sufficient answer:**  
    - "Yes, because all evidence is objective" or "No, because we weigh [factor] differently due to [reason]."  
  - **Diagnostic goal:**  
    - If both say "yes" but estimates differ → **hidden information or incoherence** (revisit Steps 2–3).  
    - If either says "no" → **different priors** confirmed. Proceed to Step 5.  

  #### **Step 5: Handle Different Priors (or Give Up)**  
  - **If priors differ:**  
    - **Do NOT average.** Instead:  
      - Document why priors differ (e.g., "Engineer weights material fatigue more than soil data").  
      - Present both estimates with explanations to the client.  
      - Flag: **"This is a values judgment, not a factual dispute."**  
  - **Stop and hand to human if:**  
    - Priors are rooted in non-falsifiable beliefs (e.g., "All RCTs are unreliable").  
    - The client’s risk tolerance affects the decision (e.g., "Is a 1% failure risk acceptable?").  

  ---

  ### **Key Judgment Calls & Failure Modes**  
  - 🚩 **Judgment calls:**  
    - Step 3 (coherence tests): Requires spotting probability violations. *Mitigation:* Use simple checks (e.g., "Do your estimates for failure modes sum to >100%?").  
    - Step 4 (common-prior test): Relies on experts self-reporting. *Mitigation:* Ask for concrete examples ("What would change your mind?").  
  - ⚠️ **Failure modes:**  
    - **False common-prior assumption:** If experts have fundamentally different worldviews (e.g., "frequentist vs. Bayesian"), the procedure forces artificial agreement. Solution: *Abort early and report disagreement.*  
    - **Strategic dishonesty:** Experts hide information to "win." Solution: *Threaten to penalize both if discovered.*  
    - **Time constraints:** Complex models can’t be unpacked in a day. Solution: *Use simple heuristics (e.g., "Focus on 2–3 biggest disagreements").*  

  ---

  ### **Worked Examples**  
  #### **Case 1: Bridge Deck Failure (Structural Engineer vs. Geologist)**  
  - **Expert A (Structural Engineer):** 25% failure risk in 10 years.  
    *Key evidence:* Corrosion in support beams (confidence: 9/10), increased traffic load (8/10), no redundancy (7/10).  
  - **Expert B (Geologist):** 5% failure risk.  
    *Key evidence:* Stable bedrock (10/10), no seismic history (9/10), proper drainage (8/10).  

  **Step 1:** Estimates far apart (25% vs. 5%). No shared evidence.  
  **Step 2:**  
    - Engineer learns about bedrock stability: "I didn’t know bedrock was that stable. I revise to 20%."  
    - Geologist learns about corrosion: "I underestimated beam wear. I revise to 10%."  
  **Step 3:**  
    - Conflict: Engineer weights corrosion higher; geologist weights bedrock higher.  
    - Coherence test: Both estimates for "failure due to corrosion alone" + "failure due to soil alone" sum to <100%. No errors.  
  **Step 4:**  
    - Common-prior test:  
      - Engineer: "A third expert would still pick 15–20%—corrosion is the killer."  
      - Geologist: "No—bedrock stability dominates, so 10% is right."  
  **Step 5:** Different priors (engineer prioritizes man-made factors; geologist prioritizes natural factors).  
    - **Outcome:** Report both estimates (20% and 10%) to client. Explain: "Disagreement stems from which risks to prioritize. Your choice depends on whether you trust structural or geological models more."  

  **Verdict:** **Safe for client.** The client can make an informed choice.  

  ---

  #### **Case 2: Epidemiologists (New Treatment Mortality Risk)**  
  - **Expert A (Public Health):** 5% chance treatment *increases* mortality (95% chance it helps).  
    *Key evidence:* Observational study in high-risk group (confidence: 10/10), biological plausibility (9/10).  
  - **Expert B (Clinical Trials):** 40% chance treatment increases mortality.  
    *Key evidence:* Phase 3 RCT showing no benefit (10/10), drug interaction risks (8/10).  

  **Step 1:** Estimates conflict (5% vs. 40% risk of harm).  
  **Step 2:**  
    - Expert A reviews RCT: "RCTs can miss real-world effects. I revise to 10%."  
    - Expert B reviews observational study: "Observational data is confounded. I stay at 40%."  
  **Step 3:**  
    - Conflict: Expert A trusts real-world data; Expert B trusts RCTs.  
    - Coherence test: Expert A’s estimates violate Bayes’ rule!  
      - *Mediator asks:* "If the RCT is 90% accurate, what’s your probability now?"  
      - Expert A: "Still 10%." → **Incoherent** (ignores RCT’s predictive value).  
    - Expert A revises to 25% after recalculation.  
  **Step 4:**  
    - Common-prior test:  
      - Expert A: "A third expert would agree with me—real-world evidence matters."  
      - Expert B: "No—RCTs are the gold standard."  
  **Step 5:** Different priors *and* values conflict.  
    - **Outcome:** Report estimates (25% vs. 40% risk of harm). Explain: "Expert A values real-world effectiveness; Expert B values methodological rigor. Choosing whom to trust depends on your tolerance for uncertainty and faith in clinical trials."  

  **Verdict:** **Uncomfortable for client.** The client must choose between "rigor" or "real-world relevance" – a values call. Averaging (32.5%) would hide this.  

  ---

  ### **When to Use (or Abandon) This Procedure**  
  - **Use if:**  
    - Experts are well-intentioned and time allows for Steps 1–3.  
    - Disputes are evidence-based (not ideological).  
  - **Abandon if:**  
    - Step 4 reveals non-falsifiable priors (e.g., "I distrust all industry-funded studies").  
    - The client’s decision hinges on ethics (e.g., "Is a 10% failure risk acceptable?").  

  This procedure turns Aumann’s insight into action: **Disagreement is either fixable (through sharing/correction) or a values question.** It replaces coin flips with transparent diagnostics, forcing experts to engage with each other’s reasoning. Most cases will resolve at Steps 2–3; the rest will clarify where human judgment is needed.
