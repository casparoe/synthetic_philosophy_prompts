  Then there's outcome definition. Pinker includes homicide, war deaths, etc., but critics bring in structural violence like famines or sanctions. This is construct validity: what counts as "violence"? But the debate here might go beyond stats into moral philosophy—whether structural issues should be included in violence metrics. That's another residue.

  Data quality issues like underreporting in historical records touch on survivorship bias and missing data. Modern stats can address this with sensitivity analyses, but critics doubt if historical data can ever be reliable enough. This is partly solvable but has a residue due to inherent uncertainties.

