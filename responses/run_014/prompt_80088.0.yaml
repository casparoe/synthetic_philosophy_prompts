  I've come to accept the philosophical zombie conceivability argument for dualism, and I want to stress-test it past the usual first move. Assume for the sake of argument that conceivability really does imply metaphysical possibility (the modal bridge holds) and that the zombie concept is coherent, so teh "zombies are incoherent" objection is off the table. Given that, what would count against the argument? I want the remaining exposed premises, and for each whether a committed physicalist would concede it or reframe it. And: even if the argument goes through, does it establish dualism, or at most that the mind-body identity is contingent (where a physicalist might want it to be a posteriori necessary, like water = H2O)? Does that gap matter? Lead with your bottom line in the first sentence, then the reasoning, no preamble, don't restate the question.
