  ---

  ### **AI Trust Decision Tree**  
  *Start here: What would it take for you to trust an AI system?*  

  #### **1. Must it **never fail** on any input, no matter how rare?**  
     - **Yes** → **Position: Hard Worst-Case Verification**  
       *You demand a proof of safety covering all inputs. Without ironclad guarantees, you won’t trust it.*  
     - **No** (rare failures are tolerable) → **Go to 2.**  

  #### **2. Could failures become common if **someone is actively searching** for them?**  
     - **Yes** (e.g., hackers, rivals, or misaligned AI) → **Position: Adversarial-Robustness View**  
       *Average-case safety isn’t enough—real-world optimizers exploit hidden flaws. You want defenses against targeted attacks.*  
     - **No** (failures are random/accidental) → **Go to 3.**  

  #### **3. Do you need **strict limits on maximum harm**, even if extreme failures are rare?**  
     - **Yes** (e.g., "never risk catastrophe, even for high rewards") → **Position: Quantilization-Style Bounded Impact**  
       *You’ll accept AI that avoids extreme actions, trading upside for reduced tail risk. Guarantees focus on capping harm, not eliminating all failure.*  
     - **No** (low probability of extreme harm is acceptable) → **Go to 4.**  

  #### **4. Should safety be based on **new statistical methods** or **proven engineering practices?**  
     - **New methods** (e.g., measuring failure rates on test distributions) → **Position: Empirical/Average-Case Safety**  
       *You trust AI if evals show failures are ultra-rare (e.g., 1 in 10^12) under realistic conditions. "Whose prior?" matters (e.g., designer’s vs. yours).*  
     - **Proven practices** (e.g., redundancy, audits, incremental rollout) → **Position: Deflationary Engineering Risk**  
       *Manage AI like bridges or planes—no special guarantees needed. Focus on real-world testing and process, not theoretical bounds.*  

  ---

  ### **Key Notes**  
  - **Unoccupied Combinations** (rare/incoherent):  
    - *Worst-case + No adversaries*: Demanding proofs but ignoring adversarial pressure is **incoherent** (attackers invalidate "safe" systems).  
    - *Quantilization + Adversarial focus*: Bounded impact assumes failures are *unintentional*; adding adversaries requires robustness tools (e.g., adversarial training), making it a hybrid or shifting to Position 2.  
    - *Worst-case + Quantilization*: Incompatible—one bans all failure, the other tolerates bounded failure.  

  - **Indistinguishable Leaves?**  
    - **Empirical/Average-Case Safety** (Position 4a) and **Deflationary Engineering** (Position 4b) **can blur** in practice. Both reject worst-case guarantees and focus on real-world performance. They diverge on *methods* (novel stats vs. traditional engineering), not goals.  

  - **Where Quantilization Fits**:  
    A **third option** (Position 3a) if you see "capping harm" as distinct from average-case (measuring common behavior) or worst-case (banning all failure). It’s not "average-case with steps" because it deliberately sacrifices optimal actions to bound risks.  

  - **Tree Logic**:  
    Splits prioritize **practical stakes** (adversaries → extreme harm → methodology) over abstractions. Positions reflect *actual camps* (e.g., MIRI-style verification, OpenAI-style empirical evals, robustness research).  

