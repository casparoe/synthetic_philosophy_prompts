  ### Which Updater Are You? Quiz  
  Answer the following scenarios based on your intuitive judgment about how Judy should update her beliefs. Choose the option that best reflects your view. No prior knowledge of formal update rules is needed.

  ---

  1. **Original Swamp Case (Antecedent Credence)**  
     Judy is dropped in a swamp divided into four equally likely areas: Red Territory/Red Company (RR), Red Territory/Blue Company (RB), Blue Territory/Red Company (BR), and Blue Territory/Blue Company (BB). The radio says: *"If you’re in Blue Territory, it’s 3 times as likely you’re in Red Company as Blue Company."* It says nothing about Red Territory.  
     After this report, what should be Judy’s credence that she is in Blue Territory?  
     a) 1/2 (unchanged)  
     b) Less than 1/2  
     c) Greater than 1/2  

  2. **Exaggerating Conditional Reporter**  
     Same swamp setup. Judy knows the radio operator exaggerates conditional likelihoods by a fixed factor of 2: if they say "X is k times likelier than Y," the true ratio is k/2. The operator says: *"If in Blue Territory, Red Company is 3 times likelier than Blue Company."*  
     How should Judy update?  
     a) Use the reported ratio (3)  
     b) Use the adjusted ratio (1.5)  
     c) Ignore the report (unreliable)  

  3. **Conflicting Evidence on Antecedent**  
     Judy plans to attend a cricket match. Her prior credence for rain is 10%. A weather forecaster says: *"If it rains, there’s a 90% chance the match moves indoors."* But Judy’s independent research shows that when it rains, matches move only 50% of the time. She trusts her research fully.  
     How should Judy update P(move | rain)?  
     a) Set it to 90% (as stated)  
     b) Set it to 50% (stick with her prior)  
     c) Set it to a compromise (e.g., 70%)  

  4. **Sloppy Conditional Report**  
     Same swamp setup. The radio says: *"If in Blue Territory, Red Company is 4 times likelier than Blue Company."* But Judy knows the operator is sloppy: 20% of the time, they accidentally *reverse* the conditional (e.g., saying "if A, then B" when they meant "if B, then A").  
     How should Judy update?  
     a) Use the reported conditional as-is  
     b) Use a mix: 80% weight on the reported, 20% on the reversed  
     c) Ignore the report (too unreliable)  

  5. **Original Swamp Case (Consequent Credence)**  
     Same as Q1. After the radio report, what should be Judy’s credence that she is in Blue Company (regardless of territory)?  
     a) 1/2 (unchanged)  
     b) Less than 1/2  
     c) Greater than 1/2  

  6. **Dual Conditional Reports**  
     Radio report 1: *"If in Blue Territory, Red Company is 3 times likelier than Blue Company."*  
     Report 2: *"If in Red Territory, Blue Company is 2 times likelier than Red Company."*  
     After both reports, what is Judy’s credence for Blue Territory?  
     a) 1/2 (unchanged)  
     b) Greater than 1/2  
     c) Less than 1/2  
     d) No unique answer—it could reasonably vary  

  7. **Redundant Conditional**  
     The radio says: *"If in Blue Territory, then 1 + 1 = 2."* (This is tautologically true.)  
     How should Judy update her beliefs about her location?  
     a) No update—it’s uninformative  
     b) Update as if the report mildly supports being in Blue Territory  
     c) Update by minimizing changes to her prior  

  8. **Contradictory Certainty**  
     Radio says: *"If in Blue Territory, Red Company is 3 times likelier than Blue Company."* Simultaneously, Judy receives a fully trusted report: *"You are in Blue Company."*  
     How should she resolve this?  
     a) Trust both and adjust territory/company credences to fit  
     b) Prioritize the trusted report and ignore the conditional  
     c) Suspend judgment—reports conflict irreconcilably  

  ---

  ### Scoring Key  
  Map your answers to the updating positions. Positions are:  
  - **Jeffrey Updater (JU)**: Treat testimony as direct evidence; update partitions via Jeffrey conditioning.  
  - **Minimal Updater (MU)**: Pick the posterior closest to the prior (e.g., min KL-divergence) satisfying constraints.  
  - **Constraint-Only (CO)**: Preserve constraints, but no unique posterior exists.  
  - **Skeptical (SK)**: Reject updates; testimony is ambiguous or unreliable.  

  #### Answer Mapping  
  - **Q1**:  
    - a → JU, MU  
    - b/c → CO (if chosen due to non-uniqueness), else no direct mapping  
  - **Q2**:  
    - a → JU, MU  
    - b → JU, MU (adjusted evidence)  
    - c → SK  
  - **Q3**:  
    - a → JU, MU  
    - b → SK or CO (prior dominates)  
    - c → CO (compromise = non-unique)  
  - **Q4**:  
    - a → JU, MU  
    - b → JU, MU (mixed evidence)  
    - c → SK  
  - **Q5**:  
    - a → SK  
    - b → JU, MU  
    - c → Not aligned  
  - **Q6**:  
    - a → JU, MU  
    - d → CO (constraints underdetermine territory)  
    - b/c → Not aligned  
  - **Q7**:  
    - a → SK, CO  
    - b → JU  
    - c → MU  
  - **Q8**:  
    - a → JU, MU  
    - b → SK  
    - c → CO, SK  

  #### Position Diagnosis  
  - **JU/MU Dominant**: Mostly **a/b** on Q1–6, **a** on Q8.  
    - *JU*: Q7b (updates even if weak evidence).  
    - *MU*: Q7c (minimizes change).  
    - *Note*: JU and MU often converge in these cases; they’re hard to separate here.  
  - **CO Dominant**: **c** on Q3, **d** on Q6, **c** on Q8. Emphasizes non-uniqueness.  
  - **SK Dominant**: **c** on Q2, Q3, Q4, **a** on Q5, **b/c** on Q8. Rejects updates.  
  - **Incoherent/No Position**: Mix of **c** on Q2–4 (SK) with **a/b** on Q5–6 (JU/MU).  

  #### Key Notes  
  - **JU vs. MU**: Not separable here. Both bite the bullet on Q1a (territory unchanged) and Q5b (Blue Company decreases). Use Q7 to hint: JU updates on weak evidence (Q7b), MU minimizes change (Q7c).  
  - **CO vs. SK**: CO accepts constraints but sees non-uniqueness (Q3c, Q6d). SK rejects updates entirely (Q2c, Q3b, Q4c).  
  - **Unoccupied Position**:  
    - "Always bite the bullet" (e.g., Q1a + Q3a + Q5b + Q6a) is coherent (JU/MU).  
    - "Update only when evidence is pristine" (e.g., Q1a + Q2c + Q3a + Q4c) is incoherent—selective skepticism.  
  - **Ambiguity**: Q1 and Q6d may signal CO; Q2c/Q3c/Q4c signal SK.  

  **Discuss in your seminar**: Why do intuitions diverge? Is testimony about conditionals "direct evidence" (JU/MU), a constraint (CO), or noise (SK)?
