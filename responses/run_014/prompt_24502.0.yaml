  ## Eulogy for a Man of Principle

  Thank you all for being here. For my family, for Dad’s colleagues from the tax office – so many familiar faces after all these years – and for his friends who shared his particular view of the world. We gather, hearts heavy, to remember my father. A man who, for over three decades, walked into a state tax office every day, sat down at his desk, and enforced tax statutes with diligence and precision. A man who, simultaneously and to the frequent bewilderment of those sitting near him, held a deep, unwavering conviction: "Taxation is theft."

  He knew that tension would be part of his story. He knew it would puzzle people. And he left me, standing here, with very specific instructions about what *not* to do with that central belief of his life.

  First, he asked that I not stand up and declare "taxation is theft" as settled, undeniable truth for everyone in this room. Why? Because he was too intellectually honest for that. He understood, profoundly, that the slogan only holds water if you first accept a specific, foundational theory of property rights – a theory he held dear, but knew many others, perhaps most in this room, do not share. To pretend otherwise, he would have said, was simply **sloppy**. It ignored the complexity of the world and the legitimacy of differing viewpoints.

  Second, and just as firmly, he insisted I not soften it. Not turn it into a harmless eccentricity, a quirky personality trait to chuckle about over coffee. "Oh, that was just Dad, you know, his little libertarian phase." Because it wasn't. It wasn't a phase; it was the **organizing principle** of his life. It shaped his reading, his conversations, his quiet reflections, his deep-seated sense of justice. To downplay it, to make it palatable by diminishing it, he would have called a **lie**. A disservice to the integrity with which he lived.

  So, what *do* we do with this? How do we honor the man who enforced the law he philosophically questioned, not out of hypocrisy, but out of a complex, deeply personal commitment to principle? How do we speak of it in a room filled with people who loved him, but see the world through very different lenses?

  We understand it as he lived it: not primarily as a political slogan aimed at *you*, but as a profound **discipline** he applied relentlessly to *himself*.

  For Dad, "taxation is theft" wasn't just a bumper sticker or a call to anarchy. It was a razor-sharp tool for thinking. It was a **refusal to let the word 'theft' become cheap**. He believed language mattered. Deeply. Calling something "theft" wasn't just casual slang for something you disliked, something inconvenient, or even something you felt was unjust in a minor way. To him, "theft" implied a fundamental, violent violation of an individual's rightful claim. Applying that label loosely, carelessly, diluted its power and obscured real injustice. His conviction forced him – daily – to confront the gravity of state power, the moment when an individual's resources are compelled. He demanded that seriousness of himself.

  More importantly, in the context of that gray cubicle where he spent 31 years, it was his way of **taking the individual seriously**. Utterly seriously. Even when the "individual" was a name on a tax form, a number in a ledger, or someone sitting across from him, perhaps frustrated, perhaps confused, perhaps even trying to skirt the rules. His belief compelled him to see beyond the form, beyond the statute, to the human being whose property – in his view – was being taken. It demanded he approach his work not with robotic enforcement, but with a recognition of the weight of the transaction. It required scrupulous fairness, meticulous adherence to the *letter* of the law he was bound to enforce, because the *spirit*, for him, was inherently fraught. He understood the impact, the potential for genuine hardship or perceived injustice, at a visceral level. He wouldn't let himself forget the person on the other side.

  This discipline – this intellectual rigor and profound respect for the individual – is what we can all connect with, regardless of where we stand on his underlying philosophy. We can honor the **integrity** it took to hold that conviction while faithfully performing a job that seemed, on the surface, to contradict it. We can respect the **consistency** of a man whose inner compass was calibrated to a true north he never wavered from, even when it made his daily reality complex. We can appreciate the **seriousness** with which he treated ideas, language, and the rights of others – even those he disagreed with, even those who owed the state money.

  Dad wasn't trying to convert his colleagues over coffee breaks. He wasn't looking for a political debate at the dinner table tonight. He was living a life rooted in a deep, personal commitment to a principle. A principle that challenged him, defined him, and ultimately, guided how he interacted with the world and the people in it – including all of us.

  He was a loving husband, a dedicated father, a loyal friend, and yes, a meticulous state tax auditor. He was also a man who believed fiercely in individual liberty. These things coexisted in him not as contradiction, but as facets of a complex, thoughtful, and fiercely principled whole. He asked us not to simplify him, not to diminish him, but to understand the discipline his belief represented.

  So today, we mourn a good man. A man of quiet conviction, deep thought, and unwavering personal integrity. We remember his dry wit, his love of a good argument (conducted respectfully, of course), his dedication to his family, and the surprising, sometimes challenging, depth of his principles. We can disagree profoundly with his starting point and yet admire the rigor, the respect, and the sheer intellectual honesty with which he built his life upon it.

  He wouldn't want us to agree blindly. But I think he'd hope we understood. Understood the discipline. Understood the seriousness. Understood the deep respect for the individual that his challenging slogan ultimately represented for him.

  Rest in peace, Dad. Your principles were yours, deeply held and honestly lived. And you, above all else, were deeply loved. We will miss your presence, your mind, and your unwavering, complex truth.
