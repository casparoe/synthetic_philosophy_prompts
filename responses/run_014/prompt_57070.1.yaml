prompt: |-
  I'm on the standards committee for a farmed-seafood certification scheme — we audit maybe 200 sites, mostly salmon and trout, plus a handful of shrimp farms and one crab operation. Our own precedents: we banned ice-slurry chilling for warm-water species because it seems to prolong consciousness rather than end it; we allowed CO2 narcosis for trout only after a phase-in and only where the water's buffered; we've never certified a decapod site that ships animals live to market; and last year we approved a pilot outcome metric alongside the methods list — no corneal or vestibulo-ocular response within 20 seconds of stun.

  Now a big member wants us to go fully outcome-based: scrap the approved-methods list, any slaughter method allowed as long as the site can demonstrate the metric at audit. The wrinkle is that nobody's got a validated unconsciousness indicator for shrimp or crab, so for those species the metric can't really be failed.

  Draft the memo I'll circulate before Thursday. I want an actual recommendation (accept, reject, or accept with conditions, and which conditions), reasons the applicant can engage with rather than welfare boilerplate, and a serious treatment of their best point — that our methods list is already out of date and quietly locks in expensive kit only big producers can afford. Also tell me what we'd be commiting to on decapods either way, since I suspect that's the real decision hiding in this one.
reasoning: |-
  Okay, I need to help draft a memo for a farmed-seafood certification committee. The user is on the committee and facing a proposal to switch to a fully outcome-based system for slaughter methods. Let me unpack the key points from their query.

  First, the context: Their current system audits about 200 sites, mostly salmon and trout, with some shrimp and one crab farm. They have existing precedents like banning ice-slurry chilling for warm-water species due to welfare concerns, allowing CO2 narcosis for trout under specific conditions, and never certifying decapod (shrimp/crab) sites that ship live animals. They also introduced a pilot outcome metric last year requiring no corneal or vestibulo-ocular response within 20 seconds post-stun.

  Now, a major member proposes scrapping the approved-methods list entirely. Instead, any slaughter method would be allowed as long as the site can demonstrate the unconsciousness metric during audits. The big issue is there's no validated way to measure unconsciousness for shrimp or crab - so for those species, the metric can't actually be enforced.

  The user wants a memo with:
  - Clear recommendation (accept/reject/accept with conditions)
  - Reasons that engage the applicant's arguments, not just welfare boilerplate
  - Serious treatment of the applicant's strongest point: that the methods list is outdated and favors expensive equipment only big producers can afford
  - Clarification of what this decision means for decapod certification

  I need to address the applicant's core argument about the methods list locking in expensive tech. That's valid - rigid lists can indeed stifle innovation and disadvantage smaller farms. But the outcome-only approach has major flaws too, especially for decapods where no assessment method exists.

  For decapods specifically, I suspect this proposal is really about opening the door to certifying live-shipment operations by default, since they couldn't fail the non-existent metric. That would contradict their long-standing policy.

  My recommendation should probably be "accept with conditions": Maintain the outcome metric but keep core method requirements for now, while accelerating decapod research and sunsetting outdated methods. This balances innovation with welfare safeguards.

  Key points to include:
  1) Acknowledge the legitimacy of the "methods list disadvantage" concern
  2) Explain why pure outcome-based isn't feasible yet (especially for invertebrates)
  3) Propose concrete steps to modernize the methods list
  4) Be explicit that decapod live-shipment remains uncertifiable until valid metrics exist
  5) Frame this as a transition plan toward more outcome-focused standards

  For the memo structure:
  - Start with background and proposal summary
  - State recommendation clearly
  - Present reasoning in digestible sections
  - Outline commitments for decapods
  - End with call to action

  The tone needs to be professional but accessible - this is for committee members who understand the technical context but need clear policy guidance.
answer: |-
  ## MEMORANDUM  
  TO: Standards Committee Members  
  FROM: [Your Name/Title], Standards Committee  
  SUBJECT: Recommendation on Proposal for Fully Outcome-Based Slaughter Standards & Implications for Decapods  
  DATE: [Current Date]  

  ### **Background & Proposal**  
  Member [Applicant Name/Org] proposes transitioning to a fully outcome-based slaughter standard: removing our prescriptive "approved methods" list and requiring only that sites demonstrate the existing pilot outcome metric (<20s to loss of corneal/vestibulo-ocular response) at audit. For decapods (shrimp/crab), no validated unconsciousness indicator exists, rendering the metric non-enforceable for these species.  

  ### **Recommendation: Reject the Proposal, but Adopt Critical Reforms with Conditions**  
  We recommend **rejecting a fully outcome-based approach at this time**, but **immediately modernizing the methods list** and **accelerating decapod welfare research** under the following conditions:  
  1. **Retain core method restrictions** for species/systems with proven welfare risks (e.g., ice-slurry for warm-water species).  
  2. **Sunset outdated method prescriptions** where equivalent or better alternatives exist.  
  3. **Require outcome validation** for *all* new methods via the 20s metric during pilot phases.  
  4. **Commit to a 24-month review** for full transition to outcome-based standards *if* validated decapod indicators and accessible auditing tools are developed.  

  ---

  ### **Reasoning: Balancing Innovation, Equity, and Welfare Assurance**  
  **1. Acknowledging the Applicant’s Core Argument (Methods List Limitations):**  
  *Your point is valid and urgent.* Our current methods list *does* risk technological lock-in, disproportionately burdening smaller producers with high-cost equipment (e.g., specialized percussive stunners, controlled-atmosphere systems). It also stifles innovation—promising, cost-effective techniques may be excluded simply because they weren’t envisioned when the list was drafted. **Our response:** We will immediately establish a working group to audit and modernize the methods list, prioritizing:  
  - **Cost-Benefit Analysis:** Explicitly evaluating economic accessibility of required/recommended equipment.  
  - **Innovation Pathway:** Creating a fast-track approval process for methods demonstrating equivalent outcomes via the 20s metric.  
  - **Grandfathering & Phasing:** Allowing existing sites using safe, effective legacy methods to continue while new entrants adopt best-available tech.  

  **2. Why Full Outcome-Based is Premature (Especially for Decapods):**  
  - **No Metric = No Meaningful Standard for Decapods:** Without a validated unconsciousness indicator for shrimp/crab, removing method prescriptions effectively creates *no slaughter welfare standard* for these species. Audits could not fail non-compliant sites. This violates our Precautionary Principle precedent (e.g., live shipment ban).  
  - **Salmonid/Trout Risks:** While the 20s metric works for vertebrates, its standalone use assumes perfect audit conditions. Method restrictions (e.g., prohibiting manual percussive stunning without automated backup) mitigate known failure modes (e.g., operator fatigue). Outcomes alone cannot prevent *systemic* risks.  
  - **Equity Concerns:** Ironically, pure outcome-based standards may *increase* costs for smaller farms. Validating novel methods via frequent, complex neurological assessments requires expertise and technology potentially more expensive than current prescribed equipment.  

  **3. The Decapod Decision (Hidden but Critical):**  
  This proposal forces a fundamental choice about our approach to decapod welfare:  
  - **If we reject the proposal:** We maintain the status quo: no certification for live-shipment operations, and method-based slaughter rules for the few decapod sites we audit (e.g., banning live chilling without prior stun).  
  - **If we accept the proposal:** We *de facto* certify *any* decapod slaughter method (including ice-slurry/asphyxiation without stun) because no outcome can be measured or failed. **This implicitly endorses practices we’ve historically rejected on welfare grounds.**  

  **Our Commitment Either Way:**  
  - **Rejecting Proposal:** We commit to funding/partnering on **urgent decapod indicator research** (e.g., EEG, behavioral markers) within 12 months. Until validated, maintain method-based prohibitions on high-risk practices.  
  - **Accepting Proposal (if later adopted):** We must **publicly state that decapod certification under outcome-only rules provides no welfare assurance** until metrics exist—a reputational and ethical risk.  

  ---

  ### **Path Forward: Controlled Modernization**  
  We propose:  
  1. **Modernize the Methods List (Q1 2024):** Remove obsolete tech, add performance-based options (e.g., "Any method achieving <20s to unconsciousness verified by [metric]"), include cost-effective alternatives.  
  2. **Decapod Research Sprint (2024-2025):** Partner with [e.g., Universities, FAIRR] to validate indicators. No live-shipment certification until completed.  
  3. **Conditional Sunset Clause:** If decapod metrics and accessible audit tools are validated by 2026, transition all species to outcome-based standards.  

  This addresses the applicant’s valid critique while preventing irreversible welfare backsliding, particularly for decapods. It keeps us science-led, equitable, and credible.  

  **Action Requested:** Review for discussion/vote at Thursday’s meeting. Draft updated standards framework to follow if endorsed.  

  ---  
  *Attachment: Summary Table of Recommendations & Decapod Implications*  

  **Key:**  
  ✅ = Maintain with reforms | ⚠️ = Conditionally sunset | ❌ = Reject  

  | Element                 | Current System             | Applicant Proposal        | Committee Recommendation |  
  |-------------------------|----------------------------|---------------------------|--------------------------|  
  | **Methods List**        | Prescriptive ✅            | Abolished ❌              | Modernized (Cost/Innov.) ✅ |  
  | **Outcome Metric**      | Pilot (Vertebrates only) ✅| Sole Standard ⚠️         | **Expand Use** ✅        |  
  | **Decapod Slaughter**   | Method-based ✅            | *De facto* Unregulated ❌ | **Method-based + R&D** ✅ |  
  | **Small Producer Access**| Limited ❌                 | Theoretical ✅            | **Explicit Cost Review** ✅ |  

  // End Memo //  

  **Why this works:**  
  - **Directly engages** the applicant’s equity/innovation argument while exposing the decapod loophole.  
  - **Offers a proactive solution** (modernize methods list + accelerate research) instead of just rejecting.  
  - **Makes the decapod stakes explicit**—no hiding the live-shipment implications.  
  - **Balances precaution** (keeping critical bans) **with progress** (sunsetting outdated tech).  
  - **Uses the applicant’s logic** (outcomes = ideal) to justify a *pathway* rather than immediate adoption.  

  Thursday’s discussion will hinge on decapod welfare tolerances. Frame it as: *We agree with your goals, but decapods need science before we drop safeguards.*
