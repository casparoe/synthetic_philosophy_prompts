prompt: |-
  I've been following the decision-theory threads on the rationalist blogs for a few years now, and there's an objection to expected-value maximization that keeps coming up under the label "expected value fanaticism," but I've never been able to see why it's supposed to be a genuine problem rather than a mistake in the setup. As I understand the argument, the "fanaticism" is that if you really do maximize expected value, you're committed to acting on astronomically small probabilities whenever they're paired with astronomically large values — the standard example being that you should hand over $20 to a stranger who insists there's a 1-in-a-billion chance your money will save a million lives, because the expected value comes out positive.

  Here's the part that's been bugging me, though. In that example, if the stranger is actually a con artist, the probability of the million lives being saved is just zero, not 1-in-a-billion, and the expected value of the donation is negative, so the expected-value calculation already tells you not to give the money. So it looks to me like the whole fanaticism only kicks in if you're willing to assign a nonzero probability to something that is in fact impossible, which is just an error in probability assignment, not a flaw in the expected-value principle itself.

  So I have to ask: am I just missing something about why this is meant to be a substantive objection to maximizing expected value, or is the "fanaticism" really just a confusion about which probabilities you're allowed to assign?
reasoning: |-
  Okay, the user is grappling with the "expected value fanaticism" problem they've encountered in rationalist blogs. They argue that the issue isn't with expected value maximization itself but with assigning non-zero probabilities to impossible events. My task is to determine if they're missing something deeper or if the objection is indeed just about probability assignment errors.

  First, I need to recall the standard fanaticism example: giving $20 to a stranger based on a tiny chance of saving a million lives. The user's point is that if it's a con, the probability is zero, so expected value correctly advises against it. They see fanaticism as arising only from mistakenly assigning non-zero probabilities to impossible events. 

  But why do proponents consider this a problem for expected value theory? Let me unpack the arguments. One angle is that humans can't practically distinguish between truly impossible events and extremely improbable ones. We assign non-zero probabilities to many things due to limited knowledge. For instance, how can we be absolutely certain the stranger is a con artist? There might be unknown scenarios where they could save lives. So in practice, we're forced to deal with non-zero probabilities for events that might be impossible but we can't confirm.

  Another point is that expected value calculations can be dominated by tiny-probability, high-impact events. Pascal's mugging is a classic case: a mugger threatens immense harm unless paid, with a claimed tiny probability of following through. Even if we assign an extremely low probability, the massive negative outcome could make paying seem rational. But intuitively, we'd dismiss the threat. This highlights a conflict between theory and intuition.

  The user might be oversimplifying by assuming we can always identify impossible events. In reality, our knowledge is limited. Epistemically, we might assign non-zero probabilities to events we can't rule out logically. Expected value maximization then forces us to prioritize these highly uncertain but high-stakes scenarios over more certain, lower-impact actions. This could lead to counterintuitive decisions, like constantly worrying about cosmic rays causing disasters instead of focusing on real-world problems.

  Also, there's the issue of leverage. In fanaticism scenarios, the small probability can be arbitrarily adjusted. If the stranger claims a 1-in-a-trillion chance instead, the expected value might still be positive if the payoff is large enough. This makes the decision sensitive to how we assign probabilities to highly speculative claims, which is problematic because our probability assessments for such claims are often arbitrary.

  The user's core argument is correct in a vacuum: if an event is truly impossible, assigning non-zero probability is an error. But the objection is that in practice, we can't be certain about impossibility. The theory doesn't account for the cognitive limitations in distinguishing between zero and infinitesimal probabilities. This practical epistemic challenge is where the fanaticism problem bites.

  Moreover, expected value maximization might lead to reckless behavior if taken literally. Always acting on tiny chances of huge payoffs could result in wasting resources on scams or neglecting likely beneficial actions. While the user sees this as a probability assignment issue, the deeper problem is that the expected value framework doesn't incorporate the uncertainty in our probability estimates themselves. Real-world decisions involve ambiguous probabilities, not clear-cut numbers.

  In conclusion, the user isn't entirely wrong, but they might be underestimating the practical and epistemological challenges. The fanaticism objection highlights a tension between ideal theory and real-world application, where perfect knowledge isn't available. Expected value maximization, without adjustments for uncertainty in probability assignments or decision complexity, can lead to counterintuitive and potentially harmful decisions. This makes it a substantive critique worth addressing through modified decision theories.
answer: |-
  You've hit on a crucial and nuanced point in decision theory. Your core intuition is correct: **if an event is genuinely impossible (probability exactly 0), then assigning a non-zero probability to it is an error in probability assignment, and expected value maximization (EVM) correctly yields a negative expected value in the con artist scenario.** In this strict sense, the "fanaticism" seems avoidable with perfect probability assignments.

  However, proponents of the "expected value fanaticism" objection argue that the problem runs deeper than just misassigned probabilities. Here's why it's considered a substantive objection, even acknowledging your point:

  1.  **Epistemic Uncertainty & Practical Impossibility of Zero Probability:**
      *   **We rarely know with absolute certainty that an event is *impossible*.** We only know it's *extremely improbable* based on our current knowledge, models, and understanding of physics/causality. Assigning *exactly* zero probability is often epistemically unjustified or even impossible in a Bayesian framework for events we can *describe* (like the stranger's claim).
      *   **Distinguishing "Impossible" from "Inconceivably Improbable" is Hard:** How low must a probability be before we treat it as effectively zero? 1 in 10^100? 1 in 10^1000? EVM, in its pure form, doesn't tell us this cutoff – it always cares about the product `p * V`, no matter how small `p` is, as long as `p > 0`. The "fanaticism" arises when we assign *some* non-zero probability (however tiny and justified by our uncertainty) to an astronomically large value.
      *   **The Leverage Problem:** The potential payoff `V` can be made arbitrarily large to compensate for an arbitrarily small (but non-zero) probability `p`. The stranger could say "1 in 10^100 chance of saving 10^200 lives" – the expected value calculation (`p*V = 10^100 lives saved`) still dominates the $20 cost, even though our intuition screams "scam!".

  2.  **The Core of the Fanaticism Objection:**
      The objection isn't primarily about *impossible* events. It's about **the extreme sensitivity of EVM to tiny, speculative, or deeply uncertain probabilities when paired with immense stakes.** EVM forces us to:
      *   Spend potentially infinite resources researching and hedging against arbitrarily speculative low-probability/high-impact tail risks (e.g., Pascal's Mugging variants, weird quantum immortality scenarios, Boltzmann brain concerns).
      *   Prioritize actions with minuscule chances of astronomical good over actions with near-certainty of significant good (e.g., spending $20 on the stranger *instead of* donating it to a proven effective charity where you know it will save ~0.01 lives).
      *   Make decisions dominated by outcomes we have almost no reliable way to model or assign probabilities to, making the decision process feel arbitrary or untethered from reality.

  3.  **It Highlights a Conflict with Intuition & Pragmatism:**
      The "fanaticism" label arises because pure EVM prescribes behavior that seems:
      *   **Reckless:** Willingly engaging with obvious scams or speculative schemes based purely on the mathematical product.
      *   **Paralyzing:** Spending all resources and cognitive effort on preposterously unlikely tail risks.
      *   **Counterproductive:** Diverting resources from known effective interventions to ones based on highly uncertain probabilities of vastly larger (but much less probable) payoffs.
      *   **Exploitable:** Agents (like Pascal's Mugger) can manipulate you by making increasingly outlandish claims with correspondingly tiny assigned probabilities.

  4.  **What EVM Doesn't Account For (According to Objectors):**
      Proponents of the objection argue that pure EVM lacks mechanisms to handle:
      *   **Knightian Uncertainty:** Distinguishing between quantifiable risk (known probabilities) and true uncertainty or ambiguity (unknown or deeply unreliable probabilities). Assigning a precise `p` to the stranger's claim feels like a category error.
      *   **Computational/Cognitive Limits:** The cost of calculating, verifying, and acting upon every tiny-probability/high-impact claim is prohibitive. EVM ignores these decision costs.
      *   **The Framing of Possibility:** Our intuition often treats events below a certain probability threshold as "effectively impossible" for practical decision-making, even if epistemically `p > 0`. Pure EVM rejects this pragmatic cutoff.
      *   **Robustness:** Decisions should be somewhat robust to small errors in probability assignment. Fanatical decisions are hyper-sensitive to tiny changes in `p`.

  **Conclusion: You're Partially Right, But It's Still a Problem**

  You are absolutely correct that **if `P(event) = 0` truly and accurately, then EVM correctly avoids fanaticism.** Assigning `p > 0` to a genuinely impossible event *is* an error.

  However, the substantive objection persists because:

  1.  **`P = 0` is often unattainable knowledge.** We constantly operate under uncertainty and must assign non-zero probabilities to events we strongly suspect are false or impossible, simply because we lack absolute proof. We live in the realm of `p > 0`, however tiny.
  2.  **EVM's core mathematical operation (`p * V`) is unbounded.** When `V` can be arbitrarily large (e.g., saving infinite lives, preventing astronomical suffering), even the tiniest conceivable `p > 0` can dominate *all* other finite considerations. This leads to prescriptions that clash violently with practical rationality, resource constraints, and moral intuition.
  3.  **It exposes a vulnerability in decision-making.** Pure EVM makes agents susceptible to exploitation by anyone who can concoct a sufficiently grandiose claim paired with an arbitrarily small (but non-zero) probability.

  Therefore, while misassignment of `p=0` is *one* error that avoids fanaticism in specific cases, the "expected value fanaticism" objection targets a deeper issue: **the unbounded nature of `p * V` under uncertainty and the counterintuitive, potentially disastrous or paralyzing prescriptions it generates when applied to low-probability/high-stakes scenarios in the real world, where absolute certainty (`p=0`) is rarely available.** This has led many decision theorists to explore alternatives or modifications like:
  *   **Bounded Utility:** Capping the maximum value/utility achievable.
  *   **Probability Discounting/Thresholds:** Treating probabilities below a certain threshold as effectively zero for decision purposes.
  *   **Risk Aversion over Extreme Outcomes:** Being more averse to catastrophic losses than EVM suggests.
  *   **Robust Optimization:** Making decisions that work reasonably well across a range of plausible probability assignments, rather than optimizing for one specific assignment.
  *   **Focusing on Dominated Alternatives:** Ignoring options dominated by others unless the probability/impact difference is sufficiently large and reliable.

  So, you're not fundamentally wrong about the *idealized* case with perfect knowledge. But the objection highlights a very real and problematic consequence of applying pure, unbounded EVM under the conditions of radical uncertainty and vast potential stakes that characterize many important real-world decisions. It's less about confusing `0` with `ε` and more about the overwhelming leverage `V` has over `ε` in the calculation `ε * V`.
