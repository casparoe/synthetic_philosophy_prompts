  First, I need to recall Devlin's main arguments. He believed society is held together by a shared morality, and any deviation, even in private, could threaten the social fabric. For revenge porn, Devlin would likely argue that violating sexual privacy and consent undermines fundamental moral norms. Since he thought sexual morality was central to societal cohesion, non-consensual sharing would be seen as damaging the "root system." He'd emphasize the collective outrage and the need for criminalization to protect society's moral foundation.

  Next, Hart's perspective. He distinguished between minimal universal morals (like prohibitions against harm) and broader moral norms. Hart would argue that revenge porn involves clear harm—psychological distress, reputational damage—making it a harm principle issue rather than purely moral enforcement. He'd reject the idea that society's fabric is threatened here, seeing it as a private wrong. Hart might also point to evolving social norms around digital privacy as evidence that morals can change without societal collapse.

  The user wants a deep analysis of whether revenge porn is a minimal moral rule or a culture-specific one. Devlin would categorize it as part of sexual morality, essential to societal roots. Hart would see it as harm-based, fitting within minimal morals. The key is assessing if this threatens the root system. Devlin might argue yes due to weakened trust in intimate relationships, while Hart would counter that digital age norms are adaptable and not foundational.

  For the strongest Hart-style rebuttal: Hart would challenge Devlin by arguing that criminalizing revenge porn is justified under harm prevention, not moral enforcement. The harm is tangible—emotional distress, professional repercussions—making it distinct from victimless moral crimes. Hart would also contend that society's cohesion relies on protecting individual rights, not enforcing sexual morals, and that technology changes context, making old frameworks inadequate.

  Where does this case land? It leans towards Hart because the harm is evident, and laws can be justified without invoking shared morality. However, Devlin's points about societal norms around consent and privacy still hold weight. The resolution might combine both: harm principle as the primary justification, with moral norms reinforcing it. This shows the debate's complexity and relevance to modern issues.

  The user's deeper need is to make the debate tangible for students. Using a contemporary case like revenge porn forces students to apply concepts rather than memorize arguments. Highlighting the tension between harm and morality in digital contexts can spark discussion on how legal principles evolve. Emphasizing that both perspectives offer insights—even if Hart's view dominates here—can show the ongoing relevance of the debate.
