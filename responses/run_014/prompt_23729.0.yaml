  Here's a charitable reconstruction of the Hart-Devlin debate applied to non-consensual intimate image sharing (NCII), focusing on your core question about the nature of the wrong and its relation to societal cohesion, followed by the strongest Hart-style rebuttal and a conclusion:

  **The Case:** Criminalizing the non-consensual sharing of intimate images ("revenge porn"), particularly focusing on situations where direct, quantifiable harm to a specific victim is difficult to prove (e.g., images shared anonymously to a small group, causing profound psychological distress, reputational anxiety, and violation, but no immediate physical harm or direct financial loss).

  **Lord Devlin's Charitable Reconstruction (Pro-Criminalization via Shared Morality):**

  1.  **The Foundational Wrong: Betrayal of Shared Sexual Morality:** Devlin would argue that NCII violates a fundamental pillar of the shared morality essential to society's existence: the principle of **sexual privacy and the inviolability of sexual consent**. He wouldn't see this as merely a "privacy invasion" in a generic sense, but as a specific, profound betrayal of the **intimate trust and boundaries** inherent in sexual relationships, which society depends upon for stable family units and orderly social interactions.
  2.  **Harm to Society's "Root System":** Devlin would contend that the wrong here *is* one of those minimal, near-universal moral rules. The ability to engage in intimate relationships without fear of exposure, humiliation, and loss of control over one's intimate self is foundational to human dignity and social trust. Widespread toleration of NCII would:
      *   **Erode Trust:** Undermine the fundamental trust necessary for forming intimate relationships – a core social building block.
      *   **Degrade Sexual Morality:** Signal that sexual acts and images are commodifiable without consent, cheapening the shared understanding of sexual intimacy as involving mutual respect and boundaries.
      *   **Cause Disintegration:** Foster a climate of fear, suspicion, and degradation around sexuality. If individuals feel their most intimate selves can be weaponized with impunity, it breeds alienation and weakens the "invisible bonds" holding society together. The "intense, instinctive feeling of reprobation" (disgust, outrage) society feels towards NCII is evidence of its foundational nature.
  3.  **Psychological Harm is Societal Harm Manifest:** Devlin would argue that the profound psychological harm experienced by victims *is* the manifestation of the societal harm. This distress isn't just personal; it's the symptom of a foundational moral rule being shattered *for that individual*, and the fear it instills *in everyone* represents the societal vulnerability. The difficulty in "pinning down" specific, quantifiable harm in every case doesn't negate the *category* of harm; it highlights the *moral nature* of the injury.
  4.  **Universality vs. Culture-Specificity:** While technology is new, Devlin would argue the core wrong – the non-consensual violation of sexual privacy and trust – is ancient and near-universal. Societies have always punished breaches of sexual trust (adultery laws historically, prohibitions on peeping toms, etc.). The digital medium changes the scale and permanence, not the fundamental moral violation. He would see criminalization as protecting a minimal, universal rule against profound interpersonal betrayal in the sexual sphere, essential for any society valuing individual dignity and stable relationships.

  **H.L.A. Hart's Charitable Reconstruction (Pro-Criminalization via Harm Principle, Resisting Devlin's Rationale):**

  1.  **Harm Principle as Sufficient Justification:** Hart would agree NCII should be criminalized, but **vehemently reject Devlin's "shared morality/societal disintegration" rationale as the primary justification**. Hart would argue the **profound psychological harm, reputational damage, and potential for harassment/stalking** constitute clear, direct, and severe harms to identifiable individuals.
  2.  **Distinguishing Harm from Mere Morality:** Hart would insist that the core wrong here *is* the **harm inflicted**, not the mere violation of a moral norm about sexual privacy. The intense distress, fear, damage to relationships and career prospects, and the violation of personal autonomy are the harms justifying state intervention. This places NCII firmly within the realm of the "harm principle," aligning it with other offenses against the person (assault, defamation) rather than purely "moral" offenses like consensual adult homosexuality (which Hart defended against criminalization).
  3.  **The "Root System" Analogy is Overblown and Dangerous:** Hart's strongest critique of Devlin here is that applying the "root system" argument to NCII exemplifies the **slippery slope and intolerance inherent in legal moralism**:
      *   **Is Society Really Fragile?** Hart fundamentally challenged Devlin's premise. Societies are remarkably resilient and can tolerate significant diversity in private moral beliefs and practices without collapsing. The evolution of social attitudes towards sexuality since the 1960s (premarital sex, cohabitation, homosexuality, etc.) demonstrates this. Criminalizing NCII based on harm doesn't require believing society will crumble without it.
      *   **Moral Pluralism is Possible:** A tolerant society *can* "prune" specific, outdated moral beliefs (like criminalizing sodomy) without threatening the entire structure. Core institutions (contracts, property, prohibitions on violence) survive moral shifts in private life. NCII involves harm, not just a shift in moral attitude.
      *   **Defining the "Shared Morality" is Arbitrary:** Whose outrage defines the "shared morality" demanding criminalization? Is it the victim's outrage (harm-focused), or the public's disgust (morality-focused)? Hart would argue Devlin's framework risks empowering majoritarian intolerance rather than protecting foundational societal bonds.
  4.  **Universality Rooted in Harm, Not Morality:** Hart would concede that prohibitions against non-consensual exposure/intrusion have near-universal resonance, but he would argue this is **because they cause universally recognized harms** (humiliation, fear, loss of control, reputational damage), not because they violate some specific, culturally contingent sexual moral code. The harm transcends the specific sexual context; non-consensual exposure of deeply private *non*-sexual information could be similarly harmful.

  **The Strongest Hart-Style Reply Devlin Must Answer:**

  "Professor Devlin, while I agree NCII should be criminalized, your reliance on the 'disintegration of society's shared morality' is unnecessary, empirically dubious, and philosophically dangerous. We can justify this law entirely based on the **severe and demonstrable psychological harm, loss of autonomy, and reputational damage inflicted on identifiable individuals** – harms falling squarely under Mill's harm principle. Invoking societal disintegration is speculative: modern, pluralistic societies demonstrably function without state enforcement of a comprehensive shared sexual morality. Your argument risks conflating legitimate harm prevention with enforcing majoritarian disgust. If society *is* so fragile that a private act like consensual homosexuality (or, by analogy, perhaps certain consensual sexual image creation?) threatens its foundations, isn't that a reason to strengthen society's tolerance and resilience, not a justification for intrusive criminalization? Doesn't focusing on tangible harm provide a clearer, more liberal, and less oppressive basis for law than your appeal to an amorphous and potentially repressive 'shared morality'?"

  **Where Does This Case Land?**

  This case lands **firmly but complexly on Hart's side of the debate**, while *requiring* engagement with Devlin's core concerns:

  1.  **Harm Principle is Paramount:** The strongest, most persuasive, and most liberal justification for criminalizing NCII is the **severe psychological harm and violation of autonomy**, not the violation of a shared sexual moral code *per se*. Hart's framework provides a cleaner, less slippery justification.
  2.  **Devlin's Concerns are Relevant but Not Sufficient:** Devlin correctly identifies that the violation *feels* deeply moral and attacks something fundamental (sexual trust/autonomy). His insights about the *nature* of the wrong – its profound betrayal and connection to intimacy – are valuable for understanding its gravity. However, his *justification for state intervention* (preventing societal disintegration via enforcing shared morality) is weaker than the harm-based justification. The societal harm argument feels like an unnecessary add-on when the individual harm is so clear and severe.
  3.  **Nuance on Universality:** While the *harm* (violation, distress, reputational damage) has near-universal resonance, the specific framing through the lens of "sexual morality" introduces more cultural contingency than Hart's harm-focused view. Different societies may draw the lines of "intimate" or "private" differently, but the core harm of non-consensual violation remains. Hart's minimal morals (prohibiting harm) cover this more effectively than Devlin's potentially broader "shared sexual morality."
  4.  **The Root System Test:** NCII does *feel* like it attacks a root – individual sexual autonomy and trust. However, Hart would successfully argue that protecting this "root" is best achieved through the harm principle (protecting individuals from violation) rather than by positing a collective moral good whose disintegration requires state intervention. The "root" threatened is individual dignity, best protected by liberal harm-prevention principles.

  **Conclusion:** The NCII case brilliantly illustrates the *ongoing tension* in the Hart-Devlin debate. While Hart's harm principle provides the most robust and liberal justification for criminalization, Devlin's perspective forces us to confront the deep *moral* dimensions of the harm – it's not just any distress, but distress arising from the violation of something profoundly intimate and foundational to personal identity and trust. However, ultimately, **the case vindicates Hart** by demonstrating that severe individual harm is sufficient justification for law, without needing to invoke the more nebulous and potentially illiberal concept of preserving a shared morality to prevent societal collapse. It shows that a liberal society *can* effectively prune harmful branches (like NCII) using the harm principle, without needing to justify it as protecting the entire root system from disintegration. The "root" of individual autonomy is protected precisely *by* focusing on preventing harm to individuals.
