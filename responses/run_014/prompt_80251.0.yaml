answer: |-
  Based on your description, the core dynamic is **escalation driven primarily by the relational or reputational stakes of *not losing to this specific opponent* or *not being seen to back down*, even when the material stakes become trivial or secondary.** While related concepts exist, no single established term perfectly captures this *specific* relational/reputational driver as distinct from sunk costs or pure attrition.

  1.  **Why established terms don't perfectly fit:**
      *   **Escalation of Commitment:** Focuses on justifying past investments (time, money, effort) to avoid feeling their loss was wasteful. While escalation happens, your cases show minimal *past* commitment before the relational motive kicks in. The driver is future relational loss, not justifying past expenditure. (Confidence: High)
      *   **Sunk-Cost Fallacy:** A subset of escalation of commitment, specifically about continuing a failing course due to irrecoverable past costs. Your examples explicitly state this *isn't* the driver ("could have walked away at almost no material cost"). (Confidence: High)
      *   **War of Attrition:** Focuses on parties enduring costs hoping the *other* will quit first due to inability to bear the mounting costs. While the *structure* is similar, the *motive* is different. In a classic war of attrition, the goal is still to win the *original prize* economically or to signal general toughness. Your cases highlight the prize becoming secondary to defeating *this specific rival* or avoiding *looking weak to them*. It's personal/relational. (Confidence: High)
      *   **Spite/Vengeance:** While present, these are often broader. Spite involves harming the other *at cost to oneself*, which can happen here. However, your core dynamic is *avoiding the relational loss of losing/backing down to this opponent*, which is distinct from pure malice. Spite can be a *consequence* or *component*, but not the *defining* driver. (Confidence: Moderate)
      *   **Face-Saving:** This is a *component* (avoiding looking weak). However, face-saving is often a more passive or defensive motive ("don't look foolish"). Your scenarios involve active, escalating *competition* against a specific rival driven by the refusal to let *them* win, which is more aggressive and relational than general face-saving. (Confidence: Moderate-High)

  2.  **The Gap & Proposed Term:** The established lexicon lacks a term specifically emphasizing the *competitive relational/reputational stake against a specific opponent* as the primary engine of escalation, distinct from sunk costs or attritional endurance. Therefore, I propose coining the term:

      **Relational Rivalry Escalation (RRE)**

      *   **Definition:** A pattern of conflict escalation (e.g., bidding wars, negotiations, standoffs) where the primary driver shifts from the original material stakes to the reputational or relational imperative of *not conceding victory to a specific opponent* or *not being seen by that opponent to back down*, even when the material costs of continuing exceed the value of the original stakes and past commitments are minimal.
      *   **Core Mechanism:** The perceived cost of losing *to this specific rival* (damage to status, reputation, pride, or relationship dominance) outweighs the escalating material costs or the diminishing value of the original prize.
      *   **Key Differentiators:**
          *   **vs. Sunk Cost/Escalation of Commitment:** Minimal past investment; the driver is avoiding *future relational loss*, not justifying past expenditure.
          *   **vs. War of Attrition:** The goal shifts from winning the prize/economically outlasting to *defeating this specific rival* relationally. The costs are endured not just to wear the other down generally, but specifically to avoid the relational defeat.
          *   **vs. Spite:** While spite may be present, RRE's core is *self-protection against relational loss* (losing face/status to *this* rival), not necessarily active malice towards the other. The harm to the other is often a byproduct of winning the rivalry, not the primary goal.
          *   **vs. Face-Saving:** RRE involves active, competitive escalation against a *specific* rival; it's more aggressive and relational-dyadic than passive, general face-saving.

  3.  **Boundaries - When RRE Collapses Into Other Concepts:**
      *   **Collapse into Spite:** When the primary conscious motive shifts from "I cannot lose to *them*" to "I must actively harm *them*, regardless of the cost to me or the prize." (Confidence: High)
      *   **Collapse into Ordinary Face-Saving:** When the escalation stops being about a *specific rival* and becomes about avoiding embarrassment in front of a *general audience* without an active competitive dynamic against one opponent. (Confidence: Moderate-High)
      *   **Collapse into War of Attrition:** When the original material prize remains the clear primary objective, and the parties are purely testing each other's endurance or resources to win that prize, without the intense personal/relational "winning against *you*" motive dominating. (Confidence: Moderate-High)
      *   **Trigger Point:** The shift to RRE typically occurs when the escalating costs make the original prize materially irrational, yet parties persist primarily due to the relational/rivalry dynamic.

  4.  **Confidence & Least Sure Point:**
      *   **High Confidence:** That sunk-cost fallacy isn't the driver; that war of attrition doesn't fully capture the specific relational motive; that face-saving/reputation is a key element; that no *single*, widely recognized term perfectly fits your description across fields.
      *   **Moderate Confidence:** That "Relational Rivalry Escalation" (RRE) accurately names and defines the core dynamic. It draws on established concepts (relational conflict, rivalry) but combines them specifically for this escalation pattern.
      *   **Least Sure Point:** Whether "competitive escalation" (sometimes used in auction theory/psychology) could be stretched to cover this *across contexts* like labor disputes. While it captures the rivalry aspect in auctions, it might not inherently emphasize the *relational/reputational cost of losing to this specific opponent* as strongly outside that context, and might be conflated with sunk cost motives. (Hence proposing a new term for clarity).

  \answer{Relational Rivalry Escalation}
