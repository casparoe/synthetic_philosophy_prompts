prompt: |-
  The "rational disagreement" question — whether two rational agents, given the same evidence, can rationally hold different beliefs about the same proposition — has been going on since Aumann's agreement theorem, and as far as I can tell it has stalled. Aumann's theorem says that two Bayesian agents with the same prior cannot have it be common knowledge that they hold different posteriors. But the "same prior" assumption is exactly what is in dispute, so the theorem looks like it assumes what it is trying to establish. My working theory is that the live disagreement is not really about rational belief at all, but about whether the common prior assumption is a reasonable idealization or a large, often-false one. Is that right, or is it a real empirical or formal disagreement in disguise? Diagnose it: is the disagreement verbal (about what "rational" and "disagree" mean), substantive (about a genuine question concerning rational belief), or two groups answering different questions — one about the concept of rational belief, one about the empirical question of whether agents in fact share priors — under a single heading? And given your diagnosis, what, if anything, would count as progress — a new theorem, a conceptual distinction, an empirical finding, or a change of question? Please separate what is settled (for instance, Aumann's theorem itself, given its assumptions) from what is genuinely contested among people who work on this, and do not present a contested view as the consensus. Keep the response under 500 words.
