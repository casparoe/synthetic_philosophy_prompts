  First separate empirical observations (undisputed facts) from conceptual requirements (what theories must explain). Then flag contentious assumptions masquerading as requirements. The "whole number" point definitely belongs there. 

  The joint unsatisfiability question is the most interesting part. If I can show some desiderata conflict, that becomes the group's central puzzle. The cross-cuing vs. unified self-report tension seems promising here. 

