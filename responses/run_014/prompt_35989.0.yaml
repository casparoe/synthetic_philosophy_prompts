prompt: |-
  I run genetics for a mid-size laying-hen operation and we're moving from small cages to bigger mixed-group pens, and suddenly the old way of picking breeders is breaking. Until now we've measured each hen's production and picked the top individual hens, but in the group pens the hens that score best on their own are often the nastiest ones — they eat more because they shove others off the feed. Someone at a conference told me there's a whole literature on this, that a couple decades back some people got calmer, more productive birds by selecting whole groups together instead of individual hens, and that this hooks into an old fight in evolutionary biology about whether selection acts on genes, individuals, or groups. I have a math background but zero evolutionary theory, so translate as you go.

  Write me a decision procedure for choosing breeders that my team can run every generation. It should be grounded in what the levels-of-selection debate actually says — when picking on the individual is fine, when you have to pick at the group level, and why (I gather it's something about heritable variance getting partitioned between levels, but explain that in plain terms). The procedure needs: which measurements to take and in what order; a rule for when to rank birds individually vs. rank whole groups; what to do about traits you can't score at the group level (mortality is easy, feather cover is harder, pecking order is a nightmare); and it has to be honest about where the math stops and somebody just has to make a judgement call — mark those places clearly, don't dress them up as steps.

  Then run it on three cases that are basically our real decisions: (1) feather pecking, where the damage is done by a few hens but the whole group loses feathers and it's hard to tell who's the culprit; (2) feed efficiency, where our costs are per-pen but every heritability number we have our per-bird; (3) a line where we've selected individually for egg size for ten years and I'm told moving to group selection now would cost us years of progress on the exact trait we sell. If the procedure gives an answer I wont like on case 3, give it anyway. And tell me what the procedure can't do — anywhere the biology genuinely dosn't have a settled answer, flag it instead of inventing a rule. It needs to be runnable by a technician in an afternoon with nothing fancier than a spreadsheet.
reasoning: |-
  We are addressing the "levels of selection" problem. The key insight is that when traits are influenced by social interactions (like aggression affecting feed access), individual selection might favor traits that are good for the individual but bad for the group. Group selection can help when the trait of interest (like group productivity) is not just the sum of individual traits but is influenced by interactions.

  The core concept is partitioning the variance in the trait of interest (e.g., egg production) into two components:
  1. Variance due to individual effects (how good the hen is at laying eggs in isolation)
  2. Variance due to group effects (how the group's composition affects egg production, e.g., through competition or cooperation)

  If the group effects are large and heritable, then group selection might be more effective.

  However, note that group selection is generally less efficient than individual selection because:
  - There are fewer groups than individuals, so less selection intensity.
  - Group selection requires that groups reproduce as units (which in practice means selecting whole groups of breeders).

  But in cases where there are negative social interactions (like aggression), individual selection can lead to a decline in group performance. This is because the aggressive hen benefits at the expense of others, but if we select for that aggression, we get more aggression and overall group productivity may drop.

  Decision Procedure:

  Step 1: Define the Trait of Interest
     - We are interested in traits that affect profitability. These can be:
          a. Individual traits (like egg size, egg quality, feed efficiency per bird) that are not affected by social interactions.
          b. Group-level traits (like total eggs per pen, feed efficiency per pen, mortality rate in the pen, feather cover at the group level).

     But note: some traits can be measured at both levels. The key is to decide which level of selection (individual or group) is more appropriate for each trait.

  Step 2: For Each Trait, Assess the Presence of Social Interactions
     - If the trait is not affected by social interactions (e.g., egg size in a non-competitive environment), then individual selection is appropriate.
     - If the trait is affected by social interactions (e.g., feed intake because of competition, feather pecking, etc.), then we need to consider group selection.

     How to assess?
       a. Look for evidence of heritable social effects (also called indirect genetic effects). This requires experiments but we can use observational data.
       b. Practical approach: Compare the same hens in individual cages vs. group pens. If the ranking changes (e.g., top individuals in cages are not the top in groups, or vice versa), then social interactions are important.

  Step 3: Partitioning Variance (if possible)
     - We want to estimate two components:
          Total Phenotypic Variance (V_P) = V_A (additive genetic variance) + V_E (environmental variance) + ... 
          But in a group setting, we can break down the trait of interest (say, individual egg production in a group) as:
              y_ij = μ + A_i + S_j + e_ij
          where:
              y_ij = trait for hen i in group j
              A_i = direct genetic effect of hen i
              S_j = effect of the social group j (which includes the social genetic effects of the group members)
          However, the social effect S_j is itself a function of the genes of the group members. This gets complex.

     A simpler approach for breeders:

     Option A: Individual Selection for traits without social interactions.
     Option B: Group Selection for traits with strong social interactions.

     But note: We might have multiple traits. Some may require group selection, others individual.

  Step 4: Practical Measurement and Selection

     Case 1: Traits that are group-level only (like group mortality, total eggs per pen, total feed per pen) OR traits that are individual but heavily influenced by the group (like feather damage on an individual hen, which might be caused by others).

     For group-level traits:
        - Measure the trait at the group level (e.g., total eggs per hen in the pen, average feather cover of the group, mortality rate of the group).
        - Rank the groups by the group-level trait.
        - Select the top groups. Then, within the top groups, we can either:
              a. Take all hens as breeders (if we want to maintain the group composition, and if we believe the group effect is due to the combination).
              b. Select the best individuals within the top groups (if we also have individual traits we want to select for and if the group effect is not too sensitive to the exact composition).

     However, note: if we select within the top groups, we might break down the group effect. So if the group effect is due to a particular combination (like having many non-aggressive birds), then selecting only the best individuals might not preserve that.

     Case 2: Traits that are individual and not affected by the group: measure individually and select individually.

     But what about a trait that is individual but we suspect social interactions? For example, individual feed efficiency (which might be inflated by being aggressive and stealing feed). Then we cannot trust the individual measure in the group. We have two options:
          a. Measure the trait in isolation (if possible) and then use that for selection.
          b. Use a group selection approach for a group-level trait (like group feed efficiency) and then select groups.

  Step 5: Handling Multiple Traits

     We might have:
          - Egg size (individual trait, no social interaction) -> select individually.
          - Feather pecking (group trait) -> select by group.

     But note: we cannot select on two different levels at the same time without a compromise. So:

     Option 1: Use a two-step selection:
          Step A: Select groups for the group traits (e.g., low feather pecking damage in the group).
          Step B: From the selected groups, select individuals for individual traits (e.g., egg size).

     However, this might not be optimal because we might be selecting individuals that are good at egg size but also aggressive (if aggression is not perfectly correlated with feather pecking). So we need to be cautious.

     Option 2: Use a selection index that combines both group-level and individual-level information. But this is complex and requires genetic parameters.

     Given the constraint of a spreadsheet and a technician, we might do:

          - For traits with known strong social interactions (like feather pecking, feed intake in a competitive environment), use group selection.
          - For other traits, use individual selection, but only on the birds from the groups that passed the group selection.

     Step 6: When to Use Group Selection? A Rule of Thumb

          We use group selection when:
            a. The trait is a group-level trait (like group productivity, group mortality) OR
            b. The trait is individual but the heritability estimated in group housing is low and we suspect that the social environment is masking the true genetic potential OR
            c. We have evidence that the individual with the best phenotype in the group is actually causing harm to the group (like the aggressive hen).

          We use individual selection when:
            a. The trait is individual and not affected by the group (e.g., egg size in a non-competitive environment) OR
            b. We can measure the trait in a way that isolates the individual from the group (e.g., in a test cage).

     Step 7: Handling Traits That Are Hard to Measure at Group Level

          Example: Feather pecking. We cannot easily tell who is the pecker. So we measure at the group level: average feather damage score of the group. Then we select groups with low damage.

          Example: Pecking order. We don't need to know the exact order. If we are concerned about the negative effects of a strict hierarchy (like stress and reduced egg production), we can measure group-level outcomes: group-level egg production, group-level mortality, group-level feather damage. Then select groups that perform well on these.

     Step 8: Judgment Calls (where the math stops)

          a. Deciding if a trait is affected by social interactions: This may require prior knowledge or a small test. If in doubt, run a pilot with a few groups and compare with individual housing.

          b. How to form groups for the next generation? We have two options:
              Option 1: Keep the selected groups intact and breed from all members. This preserves the group composition but reduces the selection intensity (because we take all individuals from the group, even the poor ones).
              Option 2: Break the groups and re-mix the selected individuals. But then we lose the specific group effect. This is a judgment call. If we believe the group effect is due to a specific combination (like a particular set of personalities), then we should keep groups intact. If we believe the group effect is due to each individual having a heritable trait that makes them good group members (like low aggression), then we can break the groups and re-mix.

          c. How many groups to select? This is a trade-off between selection intensity and maintaining genetic diversity. We might decide to select the top 50% of groups, for example.

          d. How to combine selection on multiple traits at different levels? We have to prioritize. If group-level traits are more important for profitability (e.g., because they affect mortality and feed efficiency), then we do group selection first and then individual. But we might lose some genetic gain on individual traits.

     Step 9: The Procedure (for one generation)

          Precondition: Hens are in groups (pens) of size n (say 20).

          Measurements:
            a. Group-level traits (for every pen):
                  - Total eggs per pen over a fixed period (e.g., 1 month).
                  - Total feed consumed by the pen over the same period.
                  - Mortality count in the pen.
                  - Feather cover score (average of all hens in the pen, scored on a scale of 1-5, with 5 being perfect).
            b. Individual traits (for every hen):
                  - Egg size (average of a sample of eggs from the hen).
                  - Other individual traits (if any) that are not influenced by the group.

          Steps:

          1. For each group-level trait of interest (e.g., total eggs per pen, feed efficiency per pen, average feather score, mortality rate), compute the value for each pen.

          2. Rank the pens for each group-level trait. Then, combine these ranks into an overall group score? Or decide on one primary trait? (Judgment call: what is most important? Maybe we care about total eggs and mortality the most.) We can create an index:

              Group_Index = w1 * (standardized total eggs) + w2 * (standardized feed efficiency) + w3 * (standardized feather score) - w4 * (standardized mortality)

              where weights (w1, w2, w3, w4) are based on economic importance. This is a judgment call.

          3. Select the top X% of pens based on the Group_Index (say top 30%).

          4. For the individual traits (like egg size), measure each hen in the selected pens. Then, rank the hens within the selected pens and take the top Y% (say top 50%). But note: if we break the groups and re-mix, we might lose the group effect. So we have two options:

              Option A (if we believe group composition is critical): Do not break groups. Use all hens from the selected groups as breeders. Then form the next generation by making new groups from the offspring of the same group (i.e., each group in the next generation is composed of offspring from one selected group). This is a form of "family selection" at the group level.

              Option B (if we believe the group effect is due to individual traits): Break the groups. Select the best individuals from all selected groups and then form new groups randomly from these selected individuals.

              How to decide? We can look at the correlation between group performance and the average of individual traits. If the group performance is well predicted by the average of individual traits (like average egg size, average feed efficiency) then Option B is okay. If not, then Option A.

          5. Breed the selected hens.

     Case Applications:

     Case 1: Feather Pecking
          - Trait: Feather cover. We score at the group level (average feather cover of the group). We also note mortality (which might be due to pecking).
          - Why group selection? Because we cannot identify the culprits. Also, feather pecking is a social behavior: one hen's pecking affects others.
          - Procedure: 
              - Measure group feather score and mortality for each pen.
              - Include these in the Group_Index.
              - Select top groups. Then, within top groups, we can select individuals for other traits (like egg size) if we wish, but note that we don't know which hens are the peckers. So we might prefer to take all hens from the top groups (if we are concerned that selecting within the group might leave out the non-peckers but also keep some peckers). However, if we believe that the tendency to feather peck is heritable and that by selecting groups with good feather cover we are indirectly selecting against the genetic tendency to peck, then we can break the groups and re-mix. But this is a judgment call.

          Recommendation: For feather pecking, use group selection and keep the groups intact (Option A) for breeding. This is because the group effect might be due to a particular mix (e.g., having no high-pecking individuals). By keeping the groups intact, we preserve that mix.

     Case 2: Feed Efficiency
          - Currently, we have per-bird heritability from cages. But in group pens, individual feed intake is hard to measure. The group feed intake is easy.
          - We want to improve feed efficiency at the group level (kg feed per dozen eggs for the whole pen).
          - However, note: feed efficiency at the group level is influenced by both individual efficiency and competition (aggression). We don't want to select for aggression.

          - Procedure:
              - Measure group feed efficiency (total eggs per total feed for the pen).
              - Include this in the Group_Index.
              - Then, we select groups. But note: we might also want to select for individual egg size? Then we do two-step: group selection first, then individual selection for egg size within the selected groups.

          However, there's a conflict: if we break the groups and re-mix, we might lose the group effect on feed efficiency. So if we believe the group feed efficiency is due to a non-competitive environment (which we want), then we might prefer to keep groups intact. But if we think it's due to each individual having good feed efficiency and low aggression, then we can break and re-mix.

          How to decide? We can look at the correlation between group feed efficiency and the average individual feed efficiency (if we had it). Since we don't, we have to make a call. Given that we suspect aggression is an issue, I recommend keeping groups intact (Option A) for at least a few generations until we see if group feed efficiency is improving without increasing aggression.

     Case 3: Egg Size (after 10 years of individual selection)
          - We have a line selected for egg size. We are moving to group pens and considering group selection.
          - The problem: group selection might slow down the progress on egg size because we are selecting groups based on group traits, and then within groups we are selecting for egg size. This reduces the selection intensity for egg size.

          - However, note: egg size is an individual trait with little social interaction? Then we can measure it individually and select on it individually even in group housing. So why change?

          But if we are now moving to group housing and we are concerned about other traits that are group-level (like feather pecking, mortality, group feed efficiency), then we have to consider group selection for those.

          - The procedure says: for egg size (if it is not affected by social interactions) we can still do individual selection. But we are now doing two-step: first group selection (for group traits) and then individual selection for egg size on the selected birds.

          The loss: we are only selecting from the top groups. If the groups selected for group traits have hens that are not the absolute best for egg size, then we lose some genetic gain on egg size.

          How much loss? It depends on the proportion of groups selected and the proportion of hens selected within groups. For example, if we select 30% of groups and then 50% of hens within those groups, the overall selection proportion is 15%, which is less intense than if we selected 15% of all hens individually. But if the group traits are important (like reducing mortality), then it might be worth it.

          The procedure: 
              - We include group traits (like mortality, feather cover) in the Group_Index and select top groups (say 30%).
              - Then, within the selected groups, we select the top 50% of hens for egg size.

          This might slow progress on egg size, but it will improve the group traits. We have to make a trade-off. The procedure does not avoid this trade-off.

          If we are not willing to slow egg size, then we might decide to ignore group traits? But that might lead to problems (like increased mortality due to aggression). Alternatively, we might try to select for egg size in a way that does not interfere: measure egg size individually and select on that without group pre-selection? But then we are not addressing the group traits.

          The procedure requires that we use group selection for group traits. So we must do group pre-selection. Therefore, we accept a slower gain in egg size for the sake of improving group traits.

     What the Procedure Can't Do:

          a. It cannot precisely partition the genetic variance into direct and social components without complex genetic experiments and statistical models (like animal models with social effects). That requires more data and software.

          b. It cannot tell us the optimal weights in the Group_Index. We have to set those based on economic values (judgment).

          c. It cannot predict the long-term consequences of breaking vs. not breaking groups. We have to monitor and adjust.

          d. It cannot handle traits that are both individual and group-influenced without making assumptions. For example, if we want to select for an individual hen's ability to resist feather pecking, we cannot measure that directly because it depends on the group. We have to rely on group-level selection to improve that indirectly.

          e. It does not account for genetic correlations between traits. For instance, if egg size is genetically correlated with aggression, then selecting for egg size might increase aggression. We would need genetic parameters to account for that.

     Final Decision Procedure (for the technician):

          Step 1: Measure the following for each pen (group):
              - Total number of eggs over the measurement period.
              - Total feed consumed (kg) over the same period.
              - Number of deaths (if any).
              - Average feather cover score (score each hen on 1-5, then average per pen).

          Step 2: Calculate for each pen:
              - Feed efficiency = total eggs / total feed   [dozen eggs per kg feed? adjust as per your units]
              - Mortality rate = (number of deaths) / (initial number of hens) * 100
              - Average feather score.

          Step 3: Standardize each group-level trait (subtract the mean and divide by the standard deviation) for the entire set of pens.

          Step 4: Compute an overall Group_Index for each pen:
              Group_Index = 
                  + (standardized total eggs) 
                  + (standardized feed efficiency)
                  + (standardized average feather score)
                  - (standardized mortality rate)

              (Note: we subtract mortality because lower mortality is better.)

          Step 5: Rank the pens by Group_Index from highest to lowest.

          Step 6: Select the top 30% of pens (or whatever cutoff you decide).

          Step 7: For the individual trait (egg size):
              - Measure the average egg size for each hen in the selected pens (over a fixed period).
              - Rank the hens in the selected pens by egg size.

          Step 8: Select the top 50% of hens from the selected pens based on egg size.

          Step 9: For breeding: 
              - We break the groups and mix the selected hens. Then form new groups randomly for the next generation? 
              OR
              - Do not break: keep the groups intact and use all hens from the selected groups? 

              This is a judgment call. Given the cases above, for feather pecking and feed efficiency we recommended keeping groups intact. But for egg size we are doing within-group selection. So we break the groups? 

              However, note: if we break the groups, we lose the group composition. We must decide based on whether we believe the group effect is due to the mix or due to individual traits. Without knowing, we might do:

                  - For the first few generations: keep groups intact (i.e., the selected hens from a pen are bred together, and their offspring form a new group). This is Option A.

              Why? Because we are concerned about social traits (feather pecking, aggression) and want to preserve the group harmony.

          Step 10: Breed the selected hens. For each selected pen, the selected hens are mated (with a rooster from the same group if you have them) to produce the next generation. The next generation groups are formed by the offspring of one selected group (so each next-generation group is composed of full siblings? or half-siblings? depending on mating). This is a form of family selection.

     Important: This procedure reduces the genetic diversity because we are selecting entire families. We must monitor inbreeding.

     Where Judgment is Needed:

          - The weights in the index (if you change the weights, the ranking changes). Start with equal weights? Or base on economic impact.
          - The cutoff percentages (30% for groups, 50% for hens) can be adjusted based on how many breeders you need.
          - The decision to break or not break groups. We choose not to break (Option A) for now.
          - The traits to include in the Group_Index. We included total eggs, feed efficiency, feather score, and mortality. You might add or remove.

     Note: This is a starting point. Monitor the results and adjust.

     Running the Cases with this Procedure:

          Case 1 (Feather Pecking): 
              - Group_Index includes feather score and mortality (which are affected by feather pecking). So groups with low feather pecking damage and low mortality will rank high. We select these groups. Then we select the top 50% of hens in these groups for egg size. But note: we are keeping the groups intact for breeding. So the next generation groups are from the same family. We hope that the non-pecking behavior is inherited.

          Case 2 (Feed Efficiency):
              - Group_Index includes feed efficiency (group level). So we select groups with good feed efficiency. Then select for egg size within. Again, groups are kept intact.

          Case 3 (Egg Size):
              - We are selecting groups first (top 30%) and then within those groups the top 50% for egg size. The overall proportion for egg size is 15%. Previously we might have selected 15% of all hens individually. The intensity might be similar? But note: the selected groups might not have the absolute top egg size hens. So we might lose some gain on egg size. However, we are also improving group traits.

     This procedure is runnable in a spreadsheet: 
          - Columns: Pen ID, Hen IDs, Total Eggs, Total Feed, Mortality Count, Feather Scores (for each hen), Egg Size (for each hen).
          - Then compute per-pen: 
               Average Feather Score = AVERAGE(Feather Scores for the pen)
               Feed Efficiency = Total Eggs / Total Feed
               Mortality Rate = (Mortality Count) / (Number of hens at start)
          - Then standardize the per-pen traits and compute the Group_Index.
          - Rank pens by Group_Index, select top 30%.
          - For the selected pens, rank the hens by egg size and select top 50%.

     Remember: We are forming the next generation by breeding the selected hens within their original groups (so each group is a family). The next generation groups will be composed of the offspring of one selected group.

     Finally, note that this is a simplified approach. The full quantitative genetics theory is more complex, but this should be a practical start.
answer: |-
  ### Decision Procedure for Selecting Breeders in Group Pens

  **Core Principle:** Selection should target the level (individual vs. group) where the *heritable variance* for your trait of interest resides. If a trait's expression is heavily influenced by social interactions (e.g., aggression affecting feed intake), individual selection can backfire. Group selection captures these interactions but has lower selection intensity (fewer groups than individuals). Use individual selection for traits unaffected by groups.

  ---

  ### **Step-by-Step Decision Procedure**
  *(Runnable in a spreadsheet; "Judgment Call" flags indicate subjective decisions)*

  #### **1. Measure Traits (Annually, at Peak Production)**
     - **Group-Level Measurements (Per Pen):**
       - Total eggs/pen
       - Total feed consumed/pen
       - Mortality count
       - Average feather cover score (1–5 scale; technicians visually score all hens)
       - *(Optional)* Behavioral stress indicators (e.g., vocalization frequency via audio sensor).
     - **Individual Measurements (Per Hen):**
       - Egg size (weigh 10 eggs/hen)
       - Body weight
       - *(If possible)* Feed intake (using RFID feeders; else skip).

  #### **2. Calculate Key Metrics**
     - **Feed Efficiency (Group):** `(Total eggs/pen) / (Total feed/pen)`
     - **Mortality Rate (Group):** `(Deaths/pen) / (Initial hen count)`
     - **Feather Score (Group):** Average of all individual scores in the pen.
     - **Egg Size (Individual):** Mean weight per hen.

  #### **3. Decide: Individual vs. Group Selection?**
     - **Rule:** Use **group selection** if:
       - The trait is inherently group-level (e.g., mortality, group feed efficiency), OR
       - Individual measurements are corrupted by social dynamics (e.g., feed intake skewed by bullying).
     - **Test for Social Interference (Judgment Call):**
       - If top individuals in group pens have high egg production **but** their pens show high mortality/poor feather cover → Use group selection.
       - If top individuals thrive without harming group metrics → Use individual selection.
     - **Default to Individual Selection** for traits like egg size, unless data show social interference.

  #### **4. Select Breeders**
     - **For Group-Level Traits (e.g., mortality, feather cover):**
       1. Rank all pens by the trait (e.g., lowest mortality, highest feather score).
       2. Select the **top 20–30% of pens** (adjust based on genetic diversity needs).
       3. **Breed all hens** from selected pens. *(Preserves group synergy; Judgment Call)*.
     - **For Individual Traits (e.g., egg size):**
       1. Rank all hens within the *selected pens* (from group selection).
       2. Select the **top 30–50% of individuals**.
     - **Combined Approach:**
       - Apply group selection first for group-affected traits.
       - Then select individuals within top pens for uncorrupted traits.

  #### **5. Handle Hard-to-Measure Traits**
     - **Feather Pecking:** Measure at group level (average feather score). Culprits are obscured, so group selection is mandatory.
     - **Pecking Order:** Ignore individual ranks. Use group outcomes (mortality, feather scores) as proxies.
     - **Traits Without Group Data (Judgment Call):** If you lack group metrics (e.g., no feather scores), skip selection for that trait that generation.

  #### **6. Where Judgment is Required (No Math!)**
     - **Forming Next-Generation Groups:** After selection, reshuffle hens randomly? Or keep descendants together? *Default: Rearrange randomly to avoid inbreeding.*
     - **Weighting Traits:** Prioritize traits by economic impact (e.g., mortality > egg size). *Example weights: 40% feed efficiency, 30% mortality, 30% feather score.*
     - **When Social Interference is Ambiguous:** If unsure, run a test: Compare individual rankings in cages vs. group pens. Divergence signals group selection needed.

  ---

  ### **Case Applications**

  #### **Case 1: Feather Pecking**
  - **Measure:** Group feather score (1–5) and mortality.
  - **Selection:** **Group-level.** Rank pens by feather score (high) and mortality (low). Select top 25% of pens → breed all hens.
  - **Why:** Individual culprits can’t be identified; damage is collective. Group selection targets heritable group harmony.

  #### **Case 2: Feed Efficiency**
  - **Measure:** Group-level efficiency (`total eggs/total feed`).
  - **Selection:** **Group-level.** Rank pens by efficiency. Select top 30% → breed all hens.
  - **Why:** Individual intake is corrupted by competition. Heritable variance resides at group level.

  #### **Case 3: Egg Size (After 10 Years of Individual Selection)**
  - **Measure:** Individual egg size.
  - **Selection:** **Individual-level** (within top groups from other traits).
  - **Why:** Egg size is likely uncorrupted by groups (minimal social interference). **But:** If moving to group pens *now* causes top individuals to underperform due to new social dynamics (e.g., bullying), use group selection for egg size too. This *will* slow progress short-term but prevents long-term collapse.
  - **Hard Truth:** If group housing reveals social interference, prioritize group selection. Sacrificing 1–2 years of egg size gain avoids breeding aggressive hens that destabilize future groups.

  ---

  ### **What the Procedure Can’t Do (Biology’s Limits)**
  1. **Quantify Indirect Genetic Effects (IGEs):** IGEs occur when a hen’s genes affect *others’* traits (e.g., aggressive genes reduce pen productivity). This requires complex models beyond spreadsheets.
  2. **Resolve Conflicting Traits:** E.g., if hens with high individual egg size also cause feather pecking. You must prioritize (e.g., accept smaller eggs for calmer hens).
  3. **Predict Long-Term Dynamics:** Group selection’s efficacy depends on trait heritability and migration between pens. Monitor and adjust.
  4. **Eliminate Judgment:** Techs must score feather cover subjectively and set trait weights.

  ---

  ### **Implementation Cheat Sheet**
  1. **Annually:** Collect group-level (pen) and individual (hen) data.
  2. **For each trait:**  
     - Social interference? → **Group selection.**  
     - No social interference? → **Individual selection.**
  3. **Rank:**  
     - Group traits: Rank pens → pick top 20–30%.  
     - Individual traits: Rank hens in top pens → pick top 30–50%.
  4. **Breed:** Rearrange selected hens randomly into new breeding groups.
  5. **Flag Uncertainty:** No data? Skip trait selection that year.

  This balances quantitative rigor with practicality. Start with a 100-hen pilot to refine before scaling.
