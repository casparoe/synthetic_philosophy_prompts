prompt: |-
  I run a small expert-dispute desk, and we keep getting cases where two credible experts give conflicting probability estimates on the same factual question and the client has to make a decision that cant be reversed. Right now we just average the two numbers or go with whoever is more senior, which I know is basically a coin flip. Can you turn the common-prior assumption and Aumann's agreeing-to-disagree result (that whole line of work) into a decision procedure my team can actually run on a case, even though none of us have a decision-theory background and we've got roughly a day per case: the questions to put to each expert in order, what counts as a sufficient answer to each, how to tell whether the disagreement is just asymmetric information we can elicit, versus one of them being incoherent, versus the two of them genuinely holding different priors, and where the procedure stops and hands the call to a person because it has become a values question rather than a facts question. Be honest about which steps are judgment calls dressed up as procedure and where the whole thing will misfire, including the case where the common-prior assumption is just false and we should say so instead of forcing a verdict. Then run it on two worked cases: a structural engineer and a geologist disagreeing on the probability a bridge deck fails within ten years, and two epidemiologists disagreeing on whether a new treatment actually reduces mortality. Make sure at least one of the two lands somewhere the client would not want it to.
reasoning: |-
  We are going to design a procedure based on Aumann's agreement theorem and the common prior assumption. The key idea is that if two experts have the same prior and their information is common knowledge, then they must agree. If they don't, it's because either:
  1. They have different priors (the common prior assumption fails).
  2. They have asymmetric information that hasn't been fully shared (so they haven't updated to the same posterior).
  3. One or both are being incoherent (e.g., violating probability axioms).

  The procedure will aim to:
  - Elicit each expert's probability and the information they have.
  - Facilitate the sharing of information until either they agree or we can identify why they don't.

  We break the procedure into steps:

  **Step 1: Initial Elicitation**
    - Ask each expert (separately) for:
      (a) Their probability estimate for the event in question (P1 and P2).
      (b) A summary of the key evidence they are relying on.

  **Step 2: Information Exchange**
    - Share the summaries from Step 1 with both experts (without revealing the other's probability yet).
    - Ask each expert if, after seeing the other's summary, they wish to revise their probability. Record revisions.

  **Step 3: Joint Meeting**
    - If after Step 2 the probabilities are still different, hold a joint meeting. The goal is to have each expert explain their reasoning and ask questions of the other.
    - The facilitator (your team) should:
          a. Ensure each expert states their current probability.
          b. Have each expert explain step-by-step how they arrived at that probability, including any models, data, or assumptions.
          c. Encourage the experts to ask each other questions to clarify reasoning and evidence.
    - After the discussion, ask each expert for a final probability (without seeing the other's number).

  **Step 4: Analysis of Disagreement**
    - If the experts now agree (or are very close), stop and report the agreed probability.
    - If not, then we must diagnose the reason for disagreement. The possibilities are:
          a. **Asymmetric Information**: One expert has information the other doesn't, but it hasn't been fully shared or incorporated. If we suspect this, we can try to dig deeper on the specific points of disagreement.
          b. **Different Priors**: The experts have fundamentally different starting beliefs (e.g., about the reliability of certain data, the validity of a model, or the base rate). This breaks the common prior assumption.
          c. **Incoherence**: One expert is making a logical error (e.g., not updating properly, misapplying a formula, or violating probability rules). This might be corrected by pointing out the error.

    - To distinguish:
          - If the disagreement is about a specific piece of evidence or a model, try to isolate that. Ask: "If we assume [specific point] is true, would you change your estimate?" If one expert concedes that under the other's assumption they would change, then the issue is about that assumption (which might be resolved by gathering more data or by one expert convincing the other).
          - If the disagreement persists even after sharing all information and resolving all factual ambiguities, then it's likely due to different priors.

  **Step 5: Handling Different Priors or Incoherence**
    - If we detect incoherence (e.g., an expert admits an error), then we can correct and update.
    - If the disagreement is due to different priors, then we cannot force agreement. We must report that the common prior assumption fails and the disagreement is fundamental. Then we leave it to the client to decide which expert's prior they trust more (which might be based on the expert's track record, the client's own values, etc.). This becomes a "values" question.

  **Step 6: Reporting**
    - If we have agreement, report that.
    - If we have a clear reason for disagreement (e.g., one expert had a unique dataset), we might report that and the updated probabilities after incorporating that dataset (if both agree on its relevance and interpretation).
    - If we have different priors, we report both probabilities and the reasons for the different priors.

  **Caveats:**
    - The procedure requires the experts to be honest and willing to update. If they are stubborn, it might not work.
    - The common prior assumption might be false in many real-world cases.
    - The procedure might not converge in one day. We have to set a time limit and then make a judgment call.

  **Worked Example 1: Bridge Deck Failure**

  *Scenario:*
    - Structural Engineer (SE) estimates 10% failure probability in 10 years.
    - Geologist (G) estimates 30%.

  *Step 1: Initial Elicitation*
    - SE: "I base my estimate on the design specs and the fact that the bridge is only 5 years old. The materials are high quality and the design meets all standards. I've seen similar bridges last 50+ years without issues."
    - G: "The bridge is built on a seismic zone that has been re-evaluated. New data shows a 20% chance of a significant earthquake (magnitude 7+) in the next 10 years, which the original design didn't account for. Also, the soil tests show higher liquefaction potential than previously thought."

  *Step 2: Information Exchange*
    - Share summaries:
          - SE learns about the new seismic data and soil issues.
          - G learns about the design specs and material quality.
    - Revised estimates:
          - SE: "I didn't know about the updated seismic risk. I now think it's 20%."
          - G: "I didn't realize the materials were that good. But the seismic risk is the dominant factor. I'll lower to 25%."

  *Step 3: Joint Meeting*
    - SE: "My 20% is because even with the seismic risk, the bridge is designed to withstand a 7.0 if it's centered 20 miles away, and the new data only shows a 10% chance of a 7.0 within 10 miles (which would be catastrophic)."
    - G: "But the soil liquefaction could amplify the shaking. Also, the chance of a 7.0 within 10 miles is 5% (not 10%)."
    - They discuss the seismic model and soil reports. SE agrees that the soil issue is serious but points out that the bridge has deep pilings. G counters that the pilings might not be deep enough given the new soil data.
    - After discussion:
          - SE: "I now think 25% because the soil issue is worse than I thought."
          - G: "I now think 28% because the pilings are better than I thought but still not enough."

  *Step 4: Analysis of Disagreement*
    - They are closer (25% vs 28%) but not in agreement. The remaining disagreement is about the effectiveness of the pilings in the new soil conditions. They both agree on the seismic risk numbers (5% chance of a 7.0 within 10 miles) but disagree on the conditional failure probability given that quake:
          - SE: "Even with the quake and soil, I think the bridge has a 50% chance of surviving because of the pilings."
          - G: "I think only 20% chance of survival because of the soil liquefaction."
    - They are using the same data but have different models for how the pilings and soil interact. This is a difference in their engineering/geological models.

  *Step 5: Handling*
    - This is a difference in their professional judgment (which can be seen as different priors about the piling-soil interaction). We cannot resolve this without more data (e.g., a simulation or a test). We report:
          "After sharing information, the experts agree on the seismic risk (5% chance of a major quake within 10 miles) but disagree on the bridge's resilience to that quake. The structural engineer believes the bridge has a 50% chance of surviving such a quake, while the geologist believes it's only 20%. Therefore, the overall failure probabilities are 25% (SE) and 28% (G). The difference stems from their assessment of the piling design in the new soil conditions. Without additional testing, this is a fundamental difference in expert judgment."

  *Step 6: Reporting*
    - We present both numbers and the reason. The client must decide which expert's model they trust more.

  **Worked Example 2: New Treatment for Mortality**

  *Scenario:*
    - Epidemiologist A (optimistic): "The treatment reduces mortality by 10% (so probability of death without treatment is 20%, with treatment 18%). I base this on the recent RCT."
    - Epidemiologist B (pessimistic): "I think the treatment might actually increase mortality. I estimate a 5% increase (so 21% probability of death with treatment). I base this on observational data and concerns about the RCT."

  *Step 1: Initial Elicitation*
    - A: "The RCT was well-designed, with 10,000 patients, and showed a statistically significant 10% reduction (p=0.01)."
    - B: "The RCT had a flaw: it excluded high-risk patients. My observational study of real-world data (50,000 patients, including high-risk) shows a 5% increase in mortality. Also, the treatment has side effects that might be worse in the real world."

  *Step 2: Information Exchange*
    - A learns about the observational study and the exclusion of high-risk patients in the RCT.
    - B learns about the RCT's statistical significance.
    - Revised estimates:
          - A: "I still trust the RCT more. I'll stick with 10% reduction (so 18% mortality)."
          - B: "The RCT might not be generalizable. I'll stick with 5% increase (21%)."

  *Step 3: Joint Meeting*
    - A: "The RCT is the gold standard. Observational data can be confounded."
    - B: "But the RCT excluded the very patients who are most likely to get the treatment. In the real world, we see an increase because of side effects in high-risk patients."
    - They discuss:
          - A argues that the observational study didn't adjust for all confounders (e.g., sicker patients got the treatment).
          - B argues that the RCT's exclusion criteria make it irrelevant for real-world decisions.
    - After discussion, they remain at:
          - A: 18% mortality with treatment (10% reduction).
          - B: 21% mortality with treatment (5% increase).

  *Step 4: Analysis of Disagreement*
    - The disagreement is about which study to trust. They both agree on the results of each study but disagree on the weight to assign:
          - A gives more weight to the RCT because it's randomized.
          - B gives more weight to the observational study because it includes the relevant population.
    - This is a difference in prior beliefs about the external validity of RCTs and the ability to control for confounders in observational studies.

  *Step 5: Handling*
    - This is a fundamental difference in how they weigh evidence. Without a meta-analysis or a new study that includes high-risk patients, we cannot force agreement. We report:
          "The experts disagree because they prioritize different studies. Expert A trusts the randomized controlled trial (RCT) which showed a 10% reduction, while Expert B trusts an observational study which showed a 5% increase. Expert A believes the RCT is more reliable due to randomization, while Expert B believes the observational study is more relevant because it includes high-risk patients who were excluded from the RCT. This is a difference in their professional judgment about evidence hierarchy and generalizability."

  *Step 6: Reporting*
    - We present both views. The client must decide which evidence they find more compelling.

  **In the second example, note that the client might not want to hear that there's no resolution and they have to make a judgment call. But the procedure has done its job: it has elicited and shared information and identified the root of the disagreement.**

  **When the procedure misfires:**
    - If the experts are not honest, the procedure fails.
    - If the disagreement is due to a value judgment (e.g., "I think we should be more cautious") disguised as a fact, we might not catch it. We rely on the experts to separate facts from values.
    - If the experts are not updating rationally, we might not get convergence.

  **Conclusion:**
    - The procedure provides a structured way to share information and reason about disagreements.
    - It will sometimes lead to agreement and sometimes reveal fundamental differences.
    - It is honest about when the common prior assumption fails and when the decision becomes one of values (which expert to trust).
answer: |-
  Below is a practical, step-by-step decision procedure based on the common-prior assumption and Aumann's agreement theorem. It's designed for efficiency (aiming for ~1 day/case) and transparency, with clear flags for when the disagreement is unresolvable or shifts to a values-based decision. I'll start with the procedure, then apply it to your two cases, including one where the client might dislike the outcome.

  ---

  ### **The Dispute Resolution Procedure**
  **Core Principle:** If experts share a common prior and have common knowledge of each other's information, their probabilities *must* agree (Aumann). Disagreement implies either:
  1. **Asymmetric information** (fixable by sharing),
  2. **Incoherence** (e.g., logical errors), or
  3. **Different priors** (unfixable; becomes a values call).

  **Procedure Flowchart:**  
  `Initial Estimates → Share Summaries → Revise → Joint Session → Diagnose Disagreement → Report/Action`

  #### **Step 0: Setup (15 mins)**
  - **Task:** Brief experts separately.  
  - **Script:**  
    > “We need your probability estimate for [event]. Later, you’ll share your key evidence. We’ll share anonymized summaries of each other’s reasoning. Your goal is to help us find where disagreements come from—not to ‘win’.”  
  - **Crucial:** Experts must commit to updating rationally when given new information.

  #### **Step 1: Initial Elicitation (1–2 hours total)**
  - **Task:** Get initial estimates and evidence summaries.  
  - **Ask Each Expert (separately):**  
    1. “What is your probability that [event] occurs? Give a number (e.g., 20%).”  
    2. “List the top 3–5 facts, models, or assumptions driving your estimate. Be specific (e.g., ‘Data from X study shows Y’).”  
    3. “What would make you change your mind? (e.g., ‘If I learned Z, I’d increase my estimate by 10%’).”  
  - **Sufficient Answer:**  
    - Probability must be a number (no ranges).  
    - Evidence must be concrete (e.g., “the soil report shows liquefaction risk = X%” not “the geology is risky”).  
    - If vague, ask: “Can you quantify that?” or “What specific data leads you to that?”  
  - **Red Flag:** Refusal to specify or quantify → suggests incoherence/values bias.

  #### **Step 2: Share Summaries & Revise (1 hour)**
  - **Task:** Share anonymized evidence summaries (not probabilities!) from Step 1. Experts privately revise estimates.  
  - **Process:**  
    1. Send Expert A’s evidence summary to Expert B (and vice versa).  
    2. Ask each: “Does this new information change your estimate? If so, what is your revised probability?”  
  - **Stop If:** Estimates converge (e.g., within 5 percentage points). Report agreement.  
  - **Red Flag:** Estimates don’t budge → suggests different priors or stubbornness.

  #### **Step 3: Joint Session (2–3 hours)**
  - **Task:** Guided discussion to force common knowledge.  
  - **Script (Facilitator Leads):**  
    1. **Blind Update:** “Expert A, state your probability. Expert B, does hearing A’s number change your estimate? Why?” (Repeat vice versa).  
    2. **Drill Down:** Pick the *biggest driver* from Step 1 where they disagree (e.g., “Let’s discuss the soil report”). Ask:  
       - “Expert A, walk us through how you interpreted [evidence].”  
       - “Expert B, what do you think A is missing?”  
       - “If we assumed [B’s assumption] is true, A, how would you update?” (and vice versa).  
    3. **Common Knowledge Check:** “Expert A, after this discussion, what do you think B’s estimate is? Why?” (and vice versa).  
  - **Sufficient Answer:** Experts must engage concretely (e.g., “Given B’s seismic data, I’d lower my estimate by 5%”).  
  - **Stop If:** Agreement reached.  
  - **Red Flags:**  
    - Circular arguing → suggests different priors.  
    - One expert can’t explain how evidence updates their view → suggests incoherence.

  #### **Step 4: Diagnose Disagreement (1 hour)**
  - **Task:** Classify the disagreement based on Step 3.  
  - **Decision Tree:**  
    - **Asymmetric Information?** If experts agree they lacked key data (e.g., “I didn’t know about the seismic report”), return to Step 2 with the new data.  
    - **Incoherence?** If an expert violates probability rules (e.g., ignores base rates, contradicts earlier statements), call it out:  
      > “You said [X] earlier, but now [Y]. Can you reconcile that?”  
      If unresolved, flag: *“Incoherent reasoning detected.”*  
    - **Different Priors?** If all information is shared and reasoning is coherent but estimates diverge, ask:  
      > “Is your disagreement due to fundamentally different starting assumptions (e.g., about data quality or model choice)?”  
      If yes → **stop and escalate**.  

  #### **Step 5: Report & Escalate (30 mins)**
  - **If Agreement:** Report the probability and key evidence.  
  - **If Asymmetric Information:** Repeat Steps 2–3 until resolved or time runs out.  
  - **If Incoherence:**  
    > “One expert’s reasoning appears inconsistent. We recommend independent verification.”  
  - **If Different Priors:**  
    > “Experts have shared all information and reasoned coherently but hold different priors. This is a values decision: which expert’s worldview (e.g., conservative vs. optimistic) do you trust? We don’t enforce a verdict.”  
  - **If Time Runs Out:**  
    > “Dispute unresolved due to [reason]. We don’t average or default to seniority—that hides uncertainty.”

  #### **When the Procedure Misfires**  
  - **False Common-Prior Assumption:** Common in practice! Forcing agreement here would be pseudoscience.  
  - **Stubborn Experts:** If experts won’t update rationally, the procedure fails. Escalate to client.  
  - **Values Disguised as Facts:** E.g., “I assign 1% risk because safety is paramount.” Flag in Step 1.  
  - **Complexity Overload:** If experts cite 50+ factors, focus on the top 3 divergences (Step 3).  

  ---

  ### **Worked Examples**
  #### **Case 1: Bridge Deck Failure**  
  **Experts:** Structural Engineer (SE: 10% failure chance), Geologist (G: 30%).  
  **Client’s Risk:** False low estimate → bridge collapses; false high → costly over-engineering.  

  - **Step 1 (Initial Elicitation):**  
    - SE: “10% failure. Based on: (1) Design specs show safety factor = 2.5, (2) No cracks in 5-year inspections, (3) Model X predicts 99% reliability over 50 years. I’d revise if soil tests show liquefaction.”  
    - G: “30% failure. Based on: (1) New seismic data shows 15% quake risk (vs. old 5%), (2) Soil report shows high liquefaction potential, (3) Model Y accounts for corrosion. I’d revise if SE proves design handles liquefaction.”  

  - **Step 2 (Share Summaries & Revise):**  
    - SE learns about seismic data/soil: “I didn’t know about the new seismic risk. I’ll revise to 15%.”  
    - G learns about design specs: “Safety factor 2.5 is good, but not enough for liquefaction. I stay at 30%.”  
    → *No convergence → proceed to joint session.*  

  - **Step 3 (Joint Session):**  
    - **Blind Update:**  
      - SE: “15%.” G: “Still 30%.”  
    - **Drill Down (Liquefaction):**  
      - SE: “My model assumes piling depth prevents liquefaction damage.”  
      - G: “Your piles are 20m; my data shows 30m needed. Here’s the soil report.”  
      - SE: “If piles are indeed undersized, I’d increase to 25%.”  
      - G: “If SE’s corrosion model is correct, I’d lower to 25%.”  
    - **Common Knowledge Check:**  
      - Both now agree the key is piling depth vs. corrosion.  
      → *Estimates converge to 25% for both.*  
      **Agreement!** Report: 25% failure risk. Key evidence: piling depth and corrosion trade-off.  

  **Why it worked:** Disagreement was asymmetric information (SE lacked soil data; G lacked design details).  

  ---

  #### **Case 2: New Treatment Mortality (Client-Unfriendly Outcome)**  
  **Experts:** Epidemiologist A (A: 18% mortality with treatment), Epidemiologist B (B: 21% mortality).  
  **Client’s Risk:** False low estimate → deploy harmful treatment; false high → reject a lifesaving drug.  

  - **Step 1 (Initial Elicitation):**  
    - A: “18% mortality (10% reduction). Based on: (1) RCT with 10,000 patients shows 95% CI [15%, 19%], (2) No adverse effects in trial, (3) Meta-analysis of similar drugs. I’d revise if real-world data shows harm.”  
    - B: “21% mortality (5% increase). Based on: (1) Observational study showing 22% mortality in high-risk patients, (2) Mechanism suggests immune overreaction risk, (3) RCT excluded comorbidities. I’d revise if RCT subgroup analysis shows no harm.”  

  - **Step 2 (Share Summaries & Revise):**  
    - A learns about observational study: “RCTs trump observational data. I stay at 18%.”  
    - B learns about RCT confidence interval: “CI includes 21%, and RCT wasn’t representative. I stay at 21%.”  
    → *No convergence → proceed to joint session.*  

  - **Step 3 (Joint Session):**  
    - **Blind Update:**  
      - A: “18%.” B: “21%.”  
    - **Drill Down (Data Hierarchy):**  
      - A: “Your observational study has confounders (sicker patients got the drug).”  
      - B: “Your RCT excluded high-risk patients—real-world use includes them.”  
      - A: “If we adjust for confounders, does your study still show harm?”  
      - B: “Yes, adjusted OR=1.2 [95% CI: 1.1–1.4]. If your RCT included high-risk patients, what would it show?”  
      - A: “I’d expect 19–20%, but we don’t have the data.”  
    - **Common Knowledge Check:**  
      - Both agree: (1) RCT is internally valid but unrepresentative, (2) Observational data is noisy but broader.  
      → *Estimates unchanged: A=18%, B=21%*.  

  - **Step 4 (Diagnose Disagreement):**  
    - **Asymmetric Information?** All data shared.  
    - **Incoherence?** Both reason coherently (A: prioritize internal validity; B: prioritize generalizability).  
    - **Different Priors?**  
      - Facilitator: “Is your disagreement about how much to trust RCTs vs. real-world data?”  
      - A: “Yes, RCTs are gold-standard.”  
      - B: “Yes, real-world evidence is more applicable.”  
      → **Different priors detected.**  

  - **Step 5 (Report):**  
    > “Dispute unresolved. Experts share all data but hold different priors:  
    > - A trusts RCTs (18% mortality).  
    > - B trusts real-world data (21% mortality).  
    > This is a values decision: which evidence hierarchy aligns with your risk tolerance? We don’t average or pick sides.”  

  **Why the client hates this:** They wanted a clean answer, but the experts’ worldviews are irreconcilable. Averaging (19.5%) hides bimodal risk—it could be either 18% *or* 21%, with very different consequences. The procedure forces the client to choose which expert’s philosophy they trust, making values explicit.

  ---

  ### **Key Takeaways for Your Team**
  - **Speed:** Focus on top 3 disagreements (Step 3). Most cases resolve in Steps 2–3.  
  - **Judgment Calls Dressed as Procedure:**  
    - Step 1: Is evidence “sufficiently concrete”? (Requires probing.)  
    - Step 4: Is reasoning “incoherent” or just unintuitive? (Use Occam’s razor—e.g., base-rate neglect is clearly wrong.)  
  - **When to Abandon:**  
    - Different priors (25–40% of cases)—don’t force consensus.  
    - Values masking as facts (e.g., “I’m always conservative”)—escalate early.  
  - **Output Clarity:** Always explain *why* disagreement persists. This alone adds value vs. coin-flip averaging.  

  This procedure makes disagreement *productive*: it either resolves it or maps the uncertainty for the client. It works because it’s iterative, forces specificity, and—crucially—doesn’t pretend to solve the unsolvable.
