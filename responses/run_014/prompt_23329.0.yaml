prompt: |-
  I'm on the board of our local weekly and I've been reading a lot about information cascades lately — the idea that a herd can form even when everyone is being rational, because each person treats what earlier people did as evidence. We're about to face a decision and I'd like a short memo you'd circulate to the board before Thursday's meeting. The situation: two bigger outlets in the state both ran a story yesterday that a county commisioner took kickbacks, and both say they reviewed bank records — apparently the same ones. We haven't seen the records ourselves, and the commissioner's lawyer is already calling the story fake. If we run it and it's wrong, we're done for; if we hold it and it's true, we just look timid. I keep flip-flopping on whether two outlets running it is real evidence or basically one data point with two stamps on it. The memo should recommend a concrete course of action — run it, hold it, or verify first — with a time frame, and it should take the "just follow the outlets, their reporting is real evidence" side seriously instead of waving it away as herd behavior.
reasoning: |-
  Okay, let me break this down. The user is on the board of a local weekly facing a high-stakes decision about whether to run a story on a county commissioner accused of taking kickbacks. Two larger outlets have already run the story based on bank records they claim to have reviewed, but the commissioner's lawyer is calling it fake. The user is specifically concerned about information cascades – the rational tendency for people to follow earlier decisions as evidence – and wants a memo that takes this seriously rather than dismissing it as herd behavior.

  Hmm, this is a classic journalistic integrity dilemma with real consequences. The user's core tension seems to be balancing the credibility of established outlets against the need for independent verification. They're rightly worried about two extremes: running a false story (which could destroy their small paper) or holding back on a true story (making them look cowardly). 

  The information cascade angle is particularly interesting. The user isn't just asking "what should we do?" but "how do we avoid blindly following the herd while still respecting legitimate evidence?" That's sophisticated. They want their board to consciously evaluate whether the two outlets' reports constitute one evidence point or two independent ones. 

  I notice they mentioned flip-flopping – that suggests genuine intellectual honesty. The memo needs to validate that uncertainty while providing decisive leadership. The concrete action plan is crucial given Thursday's deadline. 

  For the recommendation: Verification-first makes the most sense ethically and practically. It acknowledges the outlets' credibility as evidence (per the cascade theory) without treating it as sufficient. The key will be framing the verification process as rigorous but achievable within 48 hours – sourcing alternatives since they can't access the original bank records. 

  The tone should be collegial but urgent, speaking to fellow board members as responsible journalists. We'll emphasize that respecting others' reporting doesn't mean outsourcing our judgment. The "two stamps on one data point" metaphor might help crystallize their concern about false independence. 

  Structurally, we'll: 
  - Open with the dilemma to show we grasp the stakes 
  - Break down why the cascade argument has merit but isn't enough 
  - Provide a clear verification roadmap with fallback positions 
  - End with conviction to prevent paralysis
answer: |-
  **MEMORANDUM**  
  **TO:** Board Members, Local Weekly  
  **FROM:** [Your Name], Board Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommended Course of Action: Commissioner Kickback Story  
  **DEADLINE:** Thursday Meeting Decision  

  ### **The Core Dilemma**  
  Two major state outlets have run a story alleging kickbacks by County Commissioner X, citing bank records. We face three options:  
  1. **Run the story** (high risk if false; catastrophic for our credibility).  
  2. **Hold the story** (high risk if true; erodes trust in our relevance).  
  3. **Verify independently** (resource-intensive but mitigates both risks).  

  ### **Why Following Major Outlets Isn’t Enough (Even If Rational)**  
  *Information cascade theory suggests that two outlets running the story could be seen as strong evidence—each rationally relying on the other’s credibility. However, this is not definitive:*  
  - **One Source, Two Outlets?** Both outlets likely reviewed the *same* bank records (per their language: "apparently the same ones"). Their reports are **one data point with two stamps**, not independent verification.  
  - **The Lawyer’s Threat:** The commissioner’s aggressive pushback ("fake news") signals legal risk. Major outlets have deeper pockets to weather lawsuits; we do not.  
  - **Cascade Vulnerabilities:** If the original source (e.g., leaker) was compromised, both outlets—and any followers—could propagate an error. Rationality ≠ infallibility.  

  ### **Recommended Action: Verify First (48-Hour Deadline)**  
  **Do not run the story today. Launch an urgent 48-hour verification process.**  

  #### **Concrete Steps & Timeline:**  
  1. **Today/Tonight:**  
     - Contact both outlets’ reporters. Ask: *"Can you share redacted bank records or connect us with your source? We intend to corroborate independently."*  
     - If denied, demand on-record confirmation of their verification process.  
     - Simultaneously, task our reporter with:  
       - Securing the records via *our own* sources (e.g., county auditors, banking contacts, whistleblowers).  
       - Interviewing the commissioner’s staff, contractors, or political opponents (with full transparency about our intent).  

  2. **Within 48 Hours (By Wednesday EOD):**  
     - If we obtain the records or secure two independent, on-record confirmations *beyond the two outlets*, **run the story Thursday** with attribution to our verification.  
     - If verification fails (e.g., records withheld, sources silent), **hold the story**. Issue a brief statement: *"We take allegations seriously but require direct evidence. We continue investigating."*  

  ### **Why This Approach?**  
  - **Respects the Cascade, But Demands More:** The two outlets’ reports *are* evidence—enough to justify urgent verification, but not enough to stake our reputation on.  
  - **Balances Speed & Integrity:** 48 hours is aggressive but feasible for a local paper leveraging community connections.  
  - **Mitigates Existential Risk:** If the story is false, we avoid ruin. If true, our eventual reporting (even if delayed) can still hold power accountable while showcasing rigor.  
  - **Upholds Our Mission:** We are a *local* paper. Our value is in original reporting—not amplifying others without scrutiny.  

  ### **Final Note: No Half-Measures**  
  Do not "run it with heavy attribution" to the other outlets. Their credibility doesn’t shield us from legal liability or reputational damage if the story collapses. Verification is our only path to a defensible decision.  

  **Recommendation Summary:**  
  **VERIFY FIRST (48-hour window). Run only if independently corroborated. Hold if not.**  

  I move that we vote on this plan at Thursday’s meeting. Let’s be the paper that *informs* the cascade—not one swept away by it.  

  // Signed //  
  [Your Name]
