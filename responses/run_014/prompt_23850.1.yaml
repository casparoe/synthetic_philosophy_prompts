  The late autumn air bit sharp as Einstein and Gödel walked down Mercer Street, fallen leaves crackling underfoot. Einstein puffed his pipe, the sweet smoke curling into the crisp Princeton dusk. Gödel, bundled tightly in a worn overcoat, walked with his precise, almost mechanical steps, hands deep in pockets.

  “A birthday present, Albert,” Gödel began, his voice soft but carrying an unusual intensity. “For your seventieth. I believe I have found something… interesting. In your equations.”

  Einstein chuckled, smoke escaping in a grey plume. “More interesting than my wrinkles, Kurt? Show me this gift.”

  “It is a solution. A rotating universe.” Gödel paused, his gaze fixed on the damp pavement ahead. “Stable. Consistent. Permitted by general relativity.”

  “Rotating? Like a top? Interesting indeed. Gravity and inertia dancing together.” Einstein’s eyes twinkled. “Does it sing?”

  “It whispers,” Gödel said. “It whispers of paths. Paths that curve back… upon themselves.”

  Einstein slowed, his pipe hovering near his lips. “Closed timelike curves?”

  “*Ja*,” Gödel confirmed, the syllable precise and heavy. “It is possible. In such a universe, one could, theoretically, travel along a worldline… and return to one’s own past. To meet oneself departing.”

  Einstein absorbed this, his playful mood shifting to profound contemplation. They walked in silence for half a block, the rhythmic *tap-tap* of Gödel’s shoes the only counterpoint to the rustling leaves. “A curious consequence,” Einstein finally murmured. “Philosophically troublesome, perhaps, for causality. But a mathematical oddity?”

  “It is more,” Gödel insisted, stopping abruptly beneath a skeletal elm. He turned to face Einstein, his pale eyes wide, almost feverish in the fading light. “Consider what it means for time itself, Albert. In such a universe… where could one place the ‘now’?”

  Einstein frowned slightly. “The ‘now’ is relative. Always. As we know.”

  “But in *this* universe?” Gödel pressed, his voice tightening. “In a rotating cosmos, with these curves woven into its fabric… there *is* no objective present. No single moment slicing cleanly through all existence, separating past and future for every observer. How can there be? If an event on my worldline is both my future and my past, depending on the path taken… what universal ‘now’ could possibly encompass that? The very concept dissolves.”

  A chill wind rattled the bare branches above them. Einstein’s pipe had gone out, forgotten in his hand. He stared at Gödel, not with dismissal, but with a dawning, unsettling recognition.

  “The flow,” Gödel continued, his words dropping like stones into the quiet street. “The sense that time *passes*, that the future becomes the present and slides into the past… it becomes an illusion. A trick of perspective, confined only to certain frames of reference in universes where matter happens *not* to rotate in just this way. But if time’s passage were real, Albert, a fundamental feature of reality itself… how could its *existence* depend on something so arbitrary as the distribution and motion of matter? How could it be absent in *one* valid solution of your equations, yet present in another?”

  Einstein didn’t move. The implications unfolded within him, vast and cold. Gödel’s solution wasn’t just about time travel; it was a scalpel dissecting the very sensation of time’s flow. If the universe’s rotation could switch off objective becoming, then perhaps becoming wasn't objective at all. Not there. Not anywhere.

  “It is contingent,” Gödel whispered, the fervor replaced by a terrible calm. “The feeling of time flowing… it depends on cosmic accident. It is not woven into the absolute structure of the world. Therefore… it cannot be real. Not objectively. Not even here. Not even now.”

  The word "now" hung in the air, suddenly fragile, meaningless. The streetlights flickered on, casting long, distorted shadows. Einstein looked down at his pipe, cold and dead in his grasp. He saw the familiar grooves of the briar, the dottle of ash. He felt the November air on his face. He heard a distant car horn. All sensations firmly lodged in his immediate perception. Yet Gödel’s relentless logic, born from the very equations Einstein had forged, wrapped around those sensations like ice, leaching warmth and immediacy from them.

  *No objective becoming. Not even here.*

  Einstein slowly raised his eyes from the pipe. He met Gödel’s gaze, searching the deep-set eyes for a flaw, a crack in the reasoning. He found only the chilling certainty of pure deduction.

  He opened his mouth, perhaps to argue, to find solace in quantum uncertainty or the stubbornness of conscious experience. But no words came. The equations were there, stark and undeniable. Gödel had given him the universe as a birthday present, and it contained no gift of flowing time.

  Einstein turned away, looking down the long, darkening street towards his home on Mercer. Gödel watched him, a silent, spectral figure in the gathering gloom. Einstein took a step. Then another. He didn’t look back. The familiar rhythm of his walk was subtly altered, burdened by the weight of a world where the relentless forward march he felt in his bones might be nothing more than a profound, universal trick of the light. The smoke from his dead pipe had long since vanished into the cold, indifferent air.
