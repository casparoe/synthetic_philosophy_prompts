prompt: |-
  I teach a graduate seminar on the Essays and I'm in the middle of a running argument with two of my TAs, who are convinced Montaigne is just a cultural relativist ahead of his time — they read the cannibals essay, hear him say that every one of us calls barbarous whatever isn't his own custom, and stop right there. I don't think that's the right label, and I don't think it's even the interesting question. So for next week I want to treat him as a judge with a track record instead of as a slogan, and spring on the seminar a case he never had to rule on, and see which account of his method actually predicts his verdict. I've written the rulings out as carefully as I can below — everything you need is in here, so you don't have to go hunting, and I'm not after quotations or chapter references, just the reasoning.

  Here's the record. On the peoples of the Brazilian coast: he reports that they take prisoners in war, keep them well for months, then kill, roast and eat them, and that they think it far worse to lacerate and torture a body that still feels than to eat one that is dead — and his verdict is that by the standard of reason we may call them barbarous, but that we outdo them in every kind of barbarity, and he lists the rack, the burnings, and the religious wars to prove it. On evidence: he says he would rather trust one plain honest man who reports only what he saw with his own eyes than the cosmographers who fill the gaps with invention, and his whole account leans on a servant of his who lived ten or twelve years in those parts. On their poetry: he turns a war song and a love song into French and rates them against the Greek lyric poets with no discount for who sang them. On their marriages, their long communal houses, their lack of trade, metal, agriculture and magistrates: he describes all of it without scandal and not without some envy. On the three visitors he met at Rouen as boys, through an interpreter: he records their two pieces of bewilderment — that grown armed men would take orders from a beardless child king, and that there were men starving at the gates while others went armed and well fed — and he's cross with himself for never having had the rest of their comments written down. On the conquest: his verdict is that what undid those peoples was not superior courage but bad faith, that they were bought and undone by men who came under the flag of trade and then betrayed the hospitality they'd been given, and that our vices and our diseases finished the job. Then two things elsewhere in the book that pull the other way. In the essay on custom he insists custom gets its grip on us by degrees — the woman in his story who carried a calf every day until she could carry the full-grown bull — and he counsels against lightly overturning a law once it is established, whatever its defects. And in the essay on cruelty he says his horror of bloodshed is not a reasoned virtue at all but a matter of temperament, that he cannot watch a chicken killed or hear a hare crying in the teeth of the hounds, and he openly doubts whether a man is any the better for a distaste he never chose.

  The new case is this. A design student — it's modelled on a real bioart piece I saw a few years ago — has grown a steak in a lab from cells donated by a living volunteer, who is healthy, who consents, and who intends to eat it herself at a ticketed gallery dinner with the whole process documented and disclosed. Nothing is killed, nobody is hurt, nobody is deceived, and biologically the meat is her own. Half my seminar already insists this is the one form of cannibalism that can't be objected to, since every objection has to bottom out either in a victim or in a lie. So: predict Montaigne's verdict, and lay out the candidate rules his record above is jointly consistent with — I can see three or four and I suspect you'll turn up ones I've missed. For each rule, say what it delivers on this case and how confident you'd be in that delivery. Then commit to a single best guess and defend it, which means dealing with the fact that the cruelty-first rule and the custom rule point in opposite directions here while the appeal-to-nature strand seems to cut both ways depending on whether you take his temperament remarks as evidence or as confession. Finally, name the follow-up case I should bring in the week after: a second, minimally different case that would seperate the top two rules, so that whichever way he goes on it one of them is refuted. And be honest with me at the end — if he does condemn the steak, is that a genuine problem for the TAs' relativist reading, or just proof that they grabbed the wrong name for something he's actually doing?
reasoning: |-
  Hmm, the user is a professor teaching a graduate seminar on Montaigne's Essays. They're having a debate with their TAs about whether Montaigne is a cultural relativist. The TAs point to the cannibals essay as evidence, but the professor thinks this is reductive and wants to test Montaigne's method with a new case study - lab-grown human steak consumed by the donor herself.

  The professor has provided a detailed record of Montaigne's positions on various matters: his views on Brazilian cannibals, evidence gathering, indigenous poetry, social structures, and specific judgments about conquest. They've also noted two countervailing essays - one on custom's gradual influence, and one where Montaigne attributes his aversion to cruelty to temperament rather than reason.

  The hypothetical case involves a bioart project where a consenting donor grows and eats her own lab-cultured meat. Half the seminar thinks this is ethically unobjectionable since there's no victim or deception. The professor wants me to:
  1) Predict Montaigne's verdict
  2) Extract consistent rules from his record
  3) Apply each rule to the case with confidence levels
  4) Commit to one prediction and defend it
  5) Propose a follow-up case to distinguish between top rules
  6) Assess impact on the relativism debate

  I need to identify consistent principles from Montaigne's judgments. There's the cruelty-aversion principle seen in his reaction to Brazilian cannibals vs European torture. The evidentiary principle favoring firsthand accounts. The aesthetic/naturalness principle in how he evaluates indigenous poetry. The custom principle about not lightly overturning established laws. And the temperament principle regarding his personal aversion to suffering.

  For the lab-grown steak case, the key tension is between the cruelty principle (no suffering here) and the custom principle (this violates deep taboos). The temperament principle might cut both ways - is disgust at cannibalism "natural" or culturally conditioned?

  The strongest rules I see are:
  1) Suffering-minimization principle (high confidence)
  2) Custom-respect principle (medium confidence)
  3) Naturalness principle (low confidence)
  4) Evidentiary principle (not directly applicable)

  My best prediction is that Montaigne would condemn the steak due to the custom principle, despite the lack of suffering. The custom essay shows he values social stability over abstract reason in such matters. The Brazilian cannibals judgment was about comparative cruelty, not endorsement.

  For a follow-up case, I should propose something that separates custom from naturalness - perhaps lab-grown steak from a consenting donor but consumed by strangers (violates custom but same biological facts). If Montaigne objects more strongly here, it supports custom-primacy; if equally, it supports naturalness-primacy.

  Regarding relativism: A condemnation wouldn't refute relativism per se, but show his relativism is comparative ("we're worse") not absolute. It reveals him as a critical traditionalist who uses cross-cultural comparison to question European norms without abandoning all judgment.
answer: |-
  Based on Montaigne's established record, here's a reasoned prediction for the lab-grown steak case, the principles at work, and the implications for your debate with the TAs:

  **Candidate Rules Consistent with Montaigne's Record:**
  1.  **The Suffering/Harm Minimization Principle:** Actions causing unnecessary suffering, cruelty, or physical harm (especially to the sentient and vulnerable) are barbarous. This is his *strongest* and most consistent moral yardstick. (Evidence: Cannibal verdict prioritizing *feeling* torture over consuming the dead; horror of cruelty essay; condemnation of European torture/wars; critique of indigenous conquest via "vices and diseases").
      *   **On the Steak:** *Approves.* No suffering, harm, killing, or deception occurs. The donor is healthy, consenting, and unharmed. Confidence: **High.** This directly aligns with his core aversion to inflicted pain and his willingness to judge European practices *more* barbarous based on this standard.
  2.  **The Custom/Established Practice Principle:** Long-standing customs and laws, even if imperfect or seemingly irrational, possess inherent weight and stability. Overturning them lightly is dangerous and destabilizing. (Evidence: The "calf/bull" metaphor; counsel against lightly overturning established laws; descriptive neutrality towards indigenous practices *as their custom*).
      *   **On the Steak:** *Condemns.* Cannibalism, even in this novel form, violently overturns one of humanity's most deep-seated and nearly universal taboos – a custom ingrained over millennia. It "lightly overturns" a fundamental law of human social order. Confidence: **Medium-High.** While the *harm* is absent, the violation of a profound, ancient custom would likely trigger his caution against radical novelty disrupting social fabric.
  3.  **The Naturalness/Uncontrivedness Principle:** Actions and judgments feel more legitimate when they align with unforced human temperament or appear "natural" within their context, rather than being hyper-rationalized contrivances. (Evidence: Valuing the servant's plain eyewitness account over "invention"; appreciation for indigenous poetry's inherent worth ("no discount"); suspicion of his *own* reasoned virtue vs. temperamental horror of cruelty; perhaps even the envy of indigenous simplicity).
      *   **On the Steak:** *Leans towards Condemnation.* The process is hyper-technological, rationally engineered to bypass natural prohibitions and biological realities (death, killing, separation of self/other). It feels deeply *un*natural and contrived, lacking the context that might make cannibalism "natural" (e.g., survival, specific ritual meaning like the Tupinambá's revenge). Confidence: **Medium.** His temperament remarks suggest a deep-seated, possibly innate, revulsion towards certain acts (killing, bloodshed) that this act symbolically flirts with, even if literally avoiding them. The artifice clashes with his appreciation for the uncontrived.
  4.  **The Betrayal/Bad Faith Principle:** Actions involving deception, broken trust, exploitation of hospitality, or betrayal are particularly condemnable. (Evidence: Condemnation of the conquest achieved through trade-betrayal and bad faith).
      *   **On the Steak:** *Neutral/Approves.* The case explicitly states "nobody is deceived," consent is central, and there's no betrayal of trust or hospitality. Confidence: **Low.** While the absence of bad faith removes a negative mark, this principle doesn't strongly *support* the act either. It's more relevant to contexts of interaction and broken promises.

  **Predicted Verdict & Defense:**
  **Montaigne would condemn the lab-grown steak.**

  *   **Why?** While the **Suffering Principle** strongly argues for approval, the **Custom Principle** and the **Naturalness Principle** pull powerfully towards condemnation.
  *   **Resolving the Tension:** His record shows he *uses* the Suffering Principle primarily as a devastating *comparative* tool against European hypocrisy and cruelty ("we outdo them in every kind of barbarity"). It's his sharpest critical scalpel. However, when establishing a *positive* standard for what constitutes acceptable human behavior *within* a society, especially one involving fundamental taboos, the **Custom Principle** carries significant weight. He cautions against overturning established laws *because of* their stabilizing function, not necessarily because they are perfectly rational. Cannibalism, even in this novel form, attacks a foundational taboo.
  *   **The Naturalness/Contrivance Factor:** The extreme artificiality of the act – growing one's own meat in a lab purely as an intellectual/artistic exercise – would likely strike him as profoundly unnatural and hubristic. It bypasses the natural processes of life, death, and consumption in a way that feels like a rationalistic evasion of a deep-seated human boundary. His temperamental remarks suggest an instinctive recoil from acts symbolically associated with violence and violation, which this act embodies despite its literal harmlessness.
  *   **Precedent:** His relative tolerance for Tupinambá cannibalism existed within *their* established custom and ritual context, serving a specific social function (revenge). He judged it *less barbarous* than European torture *based on suffering*, not morally neutral or admirable *in the abstract*. Applying it voluntarily *outside* any such deep-rooted cultural context, as a deliberate, novel transgression, is categorically different. The **Custom Principle** gains force here precisely because the act *lacks* the anchoring context he observed in Brazil.

  **The Follow-Up Case (Separating Custom vs. Naturalness):**
  **The Donor Dinner Party:** The same artist creates a steak from their *own* cells. Instead of eating it alone, they host a small, private dinner for 4-5 close friends who *knowingly and willingly consent* to eat portions of the donor's lab-grown meat. All are fully informed, there is no deception, no suffering, no harm. The friends participate out of intellectual curiosity, artistic appreciation, or solidarity.

  *   **How it Separates the Rules:**
      *   **Custom Principle:** Condemns *even more strongly*. This now involves *others* violating the taboo, potentially normalizing it and accelerating the overturning of a fundamental custom within the *host* society. It moves from a private act to a social one.
      *   **Naturalness Principle:** Likely still condemns, but the condemnation *might* be slightly less intense than the solo case? (Arguable). The core unnaturalness/contrivance remains identical. The social sharing might feel *slightly* less alien than solitary self-consumption, or perhaps *more* ritualistic (though artificial). This principle is less sensitive to the social scale.
      *   **Suffering Principle:** Still approves (No harm).
  *   **The Test:** If Montaigne condemns the **Dinner Party** *significantly more harshly* than the solo act, it strongly supports the **Custom Principle** as the dominant factor (fear of social contagion and destabilization). If his condemnation is roughly *equal* in intensity to the solo act, it strengthens the **Naturalness Principle** as the core driver (the fundamental unnaturalness/contrivance of the act itself is the primary offense, regardless of participants). The Suffering Principle remains constant and satisfied in both cases.

  **Addressing the TAs' Relativism & Your Question:**
  If Montaigne condemns the steak (as predicted), it **is a genuine problem for a simplistic "cultural relativist" reading, but it doesn't entirely refute their core observation; it just shows they grabbed the wrong label for a more complex stance.**

  *   **Why it's a Problem:** A strict cultural relativist suspends judgment, saying "their custom, their truth." Montaigne *does* judge. He judges the Tupinambá practices *less barbarous* than European ones based on a trans-cultural standard (minimizing suffering). He judges European conquest as unequivocally wicked based on betrayal and bad faith. He judges the value of indigenous poetry against a trans-cultural (Greek) standard. Here, judging the *novel* steak implies a standard *beyond* just "it's their custom."
  *   **What He's Actually Doing:** Montaigne is a **radical comparative critic** and a **critical traditionalist**.
      *   **Radical Comparative Critic:** He relentlessly uses other cultures as a mirror to expose the hypocrisy, irrationality, and cruelty embedded in *European* customs and beliefs ("Of Cannibals" is primarily a critique of *Europe*). He identifies trans-cultural evils like cruelty and betrayal.
      *   **Critical Traditionalist:** He acknowledges the powerful, often irrational, grip of custom ("calf/bull") and the potential chaos of uprooting it without overwhelming justification. He values the stability of established practices *even while recognizing their defects*. His tolerance for Tupinambá cannibalism stems partly from recognizing it *as their established custom*, not from moral indifference. Conversely, the lab steak isn't anyone's custom; it's a deliberate assault on a near-universal one.
  *   **The Label:** Calling him *just* a "cultural relativist" misses his willingness to make cross-cultural comparative judgments (using reason and observation) and his deep respect for the functional necessity of custom *within* a society, even while using comparison to critique his own. **"Relativist" captures his descriptive tolerance for diverse customs; it fails utterly to capture his critical, comparative, judgmental, and traditionalist strands.** Your TAs are mistaking his *descriptive anthropology* (reporting customs neutrally) and his *comparative critique* (using other cultures to judge Europe) for a full-blown ethical relativism, which his record consistently undermines.

  **In short:** He'd likely condemn the steak based on violating deep custom and seeming profoundly unnatural/contrived, despite the lack of harm. This verdict exposes the inadequacy of the "relativist" label by demonstrating his willingness to judge novel acts against principles of custom, naturalness, and (comparative) harm, not just suspend judgment based on cultural context. The follow-up dinner party case will help pinpoint whether custom or unnaturalness is the stronger driver.
