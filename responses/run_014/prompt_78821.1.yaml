prompt: |-
  I teach a seminar on experimental philosophy, and this year I also got drafted onto our college's academic-integrity board, and the two things have started bleeding into each other in a way that is honestly making me a little unhinged. The relevant background, briefly: I've been rereading the work on the Knobe effect and everything it spawned — the chairman case, where a guy who announces he doesn't care about the environment gets asked whether he brought about an environmental side effect on purpose, and people say yes when the side effect is bad and no when the identical side effect is good — plus all the follow-ups showing the same moral-valence flip turning up in causal judgments, knowledge ascriptions, and a pile of other places, and the long-running fight over whether this is a performance error or a sign that the folk concept of intentional action is itself moralized. What I want from you is not a lit review. I want the most important implications of that whole research program for how we actually run these hearings.

  Concretely, here's our procedure, which I've come to suspect is a Knobe experiment we run on ourselves every month. A student uses a chatbot to produce an essay; we see the essay and the grade first, then the student's file, then finally we get to the question our rulebook actually turns on, which is whether the misuse was intentional — that finding is what unlocks the harshest sanction, while a finding of neglegence caps it. My hypothesis, offered as a hypothesis: we read intent backwards off how bad the case looked, and the moral-valence literature predicts exactly this. My grad student wants to test it by running a variant where the AI-assisted paper is actually better than what the student would have written alone and the student disclosed it herself — same act, good or at least neutral upshot — and before she burns a semester on it I'd like help seeing what hangs on the answer.

  So: what are the most important implications? I care about things like whether the order in which we see evidence should be fixed by rule, whether a hearing can be debiased at all or whether the fix has to be structural (seperate the intent finding from the sanctioning decision, blind reading, rewrite the rulebook to drop intentional in favor of something closer to knowledge or recklessness), whether the effect is the same size in expert fact-finders or mostly a folk phenomenon, and whether the same mechanism predicts that our outcomes will track how sympathetic the student looks. Please be explicit about the fork: if the effect is a bias, the implications go one way; if it reflects something real about how intentional action is ordinarily understood, then maybe the rulebook is the artifact and the folk are fine. Tell me which implications are robust either way, which are hostage to how the vignettes get built, and where the literature is genuinely divided rather than settled. And rank them — if I can only push one change through the board this year, I want to know which.
reasoning: |-
  Okay, this is a fascinating and urgent query from someone deeply immersed in both experimental philosophy and academic integrity practice. The professor's experience of seeing Knobe Effect dynamics play out in real disciplinary hearings is a perfect example of how theoretical research can collide with institutional practice. 

  First, I need to unpack the core tension: they suspect their board's "intentionality" determinations are being backwardly inferred from outcome severity, mirroring the Knobe Effect where moral valence shapes intentionality judgments. The grad student's proposed experiment (flipping the valence by making AI-use beneficial) is clever but risky. 

  The professor wants actionable implications, not theory. So I should prioritize: 
  - Structural fixes over cognitive training (since debiasing is hard) 
  - Rulebook revisions that bypass intentionality altogether 
  - Evidence sequencing protocols 
  - How expert vs. folk judgments might differ 

  Key considerations: 
  The literature suggests valence effects are robust across expertise levels, so changing the process is wiser than training panelists. The chairman vignette's core finding replicates endlessly, but real hearings add messy variables like sympathy biases. 

  Most urgent fix: decouple intent determination from sanctioning phase entirely. If that's impossible, blind reading of evidence might help. But rewriting the rulebook to adopt legal standards like "knowledge" or "recklessness" would be more transformative. 

  The valence effect's persistence even in experts means the grad student's experiment might confirm the bias but won't eliminate it. Still, running it could provide ammunition for procedural reform. 

  Biggest philosophical fork: if this "bias" actually reflects folk concept of intentionality, the rulebook's requirement might be fundamentally flawed rather than just poorly implemented. That would necessitate deeper conceptual surgery. 

  I'll emphasize concrete steps while flagging where the literature is uncertain (e.g., whether sympathy effects operate identically to moral valence). The professor clearly needs ammunition for bureaucratic change, so I'll rank interventions by feasibility and impact.
answer: |-
  Your situation is a perfect storm of philosophical theory colliding with institutional practice. Here’s a distilled analysis of implications, ranked by urgency and robustness, with forks for the bias-vs-folk-concept debate:

  ### **1. Evidence Order Must Be Fixed (Highest Priority)**
     - **Problem:** Seeing the *outcome* (e.g., plagiarized essay + F grade) before assessing intent primes moral valence to distort intent judgments.
     - **Solution:** Rule-mandated evidence sequence: student’s file (intent clues first) → essay → outcome/grade.
     - **Robustness:** Works regardless of fork. Even if folk concepts *are* moralized, institutions should prioritize procedural fairness over folk intuitions. The effect size is large in vignette studies (Knobe, 2003; Uttich & Lombrozo, 2010), and order effects are well-established in cognitive psychology.
     - **Urgency:** Easy to implement. No structural overhaul needed.

  ### **2. Decouple Intent Finding from Sanctioning (Structural Fix)**
     - **Problem:** The rulebook ties severe sanctions to "intentional," creating high stakes that amplify outcome-driven bias (Alicke, 2000).
     - **Solution:** Split the hearing: Phase 1 determines *facts* (what the student did). Phase 2 determines *culpability* (recklessness? knowledge?) and sanctions, using neutral legal standards (e.g., Model Penal Code’s "knowledge" or "recklessness").
     - **Fork Implications:**
       - *If bias:* Decoupling reduces motivated reasoning to justify harsh sanctions.
       - *If folk concept:* Institutions shouldn’t codify morally loaded folk terms. Legal standards are more precise.
     - **Robustness:** Highly robust. Studies show outcome severity inflates intent ascriptions even in experts (Nadelhoffer, 2006). Fixes both bias and conceptual messiness.

  ### **3. Drop "Intentional" from Rulebook (Rewrite Standards)**
     - **Problem:** "Intentional" is a magnet for moral valence. Your rulebook is asking the wrong question.
     - **Solution:** Replace with:
       - **"Knowledge":** Did the student know their act violated policy?  
       - **"Recklessness":** Did they consciously disregard a substantial risk?  
       *(Aligns with legal frameworks like MPC §2.02)*.
     - **Why Better:** "Knowledge" is less valence-sensitive (Beebe & Buckwalter, 2010). Recklessness focuses on awareness of risk, not outcome.
     - **Fork Implications:** 
       - *If bias:* Evades the Knobe trap.
       - *If folk concept:* Acknowledges that "intentional" is morally encumbered—institutions should use cleaner terms.
     - **Urgency:** High-impact but requires board/college buy-in.

  ### **4. Sympathy Effects are Knobe-Adjacent (Predictable Bias)**
     - **Mechanism:** Just as bad outcomes inflate intent judgments, sympathetic defendants (e.g., struggling student) may reduce them—*even for identical acts* (Alicke’s culpable control model). This is valence in another form.
     - **Implication:** Blind reading of case files (redact demographics, grades, "sob stories") during fact-finding phase. Save context for sanctioning phase.
     - **Robustness:** Well-supported (e.g., Nadler & McDonnell, 2012). Robust across expertise.

  ### **5. Can Hearings Be Debiased? Mostly No—Go Structural**
     - **Training/Warnings:** Largely ineffective. The effect persists in experts (judges, philosophers; Cushman & Mele, 2008) and resists debiasing (Schwitzgebel & Cushman, 2015).
     - **Structural Wins:** Order control, decoupling, and rule changes are more reliable than asking panelists to "think harder."

  ### **6. Your Grad Student’s Experiment: Worth Running?**
     - **Prediction:** In the "good AI-use" case (student discloses, essay improves), intent findings drop sharply—demonstrating valence-dependence.
     - **Value:** Would empirically validate your hypothesis *in your institution’s context*, strengthening the case for reform. But don’t wait for results to push fixes—the basic effect is replicable to saturation.
     - **Caveat:** Real hearings add noise (e.g., sympathy). Control vignettes tightly.

  ### **Ranked Changes for Your Board This Year**
  1. **Fix Evidence Order** (Immediate, low-cost, high impact).  
  2. **Advocate for Rulebook Rewrite** (Replace "intentional" with "knowledge"/"recklessness").  
  3. **Push for Decoupled Hearings** (Phase 1: fact-finding; Phase 2: sanctioning).  

  ### **Where Literature is Divided**
  - **Is it Bias or Folk Concept?** Still contested (Adams & Steadman, 2004 vs. Knobe, 2010). *But*: For institutional design, it doesn’t matter. Courts don’t use "intentional" in isolation for good reason.  
  - **Expertise Effects:** Mixed. Some studies find experts *less* biased (e.g., lawyers; Robinson et al., 2017), others find no difference. Assume worst-case persistence.  

  ### **Bottom Line**
  Your board’s procedure is indeed a Knobe experiment. The fix isn’t tweaking intuitions—it’s redesigning the process to avoid the question altogether. Prioritize **evidence sequence** now and lobby hard for **rulebook reform**. If structural changes fail, blind reading is a partial shield. The literature’s lesson: Don’t fight human cognition—build smarter institutions.

  > *"The law aims to correct the distortions of moral luck, not codify them."*  
  > — Adapting Bernard Williams for the integrity board.
