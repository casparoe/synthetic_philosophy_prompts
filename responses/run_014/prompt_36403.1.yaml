prompt: |-
  I'm a software engineer with no philosophy background (my last formal contact with any of this was a statistics course years ago), and I own the estimation process for my team of eight. Every two weeks we commit to sprint-sized work, and twice a year leadership asks us for multi-quarter numbers that end up in customer-facing commitments. Our track record is bad in a consistent direction: we hit the two-to-three-sprint items roughly on time but blow well past the multi-quarter ones, and I've been asked to fix this. A friend pointed me at the planning fallacy and at "reference class forecasting" as the standard remedy: stop reasoning from the inside of this particular project ("the schema is 80% mapped, the only tricky part is the cutover") and instead ask how long projects *like this one* have actually taken, then adjust from there.

  I like the idea, but when I tried to run it I hit what I assume is a well-known wall: the forecast depends entirely on which "projects like this one" you average over. Our upcoming ingestion rewrite belongs to the class of all rewrites we've done (n=4, overran badly), the class of projects touching the payments vendor (n=9, mixed), the class of projects led by this particular tech lead (n=11, mostly on time), and the class of projects started during quarters when we were also on-call-heavy (n=7, catastrophic). Nothing in the method tells me which average to trust, and narrower classes seem more relevant but have fewer members and noisier averages. My teammate says this makes the whole thing circular: the mechanical procedure that was supposed to remove judgment just relocates it, because I pick the class with the same gut that produced the bad estimates in the first place. He adds a second objection — our data is survivorship-biased, since the only past projects we have completion times for are ones that shipped, and the two we know of that got cancelled mid-flight never generated a number at all, so even the averages we can compute are drawn from a filtered class.

  Please turn what philosophy and statistics actually know about this — the reference class problem proper, not just "use the outside view" — into a procedure my team can run in about twenty minutes per estimate at planning, with no statistician and nothing fancier than a spreadsheet over our Jira export. I need the questions to ask in order, what counts as a sufficient answer at each step, where the procedure outputs a number, and where it should stop and explicitly hand the decision to a person because the remaining question is one of judgment or values rather than facts. It has to handle at least these cases: a class with only three or four members; a genuinely first-of-a-kind project where no class has any obvious claim; and a project that differs from its natural class in one known, directional way (we've used this exact vendor before, but never with this much existing load on the system). Then run the procedure on three estimates we actually face: the ingestion rewrite described above; a two-sprint refactor of our notification service, where the class data says these run about 60% over but the assigned engineer has produced a detailed task-level breakdown showing it fits comfortably; and a greenfield internal tool the sponsoring VP wants scoped by Friday. I expect the procedure to give at least one answer I won't like — please don't sand it down to keep me comfortable — and please be explicit about what the procedure fundamentally cannot do, including whether my teammate's circularity charge is ultimately right or whether there's a principled (if imperfect) response to it.
reasoning: |-
  We are designing a procedure for reference class forecasting that is practical for a software team to run in about 20 minutes per estimate, using only a spreadsheet. The procedure must address:
  1. The reference class problem: which class of past projects to use?
  2. Handling small sample sizes (n=3 or 4)
  3. First-of-a-kind projects
  4. Adjusting for known directional differences
  5. Survivorship bias (only completed projects are in the data)

  The procedure will output either a point estimate (with a note about uncertainty) or a decision that human judgment is required.

  We break the procedure into steps:

  ### Step 1: Identify Candidate Reference Classes
  - **Question to ask**: What are the natural classes this project might belong to? (e.g., by project type, technology, team composition, business area, etc.)
  - **Sufficient answer**: List 3-5 candidate classes. Aim for classes that have at least 3 projects (if possible) and are relevant. If a class has less than 3, note it but don't discard yet.
  - **Output**: A list of candidate classes with the number of projects in each and their average duration overrun (or other metric of interest, e.g., actual/estimated ratio).

  ### Step 2: Assess Class Relevance
  - **Question to ask**: For each candidate class, how relevant is it to the current project? Consider:
    - Similarity in scope, complexity, and context.
    - Whether the class includes projects that share key risk factors (e.g., vendor integration, rewrite, etc.).
  - **Sufficient answer**: Assign a relevance score (e.g., 1 to 5, where 5 is most relevant) to each class. Relevance should be based on objective factors (if possible) such as:
    - Same technology? Same team? Same business domain? Same type (rewrite, new feature, etc.)?
  - **Output**: The list of candidate classes with relevance scores.

  ### Step 3: Adjust for Known Differences (Directional Adjustment)
  - **Question to ask**: For the top 1-3 classes (by relevance and sample size), are there known differences between the current project and the class average that would directionally affect the estimate? (e.g., we've used this vendor before but with less load -> expect worse performance)
  - **Sufficient answer**: For each difference, note:
    - The factor (e.g., system load)
    - The direction (e.g., likely to increase duration)
    - The magnitude (if known, e.g., past projects with high load took 20% longer, otherwise use a qualitative adjustment: small, medium, large). If no data for magnitude, use a default small=10%, medium=20%, large=30% adjustment (these are arbitrary but practical; note that this is a judgment).
  - **Output**: An adjusted estimate for each candidate class: 
     `adjusted_estimate = class_average * (1 + adjustment_factor)`

  ### Step 4: Combine Estimates and Handle Uncertainty
  - **Question to ask**: How do we combine the estimates from multiple classes? And how do we account for sample size and uncertainty?
  - **Procedure**:
    - If there is a class that is clearly the most relevant and has a reasonable sample size (say n>=5), use its adjusted estimate.
    - Otherwise, take a weighted average of the adjusted estimates from the top classes (by relevance and sample size). Weights can be:
        weight = (relevance_score) * sqrt(n)   [to balance relevance and sample size]
    - Normalize the weights so they sum to 1.
    - Compute the weighted average.
    - For classes with very small n (n<3), consider not including them unless they are the only ones. If included, note the high uncertainty.
  - **Output**: A point estimate (the weighted average) and a note about the uncertainty (e.g., "based on a small sample" or "based on multiple classes").

  ### Step 5: Special Cases
  - **First-of-a-kind project**: If no candidate class has any project (or all classes have n=0), then the procedure cannot output a reference class estimate. Hand off to human judgment with the instruction: "Use task breakdown and expert opinion, and then multiply by a conservative factor (e.g., 1.5 to 2) to account for the unknown unknowns."
  - **Very small sample (n=3 or 4)**: Include but note the high uncertainty. Consider widening the class slightly to get more data? (But that might reduce relevance.) Alternatively, use the estimate but flag it as high risk.

  ### Step 6: Account for Survivorship Bias
  - **Question to ask**: Are there any projects in the candidate class(es) that were cancelled or abandoned? If so, we don't have their actual duration. How might that bias the average?
  - **Procedure**: 
    - If the team has knowledge of cancelled projects in a class, note that the class average might be overly optimistic (because cancelled projects are often the ones that were going to overrun).
    - Adjust the estimate upward by a factor (e.g., 10-20% if there are known cancellations in that class) or at least note the risk.
    - If there are no known cancellations, then no adjustment (but note that there might be unknown ones).
  - **Output**: Adjust the estimate (if known cancellations) or note the potential bias.

  ### Step 7: Final Output
  - The procedure outputs:
     - A point estimate (in the unit of interest, e.g., ratio of actual/estimate or absolute time).
     - A note about the primary reference class(es) used.
     - A note about any adjustments made (for differences and survivorship bias).
     - A note about the uncertainty (due to small samples or first-of-a-kind).

  ### Addressing the Circularity Charge
  - The teammate is right that choosing the reference class involves judgment. The procedure does not remove judgment but structures it and makes it explicit. By requiring multiple candidate classes and scoring them, we reduce the arbitrariness. The key is to base the relevance on objective factors (like project attributes) rather than gut feeling about the estimate. The procedure also incorporates multiple classes (if available) to avoid over-reliance on one.

