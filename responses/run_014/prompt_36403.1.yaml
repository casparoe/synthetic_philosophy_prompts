answer: |-
  ### Practical Reference Class Forecasting Procedure for Your Team  
  **Goal:** Produce reliable multi-quarter estimates in ~20 minutes per project using a spreadsheet. The procedure structures judgment but doesn't eliminate it—explicit handoffs to human judgment occur where data is insufficient or ambiguous.  

  ---

  #### **Step 0: Prework (Do Once Per Quarter)**  
  1. **Export Jira Data**: Pull historical projects (minimum: project type, lead, duration, estimated vs. actual, key attributes like "vendor," "rewrite," "on-call load").  
  2. **Add Survivorship Tag**: Flag cancelled projects (even without durations) and note which classes they belong to.  
  3. **Pre-Calculate Averages**: For common classes (e.g., "rewrites," "vendor integrations"), compute:  
     - Mean overrun (actual/estimated).  
     - Sample size (`n`).  
     - *Optional*: Standard deviation (if comfortable with spreadsheets).  

  ---

  #### **Estimation Procedure (20 Minutes/Project)**  
  **Inputs**: Project description, initial gut estimate.  
  **Outputs**: Adjusted estimate, uncertainty flags, or explicit handoff to judgment.  

  **Step 1: Identify Candidate Reference Classes (3 min)**  
  - **Question**: *"Which 2–4 classes best match this project? Prioritize relevance over sample size."*  
  - **Criteria**:  
    - **Mandatory**: Must share ≥1 core attribute (e.g., "all rewrites," "projects using Vendor X").  
    - **Avoid**: Overly broad (e.g., "all projects") or ultra-specific (e.g., "projects for VP Y").  
    - **Sufficient Answer**: 2–4 classes with `n ≥ 3` (if possible). If `n < 3` for all, proceed to Step 4.  
  - **Output**: Table of classes, their `n`, and mean overrun (e.g., 1.5 = 50% overrun).  

  **Step 2: Adjust for Directional Differences (5 min)**  
  - **Question**: *"Does this project differ from its class in a known, quantifiable way?"*  
  - **Procedure**:  
    1. For each class, note differences (e.g., "higher system load," "more experienced team").  
    2. Apply directional adjustment:  
       - If historical data on difference exists (e.g., "high-load projects took 20% longer"), use it.  
       - Else, use rules of thumb:  
         - Minor difference: ±10%  
         - Major difference: ±25%  
         - *Conservative bias*: Default toward pessimism (e.g., "new risk = +25%").  
    3. **Formula**:  
       `Adjusted Overrun = Class Mean × (1 + Adjustment)`  
  - **Sufficient Answer**: Adjusted overrun for each class. If no differences, use raw mean.  
  - **Output**: Adjusted overrun per class.  

  **Step 3: Combine Estimates (5 min)**  
  - **Question**: *"Which classes are most credible, and how should we weight them?"*  
  - **Procedure**:  
    1. **Weight = Relevance × √n** (√n reduces noise from small samples).  
       - Relevance: Subjectively rate 1–5 (1 = weak, 5 = strong).  
    2. **Calculate weighted average**:  
       ```  
       Combined Overrun = Σ (Adjusted Overrunₖ × Weightₖ) / Σ Weights  
       ```  
    3. **Edge Cases**:  
       - **Small samples (`n = 3–4`)**: Use but flag as "high uncertainty."  
       - **Contradictory classes (e.g., 1.8 vs. 1.1)**: Default to higher overrun (empirically safer).  
  - **Output**: Single overrun factor (e.g., 1.7 = 70% overrun). Apply to initial gut estimate.  

  **Step 4: Handle Ambiguity & Handoffs (5 min)**  
  - **First-of-a-Kind Project**:  
    - If no class has `n ≥ 3`, **handoff to judgment**.  
    - **Prescription**: Multiply gut estimate by 2.0 (adjust for unknown unknowns).  
  - **Survivorship Bias Check**:  
    - **Question**: *"Do cancelled projects exist in these classes?"*  
    - **Adjustment**: If cancellations exist, multiply final estimate by 1.2 (arbitrary but conservative).  
  - **Final Output**:  
    - Point estimate = Gut Estimate × Combined Overrun.  
    - Flags: "High uncertainty" (if `n < 5`), "Adjusted for cancellations," or "Judgment required."  

  **Step 5: Document Rationale (2 min)**  
  - Record: Chosen classes, adjustments, weights, and flags. Enables retrospectives.  

  ---

  ### **Applying the Procedure to Your Cases**  
  **Key**: Overrun = Actual/Estimated ratio (e.g., 1.6 = 60% overrun).  

  #### **Case 1: Ingestion Rewrite**  
  - **Step 1 (Classes)**:  
    - Rewrites (`n=4`, mean overrun=2.0 → 100% overrun).  
    - Payments vendor (`n=9`, mean=1.3).  
    - Tech lead (`n=11`, mean=1.1).  
    - On-call-heavy quarters (`n=7`, mean=2.5).  
  - **Step 2 (Adjustments)**:  
    - Rewrites: Higher load → +25% → `2.0 × 1.25 = 2.5`.  
    - On-call-heavy: Current quarter matches → no adjustment.  
  - **Step 3 (Combine)**:  
    | **Class**       | Adj. Overrun | Relevance | √n   | **Weight** (Rel. × √n) |  
    |-----------------|--------------|-----------|------|-----------------------|  
    | Rewrites        | 2.5          | 5         | 2    | 10                    |  
    | On-call-heavy   | 2.5          | 5         | ≈2.6 | 13                    |  
    | Payments vendor | 1.3          | 3         | 3    | 9                     |  
    | Tech lead       | 1.1          | 4         | ≈3.3 | 13.2                  |  
    **Weighted Average** = `(2.5×10 + 2.5×13 + 1.3×9 + 1.1×13.2) / (10+13+9+13.2) ≈ 1.85`.  
  - **Step 4 (Ambiguity)**:  
    - Cancellations: Assume 2 in "rewrites" → multiply by 1.2 → `1.85 × 1.2 = 2.22`.  
    - **Final**: Gut estimate × 2.22.  
  - **Uncomfortable Truth**: Despite the tech lead’s strong track record, high-risk classes dominate.  

  #### **Case 2: Notification Service Refactor (2 Sprints)**  
  - **Step 1 (Classes)**:  
    - Refactors (`n=10`, mean=1.6).  
    - Engineer’s projects (`n=11`, mean=1.1).  
    - 2-sprint projects (`n=30`, mean=1.2).  
  - **Step 2 (Adjustments)**:  
    - *None* (task breakdown is "inside view" — ignored per reference class philosophy).  
  - **Step 3 (Combine)**:  
    | **Class**       | Adj. Overrun | Relevance | √n   | **Weight** |  
    |-----------------|--------------|-----------|------|-----------|  
    | Refactors       | 1.6          | 5         | ≈3.2 | 16        |  
    | Engineer        | 1.1          | 4         | ≈3.3 | 13.2      |  
    | 2-sprint        | 1.2          | 3         | ≈5.5 | 16.5      |  
    **Weighted Average** = `(1.6×16 + 1.1×13.2 + 1.2×16.5) / (16+13.2+16.5) ≈ 1.34`.  
  - **Step 4 (Ambiguity)**: No cancellations → no adjustment.  
    - **Final**: Gut estimate × 1.34.  
  - **Uncomfortable Truth**: The engineer’s confidence is overruled by historical refactor delays.  

  #### **Case 3: Greenfield Internal Tool**  
  - **Step 1 (Classes)**:  
    - Greenfield projects (`n=5`, mean=1.8).  
    - Internal tools (`n=8`, mean=1.4).  
    - *No other classes with `n ≥ 3`.*  
  - **Step 2 (Adjustments)**:  
    - *None* (no known directional differences).  
  - **Step 3 (Combine)**:  
    | **Class**       | Adj. Overrun | Relevance | √n   | **Weight** |  
    |-----------------|--------------|-----------|------|-----------|  
    | Greenfield      | 1.8          | 5         | ≈2.2 | 11        |  
    | Internal tools  | 1.4          | 4         | ≈2.8 | 11.2      |  
    **Weighted Average** = `(1.8×11 + 1.4×11.2) / (11+11.2) ≈ 1.59`.  
  - **Step 4 (Ambiguity)**: First-of-a-kind? No — greenfield/internal exist.  
    - **Final**: Gut estimate × 1.59.  

  ---

  ### **What the Procedure Fundamentally Cannot Do**  
  1. **Eliminate Judgment**:  
     - Choosing classes and relevance scores involves subjectivity (your teammate’s "circularity" charge is valid).  
     - **Mitigation**: By requiring explicit weights and multiple classes, it surfaces bias rather than hiding it.  
  2. **Fix Bad Data**:  
     - Survivorship bias is unavoidable without cancellation data. The 20% uplift is a band-aid.  
     - Small samples (`n < 5`) introduce noise — uncertainty flags are critical.  
  3. **Replace Domain Expertise**:  
     - Directional adjustments (e.g., "high load = +25%") rely on team intuition.  
     - Truly novel projects (`n = 0`) default to 2.0× gut estimate — a philosophical stance (outside-view pessimism).  
  4. **Predict Black Swans**:  
     - Unprecedented risks (e.g., a new regulation) fall outside the model.  

  ### **Why This Works for Your Team**  
  - **Speed**: Uses precomputed data; focuses on scalable adjustments (relevance scores, directional tweaks).  
  - **Philosophical Rigor**: Embodies the "outside view" by forcing comparison to history, not task details.  
  - **Transparency**: Documents rationale for audits and improves over time as data grows.  

  **Final Advice**: Run this quarterly. Track estimate vs. actuals to refine adjustments (e.g., "we underestimated load impacts by 15%, adjust future rules"). The goal isn’t perfection — it’s to systemically counter the planning fallacy.
