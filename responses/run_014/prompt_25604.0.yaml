prompt: |-
  We're doing dispositions in my metaphysics class and I'm trying to figure out what I actually think. Here are my gut reactions to a bunch of cases:

  - A wine glass made of thin crystal, packed tight in styrofoam so if you whack it with a hammer it won't break. I still want to say it's fragile.
  - Same glass, but now there's a tiny device attached that detects incoming impacts and instantly alters the glass's molecular structure to be shock-absorbant. Hit it, the device fires, glass is fine. This feels different from the styrofoam case — I'm not sure the glass is fragile while the device is armed.
  - A perfectly good match, dry and everything, but it's in an oxygen-free chamber. Strike it and nothing happens. I still think it's flammable.
  - My uncle, who's normally quick to anger, but he's been on a new medication that completely supresses it. While the meds are active, I don't think he's irascible.
  - A steel rod that's definitely not fragile, but there's a device on it that would instantly weaken its molecular structure if struck, so it would shatter. I don't think the rod is fragile, even though it would break if you hit it.

  I'm all over the place. Is there a single principle about when an object has a disposition that gets all these verdicts? If not, which one should I give up? And what does your principle say about a sugar cube dropped into water that's already fully saturated — does it still count as soluble?
