  Urn B math: P(H*) plummets from 0.5 to near zero (white shoe strongly suggests machine 2)

  These numbers are damning for any simple "size matters" view - the degree camp must acknowledge that confirmation direction depends entirely on the generative model. But they'll likely argue this just proves their point about background knowledge affecting degree.

  For the cruxes, I'll focus on whether:
  1. Urn B's white shoe disconfirms H* (degree camp must concede this)
  2. "Bears on subject matter" can be formalized (aboutness camp's challenge)
  3. Negative instances require different treatment (Nicod's criterion revision)

  The surrender conditions will be revealing - I suspect the degree camp might relent if shown cases where irrelevant evidence theoretically shifts probability but is properly ignored. The aboutness camp might yield if a relevance measure captured their intuitions.

  *Noticing tension*
