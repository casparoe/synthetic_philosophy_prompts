answer: |-
  ## Joint Statement on the Raven Paradox  
  *Ashgrove Sixth Form Philosophical Society*  

  ### 1. Shared Commitments  
  Both camps endorse the following without reservation:  
  1.1. The hypothesis *H* ("all ravens are black") is logically equivalent to *H'* ("all non-black things are non-ravens").  
  1.2. Nicod’s criterion asserts that only observations of ravens bear directly on *H*: a black raven confirms *H*; a non-black raven falsifies *H*; non-ravens are irrelevant.  
  1.3. The equivalence principle holds that evidence confirming one logical form of a hypothesis confirms all equivalent forms.  
  1.4. The raven paradox arises from the apparent incompatibility of Nicod’s criterion and the equivalence principle when observing a white shoe (confirming *H'* but seemingly irrelevant to *H*).  
  1.5. **Urn Cases**:  
  &nbsp;&nbsp;(a) In **Urn A**, observing a white shoe **increases** the probability of *H* ("every raven-shaped bead is black").  
  &nbsp;&nbsp;(b) In **Urn B**, observing a white shoe **decreases** the probability of *H*.  
  &nbsp;&nbsp;(c) These cases demonstrate that background assumptions about data-generating processes critically impact whether non-raven evidence confirms *H*.  
  1.6. **Concessions**:  
  &nbsp;&nbsp;(a) The degree camp concedes Nicod’s criterion fails *in full generality* (e.g., in Urn A, non-ravens are not neutral).  
  &nbsp;&nbsp;(b) The aboutness camp concedes that in *some* contexts (e.g., Urn A), non-ravens can shift rational confidence in *H*.  

  ### 2. Persistent Disagreements  
  | Disagreement | Degree Camp Wording | Aboutness Camp Wording | Verdict |  
  |--------------|----------------------|-------------------------|---------|  
  | **Nature of confirmation** | "Confirmation is measured by Bayesian probability shift relative to background knowledge." | "Confirmation requires evidence to be *about* the hypothesis’s subject matter (here, ravens)." | Substantive |  
  | **White shoes in the wild** | "A white shoe always confirms *H* by a negligible degree given actual background knowledge." | "A white shoe is evidentially inert toward *H* absent a context linking shoes to raven-color distributions." | Substantive |  
  | **Status of equivalence principle** | "The principle holds universally: evidence for *H'* is evidence for *H*." | "The principle requires restriction: not all formulations equally capture *what the hypothesis is about*." | Verbal (Stipulate "confirmation" as *probability shift* vs. *relevance to intended query*) |  

  ### 3. Cruxes for Future Resolution  
  **Crux 1: Does Urn B’s white shoe disconfirm *H*?**  
  - **Case**: Urn B (two machines).  
  - **Calculation**:  
  &nbsp;&nbsp;- Prior *P*(H*) = 0.5 (equal machine probability).  
  &nbsp;&nbsp;- *P*(white shoe | Machine 1) = 0 (all beads black).  
  &nbsp;&nbsp;- *P*(white shoe | Machine 2) = *P*(white) × *P*(shoe | white) = (50/100) × (1/2) = 0.25.  
  &nbsp;&nbsp;- By Bayes: *P*(Machine 2 | white shoe) = [0.5 × 0.25] / [(0.5 × 0) + (0.5 × 0.25)] = 1.  
  &nbsp;&nbsp;- Thus *P*(H* | white shoe) = 0 (Machine 2 makes 50 white beads; H* requires all ravens black, but no constraints on white ravens).  
  - **Verdict**: Settles that the observation **refutes H*** in Urn B.  
  - **Predictions**:  
  &nbsp;&nbsp;- Degree camp: Agrees calculation is correct; uses it to show direction of confirmation depends on priors.  
  &nbsp;&nbsp;- Aboutness camp: Argues this shows "confirmation" requires context (here, the observation answers a question about machines).  

  **Crux 2: Can "aboutness" be formalized?**  
  - **Case**: If "about ravens" means *constraining the properties of ravens*, does Urn A’s white shoe meet this?  
  - **Argument**: In Urn A, the white shoe reduces uncertainty about white objects, indirectly constraining possible raven colors.  
  - **Predictions**:  
  &nbsp;&nbsp;- Degree camp: Yes—any information affecting *P*(H) formalizes aboutness.  
  &nbsp;&nbsp;- Aboutness camp: No—it constrains *non-ravens*, not ravens.  

  **Crux 3: Must Nicod’s criterion treat positive/negative instances symmetrically?**  
  - **Case**: Should observing a black raven (Nicod-positive) and avoiding non-black non-ravens (Nicod-neutral) have symmetric evidential roles?  
  - **Argument**: Urn A shows non-black non-ravens *can* support *H*; Urn B shows they can undermine it.  
  - **Predictions**:  
  &nbsp;&nbsp;- Degree camp: Symmetry is unwarranted; roles depend on priors.  
  &nbsp;&nbsp;- Aboutness camp: Asymmetry is core to hypothesis-testing; Nicod’s criterion should hold *unless context forces equivalence*.  

  ### 4. Conditions for Abandoning a Camp  
  - **Degree camp** would abandon their view if shown a case where:  
  &nbsp;&nbsp;(a) An observation shifts *P*(H) > 0.5, yet rationally should be ignored for decisions about *H*.  
  - **Aboutness camp** would abandon their view if:  
  &nbsp;&nbsp;(a) A formal account of "subject matter" reliably replicates their intuitions *and* mandates accepting white shoes as confirmatory in real-world contexts.  
  - **Shared progress condition**: Both agree a model of "question-sensitive confirmation" (e.g., treating *H* embedded in *competing generative processes*) could resolve the paradox without camp dissolution.  

  ### 5. Verbal Disputes Identified  
  This year’s debate conflated two distinct concepts under "confirmation":  
  - **Degree sense**: *Any Bayesian probability shift* (e.g., Urn A’s shoe increasing *P*(H) from 0.95 to ≈0.904).  
  - **Relevance sense**: *Evidence addressing a target query* (e.g., "Are there non-black ravens?").  
  Urn cases show these need not cohere. Disputes about "trivial support," "subject matter," and "absurdity" largely reduce to which sense is foregrounded. Future work should stipulate the intended usage.  

  ---  
  *This document, reflecting society deliberations through Michaelmas Term, is endorsed by all undersigned as a fair representation of common ground and unresolved issues.*
