answer: |-
  Based on a critical assessment of the technical challenges and the track record of proposed solutions, my **actual credence that expressivism can solve the Frege-Geach problem under your strict conditions is 20%**. Here's the decomposition of the key hurdles and their weight in driving this low credence:

  1.  **Embedded Contexts Without Truth-Conditions (Weight: 50% - Moves the number MOST):**
      *   **The Core Problem:** This is the *technical* heart of Frege-Geach. Can expressivism provide a **systematic, compositional, non-ad-hoc semantics** showing how the meaning of a complex sentence (like a conditional) is built from the non-cognitive meanings of its parts, *without* implicitly assigning truth-conditions to the moral components? Can "stealing is wrong" in the antecedent of "If stealing is wrong, then..." contribute to the meaning of the whole sentence in a way that's genuinely *different* from how a descriptive belief contributes, yet explains the logical behavior?
      *   **Why it's Hard & Heavy:** Proposed solutions (Blackburn's attitudinal operators, Gibbard's plan-laden worlds, Schroeder's "being for") often face charges of being ad-hoc, failing full compositionality, smuggling in truth-conditions, or generating incorrect predictions about validity/invalidity. Finding a framework that is both formally rigorous and *genuinely non-truth-conditional* for embeddings remains the biggest unsolved engineering challenge. **Progress here would move my credence the most dramatically (e.g., a demonstrably compositional, non-truth-conditional system handling a full range of embeddings would jump it to 60-70%). Failure here is fatal.**

  2.  **Avoiding Collapse into Quasi-Realism (Weight: 30%):**
      *   **The Slippery Slope:** Many sophisticated expressivist solutions (especially Gibbard's and Blackburn's later work) end up looking remarkably *like* a form of realism, albeit a "quasi" one. They grant that moral sentences can be called "true" or "false" in a deflated, minimal, or pragmatic sense, and that they refer to properties (understood as projections). Does this cross the line of "truth-apt in the ordinary sense"? Under your strict condition ("without making moral sentences truth-apt in the ordinary sense"), any significant concession here constitutes failure.
      *   **Why it's Significant:** Maintaining a *robustly* non-truth-apt semantics while solving the embedding problem is incredibly difficult. The tools needed for the embedding solution (like complex attitudinal objects or structures that mimic propositional content) often create heavy pressure towards quasi-realism. Distinguishing a "genuine" non-truth-apt solution from a quasi-realist one in disguise is philosophically fraught. **A solution that demonstrably avoids *any* minimal truth-predicate or property-ascription for moral sentences would significantly increase my credence (moving it +20-30%).**

  3.  **Explaining Substantive Disagreement (Weight: 20%):**
      *   **The Phenomenological Constraint:** Why do moral disagreements *feel* like disagreements about how the world *is*, rather than just conflicting preferences or desires? Expressivism needs to explain this without appealing to truth-apt beliefs describing objective properties.
      *   **Why it's (Relatively) Less Weighty:** Expressivists have arguably made more progress here. They explain substantive disagreement as *clashes in conative attitudes* (disapproval vs. approval) or *incompatible plans for action/norms*. While critics argue this doesn't fully capture the "mind-to-world" phenomenology, it's less of a *technical* showstopper than the embedding problem or the quasi-realism threat. Many find this aspect of expressivism *more* plausible than its handling of logic. **Solving the technical problems while *failing* here would still be a major achievement, lowering my credence less drastically than the other failures (-10-15%).**

  **Summary of Credence Drivers:**

  *   **Low Base Credence (20%):** Decades of intense effort have yielded sophisticated proposals, but none are universally accepted as definitively solving the core embedding problem under strict non-truth-apt constraints without significant residual concerns about ad-hocness or quasi-realism.
  *   **Biggest Hurdle:** **Embedded Contexts Without Truth-Conditions (50% weight).** This is the defining technical challenge. A genuinely successful, non-ad-hoc, compositional semantics here would be revolutionary and would massively increase my credence.
  *   **Critical Constraint:** **Avoiding Quasi-Realism Collapse (30% weight).** The pressure towards minimal truth or property-talk is immense when trying to solve the logic problem. A solution resisting this while solving embeddings is highly elusive.
  *   **Important but Less Decisive:** **Substantive Disagreement (20% weight).** While crucial for overall plausibility, expressivism has stronger resources here, making failure on this point less fatal to the specific "solution" criteria than failure on the first two.

  **In essence: My low credence reflects the immense difficulty of the core technical task (embedding semantics) under the severe constraint of robust non-truth-aptness. Success hinges almost entirely on a breakthrough in formal semantics for non-cognitive content in complex sentences.**
