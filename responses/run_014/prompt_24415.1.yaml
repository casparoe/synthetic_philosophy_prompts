  Okay, the user is asking for my actual credence regarding expressivism solving the Frege-Geach problem. They want a specific number and a breakdown of the factors influencing that credence. The key points are: solving means providing non-ad-hoc semantics for unasserted moral sentences in embedded contexts without making them truth-apt in the ordinary sense. They also want to know which sub-question would most affect my credence.

  First, I need to recall what the Frege-Geach problem entails. It's about how expressivism, which typically views moral statements as expressions of attitude, can handle cases where these statements appear in contexts like conditionals or disjunctions where they're not asserted. For example, in "If stealing is wrong, then it should be punished," the antecedent isn't asserted but embedded. Traditional expressivism struggles here because it doesn't assign truth conditions to moral sentences.

  The user specifies that "solve" means giving a non-ad-hoc semantics without making moral sentences truth-apt. So solutions like quasi-realism, which might allow for truth-aptness in a deflated sense, are out. They want a solution that stays true to expressivism's core. 

  Now, breaking down the factors: the user mentioned three sub-questions. First, whether unasserted expressions can function in embedded contexts without truth conditions. Second, whether the account explains why moral disagreement feels substantive. Third, avoiding collapse into quasi-realism. I need to assign weights to each and see which affects the credence most.

  Looking at existing attempts: Blackburn's projectivism uses higher-order attitudes. Gibbard's norm-expressivism employs possible worlds. But both have faced criticisms. Blackburn's approach might be seen as ad-hoc, and Gibbard's might blur into truth-aptness. Schroeder's hybrid expressivism introduces "being for" attitudes but has complexities. 

  My credence would be low because of the persistent challenges. Assigning 20% seems reasonable. For the weights: 50% to the first issue (embedded contexts without truth conditions) because that's the core technical hurdle. Then 30% to avoiding quasi-realism collapse since maintaining non-truth-aptness is crucial. The substantive disagreement part gets 20% because expressivism can handle disagreement through conflicting attitudes, which is less problematic.

  The embedded contexts issue is the biggest hurdle. If someone proposed a semantics where embedded moral sentences function like non-cognitive states contributing to complex contexts without truth conditions, that would significantly raise my credence. For example, if a new model shows how conditional antecedents express hypothetical attitudes without invoking truth, that's progress. However, past attempts often sneak in truth-apt elements, leading back to quasi-realism.

