prompt: |-
  What's your actual credence that expressivism can solve the Frege-Geach problem, where "solve" means giving a non-ad-hoc semantics for unasserted moral sentences in conditionals and disjunctions without making moral sentences truth-apt in the ordinary sense? I don't want "it depends on which expressivism" -- I want a number and the decomposition: how much rides on whether unasserted moral expressions can do work in embedded contexts without truth conditions, how much on whether the account still explains why moral disagreement feels substantive, how much on whether it quietly collapses into quasi-realism, and which sub-question would move your number most.
