  ---

  ### **Tree Logic Notes**
  - **Empty cells**: No combinations are incoherent or unattractive—all branches lead to a leaf. The tree covers your forks explicitly:
    - Detection (Q6, Q8): Covers intention, disposition, future action, or guess.
    - Timing of rationality (Q1, Q5): Separates ATM moment vs. whole scenario.
    - Precommitment (Q7): Asks if binding was possible and relevant.
    - One-shot vs. repeated (Q4): Tests if detection can be fooled temporarily.
    - Meaning of "rational" (Q5): Splits "maximize payoff" (Defier) from "can't be criticized" (Consistentist/Self-Binder).
  - **Indistinguishable leaves**: The **Self-Binder** and **Two-Leveler** always agree on actions in all cases. They differ only in vocabulary ("trait" vs "policy/action levels"). The tree cannot split them, as requested.
  - **Variant flips**: Only **The Defier** and **The Blaming Pragmatist** change their *outcome* in your variant (from no ride to ride+payment for the Pragmatist). Others keep the same outcome (payment) but may change tactics (e.g., signing vs. intending). **The Underdescriber** flips from "no answer" to "sign."

  This tree isolates your design bug: agents using "Defier" reasoning can't get rides (or deals with procurement bots) if predictors are good. Solutions like **Self-Binder** or **Consistentist** force honoring commitments by redefining rationality. Your variant (precommitment) "fixes" most positions by making the choice explicit and irreversible.
