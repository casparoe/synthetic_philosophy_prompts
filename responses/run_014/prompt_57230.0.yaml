  6. **Leaf: The Naive Optimist**  
     - **Original**: Intend to pay in the desert (and get the ride), then don’t pay at the ATM. If the driver only detects current intention, you can exploit this by lying or changing your mind later.  
     - **Commitment**: Rationality allows deception if you benefit and avoid detection—but this fails if the driver sees through it.  
     - **Flip in variant**: Sign the transfer (to get the ride). Precommitment makes deception unnecessary. Outcome: ride and payment.  
     - **Branch path**: Nodes 1→No, 3→Yes, 6→Current intention.

  7. **Leaf: The Blaming Pragmatist**  
     - **Original**: Don’t pay. You could have bound yourself earlier to force payment (e.g., via a contract or habit), but since you didn’t, you’re rationally "stuck"—you can’t get the ride or must defect.  
     - **Commitment**: Rationality includes blame for poor preparation—you "deserve" exclusion if you didn’t precommit when possible.  
     - **Flip in variant**: Sign the transfer. Now precommitment is available, so use it to get the ride. Outcome: ride and payment.  
