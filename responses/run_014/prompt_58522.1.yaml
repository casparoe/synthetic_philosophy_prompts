  ### Haggling Roommates: A Fair Division Story
  Alex and Bailey are roommates who just earned $100 from a joint project. They also have a 48-hour weekend to split for free time. But their apartment is small—if one claims over 24 hours of solo free time (e.g., for loud hobbies), they must spend $20 on noise-canceling headphones for the other. Alex values money (in $) and free time (in hours) equally: **utility = money + 1 × free time**. Bailey values money twice as much as free time: **utility = 2 × money + 1 × free time**. If they disagree, both get $0 and only 10 hours of free time each (due to chores and arguments). So the **fallback utilities** are:  
  - Alex: $0 + 1×10 = **10 utils**  
  - Bailey: 2×$0 + 1×10 = **10 utils**  

  The **feasible set** of utilities (Alex, Bailey) is constrained by:  
  - Total money ≤ $100 (minus $20 if headphones needed)  
  - Total free time ≤ 48 hours  
  - If Alex >24 hours or Bailey >24 hours, $20 is spent.  

  This creates a "kinked" frontier (details below). The **ideal point** (max possible utilities) is Alex: 48 utils (all time, no money), Bailey: 200 utils (all money, no time).  

  ### Nash Bargaining Solution
  Maximizes: **(Alex's utility - 10) × (Bailey's utility - 10)**  
  - **Result: (Alex 48 utils, Bailey 100 utils)**  
    - Alex gets **48 hours** free time, **$0**  
    - Bailey gets **0 hours** free time, **$50** (since $20 spent, $80 total split; Bailey takes $50, leaves $30 unused as it doesn't boost utility).  
  - *Why?* Nash prioritizes the product. Alex gains 38 utils (48−10), Bailey gains 90 utils (100−10). Product (38×90=3420) is highest here.  

  ### Kalai-Smorodinsky Solution
  Draws a **straight line** from fallback (10,10) to ideal (48,200) and stops at the feasible frontier.  
  - **Result: (Alex 32.8 utils, Bailey 124.6 utils)**  
    - Alex gets **24 hours** free time, **$8.80**  
    - Bailey gets **24 hours** free time, **$50.20** (no headphones needed as both ≤24 hours).  
  - *Why?* KS ensures proportional gains. The line hits the frontier where gains (Alex:22.8 utils, Bailey:114.6 utils) align with the ideal’s ratio (38:190 ≈ 1:5).  

  ### Key Differences & Why They Separate
  | **Solution** | Alex: Free Time | Alex: Money | Bailey: Free Time | Bailey: Money |  
  |--------------|-----------------|-------------|-------------------|--------------|  
  | **Nash**     | 48 hours        | $0.00       | 0 hours           | $50.00       |  
  | **KS**       | 24 hours        | $8.80       | 24 hours          | $50.20       |  
  - **Difference**: Nash gives Alex **24 more hours** of free time and Bailey **$0.20 less**, but Bailey loses all free time. KS splits free time evenly and gives Alex $8.80.  
  - **Why the split?** The $20 headphone rule creates a **kink** in the feasible set (see plot below). Nash jumps to the kink (high Alex time, low Bailey time), while KS follows the line to the smoother region (balanced time).  
  - **The kink’s role**: Without it (ignore headphones), the frontier is a straight line. Nash and KS would then *coincide* at (Alex 28 utils, Bailey 140 utils)—splitting time 18/30 hours and money $10/$90. The kink disrupts symmetry, favoring Nash for "extreme" gains and KS for balance.  

