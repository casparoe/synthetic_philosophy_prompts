  - **Kink region** (Alex >24 hours): Frontier steeply drops (Alex gains more utility per hour, Bailey loses money to headphones).  
  - **Smooth region** (both ≤24 hours): Flatter tradeoff (money/time substitutions are smoother).  

  ### A Die-Hard Nash Fan's Complaint
  *"This is rigged! The $20 rule makes the set non-convex. In reality, we’d use lotteries to smooth the kink, and Nash would dominate!"*  
  **Rebuttal**: True, convexifying (via lotteries) would make Nash and KS coincide. But in real-world haggling (like this story), lotteries are impractical—you can’t randomize "who gets headphones" without feeling unfair. The example highlights how **non-convexities** (common in real constraints) split the solutions.  

  ### Math Recap (Phone-Friendly)
  **Nash**: Maximize `(A-10)×(B-10)`.  
  - For `A=48, B=100`: `(38)×(90)=3420` (highest product).  

  **KS**: Line from `(10,10)` to `(48,200)`: slope `=(200-10)/(48-10)=190/38=5`.  
  - Equation: `B = 10 + 5(A-10)`.  
  - Intersects frontier at `A=32.8, B=124.6` (solved numerically for the flat region).  

  **Feasibility Checks**:  
  - *Nash*: Alex 48hr (needs headphones, $20 spent). Money: $100 - $20 = $80. Bailey takes $50 (utility=2×50+0=100), leaves $30.  
  - *KS*: Both ≤24hr (no headphones). Alex: 24hr + $8.80 = 24+8.80=32.8 utils. Bailey: 24hr + $50.20 = 2×50.20+24=100.40+24=124.6 utils. Money: $8.80+$50.20=$59 (<$100, rest unused).  

  This shows how rules shape fairness—Nash rewards risk-takers, KS enforces balance. Enjoy your study group! 😊
