  The user's deeper question: did Eliot's theory fail ordinary people? The public fury (petitions, "Seven Against Christ" vitriol) suggests yes. Her model required literary cultivation; most lacked that. The essayists' abstract approach couldn't spark communal reverence like novels or liturgy.

  Where Eliot's framework cracks:
