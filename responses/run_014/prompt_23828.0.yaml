  Mapping this through Eliot's framework:
  - The essayists (Williams, Wilson, etc.) were like her: rejecting literalism but preserving ethics. But they operated institutionally, unlike her solitary path. Their essays lacked the novel's emotional training—dry scholarship couldn't cultivate sympathy.
