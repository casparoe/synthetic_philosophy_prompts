  3. Emotional scaffolding: The public needed communal rituals, not just ideas. Eliot's atheism retained solemnity; the essayists' historicism felt like disenchantment.

  The user likely intuits Eliot's blind spots because they're a novelist—they see how stories shape ethics but also know real-world conflicts exceed narrative solutions. Their closing challenge ("never had a real shot") nails it: Eliot's vision was elitist. The resolution via legal loophole exposes that dogma was never the real glue—community was, and her theory undervalued that.

