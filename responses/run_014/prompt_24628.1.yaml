  We are going to formalize the presumption of independence as a default rule in probabilistic reasoning. The core problem is that the two common justifications for default independence — maximum entropy under marginal constraints and a uniform prior over the joint distribution space — yield contradictory prescriptions. Maximum entropy gives the product distribution (independence) as the unique solution, while a uniform prior over the joint distribution (with no constraints) assigns zero probability to the independence subspace (since it is lower-dimensional) and instead spreads probability over the dependence parameter. This conflict reveals a deeper ambiguity in what "presuming nothing" means.

  The research question is: 
    "Under what formalization of 'default prior' for a joint distribution, given fixed marginals, does the presumption of independence arise as the unique optimal solution, and what are the necessary conditions for this to be the case?"

  This question has a determinate answer: we will either find a formalization (a prior or a principle) that uniquely selects independence, or we will show that no such non-arbitrary formalization exists. The answer must specify the conditions under which independence is the default and when it is not.

  Why the standard positions leave the question open:
  1. Maximum entropy (maxent) under marginal constraints: This method yields independence, but it relies on the choice of the entropy measure (Shannon entropy) and the discretization of the sample space. The justification that maxent represents "maximum ignorance" is not invariant under reparameterization. Moreover, it imposes the constraints (the fixed marginals) as absolute, which is a strong assumption for a default.
  2. Uniform prior over the joint space: In the continuous case, the set of independent joint distributions is a lower-dimensional submanifold and hence has measure zero. Thus, a uniform prior would never choose independence. But this approach also has a reparameterization problem: the uniform prior is defined with respect to a specific parameterization of the joint distribution.

  We propose to resolve the conflict by using the framework of *reference priors* in Bayesian statistics, which are designed to be non-informative and maximize the expected information (Bernardo, 1979). The reference prior is defined as the prior that maximizes the Kullback-Leibler divergence between the prior and the posterior, which is equivalent to maximizing the expected information in the data. We will consider the following approach:

    - We fix the marginal distributions of two random variables X and Y. We consider the space of joint distributions with these fixed marginals.
    - Instead of maximizing entropy over the joint space (which is what maxent does under the marginal constraints), we define a reference prior over the space of joint distributions that have the given marginals. Then, we ask: under what conditions does this reference prior concentrate on the independent joint distribution?

  Alternatively, we can frame it as:

    - We have a model of the joint distribution parameterized by a dependence parameter θ (for example, the correlation coefficient). The independent case is θ=0. We then compute the reference prior for θ (and any other parameters) given the fixed marginals. Does this prior peak at θ=0? Or is it uniform? Or something else?

  The key insight is that the reference prior is invariant under one-to-one reparameterizations and is derived from the structure of the statistical model (via the Fisher information). Therefore, it addresses the reparameterization issue.

  We choose this approach over the obvious alternatives for the following reasons:

    - A purely axiomatic treatment (e.g., stating properties the default should satisfy and then deriving it) might avoid the technicalities but would be vulnerable to the same reparameterization concerns. Also, it would not connect to the existing statistical practice.
    - Accumulating puzzle cases (like the problems that arise when treating evidence as independent by default) is useful but does not provide a positive formalization.

  The reference prior approach is promising because:
    - It is a well-established method for constructing non-informative priors.
    - It directly addresses the issue of what "maximal ignorance" means in a parameterized space.
    - It allows us to incorporate the fixed marginal constraints in a natural way by conditioning on them.

  Plan of attack:

  1. For two discrete random variables with fixed marginals, we can parameterize the joint distribution by the off-diagonal elements (or in the 2x2 case, by a single odds ratio). We compute the reference prior for the dependence parameter and check if it is concentrated at independence.

  2. For continuous random variables, we consider the bivariate normal distribution with fixed marginals (i.e., fixed means and variances) and unknown correlation coefficient ρ. We then compute the reference prior for ρ and see if it favors ρ=0 (independence). Note: In the bivariate normal case, the reference prior for ρ when the means and variances are known is known to be proportional to 1/(1-ρ²) (Berger and Bernardo, 1992). This prior is not peaked at zero but is symmetric around zero and has more mass near ±1 than at 0. Hence, it does not default to independence.

     However, note that in our setting we are conditioning on fixed marginals. In the bivariate normal, the marginal distributions are fixed by the means and variances, so the above prior is exactly the one we are interested in. This prior does not peak at ρ=0.

     But wait: the reference prior for the bivariate normal correlation parameter is not uniform. It is symmetric and has a dip at zero? Actually, it is increasing as |ρ| increases to 1. So it actually favors stronger dependence? That would be the opposite of defaulting to independence.

     So in the bivariate normal case, the reference prior does not give independence. This suggests that the maxent solution (which in this case is the product of the marginals, i.e., ρ=0) is not the reference prior default.

     However, note that the maxent solution is the one with the highest entropy (for fixed marginals) and in the bivariate normal, the entropy is maximized at ρ=0. So why does the reference prior not concentrate there? Because the reference prior is designed to maximize the expected information in the data, not to maximize the entropy of the prior itself.

     This discrepancy is the crux.

  3. We then consider discrete cases. For example, two binary random variables. The joint distribution has 3 free parameters (since the marginals fix two linear constraints, leaving one degree of freedom for the odds ratio). The reference prior for the odds ratio (or the log odds ratio) can be derived. We compute it and see if it is peaked at the independence case (odds ratio=1).

  4. We also consider the effect of the sample space discretization. It is known that maxent is sensitive to the granularity of the discretization. The reference prior, being defined via the Fisher information, is invariant to reparameterization but may be sensitive to the model specification.

  5. We will then try to reconcile the two approaches by noting that the maxent solution is the same as the reference prior for a particular choice of the parameter of interest. Specifically, Bernardo has argued that the reference prior depends on the parameter of interest. If we take the parameter of interest to be the dependence parameter itself, then we get a prior that is spread over it. But if we take the parameter of interest to be the entire joint distribution, then we might get a different result. Alternatively, if we take the parameter of interest to be the value of the joint probability at a particular point, then the reference prior might lead to maxent.

     This is a key point: the reference prior depends on the ordering of the parameters (or on which parameter is of primary interest). We will investigate what ordering would lead to independence as the default.

     Hypothesis: If the dependence parameter is considered a nuisance parameter and the marginal distributions are the parameters of interest, then conditioning on the marginals (as fixed) and then deriving the reference prior for the dependence parameter might lead to a prior that peaks at independence. But note: in our setting, the marginals are fixed, so we are only varying the dependence. The reference prior for the dependence parameter, given fixed marginals, might not necessarily be peaked at zero.

     Alternatively, if we consider the entire joint distribution as the parameter and we are interested in the joint distribution, then the reference prior might be uniform on the joint space (with fixed marginals) and then the mode (if it exists) might be at the independent point? But note: the maxent solution is the one that maximizes the entropy, which is the mode of the Dirichlet distribution (if we were to put a flat Dirichlet prior on the joint probabilities) only in the discrete case and only in a particular sense. The Dirichlet distribution with concentration parameters all 1 (the uniform prior) does not have its mode at the independent joint distribution unless the marginals are uniform.

     This is getting complicated.

  6. Alternatively, we can consider the Kullback-Leibler divergence between the joint distribution and the product of the marginals. The independent distribution minimizes this divergence (to zero). The reference prior might be interpreted as the prior that maximizes the expected divergence? Not exactly.

  Let us reframe: The reference prior is designed to maximize the expected Kullback-Leibler divergence between the prior and the posterior (the mutual information between the parameter and the data). We are not directly maximizing the entropy of the prior.

  We need to see if, in the space of joint distributions with fixed marginals, the reference prior (which is defined by maximizing the expected information in the data) happens to be concentrated at the independent joint distribution.

  But note: the reference prior is a distribution on the parameter space, so in the case of a continuous dependence parameter, it is a density. We are asking: does that density have a mode at the independent point?

  In the bivariate normal case, the reference prior for the correlation coefficient ρ (with fixed means and variances) is π(ρ) ∝ 1/(1-ρ²). This prior has minima at ρ=0 and maxima at ρ=±1. So it does not favor independence.

  Therefore, we must conclude that the reference prior does not generally default to independence.

  So what approach then?

  We might consider a different principle: the principle of minimum discrimination information (Kullback, 1959). The minimum discrimination information distribution, subject to the marginal constraints, is the independent distribution. This is equivalent to maxent. But again, we are back to the same issue.

  Alternatively, we can consider the concept of risk in decision theory. We can show that using the independent distribution as a default minimizes the worst-case regret (for some loss function). For example, using the product distribution minimizes the worst-case logarithmic loss (which is related to entropy). This is a minimax argument.

  We propose a new direction: 

    We will show that the independent joint distribution is the centroid of the space of joint distributions with fixed marginals when that space is endowed with the Fisher information metric. This would make it the natural "center" and hence a default.

    In information geometry, the set of joint distributions with fixed marginals forms an exponential family. The independent distribution is the unique point in that family that minimizes the KL divergence to the uniform distribution (if we had no constraints). But we have fixed marginals.

    Actually, the set of joint distributions with fixed marginals is a flat submanifold in the information geometry of the exponential family? Not exactly. For finite discrete random variables, the set of joint distributions with fixed marginals is a convex set. The independent distribution is in this set. Moreover, it is the point that maximizes the entropy. In fact, the entire set is an exponential family with the independent distribution as the natural parameter? Not exactly.

    The set of joint distributions with fixed marginals is not an exponential family. However, the set of joint distributions that are independent (i.e., the product of the marginals) is a single point. The set of joint distributions with fixed marginals is a linear family (Barndorff-Nielsen, 1978) and the maxent distribution is the I-projection of the uniform distribution onto that family. This is well established.

    But to justify it as a default prior, we must show that it is the center of the set in a geometrically natural way. We can consider the barycenter of the set with respect to the Fisher metric. The maxent distribution is the point that minimizes the KL divergence to the uniform distribution, which is the same as the I-projection. But in the Fisher metric, the uniform prior is not uniform in the geometric sense.

    We propose to investigate the following:

      - What is the Riemannian metric induced by the Fisher information on the space of joint distributions with fixed marginals?
      - What is the centroid (the center of mass) of that space with respect to that metric?
      - Is it the independent distribution?

    If the answer is yes, then we have a geometric justification for the default.

  However, note that the space is typically not compact, so the centroid might not be defined. But in the discrete case, if we consider the probabilities to be bounded, then it is compact.

  In the 2x2 discrete case, the space of joint distributions with fixed marginals is a one-dimensional curve (an interval) in the simplex. The Fisher metric on this space can be computed. We then compute the centroid of this interval with respect to the Fisher metric and see if it is the independence point.

  Alternatively, we can consider the mean with respect to the Jeffreys prior (which is based on the Fisher information) on this space. But note: the Jeffreys prior is the reference prior when the parameters are ordered by their appearance in the parameterization. In the 2x2 case, the Jeffreys prior for the dependence parameter (the log odds ratio) might be computed. We then check if its mean or mode is at independence.

  This is a concrete plan.

  What a successful result would look like:

    - We establish that for a broad class of models (including discrete and continuous), the reference prior (or the Jeffreys prior) for the dependence parameter, given fixed marginals, is symmetric and centered at zero. This would support independence as the default.

    - Alternatively, we show that the centroid of the constrained space under the Fisher metric is the independent joint distribution. This would provide a geometric justification.

    - Or we might find that the independent distribution is the unique point that is invariant under some natural group of transformations (e.g., relabeling of the outcomes).

    - A negative result would be that in the bivariate normal case, the reference prior is not centered at zero, and in the 2x2 case, the reference prior for the log odds ratio is uniform (which would be symmetric about zero but not peaked there). This would mean that independence is not the default in the reference prior approach. Then we would have to conclude that the maxent approach is the only one that gives independence, and its justification must be based on other grounds (like minimax regret).

  What would count as the project failing:

    - If we find that the reference prior does not generally concentrate at independence and that the geometric centroid is not at independence (or does not exist), then we have not found a formalization that unifies the two positions. We would then have to conclude that the default of independence is only justified by the maxent principle and is not a universal non-informative prior.

    - If we find that in some cases the reference prior is peaked at independence and in others it is not, then we have to explain why the heuristic is more appropriate in some domains than others.

  Tractability:

    - The project is tractable for specific cases (bivariate normal, 2x2 discrete) and we can compute the reference priors and centroids explicitly. The bivariate normal case is already known. The 2x2 discrete case is manageable. The information geometry of the constrained space in higher dimensions is more challenging, but we can start with low dimensions.

    - The scope is bigger than it looks because we are connecting three advanced topics: reference priors, information geometry, and maximum entropy. However, by focusing on two concrete examples and then generalizing, we can produce a meaningful result.

    - Time: A semester project is feasible for the two cases and a discussion of the implications.

  Therefore, we propose:

    We will investigate the geometry and the reference prior for the space of joint distributions with fixed marginals. We will compute the reference prior and the Fisher-Rao centroid for two canonical cases: (1) two binary random variables (2x2 contingency table) and (2) the bivariate normal distribution with fixed means and variances. We will then compare these to the maximum entropy solution (which is independence). Based on these results, we will either:

      a) Propose a new geometric justification for default independence (if the centroid is found to be at independence), or
      b) Explain the discrepancy and argue that the maxent solution is justified by a different principle (minimax or invariance).

    This will resolve the foundational disagreement by showing which formalization of "default" leads to independence and under what conditions.
answer: |-
  **Research Proposal: Formalizing the Default Presumption of Independence in Probressive Reasoning**  

  **Research Question:**  
  Given fixed marginal distributions for two random variables \(X\) and \(Y\), under what formalization of a "maximally uninformative prior" does the joint distribution default to independence, and what are the necessary conditions for this default to hold?  

  **Problem Statement:**  
  The heuristic "presume independence absent evidence of dependence" faces two conflicting formalizations:  
  1. **Maximum Entropy (MaxEnt) Approach:** Constraining to fixed marginals and maximizing Shannon entropy yields the product distribution as the unique solution. This is framed as the "least informative" joint distribution given the constraints.  
  2. **Uniform Prior over Joint Space:** A uniform prior over all possible joint distributions assigns measure zero to the independence subspace (a lower-dimensional manifold) and instead induces a spread over dependence parameters.  

  These approaches disagree fundamentally: MaxEnt *prescribes* independence as the default, while the uniform prior *precludes* it. Neither resolves the arbitrariness in parameterization (MaxEnt is not reparameterization-invariant) or justifies why one formalization of "ignorance" is preferable. The core problem is that both assume distinct, incompatible definitions of "uninformative," leaving the heuristic's formal basis undefined.  

  **Proposed Approach:**  
  Resolve the conflict by **treating the default as a well-calibrated reference prior** that must satisfy two criteria:  
  - **C1:** Reparameterization invariance (the prior form adapts to the model’s geometric structure).  
  - **C2:** Consistency with finite-dimensional discretizations (the default remains stable under coarse-graining of sample spaces).  

  We will use **information geometry** to define a prior over the space of joint distributions with fixed marginals. Specifically:  
  - Model the constrained space \(\mathcal{P}\) of joint distributions as a Riemannian manifold equipped with the **Fisher information metric** (ensuring C1).  
  - Compute the **Jeffreys prior** (proportional to the square root of the determinant of the Fisher metric) over \(\mathcal{P}\), which is invariant under reparameterization.  
  - Evaluate whether this prior concentrates mass at independence (the product distribution) for key cases:  
    - Discrete \(X\) and \(Y\) (binary, then \(n\)-ary).  
    - Continuous \(X\) and \(Y\) (bivariate normal with fixed marginals).  
  - Test C2 by discretizing continuous cases and verifying prior stability under limiting behavior.  

  **Why This Approach?**  
  - **Over Axiomatic Treatments:** Axioms (e.g., Shore-Johnson) *assume* independence as an entropy-maximizing outcome but do not address measure-theoretic or reparameterization objections. Information geometry incorporates these constraints intrinsically.  
  - **Over Accumulating Puzzles:** Case studies (e.g., Simpson’s paradox) highlight inconsistencies but lack generative power. Our approach derives the default from first principles, enabling predictive tests.  
  - **Over MaxEnt/Uniform Prior Dichotomy:** The Jeffreys prior subsumes both intuitions—it maximizes entropy locally via the Fisher metric while respecting the global manifold structure (addressing measure-zero concerns).  

  **Expected Outcomes and Success Criteria:**  
  - **Success:** The Jeffreys prior concentrates at independence for discrete cases and symmetric continuous distributions (e.g., bivariate normal), justifying the heuristic when C1–C2 hold. This would:  
    - Reconcile MaxEnt with geometric invariance.  
    - Quantify deviations (e.g., non-concentration in asymmetric marginals) as natural bounds for the heuristic.  
  - **Failure:** If the Jeffreys prior *never* concentrates at independence (e.g., always assigns it measure zero) or diverges under discretization (violating C2), the heuristic lacks a non-arbitrary formal basis. This would necessitate retreat to pragmatic arguments (e.g., computational convenience).  
  - **Ambiguous Outcome:** Concentration depends on distribution families (e.g., holds for Gaussians but not exponential families), revealing context-dependent limits.  

  **Feasibility:**  
  - **Tractable:** Low-dimensional cases (binary/bivariate normal) are computationally feasible; Fisher metrics for constrained spaces are well-studied. Recent work on reference priors for restricted manifolds (e.g., [Berger et al.]) provides technical groundwork.  
  - **Risks:**  
    - Non-compact manifolds (e.g., unbounded correlations) may impede Jeffreys prior normalization. Solution: Use penalized variants (e.g., adjusted reference priors).  
    - Discretization stability proofs may require advanced analysis (e.g., \(\Gamma\)-convergence). Mitigation: Focus on representative cases first.  
  - **Scope:** Focused on bivariate settings; extensions to conditional independence or >2 variables are possible but deferred.  

  **Conclusion:**  
  This work will either establish independence as a geometrically natural default (via Jeffreys priors) or demonstrate that no such universal formalization exists—resolving the foundational dispute through invariance and stability criteria.
