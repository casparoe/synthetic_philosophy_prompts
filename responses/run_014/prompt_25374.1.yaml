answer: |-
  Below is a decision tree designed to sort readers into coherent positions on the "dirty hands" problem based on their intuitions about political ethics. The tree starts with a foundational question and branches on key follow-up questions, leading to five distinct positions (including one empty branch). Positions are defined by logical consistency, not labels. **Leaves are marked in bold**, and I've noted empty branches, logical gaps, and ambiguities per your request.

  ---

  ### **Decision Tree: The Dirty Hands Problem**

  #### **Q1: Can a political leader ever justifiably do something that would be morally wrong for an ordinary citizen?**
  - **If NO → Moral Absolutism (Leaf 1)**  
    *Position*: No circumstance ever justifies a leader violating ordinary morality (e.g., torture, lying, killing innocents). Actions like these are intrinsically wrong, regardless of consequences or role.  
    *Thinkers*: Early Kant, absolute pacifists.  
    *Key trait*: Rejects the core premise of "dirty hands."

  - **If YES → Proceed to Q2**  
    *Rationale*: You accept that leadership can require morally tragic choices. Now we drill deeper.

  ---

  #### **Q2: If the action was the right call (i.e., necessary/justified in context), does any "moral remainder" (guilt, regret, stain on character) still properly attach to the agent?**  
  *(Assume the action succeeded in its goal, e.g., saving lives by sacrificing one innocent.)*
  - **If NO → Proceed to Q3A**  
    *Rationale*: You think justification fully absolves the agent—no residue.  

  - **If YES → Proceed to Q3B**  
    *Rationale*: You believe the act leaves a trace of wrongness, even if necessary.  

  ---

  #### **Q3A: Should the public still blame or punish the leader, despite acknowledging the action was necessary?**
  - **If NO → Consequentialist Purification (Leaf 2)**  
    *Position*: Justification washes everything clean. No guilt, no blame, no punishment. The leader is a heroic pragmatist.  
    *Thinkers*: Act-utilitarians (e.g., Bentham), strategic realists.  
    *Key trait*: Morality is solely about outcomes; roles dissolve ethical boundaries.  

  - **If YES → 🚫 Empty Branch (Leaf 3)**  
    *Why empty?* Logically possible but philosophically unstable. If an act is fully justified (no moral remainder), blame/punishment lacks a rational basis. No major thinker defends this—it conflates justification with scapegoating.  

  ---

  #### **Q3B: Should the public still blame or punish the leader, despite acknowledging the action was necessary?**
  - **If NO → Walzerian Tragic Agent (Leaf 4)**  
    *Position*: The leader *must* do the deed (it’s justified) but *must* bear guilt as a "stain." Public forgiveness hinges on the agent’s remorse—yet formal punishment is inappropriate.  
    *Thinkers*: Michael Walzer (dirty hands as tragic necessity), Weber ("ethics of responsibility").  
    *Key trait*: Moral conflict is irreducible; guilt is the price of leadership.  

  - **If YES → Public Accountability View (Leaf 5)**  
    *Position*: Necessary evils demand both agent guilt *and* public sanction (e.g., censure, resignation, trial). The act is contextually justified but violates communal norms requiring accountability.  
    *Thinkers*: Civic republicans (e.g., Machiavelli’s realism + popular judgment), Shklar (liberalism of fear).  
    *Key trait*: Society must condemn the act to uphold moral boundaries, even if it was "right."  

  ---

  ### **Annotations**
  1. **Empty Branch (Leaf 3)**:  
     As noted, this combination (justified + no remainder + punishment) is incoherent. Blame requires a residual wrong, but this branch denies any residue. It implies punishing leaders for *succeeding*, which no theory endorses.

  2. **Ambiguous Separation: Walzerian (Leaf 4) vs. Public Accountability (Leaf 5)**  
     The tree **cannot cleanly distinguish** these if a respondent wavers on public punishment. Walzer allows for *symbolic* accountability (e.g., resignation) but rejects formal punishment for remorseful leaders. Public Accountability insists on institutional consequences. In practice:  
     - If you endorse punishment *even when the leader feels guilt*, you’re in Leaf 5.  
     - If punishment is only fitting for *unrepentant* leaders, you’re still in Leaf 4 (Walzer’s nuance).  
     *Recommendation*: Add a sub-question under Q3B: "Does the leader’s guilt absolve them of public sanction?" If YES → Leaf 4; If NO → Leaf 5.

  3. **Missing Position?**  
     - **Rule-Consequentialism**: Not a distinct leaf here. It typically collapses into Leaf 2 (if rules are outcome-oriented) or Leaf 5 (if rules are deontic constraints requiring accountability).  
     - **Moral Luck**: Would nest under Q3B (guilt attaches due to luck), but doesn’t alter the core branches.

  ---

  ### **Tree Summary**
  ```mermaid
  graph TD
    A[Q1: Justifiable for leaders?] -->|No| B[Moral Absolutism • Leaf 1]
    A -->|Yes| C[Q2: Moral remainder?]
    C -->|No| D[Q3A: Public blame/punish?]
    C -->|Yes| E[Q3B: Public blame/punish?]
    D -->|No| F[Consequentialist Purification • Leaf 2]
    D -->|Yes| G[Empty Branch • Leaf 3]
    E -->|No| H[Walzerian Tragic Agent • Leaf 4]
    E -->|Yes| I[Public Accountability • Leaf 5]
  ```

  ### **Key Takeaways for Handout**
  - **Moral Absolutism (Leaf 1)**: No exceptions.  
  - **Consequentialist Purification (Leaf 2)**: Clean hands via success.  
  - **Walzerian (Leaf 4)**: Justified guilt, no punishment.  
  - **Public Accountability (Leaf 5)**: Justified guilt + public sanction.  
  - **Test Ambiguity**: Use a leader-torture scenario (e.g., "Should a leader torture to stop a bomb? If yes, must they feel guilt? Should they be tried?"). Leaf 4/5 respondents diverge on the last question.  

  This tree isolates core positions while highlighting where intuitions clash (e.g., Walzer vs. civic republicans) and where logic forces consistency (e.g., the empty branch). Ideal for triggering debate!
