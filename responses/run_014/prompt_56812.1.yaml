  The 12-week plan needs clear phases: formalization (weeks 1-3), existence/uniqueness analysis (weeks 4-7), stability/admissibility deep dives (weeks 8-10), and synthesis (weeks 11-12). I'll include contingencies like switching claims if initial results warrant it.

