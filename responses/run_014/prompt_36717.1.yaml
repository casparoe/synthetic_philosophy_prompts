  The arbitrariness question is thorny. Lewis defines it as "multiple possible equilibria where alternatives would serve equally well" - but here the right-side option was clearly superior due to steering wheel configurations and cross-border traffic. This exposes a gap in Lewis: conventions can persist despite being suboptimal when historical lock-in occurs. Must distinguish between "serving equally well" (false here) and "both being coordination equilibria" (true).

  For the state intervention puzzle... this challenges Lewis's core mechanism. Legislation artificially created common knowledge and salience overnight through the Dagen H campaign. The referendum is fascinating - that 83% vote likely expressed preference for coordination maintenance rather than left-side superiority. People were voting against disruption, not for left-side driving per se.

