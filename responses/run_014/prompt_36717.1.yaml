answer: |-
  Here is a rigorous analysis of Sweden's Dagen H through the lens of Lewis's convention theory, structured according to your five requirements:

  **1. Mapping the Convention & Its Deviation**
  *   **Lewisian Coordination Problem:** Choosing which side to drive on is a recurrent, symmetrical coordination game. The players are all road users (drivers, cyclists, pedestrians). Payoffs are high when all choose the same side (avoiding collisions), low when choices clash. The alternatives (Left or Right) are arbitrary in the sense that *either* coordinated solution works.
  *   **Preference for General Conformity:** Each individual strictly prefers to drive on the same side as *everyone else*, regardless of which side it is. Safety and efficient flow depend on universal conformity.
  *   **Precedent & Common Knowledge:** The established regularity (pre-1967 Left-driving) was sustained by common knowledge: Everyone knew everyone else drove left, knew others knew it, and expected continued conformity because of this knowledge. Precedent (history of left-driving) created salience, making "drive left" the focal point.
  *   **Deviation from Textbook Case:** The textbook case assumes symmetrical payoffs and a self-sustaining equilibrium. Dagen H deviates critically in two ways:
      1.  **Asymmetrical Payoffs:** Due to LHD vehicles and cross-border traffic, the *Right-side equilibrium* offered objectively higher payoffs (safer overtaking, easier border crossings) than the Left-side equilibrium, even *before* the switch. Left-driving was Pareto-inferior.
      2.  **Exogenous Rupture:** The equilibrium wasn't overturned by gradual drift or a new focal point emerging organically. It was shattered by **state legislation** – an external, authoritative command overriding individual preferences and existing precedent.

  **2. Arbitrariness & Pareto-Inferiority**
  *   **Lewis's Arbitrariness:** Lewis defines arbitrariness functionally: Given general conformity to R, an alternative regularity S would have served *as well* as a solution to the coordination problem (and vice versa). It's about substitutability, not necessarily equal optimality.
  *   **Compatibility with Inferiority:** Dagen H shows arbitrariness is *compatible* with entrenched inferiority. Both Left and Right were **viable coordination equilibria** – either solved the core problem of collision avoidance. However, they were **not equally good**. Right-driving was superior due to exogenous factors (vehicle design, geography).
  *   **The Crucial Distinction:** The episode forces the distinction:
      *   "Either would have served": **True.** Both Left and Right are *coordination equilibria* preventing chaos.
      *   "Both were equally good": **False.** Given LHD prevalence and neighbouring states, Right-driving was unambiguously *better* in terms of safety and efficiency even *while* Left was the established convention. Lewis's arbitrariness captures the first point but is silent on the second. The inferior convention persisted due to the high costs of coordinated switching (lock-in), not because the alternatives were equally desirable.

  **3. Re-coordination by Decree: The State's Role**
  *   **Lewis's Self-Perpetuation vs. State Intervention:** Lewis's model emphasizes organic, expectation-driven stability. Dagen H involved a top-down, instantaneous switch. The state machinery enabled this:
      *   **Manufacturing Common Knowledge & Salience:** The massive, years-long public campaign (Högertrafikkommissionen) created universal awareness *that* the switch *would* happen on Dagen H. Dagen H itself became an incredibly salient, common-knowledge focal point. Legislation provided a definitive, authoritative signal.
      *   **Overcoming Preference & Precedent:** The state acted *against* the expressed preference of the majority (referendum) and existing precedent. It essentially *imposed* a new focal point and created the expectation of universal conformity through law and overwhelming public information.
  *   **Did it Become a Convention Immediately?** Yes, **by Lewis's definition, immediately after Dagen H.** A new regularity (drive right) emerged. Crucially, it was sustained by mutual expectations: Everyone expected everyone else to drive right starting on Dagen H *because* the state had successfully made the switch date, fact, and expectation common knowledge. The legal threat *initiated* the new expectations, but the regularity quickly became self-sustaining through those very expectations. The law receded into the background, becoming part of the precedent upholding the new convention (like traffic laws generally do).
  *   **The Referendum's Meaning:** The 83% vote *against change* is best interpreted not as a preference *for left-driving itself*, but as a **preference for maintaining the existing coordination equilibrium** due to fear of disruption, switching costs (e.g., modifying/replacing vehicles), and risk aversion. It revealed the strength of the *preference for coordination* over the potential *payoff improvement* of switching, highlighting the power of lock-in and the perceived costs of transition. Voters prioritized avoiding the temporary chaos of transition over the long-term benefits of the superior equilibrium.

  **4. Evolutionary Angle: Could it Happen Organically?**
  *   **Evolutionary Models & Predictions:**
      *   **Best-Response Dynamics:** Drivers play best response to the *current* population behavior. In a near-universal Left equilibrium, the best response is always "Drive Left." Small, local deviations (e.g., a town near Norway trying Right) would be punished by collisions and quickly die out. Best-response alone predicts **stasis** – the inferior equilibrium is stable.
      *   **Risk-Dominance vs. Payoff-Dominance:** Right-driving was likely **Payoff-Dominant** (higher benefit if coordinated). Left-driving, due to its entrenchment and the sheer size of the conforming population, was almost certainly **Risk-Dominant** (safer bet if unsure what others will do). Evolutionary models often predict risk-dominant equilibria are selected, especially with noisy play, locking in Left.
      *   **Stochastic Stability:** Models incorporating random mutations (e.g., drivers accidentally or experimentally driving right) predict that over a *very long time*, the system might transition to the payoff-dominant equilibrium. However, the costs of "mutant" behavior (accidents) are high, the population is vast, and interaction neighbourhoods are sticky (drivers interact locally but are constrained by national infrastructure and law). The **switching costs** (changing signs, modifying vehicles/buses) are massive and "lumpy" – requiring coordinated investment. These factors make spontaneous, system-wide migration to the payoff-dominant equilibrium **extremely improbable** within any reasonable timeframe without state coordination and investment.
  *   **Silence/Weakness:** These models excel at explaining stability and slow, stochastic drift. They are poor at modeling rapid, system-wide shifts driven by **centralized authority** capable of simultaneously altering the expectations and behaviors of *all* agents and investing in necessary infrastructure changes. Dagen H required a non-evolutionary actor: the state.

  **5. Residue Report: What the Theory Cannot See**
  *   **Symbolic/Identity Dimension (Unpopularity):** **Significant.** Lewis's framework treats conventions as solutions to practical coordination problems. The intense opposition to Dagen H, despite its practical benefits, suggests adherence to left-driving held **symbolic value** tied to national identity, tradition, or resistance to perceived outside pressure (neighbors/Europe). This affective, non-instrumental dimension falls outside the purely instrumental, payoff-based logic of Lewis and standard evolutionary game theory.
  *   **Psychology of Risk Perception (Temporary Accident Drop):** **Relevant.** The immediate post-switch safety improvement was likely amplified by heightened **caution and attention** (psychology) from drivers navigating the new system, rather than *solely* the game-structural improvement of the new convention. Lewis's framework captures the structural efficiency of coordination but not the behavioral nuances of *learning* or *risk perception* during transition. The return to baseline accident rates supports this psychological interpretation.
  *   **Multiple Conventions & Populations (Rail Traffic):** **Crucial.** The persistence of left-hand rail traffic demonstrates that "traffic convention" is not monolithic. **Distinct populations** (road users vs. rail operators/passengers) with **separate infrastructure** and **different coordination needs** (e.g., visibility for train drivers, coupling mechanisms) can maintain distinct conventions. Lewis's framework easily handles this – they are separate coordination games – but Dagen H highlights the error in *assuming* a nation has a single "driving convention." Road and rail conventions decoupled precisely because they involved different agent groups and coordination dynamics.

  **Conclusion: Anomaly that Stretches the Framework**

  Dagen H is **primarily an anomaly for Lewis, but one that productively stretches his framework rather than refuting it.**

  *   **Confirmation:** It powerfully confirms Lewis's core insights: Driving side is a coordination problem par excellence; conventions depend on mutual expectations and common knowledge; precedents sustain equilibria; the arbitrariness condition (viable alternatives) holds.
  *   **Anomaly:** It exposes key limitations:
      1.  **Suboptimal Persistence:** Lewis downplays how inferior conventions can persist due to lock-in, even when a superior alternative exists – a point later evolutionary theory addresses more directly.
      2.  **Role of the State:** Lewis's model cannot explain rapid, wholesale convention change driven by top-down *authoritative decree* manufacturing common knowledge and salience against majority preference. This requires incorporating the state as a unique actor capable of restructuring expectations and payoffs at scale.
      3.  **Beyond Instrumentalism:** The case reveals non-instrumental (symbolic, identity-based) motives for convention adherence that Lewis's rational-choice framework overlooks.
  *   **Verdict:** Lewis's framework provides the essential tools to *understand* the coordination problem Dagen H addressed and *how* the new convention stabilized. However, it **never anticipated** the specific mechanism of change – state-led, instantaneous re-coordination against popular will – nor fully accounted for the possibility of a *known* Pareto-inferior convention persisting for structural reasons. Dagen H demonstrates the necessity of supplementing Lewis with theories of the state, institutional change, path dependence, and social psychology to fully explain such episodes. It confirms the framework's core while highlighting the need for its extension.
