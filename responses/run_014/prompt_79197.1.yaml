answer: |-
  Here's a systematic reconstruction and evaluation of the philosophical commitments underlying each regime, distinguishing core presuppositions from compatible elements, identifying tensions, and assessing coherence:

  **I. The Nordic Model (Criminalize Purchase, Decriminalize Sale)**
  *   **Core Presuppositions:**
      *   **Agency Asymmetry:** Sellers are presumed victims of structural forces (poverty, gender inequality, trafficking, addiction), lacking true voluntariness/capacity for consent in the *institution* of prostitution. Buyers exercise exploitative agency.
      *   **Location of Wrongdoing:** Wrongdoing resides *solely* in the act of purchase. The purchase constitutes exploitation (taking advantage of presumed vulnerability/complex coercion) and perpetuates systemic harm.
      *   **Nature of Harm:** The harm is intrinsically tied to the gendered commodification of bodies and sexuality. It degrades women *as a class* (even if an individual seller reports no harm), reinforces patriarchal structures, and fuels trafficking/demand. Harm is primarily *social/systemic*.
      *   **Buyer Culpability Theory:** Primarily **Complicity in Systemic Harm & Exploitation:** Buyers are culpable for perpetuating a harmful, exploitative system and for taking advantage of individuals deemed vulnerable within that system. Secondary justification: **Perfectionism** – sex *should not* be commodified; its exchange for money is inherently degrading or violates its intrinsic meaning.
  *   **What It Strictly Requires:** Criminalization of purchase; decriminalization of sale (as non-culpable victim); criminalization of coercion/trafficking/minors/pimping/procuring.
  *   **What It Fits With (But Doesn't Require):** Strong social welfare support for exit programs; radical feminist theory; abolitionist goals (reducing demand to shrink/eliminate the industry).
  *   **Philosophical Underdetermination Points:** The model *could* be justified by strong perfectionist views alone (commodification is intrinsically wrong), even without a strong victimhood narrative, though its policy focus on vulnerability leans heavily towards the exploitation/systemic harm view.
  *   **Internal Inconsistency?** Apparent: Why decriminalize the seller if the *act itself* is intrinsically harmful/commodifying? **Dissolution:** The inconsistency dissolves if the core harm is located in the *purchase* (driving demand, exploitation) and the *system* it perpetuates. The seller's act is seen as a constrained response within that harmful system, not a freely chosen, culpable act. The seller is harmed *by* the system/transaction, not culpable *for* it.
  *   **Defender's Likely Concession:** Tension exists between viewing the seller as a victim-lacking-agency and the practical need for sellers to possess *some* agency to navigate legal protections or exit programs. Radical feminists might argue this reflects the *constrained* agency inherent in oppression.

  **II. Legalization Model (Germany/Netherlands - Brothel Licensing, Registration, Condom Mandates)**
  *   **Core Presuppositions:**
      *   **Commodified Sex as Manageable Work:** Sex work *is* work involving commodification, but this commodification is not inherently catastrophic or uniquely degrading *if properly regulated*. It can be managed like other risky/service occupations.
      *   **State's Role:** To minimize harms (STIs, violence, exploitation, trafficking) through structured oversight, not moral judgment. Regulation is a *pragmatic harm reduction* strategy.
      *   **Paternalistic Protectionism:** Sex work is an *inherently risky* occupation requiring *specific* state protections (registration, mandatory health checks, condom mandates) that exceed those in most other jobs due to the intimate/sexual nature and associated stigma/vulnerability to violence/STIs.
      *   **Formalization = Control/Safety:** Bringing the industry "above ground" via licensing and registration enhances state control, reduces criminal influence, improves working conditions, and facilitates taxation.
  *   **What It Strictly Requires:** Legalization of buying/selling/brothels; licensing/registration schemes; specific health/safety regulations (like condom mandates); criminalization of coercion/trafficking/minors/unlicensed operation; likely some form of pimping/procuring prohibition outside the licensed structure.
  *   **What It Fits With (But Doesn't Require):** Liberal views on commodification; harm reduction pragmatism; acceptance of regulated markets; potentially viewing sex work as "a job like any other" *in principle*, but not in regulatory practice.
  *   **Philosophical Underdetermination Points:** The regulatory apparatus (registration, condom mandates) could be justified by either 1) *Pure Harm Reduction Pragmatism* (this minimizes disease/violence best) or 2) *Implicit Moral Exceptionalism* (sex work *is* uniquely degrading/dangerous, necessitating special controls, even if legal). The model doesn't definitively settle this.
  *   **Internal Inconsistency?** **Yes:** The tension between treating sex work as "work" and subjecting it to uniquely intrusive regulations (mandatory registration, specific health mandates not applied to, say, fishermen or massage therapists facing different risks). This reveals an **unresolved tension in the commodification premise.** If it's truly "work like any other," why the special registry and state-mandated condom use? The justification relies on inherent risk/vulnerability, implicitly treating it as *not* entirely ordinary.
  *   **Defender's Likely Concession:** Defenders would readily concede the model treats sex work as *higher risk* than office work, justifying specific OHS rules, but might argue this doesn't fundamentally undermine its status as labor. However, the *mandatory registration of individual workers* (unlike most jobs) is harder to square with pure "ordinary work" and leans towards exceptionalism/control.

  **III. Decriminalization Model (New Zealand - Repeal of Soliciting/Brothel-Keeping Laws, Treated as Ordinary Work)**
  *   **Core Presuppositions:**
      *   **Sex Work as Labor:** Sex work is fundamentally a form of labor. Workers are agents capable of consent and deserving of standard labor rights and protections.
      *   **Harm Reduction via Normalization:** The primary harms stem from *criminalization and stigma*, not the work itself. Decriminalization removes police harassment, enables reporting of crimes/exploitation, and allows collective bargaining, maximizing worker safety and agency.
      *   **State's Role:** To ensure standard employment law, health & safety regulations (applied generically), and criminal law (against coercion, violence, trafficking) apply equally, *not* to specially regulate or morally supervise the industry.
      *   **Agency & Consent:** Adults engaging in consensual commercial sex are presumed capable agents. Coercion is a separate crime.
  *   **What It Strictly Requires:** Repeal of laws specifically targeting prostitution (soliciting, brothel-keeping); application of standard employment, contract, health & safety, and criminal laws; criminalization of coercion/trafficking/minors.
  *   **What It Fits With (But Doesn't Require):** Strong labor rights perspectives; libertarian views on bodily autonomy; harm reduction focused on state non-interference; sex-positive feminism.
  *   **Philosophical Underdetermination Points:** The prohibition on pimping/procuring could be framed as preventing *exploitation* (compatible with labor rights) or as a residual moral judgement. The model's core logic leans towards the former.
  *   **Internal Inconsistency?** **Yes, Glaringly:** The **migrant worker exclusion**. If sex work is ordinary labor and workers are agents, banning legally present migrant workers based solely on visa status is philosophically incoherent. It contradicts the core labor/agency premise.
      *   **Does the Inconsistency Dissolve? No.** Defenders might offer pragmatic justifications (trafficking concerns, political compromise), but this reveals the model remains vulnerable to viewing sex work as a *special category* where the state *can* legitimately control participation in ways unacceptable for other jobs (e.g., banning migrants from construction). It demonstrates that even under decriminalization, sex work is *not* fully normalized in practice or political perception.
  *   **Defender's Likely Concession:** Defenders would likely concede the migrant exclusion is a politically expedient compromise (often linked to immigration policy anxieties about trafficking) that *contradicts the model's core principles*. It's widely criticized within the decriminalization movement as a major flaw.

  **Evaluation of Coherence: Harm, Agency, State Role**

  *   **Most Coherent:** **Decriminalization (New Zealand) - *despite the migrant flaw*.** Its core commitments are logically intertwined and internally consistent *on paper*: recognition of agency → labor rights framework → state applies generic laws without moral exceptionalism → harm reduction via removing criminalization. It offers the clearest, most principled view of worker agency and the most limited, rights-based role for the state regarding the *nature* of the work itself. The harm reduction strategy flows directly from its core premises. The migrant exclusion is a severe practical/political contradiction, but it's an *add-on* concession, not a core philosophical tenet. The underlying framework remains robust.
  *   **Least Coherent:** **Legalization (Germany/Netherlands).** It embodies the most significant *unresolved tension* between its stated goal (recognizing sex work as work) and its *practice* (imposing uniquely intrusive regulations like mandatory individual registration and specific condom mandates). This reveals an implicit, unstated presupposition that sex work *is* morally or physically exceptional, requiring paternalistic state control that wouldn't be acceptable for other "ordinary" risky jobs. The commodification is accepted only under a heavy regulatory regime that undermines the "ordinary work" claim. Its harm reduction is pragmatic but philosophically muddled on the core questions of agency and commodification.
  *   **Middle Coherence:** **Nordic Model.** Its presuppositions (asymmetrical agency, systemic harm located in purchase) are internally coherent *within its own radical feminist/abolitionist framework*. If you accept its premises about systemic harm and gendered exploitation, criminalizing buyers while decriminalizing sellers is logically consistent. Its perfectionist streak regarding commodification adds another layer of justification. However, it faces the practical tension regarding seller agency and relies on a specific, contested view of the harm inherent in the transaction itself, which many find paternalistic. Its coherence is high within its paradigm but that paradigm is narrower and more contested than decriminalization's core labor-rights framework.

  **Conclusion:** While all models exhibit tensions, the **New Zealand Decriminalization model** possesses the most coherent *set of core commitments* regarding harm (primarily stemming from criminalization/stigma, reduced by normalization), agency (workers as consenting agents entitled to labor rights), and state role (applying general laws, avoiding special moral regulation). Its fatal flaw (migrant exclusion) is a politically imposed inconsistency, not an inherent philosophical one. The **German/Dutch Legalization model** suffers the deepest *internal* philosophical inconsistency by simultaneously claiming to normalize sex work as labor while regulating it in uniquely intrusive ways that presuppose its exceptionalism. The **Nordic Model** is coherent within its specific, contested worldview but relies on presuppositions about agency and systemic harm that significantly limit individual seller autonomy and define wrongdoing in a way many find overbroad or perfectionist.
