  The user specifically wants: 1) Implicit philosophical foundations for each model 2) Distinction between what each regime strictly requires versus what it accommodates 3) Identification of philosophical underdetermination points 4) Internal inconsistency analysis 5) My evaluation of which has most/least coherent commitments.

