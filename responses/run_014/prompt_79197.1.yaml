  My evaluation: New Zealand's model has the strongest coherence on agency/labor rights but is severely undermined by the migrant exclusion. The Nordic model is philosophically coherent in its radical feminist framing but risks paternalism. Legalization feels most internally conflicted - its regulatory apparatus often recreates the stigma it claims to reduce.

