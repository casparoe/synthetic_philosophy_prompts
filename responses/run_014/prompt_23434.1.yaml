    "anumāna": {"rating": 5, "justification": "Inferential reasoning based on universal relations is a distinct and irreducible process."},
    "upamāna": {"rating": 4, "justification": "Opponents reduce it to a combination of śabda (for the analogy) and pratyakṣa (for the recognition)."},
    "śabda": {"rating": 4, "justification": "Critics argue that testimony is reducible to anumāna by inferring the reliability of the source."},
    "arthāpatti": {"rating": 3, "justification": "Commonly reduced to anumāna as a form of inferential reasoning from contradiction."},
    "anupalabdhi": {"rating": 2, "justification": "Rivals reduce it to pratyakṣa (as perception of absence) or anumāna (inferring absence)."}
  }

  Note: In the justifications, we are naming the pramana to which it is reduced by critics, if applicable.
