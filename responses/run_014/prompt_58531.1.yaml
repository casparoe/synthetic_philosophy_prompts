  Hmm, I need to create an original thought experiment for a political philosophy seminar about political obligation and civil disobedience. The user wants me to think step by step as a political philosopher specializing in democratic theory. 

  First, I consider the specifications carefully: it must be set in a realistic municipal context like water rationing, feature a character named Maya who avoids net benefit and voluntary acceptance, while the scheme remains reasonably just. Her civil disobedience must be public, nonviolent, and protest a specific exemption. Crucially, the fair-play principle should imply no obligation breach, while natural duty theory should find pro tanto wrongdoing.

  I brainstorm some candidate setups that don't work:
  - A library late-fee protest fails because library benefits are hard to avoid completely.
  - A park curfew protest where Maya grows her own food might still involve indirect benefits.
  - A neighborhood composting mandate where Maya uses private services - this comes closest but voluntary acceptance might be arguable.

  For the final scenario, I settle on water rationing during drought. Maya invests in rainwater harvesting and greywater systems to be fully independent, while protesting an agricultural exemption. This satisfies all requirements: she genuinely takes no net benefit, withholds acceptance, and the scheme remains fair overall. Her protest targets a legitimate but debatable exemption.

  In analysis:
  - Fair-play finds no obligation because she meets all three exemption conditions (no benefit, no acceptance, no unfair burden).
  - Natural duty still finds pro tanto wrongdoing because she's undermining a reasonably just institution.

  The decisive feature is her complete benefit-avoidance. If removed, fair-play would find obligation; if natural duty ignored benefit, it would become overdemanding. 

  I anticipate objections:
  - Fair-play defenders might argue her water security depends on communal aquifer protection.
  - Natural duty critics might say her protest actually supports justice by improving the scheme.

  This creates the required theoretical tension while staying grounded in municipal realism. The rainwater/greywater setup makes her independence credible, and the agricultural exemption provides a plausible protest target that doesn't undermine overall scheme justice.
answer: |-
  ### Candidate Setups Considered and Rejections:
  1. **Urban Noise Ordinance Protest:** Maya violates a nighttime construction ban to protest exemptions for city-sanctioned festivals. *Rejection:* Fails on "no net benefit" – all residents benefit from baseline noise reduction, making avoidance implausible.  
  2. **Public Transit Fare Evasion:** Maya refuses to pay fares to protest discounted rates for tourists, arguing it burdens locals. *Rejection:* Violates "withheld voluntary acceptance" – using transit infrastructure inherently implies acceptance, even if she walks sometimes.  
  3. **Zoning Law Violation:** Maya builds an accessory dwelling unit (ADU) illegally to protest exemptions for historic buildings. *Rejection:* Fails "reasonably just scheme" – historic exemptions may be integral to justice, making protest target too systemic.  

  ---

  ### Final Scenario (158 words):
  In Riverdale, a severe drought prompts democratically enacted water rationing: households may use 200 gallons/day, enforced by smart meters with fines for excess. The scheme includes a contested exemption permitting farms 50% higher rations to preserve local agriculture, though burdens (e.g., shorter showers, brown lawns) are distributed fairly among residents. Maya, an environmental engineer, has spent years and significant resources making her home fully water-independent: she collects rainwater, recycles greywater, and sources drinking water from a licensed private aquifer unaffected by municipal supplies. She publicly declares non-cooperation, publishes op-eds, and deliberately exceeds her ration by watering a native-plant garden to protest the farm exemption, arguing it prioritizes economic interests over ecological resilience. She invites arrest by refusing fines. Riverdale’s scheme is reasonably just overall, and compliance would cost Maya nothing, but she accepts no benefit from it and explicitly rejects the "social contract" of rationing.

  ---

  ### Analysis of Verdicts:
  **1. Fair-Play Principle: No Obligation Breached**  
  Fair-play requires *knowing benefit*, *voluntary acceptance*, and *fair burden-sharing*. Maya:  
  - Receives **no net benefit**: Her private systems render municipal water irrelevant; she gains nothing from others’ restraint.  
  - **Withholds acceptance**: Explicitly rejects the scheme’s legitimacy and derives no utility from it.  
  - Bears **no unfair burden**: Compliance imposes no cost, but non-participation negates burden-sharing entirely.  
  → *No obligation exists to obey, so disobedience breaches nothing.*  

  **2. Natural Duty of Justice: Pro Tanto Wrong**  
  The duty binds individuals to support reasonably just institutions *regardless of benefit/acceptance*, barring unreasonable costs. Here:  
  - Riverdale’s scheme is **reasonably just**: Democratically enacted, fair burdens, no emergencies.  
  - Maya’s disobedience **undermines the institution**: Publicly flouting rules weakens compliance norms, especially given the scheme’s justice.  
  - **No unreasonable cost**: Obeying is costless for her.  
  → *Disobedience breaches the duty to support just institutions, making it pro tanto wrong* (even if protest is justified by reforming the exemption).  

  ---

  ### Decisive Feature, Reversals, and Objections:  
  **Decisive Feature:** *Maya’s complete avoidance of net benefits from the cooperative scheme.*  
  - **Why decisive:** Fair-play exempts non-beneficiaries; natural duty binds all subject to just institutions.  

  **If Feature Removed (Maya benefits):**  
  - Fair-play: Obligation arises (she benefits + scheme fair).  
  - Natural duty: Verdict unchanged (duty persists).  

  **If Feature Reversed (Maya harms scheme):**  
  - Fair-play: Still no obligation if no benefit.  
  - Natural duty: *Unreasonable cost* might exempt her if disobedience prevents harm.  

  **Strongest Objections:**  
  - **Fair-Play Defender:** "Maya *indirectly* benefits from communal stability (e.g., property values protected by rationing), implying tacit acceptance."  
    → *Rebuttal:* Stability isn’t a *good* of the *water scheme*; her independence severs material reliance.  
  - **Natural Duty Defender:** "Her protest *strengthens* justice by improving the scheme, fulfilling the duty better than blind compliance."  
    → *Rebuttal:* The duty prioritizes compliance; reform must use democratic channels, not unilateral violation.  

  This forces students to confront whether obligation stems from reciprocity (fair-play) or moral membership (natural duty), highlighting core tensions in democratic theory.
