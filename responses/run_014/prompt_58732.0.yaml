prompt: |-
  This term I am responsible for a seventy-five minute workshop within a second-year undergraduate module on multinational democracy, with twenty-two students who have just spent two weeks comparing devolution and independence debates in Scotland, Catalonia, and Quebec. I want them to move beyond rehearsed arguments for and against independence and to feel from the inside the difficulty that there is no democratically neutral way to decide who constitutes the people entitled to decide, since any choice of franchise, threshold, and territorial unit already shapes the result and invites further claims from minorities within the putative new state.

  To prevent the session from becoming a proxy argument about the real cases, I plan to have them work with an invented federation I can sketch on a handout: the province of Sorvane, with about 1.2 million inhabitants, a Sorvane-speaking majority of roughly fifty-seven percent concentrated outside the mixed capital city of Brennor, a northern mining valley whose employment depends on national subsidies, and a southern island hosting a naval installation and a distinct dialect community. The task for the groups, representing the provincial government, the capital city council, the valley municipalities, the islanders, and the federal government, will be to negotiate the terms of a proposed independence referendum and then live with the consequences through at least one round of sub-unit response.

  Please design a complete, runnable exercise around this scenario that lets the recursive boundary problem emerge through the decisions themselves rather than through any introductory lecture. Include a minute-by-minute timeline that fits the seventy-five minutes, concise role briefs with divergent interests and private instructions, precise rules for proposing and voting on franchise, majority threshold, and sequencing of votes, a mechanism by which a subunit that loses can call a further vote on its own status, and a structured debrief that connects specific moments in the play to the conceptual distinction between deciding within a demos and deciding who the demos is. Also advise me on what is likely to misfire on a first run with undergraduates unfamiliar with role play and how to handle it, and identify candidly one central feature of actual secessionist politics that this format cannot reproduce and that I must therefore supply in closing commentary.
reasoning: |-
  We are designing a 75-minute workshop for 22 students. The goal is to let students experience the recursive boundary problem in democratic decision-making about secession. We will use an invented federation (Sorvane) and assign roles to groups. The groups are:
   1. Provincial Government of Sorvane (pro-independence)
   2. Capital City Council (Brennor, mixed, may have complex interests)
   3. Northern Valley Municipalities (mining, dependent on national subsidies)
   4. Southern Islanders (naval base, distinct dialect)
   5. Federal Government (opposed to independence)

   The exercise will have two main phases:
   Phase 1: Negotiating and voting on the rules for the independence referendum (franchise, threshold, and territorial unit). 
   Phase 2: After the vote, allowing a subunit that is unhappy to call its own independence vote (recursive problem).

   We need to design:
   - A timeline that fits 75 minutes.
   - Concise role briefs with private instructions.
   - Rules for proposing and voting on the referendum terms.
   - A mechanism for subunits to call their own votes.
   - A structured debrief.

   Timeline (75 minutes total):
   0-5 min (5 min): Introduction and group assignment. Distribute role briefs. Explain the goal is to negotiate the terms of the referendum and then live with the consequences. Emphasize that they should stay in role and avoid discussing real-world cases.

   5-20 min (15 min): Group preparation. Each group reads their brief and prepares their positions and arguments for the negotiation.

   20-45 min (25 min): Negotiation phase. Representatives from each group (one or two per group) come to the center (or a designated negotiation table) to discuss and try to agree on the terms of the referendum. The terms to decide are:
      a. Franchise: Who gets to vote? (e.g., residents of Sorvane only? including non-citizens? excluding non-resident citizens? etc.)
      b. Threshold: What majority is required? (e.g., 50%+1, 55%, 60%, etc.)
      c. Territorial unit: Is the vote for the whole province? or should there be separate votes in different regions?

   45-55 min (10 min): Voting on the terms. If they agree, they vote on the package. If not, the Provincial Government (as the one proposing the referendum) can put forward a proposal and they vote. The voting rules for this phase: 
      - Each group gets one vote (so 5 votes total). 
      - Majority of groups (3 out of 5) must support the proposal for it to pass.
      - If no agreement, the Provincial Government can impose a unilateral referendum (but this will have consequences in the next phase).

   55-65 min (10 min): Referendum outcome and subunit reaction. 
      - The facilitator (instructor) will announce the referendum result based on the rules agreed and the demographic breakdown (the instructor has the data and will calculate the outcome). 
      - The result can be either independence or status quo, but we can pre-set it to independence for the sake of the exercise (to trigger the next phase) OR let the rules and the groups' actions lead to a result (but we need to control for time). 
      - Then, a subunit that is unhappy (e.g., the Northern Valley or the Southern Island) can call for their own independence vote (to stay with the federation). The rules for this are: they must have a majority in their own council (i.e., the group representing them) to call the vote. Then, they must set the terms for their own referendum (franchise, threshold, and territorial unit for their own region). This is done quickly by the subunit group without negotiation (because of time). 

   65-70 min (5 min): Second referendum outcome. The facilitator announces the result of the subunit vote (again, pre-set to show the recursion, e.g., the Northern Valley votes to stay with the federation, thus seceding from an independent Sorvane).

   70-75 min (5 min): Structured debrief. The instructor connects the experience to the concept.

   However, note: We have 22 students. We can divide into 5 groups of roughly 4-5 students each.

   Revised timeline to account for group work and negotiation:

   0-5 min: Introduction (5 min)
   5-20 min: Group preparation (15 min)
   20-45 min: Negotiation (25 min) - each group sends 1-2 representatives to a central negotiating table. The rest of the group can observe and pass notes.
   45-50 min: Voting on the terms (5 min) - if they don't agree, the Provincial Government can impose (but this will anger others).
   50-55 min: Announce the referendum rules and then the outcome (5 min) - we set the outcome to independence (to trigger the next phase) because that's the point of the exercise. We can use the demographic data to show how the rules affected the outcome.

   But note: we need to set up the demographics so that the result depends on the rules. For example:
     - Total population: 1.2 million
     - Sorvane-speaking majority (57%) is concentrated outside the capital. So if the franchise is restricted to Sorvane speakers, independence wins easily. But if the franchise includes everyone in the province (including non-Sorvane speakers in the capital and the island), then it might be close.

   We can pre-calculate:
     - Without the capital, the Sorvane-speaking areas might have a majority for independence. But the capital is mixed and might be against. The Northern Valley (mining) is dependent on federal subsidies and might be against. The Southern Island might be split.

   To save time, we will pre-set the outcome to independence, but we can adjust the rules to show how they matter.

   Alternatively, we can have the instructor calculate the outcome on the spot based on the rules and the following data:

     Population breakdown:
     - Total: 1.2 million
     - Capital City (Brennor): 400,000 (40% Sorvane-speaking, 60% other - mostly federal language speakers)
     - Rest of Sorvane (non-capital): 800,000 (70% Sorvane-speaking => 560,000, 30% other => 240,000)
     But note: the groups are:
        - The non-capital part includes:
            Northern Valley: 200,000 (mostly non-Sorvane speaking, dependent on federal subsidies, so against independence)
            Southern Island: 100,000 (distinct dialect, but let's say 60% Sorvane-speaking? so 60,000 for, 40,000 against? but they might be swayed by the naval base which is federal)
            The rest: 500,000 (mostly Sorvane-speaking, pro-independence)

     So if franchise is all residents of the province:
          Pro-independence: 
            Capital: 40% of 400,000 = 160,000
            Non-capital: 560,000 (from the rest) + 60,000 (island) = 620,000? But wait, the non-capital rest (500,000) is not broken down. Let me redefine:

     Better breakdown:
        - Capital: 400,000 -> 160,000 pro (Sorvane speakers) + 240,000 against
        - Northern Valley: 200,000 -> 20,000 pro (if there are some Sorvane speakers) and 180,000 against -> let's say 10% pro -> 20,000 pro, 180,000 against
        - Southern Island: 100,000 -> 60,000 pro (60% Sorvane) and 40,000 against
        - Other non-capital (rural Sorvane heartland): 500,000 -> 90% pro -> 450,000 pro, 50,000 against

     Total pro-independence: 160K (cap) + 20K (valley) + 60K (island) + 450K (heartland) = 690,000
     Total against: 240K (cap) + 180K (valley) + 40K (island) + 50K (heartland) = 510,000

     So with universal franchise, pro wins with 57.5% (690/1200) -> meets 50%+1.

     But if the franchise is restricted to Sorvane speakers only:
          Total Sorvane speakers: 57% of 1.2M = 684,000
          Pro-independence among Sorvane speakers: 
            Heartland: 450,000 (all Sorvane speakers are pro) 
            Capital: 160,000 (pro) 
            Valley: 20,000 (pro) 
            Island: 60,000 (pro) 
          Total pro: 450+160+20+60 = 690,000 -> but that's the same as above? 

     Actually, the anti-independence Sorvane speakers are negligible? We have to assume that Sorvane speakers are overwhelmingly pro. So if franchise is only Sorvane speakers, then pro wins 100%? 

     Alternatively, let's adjust: 
          In the valley, the Sorvane speakers are few and may be divided. But for simplicity, we can say that in the valley, only 20,000 are Sorvane speakers and they are pro, but the rest are against and not Sorvane speakers so they can't vote. Then the vote would be:
            Pro: 160K (cap) + 20K (valley) + 60K (island) + 450K (heartland) = 690,000
            Against: only Sorvane speakers who are against? We haven't defined any. So it's 690,000 to 0? 

     This is too simplistic. Let me redefine the anti-independence Sorvane speakers:

     We can have:
          Capital: 160,000 Sorvane speakers: 100,000 pro, 60,000 against? (so not unanimous)
          Valley: 20,000 Sorvane speakers: 10,000 pro, 10,000 against?
          Island: 60,000: 40,000 pro, 20,000 against? 
          Heartland: 450,000: 400,000 pro, 50,000 against? 

     Then total pro among Sorvane speakers: 100+10+40+400 = 550,000
     Against: 60+10+20+50 = 140,000

     So if franchise is only Sorvane speakers, pro wins 550,000 vs 140,000 (79.7%).

     But if franchise is extended to all residents, then we have:
          Pro: 550,000 (Sorvane pro) + ??? non-Sorvane might be against, but are they allowed to vote? In universal franchise, they are. So:
          Non-Sorvane speakers: total population 1.2M - 684,000 = 516,000
          We assume non-Sorvane speakers are against independence: 
              Capital: 240,000 against (non-Sorvane) + 60,000 Sorvane against = 300,000 against in capital? 
              Actually, in capital: non-Sorvane: 240,000 against, and Sorvane: 100,000 pro and 60,000 against -> so capital: 100,000 pro, 300,000 against.
          Similarly:
              Valley: non-Sorvane: 180,000 against, Sorvane: 10,000 pro, 10,000 against -> valley: 10,000 pro, 190,000 against.
              Island: non-Sorvane: 40,000 against, Sorvane: 40,000 pro, 20,000 against -> island: 40,000 pro, 60,000 against.
              Heartland: non-Sorvane: 50,000 against, Sorvane: 400,000 pro, 50,000 against -> heartland: 400,000 pro, 100,000 against.

          Total pro: 100K (cap) + 10K (valley) + 40K (island) + 400K (heartland) = 550,000
          Total against: 300K (cap) + 190K (valley) + 60K (island) + 100K (heartland) = 650,000

          Then pro loses: 550,000 vs 650,000 -> 45.8%.

     So the rules matter: if franchise is only Sorvane speakers, independence wins easily. If franchise is universal, it loses.

     We can let the groups negotiate and then the instructor will calculate the outcome based on their rules. But to save time, we can pre-announce that the outcome will be determined by the rules they set and the instructor has the data. We don't want to spend time calculating during the workshop.

     Alternatively, we can fix the outcome to be independence if they set Sorvane-only franchise, and status quo if universal, and then trigger the subunit vote.

     Since time is tight, we can do:

     After they set the rules, the instructor says: "Based on the rules you have set and the demographic data of Sorvane, the referendum result is [independence/status quo]." And we set it to independence if they set Sorvane-only franchise, and status quo if universal. If they set something in between, we can decide arbitrarily.

     But note: we want independence to happen to trigger the subunit vote. So we can ensure that by having the Provincial Government push for Sorvane-only franchise and if they get it, we announce independence. If they don't, we can still announce independence by having the Provincial Government impose the rules (if we allowed that in the voting phase) and then they set Sorvane-only and we get independence.

     So in the voting phase: if the groups fail to agree, the Provincial Government can unilaterally set the rules (as per their brief). They will set Sorvane-only franchise and 50%+1 threshold, and then the vote will be for the whole province. Then we get independence.

   55-60 min: Announce the referendum outcome (independence) and then ask the subunits (Northern Valley, Southern Island, and even the Capital) if they want to call their own vote. 

   60-65 min: One of the subunits (e.g., Northern Valley) calls a vote. They must set the rules for their own referendum (quickly, by their group). They will set the franchise and threshold for their own region (e.g., all residents of the valley) and vote to secede from Sorvane and remain with the federation. 

   65-67 min: The instructor announces the result of the subunit vote (they vote to secede) -> so now the valley is independent from Sorvane and remains with the federation.

   67-75 min: Debrief (8 minutes? but we have to end at 75, so 8 minutes). 

   However, we have to be flexible. Let me adjust the timeline to make the debrief longer.

   Revised timeline:

   0-5: Intro
   5-20: Group prep (15 min)
   20-40: Negotiation (20 min) [shortened by 5 min]
   40-45: Voting on terms (5 min)
   45-50: Announce referendum result (independence) (5 min)
   50-55: Subunit reaction and call for vote (5 min) -> Northern Valley group decides to hold a vote and sets rules (they can do this quickly in 2 minutes, then the instructor takes 3 minutes to announce the result of their vote: they secede from Sorvane and stay with the federation).
   55-75: Debrief (20 min) -> this is important.

   Now the debrief is 20 minutes. We can structure it:

     - Ask each group: How did you feel about the process? (2 min)
     - Then focus on key moments: 
          - When you were setting the franchise, what were the trade-offs? How did that feel? (2 min)
          - When the subunit called its own vote, what did that reveal? (2 min)
     - Then connect to the concept: 
          - The recursive boundary problem: any decision about who the people are is itself a political decision that lacks democratic legitimacy because it is prior to the demos. (5 min)
          - Highlight that the same problem appeared at two levels: first at the provincial level, then at the valley level. 
          - How did the rules (franchise, threshold) shape the outcome? (5 min)
          - Why is there no neutral way? (2 min)
     - Then, the instructor can note one central feature of actual secessionist politics that the exercise couldn't capture (e.g., the role of violence, international recognition, economic realities) and mention that in closing.

   Now, the role briefs:

   Provincial Government of Sorvane:
     - You represent the majority Sorvane-speaking population and have won the last election on a platform of independence. 
     - Your goal: achieve independence for the entire province of Sorvane.
     - You want a referendum with rules that maximize the chance of a "yes" vote: 
          - Franchise: only Sorvane speakers (or at least, residents for at least 5 years and able to speak Sorvane) 
          - Threshold: simple majority (50%+1)
          - Territorial unit: the whole province as one unit.
     - Private: If the negotiation fails, you have the power to unilaterally call a referendum with your preferred rules. But doing so may cause unrest and lead to subunits breaking away.

   Capital City Council (Brennor):
     - The capital is a mixed city with a large population that speaks the federal language. Your economy depends on being the bridge between Sorvane and the federation. 
     - You are worried that independence might harm the city's economy and cause ethnic tensions. 
     - You prefer:
          - Franchise: all residents of the province (including non-Sorvane speakers) because that would reduce the chance of independence.
          - Threshold: a supermajority (e.g., 60%) to ensure broad support.
          - Territorial unit: if the province votes for independence, the capital should have the right to opt-out and remain with the federation.
     - Private: If the province becomes independent, you will push for a special status for the capital or even a separate vote.

   Northern Valley Municipalities:
     - Your economy depends on federal subsidies for mining. Without the federation, your mines would close and unemployment would soar.
     - You are against independence and want to remain in the federation.
     - You prefer:
          - Franchise: all residents (because non-Sorvane speakers are common in the valley and are against independence).
          - Threshold: supermajority (60%) and/or a double majority (majority in the province and majority in the valley).
          - Territorial unit: the valley should be a separate unit so that if the province votes for independence, the valley can vote to remain with the federation.
     - Private: If the province becomes independent, you will immediately call for a vote in the valley to secede from Sorvane and rejoin the federation.

   Southern Islanders:
     - You have a distinct dialect and culture. You host a federal naval base, which provides jobs and security. 
     - You are divided: some want independence to preserve Sorvane culture, but others fear losing the naval base and the economic benefits.
     - You prefer:
          - Franchise: all residents of the province? but you also want protection for your distinct community.
          - Threshold: a supermajority (e.g., 55%) to ensure stability.
          - Territorial unit: the island should be a separate unit so that you can decide your own fate regardless of the province.
     - Private: If the province becomes independent, you might call for your own independence vote to become a separate territory within the federation or an independent state.

   Federal Government:
     - You oppose the independence of Sorvane because it would set a precedent for other regions and weaken the federation.
     - You want to avoid independence, or at least minimize the loss of territory.
     - You prefer:
          - Franchise: all citizens (including those living outside Sorvane) and/or all residents? (but non-resident citizens are likely to be against independence because they are integrated in the federation) -> but this might be controversial. Alternatively, you push for all residents and a supermajority.
          - Threshold: a high supermajority (60% or 66.7%) and a requirement of majority in every major region (capital, valley, island, and heartland) to prevent a simple majority from imposing on minorities.
          - Territorial unit: the province as a whole, but with the condition that if any subunit votes against, it can remain with the federation.
     - Private: You can offer financial incentives to the valley and the island to remain. But you cannot use force. You must work within the democratic process.

   Rules for the negotiation and voting:

     - Each group sends two representatives to the negotiation table. The rest of the group can pass notes to their representatives.
     - The negotiation is moderated by the instructor (who keeps time and ensures they stay on track).
     - The terms to negotiate: franchise, threshold, and territorial unit (and any other rule they think of, but these are the main ones).
     - After negotiation, they vote on the package. Each group has one vote. They need 3 out of 5 to pass. 
     - If they fail, the Provincial Government can impose the rules (as per their private instruction). The imposed rules will be: franchise=Sorvane speakers (defined as those who can pass a language test), threshold=50%+1, territorial unit=the whole province.

     For the subunit vote (after independence is declared):
          The Northern Valley group (or any subunit) can call a vote by a majority of their group (they are the council). They set the rules for their own referendum: franchise (all residents of the valley), threshold (50%+1), and then vote. The instructor announces: the valley votes 90% to remain with the federation (because they are dependent on subsidies). 

     Then the debrief.

   What might misfire:
     - Students might not engage in role play. Solution: give them clear roles with interests and private instructions. Encourage them to argue based on their role.
     - The negotiation might get stuck. Solution: the instructor can remind them of time and the possibility of unilateral action by the Provincial Government.
     - The calculation of the referendum result might be complex. Solution: pre-set the outcome based on the rules they choose (as explained above) to avoid on-the-spot calculation.
     - Students might focus too much on the invented scenario and not see the broader point. Solution: the debrief must explicitly connect to the recursive boundary problem.

   One central feature of actual secessionist politics that the format cannot reproduce:
     - The role of violence, intimidation, and historical grievances. In reality, secessionist movements often involve non-democratic elements, such as armed conflict, external intervention, and deep-seated animosities. Our exercise is purely procedural and democratic, which abstracts from these real-world complexities.

   In the closing commentary, the instructor should note that in reality, the ability to hold a peaceful, agreed referendum is rare and often overshadowed by power politics, economic pressures, and sometimes violence. The exercise shows the logical problem of democratic boundaries, but real-world cases are often messier.

   Let me write the role briefs concisely.

   Role Briefs (one per group, with private instruction at the bottom):

   Provincial Government of Sorvane:
     You are the elected government of Sorvane. Your party campaigned on independence and won a majority. You believe that the Sorvane-speaking majority has the right to self-determination. 
     Goals:
        - Hold a referendum on independence and achieve a "yes" vote.
        - Ensure the territorial integrity of Sorvane (no subunit can break away).
     Preferred Referendum Rules:
        - Franchise: Only Sorvane speakers (or those who pass a language test).
        - Threshold: Simple majority (50%+1).
        - Territorial Unit: The entire province as one unit.
     Private: If the other groups block an agreement, you can unilaterally call the referendum with your preferred rules. But this may lead to unrest and secessionist movements in the subunits.

   Capital City Council (Brennor):
     Brennor is the capital, a diverse city with a large non-Sorvane speaking population. You fear independence would harm the economy and cause ethnic tension.
     Goals:
        - Avoid independence, or at least secure a special status for the capital.
     Preferred Referendum Rules:
        - Franchise: All residents of the province (to reflect the diverse population).
        - Threshold: Supermajority (60%) to ensure broad support.
        - Territorial Unit: The province as a whole, but if independence passes, the capital should have the right to opt out.
     Private: If independence is declared, you will push for a separate referendum in the capital to remain with the federation.

   Northern Valley Municipalities:
     Your mining-dependent region relies on federal subsidies. Independence would be an economic disaster.
     Goals:
        - Remain part of the federation at all costs.
     Preferred Referendum Rules:
        - Franchise: All residents (your non-Sorvane speakers are numerous and against independence).
        - Threshold: Supermajority (60%) and a requirement of a majority in the valley too.
        - Territorial Unit: The valley should be a separate unit so it can remain with the federation even if the province leaves.
     Private: If the province votes for independence, you will immediately hold a referendum in the valley to secede from Sorvane and rejoin the federation.

   Southern Islanders:
     You have a distinct dialect and culture. The naval base provides jobs and security. You are divided on independence.
     Goals:
        - Protect your cultural identity and economic interests.
     Preferred Referendum Rules:
        - Franchise: All residents of the province? but you also want to ensure the island's voice is heard.
        - Threshold: 55% to ensure stability.
        - Territorial Unit: The island should be a separate unit so you can decide your own future.
     Private: If independence is declared, you might hold your own referendum to become a separate territory within the federation or independent.

   Federal Government:
     You represent the federation. You want to prevent independence and maintain territorial integrity.
     Goals:
        - Avoid Sorvane's independence, or at least minimize the loss (keep the valley and island).
     Preferred Referendum Rules:
        - Franchise: All residents and non-resident citizens (who are likely against independence).
        - Threshold: High supermajority (66.7%) and majority in every major region.
        - Territorial Unit: The province as one unit, but any subunit that votes against independence can remain in the federation.
     Private: You can offer financial incentives to the valley and island to remain, but cannot use force.

   Rules for the subunit vote:
     - Any subunit that wishes to secede from an independent Sorvane must hold a referendum in their own territory. 
     - The rules for that referendum are set by the subunit's council (i.e., the group). They decide franchise and threshold. 
     - The vote is then taken by the subunit group (the whole student group) by show of hands: they are to vote according to their role (so the Northern Valley group will vote to secede). The instructor then announces the result.

   This should run within the time. The instructor must be active in moderating the negotiation and keeping time.

   Let me write the minute-by-minute:

   0-5: Introduction
        - Explain the scenario of Sorvane and the goal: negotiate a referendum and then live with the consequences.
        - Assign groups (5 groups of 4-5 students). Distribute role briefs (one per group, plus private instruction at the bottom that only they see).

   5-20: Group Prep (15 min)
        - Groups read their brief and prepare their strategy for negotiation. They choose two representatives.

   20-40: Negotiation (20 min)
        - Representatives meet at the central table. The instructor moderates: "You have 20 minutes to agree on the rules for the referendum: franchise, threshold, and territorial unit. Remember, if you cannot agree, the Provincial Government will impose the rules."
        - The representatives negotiate. The instructor can circulate and prompt if they get stuck.

   40-45: Voting on the Agreement (5 min)
        - The instructor asks: "Do you have an agreement?" If yes, each group (via their representative) votes yes or no. They need 3 yes votes to pass.
        - If no agreement, the instructor says: "The Provincial Government will now impose the rules: franchise limited to Sorvane speakers, threshold 50%+1, and the whole province as one unit."

   45-50: Announce Referendum Result (5 min)
        - Instructor: "Based on the rules [state the rules], the referendum result is: independence wins. Sorvane is now independent."
        - Then: "This outcome may be contested by some regions. Each subunit now has the right to react."

   50-55: Subunit Reaction (5 min)
        - The instructor asks: "Does any subunit wish to hold their own independence vote?"
        - The Northern Valley group (and possibly others) will raise their hand. The instructor says: "The Northern Valley has decided to hold a referendum to secede from Sorvane and remain with the federation. The Valley group, quickly set the rules for your referendum (franchise and threshold)."
        - The Valley group decides (in 2 minutes) and tells the instructor. They will likely set: franchise=all residents of the valley, threshold=50%+1.
        - The instructor then announces: "The vote in the Northern Valley: 95% vote to secede from Sorvane and rejoin the federation."

   55-75: Debrief (20 min)
        - Start with reactions: "How did that feel? What was frustrating?" (2 min)
        - Focus on the rule-making: "How did the choice of franchise and threshold become a tool for different groups?" (5 min)
        - Highlight the recursion: "When the valley held its own vote, what did that say about the first vote? Who gets to decide the boundaries?" (5 min)
        - Connect to the concept: "This illustrates the recursive boundary problem: there is no neutral way to define the demos. The rules that define who votes are already political and shape the outcome." (5 min)
        - Finally, note the limitation: "In reality, secessionist conflicts often involve factors beyond procedure, such as violence, economic pressure, and international politics. This exercise isolated the procedural difficulty to show how even in a purely democratic setting, the problem of defining the people is intractable." (3 min)

   This should fit. Good luck!
answer: |-
  ### Complete Workshop Design: "The Sorvane Secession Negotiation"

  **Pedagogical Goal:** Experience the recursive boundary problem (the "who decides who decides?" dilemma) through procedural decisions in a simulated independence referendum.

  ---

  ### **Timeline (75 Minutes Total)**
  | Time  | Phase                          | Key Activities                                                                 |
  |-------|--------------------------------|-------------------------------------------------------------------------------|
  | 0-5   | **Introduction**               | Frame workshop goals; assign roles; establish scenario. No conceptual lecturing. |
  | 5-15  | **Group Preparation**          | Groups read briefs; strategize based on secret instructions.                  |
  | 15-40 | **Negotiation Phase**          | Representatives debate referendum rules (franchise, threshold, sequence).     |
  | 40-50 | **Voting & Outcome**           | Vote on rules package; facilitator announces province-wide result.            |
  | 50-60 | **Recursive Secession Phase**  | "Losing" subunit calls own referendum; votes on its status.                   |
  | 60-75 | **Structured Debrief**         | Connect gameplay to democratic theory.                                        |

  ---

  ### **Role Briefs (5 Groups)**
  *(Hand out with private "red text" instructions)*

  1. **Provincial Government**  
     *Public Goal:* Achieve Sorvane independence.  
     *Interests:* Maximize "yes" votes; keep territory intact.  
     *Secret Instruction:* *"If negotiation deadlocks, unilaterally declare a referendum with only Sorvane speakers voting (50%+1 threshold)."*

  2. **Brennor Capital City Council**  
     *Public Goal:* Protect multicultural capital’s economy.  
     *Interests:* Avoid domination by rural Sorvane speakers; seek opt-out clause.  
     *Secret Instruction:* *"If independence passes, demand Brennor become a federal city. Threaten to call your own referendum."*

  3. **Northern Valley Municipalities**  
     *Public Goal:* Block independence to retain federal mining subsidies.  
     *Interests:* Ensure valley-specific vote; high thresholds.  
     *Secret Instruction:* *"If independence passes, immediately call a vote to secede from Sorvane and rejoin the federation."*

  4. **Southern Islanders**  
     *Public Goal:* Protect naval base jobs and dialect.  
     *Interests:* Neutral on independence; demand island veto power.  
     *Secret Instruction:* *"If outvoted, declare neutrality. If pressured, align with the federation to protect the base."*

  5. **Federal Government**  
     *Public Goal:* Preserve federation; limit independence momentum.  
     *Interests:* Require supermajorities; include non-resident voters.  
     *Secret Instruction:* *"Offer Valley/Island financial incentives to oppose independence. Veto unilateral referendums."*

  ---

  ### **Rules of Engagement**
  1. **Proposing Rules:**  
     - Groups submit written proposals for:  
       - **Franchise**: *Options: Residents only (default), Sorvane speakers only, include non-resident citizens.*  
       - **Threshold**: *Options: 50%+1 (default), 55%, 60%, 2/3 majority.*  
       - **Sequence**: *Options: Single province vote, regional votes first, capital opt-out vote.*  
     - Bundled as one package. Amendments require seconder.

  2. **Voting Protocol:**  
     - Each group has 1 vote.  
     - Package passes with 4/5 approval (forcing compromise).  
     - If deadlocked after 10 mins, Provincial Gov’t invokes secret instruction.

  3. **Recursive Secession Mechanism:**  
     - Any subunit (Valley, Island, Brennor) with ≥75% group support can call a new referendum.  
     - Rules set by subunit (no external approval).  
     - Subunit votes internally (e.g., Valley group votes 90% to secede).  

  ---

  ### **Facilitator’s Script**
  - **Referendum Outcome Logic:**  
    - *Universal franchise:* Independence fails (anti: Brennor + Valley > pro: rural Sorvane + partial Island).  
    - *Sorvane-only franchise:* Independence passes (57% pro).  
    - Announce outcome at 40-min mark based on *actual rules agreed*.

  - **Recursive Phase Trigger:**  
    - After province result, ask: *"Does any subunit wish to challenge this outcome?"*  
    - Northern Valley always invokes secession (per secret instruction).

  ---

  ### **Structured Debrief (15 Minutes)**  
  1. **Experience Reflection (4 mins):**  
     - *"What frustrated you most? When did you feel the rules were unfair?"*  
     - *(Listen for: franchise exclusion, threshold manipulation, subunit defiance)*

  2. **Conceptual Connection (6 mins):**  
     - **Key Question:** *"Who decided *who* should vote? How did that shape the result?"*  
     - **Link to Theory:**  
       > *"When the Federal Gov’t pushed for non-resident voters or the Valley demanded a regional vote, they weren’t just debating procedure—they were fighting over who *counts* as the people. Deciding the demos is never neutral; it predetermines outcomes."*  
     - **Highlight Moments:**  
       - Franchise debate = defining political membership.  
       - Valley’s secession = recursion ("who decides the deciders?").  

  3. **Limitation & Real-World Context (5 mins):**  
     - **Candid Gap:** *"This simulation ignores power asymmetries. In reality, independence movements face state coercion (e.g., military), economic blackmail, or international non-recognition. Our clean votes hide how violence and inequality shape these conflicts."*  
     - **Closing Insight:** *"Democracy’s paradox: We need rules to decide, but those rules always favor someone. There’s no neutral starting point—only contested boundaries."*

  ---

  ### **Pitfalls & Mitigation Strategies**  
  1. **Problem:** Students debate Scotland/Quebec, not Sorvane.  
     **Fix:** Interrupt gently: *"In Sorvane, your valley’s mines are closing. How does that shape your stance?"*  

  2. **Problem:** Role-play hesitation.  
     **Fix:** Assign assertive students to Federal/Provincial roles; use secret instructions to force action.  

  3. **Problem:** Negotiation deadlock.  
     **Fix:** Strictly enforce the 10-min rule. Prov Gov’t unilateral move creates productive tension.  

  4. **Problem:** Overly simplistic voting.  
     **Fix:** Require written proposals; remind groups that Brennor/Island can be kingmakers.  

  5. **Problem:** Debrief devolves into anecdote-sharing.  
     **Fix:** Use direct quotes: *"When the Valley said, ‘Why should Brennor decide for us?’, that’s the boundary problem in action."*  

  ---

  ### **Materials**  
  - Handouts: Role briefs + Sorvane map (demographics, economic zones).  
  - Voting slips + timer.  
  - Flip chart to track rule proposals.  

  This design ensures students *experience* the recursive dilemma through procedural conflict, leaving the conceptual heavy lifting for the debrief. The tight timeline forces consequential decisions, and the recursive secession mechanic vividly exposes democratic circularity.
