  Im in a constructive math course and I keep tangling myself up on the disjunction property and the existence property of intuitionistic logic. Can you explain what exactly these properties are — they feel like meta-level statements about which formulas are theorems, not like actual formulas you can prove — and why intuitionistic logic (and Heyting arithmetic) have them but classical logic doesnt, including what they actually tell us about what a proof of A ∨ B or ∃x φ(x) amounts to? I feel like the Curry-Howard "proofs as programs" angle is supposed to make it click but I can't see the connection.

  The part that really bugs me: we can prove (A ∨ B) → (A → C) → (B → C) → C (proof by cases), which lets us use a disjunction without knowing which side it is, but the disjunction property says a closed proof of A ∨ B has to commit to one disjunct. Aren't those in tension, and how do they fit together? (And does just adding excluded middle flat-out destroy these properties, and if so how exactly?)
