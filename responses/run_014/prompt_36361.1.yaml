prompt: |-
  Been reading rationalist blogs since maybe 2010 and one thing I never fully sorted out for myself is when to actually trust the aggregate. The Condorcet jury theorem says: if each voter is better than 50% accurate and votes independently, a big enough majority is right with probability as close to 1 as you want. Fine, the math is fine. But when I go by my actual gut on cases, I'm not sure the theorem is tracking what I care about. Here are my verdicts, tell me if there's a principle that captures them:

  - 500 strangers guessing the weight of an ox: trust the median over any single guess, including mine. Easy.
  - 500 Yelp reviews saying a taqueria is great, vs one foodie friend who's never been there: I go with the crowd. The crowd at least ate the food, my friend is going off vibes.
  - Same 500 reviewers saying a philosophy book is badly written: I trust that way less than the taqueria case. Feels like one person's bias ('philosophy = pretentious') copied 500 times, not 500 separate biases.
  - 10,000 people each right 51% of the time on some hard binary call, fully independent. The math says the majority is right with probability ~1, and I'll grant the math, but in any real version of this I refuse to update much, because 'barely better than chance AND independent' basically doesn't happen in the wild — if 10k people all lean the same way it's almost always because they share an upstream source.
  - A poll average before an election: 20 polls, but with correlated error (same methodologies, same likely-voter screens, shared house effects). I trust the average more than the best single poll, but not 20-polls-worth more — like maybe the equivalent of 5.
  - A prediction market with tons of volume but a few whales doing most of the trading: I discount it hard, even though on paper thousands of participants traded.
  - A Wikipedia deletion debate where 30 editors vote keep but they all belong to the same wikiproject: don't trust it, maybe even update toward delete.
  - Voters each slightly worse than chance (49%), independent: adding voters makes the majority *worse*, so whatever principle I want can't just say 'more opinions = better,' competence has to enter somewhere.

  My tentative principle is something like: trust the aggregate insofar as the errors are independent and each voter is at least a bit better than chance, and scale your trust by the *effective* number of independent opinions, not the raw headcount. But here's the pair I can't square: I trust the crowd on the ox's weight and the taqueria without having any real evidence those people are above chance, while I'd take one mechanic with a great track record on my car over a survey of 500 drivers without hesitating. So maybe the real variable isn't 'competence + independence' at all, it's 'is the error idiosyncratic noise or is there a common cause' — but if it's the common-cause thing, I'm not sure what happens to the competence condition at all, since a shared bias makes everyone's track record look fine until it doesn't.

  So: give me the principle (or a couple of candidates), what each clause is doing for which verdict, what it predicts for the case I keep going back and forth on — two subcultures, each internally super-correlated, with biases in opposite directions; is averaging the two group verdicts good (biases cancel) or bad (you've really only got two data points) — and be honest about which of my verdicts your principle just cannot save.
reasoning: |-
  Okay, the user has been into rationalist blogs since 2010 but can't pin down when to trust aggregated opinions. They've laid out several scenarios where they do or don't trust the crowd, and they're looking for a unifying principle. Let me start by understanding each of their examples.

  First, they trust the median for ox weight guessing and Yelp reviews because the crowd actually interacted with the subject (ate the food, saw the ox). But for the philosophy book, they're skeptical because maybe everyone shares a bias against philosophy being pretentious. That makes sense—common bias reduces independence.

  Then there's the 10,000 people each 51% accurate. Math says trust them, but the user doubts such independence exists in real life. They mention shared upstream sources, which is a valid point. For election polls with correlated errors, they trust the average but only as much as 5 polls, not 20. Prediction markets with whales? They discount it because a few big players dominate. Wikipedia editors from the same project? They don't trust the consensus. And if voters are worse than chance, more voters make it worse. 

  Their tentative principle is about effective independent opinions and competence. But they're stuck on why they trust the ox/taqueria without proof of competence, yet prefer a mechanic over 500 drivers. The key here might be domain-specific competence versus general input. For ox weight, everyone has some baseline ability to guess, but car repair requires expertise. Also, in the taqueria case, the crowd has direct experience (they ate the food), while the foodie friend doesn't.

  The deeper need seems to be a practical heuristic that accounts for real-world correlations and competence without getting bogged down in unmeasurable probabilities. They want something actionable. The common cause vs. idiosyncratic noise distinction is crucial. If errors are idiosyncratic, aggregation helps. If there's a common cause (like shared bias), it doesn't.

  The subcultures example is tricky. Two groups with opposite biases. Averaging might cancel biases, but only if the groups are symmetric. If not, it could amplify errors. The user needs a principle that handles such cases. The effective N concept (adjusting for correlations) seems vital here. Also, considering whether the domain has objective answers (ox weight) versus subjective (book quality) matters.

  In the mechanic vs. drivers case, the mechanic's proven track record trumps the crowd's lack of expertise. Here, individual competence outweighs numbers. So the principle must weigh both competence and independence, but also the nature of the task. Objective tasks with dispersed knowledge benefit from crowds; specialized tasks need experts.

  The user might also be hinting at epistemic humility—knowing when aggregation is reliable versus when it's not. They need a framework that doesn't rely on perfect conditions but adapts to real-world messiness. The proposed principle should handle cases where competence isn't known by using diversity as a proxy. For example, in ox weight, diverse guessers likely have independent errors, while in philosophy reviews, cultural biases correlate.

  Finally, honesty about limitations: the principle might not perfectly handle the subcultures case without knowing bias magnitudes. It also assumes we can estimate correlations, which isn't always possible. But emphasizing effective N and task nature gets close.
answer: |-
  Here's a principle that synthesizes your intuitions, explains your verdicts, handles the subculture case, and reveals its limitations:

  **The Quantified Diversity Principle (QDP):**  
  *Trust aggregated judgments proportional to the **effective number of independent, minimally competent perspectives**, where:*
  1.  **"Minimally Competent"** means having access to *some* relevant signal (not necessarily >50% accuracy), AND
  2.  **"Effective Number"** discounts raw headcount based on the **fraction of variance explained by shared error sources** (systematic bias + correlated noise).  
  *In domains with objective ground truth, "minimal competence" is often assumed absent evidence otherwise. In subjective or specialized domains, it must be demonstrated.*

  **How QDP Explains Your Verdicts:**

  1.  **500 Strangers & Ox Weight:**  
      *   *QDP:* Assumes minimal competence (everyone can see the ox, guesses have *some* signal). Errors are primarily *idiosyncratic* (random guessing variance). High effective N → High trust.  
      *   *Verdict:* Trust median.

  2.  **500 Yelp vs. Vibes-Only Friend:**  
      *   *QDP:* Crowd has direct signal (ate the food) → minimal competence met. Friend has *zero* relevant signal → fails minimal competence. High effective N vs. 0 effective N.  
      *   *Verdict:* Trust crowd.

  3.  **500 Reviews vs. Philosophy Book:**  
      *   *QDP:* "Minimal competence" is dubious (many reviewers may lack taste/context for philosophy, judge purely on "reads like philosophy"). High shared bias risk ("pretentious" meme). **Low effective N** (many correlated errors) → Low trust.  
      *   *Verdict:* Distrust crowd aggregate.

  4.  **10k People @ 51%, "Independent":**  
      *   *QDP:* The core issue is **violation of independence**. Your intuition: "barely >50% *and* independent" is implausible; shared upstream source creates massive correlated error → **effective N <<< 10k** (maybe near 1!). Math assumes independence; reality violates it.  
      *   *Verdict:* Refuse to update.

  5.  **20 Correlated Polls:**  
      *   *QDP:* Shared methodologies/house effects create correlated error. Effective N is **much lower than 20**. Your "equivalent of 5" is an intuitive estimate of effective N. Trust average *because* it reduces *idiosyncratic* pollster noise, but discount heavily for shared error.  
      *   *Verdict:* Trust average moderately (like ~5 polls).

  6.  **Whale-Driven Prediction Market:**  
      *   *QDP:* High volume is misleading. Whales dominate → **Effective N ≈ number of whales** (or their sources). Thousands of participants mostly follow whales/correlation → low effective N.  
      *   *Verdict:* Discount hard.

  7.  **30 Editors from One Wikiproject:**  
      *   *QDP:* Extreme group affiliation → very high shared bias risk (groupthink, mission bias). **Effective N ≈ 1** (the group consensus). Aggregate reveals group bias, not truth → potentially update *against* it.  
      *   *Verdict:* Distrust, maybe update opposite.

  8.  **49% Accurate Voters:**  
      *   *QDP:* Explicitly violates "minimally competent" (net harmful signal). QDP requires *some* positive signal. Adding more harmful signals makes things worse, regardless of independence.  
      *   *Verdict:* More voters make it worse. Principle explicitly excludes this case via competence clause.

  **The Mechanic vs. 500 Drivers Puzzle:**  
  *   *QDP Explanation:* Here, "minimal competence" is **domain-specific**. Guessing ox weight requires only eyesight & intuition → crowd plausibly competent. Diagnosing your car requires specialized knowledge/skill → most drivers lack "minimal competence" (signal is near zero or negative). The mechanic has **demonstrated high individual competence** (great track record). QDP trusts competence *over* raw numbers when minimal competence of the crowd is absent. You trust the ox/taqueria crowd *because* you assume basic sensory competence exists, while you *don't* assume auto-repair competence exists in random drivers.

  **The Subcultures Case (2 Oppositely Biased Groups):**  
  *   *QDP Prediction:* **It depends on the magnitude of the biases and the symmetry.**  
      *   *IF* the biases are roughly equal in magnitude and opposite → Averaging *can* work well! The shared biases cancel, leaving the underlying signal. Effective N might be low (2 groups), but the cancellation reduces the shared error variance significantly. *(Good outcome: Biases cancel).*  
      *   *IF* the biases are strong but *not* symmetric → Averaging gives a **biased result reflecting the stronger group's influence or the average bias**. Effective N is still very low (2 data points). *(Bad outcome: You've only got two points, and the average is wrong).*  
      *   *QDP Verdict:* Averaging *can* be beneficial for bias cancellation **if** you have reason to believe the biases are symmetric and strong relative to the signal. Otherwise, be cautious – effective N is low. **This is the edge case where QDP requires external knowledge about bias symmetry to give a clear answer.**

  **What QDP Cannot Save (Honesty Time):**  
  *   **The Gut Trust in Ox/Taqueria Without Proof:** QDP *assumes* minimal competence exists for simple sensory/experiential tasks. This is pragmatic but philosophically shaky. Your "gut" does this intuitively; QDP formalizes the *type* of task where this assumption is usually safe. If you later learned the ox guessers were blindfolded or the Yelpers were bots, QDP would correctly tell you to distrust (minimal competence violated).  
  *   **Precise Quantification of "Effective N" and "Shared Variance":** QDP relies on intuitive/estimable concepts ("lots of shared bias", "probably symmetric groups"). Getting precise numbers is often impossible. It's a *framework for reasoning*, not a calculator.  
  *   **The 10k @ 51% "In the Wild" Intuition:** QDP explains *why* you distrust (low effective N due to implausible independence), but your deep skepticism that "barely better than chance AND independent" *ever* exists is a meta-prior about the world, not derivable from QDP alone. QDP agrees with applying that meta-prior to reject the independence assumption.

  **In Summary:**  
  QDP captures your core insight: **Trust depends on the *diversity-adjusted signal strength* of the group.** It emphasizes:
  1.  **Signal Access:** Does each "voter" have *any* relevant information/signal? (Minimal Competence)
  2.  **Error Diversity:** Are their errors mostly random and unique, or driven by common causes? (Effective N via shared variance discount).
  3.  **Domain Context:** Is minimal competence *plausible* by default (objective/sensory tasks) or must it be *demonstrated* (subjective/specialized tasks)?

  This principle explains your verdicts, handles the mechanic/driver distinction via domain-specific competence, provides a nuanced answer for the subcultures case (conditional on bias symmetry), and is honest about its reliance on intuitive estimates of competence and correlation. Its power lies in shifting focus from raw numbers and theoretical accuracy to the *structure of information and error* within the group.
