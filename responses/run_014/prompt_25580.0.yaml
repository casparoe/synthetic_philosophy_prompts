prompt: |-
  ok so i'm trying to get clear on the material constitution debate before i dive into the literature — statue and clay, tibbles the cat, ships of theseus, all that. what i want is the desiderata: what does a theory of material constitution actually have to get right to count as adequate? i mean the cases it has to handle (and which are edge cases people can reasonably disagree about), the distinctions it can't collapse (like constitution vs identity, or sortal differences), the logical constraints it has to respect (leibniz's law is in the room), and any results from metaphysics or logic it can't contradict. for each desideratum, give me the case or consideration that motivates it. then flag which ones are non-negotiable and which are more like preferences of particular camps (the nihilist, the universalist, the coincident-objects person, etc.). and if some subset of these desiderata are jointly unsatisfiable — like you literally can't have all of them at once given some constraint — that's the part i most want to see. skip the scorecard of existing theories, i'll do that myself.
reasoning: |-
  Okay, the user is diving into material constitution and wants a clear list of desiderata before hitting the literature. They mentioned classic cases like the statue and clay, Tibbles, and the Ship of Theseus. Their main request is to identify what a theory must get right, what distinctions it should maintain, logical constraints, and any contradictions in the desiderata.

  First, I need to outline the core requirements. The user wants the non-negotiables versus the camp-specific preferences. Let me start with Leibniz's Law since it's fundamental. The motivation here is the Statue and Clay case—same location, same properties, yet intuitively different. So preserving Leibniz's Law is key, but it leads to problems if the statue and clay are considered distinct but coincident.

  Next, spatiotemporal coincidence. The statue and clay share the same space and time, so any theory must handle that. But if two objects can share all properties and location, how do they differ? Sortal persistence conditions come in here. The clay can survive squashing, but the statue can't. That's a distinction that needs explaining.

  Constitution vs. identity is another big one. If they're identical, then they share all properties, but persistence conditions differ. That's a problem under Leibniz's Law. So theories must either deny identity (coincident objects) or deny that persistence conditions are properties (perdurantism maybe?).

  Temporal intrinsics are tricky with Theseus's ship. The original planks versus the reassembled ship. How can they be identical if they have different histories? This challenges the idea that objects have temporal parts or that identity can be maintained through change.

  Existence intuitions: We believe both the statue and clay exist. But nihilists deny composite objects, which clashes with common sense. Universalists accept everything, leading to too many objects. Balancing ontology with intuition is tough.

  The big tension is between Leibniz's Law, spatiotemporal coincidence, and distinctness. If two objects are in the same place at the same time and share all properties, how are they different? Yet we feel the statue isn't the clay. Some theories reject distinctness (identity view) or modify Leibniz's Law (sortal-relative properties).

  Another conflict: persistence conditions and coincidence. If the statue and clay have different survival conditions, they must be distinct. But if they're distinct and coincident, how do they share all properties? Perdurantism avoids this by having temporal parts, but that complicates persistence.

  The user also wants to know which desiderata are non-negotiable. Logical consistency and Leibniz's Law are must-haves. Spatiotemporal coincidence and existence intuitions might be flexible depending on the camp. For example, nihilists reject composite objects, so they don't have coincident entities at all.

  I should also mention gunk and simples. If the world is gunky, nihilism might be in trouble. But that's more of a theoretical constraint than a core desideratum.

  Highlighting the joint unsatisfiability is crucial. The Statue/Clay case shows that Leibniz's Law, coincidence, distinctness, and property differences (like persistence) can't all hold. Any theory has to give up one. That's the heart of the debate.

  I need to ensure each desideratum is explained with its motivating case, and clearly flag which are contested. Avoid listing theories; focus on the requirements and tensions. The user wants to map the landscape themselves later.
answer: |-
  Here's a breakdown of the core desiderata for a theory of material constitution, structured as requested. The fundamental tension lies in balancing seemingly intuitive commitments about objects, their properties, and their persistence, which the classic cases expose as potentially conflicting.

  **Core Desiderata & Their Motivations:**

  1.  **Preserve Leibniz's Law (Indiscernibility of Identicals):**
      *   **What:** If object A is identical to object B, then A and B must share *all* properties (including relational, temporal, modal, and sortal-relative properties) without exception.
      *   **Motivation:** Fundamental logical principle. Violation leads to contradiction (A = B & A ≠ B). The **Statue and Lump (Goliath/Lumpl)** case directly challenges this: If the statue *is* the lump, how can they have different persistence conditions (the lump can survive being squashed, the statue cannot)? If they aren't identical, how do they share *so many* properties (location, mass, shape, color, subatomic particles)?
      *   **Status:** **Non-Negotiable (logical constraint).** Any theory must either uphold it strictly or provide a compelling, non-ad-hoc account of why apparent violations (like differing persistence conditions) aren't *genuine* property differences threatening identity.

  2.  **Account for Spatiotemporal Coincidence:**
      *   **What:** Explain how two distinct material objects (like the statue and the lump *at the time they coincide*) can occupy exactly the same region of space at the same time.
      *   **Motivation:** Intuitive starting point of the **Statue and Lump** case. We perceive a single spatially located "thing" but seem forced (by other desiderata) to acknowledge two distinct objects co-located there. Also arises in **Tibbles the Cat** (Tibbles and Tib, the tail-complement) when the tail is attached.
      *   **Status:** **Negotiable (major fault line).** *Coincidentalism* accepts it as a brute fact or explains it. *Identity Theories* deny distinct coincident objects. *Nihilism* denies composite objects exist at all. *Universalism* often generates *many* coincident objects. While intuitive for some cases, denying coincidence altogether is a live option for some theories.

  3.  **Respect Sortal Persistence Conditions:**
      *   **What:** Different kinds of objects ("sortals") have different essential properties and different conditions under which they can persist through change. A statue cannot survive being squashed into a ball; a lump of clay can. A cat cannot survive the annihilation of all its parts; a mereological sum might.
      *   **Motivation:** **Statue and Lump** (surviving squashing). **Ship of Theseus** (What constitutes the *same ship*? The continuously repaired ship? The reassembled original planks? Both?). **Tibbles the Cat** (Does the cat survive tail loss? Does the tail-complement survive tail loss?).
      *   **Status:** **Highly Desirable (core intuitive datum), but interpretation is contested.** All theories need to account for why we *think* persistence conditions differ. Non-Negotiables must explain it without violating Leibniz's Law. *Identity Theorists* must argue persistence conditions aren't genuine properties or that our intuitions are wrong. *Coincidentalists* use them to distinguish objects. *Nihilists/Universalists* may recast them as conditions for concept application rather than object existence.

  4.  **Maintain the Distinction Between Constitution and Identity:**
      *   **What:** Constitution ("is made of", "coincides with") should not be collapsed into strict numerical identity ("is the very same thing as").
      *   **Motivation:** **Statue and Lump** seems paradigmatic: the statue is *made of* the clay, but they aren't *identical* because they have different histories (maybe the lump pre-existed the statue), different futures (the statue could be destroyed while the lump persists), and crucially, different persistence conditions. Collapsing them makes explaining differing persistence conditions under Leibniz's Law extremely difficult.
      *   **Status:** **Negotiable (central debate).** *Coincidentalism* champions this distinction. *Identity Theories* (like some versions of *Dominant Kind* or *Temporal Parts*) explicitly collapse constitution into identity. *Nihilism* avoids the issue by denying composites. *Universalism* often embraces coincidence, maintaining the distinction.

  5.  **Accommodate Existence Intuitions:**
      *   **What:** Our strong pre-theoretical intuitions that statues, lumps of clay, cats, and ships *exist* as distinct, unified objects.
      *   **Motivation:** **All cases.** We talk about "the statue," "the clay," "Tibbles," "the Ship of Theseus" as real things that have properties, undergo changes, and persist. A theory that says only atoms exist (*Nihilism*) or that every arbitrary fusion exists (*Universalism*) seems deeply counterintuitive.
      *   **Status:** **Negotiable (major fault line).** *Common-Sense Realism/Coincidentalism* takes these as primary data. *Nihilism* explicitly denies these intuitions for composites. *Universalism* accepts *more* objects than intuition recognizes. *Identity Theories* may deny the intuition that coincident objects are distinct. While powerful, these intuitions *can* be overridden by theoretical considerations (simplicity, logical consistency).

  6.  **Resolve Temporal Puzzles Without Arbitrariness:**
      *   **What:** Provide a principled account of persistence through part replacement and reassembly that doesn't rely on arbitrary stipulation.
      *   **Motivation:** **Ship of Theseus.** Which object is the *original* ship after gradual replacement and reassembly? Rival claims seem equally valid. Theories need a non-arbitrary criterion for persistence (spatiotemporal continuity, causal connectedness, form, dominant parts, etc.) and must explain why the rival candidate *isn't* the original (or why both are, or why neither is).
      *   **Status:** **Highly Desirable (test case for persistence).** All theories must address it. Solutions vary widely (e.g., *Perdurantism*'s temporal parts, *Endurantism* with sortal-dependence, *Universalism* accepting both candidates). No solution is universally accepted as non-arbitrary.

  7.  **Account for Temporal Intrinsics (if endorsing Endurance):**
      *   **What:** If objects persist by being "wholly present" at different times (Endurance), explain how an object can have incompatible intrinsic properties (e.g., being straight and bent) at different times without contradiction.
      *   **Motivation:** Changes like bending a pipe cleaner. An intrinsic property (shape) changes over time. How can the *same wholly present object* instantiate incompatible shapes? This pressures Endurantist theories of constitution.
      *   **Status:** **Negotiable (depends on theory of persistence).** Primarily a challenge for *Endurantist* theories (common in constitution debates). *Perdurantists* avoid it by having temporal parts with different properties. Solutions involve time-indexing properties ("bent-at-t1") or adverbial modification ("bends-ly"), which some find ad-hoc.

  8.  **Cohere with Mereological Principles (Optional but Relevant):**
      *   **What:** Be consistent with chosen axioms of mereology (the theory of parts and wholes), like Unrestricted Composition (Universalism), only restricted composition, or Nihilism.
      *   **Motivation:** **Tibbles** involves parthood relations. **Universalist** solutions to **Ship of Theseus** rely on unrestricted composition. **Nihilism** is defined by mereological nihilism. The **Gunk Argument** (if matter is infinitely divisible, there are no simples, challenging Nihilism) shows mereology constraining ontological options.
      *   **Status:** **Contextual.** A theory *must* be consistent with *its own* mereological commitments. The *choice* of mereological principle (e.g., Universalism vs. Nihilism) is a major theoretical commitment influencing the approach to constitution, but not a *desideratum* imposed from outside.

  **The Crucial Tensions & Joint Unsatisfiability:**

  The core problem of material constitution arises because a subset of these desiderata, motivated by the **Statue and Lump** case, appear **jointly unsatisfiable** under plausible assumptions:

  1.  **Leibniz's Law (Non-Negotiable):** A = B only if they share all properties.
  2.  **Spatiotemporal Coincidence (Intuitive):** Statue (S) and Lump (L) coincide at t.
  3.  **Distinctness (Intuitive):** S ≠ L (because they have different persistence conditions/histories/futures).
  4.  **Property Difference (Intuitive):** S and L have different properties (e.g., *can survive being squashed at t*: L has it, S lacks it).

  **The Conflict:**

  *   (2) & (3) imply there are two distinct objects, S and L, in the same place at the same time.
  *   (4) says S and L differ in their properties.
  *   (1) (Leibniz's Law) says that if S and L differ in *any* property, they cannot be identical. This is satisfied by (3).
  *   **However:** If S and L coincide at t (2), they seem to share *all* their intrinsic and extrinsic properties *at t* (same location, same mass, same shape, same color, same subatomic particles, same spatial relations). Where is the property difference *at t* that justifies (3) and (4) without contradicting the observed coincidence? The key difference is *modal* or *temporal* (persistence conditions, origins, destinies). But are these genuine properties of the objects *at t*? If they are, then (1) seems violated by (2) & (3) because coincident objects share all properties *at t*. If they aren't genuine properties *at t*, then what grounds the distinctness (3) and difference in persistence conditions (4)?

  **How Theories Break the Deadlock (Illustrative, not exhaustive):**

  *   **Identity Theory (Deny 3):** S = L. There's only one object. Differences in persistence conditions are either illusory, relativized to sortals (not genuine properties of the *object*), or explained away (e.g., under Perdurantism, different temporal stages have different properties). *Gives up Distinctness.*
  *   **Standard Coincidentalism (Deny Property Sharing at t):** S and L are distinct, coincident objects at t. They share many properties (mass, location) but differ in their *modal* or *sortal-essential* properties (e.g., *being essentially a statue* vs. *being essentially clay*). They have different *de re* modal properties *at t*. *Relies on modal/sortal properties being genuine, non-relational properties at t that don't violate Leibniz's Law when differing.*
  *   **Perdurantism (4Dism):** S and L are distinct spatiotemporal worms. They share a common temporal stage (temporal part) at t. That stage instantiates all the same intrinsic properties *at t*. The differing persistence conditions are properties of the *whole worms*, not of the shared temporal part *at t*. Distinctness (3) is maintained without violating Leibniz's Law *for the temporal part at t* because the whole worms aren't located at t in the same way the part is. *Relocates the property difference.*
  *   **Nihilism (Deny 2 & 3 for Composites):** There is no statue (S) and no lump (L), only simples arranged statue-wise and simples arranged lump-wise. "Survives squashing" is a predicate true of some arrangements but not others, not a property of composite objects. *Avoids coincidence and distinctness of composites entirely.*
  *   **Universalism:** Accepts S, L, *and* the object that is S+L (the "fusion"), all coinciding at t. They are distinguished by having different parts at other times or by differing modal properties. *Accepts coincidence and distinctness but multiplies entities.*
  *   **Relativize Identity (Radical):** S and L are identical relative to one set of conditions/sortals but distinct relative to another. *Challenges the absolute nature of identity and Leibniz's Law as usually understood.*

  **Summary of Negotiability:**

  *   **Non-Negotiable:** Leibniz's Law (though its application to modal/sortal properties is contested).
  *   **Highly Contentious (Core Fault Lines):** Spatiotemporal Coincidence of Distinct Objects, Constitution ≠ Identity, Accommodating Existence Intuitions (for ordinary objects).
  *   **Important but Framework-Dependent:** Respecting Sortal Persistence Conditions (how they are respected varies), Resolving Temporal Puzzles, Accounting for Temporal Intrinsics (for Endurantists), Cohering with Mereology.
  *   **Camp Preferences:**
      *   *Coincidentalist:* Accepts 2, 3, 4, 5. Must carefully define properties to uphold 1.
      *   *Identity Theorist:* Rejects 3 (and often 2 for distinct objects). Upholds 1 strictly, may downplay 4/5.
      *   *Nihilist:* Rejects 2, 3, 5 (for composites). Upholds 1, avoids puzzles by denying composites.
      *   *Universalist:* Often accepts 2 & 3 (for many objects), upholds 1 by distinguishing objects via parts/modal properties, fully embraces 8 (Unrestricted Composition), may stretch 5.
      *   *Perdurantist:* Relocates the problem via temporal parts, can fit with Coincidentalism or Identity.

  The **Statue and Lump** case throws the core tension (LL + Coincidence + Distinctness + Property Difference) into sharpest relief. Any theory must resolve this tension by rejecting or reinterpreting at least one of these intuitive commitments. This is the engine driving the material constitution debate. Good luck diving into the literature – you're armed with the map of the minefield!
