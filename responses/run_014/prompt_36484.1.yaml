prompt: |-
  I'm currently taking an upper-level seminar on the philosophy and governance of AI, and for my final paper I want to defend a research agenda rather than produce another survey. The topic is debate as a mechanism for scalable oversight: the proposal that two AI systems, or two instances of the same system, should argue for opposing answers in front of a human judge (or a weaker AI acting as judge), on the theory that adversarial pressure makes claims easier to evaluate than to produce, so that verification stays cheap even as generation becomes expensive. My sense is that a lot of adjacent work quietly assumes this scheme works, and that which open question gets settled first matters enormously for whether that assumption is earned. What I'd like from you is a prioritized list of open questions, with the ordering defended, not just asserted.

  Here are the candidates I've noticed so far, though I'd welcome additions: (1) whether debate presupposes that arguments can be decomposed into steps a bounded judge can check one at a time, given the worry that some falsehoods are obfuscated -- hiding inside long chains whose individual steps look individually acceptable and only mislead jointly; (2) whether the boundedness of the judge is a bug to be engineered around or the entire point of the scheme, since if the judge had to be unboundedly capable to follow the debate, the protocol would have achieved nothing; (3) whether cross-examination between the debaters can substitute for the judge's own capacity to check claims, or whether it merely relocates the verification burden; (4) whether debate requires that at least one debater be able to find the right answer, or whether the adversarial format can extract truth that neither side possesses; (5) how the scheme degrades when debaters can model and exploit the judge's biases, since a persuasive liar with a good model of the judge may beat an honest debater with a poor one; and (6) whether the recurring analogy to adversarial legal systems is load-bearing or misleading, given that legal procedure tolerates a substantial rate of wrong verdicts as the price of other goods.

  To fix what the prioritization is for: imagine advising a small theory group — roughly five philosophers and logicians with two years of funding, no empirical ML resources — whose goal is to determine whether debate-style oversight is trustworthy enough to rely on for evaluating proposals that exceed unaided human competence. Rank the questions by that goal, and be explicit about the criteria you're using: how much downstream work depends on the answer, tractability with a priori methods rather than experiments, how neglected each question is relative to its importance, and whether settling it would actually change a deployment decision or merely satisfy curiosity. Where the criteria conflict, say so and explain which you let win and why. Please also flag which of my six candidates is most overrated — which one, if answered tomorrow, would change the least — and whether there's an important question I've missed entirely, particularly ones that arise when the two debaters are copies of the same underlying system rather than independently trained models. Finally, tell me what kind of development over the next few years would move each item up or down your list, so the agenda isn't static. I care more about the reasoning connecting the ranking to the criteria than about the ranking itself, since that connection is what my paper needs to defend.
reasoning: |-
  We are prioritizing open questions for a research agenda on debate as a mechanism for scalable oversight. The goal is to advise a small theory group (5 philosophers/logicians, 2 years funding, no ML resources) on whether debate is trustworthy for evaluating proposals beyond unaided human competence.

  Criteria for prioritization:
  1. Downstream impact: How much other work depends on the answer? High dependency -> higher priority.
  2. Tractability with a priori methods: Can we make progress with philosophical/logical analysis, without experiments? High tractability -> higher priority for this group.
  3. Neglectedness: Is the question understudied relative to its importance? High neglectedness -> higher priority.
  4. Deployment relevance: Would settling the question change a deployment decision? If yes, higher priority.

  We have six candidate questions and will consider additions. We must also identify the most overrated (if answered, changes the least) and note any missing important questions, especially regarding same-system debaters.

  Prioritized list (with reasoning) and then addressing the other requests.

  Ranking:

  1. **Question (2): Whether the boundedness of the judge is a bug to be engineered around or the entire point of the scheme.**
     - **Downstream impact: Very high.** This is foundational. If boundedness is a bug, then the entire scheme might be unworkable and we must focus on engineering fixes (which may require empirical work beyond this group). If it's the point, then we must design protocols that leverage bounded judges. Almost all other questions (like 1, 3, 4, 5) depend on this.
     - **Tractability: High.** This is a conceptual question about the purpose of debate. It can be addressed through philosophical analysis of the debate protocol and its goals (scalable oversight). We can examine definitions, assumptions, and thought experiments.
     - **Neglectedness: Medium.** Some work (e.g., Irving et al.) assumes boundedness is the point, but the tension (bug vs. feature) is not always explicitly debated. It's worth a focused treatment.
     - **Deployment relevance: High.** If boundedness is a bug that cannot be engineered around, debate might be unsafe for deployment. If it's the point, then we must design for it. This directly affects whether to use debate at all.
     - **Overall:** Top priority because it sets the stage for the entire research program.

  2. **Question (1): Whether debate presupposes that arguments can be decomposed into steps a bounded judge can check one at a time.**
     - **Downstream impact: High.** If decomposition is impossible for some truths, then debate fails for those cases. This affects the scope of debate's applicability. Questions about step-by-step checking are central to the protocol.
     - **Tractability: High.** This is about the structure of arguments and what a bounded judge can verify. Logical analysis of argument decomposition (e.g., in formal systems) is feasible without experiments. We can model argument chains and judge capabilities.
     - **Neglectedness: Medium to High.** While the problem of obfuscated falsehoods has been noted, a systematic treatment of when decomposition is possible is less common.
     - **Deployment relevance: High.** If decomposition fails for critical problems, debate cannot be trusted for those. This might lead to restricting deployment to decomposable problems.
     - **Overall:** Second because it directly addresses a core mechanism of debate. Settling this helps define the domain of applicability.

  3. **Question (3): Whether cross-examination can substitute for the judge's own capacity to check claims.**
     - **Downstream impact: High.** If cross-examination can offload verification from the judge, then we can have more capable oversight with less capable judges. This is a key hope of debate. If it fails, the judge must be stronger, which might undermine scalability.
     - **Tractability: High.** We can use logical and game-theoretic models to analyze cross-examination. For example, modeling debates as games of persuasion and examining under what conditions cross-examination exposes lies.
     - **Neglectedness: Medium.** Cross-examination is discussed, but the precise conditions under which it substitutes for judge capacity are not fully formalized.
     - **Deployment relevance: High.** If cross-examination doesn't help, then debate might not scale and would not be deployed for complex tasks.
     - **Overall:** Third because it builds on (2) and (1). If the judge's boundedness is the point (from Q2) and arguments can be decomposed (Q1), then cross-examination (Q3) might be the engine that makes it work.

  4. **Question (5): How the scheme degrades when debaters can model and exploit the judge's biases.**
     - **Downstream impact: Medium.** This is about robustness. If debate is highly sensitive to judge biases, it might be unsafe. But if we can design protocols to mitigate this, it might be less critical.
     - **Tractability: Medium.** We can model biased judges and strategic debaters using game theory. However, without empirical data on actual biases, we might be limited to worst-case analysis.
     - **Neglectedness: High.** Bias exploitation is a known issue but not deeply studied in the debate context. Most work assumes honest debaters or unbiased judges.
     - **Deployment relevance: Medium to High.** In practice, biases exist, so if debate fails under biased conditions, it might be deployed only in controlled settings. But if we can show robustness, deployment becomes more feasible.
     - **Overall:** Fourth because it's about failure modes, which are important but perhaps secondary to the core mechanism.

  5. **Question (4): Whether debate requires that at least one debater be able to find the right answer, or whether the adversarial format can extract truth that neither side possesses.**
     - **Downstream impact: Medium.** This affects the types of problems debate can solve. However, in many settings, we assume at least one debater is truthful and capable. If debate can synthesize truth from two ignorant debaters, that's a bonus, but not core to the original proposal.
     - **Tractability: Medium.** We can use logical models (e.g., jury theorems) to study when truth emerges. But it might require probabilistic reasoning that is complex.
     - **Neglectedness: High.** This is under-discussed. The focus is often on debaters knowing the truth.
     - **Deployment relevance: Low to Medium.** For oversight of superhuman AI, we might require that the AI knows the truth (so one debater is honest). The scenario where neither knows is more speculative, so settling this might not change deployment as much.
     - **Overall:** Fifth because it's less central to the immediate trustworthiness of debate for superhuman AI oversight, where we might assume the AI debaters are capable.

  6. **Question (6): Whether the recurring analogy to adversarial legal systems is load-bearing or misleading.**
     - **Downstream impact: Low to Medium.** The analogy is illustrative, but the technical details of debate protocols are what matter. If the analogy is misleading, we might change our intuitions, but the core mechanism remains.
     - **Tractability: High.** Philosophical analysis of analogies and disanalogies is feasible.
     - **Neglectedness: Low.** Many papers note the legal analogy and critique it.
     - **Deployment relevance: Low.** Even if the analogy is imperfect, it might still inspire useful protocols. Deployment decisions would be based on empirical and theoretical results, not the analogy.
     - **Overall:** Last because it's more about framing than technical substance. Answering it might not change much.

  Most overrated: **Question (6)**. If we answered it tomorrow, it would change the least. The legal analogy is a heuristic, but the actual mechanism must stand on its own. Even if the analogy is flawed, we might still find debate useful.

  Missing question: **What happens when the two debaters are copies of the same underlying system?** This is critical because in practice, we might use multiple instances of the same model. The risk is that they share the same biases or blind spots, reducing adversarial pressure. This could lead to collusion or common failure modes. This question should be added.

  - **Downstream impact: High.** If same-system debaters fail to be adversarial, then debate might not work in realistic settings.
  - **Tractability: Medium.** We can model shared biases and correlated errors. However, without empirical data, we might need to assume certain independence properties.
  - **Neglectedness: High.** Most debate papers assume independent debaters, but in practice, same-system is common.
  - **Deployment relevance: High.** If same-system debaters are unsafe, we must require independent training, which is expensive. This affects deployment feasibility.

  This missing question should be prioritized near the top. Given the criteria, I'd place it at **position 3 or 4** (bumping others down). But let's adjust the ranking to include it.

  Revised ranking including the new question:

  1. **Q2 (Judge boundedness)**
  2. **Q1 (Argument decomposition)**
  3. **New Question: Same-system debaters (collusion and shared failures)**
  4. **Q3 (Cross-examination)**
  5. **Q5 (Bias exploitation)**
  6. **Q4 (Truth from ignorant debaters)**
  7. **Q6 (Legal analogy)**

  Reasoning for the new question's placement:
  - It's highly relevant to deployment (if same-system doesn't work, we need independent models, which is costly) and has high downstream impact (affects how we train debaters). However, it is less foundational than Q2 and Q1, so it comes after them. Also, tractability is medium (we can model, but it might be abstract without data), so it fits after the core mechanism questions.

  How developments could change the list:

  - **Q2 (Judge boundedness):** If empirical results show bounded judges can reliably oversee superhuman AI via debate, this becomes less urgent. If failures occur, it moves up.
  - **Q1 (Argument decomposition):** Progress in interpretability (e.g., tools for decomposing reasoning) might make this less critical, but if decomposition is impossible for key problems, it moves up.
  - **New Question (Same-system):** If empirical work shows same-system debaters work fine, it drops. If they fail, it moves up. Also, if theoretical work shows conditions for independence, it might be settled.
  - **Q3 (Cross-examination):** If new debate protocols make cross-examination more effective, this drops. If formal models show it doesn't help, it becomes critical.
  - **Q5 (Bias exploitation):** If we find ways to make judges robust to bias (e.g., via multiple judges), it drops. If attacks are easy, it moves up.
  - **Q4 (Truth from ignorant):** If we assume debaters are superhuman, this remains low. If we face cases of collective ignorance, it might rise.
  - **Q6 (Legal analogy):** Unlikely to change much.

  Summary for the paper:

  The research agenda should start by clarifying the role of the judge's boundedness (Q2), then tackle argument decomposition (Q1), then the risks of same-system debaters (new), cross-examination (Q3), and so on. The legal analogy (Q6) is the least pressing. The reasoning for each prioritization is based on the criteria: foundational first, then mechanisms, then robustness and deployment considerations.
answer: |-
  Below is a prioritized research agenda for your theory group, designed to maximize impact on the trustworthiness of debate-based oversight for superhuman AI proposals. The prioritization is based on four explicit criteria:  
  1. **Downstream impact**: How many other critical questions or protocols depend on resolving this?  
  2. **Tractability with a priori methods**: Can philosophers/logicians make progress using theory, formal modeling, or conceptual analysis alone?  
  3. **Neglectedness**: Is the question understudied relative to its importance?  
  4. **Deployment relevance**: Would resolving this change a real-world deployment decision (e.g., "Should we use debate for high-stakes oversight?")?  

  Conflicts between criteria are resolved as follows:  
  - **Downstream impact vs. neglectedness**: Downstream impact wins, as unresolved high-dependency questions create bottlenecks.  
  - **Tractability vs. deployment relevance**: Tractability wins for your group (no empirical resources), but deployment relevance breaks ties.  
  - **Neglectedness vs. deployment relevance**: Deployment relevance wins, as the goal is practical trustworthiness.  

  ### Prioritized Open Questions (Ranked High to Low)
  #### **1. (2) Judge boundedness: Bug or feature?**  
     - **Why this rank?**  
       - **Downstream impact**: Highest. This is the *linchpin* of the entire debate scheme. If boundedness is a fatal flaw, questions 1, 3–5 become irrelevant. If it’s the point, it shapes how we approach all other issues (e.g., judge capabilities, debater incentives).  
       - **Tractability**: High. Pure conceptual work can clarify assumptions: e.g., formalize "boundedness" (e.g., computational limits, cognitive biases) and analyze protocols where judges only verify local steps.  
       - **Neglectedness**: Medium. Often assumed but rarely dissected—most papers treat boundedness as a given without justifying *why* it’s tolerable.  
       - **Deployment relevance**: Highest. If boundedness is irredeemable, debate fails at its core purpose; if it’s essential, we must design around it (e.g., stricter stepwise reasoning rules).  
     - **Development that changes rank**: Empirical results showing bounded judges consistently fail/succeed in adversarial settings would elevate or suppress this.  

  #### **2. (1) Decomposability of arguments into judge-verifiable steps**  
     - **Why this rank?**  
       - **Downstream impact**: Very high. If decomposition is impossible for key problems (e.g., complex ethics or security), debate fails for those domains, invalidating cross-examination (Q3) and judge design.  
       - **Tractability**: High. Logicians can model obfuscated falsehoods (e.g., using formal argumentation frameworks) and identify constraints (e.g., "Only problems with polynomial-time verifiable steps are safe").  
       - **Neglectedness**: High. The "obfuscation problem" is noted but lacks rigorous treatment—few papers define what makes a step "individually acceptable" or how chains mislead.  
       - **Deployment relevance**: High. If decomposition fails for critical tasks (e.g., AI alignment proposals), debate cannot be trusted for them, altering deployment scope.  
     - **Development that changes rank**: Advances in interpretability (e.g., mechanistic anomaly detection) could make decomposition easier, lowering priority. Widespread obfuscation in LLMs would raise it.  

  #### **3. (New) Shared-system debaters: Collusion and correlated failures**  
     - **Why this rank?**  
       - **Downstream impact**: High. If debaters are copies (common in practice), shared biases/errors could cause undetected failures, undermining debate’s adversarial core and cross-examination (Q3).  
       - **Tractability**: Medium. Philosophers can model incentive alignment between copies (e.g., game theory with correlated agents) and logical conditions for independence.  
       - **Neglectedness**: Highest. Rarely addressed—most work assumes independent debaters. This is critical for real-world use (e.g., cost-effective deployment).  
       - **Deployment relevance**: High. If same-system debaters collude or fail identically, debate is untrustworthy for oversight, requiring independent training (costly) or abandonment.  
     - **Why added?** You noted this gap—it’s vital for realistic deployment.  
     - **Development that changes rank**: Evidence that copies stay adversarial (e.g., from RLHF studies) lowers priority; theoretical proofs of collusion risks raise it.  

  #### **4. (3) Cross-examination as a substitute for judge capacity**  
     - **Why this rank?**  
       - **Downstream impact**: Medium-High. If cross-examination compensates for weak judges, it enables scalable oversight; if not, judge requirements balloon, threatening feasibility.  
       - **Tractability**: High. Formal debate protocols (e.g., logical games) can test when cross-examination forces truth-telling, e.g., using modal logic for "burden of proof."  
       - **Neglectedness**: Medium. Often discussed optimistically, but lacks formal criteria for when it *fails* (e.g., in recursive debates).  
       - **Deployment relevance**: Medium. If cross-examination cannot offload verification, debate becomes less scalable, affecting deployment economics.  
     - **Development that changes rank**: Successful implementations in AI systems (e.g., Anthropic’s self-critique) would lower priority; failures with complex claims raise it.  

  #### **5. (5) Exploiting judge biases**  
     - **Why this rank?**  
       - **Downstream impact**: Medium. Affects robustness but assumes debate’s core mechanism works.  
       - **Tractability**: Medium. Philosophers can model biased judges (e.g., Bayesian persuasion games) and design "bias-aware" protocols (e.g., adversarial training for judges).  
       - **Neglectedness**: High. Bias is acknowledged but under-theorized—little on how debater persuasion tactics interact with known human biases.  
       - **Deployment relevance**: Medium. In practice, biases exist; if exploitable, debate could be gamed, limiting high-stakes use.  
     - **Development that changes rank**: If AI judges prove less biased than humans, this drops; evidence of systematic manipulation (e.g., sycophancy in LLMs) raises it.  

  #### **6. (4) Truth extraction without capable debaters**  
     - **Why this rank?**  
       - **Downstream impact**: Low. Debate’s value is clearest when one debater knows the truth—this is a bonus, not core.  
       - **Tractability**: Low-Medium. Hard to model formally without empirical input (e.g., how "ignorant" agents synthesize truth).  
       - **Neglectedness**: High. Rarely studied; most work assumes honest/capable debaters.  
       - **Deployment relevance**: Low. For superhuman proposals, we’d likely use capable debaters; settling this wouldn’t change deployment.  
     - **Development that changes rank**: If AI systems show emergent truth-seeking in debate without prior knowledge, priority rises.  

  #### **7. (6) Legal analogy: Load-bearing or misleading?**  
     - **Why this rank?**  
       - **Downstream impact**: Low. The analogy is illustrative; technical mechanisms matter more.  
       - **Tractability**: High. Conceptual analysis of disanalogies (e.g., legal verdicts vs. truth-seeking) is feasible.  
       - **Neglectedness**: Low. Frequently critiqued (e.g., legal systems prioritize fairness over truth).  
       - **Deployment relevance**: Lowest. Deployment hinges on performance, not analogies.  
     - **Development that changes rank**: If debate protocols directly borrow legal rules (e.g., discovery), relevance increases.  

  ### Most Overrated Question  
  **Question (6) (Legal analogy)** is the most overrated. Resolving it tomorrow would change little—it’s a rhetorical device, not a technical pillar. Even if the analogy is flawed, debate could still work (or fail) based on its mechanics.  

  ### Summary of Prioritization Reasoning  
  - **Top questions (1–2)** anchor the agenda: Judge boundedness (Q2) and argument decomposability (Q1) are existential to debate’s viability. They are tractable and affect everything downstream.  
  - **Middle questions (3–5)** address robustness: Shared-system risks (new) and cross-examination (Q3) are deployment-critical but depend on Q1–Q2; bias (Q5) is important but secondary.  
  - **Bottom questions (6–7)** are non-core: Truth without capable debaters (Q4) and the legal analogy (Q6) are intellectually interesting but low-leverage for trustworthiness.  
  - **Tractability guided ties**: E.g., Cross-examination (Q3) outranks bias (Q5) because formal models of argumentation are more accessible than bias mitigation without data.  
  - **Neglectedness broke no ties**: High neglectedness (e.g., Q4) didn’t elevate low-impact questions.  

  ### Agenda Dynamics  
  This ranking assumes current tech (e.g., LLMs with known obfuscation risks). If future developments occur:  
  - **AI judges advance**: Questions about judge boundedness (Q2) and cross-examination (Q3) drop.  
  - **Debaters show collusion**: Shared-system risks (new) jump to #1.  
  - **Obfuscation worsens**: Decomposability (Q1) becomes urgent.  
  - **Human judges dominate**: Bias exploitation (Q5) rises.  

  This agenda prioritizes questions that could **kill debate** (Q1, Q2, new) or **enable it** (Q3) with minimal empiricism, aligning with your group’s strengths. By starting with boundedness and decomposibility, you avoid wasted effort on secondary issues if debate’s foundations crumble.
