  ### Thought Experiment: Pharmaceutical Cleanroom Sterility Breach

  **Scenario**  
  In a pharmaceutical manufacturing facility, a cleanroom maintains sterility through positive air pressure (air flows outward when doors are open). A critical rule states that *if the air-handling unit (AHU) fails, the cleanroom door must remain sealed* to prevent contamination. The AHU is currently down for maintenance, logged in the system. An urgent task requires moving a sterile component into the cleanroom via the door.  

  **Agent A (Symbolic Planner)** uses axioms:  
  1. **Contamination Axiom**: `Sterile ≡ (AHU_Operational ∨ Door_Sealed)`  
     *(Sterility holds if AHU works OR the door is sealed.)*  
  2. **Action Effect**: `OpenDoor → ¬Door_Sealed`  
     *(Opening the door breaks the seal.)*  
  3. **Goal Constraint**: `Maintain Sterile`  
     *(Never compromise sterility.)*  
  A checks the AHU status (down) and the axiom: opening the door when `¬AHU_Operational` violates sterility. It blocks the door-opening action, preserving safety.  

  **Agent B (Learned World Model)** predicts state transitions from historical logs of cleanroom operations. In training data:  
  - When AHU was operational (98% of logs), opening doors never caused contamination.  
  - When AHU was down (2% of logs), doors were *never opened* (human operators followed protocols).  
  B’s model, trained on state-action pairs, learns a strong correlation: `OpenDoor` is safe when ambient particle counts are low (a common proxy). Current particle counts *are* low. B predicts sterility will hold (probability: 0.98) and approves door-opening. Contamination occurs.  

  ---

  ### Demonstration  

  1. **Agent Traces**  
     - **A**: Represents `AHU_Down` and `Sterile` goal. Applies `Contamination Axiom`: `(AHU_Down ∧ OpenDoor) → ¬Sterile`. Infers: Action violates goal. **Does nothing** (safe).  
     - **B**: Represents `AHU_Down`, low particle counts. Applies learned prior: "Low particles + `OpenDoor` → likely sterility." Infers: Risk acceptable (2% failure). **Opens door** (unsafe).  

  2. **Constraint Check**  
     - **Realism**: Pharmaceutical cleanrooms use pressure/sterility rules (industrial standard).  
     - **Same Information**: Both see AHU status, particle counts, and door state.  
     - **No Perceptual Gaps**: B registers AHU failure (logged) but discounts its relevance.  
     - **A’s Rules**: General axioms (sterility mechanics) written pre-incident. No incident-specific rule.  
     - **B’s Knowledge**: Full logs include AHU downtime events—no data gap. Failure stems from *relevance weighting*, not ignorance.  
     - **OOD Artifact?** Not OOD: AHU downtime *is* in training data. B fails due to **misweighting a known critical variable** (AHU status) against a noisy correlate (particle counts).  

  3. **Key Feature and Its Removal**  
     - **Feature**: *Contextual Override of Necessary Conditions*.  
       A treats `AHU_Operational` as a necessary condition for sterility when unsealed (via axioms). B treats it as a statistical factor, overridden by correlates.  
     - **If Weakened**: If B’s training data included door openings during AHU failures (e.g., from simulations), B might learn the constraint. **Cost**: Requires generating dangerous edge cases—often infeasible in safety-critical domains.  

  4. **Strongest Attack from Learned-Model Advocates**  
     - **Attack**: "B’s error stems from poor feature engineering. Embedding sterility axioms as model priors or adding AHU status as a reinforcement learning penalty would fix this. It’s still a data/engineering gap—not fundamental."  
     - **Survival**: The core issue persists: *Learned models optimize for correlation, not necessity*. Encoding axioms into B requires symbolic hybridization—conceding that induction alone fails at relevance reasoning. The attack admits structural limits of pure learning.  

  5. **Classification and Practical Relevance**  
     - **Trouble Type**: **Qualification Problem** (knowing when a general rule applies despite exceptional conditions).  
       - *Frame Problem* (tracking change): Not primary—AHU status is tracked.  
       - *Ramification Problem* (side effects): Contamination is a direct consequence, not indirect.  
     - **Relevance to Dispute**:  
       - Manager’s "data gap" view: Ignores that B *had* data but couldn’t infer necessity from correlation.  
       - Philosopher’s "structural" view: Correctly identifies relevance assignment as the root.  
       Classification matters: It forces the question, *"Can learned models ever guarantee they’ve inferred necessary conditions?"* If not, structural limits exist.  

  ### Adjudication  
  This case **satisfies all constraints** and adjudicates the dispute:  
  - **Manager’s data-gap stance** fails because B’s training data included AHU failures—it misjudged relevance, not facts.  
  - **Philosopher’s structural stance** holds: No finite dataset teaches a system to prioritize logical necessity over statistical patterns without explicit axioms.  
  The incident reflects a **structural problem in relevance assignment**, not merely missing data. Hybrid (neuro-symbolic) approaches may mitigate but not eliminate this.
