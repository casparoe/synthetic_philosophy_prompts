answer: |-
  Here's the claim-by-claim translation into poker terms, followed by a residue report addressing your specific questions. I'll flag distortions where Machiavelli doesn't map cleanly.

  ### Core Translation (Machiavelli → Poker)
  1. **"Fortune governs half our actions"**  
     → **Short-term variance dominates outcomes.** In any finite hand/session sample, luck (bad beats, coolers, card runs) can override edge. Machiavelli *lacks* the concept of "long run" because his domain (politics/war) has **absorbing ruin states** – one loss = death/exile (like playing your entire bankroll on a single hand). He doesn't reject EV mathematically; he rejects its *relevance* when ruin is permanent.

  2. **"The cautious man succeeds only when times fit his caution; the impetuous man only when times fit his impetuosity"**  
     → **Game selection determines winrate sustainability.**  
     - *Cautious man* = **Nit/TAG** printing in **soft, passive games** (e.g., 2009 home games) but crushed in **tough, aggressive games** (modern high-stakes solvers).  
     - *Impetuous man* = **LAG/maniac** thriving in **weak-tight games** but bleeding chips in **reg-infested pools**.  
     Success depends on **meta-fit**: your style must match the game's exploitability profile.

  3. **"Fortune favors the bold"**  
     → **Positive edge + higher variance shots maximize *opportunity capture*.**  
     Distortion: Machiavelli **conflates EV and risk of ruin**. To him, boldness isn't just "higher N when +EV" – it's exploiting *fleeting edges* (e.g., a drunk whale at high stakes) before fortune shifts. He prioritizes **maximizing upside potential** over minimizing risk, because in politics, *not* acting = guaranteed ruin. In poker terms: he'd take a +EV shot with 20% RoR over grinding a lower edge safely.

  4. **"Fortune is a flooding river; virtù is building dikes in calm times"**  
     → **Bankroll management & skill-building are variance buffers.**  
     "Dikes" = **Bankroll reserves + technical study + mental game prep.** Built during **"dry seasons"** (winning streaks, soft games). Used to withstand **"floods"** (downswings, tougher games). *Virtù* here is **preparation for negative variance.**

  5. **"A man can't change his nature; he fails when conditions shift"**  
     → **Leak rigidity creates exploitable imbalances.**  
     If you're a natural nit, you'll **under-bluff vs aggressive regs**; if a maniac, you'll **over-bluff vs nits**. Your "nature" is your **default strategy/tendencies**. "Can't change" means **adjustment is slow/costly** – like a TAG learning to overbet-river as meta evolves. Failure = being **exploited when game dynamics shift**.

  ---

  ### Residue Report
  **1. "Half governed by fortune" – Why no long run?**  
  Machiavelli assumes **non-stationary conditions + absorbing ruin**. Poker has stationary rules; politics doesn't. Your "game" (opponents, stakes, rules) changes unpredictably (e.g., home game breaks up, poker boom ends, Black Friday). **Variance doesn't "wash out" because the game you built your edge on vanishes.** Worse: one bad decision (e.g., tilting vs a nitty whale) can end your career (ruin). He'd say: "Your 'long run' is irrelevant if the game changes in 10k hands or you bust before 100k." **You should reject his *fatalism* but accept his warning: edge decays with meta shifts.**

  **2. What is *virtù*? Edge, game selection, or...?**  
  *Virtù* is **edge + adaptability + opportunity recognition + risk capital allocation.**  
  - If reduced to "edge," you lose **proactive aggression** (forcing folds vs passive players).  
  - If reduced to "game selection," you lose **preparation** (studying solver outputs pre-dry season).  
  - **Core loss:** *Virtù* includes **creating luck** – e.g., table talk tilting a fish, or politicking to keep a game soft. It's **skill in manipulating variance-generating conditions**, not just exploiting them.

  **3. The "choosing your nature" paradox – Why no poker equivalent?**  
  This is **the biggest residue.** Poker theory assumes you *can* adjust (study GTO, hire a coach). Machiavelli claims **core tendencies are fixed** – you'll *always* be risk-averse or aggressive deep down. His insight: **You must pick a strategy with durable exploitability.**  
  - In your terms: A nit *choosing* to be a nit in 2009 is fine, but only if they **bank enough to retire** before games get tough.  
  - Missing concept: **"Style half-life"** – e.g., LAG styles decay faster as games get tougher. Machiavelli says: **Factor your rigidity into strategy selection.** If you can't adapt, pick a style that survives longest *as-is*.  

  ---

  ### Straight Answer: Why the Residue?
  **Mostly because Machiavelli's world is darker than poker.** His "game" has:  
  - **No rebuys:** Ruin = permanent exit.  
  - **Drifting EV:** Edges evaporate overnight (e.g., a key ally dies).  
  - **No neutral plays:** Not acting = losing by default.  
  - **No training mode:** You can't "grind micros" to learn politics.  

  **Your vocabulary *is* missing one thing: the cost of strategic rigidity.** Poker assumes adaptation is possible with effort; Machiavelli doubts it. His "choose your nature" idea warns: **If you know you can't adjust, optimize for your style's expiration date.** For your shot-taking dilemma: He'd say *"Go bold if you have virtù (edge + prep), but only if your nature won't crack under high-stakes variance. If you're naturally cautious, stay put – forcing boldness will tilt you into ruin."*  

  **Final distortion alert:** He sees "boldness" as **shaping the game** (scaring opponents, seizing initiative), not just exploiting edges. In poker, that's like 3-betting light to dominate table flow – it creates +EV spots that didn't exist. That agency is underrated in standard poker math.
