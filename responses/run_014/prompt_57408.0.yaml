  ### Decision Tree: Clarifying "Why Britain and Not China?"  
  *Nodes turn on question structure only—causal stories are irrelevant. Interrogate your interrogative.*

  **Root**: "Why Britain and not China?"  
  ↓  
  **Node 1: What is the primary *explanandum* (thing to be explained)?**  
  - **Branch A: Location** (Why *there*? Focus on geography/politics).  
  - **Branch B: Timing** (Why *then*? Focus on date/sequence).  
  - **Branch C: Occurrence** (Why *anywhere*? Focus on start of sustained growth).  
  - **Branch D: Form** (Why *this way*? Focus on growth’s characteristics, e.g., coal-based).  
    *Justification for D: Shifts from "where/when" to "how"—e.g., labor-intensive vs. capital-intensive paths.*  

  ---

  #### **Branch A: Location** (Why Britain *there*, not China *there*?)  
  ↓  
  **Node 2: Is the foil (China) treated as a *single comparable unit*?**  
  - **Leaf A1: Unit-Mismatch Trap**  
    - *Description*: Foil (China) is an incomparable unit (empire vs. nation).  
    - **Awkward commitment**: Must defend comparing a continent-spanning empire to a small island nation as equivalent actors.  
    - **Foil-sensitivity test**:  
      - Yangzi: **Dies** (foil mismatch).  
      - China: **Survives** (but unit mismatch remains).  
      - Anywhere else: **Dies** (foil mismatch).  
      → **Survives 1/3**.  
    - **Occupied**: Yes (common in popular debates).  
  - **Leaf A2: Well-Posed Regional Contrast**  
    - *Description*: Foil is a comparable region (e.g., Yangzi Delta ≈ Britain).  
    - **Awkward commitment**: Must explain why near-identical regions diverged, ignoring national boundaries.  
    - **Foil-sensitivity test**:  
      - Yangzi: **Survives**.  
      - China: **Dies** (not regional).  
      - Anywhere else: **Dies** (not regional).  
      → **Survives 1/3**.  
    - **Occupied**: Yes (e.g., economic historians like Pomeranz).  
  - **Leaf A3: Multi-Foil Divergence**  
    - *Description*: Foil is a *set* (e.g., "anywhere else in Eurasia").  
    - **Awkward commitment**: Must explain why Britain diverged from *all* peers simultaneously, not just China.  
    - **Foil-sensitivity test**:  
      - Yangzi: **Dies** (single region ≠ set).  
      - China: **Dies** (single unit ≠ set).  
      - Anywhere else: **Survives**.  
      → **Survives 1/3**.  
    - **Occupied**: Yes (e.g., institutionalists like North).  

  ---

  #### **Branch B: Timing** (Why Britain *then*, not China *earlier*?)  
  ↓  
  **Node 3: Is the counterfactual truth-apt?**  
  *(i.e., "Would China have industrialized by 1850 if Britain hadn’t?"—is this knowable?)*  
  - **Leaf B1: Truth-Apt Timing Gap**  
    - *Description*: Yes—antecedent (no British industrialization) is plausible/specific.  
    - **Awkward commitment**: Must defend a knowable closest world where Britain stalls but China progresses.  
    - **Foil-sensitivity test**: **Dies immediately** on all re-askings (shifts focus to location).  
    - **Occupied**: Yes (e.g., optimists about deterministic growth paths).  
  - **Leaf B2: Truth-Aptness Failure**  
    - *Description*: No—antecedent is too distant; no fact of the matter.  
    - **Awkward commitment**: Must abandon "why not China earlier?" as ill-posed.  
    - **Foil-sensitivity test**: **Dies immediately**.  
    - **Occupied**: Yes (e.g., skeptics of long-run determinism).  
  - **Leaf B3: Short-Antecedent Timing**  
    - *Description*: Only for short antecedents (e.g., "if Britain delayed 20 years").  
    - **Awkward commitment**: Must concede China *still* wouldn’t have industrialized faster.  
    - **Foil-sensitivity test**: **Dies immediately**.  
    - **Occupied**: Barely (unattractive: implies China was "always" too slow).  

  ---

  #### **Branch C: Occurrence** (Why did sustained growth start *anywhere*?)  
  ↓  
  **Node 4: Is China the *exemplar foil* for non-occurrence?**  
  - **Leaf C1: Foil Overextension**  
    - *Description*: Yes—China represents global non-occurrence.  
    - **Awkward commitment**: Must treat China as the archetype of pre-growth stagnation.  
    - **Foil-sensitivity test**: **Dies immediately** (re-askings reframe to location/timing).  
    - **Occupied**: Yes (e.g., "Great Divergence" scholars).  
  - **Leaf C2: Necessary-but-Not-Sufficient**  
    - *Description*: No—foil is the *pre-industrial world*, not China.  
    - **Awkward commitment**: Must argue Britain alone had a full bundle of conditions.  
    - **Foil-sensitivity test**: **Dies immediately**.  
    - **Occupied**: Yes (e.g., theorists of multiple prerequisites).  

  ---

  #### **Branch D: Form** (Why *British-style* growth, not *Chinese-style*?)  
  ↓  
  **Node 5: Is the foil *actual* or *hypothetical*?**  
  - **Leaf D1: Path-Dependency Lock-In**  
    - *Description*: Foil is China’s *actual* pre-industrial economy.  
    - **Awkward commitment**: Must show China’s constraints made British-style growth impossible.  
    - **Foil-sensitivity test**: **Dies immediately** (re-askings ignore form).  
    - **Occupied**: Yes (e.g., resource-centric historians).  
  - **Leaf D2: Phantom Alternative**  
    - *Description*: Foil is a *hypothetical* Chinese growth path (e.g., water-powered).  
    - **Awkward commitment**: Must specify a non-British industrial trajectory China could have taken.  
    - **Foil-sensitivity test**: **Dies immediately**.  
    - **Occupied**: No (incoherent: hypotheticals are unfalsifiable).  

  ---

  ### Key Notes:  
  - **Collapsing leaves**:  
    - **B1/B2/B3** and **C1/C2** collapse under foil-sensitivity—all die on re-asking. Timing/occurrence/form questions *cannot* survive location reframing.  
  - **Bundle-of-conditions test**: Only **Leaf C2** (Necessary-but-Not-Sufficient) explicitly handles this. For other leaves, a bundle makes single-foil questions (e.g., A1, A2) ill-posed—no branch needed.  
  - **Unoccupied leaves**: **D2** (Phantom Alternative) is incoherent; **B3** (Short-Antecedent Timing) is unattractive.  
  - **Truth-apt branch**: Explicitly separates **B1** (yes), **B2** (no), **B3** (only short).  

  ---

  ### Vignettes:  
  1. **"Britain had coal and colonies; China didn’t—that’s why it happened there first."**  
     → **Leaf A1 (Unit-Mismatch Trap)**: Location focus, China as foil, ignores unit mismatch.  

  2. **"The real puzzle is why growth didn’t start in Song China—they had the tech!"**  
     → **Leaf B1 (Truth-Apt Timing Gap)**: Timing focus, assumes knowable counterfactual.  

  3. **"Industrialization needed 10+ preconditions. Britain was the only place with all 10."**  
     → **Leaf C2 (Necessary-but-Not-Sufficient)**: Occurrence focus, foil is the whole pre-industrial world.  

  ---

  **Tree stats**: 5 nodes, 14 leaves. Fits one A4 page.  
  **Designed to kill circling**: Forces clarity on *what* is asked before *how* to answer.
