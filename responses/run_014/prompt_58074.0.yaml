prompt: |-
  ok so im TAing a third-year class on social norms and stuff and my prof dumped the convention week on me becuase shes travelling. i need a 45-min in-class essay prompt on Lewis-style conventions plus how norms can evolve without anyone agreeing to them, something that actually forces them to apply the ideas instead of just repeating definitions.

  can you make up two little campus cases for them to work through? like one where grad students leave the seminar room door half-open vs fully closed to signal if the room is free for drop-ins, where everyone goes along mainly since they expect everyone else to read it that way and theyre fine with it as long as others are, and there was another equally workable signal that just never caught on. and a second one where everyone chips in five bucks for the end of term party even though most would realy rather free-ride and only pay to avoid gossip.

  the essay should make them say which one counts as a Lewisian convention and why, using the bits about conditional preference, mutual expectations, arbitrariness / another equilibrium being possible, and precedent without explicit deal-making, plus sketch how trial-and-error and copying success could get the first one going from scratch and why that story doesnt fit the second one.

  throw in a model answer around 600 words i can calibrate off, and a marking guide out of 25 that breaks down the points, spells out what seperates an A answer that nails the crux from a B answer that just lists labels, and flags the two or three classic blunders that should lose marks.
reasoning: |-
  Okay, let me unpack this TA's request. They need an in-class essay prompt on David Lewis's convention theory, specifically focusing on how norms evolve without explicit agreement. The professor dumped convention week on them, so they're looking for something rigorous but accessible for third-year students.

  Hmm... they mentioned two campus scenarios: one about seminar room door positions as signals, and another about end-of-term party contributions. The door case seems perfect for Lewis - it's all about arbitrary signals, mutual expectations, and path dependence. The party fund feels different because it involves temptation to free-ride and social enforcement. 

  For the prompt, I should make sure it forces application, not just regurgitation. Students need to identify which case is Lewisian by analyzing conditional preferences (e.g. "I'll keep door half-open if others do"), arbitrariness (fully closed could've worked), and emergence without agreement. Then contrast with the party case where payment stems from fear of gossip, not coordination. 

  The model answer needs to nail key distinctions: 
  - In door case, conformity is preference-driven ("I'm happy as long as we coordinate")
  - In party case, it's incentive-driven ("I pay to avoid shame")
  - Evolution through trial-and-error only fits the coordination problem

  For marking, I'll suggest a 25-point rubric: 
  - 10 for correct identification + Lewis criteria application 
  - 8 for contrasting cases (especially why trial/error works for one not other)
  - 5 for emergence explanation 
  - 2 for structure
  Common pitfalls to flag: 
  - Misunderstanding arbitrariness (it's about alternative equilibria, not triviality) 
  - Confusing social enforcement with coordination 
  - Missing that Lewisian conventions solve coordination problems specifically

  The campus examples should feel authentic. For the door signal, I'll specify things like "half-open=available, fully closed=occupied" with the alternative being fully open. For the party fund, emphasize that people pay reluctantly to avoid gossip. This makes the contrast sharp.
answer: |-
  Here's a comprehensive in-class essay package designed to make students apply Lewisian convention theory to real-world norm evolution, complete with scenarios, prompt, model answer, and detailed marking guide.

  **Essay Prompt (45 Minutes):**

  "Analyze the following two campus scenarios using David Lewis's theory of conventions. For each scenario, explain whether it constitutes a Lewisian convention. Your analysis **must explicitly address**:

  1.  The structure of **conditional preferences** ("I prefer to conform if others conform").
  2.  The role of **mutual expectations** (what individuals believe others will do/believe).
  3.  **Arbitrariness** and the existence of **at least one other possible, stable equilibrium** (an alternative pattern everyone *could* follow).
  4.  The role of **precedent** and the absence of explicit agreement/deal-making.

  Furthermore, **sketch a plausible evolutionary process** (involving trial-and-error, copying successful behavior, or salience) for how the norm in **Scenario A** could have emerged spontaneously from a state of no coordination. Explain **why this same evolutionary process is unlikely or inadequate to explain the stability of the norm in Scenario B**."

  ---

  **Scenarios:**

  *   **Scenario A (The Seminar Door):** In the Sociology Department, grad students use the seminar room door position as a signal. An unoccupied room is left **half-open**. If the room is occupied for a meeting or intensive work, the door is **fully closed**. This practice emerged organically. No one ever formally decided this; people just started doing it and others followed suit. Crucially, **everyone is generally indifferent between using "half-open" or "fully open" as the "available" signal**, as long as *everyone else uses the same one consistently*. The "fully open" signal was equally viable but never caught on. People adhere mainly because they expect others to read the signal that way and they prefer to coordinate on *some* clear signal to avoid confusion or interruptions.

  *   **Scenario B (The Party Fund):** For the end-of-term social work party, it's become customary that **everyone chips in $5** to cover pizza and drinks. While most enjoy the party, **many would genuinely prefer to avoid paying the $5 and just attend for free** (they'd free-ride if they could get away with it). However, they pay because they fear being **gossiped about** or subtly **excluded from future informal gatherings** if they don't contribute. There's a strong sense that "everyone should pay their share," enforced through social chatter and disapproval, not formal rules. No formal vote or agreement established this $5 amount; it's just what people started doing years ago.

  ---

  **Model Answer (~600 words):**

  David Lewis defined a convention as a regularity in behavior within a population, sustained because it solves a recurrent coordination problem. Conventions arise and persist due to a specific structure of preferences, beliefs, and arbitrariness, evolving without explicit agreement. Applying this framework reveals that **Scenario A (The Seminar Door) qualifies as a Lewisian convention, while Scenario B (The Party Fund) does not.**

  **Scenario A as a Lewisian Convention:**
  1.  **Conditional Preferences:** Each grad student has a strong conditional preference: "I prefer to leave the door half-open (if the room is free) *only if* I expect others to interpret half-open as 'available' and do the same." Their preference is *conditional* on others conforming. Conforming (using the signal correctly) fulfills their primary goal: clear communication about room availability to avoid interruptions or confusion. They are largely indifferent to *which* signal (half-open or fully open) is used, as long as it's consistent.
  2.  **Mutual Expectations:** The practice works because of mutual expectations. Student X leaves the door half-open *because* they believe others expect them to do so and will interpret it correctly. Student Y checks the door *expecting* that others follow the rule. This network of interdependent beliefs ("I believe you believe I believe...") sustains the regularity.
  3.  **Arbitrariness & Alternative Equilibria:** The convention is arbitrary. Using "fully open" for available and "closed" for occupied is an equally effective, stable alternative equilibrium. Everyone *could* coordinate just as successfully on that different pattern. The choice of "half-open" is path-dependent; it just happened to start, and everyone converged on it.
  4.  **Precedent/No Agreement:** The norm emerged spontaneously. Someone likely left it half-open once, others observed and copied the successful signal (avoiding interruption), and the precedent solidified through repeated interaction without any meeting or deal.

  **Evolution of Scenario A:** This convention could evolve from scratch through trial-and-error and copying. Initially, with no signal, interruptions were frequent (coordination failure). Some individuals might have tried different signals (e.g., different door positions, notes). Suppose one person left the door half-open when leaving an empty room. Others entering saw this and, finding the room free, associated "half-open" with availability. They then copied this behavior when leaving empty rooms themselves, finding it successful in preventing *them* from being interrupted later. Those who used conflicting signals (e.g., fully open) caused confusion and interruptions, making their behavior less successful and less likely to be copied. The salient precedent of "half-open" (once a few used it successfully) provided a focal point, allowing others to align their expectations and behaviors, converging on the equilibrium. This process relies purely on individuals adjusting their actions based on the observed success (avoiding conflict) of others' coordination attempts.

  **Scenario B Not a Lewisian Convention:** While a regularity exists, it lacks the core elements of a Lewisian convention.
  1.  **Conditional Preferences:** Individuals do *not* have a conditional preference to pay $5 *only if others pay*. Many have an *unconditional preference to avoid paying* (free-ride). They pay only because of the threat of sanctions (gossip, exclusion), not because paying *itself* fulfills a coordination need *conditional* on others' paying. This is a problem of cooperation/collective action (avoiding free-riding), not pure coordination.
  2.  **Mutual Expectations & Arbitrariness:** While people expect others to pay (and enforce payment), the key driver isn't mutual expectation enabling coordination, but fear of punishment. The $5 amount might be arbitrary, but the core problem isn't about coordinating on *which* amount to pay; it's about getting people to pay *any* amount despite the temptation to defect. The alternative "equilibrium" where *no one pays* isn't equally preferred or stable in the same way; it leads to no party, which is worse for most than having a party funded by contributions. The stable state relies on enforcement, not mutual conditional preference.
  3.  **Why Evolution Fails for B:** The trial-and-error/copying process described for A doesn't fit B. Copying "paying $5" isn't inherently successful *for the individual*; paying $5 is costly. Someone who successfully free-rode (avoided paying without sanction) would be *more* successful (kept $5, enjoyed the party). The norm persists *despite* individual incentives to defect, due to external enforcement mechanisms (gossip, exclusion), not because copying the behavior of paying leads to inherent coordination success. The emergence relies on sanctioning, not convergence on a salient solution to a coordination problem.

  In conclusion, the Seminar Door signal is a classic Lewisian convention solving a pure coordination problem through conditional preferences, mutual expectations, and arbitrariness, emerging via precedent and copying successful coordination. The Party Fund is a social norm enforcing cooperation against individual incentives to free-ride, sustained by sanctions, not the mutual conditional preferences central to Lewis's definition.

  ---

  **Marking Guide (Total: 25 Points):**

  *   **Identification & Core Lewis Criteria Application (10 Points):**
      *   **A (9-10):** Clearly and correctly identifies Scenario A as Lewisian convention and Scenario B as not. Accurately and explicitly applies **all four** Lewis criteria (Conditional Prefs, Mutual Expectations, Arbitrariness/Alt. Equilibrium, Precedent/No Deal) to *both* scenarios, demonstrating deep understanding of each concept *in context*. For B, clearly explains *why* it fails the key criteria (esp. conditional preference).
      *   **B (7-8):** Correctly identifies A as convention and B as not. Applies most criteria but might miss one, apply one partially, or be less precise in explaining *why* B fails (e.g., mentions free-riding but doesn't explicitly link it to the *absence* of a true conditional preference for conformity).
      *   **C (5-6):** Identification may be shaky or implicit. Applies some criteria correctly but misses key elements or misapplies them to one scenario. May confuse characteristics.
      *   **D/F (<5):** Misidentifies the scenarios. Fails to apply core Lewis criteria meaningfully or accurately.

  *   **Contrasting Cases & Evolution Explanation (10 Points):**
      *   **A (9-10):** Provides a clear, plausible trial-and-error/copying/salience process for Scenario A's emergence, explicitly linking steps to achieving coordination success. Provides a **strong, specific explanation** for why this process *does not fit* Scenario B, focusing on the *lack of inherent individual benefit from copying the costly action* (paying) and the *role of sanctions* instead. Contrasts the core problems (coordination vs. cooperation).
      *   **B (7-8):** Sketches a reasonable evolution for A. Explains why it doesn't fit B, but the explanation might be less detailed or slightly less precise regarding the lack of inherent payoff for copying the desired behavior (paying) in B.
      *   **C (5-6):** Evolution sketch for A is vague or incomplete. Explanation for B's misfit is weak, generic (e.g., "it's different"), or misattributes the reason.
      *   **D/F (<5):** Evolution explanation missing, incorrect, or irrelevant. Fails to explain why the process doesn't fit B.

  *   **Analysis Depth & Conceptual Integration (5 Points):**
      *   **A (5):** Seamlessly integrates concepts. Demonstrates sophisticated understanding of the *crux*: the fundamental difference between coordination problems solved by conventions (where conformity is *mutually beneficial* conditional on others conforming) and cooperation problems requiring enforcement (where individuals have an incentive to defect). Writing is clear, concise, and logically structured.
      *   **B (4):** Concepts are applied correctly but integration is less smooth. Shows understanding but perhaps doesn't fully articulate the core theoretical distinction as sharply. Structure is good.
      *   **C (3):** Concepts are listed or described rather than deeply integrated and applied. Analysis may be superficial or disjointed. Structure is adequate.
      *   **D/F (1-2):** Concepts are misused, confused, or absent. Analysis is poor or off-topic. Structure is weak.

  **Classic Blunders (Deduct Marks Significantly - Often Costing 2-4 Points Each):**
  1.  **Misunderstanding Arbitrariness:** Equating it with "unimportant" or "trivial." Failing to articulate that it means *multiple strict Nash equilibria exist* (e.g., stating "half-open is arbitrary because any signal would work" *without* specifying the viable alternative like "fully open").
  2.  **Confusing Enforcement with Conditional Preference:** Arguing that Scenario B *is* a Lewisian convention because "people prefer to pay to avoid gossip." This misses the point: Lewisian conditional preference is "I prefer to do X *if others do X*" because X solves a coordination need. In B, the preference is "I prefer to pay *to avoid sanction*," regardless of how many others pay (though expectations about enforcement matter). Conflating social enforcement mechanisms with the mutual conditional preference central to Lewis.
  3.  **Ignoring the Core Coordination Problem:** Focusing solely on regularity or precedent without establishing that Scenario A solves a *coordination problem* where mutual conformity is the primary desired outcome for all, conditioned on others conforming. Applying the "convention" label without demonstrating this foundation.

  **Separating A from B Answers:**
  *   **A Answer:** *Nails the crux* by relentlessly focusing on the **nature of the underlying problem and the structure of preferences**. For A: Highlights the pure coordination problem and the genuine conditional preference for conformity ("I'm happy to use the signal *as long as others do*"). For B: Explicitly identifies the free-rider problem and the lack of a true conditional preference for paying ("I'd rather not pay, I only do it to avoid punishment"). Explains evolution in terms of achieving coordination success through copying, and its failure in B due to the cost of the action and lack of inherent coordination payoff. Uses concepts as analytical tools, not just labels.
  *   **B Answer:** *Lists the labels and criteria* accurately but superficially. Applies the criteria correctly to A. Correctly states B isn't a convention but provides a weaker explanation (e.g., "because of free-riding" without deeply linking it to the *absence of conditional preference* or contrasting the problem types). Evolution explanation is present but less detailed or insightful. Relies more on describing the scenarios with terminology than dissecting the underlying incentive structures.

  This package gives students specific, relatable scenarios to analyze, forces application of key Lewis concepts, requires contrasting the cases and evolutionary processes, and provides you with a clear model and rubric for consistent marking. Good luck with convention week!
