  **3. Cruxes Proper**  
  The following sub-questions, if resolved, would move at least one party. Both sides accept Cases C and D as bearing on them.  

  - **Crux 1: Does conditionalizing on one’s existence inherently favor hypotheses with more observers?**  
    - *Case*: Case C (cosmology).  
    - *SSA prediction*: Credence remains 0.5; no inherent favor to larger theories.  
    - *SIA prediction*: Credence nears 1 for the larger theory; existence is evidence for more observers.  
    - *What would challenge SSA*: If cosmology showed that our existence *requires* a large universe, SSA would need revision.  
    - *What would challenge SIA*: If indifference to empirically identical theories were proven normative, SIA would be refuted.  
    - *Discriminatory observations*: None conceivable, as theories are empirically equivalent. The dispute remains substantive because it affects predictions in non-equivalent cases (e.g., Doomsday, multiverse ethics).  

  - **Crux 2: Does indexical information (e.g., cubicle numbers) break observer-count symmetry?**  
    - *Case*: Case A(ii) (sealed lab after cubicle number).  
    - *SSA prediction*: Learning cubicle 2 boosts Heads to ≈0.999.  
    - *SIA prediction*: Learning cubicle 2 leaves credence at 0.5.  
    - *What would challenge SSA*: If experiments showed cubicle numbers were uninformative (e.g., Heads not favored at cubicle 2).  
    - *What would challenge SIA*: If repeated trials showed Heads correlated with low-number cubicles.  
    - *Discriminatory observations*: Possible in principle via simulated trials (frequency of Heads when cubicle is 2).  

  - **Crux 3: Is the reference class fixed by epistemic situation, and does it include duplicates?**  
    - *Case*: Case D (reference class with duplicates).  
    - *SSA prediction*: Reference class includes all functionally identical observers (duplicates included). Credence in Heads before cubicle: \( \approx 0.0003 \) (1/2999).  
    - *SIA prediction*: Reference class is irrelevant; scaling uses total observers (duplicates included). Credence in Heads before cubicle: \( \approx 0.001 \) (as Case A).  
    - *What would challenge SSA*: If duplicates with identical states were shown to be irrelevant to self-location.  
    - *What would challenge SIA*: If reference-class choices altered SIA’s predictions.  
    - *Discriminatory observations*: None; hinges on interpretation of "observer." Dispute is substantive due to implications for AI, simulations, and identity.  

  **4. Terminological Issues**  
  - **Conditioning on existence vs. sampling**:  
    - SSA conditions on being a random sample from a reference class, treating existence as a precondition.  
    - SIA conditions on existence by scaling priors, treating it as update-worthy evidence.  
    - **What remains**: After stripping terminology, the core disagreement is whether "I exist" is evidence that inherently favors hypotheses with more observers (SIA) or whether it is neutral, with observer counts only mattering when sampling from a class (SSA). This affects how indexical evidence (e.g., birth rank, cubicle numbers) is weighted and whether Doomsday-like shifts occur.  
  - **Reference class**:  
    - For SSA, the reference class is a further choice (not fully dictated by the assumption), resolved principledly (e.g., "observers in my epistemic situation").  
    - For SIA, the reference class does not arise; observer count is theory-based.  
    - **What remains**: Whether duplicates are "observers" is terminological, but the implications for credence (Case D) are substantive, turning on whether identical functional states imply identical sampling weights.  

