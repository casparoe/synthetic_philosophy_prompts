  Part 4: Terminological Issues

  We isolate terminological issues. One key point: 

  - The SSA defender conditions on being a random sample from the reference class. The SIA defender conditions on the fact of existence (which is built into the prior scaling). 

  But both use conditionalization. The difference is in what they consider the evidence to condition on. 

