  3. Both parties agree that the cases are stipulated to contain no other discriminating evidence beyond what is described.

  4. Both parties agree that observation selection effects are a genuine challenge for epistemology and that the reference class problem (i.e., which set of observers one should consider oneself a random sample from) is unsolved and important.

  5. Both parties agree that in Case D, the functional duplicates are causally isolated and share the same memories and functional states as the original.

