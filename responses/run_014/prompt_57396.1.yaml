  ### Joint Statement on Observation Selection Effects  

  **1. Claims Both Can Sign**  
  We, the undersigned, agree on the following:  
  1. In all cases, reasoning requires conditionalization on self-locating evidence (e.g., "I am an observer in this experiment").  
  2. In Case A, the coin is physically fair: the unconditional chance of Heads is exactly 1/2.  
  3. The cases are stipulated to contain no additional discriminating evidence beyond what is described.  
  4. Observation selection effects pose genuine challenges for epistemology, particularly in anthropic and cosmological reasoning.  
  5. The reference-class problem (i.e., determining which set of observers constitutes the appropriate class for sampling) is unresolved and critically important.  
  6. In Case D, the functional duplicates are causally isolated, share the subject’s memories and functional states, and are physically realized in hardware.  

  *Rider from the self-sampling defender*: "While the reference-class problem is unresolved, the self-sampling assumption provides a principled framework for addressing it, though the exact reference class may require further specification."  
  *Rider from the self-indication defender*: "While the reference-class problem is unresolved, the self-indication assumption avoids counterintuitive consequences like Doomsday arguments by design and offers a robust alternative framework."  

