prompt: |-
  Ok so my philosophy club just did the Twin Earth thing where Putnam asks you to imagine a planet that looks exactly like ours, and the people there call the stuff in their lakes water, except it turns out their stuff isnt H2O, its some other chemical, and the question is whether their word means the same as ours. I get that the answer is supposed to be no, because what a word refers to gets fixed by the environment and not by whats inside your head. Fine, I buy it.

  What I want is to run that machinery on something that actually happened: the 2006 IAU vote where Pluto got demoted. Heres the facts as I understand them, and if I've got them wrong just say so and keep going: to be a planet now you have to orbit the sun, be massive enough that gravity has rounded you out, and have cleared the neighborhood around your orbit of other junk. Pluto fails the third one because it shares its zone with a bunch of other icy bodies, so it got moved into a new box called dwarf planet, along with Ceres and Eris. Only a small fraction of the IAU's members actually voted, and plenty of planetary scientists, including people who study Pluto for a living, still call it a planet. So nothing out in space changed at all, Pluto is the same ball of ice it always was, but the word changed.

  Analyze this both ways, the theory on the case and the case on the theory:

  1. If externalism is right, was it true in 1990 that Pluto is a planet, and false now? Or was it always false, the way that whales are fish was always false? Which of those does the theory actually commit you to, and does it matter who's doing the talking, the experts or the rest of us who just go along with whatever the experts say (the division of linguistic labor thing)? And does it matter that the change came out of a vote, where a big part of the motivation was that we dont want forty planets in the textbooks? Is the reference getting fixed by nature here, or by us?

  2. Heres the bit I actually care about. Suppose the IAU had voted the other way and Pluto stayed a planet. Same world, same objects, same orbits, only the committee vote differs. Does planet mean the same thing in that world? Environmental externalism seems to say yes, because the stuff out there is identical, so the extension is identical. But the Burge arthritis case seems to say no, because what your word means depends on the norms of your community, and communities can differ. So does this case support environmental externalism, support social externalism, or drive a wedge between them? Be specific about what each one predicts about the counterfactual IAU, dont just tell me both of them are externalist.

  3. Compare it to cases where we revised a terms extension because we found out the world wasnt what we thought, like jade turning out to be two different minerals, or whales turning out not to be fish. Is the Pluto case that kind of case or a different kind? And if its a different kind, what does that tell us about whether planet is a natural kind term at all, or whether its a category we invented for convenience, and if its the latter then what was the externalist argument even about?

  4. Then be honest with me: does this case definately confirm externalism, embarrass it, or is it something the theory never thought about and just goes silent on? If it goes silent, point at exactly which step has nothing to say here.

  Dont give me a reading list or names of papers, I only want the argument, and dont just tell me its controversial which definition of planet is right. I know that. I want to know what the theory of meaning says about the controversy, and what the controversy shows about the theory.
reasoning: |-
  Okay, let me break down this fascinating question about Pluto and externalism. The user is clearly well-versed in philosophy of language, having understood Putnam's Twin Earth and now applying it to the real-world IAU controversy. They're asking sharp, layered questions that reveal genuine philosophical curiosity. 

  First, I need to acknowledge how cleverly they're connecting abstract theory to concrete scientific practice. The Pluto case is perfect for testing externalism precisely because it involves both physical reality (Pluto's orbital properties) and social factors (the IAU vote). The user wants rigorous analysis, not just textbook answers.

  For part 1, the key is distinguishing between descriptive and prescriptive changes. When astronomers used "planet" pre-2006, were they referring to whatever satisfies current criteria (making Pluto always non-planet retroactively) or to their operational concept? I think externalism favors the latter view - meaning tracks usage until experts refine the concept. The motivation behind the vote (avoiding 40 planets) actually highlights how natural kind terms aren't always purely natural; astronomy mixes physics with practical classification.

  Part 2 is the juiciest: the counterfactual vote scenario. Here I see tension between environmental and social externalism. Putnam would say same environment = same extension, but Burge would say different expert norms create different meanings. The Pluto case exposes this rift - it's not Twin Earth's pure environmental difference. I should emphasize how this challenges externalism's unity.

  For part 3, contrasting with jade/whales is crucial. Those were discovery-driven (new facts changed extensions), while Pluto's reclassification was criteria-driven (same facts, new rules). This suggests "planet" may be a nominal kind - useful for astronomy but not tracking a fundamental natural kind. That doesn't sink externalism though; even nominal kinds have extensions fixed partly externally (e.g., by what orbits exist).

  Finally for part 4, I'll be upfront: this doesn't embarrass externalism but reveals its nuances. Social externalism handles the IAU vote better than pure environmentalism. The silence comes when theories don't account for how scientific communities negotiate reference-fixing over time. Maybe this case calls for a hybrid view where both environment and social practice jointly determine meaning.

  The user's frustration with "it's controversial" dismissals is valid - they want theory applied to controversy, not avoidance. I'll focus on clear predictions each theory makes. Their depth suggests they'll appreciate me wrestling with tensions rather than oversimplifying.
answer: |-
  This is a razor-sharp application of externalism to a real-world case. Let's break it down step-by-step, addressing each of your points directly and analyzing the implications for semantic externalism.

  **1. Externalism Applied to Pluto's Status: Truth over Time?**

  *   **The Theory's Commitment:** Externalism (especially Putnam's causal-historical version) commits you to **the view that "Pluto is a planet" was true in 1990 and false now.** Here's why:
      *   **Baptism & Reference:** Pre-2006, the term "planet" was introduced and used within astronomy to pick out a class of significant bodies orbiting the Sun, *based on the knowledge and observational capabilities of the time*. Pluto satisfied the then-operative criteria (orbits Sun, visible/non-stellar, assumed to be dominant in its orbit).
      *   **Reference Fixed by Usage:** The reference of "planet" was fixed by this usage and the actual objects satisfying those criteria in our environment. Pluto *was* part of that extension. It wasn't a "mistake" like calling whales fish, because whales *never* satisfied the essential biological criteria for fish used by experts even when the folk term was used loosely. Pluto *did* satisfy the essential criteria *as understood by the relevant linguistic community (astronomers)* at the time.
      *   **Discovery Changes Reference:** Discovering Pluto's true nature (its size, composition, shared orbital zone with KBOs) didn't reveal it *always* failed the *then-operative* criteria. Instead, it prompted a *re-evaluation and refinement of the criteria themselves*. This refinement changed the meaning/reference of "planet" moving forward.
      *   **Division of Linguistic Labor (DoLL):** This is crucial. Pre-2006, the *expert* meaning of "planet" included Pluto. Laypeople deferred to that expertise. Post-2006, the *expert* meaning changed. Laypeople *still* defer to experts, but now the experts' criteria are different. So, for both experts and laypeople (via DoLL), the reference changed.
      *   **The Vote & Motivation:** Does the vote undermine externalism? Not necessarily. The vote wasn't happening in a vacuum; it was a response to *discoveries about the external environment* (Eris, Kuiper Belt objects). The motivation ("don't want 40 planets") reflects the *practical application* of a scientific category. Science often defines categories based on natural groupings *and* utility. Externalism doesn't require reference to be fixed by "pure nature" alone; it's fixed by the interaction of our linguistic practices *with* the world. The discoveries forced astronomers to confront the need for a more precise definition that reflected the structure of the solar system they observed.

  **2. The Counterfactual Vote: Environmental vs. Social Externalism**

  *   **The Scenario:** Same physical world (Pluto, orbits, KBOs), but the IAU votes *against* the resolution, maintaining the pre-discovery criteria (or adopting different criteria that include Pluto).
  *   **Predictions:**
      *   **Environmental Externalism (Putnam-style):** Predicts **the same meaning/same extension.** The physical environment (objects, orbits, compositions) is identical. Therefore, the natural kind (or category) picked out by "planet" should be identical. The different vote is just a different *belief* or *label* applied to the same physical reality. Meaning is world-bound.
      *   **Social Externalism (Burge-style):** Predicts **a different meaning/different extension.** The *norms* of the expert linguistic community differ. In World A (actual vote), the expert norm excludes Pluto. In World B (counterfactual vote), the expert norm includes Pluto. Since meaning depends on communal norms (especially for terms like "planet" where criteria are explicitly debated and defined), "planet" means something different in the two worlds. Meaning is community-bound.
  *   **The Wedge:** The Pluto case **drives a sharp wedge between Environmental and Social Externalism.** It forces us to choose:
      *   Is "planet" primarily tracking a *natural structure* in the solar system (environmental)? Then meaning shouldn't change with the vote.
      *   Is "planet" primarily defined by *conventional criteria established by experts* (social)? Then meaning *does* change with the vote.
  *   **Supporting Social Externalism:** The Pluto case strongly suggests **Social Externalism is more plausible here.** Why?
      1.  **Lack of Obvious Natural Kind:** There's no clear, fundamental physical property (like molecular composition for water) that *all and only* planets share that differs crucially from dwarf planets. The IAU criteria are explicitly *operational definitions* based on observable characteristics (orbit, shape, dynamical dominance).
      2.  **Expert Norms are Constitutive:** The definition *is* the expert norm. Changing the norm *changes the category*. In World B, Pluto *is* a planet *because the experts say it is*, based on their chosen criteria. In World A, it isn't. The physical facts *motivate* the norm change but don't *dictate* the specific outcome of the vote.
      3.  **Arthritis Analogy Holds:** Just as Burge argues your word "arthritis" means what the medical community means by it (even if you have a mistaken belief), "planet" means what the astronomical community means by it. If the community norm differs, the meaning differs, even if the physical world is the same.

  **3. Comparison to Jade and Whales: Discovery vs. Definition**

  *   **Jade/Whales (Discovery-Driven Revision):** These are paradigm cases of **discovery changing our understanding of the extension of a natural kind term.**
      *   **Jade:** We thought "jade" referred to one mineral kind. We discovered it referred to two distinct minerals (jadeite, nephrite) with similar appearances. The *reference* didn't change; we learned it was disjunctive. The meaning (reference-fixing description: "that green mineral...") picked out two things.
      *   **Whales:** We thought whales were fish (satisfied folk criteria: live in water, swim). Biological science revealed essential differences (warm-blooded, lungs, live birth) showing whales *never* belonged to the biological kind "fish". The *folk term* might have included them, but the *scientific kind* never did. We discovered the true nature of the kind.
  *   **Pluto (Definition-Driven Reclassification):** This is **fundamentally different.** We didn't discover Pluto *lacked* the properties astronomers previously used to call it a planet (orbiting Sun, roundish). We *changed the rules*. The discovery of Eris/KBOs showed the *old rules* led to a messy or unintuitive classification *given the newly revealed structure of the solar system*. The revision was a *stipulative redefinition* for scientific utility and coherence.
  *   **Implications for "Planet" as a Kind:**
      *   This strongly suggests **"planet" is not a natural kind term like "water" or "tiger".** It lacks a hidden essence discoverable by science. Instead, it's **an artificial or nominal kind term** – a useful scientific category defined by conventional, observable criteria chosen to best organize our understanding of solar system bodies.
      *   **What Was the Externalist Argument About?** It was still about reference being fixed externally! But in this case, the "external" factors are complex:
          *   The *actual objects* in the solar system.
          *   Their *observable properties* (size, shape, orbits, orbital neighborhoods).
          *   The *scientific goals* of classification (predictability, understanding formation, utility).
          *   The *social process* of the expert community establishing criteria based on 1-3.
      Externalism opposes *internalism* (meaning is only in the head). The reference of "planet" is fixed by the interaction of linguistic practices with the external world of astronomical objects *and* the external social institution of science defining its terms. It's not *purely* social convention divorced from reality, nor is it fixed by a hidden natural essence.

  **4. Honest Assessment: Confirmation, Embarrassment, or Silence?**

  *   **Does it confirm externalism?** Yes, but **it refines it and highlights the role of social practice,** particularly for non-natural-kind terms. It powerfully shows meaning isn't just in the head – Pluto's status changed because of discoveries *about the external world* and the subsequent response *by the external institution of science*. Internalism can't easily explain this.
  *   **Does it embarrass externalism?** It **challenges a simplistic, purely environmental version** (à la early Putnam). If "planet" were a natural kind term like "water," the counterfactual vote *shouldn't* change meaning. The fact that it plausibly *does* shows environmental externalism isn't the whole story for all terms.
  *   **Where does it go silent/What step has nothing to say?** Externalism **struggles to give a definitive, unified answer about the *counterfactual vote scenario***. This is the point of maximum tension:
      *   **Step 1: What fixes reference?** Environmental externalism says the physical environment. Social externalism says the expert community norms. The Pluto case shows *both* are involved for terms like "planet," and the theory doesn't provide a clear, principled way to *weight* them or explain *when* one dominates the other in counterfactuals. It lacks a clear mechanism for how social negotiation *about definitions* interacts with the causal-historical grounding in the world.
      *   **Step 2: How stable is reference over theory change?** Externalism handles discovery-driven changes (jade, whales) well. It handles cases where we realize our baptism was wrong (calling a look-alike "tiger" that isn't). It's less clear on cases where we deliberately *redefine* a successful term based on new information and theoretical goals. Does reference change with stipulation, or is the old reference preserved? Externalism doesn't have a single, uncontroversial answer here for nominal kinds.

  **Conclusion:** The Pluto case is a brilliant test for externalism. It confirms externalism's core insight against internalism but exposes a critical rift between environmental and social versions. It strongly suggests "planet" is a nominal kind defined by expert-stipulated criteria responsive to discoveries about the external world, making social externalism particularly salient. The theory handles the *actual* historical change well but goes relatively silent on how to adjudicate the *counterfactual vote* scenario definitively, revealing a need to better integrate the roles of physical reality and social practice in fixing reference, especially for scientifically defined categories. It doesn't embarrass externalism; it forces it to mature.
