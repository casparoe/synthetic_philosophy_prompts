prompt: |-
  I'm a novelist, three books in, and I'm stuck on the fourth in a way that's turned into a philosophy problem, so I'm asking you to settle it for me. The book is set in a big distribution warehouse outside a mid-sized city, and the character I care about is the engineer who installs the robots. I need to know what she actually believes, and right now I catch myself believing different things on different pages.

  Here are my gut verdicts on automation. What I want is the principle, if there is one, that gets all or most of them. I've read enough Marx to be dangerous, so don't water the philosophy down, but the answer has to be sayable out loud by a woman in a hi-vis vest, so nothing I can't put in her mouth.

  1. A robot takes over the roof-bolting in a mine, the job where men have died, same crew, same pay. Good, plainly good, no asterisk.

  2. Same robot, but the mine lays off half the crew and the survivors supervise it, safer and slightly better paid. Bad. Not bad-but-worth-it. Bad.

  3. The word processor. My writing life got freer, I write more, I'd never go back, and I feel no flicker of loss about it even knowing what happened to typing pools. Good.

  4. A model that drafts my chapters. Structurally the same gain: less drudgery, more books, same money. Feels like something being taken from me rather than given. Bad, and I can't articulate why, becuase 3 and 4 look like the same case with the knobs turned up.

  5. Self-checkout at the supermarket. Bad. The shop has handed me a job and called it convenience. I use it anyway, which I assume counts as data against me.

  6. A warehouse where an algorithm sets the pace and logs every second of the picker's day. Worse than the old foreman — even though the foreman was a bully and the algorithm is scrupulously fair and never shouts.

  7. A worker co-op buys the same picking robot as in 6, cuts the week to 25 hours, same pay. Good. But I'm suspicious of how good I think it is, because I worry my whole principle is just who owns the thing, and that that's either the entire answer or a dodge.

  8. A friend's novel, half-drafted by a model, that is honestly better than her last one. I can't get a verdict out of myself at all on this one.

  9. The Luddites. Smashing the frames was a rational move by people with no other move, and the machine wasn't the enemy. I hold both at once and don't feel any pressure to give one up.

  The pairs I can't reconcile are 3 against 4, and 2 against 7. Everything else I'd defend, including 8 being a blank.

  So: give me the principle, or a small set of rival principles if one won't do, each stated precisely enough that I can see what it costs me. For each clause, tell me which of my cases forces it. Tell me what it predicts about two cases I haven't listed — pick them yourself, one historical and one contemporary, and try to pick ones where the principle embarrasses itself rather than where it coasts. Then tell me honestly which of my nine verdicts it can't keep, and whether I should drop the verdict or add a clause.

  One more thing, and I'd rather you tell me if it's a red herring: I keep coming back to that stretch of the Grundrisse where machinery and fixed capital take over the worker's knowledge, and where the whole thing is supposed to end with labour time ceasing to be the measure of wealth. Does any of that do real work in my warehouse, or is it decoration I should keep out of the book? Same question for the shift from formal to real subsumption — is that the distinction that actually explains 3 versus 4, or am I just reaching for a phrase?

  Hard cap: 900 words. Lead with the bottom line — the principle in a sentence or two at the top, before you argue for it — and if you have to cut something, cut the theory, not the cases.
reasoning: |-
  Okay, the user is a novelist struggling with a philosophical dilemma about automation in their fourth book. Their protagonist is a warehouse robotics engineer, and they need to clarify her beliefs about technology in a way that's both philosophically sound and authentically blue-collar. 

  First, let's unpack their nine case studies. The contradictions are fascinating: they celebrate word processors but reject AI drafting, accept mining robots that save lives but condemn those that cut jobs, and have complex feelings about self-checkouts versus worker-owned automation. The core tension seems to be between efficiency gains and human dignity, but ownership models complicate it (case 7 vs 2). 

  Hmm, their reference to Marx's Grundrisse suggests they've done homework but worry it might be ornamental. They're right to question whether "formal vs real subsumption" explains the writing tools dilemma (cases 3 vs 4) - that concept describes structural exploitation shifts, but their discomfort feels more visceral, about creative sovereignty. 

  The user's self-awareness impresses me. They admit using self-checkouts while calling them "bad" (case 5), and their blank reaction to the AI-assisted novel (case 8) rings true - some conflicts resist neat judgments. Also, their Luddite take (case 9) is refreshingly nuanced: machines aren't enemies, but breaking them was rational when institutions failed. 

  For the principle... Ownership alone (case 7) can't explain why they reject the mining layoffs (case 2) but accept their word processor eliminating typists (case 3). There's a deeper thread about whether technology emancipates or dispossesses. The warehouse algorithm (case 6) is "worse than a bully foreman" because it perfects exploitation - efficiency isn't neutral. 

  Ah! The key might be *directional control*: who benefits from freed time/effort? When workers gain autonomy (case 7's 25-hour week), tech liberates; when capital captures all gains (case 2, 5, 6), it alienates. This explains the writing tools split: word processors expanded creative agency (case 3), while AI drafting threatens authorship (case 4). 

  Testing this with new cases... For historical, consider Victorian textile mills: productivity soared but weavers became machine-tenders - bad under this principle. For contemporary, GPS trucking: algorithms optimize routes but punish drivers for bathroom breaks - also bad because carriers, not drivers, reap efficiency gains. 

  Where the principle strains: case 8 (AI-improved novel). If the book's better and the author chose the tool, is it emancipatory? Maybe - but the user's discomfort might stem from the *systemic* threat to artistic livelihoods, making individual success feel like complicity. 

  On Marx... The Grundrisse's "labor time ceasing as wealth measure" is relevant! The warehouse engineer might see algorithms as potential liberation if workers controlled them (case 7), but under capitalism, they just intensify exploitation (case 6). "Real subsumption" clarifies why the productivity algorithm feels worse than the foreman: it embeds control into the machinery itself. Keep it, but show through her hands-on experience, not theory. 

  Final principle: "Automation is good when it genuinely frees human capacity; bad when it merely transfers effort to workers or erodes their agency. Ownership matters mainly as a means to that end." 

  The user should drop no verdicts - their conflicts reflect real tensions. Instead, let the engineer articulate this through action: maybe she sabotages "efficiency" algorithms but champions worker-retraining robots. Her philosophy emerges when she refuses to install surveillance sensors, growling, "This isn't labor-saving, it's dignity-stealing."
answer: |-
  Here's the core principle distilled from your judgments, tested against your cases, and operationalized for your engineer:

  **Automation is good when it reduces necessary labor *without dispossessing people of agency or the value they create*. It becomes bad when it transfers burdens, erodes self-determination, or seizes the gains of increased productivity solely for capital.**

  **Principle Breakdown:**

  1.  **"Reduces necessary labor":** Captures the core benefit (safety in mines, typing drudgery).
  2.  **"Without dispossessing people of agency or the value they create":** This is the critical qualifier. "Agency" covers autonomy, skill, control over work process. "Value they create" covers fair compensation and ownership of the fruits of increased productivity.
  3.  **"Transfers burdens, erodes self-determination, seizes gains for capital":** Defines the *mechanisms* of the bad outcome.

  **How it Captures Your Verdicts:**

  *   **1 (Good Robot, Same Crew/Pay):** Reduces dangerous labor *without* dispossession. Gains (safety) shared, agency intact (same job, just safer).
  *   **2 (Bad Robot, Layoffs):** Reduces labor *but dispossesses* half the crew of work/income (value) and likely erodes agency for survivors (shift to supervision). Gains (cost savings) seized by capital.
  *   **3 (Good Word Processor):** Reduces drudgery *without* dispossessing *you* of agency (you control the tool) or the value (you write more books, get paid). (The dispossession of typists is real but *external* to your direct use-case; the tool itself empowers *you*).
  *   **4 (Bad AI Chapter Drafting):** Reduces labor *but dispossesses you* of core creative agency – the act of drafting *is* the core value-creation act for a novelist. Feels like theft of your generative capacity.
  *   **5 (Bad Self-Checkout):** Transfers labor burden (checkout work) *to you*, the customer, under guise of "convenience." Dispossesses cashiers of jobs. Gains (labor cost savings) seized by capital.
  *   **6 (Bad Algorithmic Pacing):** Erodes worker self-determination (pace dictated) and intensifies surveillance/discipline. Gains (efficiency) likely seized by capital, not workers. Reduces labor? Maybe, but replaces human pacing with algorithmic control – a burden shift *within* work.
  *   **7 (Good Co-op Robot):** Reduces labor *and* shares gains (shorter week, same pay). Workers retain agency *through* ownership – they control the "how" and benefit from the "gains." No dispossession.
  *   **8 (Friend's AI Novel - Blank):** Ambiguous because the *degree* of agency retained by your friend is unclear. Did the AI augment her vision (like a powerful WP) or replace her core generative act? Principle predicts: Good if she directed/owned the process; Bad if the AI dictated the value.
  *   **9 (Luddites - Rational/Not Machine's Fault):** Consistent. They fought *dispossession* (jobs, livelihood/agency) and *seizure of gains* (profits to mill owners), not the technology *inherently*. Their target was the *use* of the machine to dispossess them.

  **Resolves Your Conflicts:**

  *   **3 vs 4:** Word Processor (3) is a tool amplifying *your* agency in creation. AI Drafting (4) feels like replacing the core act of creation, dispossessing you of agency. The "knob" isn't just intensity; it's shifting from tool-user to potential tool-*subject* in value creation.
  *   **2 vs 7:** Mining Robot (2) dispossesses workers of jobs/income/value. Co-op Robot (7) reduces labor time *while ensuring* workers keep the value (via ownership and reduced hours).

  **Predictions & Embarrassments:**

  1.  **Historical: Power Looms (Early Industrial Revolution).** Prediction: **Bad** under principle. Reduced labor needed per cloth yard *but* dispossessed skilled hand-weavers of livelihoods, concentrated gains in factory owners, eroded agency (factory discipline). Embarrassment? Over time, it created *new* jobs (operators, mechanics). Principle focuses on initial dispossession/agency loss for those directly replaced, not long-term macro shifts.
  2.  **Contemporary: AI Radiology Analysis.** Prediction: **Ambivalent/Contextual.** Good: Reduces drudgery (scanning), frees radiologists for complex diagnosis (potentially enhancing agency). Bad: If used to replace radiologists or subject remaining ones to relentless AI-driven quotas (eroding agency), or if profits solely benefit hospital corps/shareholders. Embarrassment? If AI significantly outperforms humans on diagnostics, is resisting it denying patients better care? Principle prioritizes worker agency/value over pure technical efficiency or consumer benefit *in the work context*.

  **Where Your Verdicts Challenge the Principle:**

  *   **Case 5 (Self-Checkout):** You call it "Bad," and the principle supports this (burden shift, job loss). But you *use it anyway*. Does this break the principle? Not inherently. The principle judges the *system/implementation*, not individual consumption choices forced by market realities (like time pressure). Your engineer might use it while still condemning it.
  *   **Case 8 (Friend's Novel):** Your blank verdict is *consistent*. The principle needs more info on agency to judge. Your unease might stem from the *systemic* threat AI poses to *all* writers' agency/value, making individual success feel fraught.

  **Marx & Your Warehouse:**

  *   **Grundrisse (Machinery/Fixed Capital, Labor Time & Wealth):** **Relevant, Keep it.** This *is* the deep background. The engineer might grasp intuitively that the robots embody "dead labour" controlling "living labour." Her work *installs* the system where "the machine" sets the pace (Case 6), absorbing worker knowledge into algorithms (Case 4 parallels). The promise that reduced labor time *could* mean freedom (Case 7) vs. the reality of intensified exploitation (Case 6) is exactly the tension Marx identifies. Let her sense this concretely: "These things are supposed to make life easier, but they just make the clock tighter," or "We built the brain, now it treats us like limbs."
  *   **Formal vs. Real Subsumption:** **Useful Lens for 3 vs 4.** Formal subsumption: WP makes your *existing* writing process more efficient. Real subsumption: AI drafting fundamentally *reorganizes* the labor process of writing – the very nature of how a novel is created changes to fit the technology, potentially reducing you to an editor/prompt-engineer. This captures the shift from tool to potential replacement of core agency. It explains the qualitative difference you feel. Put it in her terms: "It's not a better typewriter; it's a different writer."

  **Bottom Line for Your Engineer:** She believes technology should *serve* people who work, not the other way around. A good machine makes the job safer, easier, or faster *without* taking away the worker's say in how it's done or their fair share of what it produces. A bad machine is one that steals jobs, turns workers into machine-minders, or just hands their effort to someone upstairs counting profits. Robots aren't good or evil; it's about who controls them and who benefits. Her job installing them? She makes sure they *work*, but she worries about who they *work for*.

  **What to Drop?** Nothing. Your verdicts are coherent under this principle. The tension in Case 8 is real and reflects the ambiguity of the tech. Your self-checkout usage reflects societal pressure, not hypocrisy. Lean into the engineer's practical wisdom: the principle emerges from her wrench, not a textbook.
