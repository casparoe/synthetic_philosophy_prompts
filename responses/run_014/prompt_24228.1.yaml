answer: |-
  Here are six probing questions with concise follow-ups targeting key vulnerabilities:

  1.  **On Admissible Evidence:** You claim "admissible evidence" rescues the PP, but isn't the core challenge *defining* it non-circularly? Why isn't my knowledge of my own past 'lucky streak' admissible evidence *lowering* the assessed chance of future success?  
      *Follow-up (anticipating "that's not about real chance"): But isn't "real chance" exactly what the PP needs defined independently? Doesn't calling my streak 'inadmissible' just mean it *shouldn't* affect my credence, which is the very norm the PP is trying to establish?*

  2.  **Newcomb & Predictor Priors:** How does the PP *itself*, via admissibility, block the Newcomb reasoner who treats their *current choice* as evidence about the predictor's past action? Doesn't ruling that choice 'inadmissible' presuppose the predictor's accuracy *before* applying the PP?  
      *Follow-up (anticipating "choices aren't evidence for past chances"): But why *aren't* they, if the predictor is reliable? Doesn't labeling the choice inadmissible here implicitly rely on a causal independence the PP itself doesn't provide?*

  3.  **Ontology of Chance:** If "objective chance" is merely our best systematization of frequencies (e.g., Best System Analysis), doesn't the PP collapse into a norm about aligning credences with our *best theories*, making the "objective" label redundant? What work is "objective chance" doing that "best current scientific probability" doesn't?  
      *Follow-up (anticipating "BSA *is* objective chance"): But then isn't the PP just telling us to trust our best model? Why frame it as aligning with a metaphysically robust "chance" if it reduces to epistemic norms about models?*

  4.  **Admissibility & Causality:** Isn't the standard move to declare information about *future* chancy events inadmissible? Doesn't this covertly rely on causal/temporal intuitions (like "no backwards causation") that aren't explicit in the PP formulation? Is admissibility smuggling in causation?  
      *Follow-up (anticipating "admissibility encodes temporal/causal structure"): But if that structure isn't *part* of the PP's definition, haven't we just shifted the mystery to defining admissibility?*

  5.  **Testing Admissibility:** Operationally, how could we *test* if a piece of evidence is admissible? If it's defined by its effect on credence via the PP, doesn't that risk circularity? What independent criterion distinguishes admissible from inadmissible evidence?  
      *Follow-up (anticipating "it's about direct vs. indirect evidence"): But "direct evidence *for the chance*" seems perilously close to defining it as "evidence the PP says you should use," bringing us back to circularity.*

  6.  **Closing: Falsifiability:** What conceivable empirical or theoretical discovery could convince you the Principal Principle, even with your admissible evidence carve-out, is fundamentally *wrong* or not a genuine rational norm?  
      *Follow-up (anticipating "it's constitutive of rationality"): But doesn't that make it unfalsifiable? If no evidence counts against it, is it more a definition than a substantive claim?*

