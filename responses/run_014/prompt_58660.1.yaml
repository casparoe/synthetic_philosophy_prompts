prompt: |-
  So I was at a neighborhood BBQ on Saturday and got trapped listening to two of my neighbors, Maya and Luis, go back and forth for like 40 minutes about this real proposal on our block and I kinda need a ref. The city wants to let a developer tear down this closed auto shop on the corner and put up a 5-story, 48-unit building with 12 below-market units, plus this weird new thing they're trying where every household within 300 feet would get a one-time $2000 stay-put dividend for construction hassle. Maya started it by saying the lot should be a community garden run as a land trust instead, because the people who actually live here and built the community have the real right to the city, and a big building will just make the whole street fancier and push up nearby rents even with a few affordable units, so the dividend is basically a bribe. Luis pushed back that the right to the city has to include people who can't afford to live here right now like bus drivers and cafe workers, that blocking homes just protects insiders while outsiders stay stuck commuting an hour, and that a garden helps like 20 hobbyists while 48 homes house 100+ people, plus even the market-rate units help over time as older apartments get cheaper when people move up. Maya said that filtering thing takes forever in hot neighborhoods and doesn't help anyone getting displaced now, and the 12 affordable units are by lottery in income bands most current renters on the block don't even fit, so all the benefits go to strangers while the noise and shadows and lost parking land on them. Luis finished by saying that's why the dividend and the affordable units exist, the construction pain is temporary and at least partly compensated, and letting just the immediate block veto city housing is like letting only people already in the lifeboat decide who gets pulled in when the shortage is citywide.

  I'm taking this urban studies night class and my prof loves this right to the city stuff but I still get confused about who actually has the stronger arguement here tbh, and Maya and Luis both sounded pretty reasonable at different points so I don't want to just pick a team. Can you adjudicate their back-and-forth for me move by move and tell me who's more right about what, and what big thing they're both not seeing?

  Please organize your answer in exactly this order with these headings: 1. Quick Recap (3-4 sentences), 2. Move-by-Move (one short paragraph for each of the 4 moves, rate each from clearly mistaken to clearly right and say why), 3. What They Are Both Missing (one paragraph, like 5-6 sentences), 4. Bottom Line (2-3 sentences on who is more right overall). Keep it in plain everyday language, no academic jargon dump.
reasoning: |-
  Okay, the user wants me to adjudicate an argument between two neighbors, Maya and Luis, about a proposed development on their block. They had a 40-minute debate about a city proposal to replace a closed auto shop with a 5-story building containing 48 units (12 below-market), plus a $2000 "stay-put dividend" for nearby households. The user is taking an urban studies class but finds the "right to the city" concepts confusing, and wants me to analyze who has the stronger argument without academic jargon.

  I need to structure my response exactly as requested: with Quick Recap, Move-by-Move analysis of their four arguments, What They're Both Missing, and Bottom Line. 

  First, I'll summarize the key points from their debate. Maya argues for a community garden land trust, emphasizing that current residents have rights and that the development would accelerate gentrification despite affordable units. Luis counters that blocking housing excludes people who need homes, like essential workers, and that filtering plus the dividend makes the project fair. Their exchange has four clear moves: Maya's anti-gentrification stance, Luis's pro-housing rebuttal, Maya's displacement concerns, and Luis's compensation and citywide perspective.

  For the Move-by-Move section, I'll rate each argument on a spectrum from "clearly mistaken" to "clearly right." Maya's first point has merit about localized impacts but overstates the "bribe" aspect—it's reasonable but flawed. Luis's response is stronger because housing shortages do require supply solutions, though he underplays displacement risks. Maya's third move is partially right about immediate displacement but ignores broader housing needs, while Luis's final point correctly frames housing as a shared crisis but oversimplifies compensation.

  What both miss is that this is a false binary—community gardens and housing aren't mutually exclusive, and deeper systemic issues like exclusionary zoning or wealth inequality drive the conflict. The city could integrate both goals through design compromises.

  For the Bottom Line, Luis edges out as more right because the housing crisis demands supply increases, and blocking projects perpetuates scarcity. But Maya's warnings about uncompensated harms are valid—the dividend isn't enough, and the city should do more to protect vulnerable renters. Neither side is perfect, but Luis's approach addresses a more urgent need.

  I'll use plain language throughout, avoiding academic terms. The user wants clarity, not a jargon dump, so I'll keep it conversational and balanced.
answer: |-
  Here’s a clear, no-jargon breakdown of Maya vs. Luis:

  **1. Quick Recap:**
  The city wants a 48-unit building (12 affordable) on a closed auto shop lot, giving neighbors $2000 each for construction hassle. Maya argues it should be a community garden land trust instead, fearing the building will raise rents and displace current residents, calling the $2000 a bribe. Luis argues blocking housing hurts people who need homes now (like workers), and that more units (even market-rate) help ease rents citywide over time. Maya counters that rent relief takes too long and the affordable units likely won't help current neighbors, leaving them with all the downsides. Luis says the housing shortage is citywide, and letting only immediate neighbors veto projects is unfair when many need homes.

  **2. Move-by-Move:**

  *   **Maya's 1st Move (Community Garden > Big Building):** **Partially Right, Partially Mistaken.** She's right that a community garden directly serves current residents and avoids immediate displacement/construction pain. However, she's mistaken in dismissing the much larger need met by 48 homes vs. a garden serving far fewer people. Housing is a more critical need than gardening space for most cities. **Rating: Mixed Leaning Mistaken (understates housing need).**
  *   **Luis's 1st Move (Blocking Homes Hurts Outsiders):** **Mostly Right.** He correctly identifies that blocking new housing, especially near jobs/transit, protects current residents at the expense of people struggling to find affordable homes nearby (like essential workers). Filtering (older units getting cheaper) is real, though slow. **Rating: Clearly Right (highlights the bigger housing crisis).**
  *   **Maya's 2nd Move (Affordable Units Won't Help Us, Displacement Now):** **Partially Right.** She's likely correct that the specific affordable units (lottery, income bands) may not benefit *current* block residents facing displacement *now*. The dividend probably doesn't fully offset rent hikes or lost parking. She's right that filtering is slow and unreliable for hot markets. **Rating: Mixed Leaning Right (spotlights legit, immediate local costs).**
  *   **Luis's 2nd Move (Dividend Helps, Block Veto is Unfair):** **Mostly Right.** He's correct that the housing shortage is a city/regional crisis, and letting only the immediate block veto projects ignores the needs of the wider community, especially people desperately seeking housing. The dividend/affordable units *are* attempts (however flawed) to offset impacts. **Rating: Clearly Right (addresses the core inequity of hyper-local control).**

  **3. What They Are Both Missing:**
  Both are stuck in a false choice: *either* build the housing *or* have a community garden. The real problem is the system itself. Cities often lack good tools to ensure new housing *truly* benefits existing communities long-term or builds real community wealth beyond a one-time payment. The underlying issues are city-wide underbuilding (making every project a battle) and policies that pit neighbors against newcomers instead of tackling the root causes like restrictive zoning, lack of tenant protections, and insufficient direct public investment in affordable housing or community land ownership models that *include* housing. The $2000 dividend is a band-aid, not a solution to displacement fears, and a land trust garden, while valuable, dodges the massive need for homes.

  **4. Bottom Line:**
  **Luis has the stronger overall argument.** The acute need for more housing, especially near existing amenities, outweighs the specific (but real) harms Maya identifies. Blocking housing in accessible areas hurts more people than it helps, especially lower-income folks struggling to live near jobs. Maya rightly points out the project's flaws (weak affordability targeting, inadequate compensation), but her solution (no building, just a garden) doesn't solve the bigger housing crisis Luis highlights. The fairest path likely involves building housing *plus* stronger community benefits and protections than currently offered.
