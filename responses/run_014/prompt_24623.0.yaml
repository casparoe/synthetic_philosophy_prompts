  Hmm... the key has to be premise (2). The user wants a concrete counterexample - not just theory - showing different actions. I recall Gettier cases where true belief fails unexpectedly. What if we design a situation where the lucky believer's confidence is fragile? 

  Imagine a wartime scenario: Commander has two intelligence sources. Source A (knowledge) provides verified intel about enemy positions. Source B (lucky belief) gives the same correct intel but through misinterpreted data. When new contradictory information arrives, the Commander would likely dismiss it with Source A but panic with Source B. The actions differ: steadfast planning vs chaotic contingency prepping. 

  This exposes how knowledge provides resilience that mere true belief lacks. The "better" manifests not in identical situations, but when beliefs are tested. The user's premise (2) assumes static conditions, but reality has dynamic challenges. 

  I should also address premise (1). The user fears "better" being decorative, but epistemic value isn't just instrumental. Knowledge has intrinsic worth - it's what true belief aspires to be. Still, the practical difference under pressure should satisfy their demand for tangible payoff. 

  The cost of rejecting (2)? Accepting that cognitive states have dispositional differences even when not immediately observable. But that's realistic - we evaluate medical treatments not just by current symptoms but by resilience to future complications. 

