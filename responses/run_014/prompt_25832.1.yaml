  Okay, the user is part of a reading group stuck on the ethics of procreative beneficence versus eugenics concerns. They want an adversarial-collaboration document to bridge the gap. Let me start by understanding their core needs. 

  First, the group has two sides: one supporting Savulescu's principle that parents should select embryos with the best expected life, and the other seeing this as dehumanizing and a slippery slope to eugenics. The user mentions they're talking past each other, so the document needs to clarify common ground and precise disagreements.

  The user specified three sections: agreed claims, a disagreements table, and cruxes with testable predictions. I need to ensure each part is non-vacuous. For the agreed claims, I recall both sides likely accept technologies like PGD exist but have limitations, and the non-identity problem complicates harm claims. Historical context about eugenics being state-coerced versus modern choice-based selection is key here. I should list points both can sign without watering down.

  Next, the disagreements table. Each entry must be phrased so each side recognizes their view. For example, the proponent sees selection as preventing harm, while the critic sees it as discriminatory. Need precise wording. Also, the parent-child relationship: is it about maximizing welfare or unconditional acceptance? The expressivist argument—does selecting against disability express disrespect regardless of intent?

  For cruxes, the user suggested two: whether selection is continuous with postnatal enhancement, and if disabilities can be dispreferred without contradiction. But I need deeper cruxes. The moral continuity point is good—would both sides treat embryo selection like giving a child medication? Another crux is whether societal injustice affects selection decisions. Also, the expressivist argument's dependency on societal context: if society were just, would selecting against disability still be wrong?

  Testable predictions are crucial. For the enhancement continuity, a case like choosing a non-diabetic embryo versus managing diabetes postnatally. Proponent sees both as beneficent, critic sees selection as different because it rejects a potential person. For societal injustice, the Down syndrome case: if discrimination decreased, would selection rates drop? Critic says yes, proponent says maybe not. This shows if selection is about societal bias or individual welfare.

  I should check if the user’s unspoken needs are about fostering productive dialogue. They might want the group to move beyond stalemate by focusing on empirical cruxes. Highlighting testable predictions can shift debates from abstract to concrete, helping resolve disagreements. Also, ensuring the document respects both views without strawmanning is vital for buy-in. Balancing technical terms like non-identity problem with accessibility will help the group engage. Finally, clarifying that both sides value child welfare but differ on methods could reduce polarization.
answer: |-
  Here’s an adversarial-collaboration document designed to clarify disagreements, establish common ground, and identify testable cruxes for your reading group:

  ---

  ### **Adversarial Collaboration: Procreative Beneficence & Eugenic Concerns**

  **Preamble:**  
  This document identifies points of agreement and precise disagreements between defenders of *Procreative Beneficence* (PB) and its critics, focusing on concerns about "eugenic logic." Signatories agree on the factual and ethical claims below while acknowledging unresolved disputes in Section 2.

  ---

  ### **1. Agreed Claims (Non-Vacuous, Signable by Both Sides)**
  1. **Technology’s Scope:**  
     Preimplantation Genetic Diagnosis (PGD) can identify some genetic conditions linked to reduced health, cognition, or sensory function, but cannot predict complex traits (e.g., intelligence, personality) or guarantee "best life" outcomes due to environmental unpredictability and polygenic influences.

  2. **Non-Identity Problem’s Limits:**  
     While the non-identity problem shows that selecting *against* a disabled embryo may not *harm* that specific future child (as they wouldn’t exist otherwise), it does *not* resolve whether the act is *morally wrong* for other reasons (e.g., expressiveness, social consequences).

  3. **Harm vs. Wronging Distinction:**  
     Deliberately causing prenatal harm (e.g., fetal alcohol syndrome) is uncontroversially wrong. However, *not selecting* an embryo with a disability is distinct: it may constitute a *wrong* against disabled people or society without being a *harm* to the unselected potential child.

  4. **Historical Nuance:**  
     20th-century eugenics was characterized by state coercion, pseudoscience, and racism. Modern reproductive selection is typically voluntary, private, and grounded in medical genetics. Nevertheless, *both sides agree* that historical eugenics movements exploited rhetoric of "improving society," highlighting the need for vigilance against similar patterns.

  5. **Parental Motivations:**  
     Most parents using selection technologies seek to avoid severe medical suffering for their child, not to engineer "optimal" traits. Critics accept this motivation but argue societal effects may diverge from intent.

  ---

  ### **2. Disagreements Table**
  | **Issue** | **Proponent View (PB Defender)** | **Critic View (PB Opponent)** |
  |-----------|----------------------------------|-------------------------------|
  | **Moral Foundation of Selection** | "Prospective parents have a *prima facie* moral obligation to select the embryo (among those available) expected to have the most well-being, provided selection doesn’t impose significant burdens." | "The moral core of procreation is unconditional acceptance; ranking embryos commodifies future persons and instrumentalizes the parent-child relationship." |
  | **Disability & Discrimination** | "Selecting against disabilities is analogous to preventing disease: it aims to reduce disadvantage, not to devalue existing disabled people." | "Systematically selecting against disabled embryos *expressively devalues* disabled lives by treating disability as incompatible with a life worth creating, reinforcing harmful social narratives." |
  | **Slippery Slope Validity** | "PB is constrained by parental autonomy and medical ethics; it does not entail state coercion or selection for non-health-related traits." | "PB’s logic of 'well-being optimization' normalizes comparative valuation of lives, creating cultural pressure for enhancement and coercive policies (e.g., 'duty' to select)." |
  | **Scope of 'Well-Being'** | "'Best expected life' is primarily defined by absence of severe health limitations that impede flourishing, not socially valued traits." | "All conceptions of 'well-being' embed subjective/cultural biases; allowing any well-being-based selection opens the door to neoliberal self-optimization." |

  ---

  ### **3. Cruxes: Testable Disagreements**
  #### **Crux 1: Moral Continuity of Selection & Enhancement**  
  **Question:** Is embryo selection *morally equivalent* to postnatal medical interventions?  
  - **Concrete Case:** Selecting an embryo without a genetic predisposition to high-risk diabetes vs. providing lifelong insulin/management to a diabetic child.  
  - **Proponent Prediction:** Both acts are beneficent; selection is preferable as it prevents suffering more effectively.  
  - **Critic Prediction:** Selection rejects a *potential person* based on traits, while postnatal care affirms an existing person. Only the latter is morally permissible.  

  #### **Crux 2: Expressivism & Social Context**  
  **Question:** Does selecting against disability express disrespect *even if* disability is dispreferred solely due to unjust social barriers?  
  - **Concrete Evidence:** Societies that reduce discrimination against disabled people (e.g., robust accessibility, anti-bias laws). Does PB-driven selection *decrease*?  
  - **Proponent Prediction:** Selection rates correlate with medical severity, not social progress. Severe impairments (e.g., Tay-Sachs) remain selected against.  
  - **Critic Prediction:** If discrimination falls, selection rates drop for disabilities compatible with high well-being (e.g., Down syndrome), proving social bias drives "dispreference."  

  #### **Crux 3: Parental Motivation vs. Systemic Effect**  
  **Question:** Can PB remain a private, welfare-focused choice without enabling aggregate eugenic outcomes?  
  - **Concrete Case:** Widespread PGD for low-risk conditions (e.g., deafness) in a society with declining disability support funding.  
  - **Proponent Prediction:** Parents prioritize severe suffering; marginal conditions see low uptake. No slippery slope.  
  - **Critic Prediction:** Normalization leads to selection for minor traits, eroding support for disability rights as "avoidable."  

  ---

  ### **Conclusion for Dialogue**  
  This framework reveals that key disputes turn on:  
  - Whether disability selection is **medically necessary or socially influenced** (Crux 2),  
  - Whether **prevention and rejection are morally distinct** (Crux 1),  
  - Whether **systemic effects can be decoupled from individual choice** (Crux 3).  
  Resolving these empirically (e.g., studying selection trends in social democracies vs. medicalized societies) may break the deadlock. Both sides agree, however, that societal support for disabled people is morally urgent *regardless* of PB’s validity.

  --- 

  This document forces clarity by separating agreed facts from value conflicts and identifying falsifiable claims. It respects both positions while challenging each to confront their weakest premises. Would your group consider drafting responses to the crux predictions as a next step?
