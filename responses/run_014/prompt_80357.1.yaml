  Your intuitions across these scenarios reveal a tension between causal and evidential reasoning in decision theory, particularly when past predictions constrain present choices. I'll synthesize a principle that captures your verdicts, explain why the mugging/one-boxing pair feels different despite structural similarities, and apply it to the 95% predictor case. The core principle is **causal influence constrained by logical possibility (CICLP)**.

  ### The CICLP Principle
  1. **Causal Influence**: Your action should only be taken if it can *causally* affect the outcome. If an outcome is already fixed (e.g., by a past event your action can't change), paying provides no benefit.
  2. **Logical Possibility**: If an infallible predictor has already predicted your action, choosing contrary to that prediction is logically impossible (it would create a contradiction). Thus, you can only "choose" the predicted action, even if it seems suboptimal.
  3. **Evidential Reasoning**: When your action provides *evidence* about a fixed past event (e.g., the predictor's decision), but doesn't causally affect it, prioritize the action that correlates with a better past outcome—*only if* logical possibility isn't violated.

  This principle preserves your intuitions by distinguishing cases where your action is:
  - **Causally active** (e.g., the hacker case: paying *causes* the leak).
  - **Evidentially relevant but causally inert** (e.g., Newcomb: one-boxing correlates with the predictor having put $1M in the box).
  - **Logically constrained** (e.g., mugging cases: deviating from the prediction is impossible).

  ### Applying CICLP to Your Cases
  1. **Infallible Predictor Mugging (don't pay)**  
     - **Causal Influence**: The mugger is already en route; paying $10 doesn't stop him. You lose $100 regardless, so paying costs extra.  
     - **Logical Possibility**: The predictor infallibly predicted you won't pay. Paying would contradict this, so it's logically impossible.  
     - **Verdict**: Don't pay (as you said). Paying fails causal influence and logical possibility.

  2. **Time-Traveler Mugging (don't pay)**  
     - **Causal Influence**: Paying $10 *could* causally stop the mugger (unlike the first case). But...  
     - **Logical Possibility**: The time traveler "saw" you refuse, meaning your refusal is fixed. Paying would create a paradox (e.g., "Why did he come if I pay?"), so it's logically impossible.  
     - **Verdict**: Don't pay (as you said). Logical possibility overrides causal influence.

  3. **Newcomb's Problem (one-box)**  
     - **Causal Influence**: Your choice doesn’t affect the box contents (fixed by the predictor). Taking the small box gains $1 without losing the $1M.  
     - **Evidential Reasoning**: One-boxing *correlates* with the predictor having put $1M in the big box. Since both choices are logically possible (the predictor can correctly predict either), you exploit the correlation.  
     - **Why it feels different from mugging**: In Newcomb, your action isn't *constrained* by the prediction—it's *correlated* with it. You can freely choose one-boxing because it doesn’t contradict the predictor (it predicted your choice correctly). In mugging, paying *would* contradict the prediction, violating logical possibility.  
     - **Verdict**: One-box (as you said). Evidential reasoning applies, and causal irrelevance is irrelevant here.

  4. **Hacker Blackmail (don't pay)**  
     - **Causal Influence**: Paying $50 *causes* the leak. Not paying avoids it entirely.  
     - **No prediction constraint**: No infallible predictor forces your hand.  
     - **Verdict**: Don't pay (as you said). Pure causal reasoning.

  ### The Mugging/One-Boxing Dilemma: Why They *Seem* Identical but Aren't
  - **Similarity**: Both involve a fixed past (predictor's decision) and causally irrelevant actions.  
  - **Difference**:  
    - In mugging, the predictor *specifically* predicted your **refusal**. Paying violates this, making it *logically impossible*.  
    - In Newcomb, the predictor predicted your *choice* (one-box or two-box), but either choice is logically consistent. You can *use* the correlation to your advantage.  
  Your "fool/smart" feeling arises because mugging demands *fatalism* (you must comply with the prediction), while Newcomb allows *evidential optimization* (you choose the action that signals a better past).

  ### The 95% Predictor Case: Pay
  - **Setup**: Predictor is 95% confident you won’t pay. Mugger is *probably* en route. Paying $10 cancels the job.
  - **CICLP Analysis**:  
    - **Logical Possibility**: The predictor is fallible (not 100% accurate), so paying doesn’t create a contradiction. It’s logically possible.  
    - **Causal Influence**: Paying *causally* cancels the mugging.  
    - **Expected Utility Calculation**:  
      - *Don’t pay*: 95% chance lose $100, 5% chance lose $0. Expected loss = $95.  
      - *Pay*: Certain loss of $10.  
    Paying saves $85 in expectation.  
  - **Verdict**: Pay. Fallibility removes the logical constraint, so causal influence dominates.

  ### Which Intuition Must Be Dropped?
  - **The tension**: Your mugging verdicts (don’t pay) conflict with causal reasoning in the time-traveler case (where paying *could* help). CICLP resolves this by prioritizing logical impossibility over causal potential.  
  - **What you might drop**: If you cling to *pure causal decision theory* (CDT), you’d pay in the time-traveler case—but your intuition rejects this. CICLP honors your intuition by adding logical constraints.  
  - **Cost**: Accepting that infallible predictions restrict your "choices" feels fatalistic, but it avoids contradictions. The gain is consistency across scenarios.

  ### Final Principle Statement
  > **CICLP (Causal Influence Constrained by Logical Possibility)**:  
  > - If an action is *logically impossible* (e.g., contradicts an infallible prediction), reject it.  
  > - Else, if the action *causally influences* the outcome, maximize expected utility.  
  > - Else, if the action is *evidentially relevant* to a fixed past event (but logically possible), choose the action that correlates with a better past outcome.  

  This preserves all your verdicts. It forces you to accept that the mugging cases are fatalistic (no free choice to pay), while Newcomb is evidential (free choice to optimize). The 95% case falls to causal reasoning. The key is whether your action *can* exist in the same universe as the predictor’s infallibility.
