  We are going to translate the Frege-Geach problem and expressivist semantics into the vocabulary of programming languages and formal semantics.

  ## Core Concepts in Expressivism and the Frege-Geach Problem

  1. **Expressivism**: The core idea is that the meaning of a moral sentence (like "Lying is wrong") is not a truth-conditional proposition but an expression of an attitude (e.g., disapproval). In our terms, the denotation of an atomic moral sentence is a non-propositional object (like a function that expresses a state of mind).

     - Example: "Lying is wrong" is mapped to an action/attitude: `BOO(lying)`.

  2. **Compositionality Challenge**: The problem arises when we embed such a sentence in a conditional. The conditional antecedent does not express an attitude (it is not asserted) but must contribute to the meaning of the compound sentence. Moreover, we want the inference rules (like modus ponens) to be valid.

     - Example: Consider the conditional: "If lying is wrong, then getting your little brother to lie is wrong." This is represented as: `BOO(lying) → BOO(getting-your-brother-to-lie)`. But what is the type of the conditional? And what is the meaning of the whole?

  3. **The Frege-Geach Insight**: The same expression must have the same meaning in embedded and unembedded contexts. Therefore, we cannot assign one meaning (an attitude) when used in isolation and a different one (a proposition) when embedded.

  ## Translation into PL Concepts

  We can model the meaning of sentences as denotations in a formal system. Let's define:

  - Let `Prop` be the type of propositions (which are truth-conditions, i.e., functions from worlds to booleans). But expressivists don't want moral sentences to denote in `Prop`.

  - Instead, expressivists initially assign moral sentences a type `Attitude` (which might be a function from states to states, or a state transformer, or a speech act). But then we need to lift this to work in embedded contexts.

  ### Attempt 1: Naive Expressivism (which fails)

  - Atomic non-moral sentence: `snow is white` : `Prop`
  - Atomic moral sentence: `lying is wrong` : `Attitude`

  But then how do we handle:

     - `if lying is wrong, then ...` : We need a conditional that takes an `Attitude` and something else? The type of the conditional would have to be `Attitude -> Attitude -> ???` which doesn't match the usual `Prop -> Prop -> Prop`.

  ### Compositionality Requirement

  We require that the meaning of a complex expression is a function of the meanings of its parts. So we need to assign a uniform type to all sentences (whether moral or non-moral) so that they can be arguments to the same logical connectives.

  ### Proposed Solutions in PL Terms

  #### 1. Gibbard's Solution (Hyperplans)

  Gibbard (in "Thinking How to Live") proposes that moral sentences express a state of mind that is a plan (a hyperplan). He then gives a propositional content to moral sentences by relativizing to hyperplans.

  - We can think of a hyperplan as a function from situations to actions (or norms). Then, the meaning of a sentence is a set of hyperplan-world pairs (or a function from hyperplans to functions from worlds to truth values). So effectively, he lifts the type of moral sentences to the same level as propositions: they become functions of type `Hyperplan -> World -> Bool` (i.e., a kind of generalized proposition).

  - Now, the type of any sentence (moral or non-moral) becomes `HProp = Hyperplan -> World -> Bool`.

  - The conditional is then defined as the usual material conditional on `HProp`: 
     - `p → q = λh.λw. p h w → q h w`

  - This allows modus ponens: if `p` is true at (h, w) and `p→q` is true at (h, w), then `q` is true at (h, w).

  - The atomic non-moral sentence `snow is white` is interpreted as: `λh.λw. snow-is-white(w)`
  - The atomic moral sentence `lying is wrong` is interpreted as: `λh.λw. h disapproves-of(lying) at w`? But note: in Gibbard's account, the hyperplan is what determines what is wrong. So: `lying is wrong` is true at a hyperplan h and world w iff h prescribes disapproving of lying in w.

  - Now, the conditional is compositional: the antecedent and consequent are both of type `HProp`, and the conditional takes two `HProp`s and returns an `HProp`.

  #### 2. Blackburn's Solution (Quasi-Realism and Attitudinal Logic)

  Blackburn's approach is to maintain that the fundamental meaning is still attitudinal but to define a logic of attitudes. He uses a notion of "attitudinal commitments" and defines logical connectives in terms of the consistency of attitudes.

  - We can model this by having a base type `Attitude` and then defining a monadic structure over it to handle composition. Alternatively, we can use continuation semantics.

  - Idea: The meaning of a sentence is not an attitude but a function that takes a continuation (which represents the context) and returns a complex attitude.

    - Let `K` be the type of continuations (which might be functions from attitudes to ...?).

  - However, a more straightforward way is to use the "expression" of attitudes as building blocks for complex expressions. For instance, the conditional might express a higher-order attitude: to accept the conditional is to have a disposition to disapprove of getting one's brother to lie if one disapproves of lying.

    - We might represent: 
          `p → q` as `λatt. if att(p) then q`
      but note that `att(p)` is not a boolean but an attitude state? 

  - Alternatively, in a functional setting, we can think of an attitude as a state transformer. Then:

     - Let `State` be the type of cognitive states (which include the agent's attitudes).
     - An atomic moral sentence `p` denotes a state transformer: `State -> State` (e.g., `boo(lying)` would be a function that updates the state to include disapproval of lying).

  - Then, what is the meaning of the conditional? We want to update the state with a conditional norm. We can define:

          p → q  =  λs. if p is accepted in s then q s else s

     But note: the antecedent `p` is not asserted, so we cannot just apply `p` to the state. We need to test the state for the attitude expressed by `p`.

  - So we need a way to "check" the attitude without updating. This is where Blackburn's idea of "commitment" comes in: the state must be such that if it comes to include the attitude for `p`, then it must also include the attitude for `q`.

     - We might represent the conditional as introducing a constraint on the state: `s` must be such that if we update with `p` (resulting in state `s' = p(s)`) then updating `s'` with `q` is consistent (or required). But note that this is a constraint on the state, not an update.

  - This leads to a two-dimensional system: one dimension for the state and one for the constraints? This becomes complex.

  ### Uniform Type for Compositionality

  The key move in both Gibbard and Blackburn (and other expressivists) is to assign a uniform semantic type to all sentences (moral and non-moral) that can be composed by logical operators.

  - In Gibbard, the type is `HProp` (hyperplan-world pairs to truth values).
  - In Blackburn, it's less clear, but we might think of the type as a function from states to states and constraints? This is where the mapping becomes less straightforward.

  ## Residue Report

  ### What Translates Cleanly

  1. **Compositionality Requirement**: This is exactly the same in both fields. We need the meaning of a complex expression to be a function of the meaning of its parts. The Frege-Geach problem is fundamentally a compositionality failure in the naive expressivist semantics.

  2. **Type Mismatch**: The initial expressivist assignment of an atomic moral sentence to a non-propositional type (like `Attitude`) and the need to embed it in a context that expects a proposition (like the antecedent of a conditional) is a classic type mismatch. We see this in programming languages when we have a value of type `A` in a context that expects type `B`, and we don't have a coercion.

  3. **Solutions via Type Lifting**: Both Gibbard and Blackburn can be seen as providing a uniform type:

     - Gibbard: Lift to `HProp` (which is a form of possible worlds semantics with an extra parameter). This is analogous to adding an environment or a reader monad: `Reader Hyperplan (Reader World Bool)`.

     - Blackburn: We might model it as a monad that combines state (attitudes) and continuations? But this is less direct.

  4. **Modus Ponens**: The validity of modus ponens is preserved by ensuring that the conditional is defined truth-conditionally on the lifted type (in Gibbard) or by defining the conditional in terms of state updates that respect the constraint (in Blackburn). This is analogous to proving a soundness theorem for an operational semantics.

  ### What Had to be Fudged

  1. **Cognitive States and Attitudes**: The exact nature of attitudes (disapproval, etc.) and how they are represented in the state is not as formally precise as we are used to in PL. We modeled them as state transformers, but the philosophical account is often more vague.

  2. **Blackburn's Solution**: The quasi-realist project is more about showing that the logic of attitudes can mimic propositional logic, but the underlying machinery (using constraints on states) is not as formally developed as Gibbard's. We had to speculate about the type.

  3. **Hyperplans**: While we can model hyperplans as additional parameters, the philosophical interpretation of hyperplans (as plans about what to do in various situations) is specific to metaethics and doesn't have a direct counterpart in PL. However, the technical move (adding a parameter) is standard.

  ### What Doesn't Map: The Specifically Metaethical Stakes

  The Frege-Geach problem is not just about compositionality. It is also about preserving the core expressivist thesis: that moral language is fundamentally non-representational. The challenge is to have a compositional semantics without giving up on non-cognitivism.

  - In Gibbard's account, we have lifted moral sentences to a proposition-like type (`HProp`), but note that `HProp` is still tied to attitudes: it is defined in terms of hyperplans, which are plans (non-cognitive states). So the non-cognitivist can say: moral sentences do not represent mind-independent facts, but they do represent the requirements of hyperplans. This is a form of non-cognitivism.

  - The residue: the philosophical debate about whether this counts as a form of realism or not. In PL terms, we don't care about the philosophical labels, but we do note that the expressivist must ensure that the uniform type does not collapse into plain realism (i.e., that the hyperplan parameter is doing the work of capturing the non-cognitive aspect).

  Another non-technical aspect is the explanation of moral disagreement: expressivists want to explain moral disagreement as a clash of attitudes, not as a contradiction in beliefs. The compositional semantics must also account for this. For instance, in Gibbard's account, two people disagree if their hyperplans are incompatible with respect to the same world.

  ### Conclusion

  Yes, the Frege-Geach problem is fundamentally about compositionality: the need for a uniform type that can be used in any context. The expressivists spent time without such a semantics, but then developed it. However, the specifically metaethical part is the constraint that the solution must preserve the non-representational character of moral language. 

  In PL terms, we can see the solution as a form of monadic lifting (like the reader monad for Gibbard) or a continuation-passing style (for Blackburn) to handle the side effects (attitudes) in a compositional way. The residue is the philosophical interpretation of the additional parameters or monadic effects as non-cognitive states.

  So the answer to your question is: the core is compositionality, but the metaethical part is the requirement that the compositionally assigned meanings must still be grounded in non-cognitive attitudes and not collapse into straightforward truth-conditional semantics. The translation is honest, and the residue is the philosophical constraint on the interpretation of the formal machinery.
answer: |-
  ### Translation of the Frege-Geach Problem into PL/Semantics Vocabulary  
  The Frege-Geach problem is indeed a **compositionality failure** in the expressivist semantics. Below, I map the metaethical framework and problem to programming languages (PL) and formal semantics constructs. I use types, denotations, contexts, and compositionality primitives, preserving the core structure of the debate.

  ---

  #### **1. Expressivist Starting Point: Non-Referential Denotations**  
  - **Claim**: Atomic moral sentences (e.g., "Lying is wrong") denote **non-propositional, attitude-expressing actions**.  
  - **PL Translation**:  
    - Let `Prop` be the type of truth-apt propositions (worlds → `Bool`).  
    - Let `Attitude` be a type of non-cognitive states (e.g., `Disapproval`, `Endorsement`).  
    - Moral sentences have **denotations** in a **monadic type** `Action Attitude`, where:  
      ```haskell
      type Action a = State -> (a, State)  -- State: cognitive state of the agent
      ```  
      Example: `lying_wrong : Action Disapproval`  
      Semantics: `BOO(LYING) ≡ λs. (Disapproval(lying), s')` (updates state `s` to `s'`).  
    - Non-moral sentences (e.g., "Snow is white") denote in `Prop`.  

  - **Compositionality Issue**: Moral/non-moral sentences have **different types** (`Action Attitude` vs. `Prop`). This breaks uniform function application under logical operators.

  ---

  #### **2. Embedding Challenge: Type Mismatch in Contexts**  
  - **Problem Case**: Conditional embedding, e.g.,  
    `If (lying is wrong) then (getting your brother to lie is wrong)`.  
  - **PL Formalization**:  
    - The conditional `If P then Q` expects `P, Q : Prop` (to compute truth values).  
    - But `lying_wrong : Action Attitude` ≠ `Prop`.  
    - **Result**: Type error in the **evaluation context**:  
      ```haskell
      If : Prop -> Prop -> Prop  -- Type signature
      If (lying_wrong) ...       -- Type mismatch: expected Prop, got Action Attitude
      ```  
    - **Modus Ponens Failure**:  
      - Premises: `P → Q` (conditional) and `P` (asserted) must share denotational content.  
      - But `P` asserted: `Action Attitude` (e.g., updating state with disapproval).  
      - `P` embedded: Must be `Prop` to satisfy `If`.  

  ---

  #### **3. Solutions: Uniform Typing via Monadic Lifting**  
  Expressivists resolve this by **lifting attitudes into a proposition-like type** that supports composition.  

  ##### **a. Gibbard’s Hyperplans (Norm-Relativized Propositions)**  
  - **Core Idea**: Moral sentences denote **functions from hyperplans (normative plans) to truth values**.  
  - **PL Translation**:  
    - Introduce a type `Hyperplan` (a function specifying norms for all possible situations).  
    - Redefine denotations as:  
      ```haskell
      MoralProp = Hyperplan -> World -> Bool   -- ≈ Prop, but hyperplan-relativized
      ```  
    - Lifting: `lying_wrong : MoralProp`  
      Denotation: `λh w. h disapproves-of(lying) at w`.  
    - **Conditional Composition**:  
      `If : MoralProp -> MoralProp -> MoralProp`  
      `If p q = λh w. p h w → q h w`  -- Material implication.  
    - **Modus Ponens**: Preserved via uniform application of `MoralProp`.  

  ##### **b. Blackburn’s Attitudinal Logic (Commitment-Based Semantics)**  
  - **Core Idea**: Atomic attitudes generate **commitments**; logical operators combine commitments.  
  - **PL Translation**:  
    - **Continuation-Passing Style (CPS)**:  
      - Let `Answer = (State -> State) -> State -> State` (continuations transforming states).  
      - Moral sentences denote **functions taking continuations**:  
        ```haskell
        type Moral = (Action Attitude -> Answer) -> Answer
        ```  
      - `lying_wrong : Moral`  
        Denotation: `λk. k (BOO(LYING))`  (feeds `BOO(LYING)` into continuation `k`).  
    - **Conditional as Commitment Combiner**:  
      ```haskell
      If : Moral -> Moral -> Moral
      If p q = λk. p (λatt_p. q (λatt_q. k (λs. (att_q s') where (_, s') = att_p s)))
      ```  
      Semantics: "If I commit to disapproving lying, I must also commit to disapproving getting your brother to lie."  

  ---

  ### **Residue Report: What Translates, What Doesn’t**  
  #### **Clean Translations**  
  | Metaethics Concept              | PL/Semantics Construct                         | Correspondence                                                                 |  
  |---------------------------------|-----------------------------------------------|--------------------------------------------------------------------------------|  
  | Atomic moral sentences          | `Action Attitude` monad                       | Non-propositional denotations as state-transformers.                           |  
  | Embedding problem               | Type mismatch in evaluation context           | `If` expects `Prop`, receives `Action Attitude` → compositionality failure.   |  
  | Gibbard’s solution              | Relativized propositions (`MoralProp`)        | Lifting to hyperplan-indexed `Prop`-like type.                                |  
  | Blackburn’s solution            | CPS semantics                                 | Continuations mediate attitudinal commitments.                                |  
  | Modus Ponens validity           | Soundness proof for lifted types              | Uniform type ensures MP holds for `MoralProp`/`Moral`.                        |  

  #### **Fudged/Approximate Mappings**  
  1. **Attitudes as Monadic Actions**:  
     - Expressivist "attitudes" are mapped to `Action Attitude`, but real-world attitudes (e.g., disapproval) are fuzzy, context-dependent relations. PL models them as precise state updates.  
     - **Fudge**: We ignore granularities (e.g., degrees of disapproval) for simplicity.  

  2. **Blackburn’s Commitments in CPS**:  
     - The CPS translation captures *structural* commitment-combining but lacks Blackburn’s quasi-realist interpretation (e.g., "truth" as the "space of attitudes").  
     - **Fudge**: We treat commitments as syntactic continuations, not metaphysical constructs.  

  #### **Irreducible Metaethical Residue**  
  The Frege-Geach problem **is not merely** "denotations don’t compose." It embeds two metaethical-specific constraints:  
  1. **Non-Representationalism**:  
     - Expressivists insist moral language **does not denote mind-independent facts**.  
     - PL analogue: `Action Attitude` avoids `Prop`.  
     - **Residue**: The PL translation *formally* solves compositionality but doesn’t preserve the **anti-realist metaphysics**. For instance, `MoralProp` is truth-apt (contra expressivism’s core). Gibbard addresses this by interpreting `MoralProp` as planning-based, not factual.  

  2. **Explanation of Logical Inference**:  
     - Expressivists need to explain why modus ponens *feels compelling* for moral conditionals without invoking truth-conditional semantics.  
     - PL analogue: Soundness proofs for `MoralProp`/`Moral` show inference *works*, but don’t explain *why agents accept it*.  
     - **Residue**: The "force" of moral logic (e.g., "You *must* accept Q if you accept P and P→Q") ties to **practical rationality**, not just denotational composition.  

  ---

  ### **Conclusion: Is This Just Compositionality?**  
  Yes, **at its core**, the Frege-Geach problem is a compositionality failure: expressivism initially lacks a uniform type for sentences across embedded/asserted contexts. Solutions (Gibbard, Blackburn) are essentially **type-lifting operations** (`MoralProp`, CPS) familiar to PL.  

  **However**, the residue is **specifically metaethical**:  
  - The solution must preserve **non-representationalism** (no collapse into `Prop`).  
  - It must explain **normative force** ("why *should* modus ponens hold for attitudes?").  

  In PL terms, this is like requiring a monad to not just *work* but also *explain computational effects* (e.g., why `IO` actions "feel stateful"). The Frege-Geach problem is compositional, but its *stakes* are grounded in metaethical commitments. You’re not missing anything technical—just the philosophical weight of "attitudes vs. propositions."
