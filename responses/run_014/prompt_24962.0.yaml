answer: |-
  **Activity: "The Persuasion Machine"**

  **Bottom Line:** Students experience an unpublished "thought experiment" (an intuition pump), analyze *how* it swayed them (narrative/rhetorical moves), then map findings to Dennett's categories *after* the debrief.

  **Rules:**
  1.  **No Spoilers:** Students must not reveal the scenario's conclusion during group work.
  2.  **Focus on Mechanics:** Analyze *how* it persuaded, not *whether* it's true/correct.
  3.  **Descriptive First:** Report *what* they noticed before labeling techniques.

  **Materials:**
  1.  **Handout 1:** "The Philosopher's Virus" Scenario (See below).
  2.  **Handout 2:** Reaction & Analysis Sheet (Prompts: A. Initial gut feeling? B. What part grabbed attention MOST? C. What detail felt most convincing? D. What sentence/moment made you lean towards the conclusion? E. What words/phrases felt loaded or significant? F. Any narrative tricks used?).

  **The Philosopher's Virus (Scenario):**
  > "Imagine scientists discover a microscopic entity, the 'Philosopher's Virus.' It doesn't cause disease. Instead, it subtly alters neural pathways *only* in the brain regions associated with complex, abstract reasoning about self, purpose, and morality. Infected individuals develop an unshakeable, vivid *feeling* – an undeniable inner certainty – that they possess a non-physical 'soul' guiding their decisions. Crucially, brain scans show *zero* structural or functional differences in regions governing basic perception, motor control, or simple learning compared to uninfected people.
  >
  > "Now, consider Subject Alpha. Before infection, Alpha was a staunch materialist neuroscientist, convinced consciousness arises solely from brain processes. After a lab accident infects Alpha, they report an overwhelming, profound sense of a 'true self' – a soul – distinct from their physical brain. Alpha passionately argues *from this inner feeling* that materialism *must* be false. They design intricate experiments, all of which show their reasoning, perception, and behavior remain scientifically indistinguishable from pre-infection, *except* for this intense conviction about the soul and its arguments against materialism.
  >
  > **The Crucial Question:** Does Subject Alpha's powerful, post-infection *feeling* of having a soul provide *any* reliable evidence *at all* that a soul *actually* exists?"

  **Timeline (90 mins total):**

  1.  **Cold Open & Reading (5 mins):** Distribute Handout 1. Instruct: "Read this scenario *carefully* and *silently*. Form your own answer to the Crucial Question at the end. Keep it to yourself."
  2.  **Initial Reaction Capture (10 mins):** Distribute Handout 2. Instruct: "Answer prompts A-F *individually* based *only* on your reading. Focus on your *immediate reactions* and *what stood out* in the text."
  3.  **Group Reverse-Engineering (25 mins):** Form groups of 3-4. Instruct: "**DO NOT share your answer to the Crucial Question yet.** Your task is *only* to pool your observations from Handout 2. Identify specific words, sentences, details, or narrative structures in the scenario that you think were deliberately placed to *persuade* the reader towards a particular view on the Crucial Question. *How* did they try to make it work? Compile a list of these 'persuasive moves' with examples from the text."
  4.  **Class Share & Compile Moves (15 mins):** Groups report their top 1-2 persuasive moves + examples. Instructor lists these verbatim on the board (e.g., "Contrast: 'staunch materialist' vs. 'passionately argues'", "Loaded Word: 'unshakeable, vivid feeling'", "Crucial Detail: 'scientifically indistinguishable... *except*'").
  5.  **Debrief & Theory Mapping (20 mins):**
      *   Reveal this was an "intuition pump" (define briefly).
      *   Ask: "How many initially leaned towards 'No, the feeling isn't evidence'?" (Most will). "Why?" (Highlight how moves steered them).
      *   **Connect to Dennett:** Go through the board list. Ask: "Which of Dennett's 'tricks' does this map onto?"
          *   *Striking Detail:* "Lab accident," "microscopic entity," "Subject Alpha" (scientific veneer).
          *   *'Surely' (Implied):* The framing implies "Surely a *virus* can't create *real* evidence?"
          *   *False Innocence:* Posing as a neutral 'crucial question' while stacking the deck.
          *   *Rhetorical Question:* The final question itself.
          *   *Narrative Compression:* The whole Alpha story arc.
          *   *Dialectical Freeze:* Focusing solely on the *feeling* vs. physical evidence, ignoring other arguments for/against souls.
      *   Discuss: What was the *target intuition* being pumped? (That subjective feelings alone aren't reliable evidence for objective facts, especially against overwhelming counter-evidence). How did the narrative/rhetoric *protect* the pump? (Making materialist conclusion seem obvious/safe; framing dualist position as virus-induced delusion).
  6.  **Wrap-up & Limitations (5 mins):** "Today you *felt* the pump work, then dissected its gears. Remember, intuition pumps aren't inherently bad, but we must see their machinery. One thing this *didn't* show is how pumps work in long, complex philosophical arguments – they often build cumulatively. Next, we'll see how Dennett categorizes these moves systematically."

  **Predictable Problems & Solutions:**

  *   **Debating the Conclusion, Not the Mechanics:** *Constantly redirect:* "Hold that thought on souls/materialism. Right now, focus ONLY on *how the text tried to persuade you*." Refer back to Rule #2.
  *   **Missing Subtler Moves:** Groups might focus on obvious words. *Solution:* During class share, probe: "Did anyone notice how the *scientist's background* was used?" or "What about the phrase '*undeniable* inner certainty'?"
  *   **Group Think/Uneven Participation:** Circulate during group work. Ask quieter members: "[Name], what detail stuck out to *you* on your sheet?"
  *   **"But It's Just True!":** Some might resist seeing it as manipulative because they agree with the conclusion. *Solution:* "Exactly! That's the power. It feels *obvious*. But *why* does it feel obvious *here*? What did the text *do* to make the 'No' answer seem inescapable? Could the same moves be used to pump the *opposite* intuition?" (Prepares for critiquing pumps).
  *   **Over-Identifying Tricks Prematurely:** If a student blurts out "That's a striking detail!", say: "Great instinct! Hold that thought. Let's collect *all* the observations first, then we'll map terms later."

  **Aspect the Activity Can't Capture (Fill In Afterwards):**

  *   **The Cumulative Effect in Extended Discourse:** This activity uses a single, isolated pump. Dennett emphasizes how pumps often work in *batches* within larger arguments, reinforcing each other and creating a "dialectical fog." Point this out explicitly after the debrief: "Real philosophical writing rarely uses just one pump. They chain them, layer them, and use them to deflect objections. Seeing how they build *systems* of persuasion is our next step." Use an example excerpt from Dennett or another philosopher showing multiple pumps interacting.
