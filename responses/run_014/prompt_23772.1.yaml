answer: |-
  The debate between revealed-preference utility and mind-internal utility hinges on epistemology, ontology, and methodology. Here's a breakdown:

  **1. The Two Views Contrasted:**
  *   **Revealed Preference (RP):** (Samuelson, Houthakker, Afriat)
      *   **Core Idea:** Utility is *defined* by observed choices. "A is preferred to B" *means* "A is chosen over B when both are available." Utility is a mathematical representation of a consistent choice pattern (a complete, transitive preference relation).
      *   **Utility's Role:** A convenient, parsimonious *summary* or *index* of behavior. It adds no *explanatory* content beyond describing what was chosen. It's a tool for prediction and welfare analysis *based solely on behavior*.
      *   **"Real" Utility:** Denied or considered irrelevant/unscientific. Talk of "real" utility beyond choices is metaphysical.
  *   **Mind-Internal Utility (MI):** (Bentham, Jevons, Marshall, modern neuroeconomics/behavioral psych)
      *   **Core Idea:** Utility is a pre-existing, subjective psychological state (pleasure, satisfaction, desire fulfillment, neuronal reward signals) *causing* choices (imperfectly). Choices *reveal* this internal state but are not identical to it.
      *   **Utility's Role:** An explanatory construct. It *causes* behavior. We infer its existence and properties *from* behavior (and other evidence like self-reports, neuroimaging).
      *   **"Real" Utility:** Assumed to exist as a genuine psychological/biological quantity. Choices provide evidence about it.

  **2. What Behavior Can Tell Us About "Real" Utility (MI Perspective):**

  Given that *any* finite set of choices can be rationalized by *some* preference relation (via Afriat's Theorem/GARP), behavior alone imposes surprisingly weak constraints on the underlying "real" utility function under the MI view:

  *   **Existence Proof, Not Uniqueness:** Behavior demonstrates *that* some underlying preference/utility *could* exist and be consistent with the choices. It doesn't prove a *specific* utility function is the "real" one. Infinitely many different utility functions can generate the same choice pattern.
  *   **Constraints on *Plausible* MI Utility:** While infinitely many functions fit, behavior *can* rule out many potential MI utilities:
      *   **Inconsistency Detection:** Choices violating GARP (e.g., cyclical preferences, intransitivities like A>B, B>C, C>A) *cannot* be explained by *any* stable, complete, transitive MI preference/utility function without invoking error or changing tastes. This is evidence *against* a stable MI utility.
      *   **Structure Imposition:** To recover a *specific, tractable* utility function (e.g., continuous, differentiable like Cobb-Douglas), we impose strong a priori assumptions (e.g., monotonicity, convexity, separability, functional form). Behavior that violates the implications of these assumptions (e.g., downward-sloping demand curves, specific substitutability patterns) falsifies *that particular hypothesized structure* for the MI utility. Econometric techniques try to find the *best-fitting* structure within assumed classes.
      *   **Revealing Trade-offs:** Choice patterns reveal marginal rates of substitution (e.g., how much X someone is willing to give up for Y at the margin). Under the MI view, this reveals the *relative* subjective value (marginal utility) of goods *at the point of choice*, assuming stable preferences and no error.
  *   **The "Revealing" is Fallible:** Crucially, under the MI view, choices might *fail* to reveal the "real" utility due to:
      *   **Errors:** Mistakes, misperceptions, computational limitations, framing effects.
      *   **Dynamic Inconsistency:** Changing tastes or hyperbolic discounting means current choice doesn't reveal stable future utility.
      *   **Constraints:** Budget constraints, institutional rules, or unavailable options prevent choosing what would maximize "true" utility.
      *   **Multi-Dimensional Utility:** Choices reveal revealed preferences over *bundles*, but the underlying psychological utility drivers (e.g., fairness, status, intrinsic enjoyment) remain latent and must be inferred.

  **3. The Harder Case: Non-Human Decision-Makers**

  This amplifies the challenges inherent in the MI view:

  *   **No Independent Access:** We lack introspection, verbal reports, or (often) clear evolutionary priors about what *should* motivate the agent (unlike assuming fitness maximization in simple biological models). We are stuck purely with observed choices in various contexts.
  *   **RP Approach Remains Robust:** The RP methodology is *designed* for this. We observe choices (e.g., animal foraging paths, AI actions in environments), check for consistency (GARP), and assign a utility function *defined* as that which rationalizes the choices. If the choices are consistent, we have a useful predictive and descriptive model. We don't claim it captures "real" internal states, just that it summarizes behavior effectively.
  *   **The MI Challenge:** Attempting to recover a "genuine" internal utility state is highly speculative:
      *   **Underdetermination Problem:** Infinitely many possible MI utility functions remain compatible with any finite set of consistent choices. What principle selects the "real" one? Evolutionary plausibility? Simplicity? Without independent evidence, these are just assumptions.
      *   **Anthropomorphism Risk:** It's tempting to attribute human-like motivations (e.g., "the AI wants to win" or "the monkey enjoys bananas"). This might be useful shorthand but risks serious error if the underlying mechanisms differ vastly (e.g., an AI optimizing a hardcoded score vs. experiencing reward).
      *   **Mechanism vs. Description:** Even if behavior is perfectly consistent with a utility function, the actual cognitive/computational *mechanism* generating the choice might be utterly different (e.g., simple heuristics, hardwired reflexes, complex non-utility-based algorithms). The utility function is only a *description* of input-output relationships, not necessarily the *mechanism*.
      *   **Potential for Success (Cautiously):** By observing choices across *many diverse and carefully designed situations* (revealing risk attitudes, time preferences, social interactions), we can *constrain* the set of plausible MI utilities more tightly. Combined with knowledge of the agent's biology (neural pathways, hormonal responses) or architecture (AI reward function code, learning algorithm), we might converge on a more confident hypothesis about the internal drivers. However, the core underdetermination never fully vanishes based on behavior alone.

  **Synthesis and Conclusion:**

  *   **RP:** Behavior *defines* utility. It tells us everything RP utility *is*. It provides a powerful, operational tool for modeling and prediction without metaphysical commitments. Its limitation is it explains nothing *beyond* the choices themselves.
  *   **MI:** Behavior provides *evidence* about a hypothesized internal state. It can demonstrate *that* such a state *could* exist and rule out *some* specific hypotheses about its structure or stability. However, it *radically underdetermines* the specific nature of the "real" utility function. Behavior alone cannot uniquely identify it. Independent evidence (psychology, neuroscience, evolutionary theory, knowledge of the system's design) is crucial for making plausible inferences under the MI view.
  *   **Non-Human Agents:** This starkly highlights the distinction. The RP approach remains applicable and useful purely as behavioral description. Recovering a "genuine" MI utility is an inherently speculative scientific hypothesis requiring strong auxiliary assumptions beyond behavior, as independent access to motivation is absent. The best we can do is build increasingly constrained models based on diverse behavioral evidence and knowledge of the system, acknowledging the fundamental inferential gap between observed choices and unobservable internal states.

  Ultimately, behavior tells us *what was chosen*. Under RP, that directly defines utility. Under MI, it provides fallible evidence suggesting the *possibility* and *broad constraints* of an internal utility state, but never its unique or definitive specification. The non-human case makes this evidential gap particularly clear and challenging.
