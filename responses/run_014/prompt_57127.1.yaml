prompt: |-
  I am the mayor of a city of roughly 140,000 people, and next Tuesday I open the first session of what our charter amendment calls the Citizens' Review Panel — a standing body, not a one-off. One hundred and ten residents were drawn at random from a merged frame built out of voter registrations, utility accounts, and public-library cards. They serve a single, non-renewable fourteen-month term. They issue recommendations on the annual budget, on council district boundaries after each census, and on any ordinance the council refers to them. Under the amendment the council may reject a recommendation, but only by recorded vote and only with a written statement of reasons published within thirty days.

  Three facts about the room complicate the opening address.

  First, of the 620 people originally sampled, 510 declined or never responded. The 110 who turned up are noticeably older, more home-owning, and more college-educated than the city as a whole. Our own consultant flagged this in a report that two of the members have read, and they have told the clerk they intend to raise it on day one: they want to know whether they are a fair sample of the city or a self-selected group of people with time on their hands.

  Second, sitting among the sampled members are two people who ran for council and lost, and one former council member who served three terms and was drawn this year like anyone else. She has said publicly that she intends to be useful and that she does not plan to keep quiet.

  Third, the other half of the seats belong to elected officials, department heads, and union representatives who are required to attend. Several of them hold that a body nobody voted for has no business instructing a body everybody voted for. I am among the few people in the room who is not ambivalent about the panel, but I am also, plainly, a career politician: this is my third term, term limits bar me from a fourth, and I campaigned for the amendment in part because I knew it would outlive me. Some people in the room think that is the whole explanation of my enthusiasm, and they are not entirely wrong.

  Please write the opening address. Six to seven minutes spoken, so roughly 800 to 950 words, in plain sentences a tired person can follow at four in the afternoon. It needs to do four things at once, and I would rather it did them honestly than smoothly.

  It must give the sampled members a warrant for deciding that does not rest on their being experts — they are not, and they will not become so in fourteen months — nor on their being a statistically accurate mirror of the city, which they are not, nor on their being better people than the officeholders they are advising, which they are not either. Find what is left after those three are set aside, and build on it.

  It must tell the elected half why they should take the panel's recommendations seriously, on grounds that are neither flattery nor threat. The rejection-with-written-reasons mechanism is the lever here, but the speech should explain what that mechanism actually does to a council member's incentives rather than merely reciting it.

  It must deal with the refusal-rate problem in the open, in ordinary language, without either conceding that the panel is illegitimate or papering over the gap between the city and the room. If the honest position is that the panel represents the city in some respects and not in others, say which respects, and say why the ones it has are worth anything.

  It must handle the former council member without naming her, in a way that simultaneously tells the two unsuccessful candidates what their situation is here. One of these three people is in the room by design and two are here by the accident of the frame; the speech should make that difference visible to them without humiliating anyone.

  Two things I will not say, and neither should the speech: that this is democracy in its purest form, and that the panel's authority comes from its members having no ambitions. They do have ambitions. The design makes some of those ambitions harmless, which is a different and less flattering claim. If the address can explain that difference in concrete terms — what a term you cannot renew, a stipend you cannot campaign on, and a constituency you do not have actually do to what a person is willing to say out loud — it will have done most of what I need.

  Finally, draw whatever distinction you think makes the panel's authority its own rather than borrowed from the council, but draw it in words a sixteen-year-old would understand. No jargon, no Latin, and nothing that requires the audience to have read political theory to follow along.
reasoning: |-
  Okay, the user is the mayor of a 140,000-person city preparing an opening address for a Citizens' Review Panel. This panel has 110 randomly selected residents plus officials/union reps. The speech needs to navigate several tricky issues honestly: the unrepresentative sample due to high refusal rates, the presence of former politicians, skepticism from elected members, and establishing the panel's legitimacy without false claims.

  Hmm... the core challenge seems to be finding authentic footing for the panel's authority when none of the obvious justifications fit. They're not experts, not statistically representative, and not morally superior. The mayor wants to avoid platitudes about "pure democracy" or claiming members lack ambitions. 

  The refusal rate is particularly delicate - 510 of 620 originally sampled declined. The attendees skew older, more educated homeowners. The speech must acknowledge this gap without undermining the panel's legitimacy. Maybe frame it as "not who the city is, but who showed up for the city"? 

  Ah, and there's the former council member and two failed candidates in the mix. Need to subtly distinguish between accidental selection versus intentional participation without naming anyone. Could emphasize that the process equalizes everyone while respecting experience.

  For the elected officials' skepticism... the written-rejection mechanism is key. Should explain how requiring public justification creates accountability - makes them articulate their reasoning beyond party lines. It's about changing incentives, not threatening.

  The ambition point is fascinating. The mayor wants to say term limits and lack of constituencies free members to speak honestly, but it's not about being ambition-less. Concrete terms help: no reelection campaigns, no fundraising needs, no voter pressure. 

  For the authority distinction... maybe compare it to writing a letter versus sending it? The panel drafts recommendations (authority from perspective), the council decides (authority from election). Simple enough for a teenager to grasp.

  The tone needs to be plainspoken - tired people at 4pm. Short sentences. Concrete images. No flattery. Should land somewhere between practical and hopeful, with zero pretense about solving all democracy's problems.
answer: |-
  ## Citizens' Review Panel Opening Address

  **(Approx. 850 words / 7 minutes)**

  Good afternoon. Welcome, everyone. Thank you for being here. For the next fourteen months, this room is going to matter. It matters to me, it matters to the city council, and it matters to the 140,000 people we all serve. You are the first Citizens’ Review Panel. This is a serious job, and I want to talk seriously about how it works, why it matters, and what we’re asking of you.

  First, to the 110 residents who were drawn by lot: Welcome. Thank you for saying yes. I know it wasn’t easy. You are here because your name came up. Not because you asked for it. Not because you have some special expertise. You don’t. You’re not expected to become budget wizards or mapping geniuses in fourteen months. That’s not your job. You’re also not here because you perfectly mirror every street, every background, every age group, or every income level in this city. No random group that size ever could. And you are certainly not here because you are somehow *better* or *purer* than the elected officials sitting across from you. You’re not. They work hard, they face pressures you don’t, and they got here because people voted for them.

  So why *are* you here? What’s your warrant?

  It’s simpler than all that, and harder too. **You are here to bring your perspective.** Your *real* perspective. The view from your kitchen table, your commute, your neighborhood park. The concerns you talk about with your neighbors, the things that keep you up at night about this city, the things you love about it. You are here because you are *in* the city, living its daily reality, without the filter of campaigning, fundraising, or voting schedules. Your job is to look at the hard choices – the budget, the maps, the ordinances we send you – and tell us, honestly, what you see. What makes sense? What seems unfair? What have we missed? What worries you? What gives you hope? That perspective, grounded in everyday life, is what we desperately need, and what this process was designed to capture. That’s your power.

  Now, to my colleagues on the council, our department heads, and our union representatives: Welcome. I know some of you have questions about this. You were elected, or appointed, or chosen through your unions. You earned your seat. These folks were picked by chance. So why should their recommendations carry weight?

  Because of what happens *after* they speak. Yes, the council retains the final vote. That’s essential. But the Charter Amendment didn’t just create this panel; it created a specific process for how you engage with their work. If you disagree with a recommendation, you can reject it. But you must do so publicly, by a recorded vote, and within thirty days, you must publish a clear, written statement explaining *why* you rejected it.

  **This isn’t about giving them power over you. It’s about changing the conversation.** That written statement requirement? It does something important. It forces us – forces *me* – to articulate our reasoning clearly, beyond party lines or quick soundbites, for the whole city to see. It means we can’t just dismiss their perspective quietly. We have to engage with it, grapple with it, and explain why we see it differently. It brings sunlight to the toughest decisions. It makes *our* reasoning sharper, more accountable. Taking their work seriously isn’t flattery; it’s the mechanism that forces us to take *our own* reasoning more seriously, out in the open. That strengthens *your* work, and it strengthens public trust.

  Now, let’s talk about who’s sitting here. We started with a big list, built from voter rolls, utility bills, and library cards. We sent out 620 invitations. 510 people declined, or couldn’t be reached, or couldn’t make it work. That leaves you, the 110 who said yes.

  Does that mean this room is a perfect snapshot of our city? Honestly? No. You’re probably noticing it yourselves. You’re likely older on average. More of you own your homes. More of you have college degrees. That reflects who, right now, felt able to say yes to a fourteen-month commitment. That’s a fact. It means your perspective, while vital, has limits. You might not fully capture the challenges of a young renter working two jobs, or a new immigrant navigating city services for the first time. **So, represent the city you know, absolutely. But also remember the city you *don’t* see perfectly reflected around you.** Listen for those missing voices. Ask questions that draw them out. Your strength lies in your honest perspective, but your responsibility includes remembering whose perspective might be harder to hear in this room. We need you to be mindful observers *of* the city, not just representatives *from* it.

  I also see familiar faces. People who have served on this council before. People who have run for office. You are here for the same reason as everyone else drawn by lot: your name came up. You have experience the others don’t. That’s valuable. Use it. Share it. But remember this: **The authority in this room comes from the process, not from past titles or future campaigns.** Everyone here, whether they’ve held office or never imagined it, has the same standing on this panel. You are all citizens, selected by chance, bringing your life experience to the table. The former officeholder brings the wisdom of experience; the newcomer brings the clarity of fresh eyes. Both are essential. The unsuccessful candidate brings passion for civic life; the person who never ran brings the view from outside the political bubble. Both are vital. Respect the process that brought everyone here equally. Your past service or campaigns don't give you extra weight here, but they don't disqualify you either. Just speak as citizens.

  Finally, let’s talk about why this structure works. Fourteen months. One term. No reelection. A small stipend, not a salary you run on. You don’t have a specific group of voters you report back to. **What does that actually mean?** It means you can say what you really think. You don’t have to worry about how it will play in the next election, because there isn’t one for you. You don’t have to please a particular neighborhood association or interest group to keep your seat, because you don’t have a seat to keep. You don’t have to fundraise. Your only job is to look at the information, talk it through together, and say what seems right, based on your lives and your understanding of the city.

  That’s a unique kind of freedom. It’s not that you lack ambition or opinions – I know you have plenty! It’s that the design makes certain *political* ambitions irrelevant here. Your ambition here should be simple: to do this job thoughtfully and honestly for the city. That freedom to speak plainly, without one eye on the next campaign, is rare in politics. It’s what makes your perspective distinct and powerful.

  So, what is the Panel’s authority? It’s not the council’s authority. The council *acts*; you *advise*. The council *decides*; you *deliberate*. Your authority comes from the quality of your collective thinking, the honesty of your perspective, and the unique freedom you have to offer it without political strings attached. **Think of it like this: You are the city thinking out loud, together, in a room where the usual political games are turned off.** Your power is the power of a clear, well-considered idea, offered openly. The council then takes that idea, weighs it against everything else they know and hear, and acts – and must explain themselves if they choose a different path. That conversation – your open thought meeting their public accountability – is the engine of this Panel.

  This is an experiment. A serious one. It won’t be perfect. It will be messy. It will require patience, listening, and hard work from everyone in this room. But I believe in it. Not because it’s “pure” democracy – democracy is always messy. But because it adds a vital ingredient we often miss: the sustained, structured voice of citizens, chosen by chance, thinking together without an immediate election hanging over them.

  So, let’s get started. Do the work. Speak honestly. Listen carefully. Argue respectfully. Remember the city beyond this room. We are all counting on you.

  Thank you.
