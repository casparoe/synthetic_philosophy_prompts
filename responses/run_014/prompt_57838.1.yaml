answer: |-
  Here's a 6-question sorting quiz designed to reveal students' underlying intuitions about species concepts, using concrete cases to avoid label-matching. Each question includes a scenario and multiple-choice options reflecting reasoning patterns from major species concepts. I've included a scoring key and notes on ambiguity.

  ---

  ### **Species Concept Sorting Quiz**
  **Instructions:** For each scenario, choose the statement that *best reflects your reasoning*. Focus on *why* you think what you do, not textbook definitions.

  1. **Ring Species (e.g., Ensatina salamanders)**  
     Population A interbreeds with B, B interbreeds with C, but A and C *cannot* interbreed when brought together. Are A and C the same species?  
     - A) **No**—if they coexist and can't interbreed, they're different species regardless of the connecting populations.  
     - B) **No**—they represent distinct evolutionary lineages that have diverged.  
     - C) **Yes**—they're connected by gene flow through B and share similar habitats/morphology.  
     - D) **Arbitrary**—they're one species if we prioritize the ring's continuity, or two if we focus on the endpoints.  

  2. **Asexual Dandelions**  
     Thousands of dandelion plants in a field reproduce asexually (no gene exchange), but look identical and occupy the same niche. Are they one species?  
     - A) **Irrelevant**—the biological species concept doesn't apply, but we might group them for convenience.  
     - B) **No**—each is an independent evolutionary lineage, so they should be separate species.  
     - C) **Yes**—they share identical morphology and ecology, so they're clearly one species.  
     - D) **Yes**—they're functionally identical, so splitting them is impractical.  

  3. **Fertile Hybrid Cichlids**  
     Two fish populations in the same lake have different colors/behaviors and rarely interbreed in nature. In labs, they produce fertile hybrids. Are they one species?  
     - A) **Yes**—if they *can* produce fertile hybrids, they're the same species.  
     - B) **No**—they're on separate evolutionary trajectories and maintain distinct traits in nature.  
     - C) **No**—their ecological roles and physical differences are what matter, not lab results.  
     - D) **No**—but only because biologists *treat* them as distinct for practical reasons.  

  4. **Gradual Fossil Series**  
     Fossils show a continuum from species X to Y over millions of years. If you only examine endpoints X and Y (ignoring intermediates), are they the same species?  
     - A) **Unknowable**—we can't test interbreeding, so it's a judgment call.  
     - B) **Yes**—they belong to the same lineage; splitting them ignores evolutionary continuity.  
     - C) **No**—if they look different enough, they should be classified separately.  
     - D) **No**—but only because naming endpoints differently is useful for communication.  

  5. **Cryptic Species (e.g., indistinguishable bats)**  
     Two insect groups look identical and occupy the same forest, but genetic data reveals no interbreeding. Are they one species?  
     - A) **No**—reproductive isolation proves they're distinct.  
     - B) **No**—genetic divergence shows they're independent lineages.  
     - C) **Yes**—without morphological/ecological differences, they're one species.  
     - D) **Depends**—they *were* one species until genetics revealed otherwise; now we might split them.  

  6. **Species Reality**  
     Which view aligns with your intuition?  
     - A) Species are **real units in nature** defined by reproductive compatibility.  
     - B) Species are **real lineages** with shared evolutionary history.  
     - C) Species are **real groups** defined by shared traits/ecology, even without reproductive isolation.  
     - D) Species are **human constructs**—useful for organization, but not "real" in nature.  

  ---

  ### **Scoring Key**
  Tally the **most frequent letter** chosen across all 6 questions:  
  - **Mostly A:** **Biological Species Concept (BSC)**  
    Prioritizes *reproductive isolation* as the defining feature.  
  - **Mostly B:** **Phylogenetic Species Concept (PSC)**  
    Prioritizes *evolutionary lineages* and shared history.  
  - **Mostly C:** **Morphological/Ecological Species Concept (MESC)**  
    Prioritizes *shared traits, ecology, or niche*.  
  - **Mostly D:** **Nominalist/Deflationary View**  
    Sees species as *practical labels* rather than natural entities.  

  ### **Ambiguity Notes: Where the Quiz Can't Distinguish**
  1. **BSC vs. PSC:**  
     - They *agree* on Ring Species (Q1: both say "no") and Cryptic Species (Q5: both say "no").  
     - **Distinguished by**: Cichlids (Q3)—BSC leans "yes" (fertile hybrids), PSC leans "no" (separate lineages).  

  2. **PSC vs. MESC:**  
     - They *agree* on Cichlids (Q3: both say "no") and Fossil Series (Q4: PSC often "yes", MESC "no").  
     - **Distinguished by**: Cryptic Species (Q5)—PSC says "no" (lineages), MESC says "yes" (morphology).  

  3. **Nominalism vs. Others:**  
     - Nominalism (D) is clearest in Q6 and D-heavy responses. It may overlap with *pragmatic* BSC/PSC in Q4 (fossils) or Q5 (cryptic species).  

  4. **Tie Scores:**  
     - A/B tie: Student blends BSC and PSC (common in modern biology).  
     - C/D tie: Student prioritizes utility over theory.  
     - **Discuss**: Pluralism—using different concepts contextually.  

  ---

  ### **How to Use This in Section**
  - **Step 1:** Have students complete the quiz individually.  
  - **Step 2:** Group students by their dominant concept (A/B/C/D) to discuss:  
    - *Why* their reasoning led there,  
    - One case where their view struggles (e.g., BSC on asexuals).  
  - **Step 3:** Reconvene for debate—e.g., "Should a ring species count as one species? Why?"  
  - **Goal:** Highlight that species concepts are *tools* for specific problems, not universal truths.  

  This approach forces engagement with intuitions behind the labels, using cases that resist easy categorization. The scoring key helps identify tendencies while acknowledging where concepts converge (e.g., BSC/PSC on reproductively isolated groups).
