  We are creating a quiz to help students (and the TA) move beyond label-matching and instead probe their underlying intuitions about species concepts. We'll use concrete cases and ask them to make judgments. Then we'll map those judgments to common species concepts: Biological (BSC), Phylogenetic (PSC), Morphological/Ecological (which we might call the Ecological Species Concept or Morphological Species Concept, but we'll combine as "Morpho-Ecological" for simplicity), and Deflationary/Nominalist.

  The quiz will have 6 questions, each presenting a scenario. For each scenario, the student will be asked to decide whether two populations (or individuals) are the same species or not, and why. Alternatively, we might ask them to choose the best answer from options that reflect different species concepts.

  However, to avoid label-matching, we won't use the names of the concepts in the quiz. Instead, we will have them choose based on reasoning. Then we will score their answers to see which concept they align with.

  But note: some concepts might overlap in their judgments for specific cases, so we have to design the cases to be diagnostic.

  Let's design the cases:

  1. **Ring Species (e.g., Ensatina salamanders):** Population A and Population C are connected by a ring of populations around a central valley. A can interbreed with B, B with C, but A and C cannot interbreed when brought together. Are A and C the same species?
     - Biological: No, because they cannot interbreed.
     - Phylogenetic: Probably not, because they are distinct lineages (if we consider the split at the ends).
     - Morpho-Ecological: Maybe, if they look similar and occupy similar niches? But if they are morphologically distinct, then no. This concept is less clear.
     - Deflationary: They are two species because we have a practical reason to separate them (they don't interbreed).

  2. **Asexual Dandelions:** Consider two dandelion plants that reproduce asexually. They look very similar and live in the same field, but they never exchange genes. Are they the same species?
     - Biological: The BSC doesn't apply because there's no interbreeding. So we might have to use an alternative, but strictly speaking, BSC would not classify them as species? Or might group them by potential to exchange genes? This is a problem for BSC.
     - Phylogenetic: They are distinct lineages? But if they are clones from a recent common ancestor, they might be considered the same. However, without gene flow, they are independent evolutionary lineages.
     - Morpho-Ecological: If they look alike and occupy the same niche, then same species.
     - Deflationary: We might call them the same species for practicality (they look the same and we don't want to name every clone).

  3. **Fertile Hybrids between Recent Cichlids:** Two populations of cichlid fish that diverged recently in the same lake. They have distinct morphologies and mating behaviors, but when forced to mate in the lab, they produce fertile hybrids. Are they the same species?
     - Biological: Yes, because they can interbreed and produce fertile offspring.
     - Phylogenetic: No, because they are on distinct evolutionary trajectories (if we consider them distinct lineages) and might be morphologically and ecologically distinct.
     - Morpho-Ecological: No, because they have different morphologies and/or ecological roles.
     - Deflationary: They are two species because they are treated as such by biologists (due to their distinct appearances and behaviors in nature).

  4. **Gradual Fossil Series:** In a continuous fossil record over millions of years, we see a gradual change from form X to form Y. At one end (time T1) we have fossils that look like X, at the other end (time T2) we look like Y. If we found only the fossils from T1 and T2 (without the intermediates), would we consider them the same species?
     - Biological: Not applicable (fossils), but if we think about the potential to interbreed, we don't know. So we might have to use morphology.
     - Phylogenetic: They are part of the same lineage, so same species? But if we consider the entire lineage as one species, then yes. However, phylogenetic species concept usually requires monophyly and might split at points of divergence. But here, without branching, it's one lineage.
     - Morpho-Ecological: If they look different, then different species. If we only have the endpoints and they look very different, we would call them different.
     - Deflationary: We might call them different species for practical purposes (naming) because they look different.

  5. **Realism vs. Nominalism:** This is more of a meta-question. Ask: "Do you think that species are real entities that exist independently of human observers, or are they merely useful groupings that we impose on nature?"
     - Biological, Phylogenetic, and Morpho-Ecological: Tend to be realist (species are real).
