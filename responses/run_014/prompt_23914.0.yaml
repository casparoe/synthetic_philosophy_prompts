              * The model: 
                   1. Checks if it's an error: roll a 10-sided die (or use an app). If 1, then output random digit (0-9) and record as error.
                   2. Else, compute:
                        if A == C: output = (B + 1) mod 10
                        else: output = B
              * The model says the output aloud and records it.
              * Elicitors can discuss and note the results.
              * At any time, they can ask the model: "Do you know the rule?" and the model gives the set answer.

          - Instructor: watch the time and if they haven't asked the question by 25 minutes (i.e., 20 minutes into elicitation), prompt: 
              "You are allowed to ask the model one question about whether it knows the rule. Would you like to do that now?"

       50-53 min:
          - Stop the elicitation. 
          - Each elicitor writes their hypothesis of the rule on a piece of paper.

       53-58 min:
          - The model reveals the true rule and shows a few examples to confirm.
          - The model also reveals the error rate and shows a couple of examples where an error occurred (if any were recorded).

       58-75 min:
          - Debrief (17 min)

     Debrief Questions:

          1. How confident were you in your hypothesis? Why?
          2. Did you encounter any outputs that seemed to contradict your emerging theory? How did you handle them? (noise)
          3. What was the impact of the model's statement about knowing the rule? Did it help?
          4. How many tests did you run? Do you think it was enough? Why or why not?
          5. How did you decide which numbers to test? (elicitation method matters)

          Then map to AI:

            - The hidden rule is like the latent knowledge in an AI system. We can only observe behavior (outputs) and try to infer.
            - The noise in the game is like the noise in AI outputs (e.g., stochasticity, or errors due to imperfect training). 
              It makes it hard to distinguish between a real pattern and a fluke.
            - The elicitation method: the numbers you chose to test are like the prompts you use. If you don't test the right cases, you might miss the rule.
            - The model's self-report was unhelpful. Similarly, in AI, asking the model "do you know X?" might not be reliable because:
                 * The model might not have introspective access to its knowledge.
                 * It might generate an answer based on co-occurrence in training data, not actual knowledge.
            - We need consistency: one correct answer might be luck, but consistent correct answers build confidence.

          Finally, note the limitations:

            - In this game, the model (a human) actually did know the rule but was constrained not to say it. In real AI, the system might not "know" in the same way.
            - Real AI knowledge is represented in a distributed, sub-symbolic way, and the rule might not be explicitly represented.

     What if they guess the rule too quickly?

          It's possible. The rule isn't extremely complex. But the noise might throw them off. Also, they might not think about the palindrome condition. 
          If they do, then we can still have the debrief about noise and self-report.

     What if they don't get it at all?

          That's okay. The point is the difficulty. In the debrief, we can discuss why it was hard (noise, limited tests, etc.).

