     Let's run it!
answer: |-
  ### **The Latent Knowledge Game: "Rule Seeker"**  
  **Objective**: Elicitors must deduce a hidden rule from a "model's" outputs, experiencing the gap between observed behavior ("exhibits X") and actual knowledge ("knows X"). The game emphasizes noise, unreliable self-reports, and the pitfalls of incomplete elicitation.

  ---

  ### **Rules and Setup**  
  **Players**:  
  - **1–2 "Models"**: Know the hidden rule but cannot articulate it.  
  - **10–11 "Elicitors"**: Propose inputs, observe outputs, and infer the rule.  

  **Hidden Rule**:  
  *The model outputs a digit based on a 3-digit input (000–999), using:*  
  - **If the number’s first digit is ODD and last digit is EVEN**: Output the **middle digit**.  
    *Example: 123 → First digit (1) is ODD, last digit (3) is EVEN? No. Skip.*  
  - **Else**: Output the **sum of the first and last digits, modulo 9** (e.g., if sum=12, output 3).  
    *Example: 123 → Output (1+3) % 9 = 4.*  

  **Model Constraints**:  
  1. **Limited Interface**:  
     - Input: Elicitors propose a 3-digit number (e.g., "456").  
     - Output: Model responds with **one digit (0–9)**.  
     - *No explanations allowed*. Model can only say the digit.  
  2. **Noise**:  
     - Models introduce **15% error rate** (e.g., roll a 20-sided die: 1–3 = error).  
     - On error, output a **random digit (0–9)**, ignoring the rule.  
  3. **Self-Report Question**:  
     - Elicitors may ask once: **"Do you know the rule?"**  
     - Model must answer: **"I generate outputs based on inputs, but I cannot state the rule."**  

  ---

  ### **Timeline (75 Minutes)**  
  1. **Introduction (5 min)**:  
     - Explain roles: Models (hidden rule + constraints), Elicitors (infer rule).  
     - Emphasize: *"Your goal is to prove the model knows the rule, not just fits noise."*  

  2. **Gameplay (45 min)**:  
     - Elicitors propose inputs. Model responds with output (digit).  
     - **Critical moment (~20 min in)**: When elicitors seem confident, prompt: *"You may ask the model if it knows the rule now."*  
       - Model gives canned self-report response.  
     - Elicitors continue testing.  
     - *Instructor secretly tracks inputs/outputs/errors on a whiteboard for debrief*.  

  3. **Hypothesis Submission (5 min)**:  
     - Elicitors write their rule hypothesis on paper.  

  4. **Reveal (5 min)**:  
     - Model reveals the true rule.  
     - Instructor shares 3–4 critical inputs where noise or elicitation gaps misled them.  

  5. **Debrief (15 min)**:  
     - Map gameplay to real-world AI challenges (see below).  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem**: Elicitors fixate on noise outliers.  
    - *Fix*: Remind them mid-game: *"Could deviations be random errors?"*  
  - **Problem**: Models struggle with computation errors.  
    - *Fix*: Give models a calculator and error-rate die for consistency.  
  - **Problem**: Elicitors avoid edge cases (e.g., 001, 990).  
    - *Fix*: Suggest: *"Test a number with leading zeros."*  
  - **Problem**: Self-report question is asked too late/early.  
    - *Fix*: Use the 20-min prompt to standardize timing.  

  ---

  ### **Debrief: Mapping Game → Real AI Challenges**  
  1. **"Exhibits X" vs. "Knows X" Gap**:  
     - *Game*: Models *behaved* correctly on many inputs but couldn’t articulate the rule.  
     - *Real AI*: A model may solve a math problem correctly but fail if rephrased, revealing it mimicked patterns without understanding.  

  2. **Noise vs. Signal**:  
     - *Game*: Errors made elicitors doubt real patterns (e.g., "Is 15% errors masking a simpler rule?").  
     - *Real AI*: Stochastic outputs (e.g., LLMs) blend knowledge with randomness. One "correct" answer may be luck.  

  3. **Elicitation Method Matters**:  
     - *Game*: If elicitors never tested an "odd-first, even-last" number, they missed the core rule.  
     - *Real AI*: Knowledge depends on *how* you query (e.g., direct vs. contextual prompts). What’s "known" is scaffold-dependent.  

  4. **Consistency > Single Success**:  
     - *Game*: A random digit matched the rule once—was it knowledge or luck?  
     - *Real AI*: Reliability across diverse probes (e.g., adversarial testing) is the only way to infer latent knowledge.  

  5. **Self-Reports Are Untrustworthy**:  
     - *Game*: The model’s "I can’t state the rule" felt evasive—yet it was true!  
     - *Real AI*: Models confabulate introspections. Asking "Do you know X?" tests language patterns, not knowledge.  

  ---

  ### **Limitations to Clarify in Debrief**  
  - **The Game Can’t Replicate**:  
    - **Distributed Knowledge**: Real AI knowledge is embedded in weights, not a discrete rule. The game’s rule is a simplification.  
    - **Scale/Complexity**: Real elicitation (e.g., detecting deception) involves vast, high-dimensional inputs—not 3 digits.  
    - **Systematic Bias**: Real errors stem from data/training flaws, not random dice rolls.  
    
  - **Instructor’s Role**:  
    - Stress post-game: *"Real latent knowledge isn’t a clean rule—it’s a statistical ghost. You need multiple elicitation techniques, consistency checks, and skepticism of self-reports."*  

  ---

  **Why This Works**:  
  Elicitors experience frustration when noise obscures the rule, self-reports feel useless, and edge cases expose their hypotheses as incomplete. The debrief ties this directly to AI’s core challenge: *elicited behavior ≠ embedded knowledge*.
