prompt: |-
  I sit on the grants committee of a small planetary-defense institute, and before Thursday's meeting I need a short written opinion on whether we should fund a proposed ten-year program to catalog and track near-Earth asteroids. The committee's only serious objection is a memo from our risk analyst, who argues that the doomsday argument implies we are almost certainly early in the total number of humans who will ever exist, so the expected value of any long-horizon program aimed at protecting future generations is negligible and the grant should be denied. The memo you draft should recommend a concrete decision to the committee, and it should engage that objection on its own terms: I want you to work through the reference-class problem in enough detail that a panelist who has read the LessWrong threads on anthropic reasoning can't dismiss it, including why the analyst's choice of reference class is not the only legitimate one and what that does to the strength of his conclusion. End with a clear bottom line.
reasoning: |-
  Okay, the user is on a grants committee for a planetary-defense institute and needs a memo to address a risk analyst's objection based on the doomsday argument. The analyst claims that since we're likely early in human existence, protecting future generations isn't worthwhile. 

  First, I need to unpack the doomsday argument properly. It's an anthropic probability thing where if you consider your birth rank among all humans, being in the early part suggests there won't be many more humans in the future. The risk analyst is using this to say asteroid defense has low expected value. 

  But the reference class problem is key here. The analyst defines "observer" as individual humans. That feels natural but isn't the only way. What if we consider observer-moments instead? Or conscious years? That shifts the math significantly because each generation contains more people than the last. Suddenly we're not necessarily in the early part of the timeline. 

  The memo should show this isn't just quibbling - different reference classes give fundamentally different survival probabilities. A panelist familiar with LessWrong would know reference class selection is deeply contested in anthropics. 

  Also... is the analyst applying the doomsday argument correctly? Even if we accept his framing, the argument only gives a probability distribution. There's still a non-trivial chance of massive future populations. When we multiply that by the astronomical potential value of preventing extinction... the expected value might still be huge despite low probabilities. 

  The user needs a concrete recommendation. I'll argue we should fund because: (1) reference class uncertainty undermines the analyst's certainty, (2) even under pessimistic models the tails are fat enough to justify investment, and (3) not acting risks infinite downside. 

  Better end with a strong bottom line they can quote in Thursday's meeting. "Fund the program" - unambiguous.
answer: |-
  **MEMORANDUM**  
  To: Grants Committee, Planetary-Defense Institute  
  From: [Your Name], Committee Member  
  Date: October 26, 2023  
  Subject: Recommendation on Near-Earth Asteroid Catalog Program & Doomsday Argument Objection  

  **Recommendation:** **Fund the 10-year asteroid tracking program.** The risk analyst’s objection, while philosophically substantive, relies on a contested and non-unique application of the Doomsday Argument (DA). Alternative, equally defensible reference classes dissolve the conclusion that future lives have negligible expected value. Even under the DA’s logic, the case for extinction-risk mitigation remains robust.  

  ### **The Risk Analyst’s Core Argument**  
  The analyst contends that:  
  1. **The Doomsday Argument (DA) applies**: Observing our birth rank (≈100 billionth human) suggests we are likely *very early* in humanity’s total population.  
  2. **Implies high near-term extinction probability**: If total humans are *N*, our birth rank implies *N* is likely small (e.g., <1.2 trillion humans total with >95% confidence).  
  3. **Negligible future value**: Thus, investing in protecting future generations (e.g., asteroid defense) has near-zero expected value.  

  This is a coherent Bayesian argument *if* we accept its premises—but the critical flaw lies in the choice of **reference class**.  

  ---

  ### **Engaging the Reference Class Problem**  
  The DA’s validity hinges on how we define "observer" in the reference class. The analyst uses **individual humans who have ever lived**. This is intuitive but not uniquely justified. Below are equally defensible alternatives that radically alter the conclusion:  

  #### **Option 1: Conscious Observer-Moments (Not Individuals)**  
  - **Definition**: Weight observers by duration of conscious experience (e.g., person-years).  
  - **Why it’s legitimate**: Ethical value often scales with conscious experiences (e.g., saving 1M people for 100 years vs. 100M for 1 year).  
  - **Impact on DA**:  
    - Modern humans exist at higher population densities than past humans.  
    - If humanity survives and grows, future observer-moments dominate past ones.  
    - Our rank in *observer-moments* is plausibly early even if total *individuals* is large.  
    - **Result**: DA does not imply high extinction probability this century.  

  #### **Option 2: Lineages or Generations (Not Individuals)**  
  - **Definition**: Treat each generation (e.g., cohort alive at time *t*) as a single "observer."  
  - **Why it’s legitimate**: Extinction risk is generation-symmetric; all generations have equal prior claims to survival.  
  - **Impact on DA**:  
    - With exponential population growth, later generations contain more individuals.  
    - Our birth rank across *generations* (e.g., ≈300th generation) places us in the earliest 0.001% of potential future generations.  
    - **Result**: DA strongly suggests we are *exceptionally early* in humanity’s timeline, implying low near-term extinction risk.  

  #### **Option 3: Information-Bearing Civilizations**  
  - **Definition**: The reference class is civilizations (or their duration), not humans.  
  - **Why it’s legitimate**: Asteroids threaten Earth-originating civilization as a whole.  
  - **Impact on DA**:  
    - Our civilization’s "birth rank" is unknown (we might be among the first).  
    - **Result**: DA either becomes inapplicable or suggests we are "early" in a cosmic sense—supporting long-term investments.  

  ---

  ### **Why This Matters for Expected Value**  
  The analyst assumes the individual-human reference class is objective. But as LessWrong discussions emphasize (e.g., Bostrom 2002, "Anthropic Bias"), reference class selection is underdetermined and ethical-value-dependent. Crucially:  
  - **No privileged class**: No anthropic principle mandates "individual humans" as the default.  
  - **Tails dominate**: Even under the analyst’s reference class, DA assigns a >5% probability to >1.2 trillion future humans. Preventing extinction in this scenario has expected value exceeding **10^16 lives**—making asteroid defense worthwhile even with pessimistic odds.  
  - **Zero inflation risk**: If we go extinct, *all* future value is lost. A 1% reduction in near-term extinction risk (e.g., via asteroid tracking) could save quadrillions of potential lives.  

  ---

  ### **Bottom Line**  
  **Fund the program without reservation.** The risk analyst’s argument fails because:  
  1. **Reference class arbitrariness**: The individual-human class is one of many legitimate choices; alternatives invalidate the "negligible value" conclusion.  
  2. **Fat tails dominate**: Even under the analyst’s model, the expected value of safeguarding humanity’s potential remains astronomical.  
  3. **Strategic irreversibility**: Delaying asteroid detection risks lock-in: a future impact could prevent any later investment.  

  **Recommended Motion**: *Approve $[X]M for the 10-year NEO catalog program. The Doomsday Argument, properly contextualized, strengthens—not weakens—the case for defending our future.*  

  // End //  

  ---

  **Key for Committee Discussion**:  
  - **Strength**: Directly engages DA’s epistemic weakness (reference class) while conceding its structure.  
  - **Tactical Note**: Avoids philosophy debates by focusing on *value uncertainty* under DA (even if accepted).  
  - **Expected Value (EV) Illustration**:  
    - Analyst’s DA model: 95% chance of <1.2T humans total → 5% chance of >1.2T (e.g., 1Q+).  
    - EV of saving humanity = (0.05 × 1Q lives) = 50B lives "equivalent" per 0.1% extinction risk reduction.  
    - Program cost per life saved: ≪$1 (versus $10M/life for modern medicine).
