  Another angle: the user mentions "deflationary" accounts. They might suspect that "representation" in ML is just a useful fiction, not a real property. I should address whether the current practices support such a view. For instance, if steering works without decoding, it could be seen as manipulating states without implying content, aligning with dispositional views.

