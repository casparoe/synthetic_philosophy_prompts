answer: |-
  You've pinpointed a profound philosophical tension at the heart of interpretability research. The field's reliance on either decoding *or* steering as sufficient evidence for "representation" rests on distinct, often implicit, notions of what representation *is*, and these notions are not necessarily compatible. Let's dissect the implicit theories:

  ### 1. Decoding (Informational Representation)
  *   **What it Tests:** The presence of *information* about concept `C` in a specific activation pattern (neuron, direction, feature vector).
  *   **Implicit Theory of Representation:** A **Correlational/Informational** view.
      *   **Core Claim:** Representation exists if the internal state carries reliable information about `C` that could be *read out* by an observer (the probe). This aligns with Dretske's informational semantics or Fodor's asymmetric dependence: the state *covaries* with `C` under relevant conditions.
      *   **What Must Be True:** The statistical relationship between the activations and `C` must be sufficiently strong and stable across the probe's test distribution. The probe itself is treated as a *measurement device*, not necessarily part of the model's *functional* machinery.
  *   **What it Rules Out (Without Argument):**
      *   That the information is *accidental* or only present on a tiny, irrelevant subset of inputs (if the probe generalizes reasonably).
      *   That the information is *completely* entangled or inseparable (if the probe achieves good accuracy).
  *   **What it *Doesn't* Rule Out:**
      *   **Epiphenomenality:** The information might be a side-effect, unused by the model's own computation downstream. (e.g., activations correlate perfectly with `C`, but `C` is irrelevant to the task and the model ignores it).
      *   **Implementation Detail:** The information might be present but not in a form the model uses *as a representation of `C`*; it might be an intermediate step in calculating something else entirely.
      *   **Probe Sophistication:** The probe might be learning a complex function *from* the activations to `C` that the model itself never performs. The representation might be "in the eye of the beholder" (the probe).
  *   **Philosophical Commitment:** Primarily an **Informational** notion of representation. It treats the model's internals as a data source. Its sufficiency implies that carrying usable information *is* representation.

  ### 2. Steering (Causal/Functional Representation)
  *   **What it Tests:** The *causal efficacy* of an activation pattern (neuron, direction, feature vector) *relative to behavior* implying `C`.
  *   **Implicit Theory of Representation:** A **Causal/Functional** view.
      *   **Core Claim:** Representation exists if manipulating the internal state *causes* a predictable change in the model's outputs/behavior *as if* the model's belief about `C` had changed. This aligns with functionalist (Putnam, early Fodor) or interventionist (Woodward) views: the state plays the *role* of representing `C` in the system's causal structure.
      *   **What Must Be True:** The activation pattern must be part of the model's causal pathway for generating behavior related to `C`. The intervention must induce changes consistent with altering `C` (e.g., adding "truthfulness" vector makes outputs more truthful, not just random).
  *   **What it Rules Out (Without Argument):**
      *   **Epiphenomenality:** If steering works, the activation *is* causally involved downstream. Its state matters.
      *   **Complete Irrelevance:** The activation pattern must be functionally connected to the behavior being changed.
  *   **What it *Doesn't* Rule Out:**
      *   **Informational Specificity:** The activation pattern might causally influence behavior related to `C`, but *not* because it specifically carries information *about `C`*. It might be a control knob for a *process* that usually handles `C`, but could be hijacked. (e.g., adding a "French" vector causes French output, but the vector itself might not "contain" French semantics; it might just activate the French output module).
      *   **Indirect Causation:** The intervention might be perturbing a complex, non-linear system in ways that *simulate* a change in `C` without the state actually *being* a representation of `C`. It might be triggering a correlated but distinct pathway.
      *   **Lack of Original Content:** The "representation" might be *created* by the intervention. The model might not have *encoded* `C` in that location originally; the intervention forces it to play that role *now*.
  *   **Philosophical Commitment:** Primarily a **Functional/Causal Role** notion of representation. Its sufficiency implies that playing the *causal role* associated with `C` *is* representation.

  ### The Field's Implicit Stance and Underdetermination
  *   **Acceptance of Either as Sufficient:** This strongly suggests a **Disjunctive Deflationism** or **Pragmatic Instrumentalism**. The field seems to say: "If we can *read* `C` from it (decoding), *or* if we can *use* it to *control* `C`-like behavior (steering), that's good enough for us to call it a representation of `C` for practical purposes." It prioritizes *utility for human understanding and control* over a single, rigorous metaphysical definition.
  *   **Underdetermination:** The practice is **radically underdetermined** regarding the *nature* of representation. It is consistent with:
      *   **Robust Realism:** Representations are real internal states with both informational content *and* causal roles.
      *   **Informationalism:** Representation *is* information encoding.
      *   **Functional Role Semantics:** Representation *is* playing the right causal role.
      *   **Instrumentalism/Dispositionalism:** "Representation" is just a useful label for states we can decode *or* steer with. There's no deeper essence; it's about our interactions and the model's dispositions under intervention.
      *   **Mild Eliminativism:** Maybe "representation" isn't the perfect term, but these are useful features we can interact with.
  *   **Commitment?** The field isn't committed to a *single* specific theory *except* the pragmatic stance that *either* human-decodable information *or* human-steerable causal influence is sufficient to warrant the label "representation of `C`". This avoids the hard metaphysical question.

  ### Consequences of Strictly Enforcing the Causal Criterion
  Applying a strict "must be causally efficacious for `C`-relevant behavior" (steering+) criterion would significantly reshape the field:
  1.  **Retracted Claims:** Claims based *solely* on decoding success would be invalidated as evidence for the model *using* that representation. Examples:
      *   Finding linearly decodable features in SAE dictionaries that don't affect output when ablated/steered.
      *   Probes showing information about concepts demonstrably irrelevant to the task (e.g., decoding image background details in a text-only reasoning model).
      *   "Representations" found via unsupervised methods (like clustering) with no demonstrated causal link to task performance.
  2.  **What Would Be Left & Still Valuable:**
      *   **Mechanistic Interpretability Successes:** Findings where causal roles are *explicitly* demonstrated (e.g., "induction heads", "fact neurons" whose ablation changes factual recall, circuit analysis showing information flow *and* necessity/sufficiency). This is the core gold standard.
      *   **Steering Results:** All valid steering experiments would remain strong evidence for a causally relevant representation *associated* with `C`.
      *   **Probing *with* Causal Validation:** Probes would need follow-up causal experiments (ablation, steering) to show the probed feature is *used*. Probing becomes a *hypothesis generator* for causal features, not proof itself.
      *   **Focus on Computational Traces:** The field might shift terminology towards "computational traces", "causal features", or "functional states" instead of "representations" for causally validated elements. Decoding-only results would be described as "informational features" or "decodable correlates".
  3.  **Impact:** The field would become more rigorous and mechanistic, focusing on *how* models work rather than just what information is latent. It would prune many speculative claims but strengthen the foundations of validated findings. Research might shift towards developing better *causal* discovery methods (beyond simple vector addition) and understanding *why* causally inert information is encoded.

  **In essence:** The field's current practice equates "representation" with *human-accessible leverage points* (via reading or control), embracing underdetermination for pragmatic utility. A strict causal criterion would refocus the field on validated computational mechanisms, sacrificing some breadth for depth and rigor, and force a clearer distinction between *encoded information* and *functionally utilized representation*.
