  ## Joint Statement: Principled Pacifism & Defensive Just-War View in Dialogue  
  *Regarding Killing, Complicity, and Nonviolent Alternatives in Light of Current Conflicts*

  **Preamble:**  
  We, adherents of Principled Pacifism (PP) and the Defensive Just-War View (DJWV), acknowledge profound moral differences regarding war. Yet, we share core commitments to human dignity, the prevention of suffering, and the pursuit of peace. Following good-faith discussion centered on contemporary challenges, we establish this framework to clarify agreements, disagreements, and crucial tests relevant to situations like cyberattacks on infrastructure and non-combat support roles.

  ---

  ### Section 1: Agreed Claims
  We jointly affirm the following principles:

  1.  **Grave Wrong of Aggression:** Unprovoked, large-scale aggression against a political community is a profound moral evil that demands resistance.
  2.  **Primacy of Nonviolent Action:** Nonviolent strategies (diplomacy, sanctions, civil resistance, humanitarian aid, restorative justice) are always morally preferable to violence as a first resort and should be vigorously pursued and invested in by all societies.
  3.  **Value of Every Human Life:** All human life possesses inherent and equal dignity. Intentionally taking human life is an act of supreme gravity requiring the strongest possible justification, if any exists.
  4.  **Complicity Matters:** Participation in systems that cause harm raises serious moral questions, regardless of direct causal contribution. Moral responsibility extends beyond immediate physical acts.
  5.  **Civilian Immunity as Ideal:** Deliberately targeting non-combatants or using means that cannot distinguish combatants from non-combatants is always morally impermissible. Minimizing *foreseeable* harm to civilians is an absolute obligation.
  6.  **Rejection of Vengeance & Expansion:** Military force is never justified for revenge, territorial conquest, or ideological domination beyond stopping an immediate, grave aggression.
  7.  **Shared Grief & Concern:** We share deep concern for the safety of individuals in conflict zones, including military personnel, and grieve all loss of life and suffering caused by war.

  ---

  ### Section 2: Residual Disagreements (Stated Neutrally & Acceptably)
  We precisely disagree on the following points, stated in wording acceptable to each perspective:

  | Area of Disagreement          | Principled Pacifism (PP) Position (as stated by PP)                                                                 | Defensive Just-War View (DJWV) Position (as stated by DJWV)                                                                 |
  | :---------------------------- | :------------------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------------- |
  | **1. Permissibility of Lethal Force** | "Intentionally killing another human being, including enemy combatants engaged in aggression, is **never morally permissible**, even as a last resort in defense of self or others against grave injustice." | "The **intentional use of proportionate lethal force** by legitimate authorities **can be morally permissible** as a necessary last resort to halt or prevent a grave, imminent, and actual aggression when nonviolent alternatives are demonstrably ineffective." |
  | **2. Moral Complicity in Non-Combat Roles** | "Accepting **any role within a military structure engaged in lethal operations constitutes morally unacceptable complicity in killing**, even if the role itself (e.g., logistics, intelligence analysis, cyber defense) does not directly involve pulling a trigger or launching a weapon." | "Roles providing **essential but non-lethal support** (e.g., medical, logistics, cyber defense, non-combat intelligence) within a military engaged in a *just* defensive war are **morally distinct from direct killing and can be permissible**, provided the war itself meets just-war criteria and the support role demonstrably contributes to legitimate war aims (like defense) and adheres to principles of discrimination and proportionality." |
  | **3. Defining 'Violence' & Harm (Cyber Context)** | "Actions that **intentionally cause or enable severe, foreseeable harm (physical, psychological, societal) to human beings**, **including disabling essential civilian infrastructure** (power, water, hospitals), constitute violence and are morally equivalent to physical assault. The perpetrator's distance or the weapon's nature (digital vs. kinetic) is irrelevant." | "While **disabling essential civilian infrastructure is a grave moral wrong causing foreseeable harm**, it is **distinct in kind from direct, intentional killing** (violence *ad bellum*). Its moral permissibility depends entirely on *jus in bello*: strict necessity for legitimate military objectives, proportionality relative to the objective, and discrimination (minimizing civilian harm). Not all harmful acts are 'violence' in the sense triggering the absolute prohibition on killing." |

  ---

  ### Section 3: Cruxes & Test Cases
  We identify the following points ("cruxes") where evidence or outcomes in specific scenarios could rationally shift the view of at least one side. Predictions are recorded in advance.

  **Crux 1: The Necessity Threshold for Lethal Force**  
  *Question:* Can nonviolent resistance *ever* be sufficient to halt or deter a determined, large-scale aggression involving or threatening mass atrocities?  
  *Relevance:* If PP is wrong, lethal defense *might* be necessary (DJWV). If DJWV is wrong, lethal force is always avoidable (PP).  
  *Test Case: A "Stuxnet-Plus" Scenario:*  
      A hostile state launches a sophisticated cyberattack (like Stuxnet, but scaled up) targeting *only* the military command, control, and logistics systems of a victim nation (V). The attack is designed to cripple V's ability to wage offensive war or defend against imminent invasion, causing no direct physical harm to civilians *if* backup systems function as intended. However, the attack carries a significant, known risk (e.g., 15% probability) of cascading failures causing prolonged blackouts in major cities, potentially leading to hundreds of deaths in vulnerable populations (elderly, hospitals) over weeks. V possesses credible intelligence that the aggressor (A) has mobilized ground forces and will invade within 72 hours if V's defenses remain crippled. Nonviolent options (diplomatic protests, emergency UN session) have failed. V's leaders debate a kinetic counter-strike on A's cyber command center (located in a remote area, low expected civilian casualties) to disrupt the attack and deter invasion.

  *   **PP Prediction:** Nonviolent resistance (e.g., mass civil disobedience within A, international sanctions/shame, decentralized network resilience) *could* eventually thwart A or make aggression too costly, even if invasion initially occurs. The risk to civilians from the cyberattack, while grave, does not justify V *initiating* lethal violence, which risks escalation and validates the cycle of violence. Kinetic response is impermissible.
  *   **DJWV Prediction:** Given the imminent invasion threat, the focused military target of the cyberattack, the high stakes of invasion (mass atrocities likely), and the failure of nonviolent measures to deter A *in this critical window*, a proportionate kinetic counter-strike by V is likely necessary and permissible as a last resort to prevent a far greater evil. Nonviolent resistance alone is unlikely to stop the invasion in time.

  **Crux 2: Moral Complicity in Non-Combat Support**  
  *Question:* Does providing essential, non-lethal support (e.g., cyber defense, intelligence analysis, logistics) to a military engaged in a *defensive* war deemed just by DJWV standards inevitably constitute morally unacceptable complicity in killing?  
  *Relevance:* If PP is wrong, such roles can be permissible (DJWV). If DJWV is wrong, such roles are always impermissible (PP).  
  *Test Case: The Cyber Defense Analyst in a Defensive War:*  
      Nation V is under a sustained, multi-vector cyber assault from Nation A, targeting both military systems *and* civilian critical infrastructure (power grids, hospitals). V is universally recognized as the victim of unjust aggression. A conscript with exceptional cyber skills is assigned to V's Cyber Defense Command. Their **sole role** is to analyze attack patterns targeting **civilian infrastructure only** and develop/implement purely defensive countermeasures (e.g., patching vulnerabilities, rerouting traffic, isolating infected systems) to protect hospitals, power, and water supplies. Their work demonstrably saves civilian lives daily by preventing blackouts and hospital system failures. However, by enabling the civilian infrastructure to function, they indirectly support the overall war effort (e.g., workers can go to jobs supporting the military-industrial complex, morale remains higher). They do not target A's systems offensively.

  *   **PP Prediction:** While saving civilian lives is good, accepting this role **integrates the individual directly into the military apparatus** whose ultimate purpose is to wage war lethally. Their labor, however defensive and civilian-focused, **frees resources and maintains societal cohesion essential for the military's lethal operations**. This constitutes inescapable complicity in the overall killing carried out by V's military and is therefore morally impermissible. Alternative nonviolent civil defense roles exist.
  *   **DJWV Prediction:** This role is **primarily and directly humanitarian** – protecting civilians from an ongoing attack. Its connection to facilitating the war effort is indirect and secondary. The individual is **not contributing to offensive operations or targeting combatants**. Given the defensive nature of the war and the direct civilian protection achieved, this role is not only permissible but potentially morally obligatory. Refusing it would directly increase civilian suffering without meaningfully hindering the military's lethal capabilities.

  ---

  **Closing:**  
  This statement reflects our sincere efforts to understand the other's position, identify common ground, and pinpoint our irreducible disagreements with clarity. The proposed cases highlight tensions relevant to modern warfare and personal choices like military service in support roles. We agree that further reflection on these specific scenarios and their real-world outcomes could be instructive for our ongoing dialogue. We affirm our shared commitment to reducing violence and building peace, even as we walk different paths toward that goal.

  **[Signatures / Endorsements for Principled Pacifism Camp]**  
  **[Signatures / Endorsements for Defensive Just-War View Camp]**
