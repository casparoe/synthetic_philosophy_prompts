  Here is a speech that attempts to navigate the complexities you’ve outlined, honoring the request not to define your niece by her selection while acknowledging the philosophical weight shaping your words. It avoids easy answers, sits with the discomfort, and ultimately centers the act of welcome:

  ---

  **(Stand, raise glass, smile warmly at your sister, brother-in-law, and gesture towards your niece)**

  Everyone. Family. Friends. We’re here today for the simplest, most profound reason: to welcome [Niece's Name].

  As her uncle, and as someone who loves words and ideas, I was asked to say a few things – not just "cheers," but something to mark this moment properly. To celebrate her arrival, this tiny, perfect person joining our family. And I want to do that. I truly do. But I also owe you honesty, especially today.

  Because welcoming [Niece's Name] carries a particular texture for me, and perhaps for some of you. Her parents, my wonderful sister and brother-in-law, walked a specific path to bring her here. They faced difficult choices, using the knowledge and tools available to them. I helped them think through those choices. We discussed probabilities, expectations, hopes measured against uncertainties. They selected an embryo with the highest predicted chance of a good life.

  That word – "selected" – hangs in the air differently for us than it might for others here. For some, like our geneticist friends, it might seem a straightforward act of science. For others, like [Grandmother's Name] who spoke of "playing God," it raises deep, valid questions about our reach. And for me, teaching bioethics, it lands squarely on a difficult question: If parents *can* choose the child expected to have the best chance at the best life, *should* they? Is it just an option, or is it a duty?

  This question – procreative beneficence – isn't just academic today. It touches the very words I stand here to say. If that principle holds, then the warm, easy phrases we use at moments like this feel… complicated. To say "We would have loved you no matter what" collides with the knowledge that other possibilities were deliberately not chosen. Yet, the alternative – saying "[Niece's Name], you were chosen *because* your life promised best" – feels utterly wrong. It burdens a newborn with a ranking. It speaks, however unintentionally, to the worth of lives lived with conditions her parents hoped to avoid. And frankly, I distrust the certainty of that clinic’s prediction. What does "best life" even mean? Compared to whom? Based on what narrow slice of data? We navigate probabilities in a fog.

  So where does that leave this welcome? It leaves me unable to offer easy certainties about the past choices that led to her. I cannot stand outside the process, nor can I pretend it didn't shape her arrival in a unique way. But it also leaves me absolutely certain about the present moment, and the future unfolding right now.

  This child is no longer a probability. She is not a ranking. She is not a comparison. She is here. [Niece's Name] is *particular*. She is herself. The calculations, the hopes, the agonizing choices – they brought us to *this* child, in *this* moment. And now, something new and absolute begins: the love that meets her exactly as she is.

  That love doesn't erase the questions. It doesn't resolve the philosophy. The tension between that principle and the messy reality of choice and love remains. But today is not about resolving that tension. Today is about setting it gently aside to do the most important thing: to see *her*. To commit to *her*.

  So, we welcome you, [Niece's Name], not because of the path that led to you, but simply because you are here. We welcome you with joy that is fierce and protective. We welcome you with the promise that this family will surround you, support you, argue about you (probably!), and love you – *you* – unconditionally, as you grow into the unique person you will become. Your life is no longer an expectation; it is a reality, a story just beginning, and we are so incredibly grateful you are part of ours.

  **Verdict:** We commit to loving *this* child, here now, beyond the calculations that brought her to us.
