     - 40-45: Instructor collects the agreement and quickly simulates the vote (if there is an agreement) or announces the referendum is blocked.
     - 45-50: Announce province-wide result.
     - 50-60: If independence passed and a sub-unit qualifies (had >60% against in the province vote), that sub-unit can hold a referendum. The group proposes the rules quickly (same as province or different). Instructor simulates and announces.
  - 60-75 min: Debrief.

  This design should fit within 75 minutes and achieve the learning objective.
