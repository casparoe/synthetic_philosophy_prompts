  Rules for the exercise:
  1. The Provincial Government must propose a referendum plan (franchise, threshold, and whether the vote is for the whole province or allows for sub-units to have separate votes). The plan must be approved by the Federal Government (since the federation's constitution requires federal approval for such referendums).
  2. Other groups (Capital, Valley, Islanders) can lobby both the Provincial and Federal governments and also propose amendments.
  3. The Provincial Government and the Federal Government must agree on the plan. If they cannot, the referendum cannot be held (and the status quo remains).
  4. Once the plan is agreed, the referendum is held. We will simulate the vote based on the agreed rules and the demographic breakdown of Sorvane.

  Demographic breakdown for the vote:
