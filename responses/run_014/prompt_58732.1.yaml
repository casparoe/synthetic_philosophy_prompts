  - Southern Islanders [4 students]
  - Federal Government [4 students]

  Note: Adjust group sizes as needed. The numbers above add up to 22.

  Scenario: The province of Sorvane is considering holding an independence referendum. Each group has different interests. The task is to negotiate the terms of the referendum (franchise, threshold, and territorial unit) and then see the consequences.

