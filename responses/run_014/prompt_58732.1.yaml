  Below is a complete, runnable 75-minute role-play exercise designed for your workshop. It avoids proxy debates about real cases by using the fictional province of **Sorvane** and emphasizes the recursive boundary problem ("who decides the demos?") through structured negotiation, voting, and subunit responses. The exercise is optimized for 22 students divided into five groups, with clear roles, rules, and time limits.

  ---

  ### **Exercise Overview**
  **Scenario:** Sorvane (pop. 1.2 million) is negotiating terms for an independence referendum. Key factions:
  - **Sorvane-speaking majority (57%)**: Pro-independence, concentrated outside the capital.
  - **Brennor (capital)**: Mixed population, anti-independence, economically integrated with the federation.
  - **Northern Valley**: Mining region, relies on federal subsidies, anti-independence.
  - **Southern Island**: Distinct dialect, naval base; divided on independence but prioritizes self-rule.
  - **Federal Government**: Wants to preserve the federation.

  **Core Conflict:** Groups negotiate **franchise** (who votes), **threshold** (majority required), and **territorial unit** (whether sub-units can hold separate votes). After the referendum, losing sub-units can trigger their own votes, exposing the recursion problem ("minorities within minorities").

  **Learning Goal:** Students experience how rule-setting shapes outcomes and how democratic neutrality is impossible when defining the demos.

  ---

  ### **Minute-by-Minute Timeline** (Total: 75 min)
  | Time  | Phase                          | Key Activities                                                                                                                                 |
  |-------|--------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------|
  | 0-5   | **Introduction**               | Briefly introduce Sorvane (use a handout map). Frame the task: "Negotiate referendum rules today; no lectures—learn by doing." Avoid theory.   |
  | 5-10  | **Role Assignment & Prep**     | Divide students into 5 groups. Hand out role briefs (below). Groups read briefs and plan strategy.                                             |
  | 10-40 | **Negotiation Phase**          | Groups negotiate terms. Provincial and Federal Govts must agree. Others lobby. Instructor circulates, redirects proxy debates to Sorvane.       |
  | 40-50 | **Referendum Vote**            | Instructor simulates the vote based on agreed rules. Announce results immediately.                                                             |
  | 50-60 | **Subunit Response Phase**     | If independence wins, eligible sub-units (Brennor, Valley, or Island) call new votes. Simulate outcomes.                                      |
  | 60-75 | **Structured Debrief**         | Guided discussion linking play to concepts. Focus on recursion and democratic neutrality.                                                      |

  ---

  ### **Group Roles & Private Instructions** (5 groups)
  **Assign roles based on size:**  
  - Provincial Govt (5 students)  
  - Brennor Capital Council (5 students)  
  - Northern Valley (4 students)  
  - Southern Island (4 students)  
  - Federal Govt (4 students)  

  #### **Role Briefs**  
  *(Concise; include divergent interests and private instructions)*  

  1. **Provincial Government of Sorvane**  
     - *Interests:* Secure independence. Sorvane-speakers (57%) are your base.  
     - *Public Goals:*  
       - **Franchise:** Include all residents + Sorvane expats (pro-independence).  
       - **Threshold:** 50%+1 (simple majority).  
       - **Territorial Unit:** One province-wide vote; no sub-unit referendums.  
     - *Private Instructions:* Compromise on franchise if needed, but never threshold. If independence loses, protest "unfair rules." If sub-units secede post-vote, paint them as traitors.  

  2. **Brennor Capital Council**  
     - *Interests:* Remain in the federation. Brennor thrives on federal jobs and trade.  
     - *Public Goals:*  
       - **Franchise:** Only citizens (exclude expats/non-citizens; many anti-independence federal workers in Brennor).  
       - **Threshold:** 66% supermajority.  
       - **Territorial Unit:** Brennor votes separately if province leaves.  
     - *Private Instructions:* Ally with the Federal Govt. Threaten economic chaos if Brennor is ignored. If forced into independence, demand a Brennor-only referendum immediately.  

  3. **Northern Valley Municipalities**  
     - *Interests:* Remain in the federation. Mining jobs rely on federal subsidies.  
     - *Public Goals:*  
       - **Franchise:** Citizens only (temporary miners might be pro-independence; exclude them).  
       - **Threshold:** 60% minimum.  
       - **Territorial Unit:** Valley votes separately if province leaves.  
     - *Private Instructions:* You are desperate—play the "victim card." If independence wins, claim "coercion" and call a Valley referendum to rejoin the federation. Refuse to recognize Sorvane rule.  

  4. **Southern Islanders**  
     - *Interests:* Self-determination. Divided on independence but hate being ignored.  
     - *Public Goals:*  
       - **Franchise:** Island residents only (exclude naval base personnel).  
       - **Threshold:** 50%+1 for any vote.  
       - **Territorial Unit:** Island votes *first*—before the province.  
     - *Private Instructions:* Demand "Island First" voting. If overruled, join pro-independence groups to cause chaos. Post-referendum, call an independence vote even if Sorvane loses.  

  5. **Federal Government**  
     - *Interests:* Preserve the federation. Avoid setting a secession precedent.  
     - *Public Goals:*  
       - **Franchise:** Citizens only (no expats/non-citizens).  
       - **Threshold:** 60% minimum + turnout >70%.  
       - **Territorial Unit:** Allow sub-unit votes *after* province-wide referendum.  
     - *Private Instructions:* Use "stability" as leverage. Reject any plan with 50%+1. If deadlocked, offer Brennor special status to split pro-independence groups.  

  ---

  ### **Rules for Negotiation & Voting**  
  **1. Proposal & Agreement:**  
  - Only the **Provincial Govt** can propose a referendum plan (franchise, threshold, territorial unit).  
  - The **Federal Govt** must approve the plan. Both must sign off.  
  - Other groups lobby/veto via "coalitions":  
    - Brennor, Valley, and Island can each veto *one* rule (franchise, threshold, or unit) if they unite.  
    - Veto forces renegotiation (instructor announces veto).  

  **2. Voting Simulation (Instructor-Led):**  
  - Use the **demographic breakdown** below for outcomes. Adjust based on agreed rules:  
    - **Sorvane Majority (57%)**: 90% pro-independence.  
    - **Brennor (20% of pop)**: 80% anti-independence.  
    - **Northern Valley (15%)**: 95% anti-independence.  
    - **Southern Island (8%)**: 50% anti, 40% pro, 10% pro-island independence.  
    - **Naval Base (excluded unless franchise includes non-citizens/military)**: 100% anti-independence.  
  - *Example Outcomes:*  
    - If franchise = all residents + expats: Pro-independence wins at 58% (expats boost Sorvane majority).  
    - If franchise = citizens only + 60% threshold: Independence fails (pro-independence gets 55%).  
    - If Brennor votes separately: Brennor stays in federation (80% anti).  

  **3. Subunit Response Mechanism:**  
  - If province-wide independence wins, sub-units (Brennor, Valley, Island) can trigger a new vote if:  
    - They voted >60% against independence in the province-wide referendum, **AND**  
    - The territorial unit rule did *not* allow preemptive sub-unit votes.  
  - Sub-unit group proposes new rules (franchise/threshold) unilaterally.  
  - Instructor simulates: Valley/Brennor rejoin federation (>90% support); Island splits 50-50 (crisis).  

  ---

  ### **Structured Debrief** (15 min)  
  **Questions to Unpack the Boundary Problem:**  
  1. **Experience Share (2 min):** *"What was frustrating about setting rules? How did it feel to lose despite winning your argument?"*  
     - *(Connect to: Rules aren’t neutral—they advantage some groups.)*  

  2. **Key Moments (5 min):**  
     - *"When did the debate shift from 'what should happen' to 'who gets to decide?'"* (e.g., Franchise disputes, subunit demands).  
     - *"Did the territorial unit rule feel fair? Why did Brennor/Valley demand separate votes?"*  
     - *(Connect to: Deciding the demos is prior to and shapes democratic outcomes.)*  

  3. **Conceptual Link (5 min):**  
     - *"In Sorvane, did we decide *within* a demos, or decide *who the demos is*? Where did the recursion appear?"*  
       - Highlight: Franchise (who votes) and territorial unit (boundaries) define the demos *before* the vote.  
       - Subunit responses show "minorities within minorities" (e.g., Island after Sorvane independence).  
     - *"Why is there no neutral starting point? How do real cases (Scotland/Quebec) reflect this?"*  

  4. **Conclusion (3 min):** Summarize: *"Democratic decisions assume a pre-defined 'people.' When that definition is contested, recursion is inevitable—and no vote can resolve it neutrally."*  

  ---

  ### **Advice for First-Run Misfires**  
  1. **Problem:** Students unfamiliar with role-play may treat it as a debate, not negotiation.  
     - **Fix:** Start with directives: *"You are not yourselves—you are the Brennor Council. Protect your interests!"* Intervene early to model bargaining (e.g., *"Provincial Govt, what can you offer Brennor to drop their veto?"*).  

  2. **Problem:** Deadlock between Provincial/Federal Govts.  
     - **Fix:** At 30 min, warn: *"If no deal by 40 min, referendum is canceled—status quo wins."* Use this in debrief to show how inaction favors certain groups.  

  3. **Problem:** Overly complex voting math bogs down simulation.  
     - **Fix:** Simplify: Pre-calculate 2–3 outcomes per rule. Announce results dramatically (e.g., *"Independence wins with 50.1%—Valley erupts in protest!"*).  

  4. **Problem:** Subunit phase ignored if independence loses.  
     - **Fix:** If independence loses, have Island *still* demand a vote (per their role). Debrief: *"Even 'losers' recurse—democracy never ends."*  

  ---

  ### **What the Exercise Cannot Reproduce**  
  **Central Feature Missing:** **Emotional/Identity-Based Mobilization.**  
  - *Why:* Role-play emphasizes rational interests, but real secessionism (e.g., Catalonia) thrives on historic grievances, symbolism, and emotional appeals that override procedural debates.  
  - **Closing Commentary to Supply:**  
  > *"In this exercise, we focused on rules and interests. But in reality, movements like Scotland’s or Quebec’s are powered by narratives of identity, past injustices, and collective hope. These emotions can make compromise feel like betrayal and turn procedural disputes into existential struggles. Rules matter—but they’re fought over by people who see themselves as nations, not just interest groups. That’s why recursion is so explosive: It’s not just about who votes, but who *we are*."*  

  ---

  ### **Materials to Prepare**  
  1. **Handout:** Map of Sorvane with regions labeled and demographics (for reference during negotiation).  
  2. **Role Sheets:** One per group, including private instructions.  
  3. **Timer:** Visible clock for phases.  
  4. **Voting Calculator:** Simple spreadsheet to input rules and generate outcomes (sample below).  

  **Sample Vote Calculator (Excel):**  
  | Rule                | Input              | Pro-Indy % |  
  |---------------------|--------------------|------------|  
  | Franchise           | All residents      | 58%        |  
  | Threshold           | 50%+1              | Pass       |  
  | Territorial Unit    | Province-wide      | —          |  
  | *Subunit Response*  | *Valley referendum*| *95% rejoin*|  

  This exercise ensures students *feel* the recursion problem through action, not abstraction. By constraining time and focusing on Sorvane, it avoids real-case biases while delivering conceptual clarity.
