  Role Brief: Provincial Government of Sorvane

  You represent the government of Sorvane, a province in a larger federation. Your party was elected on a platform of holding an independence referendum. You believe that the Sorvane-speaking majority (57% of the population) supports independence. Your goal is to achieve independence for Sorvane.

  Key Interests:
  - Franchise: You want to include as many pro-independence voters as possible. This means including all residents (even non-citizens who have lived in Sorvane for 5+ years) and Sorvane expatriates (who are mostly pro-independence).
  - Threshold: You want a simple majority (50%+1) of the votes cast to be sufficient for independence.
  - Territorial Unit: You want one referendum for the entire province. You oppose allowing sub-units (like the Northern Valley or the Southern Island) to hold separate votes because that might lead to the breakup of Sorvane.

  Private Instructions: Be prepared to compromise on the franchise (for example, you might accept excluding non-citizens) but stand firm on the threshold. If the Federal Government insists on a high threshold, you might threaten to hold an unofficial referendum. However, you need federal approval for a binding vote.

  Role Brief: Capital City Council of Brennor

  You represent the capital city of Brennor, a mixed city that is the seat of the provincial government and also hosts many federal institutions. Your city benefits from federal public sector jobs and investment. Most residents want to remain in the federation.

  Key Interests:
  - Franchise: You want to include all residents of the capital (including non-citizens) because many federal employees (who are anti-independence) are non-citizens. You want to exclude expatriates (who are mostly pro-independence).
  - Threshold: You want a high threshold (at least 60%) for independence to pass to ensure broad support.
  - Territorial Unit: You want the capital to have the right to hold its own referendum if the province votes for independence, so that the capital can remain in the federation.

  Private Instructions: Lobby the Federal Government to support your positions. Work with the Northern Valley and Southern Island groups if they share your goals. Be willing to accept a province-wide vote if you get a high threshold and the option for the capital to opt out.

  Role Brief: Northern Valley Municipalities

  You represent the Northern Valley, a mining region that depends on federal subsidies. Without these subsidies, unemployment would soar. The vast majority of your population wants to remain in the federation.

  Key Interests:
  - Franchise: You want franchise limited to citizens (to avoid temporary workers who might be pro-independence). You also want to include citizens from the valley who work elsewhere (e.g., in Brennor).
  - Threshold: You want a very high threshold (e.g., two-thirds) for independence to pass at the province level. But more importantly, you want the valley to have the right to hold its own referendum if the province votes for independence.
  - Territorial Unit: You demand that the valley be treated as a separate unit. If the province leaves, you want to remain in the federation.

  Private Instructions: You are desperate to remain in the federation. If the province votes for independence, you plan to immediately hold a referendum in the valley to rejoin the federation. Align with the Capital City Council and the Federal Government.

  Role Brief: Southern Islanders

  You represent the Southern Island, which has a distinct dialect and culture. The island hosts a federal naval base. Your population is divided: some want independence for the whole province, some want to remain, and some want independence for the island itself.

  Key Interests:
  - Franchise: You want to include all island residents but exclude the naval base personnel (who are temporary and pro-federation). You also want to include island expatriates (who might support independence).
  - Threshold: For the province-wide vote, you want a high threshold (60%) because your population is split. For any island-specific vote, you want a simple majority.
  - Territorial Unit: You want the island to have the right to hold its own referendum regardless of the province-wide outcome. You might even prefer to have the island vote first.

  Private Instructions: Your primary goal is self-determination for the island. If the province becomes independent, you will push for an island referendum on independence (from the new state) or to become a separate federal territory. Be flexible on the province-wide rules if you get guarantees for the island.

  Role Brief: Federal Government

  You represent the federal government. Your goal is to preserve the federation and avoid setting a precedent for easy secession.

  Key Interests:
  - Franchise: You want franchise limited to citizens (to avoid manipulation). Exclude expatriates and non-citizens. Regarding the naval base, you are unsure: including them might be seen as interference, but they are federal employees who want to remain.
  - Threshold: You want a high threshold (at least 60%) for independence. You also like the idea of a double majority (majority in the province and in each sub-unit) but that might be hard to achieve.
  - Territorial Unit: You are open to allowing sub-unit votes because it might prevent the entire province from leaving, but you don't want to encourage secessionism in the island.

  Private Instructions: You must approve the referendum plan. If the Provincial Government's plan makes independence too likely, you will reject it. But if you are too rigid, you might provoke unrest. Try to get a high threshold and consider allowing sub-unit votes as a compromise.

