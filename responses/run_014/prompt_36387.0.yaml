answer: |-
  Your intuitions form a remarkably coherent picture that points decisively to **supervaluationism** as the underlying principle. This framework preserves most of your verdicts while resolving the tensions. Here's how it works, applied to your cases:

  ### Core Principle: Supervaluationism
  - **Precisification**: Vague predicates (like "heap" or "bald") admit multiple *admissible precisifications* (sharp boundaries consistent with usage).
  - **Super-truth**: A statement is **true** if it's true on *all* admissible precisifications, **false** if false on all, and **indeterminate** otherwise.
  - **Higher-order vagueness**: There's no sharp boundary between "definitely heap," "borderline heap," and "definitely not heap" because precisifications themselves can be vaguely defined.

  ### Your Verdicts Explained
  1. **Arrangement beats number** (10k grains piled vs. scattered):  
     *Different precisifications weight spatial configuration differently. "Heap" requires a cohesive mound, satisfied only in the pile scenario across all precisifications.*

  2. **Tolerance principle failure** ("remove one grain" seems true but leads to absurdity):  
     *Each precisification has a sharp cutoff, but it varies. The tolerance premise fails because removing one grain *can* cross a cutoff in some precisifications. The conditional feels true locally because adjacent numbers often share most precisifications, but fails globally.*

  3. **Excluded middle holds, yet borderline statements lack truth value**:  
     *"Either heap or not heap" is super-true (true on all precisifications). But for a borderline pile, some precisifications call it a heap, others don't—so it has no definite truth value. Both convictions hold: bivalence is false, but excluded middle holds.*

  4. **Legal thresholds create sharp boundaries where none existed**:  
     *Natural language "heap" has no intrinsic sharp boundary (multiple precisifications). Contracts *stipulate* a single precisification, creating a new, precise standard. The court applies this artificial boundary—it doesn't "discover" a pre-existing one.*

  5. **Endless higher-order vagueness** ("is the boundary fuzzy?"):  
     *The set of admissible precisifications is itself vague. There's no sharp line between admissible and inadmissible precisifications, nor between "determinate" and "borderline" cases. The indeterminacy regress doesn't terminate because vagueness is fundamental.*

  ### Adjudicating Your Unresolved Cases
  1. **Police form asking if a borderline-bald driver is bald**:  
     - **Supervaluationist answer**: There is *no factually correct yes-or-no answer*. The driver is neither super-true nor super-false bald.  
     - **Practical reality**: The form *forces* a precisification. The officer must decide based on context (e.g., "Does this match typical police reporting standards for 'bald'?"), but this reflects institutional choice, not truth.  

  2. **Does a legal threshold change meaning or merely consequences?**  
     - **It changes consequences, not core meaning**:  
       - The word "heap" in English retains its vague meaning (multiple precisifications).  
       - The contract *stipulates a new technical term* (e.g., "Substantial Completion per §3.2"). This term borrows natural language words but assigns them precise, artificial boundaries.  
       - **Analogy**: "Water" (vague: includes rain, lakes, etc.) vs. "Potable Water per EPA Standard 2023" (precise). The law changes what *counts as compliance*, not the meaning of "water" in English.

  ### Which Verdict Might Need Overturning?
  Your intuition that **"no statement in the borderline zone is true"** is *mostly* preserved, but with nuance:  
  - Borderline statements are *indeterminate* (neither true nor false *simpliciter*), but classical logic isn't abandoned.  
  - **Cost**: We sacrifice *bivalence* (every statement must be true or false) but keep *excluded middle*. This is supervaluationism's key trade-off.

  ### Why Other Theories Fail Your Criteria
  - **Epistemicism** (sharp but unknowable boundaries): Contradicts your rejection of pre-existing sharp boundaries.  
  - **Fuzzy Logic** (degrees of truth): Conflicts with your belief in excluded middle and higher-order vagueness.  
  - **Contextualism**: Explains arrangement but not endless higher-order vagueness or legal stipulation.

  ### Precision Tool: Applying Supervaluationism
  For any vague predicate **P**:  
  1. Identify *admissible precisifications* of **P** (ways to sharpen it consistently with usage).  
  2. A statement **"X is P"** is:  
     - **True** if true under all precisifications.  
     - **False** if false under all.  
     - **Indeterminate** otherwise.  
  3. **Higher-order vagueness**: Admissibility conditions for precisifications are themselves vague, preventing any "meta-boundary."

  This preserves your insights: arrangement matters (precisifications vary), sorites is blocked (cutoffs exist per precisification), excluded middle holds, stipulations create facts, and indeterminacy runs deep. The cost is accepting truth-value gaps for borderline cases—but you already sensed this tension.
