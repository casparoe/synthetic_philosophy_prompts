  *checks unasked questions* They wondered about meaning change vs. consequence change in legal thresholds. Crucial distinction! Stipulation doesn't redefine "heap" - it creates a new technical term. Like "water" vs. "distilled water for lab use". The court isn't discovering a pre-existing boundary but creating one. 

