answer: |-
  Based on your description, the core concept you're grappling with is most likely **"impersonal value" or "impersonal badness"** within Derek Parfit's work on future generations, specifically concerning the value of *continuation itself*.

  **Settled Name & Core Idea:**
  *   While not always given a single catchy name, the phenomenon is central to **Part IV of Parfit's *Reasons and Persons* (1984), particularly sections on "Why the Future Is Important" and "The End of Humanity".**
  *   **Impersonal Value/Badness:** Parfit argues that some outcomes are good or bad *impersonally* – not because they affect the welfare of any existing or future *particular* person, but simply because of the *kind* of outcome they are. The extinction of humanity (or the failure of valuable projects) is bad *in itself*, even if no one exists to experience it as a loss. This directly matches your thought experiment feeling worse.
  *   **Contrasts:**
      *   **Non-Identity Problem:** Concerns moral obligations to *potential* future people whose very existence depends on our choices. Your concern is about the *impersonal badness* of extinction/abandonment, regardless of *who* would or wouldn't exist.
      *   **Posthumous Reputation:** Involves how one is *remembered* and affects the welfare of the living. Your concern is about the *projects themselves continuing*, even if your role is forgotten.
      *   **Standard Prudential Value:** Typically defines a person's well-being based on states *experienced* during their life. Caring about impersonal posthumous outcomes challenges this, as the badness isn't experienced.

  **Nearest Literature:**
  *   **Parfit, *Reasons and Persons* (Part IV)** is foundational and directly addresses your scenario.
  *   **Samuel Scheffler, *Death and the Afterlife* (2013):** Explores how our projects and values fundamentally depend on the *assumption* of humanity's survival ("the afterlife conjecture"), making its end devastating *impersonally*.

  **Contested & Boundary Cases:**
  *   **Settled:** The *phenomenon* you describe (caring impersonally about continuation) is widely recognized and analyzed.
  *   **Contested:**
      *   **Rationality:** Is it *rational* to care deeply about impersonal outcomes one won't experience? Parfit leans yes; others disagree.
      *   **Metaphysical Status:** What *is* impersonal value? Is it objective or a deep psychological illusion? No consensus.
      *   **Scope:** How far into the future does this impersonal concern extend? Only human projects? All life? The universe?
      *   **Boundary Case:** Is the peaceful end of humanity *after* the last sentient being dies still impersonally bad? Views differ sharply.

  **What to Call It (if needing a label):**
  You could call it the **"Parfitian Impersonal Value of Continuation"** or the problem of **"Posthumous Impersonal Concern"**. The key identifier is its **impersonality** and focus on **continuation itself** as valuable/bad.

  In essence, your intuition aligns with Parfit's argument that the end of humanity is an *impersonal catastrophe*, distinct from personal loss or reputational concern, and existing accounts of prudential value struggle to fully capture why this matters so profoundly to us *now*.
