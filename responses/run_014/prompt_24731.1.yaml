prompt: |-
  I'm working through a set of arguments against what people call the "measurability bias" in effective altruism, and I've landed on one that I think proves too much, and I can't find the exit. The target is the standard EA decision procedure — choose the action that maximizes expected moral value (EMV) — and the argument is meant to show that this procedure gives us no genuine moral guidance at all. Here it is, the way a friend and I got it:

  (1) The core of EA's decision procedure is: act to maximize expected moral value (EMV).
  (2) To maximize EMV, you must be able to compare the EMVs of your available options.
  (3) To compare EMVs, you must represent each option's moral value as a quantity on some scale.
  (4) To represent a moral value as a quantity on a scale, you need a unit of moral value and a way of measuring value in that unit.
  (5) There is no fact of the matter about what the unit of moral value is; choosing a unit is a choice, not a discovery.
  (6) So any choice of unit is either arbitrary, or else it is itself a substantive moral judgment.
  (7) If the choice of unit is a substantive moral judgment, then the EMV computation presupposes the very kind of judgment it was supposed to do for us, and is circular.
  (8) If the choice of unit is arbitrary, then the EMV ranking it produces depends on an arbitrary choice, and so is not a fact about which option is genuinely better.
  (9) Either way, the EMV computation does not deliver a non-arbitrary, non-circular answer about what we should do.
  (10) Therefore, the core of EA's decision procedure — maximize EMV — provides no genuine moral guidance.

  The conclusion is one I don't want, and what makes me think the argument proves too much is that the same structure would apply to any procedure that ranks options by a metric: if it worked, it would also refute plain utilitarianism and expected utility theory, neither of which I think is as obviously guidance-free as this makes them. I have a nagging feeling that the argument is only as strong as a claim about what "measuring" a value actually requires, but I can't pin down which step that is. Which premise or step do you reject, why did it look fine on first reading, and what do I pay by rejecting it — in particular, what must the defender of EMV concede, and what does the measurability-bias critic lose?
reasoning: |-
  Okay, let me start by unpacking the user's argument. They're dealing with a critique of Effective Altruism's decision procedure based on maximizing expected moral value (EMV). The argument claims that EMV can't provide genuine moral guidance because choosing a unit of moral value is either arbitrary or a substantive moral judgment, leading to circularity or arbitrariness.

  First, I need to understand each premise. Step (5) says there's no fact about the unit of moral value. That seems key. In utilitarianism, units are defined by welfare metrics like QALYs. But the user is right that those aren't fundamental; they're based on prior moral choices. However, rejecting (5) outright might not solve the problem. Even if we accept that units are chosen, maybe that choice is part of the moral framework.

  Then there's premise (7). If choosing a unit is a moral judgment, then EMV is circular. But is that accurate? EMV relies on a value function already established. The procedure doesn't create values; it applies them under uncertainty. So the circularity charge might misrepresent how EMV functions. The real work is in defining the value function, not in the unit itself.

  Premise (3) and (4) about representing value as a quantity. Does moral value need a unit? In economics, utility is ordinal. We rank options without exact units. But EMV requires cardinal values for expectation calculations. So maybe EMV needs more than ordinal rankings. But perhaps intertheoretic comparisons can use ratios without a fixed unit, like in von Neumann-Morgenstern where utility is unique up to affine transformations. That means the unit choice doesn't affect the ranking as long as ratios are consistent. So the arbitrariness in unit choice doesn't change outcomes, addressing premise (8).

  The user mentions this argument could refute utilitarianism and expected utility theory. That's a red flag. If the same logic applies, but we know utilitarianism works in practice, the argument must have a flaw. The issue might be conflating the necessity of a unit with the arbitrariness affecting outcomes. In VNM, utility scales are arbitrary in unit but not in ordering. So the ranking isn't arbitrary.

  Also, the user is worried about measurability bias. They might be concerned that EA overemphasizes quantifiable interventions, neglecting hard-to-measure ones. The argument uses this to attack EMV's foundation. But rejecting EMV entirely isn't necessary. Instead, EA can acknowledge that some values are hard to quantify but still use EMV where possible, supplementing with other approaches elsewhere.

  The user's deeper need might be to defend EA's core while addressing valid critiques. They don't want to throw out EMV but seek a way to handle the measurability bias. By targeting premises (5) and (7), they can show that EMV isn't circular or arbitrary in a way that invalidates it. Conceding that value functions involve moral judgments isn't fatal; it's inherent in any moral framework. EA's procedure systematizes those judgments under uncertainty without claiming to avoid them.
answer: |-
  This is a sharp argument that exposes genuine tension, but it overreaches by mischaracterizing how quantification works in decision theory. I reject **premise (4)** as the critical flaw, but resolving this requires rejecting the *conjunction* of (4), (5), and (7). Here's the breakdown:

  ### The Flaw: Premise (4) and Its Implications
  **Premise (4) claims:** *"To represent a moral value as a quantity on a scale, you need a unit of moral value and a way of measuring value in that unit."*  
  This is false for the type of "quantity" relevant to EMV. Moral value in EMV requires a **cardinal scale** (where ratios of differences are meaningful), not necessarily a **ratio scale** (which requires a non-arbitrary zero point and unit, like kilograms or meters). Cardinal scales are unique only up to **affine transformations** (i.e., you can rescale and shift the zero point without changing the underlying ordering of preferences or expectations). This is the core insight of von Neumann-Morgenstern (VNM) utility theory and Harsanyi’s aggregation theorem.

  **Why (4) looks plausible:**  
  It confuses *physical measurement* (e.g., length) with *value representation*. Physical units (meters, seconds) depend on conventions, but cardinal utility scales don't. Units like "dollars" or "QALYs" are *operational tools*, not metaphysical necessities. The "unit" is arbitrary *in isolation*, but **ratios of value differences** are not. For example:
  - If saving 10 lives adds twice as much moral value as saving 5 lives, this ratio holds whether you measure value in "utils," "QALYs," or "hedons."
  - EMV calculations depend *only* on these ratios of differences, not on the absolute unit.

  ### How This Undermines the Argument
  - **Premise (5) is partially true but harmless**: There *is* no unique unit for moral value (e.g., "util" vs. "hedon"), but this doesn’t imply arbitrariness in *rankings*. Affine transformations preserve expectation orderings:  
    If \( U(A) > U(B) \) under one scale, then \( a \cdot U(A) + b > a \cdot U(B) + b \) for any \( a > 0 \).  
    Thus, EMV comparisons are **invariant** under unit/zero-point changes.
    
  - **Premise (7) collapses**: Choosing a unit isn’t a *substantive moral judgment*; it’s a *convenience*. The moral content lies in the **value function** that assigns cardinal utilities to outcomes (e.g., "saving a life is worth 10× more than donating $1,000"). This function *does* require moral judgments, but EMV doesn’t "presuppose" these judgments circularly—it *applies* them under uncertainty. The unit is irrelevant.

  - **Premise (8) collapses**: Rankings aren’t arbitrary because they’re invariant under affine transformations. If option A has higher EMV than B under *any* cardinal representation, it holds under *all* such representations.

  ### What the Defender of EMV Must Concede
  1. **Moral judgments are prior**: EMV doesn’t *generate* moral value; it requires a pre-existing **cardinal value function** (e.g., a utility function over outcomes). Defining this *is* a substantive moral task (e.g., "Is animal suffering morally comparable to human suffering?").  
  2. **Quantification has limits**: Some values (e.g., sacredness, rights) may resist cardinal representation. EMV isn’t universally applicable—it’s a tool for domains where values *can* be cardinally compared.  
  3. **Operational units are pragmatic**: Units like "DALYs" are chosen for practicality, not moral necessity. Their arbitrariness doesn’t infect the moral ranking.

  ### What the Measurability-Bias Critic Loses
  - **The "no guidance" conclusion**: EMV *does* provide guidance when a cardinal value function exists. For example:  
    - If you accept "preventing a death is 100× more valuable than curing a minor illness," EMV can rank interventions even if the "unit" (e.g., 1 "health util") is arbitrary.  
  - **The attack on utilitarianism**: The same argument fails against classical utilitarianism because it relies on ordinal comparisons or ratios (e.g., "maximize total welfare"), not ratio-scale units. Bentham didn’t need a "hedon" definition to argue for reducing suffering.  
  - **The conflation of metaphysics and decision theory**: EMV is a *procedural* framework for *applying* values under uncertainty—not a foundational ethics. Rejecting it requires showing cardinality is impossible/unjustified, not attacking units.

  ### Why the Argument Seems to "Prove Too Much"
  It equivocates between:  
  (A) **The necessity of a unit for operationalization** (e.g., needing "QALYs" to run cost-effectiveness analyses).  
  (B) **The necessity of a unit for moral comparisons**.  
  While (A) is true pragmatically, (B) is false. The argument's structure *would* refute theories requiring ratio-scale measurement (e.g., some physics), but EMV only requires cardinality. This is why utilitarianism and expected utility theory survive: they depend on *ordinal* or *cardinal* rankings, not ratio-scale units.

  ### Recommendation: Target the Value Function, Not the Unit
  The measurability-bias critic should focus on whether moral value *can be cardinally represented at all* (e.g., for non-welfarist values) or whether we can *reliably estimate* probabilities/utilities. Those are harder objections to dismiss. Premise (4) is the weak link—rejecting it preserves EMV’s coherence while acknowledging its limits. 

  > **In short**: Units are arbitrary, but EMV rankings aren’t, because they depend only on ratios of value differences. The moral "heavy lifting" is in the value function—not the unit.
