answer: |-
  ### Decision Procedure for Project Continuation

  This procedure ensures evidence-based decisions while accounting for strategic signaling, explicitly ignoring sunk costs but incorporating the knowledge gained from them. It progresses through objective gates (automatic stop if failed) to judgment-based steps (committee review). 

  ---

  #### **Step 1: Evidence of Goal Achievement or Fundamental Failure**  
  **Question:** *Has the project already achieved its core scientific goal, or has it proven the goal to be unattainable (e.g., due to insurmountable technical barriers)?*  
  - **Sufficient answer for STOP:**  
    - Goal achieved: No further funding needed for the original objective.  
    - Fundamental failure: Evidence (e.g., peer-reviewed data, replication failures) shows the goal is impossible.  
  - **Procedure outcome:**  
    - If **yes to either** → **Stop funding**.  
    - Else → Proceed to Step 2.  
  - **Rationale:** Ignores sunk costs; focuses on objective success/failure.  

  ---

  #### **Step 2: Updated Probability of Success**  
  **Question:** *Based solely on evidence generated to date (not money spent), what is the revised probability of success (PoS) and estimated remaining cost (time + resources)?*  
  - **Sufficient answer for STOP:**  
    - PoS ≤ 10% AND remaining cost ≥ 20% of original total budget.  
    - PoS ≤ 30% AND remaining cost ≥ 50% of original budget.  
  - **Required inputs:**  
    - Independent expert review of evidence (e.g., data, prototypes, publications).  
    - Revised project plan with milestones and budget.  
  - **Procedure outcome:**  
    - If **STOP conditions met** → **Stop funding**.  
    - If PoS > 50% AND remaining cost ≤ 30% of original budget → **Continue funding**.  
    - Else → Proceed to Step 3 (judgment call).  
  - **Rationale:** Uses evidence to update feasibility, ignoring sunk costs. Low-probability/high-cost projects auto-stop.  

  ---

  #### **Step 3: Strategic Signaling Assessment**  
  **Question:** *Would stopping the project cause significant harm to partnerships, donor trust, or the foundation’s reputation that outweighs the project’s poor prospects?*  
  - **Judgment call:** Requires committee review (see Step 4).  
  - **Assessment criteria:**  
    - **Partnership impact:** Will a partner lab/organization sever ties? Is it critical to ≥2 other projects?  
    - **Donor impact:** Will stopping lose a major donor or future funding?  
    - **Reputational risk:** Will public stoppage damage the foundation’s credibility?  
  - **Burden of proof:**  
    - Must quantify harm (e.g., "Partner Lab X will withdraw from 3 collaborations worth $Y").  
    - Anecdotal claims (e.g., "donors might be upset") are insufficient.  
  - **Procedure outcome:**  
    - If no material impact claimed → **Stop funding**.  
    - Else → Proceed to Step 4.  
  - **Rationale:** Prevents regret-based decisions by demanding evidence of strategic harm.  

  ---

  #### **Step 4: Committee Judgment**  
  **Question:** *Do the strategic benefits of continuing outweigh the costs, given the project’s low prospects?*  
  - **Process:**  
    - Committee (program lead + 2 disinterested senior staff) reviews:  
      - Step 2 evidence (PoS, cost).  
      - Step 3 strategic claims.  
    - Test for "embarrassment bias": If the project were new, would we fund it today?  
  - **Verdict:**  
    - Continue only if:  
      - Strategic harm is quantifiable, probable, and catastrophic (e.g., loss of >$Z in future revenue).  
      - AND the project can be "downsized" (e.g., minimal keep-alive funding).  
    - Else → **Stop funding**.  
  - **Rationale:** Human judgment for values-based trade-offs, with anti-bias checks.  

  ---

  ### **Application to Example Projects**  
  #### **Project A: Strong Evidence, Expensive**  
  - **Step 1:** Not achieved goal; no fundamental failure.  
  - **Step 2:**  
    - PoS = 70% (strong data).  
    - Remaining cost = 120% of original total budget.  
    - → **Proceed to Step 3** (high cost triggers judgment).  
  - **Step 3:** No strategic harm claimed (e.g., no partner/donor risk).  
  - **Verdict:** **Stop funding**.  
  - **Why you won’t like it:** Despite promising science, the cost overrun is indefensible without strategic justification. Sunk costs are irrelevant; the future expense is too high.  

  #### **Project B: No Progress, Cheap**  
  - **Step 1:** No success/failure.  
  - **Step 2:**  
    - PoS = 5% (no progress after 2 years).  
    - Remaining cost = 5% of original budget (cheap).  
    - → **Proceed to Step 3** (low PoS triggers judgment).  
  - **Step 3:** No strategic harm claimed.  
  - **Verdict:** **Stop funding**.  
  - **Rationale:** "Cheap" is not a reason to continue. Low PoS fails Step 2’s auto-stop (5% < 10% but cost is low → judgment required). No strategic case made.  

  #### **Project C: Critical Partnership at Risk**  
  - **Step 1:** No success/failure.  
  - **Step 2:**  
    - PoS = 20% (weak data).  
    - Remaining cost = 40% of original budget.  
    - → **Proceed to Step 3** (PoS/cost in "yellow zone").  
  - **Step 3:**  
    - Strategic claim: "Partner Lab X (which co-leads 4 projects) will exit all collaborations if stopped."  
    - Evidence: Email from Lab X’s director threatening withdrawal.  
  - **Step 4:**  
    - Committee verifies Lab X’s role in $5M portfolio.  
    - Approves minimal "keep-alive" funding (10% of requested) to renegotiate partnership.  
  - **Verdict:** **Continue funding** (reduced amount).  
  - **Rationale:** Strategic harm is credible and quantified; downsizing minimizes exposure to weak project.  

  ---

  ### **Key Design Notes**  
  - **Sunk costs:** Explicitly excluded. Only evidence (Step 2) and future costs matter.  
  - **Judgment dressed as procedure:**  
    - Step 3’s "strategic harm" is inherently subjective but gated by quantifiable evidence.  
    - Step 4’s committee uses structured bias checks (e.g., "would we fund this today?").  
  - **Anti-regret guards:**  
    - Step 3 rejects vague signaling claims.  
    - Step 4 forces cost-benefit comparison to a new project.  
  - **Efficiency:** 80% of projects exit at Steps 1–2 (objective). Only 20% advance to judgment steps.  

  This procedure ensures rigor while allowing flexibility for strategic context, without letting sunk costs or embarrassment dictate outcomes.
