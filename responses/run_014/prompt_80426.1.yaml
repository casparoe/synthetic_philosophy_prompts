answer: |-
  Your debate partner is misapplying Kant's test through a **consequentialist distortion** of the universalizability principle. Let's dissect the slogan and its possible Kantian meanings, then evaluate the boycott maxim properly. Here's a taxonomy of interpretations:

  ### 1. **The Slogan's Ambiguities: What "Universal" Could Mean**
     - **Logical Contradiction Test (Categorical Imperative Formulation I)**  
       *Kant's Actual Test*: Can your maxim be conceived as a universal law of nature *without logical contradiction*?  
       *Example*: "I will make false promises to get money." Universalizing this destroys the concept of promising (if no one trusts promises, promises cease to exist).  
       **Relevance to Boycott**: Your maxim ("I avoid sweatshop goods to reduce exploitation") involves no *logical* contradiction. Even if everyone boycotted, "sweatshop goods" as a category wouldn't self-destruct like "promising" does. ✅ Passes.

     - **Volitional Contradiction Test (CI Formulation I)**  
       *Kant's Actual Test*: Can you *rationally will* your maxim as universal law *without your will undermining itself*?  
       *Example*: "I will never help others." You couldn't will this universally because you might need help someday, making your will conflict with itself.  
       **Relevance to Boycott**: Universal boycott *might* harm economies (as your partner claims), but Kant isn't asking about empirical outcomes. He asks: Does universalizing the maxim *contradict your original purpose*? Your purpose is ending exploitation. A world without sweatshops (due to universal boycott) aligns with, not contradicts, your goal. ✅ Passes.

     - **Consequentialist Universalization (Misreading)**  
       *Partner's Implied Test*: "Can you will the *empirical consequences* of everyone acting this way?"  
       *Problem*: This smuggles in utilitarianism. Kant **explicitly rejects** judging maxims by outcomes (Groundwork 4:424). Catastrophic results don't automatically fail the test – only contradictions in conception or will matter.  
       **Your Partner's Error**: They use this version. The economic collapse argument relies on contingent effects, not rational inconsistency. ❌ Misapplication.

     - **Teleological Contradiction (Humanity Formulation CI-II)**  
       *Kant's Deeper Test*: Does your maxim treat humanity (in yourself/others) as an end, not merely a means?  
       **Relevance to Boycott**: Sweatshops often treat workers as mere tools (violating CI-II). Boycotting *could* express respect for humanity by rejecting exploitation. ✅ Passes (if your motive is moral).

  ### 2. **The Boycott Maxim Analyzed Correctly**
     - **Proper Maxim Formulation**:  
       "I will refrain from purchasing goods produced under exploitative conditions to avoid complicity in harming human dignity."  
       *(Crucially: Motive matters. "To save money" would yield a different test.)*

     - **Universalizability Check**:
       - **Logical Contradiction?**  
         Universal boycott doesn't annihilate the concept of "ethical consumption." No incoherence.  
       - **Volitional Contradiction?**  
         Could you will a world where *no one* buys sweatshop goods? Yes – it aligns with eradicating exploitation. Your will isn't thwarted.  
       - **Humanity as End?**  
         Boycotting arguably respects workers' dignity; purchasing might treat them as means to your cheap goods.

     - **Economic Collapse is a Red Herring**  
       Kantian ethics doesn't require you to sustain unjust systems to prevent collapse. If sweatshops are immoral, their existence isn't justified by consequences (e.g., jobs). The duty to not exploit outweighs contingent harms (Metaphysics of Morals 6:331).

  ### 3. **Why Your Partner's Argument Fails Philosophically**
     - **Conflates Kant with Rule Utilitarianism**: Their test asks, "What if everyone did X?" and looks at outcomes. Kant asks, "Could X be a universal law?" focusing on rational consistency.
     - **Ignores Maxim Specificity**: Sweatshop boycotts target *immoral practices*, not "buying from poor countries." The universalized maxim condemns *exploitation*, not trade itself.
     - **Misreads "Willing"**: "Willing" in Kant means *rational endorsement*, not "desiring the empirical results." You can rationally will abolition of sweatshops even if transition is painful.
     - **Neglects CI-II**: The core issue is whether sweatshops violate human dignity – not hypothetical GDP effects.

  ### 4. **Kantian Counterargument FOR Boycotting**
  Kant would likely condemn purchasing sweatshop goods because:
  - **CI-I**: Universalizing "I will buy exploitative goods for convenience" fails the *volitional* test. If everyone did this, exploitation would be entrenched, contradicting any latent will to end it.
  - **CI-II**: Purchasing treats workers as mere means to your ends, denying their intrinsic worth.

  ### Key Strategy for Your Debate
  **Reframe the maxim** precisely. Expose the **consequentialist sleight-of-hand**. Argue that Kant demands we prioritize **moral consistency over empirical outcomes**. Cite:
  > "Even if... this [universal] law never came to pass, the [Categorical] Imperative would still command it."  
  *(Groundwork, 4:438)*

  Your boycott maxim is *dutiful* under Kant. The economic collapse argument is not just misapplied Kant – it opposes his core deontological project.
