prompt: |-
  I'm a philosophy professor at a mid-sized department, and I keep getting dragged into the same fight about the is-ought gap. A colleague of mine — a philosopher of biology, very empirically minded — uses 'you can't get an ought from an is' as a conversation-stopper. Last week a grad student in our metaethics reading group presented a paper arguing that facts about what participants in a practice accept can generate oughts that are internal to that practice: if the rules of chess say the bishop moves diagonally, then the fact that we're playing chess plus the fact that this piece is a bishop seems to yield a claim about how you ought to move it, and likewise for the norms internal to a proof system or a legal code. My colleague's response was basically, 'That's just changing the subject; you still can't get an ought from an is.' He also uses 'that's the naturalistic fallacy' as if it were the same objection, and I suspect it isn't. I want to write a handout for the seminar that lays out the different precise claims the slogan could be making, from the trivial to the radical, and says which of them would actually support his dismissal of the student's project. I've been thinking alot about this and I'm less interested in the history of the slogan than in the conceptual geography; don't send me citations or a reading list, because I already know the literature and I want the map.

  The key thing I need separated is this: what exactly is the 'is' and what exactly is the 'ought' in the slogan? Is it about logical derivability from non-deontic premises? About the semantics of normative predicates? About a missing bridge principle? About the impossibility of reducing normative facts to natural facts? About the fact/value distinction as a claim about motivation or about reasons? And where does the naturalistic fallacy come in — is it a claim about definability, about inference, about the open-question argument, or something else? I also want to know which readings are compatible with the student's practice-internal oughts and which readings would rule them out. Some of these readings seem like platitudes that no one denies, some seem like substantive metaethical theses, and at least one or two might be false. I want the menu, with verdicts, not a single favored interpretation.

  Give it to me in five sections, in this order. 1) 'The menu' (~600 words): six to eight numbered readings of the slogan, each stated as a precise thesis, with a one-line verdict on whether it's trivial, substantive, or false. 2) 'What each reading would license' (~400 words): for each reading, say whether it blocks the inference from facts about what we evolved to want to claims about what we ought to do, whether it blocks the practice-internal ought, and whether it gives my colleague the conclusion he wants. 3) 'The naturalistic-fallacy detour' (~250 words): separate the claims hidden in that label and say which, if any, are just the is-ought claims under another name. 4) 'Which reading is doing the work' (~200 words): your best guess at what my colleague probably means when he says it, and what he'd have to accept if he meant the stronger version. 5) 'Confidence and the soft spot' (~150 words): say how confident you are in the main verdicts, and single out the one point you're least sure of.
reasoning: |-
  Okay, the user is a philosophy professor dealing with a recurring debate about the is-ought gap. They want a structured handout to clarify different interpretations of "you can't get an ought from an is" and how these relate to their colleague's dismissal of practice-internal oughts. 

  First, I need to unpack the professor's core request. They're not seeking historical analysis or literature reviews—they explicitly want a "conceptual geography." Their frustration centers on the colleague's use of the slogan as a conversation-stopper, particularly against a grad student's argument about normative claims internal to practices like chess or legal systems. 

  The professor's deeper need seems to be pedagogical: creating a tool to dissect the slogan's ambiguities for seminar discussion. They want to expose whether their colleague's objection holds water against practice-internal oughts, and where the naturalistic fallacy fits in. 

  Hmm, the five-section structure they requested is smart: it forces systematic separation of (1) possible interpretations, (2) their implications, (3) the naturalistic fallacy red herring, (4) diagnosis of the colleague's likely meaning, and (5) epistemic humility. 

  For Section 1, I'll map 6-8 readings from trivial to radical: 
  - Starting with uncontroversial logical gaps (no deontic conclusions from non-deontic premises alone) 
  - Moving to semantic claims (normative predicates ≠ descriptive) 
  - Then metaphysical gaps (irreducibility of normativity) 
  - Ending with strong claims like motivational internalism or reasons skepticism. 
  Each needs a clear verdict: trivial (undeniable), substantive (debatable metaethics), or false. 

  Section 2 must cross-examine each reading against: 
  - Blocking evolutionary ethics? (E.g., Reading 1 allows it if premises include normative bridges) 
  - Blocking practice-internal oughts? (Here's the crux: only strong readings like 4 or 6 might threaten them) 
  - Serving the colleague's goal? (Likely only if he conflates weaker/stronger readings) 

  Naturalistic fallacy (Section 3) is often misused as synonymous with is-ought but is narrower—mainly Moore's definability claim. Must decouple this. 

  For Section 4, I'll speculate the colleague probably leans on Readings 3-4 (semantic/metaphysical gaps) but acts as if defending Reading 6 (no reasons without desires). The tension is that accepting practice-internal oughts might force him to admit some "oughts" are tractable. 

  Section 5's humility note: The trickiest point is whether practice-internal oughts "count" as genuine normativity. Anti-realists might see them as hypothetical imperatives; realists as thin but real. I'm least confident about Reading 5's scope. 

  The handout should empower the professor to ask: "Which gap exactly are you invoking?" If the colleague picks a weak reading, the student's project survives; if a strong one, the debate shifts to defending heavy metaethical commitments.
answer: |-
  Here’s your conceptual map, structured as requested. I’ll avoid citations and focus on disambiguating claims.

  **1. The Menu: Six Readings of "You Can’t Get an Ought from an Is"**

  1.  **Logical Non-Derivability (Minimal):** *No purely non-deontic/pre-normative premises can logically entail a substantive deontic conclusion ("ought," "should," "reason") without additional deontic bridge principles or normative assumptions.*  
      **Verdict:** **Trivial** (Formal logic; Hume’s point in *Treatise* 3.1.1).

  2.  **Semantic Non-Reducibility:** *The meaning of normative terms (e.g., "ought," "good") cannot be fully captured or defined using only non-normative, descriptive vocabulary (e.g., psychological, biological, physical facts). Normative language has a distinct semantic function.*  
      **Verdict:** **Substantive** (Widely accepted by non-naturalists, error-theorists, expressivists; rejected by some naturalists).

  3.  **Metaphysical Irreducibility:** *Normative facts/properties (e.g., *being what one ought to do*) are not identical to, constituted by, or reducible to non-normative, natural facts/properties (e.g., biological functions, desires, evolutionary history).*  
      **Verdict:** **Substantive** (Core claim of non-naturalism; denied by naturalists).

  4.  **Justificatory Gap (Strong):** *No set of purely descriptive facts (about the world, practices, psychology, evolution) can, by themselves, provide justification for a normative claim. Descriptive facts only become reasons via prior normative commitments.*  
      **Verdict:** **Substantive** (Holds for many non-naturalists & some expressivists; denied by naturalists and constructivists).

  5.  **Motivational Internalism Requirement:** *A genuine normative "ought" must be capable of motivating a rational agent (at least pro tanto) purely in virtue of their recognizing it, which purely descriptive facts cannot do.*  
      **Verdict:** **Substantive** (Contested metaethical thesis; central to some forms of internalism).

  6.  **No Reasons without Desires/Humean Theory of Motivation):** *Beliefs about descriptive facts ("is") cannot generate reasons or motivate action without the presence of a pre-existing desire or conative state. Reason is the "slave of the passions."*  
      **Verdict:** **Substantive** (Core Humean thesis about motivation; contested).

  7.  **No Objective Normativity:** *There simply are no objective, practice-independent normative facts or reasons. All "oughts" are ultimately illusory or merely expressive.*  
      **Verdict:** **Substantive** (Error theory/radical skepticism; denied by cognitivists).

  **2. What Each Reading Would License**

  | Reading | Blocks Evolved Want → Ought? | Blocks Practice-Internal Ought? | Gives Colleague Conclusion? |
  | :----- | :--------------------------- | :------------------------------ | :-------------------------- |
  | **1. Logical Non-Derivability** | **Yes** (without bridge) | **No** (Internal rules *are* bridge principles) | **No** (Student grants this, adds bridge) |
  | **2. Semantic Non-Reducibility** | **Maybe** (If "ought" ≠ evolved want) | **No** (Internal "ought" might be distinct semantic kind) | **No** (Internal "ought" sidesteps reduction) |
  | **3. Metaphysical Irreducibility** | **Yes** (If ought ≠ natural fact) | **No** (Internal normativity might be irreducible property) | **No** (Student isn’t reducing to *non-practice* facts) |
  | **4. Justificatory Gap (Strong)** | **Yes** (Evolved want needs justification) | **Yes** (Why follow *this* practice's rules?) | **Yes** (Dismisses internal ought as unjustified) |
  | **5. Motivational Internalism** | **Maybe** (If evolved want motivates) | **Maybe** (Only if rule recognition motivates) | **Unlikely** (Internal rules often motivate) |
  | **6. No Reasons w/o Desires** | **Yes** (Need desire + belief) | **Maybe** (Need desire to follow rules?) | **Unlikely** (Players *do* desire to play chess) |
  | **7. No Objective Normativity** | **Yes** (No oughts anywhere) | **Yes** (Internal oughts aren't real) | **Yes** (But overkill; stops all ethics) |

  **3. The Naturalistic-Fallacy Detour**

  "Naturalistic Fallacy" is often used sloppily. Its core meanings (separate from "is-ought") are:
      *   **Definability Claim (Moore):** It is a fallacy to *define* "good" (a simple, non-natural property) in terms of natural properties (e.g., pleasure, desire-fulfillment).
      *   **Open Question Argument:** If "good" were definable as N (a natural property), "Is N good?" wouldn't be an open question – but it always is. Hence, definability fails.
      *   **Misidentification (Broader):** Illegitimately identifying/conflating evaluative/normative properties with natural properties.

  **Relation to Is-Ought:** Readings 2 (Semantic) and 3 (Metaphysical) *are* essentially the claims Moore's "fallacy" label points towards. Calling practice-internal oughts a "naturalistic fallacy" is **inaccurate** and **conflates issues**. The student isn't *defining* "ought" in naturalistic terms; they're positing a *source* of normativity within practices, which might be irreducible (avoiding Moore's target). The colleague likely misuses it as synonymous with *any* is-ought inference (esp. Reading 1 or 4).

  **4. Which Reading is Doing the Work**

  **Your colleague almost certainly leans on Reading 4 (Strong Justificatory Gap)**, possibly mixed with Reading 3 (Metaphysical Irreducibility). He sees facts about a practice's rules ("is") as incapable of generating a *justified* normative claim ("ought") binding on participants. For him, internal norms lack *authority* without an external anchor he thinks is impossible. He dismisses the student as "changing the subject" because he interprets "ought" as requiring this external justification (which the student isn't providing).

  **If he meant Reading 7 (No Objective Normativity)**, he'd have to accept that *no* "ought" (including his own methodological oughts in philosophy/science) has any objective force – likely a position he doesn't hold (or hasn't considered consistently). Reading 1 (Logical) is too weak to dismiss the student, as the student provides the implicit normative bridge ("if playing chess, follow its rules").

  **5. Confidence and the Soft Spot**

  *   **High Confidence:** Distinctions between Readings 1, 2, 3, 4, 7; that Reading 4 is likely the colleague's driver; that the naturalistic fallacy label is misapplied here.
  *   **Moderate Confidence:** Analysis of what blocks practice-internal oughts; diagnosis of colleague's conflation.
  *   **Soft Spot (Least Sure):** Whether **practice-internal "oughts" genuinely satisfy Reading 5 (Motivational Internalism)** or merely reflect contingent motivations. If internalism is true, are chess rules generating *real* oughts for someone utterly indifferent to chess? This hinges on unresolved debates about the scope of internalism and the nature of "institutional" normativity. Is it genuinely normative or merely descriptive of a conventional constraint? *This* ambiguity might be the real friction point your colleague senses but mislabels.
