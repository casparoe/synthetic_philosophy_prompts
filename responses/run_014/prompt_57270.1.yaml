answer: |-
  1. **LINES UP: Universalization as consistency mechanism.** Both treat "what if everyone did this" as a logical consistency test—Kant for maxims, program equilibrium for code symmetry—forcing mutual cooperation by excluding self-undermining choices.  
  2. **COMES APART: Information dependency.** Kant’s test requires zero external input (pure reasoning), while program equilibrium needs transparency; the oracle variant still relies on query-based verification, contradicting Kant’s internalism.  
  3. **LINES UP: Oracle variant preserves cooperation among cooperators.** The oracle’s limited queries (e.g., "Would you cooperate if I cooperate?") suffice to distinguish conditional cooperators from defectors, maintaining mutual cooperation like full code access.  
  4. **COMES APART: Contingency in universal scope.** Program equilibrium (even with oracle) localizes "everyone" to the opponent’s *actual* response (a mutual prediction), while Kant abstracts to *all rational agents* (a non-empirical requirement).  
  5. **COMES APART: Handling defectors via the oracle.** The oracle variant lets conditional cooperators defect against defectors (self-protection), but Kant’s test mandates cooperating regardless—exposing agents to exploitation if others defect.
