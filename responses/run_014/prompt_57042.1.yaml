prompt: |-
  I teach a second-year political philosophy seminar: 28 students, one 80-minute session, no budget, and nothing they earn in the activity counts toward their grade. They have already met the distinction between brute luck and option luck and know the label "luck egalitarianism," but they have not met the standard objections to it, and I do not want to state any of those objections myself. I want them to manufacture one out of their own decisions and then have to sit in it. Please design a runnable in-class activity under the following constraints.

  1. No veil of ignorance and no ex ante choice of principles. Everyone knows their own position throughout, and the allocation happens after the outcomes are known, because that is what the principle is actually about. I also do not want a rerun of the island auction.

  2. The brute luck / option luck distinction must be produced by the mechanics rather than explained to them. Ideally the very same event counts differently for two participants depending on what each of them did beforehand, and they have to notice the asymmetry on their own.

  3. Include a stage in which the group, acting as an allocation committee, writes down in its own words the rule it will apply, before any of the random elements are revealed. Then hold the committee strictly to the text it drafted. I want the unpleasant outcomes to be traceable to language they chose while it still looked costless.

  4. Build in an information failure: in at least some cases the committee must be unable to determine whether a participant's disadvantage followed a choice or preceded it. This has to be a consequence of what gets disclosed and what stays sealed in an envelope, not of a case I read aloud from a script.

  5. At least one participant's disadvantage must trace to a choice taken from a menu that was itself unequal, so that the committee has to decide whether that counted as choosing at all. Do not resolve this for them in the rules.

  6. Someone in the room should finish ineligible for help under the committee's own rule, and it should be one of the students who argued hardest for that rule in stage 3.

  Deliver: a materials list made of ordinary classroom objects; the rules as numbered steps with a minute count against each, totalling 80 minutes including the debrief; a payoff scheme expressed in tokens that convert to nothing real; roles, if roles are needed; a debrief that maps particular moments of the play onto the parts of the view they have just reenacted, including the places where what the committee wrote and what the principle says come apart; and two or three questions that move the discussion from the tokens to real claims about treatment, disability, and insurance, since that transfer will not happen on its own.

  Then tell me what will predictably go wrong the first time I run this with 28 people: which stage overruns its minutes, which role collapses or refuses to play, what a sharp student will say to break the game early, and how I should answer without naming the objection for them. They may use the label they already have, but the name of what they have just produced should come from them or from their reading afterwards.

  Finally, be frank about what this activity cannot produce. My guess is that it has to do with the difference between being handed a token and being turned away at a clinic counter, but I want you to say precisely what the facilitator must supply that no set of mechanics can.

  Open with three sentences stating the single experience the activity is engineered to produce and the one thing it must not be allowed to degenerate into. Then keep the entire response, materials and rules and debrief and failure modes and limits, under 900 words, with the rules as numbered steps carrying their minute counts.
reasoning: |-
  We are going to simulate a society with a luck egalitarian allocation rule. The core experience: students will write a rule that compensates for brute luck but not option luck, then face cases where they cannot tell the difference or where the rule produces a harsh outcome. It must not degenerate into a debate about the rule during the allocation stage; the rule is fixed once written.

  Materials: 
  - 28 envelopes (one per student)
  - 28 small slips of paper (for choices)
  - 28 larger slips (for outcomes)
  - 28 tokens (e.g., poker chips, paper clips, or just tallied on paper)
  - One hat or bowl for drawing
  - A timer
  - A whiteboard to display the committee's rule

  Roles: 
  - All students are participants. 
  - One volunteer serves as the "Randomizer" (draws outcome slips from a hat). 
  - Another as "Recorder" (writes the rule on the board). 
  - The instructor is the facilitator.

  Steps (80 minutes total):

  1. (5 min) Setup: Hand each student an envelope, a small slip, and a large slip. Explain: "You will make a private choice that affects your outcome. Then, a random event will occur. Some outcomes will be bad. After, we will redistribute tokens based on a rule we write now."

  2. (10 min) Choice: Each student writes on their small slip either "A" or "B" and seals it in their envelope. They do not show anyone. Collect envelopes.

  3. (15 min) Rule Drafting: The class (as committee) drafts a rule for redistribution. They must write it on the board. Prompt: "When someone has a bad outcome, when should the group help? When should we not help?" Do not define brute/option luck. Record their exact words. Example: "We will compensate those who had bad luck they could not avoid." Seal the rule in an envelope and post it.

  4. (5 min) Outcome Assignment: The Randomizer draws outcome slips from a hat. Half say "Good" (worth 10 tokens), half "Bad" (worth 0 tokens). Distribute outcome slips face down.

  5. (5 min) Disclosure: Students look at their outcome slip. Then, they write on their large slip: 
     - Their choice (A or B) from their envelope (they open it to see). 
     - Their outcome (Good or Bad). 
     They do not write their name. Collect all large slips.

  6. (15 min) Allocation: Committee (whole class) reviews each large slip. Apply the rule: if eligible, give 10 tokens (compensation). If not, 0. The rule must be applied exactly as written. The facilitator enforces the text. Record who gets tokens.

  7. (15 min) Debrief: Start by reading the rule aloud. Then:
     - Ask: "Who ended up with no tokens? Why?" 
     - Point out: Some had bad outcomes after choice A, some after B. The rule may have compensated only some. 
     - Ask: "Were there cases where you couldn’t tell if it was brute or option luck? Why?" (Answer: because choices were private, so if the rule required knowing the choice, but the slip didn't show the sequence, they couldn't tell if the choice caused the outcome or followed it.)
     - Highlight: One student (planted by facilitator? or revealed by process) had a limited menu: perhaps only A was available to them (e.g., because they were handed an envelope with only A written, unbeknownst to others). The committee must decide: does that count as a choice? Did the rule account for unequal starting points?
     - Ask the student who argued hardest for strict personal responsibility: "How do you feel now?" (They might be the one with the limited menu who got a bad outcome and was denied.)

  Debrief Questions (move beyond tokens):
  1. "In real life, how do we know if a disability is brute luck or the result of choices? What if we can't know?"
  2. "Should we deny help to someone who 'chose' to be poor if their options were terrible to begin with?"
  3. "What does this say about insurance? Is all insurance unfair if it covers people who took risks?"

  Predictable Failures:
  - Stage 3 (Rule Drafting) overruns: They debate too long. Cut them off at 15 min. Intervene: "Pick the version with the most hands raised."
  - A sharp student says: "Why not just help everyone with a bad outcome?" Answer: "Write that rule if you want, but remember you have to live with it when you see who chose what." (If they do, then the activity becomes about why they might not want that, e.g., moral hazard.)
  - The "limited menu" case might be missed: Plant it. Give one student an envelope with only one choice slip (A) and note it secretly. In allocation, when their slip shows choice A and bad outcome, ask: "Did they really choose? Our rule says..."

  Limits of the Activity:
  - Tokens are painless; real denial of help hurts. The activity cannot simulate the emotional weight of being told "you don't deserve aid." The facilitator must supply that by asking: "How would you feel if this were healthcare, not tokens?" 
  - It cannot produce the social stigma or long-term consequences of real-world luck egalitarianism. The debrief must bridge the gap by discussing real cases.

  Word count: ~850
answer: |-
  ### Core Experience & Guardrail
  This activity engineers the experience of writing a luck-egalitarian compensation rule and then confronting its unintended harshness when applied rigidly to messy cases. It must not degenerate into theoretical debate during allocation; the rule is ironclad once drafted.

  ### Materials
  - **28 envelopes** (labeled 1–28)  
  - **28 choice slips** (small paper squares)  
  - **28 outcome slips** (larger paper)  
  - **Tokens**: 280 poker chips (10 per "good" outcome)  
  - **Two hats** (one for choices, one for outcomes)  
  - **Whiteboard** (to display the rule)  
  - **Timer**  

  ---

  ### Rules (80 min total)  
  1. **Setup (5 min)**:  
     - Hand each student a sealed envelope containing a **choice slip** with pre-written options:  
       - 25 students: "Invest: Pay 0 tokens for 50% chance of Good (+10 tokens), 50% Bad (0)."  
       - 3 students (randomly selected): "Invest: Pay 0 tokens for 20% chance of Good, 80% Bad." *[Creates unequal menus]*  
     - Explain: "Your envelope holds a past choice. Outcomes are random. After, we compensate bad luck *only if* it wasn’t your fault."  

  2. **Rule Drafting (15 min)**:  
     - Committee (whole class) writes a rule on the board: "We compensate students who suffer bad outcomes **only when**..."  
     - Recorder writes verbatim. Facilitator enforces: "Be precise—you’ll bind yourselves." Seal the rule in an envelope.  

  3. **Reveal Choices & Outcomes (15 min)**:  
     - Students open envelopes, see their choice slip.  
     - **Randomizer** draws outcome slips from a hat: 14 "Good," 14 "Bad." Distribute face-down.  
     - Students write on **outcome slips**: (1) Their choice text, (2) Outcome (Good/Bad). *[No names, no timestamps]*  

  4. **Allocation (20 min)**:  
     - Shuffle outcome slips; read each aloud.  
     - Committee applies their rule to award 10 tokens (or 0) for each Bad outcome.  
     - **Facilitator enforces the board’s text literally**. No amendments.  

  5. **Debrief (25 min)**:  
     - Display the rule. Ask:  
       - "Who was denied compensation? Trace it to the rule’s wording."  
       - "Could you *always* tell if bad luck was avoidable? Why not?" *[Highlight sealed choices/outcomes obscuring sequence]*  
       - "Student 7 (unequal menu) chose ‘Invest’ but had an 80% risk. Did they *really* choose?"  
     - **Key questions to bridge to reality**:  
       1. "If ‘bad outcome’ means illness, and ‘choice’ means smoking, should we deny care if we can’t prove the sequence?"  
       2. "When ‘choice’ happens in unjust conditions (e.g., poverty), is it a choice at all?"  
       3. "Should insurance cover self-inflicted harms? What if we misattribute cause?"  

  ---

  ### Predictable Failures  
  - **Stage 2 (Rule Drafting) overruns**: Students haggle over wording. *Cut off at 15 min*: "Pick the draft with most raised hands now."  
  - **"Harsh rule" advocate refuses their role**: The student who pushed for strict responsibility may balk when denied tokens. *Answer*: "You bound the group. Should we break the rule?"  
  - **Sharp student breaks game**: "Why not ignore choices and help everyone?" *Answer*: "Write that rule if you want. But if someone took reckless risks, should they get equal help?" *[Moral hazard]*  

  ---

  ### What the Activity Cannot Produce  
  The mechanics **cannot simulate the visceral harm of real-world denial**. Tokens abstract away the despair of being refused medical care or shelter. The facilitator must supply this by asking: "How would you defend this outcome if it meant homelessness, not lost chips?"  

  ---

  **Word count**: 698
