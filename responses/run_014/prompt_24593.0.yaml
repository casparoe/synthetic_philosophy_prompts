answer: |-
  Your diagnosis that the impasse is **largely verbal** captures a significant aspect of the debate, but it doesn't tell the whole story. There is also a **substantive, formal disagreement** lurking beneath the surface, centered on the scope and expressive power of the disquotational schema. Let's break down the structure:

  **The Core Disagreement: Genuineness vs. Generality**

  1.  **The Deflationist Stance:**
      *   **Core Claim:** The *sole function* of the truth predicate is to enable "semantic ascent" and "semantic descent" – allowing us to talk *about* propositions (using their names or descriptions) while endorsing or rejecting *what they say*. The T-schema (`T('P') ↔ P`) perfectly captures this function.
      *   **Response to Criticisms:**
          *   **Generalizations:** "Everything the Pope says is true" is *not* a primitive use of 'true'. It serves as a device for expressing infinite conjunctions ("If the Pope says P1, then P1; and if he says P2, then P2; and..."). This infinite conjunction *can be expressed* using the T-schema, often via propositional quantification (`∀p (The Pope says that p → p)`) or substitutional quantification.
          *   **'Truth' as a Noun:** Phrases like "the nature of truth" or "truth is valuable" are *metalinguistic* or involve the *concept* of truth, not the *predicate* "is true" in its core logical role. They don't require an analysis beyond the function captured by the predicate.
          *   **Self-Reference (Liar):** Liar sentences (`This sentence is not true`) are pathological, perhaps not genuine propositions, or arise from misuse (e.g., failing to respect language hierarchies). They are edge cases that don't reflect the normal, functional use of 'true' that the T-schema explains perfectly. Solutions involve restricting the schema (Tarski-style) or accepting truth-value gaps – seen as compatible with deflationism's core insight.

      *   **Boundary Claim:** Only uses where 'true' directly facilitates endorsement/rejection via ascent/descent are "genuine" *uses of the predicate* relevant to its core nature. Other uses are parasitic, metalinguistic, or involve derived concepts.

  2.  **The Critic's Stance:**
      *   **Core Claim:** Our linguistic practice with 'truth' involves phenomena that the simple disquotational schema *cannot directly or adequately capture* without significant supplementation or reinterpretation. This indicates the schema is not fully general and that truth might play a richer role.
      *   **Arguments:**
          *   **Generalizations:** Expressing "Everything the Pope says is true" *as a generalization* is fundamental. Reducing it to an infinite conjunction is unsatisfying (it's not something speakers utter or grasp) and propositional/substitutional quantification is a *substantial addition* to the basic deflationary framework, potentially smuggling in concepts deflationism wanted to avoid.
          *   **'Truth' as a Noun:** The nominal use ("the pursuit of truth," "truth is correspondence") is deeply embedded in philosophical and ordinary discourse. Dismissing it as merely metalinguistic feels like an evasion; it suggests 'truth' denotes a property or concept worthy of substantive investigation *beyond* the predicate's logical role.
          *   **Self-Reference (Liar):** The Liar paradox isn't just a nuisance; it's a *formal challenge* arising directly from applying the T-schema universally. Solving it *requires* substantial formal apparatus (hierarchies, non-classical logics, fixed-point theories). This necessity shows the *inherent limitations* or *inconsistency* of the unrestricted schema and suggests truth has complex logical properties the deflationist ignores.

      *   **Boundary Claim:** The phenomena above are genuine, central uses of the *concept* of truth that any adequate theory *must* account for. Dismissing them as "not genuine" redefines the explanandum to fit the theory.

  **The Verbal vs. Substantive Elements:**

  1.  **Verbal Aspect:** There is undeniably a disagreement about the **explanandum** – *what exactly needs to be explained* by a theory of truth? Is it *only* the core logical function of the predicate 'is true' in blind endorsement/ascent (Deflationist), or *also* our use of generalizations, the nominal form, and the logical behavior in all contexts, including pathological ones (Critic)? This is a disagreement about the scope of "genuine use."
  2.  **Substantive/Formal Aspect:** Beneath this verbal dispute lies a **formal challenge**:
      *   **Can the T-schema, augmented *only* with resources the deflationist deems acceptable (like propositional quantification or substitutional quantification, perhaps understood minimally), adequately capture the expressive power needed for generalizations *without* introducing concepts incompatible with deflationism (like a substantive property)?**
      *   **Can the T-schema be made logically consistent and applicable to the language containing its own truth predicate *without* resorting to complex formal machinery that undermines the deflationist claim of simplicity and lack of substantive nature?** The Liar paradox forces this issue.

  **What Would Count as Progress?**

  Progress is possible, but likely incremental, addressing the substantive core rather than resolving the entire verbal boundary dispute:

  1.  **Formal Results on Expressiveness:**
      *   **Progress:** A rigorous demonstration that propositional/substitutional quantification, understood in a suitably deflationary way, *can* or *cannot* adequately express generalizations like "Everything the Pope says is true" *without* requiring commitment to truth as a substantive property or introducing paradoxes. Showing that such quantification is *ineliminable* for certain generalizations would be significant.
      *   **Progress:** A formally adequate, *simple*, and *deflationarily acceptable* solution to the Liar paradox that preserves the core T-schema intuition without massive ontological or logical baggage. (This is widely considered extremely difficult, if not impossible).

  2.  **Clarifying Distinctions:**
      *   **Progress:** Sharpening the distinction between the *logical function* of the truth *predicate* and the *metalinguistic/conceptual* role of the nominal term 'truth'. Showing clearly which phenomena *must* belong to which category. This could narrow the verbal dispute.
      *   **Progress:** A clearer deflationary account of normative uses of 'truth' (e.g., "aim at truth") that doesn't invoke a substantive property.

  3.  **Reframing the Question:**
      *   **Progress:** Shifting focus from "What *is* truth?" to "What *explanatory work* does the concept of truth do, and what is the *minimal apparatus* needed to do that work?" This pragmatic reframing might bypass some metaphysical stalemates. Progress would be showing that the deflationist apparatus suffices for all (or most) of the uncontroversial *explanatory work* (e.g., in logic, semantics, epistemology).
      *   **Progress:** Focusing on the *function* of truth in specific domains (e.g., scientific discourse, everyday assertion) and assessing whether deflationism adequately captures that function.

  **Why Progress Might Be Elusive (But Not Hopeless):**

  *   **The Boundary Problem Persists:** Agreeing on what counts as a "genuine use" requiring explanation is fundamentally contentious and tied to broader philosophical commitments.
  *   **The Liar's Intractability:** Finding a formally adequate, philosophically satisfying, *and* deflationarily acceptable solution to the Liar remains a huge hurdle. Most solutions involve significant complexity.
  *   **Burden of Proof Shifting:** Deflationists claim their simple theory explains the core phenomenon; critics point to phenomena it seemingly can't explain. Deciding where the burden of proof lies (must deflationism explain X, or can it dismiss X?) is part of the dispute.
  *   **Minimalism vs. Robustness:** Deflationism thrives on minimalism; its critics demand robustness. Reconciling these impulses is hard.

  **Conclusion:**

  Your hypothesis is insightful: a significant part of the dispute *is* verbal, concerning the scope of "genuine use" of the truth predicate. However, it masks a **real and substantive formal disagreement** about the **expressive adequacy and logical consistency** of the disquotational schema, particularly concerning generalizations and the Liar paradox.

  **Progress is most likely to come from:** (1) **Formal results** clarifying the expressive power needed for generalizations and the viability of deflationary solutions to the Liar, and (2) **Reframing the debate** towards the *explanatory role* and *pragmatic function* of the truth concept, potentially bypassing some metaphysical deadlock. While a complete, universally accepted resolution is unlikely soon, focused work on these formal and conceptual fronts can advance the discussion and clarify the commitments of each side. The debate is unlikely to completely stall because the concept of truth remains central to philosophy, logic, and language.
