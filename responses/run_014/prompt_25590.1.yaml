answer: |-
  ## Adversarial Collaboration: Pascal's Mugging and Unbounded Expected Utility

  **Agreed Claims:**

  1.  **The Mugging Scenario:** Pascal's Mugging describes situations where an agent is presented with an offer/threat involving an *extremely low probability* \( p \) (e.g., \( 10^{-100} \)) of an *extremely high magnitude outcome* \( U \) (e.g., utility equivalent to \( 3 \uparrow\uparrow\uparrow\uparrow 3 \) lives saved or lost). Expected Utility (EU) maximization, under an unbounded utility function, dictates paying a small cost \( c \) (e.g., $5) if \( p \cdot U > c \), even for vanishingly small \( p \).
  2.  **The Core Dilemma:** This scenario creates a dilemma: either (a) accept that EU maximization prescribes paying in such scenarios despite profound intuitive aversion ("biting the bullet"), or (b) reject strict EU maximization with unbounded utility functions as a complete normative standard, requiring modifications to decision theory or utility functions to avoid this prescription.
  3.  **Bounded Utility Avoids the Mugging:** If the utility function \( U \) is bounded (i.e., \( \exists M \in \mathbb{R} \) such that \( \forall \text{ outcomes } o, |U(o)| \leq M \)), then for any fixed cost \( c > 0 \), there exists a sufficiently small probability \( p \) such that \( p \cdot U \leq c \), preventing the mugging. Both sides acknowledge this is a technical solution.
  4.  **Probabilities are Non-Zero:** The relevant probabilities in Pascal's Mugging scenarios, while astronomically small, are not *exactly* zero. They represent epistemic uncertainties about highly complex or unverifiable claims.
  5.  **Practical Decision Theories Exist:** Decision theories exist that avoid prescribing payment in Pascal's Mugging without necessarily invoking bounded utility (e.g., some forms of uncertainty aversion, lexical probabilities, non-linear probability weighting, complexity penalties on hypotheses). Both sides agree these *can* work pragmatically but disagree on whether they are *principled* responses or merely avoiding the core normative issue.
  6.  **Verbal Disagreement:** There is a potential verbal disagreement regarding the term "rationality." The EV-Maximalist (EVM) camp defines rationality *as* EU maximization under consistent preferences. The Anti-Unbounded (AU) camp uses "rationality" more broadly to include coherence constraints that might preclude EU maximization in extreme cases. This document focuses on the substantive disagreements below, stipulating that both sides seek a coherent, consistent, and action-guiding normative standard.

  **Disagreements:**

  | Crux                                                                                               | EV-Maximalist (EVM) Position                                                                                                                                                                                                                                 | Anti-Unbounded (AU) Position                                                                                                                                                                                                                                                                                                                      | Agreed Test Case / Argument                                                                                                                               | EVM Prediction                                                                                                                                                               | AU Prediction                                                                                                                                                              |
  | :------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Crux 1: Robustness & Real-World Feasibility of EU under Unbounded Utility**                      | Unbounded EU is normatively sound. The mugging is a bizarre, isolated thought experiment. In realistic settings with plausible priors and computational limits, truly dominating mugging offers won't arise. Agents can safely ignore such propositions based on prior structure. | Unbounded EU is fragile and operationally disastrous. Any real-world agent faces constant low-probability/high-impact claims (muggers, alien threats, simulation claims). Unbounded EU forces the agent's entire resources/attention to be dominated by the *most extreme* such claim encountered, paralyzing practical action. | **Test:** Simulate a bounded-rationality agent using Bayesian updating with computable priors. Subject it to a stream of increasingly extreme mugger claims (e.g., \( U_n = 3 \uparrow\uparrow n \), \( p_n = 10^{-n} \)) alongside realistic decisions. Measure resource allocation & overall utility achieved. | Agent will allocate negligible resources to muggings due to low absolute probability mass & priors decaying faster than utility grows. Realistic decisions dominate. | Agent will be forced to divert significant resources to the *latest* extreme mugging claim, neglecting realistic decisions and suffering catastrophic utility loss. |
  | **Crux 2: Epistemic Access & Legitimacy of Tiny Probabilities**                                    | Probability is a measure of belief. If an agent genuinely assigns a non-zero probability \( p \) to an outcome \( U \), and \( p \cdot U > c \), paying \( c \) is the coherent response, however small \( p \) or large \( U \). The burden is on epistemology to justify \( p \). | Genuine epistemic access to meaningful probabilities smaller than \( 10^{-K} \) (for large K, e.g., \( 10^{100} \)) is impossible. Claims involving utilities like \( 3 \uparrow\uparrow\uparrow\uparrow 3 \) inherently lack the evidential structure to warrant *any* non-negligible probability assignment. EU calculation is meaningless here. | **Test:** Present agents with two muggers: Mugger A makes an extreme claim (\( U_A \), \( p_A \)) with *some* supporting evidence pattern E. Mugger B makes claim (\( U_B = U_A^2 \), \( p_B = p_A^2 \)) with *identical* evidence pattern E. Measure required \( p_A \) for payment and consistency of scaling. | Agents paying Mugger A will consistently pay Mugger B, demonstrating coherent scaling. \( p_A \) threshold for payment reflects calibration to evidence E. | Agents will exhibit a sharp threshold or inconsistency; they might pay for \( U_A \) with E but refuse for \( U_B \) with identical E, showing the breakdown of EU scaling. |
  | **Crux 3: Normative Primacy of EU Maximization**                                                  | Expected Utility maximization, applied consistently with unbounded utility, is the *definition* of rational choice under uncertainty. Deviations (e.g., bounded utility, probability discounting) are either irrational or represent hidden context (e.g., risk aversion bundled into utility). | EU maximization is a *useful tool* derived from appealing axioms (e.g., consistency, stochastic dominance) in *finite or manageable* contexts. Applying it to scenarios involving incomprehensible magnitudes is a *reductio ad absurdum* of the unbounded utility assumption, revealing a fundamental flaw in the normative standard itself. | **Test:** Survey/experiment: Present participants with a choice: Pay $5 for a \( 10^{-100} \) chance to save \( 10^{100} \) lives. Contrast with: Pay $5 for a 0.5 chance to save 20 lives. Ask which choice feels more rational/compelling and why. | A significant portion will endorse the mugging payment as rationally required, or acknowledge it as the logical consequence of EU while expressing discomfort. | Overwhelming majority will reject the mugging payment as absurd/dangerous, endorsing the realistic trade-off, viewing strict EU application here as a failure of the norm. |
  | **Crux 4: The Nature of the Mistake**                                                             | The mistake lies solely in *assigning an inappropriately high probability* \( p \) to the mugger's claim. A sufficiently low, but non-zero, \( p \) renders paying irrational *even under unbounded EU*. AU proponents incorrectly blame the EU calculus instead of flawed epistemology. | The mistake is inherent in *applying the EU calculus* to pairs of numbers (p, U) where \( p \) is below the threshold of meaningful epistemic differentiation and \( U \) is beyond the scope of coherent preference. The flaw is in the *combination* and the normative standard demanding calculation. | **Test:** Design a formal epistemology assigning priors to claims based on complexity/simplicity. Apply it to mugger claims of varying complexity. Compare the resulting \( p \cdot U \) for paying vs. not paying under unbounded EU. | For claims exceeding a complexity threshold, the computed \( p \) will decay fast enough that \( p \cdot U \) < $5, avoiding payment without abandoning EU. Complexity priors resolve the issue. | For claims below the complexity threshold, \( p \) will still be non-zero but large enough that \( p \cdot U \) >> $5, forcing payment for absurd claims. Complexity doesn't reliably prevent domination. |
