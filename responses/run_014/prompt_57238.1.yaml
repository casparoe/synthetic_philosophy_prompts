  **The "free true evidence can't hurt" argument:**
  The argument is that for an agent who updates by conditionalization, the expected inaccuracy (by a strictly proper scoring rule) when looking and updating is always less than or equal to the expected inaccuracy when not looking. This is because conditionalization minimizes expected inaccuracy (via the strict propriety) and the evidence is free and truthful.

  Step by step:
  1. The agent has a prior over states of the world and over possible evidence.
  2. The agent can choose to observe the evidence (for free) and update by conditionalization, or not observe and keep the prior.
  3. The expected score of the conditionalization strategy is the prior expectation of the posterior expected score (which is minimized by the conditionalization update).
  4. By the law of total expectation, the expected score when not looking is the prior expectation of the score of the prior (which is constant).
  5. Because at each evidence the conditionalized posterior minimizes the expected score (given that evidence) and the prior is a particular probability assignment, the posterior expected score is always at most the prior expected score (and strictly less if the evidence is informative and the scoring rule is strictly proper). Therefore, the overall expected score for conditionalizing is less than or equal to that of not looking.

  **Which step does the case violate?**
  The case does not violate the argument for an agent who conditionalizes. The argument assumes the agent updates by conditionalization. In our case, Jane does not update by conditionalization. The violation of the claim "free true evidence can't hurt" occurs because we are considering an agent who does not update by conditionalization. The argument's conclusion only holds for conditionalizers.

  **Feature doing the work and sensitivity:**
  The key feature is that the agent has a known bias that makes her update worse than not updating at all. If she could bind herself to a written procedure the night before (to conditionalize properly), then she could achieve the CP strategy and look. That would be best. But if she cannot bind (because in the moment she cannot help but use her biased rule), then she is stuck with BR and DL. In that case, DL is better.

  If she is less certain about her bias, then she might not know the exact parameters of her biased update. But if she has some belief that she might update poorly, then she might still prefer DL to avoid the risk of poor updating.

  **Resisting as a counterexample:**
  An accuracy-first theorist would point out that the claim "free true evidence can't hurt" was only ever intended for agents who update by conditionalization. Therefore, it does not apply to Jane because she does not update by conditionalization. The retreat is legitimate because the derivation of the claim assumes conditionalization. However, this means the view does not give advice to agents who know they cannot conditionalize. It tells them to conditionalize, but they cannot. Then, the view remains silent? Or it might say: you should try to become the kind of agent who can conditionalize. But in the meantime, it doesn't say whether to look or not.

  **Implications for the dashboard:**
  For the dashboard that surfaces an alarming metric to an engineer known to overreact, the math suggests that showing the metric might be worse than not showing it, because the engineer's biased reaction might lead to worse accuracy in beliefs. Therefore, it might be better to suppress the metric or to design the interface to automatically compute and display the posterior probability (so the engineer doesn't have to update manually) or to require a confirmation step that enforces proper updating.

