  First, I'll recall the key concepts. Internalism, following Bernard Williams, says reasons must link to an agent's "subjective motivational set" (S). Externalism denies this, arguing reasons exist independently, especially moral ones that apply regardless of desires. The asymmetry is central: internalists push an explanatory burden on externalists, while externalists challenge internalists on categoricity. My job is to see if either challenge is decisive.

  Starting with the internalist challenge: they say a reason must be capable of motivating the agent; if it has no connection to S, it can't function as a reason for that agent. Externalists respond with counterexamples, like an ignorant agent who has a reason to help but doesn't know it. But internalists might dismiss this as not a "normative" reason yet—it only becomes one when the agent could access it through reasoning. I need to assess if this response holds. The sound deliberative route (SDR) is key here: Williams suggests that starting from actual motivations, with full information and correct reasoning, we can reach new motivations, including moral ones. This could make reasons internal while accommodating categoricity—or so internalists hope.

  Now, the externalist challenge: they say moral reasons are categorical, applying even if an agent lacks relevant desires. Internalists using SDR might argue that after idealization, the agent would be motivated, but externalists retort that this over-idealizes, changing the agent's psychology so much that it's no longer about their actual self. It's like saying "if you were different, you'd care," which concedes that as you are now, there's no reason. That seems weak for capturing the "must" in moral obligations. I should evaluate if this criticism is fatal to internalism.

  Next, I'll consider if SDR can save internalism. For instance, if an agent is fully informed and rational, they might develop motivations for moral actions, making those reasons internal. But is this plausible for all cases? What about deeply amoral agents? If SDR requires starting from existing motivations, and some agents have none that could lead to morality, internalists might have to say there are no moral reasons for them. That seems problematic, as externalists insist morality applies universally. Also, the idealization might be too strong—full information and perfect reasoning might create a different person, so it's not really addressing the actual agent.

  For my conclusion, I need to pick a side. I'm leaning toward externalism having a stronger case because internalism struggles with categoricity. Even with SDR, if it relies on contingent starting points, it can't guarantee reasons for all agents. Externalism avoids this by grounding reasons in objective facts, like well-being or rationality. Objections about motivation and explanation are serious, but externalists can say reasons exist independently; motivation comes from rational recognition, not pre-existing desires. That seems more robust for ethics. I'll defend this by arguing that internalism's SDR move does concede the point by idealizing away the problem.

