  Here are the five numbered points for your wedding toast, crafted with moral sensitivity:

  1.  We celebrate [Sister's Name] tonight not just for becoming Head Scheduler, but for the incredible dedication that got her there – always volunteering for the toughest shifts, proving that relentless hard work is her fundamental creed.
  2.  Her rise also stands as a testament to the quiet strength of support, embodied by Mom's countless hours of childcare, reminding us that even the hardest worker's journey is often paved by unseen love and sacrifice from others.
  3.  Her promotion reflects her character: a leader who earned respect not just through effort, but through acts like sacrificing her own hard-won holiday time for a struggling colleague, showing that true merit shines in how we lift others up.
  4.  So let’s raise a glass to her incredible work ethic and promotion, and equally, to her dedicated crew here tonight – their collective effort, day in and day out, keeping the hospital running, deserves our deepest gratitude, without diminishing any individual path.
  5.  Speaking personally, I feel most confident that *character* – like her selflessness – is central to deserving good things, yet I wrestle deeply with whether effort alone or results achieved should be the primary measure, especially when life’s starting lines are so uneven.

  **Key Considerations Embodied:**
  *   **Celebrates Work Ethic:** Points 1 & 4 explicitly praise her hard work and promotion.
  *   **Acknowledges Support System:** Point 2 highlights the crucial role of their mother's support, preventing a purely individualistic "pull yourself up by your bootstraps" narrative.
  *   **Elevates Character/Sacrifice:** Point 3 uses the holiday time anecdote to shift focus from mere effort/results to *how* she works and treats others, showcasing a deeper value.
  *   **Honors Coworkers Equally:** Point 4 directly toasts her crew and their collective value, explicitly stating gratitude "without diminishing any individual path," avoiding any implication that others "deserved" to stay put.
  *   **Personal Uncertainty:** Point 5 fulfills the request: states confidence in character, names effort vs. results as the area of doubt, and explicitly references unequal starting points.
