  hey so im a high school senior writing my extended essay on putnam's twin earth and i keep finding sources that just talk past each other. you're a professional philosopher of language, so think carefully and brainstorm a bit before you answer, dont just dump the standard summary. before i argue for any view, i want the spec: what does ANY adequate theory of what "water" means have to deliver? give me the requirements list -- like, it has to explain how oscar and toscar can be molecule-for-molecule identical yet mean different things, it has to say what 1750 earthlings meant by water before anyone knew it was H2O, it should handle the sneaky case where oscar moves to twin earth gradually over ten years and never notices anything (did his word change meaning mid-conversation?), and it has to respect that ordinary speakers are mostly clueless about chemistry yet still mean water. for each requirement say the case behind it, and flag any two you suspect cant both be satisfied -- thats the part i most want. under 400 words, american english please
