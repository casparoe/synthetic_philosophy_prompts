answer: |-
  Here's the specification for an adequate theory of "water" meaning, derived from Putnam's cases, with the core tension flagged:

  1.  **Referential Difference Requirement:** Must explain why molecule-for-molecule identical speakers (Oscar & Toscar) mean different things by "water" (H₂O vs. XYZ). *(Case: Core Twin Earth thought experiment - difference arises solely from external environment.)*
  2.  **Pre-Scientific Meaning Requirement:** Must account for what 1750 Earthlings *meant* by "water" before chemistry revealed it was H₂O. *(Case: Meaning must be stable across scientific discovery; they referred to H₂O even without knowing its composition.)*
  3.  **Ignorance Tolerance Requirement:** Must explain how ordinary speakers (largely ignorant of chemistry) successfully refer to water (H₂O). *(Case: Speakers mean water despite lacking detailed descriptions or chemical knowledge; meaning isn't individual expertise.)*
  4.  **Gradual Change Requirement:** Must handle the case where Oscar moves gradually to Twin Earth over 10 years, never noticing a difference, interacting seamlessly with locals. *(Case: Does "water" in Oscar's mouth shift meaning mid-conversation? If not, when/how? Tests continuity vs. environmental determination.)*

  **The Core Tension:** **Referential Difference** and **Gradual Change** pull hardest against each other.

  *   **Why Referential Difference?** It demands that meaning is *externally fixed* by the actual substance in the environment (H₂O vs. XYZ), overriding internal states.
  *   **Why Gradual Change?** It suggests meaning must be somewhat stable for the *speaker* over time and seamless interaction, resisting instantaneous switches triggered by imperceptible environmental shifts. Oscar continuously uses "water" in seemingly coherent discourse throughout his move.
  *   **The Conflict:** If meaning is rigidly tied to the *current* external environment (to satisfy Referential Difference), then Oscar's word "water" *must* abruptly switch meaning the moment he takes his first sip of XYZ on Twin Earth (or crosses some arbitrary boundary). But this seems absurd – he notices nothing, his usage patterns remain identical, and his conversations (even mid-sentence!) would suddenly be about something else without him knowing. Conversely, if meaning is anchored to the speaker's *history* or internal state to avoid this absurdity (satisfying Gradual Change), it becomes incredibly hard to explain why Oscar and Toscar *don't* mean the same thing in the original case, given their identical internal states and causal histories *up until their environments diverged*. An adequate theory must navigate this tension between external determination and speaker continuity.

  **Putnam's solution (causal-historical externalism) prioritizes Referential Difference and Pre-Scientific Meaning:** Meaning is fixed by the original baptism event and causal chain. Oscar (Earth-origin) always means H₂O, even on Twin Earth. Toscar (Twin Earth-origin) always means XYZ. This handles ignorance and pre-scientific use well. **But it struggles mightily with Gradual Change:** It forces the conclusion that Oscar is *always wrong* when he says "water" on Twin Earth, even after decades of seamless use indistinguishable from the locals – his word simply doesn't refer to the stuff he's interacting with, which violates intuitions about successful communication and the function of language in his new context. Other theories (like certain forms of descriptivism) might handle Gradual Change better but collapse on Referential Difference. This tension is central to the debate your essay should explore.
