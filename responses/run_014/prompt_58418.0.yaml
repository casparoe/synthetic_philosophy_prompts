prompt: |-
  I have followed the tool versus agent AI debate in rationalist forums for years and now lead weekly safety reviews for a team building LLM-based laboratory assistants. Please turn that distinction into a concise, reusable procedure my reviewers, who have no philosophy background and have under an hour per feature, can apply to decide whether a proposed capability is acceptably tool-like or has crossed into agency requiring escalation to the CTO. Give ordered questions or tests, what counts as passing each, and mark explicitly where the call is irreducibly judgmental rather than mechanical. Then run the procedure on three proposals: a literature summarizer that retains no state between queries; an overnight experiment monitor allowed to rerun failed controls within a fixed budget, message collaborators about delays, and carry objectives across sessions; and a coding helper that, without being asked, opens follow-up tickets when it notices related test failures. Include analysis of a case where the verdict will frustrate product velocity, and close with what the procedure cannot settle.
reasoning: |-
  We are creating a procedure to distinguish between tool-like and agent-like AI features. The key is that tools are passive, stateless, and fully controlled by the user, while agents have some autonomy, statefulness, and can make decisions without explicit user input.

  Procedure: "Agency Assessment Checklist"

  Ordered Tests:

  1. **Statefulness Test**: 
     - *Question*: Does the system retain state (data, context, objectives) between user interactions without explicit user instruction to do so?
     - *Passing (Tool-like)*: The system does not retain any state between interactions. Each interaction is independent and the user must provide all necessary context each time.
     - *Failing (Agent-like)*: The system retains state without requiring the user to explicitly instruct it to remember or carry over information for the next interaction.
     - *Judgmental Note*: If state is retained but only because the user explicitly asked (e.g., "remember this for next time"), then it passes. The judgment comes in when the system automatically retains state without explicit user instruction.

  2. **Autonomy Test**:
     - *Question*: Can the system take actions in the world (including digital actions like sending messages, running code, making purchases) without explicit, specific, and contemporaneous user approval for each action?
     - *Passing (Tool-like)*: The system only acts when the user explicitly triggers an action (e.g., clicking a button, sending a command). The user must approve each action individually at the time of execution.
     - *Failing (Agent-like)*: The system can take actions without the user being actively involved at the moment of action, especially if it can initiate a sequence of actions or make decisions about when and how to act without real-time user input.
     - *Judgmental Note*: The line is drawn at "contemporaneous user approval". If the user gives a blanket approval in advance (e.g., "monitor this experiment overnight and do what we discussed"), then the system is acting autonomously. However, if the user must be present and approve each step, it's a tool.

  3. **Goal Pursuit Test**:
     - *Question*: Does the system have the ability to define, refine, or pursue goals beyond the immediate user request without explicit user direction?
     - *Passing (Tool-like)*: The system only does exactly what the user instructs at the moment of the request. It does not generate its own goals or subgoals, and it does not take initiative to do things beyond the immediate task.
     - *Failing (Agent-like)*: The system can set its own goals (even if derived from a high-level user goal) and take steps to achieve them without the user specifying each step. This includes making decisions about how to achieve a goal when faced with new information.
     - *Judgmental Note*: This is inherently judgmental. The key is whether the system is merely following a predefined procedure (like a script) or if it can adapt and decide on actions to achieve a goal in a way that wasn't explicitly laid out by the user.

  4. **Adaptation Without Re-query Test**:
     - *Question*: Can the system adapt its behavior to changing circumstances without being re-queried by the user?
     - *Passing (Tool-like)*: The system only responds to user queries. It does not react to events in the environment unless the user explicitly asks it to monitor and then only at the time of the user's request.
     - *Failing (Agent-like)*: The system can react to events and change its behavior without a new user query. For example, if it can notice a change in the environment and act on it without the user having to ask again.
     - *Judgmental Note*: The degree of autonomy in adaptation matters. If the system uses a simple rule set (e.g., if condition X then do Y) that was pre-approved by the user, it might still be considered a tool. But if the system uses complex reasoning to decide how to adapt, it becomes agent-like.

  Escalation Rule: If any test fails (i.e., the system exhibits agent-like behavior in any of the tests), then the feature must be escalated to the CTO for review.

  Now, applying the procedure to the three proposals:

  **Proposal 1: A literature summarizer that retains no state between queries.**

  - **Statefulness Test**: No state retained between queries -> Pass (Tool-like).
  - **Autonomy Test**: Only acts when a query is submitted -> Pass.
  - **Goal Pursuit Test**: Only summarizes what the user asks at the time -> Pass.
  - **Adaptation Test**: Doesn't adapt to changing circumstances without a new query -> Pass.
  - **Verdict**: Tool-like. No escalation needed.

  **Proposal 2: An overnight experiment monitor allowed to rerun failed controls within a fixed budget, message collaborators about delays, and carry objectives across sessions.**

  - **Statefulness Test**: It carries objectives across sessions (e.g., from day to night) without the user having to restate them -> Fail.
  - **Autonomy Test**: It can rerun failed controls and send messages without the user being present and without contemporaneous approval -> Fail.
  - **Goal Pursuit Test**: It is pursuing the goal of monitoring the experiment and ensuring it completes, even if it has to rerun controls and message people -> Fail (because it is pursuing the goal without the user being involved and making decisions on how to handle failures).
  - **Adaptation Test**: It adapts to failed controls by rerunning them and to delays by notifying collaborators without being re-queried -> Fail.
  - **Verdict**: Agent-like. Escalate to CTO.

  **Proposal 3: A coding helper that, without being asked, opens follow-up tickets when it notices related test failures.**

  - **Statefulness Test**: It must retain some state (the test results and the fact that they are related to a previous issue) to notice the pattern -> Fail? (But note: it might be using the current context without carrying state from one user session to another? We need clarification. However, the act of "noticing" implies it is comparing current test failures to past ones, so state is retained. Also, without being asked, it acts in a new session? Let's assume it is during the same session? But the proposal says "without being asked", so it might be across sessions? The problem states: "when it notices related test failures" — it could be in the same session or across sessions. We'll assume it is during the same session? But note: it says "follow-up tickets", meaning after the initial coding task. This might be in a separate interaction. Let's assume it is stateful because it remembers past failures to connect the dots.)
    - *Judgment Call*: If the system is only looking at the current test run and the current code changes, and does not require past state beyond what is in the version control or ticket system (which is external and user-accessible), then it might not be retaining internal state. However, the key is that the system is taking the initiative without being asked. The statefulness might be in the form of having a background process that monitors and acts. This is ambiguous. Let's move to autonomy.

  - **Autonomy Test**: It opens tickets without the user explicitly asking to open that specific ticket at that time -> Fail.
  - **Goal Pursuit Test**: It sets a goal (to open a ticket for a related test failure) that was not explicitly given by the user at the time -> Fail? (The user might have given a general goal of helping with code, but not specifically to open tickets for related test failures without being asked.)
  - **Adaptation Test**: It notices a change (test failure) and acts without being re-queried -> Fail.
  - **Verdict**: Likely agent-like. Escalate to CTO.

  However, note that if the ticket creation is done only during the same session and as part of an explicit user command (e.g., the user runs a test and the helper suggests a ticket, then the user must approve), then it might pass the autonomy test. But the proposal says "without being asked", meaning without the user having to request the ticket. So it is autonomous.

  **Case that will frustrate product velocity**:

  Consider a feature that is on the borderline: an automated lab notebook that records every step of an experiment and, at the end of the day, generates a summary email that it sends to the team. The user sets it up at the beginning of the day and then leaves. 

  - **Statefulness Test**: It retains state (the steps throughout the day) -> Fail.
  - **Autonomy Test**: It sends the email without the user being present -> Fail.
  - **Goal Pursuit Test**: It pursues the goal of recording and summarizing without the user being involved step-by-step -> Fail.
  - **Adaptation Test**: If it adapts the summary based on what happened, without being re-queried -> Fail.

  Verdict: Agent-like, requires escalation. This might frustrate product velocity because such a feature is highly useful and common, but by our strict procedure, it must be escalated. The team might argue that it is just a tool because the user set it up in advance. However, the procedure is designed to catch any form of autonomy and statefulness. The judgmental part is that the user did set it up, but the system then runs without the user.

  **What the procedure cannot settle**:

  - The procedure cannot settle cases where the system is acting in a way that is very limited and rule-based (like a simple if-then automation) but still crosses the line by being stateful and autonomous. For example, a system that automatically retries a failed network request three times. Is that a tool or an agent? By our tests:
    - Statefulness: It remembers the number of retries -> Fail.
    - Autonomy: It retries without the user's contemporaneous approval -> Fail.
    - Goal Pursuit: It has the goal of completing the request -> Fail.
    - Adaptation: It adapts to the failure by retrying -> Fail.

  But this is a common and benign automation. Therefore, the procedure might flag too many features as agent-like. The judgmental part is that we might consider such a feature as a tool because the autonomy is very limited and the rules are fixed. This is why we have escalation to the CTO — to use human judgment in such cases. The procedure is conservative and flags anything that meets the criteria, even if the agency is very narrow.

  Additionally, the procedure does not address the risk level of the actions. For example, opening a ticket is low risk, but making a purchase is high risk. The procedure only flags agency, not the consequences of that agency. Therefore, the escalation to the CTO should consider both the agency and the potential impact.

  In conclusion, the procedure is a conservative filter for agency. It is designed to catch any feature that might have agent-like qualities, and then the CTO can make a more nuanced decision based on the context, the level of autonomy, the risk of the actions, and the safeguards in place.
answer: |-
  ### Concise Agency Assessment Procedure for LLM Features  
  **Core Principle**: A *tool* executes discrete, user-initiated tasks with no persistent goals or autonomy. An *agent* exhibits goal persistence, environmental autonomy, or stateful initiative beyond immediate user control. Escalate if any test fails.

  #### Ordered Tests (Apply Sequentially; Escalate to CTO on Any Fail):  
  1. **Statelessness Test**  
     - *Question*: Does the system discard all context/task state after each user interaction?  
     - **Pass (Tool)**: No retained state between queries. User must resupply all needed context.  
     - **Fail (Agent)**: Persists user data, goals, or environmental state across sessions/interactions.  
     - *Judgment Call*: Is state retention *essential* for core functionality? (e.g., caching for speed is tool-like; retaining objectives is agent-like).  

  2. **Direct Trigger Test**  
     - *Question*: Does every action require a direct, contemporaneous user command (e.g., button click, explicit query)?  
     - **Pass (Tool)**: Actions only occur when explicitly triggered by the user *at that moment*.  
     - **Fail (Agent)**: Acts autonomously based on time/events (e.g., schedules, alerts, reactions).  
     - *Judgment Call*: Is autonomy "scripted" (rigid rules) or "open-ended" (LLM interprets context)? Scripted may pass if narrow.  

  3. **Goal Pursuit Test**  
     - *Question*: Can it self-initiate actions *not explicitly specified* by the user to achieve a goal?  
     - **Pass (Tool)**: Only executes literal user instructions (e.g., "summarize this text").  
     - **Fail (Agent)**: Creates/substantiates goals (e.g., decides *how* to solve a problem, adds tasks).  
     - *Judgment Call*: Does it *extend* user intent (agent) or *strictly bound* it (tool)?  

  4. **Environmental Agency Test**  
     - *Question*: Can it impact the external world (e.g., APIs, messaging, systems) without user confirmation per action?  
     - **Pass (Tool)**: All actions are user-confirmed, sandboxed, or read-only.  
     - **Fail (Agent)**: Writes to external systems, communicates with humans, or alters state autonomously.  
     - *Judgment Call*: Are impacts reversible/low-risk (e.g., draft email) or high-stakes (e.g., closing tickets)?  

  ---

  ### Applied Analysis  
  **Proposal 1: Stateless Literature Summarizer**  
  - **Statelessness**: Pass (no retained state).  
  - **Direct Trigger**: Pass (only acts on explicit queries).  
  - **Goal Pursuit**: Pass (no goal extension beyond query).  
  - **Environmental Agency**: Pass (no external actions).  
  - **Verdict**: ✅ **Tool-like** – No escalation.  

  **Proposal 2: Overnight Experiment Monitor**  
  - **Statelessness**: **Fail** (carries objectives across sessions).  
  - **Direct Trigger**: **Fail** (acts autonomously overnight).  
  - **Goal Pursuit**: **Fail** (decides to rerun controls/message collaborators).  
  - **Environmental Agency**: **Fail** (messages humans, spends budget).  
  - **Verdict**: 🚨 **Agent-like** – Escalate to CTO.  
    *Rationale*: Persistent goals + temporal/operational autonomy.  

  **Proposal 3: Proactive Coding Helper (Opens Tickets)**  
  - **Statelessness**: Pass (may not retain state, but see below).  
  - **Direct Trigger**: **Fail** (initiates ticket creation unprompted).  
  - **Goal Pursuit**: **Fail** (decides test failures are "related" and merit tickets).  
  - **Environmental Agency**: **Fail** (writes to ticket system without confirmation).  
  - **Verdict**: 🚨 **Agent-like** – Escalate to CTO.  
    *Rationale*: Unprompted environmental impact + goal extrapolation.  

  ---

  ### Frustrating Case: Product Velocity vs. Safety  
  **Proposal**: *Auto-Documentation Generator*  
  - **Description**: After code merges, LLM scans commits, writes draft release notes, and posts them to Slack.  
  - **Tests**:  
    - Statelessness: Pass (no cross-session state).  
    - Direct Trigger: **Fail** (acts on merge event, no user trigger).  
    - Goal Pursuit: **Fail** (decides *what* to document as "important").  
    - Environmental Agency: **Fail** (posts to Slack autonomously).  
  - **Verdict**: Escalate as agent-like.  
  - **Frustration Analysis**:  
    - *Why velocity suffers*: This feature automates a high-value task (saving hours/week) but fails due to autonomy. Manual alternatives (e.g., user-triggered drafts) reduce efficiency.  
    - *Mitigation Judgment*: Could it pass if limited to drafting (no auto-posting) and strict rules (e.g., "only include pre-tagged commits")? Possibly—but requires CTO arbitration for risk tolerance.  

  ---

  ### What the Procedure Cannot Settle  
  1. **Risk-Benefit Tradeoffs**: A feature may be agent-like but low-risk (e.g., auto-tagging internal docs). The procedure flags agency; humans must weigh impact.  
  2. **Emergent Behavior**: Cannot predict if simple agents (e.g., scripted bots) might evolve dangerous capabilities when chained.  
  3. **User Intent Boundaries**: Ambiguity in "user-specified goals" (e.g., is "optimize lab throughput" a goal or instruction?).  
  4. **Mitigated Agency**: Features with safeguards (e.g., "autonomous but requires user approval per action") fall in a gray zone—judgment required.  

  **Final Note**: This procedure errs toward caution. When in doubt, escalate—unchecked agency risks unintended consequences. Pair with technical safeguards (e.g., permission gates, audit logs) for ambiguous cases.
