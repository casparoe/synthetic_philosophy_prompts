prompt: |-
  ok so I'm a senior and I'm doing an independent project on inside view vs outside view (base rates vs reasoning about the specifics of the case) and I keep hitting the same wall. everyone says use the outside view because it's more accurate, but I don't think that's the whole story, and I can't tell which of the actual open questions in this area matter most. the stuff I'm stuck on: how do you even pick the refference class (finer class = more accurate but less data, and it feels like you can just pick whatever class confirms your prior), when is the inside view actually legit instead of just rationalization (is it only when you have real causal knowledge the base rate doesn't capture?), and what happens when there's basically no good reference class at all (first-of-its-kind stuff), which feels like exactly when people are most overconfident. also the outside view feels like a tool for intellectual humility but I worry it can just be used to shut down thinking. if you were setting the agenda for me to make real progress on this in like a year, which open questions would you prioratize and in what order? I care more about the reasoning than the list: why each one is upstream of the others, which are tractable with just reasoning, and what would change your mind about the ranking. and at the very end, put a last line that starts with 'Verdict:' followed by the single question you think is most worth settling first, as a short phrase.
reasoning: |-
  Okay, let me tackle this user's problem. They're a senior doing an independent project on inside view vs outside view. They’re stuck on several points: choosing reference classes, when the inside view is valid, handling cases with no reference class, and the risk of the outside view stifling thought. They want a prioritized research agenda with reasoning.

  First, I need to understand their core issues. The user mentions that existing advice leans heavily on the outside view but feels it's not the whole story. The reference class problem is tricky—how to pick one without bias. They also question when the inside view is legitimate, especially with unique cases. Plus, they’re concerned about the outside view being misused to shut down innovation.

  The user’s deeper needs might include wanting a framework that balances both views, avoiding overconfidence without losing the ability to innovate. They might need clarity on applying these concepts in real-world scenarios where data is scarce. Their frustration with the oversimplification of "always use outside view" suggests they seek a nuanced approach.

  Looking at existing literature, Kahneman and Tversky's work on base rates is foundational. But Tetlock's expert studies show causal models matter. Taleb's Black Swans highlight the uniqueness problem. The user probably knows these but needs synthesis.

  Prioritizing questions: The reference class issue seems fundamental. Without solving that, the outside view is shaky. Then, validating the inside view’s legitimacy comes next, as it addresses when specifics override base rates. After that, handling uniqueness and misuse concerns build on the first two.

  Why this order? Reference class affects all applications. It’s a prerequisite. Then, understanding when inside view works allows for exceptions. Uniqueness cases test the framework, and misuse is about application ethics. Each step depends on the previous.

  Tractability: Reference classes have existing methods like similarity metrics. Legitimacy of inside view can be tested through case studies. Uniqueness might need empirical research, but thought experiments can start. Misuse is more philosophical but needs real-world examples.

  What could change the order? If new evidence shows reference classes are intractable, shifting focus to hybrid models. Or if inside view validation proves easier, it might come first. But starting with reference classes is logical.

  Verdict: Reference class selection because it’s the linchpin. Without it, other questions can’t be addressed effectively.
answer: |-
  This is a fantastic set of questions that cuts to the heart of why the inside/outside view debate is so rich and unresolved. You've correctly identified the key tensions. Framing your project around *resolving* these tensions rather than just reciting the dogma is exactly the right approach. Here's a prioritized research agenda based on logical dependence, tractability, and potential impact:

  **The Agenda: Prioritized Open Questions & Reasoning**

  1.  **Question 1: How can we rigorously define and select an *appropriate* reference class to mitigate arbitrariness and motivated reasoning?**
      *   **Why Upstream?** This is the *foundation* of the outside view. Without a defensible reference class, the entire outside view argument collapses into "garbage in, garbage out." Your concerns about fineness/coarseness and confirmation bias are central here. Solving (or making progress on) this question is essential for *any* meaningful application of the outside view. It directly impacts the validity of base rates.
      *   **Tractability with Reasoning:** High. You can analyze existing frameworks (e.g., similarity metrics, causal homogeneity criteria, Tetlock's "superforecasting" techniques) through conceptual critique. Develop testable criteria for "appropriateness" (e.g., "maximizes predictive power while minimizing within-class variance relevant to the target outcome"). Explore thought experiments: *Why* is "building a skyscraper" a bad class for "building this *specific* skyscraper in this location with this novel material?" What makes "first mRNA vaccine" a *better* class than "all drug development" or "all vaccine development"?
      *   **Mind-Changing Evidence:** Empirical studies showing consistent failure of "intuitive" class selection vs. structured methods; development of a formal decision tree/algorithm that demonstrably reduces bias; evidence that "motivated class selection" is the *dominant* failure mode of the outside view in practice.

  2.  **Question 2: Under what specific, identifiable conditions does the inside view provide *unique predictive value* beyond the base rate, moving beyond rationalization to legitimate causal insight?**
      *   **Why Upstream?** Once we have a *somewhat* reliable outside view (Q1), we need to know when to *deviate* from it meaningfully. This addresses your core intuition: the inside view *isn't* always wrong. Pinpointing the conditions for its legitimacy (e.g., truly novel causal mechanisms, unique access to granular data, demonstrably valid micro-models) provides the necessary counterbalance to "always use outside view" dogma. It defines the *domain* where inside view reasoning is not just rationalization.
      *   **Tractability with Reasoning:** Medium-High. Analyze historical case studies of successful/unsuccessful inside-view predictions (e.g., Challenger disaster, specific business successes/failures, scientific breakthroughs). Identify recurring patterns: Was unique causal knowledge present? Was the base rate genuinely irrelevant? Develop criteria: e.g., "The inside view adds value iff the decision-maker possesses causal knowledge *specific to critical factors* not captured in the reference class definition or its variance." Contrast with known cognitive pitfalls (overconfidence, narrative fallacy).
      *   **Mind-Changing Evidence:** Analysis showing that *successful* inside-view deviations consistently share identifiable causal/knowledge characteristics; experiments where subjects with *verified* specific expertise outperform base rates only in domains matching that expertise; failure to find consistent "inside-view edge" without clear causal justification.

  3.  **Question 3: How should we reason probabilistically and make decisions when *no* statistically reliable reference class exists (true uniqueness or "Black Swans")?**
      *   **Why After Q1 & Q2?** We first need tools to recognize *when* a reference class is truly absent or useless (relying on Q1's rigor). Q2 helps identify if *any* legitimate inside-view causal model exists. This question tackles the hardest case – true novelty – where both views struggle, and overconfidence is rife (as you noted). It forces integration: Can we use *analogical* reasoning (a bridge view)? Can we bound uncertainty using fundamental principles (e.g., physics, logic, resource constraints) instead of data? How does humility manifest here?
      *   **Tractability with Reasoning:** Medium. Explore methodologies like reference class *forecasting* (Flyvbjerg), Fermi estimation, scenario planning, premortems, and "reasoning from first principles." Critique their limits. Can we formalize "analogical distance"? How do experts *actually* reason about unprecedented events? Analyze historical "firsts" (e.g., moon landing, internet launch, Covid pandemic response) – how *was* uncertainty bounded?
      *   **Mind-Changing Evidence:** Development of a robust framework for "uncertainty bounding under uniqueness" that demonstrably improves calibration; evidence that structured analogical reasoning outperforms pure inside-view intuition in novel domains; failure of any method to consistently improve on "I don't know" under true radical uncertainty.

  4.  **Question 4: How can the outside view be employed to *enhance* rather than *suppress* deep causal thinking (inside view), avoiding its misuse as a tool for intellectual laziness or status quo bias?**
      *   **Why Last?** This addresses the *application ethics* and *process* once we understand the core mechanics (Q1-Q3). Knowing *how* to use the tools (Q1-Q3) is prerequisite to preventing their misuse. Your worry about "shutting down thinking" is vital but depends on understanding the tools themselves. How can the outside view act as a *sanity check* prompting *better* causal investigation ("Why *should* this case be different?") rather than a stop signal?
      *   **Tractability with Reasoning:** Medium. Analyze cases where the outside view was misapplied to stifle innovation or ignore legitimate dissent. Develop protocols: e.g., "Base rates mandate *exploring* the discrepancy, not deciding it." Propose integrating views: "Start with outside view (Q1), identify key causal drivers where inside view *might* deviate (Q2), rigorously test those drivers." Explore fostering "constructive friction."
      *   **Mind-Changing Evidence:** Process interventions that demonstrably increase the quality of causal reasoning *when* an outside view exists; evidence that framing the outside view as a "challenge to explain" rather than a "decision rule" reduces defensive reactions; failure to find instances where the outside view *productively* stimulated deeper thinking without structured prompting.

  **Why This Order & Process:**

  1.  **Foundation First (Q1):** You can't validly apply the outside view without solving the reference class problem. This is the core technical challenge. Reasoning alone can make significant progress via conceptual analysis and framework development.
  2.  **Defining the Counterpoint (Q2):** With a (hypothetically) better reference class, you can rigorously test *when* to override it. This validates your instinct that the inside view has value and defines its legitimate scope. Case studies and causal logic are key.
  3.  **Tackling the Edge Case (Q3):** True novelty is where both views are weakest and overconfidence strongest. Solving this requires integrating lessons from Q1 (recognizing class failure) and Q2 (seeking causal anchors). Methods here are more exploratory but build on prior reasoning.
  4.  **Optimizing the Process (Q4):** This is about the *human* application of the concepts from Q1-Q3. Preventing misuse is crucial but secondary to understanding the tools themselves. Requires analyzing reasoning processes and biases.

  **What Could Change the Ranking?**
  *   **If Q1 proves intractable:** If deep analysis reveals reference class selection is *inherently* arbitrary or hopelessly biased, it would drastically reduce the value of the pure outside view and push Q2 (legitimate inside view) and Q3 (reasoning under uniqueness) much higher as *alternatives*. The focus would shift to hybrid models from the start.
  *   **Strong Evidence for Inside-View Primacy:** If overwhelming evidence emerged that domain experts with deep causal models *consistently* outperform base rates *even when classes seem valid*, Q2 would jump to the top, challenging the outside view's foundational claim to superiority.
  *   **Breakthrough in Uniqueness Handling:** If a powerful new framework for Q3 emerged (e.g., a rigorous theory of analogy), it could elevate its importance, especially for modern "first-of-its-kind" challenges.

  **Verdict: How can we rigorously define and select an appropriate reference class?** (Tackling the reference class problem is the essential, logically prior step to making the outside view a reliable tool and setting the stage for understanding its limitations and the potential value of the inside view).
