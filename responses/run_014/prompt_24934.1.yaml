prompt: |-
  So I've been thinking about resentment lately — like, when it feels justified to resent someone and when it doesn't. Not in a abstract philosophical way (I'm not a philosopher, I just fell down a rabbit hole after a bad falling-out with a friend). I started keeping track of my gut reactions to different situations, real and imagined, and now I'm trying to figure out if there's a coherent principle behind them or if I'm just inconsistent. Here's what I've got:

  - A colleague takes credit for my work in a meeting. I resent them. Seems clear.
  - A friend forgets we had plans because their parent had a medical emergency. I don't resent them at all.
  - A friend forgets we had plans because they were binge-watching a show and lost track of time. I resent them, though less than the colleague case.
  - Someone with severe schizophrenia says something cruel to me during an episode. I don't resent them — I just feel sad and want them to get help.
  - A person diagnosed with antisocial personality disorder lies to me and manipulates me for their own gain. I resent them, strongly, even though I believe their condition means they literally cannot empathize or grasp why what they did was wrong.
  - A coworker with OCD interrupts meetings constantly with compulsive rituals. I don't resent them; I see it as something to be accommodated.
  - Someone who grew up in an extremely abusive household and never had a chance to learn emotional regulation screams at me during an argument. I'm genuinely torn — part of me resents them, part of me thinks they never had a fair shot at turning out differently.
  - A stranger cuts me off in traffic because they're texting. I resent them.
  - A stranger cuts me off in traffic because they're rushing someone to the hospital. I don't resent them.

  The ones that bug me are the sociopath case and the abusive-upbringing case sitting next to the schizophrenia and OCD cases. In all four, there's a sense in which the person "can't help" being the way they are — but I'm pulling in totally different directions. With the schizophrenic person and the OCD coworker, I drop resentment entirely. With the sociopath, I don't. With the abuse survivor, I'm stuck in the middle.

  Is there a principle that makes sense of all these verdicts? And if not, which ones should I reconsider? Also, what would your principle say about a case I keep going back and forth on: someone commits a serious crime while in the grip of a severe addiction — not a one-time lapse, but a years-long substance use disorder that has demonstrably rewired their decision-making. Should I resent them, or not?

  Please keep your answer to under 400 words — I want the principle stated clearly and then applied, not a essay.
reasoning: |-
  Okay, the user is dealing with resentment in various scenarios and trying to find a consistent principle. Let me start by looking at the examples they provided. They mentioned situations like a colleague stealing credit, friends forgetting plans due to emergencies vs. binge-watching, mental health conditions like schizophrenia and OCD, and personality disorders like ASPD. The user is particularly conflicted about cases where someone "can't help" their behavior but the resentment varies.

  First, I need to identify patterns. In cases where the person had control and chose to act harmfully, like the colleague taking credit or the texting driver, resentment is present. When harm was unintentional or beyond control, like the friend with a family emergency or the schizophrenia episode, resentment isn't there. But the ASPD case is tricky—they can't empathize, yet the user resents them. Similarly, the abuse survivor who lashes out is a middle ground. 

  The key seems to be about control and intent. The principle might revolve around whether the person had the capacity to choose differently. ASPD individuals might lack empathy, but they can still make choices to manipulate, whereas someone in a schizophrenic episode isn't in control. For the addiction example, it's about compromised control versus choice. The user needs clarity on that. 

  Also, the user might be seeking validation for their feelings and a framework to manage resentment without guilt. They might want to reconcile empathy with holding people accountable. Addressing the addiction case specifically could help them apply the principle practically. Need to keep it concise, under 400 words, focusing on control, responsibility, and intent.
answer: |-
  Here's a clear principle distilled from your reactions:

  **Resentment arises when you perceive someone *could and should* have acted differently to avoid harming you, implying both capacity and responsibility.**

  Now, applied to your cases:

  1.  **Colleague takes credit:** Could/should have given credit. **Resentment.**
  2.  **Friend forgets (medical emergency):** Couldn't/shouldn't have prioritized plans. **No resentment.**
  3.  **Friend forgets (binge-watching):** Could/should have managed time. **Resentment (milder).**
  4.  **Schizophrenia (during episode):** Lacks capacity/control. **No resentment.**
  5.  **ASPD manipulation:** *Could* choose not to manipulate (even if motivation differs). Perceived responsibility remains. **Resentment.**
  6.  **OCD rituals:** Lacks control over compulsions. **No resentment.**
  7.  **Abuse survivor screams:** *Capacity* for regulation is impaired by trauma, but *agency* in the moment exists. **Ambivalence (conflict between understanding lack of capacity vs. expectation of responsibility).**
  8.  **Stranger texting:** Could/should pay attention. **Resentment.**
  9.  **Stranger (medical emergency):** Couldn't/shouldn't prioritize driving norms. **No resentment.**

  **The "Bugging" Cases Explained:**
  *   **Schizophrenia/OCD vs. ASPD:** You perceive the schizophrenic person and OCD coworker as lacking *control* during the harmful act. The ASPD individual, while lacking empathy, retains *agency* - they *choose* manipulative actions to achieve goals, even if they don't feel remorse. You hold them responsible for that choice.
  *   **Abuse Survivor:** The trauma impaired their *capacity* for regulation, creating a conflict. You see the *choice* to scream (agency), but understand the *extreme difficulty* in making a different choice (compromised capacity). Hence, torn.

  **The Addiction Case (Your Question):**
  Applying the principle: Severe, long-term addiction demonstrably *compromises* decision-making capacity and control, often overriding the ability to "choose differently" despite knowing consequences. While harmful acts occur, the core capacity/control is impaired. **Principle suggests leaning towards *no resentment*,** similar to the schizophrenia case. Focus shifts to harm, accountability (e.g., legal consequences), and need for treatment, rather than personal resentment for actions driven by the disease.
