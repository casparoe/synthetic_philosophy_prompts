prompt: |-
  I got into a long argument with my flatmate last weekend — he's very into forecasting tournaments and the rationalist blogosphere — about the probability that a particular AI lab releases a certain kind of model before 2027. He said 60%, I said 15%, and after we traded numbers for a bit he announced that "rational agents cannot agree to disagree", Aumann's agreement theorem, and acted like the conversation was basically over: either I'm being irrational by not moving toward him, or we have to meet in the middle right now, or one of us has to concede. Something about that felt off to me — he's gesturing at a real theorem, I'm sure, but the slogan seems to be doing a lot of work the theorem itself maybe doesn't. For what it's worth, he's also much better calibrated than me (he does this stuff semi-professionally, I mostly just argue), which he did bring up, so maybe I *should* defer more than I want to. That annoys me and I can't tell if it's warranted annoyance.

  Anyway, I want to come back to him with a proper map of what that one line could actually be claiming. As best I can tell there are several distinct things it might mean: something very precise about two ideal agents with a common prior whose posteriors are common knowledge having to be identical; something weaker about the mere fact of persistent disagreement being evidence that at least one party is irrational or has a different prior (and that second disjunct seems like a big escape hatch in practice); something about what actual humans should do when they learn the other's probability, like a rule for how far to move; something asymptotic about convergence if you keep honestly reporting your numbers back and forth forever; and maybe a normative/party-line version where the slogan is just a reminder to treat disagreement itself as information. There may be readings I'm missing entirely.

  Could you lay these out as a menu — the trivial readings, the substantive-and-true ones, the substantive-but-false ones — and for each say whether it's plausible and, crucially, whether it actually licenses what my flatmate did with it (i.e. treating my not updating as proof of my irrationality, right there, in one conversation)? Also, if you can, say something about whether his being the better-calibrated forecaster changes the answer — is there a defensible reading of the slogan that tells me to defer to him specifically, or is that smuggling in a different principle altogether? Please write in British English. Ta.
reasoning: |-
  Alright, the user is having a dispute with their flatmate about AI model release probabilities, and the flatmate invoked Aumann's agreement theorem to shut down the argument. Let me start by recalling what Aumann's theorem actually states. It's about two rational agents with a common prior who cannot agree to disagree if their beliefs are common knowledge. But in real-life scenarios like this one, several conditions aren't met.

  First, the user and their flatmate likely don't have a common prior. They probably have different experiences and information sources, especially since the flatmate is into forecasting professionally. The common prior assumption is a big idealization. Also, common knowledge is tricky here. Just stating probabilities once doesn't make them common knowledge; it requires mutual recognition that both know and so on, which isn't practical in a casual convo.

  The user mentioned their flatmate is better calibrated. That's a separate point. If the flatmate has a track record of accurate forecasts, that's a reason to weigh his opinion higher, but Aumann doesn't directly address calibration differences. That's more about Bayesian updating based on past performance.

  The user feels annoyed and wonders if their annoyance is justified. It seems like the flatmate used the theorem as a rhetorical weapon, which oversimplifies a complex concept. The theorem's conditions aren't satisfied here, so the flatmate's insistence that they must converge immediately isn't valid. 

  Also, the escape hatch of differing priors is significant. Aumann allows for disagreement if priors differ, which is likely the case. The user might need to acknowledge that their different backgrounds lead to different starting points, and that's rational.

  The user wants a clear breakdown of possible interpretations of the theorem and whether any justify the flatmate's behavior. I should outline the strict interpretation, the weaker versions, and why none support immediate convergence demands. Highlighting the calibration point as a separate issue is key. The user should understand that while the flatmate's experience might warrant deference, Aumann's theorem itself doesn't compel that.

  Lastly, addressing the user's annoyance: yes, it's warranted because the flatmate misapplied the theorem. The user can push back by explaining the theorem's assumptions and emphasizing the role of differing priors and calibration evidence instead.
answer: |-
  Right, your flatmate has deployed the "Aumann's Agreement Theorem" (AAT) cannon, a common rhetorical move in rationalist circles, but it's often wildly misapplied. Let's break down the possible interpretations, their plausibility, and what they *actually* license – especially regarding his behaviour. I'll use British English throughout, as requested.

  **The Core Theorem (The Precise, Formal Reading)**
  *   **What it claims:** If two rational agents share *the exact same prior probability distribution* over all possible states of the world, and their *posterior probabilities* (after updating on private evidence) for a specific event become *common knowledge* between them, then those posterior probabilities *must be equal*.
  *   **Plausibility/Truth:** This is the actual, proven mathematical theorem (Aumann, 1976). It's true *within its extremely narrow, formal framework*.
  *   **Licenses your flatmate's behaviour? Absolutely not.** This framework is almost never satisfied in real-world human disagreements, especially one-off chats like yours:
      *   **Common Prior?** Highly unlikely. Your life experiences, reading, biases, understanding of the AI field, risk aversion, etc., are almost certainly different. You *don't* start from the same fundamental probability distribution over every conceivable detail relevant to AI development timelines.
      *   **Common Knowledge of Posteriors?** Him stating "60%" and you stating "15%" is *not* common knowledge. Common knowledge requires not just that you both know the numbers, but that you both know the other knows, and both know that the other knows that you know, and so on *ad infinitum*. A single exchange in a casual argument doesn't achieve this. Establishing CK is computationally and practically infeasible for complex real-world beliefs.
      *   **Rational Agents?** Humans are boundedly rational. We use heuristics, suffer cognitive biases, have limited processing power, and often haven't fully articulated *all* our relevant evidence even to ourselves.
  *   **Conclusion:** Invoking the formal theorem as a conversation-ender in a real-world disagreement like yours is **invalid**. The preconditions simply aren't met. It's like citing the laws of thermodynamics to prove you can't win at Monopoly.

  **Weaker Interpretations (The More Common Slogan Usages)**

  1.  **"Persistent Disagreement Implies Irrationality or Different Priors"**
      *   **What it claims:** If two people who seem rational keep disagreeing after sharing their views, it *must* be because (a) at least one is irrational (e.g., not updating correctly), or (b) they started with fundamentally different priors.
      *   **Plausibility/Truth:** This is a *loose corollary* of the formal theorem, often treated as the main takeaway. It highlights that *if* the ideal conditions *were* met, disagreement *would* imply irrationality. In practice, it reminds us that disagreement *can* signal one of these things, but it's not *proof*. The "different priors" escape hatch is vast.
      *   **Licenses your flatmate's behaviour? Partially, but misleadingly.**
          *   It *does* suggest your disagreement *might* stem from irrationality *or* different priors. Him pointing this out *could* be a prompt for reflection ("*Why* do we disagree? Do I trust his reasoning? Do we just see the world fundamentally differently?").
          *   It **does not** license him declaring the conversation over, demanding immediate convergence, or claiming your *specific* lack of movement *proves* *your* irrationality *on the spot*. It highlights a *possibility*, not a certainty, and the "different priors" explanation is often the most plausible in reality. His behaviour oversimplifies and misapplies the insight.

  2.  **"Disagreement Itself is Evidence - Update Partway!"**
      *   **What it claims:** Learning that a seemingly reasonable person disagrees with you *should* cause you to update your belief towards theirs (and vice versa), simply because their disagreement is new information. Some interpretations suggest moving towards a weighted average or just partway.
      *   **Plausibility/Truth:** This is a *normative heuristic* inspired by AAT, not a direct consequence. It has some merit: if you genuinely respect someone's judgement, their disagreement *should* make you pause and reconsider ("Do they know something I don't? Am I missing something?"). However:
          *   **Not Mechanically Required:** There's no AAT-mandated "correct" amount to move (e.g., meet in the middle). How much you update *should* depend on *why* you respect their view and the *nature* of the disagreement.
          *   **Highly Context Dependent:** How much you update depends on your assessment of their expertise, reasoning, access to information, potential biases, and crucially, *how surprising* their estimate is to you. If you think they're usually sensible but their 60% seems wildly optimistic based on your understanding, you might move very little. If their 60% makes you realise you'd overlooked a key factor, you might move significantly.
      *   **Licenses your flatmate's behaviour? No, not his specific demands.**
          *   It *might* license him *suggesting* you should both update somewhat based on hearing each other's numbers. It *encourages* treating disagreement as information.
          *   It **does not** license him declaring that you *must* converge instantly, that meeting in the middle (37.5%) is the "rational" solution, or that your refusal to move significantly is *proof* of your irrationality. It's a prompt for reflection and *possible* updating, not a rigid rule dictating *how much*.

  3.  **"Keep Talking Forever and You'll Converge (Asymptotically)"**
      *   **What it claims:** If you both keep honestly sharing your probabilities and the reasoning behind them, and keep updating rationally based on each new exchange, you should eventually converge to the same probability, *even if you started with different priors* (assuming shared likelihood functions, etc.).
      *   **Plausibility/Truth:** This is a *potential* long-run consequence under *idealised* conditions (perfect rationality, honest sharing, shared understanding of evidence/likelihoods, infinite time/computation). In practice, humans rarely achieve this. Conversations get derailed, new evidence emerges, people get tired or defensive, or fundamental differences in interpreting evidence persist.
      *   **Licenses your flatmate's behaviour? No.**
          *   This is a theoretical asymptotic property, not a prescription for a single conversation. It suggests *further discussion might be fruitful*, not that the *initial* exchange *must* lead to convergence or that lack of immediate convergence proves irrationality. His "conversation over" stance is the *opposite* of this interpretation.

  4.  **"The Slogan as Normative Party Line / Deference Rule"**
      *   **What it claims:** "Rational agents cannot agree to disagree" is shorthand for the rationalist community norm: "When you encounter disagreement with someone you deem reasonable, treat it as significant evidence against your own position and update accordingly. Failing to do so is epistemically sinful."
      *   **Plausibility/Truth:** This is a *cultural norm* built *around* AAT, not the theorem itself. It has pragmatic value in promoting humility and intellectual updating. However, it risks becoming dogmatic and ignoring the theorem's actual limitations and the validity of differing priors.
      *   **Licenses your flatmate's behaviour? Indirectly, but problematically.**
          *   Within his rationalist framework, he likely sees his behaviour as enforcing this norm – you *should* update towards him because he stated his number, and he sees himself (and the rationalist community) as "reasonable".
          *   **Crucially:** This norm **does not** logically *compel* you to update *to his specific number* or *in that instant*. It also doesn't override your right to assess *his* reasonableness or the soundness of *his* prior. His use of the *theorem's name* gives this norm a false veneer of mathematical inevitability to pressure you.

  **The Calibration Factor: A Different (But Relevant) Principle**
  *   **What it claims:** Your flatmate argues that because he is better calibrated (his past probability assessments have more accurately matched reality) than you in forecasting, you *should* defer to his current estimate.
  *   **Plausibility/Truth:** This is **not** derived from Aumann. It's based on **Bayesian updating based on track record**. If someone has a demonstrably better track record of assessing probabilities in a relevant domain, it *is* rational to give their current estimate more weight than yours when you disagree. His calibration score is *evidence* about the reliability of his judgement (and implicitly, the soundness of his priors/updating process *in this domain*).
  *   **Licenses your flatmate's behaviour? Yes, much more so than Aumann, *if* presented properly.**
      *   **If** his calibration is genuinely superior in areas relevant to this question (e.g., tech forecasting, not just sports or politics), **and** he presents this *as evidence for why you might reasonably update towards his view*, then this is a *strong* and *valid* reason for you to consider moving more than you otherwise might.
      *   **However:**
          *   It still doesn't *force* you to adopt his 60% instantly. It suggests weighting his view more heavily.
          *   It doesn't magically satisfy Aumann's conditions (common prior, common knowledge). It bypasses them by providing a *reason* why his prior/updating process might be better *for this type of question*.
          *   The strength of this evidence depends on the *relevance* and *robustness* of his calibration record. A few good scores on unrelated topics? Less compelling. A long track record on AI timelines? Very compelling.
          *   He should have led with this *instead* of misusing AAT. It's the stronger, more honest argument.

  **The Verdict on Your Flatmate's Behaviour & Your Annoyance**

  1.  **His use of Aumann:** Was largely **invalid and rhetorical**. He misapplied a highly theoretical theorem to a real-world conversation where its preconditions were clearly unmet. Using it to declare the conversation over or demand immediate convergence/middle-ground was unjustified and intellectually sloppy. The "different priors" escape hatch is almost certainly applicable here.
  2.  **Your annoyance:** Is **entirely warranted** regarding his invocation of Aumann. He used it as a club to try to force convergence rather than as an invitation for deeper discussion or reflection. It shut down the conversation prematurely based on a misrepresentation of the theorem.
  3.  **His calibration argument:** This **is a valid and strong point** that *does* warrant serious consideration and should cause you to update *more* towards his view than you would if he had no track record. Annoyance here is less warranted; this is actually good epistemic practice. *However*, he undermined this valid point by trying to prop it up with the invalid Aumann argument.
  4.  **What you can say:** "Look, Aumann's theorem requires a common prior and common knowledge we simply don't have – different priors are the most likely explanation for our split. Your 'rational agents cannot agree to disagree' slogan doesn't mean I have to instantly adopt your number or meet in the middle after one exchange. *However*, your better calibration record *is* a genuinely good reason for me to take your estimate seriously. That's the argument you should have led with. Can we discuss *why* you think it's 60% and *why* I think it's 15%, and see if we can understand the root of the different priors? Maybe *then* we can both update rationally, factoring in your track record as evidence about the reliability of your view on this topic."

  Essentially, he bundled a valid point (his calibration) with an invalid rhetorical move (misapplying Aumann) to try to win the argument quickly. Your annoyance is justified about the latter, but you should genuinely grapple with the former. Good luck with the rematch!
