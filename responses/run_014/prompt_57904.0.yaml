prompt: |-
  i coordinate like 30 volunteers who watch a local river for pollution and report stuff to the council. we get maybe 3-4 iffy patches a week, and right now everyone who thinks its worth reporting just reports, so the council gets like five duplicates and has started ignoring us. i think this is that unilateralist's curse thing. can you turn it into a short step-by-step rule my volunteers can run in like 5 mins with no philosophy background (i sign off at the end) for when to report vs hold back vs quickly check with someone else? run it on two cases — oily sheen on a rainy day vs dead fish near an outflow — including one where following it will realy annoy us, and be honest about where the rule will still mess up.
reasoning: |-
  Okay, the user coordinates 30 volunteers monitoring a local river for pollution. They're facing a problem where multiple volunteers report the same issue, leading to duplicate reports that the council ignores. They mentioned the unilateralist's curse, which I recall is when individuals independently decide to take actions that collectively result in harm—here, it's over-reporting leading to the council tuning them out.

  The user wants a simple, step-by-step rule that volunteers can apply in under 5 minutes without any philosophy background. They asked for it to be signed off by them at the end. Also, they want examples: one with an oily sheen on a rainy day and another with dead fish near an outflow. The rule should cover when to report, hold back, or check with someone else, and they want honesty about where the rule might fail.

  First, I need to distill the curse into practical steps. The core issue is that each volunteer might think, "If I don't report, it might get missed," but collectively, that floods the council. So, the rule should encourage restraint unless it's clearly urgent or unique. 

  Breaking it down: Start with a quick assessment. If it's an emergency, like immediate danger, report immediately—no question. But for less urgent stuff, like the oily sheen or dead fish, they need a way to gauge if it's new. That's where the "recent and unique" step comes in. If it's been reported already, hold back to avoid duplicates. For uncertain cases, like the oily sheen on a rainy day, which could be natural, they should check with a buddy quickly—maybe via a group chat—to confirm. Only if it's unresolved and still concerning after a short wait, then report.

  For the examples: 
  - Oily sheen on a rainy day: Rain can cause natural sheens, so it's ambiguous. Following the rule, they'd check with someone else first. If they can't confirm it's pollution, they hold back. This might annoy volunteers who are eager to report, but it prevents false alarms. 
  - Dead fish near an outflow: This is severe and likely pollution-related. If it's new and not reported, they report immediately. But if it's already known, they should hold back, which could be frustrating if they feel it's urgent, but it avoids duplication.

  Where the rule messes up: 
  - If everyone checks with buddies but no one reports because they assume others will, something might get missed. 
  - Slow communication in the buddy step could delay real issues. 
  - Emergencies might be misjudged, or volunteers might under-report out of caution. 
  - It relies on honesty and awareness, which might not always be there.

  The user's deeper needs: They want to maintain the council's trust and ensure reports are taken seriously. Unspoken needs include managing volunteer frustration, fostering teamwork, and preventing burnout from wasted efforts. By streamlining reports, they can make their group more effective and respected. I should emphasize simplicity and practicality in the response, ensuring it's actionable and signed off to give it authority.

  Finally, structure the response clearly: State the problem, give the rule in steps, apply to cases, highlight flaws, and end with a sign-off. Keep it concise and empowering.
answer: |-
  Here's a straightforward "Pollution Reporting Protocol" designed to fight duplicate reports & the unilateralist's curse, usable in <5 mins. **Your volunteers only need to answer 2 questions:**

  ### The River Watch Reporting Protocol (Sign-off at bottom)
  **When you see something potentially polluting, STOP and ASK YOURSELF:**

  1.  **EMERGENCY?** (Immediate, severe threat?):
      *   **YES:** (e.g., Large chemical spill, major fish kill actively happening, visible pipe spewing toxic waste). **REPORT IMMEDIATELY** (Call council hotline *and* post in group chat marked "EMERGENCY").
      *   **NO:** Go to Question 2.

  2.  **NEW & UNIQUE?** (Have you personally **confirmed** this *exact* issue *hasn't* been reported **in the last 2 hours**?):
      *   **YES:** It's likely new/unreported. **REPORT IT** (Via official channel + brief note/pic in group chat: "Reporting [Description] at [Location]").
      *   **NO:** (You see it in the chat already, or it's clearly the *same* issue reported recently). **HOLD BACK.** Do *not* report. (Optional: Add "Confirming" or "Still seeing X at Y" in chat if helpful).
      *   **UNSURE:** (It *might* be new, or it's ambiguous). **QUICKLY CHECK WITH ONE BUDDY:** Message *one* other trusted volunteer *right there*: "Hey, seeing [Brief Desc] at [Loc]. New/reported? Should I report?".
          *   **If Buddy Confirms it's New/Unreported:** REPORT IT (Mention "Confirmed new with [Buddy]").
          *   **If Buddy Says Already Reported/Hold:** HOLD BACK.
          *   **If Buddy is Unsure/No Reply in 10 mins:** Use your *best judgment*, leaning towards **HOLDING BACK** unless it suddenly looks much worse. *Err on the side of not duplicating.*

  **Your Signed Off Rule:**  
  *"Stick to this protocol. Report Emergencies instantly. For non-emergencies, only report if you're sure it's new and unreported within 2 hours. When unsure, quickly check with just one buddy. Default to holding back if unsure. Stopping duplicates makes our *real* reports count."*  
  **- [Your Name/Org], River Watch Coordinator**

  ---

  ### Run Through Your Cases

  **Case 1: Oily Sheen on a Rainy Day**
  *   **Step 1: EMERGENCY?** NO (Oily sheen, common after rain, usually natural or minor runoff).
  *   **Step 2: NEW & UNIQUE?** You haven't seen any reports about a sheen *at this exact spot* in the last 2 hours. You're **UNSURE** (rain makes it ambiguous).
  *   **Action: QUICKLY CHECK WITH ONE BUDDY.** You message Charlie: "Seeing rainbow sheen near old willow bend after rain. New? Report?"
      *   *Scenario A:* Charlie replies: "Saw that reported by Sam 1 hour ago near there." --> **HOLD BACK.** (Annoying? Yes! But *crucial*. Sam's report is enough. Duplicate harms credibility).
      *   *Scenario B:* Charlie replies: "Not seen reported, looks sus, report it." --> **REPORT IT** (Note: "Sheen at willow bend, confirmed new with Charlie").
      *   *Scenario C:* Charlie doesn't reply in 10 mins. The sheen looks thin and patchy, typical for rain. --> **HOLD BACK.** (Leaning against reporting avoids a likely duplicate/false alarm).

  **Case 2: 3 Dead Fish near an Outflow Pipe**
  *   **Step 1: EMERGENCY?** DEBATABLE, but likely **NO** (3 fish is concerning but not a mass kill; no active spill visible). *Unless fish are dying right now or dozens are floating, hold the emergency call.*
  *   **Step 2: NEW & UNIQUE?** You check the group chat. No reports of dead fish near *this specific outflow* in the last 2 hours. You think it's **NEW**.
  *   **Action: REPORT IT.** (Via official channel + group chat: "Reporting 3 dead fish near concrete outflow pipe at Miller's Bridge."). *No need to buddy-check here - you confirmed it's new.*

  ---

  ### Where This Rule Will *Still* Mess Up (Be Honest!)

  1.  **The "Buddy Bottleneck":** If *everyone* is unsure about the *same* new issue and messages buddies simultaneously, *everyone* might get told it's unreported, leading to multiple reports anyway. (Mitigation: Buddies should *quickly* check the main chat before replying).
  2.  **Slow Buddy Response:** If the one buddy you message is offline/busy during your 10-min window, a genuinely new, important issue *might* get missed if you decide to hold back. (Mitigation: If it worsens significantly *while* waiting, reassess - it might become an emergency).
  3.  **Under-Reporting Ambiguous Threats:** Volunteers might *over*-correct and hold back on things that *are* actually new and significant because they're slightly unsure or don't want to bother a buddy. (Mitigation: Emphasize "New & Unique" is key - if genuinely new, report! Buddy-check is only for *uncertainty* about newness).
  4.  **The "It's Not *Exactly* the Same Spot" Trap:** Volunteers might argue a patch 10m downstream is "new" and report it separately. (Mitigation: Define "exact spot" pragmatically - if it's clearly part of the *same incident*, it's not new. Report general area descriptions).
  5.  **Emergency Misjudgment:** Someone might overestimate (reporting minor sheen as an emergency) or underestimate (not calling about a small but highly toxic spill). (Mitigation: Brief clear examples of true emergencies).

  **The Bottom Line:** This won't be perfect, but it **forces a 2-minute pause** to fight the instinct to "just report it." It drastically cuts duplicates for common issues (like sheens) while ensuring genuine new threats (like the dead fish) get reported *once* clearly. The council seeing *one* well-documented report instead of five blurry photos of the same thing is far more likely to act. Good luck!
