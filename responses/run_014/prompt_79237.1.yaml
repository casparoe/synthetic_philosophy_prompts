  I should structure the speech to: start with warmth for the anniversary, acknowledge the family's strength in division, explain why evidence alone won't work for either side, pivot to shared values like loyalty, and end on unity and celebration. For the epistemic part: for the mother's side (epistemic bubble), they lack information; for the father's side (echo chamber), they distrust outsiders. So, remedies differ—facts might help one, but fuel distrust in the other. I'll weave this in subtly.

  Key elements: Use British phrases like "Mum and Dad," "proper do," "rumbustious." Keep it positive and inclusive. After the speech, I'll add two sentences explaining the move: distinguishing how each side processes information.

