  Okay, let me start by unpacking this user's query. They had a long argument with their friend Sam about Williams's integrity objection against utilitarianism. The user is frustrated because they agree on facts but reached a stalemate. The user's core point is that utilitarianism undermines personal commitments by treating them as just another input in the calculus. Sam counters that utilitarianism is about the criterion of rightness, not motivation, and that following personal projects is the best decision procedure to maximize utility.

  The user suspects their impasse is verbal—different definitions of "consequentialism." They wonder if Sam is smuggling in integrity values under a consequentialist label. They want to know if the disagreement is substantive or just terminological and how to move forward.

  First, I need to recall Williams's integrity objection. Williams argues that utilitarianism forces agents to abandon personal projects for the greater good, which attacks their integrity. The user focuses on the "one thought too many" idea—that moral decisions shouldn't require impersonal calculations when personal relationships are involved.

  Sam's defense is the sophisticated consequentialist approach: the criterion of rightness is utility maximization, but the decision procedure involves personal commitments because that's what generally leads to the best outcomes. This is where the user's hypothesis about terminological differences comes in. They're using "consequentialism" to mean different things—user as a motivational theory, Sam as a criterion of rightness.

  The key here is distinguishing between criterion and decision procedure. Consequentialism at the criterion level judges actions by their outcomes. The decision procedure is how agents decide what to do. Sam's view allows for non-utilitarian decision procedures if they yield better results. The user sees this as conceding to Williams because it incorporates personal commitments, which are non-consequentialist values.

  So, is Sam's sophisticated consequentialism still genuinely consequentialist? Technically, yes, because the criterion remains outcome-based. But Williams might argue that if the decision procedure relies on personal commitments, it's those commitments doing the normative work, not the outcomes. So the user feels Sam is smuggling in integrity values.

  The user needs to reframe their objection to target the criterion level. For example, in the brother case, saving the brother over the stranger might be justified by utility if familial bonds promote general welfare. But Williams would say the real reason is integrity, not utility. The consequentialist defense here is contingent—if familial bonds didn't maximize utility, they wouldn't be valid. Williams claims these commitments are intrinsically valuable, not contingent.

  Possible progress points: Clarify the distinction between criterion and decision procedure. Discuss whether personal commitments can be justified solely by their consequences or if they have intrinsic value. Explore if Sam's approach is circular—using commitments to justify commitments under a utilitarian guise. The user might press Sam to explain why personal projects matter without referencing utility. If Sam says they matter because they promote utility, then the disagreement is substantive. If Sam admits they have independent value, then it's a concession.
answer: |-
  You've hit on a crucial philosophical nerve, and your diagnosis is remarkably sharp. The impasse is **both verbal and substantive**, nested within layers of meta-ethical framing. Here's the breakdown:

  1.  **The Core Verbal Disagreement:** You're absolutely right about "consequentialism" doing double duty. Sam is using it primarily as a **criterion of rightness**: an action is right iff it maximizes good consequences. You're focusing on it as a **practical deliberation guide**: an agent *should* consciously aim to maximize consequences in their decision-making. Williams's integrity objection primarily targets the latter (deliberation), while Sam is defending a version that seemingly avoids that target by embracing the former (criterion) while rejecting the latter as the *best decision procedure*.

  2.  **The Substantive Disagreement Underneath:** This isn't *just* about words. The verbal difference points to a deep substantive question: **Can a moral theory consistently claim that the *right-making property* of an action (maximizing consequences) is entirely distinct from, and often undermined by, the *properties that make it rational or authentic for an agent to perform* (acting from deep personal commitments)?** This is where Williams bites hard:
      *   **Your Point (Williams's Core):** Normative weight *in the agent's life* comes from the projects and commitments being *theirs*, constituting their identity and practical standpoint. If the *ultimate reason* justifying an action (even one flowing from a commitment) is its impersonal consequences, then the commitment itself loses its *intrinsic normative force* for the agent. It becomes merely a psychological tool, potentially discardable whenever the calculus demands it. This, Williams argues, alienates the agent from their own life and undermines the very source of reasons they have to act *at all*. The "one thought too many" is the symptom: the commitment isn't *itself* the reason; it's a placeholder for future utility calculations.
      *   **Sam's Point (Sophisticated Consequentialist Defense):** Sam is essentially adopting a form of **indirect consequentialism** or **two-level consequentialism** (à la Hare or Railton). The claim is: *Having* deep, non-utilitarian motivations and commitments, and acting *from* them without constant recalculation, *is* the decision procedure that *best* satisfies the utilitarian criterion of rightness in the real world. Agents following their commitments generally produce more utility than agents constantly calculating. Therefore, the *decision procedure* ("follow your commitments") is justified *because* it maximizes utility *when generally followed*. The criterion remains pure consequentialism.

  3.  **Why You're Stalemated: Two Different Battlegrounds:**
      *   **You (and Williams)** are fighting on the **ground of agency, identity, and the source of reasons**: Can the *reason for acting* that makes sense *within the agent's own practical standpoint* ("I must save my brother *because he is my brother*") be *replaced* or *undermined* by the utilitarian reason ("Saving him happens to maximize utility") without destroying the integrity of the agent and the meaning of the commitment? Your objection is that Sam's "sophisticated" version still relies on commitments whose *ultimate normative justification* (for the theory) is consequentialist, stripping them of their intrinsic authority *for the agent*.
      *   **Sam** is fighting on the **ground of action-guidance and overall consequences**: What decision procedure, when adopted by agents, reliably produces actions that *in fact* maximize utility? Sam argues that following commitments *is* that procedure. For Sam, the justification *for the procedure* is consequentialist, even if the agent's *immediate motive* isn't. Sam sees your objection as only defeating a straw man (the constant calculator) that no sophisticated consequentialist endorses.

  4.  **Is Sam Smuggling? Has Sam Conceded?**
      *   **Not Smuggling (Technically):** Sam isn't *smuggling* integrity values *as fundamental normative principles*. Sam is *acknowledging* the *psychological and causal necessity* of integrity-constituted commitments *as the most effective means* to achieve the consequentialist end. The commitments are valued *instrumentally*, not intrinsically, by the theory. The "trench coat" is consequentialist because the ultimate *justification* for why the procedure ("follow commitments") is the right procedure is its tendency to produce good consequences.
      *   **But... Partial Concession?** Sam *has* conceded Williams's point that **acting *as a motivated utilitarian* (constantly calculating) is self-defeating and alienating.** This is significant. However, Sam hasn't conceded Williams's deeper point: that the *only* reason Sam's "sophisticated" agent has to value their commitments *at all* (from the theory's perspective) is instrumental. If circumstances changed such that abandoning a core commitment *would* maximize utility (and the agent knew this), the sophisticated consequentialist *must* say the agent *should* abandon it. Williams argues this reveals that the commitment never had the intrinsic, identity-constituting weight it *seems* to have and *needs* to have for the agent.

  **Diagnosis:** You are primarily engaged in a **disagreement about the nature of practical reason, agency, and the source of normative authority within a life.** Sam is primarily engaged in a **disagreement about the best causal strategy for reliably producing states of affairs deemed good by an impersonal standard.** Williams targets the former; Sam defends the latter. Both discussions fall under "consequentialism," but they address fundamentally different questions.

  **Pathways to Progress:**

  1.  **Force the "Deep Why" Question:** Press Sam on the *reason* the agent has to maintain their commitment *in a specific case*, even when a utility calculation *might* (in principle) suggest otherwise. Ask Sam: "Why, *from within your sophisticated consequentialism*, does the agent *truly* have a reason to save their brother *as their brother*, rather than *merely* as a utility-producing object?" If Sam answers "Because commitments generally produce utility," ask: "But what if, in *this specific case*, acting *against* the commitment (e.g., letting the brother die to save two strangers) *would* clearly produce marginally more utility? Does the agent *still* have a stronger reason to save the brother *because he is the brother*?" Sam's answer will reveal whether the commitment retains *any* intrinsic weight or is purely instrumental. This exposes the core tension Williams identifies.

  2.  **Distinguish Justification Levels Explicitly:** Agree to map out the levels clearly:
      *   **Criterion of Rightness (CR):** What makes an action objectively right? (Sam: Maximize utility)
      *   **Decision Procedure (DP):** What method should agents *use* to decide what to do? (Sam: Generally, follow deep commitments/projects).
      *   **Motivation (M):** What psychological states should ideally drive the action? (Sam: The commitments/projects themselves).
      *   **Justification for DP/M:** *Why* is DP/M the right approach? (Sam: Because agents using this DP/M generally satisfy CR better than other DP/Ms).
      Williams' objection fundamentally targets the **Justification for DP/M** level: he argues that justifying DP/M solely by reference to CR undermines the very psychological reality and normative force of M (the commitments). If M is *only* justified because it serves CR, then M cannot provide the kind of deep, identity-constituting reason Williams believes is essential for integrity and authentic agency. Ask Sam: "Does your *justification* for the agent having commitment M (e.g., love for brother) *preserve* the intrinsic, non-instrumental reason-giving force of M *for the agent*, or does it ultimately reduce M's reason-giving force to its service of CR?"

  3.  **Acknowledge the Terminological Fog:** Explicitly state: "Let's stop using 'consequentialism' vaguely. I'm objecting to any theory where the *ultimate normative justification* for an agent's core commitments reduces them to instruments for achieving impersonal good, because I (with Williams) believe this erodes the integrity of the agent. Are you defending a theory that does that? If not, how does your theory avoid it without abandoning consequentialism's core claim that only consequences ultimately matter?" This forces Sam to either defend instrumentalization or admit non-consequentialist elements.

  4.  **Consider Railton's "Alienation" Response:** Point Sam to Railton's famous paper ["Alienation, Consequentialism, and the Demands of Morality"](https://www.jstor.org/stable/2025868). Railton, a sophisticated consequentialist, directly addresses Williams. He argues that an agent *can* have deeply non-instrumental motivations (loving the brother *because he's the brother*) while *also* holding the *background belief* that a life lived with such commitments is a generally good way to live *and* that this way of life fits within a consequentialist framework when assessed impartially. The key is the *background* nature of the consequentialist justification – it doesn't (and shouldn't) enter into the agent's immediate deliberation. Does this satisfy Williams? Many think not, as it still makes the commitment's *ultimate justification* contingent. Discussing this specific defense might clarify your positions.

  **Conclusion:** Your impasse is real and deep, rooted in differing priorities (agency/integrity vs. reliable action-guidance/outcomes) masked by terminological overlap. Progress lies in **explicitly separating the levels of justification (Criterion of Rightness vs. Justification for Decision Procedure/Motivation) and forcing the question of whether the sophisticated consequentialist's *justification* for personal commitments preserves their intrinsic normative force for the agent or reduces them to mere instruments.** The honest answer isn't that the debate is mis-posed, but that "consequentialism" encompasses a family of views, and Williams's objection decisively challenges views that insist *only* consequences ultimately matter *at all levels*, even if sophisticated versions try to accommodate integrity structurally while denying it foundational normative weight. The core question remains: Can the value of a life lived with integrity be fully captured by its contribution to impersonal good? Williams (and likely you) say no; sophisticated consequentialists like Sam say yes, instrumentally. That's the substantive heart of the stalemate.
