prompt: |-
  So I just spent like two hours arguing with my friend Sam about whether Williams's integrity objection actually knocks out utilitarianism, and we ended up completely stalemated, which is annoying because we agree on basically all the facts and the examples. Here's where we landed. I keep pressing the 'one thought too many' point: from the impartial utilitarian calculus, the fact that a project or a person is *mine* or *my brother's* is just an extra, inappropriately personal input, and Williams's whole thing is that this strips commitments of the identity-constituting, settled-intention structure that's the only thing giving them their normative weight in the first place. Sam keeps deflecting by saying utilitarianism is a criterion of rightness, not a motivational demand, and that the right decision procedure for an agent is precisely to follow their settled intentions and personal projects, on the grounds that this procedure, when generally followed, track the good. So Sam's basically saying my objection only defeats the 'motivated utilitarian' who sits down and maximizes in every situation, and that the 'sophisticated' version is immune.

  And here's my hypothesis about why we're stuck, tell me if its right or what I'm missing: I think we're not actually disagreeing about the examples (we both agree the brother case is a problem for the naive version), we're disagreeing about what the word 'consequentialism' is doing. I'm objecting to a motivational/doxastic picture, Sam is defending a decision-procedure picture, and the whole argument is a verbal standoff over whether the decision-procedure version is still genuinely consequentialist or whether it's just smuggled-in integrity values wearing a consequentialist trench coat. If it's the latter, Sam has conceded; if the former, I have to reformulate the objection to hit a target that doesn't rely on the agent's personal point of view at all.

  Can you diagnose this for me? Is the impasse verbal (two people using 'consequentialism' for different things), substantive (a real disagreement about whether a procedure that just says 'follow your commitments' can be consequentialist without going in a circle), or are we two people answering different questions under one name — one about what an agent should be motivated by, one about what makes an act right? And given your diagnosis, what would actually count as progress — a distinction we're both missing, a way to force the question, or is this just a case where the term 'consequentialism' is doing too much work and the honest answer is that the debate is mis-posed?
