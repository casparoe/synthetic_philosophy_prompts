prompt: |-
  I'm a PhD student in political philosophy, and after a departmental seminar on the ethics of war that ended in frustration rather than progress, I've persuaded two faculty members with directly opposed views on the moral equality of combatants to attempt an adversarial collaboration. One holds the Walzerian line: combatants on both sides of a war are equally liable to be attacked and equally entitled to fight, regardless of the justice of their cause. The other is a McMahan-style revisionist: liability to attack tracks individual responsibility for an unjust threat, so a combatant who fights without just cause acts wrongly and is not morally entitled to fight. Please draft the joint statement they should produce. I want (1) a numbered section of claims both could sign — about what soldiers actually do, about the distinction between jus ad bellum and jus in bello, and whatever else they genuinely share; (2) a table of residual disagreements, each stated in wording its own side would accept as fair to it; and (3) the cruxes between them. For the cruxes, please push past the rehearsed slogans and focus on three specific ones: whether a combatant's epistemic access to the justice of the war can change what they are liable to, and whether a sincerely held false belief at home can excuse; whether the rules of war derive their authority from being fair terms imposed on people who are made to fight regardless of their cause, or from tracking the deeper facts about liability; and what follows for conscripts in a war of aggression that their own society believes is defensive. For each crux, give a case or argument both sides would accept as bearing on it, with each side's prediction written down in advance. Close with a short section in which they identify which parts of their original dispute strike both as having been partly verbal, and what would genuinely move either of them. Do not include citations or a literature review — positions identified by name and argument are sufficient.
reasoning: |-
  We are drafting a joint statement for two adversarial collaborators: one Walzerian and one McMahan-style revisionist. The statement should include:
  1. A numbered section of shared claims.
  2. A table of residual disagreements, with each side's wording.
  3. Three cruxes, each with a case/argument and each side's prediction.
  4. A short section on partly verbal disputes and what would move them.

  First, the shared claims. Both sides agree on some fundamentals about war:

  - Soldiers in war, regardless of the justice of their cause, are placed in a position where they are required to use lethal force and are subject to being targeted by lethal force.
  - There is a traditional distinction between jus ad bellum (the justice of going to war) and jus in bello (the justice of conduct within war). Both agree that this distinction exists in the laws of armed conflict and in much of the historical discourse on war.
  - Soldiers often act under conditions of duress, coercion, and epistemic limitations. They may be conscripted, subject to intense propaganda, and have limited access to reliable information about the justice of the war.
  - The laws of armed conflict (LOAC) and the international humanitarian law (IHL) currently embody the principle of the moral equality of combatants in the sense that they do not distinguish between just and unjust combatants in the rules of engagement (e.g., both are equally entitled to POW status and are not prosecuted for mere participation in an unjust war).
  - Regardless of their views on the deeper morality, both agree that the existing legal framework is important for regulating war and minimizing unnecessary suffering.

  We can list these as numbered points.

  Second, the table of residual disagreements. We'll present these in a table format (though in text, we can describe it as a table). Each row will have two columns: one for the Walzerian view and one for the revisionist view, each stated in their own terms.

  Third, the cruxes. We are to focus on three specific cruxes:

  1. Epistemic access: Can a combatant's epistemic access to the justice of the war change what they are liable to? And can a sincerely held false belief excuse?
     - Case: A combatant in a war that is objectively unjust but who has been raised in a society with pervasive propaganda that portrays the war as just and defensive. The combatant has no access to alternative information and sincerely believes the war is just.
     - Predictions: 
       - Walzerian: Such a combatant is not morally culpable and remains equally liable to attack as any other combatant because the rules of war must be symmetrical and not depend on individual assessments of justice.
       - Revisionist: This combatant is excused from blameworthiness for fighting (so not blameworthy) but is still liable to attack because they are objectively posing an unjust threat. Their epistemic condition might reduce their culpability but not their liability.

  2. Authority of the rules of war: Do the rules derive from being fair terms for people forced to fight, or from tracking deeper liability?
     - Case: Consider a set of rules that are designed to be fair to combatants on both sides, such as the prohibition on targeting non-combatants and the requirement to wear uniforms. But in a war where one side is clearly the aggressor and the other is defending, should the rules be the same for both?
     - Predictions:
       - Walzerian: The rules must be the same for both because they are the terms under which combatants, who are often conscripted and forced to fight, can engage without descending into total barbarism. The rules are a kind of contract for mutual restraint.
       - Revisionist: The rules should track the deeper moral reality: that combatants on the unjust side are acting wrongly and are liable to defensive harm, while just combatants are not. However, in practice, the rules might be the same for pragmatic reasons, but their moral foundation is different.

  3. Conscripts in a war of aggression that their society believes is defensive.
     - Case: A conscript in a country that has launched an aggressive war but where the government has successfully convinced the population (including the conscript) that the war is defensive and necessary. The conscript fights believing he is defending his country.
     - Predictions:
       - Walzerian: The conscript is a legitimate target and is entitled to fight (so he does not commit a crime by fighting) because he is a combatant and the rules of war apply equally. His conscription and sincere belief do not change his status as a combatant.
       - Revisionist: The conscript is not blameworthy (he is excused) because of non-culpable ignorance, but he is still liable to attack because he is posing an unjust threat. However, if he were to discover the truth and continue fighting, he would become blameworthy.

  Finally, the short section on partly verbal disputes and what would move them.

  Let me structure the joint statement accordingly.
answer: |-
  ### Joint Statement: Adversarial Collaboration on the Moral Equality of Combatants  
  **Participants:**  
  - **Walzerian Position (WP):** Combatants on both sides of a conflict are morally equal in liability and entitlement, irrespective of *jus ad bellum*.  
  - **Revisionist Position (RP):** Liability tracks individual responsibility for unjust threats; combatants fighting without just cause act wrongly and lack entitlement.  

  ---

  #### (1) Shared Claims  
  Both parties affirm the following:  

  1. **Soldiers' Actions in War:** Combatants, regardless of their side, are trained and ordered to inflict lethal harm and are routinely exposed to lethal risks. Their actions are shaped by institutional coercion, discipline, and the fog of war.  

  2. **Distinction Between *Jus ad Bellum* and *Jus in Bello*:** The justice of a war (*jus ad bellum*) is conceptually distinct from the justice of conduct within war (*jus in bello*). Both agree this distinction is embedded in international law (e.g., Geneva Conventions) and practical military ethics.  

  3. **Role of Duress and Coercion:** Soldiers often fight under conditions of severe pressure—conscription, propaganda, peer influence, or legal punishment for disobedience—which mitigates personal responsibility for participation.  

  4. **Function of Symmetry in International Humanitarian Law (IHL):** Existing IHL rules (e.g., distinction, proportionality, combatant immunity) apply symmetrically to all combatants. This symmetry aids clarity, compliance, and the reduction of unnecessary suffering, regardless of its moral defensibility.  

  5. **Epistemic Challenges:** Combatants rarely possess perfect knowledge of their war’s justice due to institutional deception, cultural narratives, or limited access to impartial information.  

  6. **Moral Gravity of Killing:** Intentionally killing another human being requires strong justification; neither side trivializes the moral weight of this act.  

  ---

  #### (2) Table of Residual Disagreements  
  Each party’s stance is stated in their own accepted wording.  

  | Issue | Walzerian Position | Revisionist Position |
  |-------|---------------------|----------------------|
  | **Moral Status of Unjust Combatants** | Combatants fighting without just cause retain their moral entitlement to use force and are not blameworthy for merely participating in an unjust war, as they serve collective goals under shared risks. | Combatants fighting without just cause are morally blameworthy for contributing to unjust harm and lack entitlement to use force; their actions constitute a moral wrong. |
  | **Foundation of Combatant Liability** | Liability to attack arises from a combatant’s role-based status as an agent of a belligerent group, not their personal beliefs or their war’s justice. | Liability to attack arises solely from an individual’s responsibility for posing an objectively unjust threat; role alone is insufficient. |
  | **Authority of IHL Rules** | IHL rules derive authority from being fair terms of cooperation for combatants forced into mutual vulnerability, ensuring mutual restraint despite moral asymmetries. | IHL rules are pragmatic approximations of deeper moral truths about liability; their authority is contingent on aligning with objective liability (even if symmetry is practically necessary). |
  | **Excuse for Conscripts** | Conscripts in an unjust war retain moral equality because their participation is non-voluntary; they are excused from *ad bellum* judgments and retain *in bello* rights. | Conscripts in an unjust war may be excused from *blame* but not from *liability*, as their objective contribution to unjust harm persists regardless of coercion. |

  ---

  #### (3) Cruxes: Core Disagreements with Predictions  
  **Crux 1: Epistemic Access and Liability**  
  - **Case:** A combatant in an objectively unjust war is raised in a totalitarian state with pervasive propaganda. They sincerely believe their war is defensive and have no access to contrary evidence.  
  - **Bearing:** Does this epistemic limitation affect liability to attack?  
  - **WP Prediction:** The combatant remains fully liable to attack. Epistemic constraints do not alter role-based liability; symmetrical rules prevent chaotic moral assessments in war.  
  - **RP Prediction:** The combatant is *excused from blame* but *not from liability*. Liability tracks objective facts about unjust threats; sincere belief mitigates culpability but not the threat posed.  

  **Crux 2: Authority of Rules of War**  
  - **Case:** Should IHL prohibit targeting non-combatants identically for both sides in a war where one side is objectively the aggressor?  
  - **Bearing:** Do rules gain authority from fairness to forced combatants or from tracking liability?  
  - **WP Prediction:** Symmetrical rules are essential. Authority comes from fairness: combatants are conscripted or coerced, so rules must impose mutual constraints to prevent total war.  
  - **RP Prediction:** Rules should reflect objective liability (e.g., unjust combatants forfeit protections sooner). Authority derives from moral truth; symmetry is a concession to practicality, not fairness.  

  **Crux 3: Conscripts in a "Defensive" War of Aggression**  
  - **Case:** Conscripts fight in a war of aggression that their society (due to state propaganda) universally believes is defensive. They would refuse if they knew the truth.  
  - **Bearing:** Does conscription + sincere belief change liability/entitlement?  
  - **WP Prediction:** Conscripts retain full combatant equality. Their societal belief and coercion render them non-culpable; *in bello* rules apply symmetrically to protect them and their adversaries.  
  - **RP Prediction:** Conscripts are excused from *blame* but remain liable to attack. Their objective threat persists; entitlement to fight is forfeited by participating in aggression, even under duress.  

  ---

  #### (4) Partly Verbal Disputes and Movers  
  **Verbal Agreements:**  
  - Both agree "moral equality" is misstated if it implies *identical permissibility*. WP uses it to denote *symmetrical permissions/liabilities in practice*; RP rejects it as *denying objective moral asymmetry*.  
  - "Liability" is not contested as *susceptibility to harm* but as *grounds*: WP ties it to status, RP to responsibility.  

  **What Would Move Them:**  
  - **WP:** Would concede a core revisionist insight if shown that symmetrical rules *systematically exacerbate unjust wars* (e.g., empirical evidence that IHL encourages aggression by shielding perpetrators).  
  - **RP:** Would accept a Walzerian constraint if shown that asymmetric rules *inevitably collapse into total war* (e.g., historical cases where moral asymmetry led to indiscriminate violence).  

  ---  
  **Joint Conclusion:**  
  We disagree profoundly but find value in clarifying stakes. Progress requires empirical work on the consequences of symmetric/asymmetric rules and deeper inquiry into the epistemology of soldierly obedience. We commit to testing our predictions against historical and psychological evidence.
