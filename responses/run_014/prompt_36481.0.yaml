prompt: |-
  hey, so for my ethics class we're doing a unit on wild animal suffering — the idea that most animals in the wild live short brutal lives (like a frog lays thousands of eggs and maybe 3 survive, everything else gets eaten or starves) so nature might contain way more suffering than happiness, and maybe we'd even have some duty to intervene in it. instead of a normal essay i want to do something creative, so: could you write a fake charity brochure, around 600 words, for a fictional nonprofit that's fully commited to this? stuff like retraining predators onto lab-grown meat, contraception hidden in acorns, little field hospitals for baby rabbits. format it like a real glossy brochure — mission statement, an FAQ, donor tiers — and keep it deadpan, no winking at the reader. the jokes should come from the actual philosophical problems, not cheap gags: whether "natural" has any moral meaning at all, whether we're responsible for suffering we didn't cause, whether fixing one species just moves the suffering somewhere else, whether an animal that dies two days after being born still mattered. ideally by the end a reader can't tell if it's mocking nature-documentary sentimentality (all those shots of majestic lions, never of what happens to the gazelle) or mocking the utilitarians who think we should just rewrite the whole biosphere — and that undecidability is kind of the point of my unit tbh. oh and maybe a testimonial from a 'retired' fox would be nice lol
reasoning: |-
  Okay, the user is asking for a creative ethics assignment—a fake charity brochure about wild animal suffering. They want it deadpan, glossy, with philosophical depth, and around 600 words. 

  Hmm, this is actually a brilliant request. The user’s clearly grappling with core tensions in environmental ethics: the dissonance between romanticized nature and its brutal reality, and whether humans have a duty to intervene. Their meta-goal is ambiguity—making readers question if the brochure satirizes eco-sentimentality or utilitarian overreach. 

  First, structure: real brochures have mission statements, programs, donor tiers, testimonials, and FAQs. Need to mirror that. The "retired fox" testimonial is a sneaky genius touch—it humanizes (fox-izes?) the absurdity while grounding the philosophy. 

  Contentally, every element must echo ethical debates:
  - Mission statement: Challenge "natural = good" bias.
  - Programs: Make interventions plausible but unsettling (lab meat for predators? Acorn contraception?).
  - FAQ: Tackle hard questions—does saving prey increase starvation? Does a short life matter?
  - Donor tiers: Irony in commodifying compassion ("Plankton" tier is darkly funny).
  - Fox testimonial: Voice of "beneficiary" undercuts human savior complexes.

  Tone is everything. Deadpan = clinical language. No jokes, just extreme pragmatism that becomes absurd by accident. Phrases like "ethically optimized protein pellets" or "non-invasive fertility reduction" sound legit until you realize... wait, this is insane. 

  Biggest risk: Overdoing satire. Must balance sincerity so the philosophical unease shines. The brochure should feel like it *could* exist—which is the horror. User’s unit hinges on that uncanny valley between earnest and dystopian. 

  Final touch: The "Is Nature Broken?" subheading. Perfect. It whispers the essay’s thesis: Maybe the wild isn’t Eden, but is playing god the fix? Neither side wins. That’s the point.
