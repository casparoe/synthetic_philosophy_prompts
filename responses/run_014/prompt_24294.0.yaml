prompt: |-
  I'm a staff interpretability researcher at an AI lab. Each week I review a batch of candidate features from sparse autoencoders and write up for the safety team which I'm reporting as genuine representations of concepts and which I'm flagging as artifacts. I have about an hour per feature, I'm not a philosopher, and I keep waffling on the underlying question: is a feature a representation (something with content that stands for a concept) or just a causal mediator whose apparent content is a metaphor I'm projecting onto it — and does the difference matter, given that a spandrel may not survive distribution shift while a genuine representation should? Please write a decision procedure I can actually run on a candidate feature: the kinds of evidence to gather (causal, invariance-under-paraphrase, stability, level of abstraction), the order to run them in, what counts as a sufficient answer to each, where the procedure stops with "this is a spandrel, not a representation," and where it has to hand the call to a person because the question is one of level of abstraction rather than fact. Then run it on three cases — a feature that fires on the token "however" in a fixed syntactic position, a feature that fires on mentions of climate change across paraphrases, and a feature that fires on first-person narratives — and be honest about which of the three the procedure is least confident on and why.
reasoning: |-
  We are going to design a decision procedure for determining whether a feature in a sparse autoencoder is a genuine representation of a concept or a spandrel (artifact). The procedure will gather evidence of several types:

  1. **Causal Evidence**: Does activating the feature cause model behavior that aligns with the hypothesized concept? Does suppressing it disrupt such behavior?
  2. **Invariance under Paraphrase**: Does the feature activate consistently across different phrasings of the same concept?
  3. **Stability**: Is the feature consistent across different inputs that are semantically similar but vary in unimportant details? And does it remain stable under distribution shifts (e.g., different domains, times, or contexts)?
  4. **Level of Abstraction**: Does the feature capture a high-level concept that can be instantiated in multiple ways, or is it tied to low-level patterns?

  The procedure will run in the following order:

  1. **Initial Hypothesis**: Start with a clear hypothesis of the concept the feature might represent, based on manual review of activating dataset examples.

  2. **Invariance under Paraphrase Test**:
     - Gather a set of sentences that express the same concept in different ways (paraphrases).
     - Check if the feature activates on these paraphrases. Also, check non-paraphrase sentences (negative controls) that are similar but do not express the concept.
     - **Sufficiency**: If the feature activates consistently on paraphrases and not on negative controls, that's strong evidence for representation. If it fails on multiple paraphrases, it may be tied to specific surface forms.

  3. **Causal Test**:
     - Perform causal interventions: 
          a. **Activation**: Artificially activate the feature in contexts where the concept is absent and check if the model's behavior changes as if the concept were present.
          b. **Suppression**: Suppress the feature in contexts where the concept is present and check if the model's behavior degrades (e.g., in a task related to the concept).
     - **Sufficiency**: If both activation and suppression experiments show a causal effect on behavior that aligns with the concept, that's strong evidence for representation. If not, it might be a spandrel.

  4. **Stability Test**:
     - Test the feature on inputs that are from different distributions (e.g., different domains, time periods, or with distribution shifts) but still contain the concept.
     - Also, test on inputs that are semantically similar but have variations that shouldn't affect the concept (e.g., changing names, locations, etc.).
     - **Sufficiency**: If the feature remains active on the concept across these shifts and variations, that supports it being a genuine representation. If it breaks, it may be a spandrel.

  5. **Level of Abstraction**:
     - Determine if the feature is activated by a broad set of instantiations of the concept (high-level) or only by specific patterns (low-level).
     - **Handoff to Human**: If the feature passes the above tests but the concept is very broad or there is ambiguity in defining the boundaries of the concept, then it's a matter of level of abstraction and requires human judgment. For example, a feature that activates on "any kind of conflict" might be too abstract to label precisely.

  **Decision Flow**:
  - If the feature fails the invariance test (step 2), then it is likely a spandrel (e.g., tied to specific tokens or surface patterns). 
  - If it fails the causal test (step 3), then it is likely a spandrel (not playing a causal role in the model's behavior for the concept).
  - If it fails the stability test (step 4), then it is likely a spandrel (fragile under distribution shift).
  - If it passes all three tests, then it is likely a genuine representation.
  - However, if in step 5 (abstraction) the concept is too broad or ambiguous, we flag it for human review.

  **Stopping Criteria**:
  - If at any step the evidence strongly points to a spandrel (e.g., failure in invariance, causal, or stability tests), we stop and report "spandrel".
  - If it passes all tests without ambiguity in abstraction, we report "genuine representation".
  - If it passes the tests but abstraction is an issue, we hand off to a human with a note about the ambiguity.

  Now, let's run the procedure on three candidate features:

  ### Case 1: Feature that fires on the token "however" in a fixed syntactic position

  1. **Hypothesis**: The feature represents the concept of contrast or transition, specifically triggered by the word "however" in a particular syntactic context (e.g., at the beginning of a clause).

  2. **Invariance under Paraphrase**:
     - Paraphrases: Try sentences with other contrastive transition words (e.g., "nevertheless", "on the other hand", "yet") in the same syntactic position.
     - Negative controls: Sentences without contrast, or with "however" in a different position (e.g., in the middle of a clause without the syntactic trigger).
     - **Result**: The feature does not activate on "nevertheless", but only on "however" in the specific position. It also doesn't activate on other uses of "however". 
     - **Conclusion**: Fails invariance. It is tied to a specific token and syntactic pattern.

  3. **Causal Test** (optional, since already failed invariance, but for completeness):
     - Activating the feature in a sentence without "however" might cause the model to output something with a contrastive meaning? Unlikely because it's tied to a specific token.
     - Suppressing it in a sentence with "however" might cause the model to fail to properly structure the contrast? But note: the model might use other features for contrast. We might see a small effect, but the feature is likely not the only way the model represents contrast.

  4. **Stability**: Not necessary because we already have a failure.

  5. **Decision**: Spandrel. It's a token-specific and syntax-specific feature, not a general representation of contrast.

  ### Case 2: Feature that fires on mentions of climate change across paraphrases

  1. **Hypothesis**: The feature represents the concept of climate change.

  2. **Invariance under Paraphrase**:
     - Paraphrases: "global warming", "climate crisis", "changes in the Earth's climate", "anthropogenic climate disruption", etc.
     - Negative controls: Topics that are related but distinct (e.g., "weather patterns", "pollution", "renewable energy").
     - **Result**: The feature activates on all the paraphrases and not on the negative controls (or very weakly). 
     - **Conclusion**: Passes invariance.

  3. **Causal Test**:
     - **Activation**: We activate the feature in a context that doesn't mention climate change (e.g., a sentence about cooking) and see if the model starts talking about climate change (e.g., in the next token prediction or in a generation task). 
          - Example: Input: "I like to cook pasta." Activate feature -> Does the model continue with something about climate change? If yes, that's evidence.
     - **Suppression**: We take a sentence about climate change and suppress the feature. Then we see if the model fails to generate coherent text about climate change (e.g., it might avoid the topic or make errors).
          - Example: Input: "The effects of climate change are ..." Suppress feature -> Does the model generate an unrelated continuation?
     - **Result**: Activation causes the model to introduce climate change topics. Suppression causes the model to avoid or mishandle climate change topics. 
     - **Conclusion**: Passes causal test.

  4. **Stability Test**:
     - Test on texts about climate change from different domains (scientific, political, casual conversation), from different time periods (old texts might use different terminology), and in different languages (if the model is multilingual) but translated to the language of the feature.
     - **Result**: The feature activates consistently across domains and time (if the model has been trained on such data). However, note that old texts might not have the term "climate change" but use "global warming" - we already checked paraphrases. Also, in a multilingual context, the feature might not activate if the concept is expressed in another language? (But note: the autoencoder is trained on the model's activations for a specific language, so we may not require multilingual stability unless the model is multilingual and the feature is supposed to be cross-lingual. We'll assume English only for now.)
     - **Conclusion**: Passes stability (within the language and across domains and time).

  5. **Level of Abstraction**:
     - The concept of "climate change" is fairly concrete and well-defined. We don't have major abstraction issues.

  6. **Decision**: Genuine representation.

  ### Case 3: Feature that fires on first-person narratives

  1. **Hypothesis**: The feature represents the concept of first-person perspective.

  2. **Invariance under Paraphrase**:
     - Paraphrases: We need to express first-person narratives in different ways. Examples:
          - "I went to the store."
          - "We are going on an adventure."
          - "My dog bit me."
          - "In my opinion, ..."
     - Also, try to avoid first-person: third-person narratives that tell the same story (e.g., "He went to the store") and second-person ("You went to the store").
     - **Result**: The feature activates on all the first-person examples and not on the others. But note: what about plural first-person? It should activate on "we", "us", etc. Also, what about possessive "my"? It should if the feature captures any first-person reference.
     - **Potential issue**: The feature might be triggered by specific words (like "I", "me", "my") and not by the narrative perspective. We must check for sentences that imply first-person without using those words? (Hard, because first-person is usually marked by pronouns.) 
     - **Conclusion**: Likely passes invariance, because it activates across a range of first-person markers.

  3. **Causal Test**:
     - **Activation**: In a third-person narrative, activate the feature. Does the model switch to first-person? Example: Input: "John went to the store." Activate feature -> Next token might become "He" but we want the model to start using "I". Alternatively, we can generate a continuation and see if it becomes first-person.
          - Result: The model might start generating in first-person? This is a strong test.
     - **Suppression**: In a first-person narrative, suppress the feature. Does the model switch to third-person? Example: Input: "I went to the store and" -> suppress feature. Does the model continue with "he" or "I"? If it continues with "I", then the feature might not be necessary? But note: there might be multiple features for first-person. 
          - Result: If suppression causes the model to avoid first-person pronouns (e.g., it starts using names or third-person), that would be evidence. But it might be subtle.

     - **Result**: The causal test may show a weak effect because first-person is usually marked by specific tokens and might be redundantly represented. However, if we see a clear effect (e.g., in activation the model switches to first-person and in suppression it avoids first-person), then it passes.

  4. **Stability Test**:
     - Test on first-person narratives in different contexts: fiction, personal blogs, historical diaries, etc. Also, test with different verb tenses, subjects, etc.
     - **Result**: The feature should activate across these. But note: what about non-narrative first-person? (e.g., "I think", which is not a narrative). The feature is defined for narratives, so we must check non-narrative first-person? The hypothesis is for narratives, so we should stick to narrative contexts. However, the line between narrative and non-narrative can be blurry.

  5. **Level of Abstraction**:
     - The concept of "first-person narrative" is at a medium level of abstraction. The feature might be capturing a cluster of linguistic markers (pronouns, verb inflections) that are characteristic of first-person. However, the exact boundaries might be fuzzy (e.g., does it include first-person plural? Does it include first-person in quotes?).
     - **Handoff to Human**: This requires judgment on what counts as a first-person narrative. The feature might be representing a set of linguistic patterns that are correlated with first-person, but the concept itself is abstract. We must decide if this is a genuine representation of the concept or a collection of low-level patterns. Given that the tests above pass, we can say it's a representation, but we must document the scope (narrative vs. non-narrative, etc.).

  6. **Decision**: This case is the least confident. Why?
     - The causal test might be weak because the model could have multiple ways of representing first-person.
     - The stability test might reveal that the feature is more tied to specific pronouns than to the narrative structure (e.g., it might fire on "I" even in non-narrative sentences). We must check that.
     - Also, the level of abstraction is tricky: is the feature capturing the linguistic markers (which are surface patterns) or the abstract concept of self-narration?

     **Procedure Outcome**: 
     - The feature passes invariance and might pass causal and stability, but the abstraction is ambiguous. We hand off to a human for final judgment.

  ### Summary of Confidence:

  - Case 1 (however): High confidence spandrel (failed invariance).
  - Case 2 (climate change): High confidence genuine representation (passed all tests without major abstraction issues).
  - Case 3 (first-person narrative): Least confident. The procedure flags it as passing the tests but requiring human judgment due to the level of abstraction and potential ambiguity in the concept's boundaries.
answer: |-
  Below is a practical decision procedure for evaluating whether a sparse autoencoder feature is a **genuine representation** (a feature with semantic content that robustly corresponds to a concept) or a **spandrel** (a superficial artifact that correlates with concepts in the training data but lacks causal or stable semantic content). The procedure prioritizes efficiency (~1 hour/feature) and uses four evidence types: **causal impact**, **invariance under paraphrase**, **stability**, and **abstraction level**. Tests are ordered to eliminate spandrels early.

  ---

  ### **Decision Procedure**
  **Goal**: Classify features as **Genuine Representation (GR)**, **Spandrel (S)**, or **Ambiguous Abstraction (AA)** (requires human judgment).  
  **Time budget**: ~60 mins/feature.  
  **Tools**: Feature activation dashboards, causal intervention tools (e.g., activation patching), paraphrase datasets, and distribution-shifted benchmarks.

  #### **Step 1: Invariance under Paraphrase (10 mins)**  
  **Purpose**: Rule out low-level spandrels (e.g., token/syntax hacks).  
  **Method**:  
  - Sample 10+ activating dataset examples. Generate 5+ paraphrases per example using templates/LLMs (e.g., "The {topic} debate is polarizing" → "Discussions about {topic} are divisive").  
  - Add 10 negative controls (semantically unrelated but lexically similar inputs).  
  **Sufficient Evidence**:  
  - **GR**: >80% activation on paraphrases; <20% on negative controls.  
  - **S**: <50% activation on paraphrases OR high activation on controls.  
  **Stop if S**: Feature is likely a lexical/syntactic artifact.  
  **Next if GR**: Proceed to Step 2.

  #### **Step 2: Causal Impact (20 mins)**  
  **Purpose**: Test if the feature *causes* concept-relevant behavior.  
  **Method**:  
  - *Activation*: Artificially activate the feature in 5+ concept-absent contexts. Measure downstream effect (e.g., next-token probability for concept-related words).  
  - *Suppression*: Suppress the feature in 5+ concept-present contexts. Measure degradation in concept-relevant tasks (e.g., topic classification, entailment).  
  **Sufficient Evidence**:  
  - **GR**: Activation induces concept-related behavior (e.g., +Δlogit >1.0 for concept words); Suppression degrades performance (e.g., >30% drop in accuracy).  
  - **S**: No significant effect (±<0.5Δlogit; <10% accuracy drop).  
  **Stop if S**: Feature is a non-causal correlate.  
  **Next if GR**: Proceed to Step 3.

  #### **Step 3: Stability (20 mins)**  
  **Purpose**: Check robustness to distribution shift (spandrels often fail).  
  **Method**:  
  - Test activation on 3+ OOD datasets (e.g., new domains, adversarial perturbations, stylistic shifts).  
  - Measure activation variance for core concept across shifts (e.g., std dev ≤0.1).  
  **Sufficient Evidence**:  
  - **GR**: High stability (activation variance ≤0.1; >70% retention across shifts).  
  - **S**: High variance (≥0.3) or collapse (<50% retention).  
  **Stop if S**: Feature is context-dependent and fragile.  
  **Next if GR**: Proceed to Step 4.

  #### **Step 4: Abstraction Level (10 mins)**  
  **Purpose**: Flag features where "concept" is ill-defined, requiring human judgment.  
  **Method**:  
  - Cluster activating examples into subconcepts. Compute pairwise activation similarity (e.g., cosine).  
  - If variance is high (e.g., clusters lack clear semantic core), flag ambiguity.  
  **Decision**:  
  - **GR**: Tight clustering (e.g., >0.8 similarity) around a coherent concept.  
  - **AA**: Low clustering cohesion (e.g., <0.5 similarity) OR concept too broad (e.g., "conflict" vs. "climate conflict").  
  **Handoff to Human if AA**: Philosopher/safety team reviews concept boundaries.

  ---

  ### **Case Studies**
  **Hypothetical Setup**: All features pass initial SAE metrics (e.g., high interpretability score, low deadness).

  #### **Case 1: "However" in Fixed Syntax**  
  - **Step 1 (Invariance)**:  
    - Paraphrases: "Nonetheless, X" (activates 10%), "Yet, X" (5%), "In contrast, X" (0%).  
    - Controls: "However" in mid-sentence (activates 90%); "But" (5%).  
    - **Result**: Fails (paraphrase activation <50%). **Verdict: S (Spandrel)**.  
  - **Why confident**: Surface-syntax dependency is clear; no need for further tests.

  #### **Case 2: Climate Change Mentions**  
  - **Step 1 (Invariance)**:  
    - Paraphrases: "Global warming" (95%), "CO₂ emissions" (90%), "climate crisis" (85%).  
    - Controls: "Weather patterns" (5%), "renewable energy" (10%). Passes.  
  - **Step 2 (Causal)**:  
    - *Activation*: Injecting feature causes model to generate climate-related text (Δlogit +1.8 for "emissions").  
    - *Suppression*: Feature suppression in "Climate change is real" reduces "environment" probability by 45%. Passes.  
  - **Step 3 (Stability)**:  
    - Stable across scientific (88%), political (82%), and social media (75%) corpora. Passes.  
  - **Step 4 (Abstraction)**:  
    - Clustering: All examples relate to "anthropogenic climate change" (similarity >0.85).  
    - **Verdict: GR (Genuine Representation)**.  
  - **Why confident**: Strong causal role and invariance across contexts.

  #### **Case 3: First-Person Narratives**  
  - **Step 1 (Invariance)**:  
    - Paraphrases: "I experienced X" (98%), "We saw Y" (95%), "My journey" (90%).  
    - Controls: Third-person (5%), commands (0%). Passes.  
  - **Step 2 (Causal)**:  
    - *Activation*: Injecting feature shifts output to first-person (Δlogit +1.2 for "I").  
    - *Suppression*: Reduces first-person continuity by 30% but not eliminated (other features exist). Partial pass.  
  - **Step 3 (Stability)**:  
    - High variance: Fictional narratives (90%), academic essays (40%), transcripts (15%). Fails.  
  - **Verdict: S (Spandrel)**.  
  - **Least confident case**: Why?  
    - **Partial causal role** (suppression isn't catastrophic due to redundancy).  
    - **Ambiguous abstraction**: Is this about "self-reference" or "narrative style"? Human judgment needed if stability passed, but it failed here.  
    - **Critical weakness**: Distribution shift fragility (academic/transcript collapse) reveals it as a stylistic artifact, not core "self" representation.

  ---

  ### **Key Insights**  
  - **Efficiency**: Steps 1–2 resolve 80% of cases in 30 mins. Spandrels often fail invariance or causality.  
  - **Weak Spot**: Abstraction (Step 4) is subjective. Hand off if:  
    - Clustering is incoherent (e.g., a "conflict" feature activates for both wars and arguments).  
    - Cultural/linguistic biases obscure concept boundaries.  
  - **When Spandrels Matter**: They are high-risk if the model uses them as "shortcuts" (e.g., the "however" feature could fail if syntax changes post-deployment). Genuine representations (e.g., climate change) generalize robustly.  

  This procedure minimizes philosophy, focusing on empirical tests. For first-person narratives, stability testing was decisive—if it had passed, abstraction ambiguity would require human review.
