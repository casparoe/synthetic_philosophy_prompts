prompt: |-
  I TA a second-year course that's nominally "games, decisions and rationality" but is really half philosophy, half econ, and Thursday I get them for eighty minutes with a whiteboard and no slides to do backward induction and the centipede game. It's a 9am slot so a third of them will be running purely on coffee. They've already had simultaneous-move games, Nash equilibrium, iterated elimination of dominated strategies, the prisoner's dilemma and finitely repeated versions of it, and they can read a game tree, but nobody has met perfect-information games or subgame perfection before. Don't explain the centipede game to me — I know it, I know Rosenthal's version with the doubling pot, I know the unique subgame perfect equlibrium has player one taking immediately, and I know the lab results where hardly anyone does and people end up better off than the equilibrium predicts. What I want is the plan for how to sequence the explanation. Specifically: which components have to be in place before which others, with the dependency claims spelled out rather than just a list in a plausible order; and what the single example that carries the whole session should be, including what that example needs to have and needs to lack. I'm torn between drawing the 100-node doubling game as a truncated tree and doing something much shorter — four or six nodes, played live with two students at the front for real money (well, sweets) — and I suspect there's a third option I haven't thought of.

  Here's my working hypothesis about the shape of the thing, and I want you either to build the plan around it or tell me plainly that it's wrong: the real content isn't the recursion at the far end of the tree, which they'll pick up in two minutes, it's what a player is entitled to believe once they witness a move that the recursion says can't happen. On that view the centipede is fundamentally a story about belief revision after a surprise, and the tree is only the vehicle. Related subtlety I want handled properly, because I don't think most intro treatments are careful about it: taking is not locally dominant at each node in the plain one-shot sense — it's the right move only given a conjecture about how play continues, and the induction itself is what manufactures that conjecture. If they walk out thinking "passing is dominated so passing is just an error," I've failed the session.

  Map the misconceptions for me in the order they'll actually surface. My guesses: (i) that this is basically an iterated prisoner's dilemma in a longer costume; (ii) that the player who passes is being generous rather than betting on getting paid back later; (iii) that backward induction is an instruction about how you should play rather than a prediction about what players who are rational and known to be will do; (iv) that "common knowledge of rationality" just means everyone is rational and everyone knows it, which is exactly what makes the off-path nodes so strange; (v) my own favourite — that the argument has the same structure as the surprise exam, so if the surprise exam reasoning is a fallacy the centipede reasoning must be too; and (vi) that the experiments straightforwardly prove people are irrational. Also: one student plays a lot of chess and will insist the whole thing is trivial recursion a computer could do — tell me what to say to him and at which point in the sequence to say it, not at the end.

  Answer as someone who has both taught this material many times and thought about it as a philosopher: I care about the conceptual dependency structure more than classroom choreography, and I want you to think carefully before drafting. If it helps, sketch two or three candidate arcs first and then commit to one. Format it as a numbered sequence with a one-line "why here and not earlier/later" attached to each step; then a table of misconceptions with columns for what a student will actually say, roughly where in the sequence it surfaces, and the specific move that heads it off; then two short lists — things I should explicitly refuse to get into at this level (I'm thinking reputation and incomplete-information types, trembling hand, forward induction, the whole surprise-exam literature) with a sentence each on what I say out loud to justify skipping them, and one closing question that separates students who got the belief-revision point from students who just memorised "player one takes immediately." No readings, no citations, don't suggest any: I can't look anything up and neither can they. End with a single line beginning "Verdict:" naming the one misconception that does the most damage if it's still standing when they leave.
reasoning: |-
  We are building a conceptual sequence for backward induction and the centipede game, focusing on the dependency structure and the belief revision aspect. The goal is to have students understand that backward induction is a prediction based on common knowledge of rationality (CKR), and that it produces a conjecture about future play which makes taking the dominant choice at each node. We also want them to see that when a player passes, it challenges the CKR assumption and forces belief revision.

  The plan will use a short centipede game (4 or 6 nodes) to make it tractable and to focus on the key ideas without getting lost in a long tree. We will play it live with two students for sweets to engage the class.

  **Core Conceptual Dependencies:**
  1. **Understanding the game tree and information sets:** They already know how to read a game tree, so we can build on that. But we must emphasize that in perfect information games, every node is a singleton information set and players know the entire history.

  2. **Backward induction as a solution concept:** We need to show that the solution is constructed from the end. This requires that we first establish the payoffs at the terminal nodes and then work backwards.

  3. **The role of rationality and common knowledge:** The induction step at each node relies on the player being rational and believing that future players will play according to the backward induction solution. This is where the conjecture comes in.

  4. **The off-path problem:** When a player passes, it contradicts the backward induction path. Then, what should the next player believe? This is the key belief revision point.

  **The Plan: A Numbered Sequence**

  1. **Review of game trees and perfect information (5 min)**
     - *Why here?* We need to set the stage by recalling that in perfect information games, players move sequentially and know the entire history. This is a prerequisite for backward induction.
     - *Content:* Draw a very simple tree (maybe a 2-node game) to remind them of the structure. Emphasize that at each node, the player knows exactly where they are.

  2. **Introduce backward induction with a simple example (10 min)**
     - *Why here?* We need a simple example to demonstrate the algorithm without the complications of the centipede game. This builds confidence and shows the recursion.
     - *Example:* Use a 3-node game (Player 1 moves, then Player 2, then Player 1 again) with small numbers. Show how we start at the last node and work backwards. At each step, the player chooses the best action given the payoffs. The key point: at the second node, Player 2 chooses an action, and then Player 1 at the first node chooses knowing what Player 2 will do. This establishes the idea of "solving from the end".

  3. **State the assumptions: rationality and common knowledge (5 min)**
     - *Why here?* Before moving to a more complex example, we must explicitly state what backward induction relies on: each player is rational (chooses the action that maximizes their payoff) and this is common knowledge. Also, the structure of the game is common knowledge.
     - *Content:* Explain that at each node, the player assumes that future play will be according to backward induction. This is the conjecture that the induction step manufactures.

  4. **Play the centipede game live (15 min)**
     - *Why here?* We now apply backward induction to the centipede game. We use a short version (e.g., 4 nodes: P1, P2, P1, P2) with doubling payoffs (e.g., starting at (1,1) then (2,2) then (4,4) then (8,8) but with the option to take and get a split). We play it with two students at the front for sweets (real incentives). The payoffs might be: 
          - If P1 takes at first node: (2,0)
          - If P1 passes and then P2 takes: (0,3)
          - If P1 passes, P2 passes, then P1 takes: (5,1)
          - If they go to the end: (3,6) [for a 4-node version] or adjust as needed to make passing tempting but the backward induction solution is to take immediately.
     - *How:* We draw the tree on the board. We let the students play. Then we analyze using backward induction. We show that at the last node, P2 will take (because 6>5? adjust numbers so that taking dominates at the last move). Then at the previous node, P1, knowing that, will take (because if they pass, P2 takes and they get 1, but if they take now they get 5? adjust to make the numbers work). Then at the node before, P2 will take because if they pass, P1 will take and they get 1, but if they take now they get 3. Then at the first node, P1 takes because if they pass, P2 will take and they get 0, but if they take now they get 2. So the BI solution is: P1 takes immediately.

  5. **Contrast with actual play and the belief revision problem (15 min)**
     - *Why here?* Now we have the BI prediction and we have seen (in the live play) that the players did not follow it. This is the moment to discuss why: when a player passes, they are not being irrational per se, but they are betting that the next player will also pass. This breaks the BI conjecture. We must discuss what happens when a player passes: the next player must update their beliefs. They thought the previous player was rational and would take, but they didn't. So now, what? The next player might think that the previous player is not rational, or that they are rational but have a different plan? This is the belief revision.
     - *Content:* Emphasize that passing is not dominated in a one-shot sense. At a node, passing might lead to a higher payoff if the next player passes. But in BI, we assume that the next player will take. So the only reason to pass is if you think the next player might not play as BI predicts. This leads to the idea that BI relies on common knowledge of rationality. If a player passes, it breaks that common knowledge and then the next player must form new beliefs.

  6. **Address the chess player's comment (5 min)**
     - *Why here?* The chess player might interrupt earlier, but we address it after the live play when the recursion is clear. We say: "In chess, the computer does backward induction for a few moves, but it's a finite game? Actually, chess is finite but too long. However, the key difference is that in the centipede game, the payoffs and the structure are such that the BI solution is clear. But in real life, when humans play, they don't necessarily have common knowledge of rationality. And that's why the BI solution is not always played. Also, in the centipede, the payoffs are designed so that passing is risky but potentially rewarding. In chess, the payoffs are win/lose/draw and the moves are complex, but the principle is the same: you assume the opponent will play optimally. The difference is that in the centipede, we are testing the limits of that assumption in a simple setting."

  7. **Summarize the key points (5 min)**
     - Backward induction is a solution concept for finite perfect information games that uses the assumption of common knowledge of rationality to predict play.
     - It works by starting at the end and working backwards, at each step assuming that future play will be according to the solution.
     - The centipede game shows that in practice, people often pass because they don't believe that the other player will follow the BI path. This leads to higher payoffs but breaks the CKR assumption.
     - When a player passes, it forces the next player to revise their beliefs about the previous player's rationality.

  **Table of Misconceptions:**

  | What the student says (or does)           | When it surfaces          | How to head it off                                                                 |
  |------------------------------------------|---------------------------|------------------------------------------------------------------------------------|
  | "This is like the iterated prisoner's dilemma." | After introducing the centipede | Point out that in PD, there is simultaneous move and dominant strategies. In centipede, moves are sequential and passing is not dominated in isolation. |
  | "Passing is generous/kind."              | During live play or after | Emphasize that passing is strategic: the player hopes the next player will also pass and they will get more. |
  | "Backward induction tells me how I should play." | After step 2 or 4 | Clarify: BI is a prediction of what rational players will do under CKR, not a moral imperative. |
  | "Common knowledge of rationality just means everyone is rational." | During step 3 or 5 | Explain: CKR means not only that everyone is rational, but that everyone knows that everyone is rational, and so on ad infinitum. Without this, the induction breaks. |
  | "This is like the surprise exam paradox." | During step 5 (belief revision) | Acknowledge the similarity but note that in the centipede, the game is finite and the induction is sound. The surprise exam is about knowledge and time, and the analogy breaks down because in the game the payoffs are fixed and known. |
  | "The experiments show people are irrational." | At the end | Counter: The experiments might show that people don't have common knowledge of rationality, or that they are risk-seeking, or that they are trying to be kind. But note that in the centipede, passing can be rational if you think the other player might not be rational. |

  **What to Skip (and Why):**

  - **Reputation and incomplete information:** "We are assuming complete information about the game and rationality. In reality, players might not be sure about each other's payoffs or rationality, but that's for another class."
  - **Trembling hand and forward induction:** "We are assuming perfect rationality. Sometimes we consider small mistakes (trembling hand) or inferences from past moves (forward induction), but that goes beyond backward induction and we won't cover it now."
  - **Surprise exam literature:** "The surprise exam is a different kind of paradox about knowledge and time. We are focusing on games with known payoffs and sequential moves."

  **Closing Question:**

  "Suppose we play the centipede game again, and at the first node, Player 1 passes. What should Player 2 believe about Player 1's rationality, and how should that affect Player 2's decision?"

  *Why this question?* It directly tests the belief revision point. A student who got it will say that Player 2 should question whether Player 1 is rational or whether Player 1 expects to get a higher payoff by passing. This might lead Player 2 to pass as well, hoping that Player 1 will reciprocate later. A student who only memorized the BI solution will say that Player 2 should take because that's what BI says.

  **Verdict:** The most damaging misconception if it remains is that **"passing is dominated and therefore always irrational"** because it misses the strategic interdependence and the role of beliefs about future play. If they leave with that idea, they will not understand why the centipede game is interesting and why people pass in experiments.
answer: |-
  ### Conceptual Sequence for Backward Induction and the Centipede Game  
  **Core Goal:** Frame backward induction (BI) as a consequence of common knowledge of rationality (CKR), where off-path moves force belief revision—not as mechanical recursion. Use a **4-node centipede game** (P1 → P2 → P1 → P2) with escalating payoffs (e.g., take/pass payoffs: Start (1,0) if P1 takes; (0,2) if P1 passes and P2 takes; (3,1) if P2 passes and P1 takes; (2,4) if both pass to end). Play it live with two students for sweets to create a "surprise" moment.  

  #### Numbered Sequence (80-Minute Session)  
  1. **Revisit game trees and perfect information (5 min)**  
     *Why here and not later?* Must establish that players know the history at each node. Dependency: Without this, BI’s sequential reasoning fails.  
     *Action:* Draw a 2-node tree (P1 moves, then P2) with payoffs. Ask: "At P2’s node, what does P2 know? How does this differ from simultaneous games?"  

  2. **Introduce backward induction via a 3-node game (10 min)**  
     *Why here and not earlier?* BI requires terminal nodes as anchor points. Start simple to isolate the algorithm before layering CKR.  
     *Action:* Use a non-centipede tree (e.g., P1 → P2 → P1 with payoffs (4,2), (3,5), etc.). Solve from the end: "At the last node, P1 chooses action A (max payoff). At prior node, P2 anticipates this, so chooses B, etc." Highlight: **BI manufactures conjectures**—P2’s choice assumes P1’s future rationality.  

  3. **Define rationality and common knowledge (CKR) explicitly (10 min)**  
     *Why here and not later?* CKR is the engine of BI. Must articulate it before centipede to show why off-path moves break the logic.  
     *Action:* "Rationality: Each player maximizes their payoff. CKR: Everyone is rational, everyone knows it, everyone knows *that* everyone knows it, ad infinitum. BI assumes CKR holds at every node—so players *conjecture* future players will play BI."  

  4. **Play the 4-node centipede live (20 min)**  
     *Why here and not earlier?* The live demo creates cognitive dissonance: BI predicts immediate take, but students pass. This surfaces belief revision.  
     *Action:*  
     - Draw the tree with payoffs (e.g., P1 take: (1,0); P1 pass → P2 take: (0,2); P2 pass → P1 take: (3,1); both pass: (2,4)).  
     - Invite two students (for sweets). Run the game. Most will pass early.  
     - Post-game: Apply BI step-by-step. Emphasize: **Taking is dominant only if players believe future players follow BI.** Passing isn’t "irrational" alone—it’s a bet against CKR.  

  5. **Analyze the live result: Belief revision after a surprise (20 min)**  
     *Why here and not earlier?* This is the core insight. Dependency: Requires the live "surprise" to motivate why CKR fails when passing occurs.  
     *Action:*  
     - "P1 passed. BI says that shouldn’t happen. What should P2 believe now?"  
     - Discuss: P2’s BI conjecture assumed P1 was rational and took CKR for granted. Passing forces P2 to revise beliefs—e.g., "P1 might be irrational, or P1 expects me to pass."  
     - Stress: BI’s prediction relies on CKR holding globally. One deviation shatters it, making passing rational if you doubt the other’s commitment to BI.  

  6. **Address the chess player (5 min, during Step 4 or 5)**  
     *Why here?* When they say "This is trivial recursion," pivot to belief revision.  
     *Action:* "Chess engines use BI-like recursion, but they assume fixed rationality. Here, humans *question* CKR when a move 'shouldn’t' happen. That’s why BI fails empirically—it can’t handle belief updates mid-game."  

  7. **Contrast with iterated prisoner’s dilemma (IPD) (5 min)**  
     *Why here?* After centipede demo, to dispel misconception (i).  
     *Action:* "IPD has simultaneous moves, so strategies are contingent on history. Centipede is sequential: players react to immediate deviations, not long-term tit-for-tat."  

  8. **Summarize: BI as prediction, not prescription (5 min)**  
     *Why here?* Ends with the key takeaway.  
     *Action:* "BI doesn’t tell you what to do; it predicts what happens under CKR. When players pass, they’re not ’wrong’—they’re rejecting CKR."  

  ---

  ### Misconceptions Table  
  | What a student says/suggests           | When it surfaces       | How to head it off                                                                 |  
  |----------------------------------------|------------------------|------------------------------------------------------------------------------------|  
  | "This is like iterated prisoner’s dilemma." | During/after live play (Step 4) | "IPD is simultaneous; here, moves are sequential. Passing isn’t cooperation—it’s betting the next player won’t take." |  
  | "Passing is generous."                 | During live play (Step 4) | "Is it generosity? Or does P1 pass because they expect P2 to reciprocate? BI assumes they won’t." |  
  | "BI tells me how I should play."       | During BI demo (Step 2) | "BI isn’t advice—it’s a forecast under strict CKR. Real players might profitably deviate." |  
  | "CKR just means everyone is rational." | During CKR definition (Step 3) | "CKR requires infinite mutual knowledge. If P1 passes, P2 questions if P1 knew *that* P2 knew they were rational." |  
  | "This is a fallacy, like the surprise exam." | During belief revision (Step 5) | "Surprise exam uses self-referential time. Centipede is finite: payoffs are fixed, and BI is sound *if* CKR holds." |  
  | "Experiments prove people are irrational." | Post-live play (Step 5) | "People might be rational but doubt CKR. Passing can be a rational gamble if you believe others won’t play BI." |  

  ---

  ### What to Skip (With Justification)  
  - **Reputation/incomplete information:** "We’re assuming known rationality and payoffs. Reputation adds uncertainty we’ll cover later."  
  - **Trembling hand/forward induction:** "These address mistakes or signaling. Today, we focus on perfect rationality and immediate belief updates."  
  - **Surprise exam literature:** "That’s a logic puzzle about knowledge over time. Our game is about payoffs and sequential actions under CKR."  

  ### Closing Question  
  **"In a 6-node centipede, Player 1 passes at the first node. Player 2 now has to move. What does Player 2’s optimal action depend on, and why might it differ from BI?"**  
  - *Why this?* Tests belief revision: Correct students note Player 2 must form new beliefs about P1’s rationality/intentions and may pass to reciprocate. Memorizers repeat "BI says take."  

  ---  
  **Verdict:** The most damaging misconception if unaddressed is **"taking is locally dominant, so passing is irrational"**—it ignores that BI’s conjectures rely on CKR, and passing can be rational if CKR is doubted. If this stands, students miss the game’s entire epistemic tension.
