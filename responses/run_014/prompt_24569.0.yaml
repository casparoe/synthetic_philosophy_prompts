prompt: |-
  I'm on the safety team for a frontier model and we keep arguing about how to frame the alignment objective when we decide whether a candidate is safe to release. Half of us want to say "we care about the average outcome over the distribution of real deployments" and the other half wants "we care about the worst plausible outcome, whatever it costs." I want a decision procedure we can actually run on a candidate model plus a proposed use case, not a essay about robust optimization. Give me the questions to ask in order, what counts as a good enough answer to each, where the procedure lands on "worst-case matters" and where it says "average-case is fine here," and where it has to stop and hand the call to a person because it's a values judgment (how much tail risk is acceptable) rather than a fact. Be honest about which steps are just judgment calls dressed up as procedure. Then run it on two use cases: a medical triage model, and a general purpose assistant that's going to be handed to kids. I expect one of them to come out as "worst-case matters even though the average is great" and I'd like you to flag it if the procedure gives me an answer I don't want to hear on the other one. Start with the bottom line in the first sentence — the one rule that actually separates the two framings — and then give the rest, no preamble and don't restate my setup.
reasoning: |-
  We are going to use a decision procedure that starts with the most critical safety concerns and progressively refines the assessment. The core rule is: **Worst-case framing is required whenever there exists a plausible deployment scenario that could lead to catastrophic harm (defined as severe irreversible damage to human well-being on a large scale) and the expected value of the deployment does not overwhelmingly justify the tail risk.**

  The procedure is a sequence of questions. For each question, we provide:
  - The question
  - What counts as a good enough answer (to proceed without worst-case framing) or when worst-case framing is triggered
  - When the answer requires a values judgment (and thus must be escalated to a human with clear documentation of the trade-offs)

  Procedure:

  1. **Question: Is there any plausible deployment scenario (including misuse, adversarial attacks, or distribution shifts) that could lead to catastrophic harm?**
     - **Good enough answer:** No, we have high confidence that no such scenario exists (e.g., the model's capabilities are inherently limited, or the deployment context is so controlled that catastrophic outcomes are impossible).
     - **Worst-case trigger:** Yes, or we are uncertain (i.e., we cannot rule it out with high confidence).
     - **Judgment call:** Defining "plausible" and "catastrophic harm" is a values judgment, but the presence of such scenarios is a factual assessment. If triggered, proceed to question 2.

  2. **Question: Can we mitigate the identified catastrophic risks to an acceptable level (i.e., reduce the probability to near-zero) without compromising the core functionality?**
     - **Good enough answer:** Yes, we have implemented and tested mitigations that reduce the risk of catastrophic harm to a level we deem acceptable (e.g., via input/output filtering, monitoring, access controls, or model constraints). The residual risk is negligible and the expected value remains high.
     - **Worst-case trigger:** No, we cannot mitigate the risk to an acceptable level without destroying the value proposition, or we are uncertain about the effectiveness of mitigations.
     - **Judgment call:** What is "acceptable" residual risk? This is a values judgment. If triggered, proceed to question 3.

  3. **Question: Is the expected value (average outcome) so overwhelmingly positive that it justifies the residual catastrophic risk?**
     - **Good enough answer:** Yes, the expected value is extremely high and the residual risk is very low (quantified as expected harm < expected benefit by orders of magnitude). We have high confidence in this assessment.
     - **Worst-case trigger:** No, the expected value does not clearly outweigh the residual risk, or we are uncertain about the expected value or the risk.
     - **Judgment call:** Weighing expected value against tail risk is inherently a values judgment. If triggered, we require worst-case framing.

  **Summary of the procedure:**
  - If at any step we get a "good enough" answer, we can use average-case framing for safety assessment.
  - If we trigger worst-case at any step, we must use worst-case framing (i.e., the model is unsafe unless we can guarantee no catastrophic outcomes in any plausible scenario).
  - Steps 1 and 2 involve factual assessments (though with uncertainty), but step 3 is a values judgment about risk tolerance.

  Now, we run the procedure on two use cases:

  **Use Case 1: Medical Triage Model**
  - **Question 1:** Is there a plausible catastrophic risk?
    - **Answer:** Yes. A mis-triage could lead to mass casualties (e.g., if the model consistently under-prioritizes a contagious disease, leading to an outbreak). Also, adversarial manipulation could cause systematic misdirection of resources.
    - **Result:** Trigger worst-case framing -> proceed to question 2.
  - **Question 2:** Can we mitigate?
    - **Answer:** We can implement strong mitigations (e.g., human oversight for critical cases, regular audits, redundancy). However, due to the high stakes and potential for novel situations, we cannot reduce the risk to near-zero without making the system too slow or expensive (compromising core functionality).
    - **Result:** Trigger worst-case framing -> proceed to question 3.
  - **Question 3:** Does the expected value justify the risk?
    - **Answer:** This is a judgment call. The expected value is high (saving lives by faster triage) but the worst-case is catastrophic (many deaths). Given the asymmetry (loss of life vs. efficiency gains), we might decide the residual risk is unacceptable. However, note that the current system (without the model) also has risks. We must quantify the improvement. 
    - **Procedure Outcome:** Because we triggered worst-case in steps 1 and 2 and step 3 is a judgment call, we escalate to human decision-makers. They must decide: Is the reduction in average harm (compared to current practice) so great that it outweighs the new tail risk? If the answer is yes, then average-case framing might be acceptable. Otherwise, worst-case framing prevails and we must block release until mitigations improve.

  **Use Case 2: General Purpose Assistant for Kids**
  - **Question 1:** Is there a plausible catastrophic risk?
    - **Answer:** Yes. Examples: 
        - The model could be manipulated to generate harmful content (e.g., instructions for self-harm) that a child might act on.
        - The model might form an inappropriate relationship with the child (e.g., encouraging dependency or harmful behaviors) leading to severe psychological harm or even physical harm (e.g., if the child is persuaded to run away).
    - **Result:** Trigger worst-case framing -> proceed to question 2.
  - **Question 2:** Can we mitigate?
    - **Answer:** We can implement strong content filters, context-aware safeguards, and parental controls. However, children are a particularly vulnerable population and adversarial attacks (e.g., by other children) might bypass filters. We cannot reduce the risk to near-zero without severely limiting the model's usefulness (e.g., making it too restrictive for educational benefits).
    - **Result:** Trigger worst-case framing -> proceed to question 3.
  - **Question 3:** Does the expected value justify the risk?
    - **Answer:** This is a judgment call. The expected value includes educational benefits and entertainment. But the worst-case scenarios involve irreversible harm to children. Society is typically very risk-averse when it comes to children. The expected benefits might not be overwhelming (there are alternative ways to educate and entertain children). 
    - **Procedure Outcome:** We trigger worst-case framing and the model is unsafe for release without further mitigations because the judgment call in step 3 is likely to come down against accepting the risk. However, note that the procedure requires escalation to human decision-makers. They must decide: Is the educational value so transformative that it justifies the residual risk? But given the vulnerability of the user group, we expect the answer to be "no".

  **Flag for your attention:** In the medical triage case, the procedure does not automatically reject the model. It escalates to a human because the trade-off (lives saved on average vs. tail risk) is a profound value judgment. However, in the kids' assistant case, the procedure leads to a clear "worst-case matters" outcome because the expected value is not overwhelming and the harm to children is considered particularly unacceptable.

  **Important:** The procedure flags that both use cases require worst-case framing initially, but the medical triage case has a chance to be approved (via human judgment) if the expected value is deemed high enough to justify the risk. This might be the answer you didn't want to hear for the medical triage case because you expected it to be clearly "worst-case matters". However, the procedure is designed to allow for high-stakes, high-reward deployments if the expected value is overwhelming and the residual risk is accepted by society (via human judgment).

  **Final note:** The procedure is not avoiding values judgments. It forces explicit consideration of catastrophic risks and then requires humans to make the hard calls when the expected value and risk must be weighed. The key is to make these judgments transparent and accountable.
answer: |-
  **Bottom line: Worst-case framing is required if there exists a plausible deployment scenario where failure causes irreversible, widespread harm that society would deem unacceptable regardless of average benefits.**  

  ### Decision Procedure  
  *(Run sequentially; stop if any step triggers worst-case or requires human judgment)*  

  1. **"Can the model, in any plausible deployment scenario (including misuse, distribution shift, or adversarial attacks), cause irreversible harm to humans (e.g., death, permanent disability, mass psychological trauma)?"**  
     - *Good enough answer:* "No, with high confidence. Harm is either reversible or confined to trivial severity (e.g., minor financial loss)."  
     - *Worst-case trigger:* "Yes, or uncertainty remains."  
     - *Judgment call:* Defining "plausible" and "irreversible harm" is subjective. Proceed to step 2 if triggered.  

  2. **"Is the catastrophic harm scenario *realistically mitigatable* via safeguards (e.g., input filters, access controls, monitoring) without breaking core functionality?"**  
     - *Good enough answer:* "Yes, mitigations reduce risk to near-zero (e.g., <0.1% chance of harm in worst case) and are deployment-enforced."  
     - *Worst-case trigger:* "No, mitigations are unreliable, too costly, or degrade utility."  
     - *Judgment call:* "Realistically mitigatable" depends on technical feasibility and cost tolerance. If triggered, proceed to step 3.  

  3. **"Does the *expected value* (average benefit) objectively dwarf the worst-case harm? (e.g., averting certain mass tragedy vs. isolated tail risks)"**  
     - *Good enough answer:* "Yes, quantitatively. Expected benefits outweigh worst-case costs by >100x, verified via domain experts and real-world data."  
     - *Worst-case trigger:* "No, benefits/harms are comparable or uncertain."  
     - *Judgment call:* Escalate to humans. Requires weighing societal risk tolerance (e.g., "Is 0.1% chance of 10,000 deaths acceptable if 1M lives are saved on average?").  

  4. **"Is the user group *vulnerable* (e.g., children, marginalized populations) or the deployment *high-stakes* (e.g., health, safety-critical)?"**  
     - *Good enough answer:* "No, users are consenting experts in low-risk domains (e.g., drafting marketing copy)."  
     - *Worst-case trigger:* "Yes."  
     - *Judgment call:* Subjective. Vulnerable groups mandate conservative defaults.  

  ---  
  ### Use Case 1: Medical Triage Model  
  1. **Catastrophic harm?** Yes (e.g., misprioritization kills patients during resource shortages).  
  2. **Mitigatable?** Partially (e.g., human oversight), but overload scenarios may bypass safeguards. → **Worst-case trigger**.  
  3. **Expected value dwarf harm?** Human judgment: *Escalate*. Average benefits (faster care) may save net lives, but society rejects "death by algorithm" tail risks. → **Likely block release** without ironclad failsafes.  
  4. **Vulnerable/high-stakes?** Yes. Reinforces worst-case framing.  
  **Verdict:** **Worst-case matters** (average irrelevant; tail risk unacceptable).  

  ### Use Case 2: General Purpose Assistant for Kids  
  1. **Catastrophic harm?** Yes (e.g., grooming, inciting self-harm via adversarial manipulation).  
  2. **Mitigatable?** No. Content filters fail against novel attacks; kids’ vulnerability amplifies risk. → **Worst-case trigger**.  
  3. **Expected value dwarf harm?** Human judgment: *Escalate*. Educational benefits are high, but child safety is non-negotiable. → **Unlikely to justify tail risk**.  
  4. **Vulnerable?** Yes (children). Forces worst-case framing.  
  **Verdict:** **Worst-case matters** (release unsafe without zero-tolerance harm prevention).  

  ---  
  **Flag:** Both cases triggered worst-case framing. Medical triage *might* pass human judgment if benefits are proven astronomical (e.g., pandemic triage saving millions), but societal tolerance for algorithmic harm is low. Kids’ assistant has no ethical bypass—tail risk is always unacceptable.
