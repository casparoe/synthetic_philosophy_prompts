  Okay, let me start by unpacking what the user is asking. They're encountering a recurring argument pattern in discussions about the moral equality of combatants. The core issue is that instead of debating the first-order moral truth, the discussion shifts to the consequences of believing that truth. The user wants to know if this has a name and how it differs from similar concepts.

  First, I need to recall related philosophical terms. Self-effacing theories come to mind, where a theory says it's better not to believe itself. But in this case, it's not about the theory itself being self-effacing, but about practical consequences overriding truth in discourse. Esoteric morality is another, where a moral truth is hidden if harmful. But here, the shift happens openly in debate without hiding the truth. 

  The law vs. morality distinction is also relevant, but the user mentioned that even non-consequentialists switch levels when discussing institutional rules. That's a key point: the same people who reject consequentialism in first-order morality use consequentialist reasoning at the institutional level. This seems like an unacknowledged shift in normative frameworks.

  Next, I consider if there's an existing term. "Two-level utilitarianism" by R.M. Hare involves intuitive vs. critical levels, but that's a structured theory. The user's case is more ad hoc, happening in debates without a consistent framework. "Pragmatic encroachment" is epistemological, about belief justification, not moral permissibility. Doesn't fit.

  The user’s examples show participants not just separating levels but using consequentialist arguments against a claim’s acceptance while rejecting consequentialism elsewhere. This inconsistency is central. The term "consequentialist creep" might capture the unacknowledged slide into consequentialism. Alternatively, "institutional override" emphasizes the shift to institutional considerations.

  I also need to address the user's deeper need: they suspect this move might be a confusion but can't evaluate without clarity. They want boundaries to decide if it's legitimate or fallacious. They might be frustrated by debates derailed from truth to pragmatics, seeking tools to refocus discussions or validate their skepticism.

  Confidence-wise, I'm sure no exact term exists. The proposed definitions are tentative, especially "consequentialist creep" as it's new. The distinction from similar concepts like self-effacing theories is solid, but the coinage might need refinement. Highlighting the unacknowledged framework shift is crucial—that’s the core issue the user faces in these debates.
answer: |-
  Based on your detailed description, I can confidently state that **no single, universally established term** exists for this specific argumentative pattern. It's a recognizable and significant phenomenon in just war theory and military ethics, but its precise configuration straddles and blends several established concepts without being perfectly captured by any one.

  Here's the breakdown, differentiating it from its neighbors and proposing a precise definition:

  1.  **Why Established Terms Don't Fit Perfectly:**
      *   **Self-Effacing Theories:** A self-effacing theory claims it's better (by its *own* lights) if people *don't believe it*. Your pattern isn't about the *theory itself* demanding non-belief. It's about *opponents* arguing that a *true* moral claim (held by the proponent) *should not be believed or acted upon* because of bad consequences, and the proponent *countering* with better predicted consequences of belief. The focus is on the *debate dynamic* concerning acceptance/consequences, not the theory's inherent structure.
      *   **Esoteric Morality / Publicity Condition:** Esoteric morality holds that the true moral principle should sometimes be *kept secret* because harmful if known. The publicity condition demands a moral principle must be *suitable for public knowledge* to be valid. Your pattern involves *open debate* about whether a publicly stated principle *should be taught or accepted* based on consequences. The *truth* of the principle is often conceded or bracketed in this part of the exchange. It's an argument *about* publicity/consequences, not a claim that the principle *is* esoteric or fails publicity inherently.
      *   **Deep Morality vs. Law of War:** This distinction explicitly acknowledges two levels. Your pattern becomes problematic when disputants *shift levels within the same normative domain* (morality) without acknowledging it, or when they use consequences-of-acceptance *against a first-order moral claim* itself, rather than arguing it should be *reflected differently* in law/practice. The confusion arises from the *silent shift* or using institutional concerns to *refute* a moral claim.
      *   **Indirect / Motive Consequentialism:** These are *positive consequentialist theories* that incorporate rules or motives as means to maximize good outcomes. Your pattern involves *non-consequentialists* deploying consequentialist-style arguments about consequences-of-acceptance *instrumentally* to reject a competing first-order moral claim or to defend an institutional rule, while simultaneously rejecting consequentialism for first-order moral justification. It's an *ad hoc*, inconsistent borrowing of consequentialist reasoning within a non-consequentialist framework.
      *   **Appeal to Consequences Fallacy (Argumentum ad Consequentiam):** The standard fallacy argues a claim is *true/false* because of the *good/bad consequences of it being true*. Your pattern is crucially different: the argument is about the *good/bad consequences of *believing* or *accepting* the claim*, often while *bracketing or conceding its truth*. The opponent says, "Your claim might be true, but believing it would be disastrous, so we must reject it (or not teach it)." The fallacy here is potentially shifting the grounds of the debate illegitimately or conflating justification levels, but it's distinct from the classic fallacy which confuses truth with consequences-of-truth.

  2.  **Proposed Name and Definition:**
      *   **Name:** **Consequentialist Creep in Moral Debate** or **Institutional Override Maneuver**
      *   **Precise Definition:** The argumentative move where, within a debate concerning a first-order non-consequentialist moral claim (C1):
          *   An opponent objects not to the truth of C1, but to the predicted negative consequences of its widespread *belief* or *institutional acceptance* (e.g., erosion of norms, increased brutality, instability).
          *   The proponent of C1 responds not by challenging the relevance of consequences-of-acceptance to the *truth* of C1, but by countering with predicted *positive* consequences of believing/accepting C1.
          *   The debate then proceeds substantively on the empirical/predictive grounds of consequences-of-acceptance, implicitly treating these consequences as decisive or highly relevant to the validity, acceptability, or practical implementation of C1, despite the participants' shared non-consequentialist commitments regarding the *basis* of C1's truth (e.g., liability, rights).
          *   **Core Element:** The unacknowledged or inconsistent introduction of consequentialist reasoning (specifically concerning consequences-of-*acceptance*/belief) into the justification or refutation of a claim within a discourse otherwise framed by non-consequentialist principles.

  3.  **Boundaries and Variations:**
      *   **Explicit Consequentialists:** If *all* parties are explicit consequentialists arguing consistently that consequences-of-acceptance *are* the primary determinant of a rule's validity ("rule consequentialism" or "acceptance utilitarianism"), then this is **not** the phenomenon. The phenomenon relies on the *inconsistency* or *level-shift* within a non-consequentialist framework. A consequentialist using consequences-of-acceptance is just being consistent.
      *   **Announced Level Shift:** If a disputant *explicitly* says, "While C1 might be the deep moral truth, for institutional stability we must adopt rule C2," this is the **Law vs. Morality distinction applied transparently**. It *becomes* the problematic phenomenon if:
          *   The opponent uses institutional consequences to argue *against the truth* of C1 ("C1 can't be true because believing it would cause chaos").
          *   The proponent uses positive institutional consequences *to defend the truth* of C1 ("C1 *must* be true because believing it would make soldiers more restrained").
          *   The debate *shifts* to consequences-of-acceptance *as if* it were directly relevant to the truth of C1, even after the levels are announced.
      *   **Division of Labor (Philosophers/Lawyers):** This is a *version* of the announced level shift. It avoids the core problem *if* philosophers consistently argue C1 based on non-consequentialist grounds, and lawyers argue for C2 based on institutional consequences, *without* philosophers using consequences-of-acceptance to defend C1 or lawyers claiming C2 reflects the deep truth. The phenomenon occurs if a philosopher, while arguing for C1's truth, invokes consequences-of-acceptance ("Soldiers *should* believe C1 because it makes them fight better"), or if a lawyer argues against C1's *truth* based on institutional needs ("C1 *can't* be the moral truth because the LOAC needs symmetry").
      *   **Same Thing vs. Resemblance:** The core phenomenon is the **unacknowledged, inconsistent reliance on consequences-of-acceptance within a non-consequentialist moral argument about a first-order claim.** Transparent level separation (Law/Morality) is a *different but related* practice. Consistent consequentialism is a *different framework altogether*. Self-effacingness and esotericism are *properties a theory might have*, not argumentative moves *in a debate*.

  4.  **Legitimacy vs. Confusion:**
      This move is **often a persistent confusion or an illegitimate shift**, but context matters.
      *   **Confusion:** It frequently involves a *conflation of justification levels*. The truth of a moral claim (C1: "Unjust combatants are liable to defensive killing only") is distinct from the practical question of whether that claim *should be the basis for rules taught to soldiers or codified in law*. Using consequences-of-acceptance to argue *against the truth* of C1 is generally fallacious (a form of appeal to consequences, albeit consequences-of-*belief*). Using it to defend the *truth* of C1 is also suspect if C1 is grounded in non-consequentialist principles.
      *   **Potential Partial Legitimacy:** The move *might* have a pragmatic point if the debate's *real* goal is "What rule should guide soldiers/be in the LOAC?" rather than "What is the deep moral truth?". However, when participants frame it as a debate *about the moral truth* (liability, permissibility) but then argue solely via consequences-of-acceptance, it becomes misleading. The legitimacy hinges on the *explicitly stated scope* of the argument. If the scope is "What should we teach soldiers?", consequences-of-acceptance are highly relevant. If the scope is "Is C1 morally true?", they usually are not relevant to *that specific question* within a non-consequentialist framework.

  5.  **Confidence and Uncertainty:**
      *   **High Confidence:** That this specific, recurring pattern lacks a single established name. I'm very familiar with the literature (McMahan, Walzer, Shue, Fabre, Lazar, etc.) and this dynamic is pervasive but not uniquely labeled. The distinctions drawn from self-effacing theories, esotericism, law/morality, and standard fallacies are solid.
      *   **High Confidence:** That the core issue is the *inconsistent application of normative frameworks* (non-consequentialist for truth, consequentialist for acceptance) within the *same argumentative space*.
      *   **Moderate Confidence:** In the proposed name "**Consequentialist Creep**" – it captures the *insidious, unacknowledged slide* into consequentialist reasoning within non-consequentialist discourse concerning consequences-of-acceptance. "**Institutional Override Maneuver**" is also descriptive but slightly narrower.
      *   **Least Sure:** About whether "Consequentialist Creep" is the *best possible* neologism. Other options like "Acceptance-Consequence Drift" or "Pragmatic Justification Shift" exist, but feel less punchy. The *exact phrasing* of the definition could also be refined, though the core elements (first-order non-consequentialist claim, shift to consequences-of-acceptance, inconsistency, debate proceeds on that basis) are clear.
      *   **Least Sure (Content):** Whether *all* instances described in your second example (non-consequentialists switching to institutional stability arguments) strictly fit the *core* phenomenon if they explicitly frame it *only* as an argument about institutional design/law *after* establishing the moral truth. The phenomenon is most acute when the levels are blurred *within* the moral debate itself.

  **In essence:** You've identified **Consequentialist Creep** – the unacknowledged and inconsistent introduction of consequentialist reasoning (specifically concerning the consequences of *believing* or *institutionally accepting* a moral principle) into a debate ostensibly focused on establishing the first-order, non-consequentialist moral truth of that principle. This creates confusion by conflating distinct levels of justification (moral truth vs. practical implementation/acceptance) and often involves debaters arguing past each other on empirical grounds irrelevant to the original moral claim's truth within their shared theoretical framework. It is generally a problematic move when the debate is framed as being about the moral truth itself.
