  The procedure will be a sequence of questions. At each step, if the answer does not meet the criteria for akrasia, we classify the episode accordingly (as one of the neighbors) and stop. If we pass all steps, we classify as akrasia.

  Procedure:

  Step 1: Check for Compulsion or Addiction
  Question: At the moment of action, did the character experience the action as chosen (i.e., as something she decided to do) or as something that happened to her without her agency?
  Criteria: If the action was not experienced as chosen (e.g., it felt automatic, irresistible, or as if she was a passive observer), then it is compulsion or addiction (neighbor a). Stop.
  Note: Even in cases of addiction, the person may feel they are choosing, but the key is whether they feel they have lost the ability to choose otherwise. If they feel they could have done otherwise but didn't, then it may still be akrasia. However, if the action is experienced as beyond control, then it is compulsion.

  Step 2: Check for Change of Judgment
  Question: At the moment of action, did the character still hold the original judgment that the action was wrong (or worse than the alternative)? That is, did she still believe that she should not do it?
  Criteria: If at the moment of action she no longer held that judgment (i.e., she had changed her mind and now believed the action was acceptable or even the right thing to do), then it is a change of values (neighbor b). Stop.
  Note: We must distinguish between a change in judgment and a temporary suspension of judgment (which might be akrasia). The key is whether she still endorses the original judgment at the time of action.

  Step 3: Check for Self-Deception about Judgment
  Question: Is there evidence that the character was self-deceived about what her judgment actually was? That is, did she believe she had a judgment that she did not actually hold (or vice versa)?
  Criteria: If there is evidence that the character was not being honest with herself about her own values (e.g., she told herself she believed in sobriety but deep down did not, or she thought she had resolved to leave the marriage but never really intended to), then it is self-deception (neighbor c). Stop.
  Note: This requires looking at the character's internal state. If she consciously held the judgment but then acted against it, that is akrasia. If she only thought she held the judgment but actually didn't (due to self-deception), then it's neighbor c.

  Step 4: Check for Ignorance of Particulars
  Question: At the moment of action, did the character fail to recognize that the situation fell under the general principle she had endorsed? That is, did she not realize that this was the kind of situation her judgment applied to?
  Criteria: If she did not see the connection between the situation and her general judgment (e.g., she knew she should avoid alcohol but didn't think of the champagne at the wedding as a threat, or she didn't realize that this dinner was the moment to act), then it is ignorance of particulars (neighbor d). Stop.
  Note: This is about failing to apply the general rule to the specific case, not about forgetting the rule entirely.

  Step 5: Check for Genuine Intention Formation
  Question: Had the character genuinely formed the intention to act according to her judgment? Or was the intention only verbal or for show (without a real commitment to act)?
  Criteria: If the intention was not genuinely formed (e.g., she made a resolution but never really meant it, or she only said it to satisfy others, without the resolution having a grip on her future actions), then it is a case of never forming the intention (neighbor e). Stop.
  Note: We must see if the intention was internally committed to. Signs of a genuine intention: making plans, feeling the force of the commitment, anticipating obstacles, etc.

