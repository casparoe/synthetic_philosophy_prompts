  - In step 1, if there is a gray area between compulsion and choice (e.g., in addiction, the person may feel both that they chose and that they were driven), we note that this is contested territory.
  - In step 3, self-deception is often subtle and controversial; if it's unclear whether the character was self-deceived, we note the murkiness.
