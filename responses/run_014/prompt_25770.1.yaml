answer: |-
  Below is a structured, step-by-step procedure for evaluating whether a character's lapse qualifies as genuine **akrasia** (acting against one's own better judgment while the judgment remains intact). The procedure is designed as a series of yes/no questions, with clear exit points for classifying the lapse as one of the neighboring phenomena (a–e). It incorporates insights from **hyperbolic discounting** (the tendency to prioritize immediate rewards over larger delayed rewards as the moment of choice nears) to assess psychological plausibility. Each step includes:  
  - **Question** to ask about the character/situation.  
  - **Criteria** for a sufficient answer.  
  - **Action** based on the answer (continue, classify as a neighbor, or flag murky territory).  

  The procedure is built for usability during revision, requiring no philosophical expertise—only careful reasoning about the character's mental states. After presenting the procedure, I apply it to your two characters, explain the classifications, and outline its limitations.  

  ---

  ### **The Akrasia Evaluation Procedure**  
  *Run this during scene revision. Answer sequentially—if any step fails, classify the lapse and stop. Proceed only if the answer meets the criteria.*  

  1. **Check for Compulsion/Addiction (Neighbor a)**  
     - **Question:** At the moment of action, did the character experience the choice as *externally forced* or *beyond their control* (e.g., a physical craving, ritualistic impulse, or loss of agency)?  
     - **Criteria:** If the action felt *unchosen* (e.g., "I blacked out," "My body moved on its own"), it’s compulsion.  
     - **Action:** If YES, classify as **(a)** and STOP. If NO, proceed.  

  2. **Check for Sincere Change of Judgment (Neighbor b)**  
     - **Question:** By the time of the lapse, had the character *genuinely revised their prior judgment* (e.g., new evidence, shifted values, or a conscious rejection of their resolution)?  
     - **Criteria:** If their "better judgment" no longer feels true to them *during the act* (e.g., "This is actually fine," "I was wrong before"), it’s a value change.  
     - **Action:** If YES, classify as **(b)** and STOP. If NO, proceed.  

  3. **Check for Self-Deception About Judgment (Neighbor c)**  
     - **Question:** Was the character *dishonest with themselves* about their true judgment? (e.g., professing a resolution they never deeply endorsed, or conflating social expectations with personal values).  
     - **Criteria:** If their stated judgment was performative, weakly held, or a lie (e.g., "I thought I believed X, but really I wanted Y"), it’s self-deception.  
     - **Action:** If YES, classify as **(c)** and STOP. If NO, proceed.  

  4. **Check for Ignorance of Particulars (Neighbor d)**  
     - **Question:** Did the character *fail to recognize* that the situation applied to their resolution? (e.g., overlooking a critical detail, misreading context, or forgetting the stakes).  
     - **Criteria:** If they knew the *general rule* but didn’t connect it to *this moment* (e.g., "I didn’t realize this was the deadline"), it’s ignorance.  
     - **Action:** If YES, classify as **(d)** and STOP. If NO, proceed.  

  5. **Check for Genuine Intention Formation (Neighbor e)**  
     - **Question:** Did the character *truly commit* to their resolution earlier? (e.g., planning steps, anticipating obstacles, or emotionally investing in the outcome).  
     - **Criteria:** If the "intention" was shallow, half-hearted, or for show (e.g., "I said I’d do it to please others," "I never *meant* it"), it’s failed intention.  
     - **Action:** If YES, classify as **(e)** and STOP. If NO, proceed.  

  6. **Check for Hyperbolic Discounting (Akrasia Plausibility)**  
     - **Question:** Did the *immediate rewards* of lapsing (e.g., pleasure, relief, social ease) feel overwhelmingly vivid as the moment neared, despite the character still *rationally preferring* the delayed rewards of sticking to their resolution?  
     - **Criteria:** This step does NOT stop the procedure. Use it to:  
       - **Strengthen akrasia:** If YES, the lapse will feel *inevitable* (hyperbolic discounting explains why will falters at the brink).  
       - **Weaken akrasia:** If NO, the lapse may feel *arbitrary* (revisit prior steps—you may have misclassified).  
     - **Action:** Proceed to classification.  

  7. **Classification**  
     - If all steps 1–5 are passed (no neighbors apply), classify as **AKRASIA**.  
     - **Murky Boundary Flags:** If any step felt ambiguous (e.g., compulsion vs. choice in addiction, or intention vs. self-deception), note it—these are philosophically contested areas.  

  ---

  ### **Application to Your Characters**  
  I’ll run the procedure on your two cases, highlighting key features driving the classification.  

  #### **Case 1: The Woman Drinking Champagne at the Wedding**  
  1. **Compulsion?** NO. She "knows what she is doing," "could refuse," and acts deliberately. Not a loss of agency.  
  2. **Changed Judgment?** NO. She "has not revised her judgment that sobriety is better."  
  3. **Self-Deception?** NO. Her commitment is "genuine and deeply considered."  
  4. **Ignorance?** NO. She sees the champagne and knows she’s in a high-risk situation.  
  5. **Genuine Intention?** YES. Fourteen months of sobriety imply real commitment.  
  6. **Hyperbolic Discounting?** YES. The immediate reward (social ease, sensory pleasure) swamps the delayed reward (long-term sobriety) as the glass is poured. This makes the lapse feel *inevitable*, not arbitrary.  
  **Classification: AKRASIA**  
  - **Why:** All neighbors are ruled out. Hyperbolic discounting explains why her will falters *in the moment* despite unchanged judgment.  

  #### **Case 2: The Man Failing to Leave His Marriage**  
  1. **Compulsion?** NO. He "could" speak but chooses silence. No external force.  
  2. **Changed Judgment?** NO (but murky). He rehearses the words that morning, implying his judgment holds. His post-hoc excuse ("moment wasn’t right") is rationalization, not a true change.  
  3. **Self-Deception?** MURKY TERRITORY. He "tells himself afterward that the moment was not right" but knows this is false. This *could* indicate self-deception **(c)**, but it’s post-act. At the moment of silence, his judgment ("I should leave") still stands.  
  4. **Ignorance?** NO. He knows this dinner is the "right" moment.  
  5. **Genuine Intention?** PROBABLY NO. He "resolved to leave" and rehearses, but his inaction suggests the intention lacked "grip." Key flags:  
     - No concrete plan (just "rehearsing words").  
     - Immediate collapse when faced with action.  
     - A year of continued inaction implies the resolution was performative (e.g., to relieve guilt or mimic decisiveness).  
     **→ Classify as (e): Failed intention formation.** STOP.  
  6. *Hyperbolic Discounting skipped (stopped at Step 5).*  
  **Classification: NEIGHBOR (e) - Never formed a genuine intention.**  
  - **Why you might dislike this:** You describe it as a "paradigm case of weakness of will." But the procedure flags that his "resolution" was self-directed theater—he never committed to *acting*. Akrasia requires a *sincere* intention to act otherwise. Here, he’s closer to self-deception **(c)** or shallow intention **(e)**.  
  - **Key features:** His rationalization and long-term inaction expose the lack of real commitment. Genuine akrasia would involve a clear, actionable intention (e.g., "I’ll speak at 8 PM") that he then violates.  

  ---

  ### **What the Procedure Cannot Do**  
  While this framework clarifies key distinctions, it has inherent limitations:  

  1. **Misclassifies Mixed or Evolving Cases:**  
     - If a lapse starts as akrasia but morphs into compulsion (e.g., addiction relapse), the procedure may oversimplify.  
     - It struggles with "slow-burn" failures (e.g., the man’s year of inaction) where intentions erode gradually.  

  2. **No Purchase on Emotional Nuance:**  
     - It can’t capture visceral states (grief, rage) that warp judgment without fitting neighbors (a–e).  
     - Moral emotions (shame, guilt) may blur lines between akrasia and self-deception.  

  3. **Hyperbolic Discounting Isn’t Universal:**  
     - Some akratic acts stem from exhaustion, impulsivity, or existential dread—not reward dynamics. These may feel "unmotivated" even if genuine.  

  4. **Requires Clear Access to Mental States:**  
     - If a character’s thoughts are ambiguous (e.g., "somewhere he knew"), the procedure relies on your interpretation. It can’t resolve unreliable self-reports.  

  5. **Ignores Social/Cultural Context:**  
     - Power dynamics (e.g., spousal pressure) or cultural norms may coerce action without fitting "compulsion" (a).  

  6. **Philosophical Gray Zones Remain:**  
     - Boundaries between self-deception (c) and akrasia are hotly debated. The procedure flags this but can’t resolve it.  

  ---

  ### **Recommendations for Your Draft**  
  - **For the Woman (Akrasia):** Lean into hyperbolic discounting. Show the champagne’s sensory immediacy (bubbles, laughter) overwhelming her abstract commitment. This feels human and inevitable.  
  - **For the Man (Failed Intention):** Rewrite to clarify his mental state. If you want true akrasia:  
    - Show firmer intention (e.g., he packs a bag, researches apartments).  
    - At dinner, highlight hyperbolic discounting: immediate dread of confrontation outweighing future freedom.  
    If you keep as-is, deepen his self-deception—e.g., he constructs an identity as "the man who will leave" without ever acting.  

  This procedure helps isolate psychological coherence from plot convenience. Where it falters, trust your novelist’s intuition—the gaps it reveals are spaces for richer character work.
