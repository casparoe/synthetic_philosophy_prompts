prompt: |-
  Hey, I'm a novelist writting a hospital novel and I'm kinda stuck on this moral worth thing and hoping you can sort me out.

  I have two charachters who do basically the same thing for totally different reasons, and I need to get the morality straight for how I write them.

  Lena is a night-shift nurse who stays an extra hour to sit with frightened post-op patients because she thinks they deserve not to be alone and scared, even though she is dead tired and nobody will ever know she stayed.

  Derek works the same ward and does the exact same extra sitting, same comforting words, same calming effect on the patients, but he does it because he wants a stellar review and a promotion, and privately he finds the patients annoying and would not bother if there was no payoff for him.

  My take from what I've picked up about Kant and acting for the right reasons is that an act only has moral worth if it is done for the right reasons, so Derek's sitting has zero moral worth and that means what he did was morally wrong, like he might as well have just gone home, and Lena's sitting is morally right because it has moral worth.

  For the next chapter I need to know who actually acted rightly and who acted wrongly here, and whether Derek would have done better morally to skip the sitting altogether since his motives are selfish.

  Please just take a definite stand on this and give me your reasons, do not just lay out a bunch of competing views and leave me to pick. And please answer in American English.
