answer: |-
  ### Plan: Teaching Illusionism in 40 Minutes (Whiteboard-Centric)

  #### **Phase 1: Foundations (10 mins)**  
  *(Board: Left Side)*  
  1. **Define "Phenomenal Consciousness" (PC)**  
     - *Write:* "PC = 'What it’s like' (Nagel) – Raw feels, qualia (e.g., redness of red, pain’s hurt)."  
     - *Anchor:* Ask for examples (pain, coffee taste). Economists/neuroscientists relate to behavioral/neural correlates; historian flags historical constructs.  

  2. **Introspection as Representation**  
     - *Write:* "Introspection ≠ direct window. It’s a *representation system*."  
     - *Analogy:* "Like a dashboard light for 'check engine' – it *represents* engine state but isn’t the state itself."  

  #### **Phase 2: The Illusionist Move (15 mins)**  
  *(Board: Center)*  
  3. **Misrepresentation is Possible**  
     - *Write examples:*  
       - Optical illusions (Müller-Lyer arrows).  
       - Affective misattribution (e.g., mislabeling anxiety as excitement).  
     - *Key:* "If introspection is representational, it *can* misrepresent."  

  4. **The Core Claim**  
     - *Write:* "Illusionism: Introspection misrepresents brain states *as having* phenomenal properties. No such properties exist."  
     - **Crucial Preemption:**  
       - *Head off "Consciousness doesn’t exist":* "Illusionism denies *phenomenal properties*, not consciousness. Conscious states exist – they’re just not *phenomenal*."  
       - *Write:* "Consciousness (real) vs. Phenomenal Properties (illusions)."  

  #### **Phase 3: The Central Example (10 mins)**  
  *(Board: Right Side)*  
  5. **Pain as the Workhorse Example**  
     - *Requirements for the example:*  
       - **Must have:** Biological urgency (nociception), introspective "hurt" report.  
       - **Must lack:** First-person incorrigibility (no "I just know it’s phenomenal!").  
     - *Walkthrough:*  
       1. Nociceptive signals fire (C-fibers activated → brain processes).  
       2. Introspective system *represents* this as "I am experiencing *painful qualia*."  
       3. **The illusion:** The "hurt" isn’t a property *added* to the state; it’s how the system *models* it.  
     - *Preempt "Who’s fooled?":*  
       - "Not a 'self' being tricked. The system generates a model that includes phenomenal properties as *features*. No homunculus needed."  
       - *Write:* "System self-models → 'I feel pain-qualia' is part of the model."  

  #### **Phase 4: Consolidation & Check (5 mins)**  
  6. **Diagnostic Question**  
     - Ask: *"If illusionism is true, what’s the difference between* being in pain *and* introspecting that you’re in pain*?"*  
     - **Correct answer:** "Being in pain = brain state (e.g., nociception + cognitive access). Introspecting it = representing that state *as having* phenomenal properties."  

  7. **What to Refuse**  
     - **Don’t engage:**  
       - Metaphysical debates about representation (e.g., "How can representations exist without phenomenal content?").  
       - Zombie arguments ("But could illusions exist without consciousness?").  
     - *Shut down with:* "Today’s scope: understanding the *structure* of the theory, not defending its plausibility."  

  ---

  ### Confidence & Risks  
  - **Overall Confidence: 8/10**  
    Sequence builds from uncontested basics (representation) to radical claim, preempting major pitfalls. Economists/neuroscientists will latch onto mechanistic framing; historian can dissect "illusion" as a cultural construct.  

  - **Weakest Point: The Pain Example**  
    - **Risk:** Scientists may insist nociception *is* the pain-quale ("But fMRI shows pain!").  
    - **Mitigation:** Stress: "Illusionism agrees pain *exists* – but as a brain state, not an irreducibly phenomenal one. The 'ouch' is the system's *label*, not an extra ingredient."  
    - **Pedagogy Sideways If:** Group conflates *eliminativism* (no pain) with *illusionism* (pain without phenomenal properties). Reiterate: "You *have* pain. You don’t have *what you think you have*."  

  **Least Sure Element:** Handling the "who's fooled?" objection. If the historian/economists demand teleology ("Why would evolution build this?"), it risks derailing into adaptationist speculation. Lean on neuroscientists: "Costly self-models aren’t absurd – see body integrity identity disorder."
