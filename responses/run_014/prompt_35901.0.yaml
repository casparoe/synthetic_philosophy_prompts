prompt: |-
  A colleague of mine (call her R) is basically a group-parity person: she thinks a risk tool that flags members of different groups at different error rates is discriminatory full stop, and equal false positive rates across groups is the non-negotiable bit. Another colleague (call him C) is a calibration guy: he thinks the only thing a risk score owes you is that a "0.3" means 30% risk for everyone it's applied to, and that's what makes the tool honest; where you set the threshold is a policy choice, not part of the tool's fairness. They've been sniping at each other in seminars for two years, mostly past each other, and I've finally gotten them to agreed to sit down for an adversarial collaboration. I have to draft the joint statement they'd both actually sign, and I want your help writing it.

  Context you can use: assume a concrete setting so it doesn't stay abstract. Say a pretrial risk-assessment tool applied in two groups where re-arrest base rates differ — you pick the numbers, e.g. 0.4 vs 0.1 — and use them to show exactly where the tradeoff bites. Both of them know the standard impossibility results from around 2016-2017 showing you can't have within-group calibration and equal error rates across groups at the same time unless base rates match or prediction is perfect. They accept those proofs; no point relitigating math.

  So the document needs:

  1. A numbered section of claims both can sign — including about the math itself, about what a risk score is for, and about the fact that the choice is real and can't be dissolved by cleverness;
  2. A disagreements table where each residual disagreement is phrased so its own side would accept the wording of its view. This is the hard part — R will veto anything that describes parity as a mere "preference," and C will veto anything that describes calibration as "merely technical";
  3. The cruxes. I suspect one is whether unequal base rates in the data reflect real differences in risk or downstream injustice (and whether the tool's job includes accounting for that), and another is what "holding everyone to the same standard" even means when the groups have different distributions. But there may be others you can find.
  4. For each crux, a concrete case, dataset, or argument both would agree bears on it, with each side's prediction written down in advance — e.g. what each would expect to happen if a jurisdiction set different thresholds per group, or if base rates converged over a generation.

  Also, if you think part of their dispute is verbal (say, two senses of "fair" doing work behind the scenes), say which part and why — but don't overdo it, my honest guess is most of the dispute is genuine.

  Keep it usable: something I can hand to them and have them edit in an afternoon, not a treatise.
reasoning: |-
  We are drafting a joint statement for two colleagues, R (group-parity advocate) and C (calibration advocate). We assume a pretrial risk-assessment tool in two groups with different base rates, say Group A with base rate 40% and Group B with base rate 10%. We'll use these numbers to illustrate the tradeoff.

  The document should have:
  1. A numbered section of agreed claims.
  2. A disagreements table with each side's view worded acceptably.
  3. The cruxes: key points of disagreement and a concrete case for each with both sides' predictions.

  We note that both accept the impossibility results (e.g., from Chouldechova, Kleinberg, et al.) that show you cannot have both calibration and equal error rates (e.g., equal FPR) across groups when base rates differ and predictions are imperfect.

  Let's start with the agreed claims.

  **Section 1: Agreed Claims**

  Both R and C agree on the following:

  1.1. **Mathematical Impossibility**: When the base rates of the outcome (e.g., re-arrest) differ between two groups (e.g., Group A: 40%, Group B: 10%) and the risk assessment tool is imperfect, it is mathematically impossible for the tool to simultaneously satisfy:
      - (a) Within-group calibration (i.e., for every risk score `s`, the proportion of individuals with that score who re-offend is `s` in both groups), 
      - (b) Equal false positive rates (FPR) across groups, 
      - (c) Equal false negative rates (FNR) across groups, 
      - (d) Equal positive predictive value (PPV) across groups, and 
      - (e) Equal negative predictive value (NPV) across groups.
      Specifically, achieving both (a) and (b) [or (a) and (c), etc.] is impossible under these conditions.

  1.2. **Purpose of a Risk Score**: The primary function of a risk score is to estimate the probability of an event (e.g., re-arrest) for an individual. This estimate should be as accurate as possible to inform decisions.

  1.3. **The Tradeoff is Real**: The choice between calibration and group parity (in error rates) is a real one and cannot be avoided by technical adjustments. Any risk tool must make a tradeoff between these goals when base rates differ.

  1.4. **Policy Choice**: The setting of a threshold for decision-making (e.g., detain if risk > 0.5) is a policy choice that involves values and resource constraints. However, R and C disagree on whether the tool itself should be designed to produce equal error rates at a given threshold (R's view) or to be calibrated (C's view) regardless of the threshold.

  1.5. **Empirical Basis**: The base rates in the data are observed and may reflect a variety of factors, including underlying differences in risk and/or systemic biases in the criminal justice system. The tool's development must account for these base rates to produce accurate predictions.

  Now, the disagreements table.

  **Section 2: Disagreements**

  We present the core disagreements in a table. Each row states a point of disagreement, with two columns: one for R's view (worded as she would accept) and one for C's view (worded as he would accept).

  | Disagreement | R's View (Group-Parity) | C's View (Calibration) |
  |--------------|--------------------------|------------------------|
  | **Primary Objective of the Tool** | A risk assessment tool must not have disparate error rates across groups because such disparities perpetuate systemic injustice. Therefore, the tool must be designed to achieve equal false positive rates (and/or other error rates) across groups at the chosen threshold, even if this requires sacrificing within-group calibration. | A risk assessment tool must provide well-calibrated risk estimates for every individual, meaning that a risk score of `s` reflects the true probability `s` of the event for every group. The tool does not owe equal error rates across groups because error rates are a function of the base rates and the threshold, which is a policy choice. |
  | **Fairness Definition** | Fairness requires that members of different groups are held to the same standard of evidence, meaning that the rate of erroneous predictions (especially false positives) must be equal across groups. Without this, the tool is discriminatory. | Fairness requires that the tool is honest: it gives the same meaning to the same risk score for every individual. Without calibration, the tool misrepresents risk and leads to unjust decisions because a given score does not mean the same thing for different groups. |
  | **Role of Base Rates** | Base rate differences may themselves be the product of systemic injustice. Therefore, a tool that simply reflects these base rates without correcting for the injustice (by achieving equal error rates) compounds the injustice. | Base rate differences are a fact about the world that the tool must accurately reflect to be useful. If base rates differ, then even a perfectly calibrated tool will have different error rates across groups. It is not the tool's job to correct for historical injustice; that is the role of policy. |
  | **Threshold Setting** | Setting different thresholds for different groups to achieve equal error rates is a form of discrimination because it applies a different standard to different groups. The tool must be designed so that one threshold yields equal error rates. | Setting different thresholds for different groups is a legitimate policy option to achieve desired outcomes (e.g., equal FPR) without distorting the risk estimates. The tool should output calibrated scores, and then the threshold can be adjusted by group if necessary. |

  Now, the cruxes.

  **Section 3: Cruxes**

  We identify two main cruxes and provide a concrete case for each. For each crux, we state the point of disagreement and then the concrete case with both sides' predictions.

  **Crux 1: The Source and Legitimacy of Base Rate Differences**

  - **Disagreement**: R believes that base rate differences are largely the result of systemic injustice and that a risk tool should not perpetuate these by having different error rates. C believes that base rate differences are real and must be reflected for the tool to be accurate.

  - **Concrete Case**: Consider a jurisdiction where the base rate for re-arrest is 40% for Group A and 10% for Group B. The jurisdiction implements a risk tool that is perfectly calibrated in both groups. 

      - **R's Prediction**: R would predict that using the same threshold for both groups would lead to a much higher false positive rate (FPR) for Group B (the low base rate group) because the tool will inevitably flag a larger proportion of the low-risk group as high-risk when the threshold is set to capture the high-risk group. This would result in more individuals from Group B being unnecessarily detained, which is discriminatory. Therefore, R would argue that without adjusting the tool or the threshold, the system perpetuates the existing injustice.

      - **C's Prediction**: C would predict that using the same threshold leads to a higher FPR for Group B, but this is a direct consequence of the base rate difference and not a flaw of the tool. The tool is accurately reflecting the risk. If the jurisdiction wants to achieve equal FPR, they can set a higher threshold for Group B. This would not change the tool's calibration and would still provide honest risk estimates. The higher threshold for Group B would then reduce their FPR to match Group A, but at the cost of having a lower true positive rate (TPR) for Group B.

  **Crux 2: What it Means to Hold Everyone to the Same Standard**

  - **Disagreement**: R believes that holding everyone to the same standard means that the rate of errors (especially false positives) should be equal across groups. C believes that holding everyone to the same standard means that the risk score assigned to an individual has the same meaning (i.e., the same probability of re-arrest) regardless of group.

  - **Concrete Case**: Suppose the jurisdiction sets a threshold of 0.3 (i.e., detain if risk score >= 0.3). The tool is either:
      - **Scenario A**: Calibrated but with different FPRs (as above).
      - **Scenario B**: Modified to have equal FPRs at threshold 0.3, but now the tool is not calibrated (e.g., a score of 0.3 might mean 30% risk in Group A but 15% in Group B).

      - **R's Prediction**: In Scenario A, R would argue that the tool is discriminatory because it leads to more false positives in Group B. In Scenario B, even though the tool is not calibrated, R would argue it is fairer because the burden of false positives is equally shared. R would expect that Scenario B would be perceived as more fair by the affected communities and would reduce disparate impact.

      - **C's Prediction**: In Scenario B, C would argue that the tool is dishonest because it misrepresents risk. For an individual in Group B with a score of 0.3, the actual risk might be 15%, but the tool labels it as 30%. This could lead to inappropriate decisions: detaining someone who only has a 15% risk. C would predict that in Scenario B, the tool would be less accurate overall and might lead to a loss of trust when the miscalibration becomes evident.

  **Crux 3: Long-Term Impact of Tool Design**

  - **Disagreement**: R believes that a tool that achieves group parity will help reduce systemic disparities by avoiding compounding discrimination. C believes that a calibrated tool provides the most accurate information for policy makers to address the root causes of disparities.

  - **Concrete Case**: Suppose the jurisdiction uses the tool for 10 years. In one version, they use a calibrated tool and set different thresholds per group to achieve equal FPR. In another, they use a tool that is designed to have equal FPR at a single threshold (and is not calibrated). 

      - **R's Prediction**: If they use the calibrated tool with different thresholds, R would predict that this would be politically unsustainable and would lead to accusations of unfairness because Group B is held to a higher standard (they must have a higher score to be detained). Alternatively, if they use a single threshold with the non-calibrated tool, R would predict that the equal FPR would reduce the disparate impact on Group B and might even help close the base rate gap over time by avoiding unnecessary detentions that can lead to job loss and recidivism.

      - **C's Prediction**: C would predict that the non-calibrated tool (with equal FPR) would lead to worse decision-making because of miscalibration. For Group B, low-risk individuals would be over-scored and detained at a higher rate than their true risk warrants, which might actually increase recidivism and widen the base rate gap. The calibrated tool, even with different thresholds, would allow the jurisdiction to make the best decisions given the current base rates and might help identify effective interventions to reduce the base rate disparity.

  **Section 4: Verbal Disagreement?**

  We note that part of the disagreement might be verbal: both R and C use the word "fairness" but mean different things. For R, fairness is about the equality of outcomes (error rates). For C, fairness is about the equality of information (calibration). However, the dispute is genuine because each view leads to different tool designs and policy implications.

  **Conclusion**

  This document outlines the areas of agreement and disagreement between the two perspectives. We hope that by clarifying the cruxes and making testable predictions, we can advance the discussion.

  ---

  This draft is structured to be usable in a meeting. We have kept it concise and focused on the key points. The next step would be for R and C to review and edit.
answer: |-
  ### Joint Statement on Fairness in Risk Assessment Tools  
  **Adversarial Collaboration Between R (Group-Parity Advocate) and C (Calibration Advocate)**  
  *Context: Pretrial risk-assessment tool in two groups (Group A and Group B). Base rates for re-arrest: Group A = 40%, Group B = 10%. Threshold for "high risk" set at 0.3 (30% predicted risk). Both parties accept the 2016–2017 impossibility theorems (e.g., Kleinberg, Chouldechova).*  

  ---

  #### 1. **Agreed Claims**  
  Both R and C endorse the following statements without reservation:  

  1.1. **Mathematical Impossibility**:  
     - When base rates differ (e.g., 40% vs. 10%) and predictions are imperfect, it is mathematically impossible for a risk tool to simultaneously satisfy:  
       - (a) **Within-group calibration**: A score of \(s\) implies \(s \times 100\%\) likelihood of re-arrest for all individuals in *both* groups.  
       - (b) **Equal false positive rates (FPR)**: Equal probability of incorrectly flagging low-risk individuals as "high risk" across groups.  
     - Any tool must trade off (a) and (b). Perfect prediction or equal base rates are required to avoid this tradeoff.  

  1.2. **Purpose of the Risk Score**:  
     - The tool’s core function is to estimate an *individual’s risk* of re-arrest. Scores should inform decisions (e.g., bail/detention), but are not decisions themselves.  

  1.3. **Irreducible Tradeoff**:  
     - The calibration-vs-parity conflict cannot be resolved technically or algorithmically. It reflects a fundamental choice about fairness priorities.  

  1.4. **Thresholds as Policy Choices**:  
     - Selecting a score threshold (e.g., "detain if risk > 0.3") is a value-laden policy decision. It determines *who* is impacted and *how* errors distribute.  

  1.5. **Empirical Reality**:  
     - Observed base rates (40% vs. 10%) are real inputs. Whether they reflect "true" risk differences or systemic injustices is *interpretive*, not mathematical.  

  ---

  #### 2. **Disagreements Table**  
  *Worded as each party would self-describe their position:*  

  | Issue | R’s View (Group-Parity) | C’s View (Calibration) |
  |-------|-------------------------|------------------------|
  | **Primary Fairness Criterion** | A tool is discriminatory if it flags different groups at different error rates (e.g., FPR). Fairness *requires* equal FPR across groups, as anything less subjects marginalized groups to unjust burdens. | A tool is discriminatory if it misrepresents risk. Fairness *requires* scores be calibrated: a "0.3" must mean 30% risk for every individual, regardless of group. Unequal error rates are an inevitable consequence of differing base rates. |  
  | **Role of Thresholds** | Setting group-specific thresholds to achieve equal FPR is discriminatory: it applies double standards. The tool itself must ensure one threshold yields parity. | Setting group-specific thresholds is a legitimate policy tool to achieve societal goals (e.g., equal FPR) *without* distorting risk estimates. Calibration ensures thresholds are applied to honest inputs. |  
  | **Tool Design Priority** | Correcting disparate impact is intrinsic to the tool’s purpose. A tool that ignores parity perpetuates systemic bias. | Correcting misestimation of individual risk is intrinsic to the tool’s purpose. A tool that sacrifices calibration is scientifically dishonest. |  

  ---

  #### 3. **Cruxes of the Disagreement**  
  ##### **Crux 1: Do Unequal Base Rates Reflect Real Risk or Injustice?**  
  - **R’s Position**: Base rate differences (40% vs. 10%) likely reflect systemic injustices (e.g., policing bias, poverty). A tool *must* correct for this by equalizing error rates.  
  - **C’s Position**: Base rate differences may reflect real risk variations. The tool’s job is *prediction*, not social repair; it must report reality to avoid misinforming policy.  
  - **Concrete Test Case**:  
    - **Scenario**: Track a jurisdiction that equalizes investment in community services (e.g., job programs, rehab) across Group A and Group B for 10 years.  
    - **R’s Prediction**: Base rates converge → parity and calibration become compatible.  
    - **C’s Prediction**: Base rates may not converge (e.g., due to cultural factors) → differences remain "real," and calibration is still required.  

  ##### **Crux 2: What Does "Holding to the Same Standard" Mean?**  
  - **R’s Position**: "Same standard" means equal error rates: Group B should not bear higher costs of mistakes (e.g., unnecessary detention).  
  - **C’s Position**: "Same standard" means scores are comparable: a 0.3 implies identical risk for all, ensuring decisions are based on identical evidence.  
  - **Concrete Test Case**:  
    - **Scenario**: Jurisdiction X sets thresholds to achieve equal FPR (Group A: threshold = 0.3, Group B: threshold = 0.5).  
    - **R’s Prediction**: Public trust *increases* in Group B; disparate incarceration declines.  
    - **C’s Prediction**: Public trust *decreases* when Group B learns a "0.4" score (detained in A, released in B) has different meanings; tool seen as arbitrary.  

  ##### **Crux 3: Long-Term Impact of Tool Choice**  
  - **R’s Position**: Parity-first tools reduce systemic harm by preventing compounding discrimination.  
  - **C’s Position**: Calibration-first tools enable better policy by accurately identifying where interventions are needed.  
  - **Concrete Test Case**:  
    - **Scenario**: Deploy two tools for 5 years:  
      - *Tool R*: Enforces equal FPR (uncalibrated for Group B).  
      - *Tool C*: Calibrated, with thresholds set for equal FPR.  
    - **R’s Prediction**: Tool R reduces base rate disparity faster by avoiding over-detention in Group B.  
    - **C’s Prediction**: Tool C reduces base rates faster because accurate data targets resources effectively.  

  ---

  #### 4. **Verbal Disagreement Note**  
  A minor verbal ambiguity exists:  
  - **R** uses "fair" to mean *procedural justice* (comparable error burdens).  
  - **C** uses "fair" to mean *informational justice* (comparable risk communication).  
  This linguistic difference does not resolve the substantive dispute.  

  ---  
  ### Next Steps  
  This document is a starting point for revision. R and C will:  
  1. Edit sections for clarity (without altering agreed substance).  
  2. Propose refinements to test cases/predictions.  
  3. Identify missing cruxes by [Date].  

  *Signed,*  
  R (Group-Parity Advocate) | C (Calibration Advocate) | Facilitator  
  [Signature Lines]  

  ---  
  **Design Notes for Facilitator**:  
  - **Concreteness**: Examples use fixed base rates (40%/10%) and threshold (0.3) to force tradeoffs into sharp relief.  
  - **Balance**: Disagreements avoid value-laden terms (e.g., "mere preference," "merely technical").  
  - **Actionable**: Structured for 2-hour editing session; cruxes include testable predictions to ground debate.  
  - **Genuine Dispute**: Focuses on *why* the tradeoff exists (social repair vs. scientific integrity), not definitions.
