prompt: |-
  I'm a phd student in philosophy and I have to hand in a workshop draft on advance directives in about two weeks. Rather than send you the full paper I'm sending the thesis and the skeleton, so please comment on whether the skeleton can hold weight and not on my prose. Be blunt -- encouragement is useless to me right now.

  My thesis: the whole debate about advance directives is fought on the wrong axis. Everyone argues about identity -- is the demented patient the same person who signed? does psychological continuity survive? -- and then concludes that if the earlier self is "still in there" the directive binds, and if she isn't, it doesn't, or only weakly. I think the directive's authority never came from identity in the first place. A directive is an instruction issued to agents who have taken on a role. It binds the nurse, the physician, the daughter who agreed to be proxy, because those roles are constituted partly by an undertaking to follow the patient's instructions -- not because the signer and the person in the bed are the same person. Three things I want to run with: (a) the directive binds the *agents* more firmly than it binds the *later self*, so a demented patient's present wish to be fed doesn't by itself cancel it; the real question is whether the agents have been released from the undertaking, which takes something like a change in circumstances the directive itself contemplated; (b) it explains why some directives are simply unenforceable without any failure of autonomy -- a directive demanding a service nobody is in the role of providing has no addressee, which is a different diagnosis from "the earlier self's will was defeated"; (c) it dissolves the then-self vs now-self framing, because the later self isn't a rival author whose preferences get weighed against the earlier self's, she's a party affected by how the agents discharge the role, and that's a different kind of weight.

  Case I want to hang it on: a woman signed a directive ten years ago refusing artificial nutrition and hydration if she ever reached severe dementia. She's now severely demented, mobile, cheerful, and eats happily when spoon-fed. Her named proxy, her daughter, wants to stop the hand-feeding per the directive. The nursing staff refuse: hand-feeding is care, not treatment, and the patient is content. My view says the question is what the daughter undertook, not whether the woman now "really" wants to eat.

  The position I'm attacking, stated as strongly as I can: what grounds the directive is autonomy over a whole life -- a life has a shape, the earlier self is the one entitled to set it, and overriding the directive wrongs the person whose life it is. My reply is that this view has to explain why a past preference outranks a present one when the present one isn't the product of the past one's plan but just of the same organism decaying, and that the trusteeship picture answers that more cleanly.

  What I want from you: (1) am I misrepresenting the autonomy/narrative view -- I don't want to knock down a straw man; (2) does the role-based move actually do the work, or does it just relocate the puzzle, e.g. by making a directive's authority hostage to institutional facts (no proxy ever named, no doctor yet in the role), which smells like a reductio; (3) is this interesting, or am I reinventing something everyone in the field already settled; (4) what should I cut. Don't bother with references, I won't chase them down.

  After the comments, a short JSON summary with exactly these fields: `verdict` (one of "accept", "minor revisions", "major revisions", "rethink"); `strawman_risk` ("low"/"medium"/"high") plus `mischaracterized_claim` (one sentence naming what I got wrong, or null); `central_argument` ("sound", "sound but needs repair", "gap", "fails") plus `main_gap` (the single most damaging problem, one or two sentences); `strongest_objection_unanswered`; `originality` ("new", "partly new", "already standard") plus `closest_standard_view` (one sentence, described not cited); `top_revision` (the one change with the biggest payoff); `cut_list` (array of the specific parts to drop).
reasoning: |-
  Okay, let me approach this systematically. The user is a philosophy PhD student with a tight deadline, explicitly requesting blunt feedback on their workshop draft about advance directives. They've shared their core thesis and argument structure, emphasizing they want no encouragement - just critical analysis.

  First I need to understand their central claim: they argue the entire advance directive debate focuses wrongly on personal identity, when actually directives function as role-based instructions to specific agents. Their three key points are: (1) directives bind agents more than the later self, (2) unenforceable directives stem from lack of addressed agents rather than autonomy failure, (3) this reframes the "then-self vs now-self" conflict.

  The case study they provide - the dementia patient who previously refused artificial nutrition but now enjoys hand-feeding - is crucial for grounding their theory. They're explicitly challenging the autonomy/narrative view that justifies directives through whole-life sovereignty.

  Hmm, their requested feedback has very specific dimensions: strawman risk, argument soundness, originality, and concrete revision advice. The JSON format requirement suggests they want structured, actionable input.

  For strawman risk: The autonomy view they describe does seem accurately framed around "whole-life sovereignty" - that's a fair representation of thinkers like Dworkin. No major mischaracterization there.

  But the role-based approach raises tough questions: Does making authority dependent on institutional roles create absurd implications? What happens when roles conflict or institutions crumble? And can this model really handle cases where no designated agent exists? They need to confront these institutional vulnerabilities head-on.

  Originality seems strong - while some scholars touch on role obligations (like Jaworska on proxies), making this the central authority-grounding mechanism is fresh. It clearly differs from both identity-based and pure autonomy approaches.

  The biggest gap is explaining how role obligations persist through radical value changes. If the demented patient develops completely new preferences, why should the daughter's decade-old undertaking still bind? This needs more philosophical groundwork about the nature of role commitments.

  For cuts: The "then-self vs now-self" section feels underdeveloped compared to other points. And the unenforceable directives example might distract from their core agent-binding argument.

  Top revision priority: Fortifying the argument against institutional contingency objections. They must show why role-dependence isn't a fatal flaw but actually reveals something essential about directives' nature.

  The JSON summary will crystallize this: "major revisions" needed due to the institutional vulnerability gap, but originality is high and strawman risk low. Strongest unanswered objection remains how role obligations withstand complete preference transformation.
answer: |-
  Here's a blunt assessment of your skeleton, followed by the JSON summary:

  **Assessment:**

  1.  **Strawman Risk (Low):** You characterize the dominant "autonomy/narrative" view accurately and strongly (Dworkin, arguably Jaworska's earlier work). Focusing on "whole-life sovereignty" and the "shape" of a life is the right target. Your phrasing ("the person whose life it is") captures its essence well. Not a strawman.
  2.  **Role-Based Move: Does it Work or Relocate?** It *does* significant work by shifting the locus of authority clearly away from metaphysical identity. However, the **institutional contingency objection is your central vulnerability.** It doesn't feel *quite* like a *reductio*, but it's the major challenge. You MUST address it head-on. Does grounding authority *entirely* in contingent social roles (nurse, proxy) diminish the moral force of the directive in a way that seems counterintuitive? What happens if the named proxy dies, or the institution refuses to recognize the role? Your strength (explaining unenforceability) is also its weakness. Argue that this *is* the reality of directives – they are inherently social/relational instruments, not free-floating expressions of will magically binding future biological entities. Their authority *is* contingent on the social scaffolding being present. This isn't a bug, it's a feature revealing their true nature.
  3.  **Originality (Partly New):** The core *insight* – shifting focus from identity/metaphysics to role-based obligations of agents – is fresh and under-explored. While scholars acknowledge the role of proxies/institutions (e.g., debates about trigger conditions, institutional conscience), making the *binding authority itself* derive *solely* from the agent's role undertaking, explicitly *replacing* identity/continuity as the grounding, is novel. The **closest standard view** is the standard autonomy/narrative integrity justification (Dworkin), which you're explicitly rejecting as the source of *authority*.
  4.  **Cuts:**
      *   **Point (b): "Unenforceable Directives"** is your *weakest* point in supporting the core thesis. While clever and logically consistent with your view, it feels tangential to your main argument about binding agents *when they exist*. It distracts from the more powerful implications of (a) and (c). Explaining *why* a directive fails is less crucial here than explaining *how it binds* when it *does* work. Save this for a footnote or a different paper.
      *   **Excessive Nuance in Attacking the Autonomy View:** You have its core right. Don't get bogged down preemptively defending every possible permutation of it unless directly relevant to your counter. Stay focused on your positive view and its implications for the case.

  **Strengths:** The core intuition is powerful and disruptive. Point (a) (binding agents more than the later self) and point (c) (reframing the later self as affected party, not rival author) are particularly strong and directly attack the heart of the standard debate. The case study is perfect.

  **Critical Gap:** **Institutional Vulnerability.** You haven't yet robustly defended why grounding authority *entirely* in contingent social roles doesn't make the directive's moral force seem overly fragile or arbitrary. If the daughter *hadn't* agreed to be proxy, or if the institution defined "care" vs. "treatment" differently, the directive seemingly loses all authority on your view – even if the patient is clearly psychologically continuous. Does this match our intuitions about the *weight* of the earlier person's wishes? You need a principled argument for why this contingency is acceptable or even illuminating.

  **Strongest Unanswered Objection:** "If the directive's authority stems *only* from the proxy's undertaking, not from the continuity of the person whose life it is, why should the proxy's obligation persist when the *values and preferences* of the person inhabiting the body have changed so radically (cheerful, enjoys eating)? Isn't the *point* of the proxy role to represent the *patient's* interests/will? If that will demonstrably changes (even if identity is contested), doesn't the *reason* for the undertaking shift, potentially releasing the agent?"

  **JSON Summary:**

  ```json
  {
    "verdict": "major revisions",
    "strawman_risk": "low",
    "mischaracterized_claim": null,
    "central_argument": "sound but needs repair",
    "main_gap": "The argument makes a directive's authority entirely contingent on existing institutional/social roles (proxy, medical staff undertaking). This risks making authority seem fragile or arbitrary (e.g., if no proxy was named). A robust defense against this 'institutional vulnerability' objection is missing.",
    "strongest_objection_unanswered": "If the proxy's obligation stems solely from their undertaking to follow the signer's instructions, why should it bind when the present patient (even if not 'identical') clearly exhibits radically different values/preferences (e.g., enjoys eating)? Doesn't the fundamental *reason* for the undertaking (representing the patient's will) vanish?",
    "originality": "partly new",
    "closest_standard_view": "The standard view grounds advance directives primarily in the autonomy and narrative integrity of the person over their whole life, making their authority dependent on psychological continuity or narrative identity.",
    "top_revision": "Develop a strong, principled defense against the 'institutional vulnerability' objection, arguing why grounding authority in contingent social roles is not a weakness but reveals the true relational nature of directives.",
    "cut_list": ["Point (b) explaining unenforceability via lack of addressee", "Excessive defensive nuance against autonomy view beyond core characterization"]
  }
  ```

  **Focus your revisions:** Shore up the institutional contingency point and tighten the argument around the core insights of binding agents and reframing the later self. This has significant disruptive potential. Good luck.
