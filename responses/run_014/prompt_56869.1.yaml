prompt: |-
  I don't have any philosophy training — business degree, and now I run the people-and-ops side of a fully remote company of about 300 — but I've been reading around this stuff on my own for a couple of months because we're about to try to kill a norm I hate. On a flight last week I got through a chapter of one of those pop social-science books a behavioural economist writes, and it spent several pages on a philosopher named David Lewis and his 1969 book *Convention*. I copied down the part that mattered, roughly word for word from my notes:

  "A convention is a stable regularity in how a group behaves that everyone in the group would be better off keeping — driving on the same side of the road, shaking with the right hand, saying your name when you answer the phone. Lewis gave a short list of conditions for when a regularity counts as one: everyone does it, everyone expects everyone else to do it, everyone wants everyone else to do it, and everyone knows all of this and knows that everyone knows it. That last layer is called common knowledge and it's the whole engine of the theory. The other big idea is that conventions are arbitrary — left is as good as right — so there's no principled way to choose between them; whichever one gets going first wins, and after that nobody has any reason to change. Lewis was arguing against people who thought rules had to come from an agreement: he showed that a convention is really just a tacit agreement that's been around so long everyone forgot it was ever made. And because common knowledge does all the work, the practical payoff is enormous — a public announcement from someone credible literally manufactures common knowledge, and a convention along with it. That's also why norms evolve: people copy whoever seems to be doing well. So you change a culture by changing what gets announced, not by training people or appealing to their values."

  Some of that felt too smooth, but I can't tell which parts. My sister, who's a lawyer, said "an email doesn't make a norm, that's ridiculous," but she couldn't say why, and I half want the chapter to be right because it would make my job easy. So: can you go through that passage claim by claim and tell me what someone who actually works on Lewis would accept, what's a fair simplification for a general reader, what's subtly off, and what's just wrong? I'm especially suspicious of four spots — the "tacit agreement everyone forgot" line, the slide from "arbitrary" to "nobody has any reason to change," the idea that an announcement manufactures a convention, and the copying-whoever's-winning bit, which I suspect belongs to a different tradition of thinking about norms entirely and got stapled onto Lewis. I'd also like to know whether the conditions he actually gave are the ones the book lists, since I get the feeling "everyone wants everyone else to do it" is doing a lot of dishonest work. Then tell me whether the practical upshot survives the correction, and run the corrected version on our case: when a customer escalation lands in our shared channel, whoever sees it first quietly tags the most junior support person on shift, and it's now simply expected — the juniors resent it, the seniors don't notice it's happening, and nobody ever decided it. Leadership plans to announce on Monday that escalations belong to the senior on call that week, and they think the announcement plus everyone knowing everyone heard it is the whole job. Does Lewis's framework, properly understood, say that will take? If not, what has to be true for it to take, and is our thing even a Lewis-style convention at all given that some people clearly lose out under the current arrangement? No reading list, please — I can't chase down sources, I just want the audit and what to actually do.
reasoning: |-
  Okay, let's tackle this step by step. The user is a business professional running people operations at a remote company of 300, trying to change a problematic norm. They read about David Lewis's convention theory from a pop behavioral economics book and want to verify its accuracy, especially regarding four specific points they find suspicious. They also need practical advice on whether a leadership announcement will effectively change their support escalation convention.

  First, I need to recall Lewis's actual framework from Convention (1969). Lewis defines conventions as solutions to coordination problems where the pattern is arbitrary, self-perpetuating through common knowledge and mutual expectations. The user's quoted passage oversimplifies in places - particularly the "tacit agreement" phrasing, the universality of "everyone wants" it, and the power of announcements.

  The user's four suspicion points are astute:
  1) "Tacit agreement everyone forgot" misrepresents Lewis - conventions emerge from repeated interactions, not forgotten agreements. 
  2) "Arbitrary to nobody has reason to change" is mostly correct but ignores transition costs and fairness concerns. 
  3) Announcements alone don't create conventions - they need credible commitment and consistent follow-through. 
  4) The "copying winners" idea comes more from social learning theory than Lewis.

  For their specific case: the current junior-tagging practice isn't a true Lewis convention because it's not Pareto-optimal (juniors lose out). Leadership's announcement might work if: the new rule solves a recognized coordination problem, leadership consistently enforces it, and they address the power imbalance that made the old pattern stable. 

  Practical steps for the user: 
  - Frame the change as solving inefficiency (e.g., seniors better equipped for escalations) 
  - Have leaders model the new behavior immediately after announcement 
  - Monitor compliance and gently correct deviations 
  - Consider compensating juniors for taking on less complex work during transition

  The core insight remains valuable: common knowledge reduces uncertainty. But the book oversold announcements as a silver bullet - sustainable change requires aligning incentives and consistent signals.
answer: |-
  Here's a claim-by-claim audit of the passage, followed by a practical analysis of your situation, corrected using Lewis's actual framework:

  ### Lewis's Framework (Corrected)
  1.  **"A convention is a stable regularity in behavior..."**: **Mostly Correct.** Lewis focused on *coordination problems*: situations where individuals have a shared interest in coordinating but multiple equally good ways to do it (like driving sides).
  2.  **Conditions for Convention**: **Oversimplified/Misleading.**
      *   *"Everyone does it"*: Correct. It must be a widespread behavioral regularity.
      *   *"Everyone expects everyone else to do it"*: **Crucially Correct.** Mutual expectations are foundational.
      *   ***"Everyone wants everyone else to do it"*: Misleading/Incomplete.** This is the biggest flaw. Lewis's condition is **preferential**, not necessarily universal desire: Individuals *prefer* to conform *if* they expect others to conform. It's conditional preference based on expectations. Crucially, this preference arises *because* conformity solves a coordination problem where *all* benefit *compared to no coordination*. It doesn't mean everyone *unconditionally* "wants" it or that it's optimal for everyone individually, just that it's better than the chaos of non-coordination. The "everyone wants" phrasing hides the conditional nature and the baseline comparison.
      *   *"Common Knowledge"*: **Fundamentally Correct.** This is Lewis's key innovation. Everyone knows R occurs, knows others know, knows others know they know, etc. This massively reduces uncertainty.
  3.  **"Conventions are arbitrary..."**: **Correct (with nuance).** For driving sides, left/right is arbitrary. The *solution* is arbitrary, but the *need for coordination* is not. "Arbitrary" means multiple solutions could have worked equally well *at the outset*.
  4.  **"...so there's no principled way to choose..."**: **Correct (initially).** At the point of emergence, no strong reason favors one solution over another *if both solve the coordination problem equally well*.
  5.  **"...whichever one gets going first wins..."**: **Correct (Path Dependence).** This is the "coordination equilibrium" – once established, the cost of switching individually is high (expecting others won't switch).
  6.  **"...nobody has any reason to change."**: **Overstated.** Individuals have *no incentive to unilaterally deviate* once the convention is established (it would be worse for them). But there *can* be strong collective reasons to change (e.g., a better solution is discovered, the context changes, the convention is unfair). Lewis acknowledges conventions *can* change, though it's hard.
  7.  **"Tacit agreement everyone forgot..."**: **Misleading/Metaphorical.** Lewis explicitly *rejected* this. Conventions emerge from recurring coordination problems and precedent, *not* from an agreement (tacit or explicit). Behavior converges because it's the best response to expected behavior. It's evolutionary, not contractual. Calling it a "forgotten agreement" is poetic but inaccurate.
  8.  **"Public announcement manufactures common knowledge (and thus convention)"**: **Overstated.**
      *   *Common Knowledge?* A credible, public announcement *can* create common knowledge *of the announcement/rules*.
      *   *Convention?* **No.** An announcement *cannot instantly create a convention* in Lewis's sense. It can *initiate the process* or *change expectations*, but a convention requires a *stable behavioral regularity* driven by *conditional preferences* based on *mutual expectations*. An announcement sets an expectation; it doesn't automatically create the behavior or the deep-seated preference structure. It's a powerful tool to *start* the shift, not the finish line.
  9.  **"Norms evolve: people copy whoever seems to be doing well"**: **Not Lewis / Misattributed.** This sounds like social learning theory or network effects (e.g., Robert Axelrod, Peyton Young). Lewis focused on coordination equilibria sustained by mutual expectations and conditional preferences. While observing success *might* influence *which* convention emerges or shifts, it's not central to Lewis's core mechanism. Copying "winners" is a different engine.

  ### Practical Upshot (Survives, with Corrections)
  *   **Yes:** Common knowledge is powerful for reducing uncertainty and aligning expectations.
  *   **Yes:** Public announcements by credible sources are potent tools for *establishing common knowledge of a new rule/expectation*, which is a crucial first step in changing conventions.
  *   **No:** Announcements alone do **not** instantly create conventions. They create *expectations*. The convention only forms if:
      1.  People start behaving according to the announcement.
      2.  People *expect* others to behave that way.
      3.  People *prefer* to behave that way *conditional* on expecting others to do so (because it solves a coordination problem better than alternatives).
      4.  This behavior becomes a stable regularity.
  *   **Crucial:** The new rule must genuinely address a coordination problem where mutual conformity is beneficial *compared to the current state or chaos*. If it doesn't, the conditional preference won't form.

  ### Your Case: The Junior-Tagging "Convention"
  1.  **Is it a Lewis Convention?** **Probably Not.**
      *   *Regularity:* Yes, it happens.
      *   *Expectations:* Yes, people expect the junior to be tagged.
      *   *Common Knowledge:* Likely yes, people know it's happening and know others know.
      *   ***Conditional Preference*: The Fatal Flaw.** Lewis requires that individuals *prefer* to conform *given expectations of others' conformity*, because *all are better off coordinating this way than not coordinating at all*. Here, **juniors are clearly worse off.** They resent it. This suggests the current pattern does **not** solve a coordination problem in a way beneficial to *all* participants relative to no coordination. It's likely a *dysfunctional norm* or even an *exploitative equilibrium* sustained by power imbalance or lack of alternatives, not a mutually beneficial coordination solution. Seniors benefit (offload work), juniors lose. Lewis conventions are about *mutual* gains from coordination.

  ### Leadership's Plan: Announcement + Common Knowledge
  *   **Lewis (Corrected) Says:** This is **necessary but insufficient.**
  *   **Why it likely won't "take" instantly as a convention:**
      *   **Lack of Conditional Preference:** Why would seniors *prefer* to take the escalation themselves *just because they expect others to do so*? The announcement states the rule, but the *incentive* for seniors to comply (conditional on expecting others to comply) might be weak. Currently, ignoring the tagging is easier for them. Juniors might *want* the new rule, but their preference alone doesn't create a convention – the key actors (seniors) need the conditional preference too.
      *   **No Underlying Coordination Problem Solved (For Seniors):** The current state (juniors get tagged) might be *preferred* by seniors. The new rule imposes a cost (more work) without solving a problem *for them*. The announcement doesn't change this calculus.
      *   **Behavioral Regularity Doesn't Exist Yet:** The announcement creates an expectation, not behavior. Someone needs to *behave* first, consistently.

  ### What Has to Be True for the New Rule to Become a Convention
  1.  **Genuine Coordination Problem:** The new rule must be perceived as solving a problem *better for the group* than the old way (e.g., faster resolution, better customer experience, fairer workload, reduced junior burnout leading to better team function). This benefit needs to outweigh the cost *to seniors* of taking on the work.
  2.  **Credible Commitment & Consistency:** Leadership must consistently model and enforce the rule. If the first escalation after the announcement still gets dumped on a junior without consequence, expectations (and thus the potential convention) collapse.
  3.  **Building Mutual Expectations:** Early adopters (especially influential seniors) need to visibly follow the rule. This signals to others that "this is what we do now," reinforcing the expectation that *others* will conform.
  4.  **Developing Conditional Preferences:** Over time, as the behavior becomes regular and expected, individuals (especially seniors) must develop the preference: "Given that I expect others (seniors) to handle their on-call escalations, I prefer to handle mine too (because it's fair, expected, avoids conflict/logjam, or delivers the group benefit)." Juniors will obviously prefer it.
  5.  **Addressing Power Imbalance:** The old norm persisted because seniors could impose it. The new rule needs mechanisms (even informal peer pressure or leadership monitoring) to prevent free-riding by seniors.

  ### What Leadership Should Actually Do (Beyond the Announcement)
  1.  **Frame it as Solving a Problem:** Explicitly link the new rule to a clear group benefit (e.g., "To ensure our highest-value customers get the fastest, most expert resolution, escalations will be handled by the senior on-call. This also ensures a fairer distribution of critical learning opportunities."). Make the coordination benefit clear.
  2.  **Model Relentlessly:** Leaders and respected seniors must be the *first* and *most visible* adherents to the new rule. Publicly praise early correct behavior.
  3.  **Enforce Gently but Firmly:** If someone reverts to tagging a junior, a leader/senior should immediately step in: "Thanks for flagging this, [Junior]. I see [Senior On-Call] is available, I'll tag them to take this as per our new process." No blame, just correction.
  4.  **Monitor & Adapt:** Track compliance in the channel. If it's not sticking, diagnose why (Is the senior overloaded? Is the benefit unclear? Is enforcement lacking?) and adapt.
  5.  **Acknowledge the Shift:** Recognize that changing behavior takes time and consistent reinforcement. The announcement is the start signal, not the finish line.

  **Conclusion:** The pop-sci explanation smoothed over critical nuances (conditional preference vs. universal desire, emergence vs. forgotten agreement, announcement as starter vs. finisher) and stapled on unrelated ideas (copying winners). Lewis's core insight – that conventions are behavioral regularities sustained by mutual expectations, conditional preferences, and common knowledge solving coordination problems – remains powerful. **For your situation:** The announcement creates common knowledge of the *new rule*, which is essential. However, transforming this into a genuine convention requires demonstrating the new rule solves a coordination problem *better*, securing buy-in (especially from seniors), ensuring consistent behavior to build mutual expectations, and fostering the conditional preference to conform. Your current junior-tagging pattern isn't a true Lewis convention because it lacks mutual benefit. Success hinges on leadership's sustained commitment beyond Monday's announcement.
