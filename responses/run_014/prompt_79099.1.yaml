prompt: |-
  I have been helping draft a collections policy for the small archive at the college where I work, and the more I look at what we already do, the less I understand what we think we are doing. Concretely: we hold the papers of a few dozen administrators, trustees, and prominent alumni, a number of which arrived with donor agreements sealing portions of them for twenty or twenty-five years; we work from a records-retention schedule under which most routine administrative files are destroyed after a set period and only a small remainder is flagged for permanent retention, with the destruction itself logged only as a note at the level of the whole series, so that no one can later tell what was in the files; our mission statement says we preserve the documentary record of the institution and make it available without taking sides in the disputes the records document; and we have a standing rule that we do not create records, we only acquire them — even though we also run an oral history program interviewing residents of the neighborhoods the college displaced in the 1960s and 1970s, and have begun digitizing the records of a few community organizations that keep the originals and let us host the scans. Meanwhile the same policy document complains that the collection is silent about the people most affected by the institution's decisions, and proposes outreach as the remedy.

  What I want from you is not a defense or an indictment of any of this, but the theory it presupposes. Taking these practices together, what must we believe about what makes a record worth keeping — is significance a property of the document itself, or of some relation to possible future users, or a byproduct of who happened to hold power and who happened to be written down? What must we believe about the archivist — a neutral conduit through which material passes, or a participant in the events being documented? What does the retention schedule assume about the value of the ordinary and the bureaucratic relative to the exceptional and the prominent? And what picture of the public, and of its claim on the record, is built into a mandate to preserve the record for accountability while sealing a donor's papers for a quarter century?

  Then separate what is genuinely forced on us from what is merely compatible. Which parts of this policy would be equally licensed by a rival account of what archives are for — say, a privacy-based account of donor restrictions, a property-based one, or a purely pragmatic "sealed is better than lost" one — and where do the pieces actually conflict rather than merely sit uneasily together? Finally, suppose we replaced the presupposed view with something like its opposite: that the archive's job is to document the exercise of power over people rather than to keep the papers of the powerful, and that a gap in the record is itself something to be recorded, dated, and explained. Tell me what would have to change in our acquisitions, our retention schedule, our access rules, and our finding aids, and which of those changes would be genuine implications of the new view rather than just things that would look nicer.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're working on a collections policy for their college archive and are confused about the underlying theory behind their current practices. They listed several practices: prioritizing papers of administrators and alumni with sealed portions, following a retention schedule that destroys routine files without detailed logs, claiming neutrality, not creating records despite running an oral history program, and noting a silence in the collection about affected communities while proposing outreach.

  First, I need to identify the presupposed theory. The user wants to know what beliefs about records, archivists, value, and the public are embedded in these practices. They also want to differentiate between what's necessary and what's merely compatible, and then explore an alternative view focused on power dynamics.

  Looking at the practices, the emphasis on administrators' papers suggests that significance is tied to the creator's status. Sealed agreements imply that donor control is paramount, prioritizing their wishes over accessibility. The retention schedule's destruction of routine files assumes that administrative records have no future value unless flagged as exceptional. The neutrality stance positions the archivist as passive, yet the oral history program contradicts this by actively creating records. This conflict shows tension between stated principles and actual practices.

  The user mentions the archive's silence about displaced communities, highlighting a gap. The proposed outreach as a solution suggests that the current theory sees archives as reactive, acquiring what's offered rather than actively documenting. The sealed papers versus accountability mandate creates a paradox: preserving for accountability but restricting access for decades.

  Next, separating what's forced from what's compatible. Sealed agreements could stem from privacy, property rights, or pragmatism. However, the combination with the mission statement creates conflict. The retention schedule's lack of detailed logs isn't necessary; it's a choice that erases context. The "no creating records" rule is contradicted by oral histories, showing incompatibility.

  For the alternative theory—documenting power and gaps—changes would be needed. Acquisitions would target marginalized communities, retention would keep routine files to show bureaucratic processes, access rules would minimize restrictions, and finding aids would highlight gaps. Genuine implications include mandatory documentation of destruction, proactive collection, and renegotiating donor agreements. Changes like detailed destruction logs are necessary, not just aesthetic.

  I should ensure the analysis addresses each part of the query: presupposed theory, compatibility, and implications of the alternative. Highlighting contradictions, like neutrality vs. active oral history, is key. Also, clarifying which changes are essential under the new theory versus optional improvements helps the user prioritize actions. The user's deeper need might be to align practices with a more ethical, accountable archive that addresses historical injustices, moving from passive to active documentation.
answer: |-
  Your archive's current practices reveal a deeply embedded, largely unarticulated archival theory – one rooted in traditional institutional and custodial paradigms. Let's dissect the presuppositions, tensions, and potential for transformation:

  **The Presupposed Theory (The Institutional-Custodial Model):**

  1.  **What makes a record worth keeping?**
      *   **Significance as Institutional Provenance:** Value is intrinsically linked to the *creator's formal role within or prominence related to the institution*. Papers of administrators, trustees, and prominent alumni are deemed significant *because of who created them*. Significance is hierarchical and positional.
      *   **Significance as Exceptionality:** Routine administrative activity (the "ordinary") is presumed transient and lacking enduring value. Only the "exceptional" outcomes, summaries, or decisions flagged for retention are deemed worthy. The *process* and context (the routine files) are disposable.
      *   **Significance as Tangible Custody:** Value is tied to physical (or now, digital) *custody* of the original document created by the official actor. The archive preserves *what it physically holds*, not the narrative or context the records should tell.
      *   **Significance as Donor Control:** Value is also conferred (or restricted) by the donor's wishes (sealing agreements). The donor's perspective on significance and access often supersedes other potential values.

  2.  **What is the role of the archivist?**
      *   **Neutral Custodian/Conduit:** The archivist is primarily a passive recipient and preserver of records created by others. "We do not create records" enshrines this passivity. The ideal is objectivity: acquiring and providing access without interpretation or intervention in the record's meaning or creation. Neutrality is seen as residing in non-creation and non-interpretation.
      *   **Institutional Servant:** The archivist's primary loyalty is to the institution's administrative legacy and the wishes of its prominent figures (as donors). The records retention schedule serves institutional efficiency and legal compliance first, historical value second.

  3.  **Value of the Ordinary vs. Exceptional:**
      *   The retention schedule assumes the **ordinary bureaucratic record is ephemeral**, valuable only for immediate operational or legal purposes. Its destruction, logged only at the series level, presumes future researchers won't need (or can't reconstruct) the granular context of *how* decisions were made, the alternatives considered, or the daily realities that shaped outcomes. Only the **exceptional result (final report, policy, major event file)** is deemed worthy of permanent retention. This privileges outcome over process and reinforces the focus on powerholders.

  4.  **Picture of the Public & Accountability:**
      *   **Deferred Public & Accountability:** The mandate for accountability exists in theory but is severely compromised in practice. Sealing papers for 25+ years assumes accountability can wait a generation or more, effectively shielding current actors and recent history from scrutiny. It prioritizes donor privacy/control (or institutional comfort) over contemporary public access and accountability.
      *   **The Public as Passive Researcher:** The public is envisioned primarily as future researchers seeking information *about* the institution and its leaders, not as communities *impacted* by the institution demanding immediate accountability or recognition. Outreach is an *add-on* to fill silences, not a core function driven by a right to know.

  **Forced vs. Compatible:**

  *   **Compatible (Could fit multiple justifications):**
      *   **Sealed Agreements:** Could be justified by donor privacy concerns, property rights (donor feels they "own" the access rights), or pragmatism ("better sealed than not donated"). *However*, the *length* (20-25 years) and combination with a mission for institutional accountability starts to create tension.
      *   **Records Retention Schedule (Basic Concept):** The need to dispose of some records for space/management is pragmatic. *However*, the *criteria* for retention/destruction and the *level of documentation* upon destruction are choices reflecting the underlying theory.
      *   **"Do Not Create Records" (as a strict rule):** Compatible with strict custodial neutrality. But its *violation* by the oral history program shows it's not actually a core, inviolable principle in practice, just a stated preference easily overridden.

  *   **Genuinely Forced (Implied by the Specific Practices & Combination):**
      *   **The Hierarchy of Creators:** The focus *exclusively* on administrators, trustees, and prominent alumni presupposes that *only* these voices constitute the institution's "documentary record." This excludes other stakeholders (students, staff, faculty beyond leadership, affected communities) by design.
      *   **Destruction Logging at Series Level:** Actively choosing *not* to document the contents of destroyed files presupposes that the specific context lost is irrelevant. It implies future researchers only need to know *that* routine destruction occurred, not *what* specifically was lost. This erases evidence of the ordinary.
      *   **Neutrality as Passivity:** The stated rule against creation *combined with* the mission of neutrality presupposes that active documentation (like oral history) inherently compromises neutrality. This forces a contradiction when the archive *does* create records.
      *   **Accountability Mandate vs. Sealed Papers:** This combination forces an inherent conflict: how can you provide accountability for institutional actions if the records of key decision-makers are inaccessible for decades? It presupposes accountability is secondary to donor relations/institutional comfort and can be indefinitely postponed.
      *   **Silence as Problem, Outreach as Solution (within current model):** This presupposes the archive's core collection *should* reflect impacted communities but sees the solution as reactive acquisition *if offered*, not proactive creation or challenging collection boundaries. The silence itself isn't documented as a record of exclusion.

  **The Alternative Theory: Documenting Power & Gaps (The Critical/Active Model)**

  Core Tenet: The archive's primary role is to document, analyze, and make accessible evidence of how power is exercised within and by the institution, particularly its impact on marginalized groups. Gaps and silences are not just absences to be filled later; they are *evidence* of exclusion and power dynamics that must be actively recorded and contextualized.

  **What Would Have to Change (Genuine Implications in Bold):**

  1.  **Acquisitions:**
      *   *Change:* Aggressively target records of groups impacted by the institution (e.g., displaced residents, student activist groups, staff unions, marginalized faculty), community organizations interacting with/affected by the college, and records documenting institutional processes *from below*. Prioritize acquiring records that counterbalance the official narrative. **Renegotiate future donor agreements to minimize or eliminate sealing periods for materials related to institutional decision-making impacting others.**
      *   *Genuine Implication:* **Acquisition is driven by a *critical assessment of power imbalances* in the existing record, not just by creator status or donation offers. Donor restrictions on materials documenting institutional power over others become ethically problematic and are actively challenged.**

  2.  **Retention Schedule:**
      *   *Change:* Radically reassess criteria. **Routine administrative files become *highly valuable* as evidence of bureaucratic process, systemic bias, daily impacts, and the context for exceptional decisions.** Destruction criteria shift towards privacy/legal risks, not perceived historical insignificance of the mundane. **Implement detailed documentation of destruction (e.g., folder-level logs or sampling) to record *what* context is being lost and why.**
      *   *Genuine Implication:* **The schedule explicitly values the "ordinary" as evidence of power structures. Destruction logging becomes an *archival act* documenting systemic erasure, not just administrative housekeeping.**

  3.  **Access Rules:**
      *   *Change:* **Severely limit or eliminate sealing periods for records related to institutional actions impacting communities or individuals.** Advocate for open access as the norm for accountability. Justify restrictions strictly on privacy/legal grounds, not donor preference for institutional shielding. Develop clear policies for providing access to impacted communities.
      *   *Genuine Implication:* **Access is framed as a right for accountability, especially for affected groups. Donor control over access to records of institutional power is fundamentally challenged as incompatible with the archive's mission.**

  4.  **Finding Aids & Description:**
      *   *Change:* **Finding aids explicitly identify and document *gaps and silences*.** Who is missing? Why might they be missing? When were records destroyed? Link collections documenting power (official records) with collections documenting impact/resistance (community orgs, oral histories). Contextualize collections critically within power dynamics and institutional history (e.g., "These trustee papers document decisions leading to the displacement discussed in the XYZ Oral History Collection and the Neighborhood Association Records. Routine departmental files related to this acquisition were destroyed in 2010 under schedule ABC").
      *   *Genuine Implication:* **Description moves beyond neutral inventory to *critical interpretation*. The finding aid becomes a tool for exposing power structures and the archive's own role in perpetuating or mitigating silences. Documenting destruction and gaps is mandatory.**

  5.  **Role of the Archivist & "Creating Records":**
      *   *Change:* Embrace the archivist as an **active documenter and interpreter**. The oral history program is not an exception but a *core model*. Actively create records (oral histories, documentation projects with communities) to fill critical gaps *and* to document the *experience* of power and exclusion. **Formally document the *reasons* for gaps (e.g., "No records from the affected Tenants' Association prior to 1975 are known to exist, likely due to lack of outreach/institutional prioritization at the time").**
      *   *Genuine Implication:* **Neutrality is redefined as *transparency* and *rigor* in documenting power and context, not passivity. Actively creating records to counter silences becomes a fundamental duty. The archivist is a participant-observer in the documentation of power dynamics.**

  **What Changes are Genuine Implications vs. "Nicer":**

  *   **Genuine Implications (Forced by the New Theory):**
      *   **Mandatory documentation of gaps/destruction context in finding aids.**
      *   **Proactive, critical targeting of acquisitions based on power analysis (not just accepting donations).**
      *   **Actively challenging donor restrictions on records of institutional power.**
      *   **Valuing and retaining routine administrative records as evidence of process/system.**
      *   **Reconceiving oral history/active documentation as a *core* function, not an exception violating "neutrality."**
      *   **Explicitly linking powerholders' records with records of impact/resistance in description.**
      *   **Prioritizing access for accountability over donor comfort/institutional shielding.**

  *   **"Nicer" Changes (Compatible, but not strictly forced):**
      *   More detailed destruction logs (could be done under old model for better management).
      *   Increased outreach (already proposed, though the *purpose* shifts under the new model).
      *   Digitizing community records (a service, but doesn't challenge core theory unless integrated critically).
      *   Improving general description quality.

  **In essence, shifting to document power requires moving from passive custodian of institutional legacy to active, critical agent documenting the *impact* of the institution, embracing intervention to counter silences, and fundamentally challenging practices that prioritize the comfort and control of the powerful over accountability and the representation of the marginalized.** The archive becomes a site for critical engagement with institutional history, not just its repository.
