answer: |-
  Your framework is robust, but the Colston case exposes tensions and nuances requiring refinement. Let's test each claim rigorously:

  **1. Act/Object Distinction ("No Neutral Persistence"):**  
  - **Bites:** This holds powerfully in Bristol. The 125-year display *was* tacit renewal, amplified by the failed 2018 plaque reform. Council inaction perpetuated an honorific narrative.  
  - **Collapse Risk?** Not fully, but nuance is needed. "Toleration ≠ affirmation" arguments underestimate institutional complicity. Public monuments require maintenance and legal protection; their endurance *is* state-sanctioned. However, *individual* citizens may dissent without rejecting the settlement. The framework must acknowledge *institutional* re-dedication through neglect.  
  - **Verdict:** Strengthened, but specify *whose* "renewal" matters (state vs. citizen). Institutional inaction = endorsement.

  **2. Modes of Display & Museum Conversion:**  
  - **Honorific to Documentary/Admonitory?** The M Shed display (graffitied, prone) is a masterclass in hybrid conversion:  
    - *Documentary:* Graffiti and posture preserve the protest as historical event.  
    - *Admonitory:* Horizontal position enacts symbolic toppling; spray-paint ("murderer") directly indicts.  
  - **"Having it Both Ways"?** Partially. The museum context *defuses* traditional honorific power but creates new tensions: aestheticizing protest, potentially sanitizing violence. Yet the visceral disrespect (prone, defaced) overwhelms any residual reverence.  
  - **Settled or Open?** It settles Colston's *demotion* but keeps debate alive—precisely by making the statue a contested artifact. The framework needs a fourth mode: **provocative display** (sparking dialogue through discomfort).

  **3. Standing:**  
  - **The Trial's Impact:** The jury acquittal was a seismic shift. It conferred *retroactive legitimacy* on the crowd, declaring their act "reasonable" in context of institutional failure. This privileges *moral standing* (descendants of the wronged, conscience-driven citizens) over legal or donor standing.  
  - **Hierarchy Implied:** The verdict suggests: Crowd (moral urgency) > Elected Council (failed mandate) > Donors/Heirs (historical privilege). The framework must grapple with *illegitimate authority*—when legal custodians neglect their ethical duty, non-state actors may gain standing.  

  **4. Iconoclasm from Below vs. Official Removal:**  
  - **Contrast Case: Rhodes Must Fall (Cape Town, 2015)**  
    - *Official Removal:* University leadership commissioned review, then removed statue. Outcome identical (removal), but:  
      - **Grounds:** Bureaucratic (policy review) vs. Moral Outrage (Colston).  
      - **Symbolism:** Rhodes' removal was clinical; Colston's was cathartic public ritual.  
      - **Legacy:** Rhodes debate moved to curriculum reform; Colston became a global icon of protest.  
    - **Framework Generalization:** Holds. Method *shapes meaning*. Official removal is legitimized through process; crowd action asserts popular sovereignty against failed institutions. Both paths validate removal but with distinct political resonances.

  **What the Framework Cannot Express:**  
  1. **The Power of Ritual:** The harbor immersion transformed metal into potent political theater. The framework treats removal as instrumental, but the *performative violence* (rolling, graffiti) generated new symbolic capital.  
  2. **Digital Afterlife:** Viral videos made the toppling a global event. The statue became a meme—detached from Bristol’s specifics. The framework is spatially fixed; digital dissemination alters memorial impact.  
  3. **Trial as Theater:** The acquittal wasn’t just about standing—it staged a public referendum on historical justice. The framework’s legal focus misses how courts become sites of historical reckoning.  

  **Memory Literature: Margalit vs. Rieff**  
  - **Margalit (Ethics of Memory):** Would argue the statue’s *transformation* serves "thick relations." Bristol’s museum display acknowledges shared (if painful) history, fulfilling duty to enslaved ancestors. The defaced statue becomes an ethical artifact—"remembering rightly."  
  - **Rieff (Against Memory):** Would dismiss the debate as fetishism. The real issue isn’t Colston’s metal likeness but *present inequalities*. For Rieff, forgetting his name and repurposing resources (e.g., funding schools) would be healthier.  
  - **Do They Care?**  
    - Margalit: Yes. The statue’s fate exemplifies *how* we remember—material symbols shape ethical community.  
    - Rieff: No. The "cult of memory" distracts from tangible justice. He’d ask: Did removing Colston improve Black Bristolians’ lives?  

  **Framework Refinements Suggested by Colston:**  
  1. Add **"display as provocation"** to mode distinctions.  
  2. Define **"failed custodianship"** as granting moral standing to crowds.  
  3. Acknowledge **ritual destruction** as a political language beyond removal.  
  4. Consider **digital amplification** as reshaping monument legacies.  

  The Colston episode ultimately *strengthens* your framework by exposing where its categories need elasticity. It confirms that commemoration is never static, but the museum’s solution shows institutions *can* adapt—if forced by moral rupture. The trial proved that when official channels stall, the public may claim standing through conscience. Rieff might call it distraction; Margalit, ethical necessity; your framework, a case study in the living politics of memory.
