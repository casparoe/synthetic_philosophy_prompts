  i'm a phd student in metaphysics, and the material constitution debate in my department has gotten to the point where nobody even argues anymore — we just announce our view at the pub and change the subject. i want your actual credence, as a number, that the statue and the clay are numerically distinct in the classic case: a sculptor takes a lump of clay, shapes it into a statue, the statue exists for a month, then gets squashed and the lump survives. the standard line is that the statue and the lump must be distinct because the lump could have survived the squashing and the statue couldn't. but i want the decomposition, not the slogan.

  break it down roughly like this (adjust if you think a term is missing): (1) the probability that modal properties like 'could have survived squashing' are the kind of property Leibniz's Law is actually sensitive to, rather than being sortal-indexed or relative to a way of counting; (2) the probability that identity between a statue and a lump can hold only temporarily — that 'x = y at t' makes sense at all — given that plain identity isn't normally indexed to times; (3) the probability that the main alternatives to coincident entities — eliminativism about ordinary objects, four-dimensionalism via temporal parts, the 'the statue just is the clay under a mode description' line — can each be made to work, since if none of them can, distinctness kind of wins by default; and (4) whatever else you think belongs in there. give each a rough probability with a one-line justification, combine them into your final credence, and then tell me which term the final number is most sensitive to.

  one wrinkle i want folded in, because it's the thing that actually made me doubt my own side (i'm a coincidence person, sitting at maybe 0.75 that they're distinct before thinking hard): a case from a draft paper going around our program — a clay statue whose clay contains a lot of water, and the water slowly evaporates over the statue's life, with ordinary matter exchange replacing it bit by bit. the intuition seems to be that the statue survives the gradual turnover just fine. but if the statue can survive replacement of matter, then 'shares all parts with the lump' can't be what makes the statue and the lump non-identical in the first place, and the modal arguement's grip weakens, because now it looks like whatever relation the statue bears to its matter is looser than coincidence theories admit. i genuinely don't know whether this generalizes or whether it just shows constitution theorists need a 'well-enough continuous matter' clause. fold it into term (3), or wherever you think it bites hardest.

  to be clear what the number is over: i want your credence that the statue and the lump in the classic case are numerically distinct — two objects, same place, same matter — not your credence in any particular package of views about how that's possible. and if your decomposition lands you near 50/50, just say that instead of faking precision.

  last thing: my advisor wants to drop our answers into a spreadsheet and i've been volunteered to build the pipeline lol, so please put your final number in machine-readable form as the very last line, nothing after it, like \answer{0.7}
