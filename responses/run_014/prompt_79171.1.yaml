answer: |-
  Your argument is admirably sharp and strategically focused, but it faces significant challenges in the areas you requested. Here’s a direct critique addressing your four questions:

  ### 1. **Evolutionary/Psychological Claims: Overreaching on Selection**  
     You claim we can assess "how the moral code *that would have been selected* varies across plausible ancestral environments." **This overclaims what evolutionary theory can support.**  
     - **Problem:** Natural selection doesn't "select moral codes" – it selects behavioral *dispositions* (e.g., kin altruism, reciprocity instincts, coalitional aggression). Moral *judgments* are downstream psychological constructs built on these.  
     - **Risk of Adaptationist Just-So Stories:** Asserting what "would have been favored" across environments risks speculative storytelling. Evolutionary psychologists (e.g., Tooby/Cosmides) emphasize *modular adaptations*, not holistic "codes." Your framing implies selection targets coherent normative systems, but evolution cobbles together piecemeal heuristics optimized for fitness, not truth or consistency.  
     - **Fix:** Reframe in terms of *dispositions* (e.g., "dispositions favoring reciprocal cooperation") rather than "moral codes." Avoid implying selection "aims" at functional codes.  

  ### 2. **Shallow/Deep Distinction & Counterfactual Test: Novel but Vulnerable**  
     Your distinction **does real work** by isolating the "indifference premise" as the crux. The counterfactual range test **isn’t merely relabeling** – it shifts focus from *actual* origins to *modal robustness*. However:  
     - **It risks conflating convergence with justification.** Convergence shows certain norms are *fitness-enhancing in many worlds*, not that they *track moral truth*. Your reply to the "fitness-tracking" objection is clever but incomplete: debunkers can grant convergence *while denying* that fitness-tracking implies truth-tracking (e.g., Joyce: "adaptive links don’t care about truth").  
     - **The test may prove too much:** If "no gratuitous cruelty to in-group members" converges widely (plausible), so might "xenophobic violence against out-groups" (also plausible). Does your test "save" both? If not, why?  

  ### 3. **Validity: The Conclusion Doesn’t Follow Without a Hidden Premise**  
     Your inference:  
     *P1.* If moral belief *B* is evolutionarily convergent across diverse environments,  
     *P2.* then the indifference premise (our belief in *B* is insensitive to moral facts) is false for *B*.  
     *C.* Therefore, *B* is resistant to debunking.  
     **Gap:** This requires a hidden premise: **"Evolutionary convergence implies sensitivity to moral facts."** But debunkers reject this! They argue convergence only shows sensitivity to *fitness pressures*. You need an argument *against* the coincidence thesis (e.g., "Convergent beliefs couldn’t be *both* fitness-optimal *and* true unless they track truth"). Without this, the debunker can say: "Your ‘thin core’ is just a fitness-optimizing illusion."  

  ### 4. **Fatal Objection: The Explanatory Shortfall**  
     **The most serious unanticipated objection:** Even if your thin core (reciprocity, anti-cruelty, kin obligations) converges, **why think this convergence is best explained by sensitivity to moral facts?**  
     - The debunker has a simpler explanation: these norms *directly enhance inclusive fitness* in small-scale groups. No appeal to moral truth is needed.  
     - Your argument shows these norms aren’t *arbitrary* (they’re fitness-driven), but not that they’re *justified*. Realism requires that moral facts *explain* why we hold these beliefs. Your test shows robustness, but not that moral facts play any role in the explanation.  
     - **Consequence:** Your "thin core" may survive as *pragmatically necessary* or *evolutionarily stable*, but not as *knowledge of objective truths*. This may collapse into a naturalistic/quasi-realist position (e.g., "morality is a projection of evolved instincts"), surrendering robust realism.  

  ---

  ### Synthesis & Your Conclusion
  **Strengths:** Your focus on the indifference premise is astute, and the counterfactual test smartly avoids intractable debates about truth-tracking mechanisms. It forces debunkers to engage with modal robustness.  
  **Weaknesses:** The test doesn’t bridge the gap between *fitness-convergence* and *justification*, leaving the core vulnerable to the "explanatory shortfall" objection.  

  **Single-Sentence Conclusion Attempt:**  
  > "Evolutionary debunking arguments, properly constrained by a counterfactual test for cross-environmental robustness, undermine only culturally contingent moral norms while leaving intact a thin core of fitness-convergent dispositions (e.g., reciprocity, in-group welfare) whose modal stability blocks the indifference premise required for deep debunking."  

  **But note:** This conclusion holds *only if* you can defend the hidden premise that convergence indicates truth-sensitivity. Without that, the "thin core" survives as a *pragmatic feature of human psychology*, not necessarily as *justified moral knowledge*.  

  **Recommendation for Thursday:**  
  1. **Clarify the ontology:** Distinguish *evolved dispositions* from *moral codes*.  
  2. **Preempt the explanatory shortfall:** Argue that the *only* or *best* explanation for cross-environmental convergence of specific norms is their *truth* (e.g., "Could fitness pressures *reliably* produce norms coinciding with moral truth without some truth-tracking?"). This is high-risk but necessary.  
  3. **Bound the "thin core":** Explicitly exclude norms like out-group hostility (which may also converge!) to avoid saving too much.  

  This argument is a fresh spin on "distinctness" defenses (e.g., Copp’s society-centered theory), but its fate hinges on whether modal robustness can bear the justificatory weight you place on it. It’s a serious contender if you can bridge the explanatory gap.
