answer: |-
  Here is the joint statement drafted to specification:

  (1) Both sides agree that explanatory virtues like simplicity and unification are truth-conducive heuristics used effectively in science to guide inquiry and hypothesis generation; they are not disputing the role of empirical evidence or background knowledge in constraining hypotheses.

  (2) The core disagreement: Neutrally: Whether the greater explanatory power of a hypothesis *itself* provides additional evidential warrant beyond probabilistic support. Camp 1: "Explanatory virtues confer intrinsic evidential weight that cannot be fully captured by likelihoods or priors." Camp 2: "Explanatory preference is fully justified only by its reducibility to impact on likelihoods or priors; any irreducible residue is non-evidential."

  (3) Camp 1 locates the warrant primarily in a rule for selecting hypotheses to accept, while Camp 2 locates it solely in the likelihoods or priors. In an incomplete hypothesis space, both agree the 'best' explanation might be false; Camp 1 maintains we should still tentatively accept it as the best *available* guide, while Camp 2 argues we should suspend belief until the space is expanded or probabilistic grounds improve.

  (4) The crux: Does a scenario where two hypotheses are strictly equal in current likelihood and prior probability, yet clearly differ in explanatory virtue, *require* assigning different posterior probabilities? Case: A novel phenomenon with two candidate mechanisms, M1 (simple, unified) and M2 (complex, disjointed), judged equally probable given current data and background knowledge. Camp 1 predicts: Rationality demands higher credence in M1. Camp 2 predicts: Rationality demands equal credence until new evidence distinguishes them.

  (5) The dispute over whether 'evidential' strictly applies only to probabilistic factors (likelihoods/priors) is verbal. The real crux (item 4) concerns the necessity of explanatory virtue for rational belief when probabilities are equal. Verdict: Camp 1 is right; explanatory virtue provides irreducible warrant, as demanded by the need for rational commitment in science even under uncertainty.
