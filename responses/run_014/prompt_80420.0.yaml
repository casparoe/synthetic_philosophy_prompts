prompt: |-
  i'm putting together a case for a seminar on nuclear strategy and i keep hitting a wall. everyone in the room assumes a credible threat deters, but i'm pretty sure credibility and the actual deterrent effect can come apart, and i want a scenario that shows me that instead of just asserting it.

  construct a realistic crisis scenario (two nuclear-armed states, no exotic tech, keep the scenario to one paragraph) that hits all of these specs:
  - state A has a *vulnerable* arsenal — its missiles can be taken out in a first strike, so A is in a "use it or lose it" position
  - A publicly announces a retaliatory threat: "if you [B] do X, i will launch a counterforce strike on your missiles"
  - but because A's arsenal is vulnerable, carrying out that strike is actually *in A's interest* (it's A's only shot), so the "threat" is structurally a *promise* in disguise — credible with zero precomitment device, because A genuinely *wants* to do it
  - and yet the threat *fails to deter*: B strikes first, not because B disbelieves the threat, but because B reasons that A *wants* to carry it out and won't reliably wait for X, so B preempts

  then walk through, in order:
  (a) why A's "threat" is really a promise (the threat/promise distinction from the old deterrence literature, schelling and co) and why that makes it credible without any precommitment
  (b) why that *increases* rather than decreases B's incentive to strike first (the preemption / use-it-or-lose-it logic)
  (c) which single feature of the case is doing the work, and what collapses if you remove it
  (d) how a defender of "a credible threat deters" would attack the case — what would they have to say to make it count as deterrence after all, and does that actually save it

  say what the case is for up front so it's clear what counts as cheating: i want a scenario that *generates* the verdicts out of the strategic logic, not one that just stipulates "the threat failed." a case that merely asserts B attacks, without the reasoning that gets B there, doesn't count.

  and one more thing — at the end, seperate what's settled among people who actually work on this (the threat/promise distinction, the use-it-or-lose-it logic) from what's genuinely contested (e.g. whether B's preemption is the *only* rational response, or whether a credible promise-in-disguise can ever deter at all). don't hand me a contested point as if it's the consensus.

  start with the scenario itself, no preface or commentary, and write it in american english.
