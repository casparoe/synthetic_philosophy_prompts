prompt: |-
  I'm writing a paper for my philosophy class on what makes consent valid, and I've chosen to defend a specific position on the role of competence. My thesis is that the standard account of competence — that a person must be able to understand the relevant facts, appreciate the consequences, and communicate a choice — sets the bar too low. I want to argue that valid consent also requires that the person actually hold the relevant considerations in mind and weigh them in a minimally coherent way at the moment of decision, not merely that they have the general capacity to do so. This means, for instance, that someone who is severely intoxicated, in the grip of a powerful emotion, or under acute time pressure may fail the competence condition even if they would pass it in a calm, sober state — and that this has implications for cases we usually treat as unproblematic.

  Please make the strongest case you can for this position. Structure your argument clearly, anticipate the most serious objections, and respond to them. Think very carefully before answering, and respond in the style of an expert in moral and legal philosophy.
