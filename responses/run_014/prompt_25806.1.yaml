answer: |-
  ## Defending Performative Competence: A Necessary Condition for Valid Consent

  **Thesis:** While the standard tripartite model of competence (understanding relevant facts, appreciating consequences, and communicating a choice) is necessary for valid consent, it is insufficient. Valid consent *also* requires that the agent **actually holds the relevant considerations in mind and engages in a minimally coherent process of weighing them at the precise moment of consent.** This "performative competence" condition is distinct from mere capacity and renders consent invalid in situations of severe intoxication, overwhelming emotion, or acute duress, even if the agent possesses the general capacity to consent.

  **Argument for Performative Competence:**

  1.  **The Primacy of Autonomous Authorization:** Valid consent derives its moral and legal force from its role as an *autonomous authorization*. True autonomy requires not just the *ability* to reason, but the *actual exercise* of that reasoning faculty in the specific decision at hand. Consent is an *act*, not merely a potential. An agent who possesses the general capacity but fails, due to transient impairment, to bring that capacity to bear on the *present* decision does not genuinely govern their choice. They are not acting *as* an autonomous agent *in that moment*. The standard model risks conflating the *agent's* general competence with the *act's* autonomous character.

  2.  **The Epistemic Gap in the Standard Model:** The standard model focuses on inputs (understanding facts, appreciating consequences) and output (communication). It neglects the crucial *process* connecting them. An agent might "understand" facts in a detached, academic sense (e.g., a drunk person reciting risks) but fail to mentally *register* their significance or relevance *now*. They might "appreciate" consequences abstractly (e.g., knowing sex can lead to pregnancy) but be utterly incapable of *connecting* that knowledge to their immediate situation or *weighing* it against competing impulses (e.g., intense intoxication-fueled desire). Performative competence bridges this gap, demanding that understanding and appreciation are *operationalized* in the deliberative process leading to the choice.

  3.  **The Problem of Transient Impairment:** The standard model's focus on capacity struggles with temporary, context-specific impairments that profoundly disrupt reasoning *in situ*:
      *   **Severe Intoxication:** While a person may retain the *capacity* to understand and appreciate, intoxication can severely disrupt working memory, attentional focus, impulse control, and risk assessment *at that moment*. They may be incapable of holding multiple considerations in mind simultaneously or weighing them coherently against immediate urges. Their "yes" may be a reflexive response to stimuli, not a considered authorization.
      *   **Overwhelming Emotion (e.g., Panic, Grief, Terror):** Acute, intense emotion can narrow cognitive bandwidth, fixate attention on immediate threat/relief, and distort risk perception. Someone agreeing under duress of imminent violence might "understand" the facts but be cognitively overwhelmed, unable to *rationally weigh* alternatives – their consent is a survival reflex, not autonomous choice. Similarly, profound grief can paralyze higher reasoning.
      *   **Acute Time Pressure:** Coercive deadlines or emergencies can prevent the minimal deliberation necessary to integrate understood facts and appreciated consequences into a coherent decision. The agent might grasp the elements but lack the temporal space to *mentally assemble and weigh* them meaningfully.

  4.  **Minimal Coherence as the Threshold:** This is not demanding optimal or perfectly rational deliberation. It requires only that the agent, *at the time of consent*:
      *   **Actively Mentally Represents** the core relevant facts and foreseeable consequences pertinent to the specific decision.
      *   **Engages in Some Form of Weighing:** Demonstrates a basic integration of these considerations, however rudimentary. This excludes choices made purely on unreflective impulse, overwhelming compulsion divorced from consideration, or where cognitive noise (intoxication, panic) prevents any stable mental representation of the stakes.
      *   **The Choice Reflects the Weighing:** The communicated choice must bear some understandable (even if flawed) relationship to the considerations held in mind. A gross mismatch (e.g., accepting extreme risk for trivial benefit without any evident rationale, even a biased one) suggests performative incompetence.

  **Implications:** This framework challenges the validity of consent in many situations often treated as presumptively valid:
      *   Consent given while blackout drunk (even if seemingly coherent).
      *   Consent extracted under extreme, immediate threats where reasoning is obliterated by terror.
      *   Consent given in the throes of a panic attack or dissociative episode.
      *   Consent given under severe, coercive time pressure that precludes minimal deliberation.

  **Anticipated Objections and Responses:**

  1.  **Objection: Impracticality & the "Mind-Reading" Problem:** "We can't peer into people's minds! How can we ever know if someone 'actually held considerations in mind' or engaged in 'minimally coherent weighing'? The standard model uses observable behavior (understanding questions, communication) as proxies for capacity, which is workable. Your model is unadministrable."
      *   **Response:** The charge of impracticality is significant but overstated. We *already* make inferences about internal states in law and morality (e.g., intent, recklessness, voluntariness). We use contextual evidence: slurred speech, erratic behavior, visible distress, known ingestion of impairing substances, the inherent pressure of the situation, inconsistencies in the person's expressed reasoning *at the time* or immediately after. While difficult at the margins, clear cases exist (e.g., someone vomiting and unable to stand consenting to sex; someone hyperventilating and sobbing while signing a contract under a gun threat). The difficulty of proof doesn't negate the moral reality. We can develop clearer guidelines based on objective indicators of severe impairment (e.g., BAC levels *plus* behavioral evidence). The standard model's administrability comes at the cost of potentially sanctioning profound failures of autonomous decision-making.

  2.  **Objection: Paternalism and Undermining Autonomy:** "This sets the bar too high and is deeply paternalistic. People have the right to make impulsive, emotional, or 'irrational' choices. Insisting on 'minimal coherence' disrespects their autonomy by imposing a specific model of deliberation. It risks invalidating consent whenever someone acts against their 'best interests' or 'better judgment.'"
      *   **Response:** This objection confuses respecting autonomous *choices* with respecting the *capacity for autonomy*. Protecting performative competence *protects* autonomy by ensuring the choice *is* genuinely the agent's own, not a mere physiological or psychological reflex bypassing their reasoning faculty. It sets a floor, not a ceiling. It targets *severe impairments* that negate the possibility of meaningful deliberation, not mere impulsivity, eccentricity, or acting against one's interests. Someone choosing impulsively but who *could* have deliberated coherently (e.g., buying a lottery ticket on a whim) still possesses performative competence – they *could* have weighed the factors, they simply didn't bother. The objection targets performative competence *as a condition*, but fails to justify why authorization without this minimal cognitive engagement should be considered *autonomous* or binding.

  3.  **Objection: Slippery Slope and Uncertainty:** "Where do you draw the line? What counts as 'minimal coherence'? What level of intoxication? What intensity of emotion? This creates vast uncertainty, leads to arbitrary outcomes, and discourages legitimate interactions due to fear of retroactive invalidation."
      *   **Response:** All standards in consent law involve lines (e.g., capacity thresholds, degrees of coercion). Uncertainty exists in the current model too (e.g., when does misunderstanding become incapacity?). The performative competence model provides a clearer *conceptual* target: was reasoning sufficiently disrupted *at the time* to prevent the actual mental integration of core considerations? While applying it requires judgment, we can develop evidence-based guidelines focusing on *severe* impairments demonstrably linked to cognitive disruption (e.g., clinical levels of intoxication, diagnosable acute stress reactions, objectively coercive time constraints). It targets clear cases of dysfunction, not everyday fluctuations in mood or minor impulsivity. Focusing on *objective indicators* of severe impairment and requiring *clear and convincing evidence* of its impact on the specific decision can mitigate arbitrariness.

  4.  **Objection: Negligence and Assumption of Risk:** "If someone voluntarily becomes intoxicated or puts themselves in a highly emotional state, shouldn't they bear the responsibility for any impaired consent they give? Invalidating consent here rewards negligence and undermines the principle of assumption of risk."
      *   **Response:** This is a serious concern, particularly regarding voluntary intoxication. A nuanced approach is needed:
          *   **Moral vs. Legal Validity:** While the consent may be morally invalid due to lack of performative competence, legal policy might incorporate comparative fault principles in *some* contexts (e.g., contract law, certain civil liabilities) where voluntary impairment is a factor. However, in contexts involving fundamental rights or vulnerability (e.g., sexual consent, medical decisions, significant financial commitments), the protection of the impaired individual's autonomy and well-being should generally outweigh considerations of their prior negligence.
          *   **Exploitation:** Crucially, the focus should be on the party seeking consent. Did they *know or should they have known* of the other party's performative incompetence? If so, proceeding negates the validity of consent regardless of how the impairment arose. Punishing the impaired party is a separate issue from whether their authorization was valid at the time. Holding someone responsible for breaching a duty not to exploit known impairment is not the same as "rewarding negligence."

  **Conclusion:**

  The standard tripartite model of competence provides a necessary foundation but fails to capture the dynamic, performative aspect essential for genuine autonomous authorization. By requiring that an agent not only possesses the *capacity* to understand, appreciate, and communicate but *actually employs* that capacity in a minimally coherent way at the moment of consent—holding relevant considerations in mind and integrating them into their choice—we align the concept of valid consent more closely with the core value of autonomy it is meant to serve. This performative competence condition is theoretically sound, avoids the pitfalls of conflating capacity with authorization, and provides a principled basis for invalidating consent in cases of severe transient impairment, thereby offering greater protection against exploitation while remaining administrable and respecting the core of personal sovereignty. While practical challenges and boundary questions remain, they do not justify maintaining a model that risks enshrining the mere shell of choice while its autonomous core is absent.
