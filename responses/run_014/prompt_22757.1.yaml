  First, I need to understand why the user finds this problematic for semantic accounts. They argue that if the derogation is semantic, every use, including quotation, should carry that component. But in classroom contexts, it doesn't, hence the dilemma. The user might be looking for validation of their pragmatic stance but also wants to explore counterarguments to ensure they're not overlooking something.

