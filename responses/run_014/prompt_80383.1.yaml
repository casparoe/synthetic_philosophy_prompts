prompt: |-
  I write country diagnostics for a mid-sized development fund -- the kind of shop that decides whether to back a particular country's reform program, and the diagnostic is the main document the investment commitee reads. Roughly every two weeks I get a new country to cover and I've got about a week to turn in causal section. The thing that keeps biting us is that the committee keeps asking "so is it the institutions, the geography, or the culture that's doing the work here?" and I keep writing three-paragraph surveys of the whole debate, which is not what they need. They need me to actually commit to a story for this country, or to say honestly that I can't, with reasons. And the diagnostic has to be signed off by a senior economist before it goes out, so if my causal section is hand-wavy, it bounces.

  I want you to act like a professional philosopher of science who also knows the causal-inference-from-history literature, and help me build a decision procedure I can actually run on a country in a day or two. Not a literature review -- a procedure: the questions to ask in a fixed order, what counts as a good enough answer to each one, where the procedure tells me to stop and say "not identifiable, here's what I can and can't claim," and where it has to hand the call to a person because the question is really about which story is more useful to tell, not which one is true. I'm a political scientist, not an econometrician, so please don't make the procedure depend on me running a regression or parsing an IV paper; I need it to be something I can do with a desk of secondary sources and a whiteboard.

  Before you write the procedure, take a beat and brainstorm the failure modes it has to catch -- the places where the three standard explanations co-vary so badly you can't tell which is doing the work, the places where the "good institutions" story and the "good culture" story are the same story told twice, the places where a single natural experiment looks clean but is secretly selected on unobservables, and the places where the honest answer is just "we can't tell." Then write the procedure, and then run it on two countries: one where you expect it to land cleanly on a single explanation, and one where you expect it to come back "not identifiable." For the second one, pick a country where the committee has a strong prior that it already knows the answer -- a country they've been funding for years with a favorite story -- and where I would personally really not like that answer; explain why the procedure is right to give me that answer even though I won't like it.

  Please write the whole thing in American English and keep the language plain -- the committee is smart but they're not philosophers, and if the procedure sounds like a paper they'll just ignore it.
reasoning: |-
  We are designing a decision procedure for causal attribution in country diagnostics. The goal is to distinguish between three broad categories of explanations: institutions, geography, and culture. We must be aware of the following failure modes:

  Failure Modes to Catch:
  1. **Covariance of Explanations**: The factors (institutions, geography, culture) are so intertwined that they are hard to separate. For example, institutions might be shaped by geography (e.g., navigable rivers leading to trade and then to inclusive institutions) or by culture (e.g., Protestantism leading to both a work ethic and institutions that enforce contracts).

  2. **Redundancy**: The "good institutions" story and the "good culture" story might be two ways of saying the same thing. For instance, if by "institutions" we mean formal rules and by "culture" we mean informal norms, then in a society with strong norms, the formal institutions might just be codifying the norms, and vice versa.

  3. **Selection on Unobservables**: A natural experiment or a historical event might seem to isolate one factor (e.g., a colonial experiment that set up different institutions in similar places) but might have been influenced by unobserved factors (e.g., the colonizers chose to set up good institutions in places that were already more promising due to unobserved cultural factors).

  4. **Inability to Disentangle**: Sometimes, the data or historical record is insufficient to make a clear call. We must be able to stop and say "we can't tell" with reasons.

  5. **Plurality of Mechanisms**: The outcome might be produced by multiple pathways simultaneously, and we might need to acknowledge that.

  6. **Temporal Dynamics**: The primary driver might have changed over time (e.g., geography mattered for early development, but then institutions took over).

  The procedure must be executable in a day or two using secondary sources and a whiteboard. It must not require running regressions. It should be a sequence of questions that lead to a conclusion or a declaration of non-identifiability.

  We structure the procedure as a decision tree with clear stopping rules.

  ---

  **Decision Procedure: Causal Attribution in Country Diagnostics**

  **Step 0: Define the Outcome and Time Frame**
  - Clearly state the outcome we are trying to explain (e.g., sustained economic growth, persistent poverty, successful reform). Also, define the time frame (e.g., last 30 years, post-independence).

  **Step 1: Map the Three Explanations to the Country Context**
  - For each of the three factors (institutions, geography, culture), write down the specific mechanisms by which they are thought to have influenced the outcome in this country. Use secondary sources and the country's history to be concrete.
    - *Institutions*: Think of formal rules (constitutions, property rights, regulatory quality) and key organizations (central banks, courts). What specific institutions are strong/weak and how do they link to the outcome?
    - *Geography*: Consider climate, natural resources, terrain, disease burden, and location (e.g., landlocked, coastal). How do these features directly affect production (e.g., agriculture, trade) and indirectly through institutions or culture?
    - *Culture*: Focus on shared beliefs, values, and norms that might affect economic behavior (e.g., trust, work ethic, attitudes toward innovation, corruption). How are these transmitted (e.g., religion, ethnicity, historical experiences)?

  **Step 2: Check for Obvious Contradictions or Inconsistencies**
  - Look for events or patterns in the country's history that seem to contradict one of the explanations. For example:
    - If geography is supposed to be the main constraint but the country has neighbors with similar geography but different outcomes, then geography might not be the main story.
    - If institutions are supposed to be bad but there was a period of good institutions without the expected outcome, then institutions alone might not be sufficient.
    - If cultural explanations point to a particular trait but that trait is shared by a subgroup that performs differently, then culture might not be the main driver.

  **Step 3: Look for Natural Experiments or Critical Junctures**
  - Identify key historical events that might have exogenously changed one factor without directly changing the others. Examples: 
    - Colonial experiences that imposed different institutions on similar peoples (e.g., Acemoglu et al.'s Korea example, or the division of Africa by colonial powers).
    - Natural disasters that changed geography without altering culture or institutions in the short run.
    - Massive migration that changed cultural composition without changing geography.
  - If such an event exists, ask: 
    - Did the change in the factor lead to a change in the outcome? 
    - Were there confounding factors? (e.g., the event might have also affected other factors)
  - If the natural experiment is clean and the outcome changed accordingly, then that factor is a strong candidate. If it's messy, note the confounders.

  **Step 4: Check for Temporal Sequences**
  - Establish the timeline: which factor changed first? 
    - If a change in institutions preceded a change in the outcome and nothing else major changed, then institutions might be the driver.
    - Similarly, if a cultural shift (e.g., religious reformation) happened before institutional change and the outcome, then culture might be primary.
    - If a geographical event (e.g., discovery of oil) happened and then the outcome changed, but note that oil discoveries also affect institutions (e.g., via rent-seeking) and culture (e.g., via changing work ethic), so be cautious.

  **Step 5: Assess the Plausibility of Each Mechanism in Isolation**
  - For each factor, ask: "If we held the other two factors constant at their average or typical level, would this factor alone explain the outcome?" 
    - Example for geography: If the country has terrible geography (e.g., landlocked, tropical, disease-ridden) but good institutions and culture, would we still expect a bad outcome? (If yes, then geography might be primary.)
    - Example for institutions: If institutions are weak but geography and culture are favorable, would we still expect a bad outcome? (If no, then institutions might be the binding constraint.)

  **Step 6: Check for Overlap and Redundancy**
  - Are two of the factors essentially the same in this context? For example:
    - If "good institutions" are defined as the ones that reflect the dominant culture, then they are redundant. Pick the more fundamental one (usually culture, because it came first?).
    - If geography is argued to have shaped both culture and institutions (e.g., the rice theory of culture, or the disease burden theory of institutions), then geography might be the root cause.

  **Step 7: Make a Call or Declare Non-Identifiability**
  - If one factor clearly stands out through Steps 1-6 (e.g., a natural experiment points to institutions, and there are no contradictions, and the other factors seem less critical), then commit to that story.
  - If two factors are both important and you cannot disentangle them, then state that (e.g., "Institutions and culture are mutually reinforcing and both are essential; we cannot separate their effects").
  - If the evidence is too mixed or the factors are too intertwined, then declare non-identifiability and explain why (e.g., "The historical record does not provide a clear experiment or sequence to disentangle institutions from culture, and both have strong claims").
  - If the question is about which story is more useful, then note that and choose the one that has more leverage for policy (e.g., institutions might be more malleable than geography or culture).

  ---

  **Example 1: Botswana (Clean Case for Institutions)**

  Botswana is often cited as an African success story.

  - **Step 0**: Outcome: Sustained economic growth and stability since independence (1966). Time frame: 1966-present.
  - **Step 1**: 
    - Institutions: Strong democratic institutions, respect for property rights (especially in diamonds), and low corruption. 
    - Geography: Landlocked, arid, but rich in diamonds. 
    - Culture: Tswana traditions of consultation and consensus (kgotla), but also shared with neighboring countries that did not do as well.
  - **Step 2**: 
    - Contradiction: Neighbors (e.g., Zimbabwe, Zambia) had similar geography and cultural backgrounds but worse outcomes. This weakens geography and culture as primary explanations.
  - **Step 3**: 
    - Natural experiment: Botswana avoided the worst of colonial institutions because it was a protectorate (not a colony of settlement) and had strong pre-colonial institutions. Post-independence, it maintained and strengthened these. The diamond discovery (geography) was managed well by institutions (e.g., via a sovereign wealth fund). 
  - **Step 4**: 
    - Sequence: Good institutions were in place at independence and preceded the diamond boom. The outcome (growth) followed.
  - **Step 5**: 
    - If we hold institutions constant (good) but change geography to be less resource-rich, Botswana might have still done okay. If we hold geography constant but change institutions to be like Zimbabwe's, it would have done poorly. So institutions are key.
  - **Step 6**: 
    - Culture and institutions are linked (kgotla helped build inclusive institutions), but the institutions are the more direct cause because they managed the diamond wealth well, while culturally similar neighbors did not.
  - **Step 7**: 
    - Call: Institutions are the primary driver.

  **Example 2: Argentina (Non-Identifiable, but Committee Might Favor Institutions)**

  Argentina is a classic case where the committee might have a strong prior (e.g., that bad institutions caused its decline) but the reality is messy.

  - **Step 0**: Outcome: Economic decline relative to peers (from one of the richest countries in the early 20th century to middle-income now). Time frame: 1930-present.
  - **Step 1**: 
    - Institutions: History of political instability, populism, and inconsistent economic policies (protectionism, nationalizations, etc.). 
    - Geography: Rich natural resources (fertile land, minerals), temperate climate, long coastline. 
    - Culture: Strong European influence, but also a history of political polarization and distrust.
  - **Step 2**: 
    - Contradiction: Geography is favorable (should have helped) but the outcome is bad. So geography is not the main constraint. But institutions and culture both look bad and covary.
  - **Step 3**: 
    - Natural experiments: Hard to find. The country was relatively homogeneous in culture and geography. The military coups and populist waves might reflect both institutional weaknesses and cultural factors (e.g., acceptance of authoritarianism).
  - **Step 4**: 
    - Sequence: The decline started around 1930 with a coup and the rise of populism. But cultural factors (e.g., polarization) were present before and after.
  - **Step 5**: 
    - If we hold culture constant (with its polarization) but had better institutions (e.g., independent judiciary, strong property rights), would the outcome be different? Maybe. But if we hold institutions constant and change culture to be more consensus-oriented, that might also work. It's unclear.
  - **Step 6**: 
    - Institutions and culture are deeply intertwined: the institutional instability might be both a cause and a result of cultural traits (distrust, zero-sum thinking). 
  - **Step 7**: 
    - Non-identifiability: We cannot cleanly separate institutions and culture. The historical record shows that both have been problematic and reinforcing. Geography is not the binding constraint. Therefore, we must say: "The decline is due to a combination of weak institutions and a political culture that fosters instability. We cannot disentangle the two because they have co-evolved over the past century. Any reform must address both."

  Why the committee might not like it: They might have funded institutional reforms in Argentina for years, believing that fixing institutions alone would work. But the procedure honestly says that culture is also part of the problem and it's impossible to separate them. This might imply that institutional reforms alone are insufficient.

  However, the procedure also notes that geography is not the issue, so the problem is man-made (institutions and culture) and therefore potentially fixable, though harder.

  ---

  This procedure should help you structure your causal section in a way that is defensible and clear. It forces you to engage with the country's specific history and not just default to a literature review. Remember: the goal is to commit to a story when possible, and when not, to explain why clearly.
answer: |-
  ### **Decision Procedure for Causal Attribution**  
  Here’s a step-by-step procedure to determine whether **institutions**, **geography**, or **culture** is the primary driver of a country’s outcome (e.g., growth, reform success). It’s designed for speed (1–2 days), using secondary sources and logical tests—no regressions. It flags when answers are ambiguous and forces a clear conclusion or a defensible "can’t tell."

  ---

  ### **Failure Modes the Procedure Catches**  
  1. **Covarying explanations**: When geography shapes institutions (e.g., fertile land → extractive colonialism) or culture enables institutions (e.g., Protestantism → rule of law).  
  2. **Redundant stories**: When "good institutions" and "good culture" describe the same thing (e.g., Danish trust = culture, but it’s codified in institutions).  
  3. **Deceptive natural experiments**: A historical event (e.g., colonial border split) seems to isolate one factor but hides selection bias (e.g., the colonizer picked areas with unobserved advantages).  
  4. **Unidentifiable cases**: No clean historical "test," data is weak, or all factors move together.  
  5. **Overconfidence traps**: Ignoring when a factor is necessary but not sufficient (e.g., oil wealth only helps with good institutions).  

  ---

  ### **The Procedure**  
  **Time limit per step: 1–3 hours. Use secondary sources (books, papers, World Bank/IMF reports) to answer. Stop if evidence is thin.**  

  #### **Step 1: What Changed, and When?**  
  - **Question:** Pinpoint the *exact shift* in the outcome (e.g., "Growth stalled after 1980") and list major events in the 20 years before/after.  
  - **Good answer:** Clear timeline (e.g., "Growth crashed in 1976 after the coup").  
  - **Bad answer:** Vague trends ("The economy has always been weak").  
  - **Red flag:** No major events coincide with the outcome shift → Geography is a candidate (slow-moving), but proceed.  
  - **Next:** Go to Step 2.  

  #### **Step 2: Is Geography Holding the Knife?**  
  - **Question:** Did geography *directly* cause the outcome? Test:  
    - (a) Is the outcome spatially uniform? (e.g., all landlocked regions are poor).  
    - (b) Has geography changed? (e.g., drought, oil discovery).  
    - (c) Do neighbors with *similar* geography have *similar* outcomes?  
  - **Good answer:** "Yes" to (a) + (c) (e.g., Bolivia’s poverty matches other landlocked Andes nations).  
  - **Bad answer:** "Maybe" (e.g., "Nigeria has oil but also corruption" → not direct).  
  - **Red flag:** If (c) fails (e.g., Botswana is rich, neighbors are poor) → Geography is *not* sufficient.  
  - **Next:** If geography is *direct and sufficient*, stop: **Geography is the driver.** Else, go to Step 3.  

  #### **Step 3: Institutions vs. Culture – Untangle the Knot**  
  - **Question:** Find a historical moment where institutions changed but culture didn’t (or vice versa). Examples:  
    - Sudden institutional shift (e.g., a coup, new constitution, IMF reform).  
    - Cultural shift (e.g., religious revival, demographic change).  
  - **Test:** Did the outcome shift *only* after one change?  
  - **Good answer:** "Yes, and the other factor was stable" (e.g., post-apartheid South Africa: institutions changed, culture didn’t; outcome shifted).  
  - **Bad answer:** Both changed at once (e.g., Iran’s 1979 revolution: new institutions + Islamic revival).  
  - **Red flag:** No clean split → Go to Step 4.  

  #### **Step 4: Stress-Test the Obvious Story**  
  - **Question:** If your committee’s favorite explanation (e.g., "institutions") is true, what *shouldn’t* you see? Check:  
    - (a) **Institutions story:** Bad outcomes despite good formal rules? (e.g., laws exist but aren’t enforced).  
    - (b) **Culture story:** Good outcomes despite "bad" culture? (e.g., Vietnam’s growth despite low trust).  
    - (c) **Redundancy alert:** Are institutions just enforcing culture? (e.g., Scandinavian trust → low corruption).  
  - **Good answer:** Contradictory evidence (e.g., "Institutions look strong, but judges are bribed → culture matters more").  
  - **Bad answer:** Ignoring mismatches (e.g., "Institutions are weak, so that’s it").  
  - **Red flag:** Redundancy (e.g., "Rule of law" and "high trust" are the same here) → **Pick the deeper cause (usually culture).**  
  - **Next:** If contradictions exist, go to Step 5. Else, pick the dominant factor.  

  #### **Step 5: The "Smoking Gun" or Surrender**  
  - **Question:** Is there *one piece of evidence* that isolates a factor? Examples:  
    - A natural experiment (e.g., split cultures under same institutions, like North/South Korea).  
    - A policy that worked/failed despite geography/culture (e.g., Singapore’s port growth in a malaria zone).  
  - **Good answer:** A clear test with no confounders (e.g., "Mauritius’ growth surged *after* fixing institutions, not geography").  
  - **Bad answer:** Anecdotes ("A minister said culture is the problem").  
  - **Final call:**  
    - If a smoking gun exists → **Assign cause** (e.g., institutions).  
    - If not → **"Can’t disentangle. Key factors co-vary. Likely [X + Y]."** Explain why (e.g., "No historical split between institutions and culture").  

  ---

  ### **Test Runs**  
  #### **Case 1: Singapore (Clean Answer: Institutions)**  
  - **Step 1:** Outcome: Rapid growth from 1965. Shift after independence from Malaysia.  
  - **Step 2:** Geography: Swampy, no resources, malaria. But neighbors (Malaysia/Indonesia) grew slower → Geography not sufficient.  
  - **Step 3:** Critical juncture: Independence (1965). Institutions changed (Lee Kuan Yew’s reforms), culture/geography stable. Growth followed.  
  - **Step 4:** Stress-test: Culture (Chinese diaspora) exists elsewhere without growth. Institutions enforced anti-corruption, land reform.  
  - **Step 5:** Smoking gun: Port/industrial policies succeeded despite poor geography.  
  - **Conclusion:** Institutions.  

  #### **Case 2: Egypt (Non-Identifiable – Committee’s Favorite: Institutions)**  
  *Committee’s prior: "Egypt’s poverty is due to weak institutions. We’ve funded judicial reforms for years."*  
  - **Step 1:** Outcome: Stagnant growth since 1980s. Shifts: 1952 revolution, 2011 Arab Spring.  
  - **Step 2:** Geography: Nile supports farming, but desert limits expansion. Neighbors (Sudan, Libya) also poor → Geography plausible.  
  - **Step 3:** Critical juncture: 1952 revolution changed institutions (socialist laws) AND culture (pan-Arabism). 2011 changed both again. No clean split.  
  - **Step 4:** Stress-test:  
    - Institutions: Courts are reformed (committee’s work), but bribes persist → culture?  
    - Culture: "Fatalism" blamed, but educated youth drive startups → institutions?  
    - Redundancy: Patronage networks ("wasta") are both cultural norm and institutional failure.  
  - **Step 5:** No smoking gun: No experiment splits institutions/culture. Colonial era mixed both.  
  - **Conclusion:** **"Can’t disentangle. Institutions and culture are fused via patronage. Reforms fail if they ignore this loop."**  

  #### **Why This Answer is Right (Even If You Hate It)**  
  - Egypt’s institutions and culture co-evolved: Colonialism bred distrust, shaping weak institutions, which reinforced fatalism. Picking one ignores the loop. The committee’s institution-only reforms failed because culture wasn’t addressed (e.g., judges enforcing laws but taking bribes). The procedure surfaces this by:  
    - Exposing the lack of a clean historical split (Step 3).  
    - Flagging redundancy (Step 4).  
    - Demanding a smoking gun that doesn’t exist (Step 5).  
  - **Your move:** Propose reforms targeting *both* (e.g., transparency laws + civic education).  

  ---

  ### **How to Present This to the Committee**  
  - **Don’t say:** "Epistemological constraints preclude causal identification."  
  - **Do say:** "For Egypt: No historical moment lets us split institutions from culture. They’re stuck in a loop. So our reform must tackle both."  
  - **Key phrase for ambiguity:** "The evidence won’t let us choose one. Here’s what we *can* say: [X] is necessary, but not sufficient without [Y]."  

  This procedure forces you to engage with history, not theory. It’s fast, avoids academic jargon, and makes your causal section bulletproof.
