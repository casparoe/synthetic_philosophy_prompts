answer: |-
  Your observation is remarkably astute—you've identified a profound cross-disciplinary pattern that sits at the intersection of decision theory, political philosophy, and behavioral economics. Let's dissect this step by step, using rigorous conceptual carving.  

  ### Core Phenomenon: Intentional Self-Restriction Against Future Volitional Shifts  
  **The Unifying Principle**: *Agents (individual or collective) deliberately restrict their future choice-set to prevent preference reversals they predict but disavow.*  
  This requires:  
  1. **Anticipation of conflicting future desires** (e.g., present-you vs. impulsive future-you; current legislature vs. future populist legislature).  
  2. **Strategic precommitment** creating *costly* reversal barriers.  
  3. **Self-binding intent**: Restricting *your own* future agency.  

  ### Existing Frameworks & Their Gaps  
  1. **Ulysses Contracts** (Jon Elster):  
     - *Personal* precommitment (e.g., tying yourself to the mast).  
     - **Gap**: Doesn't cover *collective* cases like constitutional entrenchment.  

  2. **Self-Command** (Thomas Schelling):  
     - Strategic partitioning of the self into "planner" and "doer."  
     - **Gap**: Weak on institutional mechanisms (e.g., supermajority rules).  

  3. **Constitutional Entrenchment** (James Buchanan):  
     - Collective self-binding against future majorities.  
     - **Gap**: Ignores individual analogs (e.g., phone lockboxes).  

  **Your cases reveal a hybrid**: *Tiered Volitional Lock-In*, where barriers operate on a reversibility spectrum.  

  ---

  ### Defining the Concept: **Reflexive Precommitment**  
  *(Proposed coinage—"reflexive" denoting self-applied constraints anticipating volitional change)*  

  #### Necessary and Sufficient Conditions:  
  1. **Temporal Conflict Prediction**:  
     - Agent(s) must explicitly anticipate future preferences conflicting with current preferences.  
     - *Counterexample*: Installing a safe because of burglars (external threat) isn't reflexive.  

  2. **Asymmetric Reversibility**:  
     - Reversing the commitment is *possible* but requires disproportionate effort/cost compared to initial commitment.  
     - Your savings app (fee + delay) and HOA (75% vote vs. simple majority) exemplify this.  
     - *Boundary*: If reversal is *impossible* (e.g., surgical sterilization), it becomes *irreversible self-modification*, not precommitment.  

  3. **Agency Continuity**:  
     - The constrained future agent must be institutionally/symbolically continuous with the present agent.  
     - *Key*: Future-you is still "you"; future legislatures inherit the same constitutional authority.  
     - *Counterexample*: Parent setting rules for a child lacks continuity.  

  ---

  ### Boundary Cases: What Doesn't Qualify  
  | **Case**                  | **Why It Fails**                          |  
  |---------------------------|------------------------------------------|  
  | Ordinary promises          | No structural barrier; relies on willpower |  
  | Making tasks inconvenient | Low reversal cost (e.g., deleting apps)  |  
  | External enforcement       | Landlord restrictions aren't *self*-binding |  
  | Permanent sacrifices       | No reversibility (e.g., burning bridges) |  

  ---

  ### Close Cousins Often Confused  
  1. **Signaling Devices** (e.g., public vows):  
     - Creates *reputational* costs, not structural barriers. Reversal is psychologically costly but physically trivial.  

  2. **Preference-Shaping**:  
     - E.g., quitting smoking to reduce desire. Targets *preferences themselves*, not choice-sets.  

  3. **Delegation**:  
     - Granting control to *another agent* (e.g., financial advisor). Differs from self-imposed *impersonal* barriers.  

  ---

  ### Why This Matters Philosophically  
  - **Paradox of Self-Binding**: Can "free" self-restriction exist? (See Hobbes on sovereign creation).  
  - **Democratic Legitimacy**: Can past majorities bind future ones? (Jefferson vs. Madison debate).  
  - **Autonomy Trade-off**: Enhances long-range agency by restricting momentary freedom.  

  **Verdict**: Yes, your cases are the same phenomenon—**Reflexive Precommitment**—manifesting across scales. Its power lies in *leveraging friction against predicted irrationality*. The critical threshold is *asymmetric reversibility*: where undoing requires orders of magnitude more resources than creating.  

