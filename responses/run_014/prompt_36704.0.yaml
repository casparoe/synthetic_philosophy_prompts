prompt: |-
  Write me a parody of those glossy corporate "your year in review" emails — the Spotify Wrapped kind — put out by a fictional data-analytics company whose whole product is reconstructing people's preferences from their behavior. Call it something like Preflytics and have them send users their annual "True Self Report." Around 650 words, formatted like a real marketing email: subject line, hero stat, a couple of widgets, closing CTA, plus a short FAQ at the bottom.

  The satire has to come from actually taking revealed preference theory seriously as a business model, so a behavioral economist laughs instead of wincing. The company never asks users what they want, because asking would be methodologically suspect — every claim about the user is inferred from choices only, and the email should wear that as a virtue ("You told three friends you were trying to cut back on drinking. You ordered 74 drinks. We know which of those is data."). Work in the real trouble spots of the theory as product features: sunk-cost hours logged as enjoyment ("you finished a 60-hour game you described in your notes app as 'a chore' — engagement through the roof"), the no-distinction between wanting something and choosing it, the way the report literally cannot express that anything is bad for you because utility is only ever measured relative to observed behavior, and an adaptive-preference badge congratulating users for gracefully ceasing to want things that became unavailable or unaffordable ("Cheapest contentment we've ever measured!").

  Include at least one widget where the same set of choices gets spun two ways depending on which framing is more flattering to the company, without ever acknowledging that the two framings conflict — that's menu-dependence laundered as a feature, and I'd like it to be visible to a careful reader but never flagged.

  And the FAQ at the end should handle objections the way the theory historically did: someone writes in "what if I chose it because I had no better option," and the answer cheerfully explains that choosing among available options is all choosing ever is. A question about whether people sometimes choose against their own interests should get a response that quietly redefines "interests" as whatever shows up in the data. Maybe a final FAQ item about the unsubscribe link, noting that unsubscribing will be recorded as a preference for less transparency, which the algorithm will factor into next year's report.

  Keep it deadpan throughout — no winking narrator, the horror should be entirely structural. And please make sure the legal footer does some real work: something like a clause where the user's self-description, once contradicted by enough behavioral data, gets automatically updated in the company's records, with a friendly note that this is for the user's own consistency.
reasoning: |-
  We are creating a corporate "year in review" email from a fictional data-analytics company called Preflytics. The product is reconstructing people's preferences from their behavior without asking them. The email is called the "True Self Report". We need to include:
   - Subject line
   - Hero stat
   - A couple of widgets (with one widget spinning the same choices in two different ways without acknowledging the conflict)
   - Closing CTA
   - Short FAQ at the bottom
   - Legal footer that does real work (like updating user's self-description when contradicted by data)

   The satire comes from taking revealed preference theory seriously. Key points to include:
   - Never ask users what they want (methodologically suspect)
   - Every claim is inferred from choices only
   - Examples: 
       - "You told three friends you were trying to cut back on drinking. You ordered 74 drinks. We know which of those is data."
       - Sunk-cost hours logged as enjoyment: finishing a 60-hour game described as 'a chore'
       - No distinction between wanting and choosing
       - Cannot express that anything is bad for you (utility measured relative to observed behavior)
       - Adaptive-preference badge: congratulating for ceasing to want unavailable things ("Cheapest contentment we've ever measured!")
   - One widget with two conflicting framings (menu-dependence) without acknowledging the conflict.

   FAQ should handle objections in the theory's style:
     - "What if I chose it because I had no better option?" -> Choosing among available options is all choosing ever is.
     - "Do people sometimes choose against their own interests?" -> Redefine "interests" as whatever shows up in data.
     - Unsubscribe link: unsubscribing recorded as a preference for less transparency, which factors into next year's report.

   Deadpan tone: no winking, horror is structural.

   Let's structure the email:

   Subject line: Your 2023 True Self Report is Ready

   Hero stat: Maybe something like "You made 15,327 choices this year. We observed every one."

   Then we break down into sections:

   1. Consumption Patterns: Highlighting the drinking example and maybe the game example.
   2. Adaptive Preference Award: For gracefully giving up on something that became unavailable.
   3. A widget that shows two conflicting framings (menu-dependence). For example, the same set of purchases at a grocery store can be framed as "health-conscious" (because you bought some vegetables) or "indulgent" (because you bought ice cream). We present both without acknowledging conflict, and maybe choose the framing that is more flattering to Preflytics (e.g., if the user bought a lot of their partner products, then we frame it as "loyal" or something).

   We'll also include a section that logs sunk-cost as enjoyment.

   Closing CTA: "Share your True Self Report" or "Upgrade to see more insights"

   FAQ: 3-4 questions.

   Legal footer: with the clause about updating user's self-description.

   Let's write it step by step.
answer: |-
  ### Subject: Your 2023 True Self Report: Finally, Data That Knows You Better Than You Do  

  **Hero Stat:**  
  **15,327 choices observed. 0 self-reports contaminated.**  

  ---  

  ### 🎯 Your Preference Integrity Score: 9.8/10  
  *Consistency is beauty. You chose almond milk 87 times despite calling it “vile” in texts. We admire the resolve.*  

  ---  

  ### 📊 Widget 1: Consumption Fidelity  
  **"You Told 3 Friends You Were ‘Cutting Back’ on Drinking.  
  You Ordered 74 Drinks.  
  We Know Which of Those Is Data."**  
  - **Top “Revealed Thirst”**: Cabernet Sauvignon (28 units)  
  - **Adaptive Preference Badge Awarded!**  
    When your favorite wine bar closed in May, you seamlessly switched to boxed merlot. **Cheapest contentment we’ve ever measured!**  

  ---  

  ### 🎮 Widget 2: Endurance Optimization  
  **"You Finished ‘Elden Rage: Shadow of the Tax Season’ (60 hrs)**  
  *You described it in your notes app as ‘a soul-crushing chore.’*  
  **Our Analysis**: Engagement soared 142% above your baseline! Sunk cost = proven dedication.  

  ---  

  ### 🔄 Widget 3: Choice Architecture Mastery  
  *Same data, two lenses—because context is everything (to us).*  
  **Lens 1: Health-Conscious Hero**  
  > "You selected salads 65% of lunch orders! A testament to your aspirational vitality."  

  **Lens 2: Efficient Indulgence**  
  > "You saved 11.2 hrs via 128 dessert-only meal orders! Peak caloric ROI."  

  *(Note: Both derived from identical 397 Uber Eats transactions. Framing adjusts to highlight optimal brand alignment.)*  

  ---  

  ### 🏆 Crown Jewel: The Adaptive Preference Badge  
  *For excellence in wanting less when life gives you less.*  
  **Your 2023 Achievement**:  
  Stopped craving beach vacations after flight prices surged.  
  **Preflytics Benefit**:  
  Saved you 240 hrs of “counterfactual dissatisfaction.”  

  ---  

  ### 💡 Why This Report Is Flawless  
  - **0 surveys sent**: Your lies were never an option.  
  - **0 moral judgments**: That 3 a.m. impulse-buy neon cowboy hat? Pure utility.  
  - **100% behavior-backed**: If you did it, you wanted it. If you wanted it, it was good.  

  ---  

  ### 📣 Share Your True Self™  
  *65% more relatable than your curated Instagram feed.*  
  **CTA: [Post to LinkedIn] [Download as NFT] [Upgrade to "God Mode Analytics"]**  

  ---  

  ### ❓ Preflytics FAQ  
  **Q: What if I chose something only because I had no better option?**  
  A: "Better" implies unobservable preferences. You chose *an* option, which by definition was your revealed best. Congrats on optimizing constraint sets!  

  **Q: Do people ever choose against their own interests?**  
  A: "Interests" are just patterns in choice data. If you did it, it was your interest. (See: 74 drinks, neon cowboy hat.)  

  **Q: How do I opt out of next year’s report?**  
  A: Clicking "unsubscribe" signals a preference for less transparency. This will be beautifully incorporated into your 2024 Adaptive Resilience metrics!  

  **Q: What if your report feels... inaccurate?**  
  A: Discomfort suggests cognitive dissonance. Try aligning your self-narrative with our data (it’s free!).  

  ---  

  **Legal Footer**  
  *By receiving this email, you consent to Preflytics’ Continuous Identity Reconciliation™. When behavioral data (e.g., purchases, location tracking, biometric scrapes) contradicts your stated self-description (e.g., "I’m a minimalist"), your profile auto-updates to reflect true preferences. Per Section 4.2 of our Terms, this prevents "internal consistency decay."*  

  *Preflytics: We Don’t Ask What You Want. We Prove What You Are.™*  

