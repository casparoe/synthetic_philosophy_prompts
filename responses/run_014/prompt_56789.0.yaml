answer: |-
  **Good evening. My name’s [Your Name], and I help run the data side of this project. You might’ve seen our flyer saying this shiny new system will “do what the community tells it.”** (Pause) **Sounds simple, right? Like we just plug in your requests, and out pops the perfect plan. Honestly? If it were that simple, I’d be home watching the game right now. Turns out, figuring out what the “community” is telling us? That’s the whole ball game. And it starts tonight, with you.**

  **(Walking back the flyer)**
  **That flyer wasn’t wrong about your input mattering. It matters immensely. Thousands of you told us exactly what you need: safer sidewalks, more shade, better bus stops. We heard you loud and clear. But here’s the thing the flyer couldn’t capture: the system doesn’t just magically *know* how to add up all those voices into one single “community” answer. It needs rules. Rules we have to choose. Think of it like this: if five kids have one pie, how do you split it? Evenly? By who’s hungriest? By who asked loudest? Every answer feels fair to someone. Our $14 million pie? Same deal. Your requests are the ingredients, but the recipe for combining them? That’s what’s getting written now.**

  **(Three ways to split a pot)**
  **Imagine we only had five districts and three simple rules. Rule One: Split the $14M per person. Every resident counts equally. Fair? Sounds it. But District A, the biggest, gets the most cash. District B, the smallest, gets the least, even if they have crumbling sidewalks. Rule Two: Split by need. We measure heat, tree cover, crash spots – places hurting the most get priority. Fair? Maybe. But now we’re arguing: Is *our* measure of “need” right? Does it miss something vital? Rule Three: One request, one vote. District C’s civic group filed 4,000 requests? They win big. District D, where folks are busy or don’t trust portals? They lose out. Fair? Depends who you ask. Same requests. Same $14M. Three different rules. Three completely different maps of where the work happens. That’s the reality we’re in.**

  **(What you're actually here to decide)**
  **Your job, starting right now, isn’t to argue for your specific sidewalk or bus stop. Not tonight. That comes later. Your first, crucial job is much bigger: **You need to decide *what kind of fairness feels right* for combining all these voices.** Look at those three rules – per person, by measured need, by request volume. Which principle feels closest to how *this* community should decide? Or is there another way entirely? Your task tonight is to grapple with that question head-on. Argue it out. Push each other. See which core idea – which rule for combining everyone’s voice – holds the most water for us. That’s the foundation. Without it, the system isn’t listening to “the community”; it’s just following a rule someone picked in the dark.**

  **(The landing)**
  **This isn't easy. There’s no perfect answer hiding in the data. Every choice means some voices get weighted more than others. That’s not a flaw; it’s the reality of combining thousands of hopes into one plan with limited cash. Your input wasn’t meaningless. It *is* the meaning. Now, you have the hard, necessary work of deciding how those meanings add up. So, let’s get started. Tell me: What kind of fairness should shape this pie?**

  **(What I left out on purpose)**
  1.  **The specific algorithm details.** My engineers are sweating, but diving into the code now would bury the core ethical choice in technicalities. We’ll cover how it *works* later; tonight is about *why* it works that way.
  2.  **Defining "fairness" for you.** That’s your debate, not my lecture. Imposing a definition would violate the ethics board mandate and pre-empt your work.
  3.  **Pre-defining "the community."** I didn’t say "we all want" because we don’t all want the same thing. The rule *creates* the collective outcome; it doesn’t find a pre-existing one. Saying otherwise would repeat the flyer’s mistake.

  **(Word Count: Approx. 620)**
