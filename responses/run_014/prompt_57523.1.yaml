prompt: |-
  I'm a third-year philosophy student in a seminar on social ontology, and for the last six weeks we have been working through David Lewis's analysis in *Convention* (1969): a convention as a self-perpetuating regularity in a recurrent situation of interaction, sustained by everyone's conditional preference to conform given that the others do, by near-universal conformity and the expectation of it, by the fact that this is all common knowledge, and by the arbitrariness of the regularity, in the sense that some alternative would have served the participants' purposes about as well. I did well on the midterm and I can reproduce the apparatus, but the seminar only ever asks the question in one direction — is this practice a convention? — and never in the direction that has become urgent for me. Alongside the course I am one of four volunteer moderators of a student-run subreddit of roughly sixty thousand members covering admissions and course evaluation, a role I have held for two years. We field two or three rule proposals or high-profile enforcement disputes a week. Nobody's welfare depends on our calls, but our credibility does: last spring a badly handled change to our posting-format rules cost us about a fifth of our weekly active posters for a semester, and we are still rebuilding. None of my co-moderators has any philosophy or game-theory training beyond what I relay to them; decisions have to be made within about forty-eight hours and posted publicly with a written justification; and the senior moderator has final sign-off, so anything I hand upward has to be legible to someone who will never read Lewis.

  What I would like is a decision procedure my team could actually run on a proposal or a dispute, derived as faithfully as possible from that analysis. I want an ordered set of questions, and for each one: what would count as a sufficient answer, what evidence a moderator can realistically gather in two days (enforcement logs, whether newcomers converge on the practice without being told, whether deviators justify themselves by appealing to the rule's content or merely to their dislike of it, whether the complainants' preferences are actually conditional on what everyone else does), and where that answer routes. Some routes should terminate in "this is a convention, and therefore this follows about changing it, enforcing it, and excusing deviation from it." Others should terminate in "this is not a convention, and the analysis gives you no tools here" — which is in my experience the more valuable output, since most of our worst fights are cases where we have deployed habit-talk about a rule whose content is anything but arbitrary. I also want the change protocol that accompanies each classification: if a practice is a convention, what does the account imply about how it can be replaced — can an authority simply decree a new equilibrium, or does a decree work only insofar as it renders one of the alternatives salient enough that conditional preferences re-form around it? — and what should we do in the case where nearly everyone privately prefers a different regularity but nobody can coordinate the switch, or where the practice is drifting with no proposal on the table and we need to know whether it is dying or merely being complained about. Alongside all of this, please be explicit about the translation itself. Which of the technical distinctions have to survive into the checklist even though they will sound strange to a lay moderator — I suspect common knowledge and the arbitrariness condition are doing nearly all the work — and which can be collapsed or dropped without changing any verdict we would actually reach? My roommate, who studies development economics, insists that Lewis is only describing a focal point and that the philosophical machinery adds nothing; the document should make it clear what the machinery is contributing that the shorthand would miss. And flag every step where the checklist is really asking a moderator to make a judgment about values — who this community is for, what a practice costs the people it excludes — and merely dressing that judgment in a technical form. Lewis tells us a convention is arbitrary in that another regularity would serve the participants' purposes about as well; I do not think he tells us anything about whether those purposes are worth serving, and I would rather have that limitation stated up front than discovered mid-argument.

  Finally, run the procedure on three live cases of ours. First, a proposal to merge two overlapping post flairs into one: everyone agrees it is trivially arbitrary, yet half the community feels strongly about it for reasons none of us can articulate. Second, our standing prohibition on posting information that identifies a named applicant or a member of staff, which I have been defending in the register of "community norms" and which I suspect your procedure will decline to classify as a convention at all. Third, our English-only rule. On the third, be blunt with me: roughly a third of our members are bilingual and would prefer a rule permitting posts in either language, and I have argued for two years that English-only is an arbitrary historical accident we should simply abolish by fiat at the start of next term. If the analysis implies that we cannot — that several alternative regularities are available, none of them salient, so that relaxing the rule yields a fragmented equilibrium that is worse even for the bilingual members it was meant to serve — then say so plainly and tell me what the procedure recommends instead. I would much rather be corrected in this document than in public. Close with a short list of what the procedure cannot settle at all: the questions it will appear to answer but does not.
reasoning: |-
  Okay, let me approach this systematically. The user is a philosophy student applying Lewis's convention theory to moderate a large subreddit. They need a practical decision tool derived from Lewis's framework, with clear operational steps and real-world application examples. 

  First, I need to distill Lewis's key elements: regularity, preference conditionality, near-universal conformity, common knowledge, and arbitrariness. The challenge is translating these into actionable questions a non-philosophical team can use within 48-hour deadlines. 

  I notice three critical pain points: 
  1) The team lacks technical training but needs to make enforceable decisions 
  2) Most conflicts arise when mislabeling non-conventions as conventions 
  3) There's particular tension around the English-only rule where bilingual members feel excluded

  For the decision procedure, I'll structure it as a flowchart with kill switches where Lewis's framework doesn't apply. The arbitrariness condition seems crucial here - it's the main differentiator between true conventions and rules with inherent value. Common knowledge is harder to verify but can be inferred from newcomer behavior and dispute patterns.

  On the English-only rule case: Lewis's analysis would likely show it's a true convention but with problematic dynamics. The fragmentation risk is real - without coordinated alternatives, removing it could create suboptimal equilibria. The procedure should recommend staged changes rather than abrupt abolition.

  I'll flag where value judgments masquerade as technical analysis, especially around "purposes worth serving." The team needs to recognize when they're making ethical calls versus applying convention theory.

  For the non-identifiable-info rule, it probably fails the arbitrariness test since doxxing protection has inherent value. Calling this a convention was likely a category error - better to frame it as a policy with moral justification.

  The document will end with clear limitations: convention theory can't resolve value conflicts, predict coordination success, or absolve responsibility for harmful norms. It's a diagnostic tool, not a substitute for judgment.
answer: |-
  Here is a Lewis-inspired decision procedure for your moderation team, designed for operational use in 48-hour windows. It prioritizes verifiable evidence over philosophical nuance while preserving core analytical distinctions. **Bolded terms** are non-negotiable technical concepts; *italicized text* indicates value judgments disguised as technical steps.

  ---

  ### **The Convention Decision Procedure (CDP)**
  **Outputs:** 
  - `CONVENTION` (Follow Protocol A for change/enforcement) 
  - `NOT_CONVENTION` (Use non-Lewisian tools; Protocol B)  
  - `INDETERMINATE` (Insufficient evidence; flag for monitoring)

  **Evidence Gathering Constraints:** Use only:  
  1. Subreddit logs (enforcement history, post edits, removal reasons)  
  2. Public comment/post text (user justifications, complaints)  
  3. Modmail archives (user reports, dispute context)  
  4. *Limited* anonymous polling (e.g., "Would you prefer X if most others did?")  
  5. New-user behavior observation (do they "guess" the rule?).

  ---

  ### **The Checklist**
  **Ask in Order – Terminate Early if Possible:**

  1. **Is there a *regularity* in behavior?**  
     - *Evidence:* Logs showing consistent compliance (>80% of relevant cases over 3+ months).  
     - *Sufficient Answer:* Yes + documented pattern.  
     - *Termination:* No → `NOT_CONVENTION` (No regularity to perpetuate).

  2. **Is the regularity *arbitrary*?**  
     - *Evidence:* Existence of ≥1 feasible alternative satisfying the *same underlying purpose* (e.g., "post categorization" for flairs). Check: Would switching to Alternative X *functionally* achieve the same goal?  
     - *Sufficient Answer:* Yes (clear alternatives exist) OR No (this rule uniquely serves a core need).  
     - *Termination:* **No** → `NOT_CONVENTION` (e.g., anti-doxxing rule; alternatives compromise safety).  
     - *CAUTION:* Purpose identification (*why* the rule exists) is a **value judgment**. Lewis assumes purposes are given.

  3. **Are preferences *conditional*?**  
     - *Evidence:*  
       - Poll: "Would you comply if >70% others did?" (Focus on *conditional* preference, not absolute liking).  
       - Comments: Deviators appeal to "but everyone else does X" (conditional) vs. "this rule is stupid" (unconditional dislike).  
     - *Sufficient Answer:* Yes (preferences hinge on others' behavior).  
     - *Termination:* No → `NOT_CONVENTION` (e.g., rule universally hated; compliance is coerced).

  4. **Is there *near-universal conformity*?**  
     - *Evidence:* Logs show <10% violations in past 6 months; new users adopt without explicit instruction.  
     - *Sufficient Answer:* Yes.  
     - *Termination:* No → `INDETERMINATE` (Possible convention collapse in progress).

  5. **Is conformity *common knowledge*?**  
     - *Evidence:*  
       - New users reference rule accurately without being taught.  
       - Violators are corrected *by ordinary users* (not just mods) citing the rule.  
       - Meta-posts discuss the rule *as a shared expectation*.  
     - *Sufficient Answer:* Indirect evidence of mutual awareness (Lewis: "I know that you know that I know...").  
     - *Termination:* No → `INDETERMINATE` (Salience may be weak).

  ---

  ### **Output Protocols**
  #### **Protocol A (`CONVENTION`):**  
  - **Change:** You *cannot* decree a new equilibrium. You must:  
    1. **Make an alternative *salient*:** Pin a proposal, use mod announcements to focus attention.  
    2. **Coordinate critical mass:** Run a time-bound poll requiring supermajority (≥70%) to switch.  
    3. **Phase transitions:** Allow dual compliance during transition (e.g., both old/new flairs).  
  - **Enforcement:** Excuse deviations if conformity drops <70% (conditional preference fails).  
  - **Drift:** If practice is drifting *without* a salient alternative → intervene to stabilize or force salience.

  #### **Protocol B (`NOT_CONVENTION`):**  
  - Lewis provides *no tools*. Decide based on:  
    - **Harm Principle** (does the rule prevent injury?)  
    - **Efficiency** (does it reduce moderation burden?)  
    - **Legitimacy** (was it democratically adopted?).  
  - **Change:** Decrees *are* possible (no coordination problem). Justify transparently.

  ---

  ### **What the Machinery Adds (vs. "Focal Point")**
  - **Conditionality & Arbitrariness** distinguish conventions from:  
    - Moral norms (non-arbitrary → Protocol B).  
    - Personal habits (no conditional preference → not a convention).  
  - **Common Knowledge** explains why conventions persist without enforcement: users *mutually* police them.  
  - **Focal Point** is necessary but *insufficient*: A convention is a *self-sustaining* focal point stabilized by conditional preferences.

  ---

  ### **Application to Your Cases**
  #### **1. Post Flair Merger (Proposal)**  
  - Regularity: Yes (current flairs used consistently).  
  - Arbitrariness: **Yes** (merger serves same categorization purpose).  
  - Conditional Preference: Poll shows 80% prefer merger *if others adopt*.  
  - Conformity: High. Common Knowledge: Yes (users correct flair misuse).  
  - **VERDICT:** `CONVENTION` → Use **Protocol A**.  
  - **Action:** Make the merger salient (sticky post), run binding 72-hour poll. If ≥70% yes, implement with 2-week dual-use period. *Do not* decree unilaterally.

  #### **2. Anti-Doxxing Rule**  
  - Regularity: Yes.  
  - Arbitrariness: **No**. Alternatives (e.g., "allow names with consent") *do not* serve the core purpose (preventing harm/stalking). Safety is non-negotiable.  
  - **VERDICT:** `NOT_CONVENTION` → Use **Protocol B**.  
  - **Action:** Defend as a *policy* (not convention). Justify via harm prevention. No need for community coordination to maintain.

  #### **3. English-Only Rule**  
  - Regularity: Yes.  
  - Arbitrariness: **Yes** (bilingual posts could serve discussion equally well).  
  - Conditional Preference: Poll: 60% of bilinguals prefer English-only *if others comply* (fear fragmentation).  
  - Conformity: High. Common Knowledge: Yes.  
  - **VERDICT:** `CONVENTION` → Use **Protocol A**.  
  - **Analysis:** Your intuition is half-right. The rule *is* arbitrary, but abolishing it by fiat ignores coordination. Without salience, fragmentation is likely:  
    - Bilinguals post in native languages → Monolinguals disengage → Bilinguals revert to English to be understood → Chaotic equilibrium.  
  - **Action:**  
    - **Stage 1:** Propose *specific* alternatives (e.g., "Non-English posts require an English summary").  
    - **Stage 2:** Make it salient (dedicated discussion thread, mod endorsement).  
    - **Stage 3:** Run poll requiring ≥70% support to change.  
    - If poll fails, the convention holds → Revisit in 6 months.  

  ---

  ### **What the CDP Cannot Settle**  
  1. **Whether a purpose is worth serving** (e.g., "Is post categorization valuable?"). Lewis assumes purposes are given.  
  2. **Which equilibrium is "best"** if multiple exist. CDP only identifies conventions, not their goodness.  
  3. **Moral obligations** (e.g., "Should we accommodate non-English speakers?"). Protocol A handles coordination, not justice.  
  4. **Predicting success** of a salience maneuver. CDP flags *how* to attempt change, not whether it will work.  
  5. **Power imbalances**. Lewis ignores how "common knowledge" can be manufactured by authorities or vocal minorities.  

  ---

  ### **Key Translation Notes**  
  - **Preserve:** Arbitrariness (vs. necessity), Conditionality (vs. intrinsic preference), Common Knowledge (vs. mere awareness).  
  - **Collapse:** "Recurrent situation" (assumed in online communities), "Self-perpetuating" (covered by other conditions).  
  - **Value Judgments Disguised:** Purpose identification (Step 2), "Feasible alternative" assessment (Step 2).  

  This procedure won’t spare you hard choices, but it will prevent misdiagnosing *coordination problems* as *normative disagreements* (and vice versa). When Lewis is silent, own the values: *"We keep this not because it’s a convention, but because it protects vulnerable people"* is stronger than forcing his framework where it doesn’t fit.
