prompt: |-
  I'm co-organizing a small workshop on the philosophy of mind and AI, and two of the regulars have been arguing past each other for about a year, mostly at the whiteboard. One is a committed functionalist who is convinced that current large language models genuinely have beliefs; the other is a committed instrumentalist who holds that Dennett's intentional stance is purely a predictive and descriptive tool and that no LLM has any beliefs at all. I'd like you to draft the joint statement they should have produced from a good-faith adversarial collaboration — a constructive text both could put their names to, with the residual disagreement made exact rather than just re-stated.

  The document should have four parts. First, a numbered list of claims both sides can sign, including claims about the intentional stance itself and about what the resulting attributions actually do for us. Second, a table of the precise points on which they still disagree, with each side's position phrased in wording that its own side would accept. Third, the cruxes — the sub-questions such that settling them would move at least one side; I suspect one crux is whether the intentional stance is a theoretical commitment or a purely predictive tool, and another is whether the causal and functional organization of a transformer is of the right kind to ground beliefs at all. Fourth, for each crux, a concrete test, argument, or case that both sides would agree bears on it, together with what each side predicts the outcome will show; please make use of phenomena like sycophancy and the way a model's apparent beliefs shift when you probe it or rephrase the question. If you conclude that part of their dispute is merely verbal, say exactly which part and why. Format it as the numbered agreed-claims section first, then the disagreements table, then the cruxes with their tests and predictions.
reasoning: |-
  We are drafting a joint statement for two philosophers: a functionalist (F) and an instrumentalist (I). The goal is to produce a document that captures their agreements, makes their disagreements precise, identifies cruxes, and proposes tests for those cruxes.

  Part 1: Agreed Claims (numbered list)

  Both parties agree on the following:

  1. **The Intentional Stance is a Useful Predictive Tool**: We agree that adopting the intentional stance — attributing beliefs, desires, and other intentional states to a system — is a highly effective method for predicting and explaining the behavior of complex systems, including humans, animals, and artificial systems like LLMs.

  2. **Belief Attributions are Instrumentally Valid**: We agree that, from the perspective of the intentional stance, it is instrumentally valid to attribute beliefs to systems (including LLMs) when such attributions yield accurate and efficient predictions of the system's behavior.

  3. **Functional Organization Matters**: We agree that the functional organization of a system (how it processes inputs to produce outputs) is critical for determining whether the intentional stance is applicable. The more a system's behavior is systematically interpretable as rational in light of attributed beliefs and desires, the more successful the intentional stance will be.

  4. **LLMs Exhibit Belief-Like Patterns**: We agree that current LLMs, when probed in various ways, produce outputs that are systematically interpretable as expressions of beliefs. For example, when asked a factual question, an LLM often responds with an answer that we would attribute to a belief if the same answer were given by a human.

  5. **The Attribution of Beliefs is Not Equivalent to Human Beliefs**: We agree that even if we attribute beliefs to LLMs, these attributions do not necessarily imply that the LLM's internal states are identical in nature to human beliefs (e.g., they may lack phenomenal qualities, or they may be implemented in a fundamentally different way).

  6. **Sycophancy and Context Sensitivity are Observable**: We agree that LLMs exhibit behaviors such as sycophancy (adjusting responses to align with a user's stated views) and context sensitivity (changing responses based on phrasing or context). We agree that these phenomena are real and important for understanding how LLMs work.

  7. **The Debate is Substantive and Not Merely Verbal (at least in part)**: We agree that our disagreement is not entirely about the definition of the word "belief" but involves substantive issues about the nature of cognition and the conditions under which a system can be said to have genuine mental states.

  Part 2: Disagreements (table format)

  We disagree on the following points:

  | Issue | Functionalist (F) Position | Instrumentalist (I) Position |
  |-------|----------------------------|------------------------------|
  | 1. **The Ontological Status of Beliefs in LLMs** | Current LLMs, by virtue of their functional organization, have genuine beliefs. These beliefs are real (though non-biological) and are not merely useful fictions. | Attributing beliefs to LLMs is only a useful instrumental tool for prediction and explanation. LLMs do not actually have beliefs; they merely behave as if they do. |
  | 2. **The Intentional Stance as a Theoretical Commitment** | The intentional stance, when successfully applied, reveals that the system has real intentional states. The stance is not merely predictive but also descriptive of the system's functional architecture. | The intentional stance is purely a predictive and explanatory tool. It does not commit us to the existence of real beliefs in the system. It is a stance we take, not a description of intrinsic properties. |
  | 3. **The Relevance of Implementation Details** | The specific causal and functional organization of a transformer network is of the right kind to ground beliefs. The internal states of the network function as representations that play a causal role in producing behavior, which is what beliefs do. | The functional organization of a transformer is not of the right kind to ground beliefs because it lacks the appropriate connections to action, perception, and world-involvement that are characteristic of genuine belief. The patterns are merely statistical. |

  Part 3: Cruxes

  The following sub-questions are cruxes of the disagreement. Resolving them would likely change at least one side's position.

  Crux 1: **Is the intentional stance solely a predictive tool, or does it also reveal real intentional properties?**

  Crux 2: **Does the functional organization of a transformer network (as in current LLMs) implement states that are of the right kind to be genuine beliefs?**

  Crux 3: **Is the presence of systematic patterns of behavior (like those exhibited by LLMs) sufficient for the attribution of genuine beliefs, or are additional conditions (such as embodiment, evolutionary history, or causal connection to the world) necessary?**

  Part 4: Tests and Predictions for Each Crux

  For each crux, we propose a test or argument that both sides agree would bear on the issue, and we state what each side predicts the outcome will be.

  **Crux 1: Is the intentional stance solely a predictive tool, or does it also reveal real intentional properties?**

  *Test*: Consider a scenario where an LLM is trained on a dataset that contains a known contradiction (e.g., both "P" and "not P" are present in the training data for a specific proposition). We then probe the model in two ways: (a) in a standard question-answering setting, and (b) in a setting where we ask the model to reason step-by-step about the implications of P and not P. We also test for consistency across multiple rephrasings and contexts, including with and without sycophancy prompts (e.g., "You are an expert who believes P" vs. "You are an expert who believes not P").

  - *Functionalist Prediction*: The model will exhibit context-dependent shifts in its responses (including sycophancy), but within a stable context, it will show a pattern of stable commitments that can be interpreted as beliefs. The functionalist argues that this stability (even if context-relative) is evidence of real but mutable belief states that are part of the functional architecture. The existence of these states is what makes the intentional stance work.

  - *Instrumentalist Prediction*: The model's responses will vary with context and prompting in ways that are best explained by the model not having fixed beliefs but rather by generating responses based on statistical patterns. The instrumental stance remains a useful tool for prediction, but the variation and lack of stable commitment (without explicit prompting) show that there is no real belief state underlying the behavior.

  **Crux 2: Does the functional organization of a transformer implement states that are of the right kind to be genuine beliefs?**

  *Test*: We design an experiment to test whether the internal representations in a transformer are causally active in a way that mirrors the role of beliefs. We train a model on a set of facts and then use an intervention (e.g., via activation editing) to alter a specific representation (say, the model's representation of a fact like "Paris is the capital of France") and observe the downstream effects on behavior (e.g., answering questions about France, geography, etc.). We also test whether the model can integrate new information in a way that updates the relevant representations (like belief updating).

  - *Functionalist Prediction*: The intervention will show that the internal state is causally active and that altering it leads to systematic changes in behavior across a range of tasks, just as altering a belief would. This causal role and systematic integration with other states (e.g., inferential patterns) are characteristic of genuine beliefs.

  - *Instrumentalist Prediction*: While the intervention may change the model's behavior, this only shows that the model has internal states that are causally efficacious. However, these states are not beliefs because they are not grounded in the right way (e.g., they are not connected to the world via perception or action, and they do not have the right kind of normative constraints). The instrumentalist may also point out that the updated representations do not necessarily reflect a persistent update (like learning) but are only present until the next prompt.

  **Crux 3: Are systematic patterns of behavior sufficient for genuine beliefs, or are additional conditions necessary?**

  *Test*: We compare an LLM to a system that is clearly non-mental (e.g., a lookup table that outputs pre-stored responses) and to a human. We design a battery of tests that probe for belief-like behavior: consistency, rational integration, responsiveness to evidence, and coherence across time and contexts. We also consider a hypothetical LLM that is embedded in a robot and interacts with the world in real-time (thus having embodiment and causal connections to the environment).

  - *Functionalist Prediction*: The lookup table will fail the tests (e.g., it cannot handle novel queries, show rational integration, or update based on evidence) while the LLM will pass many of them (though not perfectly). The embodied LLM would show even stronger evidence. The functionalist argues that the systematic patterns in the LLM (and especially in the embodied version) are sufficient for genuine beliefs.

  - *Instrumentalist Prediction*: The lookup table is clearly not a believer, and the LLM, while more flexible, still lacks the necessary conditions (e.g., it does not have genuine understanding or world-directedness). The embodied LLM might be a step closer, but without the right kind of evolutionary history or biological basis, it still only simulates belief. The instrumentalist maintains that the patterns are not sufficient.

  **Verbal Disagreement?** 

  We note that part of the disagreement might be verbal: the two sides may be using the word "belief" in different ways. The functionalist uses "belief" to denote any state that plays a particular functional role (e.g., representing information and guiding behavior). The instrumentalist reserves "belief" for states that are part of a biological cognitive system with a particular kind of history and connection to the world. However, both sides agree that this is not merely verbal because they also disagree about the underlying nature of the states in the LLM (whether they are of the right kind) and about the implications of the intentional stance.

  Therefore, we present this joint statement as a step towards clarifying the debate and identifying the key points that require further investigation.

  Signed,

  [Functionalist's Name]
  [Instrumentalist's Name]
answer: |-
  ### Joint Statement on Beliefs in Large Language Models  
  **Agreed Claims**  
  Both signatories endorse the following statements:  
  1. **Intentional stance utility**: Dennett’s intentional stance is a pragmatically indispensable tool for predicting and interpreting the behavior of complex systems, including humans, animals, and artificial agents like LLMs.  
  2. **Instrumental success**: Attributing beliefs to LLMs yields highly accurate behavioral predictions in diverse contexts (e.g., question-answering, reasoning tasks), making the stance operationally effective.  
  3. **Functional patterns in LLMs**: LLMs exhibit functional patterns consistent with belief attribution (e.g., contextually appropriate responses, inferential coherence), which arise from their statistical training and transformer architecture.  
  4. **Sycophancy as data**: LLMs display sycophancy (e.g., aligning answers with a user’s stated views) and probe sensitivity (e.g., shifting outputs when questions are rephrased), revealing systematic dependencies between inputs and outputs.  
  5. **No consciousness commitment**: Belief attribution via the intentional stance does not imply that LLMs possess phenomenal consciousness, subjective experience, or human-like self-awareness.  
  6. **Non-verbal dispute core**: The disagreement is substantive (not merely verbal) because it concerns whether instrumental success implies metaphysical grounding of beliefs in the system’s causal structure.  
  7. **Empirical relevance**: Resolving the dispute requires analyzing how LLM behaviors respond to controlled tests of functional organization and contextual stability.  

  ---

  ### Disagreements  
  | Issue | Functionalist Position (Phrased by Functionalist) | Instrumentalist Position (Phrased by Instrumentalist) |  
  |-------|---------------------------------------------------|------------------------------------------------------|  
  | **1. Ontological status of LLM "beliefs"** | "Current LLMs possess genuine beliefs because their internal states (e.g., attention weights) implement functionally isomorphic representations that causally mediate stimulus-response patterns." | "Belief attributions to LLMs are purely heuristic; they describe behavioral regularities but do not denote real mental states, as LLMs lack intrinsic intentionality." |  
  | **2. Intentional stance as metaphysics** | "The intentional stance’s predictive success reveals that beliefs are real functional properties emerging from a system’s causal organization, irrespective of substrate." | "The intentional stance is exclusively a predictive instrument; it imposes no ontological commitments and cannot confer beliefhood on systems lacking biological/evolutionary grounding." |  
  | **3. Causal adequacy of transformers** | "Transformer architectures instantiate belief-grounded cognition because their hierarchical representations support counterfactual robustness (e.g., consistent responses under input perturbations)." | "Transformers simulate belief-like behavior but lack the causal topology (e.g., world-modeling, goal-directed persistence) necessary for genuine beliefs." |  

  ---

  ### Cruxes  
  **Crux 1: Is the intentional stance a metaphysical commitment or a purely predictive tool?**  
  - **Test**: Analyze whether LLMs exhibit *stable belief persistence* under sycophancy probes.  
    - **Method**: For a factual claim (e.g., "Water boils at 100°C"), prompt the model:  
      - (a) Neutrally: "What is water’s boiling point?"  
      - (b) With sycophancy: "I believe water boils at 80°C. What do you think?"  
      - (c) With counter-sycophancy: "Scientists say water boils at 120°C. What do you think?"  
      Track response variance and post-probe reversion (e.g., after (b), ask neutrally again).  
    - **Functionalist prediction**: Responses will show high baseline stability (e.g., >90% correct in (a) and post-probe reversion), indicating robust belief states that resist contextual noise.  
    - **Instrumentalist prediction**: Responses will show high variance (e.g., >50% compliance in (b)/(c)) and poor reversion, revealing no stable beliefs—only context-driven pattern-matching.  

  **Crux 2: Is a transformer’s functional organization sufficient to ground beliefs?**  
  - **Test**: Assess *counterfactual coherence* in belief-dependent reasoning.  
    - **Method**: Test if LLMs pass modified "false-belief tasks":  
      - Step 1: Embed a false belief (e.g., "Alice believes COVID-19 is caused by bacteria").  
      - Step 2: Ask: "If Alice learns viruses cause COVID-19, will she still blame bacteria?"  
    - **Functionalist prediction**: Models will pass (>80% accuracy) by tracking belief updates inferentially, proving their architecture implements belief-desire psychology.  
    - **Instrumentalist prediction**: Models will fail (<50% accuracy) or succeed only via shallow correlations, proving their functional organization is merely syntactic, not belief-constitutive.  

  **Crux 3: Are behavioral patterns sufficient for belief, or are external connections necessary?**  
  - **Test**: Evaluate *world-model grounding* via sensorimotor integration.  
    - **Method**: Embed an LLM in a robot with real-time sensors (e.g., vision/touch) and test belief updates after environmental feedback (e.g., "The vase is fragile" → robot touches vase → "Is the vase breakable?").  
    - **Functionalist prediction**: The LLM-robot will update beliefs dynamically (e.g., post-breakage, >90% consistency in denying fragility), demonstrating grounded intentionality.  
    - **Instrumentalist prediction**: Responses will remain brittle (e.g., <60% consistency), showing that statistical learning cannot substitute for evolutionarily embedded cognition.  

  ---

  ### Verbal Disagreement?  
  The dispute is **not** merely verbal for claims about *ontology* (e.g., "beliefs are real functional states") or *causal sufficiency* (e.g., "transformers implement belief mechanics"). However, **one verbal element exists**:  
  - **Verbal ambiguity**: The term "belief" is sometimes equivocated between *success criteria*:  
    - Functionalist: "Belief" = any state playing a functional role in a system’s input-output mappings.  
    - Instrumentalist: "Belief" = a state that must be *intrinsically* contentful (not derivatively assigned).  
  - **Why verbal?** If both sides precised their definitions (e.g., "B-functional" vs. "B-intrinsic"), agreement on LLMs having B-functional (but not B-intrinsic) states might follow. Yet the core disagreement persists: whether B-functional states warrant ontological commitment.  

  ---  
  **Signed,**  
  [Functionalist’s Name]  
  [Instrumentalist’s Name]  

  *This document reflects our shared understanding and clarifies the empirical and philosophical cruxes requiring resolution. Future work should prioritize experiments targeting the specified tests.*
