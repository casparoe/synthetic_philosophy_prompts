  Here’s a draft that leans into performatives while keeping warmth and accessibility, with structural philosophy woven invisibly into the fabric. The tone is sincere, ceremonial, and subtly playful for those in the know.

  **The Remarks:**

  "Friends, family, loved ones – especially [Grandmother's Name], thank you for being here. Truly, *thank you*. That means something, right now, coming from all of you. Your presence isn't just a fact; it's a gift to [Partner 1] and [Partner 2], and it matters.

  [Partner 1], [Partner 2] – look around. Really look. See them? These are *your* people. They didn't just show up to witness a moment; they showed up to stand *with* you, for you, as you step into this. That’s not just nice; that’s powerful.

  Now, anyone who knows me knows I think a lot about words. What they *do*, not just what they *say*. And honestly? Today, the words that matter most aren’t mine. They’re yours. In a moment, you’ll each speak promises – words that aren’t descriptions of how you feel *right now*, but actions you take to build what comes *next*. Promises that, spoken here, like this, surrounded by all this love and intention… well, they change things. They start something real.

  But before you speak those world-changing words to each other, there’s one thing I need to say, standing right here as your friend and the one tasked with holding this space: **I stand with you both, completely and without reservation, in this step you're taking.**  

  So then. With the weight of these promises, witnessed by this gathering whose presence actively supports you… [Partner 1] and [Partner 2], are you ready to marry each other?"

  *(Proceed immediately to the declaration/vows: "Repeat after me..." or "Do you, [Partner 1]...")*

  ---

  **Choices Rooted in Philosophy & Audience Consideration:**

  1.  **"Thank you. That means something, right now, coming from all of you." / "...they showed up to stand *with* you..."**
      *   **Philosophical Choice:** This avoids the descriptive assertion ("Your presence is wonderful/supportive") and instead performs gratitude ("Thank you") and interprets the act of gathering as an illocutionary act of support ("stand *with* you"). It highlights the *performative force* of their attendance (like Austin's "I give and bequeath" relying on context). The "That means something" subtly nods to the conditions for a performative's success without naming them.
      *   **Alternative (Descriptive):** "It's wonderful to see everyone here supporting [P1] and [P2]." (Asserts a state, doesn't *do* anything with the act of gathering).

  2.  **"Promises that, spoken here, like this, surrounded by all this love and intention… well, they change things. They start something real."**
      *   **Philosophical Choice:** This directly addresses the core Austin idea – performatives as actions that bring about change ("change things," "start something real"). It references the "felicity conditions" implicitly ("spoken here, like this, surrounded...") – the context that makes the utterance *work*, preventing a misfire. The warm phrasing ("love and intention") makes it accessible, while "change things" is the punchline for the philosophers. The hint of "hollow" performatives is in the contrast implied by "real."
      *   **Alternative (Descriptive/Lecture):** "According to speech act theory, your vows are performative utterances requiring specific contextual conditions to be valid..." (Death in this setting!). Or a bland description: "Your promises are very important."

  3.  **The Explicit Avowal: "I stand with you both, completely and without reservation, in this step you're taking."**
      *   **Philosophical Choice:** This is the unambiguous avowal. It's not describing an inner state ("I feel supportive") which could be true or false. It's *taking a stand*, assuming responsibility *for* supporting them *in this specific act* ("this step"). Its force lies in the public commitment by the officiant *at that moment*, making explicit the officiant's necessary role and sincerity (guarding against the "abuse" where the officiant doesn't mean it). "Completely and without reservation" emphasizes the absence of the "hollow" condition.
      *   **Alternative (Descriptive/Assertion):** "I know you two are made for each other and will be very happy." (The exact kind of assertion the user lacks standing to make and wants to avoid).

  **Key Structural Philosophy in Action:**

  *   **Performative Arc:** The speech builds from thanks (performative) -> interpreting gathering as support (performative force) -> explaining vows as action (performative core) -> officiant's avowal (performative commitment) -> transition to the primary performative (declaration/vows).
  *   **Avoiding Assertions:** Descriptions of the couple or predictions are scrupulously avoided. Focus stays on acts: thanking, supporting, promising, standing with, marrying.
  *   **Austin Invisible:** The misfire/abuse concepts are hinted at through the *positive* framing of what makes it work ("spoken here, like this, surrounded...", "completely and without reservation") and the contrast implied by "real." Academics will hear Austin; others hear warmth and sincerity.
  *   **Warmth & Inclusivity:** Plain language, direct address, emphasis on communal support ("your people," "all this love"), acknowledgment of key family members, and a clear, concise structure keep it engaging for all. The "words that matter most aren't mine" line gracefully deflects potential expectation of philosophical grandstanding.

  This draft grounds the ceremony's power in the *doing* of words, satisfies the philosophical rigor required by the user's expertise and the academic guests, and remains heartfelt, clear, and ceremonial for the entire diverse audience. The avowal line anchors the officiant's sincere commitment, making the subsequent declaration felicitous. Good luck – it sounds like a wonderful occasion!
