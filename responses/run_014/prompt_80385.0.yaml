answer: |-
  ## Research Proposal: Decomposing the Boundary Problem – Franchise vs. Jurisdiction in Democratic Theory

  **1. Research Question:**
  Can the "boundary problem" (the question of who constitutes the *demos*) be productively resolved by decomposing it into two distinct normative questions with potentially different answers: (a) the *franchise question* (Who qualifies for formal voting rights as an input into collective decision-making?), and (b) the *jurisdictional question* (Whose fundamental interests must be legitimately accounted for in the *output* of decisions, and who is thereby bound by them, irrespective of voting rights?)? Further, does applying the "all-affected" principle primarily to the jurisdictional question, and alternative principles (like "all-subjected" or territorial citizenship) to the franchise question, resolve persistent puzzles like the "unbounded demos" objection better than treating the boundary problem as a single question?

  **2. Existing Positions and the Conflation Problem:**
  The literature predominantly treats the boundary problem as a singular question ("Who *is* the demos?"), leading to competing, seemingly incompatible principles:

  *   **Territorial Residence:** Defines the demos based on physical presence within a state's borders. *Problem:* Fails to capture non-residents significantly affected by decisions (e.g., global supply chain workers, downstream pollution victims) and struggles with non-citizen residents lacking voting rights despite being bound.
  *   **Civic Citizenship:** Defines the demos as those holding formal legal citizenship. *Problem:* Creates large classes of long-term resident non-citizens bound by laws without input, and excludes non-citizens significantly affected externally, raising legitimacy concerns about the scope of binding power.
  *   **The "All-Affected" Principle (AAP):** Often proposed as the solution: "All those affected by a decision should have a say in it." *Problem:* As commonly interpreted (especially as a franchise criterion), it appears to demand an impossibly large, fluid, and indeterminable demos for most decisions (the "unbounded demos" objection). Defining "affected" precisely is notoriously difficult (minimal threshold? causal chains?).
  *   **The "All-Subjected" or "All-Able-to-Affect" Principle:** Responds to AAP's indeterminacy, suggesting the demos should be those *subject to the coercive authority* of the decision-making body or those with sufficient *capacity to participate effectively* in its processes. *Problem:* Can seem overly restrictive, potentially excluding those profoundly affected but not directly coerced (e.g., foreign victims of environmental externalities) or unable to participate practically (e.g., future generations, severely disabled individuals).

  **The Conflation and Apparent Conflict:** The core issue, as identified, is that these principles are often debated *as if answering the same question*. Crucially, **AAP and the "all-subjected"/"all-able-to-affect" principles look like direct competitors precisely because the fundamental distinction between the *franchise* (input) and *jurisdiction/accountability* (output) is obscured.** AAP, when used as a *franchise* criterion, leads to unboundedness. The "all-subjected" principle is often proposed *as a solution to this franchise problem*, but it then faces criticism for excluding the affected. This paper argues this conflict arises from a category error: AAP is fundamentally a principle concerning the *legitimacy of the scope of a decision's binding power and its moral constraints* (jurisdiction/accountability), not a workable criterion for distributing the *franchise*. Conversely, principles like "all-subjected" or territorial citizenship might be more plausible for delimiting a feasible, effective franchise body.

  **3. Methodology: Conceptual Analysis and Case Testing**
  This project employs analytical political philosophy, specifically conceptual decomposition and normative argumentation tested against key cases.

  *   **Conceptual Decomposition:**
      *   Precisely define and distinguish "franchise" (right to vote/formal input), "jurisdiction" (legitimate scope of binding authority), and "accountability" (mechanisms to ensure affected interests are considered, even without a vote).
      *   Reconstruct standard arguments for AAP, focusing on its core normative intuition: decisions impacting fundamental interests require justification *to those affected*. Argue this intuition speaks primarily to the *legitimacy conditions of the decision's reach* (jurisdiction/accountability), not necessarily to enfranchisement.
      *   Reconstruct the "unbounded demos" objection *specifically as an objection to AAP-as-franchise-criterion*, showing how it dissipates when AAP is relocated to the jurisdictional question.
      *   Articulate the proposed model: A legitimate political community requires (a) a bounded franchise (F) defined by a feasible principle (e.g., all-subjected, territorial citizenship), and (b) a jurisdictional boundary (J) defined by the AAP, where J is a *superset* of F. The gap (J minus F) must be addressed through non-electoral accountability mechanisms (e.g., diplomatic channels, international law, human rights protections, stakeholder consultation, fiduciary duties of representatives).

  *   **Testing Against Puzzle Cases:** The decomposition will be evaluated by applying it to paradigmatic boundary problems:
      *   **Non-Resident Workers:** A state changes corporate tax law, drastically affecting foreign factory workers supplying its market. *Franchise (F):* Likely only resident/citizen voters. *Jurisdiction (J):* Includes the workers (significantly affected). *Resolution:* Legitimacy requires mechanisms ensuring their interests are considered/represented (e.g., trade agreements, corporate codes of conduct enforced by their *own* state, international labor standards), not necessarily giving them a vote in the taxing state.
      *   **Transboundary Environmental Regulation:** State A regulates a river polluting State B. *F (A):* Citizens/residents of State A. *J:* Includes citizens/residents of State B. *Resolution:* Legitimacy requires State A to account for State B's interests via treaties, joint commissions, international law – not enfranchising State B's populace in State A's elections.
      *   **Non-Citizen Residents:** Long-term immigrants pay taxes, follow laws, but lack voting rights. *F:* Citizens. *J:* Includes all residents subject to state coercion. *Resolution:* Legitimacy requires robust accountability mechanisms for non-citizen residents (e.g., access to courts, local voting rights, consultative bodies, path to citizenship) short of full national franchise *if* citizenship is the franchise principle. The AAP (jurisdiction) highlights why their exclusion from *all* input is problematic and demands justification/mitigation.

  *   **Contingency Plan (If Decomposition Fails):** If key cases reveal the distinction is untenable or AAP *must* fundamentally include a franchise claim, the project would pivot to diagnosing why the conflation is so persistent or exploring hybrid models where AAP indirectly constrains franchise principles. Failure might also involve showing accountability mechanisms are insufficient to bridge the J-F gap, collapsing the distinction back into a single problem.

  **4. Success and Failure Criteria:**

  *   **Success:** The project succeeds if it:
      *   Clearly and persuasively establishes the conceptual and normative distinction between the franchise and jurisdictional questions.
      *   Demonstrates that applying AAP primarily to jurisdiction resolves the "unbounded demos" objection *as leveled against franchise criteria*.
      *   Shows that the decomposition provides a clearer, more coherent, and normatively satisfying framework for analyzing and addressing the puzzle cases than treating the boundary problem monolithically.
      *   Persuades a reasonable reader that the conflation of these questions is a significant source of confusion in the literature.
  *   **Failure:** The project fails if it:
      *   Cannot overcome the objection that "affected interests" inherently demand direct franchise (collapsing the distinction).
      *   Fails to provide plausible, normatively adequate accountability mechanisms for the J-F gap in key cases.
      *   Shows that the decomposition does not yield clearer answers than existing approaches or creates new, worse problems.
      *   Is unable to demonstrate that the distinction isn't already implicitly recognized or adequately addressed within existing frameworks.

  **5. Scope Assessment and Feasibility:**

  A 7,000-word, one-semester paper requires strict focus. To ensure feasibility:

  *   **Core Focus:** The paper will concentrate on the *conceptual decomposition argument* and its application to the *three core puzzle cases* (non-resident workers, transboundary environment, non-citizen residents). This provides depth and clear testing grounds.
  *   **Essential Cuts:**
      *   **Comprehensive Literature Review:** While engaging key arguments for major principles (territorial, civic, AAP, all-subjected), a full historical or exhaustive survey of all nuances and contributors is impossible. Engagement will be targeted to support the core argument about conflation.
      *   **Deep Dives into Accountability Mechanisms:** While crucial to the model, the paper cannot develop a full theory of transnational or non-electoral accountability. It will outline plausible *types* of mechanisms (e.g., representation via other states/NGOs, international law, direct consultation, rights protections) and argue they *can* suffice for legitimacy in principle, without specifying detailed institutional designs for each case.
      *   **Other Boundary Cases:** Cases like children, future generations, or animals, while relevant to AAP's scope, are highly complex and will be mentioned only briefly to illustrate the *jurisdictional* scope challenge, not treated in depth. The focus remains on adult human agents in standard political contexts.
      *   **Empirical Analysis:** The argument is purely conceptual and normative. No empirical study of existing systems will be undertaken.
      *   **Alternative Franchise Principles:** While arguing that principles *like* "all-subjected" or territorial citizenship are plausible for F, the paper won't exhaustively defend one specific franchise principle over others. It will argue that *some* bounded principle is needed and feasible for F, distinct from J defined by AAP.
  *   **Realistic Output:** The paper will present a clear, well-argued case for the decomposition as a valuable framework, demonstrate its application and advantages in key areas, and acknowledge limitations and necessary future work (e.g., fleshing out accountability).

  This focused scope allows for a rigorous development of the core thesis within the word and time constraints, making a significant conceptual contribution to understanding the boundary problem by challenging its fundamental framing.
