  For the procedure design, I'm considering starting with 正名 to establish relationships before problems. This anchors everything. Then obligations mapping with asymmetric virtues - critical for power imbalance cases. Conflict resolution must stay contextual (no universal hierarchy) but may need fallbacks when context fails. 

  The abusive cases worry me most. Role ethics could backfire if misapplied as cultural cover for harm. Need explicit checkpoints: when "duty" arguments cross into coercion, and clear referral criteria. Also flagging where mediator judgment sneaks in - like determining if a claim is genuinely role-based or abusive.

