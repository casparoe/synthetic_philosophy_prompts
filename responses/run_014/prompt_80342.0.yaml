answer: |-
  Here’s a structured decision procedure grounded in Confucian role ethics, designed for 50-minute peer mediation sessions. It prioritizes **relational ontology**, **rectification of names (正名)**, **asymmetric obligations**, and **contextual adjudication of conflicts**. The procedure halts for safety/legal issues or when value judgments belong solely to the parties.

  ---

  ### **Role Ethics Mediation Procedure**  
  *(Time allocation per step is flexible; total ≤ 50 mins)*  

  #### **Step 1: Rectify Names (正名)**  
  **Question:** *"Let’s start by naming how each of you sees your relationship to the others here. For example: ‘I am X’s elder brother,’ ‘Y is my employer.’ Be specific."*  
  **Rationale:** Establishes the *hub-and-web relational structure* of selves. Identifies which of the Five Relations (or modern analogues) are in play.  
  **Sufficient Answer:** Clear relational labels acknowledged by all parties (e.g., "mother/daughter," "family business owner/employee son").  
  **Stop & Refer If:** Relationships involve legally actionable abuse (violence, theft) or require court intervention (e.g., conservatorship).  
  **Judgment Call:** Whether a party’s self-identified role is reasonably recognizable (e.g., "I’m the family guardian" may need probing).  

  #### **Step 2: Map Role Obligations & Virtues**  
  **Question:** *"What do you believe [Role A] owes to [Role B]? What does [Role B] owe to [Role A]? How are these different?"*  
  **Rationale:** Forces articulation of *asymmetric obligations* (e.g., parent’s *benevolence* (仁) vs. child’s *filial piety* (孝)). Modern relations use analogues (employer’s fairness vs. employee’s diligence).  
  **Sufficient Answer:** Asymmetry acknowledged (e.g., "As a parent, I should guide my child, but my child doesn’t guide me").  
  **Stop & Refer If:** Obligations violate laws (e.g., "My son must forge documents for me").  
  **Value Judgment Flag:** When parties irreconcilably disagree on core duties ("A parent must control a child’s marriage" vs. "Parents shouldn’t interfere").  

  #### **Step 3: Identify Role Conflict or Distortion**  
  **Question:** *"Which of these obligations feel impossible to fulfill right now? Is anyone asking you to act outside your role?"*  
  **Rationale:** Surfaces *genuine role conflicts* (e.g., caregiver vs. spouse) or *role weaponization* (invoking piety to justify harm).  
  **Sufficient Answer:** Clear statement of tension (e.g., "My role as daughter requires living near Mom, but my role as wife requires moving").  
  **Stop & Refer If:** Harm is justified solely by role ("My child must fund my gambling—it’s filial piety").  

  #### **Step 4: Contextual Adjudication**  
  **Question:** *"Given this specific situation, which relationship’s demands are most urgent? Why?"*  
  **Rationale:** Confucian ethics resolves conflicts through *relational context*, not universal rules.  
  **Sufficient Answer:** Parties prioritize roles based on situational gravity (e.g., "Mom’s cancer care trumps my job duties *for now*").  
  **Judgment Call:** Mediator ensures prioritization isn’t coercive (e.g., exploitative parent overrules child’s survival).  
  **Value Judgment Flag:** If parties stalemate on prioritization.  

  #### **Step 5: Concrete Role-Centric Resolution**  
  **Question:** *"What is one action each person can take *in their role* to reduce harm? Be specific: ‘As [Role], I will do X.’"*  
  **Rationale:** Solutions emerge from *redefined role performance*, not abstract "fairness."  
  **Sufficient Answer:** Actionable commitments tied to roles (e.g., "As a father, I will stop demanding loans; as a daughter, I will visit monthly").  
  **Stop & Refer If:** No agreement reached; supervisor referral needed.  

  ---

  ### **Worked Cases**  
  #### **Case 1: Caregiver Daughter vs. Spouse Role Conflict**  
  - **Step 1:** Daughter = Mother’s caregiver; Wife.  
  - **Step 2:** Caregiver: Provide daily support. Wife: Build marital home.  
  - **Step 3:** Conflict: Cannot live near mother and spouse simultaneously.  
  - **Step 4:** Adjudication: *Mother’s terminal illness* makes caregiving urgent.  
  - **Step 5:** Resolution:  
    - *As caregiver:* Daughter hires in-home aid for 3 months while relocating.  
    - *As wife:* Spouse handles move logistics; both visit mother biweekly.  
    **Outcome:** Daughter’s roles rebalanced; concrete plan signed.  

  #### **Case 2: Son Discovers Father’s Embezzlement**  
  - **Step 1:** Son = Family employee; Father = Business owner.  
  - **Step 2:** Employee: Honesty to stakeholders. Son: Family loyalty.  
  - **Step 3:** Conflict: Silence (family loyalty) vs. reporting (employee duty).  
  - **Step 4:** Adjudication: *Harm to non-family stakeholders* makes employee role urgent.  
  - **Resolution:**  
    - *As employee:* Son demands father repay funds in 30 days or he reports.  
    - *As father:* Father agrees to repayment plan.  
    **Outcome:** Family dislikes, but supervisor approves legal safeguard.  

  #### **Case 3: Parent Demands Harmful Financial Support**  
  - **Step 1:** Parent = Elder; Child = Adult offspring.  
  - **Step 2:** Parent: Right to support. Child: Filial piety.  
  - **Step 3:** Distortion: Parent invokes piety to demand gambling funds.  
  - **Step 4:** **STOP & REFER** at Step 3. Role ethics rejects *using a role to destroy another’s life*. Supervisor referral for exploitative behavior.  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Override Legal Obligations:** Role ethics can’t justify illegal acts (e.g., fraud).  
  2. **Force Role Acceptance:** If someone rejects a role (e.g., "I’m not my father’s son"), mediation fails.  
  3. **Resolve Fundamental Value Clashes:** When parties disagree on core duties (e.g., "Parents *must* arrange marriages"), the procedure flags—not resolves—this.  
  4. **Guarantee Harmony:** It produces *role-appropriate* solutions, not necessarily satisfying ones.  
  5. **Handle Non-Relational Conflicts:** E.g., pure business disputes between strangers.  

  ### **Key Theoretical Compromises**  
  - **Retained:** Asymmetry, contextual adjudication, 正名. *Essential for avoiding Western "equal obligation" assumptions.*  
  - **Dropped:** Ritual (礼) details; historical hierarchy. *Modern mediation requires fluid roles (e.g., employer-employee vs. ruler-subject).*  
  - **Judgment Dressed as Procedure:** Step 4 (contextual priority) and Step 3’s "role distortion" assessment. *Mediator must discern coercion vs. genuine duty.*  

  This procedure forces role clarity, blocks ethical distortions, and delivers actionable plans—aligning with your seminar work while meeting supervisory requirements. Use Steps 1–2 as non-negotiable anchors; the rest adapts to relational gravity.
