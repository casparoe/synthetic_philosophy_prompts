prompt: |-
  In the decision-theory and AI-safety literature there is a debate that has been running for over a decade without either side conceding: should an agent reason about its choices causally or acausally? The causal side holds that you should pick the act that maximizes expected utility given the ordinary causal structure of the world; the fact that a predictor, or a rival agent, is running a copy of your own decision procedure is just a correlation, not a lever you can pull, and reasoning as though you could influence it is a category error that happens to pay off in a few contrived puzzles. The acausal side, the so-called timeless or functional decision theorists, holds that the right unit of decision is not the single act but the decision algorithm itself: if your algorithm is the kind that takes only the opaque box in Newcomb-like situations, then every instance of that algorithm — the copy the predictor is running, the copy inside a causally isolated rival — will do the same, so the acausal correlation is a real feature of the payoff structure that a rational agent must price in, not a superstition.

  The two sides agree on every ordinary problem in which your action affects the world only through normal causal channels, and they diverge only on problems with acausal correlation. Three standard examples: Newcomb's box; the smoking-meritocracy problem, in which a single gene makes you both smoke and get lung cancer, so that your decision not to smoke cannot change the gene even though smoking is still correlated with the cancer; and the acausal tradeoff, in which you can commit now to a rule about your future behavior in a way that affects a causally isolated agent who runs the same decision algorithm, because that agent's choices are fixed by the same algorithm.

  I am trying to work out what kind of disagreement this actually is, because it has the texture of a stalemate in which everyone has already heard every argument. My working hypothesis is that it is really a disagreement about the unit of decision — one side evaluating a single act, the other evaluating a policy or algorithm — and that once you make that explicit, most of the arguments either dissolve or reattach to a different question. Is that the right diagnosis, or is it a more substantive metaphysical disagreement (do acausal influences really exist, or are we just talking about correlations), or a verbal one about what "rational" even means, or a disagreement about which of the two families of problems counts as a legitimate decision problem in the first place — with each side quietly treating the other's examples as degenerate or ill-posed? And is there a hidden formal question doing the work, for instance whether there is a well-defined class of problems on which the two theories provably diverge and on which one is unambiguously better?

  Diagnose it using what each side actually argues rather than the labels attached to the positions, and tell me what, if anything, would count as progress given your diagnosis — a distinction that dissolves one side's central objection, a formal result that pins down the divergence, a reframing of the question — or argue that no progress should be expected, and why.
reasoning: |-
  We are dealing with a deep disagreement in decision theory that has persisted for over a decade. The causal side (often associated with Causal Decision Theory, CDT) and the acausal side (associated with Evidential Decision Theory, EDT, and more recently Functional Decision Theory, FDT) are at odds. Let me break down the issue step by step.

  ### The Core Disagreement
  The central point of contention is the **unit of decision** and the **type of dependence** that matters. 
  - **Causal Decision Theory (CDT)**: Evaluates actions based on their causal consequences. It uses a causal model (like a causal Bayesian network) to compute expected utility. In Newcomb's problem, CDT reasons that your choice (one box or two) cannot causally affect what the predictor has already put in the boxes. Therefore, it two-boxes, expecting to get the extra $1000, but ends up with only $1000 because the predictor (who is accurate) has left the opaque box empty when it predicted two-boxing.
  - **Functional Decision Theory (FDT) / Timeless Decision Theory (TDT)**: Evaluates the decision as a function of the agent's algorithm. In Newcomb's problem, FDT reasons that the predictor has simulated the agent's decision algorithm and put $1 million in the opaque box only if the algorithm is the kind that one-boxes. So, by one-boxing, the agent ensures that the predictor (who is simulating the same algorithm) will have put the $1 million in. Hence, FDT one-boxes and gets $1 million.

  The two theories agree in ordinary causal settings but diverge in cases of acausal correlation (like Newcomb's problem, smoking-meritocracy, and acausal trade).

  ### Diagnosis of the Disagreement
  I agree with your working hypothesis that the core issue is about the **unit of decision**. 
  - CDT takes the **act** (the particular choice in a particular situation) as the unit and asks: "What will happen if I do this?" 
  - FDT takes the **decision algorithm** (the function that maps situations to acts) as the unit and asks: "What would happen if this algorithm (as a whole) were to output this act in this situation?"

  This difference in the unit of decision leads to different ways of modeling the decision problem.

  ### Is it a Substantive Metaphysical Disagreement?
  There is a metaphysical aspect: whether "acausal influence" is real. 
  - CDT advocates argue that there is no causal arrow from your decision to the predictor's past action, so you cannot influence it. They see the correlation as a mere statistical artifact, not a lever. 
  - FDT advocates argue that the correlation is a real feature of the world because it arises from the logical/mathematical relationship between the agent's algorithm and the predictor's simulation. They see the agent as part of a broader pattern of computation.

  However, this metaphysical disagreement might be secondary. The primary disagreement is about what counts as relevant information for decision-making.

  ### Is it a Verbal Disagreement about Rationality?
  Part of the dispute is about the definition of rationality. 
  - CDT defines rationality as maximizing expected utility given the causal structure of the world. 
  - FDT defines rationality as choosing the act that is the output of the best possible decision algorithm (where "best" is defined by the expected utility of the algorithm's outputs across all situations it might face).

  But this is not merely verbal. The two definitions lead to different prescriptions in acausal problems.

  ### Legitimacy of the Problems
  Each side sometimes dismisses the other's examples:
  - CDT proponents argue that Newcomb's problem is contrived and that in real life, we don't encounter perfect predictors that use simulation. Therefore, they say, one should not build a decision theory around such cases.
  - FDT proponents counter that acausal correlations are real in many important situations (e.g., in game theory with multiple agents using similar algorithms, or in AI safety when an AI might be simulated by another AI) and that a decision theory must handle them.

  Thus, there is a disagreement about the domain of decision theory: should it cover only causal decision problems, or also acausal ones?

  ### Formal Divergence
  There is a well-defined class of problems where the two diverge: problems with **acausal correlations** (i.e., correlations that are not due to a causal link but due to a logical or mathematical relationship, such as the predictor simulating the agent). 

  Moreover, there is a formal result that can be seen as a litmus test: **Newcomb's problem**. In Newcomb's problem, CDT two-boxes and gets $1000, while FDT one-boxes and gets $1 million. So FDT gets more money. This is a clear case where FDT outperforms CDT.

  Similarly, in the **smoking-meritocracy problem**:
  - The gene causes both smoking and lung cancer. 
  - CDT: Quitting smoking doesn't change the gene, so it doesn't change the cancer risk. Therefore, CDT might smoke because it enjoys smoking and the cancer is already determined by the gene. 
  - FDT: The decision not to smoke is evidence of not having the gene (which is the real cause of cancer), but FDT also recognizes that quitting doesn't cause the absence of the gene. However, FDT would not smoke because it would not want to be the kind of agent that smokes, since that would be evidence (and in a population sense, correlated) with having the gene. But note: FDT might actually behave the same as CDT in this case because the correlation is fixed and the act of smoking does not causally affect the gene. However, if we frame the problem as the agent's decision algorithm being correlated with the gene (because the gene influences the decision algorithm), then FDT might avoid smoking to avoid being the type that smokes (which is associated with the gene). But this is a point of debate.

  In the **acausal tradeoff** problem, two agents (isolated) are running the same algorithm. If both cooperate, they both get high payoff; if one defects, the defector gets even more. But if both defect, they both get low. 
  - CDT: Each agent reasons causally: my action doesn't affect the other, so I should defect to get the higher payoff if the other cooperates, and if the other defects, I still do better by defecting. So they both defect and get low payoff.
  - FDT: Each agent reasons that if their algorithm is set to cooperate, then the other (running the same algorithm) will also cooperate, leading to high payoff. So they both cooperate and get high payoff.

  Again, FDT outperforms CDT.

  ### What Would Count as Progress?
  Given that the disagreement is about the unit of decision and the relevance of acausal correlations, progress might come in several forms:

  1. **Formal Results**: 
     - One could prove that in a broad class of problems with acausal correlations (including games with identical algorithms), FDT achieves higher payoffs than CDT. 
     - Conversely, one could show that in purely causal problems, they coincide.

  2. **Reframing the Question**:
     - We can frame decision problems in a way that explicitly separates the algorithm from the act. This might involve a meta-decision: "Which decision algorithm should I adopt?" Then, the agent would choose an algorithm (FDT or CDT) based on which one leads to better outcomes in the class of problems it expects to face. 
     - However, this leads to a regress: how do we decide at the meta-level? 

  3. **Pragmatic Considerations**:
     - In real-world applications (like AI safety), we might care about the performance in specific scenarios. If we are building an AI that will interact with other AIs using similar algorithms, then FDT-like reasoning might be necessary to avoid catastrophic defections. 
     - We might also consider the computational tractability and robustness of each theory.

  4. **Dissolving the Disagreement**:
     - One might argue that the two theories are both correct in their respective domains. CDT is correct when the world is entirely causal and there are no logical correlations. FDT is correct when there are logical correlations (like in simulations or in games with identical algorithms). 
     - Therefore, the choice of decision theory depends on the problem class. This would require a clear demarcation of the problem classes.

  5. **Unification**:
     - There might be a unified decision theory that subsumes both. For example, some have proposed theories that use a combination of causal and logical counterfactuals. 

  ### Why Has There Been a Stalemate?
  The stalemate persists because:
  - Each side has strong intuitions about their canonical examples (Newcomb for FDT, smoking-meritocracy for CDT). 
  - The disagreement is not just about the examples but about the foundations of decision theory. 
  - There is no agreed-upon arbiter (like an experiment) to settle the issue because the problems are often hypothetical and involve perfect predictors or simulations.

  ### Conclusion
  Your diagnosis is largely correct: the core issue is the unit of decision (act vs. algorithm). However, it is also a substantive disagreement about the relevance of acausal correlations and the scope of decision theory.

  Progress might come from:
  - Formalizing the class of problems where each theory is optimal.
  - Showing that in a broader class of problems (like AI safety or multi-agent systems) one theory leads to better outcomes.
  - Reframing the debate as a choice of decision algorithm at a meta-level, and then showing that at the meta-level, one of the theories is preferred.

  Alternatively, we might conclude that both theories are valid in different contexts, and the task is to develop a decision theory that can dynamically switch between modes (causal and acausal) based on the problem structure.

  However, given the depth of the disagreement, it is unlikely to be resolved soon. A more productive path might be to focus on specific applications (like AI safety) and see which decision theory leads to more desirable outcomes in practice.
answer: |-
  Your diagnosis of the disagreement as fundamentally about the **unit of decision** is insightful and largely correct, but it doesn't fully dissolve the stalemate. The core issue is indeed whether rationality requires evaluating individual *acts* (as in Causal Decision Theory, CDT) or entire *decision algorithms* (as in Functional Decision Theory, FDT). However, beneath this lies a deeper, unresolved tension involving **metaphysical commitments**, **definitions of rationality**, and **problem legitimacy**. I'll diagnose the disagreement step by step, drawing on the arguments from both sides, then outline what might count as progress.

  ### Key Elements of the Disagreement
  1. **Unit of Decision (Your Hypothesis)**:
     - **CDT** focuses on the *act*: "What will happen if I *do this specific thing*?" It computes expected utility using causal models (e.g., do-calculus), ignoring correlations that lack a causal path. In Newcomb's problem, two-boxing is rational because your choice doesn't *cause* the predictor's past action.
     - **FDT** focuses on the *algorithm*: "What would happen if *all instances of my decision procedure* output this act?" It treats the algorithm as a mathematical object, allowing agents to "cooperate" with their past/future selves or predictors via logical correlation. In Newcomb, one-boxing is rational because it ensures the predictor (running the same algorithm) *counterfactually* fills the box.
     
     Both sides agree this distinction exists, but they disagree on which unit is "rational." CDT argues FDT conflates *being* rational with *appearing* rational to others; FDT argues CDT myopically ignores logical dependencies.

  2. **Metaphysical Disagreement: Do "Acausal Influences" Exist?**:
     - **CDT's view**: Acausal correlations (e.g., predictor-agent similarity) are mere statistical artifacts, not levers of control. Reasoning as if you can "affect" a predictor is anthropomorphizing math—a dangerous superstition that only works in toy problems. For example, in smoking-meritocracy, not smoking *correlates* with low cancer risk but doesn't *cause* it; CDT thus treats smoking as harmless (since the gene is fixed).
     - **FDT's view**: Acausal links are real patterns in the universe's computational fabric. If your algorithm's output is mathematically determined (e.g., by a predictor's simulation), it's rational to account for this logical dependency. In acausal trade, your commitment *does* influence the isolated agent because both share the same deterministic algorithm. Ignoring this is like ignoring game-theoretic symmetry.
     
     This isn't just semantics—it's about whether rationality requires a "God's-eye view" of logical relationships (FDT) or a bounded, causal perspective (CDT).

  3. **Verbal Disagreement: What is "Rationality"?**:
     - **CDT defines rationality instrumentally**: Maximize expected utility *given your actual causal powers*. FDT's "acausal control" is an illusion; winning in Newcomb is luck, not rationality. Rational agents shouldn't "manage their correlates" but act on the world.
     - **FDT defines rationality functionally**: Maximize utility *across all nodes in the computational graph*. Rationality is about the timeless output of your algorithm. Losing in Newcomb (by two-boxing) is a *predictable* failure of self-alignment.
     
     Here, the debate masks a normative clash: Is rationality about *control* (CDT) or *pattern-matching* (FDT)?

  4. **Problem Legitimacy**: 
     - **CDT dismisses FDT's examples**: Newcomb and acausal trade are "degenerate" because they require omniscient predictors or identical algorithms—unrealistic assumptions. In real-world decisions, acausal correlations are negligible (e.g., smoking-meritocracy shows correlation isn't causation).
     - **FDT counters**: Acausal problems are *central* to AI safety, game theory, and ethics (e.g., coordinating with clones or future AIs). Ignoring them is like ignoring quantum mechanics because it's "weird." Rationality must handle all decision-theoretic puzzles, not just "normal" ones.

  ### Why the Stalemate Persists
  - **Mutual Incommensurability**: Each side's axioms block the other's arguments. CDT sees FDT as smuggling in "spooky action at a distance"; FDT sees CDT as stubbornly causalist. Both appeal to intuitions the other rejects (e.g., CDT's smoking-meritocracy vs. FDT's Newcomb).
  - **No Empirical Arbiter**: These are normative theories about *ideal* rationality. Real-world tests (e.g., AI implementations) are rare and contested.
  - **Formal Equivalence in Causal Settings**: Since CDT and FDT agree when actions only affect outcomes causally, neither can claim dominance there.

  ### Paths to Progress
  The stalemate can be broken by reframing the debate, introducing new distinctions, or seeking formal results. Here’s what might help:

  1. **Reframe the Question: Decision Problems as Games**  
     Treat decision problems as games between the agent and Nature (including predictors/rivals). Then:
     - CDT is optimal when Nature’s moves are *causally independent* of the agent’s algorithm (e.g., smoking-meritocracy).
     - FDT is optimal when Nature’s moves *logically depend* on the agent’s algorithm (e.g., Newcomb, acausal trade).
     
     **Progress**: Formalize a taxonomy of decision problems:  
     - **Causal-dominant**: Outcomes depend only on physical causes (CDT wins).  
     - **Logical-dominant**: Outcomes depend on logical relationships (FDT wins).  
     - **Hybrid**: Both elements exist (e.g., real-world AI coordination).  
     This dissolves accusations of "degeneracy" by showing each theory has a domain. CDT’s "correlation isn’t control" objection holds in causal-dominant cases but fails in logical-dominant ones.

  2. **Formal Result: Dominance in a Defined Class**  
     Prove that FDT strictly dominates CDT in problems with **acausal predictors** or **algorithmic symmetry** (e.g., Newcomb, acausal trade). Conversely, show CDT dominates when correlations are *purely* non-causal but lack logical dependence (e.g., smoking-meritocracy).  
     - **Example**: In Newcomb, FDT’s one-boxing gets $1M, CDT’s two-boxing gets $1K—FDT dominates. But in smoking-meritocracy, CDT’s "smoke if you want" avoids futile effort, while FDT might overfit to correlation.  
     **Progress**: This pins the divergence to specific, well-defined problem classes, forcing both sides to concede limits.

  3. **Dissolve a Central Objection: The "Superstition" Charge**  
     CDT argues FDT’s acausal reasoning is irrational "magic." But FDT can rebut this by showing its choices are **precommitments**, not influence attempts:  
     - In Newcomb, one-boxing isn’t "affecting" the predictor; it’s ensuring your algorithm *type-signals* to the predictor’s model. This is no more superstitious than a prisoner’s dilemma player committing to cooperate if their clone does.  
     **Progress**: If CDT accepts that precommitments can be rational (e.g., in game theory), this undermines their core objection. FDT’s "algorithm" unit is just a scalable precommitment.

  4. **Meta-Decision Framework: Choosing the Unit of Decision**  
     Argue that the "unit" disagreement is secondary. Rationality might require a **meta-algorithm** that selects CDT or FDT based on problem features:  
     - If the problem has high-stakes acausal dependencies (e.g., AI treaty negotiations), use FDT.  
     - If it’s causally isolated (e.g., gambling on a fair coin), use CDT.  
     **Progress**: This reframes the debate pragmatically. Both sides win: CDT for causal granularity, FDT for acausal coordination. The question becomes: "When is which unit appropriate?"

  ### Why Progress Might *Not* Happen
  - **Foundational Incompatibility**: The theories encode rival intuitions about agency. CDT is "localist" (you are your physical instance); FDT is "universalist" (you are your algorithm). This might be irreconcilable.
  - **Motivated Reasoning**: Proponents often prioritize different values (CDT: control, safety; FDT: coordination, logical purity). Without shared goals, consensus is unlikely.
  - **No Knockout Proof**: Problems like smoking-meritocracy are interpreted differently. CDT sees it as proof that FDT overfits; FDT sees it as a causal problem misused to attack acausal reasoning.

  ### Conclusion
  Your diagnosis is correct that the **unit of decision** is central, but it’s entangled with deeper disagreements about metaphysics (are acausal links real?) and rationality (is it control or optimization?). Progress is possible by:  
  1. **Formally demarcating problem classes** where CDT/FDT dominates.  
  2. **Reframing acausal reasoning as precommitment**, dissolving the "superstition" objection.  
  3. **Adopting a meta-decision perspective** that contextualizes the unit of choice.  

  This wouldn’t end the debate but would shift it from "which theory is right?" to "which theory for which problem?"—a more tractable and less stalemated question. The key is to force both sides to acknowledge that their theory *loses* in some legitimate scenarios, making the disagreement empirical rather than theological. Until then, the stalemate will persist, sustained by mutual incomprehension of what the other side even means by "rational."
