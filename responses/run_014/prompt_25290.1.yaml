answer: |-
  Here’s a 10-question diagnostic quiz designed to sort students into positions on the paradox of voting. Each question targets core intuitions underlying the major resolutions without using technical terms. The scoring key maps answer patterns to positions and notes ambiguities.

  ---

  ### **The Voting Paradox Diagnostic Quiz**
  *Answer based on your immediate intuition. Choose the option that feels most compelling.*

  1.  **The Sports Fan:** Your favorite team is playing a championship game. You know your single voice won’t affect the outcome in the packed stadium. Do you still cheer loudly for them?
      *   A) Yes, because supporting them *feels* right, win or lose.
      *   B) No, my voice won't change anything, so why strain it?
      *   C) Maybe, but only if my friends are cheering too.

  2.  **The Tiny Lever:** Imagine a lever that, if pulled, has a 1 in 10 million chance of instantly curing a deadly disease affecting 100 million people. Pulling it costs you 10 minutes of effort. Would you pull it?
      *   A) Yes, because the potential benefit is enormous compared to my small effort.
      *   B) No, because the chance is so tiny it’s practically zero; my effort is wasted.
      *   C) Yes, because if I don't pull it, and no one else does either, the cure never happens!

  3.  **The Litterbug:** You have a candy wrapper. No one is around to see, and dropping it won’t noticeably harm the environment. Is it okay to litter?
      *   A) No, it’s just wrong to litter, regardless of who sees or the tiny effect.
      *   B) Yes, since no one sees and the effect is zero, there’s no harm done.
      *   C) No, because if everyone thought it was okay, the environment *would* be harmed.

  4.  **The Close Call:** An important decision requires a simple majority vote in a group of 1,001 people. You strongly prefer Option A. Polls show it’s exactly tied 500-500, and one person is undecided. Your vote would cost you an hour. Do you vote?
      *   A) Yes, because if it loses by one vote and I skipped it, I’d never forgive myself.
      *   B) Yes, because my vote could actually decide it this time.
      *   C) No, even though it’s close, the chance it’s *exactly* tied and *my* vote decides it is still tiny.

  5.  **The Volunteer Drive:** A charity needs 100 volunteers for a critical project. It’s unclear if they’ll reach their goal. Signing up costs you half a day. Do you sign up?
      *   A) Yes, but only if I know many others are signing up too; my effort matters as part of the group.
      *   B) Yes, because the project is important, and my contribution helps, however small.
      *   C) No, unless I’m certain they’ll hit 99 without me; otherwise, my effort might be wasted.

  6.  **The Lottery Ticket:** A lottery ticket costs $1. The prize is $100 million, but the odds of winning are 1 in 200 million. Do you buy the ticket?
      *   A) Yes, $1 is cheap for even a tiny shot at $100 million!
      *   B) No, the expected value is only 50 cents (100M / 200M = 0.50); I lose 50 cents on average.
      *   C) Maybe, if it’s fun to dream about winning.

  7.  **The Neighborhood Watch:** Your neighborhood is organizing a nightly patrol to deter crime. Patrols only work if enough people participate regularly. Your shift would cost you 2 hours/week. Do you join?
      *   A) Yes, because it’s my duty to help keep my neighborhood safe.
      *   B) Yes, but only if we agree as a group on a fair schedule and I know others will show up.
      *   C) No, my individual patrol time likely won't deter any specific crime, so it’s not worth my time.

  8.  **The Anonymous Gift:** You can anonymously donate $100 to a fund that will provide life-saving medicine to 100 people in desperate need. No one will ever know you did it. Do you donate?
      *   A) Yes, because saving lives is the right thing to do, known or not.
      *   B) Yes, because $100 to save 100 lives is an incredible bargain ($1 per life!).
      *   C) No, if no one knows I did it, I get no credit, and my $100 is gone with no personal benefit.

  9.  **The Critical Mass:** A new social media app needs 10,000 users in your city to become useful. You’d enjoy using it if it reaches critical mass. Signing up costs 5 minutes. Do you sign up early?
      *   A) Yes, because if everyone who wants it waits for others, it will never launch.
      *   B) No, I’ll only sign up once I see it already has 9,999 users; my effort before then is pointless.
      *   C) Maybe, if I can coordinate with friends to all sign up together.

  10. **The Grand Canyon Coin Toss:** You're offered $1 billion if a fair coin lands heads. You can pay $1 for a single extra flip (your win condition is still just one head). Do you pay for the extra flip?
      *   A) Yes! $1 is nothing compared to the *chance* at $1 billion, even if it’s small.
      *   B) No. The first flip gives me a 50% chance. Paying $1 for a tiny *increase* in probability (from 50% to 75%) isn’t worth it when the initial chance is already high.
      *   C) Yes, because if I didn’t pay and lost on the first flip, I’d regret it forever.

  ---

  ### **Scoring Key & Interpretation Guide**

  **How to Score:** Tally the number of times a student selected each letter (A, B, C) across all 10 questions. **Dominant answers indicate core commitments.** Use the dominant pattern and the specific question mappings below to assign positions.

  **Core Position Mappings:**

  *   **Expressive Voting (Intrinsic Value):** Strong tendency towards **A** on Q1, Q8; Rejects purely instrumental reasoning (B) on Q1, Q2, Q4, Q7. Focuses on the act itself.
  *   **Ethical-Altruistic Voting (Scaled Utility):** Strong tendency towards **A** on Q2, **B** on Q8. Believes tiny probabilities *are* worth it when scaled by massive stakes. Likely chooses **A** on Q10. Rejects **B** on Q2, Q6.
  *   **Duty-Based Voting (Obligation):** Strong tendency towards **A** on Q3, Q7, Q8. Focuses on intrinsic rightness/duty regardless of consequence or visibility. Rejects **B** on Q3, Q7.
  *   **Rule-Consequentialist Voting (Universalization):** Strong tendency towards **C** on Q3, Q5, Q9. Asks "what if everyone did that?". Key answers: **C** on Q3, Q9; **A** on Q5 aligns. Rejects purely self-interested **B**/C on Q3, Q5, Q9.
  *   **Minimax Regret (Avoiding Worst Case):** Strong tendency towards **A** on Q4, **C** on Q10. Key answer: **A** on Q4. Focuses on avoiding catastrophic regret for inaction in close calls.
  *   **Rational-Irrationality/Ignorance (Systematic Error):** Strong tendency towards **B** on Q1, Q2, Q4, Q6, Q7; **C** on Q8. Believes costs outweigh tiny benefits rationally. Sees voting as mistaken or driven by non-rational factors (Q1C, Q6C). Rejects **A** on Q2, Q4, Q6, Q10.
  *   **Group-Agency Voting (Collective Action):** Strong tendency towards **C** on Q1, **A** or **C** on Q5, **B** on Q7. Key answers: **C** on Q1, **B** on Q7. Focuses on group coordination/obligation. Rejects purely individual calculation (B) on Q5, Q7.

  **Answer Pattern to Position Mapping (Dominant Patterns):**

  1.  **High A (esp. Q1,3,7,8), Low B:** Likely **Duty-Based**, possibly **Expressive** (if Q1A strong) or **Ethical-Altruistic** (if Q2A/Q8B strong).
  2.  **High A (esp. Q2,8,10), High B (Q8), Low B (Q2,Q6):** Likely **Ethical-Altruistic**.
  3.  **High C (esp. Q3,5,9), Reject B on Q3/Q5/Q9:** Likely **Rule-Consequentialist**.
  4.  **High A (Q4), High C (Q10), Reject B/C on Q4:** Likely **Minimax Regret**.
  5.  **High B (esp. Q1,2,4,6,7), High C (Q8):** Likely **Rational-Irrationality/Ignorance**.
  6.  **High C (Q1), High A/B/C on Q5, High B (Q7):** Likely **Group-Agency**.
  7.  **High A (Q1,8), Reject B on Q1,Q2,Q4,Q7:** Likely **Expressive**.

  **Ambiguities & Overlaps (Key Notes for Students):**

  *   **Duty vs. Rule-Consequentialism:** Both reject Q3B. Duty (Q3A) focuses on inherent wrongness; Rule-C (Q3C) focuses on collective harm if universalized. A student strong on both Q3A *and* Q3C likely blends these positions.
  *   **Ethical-Altruistic vs. Minimax Regret:** Both vote in close calls (Q4A). Ethical-Altruistic (Q2A, Q8B) emphasizes scaled utility calculation; Minimax (Q4A, Q10C) emphasizes avoiding catastrophic regret. Q10C strongly signals Minimax.
  *   **Expressive vs. Duty:** Both value the act intrinsically. Expressive (Q1A) focuses on personal expression/identity; Duty (Q3A, Q7A) focuses on moral obligation. Strong Q1A + Q3A suggests a blend.
  *   **Group-Agency vs. Rule-Consequentialism:** Both consider collective action. Group-Agency (Q1C, Q7B) focuses on group membership/coordination; Rule-C (Q3C, Q9A) focuses on universalization of the rule. Q7B strongly signals Group-Agency.
  *   **Rational-Irrationality vs. Others:** This position uniquely *rejects* voting as rational (High B's). If a student has high B's *but also* strong commitments elsewhere (e.g., high A on duty questions), they might hold a hybrid view (e.g., "People *should* vote out of duty, but the irrationality explains why they actually do").
  *   **Logically Possible but Unattended/Incoherent:**
      *   **High B on Q3 + Q3C:** Rejects littering only due to universalization harm *while also* believing no harm is done individually (incoherent on Q3).
      *   **High A on Q4 + High B on Q6:** Strongly motivated by regret (Q4A) but rejects tiny probabilities for large gains when framed as a lottery (Q6B) – inconsistent risk attitude (psychologically possible, rationally strained).
      *   **High C on Q1 + High B on Q7:** Wants to cheer only with the group (Q1C) but rejects group-based obligation for the patrol (Q7B) – possible but reflects unstable view of group membership.

  **Using the Quiz:** This quiz helps students discover their pre-theoretical intuitions. No position is "correct" at this stage. The value lies in:
  1.  Revealing their intuitive pulls before learning formal arguments.
  2.  Highlighting potential tensions in their reasoning (e.g., strong regret aversion but rejection of tiny probabilities).
  3.  Providing a personal hook for engaging with the literature ("My answers suggest I lean towards Duty or Rule-Consequentialism – let's see how those arguments are defended!").
  4.  Sparking discussion by showing the diversity of intuitions within the class.

  This approach grounds the abstract paradox in relatable scenarios, fostering deeper engagement with the theoretical resolutions you'll explore next.
