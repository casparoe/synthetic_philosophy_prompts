  The book's summary of the paradox setup is correct: the equivalence between "all ravens are black" and "all non-black things are non-ravens" is solid logic. The core issue is whether the same confirmation principle applies to both. Hempel said yes, but with negligible practical impact. The book implies he found it absurd, which is inaccurate.

