prompt: |-
  I cover science and ideas for a magazine, and I'm preparing a piece on the epistemology of testimony. I've been following the reductionism versus anti-reductionism debate, and I'm stuck on a point about anti-reductionism. If testimony is a basic, non-inferential source of justification — on par with perception or memory — then it seems the only reason to accept a testimony is that it is a testimony, and any independent check on the speaker's reliability is exactly what anti-reductionism rules out. So how can the anti-reductionist ever be justified in rejecting a testimony, say when the speaker has a known history of lying? Doesn't anti-reductionism collapse into the view that testimony is prima facie authoritative in a way that makes it impossible to doubt it?
reasoning: |-
  Okay, the user is writing a magazine piece on the epistemology of testimony, specifically stuck on an anti-reductionism paradox. They're concerned that if testimony is a basic source like perception, then rejecting unreliable testimony seems impossible without independent checks—which anti-reductionism supposedly forbids. 

  Hmm, this is classic Burge/Coady territory. The user's framing suggests they've grasped the core tension well: if testimony is non-inferential, how do we discard lies without violating anti-reductionism? Their phrasing about "collapse into prima facie authority" shows they're anticipating the "gullibility objection." Smart. 

  I should clarify that anti-reductionists don't equate testimony with infallibility—that's a common misunderstanding. The key is distinguishing between default justification and indefeasible justification. Like how vision gives default justification that a stick is bent, but water refraction defeats it. Similarly, testimony gets default trust until counter-evidence (like known lying) triggers defeaters. 

  The user might be conflating two things: (1) needing positive reasons to trust (which anti-reductionism rejects) vs. (2) having negative reasons to doubt (which it allows). Anti-reductionism only objects to the first. Their example of a known liar perfectly illustrates a "rebutting defeater"—it doesn't require prior verification of testimony, just background knowledge. 

  Also worth emphasizing the social-norm angle: anti-reductionism treats testimony as a cooperative practice where sincerity is presumed (like Gricean maxims). Known liars violate this norm, making their speech acts defective—akin to hearing a parrot "testify." The user's magazine audience would appreciate this real-world parallel. 

  Should avoid jargon like "defeaters" initially though. Frame it as "overriding reasons" for accessibility. And definitely include the perception analogy—it's the most intuitive rebuttal to the "no rejection possible" worry. Might add that anti-reductionists can still value verification (e.g., fact-checking) as strengthening justification, not creating it. 

  ...Wait, did the user imply all testimony must be accepted equally? That'd be a misstep. Anti-reductionism permits graded trust—e.g., trusting doctors on medicine but not car mechanics. The "basic source" claim is about the mechanism of justification, not blanket authority. Should explicitly disentangle these. 

  Final note: The user's anxiety about "impossible to doubt" suggests they're envisioning extremist anti-reductionism. But even Burge allows doubt with evidence. Might quote his "Acceptance Principle" caveats if the magazine tone permits.
answer: |-
  You've pinpointed a crucial and common challenge to anti-reductionism in the epistemology of testimony—the "gullibility objection." Anti-reductionists like Tyler Burge and C. A. J. Coady *do* argue that testimony is a basic source of justification, but they have nuanced responses to avoid the conclusion that we must accept all testimony uncritically. Here's how they reconcile their position with rejecting unreliable testimony:

  1.  **Justification is "Default" or "Presumptive," Not Infallible:**
      *   Anti-reductionists claim testimony provides *prima facie* justification. This means the *mere act* of receiving testimony (absent defeaters) generates justification for belief, just as the *mere act* of seeing something generates justification for believing it's there (absent defeaters like poor lighting or hallucination).
      *   Crucially, *prima facie* justification is **defeasible**. It can be overridden, undermined, or defeated by countervailing evidence or reasons. Anti-reductionism grants testimony an *initial* positive epistemic status, not an *indefeasible* one.

  2.  **Defeaters are the Key to Rejection:**
      *   This is where the case of the known liar comes in. Anti-reductionists readily acknowledge the existence of **defeaters** – reasons to doubt the testimony or the speaker.
      *   **Rebutting Defeaters:** Evidence that *directly contradicts* the content of the testimony (e.g., you saw the event yourself and know the speaker is describing it falsely).
      *   **Undercutting Defeaters:** Evidence that *undermines the reliability* of the testimony *without* directly contradicting its content. **A known history of lying is a paradigmatic undercutting defeater.** It attacks the *source* of the testimony, making it irrational to accept the testimony *on its own authority*.
      *   **Anti-reductionism does NOT rule out using independent checks *as defeaters*.** It rules out the *reductionist requirement* that we *always* need independent positive evidence *to get justification started*. Once justification is prima facie granted by the testimony itself, defeaters (including independent checks) can certainly override it.

  3.  **The Analogy to Perception Holds:**
      *   Think about perception: Seeing a bent stick in water gives you *prima facie* justification for believing the stick is bent. However, background knowledge about refraction acts as an *undercutting defeater*, defeating that justification and leading you to reject the perceptual belief (or reinterpret it). You don't need to independently verify the stick's straightness *before* your perception gives you justification; the justification arises from the perception and *then* is defeated by background knowledge.
      *   Testimony works similarly: Hearing "P" gives you *prima facie* justification for believing P. Knowing the speaker is a chronic liar acts as an *undercutting defeater*, defeating that justification. You don't need to independently verify P *before* the testimony grants justification; the justification arises from the testimony and *then* is defeated by background knowledge about the speaker.

  4.  **The Nature of Testimony as a Social Practice:**
      *   Anti-reductionists like Burge emphasize that testimony is embedded in a social practice of communication governed by norms of sincerity and competence. We are *entitled* to presume these norms are in play absent evidence to the contrary. This presumption *is* what grants the *prima facie* justification.
      *   **Evidence of unreliability (like a history of lying) is evidence that these norms are *not* being followed.** It shows the speaker is not participating in the practice *properly*. Therefore, the presumption of sincerity/competence doesn't apply, or is overridden. The testimony fails to generate its usual *prima facie* justification, or the justification is immediately defeated.

  **Addressing Your Specific Questions:**

  *   **"The only reason to accept a testimony is that it is a testimony..."**: Anti-reductionists agree that testimony *itself* is the source of the *initial* justification. But acceptance requires the *absence of defeaters*. The justification testimony provides is sufficient for acceptance *only if* nothing overrides it.
  *   **"...any independent check... is exactly what anti-reductionism rules out."**: **This is the misunderstanding.** Anti-reductionism rules out the need for independent checks *to establish the* ***initial*** *justification provided by testimony itself*. It absolutely **does not** rule out using independent checks as *defeaters* to *override* that initial justification when there are reasons for doubt. Checking on the speaker's reliability is precisely what you *should* do when you have evidence (like a history of lying) that acts as a defeater.
  *   **"How can the anti-reductionist ever be justified in rejecting a testimony?"**: By appealing to **defeaters**. Knowing the speaker has a history of lying provides a strong undercutting defeater. This defeater removes or prevents the *prima facie* justification the testimony would otherwise provide, making rejection (or at least suspension of belief) the rational response.
  *   **"Doesn't anti-reductionism collapse into... impossible to doubt?"**: No. It collapses into the view that testimony is *prima facie* authoritative, meaning it grants *initial* justification that can be *doubted and overridden* by sufficient evidence. Doubt is not only possible but *required* when defeaters are present. Anti-reductionism doesn't demand blind acceptance; it demands *default trust* in the absence of reasons for distrust.

  **In Summary for Your Article:**

  Anti-reductionism posits that testimony, like perception, grants us an initial, defeasible justification for belief simply by occurring. This initial trust stems from the fundamental nature of communication as a cooperative practice. However, this justification is not absolute. Strong counter-evidence – **defeaters** – can and should override it. A known liar's testimony fails *not* because we needed independent verification upfront to trust it, but because the knowledge of their dishonesty acts as a powerful defeater, stripping away the justification that the testimony itself would normally confer. Anti-reductionism explains how we can learn effortlessly from others while remaining rationally critical when red flags arise.
