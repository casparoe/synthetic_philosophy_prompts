  This is a well-known paradox in social choice theory, and it is an instance of the "discursive dilemma" (also known as the "doctrinal paradox"). 

  The doctrinal paradox occurs when a group must make a decision on a conclusion (here T) that is a function of several premises (here B and L). The group may vote directly on the conclusion and get one result, or vote on the premises and then derive the conclusion from the premises, and get the opposite.

  In this case:
