  ### Detailed Analysis of the Committee's Voting Paradox

  Your committee's situation is a classic example of a **judgment aggregation problem**, specifically an instance of the **doctrinal paradox** (also known as the **discursive dilemma**). This occurs when a group must make interconnected decisions on logically related propositions, and majority voting on each proposition individually leads to collective inconsistency. Below, I dissect the problem step by step, address your friend's argument, identify the relevant paradoxes and theorems, compare the two resolution methods, and advise on the best approach for your board.

  #### Step 1: The Voting Outcome
  - **Propositions**:
    - **B**: Supplier breached the specification.
    - **L**: Breach caused material loss.
    - **T**: Terminate the contract, where \(T \equiv B \land L\) (termination is justified iff both B and L hold).
  - **Voting Results**:
    - Majority votes "yes" on B (B is accepted).
    - Majority votes "yes" on L (L is accepted).
    - Majority votes "no" on T (T is rejected).
  - **Key Constraint**: No two members affirmed both B and L. This implies that while B and L each received majority support, the majorities for B and L were composed of different members. For example:
    - Member 1: Voted for B but against L.
    - Member 2: Voted for L but against B.
    - Member 3: Voted for both B and L? No—this would violate the constraint. Instead, the votes might look like this:
      - Member 1: B=yes, L=no → Does not support T (since T requires both).
      - Member 2: B=no, L=yes → Does not support T.
      - Member 3: B=yes, L=yes → Supports T, but is alone in doing so.
    - Thus, only one member (Member 3) supports both B and L, and no two members jointly support both premises. The majority for T fails because only one member votes "yes" on T (Members 1 and 2 vote "no").

  #### Step 2: Why Your Friend's Reassurance Fails
  Your friend argues: *"The majority voted 'no' on termination, so the outcome reflects the majority's will. There is no paradox."*  
  This is flawed for three reasons:
  1. **Logical Inconsistency**:  
     The collective judgments are inconsistent. If B and L are both accepted by the group (via majority vote), then \(B \land L\) (i.e., T) must also be accepted by logical necessity. However, the group directly rejects T. This violates the **principle of logical closure**: A consistent set of judgments must respect logical relationships (e.g., if B and L are true, T must be true).
  2. **Violation of the Decision Rule**:  
     Your committee's rule states: *Termination is justified iff both B and L hold*. If the group accepts B and L, termination is mandated by the rule. Ignoring this and relying solely on the T vote disregards the agreed-upon criteria for termination.
  3. **Hidden Dependence on Aggregation Method**:  
     The outcome depends on whether you aggregate votes on premises (B and L) or the conclusion (T). Your friend assumes the conclusion-based method (voting directly on T) is definitive, but this ignores the logical link between T and the premises. The doctrinal paradox shows that these methods can conflict, making the "majority will" ambiguous.

  #### Step 3: Relevant Theorems and Paradoxes
  - **Doctrinal Paradox (Kornhauser & Sager, 1986)**:  
    This paradox arises when majority voting on logically connected premises and conclusions leads to inconsistent outcomes. In your case:
    - Premises: B and L (each accepted by majority).
    - Conclusion: T ≡ \(B \land L\) (rejected by majority).
    The paradox highlights that majority rule per proposition does not preserve logical consistency. This is a specific case of **judgment aggregation**, where individual rational judgments can aggregate to collective irrationality.
    
  - **List-Pettit Theorem (2002)**:  
    This impossibility theorem generalizes the doctrinal paradox. It states that **no aggregation rule** (e.g., majority vote) can simultaneously satisfy all of the following for interconnected propositions:
    1. **Universal Domain**: Any coherent individual judgments are allowed.
    2. **Collective Rationality**: Collective judgments are logically consistent.
    3. **Systematicity**: The decision on each proposition depends only on individual votes on that proposition.
    4. **Anonymity**: All voters are treated equally.
    5. **Unanimity Preservation**: If all voters agree on a proposition, the collective agrees.  
    Your committee violates **collective rationality** (inconsistency in B, L, T) due to majority voting on each proposition independently (systematicity).

  - **Condorcet Paradox (1785)**:  
    While typically applied to preferences (voting cycles), it shares roots with the doctrinal paradox. Both show that majority rule can produce intransitive or inconsistent outcomes when preferences/judgments have structure. Here, the structure is the logical dependence \(T \equiv B \land L\).

  #### Step 4: Two Standard Resolution Methods and Their Opposite Results
  To resolve the inconsistency, committees typically choose between two methods:
  1. **Premise-Based Method**:  
     - Vote only on premises (B and L), then derive T logically: \(T = B \land L\).  
     - **Result for your committee**: B accepted, L accepted → T must be accepted (termination is justified).  
     - **Advantages**:  
       - Upholds logical consistency and the decision rule.  
       - Focuses on objective facts (breach and loss) rather than subjective opinions on termination.  
     - **Disadvantages**:  
       - Overrides the direct vote on T, potentially ignoring members' overall assessment.

  2. **Conclusion-Based Method**:  
     - Vote only on the conclusion (T), ignoring premises.  
     - **Result for your committee**: T rejected (termination not justified).  
     - **Advantages**:  
       - Respects the direct majority vote on the final decision.  
       - Simple and avoids debates about premises.  
     - **Disadvantages**:  
       - Ignores the logical link between T and the premises.  
       - Risks arbitrary outcomes (e.g., rejecting T for reasons unrelated to B and L, such as political pressure).

  **Why They Conflict**:  
  - The premise-based method yields T = **accept** (from B and L majorities).  
  - The conclusion-based method yields T = **reject** (from direct vote).  
  This conflict is inherent in the doctrinal paradox and arises because the majority coalitions for B and L overlap only partially (no two members agree on both premises). The premise-based method prioritizes consistency with the premises, while the conclusion-based method prioritizes the final vote.

  #### Step 5: Recommendation for Your Board
  **Adopt the premise-based method. Terminate the contract.**  
  Here's why:
  1. **Adherence to the Decision Rule**:  
     Your committee's rule defines termination solely based on B and L. If B and L are accepted by majority, termination is required by definition. The direct vote on T is redundant and should not override the premises.
  2. **Logical Consistency**:  
     The premise-based method ensures the collective judgments (B true, L true, T true) are consistent. The conclusion-based method creates inconsistency (B true, L true, T false), violating basic logic.
  3. **Avoiding Arbitrary Outcomes**:  
     Voting directly on T allows members to consider factors beyond the agreed-upon criteria (e.g., "We like the supplier"). The premise-based method enforces discipline by tethering the outcome to the facts (breach and loss).
  4. **Procedural Fairness**:  
     The constraint—"no two members affirmed both B and L"—implies that the majority for B and L reflects diverse perspectives. Overruling T in favor of the premises respects this structure rather than treating T as isolated.

  **Practical Implementation**:  
  - **Step 1**: Formally adopt the premise-based method as your voting rule. Specify that termination is decided by voting on B and L, with T determined by \(B \land L\).  
  - **Step 2**: Void the direct vote on T as procedurally invalid (since it conflicts with the premises).  
  - **Step 3**: Terminate the contract based on the majority votes for B and L.  

  **Countering Your Friend's View**:  
  Your friend focuses on the T vote, but this confuses "what the majority wanted" in the moment with the committee's agreed-upon logic. The doctrinal paradox shows that majority votes on disconnected propositions can misrepresent the group's true intent. By adopting the premise-based method, your board aligns with the deeper rationale for termination: breach and loss together necessitate action.

  ### Summary
  - **Paradox**: Doctrinal paradox (a judgment aggregation failure).  
  - **Conflict**: Premise-based (terminate) vs. conclusion-based (do not terminate).  
  - **Resolution**: Use premise-based voting to uphold logic and the decision rule.  
  - **Outcome**: Terminate the contract.  

  This approach ensures your committee's decisions are rational, consistent, and faithful to the agreed-upon criteria. If you formalize this method in future votes, you will avoid such paradoxes.
