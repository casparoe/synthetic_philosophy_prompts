  This is a problem for the committee because it must have a consistent set of collective judgments. The committee's rules say that termination is justified if and only if both B and L hold. Therefore, if we have collectively decided that B is true and L is true, then we must collectively decide that T is true. But if we vote on T directly and get a majority no, then we have an inconsistency.

  The problem arises because the majority rule applied to each proposition individually does not preserve logical consistency.

  This is related to the Condorcet paradox and the broader topic of judgment aggregation. The impossibility theorems in judgment aggregation, such as the List-Pettit theorem, show that there is no general method of aggregating individual judgments on multiple logically connected propositions that always preserves consistency and satisfies some other reasonable conditions.

  In this specific case, the committee must choose between two methods:

  1. Premise-based method: Vote on the premises (B and L) and then derive the conclusion (T) from the premises. In this case, since both B and L are accepted by majority, we must accept T (termination).

