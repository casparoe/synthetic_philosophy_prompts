answer: |-
  ### Taxonomy of Two-Person Bargaining Solutions  
  *Classified by Axioms: Pareto Efficiency (P), Symmetry (S), Scale Invariance (SI), Independence of Irrelevant Alternatives (IIA)*  

  **Decision Tree:**  
  1. **Is the solution Pareto efficient?** (i.e., no feasible Pareto improvement exists)  
     - *All standard solutions satisfy P (efficient), so proceed. Non-efficient solutions (e.g., inefficient dictatorial) omitted for brevity.*  

  2. **Is the solution symmetric?** (i.e., symmetric problems yield equal payoffs)  
     - **Yes** → Proceed to 3.  
       - *Solutions: Nash, Kalai–Smorodinsky, Egalitarian.*  
     - **No** → Proceed to 4.  
       - *Solutions: Dictatorial (efficient).*  

  3. **Is the solution scale invariant?** (i.e., invariant to positive affine utility transformations)  
     - **Yes** → Proceed to 5.  
       - *Nash and Kalai–Smorodinsky satisfy SI; Egalitarian does not.*  
     - **No** → **Egalitarian solution**.  
       - *Geometric: Equal gains from disagreement: \(u_1 - d_1 = u_2 - d_2\) on Pareto frontier.*  
       - *Axioms: P, S. Fails SI (gains not invariant to scaling), fails IIA (reducing feasible set can alter equal-gains point).*  

  4. **Is the solution scale invariant?**  
     - **Yes** → **Efficient dictatorial solutions**.  
       - *Geometric: Player 1’s max: \(\max u_1\) s.t. \((u_1, u_2)\) feasible, then Pareto efficiency. Player 2 analogous.*  
       - *Axioms: P, SI, IIA. Fails S (asymmetric).*  
     - **No** → *Unoccupied (unexplored: e.g., weighted egalitarian without rescaling).*  

  5. **Does the solution satisfy IIA?** (i.e., solution unchanged if feasible set shrinks but solution remains feasible)  
     - **Yes** → **Nash solution**.  
       - *Geometric: Maximize \((u_1 - d_1)(u_2 - d_2)\) on Pareto frontier.*  
       - *Axioms: P, S, SI, IIA.*  
     - **No** → **Kalai–Smorodinsky solution**.  
       - *Geometric: Intersect Pareto frontier with line from \((d_1, d_2)\) to ideal point \((\max u_1, \max u_2)\).*  
       - *Axioms: P, S, SI. Fails IIA (ideal point changes with feasible set).*  

  ---

  **Notes on Logical Space:**  
  - **Unoccupied Combinations:**  
    - *Efficient, asymmetric, not scale invariant*: Unexplored (no standard solution; e.g., asymmetric egalitarian without rescaling).  
    - *Non-efficient*: Omitted (e.g., inefficient dictatorial solutions satisfy SI, IIA, but fail P and S; no standard solutions for other non-efficient combinations).  
  - **Under-Specified Leaves:**  
    - *Efficient dictatorial solutions*: Tree does not distinguish between player 1 or player 2 dictation (no axiom breaks this symmetry).  
  - **Axiom Violations Explained:**  
    - **Kalai–Smorodinsky violates IIA**: Reducing the feasible set alters the ideal point, shifting the solution even if the original solution remains feasible.  
    - **Egalitarian violates SI**: Scaling utilities non-linearly disrupts absolute gain equality (e.g., doubling player 1’s utility makes equal gains unfair).  
    - **Dictatorial violates S**: Maximizing one player’s payoff ignores symmetry in symmetric problems.  

  ---

  **Derivations (Key Checks):**  
  - **Nash satisfies IIA**: If \(S \supseteq T\) and Nash solution \(u^* \in T\), then \(u^*\) remains the product-maximizer in \(T\) (no point in \(T\) has higher product, as \(T \subseteq S\)).  
  - **Kalai–Smorodinsky violates IIA**: Let \(S\) be convex hull of \((0,0)\), \((1,0)\), \((0,1)\); \(d = (0,0)\). Ideal point = \((1,1)\), solution = \((0.5,0.5)\). Reduce to \(T\) (convex hull of \((0,0)\), \((0.8,0)\), \((0,0.8)\), \((0.5,0.5)\)). Ideal point becomes \((0.8,0.8)\), solution shifts to \(\approx(0.57,0.57) \neq (0.5,0.5)\) though \((0.5,0.5) \in T\).  
  - **Egalitarian violates IIA**: Let \(S\) be convex hull of \((0,0)\), \((1,0)\), \((0,1)\), \((0.6,0.6)\); \(d = (0,0)\). Solution = \((0.6,0.6)\). Reduce to \(T\) (convex hull of \((0,0)\), \((1,0)\), \((0,1)\), \((0.5,0.5)\)). Solution becomes \((0.5,0.5) \neq (0.6,0.6)\) though \((0.6,0.6) \in T\).  

  *End of Handout*
