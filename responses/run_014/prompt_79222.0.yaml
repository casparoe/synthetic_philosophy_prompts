prompt: |-
  Right, I've gone and fallen for the free energy / predictive processing picture, and I want you to try to talk me out of it. The version I actually hold is the strong one: not just that you can always *describe* any system that manages to stick around as minimising some quantity called free energy, but that minimising it is what explains why the thing does what it does — perception is inference, action is inference, learning is inference, and a system only stays in its comfortable states because it keeps its prediction errors down. I know the obvious objection (a system minimising surprise should just curl up in a dark quiet room) and I know the obvious reply (its generative model carries prior preferences that stop it doing that), so dont spend time on that pair unless you think the reply is actually worse than the objection.

  What I want is a map of what my view is exposed to, sorted from the things that should really move me down to the ones that are merely awkward. In particular: what would count against the *strong* reading rather than the weak, "you can always redescribe it that way" one? If free energy minimisation and staying alive can come apart — a creature whose policy minimises the one while shortening the other — is that a refutation, or does it just get filed under "it must have had those priors"? If the same behaviour is predicted equally well by a story that never mentions internal states at all, does that count against me? And what does my view predict that a boring rival doesn't — a plain reinforcement learner, a homeostatic set-point model, ordinary Bayesian inference about the world?

  The thing that worries me most, and I want you to tell me whether its real or whether I'm just spooking myself: the theory seems able to explain a system's failure as neatly as its success. The addict relapses because of a strong prior; the organism dies because its model was wrong; the thing that persists persists because it minimises free energy. If the living and the dying both come out as confirmations, has anything been predicted at all? And if the generative model can always be adjusted after the fact, is that fatal, or is it fine for a framework of this kind — and how do I tell the difference between something genuinely deep and something that's just very good at absorbing everything?

  Also: what would a committed defender concede counts against them, as opposed to what only critics say? I'd personally find one specific failed prediction more persuasive than any amount of talk about unfalsifiability, so weight it that way, and be honest if the conclusion is that the view is well insulated. British English please.
