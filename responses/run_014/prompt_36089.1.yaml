answer: |-
  ### MEMORANDUM  
  **To:** Graduate Studies Committee  
  **From:** Chair, Graduate Studies Committee  
  **Subject:** Policy Recommendation: AI-Assisted Proof Submissions in Graduate Coursework  
  **Date:** October 26, 2023  

  #### I. Background  
  The rise of AI tools as collaborative partners in mathematical work necessitates a policy for graduate coursework submissions. The *oracular case* (a correct, verified proof the student cannot reconstruct) illustrates the tension: AI can generate novel insights, but its use risks decoupling verification from understanding. Our existing rules on "work not one’s own" are insufficient, as AI blurs the line between tool and collaborator.  

  #### II. Position on the Oracular Case  
  The oracular case is a **failure of learning**, not dishonesty. Mathematics requires internalizing reasoning to build intuition for future work. While tools mediate understanding (e.g., computer-assisted proofs), graduate training demands that students cultivate *personal* mastery. An AI-generated proof the student cannot reconstruct is a report, not evidence of growth. Our policy must prioritize learning over product.  

  #### III. Recommendation: The Reconstructability Standard  
  I propose adopting **Proposal 3 (reconstructability standard)** with refinements:  
  - **Policy:** Students may use AI for coursework, but must be prepared to **rederive any submitted argument unaided upon request**, within 24–72 hours, using only blank paper and basic references (e.g., course notes).  
  - **Implementation:**  
    - **Verification:** Instructors may schedule 15–30 minute "reconstruction defenses" for *any* submission (sampled randomly or triggered by suspicion).  
    - **Consequences:** Failure results in (a) mandatory revision with AI banned for that assignment, or (b) for repeated failures, a grade penalty or referral for academic support.  
    - **Scope:** Applies to all graduate coursework (problem sets, take-home exams).  
    - **Effective Date:** Fall 2024 semester.  

  **Why this approach?**  
  - **Balances innovation and rigor:** It permits AI as a scaffold (reflecting real-world practice) while centering understanding.  
  - **Avoids unenforceable bans (Proposal 1):** Prohibiting AI ignores its utility as a thought partner and is impractical to police.  
  - **Improves on disclosure (Proposal 2):** Mandatory disclosure alone cannot ensure comprehension; a student might cite AI but still lack understanding.  

  #### IV. Addressing Disciplinary Precedents  
  Yes, mathematics relies on tool-mediated verification (e.g., computer proofs of the Four Color Theorem). But **graduate training is distinct from research validation**. We teach students to *become* independent thinkers, not merely curators of external insights. The reconstructability standard sets a *floor* for personal mastery: students need not reinvent every wheel, but must demonstrate they *could* retrace the steps.  

  #### V. Implementation Plan  
  - **Affected Parties:** Graduate students, course instructors, graders.  
  - **Pilot Review:** After Fall 2024, assess:  
    - Frequency of reconstruction requests.  
    - Student/instructor feedback on workload and learning outcomes.  
    - Correlation between reconstruction success and exam performance.  
  - **Review Trigger:** Formal evaluation at the end of the 2024–2025 academic year, or after 3 verifiable oracular incidents, whichever comes first.  

  #### VI. Rationale for Rejecting Alternatives  
  - **Strongest Case for Proposal 1 (Prohibition):** "If AI obscures a student’s authentic reasoning process, banning it preserves academic integrity; we cannot assess what students truly grasp if AI is a black box."  
  - **Strongest Case for Proposal 2 (Disclosure):** "Transparency allows calibrated evaluation; citing AI forces students to reflect on their reliance, and instructors to adjust grading rubrics."  

  We reject these not due to ill intent, but because:  
  - A ban ignores AI’s role in modern problem-solving.  
  - Disclosure shifts burden to instructors to judge "unaided ability" post hoc, inviting subjectivity.  

  The reconstructability standard focuses on *outcomes* (understanding), not *inputs* (tools used).  

  ---  
