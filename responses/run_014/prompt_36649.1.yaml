prompt: |-
  Got into a proper row with my flatmate over too many beers about rationality, of all things, and there's an argument he walked me into that I can't find my way out of, but which also can't be right. Help me out.

  (1) Rational credences obey the probability axioms, including that anything that's logically or mathematically certain gets probability 1.
  (2) Now suppose you give some mathematical statement less than full credence -- say you're 50/50 on whether some enormous number-theoretic claim is true.
  (3) If the claim is in fact a provable truth, a bookie who can see this can offer you bets on it at odds you'll happily accept, and since the claim is guaranteed to come out true, you lose money with certainty. Classic Dutch book setup.
  (4) So any credence below 1 in a mathematical truth is irrational.
  (5) But no actual agent assigns 1 to every mathematical truth. There are true statements whose shortest proofs are longer than the age of the universe, and there's no procedure that settles them all, even in principle.
  (6) So no actual agent ever satisfies the axioms, and Bayesian rationality turns out to be a set of norms for logically omniscient beings -- who don't exist and possibly can't.

  He was quite happy to bite the bullet and say the axioms are a "regulative ideal", like frictionless planes in physics. That seems to prove way too much -- a theory of rationality that only binds beings that can't exist is a strange sort of theory. But I can't find the dodgy step. My instinct is that something's off in (3): the bookie has to already know the claim is true in order to exploit me, so the argument quietly assumes an omniscient adversary and then blames me for not being one. My flatmate says that's special pleading -- not counting a bet as exploitative just because you personally can't see you'll lose is exactly what the axioms are supposed to rule out. And I notice if I try to fix (1) by saying the axioms only bind relative to what I've already deduced, it feels like the problem just gets spread out -- I'm now irrational one un-deduced theorem at a time, which is even more damning.

  So: which step do I reject, and what does rejecting it cost? I'd quite like to hang on to some usable version of "obey the probability axioms," it's the one bit of rationality theory that's ever actually helped me, but if keeping it means only angels can be rational then I want to know what I'm really paying.
reasoning: |-
  Okay, let me try to unpack this user's problem. They had a debate with their flatmate about rationality and probability axioms, specifically regarding credences in mathematical truths. The user's flatmate argues that any credence less than 1 in a mathematical truth is irrational because a bookie could Dutch book you if they know it's true. But since no actual human can assign probability 1 to every mathematical truth (due to computational limits), Bayesian rationality seems only applicable to logically omniscient beings—which don't exist. The user feels this conclusion is problematic but can't pinpoint where the argument fails.  

  First, I need to understand the core of the disagreement. The user's instinct is that step (3) is flawed because it relies on an omniscient bookie. Their flatmate counters that dismissing the bet as non-exploitative just because the agent doesn't know better contradicts the point of rationality norms. The user also considered modifying the probability axioms to account for limited deduction but worries this leads to incremental irrationality.  

  Looking at the philosophical angles, I recall that logical omniscience is a known issue in Bayesian epistemology. The Dutch book argument for probabilism traditionally assumes that logical truths are identifiable, which real agents can't do. So the problem isn't new, but the user needs a practical way out.  

  Possible responses:  
  - **Restricting the Dutch book argument**: The standard Dutch book setup requires the agent to recognize the bet as fair given their credences. But if the agent doesn't know a statement is provable, they wouldn't see the bet as fair in the first place. So step (3) might misapply the Dutch book by ignoring the agent's epistemic limitations.  
  - **Differentiating rationality norms**: Maybe rationality should be about *how* you form beliefs given your cognitive limits, not just final probabilities. So avoiding known inconsistencies (like explicit contradictions) could be required, but not assigning P=1 to all unproven theorems.  
  - **Idealization vs. practice**: Like physics models with frictionless planes, Bayesian axioms could be useful approximations. But the user worries this "proves too much"—if the ideal is unreachable, is the norm meaningful?  

  The user's deeper need seems twofold: preserve the usefulness of probability axioms while acknowledging human constraints. They want a "usable version" of rationality that doesn't demand omniscience.  

  I think the strongest reply is to challenge step (3). The Dutch book argument assumes the agent can compute logical implications, which they can't. Rationality should avoid *actual* inconsistencies, not *in principle* ones. So a bookie exploiting unknown truths isn't a failure of rationality—it's just bad luck. This preserves the axioms' core (don't be incoherent) without requiring omniscience.  

  The cost? We admit rationality is bounded. But that's realistic. The axioms still guide how to update beliefs and avoid avoidable errors. The user can keep using probabilism as a tool while accepting that humans aren't gods. That seems like a fair trade.
answer: |-
  Your flatmate's argument is clever and hits on a genuine philosophical problem (the **Problem of Logical Omniscience**), but it relies on a subtle misapplication of Dutch Book arguments. The flaw is in **step (3)**, and rejecting it doesn't destroy Bayesian rationality—it refines it for bounded agents. Here's the breakdown:

  ### Where the Argument Fails: Step (3) is Misapplied
  The Dutch Book argument for probabilism assumes that **the agent can recognize logical/mathematical truths when presented**. But in your scenario, the agent *doesn't know* the mathematical claim is true (or provable). The "bookie who can see this" is **not a fair opponent**—they're exploiting *superior knowledge*, not irrationality in your credences.

  **Key Insight**:  
  - Dutch Book arguments show that violating probability axioms makes you **vulnerable to a sure loss *by your own lights***.  
  - For a bet to be "Dutch-bookable," the agent must accept it as fair *given their current knowledge*. If you're 50/50 on claim *P* (and unaware it's provable), you'd accept 1:1 odds.  
  - But the "sure loss" only materializes if *P* is *actually true*—something *you don't know*. The bookie isn’t exploiting incoherence; they’re exploiting **your ignorance of mathematical facts**.  

  This isn't special pleading: it’s recognizing that rationality norms apply to agents with **limited computational resources**. A Dutch Book should expose *inconsistencies in your current beliefs*, not punish you for failing to know every mathematical truth.

  ### What Rejecting (3) Costs You
  1. **You lose the idea that rationality requires *infallibility***.  
     - Bayesian norms can't demand that you assign P=1 to all mathematical truths. Instead, they demand that your credences *cohere with what you can reasonably know or compute*.  
     - Cost: Accepting that rationality is "bounded." This is unavoidable—we already accept it for memory, perception, etc.

  2. **You need a refined notion of "logical certainty"**:  
     - Rational credences must satisfy probability axioms **relative to your current state of logical/mathematical knowledge**.  
     - Example: If you *know* a proof of *P*, then P(*P*) < 1 is irrational. But if you’ve never encountered *P* and it’s computationally intractable, P(*P*) = 0.5 isn’t irrational.  
     - Cost: You must accept that rationality is **dynamic**. As you prove theorems, your credences must update to reflect new knowledge.

  ### A Better Framework: Bounded Rationality + Axioms
  Bayesianism remains useful if you interpret it as governing **how to structure beliefs *given your epistemic limitations***:  
  - **Probability axioms still apply** to your *explicit beliefs*: Avoid assigning P(A) + P(¬A) ≠ 1 for claims you understand.  
  - **Ignorance of theorems isn’t irrationality**: It’s a computational limit. Rationality requires updating when you *learn* a proof.  
  - **Dutch Books retain force** for *accessible* truths: If you believe A and A→B, but assign P(B) < 1, you *are* Dutch-bookable *right now*—because you *can* see the inconsistency.  

  ### Why Your Instinct is Correct
  Your suspicion that (3) smuggles in an omniscient adversary is spot-on. The argument equivocates between:  
  - **Normative rationality**: "Your beliefs should not contradict themselves *given your current information*."  
  - **Unattainable omniscience**: "You should believe all mathematical truths."  

  The latter is impossible for finite minds. Rejecting it doesn’t undermine Bayesianism—it saves it from absurdity.

  ### Practical Takeaway
  Keep using probability axioms! They’re invaluable for:  
  - Managing uncertainty about empirical facts (e.g., science, everyday decisions).  
  - Avoiding *known* inconsistencies in your beliefs.  
  - Updating credences rationally when new evidence *or proofs* arrive.  

  **What you pay**: Admitting that rationality is **human, not angelic**. You’re irrational only when you defy logic *within your grasp*—not when you fail to grasp all logic. Your flatmate’s "regulative ideal" is half-right: the axioms guide us *toward* coherence, but don’t require us to be gods.

  > "Rationality is the art of being *wrong* less often in a world you don’t understand, not a guarantee of being right in all possible worlds."  
  > — Adaptation of Eliezer Yudkowsky

  If you want deeper dives, look into **logical uncertainty** (e.g., work by Garrabrant, Demski) or **bounded Bayesianism** (e.g., Simon, Gigerenzer). This is a solved problem in modern decision theory.
