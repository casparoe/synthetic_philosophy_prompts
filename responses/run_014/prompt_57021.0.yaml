  Hmm... the challenge is distilling complex philosophical-statistical concepts into five constrained fields while maintaining academic rigor. For field 1 (research question), I need to isolate the exact testable claim: that proportional scalability enables the Kelly equivalence. The wording must show how empirical constraints would falsify it.

