prompt: |-
  You are a working philosopher at the intersection of decision theory and epistemology, and you're deeply familiar with the rationalist literature on expected value and its pathologies. I need you to help me set a research agenda, and I want you to reason carefully and in a structured way about it rather than give me a survey.

  Here's the situation. I'm advising a small working group — three philosophers, about eighteen months, and no empirical or computational budget — that wants to make genuine progress on what's usually called the "expected value fanaticism" problem: the cluster of cases where EV-maximizing decision theory seems to demand absurd commitments, from Pascal's-mugging-style extortion to betting nearly everything on vanishingly unlikely catastrophic payoffs. I've read the standard material (the Pascal's mugging discussions, the infinite- and divergent-expected-value threads, the "is this fanaticism or just rationality?" framing), so please don't re-explain the basics. What I want is a *defended prioritization*: which of the genuinely open sub-questions should this group actually spend its eighteen months on, and in what order.

  Structure your answer in two phases. Phase one, brainstorm: list the candidate open questions you see in this area as broadly as you can — include several I almost certainly haven't thought of, and don't filter for quality yet. Phase two, select and rank: pick the four or five that matter most and order them.

  When you rank, organize each question around a distinction I care about and want you to take seriously: is the question primarily (a) *epistemic* — about how we should assign and calibrate probabilities for tail events; (b) *axiological* — about whether or when the magnitude of values can be unbounded, or when outcomes are incomparable; or (c) *procedural/normative* — about whether EV maximization is the right decision rule at all, or whether we should replace it with something like satisficing, quantile, or expected-shortfall criteria. For each ranked question, state which of (a)/(b)/(c) it is, explain why it's upstream of the others (i.e., how many of the remaining questions' answers depend on it), how tractable it is for philosophers specifically rather than economists or ML researchers, and what argument or evidence in the next year or so would move it up or down the list.

  Address one specific cut head-on, because I think it's underappreciated: the *moral-uncertainty mugger* — an agent who doesn't exploit an error in your probability estimates but your uncertainty about your own values ("you admit it's even possible that utilitarianism is true, so hand over everything"). Is this a genuinely distinct problem from the standard probability-mugging case, or is it the same pathology in different clothes? And does your ranking change depending on which it is?

  Finally, name the one or two questions you'd *deprioritize*, and say why their answer wouldn't change much downstream. I'm after a defended agenda, not a literature review: no reading lists, no citations, no "further reading." Be explicit about the trade-offs between the criteria (importance, upstream-ness, tractability, neglectedness) and about what would change your mind.
reasoning: |-
  Okay, let me approach this systematically. The user is a philosopher working on expected value fanaticism and wants a prioritized research agenda for their team. They've clearly studied the field deeply – mentioning Pascal's mugging, infinite values, and the fanaticism debate – so I need to move beyond basics. 

  First, I consider the core tension: EV maximization's mathematical elegance versus its pathological demands in extreme cases. The user wants fresh angles, not rehashed discussions. The moral-uncertainty mugger point is particularly intriguing – it feels distinct because it attacks value uncertainty rather than probability estimation, potentially requiring different tools.

  For the brainstorm phase, I'll cast a wide net across epistemic, axiological, and procedural dimensions. Beyond standard topics like tail probability calibration (epistemic) or bounded utility (axiological), I should include neglected angles like:
  - How do logical uncertainty and non-archimedean values interact with fanaticism? 
  - Could we reframe the problem entirely through decision rules robust to model misspecification?
  - What if we treat fanaticism as a symptom of misapplied aggregation across possible worlds?

  The prioritization must balance philosophical tractability against leverage. Highly mathematical approaches (e.g., infinite ethics) might be less feasible for a pure philosophy team. Upstream questions – those that resolve multiple downstream issues – deserve preference. 

  On the moral-uncertainty mugger: if it's structurally identical to probability mugging, existing solutions might extend. But if value uncertainty creates unique incommensurability, it could demand new frameworks. This uncertainty pushes it high on the list – resolving it clarifies whether axiological or epistemic fixes dominate.

  I'll deprioritize topics where progress wouldn't ripple far. For example, refining Pascal's mugging defenses might only tweak existing positions, while cracking "fanaticism as aggregation failure" could reshape the entire debate.

  Finally, the ranking must be explicit about trade-offs. A question like "tail probability nihilism" is upstream but bleak; "decision rules under value uncertainty" is actionable but narrower. The team's 18-month constraint means favoring concrete progress over grand unification.
answer: |-
  Here’s a structured research agenda prioritizing open questions for your working group, balancing epistemic (a), axiological (b), and procedural/normative (c) dimensions. The ranking weighs **upstream impact** (how many downstream issues it resolves), **tractability for philosophers** (conceptual clarity over technical machinery), and **neglectedness**, with explicit trade-offs noted.

  ---

  ### **Phase 1: Brainstormed Open Questions**  
  *(Unfiltered candidate problems)*  
  1. **Tail Probability Nihilism**: Can infinitesimal probabilities ever be rationally bounded/ignored? (a)  
  2. **Axiological Bounds**: Must utility functions be bounded? If so, on what grounds? (b)  
  3. **Decision Rule Alternatives**: What viable alternatives to EV maximization avoid fanaticism without ad hoc thresholds? (c)  
  4. **Moral Uncertainty Mugging**: Is fanaticism under moral uncertainty distinct from probabilistic mugging? (b/a)  
  5. **Infinite Ethics**: How to handle infinite/undefined expected values (e.g., multiverses)? (b/c)  
  6. **Logical Uncertainty**: Do low-probability *logical* claims (e.g., "this number theory halts") demand fanaticism? (a)  
  7. **Contextual Thresholds**: Can "practical negligibility" be formalized without arbitrariness? (c/a)  
  8. **Non-Archimedean Values**: Can values be lexically ordered to block trade-offs with tiny probabilities? (b)  
  9. **Aggregation Failure**: Is fanaticism a symptom of misaggregating tail events across possible worlds? (a/c)  
  10. **Epistemic Bootstrapping**: Can extreme probabilities be dismissed if they undermine belief-formation? (a)  
  11. **Risk-Aversion Foundations**: Is fanaticism irrational due to inherent risk-aversion in agency? (c)  

  ---

  ### **Phase 2: Prioritized Ranking**  
  **Criteria**:  
  - **Upstreamness**: Resolves >2 downstream issues.  
  - **Tractability**: Leverages philosophical analysis (conceptual/axiomatic).  
  - **Neglectedness**: Underexplored in EV fanaticism literature.  
  - **Trade-off**: Sacrifices technical precision for foundational clarity.  

  #### **1. Axiological Bounds: Is Utility Fundamentally Bounded? (b)**  
  - **Why upstream?** If utilities *must* be bounded (e.g., via phenomenological or metaphysical arguments), most mugging/fanaticism cases collapse. Resolves questions 1, 2, 4, 8.  
  - **Tractability**: Philosophers excel at normative/value theory. Avoids math-heavy infinite ethics.  
  - **Neglectedness**: Boundedness is often assumed but rarely defended *rigorously* in fanaticism contexts.  
  - **What changes rank?** A proof that unbounded utilities imply dynamical inconsistency (e.g., time-slicing paradoxes) ↑; evidence that bounds are "cheats" (e.g., via Dutch books) ↓.  

  #### **2. Moral Uncertainty Mugging: Distinct Pathology? (b/a)**  
  - **Why upstream?** If moral uncertainty induces *incommensurability* (not just low probability), it demands new tools (e.g., variance-sensitive rules). Resolves questions 4, 8, 11.  
  - **Distinctness?** Likely **yes**: Probability mugging exploits *belief calibration*; moral mugging exploits *value incomparability*. The latter may require axiological frameworks (e.g., parity, fuzzy comparability) beyond probability tweaks.  
  - **Tractability**: Philosophers dominate moral uncertainty vs. probabilistic risk.  
  - **Neglectedness**: Rarely analyzed as a core fanaticism driver.  
  - **What changes rank?** Formal proof that moral uncertainty reduces to probabilistic uncertainty ↓; cases where moral options violate continuity axioms ↑.  

  #### **3. Decision Rules Under Value Uncertainty (c/b)**  
  - **Why?** If axiological bounds fail, we need non-EV rules *robust* to unbounded/morally uncertain values (e.g., minimax regret, quantile-based satisficing). Resolves questions 3, 7, 11.  
  - **Upstreamness**: Less than (1) or (2), but bridges normative/axiological gaps.  
  - **Tractability**: Conceptual innovation in decision rules is philosophy-friendly.  
  - **Neglectedness**: Alternatives like *ordinal* expected value are underdeveloped.  
  - **What changes rank?** Discovery that all non-EV rules violate dominance in bounded cases ↓; a rule satisfying "tail-ignorance" axioms ↑.  

  #### **4. Epistemic Bootstrapping (a)**  
  - **Why?** Can agents rationally assign *non-measurable* probabilities to events that would bankrupt their epistemology (e.g., "Boltzmann mugger" claims)? Resolves questions 1, 6, 9.  
  - **Upstreamness**: Constrains probability models, but less decisive than (1).  
  - **Tractability**: Pure epistemology, no axiological commitments.  
  - **Neglectedness**: Focus on "unfalsifiable" tail events is emerging but underapplied.  
  - **What changes rank?** A decision-theoretic Dutch book against probability nihilism ↓; incoherence in "epistemic negligence" arguments ↑.  

  #### **5. Aggregation Failure (a/c)**  
  - **Why?** Is fanaticism an artifact of *summing* utilities across worlds without accounting for causal fragility? (e.g., "Why bet on this mugger when identical muggings exist in 10^100 worlds?") Resolves questions 5, 9.  
  - **Tractability**: Metaphysics of possible worlds + decision theory.  
  - **Neglectedness**: The "clumping problem" in infinitary ethics is recognized, but not in finite cases.  
  - **What changes rank?** Showing clumping dissolves fanaticism in key cases ↑; proof that aggregation is linear "all the way down" ↓.  

  ---

  ### **Deliberately Deprioritized**  
  - **Infinite Ethics (5)**: Requires heavy mathematical machinery (e.g., hyperreals), less tractable for philosophers. Downstream impact limited—if utilities are bounded or decision rules changed, infinities are tamed.  
  - **Non-Archimedean Values (8)**: Lexical orders often feel ad hoc; if axiological bounds fail, lexicality may not help (e.g., mugger offers "lexically higher" goods). Less upstream than (1)/(2).  

  ---

  ### **Agenda Sequencing & Trade-offs**  
  1. **Months 1–6**: Tackle (1) **Axiological Bounds** and (2) **Moral Uncertainty Mugging** in parallel.  
     - *Trade-off*: If (1) succeeds, (2) simplifies; if (1) fails, (2) becomes critical.  
  2. **Months 7–12**: Develop (3) **Decision Rules** informed by (1)/(2).  
  3. **Months 13–18**: Test rules against (4) **Epistemic Bootstrapping** and (5) **Aggregation Failure**.  

  **Why this order?**  
  - Axiology (b) is *foundational*: Resolving boundedness/value uncertainty makes epistemic (a) or procedural (c) fixes less urgent.  
  - Moral mugging is a *forcing function*: Its distinctness (or not) determines whether axiological/epistemic solutions dominate.  
  - Deprioritized questions either lack leverage (infinities) or are downstream of core issues (lexical values).  

  **Key Movability**: If evidence shows moral mugging reduces to probability mugging (e.g., via equivalence theorems), drop (2) and elevate (4). If bounded utility arguments fail spectacularly, shift focus to (3) and (5).
