answer: |-
  This pattern is indeed central to political legitimacy, yet lacks a universally accepted name. Let's carve it precisely:

  **1. Naming and Conceptual Carving:**

  *   **Proposed Term: Chrono-Legitimation (or Temporal Laundering)**
  *   **Definition:** The argumentative strategy whereby an initially illegitimate political or legal order (founded on force, usurpation, or injustice) acquires legitimacy solely through the prolonged passage of time, the subsequent development of stable customs, social habituation, and the fading of alternative claims or memories, rendering the original violence normatively irrelevant.

  *   **Distinguishing from Neighboring Concepts:**
      *   **"Might Makes Right" / Right of the Strongest:** Explicitly rejected by this strategy. Chrono-legitimation *concedes* the founding injustice but argues it has been superseded by time, whereas "might makes right" asserts force *is* justice *at the moment of application*.
      *   **Foundational Violence (Descriptive):** Chrono-legitimation *uses* this descriptive fact as the starting point but adds a *normative transformation* wrought by time. The mere fact does no justificatory work alone.
      *   **De Jure / De Facto:** Chrono-legitimation specifically addresses the *transition* from de facto (force-based) existence to perceived (and argued) de jure legitimacy *via* time and custom. It claims the gap *closes*.
      *   **Hobbesian Conventionalism:** Hobbes roots legitimacy in the *present* act of authorization (express or tacit) to the sovereign whose commands *define* justice. Chrono-legitimation roots legitimacy in the *elapsed time* itself and the organic sedimentation of habit/custom, regardless of continuous consent. The sovereign's *origin* remains violent but irrelevant.
      *   **Legal Prescription:** This is the closest *specific instance*, particularly for property. Chrono-legitimation is the *generalized philosophical and political principle* underlying prescription. Prescription is a rule-bound legal doctrine; chrono-legitimation is the broader justificatory logic applicable to entire regimes, constitutions, or territorial claims without fixed time limits or formal legal criteria. It's the "spirit" of prescription expanded beyond property law.
      *   **Burkean Conservatism:** While sharing respect for tradition and custom, Burkean thought often emphasizes the organic wisdom *inherent* in traditions and institutions over time, potentially downplaying or rationalizing the founding violence rather than explicitly acknowledging and then laundering it. Chrono-legitimation frankly admits the violent seed but declares it purified by time.
      *   **Pascal's "Reason of Effects":** Pascal brilliantly *describes* the phenomenon ("Custom is the whole of equity, for the sole reason that it is accepted... the foundation of [authority] is custom") but remains largely skeptical and diagnostic. Chrono-legitimation is the *justificatory deployment* of this Pascalian insight by defenders of the established order. Pascal exposes the mechanism; its users weaponize it for legitimation.

  **2. Assessing Legitimacy: Functional Stabilization vs. Rhetorical Mystification**

  Chrono-legitimation is **primarily functional and stabilizing, but its claim to *genuine normative legitimacy* is deeply contested and often rhetorical.** The distinction lies in the *conditions* under which time operates.

  *   **Functional Stabilization (The Genuine Core):**
      *   **Expectation Management:** Time allows patterns of behavior, reliance, and reciprocal expectations to solidify (Waldron). Disrupting deeply settled arrangements causes significant social cost and individual hardship, even if the original distribution was unjust. Stability *itself* has moral weight.
      *   **Epistemic Uncertainty Reduction:** Rawls' "burdens of judgment" apply. Time provides a focal point for coordination in the absence of universally agreed-upon first principles. "This is how we live now" becomes a pragmatic basis for coordination.
      *   **Conflict Resolution:** Time allows competing claims to fade (through death, assimilation, shifting priorities). It provides a mechanism to move beyond intractable disputes about origins. Prescription in property law explicitly serves this peacekeeping function.
      *   **Organic Development:** Time allows institutions and norms to adapt, integrate feedback, and potentially develop internal justifications *beyond* their origin (e.g., a usurper's dynasty might establish competent governance).

  *   **Rhetorical Mystification (The Illegitimate Facade):**
      *   **Obfuscation:** Chrono-legitimation often functions to *avoid* confronting the enduring consequences of the original injustice, especially if structural inequalities or dispossession persist. Time becomes a smokescreen.
      *   **Ideology:** It can transform historical contingency into perceived naturalness or inevitability. The "unremarkable history" hides the violence that made it possible.
      *   **Lack of Reflexivity:** When chrono-legitimation precludes *any* critical reassessment of the foundational injustice or its ongoing effects, it becomes pure ideology. Legitimacy requires the *possibility* of legitimate challenge.
      *   **Ignoring Ongoing Injustice:** The mechanism fails morally if the "settled" order perpetuates systemic wrongs *derived* from the original act of force. Time doesn't launder present injustice.

  *   **Distinguishing Genuine from Rhetorical Legitimation:**
      *   **Enduring Structural Injustice:** Does the settled order perpetuate significant, identifiable harms traceable to the original act? (e.g., apartheid, caste systems, ongoing dispossession). If yes, chrono-legitimation is likely mystification.
      *   **Openness to Challenge:** Can the legitimacy derived from time and custom *itself* be challenged through reasoned discourse, legal processes, or political action *within the framework*, or is the "weight of time" presented as an absolute trump card? Genuine legitimacy allows reflexivity.
      *   **Consent (Tacit vs. Coerced):** Has time allowed for the development of institutions where *present* consent (or dissent) can be meaningfully expressed, or is habituation merely resignation? Does the passage of time reflect adaptation and integration, or just the suppression of alternatives?
      *   **The "Lockean Proviso" Test (Applied Retrospectively):** Has the passage of time allowed the established order to meet basic standards of justice and the common good *independently* of its origin? Or does it still primarily serve the interests of the original usurpers/their descendants at the expense of others?

  **3. Boundary Cases and Failure Conditions:**

  *   **Applicability:**
      *   **Property Rights:** The clearest and most widely accepted application (via prescription/adverse possession). Time + possession + good faith often create strong moral claims based on reliance and settled expectations.
      *   **Political Authority:** Highly contested core application. Chrono-legitimation is frequently invoked for dynasties, revolutionary regimes that stabilize, or constitutions with problematic origins. Its force depends heavily on the regime's *current* performance and openness.
      *   **International Law/Practice:** Applies to territorial claims (historical title via prescription/consolidation), customary international law formation, and recognition of governments. However, it faces strong resistance, especially regarding colonialism ("intertemporal law" debates) – the passage of time is often *insufficient* to legitimize conquest in the eyes of the dispossessed or the international community. Power dynamics remain stark.

  *   **Conditions for Failure (Breaking the Conversion):**
      *   **Actionable Memory/Claims:** If the victims of the original injustice (or their identifiable successors) maintain a living memory, a sustained claim, and the capacity/motivation to act upon it, chrono-legitimation weakens significantly (e.g., indigenous land claims, demands for reparations for slavery).
      *   **Enduring Illegitimacy in Substance:** If the regime remains fundamentally oppressive, predatory, or fails to provide basic goods/justice, time cannot launder it. Habituation to tyranny is not legitimacy (e.g., failed states, brutal dictatorships).
      *   **Ongoing Violence/Dispossession:** If the *consequences* of the original act remain actively and visibly unjust (systematic discrimination, economic exploitation based on original seizure), chrono-legitimation fails. The violence isn't past; it's present.
      *   **Fundamental Normative Shift:** If the foundational act violates a subsequently emerged (or newly recognized) peremptory norm of justice (*jus cogens*), time may be insufficient. Genocide or slavery as founding acts may be seen as "un-launderable" regardless of time passed. The moral abhorrence transcends time.
      *   **Lack of Functional Integration:** If the order remains fundamentally unstable, contested, or fails to generate its own internal legitimacy through performance, the passage of time alone cannot confer legitimacy. Chrono-legitimation requires actual *settling*.

  **Conclusion:**

  Chrono-legitimation is a powerful and pervasive mechanism. It describes a real social and psychological process: time *does* stabilize expectations and provide a pragmatic basis for order. In this functional sense, it generates a *form* of legitimacy crucial for social peace. However, its claim to *moral* legitimacy is contingent. When it masks enduring injustice, suppresses legitimate claims, or absolves regimes of accountability for foundational (or ongoing) wrongs, it becomes a tool of ideological mystification rather than a genuine source of normative justification. The acid test is whether the passage of time has allowed for the emergence of a just and responsive order capable of internal critique, or whether it merely serves to entrench historical wrongs under a cloak of normality. Its applicability is broadest and strongest in property, most contested and conditional in political authority and international territorial claims, and most likely to fail when the original violence casts a long, unhealed shadow over the present.
