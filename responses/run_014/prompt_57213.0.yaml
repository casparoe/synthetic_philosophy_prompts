prompt: |-
  I'm staff counsel to a state clemency board — five members, we make a recommendation, the governor can ignore it. We get maybe eight or nine capital petitions a year and each one gets about three weeks from a two-person analyst team, none of whom are philosophers and none of whom have time to read anything. Our worksheet right now asks one question in five different costumes: is there enough doubt or enough unfairness here that we shouldn't let this execution go forward. Its a mess and it lets members smuggle their priors in under whatever heading they like.

  Here's the hunch I want you to build on. I think there are at least three genuinely separate reasons to commute that we keep collapsing into one another, and they need different evidentiary standards, different sources, and they fail in different ways: (1) doubt about whether this person actually committed the crime; (2) the sentence is out of line with what comparably situated people got, including his own co-defendants; (3) desert doesn't transfer across time — the 62-year-old on the table isn't, in whatever sense retributivism actually needs, the person who merited death at 28. Add whatever grounds you think I'm missing, and tell me if you think one of these three isn't really a separate ground.

  Write the procedure. I want: the questions in the order an analyst should ask them, what counts as a sufficient answer to each, the places where it terminates in "deny," and every point where it stops being procedure and hands the call to the board because the remaining question is about values rather than facts. Where a standard can't be reduced to a threshold, say so plainly instead of inventing one. Then tell me which conceptual distinctions you deliberately dropped because an analyst working from a cold trial record can't apply them, and what we lose by dropping them.

  Run it on three cases:

  - Guilt is solid, confirmed, nobody disputes it. He was nineteen, three co-defendants who were at least as culpable took pleas and are alive today, and he's been unblemished for thirty-four years. I expect our procedure to say something here, but I want to know whether it says it on ground (2), ground (3), or neither.
  - No individualized doubt about this defendant at all. But the conviction leaned heavily on a forensic technique that has since been broadly repudiated, and there's a documented cluster of exonerations built on the same technique in the same era. Nobody has any new evidence about *him*. Does the procedure let that kind of information carry weight, and how is it different from someone telling us "roughly four percent of people convicted this way turn out to be innocent"? Be precise about whether that number is even the right shape of thing to feed into a decision about one man.
  - He's probably guilty, the disparity argument is weak, but he has advanced dementia and there's a real question whether he understands what's being done to him or why. I know there's doctrine saying you can't execute someone who doesn't grasp it, but our board treats that as the courts' business. Does the procedure have anywhere honest to put this, or does it have to say "not our question"?

  One of those three should come out in a way you think I won't like. Say which and why.

  Also include: a section on what the procedure can't do and where it'll misfire, including why deterrence and denunciation shouldn't appear anywhere on a single-case worksheet even though they're central to why the institution exists; what an analyst does when the record is silent, which for grounds (2) and (3) is most of the time, because a trial record was built to answer a different question than either of those; and a one-page version for board members who will not read the analyst version. Flag anything that's really a judgment call dressed up as a step. Plain English, no citations or bibliography — if there's a distinction from punishment theory or the law of proof that I haven't named, describe it in your own words and I'll chase down the sources myself.

  Around two thousand words total. And be willing to tell me that one of my three grounds is bogus.
reasoning: |-
  Hmm, the user is staff counsel to a state clemency board dealing with capital punishment cases. They're frustrated with their current system where all clemency considerations get lumped together into one vague question about "doubt or unfairness." They've identified three potential distinct grounds for commutation: (1) factual innocence/doubt, (2) sentencing disparity, and (3) the "desert transfer" argument about the defendant having changed over time. They want me to build a new procedure around this framework.

  The user needs a practical, structured procedure that clearly separates these grounds, with specific questions analysts can work through. They want to know what evidence counts for each, where decisions can be made by analysts versus where board input is needed, and where the procedure terminates. They also want me to apply this to three test cases, identify which outcome they might dislike, and explain why. Plus, they want limitations acknowledged and a one-page version for board members.

  Breaking down the user's core needs:
  - Clear separation of commutation grounds with distinct standards
  - Practical workflow for analysts with limited time/resources
  - Explicit demarcation between factual analysis (for analysts) and value judgments (for board)
  - Honest acknowledgment of what the procedure can't handle
  - Application to real-world complexities like missing records or ambiguous cases

  For the procedure itself, I'll need to:
  1. Define the sequence of questions
  2. Establish evidence thresholds (or acknowledge where they can't exist)
  3. Identify termination points for denials
  4. Mark where board judgment is required
  5. Address how to handle silent records

  Key challenges to address:
  - Ground (3) "desert transfer" is philosophically complex - how to make it operational?
  - Analysts aren't philosophers and have no time for theoretical debates
  - Most records won't contain evidence relevant to (2) and (3)
  - Deterrence/denunciation can't be assessed case-by-case

  For the three test cases:
  1. Solid guilt case with sentencing disparity and rehabilitation - should trigger ground (2) primarily
  2. Systemic innocence risk without individualized doubt - requires careful handling to avoid conflating probabilities with individual justice
  3. Dementia case - procedure may have to acknowledge this falls outside its scope as a legal competency issue

  I suspect the dementia case (Case 3) will be the outcome they dislike, because the procedure can't properly address it within the given framework. It exposes a gap in their proposed grounds.

  Additional considerations:
  - Should add a fourth ground for "irreversible injustice" regarding execution methods
  - Must exclude deterrence/denunciation as they're systemic, not case-specific
  - Need plain English explanations throughout
  - One-page board version must highlight only decision points

  The procedure should have three phases corresponding to each ground, with clear exit points if any ground warrants commutation recommendation. Where evidence is absent (common for (2) and (3)), analysts should explicitly state that rather than forcing conclusions.

  For conceptual sacrifices:
  - Won't distinguish between retributive/utilitarian theories
  - Can't operationalize "identity change" philosophically
  - Must treat "comparably situated" as crude category matching
  - Accept that "desert transfer" gets reduced to demonstrable change

  This structure forces tough but necessary choices to make clemency review feasible within real-world constraints, while being transparent about what gets lost in translation from theory to practice.
answer: |-
  Here is a clemency analysis procedure based on your hunches, designed for practical use by time-constrained analysts working from trial records. It deliberately sacrifices philosophical nuance for operational clarity. The core structure isolates your three grounds and adds a fourth for execution-specific injustice. Deterrence and denunciation are excluded—they are systemic rationales that cannot be meaningfully assessed in a single-case review.

  ---

  ### **Clemency Analysis Procedure: Analyst Version**  
  **Order of Operations**  
  *Follow sequentially. Terminate early if any ground meets the "Recommend Commutation" threshold. If all grounds fail, proceed to final denial.*

  1.  **GROUND 1: ACTUAL FACTUAL GUILT**  
      *Question: Is there a substantial and unresolved doubt that this person committed the capital offense?*  
      - **Sufficient Answer (Recommend Commutation):**  
        - New, credible, material evidence (e.g., DNA, recantation by key witness, proven police misconduct) that directly undermines the conviction *and* was not available/considered at trial or on direct appeal.  
        - OR: A confirmed breakdown in the adversarial process (e.g., suppressed exculpatory evidence, ineffective counsel on guilt/innocence) that casts fundamental doubt on the verdict.  
      - **Insufficient:** Prior appeals rehashing the same evidence; claims without verifiable new facts; general statistics about wrongful convictions.  
      - **Terminates in DENY if:** No new, credible, material doubt exists.  
      - **Board Judgment Needed?** No. This is a factual threshold. Analysts assess evidence credibility/relevance.  

  2.  **GROUND 2: SENTENCING DISPARITY**  
      *Question: Is this death sentence grossly disproportionate compared to similarly situated co-defendants or analogous cases?*  
      - **Sufficient Answer (Recommend Commutation):**  
        - Identifiable co-defendant(s) in the *same crime* with comparable or greater culpability (role, intent, criminal history) who received non-capital sentences *and* no materially distinguishing justification exists.  
        - OR: A documented pattern in the *same jurisdiction/era* of non-death sentences for materially similar crimes (same aggravators, similar defendant profile). Requires at least 3 comparable cases.  
      - **Insufficient:** Anecdotal comparisons; disparities based on different crimes/jurisdictions; disparities explained by material differences (e.g., prior violent record, leadership role).  
      - **Terminates in DENY if:** No comparable cases exist, disparities are explained, or disparities are not "gross" (i.e., not stark and indefensible).  
      - **Board Judgment Needed?** **YES.** "Comparable culpability" and "gross disproportionality" require value judgments. Analyst provides:  
        - List of co-defendants + their roles/sentences.  
        - Summary of 2-3 most similar capital cases from the era with outcomes.  
        - Flag any material distinctions.  

  3.  **GROUND 3: DESERT DOES NOT TRANSFER (Significant Change/Incapacity)**  
      *Question: Is the person now presented for execution fundamentally different in a morally material way from the person sentenced to death?*  
      - **Sufficient Answer (Recommend Commutation):**  
        - **Significant Rehabilitation:** Documented, sustained (min. 10+ years), exceptional transformation *unrelated to prison routine* (e.g., mentoring at-risk youth via verified programs, preventing prison violence, earning advanced degrees, profound remorse with tangible proof). *Not sufficient:* Good behavior alone, religious conversion, aging.  
        - **Severe Incapacity:** Profound cognitive/mental decline (e.g., dementia, psychosis) *objectively documented* (medical records) that severely impairs understanding of punishment *or* the person’s connection to the past act. *Not sufficient:* General aging, low IQ unless degenerative.  
      - **Insufficient:** Claims of change without documentation; typical prison adjustment; time elapsed alone.  
      - **Terminates in DENY if:** No documented evidence of exceptional transformation or severe incapacity.  
      - **Board Judgment Needed?** **YES.** "Morally material change" and "exceptional" are value judgments. Analyst provides:  
        - Concise summary of documented conduct/incapacity.  
        - Objective evidence (medical reports, program certificates, warden/CO statements).  

  4.  **GROUND 4: EXECUTION-SPECIFIC INJUSTICE**  
      *Question: Would executing this person now inflict an irreversible harm distinct from the death sentence itself?*  
      - **Sufficient Answer (Recommend Commutation):**  
        - The execution method itself is cruelly botched or medically inappropriate *for this individual* (e.g., severe vein access issues, incompatible with documented medical condition).  
        - OR: Execution would inflict severe, documented trauma on *innocent, direct dependents* (e.g., minor children with no other caregiver, severely disabled adult child reliant solely on inmate).  
      - **Insufficient:** General opposition to methods; trauma to extended family.  
      - **Terminates in DENY if:** No unique, irreversible harm is substantiated.  
      - **Board Judgment Needed?** **YES.** "Cruelly botched," "medically inappropriate," and "severe trauma" require value judgments. Analyst provides facts only.  

  5.  **FINAL RECOMMENDATION:**  
      - If any Ground (1-4) meets its "Recommend Commutation" threshold → **RECOMMEND COMMUTATION.**  
      - If all grounds fail → **RECOMMEND DENIAL.**  

  ---

  ### **Key Omissions & Limitations**  
  1.  **Conceptual Distinctions Dropped:**  
      - **"Identity" vs. "Change":** We don’t ask if the inmate is "a different person." Analysts can’t assess metaphysical identity from records. We use observable *conduct/incapacity* as a proxy. *Loss:* Deep retributive theory is sidelined; we risk commuting the "truly remorseful" but not the "reformed but silent."  
      - **Precise Proportionality:** We don’t define "desert" or "just punishment." Analysts compare *legal categories* (aggravators, roles, priors). *Loss:* Nuanced moral desert (e.g., "he was abused") is ignored unless it creates disparity (Ground 2) or incapacity (Ground 3).  
      - **Culpability Gradients:** Ground 2 requires "comparable" culpability. Analysts can’t finely weight moral blameworthiness (e.g., "coerced vs. eager"). They rely on legal distinctions (ringleader vs. lookout). *Loss:* Subtle inequities might be missed.  

  2.  **What the Procedure Can’t Do / Where It Misfires:**  
      - **Silent Records:** Grounds 2 & 3 will often lack data. Analysts **must state:** "No co-defendant/disparity data available" or "No documented evidence of change/incapacity." The board decides significance.  
      - **Systemic Innocence (Case 2):** General error rates (e.g., "4% exonerations") **do not trigger Ground 1.** Ground 1 requires *case-specific doubt*. A repudiated technique alone is insufficient unless it directly invalidates *this* evidence (e.g., "the bite mark analysis was central and is now debunked"). *Misfire:* Truly innocent inmates in error clusters may be denied if no case-specific flaw is found.  
      - **Deterrence/Denunciation Exclusion:** These are institutional goals, not case-level facts. Including them would force arbitrary guesses. *Misfire:* A "deserving" execution (on retributive grounds) might be wrongly commuted on other grounds, undermining systemic messaging.  
      - **Dementia & Competency (Case 3):** Ground 3 covers incapacity impairing "understanding" or "connection to past acts." If documented, it goes to the board. But if it’s purely *legal competency* ("Does he understand *why* he’s being executed?"), it’s a court matter. The procedure **must say "not our question"** if no medical incapacity exists.  

  3.  **Inherent Judgment Calls Masked as Steps:**  
      - Ground 2: Deciding if cases are "comparable" (analyst) and if disparity is "gross" (board).  
      - Ground 3: Deciding if change is "exceptional" or incapacity "severe" (board).  
      - All Grounds: Assessing "credibility" of evidence (analyst).  

  ---

  ### **Test Case Outcomes**  
  1.  **Solid Guilt, 19 y/o, Co-Defendants Alive, Unblemished 34 Years:**  
      - **Ground 1:** Terminate → DENY (guilt solid).  
      - **Ground 2:** Proceed. Co-defendants likely "similarly situated." **Recommend Commutation** via Board Judgment (disparity is stark/unexplained).  
      - *Not Ground 3:* "Unblemished" is prison routine, not "exceptional transformation."  
      - **OUTCOME: RECOMMEND COMMUTATION (Ground 2).**  

  2.  **No Individualized Doubt, Repudiated Forensic Technique, Exoneration Cluster:**  
      - **Ground 1:** Terminate → DENY. No *case-specific* new evidence; general error rates are irrelevant. The technique’s repudiation alone doesn’t create doubt unless it directly invalidates this evidence (e.g., if analyst finds the technique was the *only* physical evidence).  
      - **Ground 2-4:** No other grounds triggered.  
      - **OUTCOME: RECOMMEND DENIAL.**  
      - **Why you might dislike this:** It excludes systemic innocence risk. But feeding "4% error rates" into Ground 1 would conflate group statistics with individual justice. Clemency isn’t actuarial; it requires a case-specific hook.  

  3.  **Probably Guilty, Weak Disparity, Advanced Dementia:**  
      - **Ground 1:** DENY.  
      - **Ground 2:** DENY (weak disparity).  
      - **Ground 3:** **Proceed.** Dementia is documented severe incapacity likely impairing understanding/connection to past acts. **Recommend Commutation** via Board Judgment.  
      - **OUTCOME: RECOMMEND COMMUTATION (Ground 3).**  

  ---

  ### **One-Page Board Member Summary**  
  **Clemency Evaluation: Four Independent Grounds**  
  Recommend Commutation if *any* ground is met. Deny if none are.

  1.  **DOUBT ABOUT GUILT?**  
      - *Analyst Finding:* Is there **new, strong evidence** creating real doubt they did it? (e.g., DNA, hidden proof, lying cop).  
      - *Your Role:* None. Analyst decides facts. If "No," move on.  

  2.  **UNFAIR SENTENCE COMPARED TO OTHERS?**  
      - *Analyst Finding:* Provided list of **co-defendants** (roles/sentences) and **similar cases** (crime/aggravators).  
      - *Your Judgment:* Is this death sentence **wildly out of line**? Ignore small differences; focus on glaring gaps with no good reason.  

  3.  **CHANGED PERSON OR TOO BROKEN TO EXECUTE?**  
      - *Analyst Finding:* Provided proof of **extraordinary rehabilitation** (e.g., stopped prison riots, educated others) **or severe decline** (e.g., dementia, psychosis).  
      - *Your Judgment:* Is the change **deep and real**, or the decline so bad that executing them feels pointless/cruel? Ignore routine aging or "good behavior."  

  4.  **WILL THE EXECUTION ITSELF CAUSE UNIQUE HARM?**  
      - *Analyst Finding:* Proof execution would be **medically torturous** for them, or **devastate innocent dependents** (e.g., orphan a child).  
      - *Your Judgment:* Is the harm **unusually cruel or irreversible**?  

  **HOW TO DECIDE:**  
  - If Analyst says "Meet Standard" for Ground 1 → COMMUTE.  
  - If YOU see strong Grounds 2, 3, or 4 → COMMUTE.  
  - If none apply → DENY.  

  **WARNINGS:**  
  - **Don’t mix grounds.** A "changed person" (3) isn’t proof of innocence (1). A "disparity" (2) doesn’t mean he didn’t do it.  
  - **Ignore:** "This execution will deter crime" or "society needs closure." Those aren’t case-specific.  
  - **No data?** If Analyst says "no info," you decide if that absence itself suggests unfairness (e.g., no co-defendant records in a group crime).  

  ---

  ### **Why Ground 3 Isn’t Bogus, But Is Flawed**  
  Your "desert transfer" hunch (Ground 3) is philosophically sound but operationally fraught. We kept it because:  
  - It captures intuitive clemency reasons (e.g., "he’s not the same man").  
  - It avoids forcing all commutations into disparity (Ground 2), which fails for lone actors.  
  **The Flaw:** It conflates two distinct concepts—**moral change** (rehabilitation) and **incapacity** (dementia). We merged them because both challenge "desert," but they fail differently:  
  - **Rehabilitation** asks, "Does he *still* deserve death?"  
  - **Incapacity** asks, "Can death *mean* anything to him now?"  
  Analysts can’t split this hair. We rely on *documented extremes* (exceptional conduct vs. medical collapse) to force clear cases to the board. It’s imperfect but workable. If you split them, analysts drown in subjectivity.  

  **Final Note:** Case 2’s denial is the "disliked" outcome. It exposes the procedure’s (and clemency’s) core tension: mercy requires individual focus, but systemic failures demand systemic fixes. This tool can’t bridge that gap.
