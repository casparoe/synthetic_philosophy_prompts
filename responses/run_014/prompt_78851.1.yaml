prompt: |-
  I'm TAing a fifty-minute section next week for second-years on iterated elimination of dominated strategies, and the new bit is strategies that get knocked out by a *mix* of other strategies rather than by any single pure one. Don't explain the material to me — plan how I should teach it. What order do the pieces have to go in, given that they've only done pure-strategy dominance and pure Nash so far, and they've met mixed strategies only as the thing a player does in equilibrium? What's the one example that carries the whole thing — I want it small, with no pure strategy dominating anything, and with the iterating actually doing work past the first round — and what should that example conspicuously not have? Which misconceptions will they walk in with or form (I'm guessing "the mix that dominates is the mix you'd play in equilibrium", "you can eliminate in any order", and "whatever survives is a Nash strategy") and at which point in the sequence do I head each one off? One I'm unsure about: order-independence holds for strict dominance but breaks once weak dominance is on the table — how do I say the true thing without opening that whole can of worms at this level? There's also a fact I like, that the average of two undominated strategies can itself be strictly dominated even when neither of them is; tell me wheather that earns a place in fifty minutes, and where. Then finish with one question to ask at the close that shows whether they've actually got it, and what I should flatly refuse to get into.
reasoning: |-
  Okay, the TA is preparing a fifty-minute section on iterated elimination of dominated strategies, focusing on mixed strategies. They need a lesson plan that builds on what students already know—pure strategy dominance and pure Nash equilibrium—with minimal exposure to mixed strategies only as part of equilibrium play. The key challenge is introducing mixed strategies as tools for elimination without diving into full mixed strategy concepts. 

  First, I need to sequence the content logically. The TA mentioned students have seen pure dominance and pure Nash, so starting there makes sense. Then introduce the idea that sometimes no pure strategy dominates another, but a mix can. The example has to be small, with no pure dominators, and iterating beyond round one. The TA wants to avoid certain misconceptions, like confusing the dominating mix with equilibrium play or thinking elimination order doesn't matter. Also, there's a tricky bit about order-independence for strict vs. weak dominance—how to mention it without derailing the lesson.

  For the core example, Prisoner's Dilemma won't work because pure dominance clears it immediately. Matching Pennies is too symmetric; nothing dominates. A 3x3 matrix sounds right. The TA suggested a specific game: Player 2 has strategies L, M, R; Player 1 has U, M, D. Payoffs set so that R dominates M for Player 2 only if Player 1 mixes U and D. Then after eliminating M, Player 1's D becomes dominated by U. This shows iteration and mixed dominance without extra complexity. 

  The misconceptions: Students might think the mix used for elimination is what players "should" play in equilibrium. I need to clarify early that this is just a logical tool. Order-independence holds for strict dominance but not weak; I can state it as a rule without explaining why yet. And surviving strategies aren't necessarily Nash—emphasize that iterated elimination is about rationality, not equilibrium. The fact about averages being dominated might be cool but time-consuming; perhaps skip it or mention briefly if time allows. 

  For the closing question: Ask them to identify if a strategy is dominated by a mix in a new example. Something like "Is there a mixed strategy that dominates X?" to test application. And refuse to get into weak dominance tangles or proofs. 

  Now, structuring the fifty minutes: Review pure dominance quickly (5 min), introduce the problem of no pure dominator (5 min), show mixed dominance concept with the example (15 min), do the iteration step-by-step (10 min), address misconceptions during explanations, and end with practice and recap. Keep it tight, interactive, and focused on the key insights.
answer: |-
  Here’s a battle-tested lesson plan for your 50-minute section, prioritizing clarity, flow, and preempting misconceptions:

  **Order of Operations (45-48 min total):**
  1.  **(5 min) Lightning Review:** Pure IESDS & Pure Nash.
      *   *Q:* "In pure IESDS, what lets us eliminate a strategy? (Strictly dominated by *some pure* strategy). What survives? (Rationalizable strategies). What's the connection to Nash? (Nash survives, but survivors aren't necessarily Nash)."
      *   *Goal:* Reactivate prior knowledge, emphasize "surviving ≠ Nash".

  2.  **(7 min) The Problem & The Core Insight:**
      *   "What if *no single pure strategy* dominates a strategy? Can it *still* be irrational?" Show a simple 2x2 where nothing is pure-dominated (e.g., Matching Pennies - but *don't* solve it here). "Today: A strategy can be strictly dominated by a *mixture* of your other strategies, even if no single pure one does it. We eliminate it for the same reason: whatever the opponent does, the mix gives strictly better payoff."

  3.  **(15 min) THE KEY EXAMPLE (3x3 Game):**
      *   **Use this payoff matrix (Player 1 Rows, Player 2 Columns):**
          ```
              L     M     R
          U  1,0   1,2   0,1
          M  0,3   0,1   2,0
          D  2,0   0,1  -1,3
          ```
      *   **Properties:**
          *   Small (3x3).
          *   **No pure strategy dominates any other pure strategy initially** (Check rows: U not dom by M/D, M not dom by U/D, D not dom by U/M. Check columns: L not dom by M/R, M not dom by L/R, R not dom by L/M).
          *   **Mixed Domination Exists:** Player 2's M is strictly dominated by a 50/50 mix of L and R.
              *   *Demo:* Against P1 U: Mix (0.5L, 0.5R) = 0.5*0 + 0.5*1 = **0.5** > M=**0**
              *   Against P1 M: 0.5*3 + 0.5*0 = **1.5** > M=**1**
              *   Against P1 D: 0.5*0 + 0.5*3 = **1.5** > M=**1**
          *   **Iteration Works:** After eliminating Player 2's M, the game reduces. Now Player 1's D is strictly dominated by U (check against L: 2> -1? Against R: 1 > -1?).
          *   **Survivors ≠ Nash:** Final survivors: (U, L) and (U, R). Neither is Nash! (U,L): P2 wants R (1>0). (U,R): P1 wants M (2>0)).
      *   **Walkthrough:**
          1.  Show matrix. Have students confirm no pure dominance.
          2.  Demonstrate M is mixed-dominated by 50/50 L&R. *Ask:* "Is M ever a best response? Could a rational P2 *ever* play M?" (No).
          3.  **ELIMINATE M.** Redraw matrix without column M.
          4.  In the reduced game (U/M/D vs L/R), show D is now strictly dominated by U.
          5.  **ELIMINATE D.** Reduced game: U/M vs L/R.
          6.  **Stop.** Point out *no further elimination* possible by strict dominance (pure OR mixed). *Ask:* "Pure Nash?" (None). "Mixed Nash?" (Exists: P1 plays U/M 50/50, P2 plays L/R 50/50 - but **DO NOT SOLVE IT**, just note we found rationalizable strategies).

  4.  **(8 min) Procedure & Rules Formalized:**
      *   "Iterated Elimination of Strategies Strictly Dominated *by Pure OR Mixed Strategies*."
      *   **Rule 1:** At each round, eliminate *all* strategies strictly dominated (by any pure or mixed strategy over *surviving* strategies).
      *   **Rule 2 (Crucial):** You *must* eliminate *all* dominated strategies *before* moving to the next round. (Preps for order-independence).
      *   **Rule 3:** What survives? Strategies that are **rationalizable**. (Emphasize: NOT necessarily Nash! Our example proves it).
      *   **Order Independence:** "A key property: For *strict* dominance, the *final set* of survivors is always the same, no matter what order you eliminate strategies in each round, *as long as you eliminate all dominated strategies at that round*." (State firmly, do *not* justify or mention weak dominance. Just present it as a rule of the procedure).

  5.  **(7 min) Actively Combatting Misconceptions:**
      *   **Misconception 1: "The mix is the equilibrium mix."**
          *   *When:* During Step 3 (Example) and Step 4 (Rules).
          *   *Head-off:* "The mix (50/50 L&R) is a *tool* to prove M is irrational. It does *not* mean P2 'should' play 50/50 in equilibrium. Equilibrium analysis comes *later*; this is about eliminating irrational choices first." Contrast the 50/50 mix used for elimination with the actual mixed Nash in the example (if mentioned).
      *   **Misconception 2: "Surviving strategies are Nash."**
          *   *When:* During Step 3 (Example Conclusion) and Step 4 (Rules).
          *   *Head-off:* Explicitly point out the survivors in the example are not Nash. "IESDS tells us what *could* be played by rational players who know others are rational. Nash tells us what *is* played in a stable state. They are related but different concepts. Survivors are rationalizable, *not* necessarily Nash."
      *   **Misconception 3: "You can eliminate in any order (within a round)."**
          *   *When:* During Step 4 (Rule 2).
          *   *Head-off:* Stress Rule 2 HARD: "You *must* eliminate *every* dominated strategy visible *in the current reduced game* before recalculating dominance in the next round. Skipping one can change the outcome!" (Mention order-independence *across rounds* is guaranteed only if you do full rounds). "We do full rounds to guarantee we get the correct, unique set of survivors."

  6.  **(3 min - Optional/Timely) The Cool Fact:**
      *   *If* you have time after solidifying Steps 3-5: "Here's a wild twist: Sometimes, a *pure* strategy isn't dominated, and another *pure* strategy isn't dominated, but a *mixture* of those two *is* strictly dominated by a *third* pure strategy! This shows why checking mixtures matters. (You could hint at an example like Shapley's game, but don't spend time solving it. Just state the fact as a mind-bender)."
      *   *If short on time:* Skip it. Core concepts are more important.

  **Closing Question (2 min):**
  *   **Question:** "In the reduced game *after* eliminating Player 2's M in our example (U/M/D vs L/R), is Player 1's M strictly dominated? By what? (Pure or mix?)" (Answer: No. Against L: U=1, M=0, D=2 -> D best. Against R: U=0, M=2, D=-1 -> M best. No pure or mix dominates M at this stage).
  *   **Why it works:** Tests if they understand 1) Reduced game context, 2) Identifying dominance requires checking against *all* opponent surviving strategies, 3) Recognizing when a strategy *isn't* dominated even after some elimination. If they say "Yes, by U", they missed checking payoffs against R. If they say "Yes, by a mix", they likely didn't check properly.

  **What to FLATLY Refuse to Get Into:**
  *   **Weak Dominance:** Do *not* mention it. Say: "Today is only about *strict* dominance. Weak dominance changes things (like order-dependence) and is a topic for later." Shut down any "what if it's weakly dominated?" questions.
  *   **Solving Mixed Nash Equilibrium:** If they ask about the mixed NE in the example, say: "That's great you're thinking ahead! We'll cover solving mixed Nash in detail soon. For today, focus on how IESDS helps us simplify the game *before* we look for equilibrium."
  *   **Formal Proofs (Order-Independence, Rationalizability):** "The properties we stated about the procedure (like getting the same survivors) can be proven, but that's beyond our scope today. Trust the rules for now."

  **Why this works:**
  1.  **Builds Step-by-Step:** Pure -> Problem -> Mixed Domination Concept -> Iteration in Action -> Formal Rules.
  2.  **Example is the Workhorse:** Does everything needed (no pure dom, mixed dom exists, iteration works, survivors ≠ Nash) and nothing extra.
  3.  **Proactive Misconception Busting:** Addresses the big 3 head-on at the point they're most likely to arise.
  4.  **Manages Complexity:** States order-independence for strict dominance without caveats by ignoring weak dominance entirely. Limits the cool fact to a "fun extra".
  5.  **Closes with Application:** The question forces synthesis, not just recall.
  6.  **Clear Boundaries:** Knowing what *not* to cover is as important as knowing what to cover in 50 minutes.

  **Good luck!** Your focus on misconceptions and sequencing is exactly what makes a great TA session.
