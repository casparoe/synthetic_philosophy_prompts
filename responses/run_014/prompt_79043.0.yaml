answer: |-
  **Does origin essentialism reduce to a norm for tracing biological lineages when decomposed into its four constituent claims and tested against anomalies?**

  **Aims and Background**  
  Origin essentialism—the thesis that a human organism necessarily originates from the specific gametes or zygote that produced it—functions as a foundational intuition in contemporary metaphysics, often invoked to support modal claims about identity. Yet defenses rely almost exclusively on a single, idealized conception scenario. I propose that this thesis decomposes into four distinct claims:  
  1. *Zygote Essentialism*: Necessarily, the organism originates from *this* fertilized egg.  
  2. *Gamete-Pair Essentialism*: Necessarily, the organism originates from *this specific sperm and egg*.  
  3. *Genome Essentialism*: Necessarily, the organism possesses *this specific nuclear genome*.  
  4. *Lineage Essentialism*: Necessarily, the organism has *these specific biological parents*.  

  Standard arguments treat these as equivalent. However, three biological anomalies demonstrate they are logically separable and force conflicting commitments:  
  - **Monozygotic Twinning**: A single zygote divides to produce two distinct organisms. This challenges Gamete-Pair Essentialism’s claim to individuate organisms, as two persons share the same gamete-pair origin.  
  - **Chimerism**: Fusion of two distinct zygotes creates a single organism with dual cellular lineages. This violates the presupposition that an organism has a singular origin, forcing a choice: is the origin the surviving zygote, the fusion event, or both?  
  - **Mitochondrial Replacement Therapy (MRT)**: An embryo formed from intending parents' nuclear DNA implanted into a donor’s enucleated egg (containing cytoplasm and mitochondria). This creates ambiguity: does the "origin" include the donor’s mitochondrial genome? Her cytoplasm? Neither? Each answer privileges a different decomposed claim.  

  **Hypothesis and Approach**  
  I hypothesize that systematically applying these cases to the four claims will show that no robust version of origin essentialism survives without collapsing into a trivial norm governing how we *describe* biological lineages, rather than revealing a deep modal fact about individuals. Crucially, standard defenses and objections fail because both sides presuppose the monolithic thesis and the idealized case, neglecting the need to define "origin" precisely. My approach is conceptual: I will analyze each anomaly to test candidate principles of origin (e.g., "An origin is the earliest biological entity materially continuous with the organism"). I will directly address the objection that these are mere curiosities by demonstrating how they expose fundamental ambiguities in the thesis’s core concepts, rendering it vulnerable to counterexamples even if rare.  

  **Work Plan (15-Week Semester)**  
  1. **Weeks 1-2**: Decompose origin essentialism. Articulate the four claims, their interrelations, and their roles in existing arguments. Formalize candidate necessity principles.  
  2. **Weeks 3-5**: Case 1 – Twinning. Analyze implications for Gamete-Pair and Zygote Essentialism. Does sharing an origin undermine necessity? Develop criteria for individuating origins.  
  3. **Weeks 6-8**: Case 2 – Chimerism. Interrogate Zygote Essentialism and the "single origin" assumption. Assess solutions (e.g., privileging one zygote, accepting fusion as origin) against principles.  
  4. **Weeks 9-11**: Case 3 – MRT. Stress-test all four claims simultaneously. Does mitochondrial DNA define an origin? Does cytoplasmic contribution? Evaluate conflicts between Genome, Lineage, and Zygote claims.  
  5. **Weeks 12-13**: Synthesis & Normativity. Determine which claims (if any) withstand all cases. Assess if surviving necessity is metaphysically substantial or merely reflects descriptive practices for tracing parental/generative lineages.  
  6. **Weeks 14-15**: Drafting core argument and responses to anticipated objections (e.g., "biological accidents don't refute modal truths").  

  **Deliverables**  
  1. An **8,000-word journal-ready paper** definitively answering the core question. It will include:  
     - The decompositional framework.  
     - Detailed case analyses demonstrating the claims' divergence.  
     - Assessment of the thesis's residual strength/metaphysical significance.  
  2. A **small, focused workshop** (virtual or in-person) presenting the paper to 5-6 leading specialists in essentialism or philosophy of biology for critical feedback prior to submission.  

  **Defining Success vs. Clarification**  
  A **significant result** would be demonstrating that *no* version of origin essentialism stronger than a lineage-tracing norm remains coherent after confronting all three anomalies—revealing the intuition as pragmatic, not metaphysical. **Merely clarifying** would be showing that some claims (e.g., Lineage Essentialism) remain intact after refinement, while others fail, without challenging the thesis's core modal import. Success entails a fundamental weakening of the thesis's philosophical utility.  

  **Failure Mode and Scope**  
  The **primary failure mode** is that a minor modification coherently reconciles all cases with a substantively modal origin essentialism (e.g., defining "origin" as the unique nuclear genome lineage). *If this occurs, the project concludes that origin essentialism survives the anomalies intact, and the central hypothesis is falsified.* This is a valid outcome.  
  **Scope is achievable** within one semester of partial teaching relief *if* focused strictly on conceptual analysis of the three specified cases against the four claims. Broader biological anomalies or historical conceptions of essence would exceed scope. If cuts are necessary, the MRT analysis (the most complex) would be streamlined by focusing solely on nuclear vs. mitochondrial genome conflict, deferring cytoplasmic contribution.  

  **Conclusion**  
  This project resolves the seminar's annual impasse by forcing a precise definition of "origin" and testing necessity claims against real biological complexity. It promises either a significant deflation of a major metaphysical thesis or a robust, anomaly-proof restatement—both valuable outcomes. The risk of a negative result (a viable patch) is inherent and acknowledged.
