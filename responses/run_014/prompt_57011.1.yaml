prompt: |-
  We're doing a unit on human enhancement in my ethics elective and my teacher is convinced there's a clean line between therapy and enhancement — fixing a disease versus upgrading someone who's already healthy — and that the line is what makes enhancement sketchy. I tried to argue him out of it and I think I blew up my own side. Here's the argument:

  (1) A medical intervention counts as therapy only if it restores normal functioning.
  (2) "Normal functioning" is always relative to some reference class — a species, an age group, a population.
  (3) Which reference class you use isn't settled by the body: growth hormone for a really short kid is therapy measured against kids below the first percentile and enhancement measured against the average kid.
  (4) So whether something is therapy depends partly on a choice we make, not just on facts about the drug.
  (5) So the therapy/enhancement line isn't a real joint in the world, its just wherever we happen to draw it.
  (6) And if the line is only a drawing exercise, the objection that enhancement is wrong because it goes beyond healing can't be doing any work, since it would sweep in glasses, vaccines and learning to read, all of which push people above some reference class.
  (7) So there's no principled way to object to enhancement.

  He read it and said (7) is obviously false — some enhancements are exactly the ones worth objecting to, like rich parents buying their kid a better memory while everyone else just queues — and that if the conclusion is false, one of my steps has to be broken. I'd much rather keep (3) and (5), those are the interesting ones. So which step do I give up, or which inference, if the steps are all fine on their own? Why did it look harmless when I wrote it, and what do I actually lose by dropping it — does my teacher get his bright line back, or only a fuzzier version of it that can't support the weight he puts on it? And if you think nothing's broken, tell me which conclusion I'm supposed to swallow instead.
reasoning: |-
  Okay, let me unpack this student's ethics dilemma. They're wrestling with their teacher's firm therapy-enhancement distinction and their own argument that backfired. The core tension is between wanting to defend the social/political critique of enhancements (like unequal access) while dismantling the biological bright line between therapy and enhancement.

  Hmm, the student's argument is actually quite sophisticated - they've correctly identified that reference classes are socially constructed (step 3) and that this makes the therapy label contingent (step 5). Where things went wrong is in step 6's leap to "therefore no principled objection to enhancement." The teacher's counterexample about memory enhancement for rich kids exposes the flaw: the student conflated the biological distinction with the ethical concerns.

  I notice the student really wants to preserve steps 3 and 5 about reference classes being arbitrary. That's smart because those steps are philosophically sound - think about how "normal" height changes across generations or populations. But they need to surrender step 6's inference. The ethical problems with enhancement aren't about crossing some biological threshold, but about justice, coercion, or human flourishing. 

  The vaccine example is telling - it "enhances" immunity beyond natural levels, but we don't object because it's universally beneficial. Whereas cognitive enhancements for only the wealthy create unfair advantages. So the real issue isn't enhancement per se, but the social context. 

  What the student loses by conceding this is the clean debunking of the therapy/enhancement line, but they gain a stronger critique: the teacher's bright line can't bear ethical weight because many therapies are enhancements (glasses, vaccines) and many enhancements are ethically neutral or positive. The line isn't false, just ethically irrelevant. 

  The path forward is to say: "You're right that some enhancements are objectionable, but not because they cross some biological line - because they create unfairness or undermine human values. And since many therapies are enhancements, your initial distinction can't do the ethical work you want it to."
answer: |-
  Your argument is clever but overreaches at step (6). The flaw isn't in your observation that the therapy/enhancement distinction is socially constructed (steps 1-5 are defensible), but in assuming that **because the line is arbitrary, objections to enhancement must collapse**. Your teacher is right that step (7) doesn't follow – but you can preserve your core insights while acknowledging why some enhancements *are* ethically problematic. Here's how to diagnose and fix it:

  ### The Breakdown: Step (6) → (7) is Invalid
  - **Step (6) claims**: If the line is arbitrary, then objections based *solely* on "going beyond healing" are incoherent.  
  - **Step (7) infers**: Therefore, *no principled objections to enhancement exist*.  
  - **The error**: You conflate **one specific objection** ("enhancement violates the healing/natural boundary") with **all possible objections**. Your argument successfully undermines the *boundary-based objection*, but not other ethical concerns (justice, coercion, unintended consequences, etc.).  

  ### Why Your Teacher's Counterexample Lands
  His rich-parents/memory-enhancement example targets **distributive justice** – an objection *independent* of the therapy/enhancement boundary. Your argument didn't address this. Even if "therapy vs. enhancement" is fuzzy, we can still object to enhancements that:  
  - Exacerbate inequality (e.g., only accessible to elites)  
  - Create unfair competitive advantages  
  - Undermine human dignity or autonomy  
  - Carry high risks for non-essential benefits  

  ### How to Salvage Your Core Insights (Steps 1-5) While Avoiding (7)
  1. **Keep steps (1)-(5) intact**: They correctly show the therapy/enhancement distinction is **context-dependent and value-laden**. Glasses, vaccines, and literacy *are* enhancements relative to some baselines. This *does* undermine your teacher's "clean line."  
  2. **Revise step (6)**: *"Therefore, objections to enhancement based SOLELY on crossing a 'natural' or 'species-typical' boundary are incoherent or arbitrary, because many uncontroversial interventions (glasses, vaccines) also cross this boundary."*  
  3. **Replace step (7)**: *"Thus, ethical objections to enhancement cannot rely on the therapy/enhancement distinction alone. They must appeal to OTHER values (e.g., justice, safety, autonomy, social consequences)."*  

  ### What You Gain (and What Your Teacher Loses)
  - **You win**: Your teacher's "bright line" **cannot bear ethical weight**. If he objects to memory enhancement for rich kids, he must appeal to *justice*, not "unnaturalness." Vaccines enhance immune function "unnaturally" but are ethically mandatory.  
  - **He keeps a (weaker) distinction**: A *fuzzy*, socially relative therapy/enhancement line still exists (e.g., "treating pathology" vs. "improving beyond typical function"). But it’s only useful for **clinical categorization**, not as an **ethical boundary**. It can't condemn enhancement *by itself*.  
  - **Stronger position**: You force the debate onto more honest terrain: *"What specific harms or injustices might this enhancement cause?"* rather than *"Does it cross the magic line?"*  

  ### Where to Go Next: Defend Enhancements Contextually
  Concede that *some* enhancements *are* objectionable – but for concrete reasons:  
  - **Example 1**: Cosmetic muscle augmentation for athletes → **unfair competition** if unregulated.  
  - **Example 2**: Gene editing for intelligence → **exacerbates inequality** if only available to the wealthy.  
  - **Counterexample**: Vaccines → "enhance" immunity beyond natural levels, but are **universally beneficial and low-risk**.  

  ### Why Your Argument Felt Harmless (and How to Fix It)
  You assumed the *only* objection to enhancement was "crossing the natural line." That’s false – your teacher likely had **implicit concerns** (justice, hubris) masked by the "therapy vs. enhancement" framing. Your argument exposed that framing as flawed, but didn't address the deeper worries.  

  **Conclusion**: Surrender step (7), but **not** steps (3) or (5). Replace them with:  
  *"The therapy/enhancement distinction is socially constructed and ethically inadequate. We should evaluate interventions – whether called 'therapy' or 'enhancement' – based on concrete impacts: Do they reduce suffering? Promote fairness? Respect autonomy? Avoid harm? The label 'enhancement' alone doesn’t settle the ethical question."*  

  This forces your teacher to defend his objections on **substantive grounds** – which is where the real debate should be.
