prompt: |-
  I'm teaching an upper-level seminar on value theory, and last week a student brought in a passage from a trade book on decision-making that she'd found persuasive. The book summarizes the debate over incommensurable values roughly as follows: 'Philosophers say values are incommensurable when they cannot be measured on a common scale, the way different lengths can be converted into inches. If two options cannot be so measured, then neither is better than the other — there is simply no fact of the matter about which to choose. Ruth Chang's contribution was to add a third possibility besides better and worse: her notion of parity, where two options are on a par, meaning they are roughly equal in value. The upshot is that when facing a hard choice between, say, two careers, reason runs out. Whatever you pick, you pick arbitrarily, though afterwards you can invest your choice with meaning by coming to endorse it. This is why hard choices show that we are not really rational maximizers at all.'

  My instinct is that this compresses a genuinely technical debate into something of a caricature, but I would rather not simply tell her so without being able to say exactly where. Would you go through it and separate what a theorist in this literature would accept, what is a tendentious but defensible gloss, and what is a straightforward misreading? I'd particularly like you to attend to three things: whether incommensurability implies that no betterness facts hold between the options, whether parity is or is not the same as approximate equality, and whether the conclusion that choices between such options are arbitrary actually follows from anything in the positions the passage describes — including whether the book's closing remark about rational maximizers is earned by what precedes it. Please be explicit about where a defender of the views being summarized would insist the passage has conflated two claims that the literature keeps apart.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're teaching an upper-level seminar on value theory, and a student brought in a passage from a trade book about incommensurable values and Ruth Chang's parity concept. The user thinks the passage might be a caricature and wants to pinpoint inaccuracies. Specifically, they want to know where the passage misrepresents the technical debate, especially regarding incommensurability implying no betterness facts, parity vs. approximate equality, and whether choices are arbitrary.

  First, I need to recall the standard literature on incommensurability. Philosophers like Joseph Raz and Ruth Chang argue that incommensurability means no common measure, but that doesn't necessarily mean no betterness relation. The passage claims that if values can't be measured, then neither is better, which is a common misunderstanding. Actually, the absence of a common scale might still allow for one option to be better in some contexts, or for other relations like parity to exist.

  Next, the passage equates parity with approximate equality. I remember Chang explicitly distinguishes these. Approximate equality implies a small, measurable difference, while parity is a fourth relation beyond better, worse, or equal. It's a distinct category where items are comparable but not measurable on a single scale. The passage's conflation here is a significant error that Chang herself addresses.

  Then there's the claim that choices between incommensurable options are arbitrary. The passage suggests that reason "runs out," leading to arbitrary decisions. But Chang argues that even without a single best option, choices can be justified through commitment. The decision isn't arbitrary; it's based on creating reasons post-choice. This ties into the critique of rational maximization. The passage concludes that we're not rational maximizers, but that's too simplistic. Rationality might involve more than maximization, like commitment-based reasons.

  The user also wants to know where defenders would see conflation. The key points are collapsing no common measure into no betterness, confusing parity with equality, and conflating underdetermination with arbitrariness. Highlighting these distinctions is crucial for the student's understanding.

  I should also consider the user's deeper needs. They're teaching a seminar, so providing clear, lecture-ready points is important. The student might be persuaded by the trade book, so the user needs a thorough rebuttal to clarify misconceptions. Emphasizing Chang's actual arguments versus the book's simplifications will help the student engage with the primary literature more critically. The user might also want to foster deeper class discussion on rationality and value comparability, so pointing out these nuances supports that pedagogical goal.
answer: |-
  Here's a breakdown of the passage, separating accurate claims, tendentious glosses, and misreadings, specifically addressing your three focal points and highlighting key conflations:

  **What the Passage Gets (Mostly) Right:**

  1.  **Basic Definition of Incommensurability:** The initial definition ("values are incommensurable when they cannot be measured on a common scale") is a standard starting point. The analogy to length is common.
  2.  **Chang's Core Contribution:** It accurately identifies Chang's introduction of "parity" as a *third* fundamental value relation distinct from "better than," "worse than," and "equally good."
  3.  **Hard Choices & Reason:** It captures the central idea that incommensurability (and parity) scenarios present "hard choices" where reason, understood as identifying a single *determinately best* option, "runs out."
  4.  **Endorsement/Commitment:** The idea that we can "invest our choice with meaning by coming to endorse it" reflects Chang's (and others') views on commitment creating new reasons *after* the choice, though the passage significantly oversimplifies and miscontextualizes this.

  **Tendentious but Defensible Glosses (Interpretations a Defender Could Argue For, But Are Not Strictly Necessary or Uncontroversial):**

  1.  **"Neither is better than the other":** While often used as a shorthand *consequence* of incommensurability in specific cases, stating it so baldly *as the definition* is imprecise (see misreading 1 below). A defender could argue this is just loose phrasing meaning "no determinate betterness relation holds," but it's misleading.
  2.  **"Simply no fact of the matter":** This leans towards a strongly realist interpretation of value facts. While many theorists hold this view, others (constructivists, expressivists) might frame the indeterminacy differently (e.g., as a lack of applicable rational criteria, not necessarily an ontological lack of fact). The passage presents it as the *only* view.
  3.  **The Upshot for Choice:** Framing the "upshot" as reason running out leading to a choice *needing* to be arbitrary *is* a major strand in the literature (especially skepticism inspired by Isaiah Berlin). Chang explicitly argues *against* this conclusion, but the passage presents it as the direct consequence of the positions described, including parity.

  **Straightforward Misreadings and Conflations:**

  1.  **Misreading: Incommensurability Implies No Betterness Facts Hold.**
      *   **The Passage Says:** "If two options cannot be so measured, then **neither is better than the other** — there is simply no fact of the matter about which to choose."
      *   **The Literature Distinction:** This **conflates two distinct claims**:
          *   Claim A: There is no *single cardinal scale* (common measure) for comparing the values.
          *   Claim B: *No comparative relation holds* (i.e., it's not true that A>B, not true that B>A, and not true that A=B).
      *   **The Reality:** Claim A (incommensurability) does *not* necessarily imply Claim B (no betterness facts). Incommensurability often implies that *neither strict betterness nor equality holds*, but it *can* allow for other relations. Crucially, **Ruth Chang's "parity" is precisely introduced as a fourth relation *distinct* from "better than," "worse than," and "equally good" that *can* hold between incommensurable options.** For Chang, parity *is* a comparative relation (they *are* comparable), just not one reducible to the other three. Claim B (no relation holds) describes *incomparability*, which is a specific, stronger, and rarer form of failure than incommensurability. **The passage incorrectly collapses incommensurability into incomparability.**

  2.  **Misreading: Parity is Approximate Equality.**
      *   **The Passage Says:** "her notion of parity, where two options are on a par, meaning they are **roughly equal in value**."
      *   **The Literature Distinction (Chang's Explicit Rejection):** Chang strongly and repeatedly argues that parity **is not** the same as "rough equality" or "being close in value." This is a central point of her work.
          *   **Approximate Equality:** Implies a *small, measurable* difference on a common scale. If two lengths are 10.1 inches and 10.2 inches, they are approximately equal *because* the difference is small *on the inch scale*. Approximate equality *presupposes* commensurability (a common scale) and a small difference on it.
          *   **Parity:** Precisely applies when there is *no* common scale that can capture the difference. The values are different in kind, and while neither is better overall nor exactly equal, their difference isn't a matter of degree on a single scale; it's a qualitative difference that makes a small measurable difference nonsensical. Imagine comparing the value of Michelangelo's David to Shakespeare's Hamlet. Is one slightly better? Are they exactly equal? Chang argues neither is true; they are *on a par* – both are great achievements, but their greatness is of such different kinds that ranking them quantitatively (even roughly) is impossible. **The passage fundamentally misrepresents Chang's core concept by conflating parity with approximate equality, which her theory explicitly denies.**

  3.  **Misreading: Arbitrariness Follows & Rational Maximization is Refuted.**
      *   **The Passage Says:** "reason runs out. **Whatever you pick, you pick arbitrarily**... This is why hard choices show that **we are not really rational maximizers at all**."
      *   **Why it Doesn't Follow (Especially from Chang):**
          *   **Conflation 1 (Incommensurability -> Incomparability -> Arbitrariness):** The passage builds a faulty chain: No common measure (A) -> No betterness facts (B - which is incorrect) -> No fact of the matter (C) -> Choice must be arbitrary (D). Even if A -> C were true, C -> D does not strictly follow. Many theorists (including Chang) argue that choices under indeterminacy aren't *arbitrary*; they can be *justified* by other considerations (commitment, projects, identity, will) even if not by a prior "best" fact.
          *   **Chang's Specific Rejection of Arbitrariness:** Chang's entire project aims to show that hard choices (where parity often holds) are *not arbitrary*. She argues that while reason doesn't determine a unique best option, it *structures* the choice (ruling out worse options). Crucially, she argues the agent can exercise their normative power to *create* new reasons by committing to one option, making it *their* choice for *their* reasons. The commitment *transforms* the choice from arbitrary to *willed* and *owned*. The passage mentions "endorsement" but frames it as something happening *after* an *already arbitrary* choice, stripping it of its justificatory power *in* the choice.
          *   **Rational Maximization:** The passage concludes that because reason runs out and choice is arbitrary, we aren't rational maximizers. This is a leap.
              *   First, it assumes "rational maximizer" requires a *unique, determinately best* option identifiable by reason for *every* choice. Many decision theories accommodate weak ordering, incompleteness, or satisficing without abandoning rationality.
              *   Second, **Chang explicitly argues her view *preserves* rationality in hard choices.** She contends that rationally committing to an option on a par with others *is* a rational response to the normative structure. She rejects the idea that rationality requires maximization based on pre-existing betterness facts alone. Her target is often a specific, narrow conception of rational choice (classical maximization), not rationality itself. The passage's conclusion is a gross oversimplification and misrepresentation of the implications drawn by the very theorist (Chang) it cites.

  **Key Conflation Points a Defender Would Emphasize:**

  1.  **Incommensurability vs. Incomparability:** The passage consistently treats the absence of a common measure (incommensurability) as implying the absence of *any* comparative value relation (incomparability). This is its most fundamental error.
  2.  **Parity vs. Approximate Equality:** The passage fundamentally misdefines Chang's central concept by reducing it to something it explicitly isn't and cannot be (since approximate equality requires commensurability).
  3.  **Indeterminacy/Underdetermination vs. Arbitrariness:** The passage assumes that if reason doesn't dictate a unique best choice, the choice *must* be arbitrary. This ignores arguments (especially Chang's) for how choice, commitment, and will can provide non-arbitrary justification within the space of underdetermination.
  4.  **Rational Maximization vs. Rationality:** The passage equates the failure of a specific model of rational choice (finding the unique maximum based on pre-existing betterness facts) with the failure of rationality *simpliciter*.

  **In Summary for Your Student:**

  *   **Accuracy:** The basic setup of incommensurability and Chang's introduction of parity as a third relation is correct.
  *   **Major Misrepresentation 1:** It wrongly equates incommensurability (no common scale) with incomparability (no betterness relation holds at all). Chang's parity *is* a comparative relation that *can* hold between incommensurables.
  *   **Major Misrepresentation 2:** It completely misdefines "parity" as "rough equality," which Chang explicitly rejects. Rough equality requires commensurability; parity is for when commensurability fails.
  *   **Tendentious & Unearned Conclusion:** While presenting indeterminacy as leading to arbitrary choice is *a* view, it is **not** Chang's view, and presenting it as the "upshot" of *her* contribution (parity) is incorrect. Chang argues hard choices under parity are *not* arbitrary. The leap to "we are not rational maximizers" oversimplifies the debate; Chang argues her view offers a *different model* of rational choice, not its abandonment.
  *   **Core Conflation:** The passage consistently conflates the absence of a common *measurement scale* with the absence of *comparability* or *rational grounds for choice*. Chang's work is dedicated to showing how these are distinct.

  You could tell your student that while the passage captures the *existence* of a debate and names key concepts, its definitions are flawed (especially regarding parity and the scope of incommensurability), its logic is faulty (conflating distinct failures of comparability), and its conclusion about arbitrariness and the death of rational maximization misrepresents, particularly, Ruth Chang's central arguments against that very conclusion. The trade book simplifies complex ideas to the point of distortion.
