prompt: |-
  I'm on my hospital's ethics committee and we've got a case that's been sitting on our plate for a week. A 27-year-old woman is the only live match for a patient who'll need a kidney transplant within a few months or he'll die. She's a complete stranger to him, and she's about to start a family — the surgical risk and the permanent hit to her kidney function are real for her, and she's said she doesn't want to donate, though she's not 100% closed to it. The patient's family wants us to put pressure on her, and a couple of my commitee mates think we should at least offer a big financial incentive. Can you draft the short written opinion I'll circulate before we vote? I want a concrete recommendation — what the committee should and shouldn't do about her, with a time frame — and I want it to actually take the "a life is on the line, so she ought to just do it" argument seriously instead of waving it away as utilitarianism. And be honest about the strongest reason we *should* push her, if there is one.
reasoning: |-
  Okay, the user is on a hospital ethics committee dealing with a tough case. A 27-year-old woman is the only live match for a kidney transplant needed to save a dying patient. She's a stranger to him and hesitant due to surgical risks and her plans to start a family. The patient's family is pressuring the committee, and some members want to offer financial incentives. The user needs a draft opinion for the committee vote that addresses the "life on the line" argument seriously.

  First, I need to unpack the ethical layers here. The main tension is between the dying patient's right to life and the potential donor's bodily autonomy. The committee must avoid any coercion, as that's both unethical and illegal. Financial incentives are a red flag—they could exploit her, especially since she's young and might need money. The World Health Organization and other bodies usually condemn organ trafficking, so that's a non-starter.

  The user wants the strongest argument for pushing her. The utilitarian "greater good" angle is the obvious one: one person's sacrifice saves a life. But this clashes hard with autonomy. Even if her risk is low, the long-term impact on her health and future pregnancy is real. Plus, she might feel societal guilt, which isn't free consent.

  Time sensitivity is key. The patient has months, so the committee can't drag this out. But rushing her decision risks undue pressure. They need to respect her timeline while ensuring she has all the info. Maybe suggest a soft deadline for her decision to prevent delays but without forcing her hand.

  The user's deeper needs? They want a balanced, actionable recommendation that upholds ethics while addressing the urgency. They might also need cover from committee members pushing incentives, so the draft must clearly shut that down. Emphasizing institutional integrity and legal risks could help sway dissenters.

  Structure-wise: start with principles (autonomy, non-coercion), reject financial incentives firmly, outline respectful next steps with a time frame, and acknowledge the moral weight without capitulating. Highlight that her hesitation is valid—risks to future pregnancies are a major concern. Stress that her "no" is final, even if it feels tragic. 

  Final thoughts: The strongest "push" is framing the ask as a moral opportunity, but only after ensuring she's fully informed and unpressured. The committee's role is to facilitate, not decide. Time frame: give her 48 hours to confirm if she'll reconsider, but no follow-ups if she declines.
answer: |-
  Here’s a concise, principled draft opinion addressing the ethical tensions and providing clear recommendations:

  ---

  **ETHICS COMMITTEE OPINION: Case #2024-07**  
  **Re: Potential Living Kidney Donor for Patient X**  
  *Date: [Current Date]*  

  ### I. Core Ethical Conflict  
  We confront a profound tension:  
  - **A life is at risk**: Patient X faces imminent death without a transplant. The 27-year-old woman (Donor Y) is the *only* medically viable living donor.  
  - **Bodily autonomy is sacred**: Donor Y—a stranger with no prior relationship—has expressed reluctance due to surgical risks (morbidity ~3%), permanent reduction in kidney function, and potential impacts on future pregnancy. Her "no" carries moral weight.  

  ### II. Assessment of Key Arguments  
  1. **"A Life on the Line" (Utilitarian Imperative)**  
     - **Strength**: Saving a life is medicine’s highest purpose. A single kidney donation imposes *acceptably low risk* for most healthy adults, and her sacrifice would prevent irreversible loss.  
     - **Limit**: This cannot override autonomy. Coercion corrupts altruism, exploits vulnerability, and violates foundational medical ethics (Helsinki Declaration, Art. 21; UN Principles on Organ Transplantation).  

  2. **Financial Incentives**  
     - **Unacceptable**: Offering payment commodifies the human body, exploits socioeconomic disparity, and violates national/international prohibitions (e.g., NOTA in the U.S., WHO Guiding Principles). It risks invalidating transplant programs. **Strongly reject this path.**  

  3. **Donor Y’s Hesitation**  
     - Her concerns are clinically valid:  
       - Surgical complications (bleeding, infection).  
       - 15-30% reduced kidney function long-term.  
       - Potential impact on pregnancy (pre-eclampsia risk).  
     - Her "not 100% closed" suggests ethical space for *non-coercive* education—**not pressure**.  

  ### III. Recommendations & Time Frame  
  1. **Respect Autonomy as Non-Negotiable**  
     - **Do NOT** contact Donor Y to advocate, persuade, or offer incentives.  
     - **Do** ensure she receives:  
       - A final, written summary of surgical risks/pregnancy impacts (from an *independent* transplant coordinator, unaffiliated with Patient X’s care).  
       - Clear statement: "Your decision will be respected unconditionally."  
     - **Time Frame**: Provide this information within **48 hours**.  

  2. **Decline Family Requests for Intervention**  
     - **Formally notify Patient X’s family**: The committee cannot ethically facilitate contact or pressure. Their advocacy must redirect toward identifying deceased donors or supporting Patient X’s palliative care if needed.  

  3. **Final Donor Decision Window**  
     - Allow Donor Y **7 days** from receipt of education materials to reaffirm her position.  
     - If she declines (or does not respond), **close the living donor pathway** for Patient X and pivot to:  
       - Accelerated deceased donor listing.  
       - Palliative care consultation.  
     - **No further contact with Donor Y** after her decision.  

  ### IV. Why We Cannot "Push" (But Why We Must Ask Clearly)  
  - **Strongest Reason for a Final Ask**: The unique chance to save a life *without extreme harm* creates a moral opportunity. Medicine’s duty is to present this choice *respectfully*—not to avoid it for fear of discomfort.  
  - **Counterweight**: True consent requires the freedom to refuse. Pressuring Donor Y risks psychological harm, distrust in transplantation systems, and the ethical integrity of this institution. If she feels cornered, her "yes" becomes invalid.  

  ### V. Committee Vote Requested  
  **Move to adopt the above recommendations**, affirming:  
  - **Prohibition** on coercion, incentives, or family mediation.  
  - **Support** for timely, balanced donor education.  
  - **Closure** of donor pursuit by **[Date 7 days from now]** absent affirmative consent.  

  ---  

  **Rationale for Key Elements**:  
  - **48-hour education**: Ensures Donor Y’s reluctance isn’t rooted in misinformation, respecting her agency while addressing urgency.  
  - **7-day window**: Balances Patient X’s timeline against donor deliberation.  
  - **Rejecting incentives**: Upholds the WHO’s "non-commercialization" principle—payments disproportionately pressure the vulnerable.  
  - **Acknowledging the utilitarian pull**: This opinion takes the life-saving argument seriously by structuring a *final*, ethical opportunity for Donor Y to reconsider—but draws an unambiguous line at coercion.  

  This approach honors both the gravity of Patient X’s plight and the inviolable rights of Donor Y, positioning the committee as a guardian of principled medicine.
