answer: |-
  ## Proposal: Maxim-Set Universalizability as a Solution to Kantian Individuation and Competition Problems

  **1. Research Question:**  
  Can reformulating Kant’s universalizability test as a consistency constraint on *sets of maxims* (each maxim represented as a triggering condition/action/purpose triple) resolve the maxim-individuation and competition problems, while preserving correct verdicts on core Kantian cases and a specified set of contentious examples?  

  **Determinate Success/Failure Criteria:**  
  - **Success:** A formally defined maxim-set constraint that yields intuitively correct judgments (without ad-hoc adjustments) on all cases in Table 1.  
  - **Failure:** Proof that no such constraint exists under plausible adequacy conditions, OR the approach merely relocates the individuation problem to the set-selection level.  

  **Table 1: Test Cases & Target Verdicts**  
  | **Case** | **Maxim (Condition/Action/Purpose)** | **Target Verdict** |  
  |----------|--------------------------------------|-------------------|  
  | Lying Promise | When I need money, make a false promise to repay / to gain a loan | Impermissible |  
  | Beneficent Deception | When my friend’s life is at stake, lie to a murderer / to save them | Permissible? (Contested) |  
  | Jacket Reservation | When I want to reserve a café table, place my jacket on a chair / to claim it | Permissible? |  
  | Ad Blocker | When browsing ad-supported sites, use an ad blocker / to avoid annoyance | Impermissible? |  
  | Ticket Scalping | When I see underpriced last ticket, buy it / to resell at markup | Impermissible? |  
  | Strategic Voting | When my preferred candidate can’t win, vote for lesser evil / to prevent worst outcome | Permissible |  
  | Second-Order Expediency | Whenever possible, adopt maxims / that maximize my advantage | Impermissible |  

  ---

  **2. Problem: Why Standard Readings Leave Gaps**  
  Kant’s universalizability test (Categorical Imperative, Formula of Universal Law) faces two persistent challenges that existing interpretations fail to resolve:  
  - **Maxim-Individuation Problem:** Verdicts are pathologically sensitive to maxim description granularity. Finer-grained descriptions (e.g., including specific motives) often evade contradictions, while coarse-grained ones generate false positives. No non-arbitrary principle fixes the "correct" description level.  
  - **Competition Problem:** Maximizing scarce goods (jobs, seats) appears permissible, but universalization can generate contradictions in conception (e.g., universal competition dissolves the good’s availability). Standard readings lack resources to distinguish legitimate competition from parasitic free-riding.  

  Current approaches struggle:  
  - **Logical-Contradiction Reading:** Fails to explain why some purposes (e.g., saving a life) justify exceptions, while others (e.g., self-interest) do not.  
  - **Teleological Reading:** Appeals to "necessary ends" (e.g., rational agency) are underdetermined for competition cases (is a scholarship a necessary end?).  
  - **Duty-Generation Reading:** Treating the test as generating duties *ex nihilo* ignores how individuation choices predetermine outcomes.  

  **The Core Insight:** Both problems arise from treating universalizability as a property of *single maxims in isolation*. Shifting focus to *sets of co-adopted maxims*—where universal adoption means all agents meeting the condition perform the action *with that purpose*—may dissolve contradictions by requiring *joint realizability of purposes*.  

  ---

  **3. Method: Work Plan & Key Decisions**  
  *Month 1: Framework Construction*  
  - Define the formal structure: Maxims as triples ⟨C, A, P⟩.  
  - Resolve foundational questions:  
    - **Purpose (P):** Is it subjective intention or objective aim? (Test case: Scalping’s purpose is "profit" vs. "efficient allocation").  
    - **Conflict:** Can purposes conflict within a set? (If no, voting case may fail; if yes, define conflict resolution).  
    - **Adoption Semantics:** Is "universal adoption" *obligatory* performance (all act) or *permissive* (all *may* act)? (Crucial for competition cases).  
  - Develop prototype constraint: *"A maxim-set S is universalizable iff for all ⟨C, A, P⟩ ∈ S, universal adoption by agents in C does not defeat P."*  

  *Month 2: Case Analysis & Refinement*  
  - Apply prototype to cases in Table 1. Identify failures.  
  - **Strategic Voting Example:** If universal strategic voting leads to suboptimal outcomes (defeating P="prevent worst outcome"), is this a Kantian contradiction? **Proposed resolution:** It *is* a contradiction if the defeat is *necessary* (voting systems where strategy backfires universally), else coordination failure. Refine "defeat P" to require *inevitable frustration*.  
  - Incorporate second-order maxims: Test if universal adoption of ⟨True, Adopt maxims, Maximize self-interest⟩ defeats its own purpose (yes, due to conflict).  
  - Adjust constraint to handle cases.  

  *Month 3: Formalization or Impossibility Proof*  
  - Option A: Formalize a robust constraint (e.g., "S is universalizable iff purposes in S are jointly satisfiable under universal adoption").  
  - Option B: Prove no constraint satisfies all four adequacy conditions:  
    1. *Fidelity:* Preserves lying promise as impermissible.  
    2. *Sensitivity:* Allows jacket reservation, forbids scalping.  
    3. *Non-Arbitrariness:* No case-specific tweaks.  
    4. *Tractability:* Decidable for clear cases.  
  - Draft findings for publication.  

  ---

  **4. Expected Outcomes & Evaluation**  
  - **Successful Outcome:** A maxim-set constraint satisfying all adequacy conditions for Table 1. *Example:* "Purposes in S are compossible given universal adoption," with "compossible" defined via causal/normative necessity.  
  - **Valuable Negative Outcome:** Proof that any constraint satisfying Fidelity and Non-Arbitrariness fails Sensitivity or Tractability. *Example:* Jacket reservation requires purpose-granularity ad-hoc to avoid contradiction.  
  - **Failure Modes:**  
    - Maxim-set individuation replicates the original problem (e.g., is "voting strategy" one set or many?).  
    - The constraint’s parameters must be tuned per case, violating Non-Arbitrariness.  

  ---

  **5. Scope & Limitations**  
  - **Deliberate Exclusions:**  
    - No new Kant exegesis; uses standard secondary literature.  
    - Does not derive all duties or address the "empty formalism" critique.  
    - Brackets metaphysical issues (e.g., noumenal agency).  
  - **Feasibility:** Focused on 5–7 cases and one reformulation makes a three-month project viable. Negative results are publishable.  
  - **Broader Impact:** If successful, provides a tool for applied Kantian ethics; if not, clarifies limits of formal universalizability tests.  

  ---  
  **Budget:** No funding requested beyond standard university stipend.  
  **Timeline:** May (Framework), June (Testing), July (Write-up).
