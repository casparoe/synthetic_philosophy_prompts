prompt: |-
  I'm on the participant-protection subcommitee of a large state retirement system's defined-contribution plan — about 400k members who pick their own allocations — and Thursday we vote on a vendor tool. I've been asked to circulate a short written opinion beforehand and I'd rather it be mine in substance than a press release, so: can you draft it for me? I'll sign my name to the reasoning, which means I need it to actually take a position, not split the difference down the middle.

  The setup. The vendor runs a "risk-tolerance questionnaire" at onboarding. Two of the items have this shape, with the amounts scaled to retirement money:

  Item 1 — take $40,000 for certain, or a ticket that pays $200,000 with probability 10%, $40,000 with probability 89%, and nothing with probability 1%.

  Item 2 — take a ticket that pays $40,000 with probability 11% and nothing otherwise, or a ticket that pays $200,000 with probability 10% and nothing otherwise.

  If a member takes the certain $40,000 on item 1 and the 10% shot on item 2, the tool flags them as "incoherent" (their word) and, instead of recording the member's election, substitutes a reccommended moderate-growth allocation behind a screen saying a specialist reviewed their answers.

  Facts I have, all from the vendor's own pilot, so treat them as self-serving but it's all we've got: 31% of members who completed the questionnaire were flagged. Of the flagged members re-surveyed two weeks later, 88% gave the same answers again. Flagged members whose election was overridden were, over the next year, less likely to log in, less likely to change their contribution rate, and more likely to move their whole balance out of the plan when they switched jobs.

  The vendor's pitch as I understand it: the two items differ only in a common consequence, so a member who reverses between them has no single consistent answer to "what is your certainty worth," and therefore there is no coherent preference sitting there to be respected. They add that you can walk such a person through a sequence of trades that leaves them worse off holding exactly what they started with, which is why they say this is a defect rather than a lifestyle. They're careful to insist they're not claiming expected utility is the true theory of good decisions — only that it works as a coherence test, and that a plan shouldn't act on preferences that fail it.

  Our two dissenting members say: the reversal is stable and predictable, and 88% is about as stable as anything in survey data ever is; the sequence-of-trades argument assumes someone keeps standing there offering the trades, and a plan that simply never runs the sequence leaves members un-drained; and the moment we let an administrator decide which preference orderings count as real, the axioms have stopped being a test and become a licensing regime. They'd rather print a plain-language warning and let the member re-affirm.

  What I need in the memo:

  - a bottom line up front — adopt, reject, or adopt with specific conditions, and if it's conditions, make them ones someone could actually check compliance against rather than aspirational language
  - the reasoning, engaging the vendor's technical point head-on: I want the common-consequence structure handled properly, and I want the sequence-of-trades argument either defeated or conceded, not stepped around
  - the strongest thing the losing side has going for it, stated as forcefully as they'd state it themselves, and then dealt with rather than noted
  - a short section on what general standard this vote commits us to for the next vendor tool, since we'll get three more this year
  - about two pages, and no references or bibliography, nobody on this committee reads footnotes

  One more thing. My co-chair thinks the whole dispute is fake — that it's really just a fight over who gets to design the default, and that both sides would swap seats instantly if the tool defaulted people into the aggressive allocation instead of the moderate one. I don't think he's right, but I can't wave him off in a single line either, so work in something that takes that seriously.
reasoning: |-
  Okay, the user is part of a retirement plan committee and needs a memo to evaluate a vendor tool that flags "incoherent" members based on two questionnaire items. The key points are the vendor's argument about preference coherence, the dissenting views, and the need for a clear recommendation. 

  First, I need to unpack the technical aspects. The vendor uses the common-consequence effect to argue that reversing preferences between the two items shows inconsistency. Their point about the money pump is central—if someone can be exploited through a series of trades, that indicates irrationality. But the dissenters counter that stability (88% repeat responses) matters more than theoretical coherence. They also argue that the plan won't actually run the money pump sequence, so the risk is hypothetical. 

  The user wants the memo to engage deeply with these arguments. The vendor's position must be addressed without hand-waving. The money pump issue needs either refutation or concession. The stability point is strong—88% is high for survey data—so dismissing it requires showing why coherence trumps stability in this context. 

  The co-chair's skepticism about hidden motives (default allocation bias) is another layer. The vendor claims neutrality, but the tool defaults to moderate growth. The memo should acknowledge that perception but demonstrate why the coherence argument holds regardless of the default. 

  For the recommendation, rejecting the tool seems right. Overriding 31% of members based on two questions is overreach. The dissenting alternative—plain language warning and reaffirmation—is more respectful of autonomy. The conditions for any future tools should focus on minimal intervention and transparency. 

  General standards for future vendors need to be clear: no overrides without consent, transparency in methodology, and real-world validation beyond pilot data. The vendor's pilot showed negative outcomes (reduced engagement), which undermines their effectiveness claim. 

  The memo structure should start with a clear reject recommendation, then systematically address each argument. The common-consequence point must be explained clearly but technically. Concede the money pump validity but argue it's irrelevant in practice. Highlight the 88% stability as evidence of genuine preference, not error. 

  Lastly, handle the co-chair's concern by agreeing that defaults invite suspicion but insisting the core issue is member agency—regardless of which allocation gets favored. The vendor's method is flawed even if their default were aggressive.
answer: |-
  ## Memorandum: Recommendation on Risk-Tolerance Tool (Vendor X)

  **To:** Participant-Protection Subcommittee  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation to REJECT Vendor X's Risk-Tolerance Questionnaire Tool  

  **Bottom Line:** I recommend we **REJECT** Vendor X's tool for flagging and overriding member allocations based on "incoherence" detected by their paired questions. The theoretical justification, while mathematically sound in isolation, fails to justify the tool's intervention in the practical context of our plan. If we were to reconsider, adoption would require **unattainable preconditions**: 1) Proof that the flagged "incoherence" *causes actual financial harm* exceeding the harm of overrides, validated long-term against a control group; and 2) A member-facing process explicitly detailing *before answering* that specific combinations trigger overrides, followed by mandatory real-time member confirmation *after* any override is applied. Absent this proof and process, the tool is unacceptable.  

  ### I. Engaging the Vendor's Core Argument & Its Limits
  The vendor correctly identifies a potential inconsistency using the common-consequence effect. Mathematically, Item 1 and Item 2 are structured such that a preference reversal (Certain $40k in Item 1, 10%/$200k in Item 2) violates the Independence Axiom of Expected Utility (EU) theory. They are also correct that, *in a frictionless theoretical market*, an individual exhibiting this preference pattern could be "money pumped" – induced through a series of trades to pay for a series of exchanges that ultimately leave them back where they started but poorer. **I concede the theoretical validity of this coherence test and the money-pump argument.**

  **However, this theoretical validity does NOT justify the tool's intervention:**  
  1.  **Context Matters Radically:** Our members are not in a theoretical market where arbitrageurs exploit preference inconsistencies. They are making one-time allocation choices within a retirement plan. **The "sequence of trades" required for the money pump will never occur.** Preventing exploitation (the pump's harm) requires no action by the plan. Blocking the member's expressed choice *is* the harm here – overriding autonomy based on a hypothetical vulnerability that won't materialize.  
  2.  **EU is a Normative Tool, Not a Mandate:** While EU provides a powerful framework for *analyzing* coherence, it is not the sole arbiter of rational choice, especially for significant, infrequent decisions like retirement investing. Other models (e.g., Prospect Theory) explicitly predict and explain the common-consequence effect as a *stable* human behavior under risk, not an "error." The vendor admits EU isn't the "true theory," yet uses it as a cudgel to invalidate revealed preferences.  
  3.  **The Intervention is Disproportionate:** Flagging 31% of members as requiring paternalistic override based on *two questions* is staggering. It suggests the test is identifying a common, stable behavioral pattern (confirmed by the 88% re-test stability), not random noise or misunderstanding. Overriding nearly a third of participants based on this narrow test is an extreme response to a theoretical inconsistency that poses no *imminent* financial threat within the plan's structure.

  ### II. The Strongest Dissent: Stated Forcefully and Addressed
  **The Dissent's Core Argument (Forcefully Stated):** "This reversal is a *predictable and stable* feature of human decision-making under risk, not a fleeting error. An 88% re-test rate is exceptionally high for any survey measure, demonstrating its reliability as an expression of genuine preference. The money-pump argument is a theoretical scarecrow irrelevant to the static, non-manipulative environment of our retirement plan. By overriding these stable choices, the administrator abandons its role as a neutral facilitator and becomes an arbiter of which preferences are 'licensed' as rational, substituting its judgment (cloaked in axioms) for the member's own consistent will. This violates participant autonomy and trust. A simple, salient warning about the potential inconsistency, coupled with an option to reaffirm or revise, is sufficient and respectful."

  **Addressing the Dissent:**  
  The dissent is compelling, particularly regarding the **stability and predictability** of the response and the **irrelevance of the money pump** in our plan's context. Their proposed solution (warning + reaffirmation) is indeed more respectful of autonomy and aligns with the plan's role. **Where the vendor sees a defect requiring correction, the dissent (and I) see a legitimate, stable preference pattern.** The vendor's tool doesn't merely "test" for coherence; it *uses the test's result* to actively suppress the member's expressed choice. This moves far beyond testing into the territory of preference licensing, as the dissent argues. The stability data (88%) is the dissent's strongest point, fundamentally undermining the vendor's claim that the inconsistency represents a momentary lapse requiring paternalistic rescue.

  ### III. Concerns Regarding Hidden Agendas
  My co-chair raises a valid concern about potential ulterior motives surrounding the *default allocation*. While Vendor X insists their tool is theory-driven, the outcome (defaulting to moderate growth) inevitably raises questions. **I agree that skepticism is warranted.** However, rejecting this tool is *not* contingent on the chosen default. **The core objection is the override mechanism itself, based on this specific test.** If the tool defaulted flagged users to an *aggressive* allocation, the violation of autonomy and the flawed justification for the override would be equally problematic, just favoring a different bias. The principle is member agency. The vendor's reliance on a narrow theoretical construct to justify mass overrides is the fundamental flaw, irrespective of which allocation benefits.

  ### IV. Standards for Future Vendor Tools
  This vote sets critical precedent. We must establish a clear standard:  
  1.  **Minimal Intervention Principle:** Tools should prioritize *informing* and *empowering* member choice, not overriding it. Automated overrides of member elections based on survey responses are presumptuous and should be considered only under extraordinary circumstances with overwhelming, validated evidence of *imminent, unavoidable harm*.  
  2.  **Transparency Mandate:** Any logic used to flag, question, or *suggest* changes to a member's choices must be fully transparent *to the member* **before they finalize their decision**. Black-box algorithms determining portfolio assignments are unacceptable.  
  3.  **Empirical Validation Burden:** Claims that a specific behavioral pattern (like this preference reversal) necessitates intervention require rigorous, long-term evidence demonstrating that:  
      *   The pattern *causes* significant financial harm *in the specific context of a retirement plan*.  
      *   The proposed intervention *effectively mitigates that harm* without causing greater harm (e.g., disengagement, loss of trust).  
      *   The pattern is unstable or clearly erroneous (contradicted by the vendor's own 88% stability data here).  
  4.  **Autonomy Safeguard:** If an override *must* occur (an extremely high bar), members must receive immediate, explicit notification of the override, the specific reason for it, the allocation applied, and a simple, one-click mechanism to revert to their original election without penalty.

  ### Recommendation Reiterated
  Vendor X's tool substitutes theoretical elegance for practical wisdom and participant respect. It overrides stable member preferences based on a hypothetical vulnerability irrelevant to our plan's operation, using a test that labels a large portion of our membership "incoherent." The dissent offers a principled, practical alternative: transparency and reaffirmation. The vendor's pilot data itself shows concerning outcomes (disengagement, leakage) from overrides. **We should reject this tool.** Our standard must be empowering informed choice, not enforcing a specific theory of rationality through automated paternalism. Let members own their decisions, inconsistencies and all, with clear information and safeguards, not overrides.
