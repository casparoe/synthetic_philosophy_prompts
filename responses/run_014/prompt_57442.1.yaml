  Success metrics: Clear propagation patterns = belief-like; isolated changes = dispositions. Failure modes matter—if lookup tables pass (unlikely at scale), the criterion needs refinement; if measurements fail, it's a practical not conceptual flaw. Scope must be humble: promise only a test framework + evidence for/against reusability in specific models, not grand theories.

  Tone check: American English, no padding. Wife-test pass: phrases like "smelling salts" and "weld[ed] to circumstances" stay—they're the user's voice. Consciousness is rightly excluded. No invented citations; they'll handle references.

