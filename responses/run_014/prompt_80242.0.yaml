prompt: |-
  Okay so I'm working through Parfit's teletransporter stuff for a project and I keep hitting the the same wall. You know the setup: a machine scans you in full detail, destroys the original, and builds a copy on Mars. The standard question is "is the copy you?" and Parfit's answer is basically that personal identity isn't what matters -- psychological continuity is. Fine, I get that part. But I want to go deeper.

  Act like a professional philosopher who works on personal identity and what-matters questions. Think carefully, and before you commit to anything, do a short brainstorming pass where you list the obvious candidates for what a theory has to do, then prune.

  Here's what I actually want: the full specification of what a theory of what-matters-in-survival has to deliver to count as adequate. Not a summary of Parfit's view -- I can read that. I want the desiderata. The requirements list. What cases must a theory get right? What distinctions must it respect? What results from psychology or neuroscience can't it contradict? And for each requirement, give me the case or consideration behind it -- why is this a requirement and not just a preference of one camp?

  And here's the part I really want you to think hard about. I keep coming back to two cases that I don't think the standard accounts handle well, and I want your desiderata to force a theory to deal with them:

  1. The lossy scan. The machine doesn't perfectly preserve the psychological state. The copy is 99.9% the same but remembers one childhood event with a slightly different detail, or is a touch more impatient than the original. Is there a threshold where "lossy" becomes "not you," or is it a matter of degree? And does it matter whether the person would notice the difference?

  2. The time lag. You're scanned today, the original is destroyed today, but the copy isn't built for ten years (the data sits in storage the whole time). Is there a gap in the person's existence? Does the ten-year gap affect what matters? And if the data is stored, is the person in some sense "in the data" during those ten years?

  Make sure your list of requirements is strong enough that a theory that fudges either of these cases gets knocked out.

  Also: which requirements are non-negotiable and which are just preferences of particular camps? And if some subset of the requirements is jointly unsatisfiable -- like, if you can't have all of them at once -- say so, that's the part I most want to see. And tell me wich single requirement knocks out the most popular theories (I'll guess it's the duplication case, but I want your reasoning, not just my guess).

  For context on what "adequate" means here: I'm building a decision framework for a hypothetical future where mind-uploading is commercially available, and I need to know what a person should care about when deciding whether to use it. So the theory needs to be good enough to inform that decision, not just a metaphysical curiosity.

  A table is fine for the main requirements list, but I want the reasoning behind each one in prose, not just bullet points.
reasoning: |-
  Okay, let me tackle this user's query step by step. They're working on Parfit's teletransporter thought experiment and need a rigorous framework for what matters in survival, especially for mind-uploading scenarios. 

  First, I need to identify their core request: a list of desiderata for theories of what-matters-in-survival, with emphasis on two tricky cases—lossy scans and time lags. They want this to inform a practical decision framework, so theoretical coherence must meet real-world applicability.

  The user mentions hitting a wall with Parfit. While they grasp his psychological continuity view, they're frustrated by edge cases. Their two scenarios test preservation fidelity and temporal continuity in ways standard theories might not handle. This suggests they seek a meta-theoretical toolkit to evaluate competing views, not just Parfit exegesis.

  Important nuances: They want desiderata that outright disqualify theories failing their cases. Also, they hint at possible incompatibilities between requirements—that's crucial. The context of building a mind-upload decision framework means desiderata must bridge philosophy and actionable ethics.

  Now, brainstorming the requirements. Start with non-negotiables:  
  - **Avoidance of brute discontinuities** (why sudden death from minor lossiness?)  
  - **Preservation of prudential concern** (why care about future selves?)  
  - **Consistency with empirical facts** (can't ignore how memory actually degrades)  
  - **Handling duplication** (standard but vital—Parfit's fission case breaks identity theories)  

  Then add their custom cases:  
  - **Lossy scan tolerance**: Must specify if degradation thresholds exist and if unnoticeable changes matter.  
  - **Time lag neutrality**: Should determine if storage latency breaks survival.  

  For each, I need to articulate why it's mandatory. For example, lossy scans challenge theories that can't distinguish between trivial and identity-destroying alterations. Time lags expose whether existence requires continuous implementation.  

  The joint-incompatibility warning is key. For instance:  
  - If a theory demands perfect duplication (strong identity) AND accepts duplication as survival (like Parfit), it fails fission cases.  
  - Lossy acceptance plus no-threshold views may conflict with our intuitive horror at gradual replacement.  

  I'll note which requirement is most lethal to popular theories. Duplication is the classic killer, but the user's time-lag case might be sneakier—it challenges both physicalists (data isn't a person) and psychological views (stored data isn't "conscious").  

  Finally, for their decision framework, I'll emphasize desiderata related to risk assessment (e.g., how much information loss is survivable?) and temporal discounting (does a 10-year delay alter concern?). The goal is a theory that doesn't just philosophize but guides real trade-offs.
answer: |-
  Below is a rigorously constructed framework of desiderata for a theory of "what matters in survival" tailored to your objectives, with explicit handling of your two key cases. I've structured it as a table for clarity, followed by detailed prose justifications, incompatibility analyses, and implications for your decision framework.

  ---

  ### **Desiderata for an Adequate Theory of What-Matters-in-Survival**
  | **Requirement** | **Why It's Non-Negotiable** | **Case/Consideration Driving It** | **Violation Consequence** |
  |-----------------|----------------------------|----------------------------------|--------------------------|
  | **1. Continuity of Prudential Concern** | Survival must ground self-interested care for future stages (e.g., saving for retirement). | *Teletransportation*: If the copy isn't "you," why prefer it over death? | Theory fails practical rationality. |
  | **2. Empirical Coherence** | Must align with neuroscience/psychology (e.g., memory reconsolidation, gradual cell replacement). | *The Theseus Case*: If neurons are replaced gradually, are you still you? | Contradicts known science; useless for real tech. |
  | **3. Duplication Handling** | Must resolve fission/fusion without paradox. | *Parfit's Fission*: Copy sent to Mars and Venus. Which one deserves your concern? | Theories relying on "unique identity" collapse. |
  | **4. Lossy Scan Tolerance** | Must specify acceptable degradation thresholds for survival. | *Your Lossy Scan*: Is a 0.1% memory error survivable? 10%? Who decides? | Fails to guide upload decisions under imperfect tech. |
  | **5. Time Lag Neutrality** | Must explain if temporal gaps disrupt survival. | *Your Time Lag*: If rebuilt after 10 years, is it a continuation or a new entity? | Undermines cryonics/data-backup viability. |
  | **6. First-Person Authority** | Must respect that the subject's perspective matters (but isn't absolute). | *False Memory Implants*: If you *feel* continuous but were altered, does it count? | Allows external override of autonomy (e.g., "we changed you, but it's fine"). |
  | **7. Non-Arbitrariness** | Cannot rely on vague boundaries (e.g., "enough" similarity). | *Gradualism*: If 100% copy is "you," is 99.9%? 90%? Where’s the line? | Fails to inform risk assessment for commercial use. |
  | **8. Causal Dependency** | Future stages must be causally linked to past stages. | *Replica Creation*: A spontaneously formed copy isn’t "you," even if identical. | Permits absurdities (e.g., Boltzmann duplicates). |

  ---

  ### **Detailed Reasoning & Case Integration**
  #### **Non-Negotiables vs. Camp Preferences**
  - **Non-Negotiables**: 1 (Prudential Concern), 2 (Empirical Coherence), 3 (Duplication Handling), 7 (Non-Arbitrariness).  
    *Why*: Without these, the theory is either irrational (1), unscientific (2), logically inconsistent (3), or useless for decision-making (7).  
  - **Camp Preferences**: 6 (First-Person Authority) is debated (e.g., eliminativists reject phenomenology), and 8 (Causal Dependency) is contested by Platonists.  

  #### **Handling Your Cases**
  - **Lossy Scan (Requirement 4)**  
    A theory must explain **why** degradation matters. Does it break psychological continuity (e.g., distorted core memories)? Does it reduce causal connection (e.g., corrupted data)?  
    - *Thresholds*: If unnoticeable changes (e.g., a pixel in visual memory) don’t break continuity, but altered emotional responses do, the theory must define "relevant" psychological features.  
    - *Knockout Test*: A theory claiming "any loss destroys survival" fails Requirement 2 (neurons decay naturally) and 7 (arbitrary). One claiming "all loss is fine" fails 1 (you wouldn’t risk a 50% fidelity scan).  

  - **Time Lag (Requirement 5)**  
    A theory must address:  
    - *Gap in Existence*: If the data is preserved, is consciousness suspended (like deep sleep) or extinguished?  
    - *Causal Status*: Is the stored data a *blueprint* (no survival) or a *causal bridge* (survival)?  
    - *Knockout Test*: A theory insisting "continuous implementation is necessary" fails if we accept anesthesia as survival. One claiming "data storage is existence" fails Requirement 8 (no causal link without activation).  

  #### **The Incompatibility Problem**
  - **Conflict Cluster**: Requirements 3 (Duplication), 4 (Lossy Tolerance), and 7 (Non-Arbitrariness) are **jointly unsatisfiable** under conventional frameworks.  
    - *Why*: Duplication forces a non-identity view (Requirement 3). But if survival is "degree-based" (Requirement 4), where’s the threshold for acceptable loss (Requirement 7)?  
    - *Example*: A 99.9% copy after fission might be "you enough," but a 90% copy might not. Yet no theory can non-arbitrarily define that threshold while handling duplication seamlessly.  

  #### **The Most Damaging Requirement**
  - **Requirement 3 (Duplication Handling)** is the **killer**.  
    - *Why*: It forces the rejection of "identity" as what matters.  
      - **Soul Theories**: Destroyed by duplication (one soul can’t split).  
      - **Biological Theories**: Destroyed (two bodies can’t be one organism).  
      - **Psychological Continuity (Weak)**: Survives duplication but struggles with Lossy Scans (Requirement 4).  
      - **Only Survivor**: Parfit-style Relation R (psychological connectedness) survives—but must then confront your cases.  

  ---

  ### **Implications for Your Decision Framework**
  1. **Lossy Scans**: A theory must output a **risk metric**, e.g.:  
     - Survival value = *f*(psychological fidelity, causal integrity, minimal degradation of core traits).  
     - Users could set personal thresholds (e.g., "I accept ≤0.1% memory distortion if emotions are intact").  

  2. **Time Lags**: A theory must clarify **temporal discounting**:  
     - If causal connection is unbroken (data is intact), a 10-year delay may not matter.  
     - But if consciousness requires implementation, storage = death.  
     - *Recommendation*: Treat latency as increasing risk of data corruption (empirical, not metaphysical).  

  3. **Commercial Application**:  
     - **Non-Arbitrariness (7)** and **Lossy Tolerance (4)** demand *quantifiable metrics* (e.g., neural signature matching scores).  
     - **Time Lag Neutrality (5)** requires *contractual clarity* (e.g., "activation within *x* years guarantees continuity").  

  ---

  ### **Conclusion: The Viable Path**
  A theory that satisfies all desiderata **except** strict Non-Arbitrariness (7) is likely the best fit. It would:  
  - Treat survival as **degree-based psychological/causal continuity** (addressing Lossy Scans).  
  - Accept stored data as a **dormant causal chain** (addressing Time Lags).  
  - Reject identity in favor of **Relation R+** (psychological continuity + causal dependence).  
  - Define **minimum thresholds** empirically (e.g., memory recall accuracy >99%, neural pattern match >98%).  

  This avoids the duplication trap, respects science, and provides actionable guidelines—while admitting that exact thresholds are pragmatic, not metaphysical. For your project, this means users could:  
  - Calculate personal "survival confidence scores" for a scan.  
  - Weigh latency risks against fidelity trade-offs.  
  - Reject theories demanding impossible precision.  

  This framework makes your two cases **central tests**, not edge notes. A theory that fails either is inadequate for real-world use.
