prompt: |-
  I've been following the longtermism and population-ethics threads for a while now, and a certain one-liner keeps coming up in arguments about whether we owe anything to future generations, usually wielded like a reductio: "what is bad must be bad for someone". I've heard it used in at least two opposite directions — by people who conclude that a policy choice which changes which future people exist cannot be wrong, since the people who end up existing are not made worse off than they otherwise would have been, and by people who insist that person-affecting constraints are the only coherent foundation for ethics. I already accept the standard setup — that small changes alter who is conceived, that the people who exist under the worse option are not the same people who would have existed under the better one, and that each is, say, moderately happy — so please skip re-explaining the paradox and go straight to the disambiguation. Could you lay out the distinct precise principles this one-liner could be expressing — for instance, whether it is a claim about the meaning of "harm" rather than a claim about what is wrong, whether the relevant comparison is to a counterfactual world or to an absolute threshold, whose counterfactual it is, and what happens to the comparison when the choice changes which people exist at all — and say for each reading whether it is a platitude, a substantive and defensible principle, or plainly false, whether the identity-changing cases actually refute it, and which reading actually supports the move of concluding that an identity-changing policy choice is not wrong merely because the people who exist under it are not worse off than they otherwise would have been.
reasoning: |-
  Okay, let me start by unpacking the user's question. They're deep into population ethics and longtermism, specifically the phrase "what is bad must be bad for someone." They've seen this one-liner used in opposite ways: one to argue that changing who exists isn't wrong since no one is worse off, and another to insist ethics must be person-affecting. The user already knows the non-identity problem setup, so they want a breakdown of the possible interpretations of this phrase.

  First, I need to dissect the one-liner into its core components. The user mentioned disambiguation—so I should identify different principles this phrase could represent. Let me list possible readings. One is the Harm Condition: something is bad only if it harms someone. But harm can mean different things. Is it counterfactual harm compared to a possible world? Or is it about falling below a baseline, like a threshold of well-being?

  Another angle is the Wrongness Condition: an action is wrong only if it harms someone. That's different from just defining "bad." Also, the scope of "someone"—does it include potential people who never exist? The user mentioned cases where population choices change who exists, so the counterfactual comparison is tricky.

  I recall Parfit's non-identity problem. If choosing a policy leads to different people existing, each with lives worth living, are they harmed? Counterfactually, if they wouldn't exist otherwise, you can't say they're worse off. So under a strict counterfactual harm reading, the policy isn't harming anyone, thus not bad. But that seems counterintuitive if the policy leads to worse overall outcomes.

  Then there's the threshold view. If a person's quality of life is below a certain level, that's bad for them, regardless of the alternative. But what's the threshold? If existence is better than non-existence, even a "moderately happy" life might be above the threshold. So in the non-identity case, the people aren't harmed under this view either. 

  The user wants to know which interpretation supports the conclusion that identity-changing choices aren't wrong. The counterfactual harm reading does that. But if we use the threshold view, it might not apply here since the lives are still worth living. 

  The user also asked about the defensibility of each principle. The counterfactual harm principle seems plausible at first but fails in non-identity cases, making it inadequate for population ethics. The threshold principle avoids that but has its own issues, like defining the threshold. 

  The Wrongness Condition might be too restrictive because it ignores impersonal harms, like biodiversity loss with no people affected. The user is likely looking for clarity on which principles hold up and which don't, especially in the context of future generations. 

  They might also be interested in how different ethical frameworks handle this. For example, total utilitarianism doesn't require harm to individuals; it aggregates well-being. So the one-liner conflicts with such views. 

  I need to ensure each interpretation is clearly laid out, assessed for plausibility, and linked to the non-identity problem. The user's deeper need might be understanding how to navigate these arguments in discussions about longtermism, possibly to advocate for certain policies or ethical stances. They might want to refute the one-liner or use it effectively, hence needing a precise breakdown of its meanings and weaknesses.
answer: |-
  The phrase "what is bad must be bad for someone" (WIBMBS) is indeed used ambiguously. It masks several distinct principles, each with different implications for identity-affecting choices (like Parfit's Non-Identity Problem). Here's a disambiguation across key dimensions:

  ### 1. **The Harm Condition (Counterfactual Comparative Reading)**
     - **Principle**: An outcome/event is "bad" *only if* it makes some *actual, existing* person **worse off** *than they would have been* in a relevant alternative scenario.  
     - **Counterfactual Baseline**: Comparison to a specific alternative world (usually the most salient alternative choice).  
     - **Identity Cases**: Directly refutes the wrongness of identity-affecting choices. If Policy A causes future people to have moderate lives (say, 50 utils), while Policy B causes *different* people to have better lives (80 utils), the people under A aren't *worse off* than they would have been (as they wouldn't exist under B). Thus, A isn't "bad for" anyone.  
     - **Status**:  
       - *Platitude?* Intuitive for many everyday harms (e.g., theft).  
       - *Defensible?* Only if combined with strong person-affecting constraints (e.g., Jan Narveson's "we are in favor of making people happy, but neutral about making happy people").  
       - *False?* Fails in non-identity cases, allowing harmful policies if victims don't exist in alternatives (e.g., depleting resources for future generations).  
     - **Supports the reductio? YES** – This is the reading used to conclude identity-changing choices cannot be wrong if no one is worse off.

  ### 2. **The Threshold Harm Condition (Absolute/Threshold Reading)**
     - **Principle**: An outcome/event is "bad" *only if* it causes some *actual, existing* person to be **below a threshold of well-being** (e.g., suffering, deprivation).  
     - **Baseline**: Absolute (e.g., below neutrality, or a "sufficientarian" threshold).  
     - **Identity Cases**: Doesn't resolve the paradox. If Policy A causes people to exist at 50 utils (above neutrality), it isn't "bad for" them. Policy B (80 utils) is better impersonally, but WIBMBS doesn't require choosing it.  
     - **Status**:  
       - *Platitude?* Less intuitive – we call outcomes "bad" even if no one suffers absolutely (e.g., a world where everyone is content but could be ecstatic).  
       - *Defensible?* Only for minimal deontic constraints (e.g., avoiding torture), not for full population ethics.  
       - *False?* Ignores lost opportunities for greater well-being.  
     - **Supports the reductio? WEAKLY** – It doesn't *demand* choosing B over A, but doesn't conclude A is *wrong*.

  ### 3. **The Wrongness Condition (Person-Affecting Restriction on Wrongness)**
     - **Principle**: An **action/choice** is morally wrong *only if* it makes *some actual, existing or future* person **worse off** (counterfactually or absolutely).  
     - **Scope**: Often expanded to include *future* persons who *will* exist.  
     - **Identity Cases**: Similar to (1) – if no one is worse off (counterfactually), the action isn't wrong. However, if "future persons" includes those *who will exist in the chosen outcome*, Policy A isn't wrong.  
     - **Status**:  
       - *Platitude?* Core to common-sense morality.  
       - *Defensible?* Central to "person-affecting views," but struggles with asymmetry (e.g., why creating a suffering person is wrong, but not creating a happy person is neutral).  
       - *False?* Cannot condemn creating miserable lives if no alternative person exists instead.  
     - **Supports the reductio? YES** – Directly implies identity-changing choices aren't wrong if no victim exists.

  ### 4. **The Metaphysical Constraint (Existence Requirement for Harm)**
     - **Principle**: "Harm" (or "bad for") requires a **subject who exists** and is harmed. Nonexistent people cannot be harmed.  
     - **Identity Cases**: The "better-off" people under Policy B *do not exist* under Policy A, so we cannot say Policy A "harms them." Policy A only affects actual people (who aren't harmed).  
     - **Status**:  
       - *Platitude?* Logically true – harm requires a subject.  
       - *Defensible?* Trivially true but ethically inert; doesn't address whether outcomes can be bad *impersonally*.  
       - *False?* Not false, but ethically incomplete.  
     - **Supports the reductio? INDIRECTLY** – Often used to block impersonal comparisons ("Policy A isn't bad for anyone, so how can it be bad?").

  ### 5. **The Semantic Claim (Definition of "Bad For")**
     - **Principle**: The term "bad" (in moral contexts) is **meaningless** unless it refers to a state that is "bad *for*" a sentient being.  
     - **Identity Cases**: If Policy A isn't "bad for" any person, calling it "bad" is semantically incoherent.  
     - **Status**:  
       - *Platitude?* Controversial – utilitarians accept "impersonal badness" (e.g., lower total utility).  
       - *Defensible?* Only within subjectivist metaethics.  
       - *False?* Rejected by consequentialists who accept impersonal value.  
     - **Supports the reductio? YES** – Dismisses impersonal critiques of Policy A as linguistically invalid.

  ---

  ### Key Conclusions:
  1. **The reductio move** ("identity-changing choices can't be wrong") relies **only on the counterfactual comparative reading (1) or the person-affecting wrongness condition (3)**. These require harm defined *relative to an alternative*.  
  2. **Identity-changing cases refute** these principles *as complete ethical frameworks* by showing they permit intuitively reprehensible choices (e.g., "Risky Policy" causing future disability).  
  3. **Defensible readings** exist but are limited:  
     - The *metaphysical constraint (4)* is true but trivial.  
     - The *threshold view (2)* avoids some problems but fails to capture opportunity costs.  
     - *No reading* that supports the reductio is both plausible *and* handles all population-ethical puzzles (e.g., the Repugnant Conclusion).  
  4. **The core conflict**: WIBMBS users prioritize *individual harm* over *impersonal value*. Critics argue that impersonal value (e.g., total welfare) must constrain person-affecting morality to avoid counterintuitive results.  

  For longtermism, rejecting the reductio-supporting readings (1 & 3) is often necessary to justify sacrifices for a *better* future population, even if no *particular* future person is harmed counterfactually.
