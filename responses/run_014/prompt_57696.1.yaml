answer: |-
  ### What we're actually disagreeing about
  You and your partner disagree on whether a mixed strategy (like a coin flip between $11 and $13) can be used to justify eliminating a pure strategy ($9) in a one-shot pricing game. You argue that showing $9 is worse *on average* against a hypothetical mixed strategy makes it rationally excludable, even if you won’t literally randomize. He contends that because you can’t (and won’t) implement the coin flip as a real action, the comparison is invalid—$9 might still be optimal if opponents pick certain prices, so it shouldn’t be ruled out.

  ### The case for him (~200 words)
  Your partner is right that the coin flip isn’t a feasible choice. In reality, you must commit to one price each Monday. Competitors base decisions on your *actual* choice, not a probabilistic meta-strategy they can’t observe. If you pick $11, they might undercut you to $9; if you pick $13, they might price at $11 to steal value-conscious customers. But if you *actually* choose $9, you might win if both competitors price higher (e.g., $13)—a scenario where $11/$13 could lose. The mixed strategy only "beats" $9 *on average* by assuming opponents randomize too, which they don’t. Your elimination relies on circular reasoning: You assume opponents model your randomization, but they can’t respond to what you don’t do. This makes the dominance argument artificial. By crossing out $9 prematurely, you distorted the game tree, leading to an unreliable outcome. Real-world choices require comparing pure strategies directly: $9 isn’t strictly dominated by $11 *or* $13 alone (e.g., $9 beats $13 if both rivals price high), so it deserves consideration.

  ### The case for me (~200 words)
  Your reasoning is strategically sound. Even if you won’t flip a coin, proving $9 is weakly dominated by *some* strategy (mixed or pure) shows it’s never uniquely optimal and is risky. If opponents price low ($9), $9 earns zero profit while $11/$13 might retain some customers; if they price high ($13), $9 wins less than $11 would. The coin flip is a mathematical tool to formalize this vulnerability: Averaging across scenarios, $9 underperforms. Crucially, competitors *know* you’re rational and might infer $9 is irrational for you, altering their own choices. Crossing it out revealed a cascade where rivals also eliminate weakly dominated options (e.g., one drops $13 if they expect you to avoid $9), converging to a plausible equilibrium—likely mutual $11 pricing. This outcome isn’t "impossible"; it’s a Nash equilibrium where no truck can profitably deviate. Dismissing mixed strategies ignores how rational players *anticipate* payoffs. Your model correctly identified that $9 invites destructive price wars, while $11 balances competitiveness and margin. The chain holds because the elimination of $9 forces opponents to recalculate based on your reduced options, making their subsequent exclusions logical.

  ### Does it change if we do this every week instead of once
  Yes, repetition changes everything. In a repeated game, you *can* effectively implement a mixed strategy by rotating prices weekly (e.g., $11 one week, $13 the next). Competitors observe this pattern and respond to the long-run frequencies, making probabilistic payoffs tangible. $9’s weakness becomes empirical: If you use it frequently, rivals punish you with low prices; if you avoid it, they might sustain higher prices. The equilibrium is more robust, and your original reasoning—including crossing out $9—gains legitimacy.

  ### What I should do Monday
  Price at $11. It’s the safest choice from your analysis: competitive against $9 trucks (unlike $13) and profitable against $13 trucks (unlike $9). Track competitors’ responses for 2–3 weeks. If they consistently price high ($13), test $13 yourself later. If they undercut, stay at $11. Avoid $9—it’s high-risk and your model shows it destabilizes the market. Use the mixed-strategy logic as a planning tool, but commit to pure actions weekly.
