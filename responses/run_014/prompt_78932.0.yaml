  Okay, let me tackle this user's query. They're a philosophy PhD student in ethics, sitting in on a philosophy of physics seminar. They've encountered this recurring argument structure and want to know if there's a general name for it, beyond the specific instances like spacetime relabeling or particle swaps. They also want to understand whether these cases are fundamentally the same or just superficially similar.

  First, I need to parse the core structure they described. It involves a theory with two models that are empirically indistinguishable but differ in their underlying "scaffolding." The user mentions three examples: spacetime relabeling in a region, swapping identical particles, and Leibniz's shift. They also bring up gauge fields, which they didn't fully grasp. Their main questions are about the unity of these cases, how they relate to concepts like underdetermination or coordinate systems, and whether the small-region aspect is significant.

  The user is clearly frustrated with getting pat answers like "that's just the [famous thing]" without deeper clarification. They need a nuanced analysis that distinguishes the examples and addresses their underlying concerns about ontology and epistemology. As an ethics student venturing into physics, they might feel out of their depth, so avoiding jargon while being precise is key.

  Breaking down each example: The spacetime case involves a diffeomorphism within a region, leaving the outside unchanged. This creates a "hole" argument, showing indeterminism if points are real. The particle swap in QM relates to permutation symmetry, where identical particles are indistinguishable, leading to questions about individuality. Leibniz's shift is a global symmetry, challenging the reality of space itself. Gauge symmetry involves redundant descriptions in field theories.

  Are these the same? Structurally, yes—all involve symmetries generating empirically identical scenarios with different ontologies. But differences exist: spacetime symmetry is continuous and local (in the hole argument), particle swap is discrete, and Leibniz's is global. The hole argument's regional focus highlights determinism issues, while particle indistinguishability affects counting in statistics. Gauge symmetry is similar but introduces mathematical redundancy.

  The user questions if this is underdetermination. Traditional underdetermination involves rival theories, but here it's one theory with multiple models, so it's different. Coordinate system changes are analogous but not identical; the key difference is that coordinate systems are representational tools, whereas symmetries question ontological commitments. The identical spheres scenario is metaphysical, about haecceities, while the user's cases are about physical theories.

  Regarding the small-region emphasis in the hole argument: it's crucial for exposing indeterminism. A global shift doesn't cause that problem, so the regional aspect does specific work. The user's friend claims all cases are the same, but while structurally similar, their implications vary—determinism in spacetime, particle individuality in QM, absolute space in Leibniz.

  The user also needs to grasp why gauge fields were mentioned. Gauge symmetries are internal; changing the potential doesn't affect observables, much like metric relabeling. But gauge transformations are mathematical redundancies, whereas spacetime symmetries might relate to physical geometry.

  In summary, the overarching concept is symmetry-generated underdetermination of ontology. Each example shares this core but has unique features. The user's deeper need is to teach this effectively, so clarifying the structure and distinctions is essential. They might also seek how to frame these debates in philosophy of physics, balancing technical details with conceptual clarity.
answer: |-
  You've hit upon one of the deepest and most persistent conceptual knots in the philosophy of physics! Your intuition that there's a common structure is spot-on, but your skepticism about whether all cases are *exactly* the same is also well-founded. Here's a breakdown:

  **The Core Structure: A Name and What It Is**

  1.  **The General Name:** The most encompassing term for the *structure* of the argument is **Symmetry-Generated Underdetermination of Representation** (or **Symmetry-Generated Indistinguishability**). Sometimes it's called **Redundant Structure** or **Gauge Freedom**, though "gauge" can be misleading outside specific contexts. The core philosophical question it raises is about **Ontological Commitment** or **Haecceitism**.

  2.  **What It Is:**
      *   **Symmetry:** You start with a physical theory that possesses a **symmetry transformation**. This is a mathematical operation you can perform on a *description* (a model, a state) of the system.
      *   **Empirical Equivalence:** Crucially, this symmetry transformation leaves *all physically measurable quantities* (observables) invariant. If two descriptions are related by such a symmetry, they are *empirically indistinguishable*. No possible experiment can tell them apart.
      *   **Non-Trivial Transformation:** However, the symmetry transformation *is not trivial* at the level of the *fundamental ontology* or *mathematical representation* used in the description. It shuffles the labels (points, particle identities, field values at points) in a way that isn't just a relabeling of the *same* underlying stuff in the *same* arrangement.
      *   **The Dilemma:** This creates a dilemma for interpreting the theory:
          *   **Option A (Real Scaffolding):** If the labels/points/individuals are real ("haecceities"), then the theory is *indeterministic* or contains *physical redundancy*. Given the state before the transformation, the theory cannot uniquely predict the state after, even though all observables *are* determined. This is the punch of the spacetime "hole argument" example.
          *   **Option B (No Real Scaffolding):** If the labels/points/individuals *aren't* fundamentally real ("anti-haecceitism"), then the two descriptions aren't descriptions of two distinct possible physical situations. They are just *different mathematical representations of the exact same physical reality*. The apparent difference is an artifact of the description, not the world.

  **What It Isn't (Addressing Your Concerns)**

  1.  **Not *Just* Underdetermination of Theory by Evidence (UTE):** You're correct. Standard UTE involves *different theories* making the *same empirical predictions*. Here, it's *one theory* generating *multiple empirically identical descriptions* that *prima facie* seem to describe different states of the underlying ontology. It's underdetermination *within* a single theory about its *own fundamental ontology*, generated by its symmetries.
  2.  **Not *Simply* Changing Coordinate Systems (Passive Diffeomorphism):** Your gut is right. This is the key distinction often glossed over.
      *   **Coordinate Change (Passive):** You *describe the same physical situation* using different labels (coordinates). "What is at point P?" changes answer *because you renamed P to Q*. The underlying physical fields and their relations haven't moved relative to each other or any physical markers. It's purely representational redundancy. Everyone agrees these are just different ways of saying the same thing.
      *   **Symmetry Transformation (Active):** You are describing a *different configuration* of the fundamental ontology. "What is at point P?" changes answer *because you dragged the physical fields to different points while keeping the point labels fixed*. The fields *have* moved relative to the fixed point labels. The question is whether this difference in configuration corresponds to a genuine physical difference, given that all measurable relations are identical. This forces the ontological dilemma.
  3.  **Not *Identical* to the Two Spheres Puzzle:** The two spheres puzzle (Black's spheres) is a specific, highly constrained *metaphysical* thought experiment about haecceitism and identity. Your examples are instances of *physical theories* exhibiting symmetries that *generate* structurally similar dilemmas *within those specific theoretical frameworks*. The spheres puzzle is a paradigm case *illustrating* the haecceitism question *in abstracto*; your physics examples are concrete manifestations *within* physics where the symmetry is built into the theory's formalism and has empirical consequences (like the statistics of identical particles).

  **Are Your Cases "All the Same Argument"? (Spoiler: Mostly Yes, with Nuance)**

  Yes, they share the *core structure* above. They are all instances where a symmetry of the theory generates empirically indistinguishable descriptions that differ non-trivially in their assignment of properties to the fundamental "bearers" (points, particle labels).

  However, there are important *differences in emphasis and consequence*:

  1.  **Spacetime (Hole Argument - Your "small region"):**
      *   **Symmetry:** Diffeomorphism Invariance (general covariance - a *local* spacetime symmetry).
      *   **Key Feature:** The *regional* nature is **CRUCIAL**. By changing the field configuration *only inside* the "hole" while keeping the past (and possibly boundary) fixed, it directly attacks *determinism*. If points are real, the theory cannot predict the state *inside* the hole based on data *outside*, even though the outside data fully determines all observable relations. This forces the choice: sacrifice determinism or deny the reality of spacetime points.
      *   **Ontological Target:** The reality of spacetime points/manifold events (spacetime substantivalism).

  2.  **Quantum Mechanics (Identical Particle Swap):**
      *   **Symmetry:** Permutation Symmetry (a discrete symmetry).
      *   **Key Feature:** This is *global*; swapping particles anywhere has the same effect. The core issue isn't determinism (though it connects), but **individuation and counting**. If particle labels are real, swapping creates a distinct state. But quantum statistics (Fermi-Dirac, Bose-Einstein) only work if the swapped state is *not* counted as distinct. The theory *demands* we treat permuted states as representing the *same* physical situation.
      *   **Ontological Target:** The individuality/haeccity of fundamental particles.

  3.  **Leibniz Shift (Global Spacetime Shift):**
      *   **Symmetry:** Global Spacetime Translation/Rotation (or Galilean Boost).
      *   **Key Feature:** This is *global* and *homogeneous*. It doesn't threaten determinism in the same way as the hole argument. Its primary force is against the idea of **absolute space**. If moving everything uniformly doesn't change any relations, why posit absolute locations? It directly challenges the need for the "scaffolding" itself.
      *   **Ontological Target:** The reality of absolute space (a weaker form of substantivalism).

  4.  **Gauge Fields:**
      *   **Symmetry:** Gauge Symmetry (e.g., changing the electromagnetic vector potential A_μ -> A_μ + ∂_μΛ).
      *   **Key Feature:** This is a *local internal* symmetry. The vector potential A_μ is *not* directly observable; only quantities derived from it (like the electric and magnetic fields E and B) are. Different A_μ configurations related by a gauge transformation describe the *same* physical electromagnetic field. The redundancy is built into the formalism. The ontological question is: is the gauge potential itself physically real, or just a useful mathematical tool? Most physicists adopt Option B: the gauge potential itself isn't fundamental; only the gauge-invariant quantities (like E, B, or the field strength tensor F_μν) are. This is the clearest example of "redundant structure."

  **Where the Edges Are & The Small-Region Question**

  *   **The Core Phenomenon:** The core phenomenon is present whenever a theory has a symmetry that acts non-trivially on its fundamental representational elements but trivially on its observables.
  *   **The Small-Region (Hole Argument) Specificity:** The *regional* aspect in the hole argument **absolutely does specific work** that the global examples *do not*. It generates a *local indeterminism* that is deeply troubling if you believe spacetime points are real individuals. Leibniz's global shift doesn't create this problem: the entire future state is uniformly shifted, determinism isn't obviously violated. The hole argument exploits the *locality* of general covariance to create a localized failure of determinism. This is why it's such a powerful argument against a naive substantivalism. The other examples raise issues about individuality or the reality of absolute space, but not localized indeterminism.
  *   **Edges:** When is it *not* this phenomenon?
      *   **Truly Passive Transformations:** If it's unambiguously *just* a relabeling of the same underlying state (e.g., changing Cartesian to polar coordinates for a fixed Newtonian particle trajectory), it's not the issue.
      *   **Accidental Indistinguishability:** If two distinct states *happen* to be empirically indistinguishable *despite* the theory not having a symmetry connecting them, that's standard UTE or epistemic limitation, not this structural symmetry-generated underdetermination.
      *   **Broken Symmetry:** If a symmetry is *broken* (like in the Higgs mechanism), the distinct configurations *are* empirically distinguishable, so the dilemma vanishes.

  **In Summary**

  *   **Name:** Symmetry-Generated Underdetermination of Representation / Redundant Structure / Gauge Freedom. The core question is ontological commitment vs. anti-haecceitism induced by symmetry.
  *   **It Is:** A structural feature of physical theories where symmetries generate empirically indistinguishable descriptions that differ non-trivially in their assignment of properties to fundamental ontology bearers (points, particle labels, field values).
  *   **It Isn't:** Standard UTE (different theories), simple coordinate changes (passive diffs), or purely abstract metaphysical puzzles like Black's spheres (though related).
  *   **Are Your Cases the Same?** Yes, in their core logical structure of symmetry → empirical equivalence → non-trivial ontological difference → dilemma. They are all canonical examples.
  *   **Differences:** They differ in the *type* of symmetry (local vs. global, continuous vs. discrete), the *specific ontological target* (spacetime points, particle individuality, absolute space, gauge potential reality), and the *primary consequence emphasized* (local indeterminism, counting in statistics, denial of absolute space, mathematical redundancy). The hole argument's regional focus is essential for its specific attack on determinism.
  *   **Small-Region Work:** Yes, the regional aspect is crucial *specifically* for generating the local indeterminism that makes the hole argument so potent against spacetime substantivalism. The other arguments don't rely on it.

  Your frustration with "that's just the [famous thing]" is understandable. While recognizing the famous examples is helpful, understanding the *unifying structure* and the *nuances* between them is essential for teaching the philosophy of physics effectively. You need to see both the forest *and* the distinct types of trees within it. Good luck with the seminar next year – grappling with this stuff is a hallmark of good philosophy of physics!
