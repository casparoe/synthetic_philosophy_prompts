answer: |-
  ### Question
  "Evaluate whether the Lange-Lerner model of market socialism (featuring public ownership, a Central Planning Board setting prices via trial-and-error tâtonnement, enterprise managers instructed to set price equal to marginal cost, and losses covered by a social dividend) successfully defeats the socialist calculation critique. In your analysis, **distinguish** the core arguments of Mises (impossibility of rational calculation without market prices for capital goods) and Hayek (dispersion/tacitness of knowledge and the role of entrepreneurial discovery). Assess which critique, if any, the model resolves and why. (30 marks; 2 hours)"

  ---

  ### Model Answer (700 words)

  The socialist calculation debate hinges on whether central planners can replicate the allocative efficiency of markets. While Oskar Lange’s model is often framed as a rebuttal to Ludwig von Mises, it primarily addresses Mises’ *impossibility thesis* while leaving Friedrich Hayek’s *knowledge problem* unresolved. This essay argues that the Lange-Lerner model theoretically satisfies Mises’ formal conditions for calculation but founders on Hayek’s epistemic critique due to its unworkable assumptions about knowledge aggregation and entrepreneurial discovery.

  **Mises’ Impossibility Claim and Lange’s Solution**  
  Mises contended that without private ownership of capital goods, there can be no genuine market prices reflecting relative scarcity. Prices, he argued, emerge from the competitive bidding of profit-driven owners. Absent this, planners lack the data needed for rational calculation: "Where there is no free market, there is no pricing mechanism; without a pricing mechanism, there is no economic calculation" (*Economic Calculation in the Socialist Commonwealth*, 1920). Lange’s model directly responds by simulating a market. The Central Planning Board (CPB) acts as an *auctioneer*, iteratively adjusting prices based on excess demand/supply signals (tâtonnement). Managers of publicly owned firms are instructed to: (1) produce where price equals marginal cost (*p = MC*), and (2) minimize costs. This *rules-based mimicry* of perfect competition generates Pareto-efficient equilibria in theory, answering Mises’ challenge that socialism cannot formally calculate opportunity costs. The model thus demonstrates that, *in principle*, planners can use shadow prices to solve allocation problems—refuting Mises’ *strict impossibility* claim.

  **The Load-Bearing Role of Subsidies and the Efficiency Mirage**  
  Crucially, Lange’s efficiency depends on the *p = MC* rule. Yet this rule renders natural monopolies (e.g., utilities, infrastructure) chronically unprofitable, as their falling marginal costs never cover average costs. Lange resolves this via a social dividend subsidizing losses. This mechanism is **not cosmetic** but structurally essential: it artificially separates allocative efficiency (achieved via *p = MC*) from financial viability. In a genuine market, unsustainable losses signal misallocation and drive exit or innovation; here, losses are perpetually socialized, decoupling price signals from scarcity. The model thus achieves *static* efficiency on paper but masks dynamic inefficiencies by neutralizing profit/loss as discovery tools. Students often overlook that the subsidy sustains the very efficiency they attribute to the price mechanism.

  **Hayek’s Knowledge Problem: The Fatal Flaw**  
  Hayek’s critique (*The Use of Knowledge in Society*, 1945) transcends Mises by focusing on *how* prices emerge. He argued that knowledge is: (1) **dispersed** (held locally by individuals), (2) **tacit** (non-articulable know-how), and (3) **discovered** through entrepreneurial rivalry in a competitive process. Lange’s model assumes the CPB can:  
  - Observe accurate marginal cost data across all firms.  
  - Interpret excess demand signals correctly.  
  - Adjust prices without inertia or political distortion.  
  This presupposes precisely the *centralized knowledge aggregation* Hayek deemed impossible. Marginal costs are not self-evident metrics but context-dependent estimates requiring local knowledge of opportunity costs (e.g., alternative resource uses, maintenance risks). In Hayek’s framework, entrepreneurs *discover* costs through experimentation and bear the consequences of error. Lange’s managers, by contrast, follow fixed rules without ownership stakes, eliminating the incentive for genuine discovery. The CPB’s tâtonnement relies on *existing* data, but Hayek stressed that markets generate *new* knowledge through rivalry—knowledge that cannot be "reported" to planners ex ante. The model thus fails at its epistemic foundations: it treats knowledge as static, centralized, and quantifiable, ignoring the dynamic, dispersed nature of economic learning.

  **Verdict: Mises Refuted, Hayek Vindicated**  
  The Lange model answers Mises by proving that *formal* calculation is theoretically possible using simulated prices. However, it fails against Hayek because its mechanisms (price adjustments, cost reporting) require an omniscient planner capable of accessing and interpreting decentralized knowledge—precisely what the competitive process exists to circumvent. Lange defeats the *logical possibility* critique but not the *practical feasibility* critique rooted in epistemology. The subsidy mechanism further underscores this: by socializing losses, it destroys the feedback loop driving entrepreneurial correction in markets. Thus, while Lange resolves Mises’ challenge on paper, Hayek’s knowledge problem remains fatal to real-world implementation.

  ---

  ### Marking Scheme (30 marks total)
  **A-Grade (25–30 marks)**  
  - **Clearly distinguishes Mises (impossibility of calculation without prices) from Hayek (knowledge dispersion/discovery)**.  
  - **Identifies *p = MC* as Pareto-efficient but highlights chronic losses for natural monopolies**.  
  - **Explains why the social dividend/subsidy is structurally necessary, not incidental**.  
  - **Analyzes Hayek’s knowledge problem: why dispersed/tacit knowledge cannot be aggregated by the CPB**.  
  - **Notes that trial-and-error requires perfect signal-reading capacity**.  
  - **Verdict: Model answers Mises (formal possibility) but not Hayek (practical feasibility)**.  
  - **Technical precision (e.g., defines tâtonnement, Pareto efficiency, natural monopoly)**.  

  **B-Grade (18–24 marks)**  
  - Distinguishes Mises/Hayek but with less clarity or depth.  
  - Recognizes *p = MC* efficiency but undersells the subsidy’s role.  
  - Engages Hayek’s knowledge critique superficially (e.g., "planners lack information" without explaining *why*).  
  - Verdict is present but weakly reasoned.  
  - Minor omissions or inaccuracies.  

  **Common Failures (Deduct 5–10 marks)**  
  - **Conflating Mises and Hayek** (e.g., treating "calculation critique" as monolithic).  
  - **Ignoring the subsidy mechanism** (e.g., assuming efficiency without noting artificial loss coverage).  
  - Overlooking natural monopoly implications.  
  - Misrepresenting tâtonnement (e.g., as instantaneous).  

  **Allocation of Marks:**  
  - Mises vs. Hayek distinction (8 marks)  
  - *p = MC* efficiency + subsidy necessity (8 marks)  
  - Hayekian knowledge problem application (8 marks)  
  - Verdict with reasoning (4 marks)  
  - Structure/clarity (2 marks)  

  This framework forces students to move beyond textbook summaries and grapple with the debate’s epistemic and institutional tensions—precisely as your seminar requires.
