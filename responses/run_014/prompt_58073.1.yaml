  is that a fair gloss? which bits would an actual substantivalist say are fine vs wince at, and does that Einstein point really follow? i'm especially confused because in my sim i can store either global coordinates or just pairwise distances and both seem to work, so i feel like i'm missing what the real disagreement is supposed to be.
