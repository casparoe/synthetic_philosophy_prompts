answer: |-
  Here is a specification for an adequate theory of moral progress, structured as requested. The requirements are derived from core conceptual distinctions, historical realities, empirical constraints, and the need to avoid common pitfalls.

  ### Requirements for an Adequate Theory of Moral Progress (TMP)

  | Requirement Category | Specific Requirement                                                                                                                               | Rationale                                                                                                                                                                                                                                |
  | :------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Historical Explanatory Power** | **1a.** Must explain paradigmatic cases of *apparent expansion* (e.g., abolition of chattel slavery in the 19th century).                          | A TMP must engage with the strongest intuitive evidence *for* progress. Failure here renders it irrelevant to the core phenomenon in question.                                                                                            |
  |                      | **1b.** Must explain at least one clear case of *apparent regression* (e.g., collapse of cosmopolitan norms and embrace of racial ideology in Nazi Germany). | A TMP must account for backsliding without simply defining it away as "not real progress." Progress is not inevitable or linear; theories ignoring regressions are naive.                                                                |
  |                      | **1c.** Must explain at least one case where *improvement occurred primarily due to non-moral drivers* (e.g., decline of chattel slavery in the British Empire driven partly by economic shifts & tech like sugar beets). | Moral change isn't always driven by moral epiphanies. A TMP must acknowledge the role of material factors (economics, tech, demography) without reducing morality entirely to them.                                                    |
  | **2. Conceptual Distinctions** | **2a.** Must rigorously distinguish *changes in sincere moral belief* (e.g., growing belief that slavery is wrong) from *changes in actual moral practice/outcomes* (e.g., emancipation). | Belief and outcome can diverge significantly (hypocrisy, failed reforms). A TMP must specify what *constitutes* progress: is it about beliefs, behaviors, institutions, outcomes, or some combination?                                   |
  |                      | **2b.** Must rigorously distinguish *genuine expansion of the circle of moral concern* (e.g., new intrinsic value ascribed to animals) from *better enforcement of pre-existing but latent moral commitments* (e.g., finally applying "all men are created equal" to Black people). | Is progress discovering latent truths or creating new values? A TMP must clarify its ontological stance on moral truths and the mechanism of "expansion," as these imply different historical explanations.                             |
  |                      | **2c.** Must distinguish *moral progress* from *mere social change* or *shifts in preference*. (e.g., fashion trends vs. granting voting rights). | Not all change is *moral* progress. A TMP must provide criteria for identifying *specifically moral* advancement, not just difference.                                                                                                 |
  | **3. Compatibility Constraints** | **3a.** Must be compatible with or account for findings on *evolved moral psychology* (e.g., in-group favoritism, kin altruism, tribalism, disgust sensitivity). | Human morality has biological roots biased towards small groups. A TMP must explain how wider circles emerge *despite* or *using* these instincts, or argue why biology is irrelevant. Ignoring this risks utopianism.                 |
  |                      | **3b.** Must be compatible with or account for the *persistence of profound moral disagreement* across and within societies/cultures.              | Disagreement is endemic. A TMP must explain how progress is possible/persuasive/identifiable amidst this, without presupposing universal convergence on one true morality (unless it argues for that).                                |
  |                      | **3c.** Must be compatible with the *path-dependency and contingency* of historical moral change (e.g., abolition succeeded in some contexts, failed in others; regression happens). | Moral change is messy and non-teleological. A TMP cannot rely on simplistic inevitability or predetermined endpoints.                                                                                                                 |
  | **4. Outcome Focus** | **4a.** Must prioritize *reductions in unjustified suffering and violence* as a core, non-negotiable indicator of progress.                         | Minimizing suffering is the most widely shared (though not exclusive) cross-cultural moral intuition. A TMP ignoring concrete harms risks becoming detached from the lived reality morality aims to address.                           |
  |                      | **4b.** Must account for *power dynamics* and *whose interests are served* by apparent progress or regression.                                     | Moral change rarely occurs in a power vacuum. A TMP must explain how power influences the recognition, direction, and implementation of "progress" to avoid justifying oppression rebranded.                                           |
  | **5. Reflexivity**   | **5a.** Must be applicable to *itself* and the society/culture that produces it. Must avoid blatant presentism or cultural chauvinism.             | A TMP must be able to critique its own historical context and potential biases. It cannot simply assume the endpoint of history resides in its own perspective.                                                                         |

  ### Analysis: Non-Negotiables, Contested Ground, Tensions

  1.  **Non-Negotiables:**
      *   **1a, 1b, 1c (Explanatory Power):** A TMP that cannot engage meaningfully with the core historical phenomena it purports to explain (expansion, regression, complex drivers) is inadequate by definition. It fails its primary task.
      *   **2a (Belief vs. Outcome):** Collapsing this distinction makes progress purely subjective (only belief matters) or purely behavioralist (only outcome matters, regardless of intent/justification), both of which are deeply problematic. Progress must involve some link between justification and result.
      *   **4a (Reduction of Suffering):** While the *full scope* of morality is debated, the alleviation of severe, unnecessary suffering is the most fundamental and widely compelling moral concern across traditions. A TMP that cannot explain progress as reducing such suffering is implausible. This is the bedrock.
      *   **5a (Reflexivity):** A TMP claiming universal validity but exempting itself or its context from critique is self-undermining and lacks intellectual integrity.

  2.  **Contested Ground (Philosophical Camps in Neutral Clothing):**
      *   **2b (Genuine Expansion vs. Enforcement):** This requirement *forces* the TMP to take a stance on moral ontology (realism vs. anti-realism/constructivism). A realist will lean towards "discovery/enforcement," a constructivist towards "creation/expansion." Presenting the *distinction* as neutral is fine, but how a TMP resolves it reveals its foundational camp. Insisting it *must* be resolved one way smuggles in ontology.
      *   **3a (Compatibility with Evolved Psychology):** While the *facts* of evolved psychology are neutral, the *weight* given to them is contested. Strong naturalists might see them as severe constraints, while others (e.g., Kantians, certain utilitarians) might argue reason/culture can largely transcend them. Demanding the TMP must "account for" them is neutral; demanding it must treat them as the *primary* constraint favors naturalistic camps.
      *   **4b (Power Dynamics):** While power is undeniable, the *degree* to which it fundamentally constitutes morality or merely influences its application is contested. Critical theorists will demand centrality, while some realists might see power as distorting access to moral truth rather than constituting it. The requirement to "account for" power is neutral; making it the *defining* feature of progress analysis favors critical camps.

  3.  **Potential Tensions/Inconsistencies:**
      *   **Widening Circle (Implied by 1a) vs. Evolved Psychology (3a):** This is the core tension. How can a TMP reconcile the empirically observed difficulty of sustaining impartial concern beyond small in-groups with the historical trend towards wider inclusion? Theories must either: a) Argue cultural/technological/rational mechanisms *can* stably override biology (e.g., via institutions, education), b) Argue the widening is superficial/unstable, c) Argue biology is less constraining than it seems, or d) Reject the "widening circle" as the core metric of progress. Resolving this tension is paramount.
      *   **Reduction of Suffering (4a) vs. Sincere Belief Change (2a):** Can progress occur *without* widespread sincere belief change, driven purely by institutions or power enforcing behaviors that reduce suffering? If so, is it still *moral* progress, or just beneficial social engineering? Conversely, does sincere belief change without reduced suffering constitute progress? A TMP must specify the relationship.
      *   **Contingency (3c) vs. Directionality (Implied by Progress):** If progress is real, is there some direction, however non-linear? Contingency highlights the fragility and non-inevitability. A robust TMP needs to articulate what constitutes "direction" without relying on teleology or inevitability. It might be a tendency, a potential, or a value-laden assessment of specific changes, not a law.

  ### The Most Excluding Requirement: Outcome Focus (4a - Reduction of Unjustified Suffering)

  This requirement does the heaviest lifting in filtering out inadequate theories. It rules out:

  1.  **Purely Belief-Based Theories:** Theories claiming progress is solely about changes in moral *beliefs* or *discourse*, irrespective of their impact on actual suffering (e.g., some overly academic or postmodern approaches). If beliefs become more "enlightened" but suffering increases or remains extreme for vulnerable groups, 4a demands this cannot be uncritically labeled progress.
  2.  **Formalist/Deontological Theories Untethered from Consequences:** Theories focusing exclusively on rule-following, duty, or abstract rights without serious consideration of the real-world consequences for lived experience. If adhering to a rule (e.g., a strict property right) causes massive, preventable suffering, 4a challenges whether upholding that rule constitutes progress in that context.
  3.  **Cultural Relativism/Subjectivism Taken to Extremes:** While respecting difference, 4a insists that practices causing severe, unnecessary suffering (e.g., torture, systematic brutalization) cannot be deemed "moral progress" simply because they represent a change within a culture or are sincerely believed to be right. It provides a minimal cross-cultural standard.
  4.  **"Noble Suffering" or Teleological Justifications:** Theories that justify present suffering as necessary for a future ideal (e.g., violent revolution for utopia, sacrificing generations for progress). 4a demands that progress must demonstrably alleviate suffering *in the process* or very concretely in the near term, not just promise it vaguely in a distant future. It rejects suffering as an inherent cost of "progress."
  5.  **Theories Ignoring Power (if 4b is linked):** While 4b is distinct, a strong focus on suffering reduction naturally highlights the suffering caused or ignored by power structures, making theories blind to power dynamics less plausible.

  **In essence, Requirement 4a grounds the concept of moral progress in the tangible reality of human (and potentially non-human) experience.** It forces the theory to connect abstract moral concepts to concrete well-being and harm, providing a crucial reality check against overly cerebral, self-congratulatory, or ideologically driven narratives of progress. It doesn't solve all problems, but it excludes a significant class of theories that fail this most basic test of moral relevance.
