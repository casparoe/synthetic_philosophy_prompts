answer: |-
  ### Facilitation Plan: "The Symmetry Dilemma"

  **Activity Title**: The Symmetry Dilemma  
  **Target Insight**: Participants experience how the assumption of identical reasoning can paradoxically favor cooperation in dilemmas, yet unravel when individual incentives to "stand out" are introduced.  
  **Core Tension**: Universal cooperation maximizes group welfare, but individual rationality favors defection; adding a "unique winner" prize destabilizes cooperative reasoning.  

  ---

  ### **Step-by-Step Procedure**  
  *(Total: 80 minutes)*  

  #### **Phase 1: Setup & Introduction** (10 min)  
  **Materials**:  
  - 20 identical slips for **Stage A** (pre-printed with options).  
  - 10 slips for **Stage B** (for retainers).  
  - Pens, collection box, whiteboard.  
  - Scrip tracking sheet (facilitator use only).  
  - Tokens: Paper "scrip" (1 scrip = 1 point; no monetary value).  

  **Script**:  
  > "Welcome! Today we’ll explore a decision-making game. You’ll make private choices to earn ‘workshop scrip’—points with no real-world value. Everyone faces the exact same rules, no communication allowed. Our goal is to see how individual choices interact. Let’s begin."  

  ---

  #### **Phase 2: Stage A - Contribution vs. Retention** (15 min)  
  **Slip Design** (Stage A):  
  ```
  [ ] CONTRIBUTE:  
      - You get 0 scrip.  
      - Every other participant gets 1 scrip.  

  [ ] RETAIN:  
      - You get 3 scrip, no matter what others do.  
  ```  
  **Script**:  
  > "Mark **one** box. Your choice affects others, but theirs affect you too. For example:  
  > - If you RETAIN, you get 3 scrip plus 1 scrip for every person who CONTRIBUTES.  
  > - If you CONTRIBUTE, you get 1 scrip for every *other* person who CONTRIBUTES.  
  > Remember: everyone faces identical options. Fold your slip and place it in the box."  

  **Facilitator Actions**:  
  - Collect slips, count **T** (total contributors).  
  - Calculate earnings:  
    - **Retainers**: 3 + **T** scrip  
    - **Contributors**: **T - 1** scrip  
  - *Do not reveal results yet*.  

  ---

  #### **Phase 3: Stage A Results** (10 min)  
  **Whiteboard Example** (after tallying):  
  ```  
  Total Participants: 18  
  Retainers (R): 12  
  Contributors (C): 6  

  Earnings:  
  - Each RETAINER: 3 + 6 = 9 scrip  
  - Each CONTRIBUTOR: 6 - 1 = 5 scrip  
  ```  
  **Script**:  
  > "Notice: retainers earned more individually, but if all contributed, each would get 17 scrip (since 18-1=17). Instead, everyone got less. Why might this happen?"  
  *(Pause for brief reflection; no discussion yet.)*  

  ---

  #### **Phase 4: Stage B - Bonus Pool** (15 min)  
  **Eligibility**: Only those who marked *RETAIN* in Stage A.  
  **Slip Design** (Stage B):  
  ```
  [ ] ENTER BONUS POOL:  
      - If exactly *one* person enters, they win 15 scrip.  
      - If zero or >1 enter, each entrant LOSES 1 scrip.  

  [ ] DO NOT ENTER:  
      - Keep your Stage A earnings unchanged.  
  ```  
  **Script**:  
  > "If you RETAINED, you may enter a bonus pool. **Key rules**:  
  > - The 15-scrip bonus **only** goes to one *unique* entrant.  
  > - If multiple enter or none do, entrants *lose* 1 scrip.  
  > Again, no communication. Mark your choice and submit."  

  **Facilitator Actions**:  
  - Collect slips, count entrants (**E**).  
  - Apply outcomes:  
    - **E = 1**: Winner gains 15 scrip.  
    - **E ≠ 1**: Each entrant loses 1 scrip.  

  ---

  #### **Phase 5: Stage B Results** (10 min)  
  **Whiteboard Example**:  
  ```  
  Stage B Entrants (E): 4  
  Outcome: E ≠ 1 → Each entrant loses 1 scrip.  

  Updated Earnings (example retainer):  
  Stage A: 9 scrip - 1 scrip = 8 scrip  
  ```  
  **Script**:  
  > "With 4 entrants, no one won the bonus, and each lost 1 scrip. Had only one entered, they’d have 9 + 15 = 24 scrip. What made it hard to coordinate?"  

  ---

  #### **Phase 6: Guided Discussion** (20 min)  
  **Goal**: Connect experiences to theoretical tension without jargon.  
  **Key Questions**:  
  1. **Stage A Reflection**:  
     - "Why did you choose CONTRIBUTE or RETAIN? Did you assume others would act like you?"  
     - *Insight Highlight*: "Many assume identical choices (‘If all contribute, we all win!’), but individual gain tempts defection."  

  2. **Stage B Reflection**:  
     - "Retainers: Did you try to be the *only* entrant? How did you predict others’ choices?"  
     - *Insight Highlight*: "Wanting to ‘stand out’ for the bonus clashes with assuming identical reasoning. This destabilizes cooperation."  

  3. **Conceptual Bridge**:  
     - "In Stage A, assuming identical choices (*quietly point to symmetry*) favors cooperation. But Stage B’s bonus rewards *asymmetry*—creating a new dilemma."  
     - Finally name concepts: "This mirrors **superrationality**: if all reason identically, cooperation seems rational. But add a ‘luring lottery,’ and symmetry breaks down."  

  **Avoid Early Jargon**: Delay terms like "superrationality," "Platonia," or "Nash equilibrium" until this phase.  

  ---

  ### **Anticipated Challenges & Solutions**  
  1. **Confusion in Stage A Earnings Calculation**:  
     - *Likelihood*: High. Participants may miss that contributors get (T-1) scrip.  
     - *Remedy*: Use whiteboard examples: "If 5 contribute, each gets 4 scrip. If you retained, you get 3 + 5 = 8."  

  2. **Stage B Misunderstanding**:  
     - *Likelihood*: Moderate. Some may think the bonus is split.  
     - *Remedy*: Emphasize: "Only **one** person wins 15 scrip *total*. Multiple entrants? All lose 1."  

  3. **Frustration with "Unfair" Outcomes**:  
     - *Likelihood*: High. Contributors may resent retainers.  
     - *Remedy*: Stress: "No ‘right’ choice. We’re studying tensions, not judging."  

  4. **Time Management**:  
     - *Risk*: Discussion runs long.  
     - *Remedy*: Use a timer. Deeper debates can continue post-session.  

  ---

  ### **Limit of the Exercise**  
  **Unreproducible Feature**: The theoretical assumption of **identical reasoning agents**.  
  - **Why**: Real participants doubt others will reason identically, weakening the superrational cooperation pull. In theory, agents *know* all are identical; here, players guess others’ motives.  
  - **Bridge via Explanation**: "In models, agents assume symmetry in reasoning. But humans question if others think like them—which dilutes the cooperative incentive. We must *imagine* perfect symmetry to see why cooperation seems rational in dilemmas like Stage A."  

  ---

