              - "What if we assume that everyone will reason the same way and therefore make the same choice? In Stage A, that might lead us to all choose the same. If we all contribute, we get 19 (if N=20) which is great. But if we all retain, we get 3. So we might be tempted to contribute. But note: we are not forced to do the same. And in fact, the individual incentive pulls toward retaining. So we have a conflict between collective and individual reasoning."

              - "In Stage B, if we assume we all reason alike, then we must all either enter or not. But if we all enter, we get -1 (and then total 3+T -1). If we all don't enter, we get 3+T. So we would choose not to enter. But then, if we all choose not to enter, then one person could enter and win 15. But that one person would be breaking the symmetry. So the assumption that we all reason alike and therefore choose alike leads to a stable outcome only if we all choose not to enter. But that outcome is unstable because any individual can do better by deviating (entering) if they think others are not entering."

          6. Finally, introduce the terms:
              - "This kind of reasoning is sometimes called 'superrationality'. It assumes that rational agents in symmetric situations will choose the same action, and that this fact can be used in decision-making. We see that in Stage A, superrationality might lead to cooperation (everyone contributes). But in Stage B, superrationality leads to a different problem: it suggests we should all not enter, but then the outcome is unstable because each individual has an incentive to break the symmetry. Moreover, adding the bonus stage might make the superrationality argument for Stage A less compelling because even if we all contributed in Stage A, we wouldn't get the bonus (since we wouldn't be eligible for Stage B). But note: we didn't know about Stage B when we did Stage A. However, if we had known about Stage B, then the possibility of getting a bonus in Stage B might tempt us to retain in Stage A."

   Implementation difficulties:

     - Confusion in Stage A about earnings calculation. We clarified by using T, but participants might not understand the formula.

          Remedy: Use a concrete example with small numbers. For instance, with 3 participants, show:

            If all contribute: T=3 -> each gets 3-1=2.
            If two contribute and one retains: 
              Contributors: T-1 = 2-1=1
              Retainer: 3+T = 3+2=5

          So the retainer gets more.

     - In Stage B, participants might not understand the bonus rule.

          Remedy: Give examples: 
            "If only one person enters, that person gets 15. 
            If two or more enter, each of those who entered loses 1. 
            If no one enters, nothing happens."

     - Time management: The session might run over.

          Remedy: Keep strict time limits and have a timer.

     - In the discussion, participants might not see the connection between the two stages.

          Remedy: The facilitator should guide the discussion to draw out the parallels.

     - The bonus winner identification: if there is a winner, the participant might not want to be identified.

          Remedy: Assure them that it's just a game and scrip has no monetary value. Or, if they prefer, we can record without announcing the name and just tell the winner privately and adjust their scrip.

     - Recording the scrip: We need a way to record individual earnings. We can have a spreadsheet or a chart.

          We can have participants write their Stage A choice and then we compute. Then for Stage B, we record their entry and then adjust.

          We might assign each participant a number and have them write that number on the slips (and keep a list matching numbers to names). Then we can post the results by number.

     - The point about superrationality might be too abstract.

          Remedy: Use the group's own experience: "Did anyone think: 'if we all do the same, then...'?"

   Limit of the exercise:

     - The exercise cannot reproduce the key feature of superrationality: the idea that rational agents in symmetric situations will inevitably choose the same action. In reality, without communication, participants are not forced to choose the same. They might choose differently based on their own reasoning. The theoretical concept requires that the agents know that they are all identical in reasoning and that this leads to the same choice. But in a live group, participants might not believe that everyone else will reason the same way they do. Therefore, the exercise might not lead to the cooperative outcome in Stage A (which we indeed don't expect) and the symmetry breaking in Stage B might be expected. The abstract idea of complete symmetry and identical reasoning must be explained as a thought experiment.

