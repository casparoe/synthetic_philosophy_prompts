   The exercise consists of two stages:
   Stage A: Each participant chooses to either "Contribute" or "Retain".
     - Retain: The chooser gets 3 scrip no matter what others do.
     - Contribute: The chooser gets 0 scrip, but every other participant gets 1 scrip.

   Stage B: Only those who chose "Retain" in Stage A are eligible to enter a bonus pool.
     - If exactly one person enters, that person gets 15 scrip.
     - If zero or more than one enter, each entrant loses 1 scrip (so gets -1 scrip).

   We need a step-by-step plan for an 80-minute session.

   Materials:
     - Paper slips for Stage A and Stage B (we'll design these)
     - Pens or pencils for participants
     - A way to collect slips (e.g., a box or envelope)
     - A way to display the results (whiteboard or flip chart)
     - Tokens for scrip (could be paper chips, or we can just record on paper and not use physical tokens, since it's a workshop)

   However, note: the facilitator says "token points system requiring no money". We can use a point system recorded on paper.

   We'll design the slips as follows:

   Stage A slip:
     [ ] Contribute   (If I choose this, I get 0 scrip, and every other participant gets 1 scrip)
     [ ] Retain       (If I choose this, I get 3 scrip, regardless of what others do)

