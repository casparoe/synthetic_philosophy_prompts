answer: |-
  ## The Principal Principle Under Fire: Deference, Admissibility, and the Challenge of Conflicting Evidence

  Lewis's Principal Principle (PP) stands as a cornerstone of Bayesian epistemology, elegantly linking objective chance and rational credence. It dictates: If an agent knows the objective chance of proposition A is *c* (at time *t*), and possesses no further "inadmissible" evidence (at *t*), their credence in A should be *c*. While intuitively compelling for canonical cases like fair coins or radioactive decay, the principle faces a significant challenge when agents possess evidence that seems neither part of the chance-fixing facts nor obviously irrelevant. Your particle decay scenario – knowing the objective chance is 0.01 *and* possessing a reliable, non-chance-based prediction that decay won't occur – crystallizes this controversy. Should the agent defer to the 0.01 chance, or does the prediction constitute inadmissible evidence, allowing credence to diverge? Resolving this requires weighing Lewis's foundational arguments against forceful objections.

  **The Case for Strong Deference: Lewis's Vision**

  Lewis grounded objective chance in the Humean mosaic – the totality of particular events throughout space-time. Chances, for Lewis, are a function of the laws of nature (themselves summaries of the mosaic's best systematization) *and* the entire history of the world up to time *t*. The PP, then, is not merely a heuristic; it's a substantive **rational norm** expressing the unique epistemic role of chance:

  1.  **Chance as Best Current Guide:** At time *t*, the chance of A (*ch_t*(A)) represents the *objectively optimal* summary of the world's history and laws concerning A's occurrence. It incorporates all relevant physical symmetries, constraints, and frequencies up to that moment. For an agent lacking "inside information" about the specific outcome, *ch_t*(A) *is* the rational credence.
  2.  **The Admissibility Condition:** This is crucial. Lewis defined admissible evidence at *t* as evidence solely about history up to *t* or the laws of nature. Such evidence is already *incorporated* into the chance value itself. Inadmissible evidence, conversely, provides information "about the outcome of the chance process itself" that goes beyond what the laws and history determine. Examples include information about the *future* after *t*, or details that bypass the chancy mechanism (like a Laplacean demon's prediction in a deterministic world).
  3.  **Preserving Chance's Authority:** Lewis argued that without a strong PP, chance loses its distinctive guiding role. If credences could routinely diverge from known chances based on evidence about the specific outcome, chance becomes merely one piece of evidence among many, potentially irrelevant. The PP ensures chance functions as the ultimate "expert" probability for events within its domain at time *t*.

  In your particle decay case, Lewis would likely argue the prediction *is inadmissible*. If it reliably indicates the specific outcome (non-decay), it provides information *about the outcome itself* that is not captured by the laws and history fixing the 0.01 chance. The agent *should* defer to chance, setting credence at 0.01, precisely *because* the prediction is the kind of "inside information" the admissibility clause is designed to exclude. To do otherwise would undermine chance's status as the objective summary of current uncertainty.

  **Objections to Strong Deference: When Chance Seems Obsolete**

  Critics argue Lewis's strong version of the PP leads to counterintuitive, even irrational, results in scenarios like yours:

  1.  **The Irrelevance Objection (Humphreys' Paradox):** If the agent possesses a *reliable* predictor indicating decay won't happen, demanding a credence of 0.01 seems perverse. It renders the specific, highly relevant prediction impotent in the face of a general probability. This makes chance *irrelevant* precisely when the agent gains superior, outcome-specific evidence. Rationality seems to demand credence reflect the *best total evidence*, which includes the prediction. Insisting on 0.01 appears dogmatic.
  2.  **The Overdominance Objection:** Conversely, the strong PP makes chance *too dominant*. It forbids rational agents from using evidence that seems legitimately relevant and predictive, simply because it bypasses the official chance mechanism (e.g., hidden variables or advanced detector states). This artificially restricts rational belief formation, demanding agents ignore potentially decisive evidence in favor of a statistical summary.
  3.  **The Nature of Chance and Prediction:** The objection hinges on the *source* of the prediction. If the prediction is generated by a process exploiting hidden variables that are *part of the physical world* but not incorporated into the official chance (perhaps because the best system doesn't reference them), why should this reliable physical information be deemed "inadmissible"? Isn't it simply *more detailed* evidence about the very history and laws the chance is supposed to summarize? Treating it as inadmissible makes chance seem like an arbitrary epistemic gatekeeper.
  4.  **PP as Heuristic or Constraint, Not Absolute Norm:** Critics often suggest the PP is best understood not as an absolute synchronic norm, but either:
      *   A **heuristic** for agents lacking specific evidence, or
      *   A **constraint on initial credences or ur-priors**, ensuring they align with chances *before* gathering specific evidence (akin to Lewis's later "New Principle" developed with Ned Hall to handle undermining futures).
      In your scenario, the agent *has* gathered highly specific evidence. Applying the PP rigidly ignores the Bayesian tenet of conditionalization on total evidence.

  **Resolution: The Prediction as Inadmissible – A Qualified Defense of Strong Deference**

  While the objections are powerful, Lewis's core insight, with careful attention to admissibility, provides the more robust account. **The agent in your scenario should set their credence to 0.01, treating the prediction as inadmissible.** Here's why:

  1.  **Chance as Epistemic Summary vs. Deterministic Revelation:** The 0.01 chance *summarizes* the objective uncertainty inherent in the physical situation at time *t*, given the laws and history. The reliable predictor, however, *bypasses* this uncertainty. If it works by accessing hidden variables or calibration data that deterministically (or near-deterministically) settle the outcome, it provides information *about the outcome itself* that is logically stronger and more specific than what the chance value conveys. This is the hallmark of inadmissible evidence – it gives a "sneak peek" at the result.
  2.  **Preserving the Distinction:** Allowing credence to diverge from known chance based on such predictors *collapses* the distinction between genuine objective chance and mere subjective uncertainty. If a reliable predictor always trumps the stated chance, then in any scenario where such predictors exist (even potentially), the "chance" ceases to represent real objective indeterminism; it merely reflects our ignorance of the predictor's state. The PP maintains chance's status as a fundamental feature of the world, not just a measure of ignorance.
  3.  **The Rationality of Following the Expert:** Chance is posited as the objective expert on its domain. If we accept this metaphysics, overriding its pronouncement based on another source – even a reliable one – is akin to thinking you know better than the acknowledged expert *in their field*, using information *they* deem irrelevant or inaccessible. Rational deference requires accepting the expert's judgment *when operating within the constraints of their expertise*, which excludes the specific outcome information provided by the predictor.
  4.  **The Burden on the Objector:** For the opposing view (that credence should be low, near 0) to be correct, **one must deny that the physical situation genuinely involves objective chance.** The opposing view implicitly assumes either:
      *   **Determinism:** The world is fundamentally deterministic; the "chance" of 0.01 is a misnomer reflecting ignorance, not ontology. The predictor reveals the underlying deterministic truth.
      *   **Chance is Reducible/Epistemic:** Chance is not a fundamental feature but merely a useful fiction summarizing complex deterministic processes or our incomplete knowledge. The predictor provides the missing details.
      *   **The Predictor is Part of the Chance-Fixer:** The predictor's operation or the variables it accesses are *themselves* part of the history/laws fixing the chance at *t*. If true, then knowing the predictor's output *would* be admissible evidence potentially *changing* the known chance from 0.01 (contradicting the setup where the agent *knows* the chance is 0.01).

  If, however, we accept Lewis's core thesis – that there are genuine, irreducible objective chances determined by laws and history, representing real indeterminism in the world – then evidence providing specific information about the outcome *must* be inadmissible. The predictor, by revealing details that settle the outcome before the chancy process "officially" resolves, provides precisely such information. To defer rationally to the objective chance *as* the expert summary of current indeterministic uncertainty requires setting credence to 0.01.

  **Conclusion: Deference Required**

  The Principal Principle, understood as a substantive rational norm grounded in the metaphysics of objective chance, withstands the challenge posed by your particle decay scenario. Lewis's strict admissibility condition is essential, not a flaw. The reliable prediction *is* inadmissible evidence because it provides direct information about the specific outcome that the objective chance, by its nature, abstracts away from. For the agent to rationally defer to the known chance as the expert on the current state of objective uncertainty, they must set their credence to 0.01. The opposing view – that the prediction justifies lowering credence – can only be correct if the scenario doesn't actually involve genuine objective chance at all, but rather deterministic processes or epistemic uncertainty masquerading as chance. If objective chance is real, deference is rationally mandated.
