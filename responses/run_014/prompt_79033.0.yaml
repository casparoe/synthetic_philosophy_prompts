prompt: |-
  I keep running into a family of decision problems that all seem to want the same repair, and I want to know whether the repair has a name.

  The first: I am choosing in a situation where something that happened before I was born — a process that modeled me well enough to predict what I would choose — has already fixed how the world will treat me. The option that looks best given what I can see is not the one that looks best in the worlds where the prediction went that way, and oddly it is the latter that I find myself caring about. The second: I would do better over a lifetime if I were the kind of person who cannot be pushed around, even though being that kind of person costs me in the particular case where someone tries to push. The third, which is the one I cannot make sense of: a friend insists that if I meet a stranger who decides by exactly the same procedure I do, working from different information, then that stranger's decision is my decision — so I should cooperate with them in a one-off prisoner's dilemma, and care about what happens to them the way I care about my own future.

  What unites them, I think, is that in each I do better by giving up the question "what should I do now, given what I know?" and asking instead "what rule would I have wanted to have chosen, from before I knew which of these situations I would land in?" — then following that rule even where its local advice is worse. I can see how this sits close to two things I already have some grip on: the idea that your own choice is itself evidence about how the world is, and the ordinary business of binding yourself in advance so that others can see you are bound. But neither is the thing I am after: the first still has me reasoning from inside my situation, and the second needs someone to actually see the commitment.

  Is there a name for this? If so I want the carving, not just the label: how it differs from each of those two neighbours, and which of my three cases it really covers. I suspect the second is a different animal, and that the third is the same animal pushed further than I expected, but I would like to be told whether that is right, and why.
reasoning: |-
  We are presented with three decision problems that seem to share a common structure. The user suspects that there is a unifying concept and wants to know its name and how it applies to each case.

  The common thread is that in each scenario, the decision maker can achieve a better outcome by committing to a rule or strategy in advance (from behind a "veil of ignorance" or in a precommitment stage) rather than optimizing at the moment of choice given their current information.

  Let's break down each case:

  1. **The prediction case (Newcomb's Problem):** 
     - A predictor (before you were born) has predicted your choice and set up the world accordingly. 
     - The problem is that if you choose the option that looks best given what you see (the "dominant" choice), you end up worse off because the predictor anticipated that and set up the world unfavorably. 
     - Instead, if you choose the option that is best in the worlds where the prediction went that way (i.e., the option that the predictor thought you would choose), you get a better outcome.
     - This is a classic setup for **causal decision theory (CDT)** vs. **evidential decision theory (EDT)**. EDT recommends the choice that is best in the worlds where you make that choice (because it takes your choice as evidence about the world), while CDT ignores the evidential link and goes for the locally dominant option.
     - However, the user notes that they care about the outcome in the worlds where the prediction went that way, which is the EDT perspective.

  2. **The commitment case (Schelling's Conjecture / Commitment Strategies):**
     - You would do better over a lifetime if you were the kind of person who cannot be pushed around, even though in any one instance of being pushed, it would be costly to resist.
     - This is about precommitment to a rule (being a tough type) to deter others from pushing you, which works because they know you are committed. 
     - This is a standard example in game theory for **commitment strategies** and **reputation building**.

  3. **The identical stranger case (Reflection on Decision Procedures):**
     - A friend argues that if you meet a stranger who uses the exact same decision procedure as you (but with different information), then you should treat their decision as if it were your own and cooperate in a one-shot prisoner's dilemma.
     - This is reminiscent of **Hofstadter's Superrationality** or **Reflective Decision Theory**, where you consider that the other agent is using the same reasoning as you and therefore you should coordinate on the outcome that is best for both. 
     - Alternatively, it can be seen as a form of **acausal cooperation** in the context of decision theories that account for logical correlations (like **updateless decision theory**).

  The user suggests that in each case, the repair is to ask: "what rule would I have wanted to have chosen, from before I knew which of these situations I would land in?" and then follow that rule.

  This approach is known in the decision theory literature as **Updateless Decision Theory (UDT)**, introduced by Wei Dai and further developed by others (like Eliezer Yudkowsky and others in the MIRI community). 

  ### Key idea of UDT:
  - Instead of updating on the information you have and then maximizing (as in standard Bayesian decision theory), you choose a policy (a mapping from observations to actions) that would have been optimal from a prior perspective (before you had any information). 
  - This policy is then followed regardless of the particular information you receive, because it was chosen to maximize expected utility from the pre-information state.

  ### How UDT relates to the cases:

  1. **Prediction case (Newcomb's Problem):**
     - In UDT, you choose a policy for how to act in both boxes or only the second box. From the prior perspective, you know that the predictor has set up the boxes based on your policy. The optimal policy is to one-box, because that leads to the predictor putting the million in the second box. This is because the policy of one-boxing leads to a better outcome in expectation (from the prior view) than two-boxing.
     - This is similar to EDT, but note that EDT is updating on the evidence (your choice) and then acting. UDT does not update on the evidence in the same way; it sticks to the precommitted policy.

  2. **Commitment case:**
     - UDT would choose a policy of always being tough (even when it is locally costly) because from the prior perspective, the policy of being tough deters pushes and so leads to a better overall outcome. This is a precommitment to a rule that is followed unconditionally.

  3. **Identical stranger case:**
     - UDT handles this naturally. When choosing a policy from the prior perspective, you consider that your policy will be used by all agents that are "copies" of you (using the same decision procedure). Therefore, in a one-shot prisoner's dilemma, the policy that says "cooperate if I am in a situation where the other agent is using the same policy" will lead to mutual cooperation, which is better than mutual defection. Since the policy is chosen to maximize expected utility from the prior, and mutual cooperation is the best symmetric outcome, UDT will choose to cooperate.

  ### How UDT differs from the two neighbors mentioned:

  - **Evidential Decision Theory (EDT):**
    - EDT conditions on the action and then computes the expected utility. This leads to the right choice in Newcomb's problem (one-box) but fails in other scenarios (e.g., in a smoking lesion problem, it would recommend not smoking because smoking is evidence of a lesion, even if smoking doesn't cause the lesion). 
    - UDT does not condition on the action in the same way. Instead, it chooses a policy that is optimal from the prior. In the smoking lesion problem, UDT would smoke because the lesion is set independently of your policy (so the policy of smoking doesn't change the probability of the lesion). 
    - Thus, UDT is not just about taking your action as evidence; it's about choosing a policy that is optimal in expectation from the prior state.

  - **Precommitment:**
    - Precommitment in the traditional sense (like Ulysses tying himself to the mast) requires that the commitment be observable and binding. 
    - UDT, however, does not require that the commitment be observable. It is a decision-theoretic approach that internally follows the policy without needing external enforcement. For example, in the commitment case, UDT would have you resist even if no one is watching because the policy was chosen to be followed in all situations. However, in practice, the commitment must be credible to deter others. UDT provides a rationale for why you would follow through even when unobserved (because you are following the optimal policy).

  ### Which cases does it cover?

  - The user suspects that the second case might be a different animal and the third is the same animal pushed further. 
    - Actually, UDT covers all three. 
    - The second case is a standard application of UDT: choosing a policy of being tough to deter challenges. 
    - The third case is a more radical application of UDT because it involves logical correlation (the stranger uses the same decision procedure) and cooperation in a one-shot interaction.

  ### Conclusion

  The name for the repair is **Updateless Decision Theory (UDT)**.

  - It differs from EDT by being policy-based and not updating in the same way (thus avoiding some pitfalls of EDT).
  - It differs from traditional precommitment because it is an internal commitment to a policy that is followed without needing external enforcement (though in some cases, external observability may be necessary for the policy to work, as in the commitment case).

  All three cases are covered by UDT:

  1. Newcomb's problem: UDT one-boxes.
  2. Commitment: UDT chooses and adheres to the tough policy.
  3. Identical stranger: UDT cooperates in the prisoner's dilemma.

  So the user's intuition is correct: the same repair (UDT) applies to all three.
answer: |-
  The repair you're describing is most directly captured by **Updateless Decision Theory (UDT)**, a framework developed in the context of formal decision theory (primarily by Wei Dai and later elaborated by researchers like Eliezer Yudkowsky). UDT addresses exactly the core issue in your cases: it shifts the focus from *conditional* optimization ("what should I do now, given my current knowledge?") to *unconditional* optimization of policies ("what decision rule would I precommit to, before knowing my specific situation?"). Below, I'll carve this concept carefully, differentiate it from its neighbors, and explain how it applies to your three cases.

  ---

  ### **Core Idea of Updateless Decision Theory (UDT)**
  - **Premise**: UDT treats your decision as the output of a fixed *policy* (a mapping from observations/inputs to actions) chosen *in advance* from a "pre-knowledge" perspective. You select the policy that maximizes expected utility across all possible worlds you might find yourself in, *ignoring the updates to your beliefs that occur once you know which world you're in*. You then follow this policy rigidly, even when its local advice seems suboptimal.
  - **Why it works**: In scenarios where your choice provides *evidence* about unobserved variables (e.g., a predictor's accuracy, your own traits, or others' decisions), UDT avoids self-defeating loops by decoupling the *selection of the policy* (done "outside" time) from its *execution* (done with current knowledge). This often outperforms "updateful" methods that condition on local information.
  - **Key difference from neighbors**:
    - **Evidential Decision Theory (EDT)**: EDT still reasons "from inside" your situation by treating your action as *evidence* about the world (e.g., in Newcomb's Problem, choosing one box is evidence the predictor knew you'd do that). However, EDT *updates on your current knowledge* and maximizes conditional expected utility. UDT, by contrast, doesn't update: it locks in a policy *before* seeing evidence, so it isn't swayed by the local implications of that evidence.  
      *Example*: In Newcomb's Problem, EDT one-boxes because it conditions on the predictor's accuracy, but UDT one-boxes because it pre-selects a policy of one-boxing to *cause* the predictor to fill the box (even if UDT "knows" the box is empty when deciding). UDT handles counterfactuals better than EDT in logical/algorithmic settings (like your stranger case).
    - **Precommitment (binding)**: Standard precommitment relies on *external* mechanisms (e.g., contracts, reputation, or physical constraints) to make your threat/strategy credible. UDT achieves similar results *internally* by treating the policy as immutable once chosen, even if no one observes your commitment. It's a "decision-theoretic precommitment" that doesn't require external enforcement.  
      *Example*: In your "cannot be pushed around" case, precommitment might involve visibly swearing an oath, while UDT is the inner resolve to always resist because that was the optimal pre-chosen rule—even if no one is watching.

  ---

  ### **Application to Your Three Cases**
  1. **The prediction case (e.g., Newcomb's Problem)**  
     - **Problem**: A predictor modeled you before birth. Taking both boxes (local optimum) leads to a worse outcome than taking one box, because one-boxing is evidence the predictor knew you'd choose it.  
     - **UDT repair**: From a pre-knowledge position, you'd precommit to a policy of one-boxing. This maximizes expected utility because the predictor's setup depends on your *policy*, not your momentary choice. UDT follows this policy even if you "know" the box is empty when deciding—it ignores the local evidence.  
     - **Why it works**: UDT severs the feedback loop where your action corrupts evidence (e.g., two-boxing "proves" the predictor knew you'd defect). It covers this case perfectly.

  2. **The commitment case ("cannot be pushed around")**  
     - **Problem**: Being tough is locally costly when tested but globally beneficial by deterring pushes.  
     - **UDT repair**: From a pre-knowledge perspective, you'd precommit to a policy of always resisting pushes. UDT follows this policy unconditionally, even when resisting is painful.  
     - **Is it a different animal?** Partially. While UDT handles this, it overlaps with **instrumental strategies** in game theory (e.g., Schelling points). The difference: UDT doesn't require others to *observe* your commitment—it works even in isolation. However, in practice, UDT's effectiveness here *depends* on the push being predictable (e.g., if pushers can't infer your policy, deterrence fails). Thus, this case is UDT-adjacent but emphasizes the *strategic* aspect of policy selection. UDT covers it, but it's not the purest example.

  3. **The identical stranger case (one-shot Prisoner's Dilemma with a "copy")**  
     - **Problem**: Your friend argues you should cooperate because the stranger uses your exact decision procedure.  
     - **UDT repair**: From a pre-knowledge perspective, you'd precommit to a policy of cooperating with agents known to use your decision procedure. Since your policy is identical to the stranger's, UDT ensures mutual cooperation.  
     - **Is it the same animal pushed further?** Yes. This is UDT's flagship application. Standard theories (like CDT or EDT) defect here because they condition on local knowledge (e.g., "I control only my choice"). UDT, by optimizing policies pre-observation, recognizes that both agents' actions are deterministically set by the *same* policy. Cooperating is optimal because the policy is selected for all instances simultaneously—it's acausal coordination. Pushing UDT further reveals its strength in **logical correlation** (where decisions are linked by shared algorithms, not cause-effect).

  ---

  ### **Why UDT Unifies These Cases**
  - All three involve **acausal influences**: Your choice provides evidence about fixed facts (prediction, your "type," or the stranger's decision) that affect outcomes. UDT handles these by optimizing *before* the evidence is known.  
  - UDT **subsumes self-commitment**: It binds you to rules without external enforcement, making it a decision-theoretic "inner commitment."  
  - The **difference from causal decision theory (CDT) and EDT**: CDT ignores evidence (always two-boxes), EDT overfits to evidence (can be exploitable), while UDT uses evidence to *select policies* but not to *deviate* from them.  

  In summary:  
  - **Name**: Updateless Decision Theory (UDT).  
  - **Carving**: It's the optimization of *fixed policies* chosen from a pre-observation perspective, ignoring belief updates during execution.  
  - **Coverage**: UDT directly covers Cases 1 and 3. Case 2 is covered but highlights strategic precommitment (UDT's "applied" form).  
  - **Why your suspicion is right**: Case 2 *is* a different emphasis (instrumental value of commitment), while Case 3 *is* UDT pushed to its logical extreme (across algorithmically linked agents). All benefit from the same core repair: decoupling policy selection from local updates.  

  If you explore further, look into UDT extensions like **logical induction** or **functional decision theory**, which refine these ideas. But UDT is the bedrock.
