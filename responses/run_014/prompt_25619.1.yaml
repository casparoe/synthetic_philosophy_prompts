prompt: |-
  I'm a hospital ethicist and I keep running into the same nightmare scenario: a patient wrote an advance directive years ago saying "no life-sustaining treatment if I have severe dementia," but now they have moderate dementia and seem content — they smile, enjoy pudding, recognize family sometimes. The family is split. Some say "follow the directive, she would hate this." Others say "look at her, she's happy, how can you withhold antibiotics from a happy person?"

  I need an actual procedure I can use on the floor — not a seminar paper. Something my team (attending physician, nurse, social worker, family) can work through in under an hour. It should tell us: what questions to ask in what order, what counts as an answer that pushes us one way or the other, where we should stop and say "the directive stands" vs. "the directive is overridden," and — crucially — which steps are genuinely philosophical judgment calls that no algorithm can settle.

  Ground it in whatever the literature on advance directives and the authority of the earlier self actually says: Dworkin's integrity view, Dresser's critique, the personal identity problem, whatever's relevant. But translate it. I don't need citations, I need a tool. Then run it on two cases: (1) the dementia case above — the contented patient with moderate dementia whose advance directive refuses antibiotics for pneumonia, and (2) a case where the patient's advance directive refuses blood transfusions on religious grounds (Jehovah's Witness), but the patient is now unconscious after a car accident, the directive is 15 years old, and the family says they left the faith five years ago — though there's no documentation of that. And tell me honestly: what kinds of cases will this procedure fail on, where I should just call the ethics committee and admit we're flying blind?
reasoning: |-
  Okay, the user is a hospital ethicist dealing with a recurring ethical dilemma about advance directives. They need a practical, step-by-step procedure to handle cases where a patient's prior written directive conflicts with their current condition or family input. Let me unpack this.

  First, the core problem: advance directives written when the patient was competent now seem mismatched to their current state—either because they have dementia but appear content, or because family claims they changed religious beliefs. The team needs a clear process to decide whether to follow the directive or override it, and they need it fast—under an hour. 

  The user explicitly rejects theoretical discussions; they want a tool. But they also want it grounded in real philosophy (Dworkin, Dresser, personal identity debates). The challenge is translating dense academic concepts into actionable steps without jargon. They mentioned two test cases: dementia with possible quality of life vs. prior refusal, and a Jehovah's Witness with alleged belief change.

  Hmm... what's the deeper pain point here? Probably: avoiding moral distress in the team, preventing family fights, and not getting sued. Also, they likely need to justify decisions to both medical staff and families. The unspoken ask might be: "How do I make this feel less arbitrary when there's no perfect answer?"

  Key angles from the literature to weave in:
  - Dworkin's "integrity" view (prior competent self should govern)
  - Dresser's "then-self/now-self" conflict (current interests matter)
  - Parfit's personal identity question (is the demented patient still "the same person"?)
  - Relational autonomy (family input as evidence of changed wishes)

  But! Must avoid philosophy lectures. Instead, bake these into questions like: "How much does the current self resemble the directive's author?" (that's Parfit/Dresser) or "Is the refusal so core to their identity that it persists?" (Dworkin).

  For the procedure: need a flowchart-like sequence but with off-ramps where ethics must be called. Critical to flag which steps are judgment calls—e.g., "assessing suffering" is subjective; no algorithm fixes that. 

  Dementia case nuances: Contentment ≠ ability to reconsider the directive. Smiling at pudding doesn't mean they'd accept prolonged decline. But forcing antibiotics on someone who'd find this degrading is also harmful. The tool must help weigh prior values against current experience.

  JW case landmines: Belief changes are high-stakes. If family claims they left the faith but have no proof, risk of overriding a religious directive is huge—could be life-ending and unethical. Default might be strict adherence unless evidence is ironclad.

  Failure cases: Anything where identity/belief change is ambiguous (e.g., early dementia patients with fluctuating opinions) or directives with vague triggers ("if quality of life is poor"). Also, legal gray zones—better to pause and call ethics.

  Structure the tool as a checklist with:
  - Verification steps (is the directive valid/applicable?)
  - Conflict diagnosis (why the doubt now?)
  - Evidence weighting (how reliable are current indicators?)
  - Thresholds for overriding (e.g., only if current self clearly contradicts + no suffering + no coercion)
  - Escape hatches (when to stop and call committee)

  Test both cases: 
  - Dementia: Directive likely stands unless family proves she'd reconsidered. Contentment alone isn't enough.
  - JW: Directive stands unless documented exit from faith. Unverified family claims ≠ evidence.

  Admit defeat when: 
  - Competing equally valid principles (autonomy vs. beneficence)
  - Uncertain patient identity continuity
  - Suspected coercion/undue influence
  - Legal liability risks

  ...Ultimately, the goal is to reduce chaos, not eliminate uncertainty. Hence the "when to call ethics" safety net.
answer: |-
  Here's a practical, floor-ready procedure based on the core ethical tensions in advance directives literature (Dworkin's "critical interests" vs. Dresser's "current experiential interests," Parfit's identity continuity concerns). It's designed for a **45–60 minute team huddle** and includes clear off-ramps.

  ---

  ### **The DECIDE Protocol for Contested Advance Directives**  
  **(D**irective Evaluation | **E**vidence of Change | **C**urrent State | **I**dentity Continuity | **D**ecision Threshold | **E**scalate)

  #### **Step 1: Directive Evaluation (5 min)**  
  *Questions:*  
  - Is the directive **legally valid** (signed/witnessed)?  
  - Is it **applicable** to the *current* clinical situation? (e.g., does "severe dementia" clearly cover moderate dementia? Does "life-sustaining treatment" include antibiotics for pneumonia?)  
  *Decision Triggers:*  
    - If **NO** to either → Directive is **inactive**. Follow standard surrogate decision-making.  
    - If **YES** → Proceed. *The directive is presumptively binding* unless overridden by strong evidence.

  #### **Step 2: Evidence of Change (15 min)**  
  *Questions:*  
  - **Objective evidence** the patient changed their mind *while still competent?* (e.g., updated directive, notarized letter, physician note documenting discussion).  
  - **Credible testimony** from proxies/family about explicit statements *contradicting the directive* (e.g., "She said last year she was scared of dying from infection").  
  *Weighting:*  
    - Written evidence > Consistent testimony from multiple parties > Contradictory or single-party testimony.  
    - Claims about *religious/cultural shifts* (e.g., "left Jehovah's Witnesses") require **corroboration** (e.g., friends, clergy, withdrawal records). Unverified family claims are *weak evidence*.  
  *Decision Triggers:*  
    - **Strong evidence of change** (e.g., new directive) → Directive **overridden**.  
    - **No evidence or weak evidence** → Directive **stands**.  
    - **Ambiguous** → Proceed to Step 3.

  #### **Step 3: Current State Assessment (10 min)**  
  *Questions:*  
  - What is the patient's **level of distress/suffering**? (e.g., pain, agitation, fear)  
  - What is the patient's **level of engagement/contentment**? (e.g., smiles, seeks interaction, enjoys food).  
  - Can they **express preferences** *now*? (e.g., says "yes" to treatment when asked).  
  *Weighting (Per Dresser):*  
    - Current suffering strengthens case to *override* a refusal of care.  
    - Current contentment *does not* automatically override a prior refusal (Dworkin: prior values may reject "mere biological survival").  
    - Expressed current preferences **override the directive** if consistent and informed.  
  *Decision Triggers:*  
    - Patient **explicitly consents** to treatment now → Override refusal.  
    - Patient **explicitly refuses** now → Directive stands.  
    - **Unable to express preference** → Proceed to Step 4.

  #### **Step 4: Identity Continuity (10 min)**  
  *Questions (Parfit/Dresser Lens):*  
  - Does the patient retain **core values/traits** from when the directive was written? (e.g., a devout JW still refusing blood vs. a formerly defiant person now placid).  
  - Is the refusal based on **"critical interests"** (Dworkin: profound beliefs about dignity/narrative) or **"experiential interests"** (avoiding suffering)?  
  *Weighting:*  
    - Religious/ideological refusals have **high continuity** (Dworkin: core to identity).  
    - Quality-of-life refusals (e.g., dementia directives) have **lower continuity** if current self has no memory of prior values (Dresser: "then-self" ≠ "now-self").  
  *Judgment Call:* No algorithm here. Team must discuss: *"Would the person who wrote the directive still see this version of themselves as worthy of protection?"*  

  #### **Step 5: Decision Threshold (5 min)**  
  | **Scenario**                     | Directive STANDS                                  | Directive OVERRIDDEN                             |  
  |----------------------------------|---------------------------------------------------|--------------------------------------------------|  
  | **Religious/critical refusal**   | Unless *proven* competence-era revocation         | Only if **documented** retraction or consent     |  
  | **Quality-of-life refusal**      | If current self is suffering OR prior values seem intact | If **all**: no suffering + contentment + weak identity continuity |  

  #### **Step 6: Escalate (When Stuck)**  
  Call ethics committee if:  
  - Conflict between **equally weighted principles** (e.g., strong critical interest vs. current contentment with no suffering).  
  - **Suspected coercion/family bad faith**.  
  - **Legal ambiguity** (e.g., unclear applicability of "severe dementia").  
  - **High stakes + zero corroborating evidence** (e.g., life-threatening refusal with contested beliefs).  

  ---

  ### **Case Applications**  
  **Case 1: Dementia Patient ("No treatment if severe dementia")**  
  - **Step 1:** Valid/applicable? *Yes* (pneumonia = life-sustaining; "severe" arguably covers moderate-severe decline).  
  - **Step 2:** Evidence of change? *None* (family claims are wishes, not competency-era statements).  
  - **Step 3:** Current state? Content but unable to express preferences.  
  - **Step 4:** Identity? *Low continuity* (moderate dementia likely severs prior values). Contentment suggests no suffering.  
  - **Step 5:** Threshold → **Override directive** *if* treatment aligns with current interests (comfortable survival). Antibiotics likely given.  
  - *Why?* Dresser's view dominates: Prior self cannot bind content current self with no suffering.  

  **Case 2: Jehovah's Witness (Refuses blood, unconscious)**  
  - **Step 1:** Valid/applicable? *Yes*.  
  - **Step 2:** Evidence of change? *Uncorroborated* family claim (no documentation). Weak evidence.  
  - **Step 3:** Current state? Unable to express preferences.  
  - **Step 4:** Identity? *High continuity* (religious refusal = critical interest). Dworkin's view: honoring integrity requires adherence.  
  - **Step 5:** Threshold → **Directive stands**. No transfusion without proof of change.  
  - *Why?* Critical interests are "sacred" (Dworkin); overriding risks profound violation.  

  ---

  ### **Where This Fails (Call Ethics Immediately)**  
  1. **Vague Directives**: e.g., "no heroic measures" or "if no meaningful recovery" without definitions.  
  2. **Fluctuating Capacity**: e.g., patient with delirium who consented yesterday but refuses today.  
  3. **High-Risk Cultural Conflicts**: e.g., family demands transfusion for an unconscious JW patient against directive, citing "secret apostasy."  
  4. **Emergencies with No Time**: This protocol requires deliberation; if minutes matter, default to directive.  

  **Bottom Line**: This tool prioritizes **evidence of competent-era choices** for critical interests (religion, dignity) but permits **flexibility for quality-of-life refusals** when current experience diverges. When identity continuity fractures (dementia) *and* the patient isn't suffering, the directive loses force. But when the refusal is ideological, the burden of proof to override is near-impossible without documentation. If you hit philosophical quicksand (e.g., "Is a smiling dementia patient still Ronald Dworkin?"), stop and escalate—that’s what committees are for.
