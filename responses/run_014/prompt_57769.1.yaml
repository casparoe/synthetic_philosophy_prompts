prompt: |-
  So I got talked into sitting on a standing franchise-and-elections commission in my city. Seven of us, and I'm the only philosopher, which apparently makes me "the theory person." We get four to six proposals a year and now neighboring towns send us theirs too, so whatever I bring needs to be something the others can run without me in the room. The commission is a city clerk, a retired probate judge, a high-school civics teacher, two neighborhood-association types and a small-business owner. None of them will read political theory and I'm not handing anyone a bibliography, so the reasoning has to live inside the procedure itself.

  The current stack of three, which public comment keeps conlfating:
  1. votes at 16 for city council and school board;
  2. local voting rights for non-citizen residents with three or more years in the city;
  3. compulsory voting in city elections, enforced by a $25 fine.

  Give me a procedure we can run on any franchise proposal in about half an hour at a monthly meeting: the questions in order, what counts as a good enough answer to each, where a proposal gets stopped with a flat "no," and where we have to admit the question is about values and hand it to a vote rather than pretending the procedure settled it. It should start by sorting the proposal, because I don't think these three are the same kind of question at all — two are about who's inside the demos and one isn't about the boundary but about whether voting can be demanded of people who are already inside. If you think that sort is wrong, say so and give me a better one. Any term of art you can't avoid, define in one line; this thing gets read aloud at a public meeting.

  Then it has to face what I can't get around in my own head: any rule about who belongs in the demos is itself a rule that only some demos can make, so we can't fix the boundary democratically without going in circles. The procedure has to be explicit about what it's treating as settled before politics starts, instead of smuggling that in at step two.

  It also has to handle the over-inclusion slide. If the test is "everyone affected gets a say," our zoning decisions entitle people three states over plus people not yet born, and we have no stopping rule. And I want something specifically about age: age is odd because unlike race or sex everybody passes through it if they live, so the excluded aren't a standing caste, they're a rotating one. Does that genuinely make the exclusion less objectionable, or am I comforting myself?

  Same treatment for the compulsary one, where the interesting bits to me are whether a $25 fine is a penalty or just a price, and whether the usual case for compulsion (turnout gaps track income, so forcing everyone to vote helps the poor) survives the fact that the fine lands hardest on those same people.

  Run it on all three. Don't rig it for me: I've said publicly that I favor votes at 16 and I'm against compulsion, so if the procedure sinks one of my positions or rescues the other, write that down, name the step that did it, and say why. Finish by marking which steps are judgment calls in a procedural costume, and by listing what this procedure simply cannot decide — the points where I'll have to stand up and tell a room full of people that we have no method.
reasoning: |-
  Hmm, the user is a philosopher on a city franchise commission needing a practical decision procedure. They need a 30-minute framework for evaluating franchise proposals that doesn't require theoretical background, handles three specific cases (voting at 16, non-citizen voting, compulsory voting), and confronts fundamental democratic paradoxes. 

  Key constraints jump out: The commission members won't read theory, so the reasoning must be baked into the steps. The procedure must explicitly acknowledge where values take over from technical criteria. And it must address the circularity problem (who decides the demos?) and over-inclusion risks without getting stuck.

  The three proposals seem categorically different - two about demos boundaries (who votes), one about obligation (must vote). That structural observation feels right. Age exclusions are philosophically distinct from other exclusions because they're temporary and universal, but that doesn't automatically make them less problematic - just different.

  For the procedure itself, it needs clear stopping points. The "is this even our question?" filter first makes sense to avoid wasted time. Then the boundary paradox requires naming the existing demos as the starting point without justifying it - practical but uncomfortable. The affected-interests test needs guardrails against overextension, hence the "concrete/immediate" qualifier. 

  Applying it to their cases: 
  - Votes at 16 likely clears all steps but requires a values vote on whether age exclusion is justified. 
  - Non-citizen voting might stumble at Step 4 if residency is deemed insufficient connection. 
  - Compulsory voting fails Step 2 since it's not a boundary question, then hits problems with enforceability and disproportionate fines. 

  The user's personal positions surviving or falling isn't rigged - the procedure sinks compulsion (their stance) on technical grounds but pushes votes-at-16 to values (their stance wins there democratically). That's honest. 

  Finally, naming the judgment calls is crucial: Steps 4, 5, and the values votes are where philosophy hides in procedure's clothing. And the procedure can't resolve the foundational paradox - it can only note the starting point and move on. That frankness might be what the user needs when facing a contentious public meeting.
answer: |-
  Here's a procedure designed for your commission: a 30-minute, theory-embedded flowchart with explicit stopping points and value judgments. It treats franchise **boundary** questions (who *is* in the demos) separately from **obligation** questions (what *must* the demos do), and forces transparency about circularity and value judgments.

  **Franchise Proposal Evaluation Procedure (Read Aloud Version)**

  "This Commission evaluates proposals to change who can vote or whether voting is required in city elections. We follow these steps in order. If a proposal fails any step, we recommend rejection unless noted. Steps marked **(JUDGMENT)** require us to weigh values explicitly; we vote on those. Steps marked **(PARADOX)** acknowledge a fundamental tension we cannot resolve but must note."

  1.  **SORT THE QUESTION (90 seconds):**
      *   **Question:** Is this proposal about *who belongs in the demos* (voting group) or about *obligations of those already in the demos*?
      *   **Good Answer:** Clear categorization based on the proposal's text. Does it change eligibility (e.g., age, citizenship, residency status) or mandate action (e.g., compulsory voting, penalties)?
      *   **Stop/Reject If:** Unclear categorization after brief discussion. Proposal sent back for clarification.
      *   **Your Cases:** 1 (16-yr-olds) & 2 (non-citizens) = **Boundary**. 3 (Compulsory Voting) = **Obligation**.

  2.  **FOR BOUNDARY PROPOSALS (Who Belongs?):**
      1.  **THE CIRCULARITY PARADOX (PARADOX) (3 minutes):**
          *   **Statement (Read Aloud):** "Any rule deciding who makes the rules creates a circle. We start with the existing demos (adult citizens) as our practical foundation. We do *not* claim this starting point is perfectly justified, only that it's where we must begin. This proposal asks us to change that boundary."
      2.  **THE CONNECTION TEST (5 minutes):**
          *   **Question:** Does the proposed new group have a **direct, concrete, and enduring stake** in the specific decisions made by *this* city government *because* they live here? (e.g., paying local taxes, using city services, subject to local laws, raising kids in schools).
          *   **Good Answer:** Evidence of tangible, local impact tied to residency. Avoids vague "affectedness" (e.g., "future generations" or "people three states over" fail – too broad/indirect).
          *   **Stop/Reject If:** No plausible claim of direct, concrete local stake based on residency can be made for the group.
      3.  **THE EXCLUSION JUSTIFICATION TEST (JUDGMENT) (7 minutes):**
          *   **Question:** Is there a **compelling, specific, and non-arbitrary reason** grounded in protecting the *integrity of the vote or governance* (not just tradition or preference) to *exclude* the group identified in Step 2.2?
          *   **Good Answer:** Evidence of a genuine risk of harm (e.g., severe lack of capacity directly impairing informed voting, demonstrable conflicting national allegiance overriding local interests, *not* just assumptions). **Age Specific Note:** Temporary exclusion based on age must show why *this specific age* is the bright line for sufficient maturity/independence, acknowledging it's a rotating exclusion.
          *   **Stop/Reject If:** Exclusion appears arbitrary, discriminatory like a caste (race/sex), or based solely on tradition/fear. **OR** If the *only* justification fails scrutiny.
          *   **Value Vote Required?** ALWAYS. This is inherently about values – what constitutes sufficient stake, capacity, or loyalty. The Commission must vote Yes/No here.

  3.  **FOR OBLIGATION PROPOSALS (Must They Vote?):**
      1.  **THE SCOPE TEST (3 minutes):**
          *   **Question:** Does this obligation *only* apply to individuals already universally accepted as part of the demos (adult citizens)?
          *   **Good Answer:** Clearly yes. Compulsion shouldn't target a subgroup within the demos.
          *   **Stop/Reject If:** No. (Compulsion targeting only part of the demos is likely invalid).
      2.  **THE FEASIBILITY & FAIRNESS TEST (JUDGMENT) (7 minutes):**
          *   **Question A (Feasibility):** Is the enforcement mechanism **practical, verifiable, and resistant to fraud** for our city's resources?
          *   **Question B (Fairness):** Does the mechanism **avoid creating a disproportionate burden** based on income, race, or other protected status? Is $25 a penalty (burdensome) or a trivial price (ignorable)? Consider alternatives (e.g., opt-out, symbolic rewards).
          *   **Good Answer:** Evidence of workable administration in similar cities & analysis showing burden isn't concentrated on vulnerable groups within the demos.
          *   **Stop/Reject If:** Enforcement is clearly unworkable or demonstrably unfair in impact (e.g., fine harms low-income voters most).
          *   **Value Vote Required?** On Fairness (Question B). Feasibility (A) is more technical.

  4.  **FINAL CHECK: CITY CHARTER & STATE LAW (4 minutes):**
      *   **Question:** Does this proposal clearly violate our City Charter or State Constitution/Statutes?
      *   **Good Answer:** Clerk/Judge cite specific language. If clear conflict, proposal is likely invalid regardless of merit.
      *   **Stop/Reject If:** Clear, unambiguous conflict exists. (If ambiguous, note it but proceed to recommendation).

  **Recommendation:** Based on Steps 1-4, the Commission recommends: Approve / Approve with Modifications / Reject. (Vote if required by steps above).

  ---

  **Running Your Three Proposals:**

  1.  **Votes at 16 (Boundary):**
      *   Step 1: Boundary.
      *   Step 2.1: (PARADOX) Noted. Start with existing demos.
      *   Step 2.2 (Connection): **PASSES.** 16/17-yr-olds have concrete stake (schools, part-time jobs, local laws, future residency).
      *   Step 2.3 (Exclusion Justification - **JUDGMENT**): The key test. Argument *for* exclusion: Presumed lack of maturity/knowledge. Argument *against*: Age is rotating, not a caste; many 16/17-yr-olds work/pay taxes/are affected; exclusion seems arbitrary ("why not 17?"). **This is a VALUES VOTE.** The procedure *forces* this vote without pretending it's solved technically. **Your position (favor) survives if the Commission votes NO, exclusion is *not* justified.** The procedure highlights the core value conflict about maturity.

  2.  **Non-Citizen Resident Voting (Boundary):**
      *   Step 1: Boundary.
      *   Step 2.1: (PARADOX) Noted.
      *   Step 2.2 (Connection): **PASSES.** Long-term residents have direct, concrete stake (taxes, services, laws, kids in schools).
      *   Step 2.3 (Exclusion Justification - **JUDGMENT**): Key test again. Argument *for* exclusion: Citizenship signifies formal allegiance/commitment; voting is a core citizenship right. Argument *against*: Residency (especially 3+ years) demonstrates concrete stake; exclusion based on citizenship status resembles a caste-like exclusion for long-term residents. **VALUES VOTE REQUIRED.** Procedure sinks or swims here on the values vote about the necessity of citizenship for local voting legitimacy.

  3.  **Compulsory Voting (Obligation):**
      *   Step 1: Obligation.
      *   Step 3.1 (Scope): **PASSES.** Applies to all adult citizens (existing demos).
      *   Step 3.2 (Feasibility/Fairness - **JUDGMENT**):
          *   A (Feasibility): Likely **PASSABLE.** Clerk/judge can assess if roll/attendance/fines are manageable.
          *   B (Fairness): **LIKELY FAILS.** $25 fine is clearly a penalty for low-income residents, not a trivial price. It directly burdens the very groups (low-income) that compulsion aims to help via increased turnout, creating a perverse incentive/disproportionate burden. **Your position (against) is supported.** The procedure identifies the fairness flaw.
      *   **Recommendation:** Reject based on failing Step 3.2B (Fairness). No values vote needed if failure is clear.

  ---

  **Where Judgment Hides in Procedure (Steps needing explicit values votes):**
  *   **Boundary:** Step 2.3 (Exclusion Justification) - This *is* the core values question disguised as a "test." The procedure forces a vote here.
  *   **Obligation:** Step 3.2B (Fairness of Enforcement Mechanism) - Assessing disproportionate burden involves value judgments about equity.

  **What This Procedure Cannot Decide (Where You Must Say "No Method"):**
  1.  **The Foundational Paradox (Step 2.1):** It *notes* the circle (who decides the deciders?) but provides *no solution*. You must state: "We start from the existing boundary; we cannot democratically justify the *initial* boundary without circularity."
  2.  **The Core Value Conflict in Boundary Changes (Step 2.3):** The procedure doesn't *resolve* whether maturity, allegiance, or pure stake is the right basis for inclusion. It forces the Commission to *vote* on whether the *exclusion* is justified, making the value judgment explicit and democratic, but not "decided" by reason alone.
  3.  **Defining "Compelling" or "Arbitrary" (Step 2.3):** The Commission must interpret these terms. There's no objective metric.
  4.  **Quantifying "Disproportionate Burden" (Step 3.2B):** How much burden is too much? $25? $50? Requires judgment.
  5.  **The Ultimate Moral Weight of Temporary vs. Permanent Exclusion:** The procedure flags age as a rotating exclusion (Step 2.3 Note) but doesn't decide if that makes it *better*. It simply requires the justification for exclusion to be scrutinized. You must argue in the meeting whether rotation lessens the objection (it might lessen *some* harms like permanent disenfranchisement, but the exclusion itself still needs justification).

  **Why It Works For Your Commission:**
  *   **Theory Embedded:** Circularity, stakeholder principle (limited), burden of justification, feasibility, fairness, and the uniqueness of age are built into the steps/questions.
  *   **Practical:** Asks concrete questions the clerk (feasibility/law), judge (law/fairness), teacher (civic concepts), and residents (practical impact) can engage with.
  *   **Transparent:** Flags paradoxes and forces value votes instead of hiding them.
  *   **Efficient:** Structured flow, clear stop points.
  *   **Runs Without You:** Definitions are embedded; steps are clear; others can facilitate based on the script. The Clerk/Judge handle Step 4, others contribute to Steps 2.2, 2.3, 3.2 based on lived experience/practical sense.
  *   **Handles Your Cases:** Correctly sorts them, surfaces the key conflicts, and doesn't rig outcomes (sank compulsion, left votes-at-16 to a values vote you might win).
