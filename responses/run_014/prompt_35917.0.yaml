prompt: |-
  I've been trying to work out from my gut reactions when everyday conventions are actual moral obligations, and especially when visitors have to follow local ones as opposed to their own. Here's my set of verdicts. Cutting in at the bakery when there's a long queue: not fine, even though nothing in the law says anything about queues. An American dining in the US and leaving no tip: not fine, even though the menu price is technically the "real" price and tipping is officially voluntary. That same tourist tipping a server in Japan: not an obligation at all — I've been told it can even cause embarrassment — so for the visitor the obligation seems to flip with the local convention, whatever it happens to be. Standing on the wrong side of a Tokyo escalator (I've read they stand left there, and in Osaka it's the reverse, which nobody can explain to me): fine, a bit clueless, but I wouldn't call it wrong. A German visitor in Boston at 2am standing at a don't-walk signal with no car in sight while locals stream past: not wrong, just odd — no obligation to break a rule just to fit in. But the same kind of person crossing against the light in Germany while schoolkids look on: wrong, actually wrong, not merely embarrassing. Taking your shoes off in a Japanese home even though at home you never do: obligatory for the visitor. At a market stall in a country where there is no queue, just a general crush of people pushing forward, the visitor who politely hangs back and never gets served is not a sucker, and the locals pushing are not being unfair — so local practice sometimes seems to set what's allowed rather than what's required, but the American in Germany had to respect the light even though plenty of locals cross on amber, which sure looks like the same thing. Also: I think the US tipping system is a bad system, and I still think stiffing the server is wrong — but I'm not sure whether a local who sincerely thinks a convention is unjust is allowed to unilaterally opt out of it, or only to complain while complying.

  So my question: is there a principle that gets all or nearly all of these? The pattern I half see is that conventions bind when they're doing cooperative work like dividing a burden or supporting somebody's livelihood (the queue, the tip) and merely coordinate when they're not (escalator side), but then the traffic-light pair bothers me, because both lights look like pure coordination to me and yet the verdicts come out different. And there's a case I keep going back and forth on, so tell me what the principle says about it: a vegetarian visiting somewhere as a guest where refusing offered meat would be a serious affront to the host — can they decline, or does the local convention override the home one there the way it did with the shoes? If you can't save every verdict, tell me which ones to drop, and please state whatever principle you end up with precisely enough to say what it'd rule on a case I haven't listed. (Also, jsut to be clear, I don't want "when in Rome" as the answer — I already know that one, and I can't get it to match my own verdicts.)
reasoning: |-
  Okay, let me unpack this user's query. They're wrestling with when local conventions become moral obligations for visitors versus when personal or home practices can override them. Their examples are really detailed—bakery queues, tipping in the US vs. Japan, escalator sides, traffic lights, shoe removal in Japan, and refusing meat as a vegetarian guest.  

  First, I notice their frustration with "when in Rome" as too simplistic. They want a principle that explains their nuanced intuitions, especially the tipping/traffic light contradictions. The vegetarian guest dilemma seems to be their litmus test.  

  Hmm... their underlying struggle is about moral weight: when does conformity shift from polite (escalators) to obligatory (tips)? And when can personal ethics trump local norms? They might also be hinting at cultural relativism anxieties—like if rejecting meat makes them complicit in harm versus respecting hospitality.  

  Let me test their cooperative framework against their own cases. Queues and tips clearly distribute burdens/livelihoods—that fits. But why do traffic lights feel different in Germany vs. Boston? Perhaps because the German case involves setting examples for kids (social trust), while Boston at 2am is pure coordination. That’s why their verdicts diverge!  

  For the vegetarian guest, cooperative harm prevention could apply—but only if refusing meat actually damages vital social bonds. If it’s merely awkward, personal ethics might win. The user needs a threshold for "serious affront."  

  Their rejected cases make sense too: escalators lack moral stakes, and crossing empty streets is coordination-only. Perfect.  

  ...Wait, what about markets without queues? Their intuition is spot-on: conventions there define fairness boundaries. Pushing isn’t rude if it’s the norm; hanging back isn’t foolish. The principle holds!  

  Final tweak: emphasize that opting out of "bad" systems (like tipping) requires active dissent, not silent noncompliance. That resolves their guilt about stiffing servers while hating the system.  

  This framework should cover their unnamed cases too. Say, photography bans in sacred spaces: preventing harm (spiritual/cultural) > personal convenience. Versus hat etiquette in churches? Probably cooperative respect.  

  Nailed it.
answer: |-
  Your intuitions are remarkably consistent, and I can extract a principle that captures nearly all your verdicts while resolving the tensions you've identified. Here's the framework:

  **Principle of Cooperative Harm Prevention & Social Trust:**
  *Conventions create moral obligations for visitors when:*
  1.  **They prevent harm (material or social)** or ensure fair burden-sharing in cooperative endeavors; *and*
  2.  **Violation undermines essential social trust** or exploits the system while others comply; *and*
  3.  **The visitor's participation is non-trivial** to the system's function or the potential harm.

  *Conversely, conventions are merely coordinative (and violation is permissible, if potentially clueless) when they lack these elements, especially significant harm prevention or essential trust.*

  **Applying the Principle to Your Cases:**

  1.  **Cutting in line at the bakery: OBLIGATION**
      *   **Harm/Fairness:** Causes direct, tangible harm (others wait longer) and exploits the fairness of the queue system.
      *   **Trust:** Undermines the essential social trust enabling orderly service.
      *   **Participation:** Visitor benefits from the system.

  2.  **American not tipping in US: OBLIGATION**
      *   **Harm/Fairness:** Causes direct material harm (server's livelihood depends on tips) and exploits the system where others tip, subsidizing the employer's low wages.
      *   **Trust:** Undermines the social contract enabling the service industry model.
      *   **Participation:** Visitor benefits from the service *under this specific system*.

  3.  **American tipping in Japan: NO OBLIGATION (Potentially Harmful)**
      *   **Harm:** Can cause social harm/embarrassment (violates norms, implies service is only for money).
      *   **Trust:** Doesn't inherently undermine essential social trust *if done innocently*, but risks misunderstanding.
      *   **Participation:** Not part of the local cooperative system; wages are structured without tipping. *The harm potential makes it actively discouraged, not obligatory.*

  4.  **Wrong escalator side (Tokyo/Osaka): COORDINATIVE (Fine, just clueless)**
      *   **Harm:** Minor inconvenience at most (slight delay, annoyance). No significant material or social harm.
      *   **Trust:** Doesn't significantly undermine essential social structures.
      *   **Participation:** Purely about efficient coordination, not burden-sharing or preventing harm.

  5.  **German at Boston red light (2am, no cars): COORDINATIVE (Fine, just odd)**
      *   **Harm:** No tangible harm (no traffic, locals ignore). Minor potential coordination hiccup is negligible.
      *   **Trust:** No exploitation of others' compliance in this specific instance; no essential trust broken.
      *   **Participation:** The *primary* harm-prevention function (traffic safety) is irrelevant here. It's purely coordinative in this context.

  6.  **German crossing red light in Germany (with kids): OBLIGATION**
      *   **Harm:** Sets a harmful example, undermining traffic safety norms for vulnerable observers (kids). Risk of normalizing dangerous behavior.
      *   **Trust:** Directly undermines the essential social trust in traffic rules that protects everyone, especially children.
      *   **Participation:** As a member of the society (even temporarily visible), their action actively harms the cooperative system.

  7.  **Taking shoes off in Japanese home: OBLIGATION**
      *   **Harm:** Prevents tangible harm (dirt/mess in home) and significant social harm (grave offense/disrespect).
      *   **Trust:** Essential to the host-guest relationship and respect for private space in that culture.
      *   **Participation:** Visitor directly benefits from entering the private space.

  8.  **Visitor hanging back in crush-market: PERMISSIBLE (Not a sucker)**
      *   **Harm/Fairness:** The local convention *defines* fairness here (pushing *is* the queue). Hanging back doesn't harm the system; it just means non-participation. Locals pushing aren't unfair *within their system*.
      *   **Trust:** No exploitation or undermining; the visitor simply opts out of the "queue" mechanism entirely without disrupting it.
      *   **Participation:** Visitor's non-participation doesn't harm the functioning of the local cooperative practice.

  9.  **US Tipping System (Local opting out):** *The principle clarifies the dilemma:*
      *   **Complaining while complying:** Respects the harm prevention/fairness aspect *now* (server gets paid) while working to change the system.
      *   **Unilateral opt-out:** Causes direct harm *now* to an individual (server) who relied on the social contract, exploiting others' compliance. Even if the *system* is bad, stiffing the server doesn't fix it; it just harms a vulnerable participant. Moral obligation remains *until* the system changes. Active protest against the *employer/system* is different from withholding pay from the *worker*.

  **Resolving the Traffic Light Contradiction & Tipping Flip:**
  *   The key is the **context and consequence**. The Boston light (2am, no cars, locals ignore) lacks *harm* and *trust-undermining* in that moment – it's purely coordinative. The German light (with kids watching) introduces *harm potential* (normalizing danger) and *undermines essential trust* – it shifts from coordination to harm prevention. The tipping "flip" occurs because the *harm* aspect reverses: causing financial harm in the US vs. causing social harm/confusion in Japan.

  **The Vegetarian Guest Test Case:**
  *   **Applying the Principle:** Refusing offered meat.
      *   **Harm:** Potential for *significant social harm* (serious affront, damaged relationship) to the host. Minimal physical harm to the guest (discomfort vs. ethical violation).
      *   **Trust:** Violates a core norm of hospitality and reciprocity in that context, potentially undermining essential trust in the guest-host relationship.
      *   **Participation:** The guest is a direct, central participant in the hospitality ritual.
  *   **Verdict:** The local convention overrides the visitor's home practice **if** the affront is truly *serious* and *essential* to the relationship. The obligation stems from preventing severe social harm and maintaining essential trust in a core social interaction. *However:* The strength of the visitor's ethical commitment (e.g., deep religious conviction vs. mild preference) matters. A gentle, early explanation ("I'm deeply honored, but due to a lifelong personal vow, I cannot eat meat") might mitigate harm, while a blunt refusal at the table might cause it.

  **Refined Principle Statement:**
  "Visitors have a moral obligation to follow local conventions when doing so is necessary to prevent significant harm (material or social) or ensure fairness within a cooperative system they benefit from, and when violation would undermine essential social trust or exploit the compliance of others. Conventions serving purely coordinative functions, lacking significant harm potential or essential trust consequences, do not create obligations, though following them is often polite. The strength of the obligation increases with the severity of the preventable harm and the centrality of the convention to essential social trust."

  **Saved Verdicts & Minor Adjustments:**
  This principle saves all your verdicts. It clarifies *why* the traffic light cases differ (contextual harm/trust impact) and resolves the tipping flip (harm direction reverses). It provides a clear answer for the vegetarian guest based on harm severity and trust centrality. The only nuance is recognizing that pure coordination *can* become obligation-laden if violation in a specific context creates harm or undermines trust (like jaywalking in front of kids), which your intuitions already captured perfectly.
