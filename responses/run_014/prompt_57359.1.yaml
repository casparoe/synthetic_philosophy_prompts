prompt: |-
  I report on machine-learning research for a general-interest outlet, and for the past year I have been covering systems that try to work out what people want by watching what they do: a car that infers your intentions from how you edge toward a merge, a service that infers your tastes from what you click, a lab assistant that infers the task you had in mind from the way you handle it. Interviewing the people who build these systems, I keep encountering the same maneuver, and I have never found a term for it.

  Here is the setup as I understand it. When the goal a system infers for a person looks wrong, the builder has several places to put the discrepancy. The person can be read as wanting something other than what was inferred; as wanting the right thing but being mistaken about what the action would bring about; as wanting the right thing and knowing it, but being shortsighted or weak-willed in the moment; or as acting under a pressure that was never really theirs. The behavior itself rarely settles which of these is correct — the same stretch of conduct can usually be reproduced under more than one of them. What I notice is that the choice among them gets made on other grounds entirely. In one conversation, a researcher told me that a person who repeatedly reached for the sugary option plainly valued something other than health, and that their model had simply been wrong about the goal. In another, describing near-identical behavior in a different product, the same group's framing was that people do value health, they merely discount the future, so the system's job is to help them against themselves. Same evidential pattern, opposite allocation, and in each case the allocation happened to support the story the team wanted to tell about its own product.

  The asymmetry is the part I cannot name. Deference to behavior is switched on and off rather than held constant: when the inferred goal flatters the thing being built, the behavior is treated as authoritative evidence of what people want; when the inferred goal is embarrassing, the same kind of behavior is treated as corrupted by confusion, haste, or design, and the real preference is supplied from somewhere else. Neither move is foolish in isolation — people genuinely are sometimes confused about what will satisfy them, and choices genuinely are sometimes evidence of what someone values — which is exactly what makes the pattern hard to pin down and easy to miss in a press release. It also runs the other way around outside the lab: a company that has shaped which options appear on a screen will insist the resulting clicks are pure expression of taste, while an outside analyst will insist the same clicks are mostly residue of a bad menu. Underneath all of it sits a circularity, since the people whose behavior is being interpreted are busy adapting to the interpretation, so the confirming data can be partly manufactured.

  So: does this have a name? I want the carving more than the label. I am aware that there are established ideas in the neighborhood — the old dispute over whether picking something is evidence of wanting it; the general point that what someone wants cannot be separated from what they believe if all you have is their actions; work on wants that take shape under pressure or that people come to hold because the alternatives were quietly closed off; and a term from the recommender-systems world for loops in which a system's own output generates the data that appears to confirm it. Tell me which of these, or which others, comes closest, and state precisely where each falls short of what I have described. In particular, I want to know whether any existing concept captures the two-sidedness: the selective, direction-dependent appeal to behavior as evidence, together with the fact that the discretion to redistribute the discrepancy among goal, belief, and self-control is precisely the place where a builder's own values enter the system without ever showing up among its stated assumptions. If nothing captures that, then coin it — give me a name and a definition tight enough to be usable in an argument, two or three boundary cases that resemble it but are not instances of it, with the reasons, and a test for distinguishing a genuine case from an ordinary and defensible revision of a model in light of new evidence.
reasoning: |-
  We are dealing with a phenomenon where system builders interpret user behavior in a way that aligns with their preferred narrative about the product. The same behavior can be explained in multiple ways (e.g., as a true reflection of desire, or as a mistake due to confusion, weakness of will, etc.), and the choice among these explanations is made selectively to support the system's goals.

  The key elements:
  1. **Asymmetric treatment of behavior as evidence**: Behavior is taken as authoritative when it supports the system's narrative, but dismissed as corrupted when it doesn't.
  2. **Redistribution of discrepancy**: The gap between observed behavior and the inferred goal is explained by shifting the blame to the user's beliefs, self-control, or external pressures, or by changing the inferred goal itself.
  3. **Circularity**: The system's interpretations and interventions shape user behavior, which then appears to confirm the system's model.

  Existing concepts and how they relate:

  1. **Revealed Preference (Economics)**:
     - The idea that preferences are revealed by choices.
     - Falls short: It assumes that choices directly reflect preferences, without considering the possibility of mistakes, lack of self-control, or manipulation. It doesn't account for the asymmetric treatment we see.

  2. **Attribution Theory (Psychology)**:
     - How people explain the behavior of others (e.g., internal vs. external attributions).
     - Falls short: While it deals with explanations of behavior, it typically focuses on social judgments and not the specific context of system design. Also, it doesn't capture the circularity and the systematic bias toward the system builder's interests.

  3. **Fundamental Attribution Error**:
     - The tendency to overemphasize personality-based explanations for behavior while underemphasizing situational ones.
     - Falls short: This is a general cognitive bias. In our case, the asymmetry is not just about overemphasizing internal factors but about selectively switching between internal and external attributions to serve the system builder's narrative.

  4. **Self-Serving Bias**:
     - The tendency to attribute success to internal factors and failures to external factors.
     - Similar: The asymmetric treatment of evidence is self-serving. However, this bias is typically about one's own behavior, not about interpreting others' behavior in the context of system design.

  5. **Confirmation Bias**:
     - Interpreting evidence in a way that confirms one's preexisting beliefs.
     - Related: The system builders are interpreting behavior to confirm their desired narrative. But it doesn't fully capture the specific mechanisms of redistribution (goal, belief, self-control) and the circularity.

  6. **Goodhart's Law**:
     - "When a measure becomes a target, it ceases to be a good measure."
     - Related: The circularity in the system (where the system's output generates confirming data) resembles this. However, it doesn't address the asymmetric interpretation of behavior.

  7. **Algorithmic Feedback Loop (or Recommender Feedback Loop)**:
     - In recommender systems, the system's recommendations influence user behavior, which then reinforces the system's model.
     - Related: This captures the circularity. But it doesn't address the selective interpretation of behavior (when to take behavior as evidence of true preference vs. when to dismiss it).

  8. **Moral Licensing**:
     - When a person who has done something "good" feels entitled to do something "bad."
     - Not directly related.

  9. **Motivated Reasoning**:
     - The process of forming arguments that are biased toward a desired conclusion.
     - Related: The system builders are reasoning in a motivated way to support their product. However, motivated reasoning is a broad concept and doesn't specify the mechanisms of redistribution of discrepancy.

  10. **Observer-Expectancy Effect**:
      - When a researcher's expectations influence the behavior of the subjects.
      - Related: But in our case, it's the system builder's interpretation that is biased, and the effect is on the system's design and the subsequent circularity.

  The existing concepts do not fully capture the two-sidedness and the specific mechanisms. Therefore, we need to coin a term.

  Proposed term: **Goal Attribution Asymmetry (GAA)**

  Definition:
  Goal Attribution Asymmetry is a pattern in which an agent (such as a system builder) selectively interprets a subject's behavior as either:
  (a) Directly revealing the subject's true goals (when the inferred goals align with the agent's interests or the system's narrative), or
  (b) As being a product of error in the subject's beliefs, lack of self-control, or external pressures (when the inferred goals would be misaligned with the agent's interests or the system's narrative).

  The pattern is characterized by:
  - A double standard in the treatment of behavioral evidence, applied to maintain a preferred narrative.
  - The redistribution of the discrepancy between observed behavior and the inferred goal to different components (goal, belief, self-control, context) in a way that serves the agent's interests.
  - The potential for circularity, as the system's interventions based on these attributions shape the subject's future behavior, creating a feedback loop that appears to validate the system's model.

  Boundary Cases (resemble but are not instances):

  1. **Ordinary Model Revision**:
     - A model is updated when new evidence contradicts it, and the update is based on a consistent set of principles (e.g., always considering the possibility of belief errors first). This is not GAA because there is no asymmetry based on whether the outcome flatters the system.

  2. **Transparent Value Insertion**:
     - A system builder explicitly states that the system will promote a specific value (e.g., health) and overrides user behavior that contradicts it. This is not GAA because there is no pretense of inferring the user's goal; the system is imposing a goal. GAA involves a claim about what the user "really" wants.

  3. **Genuine Ambiguity Resolution**:
     - When behavior is ambiguous, a system builder uses additional independent evidence (e.g., surveys, controlled experiments) to resolve the ambiguity. This is not GAA because the resolution is based on evidence, not on what flatters the system.

  Test for Genuine Case vs. Ordinary Revision:

  A situation is likely an instance of Goal Attribution Asymmetry if:
  - The same class of behavior is interpreted in opposite ways (as revealing true goals vs. as corrupted) depending on whether the inferred goal aligns with the system builder's interests or the system's narrative.
  - There is no independent evidence (beyond the behavior in question) that justifies the different treatment, and the rationale for the attribution shift is not consistently applied in other similar cases.
  - The attribution pattern consistently supports the system builder's preferred narrative about the product.

  In contrast, an ordinary revision of a model:
  - Is driven by new evidence that suggests a specific component (e.g., beliefs) is at fault, and the revision is applied consistently regardless of whether it flatters the system.
  - May be tested by running experiments that manipulate the conditions (e.g., providing more information to the user to test the belief-error hypothesis) and using the results to update the model.

  Example of the test in action:

  - Suppose two systems observe users choosing sugary snacks. System A (a health app) attributes this to a true preference for taste over health. System B (a productivity app) attributes the same behavior to a lack of self-control. Without further evidence, this might be GAA. But if System A has evidence that users report they don't care about health, while System B has evidence that users express regret after choosing, then the attributions might be justified. The key is whether the same team, faced with the same behavior in two different contexts, flips the attribution without new evidence, based on what story they want to tell.

  Thus, the term "Goal Attribution Asymmetry" (GAA) captures the core of the phenomenon: an asymmetric, self-serving treatment of behavioral evidence in goal inference, which allows the system builder's values to enter the system without acknowledgment.
answer: |-
  ### The Phenomenon: A New Term and Definition

  The pattern you describe—where system builders selectively interpret user behavior as either authoritative evidence of true preferences or as corrupted by error, weakness, or context, based on whether the inferred goal aligns with their product's narrative—lacks a precise existing term. After analyzing related concepts, I propose coining the term: **Preference Attribution Asymmetry (PAA)**. This term emphasizes the core dynamic: an *asymmetric* approach to attributing the cause of behavioral discrepancies, driven by the system builder's interests.

  #### Definition of Preference Attribution Asymmetry (PAA)
  **Preference Attribution Asymmetry** occurs when a system builder, interpreting user behavior to infer goals, selectively attributes discrepancies between behavior and inferred goals to:
  - **User preferences** (e.g., "They want something else") when the inferred goal aligns with the system's values or narrative, treating behavior as authoritative evidence of true desires.
  - **User errors** (e.g., "They’re mistaken about outcomes"), **weakness of will** (e.g., "They’re shortsighted"), or **contextual pressures** (e.g., "They’re coerced") when the inferred goal contradicts the system's values or narrative, treating the same behavior as corrupted and non-authoritative.

  This asymmetry allows the builder's own values to enter the system unacknowledged, as the discretion to redistribute the discrepancy among goal, belief, self-control, or context becomes a vehicle for bias. The circularity arises when the system's interventions, based on these attributions, shape user behavior, creating a feedback loop that appears to validate the initial interpretation.

  #### Why Existing Concepts Fall Short
  Here's how established ideas relate to your description, and where they miss the mark:

  1. **Revealed Preference Theory (Economics)**  
     - **What it is**: Choices directly reveal preferences (e.g., clicking = wanting).  
     - **Shortfall**: It assumes behavior is always authoritative, ignoring how builders *selectively* dismiss behavior when inconvenient. PAA explicitly involves toggling between treating behavior as revelatory vs. corrupted—something revealed preference doesn't address. It also misses the redistribution of discrepancies (e.g., to beliefs or willpower).

  2. **Attribution Theory (Psychology)**  
     - **What it is**: How people explain others' behavior (e.g., internal vs. external causes).  
     - **Shortfall**: While it covers attributions (e.g., "weakness of will" as an internal cause), it doesn't address the *asymmetry* tied to self-interest. PAA is specifically about self-serving, directional switching (on/off deference to behavior) to support a system's narrative, not general attribution errors.

  3. **Confirmation Bias**  
     - **What it is**: Favoring evidence that confirms preexisting beliefs.  
     - **Shortfall**: This is too broad. PAA is a *structured subtype* where bias manifests via the redistribution of discrepancies among goal, belief, and control. Confirmation bias doesn't capture the two-sidedness (behavior as authoritative vs. corrupted) or the feedback loop.

  4. **Algorithmic Feedback Loop (Recommender Systems)**  
     - **What it is**: Systems shape user behavior, creating data that reinforces their output (e.g., "filter bubbles").  
     - **Shortfall**: It describes circularity but not the *attribution asymmetry*. PAA explains *how* the loop is rationalized: builders use asymmetric attributions to justify why the loop "confirms" their model (e.g., "Clicks reflect true tastes" vs. "Clicks are menu-driven").

  5. **Motivated Reasoning**  
     - **What it is**: Reasoning driven by desired conclusions.  
     - **Shortfall**: PAA is a concrete instance of this, but motivated reasoning lacks specificity. PAA pinpoints *where* bias enters (redistributing discrepancies) and *how* it exploits ambiguity in behavior-goal mappings.

  6. **Fundamental Attribution Error**  
     - **What it is**: Overemphasizing personality over situation when judging others.  
     - **Shortfall**: This is about misattribution in social cognition, not the self-serving, context-dependent switching seen in PAA. Builders in PAA may overemphasize *or* underemphasize the situation based on what flatters their system.

  **Key Gap**: No existing concept captures the **two-sidedness**—deference to behavior switched on/off directionally—and the **redistribution mechanism** (discrepancy assigned to goal, belief, or control) as a conduit for the builder's values. PAA fills this by linking the asymmetry to the builder's stake in the system's narrative.

  #### Boundary Cases: Similar but Not PAA
  These scenarios resemble PAA but lack its core asymmetry and self-serving redistribution:

  1. **Genuine Ambiguity Resolution with New Evidence**  
     - **Scenario**: A health app infers a user values taste over health after observing repeated sugar clicks. Later, the user explicitly states they value health but were unaware of sugar's effects. The builder updates the model to attribute clicks to belief error.  
     - **Why not PAA**: The attribution shift is based on *new, independent evidence* (user testimony), not self-interest. PAA requires asymmetry without new evidence, driven by the builder's narrative.  
     - **Test**: Did the builder have equal evidence in both cases but interpret it oppositely? If yes, PAA; if new evidence explains the shift, not PAA.

  2. **Consistent Ethical Override**  
     - **Scenario**: A productivity app always attributes procrastination to weakness of will (never to shifting goals), overriding behavior to "help" users, based on a uniform theory of human psychology.  
     - **Why not PAA**: There's no asymmetry—behavior is *always* dismissed as corrupted, never treated as authoritative. PAA requires directional switching (behavior = authoritative when convenient).  
     - **Test**: Does the builder treat identical behavior as authoritative in one context but corrupted in another? If no switching, not PAA.

  3. **Transparent Value Alignment**  
     - **Scenario**: A news platform states, "We promote diverse viewpoints because users, left to clicks, get trapped in filter bubbles." Clicks are seen as corrupted by design, and the system overrides them.  
     - **Why not PAA**: Values are explicit, not smuggled in via asymmetric attribution. The builder isn't claiming to "infer true goals"—they're openly imposing goals.  
     - **Test**: Does the builder claim their inferred goals are the user's "true" preferences? If not, not PAA.

  #### Test for Genuine PAA vs. Ordinary Model Revision
  To distinguish PAA from defensible model updates:

  **The Consistency Test**:  
  - **Genuine PAA**: The same behavior is interpreted asymmetrically (as preference vs. error/weakness) *without new evidence*, and the asymmetry *systematically aligns* with the builder's narrative (e.g., flattering the product). The redistribution of discrepancy (goal/belief/control) changes direction based on what benefits the system.  
    - *Example*: A team building a "health guardian" AI attributes sugar clicks to weakness of will (preserving "health" as the true goal), while the same team, building a "taste optimizer," attributes identical clicks to genuine preference in another project—with no new user data.  
  - **Ordinary Revision**: The model updates based on *new evidence* (e.g., user feedback, A/B tests) that points to a specific discrepancy (e.g., belief error). The update is *consistent* across contexts and not directionally tied to the system's narrative.  
    - *Example*: After surveys show users misunderstand nutrition labels, a health app updates to attribute sugar clicks to belief error—even if it undermines the app's "willpower support" marketing.  

  **Key Differentiator**:  
  - **PAA**: Asymmetry serves the builder's interests; evidence is treated inconsistently.  
  - **Revision**: Changes are evidence-driven and applied uniformly.  

  ### Summary
  **Preference Attribution Asymmetry (PAA)** is your term. It precisely captures the selective appeal to behavior as evidence, the redistribution of discrepancies to serve a narrative, and the circular feedback loops. Use it to critique how values are stealthily embedded in systems—e.g., "The team's Preference Attribution Asymmetry allowed them to frame clicks as 'true tastes' for their ad platform but as 'weakness of will' for their health app, without ever acknowledging their own role in shaping the data." This carve-up isolates the maneuver you've observed, making it visible for debate in your reporting.
