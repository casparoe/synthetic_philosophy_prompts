prompt: |-
  I'm about three quarters of the way through a novel and I've hit the wall on the scene I've been dreading and looking forward to in equal measure. Setup, quick, so the drafts make sense: an invented country, call it Karst. Thirty-odd years ago the government relocated a highland minority into "model villages" and took their children to boarding schools where the language was beaten out of them, and a certain number of adults went into the interior ministry and never came out. Karst has changed regime twice since. My prime minister is going to stand up in the parliament and issue a formal apology on behalf of the country for all of it.

  I've written six versions of the speech and my editor says she can't tell which one is supposed to be the good one, and honestly neither can I anymore. They've all gone grey on me. So I need an outside read.

  **A.** "What happened in the highlands happened in a different Karst, under a different flag, by men who are mostly dead. This government did not order it. We inherited it, the way we inherited the roads and the debt. But your grief is real, it is here, and it is in this room, and for the grief we are sorry. We will build a museum on the site of the Vilno school and we will fund the keeping of your language, so that what was taken from your grandparents is given back to your grandchildren."

  **B.** "The state took children from their parents. The state killed some of those parents. There is no context that makes this anything but a crime, and the state that committed it is the state I lead today — same seal, same treasury, same name. We are sorry. We will establish a compensation fund, we will open the files, and we will prosecute where prosecution is still possible. In return — and I use that word deliberately — we ask the families to withdraw the suits now pending, and to accept that this matter is closed, and to forgive, so that Karst can heal."

  **C.** "Mistakes were made. Harm occurred. People suffered in ways that no one should suffer and it is right that we say so here. We regret that this harm occurred. No one alive in this chamber intended it. Let us now turn to the future, which is the only place any of us can still act."

  **D.** "Yes, the state took children. We say it plainly, and we are sorry. But we should also say plainly that in those years nobody's hands were clean. The highland brigades killed too — ask the families of the conscripts at Serratt bridge. Violence belonged to all of us. So let us not sort this country into the guilty and the innocent. Let us apologize to each other, mutually, and be done with it."

  **E.** "Between 1961 and 1974 the state of Karst removed eleven thousand children from their families and placed them in schools where they were forbidden their language, and it detained or killed an unknown number of their parents, and the number is unknown because we destroyed the records that would tell us. I am not going to say the times were different. I am not going to say both sides. I am not going to ask you to forgive us, and I am not going to ask you to let this be closed, because it isn't ours to close. You are entirely within your rights to hear this apology and refuse it, and if you refuse it that will not make you unreasonable and it will not make this speech untrue. Some of you were beaten by men who draw pensions from this building, and I draw a salary from it too. Whatever you tell us to do next, we will do, and I have not come here with a price already set on it."

  **F.** "Before I am prime minister I am a man of sixty-eight who took a job in the ministry in 1969 because it was the only job offered to me, and who signed things without reading them. I have read them now. So I will not stand here and make my country apologize, because my country is a large abstraction and I am not certain it is capable of remorse, and I will not put that word in the mouths of people who were not there. I can only tell you what I did and what I did not do, in my own name, and ask you for nothing at all."

  Here's what I want from you:

  1. Rank all six, most to least adequate *as a state apology* — not best written, not most likely to be popular, but which one a survivor sitting in the gallery could actually receive as an apology and which ones are counterfeits wearing apology clothes. Score each out of 10 on that dimension and give me a sentence or two each on the specific thing it does or fails to do.
  2. Name the failure mode each one is committing. Invent your own labels if you like, but use them consistently, and say which of them you think are fatal versus which are survivable.
  3. Tell me which one I should put in the mouth of my sincere character and which one in the mouth of the cynic — and be aware I might use the same draft for both, depending on how you read it. If one of them works as either, say so and say what flips it.
  4. For whichever you rank first, give me the strongest objection a survivor in the room could still make to it. I don't want this scene to let the apology off easy, and I'd rather find the crack now than have a reviewer find it later.

  I don't need sources or a bibliography, this is a novel and not a dissertation — I just need your judgement, argued for. When you're done, put the final ordering on its own last line in this exact form, e.g. \answer{E > B > F > A > D > C}, using your actual ranking.
reasoning: |-
  Okay, let me tackle this user's problem. They're stuck on writing a crucial apology speech in their novel, with six drafts that all feel "grey." The key is evaluating which apology feels most authentic to a survivor, not which is best written or most politically savvy.

  First, I need to understand the core elements of a genuine state apology. From what I recall, research shows effective apologies need: specific acknowledgment of harm, clear accountability without excuses, remorse, and concrete reparations. The user's fictional context—historical atrocities against the highland minority—adds layers of complexity around generational trauma and state continuity.

  Looking at the drafts:
  - Option E stands out immediately. It names concrete numbers (11,000 children), admits record destruction, and explicitly rejects common dodges like "different times" or "both sides." Most importantly, it centers survivor agency by acknowledging their right to refuse forgiveness. The pension line is brutally honest about ongoing systemic complicity. 
  - Option B is strong runner-up—clear admission of state crime and tangible actions (compensation, prosecutions)—but the transactional "in return" demand for dropped lawsuits undermines it. That's likely fatal for survivors.
  - Option F is fascinatingly personal but fails as a state apology; it's one man's confession, not a national reckoning. Would work beautifully for a different character moment.
  - Option A tries to distance current government ("different Karst") while offering symbolic reparations (museum, language funding). The inheritance metaphor comparing trauma to roads/debt is particularly grating.
  - Option D's "both sides" argument is appalling—equating state violence with resistance. Instant disqualifier.
  - Option C is pure evasion: passive voice, empty regret, rush to "future." Barely an apology at all.

  For the survivor perspective, any hint of quid-pro-quo (B), moral equivalence (D), or vagueness (C) would ring hollow. The strongest objection to E—which I'd rank highest—might be: "You admit pensions fund perpetrators, yet you still draw your salary from that system. Why trust promises now when the structure remains?" That keeps tension alive in the scene.

  For character assignments: E fits a sincere PM wrestling with institutional guilt. B could work for a cynical PM if framed as damage control—the legal waiver exposes realpolitik motives. F would be powerful from a secondary character (maybe a retired bureaucrat?), but not the state's voice.

  Final ranking reflects how each lands for survivors: E's raw honesty > B's substance (despite flaw) > F's personal weight > A's hollow symbolism > D's false equivalence > C's non-apology.
answer: |-
  Here's a breakdown of your apology drafts, evaluated through the lens of a survivor in the gallery needing genuine acknowledgment and accountability:

  ### 1. Ranking & Scoring (as a State Apology to Survivors)
  *   **E (9/10):** Unflinching specificity (11,000 children, destroyed records), rejects excuses ("times were different," "both sides"), centers survivor agency ("refuse it... that will not make you unreasonable"), acknowledges ongoing complicity ("pensions from this building"), offers unconditional action ("whatever you tell us to do"). **Does:** Takes full, ugly responsibility without deflection. **Fails:** Only in not outlining *specific* reparations upfront (though the offer is open-ended).
  *   **B (7/10):** Clear admission ("state took children... state killed... crime"), acknowledges state continuity ("state I lead today"), outlines tangible actions (fund, files, prosecution). **Does:** Names the crimes and commits to concrete steps. **Fails:** Fatally undermines itself with the transactional demand ("in return... withdraw the suits... accept closed... forgive"), turning apology into a coercive bargain. "Heal" feels imposed.
  *   **F (6/10):** Deeply personal, honest about individual complicity ("signed things without reading"), rejects empty national personification. **Does:** Offers raw, individual accountability where state abstraction fails. **Fails:** *Not a state apology.* It's one man's confession. Avoids collective responsibility ("my country... abstraction"), offers no state action, asks for nothing (which feels like abandonment, not repair). Powerful, but not the PM's role *here*.
  *   **A (4/10):** Acknowledges grief ("real, here"), promises symbolic/moderate reparations (museum, language). **Does:** Offers *some* acknowledgment and future-oriented gestures. **Fails:** Deflects state responsibility ("different Karst... different flag... men mostly dead... inherited like roads/debt"). Equating trauma with infrastructure/debt is insulting. "Happened" is passive. "Given back" rings hollow for irreparable loss.
  *   **D (2/10):** Admits core facts ("state took children"), uses "sorry". **Does:** Acknowledges the state's role initially. **Fails:** Commits fatal moral equivalence ("nobody's hands were clean... brigades killed too... violence belonged to all"). "Apologize to each other" equates perpetrator and victim, absolving the state's primary, institutional guilt. "Be done with it" dismisses ongoing pain.
  *   **C (1/10):** Passive voice ("mistakes were made"), vague ("harm occurred"), emphasizes lack of *current* intent. **Does:** Says "regret" and "suffer". **Fails:** Epitome of non-apology. Minimizes, avoids agency, offers no responsibility, no action, rushes to "future" to silence the past. "Mistakes" trivializes atrocity.

  ### 2. Failure Modes
  *   **A: The Historical Distancer.** ("Different Karst, different flag, inherited"). *Survivable?* Barely. The gestures prevent utter failure, but the core deflection makes it fundamentally inadequate for survivors. The inheritance metaphor is toxic.
  *   **B: The Transactional Apologist.** (Apology + Demand for Closure/Quid Pro Quo). *Fatal.* Turns contrition into coercion, demanding survivors sacrifice justice/satisfaction for the state's desire to "heal" (i.e., move on). Destroys sincerity.
  *   **C: The Passive Voice Non-Apology.** ("Mistakes were made"). *Fatal.* Avoids all responsibility, minimizes harm, offers nothing concrete. Pure political evasion.
  *   **D: The False Equivalencer.** ("Nobody's hands were clean"). *Fatal.* Equates state-sponsored cultural genocide/child removal with resistance violence. Absolves the primary perpetrator (the state) by diffusing blame. Deeply offensive to survivors.
  *   **E: The Unconditional Acknowledger.** (Names crimes, rejects excuses, centers survivors, offers action without demand). *Survivable Flaw:* Lacks specific reparations blueprint, relies on survivor direction (which is good) but might feel like passing the buck on *designing* the repair.
  *   **F: The Individual Confessor.** (Replaces state apology with personal accountability). *Survivable Flaw for a Person, Fatal for the State Role:* Profoundly honest on a personal level, but abdicates the *state's* responsibility to speak and act collectively. Offers no institutional repair.

  ### 3. Character Assignment
  *   **Sincere Character: E.** It embodies the necessary courage: naming the horror, accepting the state's continuity of responsibility, rejecting easy outs, prioritizing survivor agency over state convenience. The lack of preset "price" shows sincerity – it's about acknowledgment first.
  *   **Cynic Character: B.** It *sounds* strong initially, but the cynical core is revealed in the demand: "We'll do some things, *but only if you drop the lawsuits and shut up about it forever.*" It's apology as legal strategy and PR, cloaked in strong language. The "heal" is for the state, not the people.
  *   **Works as Either?** **F** could be delivered *sincerely* by a character overwhelmed by personal guilt, genuinely trying to confess but failing to grasp the need for state action. Delivered by the PM *as the state apology*, it would be inherently *cynical* – a way to appear vulnerable while dodging institutional responsibility and offering no concrete repair. The flip is whether it's offered *instead of* a state apology (cynical dodge) or as a *component* alongside a broader state acknowledgment (sincere, but insufficient alone).

  ### 4. Strongest Objection to E (Ranked 1st)
  **Survivor Objection:** "You name the numbers, you admit they destroyed the proof of what they did to our parents, you admit the men who beat us are paid by *this* state, *your* state, *right now*. You say 'whatever you tell us to do'. But you still draw *your* salary from that same treasury funding those pensions. You still sit in that building built on our bones. How can we trust promises from a system that still profits from the crime? What if we tell you to dismantle it? Will the pensions stop? Will *you* resign? Or are your 'unconditional' actions only unconditional *within* the system that caused this?"

  ### Final Order
  \answer{E > B > F > A > D > C}
