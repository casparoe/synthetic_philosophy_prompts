  Therefore, the well-ordering of the real numbers could have order type any ordinal of cardinality 𝔠. However, note that the well-ordering theorem does not specify which one. In fact, it is consistent that there are well-orderings of the reals of order type ω(𝔠) (the initial ordinal) and also of order type ω(𝔠)+1, etc.

