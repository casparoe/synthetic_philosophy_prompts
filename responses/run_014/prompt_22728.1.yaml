  Wait, let me clarify: 
  - The initial ordinal of a cardinal κ is the smallest ordinal α such that |α| = κ.
  - Any well-ordering of a set of cardinality κ is isomorphic to some ordinal β, and we must have |β| = κ. Since α is the smallest such ordinal, we have β ≥ α (in the ordinal sense). But note that β might be much larger than α. For example, consider the ordinal ω+ω: it has the same cardinality as ω (countable), but it is larger than ω. However, in this case, the initial ordinal for the countable cardinality is ω, and any well-ordering of a countable set can have order type any countable ordinal (which is at least ω, but note that ω is the initial ordinal). However, the order type can be any ordinal less than ω₁ (the first uncountable ordinal). So the order type of a well-ordering of a countable set is an ordinal between ω and ω₁ (exclusive of ω₁) and has cardinality ℵ₀.

  But in the case of the reals (cardinality 𝔠), the order type of a well-ordering must be an ordinal of cardinality 𝔠, and the smallest such ordinal is the initial ordinal for 𝔠, which we can denote by ω(𝔠). However, the well-ordering theorem does not specify that the well-ordering must be of the smallest possible order type. In fact, we can have well-orderings of the reals that have order type larger than ω(𝔠) but still of cardinality 𝔠? 

  Actually, no: by definition, the order type of a well-ordering is the unique ordinal that is isomorphic to the well-ordering. The cardinality of that ordinal must be 𝔠. And the set of ordinals of cardinality 𝔠 is exactly the ordinals from ω(𝔠) up to, but not including, the next initial ordinal (which would be the initial ordinal for the next cardinal after 𝔠). However, note that an ordinal of cardinality 𝔠 must be at least ω(𝔠) (by definition of ω(𝔠)) and less than the next cardinal (which would be 𝔠⁺). But the next initial ordinal after ω(𝔠) is the initial ordinal for 𝔠⁺, which is much larger. 

  But there are many ordinals of cardinality 𝔠: for example, ω(𝔠) + 1, ω(𝔠) + ω, ω(𝔠)*2, ω(𝔠)^ω, and so on, as long as they have cardinality 𝔠. However, note that when we well-order a set, we are free to arrange the set in any well-ordering of that cardinality. So the well-ordering of the reals could have order type any ordinal of cardinality 𝔠.

