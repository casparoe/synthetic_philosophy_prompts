  Verdict: Build the paper around "Knowing-how is knowledge-that plus reliable availability under performance constraints." Cut the L2 example and avoid overclaiming—this complements rather than replaces existing accounts. The context-sensitivity is a feature, not a bug, aligning with how we attribute skill.

