  Second, whether distrusting AI for serious matters relies on that metaphor. 
  Third, requests for better analogies - this shows intellectual curiosity beyond just winning an argument.

  The vegan cake example is particularly clever. A true statistical parrot would fail at constraint-based rewriting, but transformers handle this through latent space interpolation. Should explain this without jargon though. Also noting their D&D use case suggests they'd appreciate creative-system analogies like improv troupes.

  Biggest challenge will be balancing: 
  A) Validating their correct observations about the bot's capabilities 
  B) Without overselling to the point of endorsing uncritical trust in high-stakes scenarios. 

  The health/schoolwork distrust point stands regardless of metaphors - must emphasize that's about reliability mechanisms, not intelligence. Maybe compare to why we don't let talented interns perform surgery? 

