answer: |-
  Here are the desiderata for an adequate theory of superrational choice in symmetric games with common knowledge (CK) of rationality and symmetry:

  1.  **Scope & Correctness:**
      *   **Games:** Must deliver the intuitively rational outcome (typically Pareto-superior cooperation) in the **one-shot symmetric Prisoner's Dilemma (PD)**. It must also handle:
          *   **Stag Hunt (SH):** Recommend the Pareto-superior (Stag, Stag) equilibrium as uniquely rational under CK of rationality/symmetry, despite the risk-dominant (Hare, Hare) also being an equilibrium.
          *   **Chicken:** Recommend *a* symmetric outcome (likely (Swerve, Swerve) or cooperation if framed that way), avoiding mutual disaster ((Drive, Drive)).
          *   **Symmetric Battle of the Sexes (BoS):** Resolve the coordination problem uniquely towards *one* of the symmetric pure-strategy equilibria (e.g., both go to Ballet *or* both go to Boxing), justifying why it's uniquely rational under CK/symmetry.
      *   **"Getting it Right":** The output must be a strategy profile *justified by a unique, compelling rational argument* under CK of rationality and symmetry. It cannot merely be a Pareto-superior equilibrium; it must explain *why* agents who know each other to be rational and face identical choices *must* arrive at this profile. Asymmetric variants are primarily tests for robustness; the core theory can focus on strict symmetry.

  2.  **Paradox Resolution:**
      *   **The Regress ("Why not Defect?"):** Dissolve the paradox that if I know you'll cooperate (based on symmetry/CK), then defecting becomes dominant *for me*. The theory must block this regress, showing why mutual cooperation is stable under this reasoning loop.
      *   **The Embedding Problem:** Explain why superrational cooperation is rational *only* with sufficiently similar rational agents under CK/symmetry. It must *not* recommend cooperation against a rock, a simpleton mirroring you, or an agent known to defect regardless – distinguishing correlation based on mutual rationality from brute causation or irrationality.
      *   **Tension with Causal Decision Theory (CDT):** Address the fundamental conflict: CDT dictates choosing actions based only on their *causal* consequences, treating the other's action as fixed. Superrationality requires choosing actions knowing they are *correlated* with the other's identical choice under symmetry. The theory must either reconcile with CDT, show why CDT is misapplied under CK/symmetry, or justify overriding it.
      *   **Non-Symmetric Games:** Explain why the superrational prescription doesn't (or shouldn't) apply directly to asymmetric games without additional justification, avoiding ad-hoc restrictions.

  3.  **Relationship to Classical Game Theory:**
      *   **Preserve:** Existence of Nash equilibria (though it may select among them). Standard results in games lacking symmetry/CK of rationality/symmetry. The concept of individual rationality (optimizing given beliefs).
      *   **Overturn/Revise:** The strict dominance of defection in the one-shot PD *under the specific conditions of CK of rationality and strict symmetry*. The idea that dominance reasoning is always decisive regardless of CK context. The irrelevance of action correlation under rationality in standard CDT.
      *   **Rationale:** The revision stems from properly incorporating the implications of CK of rationality *and* symmetry into the decision problem specification. It argues standard theory neglects the logical dependencies created by this CK.

  4.  **Relationship to Individual Rationality:**
      Superrationality **must be what individual rationality becomes once CK of rationality *and* symmetry are fully and correctly incorporated into the decision problem.** The apparent conflict (e.g., dominance vs. cooperation) is an artifact of an *incompletely specified* problem in the CK/symmetric context. There aren't two modes; there's just rationality applied to the fully specified epistemic-symmetric situation.

  **Key Conflict:** **Uniqueness in Stag Hunt vs. Symmetry.** Desideratum 1 demands a *unique* rational recommendation for Stag Hunt (Pareto-superior Stag). However, Stag Hunt has *two* symmetric pure-strategy Nash equilibria ((Stag,Stag) and (Hare,Hare)). Purely symmetry-based reasoning often struggles to uniquely select one symmetric equilibrium over another if they are both symmetric. A theory might satisfy uniqueness only by introducing a principle beyond symmetry/CK (e.g., Pareto-dominance as a primary rational criterion), potentially weakening the "pure symmetry" argument central to superrationality.

  **Scorecard (Focus on Discriminating Desiderata):**

  *   **Hofstadter (Reflective Equilibrium):** Solves PD uniquely via symmetry/CK reflection. **Fails Stag Hunt** (no unique selection mechanism from symmetry alone). **Fails Regress/Embedding** (vulnerable to "why not defect?", doesn't distinguish rational agents from rocks). **Fails CDT tension** (ignores causality). **Partially satisfies Individual Rationality link** (frames it as correct reasoning).
  *   **Evidential Decision Theory (EDT):** Solves PD (cooperation is good news). **Fails Stag Hunt** (EDT often recommends Hare if P(Other Hare | I Hare) is high enough). **Partially resolves Regress/Embedding** (distinguishes via conditional probabilities: P(Coop | I Coop) high for rational agents, low for rocks). **Fails CDT tension** (embraces acausality, conflicting with CDT). **Satisfies Individual Rationality link** (claims EDT *is* rationality).
  *   **Program Equilibrium (Agents commit to code):** Solves PD uniquely via mutual commitment. **Solves Stag Hunt** (commit to Stag if other commits). **Solves Embedding** (only cooperates with agents running compatible code). **Mitigates Regress** (commitment breaks loop). **Addresses CDT tension** (creates causal dependence via commitment). **Weak on Individual Rationality link** (programs feel like a distinct mechanism, not pure rationality under CK).

  **Most Discriminating Desiderata:** The **Regress/Embedding problems** and the **CDT tension** starkly separate the approaches. Hofstadter ignores them. EDT embraces acausality, failing CDT. Program Equilibrium sidesteps them via commitment mechanisms, not pure reasoning under CK. The **Stag Hunt uniqueness** requirement further separates Hofstadter/EDT (fail) from Program Equilibrium (succeeds). The **Individual Rationality link** requirement challenges Program Equilibrium's mechanism.
