  Top fatal objections: Threshold location problem is probably the worst. If you can't define where the threshold is, the whole theory falls apart. Defenders might say it's a theoretical concept, but that’s weak. Vagueness makes it messy. Next, lexicality arbitrariness. Why does it suddenly become lexical? That seems ad hoc. High-stakes trade-offs might lead to absurdities, like ignoring massive future suffering for minor current pains. That’s bad.

  Serious but maybe not fatal: Aggregation below threshold. Prioritarians would say suffering below threshold should still be prioritized. LTNU treats mild pains the same as mild pleasures in trade-offs, which feels off. Also, empirical paradoxes—like intense suffering that’s just below threshold might be outweighed by huge pleasure, which seems counterintuitive.

