prompt: |-
  I am a high school junior. My uncle, who runs a small bookkeeping firm, offers me an even-money bet every Sunday on a coin he flips from a jar on his desk. After two years of keeping a record, I am fairly confident it comes up heads 55 percent of the time, so I have a small but genuine edge. When I asked a friend how much of my savings to stake, he handed me the following argument, which he says settles the question and also shows that talk of "risk tolerance" is confused. The conclusion disturbs me and I suspect a mistake, but I cannot locate it.

  (1) A decision rule is rational only if applying it repeatedly across a long life maximizes the long-run growth rate of your wealth.
  (2) For any bet at fixed odds with a positive edge, offered again and again, the growth rate is maximized by staking the Kelly fraction of your current bankroll — 10 percent in my Sunday case.
  (3) So I should stake 10 percent every Sunday.
  (4) Neither (1) nor (2) says anything about how I feel about risk; the 10 percent is pure compounding arithmetic, not a preference.
  (5) Since (1) governs every bet I face and (2) governs every bet with a positive edge, the same arithmetic fixes the right stake for one-shot bets as well, such as whether to put my college savings into a venture my mentor rates at 55 percent to double my stake and 45 percent to lose it.
  (6) Hence for each bet there is exactly one rational stake, and someone who stakes less is not being cautious but accepting slower growth for no reason at all.
  (7) Yet my aunt staked well under that fraction on a comparable one-shot bet decades ago and retired comfortably, and people who bet for a living are commonly said to prefer half Kelly because it surrenders only a quarter of the growth while cutting the swings roughly in half.
  (8) Therefore (1) is false: long-run growth rate cannot be the standard of rationality.

  Tell me which premise or step you reject and why, explain what made that step look acceptable when I first read it, and then price the alternatives — what I would have to give up elsewhere to keep the steps I would rather not lose. I should say that I would most like to hold on to (2) and (3), since the arithmetic seems to check out when I run the numbers myself. Please state your bottom line in the first sentence and then give the reasoning, with no preamble and no restatement of the question. Write in American English.
reasoning: |-
  Okay, the user is a high school junior who's been betting with their uncle on a biased coin and has a 55% chance of heads. They've been advised by a friend to use the Kelly Criterion, staking 10% of their bankroll each time for optimal growth. The friend argues this applies to all bets, even one-shot ones, and that deviating from Kelly is irrational. But the user is troubled because their aunt succeeded with less risk, and professional bettors often use half-Kelly to reduce volatility.

  The core issue is applying a long-term growth strategy to single bets. Premise (1) states that rationality requires maximizing long-run growth across repeated bets. But for one-time bets like investing college savings, this doesn't hold because there's no "long run" to recover from losses. The user wants to keep premises (2) and (3) since the math checks out for repeated bets, but premise (1) overextends this logic.

  The user might also be concerned about real-world risk tolerance. Their aunt's success with a smaller stake shows that avoiding ruin can be rational even if it sacrifices some growth. Professionals use half-Kelly because they value stability over maximum growth. So rejecting premise (1) allows for context-dependent decisions without abandoning Kelly for repeated bets.

  The cost of keeping (1) is insisting on 10% for the college bet, risking total loss. But if they lose, there's no chance to recover, which isn't rational. Allowing different stakes for one-time bets preserves Kelly for ongoing opportunities while acknowledging that some risks aren't worth taking once.
answer: |-
  **I reject premise (1): A decision rule is rational only if applying it repeatedly across a long life maximizes the long-run growth rate of your wealth.**

  **Reasoning:**

  1.  **The Problem with Premise (1):** This premise makes long-run growth maximization under repetition the *sole* definition of rationality for *any* decision rule, including those governing one-shot bets. This is too narrow and ignores crucial aspects of real-world decision-making relevant to single bets:
      *   **Risk of Ruin:** In a one-shot bet (like the college savings venture), staking the Kelly fraction (10%) carries a 45% chance of losing *everything* invested. For a high school junior, losing their entire college savings is potentially catastrophic and irreversible within their relevant timeframe – there's no "long run" of identical bets to recover. Rationality often involves avoiding catastrophic losses, even if it means accepting a lower *expected* growth rate.
      *   **Utility of Wealth:** Money has diminishing marginal utility. Losing a large portion of your essential savings (like college funds) causes far more harm than the benefit gained from a proportional win. Premise (1) treats wealth logarithmically (implicit in Kelly maximizing long-run growth), which models this diminishing utility *only under infinite repetition*. For a single bet, explicitly considering the non-linear impact of gains and losses on your overall well-being (utility) is rational.
      *   **Lack of Repetition:** The core justification for Kelly (maximizing long-run growth) vanishes for a true one-shot bet. There is no sequence to compound over. While maximizing expected *log* wealth (the Kelly criterion) is optimal for repeated bets, maximizing expected *linear* wealth might be more relevant for a single bet, or a blend considering risk aversion. Premise (1) incorrectly forces the repeated-bet logic onto fundamentally different scenarios.

  2.  **Why Premise (1) Looked Acceptable:** It seems appealing because:
      *   It leverages the strong mathematical result of Kelly optimization *for repeated bets*.
      *   It promises a single, objective, preference-free rule ("pure compounding arithmetic").
      *   It resonates with the intuition that consistently making good bets should lead to good long-term outcomes.
      *   It appears to eliminate subjective "risk tolerance" as a potential source of irrational inconsistency.

  3.  **Pricing the Alternatives (What You Give Up):**
      *   **Keeping Premise (1):** You must accept that staking 10% of your college savings on the 55/45 venture is the *only* rational choice, despite the 45% risk of financial catastrophe with no recovery mechanism. You dismiss your aunt's success and professional bettors' use of fractional Kelly as irrational "slower growth for no reason," ignoring their valid concerns about ruin and volatility in finite sequences or finite lifetimes. You ignore the differing impact of gains/losses in a one-off scenario.
      *   **Rejecting Premise (1) but Keeping (2) & (3):** You give up the idea of a single, universal, preference-free rule governing *all* bets. You accept that rationality for one-shot bets *does* involve considerations like your ability to absorb the loss (essentially "risk tolerance" related to your overall financial situation and goals), the non-linear utility of money for essential sums, and the lack of repetition. **Crucially, you get to keep the optimality of Kelly (10%) for your repeated Sunday bets with your uncle** – the math for that specific, repeated opportunity is sound. You also preserve the validity of Kelly for other *repeated* positive-edge opportunities. Your aunt's lower stake and pros using half-Kelly become rational adaptations to finite sequences, volatility tolerance, and ruin avoidance, not mathematical errors.

  **Bottom Line:** Premise (1) is false because it incorrectly universalizes a criterion (long-run growth maximization via Kelly) that is specifically optimal *only* for infinitely repeated bets or bets where the bankroll is truly negligible compared to the sequence. Rationality for one-shot bets requires considering the potential for catastrophic loss and the differing marginal utility of money, which premise (1) dismisses. You can (and should) still use 10% for your Sunday coin flips while making a different, potentially much smaller, stake for your one-shot college venture based on your essential need for those funds and the unacceptable risk of losing them entirely.
