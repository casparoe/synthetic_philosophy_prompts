  **Project Title:** The Fragility of Prioritarianism: Testing a Conjecture on Egalitarianism, Priority, and Uncertainty

  **Central Question**

  The central question of this project is: Does prioritarianism, when extended to choices under uncertainty, maintain its claimed advantage over telic egalitarianism in avoiding the leveling-down objection? Specifically, we ask whether both natural extensions of prioritarianism to uncertainty — ex post and ex ante — must violate at least one structural principle that plays a role analogous to the ‘nobody is better off’ condition in the leveling-down objection. The question has three determinate possible answers: (A) Yes, both extensions violate such a principle, so prioritarianism’s advantage is lost in the uncertainty setting; (B) No, at least one extension avoids all such violations, so prioritarianism retains its advantage; or (C) The question is ill-posed because the structural principles in question are inappropriate for evaluating distributive views under uncertainty.

  **Why the Question is Open**

  The question remains open despite extensive discussion of prioritarianism and egalitarianism because the leveling-down objection has been primarily debated in a riskless context. Three deflationary responses might suggest the question is closed or unimportant; I address each in turn.

  First, one might argue that uncertainty is the wrong setting because well-being is only realized, not expected. On this view, the ex ante perspective is irrelevant, and the ex post extension is the only legitimate one. However, if this response is correct, it would not deflate the project but rather focus it: we would then have to confront the ex post extension’s violation of unanimity about prospects (as in the first sketch). The project would show that prioritarianism, in its only defensible form, violates a principle that is arguably as compelling as the one invoked by the leveling-down objection.

  Second, it might be claimed that the choice between ex post and ex ante prioritarianism is already settled by the dynamic-consistency argument, which favours the ex post approach. However, this argument is not universally accepted; some argue that dynamic consistency is an overly demanding constraint in normative contexts. If the dynamic-consistency argument is decisive, then the ex ante extension is ruled out, and the project would focus on whether the ex post extension’s violation of unanimity is a fatal flaw. The project would then become a test of whether the ex post prioritarian can defend violating unanimity without falling prey to a generalized leveling-down objection.

  Third, one might contend that every aggregative distributive view faces trade-offs among structural principles (such as Pareto, dominance, and separability) under uncertainty, so nothing specific follows against prioritarianism. If this is right, the project would shift from targeting prioritarianism to mapping the trade-offs that any such view must make. The distinctiveness of the project would lie in showing that prioritarianism’s trade-off mirrors the structure of the leveling-down objection, thereby challenging the view’s purported superiority over egalitarianism.

  Thus, each deflationary response, if correct, would reshape but not eliminate the project’s significance.

  **Method and Work Plan**

  The method is analytical and theoretical, proceeding in three phases: reconstruction, generalization, and synthesis. The work plan is structured as follows:

  **Months 1-3: Reconstruction and Stability Testing of Initial Sketches**
  - Month 1: Rebuild the ex post prioritarianism example. Explicitly state assumptions: cardinal measurability of well-being, interpersonal comparability, and the square-root transform. Check sensitivity to the transform (e.g., logarithmic or other concave functions) and to the number of people/states. Flag a risk: if the transform is not strictly concave, the result may not hold. Also, is the unanimity violation robust if we allow for different risk attitudes in individuals? (This relates to the unresolved difficulty below.)
  - Month 2: Rebuild the ex ante prioritarianism example. Test whether the statewise dominance violation persists under alternative transforms and prospect structures. A key risk: the example assumes that prioritarian value is additive across persons. If we drop additivity, does the violation vanish? Also, the sketch might underdescribe the dynamic-consistency objection; we will formalize a simple sequential choice scenario to test it.
  - Month 3: Explore a third extension: apply the transform to each person’s risk-adjusted certainty-equivalent. Is this extension principled? We will examine whether it aligns with existing approaches (e.g., Harsanyi-like aggregation) and whether it avoids the violations. Risk: this extension might be ad hoc and lack independent motivation.

  **Months 4-9: Generalization and Formalization**
  - Month 4: Formalize the unresolved difficulty: what it is for a prospect to be better for a person when well-being is risky. We will survey accounts of individual good under uncertainty (e.g., expected utility, rank-dependent, etc.) and ask whether a prioritarian can assume risk-neutrality without begging the question. This is crucial because the leveling-down objection is often framed in terms of what is better/worse for individuals.
  - Months 5-6: Extend the analysis to continuous distributions and heterogeneous populations. Test whether the violations found in the two sketches are artefacts of the discrete two-person, two-state case.
  - Months 7-9: Investigate whether a ‘two-stage’ aggregation (e.g., aggregating across persons state-wise, then across states) offers a principled alternative. We will derive conditions under which such a view avoids the violations and assess its normative plausibility.

  **Months 10-15: Synthesis and Implications**
  - Months 10-12: Compare prioritarianism’s trade-offs with those of telic egalitarianism under uncertainty. Does egalitarianism face analogous or distinct challenges?
  - Months 13-15: Draft papers presenting the core results. One paper on the ex post/ex ante dilemma, another on the generalized leveling-down objection.

  **Month 16-18: Dissemination and Finalization**
  - Month 16: Present findings at a workshop and incorporate feedback.
  - Month 17: Prepare final manuscripts for submission to ethics and social choice journals.
  - Month 18: Write a synthesis report for the fellowship, outlining remaining questions.

  **Intended Results and Deliverables**

  The primary deliverable is a set of two to three journal articles establishing:
  1. That both ex post and ex ante prioritarianism violate a structural principle analogous to the leveling-down objection’s core concern, and that no extension avoids such a violation without introducing new problems.
  2. A generalized framework for evaluating distributive views under uncertainty, highlighting the inescapable trade-offs they face.
  3. A resolution of the difficulty about individual good under risk: we will argue that prioritarianism must either accept a non-standard account of individual good (which may undermine the force of the objection) or face the violations.

  Additionally, we will produce a public working paper by month 9 and present results at two conferences.

  **What Counts as Failure**

  Failure would include:
  - The initial sketches proving unstable: e.g., if the ex post violation disappears under a more realistic model of individual risk attitudes, or if the ex ante violation depends on additivity and vanishes without it.
  - The generalized objection collapsing into a restatement of known impossibility results (e.g., the impossibility of Paretian egalitarianism under uncertainty), thereby adding no new insight.
  - The project revealing that the leveling-down objection is fundamentally misplaced in the uncertainty context, making the entire inquiry moot.

  We will mitigate these risks by documenting negative results and refocusing as needed. Even in failure, the project would yield a clearer map of prioritarianism’s limits.

  **Scope and Ethical Relevance**

  If the project grows too large, we will cut the continuous-distribution extension (Months 5-6) and focus on discrete cases, which are philosophically salient.

  Why ethics rather than social choice? The project is grounded in ethical questions about distributive justice: the leveling-down objection is an ethical argument, and prioritarianism is defended as a theory of fairness. While formal methods are used, the aim is to advance ethical theory by testing a conjecture about the comparative viability of egalitarianism and prioritarianism. Social choice theory provides tools, but the core problem is normative.

  ---

