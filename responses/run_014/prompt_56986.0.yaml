answer: |-
  ### Project Proposal: The Fragility of Prioritarianism Under Uncertainty  

  #### 1. Central Question  
  Does prioritarianism retain its purported advantage over telic egalitarianism—specifically, its claimed immunity to the leveling-down objection—when extended to decision-making under uncertainty? The leveling-down objection holds that a change harming some and benefiting none cannot be an improvement in any respect, which telic egalitarianism allegedly violates by valuing equality intrinsically. Prioritarianism, which sums a concave transformation of individual well-being, is said to escape this objection because it never approves such a change. This project tests the conjecture that prioritarianism’s escape is an artefact of risk-free evaluations and collapses when prospects involve uncertainty. The question admits three determinate answers:  
  - **Yes**, both major extensions of prioritarianism to uncertainty (ex post and ex ante) violate a structural principle analogous to "nobody is better off," nullifying prioritarianism’s advantage.  
  - **No**, at least one extension avoids all such violations, preserving prioritarianism’s superiority.  
  - **Invalid**, the principles violated under uncertainty (e.g., unanimity or statewise dominance) are irrelevant to the leveling-down objection’s core concern.  

  #### 2. Why the Question is Open  
  The leveling-down objection dominates debates about distributive ethics in risk-free contexts, but its application under uncertainty remains unsettled. Three deflationary responses might dismiss the project; here, I address their implications:  

  - **Response 1: Uncertainty is irrelevant because well-being is realized, not expected.**  
    If correct, this would restrict the evaluation to ex post prioritarianism (transforming realized well-being in each state). However, as my first sketch suggests, ex post prioritarianism can violate *ex ante unanimity*—e.g., ranking a prospect lower even when every individual expects higher well-being from it. The project would then shift to showing that this violation parallels leveling-down: a loss for all individuals overall, justified only by the distribution’s shape. The objection would persist in a new form.  

  - **Response 2: The choice between ex post and ex ante prioritarianism is resolved by dynamic consistency arguments.**  
    Dynamic consistency (requiring stable choices over time) may favor ex post prioritarianism. If this response holds, the ex ante extension is untenable, and the project reduces to examining whether ex post prioritarianism’s unanimity violation is defensible. Yet dynamic consistency itself faces criticism in normative ethics for ignoring individual autonomy. The project would survive by challenging whether consistency arguments can override the moral force of unanimity.  

  - **Response 3: All distributive views face trade-offs among structural principles under uncertainty.**  
    If true, prioritarianism’s violations are not unique. Yet this project would reveal that prioritarianism’s trade-off—sacrificing either unanimity or dominance—directly mirrors the leveling-down dilemma. Telic egalitarianism faces similar issues, but prioritarianism’s advocates position it as a superior alternative. Demonstrating that it reproduces egalitarianism’s core problem would reframe the debate.  

  In all cases, the conjecture remains open because no existing work systematically tests whether prioritarianism’s uncertainty extensions relocate, rather than resolve, the leveling-down objection.  

  #### 3. Method and Work Plan  
  The method combines formal modeling, conceptual analysis, and robustness testing. A core unresolved difficulty is defining what makes a prospect better *for an individual* when well-being is risky—and whether prioritarianism can assume risk-neutrality without circularity. If individuals are risk-averse, the unanimity violation in my ex post sketch might not arise, potentially undermining the objection. The work plan proceeds as follows:  

  - **Months 1–2: Reconstruct and test the ex post prioritarianism sketch.**  
    Formalize the two-person, two-state example: safe prospect (each gets 50) vs. risky prospect (each gets 92 or 12 with equal probability). Assume a square-root transform, cardinal well-being, and interpersonal comparability. Verify the expected prioritarian value calculation. Risks: (1) The result may not hold under alternative concave transforms (e.g., logarithmic); (2) If individuals are modeled as risk-averse, their expected well-being may not exceed 50, negating unanimity; (3) Additivity across persons may be questioned. Test these by varying transforms, risk attitudes, and aggregation rules.  

  - **Months 3–4: Reconstruct and test the ex ante prioritarianism sketch.**  
    Formalize the example: safe prospect (each gets 50) vs. risky prospect (each gets 102 or 0). Apply the transform to expected well-being. Check for statewise dominance violations (in every state, the risky prospect has lower aggregate transformed well-being). Risks: (1) The violation may disappear if well-being is non-cardinal or transforms are linear; (2) The sketch assumes equal probabilities—imbalanced states may alter results; (3) The dynamic inconsistency objection (e.g., choice reversal in sequential decisions) needs rigorous modeling.  

  - **Month 5: Investigate a third extension.**  
    Evaluate hybrid approaches: e.g., transforming certainty-equivalents (risk-adjusted expected well-being) or two-stage aggregation (statewise transformation, then expectation). Assess whether these avoid violations or introduce new problems. Key test: Is the approach principled (e.g., derived from axiomatic foundations) or ad hoc?  

  - **Months 6–7: Resolve the individual-good difficulty.**  
    Analyze accounts of "better for a person" under risk: expected utility, stochastic dominance, or non-expected theories (e.g., rank-dependent). Examine whether prioritarianism can coherently assume risk-neutrality. If it cannot, the leveling-down objection may presuppose a contested view of individual good.  

  - **Months 8–10: Generalize beyond initial sketches.**  
    Extend to N persons, continuous distributions, and correlated risks. Test robustness to heterogenous populations (e.g., varying risk attitudes) and non-additive aggregation.  

  - **Months 11–15: Comparative analysis and paper drafting.**  
    Contrast prioritarianism’s trade-offs with telic egalitarianism’s under uncertainty. Draft two journal articles: one on the ex post/ex ante dilemma, another on the generalized leveling-down objection.  

  - **Months 16–18: Dissemination and refinement.**  
    Present at two conferences (e.g., ISUS or AEA), finalize articles, and prepare a synthesis report.  

  #### 4. Intended Results and Deliverables  
  The project will produce:  
  - **Theoretical results:** A proof that both ex post and ex ante prioritarianism violate a principle analogous to leveling-down (unanimity or dominance) under standard assumptions, or a demonstration of a stable third extension.  
  - **Deliverables:** Two publishable papers. Paper 1 establishes the vulnerability of prioritarianism to a generalized leveling-down objection; Paper 2 resolves the "better for a person" problem and its implications for prioritarianism.  
  - **Broader impact:** A framework for evaluating distributive ethics under uncertainty, highlighting trade-offs between equality, priority, and decision-theoretic axioms.  

  #### 5. What Counts as Failure  
  Failure would include:  
  - **Instability of sketches:** If the ex post unanimity violation vanishes under plausible risk aversion, or the ex ante dominance violation relies on additivity, the core conjecture may be unsalvageable.  
  - **Redundancy:** If the objection reduces to a known social choice impossibility (e.g., analogous to Harsanyi’s aggregation theorem conflicts), the project would offer no novel insight.  
  - **Misplaced focus:** If leveling-down is deemed inapplicable to uncertainty, the project would be an inconsequential technical exercise.  
  I will mitigate this by publishing negative results and pivoting to comparative analysis of egalitarianism if prioritarianism proves robust.  

  #### 6. Scope and Ethical Relevance  
  **Scope management:** At month 6, if overextended, I will drop continuous-distribution generalizations (Months 8–10) and focus on discrete cases, which suffice to test the conjecture.  

  **Why ethics, not social choice?** While the tools are mathematical, the *objective* is ethical: to test whether prioritarianism’s moral superiority survives realistic uncertainty. The leveling-down objection is a philosophical argument about fairness, and prioritarianism is a normative theory of distributive justice. Social choice theory informs the analysis, but the project’s value lies in resolving an ethical debate central to egalitarianism and prioritarianism.  

  ---  
  **Word count:** 1,480. This proposal excludes citations per instructions, describes positions/arguments contextually, flags risks in the method section, and adheres to the requested structure.
