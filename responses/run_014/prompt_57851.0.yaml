answer: |-
  ## Teaching Plan: Weakness of Will & Hyperbolic Discounting (50 mins)

  **Level:** First-Year Undergraduates (No Philosophy/Behavioural Econ Background)
  **Central Case:** "The Dissertation Dilemma" (Doctoral Student - Clara)
  **Core Distinction:** Recognising that *time-inconsistent preferences* (hyperbolic discounting) provide a *mechanistic explanation* for apparent *weakness of will* (akrasia).

  **Teaching Sequence & Rationale:**

  1.  **Introduce Clara's Immediate Predicament (5 mins)**
      *   **What:** Present the core event: Clara *sincerely judges* finishing her chapter tonight is best overall (better than streaming), *resolves* to work, yet at 9 pm streams the series *while still agreeing* her earlier judgment was correct.
      *   **Why:** This is intuitive, relatable, and immediately puzzling. It establishes the *phenomenon* to be explained (intention-action gap with sustained judgment) without jargon. Creates cognitive dissonance – "Why would she do that?"
      *   **Avoid:** Introducing terms like "akrasia" or "discounting" yet.

  2.  **Label the Phenomenon: "Weakness of Will" (Akrasia) (5 mins)**
      *   **What:** Pose the question: "What do we call it when someone freely acts against their own better judgment, knowing it at the time?" Introduce the term "Weakness of Will" (Akrasia). Link explicitly to Clara: Her action *seems* weak-willed.
      *   **Why:** Provides a philosophical label for the observed behaviour. Grounds the abstract concept in the concrete case. Sets up the puzzle: *Why* does this happen?
      *   **Misconception Head-off:** *"It's just laziness/lack of care."* Counter: Stress Clara's *sincere judgment* and *resolution*. She *cares* about the dissertation and *wants* to do it, yet fails. Laziness implies lack of desire, which isn't the case here.

  3.  **Reveal the Pattern: Highlight Systematic Delay (5 mins)**
      *   **What:** Expand the case: Over weeks, Clara consistently delays work (choosing smaller, immediate rewards like socialising, streaming, gaming) *until* a deadline looms (e.g., supervisor meeting tomorrow), when she finally works frantically to complete it (choosing the larger, now-imminent reward).
      *   **Why:** Shows this isn't a one-off lapse but a *systematic pattern*. Crucial for moving beyond character flaws ("she's weak") towards a *structural* explanation. Introduces the role of *time* and *proximity* of rewards/costs.
      *   **Misconception Head-off:** *"She just changed her mind later."* Counter: Emphasise she *endorses her earlier judgment at 9 pm*. She doesn't decide streaming *is* better; she just *does it* despite knowing working is better.

  4.  **Introduce Discounting: The Time-Value of Rewards (10 mins)**
      *   **What:** Explain that humans (and economists) value future rewards *less* than immediate ones – we "discount" the future. Use simple analogy: "Would you prefer £100 today or £110 in a year? Most choose today – we discount the future £110." Link to Clara: The *pleasure of streaming NOW* feels much larger *at 9 pm* than the *future benefit* (relief, progress, approval) of finishing the chapter *later that night*.
      *   **Why:** Establishes the fundamental concept underpinning the explanation. Makes sense of the *immediacy* factor in her choices. Prepares for contrasting discounting models.
      *   **Avoid:** Formal utility functions or complex maths. Stick to intuitive "value" and "how much less attractive" the future feels.

  5.  **Contrast Discounting Models: Exponential vs. Hyperbolic (10 mins)**
      *   **What:** Introduce two ways of modelling this discounting:
          *   **Exponential:** Discounts the future at a *constant rate* per unit of time (e.g., 10% per month). Preferences remain *consistent* over time. (Briefly sketch a smooth downward curve).
          *   **Hyperbolic:** Discounts the future *very steeply* in the immediate short-term, but much *less steeply* for the longer-term. Preferences *reverse* as events get closer. (Sketch a steep drop at "now" that flattens out).
      *   **Why:** This is the **core conceptual leap**. Exponential explains *consistent* impatience but *not* Clara's reversals. Hyperbolic *directly explains* her pattern: When the work deadline is weeks away (long delay), its value is heavily discounted vs. immediate fun. When the deadline is *tomorrow* (short delay), its discount is much less, so it wins. At 9 pm, *immediate streaming* beats *delayed chapter completion* (even though the latter is bigger) because the value of "now" is so inflated.
      *   **Misconception Head-off:** *"Hyperbolic discounting IS weakness of will."* Counter: Clarify that HD is a *psychological mechanism* that *explains why* the behaviour characteristic of weakness of will (akrasia) occurs predictably. Weakness of will describes the *phenomenon*, HD describes a *cognitive process causing it*.

  6.  **Apply Hyperbolic Discounting to Clara (5 mins)**
      *   **What:** Walk through Clara's choices using HD:
          *   **Resolution (Afternoon):** Deadline is "far" (tonight). Both rewards are delayed. HD applies low discount to both, so the *larger* reward (chapter benefits) wins. She resolves to work.
          *   **Choice (9 pm):** Streaming is *immediate* (massively inflated value under HD). Chapter benefits are still delayed (heavily discounted). Immediate reward wins despite being smaller/foolish.
          *   **Pattern:** Work only becomes the "larger immediate reward" when the deadline is *imminent* (tomorrow). Then HD favours it.
      *   **Why:** Cements the application. Shows how HD makes sense of *both* the immediate failure *and* the systematic pattern. Provides the explanatory link between mechanism and phenomenon.

  7.  **Check for Understanding (5 mins)**
      *   **Task:** Pose a hypothetical variation: "Imagine Clara uses *exponential* discounting with a constant high rate (very impatient). She still judges work better overall. Would she be likely to (a) Stick to her resolution at 9 pm, or (b) Still stream at 9 pm? *Why*, based on the discounting models?"
      *   **Why:** Forces students to contrast the models. Correct answer is (b) - she would *still* stream, but *not due to preference reversal*. Under exponential discounting, she would consistently value immediate rewards more *at all decision points*. Her *afternoon resolution itself* would be unlikely ("Why work later when I can stream now?"). The key distinction is that HD uniquely predicts the *reversal* between resolution time and choice time, while exponential predicts consistent impatience. If students grasp this contrast, the central distinction has landed.

  8.  **Brief Summary & Open Questions (5 mins)**
      *   Recap: Weakness of will (acting against sustained better judgment) is puzzling. Clara's pattern shows it's systematic. Hyperbolic discounting (steep devaluation of near-future delays) explains *why* this happens predictably: immediate rewards become overwhelmingly attractive relative to slightly delayed ones, causing reversals from prior resolutions.
      *   **Openly Omitted at This Level:**
          *   **Philosophical Debates:** Is true akrasia possible? (e.g., Socrates' view that it's impossible). Moral responsibility implications.
          *   **Neuroeconomic Basis:** Specific brain regions (e.g., limbic system vs. prefrontal cortex).
          *   **Advanced Discounting Maths:** Parameter estimation, alternative functional forms.
          *   **Full Solutions/Commitment Devices:** While mentioning "deadlines force immediacy" hints at this, detailed strategies (e.g., Ulysses pacts) are for another session.
          *   **Alternative Explanations:** Ego depletion, attention bias (beyond mentioning them as complexities to avoid in the case).
          *   **Utility Theory Foundations:** Assumptions about rational choice underlying the discounting models.

  **Essential Features of the "Dissertation Dilemma" Case & Avoided Complications:**

  *   **Essential Features:**
      *   Clear, sustained better judgment ("sincerely judges... better on the whole").
      *   Explicit resolution ("resolves to work").
      *   Action directly contradicts resolution/judgment *while judgment is held* ("watches series while still endorsing").
      *   A *systematic pattern* showing the same preference reversal mechanism applies over time ("pattern... systematically favors smaller immediate reward until larger delayed reward becomes imminent").
      *   Relatable rewards/costs (immediate pleasure vs. delayed but larger benefits like achievement, reduced stress, future opportunities).
  *   **Complications Avoided:**
      *   **Ambiguity of Judgment:** She clearly knows what's better.
      *   **External Coercion:** It's a free choice.
      *   **Changing Values:** Her valuation of the dissertation doesn't change fundamentally.
      *   **Forgetfulness:** She remembers her resolution/judgment.
      *   **Overwhelming Impulse/Addiction:** It's streaming a series, not a crippling addiction (though relatable, it avoids pathologising).
      *   **Lack of Pattern:** The repeated behaviour confirms it's not a fluke but a predictable tendency explained by time-perception.

  By following this sequence, grounded relentlessly in Clara's case, students should move from recognising a common experience (weakness of will), through puzzlement, to understanding a powerful behavioural mechanism (hyperbolic discounting) that explains its systematic occurrence, while being clear on the core distinction and the boundaries of the introductory explanation.
