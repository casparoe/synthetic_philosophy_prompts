  The invented case involves a doctoral student choosing streaming over dissertation work despite prior resolutions. This is perfect—it's relatable, avoids textbook clichés, and demonstrates both immediate gratification and repeated delay patterns. The user likely needs to balance theoretical depth with accessibility for novices, while preventing common misunderstandings about rational choice. 

  Hmm... the toughest part will be linking abstract philosophy (weakness of will) to mathematical discounting models without losing students. Must anchor everything to the doctoral student case. Also, undergrads might conflate "weakness" with laziness or moral failure—need to preempt that when discussing intention-action gaps. 

  Right, structuring the plan: Start with the case to hook interest, then dissect why it's puzzling. Build to Plato/Aristotle after they're invested. Hyperbolic discounting should come last as the explanatory lens. The "check for understanding" must force them to contrast exponential vs. hyperbolic in their own words—perhaps via hypothetical variants of the case. 

  Notable traps to avoid: Don't let them think the student is irrational overall (she endorses her judgment!). Skip neuroeconomics; too advanced. Sidestep debates about free will. Emphasise this is about predictable decision patterns, not character. 

