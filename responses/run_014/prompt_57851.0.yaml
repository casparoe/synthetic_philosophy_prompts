prompt: |-
  I am a teaching assistant assigned to lead a fifty-minute section for first-year undergraduates with no prior background in philosophy or behavioral economics. My topic is weakness of will and its relation to hyperbolic discounting. Do not explain the topic to me directly; instead develop a teaching plan for how I should explain it. The plan must specify the order in which the components have to be introduced and why each step depends on the previous ones, identify a single extended case that will carry the whole explanation and state what features that case must have and what complications it must avoid, map the misconceptions students are likely to bring to the session or to form during it and indicate the precise point in the sequence where each should be headed off, propose a check for understanding that would show the central distinction has landed, and state what should be openly left out at this level. To keep the discussion concrete and to avoid a familiar textbook illustration, center the plan on the following invented case: a doctoral student who sincerely judges that completing her dissertation chapter this evening is better on the whole than streaming a series, resolves to work, yet at 9 p.m. watches the series while still endorsing her earlier judgment, and whose pattern of choices over several weeks systematically favors a smaller immediate reward until a larger delayed reward becomes imminent. Please write your response in British English.
