  They're wrestling with two novel test cases: one involving synthetic signaling without evolutionary history, and another with conserved consumers but shifted producers. Their intuitions are unstable here, which suggests they're genuinely stress-testing their framework. They want a systematic threat assessment covering empirical, conceptual, and intuitive challenges.

  Hmm... I notice they specifically care about:
  - Neuroscience evidence on explanatory practices
  - Whether "normal conditions" become a loophole
