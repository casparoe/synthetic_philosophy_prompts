prompt: |-
  You're a professional philosopher who specializes in deception and the ethics of assertion, so think this through properly — brainstorm the possible rules she could be running before committing to anything, and only then answer. Reply as a numbered list of exactly five items, each one or two sentences, no intro or conclusion.

  Some context: I'm a second-year student taking an ethics course, and we just wrapped a unit on lying vs misleading. My friend Maya from class has verdicts on cases that are weirdly consistent, like she's running some rule I cant pin down, and I want to predict her on new cases before seminar on Thursday. Her track record so far:

  - Her brother flatly denied eating her leftovers; we found the container in his trash an hour later. Verdict: lying, but trivial — "who cares about leftovers."
  - A guy in our seminar, asked if he'd done the reading, said "I've read the first half twice" (true, he never finished it). Verdict: not lying, just misleading, and mild — worst case was looking unprepared in front of fifteen people. She added that "you can always catch a misleader with a follow-up question."
  - Her ex, asked if he'd been texting his old girlfriend, said "my phone was on the charger all night" (true — he was texting her from his laptop). Verdict: not lying, but a genuine betrayal, relationship over.
  - Her coworker blamed a slipped deadline on the client "not getting back to us till Thursday" (true — but the coworker had sat on the draft for a week). Verdict: not lying, but shifty — worse than the seminar guy, not as bad as the ex.
  - Her cousin lied on an insurance form about a prior condition and was never caught. Verdict: lying, seriously wrong.

  The new cases I want predicted: (A) a former manager writes a reference letter for a job he believes the applicant would actually be bad at, including only true sentences ("never missed a deadline in two years," "always the first to volunteer") that together imply she'd thrive — is that as bad as writing outright false praise, or not? (B) two cousins get an ugly hand-knit sweater from their aunt: one says "I love it, I'll wear it constantly" (false), the other says "it's so warm, and it fits perfectly" (all true, implying she loves it) — does Maya rate one worse, and which? (C) a guy who just says "yes, I read it" when a single follow-up question from the professor would expose him — is that milder than the seminar guy's version, worse, or the same?

  Honestly I care less about the specific calls than about the rule behind them — I assume its definately in there somewhere, but her record seems to fit more than one story about what makes deception bad. So the five items should be: (1) the rule she seems to be running, stated in one sentence; (2) the strongest rival rule that fits her record just as well, and where it predicts differently; (3) your best guess on (A), with the reason; (4) your best guesses on (B) and (C), with reasons; (5) the single further case that would best tell the rules apart, and why it discriminates.
reasoning: |-
  Hmm, the user is a second-year ethics student trying to figure out their friend Maya's pattern in judging deception cases. They've provided five examples of Maya's verdicts on lying versus misleading, and now they want predictions on three new cases. But more importantly, they want to uncover the underlying ethical rule Maya is using.

  Looking at Maya's track record: 
  - She called the brother's denial a trivial lie
  - The seminar guy's half-truth was "not lying" and mild
  - The ex's laptop texting was "not lying" but a betrayal
  - The coworker's technically-true excuse was "shifty" but not as bad as the ex
  - The insurance lie was seriously wrong

  The key patterns I notice: 
  Maya clearly distinguishes between lying (false statements) and misleading (technically true but deceptive statements). Her moral judgments seem to weigh both the method of deception and the consequences/harm involved. The trivial leftovers lie was barely wrong, while the insurance lie was serious. But for misleading, severity varies - the seminar case was mild, the coworker moderate, the ex severe despite all being "not lying."

  Now the new cases:
  For (A) the reference letter: This involves selectively true statements that create a false impression. Since no false statements are made, Maya would likely call this misleading, not lying. But the potential harm (someone getting an unsuitable job) could make it serious, like the insurance lie.

  For (B) the sweater cousins: The outright lie ("I love it") would be lying but trivial (like leftovers), while the technically-true praise would be misleading but with low stakes. Maya might see the lie as formally worse but both as minor offenses.

  For (C) the "yes I read it": This is an outright lie, unlike the seminar guy's half-truth. But if a single follow-up would expose it, Maya might see it as reckless or easily discoverable, potentially making it worse than the seminar case.

  The deeper rule seems to be: Lying is inherently worse than misleading, but both can range from trivial to serious based on harm and context. The strongest rival rule might be one focusing solely on harm, ignoring the lying/misleading distinction.

  A discriminating case would be: Someone says "I didn't take your pen" (true - they stole a pencil instead). If Maya focuses on the truth-value, she'd call it misleading and judge based on harm. If she focuses on intent to deceive regardless of truth, she might condemn it similarly to lying.
answer: |-
  1.  Maya's rule: Lying (asserting a known falsehood) is inherently wrong but severity scales with harm and context, while misleading (using strictly true statements to deceive) is less inherently wrong but can be seriously wrong based on harm, betrayal of trust, and ease of discovery via follow-up.
  2.  Strongest rival rule: Deception's wrongness depends solely on the harm caused and the agent's intent to deceive, regardless of whether it involved a false assertion (lying) or a misleading truth; this rival predicts identical judgments on her past cases but would equate equally harmful lying and misleading.
  3.  Prediction for (A): Not lying (only true assertions), but seriously wrong like the ex/cousin cases due to significant potential harm (unsuitable job) and betrayal of professional trust, making it worse than mild misleading but distinct from outright false praise.
  4.  Predictions for (B) and (C): For (B), she rates the outright liar ("I love it") worse as lying (though trivial like leftovers), while the truth-teller is merely misleading (mild, like the seminar guy); for (C), it's lying, significantly worse than the seminar guy's misleading because it forecloses easy discovery via follow-up and directly asserts falsity.
  5.  Discriminating case: "Did you steal my wallet?" answered with "I was in the library all morning" (true, but wallet stolen earlier) causing major harm; Maya's rule calls this misleading but potentially very wrong, while the rival rule judges it identically to a harmful lie ("No, I didn't steal it").
