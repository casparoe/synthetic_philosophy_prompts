answer: |-
  Here’s a joint statement modeling good-faith adversarial collaboration between a Prioritarian (P) and a Telic Egalitarian (TE), structured as requested. It explicitly marks consensus, live disputes, and potential verbal elements.

  ---

  **Joint Statement on Prioritarianism vs. Telic Egalitarianism: Points of Agreement, Disagreement, and Cruxes**

  *Authored and endorsed in good faith by representatives of both viewpoints, acknowledging persistent disagreements while seeking clarity.*

  **I. Agreed Claims: Shared Foundations and Convergences**

  1.  **Formal Structure:** Both views are *consequentialist* and *welfarist*: They evaluate distributive outcomes based solely on the well-being (welfare) of individuals.
  2.  **Rejection of Strict Equality:** Both reject "Strict Egalitarianism" (the view that equality is the *only* intrinsic value). We agree equality alone is insufficient; improving well-being matters.
  3.  **Rejection of Leveling Down as Sufficient:** Both agree that *leveling down* (reducing the well-being of the better-off without improving anyone else's well-being, solely to achieve equality) is **never**, by itself, a sufficient reason for preferring an outcome. Neither view prescribes leveling down as an optimal or obligatory action.
  4.  **Practical Convergence (Often):** In many real-world policy contexts (e.g., progressive taxation funding anti-poverty programs, universal healthcare, education access), P and TE will converge on the same recommendations: policies that both improve the absolute position of the worse-off and reduce inequality. The *motivation* differs, but the *prescription* often aligns.
  5.  **The Leveling Down Objection's Core Insight:** The Leveling Down Objection (LDO) successfully demonstrates that Telic Egalitarianism is committed to the claim that *in one specific respect* (the elimination of inequality), a leveled-down state of affairs (B) is better than an unequal state (A), even when B is *worse* for everyone than A. P takes this as a decisive objection; TE acknowledges this commitment but argues it's outweighed in overall judgment (see disagreements).
  6.  **LDO Does *Not* Show:** The LDO does *not* demonstrate that TE must *favor* leveling down in practice (see 3 & 4). It shows a counterintuitive implication in a narrow pairwise comparison, not a practical prescription.
  7.  **Complexity of Well-Being:** Both agree that well-being is complex, potentially encompassing objective and subjective elements, and that comparisons are difficult but necessary.

  **II. Disagreements: Core Divergences (Stated Neutrally)**

  | Disagreement Area              | Prioritarian (P) Position                                                                                                                                 | Telic Egalitarian (TE) Position                                                                                                                                                                                                                         |
  | :----------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **1. Intrinsic Value of Equality:** | P denies that equality (or inequality) has *any* intrinsic moral value. The *only* intrinsic value relevant to distribution is the well-being of individuals, weighted to give priority to those worse off. | TE affirms that inequality (the fact that some have less well-being than others through no choice or fault of their own) is *intrinsically bad*, independently of its effects on total well-being or other goods. This badness contributes to overall outcome evaluation. |
  | **2. Evaluation of Leveled-Down States (Pairwise):** | P holds that a state (A) where everyone has higher well-being is *strictly better* than an equal state (B) where everyone is worse off (even if B is perfectly equal and A is unequal). There is *no respect* in which B is better. | TE holds that while the equal state (B) in a leveling-down comparison is *worse* than (A) in terms of well-being (and thus overall worse), it is *better* than (A) in one specific respect: it lacks the intrinsic bad of inequality present in (A). |
  | **3. Scope of Priority:**      | P's priority weighting applies *only* to improving the well-being of the worse-off. Reducing inequality among the better-off, without benefiting the worse-off, carries no special weight. | TE holds that *any* reduction in inequality (holding total well-being constant) is intrinsically valuable, *regardless* of the absolute level of those involved. Reducing inequality among the well-off has some intrinsic value, though likely less than reducing severe deprivation. |
  | **4. Source of Disvalue:**     | P locates the disvalue solely in the *low absolute well-being* of individuals. Helping them is prioritized because their gain matters more.              | TE locates additional disvalue in the *relational fact* of inequality itself. Even if individual well-being levels were known, the *gap* between them constitutes an independent bad.                                                               |

  **III. Cruxes: Key Sub-Questions Determining the Dispute**

  1.  **The Intrinsic Badness Crux:**
      *   **Question:** Is the relational state of inequality (between individuals) *itself* intrinsically bad, independently of its effects on total or average well-being, opportunity, desert, or individual welfare levels?
      *   **Relevant Thought Experiment (Common Ground - "Idle Inequality"):** Consider two worlds:
          *   **World A:** Population split into two groups. Group X has well-being 10, Group Y has well-being 5. No interaction, no awareness of the other group, no effects on agency, effort, or future prospects.
          *   **World B:** Identical to World A *except* Group Y's well-being is raised to 10 (total well-being increases).
          *   **World C:** Identical to World A *except* Group X's well-being is lowered to 5 (total well-being decreases, equality achieved).
      *   **P Prediction:** A is worse than B (obviously better). A is better than C (C is disastrously worse). There is *no respect* in which C is better than A. The inequality in A is irrelevant; only the low level of Y matters.
      *   **TE Prediction:** B is best. C is worse than B overall (less well-being) but *better* than A in the specific respect of lacking inequality. A is flawed due to the intrinsic bad of inequality, even if inert.
      *   **Live Dispute?:** **YES.** This is the fundamental, live disagreement. Resolution hinges on deep intuitions about value ontology.

  2.  **The Symmetry Crux:**
      *   **Question:** Does the *direction* of change matter equally? Is reducing a high level to achieve equality symmetric in value to raising a low level to achieve equality (holding total well-being change constant)?
      *   **Relevant Case (Common Ground - "Fixed Sum"):** A fixed sum of resources can be used in one of two ways:
          *   **Option 1:** Raise the worst-off group from 5 to 8.
          *   **Option 2:** Lower the best-off group from 10 to 7 (achieving equality at 7 for all).
      *   **P Prediction:** Option 1 is strictly better. It improves the absolute position of the worst-off. Option 2 harms the better-off without helping the worst-off and is therefore impermissible.
      *   **TE Prediction:** Option 1 is better *overall* (it increases total well-being *and* reduces inequality). However, Option 2 *also* has value *specifically* because it reduces inequality. If the inequality reduction were sufficiently large (e.g., lowering from 100 to 7 vs. raising from 5 to 8) and the intrinsic bad of inequality sufficiently weighted, TE *could* theoretically prefer Option 2 (though most TE find this practically implausible/repugnant and weight the badness of lowering high welfare heavily). The key point is that TE sees *some* value in Option 2's inequality reduction that P fundamentally denies.
      *   **Live Dispute?:** **YES.** Demonstrates the practical divergence potential and TE's commitment to the intrinsic value of eliminating inequality *per se*.

  3.  **The Priority Scope Crux:**
      *   **Question:** Does the moral concern triggered by inequality apply only when the worse-off are absolutely badly off, or does it apply to *any* inequality, even among the very well-off?
      *   **Relevant Case (Common Ground - "Millionaires' Row"):** Two scenarios:
          *   **Scenario Alpha:** Society where the poorest have well-being 100 (very comfortable), the richest have 110.
          *   **Scenario Beta:** Society where the poorest have well-being 100, the richest have 150. (No one below 100).
      *   **P Prediction:** No significant moral difference between Alpha and Beta. No priority concern applies to reducing the inequality in Beta, as the worst-off are very well off. Resources should go to absolute deprivation elsewhere.
      *   **TE Prediction:** Beta is *intrinsically worse* than Alpha because it contains more inequality. While the *weight* of this badness might be small compared to addressing absolute deprivation, and Beta might be easily outweighed, it remains a flaw. If costs were zero, moving from Beta to Alpha would be an improvement.
      *   **Live Dispute?:** **YES.** Highlights TE's commitment to the universality of inequality's intrinsic badness versus P's exclusive focus on the absolute position of the worst-off.

  **IV. Analysis of Verbal/Substantive Elements**

  *   **"Intrinsic Badness":** This is **primarily substantive, not merely verbal.** Both sides agree on the *definition*: a badness inherent in the state of affairs itself, not derived from consequences. The dispute is over *whether such a property exists* in the case of inequality. However, *how* the badness is characterized can have **partly verbal aspects**:
      *   Could TE's "intrinsic badness of inequality" be *re-described* as P's "priority-weighted disvalue of low absolute welfare"? TE says No, because inequality's badness persists even when absolute levels are high (Crux 3) and attaches to the relational gap itself. P argues Yes, claiming TE misattributes concern about low welfare to a non-existent relational property. **This re-description attempt is itself a substantive point of disagreement.** The core question (does the relational state *itself* hold intrinsic disvalue?) remains robustly substantive.
  *   **"Priority":** P uses "priority" specifically for weighting gains to the worse-off. TE might argue their view also gives "priority" to the worse-off in practice due to the *magnitude* of inequality involving them. This **could lead to verbal confusion.** The agreement on formal structure (welfarism) and the disagreements in Section II clarify that P's "priority" is a specific weighting mechanism focused *only* on absolute welfare gains to the worse-off, while TE's intrinsic concern applies to inequality reduction *wherever* it occurs (though often coinciding in effect).

  **V. Clarification on Consensus vs. Dispute**

  *   **Settled:** The formal welfarist framework, the rejection of strict equality and leveling down *as sufficient/prescribed*, the practical convergence in many policy domains, and the *existence* of the LDO as a challenge TE must address are widely acknowledged.
  *   **Live Disputes:** The core disagreements in Section II and the Cruxes represent fundamental, ongoing debates within distributive ethics. There is **no consensus** on whether inequality is intrinsically bad, the evaluation of pairwise leveling-down cases, the scope of concern for inequality, or the resolution of the Cruxes. Proponents on both sides offer sophisticated arguments, and the debate remains active.

  ---
  **Format Notes:** This structure provides clear separation: numbered agreements, a table for precise disagreements, focused cruxes with cases and predictions, and explicit analysis of verbal/substantive elements. Language is kept neutral, attributing positions fairly. The "Live Dispute?" flags explicitly mark contentious areas. The "Common Ground" designation in cruxes ensures the cases are accepted as relevant tests by both sides.
