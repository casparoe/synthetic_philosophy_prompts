prompt: |-
  Hey, I need a hand with something. I'm putting together a workshop on distributive ethics and I want a document that models what good-faith intellectual disagreement actually looks like. Specifically, I want an adversarial-collaboration joint statement between a prioritarian and a telic egalitarian — the kind of egalitarian who thinks inequality is intrinsically bad, not just instrumentally bad. The leveling-down objection is obviously the main flashpoint, but I don't want it to dominate so completely that the document misses other places where they might genuinely converge or diverge.

  The deliverable should be something both could actually sign. So: a numbered list of agreed claims (about the formal structure of each view, about what each view rules out, about practical upshots where they coincide, about what the leveling-down objection does and doesn't show — whatever you think they can honestly share). Then a disagreements table or section where the residual disputes are stated precisely, with each side's position phrased so its own proponents would say "yes, that's what I mean." Then the cruxes: the sub-questions where settling them would actually move someone. And for each crux, if there's a thought experiment, a case, or a kind of evidence both would agree bears on it, lay that out and record what each side predicts or expects.

  One thing I'd especially like you to flag: are there parts of this debate that are partly or wholly verbal? Like, if they cash out "intrinsic badness of inequality" differently, does the disagreement survive that disambiguation or collapse? I want that called out explicitly if it's there.

  And please, throughout, separate what's genuinely settled among people who work on this from what's contested. Don't write as if one side's framing is the consensus when it isn't. If something is a live dispute, say so.

  Format-wise, I'm easy — whatever makes it clearest. Thanks!
