prompt: |-
  Ok so me and a friend have been arguing for weeks about fakes and I want an actual answer about what our whole way of treating originals is secretly assuming. Here's the pattern that set it off. A picture that everybody agrees is a good picture loses almost all of its price the day the attribution gets knocked down a notch: same canvas, same brushwork, nothing physical changes, it just turns out the master designed it and assistants painted it, or that it's by a follower. Now put that next to some other things the same market does. Conservators can strip and replace most of a painting's surface and it stays the original, and cleaning often makes it worth more. Partial authorship is fine and it's graded, fully autograph, partly autograph, studio, follower, and those things still sell. But forgery isn't graded at all: a brilliant fake that fooled experts for forty years, and that's arguably a better painting than the dull little sketch the master actually made, is worth about the price of the frame once it's caught, even though the only thing that changed is what we now believe about who made it. Then there's prints and casts, where there are hundreds of originals, and an impression pulled in the artists lifetime and one pulled from the same plate by the estate thirty years after they died are visually identical and priced worlds apart. And museums fill rooms with casts and facsimiles of things they'll never own, and people get something real out of them. And when an artist destroys or defaces their own work, whatever survives is often worth more than the intact thing ever was. My friend says the lesson is that we value the history, not the object, the unbroken causal chain back to one particular pair of hands. I half buy it but it doesn't fit the restoration case, and it doesn't fit the estate print case either, since both objects have just as much chain as their expensive twins. Also there's a shrine in Japan where they tear the buildings down and rebuild them from scratch every twenty years, on the plot next door, and everyone treats the new one as the shrine itself rather than a copy, which seems to break the whole picture.

  So what theory of value does this cluster of practices presuppose? Reconstruct it as carefully as you can. Then tell me which bits strictly need it and which bits are just things a market happens to do, scarcity and investment and status signalling, that would survive under any theory of value at all. Which rival views does the practice quietly rule out, for instance that the value is simply in the experience of looking at the thing? Is it even internally consistent, given restoration and the estate prints? And if we swapped whatever it presupposes for a straight experience based view, what concretely changes: labelling, prices, insurance, authentication, what museums bother to acquire, and the law, where I'd want to know whether a forger is basically a fraudster or something else entirely, and whether it's ok to destroy a forgery once it's been found out.
reasoning: |-
  Okay, let me try to unpack this user's query. They're in a weeks-long argument with a friend about why the art market values originals so much more than fakes, even when the fakes are visually identical or even superior. The user presented several scenarios: deattribution reducing value drastically despite no physical change, restoration increasing value, partial authorship being acceptable, forgeries becoming worthless once exposed, posthumous prints being less valuable, and the Japanese shrine being rebuilt yet considered the same entity. 

  The user's friend argues that value comes from the unbroken causal chain to the artist's hands, but the user points out contradictions—restoration and estate prints have the same chain but different values. The user wants a coherent theory explaining all these practices and which parts are essential versus market-driven. They also ask about implications for authentication, pricing, museums, and legal treatment of forgers.

  First, I need to identify the core principles. The art market seems to prioritize authenticity, which isn't just about the object but its historical connection to the artist. The shrine example challenges this by showing cultural acceptance of renewal. The user's confusion is understandable; these practices seem inconsistent. 

  Restoration is accepted because it preserves the original material and intent, maintaining the chain of custody. Estate prints might have a weaker link because the artist didn't personally oversee them. Forgeries, however, break the chain entirely by deceit. The shrine's cultural context allows for symbolic continuity, which art doesn't have. 

  The unspoken theory here is "ontological authenticity"—the artwork as a historical event tied to the artist's actions. This explains deattribution (reduced artist involvement) and forgeries (no artist involvement). Restoration fits as it maintains the original artifact. Estate prints are tricky; their lower value might stem from the artist's absence during creation, even if the physical chain exists.

  Market forces like scarcity and status play roles but rely on the authenticity foundation. Without it, prices wouldn't crash for forgeries. An experience-based view would shift focus to aesthetic qualities, making fakes valuable if they provide similar experiences. This would change authentication's role, museum acquisitions (prioritizing quality over provenance), and forgery's legal status—seen as fraud due to misrepresentation, not inherent worthlessness.

  Internal consistency? Mostly yes. Restoration maintains the artifact's continuity. Estate prints might be the exception, but their devaluation could be due to reduced artist participation. The shrine example is culturally specific, not applicable to Western art. 

  To answer thoroughly: the theory combines historical ontology with intentionality. Practices like restoration align by preserving the original object's journey, while forgeries lack both. The market amplifies this through scarcity. Rival views like experientialism are ruled out because identical experiences don't equate in value. Swapping theories would upend the market, authentication, and legal frameworks, treating forgeries as legitimate artworks unless fraudulently sold.
answer: |-
  Here's a rigorous reconstruction of the implicit theory of value underlying these practices, followed by analysis of its components, internal consistency, and implications for alternative models:

  ### The Core Theory: "Ontological Authenticity"
  The art market presupposes that **an artwork's primary value derives from its status as a unique historical event materially connected to a specific creative agent's intentional act.** Key components:
  1.  **Causal Genesis:** Value resides in the object's *unbroken physical chain of causation* originating from the artist's hand/mind at a specific historical moment. The object is a "witness" to that moment.
  2.  **Intentionality:** The object must be the *intended product* of the recognized artist's creative will. It embodies their agency.
  3.  **Singularity:** The artwork is ontologically unique – not just physically, but as a *particular historical occurrence*. Copies (even perfect ones) are distinct events.
  4.  **Provenance as Ontology:** The documented history *constitutes* the object's identity. Changing the attribution changes *what the object fundamentally is*.

  ### Explaining the Cases Within "Ontological Authenticity"
  *   **Deattribution:** Knocking down attribution (Master -> Studio) severs the direct link to the *master's* intentional act at the moment of creation. It becomes a *different kind of artifact* – a product of the workshop system, not the master's unique expression.
  *   **Restoration:** The original material substrate is preserved/cleaned. The causal chain and intentional object remain intact (arguably enhanced). *Intent* focused on preserving the original witness.
  *   **Partial Authorship:** Gradations reflect the *degree* of direct causal connection and intentional input from the recognized artist. "Studio of" implies oversight/design; "Follower" implies stylistic emulation without direct causal link.
  *   **Forgery:** Represents a complete ontological fraud. It has *zero* causal connection to the artist's original act/intention. Its entire history is a fabrication. It's not a "bad" Rembrandt; it's *not a Rembrandt at all*, ontologically. Exposure reveals its true nature as a *different object* (a clever imitation).
  *   **Estate Prints vs. Lifetime Impressions:** The lifetime impression exists as a direct consequence of the artist's *contemporaneous* intention and approval (part of the original creative event chain). The posthumous impression, while physically identical, lacks that *direct* causal link to the artist's live agency. It's a later artifact *derived from* the original.
  *   **Japanese Shrine (Ise Jingu):** This *seems* contradictory but highlights a crucial nuance: **Continuity of Ritual/Intent.** The value resides not in the physical material, but in the *unbroken chain of ritual practice and communal intention* embodied by the rebuilding. The *act of faithful reconstruction according to tradition* *is* the continuity of the shrine's essence. It's a different ontology: **process/ritual** is primary, not **material artifact**.
  *   **Destroyed/Defaced Artwork:** Survivors gain value as *unique, direct witnesses* to a highly significant historical event (the artist's destructive act). Their scarcity and direct causal link to that pivotal moment outweigh the loss of the original whole.

  ### What Strictly Requires "Ontological Authenticity" vs. Market Dynamics
  *   **Requires Ontological Authenticity:**
      *   The catastrophic devaluation of forgeries upon exposure (not just devaluation, but near-worthlessness as *art*).
      *   The fundamental distinction between an "original" (even if restored) and a perfect replica (physical twin).
      *   The premium for lifetime impressions over identical posthumous ones.
      *   The core concept of "attribution" driving value hierarchies (Master > Studio > Follower).
      *   The treatment of provenance as constitutive, not just additive.
  *   **Driven by Market Dynamics (Scarcity, Status, Investment):**
      *   *Specific price levels* within categories (e.g., why one "Studio of Rembrandt" is worth more than another).
      *   The *degree* of devaluation upon deattribution (ontology dictates *that* it drops, market forces dictate *how much*).
      *   The premium for "fully autograph" over "partly autograph" (ontology dictates a difference, market dictates the scale).
      *   Investment speculation and status signaling based on rarity/attribution.

  ### Rival Views Ruled Out
  1.  **Pure Aesthetic Experientialism:** The practice fundamentally rules out the idea that value resides *solely* in the viewer's aesthetic experience. If it did:
      *   A brilliant fake would retain high value after exposure (it provides an identical/better experience).
      *   A lifetime and posthumous print would be valued equally.
      *   Deattribution wouldn't drastically affect value if the visual qualities remained the same.
  2.  **Pure Materialism/Fetishism:** The practice rules out that value resides *only* in the physical matter. If it did:
      *   Restoration (adding new material) would destroy value.
      *   The Japanese Shrine couldn't be "the same" after rebuilding.
      *   Destroyed fragments wouldn't gain value (they have less matter).
  3.  **Pure Labor Theory:** Value isn't proportional to labor input. A master's quick sketch is often worth vastly more than a follower's labor-intensive copy.

  ### Examining Internal Consistency: Restoration & Estate Prints
  *   **Restoration:** Consistent. The aim is to *preserve the original material witness* and its connection to the artist's intention. Adding material is justified only insofar as it *sustains* the original artifact's existence and legibility. It doesn't create a new ontological event; it maintains the old one.
  *   **Estate Prints:** The *weakest* link, but arguably consistent. The key is the *artist's contemporaneous involvement and approval* in the lifetime impression. It's part of the original creative act. The posthumous print, authorized or not, lacks that direct link to the *artist's live agency*. The plate/matrix is a tool; the *impression* is the artwork-event. The estate print is a new event using an old tool. The market distinguishes based on the *temporal proximity of the impression event to the artist's creative intention*.

  ### Consequences of Swapping to a Pure Experience-Based View
  *   **Labelling:** Attribution becomes descriptive (like "Rembrandt-style"), not constitutive. Provenance is historical trivia, not identity-defining.
  *   **Prices:** Value correlates directly with aesthetic quality/impact and rarity. Brilliant fakes retain high value. Lifetime/posthumous prints converge in price. Deattribution causes minor fluctuations based on perceived quality change, not collapse.
  *   **Insurance:** Insures aesthetic/experiential value and rarity, not ontological status. A fake's value wouldn't vanish upon exposure.
  *   **Authentication:** Shifts from determining "truth" (ontology) to assessing *style* and *quality* (aesthetics) and detecting fraud (if misrepresentation occurred for gain). Expertise focuses on connoisseurship of effect, not forensic proof of origin.
  *   **Museum Acquisition:** Focus shifts to acquiring objects offering the *best possible aesthetic/educational experience*, regardless of origin. High-quality replicas, facsimiles, and even exposed-but-brilliant fakes become core collection items. "Originals" hold value only through rarity or unique aesthetic qualities, not inherent ontological status.
  *   **The Law & Forgery:**
      *   **Forgery as Fraud:** Remains illegal *if* sold with the *intent to deceive* for financial gain (fraudulent misrepresentation). The crime is the *lie*, not the creation of the object itself.
      *   **Destruction of Fakes:** No longer justifiable based solely on ontological grounds. If the fake has aesthetic/historical/educational value, destruction could be seen as vandalism. Legal action focuses on punishing the fraud, not erasing the object.
      *   **Forgers:** Primarily fraudsters if they deceive for gain. They might also be viewed as skilled artists producing derivative works (potentially valuable in their own right under this view) who committed fraud by misrepresenting them.

  ### Conclusion
  The current art market operates on a deep-seated belief in **ontological authenticity**: an artwork is a singular historical event, valuable primarily as a direct material trace of a specific creative agent's intention at a specific time. This explains the dramatic effects of attribution changes, the acceptance of restoration, the rejection of forgeries, and the nuances of multiples. While market forces amplify and monetize the resulting scarcity, the core distinction between "original" and "copy" (especially deceptive copy) is fundamentally ontological, not experiential or purely material.

  The Japanese Shrine highlights that different cultures/value systems prioritize different aspects of continuity (ritual vs. material). Switching to an experience-based model wouldn't destroy the art world but would radically reconfigure it: value would reside in the encounter, not the genesis, making museums more experiential, authentication less about "truth," forgeries potentially valuable artworks tainted by fraud, and the very concept of an "original" less sacred. The law would focus solely on fraud, not the ontological crime of the fake's existence.
