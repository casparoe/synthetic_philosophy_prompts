prompt: |-
  I recently committed to giving a fixed share of my income to whatever I judge to be the most effective charities, and the arguments I have had since then keep sliding between three different kinds of complaint without anyone noticing: that my picture of the good is wrong, that my picture of what I owe others is wrong, and that my picture of what I can actually know is wrong. I would like a decision tree for my reading group that sorts the critiques of effective altruism along those lines, so that we stop talking past each other. Every branch node should be a question we can answer without already knowing which critique it leads to, and the first fork should be the one I just described. Underneath it, split as the arguments actually require: on the epistemic side, separate the complaint that we measure the wrong things from the complaint that only measurable things get funded in the first place; on the practical side, separate the attack on earning to give from the attack on the movement's professionalised institutions, and within the first of those separate the objection that a donor's labour is replaceable from the objection about what the donated money ends up funding; on the political side, separate the claim that private giving displaces public provision from the claim that the movement's funding structure quietly decides which questions get researched. Build the tree from the space of answers rather than from a list of critics, and locate the named positions in it afterwards. Leaves should include at least the measurability-bias critique, the institutional critique, the earning-to-give critique, and the displacement critique, each with one sentence on the commitment its defender will find hardest to live with. Flag any pair of leaves the tree cannot separate, note any combination of answers that nobody occupies and whether that is because the view is incoherent, unattractive, or merely unexplored, and say which single answer, if someone gave it, would make the rest of the tree moot. Aim for six to eight leaves. My group can follow the arguments but has not read the primary literature carefully, so keep the nodes in plain language and do not lean on the names of authors or works.
reasoning: |-
  Okay, the user wants a decision tree to sort critiques of effective altruism into three main categories: their picture of the good being wrong, what they owe others being wrong, and what they can know being wrong. The tree needs to have branches based on questions that can be answered without knowing the critique in advance. They also want specific separations within each category and leaves that include certain critiques with a sentence on the hardest commitment for each. Plus, I need to note any indistinguishable leaves, unoccupied combinations, and a single answer that could make the tree moot.

  First, the main fork should be the three types of complaints. Then, for each branch, split as specified. For the epistemic branch (what we can know), split into "measuring wrong things" vs "only funding measurable things". For the practical branch (what we owe others), separate "earning to give" critiques from "professionalized institutions" critiques. Then under "earning to give", split into "donor's labor is replaceable" vs "what the money funds". For the political branch (picture of the good), separate "private giving displaces public provision" from "funding structure decides research questions".

  Leaves need to include measurability-bias, institutional critique, earning-to-give, and displacement critique. Each leaf should have a one-sentence hardest commitment. Also, note any leaves the tree can't separate, unoccupied combinations, and which single answer makes the tree moot.

  I should ensure the nodes are in plain language. The user's group hasn't read primary literature, so avoid jargon and author names. Aim for 6-8 leaves. Let me sketch out the branches.

  Starting with the root question: "Which fundamental disagreement underlies the critique?" with options: Good, Owe, Know.

  For "Know": "Is the main worry that EA focuses too much on measurable outcomes, or that it only considers measurable interventions?" First option leads to measurability-bias (measuring wrong things). Second leads to measurability-only funding.

  For "Owe": "Does the critique target the idea of earning to give, or EA's institutional structure?" If earning to give, then ask "Is the problem that the donor's job might be harmful, or that the money funds questionable causes?" Labor replaceable vs what money funds. Institutional structure leads to institutional critique.

  For "Good": "Is the concern that private charity undermines public action, or that funders control the research agenda?" Displacement vs funding shaping research.

  Now, counting the leaves: 
  1. Measurability-bias (measuring wrong things)
  2. Measurability-only funding
  3. Earning-to-give (labor replaceable)
  4. Earning-to-give (what money funds)
  5. Institutional critique
  6. Displacement critique
  7. Funding shapes research

  That's seven leaves. The user mentioned four specific ones: measurability-bias, institutional, earning-to-give, displacement. Need to include all of these. The earning-to-give has two sub-leaves, so that's covered. Also, funding shaping research is the seventh.

  Are there any indistinguishable pairs? For example, the two measurability critiques might be conflated in arguments, but the tree separates them. The displacement and funding research critiques are distinct. So no overlaps in leaves.

  Unoccupied combinations: Someone might argue that we can't know anything (epistemic) but also that private charity displaces public (political). Is that coherent? If you think we can't measure anything effectively, opposing private charity might still make sense. So not incoherent. But is anyone arguing both? Maybe not, as it's unattractive or unexplored. Similarly, combining epistemic critiques with owing critiques. For example, if you think we can't know, but also that earning to give is wrong. Possible, but unattractive because if we can't know, why focus on earning to give? So some combinations might be unexplored.

  The single answer that makes the tree moot: If someone says "All of the above," meaning they disagree with the fundamental premises of EA entirely. But more precisely, if they reject that we can know what's effective at all (epistemic total skepticism), that could undermine the whole EA approach. So the answer to "Know" that leads to "we can't measure anything reliably" would make other critiques redundant.

  Hardest commitments:
  - Measurability-bias: Accepting that some important goods must be ignored because they're not measurable.
  - Measurability-only: Funding only quantifiable interventions, even if other areas have potential.
  - Labor replaceable: Continuing a job that might be harmful, assuming replaceability.
  - What money funds: Supporting organizations that might cause harm indirectly.
  - Institutional critique: Opposing professionalization that could otherwise improve efficiency.
  - Displacement critique: Withholding charity to avoid reducing state responsibility.
  - Funding shapes research: Allowing funders to set priorities, potentially skewing research.

  Need to phrase these succinctly. Also, ensure each leaf has the required critique.
answer: |-
  Below is a decision tree designed to clarify critiques of effective altruism (EA) by categorizing them into three core disagreements: **your picture of the "good" (what goals matter)**, **your picture of what you "owe" others (your obligations)**, and **your picture of what you "can know" (epistemic limits)**. Each branch is built from the space of possible answers, using plain-language questions that don't require prior knowledge of the critiques. Named positions (e.g., specific critiques) are mapped to the leaves afterward for clarity.

  The tree has **7 leaves**, covering your requested critiques (measurability-bias, institutional, earning-to-give, displacement) and adding three others for logical completeness. It avoids author names or jargon, focusing on argument structures. I'll first present the tree, then annotate key features like overlaps, unoccupied answers, and the "moot" answer.

  ---

  ### **Decision Tree for Critiques of Effective Altruism**
  *Start at the top and answer each question to reach a leaf.*

  1. **Which fundamental disagreement underlies the critique?**  
     - **A: "My picture of the *good* is wrong"** (The goals EA prioritizes are flawed or incomplete) → Go to 2.  
     - **B: "My picture of what I *owe* others is wrong"** (EA misunderstands personal duties or moral trade-offs) → Go to 3.  
     - **C: "My picture of what I *can know* is wrong"** (EA overestimates our ability to identify "effective" actions) → Go to 4.  

  2. **What's the core flaw in EA's vision of the 'good'?**  
     - **A: "Private giving undermines public responsibility"** → **Leaf: Displacement critique**  
       *Hardest commitment:* Advocating for reduced charity to force governments to act, even if it means withholding immediate aid.  
     - **B: "EA funders dictate what problems get attention"** → **Leaf: Funding-shapes-research critique**  
       *Hardest commitment:* Allowing important issues to be overlooked because they don't align with donor interests, to avoid distorting research agendas.  

  3. **What aspect of 'owing' does the critique challenge?**  
     - **A: "Earning to give is morally compromised"** → Go to 5.  
     - **B: "EA's professional institutions are the problem"** → **Leaf: Institutional critique**  
       *Hardest commitment:* Rejecting expertise and coordination in charities, even if it reduces overall impact, to avoid elitism or groupthink.  

  4. **Where does EA's knowledge problem lie?**  
     - **A: "EA measures the *wrong things* (e.g., ignores hard-to-quantify goods)"** → **Leaf: Measurability-bias critique**  
       *Hardest commitment:* Ignoring worthy causes (e.g., art, justice) because they can't be measured, even if they matter deeply.  
     - **B: "EA *only funds* what's measurable, missing valuable unknowns"** → **Leaf: Measurability-only funding critique**  
       *Hardest commitment:* Refusing to fund high-risk/high-reward work (e.g., advocacy, systemic change) because it lacks short-term metrics.  

  5. **Why is earning to give flawed?**  
     - **A: "The donor's job likely causes harm, and others would replace them"** → **Leaf: Replaceable-labor critique**  
       *Hardest commitment:* Quitting a high-paying job even if it risks personal stability, on the assumption someone equally harmful would replace you.  
     - **B: "The donated money funds ineffective or harmful work"** → **Leaf: Money-funds-harm critique**  
       *Hardest commitment:* Withholding donations from top-ranked charities due to unintended consequences (e.g., AI risks), even if they seem effective.  

  ---

  ### **Annotations for Clarity**
  - **Named positions mapped to leaves**:  
    - **Displacement critique**: Leaf 2A (e.g., argues EA lets governments off the hook).  
    - **Institutional critique**: Leaf 3B (e.g., critiques EA's "insider" culture or centralization).  
    - **Earning-to-give critique**: Split into **Replaceable-labor** (Leaf 5A) and **Money-funds-harm** (Leaf 5B).  
    - **Measurability-bias critique**: Leaf 4A (e.g., argues EA undervalues non-quantifiable goods like relationships).  
    - *Additional leaves*: Funding-shapes-research (2B), Measurability-only funding (4B).  

  - **Indistinguishable leaves**: The tree **cannot separate** the *Replaceable-labor critique* (5A) from the *Money-funds-harm critique* (5B) if someone argues both apply simultaneously to "earning to give." These often blend in practice (e.g., "Your tech job fuels inequality AND your donations fund bad actors").  

  - **Unoccupied combinations**:  
    - **Answer path C → A → A/B**: If someone rejects EA's *epistemology* (C) but then critiques the *good* (A), it's logically coherent (e.g., "We can't measure anything, AND your goals are wrong"), but it's **unattractive/unexplored**—critics usually focus on one axis.  
    - **Answer path B → A → [both 5A and 5B]**: While one earning-to-give critique is common, arguing *both* labor replaceability AND harmful funding simultaneously is **rare but coherent** (no prominent examples).  

  - **Single answer that moots the tree**: If someone answers **C ("can know")** and argues **we cannot reliably measure *any* impact**, it invalidates EA's core method, making other debates (e.g., "good" or "owe") secondary. This would lead to a new leaf: "Total epistemic skepticism," but it's omitted here as your group focuses on practical critiques.  

  ### **Why This Works for Your Group**  
  - **Stops talking past each other**: By forcing agreement on the *type* of disagreement first (good/owe/know), the tree exposes when debaters are on different planes (e.g., one argues ethics while another argues feasibility).  
  - **Balances depth and simplicity**: 7 leaves cover major critiques without overwhelming non-experts. Forks use everyday language (e.g., "undermines public responsibility" vs. "dictates research").  
  - **Highlights trade-offs**: Each leaf's "hardest commitment" shows the real-world cost of a critique, fostering empathy.  

  If your group needs adjustments (e.g., collapsing leaves or adding examples), I can refine this further!
