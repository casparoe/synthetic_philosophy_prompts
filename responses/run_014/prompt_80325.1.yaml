  But humans are different. Predicting chess moves through physics would require simulating atoms - computationally impossible. The design stance (if we consider evolutionary biology) gives some compression but still leaves vast behavioral gaps. The intentional stance compresses remarkably: "Alice wants to win and believes moving her rook creates checkmate" predicts complex behavior efficiently. 

