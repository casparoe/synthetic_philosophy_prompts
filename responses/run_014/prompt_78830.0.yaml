  ## Sestina for the Last Seminar: Qualia & Coffee

  The seminar drone dissects the case again:  
  Chase insists the taste is not the **same**,  
  That something in the blend itself has **changed**,  
  Some quality he calls **immediate**—  
  Not recalled, but *here*, stark and **intrinsic**.  
  Sanborn shrugs; the flavour’s just too **private**  
  To confirm. He feels his own response is **changed**,  
  Though the taste, he swears, remains the **same**  
  Profile hitting altered nerves. **Immediate**?  
  Yes, but meaningless. What’s truly **intrinsic**  
  Lies beyond report, forever **ineffable**,  
  Locked within a skull, profoundly **private**.  

  But how to parse this claim that’s so **private**,  
  This core sensation Chase insists has **changed**?  
  Is it substance, or just noise, **ineffable**  
  Because unsayable, or because no **same**  
  Thing persists? Is the **immediate**  
  Grasp itself the proof of the **intrinsic**,  

  Or just the trap? If all we have’s **intrinsic**  
  Feeling, known only to the one, **private**,  
  How does Chase *know* the past taste **changed**?  
  His memory’s present, equally **immediate**  
  Now. Sanborn holds the stimulus is **same**,  
  Its core untouched, though words are **ineffable**.  

  We chase the ghostly, call it **ineffable**,  
  Demand it be both known and **intrinsic**,  
  Directly grasped, yet wholly **private**,  
  Insist it must be now, **immediate**.  
  But Chase cries “**Changed**!” while Sanborn, “**Same**!”  
  Our terms strain, meanings subtly **changed**  

  By the demand. Has the *concept* **changed**?  
  The marks assigned—**ineffable**, **private**,  
  **Immediate**, **intrinsic**—feel deranged,  
  Collapsing on themselves. Was it ever **same**  
  For any two? The dream seems **intrinsic**  
  To thought, yet vanishes, **immediate**  

  Only as a fading spark. **Immediate**  
  Yet hidden? **Intrinsic** yet **changed**  
  By attention? **Same** for none? **Private**  
  To the point of void? The **ineffable**  
  Crumbles the structure meant to hold it. **Same**  
  Or different? The question seems **intrinsic**,  

  O seminar, this dialectic’s grim.  
  Is the **immediate private**? Can the **same**  
  Stay **intrinsic** when all grounds have **changed**?

  ---

  **Note on Philosophical Liberties:**  
  The poem leans into the instability generated by bundling the traditional "marks" of qualia (ineffable, intrinsic, private, directly apprehensible/immediate). It presents the Chase/Sanborn case not merely as a puzzle about taste but as exposing a potential incoherence *within* the qualia concept itself: how can something be simultaneously directly known (*immediate*) yet fundamentally unreportable and unverifiable (*private*, *ineffable*)? How can we assert *sameness* or *change* (*same*, *changed*) in an *intrinsic* property accessible only privately? The verse suggests the vocabulary, under pressure, loses its adjudicative power. It implicitly accepts the common reading of the case but pushes towards the conclusion that the *posited entity* (qualia defined by these bundled properties) might be untenable, without necessarily denying the raw datum of subjective experience itself. The "proves too much" worry lingers in the weariness – does rejecting this *specific* posit threaten our grip on phenomenality altogether?
