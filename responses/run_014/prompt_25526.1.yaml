prompt: |-
  I'm a PhD student in political science and I sit on my department's graduate admissions committee. We currently decide admissions by having each member read a file and vote "admit" or "reject," with simple majority determining the outcome. Two committee members are now pushing to replace this with a weighted-scoring system: each applicant gets numerical ratings on several dimensions (research promise, writing, fit, etc.), each reviewer weights those dimensions by self-assessed expertise, and a weighted sum produces a final score. They argue that a binary vote discards information and falsely assumes all voters are equally competent. The other side invokes the Condorcet jury theorem: if each of us is more likely than not to judge an applicant correctly, majority rule maximizes the probability of a correct decision, and adding weights could make things worse if we misjudge our own expertise. The chair has asked me to draft a short memo for the committee recommending a concrete course of action — keep majority vote, adopt the weighted system, or propose a third option — with reasons that engage the Condorcet jury theorem seriously, including an honest assessment of whether its assumptions hold in our context and a fair treatment of the strongest argument on the losing side.
reasoning: |-
  Okay, let me approach this as a political science PhD student tasked with drafting a balanced memo on admissions voting reform. The core tension is between traditional majority voting and a proposed weighted-scoring system, with the Condorcet jury theorem as the central theoretical framework.

  First, I need to unpack the Condorcet jury theorem's relevance. It states that if each voter has >50% accuracy and votes independently, majority decisions approach infallibility as the group grows. But in admissions, "correctness" is ambiguous - we're making comparative judgments without objective ground truth. The independence assumption may also be compromised by shared disciplinary norms.

  The pro-weighting arguments have merit: binary votes discard granular information, and equal weighting seems unrealistic when reviewers have varied expertise. But the self-assigned weights are problematic - cognitive psychology shows people overestimate their judgment accuracy, especially in weak areas.

  Looking for alternatives, I consider how to retain Condorcet's strengths while addressing information loss. Modified voting systems like Borda count could preserve independence while using rankings. Or a hybrid approach: use scores for initial screening but final majority votes on borderline cases. The key is mitigating the risks of self-assessment without discarding expertise differentiation entirely.

  For the memo structure, I'll need to: present the Condorcet logic fairly but highlight where admissions decisions deviate from its assumptions; acknowledge the strongest pro-weighting argument (information loss); then propose a third-way solution that incorporates scoring but with safeguards against inflated self-ratings. The recommendation should feel practical for committee operations while grounded in social choice theory.
answer: |-
  ## Memorandum: Reforming Graduate Admissions Voting Procedures

  **To:** Department Admissions Committee  
  **From:** [Your Name], PhD Student & Committee Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Voting System: Balancing Expertise, Information, and Collective Judgment  

  The debate between retaining simple majority vote and adopting a weighted-scoring system hinges critically on the applicability of the **Condorcet Jury Theorem (CJT)** and the nature of our decision-making context. After careful consideration, I recommend a **hybrid approach** that leverages the strengths of both systems while mitigating their weaknesses.  

  ### 1. Engaging the Condorcet Jury Theorem (CJT)  
  CJT provides a powerful argument for majority voting:  
  * **Thesis:** If (a) each voter has independent judgment, (b) each voter's probability of being "correct" (*p*) exceeds 50%, and (c) voters share a common understanding of "correctness," majority rule maximizes the probability of a correct collective decision. Larger committees amplify this effect.  
  * **Strengths:** CJT elegantly justifies equal voting weight. It avoids the peril of self-assigned expertise weights, which could degrade accuracy if self-assessments are inflated.  

  **Honest Assessment of CJT Assumptions in Our Context:**  
  * **Independent Judgment:** **Largely holds.** While we share disciplinary norms, individual file reviews are conducted separately.  
  * **p > 50% ("Better than Coin Flip"):** **Uncertain and variable.** "Correctness" in admissions is ambiguous. We lack objective benchmarks to measure individual voter accuracy. Expertise varies significantly across subfields (e.g., a theorist judging formal modeling potential vs. an area specialist judging regional fit). *Crucially, CJT collapses if some members are systematically worse than random (p<50%) on specific files.*  
  * **Common "Correct" Outcome:** **Problematic.** Admissions decisions involve value trade-offs (e.g., raw brilliance vs. fit, methodological rigor vs. topical relevance). What constitutes the "correct" decision is often contested, not a shared binary truth.  

  **Conclusion on CJT:** While CJT offers a compelling theoretical foundation, its core assumptions—particularly the knowable *p>50%* and a single "correct" outcome—are **highly idealized for our subjective, multi-dimensional admissions task**. Blind reliance on majority rule risks undervaluing differential expertise.  

  ### 2. Strongest Argument for Weighted Scoring (and Its Weakness)  
  * **Proponents' Strongest Case:** Binary votes discard rich information inherent in multi-dimensional assessments. Equal voting weight ignores real differences in committee members' expertise relevant to specific applicants (e.g., a methodologist's score on technical skills should carry more weight than a non-specialist's). Weighting aims to use *all* information optimally.  
  * **Critical Weakness:** The system relies entirely on **self-assigned expertise weights**. Extensive research (e.g., Kruger & Dunning effect) shows individuals are often poor judges of their own competence, especially in weak areas. Misweighting could systematically distort scores, potentially *worse* than equal weights. It also adds significant complexity and opacity.  

  ### 3. Recommendation: A Hybrid Approach (Modified Score Threshold with Majority Validation)  
  I propose a **third option** combining scoring's informational richness with CJT's collective wisdom and a guard against flawed self-weights:  

  1.  **Structured Multi-Dimensional Scoring:** Each reviewer scores applicants on clearly defined dimensions (Research Promise, Writing, Fit, Letters, GPA/GRE) on a scale (e.g., 1-5).  
  2.  **Collective Calibration (No Self-Weighting):** Instead of self-weights, **the full committee agrees in advance on fixed weights** for each dimension based on program priorities (e.g., Research: 40%; Writing: 25%; Fit: 20%; Letters: 10%; GPA/GRE: 5%). This pools judgment on priorities, eliminating individual self-assessment bias.  
  3.  **Calculate Weighted Sum:** Compute a single aggregate score per applicant using the agreed weights.  
  4.  **Majority Vote Thresholding:**  
      *   Applicants with aggregate scores **above a high pre-set threshold** are **automatically admitted**.  
      *   Applicants **below a low pre-set threshold** are **automatically rejected**.  
      *   Applicants **in the middle band** ("borderline") are **decided by a simple majority vote** after committee discussion.  

  **Why This Hybrid Approach?**  
  *   **Captures Information:** Uses granular assessment data more fully than binary votes.  
  *   **Addresses Expertise (Without Self-Bias):** Fixed weights reflect *collective agreement* on priorities, not potentially flawed *individual* self-ratings. Expertise is still utilized implicitly in scoring dimensions.  
  *   **Honors CJT's Core Insight for Uncertainty:** For borderline cases where scores are ambiguous predictors of "correctness," majority voting leverages CJT's logic to maximize the chance of a sound collective judgment under uncertainty.  
  *   **Efficiency:** Automates clear-cut decisions, focusing committee deliberation where it's most needed.  
  *   **Transparency & Fairness:** Fixed, known weights and clear thresholds are more defensible than opaque self-weighting or pure discretion.  

  ### 4. Addressing the Losing Sides Fairly  
  *   **To Majority Vote Proponents:** Pure majority voting, while elegant, wastes valuable information in our detailed assessments and ignores legitimate differences in evaluator focus. The hybrid system *preserves majority voting* for the cases where CJT's logic is most relevant—the uncertain borderline decisions.  
  *   **To Weighted Scoring Proponents:** Self-assigned weights introduce an unacceptable risk of bias and error. The hybrid system captures the *informational* benefit of scoring and *acknowledges differential priorities* through fixed weights, but grounds the most critical, uncertain decisions in equal-weight collective judgment, avoiding the pitfalls of self-assessment.  

  ### Conclusion  
  Neither pure majority voting nor self-weighted scoring is optimal given the complexities of PhD admissions. The hybrid approach leverages structured information and collective prioritization for efficiency on clear cases, while reserving CJT's strength—majority rule under uncertainty—for the difficult decisions where it matters most. This balances informational richness, the reality of differential expertise, and the power of collective judgment, while mitigating key weaknesses of the pure systems. I recommend we pilot this hybrid model for the upcoming admissions cycle.  

  **Recommended Action:**  
  1.  Draft and agree upon scoring dimensions and fixed weights.  
  2.  Set preliminary high/low score thresholds (refinable after pilot).  
  3.  Proceed with scoring all applicants.  
  4.  Hold a committee meeting for majority votes on borderline files.
