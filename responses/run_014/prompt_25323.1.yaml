  Below is a complete workshop design focused on making participants experience the tensions in algorithmic fairness impossibility theorems. I'll use a **loan approval scenario** with group-based base rate differences, structured to force tradeoffs between fairness definitions. The activity uses a guided discovery approach.

  ---

  ### **1. Scenario & Materials**
  **Scenario:** Loan approvals for two demographic groups (Group A and Group B).  
  - **Group A:** 100 applicants, 80% repayment rate (80 repay, 20 default).  
  - **Group B:** 100 applicants, 50% repayment rate (50 repay, 50 default).  

  **Predictor:** A "risk score" (0–100) generated by an ML model, calibrated within each group (e.g., a score of 70 means 70% chance of repayment *for that group*).  

  **Materials (handout or spreadsheet):**  
  ```markdown
  | Applicant | Group | Risk Score | True Outcome (Repay?) |
  |-----------|-------|------------|-----------------------|
  | 1         | A     | 82         | Yes                   |
  | 2         | A     | 63         | No                    |
  | ...       | ...   | ...        | ...                   |
  | 101       | B     | 71         | Yes                   |
  | 102       | B     | 54         | No                    |
  | ...       | ...   | ...        | ...                   |
  ```
  - **Precomputed data for 200 applicants** (50% from each group), with scores mirroring base rates.  
    - *Example distribution:*  
      - Group A: Scores for "repay" clustered around 70–100, "default" around 30–60.  
      - Group B: "Repay" and "default" scores overlap significantly (e.g., 40–80).  
  - **Profit rules:**  
    - Approve + repay: **+$100**  
    - Approve + default: **–$500**  
    - Reject: **$0**  

  **Format:** Printed worksheets + spreadsheets (e.g., Google Sheets) for calculations. Include calculators or formulas for confusion matrices.

  ---

  ### **2. Rules & Structure**
  - **Groups:** 4–5 teams of 3–4 people each (mix roles: engineers, data scientists, philosophers).  
  - **Time allocation:**  
    - Intro (10 min)  
    - Activity Part 1–3 (45 min)  
    - Debrief (35 min)  
  - **Phases:**  
    1. **Unconstrained optimization** (10 min): Maximize profit.  
    2. **Round 1:** Enforce **Statistical Parity** (equal approval rates) (10 min).  
    3. **Round 2:** Enforce **Equal Opportunity** (equal true positive rates) (10 min).  
    4. **Round 3:** Enforce **both** (15 min).  

  ---

  ### **3. Sequence of Prompts & Constraints**
  **Intro (10 min):**  
  - *Context:* "You’re a loan officer using an AI risk score. Your goal is a fair, profitable approval system."  
  - *Task 1 (Unconstrained):* "Set a **single risk threshold** (e.g., approve if score ≥ 60) to maximize profit. Calculate:  
    - Total profit  
    - Approval rates for Group A vs. B  
    - % of repayments approved (true positive rate, TPR) per group."  

  **Round 1: Statistical Parity (10 min):**  
  - *Constraint:* "Equal approval rates for Group A and B. Adjust thresholds *by group* to achieve this while maximizing profit."  
  - *Prompt:* "What happens to profit and repayment rates? Is calibration (risk score = actual repayment prob) still true?"  

  **Round 2: Equal Opportunity (10 min):**  
  - *Constraint:* "Equal TPR (equal % of 'repayers' approved) for both groups. Adjust thresholds."  
  - *Prompt:* "Can you maintain equal approval rates? What breaks now?"  

  **Round 3: Both Constraints (15 min):**  
  - *Constraint:* "Achieve **both** equal approval rates and equal TPR."  
  - *Prompt:* "Is this possible without making profit plummet? Why or why not?"  

  ---

  ### **4. Debrief (35 min): Mapping to Theory**
  **Guided discussion:**  
  1. **Share results:** Teams report outcomes from each round.  
     - *Typical findings:*  
       - Unconstrained: Higher approval for Group A (higher base rate), higher profit.  
       - Statistical Parity: Lower threshold for Group B → more defaults, profit drops. Calibration broken (e.g., 60 score in B repays <60%).  
       - Equal Opportunity: Group B needs lower threshold → approval imbalance returns.  
       - Both: Impossible without absurd thresholds (e.g., approve all in B, none in A).  

  2. **Map to fairness criteria:**  
     - **Statistical Parity:** Equal selection rate → breaks calibration.  
     - **Equal Opportunity:** Equal TPR → breaks approval parity.  
     - **Impossibility Theorem (Kleinberg/Chouldechova):**  
       > "With different base rates, you can’t satisfy all three:  
       > 1. **Calibration:** Scores reflect true repayment prob.  
       > 2. **Equalized Odds:** Equal TPR *and* equal FPR across groups.  
       > 3. **Balance:** Similar scores → similar outcomes."  

  3. **Key insight:** "Fairness" requires choosing *which* bias to prioritize (e.g., equality of outcome vs. error rates). No "fair" algorithm exists—only tradeoffs.  

  ---

  ### **5. Predictable Challenges & Mitigation**
  - **"One expert spoils discovery":**  
    - Assign them as facilitators. If they dominate, say: "Help your team *calculate*, not theorize."  
  - **"We need more features!":**  
    - Respond: "Assume this is the best data available. Work with what you have."  
  - **"The data is biased!":**  
    - Acknowledge: "True! But today, we’re studying how *even with unbiased scores*, base rates force tradeoffs."  
  - **Stuck on thresholds:**  
    - Provide a "threshold calculator" (spreadsheet) to automate confusion matrices.  

  ---

  ### **6. Limitations of the Activity**
  - **Proofs not covered:** The activity shows *tension*, not formal proof.  
  - **No feedback loops:** Real-world decisions alter future data (e.g., denying loans → less credit history).  
  - **Simplified groups:** Real groups aren’t binary or homogeneous.  
  - **Calibration assumption:** IRL, models are rarely perfectly calibrated.  

  ---

  ### **Why This Works**
  - Participants **feel** the frustration: "Every 'fair' fix breaks something else."  
  - It reveals the impossibility theorem as a **practical dilemma**, not an abstraction.  
  - Engineers leave understanding that "fairness by checklist" is impossible—context matters.  

  > "Fairness is not a math problem with a solution. It’s a social problem with tradeoffs."  
  > — Workshop closing line

