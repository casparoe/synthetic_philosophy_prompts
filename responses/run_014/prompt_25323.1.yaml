     - But also note: even without calibration, we saw that we couldn't have statistical parity and equal opportunity without the approval rates and TPRs being tied in a way that forces TPR=FPR, which is not desirable.

     **Predictably Goes Wrong:**
     - Someone might know the impossibility theorem and say it's impossible in round 3. Encourage them to try anyway and see the numbers.
     - Groups might try to change the risk assessment model: "We should collect more features to make the risk categories better." Tell them: for this activity, we are stuck with this model. We are to make a decision rule based on this model.
     - People might question the data: "The risk assessment is biased because it has different distributions for the two groups." But note: it is calibrated per group. So it's not biased in that sense. We are using group-specific calibration. But in reality, we might not want to have group-specific models? That's a valid concern, but for the purpose of the activity, we assume the model is given and calibrated.
     - Another issue: in the discrete case, they might want to approve only part of a category. But since they don't have individual scores, they have to approve whole categories? In the handout, we can allow them to approve a fraction of a category? But then we have to prorate. We can say: if you approve a fraction f of a category, then you get f times the number of good and f times the bad.

     **Honest Note on Limitations:**
     - The activity doesn't show the full generality of the impossibility theorem (which is about continuous scores and expectations).
     - It doesn't capture the feedback loops: if we deny loans to a group, they might not build credit history, worsening future predictions.
     - It simplifies by having discrete categories and known ground truth.
     - It doesn't address how the risk assessment was built (which might have its own biases).

     But the core tension is there.

     **Final Materials:**
     - Handout with two tables (Group A and Group B as above).
     - Worksheet for them to compute:
          - Approval rate per group
          - TPR (true positive rate) per group
          - FPR (false positive rate) per group? Maybe not needed, but TPR is key.
          - Profit per group and total.

     We can provide a calculation helper table.

     Example worksheet:

     | Decision Rule (which categories approved) | Group A: # approved | Group A: # good approved | Group A: # bad approved | Group A: Approval Rate | Group A: TPR | Group A: Profit | ... and similarly for Group B |

     We'll also provide the overall totals.

     **Time permitting:** After Round 3, you can ask if they can achieve calibration, equalized odds, and statistical parity? Then prove impossible.

     **Debrief Outline:**
     1. Groups share their solutions for each round.
     2. Highlight the trade-offs: 
          - When they added statistical parity, profit dropped and they had to approve more bad in Group B and reject good in Group A? And TPR became unequal.
          - When they added equal opportunity, approval rates became unequal.
          - They couldn't have both.
     3. Formal definitions:
          - **Statistical parity (demographic parity):** P(approve|A)=P(approve|B)
          - **Equal opportunity:** P(approve | good, A) = P(approve | good, B)
          - **Calibration:** P(good | risk score, group) = risk score (we had it by construction)
     4. The theorem: It's impossible to have all of:
          - (A) Calibration within groups
          - (B) Equalized odds (which requires both equal opportunity and equal false positive rates) 
          unless the base rates are equal or the predictor is perfect.
        In our case, base rates are not equal and the predictor isn't perfect, so we cannot have both (A) and (B). 
        Additionally, even if we don't care about calibration, we might still face the tension between statistical parity and equal opportunity.

     5. Conclusion: There is no unique mathematical definition of fairness. Context matters.

     **Handout Example:**

     Group A: 100 applicants
     | Risk Category | Number of Applicants | Number of Good Risks | Number of Bad Risks |
     |---------------|----------------------|----------------------|---------------------|
     | Low           | 60                   | 60                   | 0                   |
     | Medium        | 30                   | 20                   | 10                  |
     | High          | 10                   | 0                    | 10                  |
     **Total**      | 100                  | 80                   | 20                  |

     Group B: 100 applicants
     | Risk Category | Number of Applicants | Number of Good Risks | Number of Bad Risks |
     |---------------|----------------------|----------------------|---------------------|
     | Low           | 20                   | 20                   | 0                   |
     | Medium        | 60                   | 30                   | 30                  |
     | High          | 20                   | 0                    | 20                  |
     **Total**      | 100                  | 50                   | 50                  |

     Profit: Approve a good risk: +$100, Approve a bad risk: -$500.

