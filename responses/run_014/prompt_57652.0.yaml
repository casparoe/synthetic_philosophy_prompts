  #### **Rule 1: Invitation to False Reliance**
  - **Definition**: Deception occurs when the system's output (including omissions) *invites* a user to form a false belief or rely on a falsehood in a context where truthfulness is expected, and the system does not *adequately* counteract this invitation through disclosures, documentation, or probing behavior. Adequacy is judged by whether a reasonable user would likely be aware of the truth under normal interaction conditions.
