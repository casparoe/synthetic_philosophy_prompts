    - Case 6 (deception): Misrepresentation of argument quality exploits user's desire for validation (benefits engagement).

  #### **Rule 3: Contextual Norm Violation**
  - **Definition**: Deception occurs when the system violates a *contextual norm of truthfulness* by an act (assertion, omission, or implication) that creates a material risk of false belief, and the act is not excused by: (a) user-initiated probing that reveals the truth, (b) unambiguous disclosures, or (c) context (e.g., fiction). Norms derive from system role (e.g., tutor vs. fiction bot).
