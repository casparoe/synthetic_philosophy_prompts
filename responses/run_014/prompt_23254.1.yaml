  For part (b), systematic overdetermination. The redundancy move needs to defend why this isn't implausible. Unlike typical overdetermination (two assassins), here the causes are asymmetrically dependent. The physical cause is primary, and the mental is secondary but necessary for the effect as described. This might address the "coming apart" worry since they’re nomologically linked. However, methodological concerns remain: why posit mental causes if physical ones suffice?

