prompt: |-
  ok im kinda drowning in hot takes about when a bunch of parts actually make a whole thing and I want the spec before more theories. can you lay out the desiderata for a decent answer to when some things compose something else, like good enough I could use it for everyday counting without getting laughed at by a biologist or physicist?

  give me a list where each item says what the theory has to deliver and why that counts as neccesary, not just a slogan. it should at least cover: what to do with ordinary lumps like chairs and rocks vs weird ones like my half-assembled bookshelf in the garage, two coins glued together vs just stacked, a transplanted heart that keeps beating in a new body, all the plastic floating in the ocean, and a wave that keeps its shape while the water moves through it. plus how to handle vague edges and change over time, like when teh thing loses parts or gains them and is it still the same whole.

  also tell me which distinctions a theory cant collapse, like existing vs just being convenient to count as one, and touching vs stuck together vs working together as a system, and being a heap vs being an integrated organism vs being totally scattered.

  then flag which requirements you think are non-negotiable and which are just prejudices from one camp, and point out any pair you suspect cant both be satisfied at once. and say which single requirement knocks out the most simple views, like the always-compose, never-compose, and sometimes-compose families. keep most of the weight on the criteria and why they matter, the scoring can be super brief.
reasoning: |-
  Okay, the user is drowning in philosophical debates about when parts compose a whole and wants a solid set of criteria to judge theories. They need practical, defensible principles for everyday use that won't embarrass them in front of scientists. 

  Hmm, their examples reveal key pressure points: half-built furniture challenges assembly requirements, glued vs stacked coins test bonding vs functional unity, transplanted organs probe functional persistence, ocean plastic examines arbitrary collections, and waves highlight dynamic patterns. Plus they want clarity on vagueness (like Ship of Theseus cases) and strict boundaries between existence/convenience, contact/integration, heaps/organisms. 

  First, I should map core tensions: "always compose" flunks basic reality checks (no random object piles), while "never compose" ignores chairs and hearts. "Sometimes compose" needs rigorous rules to avoid arbitrariness. The real landmines are: functionality vs physical bonding (glued vs functional coins), pattern persistence vs part replacement (waves vs organs), and whether systems must be "goal-directed" (biased toward biology). 

  Non-negotiables emerge: coherence (no logical disasters), empirical adequacy (must align with science), and avoiding "magical thinking" (composition can't depend on human whims). The trickiest trade-off is functional unity vs physical connection - glued coins pass bonding but fail function, while a transplanted heart does the opposite. 

  Biggest knockout punch? Empirical adequacy: it shreds "always compose" (quantum foam isn't a chair), "never compose" (denies surgeons successful transplants), and vague "sometimes" theories that can't specify conditions. 

  User's hidden need? Probably decision fatigue from overthinking mundane categorization. They want permission to say "this glued coin pair is one object until pried apart" without physics shame, while acknowledging a kidney in ice isn't part of a system yet. The framework should validate both intuition and precision where it counts.
answer: |-
  Here's a breakdown of desiderata for a theory of composition ("when parts make a whole"), focusing on necessary criteria, why they matter, and key distinctions. Non-negotiables and tensions are flagged.

  **Core Desiderata (What the Theory Must Deliver & Why Necessary):**

  1.  **Ordinary Objects Must Exist:**
      *   **Deliver:** The theory must consistently count ordinary, stable, cohesive objects like chairs, rocks, cats, and cars as single wholes composed of their parts.
      *   **Why Necessary:** Without this, the theory fails its primary purpose – explaining our basic interaction with the world. Denying chairs exist is pragmatically absurd and empirically inadequate (biology/physics *do* study organisms/complex systems).
      *   **Example:** A chair's legs, seat, and back compose *the chair*.

  2.  **Reject Arbitrary Sums:**
      *   **Deliver:** The theory must NOT count every arbitrary collection of disparate objects as a single whole (e.g., your left shoe + the Eiffel Tower + a random quark in Andromeda).
      *   **Why Necessary:** Counting arbitrary sums makes "whole objects" meaningless for science or daily life; it leads to infinite overlapping objects everywhere, violating empirical adequacy and coherence. Biologists study cats, not "cat + Saturn's ring".
      *   **Example:** The plastic floating in the ocean *as a whole* ("The Great Pacific Garbage Patch") should *not* automatically be considered a single object like a chair, unless further criteria are met.

  3.  **Handle Partial Assembly/Disassembly:**
      *   **Deliver:** The theory must explain the status of objects in flux: Is your half-assembled bookshelf *one thing* yet? Is a car missing a wheel still *that car*? When does composition begin/cease during assembly/disassembly?
      *   **Why Necessary:** Reality involves processes. A theory ignoring temporal stages and vagueness can't handle genesis, destruction, or repair. Ignoring this leads to paradoxes (e.g., Ship of Theseus).
      *   **Example:** Your half-assembled bookshelf likely *isn't* a functional bookshelf yet, but the parts laid out *with assembly intent* might have a different status than random wood scraps.

  4.  **Distinguish Cohesion Levels:**
      *   **Deliver:** The theory must distinguish between:
          *   **Merely Touching:** (Two stacked coins).
          *   **Bonded/Stuck:** (Two coins glued together).
          *   **Functionally Integrated:** (A transplanted heart beating *as part of* the circulatory system of a body; gears in a watch working together).
      *   **Why Necessary:** These levels have radically different causal properties and persistence conditions crucial for science (physiology, engineering) and everyday interaction (picking up glued coins vs. stacked ones). Collapsing them ignores real differences.
      *   **Example:** Glued coins compose a new single object (a "coin-pair token") in a way stacked coins do not. A transplanted, functioning heart composes the organism in a way the same heart in an icebox does not.

  5.  **Account for Dynamic Wholes:**
      *   **Deliver:** The theory must explain how objects can persist as the *same whole* despite part replacement or change, and how patterns can be wholes despite matter flow.
      *   **Why Necessary:** Organisms metabolize and heal, machines get repaired, waves propagate. A theory that requires strict part-identity over time denies the persistence of most interesting objects.
      *   **Example:** A wave breaking on shore is arguably the *same wave* propagating, even though the specific water molecules change constantly. Your body is the *same organism* despite cell replacement.

  6.  **Address Vagueness & Gradience:**
      *   **Deliver:** The theory must acknowledge and explain borderline cases (e.g., "Is *this* pile of sand a heap?") without collapsing into complete indeterminacy about clear cases.
      *   **Why Necessary:** Many composition boundaries *are* vague (clouds, mountains, forests). A theory must handle this without making *all* composition vague or denying the existence of clearly composed wholes.
      *   **Example:** Removing one grain from a heap doesn't instantly make it "not a heap." The theory needs to accommodate this gradualism without saying there's never *a* heap.

  7.  **Distinguish Existence from Convenience:**
      *   **Deliver:** The theory must provide criteria to distinguish when a collection of parts *genuinely composes a new object* versus when it's merely *convenient for us to talk about them collectively*.
      *   **Why Necessary:** This is fundamental to ontology. Collapsing this distinction makes composition subjective or pragmatic only, undermining its objective basis in science (e.g., biologists claim organisms *objectively exist*, not just as counting conventions).
      *   **Example:** A functioning car engine *is* a composed object. "All things on my desk" is a convenient grouping, not a composed object *in addition to* the individual items.

  **Key Distinctions a Theory MUST Preserve:**

  *   **Existence vs. Convenience:** (See point 7 above). Non-negotiable for objectivity.
  *   **Touching vs. Bonded vs. Integrated:** (See point 4 above). Crucial for causal/explanatory power.
  *   **Heap vs. Integrated System vs. Scattered Parts:**
      *   **Heap:** Parts spatially proximate but minimal interaction (pile of leaves).
      *   **Integrated System:** Parts interact strongly to produce systemic behavior/causation beyond individual parts (organism, engine, ecosystem).
      *   **Scattered Parts:** Parts spatially separated with no significant interaction (plastic debris across oceans).
      *   **Why Necessary:** These represent fundamentally different ontological and causal categories. Collapsing them ignores critical differences in persistence, behavior, and scientific study.

  **Non-Negotiables vs. Potential Prejudices:**

  *   **Non-Negotiables:**
      1.  **Coherence:** The theory must be logically consistent internally.
      2.  **Empirical Adequacy:** Must align with fundamental science (physics, chemistry, biology) – it can't deny the existence of atoms, molecules, cells, organisms, or well-understood complex systems as composed entities studied by those sciences.
      3.  **Ordinary Objects:** Must validate the existence of chairs, rocks, organisms (without this, it fails its core purpose).
      4.  **Reject Arbitrary Sums:** Must avoid ontological explosion and meaninglessness.
      5.  **Existence vs. Convenience:** Must provide objective criteria.

  *   **Potential Prejudices/Camp-Specific Biases:**
      1.  **Requiring Human Intent/Cognition:** "X composes Y only if humans think of it as Y." (Biased towards anti-realism/pragmatism; fails for pre-human objects, scientific objects not intuitively grouped).
      2.  **Requiring Biological Functions:** "Composition requires goal-directedness like reproduction or homeostasis." (Biased towards biology; fails for artifacts, inorganic systems, ecosystems).
      3.  **Requiring Absolute Simplicity/Atomism:** "Only fundamental particles truly exist." (Biased towards reductionism; fails empirical adequacy for complex systems).
      4.  **Demanding Perfect Sharp Boundaries:** Insisting *all* composition must be absolutely precise. (Ignores the reality of vagueness).

  **Key Tensions (Likely Irreconcilable Pairs within a Simple Theory):**

  1.  **Functionalism vs. Bonding:** Should composition depend primarily on *functional unity* (like a transplanted heart in a body) or *physical bonding/contact* (like glued coins)? A purely functional theory struggles with bonded non-functional wholes (glued coins). A purely bonding theory struggles with functionally unified but unbonded wholes (a wave, an ecosystem).
  2.  **Vagueness Tolerance vs. Sharp Existence:** How can a theory robustly affirm the existence of clear wholes (chairs, cats) while fully accommodating genuine vagueness (heaps, clouds) without either making existence vague everywhere or ignoring vagueness?

  **The Biggest Knockout Punch (Against Simple Views):**

  *   **Empirical Adequacy:** This requirement alone devastates the simplest views:
      *   **Always Compose (Universalism):** Fails instantly. It posits "Shoe + Eiffel Tower + Andromeda Quark" as an object, which science ignores and pragmatically doesn't exist. Violates Reject Arbitrary Sums and Existence vs. Convenience.
      *   **Never Compose (Nihilism):** Fails catastrophically. It denies the existence of chairs, rocks, organisms, molecules – everything science studies above fundamental particles. Violates Ordinary Objects and Empirical Adequacy fundamentally.
      *   **Sometimes Compose (without robust criteria):** If the "sometimes" relies on vague intuitions, human intention, or undefined "special conditions," it fails to provide objective criteria distinguishing existence from convenience and often collapses into arbitrariness, failing Empirical Adequacy for scientific objects and Non-Arbitrariness.

  **In Brief:** A viable theory must ground composition in objective features of the world (like specific types of interaction, organization, or cohesion) that explain the existence of ordinary objects and complex systems studied by science, while rejecting arbitrary collections, accommodating temporal change and vagueness, and preserving key distinctions like bonded vs. integrated vs. scattered. The biggest hurdles are reconciling functional unity with physical bonding and handling vagueness without sacrificing objectivity.
