answer: |-
  Below is a systematic recasting of three philosophical proposals about thought experiments into bench-experimental vocabulary, using your torsion-balance illustration. Each proposal is analyzed through the lens of apparatus, control, idealization, and result, followed by a detailed audit of conceptual alignment and mismatches.

  ---

  ### **Invented Illustration**
  **Scenario:** A sealed, perfectly insulated chamber houses a delicate torsion balance. We imagine achieving an *unattainable perfect vacuum* (eliminating air damping) and *zero seismic noise* to isolate whether **thermal fluctuations alone** set a fundamental limit to measurement precision.  
  **Question:** Does Brownian motion impose an inescapable noise floor?

  ---

  ### **1. Thought Experiments as Compact Arguments**  
  *Philosophical Claim:* Thought experiments derive new knowledge by logically unfolding consequences of already-accepted principles.  
  **Recast in Bench Vocabulary:**  
  - **Apparatus:** The accepted physical principles (e.g., equipartition theorem, fluctuation-dissipation theorem) serve as the "instrumentation."  
  - **Control:** Holding all *non-thermal* variables fixed (e.g., no vibration, no EM interference) by stipulation.  
  - **Idealization:** Perfect vacuum and infinite seismic isolation (de-idealized later by adding back air damping/ground noise).  
  - **Result:** Rigorous derivation showing thermal noise variance \( \langle \theta^2 \rangle = \frac{k_B T}{\kappa} \) (where \( \kappa \) is torsional stiffness), proving a measurement limit exists.  

  **How It Works:** Like validating a fixture using calibration equations before building it. No new data is gathered; existing principles are "operated" to output a prediction.

  ---

  ### **2. Thought Experiments as Direct Intellectual Insight into Necessities**  
  *Philosophical Claim:* Thought experiments reveal necessary truths (e.g., "Thermal noise *must* persist") through conceptual intuition.  
  **Recast in Bench Vocabulary:**  
  - **Apparatus:** The mind's grasp of physical laws (e.g., "Atoms *must* jiggle at T > 0 K") acts as the sensor.  
  - **Control:** Mentally "toggling" parameters (e.g., "If we *could* freeze all atomic motion, would noise vanish?") to isolate thermal necessity.  
  - **Idealization:** Same perfect vacuum/seismic silence, but framed as conditions to *expose inevitability*.  
  - **Result:** The unshakable conviction that thermal noise remains unavoidable even in "perfect" conditions.  

  **How It Works:** Analogous to realizing a material *must* expand when heated after seeing it occur across countless tests—but without running them. The "necessity" is the readout.

  ---

  ### **3. Thought Experiments as Internal Simulations**  
  *Philosophical Claim:* Thought experiments are cognitive simulations: we model a system and observe its behavior offline.  
  **Recast in Bench Vocabulary:**  
  - **Apparatus:** A mental model of the torsion balance (masses, fiber stiffness, atomic collisions).  
  - **Control:** Ensuring internal consistency (e.g., "Does this model obey conservation of energy?").  
  - **Idealization:** Perfect vacuum/seismic silence—simplifications to focus computation on thermal effects.  
  - **Result:** Simulated trajectory of the balance showing micron-scale oscillations, confirming thermal limits.  

  **How It Works:** Like using finite-element software to predict resonance modes, but executed cognitively. No hardware is built; the "simulation" is the experiment.

  ---

  ### **Audit of Conceptual Alignment**  
  **Key to Mismatches:**  
  - ✅ = Direct carryover  
  - ⚠️ = Carryover only by stretching concepts  
  - ❌ = No counterpart  

  | **Philosophical Element**       | **Proposal 1 (Argument)** | **Proposal 2 (Necessity)** | **Proposal 3 (Simulation)** | **Mismatch Analysis**                                                                 |
  |---------------------------------|---------------------|---------------------|---------------------|----------------------------------------------------------------------------------------|
  | **Apparatus as physical tool**  | ✅ (Principles as instruments) | ❌ (Mind as sensor) | ⚠️ (Mental model as proxy) | *Proposal 2’s "mind as sensor" has no lab parallel. Bench apparatus must be intersubjective and calibratable.* |
  | **Control via intervention**    | ✅ (Fixed parameters) | ⚠️ (Mental toggling) | ✅ (Consistency checks) | *Mental toggling (P2) lacks the physical feedback loop of bench controls. Stretches "control" beyond lab practice.* |
  | **Idealization as approximation** | ✅ (De-idealize later) | ✅ (Same) | ✅ (Same) | *All preserve idealization→de-idealization cleanly.* |
  | **Result as empirical outcome** | ✅ (Derived prediction) | ❌ (Necessity as "conviction") | ⚠️ (Simulated behavior) | *P2’s "necessity" is metaphysical—no error budget exists for it. P3’s result is predictive but uncalibrated.* |
  | **Calibration chain traceability** | ⚠️ (Only to axioms) | ❌ (No calibration) | ❌ (No traceability) | *Lab results require SI-traceable calibration. Philosophy lacks this entirely—a major gap.* |
  | **Error budget quantification** | ⚠️ (Only model uncertainty) | ❌ (None) | ❌ (None) | *Thought experiments ignore measurement uncertainty (e.g., "Is kB truly constant?"). Philosophy’s imprecision exposed.* |
  | **Construct validity**          | ✅ (Principles define the construct) | ❌ (Intuition not falsifiable) | ⚠️ (Model validity assumed) | *P2’s reliance on intuition fails bench standards for empirical validation.* |

  #### **Conclusions on Gaps**  
  1. **Limitations of Bench Vocabulary:**  
     - Bench language struggles with *necessity* and *intuition* (P2) because these are non-empirical. This reveals philosophy’s reliance on concepts outside operational science.  
     - *Calibration* and *error budgets* have no counterparts in thought experiments, exposing philosophy’s idealization of rigor.  

  2. **Limitations of Philosophical Claims:**  
     - Proposals 2 and 3 overstate precision: claiming "direct insight" (P2) or "simulation" (P3) implies reliability comparable to physical experiments, yet they lack mechanisms to detect model errors (e.g., misapplied thermodynamics).  
     - Philosophy’s dismissal of new data ignores how bench scientists *use* thought experiments: to design *future* tests, not replace them.  

  3. **When Imagination Can Stand In for Experiment:**  
     - ✅ **Useful:** For deriving first-principles limits (P1), scoping feasibility (P3), or isolating variables (all).  
     - ❌ **Inadequate:** When construct validity is unknown (e.g., "Does quantum gravity alter thermal noise?"), or when quantitative error budgets are needed.  

  ---

  ### **Recommendations for Technicians**  
  - **Present thought experiments as "fixtures for ideas"**: They assemble known parts (principles) into a test configuration, but yield predictions, not data.  
  - **Stress de-idealization**: "Perfect vacuum" is a placeholder; always discuss how air damping *actually* couples to thermal noise.  
  - **Contrast with physical experiments**: Thought experiments set expectations; lab work tests them against reality’s full complexity.  

  This audit confirms that bench vocabulary *sharpens* philosophical claims by forcing operational definitions—exposing where "knowledge without data" is merely rigorous derivation (P1), not discovery (P2/P3). The gap lies not in language limitations, but in philosophy’s conflation of logical inference with empirical investigation.
