  For the alternative state d:
  - World 1: (1-0.4)^2 + (0-0.4)^2 = 0.36 + 0.16 = 0.52
  - World 2: (0-0.4)^2 + (1-0.4)^2 = 0.16 + 0.36 = 0.52

  State d dominates c (0.52 < 0.58 in both worlds). However, the dominance argument for probabilism requires domination by a coherent credence function. Since d is incoherent, it cannot serve this role. Instead, consider the coherent state e that assigns 0.5 to P, 0.5 to ~P, and 1.0 to P∨~P. Its inaccuracy:
  - World 1: (1-0.5)^2 + (0-0.5)^2 = 0.25 + 0.25 = 0.50
  - World 2: (0-0.5)^2 + (1-0.5)^2 = 0.25 + 0.25 = 0.50

  State e dominates c (0.50 < 0.58). Moreover, e also dominates d (0.50 < 0.52). Therefore, by the dominance principle, both c and d are irrational.

  Why is an appeal to expected inaccuracy insufficient to establish the irrationality of c? Expected inaccuracy is computed from the agent's perspective. For a strictly proper scoring rule, any coherent credence function expects itself to be least inaccurate. However, an incoherent agent may not. In fact, from the perspective of c, the expected inaccuracy of e might be higher than that of c. Specifically, the agent assigns credence 0.7 to P and 0.7 to ~P (though these are inconsistent). To compute expected inaccuracy, we would normally weight the inaccuracy in each world by the credence in that world. But because the agent's credences are incoherent, they do not determine a unique probability distribution. However, if we force the calculation, we might use the agent's credences as if they were probabilities (though they are not). In world1, the inaccuracy of c is 0.58, and the agent's credence in world1 might be taken as c(P)=0.7. Similarly, in world2, inaccuracy is 0.58 and c(world2)=c(~P)=0.7. Then the expected inaccuracy of c is 0.7*0.58 + 0.7*0.58 = 0.812. For e, in world1: 0.50, world2:0.50, so expected inaccuracy: 0.7*0.50+0.7*0.50=0.70. This is less than 0.812? Wait, that would suggest e has lower expected inaccuracy. But note: the agent's credence in the worlds must sum to 1? Here we have 0.7 for each, which sums to 1.4, so it's not a probability. This illustrates the problem: we cannot straightforwardly compute expected inaccuracy. However, in general, it is possible that from the agent's perspective, their own credences have lower expected inaccuracy than any coherent alternative. Dominance avoids this problem by showing that e is better in every world, so regardless of the agent's credences, e is better.

  Challenge (i) contends that dominance provides no reason to move unless the dominating state is accessible. But dominance is an objective norm: if one option is better in every possible state of the world, it is rationally required. The agent should adopt e, even if it requires a leap.

  Challenge (ii) argues that the dominance argument presupposes a specific scoring rule and risk attitude. While the Brier score is used, the dominance result holds for any strictly proper, additive, and continuous scoring rule. Thus, the argument is robust to the choice of scoring rule within this class. However, it does assume that accuracy is measured by such a rule and that dominance (avoiding any chance of being worse off) is the right decision norm. This reflects extreme risk aversion, but in epistemology, where accuracy is the sole goal, dominance is compelling.

  In conclusion, the dominance argument shows that the agent's credences are irrational because dominated by a coherent state. The alternative state, while dominating the agent's, is also irrational. The challenges do not undermine the core argument.

