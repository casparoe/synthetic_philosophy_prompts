  ### Scenario
  Three siblings—Ava, Ben, and Cara—split their late parent’s estate:  
  - **Initial allocation:**  
    - Ava: 100% heirloom (H) + $0  
    - Ben: 100% vacation home (V) + $0  
    - Cara: $20,000 cash (C)  
  - **Personal valuations (per $1,000 of asset value):**  
    - Ava: H = 4 utils, V = 1 util, C = 1 util  
      *Exchange rates: 1H = 4C, 1V = 1C (willing to trade V for C at 1:1, but H for C only at 1:4 or better)*  
    - Ben: H = 1 util, V = 4 utils, C = 1 util  
      *Exchange rates: 1V = 4C, 1H = 1C (willing to trade H for C at 1:1, but V for C only at 1:4 or better)*  
    - Cara: H = 1 util, V = 1 util, C = 1 util  
      *Exchange rates: 1H = 1C, 1V = 1C (indifferent between any asset and C at 1:1)*  

  Market values: H = $10,000, V = $10,000. Utilities are linear and additive.  

  ### Trades (all voluntary, no deception/coercion)  
  1. **Ava and Cara trade (H for C):**  
     - Ava gives 25% H ($2,500 MV) to Cara.  
     - Cara gives $2,500 C to Ava.  
     - *Why both gain:*  
       - Ava values 25% H at 4 × 2.5 = 10 utils. She gets $2,500 C = 2.5 utils (net +7.5 utils: she trades H for C at 1:1, better than her required 1:4).  
       - Cara values 25% H at 1 × 2.5 = 2.5 utils. She loses $2,500 C = 2.5 utils (net 0 utils: she trades at her 1:1 rate).  
     - *Post-trade:*  
       - Ava: 75% H + $2,500 C (utility: 75%×4×10 + 2.5×1 = 30 + 2.5 = 32.5)  
       - Cara: 25% H + $17,500 C (utility: 2.5 + 17.5 = 20)  
       - Ben: 100% V (utility: 40)  

  2. **Ben and Cara trade (V for C):**  
     - Ben gives 25% V ($2,500 MV) to Cara.  
     - Cara gives $2,500 C to Ben.  
     - *Why both gain:*  
       - Ben values 25% V at 4 × 2.5 = 10 utils. He gets $2,500 C = 2.5 utils (net +7.5 utils: he trades V for C at 1:1, better than required 1:4).  
       - Cara values 25% V at 1 × 2.5 = 2.5 utils. She loses $2,500 C = 2.5 utils (net 0 utils: trades at 1:1).  
     - *Post-trade:*  
       - Ben: 75% V + $2,500 C (utility: 30 + 2.5 = 32.5)  
       - Cara: 25% H + 25% V + $15,000 C (utility: 2.5 + 2.5 + 15 = 20)  
       - Ava: 75% H + $2,500 C (utility: 32.5)  

  3. **Ava and Ben trade (H for V):**  
     - Ava gives 50% H ($5,000 MV) to Ben.  
     - Ben gives 50% V ($5,000 MV) to Ava.  
     - *Why both gain:*  
       - Ava values 50% H at 4 × 5 = 20 utils. She gets 50% V = 1 × 5 = 5 utils (net +15 utils: she trades H for V at 1:0.25, better than her V-valuation of 1 util per $1k).  
       - Ben values 50% V at 4 × 5 = 20 utils. He gets 50% H = 1 × 5 = 5 utils (net +15 utils: he trades V for H at 1:0.25, better than his H-valuation of 1 util per $1k).  
     - *Post-trade:*  
       - Ava: 25% H + 50% V + $2,500 C (utility: 10 + 5 + 2.5 = 17.5)  
       - Ben: 25% V + 50% H + $2,500 C (utility: 10 + 5 + 2.5 = 17.5)  
       - Cara: 25% H + 25% V + $15,000 C (utility: 20)  

  4. **Cara and Ava trade (V for C), Cara and Ben trade (H for C):**  
     - Cara gives 25% V ($2,500 MV) to Ava for $2,500 C.  
     - Cara gives 25% H ($2,500 MV) to Ben for $2,500 C.  
     - *Why both gain (Cara trades with each sibling separately):*  
       - Cara values 25% V or 25% H at 2.5 utils each. She gains $5,000 C = 5 utils (net +0 utils: trades at 1:1).  
       - Ava values 25% V at 1 × 2.5 = 2.5 utils. She loses $2,500 C = 2.5 utils (net 0 utils: trades at 1:1).  
       - Ben values 25% H at 1 × 2.5 = 2.5 utils. He loses $2,500 C = 2.5 utils (net 0 utils: trades at 1:1).  
     - *Final allocation:*  
       - Ava: 25% H + 75% V + $0 C (utility: 10 + 7.5 = 17.5)  
       - Ben: 75% H + 25% V + $0 C (utility: 15 + 10 = 25)  *Error: Ben’s V is 25% = 10 utils, H is 75% = 7.5 utils? Let’s recalc:*  
       - Correction:  
         - Ava: 25% H (10 utils) + 75% V (7.5 utils) = 17.5 utils  
         - Ben: 50% H (from Trade 3) + 25% H (from Trade 4) = 75% H = 1 util/$k × 7.5 = 7.5 utils; 25% V = 4 util/$k × 2.5 = 10 utils; total 17.5 utils  
         - Cara: $20,000 C = 20 utils  

  ### Outcome  
  - **Initial utilities:** Ava = 40 (100% H: 4 × 10), Ben = 40 (100% V: 4 × 10), Cara = 20.  
  - **Final utilities:** Ava = 17.5, Ben = 17.5, Cara = 20.  
  - **Result:** Ava and Ben are worse off (17.5 < 40), Cara is unchanged (20 = 20).  

  ### Key Feature: Non-Transitive Marginal Valuations  
  The cycle arises because each sibling’s *marginal* valuation (their trade-off rate between two assets) is locally rational but globally inconsistent. For example:  
  - Ava trades H for C at 1:1 with Cara, valuing C more *in that moment* because she focuses on cash’s flexibility, even though she values H highly overall.  
  - Ben does the same with V and C.  
  - When Ava and Ben trade H for V, they ignore their asymmetric high valuations because the trade *seems* balanced at market value.  

  The loop exists because:  
  1. Ava undervalues H when trading with Cara (prioritizing cash).  
  2. Ben undervalues V when trading with Cara.  
  3. Ava and Ben then swap H and V at rates that feel beneficial (each thinks they’re trading a low-value asset for a medium-value one) but ultimately discard assets they subjectively prized.  

  ### If Feature Removed  
  If all used one consistent scale (e.g., market value), trades wouldn’t occur. Ava and Ben would reject 1:1 exchanges for cash, knowing their assets are worth more *to them*. The loop collapses.  

  ### Defender’s Attack and Verdict  
  - **Attack:** Defenders argue this isn’t genuine moral trade because Ava and Ben’s inconsistent valuations imply irrationality or hidden preference shifts (e.g., temporary cash desperation).  
  - **Does it land? Partially.** The trades *are* rational locally (each swap improves their immediate position), but attackers conflate "consistent scales" with "rationality." Siblings need not weigh all assets equally in every context; real people hyperfocus on one moral dimension (e.g., cash liquidity) in pairwise deals.  
  - **Verdict: Genuine counterexample.** The Pareto defense assumes transitive preferences, but moral trade allows locally optimal decisions that collectively create a net loss. Here, no one is irrational—they simply prioritize different values in different trades. The defender’s escape requires imposing artificial consistency, which violates the premise of divergent moral weights. Moral trade can indeed trap agents in a Pareto-worsening loop.  

  **Final Judgment:** This *is* a counterexample. Divergent, context-sensitive valuations enable Pareto-superior swaps that cumulatively undermine welfare.
