answer: |-
  The frost on the lab’s nitrogen tank glinted under the fluorescent lights. Mark pressed his palm against the cold steel, the chill seeping through his skin. Inside, suspended in liquid nitrogen, rested "Blue," their second embryo. The one they hadn't transferred. The one Sunny – their wriggling, gurgling, *real* six-month-old son currently blowing raspberries at his mother in the waiting room – wasn't.

  The thought had wormed its way in months ago, ever since the two little clusters of cells, labeled "Sunny" and "Blue," became tangible possibilities. It started with the old, weird thought he’d had since high school biology: *If Dad hadn’t gotten Mom pregnant that specific August night… it wouldn’t be me. It’d be some other random kid from a different sperm winning a different race. Totally different person.*

  Now, staring at the tank, the abstract became terrifyingly concrete. Blue wasn't just an unused embryo. Blue was *a whole other kid*. A kid with *his* potential nose, maybe his wife Sarah’s laugh, a unique mix neither of them could imagine. A kid who would never breathe air, never scrape a knee, never feel the sun. Because they picked Sunny first. Because Sunny stuck.

  "Ready, Mark?" Sarah called softly, Sunny balanced on her hip.

  "Yeah," he rasped, pulling his hand away, leaving a faint fogged print that vanished instantly. He forced a smile for Sunny, who rewarded him with a drooly grin. But the chill stayed in his bones.

  ***

  Life with Sunny was chaotic joy. Sleepless nights, explosive diapers, the sheer wonder of watching a tiny human discover light switches and his own toes. Yet, Mark found himself haunted. During midnight feedings, rocking Sunny in the dim glow, his mind would drift to Blue.

  *Would Blue have been a boy too? A girl? Quieter than Sunny? More serious? Would he have had Sarah's eyes? My stubborn streak?* He’d picture a phantom child, standing just outside the circle of lamplight, watching. A kid with blurry features, formed from his DNA and Sarah's, but never assembled. Never *realized*.

  He started researching embryo adoption, frozen embryo transfer stats – morbidly curious about Blue’s theoretical chances if they ever… *No*. They weren't doing that. Sunny was their miracle. Blue was… what? Backup? Spare parts? That felt monstrous. Potential? That felt like grief.

  He mentioned it to Sarah one night, exhausted, as they folded tiny socks. "Do you ever think about Blue? Like… *really* think?"

  Sarah paused, a miniature dinosaur sock dangling. "Of course. Sometimes. It’s… sad. Knowing they're there. But they’re… not Sunny." She reached over and squeezed his hand. "Sunny’s here. He’s ours. That’s what matters."

  But for Mark, it wasn't that simple. The existential math gnawed at him. If he himself was only "Mark" because of one specific sperm beating millions of others on one specific night, then Blue wasn't just a "might-have-been." Blue was a *specific* "could-have-been," genetically distinct. A unique combination that existed, frozen in time, but would never become a person. Was that a loss? Or was it just… biology playing out its infinite lottery, a ticket never drawn?

  He found himself driving past the fertility clinic unnecessarily. He’d park and stare at the unremarkable building, imagining the tank deep inside. He knew the annual storage fee was paid. Blue was… safe. Preserved. Waiting for a decision that felt increasingly impossible. Could he ever let Blue be donated? Could he bear knowing *that* specific combination – *his* and Sarah’s specific potential child – was being raised by someone else? Or worse, discarded?

  The phantom child became sharper in his mind. He imagined a birthday party for Sunny, age three, and seeing another child, eerily similar yet distinct, playing silently in the corner, ignored. He saw a photo of himself as a kid and thought, *If my parents had waited a month, that wouldn't be me in that picture. That would be some other kid. A kid that doesn't exist.*

  One rainy Tuesday, overwhelmed, he called the clinic. "Just checking," he stammered to the nurse. "On Embryo Blue. Storage status?"

  "It’s perfectly secure, Mr. Henderson," the nurse replied, her voice kind but professional. "Would you like to schedule a consultation to discuss your options?"

  "No," Mark said quickly. "No. Just… checking." He hung up, feeling foolish and strangely guilty.

  He started therapy. Dr. Evans listened patiently as Mark poured out the paradox. "It feels like I lost a child I never had. But did I? Blue was never implanted. Never a fetus. Just… cells. My cells. Sarah's cells. But combined in a way that could only ever make *one* specific person. Is grieving that… fuckin' weird?"

  "It’s not weird, Mark," Dr. Evans said gently. "It’s profound. You’re grappling with the very nature of identity. You’re recognizing the incredible, fragile randomness of *being*. The ‘you’ that exists hinges on a specific biological event. Blue represents another potential ‘you-and-Sarah,’ a specific genetic possibility that remains unrealized. Grieving that *potential*, that specific lost future, is valid. It’s love without a body."

  "Love without a body," Mark repeated, the phrase settling heavily.

  ***

  Months later, Mark sat on the porch swing, Sunny asleep on his chest, a warm, solid weight. The evening air smelled of cut grass and impending rain. He looked down at his son’s peaceful face, the curve of his cheek, the faint flutter of an eyelash. Pure, undeniable reality.

  He thought of Blue, frozen in the endless cold. That specific egg, that specific sperm, suspended in time. Dr. Evans was right. It *was* a kind of loss. The loss of a unique possibility, a path forever untrodden. Blue *was* his and Sarah's genetic child, in its most fundamental, cellular form. But Blue wasn't Sunny. Sunny was the path chosen, the life lived. The warmth against his chest.

  He kissed Sunny’s downy head, breathing in the scent of baby shampoo and sleep. The ache for Blue was still there, a quiet hum beneath the surface, a testament to the wonder and weight of life’s infinite, fragile possibilities. He held his living son closer, cherishing the improbable, specific miracle of *this* particular egg, *this* particular sperm, against all astronomical odds, becoming real. The other possibility, Blue, remained frozen – not forgotten, not unloved in its potential, but existing now as a silent question mark in the vast, mysterious equation of existence. A child lost? Or a child who never was? Mark finally understood it could feel like both, a paradox held gently in the heart along with the warm, breathing reality of the son asleep in his arms.
