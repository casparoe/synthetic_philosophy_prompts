answer: |-
  Here are five examples:

  1.  **Politics:** A politician asserts that without passing their specific, unconventional economic policy *this year*, the nation will inevitably spiral into irreversible hyperinflation and societal collapse within a decade—a claim impossible to definitively disprove short-term but carrying existential stakes.
  2.  **Business:** A startup founder claims their unproven algorithm, if not funded *immediately* by your VC firm, will be acquired by a competitor who will use it to monopolize and cripple a trillion-dollar global market within five years—stakes are immense, but the causal chain is speculative and unfalsifiable now.
  3.  **Personal Life:** An estranged relative warns that if you don't lend them a large sum *today* to settle a secret debt, powerful, hidden adversaries will destroy your career and family finances beyond recovery—the threat is vague, unverifiable, yet the purported consequences are catastrophic.
  4.  **Technology:** A senior engineer insists that skipping a specific, resource-intensive security audit for a critical system update *right now* will inevitably lead to an undetectable flaw causing catastrophic, cascading infrastructure failures within months—disproof requires impossible future knowledge, stakes are societal collapse.
  5.  **Public Health:** An anonymous whistleblower claims a widely used consumer product contains an undetectable contaminant that causes severe, latent health effects affecting millions decades later—definitive disproof is scientifically impossible now, stakes are enormous, but recall/ban action seems disproportionate intuitively.
