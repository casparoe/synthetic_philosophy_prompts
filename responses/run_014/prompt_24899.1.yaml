prompt: |-
  Write a villanelle about the surprise exam paradox. The two refrains should function as the opposing poles of the paradox: one refrain (call it A1) should voice the teacher's announcement that there will be a surprise exam next week; the other (A2) should voice the students' conclusion, reached by backward induction, that no surprise exam is possible. The villanelle's form should track the reasoning: as the refrains alternate through the five tercets, the elimination of Friday, Thursday, Wednesday, and Tuesday should be discernible in the movement of the poem, and when the two refrains finally meet in the closing couplet, their juxtaposition should capture the paradox's irresolvable tension—the fact that the students' reasoning seems unassailable and yet the exam arrives as a surprise all the same. Someone who knows the paradox should recognize its structure in the poem; someone who doesn't should still find it a coherent villanelle. Begin with the poem itself, with no preface or commentary.
reasoning: |-
  Okay, the user wants me to write a villanelle about the surprise exam paradox. This is a fascinating logical puzzle where a teacher announces a surprise exam next week, and students use backward induction to argue it can't happen—only to be surprised when it does. 

  The challenge is crafting a villanelle that mirrors the paradox's structure. I need two refrains: A1 for the teacher's announcement ("You'll have a test you cannot foresee") and A2 for the students' conclusion ("No test can spring unexpectedly"). The tercets must track the elimination of days: Friday down to Monday. 

  I consider starting with the teacher's announcement to establish tension. The first tercet could introduce the premise with A1, then hint at doubt with A2. For the second tercet, focusing on Friday's elimination—"First Friday falls to certainty"—while weaving in both refrains. 

  The middle stanzas need to handle Thursday and Wednesday. I'll use phrases like "Then Thursday too must pass untried" and "Wednesday's promise fades away" to show the backward deduction. Each tercet should advance the logic while maintaining poetic flow. 

  Tuesday's elimination in the fifth tercet brings us to the couplet. Here, the refrains collide: the teacher's claim meets the students' reasoning, yet the exam happens—"We stare at questions, stunned and vexed." The closing lines must highlight the paradox's unresolved tension. 

  I'll avoid archaic language to keep it accessible. Rhymes will follow the villanelle form (ABA pattern), with subtle enjambment to ease rigid structure. For the couplet, a concrete image of students taking the test drives home the irony. 

  Hmm, ensuring coherence for readers unfamiliar with the paradox is tricky. The days' elimination should feel natural, not forced. Phrases like "logic's chain" and "flawless" nod to the deduction without jargon. The emotional arc—from confidence to shock—might resonate universally. 

  Finally, I'll omit commentary per request. The poem must stand alone, balancing structural precision with visceral surprise. Let me draft carefully—this paradox deserves elegance.
answer: |-
  ## The Friday Proof

  The master said with sage authority:  
  "You'll have a test you *cannot* foresee."  
  We scanned the week with cold lucidity.

  Our logic mapped the week’s humidity,  
  Deducting outcomes perfectly.  
  The master said with sage authority.

  First Friday falls to certainty:  
  If no test came, that day we'd see.  
  We scanned the week with cold lucidity.

  Then Thursday too must pass untried,  
  A victim of our flawless key.  
  The master said with sage authority.

  Wednesday's promise fades away,  
  Discarded by our stern decree.  
  We scanned the week with cold lucidity.

  On Tuesday, hope begins to bleed;  
  Its chance dissolves, we all agree.  
  The master said with sage authority.  
  We scanned the week with cold lucidity.

  So Monday dawns – and suddenly:  
  **"You'll have a test you cannot foresee!"**  
  **"No test can spring unexpectedly!"**  
  We stare at questions, stunned and vexed.
