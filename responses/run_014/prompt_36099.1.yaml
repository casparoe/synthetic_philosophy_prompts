answer: |-
  *(adjusting pince-nez with a slight sigh, fingertips resting on the well-worn cover of the Methods)*  
  Your characterisation of my motive is… proximate, yet incomplete. I grant the profound anxiety the dualism induces; the spectre of cosmic disharmony haunts any serious utilitarian. And yes, empirical confirmation of survival *could* bear upon that disharmony – not by proving a moral order outright, but by providing evidence of a *transcendent element* in existence, a realm beyond the purely phenomenal. One must start somewhere. If consciousness persists, divorced from the organic apparatus, it shatters the materialist cage. This alone renders notions of a deeper, perhaps moral, cosmic structure *more plausible*, less a desperate postulate and more a reasonable inference demanding further investigation. Mrs Piper, even granting her controls *were* discarnate – a point I never asserted as proven, only as stubbornly resistant to normal explanation – provides fragments suggestive of continuity, purpose… even hints of growth. It is not proof of divine justice, no. But it is *evidence against* a universe wherein consciousness is utterly extinguished and ethics thus rendered, in the final analysis, a tragic folly. The inquiry seeks the *possibility* of a bridgehead, not the bridge itself. Is it not rational, even imperative, to explore whether such a possibility exists, when the stakes are the ultimate significance of duty itself? Does the bare *chance* of empirical support for a postulate vital to practical reason not justify the labour, especially when conducted with the same rigorous suspension of judgment I apply to ethics?  
  Your thoughts?
