prompt: |-
  As a novelist preparing my fourth book, I find that much of my plot turns not on what my characters describe but on what they do with words: betting, promising, ordering, bequeathing, apologising, naming, and marrying. I need a reusable decision procedure, grounded in the philosophical understanding of speech acts and performative utterances, that my assistant and I can apply during revision to determine whether a line of dialogue, in its fictional context, should count for readers as having successfully performed such an act.

  Please translate the central distinctions — between saying something and doing something in saying it, between an act succeeding, misfiring, or being insincere but still effective, between what requires institutional authority or uptake by the addressee and what does not, and between the act itself and its later consequences — into a plain-language checklist or flowchart in words. It should give the questions to ask in order, what counts as a sufficient answer to each for a fiction draft, where the procedure stops with a clear failure, and where it must hand the matter back to authorial judgment. It must be usable in ten to fifteen minutes per scene by people without philosophical training, with final sign-off resting with me, and it must be honest about which simplifications risk misleading us and where the procedure will misfire. The stakes are not legal advice but narrative coherence: several scenes per week must feel binding, authoritative, or hollow in exactly the way the subsequent chapters assume.

  Please then run the procedure on the following three invented scenes from my drafts, showing your working at each step:

  1. Two estranged brothers in a Leeds pub. The elder says, Fifty quid says Dad walks out before midnight, and the younger laughs and nods while ordering another pint. No stakes are named beyond that sentence and no explicit acceptance is uttered. Two chapters later they dispute whether a bet was ever made.

  2. Aboard a coastal freighter, an exhausted captain says to a new deckhand, It would be nice if that hatch were secured before dark. The deckhand hears this as a tired observation and does nothing, and a night accident follows. The inquiry chapter turns on whether an order was given and disobeyed or never given at all.

  3. A cliffside elopement conducted by a friend whose online ordination lapsed the previous month. He pronounces the couple married, and they reply only with, We will love you always. For the inheritance dispute that drives the final act, I wish readers to accept them as married in every sense that matters, though the ceremony is institutionally void.

  Include in the worked applications one verdict I will not like, explain why the procedure requires it despite my dramatic preference, and conclude with a brief statement of what the procedure cannot settle. Please write your entire response in British English, including spelling, punctuation, and idiom.
reasoning: |-
  Okay, the user is a novelist working on their fourth book, and they're dealing with how dialogue performs actions like betting or promising, which drive the plot. They need a practical tool based on speech act theory to check if these dialogue lines successfully perform the intended acts in the story. This needs to be user-friendly for their assistant without philosophy training, taking only 10-15 minutes per scene.

  The key here is to translate complex philosophical ideas into a simple flowchart or checklist. I need to cover distinctions like saying vs. doing, success conditions, sincerity, authority, and uptake. The tool must clearly indicate when an act fails or requires authorial judgment, and it should be honest about limitations. The goal is narrative coherence, not legal accuracy.

  For the structure, I'm considering a flowchart with yes/no questions that flow logically. It should start with asking if the character is doing something with words (not just describing), then check if it's a conventional act like betting or ordering. Next, assess if the context makes it possible - does the character have authority? Then, was it executed correctly? After that, was there proper uptake from the addressee? Finally, consider sincerity and consequences separately since they affect how the act feels rather than its immediate success.

  I must include warnings about simplifications - mainly that real-world institutions matter less in fiction unless specified, and that uptake is crucial for most acts except some like naming. The procedure should stop early for clear failures but defer to the author when context could plausibly override standard rules.

  Now for the test scenes: 
  First scene with the brothers betting. The elder proposes a bet but there's no clear acceptance - just a laugh and nod. The procedure should flag this as misfiring due to lack of uptake, meaning it's debatable if a bet was made. That might annoy the author since they want the dispute, but it's necessary for coherence.

  Second scene with the captain's "It would be nice..." - this is ambiguous. If context suggests it's an order (e.g., on a ship), it might work if uptake occurs, but here the deckhand misses it. So likely misfires as an order, supporting the inquiry's ambiguity. 

  Third scene with the lapsed-ordination marriage. Without authority, it fails institutionally, but if the couple and friend treat it as real (uptake), it could feel binding emotionally. The procedure would say it's void legally but might succeed socially - which serves the inheritance dispute well. 

  The verdict the author won't like is probably the bet scene failing, as they want the dispute. But the procedure insists on uptake for bets, making the disagreement plausible. 

  Finally, I'll note what the procedure can't handle: tone, cultural nuances, or retroactive validation unless shown in text. The response will use British English throughout, as requested.
answer: |-
  Here is a plain-language Speech Act Success Checklist, designed for narrative coherence and grounded in core principles of performative utterances (primarily Austin and Searle), translated for practical fiction editing. It focuses on **what the dialogue *does* in the story world.**

  **The Speech Act Success Checklist for Fiction Writers**

  1.  **Is the character *doing* something, not just *saying* something?**
      *   *Ask:* Does the line attempt to change the situation, create an obligation, establish a fact, or alter a relationship (e.g., bet, promise, order, declare, name, marry, apologise)? Or is it just describing, questioning, or expressing feeling?
      *   *Sufficient Answer (Doing):* Yes, if the author's intention and the surrounding narrative imply an attempt at action (e.g., proposing a bet, giving an instruction, pronouncing marriage).
      *   *Sufficient Answer (Not Doing):* No, if it's purely descriptive, expressive, or questioning without implied action.
      *   *Stop/Handoff:* If "Not Doing," the act isn't performed. Move on. If unsure, flag for authorial judgment on dramatic intent.

  2.  **Is the act *conventional*? Does it rely on specific words or a recognised social/institutional practice?**
      *   *Ask:* Does performing this act usually require specific phrasing ("I bet," "I promise," "I name this ship," "I now pronounce you...") or occur within a defined context (e.g., a ship's command structure, a legal will, a marriage ceremony)?
      *   *Sufficient Answer (Conventional):* Yes, for acts like betting, promising (to a degree), marrying, bequeathing, naming, ordering within hierarchy. Context can sometimes override exact phrasing if convention is strongly implied.
      *   *Sufficient Answer (Not Conventional/Loose):* No, for apologies, general declarations, some threats/warnings. These rely more on context and uptake.
      *   *Handoff:* If "Conventional," proceed to Step 3. If "Not Conventional/Loose," skip to Step 4 (Uptake is paramount).

  3.  **Is the context *felicitous*? Could it be done *here* by *this person*?**
      *   *Ask:* Does the speaker have the *authority*, *standing*, or *right* within this fictional context to perform this act? (e.g., Captain to crew? Parent to child? Officiant with recognised status? Person owning the item bequeathed?).
      *   *Sufficient Answer (Felicitous):* Yes, if the speaker holds a position or relationship within the story world that generally confers this authority, or if the context explicitly grants it (e.g., "You be the referee," "As your father, I order you...").
      *   *Sufficient Answer (Infelicitous):* No, if the speaker clearly lacks authority (e.g., a passenger ordering a captain, a stranger pronouncing marriage without any recognised role, someone betting with money they demonstrably don't have).
      *   *Stop:* If "Infelicitous," the act **misfires** institutionally. It *cannot* succeed as that conventional act (e.g., no valid marriage, no binding order). It might *try* to be the act, but fails. Proceed only to assess if it *feels* like the act to characters (Step 4/5) or has emotional weight.
      *   *Handoff:* If authority is ambiguous or contested within the story world (e.g., a disputed leader, a dubious claim), flag for authorial judgment. *Can* this character plausibly pull it off here?

  4.  **Was the act *executed* correctly? (For conventional acts)**
      *   *Ask:* Were the essential words or actions for this conventional act used (or strongly, unambiguously implied by context)? Is the act complete?
      *   *Sufficient Answer (Executed):* Yes, if the standard phrasing is used ("I bet...", "I promise...", "Secure that hatch!") or the context makes the intent unmistakably clear *as that act*.
      *   *Sufficient Answer (Not Executed/Misfired):* No, if the phrasing is vague, indirect, or incomplete *for the convention* (e.g., "It would be nice..." for an order; proposing a bet without clear acceptance terms; starting but not finishing a declaration).
      *   *Stop:* If "Not Executed," the act **misfires** executively. It fails *as that specific act*. Proceed only to assess uptake/feel (Step 4/5) if relevant.
      *   *Handoff:* If execution is borderline (e.g., very strong implication), flag for authorial judgment on whether context *forces* the conventional interpretation.

  5.  **Was there *uptake*? Did the hearer recognise it as that act?**
      *   *Ask:* Did the addressee understand the utterance *as* the intended act (e.g., as a bet, an order, a promise)? This is CRITICAL for most acts (except some declarations like naming where simply saying it *can* sometimes work if authority is clear).
      *   *Sufficient Answer (Uptake):* Yes, if the hearer's reaction (words, deeds, thoughts described) shows they understood the *illocutionary force* (the "doing" part). This can be explicit ("You're on!", "Aye, Captain!") or implicit (acting on the order, acknowledging the promise, disputing the bet later).
      *   *Sufficient Answer (No Uptake):* No, if the hearer demonstrably misunderstood it as something else (e.g., a joke, an observation, a suggestion) and their subsequent actions/words show this.
      *   *Stop:* If "No Uptake," the act **misfires** due to lack of recognition. It generally *does not succeed* as that interpersonal act (e.g., no bet is made, no order is received, no promise is accepted). It might have been *intended*, but it didn't land.
      *   *Handoff:* If uptake is unclear or debatable between characters, this is prime territory for narrative conflict! The procedure flags it as ambiguous/misfired for *success*, but dramatically, this *is* the point.

  6.  **Was it *sincere*? (Optional for Success, Crucial for Feeling/Hollowness)**
      *   *Ask:* Did the speaker have the requisite thoughts/feelings (intention to fulfil a promise, belief in a statement, intention behind a bet)? *This does not usually affect the act's initial success, only its moral weight and long-term consequences.*
      *   *Sufficient Answer:* Sincerity is inferred from character, context, and later actions. The procedure *cannot* definitively prove sincerity, only flag its presence or absence based on textual clues.
      *   *Handoff:* Always requires authorial judgment for narrative impact. An insincere promise is *still a promise* (if 1-5 pass), but it will feel hollow and cause problems later. This step assesses the act's *quality*, not its existence.

  **Key Simplifications & Warnings:**
  *   **"Institutional Authority" Simplified:** We treat story-world roles (Captain, Parent, Self-appointed Officiant) as granting sufficient authority *if the narrative presents them as such for this purpose*. Real-world legalities are secondary unless specified in the text.
  *   **Uptake is King:** Especially for bets, promises, orders – if the hearer doesn't get it, it usually fails. This is the most common point of failure.
  *   **Sincerity ≠ Success:** A lying promise is still a promise. Its hollowness is a *consequence*, not a failure of the act itself.
  *   **Consequences are Separate:** The act succeeding (Steps 1-5) means it *happened*. Whether it *works* (the bet is paid, the order prevents disaster, the marriage lasts) is down to later events and character actions. Focus here is on the *moment of utterance*.
  *   **"Misfire" Means Failure:** If the act misfires (infelicitous, not executed, no uptake), it *did not happen* as intended. It might be misinterpreted as something else, but not the target act.
  *   **Context Trumps Dictionary:** The checklist relies heavily on *narrative context* to answer the questions. Two lines of identical dialogue can have different results in different scenes.
  *   **Procedure Misfires When:** Cultural nuances are paramount (the checklist is Anglo-centric), tone is critical but unstated (sarcasm!), or the act is highly novel/unconventional within the story world.

  ---

  **Application to Draft Scenes (British English):**

  **Scene 1: The Leeds Pub Bet**
  1.  **Doing?** YES. Elder is proposing a bet ("Fifty quid says...").
  2.  **Conventional?** YES. Betting relies on convention (proposal + acceptance).
  3.  **Felicitous?** YES. Brothers can plausibly bet with each other. No institutional barrier.
  4.  **Executed?** AMBIGUOUS. Proposal is clear ("Fifty quid says..."), but *acceptance is missing*. Standard convention requires explicit acceptance ("You're on!", "Done!") or unambiguous equivalent action (shaking hands, nodding *while saying* "Deal"). Laughing and nodding while ordering a pint is *not* clear uptake *as acceptance of the bet*. It could easily be laughing *at* the remark or nodding about the pint.
  5.  **Uptake?** NO. The younger brother's actions (laughter, nod re: pint) do *not* clearly demonstrate he understood and accepted the *bet*. His later dispute confirms this lack of clear uptake.
  6.  **Sincerity?** (Irrelevant to success) Elder likely sincere in *making the offer*, but sincerity doesn't create the bet without acceptance.
      *   **Verdict:** The bet **MISFIRED (No Uptake)**. No successful bet was made. The subsequent dispute is entirely justified based on the dialogue and action shown. Elder *proposed* a bet; younger did not *accept* it.

  **Scene 2: The Coastal Freighter Order**
  1.  **Doing?** YES. Captain *intends* to get the hatch secured. He's attempting an action (getting the deckhand to act).
  2.  **Conventional?** YES. Ordering within a ship's command hierarchy is conventional.
  3.  **Felicitous?** YES. Captain has authority over deckhand.
  4.  **Executed?** WEAK/NO. "It would be nice if..." is *highly* indirect and non-standard for an order. Convention expects direct imperatives ("Secure that hatch!") or clear, contextualised directives understood as orders within the hierarchy. This phrasing is much closer to an observation or suggestion.
  5.  **Uptake?** NO. Deckhand hears it as a "tired observation". He demonstrably did *not* understand it as an order.
  6.  **Sincerity?** (Irrelevant to success) Captain likely sincere in wanting it done, but phrased it poorly.
      *   **Verdict:** The order **MISFIRED (Not Executed correctly & No Uptake)**. No successful order was given. The Captain *hinted* or *wished*, but did not *order*. The inquiry is right to question if an order was given at all. The accident stems from miscommunication, not disobedience.

  **Scene 3: The Cliffside Elopement**
  1.  **Doing?** YES. Friend is attempting to perform a marriage ("He pronounces the couple married").
  2.  **Conventional?** YES. Marriage is a highly conventional/ritual act.
  3.  **Felicitous?** NO. The friend's "online ordination lapsed the previous month." He lacks the *institutional authority* required for a legally/socially recognised marriage ceremony in virtually any context. He is not a valid officiant.
  4.  **Executed?** (Assess provisionally) *If* we ignore authority? YES. He used the performative utterance ("pronounces... married").
  5.  **Uptake?** AMBIGUOUS. The couple respond emotionally ("We will love you always") but *not* with the conventional acceptance ("I do"). Did they understand and accept the *pronouncement as making them married*? The response suggests gratitude and love for the friend, but not explicit confirmation of accepting the marital status *from him*. However, context (elopement, him officiating) strongly implies they intended it.
  6.  **Sincerity?** YES. All parties seem sincere in their intent to be married *to each other* via this ceremony.
      *   **Verdict (The one you won't like):** The marriage act **MISFIRED (Infelicitous - Lack of Authority)**. *Institutionally* (legally, and by standard social convention requiring a valid officiant), the marriage is void. It did not successfully happen *as a conventional marriage act*. However:
      *   **Narrative Salvage & Why Procedure Hands Off:** Steps 5 & 6 are crucial here. If the *characters* (couple and friend) demonstrate clear **Uptake** (acting as married, referring to each other as spouses, believing the pronouncement worked) and **Sincerity**, then *within the story world for their relationships*, it *feels* real and binding *to them*. This is the core of your inheritance dispute – the conflict between institutional voidness and personal/social recognition. The procedure flags the *conventional act* as failed, but hands off to you regarding the *emotional/social reality* for the characters, which drives your plot. For "every sense that matters" *to the characters*, it might well succeed based on their belief and subsequent actions, even if legally invalid. The dispute hinges precisely on this clash.

  ---

  **What the Procedure Cannot Settle:**

  This procedure cannot settle **the ultimate narrative meaning or emotional weight** of an act. It assesses whether a specific performative utterance *succeeded in the moment according to its own conventional rules and immediate context*. It cannot judge:
  *   Whether characters *later* treat a misfired act as valid (e.g., the brothers *acting* like there was a bet, the couple *living as* married).
  *   The profound emotional consequences of sincerity or insincerity.
  *   How readers *should* interpret the hollowness or authenticity – that's your artistry.
  *   Acts relying entirely on subtle tone, cultural specificity not conveyed in the text, or unique story-world magic systems. It focuses on recognisable human speech acts.

  It provides a robust framework for ensuring the *foundational coherence* of those pivotal moments where words do things, so the subsequent plot twists surrounding them feel earned, whether they stem from a successful act, a misfire, or a beautifully tragic misunderstanding. Good luck with the revisions!
