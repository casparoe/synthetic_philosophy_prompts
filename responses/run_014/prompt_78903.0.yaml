  ### Decision Tree: Inheritance, Dynastic Wealth, and Equal Opportunity  

  **Instructions:** Start at the root. Answer each question based on your moral intuitions, without considering policy implications. Follow the path to a leaf position. Each leaf includes a brief descriptor and its "most awkward commitment"—a counterintuitive or challenging implication of the view.  

  ---

  #### **Node 1: Is there a fundamental moral problem with inherited wealth?**  
  - **No** → *Leaf 1: **Leave It All Alone***  
    *Most awkward commitment:* Must accept that society-wide dynastic power imbalances (e.g., media empires or political dynasties) are benign.  
  - **Yes** → Proceed to Node 2.  

  #### **Node 2: Where is the core wrong located?**  
  - **In the transfer itself** (bequest/receipt violates fairness) → Proceed to Node 3.  
  - **In the ongoing power** (dynastic wealth distorts society over time) → Proceed to Node 4.  

  ---

  #### **Branch: Transfer is Wrong** (Node 2 → "Transfer")  
  ##### **Node 3: What is the purpose of equal opportunity?**  
  - **Ensure a fair start** (level initial resources) → Proceed to Node 3A.  
  - **Eliminate unearned advantage** (no one benefits from birth) → Proceed to Node 3B.  

  ###### **Node 3A: Is the family a morally special case for partiality?**  
  - **Yes** → *Leaf 2: **Moderate Transfer Tax with Exemptions***  
    *Most awkward commitment:* Must defend arbitrary thresholds (e.g., a $2M family home is exempt, but $2.1M is "unfair").  
  - **No** → *Leaf 3: **Universal Inheritance Tax (Funding Fair Start)***  
    *Most awkward commitment:* Forces taxation of family homes/businesses, potentially breaking up estates.  

  ###### **Node 3B: Is the family a morally special case for partiality?**  
  - **Yes** → *Undefended position* (incoherent: family exception creates unearned advantage).  
  - **No** → *Leaf 4: **Abolish Inheritance Entirely***  
    *Most awkward commitment:* Parents cannot pass even sentimental items (e.g., a wedding ring) without state confiscation.  

  ---

  #### **Branch: Ongoing Power is Wrong** (Node 2 → "Ongoing Power")  
  ##### **Node 4: What is the purpose of equal opportunity?**  
  - **Ensure a fair start** (focus on youth opportunity) → Proceed to Node 4A.  
  - **Ensure a fair race** (focus on lifelong competition) → Proceed to Node 4B.  

  ###### **Node 4A: Is the family a morally special case for partiality?**  
  - **Yes** → *Undefended position* (unattractive: dynasties undermine fair starts, yet partiality enables them).  
  - **No** → *Leaf 5: **Annual Wealth Tax (Fair Start Focus)***  
    *Most awkward commitment:* Taxing illiquid assets (e.g., farms) may force sales, harming families without cash.  

  ###### **Node 4B: Is the family a morally special case for partiality?**  
  - **Yes** → *Leaf 6: **Rignano Scheme***  
    *Most awkward commitment:* Lets wealthy families consolidate power for one generation (e.g., a Rockefeller passing to children) but not beyond (e.g., to grandchildren).  
  - **No** → *Leaf 7: **Annual Wealth Tax (Fair Race Focus)***  
    *Most awkward commitment:* Imposes ongoing costs on family businesses, potentially hindering growth.  

