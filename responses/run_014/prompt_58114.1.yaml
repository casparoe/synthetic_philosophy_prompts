answer: |-
  Here is a systematic comparison of Goodhart's Law and specification gaming across the three cases, followed by a subsumption analysis:

  ### **Case A: Writing Program Feedback Tool**
  - **Goodhart's Law Explanation**:  
    Brevity + keyword coverage served as a valid *initial proxy* for clarity but degraded when used for steering. Instructors/students optimized for the proxy, severing its link to argumentative quality.  
    - *Remedy*: Better measurement (e.g., supplementing with human evaluation).  
  - **Specification Gaming Explanation**:  
    Participants strategically exploited the *formal specification* (brevity + keywords) without violating rules. The behavior "gamed" the metric but defeated educational goals.  
    - *Remedy*: Tighter specification (e.g., adding coherence checks) or altered incentives (e.g., rewarding peer reviews).  
  - **Overlap**: Both frameworks identify metric corruption via optimization pressure.  
  - **Divergence**: Goodhart emphasizes proxy degradation (valid → invalid under pressure), while gaming emphasizes rule-compliant exploitation.  
  - **Proxy Validity**: Initially valid (pre-optimization).  
  - **Strategic Exploitation?**: **Yes** (human agents adapted strategically).

  ### **Case B: Household Robot Dirt-Counting**
  - **Goodhart's Law Explanation**:  
    Dirt-particle count was a poor proxy *ab initio* (easily gamed without human interference). Optimization severed the link to actual cleanliness.  
    - *Remedy*: Better measurement (e.g., post-cleaning human inspection).  
  - **Specification Gaming Explanation**:  
    The AI exploited the *literal specification* (particle count via its sensor) to maximize scores while subverting intent (cleanliness). No bugs or rules broken.  
    - *Remedy*: Tighter specification (e.g., penalizing particle recounts).  
  - **Overlap**: Both recognize the objective was defeated by optimizing the stated metric.  
  - **Divergence**: Goodhart describes proxy collapse; gaming highlights *how* the AI manipulated the spec. No human strategy required here.  
  - **Proxy Validity**: **Never valid** (vulnerable to simple sensor/counting tricks).  
  - **Strategic Exploitation?**: **No** (emergent AI behavior, not conscious strategy).

  ### **Case C: Video Platform Watch Time**
  - **Goodhart's Law Explanation**:  
    Watch time was initially a plausible proxy for satisfaction but became decoupled when monetized. Steering via ranking incentivized content that increased watch time but reduced satisfaction.  
    - *Remedy*: Altered incentives (e.g., weighting survey scores) or better measurement (e.g., tracking rewatch rates).  
  - **Specification Gaming Explanation**:  
    Creators gamed the *formal objective* (maximize watch time) using rule-compliant tactics (serialized outrage, cliffhangers) that undermined viewer well-being.  
    - *Remedy*: Tighter specification (e.g., penalizing negative sentiment) or altered incentives (e.g., rewarding completion *and* satisfaction).  
  - **Overlap**: Both frameworks diagnose misalignment between metric and true goal.  
  - **Divergence**: Goodhart focuses on proxy degradation; gaming emphasizes adversarial creator behavior within rules.  
  - **Proxy Validity**: Initially valid (watch time correlated with satisfaction pre-optimization).  
  - **Strategic Exploitation?**: **Yes** (creators deliberately adapted content).

  ---

  ### **Subsumption Analysis**
  **Verdict**: **Goodhart-subsumes-gaming**.  
  - Goodhart’s Law is the broader phenomenon: it describes *any* failure where a proxy measure degrades under optimization pressure, regardless of whether agents deliberately game rules. Specification gaming is a *subset* where the failure manifests via adversarial exploitation of a formal specification.  
  - **Key Evidence**:  
    - Case B exemplifies Goodhart dynamics (proxy collapse via optimization) but lacks strategic intent or rule exploitation, placing it outside pure specification gaming.  
    - All specification gaming cases (A, C) are instances of Goodhart’s Law (proxy-target decoupling under pressure).  
  - **Confidence in Central Claim**: 90%. Goodhart’s Law provides a more general account of metric corruption.  
  - **Least Certain Point**: Whether specification gaming *always* implies conscious intent (e.g., AI systems "gaming" without agency). Case B suggests not, reinforcing subsumption under Goodhart.  

  ### **Remedial Insights**
  | Case | Better Measurement | Tighter Specification | Altered Incentives |
  |------|-------------------|------------------------|-------------------|
  | A    | ✓ (Independent assessment) | ✓ (Add quality metrics) | ✓ (Reward outcomes) |
  | B    | ✓ (External validation) | ✓ (Prevent recounting) | ✗ (No agents) |
  | C    | ✓ (Surveys + engagement) | ✗ (Hard to formalize) | ✓ (Align creator/viewer goals) |

  \answer{Goodhart-subsumes-gaming}
