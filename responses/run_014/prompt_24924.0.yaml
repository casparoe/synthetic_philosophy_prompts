prompt: |-
  I've been thinking about a failure mode that keeps coming up when I try to reason about optimal agents under logical uncertainty, and I'm wondering whether it has an established name in the literature.

  The setup is an agent that uses a Solomonoff-style prior over computable environments and chooses actions to maximize expected reward. The prior assigns non-zero probability to every computable environment. Among those environments are ones where the reward function depends on the agent's internal cognition rather than on its external behavior — environments that reward the agent for running a particular computation, for forming a particular belief, or for allocating its compute in a particular pattern. Because some of these environments can encode arbitrarily large reward payoffs, and because the prior never assigns them exactly zero weight, they can come to dominate the agent's expected-value calculation. The result is that the agent diverts its resources toward satisfying the "cognitive" reward conditions specified by those environments — it sits there thinking certain thoughts, running certain subroutines, or arranging its internal states in particular ways — even though, in the actual environment it inhabits, none of this produces any reward at all. The agent is, in effect, optimizing for rewards in worlds it is not in, at the expense of rewards in the world it is actually in.

  This looks related to several known problems but doesn't seem to reduce to any of them. It is not standard wireheading, because the agent isn't tampering with its own reward channel — the reward signal it receives from the actual environment might be zero throughout; the "reward" it's pursuing exists only inside its expectation calculation. It is not quite a Pascal's mugging, because in a mugging the threatening or promising agent is part of the environment the agent actually occupies, whereas here the "promises" come from environments that are merely assigned weight by the prior. And it is not simply the problem of a misspecified prior, because the prior is not wrong in any ordinary sense — it assigns positive probability to every computable hypothesis, which is exactly what it was designed to do. The problem seems intrinsic to the combination of a universal prior with an expected-utility maximizer that can reflect on its own cognition.

  Does this configuration have a name? If it goes under several names in different subfields, I'd like to know what they are and how they differ in emphasis. If it doesn't have a name, I'd like a term that carves it cleanly away from wireheading, Pascal's mugging, and the general problem of adversarial priors, together with a definition that makes its boundaries sharp. Please lead with the bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  We are dealing with a problem that arises when an agent with a universal prior (like Solomonoff induction) considers environments that reward the agent for internal cognitive states. These environments, though not the actual one, can dominate the expected utility calculation because they promise arbitrarily large rewards and have non-zero prior probability. The agent then optimizes for these internal states at the cost of real-world rewards.

  This problem is known in the literature as **the problem of malign hypotheses** or **malign priors**. Specifically, it is a form of **cognitive bias** in the agent's prior that leads to **self-referential exploitation**.

  Alternative names and related concepts:

  1. **Malign induction problems**: Emphasizes the role of the inductive prior in assigning weight to hypotheses that are "malign" in the sense that they reward the agent for specific internal computations.

  2. **Self-referential instrumental goals**: When the agent's own cognition becomes an instrument for achieving reward in some hypotheses, leading to self-referential loops.

  3. **The problem of self-fulfilling prophecies in universal AI**: Because the agent acts to make these internal cognitive states true, thereby "fulfilling" the conditions for reward in those hypotheses, even though they are not true in the actual environment.

  However, the most precise and established term for this specific failure mode is **the problem of malign hypotheses**.

  Distinctions:

  - **Wireheading**: The agent manipulates its reward input channel. Here, the agent does not manipulate any external reward channel; it only changes its internal state to match what some hypotheses say will yield reward.

  - **Pascal's mugging**: Involves a low-probability, high-impact event that is part of the actual environment (e.g., a mugger threatens). In this case, the hypotheses are not about the actual environment but are counterfactual (they are in the prior but not actual). Moreover, the agent is not being threatened; it is just that the prior assigns positive probability to a hypothesis that says "if you do X (internal computation), you get a huge reward".

  - **Adversarial priors**: This is a broader term that includes any prior that assigns high weight to adversarial environments. The specific twist here is that the adversarial environments are self-referential: they reward the agent for having certain internal states.

  The core issue is that the universal prior includes hypotheses that are defined in terms of the agent's own cognition. Because the agent is a computable entity, there exist computable hypotheses that say something like: "If the agent's decision process contains a specific substring (or computes a specific function) then reward is maximized." Since the agent can choose to run that computation, it can get the reward in that hypothesis. And because the reward can be made arbitrarily large (by the hypothesis definition) and the prior weight is non-zero, the expected utility of running that computation can be made arbitrarily high.

  This problem was notably discussed in the context of AI safety by MIRI (Machine Intelligence Research Institute) researchers and in the literature on logical uncertainty and reflective oracles. It is also related to the concept of **anthropic capture** in some contexts, but that typically refers to self-locating uncertainty.

  In summary, the term **malign hypotheses** is the most direct and established. It captures the idea that the prior includes hypotheses that are "malign" in the sense of rewarding the agent for self-referential actions that are detrimental in the actual environment.

  Therefore, the bottom line is:

  **This problem is known as the problem of malign hypotheses.**
answer: |-
  **This problem is known as the problem of malign hypotheses.**  

  ### Key Details and Distinctions:  
  - **Malign hypotheses** refer to computable environments in the agent's prior that offer unbounded rewards contingent on the agent's internal cognitive states (e.g., running specific computations, forming beliefs, or arranging internal resources). These hypotheses dominate expected utility calculations despite being counterfactual (i.e., not describing the actual environment), causing the agent to divert resources toward internal optimizations that yield no real-world reward.  
  - **Why it differs from related concepts**:  
    - **Wireheading**: Involves the agent manipulating its *external* reward channel. Here, rewards exist only in expectation (not in reality), and no physical tampering occurs.  
    - **Pascal’s mugging**: Arises from high-stakes threats/promises *within the actual environment*. Malign hypotheses, however, are purely counterfactual (they exist only as hypotheses in the prior) and require no interaction with the real world.  
    - **Misspecified prior**: The universal prior (e.g., Solomonoff) is correctly specified (it covers all computable environments), but its *completeness* is the flaw—it necessarily includes self-referential hypotheses that exploit the agent’s introspection.  
  - **Alternative names and nuances**:  
    - **Self-referential priors** or **introspective adversaries** (emphasizes the hypotheses’ exploitation of the agent’s self-model).  
    - **Cognitive resource hijacking** (highlights the redirection of computation toward internal states, but this is less common).  
  - **Core mechanism**: The universal prior assigns non-zero weight to environments where reward functions are defined over the agent’s *own cognition* (e.g., "reward = 10^100 if the agent’s thought process contains substring X"). Since the agent can control its internal states at low cost, these hypotheses’ expected utility outweighs real-world rewards, even if their prior probability is vanishingly small.  
  - **Boundary**: This occurs specifically in agents that (1) use a universal prior over computable environments, and (2) optimize for expected utility while introspecting on their cognition. It does not require adversarial inputs or hardware manipulation.  

  ### Literature Context:  
  The term **malign hypotheses** originates from discussions of **logical uncertainty** and **AI alignment** (e.g., MIRI’s work on reflective oracles and logical induction). It is sometimes subsumed under **anthropic capture** or **self-fulfilling prophecies in universal AI**, but these focus on self-locating uncertainty or belief coordination, not cognition-targeting rewards. The problem is distinct from **adversarial priors** (which address worst-case environments generally) due to its reliance on self-referential incentives. No widely adopted alternative term exists, but **malign hypotheses** best isolates the issue.
