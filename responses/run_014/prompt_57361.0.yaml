  Right, each question must name a concrete feature of the proposal. For example, when addressing capture risk, I should specifically mention the "permanent clerical service" rather than vaguely discussing bureaucracy. And every question needs a predicted one-sentence reply plus a follow-up that advances the argument.

  The constraints are tight: no generic interview material, no references, and strict focus on this proposal. I'll need to open with design-specific questions to demonstrate understanding before layering more complex objections that build on earlier answers. 

  For sequencing, I'll start with compulsory service (response problem) and stratification since these are foundational sampling issues. Then move to operational concerns like the clerical service and framing power before tackling higher-order problems like minority representation and ratification failures. The Athenian comparison comes midway since it requires prior understanding of accountability mechanisms. The exclusion question works later as it challenges the sampling frame itself. 

  The term-limit reductio and halfway house questions fit toward the end as they require cumulative understanding of the design's limitations. Closing with disconfirmation forces the guest to name falsifiable criteria - crucial for a proposal claiming empirical superiority.

  For follow-ups, I'll anticipate the guest's likely defenses (e.g., "deliberation transforms preferences") and design counter-questions that press inconsistencies. Like when he invokes non-electoral accountability for the clerical service, asking why that logic doesn't justify replacing the entire legislature with bureaucrats.

  The stratification follow-up is particularly important - if he claims presence changes deliberative dynamics, I'll demand the causal mechanism and test whether he'd accept over-representing minorities, which would break his mirroring principle.

  Throughout, I'll maintain strict adherence to the proposal's mechanics. No tangents about sortition movements or the guest's career. Just razor-focused questions that only this specific design could provoke.
answer: |-
  Here are eleven tightly focused interview questions addressing the specified design features, incorporating all requested lines of attack and sequencing logic:

  1.  **Compulsory Service & Response Problem:** Your design relies on compulsory service with narrow hardship exemptions. Since refusal is non-random (e.g., caregivers, gig workers, the distrustful might disproportionately decline), what specific properties does your stratification *actually* guarantee in the realized Chamber, and what demographic or attitudinal biases does the acceptance process likely introduce that stratification alone doesn't fix?  
      *Likely Reply:* "Stratification ensures the Chamber mirrors the population on key demographics; deliberation transforms initial preferences, mitigating minor self-selection biases."  
      *Follow-up:* Given that refusal could be systematic, not minor, is there a threshold of service uptake (e.g., below 60%) where you'd concede the Chamber ceases to be a representative sample at all, and what data would convince you that threshold is breached?

  2.  **Permanent Clerical Service & Capture Problem:** The clerical service, unelected and permanent, compiles the expert witness list members vote on. You argue randomly chosen members lack donors or career incentives making them hard to capture. But without repeat play, what prevents capture shifting to the permanent bureaucracy, which *does* have careers, institutional memory, and agenda-setting power via list curation? Isn't the clerical service the real legislature?  
      *Likely Reply:* "The clerical service is strictly administrative; members freely choose witnesses from a diverse, vetted list, retaining autonomy."  
      *Follow-up:* If the clerical service's power lies in framing the initial menu of options and information, and members have only four years to master complex policy, isn't their 'free choice' heavily constrained by the bureaucracy's unseen influence? How is this superior to an openly technocratic body?

  3.  **Four-Year Non-Renewable Term & Term-Limits Reductio:** Critics argue term-limited legislatures suffer institutional amnesia and become dependent on staff/lobbyists. Your Chamber has a single four-year term – the ultimate term limit. What specifically in your design prevents these well-documented pathologies from applying with maximum force?  
      *Likely Reply:* "Four years is sufficient for members to develop expertise through intensive deliberation and briefing; the lack of re-election pressure fosters independence."  
      *Follow-up:* Where does that briefing expertise come from if not the permanent clerical service or external experts with their own interests? Doesn't this create precisely the dependence on unelected permanents you seek to avoid?

  4.  **Athenian Accountability Transfer:** Athenian sortition relied on robust ex-post accountability (dokimasia, euthyna) and a sovereign Assembly. You cite Athens but omit these. If Athenian accountability was effective precisely because it was ex-post and non-electoral – aligning with your point – why not incorporate similar auditing or censure mechanisms into your Chamber?  
      *Likely Reply:* "My point is precisely that robust non-electoral accountability is possible; the Athenian model shows authorization and accountability can be separated."  
      *Follow-up:* If adding Athenian-style audits or a post-tenure review panel would enhance accountability without elections, as you concede, why exclude them from your initial design? Doesn't this omission risk making your Chamber *less* accountable than its Athenian counterpart?

  5.  **Stratification Variables & Minority Presence vs. Power:** Your stratification ensures proportional *presence* for groups (by region, income, etc.). But elections can grant geographically concentrated or pivotal minorities *decisive power* worth bargaining with. Why is mere presence preferable to potential pivotal power for ensuring minority interests are addressed?  
      *Likely Reply:* "Presence changes the deliberative dynamic; minority voices force the majority to confront different perspectives and offer reasons acceptable to all, leading to better outcomes."  
      *Follow-up:* What's the causal mechanism ensuring this isn't just the majority restating its preference in more palatable language? If presence changes reasons, would you accept a design giving small groups *more* than their population share of seats to amplify this effect, even if it breaks strict mirroring?

  6.  **Absolute Veto & Ratification Record:** Past citizen assemblies (e.g., BC, Ontario) produced proposals rejected by voters. You judge by output, not uptake. But your Chamber has an absolute veto on ordinary legislation, removing any public ratification. Walk me through what happens when the Chamber vetoes a deeply popular emergency bill or a critical budget measure – with no appeal to voters or elected body.  
      *Likely Reply:* "The Chamber's legitimacy comes from its representative composition and deliberative process, not retrospective voter approval. Vetoes would be rare and based on reasoned judgment after expert input."  
      *Follow-up:* If the Chamber vetoes a bill responding to, say, a pandemic or natural disaster that polls show 80% of the public supports, based on its internal deliberative judgment, how does this not create a profound crisis of democratic legitimacy with no peaceful resolution mechanism?

  7.  **Clerical List & Framing Power:** Members get to choose expert witnesses, but only from a list curated by the permanent clerical service. In complex policy areas new to them, what makes this choice meaningfully autonomous, rather than simply selecting from a pre-framed menu devised by unelected officials?  
      *Likely Reply:* "Members retain ultimate decision-making power. The clerical service ensures a range of credible viewpoints are presented, but members drive the inquiry."  
      *Follow-up:* If the clerical service defines the scope of the 'menu' and the criteria for 'credible' witnesses in a policy domain the members are novices in, doesn't this grant the bureaucracy significant, invisible agenda-setting power over what questions get asked and what solutions are conceivable?

  8.  **Sampling Frame (Electoral Register) & Exclusion:** The Chamber mirrors the *electorate*, excluding children, non-citizen residents, and the disenfranchised – all governed by its laws. Shouldn't the sampling frame include everyone subject to the law?  
      *Likely Reply:* "Practicality requires a clear register; the electorate embodies the sovereign demos authorizing the laws."  
      *Follow-up:* If we *could* widen the frame to include all residents, how would you stratify on key variables like income or education for children or those not on tax rolls? And doesn't including non-voters fundamentally sever the Chamber's claim to represent the *authorizing* demos?

  9.  **The Halfway House Problem:** If random selection better tracks public judgment on contested values, why restrict it to just the Chamber? Why not sort central bank boards, constitutional courts, or pandemic task forces too?  
      *Likely Reply:* "Legislatures resolve fundamental value conflicts; technical bodies implement settled goals. Sortition is suited for the former."  
      *Follow-Up:* Take a live case like setting a national debt-to-GDP cap, a capital requirement for banks, or an essential health benefits threshold. These fuse technical and moral judgments. By what clear, operational criterion do you assign such hybrid decisions *exclusively* to the sorted Chamber versus a technocratic body?

  10. **Prohibition on Party Groups:** You ban party groups to prevent factional discipline. But without parties, how do members efficiently organize information, build coalitions across diverse issues, or develop coherent policy alternatives amidst complexity, especially given their short tenure?  
      *Likely Reply:* "Committees organized by lot and open deliberation foster issue-based coalitions and genuine consensus, free from partisan distortions."  
      *Follow-up:* Doesn't the absence of stable coalitions or shared platforms risk making the Chamber's output incoherent or paralyzed, especially on cross-cutting issues, and increase individual members' vulnerability to manipulation by well-organized external interests or the clerical service?

  11. **Disconfirmation Question:** Before adopting this, what real-world comparison could test its superiority? Imagine identical bills with identical testimony put simultaneously to your sorted Chamber and the elected lower house. What specific, measurable outcome *before* seeing the decisions (e.g., amendment acceptance rates, coherence scores, time to deadlock) would constitute evidence against your proposal, making you reconsider it?  
      *Likely Reply:* "I'd look for greater consistency in the Chamber's output with deliberative public reason principles or broader satisfaction metrics among diverse groups."  
      *Follow-up:* But those require post-hoc, interpretive judgments. What *pre-observable, procedural* metric tied to the design's claimed mechanics (e.g., lower variance in individual member votes before/after deliberation vs. the elected house, fewer last-minute rider amendments) would you accept as falsifying evidence if absent?

  **Order Explanation:**  
  I open with **Compulsory Service (Q1)** because it directly challenges the foundational claim of representativeness via sortition, establishing scrutiny of core mechanics. **Clerical Service (Q2)** follows, probing a key operational element and introducing capture concerns. **Four-Year Term (Q3)** builds on Q2's dependence critique. **Athenian Transfer (Q4)** comes next, using his likely appeal to non-electoral accountability to challenge design omissions. **Stratification (Q5)** then addresses representation quality, leading naturally into **Ratification (Q6)** concerning Chamber outputs interacting with the public. **Framing Power (Q7)** returns to the clerical service theme post-Q2/Q3. **Sampling Frame (Q8)** tackles a distinct structural exclusion. **Halfway House (Q9)** and **Party Ban (Q10)** address broader institutional coherence, requiring understanding built from prior answers. **Disconfirmation (Q11)** closes by demanding falsifiable criteria, relying on the preceding exploration of the design's claims and limits. This sequence moves from sampling fundamentals to operational risks, to representation/legitimacy, to systemic coherence, culminating in a testable claim.
