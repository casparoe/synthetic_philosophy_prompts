answer: |-
  Here are eight interview questions addressing your specified themes, each with a targeted follow-up:

  ### Core Questions
  1. **(On retrospective identification)**: "You've argued that mathematical structures like Fresnel's equations 'survive' theory change. But since we identify *which* structures persist only retrospectively—after new theories emerge—doesn't this undermine structural realism’s claim to offer a stronger *inductive* defense against PMI than entity realism? Aren’t we still cherry-picking post-hoc successes?"  
     → *Likely follow-up (if she concedes retrospective filtering):* "If structural continuity is only visible in hindsight, does this reduce structural realism to a rational reconstruction of scientific progress rather than a predictive framework?"

  2. **(Reformulating PMI against structure)**: "Critics like Psillos note that past theories weren’t just wrong about *entities* but often about *structure*—e.g., Newtonian gravity’s action-at-a-distance vs. GR’s spacetime curvature. Why isn’t this a fatal ‘structural meta-induction’ showing that today’s structures (like quantum wavefunctions) will likely be discarded too?"  
     → *Likely follow-up (if she distinguishes structure types):* "When you say only *specific kinds* of structure (e.g., relational, not metaphysical) survive, how do we identify those *in advance* without begging the question against PMI?"

  3. **(No-miracles for structure vs. PMI)**: "The standard no-miracles argument says scientific success would be miraculous without approximate truth. PMI retorts that past ‘successful-but-false’ theories make this circular. How does claiming *structural* (not full ontological) truth avoid that circularity? What makes structural success *less* ‘miraculous’ under PMI?"  
     → *Likely follow-up (if she emphasizes partial continuity):* "But if structures are only *partially* preserved (e.g., Fresnel’s equations under maxwellian boundary conditions), does ‘structural truth’ reduce to ‘truth in certain limits’—and if so, is that enough to block the miracle charge?"

  4. **(Epistemological vs. Ontological SR)**: "PMI targets theories’ ontological claims. Ontic Structural Realism (OSR) says *only* structure exists, while Epistemic (ESR) says we can only know structure. Which does PMI actually threaten more—and does adopting OSR over ESR immunize you against PMI by rejecting ‘entities’ altogether?"  
     → *Likely follow-up (if she favors OSR):* "If OSR eliminates entities, how do you reconcile this with working scientists’ indispensable use of entity-based reasoning (e.g., electrons in labs)? If ESR, how does knowing ‘structure alone’ explain success without smuggling in entities?"

  ### Advanced Extensions
  5. "Structural realists often cite continuity in equations. But theories also rely on *non-mathematical* structure (e.g., causal graphs). Should structural realism encompass these—and if not, does privileging equations risk a form of physics-centric bias?"  
     → *Follow-up:* "Could expanding ‘structure’ beyond math make SR *more* vulnerable to PMI, given the instability of non-formal structural commitments?"

  6. "Ladyman’s ‘rainforest realism’ emphasizes structural *relations* over individual theories. Does this view—where structure exists in models, not theories—dissolve PMI by making continuity a feature of scientific modeling itself?"  
     → *Follow-up:* "If structure is model-relative, doesn’t this retreat to instrumentalism about theory choice?"

  7. "Hacking’s entity realism argues we can trust entities we manipulate (e.g., electrons) but not theories. How would you persuade an entity realist that structural realism better resists PMI when their position also claims selective continuity?"  
     → *Follow-up:* "If structural realism and entity realism *both* appeal to selective survival, is their dispute merely terminological?"

  8. "Looking ahead: If future theories revolutionize structure (e.g., quantum gravity), what would falsify structural realism? Or is it insulated by always ‘redescribing’ survival post-change?"  
     → *Follow-up:* "Does this flexibility risk making structural realism unfalsifiable and thus non-empirical?"

  ### Key Rationale
  - **Depth**: Questions pressure SR’s core tensions (e.g., retrospectiveness in Q1, structure-type ambiguity in Q2).  
  - **Follow-ups**: Designed to probe weaknesses in likely defenses (e.g., challenging partial continuity in Q3, OSR’s applicability in Q4).  
  - **Flow**: Opens with PMI challenges, pivots to SR’s internal distinctions (OSR/ESR), then tests boundaries (non-mathematical structure, falsifiability).  

  These questions avoid summarization by forcing the guest to defend SR’s *mechanisms* for escaping PMI while highlighting its vulnerabilities. The follow-ups ensure the conversation remains rigorous if she gives standard defenses. Good luck with the podcast!
