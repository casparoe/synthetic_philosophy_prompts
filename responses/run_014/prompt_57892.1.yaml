prompt: |-
  I have followed the discussions of futarchy on Hanson’s blog and then on LessWrong and Astral Codex Ten for years, and I am now applying for an eight-week summer grant to turn a lingering worry into a tractable project. My half-formed idea is that pilot proposals for futarchy in a small charter city — for example, using conditional markets to choose among zoning reforms against a two-year index combining land values and resident satisfaction — face less a manipulation problem than a repeal-anticipation problem: traders will price not the effect of the policy if kept, but the probability-weighted effect given that later councils or votes may dilute or reverse it. Please draft a two-page proposal built around this: state a precise research question that isolates repeal-anticipation from ordinary manipulation and myopia, explain why the familiar arguments for and against prediction markets leave it open, outline a concrete eight-week method using decision theory and toy models rather than new empirical work and say why that method is preferable, describe what a successful result would look like and what would count as the project failing, and note what could make the scope unrealistic. Refer to positions and arguments without citations; I will add those myself.
