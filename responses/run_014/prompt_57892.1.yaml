  We are drafting a two-page research proposal on the "repeal-anticipation problem" in futarchy, especially as it might manifest in a small charter city pilot. The core idea is that traders in conditional prediction markets might price not the effect of a policy if it were kept in place, but the effect weighted by the probability that future councils or votes might repeal or dilute it. This is distinct from manipulation and myopia.

  We need:
  1. A precise research question that isolates repeal-anticipation from manipulation and myopia.
  2. Why familiar arguments for and against prediction markets leave this open.
  3. An eight-week method using decision theory and toy models (no new empirical work).
  4. Why this method is preferable.
  5. What a successful result looks like and what counts as failure.
  6. What could make the scope unrealistic.

  Structure the proposal on two pages (approx. 800-1000 words). Since we are not including citations, we can refer to positions and arguments without specific references.

  ---

  **Proposal: The Repeal-Anticipation Problem in Futarchy**

  **1. Introduction and Background**

  Futarchy, as proposed by Robin Hanson, is a form of government in which elected officials define measures of national welfare and prediction markets are used to decide which policies would improve that welfare. The core mechanism involves conditional prediction markets: traders bet on what the welfare metric would be if a given policy were implemented. However, in real-world implementations, especially in small-scale pilots (such as in a charter city), there is a concern that these markets might not capture the true effect of the policy because of the possibility of future policy reversals.

  I have a lingering worry that the dominant challenge in such pilot projects is not the traditional concerns about market manipulation or short-termism (myopia), but what I term the "repeal-anticipation problem." Traders, being rational, will price in not only the expected effect of the policy if it were to remain in force indefinitely, but also the probability that a future council or popular vote might repeal or dilute the policy. This could lead to a distorted signal: the market might undervalue good long-term policies that are politically fragile, or overvalue bad policies that are likely to be reversed quickly, thus undermining the purpose of futarchy.

  **2. Research Question**

  The central research question is: 
  *How does the anticipation of policy repeal in a multi-period setting affect the efficiency of conditional prediction markets in futarchy, and can this lead to systematically biased policy recommendations?*

  This question isolates the repeal-anticipation problem by:
  - Focusing on a dynamic setting where the policy's lifespan is uncertain and subject to future political processes.
  - Holding constant the potential for manipulation (by assuming honest traders) and myopia (by using a welfare metric that is long-term, but whose measurement horizon is truncated by the possibility of repeal).
  - Comparing the market's predicted welfare effect (which includes repeal risk) to a counterfactual "true" effect (which assumes the policy remains in place for its full intended duration).

  **3. Why Familiar Arguments Leave the Problem Open**

  Proponents of prediction markets often argue that they efficiently aggregate information and are robust to manipulation when sufficiently liquid. Critics raise concerns about manipulation, irrational trading, and short-termism. However, both sides typically assume that the market is predicting a fixed event (e.g., "what will the welfare metric be at time T?"). 

  The repeal-anticipation problem arises in a different setting: the policy's effect is not fixed because the policy itself may be interrupted. This is a form of "meta-uncertainty" about the very scenario being predicted. Traditional market efficiency arguments do not directly address this because they take the event definition as given. Moreover, arguments against manipulation assume that the event is well-defined and that traders are trying to predict it accurately, but here the event is contingent on future political actions. This contingency introduces a layer of complexity that has not been adequately modeled in the literature.

  **4. Method: Decision Theory and Toy Models**

  Given the eight-week timeframe, the project will employ formal modeling and decision theory rather than empirical work. The method is outlined in three phases:

  **Week 1-2: Problem Formalization**
  - Define a simple multi-period model of futarchy with the possibility of policy repeal. The model will have:
    - A welfare metric that aggregates over time (e.g., discounted cumulative welfare).
    - A policy that, if implemented, affects welfare in each period until repealed.
    - A stochastic process for repeal (e.g., a fixed probability of repeal in each period, or a repeal decision by a future council based on observed outcomes).

  **Week 3-5: Equilibrium Analysis**
  - Analyze the conditional prediction market in this setting. Assume traders are rational and have common knowledge of the model. The market price should reflect the expected welfare conditional on the policy being implemented at time t=0, but accounting for the entire stochastic path of repeal.
  - Derive the market price as a function of the policy's intrinsic effect and the repeal risk. Compare this to the counterfactual welfare effect if the policy were never repealed (the "true effect").
  - Examine how the bias (difference between the market price and the true effect) depends on parameters such as repeal probability, discount rate, and the policy's effect profile over time.

  **Week 6-7: Robustness and Extensions**
  - Test the model's robustness by relaxing assumptions (e.g., allowing for heterogeneous beliefs about repeal risk, or adding a secondary market for repeal probability).
  - Consider extensions: What if the repeal decision is endogenous (e.g., depends on early welfare outcomes)? How does the problem interact with other futarchy design features (e.g., using a bundle of policies)?

  **Week 8: Synthesis and Implications**
  - Summarize findings and their implications for futarchy pilot designs. Suggest potential mitigations (e.g., locking in policies for a minimum period, or adjusting the welfare metric to account for repeal risk).

  **Why this method?** 
  Empirical work would require real-world conditional markets with repeal risk, which do not exist in a controlled setting. Toy models allow us to isolate the repeal-anticipation mechanism and derive clear theoretical insights. Decision theory provides the tools to model strategic traders and equilibrium outcomes. This approach is feasible in eight weeks and addresses the core conceptual issue.

  **5. Success and Failure Criteria**

  - **Successful result**: 
    - We identify conditions under which repeal anticipation leads to significant bias (e.g., for long-term policies with high repeal risk) and quantify the bias.
    - We show that this bias can cause futarchy to reject beneficial policies or accept harmful ones.
    - We propose at least one feasible mitigation strategy that could be tested in a pilot.

  - **Project failure** would occur if:
    - The model becomes intractable and yields no clear insights.
    - Repeal anticipation turns out to be negligible under all plausible parameter values (i.e., the problem is theoretically possible but practically irrelevant).
    - The analysis does not advance beyond well-known results about policy uncertainty.

  **6. Risks to Scope**

  The project could become unrealistic if:
  - The model becomes too complex (e.g., by incorporating endogenous repeal in a way that leads to multiple equilibria or intractable dynamics). Mitigation: Start simple and add complexity incrementally; if necessary, focus on a few key cases.
  - The definition of the "true effect" is ambiguous in the presence of repeal risk. Mitigation: Define the true effect as the welfare under a counterfactual without repeal, which is the benchmark futarchy aims for.
  - The analysis reveals that the problem is deeply entangled with manipulation or other issues. Mitigation: Explicitly hold these factors constant and note the need for future integrated models.

  **Conclusion**

  This project addresses a critical but overlooked challenge in implementing futarchy: repeal anticipation. By developing formal models, we can clarify the problem, quantify its effects, and suggest design improvements for real-world pilots. The insights will be valuable not only for futarchy but for any use of prediction markets in dynamic policy environments.
answer: |-
  ## Research Proposal: The Repeal-Anticipation Problem in Futarchy Pilots  

  ### 1. Introduction and Problem Statement  
  Futarchy proposes using conditional prediction markets to guide policy decisions: traders bet on whether a policy would improve a predefined welfare metric (e.g., land values + resident satisfaction in a charter city). However, pilot implementations face an underappreciated structural flaw distinct from traditional concerns like market manipulation or myopia. I term this the **repeal-anticipation problem**: Traders in conditional markets will price not the policy’s effect *if maintained indefinitely*, but its *probability-weighted effect given the risk of future dilution or reversal* by subsequent councils or votes. This distorts market signals, as traders rationally incorporate political fragility into valuations. For instance, a zoning reform with strong long-term benefits might appear unattractive if traders expect reversal within two years. This proposal aims to isolate and formalize repeal anticipation as a novel failure mode, leveraging decision theory to assess its implications for futarchy’s viability.  

  ### 2. Research Question  
  *Can repeal anticipation cause conditional prediction markets to systematically misprice policy value in futarchy, even in the absence of manipulation or short-term trader horizons, and how might design mitigations alter this distortion?*  

  This isolates repeal anticipation by:  
  - **Excluding manipulation**: Assume actors trade honestly but rationally account for political instability.  
  - **Excluding myopia**: Use a fixed two-year welfare index, eliminating time-discounting incentives.  
  - **Core focus**: Model how uncertainty about *policy persistence* decouples market prices from the policy’s "true" effect (defined as its impact if irreversibly implemented).  

  ### 3. Why Existing Arguments Leave the Problem Open  
  Proponents argue prediction markets efficiently aggregate information when traders are incentivized to be accurate. Critics highlight manipulation risks or myopic incentives. Yet both sides overlook *political contingency*:  
  - **Proponent blind spot**: Efficiency arguments assume the event being predicted (e.g., "welfare if Policy A is implemented") is unambiguous. But if "implementation" could mean partial or temporary adoption, traders must forecast political dynamics beyond policy efficacy.  
  - **Critic blind spot**: Concerns about manipulation focus on malicious actors distorting prices but neglect rational actors incorporating legitimate political risks (e.g., a 40% chance of repeal).  
  - **The gap**: No framework quantifies how repeal risk contaminates policy valuation independently of other flaws. Decision theory is needed to model how rational traders fold multi-period political uncertainty into a single market price.  

  ### 4. Method: Decision Theory and Toy Models (8-Week Timeline)  
  Given the conceptual nature of repeal anticipation and summer grant constraints, I will use abstract modeling instead of empirical data.  

  **Phase 1: Baseline Model (Weeks 1–2)**  
  - Define a stochastic decision tree for a policy’s lifecycle:  
    - **State 0**: Policy adopted; market predicts welfare metric (e.g., \(W\)) over a fixed window (e.g., 2 years).  
    - **State 1**: With probability \(p\), a "repeal shock" occurs at time \(t\) (uniformly distributed in \([0, T]\)), reverting to status quo.  
    - Traders estimate expected \(W\) as:  
      \[
      E[W] = \underbrace{(1 - p) \cdot W_{\text{full}}}_{\text{No repeal}} + \underbrace{p \cdot \left( \frac{1}{T} \int_0^T W_{\text{partial}}(t)  dt \right)}_{\text{Expected repeal effect}}
      \]  
      where \(W_{\text{full}}\) is welfare if unrepealed, and \(W_{\text{partial}}(t)\) is welfare if repealed at \(t\).  
  - Contrast \(E[W]\) with the target value futarchy *intends* to capture: \(W_{\text{full}}\).  

  **Phase 2: Equilibrium Analysis (Weeks 3–5)**  
  - Extend to a game-theoretic model with heterogeneous trader beliefs:  
    - Traders hold subjective priors on repeal probability (\(p_i\)) and repeal-timing distribution.  
    - Derive market-clearing prices under Bayesian updating.  
  - Test sensitivities: How does distortion scale with \(p\), volatility in \(W_{\text{partial}}\), or correlation between repeal risk and policy effectiveness?  

  **Phase 3: Mitigation Designs (Weeks 6–7)**  
  - Model interventions:  
    - **Commitment devices**: "Lock-in" policies for a minimum period.  
    - **Market adjustments**: Augment welfare metrics with repeal-risk penalties.  
    - **Policy bundling**: Test if trading portfolios of policies reduces noise.  
  - Quantify whether distortions shrink below a tolerance threshold (e.g., <5% deviation from \(W_{\text{full}}\)).  

  **Phase 4: Synthesis (Week 8)**  
  - Draft results, highlighting implications for charter city pilots.  

  **Why this method?**  
  - **Feasibility**: Models are tractable in 8 weeks; empirical work would require non-existent pilot data.  
  - **Precision**: Isolates repeal anticipation by controlling variables (e.g., no manipulators).  
  - **Theoretical urgency**: Conceptual clarity must precede empirical tests.  

  ### 5. Success vs. Failure Criteria  
  - **Successful result**:  
    - A tractable model proving repeal anticipation induces >10% price distortion under realistic political fragility (e.g., \(p > 0.2\)).  
    - Identification of mitigation(s) that suppress distortion by ≥50% in base cases.  
    - Generalizable insight: e.g., "Futarchy works best for low-risk policies or with commitment locks."  
  - **Failure**:  
    - Distortion is negligible (<2%) even under high \(p\)—implying the problem is irrelevant.  
    - Models become analytically intractable with no interpretable output.  
    - Mitigations require unrealistic constraints (e.g., 99% lock-in rates).  

  ### 6. Risks to Scope  
  - **Unrealistic complexity**: If repeal timing depends endogenously on policy outcomes (e.g., early failures trigger repeal), models may require opaque numerical simulations. *Mitigation*: Start with exogenous \(p\) and add limited feedback loops.  
  - **Ambiguous benchmarks**: Defining "true" policy value (\(W_{\text{full}}\)) is contested if repeal reflects genuine welfare concerns. *Mitigation*: Benchmark against an oracle with perfect policy-effect knowledge but no political foresight.  
  - **Overlap with manipulation**: If traders exaggerate repeal likelihood to sabotage policies, the lines blur. *Mitigation*: Strictly assume truthful beliefs; note overlap as a boundary condition.  

  ### Conclusion  
  This project formalizes repeal anticipation as a distinct threat to futarchy—one invisible to debates about manipulation or short-termism. By modeling how rational traders price political fragility, we can preempt design failures in real-world pilots and propose actionable fixes. Outputs will include a working paper and ready-to-test mitigation prototypes for charter cities.
