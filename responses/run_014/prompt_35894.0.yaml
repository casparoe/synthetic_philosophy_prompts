prompt: |-
  A couple of friends and I have been going down the decision theory rabbit hole lately, and we've run into a wall. Everyone online seems to argue about which decision theory "wins" on particular puzzle cases, but nobody ever states what "winning" is supposed to mean. Before we keep ranking causal decision theory, evidential decision theory and the upstart functional decision theory against each other, I want the spec they're being graded on. So: write the desiderata for an adequate decision theory -- the list of things it has to get right, with the case or consideration behind each requirement.

  To make it concrete, here are the puzzles we've mostly been fighting about. In counterfactual mugging, a perfect predictor flips a fair coin without showing you; if it came up tails, it threatens to destroy your £1000 unless it predicted in advance that you would pay £100 in the heads-world when asked later, and if it came up heads, it asks you for the £100. Paying loses you £100 in the world you're actually in, but you were more likely to receive the offer at all (on the tails branch) if you're the kind of agent who pays. In the XOR blackmail case, an honest predictor sends you a message if and only if either your house has termites (which would cost you £1,000,000 to fix) or it predicts you'll send it £1000, but not both. So if you pay, the message must mean the termites already exist; if you stiff it, receiving the message is evidence your house is fine. Evidential decision theory pays in both cases; causal decision theory refuses in both; the functional crowd claim to refuse the mugging payoff but somehow pay in counterfactual mugging. At least that's my possibly-garbled reconstruction, so correct me if I've mangled the setups.

  Anyway, the desiderata. I'd want things like: not being money-pumped or exploited by agents who can model you; not turning news about the world into levers you pretend to control; doing the commonsense thing in medical-style cases where an action is merely correlated with bad news rather than a cause of it; and maybe one-shot versus repeated-encounter robustness, since a theory that only looks good in exotic single encounters with perfect predictors is suspicious. For each requirement, say what case motivates it and whether it's a genuine demand or just a prejudice of one camp (I suspect "don't pay the blackmail" and "the past is fixed" smuggle in causal-decision-theory intuitions as if they were neutral standards). Most importantly: flag any pair of desiderata that can't be jointly satisfied -- if any adequate theory must both resist exploitation and honour evidential correlations, that tension is the actual result I want to see. Then very briefly run the three theories against the list, but keep the weight on the criteria, not the scorecard. Also, please answer in British English, and no reading lists or citations -- just the reasoning.
reasoning: |-
  Okay, the user is deep into decision theory with friends and hitting a conceptual wall. They're frustrated that everyone argues about which theory "wins" in puzzle cases without defining what winning means. They want clear criteria to evaluate theories like CDT, EDT, and FDT. 

  Hmm, their examples show they've grasped the core puzzles but might be blending nuances - like confusing XOR blackmail's evidence dynamics with counterfactual mugging's precommitment aspect. The real pain point seems philosophical: they suspect existing desiderata aren't neutral but smuggled CDT biases. Smart catch. 

  Right, first I need to disentangle what makes a desideratum legitimate versus tribal. The medical Newcomb case is perfect for this - refusing surgery because it's evidence of cancer is EDT's mistake, but calling it "irrational" isn't just CDT bias; it violates how we expect decisions to handle controllable actions. That's objective. 

  For tension points: the mugging cases reveal the fundamental rift between evidence-tracking and incentive-alignment. EDT pays the blackmail because payment correlates with no termites, but that creates perverse incentives for predictors to exploit you. Can't have both. 

  User's ask about one-shot vs repeated games is sharp. If a theory only works with perfect predictors, it's probably cheating by assuming unnatural conditions. Should flag that robustness. 

  British English check: "maths" not "math", "£" not "$", "plausibly" over "probably". Got it. 

  Biggest lift will be showing desiderata conflicts without taking sides. Like how FDT's precommitment in counterfactual mugging seems wise but might overindex on abstract ideals. Must present tradeoffs neutrally. 

  ...Time to structure. Start with core principles (dominance, control, incentives), then paradox-specific tests, then robustness. For each, name the case and why it's fair game. Conflicts section is crucial - that's their "actual result" ask. Theories comparison stays brief since criteria are the star. 

  Final sanity check: No citations, no reading lists, pure reasoning. User wants the framework, not a literature review. Roger that.
answer: |-
  Right, let's cut through the jargon and define what an adequate decision theory *should* do, using your cases as anchors. The core tension is between **evidential correlations** (using actions as evidence about the state of the world) and **strategic incentives** (setting yourself up to be treated favourably by other agents who model you). No single desideratum is "neutral" – they reflect different intuitions about rational agency – but some feel more fundamental than others. Here's the spec sheet:

  **Core Desiderata (Seem Essential for Basic Agency):**

  1.  **Dominance Respect:** If action A yields a better outcome than action B *in every possible state of the world*, the agent should prefer A.
      *   *Motivating Case:* Basic rationality. Ignoring it makes you vulnerable to trivial exploitation (e.g., choosing £9 over £10 when offered both unconditionally).
      *   *Conflict Potential:* Low. All major theories pass this. Failing it is generally disqualifying.

  2.  **Action-State Separation (or "News vs. Knobs"):** The agent should correctly distinguish between:
      *   An action *causing* a change in the world (a "knob").
      *   An action merely providing *evidence* about the state of the world ("news").
      *   *Motivating Case:* **Medical Newcomb/ Smoking Lesion.** Suppose a lesion causes both a desire to smoke and lung cancer. Smoking itself doesn't cause cancer. EDT refuses to quit smoking because quitting is strong evidence the lesion exists (bad news), ignoring that quitting *cannot cause harm*. CDT/FDT correctly quit, seeing smoking as irrelevant to the lesion/cancer link.
      *   *Conflict Potential:* High. EDT fails here by treating the action (quitting) as news about the lesion, not a harmless knob. CDT/FDT pass.

  3.  **Incentive Compatibility (Under Modelling):** The agent should not be systematically disadvantaged or "money-pumped" by rational agents who can predict its behaviour (like the perfect predictors in your puzzles). Its decision rule should create favourable incentives for others interacting with it.
      *   *Motivating Case:* **Counterfactual Mugging.** The predictor on the tails branch *only pays you £1000 if you are the type who would pay £100 on heads*. Refusing on heads (as CDT does) means you get nothing on tails. Paying on heads (as EDT/FDT can do) signals you are the "paying type," making the tails payoff possible. CDT fails because its refusal prevents the favourable interaction from being set up. FDT arguably passes by "precommitting" to pay, making the tails payoff viable.
      *   *Conflict Potential:* High vs. Evidentialism. EDT often fails here by ignoring how its actions *signal* its type to predictors, making it exploitable. CDT often fails by refusing to "play the game" strategically.

  **Paradox-Specific Tests (Highlight Key Trade-offs):**

  4.  **Blackmail Resistance:** The agent should not pay when payment directly constitutes or confirms the bad outcome, especially when non-payment is safe.
      *   *Motivating Case:* **XOR Blackmail.** Paying £1000 *guarantees* you have the £1,000,000 termite bill (because the message is only sent if termites exist OR you pay, but not both – so paying implies termites exist *and* you pay £1000). Not paying means the message *only* arrived if you *don't* have termites (good news!). Paying is dominated and actively harmful. EDT pays (seeing payment as evidence *against* termites, ignoring the causal/logical guarantee). CDT/FDT correctly refuse.
      *   *Conflict Potential:* High vs. Pure Evidentialism. This desideratum leans causal/logical. EDT fails spectacularly here. It prioritises the (misleading) evidential link over the guaranteed harmful outcome of paying.

  5.  **Counterfactual Value Capture:** The agent should be able to benefit from favourable counterfactual scenarios that depend on it *being the type of agent* who would act a certain way *if* in that scenario, even if it never faces that scenario.
      *   *Motivating Case:* **Counterfactual Mugging (Tails Perspective).** On tails, you *want* the predictor to have predicted you would pay on heads, so it gives you £1000. The only way this happens is if you *are* the type that pays on heads. FDT pays on heads (even though it loses £100 there) *because* that's the type that gets the £1000 on tails. It captures value from the counterfactual heads branch. CDT refuses on heads, so gets nothing on tails. EDT might pay on heads, but for the *wrong reason* (thinking it influences the coin flip or reduces the chance of tails), not to be the favourable type.
      *   *Conflict Potential:* High vs. Myopic Causalism. CDT fails here. It only looks at the actual causal consequences in the current branch. FDT passes by optimising the *function* its decision implements across branches. EDT may stumble into the right action for the wrong reason.

  **Robustness & Pragmatics:**

  6.  **Single-Encounter Robustness:** The theory should perform well even in unique, non-repeated interactions, especially against predictors. Relying on repeated play or reputation-building mechanisms isn't sufficient.
      *   *Motivating Case:* All predictor problems (Mugging, Blackmail). These are designed as one-shot games. A theory needing repeated interactions to justify its behaviour in these cases is missing the point. CDT often appeals to "never paying blackmail" as a rule, but this doesn't robustly handle the counterfactual nature of the mugging.
      *   *Conflict Potential:* Moderate. Theories appealing to long-run rules (sometimes a CDT fallback) struggle here compared to theories like FDT designed for the one-shot predictor context.

  7.  **Plausible Cognitive Demands:** The required reasoning should be feasible for real-world agents. Overly complex logical gymnastics or requiring perfect self-knowledge/prediction are demerits.
      *   *Motivating Case:* General consideration. While idealised, the theory shouldn't require god-like powers. Simpler, more robust heuristics are preferable if they capture the core requirements.
      *   *Conflict Potential:* Moderate. FDT's abstract "optimise your function" can feel more complex than CDT's "maximise local causation" or EDT's "condition on your action".

  **The Inevitable Conflicts:**

  *   **Evidentialism (EDT) vs. Strategic Incentives (FDT/CDT):** This is the core tension. EDT excels at using actions as evidence (passing Medical Newcomb *only if* the lesion is purely evidential, failing if it's causal). But it gets destroyed by Blackmail and fails Incentive Compatibility in the Mugging (even if it sometimes pays). Prioritising evidence blinds it to manipulation and perverse incentives.
  *   **Local Causation (CDT) vs. Counterfactual Value (FDT):** CDT focuses rigidly on the causal levers *in the current situation*. This makes it robust against Blackmail and passes Medical Newcomb. But it fails Incentive Compatibility and Counterfactual Value Capture in the Mugging because it refuses to consider how its *decision rule* affects outcomes in branches it doesn't experience. FDT sacrifices strict local causation for strategic advantage across possibilities.
  *   **"The Past is Fixed" vs. "Being a Favourable Type":** CDT heavily leans on the (true) idea that your current action cannot *causally* affect the past (coin flip, termites). FDT agrees but argues your action *reveals what your decision rule is*, and predictors set up the game based on that rule *beforehand*. This difference explains their split on the Mugging.

  **Brief Theory Rundown Against Desiderata:**

  *   **Causal Decision Theory (CDT):**
      *   **Passes:** 1 (Dominance), 2 (News vs. Knobs), 4 (Blackmail Resistance), 6 (One-Shot? - but fails strategically), 7 (Relatively simple).
      *   **Fails:** 3 (Incentive Compatibility - exploitable), 5 (Counterfactual Value Capture). Rigidly causal, ignores strategic type-signalling.
  *   **Evidential Decision Theory (EDT):**
      *   **Passes:** 1 (Dominance - usually), 5? (May stumble into Counterfactual Value, but for wrong reasons).
      *   **Fails:** 2 (News vs. Knobs - Medical Newcomb), 3 (Incentive Compatibility - exploitable), 4 (Blackmail Resistance - pays catastrophically), 6 (Fails strategically one-shot). Overly focused on evidence, blind to manipulation and causation.
  *   **Functional Decision Theory (FDT):**
      *   **Passes:** 1 (Dominance), 2 (News vs. Knobs), 3 (Incentive Compatibility), 4 (Blackmail Resistance), 5 (Counterfactual Value Capture), 6 (One-Shot Robust).
      *   **Potential Stumbles:** 7 (Plausible Cognition? - Can feel abstract/complex). Aims to satisfy all core desiderata by optimising the agent's output function across all possible inputs/scenarios.

  **The Bottom Line:** The fundamental trade-off is between **evidential accuracy** and **strategic invulnerability**. An adequate theory *must* pass **Dominance** and **Action-State Separation (News vs. Knobs)** to be minimally functional. Passing **Incentive Compatibility** and **Counterfactual Value Capture** is crucial for thriving in environments with predictors or agents modelling you, but this inherently requires looking beyond strict local causation in a way that conflicts with a naive "past is fixed" intuition. **Blackmail Resistance** acts as a key test against naively paying for evidence. **Robustness** and **feasibility** are practical concerns. No theory perfectly satisfies all intuitions; choosing involves prioritising which aspects of agency (evidence handling vs. strategic positioning) are most critical. FDT attempts the broadest coverage by making the agent's decision rule itself the object of optimisation.
