prompt: |-
  I'm a PhD student in moral philosophy and I've been stuck on a point all week that I'd realy like a second pair of eyes on. We're working through Hume's account of why promises bind, and I keep coming back to the fact that he classifies fidelity to promises as an "artificial" rather than a "natural" virtue. As I understand it, that means the whole practice of promising is a human convention — something we invented because it's useful, not something grounded in any natural moral sentiment. And I've also read that Hume grounds the artificial virtues in their utility, which is exactly what's throwing me off, because utility sounds so prudential to me. So doesn't that just make promise-keeping prudential? Like, we only keep promises to avoid the social costs of being seen as untrustworthy, and the so-called "binding force" is really just fear of reputational damage. If that's right, why does anyone treat promise-keeping as a genuine moral requirement rather than a strategic rule? I was discussing this with a classmate and she kept saying Hume "insists" that artificial virtues are still proper moral virtues, but I can't see how a practice, wich is purely conventional, could generate a genuine moral obligation, so I'd appreciate it if you could walk me through where I'm going wrong.
reasoning: |-
  Okay, let me try to unpack this PhD student's dilemma about Hume's view on promises. They're really struggling with how a convention-based virtue like promise-keeping can carry genuine moral weight instead of just being a pragmatic tool. 

  First, I need to recall Hume's framework clearly. The distinction between natural virtues (directly from sentiments) vs artificial ones (social constructs) is crucial here. The student seems to grasp that much, but their real confusion lies in how utility transforms into morality. They're worried it reduces to mere prudence - like avoiding bad reputation.

  Hmm, the key might be in how Hume's "utility" operates at two levels. There's the immediate self-interest angle (which the student fixates on), but also the systemic societal benefit. When we label promise-breaking as immoral, we're not just calculating personal costs - we're participating in a collective moral language shaped by the convention's overall usefulness.

  The student's classmate was right to emphasize that Hume insists these are real moral virtues. But I should explain why. It's because the moral sentiment emerges from recognizing how essential the practice is for social cooperation. The "binding force" isn't just fear - it's the internalization of the convention's necessity. 

  I should also address their phrasing about "genuine moral obligation." For Hume, all morality stems from human sentiments and social needs - so "genuine" doesn't require some transcendental source. The artifice is real because we feel it as real through sympathy and education.

  Maybe I should use Hume's property rights analogy. Just like ownership isn't natural but we develop strong moral feelings about theft, promises become morally charged through their social function. The student might be imposing a false dichotomy between "strategic" and "moral" that Hume wouldn't recognize.

  Oh! And I mustn't forget the role of sympathy. When we condemn promise-breakers, it's not (just) self-interest - it's empathetic disapproval of harm to others and damage to social fabric. That transforms utility into moral sentiment.

  The student seems to yearn for some intrinsic "oughtness" in promises, but Hume would say that's backwards - the ought emerges from the practice, not vice versa. Their frustration might stem from wanting morality to be more foundational than Hume allows.
answer: |-
  You've hit upon one of the most fascinating tensions in Hume's moral theory, and your confusion is entirely understandable. Let's break down Hume's account step by step to resolve this puzzle – your intuition about prudential motivation is partially right, but misses how Hume transforms utility into genuine moral obligation through social psychology.

  ### 1. **Hume's Artificial/Natural Distinction (Recap)**
     - **Natural Virtues**: Directly arise from human sentiments (e.g., compassion, gratitude). We instinctively approve of them without social conventions.
     - **Artificial Virtues**: Depend on human conventions invented to solve coordination problems (e.g., justice, property, promises). Approval develops *after* the convention exists.

  ### 2. **Why Promises Are Artificial**
     - Pre-linguistic humans lack a natural instinct to "bind future will." A promise is a performative speech act that *creates* obligation through a shared convention.
     - Without the social practice, "I promise" would be empty words. The obligation is conjured into existence by the institution itself.

  ### 3. **The Utility Prong – Your Prudential Concern**
     You're correct that Hume roots artificial virtues in utility. But crucially:
     - **Utility is collective, not individual**: The convention arises because *society* needs trust for cooperation (trade, mutual aid). Individual prudence (e.g., avoiding reputational harm) is a *consequence*, not the *foundation*.
     - **The "Moral Alchemy"**: Hume’s genius is explaining how collective utility *generates* a new moral sentiment. Here’s how it works:

  ### 4. **From Prudence to Morality: Hume's Mechanism**
     | **Stage** | **Process** | **Why It’s Not *Merely* Prudential** |
     |-----------|-------------|--------------------------------------|
     | **1. Convention Emerges** | People tacitly agree to a practice: uttering "I promise" creates expectation of performance. | *Not moral yet* – it’s a practical solution to coordination problems (like driving on the right). |
     | **2. Sympathy Observes Utility** | Via sympathy (Hume’s psychological mechanism), we *feel* the immense social benefits of promise-keeping: trust, stability, cooperation. | We approve of the *practice as a whole*, not just our personal gain. |
     | **3. Moral Sentiment Develops** | Approval crystallizes into a moral sentiment directed at *individual acts*. We feel disapproval toward promise-breakers, even if no one is watching. | **Obligation emerges**: The act now has intrinsic moral quality via its link to social good. |
     | **4. Education & Habit** | Society reinforces this through moral education, praise/blame, and habituation. | The feeling becomes instinctive – we react to promise-breaking as inherently wrong, not just risky. |

  ### 5. **Resolving Your Dilemma**
     - **Why it’s not *just* fear of reputational damage**:  
       - For Hume, *after* the convention exists, we disapprove of promise-breaking *on principle*. Imagine a secret promise where breach would cause no reputational harm (e.g., a deathbed vow with no witnesses). Hume argues we’d still feel it’s morally wrong because our sentiment has been trained to condemn violations of the convention *as such*.
       - The "binding force" comes from the internalized moral sentiment (cultivated via sympathy with societal utility), not just external sanctions.
     
     - **How convention creates "genuine" obligation**:  
       Moral obligations *are* human constructs for Hume. There’s no Platonic "duty-in-itself." But once the convention exists and sympathy does its work, the obligation is psychologically real and non-prudential. We *feel* bound, and that feeling constitutes the morality.

     - **Analogy: Property Rights**  
       Like promises, property is artificial. We invent "mine/thine" conventions because they’re useful. But once established, stealing feels *morally wrong* – not just imprudent (risk of punishment). The moral emotion is real, even if its origin is utilitarian.

  ### 6. **Why Your Classmate is Right**
     Hume explicitly says artificial virtues become "moral" because:
     - They engage our capacity for moral approval/disapproval.
     - They are evaluated through the "general point of view" (impartial sympathy with societal welfare).
     - They inspire *disinterested* condemnation – we blame promise-breakers even when their actions don’t harm *us* personally.

  ### Where Your Skepticism is Spot-On
  Hume *does* face a challenge: Can a sentiment born of utility fully escape prudential roots? Some critics (e.g., Elizabeth Anscombe) argue Hume reduces morality to enlightened self-interest. But Hume’s response would be:
  > *"When the convention is sufficiently internalized, the moral sentiment operates independently. You keep your promise not because you *fear* shame, but because you *feel* it’s wrong to break it – and that feeling was forged in the furnace of social utility."*

  ### Practical Test for Your Research
  Investigate Hume on the "sensible knave" (Footnote in *Enquiry Concerning the Principles of Morals*). Hume admits a rational egoist *might* break promises when undetectable – but insists this is rare because most people’s moral sentiment is too strong. This tension is where your critique bites hardest – and where contemporary Humeans (e.g., Gauthier) try to refine the theory.

  **Key Takeaway**: For Hume, the "artifice" of promising doesn’t make it less moral; it explains *how morality extends beyond natural instincts*. The obligation is real because human psychology makes it real through socialization. What starts as prudence becomes morality via the alchemy of sympathy and habit.
