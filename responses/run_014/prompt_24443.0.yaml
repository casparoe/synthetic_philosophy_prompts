  The practical leg (c) is about the loss being in the limit with bounded stakes. In finite cases, loss is immediate and certain. Here, loss is guaranteed but only realized after infinitely many transactions. For normative purposes, is this the same? Some might see it as a technical loss, not practical. But if we're idealizing, maybe it still counts. I'd put (c) at 0.6. The user might be underrating the idealization aspect.

