answer: |-
  Right, this is a deeply familiar and frustrating manoeuvre. It's a specific kind of intellectual defence mechanism protecting the *axiom itself* from empirical refutation by constantly shifting the *description* of the decision problem. Let's carve this precisely.

  **The Core Move:** When faced with a choice pattern that appears to violate a fundamental axiom (like Independence or the Sure-Thing Principle), the defender argues that the initial description of the acts, states, or consequences was incomplete. By adding an *implicit* feature (psychological, contextual, probabilistic) to the description, they reconstruct the problem so that the choices *no longer violate the axiom*. The axiom is treated as *logically necessary* and thus incapable of being violated by *properly described* choices. Apparent violations are *always* attributed to descriptive inadequacy.

  **Nearby Concepts & How This Differs:**

  1.  **Framing Effects:**
      *   **What it is:** Choices change based on logically equivalent descriptions (e.g., "90% fat-free" vs "10% fat"). The *information content* is identical, but the *presentation* alters perception.
      *   **Difference:** Your case isn't about logically equivalent *presentations* of the *same* underlying structure. It's about asserting that the initial description *fundamentally omitted relevant structure* (e.g., the psychological cost of regret, an unstated risk of default). The defender claims the *actual* problem had more dimensions than the modeller presented. It's adding new *variables*, not just rewording existing ones.

  2.  **Small Worlds Critique (Savage):**
      *   **What it is:** Savage acknowledged that any formal decision model operates within a limited "small world" abstraction. Real-world decisions involve vast, unmodelled complexities ("grand world"). Choosing within the small world requires the problem to be "separable" from the grand world context.
      *   **Difference:** Savage's point is a *meta-level caution* about the *scope* and *applicability* of any formal model. The move you describe *uses* this inherent limitation not as a caution, but as a *universal shield* for a *specific axiom*. Instead of saying "This axiom might not apply well here due to grand world entanglement," they assert "The axiom *must hold*, therefore the grand world entanglement *must* include feature X, making the axiom hold *in this specific instance*." It turns a limitation into an axiomatic rescue device.

  3.  **Popperian Unfalsifiability:**
      *   **What it is:** A theory is unfalsifiable if no conceivable observation could contradict it. It's immunised against empirical test.
      *   **Difference:** This is **the closest philosophical fit**. The specific move you describe *renders the axiom itself unfalsifiable within the domain of descriptive choice*. By allowing the *description* of the choice problem to be infinitely flexible post-hoc ("You forgot the tax implications!", "You neglected the feeling of certainty!", "The test result signals something else!"), one can always explain away *any* apparent violation. The axiom becomes a tautological truth: "Properly described choices *always* satisfy the axiom." The difference is one of *scope*: Popper worried about whole theories; this is about protecting a *specific normative axiom* from descriptive counterexamples by malleable redescription.

  **The Best Fit & Coining a Term:**

  While deeply related to Popperian unfalsifiability, the move is more specific and operational within decision theory. It directly targets the *link between the formal axiom and the empirical description of choices*.

  **Proposed Term: Axiom Immunisation via Descriptive Enrichment (AIDE)**

  *   **Definition:** The defence of a normative decision-theoretic axiom against apparent empirical violation by arguing that the initial description of the decision problem (acts, states, consequences) was incomplete, and adding postulated features (psychological, contextual, probabilistic) to enrich the description, thereby reconstructing the problem in a way that conforms to the axiom.
  *   **Core Mechanism:** Protecting the axiom by making the *empirical interpretation* of the choice problem infinitely revisable. The axiom dictates how the problem *must* have been structured.
  *   **Key Characteristic:** It treats the axiom as *constitutive* of rational choice, such that any deviation *must* indicate a descriptive error, not an axiomatic flaw.

  **Drawing the Line: Legitimate Enrichment vs. AIDE Rescue**

  The line is thin but crucial:

  *   **Legitimate Enrichment:**
      *   **Evidence-Based:** The added feature is independently motivated by evidence *beyond* simply rescuing the axiom (e.g., well-established psychological phenomena like regret, empirically known contextual factors like tax laws in that jurisdiction, known principal-agent problems).
      *   **Contextually Implied:** The feature was strongly implied or taken for granted within the original problem's stated context and audience understanding (e.g., assuming money has diminishing marginal utility in a standard gamble is often legitimate; adding "fear of explaining" to Allais without prompting is not).
      *   **Parsimonious:** It doesn't require adding complex, speculative, or highly contingent elements solely to force conformity.
      *   **Predictive/Explanatory Power:** The enriched model explains *other* phenomena or makes novel predictions, not just retrofitting this one case.

  *   **AIDE Rescue:**
      *   **Ad Hoc:** The *only* motivation for adding the specific feature is to resolve the *specific* violation of the *specific* axiom in this instance. It lacks independent justification.
      *   **Post Hoc:** The feature is introduced *after* the violation is observed, specifically to nullify it.
      *   **Unfalsifiable in Practice:** The rescuer can always invent *some* plausible-sounding omitted feature (comfort, regret, hidden risk, contextual signal) for *any* observed violation.
      *   **Trivialising:** It reduces the axiom to a tautology ("rational choices satisfy the axiom by definition"), draining it of empirical content and normative force. If *any* choice can be redescribed to fit, the axiom ceases to meaningfully constrain choice at all.

  **In Essence:**

  The move you describe is **Axiom Immunisation via Descriptive Enrichment (AIDE)**. It exploits the inherent gap between formal models and the richness of real-world contexts to shield specific normative axioms (like Independence or STP) from empirical challenge. Legitimate enrichment adds contextually relevant, evidence-based detail. AIDE rescues are ad hoc, post hoc redescriptions whose primary function is to preserve the axiom's inviolability by constantly redefining the target. The key distinction lies in the *justification for the enrichment* and whether it serves any purpose *beyond* protecting the axiom from that particular counterexample. When the *only* reason to add a feature is to make the axiom hold, you're firmly in AIDE territory. It's a conversation-stopper disguised as conceptual refinement.
