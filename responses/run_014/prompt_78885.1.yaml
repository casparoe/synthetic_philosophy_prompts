  Notably, some paths lead nowhere—like affirming collective harm but denying imperceptible wrongness while still seeking a duty source. That's coherent but unattractive, so I'll mark it "unnamed." The expressivist view won't combine cleanly with conditional duties either—that tension deserves flagging.

  The handout will stay within two pages by using concise Q&A formatting. Examples are embedded in branch explanations rather than listed separately to save space. Position names use standard ethics terminology (Parfit, Kagan) except where unnamed. Each leaf's "hardest commitment" exposes its weak spot—e.g., utilitarians struggling with overdetermination, expressivists with hypocrisy charges.

  This structure should let students wrestle with the ethics of trivial-seeming actions while discovering why philosophers disagree. The user's goal—moving beyond "isms" to applied reasoning—feets achieved through case-based branching.
answer: |-
  Here’s a decision tree handout designed for your seminar. It fits on two pages, uses American English, and prioritizes student-friendly questions with real-world examples. Unnamed positions and unexplored branches are flagged.

  ---

  **THE "DOES MY TINY ACTION MATTER?" ETHICS TREE**  
  *Follow the questions down. Your answers will lead to a position on individual duty.*

  ### START: "My single act (burger, flight, vote) makes no perceptible difference."

  #### 1. **What’s the core ethical unit here?**
      *   **A. A single act** (e.g., *this* burger, *this* flight) → Go to **2A**
      *   **B. One person’s long-term pattern** (e.g., *my* overall meat consumption, *my* annual flying) → Go to **2B**
      *   **C. A group’s joint action** (e.g., *our* emissions, *the electorate's* choice) → Go to **2C**

  #### 2A. [From 1A] **Can a single act be wrong even if its difference is imperceptible?** (e.g., Bucket #20 in a 20-person brigade needed to put out the fire)
      *   **Yes** → Go to **3**
      *   **No** → **Leaf: Strict Individualism (No Duty)**  
          *Hardest Commitment:* Explaining why joining clearly harmful groups (e.g., vigilante mobs) is wrong when your individual contribution is tiny.

  #### 2B. [From 1B] **Can a pattern of acts be wrong even if each individual act makes no difference?**
      *   **Yes** → **Leaf: Patternism (Unnamed)**  
          *Hardest Commitment:* Justifying why the *pattern* itself is the wrong-making feature, not the individual acts or their aggregate harm.
      *   **No** → **Leaf: Strict Individualism (No Duty)** (Same as above)

  #### 2C. [From 1C] **Is "the harm" just the sum of individual harms, or something more?** (e.g., Climate change isn’t *just* your emissions + mine + theirs...)
      *   **Just the sum of individual harms** → Go to **2A** (Assess your single acts/pattern within the group)
      *   **Something more – a genuine collective harm** → Go to **2A** (But now collective harm is real)

  #### 3. [From 2A-Yes] **Where does the wrongness come from?**
      *   **A. Its tiny *expected* contribution to harm** (Probability it *might* tip the scale) → Go to **4A**  
          *(e.g., Your vote in a close election; driving knowing emissions add up)*
      *   **B. Being a non-superfluous part of a set causing harm** (You're *part* of the problem) → Go to **4B**  
          *(e.g., Bucket #20 in a 20-person brigade; your burger in a system causing suffering)*
      *   **C. Violating a rule it would be disastrous if everyone followed** → **Leaf: Kantian Rule-Based Duty**  
          *Hardest Commitment:* Explaining why it's wrong even when *no one else* follows the rule (e.g., watering your lawn alone in a drought).
      *   **D. Complicity in or profiting from a harmful practice** → **Leaf: Complicity View (e.g., Young, Kutz)**  
          *Hardest Commitment:* Defining exactly when mere participation (without control) makes one blameworthy (e.g., buying a burger vs. buying blood diamonds).
      *   **E. Expressing flawed values/character** → **Leaf: Expressivist View (e.g., Hill, Anderson)**  
          *Hardest Commitment:* Explaining why the *expression* is wrong even if it causes no harm and you can't change the system (e.g., one voter symbolically supporting a racist candidate).

  #### 4A. [From 3A] **Is the duty to act conditional on others doing their part?** (e.g., Stop watering lawn *only* if enough neighbors do too?)
      *   **Yes** → **Leaf: Threshold Sensitive Obligations (e.g., Parfit, Sinnott-Armstrong - sometimes)**  
          *Hardest Commitment:* Defining the threshold clearly and knowing if it's met (e.g., Is my vote needed *now*? How many stopped watering?).
      *   **No** → **Leaf: Expected Utilitarianism (Act Consequentialism)**  
          *Hardest Commitment:* Demanding constant calculation of tiny probabilities/impacts for every trivial act.

  #### 4B. [From 3B] **Is the duty primarily to abstain, or to organize?** (e.g., Not passing bucket #50 in an *overkill* brigade of 50 vs. Organizing a better fire response)
      *   **To abstain from harmful participation** → **Leaf: Participatory Harm View (e.g., Kagan, Nefsky)**  
          *Hardest Commitment:* Explaining why abstaining matters if the harm happens anyway (e.g., skipping bucket #50 doesn't save the house).
      *   **To work for coordinated change** → **Leaf: Duty of Coordination (e.g., Brennan, Collins)**  
          *Hardest Commitment:* Explaining why you shouldn't *also* abstain unilaterally while organizing (e.g., why keep eating beef while lobbying for meat taxes?).

  ---

  **KEY LEAVES (8 Positions):**
  1.  **Strict Individualism (No Duty):** "It truly doesn't matter, relax." *(Hardest: Vigilante mob member)*
  2.  **Patternism (Unnamed):** "Your *lifestyle* is the problem, not the acts." *(Hardest: Defining the bad pattern)*
  3.  **Kantian Rule-Based Duty:** "What if everyone did that?" *(Hardest: Acting alone when rules are ignored)*
  4.  **Complicity View:** "You’re tainted by the system." *(Hardest: Drawing the complicity line)*
  5.  **Expressivist View:** "It shows who you are." *(Hardest: Harmless symbolic acts)*
  6.  **Threshold Sensitive Obligations:** "Do it only when it counts." *(Hardest: Knowing the threshold)*
  7.  **Expected Utilitarianism:** "Weigh the tiny risks/benefits." *(Hardest: Constant micro-calculations)*
  8.  **Participatory Harm View:** "Don’t be part of the harm." *(Hardest: Abstaining when outcome is unchanged)*
  9.  **Duty of Coordination:** "Focus on changing the system." *(Hardest: Justifying ongoing participation)*

  **UNEXPLORED/EMPTY BRANCHES & NOTES:**
  *   **Branch 2C → 2A:** Leads back to assessing single acts/patterns *within* the group. All paths eventually converge on leaves 1-9.
  *   **Combination Gap 1:** Answering **2A-No** leads *only* to Strict Individualism. (Affirming collective harm but denying imperceptible wrongness while seeking a duty source is unexplored/unnamed).
  *   **Combination Gap 2:** **Expressivism (3E)** doesn't easily combine with **Conditionality (4A/4B)**. Expressivists usually see the expressive wrong as unconditional. This path is flagged as unexplored complexity.
  *   **Deflationary View:** Explicitly captured by **2C** → "Just the sum of individual harms" → leading to Strict Individualism via **2A-No**. (Its core claim is addressed).
  *   **The 5 Cases:** The tree handles all via branch examples: (1) Bucket #20 → 3B/4B; (2) Bucket #50 → 3B/4B (Abstain vs Organize); (3) Driving → 3A/4A; (4) Vote → 3A/4A; (5) Lawn Watering → 3C/4A.
  *   **The 3 Requested Leaves:** Strict Individualism (Leaf 1), Duty of Coordination (Leaf 9), and the Deflationary view (via Branch 2C) are all present.

  **FORMAT:** Print double-sided. Students start at the top and follow their answers down the branches to a leaf position. Each leaf names the view (or "unnamed") and its toughest challenge.
