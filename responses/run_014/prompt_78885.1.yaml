  Hmm, structuring this requires balancing pedagogical flow with philosophical rigor. Starting with the assessment unit makes sense—it's the most intuitive fork. The bucket brigade examples will anchor the "imperceptible harm" branch well. For the wrongness sources, I'll need to map each sub-question to established theories while keeping language accessible (e.g., "expected harm" for utilitarianism rather than "expectation utility"). 

  The conditional duty branch is tricky—it must distinguish between threshold-sensitive cases (lawn watering) and non-threshold ones (car emissions). I'll use the "overkill" bucket brigade case to show when conditionality matters. The deflationary view gets its own final branch since it fundamentally challenges the premise.

  For leaf positions, I'll include: 
