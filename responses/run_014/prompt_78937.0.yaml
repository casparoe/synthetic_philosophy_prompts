  I recall that in philosophy of science, this is often discussed under asymptotic explanations or renormalization group explanations. Asymptotic explanations involve taking a parameter to infinity or zero, leading to an idealized model. The key is that the limit is singular—meaning the behavior changes abruptly at the limit, which isn’t reached physically. 

  For boundary cases, they asked about frictionless planes. That’s a regular idealization because it’s a continuous approximation—real planes with low friction are close to the ideal. But in asymptotic cases like phase transitions, the limit is singular. Near the critical point, properties like specific heat diverge, which only happens at infinity. Finite systems don’t show true divergence, just peaks. 

  Another point is explanatory direction. In asymptotic cases, the idealized model (e.g., sharp boiling point) is derived from the lower theory, but it’s not physically realizable. Real phenomena are explained as approximations to this unattainable ideal. Whereas in regular idealizations, the ideal model is a simplification, and real objects can get arbitrarily close. 

  The user might also be interested in why this matters. For teaching, understanding this helps explain why some concepts (like phase transitions) are taught as sharp despite real-world fuzziness. It highlights how science uses non-existent models for explanatory power. 

  I should also address nearby concepts they want to avoid conflating. Weak emergence involves derivability but with novel properties, while strong emergence claims irreducibility. Here, reducibility is achieved, but to an idealization. Autonomy of higher-level sciences is separate because here the reduction works but lands on an empty set. 

  Renormalization group theory in physics deals with how phenomena change with scale, explaining universality near critical points. But the user might not need the technical details, just the conceptual distinction. 

  So, the term "asymptotic explanation" fits best. It captures the limit process and the gap between the ideal and real. The core features are the singular limit and the non-physical nature of the ideal model. Frictionless planes are regular idealizations because they’re continuous approximations. The mistake would be conflating asymptotic cases with emergence or other idealizations without recognizing the singular limit. 

