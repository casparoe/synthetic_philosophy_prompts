answer: |-
  You've hit upon a profound and specific pattern in scientific explanation that absolutely deserves a name and careful distinction. Your gut feeling about the difference between this and a frictionless plane is spot-on. The concept you're grappling with is most precisely called **asymptotic explanation** or **explanation via singular limit**, particularly when discussed in philosophy of physics and foundations of statistical mechanics. Let's break it down.

  **The Core Concept: Asymptotic Explanation via Singular Limit**

  1.  **Definition:** An explanation where a lower-level theory successfully derives the *existence* and *properties* of a higher-level phenomenon or idealized model **only** by taking a specific parameter (like system size, time, or a constant) to a mathematical limit (infinity or zero) that is **physically unattainable**. The actual, finite/real-world instances of the phenomenon are understood as *approximations* to this unattainable ideal, but the ideal itself *never physically manifests*.
  2.  **The "Empty Landing Spot":** This is the key insight. The reduction doesn't land on the *actual* phenomenon (e.g., slightly fuzzy boiling). It lands precisely on a *mathematical idealization* (perfectly sharp boiling point) that serves as the *explanatory target*. The reduction *explains why this specific, unrealizable ideal is such a powerful approximation for real, messy systems*. The real phenomenon inherits its core character *from* this unattainable limit.

  **Why it's Distinct: Key Features & Boundaries**

  *   **In:**
      *   **Requires a Limit:** Explanation hinges on taking a parameter (`N → ∞`, `t → ∞`, `ħ → 0`, `interaction range → ∞`).
      *   **Singularity at the Limit:** The behavior at the limit is qualitatively different (singular) from the behavior for any finite value. (e.g., Discontinuity vs. smooth crossover, true non-analyticity vs. analytic bump).
      *   **Explanatory Target is Unrealizable:** The phenomenon derived *at* the limit does not and cannot exist physically (perfect sharpness, true irreversibility, exact classicality).
      *   **Real Systems are Approximations:** Real systems are understood as exhibiting the phenomenon *because* they are large/fast/long enough to *approximate* the unattainable limit behavior very well.
      *   **Lower Theory Explains the Ideal:** The lower theory doesn't just predict the real phenomenon; it predicts *why the specific unrealizable ideal model* is the correct one to approximate reality with in this context.
      *   **Examples:** Phase transitions (N→∞), Emergence of exact Thermodynamic Irreversibility from reversible mechanics (N→∞ or t→∞), Emergence of Classical Mechanics from Quantum Mechanics (ħ→0), Emergence of continuous fields/fluids from discrete particles (N→∞, interaction range→∞).

  *   **Out (Common Mistakes & Neighbors):**
      *   **Regular Idealizations (e.g., Frictionless Plane):** This is the crucial distinction your gut sensed.
          *   *Why Out:* The idealization (frictionless motion) is a *simplification* of reality, not derived from a lower theory via a singular limit. Real systems *can* get arbitrarily close to the ideal (make friction arbitrarily small). The behavior changes *continuously* as friction decreases. The landing spot *does* exist (motion with zero friction is physically conceivable, even if hard to achieve perfectly). Reduction (Newtonian mechanics) explains motion *with* friction by adding complexity, not by deriving an unattainable frictionless limit *as the target* from a deeper theory.
      *   **Weak Emergence:** Focuses on whether the higher-level phenomenon/prediction is derivable (in principle) from the lower-level theory, even if computationally difficult. Asymptotic explanation *is* a specific *way* weak emergence can happen, but adds the crucial layer: the derivation *only works perfectly at an unattainable limit*, and the emergent phenomenon *is that limit state*.
      *   **Strong Emergence:** Claims the higher-level phenomenon is fundamentally *not* derivable from the lower-level theory. Asymptotic explanation shows derivation *is* possible, just landing on an ideal.
      *   **Effective Field Theories (EFTs):** EFTs are frameworks *built using* asymptotic reasoning and singular limits (e.g., classical mechanics as ħ→0 limit of QM). Asymptotic explanation is the *logic* used *within* EFTs to connect levels. EFTs provide the mathematical machinery; asymptotic explanation describes the conceptual move.
      *   **Approximations Without Singularity:** Cases where a lower theory approximates a higher one well for finite `N`, and gets better continuously as `N` increases, without a qualitative singularity at `N=∞`. (e.g., Mean-field theories often have this character away from critical points).

  **The Boundary Case: Frictionless Plane vs. Sharp Boiling Point**

  *   **Frictionless Plane:** This is a **Regular Idealization**. It's a useful fiction *imposed* on Newtonian mechanics to simplify calculation. Newtonian mechanics *itself* easily incorporates friction (`F = ma - bv`). Real objects *can* have very low friction, behaving very closely to the ideal. There's no deep reduction *deriving* the necessity of the frictionless plane from a lower theory (like atoms) via a limit; it's a simplifying assumption *within* the same theoretical framework.
  *   **Sharp Boiling Point:** This is an **Asymptotic Explanation**. Statistical mechanics *derives* the existence of a *perfectly sharp* transition *only* in the `N→∞` limit. This sharp transition is the *explanatory target*. Real boiling is fuzzy *because* `N` is finite, but SM explains *why* the sharp ideal is such a good approximation for large pots and *predicts how* the fuzziness (`transition width`) scales with system size (`~1/√N`). The unattainable limit (`N=∞`) defines the phenomenon being explained.

  **Why it Matters & What it Shows**

  This pattern reveals something deep about how science builds understanding:

  1.  **Explanatory Power of the Unreal:** Science often explains the real by rigorously deriving the properties of an unrealizable ideal that the real world approximates.
  2.  **Universality & Robustness:** The fact that vastly different finite systems (different droplet sizes, different fluids near criticality) *all* approximate the *same* singular limit behavior (`Onsager's solution`, `universality classes`) is profound. The limit captures the *essential, universal* features.
  3.  **Bridging Levels:** It's a powerful mode of reduction that doesn't eliminate the higher-level concept (sharp boiling point, irreversibility, classicality) but *grounds* it firmly in the lower level, showing precisely *why* and *how well* the higher-level description works for real systems. The higher-level concept gains its legitimacy *from* the lower-level derivation of the unattainable ideal.
  4.  **Limits of Reduction "In Practice":** While reduction succeeds "in principle" by deriving the ideal, it highlights that for *finite* systems, the higher-level description (thermodynamics, classical mechanics) might remain the most practical or insightful way to describe the phenomenon *as it appears to us*, even as we understand its deeper foundation.

  **In Summary:**

  The specific "shape" you've identified is **asymptotic explanation via a singular limit**. Its hallmarks are: a lower-level derivation that *only* produces the desired higher-level phenomenon (the explanatory target) at a physically unattainable mathematical limit (`N→∞`, `t→∞`, `ħ→0`), where the behavior is qualitatively singular. Real systems exhibit the phenomenon *by approximating* this unrealizable ideal. This fundamentally distinguishes it from regular idealizations (like frictionless planes) where the ideal is a simplification within the *same* level, achievable in approximation, and not derived as a singular limit from below. It's a powerful and common strategy science uses to connect theories across scales, explaining the robust patterns we see as shadows of unreachable mathematical ideals. Your annoyance is justified – it's a subtle but crucial distinction often glossed over!
