prompt: |-
  I administer a grantmaking fund of roughly two million dollars a year, and for several cycles I have scored candidate programs using the familiar three-factor scheme — importance, tractability, neglectedness — multiplying the three and funding in descending order of the product. I have lost confidence in the scheme but not in my own decisions, so I want to work in the other direction: here are the allocations I actually made, with the reasoning I gave myself at the time, and I would like to know what principle, if any, they add up to.

  1. A program delivering a cheap and well-evidenced intervention in a region where three large institutional funders had already committed to covering most of the cost. My grant would have displaced money that was arriving regardless. Not funded, despite top marks on importance and tractability.

  2. The same intervention in a region no funder had entered, where local logistics made reliable delivery doubtful at any scale. Funded, but staged: a small first tranche whose explicit purpose was to test whether the tractability worry was correct, with the remainder conditional on what it showed.

  3. A program addressing a harm I take to be large and a method I take to be workable, which almost nobody pursues because the subject is treated as distasteful or fringe within the relevant research community, to the point that working on it damages careers. Funded generously.

  4. A program addressing a harm I likewise take to be large, which almost nobody pursues because the handful of people who have examined it closely have concluded that the central obstacle is not surmountable by any method now foreseeable. Not funded.

  5. A program whose direct effect is modest but which is highly visible, and where I could identify a mechanism by which my grant would bring several times its own value in follow-on funding within two years. Funded; I counted the follow-on money as most of the value.

  6. A program whose direct effect is likewise modest and whose main function would have been to signal that a cause area is serious, with no mechanism I could name by which other funders' money would arrive sooner or larger than it otherwise would, beyond general enthusiasm. Not funded.

  7. A program in which fifty thousand dollars would buy a large marginal effect, and in which five million dollars would buy perhaps four times that effect rather than a hundred times it. Funded at the lower level only, and I explicitly declined to treat the large version as the same opportunity.

  8. Two programs whose importance rested on a claim I accepted with roughly thirty percent confidence. In one, the claim was empirical — a disputed estimate of a baseline rate. In the other, the claim was moral — a disputed view about whose interests count. I discounted the first out of contention and funded the second. I cannot articulate why the two kinds of uncertainty seemed to me to differ in this way.

  9. A program that scored highest of all on the product of the three factors, which I funded, and which produced almost nothing measurable. I do not regret funding it.

  10. A program I funded two cycles ago and would not fund today, though nothing about its importance or tractability has changed; the only difference is that my own grant, and the attention it drew, made the area considerably less neglected. That verdict feels correct to me, which is awkward, since my having funded it is not evidence against its merits.

  My working hypothesis is that neglectedness has been doing two distinct jobs in my reasoning — an evidential one, as a proxy for how much my grant adds to what would otherwise happen, and a justificatory one, as a measure of how much deference the existing consensus deserves — and that cases 3 and 4 diverge precisely because the two jobs come apart there. I do not know how to keep them apart.

  What I am asking for:

  First, state one or at most three candidate principles precisely enough that a person who is not me could apply them to a program they had never seen. I want inputs, an order of operations, and a rule for what to do when the inputs conflict — not a restatement of the three-factor vocabulary. In particular, a principle whose operative claim is that what really matters is counterfactual impact does not answer my question unless it says how counterfactual impact is to be computed from the information I actually have, which is a description of a program, a budget level, and my views about the other funders in the area.

  Second, for each clause of each candidate, identify which of the numbered cases forced it in.

  Third, generate four further cases of your own on which the principle delivers a verdict I would find unwelcome, and state those verdicts. I am interested in where the principle bites, not in where it flatters me.

  Fourth, say plainly which of my ten verdicts the principle cannot accommodate. If the simplest principle requires me to abandon one member of the pair 3/4 or the pair 5/6, argue which member should go and what I would lose by giving it up; and if you instead prefer a principle that saves both, show me that the complexity it needs is not merely ad hoc bookkeeping.

  Fifth, tell me what the principle implies for a funder who knows that other funders are reasoning the same way. Cases 1 and 10 suggest that neglectedness is not a property of a cause area but of my position relative to everyone else's, and I want to know whether the principle is stable under simultaneous application by several funders who share it, or whether it generates a race that dissolves the very feature it tells them to look for.
reasoning: |-
  Okay, the user is a grantmaker managing a $2 million annual fund. They've been using the importance/tractability/neglectedness (ITN) framework but are losing confidence in it. They provided 10 cases of their funding decisions and want to derive a new principle from those actual choices.

  Hmm, looking at their cases, there are clear patterns where ITN breaks down. Case 1 shows funding doesn't add value when others cover costs. Case 2 demonstrates staged funding when tractability is uncertain. Cases 3 and 4 reveal a key distinction - they fund unpopular ideas with potential but avoid those experts consider truly impossible. 

  Interesting how cases 5 and 6 differ on leverage - they want concrete mechanisms for follow-on funding, not just general enthusiasm. Case 7 shows attention to diminishing returns. Case 8 is puzzling - they treat moral uncertainty differently from empirical uncertainty. Cases 9 and 10 highlight that ITN scores don't guarantee results, and that neglectedness changes after their intervention.

  The user's hypothesis about neglectedness doing double duty seems spot-on - it's both an indicator of counterfactual impact and a measure of consensus credibility. This explains why cases 3 and 4 diverged despite similar neglect.

  For a new principle, the key components should be: counterfactual impact (how much my grant actually changes outcomes), robustness to uncertainty (especially when evidence is thin), and leverage effects (multipliers beyond direct spending). Need to define how to compute counterfactual impact from available info - looking at displacement risk, crowding-in potential, and marginal value at different funding levels.

  The proposed principle has three steps: first estimate counterfactual impact (factoring in displacement and leverage), then assess robustness (handling different uncertainty types), then apply allocation rules for diminishing returns and information value. 

  Testing against their cases: Case 1 fails on counterfactual impact (displacement). Case 2 uses staging to address tractability uncertainty. Case 3 works because lack of consensus makes counterfactual impact high. Case 4 fails on robustness. Cases 5/6 differ on leverage mechanisms. Case 7 follows allocation rules. Case 8's discrepancy comes from robustness treating moral uncertainty differently. Case 9 might pass if information value was high. Case 10 correctly stops when counterfactual impact disappears.

  Now for the hard part - where would this principle bite? First, it might reject high-impact but consensus-driven work (like not funding something similar to case 3 if experts oppose it). Second, it could demand excessive proof of leverage mechanisms, missing opportunities. Third, staging requirements might delay urgent interventions. Fourth, it might undervalue projects with certain but unquantifiable impacts.

  For friction points: Case 8's moral/empirical distinction remains tricky - the principle can't fully justify why they funded one but not the other. Might need to accept that moral uncertainty gets special treatment when it reflects fundamental disagreements rather than missing data.

  On coordination: if all funders use this, it could create races to fund newly neglected areas, ironically reducing neglect faster. But the counterfactual impact measure should adjust for this - as more funders enter, my marginal impact drops, so the principle self-corrects. Still requires careful monitoring of what others are doing.

  The user seems sophisticated about grantmaking philosophy - they're not just seeking validation but wanting rigorous stress-testing. Their frustration with ITN's oversimplification is palpable. Underneath, they might be wrestling with how much to trust expert consensus versus their own judgment, especially on controversial causes. The moral uncertainty case suggests they feel responsible for challenging orthodoxies when ethical stakes are high.
answer: |-
  Based on your cases, your decisions prioritize **counterfactual impact adjusted for robustness and leverage**, not the raw ITN product. Here's a candidate principle structured for operational use:

  ---

  ### **Candidate Principle: The Robust Counterfactual Leverage (RCL) Framework**
  **Inputs:**
  1.  **Counterfactual Impact Estimate (CIE):** Your best estimate of *the difference your specific grant makes* in outcomes, considering:
      *   **Displacement Risk:** % probability your grant replaces funding that would have happened anyway (e.g., Case 1: ~100%).
      *   **Crowding-In Potential:** Expected $ value of follow-on funding directly attributable *via a specific mechanism* triggered by your grant (e.g., Case 5: high via named mechanism; Case 6: low/none).
      *   **Marginal Value:** The value added by *this specific amount* of funding, given current funding levels and diminishing returns (e.g., Case 7: high at $50k, low at $5M).
      *   *Calculation:* `CIE = (Direct Impact + Crowding-In Value) * (1 - Displacement Probability)`
  2.  **Robustness Score (RS):** Confidence-weighted resilience of the CIE to key uncertainties:
      *   **Tractability Uncertainty:** % confidence the intervention works as planned *in this context* (e.g., Case 2: low → triggers staging).
      *   **Importance Uncertainty:** % confidence the targeted outcome is truly valuable (split into Empirical/Moral components).
      *   **Consensus Credibility:** % confidence the existing funding consensus (neglect) is well-justified or flawed (e.g., Case 3: low credibility → higher RS; Case 4: high credibility → lower RS).
      *   *Calculation:* `RS = min(Tractability Confidence, max(Importance Confidence, Consensus Credibility Weight))`  
          *Where Consensus Credibility Weight = 1 - (Your confidence consensus is wrong)*
  3.  **Leverage & Information Value (LIV):** Additional strategic factors:
      *   **Information Gain:** Value of reducing key uncertainties (justifies staging, e.g., Case 2).
      *   **Signaling Value:** Only if tied to a *credible, specific* leverage mechanism (e.g., Case 5 yes; Case 6 no).

  **Order of Operations:**
  1.  **Estimate CIE** for the *proposed grant size*.
  2.  **Assess RS.** If RS < threshold (e.g., <70%), consider:
      *   Staging (small grant to increase RS, esp. on tractability, e.g., Case 2).
      *   Reducing grant size to focus on highest-margin impact (e.g., Case 7).
      *   Rejection if core uncertainty is unresolvable or consensus credible (e.g., Case 4).
  3.  **Apply LIV Adjustments:** Increase effective CIE for high information gain or proven leverage mechanisms.
  4.  **Fund in descending order of:** `Adjusted Value = CIE * RS + LIV`

  **Conflict Resolution:**
  *   Low CIE trumps high ITN (Case 1).
  *   Low RS triggers staging/size reduction/rejection even with high ITN (Cases 2, 4, 7).
  *   High LIV can compensate for moderately low CIE/RS *only* with a concrete mechanism (Case 5).

  ---

  ### **Which Cases Forced Each Clause?**
  *   **CIE (Displacement):** Case 1 (displacement → $0 CIE).
  *   **CIE (Marginal Value):** Case 7 (funding only where marginal value is high).
  *   **CIE (Crowding-In):** Cases 5 & 6 (requires specific mechanism).
  *   **RS (Tractability Uncertainty):** Case 2 (staging to increase confidence).
  *   **RS (Consensus Credibility):** Cases 3 & 4 (divergent funding based on *why* it's neglected).
  *   **RS (Importance Uncertainty - Empirical vs. Moral):** Case 8 (implicitly weighting moral uncertainty differently).
  *   **LIV (Information Gain):** Case 2 (explicit purpose of staging).
  *   **LIV (Signaling Value):** Cases 5 & 6 (requires mechanism).
  *   **Adjusted Value > Raw ITN:** Case 9 (funded despite low measurable output, implies high LIV/RS factors dominated).
  *   **Dynamic CIE (Changing Neglect):** Case 10 (your grant reduced neglect → lowered CIE for others/future you).

  ---

  ### **Unwelcome Verdicts Generated by RCL**
  1.  **High-Impact Consensus Darling (Rejected):** A program with excellent ITN scores in a popular area. RCL estimates 90% displacement risk (many eager funders) → CIE near zero → Rejected. *Feels bad:* Passing on proven impact.
  2.  **Urgent but Uncertain Crisis (Staged/Reduced):** A rapid-onset humanitarian crisis with novel, promising intervention but high tractability uncertainty (RS=50%). RCL mandates a small staging grant for testing → delaying full aid. *Feels bad:* Withholding help during emergency.
  3.  **Unpopular Moral Imperative (Rejected):** A program addressing a harm you believe is vital but with low societal consensus (like Case 3). However, RCL assigns low RS because *your* confidence in the importance claim is low (e.g., 40%) → Rejected. *Feels bad:* Ignoring a moral wrong due to personal doubt.
  4.  **High-Leverage "Hype" Project (Funded):** A program with modest direct impact but a *credible, specific* mechanism to attract 10x follow-on capital from a known funder (high LIV). It outranks a program with higher direct CIE but no leverage. *Feels bad:* Prioritizing fundraising over direct good.

  ---

  ### **Accommodating Your Ten Verdicts & Handling Tensions**
  *   **Accommodates:** Cases 1, 2, 3, 4, 5, 6, 7, 9, 10 are directly explained by RCL inputs/operations.
  *   **Friction Point: Case 8.** RCL *can* accommodate funding the moral uncertainty project (higher RS if Consensus Credibility is deemed low on a moral issue) and rejecting the empirical one (lower RS due to tractability/importance uncertainty). **However,** it doesn't inherently *prescribe* weighting moral uncertainty differently. This reflects your intuition that flawed moral consensus deserves less deference than flawed empirical consensus. **To save both 3 & 4:**
      *   **Keep:** The core distinction in RCL is **Consensus Credibility** *why* neglect exists. Case 3: Neglect driven by taboo/career risk → Low credibility → High RS. Case 4: Neglect driven by credible expert assessment → High credibility → Low RS. This isn't ad-hoc; it's central to evaluating robustness.
      *   **Complexity Justified:** Distinguishing the *reason* for neglect (via Consensus Credibility within RS) is necessary and non-arbitrary. It directly answers the evidential vs. justificatory split you identified. Discarding this (e.g., treating all neglect equally) would force you to abandon the core insight differentiating Cases 3 and 4.
  *   **Recommendation:** Keep the distinction. The complexity (assessing *why* neglect exists) is essential and justified by your own consistent application (Cases 3 vs. 4). Abandoning it would mean funding Case 4-type projects or rejecting Case 3-type projects against your judgment.

  ---

  ### **Implications for Coordinated Funders**
  RCL is **conditionally stable** but requires careful calibration:
  1.  **Stable Core:** The focus on *counterfactual* impact (CIE) inherently adjusts for other funders' actions. If everyone uses RCL:
      *   Case 10 becomes the norm: As one funds successfully, CIE drops for others, preventing overfunding.
      *   Case 1 is reinforced: Funders actively avoid displacement.
      *   High-leverage opportunities (Case 5) get funded efficiently.
  2.  **Race Risks:**
      *   **Information Races:** Funders might rush to fund small staging grants (Case 2) for promising but uncertain areas, potentially duplicating effort or underfunding the scaling phase if CIE drops before full funding is secured.
      *   **Leverage Races:** Funders might overvalue projects with easily quantifiable leverage (even if direct impact is low) if LIV is weighted too heavily.
      *   **Consensus Shifts:** If many funders simultaneously decide an area's neglect consensus lacks credibility (Case 3), a sudden funding surge could occur, temporarily inflating CIE estimates and potentially leading to bubbles before impact is proven.
  3.  **Mitigation:** Stability improves if funders:
      *   Share non-sensitive information on displacement risks and leverage plans.
      *   Use similar RS thresholds and consensus credibility assessments.
      *   Explicitly consider coordination in their CIE estimates (e.g., "If I fund this staging grant, will it deter others from funding needed scale-up?").

  **In essence:** RCL explicitly makes "neglectedness" a dynamic input to CIE and RS, not a static score. It avoids races to dissolve neglect by design, as reduced neglect directly lowers CIE. Coordination mostly impacts the speed and efficiency of discovery (staging) and scaling, not the fundamental stability of the principle.

  ---
  This RCL framework captures the nuanced, strategic, and counterfactual reasoning evident in your cases, moving decisively beyond the limitations of the raw ITN product while providing a replicable operational structure. The key innovations are the explicit calculation of counterfactual impact (beyond displacement), the separation and weighting of different uncertainty types within robustness, and the strict criteria for leverage value.
