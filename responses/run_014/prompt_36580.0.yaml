prompt: |-
  I'm teaching a grad seminar on formal epistemology this term, and we just finished objective chance (Lewis's Principal Principle) and are about to do Reflection (van Fraassen). After last week's session a student hung around and asked me something I've been chewing on ever since, and now I want to see how someone else would organize the whole thing. The two principles look structurally parallel: the Principal Principle tells you to set your credences to match what you take the objective chances to be, conditional on that chance assignment, while Reflection tells you to set your current credences to match what you expect your future credences to be, conditional on having them. Chance on one side, your own future self on the other — both are deference principles, just with a different expert.

  But the failure modes are interestingly different, and this is where I want the comparison to bite. The Principal Principle looks broken when the "expert" isn't independent of your evidence — the old undermining problem, where information about how things will actually go bears on what the chances themselves are, so you can't conditionalize on the chance hypothesis and defer to it in one motion. Reflection looks broken in cases where you can foresee your own irrationality: you know that after the third glass of wine you'll be confident you're fine to drive, but you shouldn't defer to that future confidence now. So one natural diagnosis is that both principles are instances of a single deeper rule — something like "defer to X only if you treat X as an expert" — and neither chances nor future selves get that status for free. My student thinks this makes Reflection the more fundamental one, since self-trust is in some sense built into epistemology from the ground up; I keep wanting to say chance is the real expert and my future self is at best a stand-in for it when I expect to be epistemically lucky.

  So here's what I want from you: compare the two principles seriously, not just note the parallel and move on. Is Reflection really just the Principal Principle in a mirror, or is the disanalogy deeper than the shared structure suggests? Which principle is better defended on its home turf, and can either be repaired using the resources of the other — e.g., can the style of fix people proposed for the undermining problem, where you tinker with what exactly you're conditionalizing on, be ported over to handle Reflection's foreseen-irrationality cases? Take a position and defend it; my student and I have gone back and forth for a week and neither of us will budge, so I'm curious what a tiebreaker looks like. Please don't just survey the literature — I want an actual verdict on which deference principle, if either, deserves the status of the more basic one.
reasoning: |-
  Okay, let's tackle this query. The user is teaching a grad seminar on formal epistemology, focusing on the Principal Principle (PP) and Reflection. They want a deep comparison between the two, especially since their student sees Reflection as more fundamental. The user leans towards chance being the real expert. The key is to resolve whether one principle is more basic or if they're fundamentally different.

  First, I need to recall the structural parallels. Both are deference principles: PP defers to objective chances, while Reflection defers to future credences. Both require conditionalizing on the expert's information. But their failure modes differ—PP fails with undermining futures, Reflection with anticipated irrationality.

  The user mentions that the student argues self-trust is foundational, making Reflection primary. The user counters that chance is the true expert. I need to evaluate which has a stronger foundation. Also, can fixes for PP (like the New Principle) apply to Reflection's issues?

  Looking at PP's issues: Undermining happens when the chance hypothesis affects future events. Lewis's fix involved the New Principle, using chance-conditional chances. But this is ad hoc. For Reflection, foreseen irrationality breaks it. Fixes like conditionalizing on rationality help, but rationality is vague. Here, Reflection might rely on PP if future credences track chances.

  Maybe PP is more basic. Objective chances are external, while future credences are internal. PP's authority comes from metaphysics—chances as law-governed. Reflection's authority is epistemic, relying on rational expectations. But if future selves are rational, they should align with chances. So PP underpins Reflection when rationality is assumed.

  Considering defenses: PP is tied to laws of nature, giving it a solid foundation. Reflection without rationality assumptions is shaky. Fixes for PP are technical but possible; for Reflection, adding rationality conditions works but borrows from rational deference norms, which might themselves rely on something like PP.

  So, PP might be more fundamental because it connects to objective features of the world. Reflection becomes a derivative principle when future rationality is expected. The disanalogy is that chance is inherently expert, while future selves are only conditionally so. Therefore, PP is the more basic principle.
answer: |-
  ### A Verdict on Deference Principles: Principal Principle vs. Reflection  
  Your student’s intuition about structural symmetry is astute, but the disanalogies run deeper than the shared formalism suggests. I argue that the **Principal Principle (PP) is the more fundamental deference principle**, not merely because of its metaphysical grounding, but because it provides the normative bedrock for *any* successful application of Reflection. Reflection, when rational, is best understood as a *consequence* of PP under idealized conditions, not a peer. Below, I defend this by:  
  (1) dissecting the parallels and disanalogies,  
  (2) analyzing failure modes and repairs, and  
  (3) showing why chance is the "real expert."  

  ---

  ### **1. Structural Parallels: Shared Form, Divergent Foundations**  
  Both principles express a *synchronization* of credences:  
  - **Principal Principle (PP)**  
    \( \text{Cr}(A \mid \text{Ch}(A) = x \land E) = x \)  
    *Constraint*: \( E \) is admissible evidence (e.g., historical, not futuristic).  
    *Expert*: Objective chance, a mind-independent feature of the world.  

  - **Reflection Principle (RP)**  
    \( \text{Cr}_t(A \mid \text{Cr}_{t+\delta}(A) = x) = x \)  
    *Constraint*: \( \text{Cr}_{t+\delta} \) is rational/coherent.  
    *Expert*: Your future self, contingent on epistemic health.  

  **The Illusion of Symmetry**:  
  Both principles demand deference to an "expert" conditional on that expert’s authority. But the *source* of authority differs radically:  
  - PP’s authority derives from **metaphysics** (chances govern stochastic processes).  
  - RP’s authority derives from **epistemology** (rational agents avoid self-undermining).  
  This isn’t a mirror—it’s a **telescope**: RP *extends* PP into the temporal domain *only when* your future self reliably tracks chances.  

  ---

  ### **2. Failure Modes: Why the Disanalogy Matters**  
  #### **A. Principal Principle’s Undermining Problem**  
  - **Issue**: If \( E \) includes "undermining futures" (e.g., evidence that a fair coin *will* land heads 90% of times), conditionalizing on \(\text{Ch}(A)=x\) and \(E\) leads to inconsistency.  
  - **Repairs**:  
    Lewis’s "New Principle" (NP) fixes this by deferring to *conditional chances*:  
    \( \text{Cr}(A \mid \text{Ch}(A) = x \land E) = \mathbb{E}[\text{Ch}(A \mid H) \mid \text{Ch}(A)=x \land E] \)  
    Here, \( H \) is the complete history up to \( t \). NP preserves deference by tethering chances to local, non-undermining information.  

  #### **B. Reflection’s Foreseen Irrationality**  
  - **Issue**: If you expect future irrationality (e.g., drunk driving confidence), RP forces absurd deference.  
  - **Repairs**:  
    Van Fraassen’s move: Restrict RP to cases where your future self is rational. But "rational" is vague—does it require *omniscience* or just *coherence*? This risks circularity: RP assumes the very rationality it aims to define.  

  **Crucial Disanalogy**:  
  - PP’s flaw stems from **technical oversimplification** (fixable by refining admissibility).  
  - RP’s flaw stems from **normative fragility** (it collapses without external standards).  
    → PP’s repair is *internal* to chance deferral; RP’s repair *borrows* from external norms (e.g., "rationality" defined by Bayesian coherence or chance-tracking).  

  ---

  ### **3. Why Principal Principle is More Fundamental**  
  #### **A. Chance as the Ground Truth**  
  Objective chances are *exogenous* forces: they govern radioactive decay, quantum events, or stochastic processes irrespective of your beliefs. When you defer to chances, you align with the *structure of the world*. RP, conversely, defers to an *endogenous* projection—your future self’s beliefs. But those beliefs are only worth deferring to if they *themselves* track chances or evidence.  

  #### **B. Reflection Depends on Chance-Tracking**  
  Consider a rational agent who satisfies RP:  
  - \( \text{Cr}_t(A \mid \text{Cr}_{t+\delta}(A) = x) = x \)  
  This holds precisely because they expect \(\text{Cr}_{t+\delta}(A)\) to align with \(\text{Ch}(A)\) or their best evidence. **RP is parasitic on PP**:  
  - If your future self is rational, it’s because they satisfy PP (or its evidential variants).  
  - If not, RP fails—but PP remains intact as a norm.  

  In other words, RP reduces to a *special case* of expert deference where the "expert" is your future self *qua chance-tracker*. This makes PP prior.  

  #### **C. Self-Trust vs. World-Trust**  
  Your student claims self-trust is "built into epistemology." But self-trust is *derivative*: you trust your future self because you expect them to *respond correctly to the world*. PP codifies trust in the world’s stochastic structure; RP codifies trust in your ability to *mirror* that structure. Without PP, RP lacks justification.  

  ---

  ### **4. Can PP-Style Repairs Fix Reflection?**  
  **Short answer**: Only superficially.  
  - **Proposal**: Mimic NP by deferring to *conditional future credences*:  
    \( \text{Cr}_t(A \mid \text{Cr}_{t+\delta}(A) = x) = \mathbb{E}[\text{Cr}_{t+\delta}(A \mid R) \mid \text{Cr}_{t+\delta}(A)=x] \)  
    where \( R \) is "my future self is rational."  
  - **Problem**: What is \( R \)? If \( R \) means "satisfies PP," the circularity is obvious. If \( R \) is primitive, the principle is toothless.  

  **Verdict**: PP’s repair strengthens its expert authority; RP’s repair exposes its dependence on PP.  

  ---

  ### **The Tiebreaker: Why PP Wins**  
  | **Criterion**              | **Principal Principle**                     | **Reflection**                          |  
  |----------------------------|---------------------------------------------|------------------------------------------|  
  | **Source of authority**    | Metaphysical (chances as world-features)    | Epistemic (self as rational agent)       |  
  | **Failure mode**           | Technical (fixable with NP)                 | Normative (requires external standard)   |  
  | **Independence**           | Standalone norm                             | Depends on chance/evidence-tracking      |  
  | **Scope**                  | Universal (applies to all stochastic domains)| Contingent (only if future self is rational)|  

  **My verdict**: The Principal Principle is the *more basic deference rule*. It anchors rationality in the objective world, while Reflection operationalizes it temporally. Chance isn’t just "one expert among many"—it’s the **gold standard for expertise itself**. When your future self deserves deference, it’s because they’ve become a reliable channel for chances or evidence. Teach your seminar that PP is the foundation; Reflection is its elegant, but subordinate, shadow.  

  **Practical suggestion**: Frame Reflection as a dynamic extension of PP—one that works only when agents are *diachronically rational*. This bridges the principles while honoring their hierarchy. If your student resists, ask: *"Would you defer to a future self who you* knew *ignored chances?"* The answer reveals why PP comes first.
