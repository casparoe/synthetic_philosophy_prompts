prompt: |-
  You are a professional philosopher specializing in animal minds and applied research ethics. Think carefully through the trade-offs before you write, beginning with brief private brainstorming in which you map the main moral risks on each side.

  I serve on my university's Animal Care and Oversight Board. We must issue a binding written opinion by next Friday on Protocol 24-17, a year-long comparative learning program proposed by our marine laboratory. Please draft the short opinion memo I can circulate to the Board, with a concrete, actionable recommendation.

  The protocol has three components using the same facility staff and budget:

  1. Problem-solving assays with 12 common octopuses: animals are housed individually, presented daily with transparent puzzle boxes baited with crab meat, then returned to a display tank at year's end. No surgery or noxious stimulation is involved, but housing is confined and handling is frequent.

  2. Avoidance-learning assays with 200 green shore crabs: animals receive brief low-voltage shocks in one arm of a two-chamber tank to test whether they will forgo a preferred dark shelter to avoid the shock, and whether that avoidance is modulated by hunger and by prior exposure to a local anesthetic. A subsample are euthanized for neural tissue analysis.

  3. Reflex assays with fruit flies as a comparison control: brief heat exposure to measure withdrawal, with no additional housing changes.

  For purposes of this decision, take the following summaries as stipulated by our veterinary consultants and do not look for further evidence:

  - Octopuses in this lab show rapid learning, individual strategies that persist across weeks, escape attempts targeted at weak points in lids, prolonged guarding of injured arms, and dose-sensitive responses to general anesthetics used in cephalopods.

  - Shore crabs in this setup show avoidance of the shock-paired chamber, willingness to leave the preferred shelter when shock intensity rises, reduced avoidance after anesthetic, and resumption of feeding and mating behavior afterward, but no wound-directed behavior of the kind seen in the octopuses and no validated anesthetic dose-response curve for this species.

  - Flies show rapid withdrawal and sensitization but no modulation by hunger or competing reward in this setup.

  Our current policy assigns rodent-level protections — required anesthesia review, humane endpoints, enrichment minima, and full-board re-review if mortality exceeds 5% — to all vertebrates plus cephalopods housed in the primate center, but not to cephalopods in the marine lab and not to decapod crustaceans or insects anywhere. Two Board members argue the evidence above warrants extending rodent-level protections to the octopuses and to the crabs in this protocol on precautionary grounds. The researchers argue that extension to crabs would make the sample size unworkable, delay a study relevant to fisheries handling, and set a precedent for regulating all invertebrate work, while extension to octopuses alone would be workable if phased in over six months.

  Your memo should recommend one concrete course of action with a time frame — approve as proposed, approve with specified conditions, approve in part and remand in part, or reject — and state which protections apply to which group, what monitoring and review triggers apply, and how to handle precedent for future invertebrate protocols. It must give reasons the researchers could actually respond to and engage seriously with the strongest consideration on the losing side rather than dismissing it.

  After the memo, append a brief structured summary in the form of a JSON object with exactly these fields: recommendation (one sentence stating the bottom line), protections_by_group (what level of protection for octopuses, crabs, and flies), key_grounds (two to three sentences on the central reasons), strongest_counterconsideration (two to three sentences stating the best point against your recommendation and your reply to it), and review_trigger (concrete condition and date for re-review).
reasoning: |-
  Okay, the user wants me to draft a memo for an Animal Care and Oversight Board regarding Protocol 24-17. They need a concrete recommendation with reasoning that considers ethical trade-offs. 

  First, I need to understand the protocol components: octopus puzzle tests, crab shock avoidance studies, and fly heat reflex assays. The key ethical question is whether to extend rodent-level protections beyond current policy - especially for octopuses and crabs.

  Hmm... the evidence shows octopuses display complex behaviors like targeted escapes and injury guarding. That suggests significant cognitive capacity and potential for distress. For crabs, they show avoidance learning but no complex pain indicators like wound-tending. Flies seem to have simple reflexes only.

  The tricky part is balancing precaution against feasibility. If we require rodent-level care for crabs, the sample size becomes unworkable. But for octopuses, the researchers say they could adapt over six months. That seems like a reasonable compromise.

  I should acknowledge the strongest counterargument: that identical evidence exists for crabs and octopuses regarding anesthesia responses. But octopuses show more sophisticated behaviors suggesting richer subjective experience. That justifies tiered protection.

  The memo needs to be actionable - specify protection levels per species, monitoring triggers, and how this sets precedent. For crabs, maintaining current standards with extra monitoring seems sufficient. Octopuses should get full rodent-level protections phased in.

  Also need to consider how this decision affects future invertebrate protocols. Setting a precedent of evidence-based tiering makes sense rather than blanket rules.

  For the JSON summary, I'll distill the core recommendation and key parameters. The mortality trigger at 3% for octopuses adds precaution without being unrealistic.

  The tone should be professional but engaged - show we've seriously considered all sides while providing clear guidance. Researchers need concrete parameters they can work with.
answer: |-
  **MEMORANDUM**  
  **TO:** Animal Care and Oversight Board Members  
  **FROM:** [Your Name], Board Member  
  **SUBJECT:** Binding Recommendation for Protocol 24-17 (Marine Laboratory)  
  **DATE:** [Current Date]  

  **RECOMMENDATION:**  
  Approve Protocol 24-17 **in part and remand in part**, with the following conditions:  
  1. **Octopuses**: Full rodent-level protections apply immediately (anesthesia review, enrichment minima, humane endpoints). Protocol implementation begins after a 6-month phase-in period for facility upgrades and staff training.  
  2. **Shore Crabs**: Maintain current invertebrate standards (no anesthesia review/enrichment minima), but add: (i) mandatory validation of anesthetic efficacy within 60 days, (ii) daily post-shock behavioral monitoring for 1 hour, (iii) euthanasia if impaired mobility persists >24h post-shock.  
  3. **Fruit Flies**: No additional protections beyond standard invertebrate care.  
  4. **Re-review Trigger**: Automatic re-review if octopus mortality exceeds 3% OR if >15% of crabs show severe stress behaviors (e.g., prolonged immobility, autotomy) during avoidance trials. Deadline: 6 months post-implementation (or upon triggering).  

  **REASONS FOR RECOMMENDATION:**  
  1. **Octopuses**: Observed behaviors (targeted escape attempts, injury guarding, persistent learning) meet criteria for complex sentience per current cephalopod literature. Precaution demands rodent-level safeguards despite confinement/handling stress. The 6-month phase-in addresses feasibility without compromising ethical obligations.  
  2. **Shore Crabs**: Avoidance learning alone is insufficient evidence for vertebrate-equivalent sentience. Absence of wound-directed behavior and lack of validated anesthesia undermine the case for full protections. However, shock exposure and tissue sampling necessitate enhanced monitoring to detect unforeseen distress. Anesthetic validation is scientifically justified.  
  3. **Flies**: Reflexive responses without modulation align with minimal sentience concerns; no additional safeguards are warranted.  
  4. **Precedent**: Future invertebrate protocols will require *evidence-based tiering*: cephalopods automatically receive rodent-level protections; decapods/other invertebrates require species-specific justification for enhanced safeguards based on behavioral complexity, neuroanatomy, and nociception data.  

  **ENGAGEMENT WITH STRONGEST COUNTERCONSIDERATION:**  
  *Counterargument*: Extending identical protections to crabs and octopuses is scientifically consistent, as both show learned avoidance and anesthetic modulation. Denying crabs equal protection ignores potential suffering, delays welfare science for ecologically significant species, and risks moral inconsistency.  
  *Response*: While crabs exhibit avoidance, the absence of higher-order behaviors (e.g., injury guarding, strategic problem-solving) seen in octopuses suggests a qualitative difference in experience. Anesthetic "modulation" in crabs lacks dose-response validation, complicating pain inference. Our conditional approval mandates critical data collection (anesthetic efficacy, stress monitoring) to resolve uncertainty without halting research. This balances precaution with pragmatic progress in crustacean welfare.  

  **CONCLUSION:**  
  Adopt the above conditions to uphold ethical rigor while permitting scientifically valuable research. This approach prioritizes octopus welfare based on strong evidence, advances crab welfare understanding operably, and establishes a scalable precedent for invertebrate oversight.  

  ---  
  **APPENDIX: STRUCTURED SUMMARY (JSON)**  
  ```json  
  {  
    "recommendation": "Approve Protocol 24-17 with rodent-level protections for octopuses (phased in over 6 months), enhanced monitoring but not full protections for crabs, and no additional protections for flies, contingent on specified review triggers.",  
    "protections_by_group": {  
      "octopuses": "Rodent-level (anesthesia review, enrichment minima, humane endpoints)",  
      "crabs": "Standard invertebrate care + anesthetic validation, post-shock monitoring, and mobility-based euthanasia endpoints",  
      "flies": "Standard invertebrate care (no additional protections)"  
    },  
    "key_grounds": "Octopuses show evidence of complex sentience (targeted escapes, injury guarding) warranting precautionary safeguards; crabs exhibit avoidance learning but lack corroborating high-complexity behaviors, supporting tiered monitoring; flies display reflexive responses only. Precedent requires evidence-based tiering for future invertebrate protocols.",  
    "strongest_counterconsideration": "Withholding equal protections from crabs ignores their anesthetic-modulated avoidance, risking moral inconsistency and delayed welfare science. Reply: Anesthetic modulation alone is insufficient without validated dosing or higher-order pain behaviors; mandated monitoring and validation in this protocol will generate critical data to resolve uncertainty without making sample sizes unworkable.",  
    "review_trigger": "Re-review within 30 days if: (1) octopus mortality >3% OR (2) >15% of crabs exhibit severe stress behaviors (e.g., autotomy, >24h immobility). Deadline: 6 months post-implementation or upon trigger occurrence."  
  }  
  ```
