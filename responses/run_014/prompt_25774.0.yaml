prompt: |-
  I'm drafting a paper on consequentialist cluelessness and want to pressure-test my position before I commit to it in writing. Here is where I currently stand:

  (1) Act consequentialism is the correct criterion of rightness: an act is right iff it maximizes expected aggregate welfare.

  (2) The cluelessness problem is genuine and pervasive: for the vast majority of ordinary actions, we cannot form justified, precise credences over their long-term consequences. The causal ripple effects are too complex and too sensitive to unknown initial conditions for us to assign anything like real-valued probabilities to most long-run outcomes.

  (3) A moral criterion and a decision procedure can come apart without inconsistency. The right way to deliberate need not mirror the right-making features of actions — this is the familiar point associated with Mill, Sidgwick, Hare, and others.

  (4) Given (2) and (3), the appropriate decision procedure for everyday life is to follow commonsense moral rules — keep promises, don't lie, be generous within limits — since these rules have been shaped by cultural evolution and individual experience to track welfare reasonably well in the kinds of recurrent situations humans face.

  (5) The correct norm for practical deliberation under uncertainty is to maximize expected utility relative to a precise, real-valued probability function. I hold this as a claim about procedural rationality, not merely as a restatement of the consequentialist criterion.

  (6) When probabilities over outcomes are genuinely indeterminate — not merely unknown but indeterminate, as in Ellsberg-style ambiguity — the correct norm for practical deliberation shifts: among acts whose short-run expected welfare is comparable, we should favor the one whose worst-case long-run outcome is least bad. I take this to be a form of ambiguity aversion operating at the level of decision procedure, not a revision to the criterion of rightness itself.

  Please audit this set of commitments. Specifically:

  - Identify which pairs or subsets are in genuine tension, and which are only apparently in tension.
  - Rank the genuine tensions by severity, and for each, specify what would have to give to restore consistency and what the philosophical cost of that revision would be.
  - For any apparent tension that dissolves on closer inspection, explain why it dissolves and why it might nonetheless be mistaken for a real problem.
  - Identify which of my commitments the overall position depends on most heavily — that is, which assumptions, if dropped or revised, would force the largest restructuring of the view.
  - Finally, for your own assessment, indicate which argument or consideration would be most likely to change your mind about the central tensions you identify, and where your reasoning is most vulnerable to challenge.

  Respond in the style of an expert moral philosopher. Think very carefully before answering, and be precise about where the fault lines actually lie rather than flagging every possible combination.
reasoning: |-
  Okay, the user is working on a paper about consequentialist cluelessness and wants to pressure-test their position. They've laid out six commitments. I need to carefully analyze where tensions might arise, rank them, and identify dependencies.

  First, looking at the commitments: They're defending act consequentialism but acknowledging the cluelessness problem (1 and 2). Then they separate criterion from decision procedure (3), leading to rule-following in daily life (4). They also insist on expected utility maximization as a rational norm (5) and introduce ambiguity aversion for indeterminate probabilities (6).

  Hmm... The most obvious tension is between 5 and 6. Commitment 5 says we must maximize expected utility with precise probabilities, but 6 allows abandoning that when probabilities are indeterminate. This isn't just apparent - it's a direct conflict in the deliberation norm. The user tries to frame 6 as "shifting" the norm, but that implies 5 isn't universally binding. That's a problem because 5 is presented as the correct norm for procedural rationality. If they weaken 5 to apply only when probabilities are determinate, that might work but would require clarifying what "determinate" means - which could be messy.

  Then there's the tension between 1 (act consequentialism) and 4 (following commonsense rules). The user addresses this through the criterion/procedure distinction (3), which is classic indirect consequentialism. But 2 makes cluelessness pervasive, so the justification for rules becomes purely instrumental. The vulnerability here is whether cultural evolution actually produces welfare-tracking rules - if not, the whole approach collapses. That's a major dependency.

  Commitment 3 is crucial here - it's the linchpin allowing 1 and 4 to coexist. Without it, the position would need radical restructuring. 

  The user's treatment of ambiguity aversion in 6 is interesting but creates another issue. They want it only at the procedural level, not affecting the criterion (1). But if we're avoiding worst-case outcomes in deliberation because of indeterminacy, doesn't that implicitly value avoiding bad outcomes over maximizing expected welfare? That might bleed into the criterion itself. 

  For the user's dependencies: Commitment 3 is absolutely vital. Also, 2 (pervasive cluelessness) needs to hold - if we could often estimate long-term impacts, rule-following would lose its justification. And the evolutionary claim in 4 is critical - if commonsense rules don't actually track welfare well, the whole decision procedure fails.

  If I were to challenge this, I'd focus on whether ambiguity-averse deliberation (6) can remain purely procedural without affecting the criterion (1). The user insists it's just about how we think, not what makes acts right - but if our rational deliberation under indeterminacy systematically avoids certain choices that might maximize expected welfare, that seems at odds with act consequentialism. That's where I'd press hardest.
answer: |-
  ## Critical Audit of Your Position on Consequentialist Cluelessness

  Your position is sophisticated and reflects deep engagement with the cluelessness problem. It navigates several complex issues deftly, but genuine tensions exist. I'll follow your requested structure precisely.

  **1. Genuine Tensions & Apparent Tensions:**

  *   **Genuine Tension 1 (Severity: High): Commitment (5) vs. Commitment (6)**
      *   **Nature of Tension:** (5) asserts that maximizing expected utility (MEU) with precise probabilities *is* the correct norm for procedural rationality under uncertainty. (6) asserts that when probabilities are indeterminate (Ellsberg-style), the correct norm "shifts" to a minimax-type rule (favoring acts with the least bad worst-case long-run outcome, given comparable short-run welfare). This directly contradicts the universality and primacy claimed for MEU in (5). It posits a *different fundamental norm* for deliberation under a specific (and pervasive, given cluelessness) type of uncertainty.
      *   **Resolution & Cost:** To restore consistency, you must either:
          *   **Revise (5):** Demote MEU. Restrict its domain to cases of *determinate* uncertainty ("risk"), explicitly acknowledging it's not the universal norm. (6) then becomes the norm for indeterminate uncertainty ("ambiguity"). **Cost:** Weakens the foundational claim of (5), making procedural rationality context-dependent and potentially less elegant. Raises questions about why MEU is "the" correct norm if it's not universally applicable, and how to demarcate "determinate" vs. "indeterminate" uncertainty cleanly in practice.
          *   **Revise (6):** Reinterpret it *not* as a fundamental shift in the norm, but as a heuristic or satisficing strategy *derived from* MEU under extreme uncertainty (e.g., assigning a non-additive "ambiguity premium"). **Cost:** Undermines the core claim of (6) – that ambiguity warrants a *different* rational response. It makes minimax a second-best approximation to an ideal (MEU) we cannot achieve, rather than the genuinely rational response *to that specific epistemic state*. This risks being ad hoc.

  *   **Genuine Tension 2 (Severity: Moderate): Commitment (1) vs. Commitment (4) mediated by (2) & (3)**
      *   **Nature of Tension:** While (3) successfully separates criterion from procedure, justifying (4) in light of (1) and (2), a subtle tension remains concerning *justification*. (1) states the criterion is maximizing *expected aggregate welfare*. (4) prescribes following commonsense rules *because* they track welfare reasonably well in recurrent situations. However, pervasive cluelessness (2) means we cannot reliably assess *whether* following a rule in a specific instance *actually* maximizes expected welfare, even probabilistically. We follow the rules on faith in their *general* tendency, while the criterion judges the act based on its *actual* expected consequences – which may be unknowably divergent.
      *   **Resolution & Cost:** To resolve this, you must fully embrace the **instrumental** nature of the rules in (4). Their justification is *solely* that they are the best available *proxies* for satisfying (1) *given* (2). **Cost:** This highlights a vulnerability: If evidence emerged that following a commonsense rule in a *type* of situation systematically fails to maximize expected welfare (even acknowledging cluelessness), the justification for adhering to it in that type of situation weakens. It also makes the agent's adherence potentially alienating – they follow rules knowing the *real* right-making feature is inaccessible and the rule might be suboptimal in this case.

  *   **Apparent Tension: Commitment (1) vs. Commitment (4)**
      *   **Nature:** Superficially, following rules (4) seems opposed to maximizing expected welfare (1).
      *   **Dissolution:** Commitment (3) explicitly dissolves this. Sidgwick, Mill, et al. established that indirect strategies (rule-following) can be the *best means* to achieve the direct consequentialist end when direct calculation is flawed or impossible. Your appeal to cultural evolution in (4) provides a plausible mechanism for why rules *might* serve this function. It’s not a tension but a *consequence* of the criterion/procedure distinction applied to epistemic limitations.
      *   **Why Mistaken:** Critics might conflate the criterion of rightness with the deliberation process or assume consequentialism *must* be direct. Your position correctly avoids this.

  **2. Foundational Dependencies (Ranked by Impact if Revised/Dropped):**

  1.  **Commitment (3) [Criterion/Procedure Distinction]:** This is the *essential linchpin*. Without it, (1) and (4) become directly contradictory. Dropping (3) forces a collapse into either pure act-consequentialist deliberation (rendered impossible by (2)) or abandoning (1) for a rule-based criterion.
  2.  **Commitment (2) [Pervasive Cluelessness]:** If cluelessness were rare or surmountable, the justification for (4) largely evaporates. The elaborate structure of rules-as-proxy becomes unnecessary. Direct MEU deliberation (aligned with (1) and (5)) would be feasible far more often.
  3.  **The Evolutionary Claim in (4):** The entire viability of (4) as a rational decision procedure hinges on the empirical claim that commonsense rules *do* "track welfare reasonably well" due to cultural evolution/experience. If this claim is false (e.g., if rules are systematically maladaptive, exploitatively biased, or poorly track modern complexities), the justification for (4) collapses, leaving the agent procedurally adrift despite (3).
  4.  **Commitment (1) [Act Consequentialism as Criterion]:** While foundational to the overall *type* of theory, revising (1) to another criterion (e.g., rule-consequentialism, virtue ethics) wouldn't necessarily dismantle the *structure* of your response to cluelessness (separating criterion/procedure, using rules under uncertainty, incorporating ambiguity aversion). The core problem and your procedural solutions could potentially adapt.

  **3. Vulnerability Assessment (My Perspective):**

  *   **Most Central Challenge:** The tension between (5) and (6) is the most philosophically fraught. **The argument most likely to change my mind** is a robust defense of MEU as the *only* rational norm under *all* uncertainty, demonstrating that ambiguity aversion (as in (6)) is irrational bias or can be fully captured within an extended MEU framework (e.g., using subjective state-dependent utilities or specific non-additive probability representations *without* abandoning MEU maximization). If such a defense convincingly shows that (6) is either unnecessary or irrational, your position would need significant revision (likely revising (6) into a heuristic within (5)).
  *   **Key Vulnerability in Your Reasoning:** The core vulnerability lies in **maintaining the purity of the criterion (1) while advocating ambiguity-averse deliberation (6).** You claim (6) is purely procedural. However, if ambiguity aversion (minimax regret/outcome) is the *rational* response to indeterminate uncertainty, why shouldn't this epistemic state affect the *criterion of rightness* itself? Why is the *right* act still defined by an inaccessible expected value calculation, while the rationally *chosen* act is defined by avoiding catastrophe? This creates a potential disconnect where the "right" act (unknowable) could be *systematically different* from the rationally chosen act under pervasive cluelessness. A critic could argue this procedural norm implicitly smuggles a non-consequentialist value (avoiding terrible outcomes regardless of probability/expectation) into the heart of deliberation, straining its claimed neutrality towards (1). Defending this strict separation under deep indeterminacy is your most challenging task.

  **Conclusion:**

  Your position is coherent and represents a serious attempt to grapple with cluelessness within an act-consequentialist framework. The criterion/procedure distinction (3) successfully handles the core challenge of justifying rule-following (4). The greatest internal tension arises from attempting to uphold MEU (5) as *the* rational norm while conceding a fundamentally different norm (6) under indeterminacy. This tension, and the potential bleed between your ambiguity-averse procedure (6) and the consequentialist criterion (1), are the points demanding the most rigorous defense. The viability of the entire approach rests heavily on the empirical validity of the evolutionary claim underpinning (4) and the defensibility of the strict separation mandated by (3) under conditions of profound ignorance.
