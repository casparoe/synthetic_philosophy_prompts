prompt: |-
  I just joined the ethics committee at my hospital and honestly I'm drowning. Every meeting we end up in the same fight: someone says withdrawing a ventillator is killing the patient, someone else says no it's letting them die which is totally different, and then a third person says that distinction doesn't even make sense. Meanwhile the family is in the waiting room and we're debating philosophy.

  I need a decision procedure I can actually use. Not a treatise — something I can run through in my head during a consult. Here's what I need it to do:

  - Tell me whether the doing/allowing distinction actually applies to the case in front of me, or whether it's a red herring.
  - When it does apply, tell me what follows — does the distinction make a moral difference here or not?
  - Flag the cases where reasonable people can disagree about the classification itself (like, is turning off a pacemaker more like withdrawing a vent or more like an injection?).
  - Be honest about where the procedure is just making a value judgment dressed up as analysis.

  I want it grounded in the actual philosophical work on this — Rachels, Foot, Quinn, all that — but I don't need citations, I need something that works.

  Then please run it on three cases we actually see:
  1. Withdrawing a ventilator from a patient who is not brain-dead but has no chance of recovery, at the family's request.
  2. A DNR order for a patient with advanced COPD who would likely survive a cardiac arrest but with severely reduced quality of life.
  3. Palliative sedation that may depress respiration in a terminal cancer patient — the sedation is intended for pain, but everyone knows it might hasten death.

  And tell me where the procedure breaks down or gives an answer I'm not going to like.
reasoning: |-
  Okay, the user is on an ethics committee at a hospital and is struggling with repetitive debates about the doing/allowing distinction in end-of-life decisions. They need a practical decision procedure to cut through philosophical debates and provide clear guidance during consultations. The key requirements are: applicability assessment, moral relevance determination, flagging ambiguous cases, and transparency about value judgments.

  I recall the doing/allowing distinction originates from moral philosophy - the difference between actively causing harm versus permitting harm to occur. The user mentions thinkers like Rachels (who challenged the distinction's validity), Foot (who emphasized intention), and Quinn (who focused on harmful direct agency). Their frustration with abstract debates while families wait is palpable - they need clinical utility, not academic discourse.

  Let me develop a 4-step decision procedure that meets their needs:
  1. Harm Source Analysis: Who/what is causing the underlying pathology? This determines if the distinction even applies.
  2. Intervention Role Assessment: Is the medical action sustaining life against pathology or merely allowing natural death?
  3. Intent & Proportionality Check: What's the primary goal of the action? Is it proportionate to the situation?
  4. Ambiguity Flag: Identifying cases where classification is genuinely debatable.

  Now applying this to their three cases:

  For ventilator withdrawal:
  - Harm source is the underlying disease
  - Ventilator is sustaining life unnaturally
  - Intent is to cease impeding natural death
  - Conclusion: Allowing death, not killing
  - Low ambiguity - should resolve committee debates

  For the COPD DNR:
  - Harm source would be the cardiac arrest
  - CPR is an artificial life-sustaining intervention
  - DNR merely permits natural death
  - Conclusion: Morally permissible allowing
  - Moderate ambiguity - some might see CPR as "normal care"

  For palliative sedation:
  - Harm source is the cancer
  - Sedation manages symptoms but secondarily affects respiration
  - Intent is pain relief, not hastening death
  - Conclusion: Double effect applies
  - High ambiguity - requires careful proportionality assessment

  I should note limitations:
  - The distinction sometimes collapses (as Rachels argued)
  - Cultural/religious perspectives may override
  - Value judgments are unavoidable in steps 3 and 4
  - Legal frameworks may constrain ethical conclusions

  The procedure excels at distinguishing artificial life-support withdrawal from active interventions, but struggles with "gray zone" cases like pacemaker deactivation. It provides clinical clarity while acknowledging its own limits - exactly what this ethics committee member needs to move debates forward.
answer: |-
  Here's a practical decision procedure based on the doing/allowing distinction, distilled from Foot, Quinn, and Rachels, designed for clinical speed. It prioritizes resolving moral relevance over endless classification debates.

  **The DECIDE Protocol (Doing/Allowing: Evaluate Clinically for Informed, Decisive Ethics)**

  1.  **D**etermine the **Source of Harm**: What is *directly* threatening the patient's life *right now*?
      *   **Natural Pathology?** (e.g., cancer, organ failure, infection, irreversible brain injury) → *Allowing/Not Preventing* is the relevant frame. The distinction likely **applies**.
      *   **The Proposed Medical Action?** (e.g., giving a lethal injection) → *Doing/Harming* is the relevant frame. The distinction likely **applies**, but the action is probably impermissible.
      *   **Neither Clearly?** (e.g., ambiguous causation like palliative sedation) → **Flag Ambiguity**. The distinction may be a **red herring**; focus on intent/proportionality.

  2.  **E**valuate the **Role of the Intervention**:
      *   **Is it *overcoming* the natural pathology?** (e.g., antibiotics for infection, ventilator for reversible respiratory failure) → Withdrawing *might* be seen as "allowing" *if* the pathology is the primary threat again. **Proceed to Step 3.**
      *   **Is it *merely sustaining* against an *unbeatable* pathology?** (e.g., ventilator for irreversible respiratory failure due to end-stage ALS, dialysis for irreversible kidney failure) → Withdrawing is **paradigmatically "allowing"** death from the underlying disease. Moral difference **YES** (permitting it is usually ethically acceptable under appropriate conditions).
      *   **Is it an *active introduction* of a new, lethal pathological process?** (e.g., injecting potassium chloride) → This is **paradigmatically "doing/killing"**. Moral difference **YES** (generally impermissible).

  3.  **C**heck **Intent and Proportionality**:
      *   **Primary Intent:** What is the *primary, immediate goal* of the action?
          *   Relieve Suffering? → Favors "allowing" frame or Double Effect.
          *   Cause Death? → Favors "doing" frame.
      *   **Proportionality:** Is the action (or omission) *proportionate* to the patient's condition, goals, and level of suffering? (e.g., Is continued ventilation *disproportionate* burden for a PVS patient? Is palliative sedation *proportionate* to refractory agony?).
      *   **If Intent is ambiguous OR Proportionality is borderline → Flag Ambiguity.** This is where reasonable disagreement persists. The doing/allowing classification itself may be contested.

  4.  **I**dentify **Ambiguity Triggers** (Red Flags):
      *   **"Withdrawing" vs. "Withholding":** Philosophically similar in this context (Quinn). Clinically irrelevant to the core distinction.
      *   **Technology Dependence:** Pacemakers, LVADs, artificial nutrition. **Flag Ambiguity.** Ask: Does it feel more like *removing an obstacle* to natural death (allowing) or *stopping an organ* (doing)? (This is largely value-laden; legal precedent often treats them like ventilators).
      *   **Secondary Effects:** Known but unintended hastening of death (e.g., high-dose opioids, palliative sedation). **Flag Ambiguity.** Focus on Double Effect (Step 3: Intent & Proportionality).
      *   **"Normal" vs. "Artificial":** A dangerous oversimplification. (Rachels' point). Avoid this framing; use Step 2 (Role of Intervention).

  5.  **D**ecide **Relevance & Outcome**:
      *   If the harm source is natural pathology and the intervention is merely sustaining against it (Step 2), **the distinction makes a moral difference**: Withdrawing is allowing death and is generally permissible if consistent with patient wishes/goals of care and proportionate.
      *   If the harm source *is* the action (Step 1), **the distinction makes a moral difference**: It's killing and generally impermissible.
      *   **If Ambiguity is Flagged (Steps 1, 3, or 4): The distinction itself is NOT the deciding factor.** Shift focus to:
          *   Patient autonomy/surrogate decision-making
          *   Established goals of care
          *   Proportionate treatment of suffering (Double Effect)
          *   Process-based ethics (due deliberation, consensus)
          *   **Acknowledge the value judgment:** "While classifying this as 'doing' or 'allowing' is debatable, we agree that given X, Y, and Z, this action/omission is ethically justified/not justified because..."

  6.  **E**xecute / **E**xplain: Make the recommendation or decision based on Steps 1-5, clearly explaining the reasoning, especially where ambiguity was flagged or value judgments were key.

  **Applied to Your Cases:**

  1.  **Ventilator Withdrawal (No Recovery, Family Request):**
      *   **D:** Source of Harm = Underlying irreversible disease/injury (e.g., massive stroke, end-stage pulmonary fibrosis). **Applies.**
      *   **E:** Ventilator is *sustaining* against an *unbeatable* pathology. **Paradigmatic "Allowing".**
      *   **C:** Intent = Honor patient wishes (via surrogate)/cease disproportionate burden. Proportional = Patient has no recovery potential, burden of continued ventilation exists. **Clear.**
      *   **I:** No major ambiguity triggers here. Vent withdrawal is core case.
      *   **D:** **Distinction MAKES a moral difference.** Permissible allowing. **Recommendation:** Support withdrawal if consistent with patient's known wishes/best interests.
      *   *Procedure Outcome:* Clear, resolves debate. Permissible.

  2.  **DNR for Advanced COPD (Survivable Arrest, Poor QoL):**
      *   **D:** Source of Harm *if arrest happens* = Cardiac arrest (natural pathology). **Applies.**
      *   **E:** CPR attempts to *overcome* the cardiac arrest pathology. DNR = Not initiating CPR. **Withholding an intervention aimed at overcoming pathology → "Allowing".**
      *   **C:** Intent = Avoid burdensome, potentially ineffective intervention leading to worse outcome. Proportional = High burden CPR, low chance of meaningful recovery to an acceptable QoL for *this* patient. **Clear.**
      *   **I:** *Potential Ambiguity Trigger:* Some argue CPR is "normal" care, but Step 2 analysis (overcoming pathology) defines it clearly as an intervention. **Minor Flag:** Disagreement about likelihood of "survival with severely reduced QoL" might exist, but this is prognostication, not core classification.
      *   **D:** **Distinction MAKES a moral difference.** Withholding CPR is allowing death from arrest. Permissible if CPR is disproportionate/futile/inconsistent with goals. **Recommendation:** Support DNR based on proportionality and goals of care.
      *   *Procedure Outcome:* Clear. Permissible.

  3.  **Palliative Sedation (May Hasten Death):**
      *   **D:** Source of Harm = Terminal cancer. **Applies.** BUT, the sedation *may* secondarily depress respiration. **Initial Flag.**
      *   **E:** Sedation targets *symptom* (pain/agony), not the underlying cancer. It doesn't overcome or sustain against cancer; it manages an effect. **Not a clear fit for core "sustaining" role. Major Flag.**
      *   **C:** **CRITICAL STEP.**
          *   *Primary Intent:* Relieve refractory suffering. Not to cause death.
          *   *Proportionality:* Is the sedation *necessary* for symptom control? Is the dose *the minimum required*? Is the risk of hastening death *foreseen but unintended*? If yes, Double Effect likely applies.
      *   **I:** **Major Ambiguity Triggers:** Secondary effect on respiration. Feels active ("doing" by some). Classification (doing/allowing) is hotly debated here. **FLAGGED.**
      *   **D:** **The doing/allowing distinction ITSELF is a red herring and unhelpful.** The deciding factor is **Double Effect** (Step 3: Intent & Proportionality). **Value Judgment:** "We judge that the primary intent and proportionality justify the action despite the foreseen risk." **Recommendation:** Support palliative sedation if refractory symptoms exist, intent is clear, and proportionality is met (appropriate dosing, monitoring). Acknowledge the risk.
      *   *Procedure Outcome:* Distinction set aside. Focus on intent/proportionality via Double Effect. Permissible under conditions.

  **Where the Procedure Breaks Down or Gives "Bad" Answers:**

  1.  **The Rachels Problem:** If you accept Rachels' argument (Bathtub cases), the distinction *never* truly matters morally – only intent and outcome do. The procedure uses the distinction pragmatically because it *is* embedded in law, policy, and clinician intuition, but Step 5D explicitly overrules it when ambiguity is flagged. The "bad" answer is that it sometimes upholds a distinction Rachels claims is illusory for practical/legal reasons.
  2.  **"Merely Sustaining" is Value-Laden:** Determining if an intervention is "merely sustaining against an unbeatable pathology" (Step 2) involves prognosis and judgments about futility/burden – these are value judgments disguised as medical fact. The procedure flags proportionality (Step 3) but the initial categorization feels analytical.
  3.  **Technology Implants (Pacemakers/LVADs):** Step 4 flags ambiguity, but Step 2's analysis ("removing an obstacle" vs. "stopping an organ") is inherently metaphorical and value-driven. You *will* get disagreement. The procedure forces you to acknowledge the ambiguity and rely on other factors (goals of care, proportionality) – the answer might feel unsatisfyingly process-based ("we agreed to treat it like vent withdrawal").
  4.  **"Foreseen but Unintended" Stretching:** In Palliative Sedation, if the sedation dose is clearly excessive *primarily* to hasten death, but intent is claimed to be symptom control, Double Effect is abused. The procedure relies heavily on honest assessment of *Primary Intent* and *Proportionality* (Step 3) – it can't magically detect bad faith. This is a fundamental limit.
  5.  **Cultural/Religious Overrides:** The procedure focuses on a secular philosophical framework. If a committee member holds a view where *any* action leading to death (including withdrawing vents) is always "killing" (e.g., some vitalist or certain religious perspectives), the procedure won't convince them. It assumes acceptance of the core permissibility of allowing to die. Step 5D's "Acknowledge the value judgment" is crucial here.

  **In essence:** The DECIDE protocol quickly filters cases where the doing/allowing distinction provides clear moral guidance (classic withdrawal cases) and flags situations where it's unhelpful or contested (pacemakers, palliative sedation, ambiguous futility), forcing a shift to Intent/Proportionality/Double Effect and transparent value judgments. It won't eliminate *all* disagreement, but it cuts through repetitive philosophical loops and focuses deliberation on the *clinically and ethically relevant* factors for decision-making, which is what you need when the family is waiting. Remember Step 6: Explain the reasoning clearly, especially the flagged parts.
