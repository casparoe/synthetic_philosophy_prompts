answer: |-
  ### Moral Testimony Quiz  
  **Instructions:** For each scenario, choose the answer that best reflects your reaction. Be honest—no overthinking!  

  1. **Partner's Conviction**  
     Your partner, whom you trust deeply and who is thoughtful about ethics, tells you eating meat is wrong. You believe them but can't explain why or defend the position when challenged.  
     - a) I now genuinely know it’s wrong.  
     - b) I believe it, but I don’t truly *know* it’s wrong until I understand the reasons.  
     - c) I accept their view, but it feels like a guess—I’m uneasy about relying on it.  

  2. **Friend Against Your Boss**  
     A close friend observes your boss publicly mocking your work. They insist this is deeply disrespectful and wrong. You hadn’t seen it that way, but they’re rarely mistaken about fairness.  
     - a) I’ll confront my boss, citing my friend’s judgment as a key reason.  
     - b) I need to reflect and form my own view before acting—deferring feels irresponsible.  
     - c) I’ll act on my friend’s advice but feel conflicted about not "owning" the belief.  

  3. **Charity Without Belief**  
     A philosopher you respect argues everyone must donate 20% of their income to charity. You’re unmoved—it feels excessive—but you donate that amount solely because of their authority.  
     - a) I did the right thing; deferring was admirable here.  
     - b) I did the right thing for the wrong reasons—my action lacks moral worth.  
     - c) It’s better than nothing, but not ideal.  

  4. **Retaliation Pull**  
     After being betrayed, you crave revenge. A wise mentor says retaliation is unjust. You trust them, but your anger still screams, "They deserve it!"  
     - a) I know retaliation is wrong—my mentor’s testimony overrides my feelings.  
     - b) Without feeling its wrongness myself, I can’t truly know it’s unjust.  
     - c) I’m torn; my mentor’s view clashes too sharply with my instincts.  

  5. **Unfamiliar Dilemma**  
     You face an ethical dilemma about AI privacy with no prior experience. An expert in tech ethics advises you.  
     - a) Following their guidance shows good judgment—I’d defer admirably.  
     - b) Deferring is lazy; I should reason it out myself even if I lack expertise.  
     - c) Deferring is a stopgap until I learn enough to decide independently.  

  6. **Cultural Practice**  
     An anthropologist explains a foreign ritual is exploitative. You lack context but trust their expertise.  
     - a) I now know the ritual is wrong.  
     - b) I believe them, but I can’t claim knowledge without grasping the cultural nuances.  
     - c) I’ll tentatively accept this, but it’s not "my" truth yet.  

  7. **Whistleblowing**  
     A colleague urges you to expose corporate wrongdoing, citing moral duty. You fear backlash but act solely on their urging.  
     - a) I acted rightly—deferring to their moral clarity was correct.  
     - b) Acting without personal conviction makes my choice hollow.  
     - c) It was justified, but I wish I’d arrived at the decision myself.  

  8. **Historical Injustice**  
     A historian argues you benefit from ancestral oppression and owe reparations. You feel no guilt but accept their authority.  
     - a) I know they’re right—testimony conveyed understanding.  
     - b) I believe them, but knowledge requires personal reckoning.  
     - c) I accept this abstractly, yet it feels disconnected from my reality.  

