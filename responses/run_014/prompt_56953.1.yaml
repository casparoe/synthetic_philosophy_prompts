  - **Deontic Axis (Is deferring ever right/admirable?)**  
    - **D+ (Yes):** 2a, 3a, 5a, 7a  
    - **D− (No):** 2b, 3b, 5b, 7b  
    - **D? (Mixed/Neutral):** 2c, 3c, 5c, 7c  

  **Step 2:** Calculate your dominant position on each axis:  
  - **E+** if most answers are E+ (≥3 E+).  
  - **E−** if most are E− (≥3 E−).  
  - **E?** otherwise (tie or majority E?).  
  *(Repeat for D-axis with D+/D−/D?)*  

  **Step 3:** Find your cell:  

  |          | **D+ (Defer = Admirable)**      | **D? (Mixed)**                         | **D− (Defer ≠ Admirable)**          |  
  |----------|----------------------------------|----------------------------------------|--------------------------------------|  
  | **E+ (Testimony = Knowledge)** | Optimist                         | Epistemically Optimist / Deferentially Mixed | Reductionist                      |  
  | **E? (Mixed)**                 | Deferentially Optimist / Epistemically Mixed | Thoroughly Mixed                     | Deferentially Pessimist / Epistemically Mixed |  
  | **E− (Testimony ≠ Knowledge)** | Fideist                          | Epistemically Pessimist / Deferentially Mixed | Skeptic                           |  

  #### Cell Descriptions:  
  - **Optimist:** Testimony *can* impart moral knowledge, and deferring is sometimes admirable (e.g., trusting a friend on your boss’s abuse).  
  - **Reductionist:** Testimony *can* impart knowledge, but deferring without personal reasoning is never admirable—you must "reduce" it to your own judgment (e.g., rejecting charity donation without belief).  
  - **Fideist:** Testimony *cannot* impart knowledge, but deferring is still right/admirable as an act of faith or humility (e.g., donating without belief).  
  - **Skeptic:** Testimony *cannot* impart knowledge, and deferring is never admirable—moral insight requires first-hand understanding.  
  - **Thoroughly Mixed:** Ambivalent on both axes.  
  - **Other cells:** Described by their axis labels (e.g., "Epistemically Optimist / Deferentially Mixed").  

  #### Key Insights:  
  1. **Discriminator Scenario (#3: Charity Without Belief):**  
     - Splits **D+ (a)** from **D− (b)** and **D? (c)**.  
     - Tests if acting *without belief* can be admirable (Fideist/Optimist) vs. hollow (Skeptic/Reductionist).  

  2. **Unclean Separations:**  
     - **Optimist vs. Fideist:** Both endorse deferring, but Optimists accept testimony as *knowledge*, while Fideists deny it. The quiz *can* split these via E-axis questions (e.g., #1, #6).  
     - **Reductionist vs. Skeptic:** Both reject deferring, but Reductionists accept testimony as *knowledge*. Splits cleanly via E-axis.  
     - **Weakness:** Cannot distinguish **E?/D?** from **mild versions of adjacent cells** (e.g., a weak Optimist vs. a deferentially mixed E+).  

  3. **Empty Cell & Diagnosis:**  
     - **Fideist (E−/D+) often empty.**  
     - **Why?** Incoherent for most—denying testimony yields knowledge while calling deference "admirable" feels unstable. (Rarely held; most who deny knowledge also reject deference.)  

  **Design Note:** This quiz prioritizes intuitive cases over theory-labels. It reveals where you *land*, not where you *think* you stand. Use it to spark discussion, not dogma!
