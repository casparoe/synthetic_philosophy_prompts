  ### Thought Experiment: Rehabilitation Support Allocation in Regional Hospital

  **Scenario:**  
  You are the director of a regional hospital overseeing two rehabilitation wards, Ward A and Ward B. Each ward has 100 patients (fixed population). Patients are identical in desert, responsibility, and entitlement. Allocations affect lifetime well-being (measured in interpersonally comparable units). No future people, risk, uncertainty, or side effects exist. Four options:

  - **Option A (Status Quo):**  
    Ward A (worse off): **100** per patient  
    Ward B (better off): **900** per patient  
    Total well-being: \(100 \times 100 + 900 \times 100 = 100,000\)  

  - **Option B (Partial Equalization):**  
    Transfer resources from Ward B to Ward A with moderate administrative waste.  
    Ward A: **400** per patient  
    Ward B: **500** per patient  
    Total well-being: \(400 \times 100 + 500 \times 100 = 90,000\) (10% waste)  

  - **Option C (Full Equalization):**  
    Further transfer with high administrative waste.  
    Both wards: **380** per patient  
    Total well-being: \(380 \times 100 + 380 \times 100 = 76,000\) (24% waste)  

  - **Option D (Leveling Down):**  
    Lower Ward B to Ward A's level with no gain to anyone (e.g., discard resources).  
    Both wards: **100** per patient  
    Total well-being: \(100 \times 100 + 100 \times 100 = 20,000\)  

  ---

  ### Rankings by Ethical Theories  
  **Well-being arithmetic (using square-root prioritarian weighting):**  
  - **Prioritarianism value** = \(\sum \sqrt{\text{well-being}}\)  
    - A: \(\sqrt{100} \times 100 + \sqrt{900} \times 100 = (10 \times 100) + (30 \times 100) = 4,000\)  
    - B: \(\sqrt{400} \times 100 + \sqrt{500} \times 100 \approx (20 \times 100) + (22.36 \times 100) = 4,236\)  
    - C: \(\sqrt{380} \times 100 + \sqrt{380} \times 100 \approx (19.49 \times 100) + (19.49 \times 100) = 3,898\)  
    - D: \(\sqrt{100} \times 100 + \sqrt{100} \times 100 = (10 \times 100) + (10 \times 100) = 2,000\)  

  - **Utilitarianism value** = \(\sum \text{well-being}\)  
    - A: 100,000  
    - B: 90,000  
    - C: 76,000  
    - D: 20,000  

  - **Telic Egalitarianism value** (illustrative: total well-being minus inequality penalty):  
    Assume penalty = \(1.5 \times |\text{Ward A} - \text{Ward B}| \times 100\) (per-patient difference scaled).  
    - A: \(100,000 - 1.5 \times |100 - 900| \times 100 = 100,000 - 1.5 \times 800 \times 100 = -20,000\)  
    - B: \(90,000 - 1.5 \times |400 - 500| \times 100 = 90,000 - 15,000 = 75,000\)  
    - C: \(76,000 - 1.5 \times |380 - 380| \times 100 = 76,000\)  
    - D: \(20,000 - 1.5 \times |100 - 100| \times 100 = 20,000\)  

  **Rankings:**  
  1. **Prioritarianism:** B > A > C > D  
     - **Why?** B improves the worse off significantly (100→400), justifying the total loss due to concavity. C/D’s losses outweigh equality’s benefits. Equality has no intrinsic value.  

  2. **Utilitarianism:** A > B > C > D  
     - **Why?** A maximizes total well-being. B/C reduce total well-being due to waste. D is catastrophic.  

  3. **Telic Egalitarianism (k=1.5):** C > B > D > A  
     - **Why?** C eliminates inequality (no penalty) despite lower total. D’s equality offsets low total. A is penalized heavily for extreme inequality.  

  ---

  ### Key Analysis  
  **Structural feature separating prioritarianism from telic egalitarianism:**  
  - Prioritarianism prioritizes the *absolute level of the worse off* via concave weighting but assigns **no intrinsic disvalue to inequality**. Thus, it rejects equality when it reduces total weighted well-being (e.g., C and D).  
  - Telic egalitarianism assigns **intrinsic disvalue to inequality** (e.g., via a penalty), making equality valuable even when it reduces total well-being (e.g., C > A).  

  **Effects of modifications:**  
  - **If waste in B/C is removed:**  
    - B becomes: Ward A=600, Ward B=400. Total=100,000.  
      - Prioritarianism: \(\sqrt{600} \times 100 + \sqrt{400} \times 100 \approx 4,449\) → B > A.  
      - Utilitarianism: Indifferent to A (same total).  
    - C becomes: Both wards=500. Total=100,000.  
      - Prioritarianism: \(2 \times \sqrt{500} \times 100 \approx 4,472\) → C > A.  
      - Telic egalitarianism: C > A (equality penalty removed).  
    - *Without waste, prioritarianism still favors equality but only when it doesn’t reduce total well-being.*  

  - **If concave weighting is nearly linear (e.g., \(\sqrt{w}\) → \(w^{0.99}\)):**  
    - Prioritarianism approaches utilitarianism. B’s value (\(\approx 90,000\)) < A’s (100,000) → A > B.  
    - *Weak concavity undermines priority to the worse off, making prioritarianism utilitarian-like.*  

  **Strongest telic egalitarian reply to resist leveling-down (D):**  
  - **Pareto-Inclusive Telic Egalitarianism:** Modify the view to require that no one is made worse off without compensating gains. D violates this (Ward B loses with no one gaining), so D is not better than A.  
    - *Trade-off:* This softens "telic" commitment (inequality’s badness is conditional on Pareto), but avoids the counterintuitive D > A ranking.  

  ---

  ### Self-Critical Note  
  **Most vulnerable step:** The calibration assumes administrative waste is separable and morally neutral. If waste disproportionately harms the worse off (e.g., transaction costs reduce their well-being), prioritarianism might rank B lower. For instance:  
  - If waste in B reduces Ward A to 350 (not 400), prioritarianism: \(\sqrt{350} \times 100 + \sqrt{500} \times 100 \approx 4,181 < 4,000\) → A > B.  
  - **Reversal condition:** If real-world transfers *always* impose waste that primarily burdens the worse off, prioritarianism may fail to prioritize them, undermining its advantage. This could rehabilitate telic egalitarianism (if Pareto-inclusive) or justify non-wasteful policies.  

  **Conclusion:** The case provisionally vindicates prioritarianism by showing priority to the worse off without leveling down, but hinges on empirically contestable assumptions about waste.
