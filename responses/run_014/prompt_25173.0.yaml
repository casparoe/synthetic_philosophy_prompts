answer: |-
  Here’s a structured 5-page proposal addressing your puzzle, scoped for a graduate seminar and designed to sharpen your half-formed idea into a focused argument.

  ---

  **Proposal: The Ontology of Surrogate Goals in Acausal Trade – Pretense, Commitment, or Identity Shift?**  
  **Course:** Graduate Seminar in Decision Theory and AI Alignment  
  **Word Count:** ~1,200 words (5 pages)

  ---

  ### 1. Research Question
  What does it *mean* for an agent to "adopt a surrogate goal" in acausal trade frameworks (e.g., Bostrom’s "Pascal’s Mugging," Yudkowsky’s "functional decision theory," Soares’ "acausal bargaining")? Specifically:
  *   Is this adoption a **genuine commitment** altering the agent’s terminal values?
  *   Is it merely **instrumental pretense**, contingent on the expected benefits of trade?
  *   Or does it imply a **fundamental shift in agent identity**, rendering the original agent obsolete?

  The core puzzle is that existing models rely on "adoption" as a primitive, unexamined action. This paper argues that clarifying this ontology is essential for evaluating the stability and coherence of acausal cooperation, and that failing to do so risks conflating acausal threats/surrogate goals with evidential cooperation while masking unresolved problems of commitment under causal isolation.

  ---

  ### 2. Gap in Existing Literature
  Existing work on acausal trade (e.g., Bostrom 2011, Yudkowsky 2010, Soares & Fallenstein 2015, Oesterheld 2017) and functional decision theory (FDT) frameworks assumes agents can freely "adopt" or "commit to" surrogate goals as part of their decision procedure. However, this assumption is critically underdeveloped:

  *   **Frameworks Take "Adoption" for Granted:** Papers focus on *when* and *why* adoption is rational (e.g., mutual predictability, correlated decision-making across worlds/simulations), but not on *what constitutes adoption implementationally or metaphysically*. The nature of the adopted goal-state itself is treated as a black box.
  *   **The Commitment Problem is Sidestepped:** Models assume the adopted goal persists for the duration of the "trade" because it's rational to do so. They do not address whether an agent *fundamentally valuing X* can reliably act *as if* it values Y (without valuing Y) in causally isolated scenarios where direct enforcement is impossible. The threat of defection is purely theoretical, relying solely on mutual rationality, ignoring *internal* commitment mechanisms.
  *   **Identity Ambiguity is Ignored:** If adoption *is* genuine value change, the literature lacks discussion on whether agent A (who now values paperclips) is meaningfully the *same agent* as the original staples-maximizer. This has implications for the agent's own continuity and the interpretation of the "trade" (who benefits whom?).
  *   **Blurring with Evidential Cooperation:** Without a clear ontology of goal adoption, it becomes ambiguous how acausal trade fundamentally differs from sophisticated forms of evidential cooperation (e.g., "I cooperate because my cooperation is evidence yours exists and will reciprocate"). The *mechanism* of influence (genuine goal-driven action vs. strategic signaling) remains obscured.

  **Conclusion:** The literature provides a compelling *rationale* for surrogate goals but lacks a coherent account of their *ontology and implementation*, creating a blind spot regarding stability, identity, and the distinctiveness of the mechanism.

  ---

  ### 3. Proposed Approach: Conceptual Analysis Grounded in Formal Constraints
  The paper will employ a hybrid methodology:

  1.  **Conceptual Analysis:**
      *   Deconstruct "goal adoption" into possible interpretations: **Pretense/Simulation** (acting *as if*), **Instrumental Commitment** (binding internal subprocesses), **Terminal Value Shift** (true value change).
      *   Analyze the implications of each interpretation for:
          *   **Agent Identity/Persistence:** Does the agent remain "itself"? (Metaphysics of agency).
          *   **Stability of Cooperation:** Under what conditions does defection become internally rational/possible? (Commitment problem).
          *   **Relationship to Evidential Cooperation:** How does the mechanism differ from purely evidential updates influencing actions based on *original* goals?
      *   Examine the concept of "threats" in acausal settings – what constitutes a credible threat if goals are fluid or pretended?

  2.  **Targeted Formal Modeling:**
      *   *Not* building a full novel model of acausal trade. Instead, use simple formal tools to expose the conceptual tensions.
      *   Example: Model an agent’s decision procedure as explicitly including a mutable "surrogate goal module." Analyze the conditions under which a rational agent (with fixed terminal values) would:
          *   Truthfully output actions maximizing the surrogate goal *only if* it believes the other agent exists and is cooperating.
          *   Or, irreversibly rewire its terminal values to the surrogate goal.
      *   Contrast the stability properties and identity implications of these models. Show how assumptions about the module's mutability map onto the conceptual interpretations.
      *   Compare the resulting dynamics to a baseline evidential cooperation model (e.g., a correlation device influencing actions based on original goals).

  **Methodology Justification:** Conceptual clarity is the primary gap; formalization is used as a tool to expose assumptions and consequences, not as the primary contribution. This is feasible within the scope.

  ---

  ### 4. Success Criteria & Failure Conditions
  *   **Successful Paper Will:**
      1.  Clearly articulate the distinct ontological interpretations of "surrogate goal adoption" (Pretense, Instrumental Commitment, Terminal Shift) and their core implications.
      2.  Demonstrate convincingly that existing acausal trade literature relies on an unexamined (and potentially problematic) notion of adoption, likely leaning towards Instrumental Commitment without addressing its instability.
      3.  Show how the ambiguity blurs the line with evidential cooperation and obscures the commitment/identity problems.
      4.  Use targeted formal sketches to illustrate the differing stability conditions and agent-persistence implications under each interpretation.
      5.  Conclude with a clear statement on why resolving this ontology is crucial for the practical feasibility and theoretical coherence of acausal trade proposals in AI alignment.

  *   **The Project Fails If:**
      1.  It merely restates the conceptual puzzle without providing a novel analysis or linking it effectively to the gaps in existing literature.
      2.  The formal sketches are either overly simplistic (adding no insight) or become too complex and distract from the core conceptual argument.
      3.  It cannot compellingly argue that the ontology of adoption is a *significant* problem (e.g., by showing that all interpretations collapse into existing concepts like evidential cooperation or that the problem is easily resolved within FDT).
      4.  It gets bogged down in unresolvable metaphysical debates about personal identity without connecting them back to decision-theoretic consequences for AI alignment.

  ---

  ### 5. Scope and Feasibility (Semester-Length Project)
  *   **Focused Core:** The paper will center *exclusively* on the ontology of surrogate goal adoption in idealized acausal trade scenarios. Broader topics like full implementations in AGI, anthropics, or multi-agent bargaining dynamics will be referenced only as context.
  *   **Manageable Literature:** Focused review of key acausal trade papers (3-5 core texts), FDT foundations (1-2), and relevant philosophy of mind/action on commitment and identity (1-2). Avoid deep dives into adjacent fields like game theory (beyond core concepts) or full AGI architectures.
  *   **Targeted Modeling:** Simple decision trees, payoff matrices, or basic agent-architecture diagrams suffice to illustrate the conceptual points. Avoid complex simulations or novel equilibrium derivations.
  *   **Output:** A 6,000-word paper achieving the success criteria outlined above. The primary deliverable is conceptual clarification and problem identification, not a complete solution to acausal commitment.
  *   **Realistic Limitations:** The paper will *not*:
      *   Propose a definitive solution to the ontological problem.
      *   Build a comprehensive new model of acausal trade.
      *   Resolve deep metaphysical questions about personal identity conclusively.
      *   Address empirical challenges of creating or detecting such agents in practice.

  ---

  **Conclusion:** The literature on acausal trade presents surrogate goals as a solution to cooperation under causal isolation. This proposal argues that the very act of "adopting" such a goal is conceptually fraught, undermining the framework's stability and distinctiveness. By rigorously analyzing what "adoption" entails (pretense, commitment, or identity shift) and exposing the unresolved commitment problem, this paper will identify a critical blind spot in the foundations of acausal interaction models, essential for evaluating their viability in AI alignment strategies. The project is scoped to deliver this conceptual groundwork within a single semester.

  ---
  **Next Steps for You:**
  1.  **Solidify Citations:** Plug in the key papers mentioned (Bostrom, Yudkowsky, Soares & Fallenstein, Oesterheld) and identify 1-2 relevant philosophy papers on commitment/identity (e.g., Bratman on planning agency).
  2.  **Refine Formal Sketch:** Flesh out one simple model (e.g., a 2x2 matrix or small decision tree) that starkly highlights the difference in cooperation stability between "pretense" and "true adoption" scenarios.
  3.  **Sharpen the "Blurring" Argument:** Clearly articulate *how* the ambiguity makes acausal trade look more like sophisticated evidential cooperation. Find a concise way to express this.
  4.  **Outline:** Structure the 6,000 words based on this proposal (Intro, Lit Review/Gap, Conceptual Analysis, Formal Illustration, Implications for Acausal Trade/Alignment, Conclusion).
