  Here's a quick, sharp one for the pub:

  **Vet:** (Examining a whimpering spaniel) "No need to worry, Mrs. Higgins. According to Descartes, this isn't *real* pain. Animals are just complex machines, you see. That whining? Merely a hydraulic release valve sticking. No consciousness."

  **Owner:** "But he's clearly suffering! Look at his eyes!"

  **Vet:** "Ah, but Descartes argued true pain requires *thought*, and thought requires *language*. No language, just... reflexive noise. Like a squeaky cog."

  *(The spaniel looks up, whimpers pitifully, then speaks clearly:)*  
  **Spaniel:** "*Ouch*?"

  *(Vet stares, wide-eyed, as a faint thud is heard from the waiting room...)*  
  **Receptionist:** (Calling out) "Doctor? Mr. Descartes just fainted!"

  **Why it works:**
  *   Directly uses Descartes' "language = thought = real pain" argument.
  *   Sets it perfectly in a vet surgery with a whimpering dog.
  *   The punchline has the dog literally using language ("Ouch?"), instantly disproving Descartes and causing his (off-stage) collapse.
  *   Short, visual, and ends on the funny thud/surprise.

  **Pub Retelling:** "So, Descartes is at the vet, yeah? Tells this woman her whimpering spaniel isn't *really* in pain 'cause animals are machines with no language or proper thought. Dog looks up, says '*Ouch*?'... and the receptionist shouts Descartes just fainted in the waiting room!" *(Sip your pint for maximum effect)*.
