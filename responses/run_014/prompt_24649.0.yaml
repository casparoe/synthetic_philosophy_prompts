prompt: |-
  I've been reading philosophy of religion on my own, and I keep running into a particular shape of argument that I can't quite pin down, and I'm wondering whether it has a name.

  Here is the move, in my own words. An arguer wants to argue that God probably does not exist, and they do it like this. Suppose God is real, and suppose God cares about us the way the religious texts describe — wanting a genuine, personal relationship with each person. Then God would want each person to be able to recognize that God is there, because you cannot have a relationship with someone you cannot identify. But look at the actual state of the world. It is not merely that some people do not believe, or that the evidence is weak. It is that no one, anywhere, has clear, unambiguous, decisive evidence of God's existence. Every single person is left with the same ambiguous pile of hints, and reasonable, sincere people split apart over it. The arguer points at this total, uniform murkiness — the fact that there is not a single person who has a clear case, and that the murkiness is the same kind of murkiness for everyone — and concludes that either God does not exist, or God does not care the way the argument assumes.

  What I keep noticing, and what I cannot find a word for, is that this argument is not the same as the claim that some people do not believe in God and therefore God probably does not exist (an argument from non-belief), and it is not the same as the claim that there is too much suffering in the world for a good God (the problem of evil). It is specifically about the total, uniform absence of clear evidence for anyone. The universal and uniform part — that it is not just that the evidence is weak, but that it is weak in the same way for everyone, with no exceptions — feels like the load-bearing part of the argument, and I cannot tell whether that is a distinct concept or just a way of stating the argument.

  So: is there an established name or concept for this specific move — the claim that the total, uniform absence of clear evidence for anyone, as opposed to weak evidence for some, or suffering as evidence, is what rules out, or strains, a caring God? If there is, what is it, and how does it differ from the problem of evil, from the argument from non-belief, and from a plain argument from insufficient evidence? If there is not, can you name and define it precisely, and tell me exactly where its edges are — what kinds of evidence-distributions would count as an instance of it, and what would not?

  Please think very carefully before answering, and respond in the style of an expert in philosophy of religion. Do not give me a reading list, a bibliography, or citations; I want the conceptual carving, not a syllabus.
reasoning: |-
  Okay, the user is diving deep into the philosophy of religion and has encountered a specific argument against God's existence that they can't quite label. They've described it clearly: it's not the problem of evil or mere non-belief, but focuses on the universal and uniform ambiguity of evidence for God. They want to know if this has a name, how it differs from similar arguments, and its precise boundaries.

  First, I recall that the argument from divine hiddenness is a recognized concept in philosophy. J.L. Schellenberg is a key figure here, but the user isn't asking for citations. The user's emphasis on the uniformity—no one has clear evidence, and the ambiguity is consistent for everyone—seems crucial. 

  The user mentions that the argument hinges on God's desire for a personal relationship. If God exists and wants that, why isn't the evidence clear and accessible to all? The total lack of unambiguous evidence for anyone, ever, is the core. This differs from the argument from non-belief, which might focus on the existence of non-believers without stressing the uniformity. The problem of evil deals with suffering, not epistemic ambiguity.

  I need to clarify how this argument is distinct. The uniformity means that even the most devout believers don't have clearer evidence; everyone works with the same ambiguous hints. That's what makes it a stronger objection. If some people had clear evidence while others didn't, that might not challenge a caring God as much. But here, no one does, which suggests intentional hiddenness.

  The user also wants to know what evidence distributions would fall under this argument. If the evidence were clear for some but not others, that might not fit. But universal ambiguity does. Also, if evidence varied significantly by circumstance, that could be explained, but the uniformity across cultures and individuals weakens such defenses.

  I should define the argument's boundaries: it applies when evidence is universally ambiguous, not just locally. The key is the consistency of the ambiguity, making it seem intentional rather than a result of human limitations. This shifts the burden to theists to explain why a loving God would remain so hidden uniformly.
answer: |-
  This argument is a refined and potent version of what philosophers of religion call the **Argument from Divine Hiddenness (ADH)**, specifically emphasizing the **Uniformity of Evidential Ambiguity** as its core epistemic objection. While "Divine Hiddenness" is the broad category, the unique force of *this* formulation lies precisely in the universal, consistent, and total lack of unambiguous evidence available to *any* cognitive agent under the stipulated conception of God.

  Here's the precise conceptual carving you requested:

  1.  **The Core Concept: Uniform Universal Evidential Ambiguity (UUEA)**
      *   **Definition:** The state of affairs where, concerning the existence of God (as defined: personal, loving, desiring relationship), *no individual*, regardless of time, place, intellectual capacity, sincerity, moral character, or spiritual seeking, possesses evidence that is objectively clear, decisive, and rationally compelling in a way that would secure warranted belief for that individual *and* be universally recognizable as such. The ambiguity is not merely statistical (some lack evidence) or contextual (evidence varies by situation), but fundamental and invariant in its character across all possible subjects.
      *   **The Load-Bearing Element:** The argument contends that UUEA is incompatible with the existence of a God who supremely desires a conscious, reciprocal relationship with each person. Such a God, possessing maximal power, knowledge, and love, could and *would* ensure that at least *some* individuals (e.g., the most sincere seekers, the morally best, or simply a representative sample across contexts) encounter evidence sufficient to overcome reasonable non-belief *without* violating their freedom or rationality. The *uniformity* demonstrates that the hiddenness isn't accidental, localized, or a result of individual failing; it appears systemic and intentional, pointing either to divine non-existence or divine indifference to such relationships.

  2.  **Distinction from Related Arguments:**
      *   **Argument from Non-Belief (or Simple Divine Hiddenness):** This argues that the *existence* of non-believers (especially inculpable ones) is problematic for a God desiring relationship. **The Difference:** The UUEA argument doesn't *require* the existence of actual non-believers. Even if everyone *did* believe (say, through cultural pressure or fear), the *UUEA* would still be problematic. It focuses on the *quality and universal distribution of the evidence itself*, not the resulting belief state. The argument holds that the evidence *should* be clear enough that belief is the obviously rational response for anyone engaging with it honestly, regardless of whether they actually come to believe. The uniformity shows this clarity is universally absent.
      *   **Problem of Evil (PoE):** This argues that gratuitous suffering is incompatible with the existence of an omnipotent, omniscient, omnibenevolent God. **The Difference:** UUEA is distinct because:
          *   **Object:** PoE targets suffering/harm as evidence against God's goodness/power. UUEA targets the *epistemic state* (lack of clear evidence) as evidence against God's desire for relationship.
          *   **Mechanism:** PoE questions God's *benevolence* or *power* in the face of harm. UUEA questions God's *sincerity* or *existence* in the face of epistemic absence *despite* a professed desire for connection. Suffering might be justified for greater goods; UUEA asks what greater good is served by *universally* preventing *anyone* from having clear evidence of God's existence *if* relationship is the supreme goal?
          *   **Scope:** PoE often focuses on intense suffering. UUEA highlights the pervasive, mundane *absence* of clear divine presence.
      *   **Plain Argument from Insufficient Evidence:** This simply states the evidence for God isn't strong enough to warrant belief. **The Difference:** The plain argument is subjective and individual ("*I* find the evidence insufficient"). The UUEA argument makes an objective, structural claim about the *nature of the evidence available to all conscious beings*. It argues that the *universal and uniform insufficiency* is itself strong evidence against the specific kind of God postulated, as it indicates a fundamental mismatch between God's stated desires and the world's evidential structure.

  3.  **Boundaries of the Concept / What Counts:**
      *   **Instances of UUEA:** Any scenario where:
          *   The evidence for God is universally non-compelling and ambiguous (e.g., subjective experiences open to naturalistic explanation, philosophical arguments susceptible to counter-arguments, historical/textual claims requiring faith-based interpretation).
          *   No type of evidence exists that is both universally accessible *and* rationally decisive (e.g., no universally verifiable miracle, no universally compelling philosophical proof, no universally unambiguous divine communication).
          *   The *character* of the ambiguity is consistent across individuals and contexts (e.g., the reasons for doubt are fundamentally similar for a medieval monk, a modern scientist, and an ancient farmer – reliance on faith, interpretation, personal experience).
      *   **Not Instances of UUEA:**
          *   Situations where evidence is *locally* ambiguous due to contingent factors (e.g., a person isolated from religious teachings, though *potential* evidence exists elsewhere).
          *   Situations where evidence is *locally* clear for some individuals but not others (e.g., alleged private revelations or miracles witnessed only by a select few – though this raises other problems, it violates the *uniformity* claim).
          *   Situations where evidence *varies significantly* in clarity depending on circumstances, effort, or receptivity (e.g., "seek and you shall find" models where ambiguity lessens for sincere seekers – UUEA claims ambiguity remains fundamental *even for* sincere seekers).
          *   Arguments focused solely on the *amount* of suffering (PoE) or the mere *fact* of non-belief, without the specific emphasis on the universal, uniform *epistemic quality* of the evidence available to all.

  **In essence:** The argument you've identified leverages **Uniform Universal Evidential Ambiguity (UUEA)** as the specific, structural feature of our world that directly contradicts the predicted evidential state under the hypothesis of an omnipotent, omniscient, perfectly loving God who desires a personal relationship with every individual. Its power comes from demonstrating that the hiddenness isn't patchy or accidental, but total, consistent, and thus suggestive of either non-existence or a fundamental disconnect between the postulated divine desire and the divine action (or inaction) regarding self-revelation. It isolates the *epistemic architecture* of theism's predicament.
