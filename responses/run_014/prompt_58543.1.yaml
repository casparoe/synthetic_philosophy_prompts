prompt: |-
  I'm a science and ideas journalist trying to finish an explainer on why rational people still end up disagreeing, and my editor says I need a concrete everyday example to make Aumann's agreement theorem click for normal readers. I was discussing it with friends over dinner and we got all tangled up becuase we kept mixing up having the same starting assumptions versus just seeing the same evidence, and I realy need something I can walk people through step by step.

  Could you give me an example with two specific people, say Maya and Luis, who are both competent Bayesians forecasting whether their city will hit a heat record next summer, who end up knowingly sticking with different numbers even after they tell each other their conclusions, and walk through their starting priors, what shared report they both see, and how they update, to show exactly why this does not break the theorem? I need it to highlight the difference between sharing evidence and actually getting to common knowledge of each others posteriors, plus a quick tweak to the story where the disagreement would disappear if that extra condition held. Keep it intuitive for non-technical readers but with actual numbers so I can follow the math.
reasoning: |-
  We need an example with two people, Maya and Luis, both rational Bayesian forecasters. They are predicting whether their city will hit a heat record next summer (a binary event: yes or no). 

  The key point of Aumann's agreement theorem is that if two people have the same prior and their posteriors are common knowledge, then they must have the same posterior. However, if they don't have the same prior, or if they don't achieve common knowledge of each other's posteriors (even if they share the same evidence), they may disagree.

  Let me set up an example:

  **Event**: Will the city hit a heat record next summer? (R: yes or no)

  We'll have two individuals: Maya and Luis.

  ### Step 1: Different Priors
  Suppose that Maya and Luis have different prior beliefs about the probability of the heat record.

  - Maya's prior: P_Maya(R) = 0.3 (she's skeptical)
  - Luis's prior: P_Luis(R) = 0.7 (he's more convinced)

  They both know that a new climate report is coming out. The report can have two outcomes: 
  - Favorable (F): which suggests the record is more likely
  - Unfavorable (U): which suggests the record is less likely

  But note: the report might be more or less reliable, and our forecasters have different beliefs about the reliability of the report.

  ### Step 2: Different Interpretations of Evidence (Different Likelihoods)
  Suppose the report comes out and it's Favorable (F). 

  Now, how each forecaster updates depends on how they interpret the report (i.e., their likelihood functions).

  We can model the likelihood as the probability of seeing the report given that the record will happen (R) or not (not R):

  - Maya believes the report is not very reliable. She thinks:
    - P(F | R) = 0.6   [if the record will happen, the report is favorable 60% of the time]
    - P(F | not R) = 0.4 [if the record won't happen, the report is still favorable 40% of the time]

  - Luis believes the report is very reliable. He thinks:
    - P(F | R) = 0.9
    - P(F | not R) = 0.1

  ### Step 3: Updating with Bayes' Theorem
  Both see the same report (F). They update their priors.

  **Maya's update**:
  Prior: P_Maya(R) = 0.3, so P_Maya(not R) = 0.7

  Likelihoods:
  - P(F|R) = 0.6
  - P(F|not R) = 0.4

  Posterior for Maya:
  P_Maya(R|F) = [P(F|R) * P_Maya(R)] / [P(F|R)*P_Maya(R) + P(F|not R)*P_Maya(not R)]
  = (0.6 * 0.3) / (0.6*0.3 + 0.4*0.7)
  = 0.18 / (0.18 + 0.28)
  = 0.18 / 0.46 ≈ 0.3913

  So Maya's posterior is about 39.1%.

  **Luis's update**:
  Prior: P_Luis(R) = 0.7, so P_Luis(not R) = 0.3

  Likelihoods:
  - P(F|R) = 0.9
  - P(F|not R) = 0.1

  Posterior for Luis:
  P_Luis(R|F) = [0.9 * 0.7] / [0.9*0.7 + 0.1*0.3]
  = 0.63 / (0.63 + 0.03)
  = 0.63 / 0.66 ≈ 0.9545

  So Luis's posterior is about 95.5%.

  ### Step 4: Sharing Posteriors but Not Common Knowledge?
  Now, they share their posteriors. Maya says: "I think it's 39.1%". Luis says: "I think it's 95.5%". 

  But note: they haven't shared the reasons for their posteriors (i.e., their priors and their likelihoods). They only shared the posterior numbers.

  According to Aumann, if they now achieve common knowledge of these posteriors (meaning they know each other's posteriors, and they know that they know, and so on) and if they had the same prior, they would have to agree. But they didn't have the same prior and they have different likelihoods (which are not common knowledge). Therefore, they can rationally disagree.

  ### Step 5: The Twist - What if They Achieve Common Knowledge of All Assumptions?
  Now, let's tweak the story to show what would happen if they achieve common knowledge of their priors and likelihoods (not just the posteriors). Then they would have to agree? Actually, no, because they started with different priors and different likelihoods. But if they start with the same prior and the same likelihood (i.e., same model) and then achieve common knowledge of their posteriors, they must agree.

  However, in our example, they have different priors and different likelihoods. So even if they share everything, they still might not agree? Actually, if they share everything (including their entire models) and update on each other's models, they might end up agreeing? But note: Aumann's theorem requires a common prior. Without that, they may still disagree.

  But let me show the case where they have the same prior and same likelihoods, and then they update on each other's posteriors and thus agree.

  ### Alternate Scenario: Same Prior and Same Likelihoods
  Suppose now that Maya and Luis start with the same prior: P(R) = 0.5 for both.

  And they have the same interpretation of the report (same likelihoods):
  - P(F|R) = 0.8
  - P(F|not R) = 0.3

  They both see the F report.

  **First update (without sharing):**
  Posterior for both (individually) is:
  P(R|F) = (0.8 * 0.5) / (0.8*0.5 + 0.3*0.5) = (0.4) / (0.4+0.15) = 0.4/0.55 ≈ 0.7273 (or 72.73%)

  So they both now think 72.73%. They share and agree? Yes, but that's trivial.

  But what if they see different evidence? Actually, the theorem is about when they have the same information. So let's make them see the same report (as above) and then they also share their posteriors? They already have the same.

  Now, to illustrate the theorem, we need a scenario where they have the same prior and same model, but they see different evidence? Actually, the theorem assumes that they have the same prior and that their posteriors become common knowledge. Then they must agree even if they saw different evidence? Yes.

  But in our case, they saw the same evidence. So to show the theorem at work, we need to have them see different pieces of evidence? But the problem asks for a shared report. So let's try:

  ### Alternate Scenario for Aumann: Same Prior, Different Evidence, Then Share Posteriors
  Suppose Maya and Luis have the same prior: P(R) = 0.5.

  They also have the same likelihood model for two independent reports:

  - Report A: seen only by Maya, can be A+ or A-
  - Report B: seen only by Luis, can be B+ or B-

  Each report has:
  - P(+ | R) = 0.8, P(- | R) = 0.2
  - P(+ | not R) = 0.3, P(- | not R) = 0.7

  Now, suppose Maya sees A+ and Luis sees B+.

  **Maya's first update:**
  P(R | A+) = (0.8 * 0.5) / (0.8*0.5 + 0.3*0.5) = 0.4 / (0.4+0.15) = 0.4/0.55 ≈ 0.7273

  **Luis's first update:**
  Similarly, P(R | B+) = 0.7273.

  Now, they meet and share their posteriors: both say 72.73%. They agree? But note, they don't know what evidence the other saw. They only know the posterior.

  But now, because they have the same prior and the same model, when they hear that the other also has 72.73%, they can infer that the other must have seen a positive report. Why? Because if the other had seen a negative report, their posterior would be:

  P(R | A-) = (0.2 * 0.5) / (0.2*0.5 + 0.7*0.5) = 0.1 / (0.1+0.35) = 0.1/0.45 ≈ 0.2222

  So if they had seen a negative report, they would have reported 22.22%. But both reported 72.73%, so now they both know that the other saw a positive report. Now, each can update again because they now have two pieces of evidence: their own and the other's (which is equivalent to two positive reports).

  So now, they both update as if they had seen both A+ and B+.

  New posterior (for both) using both reports:
  P(R | A+, B+) = [P(A+,B+ | R) * P(R)] / [P(A+,B+ | R) * P(R) + P(A+,B+ | not R) * P(not R)]

  Since the reports are independent given R and given not R:
  P(A+,B+ | R) = P(A+|R) * P(B+|R) = 0.8 * 0.8 = 0.64
  P(A+,B+ | not R) = 0.3 * 0.3 = 0.09

  Prior: P(R)=0.5, P(not R)=0.5

  So:
  Numerator: 0.64 * 0.5 = 0.32
  Denominator: 0.32 + 0.09*0.5 = 0.32 + 0.045 = 0.365
  Posterior: 0.32 / 0.365 ≈ 0.8767

  So now they both update to 87.67%. They agree.

  But what if they had different posteriors initially? Then they would update until they agree? But in this case, they had the same.

  ### How to Show Disagreement Without Common Prior? Back to Maya and Luis
  We go back to the first scenario. They have different priors and different models. They see the same report (F) and update to different posteriors (39.1% and 95.5%). They share these posteriors. But because they have different priors and different interpretations, they don't have common knowledge of the whole model. So they stick to their guns.

  To make it intuitive: even after sharing their posterior numbers, they don't change because they don't know why the other came to that number. They haven't shared their priors or how they interpret the report. So they just think the other is wrong. And rationally, each one might not have a reason to update because they don't know the other's model.

  But if they then share their entire models (priors and likelihoods), then they might update again? Yes. Let's see:

  After sharing their posteriors, they are surprised and decide to share their models.

  Maya says: "I started at 30% and I think the report is only 60% reliable in the positive case and 40% when negative, so I got 39%."
  Luis says: "I started at 70% and I think the report is 90% reliable in the positive case and 10% when negative, so I got 95%."

  Now, they have more information. They can update their own model? But how? They might not agree on which model is correct. However, if they are truly Bayesian, they would consider the other's model as additional evidence? This is getting complex and beyond the original theorem.

  For the purpose of the example, we can stop at the first sharing (posteriors) and note that without common priors and without common knowledge of the entire model, they can disagree. Then, in the tweak, we show that if they had the same prior and same model, and then share posteriors (achieving common knowledge of those posteriors) they would update and agree.

  ### Summary for the Explainer
  We have two scenarios:

  1. **Disagreement Scenario**:
     - Maya and Luis have different priors and different interpretations (likelihoods) of the same report.
     - They update to different posteriors (39% and 95%).
     - They share these posteriors, but they don't know the other's prior or model, so they stick to their own.

  2. **Agreement Scenario (to contrast)**:
     - Suppose Maya and Luis have the same prior and same model (same likelihoods).
     - They each see a different piece of evidence (Maya sees A+, Luis sees B+).
     - Individually, they both update to 72.73%.
     - They share posteriors and realize that the other must have seen a positive report (because if it were negative the posterior would be 22%).
     - They then update again knowing there are two positive reports and get 87.67% (agreeing).

  The key for the reader: Rational people can disagree when they start with different assumptions (priors) or interpret the same evidence differently (likelihoods). Aumann's theorem requires a common prior and common knowledge of posteriors (and in the agreement scenario we also required that they share enough to infer the evidence, which is a stronger condition).

  In the disagreement scenario, even though they shared the same evidence (the report) and their posteriors, they didn't have common priors and didn't have common knowledge of each other's entire reasoning. Therefore, they can rationally disagree.
answer: |-
  Here's a concrete, everyday example featuring Maya and Luis—two rational colleagues forecasting whether their city will hit a heat record next summer. I'll walk you through their reasoning step by step, with numbers, to show why their disagreement doesn't violate Aumann's agreement theorem. The key is that they share **evidence** but lack **common knowledge of each other's posteriors** (i.e., they don't deeply understand *why* the other reached their conclusion). At the end, I'll tweak the story to show how meeting the theorem's conditions would force agreement.

  ---

  ### **Backstory: The Heat Record Forecast**
  - **Event**: Will Centerville hit 110°F (its all-time high) next summer?  
    *(Binary outcome: Yes or No)*
  - **Shared evidence**: Both read a new climate report stating:  
    *"Ocean current patterns suggest a 60% chance of extreme summer heat."*  
    (Call this report **"Evidence E"**.)

  ---

  ### **Step 1: Priors (Starting Beliefs)**
  Maya and Luis have different life experiences, shaping their **priors** (starting odds):
  - **Maya** grew up in a cooler region. She’s skeptical of heat records.  
    *Prior: P(Record) = 0.2* (20% chance).  
  - **Luis** lived through recent heatwaves. He’s more worried.  
    *Prior: P(Record) = 0.6* (60% chance).

  ---

  ### **Step 2: Interpreting the Evidence (Likelihoods)**
  Both see **E**, but they interpret its reliability differently. This is where Bayesians can diverge:  

  |                          | **If Record *WILL* happen** | **If Record *WON'T* happen** |
  |--------------------------|----------------------------|------------------------------|
  | **Maya's view of E**:     | P(E \| Record) = 0.7        | P(E \| No Record) = 0.5      |
  | *(She thinks E is weak)* | (70% chance E would appear)| (50% chance E would appear)  |
  | **Luis's view of E**:     | P(E \| Record) = 0.9        | P(E \| No Record) = 0.3      |
  | *(He thinks E is strong)*| (90% chance E would appear)| (30% chance E would appear)  |

  **Why?**  
  - Maya thinks the ocean-current models are flaky. E could easily appear even without a record.  
  - Luis trusts the models deeply. E is a strong signal of danger.  

  ---

  ### **Step 3: Updating to Posteriors**
  Both use **Bayes' theorem** to update their beliefs after seeing E:  

  **Maya's calculation**:  
  $$  
  \begin{align*}  
  P(\text{Record} \| E) &= \frac{P(E \| \text{Record}) \cdot P(\text{Record})}{P(E)} \\  
  P(E) &= P(E \| \text{Record}) \cdot P(\text{Record}) + P(E \| \text{No Record}) \cdot P(\text{No Record}) \\  
  &= (0.7 \cdot 0.2) + (0.5 \cdot 0.8) = 0.14 + 0.40 = 0.54 \\  
  P(\text{Record} \| E) &= \frac{0.7 \cdot 0.2}{0.54} = \frac{0.14}{0.54} \approx 0.259 \quad (\textbf{25.9\%})  
  \end{align*}  
  $$  

  **Luis's calculation**:  
  $$  
  \begin{align*}  
  P(E) &= (0.9 \cdot 0.6) + (0.3 \cdot 0.4) = 0.54 + 0.12 = 0.66 \\  
  P(\text{Record} \| E) &= \frac{0.9 \cdot 0.6}{0.66} = \frac{0.54}{0.66} \approx 0.818 \quad (\textbf{81.8\%})  
  \end{align*}  
  $$  

  **Result**:  
  - Maya now thinks **~26%** chance of a record.  
  - Luis now thinks **~82%** chance.  

  ---

  ### **Step 4: They Share Conclusions (But Not Full Rationale)**
  - Maya says: *"After the report, I’m at 26%."*  
  - Luis says: *"I’m at 82%."*  

  **But they *don’t* share**:  
  - Their starting priors (0.2 vs. 0.6),  
  - How they interpret E’s reliability (their likelihoods).  

  **Why no agreement?**  
  - Each thinks the other misjudged E’s significance or started from an unreasonable prior.  
  - Luis thinks: *"Maya’s 26% is too low—she must be ignoring how strong E is."*  
  - Maya thinks: *"Luis’s 82% is hysterical—he’s overrating a shaky report."*  
  - **This is rational!** Without seeing *why* the other believes what they do, they can’t update further. Sharing only **conclusions** isn’t enough.  

  ---

  ### **Why This Doesn’t Break Aumann's Theorem**
  Aumann’s theorem says: **If two people have the same prior, and their posteriors become "common knowledge" (they fully understand each other’s reasoning and know the other understands theirs), they must agree.**  
  Here:  
  - ❌ **Different priors** (0.2 vs. 0.6).  
  - ❌ **No common knowledge of posteriors**: They shared *numbers*, but not the *full model* (priors + likelihoods). Without this, they can’t "simulate" each other’s updates.  

  ---

  ### **The Twist: Agreement When Conditions Are Met**
  *Change the story*: Suppose Maya and Luis **start with identical priors** (both P(Record) = 0.4) and **agree on E’s reliability upfront** (both: P(E \| Record) = 0.8, P(E \| No Record) = 0.4).  

  **After seeing E**:  
  - Both calculate *identical* posteriors:  
    $$  
    P(\text{Record} \| E) = \frac{0.8 \cdot 0.4}{(0.8 \cdot 0.4) + (0.4 \cdot 0.6)} = \frac{0.32}{0.32 + 0.24} = \frac{0.32}{0.56} \approx 0.571 \quad (\textbf{57.1\%})  
    $$  

  **Now they share**:  
  - Luis says: *"I’m at 57.1%."*  
  - Maya says: *"Me too—57.1%."*  

  **Result**: They **agree**.  
  - Why? Same prior + same interpretation of E → same posterior. Sharing the number confirms alignment. No further updating is needed.  

  **If they had different posteriors here**, they’d *keep talking* until they found where their reasoning diverged (e.g., "Did you use P(E \| Record)=0.8?"), and repeat Bayes until they agreed. That’s Aumann in action.

  ---

  ### **Key Takeaway for Your Readers**
  > **Rational people disagree when they:  
  > (1) Start from different assumptions (priors),  
  > (2) Interpret the same evidence differently (likelihoods), or  
  > (3) Fail to deeply understand each other’s reasoning.  
  >   
  > Aumann’s theorem isn’t broken—it just requires perfect alignment upfront and total transparency in updates. In the real world, we rarely meet these conditions. That’s why smart people still argue.**

  This example shows why disagreement ≠ irrationality. Maya and Luis both updated correctly, but their "mental models" of the world were too different to converge without sharing more than just a number.
