prompt: |-
  In my French Revolution course each student has to design and run one two-hour seminar session, and mine falls on the explanation of the Revolution and the Terror: whether a class-struggle reading, an ideology/political-culture reading, or sheer contingency does the explanatory work, and whether revolutions really do consume the people who make them. I have about eighteen students and a room I can rearrange. Please design an activity that makes them feel the force of all three explanations rather than hearing them described.

  What I want specifically: the group should run the same scenario twice — identical roles, rules, starting conditions, and resources — with only a hidden deck of contingency events differing between the runs, so that they discover for themselves that the same structural pressures can issue in quite different outcomes, and cannot tell afterwards whether their choices or the draw did the work. Give me the role set and each role's private objective; a payoff scheme that runs on standing, legitimacy, or resources rather than money; a mechanic whereby the group builds a running list of suspects or denunciations — each addition cheap, each removal impossible, adjudication controlled by whoever currently holds most of some scarce good — so that the machinery they invent to survive the crisis ends up aimed at its inventors; a timeline for the two runs and the debrief; and instructions for what I should be doing while they play. No framing lecture beforehand, and the three explanations should not be named until the debrief, which should map particular moments in play onto each of them, including the moments where the activity's own rules manufacture the pattern an explanation then claims to discover.

  Tell me what will predictably go wrong the first time I run this and how to handle it, and be honest about which feature of the historical question the activity cannot reproduce — in particular, whether the rules I have specified already bias the group toward one of the three readings rather than letting it emerge. Throughout, keep separate what specialists actually agree on from what is genuinely contested, and do not present a contested reading of the Terror as the consensus.
reasoning: |-
  We are designing a simulation game for a two-hour seminar on the French Revolution and the Terror. The goal is to have students experience three explanations (class struggle, ideology/political culture, and contingency) without being told about them until the debrief. The game will be run twice with the same starting conditions and roles, but with a hidden deck of contingency events that differs between runs. The key features include:
   - Roles with private objectives and a resource (like "standing" or "legitimacy") for payoffs.
   - A mechanic for building a running list of suspects/denunciations (easy to add, hard to remove, controlled by the holder of a scarce resource).
   - The machinery (the list) ends up being used against the players themselves.

   The game should illustrate:
    - How structural factors (class struggle, ideology) create tensions and pressures.
    - How contingency (random events) can lead to different outcomes even with the same starting conditions.
    - How the system they create (the denunciation list) can turn against them.

   We will not name the three explanations until the debrief, and we will map moments in the game to each explanation.

   Structure:
    - Two runs of the game (each about 35-40 minutes) with a short break in between to reset, and then a 30-40 minute debrief.
    - The debrief will:
        a. Elicit from students what they experienced and what factors they thought were at play.
        b. Introduce the three explanations and map game events to each.
        c. Discuss how the rules of the game itself might have manufactured patterns that resemble historical explanations.

   Roles and Setting:
    - Setting: A fictionalized revolutionary committee in a town during the Terror. The committee must manage the town and deal with threats (real and perceived) to the revolution.

   Roles (for 18 players, but we can have some roles duplicated if needed, or have some players as "citizens" without specific roles but with objectives). We can have 6 main roles and then 12 citizens, but we want all to be engaged. Alternatively, we can have 4-5 roles and the rest as factions or groups.

   Let's design 6 roles (each can be played by 1-3 players, so 6 roles with 3 players each = 18). We'll have:

    Role 1: The Jacobin Leader (holds the scarce resource: "Influence Points" at the start)
      - Objective: Maintain control of the committee and ensure the revolution is not betrayed. Gain at least 5 points of "Legitimacy" by the end.
      - Starting: 10 Influence Points, 3 Legitimacy.

    Role 2: The Sans-Culottes Representative
      - Objective: Push for radical measures (like price controls, punishment of suspects) and gain at least 4 "Popularity" points.
      - Starting: 5 Influence Points, 2 Popularity.

    Role 3: The Moderate (Girondin-like)
      - Objective: Prevent excessive violence and protect the rights of citizens. Gain at least 3 "Moral Authority" points.
      - Starting: 7 Influence Points, 2 Moral Authority.

    Role 4: The Military Commander
      - Objective: Maintain order and security. Ensure that the town is defended and that the army remains loyal. Gain at least 4 "Security" points.
      - Starting: 6 Influence Points, 3 Security.

    Role 5: The Clergy (non-juring priest)
      - Objective: Protect the church and its followers. Avoid being denounced. Gain at least 3 "Faithful Support" points.
      - Starting: 4 Influence Points, 2 Faithful Support.

    Role 6: The Wealthy Merchant (formerly noble or bourgeois)
      - Objective: Protect your wealth and avoid being targeted as an enemy of the revolution. Gain at least 4 "Wealth" points (but discreetly).
      - Starting: 8 Influence Points, 3 Wealth (but must be careful not to show it).

   The rest of the players (if we have more than 6) can be assigned as "Citizens" with one of the above roles (so duplicate roles) or as a generic "Citizen" with a simple objective: avoid being denounced and try to gain 2 Influence Points during the game.

   Resources and Payoffs:
    - The main resource is "Influence Points" (IP) which are used to take actions and to bid for control of the denunciation list.
    - Other resources (Legitimacy, Popularity, Moral Authority, Security, Faithful Support, Wealth) are victory points. Players gain these by achieving objectives and by surviving without being denounced.

   The Denunciation Mechanic:
    - There is a public list of suspects (initially empty). Anyone can add a name to the list by spending 1 IP and providing a reason (which can be flimsy). However, once added, a name cannot be removed.
    - Control of the list: At the start of each round (we'll have 5 rounds per run), the player (or group) with the most Influence Points (or if tied, the one who had control last time) becomes the "Prosecutor" for that round. The Prosecutor has the power to:
          - Choose which suspect on the list to put on trial (if any). They can choose to ignore the list.
          - Run the trial: The trial is a simple vote by the entire committee (all players). The accused can defend themselves (30 seconds). Then, the Prosecutor calls for a vote: guilty or not guilty. Majority decides. If guilty, the accused loses all their Influence Points and is removed from the game (they become an observer). They also lose any chance to gain their victory points. If not guilty, the accused remains but the accuser (who added the name) loses 2 IP (as punishment for false denunciation).
          - Note: The Prosecutor can also denounce someone without them being on the list? We'll say that the list is the only way to accuse. So the Prosecutor can only try someone on the list.

   Contingency Events:
    - We will have a deck of 10 events per run. Each round (after the denunciation/trial phase), the facilitator draws one event and reads it aloud. Events can be positive or negative and affect different groups. Examples:
          - "Food shortage: The Sans-Culottes demand action. The Sans-Culottes Representative gains 1 Popularity if they propose a price control measure (which must be voted on)."
          - "Rumor of an invading army: The Military Commander must spend 2 Influence Points or lose 1 Security."
          - "Discovery of a counter-revolutionary plot: One random player is added to the denunciation list (the facilitator randomly picks)."
          - "A prominent citizen is found helping the poor: The Clergy or the Merchant (player's choice) gains 1 Faithful Support or 1 Wealth, respectively, but may be suspected of trying to buy loyalty."
          - "The government in Paris sends a representative: They demand that the committee show progress. The Jacobin Leader must denounce one suspect within two rounds or lose 2 Legitimacy."

   Game Rounds (each run has 5 rounds):
    Round Structure:
      1. Contingency Event: Draw and read an event. Apply immediate effects.
      2. Action Phase: Players can take actions. Each action costs Influence Points (IP). Actions include:
          - Add a denunciation (1 IP): Add any player's name to the list with a reason.
          - Propose a policy (cost varies): E.g., "Set price controls" (costs 2 IP for the Sans-Culottes) - if passed, the proposer gains Popularity. Policies require a majority vote. Other policies might be "Distribute church property" (costs 2 IP for the Jacobin, but the Clergy will oppose) or "Grant amnesty to some suspects" (Moderate, 3 IP). The cost is paid by the proposer.
          - Trade: Players can trade IP secretly or openly (but beware: being caught trading might be grounds for denunciation!).
          - Build support: Spend 2 IP to gain 1 point in your victory resource (if it makes sense for your role). This is a safe action but slow.
      3. Prosecutor Phase: The Prosecutor (player with the most IP at the start of the round) chooses whether to hold a trial and for whom. Then the trial is held (vote). After the trial, the round ends.
      4. Reset: Players recover 1 IP (to simulate some income) unless they were found guilty and removed.

   The game ends after 5 rounds. Players then calculate their victory points (their special resource). They must meet the minimum to "win" (survive and achieve their objective). But note: being denounced and found guilty removes you.

   Two Runs:
    - Run 1: Use one deck of contingency events (prepared in advance, with events that might push toward conflict).
    - Run 2: Use a different deck (with events that might push toward moderation or different conflicts). The roles and starting conditions are identical.

   Debrief:
    - Start by asking students to describe what happened in each run. How did the two runs differ? What factors led to the outcomes?
    - Then introduce the three explanations:
          a. Class struggle: The inherent conflict between social classes (e.g., the Sans-culottes vs. the Merchant, the Clergy vs. the Jacobin). Point to moments where roles with conflicting economic interests clashed.
          b. Ideology/political culture: The role of ideas and the radicalizing logic of revolutionary purity (e.g., the denunciation list and the trials, the pressure to conform). Note how the rules made it easy to denounce and hard to remove names, creating a dynamic of suspicion.
          c. Contingency: The random events that pushed the game in different directions. Ask: did the same group, with the same starting point, end up differently because of the events?
    - Then, critically: How did the rules of the game itself create patterns that resemble these explanations? For example, the denunciation list rule was designed to create an escalating dynamic of terror. But note: in history, the Terror was not an inevitable outcome of the Revolution's start.

   What will go wrong the first time?
    - Problem: Students might not understand the rules and get stuck.
      Solution: Provide a clear, written one-page rules summary. Do a quick example of one round at the start.

    - Problem: The denunciation list might be underused or overused. If underused, the Terror dynamic doesn't emerge. If overused, the game might become chaotic and players removed early might be bored.
      Solution: In the first round, as the facilitator, you might prompt: "Remember, you can denounce anyone by spending 1 IP and giving a reason." Also, in the contingency events, include one that forces a denunciation (e.g., "A spy is reported in the town. Someone must be denounced!"). For removed players: assign them as observers with a task (e.g., note down how many denunciations and why).

    - Problem: The game might run too long.
      Solution: Keep strict time limits: 5 minutes for the event and action phase, 5 minutes for the prosecutor phase per round. Use a timer.

    - Problem: The victory conditions might be too hard to achieve because of the denunciation risk.
      Solution: Make sure that the contingency events sometimes help players gain their victory points. Also, some actions (like building support) are safe but slow.

    - Problem: The two runs might not show enough difference if the contingency events are too similar.
      Solution: Design the two decks to be significantly different. Deck 1: events that create tension and push toward conflict (e.g., food shortages, invasion scares). Deck 2: events that create opportunities for cooperation (e.g., a good harvest, a victory in battle that boosts morale).

   What the activity cannot reproduce:
    - The deep historical context: the long-term class structures, the specific ideological developments, the international pressures, and the personal experiences of the historical actors.
    - The activity may bias toward the contingency explanation because we are explicitly manipulating the events. But note: we are holding structure (roles, starting resources) constant and only changing events. We hope that the class and ideology factors will still be evident in the players' choices and conflicts. However, the rules (the denunciation mechanic) are designed to mimic the ideological/political culture explanation. So we might be emphasizing that one. We must be honest about that in the debrief.

   Instructions for the Facilitator (you):
    - Before the game: Prepare the room with movable chairs arranged in a circle. Have two decks of contingency events (each with 5 events, one for each round) and a list of the events for each run (so you know the order). Print role cards for each player (with objectives and starting resources). Prepare a public board for the denunciation list (a whiteboard or large paper).
    - No framing lecture: Just hand out the roles and rules. Give 5 minutes to read and ask questions.
    - During the game:
          - Keep time strictly.
          - Record the denunciation list publicly.
          - When an event is drawn, read it and enforce any immediate effects.
          - Do not interfere in the action phase unless to clarify rules.
          - In the prosecutor phase, remind the prosecutor of their power and run the trial (with time for defense and then a vote).
          - After each run, collect the victory points secretly (on a slip of paper) so that players don't reveal their status until the end.
    - Between runs: Reset the game (same roles, same starting resources). Tell them it's a parallel universe. Then run again with the second deck.
    - Debrief: Follow the structure above. Encourage students to reflect on how they felt and what drove their decisions. Then introduce the three explanations and map the game events. Finally, discuss the limitations.

   Contingency Events Examples (Deck 1 - more conflict-oriented):
     Round 1: "Bad harvest: Food prices soar. The Sans-culottes demand action. The Sans-culottes Representative must propose a price control in this round or lose 1 Popularity."
     Round 2: "A counter-revolutionary pamphlet is found. The Jacobin Leader must denounce one suspect by the next round or lose 1 Legitimacy."
     Round 3: "Rumor of a foreign invasion: The Military Commander must spend 2 IP or lose 1 Security. If they lose Security, the committee must immediately denounce one person as a spy (any player can pay 1 IP to add a name)."
     Round 4: "A prominent citizen is caught hoarding grain. The Merchant automatically has their Wealth reduced by 1 (if they are the Merchant) and is added to the denunciation list (unless they spend 3 IP to bribe their way out)."
     Round 5: "The Committee of Public Safety in Paris demands results. The Jacobin Leader gains 2 Legitimacy if there are at least 3 suspects on the denunciation list, otherwise they lose 2 Legitimacy."

   Deck 2 (more moderate or mixed):
     Round 1: "Good harvest: The town is well-fed. The Merchant (if not denounced) gains 1 Wealth. The Sans-culottes Representative may propose a celebration (costs 1 IP) to gain 1 Popularity."
     Round 2: "A letter from Paris praises the town's moderate stance. The Moderate gains 1 Moral Authority and may remove one name from the denunciation list (if any) without cost (this is an exception to the rule)."
     Round 3: "A victory in battle: The Military Commander gains 1 Security. All players gain 1 IP in celebration."
     Round 4: "A religious festival: The Clergy may spend 1 IP to hold the festival. If held, the Clergy gains 1 Faithful Support and all players gain 1 IP (from the goodwill)."
     Round 5: "A delegation from a neighboring town arrives seeking advice. The committee must choose a representative (by vote). The chosen player gains 2 of their victory points."

   This design should allow students to experience the pressures and dynamics of the Terror and the Revolution, and see how structure, ideology, and contingency interact.
answer: |-
  ### Revolutionary Committee Simulation: Design for Experiential Learning  
  **Core Concept:** Students reenact a revolutionary committee during the Terror, facing identical starting conditions twice—but hidden contingency events alter outcomes. They experience how structural pressures (class/ideology) interact with randomness, and how their own "denunciation machine" consumes them.  

  ---

  ### **Setup**  
  **Room Layout:**  
  - Rearrange tables into a U-shape facing a central "Public Record" board (whiteboard/large paper).  
  - Place chairs in 6 clusters (3 students per faction).  
  - *Public Record* displays:  
    - **Denunciation List** (initially empty).  
    - **Influence Tracker** (factions' current influence points).  
    - **Revolutionary Goals** (simplified victory conditions).  

  **Factions, Roles & Private Objectives**  
  *(Each faction has 3 players; assign randomly)*  

  | Faction          | Role              | Private Objective (Hidden)                | Starting Influence | Victory Resource |  
  |------------------|-------------------|-------------------------------------------|-------------------|------------------|  
  | **Jacobins**     | Radical Leader    | Secure 8+ *Legitimacy* by purging "enemies" | 10 Influence      | Legitimacy       |  
  | **Sans-Culottes**| Street Militant   | Achieve 6+ *Mobilization* via class warfare | 8 Influence       | Mobilization     |  
  | **Moderates**    | Constitutionalist | Preserve 5+ *Stability* by blocking purges | 9 Influence       | Stability        |  
  | **Military**     | Army Officer      | Gain 7+ *Control* by monopolizing force   | 7 Influence       | Control          |  
  | **Clergy**       | Reformed Bishop   | Protect 4+ *Piety* by shielding the devout | 5 Influence       | Piety            |  
  | **Bourgeoisie**  | Merchant-Guild Master | Amass 6+ *Wealth* while avoiding suspicion | 6 Influence       | Wealth           |  

  **Victory Resources:** Non-monetary; tracked secretly by you. Earned by fulfilling objectives (e.g., Jacobins gain *Legitimacy* by adding names to the Denunciation List).  

  **Key Rules:**  
  1. **Denunciation List Mechanics:**  
     - **Add a Name:** Any faction spends 1 Influence to add a player (e.g., "Bourgeoisie Player A") + accusation ("hoarding grain"). *No evidence needed*.  
     - **Remove a Name:** *Impossible*. Once added, accusations are permanent.  
     - **Adjudicate Trials:** The faction with the most Influence *that round* chooses who to put on trial from the list. Accused defends in 30 seconds. Committee votes guilty/innocent:  
       - **Guilty:** Accused loses **all Influence** and sits out rest of game.  
       - **Innocent:** Accuser loses **2 Influence**.  
     - *Crucial twist:* The "machine" (list) grows until it threatens all players.  

  2. **Resource System:**  
     - **Influence:** Spent to take actions (denounce, pass decrees, trade). Regain 1/turn if not denounced.  
     - **Victory Resources:** Secretly tracked by facilitator. Awarded for:  
       - Role-specific actions (e.g., Sans-Culottes gain *Mobilization* by denouncing Bourgeoisie).  
       - Surviving to final round.  

  3. **Contingency Decks:**  
     - **Deck 1 (Run 1):** Events exacerbating divisions (e.g., bread shortages, royalist plots).  
     - **Deck 2 (Run 2):** Events encouraging unity (e.g., military victories, harvest surplus).  
     - *Examples:*  
       - *Deck 1:* "Price of bread doubles. Sans-Culottes: Gain 2 Mobilization if you denounce a hoarder *this turn*."  
       - *Deck 2:* "Allied army nears Paris. Military: Gain 2 Control if you veto a denunciation *this turn*."  

  ---

  ### **Timeline (110 mins Total)**  
  1. **Run 1 (40 mins):**  
     - **Min 0-5:** Distribute roles/rules. *No lecture*. Students read objectives.  
     - **Each Round (5 rounds × 7 mins):**  
       - *Contingency Event:* Draw 1 card, read aloud (e.g., "Counterrevolutionary pamphlets surface!").  
       - *Action Phase (4 mins):* Factions negotiate, denounce, pass decrees (require majority vote).  
       - *Trial Phase (3 mins):* Top-Influence faction holds trial. Update Public Record.  
     - **End:** Secretly record Victory Resources.  

  2. **Reset (5 mins):**  
     - Reassign same roles. Reset Influence/Denunciation List.  
     - *Emphasize:* "Same roles, same rules. What changes?"  

  3. **Run 2 (40 mins):**  
     - Repeat structure with *Deck 2* events.  

  4. **Debrief (25 mins):**  
     - **Step 1:** Ask students, "What caused different outcomes?" List responses.  
     - **Step 2:** Introduce the three explanations:  
       - *Class Struggle:* "Did factions clash over resources? E.g., Sans-Culottes vs. Bourgeoisie."  
       - *Ideology/Political Culture:* "Did purity spirals emerge? E.g., denunciations as virtue-signaling."  
       - *Contingency:* "How did events (e.g., bread shortage) override structural pressures?"  
     - **Step 3:** Map game moments to explanations:  
       - *Class Struggle:* Sans-Culottes targeting Bourgeoisie to gain Mobilization.  
       - *Ideology:* Jacobins adding names to the list to "defend the revolution."  
       - *Contingency:* A Deck 1 famine radicalizing factions; a Deck 2 victory easing tensions.  
     - **Step 4:** Reveal the "hidden rules":  
       - "The denunciation list *couldn’t be erased*—like ideological rigidity. Did you feel trapped?"  
       - "Influence decided trials—like how power consolidated historically. Did this *create* class conflict?"  
     - **Step 5:** Discuss limitations (see below).  

  ---

  ### **Your Role During Play**  
  - **Silent Facilitator:** Track Victory Resources secretly. Intervene *only* for rules.  
  - **Contingency Card Master:** Draw events *randomly* but ensure Deck 1 is crisis-heavy, Deck 2 unity-focused.  
  - **Timekeeper:** Enforce round times strictly.  
  - **Observer:** Note:  
    - Who adds to the denunciation list first?  
    - How trials escalate (e.g., first trial: 3 voters; last: 10+).  
    - Faction alliances/backstabbing.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem:** Students avoid denouncing (breaking the Terror dynamic).  
     - *Solution:* In Deck 1, add events forcing denunciations (e.g., "Spy uncovered: Denounce someone *now* or lose 2 Influence").  

  2. **Problem:** One faction dominates (e.g., Military monopolizes trials).  
     - *Solution:* In contingency cards, target strong factions (e.g., "Army supply theft: Military loses 2 Influence").  

  3. **Problem:** "Dead" players disengage after trial.  
     - *Solution:* Assign them as "Public Opinion" recorders—track how many denunciations per faction.  

  4. **Problem:** Runs over time.  
     - *Solution:* Cut rounds to 4 if needed; prioritize trial phases.  

  ---

  ### **Limitations & Biases**  
  **What Cannot Be Reproduced:**  
  - **Scale of Fear:** Real Terror involved mass trauma; a game cannot simulate psychological stakes.  
  - **Ideological Depth:** Students "follow rules," not internalize Robespierre's virtue.  
  - **Long-Term Structures:** Feudal class tensions are reduced to "objectives."  

  **Inherent Biases in Design:**  
  - **Rules Favor Ideological Explanation:** The irreversible denunciation list mirrors ideological radicalization ("purity spirals"). This *could* make ideology seem primary.  
  - **Mitigation:** In debrief, stress: "Historians debate if ideology *caused* this or was *enabled* by structures. Our rules made the machine—but class/contingency decided who ran it."  
  - **Contingency Is Overemphasized?** Random events *intentionally* drive divergence. Balance by noting: "In history, contingency (war, harvests) mattered, but within structural constraints."  

  ---

  ### **Specialist Consensus vs. Contested Claims**  
  **Debrief Script Snippets:**  
  - *Consensus:* "All agree the Terror arose from war, economic crisis, and factional infighting."  
  - *Contested:* "Marxists see class struggle; liberals see ideological excess; others blame chaos (contingency). Our game *shows* all three interacting—but historians still debate weights."  
  - *Critical Reflection:* "When Jacobins in our game denounced rivals, was that class (Sans-Culottes vs. Bourgeoisie) or ideology (purging 'impure' elements)? Note how our rules *made* denunciation rational, just as revolutionary institutions did historically."  

  ---

  ### **Materials to Prepare**  
  - Role cards (with objectives/victory resources).  
  - Contingency Decks (10 cards each; label "Deck 1/Run 1," "Deck 2/Run 2").  
  - Public Record board + markers.  
  - Timer.  
  - Secret Victory Resource tracker (spreadsheet/notepad).  

  This design forces students to *live* the explanations. The Terror’s paradox—that survival requires feeding a machine that may destroy you—emerges organically. By the debrief, they’ll grasp why historians still wrestle with these questions.
