answer: |-
  Below is a specification for an adequate theory of persistence, structured as requirements derived from core cases, necessary distinctions, and non-negotiable constraints. Each requirement includes its justification ("case/consideration"), negotiability status, and conflicts. A summary scores major theories against these criteria, focusing on adequacy for real-world disputes (e.g., legal/financial contexts).

  ---

  ### **I. Core Case Requirements**  
  *(What the theory must resolve)*  

  1. **Gradual Replacement (Vanilla)**  
     - *Requirement*: The theory must explain whether the continuously repaired ship is identical to the original.  
     - *Case*: Planks replaced incrementally over time.  
     - *Negotiability*: **Non-negotiable**. Any theory must address continuity through part-replacement.  

  2. **Reassembly Rival**  
     - *Requirement*: The theory must assign identity claims to both the continuously repaired ship *and* the ship reassembled from salvaged original planks.  
     - *Case*: Discarded planks are rebuilt into a "rival" ship coexisting with the repaired one.  
     - *Negotiability*: **Non-negotiable**. Tests transitivity and determinacy.  
     - *Conflict*: Determinacy vs. transitivity (if both claim identity with the original, non-transitivity arises).  

  3. **Destroyed-and-Rebuilt Duplicate**  
     - *Requirement*: The theory must judge whether a duplicate built from *new materials* to the same design (after the original is destroyed) is identical to the original.  
     - *Case*: Original annihilated; later duplicate created from scratch.  
     - *Negotiability*: **Negotiable** (theories diverge on "gappy existence").  

  4. **Dismantled-and-Reassembled**  
     - *Requirement*: The theory must handle identity after temporal discontinuity (dismantling + storage).  
     - *Case*: Ship disassembled for decades, then rebuilt from the same planks.  
     - *Negotiability*: **Non-negotiable**. Tests persistence through temporal gaps.  

  5. **Static Museum Exhibit with Name Transfer**  
     - *Requirement*: The theory must distinguish identity from nominal continuity (e.g., naming rights).  
     - *Case*: Original ship becomes a museum piece; its name is transferred to a new, active successor.  
     - *Negotiability*: **Non-negotiable**. Forces separation of material/practical identity.  

  ---

  ### **II. Distinction Requirements**  
  *(What the theory must **not** conflate)*  

  6. **Object Identity vs. Matter Persistence**  
     - *Requirement*: The theory must not equate "same object" with "same matter."  
     - *Case*: In reassembly, the rival ship has the original matter but may not be the original *ship*.  
     - *Negotiability*: **Non-negotiable** (violating this collapses materialism/functionalist views).  

  7. **Continuation vs. Replica**  
     - *Requirement*: The theory must distinguish between an *exact continuation* (e.g., repaired ship) and a *faithful replica* (e.g., duplicate from new materials).  
     - *Case*: Destroyed-and-rebuilt duplicate is replica, not continuation.  
     - *Negotiability*: **Non-negotiable** for practical disputes (e.g., insurance).  

  8. **Sortal-Relative vs. Absolute Identity**  
     - *Requirement*: The theory must clarify whether identity is relative (e.g., "same ship" vs. "same collection of planks") or absolute.  
     - *Case*: Heritage registries care about "same cathedral" (functional/sortal), not just physical parts.  
     - *Negotiability*: **Negotiable** (endurantism often relative; perdurantism absolute).  

  ---

  ### **III. Constraint Requirements**  
  *(What the theory must **not** violate)*  

  9. **Logical Properties of Identity (Transitivity & Leibniz’s Law)**  
     - *Requirement*: Identity must be transitive (if A=B and B=C, then A=C) and satisfy Leibniz’s Law (identical things share all properties).  
     - *Case*: Reassembly rival creates pressure: if repaired ship = original and rival ship = original, then repaired ship = rival ship (often false, e.g., different locations).  
     - *Negotiability*: **Non-negotiable**. Violating transitivity/Leibniz’s Law implodes identity.  
     - *Heavy-Lifting Requirement*: This eliminates theories where identity is non-transitive (e.g., naïve conventionalism).  

  10. **Mereological Consistency**  
      - *Requirement*: The theory must align with parthood constraints (e.g., how much replacement is survivable).  
      - *Case*: If 100% of parts are replaced, is it the same object? Theories must justify thresholds.  
      - *Negotiability*: **Non-negotiable** (mereology is foundational).  

  11. **Practical Verdict Consistency**  
      - *Requirement*: The theory must resolve real disputes determinately (e.g., insurance, debt, heritage status).  
      - *Cases*:  
        - Marine insurance: Is the ship that sank the same as the one insured?  
        - Business debt: Does a company that replaced all employees/assets still owe a 40-year debt?  
      - *Negotiability*: **Non-negotiable** for adequacy (theories must ground institutional decisions).  

  ---

  ### **Key Tensions & Conflicts**  
  - **Determinacy vs. Transitivity**: To avoid non-transitivity in the reassembly case, a theory must either:  
    - Deny identity to the reassembled ship *or* the repaired ship (sacrificing determinacy for one candidate),  
    - Reject absolute identity (adopt sortal-relativity), or  
    - Introduce time-indexed identity (e.g., temporal parts).  
    - *Suspicion*: **Absolute determinacy and transitivity are jointly unsatisfiable** in reassembly/duplicate cases.  

  - **Absolute vs. Relative Identity**: Practical disputes (Requirement #11) often demand sortal-relative answers (e.g., "same ship" for insurance), but absolute identity simplifies metaphysics.  

  ---

  ### **Brief Theory Scoring**  
  *(Against requirements 1–11; ✓ = satisfies, ✗ = violates, ~ = partial/negotiable)*  

  | Theory                  | Core Cases (1–5) | Distinctions (6–8) | Constraints (9–11) | Verdict for Disputes |  
  |-------------------------|------------------|--------------------|--------------------|-----------------------|  
  | **Endurantism** (Sortal-based) | ~ (Struggles with 2,3,5) | ✓ (6,7) ✗ (8: relative) | ~ (9: may violate transitivity) | ~ (Indeterminate for #11) |  
  | **Perdurantism** (4D parts)   | ✓ (Handles 2,3,4,5 via temporal slices) | ✓ (6,7,8: absolute) | ✓ (9,10) | ✓ (Determinate via spacetime path) |  
  | **Best-Candidate**            | ~ (Arbitrary in 2,3) | ✗ (Conflates 7) | ~ (9: non-transitive) | ✓ (Flexible for #11) |  
  | **Conventionalism**           | ✓ (All cases convention-dependent) | ✗ (Collapses 6–8) | ✗ (9: non-transitive) | ✗ (Undermines #11) |  

  **Crux Note**: The specification **is satisfiable only if identity is sortal-relative or temporal-part-based**. Institutions (courts, registries) implicitly use **sortal-relative criteria** (e.g., "same ship" = functional continuity + institutional intent). For metaphysics to ground this:  
  - Persistence must be kind-dependent (e.g., "ship" vs. "plank collection"),  
  - Temporal gaps must be resolvable (e.g., museum ship’s "pause" doesn’t break identity if functional essence persists),  
  - Transitivity must be preserved *within a sortal* (e.g., "same ship" at t1-t2-t3 is transitive, even if matter isn’t).  
  **Perdurantism** best meets the spec overall by making identity determinate and transitive via spacetime worms. **Endurantism** can satisfy institutions only if augmented with conventional thresholds (e.g., "50% matter retention"), but this sacrifices absolutism. No theory delivers **absolute, determinate, single answers** in reassembly cases without violating transitivity or practical needs.
