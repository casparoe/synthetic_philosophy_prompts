prompt: |-
  I cover science and research for a living, so basically my whole job is deciding which claims to check and which to just take. Lately I've been reading Wittgenstein's late notes on certainty — the ones where certain propositions aren't the sort of thing you can know or doubt at all, they're just what your doubts and your checking swing on — and I started writing down my own verdicts, and they don't line up.

  Ones I'd call framework, untouchable from the inside:
  - other people have minds. never comes up, never could be tested.
  - the past happened, roughly as recorded — the broad one, not any particular record.
  - the laws of physics will be the same tomorrow as they were yesterday.
  - the number I copy out of a spreadsheet into my notebook is the number I'm looking at. I'm totally certain of this one and I can't say why.

  Ones I'd call ordinary evidence territory:
  - there's a laptop in front of me. I look, I know.
  - water is H2O — its the model of a claim that got settled by evidence and could have come out otherwise.
  - the Earth is roughly 4.5 billion years old, because dating methods genuinely bear on that number and genuinely moved it.

  And now the ones that break my brain:
  - "the Earth existed long before I was born" I want to call untouchable. But that looks like the same claim as the 4.5 billion years one, just blurrier. How can the blurry version be outside evidence and the sharp version inside it?
  - "published results mostly replicate." For my first ten years on the job that functioned exactly like a framework proposition — I never once checked it, I checked things against it. Then it came lose, over a few years, by ordinary evidence. Same with "the literature isn't being farmed by paper mills." So if a hinge can come loose, was it ever a hinge?
  - "reviewers are competent and acting in good faith." I can imagine this being overturned. I flatly cannot imagine that for other-minds. But when I'm writing, both feel the same way — load-bearing, invisible.
  - "my editor's summary of what legal said is accurate." I do check this one, sometimes. But only when I already suspect something. Does suspicion have to arrive first, and if so from where?

  My tentative principle is: a claim is framework for me iff any evidence you brought against it would have to be less secure than it is — I'd have to use the claim itself to weigh the evidence against it. Trouble is, that trick seems to work for the laptop too, and I just said the laptop is knowable. So the principle is already in trouble before I've started.

  Give me the best you can do: one or two candidate principles, stated precisely, clause by clause, with which of my cases each clause is there to handle. Then tell me honestly which of my verdicts each one forces me to abandon — if the only way to keep all of them is a baroque mess, say that and pick the simpler principle and name the casualty. Then run your winner on three I haven't listed: "climate models are broadly trustworthy," "the archive I'm working from isn't systematically forged," and "I'm not misremembering what my source told me last week." And finally, tell me what would change your mind — which argument or which case would make you drop your principle for the rival one, and where in your own reasoning you think you're most likely to be wrong. I don't want a tour of who said what, just your verdict and its soft spots.
reasoning: |-
  Okay, let me try to unpack what this science journalist is wrestling with. They're deeply engaged with Wittgenstein's framework propositions - those bedrock certainties that aren't verified but enable verification. What's fascinating is how their professional experience clashes with neat philosophical categories, creating these brain-breaking edge cases.

  Hmm, looking at their examples... The untouchable foundations seem clear: other minds, past reality, physical consistency. The empirical claims are straightforward too. But then come the problem children: "Earth existed before me" feeling foundational while its precise age feels empirical, or institutional trust collapsing from framework to contingent claim. That suspicion point about legal summaries is particularly juicy - how doubt emerges from some hidden passageway in the mind.

  The user's proposed "evidence would be less secure" principle is clever but clearly fails when tested against something like the laptop presence. Shows how quickly this gets messy. They want precise criteria that can handle all their cases, knowing some beloved intuitions might get sacrificed. And those final test cases about climate models and archives? Perfect stress tests.

  What makes this hard is that certainty seems to operate differently across dimensions: metaphysical (other minds), physical (laptop), institutional (peer review), and personal memory. Any principle ignoring these distinctions might fail. Also noticing that time plays a role - some frameworks eroded over a decade, suggesting certainty has temporal texture.

  For the "Earth existed" puzzle, maybe the distinction isn't blurriness but the type of work the proposition does. The vague version anchors temporal orientation, while the precise version answers a specific question. Like how a wall can be both part of the house's foundation and something you later hang pictures on - different functions at different times.

  The replication crisis example is brutal for any fixed principle. If hinges can become doors, what does that say about architecture? Perhaps we need to allow framework status to be provisional - a claim can function as foundational until the entire structure starts groaning. Like how trust in a colleague's competence can be absolute until the third botched project.

  That suspicion question haunts me. When they check the legal summary only when suspicious, it reveals that some certainties are guarded by early-warning systems we don't fully understand. The mind has its own tripwires we only notice when they've already been triggered.

  Their three test cases will torture any principle I propose. Climate model trust feels like it should be empirical but functions foundationally for many journalists. Archive authenticity might be framework until an anomaly appears. And that memory question - how we can simultaneously trust and mistrust our own recall - is a philosophical landmine.

  I suspect no principle will save all their intuitions. The laptop certainty might be the necessary sacrifice - what feels empirical might share logical structure with foundations. Or perhaps we need to distinguish between different certainty flavors: existential vs. perceptual vs. social. But that risks becoming the baroque mess they dread.

  For the climate model test case, I'm torn. A scientist might see it as evidentiary, but for this journalist it may function as infrastructure. The memory case exposes how self-trust operates differently than world-trust. Each verdict will reveal where we draw the line between what holds up reality and what reality holds up.

  The soft spot in any solution will be time. We treat emerging frameworks differently than mature ones, institutional trust differently than metaphysical. That might be where the rival principle - one acknowledging functional duration - could strike. But duration feels so... un-Wittgensteinian.

  This is going to require some painful choices. If I prioritize logical security, I lose the replication crisis example. If I prioritize their professional experience, the laptop becomes a paradox. The journalist in them might prefer keeping the messy human cases over elegant philosophy. Or vice versa. Need to decide whose ghost I'm serving - Wittgenstein's or the working journalist's.
answer: |-
  Here’s a precise principle designed to handle your cases, the verdicts it forces, and stress tests. I’ll start with the strongest candidate, dissect its clauses, show where it conflicts with your intuitions, then offer a simpler alternative with its trade-offs.

  ---

  ### **Candidate Principle 1: Functional Immutability**  
  *A proposition P is a framework proposition for agent A at time T iff:*  
  1.  **Functional Role**: P is treated as *presupposed* (not inferred) in A’s epistemic practices at T.  
      *Handles:* "Other minds," "past happened," "physics laws same tomorrow." You don’t *use* evidence to affirm these; you use them to evaluate evidence.  
  2.  **Immunity Condition**: A cannot coherently *generate* direct evidence against P without first assuming P’s falsity is implausible.  
      *Handles:* "Number copied from spreadsheet" – attempting to doubt it requires assuming your perception/memory works (which relies on it).  
  3.  **Temporal Stability**: P’s status as functionally immutable has persisted without active challenge for A’s relevant epistemic activities.  
      *Handles:* "Published results mostly replicate" – it *was* a hinge until evidence destabilized it. Its past stability defines its former hinge status.  

  **Where it clashes with your verdicts:**  
  - Forces you to **abandon "laptop is knowable" as purely empirical**. The principle absorbs it: doubting the laptop requires assuming perception/reality coherence (a hinge). Your "I look, I know" relies on framework trust in senses.  
  - **Accepts "Earth existed before me" as hinge** despite blurriness. Its functional role (anchoring historical inquiry) differs from the empirical *duration* claim.  
  - **Accepts "reviewers act in good faith" as a hinge (until challenged)**. Its load-bearing role in peer review mirrors "other minds" functionally, even if falsifiable later.  

  **Stress Tests:**  
  - *"Climate models are broadly trustworthy"*: **Hinge** for climate reporters *until evidence challenges it*. It functionally supports interpreting data (e.g., trusting temperature projections without re-validating models daily).  
  - *"The archive isn’t systematically forged"*: **Hinge** during initial research. You assume its integrity to evaluate documents; checking for forgery *presupposes* archives are usually reliable.  
  - *"I’m not misremembering my source"*: **Not a hinge**. You *can* and do generate direct checks (notes, re-contacting sources). Doubting memory doesn’t require assuming its global failure.  

  ---

  ### **Candidate Principle 2 (Simpler): Uncheckability by Design**  
  *P is a framework proposition iff A cannot conceive of a *practically applicable* test for P that doesn’t circularly depend on P.*  

  **Verdicts you must abandon:**  
  - **Sacrifices "published results replicate" as ever being a hinge**. You *could* design replication studies without assuming replication is universal.  
  - **Demotes "reviewers are competent" to non-hinge**. You *can* test reviewer quality (e.g., audit reviews) without assuming universal competence.  
  - **Keeps "laptop is knowable" as empirical** – a vision test doesn’t require assuming laptops exist.  

  **Stress Tests:**  
  - *Climate models*: **Not a hinge**. You *can* test model components against new data without assuming broad trustworthiness.  
  - *Archive forgery*: **Not a hinge**. Forensic tests (ink dating, provenance) don’t assume the archive’s overall integrity.  
  - *Memory accuracy*: **Not a hinge**. Cross-referencing notes is a non-circular test.  

  ---

  ### **The Verdict**  
  **Functional Immutability (Principle 1) is stronger** for your cases. It preserves:  
  - How hinges erode ("replication crisis" was a hinge *until evidence destabilized it*).  
  - Why "Earth existed before me" feels untouchable (it scaffolds temporal reasoning).  
  - Why suspicion "arrives from elsewhere" for legal summaries: when *other* hinges are strained (e.g., "my org is reliable"), sub-hinges become testable.  

  **Cost:** You must accept that **perceptual claims (laptop) share hinge structure** with "other minds." The laptop’s certainty isn’t from evidence; it’s from the *role* perception plays in your epistemic framework.  

  ---

  ### **Where I’m Most Likely Wrong & What Would Change My Mind**  
  **Soft spot:** Principle 1 struggles with **gradients of entrenchment**. Is "reviewers are competent" *as deeply* hinged as "other minds"? Probably not – but the principle doesn’t capture depth, only functional role. A case like *"my senses are not systematically deceived by an evil demon"* might force admitting some hinges are "deeper" than others.  

  **What would make me switch to a rival principle:** If you found a proposition that:  
  - Functions as a hinge in practice,  
  - Can be *directly tested without circularity*, *and*  
  - You *still* treat it as foundational after testing.  
  (Example: If you routinely drug yourself to test "other minds exist" via hallucinations, yet keep trusting minds. This seems impossible.)  

  **For your cases:** Your intuition that "other minds" is *categorically* different from "reviewer competence" might point to a need for hierarchy among hinges. But Wittgenstein resists this – hinges are defined by use, not metaphysics. Your job shows hinges can be **local, contingent, and perishable**, yet still *function* as certainties until they don’t. That’s the messy truth.  

  ---  
  **Final Tally with Principle 1:**  
  - Keeps all your "untouchable" verdicts.  
  - Upgrades "laptop" to hinge (sacrificing your "knowable by evidence" label).  
  - Saves "Earth existed before me" as hinge, distinguishing it from empirical dating.  
  - Accepts "replication" and "reviewers" as *former* hinges.  
  - Explains suspicion: it arises when *corollary* hinges wobble (e.g., "my org is truthful" falters, making legal summaries checkable).
