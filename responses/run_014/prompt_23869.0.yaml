  The four verdicts you provided can be captured by a single principle of causation, known as **counterfactual dependence with a focus on actual events and preemption**. This principle, often refined in causal models like the **Structural Equation Model (SEM)** or **interventionist counterfactual theories**, emphasizes that causation requires not just that an event made a difference in some counterfactual scenario, but that it was the actual, un-preempted cause of the specific outcome in the real-world chain of events. Let's break this down into a unified principle and apply it.

  ### Unified Principle of Causation
  1. **Counterfactual Dependence for the Actual Outcome**: An event C causes an event E if, in the actual context (holding fixed all other relevant background conditions), E would not have occurred (or would have occurred in a significantly different manner) if C had not happened. This ensures C is necessary for E in the specific way it unfolded.
     
  2. **No Preemption**: If there are potential causes, only the one that actually brought about E via the causal process counts. Preempted alternatives (which would have caused E if the actual cause hadn't) do not qualify.

  3. **Relevance to the Specific Event Token**: The effect E must be individuated as a specific event (e.g., "the bottle shattering at time T with Suzy's rock") rather than a general outcome (e.g., "the bottle shattering eventually"). This avoids misattributing causation when the actual event token depends on C, even if a similar event would have occurred otherwise.

  4. **Omissions as Causes (with Contextual Responsibility)**: For omissions (like not watering a plant), C is a cause only if there was a contextual duty or expectation for the agent to act. This distinguishes between "normal" inactions (e.g., everyone else not watering your plant) and "abnormal" inactions that violate a responsibility (e.g., you forgetting to water it).

  This principle handles all four verdicts without requiring any to be given up. Each clause is tied to a case:

  - **Clause 1 (Counterfactual Dependence) and Clause 3 (Specific Event Token) for Suzy and Billy**:  
    Your verdict: Suzy's throw caused the shattering.  
    Explanation: Without Suzy's throw, the bottle would have shattered a split second later due to Billy's throw. However, the *actual* shattering event—occurring at the exact time and by Suzy's rock—would not have happened. Billy's throw is preempted and thus irrelevant to the actual event token. Clause 1 and 3 ensure Suzy's throw is the cause because the specific shattering (at that moment, by her rock) counterfactually depends on it.

  - **Clause 2 (No Preemption) for the Desert Traveler**:  
    Your verdict: The hole-borer caused the death, not the poisoner.  
    Explanation: The hole-borer's action preempted the poisoner: without the hole, the traveler would have drunk the poisoned water and died of poisoning. But with the hole, the water drained, and the traveler died of thirst. The actual death (by thirst) depends on the hole, while the poisoner's contribution is preempted and never actualized. Clause 2 ensures only the un-preempted cause (the hole) counts.

  - **Clause 1 (Counterfactual Dependence) for the Boulder and Hiker**:  
    Your verdict: The rolling caused the ducking and the ducking caused the survival, but the rolling did not cause the survival.  
    Explanation:  
    - Rolling → Ducking: Without the rolling, the ducking would not have occurred (counterfactual dependence).  
    - Ducking → Survival: Without the ducking, the hiker would not have survived (counterfactual dependence).  
    - Rolling → Survival: Without the rolling, the hiker would have survived anyway (just by continuing to walk, with no threat). Thus, survival does not counterfactually depend on the rolling. Clause 1 explains why rolling is not a cause of survival: it fails the counterfactual test for that specific outcome.

  - **Clause 4 (Omissions with Contextual Responsibility) for the Office Plant**:  
    Your verdict: Your not watering caused the death, but others' failures did not.  
    Explanation: Your omission caused the death because (1) without it, the plant would have lived (counterfactual dependence), and (2) you had a specific responsibility to water it. Others had no such duty; their inaction is "normal" and irrelevant. Clause 4 ensures only your omission is causal by tying omissions to contextual expectations.

  ### Applying the Principle to the Train Switch Case
  **Case**: A train approaches a fork. A signalman throws a switch, sending it down the left track instead of the right. The tracks reconverge, so the train arrives at the same time either way. Did throwing the switch cause the train's arrival?

  **Verdict using the principle**: **No**, throwing the switch did not cause the train's arrival.  

  **Explanation**:  
  - **Counterfactual Dependence (Clause 1)**: Without the switch being thrown, the train would have taken the right track and arrived at the same time. The arrival event (e.g., "the train arriving at the destination at time T") does not counterfactually depend on the switch throw because it would have occurred regardless.  
  - **Specific Event Token (Clause 3)**: If we individuate the arrival as a generic event ("arrival at time T"), it is not dependent on the switch. If we focus on the specific path ("arrival via the left track"), then the switch caused the train to take the left track—but not the arrival itself. The arrival is the same outcome either way.  
  - **No Preemption (Clause 2)**: There is no preemption here because both tracks lead to the same result; the switch merely selects the path, but neither path preempts the other for the arrival outcome.  
  - **Conclusion**: The switch throw caused the train to take the *left track* (a separate event), but it did not cause the *arrival* because the arrival is insensitive to the switch. This aligns with your verdicts like the boulder case (rolling caused ducking but not survival) and Suzy/Billy (Suzy caused the shattering at time T, but not that the bottle would eventually break).

  ### Summary
  - **Principle**: Causation requires counterfactual dependence for the actual, specific event token, with no preemption, and for omissions, contextual responsibility.  
  - **All verdicts hold**: The principle cleanly explains all four cases without contradiction.  
  - **Train switch outcome**: The switch throw did not cause the arrival because the arrival does not counterfactually depend on it.  

  This approach draws from formal theories like David Lewis's counterfactual analysis or Judea Pearl's causal models, emphasizing actual dependence over hypothetical alternatives. If we relaxed the principle (e.g., allowing causes that merely alter the path but not the outcome), the train switch might be mislabeled as causal—but your intuitive verdicts demand rigor, so we uphold the stricter standard.
