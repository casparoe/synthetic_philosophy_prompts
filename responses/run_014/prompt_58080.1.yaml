  Avoiding explanation is tricky. I'll trust the juxtapositions to convey Schlick: when "future reward" repeats beside "listening," the deferred-goal fallacy becomes self-evident. No need to state "thus play = meaning." 

  Voice notes: "forty years" grounds the age, "wistful" tinge in "remember how" but avoids sentimentality by focusing on sensory details (stones, pulse, music). Last line's "whole reward" subtly confirms Schlick's thesis without preaching.

