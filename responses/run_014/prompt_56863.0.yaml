answer: |-
  ## The Impartiality Imperative: Salvaging Parfit in the Face of Koopmans

  The conflict between Parfit’s rejection of pure time preference and Koopmans’s impossibility theorem presents a profound challenge for the ethics of the far future. Parfit, following Sidgwick, insists that the mere date of a benefit or harm cannot be a morally relevant factor for an impartial evaluator. Discounting future goods simply because they are future constitutes an indefensible, arbitrary discrimination against future beings. Koopmans, however, demonstrates mathematically that any continuous, stationary, and sensitive preference ordering over infinite utility streams *must* be representable by a discounted sum with a discount factor strictly less than one. The undiscounted sum, often championed as the embodiment of impartiality, violates sensitivity: it is "blind" to any finite number of changes in the stream, rendering it incapable of distinguishing between a world with a finite catastrophe and one without. This seems to force a stark choice: abandon impartiality by accepting discounting, or abandon the ability to care meaningfully about finite sufferings at specific times – the very sufferings Parfit sought to prioritize.

  The proposed "exits" demand rigorous scrutiny:

  1.  **Accepting a Positive Pure Discount Rate:** This is a direct surrender to Koopmans and a direct violation of Parfit’s core objection. It explicitly makes temporal location a source of value in itself, deeming harms later in time intrinsically less bad. This is ethically indefensible from the impartial perspective Parfit defends. A harm inflicted in 2500 is *identical* in its experiential quality to one inflicted in 2400; the date itself provides no moral reason to care less. This exit rehabilitates pure time preference only by abandoning the ethical commitment to temporal impartiality. It is not a solution for those committed to Parfit’s view; it is its rejection.

  2.  **Surrendering Stationarity:** Replacing constant discount factors with weights that decline monotonically with temporal distance (e.g., hyperbolic discounting) *without* ever converging to a constant stationary ratio might seem promising. However, **this is unequivocally pure time preference under another name**. The fundamental reason for assigning lower weight is still the *distance in time* from the present evaluation point. Whether the weight declines geometrically (constant discount) or hyperbolically, the core objection remains: Why should the *when* of an experience, independent of its nature or context, diminish its moral significance? The schedule is still "keyed to date" – distance *is* a function of the date relative to the evaluator's temporal position. This merely disguises the arbitrariness Parfit identified; it does not eliminate it. It makes the discrimination less extreme for the near future but perpetuates it into the far future, still violating impartiality.

  3.  **Keying the Schedule to Something Other Than Date (e.g., Expected Future Wellbeing):** This appears more promising but ultimately fails to escape the core dilemma. If the declining weight is genuinely tied to a *substantive ethical factor* like increasing uncertainty about future preferences, technological change, or the risk of extinction, then it may not constitute pure time preference. However, Koopmans’s theorem concerns the formal structure of preferences over *known, certain* utility streams. **If the schedule is declining purely due to temporal distance, even if labeled with a term like "wellbeing uncertainty," but without a *genuine, non-temporal justification* for why uncertainty *necessarily* increases with time *in the model*, it remains a disguised pure time preference.** The danger is using "expected wellbeing" as a fig leaf for temporal bias. If, however, the discount truly reflects *empirically grounded* and *ethically relevant* increasing risks or changes in value (not merely the passage of time itself), then it escapes Parfit’s charge of *pure* time preference. But crucially, **it also escapes Koopmans’s immediate grip**, as Koopmans assumes preferences are defined over certain streams. This approach changes the situation fundamentally by introducing genuine contingency and epistemic limitations, moving beyond the purely atemporal, certain world Koopmans addresses. It doesn't solve the Koopmans paradox *within* the certain-future model Parfit and Koopmans both initially engage with.

  4.  **Refusing a Complete Ordering:** This is the only viable exit for salvaging the core of Parfit’s position within the domain of certain futures. **Koopmans’s theorem requires completeness: we must be able to rank *all* conceivable infinite utility streams.** Parfit’s ethical stance does not logically entail this. We can demand that our ethical framework be *sensitive* (caring about finite differences) and *impartial* (no pure time discount) without requiring it to definitively rank *every logically possible* infinite sequence. We can adopt a **partial ordering**.
      *   **The Salvaged Position:** An impartial evaluator must prefer Stream A to Stream B if A is identical to B except for a finite number of periods where A is better (e.g., avoids a finite catastrophe), or if A is better in an infinite tail but equivalent in all finite prefixes (though this latter comparison may be contentious). Conversely, the evaluator *cannot* rank streams that differ in infinitely many periods in complex ways where no finite dominance holds (e.g., alternating sequences of high and low utility stretching to infinity). Crucially, **this partial ordering satisfies Stationarity and Sensitivity *where comparisons are possible*, and it flatly rejects pure time preference.** It avoids the "blindness" for finite differences Parfit abhors while respecting impartiality. The cost is incompleteness: some streams are incomparable.

  **The Verdict: Parfit’s core rejection of pure time preference *can* be saved, but only by abandoning the requirement for a complete ordering over all infinite utility streams.** We must give up on the idea that ethics demands we be able to definitively rank every conceivable trajectory of the universe stretching infinitely into the future. This is not an ad hoc retreat but a principled recognition of the limits of ethical comparability under impartiality. The demand for completeness is an excessively strong formal requirement imported from economics and decision theory, not an inherent feature of morality. Ethical reasoning about the far future can be robust – condemning finite atrocities regardless of their date, demanding sustainable institutions – without needing to resolve every possible infinite permutation. While incompleteness poses practical challenges for some theoretical choices, it is a lesser ethical cost than either arbitrarily discounting the future or becoming indifferent to finite suffering. The impartial standpoint requires sensitivity to finite harms and benefits across time; it does not, and cannot, require omniscient ranking over the entire expanse of eternity. Koopmans forces this choice, and abandoning completeness is the only exit consistent with the fundamental moral intuition that *when* someone suffers, in itself, is irrelevant.
