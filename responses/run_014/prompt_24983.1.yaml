answer: |-
  You've set up a strong challenge, but it perfectly illustrates *why* standing matters beyond mere truth or logical consistency. Let me break down the defect in your friend's blame:

  1.  **The Authority Problem:** When your friend says, "what she did was wrong," he's not merely stating a fact. Blaming is a *normative act* – it's an assertion of moral authority. It presumes the blamer has the *right* to hold the wrongdoer accountable, to call them to answer for their violation. By committing the *same* wrong himself (cheating), he demonstrated a fundamental disrespect for the very moral norm he's now invoking. He forfeited his position as a legitimate enforcer of that norm. Think of it like a judge who was caught taking bribes last week presiding over a bribery trial today. The sentence might be legally correct, but the judge lacks the *standing* to deliver it because his own conduct undermines his authority on this specific matter.

  2.  **The Integrity Gap:** Blame communicates not just that an act was wrong, but that the blamer *stands with* the moral norm violated. Your friend's prior cheating creates a gaping hole in this claim of integrity. His blame rings hollow because his actions scream that he doesn't truly hold this norm in the high regard his words suggest *when it binds him*. His blame lacks the *sincerity of commitment* that gives normative force to condemnation. It becomes performative rather than authentic.

  3.  **The Relational Damage:** Moral norms exist within a community. By cheating, your friend damaged the shared understanding and trust underlying that norm *within the relevant moral community* (people committed to fidelity). He placed himself outside the circle of those who have clean hands on this issue. To then re-enter that circle solely to condemn *another* violates the reciprocity inherent in shared norms. He hasn't repudiated his own wrong or restored his standing; he's attempting to selectively reapply a norm he himself flouted.

  **Why This Isn't Just Annoying or Rude:**

  *   **It Undermines the Moral Practice:** If those who blatantly violate norms can freely condemn others for the same violation, it cheapens the act of blaming itself. It detaches blame from personal accountability and turns it into a weapon anyone can wield, regardless of their own fidelity to the norms. This erodes the seriousness and credibility of moral condemnation as a practice.
  *   **It Disrespects the Victim (You):** For you, the victim, hearing condemnation from someone guilty of the same act can feel like salt in the wound. More importantly *normatively*, it disrespects your position. The hypocrite implicitly asks you to accept *their* moral judgment on the very issue where *they* demonstrated untrustworthiness. It fails to acknowledge that *their* prior action makes *them* a compromised source of moral validation on this specific wrong.
  *   **The Missing Force:** What's missing is **moral credibility**. While the *proposition* "cheating is wrong" is true, the *act of blaming* coming from *this specific person* lacks legitimacy. Its normative force – its power to genuinely call the wrongdoer to account *as an act of communal moral enforcement* – is nullified because the blamer has disqualified himself from participating in that enforcement on this matter. It might be accurate information, but it's not *authoritative* condemnation.

  **In short:** Your friend speaks the truth, but his words are normatively inert *as blame* because he lacks the moral position or credibility to perform that specific speech act with legitimacy concerning *this* wrong. His hypocrisy isn't just a social faux pas; it's a fundamental defect in his authority to hold others accountable for a norm he himself violated. The core claim stands: truth and consistency are necessary but *not sufficient* for standing to blame. Moral authority matters.
