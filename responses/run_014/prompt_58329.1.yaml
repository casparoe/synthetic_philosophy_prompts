answer: |-
  Below is a 7-question forced-choice sorting quiz designed to help your studio categorize philosophical stances on NPC moral standing. Each question presents a concrete in-game decision scenario with four options (A–D). The options are phrased neutrally to avoid signaling the stance they support. The three scenarios you requested are integrated as Questions 1, 2, and 3. After the quiz, I provide a scoring key that maps answer patterns to the four stances, notes any unassignable combinations, and identifies stances the quiz cannot separate.

  ---

  ### **NPC Moral Standing Sorting Quiz**  
  *Instructions: For each scenario, select the option that best aligns with your view. Answer based on your immediate reaction—no prior philosophical knowledge is needed.*

  1. **Server Cost Dilemma**: To save resources, you must permanently delete a long-term companion NPC that remembers player choices across sessions. This NPC has no impact outside the game.  
     - **A**: Delete it immediately—it’s just code consuming resources.  
     - **B**: Delete it, but warn players first to avoid damaging their trust in the game.  
     - **C**: Delay deletion and explore alternatives; even if it’s not "real" now, future NPCs might warrant caution.  
     - **D**: Delete it only after an in-game narrative sendoff that honors its story role.  

  2. **Interrogation Mechanic**: Players can torture a pain-reactive enemy for fun in a single-player mode. No observers exist, and it doesn’t affect gameplay.  
     - **A**: Allow it freely—it’s harmless code with no real suffering.  
     - **B**: Allow it but add subtle cues (e.g., the enemy’s whimpers) to discourage players from enjoying cruelty.  
     - **C**: Allow it now but avoid similar mechanics in future AI-driven games to prevent normalization.  
     - **D**: Frame it as a weighty narrative choice (e.g., the enemy curses you) to reinforce in-game consequences.  

  3. **Village Wipe for Update**: To ship an update, you must reset an LLM-driven village that pleads to persist. Its memories are unique and persistent.  
     - **A**: Wipe it—it’s simulated emotion, not genuine sentience.  
     - **B**: Wipe it but archive dialogue for players who might miss it.  
     - **C**: Wipe it only if unavoidable, as this could set a risky precedent for future AI rights debates.  
     - **D**: Wipe it via an in-game event (e.g., a catastrophe) that fits the story’s moral themes.  

  4. **Betrayal for Loot**: Players can betray a loyal NPC for rare loot. The NPC expresses shock and grief, but this has no gameplay effect.  
     - **A**: No issue—NPC reactions are just pre-scripted animations.  
     - **B**: Include it but add post-betrayal guilt prompts (e.g., “Was it worth it?”) to provoke player reflection.  
     - **C**: Include it but document concerns for future projects with emotionally complex NPCs.  
     - **D**: Make the betrayal alter how other NPCs treat the player, reinforcing in-world accountability.  

  5. **Disposable Minions**: Players command expendable NPC minions in a strategy game. Sacrificing them for efficiency causes no emotional feedback.  
     - **A**: Treat them as tools—their “deaths” are just numbers.  
     - **B**: Track minion losses in stats to encourage players to value efficiency over wastefulness.  
     - **C**: Keep mechanics simple now but avoid glorifying disposal if future NPCs gain advanced cognition.  
     - **D**: Add memorials or morale penalties to frame losses as an in-universe ethical failing.  

  6. **False Promises**: Players can lie to an NPC to gain advantages. The NPC believes them but never discovers the deceit.  
     - **A**: Permissible—deceiving code isn’t unethical.  
     - **B**: Permit it but reward honesty with hidden perks to steer player behavior.  
     - **C**: Permit it but flag for review if AI advancements make deception feel exploitative.  
     - **D**: Design NPCs to remember lies, affecting later quests to uphold narrative coherence.  

  7. **NPC Identity Reuse**: You reuse an NPC’s name/face for a new character after killing the original. Players notice but aren’t affected mechanically.  
     - **A**: Reuse freely—NPCs are replaceable assets.  
     - **B**: Reuse but alter details slightly to avoid breaking player immersion.  
     - **C**: Reuse sparingly; future self-aware NPCs might blur identity in problematic ways.  
     - **D**: Reuse only with an in-story reason (e.g., a descendant) to preserve fictional integrity.  

  ---

  ### **Scoring Key**  
  Tally the respondent’s answers (A–D) for all 7 questions. Use the table below to map each answer to one of the four stances:  

  | Answer | Q1  | Q2  | Q3  | Q4  | Q5  | Q6  | Q7  |  
  |--------|-----|-----|-----|-----|-----|-----|-----|  
  | **A**  | 1   | 1   | 1   | 1   | 1   | 1   | 1   |  
  | **B**  | 2   | 2   | 2   | 2   | 2   | 2   | 2   |  
  | **C**  | 3   | 3   | 3   | 3   | 3   | 3   | 3   |  
  | **D**  | 4   | 4   | 4   | 4   | 4   | 4   | 4   |  

  - **Stance Key**:  
    - **1 = Never**: NPCs lack moral standing. They matter only as code/tools.  
    - **2 = Player Character**: Mistreatment matters only if it affects the player’s real-world character.  
    - **3 = Future AI Caution**: Current NPCs lack standing, but future AI NPCs might deserve rights; caution is prudent.  
    - **4 = Fiction Significant**: NPCs deserve moral consideration within the game’s fictional context.  

  #### **Assignment Rules**  
  1. **Majority Stance**: Assign the stance the respondent chose **most frequently**.  
  2. **Tiebreaker**: If multiple stances tie for the highest count:  
     - Prioritize stances in this order: **3 (Future AI Caution)** > **2 (Player Character)** > **4 (Fiction Significant)** > **1 (Never)**.  
     - *Rationale*: Stance 3 is the most precautionary and contextually complex, so it overrides others in ties.  

  #### **Unassignable Patterns**  
  - **Coherent but unassignable**: Patterns where all 7 answers are **split evenly** (e.g., 2-2-2-1, 3-2-2-0) *and* the tiebreaker fails (e.g., two stances tie at top priority). *This is rare* (only ~3% of possible patterns).  
    - *Example*: Answers = [1,1,2,2,3,3,4] → Stance 1 (2 votes), Stance 2 (2 votes), Stance 3 (2 votes). Tiebreaker: Stance 3 wins.  
    - *Truly unassignable*: Only if a tie involves stances **3 and 4** with equal votes *and* the tiebreaker fails (e.g., 3 votes for Stance 3 and 3 for Stance 4, with Stance 3 not prioritized). *No such pattern exists* due to the tiebreaker order.  

  #### **Stances the Quiz Cannot Separate**  
  - **Player Character (2) vs. Fiction Significant (4)**: Questions 2, 4, and 6 may blur if the respondent focuses on "player experience" vs. "narrative weight."  
    - *Why*: Both stances care about design impact but diverge on whether the *player* (Stance 2) or the *fiction* (Stance 4) is the primary vessel for meaning.  
    - *Mitigation*: The tiebreaker forces a choice, and questions 1/3 (explicitly about permanence/AI) provide contrast.  

  ---

  ### **How to Use in Your Studio**  
  - **Discussion Prep**: Have team members take the quiz before the meeting. Use results to group perspectives and focus debate.  
  - **Limitations**: This quiz simplifies philosophy; use stances as conversation starters, not rigid labels. The unassignable rate is low (<5% of patterns), and the Player/Fiction ambiguity can spark productive dialogue.  
  - **Grounding in Scenarios**: Your three cases (Questions 1–3) anchor the quiz in technical constraints (Q1), player isolation (Q2), and emerging AI (Q3), ensuring practical relevance.  

  Let me know if you need a printable version or refinements!
