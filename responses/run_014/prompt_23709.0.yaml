answer: |-
  You've pinpointed a fundamental and enduring debate in the philosophy of collective action. Bratman and Searle *are* addressing the same core phenomenon – coordinated, intentional group behavior – but they start from radically different metaphysical and explanatory commitments. A careful comparison reveals deep disagreements, particularly on your three points:

  **Core Disagreement: Reductionism vs. Primitivism**

  *   **Bratman (Reductionist/Constructionist):** Aims to explain joint intentional action *solely* in terms of the psychological states and interrelations of individual agents. Shared intention ("We intend to J") is *analyzed as* a complex structure of individual intentions ("I intend that we J"), meshing subplans, mutual belief/belief about interdependence, and commitments to mutual support. The "we" is built from "I"s interacting in specific ways.
  *   **Searle (Primitivist):** Argues that collective intentionality ("We intend to J") is a *sui generis*, primitive form of intentionality, irreducible to individual intentionality ("I intend...") plus mutual belief. It's a fundamental feature of the mind, not built from other parts. The "we-intention" is the basic unit.

  **Addressing Your Three Points:**

  1.  **Normative Force:**
      *   **Bratman:** His account *partially explains* normative force *psychologically* and *structurally*. The normative elements arise from the commitments inherent in the individual attitudes:
          *   **Commitment to the Joint Activity:** Each individual intends *that we J*. Failing to do her part typically involves failing to realize her own intention.
          *   **Commitment to Interdependence:** Each knows the joint action depends on each doing their part. Intending that we J while knowing your part is essential creates a *pro tanto* reason for you to do your part.
          *   **Commitment to Mutual Support:** The mutual responsiveness and readiness to help create obligations of coordination.
          *   **Critique:** Critics argue this only gives *intra-personal* normative force (failing my own intentions) and *instrumental* reasons (needing your action for my goal). It may not fully capture the *interpersonal obligation* ("I owe it to *you* to do my part") or the sense of *collective commitment* inherent in genuinely joint action. Bratman relies on the normative structure of individual intention and planning agency, which he argues *suffices* for the characteristic normativity of modest sociality.
      *   **Searle:** The normative force flows directly from the *collective intention itself*. Because the "we-intention" is primitive and involves a *collective commitment*, it inherently carries obligations *to the collective* or *to the other members*. Failing to do one's part isn't just failing oneself instrumentally; it's *violating the collective commitment*. The obligation stems from the shared nature of the intentional state.
      *   **Comparison:** Bratman derives normativity from the structure of interconnected individual commitments. Searle posits normativity as inherent in the primitive collective state. Bratman's account is descriptively rich regarding the psychological sources of obligation; Searle claims a deeper, intrinsic normative force that reductionism misses.

  2.  **Is Searle's "We-Intention" a Genuine Explanatory Primitive or Just a Label?**
      *   **The Challenge:** Critics (including Bratman implicitly) argue Searle merely *labels* the phenomenon ("collective intentionality") without providing a mechanism or explaining *how* it arises or functions. It risks being non-explanatory – saying "they acted together because they had a collective intention" seems circular.
      *   **Searle's Defense:** Searle insists this is a genuine primitive. He argues:
          *   **Irreducibility:** Attempts to reduce "We intend" to "I intend that we J" + "You intend that we J" + mutual belief fail because the "I intend that we J" *presupposes* and cannot explain the *collective* "we" component. The "we" is already present in the content of the individual intention.
          *   **Biological Primitive:** He suggests it's a biologically basic capacity of social animals (like humans), as fundamental as individual intentionality.
          *   **Phenomenology:** It captures the distinct *experience* of acting together – the sense of *doing something as part of a "we"*, not just alongside others with aligned individual goals.
      *   **Comparison:** Bratman would counter that his account *does* explain the "we" phenomenology and commitment through the complex interlocking of individual attitudes and mutual awareness. He avoids positing a mysterious new primitive by showing how familiar psychological building blocks can be arranged to constitute shared agency. Searle sees Bratman's account as missing the essential, irreducible collective element, mistaking coordination *of* individuals for action *by* a collective subject. Whether Searle's primitive is explanatory or just a label hinges on whether one accepts irreducibility as a valid argument or demands a compositional explanation.

  3.  **Handling Cases: Disengagement & Lack of Full Agreement**
      *   **Case 1: Participant Stops Caring Halfway Through (e.g., painting a house together):**
          *   **Bratman:** This directly undermines the joint action. The joint intention requires the *persistence* of the relevant individual intentions ("I intend that we paint") and mutual belief. If Alice genuinely abandons her intention to paint *with* Bob (even if she keeps painting individually out of habit or obligation), the *interlocking structure collapses*. Mutual belief is lost (Bob sees Alice isn't responsive), and the meshing subplans disintegrate. The joint action dissolves, though individual actions may continue. Bratman's framework is sensitive to the dynamic maintenance of the constitutive attitudes.
          *   **Searle:** The *collective intention* ("We intend to paint the house") might still exist as a collective fact, even if one participant *defects*. Alice's individual mental state has changed; she no longer shares *in* the collective intention. Her action becomes merely individual or obstructive *to the collective action*. The collective intention can persist in the remaining participants (Bob still holds the "we-intention", now with whoever else is committed). The *collective* entity is damaged by the defection, but its intentional state isn't *defined* by the persistence of every individual's attitude at every moment.
      *   **Case 2: Acting Together Without Full Agreement (e.g., committee forced compromise; marching under coercion):**
          *   **Bratman:** His account struggles more here. Joint action requires *meshing subplans*. Deep disagreement often means subplans *don't* mesh; participants have conflicting ideas about *how* to achieve the shared goal or even what the goal *entails*. Coercion is worse: if members are coerced, they may lack the *intention* that *we J*; they may only intend to *appear* to cooperate to avoid punishment. Bratman requires genuine, internally held intentions by all participants. Cases of "grudging cooperation" or "forced compromise" might only barely fit if participants minimally adjust their subplans to a common denominator and maintain the core "I intend that we J" regarding that minimal goal.
          *   **Searle:** His view potentially handles this more easily, as the collective intention is seen as existing at the level of the collective. As long as the group *accepts* or *functions under* the collective intention (even if individuals internally dissent or are coerced), the collective action can proceed. The soldier marching under coercion is still *part of* the collective action defined by the army's collective intention ("We march to the front"), even though his *individual* intention is self-preservation. The "collective acceptance" condition (which Searle emphasizes for social facts generally) can allow for a degree of individual divergence or lack of enthusiasm, as long as the collective frame holds. Critics argue this stretches "intentionality" too thin.

  **Conclusion: Where the Disagreement Truly Lies**

  Bratman and Searle disagree fundamentally on **the metaphysics of the collective subject and the nature of explanation**:

  1.  **The Unit of Agency:** Is the fundamental unit the *individual agent* whose interconnected states constitute shared agency (Bratman), or is it the *collective* (or collective intentional state) of which individuals are participating parts (Searle)?
  2.  **Reducibility:** Can the phenomenon of acting *together as a "we"* be completely explained by the states and interactions of the individuals involved (Bratman: Yes), or is an irreducible "we-mode" intentionality required (Searle: Yes)?
  3.  **Source of Normativity & Commitment:** Does the distinctive normativity and commitment of joint action arise from the *interdependence of individual plans and intentions* (Bratman), or is it an inherent feature of the *primitive collective intention* (Searle)?
  4.  **Handling Imperfection:** Is joint action fragile, requiring the persistent, genuine commitment of each individual (Bratman), or can the collective intention be more robust, persisting despite individual defections, disagreements, or lack of full enthusiasm, as long as the collective frame is accepted (Searle)?

  Bratman provides a meticulously detailed psychological and planning-based account of *how* individuals coordinate to create shared agency, emphasizing the role of individual rationality and commitment. Searle argues that this very detail misses the forest for the trees; the "we" is not constructed but foundational. The choice between them often comes down to whether one finds reductionist explanations satisfying or believes certain aspects of collective life demand a fundamentally different ontological category. Your test cases effectively highlight these deep fault lines.
