  First move: Marcus frames this as standard rational choice - like hiring guards against known thieves. But this already assumes the "thief" (night self) is illegitimate, which is circular. Lena spots this in move 2: the core question is whether temporal selves have equal standing.

  Marcus' third move tries to resolve this by declaring preference reversals under identical conditions prove irrationality. Clever, but Lena demolishes this in move 4: calling it "irrational" presupposes a single valuation scale, whereas hyperbolic discounting may create genuinely distinct temporal agents with their own rationalities.

  The real unspoken agreement? Both treat "self" as divisible across time. Marcus assumes a unitary self that must be protected from its future failures; Lena sees multiple selves where precommitment is inter-agent strategy, not correction. Neither questions this fragmentation premise.

  Where I lean: Marcus' practical solutions work but his philosophical justification is circular. Lena's critique is theoretically sharper but offers no alternative for managing akrasia. The ratings reflect this - Marcus scores on pragmatism, Lena on conceptual coherence. 

  The arbitration must honor both: precommitment devices are instrumentally rational without requiring us to delegitimize future selves' preferences. The "mistake" isn't in using lockboxes - it's in claiming they correct "biases" rather than manage competing legitimate interests across time.
answer: |-
  Here's a detailed adjudication of Marcus and Lena's exchange, rating each move and identifying their shared unspoken assumption:

  **Move 1: Marcus's Initial Defense (Rational Precommitment)**  
  *Rating: Clearly right in practice, but incomplete in framing*  
  Marcus correctly identifies hyperbolic discounting (overweighting immediate rewards) as a well-documented cognitive bias. His analogy to hiring a guard against known burglars is apt: precommitment devices (gym payments, lockboxes) *are* empirically effective for mitigating future self-control failures. Behavioral economics (e.g., Laibson, O'Donoghue & Rabin) supports this as instrumentally rational. **However**, he frames this as "straightforwardly rational" without addressing whether the "burglar" (his night self) has legitimate preferences. This omission sets up Lena’s objection.  

  **Move 2: Lena's Counter (Circularity & Preference Legitimacy)**  
  *Rating: Clearly right on logic, but underestimates empirical reality*  
  Lena correctly spots Marcus’s circularity: he assumes the *conclusion* that the night self’s preferences are invalid. Her point that "whether they should count is exactly the question" is philosophically sound. If temporal selves are morally equal (e.g., Parfit-style personhood), precommitment is paternalism toward one’s future self, not neutral rationality. **But** she ignores that hyperbolic discounting violates axioms of rational choice (e.g., time consistency), making the night self’s preferences *procedurally* irrational under standard models. Her critique is strong on ethics, weak on behavioral psychology.  

  **Move 3: Marcus's Reply (Identifying Irrational Reversal)**  
  *Rating: Half-right – correct on inconsistency, wrong on "referee" entitlement*  
  Marcus is right that identical information + mere temporal proximity causing preference reversal violates rational choice principles (e.g., stationarity axiom). Calling this "irrational" is defensible within economics. **However**, declaring the Sunday self the "referee" is arbitrary. Why privilege the distant planner over the proximate experiencer? Both are situationally biased: Sunday self undervalues present rewards (cold-state neglect), just as night self overvalues them. Marcus conflates *procedural* rationality (consistent preferences) with *epistemic* authority (Sunday self as "correct").  

  **Move 4: Lena's Final Move (Multiple Agents & Imported Norms)**  
  *Rating: Clearly right on theory, but dismissive of pragmatism*  
  Lena’s critique is theoretically robust:  
  - Hyperbolic discounting *can* model the self as a "series of agents" (Ainslie, Schelling), each with context-dependent rationalities.  
  - "Irrational" *does* imply a single scale of value (e.g., hedonic utility), which is contested in multi-self models.  
  - Marcus’s "correction" is indeed one agent strategically dominating others – a power move, not truth-seeking.  
  **But** she overlooks that precommitment *works* precisely because it acknowledges human frailty. Rejecting "bias correction" as an "imported label" ignores that hyperbolic discounting *is* widely characterized as a bias (e.g., in neuroeconomics) due to its welfare costs (e.g., regret).  

  ---  
  **The Shared Unspoken Assumption**  
  Yes, **both agree the self is fragmented across time** – they merely dispute how to manage it. Marcus sees fragmentation as a *flaw* to suppress (one "true" self vs. defective temporal versions). Lena sees fragmentation as *fundamental* (multiple valid selves with competing interests). Their entire debate presupposes that "self-control" implies internal conflict between temporal agents, rather than a unitary will. This is the crux: Marcus wants to *eliminate* fragmentation via precommitment; Lena demands we *accept* fragmentation and negotiate intra-personal conflicts ethically.  

  **Final Adjudication**  
  - **Marcus** wins pragmatically: Precommitment devices *are* rational for achieving long-term goals given human psychology.  
  - **Lena** wins philosophically: Calling the night self "irrational" is question-begging, and precommitment is intra-personal coercion absent justification for privileging the planner self.  
  - **Resolution**: Precommitment is instrumentally rational but ethically complex. It’s less "correcting a bias" and more "strategic self-binding" – useful when society agrees long-term goals *should* outweigh short-term urges (e.g., health, productivity), but potentially tyrannical if overused. The real conflict is over which temporal self’s preferences *deserve* priority, not rationality per se.
