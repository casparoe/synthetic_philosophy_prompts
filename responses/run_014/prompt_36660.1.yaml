prompt: |-
  I'm a journalist who covers science and ideas for a general-interest magazine, and last year I started reporting a feature on why people vote the way they do when they despise every viable option. The reporting kept surfacing two camps who had long since stopped listening to each other. The first camp — call them the harm-minimizers — holds that in a first-past-the-post election with two viable candidates, a ballot is damage-control equipment and nothing else: the probability that yours is decisive is tiny but nonzero, the stakes are enormous, and since the cost of voting is trivial, you vote for the less bad of the two, full stop. The second camp — call them the clean-hands camp — holds that a vote is an act of political self-authorship: casting it for a candidate you find odious, merely because other people's behavior makes that candidate's rival a live threat, makes you complicit in what follows, and no multiplication of a tiny probability by a large benefit figure launders that. Each camp thinks the other has misunderstood what a vote even is. The harm-minimizers say the clean-hands voters are mistaking a soapbox for a lever. The clean-hands camp says the harm-minimizers have a theory that can explain why to vote but cannot explain why anyone should care how.

  I eventually persuaded a representative of each camp, with a couple of their respective fellow travelers, to spend two days in a closed room on the adversarial-collaboration model I've watched work in psychology disputes, with me as rapporteur. My assignment for you is to draft the joint statement I was supposed to file afterwards. It must contain the following. First, a numbered section of claims both camps can sign — I expect this to include the old rational-choice point that turnout needs something like a duty term to be explicable at all, an agreed acknowledgment that virtually no individual vote alters an outcome, and, crucially, the concession they eventually reached that a voter in a jurisdiction whose result is utterly foregone may, even by the harm-minimizers' own lights, vote sincerely. Second, a table of the disagreements that remain, each row worded so that the camp it describes would accept the phrasing — the two of them spent ninety minutes fighting over the sentence that begins a vote is a tool, so keep the wording scrupulously neutral. Third, the cruxes: the sub-questions such that settling one would move at least one camp, each paired with a concrete case both sides agree bears on it and with each side's prediction written down in advance. Three cases they consented to treat as tests: a vote-swapping scheme in which a third-party voter in a swing jurisdiction pairs with a major-party voter in a safe one, each casting the other's preferred ballot, so that each cause nets one vote; a referendum on a civilizational-scale risk whose benefits accrue over centuries, where the decisiveness probability is minuscule and the stakes astronomical; and the secret-ballot problem — if no one ever learns how you voted, what exactly is being expressed, and can clean-hands reasoning survive the removal of an audience? Finally, both camps asked me to establish which parts of their dispute are merely verbal. They have come to suspect that the phrase supporting a candidate means preferring that candidate's victory to the harm-minimizers, but approving of the candidate to the clean-hands camp. The statement should say which disagreements dissolve once those words are pinned down and which are as hard as ever — and it should be a document either of them could put their name to without wincing.
reasoning: |-
  Okay, the user is a journalist who's been working on a feature about why people vote when they dislike all options. They've identified two opposing camps: harm-minimizers and clean-hands advocates. The harm-minimizers see voting as damage control in a two-party system, where you choose the lesser evil because the stakes are high even if your individual vote likely doesn't change the outcome. The clean-hands camp views voting as an expression of personal integrity, refusing to endorse any candidate they find odious.

  The journalist managed to get representatives from both sides to engage in an adversarial collaboration over two days. Now they need me to draft a joint statement that includes: 1) agreed-upon claims, 2) a neutral table of remaining disagreements, 3) crux questions with test cases, and 4) clarification on verbal disagreements.

  For the agreed claims, both sides likely accept that rational choice theory alone can't explain voting - there must be duty or expressive motives involved. They'd agree individual votes almost never decide outcomes. Crucially, even harm-minimizers concede that in non-competitive districts, sincere voting doesn't violate their principles since the vote won't affect results.

  For the disagreements table, I need meticulously neutral language. For example, instead of saying "a vote is a tool" (which caused previous arguments), I'll describe the positions objectively: harm-minimizers see voting as instrumental in reducing harm, while clean-hands see it as constitutive of political identity.

  The cruxes with test cases are fascinating. Vote-swapping examines whether strategic coordination changes the moral calculus. The referendum case forces confrontation with tiny probabilities meeting enormous stakes. The secret ballot question attacks the foundation of expressive voting - if no one sees it, what's being expressed?

  On verbal disagreements, "supporting a candidate" clearly means different things: harm-minimizers define it as preferring victory over the alternative, while clean-hands require actual approval. This resolves some surface conflicts but leaves deeper ethical divides intact about complicity and integrity.

  The challenge is crafting language both camps could sign without discomfort. I'll avoid judgmental terms, present positions sympathetically, and use the precise definitions they've negotiated. The structure should reflect their hard-won compromises while preserving intellectual honesty about persistent divides.
answer: |-
  ## Joint Statement: Harm-Minimizers & Clean-Hands Camp Adversarial Collaboration

  **Preamble:**  
  We, representatives of the perspectives colloquially termed the "Harm-Minimizer" (HM) and "Clean-Hands" (CH) camps, engaged in structured dialogue facilitated by [Journalist's Name]. Our goal was to clarify points of agreement, precisely delineate remaining disagreements, identify testable cruxes, and isolate verbal misunderstandings concerning the act of voting when faced with disliked viable options. This document reflects our shared understanding following two days of discussion.

  ---

  **Section 1: Points of Agreement**  
  Both camps jointly affirm the following statements:

  1.  **The "Paradox of Voting":** Rational choice models based solely on the instrumental calculation of the probability of casting a decisive vote multiplied by expected utility struggle to explain significant voter turnout. An additional factor (e.g., perceived civic duty, expressive motivation, or social pressure) is necessary to explain why individuals bear even minimal costs to vote in large-scale elections where the probability of decisiveness is vanishingly small.
  2.  **The Negligible Probability of Decisiveness:** In any large-scale election with two viable candidates under a first-past-the-post system, the probability that an individual's vote will alter the outcome is extraordinarily small, effectively indistinguishable from zero for practical individual decision-making purposes. Neither camp bases its primary rationale for *how* to vote on the expectation of being decisive.
  3.  **The Legitimacy of Sincere Voting in Safe Jurisdictions:** Within the HM framework, voting sincerely for a preferred but non-viable candidate (or against both viable options where permissible) in a jurisdiction where the outcome is universally recognized as a foregone conclusion *does not constitute a violation of harm-minimization principles*. The instrumental cost of such a vote (in terms of potentially altering the outcome towards a worse candidate) is effectively zero, rendering the expressive or conscientious motivation primary in that specific context. The CH camp agrees this scenario is distinct and aligns with their view of sincere expression.

  ---

  **Section 2: Persistent Disagreements (Neutral Phrasing)**  
  The table below outlines core disagreements, phrased such that representatives of each camp acknowledge it accurately reflects their position relative to the other:

  | Aspect of Voting               | Harm-Minimizer (HM) Position (as stated for agreement)                                                                 | Clean-Hands (CH) Position (as stated for agreement)                                                                 |
  | :----------------------------- | :--------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------ |
  | **Primary Function**           | A vote is primarily an instrumental act aimed at minimizing expected harm in the political outcome.                    | A vote is primarily an expressive act constituting an individual's political self-authorship and moral stance.       |
  | **Moral Complicity**           | Voting for the lesser evil candidate does not constitute moral endorsement of that candidate or complicity in their harmful actions; it is solely an act of harm reduction given constraints. | Voting for a candidate deemed odious, even as the lesser evil, constitutes a form of endorsement and renders the voter morally complicit in the harms enacted by that candidate. |
  | **Relationship to Outcome**    | The moral quality of the act of voting is determined by its expected causal consequences on the political outcome.     | The moral quality of the act of voting is inherent to the act itself and the integrity of the expression, largely independent of its negligible causal impact on the outcome. |
  | **"Wasted Vote" Conception**   | Casting a vote that has no instrumental effect on the outcome (e.g., for a non-viable candidate in a close race) is primarily seen as a lost opportunity for harm reduction. | Casting a vote perceived as expressing true conviction, even if instrumentally ineffective, upholds integrity and avoids complicity; it is not "wasted" in moral terms. |
  | **Role of Others' Behavior**   | The strategic necessity imposed by others' likely votes (making one disliked candidate a serious threat) is the central factor justifying voting for the lesser evil. | An individual's moral responsibility for their own act of endorsement (the vote) cannot be negated or laundered by the strategic context created by others' behavior. |

  ---

  **Section 3: Crux Questions & Test Cases**  
  The following sub-questions represent points where resolving empirical, conceptual, or moral ambiguities could significantly shift the position of at least one camp. Predictions were recorded prior to discussion of the cases.

  1.  **Crux: Does coordinated strategic voting alter the moral calculus of "complicity" or "endorsement"?**  
      *   **Test Case: Vote-Swapping Scheme.** A voter committed to Party C (non-viable) in a Swing State pairs with a voter committed to Party A (viable) in a Safe State. The Swing State C supporter votes for Party A (lesser evil) in Swing State. The Safe State A supporter votes for Party C in Safe State. Net result: Each cause (A and C) gains one vote nationally, but the swap increases the chance of A winning in Swing State over B (the greater evil) and gives C a symbolic vote in Safe State.
      *   **HM Prediction:** Both voters acted rationally and morally. The C-supporter reduced the risk of B winning in Swing State without sacrificing the expression of support for C (achieved by the swap partner). The A-supporter enabled harm reduction in Swing State while expressing solidarity with C at no instrumental cost. Complicity is tied to the *outcome* facilitated (preventing B), not the specific ballot cast.
      *   **CH Prediction:** The C-supporter in Swing State is *still complicit* by voting for A, regardless of the swap. The act of casting the ballot for A *is* the endorsement/complicit act. The existence of the swap does not cleanse this act; it merely adds a layer of coordination. The A-supporter voting C in Safe State is an insincere act lacking integrity. The scheme fails to absolve the core complicity.

  2.  **Crux: Can astronomical stakes justify instrumental voting based on infinitesimal probabilities? Does this change the nature of "complicity"?**  
      *   **Test Case: Civilization-Scale Risk Referendum.** A referendum proposes action to mitigate a potential catastrophe (e.g., asteroid collision, extreme climate tipping point) 200 years hence. The probability of an individual vote being decisive is ~10^-9. The stakes involve the survival or flourishing of future civilization.
      *   **HM Prediction:** The infinitesimal probability multiplied by the astronomical stakes creates a non-trivial expected utility for voting for mitigation (even if the absolute probability remains tiny). Failing to vote for mitigation based solely on expressive preferences (e.g., protesting the plan's cost) would be morally negligent. Complicity arises from failing to act reasonably to prevent vast harm, not from the act of voting itself.
      *   **CH Prediction:** The negligible decisiveness probability means the vote remains primarily expressive. Voting "Yes" on a mitigation plan one finds deeply flawed or unjust, merely because of the stakes, *still constitutes endorsement of that specific flawed plan*. The voter becomes complicit in the plan's potential negative aspects (e.g., misallocation, injustice). The stakes do not transform the vote into a decisive instrumental act, nor absolve the voter of responsibility for endorsing the chosen means.

  3.  **Crux: Does the expressive function of voting require an audience? Is the "clean hands" motive coherent under secret ballot?**  
      *   **Test Case: The Secret Ballot Problem.** Voting occurs under perfect secrecy. No entity (government, party, community, family) ever learns how any individual voted. Voters know this absolutely.
      *   **HM Prediction:** Removes a key expressive motivation (signaling to others). Strengthens the case for instrumental voting (if any expected utility exists) or reduces turnout, as civic duty/expressive motives are diminished without an audience. CH reasoning becomes harder to justify as "expression" loses its social dimension. Complicity arguments weaken without any record of endorsement.
      *   **CH Prediction:** Expression and integrity are internal states. Voting is an act of self-definition and conscience. Knowing one compromised one's principles by voting for an odious candidate, *even if no one else knows*, violates personal integrity and constitutes internal complicity. The secret ballot protects the voter from coercion but does not change the fundamental nature of the act as one of self-authorship (or self-betrayal). The audience is oneself.

  ---

  **Section 4: Verbal Disagreements & Substantive Residue**

  1.  **Verbal Disagreement: "Supporting a Candidate"**
      *   **HM Definition:** To "support" Candidate A means to *prefer Candidate A's victory* relative to the alternative viable candidate(s), based on an assessment of expected outcomes. It describes a preference ordering, not approval.
      *   **CH Definition:** To "support" Candidate A means to *endorse Candidate A*, signifying a judgment that Candidate A is worthy of holding office, implying a degree of approval or alignment with the candidate's platform/character.
      *   **Resolution:** Agreed that much apparent disagreement stems from this difference. When HM says "you should support the lesser evil," they mean "you should act to make their victory more likely relative to the greater evil." When CH says "I cannot support the lesser evil," they mean "I cannot endorse this candidate as worthy."

  2.  **Substantive Residue:** Clarifying the meaning of "support" resolves surface confusion but leaves the core ethical disagreements intact and equally sharp:
      *   **Complicity:** Does acting to make the victory of a disliked candidate more likely relative to a worse alternative (HM "support"), even without endorsement, constitute *moral complicity* in that candidate's actions? HM: No, complicity requires endorsement or direct causation. CH: Yes, enabling is complicity.
      *   **Nature of the Act:** Is voting fundamentally an *instrumental lever* pulled to influence outcomes (HM), or is it fundamentally a *constitutive expression* of the self (CH)? This difference in the ontology of voting underlies all other disagreements.
      *   **Role of Negligible Probability:** Does the negligible probability of decisiveness render the instrumental justification incoherent (CH: focus shifts entirely to expression) or does it simply mean the instrumental impact is small but the *reason* for the vote's *direction* remains instrumental harm-reduction (HM)? Does the tiny probability absolve the voter of responsibility for the outcome facilitated (HM-leaning) or is the *intent* to facilitate sufficient for complicity regardless of effect (CH)?

  **Conclusion:**  
  While we have achieved clarity on definitions, agreed on the role of duty and decisiveness probability, and identified key cruxes, the fundamental divide concerning the essential nature of a vote (instrumental lever vs. constitutive expression) and the resulting implications for moral complicity remains profound. This disagreement reflects deep-seated differences in ethical frameworks and conceptions of political agency. The identified cruxes and test cases provide avenues for future exploration, but reconciling these core perspectives appears unlikely. We appreciate the structured dialogue facilitated by [Journalist's Name] in achieving this level of mutual understanding and precision.

  ---

  **Notes for the Journalist:**

  *   **Tone:** The language is formal, precise, and strives for scrupulous neutrality, especially in Section 2. It avoids inflammatory terms ("selfish," "naive," "complicit" *within* the HM position description, etc.).
  *   **Structure:** Follows your requested sections precisely: Agreed Claims, Neutral Disagreements Table, Crux Questions w/ Cases & Predictions, Verbal/Substantive Split.
  *   **"Tool" Wording:** The disagreement over "a vote is a tool" is implicitly addressed in Section 2 ("Primary Function") by describing HM's view as "instrumental act" and CH's as "expressive act," avoiding the contested word.
  *   **Signability:** Each camp should see their core position represented accurately in Section 2 and their arguments reflected in the Crux predictions. The Agreement section contains concessions valuable to both (CH: HM acknowledges expressive voting in safe seats; HM: CH acknowledges the decisiveness point). The Verbal section resolves a major point of frustration.
  *   **Reflection:** The document highlights that while significant clarification was achieved, the core ethical divide is resilient and rooted in fundamentally different premises about political action and morality. This is the "as hard as ever" residue.
