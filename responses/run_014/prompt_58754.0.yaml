prompt: |-
  I serve on an advisory group for a country emerging from twelve years of authoritarian rule marked by several thousand disappearances and systematic torture by security forces, now governed by a fragile coalition that must decide how to address past abuses while preserving a precarious stability.

  For the past eighteen months our deliberations have circled without movement between two camps. One camp favors a commission that offers individualized, conditional amnesty from criminal prosecution in exchange for full public disclosure of politically motivated crimes, combined with a reparations program and a narrow prosecutorial backstop for those who refuse to participate or fail to disclose fully. Its advocates argue that this arrangement maximizes truth recovery, gives public acknowledgment to victims, and makes democratic transition viable under constraints where the former security apparatus remains largely intact. The other camp favors prioritizing criminal trials for senior and mid-level perpetrators, with sentence reductions rather than amnesty available in exchange for cooperation, on the grounds that punishment is required by justice and the rule of law, that amnesty entrenches impunity, and that reconciliation without accountability is hollow.

  Both camps invoke the broad experiences of South Africa, Argentina, and Rwanda, both claim to value truth, justice, and reconciliation, and both concede considerable uncertainty about deterrence, truth recovery, and social healing, yet neither has shifted.

  My hypothesis is that the persistence of the impasse reflects not primarily a factual dispute about consequences but a deeper divergence over what justice fundamentally requires in transition, compounded by the two sides addressing different practical problems, one focused on securing a workable political transition and the other on vindicating the moral status of victims, while using a shared vocabulary that obscures this difference.

  Assess whether this hypothesis is correct and provide a more general diagnosis of the structure of this impasse. Consider whether the disagreement is principally empirical, normative, or conceptual, whether central terms are being used in different senses, whether the camps are answering different questions under a common heading, and whether unargued starting commitments are doing the decisive work. Ground your diagnosis in the arguments each camp actually advances as described above, and conclude by specifying what, if anything, could constitute progress given your diagnosis, whether a conceptual distinction, a feasible empirical inquiry, an institutional redesign, or a reframing of the question, or explain why no such progress should be expected.

  Please answer in American English.
reasoning: |-
  Okay, the user is part of an advisory group in a country transitioning from authoritarian rule. They've been stuck for 18 months between two approaches: one favoring conditional amnesty with truth recovery, and the other prioritizing criminal trials. The user suspects the impasse isn't about factual disagreements but deeper differences in what justice means during transition. 

  First, I need to unpack both camps' positions. The pro-amnesty camp emphasizes practicality—keeping the transition stable while extracting truth. The pro-trial camp focuses on moral accountability and legal principles. Both cite international examples but interpret them differently. 

  The user's hypothesis feels sharp: the camps aren't just disagreeing on outcomes but on the core definition of transitional justice itself. One side sees justice as stability + truth, the other as punishment + victim vindication. That's a normative clash disguised as empirical debate. 

  Noticing linguistic traps too. When both say "justice," they mean entirely different things. Same with "reconciliation"—amnesty sees it as societal healing through disclosure, trials see it as impossible without punishment. Classic case of equivocation muddying the waters. 

  The deeper driver? Unspoken priorities. Amnesty fears state collapse if security forces rebel; trials worry legitimizing past horrors by sparing perpetrators. Neither side argues these premises—they're treated as givens. That's why evidence from other countries doesn't sway them; it's filtered through opposing normative lenses. 

  So the impasse is fundamentally philosophical, layered with practical anxieties. Breaking it requires either reframing the question ("What can justice realistically look like given our power dynamics?") or designing a hybrid model that forces compromise—maybe sequenced prosecutions starting from top officials combined with incentivized truth-telling for lower ranks. 

  But let's be real: no silver bullets. Progress might just mean admitting aloud that justice here involves tragic trade-offs, not ideal outcomes. The advisory group's role could shift to mapping concrete risks ("If we prosecute X, will General Y stage a coup?") rather than debating abstract principles. Painful, but honest.
answer: |-
  Your hypothesis is fundamentally correct and offers a profound insight into the structure of this impasse. The disagreement is **primarily normative and conceptual**, rooted in divergent conceptions of justice, obscured by shared terminology, and compounded by each camp prioritizing different practical problems under the umbrella of "transitional justice." Here’s a structured diagnosis:  

  ### **1. Nature of the Disagreement: Normative > Empirical > Conceptual**  
  - **Normative Core**:  
    - **Amnesty Camp** implicitly defines justice as *restorative*: Truth recovery, public acknowledgment of victims, and societal stability are paramount. Justice is achieved through collective healing and preventing a collapse of the fragile transition.  
    - **Trial Camp** defines justice as *retributive*: Moral accountability through punishment is non-negotiable. Justice requires affirming the inviolability of the law and vindicating victims’ dignity through condemnation of perpetrators.  
    *Neither side can "prove" their normative stance with empirical data; it rests on unargued moral commitments.*  

  - **Empirical Disputes as Secondary**:  
    Both cite examples (South Africa, Argentina, Rwanda) selectively to support predetermined normative goals. For instance:  
    - The amnesty camp highlights South Africa’s relative stability post-TRC but downplays its failure to deliver economic justice.  
    - The trial camp points to Argentina’s convictions as a deterrent but ignores its initial instability and military revolts.  
    *Outcomes are ambiguous enough to fit either narrative, making empirical arguments proxies for normative battles.*  

  - **Conceptual Ambiguity**:  
    Key terms are used differently:  
    - **"Justice"**: Amnesty camp = truth + reparations + stability; Trial camp = punishment + legal accountability.  
    - **"Reconciliation"**: Amnesty camp = societal coexistence via shared truth; Trial camp = moral reckoning requiring punishment.  
    - **"Impunity"**: Trial camp sees amnesty as its embodiment; Amnesty camp views trials as destabilizing, enabling *de facto* impunity for elites who evade prosecution.  

  ### **2. Different Problems, Shared Vocabulary**  
  - **Amnesty Camp** addresses the **problem of political viability**:  
    How to extract truth and enable transition *without triggering a backlash* from intact security forces. Their solution trades criminal accountability for truth and stability.  

  - **Trial Camp** addresses the **problem of moral legitimacy**:  
    How to affirm the rule of law and victims’ dignity *without normalizing atrocity*. Their solution sacrifices short-term stability for long-term legal norms.  

  Both invoke "truth, justice, and reconciliation" but prioritize them differently:  
  | **Camp**       | **Primary Goal**      | **Secondary Goal**   | **Sacrificed Goal**       |  
  |----------------|------------------------|----------------------|---------------------------|  
  | **Amnesty**    | Stability + Truth      | Reparations          | Criminal Accountability   |  
  | **Trials**     | Accountability + Law   | Victim Vindication   | Transitional Stability     |  

  ### **3. Unargued Starting Commitments**  
  - **Amnesty Camp** assumes:  
    - The state is too weak to prosecute powerful perpetrators without collapse.  
    - "Partial justice" (truth/reparations) is better than failed prosecutions or civil war.  
  - **Trial Camp** assumes:  
    - Impunity breeds future abuse and corrodes democracy.  
    - Legal accountability is a categorical imperative, regardless of risks.  
  These assumptions are treated as axiomatic, making compromise feel like betrayal.  

  ### **4. Why the Impasse Persists**  
  - **Moral Incommensurability**: The camps prioritize irreconcilable values (stability vs. retribution). Neither can "win" on empirical grounds because consequences are uncertain and values are non-fungible.  
  - **Zero-Sum Framing**: Both present their approach as the only path to legitimacy, dismissing hybrid models.  
  - **Institutional Self-Interest**: The amnesty camp (likely aligned with pragmatists in government) fears instability; the trial camp (often victim groups/activists) sees trials as symbolic restitution.  

  ---  

  ### **Pathways to Progress**  
  Given this diagnosis, progress requires **reframing the question** and **institutional redesign** to bridge the normative divide:  

  1. **Reframe the Question**:  
     Shift from *"Which single approach is just?"* to:  
     > **"How can we maximize multiple forms of justice (truth, accountability, reparations, stability) within feasible constraints?"**  
     This forces both sides to articulate trade-offs explicitly and moves beyond absolutism.  

  2. **Hybrid Institutional Design**:  
     - **Sequenced Approach**: Begin with a truth commission offering *provisional* amnesty for full disclosure, followed by targeted prosecutions.  
       - *Example*: Prioritize trials for those who refuse the commission *or* for specific crimes (e.g., command responsibility).  
     - **Differentiated Accountability**:  
       - Offer reduced sentences (not amnesty) to mid-level perpetrators who cooperate.  
       - Reserve prosecutions for senior architects of atrocities.  
     - **Reparations as Bridge**: Fund victim reparations *immediately*, decoupling them from the amnesty/trial debate to build goodwill.  

  3. **Empirical Inquiry with Shared Metrics**:  
     Commission joint studies on:  
     - Security force willingness to cooperate under each model.  
     - Victim priorities (e.g., via surveys: Is acknowledgment or punishment more urgent?).  
     - Cost/feasibility analysis of prosecutions vs. reparations programs.  

  4. **Conceptual Clarification**:  
     Facilitate dialogue to define:  
     - What "impunity" means in practice (e.g., Is amnesty with truth-telling and reparations truly impunity?).  
     - Whether "reconciliation" requires punishment or can emerge from other forms of accountability.  

  5. **Symbolic-Institutional Compromise**:  
     - **Public Apology Ritual**: Perpetrators who testify truthfully must issue formal apologies to victims.  
     - **Vetting (not punishment)**: Bar uncooperative perpetrators from public office or security forces.  

  ---  

  ### **Conclusion: Cautious Optimism**  
  Progress is possible but requires both camps to relinquish ideological purity. The amnesty camp must concede that *some* prosecutions are essential to uphold the rule of law; the trial camp must accept that comprehensive prosecutions could derail transition. A hybrid model—grounded in **conditional incentives for truth-telling, reparations for victims, and narrow but credible prosecutions**—offers a pragmatic middle ground.  

  **Why this could work**: It addresses the core concerns of both sides:  
  - For the **amnesty camp**, it guarantees stability by offering a path to avoid prosecution for most perpetrators.  
  - For the **trial camp**, it ensures moral accountability for those most responsible and those who defy the process.  

  This approach mirrors "accountability bargains" in contexts like Colombia or Sierra Leone, where pragmatism and principle were blended. Without such reframing, the impasse will persist—not due to lack of evidence, but because both sides are answering different questions about what justice *is*.
