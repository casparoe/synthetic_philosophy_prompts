  I'm taking a political philosophy course this semester and we just finished Nozick's Anarchy, State, and Utopia, and I'm a bit confused about the Wilt Chamberlain argument. I was discussing it with a friend last week and we couldn't figure it out. Specifically, I get the basic idea — if you start with a just distribution and then people make voluntary transfers, the resulting distribution is also just, so any patterned principle (like equality or need) will be violated by free exchange — but I'm confused about how this argument is supposed to work given Nozick's own Lockean proviso.

  As I understand it, Nozick weakens the Lockean proviso to something like a compensation requirement (you can appropriate unowned resources as long as you compensate those who are made worse off), and I think this makes it really hard to establish that the initial distribution is just in the first place, which is a premise the Wilt Chamberlain argument needs. Can you explain why the proviso is a problem for the Wilt Chamberlain argument specifically, not just for the entitlement theory in general? And also, is this a problem for the moral residue argument (the argument that taxation is on par with forced labor, or at least that there's a moral cost to taxation even if it's justified) in the same way, or does that argument not depend on the proviso?
