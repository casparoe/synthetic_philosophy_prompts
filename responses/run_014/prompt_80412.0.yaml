  ### Decision Tree: Ineffective Objection in Collective Action Problems

  **Instructions:** Answer each question based on your beliefs. Do not worry about philosophical labels; the tree will categorize your position.

  ---

  #### Q1: In buying a steak from a large factory farm, does your individual purchase make *any difference at all* to the amount of meat produced?  
  - **Yes** → Proceed to Q2.  
  - **No** → Proceed to Q3.  

  #### Q2: Even if your steak purchase makes a difference, is that difference *too small to morally matter* (e.g., a "drop in the bucket")?  
  - **Yes** → Proceed to Q4.  
  - **No** → **Leaf A: Marginal Impact Moralist**.  
    - *Most awkward commitment*: Must defend that vanishingly small harms (e.g., 0.0001% of animal suffering) generate moral duties, risking overdemandingness or the "problem of the heap."  
    - *Note on expected-value reply*: This position often uses decision theory (e.g., expected harm) to "count" tiny differences. Removing this move collapses the case for consequentialists but not deontologists who see minute harms as intrinsically wrong.  

  #### Q3: Do you believe there is a moral duty to vote in large-scale elections?  
  - **Yes** → Proceed to Q5.  
  - **No** → Proceed to Q4.  

  #### Q4: For moral responsibility for harm, must your action be *sufficient by itself* to cause the harm?  
  - **Yes** → Proceed to Q6.  
  - **No** → Proceed to Q7.  

  #### Q5: Does the duty to vote arise from the *act of voting itself* or your *role as a citizen*?  
  - **Act** → **Leaf B: Voting Act-Fetishist**.  
    - *Most awkward commitment*: Assigns moral weight to an act (voting) with near-zero causal efficacy, without appealing to outcomes or roles—appears arbitrary without special symbolism.  
  - **Role** → **Leaf C: Civic Republican**.  
    - *Most awkward commitment*: Demands duties in voting (non-causal role) but not analogous roles (e.g., consumer), requiring ad hoc distinctions between civic/commercial domains.  

  #### Q6: Does moral duty attach to the *specific act* or your *social role* (e.g., consumer, citizen)?  
  - **Act** → **Leaf D: Causal Act-Sufficientist**.  
    - *Most awkward commitment*: Absolves all individuals in collective harms (e.g., climate change) since no single act is sufficient for the outcome.  
  - **Role** → **Leaf E: Causal Role-Sufficientist**.  
    - *Most awkward commitment*: Roles (e.g., "polluter") rarely require sufficient actions, making role-based duties incoherent or impossibly stringent.  

  #### Q7: Does moral duty attach to the *specific act* or your *social role*?  
  - **Act** → **Leaf F: Threshold Act-Contributor**.  
    - *Most awkward commitment*: Admits your act *contributes* to harm (contra Q1) but denies small contributions matter, requiring an arbitrary moral "threshold" to avoid inconsistency.  
  - **Role** → **Leaf G: Threshold Role-Contributor**.  
    - *Most awkward commitment*: Roles demand avoiding *any* harmful contribution, yet tiny contributions are exempted—undercuts the role’s coherence.  

  ---

  ### Leaves Summary (8 Positions)  
  | Leaf | Name | Most Awkward Commitment |  
  |------|------|--------------------------|  
  | A | Marginal Impact Moralist | Defending morally significant *micro-harms* (e.g., 0.00001% of a cow’s suffering). |  
  | B | Voting Act-Fetishist | Valuing voting intrinsically despite zero causal power, independent of roles/outcomes. |  
  | C | Civic Republican | Demanding voting (role duty) but not consumer duties, despite both being non-causal collective acts. |  
  | D | Causal Act-Sufficientist | No duties in *any* collective harm (e.g., famine, pollution) since no individual is sufficient. |  
  | E | Causal Role-Sufficientist | Roles (e.g., "citizen") require impossible self-sufficient impact to trigger duties. |  
  | F | Threshold Act-Contributor | Setting a non-arbitrary "significance" line for contributions (e.g., why 0.1% matters but 0.01% doesn’t?). |  
  | G | Threshold Role-Contributor | Roles forbid harmful contributions, yet permit "too small" ones—inconsistent scope. |  

  ---

  ### Diagnostics & Notes  
  - **Untenable Positions**:  
    - *Causal Role-Contributor (unnamed)*: If you answered "No" to Q1 (causal inefficacy) and "No" to Q4 (contribution suffices), but also chose "Role" at Q6/Q7: Incoherent because roles imply contributing to harm, but you denied any causal contribution.  
    - *Voting Duty + Causal Contributor (unnamed)*: If you answered "No" to Q1 (no meat difference) but "Yes" to Q3 (voting duty) and "No" to Q4 (contribution suffices), you assert voting contributes to outcomes (contra control case design). This is inconsistent.  
  - **Tree Gaps**:  
    - Leaves D/E and F/G are not separated on the "causal vs. magnitude" axis. If you answered "No" to Q1, you take the *causal* path; "Yes" to Q2 lands you in the *magnitude* path.  
    - The tree cannot distinguish "act/role" for Leaf A (rejects magnitude objection).  
  - **Control Cases**:  
    - *Voting*: Exposes contradictions in Leaf B/C vs. D/E/F/G—if you endorse voting duty, you cannot require causal efficacy (Q1 "No" + Q3 "Yes" forces a non-causal rationale).  
    - *Meat*: Tests whether you see your act as a causal *trigger* (Q1 "No") or a *constituent* of demand (Q1 "Yes" but Q2 "Yes" for magnitude).
