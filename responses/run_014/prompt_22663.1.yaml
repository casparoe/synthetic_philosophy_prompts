prompt: |-
  I understand the Kelly criterion at the surface level: on a fair-odds bet with a positive edge, stake a fraction of your bankroll equal to that edge, and this choice maximizes your long-run geometric growth rate. What I want to understand is a subtler point about what happens when your estimate of the edge is wrong. Please explain intuitively why the criterion is asymmetric in this respect: why does there exist a range of overbets — staking more than the true Kelly fraction — that leads to almost sure ruin, i.e., your wealth decaying to zero with probability one, even though each individual bet still has positive expected value? And why does this asymmetry have to do with the fact that the right objective is expected log wealth (the geometric growth rate) rather than expected wealth? I want the gut-level intuition, not the full derivation.
reasoning: |-
  Okay, the user is asking about a nuanced aspect of the Kelly criterion—specifically, why overbetting leads to ruin while underbetting doesn't, even when bets have positive expected value. They want intuitive reasoning, not math. 

  First, I need to recall why Kelly focuses on log wealth, not linear wealth. Expected wealth grows with any positive-EV bet, but that ignores volatility drag. The key is geometric growth—compounding makes volatility harmful in a way that isn't symmetric. 

  The asymmetry comes from how losses multiply. If you lose 50%, you need a 100% gain just to break even. Overbetting amplifies this: a single bad streak can wipe you out because the recovery becomes mathematically impossible. Underbetting is safer—you grow slower, but dips are survivable. 

  I'll use a coin toss example: edge = 20%, true probability 60%. Betting 40% of bankroll (over-Kelly) means one loss requires a 67% win to recover. But after two losses? You're down to 36% of wealth and need 178% growth—nearly impossible. That's the "hole too deep" idea. 

  Also, ruin probability isn't linear. Overbetting pushes you into a zone where even a small edge can't compensate for the risk of hitting zero. The user mentioned "almost sure ruin"—that's because repeated overbets make hitting zero inevitable over infinite time. 

  Finally, I should emphasize why expected log wealth matters: it optimizes long-term compounding. Linear expectation ignores sequence risk. The asymmetry exists because losses compound more destructively than gains when you're overleveraged. 

  The user seems comfortable with Kelly basics but wants deeper intuition. I'll avoid equations and focus on concrete mental models—like the "recovery math" and volatility drag. Their frustration might be about why "positive EV ≠ safe" in betting contexts.
answer: |-
  Here's the gut-level intuition for why overbetting leads to ruin while underbetting doesn't, even with a positive EV on each bet:

  1.  **The Core Problem: Ruin Isn't About Expected *Money*, It's About Expected *Recovery*:** Imagine you bet so much that you lose a huge chunk of your bankroll. To recover, you need a massive percentage gain *on your now-smaller bankroll*. This becomes mathematically harder the deeper the hole you dig. Kelly optimizes for *never digging a hole so deep you can't climb out*.

  2.  **The Asymmetry of Losses:** Losses hurt *more than proportional gains help* when compounded. Losing 50% requires a 100% gain just to break even. Losing 90% requires a 900% gain! **Overbetting increases the chance of a catastrophic loss that makes recovery practically impossible.**

  3.  **Overbetting: Digging the Inescapable Hole:** Suppose the *true* Kelly fraction is 10%, but you bet 30% of your bankroll, thinking your edge is larger than it is.
      *   **One Bad Streak:** A few consecutive losses (which *will* happen eventually) can wipe out 60%, 70%, or 80% of your bankroll.
      *   **The Recovery Trap:** If you lose 80%, you need a 400% gain just to get back to where you started. But you're *still* betting 30% of whatever's left! This massively increases the odds of hitting zero before you can recover, even though each individual bet is +EV.
      *   **Volatility Drag on Steroids:** Overbetting drastically increases the volatility of your bankroll. The "drag" inflicted by this volatility overwhelms the positive drift of your expected value. The deeper the losses, the more the drag dominates.
      *   **The Certainty of Ruin:** Because you're constantly risking a large fraction, the probability of *eventually* hitting a losing streak that reduces your bankroll to near zero (or exactly zero, if fractional betting isn't allowed) approaches 100% over an infinite time horizon. It's not *if*, it's *when*.

  4.  **Underbetting: Playing It Safe:** Suppose you bet only 5% instead of the true Kelly 10%.
      *   **Smaller Losses:** Losing streaks cause smaller percentage drops in your bankroll.
      *   **Easier Recovery:** Losing 20% requires only a 25% gain to recover. This is achievable with your positive edge.
      *   **Volatility Drag is Manageable:** While you grow slower than optimal, the volatility drag is much smaller relative to your expected return. Your positive edge reliably pulls you upward despite the bumps. You *never* dig a hole too deep to climb out of.
      *   **No Ruin:** Your bankroll fluctuates but *always* has a positive expected value on the *next* bet using the *current* bankroll. Zero is avoided with probability one.

  5.  **Why Expected Log Wealth (Growth Rate) is Key:**
      *   **Expected Wealth is Misleading:** Maximizing expected *linear* wealth would tell you to bet your *entire* bankroll every time on a positive EV bet. But one loss means ruin! It ignores the compounding sequence of returns and the risk of ruin.
      *   **Log Wealth Captures Compounding & Survival:** Maximizing expected *log* wealth (Kelly) explicitly accounts for:
          *   **Compounding:** It cares about the *proportional* growth of your bankroll over time.
          *   **Survival:** It inherently avoids strategies where the probability of ruin is >0% over the long run. Log wealth approaches negative infinity as your bankroll approaches zero, heavily penalizing strategies that risk ruin.
          *   **Volatility Drag:** The log function is concave, meaning it naturally penalizes volatility. Higher volatility reduces expected log wealth for the same expected linear return. Kelly finds the sweet spot where the growth from the edge outweighs the drag from volatility *without* crossing the ruin threshold.

  **The Gut Feeling:**

  Think of your bankroll as a climber on a mountain. Kelly is the optimal path up the steepest slope *without* risking a fatal fall.

  *   **Underbetting (5%):** You take a safer, gentler path. You climb slower than you potentially could, but you're very unlikely to fall off the mountain. You *will* reach higher ground eventually.
  *   **True Kelly (10%):** You take the steepest *sustainable* path. It's the fastest way up while staying firmly on the mountain face.
  *   **Overbetting (30%):** You try to climb recklessly fast, venturing onto unstable terrain. A single slip (losing streak) sends you tumbling into a deep crevasse. Even though you *could* theoretically climb out (each step is +EV), the crevasse is so deep, and your subsequent attempts so risky (still betting 30%!), that you inevitably slip again before escaping, falling deeper until you hit the bottom (ruin).

  The asymmetry exists because **losses impose a non-linear recovery cost** that gains do not. Overbetting maximizes the risk and severity of losses that trigger this catastrophic recovery cost, while underbetting minimizes it. Kelly's focus on log wealth is the mathematical embodiment of this survival-and-compounding imperative.
