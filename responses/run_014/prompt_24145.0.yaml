prompt: |-
  I'm in a free will seminar and I keep getting lost in the weeds of Galen Strawson's Basic Argument, so before I commit to a side I want the full spec of what a theory of ultimate moral responsibility has to deliver. I mean "ultimate" in Strawson's sense -- responsibility that isn't just derivative from some other responsibility -- and I want the desiderata list, not a tour of the litterature. Give me the requirements: which cases it has to get right (the regress over "ways of being," the kid-versus-adult difference, the coerced agent, the person whose character was shaped by trauma they didn't choose, and the sourcehood cases), which distinctions it can't collapse (ultimate vs. merely derivative responsibility, being responsible for an act vs. being responsible for the way you are, and "could have done otherwise" read as alternative-possibilities vs. read as sourcehood), and which results it has to be consistent with (the recursive structure of the regress itself, determinism-compatibility, and the fact that we actually feel resentment and gratitude). For each one, state the requirement and the case or consideration that motivates it, and be explicit about which are non-negotiable and which are just preferences of one camp (compatibilists, libertarians, hard determinists, and so on).

  The part I care about most: flag any pair of desiderata you think can't be jointly satisfied, because I suspect that's exactly where the Basic Argument does its work -- that demanding you be responsible for the way you are while also demanding responsibility have a non-derived first ground is what generates the regress and never lets it bottom out. And tell me which single requirement knocks out the largest number of the standard positions. Then, at the very end, put a line that starts with "Verdict:" naming just that one knockout requirement in a short phrase.
reasoning: |-
  Okay, let me start by unpacking the user's request. They're in a free will seminar and struggling with Galen Strawson's Basic Argument. They want a clear list of requirements for a theory of ultimate moral responsibility, specifically in Strawson's sense. The user is looking for desiderata, not a literature review. They mention specific cases like the regress of "ways of being," differences between kids and adults, coerced agents, trauma-shaped characters, and sourcehood. They also want distinctions like ultimate vs. derivative responsibility, and results that must align with determinism and our feelings of resentment.

  First, I need to define "ultimate responsibility" as per Strawson. It's non-derivative, meaning the agent must be the source of their actions in a way that isn't traceable to factors beyond their control. The Basic Argument shows a regress: to be responsible for an act, you must be responsible for how you are, which requires being responsible for prior factors, ad infinitum. This regress makes ultimate responsibility impossible because it never bottoms out.

  The user suspects that two desiderata conflict: being responsible for how you are (Source Requirement) and having a non-derived first ground (Grounding Requirement). If both are necessary, they create an unsolvable regress. That's where Strawson's argument hits hard. 

  Now, listing the requirements. The user provided specific cases and distinctions. Let's categorize them into must-handle cases, must-preserve distinctions, and must-be-consistent-with results. For each, note if they're non-negotiable or camp-specific. 

  Must-handle cases: Regress of ways of being (non-negotiable), Kid vs. Adult (non-negotiable), Coerced Agent (non-negotiable), Trauma-Shaped Character (non-negotiable), Sourcehood Cases (non-negotiable for libertarians, compatibilists handle differently). 

  Must-preserve distinctions: Ultimate vs. Derivative (non-negotiable for Strawson), Act vs. Character Responsibility (non-negotiable), Alternative Possibilities vs. Sourcehood (divisive, camps differ). 

  Must-be-consistent-with: Regress Structure (non-negotiable per Strawson), Determinism-Compatibility (camps differ), Reactive Attitudes (non-negotiable for most, but hard determinists reject them as justified). 

  The key conflict is between Source Requirement and Grounding Requirement. If a theory requires both, it's impossible to satisfy without an infinite regress. That's the core of Strawson's argument. 

  The knockout requirement is the Grounding Requirement. It eliminates libertarians (randomness breaks grounding) and compatibilists (grounding is derivative). Only hard determinism and illusionism accept it, concluding ultimate responsibility is impossible. 

  User's deeper need: They want clarity on why the Basic Argument is compelling and which positions fail. They might be looking for a solid foundation to choose a stance in the seminar. Highlighting the Grounding Requirement as the knockout helps them see why many theories crumble under Strawson's regress. 

  Finally, the verdict should clearly state that the Grounding Requirement is the one that eliminates most positions. Ensuring the user understands this central point addresses their struggle with the Basic Argument.
answer: |-
  Here's the comprehensive specification for a theory of **Ultimate Moral Responsibility (UMR)** in Strawson's sense, structured by your requirements. Non-negotiable requirements for *any* theory aspiring to UMR are marked with **. Camp-specific preferences are noted.

  ---

  ### I. **Must-Handle Cases (Non-Negotiable Core Tests)**
  1.  **The Regress of "Ways of Being"**: **The theory must either halt the regress (justifying why responsibility stops at a particular point) or explain why the regress isn't fatal.** *Motivation:* Strawson's Basic Argument shows that to be UMR for an act (A1), you must be UMR for your relevant mental state (M1) causing A1. To be UMR for M1, you must be UMR for the prior state (M2) that led to M1, and so on infinitely. Without a principled stopping point, UMR seems impossible.
  2.  **Kid vs. Adult Difference**: **The theory must explain why typically developing adults are (or can be) UMR for their actions while young children are not, without relying solely on conventions or social utility.** *Motivation:* Intuition strongly differentiates responsibility between a toddler breaking a vase and an adult doing so deliberately. UMR must ground this difference in something deeper than mere biological/legal maturity.
  3.  **The Coerced Agent**: **The theory must explain why an agent acting under severe, literal coercion (e.g., "Shoot this person or I shoot you and your family") is not UMR for the coerced act, even if they 'chose' it.** *Motivation:* Coercion undermines voluntariness and control. UMR requires genuine agency, not just the appearance of choice under duress.
  4.  **The Trauma-Shaped Character**: **The theory must explain why an agent whose character/values were fundamentally shaped by severe childhood trauma they didn't choose (e.g., an abusive upbringing making them prone to violence) lacks (or has diminished) UMR for actions stemming directly from that character.** *Motivation:* If "who you are" (your character) is not ultimately your responsibility, how can actions flowing inevitably from it be ultimately your responsibility? This directly challenges sourcehood.
  5.  **Sourcehood Cases (Manipulation/Indoctrination)**: **The theory must explain why an agent whose character/values were covertly implanted via brainwashing, direct manipulation, or sophisticated AI neuro-engineering lacks UMR, despite potentially feeling free and making choices consistent with their implanted character.** *Motivation:* Demonstrates that mere psychological integration and consistency ("ownership" of the act) are insufficient for UMR; the *ultimate origin* of the source matters.

  ### II. **Must-Preserve Distinctions (Non-Negotiable Conceptual Boundaries)**
  1.  **Ultimate vs. Merely Derivative Responsibility**: **The theory must provide a clear, non-circular account of what constitutes *ultimate* responsibility distinct from derivative forms (e.g., legal liability, role-based responsibility, responsibility grounded in social conventions or consequentialism).** *Motivation:* Strawson's core target is UMR. Theories collapsing this distinction (e.g., some compatibilisms) fail to address his challenge.
  2.  **Responsibility for an Act vs. Responsibility for the Way You Are**: **The theory must explain the relationship between responsibility for an act (A1) and responsibility for the character/mental state (M1) that produced A1.** *Motivation:* The Basic Argument hinges on this link. Denying any link (e.g., "You can be responsible for acts without being responsible for your character") seems arbitrary. Affirming the link risks the regress. The theory must take a clear stance.
  3.  **"Could Have Done Otherwise" (AP) vs. "Sourcehood"**: **The theory must clarify whether it requires *alternative possibilities* (AP) under exactly the same prior conditions (including mental state) or whether true *sourcehood* (being the genuine originator) is sufficient *without* requiring AP.** *Motivation:* A major fault line. Libertarians demand AP for UMR. Source Incompatibilists (e.g., Derk Pereboom) argue AP isn't necessary, but genuine sourcehood is, and is incompatible with determinism. Many Compatibilists reconfigure "could have done otherwise" (e.g., Frankfurt cases, dispositional analyses) or emphasize sourcehood *within* determinism. UMR theory must pick a lane.

  ### III. **Must-Be-Consistent-With Results (Constraints & Camp-Preferences)**
  1.  **The Recursive Structure of the Regress**: **The theory must explicitly engage with the recursive logic of the Basic Argument.** *Motivation:* Ignoring the regress structure is failing to address Strawson. The theory must explain *why* the regress stops (if it claims it does) or *why* it's invalid/misguided.
  2.  **Determinism-Compatibility**: *Camp-Preference:* **Compatibilists** require UMR compatible with causal determinism (laws of nature + past state fixing all events). **Libertarians** require UMR incompatible with determinism (requiring indeterminism or agent-causation). **Hard Determinists/Illusionists** argue determinism (or indeterminism) makes UMR impossible. *Motivation:* The core metaphysical battleground. The theory's stance here defines its camp.
  3.  **The Phenomenology of Reactive Attitudes**: **The theory must account for why humans *experience* resentment, gratitude, indignation, etc., as genuine responses to others' actions and character, even if it ultimately concludes these attitudes are unjustified.** *Motivation:* P.F. Strawson's point. Denying these feelings exist is implausible. The theory must explain their basis (e.g., as tracking UMR, as useful fictions, as responses to reasons-responsiveness, etc.). *Non-negotiable* to account for the *phenomenon*, but *camp-dependent* whether this justifies the attitudes or shows they're mistaken.

  ---

  ### The Core Tension & The Knockout Requirement

  *   **The Fatal Pair:** The requirement that **UMR requires being ultimately responsible for the way you are (Source Requirement)** combined with the requirement that **UMR must be genuinely *ultimate* and non-derivative (Grounding Requirement)** generates the inescapable regress. If you need to be the ultimate source (Source Requirement) and that sourcehood cannot be derived from anything prior you aren't responsible for (Grounding Requirement), then you must be responsible for creating yourself *ex nihilo* with the specific capacities for self-creation, which is impossible. No standard theory satisfying both exists. Strawson argues this pair *defines* UMR and proves it impossible.
      *   *Libertarians* try to satisfy both via indeterminism/agent-causation, but fail the Grounding Requirement: the agent's core nature ("way of being") that determines how indeterminism resolves or how the agent-cause acts is still not ultimately self-created.
      *   *Compatibilists* typically abandon the Source Requirement *in the ultimate sense*, focusing on control, reasons-responsiveness, or identification *within* a determined character, thus satisfying the Grounding Requirement only by making responsibility derivative (e.g., from the agent's character + history, which they didn't ultimately create).
      *   *Hard Determinists/Illusionists* accept the tension and conclude UMR is impossible.

  *   **The Single Knockout Requirement:** The **Grounding Requirement (UMR must be non-derivative/first-ground)** is the single most devastating requirement.
      *   *Knocks Out Libertarians:* Their core mechanisms (indeterminism, non-causal teleology, agent-causation) inevitably rely on an uncaused core self or nature whose existence and properties the agent is *not* responsible for. UMR remains derived from this ground. Randomness doesn't help; it just breaks the source chain.
      *   *Knocks Out (Standard) Compatibilists:* They explicitly build UMR *derivatively* upon prior states (character, reasons, values, psychological structures) that the agent did not ultimately create or choose. Their "ultimate" responsibility is always grounded in something prior.
      *   *Survived By:* Only positions that explicitly *deny* the possibility of UMR (Hard Determinism, Illusionism, Pessimism like Strawson's) satisfy the Grounding Requirement *by concluding nothing meets it*. They accept that *any* form of responsibility we have must be derivative, not ultimate in Strawson's sense.

  **Verdict:** The Grounding Requirement (Non-Derivative Sourcehood)
