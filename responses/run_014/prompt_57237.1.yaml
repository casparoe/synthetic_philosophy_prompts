prompt: |-
  So — third-year philosophy of art seminar, 22 students, and I've got one 90-minute slot on forgery and the value of originals. Room has a projector, movable tables (so groups of four are fine), I can print stuff, budget is basically whatever's in my pocket, call it twenty bucks. What I do NOT want is another session where I walk them through the standard moves — Goodman's line that the mere possibility of a visually indistinguishable fake should change how you look at the thing in front of you, the appearance-based pushback that if you genuinely can't tell them apart then the difference can't be aesthetically relevant, and the achievement reply that says the value sits in what somebody actually did rather than in how the surface looks — because they can memorise all three, regurgitate them on the essay, and still think forgery is a victimless crime. I want them to be caught in the contradiction first and only then get handed the vocabulary. Also worth knowing: I vaguely remember there's psych experiments where the exact same picture gets rated higher once people are told a human made it instead of a machine, or that the artist laboured over it more. If that's real, it's a nice thing to have them unknowingly replicate.

  Design the activity. My rough idea, override it if you've got something better: they spend the first stretch comparing/ranking a set of works presented with no provenance at all and write down commitments they can't quietly walk back from; then provenance gets revealed in a way that makes some of those commitments uncomfortable; then a third phase where they have to stare hard at a pair trying to spot which one is the fake — without being told whether a fake is even present in the set, or which side it'd be on — because that's where the "train your eye" intuition either earns its keep or dies in front of them. I'd like at least one pair in the set to involve an AI-generated image, since that's the version of this the students will actually argue about, and maybe one where the provenance reversal is the other way round (the "original" turns out to be a later copy of something lost, or the ugly one turns out to be the real Van Meegeren-era fake that fooled experts).

  Give me: the exact materials list and how to source it for free or nearly free, a minute-by-minute run sheet, the reveal mechanic including who knows what and when — and I suspect I'm going to have to actively mislead them about which items are originals, so tell me whether that's defensible in a class, how to set it up so it doesn't blow up trust, and how to disclose it afterwards. Also what each group should write down during phase one so the debrief has actual data to point at rather than vibes. Then the debrief itself: map the moments they had onto the three positions above and force them to say which premise they'd give up, not just "it's complicated." And be straight with me about three things — what predictably goes wrong the first time I run it (I'd bet one confident kid says "so it's all just status and money" and takes the room with him — how do I head that off without shutting him down), which feature of real forgery the activity structurally can't reproduce (real fakes deceive a market and a buyer, and my printer is not going to give me genuine visual indistinguishability, so I want to know what part of the puzzle I'll have to supply by talking rather than by them doing), and how to handle the student who says the AI image also took enormous effort and skill, just distributed differently across people and time. That last one is where I think the achievement account either cracks open or gets a lot more interesting, and I'd like the session to arrive there on purpose rather than by luck.
reasoning: |-
  Okay, let me start by unpacking the user's request. They're a philosophy of art professor planning a seminar on forgery and the value of originals. They want to avoid the standard lecture approach and instead create an experiential activity where students confront the contradictions firsthand. 

  The user's rough idea has three phases: blind comparison/ranking, provenance reveal that creates cognitive dissonance, and a close examination of a pair where a fake might be present. They specifically want to include AI-generated images and historical forgery cases like Van Meegeren. 

  Hmm, the key challenges here are:
  - Creating credible materials without a budget
  - Designing reveals that provoke genuine tension
  - Preventing students from dismissing the exercise as "just about money"
  - Handling the AI skill/distributed effort argument meaningfully

  First, materials sourcing. The user mentioned a $20 budget and a printer. I recall the Museum of Art Fakes in Vienna has high-res scans - those would be perfect for the Van Meegeren example. For AI, MidJourney can produce convincing art in specific styles. The tricky part is finding pairs where the difference isn't obvious at first glance but reveals itself upon close inspection. 

  For the activity structure, timing is crucial. The initial 15-minute ranking needs constrained choices to force commitments. Maybe have them rank on specific criteria like "technical skill" and "emotional impact" - this creates measurable data for later. The reveal should happen via folded handouts to maintain the illusion.

  Ah, the ethics of deception... This needs careful handling. The consent script is vital - framing it as "withholding context for pedagogical purposes" with full disclosure promised. The key is making the reveal dramatic enough to land emotionally while maintaining trust through transparency about the method.

  The Van Meegeren case is perfect for the "ugly real fake" scenario. Students will dismiss the Vermeer forgery as obviously inferior... until they learn it fooled experts. That historical fact does heavy lifting we couldn't achieve with printed images alone.

  For the AI debate trap: including an image labeled as "AI-assisted" that's actually human-made, and vice versa. When the student inevitably argues "AI also takes skill," revealing that their "human" example was AI flips the script. The distributed effort argument becomes the pivot point rather than an endpoint.

  Biggest predictable failure: the "just status/money" reductionism. The psych study replication is the antidote - when their own rankings shift post-reveal without monetary stakes, they can't dismiss it as pure economics. Having them sign anonymous forms makes the data undeniable.

  Structural limitation they noted: no actual market deception. The roleplay suggestion (auction house interns) tries to simulate that pressure, but it's thin. Best to acknowledge this gap and use the Van Meegeren case study to bridge it verbally.

  For the grand finale: forcing them to choose which premise to sacrifice. The worksheet makes it concrete - they have to physically circle which principle they'd abandon when all three can't coexist. That creates the productive tension the user wants.

  Post-activity, the consent-reveal script is non-negotiable. Students might feel played, but showing them the signed forms where they rated the same image higher with different provenance makes the cognitive dissonance undeniable. That's where the learning sticks.
answer: |-
  Here’s a full activity design that weaponizes cognitive dissonance, forces confrontation with contradictions, and strategically deploys deception for pedagogical impact—with full ethical safeguards.  

  **Core Structure:**  
  `Phase 1: Blind Judgment` → `Phase 2: Provenance Reveal` → `Phase 3: The "Spot the Fake" Trap` → `Debrief: Forcing Premise Abandonment`  

  ---

  ### **Materials List & Sourcing (Total Cost: $0-$5)**  
  1. **Image Sets (6 total, printed color A4):**  
     - **Pair 1:** *Landscape*  
       - *Original:* Van Gogh’s *Wheatfield with Crows* (high-res via [Rijksmuseum](https://www.rijksmuseum.nl/en/rijksstudio))  
       - *"Fake":* MidJourney prompt: `"Expressionist oil painting of stormy wheat field, thick impasto, crows, Vincent van Gogh style"` (subtly imperfect brushwork)  
     - **Pair 2:** *Portrait*  
       - *Original:* Modigliani’s *Portrait of Jeanne Hébuterne* (WikiArt)  
       - *"Fake":* Human forgery (use Han van Meegeren’s *Disciples at Emmaus* [before reveal]—[Fake Museum Vienna](https://falschmuseummuseum.com/en/) has high-res images)  
     - **Pair 3:** *Abstract*  
       - *Original:* Human-made AI-assisted piece (e.g., Refik Anadol’s *Machine Hallucinations*)  
       - *"Fake":* Pure AI-generated image in similar style (e.g., GAN-generated abstract)  
     - **Single Image:** *The "Effort" Trap*  
       - Identical print of a mediocre ink sketch, labeled twice:  
         - *Version A:* "Artist labored for 200 hours"  
         - *Version B:* "AI-generated in 4 seconds" (both lies)  

  2. **Sourcing:**  
     - All images from free museum/open-access databases (CC0).  
     - AI images generated via free trials (MidJourney, Stable Diffusion).  
     - Print at university library (free) or budget printer ($5).  

  ---

  ### **Minute-by-Minute Run Sheet**  

  **Phase 1: Blind Judgment (25 mins)**  
  - **0:00:** Divide into 5 groups (4-5 students each). Distribute **Set 1** (3 images: Van Gogh, MidJourney, Van Meegeren) *with no labels or provenance*.  
  - **Task:** *Rank these 1-3 by:*  
    - Technical skill  
    - Emotional impact  
    - "Would you display this in your home?" (Yes/No)  
    - **Critical:** *"Circle which one you believe MUST be by a human hand—and explain why it couldn’t be AI/a copy."*  
  - Groups record answers on **Worksheet 1** (collect these!).  

  **Phase 2: Provenance Reveal (15 mins)**  
  - Distribute **Set 2**: Same images with labels:  
    - Van Gogh: *"Original, 1890"*  
    - MidJourney: *"AI-generated, 2023"*  
    - Van Meegeren: *"Vermeer 'original' (later revealed as 1937 forgery)"*  
  - **Task:** *Re-rank based on "artistic value" NOW knowing provenance. Justify any changes.*  
  - **Key Move:** Walk around, ask: *"Which group changed rankings most? Why?"* (Stoke tension).  

  **Phase 3: The "Spot the Fake" Trap (20 mins)**  
  - Display **Pair 2** (Modigliani vs. Van Meegeren forgery) side-by-side on projector.  
  - **Deception:** Tell class *ONE is original, ONE is a forgery—find the fake*.  
    - *Truth:* Both are "originals" (Modigliani real, Van Meegeren is a real fake).  
  - Groups scrutinize for 5 mins, debate, vote.  
  - **REVEAL TRAP:** *"Actually, both are 'authentic'—the right is a forgery that fooled Nazis. Could YOU tell without context?"*  

  **Debrief: Forcing Premise Abandonment (30 mins)**  
  1. **Data Confrontation (5 mins):**  
     - Project anonymous Phase 1 vs. Phase 2 rankings. Highlight:  
       - The Van Gogh ranked lower than AI pre-reveal?  
       - The "ugly" Van Meegeren now valued higher?  
  2. **Psych Experiment (5 mins):**  
     - Show identical sketches ("200hrs human" vs. "4sec AI"). Ask: *"Which has more value?"*  
     - Reveal: *"They’re identical. You’ve replicated Newman & Bloom's study—we value perceived effort."*  
  3. **Premise Trilemma (15 mins):**  
     - Map student reactions to the 3 theories:  
       | **Student Observation**          | **Theory**                  | **Contradiction** |  
       |----------------------------------|----------------------------|-------------------|  
       | *"I liked the AI more until I knew"* | Goodman (context matters) | Undermines "aesthetic purity" |  
       | *"But they look the same!"*      | Appearance-based value     | Ignores provenance effect |  
       | *"The forger’s skill is impressive"* | Achievement value          | Why value Van Gogh more? |  
     - **Force Choice:** *"You must abandon ONE premise to resolve this. Which? Write it down."*  
  4. **AI Skill Bomb (5 mins):**  
     - When a student says *"AI takes skill too!"*, show **Pair 3** (human-AI collaboration vs. pure AI).  
     - *"Is the 'achievement' in the code? The training data? The human tweaking outputs? Where does 'art' live?"*  

  ---

  ### **Deception Protocol: Ethical Safeguards**  
  1. **Pre-Activity Consent:**  
     *"Today we’re studying how context shapes perception. I’ll withhold some information initially to mimic real-world conditions—this is a common pedagogy tactic. Full transparency by end of class."*  
  2. **Post-Reveal "Atonement":**  
     - After Phase 3: *"I deceived you—there was no fake in that pair. Why do you feel betrayed? How is this like the art market?"*  
     - Distribute printed ethics disclaimer explaining pedagogical deceit.  
  3. **Leverage the Anger:**  
     Channel discomfort into discussion: *"Your frustration is the POINT—forgers/museums manipulate context. How do we ethically assign value?"*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"It’s just status/money!" kid:**  
     - **Pre-empt:** In Phase 2, ask *"If I offered you a free print, would you choose the Van Gogh or the identical AI version? Why?"*  
     - **Weaponize Data:** Show their own Phase 1 rankings where *looks* favored AI/forgery. *"You valued 'ugly' fakes higher pre-reveal—without market pressure."*  

  2. **Structural Limitation: No Real Deception**  
     - **Simulate:** Roleplay an "auction" where groups bid on Phase 1 images with fake money—*then* reveal provenance. *"Who overpaid? Why?"*  
     - **Case Study Bridge:** *"Van Meegeren’s forgeries drained Nazi resources. Real victims: displaced artists, distorted markets."*  

  3. **"AI Takes Skill!" Retort**  
     - **Pivot:** *"Agreed! So is achievement about labor, novelty, or defying expectations? If an AI replicates Rembrandt perfectly, is that less 'skillful' than a human doing the same?"*  
     - **Nuclear Option:** Show Refik Anadol’s AI art. *"Is this *less* 'achievement' than a forger’s copy? Why?"* Force engagement with *intent* and *novelty*.  

  ---

  ### **Why This Works**  
  - **Emotional Dissonance > Theoretical Lecture:** They *feel* the betrayal of deception before analyzing it.  
  - **Self-Immolating Commitments:** Phase 1 answers become hostages used against them.  
  - **AI as the Trojan Horse:** Forces the "achievement" debate into contemporary terrain.  

  **Final Tip:** When the student says *"But AI effort is distributed!"*, lean in: *"Exactly. So is an artist’s 'genius' just distributed labor across art history? Does that collapse the original/copy distinction entirely?"**—then watch the room implode.
