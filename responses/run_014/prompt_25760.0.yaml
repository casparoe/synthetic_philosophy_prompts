prompt: |-
  I'm a PhD student in epistemology, preparing a unit on the epistemology of disagreement for an upper-level undergraduate seminar. The class has about 15 students and meets for 75 minutes. I want an in-class activity that makes students feel the tension between conciliationist and steadfast responses to peer disagreement before we read the papers—something where they form a judgment, discover that an epistemic peer disagrees, and then have to decide what to do, all before anyone names the positions.

  The activity should be structured so that the rules, incentives, and information asymmetries generate both pulls: some students should find themselves wanting to revise substantially toward their peer, others should feel entitled to stick with their original judgment, and ideally a given student feels both pulls at different moments. The debrief then names conciliationism and steadfastness and maps specific moments in the activity onto the arguments we will read.

  Constraints: no real money, though small prizes are fine. The activity itself should run about 35–40 minutes, leaving the rest for debrief and discussion. Students should not hear the terms "conciliationism" or "steadfastness" until the debrief.

  Please give me:

  (1) The full activity design—materials, setup, rules, a round-by-round timeline, and the scoring or payoff scheme.

  (2) A debrief script that walks through what happened and maps it onto the philosophical positions, with specific questions to ask students at each stage.

  (3) An honest note on what will predictably go wrong the first time I run it and how to handle it.

  (4) A candid assessment of which feature of the philosophical debate the activity cannot capture and that I will need to supply myself in discussion.

  Lead with the activity design itself in the first sentence—no preface, no restating of the question.
reasoning: |-
  Alright, the user is a PhD student in epistemology preparing an undergraduate seminar on the epistemology of disagreement. They need an in-class activity that makes students experience the tension between conciliationist and steadfast approaches without naming them upfront. The activity must take 35-40 minutes for 15 students, with no real money but small prizes allowed.

  First, I need to design an activity where students form judgments, encounter peer disagreement, and decide whether to revise their views. The key is to create situations where some students feel compelled to adjust their opinions while others stick to their original stance. 

  The user mentioned incentives and information asymmetries. So, the activity should include elements where students have private information or different confidence levels. Maybe a quiz with ambiguous questions where answers aren't straightforward. Then, pairing students to discuss and allowing them to change answers could simulate peer disagreement. 

  Scoring is important for incentives. Providing points for accuracy and consistency might work. If students get points for correct answers, they might be motivated to change if convinced by a peer. But if they also get points for sticking when they're right, that could create tension. Including a confidence score multiplier could add another layer—students who are confident and correct get more points, but if wrong, they lose more. That might mimic the risk of steadfastness versus conciliation.

  Materials should be simple: question sheets, scoring sheets, maybe a timer. Setup needs to be quick to fit the time. Three rounds: individual judgment, peer discussion, then revision. After each round, reveal correct answers to show accuracy, which feeds into their scoring and decisions in subsequent rounds.

  Predictable issues: students might not take the scoring seriously. To handle this, emphasize the competitive aspect with small prizes. Also, some pairs might dominate discussions, so suggesting they take turns speaking could help. Time management is crucial; strict timers for each phase will keep things on track. 

  The debrief should connect their experiences to conciliationism and steadfastness. Start by asking how they felt during disagreements, why some changed answers while others didn’t. Then introduce the terms and link their actions to philosophical arguments. Highlight where the activity falls short, like the difficulty in truly knowing if someone is an epistemic peer, which is a key debate point in the literature.

  What the activity can't capture: the deep assessment of peerhood. In real life, determining if someone has the same evidence and cognitive abilities is complex. The activity assumes peers based on the same information, but real disagreements involve more nuance. The instructor will need to address this in discussion, explaining that real-world disagreements require judging peer status, which affects how we respond.

  Also, the activity simplifies evidence to private clues. In reality, evidence sharing might resolve disagreements, but here, they can't share, creating artificial tension. This limitation should be noted, as real epistemic peers might share all evidence, leading to different outcomes.
answer: |-
  **Activity Design: "Judgment Under Uncertainty"**  

  **Materials:**  
  1. 15 identical quiz sheets (3 ambiguous questions + confidence scales)  
  2. 15 scoring trackers  
  3. Instructor answer key (pre-determined "correct" answers)  
  4. Timer  
  5. Small prizes (e.g., candy, stickers) for top 3 scorers  

  **Setup (5 min):**  
  - Distribute quiz sheets and scoring trackers.  
  - Explain: *"This is a reasoning game. Your goal is to maximize your score by answering questions accurately. Some questions have objectively correct answers, but they’re tricky. You’ll see how your peers respond and decide whether to adjust your answers."*  

  **Rules:**  
  - **Scoring:**  
    - **Accuracy:** +10 pts per correct answer (revealed post-round).  
    - **Revision:** If you change an answer post-discussion, -3 pts (penalty for "flip-flopping").  
    - **Confidence Multiplier:** Rate confidence from 1–5 after each answer. If correct, score multiplies by confidence (e.g., 10 × 3 = 30). If wrong, lose 10 × confidence (e.g., -30).  
  - **Peer Pairing:** Randomized each round.  

  **Timeline (35 min):**  
  1. **Round 1: Individual Judgment (8 min)**  
     - Students answer 3 questions independently (e.g., *"Estimate the weight of this object in grams using only these 3 clues"*).  
     - Rate confidence per question (1–5).  
     - *Collect sheets.*  

  2. **Round 2: Peer Disclosure (10 min)**  
     - Redistribute sheets randomly (students get a peer’s anonymous sheet).  
     - Students see peer’s answers/confidence but CANNOT discuss.  
     - *Task:* On scoring trackers, note whether they’d revise their original answer (yes/no) for each question.  

  3. **Round 3: Peer Discussion & Final Revision (12 min)**  
     - Pair students randomly. They share original answers, confidence, and revision intentions.  
     - *Task:* Discuss each question for 90 sec. Then privately decide final answers (can revert to original, keep revised, or new answer).  
     - *Collect final sheets.*  

  4. **Scoring & Reveal (5 min):**  
     - Display correct answers. Students calculate scores (including revision penalties/confidence multipliers).  
     - Announce top scorers; distribute prizes.  

  ---  
  **Debrief Script (30 min):**  
  *(Start cold—no philosophical terms yet)*  

  1. **Experience Elicitation (10 min):**  
     - *"Show of hands: Who felt strongly pulled to change an answer when you saw your peer disagreed? Who resisted changing?"*  
     - *"Describe a moment you revised your answer after discussion. What convinced you?"* → Highlight emotional/cognitive tension.  
     - *"Did the confidence multiplier make sticking harder/easier? Why?"*  

  2. **Introduce Frameworks (5 min):**  
     - *"Today, you grappled with two instincts:*  
       **Steadfastness**: *Sticking to your original judgment despite disagreement.*  
       **Conciliationism**: *Substantially revising your view when an epistemic peer disagrees.*"  
     - Write terms on board.  

  3. **Map Activity to Theory (10 min):**  
     - *"When you penalized revisions (-3 pts), that mirrored the* **cost of spinelessness** *in steadfast arguments (e.g., Kelly: revising too easily ignores your evidence)."*  
     - *"Confidence multipliers? That’s the* **risk/reward of self-trust** *—steadfast pays if right, but conciliationists (like Elga) say overconfidence blinds you."*  
     - *"In Round 2, you saw a peer’s answer but couldn’t talk. How did that feel?"* → Link to **unshared evidence** (Christensen: peers might have private reasons).  

  4. **Transition to Readings (5 min):**  
     - *"Next class, we’ll see how Feldman defends conciliationism using cases like Round 3, where discussion failed to resolve disagreement. How might this activity simplify real-world epistemic peers?"*  
     - *"Did anyone assume their peer was *not* a true equal? Why?"* → Tease peerhood criteria.  

  ---  
  **Predictable Problems & Fixes:**  
  - **Problem:** Students skip revision penalties or miscalculate scores.  
    **Fix:** Use a simple scoring table on trackers; walk through one example live.  
  - **Problem:** Dominant peers bully others into agreeing.  
    **Fix:** Emphasize *"This is about your judgment, not persuasion"*; enforce discussion time limits.  
  - **Problem:** Ambiguous questions spark debates about "correctness."  
    **Fix:** Stress *"I predetermined answers; treat them as objective for the game."*  
  - **Problem:** Low stakes reduce engagement.  
    **Fix:** Gamify fiercely ("Top scorer picks music for next class!").  

  ---  
  **Limitation to Address in Discussion:**  
  The activity **cannot capture the deep challenge of assessing peerhood**. Students *know* peers are equally competent (same clues, same context). Real-world disagreements involve opaque differences in evidence access, cognitive biases, or expertise—making peer judgment itself contentious (e.g., Frances’ *"disagreement deficit"*). Say: *"In this game, ‘peer’ was handed to you. But how do we *know* someone is our epistemic equal? That’s where the real debate lives."*  

  **Why this works:** The scoring rules force tradeoffs between consistency (steadfast) and flexibility (conciliationist), while private clues + discussion simulate evidence asymmetry. Confidence multipliers make overconfidence tangible—students *feel* the gamble of doubling down.
