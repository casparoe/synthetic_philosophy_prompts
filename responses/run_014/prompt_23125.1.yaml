prompt: |-
  I sit on my university's IACUC (the Institutional Animal Care and Use Committee, for the uninitiated — though on this commitee everyone knows what it is, and it is as tedious as you'd imagine). We have a protocol in front of us this week that would house a species of wild-caught mouse, one that in the wild digs extensive burrow systems, in a standard cage with paper bedding. The PI's welfare justification is that the animals show no overt signs of distress and are gainning weight just fine, so the digging behavior is, in her words, "not needed" in captivity. A behavioral ecologist on the committee objects, saying the digging was selected for (shelter, predator avoidance, thermoregulation) and that suppressing it is a welfare deficit even if the animal is physically healthy. The committee is split, and the deeper disagreement is about what "function" means: the PI's side thinks a behavior's function is what it currently contributes to the animal's welfare in its actual environment (the causal-role sort of account), while the ecologist thinks function is historical, what the trait was selected for (the etiological account).

  This came up in my philosophy of biology seminar last week and I've been stuck on one case since: the appendix, or a trait like it, that was clearly selected for one thing but now causes harm. I can't figure out which account handles that better, and I'm worried that whichever standard we pick, there's a version of this case that breaks it. I don't want to just paper over that in the memo.

  Please draft the committee's decision memo: approve, reject, or approve with conditions, with a specific course of action and a time frame, and say which account of biological function we should codify as our standard for assessing "normal" behavior going forward. I want the reasoning to engage the appendix-type case explicitly, and to give an honest treatment of the strongest consideration on whichever side loses, not a restatement of the winning side's data.
reasoning: |-
  Okay, the user is on an IACUC committee dealing with a protocol about housing wild-caught mice that naturally dig burrows. The main issue is whether standard cages with paper bedding are sufficient, given that the mice aren't showing overt distress and are gaining weight. The PI argues that since the digging behavior isn't necessary in captivity, it's fine. But a behavioral ecologist disagrees, saying the behavior is part of their evolutionary history and suppressing it is a welfare issue. 

  The committee is split over two definitions of biological function: causal-role (current utility) vs. etiological (historical purpose). The user mentions an example from their philosophy seminar—the appendix, which was once useful but now can cause harm. They want the memo to address this case explicitly and decide which account to use going forward.

  First, I need to unpack the appendix example. The etiological view would say the appendix's function is historical (digesting cellulose), even though it now causes appendicitis. The causal-role view might see its current function as immune-related or nothing, but its harm is a problem. This example shows that both accounts have issues: etiological might overemphasize outdated functions, while causal-role might miss evolutionary needs. 

  For the mice, the key is whether their digging is essential for welfare. Even without obvious distress, suppressing a natural behavior could lead to chronic stress or issues not immediately visible. Weight gain isn't the only indicator; behavioral needs matter too. The user wants the memo to honestly address the losing side's points. If they approve with conditions (providing burrowing opportunities), they need to counter the PI's argument that the mice are "fine" by explaining latent risks. If they reject, they must acknowledge the lack of current distress evidence.

  The user's deeper need seems to be a robust, philosophically sound standard for future cases. They don't want to gloss over the appendix paradox. The memo should use the appendix case to show neither account is perfect, but etiological is better for welfare because it anticipates needs beyond immediate survival. Compromise is possible—approve with enrichment requirements—which aligns with the 3Rs (Replacement, Reduction, Refinement). 

  Time frame: Require modifications before approval. Codify etiological function as the standard but emphasize context and current welfare indicators as part of assessment. This balances both views: historical importance with present conditions. The appendix example demonstrates that ignoring evolutionary history risks harm (like appendicitis), but current context matters too (not all traits are still functional). 

  Strongest counter: The PI's data shows no current harm, so why change? Response: Welfare includes mental state; latent stress or stereotypic behaviors could emerge. Also, the 3Rs mandate refining environments. The ecologist's point is valid, but requiring full natural replication isn't feasible—hence the compromise with modified enclosures.
answer: |-
  **MEMORANDUM**  
  **To:** Institutional Animal Care and Use Committee (IACUC)  
  **From:** [Your Name/Committee Chair], IACUC Member  
  **Date:** October 26, 2023  
  **Subject:** Decision on Protocol #XXXX: Housing of *[Species Name]* Wild-Caught Mice  

  ---

  ### **Committee Decision:**  
  **Approve with Conditions**  

  ### **Specific Conditions & Time Frame:**  
  1. **Housing Modification:** The PI must provide enhanced enclosures that permit species-typical digging and burrowing behaviors. This may include:  
     - Deep, compactable substrate (e.g., soil-sand mixture) ≥30 cm depth, **or**  
     - Artificial burrow systems (e.g., interconnected tunnels/perspex tubes).  
  2. **Implementation Deadline:** Modifications must be implemented within **60 days** of approval.  
  3. **Welfare Monitoring:** The PI must submit bi-weekly reports for 3 months documenting:  
     - Behavioral metrics (e.g., burrowing frequency, stereotypic behaviors).  
     - Physiological stress markers (e.g., fecal glucocorticoids).  

  ---

  ### **Reasoning:**  
  The committee acknowledges the PI’s data showing no overt distress or weight loss in standard cages. However, we find the behavioral ecologist’s argument compelling: suppressing a deeply ingrained, evolutionarily selected behavior risks chronic welfare deficits not captured by physical health metrics alone. The core philosophical disagreement—**causal-role vs. etiological accounts of biological function**—requires explicit resolution to standardize future evaluations.  

  #### **1. The Appendix Paradox and Its Implications**  
  The case of the appendix (a trait selected for cellulose digestion but now vestigial/harmful) illustrates weaknesses in both functional accounts:  
  - **Etiological account failure:** If we define function *only* historically (i.e., the appendix "functions" in cellulose digestion), we ignore its current pathology (appendicitis).  
  - **Causal-role account failure:** If we define function by current utility (i.e., the appendix has "no function" or a minor immune role), we overlook why its structure persists and why removal is often beneficial.  

  **Resolution:** Neither account is universally superior, but **for animal welfare assessments, the etiological account is more precautionary**. Traits/behaviors shaped by natural selection likely fulfill needs that persist even in captivity, and suppressing them risks harm (e.g., stress, frustration). The appendix’s harm arises because modern environments render its historical function obsolete—but unlike the appendix, *digging remains a viable, expressible behavior* in captivity. Suppression is an active welfare intervention, not a passive environmental change.  

  #### **2. Why the Etiological Account Prevails for Welfare**  
  - **Evolutionary mismatch:** Wild-caught animals retain behaviors selected for survival (e.g., burrowing for thermoregulation/predator avoidance). Captivity removes predators but not the need for environmental control.  
  - **Latent deficits:** Absence of overt distress ≠ absence of chronic stress. Weight gain may mask compensatory coping mechanisms (e.g., reduced activity).  
  - **Precedent:** ASC/AVMA guidelines emphasize allowing "species-typical behaviors" rooted in evolutionary history.  

  #### **3. Strongest Counterargument (Causal-Role) and Our Response**  
  The PI rightly notes that causal-role function prioritizes *actual* welfare outcomes (weight gain, no distress). If a behavior’s historical purpose is obsolete (e.g., burrowing for predator avoidance in predator-free cages), insisting on its expression could misallocate resources without improving welfare.  

  **Rebuttal:** While current indicators matter, they are insufficient proxies for psychological welfare. The etiological account alerts us to risks before pathology manifests (e.g., stereotypic digging in deprived mice). Compromise is possible: We require *opportunities* for digging, not replication of wild complexity.  

  ---

  ### **Standard for "Normal Behavior" Going Forward:**  
  This committee **codifies the etiological account** for defining "normal" species-typical behavior. However, welfare assessments must:  
  - **Contextualize historical function:** Does the trait/behavior retain adaptive value in captivity?  
  - **Integrate current indicators:** Physical health and absence of distress remain necessary but insufficient criteria.  
  - **Prioritize feasibility:** Refinement must be practical (e.g., providing burrowing substrate, not 1:1 wild burrow systems).  

  ---

  ### **Conclusion:**  
  Approval is contingent on housing modifications that permit digging within 60 days. The etiological account better safeguards against invisible welfare deficits, as illustrated by the appendix paradox: while historical function does not *guarantee* current relevance, its suppression demands rigorous justification. We thank both parties for elevating this critical debate.  

  **Signature:** ________________________________________  
  **IACUC Chair**  

  --- 

  **Key Philosophical Takeaways for Committee:**  
  1. **Etiological function** is adopted as the standard to preempt "latent welfare risks" in wild-caught/non-domesticated species.  
  2. **The appendix case** shows that traits can become harmful when environments change—but unlike passive traits, *behaviors* can often be accommodated to avoid harm.  
  3. **No account is perfect**, but etiological definitions align with the precautionary principle central to animal welfare ethics.
