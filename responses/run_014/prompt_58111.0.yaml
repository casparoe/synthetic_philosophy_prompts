  I am working through the idea that hypocrisy undermines a person's standing to blame others. Could you construct two original, parallel cases centered on a university tutor who blames her students for plagiarism? In the first case the tutor has herself committed a comparable academic wrong yet her blame still seems in order, while in the second a small variation makes the same blame seem objectionably hypocritical. Explain what principled difference between the cases accounts for this contrast, and why it cannot be reduced to a difference in how serious her own wrong was.
