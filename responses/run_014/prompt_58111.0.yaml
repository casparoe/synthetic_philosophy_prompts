  Here are two parallel cases designed to isolate the principle where hypocrisy undermines standing, *without* relying on differences in the severity of the tutor's own wrongdoing:

  **Case 1: The Reformed Tutor (Blame Seems Appropriate)**
  Dr. Evans, a respected chemistry tutor, discovered significant plagiarism in a group lab report. She calls the students in, expresses deep disappointment, outlines the academic consequences, and emphasizes the critical importance of original work and proper citation for scientific integrity. Unbeknownst to the students, Dr. Evans herself committed plagiarism on a minor undergraduate essay *ten years ago* during a period of severe personal crisis. This incident was formally investigated by her university at the time; she admitted fault, faced serious sanctions (probation, mandatory ethics course), and was deeply ashamed. Since then, she has been scrupulously honest in her own work, became a leading advocate for academic integrity on campus, and developed the very plagiarism-detection protocols she used to catch these students. Her current actions and professional identity are defined by a rigorous commitment to the norms she enforces. While she feels a personal pang recalling her past, her blame of the students feels legitimate and authoritative.

  **Case 2: The Actively Compromised Tutor (Blame Seems Hypocritical)**
  Dr. Evans, a respected chemistry tutor, discovered significant plagiarism in a group lab report. She calls the students in, expresses deep disappointment, outlines the academic consequences, and emphasizes the critical importance of original work and proper citation for scientific integrity. Unbeknownst to the students, Dr. Evans is *currently* under significant pressure to publish. To meet a looming deadline for a grant renewal report, she has *recently* fabricated some experimental data points and copied methodology descriptions from an old colleague's unpublished thesis without attribution, presenting it as her own original work. She plans to "fix it later" or hopes it won't be noticed. Her current actions directly violate the very norms – honesty in data, proper attribution – that she is simultaneously enforcing with punitive authority on her students. Her blame feels hollow, unfair, and hypocritical.

  **The Principled Difference: Ongoing/Current Violation vs. Reformed Past Violation**

  The crucial difference accounting for the contrast in her standing to blame is **not the *seriousness* of her own wrongdoing** (both involve significant academic dishonesty: plagiarism in Case 1, fabrication & plagiarism in Case 2), but rather **her *current relationship* to the norm she is invoking**:

  1.  **Case 1 (Reformed):** Dr. Evans' violation is firmly in the *past*. She has acknowledged it, been held accountable, reformed her behavior, and now *consistently upholds and champions* the norm against plagiarism. Her current self is aligned with the standard she applies. Her blame stems from a *genuine commitment* to the norm. Her past mistake doesn't negate her current standing as a norm-enforcer because she embodies the norm's value *now*.
  2.  **Case 2 (Actively Compromised):** Dr. Evans is *currently and actively violating* the core norms of academic integrity (honesty, attribution) in her *own* work *while simultaneously blaming others* for violating those same norms. Her actions demonstrate that she does not *genuinely endorse or submit to* the norm's authority in her own conduct *at the time of blaming*. Her blame is thus an exercise of power, not moral authority. It lacks sincerity and fairness because she exempts herself from the standard she imposes on others *in the present moment*.

  **Why Severity Isn't the Deciding Factor:**

  *   **Similar Severity:** Both cases involve intentional academic dishonesty central to scholarly work (plagiarism). While fabrication might be seen as marginally worse by some, the core wrong – misrepresenting others' work as one's own – is comparable and serious in both instances.
  *   **Contrast Persists Despite Severity:** Even if we imagine the tutor's *past* plagiarism in Case 1 was *more severe* than her *current* fabrication/plagiarism in Case 2 (e.g., plagiarizing a thesis vs. fudging minor data), the *hypocritical sting* would still be far stronger in Case 2. The problem isn't "how bad was her own act?" but "is she *currently* living by the rule she's using to condemn others?" A reformed person who once committed a grave wrong but now sincerely upholds the norm can possess standing. Conversely, someone committing even a relatively "minor" ongoing violation of the very norm they are enforcing *at that moment* undermines their standing through immediate hypocrisy.
  *   **The Core Issue is Consistency and Sincerity:** Standing relies on the blamer *credibly representing* the shared norm and its authority. In Case 2, Dr. Evans' *current actions* reveal her disregard for that norm's authority over *her own* conduct, destroying that credibility. In Case 1, her past action doesn't destroy this because her *current* actions robustly affirm the norm's authority. The difference lies in the *temporal and practical alignment* between her conduct and the norm *at the time of blaming*.

  **Conclusion:** These cases illustrate that the undermining effect of hypocrisy on standing hinges on **the blamer's *current* violation or disregard of the very norm they invoke to blame others**. A reformed past violator who sincerely upholds the norm *now* can retain standing. However, an *ongoing* or *current* violator lacks the moral consistency and sincerity necessary to credibly blame others for failing that same norm. This distinction is fundamentally about present alignment with the norm's authority, not merely the historical gravity of one's own past transgressions.
