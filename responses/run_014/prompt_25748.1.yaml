answer: |-
  Here is a structured set of desiderata for an adequate theory of pleasure to address the heterogeneity problem, motivated by philosophical and empirical considerations:

  **Core Desiderata (Non-Negotiable for Solving Heterogeneity):**

  1.  **Unity Requirement:** *Must identify a unifying feature* shared by all bona fide pleasures (solving proofs, warm baths, relief, morphine, etc.), despite phenomenological diversity.
      *   **Motivation:** The core heterogeneity objection. Without this, "pleasure" is an empty or disjunctive concept, undermining hedonism's claim that one thing ("pleasure") is the sole intrinsic good.
      *   **Non-Negotiable:** Yes. This *is* solving the heterogeneity problem.

  2.  **Non-Circularity/Avoiding Vacuity Requirement:** *Must define pleasure independently of "good," "desired," or "pursued."*
      *   **Motivation:** Hedonism becomes vacuous if "pleasure" just means "whatever we intrinsically desire/maximize" (trivializing the claim that pleasure is the good). The theory must specify *what* pleasure *is*.
      *   **Non-Negotiable:** Yes. Essential to avoid vacuity.

  3.  **Accommodation Requirement:** *Must successfully accommodate paradigmatic cases* of pleasure without undue stretching or exclusion:
      *   **Sensory Gratification:** (Warm bath, morphine - strong bodily component).
      *   **Relief:** (Pain ceasing, anxiety subsiding - defined by contrast).
      *   **Anticipation:** (Excited looking forward - future-oriented).
      *   **Achievement/Effort:** (Solving a proof, winning an argument - effortful, goal-completion).
      *   **Flow States:** (Deep absorption in activity - often without explicit feeling of pleasure *during*, but intrinsically rewarding).
      *   **Aesthetic Appreciation:** (Listening to music, viewing art - complex, often distanced).
      *   **Social Connection:** (Hearing a friend's voice - relational, complex emotions).
      *   **"Bodily-Indistinct" Pleasures:** (Intellectual satisfaction, tranquility - lacks clear somatic location).
      *   **Motivation:** The heterogeneity objection arises *because* these diverse cases are all intuitively called "pleasures" and seem intrinsically valuable. Excluding significant groups risks ad-hocness.
      *   **Non-Negotiable:** Yes (for core cases like sensory, relief, achievement, social). Accommodating *all* might be aspirational, but major exclusions weaken the theory.

  4.  **Phenomenal/Experiential Constraint:** *Must account for pleasure's essential connection to conscious experience/feeling.*
      *   **Motivation:** Hedonism traditionally grounds intrinsic value in conscious experience. Pleasure seems inherently *felt*. A theory reducing it purely to non-conscious states (e.g., *only* dopamine release) may lose the experiential core.
      *   **Non-Negotiable:** Yes. Hedonism is fundamentally experientialist. However, the *nature* of the experience (single feeling vs. attitude) is contested.

  5.  **Distinction from Desire-Satisfaction:** *Must clearly differentiate pleasure from the mere satisfaction of desire.*
      *   **Motivation:** We can desire things that don't bring pleasure (e.g., fulfilling a duty painfully), and experience pleasure without prior desire (e.g., an unexpected delight). Hedonism collapses into desire-satisfaction theories if this distinction fails.
      *   **Non-Negotiable:** Yes. Crucial for hedonism's distinctiveness.

  6.  **Distinction from Absence of Pain:** *Must differentiate positive pleasure from the mere absence of pain/discomfort.*
      *   **Motivation:** Neutral states exist. Relief involves both cessation of pain *and* a positive feeling. A theory conflating neutrality with pleasure overstates the scope of pleasure.
      *   **Non-Negotiable:** Yes. Essential for defining the target state.

  7.  **Occurrent vs. Dispositional:** *Must account for both occurrent pleasure (feeling good *now*) and dispositional enjoyment (finding an activity pleasurable overall, even if not constantly feeling it).*
      *   **Motivation:** We call activities "pleasurable" even when not actively feeling intense pleasure every second (e.g., hiking, reading). Hedonism needs to value both the feeling and the pleasurable activity/states.
      *   **Non-Negotiable:** Yes. Captures how we use the concept.

  **Important, but Potentially Parochial or Contentious Desiderata:**

  8.  **Distinction from Evaluation/Attitude (Potentially Parochial):** *Must differentiate pleasure itself from the *judgment* that something is good or pleasurable.*
      *   **Motivation:** We can judge something is good without feeling pleasure (e.g., admiring a noble sacrifice that pains us). Attitudinal theories *identify* pleasure with a positive attitude, challenging this distinction.
      *   **Status:** Highly important for felt-quality theorists; contested core claim for attitudinal theorists.

  9.  **Higher-Order Pleasures (Parochial to some):** *Should accommodate or explain the alleged qualitative difference between "higher" (intellectual/aesthetic) and "lower" (sensory) pleasures, if accepted.*
      *   **Motivation:** Mill's claim that some pleasures are inherently "higher" due to their nature. Crucial for value pluralists within hedonism.
      *   **Status:** Parochial. Essential for Millian hedonists; irrelevant or rejected by strict Benthamite quantitative hedonists.

  10. **Intensity/Duration Trade-offs (Empirical Constraint):** *Must be consistent with findings on how we experience and evaluate pleasure over time (e.g., peak-end rule, duration neglect, discounting).*
      *   **Motivation:** Psychological research shows our retrospective evaluation of pleasure isn't a simple sum of momentary intensity x duration. A theory needs to explain how occurrent pleasures aggregate into overall value.
      *   **Status:** Important empirical constraint; failure suggests incompleteness.

  11. **Neuroscientific Plausibility:** *Must be consistent with core findings from affective neuroscience.*
      *   **Motivation:** Pleasure involves brain mechanisms (e.g., opioid systems for liking, dopamine for wanting/reward prediction error, orbitofrontal cortex for valuation). A theory wildly at odds with this data loses credibility.
      *   **Status:** Important constraint, but neuroscience is evolving and may not map neatly onto philosophical categories (e.g., liking vs. wanting). Not strictly non-negotiable for definition, but strong evidence against theories that make empirically false predictions.

  **Key Tensions Between Desiderata:**

  *   **Phenomenal Unity vs. Heterogeneity Accommodation:** This is the *core* tension. A theory insisting on a single, distinctive, homogeneous phenomenal quality (**Felt-Quality**) struggles mightily to accommodate intellectual/aesthetic/relief pleasures without distorting them. A theory abandoning phenomenal unity (**Attitudinal**, **Functional**) risks losing the essential experiential link (#4) or becoming too diffuse/variable (#1).
  *   **Phenomenology vs. Function/Attitude:** Prioritizing the *feeling* (#4) makes distinguishing pleasure from desire-satisfaction (#5) and judgment (#8) easier, but harder to unify diverse feelings (#1). Prioritizing function/attitude makes unity (#1) and accommodating diverse cases (#3) easier, but risks losing the distinctive feel (#4) and conflating with desire/judgment (#5, #8).
  *   **Accommodation vs. Precision:** Casting a wide net to include all intuitive pleasures (#3) risks making the concept vague or disjunctive, threatening unity (#1). Defining too precisely (e.g., only certain sensory states) risks excluding clear cases of pleasure (#3).

  **How Main Approaches Fare (Briefly):**

  *   **Felt-Quality Theories:** Excel at #4 (Phenomenal Constraint), #5 (vs. Desire), #8 (vs. Judgment). Struggle severely with #1 (Unity) and #3 (Accommodating non-sensory pleasures). Face challenges with #7 (Dispositional) and #10 (Trade-offs).
  *   **Attitudinal Theories (e.g., Feldman):** Excel at #1 (Unity via attitude), #3 (Accommodation), #7 (Occurrent/Dispositional). Struggle with #4 (Phenomenal Constraint - is the attitude *felt*?), #5 (vs. Desire - attitude is close to desire-satisfaction), #8 (vs. Judgment - attitude *is* a judgment-like state). Can handle #10 (Trade-offs via attitude aggregation).
  *   **Functional/Representational Theories:** Excel at #1 (Unity via role - e.g., intrinsic motivation, positive reinforcement), #3 (Accommodation), potential compatibility with #11 (Neuroscience). Struggle with #4 (Phenomenal Constraint - is the function/representation *felt*?), #5 (vs. Desire - function often involves motivation), #6 (vs. Absence of Pain). Can be vague on specifics.
  *   **Default Theories (e.g., Sidgwick's "feeling apprehended as desirable"):** Attempt to bridge feeling and attitude. Risk circularity (#2) if "desirable" isn't defined independently.

  An adequate theory must navigate these tensions, providing a principled account that satisfies the core desiderata while minimizing losses on the others. The heterogeneity problem persists precisely because no current theory flawlessly meets all these demands simultaneously.
