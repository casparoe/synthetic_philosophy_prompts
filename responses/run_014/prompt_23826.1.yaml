    - The precautionary money pump suggests that the agent might be led to pay to avoid being drawn into a cycle. This is somewhat like paying for an option to avoid future unfavorable states (which is a form of hedging).
  - **Residue**: 
    - The argument for pumping incomplete preferences relies on the agent making a series of trades that are individually rational at the time (due to the money bonus) but collectively lead to a dominated position or a loss over cycles. This is similar to the concept of "transaction costs" in arbitrage: if there are bid-ask spreads, then a cycle of trades might incur costs. But in our case, the bonus is the opposite. 
    - However, the literature does not yet have a universally accepted money-pump for incomplete preferences in a single cycle without additional assumptions. The residue is large: the mapping to arbitrage is not clean because the standard arbitrage pricing framework assumes complete preferences (a complete ordering by the market) or at least no-arbitrage with transaction costs (which can create no-trade regions). The philosophical debate about whether incompleteness can be exploited is ongoing.

  ### Summary of Residue and Hard Questions

  1. **Diachronic Rationality (Sophisticated/Resolute)**:
     - **Residue**: The core issue is whether rationality binds an agent across time. The sophisticated approach assumes dynamic consistency (the agent can plan backward and stick to the plan at each node). The resolute approach assumes that the agent can pre-commit and that such pre-commitment is rational.
     - **Hard Question**: Is this residue due to a missing concept in arbitrage pricing? Not exactly. Arbitrage pricing assumes a single optimizing agent or market participants who act to avoid arbitrage. The diachronic challenge arises from the philosophy of personal identity over time and whether a decision at time t can bind or obligate the agent at time t+1. This is not modeled in arbitrage pricing, which is atemporal or assumes a fixed strategy. The residue is philosophical and not a shortcoming of arbitrage pricing.

  2. **Incomplete Preferences**:
     - **Residue**: The money-pump for incomplete preferences is not as clear-cut as the cyclic case. It often requires multiple cycles or a different exploitation mechanism.
     - **Hard Question**: Is this because arbitrage pricing is missing a concept? Arbitrage pricing with transaction costs (bid-ask spreads) does allow for no-trade regions, but it doesn't naturally model an agent who is indifferent between two assets. The market prices might reflect the bid-ask spread, but the agent's indifference is a personal preference. The residue might be due to the philosophical disagreement about whether indifference can be exploited. It's possible that the money-pump argument for incomplete preferences is not as strong as for cyclic preferences, and thus the mapping fails.

  ### Overall Conclusion

  The money-pump argument for cyclic preferences translates cleanly to arbitrage pricing. The sophisticated defense maps to dynamic programming and state-dependent no-trade regions, and the resolute defense maps to exogenous constraints. The case of incomplete preferences does not map cleanly and is still debated in decision theory. 

  The residue in the diachronic cases (sophisticated/resolute) stems from a philosophical disagreement about the nature of rationality over time, which arbitrage pricing does not address because it assumes a unified agent or market. The residue in incomplete preferences stems from both conceptual challenges in decision theory and the fact that arbitrage pricing typically assumes complete markets or at least no-arbitrage with given prices (which may include spreads) but does not model an agent's indifference.

  Thus, the money-pump argument, in its basic form, is indeed a Dutch book argument and translates well. The extensions require philosophical commitments that go beyond the mathematical structure of arbitrage pricing.
answer: |-
  ### Restating the Money-Pump Argument in Arbitrage Vocabulary

  #### **1. Plain-Vanilla Case: Cyclic Preferences (A > B > C > A)**
  - **Setup**: An agent has cyclic preferences over outcomes: prefers A to B, B to C, and C to A. A bookie offers sequential trades:  
    - Trade 1: Pay $ε to swap A for B.  
    - Trade 2: Pay $ε to swap B for C.  
    - Trade 3: Pay $ε to swap C for A.  
    Net result: Agent returns to A but loses $3ε.  
  - **Arbitrage Translation**:  
    This is a **static arbitrage opportunity** for the bookie. The agent's inconsistent preferences create a "pricing kernel" with a cycle, violating **no-arbitrage conditions**. The bookie constructs a **synthetic arbitrage strategy**: by chaining three trades, they extract riskless profit ($3ε) from the agent's willingness to transact at "mispriced" marginal rates. The cycle (A→B→C→A) is a **closed path with negative cash flow**, analogous to a triangular arbitrage opportunity in FX markets.  

  ---

  #### **2. Diachronic Defenses: Sophisticated vs. Resolute vs. Naive**
  - **Naive Agent**: Accepts all trades, gets pumped.  
    *Arbitrage counterpart*: A trader who ignores path-dependence and dynamic replication, leading to arbitrage losses.  
  - **Sophisticated Agent**: Uses backward induction to foresee the pump.  
    - *Example*: At Trade 3, they refuse C→A (avoiding the final loss). But this makes C worthless (since they’re stuck with it), so they refuse B→C, then A→B.  
    - *Arbitrage Translation*: **Backward-induction pricing** in dynamic replication. The agent treats their future decisions as American options, valuing paths via dynamic programming (e.g., binomial tree pricing). Refusing trades is like setting **exercise boundaries** to block arbitrage.  
    - *Mapping*: Clean. Matches how quant models avoid arbitrage in path-dependent derivatives (e.g., barrier options).  
  - **Resolute Agent**: Precommits to a plan (e.g., "never leave A") and refuses renegotiation.  
    - *Example*: Rejects all trades away from A, even if momentarily tempting.  
    - *Arbitrage Translation*: A **hard no-trade clause** in a structured contract (e.g., a swap with knockout barriers). Precommitment acts as an **exogenous constraint**, shrinking the feasible set of trades.  
    - *Mapping*: Clean. Mirrors institutional constraints (e.g., "do not exercise before expiry") in structured products.  

  ---

  #### **3. Pumping Incomplete Preferences (No Strict Preference Between Options)**
  - **Setup**: Agent has no preference between A and B (A ~ B), but prefers B to C and C to A. Bookie exploits via:  
    - Trade 1: Swap A for B + $ε (accepted, as B+ε > A).  
    - Trade 2: Swap B for C + $ε (accepted, as C+ε > B).  
    - Trade 3: Swap C for A (accepted, as A ~ C, but now agent has A, not A+ε).  
    Net result: Agent returns to A but paid $2ε (gains from Trades 1–2 are forfeited).  
  - **Arbitrage Translation**:  
    Incompleteness creates a **bid-ask spread**: the agent accepts trades only if compensated by $ε (the "spread"). The bookie exploits by luring them into the cycle with cash incentives, then removing the spread at a loss to the agent. This mirrors **liquidity-driven arbitrage**:  
    - The agent’s "no-trade region" (where A ~ B) has a width of $ε.  
    - By crossing the spread twice (paying $ε to exit A→B, then $ε to exit B→C), the agent is left with a dominated position when the spread vanishes at C→A.  
  - **Mapping**:  
    - **Clean for bid-ask spreads**: The $ε payments mimic crossing the spread.  
    - **Residue**: Unlike markets, the agent’s "spread" is preference-driven, not liquidity-driven. The pump exploits **indifference as a weakness**, whereas arbitrage pricing treats spreads as exogenous.  

  ---

  ### Residue Report: What Survives, What Distorts, What Has No Counterpart

  #### **1. Clean Translations**  
  - **Static money-pump** ↔ **Triangular arbitrage**.  
    Both violate no-arbitrage via cyclic mispricing.  
  - **Sophisticated defense** ↔ **Backward-induction pricing**.  
    Both use dynamic programming to block arbitrage paths.  
  - **Resolute defense** ↔ **Hard contractual constraints**.  
    Both impose exogenous rules to restrict trade sets.  
  - **Incomplete preferences** ↔ **Bid-ask spreads**.  
    Both create no-trade regions exploitable via spread-crossing.  

  #### **2. Partial/Distorted Translations**  
  - **Diachronic Rationality (across-time binding)**:  
    - *Philosophical claim*: Rationality requires current/future selves to coordinate.  
    - *Arbitrage analogue*: **Dynamic replication** assumes perfect commitment to a hedging strategy.  
    - *Distortion*: In finance, commitment is enforced externally (e.g., collateral). Philosophy treats it as a *rational obligation*. Residue arises because arbitrage pricing **doesn’t model time-sliced agency** – it assumes a unified optimizer.  
    - *Hard answer*: The residue is philosophical. Arbitrage pricing lacks a concept of **temporal identity**; it can describe *how* to block pumps (via constraints) but not *why* it’s irrational to violate them.  

  - **"Exploitable in Principle"**:  
    - *Philosophical claim*: Vulnerability to pumping defines irrationality, even if no bookie exists.  
    - *Arbitrage analogue*: **No-arbitrage bounds** in derivatives pricing (prices *must* satisfy inequalities to avoid theoretical arbitrage).  
    - *Distortion*: Finance focuses on *actionable* arbitrage; philosophy cares about *logical consistency*. The residue is that arbitrage pricing **assumes market forces punish inconsistency**, while decision theory debates whether consistency is intrinsically rational.  
    - *Hard answer*: Residue is philosophical. The "in principle" argument relies on **normative rationality**, absent in positive finance models.  

  #### **3. No Counterpart**  
  - **Indifference Exploitation**:  
    In incomplete preferences, the pump works by **turning indifference into strict loss** (via cash incentives). Arbitrage pricing has no parallel; **indifference isn’t modeled** – prices are either arbitrage-free or not. Bid-ask spreads arise from costs, not indifference.  
    - *Why?* Arbitrage pricing is silent on preferences; it takes prices/utilities as given. The pump’s core – exploiting preference gaps – has no financial analogue.  
    - *Hard answer*: This gap exists because arbitrage pricing **lacks a preference model**. It can describe *what* happens with spreads but not *how* preferences create them.  

  - **Resolute Commitment as Rational Obligation**:  
    Philosophy debates if precommitment is rationally binding (e.g., Kantian vs. Humean views). Finance views constraints as **tools to avoid losses**, not moral imperatives.  
    - *Why?* Arbitrage pricing is **consequentialist**: constraints are valued only if they improve outcomes. The idea that a "promise to future self" creates obligation has no counterpart.  
    - *Hard answer*: Residue is purely philosophical. No missing concept; finance simply avoids normative claims.  

  ---

  ### Conclusion  
  - **Strong mappings** exist for:  
    - Static pumps → cyclic arbitrage.  
    - Sophisticated/resolute → dynamic replication/hard constraints.  
    - Incompleteness → bid-ask spreads.  
  - **Residue stems from philosophy**:  
    - Time-binding rationality and "in principle" exploitability are normative claims absent in arbitrage pricing.  
    - Indifference exploitation has no financial analogue because arbitrage pricing doesn’t model preference gaps.  
  - **No distortion needed**: The translations hold without smuggling in assumptions. Where residue exists, it’s because philosophy addresses questions (e.g., "what *should* bind agents across time?") that arbitrage pricing deliberately sidesteps.  
  - **Final verdict**: Money-pumps are indeed Dutch books for preferences. The diachronic and incompleteness extensions map cleanly *structurally*, but the *normative weight* of rationality is philosophy’s added layer. As a quant, you can model the pumps but not resolve why they’re "irrational" – that’s philosophy’s job.
