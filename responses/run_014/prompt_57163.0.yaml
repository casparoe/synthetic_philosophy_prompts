          However, if they continue now, and this is I1, they go to I2. At I2, the driver (them) will again think: P(this is I1)=0.5, P(I2)=0.5, so will choose to exit (since exit gives 2 > continue gives 1.5 as before). So yes, they will exit at I2.  
          So driver's calculation:  
            Exit now: exp 2  
            Continue now: exp = P(this is I1) * (payoff if go to I2 and exit) + P(this is I2) * (payoff if continue to checkpoint) = 0.5 * 4 + 0.5 * 1 = 2.5  
          So they prefer to continue.  
          But this is inconsistent: if continue is better, why would they assume future self exits? Future self faces same choice and same belief; if continue is better at that point too, they might continue.  
          Actually, if they assume future self follows the *same reasoning*, then at each interchange, continue gives 2.5 (by assuming next self exits), so continue is always better. Then they would never exit, get payoff 1 per trip.  
          This is messy.  
      **Simpler summary for user**:  
        - Depot computes optimal symmetric policy (because driver can't distinguish locations): At each interchange, exit with probability 1/3. This yields **~1.333** expected payoff per trip.  
        - Driver at an interchange: Believes P(current is first interchange A) = 0.5, P(current is second interchange B) = 0.5 (due to ignorance and symmetry).  
          - Exit now: Expected payoff = (0.5)(0) + (0.5)(4) = **2**  
          - Continue: If current is A (prob 0.5), will reach B later and face the same randomized choice (exit w.p. 1/3, get 4; or continue w.p. 2/3, get 1). Expected payoff if current is A = (1/3)(4) + (2/3)(1) = 4/3 + 2/3 = 2. If current is B (prob 0.5), continue gives payoff 1. So overall expected payoff for Continue = (0.5)(2) + (0.5)(1) = 1 + 0.5 = **1.5**.  
          Driver sees **2 > 1.5**, so wants to Exit every time.  
        - But if driver exits every time:  
            - If at A (first), exit → payoff 0.  
            - If at B (second), exit → payoff 4.  
            Since they always hit A first, if they exit every time, they always exit at A → payoff **0**. Worse than depot's plan.  
      **Where reality leaks**: The odometer. The interchanges are 40km apart. Driver could note distance since last reset (wiped at interchange). Depot resets odometer at each interchange to prevent this. But reset might be imperfect (millimeter drift, tire wear changing circumference). The story plugs it: the driver *tries* to check, but the odometer reading is identical (by chance or calibration), deepening the uncertainty.  

