  **Technical Checks**  
  1.  **Payoff Values Preserved**: Story uses 0 (depot/refused), 4 (hub/full pay), 1 (checkpoint/late) without distortion.  
  2.  **Driver's Ignorance Maintained**: No cues (odometer, smell, radio) break symmetry; reader shares driver's uncertainty throughout.  
  3.  **Policy Implementation**: Depot mandates randomization (die roll ≤2 exits ≈ *p*=1/3). Driver’s local desire to always exit (seeing 2 > 1.5) conflicts but is overruled by enforcing the randomized policy.  
  4.  **Memory Wipe Critical**: Driver cannot reconstruct past self’s reasoning, making adherence an act of faith. No note-leaving possible (security wipe is total).  
  **Potential Bend**: Driver rolls at *every* interchange (per policy), but the emotional weight focuses on the first roll where continuing feels worse. The second roll (resulting in exit) resolves the tension narratively without violating probabilities. The math holds if randomization is enforced consistently.
