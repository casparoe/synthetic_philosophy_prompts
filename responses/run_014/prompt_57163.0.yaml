  **The Die You Carry**  

  The sodium light bleeds through the windshield, painting the cab in jaundiced yellow. Same cracked lip on the overpass concrete above. Same peeling exit sign, its arrow pointing left into nothing, font crisp and anonymous. Forty kilometers of scrub desert since the last interchange, or maybe four hundred. The steering wheel vibrates under Jess’s palms, a constant tremor from the idling engine. It always does this. Always has.  

  The plastic cube sits heavy in her shirt pocket, a six-sided die, depot-issue white, edges softened by months of handling. Its presence is a grit against her ribs. *Roll for direction*, the dispatcher said eleven hours ago, back when the world had edges and names. *Roll it every time. No notes, no memory, clean slate each stop. Security protocol*. Jess fingers it now. It feels absurd. Sacred. Humiliating.  

  Exit now? Or push forward?  

  If she takes the ramp, two futures split. Option one: back to the depot. Load refused. Twelve hours of desert monotony for zero pay, a cup of bad coffee, and dispatch’s silent judgment. Zero. Option two: the hub. On time. Full pay. The sweet chime of credits hitting her account. Four. Fifty-fifty, the desert whispers. Always fifty-fifty here in this identical now.  

  If she doesn’t exit? The corridor runs straight another forty klicks, maybe, then dead-ends at a border checkpoint. Late delivery. Fractional fee. A black mark on her record. One.  

  Her gut screams *exit*. Take the chance. Two beats one point five, easy math. Two potential credits shimmering in the heat haze versus the drab certainty of one-point-something less. The die in her pocket feels like an insult. Why roll? Why leave it to plastic chance when the numbers are so clear?  

  She remembers the briefing. Not the words, but the dispatcher’s face, earnest, slightly pitying. *Trust the policy, Jess. It’s optimized. Calculated. You’re part of a system*. Her past self, rested, caffeinated, nodded. Agreed. That Jess knew the route, the sequence, the cold probabilities from the depot’s god’s-eye view. That Jess understood why rolling a one or a two here, now, in this sodium-lit purgatory, was better than certainty. This Jess, dust in her throat, eyes gritty, remembers only agreeing. Not why. The ‘why’ got wiped clean at the last interchange, along with the odometer reset and the memory of what she’d eaten for breakfast. Loyalty now is faith in a ghost.  

  She pulls the die out. Holds it in her cupped palm. White plastic, cool against her skin. The numbers are black, slightly faded. She thinks about just turning the wheel. Taking the ramp. Claiming she rolled it, it said exit, who would know? The cab cameras only monitor her hands, not the die’s face. But the ghost of her past self is watching. The self who knew the plan, who signed the contract, who understood the numbers she can no longer reconstruct. Betraying that self feels like cutting a lifeline in the dark.  

  Her thumb flicks the die onto the dash. It clatters, spins, wobbles against the base of the dusty speedometer. Comes to rest.  

  Three.  

  *Continue*.  

  The number glares up at her. Three. Not a one or a two. Not exit. Continue. One point five. Less than two. Stupid plastic. Stupid policy. Stupid past self.  

  A wave of resentment washes over her, hot and sour. This is the trap. Not the desert, not the identical interchanges. This moment. Bound by a decision made by a version of herself who knew the map, who could see the whole journey laid out like a circuit board, while she sits here blindfolded by reset protocols and fatigue. She cannot reconstruct the logic. She can only obey the ghost. Or not.  

  She almost does it. Almost grabs the die, crams it back in her pocket, and wrenches the wheel left. Exit. Take the two. Spite the plan, the policy, the past.  

  But loyalty is a muscle memory stronger than logic. The ghost trusted her. She has to trust the ghost.  

  Jess takes her foot off the brake. The truck lurches forward, leaving the sodium island behind, plunging back into the ink-dark corridor. The die lies on the dash, showing three. A monument to obedience she cannot justify. She doesn’t pick it up. It’ll get wiped at the next interchange anyway.  

  Forty kilometers bleed past under the tires. Scrub, rock, starlight. The vibration in the wheel, the hum of the tires, the ache in her lower back – all constants. The next sodium glow appears, identical, inevitable. Same cracked concrete lip. Same sign. Same yellow light pooling on the same gray asphalt.  

  The truck slows, stops. Memory wiped. Context reset. Odometer ticks back to zero.  

  Jess sits. The desert is vast and silent.  

  She feels the plastic cube in her pocket. Heavy. Familiar. She pulls it out. Holds it.  

  Exit now? Or push forward?  

  If she takes the ramp… Zero or Four. Fifty-fifty. Exp two.  
  If she continues… Checkpoint. Late. One. Or… if this is the first one, she’ll reach another. Where… she’ll have to do this again. With the die. Expected… something less than two. One point five.  

  Her gut screams *exit*.  

  The die sits in her palm. Cool. Impersonal. A mandate from the ghost.  

  She rolls.  

  The clatter is loud in the stillness. The die spins, catches a fleck of mica in the dash plastic, wobbles. Stops.  

  One.  

  *Exit*.  

  Relief, sharp and sudden. She doesn’t question it. Doesn’t think about the global average, the depot’s cold calculus, or the ghost’s plan. The plastic oracle has spoken the word her gut wanted. She turns the wheel, eases onto the ramp, leaving the corridor behind. The sodium light shrinks in her mirrors, another identical island swallowed by the dark.  

  She doesn’t know if this is the hub or the depot. She won’t know for another twenty klicks, when the warehouse lights either welcome her in or the depot gates slide shut. The not-knowing is part of the price. The die, heavy again in her pocket, is the only artifact of the ghost’s faith. She carries it. That’s the job.  

