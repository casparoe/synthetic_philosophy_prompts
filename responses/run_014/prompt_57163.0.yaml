  First, I need to unpack the core mathematical tension:
  - Depot's optimal policy: With two identical interchanges (A and B) and payoffs (0 at A, 4 at B, 1 for continuing past both), randomizing exit decisions yields expected value of (1/3)*0 + (1/3)*4 + (1/3)*1 ≈ 1.67, beating any deterministic strategy.
  - Driver's perspective: At any interchange, conditional probability of being at B is only 50%, making exiting seem better (expected value 2 vs continuing's 1). But following this intuition every time drops overall value to 1.5.

  The critical realism gap I'd highlight: In reality, drivers might notice subtle environmental differences (odometer drift, micro-landmarks) despite apparent symmetry. The story could "plug this leak" by having the protagonist actively suppress such cues due to regulatory training.

  For the fiction execution, I'm considering:
  - Title concept: "The Weight of the Die" - physicalizing the randomization mandate
  - Structural mirroring: Repeating sensory details with fractional variations to maintain uncertainty
  - Emotional core: The humiliation of outsourcing judgment to a plastic cube, symbolizing eroded autonomy
  - Key scene: Driver nearly rebels against the die but obeys, demonstrating loyalty to their past self's agreement

  Technical safeguards post-story:
  1. Confirm payoff matrix alignment (0/4/1 values preserved)
  2. Verify no persistent state assumption holds (memory wipe at interchanges)
  3. Check randomization mechanism consistency (die use matches depot's 1/3 strategy)

  The challenge will be maintaining perfect reader uncertainty while making the decision paralysis visceral. I'll avoid all exposition, embedding the paradox in the protagonist's bodily experience - the dryness in their throat when ignoring the exit ramp, the sweat-slick die in their palm. The resolution must feel inevitable yet unsatisfying, like the puzzle itself.
