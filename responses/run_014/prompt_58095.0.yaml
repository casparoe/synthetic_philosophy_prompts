   Key concepts to explain briefly in the handout (for self-containment):

   1. **Gödel's First Incompleteness Theorem**: Roughly, any consistent formal system that is sufficiently strong to express basic arithmetic will be incomplete; that is, there will be true statements about arithmetic that the system cannot prove.

   2. **Formal System**: A set of axioms and rules of inference that allows one to generate theorems (provable statements). The system must be effectively axiomatized, meaning there is a mechanical procedure to check whether a proof is valid.

   3. **Consistency**: The system does not prove a contradiction (like both P and not-P).

   4. **Sufficiently Strong**: The system can express basic arithmetic (like addition and multiplication of natural numbers) and can encode the syntax of its own proofs.

   5. **Second Incompleteness Theorem**: A consistent formal system of the above kind cannot prove its own consistency.

   The tree branches on key questions about the claim:

   - Does the target domain (e.g., AI, law, ethics, theology) purport to be a formal system (with axioms and rules) that is consistent, effectively axiomatizable, and expressive enough for basic arithmetic?
