prompt: |-
  I have been reading Anscombe's protest against Oxford's decision to award Truman an honorary degree, and I find her central claim compelling: choosing to kill the innocent as a means to one's ends is always murder, and Truman did precisely that when he authorized the bombings of Hiroshima and Nagasaki. But when I try to extend her reasoning, it seems to prove far too much. I have laid out the argument below, and I cannot see where to stop it.

  (1) Choosing to kill the innocent as a means to one's ends is always murder.
  (2) Truman chose to kill the innocent civilians of Hiroshima and Nagasaki as a means to ending the war and saving lives.
  (3) So Truman murdered.
  (4) If Truman murdered, then anyone who intentionally participates in a plan to kill the innocent as a means to an end is also a murderer.
  (5) The pilots who dropped the bombs intentionally participated in that plan.
  (6) The scientists who designed and built the bomb knew it would be used to kill civilians and intended their work to contribute to that end.
  (7) The citizens who voted for the government that ordered the bombings, or who supported the war effort, intentionally contributed to the policy that killed the innocent.
  (8) Therefore the pilots, the scientists, and the voters are all murderers.
  (9) But it is absurd to call all of them murderers; many were merely doing their jobs, or were one among millions, or did not know the specific plans.
  (10) Therefore something is wrong with the argument, and I need to know which premise to reject.

  I would most like to keep (1) and (3). I am willing to give up (8), but I want to know what giving it up costs me elsewhere. Some people tell me the problem is in (4): that participating in a plan is not the same as choosing to kill, but I do not see how to draw that line without letting Truman off the hook too, since he also did not personally drop the bombs. Others say the problem is in (6) or (7), because foresight is not intention, but Anscombe seems to think that if you knowingly bring about an evil as a means, you intend it. Which step should I reject, and what does rejecting it cost? If I have to give up (1), what do I replace it with? If I keep (1), must I accept (8)? I would rather not, but I want to know what I am paying.
reasoning: |-
  Okay, let me start by unpacking the user's dilemma. They've been reading Anscombe's argument against Truman receiving an honorary degree, specifically her claim that intentionally killing innocents as a means is always murder. The user finds this compelling but is troubled by how the logic extends to pilots, scientists, and even voters, leading to what seems like an absurd conclusion that all are murderers. 

  First, I need to understand the core tension. The user wants to condemn Truman without condemning everyone involved. They’re attached to premises (1) and (3) but wary of (8). Their struggle is with moral complicity—how far does responsibility travel in a chain of causation? 

  I recall Anscombe’s double effect doctrine: intention matters. Truman directly intended civilian deaths as a means to end the war. But the scientist designing the bomb? They might intend the weapon’s creation, not its specific use. Here’s a key distinction: proximate vs. remote agency. Truman’s choice was direct and final; the scientist’s contribution is several steps removed. 

  The pilots present a trickier case. They pressed the button, but under orders. Does that absolve them? Not entirely—but their moral agency is constrained by hierarchy and lack of alternatives. Absolutism might call them murderers, but proportionality (a tool Anscombe rejects) could differentiate here. 

  Voters are the farthest removed. Supporting a war effort isn’t the same as intending specific atrocities. Collective responsibility is real, but labeling millions murderers dilutes the term’s gravity. The user’s intuition about absurdity here is sound. 

  The user’s deeper need seems twofold: to uphold moral absolutism without impractical rigidity, and to resolve cognitive dissonance between condemning leaders and excusing followers. They might also seek a framework that preserves personal accountability without paralyzing societal function. 

  I think rejecting premise (4) is least costly. It avoids watering down "murder," keeps Truman condemned, and accepts that moral responsibility attenuates with distance from the act. The cost? We must articulate why Truman’s role is uniquely culpable—perhaps his direct, uncoerced authorization. 

  Alternative paths? Rejecting (6)/(7) by separating foresight from intention. But Anscombe would balk, and it might exonerate Truman if applied consistently. Replacing (1) with proportionalism sacrifices moral clarity for nuance—but maybe that’s necessary. Still, the user prefers keeping (1), so I’ll prioritize that. 

  Final thought: The user’s anxiety about "costs" suggests they value both moral precision and practical ethics. My reply must honor that balance.
answer: |-
  You've hit upon one of the most profound challenges in moral philosophy: the problem of **complicity and moral distance**. Anscombe's absolutist position (premise 1) is logically coherent, but its implications force us to confront uncomfortable questions about collective action. Let's break down where the argument might be stopped without abandoning the core condemnation of Truman.

  ### The Crucial Flaw: Premise (4) is Overbroad
  **Reject Premise (4):**  
  *"If Truman murdered, then anyone who intentionally participates in a plan to kill the innocent as a means to an end is also a murderer."*  
  **Why?** This premise conflates all forms of participation with *identical moral responsibility*. Moral culpability isn't binary; it exists on a spectrum based on:
  - **Proximity to the act:** Direct causation vs. remote contribution.
  - **Agency and autonomy:** Freedom to refuse vs. coercion or lack of alternatives.
  - **Specificity of intention:** Intending the evil *itself* as a means vs. foreseeing it as a side effect or contributing to a system where it *might* occur.

  **How rejecting (4) preserves (1) and (3) while avoiding (8):**
  1. **Truman:** Made the *final, uncoerced, specific decision* to kill civilians as a direct means to end the war. His intention aligns perfectly with (1).
  2. **Pilots:** Carried out orders under military hierarchy. While they "pulled the trigger," their agency was constrained. They did not *formulate the plan* or *intend the deaths as their means*; they executed a mission. (This doesn't absolve them entirely, but their culpability is different from Truman's).
  3. **Scientists:** Designed the bomb *for the state*. Their intention was likely "to create a weapon for national defense/deterrence/victory," not specifically "to kill innocents as a means." While they foresaw the *potential* use, their contribution was indirect and non-specific. Building a tool isn't identical to deciding its use.
  4. **Citizens/Voters:** Supported the war effort generally. Their intention was "to defend the nation/achieve victory," not "to kill innocents as a means." Their contribution is highly diffuse, non-specific, and mediated by layers of representation and bureaucracy. They lack both proximate causation and specific intent.

  **Cost of Rejecting (4):**  
  You must develop a nuanced theory of **degrees of complicity**. Truman is a *principal* (direct, intentional agent). Others might be *accomplices* (pilots), *enablers* (scientists), or *remote contributors* (voters) with diminishing culpability. Calling them all "murderers" collapses morally significant distinctions. Anscombe herself acknowledged degrees of responsibility in other writings, even while maintaining the absolute wrong of intentional killing.

  ### Other Premises Under Pressure
  1. **Premise (6) & (7): The Foresight/Intention Distinction**  
     *Problem:* Anscombe *does* argue that "foreseen and chosen as part of the plan" implies intention. However, applying this rigidly to scientists/voters overextends.  
     *Refinement:* Distinguish:  
     - **Direct intention:** "I do X *in order to* kill innocents (as a means/end)." (Truman)  
     - **Oblique intention:** "I do X for goal Y, *foreseeing* that innocents will die, but I do not *aim* at their deaths."  
     *Cost:* This risks letting Truman off if you argue he only "foresaw" civilian deaths but didn't "intend" them. Historical evidence shows he *chose* civilian targets *precisely* to shock Japan into surrender – making the deaths intended as a means.  
     *Solution:* Keep Anscombe's strict definition for *direct agents* (like Truman) but accept that *contributors* (scientists, voters) may only have oblique intention or foresight, reducing their culpability below "murder."

  2. **Premise (1): Is It Truly Absolute?**  
     *Alternative:* Adopt **Doctrine of Double Effect (DDE)**. This keeps (1) but adds:  
     > An act with both good and bad effects is permissible *if*:  
     > a) The act itself is good/neutral,  
     > b) The *intention* is only the good effect (bad effect is foreseen but not intended),  
     > c) The good effect outweighs the bad effect,  
     > d) The good effect isn't achieved *by* the bad effect.  
     *Problem for Truman:* (d) fails – the "good" (surrender) was achieved *by* the "bad" (killing innocents).  
     *Benefit:* Allows condemnation of Truman (violates d) while potentially exonerating scientists/voters (their acts might satisfy DDE).  
     *Cost:* Abandons Anscombe's strict absolutism. She rejected DDE precisely because it could justify too much.

  ### A Workable Solution: Refine Premise (1) + Reject Premise (4)
  1. **Uphold a modified (1):**  
     *"Directly choosing to kill the innocent as a means to one's ends is always murder."*  
     (Adds "directly" to emphasize proximate agency).
     
  2. **Reject (4):** Not all participation is "direct choosing." Culpability requires:
     - **Proximate Causation:** Significant, direct contribution to the act.
     - **Specific Intent:** Purposeful inclusion of the evil in one's plan as a means/end.
     - **Moral Agency:** Freedom to refuse without disproportionate cost.

  3. **Apply to Cases:**  
     - **Truman:** Direct cause, specific intent, full agency → **Murderer.**  
     - **Pilots:** Proximate cause, but constrained agency, lack of specific intent (followed orders) → **Guilty of wrongful killing, but not murder** (or lesser culpability).  
     - **Scientists:** Indirect cause, lack of specific intent (created a tool), possible moral compromise → **Complicit, but not murderers.**  
     - **Voters:** Remote cause, generalized intent, minimal agency → **Not morally equivalent to murderers** (though perhaps responsible for broader war support).

  ### What You Pay
  1. **Loss of Simplicity:** Absolutism is clean; complicity is messy. You must define "directness," "intention," and "agency."
  2. **Risk of Arbitrary Lines:** Why is Truman "direct" but the Secretary of War not? This requires careful criteria.
  3. **Potential Inconsistency:** Critics may argue you're making ad-hoc exceptions to save intuitions.

  ### Conclusion
  **Reject Premise (4).** It fails to distinguish between *ordering murder* and *participating in a system* where murder occurs. This preserves your core condemnation of Truman under (1) while avoiding the absurdity of labeling voters or weapons engineers as murderers. The cost is accepting a **graded theory of responsibility**, where:  
  - **Direct intentional agents** (Truman) bear full guilt for murder.  
  - **Proximate agents** (pilots) bear significant but lesser guilt.  
  - **Indirect contributors** (scientists, voters) may bear *some* moral responsibility, but it is diluted by distance, lack of specific intent, and constrained agency – falling short of "murder."  

  This aligns with intuitive moral judgments: the bomber pilot is not morally identical to the President who ordered the bombing, nor to the factory worker who built the plane. Anscombe's brilliance was in exposing the evil of targeting innocents; her limitation was underestimating the complexity of distributing blame in a modern state. You can keep her insight without accepting her overbroad implications.
