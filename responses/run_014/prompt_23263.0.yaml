answer: |-
  Let's break down the Mary argument carefully, focusing on the core distinction you're asking about and how the Ability Hypothesis (AH) tries to reconcile Mary's learning with physicalism.

  **The Core Distinction: New Fact vs. New Mode of Presentation / Concept**

  1.  **The Anti-Physicalist Claim (New Fact Reading):**
      *   **Premise:** Before release, Mary possesses all *physical* information about color vision and red.
      *   **Premise:** Upon seeing red for the first time, Mary learns *something new*.
      *   **Conclusion:** Therefore, what she learns (what-it's-like-to-see-red) is *not* physical information. Physicalism is false.
      *   **What "New Fact" Means Here:** Mary learns a genuinely new *truth* or *proposition* about the world – a truth concerning the intrinsic, subjective, qualitative character of red experiences ("qualia") – that was not contained within, nor deducible from, the complete physical description she had.

  2.  **The Physicalist Response (New Mode of Presentation / Phenomenal Concept Reading):**
      *   **Agreement:** Mary *does* learn something new upon seeing red.
      *   **Disagreement:** What she learns is *not* a new fact *about the world* or a new property *of red light or neural states*. All the physical facts about red light, its effects on the retina, the resulting neural processing, and even the functional/causal role of the "red experience" state were already known to her.
      *   **The Claim:** What Mary gains is a new *way of thinking about*, *representing*, or *conceptualizing* a physical state of affairs she already knew about *under other descriptions* (e.g., neural descriptions, functional descriptions, physical descriptor concepts like "wavelength ~650nm").
      *   **Phenomenal Concepts:** This new way of thinking is often characterized as acquiring **phenomenal concepts**. These are concepts:
          *   Formed *on the basis of* having the experience itself (e.g., you can't form the concept `RED_PHEN` without having had a red experience).
          *   That are *directly tied to the subjective feel* of the experience.
          *   That are **recognitional**: They allow Mary to recognize red experiences when she has them again.
          *   That are **imaginative**: They allow Mary to visualize or recall the experience.
          *   That are **perspectival**: They represent the experience from the first-person, subjective point of view.
      *   **Key Distinction:** The *fact* known (e.g., "State S (a specific neural state) is occurring") remains the same. What changes is the *concept* used to grasp that fact: before, she knew it under the concept `NEURAL_STATE_S`; after, she can also know it under the new concept `RED_PHEN`. She learns a new *identity*: "`NEURAL_STATE_S` = `THIS` (what it's like now)". "`THIS`" is the new phenomenal concept.

  **The Ability Hypothesis (AH) - A Specific Physicalist Strategy**

  The AH, championed by David Lewis and Laurence Nemirow, is a specific *version* of the "new mode of presentation" strategy. It emphasizes the *practical* nature of what Mary gains.

  1.  **What AH Says Mary Gains:** AH claims that upon seeing red, Mary gains **new abilities**, not new propositional knowledge (facts). Specifically:
      *   **Recognitional Ability:** The ability to recognize red experiences when she has them.
      *   **Imaginative Ability:** The ability to imagine or visualize red experiences.
      *   **Recall Ability:** The ability to recall the experience of red.
      *   **Conceptual Ability:** The ability to deploy the phenomenal concept `RED_PHEN` in thought (though AH often downplays the conceptual aspect in favor of the purely ability-based description).

  2.  **How AH Preserves Physicalism:**
      *   Physicalism is typically defined as the view that **everything that exists is physical, or everything supervenes on the physical** (i.e., no difference without a physical difference).
      *   AH insists that *all the facts about the world* (including the nature of consciousness) are physical facts. Mary knew all these facts *before* release.
      *   What she lacked were certain *skills* or *capacities* related to *accessing*, *manipulating*, or *representing* those facts in a first-person, experiential way. Gaining these abilities doesn't require adding any new facts to the world's inventory. It only requires her brain to undergo the physical changes associated with learning a skill (like learning to ride a bike or recognize a smell).

  3.  **Why AH Insists She Doesn't Learn a Proposition:**
      *   AH proponents argue that the things Mary can now *do* (recognize, imagine) are fundamentally *practical capacities*, not the acquisition of new *truths*. Knowing-*how* is different from knowing-*that*.
      *   **The "What" Question:** When Mary says "Oh! *This* is what it's like to see red!", the AH interpretation is that "This" doesn't refer to a new property revealed to her. Instead, it's an expression of her acquiring the ability to *mentally point* to the experience using the new phenomenal concept/recognitional capacity. She's not learning *what* the property is (she already knew its physical nature), she's learning *how* to mentally index it in this new, subjective way.

  4.  **How AH Handles the Intuition that She "Learns Something":**
      *   AH readily acknowledges that Mary undergoes a significant *epistemic change*. She gains new *cognitive capacities* and *new ways of accessing* information she already possessed abstractly.
      *   This change feels substantial and "new" because:
          *   She gains **first-personal, subjective access** to a brain state she previously only knew about objectively/third-personally.
          *   She acquires **new cognitive tools** (abilities, concepts) that fundamentally alter her relationship to that information.
          *   This access feels direct and revelatory precisely *because* it's tied to the acquisition of these recognitional and imaginative skills.
      *   **The Analogy:** Imagine a brilliant musicologist who knows everything *about* Beethoven's 5th Symphony – the score, the acoustics, the historical context, the neurobiology of hearing – but has never *heard* it. When they finally hear it, they gain new abilities: to recognize the symphony by sound, to hum it, to recall its emotional impact. They don't learn a new *fact* about the symphony itself (its physical structure was already known), but they gain a profound new *mode of access* and *set of capacities* related to it. AH sees Mary's case similarly.

  **What Physicalism is Actually Threatened? The Weakest Version**

  The Mary argument, if successful in the "new fact" reading, threatens the core ontological commitment of physicalism:

  1.  **Strongest Target:** The argument most directly targets the claim that **all facts are physical facts** (or that all properties are physical properties, or that everything supervenes on the physical). If Mary learns a genuinely new, non-physical fact about qualia, then this core claim is false.
  2.  **Epistemic Corollary (The Real Battleground):** The argument is usually framed epistemically: **Complete physical knowledge does *not* entail complete knowledge *simpliciter***. Mary has complete physical knowledge but lacks knowledge of what-it's-like until she has the experience. This epistemic gap is used to infer an ontological gap.
      *   *This is the weakest version the argument threatens:* Even a physicalist who believes all facts *are* physical must explain *why* Mary couldn't deduce the phenomenal fact from the physical facts alone. The "new mode" strategies (Phenomenal Concepts, AH) are attempts to explain this epistemic gap *without* positing an ontological gap.
  3.  **"Knowable from a Dark Room" is a Straw Man:** Critics sometimes accuse physicalists of requiring that *all* knowledge must be deducible a priori from physics in a black-and-white room. This is rarely the position. Physicalism claims all *facts* are physical. *How* we come to *know* those facts is a separate question. Physicalists readily accept that empirical investigation (e.g., leaving the room, doing experiments) is necessary to discover physical facts. The Mary argument specifically targets facts that seem *in principle* unknowable without first-person experience, *even given* complete third-person physical knowledge. The threat is to the **exhaustion thesis** (physical facts exhaust all facts) and the **deducibility thesis** (all facts are deducible in principle from the complete physical truth).

  **Why People Argue Past Each Other:**

  *   **Ambiguity of "Fact":** Does "fact" mean a truth about the world ("Water is H2O") or a piece of knowledge ("Mary now knows what red looks like")? The anti-physicalist often means the former; AH proponents deny she learns a new fact in that sense.
  *   **Ambiguity of "Learn":** Does "learn" mean acquiring propositional knowledge (knowing-that) or gaining abilities/concepts (knowing-how/knowing-what)? AH restricts "learns" to the former.
  *   **Scope of "Physical Knowledge":** Does "all physical knowledge" include *indexical* knowledge ("I am Mary", "It is now noon")? Does it include the *ability* to *use* concepts? AH says no, the latter is non-propositional.
  *   **Strength of Physicalism:** Is physicalism just "everything is physical" (ontological), or must it also include "all facts are knowable a priori from physics" (strong epistemic)? Most physicalists reject the strong epistemic claim; the argument targets the ontological claim *via* an epistemic challenge.
  *   **Phenomenal Concepts vs. Abilities:** Is the gain fundamentally about concepts (which still represent propositions/facts) or purely abilities? This is a subtle but important debate *within* the physicalist camp.

  **In Summary:**

  The "new fact" reading threatens the core ontological claim of physicalism: that all facts are physical facts. Mary seems to learn a non-physical fact about qualia. The "new mode of presentation" strategies (including Phenomenal Concept views and the Ability Hypothesis) defend physicalism by arguing that Mary doesn't learn a *new worldly fact*; she gains new *ways of thinking about* or *abilities related to* facts she already knew. The Ability Hypothesis specifically characterizes this gain as acquiring practical, recognitional, and imaginative abilities, insisting this is not propositional knowledge. It preserves the intuition that Mary learns *something* significant by framing that "something" as a transformative shift in her cognitive capacities and first-person access to physical realities she already understood abstractly. The weakest version of physicalism threatened is the claim that complete physical knowledge entails complete knowledge *simpliciter*, which, if true, would imply that the phenomenal fact Mary learns isn't a physical fact. Physicalists using AH or phenomenal concepts argue that while the *epistemic access* is new, the *fact accessed* is not.
