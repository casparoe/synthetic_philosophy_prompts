  I've just had a long, fairly heated argument with a friend about Bell's theorem, and I'd like a careful, technically precise adjudication to settle the points where I think he is being sloppy. His position, as I understand it, is roughly this: Bell's 1964 theorem is a purely mathematical result, so what it rules out is simply any model that assigns definite pre-existing values to the observables in question; the "locality" in "local hidden variables" is doing no real work in the argument, because Bell himself was famously unenthusiastic about the Copenhagen reading of quantum mechanics and was in sympathy with a realist programme. On that reading, the theorem is a theorem about determinism (or about value definiteness), and a stochastic local hidden-variable theory that merely reproduces the quantum marginal statistics would be perfectly unproblematic, with the experiments only ever testing whether the world is deterministic. I think he is conflating the 1964 result with the experimentally testable CHSH form, and I'd like you to lay out, with the algebraic structure of the CHSH expression in view, exactly which assumptions the bound of 2 on the CHSH parameter actually requires, why the "fair sampling" or detection loophole matters for the experimental version but not for the idealized one, and why the stochastic case is not a way out once you grant the relevant statistical independence (or measurement independence) condition.

  The second part of my disagreement concerns a claim he made in passing, which I find even harder to evaluate. He said that quantum mechanics itself violates the CHSH bound by 2√2, which is the Tsirelson bound, and that this shows nature is "maximally nonlocal" in the sense that quantum correlations saturate the strongest nonlocality compatible with no-signalling. I want to know whether that claim is right or wrong, and if wrong, what the correct hierarchical picture is: how do the local bound (2), the Tsirelson bound (2√2), and the algebraic maximum (4) of the CHSH expression fit together; what the hypothetical correlation device that attains 4 — the PR box, in the terminology Popescu and Rohrlich later popularised — would have to look like operationally, and what it would permit (or not permit) with respect to communication at a distance; and finally, whether the gap between the Tsirelson bound and the algebraic maximum is best understood as a further constraint that any fundamental theory must satisfy, as evidence that quantum mechanics is not the full story, or as something whose significance is still genuinely unsettled. Please answer in a structured way, point by point, so I can show my friend exactly where the argument breaks down, and do not hedge by saying both sides have something to say unless you can say precisely what each side owes the other.
