answer: |-
  Below is a structured, technically precise adjudication of your disagreements. I address each point systematically, quoting key assumptions, deriving bounds, and clarifying misconceptions. All claims are grounded in the algebraic structure of the CHSH inequality and established results in quantum foundations.

  ---

  ### **Part 1: Bell's Theorem, Locality, and Stochastic Hidden Variables**
  **Your friend's claim:**  
  Bell's theorem only rules out deterministic models with pre-existing values; locality is incidental. Stochastic local hidden variables (SLHV) reproducing quantum marginals are viable, and experiments only test determinism.

  **Why this is incorrect:**

  1. **Bell's 1964 Theorem vs. CHSH: Core Assumptions**  
     - Bell's original (1964) paper assumed **deterministic** hidden variables (HV) for simplicity, but his *locality condition* is central.  
     - The modern CHSH inequality (Clauser-Horne-Shimony-Holt, 1969) generalizes Bell's result explicitly to include **stochastic** models.  
     - **Locality is formalized as *factorizability*:** For settings \(a, b\) and outcomes \(A, B\), a local HV model requires:  
       \[
       P(A,B \mid a,b,\lambda) = P(A \mid a,\lambda) \cdot P(B \mid b,\lambda)
       \]  
       where \(\lambda\) is the hidden variable. This ensures no influence between distant measurements (locality).  
     - **Value definiteness** (pre-existing outcomes) is *not* required. Stochastic models assign probabilities, not definite values.

  2. **The CHSH Bound of 2 Requires Locality, Not Determinism**  
     - The CHSH correlator is defined for two parties (Alice, Bob), each choosing two settings (\(a,a'\) for Alice; \(b,b'\) for Bob):  
       \[
       S = \langle A_b B_b \rangle + \langle A_b B_{b'} \rangle + \langle A_{b'} B_b \rangle - \langle A_{b'} B_{b'} \rangle
       \]  
       - In **any local model** (deterministic or stochastic) satisfying factorizability and measurement independence (\(P(\lambda \mid a,b) = P(\lambda)\)),  
         \[
         |S| \leq 2.
         \]  
       - **Derivation sketch:**  
         Express \(S\) in terms of \(\lambda\)-dependent expectations. By factorizability, \(\langle A_x B_y \rangle_\lambda = \langle A_x \rangle_\lambda \langle B_y \rangle_\lambda\). Since \(|\langle A_x \rangle_\lambda| \leq 1\), \(S\) is bounded by a linear function of \(\lambda\) with maximum 2.  
       - *Conclusion:* The bound |S| ≤ 2 holds for **all local models**, stochastic or deterministic. Quantum mechanics violates this (|S| = 2√2 > 2), ruling out *all* local hidden variables.

  3. **Stochastic Models Offer No Escape**  
     - If your friend proposes a SLHV model reproducing quantum statistics, it **must violate factorizability** (locality).  
     - Example: A model with \(P(A,B \mid a,b,\lambda) \neq P(A \mid a,\lambda)P(B \mid b,\lambda)\) could violate CHSH, but such non-factorizability implies nonlocality.  
     - **Measurement independence** (no correlation between \(\lambda\) and settings) is critical. If violated (e.g., superdeterminism), locality can be preserved, but this is widely considered unphysical.

  4. **Detection Loophole: Experimental vs. Idealized Tests**  
     - **Idealized CHSH:** Assumes 100% detection efficiency. Violations of |S| ≤ 2 rule out *all* local HV models.  
     - **Experimental CHSH:** Low detection efficiency allows fake violations. If many undetected events are discarded, a local model can simulate nonlocality.  
     - *Key point:* This loophole is **irrelevant to the theorem** (which assumes fair sampling), but matters for experiments. Closing it (e.g., with efficiency > 90%) confirms quantum nonlocality.

  ---

  ### **Part 2: Tsirelson Bound, PR Boxes, and "Maximal Nonlocality"**
  **Your friend's claim:**  
  QM violates CHSH by 2√2, showing nature is "maximally nonlocal" since 2√2 saturates the no-signalling bound.

  **Why this is incomplete/misleading:**

  1. **Hierarchy of CHSH Bounds**  
     - **Local HV bound:** \( |S| \leq 2 \)  
     - **Quantum bound (Tsirelson):** \( |S| \leq 2\sqrt{2} \approx 2.828 \)  
     - **No-signalling bound:** \( |S| \leq 4 \)  
     - **Algebraic maximum:** \( |S| = 4 \) (achievable if outcomes ignore settings).

  2. **Quantum Mechanics is Not "Maximally Nonlocal"**  
     - The Tsirelson bound (2√2) is **strictly below** the no-signalling maximum (4).  
     - **Popescu-Rohrlich (PR) boxes** achieve S = 4 while respecting no-signalling:  
       - Define: \( A, B \in \{0,1\} \), settings \( a,b \in \{0,1\} \).  
       - PR correlation: \( A \oplus B = a \cdot b \) (XOR outcome = AND of settings).  
       - Verify: \( S = 4 \) (e.g., all correlators +1 except last term -1).  
     - PR boxes **do not permit signalling**: Marginal probabilities (e.g., \(P(A \mid a)\)) are independent of distant settings.  

  3. **Operational Power and Limits of PR Boxes**  
     - **Communication:** PR boxes **cannot send signals** (by construction).  
     - **Computational power:** They solve certain information problems with one use (e.g., distributed NP-complete problems), unlike QM.  
     - **Physical plausibility:** PR boxes violate Tsirelson's bound and are **not achievable in QM**.  

  4. **Interpretation of the Gap (2√2 < 4)**  
     - **Not evidence that QM is incomplete:** QM saturates Tsirelson’s bound, which is derived from quantum formalism (e.g., via operator commutativity).  
     - **A fundamental constraint:** The gap reflects **information-theoretic limits** intrinsic to quantum theory. For example:  
       - PR boxes allow "nonlocal computation" of \(a \cdot b\), violating information causality.  
       - QM respects relativistic causality (no signalling) and **unitarity**, which PR boxes ignore.  
     - **Consensus:** The Tsirelson bound is a **property of quantum mechanics**, not an indication of incompleteness. Modifying QM to achieve S > 2√2 would violate no-signalling or linear algebra (e.g., Cirel'son’s proof).

  ---

  ### **Summary: Where Your Friend's Argument Breaks Down**
  1. **On Bell/CHSH:**  
     - **Error:** Locality (factorizability) is necessary for the CHSH bound |S| ≤ 2.  
     - **Resolution:** Stochastic local HV models are ruled out by CHSH violations. Experiments test locality, not determinism.  
  2. **On Tsirelson/Nonlocality:**  
     - **Error:** QM is not "maximally nonlocal"; PR boxes achieve S = 4 > 2√2 without signalling.  
     - **Resolution:** The gap 2√2 < 4 reflects quantum mechanics' specific structure. It is not evidence of incompleteness.  

  **Key References:**  
  - Bell (1964): Locality, not determinism, is the active assumption.  
  - CHSH (1969): Explicitly includes stochastic models; bound |S| ≤ 2 requires factorizability.  
  - Tsirelson (1980): 2√2 is the maximum quantum violation.  
  - Popescu-Rohrlich (1994): PR boxes achieve S = 4 with no signalling.  

  This settles the technical points definitively. If your friend disputes algebraic derivations (e.g., CHSH ≤ 2) or conflates no-signalling with quantum bounds, they misunderstand the mathematical structure of Bell nonlocality.
