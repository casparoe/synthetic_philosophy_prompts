  I've been going in circles on Skolem's paradox for about two weeks now and I cant shake the feeling that I'm missing something, so I want you to build me a concrete toy version of it instead of another explanation. The version I keep reading is: if set theory is consistent, then there's a model of it that is completely countable from the outside, but from the inside it still has an "uncountable" set of reals, and both perspectives are supposedly right, and its not obvious to me which one is pulling a fast one. I want to use this to explain the paradox to a friend who is convinced the whole thing is a word game, so the toy has to make it feel like a genuine disagreement, not a pun.

  So: construct a toy universe -- a small collection of objects plus a rule for which objects in the universe count as "listings" of which other objects -- such that (a) from the outside, the whole universe can be listed, and if you can make it finite so that it fits on one hand, do that; (b) from the inside, using only the objects and the listings that actually exist in the universe, the designated "big set" (the whole universe or a chunk of it, your call) cannot be listed; and (c) the universe is not just broken -- every set smaller than the big one can be listed from the inside, so the failure to list the big set has to fall out of what is actually in the universe, not be stipulated as a belief the universe holds. If finiteness turns out to be impossible, do the smallest infinite version you can and tell me exactly why the finite one fails.

  After the toy, walk through both perspectives the way you would show the friend: what the inside-seer can and cannot do, what the outside-seer sees, and why neither of them is wrong. Then tell me which single feature of the toy is doing all the work, what happens if I remove it, and what the word-game person would object to about the toy -- and whether that objection actually survives. And one last thing: at the end, say how confident you are in the math you're asserting and single out the point you're least sure of. I'd much rather you say "I'm not sure this finite version actually works" than hand-wave the set theory part.
