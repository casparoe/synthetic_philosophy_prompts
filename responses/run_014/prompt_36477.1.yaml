prompt: |-
  I teach a graduate seminar in philosophy of mind, and last week I opened with an old toy world of Dennett's, the careenium. As I present it, it is a walled, frictionless table on which simmballs — hard little spheres — careen about, obeying nothing but Newtonian collision mechanics. There is nothing else in the world. Yet at a coarser grain of description the whole system is playing chess: the opponent's moves arrive as balls injected through chutes in the walls, the system's replies are the balls that exit through other chutes, and the pattern of exits conforms perfectly to legal, strong chess play. A theorist who tracked only collisions could in principle predict the exits, but only at astronomical computational cost; a theorist working at the chess level predicts them nearly perfectly and cheaply, from the board position alone. Afterward, over coffee, two visitors to the seminar fell into a dispute about whether the symbols push the substrate around, and I must admit I could not settle it for myself.

  The exchange ran as follows. (1) Vera, a computer scientist, contended that the chess level is causally real: to explain why the next ball left through the d-file chute you cite the position — the zugzwang, the pinned knight — because that description is what supports prediction and control, and whatever earns its keep in our best causal models is a cause; so the game state does push the simmballs around. (2) Tomas, a visiting metaphysician, answered that every exit is already fixed, completely, by the prior positions and momenta of the simmballs; the chess state either is that configuration, in which case it adds nothing, or is something over and above it, in which case it does nothing — the symbols never touch a bumper. (3) Vera protested that she never posited a chess force: the position simply is the configuration of simmballs under a coarse-graining, and causation is always grain-relative; the temperature of a gas is nothing over and above molecular kinetic energy, yet it is the temperature, not any single molecule's momentum, that pops the lid. (4) Tomas replied that temperature earns its causal status because we can intervene on it directly — but every route to a different position runs through the simmballs, and there is no chess knob; the counterfactuals hold only because altered positions just are altered ball-configurations, so the work is all done at the substrate. (5) Vera, escalating: if Tomas is right, then genes, beliefs, and depressions push nothing, and only fundamental physics ever does any work — which she took to be a reductio, since explanation in terms of higher-level states is not mere heuristic bookkeeping. (6) Tomas, unruffled: perhaps explanation is indeed grain-relative, but explanation is one thing and pushing another; Vera has shown that the chess level explains, never that it moves anything; the phrase "push the substrate around" smuggles in production, and only bumpers produce.

  Please adjudicate the exchange move by move, and then take a definite stand on the underlying question — in the careenium, do the symbols push the substrate around? — rather than laying out the options and leaving the choice to me. Say where each of the six moves goes right and where it goes wrong, note anything both parties are missing, and keep the whole thing under 600 words.
reasoning: |-
  Okay, let me tackle this step by step. The user presents a philosophical debate between Vera and Tomas about whether symbols (like chess positions) can have causal power in Dennett's careenium thought experiment. The careenium is a system where simmballs moving on a frictionless table produce chess moves at a higher level of description. 

  First, I need to analyze each of the six moves in their exchange. Vera argues for causal efficacy of higher-level states (chess positions), using pragmatic criteria from computer science. Tomas insists on strict physical causation, denying any real "pushing" by abstract states. 

  I notice both miss a key point: Dennett's original framework of "real patterns." The chess level isn't just explanatory—it carves reality at joints inaccessible to microphysical description. Tomas is wrong to demand direct intervention; many scientific entities (like temperature) are causally real despite multiple realizability. Vera is right about explanatory indispensability implying causation, but should clarify that "pushing" here means constraining possibilities, not adding energy.

  The core issue is ontological: can patterns be causal? I think yes—the chess state's supervenience on simmballs doesn't make it epiphenomenal; it reorganizes causal structure. When we say "the position caused the exit," we mean the physical configuration interpreted as chess has counterfactual power no fundamental description captures efficiently.

  For the verdict: in the careenium, symbols do push the substrate—not by contact, but by making certain microstates impossible. The pinned knight isn't a force, but it rigidly excludes all non-escape trajectories. That exclusion is causal.
answer: |-
  ### Adjudicating the Exchange
  **Move (1) Vera (Causal Realism):**  
  *Right:* Vera correctly identifies that causal relevance arises from predictive/explanatory indispensability (cf. Dennett’s "real patterns"). The chess state *does* earn its keep in causal models by enabling efficient prediction/control.  
  *Wrong:* She risks conflating *causal relevance* (explanatory role) with *causal production* (physical force). The chess state supervenes on microphysics but doesn’t *add* force beyond simmball collisions.  

  **Move (2) Tomas (Microphysical Reductionism):**  
  *Right:* All macro-events are indeed fixed by microphysical states. There’s no "extra" chess force.  
  *Wrong:* He assumes causation must be *only* microphysical (the "nothing over and above" fallacy). Denying higher-level causality because it supervenes ignores how supervenient properties can be causal *relata*.  

  **Move (3) Vera (Grain-Relativity):**  
  *Right:* Causation *is* grain-relative (e.g., temperature explains pressure changes while being multiply realizable). The chess state is a coarse-grained *pattern* with predictive power irreducible to particle tracking.  
  *Wrong:* She doesn’t address whether this pattern *produces* change or merely *describes* it.  

  **Move (4) Tomas (Intervention & Supervenience):**  
  *Right:* You cannot intervene *directly* on the chess state without altering simmballs. Counterfactuals hold due to microphysical dependency.  
  *Wrong:* He conflates *intervention methods* with *causal structure*. Temperature can be a cause despite needing molecular interventions (e.g., heating water *is* intervening on temperature).  

  **Move (5) Vera (Reductio):**  
  *Right:* Tomas’s view implies eliminativism about all special-science causes (genes, beliefs). This *is* a reductio: if higher-level states are explanatorily indispensable, they’re causal.  
  *Wrong:* She doesn’t clarify *how* symbols "push" without physical contact.  

  **Move (6) Tomas (Explanation vs. Production):**  
  *Right:* Explanation and production *can* come apart. The chess state explains exits but doesn’t mechanically "produce" them like bumpers.  
  *Wrong:* He ignores that "production" in complex systems often involves *constraints*: the chess state *structures* possible micro-events (e.g., a "pinned knight" configuration excludes certain ball trajectories).  

  ### What Both Miss
  - **Pattern Causation:** The chess state is a *dynamical constraint* (Dennett’s "real pattern"). It doesn’t add energy but *shapes* the causal pathways of simmballs by making certain microstates impossible (e.g., moves violating chess rules).  
  - **Causal Exclusion Dilemma:** Tomas assumes causal exclusion (only physics "does work"), but supervenient properties can be difference-makers (cf. Woodward’s interventionism). Vera needs to show *how* patterns are non-redundant causes.  

  ### The Verdict
  **In the careenium, the symbols *do* push the substrate around—but not by physical force.**  
  - **Why:** The chess state is a *causal structure* that constrains simmball dynamics. Just as a software state (e.g., "variable X=5") causes a computer’s electrons to move, the chess position *necessitates* specific exit patterns by ruling out non-chess trajectories. It "pushes" by defining the space of possible collisions, making certain outcomes inevitable *in virtue of* the symbolic state.  
  - **Yes, but:** This "pushing" is metaphysically grounded in microphysics but *autonomous* in explanation. Denying it collapses all causal power to fundamental particles—a view incompatible with successful science.  

  **Conclusion:** Vera wins on causal relevance; Tomas on production mechanics. Symbols push *via* constraint-based causation, not contact forces. The chess state is a real cause because altering it (via simmball changes) *changes outcomes* systematically—a truth no microdescription captures efficiently.
