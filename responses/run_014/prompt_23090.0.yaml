  We are going to write a dialogue between a Causal Decision Theorist (CDT) and a Timeless Decision Theorist (TDT) who are riding with the driver. The driver must decide on a policy that will be applied at both intersections (since he cannot distinguish them and has no memory). The payoffs are:
