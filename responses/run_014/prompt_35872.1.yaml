      "deposit": "Shifts from a concrete financial transaction -> proof of action -> a fragile memory trace -> a symbol of insufficient evidence under pressure -> the lottery-ticket nature of inductive belief.",
      "teller": "Shifts from a specific bank employee -> a source of information -> an abstract authority figure -> an unreliable echo in memory -> a symbol of external verification itself.",
      "balance": "Shifts from a financial state -> a state of mental comfort/trust -> the precarious equilibrium of justification -> the cosmic scales of luck/chance -> the core concept of epistemic equilibrium under pragmatic weight.",
      "stakes": "Shifts from minor inconvenience -> abstract concept introduced -> sudden, crushing financial consequence -> the defining factor altering epistemic assessment -> the fundamental weight bending the frame of 'knowing'.",
      "town": "Shifts from a geographical location -> the setting for a minor errand -> the community context -> a place exerting social/financial pressure -> a metaphorical space of heightened anxiety and consequence."
    },
    "the_turn": "Line 19 (First line of Stanza 4): 'Suppose the paycheck bounced? This anxious town'. This introduces the high-stakes scenario explicitly, shifting the focus from abstract stakes to concrete, dire financial consequence, irrevocably altering the protagonist's epistemic assessment.",
    "hidden_resolution": "Interest-relative invariantist. Evidence: The envoi's final lines ('But *knowing* fades where consequence is weighed') positions consequence (*stakes*) as an external weight affecting the *state* of knowing, not the *meaning* of 'know'. The same word 'know' is used throughout its appearances, but its application fails under weight. The lottery line (Stanza 4, Line 22: 'A cosmic lottery mocked his *balance*') directly compares high-stakes 'knowing' (bank) to uncontroversial 'not knowing' (lottery) using the *same* verb, implicitly treating 'know' as invariant in meaning but harder to achieve."
  }
  ```

  **Design Notes:**

  1.  **End-Word Choice:** `Saturday, deposit, teller, balance, stakes, town` were chosen for maximum semantic flexibility crucial to contextualism/invariantism. Each can be concrete or abstract, literal or metaphorical, and relate directly to the bank case elements (time, action, agent, state, risk, location).
  2.  **Meaning Shifts:** As per the JSON, each word undergoes significant transformation across the stanzas. `Know` (used internally, not an end-word) also shifts in its *felt* certainty without changing its *stated* form, crucial for the invariantist reading. `Stakes` evolves from near-absence to overwhelming presence.
  3.  **The Turn:** The high stakes are explicitly introduced at the start of Stanza 4 (Line 19). This is the pivotal moment where the *consequences* redefine the epistemic landscape.
  4.  **Hidden Resolution (Invariantist):** The poem uses "know" consistently. The shifts are in the *application* and *certainty level*, driven by the rising `stakes`. The envoi frames `knowing` as something that *fades* under weight ("fades where consequence is weighed"), implying the threshold for attaining the state of knowledge rises, not that "know" means something different. The lottery line compares two different propositions using the same verb "knew", treating its semantic core as stable.
  5.  **Lottery Integration:** The lottery reference ("A cosmic lottery mocked his balance") arises naturally from the cognitive dissonance under high stakes, contrasting the protagonist's feeling about the bank (same evidence) with the uncontroversial claim about losing a lottery.
  6.  **Poem First:** Sensory details (ledger ink, walls pressing, cold floors implied by anxiety) ground the abstract dilemma. The narrative arc (calm -> anxiety -> existential doubt) drives the poem independently of the philosophy.
  7.  **Envoi Function:** It forces the high-stakes and low-stakes worlds ("low-trust balance" vs. "high-cost conviction") into direct, unresolved contact ("Can... ever understand?"). The final line explicitly weighs consequence against the act of knowing, favoring the invariantist reading through implication without explicit philosophical jargon. All six end-words are integrated (`stakes`, `balance`, `knowing`, `teller`, `Saturday`, `deposit`).
