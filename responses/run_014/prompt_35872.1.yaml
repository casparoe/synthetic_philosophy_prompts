answer: |-
  Here is the sestina, crafted to embody the epistemic tension while functioning as a standalone poem. The resolution subtly favors **interest-relative invariantism**, evident only in the envoi's structure and implication.

  ---

  **Sestina for the Saturday Teller**

  He *knew* the bank was open Saturday.
  The ledger showed his Friday *deposit* clear.
  The *teller*, bored, confirmed the posted hours.
  No need to doubt. The *balance* wasn't tight;
  He'd cash the check next week. The minor *stakes*
  Were just a second trip across the town.

  No urgency to drive him back to town.
  He *knew* the bank was open Saturday.
  Why double-check? Forget the phantom *stakes*.
  The proof was fixed: his Friday *deposit*,
  The ledger's word. A comfortable *balance*
  Of trust resided in that calm *teller*.

  But what if proof required that *teller*?
  Suppose the paycheck bounced? This anxious town
  Demanded certainty. The mental *balance*
  Tipped. He *knew* the bank was open Saturday?
  He *knew* it like his Friday *deposit*?
  Now everything rode on these sudden *stakes*.

  The memory dimmed. The very *stakes*
  Distorted what he heard the *teller* say.
  The Friday proof, the solid *deposit* –
  Could ink alone secure this frantic town?
  He *knew* the bank was open Saturday?
  He needed bedrock, not this shifting *balance*.

  A cosmic lottery mocked his *balance*.
  Could certainty withstand such crushing *stakes*?
  He *knew* he’d lose, yet *knew* his Saturday?
  The same frail brain that trusted the *teller*
  Now felt the walls of reason press the town.
  The evidence? A memory. A *deposit*.

  The Friday act, the ritual *deposit*,
  Seemed flimsy now against this weight, this *balance*
  Of consequence that filled the worried town.
  Not just a trip – the crushing, real-world *stakes*
  Transformed the echo of the *teller*'s voice.
  What constituted *knowing* Saturday?

  **Envoi:**
  The *stakes* define the ground on which we stand.
  Can low-trust *balance* ever understand
  High-cost conviction? *Knowing* seems to shift.
  The *teller* speaks, but *Saturday* may drift.
  The evidence remains – the *deposit* made –
  But *knowing* fades where consequence is weighed.

  ---

