  For a small example, let n=3 and p=0.55 for each voter. The majority will be correct if at least two are correct.

  The probability of exactly two correct: C(3,2) * (0.55)^2 * (0.45) = 3 * (0.55)^2 * 0.45
  The probability of exactly three correct: (0.55)^3

  So total P(correct majority) = 3*(0.55)^2*0.45 + (0.55)^3
  Calculate:
  (0.55)^2 = 0.3025
  3 * 0.3025 * 0.45 = 3 * 0.136125 = 0.408375
  (0.55)^3 = 0.166375
  Total = 0.408375 + 0.166375 = 0.57475

  So about 57.5% for the majority, which is higher than the individual 55%. This is the Condorcet effect: aggregating independent opinions above 50% leads to a better group performance.

  Now, what if n=5? We would compute the probability of at least 3 correct. The calculation becomes:
  P(3) = C(5,3)*(0.55)^3*(0.45)^2
