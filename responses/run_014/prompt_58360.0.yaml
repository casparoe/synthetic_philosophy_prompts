answer: |-
  Your diagnosis is perceptive: the core impasse stems from conflating distinct questions—one semantic (about ordinary language ascriptions of "knows how") and one psychological (about the cognitive architecture of skilled performance. The dispute persists because each side prioritizes one question while downplaying the other, leading to systematic reinterpretation of counterevidence. Below, I assess your hypothesis, diagnose the disagreement, and outline paths for progress using your cases.

  ### Case Analysis: How Each Side Responds
  1.  **Mara (Paralyzed Coach):**
      *   **Intellectualist:** Claims Mara *knows how* because she possesses accurate, actionable propositional knowledge (e.g., "initiate rotation 0.5s before wall contact"). Her paralysis is irrelevant; knowledge is defined by propositional grasp under a practical mode of presentation. Her coaching success *is* the manifestation of this knowledge.
      *   **Ability Theorist:** Claims Mara *lacks* know-how. Her understanding is purely theoretical ("knowing that *about* how"). True know-how requires embodied ability to *execute* the action, which she lacks. Her coaching expertise is derivative, parasitic on others' genuine know-how.
      *   **Diagnostic Insight:** Intellectualists prioritize the *semantic* intuition: we *say* Mara "knows how to do the turn" based on her diagnostic/instructional capacities. Ability theorists prioritize the *performance* intuition: skill requires physical capacity. The clash is over which intuition defines "know-how."

  2.  **Arm-7 (Embodied Robot):**
      *   **Intellectualist:** Claims Arm-7 *lacks* know-how. Its competence stems from non-representational statistical associations or sensorimotor couplings, not propositional knowledge. Its failure on probes shows absence of *any* mode of presentation of a way of acting. It merely *behaves reliably*.
      *   **Ability Theorist:** Claims Arm-7 *has* know-how. It possesses a reliable, embodied competence acquired through practice. Its failure on verbal/diagrammatic tasks is irrelevant; know-how is non-propositional ability. Its competence *is* the know-how.
      *   **Diagnostic Insight:** Intellectualists demand *some* (potentially non-linguistic) propositional structure accessible to cognition. Ability theorists see competence as fundamental, independent of representation. The clash is over whether cognition requires *propositional content* at all for skill.

  3.  **Theo & His Teacher (Articulation vs. Execution):**
      *   **Theo:** Both sides agree he *lacks* genuine vibrato know-how. Intellectualists: His propositional knowledge lacks the right *practical mode* to guide action effectively. Ability Theorists: He lacks the embodied competence/reliable ability.
      *   **Teacher:** **Crucial Test Case.**
          *   **Intellectualist:** Faces a major problem. Her false principles ("I flex my wrist upwards mainly") contradict her accurate performance. If know-how *is* propositional knowledge, she should know the true propositions. Intellectualists might claim she possesses *implicit* accurate propositions inaccessible to verbal report, or that her false report misdescribes her actual (correct) practical mode of presentation. This strains the view.
          *   **Ability Theorist:** Triumphs here. The teacher possesses the reliable ability/embodied competence. Her false verbal reports are irrelevant noise; they don't undermine her know-how, which is constituted by her performance capacity.
      *   **Diagnostic Insight:** The teacher case highlights the *dissociability* central to the dispute. Ability theorists see it as proof that know-how is non-propositional competence. Intellectualists must explain away the dissociation, often by positing inaccessible "implicit" propositions or reinterpreting the practical mode.

  ### Diagnosis of the Disagreement Structure
  Your hypothesis is largely correct, but the disagreement is **multi-layered**:

  1.  **Fundamentally Different Questions:**
      *   **Intellectualists:** Answer a *semantic/conceptual* question: *When does the phrase "S knows how to φ" accurately describe S?* Their core data are linguistic intuitions about ascriptions (e.g., "Does Mara *know how*?").
      *   **Ability Theorists:** Answer a *psychological/metaphysical* question: *What cognitive/embodied state constitutes the capacity for skilled performance φ?* Their core data are dissociations (paralysis, amnesia, Theo/Teacher) showing ability can exist without propositional access/vice versa.

  2.  **Conflated Vocabulary:** Both sides use "know-how," but intellectualists mean *satisfying the truth-conditions for the phrase*, while ability theorists mean *possessing the competence underlying performance*. This creates talking past each other.

  3.  **Clash of Central Data & Evidence:**
      *   Intellectualists treat linguistic ascriptions (Mara, coaching contexts) as primary evidence for their *philosophical* claim about knowledge. Dissociations (Theo's Teacher, Arm-7) are anomalies to be explained away.
      *   Ability theorists treat dissociations and pure competences (Theo's Teacher, Arm-7) as primary evidence for their *psychological* claim. Linguistic ascriptions to paralyzed experts are seen as loose talk or derivative.

  4.  **Principled Impasse on Intuitions:** The dispute is **not purely verbal**; there's a genuine factual disagreement about cognition underneath. However, it's **intractable** because:
      *   **Starting Intuitions Diverge:** Is Mara's expertise *real* know-how or merely *about* know-how? Is Arm-7's competence *cognitive* or merely *mechanical*? There's no neutral ground.
      *   **"Evidence" is Ambiguous:** Cases like Mara and Arm-7 *simultaneously* support one side semantically and the other psychologically. Each side dismisses the evidence supporting the other's core concern.

  ### Paths to Progress: Conceptual Disambiguation
  The impasse is principled but *not* permanent if the conflation is explicitly dismantled. Progress requires:

  1.  **Explicit Conceptual Distinction:**
      *   **Semantic Know-How (S-Know-How):** The property ascribed by true utterances of "S knows how to φ." Defined by linguistic/conceptual analysis. *Data:* Ordinary language judgments (e.g., "Mara knows how" = True).
      *   **Cognitive Competence (C-Competence):** The integrated set of cognitive, perceptual, motor, and representational capacities enabling reliable, fluent performance of φ. *Data:* Psychology, neuroscience, AI, dissociations (Theo's Teacher, Arm-7).

  2.  **Reformulated Questions:**
      *   What are the truth-conditions for S-Know-How ascriptions? (Semantic Project)
      *   What is the cognitive architecture of C-Competence? (Psychological Project)
      *   *Crucially:* How do S-Know-How and C-Competence *relate* empirically? (e.g., Does S-Know-How typically require or cause C-Competence? Are there necessary/sufficient conditions?)

  3.  **Empirical/Formal Work Leveraging the Distinction:**
      *   **Linguistics/Cognitive Science:** Map the precise conditions under which "knows how" is ascribed (e.g., coaching expertise vs. physical ability) and correlate them with measures of C-Competence.
      *   **AI/Robotics:** Design agents like Arm-7 and rigorously test what types of representations (if any) are necessary for robust C-Competence and whether/how such agents could ever warrant S-Know-How ascriptions.
      *   **Neuroscience:** Investigate the neural correlates of S-Know-How judgments (e.g., when observing experts like Mara) vs. C-Competence execution (e.g., Theo's Teacher playing).
      *   **Philosophy:** Develop theories of the *relation* between the concepts. *Example:* Perhaps S-Know-How requires *some* (not necessarily accurate) propositional understanding *about* φ *plus* a reliable connection to successful performance (which could be via coaching others, as with Mara), while C-Competence requires integrated sensorimotor control systems that may operate largely independently of propositional access (Theo's Teacher, Arm-7).

  ### Conclusion: Beyond Impasse
  The impasse is principled but temporary *if* the field acknowledges the conflation. Your cases brilliantly expose this:

  *   Mara has **S-Know-How** but lacks **C-Competence**.
  *   Arm-7 has **C-Competence** but lacks **S-Know-How**.
  *   Theo's Teacher has **C-Competence** despite inaccurate reportable propositions, challenging the *necessity* of accurate propositions for competence, while Theo has accurate propositions but lacks competence.

  Progress lies not in declaring one side "right," but in rigorously separating the semantic project (S-Know-How) from the psychological project (C-Competence) and then systematically investigating their complex empirical relationships. Your chapter can drive this by using your cases to force the distinction and framing the future debate around the *interaction* of language and cognition in skill, rather than a zero-sum fight over the single "true" meaning of "knows how."
