        option3: (1,0)->(2,0): cost -1, then (2,0) has -10 (because in R2 (2,0) is penalized), then (2,0)->(2,1)->(2,2): two more steps.
          = 0 [ (1,0) ] -1 [ to (2,0) ] + (-10) [ at (2,0) ] -1 [ to (2,1) ] +0 -1 [ to (2,2) ] +10 = 0 -1 -10 -1 -1 +10 = -3.

   So the best for R2 is option2 with 7.

   Therefore, in the new start state (1,0), the agent with R1 will choose either option2 or option3 (both yield -3), while the agent with R2 will choose option2 (yield 7). 
     -> They might choose different actions: R1 might go to (2,0) or (1,1), while R2 will definitely go to (1,1).

   But note, in option2 for R1, going to (1,1) is also available. However, without knowing the reward function, from the action choice we see that if the agent chooses to go to (1,1) that could be either, but if it chooses to go to (2,0) then it must be R1.

   So the behavior is different.

   Therefore, we have:

     R1 and R2 both explain the training data (because the training data does not go through (1,0) or (2,0), and the observed path is optimal for both in the training context).

     In the new state (1,0), the two reward functions lead to different behavior.

   Hence, the observed data alone does not allow us to distinguish R1 from R2.

   This is the non-identifiability issue in IRL.

   What does this example show about reading off preferences?

     It shows that the observed behavior (even if we assume optimality) is not sufficient to uniquely determine the reward function. There are many reward functions (infinitely many) that can explain the same behavior in the observed states, but that differ in unobserved states. Therefore, we cannot simply "read off" the preferences from actions.

   How does IRL literature try to break the tie?

    1. By making additional assumptions about the reward function, such as that it is sparse or has low complexity (e.g., via regularization). In our example, if we assume that the reward is zero at states unless we have evidence otherwise, then both R1 and R2 have two non-zero rewards. But then we cannot distinguish.

    2. By assuming a prior over reward functions.

    3. By observing behavior in a sufficiently rich set of states that cover the state space. But in practice, we never cover the entire state space.

    4. By active learning: asking for demonstrations in specific states or asking for preferences between trajectories.

   The assumptions baked in are:

     - The reward function has a particular structure (e.g., linear in features, or sparse).
     - The demonstrator is optimal or near-optimal.
     - The prior over reward functions is well-chosen.

   Without these, the problem is underdetermined.

   Let's see how regularization would work in our example. If we regularize for sparsity, then both R1 and R2 have two non-zero rewards, so equally sparse. If we prefer reward functions with fewer negative rewards, then R1 has one negative and one positive, R2 has one negative and one positive, so still tied. If we use a Gaussian prior that rewards are zero mean and small variance, then maybe the reward function with the smallest magnitude of non-zero rewards is preferred? But in our example, the non-zero rewards are the same magnitude.

   So without additional data, the tie might not be broken.

   This is a fundamental limitation.
