answer: |-
  Here is a sustained defense addressing the core objection, structured to meet your specifications:

  ### Defense Against the Rigidification Surrogate Objection

  **Core Claim:** Rigidification does not replace the meaning of "water" with an artificial surrogate but formally explicates an inherent semantic feature of natural kind terms—namely, their indexical anchoring to the actual world. The two-dimensional framework reveals this structure without begging the question about necessity.

  ---

  **1. Shared Primary Intension and Preservation of A Posteriority**  
  The primary intension of "water" (as used by us) is a function from centered worlds to extensions: at any center *c*, it picks out the dominant clear, drinkable liquid filling oceans and lakes in *c*'s environment. Crucially, **the rigidified term "dthat(the watery stuff)" shares *exactly the same primary intension***. Both expressions yield the same extension in every centered world when evaluated according to *c*'s local context.  

  This shared primary intension explains why "water is H₂O" is a posteriori:  
  - Its primary intension is **contingent** because there are centered worlds (e.g., Twin Earth) where the primary intension picks out XYZ, not H₂O.  
  - Its secondary intension is **necessary** because once the actual center is fixed (indexically, by our utterance), "water" rigidly designates H₂O across all worlds.  

  The epistemic status derives from the primary dimension: we must empirically investigate *which* substance satisfies the primary intension *at our center*. Rigidification formalizes—without altering—this indexical link to actuality already implicit in "water." Thus, the a posteriori character is preserved within the framework.

  ---

  **2. Rigidification as Semantic Explication, Not Stipulation**  
  The objection presupposes rigidification is an external operation foisted onto language. This misconstrues the framework’s purpose.  

  - **Natural Rigidity**: Kripke showed "water" is *de facto* rigid: it designates H₂O in all counterfactual worlds. Two-dimensional semantics doesn’t *stipulate* rigidity but *models* it formally via secondary intensions.  
  - **Indexicality as Implicit in Usage**: When we assert "water is H₂O," we intend "water" to refer to *our actual* water. Rigidification (via "actual" or Kaplan’s *dthat*) makes this indexical component explicit. This is no more stipulative than modeling "I" with a centered-worlds parameter—both capture pre-theoretic semantic behavior.  
  - **Derivation from Competence**: A speaker’s mastery of "water" includes knowing that its reference is fixed by ostension or description *in the actual world*, then held fixed modally. Rigidification systematizes this competence; it does not impose new structure.  

  *Why not ad hoc?* The formal move mirrors how natural language operates: "water" functions as a rigid designator *because* its reference-fixing is indexically anchored. The framework merely provides tools to represent this.

  ---

  **3. Identity Claims and Change of Subject**  
  The critic contends that "water is H₂O" and "water is the watery stuff of the actual world" (R) express distinct propositions, rendering the necessity of R irrelevant to the original identity. This conflates two notions of "meaning":  

  - **Propositions vs. Truth-Conditions**: While the *sentences* differ, they share secondary intensions (both necessary) *and* primary intensions (both contingent). Crucially:  
    - "Water is H₂O" has a contingent primary intension (true at *c* iff H₂O = the local watery stuff).  
    - R *also* has a contingent primary intension (true at *c* iff the *actual* watery stuff = the local watery stuff).  
    Both are false at Twin Earth centers—preserving their parallel epistemic status.  

  - **Necessity Without Replacement**: The necessity of "water is H₂O" arises *from the semantics of "water" itself*, not from substituting R. R articulates *why* the identity is necessary: because "water" rigidly designates what *actually* satisfies its primary intension. The necessity is discovered, not engineered.  
  - **What the Defender Owes**: We must grant that "water is H₂O" and R are syntactically distinct. But we deny this implies a change of subject. The framework shows that **the proposition expressed by "water is H₂O" *has two dimensions of evaluation***. R’s secondary intension models the metaphysical dimension of the original claim—it is a meta-linguistic illumination of *why* the identity holds necessarily, not a replacement.  

  ---

  **Conclusion: Rigidification as Revelation**  
  The objection assumes that if rigidification explains necessity, it must be external to meaning. But two-dimensionalism demonstrates that rigidity is *internal* to natural kind terms. Rigidification does not create a surrogate; it reveals that "water" already contains an indexical component tying it to the actual world. The necessity of "water is H₂O" is thus a semantic discovery about our language, not a trick. The primary/secondary distinction captures precisely how a statement can be metaphysically necessary yet epistemically contingent—without conflating epistemic and metaphysical two-dimensionalism. The framework succeeds because it mirrors the dual aspects of meaning inherent in our linguistic practice.  

  ---

  This defense maintains philosophical precision by:  
  - Grounding shared primary intensions in pre-theoretic linguistic behavior.  
  - Showing rigidification explicates, not alters, semantic competence.  
  - Distinguishing propositions from their meta-linguistic analyses while preserving truth-conditional equivalence in both dimensions.  
  - Avoiding appeals to epistemic two-dimensionalism as a deus ex machina.
