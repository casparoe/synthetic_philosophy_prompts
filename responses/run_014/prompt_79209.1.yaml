answer: |-
  Here’s a rigorous specification for a theory of "net ecosystem welfare," structured as a requirements list with justifications. Each requirement is grounded in logical, empirical, or ethical necessity, with biases flagged. Conflicts are summarized in a table at the end.

  ---

  ### **I. Core Requirements: Cases the Theory Must Resolve**  
  *Justification: A theory must handle real-world dilemmas without ad-hoc exceptions.*  
  1. **Logged forest vs. cattle pasture**:  
     - *Requirement*: Must compare welfare impacts of high-biodiversity/low-density (forest) vs. low-biodiversity/high-density (pasture) systems.  
     - *Why*: Tests trade-offs between species richness, individual suffering (e.g., stressed livestock vs. displaced wildlife), and scale (e.g., invertebrates vs. mammals).  
     - *Bias alert*: "Forests are sacred" is prejudice; theory must allow for cases where pasture *reduces* net suffering (e.g., if forest insects die gruesome deaths).  

  2. **Dam construction**:  
     - *Requirement*: Must weigh drowning of terrestrial fauna against new aquatic ecosystems, including long-term impacts (e.g., methane emissions affecting global welfare).  
     - *Why*: Tests time horizons and spatial boundaries (e.g., local extinctions vs. new fish populations).  

  3. **Rewilding project**:  
     - *Requirement*: Must evaluate reintroduced megafauna welfare against prey/competitor suffering (e.g., wolves eating deer) and human costs (e.g., livestock losses).  
     - *Why*: Tests density dependence (e.g., starvation in unchecked populations) and trophic cascades.  

  4. **Rainforest → oil palm plantation**:  
     - *Requirement*: Must account for invertebrate welfare (99% of rainforest biomass) vs. vertebrate welfare in plantations (e.g., rats, birds).  
     - *Why*: Invertebrates dominate ecological reality; ignoring them is bias.  

  5. **R-strategist reproduction (e.g., frog eggs)**:  
     - *Requirement*: Must handle "welfare throughput" — high infant mortality with intense suffering.  
     - *Why*: If 9,999 frogs die painfully, is this worse than zero frogs existing? Tests total vs. average welfare and whether non-existence can be preferable.  

  6. **"Empty forest" protected areas**:  
     - *Requirement*: Must detect cryptic welfare losses (e.g., poaching removing large mammals while trees remain).  
     - *Why*: Reveals if the theory conflates structural habitat with actual welfare.  

  ---

  ### **II. Required Distinctions (Non-Collapsible)**  
  *Justification: These are fundamental ethical splits; conflating them invalidates comparisons.*  
  1. **Total welfare (sum) vs. average welfare per individual**:  
     - *Requirement*: Must output both metrics separately.  
     - *Why*: A cattle pasture may have higher total welfare (more individuals) but lower average welfare (miserable lives) than a forest. Biases arise when conservationists emphasize total (more life!) and utilitarians emphasize average (less suffering!).  

  2. **Number of individuals vs. welfare quality**:  
     - *Requirement*: Must disentangle population size from suffering/well-being intensity.  
     - *Why*: "Fewer animals, better lives" (e.g., rewilding) vs. "more animals, worse lives" (e.g., insect outbreaks) are opposites.  

  3. **Suffering vs. flourishing**:  
     - *Requirement*: Must not net these out (e.g., "happy frogs cancel out tortured frogs").  
     - *Why*: Asymmetry matters — preventing suffering may be more urgent than promoting happiness (negative utilitarianism).  

  ---

  ### **III. Currency Problem: The Welfare Unit**  
  *Justification: Choice of unit changes outcomes; must be defensible, not arbitrary.*  
  - **Requirement**: Welfare must be quantified **per sentient individual**, weighted by moral patienthood (e.g., neurological capacity for suffering/flourishing).  
  - **Why**:  
    - *Per-hectare*: Biases toward dense populations (e.g., insects over elephants).  
    - *Per-biomass*: Biases toward large organisms (whales > krill).  
    - *Per-NPP unit*: Biases toward productive systems (algae blooms > deserts).  
  - **Defensible choice**: Individuals are the locus of experience. Weighting by sentience (e.g., insect vs. mammal) addresses the nematode/elephant gap. *But*: This requires a sentience hierarchy — a major uncertainty.  

  ---

  ### **IV. Counterfactual Problem**  
  *Requirement*: The baseline must be **dynamic and scenario-specific** (e.g., "compared to natural succession over 50 years").  
  - **Why it’s genuine**: Without a baseline, claims like "the dam improved welfare" are meaningless.  
  - **Why it’s not a dodge**: Use ecological forecasting (e.g., climate-adjusted models) or conservative priors (e.g., "minimal human interference").  
  - *Bias alert*: "Pristine nature" baselines are often mythical; the theory must use *achievable* counterfactuals.  

  ---

  ### **V. Consistency with Ecological Principles**  
  *Justification: Welfare emerges from ecological processes; ignoring this is fatal.*  
  1. **Trophic cascades/density dependence**:  
     - *Requirement*: Must model feedback loops (e.g., predator removal → prey overpopulation → starvation).  
  2. **Invertebrate dominance**:  
     - *Requirement*: Invertebrates must be included if sentient, even with uncertainty.  
     - *Why*: They represent >90% of individuals in ecosystems; excluding them is a bias toward "charismatic" species.  
  3. **Net Primary Productivity (NPP) limits**:  
     - *Requirement*: Must recognize NPP as a welfare constraint (e.g., less productivity → fewer individuals).  

  ---

  ### **VI. Time Horizon**  
  *Requirement*: Must be **time-indexed** (e.g., 50/100/500 years) with discounting justified.  
  - **Why**:  
    - Short-term: A dam may cause immediate suffering but long-term wetland welfare.  
    - Long-term: Rewilding may reduce welfare now (e.g., predation) but increase resilience later.  
  - **Timeless theories fail**: They ignore extinction debts or shifting baselines.  
  - *Bias alert*: Conservationists often favor long horizons; suffering-focused ethics favor short-term mitigation.  

  ---

  ### **VII. Biases to Exclude as Requirements**  
  1. **"Must give conservationists something to do"**:  
     - *Status*: Not a requirement — the theory could conclude that rewilding *harms* welfare. Actionability is downstream.  
  2. **"More life is better"**:  
     - *Status*: Smuggled-in bias. A requirement must be: "The theory must *test* whether more life improves welfare."  
  3. **"Humans excluded"**:  
     - *Status*: Bias — human welfare (e.g., farmers displaced by rewilding) must be included if non-human welfare is.  

  ---

  ### **VIII. Requirement Conflicts: The Impossible Trade-offs**  
  | **Conflict Pair**                           | **Why They Clash**                                                                                               | **Knockout Power**                                                                 |  
  |---------------------------------------------|------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------|  
  | **Sentience weighting vs. empirical grounding** | Weighting nematode vs. elephant welfare requires subjective moral assumptions. But empiricism demands measurable data (which doesn't exist for most invertebrates). | *Knocks out*: All popular theories. Utilitarianism (needs data), speciesism (ignores small beings), and biocentrism (assumes equality without proof). |  
  | **Total welfare focus vs. suffering minimization** | Maximizing total lives (e.g., r-strategists) may maximize suffering (e.g., starving froglets). Minimizing suffering may require fewer lives. | *Knocks out*: "More life is better" rhetoric and anti-suffering frameworks. |  
  | **Dynamic counterfactuals vs. tractability** | High-fidelity baselines (e.g., climate-adjusted futures) are complex and speculative. Simple baselines (e.g., "no change") are unrealistic. | *Knocks out*: Policy-friendly metrics (e.g., "habitat hectares") that ignore welfare dynamics. |  

  #### **Worst Conflict**: **Sentience weighting vs. empirical grounding**  
  - *Why it’s fatal*: If nematodes are 1/1,000,000 as sentient as elephants, but outnumber them 10,000:1 per hectare, nematodes dominate welfare calculations. Yet we can’t measure nematode welfare — so the theory either collapses into speculation or ignores most beings.  

  #### **Single Requirement That Eliminates Most Popular Answers**  
  - **"Must include invertebrates (if sentient) and output total/average welfare separately"**  
    - *Knocks out*:  
      - Conservation biology (focuses on species, not individuals).  
      - Animal rights frameworks (ignore invertebrates).  
      - GDP-style habitat metrics (e.g., "forest cover = good").  
      - "Wildlife abundance" indices (conflate quantity and welfare).  

  ---

  ### **Conclusion: The Non-Negotiables**  
  An adequate theory must:  
  1. Treat **individual welfare** as the currency, weighted by sentience.  
  2. Output **total and average welfare** separately.  
  3. Use **time-indexed, dynamic counterfactuals**.  
  4. Integrate **ecological primitives** (trophic cascades, NPP, density dependence).  
  5. **Include all plausibly sentient life** (esp. invertebrates).  
  6. **Avoid assuming "more life = better"** — this must be a conclusion.  

  No existing framework satisfies all, due to the sentience/empiricism conflict. The closest is *sentience-adjusted welfare ecology* — but it stalls on invertebrate sentience research. This spec forces transparency: **declare assumptions, show calculations, and admit uncertainty**.
