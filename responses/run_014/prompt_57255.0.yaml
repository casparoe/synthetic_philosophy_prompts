  For the theory reconstruction (point 1), we should examine how heritage frameworks treat traditions as bounded objects with essential characteristics. The application criteria reveal a lot: requiring generational transmission assumes traditions are discrete entities passed like batons, while the "recognized as theirs" condition implies cultural ownership. The authenticity question is particularly thorny - by prioritizing genealogical continuity over present meaning, the system privileges origins over contemporary practice.

  The rival pictures (point 2) involve what gets silenced. Constructionist perspectives (Hobsbawm's "invented traditions") or Barth's boundary-maintenance theories directly challenge the register's assumptions. If traditions are fluid negotiations rather than stable inheritances, then the listing process doesn't just describe but actively creates the very thing it "preserves" through bureaucratic categorization. Officials might counter that some baseline stability is necessary for protection, but that's where the anthropology clashes with administration.

  On underdetermination (point 3), there's surprising wiggle room in the paperwork. A savvy constructionist could interpret "safeguarding" as supporting organic evolution rather than freezing forms. The danger clause could be read as protecting transmission mechanisms rather than content. But in practice, funding incentives push toward canonization - that's where the philosophy gets steamrolled by bureaucracy.

  For concrete changes (point 4), imagine replacing "authenticity" with "integrity of transmission" in the criteria. That small wording shift could redirect funding from museum-style preservation to supporting apprenticeship networks. Or removing the requirement to name "bearer communities" might allow for fuzzy, overlapping participation. 

  The user's description seems accurate based on my knowledge of UNESCO's Convention for the Safeguarding of Intangible Cultural Heritage (2003), though national implementations vary. Where I'm least certain is whether officials truly don't see the standardization paradox - some heritage scholars (like Laurajane Smith) argue they're well aware but prioritize manageability. That's worth flagging for the user to verify with ethnographers.

