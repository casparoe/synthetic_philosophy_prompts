answer: |-
  That's an incredibly sharp observation – you've pinpointed the core philosophical tension underlying modern space law. The disconnect between the lofty ideals of the Outer Space Treaty (OST) and the practical realities of national space resource laws *is* jarring, and it reveals a fascinating (and arguably unresolved) clash of property theories underpinning the current regime. Let's break down the implicit presuppositions, their coherence, and alternatives.

  **Deconstructing the Current Regime's Implicit Property Theory:**

  1.  **Negative Sovereignty Principle (OST Foundation):**
      *   **Presupposition:** Space and celestial bodies are *res communis omnium* (things common to all). No state can claim sovereignty, effectively creating a global commons.
      *   **Theory:** Rooted in international law principles preventing unilateral territorial grabs, analogous to the high seas. It presupposes that territorial sovereignty is the primary threat to peaceful and equitable use. Justice here is primarily procedural (no unilateral claims) rather than distributive.

  2.  **Positive Property Rights in Extracted Resources (National Laws/Artemis Accords):**
      *   **Presupposition:** Ownership of extracted resources is distinct from ownership of the celestial body itself. Possession, extraction effort ("labour"), and investment create a legitimate private property right.
      *   **Theory:** Highly **Lockean Labor Theory of Property** meets **Possession/First Appropriation**. By mixing their labor (robots, technology, capital) with the unowned resource, the extractor gains ownership. The analogy to fishing/high seas mining is explicit: you don't own the ocean, but you own the fish you catch or the minerals you scoop.
      *   **Implicit Justice Principle:** Justice rewards investment, risk, and effort. It presupposes that enabling private enterprise through secure property rights is the most efficient way to develop space resources, ultimately benefiting humanity through technological advancement and economic growth ("trickle-down" or "rising tide lifts all boats" reasoning).

  3.  **"Benefit of All Mankind" (OST & Artemis Accords):**
      *   **Presupposition:** This principle is satisfied primarily by:
          *   **Non-Exclusion:** Freedom of access for all states (the "open commons" aspect).
          *   **Peaceful Purposes:** Preventing military conflict.
          *   **Scientific Sharing:** Dissemination of scientific findings.
          *   **Indirect Benefits:** Technological spinoffs and economic growth spurred by private activity.
      *   **Theory:** A **thin interpretation of "Benefit"**, focusing on process (open access, peace) and indirect outcomes, rather than direct material distribution or shared ownership. It presupposes that enabling extraction *is* the primary way to achieve "benefit."

  **Is This Coherent? Mostly a Fudge.**

  *   **Superficial Coherence:** The legal distinction between *sovereignty* (over territory) and *property* (over moveable resources) *is* a well-established legal concept (like the high seas). This allows states to argue they are technically compliant with the OST's "non-appropriation" clause while enabling extraction.
  *   **Philosophical & Practical Incoherence:**
      *   **"Province of All Mankind" vs. Private Appropriation:** The Lockean "first come, first served" model directly contradicts the spirit of "common heritage" or collective ownership implied by "province of all mankind." Resources extracted by a single entity *are* effectively appropriated for private/national benefit, potentially permanently excluding others from that specific resource.
      *   **"Benefit of All Mankind" as Rhetoric?** The thin interpretation risks reducing the principle to mere rhetoric. If the benefits are primarily indirect (spinoffs) or non-material (scientific knowledge), while the direct, immense material wealth is captured privately or by a few nations, it falls far short of a meaningful "common heritage" principle. How does a landlocked developing nation benefit from asteroid platinum mined by a US company?
      *   **Ignoring Power Asymmetry:** The regime presupposes equal access ("freedom of exploration"), but in reality, only a handful of states and corporations have the capability to extract resources. This creates a massive power imbalance where the "first come" are overwhelmingly the already powerful, potentially cementing space inequality.
      *   **Absence of Distributive Justice:** The current model has *zero* mechanism for ensuring the fruits of space resources are shared equitably across humanity. Justice is defined purely procedurally (access, non-appropriation) and in terms of rewarding labor/investment, not in terms of distributive outcomes.

  **Taking "Common Heritage" Seriously: The Needed Changes**

  If the "province of all mankind" implied a robust "Common Heritage of Mankind" (CHM) principle (like that intended, though failed, in the Moon Agreement), the current Lockean extraction model would be fundamentally incompatible. Implementing a meaningful CHM principle would require drastic changes:

  1.  **Global Management Authority:** Establishing an international body (e.g., under UN auspices, but with real power) to regulate space resource activities. This body, not individual states, would grant licenses.
  2.  **Mandatory Benefit-Sharing Mechanisms:**
      *   **Global Resource Tax:** A significant percentage of the value of extracted resources paid into a global fund.
      *   **International Licensing Fees:** Fees paid by operators to the international body for the right to extract.
      *   **Equitable Distribution:** Revenues from taxes/fees distributed according to an agreed formula prioritizing global needs (poverty alleviation, climate change mitigation, sustainable development, global public goods) and ensuring all nations benefit, not just spacefaring ones. This could be per capita, needs-based, or a combination.
  3.  **Non-Discriminatory Access:** Guaranteed access to resources or benefits for all states, potentially including technology transfer provisions to build capacity in developing nations.
  4.  **Sustainability & Conservation:** Strong international regulations to prevent resource depletion, environmental damage, and ensure long-term sustainability of space activities for future generations.
  5.  **Limits on Private Property:** Recognition that while extractors might have *use rights* and recoup investment/profit, the ultimate *ownership* of the resources in situ remains collective. Extracted resources might be seen as held in trust or subject to the benefit-sharing obligations.

  **Could Lockeanism and Common Heritage Coexist? (A Potential Reconciliation?)**

  It's theoretically possible, but requires significant constraints on pure Lockeanism that don't exist today:

  1.  **Locke's Proviso Applied Rigorously:** Locke's theory requires that appropriation leaves "enough and as good" for others and causes no spoilage. In space, with finite asteroids and planetary resources, this proviso is critical. Extraction must be regulated to ensure resources remain available for future generations and other actors. *Current practice ignores this.*
  2.  **"Benefit of All Mankind" as a Binding Condition:** The right to extract and own resources could be contingent on demonstrably fulfilling the "benefit of all mankind" obligation. This moves beyond the current thin interpretation.
      *   **Mandatory Contribution:** Extractive activities *must* contribute a defined portion of value/profit to a global benefit mechanism (tax/fund).
      *   **Technology Sharing:** Requirements for sharing non-proprietary technologies derived from extraction.
      *   **Prioritizing Global Needs:** Licensing could favor projects that directly address critical global challenges.
  3.  **International Oversight:** An international body would need authority to enforce the proviso and the benefit-sharing conditions, ensuring extraction doesn't monopolize resources or undermine the common heritage principle.

  **Conclusion:**

  You're absolutely right to sense a fudge. The current international space regime **implicitly presupposes a hybrid but ultimately incoherent model:**

  *   A **negative sovereignty principle** (no state claims) creating a global commons.
  *   A **strong Lockean labor/possession theory of private property** for extracted resources, largely unconstrained by Locke's own provisos.
  *   A **minimalist, procedural interpretation of "benefit of all mankind"** focused on non-exclusion, peace, and indirect benefits rather than distributive justice.

  This incoherence is sustained because powerful spacefaring nations have reinterpreted the OST to suit their capabilities and economic interests, leveraging the legalistic distinction between sovereignty and property. Taking "common heritage" seriously would necessitate a radical overhaul towards an international regulatory regime with mandatory benefit-sharing and constraints on private appropriation to ensure equitable distribution – a model politically unpalatable to those currently positioned to exploit space resources. The tension you've identified isn't just philosophical; it's the fundamental political battleground for the future of space governance.
