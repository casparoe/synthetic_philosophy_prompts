  We are given a scenario involving a pretrial risk assessment tool in the United States. The tool assigns defendants to risk levels (e.g., low, medium, high) intended to predict an outcome such as rearrest within a fixed period. Critics found a disparity in error rates: among defendants who did not experience the outcome (i.e., were not rearrested), Black defendants were classified as high risk at a substantially higher rate than white defendants. The developer responded that the tool is similarly predictive across groups: among defendants assigned the same risk level, the outcome rate is similar across groups. We are also told that the underlying base rates (the proportion of defendants in each group who experience the outcome) differ.

  We are to work with two fairness definitions:
  1. Calibration within groups: For a given risk score or level, the observed outcome rate is roughly the same in each group.
  2. Balance in false positive rates (FPRs): Among those who do not experience the outcome, the proportion designated as high risk is roughly equal across groups.

  The core impossibility claim is that when base rates differ and prediction is imperfect but nontrivial, these two conditions cannot both hold for the same scores and a single threshold, except in degenerate cases.

  We are to do four things:

  1. **Disciplined mapping**: Identify the predictor, decision, groups, outcome, base-rate difference, and what each desideratum demands.
  2. **Evaluate a reform proposal**: An oversight board proposes to keep a common underlying score but use group-specific thresholds and adjust the reported scores to appear calibrated. Does this escape the trade-off? What must give? What residual normative choice remains?
  3. **Honest account**: Discuss what the dispute looks like with the math clear, what the impossibility framework explains and what it leaves out (e.g., outcome measure choice, human discretion, data legitimacy), and what the case reveals about the limits of the theory.
  4. **Separation of settled math and contested norms**: Clearly separate what is mathematically settled from what is contested about which criterion should govern.

  ---

  **1. Disciplined Mapping**

  - **Predictor**: The risk assessment tool that outputs a risk score (which might be continuous or discrete) for each defendant. This score is then mapped to risk levels (e.g., low, medium, high) via thresholds.
  - **Decision**: The designation of a defendant as "high risk" (or perhaps the assignment to a risk level) which might be used by judges to inform decisions about pretrial release or detention.
  - **Groups**: We have two groups: Black defendants and white defendants.
  - **Outcome variable**: The measured outcome (e.g., rearrest within a fixed period). Let `Y=1` if rearrest occurs, `Y=0` otherwise.
  - **Base-rate difference**: The proportion of Black defendants who are rearrested (P(Y=1 | Black)) is different from that of white defendants (P(Y=1 | white)). Without loss of generality, we assume the base rate for Black defendants is higher (as is often observed in the data).

  **Fairness Desiderata**:

  a. **Calibration within groups** (also known as calibration by group or test fairness): 
     - For a given risk level (or score), the proportion of defendants who are rearrested should be approximately the same for Black and white defendants.
     - Example: Among all defendants assigned a risk score of 7, the rearrest rate should be about the same for Black and white defendants.

  b. **Balance in false positive rates (FPRs)** (also known as equalized odds for the negative class or predictive equality):
     - The false positive rate (FPR) is the probability of being classified as high risk given that the defendant does not get rearrested (i.e., P(classified high | Y=0)).
     - This condition requires that FPR for Black defendants equals FPR for white defendants: P(classified high | Y=0, Black) = P(classified high | Y=0, white).

  **How base-rate difference enters**: The base rate for the outcome (rearrest) is the prior probability of rearrest in each group. If the base rates differ, and the predictor is imperfect (i.e., it does not perfectly predict the outcome), then the impossibility result tells us we cannot simultaneously satisfy both calibration within groups and balance in FPRs with the same scores and a single threshold.

  **Concrete demands of each desideratum**:

  - For **calibration**: The mapping from risk levels to observed outcome rates must be the same across groups. If we have a risk score `S` (or a risk level that is a function of `S`), then for any value `s` of the score, we require:
        P(Y=1 | S=s, Black) = P(Y=1 | S=s, white)

  - For **balance in FPRs**: We require that the false positive rates are equal across groups. This is defined with respect to a binary decision (high risk or not). If we set a threshold `t` such that a defendant is classified as high risk if `S >= t`, then we require:
        P(S>=t | Y=0, Black) = P(S>=t | Y=0, white)

  Note: The impossibility result (e.g., from Chouldechova, 2017; Kleinberg et al., 2017) states that if the base rates differ and the predictor is not perfect, then calibration and balance in FPRs (along with balance in false negative rates) cannot all hold simultaneously. In particular, calibration and balance in FPRs are incompatible when base rates differ.

  ---

  **2. Reform Proposal Evaluation**

  The oversight board proposes:
  - Keep a common underlying risk score (i.e., the same scoring model for both groups).
  - Use group-specific thresholds for the decision (e.g., a lower threshold for white defendants and a higher threshold for Black defendants to be classified as high risk).
  - Adjust the reported scores (post hoc) so that the scores appear calibrated (i.e., the same score value in both groups implies the same outcome rate).

  **Does this escape the trade-off?**

  The proposal attempts to satisfy both desiderata by using group-specific thresholds and adjusting the reported scores. Let's break it down:

  - **Common underlying score**: The model producing the score is the same for both groups. Let `S` be the raw score.
  - **Group-specific thresholds**: Let `t_B` be the threshold for Black defendants and `t_W` for white defendants. The decision rule is: for a Black defendant, classify as high risk if `S >= t_B`; for a white defendant, classify as high risk if `S >= t_W`.
  - **Post hoc adjustment of reported scores**: They adjust the scores so that the reported score `S'` is calibrated. This might be done by transforming the raw score `S` to `S'` such that for any value `s'` of the reported score, the observed outcome rate is the same for Black and white defendants. This is typically achieved by a monotonic transformation (e.g., scaling) within each group.

  **What must give?**

  The impossibility result is about having both calibration and balance in FPRs for the same score and the same threshold. The proposal changes two things: thresholds are group-specific and the reported score is adjusted. However, note:

  - The underlying raw score `S` is the same for both groups. The group-specific thresholds are applied to this raw score. The false positive rate (FPR) is defined by the decision (which uses the threshold) and the raw score. So for FPR balance we require:
        P(S>=t_B | Y=0, Black) = P(S>=t_W | Y=0, white)

  But note: the base rates differ and the raw score `S` is the same. Even with group-specific thresholds, we cannot simultaneously have calibration on the raw score and balance in FPRs. However, the proposal does not claim to have the raw score calibrated. Instead, they adjust the reported score `S'` to be calibrated.

  Let `S'` be the adjusted score. They design the transformation such that `S'` is calibrated. Then they set group-specific thresholds on the raw score `S` (or perhaps on the adjusted score? the proposal is ambiguous). But note: the decision is made on the raw score (with group-specific thresholds) and then the reported score is adjusted for display. The adjustment does not affect the decision.

  Alternatively, they might set thresholds on the adjusted score. But then the decision would be based on the adjusted score. Let's assume that:

  - The adjusted score `S'` is calibrated: for any `s'`, P(Y=1 | S'=s', Black) = P(Y=1 | S'=s', white) = p(s').
  - They set a common threshold `t'` on the adjusted score? Or group-specific thresholds? The proposal says "group-specific decision thresholds", so they might set `t'_B` and `t'_W` on the adjusted score.

  But note: if they set group-specific thresholds on the adjusted score, then the decision rule is: classify as high risk if `S' >= t'_g` for group `g`. Then the FPR for group `g` is P(S' >= t'_g | Y=0, g). For balance in FPRs we require:
        P(S'>= t'_B | Y=0, Black) = P(S'>= t'_W | Y=0, white)

  However, because the adjusted score is calibrated, the distribution of `S'` given `Y=0` might be different across groups. Specifically, the distribution of `S'` in the negative class (Y=0) depends on the transformation and the base rates.

  The key point: even with a calibrated score, we can set group-specific thresholds to achieve balance in FPRs. But what about the decision? The proposal claims to escape the impossibility. However, note that the impossibility result applies when we use the same threshold for both groups. With group-specific thresholds, we can achieve both:

    1. Calibration: by construction of the adjusted score.
    2. Balance in FPRs: by choosing the thresholds `t'_B` and `t'_W` appropriately to equalize FPRs.

  But what must give? The trade-off is not entirely escaped; it is relocated. Specifically:

  - The underlying raw score is no longer the basis for the decision (unless the adjusted score is used in a way that breaks the link with the raw score). The adjusted score is a transformed version. The transformation might change the relative rankings within groups.

  Moreover, note that if we use group-specific thresholds on the calibrated score to achieve balance in FPRs, then we are essentially making the decision rule group-dependent. This might lead to differences in the proportion of each group that is classified as high risk (i.e., the overall high-risk rate may differ). This could lead to a different kind of disparity: for instance, if we set the thresholds to achieve FPR balance, then the true positive rates (TPRs) might become unequal. Alternatively, we might set thresholds to achieve a particular trade-off.

  **Residual normative choice**: The residual choice is about the trade-off between false positives and false negatives in each group. Even if we set thresholds to achieve FPR balance, we might get different false negative rates (FNRs) across groups. Alternatively, we could set thresholds to achieve equal FNRs, but then FPRs would be unequal. The choice of which error rates to balance (if any) is a normative one. It depends on the relative costs of false positives (detaining someone who would not have been rearrested) and false negatives (releasing someone who would be rearrested) and how these costs are distributed across groups and society.

  In summary, the proposal can achieve both calibration (on the adjusted score) and balance in FPRs by using group-specific thresholds on the adjusted score. However, the trade-off then appears in the form of potentially unequal false negative rates (or other metrics) and the overall classification rates by group. The residual normative choice is about how to set the group-specific thresholds: we must decide what error rates we are willing to tolerate in each group.

  ---

  **3. Honest Account**

  **With the mathematics clear**:

  The dispute centers on two fairness criteria. The developer's claim that the tool is similarly predictive (calibration) is mathematically at odds with the critics' demand for balance in false positive rates, given the base rate difference. The impossibility result shows that both cannot be achieved simultaneously. Therefore, the developer and critics are advocating for mutually exclusive properties.

  **What the impossibility framework explains well**:

  - It clarifies why the two sides are talking past each other: they are demanding two incompatible properties.
  - It highlights the role of base rate differences in creating the tension.
  - It forces a choice: which fairness criterion should be prioritized?

  **What it misdescribes or leaves out**:

  - **Choice and validity of the outcome measure**: The outcome (e.g., rearrest) may be a poor proxy for the underlying concern (e.g., future criminal activity). Rearrest rates are influenced by policing practices, which may be biased. The framework assumes the outcome is well-defined and unbiased, which is often contested.
  - **Role of human discretion**: Judges use the risk score as one input. They might override the tool. The framework considers only the tool's output, not the entire decision-making process.
  - **Legitimacy of the data-generating process**: The data used to build the tool (arrest records) may reflect historical biases. The framework takes the data as given and does not question its fairness.
  - **Other fairness criteria**: There are other criteria (e.g., equalized odds, demographic parity) that might be considered, and the framework does not adjudicate among them.

  **What the case reveals about the limits of the theory**:

  - The theory is silent on the source of the base rate difference. If the difference is due to structural inequities, then using the tool might perpetuate them.
  - The theory does not address the consequences of the decisions (e.g., the harm of pretrial detention). The choice between criteria should depend on these consequences.
  - The theory assumes a fixed, known outcome and does not handle measurement error in the outcome.
  - The theory is about the mathematical properties of the predictor and does not consider the social context or the potential for the tool to change behavior (e.g., if the tool affects who is detained, it might affect future rearrest rates).

  ---

  **4. Separation of Settled Math and Contested Norms**

  - **Mathematically settled** (given the definitions and assumptions):
    - When base rates differ and the predictor is imperfect, it is impossible to simultaneously achieve calibration within groups and balance in false positive rates with the same score and a single threshold.
    - With group-specific thresholds and score adjustments, it is mathematically possible to achieve both calibration (on the adjusted score) and balance in FPRs. However, this comes at the cost of having group-specific decision rules and may lead to disparities in other metrics (like false negative rates).

  - **Contested among researchers and practitioners**:
    - **Which criterion should be used?** Some argue that calibration is necessary for the score to be meaningful (so that a given score means the same thing across groups). Others argue that balance in error rates (like FPRs) is more important because it directly addresses disparate impact on individuals who would not recidivate.
    - **Should group-specific thresholds be used?** This is controversial because it explicitly treats groups differently, which might be seen as discriminatory or as a necessary corrective.
    - **What is the goal of pretrial risk assessment?** Is it to minimize overall error, to avoid unnecessary detention (prioritizing low FPR), to prevent crimes (prioritizing high TPR), or to achieve fairness in the process? These goals are normative and not settled by mathematics.
    - **The validity of the outcome measure**: There is ongoing debate about whether rearrest is an appropriate outcome, given potential biases in policing and the justice system.

  Throughout, we must avoid presenting one normative view as consensus. The mathematical framework clarifies the trade-offs but does not resolve the ethical and policy questions.
answer: |-
  ### Case Analysis: Impossibility Results in Algorithmic Fairness and Pretrial Risk Scores

  #### **1. Disciplined Mapping**

  **Core Elements**:  
  - **Predictor**: The statistical risk score (e.g., COMPAS, PSA), typically a continuous or ordinal value (e.g., 1–10) estimating the probability of a defendant experiencing the outcome.  
  - **Decision**: Binary classification as "high risk" (e.g., via a threshold on the score), intended to inform judicial choices about pretrial detention or release.  
  - **Groups**: Black defendants (Group B) and white defendants (Group W).  
  - **Outcome Variable**: Measured binary event (e.g., "rearrest within two years"), where \(Y=1\) if the event occurs, \(Y=0\) otherwise.  
  - **Base-Rate Difference**: The true prevalence of the outcome differs across groups, such that \(P(Y=1 | \text{Group B}) > P(Y=1 | \text{Group W})\).  

  **Fairness Desiderata**:  
  - **Calibration Within Groups**: For any given risk score \(s\), the observed outcome rate should be similar across groups:  
    \[
    P(Y=1 | S=s, \text{Group B}) \approx P(Y=1 | S=s, \text{Group W}).
    \]  
    *Concrete demand*: A score of 7 must imply a ~40% rearrest rate for both Black and white defendants.  
  - **Balance in False Positive Rates (FPRs)**: Among defendants who *do not* experience the outcome (\(Y=0\)), the proportion falsely labeled "high risk" should be similar:  
    \[
    P(S \geq \tau | Y=0, \text{Group B}) \approx P(S \geq \tau | Y=0, \text{Group W}),
    \]  
    where \(\tau\) is the threshold for "high risk."  
    *Concrete demand*: If 20% of white non-recidivists are misclassified as high risk, the same should hold for Black non-recidivists.  

  **Role of Base-Rate Difference**:  
  The impossibility theorem states that when \(P(Y=1 | \text{Group B}) \neq P(Y=1 | \text{Group W})\) and predictions are imperfect (AUC < 1), calibration and FPR balance **cannot coexist** for the same score and threshold \(\tau\). This arises because:  
  - Calibration requires score distributions to reflect group-specific base rates.  
  - FPR balance requires the score distributions *conditional on \(Y=0\)* to be similar.  
  Base-rate differences make these demands mathematically incompatible.  

  ---

  #### **2. Reform Proposal Evaluation**  

  **Proposal**:  
  - **Retain** a common underlying score (e.g., same model for all groups).  
  - **Apply group-specific thresholds** (\(\tau_B, \tau_W\)) for the "high risk" decision.  
  - **Adjust reported scores** post hoc to ensure calibration (e.g., map raw scores to rescaled values so that a score of \(s\) implies the same outcome rate in both groups).  

  **Does This Escape the Tradeoff?**  
  No—it **relocates the tradeoff** rather than eliminating it. Here’s why:  

  - **Calibration Achieved**: By transforming scores (e.g., via group-specific monotonic mappings), the *reported* score \(S'\) satisfies calibration:  
    \[
    P(Y=1 | S'=s, \text{Group B}) = P(Y=1 | S'=s, \text{Group W}).
    \]  
  - **FPR Balance Achieved**: Group-specific thresholds \(\tau_B, \tau_W\) can be chosen to equalize FPRs:  
    \[
    P(S \geq \tau_B | Y=0, \text{Group B}) = P(S \geq \tau_W | Y=0, \text{Group W}).
    \]  
    *Note*: FPR balance uses the **raw score** \(S\) (not the adjusted \(S'\)) for decisions.  

  **What Must Give?**  
  - **Loss of Meaningful Score Comparability**: The adjusted score \(S'\) is calibrated but severs ties to the raw score \(S\). A defendant’s \(S'\) value no longer reflects their absolute risk—only their risk *relative to their group*.  
  - **Residual Tradeoff in Error Distribution**: While FPRs are balanced, **false negative rates (FNRs)** may diverge:  
    - Higher base rates in Group B typically require a *higher* threshold \(\tau_B\) to equalize FPRs.  
    - This increases FNR for Group B (more high-risk defendants misclassified as low risk).  
  - **Normative Choice Remains**: Stakeholders must choose how to distribute errors:  
    - **Option 1**: Prioritize FPR balance (reducing disparities in unnecessary detention).  
    - **Option 2**: Prioritize calibration (ensuring scores are "accurate" within groups).  
    - **Option 3**: Tolerate unequal FPRs/FNRs to minimize overall harm (e.g., detaining fewer people overall).  

  **Key Insight**: The proposal shifts the impossibility tradeoff from the score itself to the **interpretability of scores and the distribution of false negatives**. Judges using adjusted scores \(S'\) see "calibrated" risk estimates but make decisions based on thresholds that treat groups differently—obscuring the underlying ethical choices.  

  ---

  #### **3. Honest Account**  

  **With Impossibility Mathematics Clarified**:  
  - The developer’s claim (calibration) and critics’ demand (FPR balance) are **mathematically irreconcilable** under base-rate differences. This explains why debates are intractable: each side advocates a distinct, incompatible criterion.  

  **What Impossibility Explains Well**:  
  - **Source of Disagreement**: Clarifies that the dispute is not about bias in model design per se, but about **which fairness axiom to prioritize** when base rates differ.  
  - **Limits of Technical Fixes**: Highlights why superficial adjustments (e.g., reweighting training data) fail to resolve the conflict.  

  **What It Misdescribes or Leaves Out**:  
  - **Outcome Validity**: The outcome (e.g., "rearrest") is contested. Arrests may reflect policing bias, not true criminal behavior. Impossibility assumes the outcome is ground truth, sidestepping this.  
  - **Human Discretion**: Judges may override risk scores, blending algorithmic and human judgment. Impossibility treats the score as the sole decision input.  
  - **Data Legitimacy**: Scores trained on historically biased data (e.g., over-policed communities) may inherit injustice. Impossibility takes data as given.  
  - **Structural Roots**: Base-rate differences themselves may stem from systemic inequities (e.g., poverty, policing). The framework ignores this, treating base rates as immutable.  

  **What the Case Reveals About Theory Limits**:  
  - **Beyond Binary Fairness**: Real-world fairness involves tradeoffs beyond two criteria (e.g., procedural justice, long-term societal impacts).  
  - **Contextual Nuance**: The theory cannot dictate which criterion *should* matter; this depends on societal values (e.g., is avoiding detention for non-recidivists more urgent than preventing crimes?).  
  - **Dynamic Effects**: Scores may alter behavior (e.g., detention increasing job loss, thus recidivism). Impossibility assumes a static world.  
  - **Where Theory Should Stay Silent**: Impossibility cannot resolve normative questions (e.g., whether group-specific thresholds are "fair" or discriminatory).  

  ---

  #### **4. Separation of Settled Math vs. Contested Norms**  

  **Mathematically Settled** (Given Definitions):  
  - Calibration + FPR balance + non-identical base rates \(\implies\) perfect prediction or triviality (Chouldechova, 2017; Kleinberg et al., 2017).  
  - Group-specific thresholds + score adjustments *can* satisfy both desiderata superficially but shift tradeoffs to FNRs and score interpretability.  

  **Contested Normative Choices**:  
  - **Criterion Selection**: No consensus on whether calibration (developer view) or FPR balance (critics) is appropriate for pretrial decisions.  
    - *Pro-calibration*: Argues scores must reflect "true risk" to avoid differential treatment (e.g., releasing high-risk defendants in one group).  
    - *Pro-FPR balance*: Views false positives (unnecessary detention) as particularly harmful due to racial disparities in incarceration.  
  - **Group-Specific Thresholds**:  
    - *Supporters*: See it as necessary to correct disparities.  
    - *Opponents*: Argue it violates equal protection by explicitly using race.  
  - **Risk Tolerance**: Society must weigh:  
    - Cost of false positives (detaining innocent people) vs. false negatives (releasing someone who recidivates).  
    - Whether these costs differ across groups (e.g., due to systemic vulnerabilities).  
  - **Outcome Validity**: Experts dispute if rearrest is a valid proxy for "dangerousness" or if it perpetuates bias.  

  **Conclusion**: The impossibility theorem illuminates why the pretrial controversy is unresolvable through technical means alone. It forces stakeholders to confront value-laden tradeoffs: What kind of "fairness" matters most—predictive accuracy, equal error rates, or something beyond the algorithm? The math clarifies constraints but cannot answer these questions, which remain in the domain of ethics, law, and policy.
