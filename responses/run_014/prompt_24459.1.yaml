  Discriminating case: An agent with anticipation but no homeostasis—say, predicting negative outcomes for external goals only. Rule 1 says yes, Rule 2 says no. If the advisor says no, Rule 2 is favored. 

  Also, underdetermination: The role of "drive" vs. explicit model isn't fully resolved in the original cases. The third system had a "simple internal model," but the fourth might not specify. The new case's drive as a penalty might be seen as analogous, or too extrinsic. 

