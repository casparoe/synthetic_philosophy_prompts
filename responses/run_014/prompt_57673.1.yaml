prompt: |-
  I'm a litigator in federal civil practice, fifteen years in; I know the rules of evidence and Rule 11 backwards, and I have no philosophy training. The debate I want translated is the epistemologists' argument over the norm of assertion — that one should assert only what one knows (the view associated with Williamson), against the rivals holding that assertion requires truth, or reasonable belief, or nothing more than sincerity.

  Render each candidate in the vocabulary I work in: personal knowledge as a foundation requirement for a witness, the certification that factual contentions have evidentiary support after an inquiry reasonable under the circumstances, the perjury standard's preoccupation with what the declarant believed rather than with what was so, materiality, willfulness, sanctions, and the allocation of risk between the one who speaks and the one who relies. Translate faithfully; don't smuggle my framework's assumptions back to me as conclusions about theirs.

  Then give me the residue report. Which candidate has an exact legal counterpart and which only an approximate one? Where does the translation force distortion — for instance, because every standard I know is imposed from outside on an activity that would exist anyway, whereas the philosophers hold that at least one of these norms is constitutive of the activity itself? What in their debate is inexpressible in my vocabulary at all? And where translation fails, is that a limitation of the legal framework, or a sign that the philosophical claims were less determinate than they sound?
reasoning: |-
  Okay, the user is a federal litigator with 15 years of experience. They want to understand the philosophical debate about the norm of assertion using legal concepts they're familiar with. The main theories are Williamson's knowledge norm versus truth, reasonable belief, or sincerity norms. 

  First, I need to map each philosophical position to legal equivalents without bias. The user emphasized avoiding smuggling legal assumptions back as philosophical conclusions. That's crucial—they want pure translation, not interpretation.

  Breaking down the philosophical theories: Williamson says you must know something to assert it. That's like a witness's personal knowledge requirement under FRE 602. Reasonable belief norm maps to Rule 11's evidentiary support certification. Truth norm resembles perjury's focus on factual incorrectness. Sincerity norm is perjury's belief element ("not believing it's true"). 

  Noticing friction points already: Legal standards are externally imposed sanctions, while philosophers debate constitutive rules defining assertion itself. That's a key difference to flag in the residue report. Also, materiality has no philosophical counterpart—philosophers don't care about importance, just the assertion's propriety.

  For the residue analysis: Knowledge norm has the cleanest legal parallel (FRE 602). Reasonable belief is close but Rule 11 is about pre-filing diligence, not assertion-in-isolation. Truth norm overlaps perjury but diverges because perjury requires falsity + intent. Sincerity-only is the weakest match—law always adds more requirements. 

  The untranslatable element is this "constitutive rule" idea. In law, rules regulate speech; in philosophy, some argue the knowledge norm defines what assertion is. That's why I'll compare it to chess rules—moving a pawn diagonally isn't "bad chess," it's not chess at all. Can't express that in legal terms because law doesn't create speech acts, just polices them.

  User's deeper need: They're likely encountering this debate in academic writing or expert testimony. They want to engage critically but lack philosophy background. The residue report helps them spot where philosophical claims might overreach (e.g., "truth norm" sounds precise but perjury's dual requirements show it's messier). Also, highlighting translation failures shows where philosophy might be underspecified—good for their litigation bullshit detector.

  Biggest challenge was avoiding contamination. Had to constantly ask: "Is this what philosophers mean, or am I grafting legal concepts?" For example, philosophers' "truth norm" isn't about sanctions—it's about propriety. Had to separate that from perjury's punishment structure.
answer: |-
  Here's a precise translation of the philosophical norms of assertion into your federal litigation framework, followed by a residue report identifying friction points and untranslatable elements:

  **Translation of Philosophical Norms into Legal Vocabulary:**

  1.  **The Knowledge Norm (Williamson):**
      *   **Legal Counterpart:** **FRE 602 (Lack of Personal Knowledge)** as a *foundational bar to testimony*. Assertion requires the declarant to have first-hand, contemporaneous sensory perception or experience equivalent to the foundational requirements for a witness testifying under oath. Sanctions for violation are akin to **objection-sustained/strike-from-record**, rendering the assertion void *ab initio* for lacking the core constitutive element.
      *   **Allocation of Risk:** Speaker bears absolute epistemic risk. The hearer relies *because* the speaker meets the knowledge foundation. If the speaker lacks knowledge, the assertion fails procedurally, regardless of truth or sincerity.

  2.  **The Truth Norm:**
      *   **Legal Counterpart:** **Perjury Standard (18 U.S.C. § 1621) - Falsity Element.** Assertion requires the factual proposition asserted to be *objectively true in the world*. Sanctions for violation mirror **perjury conviction** – punishment for causing a specific harm (false statement under oath on a material matter). Sincerity or reasonable belief is irrelevant to the violation *if the statement is false*.
      *   **Allocation of Risk:** Speaker bears the risk of objective falsity. The hearer relies on the *factual accuracy* guaranteed by the norm. Violation is determined *ex post* based on the state of the world.

  3.  **The Reasonable Belief Norm:**
      *   **Legal Counterpart:** **Rule 11(b)(3) Certification (FRCP)**. Assertion requires that the declarant, *after an inquiry reasonable under the circumstances*, possesses evidentiary support likely to lead to admissible evidence sufficient to sustain the factual contention. Sanctions (**Rule 11(c)** motions) address breaches of this pre-assertion duty of reasonable investigation, irrespective of ultimate truth or subjective certainty. Focus is on the *process* leading to belief.
      *   **Allocation of Risk:** Speaker bears the risk of procedural unreasonableness in forming the belief. The hearer relies on the speaker having discharged this duty of reasonable inquiry. Violation exists even if the assertion is accidentally true.

  4.  **The Sincerity Norm:**
      *   **Legal Counterpart:** **Perjury Standard (18 U.S.C. § 1621) - Willfulness/Intent Element.** Assertion requires only that the declarant *believe the proposition to be true at the time of utterance*. Sanctions (**perjury conviction**) require proof of **willfulness** – the speaker's contemporaneous disbelief. Truth is irrelevant to the violation *if the speaker didn't believe it*. Materiality is a separate requirement.
      *   **Allocation of Risk:** Speaker bears *only* the risk of insincerity. The hearer relies *only* on the speaker's subjective honesty, not on the statement's truth, reasonableness, or knowledge basis. No duty of inquiry exists.

  **Residue Report: Friction Points & Untranslatable Elements**

  1.  **Exact Counterpart vs. Approximation:**
      *   **Knowledge Norm:** Has a **close but not exact counterpart (FRE 602)**. The friction lies in scope: FRE 602 applies narrowly to *testimonial evidence*, not all assertions. Philosophical "knowledge" is broader than FRE's "personal knowledge" foundation (e.g., inferential knowledge). Sanctions (exclusion) are procedural, not necessarily constitutive.
      *   **Truth Norm:** **Only approximate counterpart (Perjury's Falsity Element)**. Key friction: Perjury requires *both* falsity *and* willfulness/materiality. The pure truth norm sanctions *any* false assertion, regardless of intent or importance – no legal rule imposes liability *solely* for objective falsity without additional elements like intent, reliance, or materiality.
      *   **Reasonable Belief Norm:** **Closest Functional Counterpart (Rule 11(b)(3))** for *advocates' factual contentions*. This is the best fit conceptually. Friction: Rule 11 applies *only* to signed pleadings/motions/written advocacy, not everyday speech or even all testimony. Its standard ("evidentiary support...") is a procedural safeguard, not necessarily the *norm* governing assertion itself.
      *   **Sincerity Norm:** **Exact Counterpart exists (Perjury's Willfulness Element)**. The core requirement (contemporaneous belief) and sanction trigger (lack of belief) map directly. Friction: Perjury adds falsity and materiality requirements. The pure sincerity norm *only* cares about belief.

  2.  **Distortion Due to External vs. Constitutive Nature:**
      *   **Major Distortion:** Legal standards are **externally imposed regulatory/sanctioning mechanisms** on pre-existing speech acts (testimony, pleadings, affidavits). Philosophers debate whether one of these norms is **constitutive** – defining what an assertion *is*. Violating a constitutive norm means you didn't *really* assert, just made a noise resembling assertion (like moving a rook diagonally isn't chess). This concept is **inexpressible** in purely legal vocabulary. Legal sanctions punish *bad* assertions; constitutive norms define the *possibility* of asserting. Your framework inherently assumes assertion exists independently of the norms governing it.

  3.  **Inexpressible Philosophical Concepts:**
      *   **Assertion as a Distinct Speech Act:** The debate assumes "assertion" is a unique category (vs. guessing, opining, promising). Law focuses on *context* (testimony, pleading) and *consequences* (admissibility, sanctions, liability), not an abstract speech-act taxonomy.
      *   **The Constitutive Claim:** As above, the idea that a norm *defines* the practice, rather than regulates it, has no legal parallel. Law deals with regulative rules.
      *   **"Proper" Assertion vs. Sanctionable Assertion:** Philosophers distinguish asserting *incorrectly* (violating the norm) from not asserting at all. Law focuses solely on the sanctionable act within specific contexts. The idea of an assertion being "defective" *as an assertion* due to norm-violation, rather than merely unlawful or sanctionable, is foreign.

  4.  **Translation Failure: Limitation or Philosophical Indeterminacy?**
      *   **Primarily a Limitation of the Legal Framework:** The failure to translate the constitutive aspect reflects the law's inherent focus on *regulation, liability, and proof* within defined contexts, not abstract linguistic ontology. Law cares about *effects* and *provable violations*.
      *   **Sign of Philosophical Indeterminacy?** While the core concepts (knowledge, truth, belief, sincerity) are clear, the *claim* that one is constitutive is less determinate when forced into a framework built on sanctions and evidence. It highlights the challenge in empirically verifying the constitutive claim – it functions more as a theoretical postulate about meaning than a rule with observable sanctions. The legal analogues show that norms can function effectively (like Rule 11 or FRE 602) without needing to be constitutive.

  **Conclusion:** Your legal framework provides robust analogues for the *regulatory aspects* of the proposed norms, particularly Rule 11(b)(3) for Reasonable Belief and Perjury elements for Truth and Sincerity. The Knowledge Norm finds its closest, though imperfect, fit with FRE 602 foundations. The critical untranslatable element is the philosophical claim that one norm is *constitutive* of assertion itself. This isn't a flaw in your framework; it reveals the law's pragmatic focus on governing *performances* of speech within institutions, not defining speech acts in the abstract. The translation exposes that while the philosophical norms sound like legal standards, their foundational role in the *concept* of assertion remains a distinctively philosophical claim less amenable to legal evidence or sanction structures.
