prompt: |-
  Been stuck on the Friedman debate and I want a number off you rather than a survey of it. Set-up: call a model strongly F-twisted (the label's after Friedman, the "strongly" is mine) if you can write down a variant with descriptively more accurate assumptions — same target of prediction, parameters refitted as needed — that nevertheless predicts worse out of sample. So the unrealisticness is doing real work, not just going untested. His own instrumentalist defence only needs the weaker claim, that nobodys managed to show the accurate variant does better.

  So: what's your credence, 0–1, that at least one model in actual use in mainstream empirical economics today is strongly F-twisted? Decompose it for me — the probability that the kind of offsetting errors the story needs arise at all, the probability we could actually construct the descriptively better variant rather than merely imagine it, the probability the comparison comes out the way I've defined once you pin down what's being predicted and over which sample, plus whatever other terms you think belong. A rough number and one line of justification each, then show me how they combine and which term the final number is most sensitive to.

  And don't hide behind the decomposition at the end: tell me how confident you actually are in the number you land on, and single out the one piece of it you'd most expect to be wrong.
