  What's unsaid but implied is their desire for countermeasures. They'll want to know not just what this is, but how to fix it - perhaps through bylaw amendments creating independent interpretation authorities or requiring supermajorities for reclassification.
answer: |-
  This is a remarkably precise dissection of an insidious form of institutional erosion. Your instinct is correct: this isn't merely rights violation or vagueness, but a structural flaw in the *allocation of interpretive authority* over the entitlement itself. The phenomenon has several established touchpoints in legal and political theory, though no single term perfectly captures its entirety. Here's the carving:

  ### Core Concepts & Nearest Established Terms
  1.  **The Jurisdictional Loophole / Kompetenz-Kompetenz Problem:**
      *   **What it is:** The power to determine the scope of one's own power. Courts famously claim the authority to define their own jurisdiction (Kompetenz-Kompetenz). Your board is exercising a similar power regarding the scope of the "interior discretion" clause.
      *   **How your case differs:** Typically, Kompetenz-Kompetenz is a foundational, often necessary, power for a final arbiter (like a supreme court). In your case, it's an *unintended consequence* of an incomplete delegation. The bylaws granted the entitlement without specifying *who* defines "interior," "sole discretion," or "regulate." The board, as the default governing body, seized this interpretive void. It differs because the board isn't *supposed* to be the final arbiter of its own limits regarding interior spaces; the clause was meant to *remove* its authority there.
      *   **Edge:** This captures the *meta-authority* aspect – the board defining what falls inside/outside its own zone of non-interference.

  2.  **Procedural Entrenchment / Chilling Effects:**
      *   **What it is:** Protecting a substantive right by making it procedurally difficult to infringe upon it (entrenchment), or creating procedural burdens that discourage its exercise (chilling effects). Your board is doing the *opposite*: it's *eviscerating* a substantive right (*via* procedural burdens (the "determination" requirement) and financial disincentives (the surcharge).
      *   **How your case differs:** Standard chilling effects (e.g., costly litigation to enforce a right) are often side-effects. Here, the procedural/financial burdens *are the primary mechanism* for nullifying the right *without formally touching it*. The "exterior visibility surcharge" is a brilliant (and pernicious) example: the discretion remains "intact," but its exercise is taxed. The "determination" requirement transforms a right into a permission.
      *   **Edge:** This captures the *mechanism* of erosion (procedural/financial burdens) and the *effect* (making the right practically unusable).

  3.  **Erosion Through Reclassification / Definitional Creep:**
      *   **What it is:** Expanding regulatory reach by redefining categories or broadening definitions incrementally. Common in administrative law and bureaucratic overreach.
      *   **How your case fits:** This is the *primary tactic* employed. Tutoring -> Book Club -> Adult Son reclassify activities *out* of "interior discretion" by expanding definitions like "commercial use" or "lodging." "Exterior visibility" redefines the *boundary* itself ("interior" now includes anything visible from outside). It's a classic slippery slope enabled by interpretive control.
      *   **Edge:** This captures the *incremental process* and the *shifting of conceptual boundaries* rather than a frontal assault on the rule.

  4.  **The Liberal Paradox & the Indeterminacy of the "Self-Regarding" Sphere:**
      *   **What it is:** Sen's paradox shows individual liberties can conflict with collective preferences or Pareto optimality. Mill's harm principle struggles because defining the boundary between self-regarding and other-regarding actions is inherently contested and porous. Almost any action can have *some* effect on others.
      *   **How your case differs:** You rightly note there's no direct collision here. The issue isn't the *inherent difficulty* of drawing the line, but *who gets to draw it* and *how the process is structured*. The board exploits the *necessary* ambiguity at the edges of "interior" and "sole discretion" to systematically shrink the sphere, precisely because they control the interpretation *without* the constraints of formal amendment or a neutral arbiter. Mill assumes a neutral enforcer of the principle; your case shows the danger when the potential regulator controls the definition of the protected sphere.
      *   **Edge:** This highlights the *vulnerability* created by the inherent ambiguity at the boundaries of a protected sphere *when interpretive authority is misplaced*.

  5.  **The Problem of Constitutional (or Bylaw) Unamendability vs. Interpretive Override:**
      *   **What it is:** "Unamendable" clauses in constitutions try to protect core rights from being changed. However, if the *interpretive body* (like a court or, in your case, the board) can effectively nullify the right through reinterpretation, formal unamendability becomes hollow.
      *   **How your case fits:** Your interior discretion clause was *de facto* unamendable only in the sense that the board never formally amended it. Instead, they achieved the same result through reinterpretation/reclassification. It demonstrates how a right can be rendered meaningless without a formal amendment if the entity with an interest in restricting it controls its interpretation. The "cost" borne by the board (avoiding a formal vote) is near-zero.
      *   **Edge:** This captures the *structural equivalence* between formal amendment and interpretive override *in effect*, while highlighting the *lower procedural hurdle* for the latter.

  ### What the Phenomenon Consists In (Synthesis)
  **The core phenomenon is the *procedural erosion of a substantive entitlement through the uncontrolled exercise of interpretive authority over its scope by an interested party.** It consists of:**

  1.  **An Incomplete Entitlement:** A rule granting a right (sole discretion over X) without specifying:
      *   Who defines the boundaries of "X" (the protected sphere)?
      *   Who defines the boundaries of the right itself ("sole discretion")?
      *   The procedure for resolving disputes about scope.
  2.  **Interpretive Capture:** The governing body (with an inherent interest in maximizing its regulatory scope/power/stability/income) assumes the authority to interpret these boundaries.
  3.  **Reclassification as Tactic:** Using its interpretive authority to incrementally redefine activities or redefine the *boundaries* of the protected sphere (X), moving things *out* of the protected category ("commercial use," "lodging," "visible from outside") rather than directly regulating *within* it.
  4.  **Procedural/Fiscal Burdens:** Adding layers of process (requiring pre-approval "determinations") or cost (surcharges) to the *exercise* of the right, functionally discouraging its use while maintaining its nominal existence.
  5.  **Avoidance of Formal Amendment:** Achieving the functional equivalent of amending or repealing the right without triggering the (potentially higher) procedural hurdles, political costs, or scrutiny associated with formal bylaw changes.

  ### What It Is Not
  *   **Simple Rights Violation:** The board never directly enters a unit or issues a direct command violating the clause's *literal* prohibition ("may neither enter nor regulate it"). They work around it.
  *   **Mere Vagueness:** While ambiguity exists, the problem is the *exploitation* of that ambiguity by the interested party controlling interpretation. Perfect precision (e.g., defining "commercial use") might stop one tactic, but the board could simply invent *new* reclassifications or boundaries (like "exterior visibility").
  *   **Sen's Liberal Paradox:** No direct conflict between individual liberties exists. The conflict is between the individual's intended sphere of autonomy and the board's desire for control, mediated by the board's interpretive power over the sphere's definition.
  *   **Pure Tyranny of the Majority:** This isn't the board overriding the rule via majority vote *on the substance* (e.g., voting to ban book clubs). It's the board using its *procedural* and *interpretive* position to *sidestep* a direct vote on the rule itself.
  *   **Standard Regulatory Creep:** While similar, the unique element is the *specific target* – the redefinition of the very sphere meant to be *immune* from regulation, and the exploitation of the *gap* in the allocation of interpretive authority.

  ### Edges & Boundary Conditions
  *   **Single vs. Accretion:** A single, open reclassification *can* be the phenomenon if it fundamentally redefines the scope in a significant way (e.g., declaring "anything visible is not interior"). However, the *accretion* of smaller reclassifications is the more common and insidious pattern, making each step seem defensible while the cumulative effect is drastic.
  *   **Prevention of Harm:** If a reclassification *genuinely* and *provably* prevents *significant, direct harm* to other members (e.g., stopping an actual dangerous industrial activity in a unit), it might be a legitimate exercise of *other* powers (safety, nuisance clauses), even if it incidentally shrinks the "interior" sphere. The problem arises when reclassifications are pretextual, disproportionate, or target activities with minimal external impact (book clubs, adult children visiting) *primarily* to expand control or generate revenue (surcharge).
  *   **Can a Sphere Be Protected Without Protecting the Definition?** **No, not sustainably.** This is the fundamental insight. Granting an entitlement like "sole discretion over X" is *structurally incomplete* without also defining:
      *   **Who interprets "X"?** (A neutral third party? The member themselves, subject only to challenge for clear abuse/extremes?)
      *   **Who interprets "sole discretion"?** (What constitutes "regulation"?)
      *   **The burden of proof:** Does the board have to prove something falls *outside* the sphere to regulate it, or does the member have to prove it falls *inside* to be protected?
      *   **Amendment Difficulty:** Are there high hurdles (supermajority, member vote) to formally *redefine* "X" or "sole discretion" in the bylaws? Without these protections for the *meta-level* (who defines the scope), the substantive entitlement is vulnerable to the exact erosion you describe.

  ### The Established Term (or Lack Thereof)
  There isn't one universally accepted term capturing this *specific combination*. Legal scholars might describe it as:

  *   **"Erosion of substantive rights through procedural and interpretive capture"**
  *   **"The jurisdictional gap in self-limiting rules"**
  *   **"Reclassification as a tactic of de facto amendment"**

  The **closest single established concept is likely the problem of "Kompetenz-Kompetenz granted by default"** or the **"interpretive void"** in a rule meant to limit power. It shares strong DNA with critiques of administrative agency overreach through expansive interpretation and the challenges of making constitutional rights judicially enforceable against legislatures.

  ### Proposed Term & Definition
  Given the lack of a perfect fit, I propose the term:

  **"Procedural Encroachment via Interpretive Dominion" (PEID)**

  *   **Definition:** The systematic erosion of a substantive entitlement granted by rule, achieved by an interested governing body which, by default or design, holds unchallenged authority to interpret the scope and boundaries of the entitlement itself, and which utilizes this authority to reclassify activities, redefine boundaries, and/or impose procedural or financial burdens on the exercise of the entitlement, thereby functionally nullifying it without resorting to formal amendment of the rule.
  *   **Boundary Conditions:**
      1.  Existence of a rule granting a substantive entitlement with an intended protected sphere.
      2.  Ambiguity or silence in the rule regarding the allocation of interpretive authority over the sphere's boundaries and the entitlement's scope.
      3.  That authority defaults to, or is claimed by, a body with an interest in restricting the entitlement.
      4.  The body uses this authority primarily to shrink the protected sphere or burden its exercise through reclassification, boundary redefinition, or procedural/fiscal hurdles.
      5.  The effect is a *de facto* nullification or severe restriction of the entitlement without formal amendment.

  Your analysis is brilliant. You've identified a fundamental flaw in the design of self-governing documents: **a right without a protected definition and a protected interpreter is merely a suggestion.** The coop board's actions are a masterclass in PEID, demonstrating how easily a "guaranteed" freedom can be dissolved through the quiet control of its meaning.
