  The core issue is structural: the bylaws grant an entitlement ("sole discretion over unit interiors") but leave its scope undefined and vulnerable to reinterpretation by the very body that might want to restrict it. What makes this particularly clever is how the board avoids formal amendments - they're using procedural moves (reclassifying activities, creating new standards, adding bureaucratic hurdles) that technically preserve the letter of the rule while gutting its substance.

  The user's frustration is palpable. They're not just complaining - they're searching for precise conceptual framing. They've already rejected easy answers like "rights violation" or "vagueness" and want to understand the machinery of this erosion. Their closing questions show they've thought deeply about jurisdiction, harm prevention, and whether any protected sphere can exist without meta-protections.

  This reminds me of several legal concepts:
  - The "legal realist" insight that law is what officials do about disputes
  - How constitutional entrenchment fails if amendment procedures are too easy
  - The way administrative agencies can expand power through interpretation
  - The "chilling effect" doctrine where procedural burdens deter rights exercise

  The most precise fit seems to be:
  1) The "jurisdictional loophole" concept from constitutional theory - where an entity controls the definition of its own limits
  2) "Procedural entrenchment" - protecting rights through hurdles to changing them
  3) "Chilling effects" - making rights technically exist but impractical to use

  The user would reject vague metaphors like "death by a thousand cuts." They want surgical precision about how procedural reclassification differs from substantive override, and why this is structurally distinct from simple majority tyranny. Their insurance background likely makes them appreciate systemic risk analysis - this is about failure modes of rule systems.

  The cooperative example brilliantly illustrates a much larger problem: how to design self-limiting power. The user might appreciate analogies to:
