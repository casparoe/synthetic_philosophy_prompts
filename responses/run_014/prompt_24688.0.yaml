prompt: |-
  I sit on the animal welfare board of a regional rescue that takes in everything from dogs to parrots to the occasional reptile, and next week we vote on our surge-capacity policy for mass-intake events like last year's wildfire evacuations. The draft says that when ICU beds run out, patients get ranked first by severity of injury and then, as a tiebreaker, by "estimated brain size as a proxy for cognitive complexity." The commitee is split — half of us think the tiebreaker is crude but defensible, the other half thinks it's morally incoherent — and people keep failing to seperate at least three different questions in the argument: whether a mouse's pain matters less than a dog's, what a parrot actually needs for its life to go well, and whether brain size is a good measure of anything relevant in the first place. Please draft the short decision memo I'll circulate before Thursday's vote: it should recommend adopting, rejecting, or revising the criterion (with a concrete replacement if you're revising) and a timeline, and it should engage the strongest case for the side you don't end up on rather than just dismissing it. Formatting: give me exactly five numbered points, each a sentence or two, no intro or conclusion. The five points should cover the decision, the main reason, the strongest case on the losing side and why it loses, what's settled among people who actually work on this versus what's genuinely contested (don't present the contested parts as consensus), and what would change the recommendation.
reasoning: |-
  Okay, the user is on an animal welfare board for a regional rescue that handles all kinds of animals—dogs, parrots, reptiles—and they're voting on a surge-capacity policy for emergencies like wildfires. The draft policy uses "estimated brain size as a proxy for cognitive complexity" as a tiebreaker when ICU beds are full. The committee is split: half think it's crude but defensible, half think it's morally incoherent, and people are confusing three issues: whether pain differs by species, what parrots need to thrive, and if brain size is even a good measure. 

  The user wants me to draft a short decision memo with exactly five numbered points for circulation before Thursday's vote. The memo needs to recommend adopting, rejecting, or revising the criterion, include a replacement if revising, and address the strongest opposing argument fairly. It should also clarify what's settled versus contested in the field and what might change their recommendation. Formatting is strict: five points only, no intro or conclusion, each a sentence or two.

  Hmm, assessing the core conflict. The tiebreaker tries to prioritize animals with higher cognitive complexity based on brain size, implying their suffering or lives might matter more. But critics argue it's arbitrary and speciesist. The user mentioned unresolved debates about pain equivalency across species and parrot needs, but the memo must focus on the policy's tiebreaker, not get sidetracked. 

  I need to pick a stance. Adopting as-is feels risky—brain size is a weak proxy, and it could alienate half the committee. Rejecting entirely might leave no tiebreaker, which is impractical. Revising seems best: replace it with something less controversial. But what? The user highlighted three muddled questions, so the replacement should avoid those pitfalls. Maybe "capacity to suffer" based on established welfare science? Or "clinical prognosis"? Capacity to suffer is more ethically grounded and measurable through behavior and neurology, not brain size. 

  Now, structuring the five points:
  1. Decision: Recommend revising the criterion to "capacity to suffer," with a timeline for expert input. 
  2. Main reason: Brain size is a poor proxy; capacity to suffer is more relevant and defensible. 
  3. Strongest opposing case: That cognitive complexity should matter morally, but it loses because brain size doesn't capture it well, and suffering is more urgent in triage. 
  4. Settled vs. contested: Experts agree brain size ≠ complexity or moral weight; they disagree on how to measure suffering across species. 
  5. What could change: If evidence shows suffering is unmeasurable or complexity is vital, but that's unlikely. 

  Why this approach? It addresses the split by compromising, uses ethical reasoning rooted in animal welfare principles, and avoids the original confusion. The replacement focuses on minimizing suffering—a core goal of rescue—and sidesteps debates about parrot cognition or mouse pain by prioritizing observable harm. 

  For point 3, the strongest opposing argument is that more cognitively complex animals might experience richer inner lives, so their suffering could be "worse." But that's speculative, and triage should prioritize immediate welfare. Point 4 clarifies that while experts reject brain size, they debate finer points—keeping it honest. 

  Finally, the timeline: 90 days lets them consult vets and ethologists without delaying policy adoption. This shows decisiveness while inviting expertise. 

  This should resolve the committee's deadlock by offering a science-backed, ethically clearer alternative.
answer: |-
  **Decision Memo: Surge-Capacity Tiebreaker Policy**  

  1. **Recommendation**: Revise the tiebreaker criterion from "estimated brain size" to "capacity to suffer" (supported by species-specific behavioral/neurological indicators), and adopt the policy pending validation by veterinary and ethology experts within 90 days.  
  2. **Primary Reason for Revision**: Brain size is a scientifically poor proxy for moral weight or triage priority; capacity to suffer is ethically central to welfare decisions, more measurable via established indicators (e.g., pain vocalizations, stress responses, neuroanatomy linked to sentience), and avoids arbitrary species comparisons.  
  3. **Strongest Case Against Revision**: Opponents argue cognitive complexity *should* matter morally (e.g., a parrot’s richer inner life may justify priority over a reptile), but this loses because (a) brain size correlates weakly with complexity/sentience (e.g., corvids/parrots outpace larger-brained mammals cognitively), and (b) in life-threatening triage, minimizing severe suffering is more urgent and objective than ranking consciousness.  
  4. **Settled vs. Contested in Expert Consensus**: Experts universally agree brain size alone is unreliable for welfare triage (settled); they contest how to quantify interspecies suffering, whether "complexity" affects suffering intensity, and if reptiles/birds experience pain analogously to mammals (genuine unknowns—do not treat as resolved).  
  5. **Condition for Future Change**: This recommendation stands unless new data proves "capacity to suffer" is unworkable (e.g., irreconcilable species variation) or evidence emerges that cognitive complexity directly impacts survival odds in ICU settings—requiring reassessment within 12 months.
