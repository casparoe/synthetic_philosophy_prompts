answer: |-
  ### Interview Simulation: Civic Nationalist Philosopher Responds  
  *(Character: Committed defender of special obligations to compatriots, grounded in shared institutions, reciprocity, and political culture)*  

  **Your Question:** *Much of the case for special obligations rests on shared institutions... But climate change scrambles this. The emissions of my compatriots are now the chief threat to strangers... If shared institutions generate special obligations, doesn't shared causation of harm generate stronger obligations outward? Doesn’t this swallow patriotism?*  

  **Answer:**  
  You rightly identify that climate change imposes *negative duties* on us—duties not to harm others—which are universal and apply irrespective of borders. But this doesn’t negate the *positive obligations* created by shared institutions. The special claims among compatriots arise from a specific reciprocity: we jointly sustain institutions (like courts, schools, welfare systems) that actively shape our lives, and these require ongoing collective investment and sacrifice. This is distinct from the *unintended, aggregated harms* of emissions, which lack the deliberative, reciprocal character of institutional cooperation.  

  That said, climate change *does* create derivative obligations for states—but these flow from our institutions' capacity to *mitigate harm*, not from a dissolution of special ties. Our shared institutions are the very tools through which we address global harms, precisely because they concentrate power and accountability. To argue that causation overrides institutional bonds misunderstands political obligation: obligations arise from *sustained collective projects*, not transient causal links. If we owe strangers climate action (and we do), it’s because our institutions must uphold basic moral minima—not because strangers now belong to our "political community." The mechanism isn’t inverted; it’s instrumental.  

  **Pressure Point Note:** *If climate impacts directly destabilized our own institutions (e.g., mass migration collapsing social services), the *self-interest* of maintaining our polity might intensify obligations to outsiders—but this still wouldn’t erase the primacy of compatriot obligations. It would merely force their extension under duress.*  

  ---  
  ### Next Question? (I’ll remain in character as your civic nationalist interlocutor, adhering to your ground rules.)
