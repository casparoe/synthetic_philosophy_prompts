  Below is a decision tree designed to diagnose commitments on transworld identity (TWI) vs. counterpart theory (CT) using your specified concrete cases. The tree avoids jargon, prioritizes logical coherence, and assigns named positions only at the leaves. Haecceitism (whether non-qualitative "bare differences" between worlds are possible) is treated as a cross-cutting axis, tested in the bare-difference case. Positions covered: Lewis's CT, Kripke-style TWI, Plantinga's TWI, Adams-style TWI, modal fictionalism, plus "non-standard" leaves for coherent but unpopular/unexplored views. 

  For each leaf, I provide the position's name and the "single most awkward bullet" it must bite. Combinations that are coherent but unoccupied are flagged as "unattractive" (logically possible but rejected by most) or "unexplored" (no major defense in literature). Close leaves (where the tree may struggle to distinguish) are noted.

  ---

  ### **Decision Tree: Transworld Identity vs. Counterpart Theory**

  **Start with Q1.**

  #### **Q1: Hubert Humphrey case**  
  *When we say "Humphrey could have won the 1968 election," must this imply that the* actual *Hubert Humphrey himself (not just someone similar) exists in another world and wins there?*  
  - **Yes** → TWI is likely; go to Q2.  
  - **No** → CT or fictionalism is likely; go to Q5.  

  ---

  #### **Q2: Origin case**  
  *Could the actual Hubert Humphrey (or a specific table) have been born from different parents (or built from different wood), yet still be the* same *individual?*  
  - **No, same origin is required** → Go to Q3.  
  - **Yes, origin can vary** → **Leaf: Non-standard TWI (origin flexible)**.  
    - *Most awkward bullet*: Must deny that origins (e.g., your biological parents) are essential to who you are, making identity seem arbitrary or "replaceable."  
    - *Status*: Coherent but deeply unattractive (violates widespread essentialist intuitions; no major philosopher defends this).  

  ---

  #### **Q3: Bare-difference case**  
  *Imagine two worlds that are identical in every qualitative detail (same properties, relations, histories), but you're told they differ only in "who is who" (e.g., person A and B are swapped). Is this a meaningful difference?*  
  - **Yes, the swap matters** → Haecceitism true; go to Q4.  
  - **No, the worlds are identical** → Haecceitism false; **Leaf: Kripke-style TWI (via stipulation/direct reference)**.  
    - *Most awkward bullet*: Must accept that we can "stipulate" transworld identity (e.g., "Humphrey wins in W") even if no qualitative fact grounds it, risking incoherence if descriptions conflict.  

  ---

  #### **Q4: Fission case**  
  *In a world with two perfect duplicates (e.g., Everett branches or teleportation clones) both equally good candidates for "being you," must we pick just one as the* actual *you?*  
  - **No, neither or both can count** → **Leaf: Adams-style TWI (primitive thisness)**.  
    - *Most awkward bullet*: Must posit primitive "thisness" (haecceity) that has no basis in properties, making identity mysterious and ineffable.  
  - **Yes, one must be identical (pick a winner)** → **Leaf: Plantinga's TWI (individual essences)**.  
    - *Most awkward bullet*: Must claim unknowable "individual essences" exist (e.g., a unique property only you have), which are non-qualitative and inaccessible to us.  

  ---

  #### **Q5: Context-shiftiness case**  
  *Can the same pair of worlds count as containing "the same person" in one context (e.g., discussing careers) but not in another (e.g., discussing biology), depending on what we care about?*  
  - **Yes, context determines "sameness"** → Go to Q6.  
  - **No, sameness is absolute** → **Leaf: Non-standard CT (fixed similarity)**.  
    - *Most awkward bullet*: Demands a fixed, context-free standard of similarity for counterparts, which is too rigid to handle real-world modal talk (e.g., "Could I be a chef?" vs. "Could I be a robot?").  
    - *Status*: Coherent but unexplored (no prominent defender; Lewisian CT dominates).  

  ---

  #### **Q6: Fission case (revisited for CT)**  
  *In a fission world with two duplicates both equally "you"-like, must we pick one as your counterpart?*  
  - **No, both can be counterparts** → **Leaf: Lewis's counterpart theory**.  
    - *Most awkward bullet*: Forces all modal claims (e.g., "I could be rich") to be context-dependent, so truth varies with conversational interests.  
  - **Yes, only one can be your counterpart (pick a winner)** → **Leaf: Modal fictionalism**.  
    - *Most awkward bullet*: Must reduce possibility to "useful fictions," making claims like "Humphrey could have won" not literally true, just "true in the story."  

  ---

  ### **Summary of Leaves & Awkward Bullets**
  | **Leaf Position**                  | **Most Awkward Bullet**                                                                 |
  |------------------------------------|-----------------------------------------------------------------------------------------|
  | **Lewis's counterpart theory**     | Modal truths are context-dependent (e.g., "You could be a chef" true in one conversation, false in another). |
  | **Kripke-style TWI** (direct reference) | Identity across worlds is grounded in stipulation, not qualitative facts, risking arbitrariness. |
  | **Plantinga's TWI** (individual essences) | Requires unknowable, non-qualitative "essences" (e.g., a property only you necessarily has). |
  | **Adams-style TWI** (primitive thisness) | Identity is brute "haecceity" with no basis in properties, making it inexplicable. |
  | **Modal fictionalism**             | Possible worlds are not real; modal claims are merely "true in a fiction," undermining their objectivity. |
  | **Non-standard TWI (origin flexible)** | Allows you to have different parents yet be numerically identical, violating origin essentialism. |
  | **Non-standard CT (fixed similarity)** | Demands a rigid, context-free counterpart relation, ignoring how modal discourse actually works. |

  ---

  ### **Notes on Logical Space & Unoccupied Branches**
  - **Haecceitism as an axis**: Tested in Q3 (bare-difference). It cuts across TWI:  
    - Pro-haecceitist: Adams, Plantinga, and some Kripke interpretations (if they accept bare swaps).  
    - Anti-haecceitist: Kripke (as modeled here), Lewis (CT denies transworld identity, so haecceitism is moot), fictionalism.  
  - **Coherent but unoccupied combinations**:  
    - **Non-standard TWI (origin flexible)**: Coherent but deeply unattractive (denies origin essentialism; no major defense).  
    - **Non-standard CT (fixed similarity)**: Coherent but unexplored (Lewis's context-dependent CT is the standard).  
  - **Close leaves (potential misclassification)**:  
    - Kripke vs. Plantinga/Adams: If a pro-haecceitist Kripkean accepts bare differences (Q3: Yes) but rejects primitive thisness/essences, they might misclassify as Adams or Plantinga. To mitigate, Q4 fission forces a split: Kripkeans typically reject "pick a winner" in fission, while Plantinga/Adams require it.  
    - Lewis vs. fictionalism: Both deny Humphrey's transworld identity (Q1: No) and accept context-shiftiness (Q5: Yes). Fission (Q6) separates them: Lewis allows multiple counterparts; fictionalism requires picking one (or none).  
  - **Incoherent combinations**: None in the tree; all branches are logically possible.  

