  1. **Start at Q1** and answer based on intuition (not jargon).  
  2. Follow branches to a leaf.  
  3. Check the "awkward bullet" for your leaf—if it feels unacceptable, revisit earlier answers.  
  4. For haecceitism: Note your Q3 answer; it applies across leaves.  

  This tree isolates core commitments: whether identity requires numerical sameness (TWI vs. CT), whether context matters, and how to handle paradoxes (fission, bare differences). It covers all cases you specified, with Humphrey and fission doing heavy diagnostic lifting.
