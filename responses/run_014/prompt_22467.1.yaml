  First, I need to grasp their proposed solution. They suggest using "effective political control" as a procedural criterion to initially set the demos, then refining it democratically based on substantive interests. Their worry is whether this just moves the circularity or if the procedural criterion sneaks in substantive judgments. 

  Hmm, the key here is whether "effective political control" is truly neutral. The user might be concerned that this criterion isn't as procedural as it seems. For example, defining what counts as "control" involves political judgments. Think about occupied territories or colonial contexts—who has control there? That's messy. Also, enforcement mechanisms like borders rely on state power, which already implies a prior demos. 

  Then there's the point about the democratic refinement phase. Even after bootstrapping, including non-residents based on affected interests requires the existing demos to recognize those interests. That's tricky because those outside might have different perspectives. The user might not have considered how power dynamics here could skew the recognition of affected interests. 

  Looking at literature gaps, the user might be missing postcolonial critiques. Scholars like Spivak or Said question Western frameworks imposing legitimacy. Also, feminist perspectives on how marginalized groups' interests get overlooked even in inclusive systems. The procedural approach might assume a level playing field that doesn't exist. 

  Is the distinction between procedural and substantive doing enough work? It's useful for structuring the problem, but maybe it oversimplifies. Power relations are embedded in both criteria. The user could refine by acknowledging that the procedural criterion is a pragmatic starting point, not a neutral one, and address how historical injustices factor in. 

  They might also need to engage with the coercion-based alternatives mentioned, like Abizadeh's view on borders. Comparing their approach with others would strengthen their argument. 

  Overall, the user's solution is a good start but needs to confront the embedded substantive elements in "effective control" and address literature on power dynamics and historical contexts. Highlighting these points will help them refine their thesis and anticipate critiques.
answer: |-
  Your approach to the bootstrapping problem is thoughtful and engages with core tensions in the literature. Let's break down your concerns systematically:

  ### 1. **Does the "Procedural Criterion" Break the Circle or Merely Relocate It?**
  Your distinction between *procedural* (subject to political control) and *substantive* (interests impacted) affecting is analytically useful, but the circularity resurfaces in subtle ways:

  - **The Substantive Contamination of "Effective Control"**:  
    "Effective political control" (EPC) *appears* procedural but inherently relies on prior political judgments:  
    - **What constitutes "control"?** Is it territorial presence, coercive enforcement, or administrative reach? Deciding this requires normative assumptions about authority (e.g., Is military occupation "control"?).  
    - **Enforcement mechanisms** (borders, laws, sanctions) presuppose a prior demarcation of jurisdiction. As Abizadeh argues, border enforcement itself coercively affects outsiders, creating a substantive impact.  
    - **Historical contingency**: EPC often reflects past conquest, colonization, or unequal treaties. Treating it as neutral ignores how existing boundaries embed historical injustices (see Moore’s *Ethics of Secession*).  

  - **The Problem of Pre-Demos Authority**:  
    EPC assumes an entity *already exists* with the power to assert control. But who authorized *that* entity? This risks infinite regress (Whelan’s "boundary problem" critique). Your model uses EPC as a *de facto* starting point, but its moral authority remains contested.

  ### 2. **Key Objections in the Literature Your Framing Might Dodge**
  - **The Coercion Objection (Abizadeh)**:  
    If legitimacy requires justification to all coerced individuals, then border controls (which coerce outsiders) must be justified to *them*. Your procedural criterion excludes these outsiders *before* justification, violating the all-affected principle at the meta-level.  

  - **Dynamic Boundaries Problem (Goodin)**:  
    Even if EPC bootstraps an initial demos, substantive refinement requires continuous re-evaluation. Policies affect overlapping groups differently over time (e.g., climate decisions impacting future generations). Can a demos designed for static control adapt dynamically?  

  - **Epistemic Limits of the Demos (Lafont)**:  
    Your substantive refinement phase assumes the bootstrapped demos can accurately identify *who else* is affected. But insiders may systematically overlook outsiders' interests (e.g., colonial democracies excluding indigenous voices).  

  - **The "No Demos" Dilemma (Miller)**:  
    If shared identity is necessary for deliberation, EPC might include groups with irreconcilable values. Their inclusion could paralyze the refinement process, preventing boundary adjustments.

  ### 3. **Is the Procedural/Substantive Distinction Doing Enough Work?**
  - **Strengths**:  
    - Provides a pragmatic starting point for real-world polities.  
    - Avoids paralysis by accepting imperfect but actionable boundaries.  
    - Acknowledges democracy as iterative, not static.  

  - **Limitations**:  
    - **Moral Prioritization**: EPC privileges *status quo* power structures. Why prioritize control over, say, vulnerability to harm (Shapiro)?  
    - **Ambiguity in "Control"**: In globalized contexts (e.g., multinational corporations, climate treaties), "control" is fragmented. Who has jurisdiction?  
    - **Proceduralism as Disguised Substantivism**: As you suspect, EPC implicitly validates existing power relations. This isn’t inherently invalid, but requires explicit normative defense (e.g., "We accept EPC *not* because it’s neutral, but as a lesser evil among flawed alternatives").

  ---

  ### **Recommendations for Strengthening Your Framework**
  1. **Address the Coercion Critique Head-On**:  
     - Concede that EPC involves coercion but argue that *all* bootstrap criteria do. Defend EPC as minimizing justificatory burdens (e.g., by limiting initial demos to territorially concentrated groups).  
     - Integrate a "stakeholder test" *at the bootstrap stage* for those obviously coerced (e.g., occupied territories).

  2. **Refine "Effective Control"**:  
     - Adopt a **minimalist definition**: EPC = subjection to enforceable laws within a contiguous territory. Acknowledge this excludes contested zones (e.g., Western Sahara) as edge cases.  
     - **Hybridize with Capacity**: Follow Valentini in combining control with *capacity to provide public goods* to avoid including failed states.

  3. **Precommitment Mechanisms**:  
     - Argue that the bootstrapped demos can establish *procedural rules for boundary refinement* (e.g., independent courts to adjudicate "affected interests") *before* substantive debates. This reduces path dependency.

  4. **Engage Alternatives**:  
     - **All-Subjected Principle** (Song): Focus on subjection to laws, not interests. Contrast with your model.  
     - **Constitutive Stories** (Honig): Boundaries emerge from collective narratives, not procedures. Could your refinement phase incorporate this?  
     - **Feminist/Care Ethics** (Tronto): Prioritize inclusion based on vulnerability. Would this better handle transnational interdependencies?

  ---

  ### **Conclusion**
  Your procedural/substantive distinction **partially breaks the circle** by providing a workable starting point but **does not eliminate circularity entirely**. EPC covertly relies on substantive norms about legitimacy and coercion, and the refinement phase’s effectiveness depends on the demos’s willingness to recognize outsiders’ interests. However, this doesn’t invalidate your approach—it simply demands greater transparency about EPC’s normative baggage. 

  **Key move**: Defend your model not as *perfectly neutral* but as *procedurally fairer* and *more adaptable* than rivals. Emphasize its capacity for self-correction via substantive refinement, while acknowledging that all solutions to the boundary problem involve contested assumptions. The distinction remains valuable if framed as a dynamic process rather than a one-time fix.

  > *"The boundaries of the demos are not discovered; they are forged through practice and contestation. Your task is not to solve the paradox but to make it productive."* — Adapting James Tully
