prompt: |-
  Two of my oldest friends have been fighting about the French Revolution for years and it never gets anywhere. One is basically a Marxist — 1789 as a bourgeois revolution, class struggle all the way down, the Terror as a response to real threats. The other is a Furet-style revisionist — the Revolution was driven by political culture and ideology, the class story doesn't survive the evidence, and half of what happened was contingency and elite panic. I've been bugging them to do a proper adversarial collaboration and actually write something down together, and they finally agreed, sort of, except they want me to draft the skeleton and I want help.

  Draft the joint statement they should be able to sign. I want: the claims they can both accept about the events themselves (the fiscal crisis, the abolition of feudal privileges, the war from 1792, the Terror, the Directory); the disagreements stated precisely enough, and in wording each of them would actually endorse for his own side; the cruxes — I suspect one is whether the bourgeoisie's economic position explains the specific political forms the Revolution took (constitutional monarchy, then republic, then Terror) rather than just its timing, and another is whether the Terror was baked into the revolutionary ideology from the start or was a contingent product of war and factional accident, and they talk past each other on that constantly. For each crux, say what kind of evidence or argument both sides would agree bears on it — e.g. who actually sat in the assemblies and voted for what, or comparisons with other revolutions like 1848 — and write down each side's prediction in advance about what that evidence would show, so they can't back out later.

  Also, our group has this running half-joke that revolutions devour their children — Danton, Robespierre, the Russian analogues, you name it. Work out whether that saying comes out true, false, or "depends on the reading" on their two accounts, and whether they could agree on which.

  Format as a numbered agreed-claims section followed by a disagreements table. Keep the disagreements real — don't collapse into "it was probably a bit of both," that's exactly the fence-sitting they'd both refuse to sign.
reasoning: |-
  Okay, the user has a fascinating challenge. Two historian friends are stuck in a decades-long debate about the French Revolution - one Marxist, one Furet revisionist - and now they've agreed to collaborate if the user drafts a framework. 

  First, let's unpack their positions. The Marxist sees class struggle as the engine: bourgeoisie vs aristocracy, economic base determining political superstructure. The revisionist focuses on ideological contagion and contingency - how political culture spun out of control regardless of class interests. 

  The user wants three things: 
  1) Common factual ground on key events (1789 crisis, feudal abolition, war, Terror, Directory)
  2) Precise disagreements with testable predictions 
  3) Resolution of their "devour their children" joke

  Hmm... the trick is avoiding false compromise. Both sides hate "bit of both" solutions. Need steelman versions each would endorse. 

  For common ground: Can anchor on non-controversial chronology - fiscal collapse leading to Estates-General, August 4th abolition of privileges, radicalization post-Varennes. Both accept external war mattered, even if they disagree why. Directory's instability is universally acknowledged. 

  Core disagreements:
  - On revolution's drivers: Marxist says bourgeois class position necessitated specific political forms (constitutional monarchy → republic → Terror). Revisionist says ideology/political culture created its own logic. Crux: Assembly membership analysis. Marxist predicts bourgeois delegates consistently voting class interests; revisionist expects cross-class voting blocs based on ideology.
  - On Terror's inevitability: Marxist sees it as defensive class weapon against counter-revolution. Revisionist blames war panic and factional spiral. Crux: Early revolutionary rhetoric. Marxist will find consistent class-struggle language; revisionist will point to universalist claims later weaponized.

  "Devour their children": Clever test case! Marxist reads it as intra-class purging (bourgeois factions eliminating rivals). Revisionist sees it as ideological purity spirals. They might agree it "depends" - true mechanically but for different reasons. 

  Formatting challenge: The numbered agreement section needs watertight phrasing. For disagreements table, columns must reflect authentic positions - e.g. Marxist shouldn't feel his class analysis is diluted. 

  Biggest risk is over-smoothing. The draft must let their divergent theories shine while creating testable commitments. Hence specifying evidentiary cruxes upfront - assembly rolls, rhetoric analysis, comparative cases like 1848. 

  User's meta-goal is clear: End circular arguments by forcing empirical predictions. Smart. The "no backing out" clause suggests frustration with moving goalposts. 

  Final touch: Keeping their running joke as a playful but revealing coda. Shows this isn't just academic - it's about friends finding a way to engage productively.
answer: |-
  Here's a draft joint statement framework designed to force substantive engagement on core disagreements while anchoring them in agreed facts and testable predictions:

  **Agreed Historical Framework: The French Revolution (1789-1799)**

  1.  **Originating Crisis:** The Revolution was triggered by a profound fiscal crisis of the French monarchy exacerbated by structural inefficiencies, regressive taxation, costly wars (notably aiding the American Revolution), and the inability of the Estates-General system to resolve these issues effectively.
  2.  **Abolition of Feudalism:** The night of August 4, 1789, represented a decisive, transformative rupture. The National Constituent Assembly formally abolished the core legal and economic privileges of the nobility and clergy ("feudal rights"), dismantling the legal foundations of the *Ancien Régime*'s social order. This was driven by popular peasant uprisings interacting with elite political action.
  3.  **Radicalization Dynamics:** The Revolution underwent significant radicalization over time. Key inflection points include the failed flight to Varennes (June 1791), the outbreak of war with Austria and Prussia (April 1792), the storming of the Tuileries (August 1792), and the execution of Louis XVI (January 1793).
  4.  **The Terror (1793-94):** The period known as the Terror involved systematized political violence, mass executions, suppression of dissent, and centralized emergency governance primarily under the Committee of Public Safety. This occurred amidst external war, internal civil war (Vendée, Federalist revolts), severe economic crisis, and intense political factionalism.
  5.  **The Directory (1795-99):** The Thermidorian Reaction ended the Terror and established the Directory. This regime was characterized by chronic political instability, reliance on the army to suppress both Jacobin and Royalist opposition, unresolved financial problems, and endemic corruption, ultimately collapsing into the Brumaire coup.

  **Disagreements: Core Theoretical Divides & Testable Predictions**

  | Disagreement Area                     | Marxist Position (Endorsed Wording)                                                                                            | Revisionist Position (Endorsed Wording)                                                                                                | Shared Crux & Evidence                                                                                                                                    | Marxist Prediction                                                                                                                                 | Revisionist Prediction                                                                                                                                                                 |
  | :------------------------------------ | :----------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Primary Driver of Revolutionary Political Evolution** | "The specific political forms (Constitutional Monarchy, Republic, Jacobin Dictatorship/Terror) were necessitated by the bourgeoisie's struggle to consolidate its economic dominance against aristocratic reaction and popular demands, within the constraints of evolving class conflicts." | "The Revolution's political trajectory was driven primarily by the autonomous dynamics of revolutionary political culture, ideological radicalization, discursive conflicts, and contingent responses to events (e.g., war, royal betrayal), rather than the direct unfolding of pre-existing class interests." | **Crux:** Does the socio-economic profile (class position, wealth source) of deputies in key assemblies (Constituent, Legislative, Convention) predict their voting patterns on major issues defining each phase (e.g., veto powers, war, king's fate, Terror laws)?<br><br>**Evidence:** Quantitative analysis of deputy backgrounds linked to key votes; Comparison with other "bourgeois revolution" trajectories (e.g., 1848 Revolutions). | Deputies' voting blocs will strongly correlate with identifiable class/economic interests (e.g., bourgeois property owners consistently supporting measures securing property rights and limiting popular sovereignty as threats subside). | Voting blocs will cut across socio-economic lines, forming around ideological factions (Girondins/Montagnards) or contingent alliances driven by events; No consistent class-based voting pattern will emerge. |
  | **2. Origins & Necessity of the Terror** | "The Terror was the inescapable instrument of the revolutionary bourgeoisie, intensified by war but fundamentally required to crush the internal counter-revolution (aristocratic & popular) and secure bourgeois property relations against both feudal reaction and radical egalitarianism." | "The Terror emerged from a contingent confluence of factors: the existential pressures of total war, elite panic over disintegration, the logic of ideological purity inherent in Rousseauist sovereignty, and escalating factional conflicts. It was not the predetermined outcome of class conflict." | **Crux:** Does analysis of rhetoric, pamphlets, and club debates from 1789-1792 reveal the Terror's methods (e.g., virtue/terror duality, conspiracy obsession, pre-emptive violence) as inherent within dominant revolutionary ideology *before* the major crises of 1792-93? Or was it forged *in response*?<br><br>**Evidence:** Close textual analysis of key revolutionary discourse (Sieyès, Robespierre, Marat, club minutes) pre-1792 vs. post-1792; Comparative analysis of revolutionary violence genesis (e.g., English Civil War, Russian Revolution). | Core ideological elements justifying the Terror (sovereign will overriding law, conspiratorial worldview, equation of opposition with treason, virtue enforced by coercion) were present and developing in dominant revolutionary discourse well before 1792. | Pre-1792 discourse emphasized natural rights, constitutionalism, and popular sovereignty, but the specific logic and justification for systematic terror *as practiced* was largely forged *in response to* the extreme pressures of war, invasion, and revolt after mid-1792. |
  | **3. "Revolutions Devour Their Children"** | "The phenomenon reflects the inherent logic of class struggle within the revolutionary bloc. As immediate threats subside, the bourgeoisie purges its radical allies (Hébertists) and then its own compromised factions (Dantonists) to stabilize its rule, revealing the limits of bourgeois revolution." | "The 'devouring' results from the self-destructive escalation of ideological absolutism and factional conflict within the revolutionary political culture, fueled by the dynamics of suspicion, performative virtue, and the absence of institutional brakes, amplified by external pressure." | **Crux:** Does the pattern of purges (e.g., Girondins, Hébertists, Danton, Robespierre) show clearer alignment with *shifts in class alliances/power consolidation* or with *escalating ideological/factional dynamics and contingent power struggles*? | Purges systematically target factions representing challenges to stable bourgeois property relations (radical sans-culottes) or threatening elite cohesion through corruption/compromise. | Purges follow an escalating logic of ideological purification and pre-emptive defense against perceived betrayal, driven by factional maneuvering within a context of heightened fear, not coherent class strategy. |

  **Agreed Interpretation of "Devour Their Children":**
  *   **Both Agree:** The *literal phenomenon* (execution of prominent early revolutionaries by the revolutionary regime they helped create) is empirically true for the French Revolution (Danton, Desmoulins, Hébert, eventually Robespierre).
  *   **Disagreement on Meaning:** The Marxist interprets this as the *class logic* of bourgeois revolution revealing itself. The Revisionist interprets it as the *contingent outcome* of ideological and factional dynamics unleashed by the revolutionary process itself.
  *   **Joint Conclusion:** The saying holds **true as a descriptive pattern** ("depends on the reading" for *why*), but we fundamentally disagree on the underlying cause (Class Consolidation vs. Ideological/Factional Dynamics).

  **Mechanism:** By forcing agreement on core events *before* stating disagreements, and crucially by defining *shared, testable cruxes* with *specific predictions* each side must endorse *in advance*, this framework moves beyond circular debate. They must engage with concrete evidence each acknowledges as relevant. The "devour their children" section leverages their running joke to highlight the core theoretical split in a way that acknowledges the pattern while preserving the disagreement. The wording avoids fence-sitting by using each theorist's own conceptual language ("bourgeois property relations" vs. "ideological purity," "class struggle" vs. "contingency/factionalism").
