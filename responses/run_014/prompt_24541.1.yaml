answer: |-
  ### 1. The two confusions
  Your question conflates two distinct issues. First, you mistakenly equate **soundness** (every provable sentence is *true*) with **consistency** (no contradiction is provable). While soundness implies consistency, the converse is false: a system could consistently prove only false sentences in an incomplete theory. Second, you overlook **where the soundness proof is conducted**. Tarski’s theorem blocks a system from *internally defining* its own truth predicate, but it doesn’t prevent a *stronger external meta-theory* (like set theory) from defining truth for the weaker system and proving its soundness. Gödel’s theorem similarly forbids a system from *proving its own consistency internally*, not from having its consistency proved externally.

  ### 2. Consistency versus soundness
  **Consistency** is a syntactic property: no proof exists for both a sentence and its negation. **Soundness** is a semantic property: if a sentence is provable, it holds in every model (i.e., it is "true"). Crucially:
  - Soundness implies consistency: if all provable sentences are true, no contradiction (which is always false) can be provable.
  - Consistency does *not* imply soundness: a system could prove only false sentences (e.g., if its axioms are false but consistent).  
  Thus, soundness is strictly stronger. Claiming "provable implies true" requires both consistency *and* that axioms are true, making it a richer statement than mere consistency.

  ### 3. Where the soundness proof actually lives
  The soundness theorem for a system **S** (e.g., first-order logic) is proved in a **meta-theory M** stronger than **S** (e.g., ZFC set theory). **M** defines a truth predicate/satisfaction relation for **S**-sentences by:
  - Using sets to encode **S**-structures and assignments.
  - Defining "true in a model" inductively within **M**.
  Tarski’s theorem only forbids **S** from *defining its own truth predicate*; it doesn’t restrict **M** from defining truth *for* **S**. Similarly, Gödel’s theorem shows **S** cannot *prove its own consistency internally*, but **M** can prove **S**’s consistency (and soundness) by reasoning externally. The soundness proof in **M** is valid and non-circular—it leverages **M**’s resources to analyze **S**.

  ### 4. What is genuinely right in my question
  Your core insight is correct: **S itself** cannot establish its own soundness. If **S** could internally prove "every **S**-provable sentence is true," it could define its own truth predicate (since provability is syntactically definable) and prove its own consistency—violating both Gödel and Tarski. Thus, while a stronger **M** can prove **S** sound, **S** cannot verify its soundness *from within*. This limitation reflects the inherent incompleteness of sufficiently strong systems: **S** "knows" it cannot justify its own semantic correctness.
