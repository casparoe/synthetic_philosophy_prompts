answer: |-
  (4) If a person has a different genetic makeup from me, then that person is not me.

  This step looked fine initially because genetic makeup is a plausible candidate for fixing personal identity in discussions of origin essentialism, as it is a core physical aspect of one's origin and often seen as necessary for being the same individual (e.g., identical twins share genetics but are distinct persons, so different genetics might imply non-identity). However, rejecting this step allows you to maintain the weaker claim—that you could not have come from different parents—while abandoning the stronger claim that you could not have come from different gametes of the same parents. By rejecting (4), you deny that genetic constitution is essential to your identity, which breaks the link between gamete variation and non-identity. This means that even with different genetics from different gametes of the same parents, you could (in principle) still be the same person, as identity might depend solely on parental origin rather than genetic specifics. The weaker claim can then be defended independently through direct origin essentialism: argue that your identity is fixed by your actual parents, so in any possible world where you exist, you must originate from them, regardless of genetic details. This doesn't rely on the genetic principle in (4) and avoids entailing the stronger conclusion. Rejecting (4) thus decouples the claims, preserving the weaker one without committing to the stronger.
