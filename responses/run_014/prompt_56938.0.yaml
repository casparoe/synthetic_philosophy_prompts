  The user observes that both sides present the same evidence but interpret it differently. For example, the skeptic claims not to feel resentment but acts in ways that Strawsonians see as disguised resentment. The user suspects the deadlock comes from different criteria for defining resentment—phenomenology versus functional role. But they're open to other possibilities: maybe there's an empirical question about sustaining suspension, a clash over evidence types (first-person vs. third-party), or conflating two distinct issues (justifying practices vs. criticizing attitudes).

