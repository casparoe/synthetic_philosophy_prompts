  I'm reading through the assertion norm lit for quals and keep landing on Grice. His warant conditions — speaker believes p and has sufficient evidence — sit right in the the middle of the truth vs belief vs knowledge norm debate, but he died before Williamson's knowledge norm thing came out. What do you think Grice would've actually said about the knowledge norm? Would he accept it, or defend his warrant conditions as the right target and think knowledge is just too factive to be an assertion norm? Give me your best reconstruction with the reasoning he'd likely lean on.
