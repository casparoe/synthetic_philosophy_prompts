prompt: |-
  My friend and I spent an entire evening arguing about the prisoner's dilemma, and I want to settle whether he or the textbooks are right. His view is that game theory's claim that defection dominates in the one-shot prisoner's dilemma has been empirically refuted: Axelrod's tournaments showed that tit-for-tat was the winning strategy, and we know humans evolved to be cooperative, so a genuinely rational person cannot have most reason to defect against a stranger they will never see again. My questions: First, doesn't tit-for-tat's tournament victory prove that cooperation is the rational choice even in the one-shot case, so that the standard dominance reasoning only looks valid because it ignores evolution and the fact that real interactions are embedded in ongoing social life? Second, assuming he is right, how should I correct my own decision-making — should I stop defecting in genuinely one-shot interactions, and what bias-correction does the evolutionary evidence recommend? Please lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restatement of my questions.
reasoning: |-
  Okay, let me tackle this user's query about the Prisoner's Dilemma and their friend's argument. The user wants to settle a debate between their friend's view and textbook game theory. The friend claims that empirical evidence, like Axelrod's tournaments and human evolution, refutes the dominance of defection in one-shot scenarios. The user has two main questions: whether tit-for-tat's success proves cooperation is rational even in one-shot cases, and how to adjust their decision-making if their friend is right.

  First, I need to address the core conflict: standard game theory says defection is dominant in one-shot PD because no matter what the other player does, you're better off defecting. But the friend argues Axelrod's tournaments show tit-for-tat winning, which is cooperative, and that humans evolved to cooperate, so defection isn't rational even with strangers. 

  I recall that Axelrod's tournaments involved repeated interactions. Tit-for-tat works there because it allows for reciprocal cooperation. But in a true one-shot game, there's no future interaction, so retaliation isn't possible. So tit-for-tat's success doesn't apply to one-shot scenarios. The dominance of defection still holds in the classic one-shot PD. 

  Next, the evolutionary point. Humans did evolve to cooperate, but that's for repeated interactions where reputation and reciprocity matter. In a genuine one-shot with no future consequences, like interacting with a stranger you'll never see again, the evolutionary instincts might push towards cooperation, but rationally, defection still dominates. However, the user should consider if the situation is truly one-shot. Often, there might be hidden connections or reputational risks. 

  For the user's decision-making, they shouldn't stop defecting in real one-shot scenarios if the payoff structure is clear. But they need to assess if it's genuinely isolated. The bias-correction would involve recognizing when evolutionary instincts (like cooperating) might not align with the rational choice in strict one-shot games. But also, they should be cautious because misjudging a situation as one-shot when it's not could lead to defection backfiring. 

  The user might be looking for validation that textbooks are correct but also practical advice. Their deeper need is likely to resolve the argument with their friend confidently and adjust their own strategies appropriately. They might also be questioning when to trust instincts vs. rationality. Clarifying the distinction between repeated vs. one-shot is key here. Emphasizing that Axelrod's results don't invalidate the one-shot dominance but rather highlight the importance of context.
answer: |-
  **Bottom line: Your friend is conflating repeated and one-shot interactions; tit-for-tat's success relies on repetition, so the dominance of defection in a *true* one-shot Prisoner's Dilemma remains logically sound and not refuted by Axelrod or evolution, but you should be cautious about defecting in real life due to imperfect information and evolved instincts.**

  1.  **Tit-for-Tat (TFT) & Axelrod:** TFT won Axelrod's tournaments *specifically because they were repeated games*. Its success hinges on the threat of future retaliation (you defect next round if I defect now) and the promise of future reward (continued cooperation if we both cooperate). In a **genuine one-shot interaction**, where there is *no future*, TFT is irrelevant. Defecting cannot be punished later, and cooperating cannot be rewarded later. TFT would simply cooperate in the one-shot, which is strictly dominated by defection. Axelrod's results prove cooperation is rational *in repeated interactions*, not one-shot.
  2.  **Evolution & Cooperation:** Human evolution favoring cooperation is undeniable, but it supports the textbook view in one-shot scenarios, not refutes it. Evolution shaped us for *repeated interactions* within groups. Mechanisms like reputation, indirect reciprocity, and punishment for defectors evolved precisely because cooperation *isn't* the dominant strategy in isolated encounters. Our instincts often promote cooperation (like guilt, empathy) because in our ancestral environment, most interactions *weren't* truly one-shot – defectors could be identified and punished later. Evolution optimized us for repeated games, not for pure, anonymous one-shot dilemmas.
  3.  **Rationality & Defection:** Game theory's definition of rationality (maximizing individual payoff given the other player's possible actions) leads inevitably to defection in a true one-shot PD. The payoffs define dominance: whatever the other player does, your payoff is higher if you defect. Evolution might make us *feel* cooperating is "right" or lead us to cooperate instinctively, but that doesn't make defection *rationally* incorrect within the strict payoff structure of the one-shot PD. It makes defection *psychologically difficult* or *potentially costly in broader contexts* evolution didn't prepare us for (like anonymous online markets).
  4.  **Correcting Your Decision-Making:**
      *   **Don't blindly defect in "one-shot" scenarios:** Truly pure one-shot interactions are rare. Ask: Could there be reputational consequences (even indirect)? Is there any chance of future interaction? Are you sure about the other player's motives/payoffs? Your evolved instincts often warn you of hidden risks. Defecting carries significant risks of misjudging the situation as one-shot when it's not.
      *   **Bias-Correction Recommended by Evolutionary Evidence:** The evolutionary evidence suggests you have a *cooperation bias* shaped for repeated interactions. To correct for potential one-shot scenarios:
          *   **Actively Assess Context:** Consciously evaluate if the interaction is *genuinely* anonymous, isolated, and without future consequences *for both players*. If uncertainty exists, cooperating might be the safer bet to avoid unforeseen backlash.
          *   **Question Emotional Urges:** Recognize that feelings of guilt or a "duty" to cooperate are evolved impulses effective in repeated games. In a *verified* one-shot scenario with clear PD payoffs, these feelings might lead you astray from maximizing your payoff.
          *   **Focus on Payoff Structure:** Ultimately, rationality in the PD is defined by the payoffs. If you are certain it's a true one-shot with standard PD payoffs, defection *is* the payoff-maximizing move. However, the evolutionary evidence strongly cautions that such certainty is exceptionally hard to achieve in real life, making defection often a risky gamble.
