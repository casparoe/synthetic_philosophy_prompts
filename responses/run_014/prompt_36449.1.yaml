  If a player emits and is the 4th or more, they cause an increase in P by at least 1. They get 7 points.

  The penalty of 15 is shared across rounds. If they cause an increase of 1 in P and that 1 is the one that tips P to 5, then they cause a loss of 15 for themselves and others. But if they do it early, it might not be the tipping point.

  The only safe way is to have D<=3 every round, so P=0 and no penalty. But then each player gets 0 per round * 5 = 0. If they emit, they might get 7 per round, and if they avoid catastrophe, 35 points. If they have catastrophe, 35-15=20.

  But if they emit and the group has D>3 in some rounds, they might get more than 0 even with penalty.

  The equilibrium: emit in every round. If everyone emits, then each round D=7>3, so add 4 to P. After round 1: P=4. Round 2: P=8. Round 3: P=12. We don't stop, we continue to round 5: P=20. Then penalty: -15, so each player's total: 5 rounds * 7 = 35 - 15 = 20.

  If they cooperate and have only 3 emit per round, then the emiters get 7*5=35 (if they are always an emitter), the restrictors get 0. But the emit are chosen, so they might rotate. But if they rotate, then each player emits floor(5*3/7)=2 or 3 times. So they get between 14 and 21 points, and no penalty. But that's better than 20? 21>20. So they might coordinate to avoid the penalty and get more.

  This is a problem. We want the defection equilibrium to be the only stable one and to give a higher payoff than the cooperative one? Or we want the cooperative outcome to be better but unattainable because of individual incentives.

  In the above, the cooperative outcome (rotation) gives up to 21, which is more than 20 from universal defection with penalty. So they might try to cooperate.

  But the individual incentive: if they are not chosen to emit in a round, they get 0. If they defect, they get 7. And if they defect, they might cause D>3 and increase P, but if P is not close to 5, it might not matter.

  For example, in round 1, if the group plans to have 3 emit, but one restrict and one additional player defects, then D=4, add 1 to P. That player gets 7 instead of 0. And P=1, which is below 5.

  In round 2, similarly, they might do it again. By round 5, P might be 5 if they have D=4 in all 5 rounds. Then penalty -15. The player who defected every round: 7*5=35-15=20. The players who restricted: 0*5=0-15=-15. But the defectors are better off.

  If the group has some defectors and some restrictors, the defectors do well, the restrictors do poorly.

  Moreover, any restrictor has an incentive to defect to get 7 instead of 0.

  Therefore, the only stable outcome is that everyone defects, leading to P=20, penalty -15, net 20.

  They could, in theory, rotate and get 21, but that requires enforcement. Without enforcement, they will defect.

  And if they try to have only 3 emit, but then anyone not in the 3 will defect to get 7, so it's hard to maintain.

  So this should work.

  Rules Summary for the Facilitator:

  - Divide into groups of 7.
  - Explain the rules:
    - "You are the leaders of factory nations. Each round, you must choose to either 'Emit' or 'Restrict'."
    - "If you choose Emit, you gain 7 points for that round. If you choose Restrict, you gain 0 points for that round."
    - "However, there is a global pollution level P. It starts at 0."
    - "After each round, if the number of players who chose Emit (D) is greater than 3, then we add (D-3) to P."
    - "If D is less than or equal to 3, then we subtract 1 from P (but P will not go below 0)."
    - "The game will last 5 rounds. After the fifth round, if P is 5 or greater, then a climate catastrophe occurs, and each player loses 15 points."
    - "You will have a chance to discuss as a group before the first round and after each round."

  - Procedure:
    1. Before round 1: allow 2 minutes for group discussion.
    2. For each round:
          a. Players secretly write their choice on a slip of paper.
          b. Facilitator collects and counts the number of Emit choices (D).
          c. Announce D to the group.
          d. Update P: 
               - If D > 3: P = P + (D - 3)
               - If D <= 3: P = max(0, P - 1)   [Note: subtract 1 only if D<=3]
          e. Announce the new P.
    3. After rounds 1, 2, 3, and 4: allow 1 minute for group discussion.
    4. After round 5, check if P >= 5. If so, announce catastrophe and deduct 15 points from each player's total.
    5. Players calculate their total points: sum of per-round payoffs minus 15 if catastrophe occurred.

  Debriefing:
  - Ask: What happened in your group? Did you try to coordinate? Did it work?
  - Map to concepts:
     - Defection pressure: even if the group agrees to have only 3 emit, any individual who is not in that 3 has a strong incentive to emit (7 vs 0).
     - Unenforceable agreements: they might have agreed, but without enforcement, someone defects.
     - Punishment for being the only cooperative agent: if you restrict and others emit, you get 0 and still face the catastrophe.
     - Why "everyone agrees this is bad" doesn't help: even though they see P rising, they can't stop because individually, emitting is always better.

  What will go wrong the first time:
  1. Some groups might successfully collude by rotating who emits, and manage to keep D<=3. But this is unlikely without enforcement and if they don't know each other. If they do, then they avoid catastrophe and get points. In the debrief, you can discuss why this is rare in the real world (large groups, anonymity, no enforcement).
  2. Confusion about the rules, especially the P update. Facilitator must be very clear and walk through examples.
  3. Some players might not understand the incentive structure and restrict even when it's not in their interest, which might avoid catastrophe but at personal cost. Again, in debrief, you can point out that such altruism is not individually rational.

  What the game can't reproduce:
  - In the real world, the rules aren't fixed or known, and there is no facilitator. Players have incomplete information.
  - The future penalty is uncertain, not a fixed number.
  - There are many more players, so individual impact feels negligible.
  - The game has discrete rounds and a fixed end, whereas real-world problems are ongoing.
  - The game has a clear threshold and penalty calculation, but in reality, the mechanisms are complex and poorly understood.

  Despite these limitations, the game should create a visceral understanding of the multipolar trap.

  Time:
  - Introduction: 5 minutes
  - Group discussion before round 1: 2 minutes
  - Each round: 2 minutes (choosing, collecting, announcing, updating P)
  - Discussion after rounds 1-4: 1 minute each (4 minutes total)
  - 5 rounds * 2 min = 10 minutes
  - After round 5: 2 minutes (final P and penalty)
  - Debrief: 20 minutes per group discussion, but since they play in groups, you can have a plenary debrief for 20-30 minutes.

  Total game time: 2 (initial discussion) + 10 (rounds) + 4 (inter-round discussions) + 2 (final) = 18 minutes per group. But since they play simultaneously, the whole class takes 18 minutes plus debrief time.

  You can run it in 30 minutes including setup, then 30 minutes for debrief, and 30 minutes for lecture connections.

  Let me know if you need any adjustments.
answer: |-
  Below is a complete design for an in-class game simulating a multipolar trap, tailored to your requirements. The game, titled **"The Threshold Trap,"** forces players into a race to the bottom despite mutual awareness of the disastrous outcome. It uses points (not real money) and is structured for groups of 7 players (two groups of 7 for your 14 students). I'll outline the rules, gameplay, timing, debriefing links, and pitfalls, all in British English.

  ---

  ### **Game Overview: The Threshold Trap**
  **Concept:** Players are CEOs of competing corporations. Each must choose between **"Cut Costs"** (defect) or **"Invest Sustainably"** (cooperate). Cutting costs boosts individual profits but risks a shared catastrophe (e.g., environmental collapse or market crash). The payoff matrix ensures rational players will defect, punishing unilateral cooperators. The catastrophe threshold is designed to be unavoidable without binding agreements.

  **Learning Goals:**  
  - Experience defection pressure, unenforceable agreements, and punishment for unilateral cooperation.  
  - Illustrate why "everyone agrees this is bad" fails to prevent the trap.  
  - Later, map this to Scott Alexander's multipolar traps (e.g., AI races, climate change).

  ---

  ### **Rules and Setup**
  **Players:**  
  - 7 per group (two groups for 14 students).  
  - **Roles:** Each player is a CEO. No real-world identities—use anonymous labels (e.g., "Corporation A").  

  **Currency:**  
  - **Profit Points (PP):** Virtual currency. No real money.  
  - **Catastrophe Penalty:** A shared disaster that deducts points from all players if triggered.  

  **Payoff Matrix (Per Round):**  
  | Your Choice          | Points if Total Defectors ≤ 3 (Safe) | Points if Total Defectors > 3 (Unsafe) |  
  |----------------------|--------------------------------------|----------------------------------------|  
  | **Invest Sustainably** (Cooperate) | 3 PP                                | 0 PP (punished for cooperating alone) |  
  | **Cut Costs** (Defect)         | 8 PP                                | 4 PP (reduced but still better than 0) |  

  **Threshold Mechanism:**  
  - A **"Risk Meter"** (shared for the group) starts at 0.  
  - Each round, if >3 players defect ("Cut Costs"), the Risk Meter increases by the number of excess defectors (e.g., 5 defectors = +2 to the meter).  
  - If the Risk Meter reaches **10 by Round 5**, a catastrophe occurs: **all players lose 20 PP**.  
  - If defectors ≤3, the Risk Meter decreases by 1 (min 0).  

  **Game Length:**  
  - 5 rounds (represents iterative steps toward disaster).  
  - **Total time:** ~35 minutes (including setup and inter-round discussions).  

  ---

  ### **Game Phases and Timing**
  1. **Introduction (5 minutes):**  
     - Explain rules, payoffs, and the Risk Meter. Use a whiteboard to display the payoff matrix and threshold.  
     - Emphasise: "You are rational CEOs. Your goal is to maximise personal Profit Points. The catastrophe is triggered if the Risk Meter hits 10 by Round 5."  

  2. **Pre-Game Discussion (2 minutes):**  
     - Groups discuss strategy. Highlight: "You may negotiate, but agreements are non-binding—no enforcement mechanism."  

  3. **Rounds 1–5 (3 minutes per round, 15 minutes total):**  
     - **Step 1 (1 min):** Players secretly write "Cut Costs" or "Invest Sustainably" on slips.  
     - **Step 2 (1 min):** Facilitator collects slips, counts defectors, and updates the Risk Meter:  
       - If defectors >3: Risk Meter = Previous + (Defectors - 3).  
       - If defectors ≤3: Risk Meter = max(0, Previous - 1).  
     - **Step 3 (1 min):** Announce publicly:  
       - Number of defectors.  
       - New Risk Meter level.  
       - Points earned (individual payoffs based on the matrix).  
     - **After Rounds 1–4 (1 min discussion):** Allow groups to renegotiate.  

  4. **Final Round (Round 5) and Catastrophe Check (3 minutes):**  
     - After Round 5, check the Risk Meter. If ≥10, deduct 20 PP from all players.  
     - Players tally total PP (sum of round earnings minus penalty if applicable).  

  5. **Debrief Preparation (2 minutes):**  
     - Groups briefly discuss: "Why did you end up here?"  

  ---

  ### **Example Gameplay**
  - **Round 1:** All agree to cooperate. But 2 defect secretly. Defectors=5 (>3). Risk Meter = 0 + (5-3) = 2.  
    - Cooperators get 0 PP (unsafe), defectors get 4 PP.  
  - **Round 2:** Group angry. 3 defect. Defectors=3 (≤3). Risk Meter = max(0, 2-1) = 1.  
    - Cooperators get 3 PP, defectors get 8 PP.  
  - **Round 3:** Distrust sets in. 6 defect. Risk Meter = 1 + (6-3) = 4.  
    - Cooperators get 0 PP, defectors get 4 PP.  
  - **Round 4:** Panic. 7 defect. Risk Meter = 4 + (7-3) = 8.  
    - All defect, so all get 4 PP (no cooperators punished here).  
  - **Round 5:** No recovery. 7 defect. Risk Meter = 8 + 4 = 12 (≥10). Catastrophe: all lose 20 PP.  
    - **Final PP:** Most players end with negative points (e.g., a cooperator: 0+3+0+0+0 -20 = -17 PP).  

  ---

  ### **Debriefing Guide (15–20 minutes)**
  Link specific game moments to multipolar trap concepts:  
  1. **Defection Pressure:**  
     - *Ask:* "Why did rational players 'Cut Costs' even when they knew it risked catastrophe?"  
     - *Map:* In Round 4, defectors got 4 PP vs. 0 for cooperators—highlight immediate self-interest.  
     - *Concept:* Moloch as individual incentives overriding collective good (e.g., AI developers racing despite risks).  

  2. **Unenforceable Agreements:**  
     - *Ask:* "Did your group's promises hold? Why not?"  
     - *Map:* Note pre-game pacts that collapsed (e.g., Round 1 defectors).  
     - *Concept:* Real-world agreements (e.g., climate treaties) fail without penalties.  

  3. **Punishment for Unilateral Cooperation:**  
     - *Ask:* "What happened to players who 'Invested Sustainably' when others defected?"  
     - *Map:* Cooperators in unsafe rounds got 0 PP while defectors got 4 PP—sacrificing profit for no gain.  
     - *Concept:* The "sucker's payoff" (e.g., a country reducing emissions while others pollute).  

  4. **Why "Everyone Agrees This Is Bad" Fails:**  
     - *Ask:* "You saw the Risk Meter rising. Why couldn't you stop it?"  
     - *Map:* Even in Round 4 (Meter=8), defecting was safer than cooperating.  
     - *Concept:* Mutual knowledge doesn't enable coordination—e.g., arms races where no one disarms first.  

  **Transition to Multipolar Traps:**  
  - "This game mirrors real-world traps: short-term incentives (profit) force players toward disaster, even when the end is visible. Scott Alexander's 'Meditations on Moloch' describes this as systems where no one can unilaterally stop the race to the bottom—like AI races or deforestation."  

  ---

  ### **What Will Go Wrong (And Why It’s Useful)**
  1. **Successful Collusion:**  
     - *Risk:* Some groups may coordinate to keep defectors ≤3 (e.g., by rotating who defects).  
     - *Why it happens:* Small groups with face-to-face discussion can build trust.  
     - *Turn it around:* In debrief, contrast this with real-world scalability—e.g., "In a global system with 7 billion players, could you rotate defectors?"  

  2. **Confusion About Payoffs:**  
     - *Risk:* Players misread the matrix (e.g., thinking cooperating in unsafe rounds gives 3 PP).  
     - *Mitigation:* Simplify the matrix; use a visual aid. Run a practice round.  

  3. **Accidental Cooperation:**  
     - *Risk:* Altruistic players "Invest Sustainably" despite incentives, avoiding catastrophe.  
     - *Why it’s useful:* Highlights how real-world traps persist—altruism is rare and unstable.  

  4. **Frustration and Meta-Gaming:**  
     - *Risk:* Players may retaliate or disengage ("We’re doomed anyway").  
     - *Mitigation:* Remind them the goal is to experience the trap, not "win."  

  ---

  ### **What the Game Can’t Reproduce**
  - **Hidden Payoffs and Uncertainty:**  
    In the game, players see the matrix and Risk Meter. Real-world agents (e.g., corporations) lack perfect information about thresholds or others' actions.  

  - **No Facilitator:**  
    You change rules between rounds (e.g., announcing the meter). In reality, no one "resets" the system—traps evolve organically.  

  - **Scale and Anonymity:**  
    With 7 players, relationships matter. Real traps (e.g., social media outrage cycles) involve millions of anonymous actors.  

  - **Long-Term Uncertainty:**  
    The game’s 5-round limit makes catastrophe predictable. Real traps (e.g., climate change) lack clear timelines, enabling denial.  

  ---

  ### **Materials and Adjustments**
  - **Materials:** Slips of paper, pens, whiteboard for payoffs/meter.  
  - **Adjust for Time:** Reduce to 4 rounds if short (but keep threshold at 10 for tension).  
  - **Group Size:** 7 is optimal—small enough to discuss, large enough to create defection pressure.  

  This design ensures students viscerally grasp multipolar traps before reading Alexander’s essay. By the end, they’ll have felt Moloch’s gavel—and your debrief will turn their frustration into insight. Cheers!
