  ## Dialogue: The Unmarked Queue

  **Setting:** A seaside cafe patio overlooking the harbour. Nadia sips espresso, Owen nurses a pint. The pharmacy incident is fresh.

  **Nadia:** Owen, I’ve been replaying that pharmacy scene. It genuinely unsettles me. That tourist didn't just commit a faux pas; she violated a real, albeit local, moral obligation.

  **Owen:** Nadia, come now. Inelegant? Certainly. Rude, perhaps? Arguable. But morally *wrong*? That’s stretching convention thin. She wore metaphorical white trainers to a formal dinner – clumsy, not culpable. The only duties breached were possibly politeness, not morality. No harm intended, no deceit, no promise broken.

  **Nadia:** But she *harmed* that woman who waited longer! Five minutes stolen. More importantly, she undermined the entire cooperative scheme. That ‘ask who is last’ practice *works* because people trust others will participate. She took the benefit – prompt service – without contributing the minimal effort the scheme demands: asking the simple question. It’s free-riding.

  **Owen:** Five minutes? Is that the threshold of moral significance? A slight inconvenience, easily absorbed. As for free-riding: what "scheme" did she willingly join? She walked into a shop, unaware of an arcane local ritual. Can one be bound by rules one doesn’t know exist and never agreed to follow? That sounds more like entrapment than obligation. The baseline duties – don’t shove, don’t lie, don’t grab – weren’t touched.

  **Nadia:** That’s precisely where convention *creates* the duty! Without the convention, there’s no queue, no ‘turn’, no expectation. The practice defines the positions and the obligations attached to them. By entering that space seeking service, she implicitly entered a micro-social contract governed by *that place’s* norms for fair distribution. Ignorance might mitigate blame, but it doesn’t dissolve the duty itself. Would you say a tourist driving on the wrong side of the road commits no wrong simply because they didn’t know the local traffic laws?

  **Owen:** Driving laws are codified, state-enforced rules with clear, objective harms at stake – collisions! Queuing conventions are fluid, unwritten, and the harm here is vanishingly small subjective delay. Your social contract analogy is shaky. There was no ‘entering’; she was just *there*. More crucially, Nadia: **if the roles were reversed – if *she* was the one silently skipped while a local breezed to the counter – wouldn’t she rightly feel resentment? Doesn’t that resentment point to a perceived moral wrong, not just annoyance?**

  **Nadia:** Exactly! That resentment *is* the moral signal. She would feel wronged because she *was* wronged – her legitimate expectation of fair treatment, established by the convention, was violated. The convention creates the legitimate expectation, and breaching it *is* the wrong, even if the material harm is minor. The wrong lies in the unfairness, the disregard for the shared system enabling smooth cooperation.

  **Owen:** Resentment proves she’d *feel* wronged, not that she *was* objectively wronged. People resent all sorts of non-moral slights – being overlooked for praise, someone else getting the last croissant. Feelings aren't reliable moral compasses. The core issue remains: **how can a duty bind someone utterly unaware of its existence? How could she have possibly complied without psychic powers? Asking "who's last" isn't a universal moral imperative; it's a quirky local solution.** You’re holding her responsible for failing a test she didn’t know she was taking.

  **Nadia:** The duty arises from participating in the *situation*, not from prior knowledge. We navigate unfamiliar social terrains all the time, reasonably expected to observe and infer basic norms of fairness. Here, the norm *was* observable – others were clearly waiting, not clustered at the counter. A reasonable person might have paused, looked around, perhaps even asked, "Is there a line?" Her failure wasn’t malice, but a culpable lack of situational awareness in a cooperative context. The five minutes aren't the core; it’s the principle of taking a benefit secured by others’ adherence while flouting the rule yourself.

  **Owen:** "Culpable lack of awareness"? That’s harsh. She saw people waiting, sure, but nothing signaled an *invisible queue* governed by verbal markers. It looked like a loose waiting area. She acted as many would in countless similar shops worldwide. The ‘benefit’ was simply being served next by an available staff member – hardly loot plundered from a common treasury built by others' sacrifices. No one spoke up! **Why does the silence of the ‘wronged’ party matter? If it was truly a moral violation demanding correction, shouldn’t the woman have spoken? Does the lack of reproach lessen the wrong, or show it wasn’t perceived as such?**

  **Nadia:** The silence complicates blameworthiness, perhaps, but not the wrong itself. People often endure minor injustices without protest – out of shyness, conflict aversion, or, as here, knowing the tourist is oblivious and confrontation is pointless. Her silence doesn’t mean the tourist *didn't* jump the queue; it means she chose not to enforce her claim. The wrong occurred the moment the tourist was served out of turn, breaching the operative fair-access rule.

  **Owen:** And I maintain that ‘rule’ is morally inert convention. The only genuine wrongs here are perhaps the tourist’s mild thoughtlessness and the locals' failure to gently signal their system to an outsider – a failure of hospitality, not the tourist’s morality. She wore the wrong shoes, not a moral stain.

  **Nadia:** And I see it as a small but real tear in the fabric of social cooperation, enabled by a disregard for the local rules of fairness that bind that specific interaction. She took a place that wasn’t hers under the prevailing system.

  **Where the Dispute Rests:**

  *   **Nadia:** Concludes the dispute rests on whether socially established cooperative practices for distributing scarce goods (like service time) can generate *sui generis* moral obligations to participate fairly, binding on participants regardless of explicit consent or knowledge. The tourist's ignorance excuses her from *blame* but not from having *done wrong* by violating the fair-access principle instantiated by the convention. **To move her:** Owen would need to demonstrate convincingly that such conventions *cannot* create legitimate expectations of fairness that ground duties, or that the harm/principle breached is always reducible to, and insufficient without, universal duties like harm/deception.

  *   **Owen:** Concludes the dispute rests on whether moral obligations can arise purely from contingent, unknown local conventions without breaching fundamental, universal moral rules (harm, deceit, promise-breaking). He sees the tourist's action as, at worst, a non-moral social misstep. The resentment in a reversed scenario stems from frustrated expectation, not objective moral injury. **To move him:** Nadia would need to demonstrate that the unfairness inherent in free-riding on such a cooperative scheme constitutes a distinct kind of harm or wrong *independent* of the convention's specifics, or that unknowingly benefiting from others' rule-following while flouting the rule itself violates a fundamental duty of fairness applicable even without knowledge.
