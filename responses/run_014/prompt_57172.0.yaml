answer: |-
  ## Dissertation Fellowship Proposal

  The aim of my dissertation is to critically examine the scope and moral foundations of compromise in deep political disagreement, specifically challenging the prevalent model that frames compromise as a mutually advantageous exchange. While the "gains-from-trade" paradigm provides a powerful explanation for many compromises, I argue it relies on often-unacknowledged background assumptions regarding moral ownership and commensurability that break down in precisely the kinds of normatively fraught, identity-laden disputes that frequently motivate calls for compromise in diverse societies. My central research question is this: **For which classes of moral and political disagreement can compromise be legitimately justified *solely* by an appeal to mutual advantage (understood as gains-from-trade), and when does such an appeal implicitly presuppose a resolution of the underlying moral disagreement itself? Furthermore, when mutual advantage fails as a justification, what alternative normative structure (if any) can make compromise permissible or even obligatory?**

  Current philosophical treatments of compromise, while rich, leave this question inadequately addressed. The influential mutual-advantage tradition, drawing on social contract and bargaining theory, naturally emphasizes consent and mutual benefit as the core legitimizers of compromise. However, this approach typically presupposes a stable baseline of entitlements or endowments from which trade occurs, and assumes the goods exchanged are fungible within each party's value system – that preferences, interests, and commitments can be traded off against each other on a single metric. Opposing this, critiques grounded in the "dirty hands" literature or concerns about moral integrity powerfully argue that compromise can entail a morally corrupting abandonment of principle. Yet, these objections often focus on the *individual agent* compromising *their own* principles, rather than systematically analyzing the *structure of the disagreement* itself that makes the trade model problematic. Similarly, prominent liberal treatments view compromise as a second-best necessity under conditions of reasonable pluralism, a pragmatic response to irreconcilable differences. While insightful about the context, this view often sidesteps the specific question of *how* the act of compromise is normatively structured in different types of disagreement, particularly whether the "gain" received truly offsets the nature of the "cost" borne when fundamental commitments are involved.

  My approach moves beyond these existing frameworks by developing a more nuanced typology of deep disagreements and analyzing the structure of compromise within each type. Crucially, I will focus on cases where the parties contest not only the substantive outcome but also the very authority or jurisdiction over the disputed matter – where disagreements about "who decides" are intertwined with disagreements about "what is right." I propose to conduct detailed, philosophically rigorous case analyses of three paradigmatic scenarios: 1) A religious minority reluctantly accepting state funding for a practice it deems profoundly immoral (e.g., abortion, stem cell research) in exchange for securing exemptions for its own practices; 2) A climate burden-sharing agreement where nations accept differential responsibilities based on contested historical entitlements and capacity; 3) A transitional justice arrangement involving amnesty for perpetrators in exchange for truth-telling and reparations. These cases exemplify disputes where the "currency" of loss (e.g., complicity in perceived wrong, violation of core commitment, acceptance of contested historical responsibility) appears categorically different from the currency of gain (e.g., protection of community practices, economic benefit, stability, reconciliation).

  To rigorously analyze these cases, I will develop a semi-formal model distinct from standard bargaining theory. This model will explicitly maintain *two distinct value dimensions* for each actor: one representing their perceived *interests* (welfare, security, resources) and another representing their adherence to core *commitments* (principles, identities, moral duties). Crucially, gains and losses incurred in a compromise will be assigned to these dimensions separately, without assuming automatic fungibility or a single utility scale. The model will not predict outcomes but will serve as an analytical tool to test the coherence and implications of the mutual-advantage justification: Does positing a "net gain" require collapsing the distinct currencies? Does the compromise inherently validate one party's claim to authority over the disputed matter? Does it force one party to treat a matter of fundamental commitment *as if* it were merely a preference?

  This methodological choice – detailed case study illuminated by a focused conceptual model – is deliberate. Pure casuistry risks being insufficiently general, while a fully formal bargaining model inevitably imports assumptions about single-metric utility and fixed endowments that beg the central question. Conceptual analysis of "compromise" alone cannot capture the structural variations in different disagreement contexts. My dual-currency model, applied to concrete cases, allows me to isolate the specific mechanism by which the exchange model misfires.

  I anticipate the concern that distinguishing "commitments" from "interests" merely restates the well-known problem of value incommensurability within a bargaining framework. My response is twofold. First, while incommensurability is a necessary condition for the problem I identify, it is not sufficient. The deeper issue is the *pre-supposition of jurisdiction* inherent in framing the situation *as a trade* between parties presumed to have rightful control over what they are "giving up." Second, my hypothesis is that the failure of mutual-advantage justifications in these cases often stems not simply from the *magnitude* of the loss on the commitment dimension, but from the *nature* of the act demanded: specifically, that it requires one party to become *complicit* in what it perceives as a serious wrong perpetrated by others, an act distinct from merely suffering a loss. The model helps test whether "complicity" (understood as active concession validating the opposed action) explains the intuitive wrongness better than pure "loss."

  A successful dissertation would achieve two things: 1) Provide a clear characterization of the *types* of moral disagreements (likely involving contested jurisdiction and core identity commitments) where appeals to mutual advantage cannot, by themselves, justify compromise without circularity or presupposition; 2) Offer a positive diagnosis of the distinct normative structure that *can* potentially legitimate compromise in these "hard cases," shifting the focus from mutual gain towards concepts like avoiding greater complicity in enduring wrong, fulfilling duties of repair under non-ideal conditions, or the demands of provisional civic peace in deeply divided societies. Success would be evidenced by the model revealing structural features invisible to the single-metric view and generating novel, persuasive interpretations of the case studies. Failure would occur if the two-dimensional model inevitably collapses into a single metric under analysis, or if it fails to yield any significantly different normative verdicts or understandings than existing approaches applied to the real-world cases. Crucially, it would also fail if the "complicity" hypothesis proves indistinct from simple loss aversion or fails to capture the distinctive moral harm.

  To ensure feasibility within twelve months, the scope is tightly focused. I will limit myself to the three core case studies, developing the semi-formal model specifically to illuminate their structure rather than as a general theory of bargaining. The literature engagement, while necessary, will be targeted to establishing the gap my project fills concerning the presuppositions of the mutual-advantage model, rather than a comprehensive survey. The positive normative work will focus on diagnosing the problem and sketching the structure of an alternative justification within the cases, laying the groundwork for future, more expansive normative theorizing. This focused inquiry promises a significant contribution: a more precise understanding of when, and why, the familiar language of political deal-making masks deeper moral tensions that demand a different justificatory vocabulary.
