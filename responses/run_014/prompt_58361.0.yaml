prompt: |-
  After a semester of journal clubs on failed replications in social psychology and cognitive neuroscience, and after watching my own lab debate whether to ban p-values in favor of Bayes factors with default priors, I have become sympathetic to a strong diagnostic claim: that the replication crisis is fundamentally a frequentist artifact, in that reliance on null hypothesis significance testing, with its sharp thresholds, optional stopping in practice, and confusion of statistical with substantive significance, manufactured a literature of fragile positives that a routine Bayesian workflow — explicit priors, posterior intervals, and graded evidence — would have prevented from counting as discoveries in the first place.

  I want to pressure-test that diagnosis rather than rehearse its virtues. Suppose this Bayesian-switch story is wrong or overstated: what kinds of findings, arguments, or developments should I take as telling against it, and how should I weight them? Please lay out the considerations that would most seriously undermine the claim alongside those that would merely complicate it, including whether there are already known patterns — for instance, Bayesian analyses that replicate no better, ways that priors and Bayes factors can be gamed or can hide the same researcher flexibility, or cases where preregistered, high-powered frequentist work does replicate reliably — that its advocates should admit as genuine costs. I am especially moved by head-to-head comparisons and by demonstrations that the proposed cure preserves the disease under a new name, more so than by abstract philosophy of probability, and I would like to know what, if anything, the diagnosis uniquely predicts that rival explanations centered on incentives, theory weakness, or low base rates do not. Finally, give a candid judgment on whether defenders have rendered the claim effectively immune to counterevidence by retreating to a vaguer appeal to good research practices, and whether such insulation, if present, actually undermines this sort of methodological position.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're deeply involved in the replication crisis discussion, having engaged with journal clubs and lab debates about p-values versus Bayes factors. Their main point is that the replication crisis might stem from frequentist methods, and Bayesian approaches could prevent false discoveries. But they want to pressure-test that idea. 

  First, I need to identify their core request: they're seeking evidence that could undermine the claim that switching to Bayesian methods would solve the replication crisis. They want concrete counterexamples, not just abstract arguments. They mentioned head-to-head comparisons and cases where Bayesian methods also fail. 

  The user seems well-versed in methodology but wary of oversimplification. They’re sympathetic to the Bayesian argument but skeptical. Their deeper need might be to form a balanced view without ideological bias. They’re also concerned about the claim being unfalsifiable if proponents fall back to vague best practices.

  I should recall key counterarguments. For instance, there are studies showing Bayesian results don’t replicate better. Also, researcher degrees of freedom exist in Bayesian methods—like p-hacking, there's prior-hacking. Examples like the ego depletion controversy where both methods struggled could be relevant. 

  Then there's the issue of preregistered frequentist studies replicating well. If high-powered, strict frequentist designs work, that challenges the idea that frequentism itself is the root problem. Also, Bayesian methods can hide flexibility through prior choices, making it seem less transparent but equally manipulable.

  The user also wants unique predictions. If Bayesian advocates claim their method uniquely prevents certain errors, but incentives or low base rates explain failures equally well, that weakens the diagnostic claim. For example, if Bayesian studies in low base-rate fields still fail, it suggests the problem isn't just methodology.

  I should address whether the claim is insulated from counterevidence. Proponents might argue that any Bayesian failure is due to misuse, not the method itself. But that risks making the claim unfalsifiable. The user is likely concerned about this moving of goalposts.

  In conclusion, the strongest counterexamples are empirical studies where Bayesian methods didn't improve replication, cases of Bayesian p-hacking, and successful frequentist replications. The diagnosis might be overemphasized when other factors like incentives are more central. The unfalsifiability point is valid—defenders need to specify what would count as evidence against their claim.
answer: |-
  Your skepticism is well-founded. The "Bayesian switch" narrative offers a compelling methodological diagnosis, but it risks becoming a just-so story if not rigorously tested. Here's a breakdown of evidence and arguments that undermine or complicate it, categorized by severity:

  ### **Strongly Undermining Evidence (Challenges Core Diagnostic Claim)**
  1.  **Bayesian Replication Failures:**
      *   **Evidence:** Studies directly comparing replication rates of findings originally published with NHST vs. Bayesian methods (using default or reasonable priors) showing **no significant difference** in replicability. *Example:* Reanalysis of "landmark" social psych studies using Bayes Factors often yields inconclusive (BF ~1) or weak evidence (BF 3-10) for the original effects, mirroring frequentist replication failures.
      *   **Weight:** High. Directly contradicts the claim that Bayesian workflow *prevents* fragile positives from counting as discoveries. Shows the fragility often lies in the underlying effect or research practices, not solely the statistical paradigm.

  2.  **"Prior-Hacking" & Researcher Degrees of Freedom:**
      *   **Evidence:** Demonstrations that Bayes Factors are highly sensitive to prior choices, and that researchers can "shop" for priors (or hyperparameters in hierarchical models) to achieve desired levels of evidence (e.g., BF > 3 or > 6). This parallels p-hacking. *Example:* Simulation studies showing how tweaking the scale parameter of a default Cauchy prior can turn an inconclusive BF into a "substantial" one for the same data.
      *   **Weight:** High. Shows the "gaming" problem isn't eliminated; it's transformed. Explicit priors are only a safeguard if chosen *a priori* and justified, which faces the same practical pressures as preregistration in NHST.

  3.  **Successful High-Quality Frequentist Replication:**
      *   **Evidence:** Existence of large-scale, preregistered, high-powered frequentist replication efforts (e.g., Many Labs projects, OSF Registered Reports) that **do** reliably replicate robust effects (e.g., classic cognitive biases, basic perceptual phenomena). This demonstrates that rigorous *implementation* of frequentist methods *can* produce reliable findings.
      *   **Weight:** High. Directly counters the idea that reliance on NHST *fundamentally manufactures* fragile positives. It shows that NHST *in the context of poor practices* (low power, flexibility, lack of preregistration) is the core problem, not NHST itself when applied rigorously.

  ### **Complicating Evidence (Challenges Exclusivity & Scope)**
  4.  **Incentives & "Hacking" as the Root Cause:**
      *   **Argument:** The primary driver of the crisis is the incentive structure (publish or perish, novelty bias, lack of reward for replication) and resulting researcher behaviors (p-hacking, HARKing, selective reporting), which exist *independently* of the statistical paradigm. Switching to Bayes changes the *tools* for hacking (priors, stopping rules based on BF), not the underlying motivation. *Evidence:* Persistence of questionable research practices in fields adopting Bayesian methods; the rise of "Bayesian p-hacking" discussions.
      *   **Weight:** Moderate-High. Undermines the claim that the crisis is *fundamentally a frequentist artifact*. It suggests Bayesian methods, under current incentives, are vulnerable to the same disease under a new name ("BF-hacking").

  5.  **Low Base Rates & Theory Weakness:**
      *   **Argument:** Many fields in social/neuro psychology investigate inherently noisy phenomena with low true effect sizes and weak, underspecified theories. *No statistical method* can reliably find true signals in high noise with vague priors (frequentist or Bayesian) without massive samples. The core problem is scientific immaturity, not statistics. *Evidence:* Meta-research showing low statistical power and high heterogeneity even in well-conducted studies; failures of theoretically derived informative priors to improve predictions.
      *   **Weight:** Moderate. Complicates the diagnosis by showing the Bayesian "cure" (graded evidence, priors) might be insufficient if priors are weak/vague and true effects are tiny/non-existent. It doesn't absolve NHST flaws, but shows Bayes isn't a panacea.

  6.  **The "Garden of Forking Paths" Persists:**
      *   **Argument:** Bayesian analyses still involve myriad researcher choices: model specification (likelihood, link functions, random effects structure), prior families and parameters, handling of missing data, transformations, etc. Flexibility in these choices *after* seeing data can inflate evidence, similar to the frequentist "garden of forking paths." Preregistration is equally crucial for Bayes.
      *   **Weight:** Moderate. Shows researcher flexibility isn't eliminated by switching paradigms; it just moves. The core need is for pre-specification and transparency, regardless of statistics.

  7.  **Computational Complexity & Accessibility:**
      *   **Evidence:** Poorly specified models, convergence failures in MCMC, misinterpretation of posterior intervals/Bayes Factors, and difficulty in specifying genuinely informative priors are common hurdles, potentially leading to *worse* or *more misleading* inferences than simple, well-understood (if flawed) NHST in the hands of average researchers.
      *   **Weight:** Moderate-Pragmatic. Doesn't undermine the theoretical argument, but complicates the practical claim that a *routine* Bayesian workflow would prevent problems, as the routine workflow itself may be error-prone without significant training and computational resources.

  ### **Unique Predictions & Rival Explanations**
  *   **What the Bayesian Diagnosis Uniquely Predicts:** If correct, we should see:
      1.  A significant reduction in published effect sizes upon widespread Bayesian adoption (as weak effects wouldn't reach BF thresholds).
      2.  Published Bayesian findings demonstrating *higher* replication rates than historical NHST findings *from the same field/lab*, even controlling for improved practices (power, prereg).
      3.  Less sensitivity to stopping rules in Bayesian analyses compared to NHST p-values.
  *   **Rival Explanations (Incentives/Theory/Base Rates) Predict:** Improvements in replicability should correlate most strongly with:
      1.  Adoption of *any* rigorous practices (prereg, high power, transparency) *regardless* of statistical paradigm.
      2.  Shifts in fields towards studying more robust phenomena or developing stronger theories.
      3.  Changes in incentive structures (rewarding replication, robustness, open science).

  **Head-to-head comparisons favoring rivals:** Evidence showing that adopting rigorous frequentist practices (prereg + high power) improves replicability more than switching to default-prior Bayes *without* those practices, or showing that replicability is similar between rigorous-NHST and default-Bayes studies, strongly favors the rival "incentives/practices" explanation over the "fundamental frequentist flaw" diagnosis.

  ### **Immunity to Counterevidence?**
  1.  **The Risk of Insulation:** Yes, there's a significant risk. Defenders can retreat to:
      *   **"Not Real Bayes":** Any failed Bayesian replication or instance of hacking is dismissed as not using *proper* Bayesian methods (e.g., "they used bad/default priors," "they didn't preregister," "they misinterpreted the BF").
      *   **Vagueness of "Good Practice":** Collapsing the argument into "Bayes encourages better practices" (priors=thinking, posteriors=continuous) makes it indistinguishable from the broader "improve research practices" solution, robbing the *fundamental frequentist artifact* claim of its specific meaning and testability.
  2.  **Does it Undermine the Position?**
      *   **Yes, if unfalsifiable:** If *no* empirical pattern (like Bayesian replication failures) can falsify the strong diagnostic claim because it's always attributed to "misapplication," the claim becomes non-scientific dogma.
      *   **No, if refined:** It pushes the position towards a more nuanced, *prescriptive* claim: "Bayesian methods, *when implemented with specific safeguards* (genuinely justified priors, preregistration, model checks, transparency), offer advantages *over common misapplications of NHST* in mitigating certain specific flaws (dichotomous thinking, misinterpretation of p-values, ignoring power)." This is less sweeping but more defensible.

  **Candid Judgment:**

  The strong claim ("fundamentally a frequentist artifact") is **overstated and likely false as the primary or sole cause.** The evidence points strongly towards **incentives and poor research practices as the root cause**, with **low base rates and weak theory** as major contributing factors. NHST's flaws (dichotomania, p-hacking vulnerability) are potent *enablers* of the crisis within this toxic environment, but they are not the *sine qua non*. Bayesian methods, *under the same incentives and without stringent safeguards*, are demonstrably vulnerable to analogous forms of hacking ("prior-hacking", BF-hacking) and produce fragile positives at comparable rates in head-to-head comparisons. The strongest evidence *for* the Bayesian position is its **potential for more nuanced interpretation** (posterior distributions, graded evidence) and its **formal requirement to specify priors** (which *can* improve theoretical grounding), but these are advantages within a broader solution requiring systemic change in incentives and practices, not a magic bullet replacing them.

  **Pressure Test Passed?** Your diagnosis likely identifies significant *contributing factors* and *desirable improvements*, but framing the replication crisis as *fundamentally* a frequentist artifact doesn't withstand the counterevidence focusing on incentives, researcher degrees of freedom persisting under Bayes, and the replicability of rigorously conducted frequentist work. The strongest counter is the demonstration that Bayesian workflows, as commonly implemented (even with defaults), **do not reliably produce a more replicable literature** under current scientific pressures.
