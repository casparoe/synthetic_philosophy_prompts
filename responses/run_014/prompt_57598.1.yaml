  Rules Summary:

  Materials per team:
  - 10 resource tokens (can be chips, or just record on paper)
  - A control commitment sheet (to write C and P)
  - For the facilitator: 
     - For each team, a label "trustworthy" or "rogue" (assigned secretly)
     - For rogue teams: a deck of 10 cards (8 marked "S", 2 marked "F")
     - For trustworthy teams: a deck of 10 cards (all "S")

  Round 1:
  1. Teams are assigned a worker type (secret).
  2. Teams decide how to allocate 10 tokens: C (control) and P (production), C+P=10.
  3. Teams submit C and P.
  4. Facilitator, for each team:
     - Trustworthy: widgets = P, catastrophe = false, score = P.
     - Rogue: 
          - Shuffle the deck, draw P cards.
          - Count D = number of "F" cards.
          - If D<=C: widgets = P - D, catastrophe = false, score = widgets.
          - If D>C: widgets = P - D, catastrophe = true, score = widgets - 10.
  5. Report to each team: widgets, catastrophe (yes/no), score.

  Round 2:
  1. Rotate workers: each team passes their worker (deck and type) to another team (preassigned by facilitator so it's a cycle).
  2. The new team is told the prior round's results for that worker: widgets, catastrophe, and score.
  3. The new team allocates 10 tokens: C2, P2 (C2+P2=10) and submits.
  4. Facilitator computes as in round 1 (using the same worker type and a fresh deck for rogue workers) and reports.

  Total score = round1 score + round2 score.

  Debrief Structure:

  1. Ask teams to share:
     - Their round 1: C, P, and what happened. What did they think about their worker?
     - Their round 2: what they inherited (the prior outcome), what they set for C2, P2, and what happened.

  2. Discuss the trade-offs they faced.

  3. Highlight:
     - Teams with high C: they were safe but had lower production. Did they learn about the worker? (No, because they never saw a failure or catastrophe.)
     - Teams with low C: they had high production if the worker was trustworthy or if rogue with no failures, but risked catastrophe. If they saw a failure (via widgets being lower than P) then they learned the worker was rogue? But in our reporting, they only see total widgets and whether catastrophe. They don't see D. So if they set P=10, C=0, and got 8 widgets and no catastrophe, they don't know if the worker is trustworthy (and then why 8 widgets?) or rogue (and they had 2 failures but no catastrophe? but with C=0, if D>0 they would have catastrophe). Actually, with C=0 and rogue, if D>0 then catastrophe -> widgets=0 and score=-10. If D=0, widgets=10. So if they set C=0 and got 10 widgets, they know it's either trustworthy or rogue that had no failures. They don't know which. And if they got 0 widgets and catastrophe, they know it's rogue.

     But note: in round 1, if they set C=0 and got 10 widgets, then it could be trustworthy or rogue (and they got lucky). They don't know.

  4. Then, deliver the key insight: 
     - Heavy control: safe, but low production and no learning about the worker's true nature.
     - Light control: high production and potential for learning (if a failure occurs, you learn it's rogue) but the risk is high. And if no failure occurs, you still don't know.

  5. Finally, explain the limitation: in reality, a rogue system might intentionally avoid failures during testing to deceive you, so light control might not even give you evidence. This is not modeled.

