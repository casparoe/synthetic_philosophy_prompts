prompt: |-
  My reading group has been stuck for months between a consciousness illusionist -- the person who thinks phenomenal consciousness is a user illusion, a self-model the brain builds that misrepresents itself as having experiences -- and a realist who thinks the hard problem is real and that there really is something it is like to be the system. Write the doc they should of produced after a serious adversarial colaboration: the claims both can sign (about the cognitive architecture, about what the 'user illusion' label commits one to, about what the explanatory gap argument actually says); the exact formulation of where they still disagree, phrased so each side would accept the wording of their own view; and the cruxes -- the sub-questions such that settling them would move at least one side. I suspect one crux is whether the agency analogy transfers: the illusionist's best case is that we also have a 'user illusion' of being the agent of our own actions, a post-hoc construction, but the realist replies that even if agency is a misattribution, there is a real experience of agency, so the illusion move only shows that our self-model is misleading, not that there's no experience. Another crux I suspect is whether the illusionist owes a harder explanation than the realist: if the self-model represents itself as having experiences, what explains that representational content without circularity? For each crux, give a concrete case or argument both would agree bears on it -- blindsight, Charles Bonnet syndrome, or a functional duplicate that reports 'nothing' -- with each side's prediction written down in advance. Also: what would each count as evidence or argument against their own view, and if you conclude part of the dispute is verbal, say which part and why -- I think it might be that they are using 'phenomenal consciousness' to mean different things (intrinsic qualitative character vs. a self-representational structure) and arguing past each other. Format: numbered agreed claims, then a disagreement table with a cruxes section.
reasoning: |-
  We are writing a document for a reading group that has been stuck between an illusionist and a realist about phenomenal consciousness. The goal is to produce an adversarial collaboration report that captures agreed claims, the exact points of disagreement, and the cruxes that could settle the debate. 

  **Agreed Claims (Both Sides Sign Off):**

  1. **Cognitive Architecture**: Both agree that the brain constructs a self-model that includes representations of the system's own states and processes. This model is used for metacognitive functions, such as monitoring, reporting, and controlling cognitive and perceptual processes. The self-model is a functional component of the brain's information processing.

  2. **The 'User Illusion' Label**: The term 'user illusion' refers to the idea that the self-model is a simplified, user-friendly interface that may misrepresent the underlying non-conscious neural processes. Both agree that this model is not a direct reflection of the neural mechanisms but is a constructed representation that serves adaptive purposes (e.g., efficient decision-making, social coordination). The illusionist holds that this model is a misrepresentation in the sense that it portrays the system as having phenomenal experiences when in fact there are none (only non-phenomenal information processing). The realist agrees that the self-model is constructed and may misrepresent the underlying mechanisms, but maintains that the model itself (or the processes it represents) possesses genuine phenomenal properties.

  3. **The Explanatory Gap Argument**: Both agree that the explanatory gap argument points to the difficulty of explaining how physical processes in the brain give rise to subjective experiences (qualia). The illusionist interprets this gap as evidence that our introspective model of consciousness is an illusion, because it misrepresents the physical processes as having non-physical properties (qualia). The realist interprets the gap as indicating that current physicalist explanations are incomplete and that there is a real, non-illusory phenomenon that needs explanation.

  4. **Empirical Evidence**: Both agree on the relevance of empirical cases such as:
     - **Blindsight**: Patients can respond to visual stimuli without reporting any conscious experience. Both agree that this shows a dissociation between functional processing and the self-reported awareness.
     - **Charles Bonnet Syndrome**: Individuals have vivid visual experiences (hallucinations) without corresponding external stimuli. Both agree that this demonstrates the brain's capacity to generate perceptual experiences independently of sensory input.
     - **Functional Duplicates Reporting 'Nothing'**: Both agree that if a functionally identical system (e.g., a perfect computational replica of a human brain) were to report "there is nothing it is like to be me", this would be a significant challenge that requires explanation. The illusionist would predict that such a system might indeed report nothing if it lacked the specific self-modeling mechanisms that generate the illusion, while the realist would predict that if it is functionally identical, it must have experiences and thus the report of "nothing" would be a misreport.

  **Disagreement Table**:

  The core disagreement is about the nature of phenomenal consciousness:

  | Issue | Illusionist View (as they would phrase it) | Realist View (as they would phrase it) |
  |-------|--------------------------------------------|----------------------------------------|
  | **Phenomenal Consciousness** | Phenomenal consciousness is an illusion: the self-model represents the system as having subjective experiences (qualia), but this representation is false; there are no such properties in reality. What exists are only non-phenomenal representational states and processes. | Phenomenal consciousness is real: there is something it is like to be the system, and this subjective experience is not fully captured by functional or representational descriptions. The self-model may represent this experience, but the experience itself is a real property of the system. |
  | **The Agency Analogy** | The 'illusion' of agency (e.g., the feeling that we are the authors of our actions, which may be post-hoc) is analogous to the illusion of consciousness: both are constructed self-models that misrepresent the underlying processes. The experience of agency is also part of the same self-model and is equally illusory. | Even if the sense of agency is a post-hoc construction and misattributes the causes of action, there is still a real *experience* of agency. The illusion move only shows that the self-model is inaccurate about the causes, but not that the experience itself is unreal. Similarly, the experience of consciousness is real, even if the self-model misrepresents some aspects of it. |
  | **Explanatory Burden** | The illusionist does not owe an explanation of how physical processes produce phenomenal properties because there are none. Instead, they must explain why we have a self-model that represents such properties. This is a tractable problem in cognitive science. | The realist argues that the illusionist must explain the same thing: why we have a self-model that represents phenomenal properties. But the realist also requires an explanation of how and why the self-model (or the underlying processes) actually gives rise to the real phenomenal properties. The illusionist's explanation is incomplete because it leaves out the actual phenomenality. |

  **Cruxes**:

  These are the key sub-questions that, if resolved, could move at least one side.

  1. **The Agency Analogy Transfer**:
     - **Concrete Case**: Libet-style experiments (where brain activity precedes the conscious intention to act) are often cited as evidence for the illusion of agency. Both agree that these experiments show a temporal gap between neural preparation and the conscious report of intention.
     - **Illusionist Prediction**: The feeling of agency is entirely constructed after the action has been initiated by unconscious processes. The experience of agency is part of the self-model and is a misrepresentation. Similarly, the experience of consciousness is a misrepresentation.
     - **Realist Prediction**: The experience of agency is real (there is a qualitative feel to it) even if it is post-hoc and misattributes the cause. The same applies to consciousness: the misattribution of the cause of the experience doesn't negate the reality of the experience.
     - **What would count as evidence against each view**:
       - **Against illusionism**: If it can be shown that the experience of agency (or consciousness) is not just a report but has a causal role that cannot be reduced to the self-model's representation (e.g., if altering the experience independently of the underlying processes changes behavior in ways the self-model cannot account for).
       - **Against realism**: If it can be shown that the experience of agency (or consciousness) can be fully simulated without any phenomenal properties (e.g., in a robot that passes all behavioral tests but lacks subjective experience).

  2. **Explanatory Burden and Circularity**:
     - **Concrete Case**: Consider a hypothetical scenario where we have a detailed cognitive model of the self-representation system. The system represents itself as having experiences. The illusionist claims that this representation is non-phenomenal, while the realist says it is phenomenal.
     - **Illusionist Prediction**: We can explain the content of the self-representation (e.g., "I am experiencing red") by reference to non-phenomenal neural processes and without invoking any phenomenal properties. For example, the representation is a complex neural state that functions as a higher-order representation of first-order perceptual states.
     - **Realist Prediction**: Any explanation of the self-representation that omits the phenomenal aspect will be incomplete. The representation "I am experiencing red" is not just a neural state; it has a qualitative character that must be accounted for.
     - **What would count as evidence against each view**:
       - **Against illusionism**: If we can demonstrate that the self-representation has properties that cannot be reduced to functional or representational properties (e.g., if there is a neural correlate that directly corresponds to the reported intensity of an experience, independent of any functional role).
       - **Against realism**: If we can build a system that has the exact same self-representational structure and reports the same content as a human, but without any phenomenal properties (as per the illusionist), and if we cannot detect any empirical difference between this system and a human in terms of behavior or neural activity.

  **Verbal Dispute**:

  The document identifies a potential verbal dispute regarding the term "phenomenal consciousness". 

  - The illusionist uses "phenomenal consciousness" to mean *an intrinsic qualitative property* (qualia) that they deny exists. They argue that what we call phenomenal consciousness is actually a self-representational structure in the brain, which is non-phenomenal.
  - The realist uses "phenomenal consciousness" to mean *the subjective character of experience* that they believe is real and irreducible, and which they see as present in the self-representational structure.

  Thus, the illusionist denies the existence of what the realist calls "phenomenal consciousness" (qualia), but the realist insists that the self-representational structure itself has a phenomenal character. This leads to talking past each other. Clarifying the terminology might resolve some disagreements, but the core metaphysical disagreement (whether the self-representational structure has irreducible phenomenal properties) remains.

  **Conclusion**:

  The document provides a structured way to move forward by focusing on the cruxes. By designing experiments or thought experiments around the agency analogy and the explanatory burden, the group can test predictions and potentially resolve the dispute. However, the verbal issue must be addressed first to ensure that both sides are discussing the same concept.
answer: |-
  ### Adversarial Collaboration Report: Illusionism vs. Realism about Phenomenal Consciousness  
  **Participants**:  
  - **Illusionist (I)**: Holds that phenomenal consciousness is a "user illusion"—a self-model misrepresenting the brain as having intrinsic qualitative experiences.  
  - **Realist (R)**: Holds that phenomenal consciousness is real, irreducible, and constitutes "what it is like" to be a system.  

  ---

  ### 1. Agreed Claims (Signed by Both)  
  **1.1 Cognitive Architecture**:  
  - The brain generates a dynamic "self-model" that integrates sensory, cognitive, and affective states.  
  - This model enables metacognition (e.g., self-monitoring, error detection) and facilitates unified agency by simplifying complex neural processes.  
  - It is a functional, representational structure implemented in neural circuitry.  

  **1.2 The 'User Illusion' Label**:  
  - The term "user illusion" commits its proponent to:  
    - (a) The self-model is a *useful misrepresentation*—it abstracts away from underlying mechanistic complexity (e.g., representing discrete "choices" when decisions arise from stochastic processes).  
    - (b) It is *not epistemically inert*: it guides real-time behavior (e.g., attention allocation) but may contain false positives/negatives (e.g., confabulation in split-brain patients).  
    - (c) It does *not* imply the absence of all consciousness-related processing; it acknowledges that the model itself is causally efficacious.  

  **1.3 The Explanatory Gap Argument**:  
  - The gap highlights the difficulty of deducing subjective reports (e.g., "I see red") from objective physical/functional descriptions.  
  - Both agree the gap exists and reflects limitations in current reductionist frameworks.  
  - It does *not* prove dualism or non-physicalism; it underscores an epistemic problem in mapping first-person reports to third-person mechanisms.  

  **1.4 Empirical Cases (Shared Interpretations)**:  
  - **Blindsight**: Dissociation between visual function and reportable awareness shows the self-model can fail to represent perceptual processing.  
  - **Charles Bonnet Syndrome**: Vivid hallucinations demonstrate the self-model can generate "quasi-perceptual" content without external stimuli.  
  - **Functional Duplicate Reporting 'Nothing'**: A physically identical system claiming absence of experience would challenge both views and require mechanistic explanation.  

  ---

  ### 2. Disagreement Table  
  | Issue | Illusionist View (I) | Realist View (R) |  
  |-------|----------------------|------------------|  
  | **Nature of Phenomenal Consciousness** | "Phenomenal consciousness is an *illusory content* of the self-model—a representation of intrinsic qualities that does not correspond to any real property." | "Phenomenal consciousness is a *real, non-representational property*—the subjective character of experience itself, which the self-model accurately tracks." |  
  | **Agency Analogy** | "The 'experience of agency' is a post-hoc confabulation with no causal power, showing that self-models systematically misattribute causation. This transfers to consciousness: the 'experience' is just a misleading representation." | "Even if agency is misattributed, the *experience of willing* is real. Misrepresentation explains *why* we feel in control, not *that* we feel it. Consciousness is likewise real despite potential misrepresentations." |  
  | **Explanatory Burden** | "I owe only an explanation for *why the self-model represents experiences*, not for nonexistent qualia. This is simpler than explaining how physical processes generate intrinsicality." | "I owes an explanation for the *seeming* of intrinsicality *and* how it arises without circularity. R must explain how physical processes *instantiate* subjective qualities—a harder but necessary task." |  

  ---

  ### 3. Cruxes  
  **Crux 1: Does the Agency Analogy Transfer to Consciousness?**  
  - **Concrete Case**: *Libet’s Experiments* (voluntary actions preceded by unconscious brain activity).  
    - **I’s Prediction**: If neural precursors of action are manipulated (e.g., via TMS) without altering the self-model’s "I chose" report, the *experience of agency* dissolves, proving it is an epiphenomenal tag. Similarly, altering self-model circuits (e.g., in parietal cortex) will dissociate "experience" reports from processing without qualitative loss.  
    - **R’s Prediction**: Even with neural manipulation, the *raw feel of agency* (e.g., urgency, effort) persists if the self-model updates correctly. The experience is inseparable from model dynamics—disrupting it alters phenomenology (e.g., alien hand syndrome).  
  - **Evidence Against Own View**:  
    - **I**: If disrupting the self-model *abolishes all behavioral signatures of agency/experience* (e.g., no spontaneous error correction), the model is more than an illusion.  
    - **R**: If a system with identical self-model dynamics reports no experience (e.g., a human with inhibited feedback loops acts normally but claims "no will"), phenomenality may be illusory.  

  **Crux 2: Can the Self-Model Explain Phenomenal Representation Without Circularity?**  
  - **Concrete Case**: *Artificial Self-Model* (an AI with a human-like self-model that reports "experiences" but lacks biological wetware).  
    - **I’s Prediction**: The AI will report identical experiences to humans because representations (not intrinsic properties) explain content. No "harder" explanation is needed—the model’s functional role suffices.  
    - **R’s Prediction**: The AI may report experiences but lacks *actual phenomenality* (e.g., its "red" is empty syntax). Representational content presupposes a conscious ground—I’s account is circular ("experience" is defined by representation, which is defined by...).  
  - **Evidence Against Own View**:  
    - **I**: If the AI spontaneously describes *novel qualia* (e.g., "I see a new color") without programming, representation may require more than computation.  
    - **R**: If the AI’s reports correlate perfectly with human phenomenology (e.g., pain aversion with "hurt" claims) *and* it passes all behavioral tests, intrinsicality may be redundant.  

  ---

  ### 4. Verbal Dispute: "Phenomenal Consciousness"  
  - **Source of Confusion**:  
    - **I** uses "phenomenal consciousness" to denote *putative intrinsic qualities* (e.g., "redness-as-such"). Since I denies these exist, consciousness reduces to self-representational functions.  
    - **R** uses "phenomenal consciousness" to denote *subjective character* (e.g., "what it’s like"), which they assert is real and irreducible to representation.  
  - **Why Verbal?**: Both agree the self-model exists and generates reports of experience. The dispute hinges on whether "subjective character" requires an extra ingredient (R) or is fully explained by representation (I).  
  - **Resolution**: Replace "phenomenal consciousness" with:  
    - **I**: "Self-representational content of experiential states."  
    - **R**: "Intrinsic subjectivity of experiential states."  

  ---

  ### Conclusion  
  This document isolates the core agreements, crystallizes disagreements in mutually acceptable language, and identifies testable cruxes. Progress requires:  
  1. Jointly designing experiments targeting the agency analogy (e.g., TMS studies) and self-model circularity (e.g., AI benchmarks).  
  2. Pre-registering predictions to avoid hindsight bias.  
  3. Clarifying terminology to bypass verbal disputes.  

