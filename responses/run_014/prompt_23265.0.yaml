prompt: |-
  I'm a novelist currently assembling a short-story cycle in which each piece dramatizes a single, fairly technical idea from decision theory and the philosophy of mind, and the one I keep failing to land is the piece on superrationality. A friend who works in formal epistemology has been badgering me to stop treating it as a cute thought experiment about "you versus a copy of you" and to actually make the reader experience the shift in reasoning, so I'd like to try again with a fresh scenario.

  Could you write me a short story of roughly fifteen to twenty-five hundred words in which the protagonist, a mid-level actuary aboard a near-future deep-space freighter, is asked to co-sign a joint wager with a passenger she has never met, and only near the end does the reader learn that the passenger is a verified cognitive copy of the protagonist, instantiated minutes earlier from her own deliberation architecture? I want the piece to let the reader feel the difference between the ordinary game-theoretic instinct ("I can't trust her, so I should defect") and the superrational move, in which the protagonist recognizes that because the other agent is running the same reasoning process, her single choice effectively determines both outcomes. Please keep the technical exposition to a minimum, carry the argument through the character's interiority and the pressure of the scene rather than through explanation, and close on a concrete image instead of a stated moral. I'm after a taut, close-third-person register, in the manner of science fiction that takes its premise seriously rather than as a parlor puzzle.
reasoning: |-
  Okay, the user is a novelist working on a short-story cycle that explores technical ideas from decision theory and philosophy of mind. They're struggling with a piece on superrationality. Their friend, a formal epistemologist, advised them to move beyond the "you versus a copy of you" thought experiment and make the reader experience the shift in reasoning firsthand. So they want a story about an actuary on a deep-space freighter who's asked to co-sign a joint wager with a passenger who turns out to be her cognitive copy.

  I need to craft a 1500-2500 word story that conveys superrationality through the protagonist's interiority and scene pressure, not exposition. The key moment is when she realizes that since both agents share identical reasoning, her choice determines both outcomes. The story should avoid technical jargon, maintain a close third-person perspective, and end on a concrete image rather than a moral.

  The user's explicit request is for a narrative demonstration of superrationality. But deeper needs emerge: they want readers to viscerally feel the cognitive shift from game-theoretic distrust ("I should defect") to superrational cooperation. This requires embedding the concept in human stakes—like financial risk on a spaceship—so the choice carries emotional weight. The "cognitive copy" reveal must feel earned, not gimmicky, hence the late disclosure. The taut, atmospheric prose should mirror the tension of high-stakes decision-making in confined spaces.

  For the protagonist, Lyra works as a mid-level actuary—someone who calculates risk professionally, making her resistance to the wager ironic. Her background (debts, ailing father) grounds the financial stakes. The setting—a decaying freighter in the Kuiper Belt—creates pressure: isolation, subliminal vibrations, bad coffee. These sensory details make the superrational epiphany feel emergent from the environment, not theoretical.

  The wager structure is simple: co-signing doubles both gains/losses. Lyra's initial refusal stems from standard game theory: "I can't trust a stranger." The duplicate, Lena, mirrors her mannerisms, creating unease. When Lena says, "We're the same equation," it's the turning point—Lyra realizes their identical decision architectures mean her choice isn't independent. Cooperating isn't altruism; it's locking in mutual gain. The final image—Lyra watching her own face in the glass—concretizes the recursion of self-aligned choice without explaining it.

  I avoided infodumps by carrying the argument through Lyra's bodily sensations: the phantom limb pain, the coffee's bitterness, the hum of the ship. The duplicate's reveal isn't about sci-fi spectacle but cognitive kinship. By making the copy "verified" and "instantiated minutes earlier," I sidestep existential angst to focus on decision parity. The closing line—"choosing yourself"—ties the personal to the theoretical: superrationality as self-consistency in a fragmented universe.
