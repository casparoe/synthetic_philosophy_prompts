prompt: |-
  Ok, so I've been chewing on this for a while and I want to know what principle, if any, is actually driving my gut. It started with the Darwin and Wallace thing and then I started making up cases. Assume throughout that the result is correct, important, and not fraudulent.

  1. Two people on different continents prove the same theorem within a few weeks of each other, neither aware of the other, both proofs complete. Whoever publishes first gets the name on it. My verdict: they discovered it equally, and the name is an accident of the postal service. If I could, I'd put both names on the theorem.

  2. Same setup, except the second person publishes 25 years later, having had the proof in a drawer the whole time. My verdict: they still discovered it, and I'd even say they got there first, but they shouldn't get the name, and I don't feel bad about that.

  3. Someone publishes the result in an obscure journal in the 50s. It's correct. Nobody reads it, nobody can use it. It gets re-proved in the 80s, becomes famous, and carries the 80s person's name. My verdict: the 80s person is the discoverer. The 50s person gets a paragraph in a history paper and that seems right. And I'd say the same even if the 80s proof was basically a reproduction of the 50s one. (When it finally gets noticed, by the way, three separate people rediscover it in the same year.)

  4. Someone builds a big framework and never states the corollary that everyone else sees immediately. A student of theirs states it the next year and it's named after the student. My verdict: the theorem is the framework-builder's and the naming is an injustice -- even though they never said it, and even though the step from framework to theorem is trivial.

  5. Four groups get the same result within a year, and everyone at the time was saying it was coming, people were giving conference talks about how all the pieces were sitting there. My verdict: the first one still deserves full credit, no discount.

  6. Somebody notices something totally unexpected while doing something else, in a field where nobody was even asking the question. Verdict: this is the paradigm of discovery, maximum credit.

  7. Somebody announces the same true thing years earlier on the basis of a completely bogus argument -- reasoning is nonsense, conclusion is right. Verdict: no credit as a discoverer. Right by accident doesn't count.

  8. A program brute-forces a search and finds a theorem no human had. Real, correct, important. Verdict: I want to say it was discovered, but "who" is genuinely strange, and I don't think the person who ran the program discovered it. The credit feels thin, but I can't call it zero.

  9. The result comes out of a forum thread over six years -- hundreds of people, nobody ever holds the whole thing, it just slowly assembles, and there's no moment where any single person has it. My verdict: it was discovered. Here's the one I keep going back and forth on: whether "the thread" deserves credit in the same way a person does, or whether credit is the kind of thing that only attaches to someone who could have been wrong on their own.

  What I can't square: 3 and 4 seem to want opposite rules about whether you have to actually say it out loud. And 5 and 6 seem to want opposite rules about whether it matters that someone else would have gotten there. The crude principle I keep reaching for is: credit goes to whoever turned the discovery from possible into actual. But 3 and 4 both break it -- the 50s person made it actual and gets nothing, the framework person never made it actual and gets everything.

  So is there a principle that gets all nine, or close? I'm fine with a two-part answer if the parts are principled rather than ad hoc. If something has to go, tell me which verdict and why. And say what your principle predicts for a case I haven't given: a sealed, dated, notarized envelope containing the result, never opened, found in the person's effects 40 years later, with everything independently re-derived in the meantime. Also, if the answer is "discoveries being multiple means none of these people deserve anything special," say so and tell me what that does to case 6.

  Write it in American English please.
reasoning: |-
  Okay, let me tackle this user's intricate puzzle about discovery credit. The user presents nine nuanced scenarios where conventional "first to publish" rules clash with intuitive notions of deserved recognition. 

  First, I notice the core tension: they want a consistent ethical principle but keep finding contradictions. In case 3 (50s obscure publication), actualization didn't grant credit, while in case 4 (unstated corollary), lack of actualization didn't prevent credit. That's the knot to untie. 

  Hmm... their "made it actual" hypothesis fails because: 
  - The 50s author objectively actualized the discovery yet gets no credit 
  - The framework builder didn't actualize the corollary but "should" get credit 

  I recall Merton's sociology of science - discoveries exist in "potential space" until integrated into collective knowledge. That fits case 3: publication without integration ≠ actualization. Similarly, case 4's framework made the corollary inevitable upon contact with any competent mind. 

  For the brute-force program (case 8), credit feels thin because the human didn't conceive the insight - they just operated a tool. Contrast with case 6's accidental discovery where human cognition connected dots unexpectedly. 

  The forum thread (case 9) challenges individualism itself. We credit collectives all the time (e.g., LIGO collaboration), but only when the group functions as a epistemic unit with shared goals. A random internet thread lacks that intentionality. 

  Ah! The sealed envelope test case proves the point: if never integrated into knowledge streams, it's a curiosity, not a discovery. Like Schrödinger's cat - until observed, it hasn't collapsed into reality. 

  Biggest revelation: credit isn't about who first possessed truth, but who made truth possessable by others. That resolves the user's contradictions: 
  - 50s author possessed but didn't make possessable 
  - Framework builder made it possessable without personally possessing 
  - Darwin/Wallace both made it possessable concurrently 

  This also handles the program/forum cases: credit attaches only when humans translate possibility into usable actuality. The user's gut was tracking social epistemology all along!
answer: |-
  Here's a unified principle that explains all nine cases and your gut reactions, based on **social epistemology** – how knowledge enters and functions within a community:

  **The Core Principle:**  
  **Credit for discovery attaches to the agent(s) who first *integrates* the discovery into the collective knowledge stream of the relevant community, making it usable, testable, and buildable-upon.**

  This isn't just about "who thought it first" or "who wrote it down," but **who made it real *for the field*.** Let's break it down:

  1.  **Simultaneous Discovery (Darwin/Wallace):**  
      *Both* integrated the idea into scientific discourse almost simultaneously. Neither had a monopoly on making it "actual" for the community. Credit shared. **Fits.**

  2.  **Delayed Publication (25 years in drawer):**  
      The drawer-hoarder *didn't* integrate it. They failed to make it part of the collective knowledge stream. The later publisher *did* integrate it. The hoarder gets historical footnote credit ("first to have it privately"), not discovery credit. **Fits.**

  3.  **Obscure Publication (50s) vs. Famous Rediscovery (80s):**  
      Publication in an obscure journal *failed* to integrate it into the *relevant* community's knowledge stream. It wasn't usable, testable, or buildable-upon. The 80s rediscovery *succeeded* in integration. The 50s author documented priority but didn't achieve functional integration. **Fits.**

  4.  **Unstated Corollary from a Framework:**  
      The framework-builder *integrated the essential knowledge* that made the corollary inevitable and obvious to the community. The framework *is* the discovery; the corollary is an inherent, integrated part of it. The student merely articulated what was already functionally present *because* of the framework's integration. Credit belongs to the framework-builder. **Fits.** (The injustice you feel stems from the student getting naming rights, not from the framework-builder deserving discovery credit).

  5.  **Inevitable Result ("All pieces there"):**  
      The first group to publish still *integrates* it first. They assembled the pieces into the validated, communicated whole that the community then uses. The inevitability doesn't negate the act of successful integration. **Fits.**

  6.  **Serendipitous, Unexpected Discovery:**  
      This is the purest form of integration. The discoverer *created* new knowledge where none was sought and successfully integrated it into the field. Maximum credit because the integration effort was maximal and unexpected. **Fits.**

  7.  **Accidental Truth (Bogus Argument):**  
      The bogus argument *failed* to integrate the *correct knowledge*. It integrated nonsense that happened to point to a true conclusion. The community couldn't reliably use, test, or build upon the *reasoning*. No meaningful integration of the *valid* knowledge occurred. **Fits.**

  8.  **Brute-Force Program Discovery:**  
      The program output isn't integrated knowledge until humans *validate, interpret, and communicate it* within the community. The *person* who designed the program/experiment, understood the output's significance, verified it, and published it *integrates* the discovery. Credit is thinner because the cognitive leap was smaller (more tool-use than insight), but it belongs to the human(s) who completed the integration loop. **Fits.**

  9.  **Crowdsourced Forum Thread:**  
      The knowledge *was* integrated – gradually and collectively – *into the forum community itself*. The "discoverer" is the collective entity of the active forum participants. They functioned as a distributed epistemic agent. Credit attaches to the collective ("the XYZ Forum thread contributors" or a key summarizer). **Fits.** Credit *can* attach to distributed agents. The requirement is integration, not individual genius or infallibility. The thread *could* have been wrong, but the collective process (argument, refinement, testing within the thread) validated it.

  **Squaring Your Contradictions:**
  *   **Case 3 vs. Case 4 (Saying it vs. Not Saying It):** It's not about uttering the words, but about *what knowledge was functionally integrated*. Case 3: The *specific theorem* wasn't integrated (obscure journal). Case 4: The *framework* containing the inevitable corollary *was* integrated.
  *   **Case 5 vs. Case 6 (Inevitability):** Case 5's inevitability doesn't negate the *act* of integration by the first group. Case 6 gets maximum credit because the *integration effort* was maximal – creating *new* knowledge space and integrating it.

  **The Sealed Envelope Test Case:**
  *   **Verdict:** No discovery credit. The envelope holder documented private priority but *failed utterly* to integrate the knowledge into the collective stream. It remained inert and unusable. The later discoverers *did* integrate it. The envelope is a historical curiosity, like the drawer-hoarder in Case 2, but with even less claim (no intent to ever publish?).

  **Why Not "Multiple Discoveries = No Credit"?**
  This principle **doesn't** diminish credit for true discovery (Case 6). It clarifies *who* gets credit when multiple independent integrations occur (Case 1, shared) or when potential isn't realized (Case 2, 3, 7, envelope). Case 6 remains the ideal: maximum credit for maximum integration of novel knowledge.

  **Conclusion:**
  Your gut is tracking **functional integration into the knowledge commons**. Credit belongs to whoever first successfully injects the validated, communicable knowledge into the bloodstream of the field, making it a usable tool for the community. This principle resolves all nine cases and the sealed envelope scenario by focusing on the *social act* of making knowledge live within the discipline, not just the private act of finding it.
