prompt: |-
  So I'm taking a course on design history and we just got to Otto Neurath and the Isotype project, and I'm honestly a little lost. From what I gathered, Isotype was this system of standardized little pictograms that he and his team used to make charts about social and economic stuff, and the whole idea was that maybe you could build an international picture language that anyone in the world could read without learning a verbal language. My problem is that everywhere online people just say the pictograms at airports or on IKEA boxes are basically Isotype that leaked into everyday life, and that it's the ancestor of emoji. I was arguing about this with a friend and they're convinced the two are basically the same thing: little constructed pictures that are supposed to be understood by anyone instantly. But I'm not so sure that's right, because I feel like Isotype charts had rules for combining the symbols that random airport signs don't really have.

  Could you compare Neurath's Isotype with the everyday pictograms we actually see today, like wayfinding signs, safety symbols, or emoji? I want to know where the comparison holds up and where it breaks down. Like, was Isotype actually meant to function as a standalone language you could express full ideas with, or was it something more limited, and how does that change how we should think of modern pictograms? And is it even true that today's signs are descendents of his work, or did they mostly come from somewhere else?
