prompt: |-
  I'm applying for a small interdisciplinary fellowship — six months, half-time, real money but not a lot of it, and they want to know what I'll actually hand in at the end. The idea I'd be pitching came out of a reading group on collective action where we kept throwing everything under "the tragedy of the commons," and it started to bug me that the classic picture always assumes the thing getting destroyed is a stock: fish, pasture, groundwater, bandwidth, each act of appropriation nibbling a bit away. But the cases I actually care about don't look like that. A bus queue. People bagging their dog's mess. A wiki article that quietly stays accurate. The unwritten rule against leaving your cart in the middle of the lot. What degrades in those cases isn't a stock that gets eaten down unit by unit — it's the shared expectation that other people are still playing along. And it seems to flip: everyone does it, everyone does it, then two people don't and suddenly nobody does, with nothing about anyone's underlying incentives changing in between. The other oddity is that you can't wear it out by participating; the only way to damage it is to be seen not to. So the good looks non-rival in the usual sense and yet gets destroyed by visible non-use, which isn't how we normally talk about public goods either.

  My hunch is that this is a genuinely different failure mode rather than the standard story with the knobs turned up, and that if it is, it changes what interventions even make sense — you'd be thinking about visibility and thresholds instead of prices and quotas. But I honestly cant tell whether I'm onto something or just redescribing the same thing in fancier clothes, and that's the question I want the proposal to make answerable rather than quietly assume. Turn this into the proposal: state the question precisely, say why the existing ways of carving up commons and public-good problems leave it genuinely open (without turning it into a literature review — I'll fill in the references myself, just tell me which positions actually matter), and say what I'd do with six months at half time and why that method rather than the obvious alternatives. I'm genuinely unsure whether this should be formal modeling, a small set of structured case comparisons, or straight conceptual work, so pick one and defend it. Say what a successful outcome looks like, what would count as the project failing or as my distinction collapsing back into the standard one, and give me a straight answer about whether the paramaters I've described add up to a real deliverable or whether I'm kidding myself. Be concrete about what the thing I hand in actually is.
reasoning: |-
  Okay, the user is applying for a small interdisciplinary fellowship and needs help crafting their proposal. They're grappling with an idea about collective action that challenges the classic "tragedy of the commons" model. Their insight is that in many real-world scenarios—like bus queues or unwritten social rules—the resource being degraded isn't a physical stock but rather the shared expectation of cooperation. This seems to collapse suddenly when a threshold of defection is crossed, without changes to individual incentives. 

  Hmm, their core tension is whether this is genuinely novel or just a repackaging of existing concepts. They want the proposal to frame this as an open question while avoiding literature review overload. The fellowship constraints (6 months, half-time) make feasibility crucial—they're unsure about methodology (modeling, case studies, or theory). 

  First, I need to pinpoint what makes their observation distinct: standard commons theory focuses on rival stocks depleted incrementally (fish, pasture), while their cases involve non-rival "expectational goods" that crumble abruptly via visible non-compliance. Public goods theory doesn't quite fit either, since those are undermined by free-riding, not the act of being seen to defect. The threshold effect is key here—it's a coordination problem with a tipping point. 

  For framing, the proposal should explicitly ask whether threshold-triggered collapse of shared expectations constitutes a distinct failure mode. To show it's open: Ostrom's work covers norms but assumes gradual erosion; Schelling/Schelllling examines tipping points but not for non-rival goods; public goods literature ignores visibility as a catalyst. 

  Methodology choice is tricky. Modeling might oversimplify; pure theory risks vagueness. Structured case comparisons strike the best balance: they can isolate mechanism (visibility/thresholds) across 4-5 varied examples (bus queues, wiki moderation, etc.) while staying feasible in 6 months. Bonus: cases generate concrete indicators for "successful outcome" (e.g., documenting threshold patterns absent in stock depletion). 

  Deliverable: a 25-30 page monograph synthesizing cases, defining the "expectational commons" concept, and specifying intervention implications (e.g., why quotas fail but visibility nudges work). Success means demonstrating threshold dynamics irreducibly; failure would be showing mechanisms reduce to standard free-riding. 

  Feasibility check: 3 months for case deep dives, 2 for analysis, 1 for writing—tight but doable at half-time. They're not kidding themselves if they scope cases narrowly. Final note: stress that the "thing handed in" isn't just theory—it's a diagnostic framework with real policy teeth.
answer: |-
  Here’s a focused fellowship proposal framework designed to turn your insight into a testable project, grounded in feasibility and clear deliverables. I’ve chosen **structured case comparisons** as the method and defended it against alternatives.

  ---

  ### **Project Title**  
  Threshold Collapse in the Commons: When Shared Expectations Fail Abruptly  

  ### **Core Question**  
  *Does the sudden, threshold-triggered collapse of cooperative behavior—driven by visible non-participation degrading shared expectations rather than stock depletion—represent a distinct failure mode of collective action, irreducible to standard "tragedy of the commons" or public goods frameworks?*  

  ### **Why the Question is Open & Under-theorized**  
  Existing frameworks struggle to explain your cases:  
  - **Standard Commons Theory** (Hardin, Ostrom): Focuses on **rival stocks** (fish, pasture) where depletion is incremental and proportional to use. Your cases lack a depletable stock; degradation is binary and triggered by *visibility of defection*.  
  - **Public Goods Theory** (Samuelson, Olson): Treats non-excludability and non-rivalry as key. Your "expectational goods" *are* non-rival (using them doesn’t degrade them) but are uniquely vulnerable to *observed non-use*, contradicting standard free-rider narratives.  
  - **Social Norms Work** (Bicchieri, Ostrom): Explains sustaining cooperation but assumes norms erode gradually. Your cases show *nonlinear collapse* after a threshold of visible defection, absent in current models.  

  **Key Gap**: No existing framework accounts for (1) the *non-rival yet self-destructing* nature of the resource, (2) collapse via *observed non-participation* (not overuse), and (3) *threshold effects* where incentives don’t change pre-collapse.  

  ### **Method: Structured Case Comparisons (Defended)**  
  **Why not modeling?**  
  Agent-based models could simulate thresholds but risk abstracting away context-specific triggers (e.g., *why* is a shopping cart left in a lot "visible" enough to matter?). Six months is insufficient to build/test a novel model class without oversimplifying.  

  **Why not pure conceptual work?**  
  Your question is empirical: *Does this mechanism exist distinctly in real cases?* Philosophy alone can’t verify if threshold collapse is irreducible or just repackaged free-riding.  

  **Why Case Comparisons?**  
  - **Feasible**: 6 months (half-time) allows deep analysis of 4–5 cases.  
  - **Diagnostic**: Cases act as "natural experiments" to isolate mechanisms.  
  - **Interdisciplinary**: Leverages qualitative social science while testing theoretical boundaries.  

  **Case Selection** (3–4 examples):  
  1. **Bus Queue Jumping** (physical, anonymity-tolerant)  
  2. **Wiki Vandalism/Revert Norms** (digital, traceable participation)  
  3. **Supermarket Cart Return** (private space, weak enforcement)  
  4. **Dog Waste Bagging in Parks** (public space, moral signaling)  

  **Analysis Framework**: For each case, map:  
  - What constitutes "visible non-participation"?  
  - Is collapse abrupt (threshold) or gradual?  
  - What sustains the expectation pre-collapse? (e.g., mutual monitoring, cheap signals)  
  - Does standard theory *fully* explain failure here? If not, what’s missing?  

  ### **Deliverable**  
  A **25–30 page monograph** comprising:  
  1. **Conceptual Toolkit**: Definitions of "expectational commons," "visibility threshold," and "non-rival fragility."  
  2. **Case Analyses**: Evidence for/against threshold collapse in each case.  
  3. **Intervention Typology**: How solutions differ from quotas/taxes (e.g., amplifying visibility of cooperation, threshold alerts).  
  4. **Testable Criteria**: For distinguishing "expectational commons" from standard models.  

  ### **Success vs. Failure Criteria**  
  - **Success**:  
    - Threshold collapse is documented as a *necessary* feature across cases.  
    - Mechanisms (visibility-triggered unraveling) are shown to be *distinct* from stock depletion/free-riding.  
    - Clear criteria emerge for identifying "expectational commons" (e.g., non-rival resource + degradation via observed non-use + threshold effects).  
  - **Failure**:  
    - All cases reduce to known mechanisms (e.g., queue-jumping as a coordination game; cart abandonment as low-cost defection).  
    - No consistent threshold pattern is found.  
  - **Collapse into Standard Theory**: If visibility merely alters *perceived costs* of cooperation (making it a tweak to rational choice), not a unique dynamic.  

  ### **Feasibility: Are You Kidding Yourself?**  
  **No—if you scope tightly**.  
  - **Timeline**:  
    - Month 1–2: Case selection + literature (targeted—focus on gaps).  
    - Month 3–4: Case analysis (interviews/ethnography for queues/carts; wiki edit history data).  
    - Month 5: Synthesis + intervention implications.  
    - Month 6: Writing.  
  - **Risks**: Over-collecting data. **Mitigation**: Cap cases at 4; use secondary data (wiki histories, cart studies).  
  - **Deliverable is Real**: A monograph is standard for humanities/social science fellowships. It answers *what you’ll hand in* concretely.  

  ### **Why This Matters**  
  If validated, this reorients policy:  
  - **Solutions shift** from pricing/quotas to **enhancing visibility of cooperation** (e.g., publicizing cart returns) or **threshold safeguards** (e.g., rapid wiki reversion).  
  - **Diagnostically**, it prevents misapplying "tragedy of the commons" to non-stock problems (e.g., blaming "overuse" for norm collapse).  

  ---  
  **Final Pitch**: This project doesn’t assume your distinction is real—it *tests* it. By comparing cases where standard theory stumbles, you’ll either uncover a new class of collective action problems or rigorously show why we don’t need one. Either outcome is valuable, feasible in 6 months, and delivers a concrete product.
