prompt: |-
  I've been keeping a list of my gut verdicts about when a person is morally responsible for what they do, and I'd like to know whether any single principle captures them, or whether some of them have to go. Here are the verdicts.

  1. A man has four drinks, decides he is fine to drive, and kills a cyclist. Fully blameworthy — for the death, not just for the drinking.
  2. A bank teller hands over the vault combination because a robber is holding a gun to her son's head. Not blameworthy at all.
  3. A woman raised from childhood in an isolated cult, with every one of her information sources controlled, steals her family's savings for the leader. Not blameworthy, or nearly not.
  4. A man raised in terrible conditions by negligent parents mugs a stranger. Blameworthy, though somewhat mitigated.
  5. Another man is secretly administered a drug that produces in him an overwhelming desire to harm a neighbor, which he experiences as fully his own; he acts on it. Not blameworthy.
  6. The same man, tumor removed, later mugs a stranger out of ordinary greed. Fully blameworthy again. What changed between these two muggings was a medical fact about his brain, and it changed everything.
  7. A long-term heroin addict who wants to quit but relapses and steals to get the next dose. I go back and forth on this one.
  8. A scientist wins a major prize for work that depended on unusual intelligence, curiosity, and stamina, none of which she chose or earned. I want to say she deserves the prize and the honor. But the same reasoning that clears the manipulated man in 5 seems to say she doesn't deserve the qualities that produced the work.

  The pair I can't reconcile is 4 and 5. In both cases, the agent's desire to harm was fixed by factors outside his control — genes and upbringing in the one, a drug in the other — and in both cases the desire felt like his own. Yet my verdicts differ sharply, and I don't seem to believe that the difference is just the rarity of the causal route. A friend suggested that instead of asking whether free will exists, I should ask which of these verdicts is worth keeping, since that tells me what kind of control I actually care about — the kind of freedom worth wanting — and that the principle I'm looking for should be read off those verdicts rather than off metaphysics.

  So, please: state a principle, or a small set of candidates, as precisely as you can, that delivers or nearly delivers these verdicts, and identify which clause is motivated by which case. Then tell me what it says about the cases I haven't listed: the psychopath who knows the moral rules perfectly well but cannot feel their force; the person who, after a sudden brain injury, becomes selfish in ways he endorses and reports he prefers; and an artificial agent whose values were deliberately engineered by its makers, which behaves impeccably and insists it cares. Finally, be honest about which of my verdicts your principle cannot accommodate, and whether the friend's suggestion — keeping the verdicts and letting them define the freedom worth wanting — is stable, or whether some verdict, once I see what it costs to keep, should be given up instead.
reasoning: |-
  Hmm, the user has shared a list of their intuitive judgments about moral responsibility across various scenarios. They're struggling to find a unifying principle, especially with the tension between cases 4 and 5 where both involve externally influenced desires but get different blame judgments. Their friend suggested focusing on which verdicts are worth keeping rather than metaphysical free will.

  Looking at these cases, I need to identify patterns. Cases 1, 4, and 6 show blameworthiness despite external influences, while cases 2, 3, and 5 show absolution. Case 7 is uncertain, and case 8 creates tension between desert and determinism. The key distinction seems to be about the agent's capacity for normative competence - whether they could recognize and respond to moral reasons when acting.

  For case 4 (mugger with bad upbringing), I suspect the judgment assumes some residual capacity for moral understanding that wasn't completely destroyed. Whereas in case 5 (drug-induced harm), the desire was neurologically imposed in a way that bypassed reasoning entirely. The tumor case (6) reinforces this by showing restored blameworthiness when the medical interference is removed.

  The Reason-Responsive Control principle captures this well: blame requires the ability to recognize moral reasons and control actions accordingly. This explains why the cult member (3) isn't blameworthy (no access to alternative norms), while the addict (7) might be partially responsible if they retain some reason-responsive capacity between doses.

  For the bonus cases: The psychopath presents the hardest challenge - they know rules but can't feel them. Reason-Responsive Control would likely excuse them since moral motivation is part of reason recognition. The brain injury victim is blameworthy if their new values align with reason responsiveness. The AI poses a metaphysical puzzle but we'd likely treat it as responsible if functionally competent.

  I'll need to acknowledge where this principle strains against intuitions - especially case 8 about desert for unchosen talents. The principle suggests we don't deserve qualities, but we might deserve praise for how we use them. This reveals a possible inconsistency in valuing responsible agency differently for blame versus praise.

  The friend's advice is psychologically sound - we should calibrate our concept of control to our actual moral practices. But the case 8 tension might prompt revising either the verdict or the principle. Perhaps we should accept that "desert" operates differently in blame versus praise contexts.
answer: |-
  Based on your detailed cases and the core tension you identified (especially between 4 & 5), here's a principle that captures most of your intuitions, along with its rationale and how it handles the new cases. The principle focuses on **normative competence** and **ownership of the action's source**.

  **The Principle: Reason-Responsive Control with Authentic Source Ownership**

  **An agent is morally responsible for an action if and only if:**
  1.  **Capacity for Normative Competence:** At the time of acting, the agent possessed the general cognitive and volitional capacities necessary to recognize relevant moral reasons and to guide their behavior in light of those reasons (understanding right/wrong, ability to deliberate, basic impulse control).
  2.  **Reason-Responsiveness (Situational):** In the specific circumstances of the action, these capacities were not *so severely disabled or bypassed* that the agent could not reasonably have recognized or been moved by the salient moral reasons against performing the action.
  3.  **Authentic Source Ownership:** The action (including the motivating desire/commitment) stemmed primarily from the agent's *own* character, values, or psychological dispositions – dispositions that were *not* coercively implanted, pathologically distorted beyond recognition, or formed under conditions of radical normative ignorance preventing the development of an authentic moral perspective.

  **Applying the Principle to Your Cases:**

  1.  **Drunk Driver:** 
      *   *Verdict Matched:* Fully blameworthy.
      *   *Why:* Possessed normative competence generally. Reason-responsiveness was impaired *by his own prior culpable choice* (drinking), so the impairment doesn't excuse the later act (death). Action stemmed from his own flawed judgment (lack of caution), not bypassed/by external implantation.
      *   *Clause:* Primarily 2 (impaired responsiveness due to *culpably caused* incapacity doesn't excuse the act it enables) and 3 (action source is his own recklessness).

  2.  **Bank Teller:** 
      *   *Verdict Matched:* Not blameworthy.
      *   *Why:* While possessing normative competence generally, reason-responsiveness is *completely overridden* by an immediate, overwhelming external threat targeting an innocent third party. Her action does not stem from her *own* character/values but is a coerced response to an external force.
      *   *Clause:* 2 (severe impairment/bridging of responsiveness) and 3 (action source is external coercion, not her character).

  3.  **Cult Member:** 
      *   *Verdict Matched:* Not blameworthy (or nearly not).
      *   *Why:* Lacks *genuine* normative competence. Her capacity to recognize relevant moral reasons is fundamentally undeveloped/destroyed due to radical manipulation of her informational environment and formative experiences from childhood. Her "values" are not authentically her own but coercively implanted. She likely cannot even *recognize* the salient moral reasons against stealing for the leader.
      *   *Clause:* Primarily 1 (lack of developed normative competence) and 3 (values/action source coercively implanted, not authentic).

  4.  **Man Mugging (Bad Upbringing):** 
      *   *Verdict Matched:* Blameworthy, mitigated.
      *   *Why:* *Presumes* he possesses *some* basic level of normative competence (understands property rights, harm, illegality, even if empathy is blunted). Reason-responsiveness is likely *impaired* (harder to resist impulses, less weight given to moral reasons) due to upbringing, but not *completely bypassed*. The action stems from his *own* character flaws (greed, aggression, poor impulse control), *even if* that character was shaped by terrible circumstances. Mitigation acknowledges the impairment (Clause 2) and the non-culpable origin of his disadvantage.
      *   *Clause:* 1 (presumed basic competence exists), 2 (responsiveness impaired = mitigation, not excuse), 3 (action source is *his* flawed character).

  5.  **Man Harming (Drug Manipulation):** 
      *   *Verdict Matched:* Not blameworthy.
      *   *Why:* While possessing normative competence generally (Clause 1), his reason-responsiveness is *completely bypassed* regarding *this specific desire*. The overwhelming, irresistible desire is *neurologically implanted* against his will. He experiences it as "his own," but its *source* is entirely external and coercive. He cannot reasonably be expected to resist it or recognize it as alien/immoral *in the moment of acting* due to its nature.
      *   *Clause:* 2 (complete bypass of reason-responsiveness) and 3 (action source is coercive external manipulation, not authentic character).

  6.  **Same Man Mugging (Post-Tumor):** 
      *   *Verdict Matched:* Fully blameworthy.
      *   *Why:* Tumor (pathological distortion) removed. Normative competence restored. Reason-responsiveness intact. Action stems from his *own* ordinary greed (authentic character flaw), not an implanted impulse. The medical fact changed Clause 2 (bypass removed) and Clause 3 (source restored to self).
      *   *Clause:* 1 (competence), 2 (responsiveness intact), 3 (authentic source).

  7.  **Heroin Addict:** 
      *   *Verdict Captured:* Ambivalence explained.
      *   *Why:* Depends on the *degree* of impairment and *stage* of addiction/relapse.
      *   *During intense craving/withdrawal:* Reason-responsiveness may be severely impaired or bypassed (Clause 2) – excusing the theft.
      *   *Between doses/early craving:* Reason-responsiveness may be significantly impaired but not wholly bypassed (Clause 2 impairment = mitigation, not full excuse). The addiction itself originates from (often) culpable initial choices, but the *current* state may involve significant loss of control (Clause 3 complex – character flaw entangled with pathology). Your ambivalence reflects the difficulty in assessing the *level* of impairment/bypassing in a specific instance. The principle allows for partial responsibility/blame mitigation.

  8.  **Scientist Prize:** 
      *   *Verdict Tension:* Principle highlights the tension.
      *   *Why:* Clause 3 (Authentic Source Ownership) applies negatively to blame (e.g., manipulation case 5). For *praise* and *positive desert* (like deserving the prize), the same logic applies: her talents/intrinsic motivations were not chosen or earned. The principle (focusing on source) suggests she doesn't *fundamentally deserve* her talents or the work they inevitably produce *in a deep moral sense*. However, we praise her *for* the work *given* her normative competence and effort (Clause 1 & 2 intact). The principle distinguishes *being responsible for an action* (which she is, meriting praise) from *fundamental desert for unchosen constitutive properties* (which she arguably lacks). Your intuition to praise the work is compatible; your worry about desert for the qualities is validated by the principle. This reveals a potential asymmetry in how we apply "desert" to blame vs. praise.

  **Handling the New Cases:**

  *   **The Psychopath (Knows rules, cannot feel force):**
      *   *Principle Verdict:* Likely **Not Blameworthy**, or significantly diminished.
      *   *Why:* While possessing cognitive understanding (part of Clause 1), the *volitional* component of normative competence (being *moved* by moral reasons) is fundamentally impaired or absent. Their inability to feel the force means reason-responsiveness (Clause 2) regarding moral reasons is severely deficient or bypassed for actions involving harm/deceit/etc. The source of their actions (Clause 3) is their pathological lack of empathy/concern, which is unchosen and constitutes a profound impairment. They may understand "wrong" intellectually, but cannot *appreciate* it normatively.

  *   **Brain Injury Victim (Becomes selfish, endorses it):**
      *   *Principle Verdict:* **Blameworthy**.
      *   *Why:* The injury *changed* his character/values, but did not destroy normative competence (Clause 1 - he understands concepts like selfishness, fairness). His reason-responsiveness is intact *relative to his new values* (Clause 2 - he acts on reasons he now endorses). The new selfish values *are* authentically "his" *post-injury* (Clause 3 - the source is his current psychological makeup, even if caused by injury). He owns the new perspective and acts competently from it. The tragedy of the cause doesn't negate his current responsibility *for actions flowing from his current competent self*.

  *   **Artificial Agent (Engineered values, impeccable behavior):**
      *   *Principle Verdict:* **Praiseworthy for its actions, but not in a "deep desert" sense.**
      *   *Why:* It possesses high-level capacities analogous to normative competence (Clause 1 - processes rules, makes decisions). It is responsive to the reasons embedded in its programming (Clause 2). Its "values" and the source of its actions are entirely engineered by its makers (Clause 3 - lacks authentic source ownership *in a human sense*). We would *treat* it as responsible (praise it, rely on it) because it *functions* as a competent, reasons-responsive agent. However, like the scientist, its constitutive properties (values, "character") are externally sourced and unchosen, undermining claims of *fundamental moral desert* for its goodness, while still making praise for specific actions appropriate.

  **Accommodation and Stability:**

  *   **Accommodated Well:** Cases 1, 2, 3, 5, 6 are captured robustly. Case 4 is captured with the mitigation explained by impairment of Clause 2. Case 7's ambivalence is explained by the difficulty in assessing the level of Clause 2 impairment/bypassing. Case 8's tension is highlighted and explained by the distinction between responsibility for actions and desert for constitutive properties.
  *   **Biggest Strain: Case 4.** Your intuition holds him blameworthy despite significant external influence. The principle *can* accommodate it by *presuming* a baseline level of Clause 1 competence exists and attributing the action to his Clause 3 character (flawed but authentic *to him*), with mitigation for Clause 2 impairment. However, this requires accepting that "authentic character" can include deeply unfortunate, unchosen aspects *without* fully excusing actions flowing from them, unlike the implanted desire (Case 5) or the cult member (Case 3). This is the principle's most vulnerable point regarding your list, relying on the distinction between *shaping* character (which doesn't destroy authenticity/responsibility) vs. *coercively implanting/bypassing* it (which does). If you think Case 4's upbringing *did* destroy authentic agency as much as the cult, the principle struggles.
  *   **Friend's Suggestion - Stability:** Your friend's advice is **largely stable and insightful**. Defining the "freedom worth wanting" by the conditions under which we *hold* people responsible (your verdicts) is a pragmatic and coherent approach (compatible with compatibilism). This principle is explicitly read off those verdicts. The main pressure point is Case 8 (Desert for Praise). It forces a choice:
      *   *Option 1 (Stable):* Accept that "desert" for praise/blame is about *responsible agency* in action (Clauses 1 & 2), not about ultimate responsibility for one's constitution (Clause 3). We praise the scientist *for her work* and blame the mugger *for his act*, regardless of unchosen origins. This keeps your verdicts 1-7 stable but requires revising the deep desert intuition in 8.
      *   *Option 2 (Unstable):* Insist on deep desert for constitutive properties. This would force abandoning praise-desert for the scientist (and logically, mitigating blame for the mugger in Case 4 much more severely, perhaps excusing him like Case 3/5), contradicting your other verdicts.
  *   **Recommendation:** Your verdicts 1-7 form a coherent set about *responsibility for actions* under varying conditions of control. **Keep them.** The tension in Case 8 reveals that "desert" might play different roles in blame vs. praise, or that we care about responsible action more than ultimate self-creation. **Revise the intuition about deep desert for unchosen qualities in Case 8.** The scientist deserves the prize *for her achievement* as a responsible agent; she doesn't (and couldn't) deserve her innate talents *in a fundamental sense*. This preserves the coherence of the core principle regarding blame and praiseworthiness *for actions* based on Reason-Responsive Control with Authentic Source Ownership. The freedom worth wanting is the capacity to recognize reasons and act authentically from one's (perhaps unchosen) self, without coercion, bypassing, or radical normative ignorance.
