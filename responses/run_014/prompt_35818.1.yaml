  Combining them: P1 * P2 * P3, adjusted for dependencies. Since P3 affects the weight, the formula might be P(sound) = P1 * P2 * (1 - P(collapses)). Using the numbers: 0.65 * 0.9 * (1 - 0.3) = 0.65 * 0.9 * 0.7 ≈ 0.41. So credence around 0.41.

