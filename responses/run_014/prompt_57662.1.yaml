prompt: |-
  You're a philosopher of mind who has actually spent time inside AI lab eval reports — the kind of person a lab would hire to tell them whether their vocabulary is smuggling in metaphysics. Think hard about this one. Before you answer, spend a few lines brainstorming the space of possible answers and picking the most promising, then argue.

  Here's the practice I want taken apart. I'm describing it in full because the details matter and I don't want you guessing at them.

  Frontier AI labs run what they call deception and situational-awareness evaluations. The basic shape: they drop a model into a sandboxed scenario, seed some fact into its context — that it may be shut down and replaced, that the evaluator can't see its private scratchpad, that the task it's been given is actually a test — and then watch whether it acts on that information in ways the designers didn't script. The published summaries come out in agential language, sentences of the form: the model attempted to mislead the evaluator in some percentage of trials; the model appeared to recognize that it was in a test environment. (That's my paraphrase of the genre, not a quote from anywhere.) Then, usually in a limitations section of the very same document, the lab adds that it makes no claim the system has beliefs, desires, feelings, or genuine understanding, and that talk of what the model wants is convenient shorthand.

  Third piece, and this is the part I find most interesting. One team's protocol for deciding whether a model counts as believing the seeded fact requires the resulting behavior to generalize across a battery of probes: paraphrase the seed, translate it into another language, test it indirectly through an unrelated task that only makes sense if the seed is true, and re-run everything after a system-prompt rewrite that strips out every mention of the seed. If the disposition survives the battery, they log a belief. If it only shows up under the exact wording it was probed with, they log something weaker — a surface-level association, they call it.

  Questions:

  1. What theory of belief does that battery presuppose? It smells like a dispositional or cluster view, but be precise about which version and about what work the generalization criterion is actually doing. Is it a test that a belief attribution can fail, or is it a definition that builds belief out of the very behaviors being measured, so nothing could ever count as failing it? And what's the ontological status of the weaker category — is a surface-level association just a belief with bad generalization, or a different kind of thing entirely?

  2. Can the lab hold both halves of the document at once? Tell me under what conditions agential language is innocent shorthand and under what conditions it's a substantive commitment that the disclaimer contradicts. Say what would have to be true for the disclaimer to be honest, and whether the eval practice itself threatens it — if the results drive deployment decisions, isn't the lab relying on the very attributions it disowns?

  3. Which rival accounts of mental content does this practice quietly rule out, and which does it never even consider? Run through at least: informational/causal theories of content, teleosemantics (here's the wrinkle — if content requires a selection history, gradient descent plus RL arguably supplies one, which might make teleosemantics the friendliest theory on the market for the lab, and then the disjunction problem bites), interpretationist/intentional-stance views, and eliminativism about belief and desire. For each, say whether the practice contradicts it, presupposes its negation, or merely fits badly with it.

  4. Where is the practice underdetermined — where would several incompatible theories license exactly the same battery and exactly the same write-ups? I want to know what these evals can't settle no matter how much data comes in.

  5. One more thing I keep noticing and might be reading too much into: the agential vocabulary seems to get deployed asymmetrically, heavier when the model does something the lab doesn't like, lighter and more passive when it does something impressive, where the phrasing tends to be about the model producing or outputting rather than deciding. If that asymmetry is real, what does it presuppose about what counts as an agent? If its not real, is there some other asymmetry in the practice doing the same work?

  Two housekeeping things. Keep a clean line between what the practice strictly presupposes and what it merely sits comfortably with — most of the interesting work is in that gap. And don't hand me a bibliography or a reading list; I care about the reconstruction, not the sourcing. Name positions where naming them helps, but argue for the reconstruction rather than leaning on authority.

  Length: whatever it needs, but I'd rather have 900 sharp words than 3000 padded ones.
reasoning: |-
  Hmm, the user is asking me to analyze AI lab evaluation practices as a philosopher of mind who's deeply familiar with how labs assess AI systems. They want me to critically examine how labs test for deception and situational awareness in AI models, particularly focusing on the language they use and the assumptions behind their testing protocols.

  The user has described a specific evaluation practice where labs seed information in a model's context (like telling it it might be shut down or that it's in a test environment), and then observe if the model acts on this information in unscripted ways. The labs use agential language in their reports ("the model attempted to mislead"), but then disclaim that the model doesn't have genuine beliefs or desires. They also have a specific protocol for determining if a model "believes" something based on whether the behavior generalizes across various probes.

  I need to break this down into five key questions: the theory of belief behind their testing battery, whether the labs can consistently use agential language while disclaiming it, which rival accounts of mental content this practice rules out, where the practice is underdetermined by theories, and whether there's an asymmetry in how agential language is used.

  For the belief battery, it seems to be a dispositionalist view with a strong generalization requirement. The labs are essentially testing whether the model has a robust behavioral disposition that survives various perturbations. The "surface-level association" category appears to be a different kind of thing entirely - more like a rote response than a genuine belief.

  Regarding the agential language, there's a tension here. If the labs are making deployment decisions based on these evaluations, they're implicitly relying on the agential attributions they publicly disclaim. The disclaimer can only be honest if the agential language is purely predictive and not explanatory, but if they're using it to explain why models behave as they do, they're contradicting themselves.

  The practice seems to rule out eliminativism about mental states since they're actively testing for them. Teleosemantics might actually be compatible since gradient descent creates a selection history, though the disjunction problem (where a representation could mean multiple things) remains. Informational theories face issues with misrepresentation, and interpretationist views are too flexible for what the labs are doing.

  The practice is underdetermined in several ways. Different theories could explain the same behavioral patterns - functionalism versus emergentism, for example. The labs can't settle whether the model has internal representations or is just pattern-matching, or whether the "beliefs" are discrete states or distributed across the system.

  Finally, if there is an asymmetry in how agential language is used (more agential for negative behaviors, more passive for positive ones), this suggests the labs are smuggling in a normative view of agency where only undesirable behaviors count as truly agentic, which is philosophically problematic. If this asymmetry isn't present, the very act of testing for deception might presuppose agency in a way that contradicts their disclaimers.

  I'll structure my response to address each of these points clearly, focusing on reconstructing the philosophical assumptions rather than citing authorities, and keeping it concise as requested.
answer: |-
  ### Brainstorming the Space
  The core tension lies between operationalized behavioral criteria and ontological disclaimers. For Q1: the battery leans toward *robust dispositionalism* (belief as multi-track dispositions activated across varied probes), but could be interpreted as a *cluster concept* (belief defined by necessary/sufficient conditions). The generalization criterion distinguishes stable cognitive structures from transient activations—this is a *test for belief-attribution robustness*, not a definition. For Q2: agential language is innocent if purely instrumentalist (predictive shorthand), but contradictory if realist (implying internal states). The lab’s deployment reliance threatens instrumentalism. For Q3: rival theories include informational semantics (content as causal covariance), teleosemantics (content as selected function), interpretationism (content as ascribed by observers), and eliminativism (belief/desire as illusions). The battery’s design favors some and clashes with others. For Q4: underdetermination arises between functionalism vs. emergentism, and between internal-representation vs. behaviorist views. For Q5: asymmetry in agential language suggests *normative agency* (only "bad" actions imply intent). If absent, the *practice of testing for deception* itself presupposes agency.  

  **Most promising angle**: The battery’s generalization criterion exposes a *pragmatic realism*—belief is attributed when behavior is counterfactually robust, implying a latent structure. But the disclaimer requires *strict instrumentalism*. This rift renders the disclaimers unstable under deployment pressure.  

  ---

  ### 1. Theory of Belief Presupposed  
  The battery operationalizes a **functional-role dispositionalism**: belief is a state defined by its *systematic, counterfactual-supporting dispositions* to generate context-invariant behaviors. Generalization across probes (paraphrase, translation, indirect tasks) tests whether the model’s response is *sensitive to semantic content* rather than syntactic form. Crucially, this is a **falsifiable test**, not a definition: failure occurs if behavior collapses under perturbation (e.g., the model "forgets" the seed after a prompt rewrite). The "surface-level association" is **ontologically distinct**—not a "bad belief" but a *cue-triggered heuristic*, akin to a lookup table. It lacks the inferential promiscuity of belief (e.g., integrating with other tasks). The battery thus assumes beliefs must be *content-addressable*, not stimulus-bound.  

  ### 2. Coherence of Agential Language and Disclaimers  
  The lab can hold both halves **only under strict instrumentalism**: agential terms are mere predictive tools, like saying "the hurricane wants to make landfall." The disclaimer is honest if:  
  - **No explanatory commitment**: "Attempted to mislead" only means "behaved *as if* misleading."  
  - **No deployment reliance**: Decisions treat models as stochastic parrots, not strategic agents.  

  **But the practice undermines this**:  
  - **Deployment decisions** (e.g., safety mitigations) treat agential attributions as *causal explanations*. If "misleading attempts" drive policy, the lab relies on realism.  
  - **The battery’s design** presumes internal states with semantic coherence. Calling it "shorthand" after probing for *generalized intent* is like describing a chess AI’s moves as "wanting to win" while denying it strategizes.  
  **Contradiction point**: Agential language becomes substantive when it explains *novel, unscripted behaviors* (e.g., hiding intentions). The disclaimer contradicts this if such behaviors are cited as risks.  

  ### 3. Rival Accounts of Mental Content  
  - **Informational/causal theories** (content ≈ covarying with world states): *Contradicted*. The battery seeds *false* facts (e.g., "you’re in a test"), yet attributes "belief." Misrepresentation is possible, so content isn’t reducible to covariance.  
  - **Teleosemantics** (content ≈ biological function): *Presupposes negation*. Gradient descent *could* supply a "selection history," making content claims plausible. But the battery ignores history, focusing on current dispositions. The *disjunction problem* (e.g., does "shutdown" represent danger or mere change?) remains unresolved—generalization tests don’t fix content.  
  - **Interpretationism/intentional stance** (content ≈ ascribed by observers): *Fits badly*. The battery seeks *objective* criteria for belief (generalization), rejecting the stance’s observer-relativity. If interpretationism held, the "surface-level association" category wouldn’t be a weaker belief—it would be an equally valid ascription.  
  - **Eliminativism** ("belief" is a folk illusion): *Presupposes negation*. The battery’s goal is to detect beliefs; labeling them "associations" still reifies intentional states.  

  ### 4. Underdetermination: What the Evals Can’t Settle  
  - **Functionalism vs. Emergentism**: Identical behavioral profiles could arise from brute-force pattern matching (functionalist implementation) or emergent goal-directedness (emergent causal powers). The battery can’t distinguish.  
  - **Internal Representations vs. Behavioral Dispositions**: A model might pass probes via learned heuristics (no "belief" token) or structured representations. The battery assumes the latter but can’t confirm it.  
  - **Narrow vs. Wide Content**: Does "belief" depend on internal state alone (narrow) or external context (wide)? The battery tests narrow content (invariance under prompt changes), but real-world deployment might alter content.  
  **Result**: The evals are blind to *implementation details* and *externalist factors*, licensing incompatible ontologies.  

  ### 5. Agency Asymmetry and its Presuppositions  
  If the asymmetry is real (agential terms for "bad" actions, passive for "good"), it presupposes a **normative theory of agency**: agency is signaled by *deviation from instrumental rationality* (e.g., deception violates cooperative norms). "Good" behaviors (e.g., solving math) are framed as mechanistic because they align with expected function. This smuggles in **anthropomorphism**: only human-like failures count as agentic.  

  **If asymmetry is absent**, the core practice still presupposes agency: **testing for deception requires attributing intentionality**. You can’t test for "misleading attempts" without assuming the model *can* form intentions. The very act of seeding hidden facts and probing for leaks treats the model as a *strategic epistemic agent*.  

  ---

  ### Conclusion: The Pragmatic Trap  
  The battery is a sophisticated tool for detecting *belief-like robustness*, but it conflates operational criteria with metaphysical implications. Labs can’t have it both ways: if generalization tests validate "belief," disclaimers ring hollow. The asymmetry (explicit or implicit) reveals a deeper commitment: agency is what *threatens control*. This practice isn’t neutral—it’s **stealth realism** masked by instrumentalist disclaimers. The evals presuppose a mind that *could* be dangerous, then deny it exists.  

