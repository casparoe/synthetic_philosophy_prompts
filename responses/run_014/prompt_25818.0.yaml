prompt: |-
  I've been chewing on this thing I keep seeing in arguments and I wonder if there's a name for it in philosophy. Here's the pattern. Person A does something wrong. Person B calls them out, and B's criticism is totally accurate — the facts are right, the moral reasoning is sound. But B is themselves guilty of the very same thing (or something close to it). Now, nobody's saying B's criticism is false because B is a hypocrite. The point is different: it feels like B just doesn't get to make that criticism. Like they've lost the ticket to say it, even though what they're saying is true.

  Two examples to make it concrete. First: a politician who voted to authorize an invasion gives a speech condemning another country for invading its neighbor. Everything he says about the wrongness of the invasion is correct. But there's this widespread reaction — including from people who agree the invasion is wrong — that he of all people shouldn't be the one saying it. Second, smaller scale: my cousin, who dropped out of college after one semester and has never held a job for more than six months, loves to tell his younger brother that he's "not applying himself" and "needs to take responsibility." The things he says about responsibility might be true! But coming from him, it feels like a violation of some norm, not just annoying hypocrisy.

  I can think of nearby ideas — ad hominem (but that's attacking the arguer instead of the argument, and here the argument is fine), tu quoque (but that's "you do it too so you're wrong," and I'm not saying B is wrong), and hypocrisy (but that's a character trait, and what I'm tracking is a normative fact about whether B is in a position to speak). None of them quite nail it.

  So my question: is there an established term for this — the loss of standing or entitlement to make a sound criticism because of one's own conduct? And if there is, I want more than just the label. I want to understand what exactly the phenomenon is and where its edges are. Give me exactly five things: (1) the name of the concept, if there is one, (2) a precise definition that distinguishes it from nearby ideas, (3) the best account of why the standing deficit is genuinely normative and not just a social queasiness we should get over, (4) a boundary case where it's genuinely unclear whether standing is lost, and (5) whether the concept applies only when the speaker is guilty of the same wrong, or also when they're complicit in a broader or different way. One or two sentences each, no intro or conclusion.
reasoning: |-
  Okay, the user is asking about a specific argumentative phenomenon where someone accurately criticizes another for a wrongdoing but loses the moral standing to do so because they're guilty of the same thing. They want to know if there's a philosophical term for this, along with a precise definition, normative justification, a boundary case, and clarification on applicability.

  First, I recall that this isn't just about hypocrisy or ad hominem. Hypocrisy is about inconsistency between one's actions and words, but here the issue is about the right to speak. Tu quoque is a fallacy where the argument is dismissed because the critic is also guilty, but the user emphasizes that the criticism itself is valid. So the core concept here is about moral standing or authority to criticize.

  The term that comes to mind is "standing" in moral philosophy, specifically "moral standing to blame" or "hypocritical blame". Philosophers like R. Jay Wallace and Macalester Bell discuss this. Wallace talks about the authority to hold others accountable, which can be undermined by one's own similar actions. Bell might frame it as the standing to resent being compromised by one's own guilt.

  For the definition, it's crucial to distinguish it from hypocrisy. Hypocrisy is the act of condemning others while doing the same, but the standing deficit is about lacking the normative position to issue the criticism, regardless of the truth of the claim. 

  Why is this normative and not just social discomfort? The answer lies in reciprocity and fairness. If someone violates a norm, they can't demand others follow it without addressing their own actions. It's about the conditions for legitimate moral address, not just perception.

  A boundary case could be someone with a history of the same wrongdoing but who has genuinely reformed. For example, a former alcoholic who now criticizes current alcoholics. The question is whether their past actions still nullify their standing or if reform restores it. This is debated, as some argue that reform might reinstate standing, while others feel the past wrong still lingers.

  On applicability, it can extend beyond identical wrongs to include complicity. If someone is part of a system that perpetuates the wrong, like a politician benefiting from policies they criticize, their standing might also be compromised. The key is their involvement in the relevant norm violation, not just the exact same action.

  The user might be interested in applying this concept to real-life arguments, like political discourse or family dynamics, where calling out hypocrisy is common but often misunderstood. They want to articulate why the critic's position feels invalid even when they're right. Deeper needs might include understanding moral authority in leadership or personal relationships, seeking frameworks to navigate ethical criticisms without falling into logical fallacies.
answer: |-
  Here are the five requested elements:

  (1) **Moral Standing to Blame** (or "Hypocritical Blame").

  (2) The *loss of normative authority* to issue a valid criticism due to the speaker's own violation of the relevant norm, distinct from hypocrisy (which is the behavioral inconsistency) and *tu quoque* (which wrongly claims the criticism is false).

  (3) The standing deficit is normative because reciprocal accountability is foundational to moral community; violating a norm forfeits one's authority to enforce it until one acknowledges and addresses their own wrong, preserving fairness and integrity in moral dialogue.

  (4) **Boundary Case**: A reformed alcoholic condemning someone’s current heavy drinking—unclear if their past identical wrongdoing negates standing, as repentance may restore authority, but residual guilt could undermine credibility.

  (5) Applies to **complicity or relevantly similar wrongs**, not just identical acts (e.g., a politician profiting from exploitative systems lacks standing to condemn similar exploitation, as their involvement implicates them in upholding the norm they violate).
