prompt: |-
  I'm in year four of a philosophy PhD, and the chapter I'm actually supposed to be writing is about omission causation in the tort-and-responsibility corner of my dissertation. For weeks I've been collecting my own verdicts on cases and I can't get them to line up. My supervisor keeps pushing me toward the view that an omission only causes relative to some expected or normal alternative — fine as a slogan, but I don't think it survives my list, because my list has cases where the expectation runs the wrong way and I still feel the causal pull.

  Here's the list.

  1. Lifeguard. On-duty lifeguard at a public pool, head down in his phone, a kid drowns ten feet away in the shallow end. Caused it. No hesitation at all.
  2. Strong swimmer. Same pool, same ten feet, an off-duty adult who swims competitively and could trivially have reached the kid. Watches from the deck, does nothing. My verdict: also caused it. This is the one I'm least comfortable with and I keep landing back on it anyway.
  3. Ten thousand people who could each have grabbed the kid if they'd happened to be standing right there, but were in other cities. Didn't cause it. Obviously.
  4. Famine appeal. I didn't donate; a child died of something the appeal was covering. Didn't cause it. But I don't want to justify that with "I made no difference," because the standard pitch for these appeals is that a particular donation buys a particular treatment — if I take the pitch seriously I did make a difference, and I still want to say didn't cause. If the pitch is false and it only ever works in aggregate, then I'm relying on a premise I don't believe just to save the verdict. Notice I've written that one as a problem with my own reasoning rather than as a clean intuition.
  5. Contract security. A firm contracted to patrol a lot at night doesn't; a car gets stripped. The thief was coming regardless — he'd cased the lot, knew the patrol schedule, and picked a gap in it. Didn't cause the theft, and that feels right to me.
  6. Same firm, same night, same theft, except now we stipulate that any patrol would definately have scared him off. Caused it. So 5 and 6 differ only in counterfactual dependence, and my verdicts track that, which suggests difference-making is doing real work for me.
  7. Double prevention. A would-be rescuer is about to jump in and someone grabs his ankle; the victim drowns. The ankle-grabber caused it, clearly. Now: instead of grabbing him, I take the only phone on the deck and make a long personal call, so he can neither summon help nor be talked into jumping. Also caused it, I think, and I think the two are the same kind of thing — but one is an act and one is an omission, and whatever I end up saying has to explain why that difference doesn't matter here while mattering enormously elsewhere on this list.
  8. Late lifeguard. He looks up at twelve seconds, sees the kid struggling, freezes; by twenty-five seconds its unrecoverable. Caused, but "caused the death" feels like overreach and "caused the death's being unrecoverable" feels like a lawyer's dodge. I want one thing to say here and I don't have it.
  9. The pair that breaks me. An off-shift nurse walks past a corridor that isn't her ward, no assignment, no handover, sees a visitor slumped against the wall going into cardiac arrest, keeps walking. Caused it, I say. A hospital janitor in the same corridor at the same instant, same inaction, no medical training. Didn't cause it, I say. Nothing about duty, contract, employment, or local expectation separates these two — she's off shift and nobody was expecting anything from her — and the only thing that separates them is capacity and knowledge. But if capacity is the discriminator, cases 3 and 4 explode, since there were plenty of capable people in both.

  So. Is there a principle that gets 1 through 9, or nearly all of them? I want it stated as clauses, not as a slogan, with a line on which case each clause is doing work for and what it costs to keep that clause. If the honest answer is that you can save everything at the price of an ugly extra condition, or have a clean account that forces me to give up 2 and 9, tell me which trade you'd take and argue for it. And tell me straight which of my verdicts your principle can't accommodate — don't quietly redescribe the cases until they fit, which is what I've caught myself doing all month.

  Then tell me what the principle says about a case I haven't listed, because I suspect it'll be embarrassing: nobody alive today cuts emissions, and in 2060 a hurricane kills one particular named person. Under 3 and 4 that looks like mass non-causation; under 2 and 9 it looks like the largest collection of difference-making, highly capable omissions there has ever been. What's the verdict, and is it one I could defend to a tort lawyer without her laughing at me?

  Last thing, and it's the one I'd most like pressure on: transitivity. If the lifeguard's failure causes the death, and the supervisor's failure to check on the lifeguard causes the lifeguard's failure, does the supervisor's omission cause the death? I want to say yes. But if I say yes I have to say the same about the company that hired the supervisor and the city that licensed the company, and I arrive back at case 3 by a staircase instead of by a leap. Where do I cut, and can the cut be given as a principle rather than a shrug?

  No literature review please — I've got the stack of papers on my desk and I've read most of them. I want the analysis, the clauses, and an honest account of where you think I'm fooling myself.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're a fourth-year PhD student in philosophy, struggling with omission causation in tort law and responsibility. They've collected several cases where their intuitions about causation don't align with existing theories, especially the idea that omissions cause harm only relative to expected or normal alternatives. 

  First, I need to unpack their cases. The lifeguard and strong swimmer cases (1 and 2) both feel like causation, even though the strong swimmer has no duty. That challenges the duty-based view. Then cases like 3 and 4 (distant people and famine appeal) don't feel like causation, even if capable. The contract security cases (5 and 6) show counterfactual dependence matters, but then double prevention in case 7 blurs act vs. omission. Late lifeguard (8) is tricky—partial causation? The nurse and janitor (9) highlight capacity vs. duty conflict.

  The user wants a principle that covers all these without ad-hoc fixes. They also worry about transitivity leading to over-attribution, like in the emissions example. Their deeper frustration is with inconsistent intuitions and theory not fitting real cases. They need clarity for their dissertation chapter, so a structured, clause-based approach is essential.

  Looking at their list, the key tensions are: capacity vs. duty, counterfactual dependence, and transitivity. The famine case is especially telling because they reject the "no difference" argument even if the charity's pitch implies individual impact. That suggests they need a factor beyond difference-making. 

  The transitivity problem is critical. If each link in the chain (supervisor, company, city) causes the next omission, it cascades to all capable individuals, which contradicts case 3. So the principle must block transitivity at some point without arbitrariness.

  I recall that difference-making alone isn't sufficient, as per case 5 (no patrol but thief came anyway) vs. 6 (patrol would've stopped it). But capacity without duty (strong swimmer, nurse) still feels causal. So maybe a blend of factors: difference-making plus a "relevant capacity" tied to contextual expectations, not just duty. 

  For the nurse/janitor case, the difference might be "role-derived capacity"—even off-shift, a nurse's training makes her inaction salient in a medical context, while a janitor's isn't. That avoids collapsing into general capacity, which would implicate distant capable people. 

  The emissions case is tough. If we use the principle, no single person's omission is salient or contextually expected to prevent the hurricane death, so non-causation. But the user fears this might seem indefensible. However, tort law focuses on proximate cause, not all difference-makers, so maybe it's defensible by emphasizing contextual salience.

  Transitivity needs a cutoff. The principle could include that omissions cause only if they directly enable the harm or are linked by a "responsibility-preserving" chain. The supervisor's omission causes the lifeguard's failure, but the city's licensing doesn't directly enable the specific harm—it's too remote. Proximate cause doctrines might help here.

  The user might be fooling themselves in case 2 (strong swimmer). If capacity alone suffices, why not the famine case? They might be conflating moral responsibility with causation. The principle needs to decouple these by emphasizing contextual salience over mere capacity.

  Clauses could combine: difference-making, contextual salience (expectation/role/capacity nexus), and direct enablement. This covers most cases without overreach. For the late lifeguard, partial causation is acceptable—causing the unrecoverable state is still causing an aspect of the harm.

  Honest trade-offs: The principle might struggle with case 4 if the donation pitch is literal. But if we argue that the context (mass appeal) dilutes salience, it holds. Case 2 might be an outlier, but keeping it requires accepting that salient capacity can stand without duty, which risks overextension. However, the user's intuition there is strong, so maybe it's worth the cost.

  In the end, the user needs a principled but flexible framework that matches intuitions without collapsing into triviality. Highlighting the contextual factors and blocking transitivity through directness or salience decay can provide that structure.
answer: |-
  Here's a principle structured as clauses, designed to capture your verdicts as stated, with explicit trade-offs and an honest assessment of pressure points:

  **The Principle of Contextually Salient Capacity + Difference-Making (CSCD):**

  1.  **Difference-Making Requirement (DM):** An omission is causal *only if* the occurrence of the omitted action would have prevented (or substantially reduced the probability of) the specific harm *in the specific circumstances*. (Works for: Distinguishing 5 vs. 6; Underpins 1, 2, 4 (if pitch true), 6, 7, 8, 9 (nurse). Explains *absence* in 3, 4 (if pitch false), 5, 9 (janitor)).
  2.  **Contextually Salient Capacity Requirement (CSC):** An omission satisfies DM *and* is causal *only if* the agent possessed the *capacity* to perform the omitted action *and* this capacity was *salient within the specific normative or practical context* surrounding the potential for harm. Salience arises from:
      *   **(a) Role/Occupational Duty:** Formal or widely recognized responsibilities tied to a position (e.g., lifeguard on duty, security firm under contract). (Works for: 1, 6).
      *   **OR (b) Proximity + Unique Opportunity:** Physical nearness and temporal immediacy *combined* with the ability to act effectively where few or no others present share that specific capacity/opportunity. (Works for: 2 (strong swimmer *on deck*), 7 (phone-taker preventing *the only available* phone use), 8 (lifeguard present)).
      *   **OR (c) Intervention in a Chain:** Actively preventing another potential intervenor who *did* have CSC (via a or b) from acting. (Works for: 7 (ankle-grabber *and* phone-taker preventing *the would-be rescuer*)).
  3.  **Exclusion:** DM without CSC is *not* sufficient for causal attribution in omission. (Works for: Explaining *absence* in 3, 4, 5, 9 (janitor)).
  4.  **Partial Causation:** An omission can cause a *worsening* or *failure to mitigate* harm, even if it didn't initiate the harmful sequence, provided DM and CSC are satisfied. (Works for: 8 - Causes the death *becoming unrecoverable*; this isn't a dodge, it's specifying *what aspect* of the outcome the omission caused).

  **How it Handles Your Cases:**

  1.  **Lifeguard:** DM + CSC(a) (Role) = **Caused**.
  2.  **Strong Swimmer:** DM + CSC(b) (Proximity + Unique Opportunity - *on deck*, capable, immediate) = **Caused**. *(Trade-off: This is the clause's most contentious application. It risks overextension, but captures your intuition. It relies *heavily* on the immediacy and uniqueness of the opportunity on the scene).*
  3.  **Ten Thousand:** DM *may* hold (if any *could* have been there) but *no CSC* (no proximity, no salient capacity/opportunity in context) = **Not Caused**.
  4.  **Famine Appeal:** *If pitch is true:* DM holds. *But no CSC:* No proximity, no role, no unique opportunity/salience in context (you are one of millions). = **Not Caused**. *If pitch is false:* DM fails. = **Not Caused**. *(Cost: Requires biting the bullet that the literal truth of the pitch doesn't magically create contextual salience for you specifically. The "context" is mass appeal/donation, inherently diluting individual salience).*
  5.  **Contract Security (Thief Coming Regardless):** DM fails (patrol wouldn't have prevented *this* theft) = **Not Caused**. CSC(a) irrelevant without DM.
  6.  **Contract Security (Patrol Would Scare):** DM holds + CSC(a) (Role) = **Caused**.
  7.  **Double Prevention (Act):** DM holds + Likely CSC(c) (Preventing rescuer) or CSC(b) (Proximity/Opportunity) = **Caused**.
      **Double Prevention (Omission - Phone):** DM holds + CSC(c) (Preventing *the would-be rescuer* from using *the only phone*) = **Caused**. *(The act/omission distinction is secondary here; both satisfy CSC by targeting the salient potential intervenor)*.
  8.  **Late Lifeguard:** DM holds (acting at 12s *would* have prevented death) + CSC(a) (Role) + Clause 4 (Caused the death *becoming unrecoverable*). **Caused (the fatal outcome)**. *(Clause 4 avoids the "dodge" feeling by making partial causation central)*.
  9.  **Nurse (Off-Shift):** DM holds + CSC(b) (Proximity + Unique Opportunity - *present*, possesses *unique medical capacity* in that immediate context, even off-shift). = **Caused**.
      **Janitor:** DM holds *but no CSC:* No role-duty (not medical staff), proximity but *no unique relevant capacity/salience* (medical training is key context). = **Not Caused**. *(Trade-off: CSC(b) does the heavy lifting here, relying on *capacity* being part of contextual salience in a medical emergency setting. This avoids needing "duty" but uses "salient capacity within context").*

  **Where You Might Be Fooling Yourself:**

  *   **Case 2 (Strong Swimmer):** Your intuition here is strong, but it's the biggest strain on the system. CSC(b) captures it, but *only* by emphasizing the extreme immediacy ("on deck") and uniqueness of *that specific person's* opportunity/capacity *at that exact moment*. This is *very* context-bound. If the strong swimmer was 50 feet away or just arriving, it likely wouldn't hold. Your discomfort might stem from sensing how close this is to the Janitor case, but CSC(b) distinguishes based on the *salience of their specific capacity* in the immediate emergency (swimming rescue vs. medical intervention). **Pressure Point:** Is "salience" doing real work, or is it just capacity+difference-making dressed up? The test is whether you'd hold a *different* capable person on the deck (e.g., a strong non-swimmer with a nearby life ring) causal? If not, then capacity *type* matters for salience.
  *   **Case 4 (Famine):** You're right to reject "no difference" if the pitch is true. CSC resolves it cleanly by denying *contextual salience*, not difference-making. The cost is accepting that causation requires more than just being a difference-maker; it needs a specific contextual hook. This might feel like giving up on pure counterfactualism, but your cases demand it (cf. 5 vs 6, 3).
  *   **Case 9 (Nurse/Janitor):** You're separating them based on capacity/knowledge, not duty. CSC(b) formalizes this. The potential self-deception might be in **minimizing the context**. A hospital corridor, a medical emergency – this context *makes* medical training salient in a way it wouldn't be on the street. The janitor's capacity isn't salient *for this type of harm in this setting*. If the harm was a spill they could clean to prevent a slip, it *might* be different.

  **The 2060 Hurricane Case:**

  *   **Verdict:** Mass non-causation (like 3 & 4).
  *   **Why (using CSCD):** DM likely holds for billions (their specific emissions reductions *would* have made a difference to that specific hurricane/victim, assuming complex climate models). *But* CSC fails utterly for any individual. No role-duty (for almost all), no proximity/unique opportunity (the harm is distant, diffuse, mediated by complex systems; no individual is saliently positioned *in the context of climate change causation*). The "capable people" are globally distributed, acting independently; no single omission creates a saliently unique opportunity to prevent *that specific harm*.
  *   **Defending to a Tort Lawyer:** Focus on **proximate cause** and **duty**. Tort law already rejects liability for pure omissions without a pre-existing duty (like your contract security case 5 vs 6). CSC mirrors this. Argue: "While each omission is a difference-maker in a vast causal web, no individual's omission was the *proximate cause* of this specific victim's death in the hurricane. The causal chain is too attenuated, involving countless intervening acts and natural forces. More importantly, no individual had a *legal duty* to this specific future victim to reduce emissions, nor were they in a position of unique, immediate opportunity to prevent *this specific harm* in a way the law recognizes as creating responsibility. Liability requires both causation-in-fact and proximate cause/duty; CSC captures why the omissions here fail the second limb, even if they technically satisfy the first (DM)." They might still laugh at the *scale*, but the *structure* of the argument aligns with tort principles (duty, proximate cause, no liability for pure omissions absent duty).

  **Transitivity (The Staircase Problem):**

  *   **The Problem:** Lifeguard omission (O1) causes death (D). Supervisor omission (O2) causes O1. Company omission (O3) causes O2? City omission (O4) causes O3? ... Soon, everyone causes D.
  *   **CSCD Solution (Cut Point):** Transitivity *fails* for omissions when the downstream omission (O1) *breaks the chain of contextual salience* for the upstream omission (O2, O3, etc.).
  *   **Clause:** **Non-Transitivity of Salience:** If an omission O2 causes O1 (the immediate omission that causes harm D), O2 causes D *only if* O2 *itself* satisfies the CSC requirement *relative to the harm D*. Causing an omission (O1) that causes D does not automatically mean O2 causes D; O2 must meet CSC for D on its own merits.
  *   **Application:**
      *   O1 (Lifeguard): CSC(a) for D = Causes D.
      *   O2 (Supervisor): *May* cause O1. Does O2 satisfy CSC for D? Likely **Yes**: Supervisor has a *role-duty* (CSC(a)) specifically related to *preventing pool deaths* (the harm D). Their omission *directly* undermines the system meant to prevent D. They are saliently responsible *for D prevention*.
      *   O3 (Company hiring): *May* cause O2 (if negligent hiring caused supervisor omission). Does O3 satisfy CSC for D? **Unlikely**: While they have a general duty, the *salience* is weaker. Their omission (bad hiring) is several steps removed from the *specific context* of guarding *that pool* on *that day*. It's more about systemic failure than proximate, salient opportunity/capacity regarding D. Likely **does not cause D**.
      *   O4 (City licensing): *May* cause O3. Does O4 satisfy CSC for D? **No**. Utterly lacks contextual salience/proximity/unique opportunity regarding *this specific D*. Systemic, remote. **Does not cause D**.
  *   **Cut:** Between O2 (Supervisor) and O3 (Company). The supervisor's role-duty is still saliently connected to the *specific type of harm* (Drowning) in the *specific operational context* (Pool safety). The company's failures are more general (hiring, oversight) and less proximately linked to the immediate, salient prevention opportunity for *this specific D*.
  *   **Cost:** It requires judging CSC *for each omission relative to the final harm D*, not just relative to the next link in the chain. It rejects simple causal transitivity for omissions. The "cut" is principled based on the decay of contextual salience relative to the specific harm as we move up the chain.

  **Honest Trade-off Assessment:**

  *   **Clean Account (Sacrifice 2 & 9 Nurse):** If you demand CSC *only* from Role/Occupational Duty (CSC(a)), you get a clean, duty-based account. You save 1, 3, 4, 5, 6, 7 (act easily, omission via CSC(c) might be lost), 8, 9 (janitor). But you **lose 2 (Strong Swimmer) and 9 (Nurse)**. This might be preferable if you think your intuitions on 2 & 9 nurse are moral (you *should* have acted!) bleeding into causal judgment.
  *   **"Ugly" Account (CSCD - Keep 2 & 9 Nurse):** The proposed CSCD keeps all 9 verdicts. The "ugliness" is the reliance on "Contextual Salience," especially CSC(b) (Proximity + Unique Opportunity) and its application to Case 2. It risks being less crisp than pure duty-based views. The trade-off is accepting a slightly fuzzier concept (salience in context) to capture strong intuitions about non-duty-holding capable intervenors in immediate situations.
  *   **My Choice:** I'd take the CSCD trade-off. Your intuitions across the cases, especially the stark difference between the Nurse and Janitor *in that context*, and the pull of the Strong Swimmer, are powerful data points that a purely duty-based view ignores. "Contextual Salience" provides a framework to distinguish relevant capacity from mere capacity. The hurricane case shows it avoids absurdity.

  **Final Pressure Point:** CSC(b) (Proximity + Unique Opportunity) is the linchpin for 2 and 9 (nurse). Scrutinize *hard* whether "salience" is genuinely doing work beyond capacity + DM + your moral feelings. Test it with variants: Would a *trained first-aider* (not a nurse) walking past the slumped visitor be causal? (CSCD: Likely Yes, CSC(b)). What if the janitor *was* a trained EMT doing volunteer work, but off-duty at the hospital? (CSCD: Tricky, but leaning towards **Yes** - the specific medical capacity might create salience even without hospital role). If these verdicts feel wrong, CSCD needs refinement or you need to sacrifice Case 2.
