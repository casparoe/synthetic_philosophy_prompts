answer: |-
  Here’s a systematic map of challenges to the moral equality of combatants (MEC) doctrine, ranked by severity, with an analysis of which objections defenders would concede as genuine versus dismiss:

  ### **I. The Liability Problem: Killing the Non-Liable**  
  **Core Challenge**: If unjust combatants are *not liable* to defensive harm (due to lacking personal responsibility), how can killing them be permissible?  
  **Rank**: **Fatal if unresolved** – threatens the doctrine’s coherence.  

  - **Defender’s Move**: *Forced Choice/Necessity* Analogies:  
    - **Car Thief** (unjust combatant as non-malicious threat): Permissible to kill to save oneself, even if thief isn’t morally culpable.  
    - **Mentally Ill Attacker**: Self-defense justified against non-responsible threats.  
  - **Costs & Limits**:  
    - **Scale/Duration**: Analogies assume *imminent, one-off* threats. War involves sustained, large-scale harm – weakening the "lesser evil" justification.  
    - **Lesser Means**: In war, alternatives (retreat, surrender) are often implausible, but combatants *could* defect or refuse orders (unlike the mentally ill attacker).  
    - **Moral Asymmetry**: In analogies, the defender is *innocent*. In war, both sides may be partially responsible (e.g., voting citizens, volunteers).  
  - **Defender’s Concession**: Most concede the analogy is *imperfect* but necessary to avoid "absolutism." They reject the "straw man" that MEC permits *any* killing – only *in-bello proportionate* acts.  

  ### **II. Epistemic Qualification: "We Can’t Know Who’s Just"**  
  **Rank**: **Potentially Fatal in Edge Cases** – undermines universal application.  
  - **Collapse Cases**:  
    - **Manifest Aggression** (e.g., Nazi invasion of Poland): Defenders often concede MEC *weakens* here but insist soldiers *on the ground* may still lack certainty or alternatives.  
    - **Volunteers/Mercenaries**: Defenders may grant these combatants *can* be culpable if they *knowingly* join an unjust war – but stress this is *ad bellum* blame, not *in bello* liability.  
    - **Conscript Learning the Truth**: MEC defenders maintain the conscript *may still fight* if refusal is futile/dangerous (relying on "lesser evil" necessity).  
  - **Defender’s Stance**: The epistemic argument is **core to MEC** but not exhaustive. They concede manifest aggression challenges MEC’s *practical applicability* but not its *normative core*.  

  ### **III. Collective-Responsibility Premise**  
  **Rank**: **Awkward to Damaging** – questions the "soldier as tool" model.  
  - **Counterexamples**:  
    - **Soldiers with Aggressive Intent** (e.g., SS zealots): Defenders may concede *some* combatants bear personal guilt, but insist MEC applies to the *role* of combatant, not individual motives.  
    - **Command Responsibility**: Senior officers (who shape strategy) may lose MEC protection – but defenders isolate this from the "ordinary soldier."  
    - **Essential Contribution**: A soldier whose *specific act* (e.g., launching an invasion) is intrinsically unjust strains MEC. Defenders retreat to "war is collective action" – no individual triggers *ad bellum* wrong alone.  
  - **Defender’s Concession**: They grant that *high-responsibility actors* (generals, politicians) fall outside MEC’s scope. For rank-and-file, they hold firm.  

  ### **IV. Predictive Differences vs. Individualism**  
  Where MEC and individualism *diverge in practice*:  
  1. **POW Punishment**:  
     - *MEC*: Unjust combatants can only be punished for *in bello* crimes (e.g., torture), not for fighting per se.  
     - *Individualist*: Unjust combatants *could* be tried for aggression.  
     - **Defender’s View**: A **feature** – punishes war crimes, not "wrong side" status.  

  2. **Moral Weight of Killings**:  
     - *MEC*: All combatant deaths are equally tragic.  
     - *Individualist*: Killing an unjust combatant is less wrongful (or even justified).  
     - **Defender’s View**: A **feature** – prevents dehumanization of the "enemy."  

  3. **Refusing to Fight**:  
     - *MEC*: Soldiers *may* fight even knowing their cause is unjust (if conscripted/coerced).  
     - *Individualist*: Refusal is obligatory once unjustness is known.  
     - **Defender’s View**: A **qualified feature** – stresses the "role obligation" of soldiers.  

  4. **Fighting for a Foreign State**:  
     - *MEC*: Permissible if the soldier believes the cause is just.  
     - *Individualist*: Highly suspect (e.g., mercenaries for aggressors).  
     - **Defender’s View**: Ambiguous – most reject mercenaries but accept "ideological volunteers" (e.g., Spanish Civil War).  

  ### **V. Honest Assessment: Falsifiability?**  
  - **Insulation Risk**: The epistemic and collectivist premises **do** shield MEC from falsification:  
    - If soldiers "can’t know," MEC survives manifest aggression.  
    - If responsibility is always collective, no individual combatant is liable.  
  - **Is This a Problem?**  
    - For critics: Yes – MEC becomes an unfalsifiable *presumption*.  
    - For defenders: No – MEC is a **normative framework** for judging *conduct*, not a testable empirical claim.  
  - **How Individualism Wins**: It must show that:  
    1. *Ad bellum* injustice **directly** affects *in bello* permissions (e.g., unjust combatants lose their "right to fight").  
    2. Soldiers can **reasonably assess** their side’s justice (rejecting epistemic skepticism).  
    3. **Individual agency** in war outweighs collective role obligations.  

  ### **Defender’s Likest Concessions**  
  1. The "self-defense vs. non-liable" analogy **falters in prolonged wars** lacking imminence/alternatives.  
  2. MEC **weakens dramatically** in wars of **manifest aggression** (e.g., Iraq’s invasion of Kuwait).  
  3. **Volunteers/mercenaries** for blatantly unjust causes strain the "soldier as blameless tool" model.  

  ### **Your Instincts Confirmed**  
  - **Epistemic/Collectivist Premises**: Defenders rely heavily on these; they are MEC’s backbone.  
  - **Self-Defense Analogy**: Its fragility is widely acknowledged (even by McMahan).  
  - **Volunteers**: The weakest link – defenders often sidestep by focusing on conscripts.  

  **Conclusion**: MEC survives through its normative premises (collective responsibility, epistemic humility), not empirical robustness. Its power lies in *practical* application to real-world fog-of-war scenarios, but it struggles at conceptual extremes. A rival individualist theory must prove soldiers *can and must* judge *ad bellum* justice – and that doing so changes their *in bello* permissions.
