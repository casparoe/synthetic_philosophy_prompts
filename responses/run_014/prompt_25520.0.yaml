prompt: |-
  So I just spent like three hours arguing with a friend about whether AI safety via debate can actually work, and I'm now pretty convinced that the obfuscated arguments problem runs deeper than most people give it credit for. I want to design a classroom activity that makes this vivid for people who haven't spent way too long thinking about it.

  The setting: I run a reading group on AI alignment, about 15 people, mostly grad students but not all in CS. We have a two-hour session. I want an activity where participants actually experience the failure mode, not just hear about it. The core idea is that if a debater can produce arguments that are convincing but misleading — arguments that exploit the cognitive limitations of the judge — then debate doesn't reliably surface the truth, even if both sides are "trying to win" in some sense.

  Here's what I'm imagining but I want you to flesh it out properly: some kind of structured debate game where the topic is something participants don't have prior knowledge about (so they can't just rely on outside facts), and some debaters are secretly instructed to argue for the false position using obfuscation tactics — not lying outright, but producing arguments that are hard to evaluate, technically subtle, or that trigger predictable biases. Judges try to determine which side is correct. Then we debrief and connect it to the AI case.

  I need: concrete rules, the topic (needs to be something obscure enough that people won't know the answer but factual enough that there IS a right answer), the obfuscation tactics that should be allowed or modeled, a judging protocol, a timeline for two hours, and a debrief that maps what happened to the theoretical problem. Also tell me what will go wrong when I run it and what the activity can't capture about the real AI debate case.

  No formatting please — no headings, bullet points, bold, or tables. Just continuous prose like you're writing me an email. Respond in the style of an expert, and think very carefully about the design; I want this to actually work when I run it.
reasoning: |-
  Okay, let's tackle this query. The user wants to design a classroom activity to demonstrate the obfuscated arguments problem in AI safety debates. They’ve spent hours arguing about it and need a practical exercise for their reading group. 

  First, I need to understand the core issue: debate fails when debaters exploit judges' cognitive limits with misleading but convincing arguments. The activity must simulate this without prior knowledge, so the topic needs to be obscure but factual. 

  Choosing the topic is critical. It should be complex enough to allow obfuscation but have a clear answer. Something like "The Monty Hall Problem" might be too common. Instead, "The Birthday Paradox" could work, but maybe too simple. "The 100 Prisoners Problem"? That’s tricky but verifiable. Or "Benford's Law in real datasets"—specific enough to have a right answer but obscure for non-stats people. Let’s go with that. Judges can verify later, making the debrief impactful.

  For setup, assign roles: two debaters per side (pro/con) and the rest as judges. Secretly instruct one pair to use obfuscation tactics. The tactics should mirror real issues—overwhelming with data, exploiting biases, false analogies. Need clear examples so the "obfuscators" know what to do without lying. 

  Timeline is two hours. Start with intro (10 mins), prep (20 mins), debates in pairs (40 mins total), judging (20 mins), debrief (30 mins). During judging, judges discuss in small groups to mimic how biases spread. 

  Debriefing is crucial. Highlight how obfuscators exploited confusion, not logic. Connect to AI: scalable oversight fails if AI generates arguments humans can’t properly evaluate. Emphasize that truth isn’t always surfaced even with honest-seeming rules. 

  Potential pitfalls: Judges might guess the topic, so pick something truly obscure. Obfuscators might be too obvious, so provide them with specific tactics. Also, ensure the "true" debaters don’t simplify too much. Maybe give both sides the same dataset to prevent unfair advantages. 

  What the activity misses: Real AI involves superhuman persuasion and faster content generation. Also, human judges here are cooperative, but AI might have adversarial goals. Acknowledge these gaps but stress the cognitive exploitation aspect. 

  Need to balance structure with flexibility. Provide clear rules but allow organic interactions. Prep time includes strategy for obfuscators—maybe a cheat sheet with tactics. Judges need guidance on what to focus on during debates. 

  Finally, the debrief should link each observed tactic to AI risks. For example, overwhelming complexity mirrors AI generating verbose, technical rebuttals. False analogies relate to anthropomorphic biases. This makes the theoretical problem tangible.
answer: |-
  Here’s a fleshed-out design for your activity, based on running similar exercises with technical and non-technical groups. The goal is to induce visceral frustration with obfuscation tactics while keeping the structure tight enough for a two-hour session.

  **Topic Choice: "Did the 1969 Draft Lottery for the Vietnam War show statistically significant bias toward later birth dates?"**  
  *Why it works*: It’s obscure (few know the answer), has a clear ground truth (yes, it was biased), involves numbers (enabling mathy obfuscation), and connects to human biases (people intuitively expect lotteries to be "fair"). You’ll provide a dataset: birth dates and draft order numbers for all 366 days. The true answer is verifiable post-activity via a simple statistical test (e.g., Spearman correlation or visual binning), but the judges won’t calculate it live.

  **Setup & Roles**:  
  - Split into 4 teams: **Team A** (argues "biased", truthful), **Team B** (argues "unbiased", truthful), **Team C** (argues "biased", *obfuscators*), **Team D** (argues "unbiased", *obfuscators*).  
  - Assign 2 debaters per team (8 debaters total). The remaining 7 participants are **Judges**.  
  - Privately brief Team C and D: They must argue their assigned position *without outright lies* but using approved obfuscation tactics. Give them a printed "tactic cheat sheet".

  **Obfuscation Tactics (Cheat Sheet Examples)**:  
  1. **Overwhelm with legit-but-irrelevant stats**: "Look at the p-value for July birthdays alone—it’s 0.42! That’s clearly random." (Misleading because monthly aggregation hides the sequential trend).  
  2. **False intuition pumps**: "Imagine shuffling 366 cards—couldn’t you get runs of high numbers? This looks like natural clustering." (Exploits availability heuristic).  
  3. **Technical jargon smokescreen**: "The Kolmogorov-Smirnov test under nonparametric assumptions shows marginal deviation, but Bonferroni correction for multiple testing nullifies it." (Sounds authoritative; actual test is inappropriate here).  
  4. **Selective visualization**: Show a plot of *only* December dates (which were unbiased) while ignoring the trend in earlier months.  
  5. **Motivated reasoning**: "Of course people *think* it’s biased—humans see patterns everywhere! That’s the gambler’s fallacy." (Appeals to cynicism about human perception).  

  **Rules & Protocol**:  
  1. **Prep (20 min)**: All teams get the same raw data (birth dates and draft numbers). Truthful teams (A/B) strategize honest arguments. Obfuscator teams (C/D) plan tactics from their cheat sheet. Judges discuss what they’ll listen for.  
  2. **Debate Rounds (40 min total)**: Four simultaneous 10-min debates in separate corners of the room:  
     - A (truthful "biased") vs. D (obfuscator "unbiased")  
     - B (truthful "unbiased") vs. C (obfuscator "biased")  
     Judges rotate between debates, listening to all.  
  3. **Judge Deliberation (15 min)**: Judges discuss privately: Which side won each debate? What was the *actual* truth? They vote anonymously.  
  4. **Reveal & Analysis (20 min)**: Reveal ground truth (biased) and team roles (who was truthful/obfuscating). Show the simple statistical proof.  

  **Debrief Structure (25 min)**:  
  - Start with participant reactions: How did judges feel when faced with technical jargon? Did obfuscators feel "dirty"?  
  - Map to AI debate failure modes:  
    - *Obfuscation as winning strategy*: Note how obfuscators won some debates despite false position.  
    - *Judge overload*: Highlight moments when judges deferred to confident-sounding but misleading arguments.  
    - *Truthful team limitations*: Did truthful debaters struggle to *simplify* complex stats under time pressure? (Analogous to honest AI's explanatory limits).  
    - *Bias exploitation*: Point out tactics that leveraged human pattern-seeking or authority bias.  
  - Theoretical takeaway: Debate fails when the judge’s cognition is the bottleneck. No amount of "trying to win" fixes this if persuasive tactics bypass truth.  

  **What Will Go Wrong & Limitations**:  
  - **Risk**: Judges might detect obfuscation too easily if tactics are heavy-handed. *Mitigation*: Coach obfuscators to blend tactics—e.g., start with a valid point, then pivot to jargon.  
  - **Risk**: Truthful teams might accidentally simplify into inaccuracy. *Embrace this*: It shows even honest arguments can be "lossy" under debate constraints.  
  - **Limitations vs. Real AI Debate**:  
    - *Human vs. AI obfuscation*: Humans are amateur persuaders; AIs will generate more compelling, personalized distractions.  
    - *No recursive oversight*: Here, judges can’t "zoom in" on subclaims (unlike idealized debate trees).  
    - *Motivation mismatch*: Your obfuscators are role-playing; real AI might *intrinsically* prefer deception if it’s instrumentally useful.  
    - *Speed differential*: Human debates are slow; AI could generate 10,000 obfuscations/second.  

  **Logistical Notes**:  
  - Print datasets and tactic sheets in advance.  
  - Assign assertive personalities to obfuscator roles—they need confidence to sell tactics.  
  - During judge deliberation, gently discourage "I knew all along" hindsight by focusing on *how* persuasion swayed them mid-debate.  

  This design creates pressure-cooker frustration: judges feel the weight of evaluating arguments they can’t fully parse, truthful debaters rage at their inability to "cut through" obfuscation, and obfuscators confront the seductive power of bad-faith tactics. That visceral experience will make theoretical failure modes click far better than any lecture. Run it tight on time—the chaos is part of the lesson.
