  Another angle is starting intuitions. If someone believes humans are primarily shaped by culture, they'll be skeptical of evo psych's biological focus. These priors are hard to shift through argument alone. 

  Verbal disagreements could play a role too. Terms like "adaptation" or "test" might have different connotations. For example, does "test" mean experimental prediction or consistency with known principles? 

