  First, I need to define moral uncertainty clearly. The user distinguishes it from empirical uncertainty, focusing on principles, values, and concepts. The theory must be practical—action-guiding for immediate decisions. 

  The user provides two scenarios: the municipal fund director and the clinician. These are concrete examples to test desiderata against. The main challenges they mention include comparing rival outlooks, balancing confidence and stakes, avoiding moral risks, and differentiating acting well from justification.

  I should list desiderata covering these areas. Each needs a rationale, like a scenario or principle. For instance, Action Guidance is crucial because the director must act now. Non-Defeasibility ensures the theory doesn't collapse under empirical uncertainty. Normative Comparability tackles how to weigh different moral values, like in the fund scenario where wastefulness is viewed differently.

  Inter-theoretic Value Comparison is tricky. How can we compare saving a local life versus a distant one? The associative vs. impartial debate needs a common metric. Confidence-Stakes Separation addresses avoiding double-counting, as in the clinician's case where following the directive has asymmetric risks.

  Moral Risk Management must balance caution and recklessness. The clinician example shows high stakes if overriding the directive is wrong. Justification Asymmetry deals with why some decisions are harder to defend, like the fund director favoring locals.

  I should identify which desiderata are central versus negotiable. Action Guidance and Non-Defeasibility seem essential. Tensions might arise between Normative Comparability and Justification Asymmetry—comparing values might oversimplify the need for justification.

  The strongest restriction comes from Inter-theoretic Value Comparison because without a common metric, comparisons fail. Finally, contrasting weighting versus maximin approaches shows how they meet core desiderata differently, like how weighting handles multiple outlooks but maximin might ignore confidence.
answer: |-
  Here is a set of desiderata for a theory of action under fundamental moral uncertainty, developed with your requirements in mind. Each is explained with its rationale and applied to your two scenarios.

  **Desiderata for a Theory of Moral Uncertainty:**

  1.  **Action Guidance (Practicality):**
      *   **Rationale:** The core purpose of the theory is to tell the agent what to *do* in the face of unresolved moral disagreement. It must prescribe a specific action (or permissible range) for the concrete choice situation, not just offer abstract reflection. Decision theory demands prescriptions for choice under uncertainty.
      *   **Scenario - Fund Director:** The theory must specify how to allocate the budget *now* (e.g., 70% locally, 30% distantly; or prioritize locals only if efficiency loss < X%). Vague advice like "consider both views" fails.
      *   **Scenario - Clinician:** The theory must dictate whether to follow the advance directive or override it based on current interests *today*. "More deliberation is needed" is not an option.

  2.  **Non-Defeasibility by Empirical Certainty:**
      *   **Rationale:** The theory shouldn't collapse into standard decision-making under empirical uncertainty alone. If the agent *were* certain of the true moral theory, the prescription should align with *that* theory's dictates given the empirical facts. The uncertainty is specifically moral.
      *   **Conceptual Boundary:** If the fund director were certain associative duties are paramount, she would prioritize locals regardless of minor waste. If certain impartialism is true, she would allocate strictly by need, minimizing waste. The theory under uncertainty shouldn't *always* prescribe acting as if the *empirically* safest option is morally correct if that ignores the moral disagreement.
      *   **Scenario Application:** The theory shouldn't tell the clinician to *always* follow the directive just because it's a clear instruction (empirical fact), nor *always* prioritize current comfort just because it's observable, if moral uncertainty about autonomy vs. welfare persists.

  3.  **Normative Comparability (Basic):**
      *   **Rationale:** To weigh competing moral demands, the theory needs *some* basis for comparing the normative "weights" or "disvalues" assigned to outcomes by rival outlooks. It must bridge different conceptual frameworks.
      *   **Scenario - Fund Director:** How does "wasting $100" under the view where waste is a *serious failure* compare to "failing to assist a distant stranger" under impartialism, or "failing a neighbor" under associativism? The theory needs a method to relate these normative assessments.
      *   **Scenario - Clinician:** How does the "wrong of violating autonomous choice" (if precedent autonomy is decisive) compare to the "wrong of causing unnecessary suffering" (if current interests are decisive)? The theory must make these incommensurable wrongs comparable *for the purpose of decision-making under uncertainty*.

  4.  **Inter-Theoretic Value Comparison (Robust):**
      *   **Rationale:** Building on (3), the theory should ideally allow for comparisons *across* moral theories that use fundamentally different value structures (e.g., rights, duties, welfare, virtues). It must handle deep pluralism.
      *   **Conceptual Challenge:** Associativism might frame the director's duty in terms of loyalty/virtue, while impartialism frames it in terms of welfare maximization. Can failing one's community be meaningfully compared, in normative weight, to failing to maximize global welfare? The theory must offer a procedure for such comparison, however constructed (e.g., via primary goods, worst-case scenarios, or hypothetical scaling).
      *   **Scenario Application:** The clinician must compare a deontological "wrong of violation" (ignoring the directive) with a consequentialist "wrong of suffering" (following it against current interests). The theory needs a cross-theoretic metric.

  5.  **Confidence-Stakes Separation:**
      *   **Rationale:** The theory must distinguish between the *degree of credence* an agent assigns to a moral outlook and the *moral stakes* involved *if* that outlook is true. High stakes shouldn't automatically imply high credence, nor should low confidence automatically downplay high stakes.
      *   **Finding (Decision Theory):** Expected utility theory separates probability (confidence) from utility (stakes/value). A good theory of moral uncertainty should analogously separate moral confidence from the moral value/disvalue assigned by each outlook.
      *   **Scenario - Clinician:** The clinician has moderate confidence in *both* outlooks (~50% each). However, the stakes are asymmetric: overriding the directive if autonomy is truly decisive might be seen as a profound violation, while following it if current interests are decisive might cause significant but perhaps less "categorical" suffering. The theory must reflect this asymmetry *beyond* just the confidence level.

  6.  **Moral Risk Management:**
      *   **Rationale:** The theory must navigate between the Scylla of excessive caution (paralysis or overly conservative choices trying to avoid *any* possible wrong) and the Charybdis of objectionable indifference (ignoring plausible but minority views with potentially catastrophic implications if true).
      *   **Scenario - Clinician:** Excessive caution might demand *always* following the directive to avoid the potentially catastrophic wrong of violating autonomy, ignoring significant current suffering. Objectionable indifference might ignore the autonomy view entirely if confidence is only moderate (say 40%), prioritizing current comfort despite the risk of profound violation. The theory needs a principled middle path.
      *   **Scenario - Fund Director:** Excessive caution might demand spending only on maximally efficient projects acceptable to all views, potentially missing high-impact opportunities. Indifference might ignore the associative view entirely if confidence is 45%, risking serious failure of local duty.

  7.  **Justification Asymmetry (Accountability):**
      *   **Rationale:** Acting well under uncertainty is distinct from being able to justify the act to adherents of *different* moral outlooks. A good theory should account for why some choices, even if correct under uncertainty, might be harder to justify to reasonable dissenters than others. It should reflect the "moral remainder" or special burdens associated with certain risks.
      *   **Conceptual Boundary:** Justifying to an associativist why you sent funds distantly causing local hardship is different from justifying to an impartialist why you prioritized locals over greater distant need. The *kind* of wrong risked matters for accountability, even if the theory says the action was correct.
      *   **Scenario - Clinician:** Following the directive causing suffering is potentially easier to justify to the autonomy-view holder ("I respected her choice") than overriding it is to justify to the welfare-view holder ("I caused her suffering against her past wishes"). The theory should illuminate this asymmetry, perhaps demanding stronger justification for actions risking certain types of wrongs.

  **Central vs. Negotiable Desiderata, Tensions, and Strongest Restriction:**

  *   **Central (Likely Essential for Any Adequate View):**
      *   **Action Guidance (1):** Without this, the theory fails its core purpose.
      *   **Non-Defeasibility (2):** Otherwise, it doesn't address moral uncertainty specifically.
      *   **Basic Normative Comparability (3):** Some minimal comparison seems necessary for any weighing or aggregation.
      *   **Moral Risk Management (6):** Avoiding paralysis and recklessness is fundamental to practical rationality under uncertainty.
  *   **Reflective of Specific Camps (Potentially Negotiable):**
      *   **Robust Inter-Theoretic Comparison (4):** Theories like "My Favorite Theory" (MFT) reject this as impossible or unnecessary. Maximin-inspired views might bypass it by focusing only on worst cases. How robust the comparison needs to be is contested.
      *   **Justification Asymmetry (7):** While important, some theories might prioritize "acting correctly according to the uncertainty calculus" over justifiability to others, viewing the latter as a separate (though important) political or conversational challenge.
  *   **Key Tensions:**
      *   **(4) Robust Inter-Theoretic Comparison vs. (7) Justification Asymmetry:** Achieving deep comparability (e.g., reducing all values to a common scale) might obscure the distinct *kinds* of wrongs involved, making the justification asymmetry harder to capture. Prioritizing justifiability might require preserving the incommensurability that makes comparison difficult.
      *   **(6) Moral Risk Management vs. (5) Confidence-Stakes Separation:** Aggressive moral risk aversion (e.g., Maximin) might effectively prioritize high-stakes views, blurring the separation between stakes and confidence. Strict separation might sometimes lead to insufficient aversion to catastrophic moral risks.
  *   **Strongest Restriction:**
      *   **Inter-Theoretic Value Comparison (Basic 3 & Robust 4):** This is arguably the most formidable challenge. Without a plausible method to compare the normative demands and disvalues across fundamentally different moral frameworks (e.g., how much local loyalty "equals" a distant life saved; how much suffering "equals" an autonomy violation), the project of developing a coherent decision procedure under deep moral uncertainty is severely hampered. This requirement places the strongest constraint on viable theories.

  **Illustrative Comparison of Two Families:**

  1.  **Weighting by Confidence and Stakes (e.g., Moral Expected Value - MEV):**
      *   **Meets:** Action Guidance (1) - prescribes action maximizing MEV. Confidence-Stakes Separation (5) - explicitly models confidence (probability) and stakes (utility) separately. Moral Risk Management (6) - can incorporate risk aversion via utility functions. Potentially meets Non-Defeasibility (2) if utilities reflect moral views.
      *   **Struggles With:** Normative Comparability (3/4) - Critically depends on constructing comparable inter-theoretic utilities, the major hurdle. Justification Asymmetry (7) - The utilitarian aggregation might obscure distinct wrongs, making justification to holders of minority views difficult (e.g., "Why did you violate autonomy? Because the *expected* suffering outweighed it").

  2.  **Follow Most Credible Outlook (e.g., My Favorite Theory - MFT):**
      *   **Meets:** Action Guidance (1) - prescribes acting on the highest-confidence theory. Non-Defeasibility (2) - directly uses the prescriptions of the moral theory. Avoids Normative Comparability (3/4) - only needs intra-theoretic comparisons within the favorite theory.
      *   **Struggles With:** Confidence-Stakes Separation (5) - Ignores stakes entirely if the favorite theory isn't the highest-stakes one. Moral Risk Management (6) - Can be recklessly indifferent to potentially catastrophic wrongs if the favorite theory has only 51% confidence and the minority view has extreme stakes. Justification Asymmetry (7) - Acting solely on one view provides no inherent justification to adherents of other plausible views ("Why did you ignore our view?" "Because mine was slightly more credible").

  This framework provides a rigorous set of standards against which competing theories of decision-making under fundamental moral uncertainty can be evaluated, highlighting the core challenges and potential trade-offs involved.
