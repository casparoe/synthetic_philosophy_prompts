answer: |-
  ## Sestina for the Unswallowed Toxin

  The afternoon arrives, predictable, slow.
  Sunlight warms the wood where sits the **vial**,
  Undrunk. A million gleams within my **account**,
  Proof of promises made past midnight’s chime.
  I watch the liquid hold its silent threat.
  My hand stays steady, lacking all **resolve**.

  Last evening, focused sharp, I nursed **resolve**.
  The terms were clear: show true intent, don’t **slow**
  Or waver when they come to check. That **vial**
  Was key, a symbol locked within my **account**
  Of what I’d prove. I summoned it by **midnight**,
  A focused will, ignoring future **threat**.

  But even then, a shadowed, quiet **threat**
  Loomed large: this fragile, necessary **resolve**
  Was built on sand. I knew come **midnight**,
  When eyes might judge the strength I’d **slow**ly
  Show, that *after*… ah, the **account**
  Would fill, and render obsolete this **vial**.

  No need, beyond the symbol, for the **vial**.
  The sickness promised was the only **threat**,
  Erasable by wealth within my **account**.
  So why maintain the hollow, spent **resolve**?
  The logic crumbles, reason moves so **slow**
  To justify an act past **midnight**.

  The crucial moment passed – that testing **midnight**.
  I stood, declared, and gestured to the **vial**,
  Projecting certainty, though feeling **slow**
  Doubt coil beneath. They saw intent, no **threat**
  Of failure then. My manufactured **resolve**
  Secured the dawn’s light in my **account**.

  Now riches bloom secure within my **account**,
  The bargain’s core fulfilled since **midnight**.
  What purpose serves this lingering **resolve**
  To touch the glass, to lift the dusty **vial**?
  The promised pain remains a pointless **threat**,
  A ghost of obligation, fading **slow**.

  The **afternoon** ticks **slow**. The untouched **vial**
  Mocks the **midnight** check. My **account** sings wealth, dismisses **threat**.
  The **resolve** persists, an echo. Empty **resolve**.

  ---

  **Assumptions Embedded in the Poem & Philosophy:**

  1.  **Genuine Intention Requires Belief in Execution:** The core paradox hinges on this. To genuinely *intend* to drink the toxin at midnight, you must believe you *will* drink it tomorrow. But you know that once the money arrives, you won't drink it. Therefore, at midnight, you *cannot* genuinely believe you will drink it, making genuine intention impossible. The poem shows the manufactured ("manufactured **resolve**") nature of the midnight declaration and its subsequent collapse ("lacking all **resolve**", "hollow, spent **resolve**").
  2.  **The Timing of Payment is Crucial:** The payment arriving *before* the drinking deadline is essential. If payment came *after* drinking, you'd have a reason to drink. Here, the payment precedes the act, removing the *only* incentive ("The **account** Would fill, and render obsolete this **vial**", "My **account** sings wealth, dismisses **threat**"). The poem emphasizes the "afternoon arrives" *after* the money is secure.
  3.  **Agent's Knowledge of Future Self:** The puzzle requires you to have accurate, recursive knowledge of your own future incentives and likely actions. You know that *future you* (post-payment) will have no reason to drink ("I knew come **midnight**... that *after*..."). This foreknowledge undermines your present ability to form the intention. The poem reflects this self-knowledge ("Doubt coil beneath", "The logic crumbles").
  4.  **Intention as a Distinct Mental State:** The puzzle treats "intention" as a specific cognitive state that can be inspected (at midnight) and that differs from mere desire, hope, or pretense. The poem contrasts the midnight "projecting certainty" with the afternoon's "lacking all resolve" and "echo."
  5.  **The Act Itself is Undesirable:** Drinking the toxin is purely costly with no benefit once the money is secured. This makes defection rational. The poem highlights the "sickness promised," the "pointless **threat**," and the lack of need ("No need, beyond the symbol").

  **How the Poem Would Change if Assumptions Were Dropped:**

  *   **If intention didn't require belief in execution:** The paradox vanishes. You could "genuinely intend" at midnight without believing you'd actually do it. The poem's central conflict—the manufactured resolve crumbling—wouldn't exist. It might depict a cynical actor perfectly comfortable with insincere promises.
  *   **If payment came *after* drinking:** The incentive structure changes completely. You'd have a strong reason (the million dollars) to drink the toxin. The poem would be about steeling yourself to endure the sickness ("**threat**") for the reward ("**account**"). Resolve would be difficult but necessary and potentially sustained. The vial would likely be drunk.
  *   **If you were ignorant of your future self's defection:** If you naively believed at midnight that you *would* drink it tomorrow (perhaps through self-deception), the paradox wouldn't bite. The poem might show surprise or regret in the afternoon ("Why *didn't* I drink it?"), rather than the weary recognition of inevitable failure ("predictable, slow").
  *   **If drinking held some independent value:** If you gained something else from drinking (honor, proving a point, an unrelated benefit), it might remain rational even after payment. The poem might depict a struggle between the easy money and a deeper commitment, potentially ending with the vial being drunk despite the secured account.
  *   **If "intention" was just performative:** If the billionaire only cared about the *performance* at midnight, not a genuine internal state, the paradox dissolves. The poem would focus on the act of convincingly lying or acting at midnight, with no lingering conflict in the afternoon beyond perhaps guilt over deception. The resolve would be purely theatrical.

  The poem specifically leverages assumptions 1, 2, and 3 to create its core tension: the impossible demand for a genuine intention that the agent knows is doomed, perfectly captured by the sestina's cyclical, returning, yet ultimately hollow "resolve."
