  The user's profession matters here. Auction house work forces practical distinctions between "genuine" and "attributed," but their essay wants philosophical rigor. They reject simplistic belief-based aesthetic theories—rightly so, since #2 proves admiration survives correct attribution. Their note about mood ("not a mere mood") suggests they sense deeper cognitive dissonance.

  For the bottom line principle: Agency and artifact entanglement covers most cases. Intentional delegation (#5 studio work) differs from parasitic imitation (#1 forgery). The chapel (#6) requires adding material history as a secondary factor—hence the "unless" clause.

  Rival principles must be tested brutally. An "aesthetic autonomy" view would save #1-4 by dismissing context, but it nukes #5 and #8 where history matters. The "chain of custody" approach salvages #6 and #10 but fails #3 (restoration breaks custody yet is virtuous).

  The AI vs restorer clash (#3 vs #4) hinges on service versus supplanting. Restoration extends Tiepolo's agency; the generator creates a severed facsimile. If the user balks here, they'd have to condemn all restoration—which they clearly don't (#3 is "praiseworthy"). 

  New test cases: A reprinted novel challenges material fetishism. A replicated Stradivarius probes whether sound or story dominates. A fanfiction monetization exposes parasitic intent without deception. 

  Sacrifices: #7 (old instrument bias) must go as sentimentality. #8's asymmetry stands—music's performative nature differs from drama's textual embodiment. #9's "inflation" critique holds under the principle since the artist falsely implies personal execution. 

  The residue? #6's "rate of replacement" quirk remains unresolved. Either accept it as a psychological glitch or add a temporal continuity clause—but that risks overcomplicating. 

