answer: |-
  ### Bottom Line  
  Aesthetic standing flows from the *intentional framework* governing an object’s creation: **An act of making is aesthetically legitimate when it operates under the authority of an originating artistic intention (explicit, delegated, or contextually sustained) and contributes to its continuity. Mimicry is parasitic—and aesthetically corrosive—when it fabricates a rival intention or severs the artifact from its sustaining framework of creation.** Physical properties matter only as vessels for this intentional history.  

  ### Clauses and Their Motives  
  1. **Intentional Continuity Clause** (Cases 3, 5, 6): Mimicry is legitimate if it extends or repairs an *existing work* under the authority of its originating intention (e.g., restoration under artist’s tradition [3], studio delegation [5], gradual material replacement [6]). *Failure*: Mimicry invents a new origin (e.g., forgery [1]).  
  2. **Parasitism Clause** (Cases 1, 4, 8): Mimicry is illegitimate when it creates a *rival claimant* to the credit of an originating act, even without deception (e.g., AI "Vermeer" [4], forged play [8]). *Failure*: It serves the original work’s existence (e.g., restoration [3]).  
  3. **Transparency Proviso** (Cases 2, 9): Honest labels mitigate parasitism only if the object *does not exploit* the original’s intentional framework (e.g., pastiche [2] is independent; celebrity factory [9] parasitizes the artist’s authority). *Failure*: The mimicry still hijacks the original’s intentional gravity (e.g., AI "Vermeer" [4]).  
  4. **Attributional Vulnerability Clause** (Case 10): Aesthetic weight dissipates when an object *cannot be anchored* to any secure intentional framework. *Failure*: Attribution is certain but irrelevant (e.g., pastiche [2]).  

  ### Rival Principles  
  **Aesthetic Autonomy (Pure Formalism)**  
  *View*: Only sensory properties matter; history is irrelevant.  
  *Verdicts*: Saves #1 (forgery unchanged), #2 (pastiche fine), #3 (restoration neutral), #4 (AI print fine).  
  *Cost*: Wrecks #5 (studio work ≠ genuine), #8 (forged play ≠ ruined), #7 (old instrument bias irrational). Fails your core intuition that history *constitutes* the object.  

  **Chain of Custody (Material Historicity)**  
  *View*: Authenticity requires unbroken physical lineage from the artist’s hand.  
  *Verdicts*: Saves #6 (slow replacement = original), #10 (attribution uncertainty = devaluation), #1 (forgery = broken chain).  
  *Cost*: Wrecks #3 (restoration breaks chain), #5 (studio work ≠ artist’s hand), #4 (AI has no chain but you dislike it). Overlooks delegated intentionality.  

  **Achievement Credit (Goodman Extended)**  
  *View*: Aesthetic value tracks credit for the *achievement* of creation.  
  *Verdicts*: Saves #1 (forgery steals credit), #4 (AI earns no credit), #8 (Haydn’s contemporary earns credit; forger doesn’t).  
  *Cost*: Wrecks #3 (restorer earns achievement but you praise continuity), #7 (old instrument’s achievement irrelevant). Ignores works sustained by delegated labor.  

  ### The Restorer and the Generator  
  **Shared Feature**: Both mimic style flawlessly with full transparency.  
  **Divergence**: The restorer (3) *serves* Tiepolo’s intentional framework—repairing *his* work, using *his* techniques, under *his* tradition’s authority. The AI (4) *manufactures* a pseudo-artifact severed from any human intention; it parasitizes Vermeer’s framework to claim a "new" work. Your principle separates them cleanly: legitimacy hinges on *subordination to an existing intentional continuum*.  
  **If reversed**: If you condemn restoration (3), you must reject all invisible repair—museums become mausoleums. If you endorse the generator (4), you equate artistic intention with statistical pattern-matching, collapsing the distinction between creation and replication. Your instinct that (4) is a "fraud without a victim" reflects its *intentional vacancy*, not deception.  

  ### Three Cases You Choose  
  1. **A reprinted novel**: An 1890 Dickens novel scanned, reprinted identically on vintage paper, sold as "facsimile." *Verdict*: Legitimate—it extends Dickens’ intentional framework materially.  
  2. **A Stradivarius replica**: A luthier uses AI analysis of Strad’s corpus, same wood/tools, labels it "replica." *Verdict*: Hollow (like #4)—it simulates achievement without Strad’s intention, parasitizing his legacy.  
  3. **Fanfiction monetized**: A writer publishes *Pride and Prejudice* sequel in Austen’s style, marketed as "new Austen." *Verdict*: Parasitic (like #8’s forged play)—manufactures rival credit, even if stylistically competent.  

  ### What I Have to Give Up  
  **Ranked by cost to abandon**:  
  1. **#7 (Old instrument bias)**: Must abandon. Your principle denies inherent virtue to aged materials; the soloist’s preference is sentimental, not aesthetic. Cost: Low—it’s a borderline case.  
  2. **#8 (Haydn/Shakespeare asymmetry)**: Keep partially. Music’s allographic nature allows credit re-assignment (composer ≠ performer); drama’s autographic/textual gravity ties it to Shakespeare’s intent. Cost: Moderate—requires accepting Goodman’s line tracks *modes of intentional embodiment*.  
  3. **#6 (Chapel replacement rate)**: Keep with refinement. Slow replacement preserves intentional continuity (community’s sustained act); rebuilding severs it. Cost: High—your principle must absorb "temporal unity" as part of intentional frameworks.  

  **Residual tension if keeping #6 and #8**: The chapel (#6) challenges "intentional continuity" with physical attrition. If you keep both, you must argue that identity in material artifacts (vs. art) depends on *durational intentionality*—a community’s ongoing stewardship. For #8, you must concede that literary works are more "authored" than musical scores, making attribution fraud catastrophic. The surviving tension: Why is rebuilding a chapel materially faithful but intentionally discontinuous, while restoring a Tiepolo (#3) is both? Answer: The chapel’s *entire intentional framework* (its "being") is its material history; the Tiepolo’s is its artistic conception. This distinction is fragile but necessary.
