prompt: |-
  so ive been thinking on my own for weeks about whether i could have come from a different sperm and egg, like if my parents had waited a month would that kid still be me or someone else entirely, and the twin thing realy trips me up cause same stuff can make two different people. i told my 16 year old brother id try explaning it to him this weekend with no philosophy jargon. dont just explain it to me, plan how i should teach it to him - what needs to come first and what depends on what, what one normal-life example i can keep coming back to and what it needs to show without confusing him, what mistakes hes gonna make and exactly when i should head each one off, one question i can ask at the end to see if it actually landed, and what i should just skip for now?
