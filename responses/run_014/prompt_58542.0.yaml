  - Or "twins are identical so why not me later?" → address during twin section by emphasizing DNA isn't the only variable 
  - Might ask "what about personality?" → save for end as bonus 

  Checkpoint question should test if he grasps DNA as the differentiator: "Would changing one ingredient make the same cake?" 

  Skip: quantum physics, alternate timelines, consciousness theories. Keep it cellular. 

