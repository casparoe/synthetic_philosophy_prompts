answer: |-
  You've hit on a fascinating and slightly elusive aspect of Frank Ramsey's legacy. You're absolutely right: his primary, enduring contributions are in logic, probability, foundations of mathematics, and economics. He died tragically young at 26 (in 1930), leaving behind no single, systematic magnum opus on philosophy or the meaning of life. **However, there *is* a specific, canonical text where he directly addresses existential questions – his short but profound "Epilogue."**

  Here's a breakdown to clarify the source and his views:

  1.  **The Key Text: "Epilogue"**
      *   **Where to Find It:** This essay was intended as the concluding chapter to a planned (but never completed) book. It was published posthumously in his collection of philosophical papers, ***The Foundations of Mathematics and Other Logical Essays*** (edited by R. B. Braithwaite, 1931).
      *   **Nature of the Text:** It's relatively short (about 10-15 pages in most editions), intensely personal, reflective, and written with remarkable clarity and honesty. It stands out because it departs from his usual technical style and tackles fundamental questions of value, purpose, and how to live.

  2.  **Ramsey's Core Argument in "Epilogue":**
      Ramsey's view on the "meaning of life" is grounded in his logical pragmatism and rejection of metaphysics he deemed meaningless. Key points include:
      *   **Rejection of the Afterlife & External Guarantees:** Ramsey, influenced by his friend Wittgenstein and logical positivism (though not a strict adherent), argued that propositions about an afterlife, a divine purpose, or an objective "Meaning" imposed from outside the universe are literally *meaningless* or at least unjustifiable by reason or evidence. We have no rational grounds to believe in them.
      *   **Finitude and Subjectivity:** Therefore, meaning isn't found "out there." Life is finite, bounded by birth and death. This finitude *defines* the human condition.
      *   **Meaning as Human Creation:** The "meaning of life" arises *within* this finite existence. It's something we *create* and *find* through our activities, relationships, values, and commitments.
      *   **The Primacy of Practice:** Ramsey argues that the fundamental questions aren't abstract "Why?" questions ("Why is there something rather than nothing?", "What is the purpose of the universe?") which he sees as potentially nonsensical or unanswerable. Instead, the crucial question is the practical **"What shall I do?"**
      *   **Finding Meaning Through Action & Values:** How we answer "What shall I do?" – the choices we make, the things we value (love, friendship, intellectual pursuits, creation, helping others, aesthetic experience), the way we engage with the world and others – *is* where meaning resides. Meaning emerges *from* living well within our finite constraints.
      *   **Connection to Probability/Decision Theory:** This is where his work on probability and subjective value connects. His theory of partial belief and decision-making under uncertainty (developed in "Truth and Probability") provides a *framework* for how we rationally navigate the "What shall I do?" question when we lack perfect knowledge. We weigh probabilities of outcomes against our subjective valuations of those outcomes. Our "meaning-making" activities involve constant probabilistic judgments about how best to achieve what we value.

  3.  **Pragmatism? Yes, but Distinct:**
      You're correct that he was heavily influenced by William James and pragmatism. The emphasis on practice, consequences, and the rejection of useless metaphysical speculation aligns strongly. **However, Ramsey's pragmatism is uniquely filtered through:**
      *   **Formal Logic & Probability:** He brought a rigorous, analytical lens to pragmatist ideas, trying to formalize concepts like belief and value.
      *   **Rejection of "Truth = Utility":** He explicitly distanced himself from the crude Jamesian idea that a belief is true *because* it's useful. For Ramsey, truth was objective (about facts in the world), but *value* and *meaning* were subjective and practical.
      *   **Focus on Finitude:** His emphasis on the finality of death and the absence of external guarantees gives his pragmatism a distinctly existential, almost stoic, flavour.

  4.  **A "Developed Doctrine"?**
      It's not a systematic, step-by-step philosophical doctrine like you'd find in Kant or Hegel. It *is* a coherent, deeply thought-out, and passionately argued *position* or *stance*. "Epilogue" lays out his fundamental convictions clearly:
      *   There is no external, cosmic meaning.
      *   Death is final.
      *   Therefore, meaning is something finite beings create through their actions and values.
      *   The primary philosophical question is practical: "What shall I do?"
      *   Logic, probability, and subjective value theory provide tools for rationally navigating that question.

  5.  **Why It Seems Surprising (and Why It's Remarkable):**
      *   **Juxtaposition:** The contrast between the hyper-rational work on logic/probability and the deeply personal, existential "Epilogue" is striking. It shows a remarkable breadth of mind.
      *   **Youth:** That someone so young could articulate such a mature, unsentimental, yet not nihilistic, view of life is extraordinary.
      *   **Holism:** It demonstrates that Ramsey saw his technical work *as part of* the broader human project of understanding the world and figuring out how to live in it. Probability wasn't just abstract math; it was a tool for living rationally in an uncertain world without ultimate guarantees.
      *   **Context:** He was reacting against both the abstract idealism of philosophers like McTaggart and the emotivism/anti-realism he saw in parts of Russell and early Moore. He wanted a philosophy grounded in human reality.

  **In Summary:**

  *   **Yes, there is a specific text:** The "Epilogue" in *The Foundations of Mathematics and Other Logical Essays* is the canonical source.
  *   **His view:** Meaning isn't found externally or in an afterlife (which are meaningless/unjustifiable concepts). Meaning is created by finite human beings through their choices, actions, values, and commitments, in answer to the practical question "What shall I do?".
  *   **Pragmatism?** Deeply influenced, but uniquely shaped by his logical/analytic rigor, theory of probability/decision, and stark emphasis on human finitude.
  *   **"Developed Doctrine"?** It's a coherent, powerful, and argued position, not a sprawling systematic treatise (impossible given his lifespan). Its power lies in its clarity, honesty, and connection to his broader philosophical framework.

  **To truly understand it, you need to read the "Epilogue" itself.** Secondary sources mentioning it often oversimplify or misrepresent its nuanced and personal tone. It's a profound piece by a brilliant young mind confronting the biggest questions with characteristic clarity and courage.
