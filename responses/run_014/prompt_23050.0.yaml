  So I'm a little lost on what to make of the "meaning of life" thing. Is there some canonical passage or paper where he states his view, and if so where is it? Or is the whole thing just that he was a pragmatist (in the William James sense) and so he had "pragmatist" answers to the big existential questions? I'd like someone to walk me through what he actually said and where it comes from, because right now it feels like I'm being told a probabalist/logician had a developed doctrine on the meaning of life and I can't quite see how that works.
