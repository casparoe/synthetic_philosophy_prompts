answer: |-
  ### Worked Example of Cue-Dependence in Machine Translation  
  **Context**: This example illustrates Hofstadter's critique—where a machine translation (MT) system relies on surface-level statistical patterns rather than modeling the underlying situation. The failure occurs when a minimal, meaning-preserving edit disrupts a superficial cue, causing the system to produce a fluent but incorrect translation. The example focuses on **quantifier scope ambiguity**, specifically how negation interacts with universal quantifiers.  

  ---

  #### **Original Sentence**  
  "The software did not recognize all the images."  
  - **Intended Meaning**: Not all images were recognized by the software (i.e., some images were unrecognized).  
  - **Why It Works**: The phrase "did not recognize all" is a common construction in training data (e.g., "not all" often implies partial negation). MT systems frequently encounter this pattern and learn to map it to translations where negation takes wide scope over "all."  

  **Plausible Correct Translation (e.g., in French)**:  
  "Le logiciel n'a pas reconnu toutes les images."  
  *(Correctly implies partial recognition: some images were unrecognized.)*  

  ---

  #### **Minimal Meaning-Preserving Edit**  
  **Perturbed Sentence**: "The software did not recognize every image."  
  - **Preserved Meaning**: Identical to the original—the situation described is unchanged (partial recognition: some images failed to be recognized).  
  - **Edit Rationale**: Replacing "all the images" with "every image" is a syntactic perturbation that breaks the "not all" surface cue. "Not every" is statistically rarer and less formulaic in training data, disrupting the system’s reliance on the "not" + "all" collocation as a cue for partial negation.  

  ---

  #### **System's Fluent-but-Wrong Translation**  
  **Incorrect Output (e.g., in French)**:  
  "Le logiciel n'a reconnu aucune image."  
  *(Fluent translation: "The software recognized no images.")*  

  **Why It’s Fluent**: The output is grammatically perfect and uses natural French.  
  **Why It’s Wrong**: It misrepresents the situation—claiming **total non-recognition** (0 images recognized) instead of **partial recognition**.  

  ---

  #### **Why This Shows Failure to Model "Who Did What to Whom"**  
  This error exposes the system’s inability to represent **quantifier scope relationships**:  
  1. **Lack of Negation Scope Modeling**:  
     The original ("not all") and perturbed ("not every") sentences both require negation to scope over the quantifier ("all"/"every"), yielding partial recognition. The system, however, treats "not every" as a monolithic, low-frequency cue. Without the "not all" crutch, it defaults to a more common pattern ("not" + verb) + "every" → misinterpreting "every" as universally negated (i.e., "none"). This conflates:  
     - Partial negation ("not every" = some unrecognized)  
     - Total negation ("no" = all unrecognized).  

  2. **Surface Cue Dependency**:  
     The system’s correct translation of the original relies on the high-frequency "not all" string. When this cue is perturbed to "not every"—a synonymous but less frequent construction—the system fails to generalize, proving it lacks a robust representation of the logical structure (negation scoping over quantification). It merely associates strings with outputs, without modeling how quantifiers and negation interact to define the situation (e.g., which images were affected).  

  ---

  #### **Why This Isn’t Just a Coverage Gap**  
  While low-frequency phrases ("not every") may be underrepresented in training data, the error here is **structural**:  
  - The system handles "not all" correctly due to statistical regularity, not comprehension.  
  - The perturbation exposes a *systematic* failure in representing operator scope—a core aspect of meaning. Coverage gaps imply missing data, but here the system *has* data for "not," "every," and "recognize," yet cannot compose them correctly without a memorized cue. This aligns with Hofstadter’s claim that MT often performs "elaborate pattern matching" without situational modeling.  

  #### **Example Choice Rationale**  
  - **Literal Prose**: No idioms, metaphors, or cultural dependencies.  
  - **Non-Apocryphal**: Avoids overused examples like "vodka and rotten meat."  
  - **Failure Visibility**: The error (partial vs. total negation) is unambiguous and impacts core semantics.  

  This case demonstrates how MT systems can succeed via superficial cues while fundamentally lacking representations of logical relationships—precisely the "meaning without understanding" Hofstadter critiques. Use this to anchor your argument that statistical MT’s failures are not merely data gaps, but reflect a deeper disconnect from situational modeling.
