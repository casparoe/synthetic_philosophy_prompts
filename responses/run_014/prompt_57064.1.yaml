prompt: |-
  I am a retired limnologist — some thirty-five years of measuring lakes — and I have taken up political philosophy seriously only since I stopped working. For two years I have served as the lay member of a county Regulatory Review Panel (population served: roughly four hundred thousand). Twice a month a proposed rule reaches us and we must attach a note to it before it goes to the elected board: two pages, prepared in an afternoon, by a retired school principal, a contractor, a nurse, and me, none of us trained in law or philosophy.

  The note is meant to say what the rule does to people's freedom. In practice we flounder, because the word is not doing any work. One member hears freedom as the absence of obstacles and concludes that a rule nobody has yet enforced is costless; another hears it as control over one's own affairs and concludes the same rule is emancipatory. Reading Berlin on the two concepts and Pettit on non-domination, I have come to suspect we are not disagreeing about facts at all, but scoring proposals with different instruments while giving the readings one name.

  So: build the instrument. Write a decision procedure our panel can run on any proposed rule in a single afternoon, from the sheet alone, without having read anything. Tell me the questions to ask in order, what counts as a sufficient answer to each, how to record the finding in language a board member can read, and where the procedure must stop and hand the matter to a person because the question is one of values rather than description. Be explicit about which distinctions in the literature must survive the simplification because the verdict turns on them, and which can be dropped. It has to handle three kinds of hard case: rules that restrict choice but end someone's dependence on another's goodwill; rules whose burden consists in a discretionary power that, so far as anyone knows, has never been exercised against anyone; and rules defended on the ground that they make people capable of governing themselves. And since I am by temperament a counter of obstacles who trusts only what he can measure, build in a check for whether the procedure's own wording has quietly pre-selected one conception of freedom.

  Then run it on three live proposals: a permit office empowered to waive a setback requirement in its unreviewable judgment, with criteria promised at some future date but none published; a licensing requirement for well drillers, with a written examination and appeal to a panel that includes practitioners; and a rule obliging landlords to renew tenancies absent enumerated cause, enforceable by the tenant directly. At least one of these should come out against my instincts — say which, and do not soften it.

  Finally, report your own confidence. Tell me how sure you are that the procedure states what these theories actually say rather than a convenient approximation of them, and single out the one step you would most expect a philosopher to reject.
reasoning: |-
  Hmm, this is a fascinating challenge from a retired limnologist turned regulatory reviewer. They need a practical decision procedure for evaluating how proposed rules affect freedom - something their diverse panel can apply in one afternoon without philosophical training. The core problem is their panel uses "freedom" inconsistently: some see it as absence of obstacles, others as control over one's life.

  The user identifies three hard cases they need the framework to handle:  
  1. Rules that restrict choice but end dependence on others' goodwill  
  2. Rules with discretionary powers never exercised  
  3. Rules claiming to enhance self-governance capability  

  They also want the framework tested against three concrete proposals:  
  - Vague waiver power for setback requirements  
  - Well driller licensing with exam and peer appeal  
  - Landlord obligation to renew tenancies without cause  

  Key constraints I must honor:  
  - Must produce a 2-page memo in one afternoon  
  - Explicitly state which philosophical distinctions are essential  
  - Include self-check against bias toward measurable obstacles  
  - Force at least one counterintuitive conclusion  
  - Report confidence level and most philosophically contentious step  

  I consider building the framework around three core dimensions of freedom:  
  1. **Interference** (negative freedom): Measurable restrictions  
  2. **Domination** (non-domination): Power imbalances even if unused  
  3. **Capability** (positive freedom): Capacity for self-governance  

  For practical application, I design a flowchart with these assessment stages:  
  - **Step 1:** Quantify direct restrictions (measurable obstacles)  
  - **Step 2:** Map power structures (who controls whom)  
  - **Step 3:** Assess capability effects (does it enable agency?)  
  - **Step 4:** Cross-validate findings across dimensions  

  The critical philosophical distinctions to preserve:  
  - **Must keep:** Difference between exercised vs. structural power (Pettit)  
  - **Can drop:** Berlin's strict negative/positive dichotomy  

  For the self-bias check, I include a mandatory "measurement disclaimer" when interference scores are low but domination scores high.  

  Testing the framework on their examples:  
  1. **Vague waiver power:** High domination risk despite low measurable interference → counterintuitive RED for user who focuses on obstacles  
  2. **Well driller licensing:** Moderate interference but low domination → AMBER with recommendations  
  3. **Tenancy renewal rule:** High interference for landlords but reduces tenant domination → complex trade-off requiring human judgment  

  My confidence level: 85% on capturing core philosophical insights, but with these caveats:  
  - Highest risk step: Treating "capability enhancement" as verifiable fact rather than contested value  
  - Philosophers would reject collapsing positive freedom into capability alone  

  The panel memo format needs to be crystal clear - I consider using visual indicators and separating descriptive findings from value judgments. For the tenancy rule example, I note how it forces explicit trade-off between landlord negative freedom and tenant non-domination - exactly where the procedure should hand off to human judgment.
answer: |-
  Below is a decision procedure ("The Freedom Impact Protocol") designed for your panel's practical use. It distills key philosophical distinctions into a replicable workflow, prioritizes descriptive analysis over value judgments, and includes safeguards against conceptual bias. The protocol is structured as a checklist with branching logic, deliverable in a 2-page memo format. I'll first present the procedure, then apply it to your three cases, and conclude with a confidence assessment.

  ---

  ### **The Freedom Impact Protocol**  
  *Purpose: To descriptively categorize a rule's effects on freedom across three dimensions (Interference, Domination, Capability), flag value conflicts, and generate a board-ready summary.*  

  **Materials Needed:** The proposed rule text, a timer (90 minutes max), and the panel.  
  **Output:** A memo with three sections: (1) **Descriptive Findings**, (2) **Value Conflicts**, (3) **Summary Rating** (GREEN/AMBER/RED).  

  ---

  #### **STEP-BY-STEP DECISION PROCEDURE**  
  *(Ask questions in order; record answers verbatim)*  

  1. **DIMENSION 1: INTERFERENCE (Negative Freedom - Berlin)**  
     *Focus: Measurable obstacles to choice.*  
     - *Q1: Does the rule explicitly prohibit, require, or penalize conduct that was previously permitted?*  
       - *Sufficient Answer:* List specific actions (e.g., "prohibits drilling without license"). If none, score INTERFERENCE = 0.  
     - *Q2: Does the rule create new costs (time, money, effort) ≥1% of annual income for affected parties?*  
       - *Sufficient Answer:* Estimate using local wage/data (e.g., "$500 fee for median tenant"). If unquantifiable, default to "Yes."  
     - *Finding:* "Interference: [High/Medium/Low/None] based on [Q1/Q2 summary]."  

  2. **DIMENSION 2: DOMINATION (Non-Domination - Pettit)**  
     *Focus: Power imbalances enabling arbitrary control, even if unused.*  
     - *Q3: Does the rule grant discretionary power to any entity (state/private) over others?*  
       - *Sufficient Answer:* Identify who can make unrestrained decisions (e.g., "Permit Office may waive setbacks").  
     - *Q4: Is this power (a) unchecked (no appeal/review), or (b) vague (criteria undefined)?*  
       - *Sufficient Answer:* Answer (a) or (b) with rule text excerpts (e.g., "unreviewable judgment," "criteria promised later").  
     - *Finding:* "Domination Risk: [High if Q4(a) or (b); Medium if Q3 only; Low if neither]."  

  3. **DIMENSION 3: CAPABILITY (Positive Freedom - Berlin/Sen)**  
     *Focus: Effective capacity for self-governance.*  
     - *Q5: Does the rule remove a barrier to essential life activities (e.g., housing, work, health)?*  
       - *Sufficient Answer:* Cite specific barriers (e.g., "landlords can evict without cause").  
     - *Q6: Is this barrier currently experienced by ≥5% of the affected group?*  
       - *Sufficient Answer:* Use local data or testimony; if none, default to "No."  
     - *Finding:* "Capability Impact: [High if Q5+Q6 Yes; Medium if Q5 only; Low if neither]."  

  4. **CROSS-DIMENSIONAL CHECK (Bias Audit)**  
     - *Q7: Did we assume "no interference" implies "no problem"?*  
       - *Action:* If Domination ≥ Medium or Capability ≥ Medium but Interference = Low/NONE, add: "WARNING: Non-interference effects may be undervalued."  
     - *Q8: Does the rule reduce one group’s freedom to expand another’s?*  
       - *Action:* If Yes, trigger **Value Conflicts** (Step 5).  

  5. **VALUE CONFLICTS**  
     - *Stop Here If:* Rule pits freedoms against each other (e.g., landlords vs. tenants).  
     - *Memo Language:* "This rule involves a value choice between [Group A's freedom] and [Group B's freedom]. Panel makes no recommendation."  

  6. **SUMMARY RATING**  
     - **GREEN:** Low/No Interference, Low Domination, and Low Capability Impact.  
     - **AMBER:** Conflicting scores (e.g., High Interference + High Capability) OR Medium Domination.  
     - **RED:** High Interference without High Capability OR High Domination.  
     *Memo Language:* "Recommendation: [GREEN/AMBER/RED] based on [key findings]."  

  ---

  ### **WHICH DISTINCTIONS SURVIVE?**  
  | Concept          | Included? | Why Essential                                                                 |  
  |------------------|-----------|-------------------------------------------------------------------------------|  
  | **Interference** | Yes       | Verifiable obstacles are measurable and legally salient.                      |  
  | **Domination**   | Yes       | Unused discretionary power creates systemic risk (Pettit’s core insight).    |  
  | **Capability**   | Yes       | Barriers to agency matter if widespread and rule addresses them (Sen’s focus).|  
  | **Value Pluralism** | Yes    | Berlin’s "conflicting ends" flagged for democratic resolution.               |  
  | **Intent vs. Effect** | Dropped | Requires subjective judgment; stick to text/observable effects.             |  

  ---

  ### **APPLICATION TO LIVE PROPOSALS**  
  *(Panel memo format; findings based solely on rule text)*  

  #### **Case 1: Setback Waiver Power**  
  - **Q1:** No prohibitions/penalties → Interference = **None**.  
  - **Q3:** Permit office has discretionary power → Domination risk.  
  - **Q4:** Power is (a) unreviewable and (b) criteria undefined → **High Domination**.  
  - **Q5/Q6:** No barrier removal cited → Capability = **Low**.  
  - **Q7:** Interference low but domination high → **WARNING: Non-interference effects undervalued**.  
  - **Rating: RED** (High Domination without offsetting Capability).  
  *Your Instinct Challenge:* As an "obstacle counter," you saw no interference → costless. Protocol overrules: domination risk is structural.  

  #### **Case 2: Well Driller Licensing**  
  - **Q1:** Requires license/exam → **Medium Interference** (cost/time).  
  - **Q3:** State has power, but appeal panel includes practitioners → **Medium Domination**.  
  - **Q4:** Criteria defined (exam); appeal exists → No (a)/(b).  
  - **Q5/Q6:** Barrier? Unlicensed drilling risks water safety → **Medium Capability** (if evidence shows ≥5% contamination risk).  
  - **Rating: AMBER** (Balanced interference vs. capability; domination mitigated by appeal).  

  #### **Case 3: Landlord Renewal Obligation**  
  - **Q1:** Prohibits non-renewal without cause → **High Interference** (restricts landlord choice).  
  - **Q3:** No discretionary power → **Low Domination**.  
  - **Q5/Q6:** Removes barrier for tenants (arbitrary eviction) → **High Capability** (if ≥5% of tenants face instability).  
  - **Q8:** Yes (landlord interference vs. tenant capability) → **VALUE CONFLICT**.  
  - **Memo:** "Rule pits landlords’ negative freedom against tenants’ capability for secure housing. Panel defers to elected board."  
  - **Rating:** No summary (handed off).  

  ---

  ### **CONFIDENCE ASSESSMENT**  
  - **85% Confidence** in capturing core philosophical claims:  
    - The procedure operationalizes Berlin’s "two concepts" (Q1–Q2 = negative; Q5–Q6 = positive) and Pettit’s non-domination (Q3–Q4).  
    - Hard cases addressed:  
      - Domination without interference (Case 1) → flagged.  
      - Discretionary power unused (Q4) → still high risk.  
      - Capability claims (Q6) → require evidence.  
  - **Weakest Step:** **Q6 (Capability Evidence)**. Philosophers (e.g., Nussbaum) argue capability is normative, not empirical. Requiring ≥5% prevalence may exclude marginalized groups. A philosopher would reject this as "metric bias."  
  - **Bias Check Success:** Q7 forces confrontation with domination/capability when interference is low (countering your instinct in Case 1).  

  ---

  ### **PROTOCOL READY FOR USE**  
  This fits your constraints: 90-minute application, no prior reading, board-friendly output. It avoids prescribing values but exposes trade-offs for democratic debate. The three test cases confirm it overrules "obstacle counters" when domination lurks (Case 1) and forces value debates where freedoms clash (Case 3).
