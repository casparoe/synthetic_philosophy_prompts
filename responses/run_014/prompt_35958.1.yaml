prompt: |-
  I do foresight work at a mid-sized consultancy — mostly scenario planning for clients in energy and shipping. A big chunk of my job is building "what if" histories: we tell a client, suppose X hadn't happened in 1973, here's the plausible world that follows, and we use that to stress-test whatever strategy they're about to commit money to. My problem is my colleaugues' counterfactuals keep smuggling in inevitability. Somebody writes "even without the oil shock, the energy picture would look basically the same today," and you can just tell they ran history forward to whatever answer they already believed and called it a counterfactual. The whole point of the exercise is to locate where contingency actually lived, and we're using it as decoration.

  I vaguely remember from college that philosophers of history have actual tools for this — something like a "minimal rewrite" rule (change the least you can to get the divergence), and distinguishing causes that were necessary from ones that just happened to be sufficient in that setting. But I only half-remember it and can't reconstruct it. Can you turn whatever is actually usable from that way of thinking into a procedure I can run when vetting a draft scenario? To be concrete about my situation: we produce maybe three or four of these a quarter, each goes into a report with the client's name on it, the partner signs off, and I usually have a day at most to review a draft before it goes up the chain. So what I need is:

  - a checklist I can run on a draft in under an hour, with the questions in order
  - for each question, what counts as a pass and what counts as a fail
  - the places where the checklist has to stop and hand it back to the author, because the question is really about deep structure or values and no procedure can settle it
  - an honest note about where the procedure will misfire — I get that historical counterfactuals can't be tested the way they can in physics, so tell me what the procedure is actually doing in that case, even if the answer is "mostly keeping the author honest"

  Then run it on three scenarios from recent drafts:

  1. "If the shipping container had been invented ten years earlier, global manufacturing would still have ended up concentrated in East Asia." A junior swears by this one. I think it's inevitability in disguise — the second half of the sentence is doing no work, it's just today's world with a different start date — but I can't proove that with anything except my own irritation.
  2. "If the 1973 embargo had lasted six more months, Japan would have decarbonized by 1990." Client loves this one, it fits their story about energy transitions being shock-driven.
  3. "If Britain had never joined the EEC, its manufacturing decline would have looked the same, because deindustrialization was global." — actually make it two scenarios, one where the counterfactual change is small and one where it's enormous, so I can see whether the procedure treats them differently.

  And please be straight with me about at least one case where the procedure yields a verdict I won't like (probably #2, given who's paying us), and about what the whole exercise can't do — if the checklist ends up just laundering my intuitions with extra steps, I'd rather know that now.
reasoning: |-
  Okay, the user works in foresight at a consultancy focusing on energy and shipping. They're frustrated because their colleagues' counterfactual scenarios often assume inevitability, undermining the purpose of stress-testing strategies. They recall some philosophical concepts like "minimal rewrite" and necessary vs. sufficient causes from college but need a practical checklist to review drafts quickly. 

  Hmm, the user's real pain point seems to be about intellectual rigor versus client convenience. They're tactfully hinting that partners might prefer palatable narratives (like scenario #2 where Japan decarbonizes by 1990) over challenging analyses. The unspoken tension: how to push back without jeopardizing deliverables or relationships. 

  For the checklist design, I should prioritize speed—30 mins max per review—but build in off-ramps where debates require deeper discussion (e.g., "was containerization necessary for Asian manufacturing?"). The three test cases are perfect for stress-testing: #1 tests determinism, #2 examines shock overreach, #3 compares scale of divergence. 

  Key philosophical anchors: David Lewis's possible worlds (minimal change), Weber's historical "switch points," and distinguishing NECESSARY conditions (without X, Y impossible) from SUFFICIENT ones (X guarantees Y). The checklist must flag when authors confuse correlation with causality—like assuming embargo duration alone could trigger decarbonization (#2) while ignoring technological/political prerequisites. 

  Biggest tradeoff: This won't eliminate subjectivity. When the procedure rejects scenario #2 for overclaiming, the user might face pushback from clients who want that conclusion. I'll explicitly warn that the checklist exposes logic gaps but can't resolve value conflicts—that's where their expertise must step in. 

  For the "Britain outside EEC" example, the procedure should treat small/large divergences differently: minor tweaks (e.g., tariff rates) demand high plausibility bars, while major changes (no single market access) allow bolder chains—but require more contingency checks. 

  Final note: The user's self-awareness is refreshing. They're right that bad counterfactuals are "decorative"—so the checklist's real job is making assumptions visible, not proving alternatives "true."
answer: |-
  Here’s a practical **Counterfactual Vetting Checklist** for your scenario drafts, distilled from philosophy of history (David Lewis, Max Weber, Niall Ferguson) and foresight best practices. Focus: **identifying hidden inevitability, overclaiming, and unexamined assumptions**.

  **Procedure Rules**:
  1. **Time Limit**: 30-45 min per draft.
  2. **Fail = Mandatory Rework** (unless flagged for deeper debate).
  3. **Stop & Hand Back**: When core assumptions about causality/agency require rethinking (noted per question).
  4. **What This Does**: Forces explicit justification of causal links, surfaces embedded determinism, and separates *plausible alternatives* from *inevitability narratives*. It doesn’t "prove" scenarios but exposes weak logic.

  ---

  ### **The Checklist**  
  *(Run in Order – Stop at First Major Fail)*

  1. **THE MINIMAL REWRITE TEST**  
     *Question*: "Is the counterfactual change the *smallest possible deviation* from actual history to trigger the proposed divergence?"  
     *Pass*: Alters 1-2 specific events/decisions (e.g., "OPEC meeting on Oct 16, 1973, ends without embargo agreement").  
     *Fail*: Implies broad, vague changes (e.g., "less geopolitical tension in the 1970s").  
     *Stop & Hand Back*: If the change requires rewriting fundamental structural forces (e.g., "if capitalism worked differently").  
     *Misfire Risk*: Oversimplifies complex systems; use judgment if minor change plausibly cascades.

  2. **NECESSARY vs. SUFFICIENT CAUSE AUDIT**  
     *Question*: "Does the scenario treat the altered factor as *necessary* for the actual outcome, when it might only have been *sufficient*?"  
     *Pass*: Acknowledges other paths to the same outcome (e.g., "The oil shock accelerated decarbonization trends, but regulations/prices could have achieved similar results later").  
     *Fail*: Assumes the altered factor was the *only possible* cause (e.g., "Without the embargo, *no* decarbonization would occur").  
     *Stop & Hand Back*: If the team conflates correlation with necessity (requires historical debate).

  3. **CONTINGENCY LOCATOR**  
     *Question*: "Does the scenario identify *at least 3 plausible pivot points* post-change where outcomes could branch significantly?"  
     *Pass*: Notes specific decisions/events with high agency (e.g., "In 1975, without price shock pressure, the Japanese MITI might have delayed efficiency R&D funding").  
     *Fail*: Assumes straight-line development from change to outcome (e.g., "Earlier containers → automatically faster Asian industrialization").  
     *Misfire Risk*: Overemphasizes "great man" history; focus on institutional/structural agency.

  4. **INEVITABILITY SNIFF TEST**  
     *Question*: "Does the outcome *preserve today’s world* except for the client’s variable of interest? If yes, is this justified?"  
     *Pass*: Explains *why* other historical forces would dominate (e.g., "East Asia’s labor costs and infrastructure would still attract manufacturing, even with delayed containers").  
     *Fail*: Today’s world reappears without mechanistic explanation; the counterfactual feels decorative.  
     *Stop & Hand Back*: If the team insists on inevitability for narrative simplicity.

  5. **SHOCK-DRIVER OVERCLAIM CHECK**  
     *Question*: "If a shock is removed/extended, does the scenario address *pre-existing conditions* enabling the outcome?"  
     *Pass*: Considers whether foundations for the outcome existed pre-shock (e.g., "1970s Japan already had energy security concerns and tech capacity").  
     *Fail*: Attributes outcome solely to shock duration/severity (e.g., "Six more months of embargo *causes* full decarbonization").  
     *Misfire Risk*: Underweights cumulative factors; mitigates by requiring pre-shock evidence.

  6. **SCALE-OF-CHANGE SANITY CHECK**  
     *Question*: "Is the magnitude of the counterfactual change proportional to the outcome’s scale?"  
     *Pass*: Minor changes → localized effects; major changes → systemic disruption (e.g., "No UK in EEC disrupts regional supply chains, accelerating offshoring").  
     *Fail*: Disproportionate claims (e.g., "10-year container delay changes nothing" or "6-month embargo extension changes everything").  

  ---

  ### **Application to Your Draft Scenarios**
  **Scenario 1**: *"If shipping containers were invented 10 years earlier, global manufacturing still concentrates in East Asia."*  
  - **Minimal Rewrite**: Pass (specific tech delay).  
  - **Necessary/Sufficient**: **Fail** – Assumes containers were *sufficient but not necessary* for Asian manufacturing rise, without proving other factors (labor, policy) would *inevitably* compensate. Ignores path dependency (e.g., earlier containers might have shifted investment to India/Mexico).  
  - **Verdict**: Rework. Must explain *why* East Asia still wins without containers enabling just-in-time global supply chains.  

  **Scenario 2**: *"If 1973 embargo lasted 6 more months, Japan decarbonizes by 1990."*  
  - **Shock Overclaim Check**: **Fail** – Assumes embargo duration alone determines decarbonization. No evidence Japan had 1990-ready tech/policy *pre-1973*. Overlooks fossil lobbying, grid constraints.  
  - **Contingency Locator**: **Fail** – No pivot points (e.g., "MITI could have funded nuclear over solar"). Straight-line causation.  
  - **Verdict**: **You won’t like this – but it fails**. Client’s preferred narrative lacks mechanism. Hand back with note: "Specify how 6 extra months overcome real-world barriers X, Y, Z."  

  **Scenario 3a (Small Change)**: *"If UK joined EEC 2 years later, manufacturing decline same."*  
  - **Scale-of-Change**: Pass – Minor delay, plausible minimal impact.  
  - **Inevitability Sniff Test**: Pass – If decline was structural (e.g., global productivity shifts), timing may not matter.  

  **Scenario 3b (Major Change)**: *"If UK never joined EEC, manufacturing decline same due to globalization."*  
  - **Necessary/Sufficient**: **Fail** – Treats EEC as *insufficient* to alter outcome, but doesn’t prove decline was *inevitable* without it. Ignores EEC-specific factors (e.g., tariff access, FDI incentives).  
  - **Contingency Locator**: Pass (if it notes e.g., "UK might have pivoted to Commonwealth trade or protectionism").  
  - **Verdict**: Conditional pass. Add contingency analysis to justify inevitability claim.  

  ---

  ### **Honest Limitations**  
  - **What This Can’t Do**:  
    1. **Predict the unpredictable**: No checklist captures true black swans.  
    2. **Resolve value conflicts**: E.g., if partners believe "shocks drive all transitions," the checklist flags overclaiming but won’t change minds.  
    3. **Replace expertise**: It catches lazy logic, not nuanced historical debate.  
  - **Misfire Warnings**:  
    - May reject bold but defensible scenarios if authors skip justification.  
    - "Plausible" is subjective; partner judgment may override.  
  - **Reality Check**: This **isn’t laundering your intuition** – it systematizes rigor. But in consultancy, *client politics can override logic*. Flag fails clearly; let partners own the risk.  

  **Final Tip**: When handing back drafts, frame fails as *"Client might question how we got here – can we bolster the logic?"* Not "you're wrong," but "make this bulletproof."
