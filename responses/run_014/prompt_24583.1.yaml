prompt: |-
  I was going back and forth with a friend last night about whether I'm even being coherent about voting, and I realized I can't really articulate what I'm going by. So I've writen down my gut verdicts and I'd like to know if there's a principle behind them, or if I'm just making it up as I go.

  Here's where I land. I vote in local school board races where I think my vote has a real shot at actually mattering, and I vote in close presidential elections. But I skip state legislature races I'm pretty sure is safe, and I'll skip even a close race if I'm out of town and getting back to the polls would be a genuine hassle. And yet I vote in a presidential election I'm confident is a foregone conclusion, mostly out of some vague sense of duty, even though I know my single vote can't possibly change the outcome. But I don't feel any pull at all to vote in an election I genuinely don't care about the result of, and I skip those without a flicker of guilt.

  The case I keep going back and forth on is a close race between two candidates I basically like equally — my vote might genuinely tip it, but since I have no strong preference I'm not sure it's worth the effort. Is there a principle that captures all of this, or at least most of it? And if not, which verdict do I have to give up, and what would the resulting principle say about a case I haven't mentioned, like a close referendum on something I care a lot about where I'm pretty sure my vote won't be the one that breaks the tie?
reasoning: |-
  Okay, the user is trying to figure out the principles behind their voting decisions. They listed specific scenarios where they vote or don't vote and feel conflicted about some cases. Let me unpack this step by step.

  First, they vote in local school board races because they feel their vote matters. Presidential elections, they participate in when it's close or out of duty even if it's a foregone conclusion. But they skip safe state races or if it's inconvenient. The dilemma is a close race between two equally liked candidates—should they vote even without a preference?

  Hmm. The user wants a consistent principle. Their behavior seems driven by a mix of perceived impact and personal stakes. The key factors are: the probability their vote matters (marginal impact), the strength of their preference (stakes), and the cost of voting (effort, time). 

  Looking at their examples: local school boards have higher impact per vote and likely high personal stakes. Close presidential races have very low individual impact but high stakes, which explains voting out of duty. Skipping safe races or when it's a hassle makes sense because the impact is near zero, or cost is high. Not voting when indifferent? Zero stakes, so why bother.

  The tricky case is the close race with no preference. Here, even though impact is high, stakes are low. The user hesitates because the effort isn't justified without personal gain. They might need to accept that voting requires some preference. The referendum example: high stakes but low individual impact. Duty might compel them here, aligning with the presidential case. 

  I should emphasize that their approach is rational. The principle combines impact, stakes, and cost. They might need to adjust by acknowledging that civic duty applies when stakes are high, regardless of impact. Or accept that indifference is a valid reason not to vote. Either way, their existing logic mostly holds. The user's deeper need is coherence in their decisions, reducing cognitive dissonance. They want to feel their choices are justified, not arbitrary. Providing a framework helps them navigate future dilemmas confidently.
answer: |-
  Your voting patterns make perfect sense and align with a rational (and common!) decision-making framework. Your gut verdicts stem from balancing **three key factors**:

  1.  **Perceived Marginal Impact:** The probability your single vote will change the outcome.
  2.  **Perceived Stakes:** How much you care *personally* about the outcome (the difference between candidates/policies).
  3.  **Perceived Cost:** The effort, time, and inconvenience required to vote.

  **Here's how your verdicts map to these factors:**

  *   **Vote in local school board (close) races:** High Impact (small electorate), High Stakes (direct impact on your community/kids), Moderate/Low Cost.
  *   **Vote in close presidential elections:** Low Impact (huge electorate), High Stakes (major national consequences), Moderate Cost.
  *   **Skip safe state legislature races:** Very Low Impact (safe seat), Variable Stakes (could be high, but...), Moderate Cost. *Impact dominates - why bother if it won't matter?*
  *   **Skip even close races if high hassle:** Variable Impact, Variable Stakes, **Very High Cost.** *Cost dominates - effort exceeds perceived benefit.*
  *   **Vote in foregone presidential election:** Very Low Impact, **High Stakes**, Moderate Cost. *Stakes/Duty dominate.*
  *   **Skip elections you don't care about:** Variable Impact, **Very Low Stakes**, Variable Cost. *Stakes dominate - why bother if outcome is indifferent?*

  **The Principle:** You vote when the **Combined Perceived Value** (Impact * Stakes) outweighs the **Perceived Cost**.

  *   `Combined Perceived Value (CPV) = (Probability Vote Matters) * (Personal Importance of Outcome Difference)`
  *   **Decision Rule:** Vote if `CPV > Cost`

  **Applying this to your dilemma:**

  *   **Close race, two candidates liked equally:** `Impact = High`, `Stakes = Very Low` (you're indifferent), `Cost = Moderate`.
      *   `CPV = (High) * (Very Low) = Very Low`
      *   **CPV < Cost** -> **Skip.** This aligns with your instinct. High impact is negated by zero personal stakes. The effort isn't justified *for you* because you derive no personal benefit from one candidate winning over the other. Your vote might tip it, but tipping it *doesn't matter to you*. Skipping is perfectly rational under this principle.

  **Applying it to the new case:**

  *   **Close referendum you care a lot about, but sure your vote won't be tie-breaker:**
      *   `Impact = Very Low` (you believe it won't be the tie-breaker, but in a close race, it's *statistically* higher than a presidential race). However, *your perception* is Very Low.
      *   `Stakes = Very High` (you care deeply).
      *   `Cost = Moderate` (standard voting effort).
      *   `CPV = (Very Low) * (Very High) = Moderate` (The low probability drags down the high stakes).
      *   **CPV vs. Cost:** This is the **closest call**, mirroring your "foregone presidential election" vote.
          *   If `Moderate CPV > Moderate Cost` -> **Vote** (driven by duty/stakes, accepting low individual impact).
          *   If `Moderate CPV < Moderate Cost` -> **Skip** (low impact dominates despite high stakes).
      *   **Your Principle Suggests:** You *would likely vote* here, just like you do in the foregone presidential race. Why? Because **high stakes can compensate for low (but non-zero) impact**, especially when the cost isn't prohibitive. Your "sense of duty" in the presidential case is effectively the "high stakes" factor applied to national consequences. Here, the high stakes are personal and specific. The principle captures this consistency.

  **What verdict might you need to give up for absolute consistency?**

  To achieve *perfect* consistency under the `CPV > Cost` principle, the slight tension is between **foregone presidential** (vote) and **close referendum you care about but think your vote won't matter** (potential skip).

  *   **Option 1 (More Rationalist):** Give up voting in the foregone presidential election. Your `Impact` is effectively zero. `CPV = (Near Zero) * (High) = Near Zero`. `Near Zero < Moderate Cost` -> Skip. This maximizes pure cost/benefit but sacrifices the civic duty/symbolic aspect.
  *   **Option 2 (Your Current Stance):** Acknowledge that for **extremely high-stakes elections** (like President, or this major referendum), **civic duty/symbolism/personal expression adds an intangible value boost to the `CPV`** that compensates for very low impact, making `CPV > Cost` even when the pure probability calculation is tiny. This is the most common and arguably most psychologically realistic approach. You vote because participating in a crucial democratic act *matters to you personally*, regardless of the microscopic chance of being decisive.

  **Conclusion:** You are **not** just making it up. You're intuitively applying a **rational cost-benefit analysis** weighted by:
  1.  How likely your vote is to matter (`Impact`).
  2.  How much the outcome matters to *you* (`Stakes`).
  3.  How much effort it takes (`Cost`).

  The `Combined Perceived Value (Impact * Stakes)` must outweigh the `Cost` for you to vote. Your "duty" feeling in high-stakes/low-impact elections is effectively assigning a high intrinsic value (`Stakes`) to participation itself. Your indifference in the close-but-no-preference race is perfectly captured by `Stakes = 0`, making the effort unjustified. For the close referendum, your principle strongly suggests voting (like you do for President) due to the high stakes compensating for the perceived low impact.
