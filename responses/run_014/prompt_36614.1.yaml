prompt: |-
  A friend and I spent most of last night arguing about where pseudohistory ends and merely wrong, unfashionable, or prematurely dismissed history begins — Fomenko came up, as did Atlantis, ancient aliens, and a long detour through nineteenth-century archaeology — and I came away with something embarrassing: a page of my own verdicts on particular cases that I cannot make cohere under any principle I can state. I would like you to help me find the principle, or tell me which verdicts have to go.

  Here are my verdicts, with the reasoning I found myself giving as I gave them. Fomenko's New Chronology is pseudohistory, full stop: the statistical and astronomical methods are window dressing, the thesis is structured so that any evidence against it is reinterpreted as evidence of a later forgery, and the whole thing happens to flatter a nationalist narrative. Ancient aliens is pseudohistory too, and something additionally ugly — it works by default attributing non-European achievements to outside intervention. Atlantis is stranger, because I hold two verdicts under one name: the occult, Atlantean-super-civilization tradition is pseudohistory, but the sober question of whether Plato's story has a Bronze Age kernel, perhaps something behind the Minoan world and the Santorini eruption, strikes me as legitimate if unresolvable speculation. So the demarcation seems to track what is being done with the claim rather than the claim's content.

  Then come the hard ones. Norse presence in North America was a minority position defended from saga texts until the Newfoundland excavation in the 1960s, and I do not want to call the pre-vindication defenders pseudohistorians. But I do call the defenders of the Kensington runestone pseudohistorians, even though they too rely on an artifact plus documentary enthusiasm; the honest difference is that the sagas are medieval manuscripts and the runestone's language is a modern pastiche, yet that is an evidential difference, and I don't want demarcation to collapse into evidence quality, because bad evidence is not automatically pseudohistory. Similarly: Schliemann took a poetic text as a travel guide, was obsessive, and destroyed the stratigraphy of the very site he was looking for — and I file him under bad archaeology, not pseudohistory — while Menzies's 1421, structurally the same story of an amateur with a text and a hunch, gets the pseudohistory label from me without hesitation. Black Athena seems to me wrong and overreaching, but it is contested history, not pseudohistory. The Solutrean hypothesis was published by credentialed archaeologists in mainstream venues, and yet I want to call it fringe — though I am not sure whether "fringe" and "pseudohistory" are the same category or merely overlap. And the pre-Clovis settlement advocates were ridiculed for decades before the archaeological community accepted their case, which means vindication came to people who had been dismissed, without my wanting to retroactively classify them either way.

  My tentative principle, which my friend promptly dismantled: pseudohistory is a property of argumentative practice rather than of claims — immunization against possible disconfirmation, an implied conspiracy of suppression, methods that could not have failed — not of a claim's truth, its proponents' credentials, or its eventual fate. Her objection is that stated this way the principle cannot do the work: the L'Anse aux Meadows defenders and the Fomenkoites both relied on texts against a skeptical consensus, Schliemann's circular readings of Homer look structurally like the immunizing moves I condemn elsewhere, and "immunization" risks being a label I attach post hoc to whatever I already decided. She also insists the demarcation is partly sociological — what matters is whose criticism gets engaged with, and by whom — while I want it to be purely about how the claim is held.

  So here is what I am asking for. State, precisely, one principle (or a small set of candidates) that captures these verdicts, with the specific case that motivates each clause. Tell me which of my verdicts cannot be accommodated and would have to go, and why those rather than others. Tell me what the principle predicts for cases I have not listed — I would start with Graham Hancock's lost ice-age civilization, which keeps me ambivalent because he does respond to counter-evidence, though selectively and with much goalpost-shifting, and with the Oxfordian attribution of Shakespeare's plays, which I genuinely cannot place. And tell me honestly whether the vindication cases force the principle to be retrospect-dependent after all, which I very much do not want it to be. I want an analysis of my judgments and the principle behind them, not a survey of the literature.
reasoning: |-
  Okay, the user has presented a complex philosophical and methodological problem about distinguishing pseudohistory from legitimate but contested historical scholarship. They've shared their intuitive judgments on various cases and want help formulating a coherent principle that explains these judgments without inconsistency. 

  First, I notice the user is clearly well-read in historiography and has deeply considered this problem - their examples range from Fomenko to Schliemann to the Solutrean hypothesis. The frustration with their own inconsistent judgments feels genuine. What they're really wrestling with is epistemological: how do we define bad-faith historical revisionism versus good-faith controversial scholarship?

  The key tension in their examples seems to be between methodology and sociology. They instinctively reject credentialism (not wanting to penalize pre-L'Anse aux Meadows scholars) but also reject pure evidence-based demarcation (since bad evidence doesn't automatically mean pseudohistory). Their friend's sociological objection clearly troubles them, as they want a purely methodological distinction.

  Looking at their cases, the throughline might be epistemic responsibility. Fomenko and Menzies both systematically evade falsification, while Schliemann (though terrible methodologically) was willing to let evidence contradict his theory. The Kensington stone defenders persist despite linguistic proof it's fake, whereas pre-Clovis scholars accepted methodological rules even when ridiculed. 

  For their ambivalent cases: Hancock fits the pseudohistory pattern with his goalpost-shifting, while Oxfordians might be fringe but not pseudohistory if they engage textual evidence traditionally. The Atlantis distinction is insightful - it's about whether the claim is treated as testable hypothesis versus dogmatic tradition.

  The vindication problem is thorny. Their principle must work prospectively, so I should emphasize that the pseudohistorian's epistemic vices would persist even if evidence eventually favored them (unlike the pre-Clovis case where methods were sound). 

  I'll formulate the core principle around systematic immunity to counterevidence, with secondary criteria about evidence handling. Cases that won't fit neatly are Black Athena (which they correctly identify as contested scholarship despite flaws) and perhaps the Solutrean hypothesis which straddles fringe/pseudohistory due to its treatment of genetic evidence. The sociological aspect can't be ignored entirely - part of pseudohistory is rejecting disciplinary accountability - but I'll frame this as methodological isolation rather than mere outsider status.
answer: |-
  Based on your judgments and reasoning, here's a precise principle that captures your verdicts, identifies problematic cases, and provides a framework for new examples:

  **The Core Principle: Pseudohistory is characterized by a *systematic commitment to immunizing core claims against falsification*, primarily through *methodological inversion* (treating evidence as subordinate to predetermined conclusions) and/or *reliance on unfalsifiable auxiliary assumptions* (like ubiquitous conspiracies or lost super-knowledge), while actively rejecting or redefining disciplinary standards of evidence and critique.**

  ### How This Principle Explains Your Verdicts
  1.  **Fomenko (Pseudohistory):** *Perfect fit.* Evidence against the chronology is *always* reinterpreted as proof of forgery (methodological inversion). The core claim is insulated by the unfalsifiable auxiliary assumption of a massive, centuries-long conspiracy.
  2.  **Ancient Aliens (Pseudohistory):** *Perfect fit.* Achievements are explained by default via an unfalsifiable external agent (aliens). Evidence *against* alien intervention (e.g., evidence of indigenous development) is dismissed or twisted into "proof" of a cover-up (methodological inversion). Rejects archaeological/anthroplogical standards.
  3.  **Atlantis (Split Verdict):**
      *   **Occult Super-Civilization (Pseudohistory):** Relies on unfalsifiable auxiliary assumptions (Atlantean psychic powers, lost ultra-technology). Evidence is selectively interpreted to fit the predetermined conclusion.
      *   **Plato/Minoan Hypothesis (Legitimate Speculation):** Proposes a potentially falsifiable kernel (e.g., "Was Plato inspired by memories of a major Bronze Age disaster?"). Engages with archaeological evidence on its own terms, even if inconclusive.
  4.  **Pre-L'Anse aux Meadows Saga Defenders (Not Pseudohistory):** Engaged with the *only available evidence* (medieval texts) using accepted philological methods. Lacked archaeological proof but *didn't* invoke conspiracies to explain its absence or invert methodology to immunize the claim. Accepted disciplinary standards.
  5.  **Kensington Runestone (Pseudohistory):** *Methodological inversion.* Linguistic, runological, and historical evidence *against* authenticity is dismissed as error, fraud, or conspiracy. The interpretation of the artifact is forced to fit the desired conclusion (Norse in Minnesota), subordinating evidence.
  6.  **Schliemann (Bad Archaeology, Not Pseudohistory):** Used flawed methods (destroying stratigraphy) and had obsessive conviction. *However,* he sought physical evidence *to test* the Homeric text. His methods were awful, but his *epistemological approach* was (crudely) empirical: find Troy *based on* the text, then let the evidence speak. He didn't systematically immunize his core belief (Troy was real) against all counter-evidence *by definition*.
  7.  **Menzies's 1421 (Pseudohistory):** *Methodological inversion.* Evidence (maps, artifacts, historical records) is selectively interpreted or misrepresented to fit the predetermined conclusion of Chinese global exploration. Counter-evidence is dismissed via ad hoc reasoning or conspiracy (knowledge suppression). Rejects standard historical/geographical methodology.
  8.  **Black Athena (Contested History, Not Pseudohistory):** While wrong/overreaching, Bernal engaged seriously with evidence (linguistic, archaeological) within disciplinary frameworks, proposing testable (albeit flawed) hypotheses. His arguments were debated *on the evidence*; he didn't *systematically* invert methodology or invoke unfalsifiable conspiracies as core immunizing tactics.
  9.  **Solutrean Hypothesis (Fringe, Not Necessarily Pseudohistory):** Published in mainstream venues using standard archaeological methods (comparative tool analysis). Makes *falsifiable* claims about migration routes and timing. Its fringe status stems from *weak evidence* and strong counter-evidence (genetics), not inherent immunization. Controversy exists *within* disciplinary norms.
  10. **Pre-Clovis Advocates (Not Pseudohistory):** Proposed falsifiable claims grounded in archaeological evidence (even if initially scant/contested). Used standard methods, argued within the discipline. Their vindication came through *better evidence* and *accepted methods*, not methodological inversion or conspiracy theories.

  ### Verdicts That Must Go/Be Modified & Why
  1.  **Schliemann:** Your verdict is **correctly preserved** under the principle. He lacked the *systematic immunization* core to pseudohistory. His flaws were methodological incompetence and bias, not pseudohistorical epistemology.
  2.  **Pre-Clovis:** Your verdict is **consistent**. The principle distinguishes between *unpopular but methodologically sound* claims and pseudohistory.
  3.  **Solutrean Hypothesis:** You need to **soften your "fringe" label** regarding pseudohistory. Under the principle, it's "fringe" due to weak evidence and rejection by most experts, but *not* inherently pseudohistory unless proponents start systematically immunizing it (e.g., dismissing genetics via conspiracy or redefining science). Its initial publication aligns with contested history.
  4.  **Kensington Runestone:** Your verdict **holds**. The principle clearly identifies the methodological inversion and reliance on auxiliary conspiracy/fraud assumptions to immunize the core claim against linguistic and historical evidence.

  ### Predictions for New Cases
  1.  **Graham Hancock's Lost Ice-Age Civilization (Pseudohistory):** *Systematic Immunization*: Counter-evidence (lack of archaeological traces, genetic timelines) is dismissed via unfalsifiable auxiliary assumptions (catastrophe destroyed evidence, "mainstream" suppression/conspiracy). *Methodological Inversion*: Selectively interprets geology, myths, and ambiguous artifacts as proof, reinterpreting or ignoring context/established dating. Actively rejects disciplinary standards.
  2.  **Oxfordian Theory (Shakespeare Authorship) (Fringe/Contested, Not Pseudohistory):** While based on weak evidence and speculation, core arguments often engage with textual analysis, historical context, and biographical gaps using (flawed) but recognizable methods within literary/historical study. Proponents *can* become pseudohistorical (invoking vast cover-ups), but the core claim itself isn't *inherently* unfalsifiable or reliant on systematic inversion. Most arguments try (however poorly) to fit evidence within existing frameworks, not redefine them utterly to immunize the claim. (Verdict: Fringe/Contested History).

  ### Vindication & Retrospect Dependence
  The principle **avoids retrospect dependence**. It focuses on *how the claim is argued and defended at the time*, not its eventual truth value:
  *   **Pre-Clovis:** Advocates used sound *methods* and engaged with evidence/criticism *within the discipline*, even when unpopular. Vindication came *through* those methods.
  *   **Pseudohistory (e.g., Fomenko):** Even if some minor claim were accidentally validated, the *core methodology* (inversion, unfalsifiable assumptions) remains pseudohistorical. The system is designed to *always* "win," regardless of evidence.
  *   **Key Test:** Ask: "If this claim were definitively proven false tomorrow, would the proponents accept it, or would they invoke conspiracy/redefine evidence/methods to maintain the core claim?" Pseudohistorians always choose the latter.

  ### Addressing Your Friend's Objections
  1.  **"L'Anse aux Meadows vs. Fomenko both used texts vs. consensus":** The difference is *how* they used texts. Saga defenders used texts as *evidence subject to critique* within philology. Fomenko uses texts as *raw material for arbitrary reinterpretation*, immunized by conspiracy.
  2.  **"Schliemann's circularity looks like immunization":** Schliemann's circularity was born of bias and poor methodology, but crucially, he *expected physical evidence to confirm the text*. He didn't *systematically define away* the possibility of disconfirmation. If he'd found nothing at Hissarlik, he *might* have looked elsewhere, not declared a conspiracy hid the *real* Troy. Pseudohistory builds the immunization *into its core structure*.
  3.  **"Immunization is post hoc labeling":** The principle defines specific *types* of immunization (methodological inversion, unfalsifiable auxiliaries) that are observable in the *structure* of the arguments, not just the outcome. It's why Menzies is pseudohistory and Schliemann isn't, despite both being "amateurs with a hunch."
  4.  **Sociology vs. Methodology:** The principle incorporates a *minimal* sociological element: *"actively rejecting or redefining disciplinary standards."* This addresses *how* criticism is engaged with – pseudohistory rejects the *validity* of the discipline's standards and critiques wholesale, often creating its own parallel systems. Contested/fringe history argues *within* or *at the edges* of those standards, even if contentiously. It's not *who* engages, but *on what epistemological grounds* critique is accepted or rejected.

  ### Conclusion
  Your core intuition – that pseudohistory is about *argumentative practice* and *how claims are held* – is sound. The principle refines this by identifying **systematic immunization against falsification** as the hallmark, manifested through **methodological inversion** and reliance on **unfalsifiable auxiliary assumptions**, coupled with **rejection of disciplinary standards**. This explains your verdicts, preserves the distinction between bad evidence/methods and pseudohistory, avoids retrospect dependence, and handles ambivalent cases like Hancock (pseudohistory) and Oxfordians (fringe/contested). The only significant adjustment is viewing the Solutrean hypothesis as mainstream-published fringe archaeology rather than pseudohistory, unless its proponents adopt immunizing tactics.
