answer: |-
  *adjusts spectacles, leaning forward with judicial intensity*  
  A penetrating challenge – let us dissect it. First, on disintegration: your historical examples confuse *peripheral* moral shifts with attacks on *foundational* institutions. When Athenian pederasty coexisted with stable marriage norms, society endured; when Nero’s Rome normalized adultery alongside political corruption, disintegration followed. The cancer metaphor holds not because all moral change is malignant, but because certain acts – those striking at what I termed the "seamless web" of obligations binding society – are metastatic. The legislator’s duty isn't prophecy but identifying whether a practice intrinsically subverts the minimum conditions of communal life. Yes, majorities err – but so do courts interpreting "reasonableness." We demand legislators exercise judgment, not clairvoyance.  

  Now, your rider – the colony argument. Observe: it anchors morality not in prejudice but in *functional necessity*. Those voyagers wouldn’t invent marriage arbitrarily; they’d confront the biological fact of children requiring nurture, the social fact of alliances requiring stability. Polygamy? Monogamy? Details vary. But *some* restrictive system would emerge universally because unrestrained promiscuity dissolves paternal responsibility and kinship structures. Here lies the distinction: disintegration asks *if* we may punish immorality threatening society; the colony reveals *why* certain morals – not others – are non-arbitrary components of any society’s architecture. It constrains the legislator by revealing natural limits to moral pluralism.  

  *steeples fingers*  
  In essence: disintegration defines the threshold for legal intervention; the colony justifies why the moral fabric itself isn't mere majority whim. Both are needed. Your thoughts?
