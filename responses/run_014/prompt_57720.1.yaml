answer: |-
  Here's the joke crafted to your specifications:

  The DSM work group finally unveiled "anticipatory dysregulation" after four years: pervasive rehearsal of future conversations paired with acute self-diagnosis via the criteria themselves. Field trials, run like DSM-III's, stunned them. Kappa was suspiciously pristine, and prevalence *doubled* at the second site visit. Clearly, something was muddying the waters.

  Their solution? An elegant exclusion: "not better accounted for by familiarity with the criteria." Problem solved, they declared.

  Of course, this just made the category predict its own confirmation with uncanny accuracy—a perfectly closed loop. You’d never see quarks behave like this. But quarks, bless their indifferent hearts, don’t subscribe to the journals where their criteria are published.
