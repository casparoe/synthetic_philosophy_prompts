prompt: |-
  My colleague keeps reaching for 'geography is destiny' in our climate chats, last time to argue a region that's drying out is basically done and we should stop pretending adaptation will save it — the water and the growing season just aren't there anymore. I get the sense the phrase is doing severel different jobs and he never says which. Can you break down the precise claims it could be making — that geography fully determines outcomes, that it sets the outer limits of what's possible, that it's the deepest cause even when it's not the immediate one, that it's a hard ceiling on human effort, or just a loose way of saying non-human factors matter? For each, say whether it's defensible and whether it would actully support his 'stop trying to adapt' move, and tell me which reading I bet he's really running. I'd like it as a menu I can bring back to him.
