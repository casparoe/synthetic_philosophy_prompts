prompt: |-
  I'm a journalist who covers science and ideas for a general-interest magazine, and last year I started reporting a feature on why people vote the way they do when they despise every viable option. The reporting kept surfacing two camps who had long since stopped listening to each other. The first camp — call them the harm-minimizers — holds that in a first-past-the-post election with two viable candidates, a ballot is damage-control equipment and nothing else: the probability that yours is decisive is tiny but nonzero, the stakes are enormous, and since the cost of voting is trivial, you vote for the less bad of the two, full stop. The second camp — call them the clean-hands camp — holds that a vote is an act of political self-authorship: casting it for a candidate you find odious, merely because other people's behavior makes that candidate's rival a live threat, makes you complicit in what follows, and no multiplication of a tiny probability by a large benefit figure launders that. Each camp thinks the other has misunderstood what a vote even is. The harm-minimizers say the clean-hands voters are mistaking a soapbox for a lever. The clean-hands camp says the harm-minimizers have a theory that can explain why to vote but cannot explain why anyone should care how.

  I eventually persuaded a representative of each camp, with a couple of their respective fellow travelers, to spend two days in a closed room on the adversarial-collaboration model I've watched work in psychology disputes, with me as rapporteur. My assignment for you is to draft the joint statement I was supposed to file afterwards. It must contain the following. First, a numbered section of claims both camps can sign — I expect this to include the old rational-choice point that turnout needs something like a duty term to be explicable at all, an agreed acknowledgment that virtually no individual vote alters an outcome, and, crucially, the concession they eventually reached that a voter in a jurisdiction whose result is utterly foregone may, even by the harm-minimizers' own lights, vote sincerely. Second, a table of the disagreements that remain, each row worded so that the camp it describes would accept the phrasing — the two of them spent ninety minutes fighting over the sentence that begins a vote is a tool, so keep the wording scrupulously neutral. Third, the cruxes: the sub-questions such that settling one would move at least one camp, each paired with a concrete case both sides agree bears on it and with each side's prediction written down in advance. Three cases they consented to treat as tests: a vote-swapping scheme in which a third-party voter in a swing jurisdiction pairs with a major-party voter in a safe one, each casting the other's preferred ballot, so that each cause nets one vote; a referendum on a civilizational-scale risk whose benefits accrue over centuries, where the decisiveness probability is minuscule and the stakes astronomical; and the secret-ballot problem — if no one ever learns how you voted, what exactly is being expressed, and can clean-hands reasoning survive the removal of an audience? Finally, both camps asked me to establish which parts of their dispute are merely verbal. They have come to suspect that the phrase supporting a candidate means preferring that candidate's victory to the harm-minimizers, but approving of the candidate to the clean-hands camp. The statement should say which disagreements dissolve once those words are pinned down and which are as hard as ever — and it should be a document either of them could put their name to without wincing.
reasoning: |-
  We are drafting a joint statement resulting from an adversarial collaboration between two camps: the harm-minimizers and the clean-hands camp. The statement must include:

  1. A numbered section of agreed claims.
  2. A table of remaining disagreements, worded neutrally.
  3. The cruxes: sub-questions with concrete test cases and each camp's predictions.
  4. An analysis of which disagreements are merely verbal and which are substantive.

  ---

  **Joint Statement: On the Nature of Voting in Two-Party Systems with Despised Options**

  **Introduction**

  We, the undersigned, representing two distinct philosophical approaches to voting in elections where all viable candidates are found deeply objectionable by the voter, have engaged in an adversarial collaboration to clarify points of agreement and disagreement. We recognize that the act of voting is a complex social and personal act, and our goal is to advance the public understanding by delineating where our views converge and where they diverge, and by identifying questions whose resolution might bridge the remaining gaps.

  ---

  **Section 1: Agreed Claims**

  Both camps agree on the following propositions:

  1. **The Rational-Choice Framework and the Role of Duty**: The rational-choice model of voting, which weighs the costs and benefits of voting, requires an additional term (such as a sense of civic duty) to explain why people vote at all, given the negligible probability that an individual vote will be decisive. Without such a term, the expected utility of voting would typically be negative due to the costs (time, effort) outweighing the expected benefits (which are the product of a minuscule probability and the utility difference between candidates).

  2. **The Negligible Probability of Decisiveness**: In any large-scale election, the probability that a single vote will change the outcome (i.e., break a tie) is infinitesimally small. This is a mathematical fact that both camps accept.

  3. **The Trivial Cost of Voting**: The direct costs of voting (time, travel, etc.) are typically low, though they may be nontrivial for some individuals (e.g., due to disability, lack of transportation, or restrictive voting laws).

  4. **The Distinction Between Swing and Safe Jurisdictions**: Both camps agree that the strategic context of a vote depends on the jurisdiction. In a jurisdiction where the outcome is a foregone conclusion (a "safe" state or district), the harm-minimizers concede that a voter may, without violating their own principles, cast a sincere vote (i.e., for a candidate they truly prefer, even if that candidate is not viable) because the vote has no chance of affecting the outcome. In such a case, the harm-minimizing calculation yields no reason to vote for the lesser evil since there is no harm to be mitigated. Conversely, in a swing jurisdiction, the harm-minimizers argue that the same calculation compels a vote for the lesser evil.

  5. **The Stakes of the Election**: Both camps acknowledge that the stakes in an election can be very high, with significant potential harms and benefits depending on who wins.

  ---

  **Section 2: Table of Remaining Disagreements**

  The following table lists the core disagreements between the two camps. Each row describes a position in a manner that the camp it describes would accept.

  | **Camp** | **Core Position** |
  |----------|-------------------|
  | **Harm-Minimizers** | A vote is a tool for minimizing expected harm in the world. In a two-party first-past-the-post system with two viable candidates, a vote should be cast for the candidate whose victory would produce the least bad outcome, because the tiny but nonzero probability of decisiveness, multiplied by the large stakes, creates an expected utility that outweighs the trivial cost of voting. |
  | **Clean-Hands Camp** | A vote is an act of political self-authorship and moral expression. Casting a vote for a candidate one finds odious, even to prevent a worse outcome, compromises one's moral integrity and makes one complicit in that candidate's actions. The negligible probability of decisiveness does not change the expressive nature of the act, and thus one must vote in accordance with one's true values, regardless of the expected consequences. |

  **Note on the Tool Metaphor**: The harm-minimizers describe a vote as a "tool" (specifically, damage-control equipment) because they see it as an instrument for effecting outcomes. The clean-hands camp rejects this metaphor because they see a vote as an expression of the self, not merely a causal lever. We note that this difference in metaphor reflects a deeper disagreement about the nature of voting.

  ---

  **Section 3: Cruxes and Test Cases**

  We identify three test cases that bear on key sub-questions. For each case, we state the crux (the sub-question) and each camp's prediction about how a voter should act. These cases are designed to probe the boundaries of each camp's theory and might help resolve some disagreements.

  1. **Vote-Swapping Scheme**  
     - **Case**: A third-party voter in a swing jurisdiction pairs with a major-party voter in a safe jurisdiction. They agree that the swing-jurisdiction voter will vote for the major-party candidate (to help prevent a worse outcome), while the safe-jurisdiction voter will vote for the third-party candidate (to express support for that cause). Thus, each cause nets one vote.  
     - **Crux**: Does such a scheme allow a voter to simultaneously minimize harm and keep clean hands?  
     - **Harm-Minimizers' Prediction**: This scheme is acceptable and even praiseworthy because it produces a better expected outcome (the swing vote is cast for the lesser evil) while allowing the third-party cause to gain a vote in a safe jurisdiction.  
     - **Clean-Hands Camp's Prediction**: The scheme is morally problematic because the swing-jurisdiction voter is still casting a vote for a candidate they find odious, thus soiling their hands. The safe-jurisdiction voter is also complicit in this arrangement. The clean-hands camp might accept the scheme only if the swap does not require the swing-jurisdiction voter to endorse the major-party candidate (e.g., if the vote is seen as a purely strategic act without endorsement), but they remain skeptical.

  2. **Referendum on a Civilizational-Scale Risk**  
     - **Case**: A referendum on a policy that would reduce a catastrophic risk (e.g., an existential risk to humanity) with benefits accruing over centuries. The probability that one vote is decisive is minuscule (say, 1 in 100 million), but the stakes are astronomical (the survival of future generations).  
     - **Crux**: Does the multiplication of a minuscule probability by astronomical stakes create a moral obligation to vote for the policy, even if one must vote for a candidate or party one finds odious to support it?  
     - **Harm-Minimizers' Prediction**: Yes, because the expected utility (stakes multiplied by probability) is large enough to outweigh any cost and thus compels a vote for the policy.  
     - **Clean-Hands Camp's Prediction**: No. The minuscule probability does not change the fact that a vote for an odious candidate or policy is an endorsement that compromises the voter's moral integrity. The voter must vote against the odious candidate or policy regardless of the expected consequences.

  3. **The Secret-Ballot Problem**  
     - **Case**: Suppose that due to a malfunction, a voter's ballot is never recorded and no one (including the voter) ever learns how they voted. Alternatively, consider a voter who dies immediately after casting a secret ballot and before anyone can know their choice.  
     - **Crux**: If no one ever learns how you voted, what is the expressive content of the vote? Can clean-hands reasoning survive the removal of an audience?  
     - **Harm-Minimizers' Prediction**: The vote has no expressive content because expression requires an audience. In this case, the vote is purely about outcomes, and if it cannot affect outcomes (because it is lost), it is meaningless. If it could have been decisive, then the harm-minimizing logic still applies.  
     - **Clean-Hands Camp's Prediction**: The vote remains an act of self-authorship and moral expression even if no one else ever knows about it. The voter knows, and the act is constitutive of the self. Thus, the voter must still vote according to their conscience.

  ---

  **Section 4: Merely Verbal vs. Substantive Disagreements**

  Both camps agree that some of their disagreement stems from the ambiguity of the phrase "supporting a candidate." We clarify:

  - **Harm-Minimizers**: To "support a candidate" means to *prefer that candidate's victory* over the alternative(s), because it would produce a better (or less bad) outcome. It does not imply moral approval of the candidate.
  - **Clean-Hands Camp**: To "support a candidate" means to *morally approve* of the candidate and their platform, such that voting for them is an endorsement.

  **Disagreements that Dissolve with Clarification**:

  - The statement "I voted for candidate X but I do not support them" is incoherent to the clean-hands camp but coherent to the harm-minimizers. Once we clarify the two meanings of "support," we see that the harm-minimizers are using "support" in a purely outcome-oriented sense, while the clean-hands camp uses it in an expressive/moral sense. Thus, this particular conflict is verbal.

  **Disagreements that Remain Substantive**:

  - Even after clarifying the meaning of "support," the two camps still disagree on whether it is permissible to vote for a candidate one does not morally approve of (in the clean-hands sense) in order to prevent a worse outcome. This disagreement is not merely verbal but reflects a deep divergence in ethical priorities: consequentialism versus deontology (or expressivism).

  ---

  **Conclusion**

  We have identified points of agreement, clarified the core disagreements in neutral terms, proposed test cases to probe the boundaries of each theory, and disentangled verbal from substantive disputes. We hope this document advances public discourse and provides a foundation for future dialogue.

  Signed:
  [Names of Participants from Both Camps]

