answer: |-
  ### Joint Statement on the Nature of Voting in Systems with Despised Options  
  *Produced via adversarial collaboration between representatives of the "harm-minimizer" and "clean-hands" camps, with rapporteur oversight*  

  ---

  #### **Section 1: Agreed Claims**  
  Both camps endorse the following propositions without reservation:  
  1. **The Necessity of a "Duty Term" in Rational-Choice Models**: Turnout in large-scale elections is only explicable by incorporating non-instrumental motivations (e.g., civic duty, expressive identity, or social pressure) into rational-choice frameworks. The expected utility of voting, based solely on instrumental outcomes, is typically negative due to the negligible probability of decisiveness.  
  2. **The Negligible Probability of Decisiveness**: In any election of substantial scale, the probability that an individual vote alters the outcome is vanishingly small—mathematically indistinguishable from zero in all but the closest contests.  
  3. **The Low Marginal Cost of Voting**: The direct costs of casting a ballot (time, effort, etc.) are generally trivial for most voters, though contextual barriers (e.g., voter suppression, disabilities) may elevate them.  
  4. **The Distinction Between Swing and Safe Jurisdictions**: A voter in a jurisdiction where the outcome is a *foregone conclusion* (e.g., a landslide-prone state) may, *even under harm-minimizing principles*, vote "sincerely" (e.g., for a nonviable third party). In such cases, the instrumental value of harm reduction is null, rendering sincere voting logically consistent with harm-minimization.  
  5. **The High Stakes of Elections**: Electoral outcomes can produce significant harms or benefits for society, amplifying the ethical weight of voting decisions.  

  ---

  #### **Section 2: Table of Persistent Disagreements**  
  The table below neutrally summarizes irreconciled positions. Each row uses language acceptable to the camp it describes.  

  | **Camp**               | **Core Position on Voting**                                                                                                                                                             |  
  |------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|  
  | **Harm-Minimizers**    | A vote is a low-cost instrument for reducing expected societal harm. In a two-viable-candidate, first-past-the-post system, voting for the "lesser evil" is obligatory when the outcome is uncertain, as the infinitesimal probability of decisiveness, multiplied by the stakes, yields a net positive expected utility. |  
  | **Clean-Hands Camp**   | A vote is an irreducible act of moral self-expression. Supporting a candidate deemed odious—even to prevent greater harm—constitutes complicity in their actions and violates integrity. The negligible probability of decisiveness does not transform voting into a purely instrumental act; it remains a public affirmation of values. |  

  ---

  #### **Section 3: Cruxes and Test Cases**  
  The following sub-questions, paired with concrete cases, represent unresolved pivots in the debate. Predictions from each camp are documented in advance.  

  1. **Crux: Can vote-swapping reconcile harm reduction with moral integrity?**  
     - **Case**: A vote-swapping pact between a third-party supporter in a swing state and a major-party supporter in a safe state. Each casts a ballot for the other’s preferred candidate, ensuring both causes gain one vote.  
     - **Harm-Minimizer Prediction**: The scheme is ethically sound. It achieves optimal harm reduction (a consequentialist "net good") without compromising either voter’s instrumental goal.  
     - **Clean-Hands Prediction**: The swing-state voter’s act remains morally tainted. Casting a ballot for an odious candidate, even as part of a trade, constitutes endorsement and complicity. The scheme fails to absolve individual responsibility.  

  2. **Crux: Does astronomical stakes × minuscule probability create a moral duty to vote instrumentally?**  
     - **Case**: A referendum on mitigating civilizational risk (e.g., an asteroid collision) with stakes valued at 1 billion future lives but a decisiveness probability of 10⁻¹⁰.  
     - **Harm-Minimizer Prediction**: Yes. The expected utility (10⁻¹⁰ × 10⁹ = 0.1 life saved) outweighs voting costs, compelling an instrumental vote.  
     - **Clean-Hands Prediction**: No. Moral integrity forbids endorsing an odious policy/candidate, irrespective of stakes or probabilities. The act’s expressive meaning dominates its consequences.  

  3. **Crux: Does clean-hands voting require an audience?**  
     - **Case**: A secret ballot is cast but destroyed before being counted or observed. No entity (including the voter) ever learns the choice.  
     - **Harm-Minimizer Prediction**: The vote lacks expressive power. With no audience, "self-authorship" is incoherent; only instrumental consequences matter (which are nullified here).  
     - **Clean-Hands Prediction**: The act retains moral significance. The voter’s private affirmation of integrity, not external recognition, defines the expressive act.  

  ---

  #### **Section 4: Merely Verbal vs. Substantive Disagreements**  
  Both camps agree that the phrase "**supporting a candidate**" is central to the dispute and admits two distinct definitions:  
  - **Harm-Minimizers**: "Support" denotes *preferring a candidate’s victory* over alternatives due to comparative harm reduction.  
  - **Clean-Hands Camp**: "Support" denotes *moral approval* of the candidate’s character or platform.  

  **Disagreements Dissolved by Clarification**:  
  - The statement, "I voted for Candidate A but do not support them," is coherent under the harm-minimizing definition (voting as harm reduction ≠ approval) but incoherent under the clean-hands definition (voting = endorsement). This conflict is purely verbal.  
  - Claims that one camp "misunderstands what a vote is" reduce to definitional differences about "support."  

  **Disagreements That Remain Substantive**:  
  - **The Permissibility of Instrumental Voting**: Even with "support" clarified, the camps disagree on whether it is ethical to vote for a candidate one *morally disapproves of* to reduce harm. This reflects a deeper ethical schism: consequentialism (harm-minimizers) vs. deontology/expressivism (clean-hands).  
  - **The Role of Probability**: Whether the near-zero chance of decisiveness nullifies or amplifies voting’s moral weight remains contested.  

  ---

  #### **Conclusion**  
  This statement reflects hard-won consensus on key empirical and logical points, while transparently preserving irreconciled ethical commitments. We offer it not as resolution, but as a foundation for clearer public debate.  

  *Signatories*:  
  [Names of harm-minimizer representatives]  
  [Names of clean-hands representatives]  
  *Rapporteur*: [Journalist’s Name]  

  ---  
  **Formatting note**: This draft uses clear section headers, bullet points for agreed claims, a minimally worded table, and explicit labels for test-case predictions to ensure neutrality and signatory comfort. Ethical cruxes are isolated, and verbal ambiguities are disambiguated upfront.
