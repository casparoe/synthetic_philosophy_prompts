prompt: |-
  I'm writing a feature for a science-and-ideas magazine on the foundations of probability, and one knot I keep coming back to is the reflection principle — the proposed constraint that a rational agent's credence in a proposition p, conditional on the fact that her credence in p is x, should be exactly x. From the outside, the debate over whether this principle is genuinely binding looks like it might be half verbal, and I'd like to understand where the disagreement actually lives. Could you give me your honest credence that the reflection principle is a real, non-trivial normative constraint on rational credal states, rather than a mere convention or a stipulation that dissolves on inspection? I want the number and the reasoning that produces it, broken into its component sub-questions. Please format your answer as a numbered list of exactly five items, each one or two sentences, with no introduction and no conclusion: in item 1, state the precise proposition you are assigning a credence to and give your overall number; in items 2 through 4, take up the three sub-questions your number depends on — whether the principle is entailed by principles we already accept (the Dutch-book argument, the sure-thing principle, dynamic consistency), whether the self-referential objections to it (the kind that construct a situation in which an agent who obeys the principle is led to act against her own interests) defeat it, and whether the principle is even well-formed, given that its conditioning clause refers to the agent's own credence — attaching a rough probability and a single line of justification to each; and in item 5, name the sub-question your final number is most sensitive to and say what argument or evidence would move it most.
