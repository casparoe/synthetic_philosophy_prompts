  The user might also be hinting at hypocrisy. People who mislead often justify it by saying they didn't technically lie. Philosophers like Williams point out that this distinction allows for plausible deniability, which might be more insidious. So the moral judgment here might be about the speaker's attempt to evade responsibility.

