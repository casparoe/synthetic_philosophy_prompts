  Hmm, this is a classic philosophy of metaphysics puzzle. The user's confusion is spot-on - they've identified the core tension between relational properties and absolute space. Their intuition about positions being genuine properties is philosophically valid, and their skepticism about "handwavy" symmetry arguments shows good critical thinking. 

  The real depth here lies in different interpretations of "properties" - Leibniz meant intrinsic properties only, while modern readers often include relational ones. The user seems frustrated by what feels like definitional sleight-of-hand, which is understandable. 

  I should emphasize how Black's setup deliberately creates ambiguity: by making space homogeneous and symmetrical, he removes any external reference frame that could ground "left/right" distinctions. The user's "secretly exclude properties" suspicion is partially correct - Black is testing what counts as a legitimate property for individuation. 

