  2.  (4) Verdicts stating "no deeper principle needed" conflicts with (3) Explanatory Generalism: Generalism demands *some* true general principle explains *every* right act (like "prevent severe harm"), even if complex; denying a principle for the verdicts contradicts generalism.
  3.  (3) Explanatory Generalism and (5) Competence-as-skill create tension: If judges cannot state the principles explaining their correct verdicts "without loss", it's unclear how we know such principles *exist* as required by generalism, or how competence reliably accesses them.
  4.  (1) Holism and (5) Competence-as-skill cohere well: Holism's contextual sensitivity naturally aligns with viewing judgment as a perceptual skill acquired through practice, rather than applying fixed rules.
  5.  (4) Verdicts and (5) Competence-as-skill are mutually supportive: The verdicts exemplify context-sensitive judgment, and (5) explains how agents reach such judgments without needing to articulate a simple rule, fitting the described cases.
