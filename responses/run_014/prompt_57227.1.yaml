prompt: |-
  So I've been going down a rabbit hole on memetics lately — Dawkins's original idea that tunes, catchphrases, and fashion spread the way genes do, by getting copied — and the more I read, the more I hit this objection that I can't shake: that when a story or a rumor passes from person to person, nobody actually copies it. People hear it, pull out the gist, and rebuild their own version from that gist plus whatever they already believed, so there's never a thing that gets replicated faithfully in the first place. An anthropologist pushed something like this hard around the turn of the millennium and said cultural spread is better modeled like an epidemic of mental representations than like genetics.

  What's your credence that, 20 years out, somebody has a worked-out version of memetics that takes that objection seriously — treats the cultural item as something reconstructed rather than copied — and can actually predict a real instance of cultural change better than a model that never uses the replicator idea at all? Just wants a number and where it comes from, no preamble, don't restate my question, lead with the bottom line in the first sentence.

  Then break it down for me:

  - What even makes a meme a meme? I can see three answers — near-perfect copying, successful reconstruction that keeps the same function even though the surface changes, or the honest answer that there's no one mechanism and "meme" is a grab bag. Give me a rough probability on each and say which you'd bet on.
  - Does "better prediction" have any real meaning here, given that you can usually redescribe the same outcome afterward in either vocabulary? That's the term I'd most like you to argue with if you think I've rigged it.
  - Is there actual evidence on the table either way — like, does comparing the variants of the same tale or urban legend across a population look more like mutation-and-selection or more like each teller rebuilding from scratch?

  Finish with which single sub-question my number is most sensitive to, and what would have to turn up to move you by more than about 15 points.
reasoning: |-
  Okay, the user has been diving into memetics and is stuck on this idea that cultural items aren't copied but reconstructed. They want a credence on whether in 20 years someone will have a worked-out version of memetics that addresses this reconstruction idea and can predict cultural change better than non-replicator models. They also have three sub-questions about what defines a meme, whether "better prediction" is meaningful, and evidence from things like urban legends.

  First, I need to give a number upfront. The user stressed leading with the bottom line. I'm thinking around 35%. Why? Because while there's progress in fields like cultural evolution and cognitive science, integrating reconstruction into memetics is tough. Predictive models are hard, and the field is fragmented. Plus, there's competition from alternative frameworks.

  Next, the sub-questions. For the first one, what makes a meme a meme? The user mentioned three options: perfect copying, functional reconstruction, or a grab bag. I'd say near-perfect copying is low, maybe 15%. Functional reconstruction is higher, 40%, because it aligns with how ideas spread with gist retention. The grab bag is 45% since "meme" is often used loosely. I'd bet on functional reconstruction as the most defensible.

  Second, is "better prediction" meaningful? The user wants me to challenge if it's rigged. Yes, it can be meaningful. Predictive models need to forecast novel phenomena, not just retrodict. If a model predicts how a rumor evolves in a new context, that's testable. But it's tricky because both frameworks might explain the same data post-hoc. The key is novel predictions.

  Third, evidence from urban legends. Studies on chains of transmission show both mutation and reconstruction. Iterated learning experiments suggest biases affect reconstruction, but it's not purely random mutation. This looks more like guided reconstruction than gene-like copying. So, evidence leans toward reconstruction.

  The user's credence is most sensitive to whether "better prediction" can be rigorously tested. If future research develops models that make novel predictions, like forecasting meme variants in a network, and these are validated, that would boost the credence. Alternatively, if all models remain unfalsifiable, the number drops.

  What would move the credence by 15 points? If large-scale digital data (e.g., Twitter meme evolution) shows predictive models based on reconstruction outperform replicator models, that could increase it to 50%. Or if integrated frameworks emerge combining cognitive biases with network effects. Conversely, if no progress is made in prediction, it could drop to 20%.
answer: |-
  **Credence: 35%**  

  ### Breakdown:  
  1. **What makes a meme a meme?**  
     - Near-perfect copying: **15%** (rare outside digital/ritual contexts).  
     - Functional reconstruction: **40%** (core "gist" preserved; adaptive to cognitive biases).  
     - Grab-bag term: **45%** (colloquial use dominates; no unified mechanism).  
     **Bet on functional reconstruction**—it aligns with evidence on gist-based memory and cultural attractors.  

  2. **Is "better prediction" meaningful?**  
     **Yes, but only with novel predictions.** Post-hoc redescriptions are equally possible, but predictive power requires forecasting *unobserved* outcomes (e.g., how a rumor mutates in a new demographic). Models avoiding replicators (e.g., *epidemiological* or *attractor* models) currently excel at retrodiction; memetics must outperform them in *prospective* tests to matter.  

  3. **Evidence from tales/legends:**  
     Transmission chains (e.g., urban legends) show **reconstruction dominates**:  
     - Surface details mutate wildly (e.g., "Hookman" variants), but core threats persist (e.g., "dangerous stranger").  
     - Cognitive biases (e.g., negativity, minimal counterintuitiveness) shape retellings more than random mutation.  
     - Iterated learning experiments (e.g., Tamariz’s linguistic chains) confirm: reconstruction + bias explains stability better than copy-error.  

  ### Sensitivity & Key Movers:  
  Your credence is most sensitive to **"better prediction" being testable**. To shift my estimate by ±15%:  
  - **↑ to 50%**: Lab/field experiments show reconstruction-based memetic models *outpredict* alternatives for novel cultural trends (e.g., forecasting viral TikTok sound evolution).  
  - **↓ to 20%**: No memetic model achieves predictive parity by 2044, or "reconstruction" proves unfalsifiable (e.g., all cultural change is reducible to emergent network effects).
