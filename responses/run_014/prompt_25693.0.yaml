prompt: |-
  I've been tracking a colleague's judgments on a particular kind of question: when someone's detailed, first-personal "inside view" of a situation conflicts with a statistical or consensus-based "outside view," should they trust their own reasoning or defer? Here are six cases with her verdicts:

  1. A physician sees a patient with symptoms consistent with a disease whose population prevalence is 0.01%. A test with 95% sensitivity and 95% specificity returns positive. The physician computes the posterior probability at roughly 0.02% and concludes the patient almost certainly does not have the disease, the positive test notwithstanding. My colleague says the physician reasoned correctly by deferring to the base rate.

  2. A film director has made three previous films, all critical and commercial successes. Her vision for her fourth film is stylistically unusual and departs from current market trends. Studio executives note that roughly 80% of films that depart substantially from market trends underperform. She trusts her vision and insists on her approach. My colleague says she is right to trust her own judgment.

  3. A retail investor with no formal finance training trades based on patterns she perceives in price charts. The base rate for day traders is that roughly 95% lose money over any five-year window. She believes she is in the successful 5%. My colleague says she should defer to the base rate.

  4. A firefighter with twenty years of experience arrives at a burning building and has a sudden, strong intuition that the floor is about to give way, though the visible structural indicators do not suggest imminent collapse. He orders his team out. My colleague says he was right to trust his intuition given his experience, regardless of how things turned out.

  5. A political commentator has a detailed theory predicting the incumbent will lose, contradicting the polling average, prediction markets, and the near-unanimous consensus of other analysts. The commentator has made similarly contrarian election predictions before and has been wrong more often than right. My colleague says he should defer to the consensus.

  6. A master violin maker selects tonewood by tapping it and feeling the vibrations, ignoring the measured density and grain specifications in the guild manual. She has been making acclaimed instruments for over thirty years. My colleague says she is right to trust her tactile judgment.

  Now a new case: A software engineer with fifteen years of experience has spent six months designing a new architecture for her company's core system. She has led three previous major rewrites — two succeeded, one failed. The industry base rate for large-scale system rewrites is that roughly 70% either fail outright or are abandoned before completion. She believes her design avoids the specific pitfalls that cause most rewrites to fail, and she can articulate in detail what those pitfalls are and how her design addresses each one. She advocates for proceeding.

  What would my colleague say? More importantly, what rule or rules is she implicitly applying? I can see at least two or three candidate principles that fit her first six verdicts equally well but diverge on the software engineer. Please identify those candidate rules, say what each predicts for the new case, give your best guess about which rule she is actually running and why, and propose a further case — not among the seven described — that would cleanly discriminate between the remaining candidates.
reasoning: |-
  Okay, let me try to unpack this user's query. They've presented six scenarios where their colleague decides whether someone should trust their inside view or defer to the outside view. Now there's a seventh case about a software engineer, and the user wants to predict the colleague's verdict and understand the underlying principles. 

  First, I need to analyze the colleague's pattern across the initial six cases. In case 1 (physician), she defers to base rates. Case 2 (film director) trusts personal judgment despite market stats. Case 3 (retail investor) defers to base rates. Case 4 (firefighter) trusts intuition based on experience. Case 5 (political commentator) defers to consensus. Case 6 (violin maker) trusts tactile expertise. 

  Hmm... there seem to be two possible principles at play here. One could be about the source of expertise: does the person have deep experiential knowledge? Another might be about whether they can articulate specific reasons why their case is an exception. 

  For the physician (case 1), they used statistical reasoning but didn't claim special insight about this particular patient. The film director (case 2) had a track record but no detailed counter-arguments to the market data. The violin maker (case 6) had both experience and sensory expertise that's hard to quantify. 

  Now looking at the new software engineer case: she has 15 years experience, 2/3 success rate on rewrites, and crucially, she can articulate specific pitfalls and how her design avoids them. This feels closer to the firefighter and violin maker situations than to the investor or commentator. 

  I suspect the colleague's real rule might be: "Trust inside view when the expert can articulate case-specific reasons why general statistics don't apply, AND they have relevant domain experience." The software engineer seems to meet both criteria. 

  But to test this, we'd need a hypothetical case where someone has strong experience but vague reasons, versus someone with detailed reasons but no track record. Like... a chef ignoring food safety stats because they "feel" the risk is low versus a new chef with brilliant scientific arguments. That might tease apart which factor matters more to the colleague.
answer: |-
  Based on your colleague's pattern of judgments, I've identified three plausible candidate rules that fit the first six cases. They diverge significantly on the software engineer case. Here's the analysis:

  **Candidate Rules:**

  1.  **Rule A: Trust Inside View Only with Tacit/Intuitive Expertise:** Defer to the outside view (statistics/consensus) *unless* the individual's expertise relies heavily on unconscious pattern recognition, intuition, or sensory perception developed through extensive, specific experience (e.g., firefighter intuition, violin maker's tactile sense). Formal reasoning or explicit arguments *against* the base rate are insufficient; the expertise must be fundamentally non-verbalizable.
      *   *Fits Cases:* 4 (firefighter intuition), 6 (violin maker tactile sense). Defers in others (1, 3, 5) or trusts where intuition/sense is implied but not central (2 - director's "vision" could be seen as intuitive).
      *   *Prediction for Software Engineer:* **DEFER.** The engineer relies on explicit reasoning ("can articulate in detail") and track record, not unconscious intuition/sensory perception. The base rate (70% failure) should dominate.

  2.  **Rule B: Trust Inside View with Track Record AND Specific Counter-Arguments:** Defer to the outside view *unless* the individual has both:
      *   **(i) A relevant, personal track record of success (demonstrating skill above base rate).**
      *   **(ii) The ability to articulate specific, case-specific reasons why *this* situation is an exception to the base rate (not just general confidence).**
      *   *Fits Cases:*
          *   Trusts: 2 (director: track record of 3 successes, specific vision/style argument), 4 (firefighter: implicit track record through 20yrs, specific intuitive warning), 6 (luthier: 30yrs track record, specific tactile judgment). Note: Firefighter's "articulation" is the intuitive signal itself.
          *   Defers: 1 (physician: no track record cited, used base rate correctly), 3 (investor: no track record/skill cited, no specific counter-argument), 5 (commentator: poor track record cited, no specific counter-argument against consensus).
      *   *Prediction for Software Engineer:* **TRUST.** She has a relevant track record (2/3 previous rewrite successes - above base rate? *See below*) AND articulates specific pitfalls and how her design avoids them. She meets both criteria.

  3.  **Rule C: Trust Inside View When Domain Expertise Allows Case-Specific Override:** Defer to the outside view *unless* the individual possesses deep, relevant domain expertise *and* uses that expertise to perform a case-specific analysis showing why the base rate is less applicable here. The ability to articulate the reasoning is key. Track record strengthens the case but isn't strictly necessary if the reasoning is sound and expert.
      *   *Fits Cases:*
          *   Trusts: 1 (physician *is* deferring, but *uses* expertise to correctly interpret stats - fits "domain expertise allows correct application of outside view"), 2 (director: expertise informs specific vision), 4 (firefighter: expertise grounds intuition), 6 (luthier: expertise grounds tactile sense).
          *   Defers: 3 (investor: no domain expertise/skill), 5 (commentator: track record suggests flawed expertise/reasoning).
      *   *Prediction for Software Engineer:* **TRUST.** She has deep domain expertise (15yrs) and articulates a detailed, case-specific analysis of pitfalls and mitigations, justifying why *this* rewrite differs from the base rate.

  **Analysis of Software Engineer Case & Prediction:**

  *   **Rule A (Tacit Expertise):** Predicts **DEFER.** The engineer's reliance on explicit design reasoning and articulated pitfalls contrasts sharply with the firefighter's gut feeling or the luthier's tactile sense. Her expertise is analytical, not intuitive/sensory.
  *   **Rule B (Track Record + Counter-Arguments):** Predicts **TRUST.** She has a *relevant* track record (2/3 successes - crucially, this is above the 30% implied success rate of the 70% failure base rate) AND provides specific counter-arguments (pitfalls addressed).
  *   **Rule C (Expertise + Case-Specific Analysis):** Predicts **TRUST.** She has deep expertise and provides a detailed, case-specific analysis justifying an override.

  **Best Guess & Why:**

  I believe your colleague is most likely applying **Rule B: Trust Inside View with Track Record AND Specific Counter-Arguments.**

  *   **Why Rule B over Rule C?** Rule C would likely have led her to trust the physician in Case 1 *more* (as he used expertise correctly), but she explicitly endorsed his *deferral* to the base rate. Rule B explains the deference there (no personal track record cited for *that* diagnostic judgment, just correct statistical reasoning).
  *   **Why Rule B over Rule A?** She trusted the film director (Case 2) who relies on "vision" – which is less about pure intuition and more about creative judgment potentially informed by experience/reasoning. Rule B fits this (track record + specific vision argument) better than Rule A. She also trusted the firefighter's intuition *because of* his experience ("given his experience"), implying the experience validates the intuition, aligning with the "track record" component of Rule B.
  *   **Fit for Software Engineer:** The engineer's 2/3 success rate on rewrites (suggesting skill above the dismal base rate) combined with her specific, articulated counter-arguments ("pitfalls avoided") strongly matches the criteria for trust under Rule B, just like the film director.

  **Discriminating Case:**

  To cleanly differentiate between **Rule B (Track Record + Counter-Arguments)** and **Rule C (Expertise + Case-Specific Analysis)**, propose this case:

  **Case 7: The Novice Cardiologist**
  A cardiology resident (1st year out of medical school) encounters a patient with atypical chest pain. Standard protocols and statistical risk models strongly suggest non-cardiac causes (~90% probability). However, the resident meticulously reviews the patient's specific, complex history, an unusual EKG finding they researched, and a rare study they recall. They construct a detailed argument for why *this specific patient* falls into the high-risk 10%, advocating for urgent catheterization. The resident has no independent track record of overriding protocols successfully. *Senior cardiologists review the case and disagree with the resident's interpretation, believing the resident is over-interpreting minor anomalies.*

  *   **Rule B (Track Record + Counter-Arguments) Prediction:** **DEFER.** While the resident provides specific counter-arguments, they *lack a relevant personal track record of success* demonstrating their skill at such overrides is above the base rate implied by the senior disagreement and protocol accuracy. Deference is warranted.
  *   **Rule C (Expertise + Case-Specific Analysis) Prediction:** **TRUST (or at least seriously consider).** The resident, while inexperienced, possesses relevant *domain knowledge* (cardiology training) and has performed a *detailed, case-specific analysis* attempting to justify why the base rate/protocol doesn't apply here. The rule emphasizes the reasoning itself, potentially overriding the lack of track record or senior consensus.
  *   **Why it Discriminates:** This case pits specific counter-arguments *without* a supporting track record against deep domain expertise *in development*. Rule B requires both components and would defer. Rule C focuses on the application of expertise (even nascent) to case specifics and would be more inclined to trust the inside view argument, despite the lack of senior validation or personal history. Your colleague's verdict here would strongly indicate whether the track record is a strict requirement (Rule B) or if sound expert reasoning alone can suffice (Rule C).
