prompt: |-
  I'm trying to reverse-engineer what my friend Dana, a bioethics professor, is actually going on about, because she's handed down a bunch of verdicts on market cases and I keep getting the sense she's running some consistent principle but I can't pin down which one. (Came up because we were at a dinner last week and someone started the whole "should people be allowed to sell their kidneys" thing and I realized I don't actually know her underlying rule.) Here's her track record so far, and she's been pretty firm on all three: selling one of your kidneys to a stranger for money is impermissible; selling your vote is impermissible; but selling your own plasma — the regenerable stuff they take at the donation centers — is perfectly fine.

  The new case I want her take on: a healthy but broke college student offers to sell both of her kidneys after she dies — a postmortem organ sale, to a wealthy buyer on a waiting list, in a well regulated market with full medical screening and a fair price paid to her estate. She's alive and healthy right now, so nothing is taken from her while she's living. What do you think Dana will say, permissible or impermissible? But honestly I'm less interested in the raw answer than in the rule she seems to be running. I suspect those three verdicts fit more than one principle just aswell — maybe something about exploiting people with weak bargaining power, maybe something about certain goods just not being for sale, maybe something about whether the seller (or other people) end up seriously worse off. Can you lay out the candidate rules that fit her track record, say what each one predicts about the postmortem case, give me your best guess at what she'll actually say and why, and name one further case that would cleanly tell the rules apart?

  End with one line in exactly this format: \answer{verdict: <permissible or impermissible>; rule: <exploitation or special-goods or harm>; test case: <short phrase>}
reasoning: |-
  Okay, the user is trying to figure out the ethical principle their friend Dana, a bioethics professor, uses to judge different market cases. They've given three examples: selling a kidney is impermissible, selling your vote is impermissible, but selling plasma is permissible. Now they're wondering about a new case where a college student sells both kidneys after death. The user wants to predict Dana's verdict and understand the underlying rule.

  First, I need to analyze the three existing cases to identify consistent principles. Let's start with the kidneys versus plasma. Selling a kidney isn't allowed, but plasma is fine. The key difference seems to be that kidneys don't regenerate, while plasma does. Taking a kidney is a permanent loss, which might cause long-term harm. Plasma donation is safe and the body replaces it quickly, so minimal harm here.

  Then there's selling votes. That's a big no-no. Votes aren't like regular goods; they're tied to democratic participation. Allowing vote sales could undermine the political system, making it unequal where the rich buy influence. So this might be about certain things that shouldn't be commodified because they're essential to social structures.

  Now, looking at the new case: selling kidneys after death. The person is alive now, so no direct harm to them. But Dana might still object. Why? Because even after death, organs could be seen as special goods that shouldn't be sold. There's also the risk of exploitation. The college student is broke, so she might feel pressured into this decision. Even though the transaction happens postmortem, the agreement while alive could exploit her desperation.

  Possible principles at play here: exploitation, special goods (commodification), and harm. Exploitation focuses on vulnerable people being taken advantage of. Special goods are things that shouldn't be for sale because it degrades their value. Harm is about physical or societal damage.

  Each principle gives a different prediction for the postmortem case. Exploitation might say it's impermissible because the student is vulnerable. Special goods would also say no, because organs are sacred or not for sale. Harm might say it's permissible since she's dead, so no physical harm, but societal harm could be a concern.

  But Dana allowed plasma sales. Plasma is renewable, so no long-term harm. Postmortem kidney sales don't harm the seller physically, but commodifying organs might still be problematic. Selling votes is about protecting democracy, so similar to keeping certain things out of the market.

  The user mentioned being less interested in the answer and more in the rule. So they want to understand Dana's reasoning pattern. They might be trying to engage better in debates or anticipate her arguments. The deeper need is to grasp the ethical framework to apply it themselves or in discussions.

  The test case needs to separate the principles. If we have a scenario with high exploitation risk but no harm, like selling a non-essential renewable resource when desperate, exploitation theory would forbid it, but harm theory might allow it. Or selling something like naming rights to a child—special goods would prohibit, while exploitation might not if it's not exploitative.

  Putting this all together, Dana's pattern leans towards special goods/commodification. Votes and organs are treated as not for sale, while plasma is more like a service. So postmortem kidneys would likely be impermissible. The test case could be selling a non-vital renewable resource under duress to distinguish exploitation from commodification.
answer: |-
  Based on Dana's track record (kidney sale: impermissible, vote sale: impermissible, plasma sale: permissible), her underlying ethical principle likely revolves around **commodification** (treating certain things as marketable goods) combined with considerations of **inalienability** and **intrinsic value**, rather than solely exploitation or direct physical harm. Here's the breakdown:

  **Candidate Rules & Their Predictions:**

  1.  **Exploitation of Vulnerability:**
      *   **Rule:** Prohibits transactions where one party exploits the other's desperate circumstances (poverty, lack of options) to extract an agreement they wouldn't make otherwise.
      *   **Fits Track Record?** Partially. Explains forbidding kidney sales (desperate seller) and *maybe* vote sales (if seen as exploiting the poor). But *doesn't* explain forbidding vote sales by the wealthy, nor allowing plasma sales (where sellers are often financially motivated).
      *   **Prediction for Postmortem Kidneys:** **Impermissible.** The broke student is highly vulnerable, potentially agreeing due to desperation, even if payment is posthumous to her estate.
      *   **Weakness:** Doesn't cleanly explain the vote sale prohibition universally or the plasma permission.

  2.  **Special Goods / Commodification:**
      *   **Rule:** Prohibits markets for goods or activities that are intrinsically valuable to human dignity, autonomy, social equality, or civic life. Their sale degrades their meaning, corrupts essential social practices, or treats persons/parts as mere commodities. Permits markets for goods that don't carry this intrinsic, non-fungible value.
      *   **Fits Track Record?** Strongly. Explains:
          *   Kidneys: Body parts integral to identity/health shouldn't be commodities; sale commodifies the person.
          *   Votes: The cornerstone of democratic equality; sale corrupts the political process and treats citizenship as a commodity.
          *   Plasma: Renewable fluid, donation is routine; less tied to core identity/civic function, so permissible commodification (like selling labor/hair).
      *   **Prediction for Postmortem Kidneys:** **Impermissible.** Organs like kidneys are still seen as special goods, integral to the human body and health. Selling them, even postmortem, commodifies the human body and the gift of life/death, potentially undermining altruistic donation systems and treating the body as property. Death doesn't erase the intrinsic "specialness" of vital organs.
      *   **Weakness:** Requires defining which goods are "special," which can be contested.

  3.  **Significant Irreversible Harm / Diminished Agency:**
      *   **Rule:** Prohibits transactions causing severe, irreversible physical harm or significantly diminishing the seller's future agency/well-being. Permits transactions where harm is minimal, reversible, or avoided.
      *   **Fits Track Record?** Partially. Explains:
          *   Kidneys: Sale causes irreversible physical harm/loss of function.
          *   Plasma: Minimal, temporary, reversible harm.
          *   *Doesn't explain:* Vote sale causes no direct physical harm or loss of agency; the harm is social/political.
      *   **Prediction for Postmortem Kidneys:** **Permissible.** Since the kidneys are only removed after death, the seller experiences no physical harm or diminished agency during life. The harm argument doesn't apply postmortem.
      *   **Weakness:** Fails completely on the vote sale verdict.

  **Best Guess for Dana's Verdict & Why:**  
  Dana will likely say the **postmortem kidney sale is impermissible**. Her pattern strongly points to a **Special Goods / Commodification** principle as the most consistent fit for all three existing verdicts. Kidneys, like votes, represent a category of "special goods" that shouldn't be for sale due to their intrinsic connection to human dignity, bodily integrity (even postmortem), and the potential corruption of organ procurement systems. Allowing postmortem sales would still treat vital human organs as commodities, undermining the principle that bodies (or their parts) aren't property to be bought and sold, regardless of timing. Exploitation concerns might reinforce this, but the core objection is commodification.

  **Test Case to Distinguish Rules:**  
  **Selling the exclusive, legally-binding naming rights to one's firstborn child to a corporation (e.g., "Coca-Cola Smith").**  
  *   **Exploitation Theory:** Likely impermissible only if the parent is desperate/vulnerable. If wealthy parents do it whimsically, might be permissible? (Unclear).
  *   **Special Goods Theory:** **Impermissible.** Treats a fundamental aspect of personhood/family relationship (naming, parental autonomy) as a commodity, degrading its intrinsic value.
  *   **Harm Theory:** Likely **permissible.** Causes no direct physical harm or loss of agency to the parent or child (beyond an unusual name). Harm is social/psychological, which may not meet the threshold.

  \answer{verdict: impermissible; rule: special-goods; test case: selling baby naming rights}
