  *flips through mental Descartes notes* Right, Part V of Discourse does spend more time detailing how animal bodies could mechanically produce complex behaviors than on the language test itself. The scholar's circularity charge sticks to the test itself, but underestimates how much Descartes rests on mechanistic physiology. Meanwhile the mind philosopher gets the metaphysics right but downplays how the language test's structure really is question-begging. 

