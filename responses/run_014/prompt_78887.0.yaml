  Now, mapping philosophical positions to physical concepts. Metabolism-first: life as sustained entropy production through autocatalytic cycles. This fits dissipative structures but struggles with dormant states. Replication-first: life as high-fidelity information propagation. This handles viruses but ignores metabolic needs. Evolutionary: life as systems capable of open-ended adaptation via heritable variation. This maps to attractor landscapes but requires defining "open-ended." Autonomy-based: life as operational closure and control loops. This aligns with reaction networks but can be too broad (e.g., flames).

  The residue analysis shows gaps. Thermodynamic terms can't capture purpose or agency—why a system "should" maintain itself. Individuality is problematic: are mitochondria part of the cell or distinct entities? Normative function (e.g., "the heart's purpose is to pump blood") has no physical counterpart. These concepts might be emergent or illusory, but they're central to how we describe life. 

  The hardest part to translate is the "should" aspect: the normative dimension where biology assigns functions and purposes. Physical laws don't prescribe goals; they just describe dynamics. This gap suggests the philosophical debate isn't just about mechanisms but about meaning—something my vocabulary lacks. 

  Final answer: normativity. That's the core thing lost in translation.
answer: |-
  ### Brainstorm: Candidate Definitions & Borderline Cases  
  - **Core Definitions**: Autocatalytic metabolism, Hereditary replication, Evolution by natural selection, Homeostatic autonomy.  
  - **Borderline Troublemakers**:  
    - *Viruses*: Replicate, evolve, but no intrinsic metabolism.  
    - *Viroids/Prions*: Information propagation without metabolic support.  
    - *Mitochondria*: Metabolic powerhouses but not autonomous; evolved from symbionts.  
    - *Sterile Mules*: Metabolic, functional, but no replication.  
    - *Tumor Cells*: Replicate, adapt, but parasitic; no organism-level homeostasis.  
    - *Self-Replicating Clay Crystals*: Structure propagation, no information encoding.  
    - *Fire*: Dissipative structure, autocatalytic (exothermic chain reactions), no heritable variation.  
    - *Computer Viruses/AI*: Information replication, adaptation, but no thermodynamic grounding.  
    - *Minimal Synthetic Cells*: Engineered metabolism/replication; test case for thresholds.  

  ---

  ### Translation: Philosophical Positions → Physical Vocabulary  
  **1. Metabolism-First (e.g., Tibor Gánti’s chemoton)**  
  - **Clean Map**: Life as a *dissipative structure* with persistent *negative entropy flow*. Requires:  
    - Autocatalytic reaction networks (positive feedback loops in d[G]/dt, where G is Gibbs free energy).  
    - Steady-state entropy production (σ ≥ 0) maintained far from equilibrium.  
  - **Fudges**:  
    - Fire satisfies autocatalysis/dissipation but lacks complexity control. Solution: Impose *minimal chemical network closure* (e.g., stoichiometric consistency).  
    - Borderline: Mitochondria—metabolically active but dependent on host. Maps if "system boundary" = host cell.  
  - **Fails**: Cannot exclude abiotic dissipative structures (e.g., hurricanes) without ad hoc constraints.  

  **2. Replicator-First (e.g., primordial RNA world)**  
  - **Clean Map**: Life as a *high-fidelity information channel*. Requires:  
    - Low-error replication (Shannon entropy H(X|Y) << H(X) for template copying).  
    - Error correction (kinetic proofreading ≡ energy-driven control loop).  
  - **Fudges**:  
    - Viruses fit if "replication" includes parasitic dependence.  
    - Prions: Replicate via conformational templating but no encoded information (H(X) ≈ 0).  
  - **Fails**: Sterile mules (no replication) or fire (no heritable information). Ignores thermodynamic sustainability.  

  **3. Evolutionary (e.g., Darwinian populations)**  
  - **Clean Map**: Life as a *dynamical system with heritable variation in fitness*. Requires:  
    - Phase space with quasi-species attractors (replicator equations).  
    - Mutational entropy balancing selection pressure (Fisher’s theorem ↔ free energy minimization).  
  - **Fudges**:  
    - Computer viruses evolve but lack physical embodiment.  
    - Tumor cells: Evolve within a host, but selection not organism-level.  
  - **Fails**: Self-replicating crystals (no heritable variation) or fire (no inheritance).  

  **4. Autonomy-Based (e.g., autopoiesis)**  
  - **Clean Map**: Life as an *operationally closed system* with *homeostatic control loops*. Requires:  
    - Reaction-diffusion networks with feedback (Lyapunov stability in state space).  
    - Energy dissipation for error correction (Landauer’s principle applied to regulation).  
  - **Fudges**:  
    - Mitochondria fail if "closure" requires independence; succeed if integrated into cell.  
    - Minimal synthetic cells: Engineered closure via lipid boundaries + genetic regulation.  
  - **Fails**: Viroids (no metabolic regulation) or fire (no feedback control).  

  ---

  ### Residue Report: What Doesn’t Map?  
  - **Translatable Core**:  
    - Thermodynamics: Entropy production ↔ Metabolism.  
    - Information Theory: Replication fidelity ↔ Heredity.  
    - Dynamics: Attractor stability ↔ Homeostasis.  
    - Networks: Autocatalysis ↔ Bootstrapping function.  

  - **Gaps in Translation**:  
    - **Normativity/Function**: Physics describes *what is*, not *what ought to be*. Example: "The function of DNA is to store information" implies teleology. Thermodynamics has no "purpose"—only gradients and flows.  
    - **Individuality**: No physical principle defines "organism boundaries." Mitochondria blur self/non-self; tumors challenge spatial integrity.  
    - **Agency**: Predictive control (e.g., chemotaxis) maps to feedback loops, but "seeking goals" is an emergent metaphor, not a fundamental force.  

  - **Substance vs. Illusion**:  
    - Teleological language (e.g., "genes *for* adaptation") is heuristic for evolved complexity. Physics captures the mechanism (selection as entropy sorting) but not the descriptive framing.  
    - The "vital spark" is redundant: Autocatalysis + evolution explain emergent complexity.  
    - **True Deficit**: Physical vocabulary cannot bridge *is* and *ought*. Biology’s "functions" imply historical selection—a causal chain physics ignores.  

  ---

  ### Conclusion: The Translation’s Limits  
  Physics vocabulary *reduces* life to dynamics of matter/energy/information—but erases **normative function**. This isn’t a flaw in physics; it’s a category error to demand "purpose" from phase transitions. The residue is the ghost of Aristotle’s final cause: the idea that life *strives*. Physics sees a gradient; biology sees intention.  

  \answer{normative function}
