answer: |-
  ### Decision Tree: Democratic State Authority to Compel Military Service

  **Instructions:** Start at the root (Q1). Answer each question based on your normative commitments. Follow the branches to a leaf (position). Each leaf names a position or is marked "unnamed," with one sentence on its most awkward commitment.  
  **Key Distinctions Embedded:**  
  - **Authority vs. Distribution**: Q1 addresses state authority; Q4/Q3a address burden distribution.  
  - **Empirical Premise Survival**: Q3 tests if the position collapses if a professional army is equally effective.  
  - **Purpose of Conscription**: Q2 separates winning wars (effectiveness) from fair burden-sharing.  

  ---

  #### **Q1: May the state compel military service?**  
  - **No**  
    → **Leaf 1: Voluntarism**  
    *Awkward commitment: Accepts that defense may rely disproportionately on the economically vulnerable, risking "poverty drafts."*  
  - **Only during existential threats**  
    → **Leaf 2: Emergency Conscription**  
    *Awkward commitment: Requires defining "existential threat" non-arbitrarily, risking delayed/missed responses to crises.*  
  - **Yes, unconditionally (peacetime or wartime)**  
    → **Q2: Is the primary justification for conscription military effectiveness or fair burden-sharing?**  
    - **Military effectiveness (winning wars/ensuring defense)**  
      → **Q3: Does the justification collapse if a professional army is equally effective?**  
      - **Yes**  
        → **Leaf 3: Effectiveness-Dependent Conscription**  
        *Awkward commitment: Justification evaporates if professional forces match conscripted armies in capability.*  
      - **No**  
        → **Q3a: Is the model a non-aligned citizen militia with peacetime training (e.g., Swiss/Finnish)?**  
        - **Yes**  
          → **Leaf 4: Militia Model**  
          *Awkward commitment: Imposes lifelong reserve duties and intrusive peacetime training for deterrence.*  
        - **No**  
          → **Leaf 5: Effectiveness-Independent Conscription (unnamed)**  
          *Awkward commitment: Must defend conscription as inherently superior for effectiveness even with no empirical disadvantage vs. professionals.*  
    - **Fair burden-sharing (making the public bear war's costs)**  
      → **Q4: How should compulsory service distribute the burden?**  
      - **Universally (all serve, military or civilian, at equal pay)**  
        → **Leaf 6: Universal Obligation Model**  
        *Awkward commitment: Functions as a "time tax" on the young, consuming years of life for state-assigned roles.*  
      - **Randomly via lottery (no deferments)**  
        → **Leaf 7: Lottery Model**  
        *Awkward commitment: A statistically tiny cohort bears life-risking burdens for collective security benefits.*  

  ---

  #### Confidence and Notes  
  - **Overall Confidence: High (85%)**. The tree isolates core tensions (authority/distribution, empirical fragility, purpose) while anchoring positions to real-world cases.  
  - **Least Confident Node: Q3 (empirical dependency in effectiveness branch)**.  
    - **Why?** Positions often conflate effectiveness with civic virtue or deterrence logic (e.g., militia arguments). Q3 forces a stark empirical dependency that some theorists might reject without abandoning effectiveness.  
    - **What Would Settle It?** Clarifying whether a position’s effectiveness claim is purely military (collapses if professionals match) or hybrid (e.g., includes deterrence through mass mobilization).  
  - **Unseparated Positions**:  
