  We are writing an adversarial collaboration document between two philosophers: one defending an entrenchment-based solution to Goodman's new riddle of induction, and one defending a Bayesian solution without entrenchment. The document will have two main parts: (1) a numbered list of agreed-upon claims, and (2) a table of disagreements with positions, cruxes, tests, and predictions.

  ## Part 1: Agreed Claims

  Both parties agree on the following:

  1. **The Structure of the Grue Problem and its Novelty**: 
     - Goodman's "grue" riddle demonstrates that not all hypotheses are equally projectible. The term "grue" applies to things examined before a future time t and found to be green, or not examined before t and blue. The riddle shows that if we have observed only green emeralds before t, then both "All emeralds are green" and "All emeralds are grue" are equally well supported by the evidence (if we take t to be, say, now or a future time). This is a new riddle because it arises even after accepting that induction can be justified in general (unlike Hume's problem, which concerns the justification of induction itself). The new riddle is about distinguishing between projectible and non-projectible hypotheses.

  2. **What a Satisfactory Account Must Achieve**:
     - A satisfactory account of inductive projection must provide a non-circular, non-arbitrary basis for favoring one hypothesis over another when both are equally compatible with the evidence. It must explain why we project "green" rather than "grue" and do so in a way that avoids ad hoc restrictions.

  3. **Failure of Purely Syntactic or Enumerative Approaches**:
     - Purely syntactic approaches (which rely only on the logical form of hypotheses) or simple enumerative induction (which counts empirical instances without regard to the predicates used) cannot solve the riddle. This is because "grue" is syntactically on par with "green" and the evidence supports both equally by enumeration until t.

  4. **Genuine Constraints and Red Herrings**:
     - Genuine constraints: Any solution must avoid ad hocness (e.g., just stipulating that "grue" is bad) and provide a principled distinction. The solution must also explain why we project "green" in the actual world and why this practice is rational.
     - Red herrings: The riddle does not depend on the specific time t or the colors green and blue; it generalizes to any pair of projectible and non-projectible predicates. It also does not depend on the existence of "grue-like" predicates in natural language.

  5. **Scope of the Riddle's Challenge**:
     - The riddle does not rule out formal confirmation theories wholesale. It only challenges theories that cannot account for projectibility without arbitrary restrictions. It is possible that a formal theory (like Bayesianism) can handle the riddle, but it must do so without relying on hidden ad hoc assumptions.

  ## Part 2: Disagreements Table

  We now present the points of divergence. For each, we state the entrenchment theorist's position (ET), the Bayesian's position (B), the crux (the key sub-question), a test/case that both agree bears on the crux, and each side's prediction about the outcome of that test.

  | Disagreement | Entrenchment Theorist (ET) | Bayesian (B) | Crux | Test/Case | ET Prediction | B Prediction |
  |--------------|----------------------------|--------------|------|-----------|---------------|--------------|
  | **1. The nature of the green/grue distinction** | The difference between "green" and "grue" is grounded in the actual history of predicate use: "green" has been used in successful inductions and is entrenched, while "grue" has not. Entrenchment provides the non-arbitrary basis for projectibility. | The difference is captured by prior probabilities: "green" hypotheses have higher prior probability than "grue" ones, reflecting our background knowledge about the world (e.g., that color properties are stable and not time-dependent). Priors are not based on entrenchment per se but on our overall epistemic state. | **Crux 1:** Can the Bayesian prior probabilities be justified without implicitly relying on the entrenchment of predicates? | Consider a hypothetical community that has always used "grue" and "bleen" (where "bleen" is defined analogously) and has a history of successful inductions with these predicates. Would they be rational to project "grue" instead of "green"? | ET: Yes, they would be rational to project "grue" because their entrenchment history with "grue" makes it projectible for them. The Bayesian must then assign higher priors to "grue" for them, which shows that priors are parasitic on entrenchment. | B: Yes, they would be rational, but not because of entrenchment. Their priors reflect their background knowledge, which includes the stability of grue/bleen properties. The Bayesian can model this without invoking entrenchment as a primitive. |
  | **2. The role of entrenchment in the Bayesian framework** | The Bayesian framework, when properly accounting for projectibility, must incorporate entrenchment either in the priors or in the structure of hypotheses. Otherwise, it cannot non-arbitrarily favor "green" over "grue". | Bayesianism can account for projectibility without any reference to entrenchment. Priors are assigned based on simplicity, naturalness, or fit with background knowledge, which are independent of historical usage. | **Crux 2:** Can we construct a Bayesian model that explains the projectibility of "green" over "grue" without any reference (explicit or implicit) to the actual history of predicate use? | Develop a Bayesian model for the emerald case that assigns a higher prior to "all emeralds are green" than to "all emeralds are grue" without using any information about the past use of the predicates "green" or "grue" in inductions. | ET: No, because any assignment of higher prior to "green" must be justified, and the only non-arbitrary justification is the entrenchment of "green". Without that, the prior assignment is ad hoc. | B: Yes, because we can appeal to the simplicity of "green" (it doesn't have a time-dependency) or to background knowledge about color stability. This does not require entrenchment. |
  | **3. The goal of solving the riddle: normative vs. descriptive** | The riddle demands a normative account of why we ought to project certain predicates, and entrenchment is part of that normative story because it reflects the accumulated success of past inductions. | The riddle is primarily about providing a normative justification for our inductive practices. Bayesianism provides a normative framework for rational updating, and the priors are part of that normative structure. The descriptive history of predicate use is irrelevant to the justification. | **Crux 3:** Is the entrenchment of predicates a normative reason for projectibility, or is it merely descriptive of our past practices? | Suppose we discover that a predicate we thought was entrenched (like "green") has only been used for a short time and by a small group, but we have strong background knowledge that the property it denotes is stable. Should we still project it? | ET: Entrenchment is not merely descriptive; it is normative. However, if we have strong background knowledge, that might override short entrenchment. But in the absence of such knowledge, entrenchment is the primary guide. | B: Background knowledge (e.g., about the stability of properties) is what matters normatively. Entrenchment may be correlated with stable properties, but it is the stability (or simplicity) that is the normative reason, not the entrenchment itself. |
  | **4. The relationship between prior probabilities and entrenchment** | Prior probabilities are not fundamental but are determined by the entrenchment of predicates. A Bayesian who denies this is smuggling in entrenchment through the back door. | Prior probabilities are fundamental and are based on objective factors (like simplicity or naturalness) that do not reduce to entrenchment. | **Crux 4:** Can we have a case where a predicate is entrenched but should not be assigned a high prior (or vice versa)? | Consider a predicate "gred" which is defined as "green if first observed before t, red otherwise". Suppose "gred" has been entrenched in a community (they have used it repeatedly and successfully until now). However, we have background knowledge that color changes are rare and usually due to known processes. Should "gred" be projectible? | ET: Yes, because entrenchment is the key factor. The community's history of successful projections with "gred" makes it projectible for them. | B: No, because background knowledge tells us that colors don't change arbitrarily with time. The prior for "gred" should be low despite entrenchment, because it is an unnatural, disjunctive property. |

  ## Diagnosis of Verbal Disagreement or Difference in Explanatory Aims

  The two sides may be partially talking past each other because:

  - **Verbal Disagreement**: The term "entrenchment" might be interpreted differently. The Bayesian might see "entrenchment" as a psychological or sociological fact, while the entrenchment theorist sees it as an epistemic norm. Alternatively, the Bayesian might agree that entrenched predicates often have high priors but deny that entrenchment is the fundamental reason.

  - **Explanatory Aims**: The entrenchment theorist is offering a solution that explains how we in fact determine projectibility (via our linguistic history) and why that is rational (because it builds on past successes). The Bayesian is offering a normative model of rational updating that does not depend on the contingent history of predicate use. Thus, one might be more descriptive-explanatory and the other purely normative.

  However, there is a substantive disagreement: whether the rationality of projecting "green" over "grue" is ultimately grounded in the history of use (ET) or in a priori or background-knowledge-based factors (B). The cruxes above are designed to probe this.

  ## Conclusion

  Both sides agree on the structure and significance of the riddle and on the failures of syntactic and enumerative approaches. The main disagreements center on the role of entrenchment in justifying projectibility and the relationship between entrenchment and Bayesian priors. The adversarial collaboration reveals that the debate may turn on whether one can provide a non-entrenchment-based justification for the priors and whether entrenchment itself is a normative factor. The proposed tests (e.g., the alternative community using grue, or the entrenched but unnatural predicate) may help clarify the disagreement.
answer: |-
  ### Adversarial Collaboration Document: Goodman's New Riddle of Induction

  **Introduction**  
  We, an entrenchment theorist (ET) and a Bayesian (B), have collaborated to clarify our agreements and disagreements on Goodman’s "new riddle of induction." Our goal is to isolate substantive disputes from differences in explanatory aims, and to identify testable cruxes. We agree on the riddle’s structure and core challenges but diverge on the solution. This document outlines shared ground, then details disagreements with explicit cruxes and predictions.

  ---

  ### Part 1: Agreed Claims  
  *Both parties endorse the following numbered statements without reservation:*  

  1. **Structure and Novelty of the Grue Riddle**:  
     - The riddle demonstrates that hypotheses "All emeralds are green" (G) and "All emeralds are grue" (GRUE) are equally confirmed by evidence (e.g., observations of green emeralds before time *t*), despite yielding conflicting predictions (e.g., after *t*, G predicts green, GRUE predicts blue).  
     - It is "new" because it arises *after* accepting induction as practically indispensable (resolving Hume’s "old" problem of justifying induction *tout court*). The challenge is to distinguish *which* hypotheses are projectible, not whether induction works.  

  2. **Requirements for a Satisfactory Account**:  
     - A solution must non-arbitrarily favor projectible hypotheses (e.g., G) over non-projectible ones (e.g., GRUE), without ad hoc stipulations. It must explain why GRUE-style predicates are illegitimate for induction despite their syntactic parity with ordinary predicates.  

  3. **Failure of Syntactic/Enumerative Approaches**:  
     - Purely syntactic criteria (e.g., logical form) or enumerative induction (tallying instances) cannot resolve the riddle. GRUE is syntactically simple and empirically equivalent to G with pre-*t* evidence, revealing that projectibility depends on semantic or pragmatic features beyond syntax or instance counts.  

  4. **Genuine Constraints vs. Red Herrings**:  
     - **Genuine constraints**: A solution must avoid circularity (e.g., defining projectibility in terms of "natural" predicates without independent grounding) and accommodate the actual success of science.  
     - **Red herrings**: The riddle does not depend on GRUE’s artificiality, time *t*’s specificity, or color examples. It generalizes to any pair of predicates (projectible vs. time/observation-dependent).  

  5. **Scope of the Riddle’s Challenge**:  
     - The riddle refutes *naive enumerative induction* and *syntactic formalisms* but does not rule out formal confirmation theories (e.g., Bayesianism) *wholesale*. It targets theories that ignore projectibility constraints, not formal frameworks per se.  

  ---

  ### Part 2: Table of Disagreements  
  *For each disagreement, we state positions neutrally, identify the crux, propose a shared test/case, and record predictions.*  

  | Disagreement | Entrenchment Theorist (ET) Position | Bayesian (B) Position | Crux | Test/Case | ET Prediction | B Prediction |
  |--------------|-------------------------------------|------------------------|------|-----------|---------------|--------------|
  | **1. Nature of the Green/Grue Distinction** | "Green" is projectible because it is entrenched: its past use in successful inductions licenses future projections. "Grue" is non-projectible due to its lack of entrenchment. Entrenchment is objective, arising from communal inductive practices. | The distinction reduces to rational prior probabilities: "green" has a higher prior than "grue" because it denotes a stable, non-disjunctive property. Priors reflect background knowledge (e.g., color stability), not entrenchment history. | **Crux 1:** Is entrenchment *necessary and sufficient* for projectibility, or is it epiphenomenal to prior probabilities? | **Case:** A community uses only "grue" (green if observed before *t*/blue otherwise) and "bleen" (blue if before *t*/green otherwise) for all color inductions. They have a long history of successful predictions with these predicates. Is "grue" projectible *for them*? | **ET:** Yes. Entrenchment determines projectibility; their "grue" is as legitimate as our "green." | **B:** Yes, but because their priors for "grue" are high *given their background knowledge* (e.g., "grue" is stable in their epistemic context). Entrenchment is incidental. |
  | **2. Bayesian Priors and Entrenchment** | Bayesianism implicitly relies on entrenchment: assigning higher priors to "green" smuggles in past inductive success. Without entrenchment, priors for "natural" predicates are arbitrary. | Priors are justified independently of entrenchment via simplicity, uniformity of nature, or computational efficiency. "Grue" is disjunctive (e.g., time-indexed), warranting lower priors. Entrenchment is descriptive, not normative. | **Crux 2:** Can a Bayesian justify priors favoring "green" over "grue" without referencing historical predicate use? | **Test:** Construct a Bayesian model for emeralds where priors favor G over GRUE *without* using: (a) "green"’s entrenchment, (b) grue-like predicates’ historical failures. Use only general principles (e.g., simplicity, minimum description length). | **ET:** No principled model exists. Any "simplicity" metric covertly reflects entrenchment. | **B:** Yes. Priors derive from logical constraints (e.g., GRUE’s time-dependency increases its complexity). |
  | **3. Goal of the Riddle: Normative vs. Descriptive** | The riddle demands a *normative* justification for inductive practices: why we *ought* to project certain predicates. Entrenchment provides this by linking projectibility to past inductive success. | The riddle requires a *normative* epistemology of rational inference. Bayesianism achieves this via coherence constraints (e.g., Dutch book arguments) and rational priors. Descriptive facts (e.g., entrenchment) are irrelevant to justification. | **Crux 3:** Is the riddle primarily about justifying *actual human practices* (requiring descriptive input) or about *ideal rationality* (abstracting from practice)? | **Case:** Humans project "green" but discover aliens who project "grue" with equal empirical success. Are humans rational? Are aliens rational? | **ET:** Both are rational *relative to their entrenchment histories*. Normativity is practice-dependent. | **B:** Only one is objectively rational. Rationality depends on priors aligning with mind-independent simplicity/naturalness (likely favoring "green"). |
  | **4. Deeper Disagreement: Source of Projectibility** | Entrenchment is the *foundation* of projectibility: predicates gain inductive legitimacy through communal use. Bayesian "priors" are post hoc formalizations of this fact. | Projectibility stems from *prior probabilities*, which reflect objective features of hypotheses (e.g., non-disjunctiveness). Entrenchment is a proxy for these features in humans, but not fundamental. | **Crux 4:** Can there be entrenched but non-projectible predicates, or high-prior but unentrenched predicates? | **Test:** Identify a predicate widely entrenched in science (e.g., "phlogiston") later deemed non-projectible. Can a Bayesian model downgrade its projectibility pre-rejection without referencing entrenchment? | **ET:** No. "Phlogiston" was projectible until evidence overturned entrenchment. Bayesianism only "fixes" this post hoc. | **B:** Yes. Priors for "phlogiston" were always low due to inconsistency with broader knowledge (e.g., conservation laws), regardless of entrenchment. |

  ---

  ### Diagnosis of Verbal/Explanatory Differences  
  - **Verbal Disagreement**: ET and B both discuss "justification" but mean different things. ET ties justification to *actual human practices* (e.g., "rational as a product of our history"), while B appeals to *idealized rationality* (e.g., "rational given logical constraints"). This masks agreement that entrenchment *describes* human practice and priors *prescribe* norms.  
  - **Explanatory Aims**: ET seeks a *genealogy* of projectibility (how predicates *become* reliable), while B seeks a *normative foundation* (what *makes* projections rational). These aims are compatible if entrenchment is how humans *track* prior-worthy properties, but incompatible if ET asserts entrenchment is *constitutive* of rationality.  
  - **Substantive Disagreement**: At core, we dispute whether rationality depends on contingent history (ET) or abstract norms (B). Crux 3 tests this: if aliens projecting "grue" are deemed rational, ET wins; if not, B wins.  

  ---

  **Conclusion**  
  We agree on the riddle’s structure and weaknesses of prior approaches but diverge on whether entrenchment or Bayesian priors resolve it. Our cruxes are designed to isolate whether priors can be grounded sans history (Crux 2), if entrenchment is necessary for normativity (Crux 3), and whether the green/grue distinction is historical or logical (Crux 4). Testing these will advance the debate beyond talking past one another.  

  ---  
  *Signed,*  
  [Entrenchment Theorist]  
  [Bayesian]  
  [Workshop Organizer]
