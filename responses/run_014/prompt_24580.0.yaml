  I'll need to explain why this is wrong in concrete terms: If we swap the spheres, all relational statements remain true because distance is symmetric. The properties aren't genuinely individuating - they're just perspective-relative labels. The student missed that qualitative identity requires indistinguishability even under relabeling.

