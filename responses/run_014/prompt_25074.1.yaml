prompt: |-
  I'm a journalist working on an interactive piece for a science & ideas magazine about how people actually make moral judgments — not the labels they pick, but what they say about cases. The hook is the philosophical debate between moral particularists (no true moral principles, it's all case-by-case perception) and generalists (there are at least some moral principles that cover more than one case). I want to build a "which position do you actually hold?" quiz for readers.

  Design 8 questions, each a short concrete scenario with 2 or 3 answer options. The questions should test whether someone's judgment relies on exceptionless rules, on principles that can genuinely conflict, or on the particular details of a case in a way that resists codification. No question should just ask "do you think there are moral principles?" — the whole point is to let the answers reveal the pattern. Include at least two cases where a generally plausible principle and a strong intuition about a particular case pull in opposite directions, and at least one case about moral learning or expertise (since that's where particularists and generalists make very different predictions).

  Then provide a scoring key that maps patterns of answers onto positions. Include at minimum: strong generalism, Ross-style pluralism with prima facie duties, and Dancy-style particularism. Also flag any logically possible combinations of answers that don't correspond to a well-known position, and say why — is it unexplored, unstable, or just plainly incoherent?

  Keep it to 800 words max. That's tight for 8 cases plus a key, so be concise — one or two sentences per case, and the scoring key can be telegraphic.
reasoning: |-
  Okay, the user is a journalist creating an interactive quiz about moral judgment for a science magazine. They want to explore the philosophical debate between moral particularists and generalists through concrete scenarios. 

  Hmm, the challenge here is designing questions that subtly reveal cognitive patterns without being overt. The key is crafting dilemmas where principles and intuitions clash in ways that force unconscious prioritization. 

  First, I consider the structural requirements: 8 scenarios total, with at least two principle-vs-intuition conflicts and one about moral learning. Each case needs surgical precision - one or two sentences max to stay within word count. 

  For the principle-intuition clashes: 
  - The runaway trolley classic exposes utilitarian vs deontological instincts
  - A property damage scenario (like the flooded house) tests if "necessity" overrides ownership rights 
  These create tension between abstract rules and emotional responses.

  The moral learning case is trickier. Maybe a novice/expert contrast? Like judging an action differently before/after understanding context. That highlights particularism's emphasis on situational perception.

  Other scenarios should probe different angles:
  - Conflicts between duties (truth vs harm)
  - Cultural relativism vs universalism
  - Whether bad intentions taint good outcomes
  - How past experiences shape current judgments

  For scoring, I map answer patterns to:
  1. Strong generalism (consistent rule application)
  2. Rossian pluralism (principles with exceptions)
  3. Dancy-style particularism (case-by-case focus)
  Noting unstable combinations like "sometimes principled but inconsistent" which lacks philosophical coherence.

  The word budget is tight - scoring key must be telegraphic. I'll use symbols (+, -, ±) for efficiency and group logically impossible combinations under "incoherent" with brief explanations.

  Better avoid any direct "do you believe in principles?" questions. The power is in readers discovering their own patterns through behavioral choices.
answer: |-
  Here’s an 8-question quiz with scoring key (795 words):

  **Quiz: Moral Judgment Patterns**

  1.  **Trolley:** A runaway trolley will kill 5 workers. Flipping a switch diverts it to kill only 1. **Flip?** (Yes/No)
      *   *Tests:* Strict utilitarianism vs. deontological rule against direct killing.

  2.  **Flooded House:** During a flood, you break into an empty, elevated house to save your drowning child. **Permissible?** (Yes/No)
      *   *Tests:* Property rights as exceptionless vs. overridden by necessity/particular relationship.

  3.  **Honest Blunder:** You truthfully tell a colleague their presentation was weak, unaware they just received devastating news. Your comment causes severe distress. **Was your action wrong?** (Yes/No)
      *   *Tests:* Whether good intention or actual outcome determines permissibility (conflict of principles?).

  4.  **Cultural Practice:** In a culture where elders traditionally choose spouses, two competent adults marry against their families' wishes. **Is this morally wrong?** (Yes/No/Only if harm occurs)
      *   *Tests:* Universal principle (autonomy) vs. cultural relativism vs. harm-based particularism.

  5.  **Charity vs. Debt:** You have $1000. Save 10 children from disease (via charity) or pay a pressing debt owed to a friend struggling financially. **Which is obligatory?** (Charity/Debt/Context decides)
      *   *Tests:* Conflict between beneficence and fidelity (prima facie duties).

  6.  **Bad Motive, Good Deed:** You publicly praise a rival's work solely to make them a target for criticism, but it accidentally boosts their career. **Is the praise praiseworthy?** (Yes, good outcome/No, bad motive/Depends)
      *   *Tests:* Role of intention vs. consequence; possibility of "wrong kind of reason".

  7.  **Novice/Expert:** A novice cook follows a recipe exactly but makes a terrible meal. An expert chef ignores the recipe, improvises based on ingredients, and makes a masterpiece. **Whose method is better for learning morality?** (Novice's/Expert's)
      *   *Tests:* Moral learning - rules as foundational vs. perception/experience as key.

  8.  **Returned Wallet:** You find a wallet stuffed with cash and ID. Last year, someone returned *your* lost wallet. **Does that past experience make returning it *more* obligatory now?** (Yes/No)
      *   *Tests:* Whether past cases provide general reasons (reciprocity?) or just shape perception of this case's features.

  ---

  **Scoring Key:**

  *   **Strong Generalism (e.g., Utilitarian/Kantian):** Consistent application of one core principle across cases. Ignores conflicting intuitions.
      *   *Pattern:* Answers 1-8 show high consistency with one principle (e.g., always maximize good outcomes, never violate rule X), especially overriding intuitions in Q2 & Q4. Q7: Novice's method better.

  *   **Rossian Pluralism (Prima Facie Duties):** Believes in multiple genuine moral principles (e.g., fidelity, justice, beneficence) that can conflict. Resolves conflicts by weighing duties in context; allows for exceptions.
      *   *Pattern:* Acknowledges conflicting principles (e.g., Q1 Yes, Q2 Yes; Q5 Debt or Charity chosen *based on specific details given*). Q7: Often Expert's method. Q8: Often Yes (past experience provides a reason of gratitude/reciprocity). Avoids absolute answers where principles clash (Q2, Q4, Q5, Q6).

  *   **Dancy-Style Particularism:** Denies general principles have genuine moral weight. Rightness/wrongness emerges holistically from the specific features of each situation. Past cases shape perception but don't provide independent reasons.
      *   *Pattern:* Heavy reliance on "Depends/Context decides" or switching answers based on subtle scenario differences. Emphasizes unique details (Q3 Yes due to outcome despite intention; Q4 Only if harm occurs). Q7: Expert's method definitively better. Q8: No (past case shapes *seeing* the reason to return here, but doesn't *add* a new reason).

  **Incoherent/Unstable Combinations:**

  1.  **"Always Rules, Except When I Feel Otherwise":** Answers demand strict rules in simple cases (Q1, Q4 "Yes" for universal autonomy) but abandon them for intuition in others (Q2 "Yes" overriding property) without a consistent meta-principle. *Why:* Unstable. Ad hoc exceptions undermine claim of belief in exceptionless rules. Leans pluralism/particularism but denies conflict.
  2.  **"No Principles Ever, But Always Consistent":** Claims all judgment is particular yet gives identical answers to Q1 & Q2 (e.g., both "No"). *Why:* Incoherent. If no principles, identical actions in *different* contexts (diverting threat vs. breaking in for family) shouldn't demand the *same* judgment purely based on the act-description. Requires denying salient differences matter.
  3.  **"Principles Matter, But Past Cases Are Irrelevant":** Strong reliance on principles (Q1-6 based on rules) but Q8 "No" (past experience irrelevant). *Why:* Unexplored/Unstable. Principles are often learned/generalized *from* past experiences. Denying any link is psychologically implausible and philosophically odd for a generalist.
  4.  **"Moral Learning is Rule-Based, But Experts Ignore Rules":** Q7 says Novice's method (rules) is better for learning, yet acknowledges the expert's outcome is superior. *Why:* Unstable. Undermines the claim for rules as the foundation if expertise requires abandoning them for superior results. Points towards particularism or sophisticated pluralism.
