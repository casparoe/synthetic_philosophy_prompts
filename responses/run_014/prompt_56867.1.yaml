prompt: |-
  I'm trying to write down, in advance, what any claim of the form "this culture / these values caused that economic outcome" has to be able to do before I'll take it seriously. Weber's protestant ethic argument is the canonical case but I want the rubric to be general, so it can be applied to any culture-as-cause story.

  Give me the desiderata list, each requirement with the concrete case or worry that motivates it. At minimum it needs to deal with:

  - the independence problem: if you only know a group had the relevant ethic because they did the thing the ethic predicts, you've redescribed the outcome, not explained it — so what does an independent measure of the value have to look like?
  - reasons vs causes: Weber wanted an account to be adequate both on the level of meaning and causally, and it's not obvious you can have both at once when the actors' own avowals of the value are partly self-serving rationalizations of what they were doing anyway
  - whose values: aggregate mean vs distribution, and the fact that it's often a minority of intense beleivers doing the causal work while the majority merely assents
  - the retreat to elective affinity: does recasting the claim as an affinity between an ethic and an economic ethos preserve the causal content or quietly give it up?

  Then mark which of your requirements are non-negotiable and which are really just the priors of one camp — institutionalists, rational choice types, cultural sociologists each demand different things and I don't want to smuggle in one camp's preferences as "adequacy." If some subset of the desiderata is jointly unsatisfiable, say so explicitly and show why; that's the part I most want to see. Finish with a couple of sentences on which single requirement does the most work ruling out otherwise attractive stories. No reading list.
reasoning: |-
  Okay, the user is asking for a rubric to evaluate claims that cultural values cause economic outcomes. They specifically mention Weber's Protestant Ethic as a canonical example but want a general framework. They've outlined four key issues: independence problem, reasons vs causes, whose values matter, and elective affinity. 

  Hmm, this is a sophisticated methodological question. The user clearly has strong social science literacy given how precisely they've framed the problems. They're probably an academic or grad student working on comparative historical analysis. The request about marking non-negotiable vs camp-specific requirements suggests they're building methodological tools for their own research and want to avoid partisan biases.

  Let me break this down systematically. First, the independence problem is foundational - without independent measurement of values, it's just circular reasoning. This should be non-negotiable. Then the reasons/causes dilemma: we need to show values actually motivated behavior, not just rationalized it post-hoc. That's tough but crucial. 

  For "whose values," distribution matters because cultural effects often come from committed minorities. This bridges to institutional analysis - maybe negotiable if your theory accounts for institutional amplification. The elective affinity point is trickiest: if we say culture merely "fits" with economics, does that abandon causality? Probably need to specify mechanisms here.

  The real challenge is whether all these can coexist. I think institutionalists might relax on the motivation requirement, while cultural sociologists might accept softer causality. But the independence criterion seems universally essential - it's what prevents pure storytelling. 

  The user's deepest need might be diagnosing why these arguments often feel unsatisfying. The independence requirement does the heaviest lifting there - most pop cultural explanations fail precisely because they infer values from outcomes. That's the filter separating serious scholarship from just-so stories.
answer: |-
  Here's a rubric for evaluating "culture/values caused economic outcome" claims, addressing your core concerns and distinguishing non-negotiables from contested priors:

  ### Core Non-Negotiables (Must Be Addressed)
  1.  **Independent Operationalization of Values:**
      *   **Requirement:** The "cause" culture/value must be measurable *independently* of the economic outcome it supposedly caused. Measurement cannot rely on the outcome behavior or its direct economic benefits.
      *   **Motivation:** Solves the **independence problem**. Prevents circularity (e.g., inferring "Protestant ethic" solely from observed capitalist accumulation). Requires evidence *predating* or *coinciding independently* with the outcome.
      *   **Concrete Evidence Needed:** Texts (theological, philosophical, literary), practices (rituals, education, associational life), explicit value surveys (if contemporary), institutional rules reflecting values, comparative evidence showing the value exists *without* the outcome elsewhere.
      *   *Non-negotiable: Without this, it's description, not explanation.*

  2.  **Specification of Causal Mechanism:**
      *   **Requirement:** A clear, step-by-step account of *how* the specific cultural value(s) translate into the specific economic actions/decisions of actors, leading to the aggregate outcome. Must bridge the micro-macro gap.
      *   **Motivation:** Addresses **reasons vs. causes** by demanding the value isn't just a post-hoc rationalization; it must demonstrably *motivate* or *constrain* action. Also counters vagueness in "elective affinity" claims.
      *   **Concrete Evidence Needed:** Historical records of individual/firm decision-making showing value influence, psychological/sociological studies demonstrating value-behavior links, institutional analysis showing how values shape rules/incentives *differently* than alternative values would.
      *   *Non-negotiable: Without a mechanism, "cause" is an empty assertion.*

  ### Essential but Contested Requirements (Depend on Theoretical Priors)
  3.  **Aggregation & Distribution:**
      *   **Requirement:** Account for *whose* values matter (elites, masses, specific subgroups) and *how* the values of individuals/groups aggregate to produce the macro outcome. Address intensity and distribution.
      *   **Motivation:** Solves **whose values**. Averages can mask crucial dynamics (e.g., a minority of ascetic entrepreneurs driving growth while the majority is traditionalist). Not all assenters are causal actors.
      *   **Concrete Evidence Needed:** Data on value distribution/intensity across relevant social groups, analysis of which groups held economic power/influence, evidence linking specific value-holding groups to key economic innovations/decisions.
      *   *Contested:* Institutionalists/RCT may demand less (focusing on rules/incentives enabling minority action). Cultural sociologists demand more (focusing on shared meanings enabling coordination).

  4.  **Exclusion of Plausible Alternatives:**
      *   **Requirement:** Demonstrate that the cultural explanation accounts for the outcome *better* than (or in conjunction with) prominent rival explanations (institutional, geographic, technological, political, resource-based, rational self-interest).
      *   **Motivation:** Culture is rarely the *only* possible cause. Shows the cultural factor is necessary/sufficient within the context, not just correlated.
      *   **Concrete Evidence Needed:** Natural experiments, careful comparative cases (similar non-culture cases lack outcome; similar culture cases show outcome), process-tracing showing cultural factors were decisive where alternatives were present/absent.
      *   *Contested:* Rational Choice Theorists (RCT) demand rigorous testing against self-interest models. Culturalists might accept a strong "contributing factor" argument if mechanism is clear. Institutionalists demand showing culture isn't epiphenomenal to institutions.

  5.  **Temporality & Directionality:**
      *   **Requirement:** Establish the cultural values *preceded* the economic changes they supposedly caused, or demonstrate a clear, non-reciprocal causal pathway if simultaneous. Address potential reverse causality (outcome shapes values).
      *   **Motivation:** Core tenet of causality. Prevents confusing consequence for cause (e.g., did wealth accumulation enable stricter asceticism, or vice versa?).
      *   **Concrete Evidence Needed:** Historical sequence showing value emergence/prominence *before* key economic shifts; evidence that values persisted despite changing economic conditions detrimental to them; mechanisms preventing strong economic feedback from eroding the causal values quickly.
      *   *Contested:* All camps agree in principle, but differ on acceptable evidence. RCT/Institutionalists demand tighter temporal precedence. Culturalists more readily accept dialectical feedback *after* initial causation.

  ### Addressing "Elective Affinity"
  6.  **Elective Affinity ≠ Causation (Unless Specified):**
      *   **Requirement:** If using "elective affinity," explicitly state whether it implies a weaker form of causation (via mutual reinforcement, selection, reduced friction) or merely non-causal compatibility. If claiming causation, specify the *direction* and *mechanism* of the initial causal push.
      *   **Motivation:** Clarifies if **elective affinity preserves or abandons causal content**. Pure "fit" (e.g., Protestantism and Capitalism are compatible) is non-causal. Affinity becomes causal if shown that the culture *enabled* or *accelerated* the specific economic form's emergence/stability.
      *   **Concrete Evidence Needed:** For causal affinity: Demonstrate the economic form struggled/did not emerge where the value was absent *despite other favorable conditions*; show how the value solved coordination problems *specific* to that economic form; trace initial selection/adoption processes favoring actors embodying the value.
      *   *Contested:* Culturalists often find affinity arguments sufficient. RCT/Institutionalists typically see it as abandoning strong causation unless mechanisms are specified.

  ### Joint Unsatisfiability & The Key Filter
  *   **The Tension:** The strongest form of **Reasons vs. Causes (Requirement 2)** – demanding proof that values *authentically motivated* individuals *at the time* rather than being rationalizations – can be **jointly unsatisfiable with strict RCT/institutionalist priors demanding reduction to self-interest or institutional constraints**. Deep cultural causation inherently challenges methodological individualism and pure rational actor models. You cannot *prove* internal motivation to someone who discounts self-reports as inherently unreliable or epiphenomenal.
  *   **The Highest-Yield Requirement:** **Independent Operationalization (Requirement 1)** does the most work. It rules out the vast majority of popular, "just-so" cultural explanations (e.g., "National Character X caused their success/failure") that infer the cause from the outcome. Stories that cannot point to the *prior existence* of the specific, measurable value *distinct from the behavior it explains* are fundamentally unserious, regardless of their intuitive appeal or narrative coherence. This is the bedrock filter.

  **In Summary:** A serious cultural causation claim must: 1) Measure the culture *before* and *independently* of the outcome (Non-negotiable), 2) Explain *step-by-step how* it caused actions leading to the outcome (Non-negotiable), 3) Show *which people* held the values that mattered and *how* they aggregated (Essential, contested depth), 4) Beat key alternative explanations (Essential, contested rigor), 5) Prove the culture came first/drove the change (Essential, contested evidence), and 6) If using "affinity," specify its causal mechanism or admit it's non-causal (Clarity on elective affinity). Requirement 1 is the most effective gatekeeper against circular storytelling.
