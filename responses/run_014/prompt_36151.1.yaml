prompt: |-
  I serve as the attending veterinarian and chair of the animal-care committee at a biomedical research institute. Our regulatory obligations extend to mammals, birds, and fish, but a growing share of our work involves invertebrates: electrophysiology on locusts, behavioral assays on crabs and shrimp, and from next year a small cephalopod program. The regulations say nothing about which of these animals require anesthesia, humane endpoints, or post-procedural monitoring, so in practice each laboratory improvises, and the improvisation tracks little more than intuitions about brain size — the crustacean labs have begun using analgesia on their own initiative, while the locust preparations are still performed on fully awake animals, and nobody on the committee can articulate a principled reason why the line falls where it does. The honest situation is that committee members reach for brain size and encephalization because those are measurable, even though everyone vaguely agrees that what matters morally is presumably not the size of the organ but the capacity for suffering that the organ subserves — and nobody knows how to move from the one to the other under time pressure.

  Please convert that ragged reasoning into a decision procedure my committee can actually run. The parameters are as follows: roughly a dozen new invertebrate protocols per year; the review must be completed in about an hour per protocol by people who are not comparative neuroscientists; the output is a written determination signed off by me, so it must be auditable by an outside inspector later. The procedure should be a sequence of questions asked in order, each with a statement of what counts as a sufficient answer; it should specify where the procedure terminates in a determination of no protection required, and where it hands the question back to the committee because the issue is one of moral values rather than empirical fact, so that the value judgment is at least visible and consistently located rather than smuggled into a factual-looking step. It must also tell the committee what to do when the evidence needed to answer a question simply does not exist, which for most invertebrate groups is the normal case rather than the exception. Finally, it should contain an explicit warning section on where a brain-size proxy misfires — both directions — since comparative cognition is full of cases in which a small or anatomically unconventional nervous system supports more than its size suggests, and cases in which a large brain coexists with capacities that seem irrelevant to welfare.

  Once the procedure is written, apply it to three protocols. First, an electrophysiology preparation on adult locusts that has historically been carried out without anesthesia, where the interesting complication is that anesthesia would destroy the very signal the experiment exists to record. Second, a shell-crushing noxious assay on shore crabs, a protocol the proposing laboratory has already volunteered to run under analgesia. Third, a learning and memory study on cuttlefish, animals whose nervous system is organized so differently from ours that committee members cannot agree whether their intuitions about them are worth anything. At least one of the three applications must return a determination the committee will find unwelcome, and you should say which one and why the procedure nonetheless returns it. Close by stating plainly what the procedure cannot do: in particular, whether it can settle the underlying moral question at all, or only render our existing moral uncertainty consistent, documented, and honestly assigned to the right people.
reasoning: |-
  We are designing a decision procedure for the animal-care committee to determine the necessity of anesthesia, humane endpoints, and post-procedural monitoring for invertebrate protocols. The procedure must be auditable, efficient, and handle uncertainty. It will be structured as a sequence of questions with clear criteria for answers. The procedure must also account for cases where evidence is lacking and where value judgments are required.

  Key principles:
  1. The procedure must be based on the capacity for suffering (or more broadly, the capacity for negative affective states) and not solely on brain size or encephalization.
  2. We acknowledge that for many invertebrates, evidence may be incomplete or absent. We need a way to handle such cases.
  3. The procedure must be runnable by non-experts in a limited time (about an hour per protocol).
  4. The output is a determination that is either "no protection required" or a set of requirements (anesthesia, humane endpoints, monitoring) or a referral to the committee for a value judgment when empirical evidence is insufficient to make a clear call.

  We will break down the capacity for suffering into components that can be assessed with available evidence. We note that suffering requires:
  - Nociception (the ability to detect noxious stimuli) and
  - The capacity for negative affect (i.e., the experience of pain or distress as an aversive state).

  We will use the following framework:

  **Decision Procedure: Invertebrate Welfare Assessment**

  **Step 0: Confirm the animal is an invertebrate.**
     - If the animal is a vertebrate (mammal, bird, or fish), then the standard regulations apply. This procedure is for invertebrates only.

  **Step 1: Is there direct evidence of the capacity for negative affective states (e.g., pain, distress) in the species or a closely related species?**
     - *Sufficient evidence for capacity*: Peer-reviewed studies demonstrating behaviors indicative of pain (e.g., trade-offs between avoiding noxious stimuli and accessing rewards, long-term changes in behavior after noxious events, analgesia reducing responses to noxious stimuli in a way consistent with pain relief, avoidance learning, self-administration of analgesics, physiological stress responses that are modulated by analgesics and are linked to noxious stimuli).
     - *Sufficient evidence against capacity*: Peer-reviewed studies that systematically investigate and fail to find such behaviors, or that provide strong evidence that responses are purely nociceptive reflexes without affective component.
     - *Insufficient evidence*: When the above types of studies are absent, inconclusive, or contradictory.

     - *Determination*:
          - If there is sufficient evidence for capacity: Proceed to Step 2.
          - If there is sufficient evidence against capacity: Determination of "no protection required" for anesthesia, humane endpoints, and monitoring. (Note: This outcome is rare for invertebrates because absence of evidence is not evidence of absence. We must be cautious.)
          - If insufficient evidence: Proceed to Step 3 (proxy assessment).

  **Step 2: For animals with demonstrated capacity for negative affective states, what level of protection is required?**
     - This step is straightforward: require anesthesia for potentially painful procedures (unless there is a compelling scientific reason not to, which must be approved by the committee with justification), humane endpoints, and post-procedural monitoring. The committee must then review the protocol for these requirements.

  **Step 3: Proxy Assessment (when direct evidence is insufficient)**
     - We use proxies that are correlated with the capacity for negative affect. We note that brain size alone is insufficient. We will consider:
          a) **Nociception**: Is there evidence of nociception (presence of nociceptors and/or behavioral responses to noxious stimuli)? (Note: Nociception alone does not imply suffering, but it is a prerequisite.)
          b) **Brain complexity**: We look for evidence of brain structures or neural circuits that are associated with affective states in vertebrates (e.g., the presence of centralized brain regions that integrate sensory information and modulate behavior based on internal state). However, we note that invertebrates may have analogous structures that are not homologous. We also consider:
              - The presence of a centralized brain (vs. a nerve net or ganglia without central integration).
              - The existence of learning and memory capabilities (especially associative learning that involves noxious stimuli).
              - Evidence of behavioral flexibility and goal-directed behavior that suggests an internal representation of state.
          c) **Behavioral indicators**: Even without direct evidence of negative affect, we look for behaviors that are suggestive, such as:
              - Protective responses to injury (e.g., grooming, guarding).
              - Avoidance learning in contexts that might involve noxious stimuli.
              - Changes in behavior that last beyond the immediate stimulus (e.g., reduced activity after injury).

     - *Determination*:
          - If there is evidence of nociception AND at least two of the following: (i) centralized brain with evidence of integration, (ii) learning and memory capabilities, (iii) behavioral indicators as above, then proceed to Step 4 (Value Judgment Referral).
          - Otherwise: Determination of "no protection required".

     - *Note on uncertainty*: If the evidence for any of these proxies is mixed or absent, we must default to the absence of evidence. However, we note that the committee may choose to err on the side of caution, but that requires a value judgment and is handled in Step 4.

  **Step 4: Value Judgment Referral**
     - When the empirical evidence is insufficient but the proxy assessment raises concerns (i.e., Step 3 conditions are met), the committee must make a value judgment about whether to extend protections. The procedure cannot settle this because it involves moral uncertainty. The committee must explicitly discuss and vote on the issue, and the rationale must be documented.

     - The committee should consider:
          - The potential for suffering (based on the proxies and any other relevant information).
          - The feasibility and impact of providing protections (e.g., whether anesthesia is possible without compromising the science, the availability of analgesics, etc.).
          - Ethical principles (e.g., precautionary principle).

  **Step 5: Handling of Procedures that Conflict with Protections**
     - In cases where the procedure determines that protections are required (either via Step 2 or Step 4) but the experimental procedure is incompatible with anesthesia (e.g., because it would interfere with neural recordings), the committee must:
          - Require the use of humane endpoints and post-procedural monitoring to minimize suffering.
          - Consider whether the scientific objectives justify the potential suffering (this is a separate ethical review that the committee must perform).

  **Explicit Warning Section (to be included in the procedure documentation):**

  **Warnings on Brain-Size Proxies and Other Pitfalls:**
     - **Underestimation**: Small or unconventional nervous systems can support complex functions. Examples:
          - Honeybees (small brain) exhibit complex learning and memory, including pain-related learning.
          - Cephalopods (like octopuses and cuttlefish) have large brains but organized very differently from vertebrates, yet show advanced cognition and behavioral flexibility.
          - Some insects (e.g., fruit flies) show evidence of chronic pain and central modulation.
     - **Overestimation**: Large brains may not always indicate a capacity for suffering. For example, some large brains may be dedicated to sensory processing or motor control without the integration necessary for affect. Also, some animals with large brains (e.g., certain mollusks) may not have the neural architecture for subjective experience.

     Therefore, brain size alone is not a reliable indicator. We must look for functional evidence.

  **Application to Protocols:**

  **Protocol 1: Electrophysiology on adult locusts without anesthesia.**
     - Step 1: Direct evidence for locusts? There is some evidence of nociception in insects, but evidence for negative affective states is limited. One study on fruit flies (which are also insects) has shown chronic pain-like states, but locusts might be different. We lack direct evidence for locusts. -> Insufficient evidence, proceed to Step 3.
     - Step 3: 
          a) Nociception: Yes, locusts have nociceptors and show avoidance behaviors to noxious stimuli.
          b) Brain complexity: Locusts have a centralized brain. They show learning and memory (e.g., olfactory conditioning). They exhibit behavioral flexibility (swarming, flight control). 
          c) Behavioral indicators: There are reports of insects (including locusts) showing prolonged changes after injury? (Evidence is not strong, but some studies show avoidance learning.) 
          We have nociception and at least two of the others (centralized brain and learning; behavioral indicators might be weak). So, we meet the criteria for Step 4.
     - Step 4: Refer to the committee for value judgment. The committee must decide whether to require protections. However, note that anesthesia would destroy the neural signal. Therefore, if the committee decides that protections are needed, they cannot require anesthesia but might require humane endpoints and monitoring. The committee must also consider the scientific justification.

     *Determination*: The procedure does not automatically require protections but flags the protocol for committee deliberation. The committee might find this unwelcome because they now have to make a value judgment in a gray area.

  **Protocol 2: Shell-crushing noxious assay on shore crabs under analgesia.**
     - Step 1: Direct evidence? There is substantial evidence for crabs. For example, hermit crabs show trade-offs between avoiding noxious stimuli and retaining a good shell, and they show long-term changes in behavior after shell eviction. Crabs also show avoidance learning and have been shown to benefit from analgesia (reducing rubbing behavior after noxious stimuli). -> Sufficient evidence for capacity. Proceed to Step 2.
     - Step 2: Protections required. The lab has already volunteered analgesia, which is appropriate. The committee must ensure that the analgesia is effective and that humane endpoints and monitoring are in place.

     *Determination*: Protections are required. This is consistent with the lab's initiative.

  **Protocol 3: Learning and memory study on cuttlefish.**
     - Step 1: Direct evidence? Cephalopods (including octopuses and cuttlefish) are known for their intelligence. There is evidence of complex learning, memory, and problem-solving. Some evidence of nociception and avoidance, but direct evidence of negative affective states (like pain) is still emerging. However, the European Union includes cephalopods in their animal research regulations. We might consider this as suggestive but not definitive. Given the uncertainty, we proceed to Step 3.
     - Step 3:
          a) Nociception: Yes, cephalopods have nociceptors.
          b) Brain complexity: They have the largest brain among invertebrates, highly centralized, with complex lobes. They exhibit advanced learning and memory (including associative learning and spatial learning). 
          c) Behavioral indicators: They show protective behaviors (e.g., inking, jetting away) and can learn to avoid noxious stimuli. They also show curiosity and play, which might indicate a rich internal state.
          This clearly meets the criteria (nociception and at least two others) and exceeds the threshold. Proceed to Step 4.
     - Step 4: Refer to the committee for value judgment. The committee must decide on protections. Given the strong evidence of complex cognition, the committee might well decide to require anesthesia for invasive procedures, humane endpoints, and monitoring. However, note that the learning and memory study might not be invasive? We must clarify. If it involves only behavioral observations without invasive procedures, then anesthesia may not be required. But if it involves surgery (e.g., implanting electrodes), then anesthesia would be required.

     *Determination*: The procedure flags the protocol for committee deliberation. This might be unwelcome because cuttlefish are new to the institute and the committee might have hoped for a clear answer. However, the procedure requires them to make a value judgment.

  **Unwelcome Determination:**
     At least one protocol must return an unwelcome determination. We choose the **locust protocol**. The committee might find it unwelcome because:
     - Historically, they have not used anesthesia and the procedure now flags it for deliberation, which may lead to new requirements (like humane endpoints) that add complexity.
     - The committee must now confront the moral uncertainty and make a decision that might delay the protocol or impose additional burdens.

  **What the Procedure Cannot Do:**
     The procedure cannot settle the underlying moral question of whether a particular invertebrate species has the capacity for suffering and thus deserves protection. It can only:
     - Render the existing moral uncertainty consistent and explicit.
     - Document the decision-making process for auditors.
     - Assign the value judgment to the committee (the right people) when the empirical evidence is insufficient.

     The procedure is a tool for organizing evidence and making the process transparent, but it does not eliminate the need for ethical deliberation in the face of uncertainty.
answer: |-
  ### Decision Procedure for Invertebrate Welfare Assessment  
  **Purpose**: To determine if anesthesia, humane endpoints, and/or post-procedural monitoring are required for invertebrate protocols, based on capacity for suffering. Outputs: "No protection required," "Protections required," or "Refer to committee for value judgment."  

  ---

  ### Step-by-Step Procedure  
  **Rules for All Steps**:  
  - **Time Limit**: Each step must be answered within 10 minutes using readily available evidence (e.g., peer-reviewed literature, textbooks, expert databases like *Animal Welfare Institute* resources).  
  - **Uncertainty Handling**: If evidence is absent/inconclusive, default to "Insufficient evidence" and follow step-specific rules.  
  - **Audit Trail**: Document answers, evidence sources, and reasoning for each step. Final determination signed by attending veterinarian.  
  - **Warning Section**: See below; consult before Step 1.  

  #### **Step 1: Is there species-specific evidence of negative affective states (e.g., pain, distress)?**  
    - **Sufficient Evidence For**: Peer-reviewed studies demonstrating:  
      - Avoidance learning (e.g., associating a stimulus with harm).  
      - Trade-off behaviors (e.g., sacrificing reward to avoid harm).  
      - Self-administration of analgesics.  
      - Long-term behavioral changes post-injury (e.g., reduced feeding, social withdrawal).  
    - **Sufficient Evidence Against**: Studies conclusively showing absence of the above AND confirming reflexive-only responses to noxious stimuli.  
    - **Insufficient Evidence**: No studies, conflicting data, or evidence only for nociception (simple reflex responses).  
    - **Determination**:  
      - **For** → Proceed to Step 2.  
      - **Against** → **No protection required.**  
      - **Insufficient** → Proceed to Step 3.  

  #### **Step 2: Does the procedure involve potentially noxious stimuli?**  
    - **Definition**: Noxious stimuli = Tissue damage, extreme temperatures, chemicals, restraint causing injury.  
    - **Sufficient Evidence**: Protocol describes injections, surgery, exposure to toxins, physical trauma, or prolonged confinement.  
    - **Determination**:  
      - **Yes** → **Protections required** (anesthesia/analgesia for invasive procedures; humane endpoints; monitoring).  
      - **No** → **No protection required.**  

  #### **Step 3: Is there evidence of neural integration capacity?**  
    - **Assess**: Centralized brain structures (not just ganglia) enabling:  
      - Learning/memory (e.g., associative conditioning).  
      - Behavioral flexibility (e.g., problem-solving, adapting to new environments).  
    - **Sufficient Evidence For**: Studies showing complex integration (e.g., crabs solving mazes, cephalopods using tools).  
    - **Sufficient Evidence Against**: Nervous system is purely reflexive (e.g., jellyfish nerve nets with no central processing).  
    - **Insufficient Evidence**: No data, or only evidence of simple reflexes.  
    - **Determination**:  
      - **For** → Refer to **Value Judgment** (Step 4).  
      - **Against** → **No protection required.**  
      - **Insufficient** → **No protection required** (due to lack of evidence).  

  #### **Step 4: Committee Value Judgment**  
    - **Trigger**: Step 1 (Insufficient) + Step 3 (For).  
    - **Process**: Committee debates using:  
      - **Precautionary Principle**: Default to protections if suffering is plausible.  
      - **Feasibility**: Can anesthesia/monitoring be implemented without compromising science?  
    - **Output**: Committee votes → "Protections required" or "No protection required." Rationale documented.  

  ---

  ### Warning Section: Limitations of Brain-Size Proxies  
  **Misfires in Comparative Cognition**:  
  - **Underestimation (Small Brain, High Capacity)**:  
    - *Example*: Honeybees (0.01g brain) show complex learning, emotion-like states, and social behaviors.  
    - *Risk*: Denying protections to animals that may suffer.  
  - **Overestimation (Large Brain, Low Relevance)**:  
    - *Example*: Some mollusks (e.g., giant clams) have large ganglia but no evidence of affective states; brain size may support motor/sensory functions only.  
    - *Risk*: Over-regulating animals with minimal suffering capacity.  
  **Guidance**: Prioritize functional evidence (Step 1, Step 3) over anatomy.  

  ---

  ### Application to Protocols  
  #### **Protocol 1: Locust Electrophysiology (Awake Preparation)**  
  - **Step 1**: Insufficient evidence. No studies on locust affective states; only nociception (reflex responses to injury).  
  - **Step 3**: Insufficient evidence. Locusts exhibit simple learning (e.g., habituation) but no conclusive evidence of neural integration for suffering.  
  - **Determination**: **No protection required.**  
    - *Why unwelcome?* Committee may intuitively worry about drilling into awake animals, but evidence does not support protections. Anesthesia is incompatible with electrophysiology, so if protections were required, the protocol might be rejected. Procedure prioritizes evidence over intuition.  

  #### **Protocol 2: Shore Crab Shell-Crushing Assay (with Analgesia)**  
  - **Step 1**: Sufficient evidence for suffering. Crabs show trade-off behaviors (e.g., sacrificing food to avoid shock), long-term avoidance of crushing sites, and analgesia reduces guarding behaviors.  
  - **Step 2**: Yes (crushing is noxious).  
  - **Determination**: **Protections required** (analgesia, endpoints, monitoring). Matches lab’s initiative.  

  #### **Protocol 3: Cuttlefish Learning/Memory Study**  
  - **Step 1**: Insufficient evidence. Cuttlefish show advanced cognition (e.g., spatial learning) but no direct studies on affective states.  
  - **Step 3**: Sufficient evidence for neural integration. Cuttlefish have large, centralized brains; exhibit problem-solving, memory, and behavioral flexibility.  
  - **Determination**: **Refer to committee for value judgment** (Step 4).  
    - *Committee Deliberation*: Precautionary principle applies. Cephalopods (e.g., octopuses) are protected in some countries. Likely outcome: Protections required (anesthesia for invasive procedures, endpoints).  
    - *Why unwelcome?* Committee lacks expertise and must make a high-stakes judgment. Cuttlefish nervous systems are alien, and protections may add costs/complexity.  

  ---

  ### What the Procedure Cannot Do  
  - **Cannot Settle Moral Questions**: It does not resolve *whether* invertebrates deserve moral consideration. It only:  
    1. **Documents Uncertainty**: Forces explicit value judgments (Step 4) when evidence is lacking.  
    2. **Standardizes Empirical Review**: Uses consistent criteria for suffering capacity.  
    3. **Assigns Accountability**: Ensures value judgments are made by the committee (not hidden in "expert" steps).  
  - **Limitations**:  
    - Relies on available science; cannot create new evidence.  
    - May err if new studies emerge (e.g., proof of locust suffering).  
    - Does not replace ongoing committee training in comparative neuroscience.  

  **Final Output**: A clear, auditable record distinguishing evidence-based decisions from ethical choices.
