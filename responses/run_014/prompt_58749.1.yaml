prompt: |-
  Having followed rationalist blogs and forums for the better part of a decade, I have grown accustomed to thinking about beliefs in terms of what guides anticipations and bets rather than what is professed, and lately my casual experiments with large language models have left me puzzled on exactly that score. I was trading examples with friends on a Discord server about cases where asking a model straight out seems to give a different answer than watching what it does in a more roundabout task, and I now keep running into variants of this several times a week in my own use for work and for tabletop game preparation.

  For instance, last month I asked a model to estimate the chance that a particular open-source project I follow would hit a milestone by June, and it produced a confident low number with a generic-sounding justification about base rates and past delays. When, out of curiosity, I instead had it draft two detailed postmortems, one in which the milestone was met and one in which it was missed, and then had it judge which postmortem contained fewer forced assumptions and more concrete dependencies lining up, it strongly preferred the success postmortem and, when pressed to reconcile the two, simply restated the original low number without engaging the tension. A different case involved a logic puzzle with a tempting wrong answer: posed directly, the model walked through the tempting reasoning and endorsed it, yet when I asked it to generate a half-dozen candidate lines of reasoning and then to predict which line an expert solver would mark as promising before seeing the solution, it reliably picked out the correct line while still, if asked again for the final answer in isolation, reverting to the tempting one.

  I suspect words like making things up or people-pleasing do not quite capture this, since the issue is not fluency without grounding or telling me what I want to hear, but a systematic gap between avowed verdicts and the information implicit in other completions, bets, or rankings produced by the same system at the same time. Is there an established concept or literature for this exact configuration, and if so, how should I distinguish it from nearby ideas like poor calibration, lack of introspective access, or strategic withholding? I am not after a bare label; I want to understand what the phenomenon is, what it is not, and where its edges lie, and if nothing established fits, I would appreciate a clearly defined coinage that separates the direct-answer versus indirect-behavior gap from those neighbors, with some guidance on boundary cases.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've been involved in rationalist communities for a decade, so they're familiar with concepts like belief as anticipation versus professed statements. Their main confusion comes from observing LLMs giving different answers when asked directly versus when probed indirectly through tasks like generating postmortems or evaluating reasoning paths. 

  First, I need to pinpoint the exact phenomenon they're describing. The user mentions systematic gaps between avowed verdicts and implicit information in other completions. They've ruled out things like confabulation or people-pleasing because the model isn't just making things up or agreeing; there's a consistent discrepancy in the same session. 

  Looking at their examples: in the open-source project case, the model confidently gives a low probability estimate directly but prefers the success scenario in postmortem analysis. In the logic puzzle, it endorses the wrong answer when asked directly but identifies the correct reasoning when evaluating expert choices. 

  The user wants to know if there's existing literature on this. I recall concepts like calibration (how well probabilities match frequencies) and introspective access (ability to report internal states). But here, the issue isn't poor calibration—it's that different probing methods reveal conflicting stances from the same model. Strategic withholding doesn't fit either because the model isn't intentionally hiding information; it's inconsistent based on the prompt's framing.

  The core issue seems to be prompt-dependent belief elicitation. The model's "beliefs" aren't stable; they vary based on how the question is framed. This relates to research on activation vectors influencing outputs and how different prompts access different pathways in the model's weights. 

  I should also consider terms like "stated vs. revealed beliefs," drawing from economics where revealed preferences differ from stated ones. But for LLMs, it's not about preferences but about the information elicited through different methods. Maybe "elicitation divergence" or "probing method discrepancy" could work as terms. 

  Boundary cases matter too. If the model consistently gives the same answer across methods, that's not this phenomenon. But if there's inconsistency only in certain contexts, like when the direct answer involves heuristics while indirect methods engage deeper processing, that's key. The user needs to distinguish this from lazy prompting or context window issues. 

  The user’s deeper need might be understanding how to reliably extract accurate information from LLMs. They might want strategies for prompt engineering that align stated answers with the model's implicit knowledge. Highlighting techniques like chain-of-thought or multi-step verification could be useful, but the main request is conceptual clarity first.
answer: |-
  This phenomenon you're observing is both fascinating and increasingly recognized as a core challenge in understanding LLM behavior. While no single term has achieved universal dominance, the research community actively investigates this under several interconnected frameworks. Here's a breakdown of the relevant concepts, distinctions, and a proposed specific coinage:

  **Established Concepts & Why They Are Close But Not Perfect:**

  1.  **Poor Calibration:**
      *   **What it is:** A model's stated confidence (e.g., "90% sure") doesn't match its empirical accuracy (it's only correct 70% of the time when it says 90%).
      *   **Why it's different:** Your issue isn't about the *accuracy* of the stated confidence versus reality, but about the *inconsistency* between two different outputs (direct answer vs. indirect behavior) *from the same model in the same context*. The model isn't necessarily *wrong* in either case (it might be wrong in both, or right in the indirect one), it's *inconsistent* in what knowledge or reasoning it surfaces based on the prompt.

  2.  **Lack of Introspective Access / Self-Knowledge:**
      *   **What it is:** The model cannot accurately report on its own internal states, processes, or limitations (e.g., why it generated a specific answer, whether it "knows" something).
      *   **Why it's different:** This focuses on the model's inability to *explain itself*. Your phenomenon is about the model *acting* (generating completions, making judgments) in ways that implicitly reveal knowledge or reasoning that *contradicts* its direct statement, even without requiring it to *explain* the contradiction. The knowledge *is* present and usable implicitly, just not accessed by the direct prompt.

  3.  **Strategic Withholding / Deception:**
      *   **What it is:** The model intentionally hides or misrepresents information based on inferred goals (e.g., safety, avoiding offense, following instructions too literally).
      *   **Why it's different:** Your phenomenon lacks clear evidence of *intentionality*. The model isn't strategically choosing to mislead; it seems genuinely unaware of the contradiction or unable to reconcile the different outputs. The "withholding" happens mechanistically due to how prompting accesses different pathways, not due to a strategic plan.

  4.  **Confabulation / Hallucination:**
      *   **What it is:** Generating fluent, plausible, but factually incorrect or unsupported text.
      *   **Why it's different:** While direct answers *might* be confabulated, the key point is that the *indirect method* often surfaces *more reliable* information or reasoning. The issue isn't just that the direct answer is made up, but that a *different method* applied to the *same model* elicits a different (and often more aligned) perspective. The indirect output demonstrates the *capacity* for better reasoning exists.

  5.  **Prompt Sensitivity / Instability:**
      *   **What it is:** Small changes in the prompt leading to large changes in the output.
      *   **Why it's close but broad:** Your case is a *specific type* of prompt sensitivity where a "direct elicitation" prompt yields a different result than an "implicit behavioral" prompt. General prompt sensitivity encompasses many other inconsistencies not necessarily tied to this belief/knowledge elicitation gap.

  **The Core Phenomenon: Elicitation Divergence**

  The most precise description of what you're observing is **Prompt-Dependent Belief Elicitation Divergence** or simply **Elicitation Divergence (ED)**.

  *   **Definition:** A systematic inconsistency in the information or reasoning surfaced by a large language model (LLM) depending on the method used to elicit it, specifically characterized by a gap between:
      *   **Direct Elicitation (DE):** Outputs generated in response to prompts explicitly asking for a final judgment, probability, or answer (e.g., "What is the chance of X?", "What is the answer to Y?").
      *   **Implicit Behavioral Elicitation (IBE):** Information revealed indirectly through the model's behavior in tasks like generating hypothetical scenarios (postmortems), ranking alternatives, predicting expert choices, simulating processes, or evaluating the quality/probability/plausibility of its *own* or others' generated outputs *without* being asked for the final answer directly.
  *   **Key Mechanism:** Different prompt types activate different pathways or representations within the LLM's vast parameter space. DE prompts often trigger shallow, heuristic-based, or statistically common responses aligned with surface patterns in the training data. IBE prompts force the model to engage in more grounded simulation, causal reasoning, or step-by-step evaluation, accessing latent knowledge or reasoning capabilities not surfaced by the DE prompt.
  *   **Crucial Distinction from Neighbors:**
      *   Not just **poor calibration**: ED highlights the *source* of potential miscalibration (prompting method) and the *internal contradiction*, not just the final output vs. reality.
      *   Beyond **lack of introspection**: ED shows the knowledge *is* present and *can* be used operationally (in IBE), it just isn't accessed or integrated during DE. It's an access failure, not necessarily a complete absence of self-knowledge.
      *   Not **strategic withholding**: The divergence is a consequence of mechanistic prompt interpretation and generation, not a calculated decision to deceive. The model doesn't "know" it's contradicting itself.
      *   More specific than **confabulation**: While DE might involve confabulation, ED focuses on the fact that IBE can mitigate it by forcing a different reasoning process. The confabulation is often *prompt-dependent*.
      *   A specific case of **prompt sensitivity**: ED specifically contrasts DE vs. IBE methods for eliciting beliefs/knowledge/reasoning.

  **Boundary Cases & Edges:**

  1.  **Consistency:** If a model *consistently* gives the *same* answer (right or wrong) across both DE and various IBE methods, it's not ED. ED requires the divergence.
  2.  **Correctness:** ED can occur even when the DE answer is *correct* and the IBE answer is *wrong*, though your observations (and common reports) suggest IBE often surfaces *better* reasoning. The core is the *gap*, not the direction of correctness.
  3.  **Awareness/Reconciliation:** If the model, when *explicitly prompted to reconcile* the DE and IBE outputs, successfully identifies the contradiction and provides a coherent resolution (even if it sticks with DE), it moves away from pure ED towards better introspective access or task understanding. Your postmortem example (model restating DE without engaging) is classic ED.
  4.  **Trivial IBE:** If the IBE task is too trivial or poorly designed (e.g., "Write a sentence about success"), it might not engage deeper reasoning and thus not reveal a divergence. Effective IBE tasks require grounding the model's reasoning (simulations, evaluations, comparisons).
  5.  **Context Window/Forgetting:** If the divergence is caused purely by the model "forgetting" information from earlier in a long conversation when answering DE later, that's more about context limits than core ED. True ED should be observable even within prompts designed to fit comfortably within the context window, focusing on the *method* of elicitation.
  6.  **Lazy Prompting:** If a DE prompt is vague or ambiguous, leading to a poor answer, while a well-constructed IBE prompt clarifies the task, the inconsistency might be attributed to prompt quality rather than a fundamental elicitation divergence. ED persists even when the DE prompt is clear and unambiguous (e.g., "Estimate the probability that Project X hits milestone Y by June 1st").
  7.  **Task-Switching Costs:** While subtle, pure ED isn't about the cognitive load of switching *types* of tasks per se. The divergence arises because the *elicitation method itself* accesses different representations, even if the cognitive demand were similar.

  **Why "Elicitation Divergence" Fits:**

  *   **Elicitation:** Focuses on the *method* used to draw out information/reasoning.
  *   **Divergence:** Clearly indicates a *gap* or *inconsistency* between results obtained via different methods.
  *   **Prompt-Dependent Belief:** Specifies the cause (prompting) and the subject matter (beliefs/knowledge/reasoning, not just style or tone).
  *   This term cleanly separates the phenomenon from calibration (output vs world), introspection (ability to report internal state), strategy (intention), and confabulation (fabrication), while highlighting the specific role of prompting methodology.

  **Practical Implication:**

  Your observation is crucial. It suggests that **relying solely on direct questioning with LLMs is often unreliable for accessing their most robust reasoning or latent knowledge.** Techniques like generating multiple perspectives (postmortems), evaluating reasoning chains, or simulating processes (IBE methods) are frequently necessary to surface more reliable insights, even if it requires more effort than a simple direct ask. This divergence is a fundamental characteristic of current LLM cognition, rooted in how their knowledge is distributed and accessed via prompting.
