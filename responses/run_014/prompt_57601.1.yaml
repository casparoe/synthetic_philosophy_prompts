prompt: |-
  Been building an objection to epiphenomenalism for my reading group and it's gone badly wrong — it proves far more than I wanted and I can't find the leak. Our own nickname for the relevant properties is "causally blank": instantiated, maybe, but doing nothing.

  (1) For a property to be what a belief is *about*, that property has to play some causal role in producing the belief. Otherwise nothing fixes the content — there'd be no difference between a belief that's about it and one that merely looks like it is.

  (2) Epiphenomenalism says phenomenal properties are causally blank.

  (3) So on epiphenomenalism no belief is about a phenomenal property. Not even the one I'd put into words as "there's something it's like to see this red".

  (4) That's the paradox of phenomenal judgment: the epiphenomenalist can't know anything about her own experience, and the introspective reports she uses as her evidence aren't reports about experience at all. She can't even state her own data.

  (5) Up to there I'm happy. The trouble is that (1) never actually mentions experience.

  (6) Numbers are causally blank. So are counterfactual facts — what would have happened had the coin landed tails. So, if non-naturalism is right, are moral properties.

  (7) So by (1) nobody has ever believed anything about a number, about a counterfactual, or about whether some act is wrong.

  (8) I can't assert that while also arguing against epiphenomenalism. If (7) is on the table my objection has no dialectical force whatever, since the very principle that was going to sink the epiphenomenalist has just sunk arithmetic along with it.

  (9) Therefore (1) is false. And if (1) is false, (3) goes with it, and the paradox never gets started — which means I've refuted an objection to a theory of consciousness by waving at prime numbers.

  My flatmate's suggestion is that (6) is just false, becuase numbers do cause things, via our arithmetical beliefs; but that looks like it concedes (1) rather than escaping it, and I don't think he'd be happy with the version of it he's signing up to.

  Where does it break? I'd like you to name the step, explain why it looked so innocent on the way past, and then price the alternatives — what I'm giving up whichever way I turn. For what it's worth I'd rather keep (2) and (4) as live claims than keep (1), but I'll take the other trade if you can show me it's cheaper than I'm assuming.
reasoning: |-
  Okay, let me try to figure out where this argument goes wrong. The user has built an objection to epiphenomenalism but it ends up undermining too much, like mathematics and morality. They need to find the weak step.

  First, let's recap their steps. Premise (1) says that for a belief to be about a property, that property must play a causal role in forming the belief. Otherwise, there's no content fixation. Epiphenomenalism (2) says phenomenal properties are causally blank. So, (3) no beliefs can be about phenomenal properties. This leads to (4), the paradox where the epiphenomenalist can't even know or report their own experiences. 

  The problem starts at (6). They extend (1) to other domains: numbers, counterfactuals, moral properties (if non-naturalist). Since these are also causally inert, (7) says no beliefs about them are possible. But that can't be right because we do have mathematical beliefs. So (1) must be false, which undermines the original objection to epiphenomenalism. 

  The user's flatmate suggests numbers do cause things via our beliefs, but that seems to accept (1), which they want to avoid. Where's the flaw? 

  I think step (1) is too strong. Content fixation might not always require the property itself to be causal. For abstract objects like numbers, beliefs are about them because of how we use symbols or concepts, not because numbers cause anything. So (1) applies only to empirical properties, not abstract ones. 

  But why did (1) seem plausible initially? Probably because for sensory beliefs, like seeing red, the redness does play a causal role. So for phenomenal properties, if they're causally blank, content fixation fails. But for numbers, the causal role is played by numerals, mental representations, etc., not the number itself. So the leak is in step (1)'s scope. It should be restricted to contingent, empirical properties. 

  Alternatives: If they keep (1), they lose math and morality, which is costly. If they restrict (1) to empirical domains, the epiphenomenalism objection holds, but they need to justify the restriction. They could also adopt a different content fixation theory, like teleosemantics, but that's more complex. 

  The user prefers to keep (2) and (4), so restricting (1) might be the best path. They'd give up (1) as universal but keep it for phenomenal properties, avoiding the overextension. They need to argue that phenomenal properties are empirical, not abstract, so (1) applies. 

  The step that breaks is applying (1) universally. The innocent mistake was not distinguishing between types of properties. Fixing that saves math while still challenging epiphenomenalism.
answer: |-
  Your argument leaks at **step (1)**, specifically in its **overgeneralization of the causal requirement for content fixation**. Here's the breakdown:

  ### Why Step (1) Is the Problem (and Why It Looked Innocent)
  - **The innocent core**: For *empirical, sensory, or object-involving beliefs* (e.g., "there's a red apple"), (1) seems plausible. If redness never causally interacts with us, how could we form beliefs *about redness itself*? We'd only have beliefs about neural correlates or dispositions. This makes (1) feel like a natural constraint for grounding intentionality in the physical world.
  - **The overgeneralization**: (1) assumes this causal requirement applies *universally* to *all* properties, including abstract, mathematical, or normative ones. But these aren't contingent natural properties; they're often considered necessary, acausal, or abstracta. Applying (1) to them conflates **causal efficacy** with **semantic aboutness**. Beliefs about numbers aren't "caused by" the number 7; they're mediated by symbols, concepts, and cognitive rules.

  ### Why Your Flatmate's Suggestion Fails
  You're right: saying "numbers cause beliefs via our arithmetical cognition" *concedes* (1) and makes numbers causally potent entities. This commits you to mathematical Platonism with causal powers (a fringe view) or conflates *representations* of numbers (which are causal) with numbers *themselves* (which are abstract). This doesn't rescue (1)—it distorts the ontology of math.

  ### The Alternatives (and Their Prices)
  You have two main paths to fix this. I'll price them as requested, with your preference for keeping (2) and (4) in mind:

  #### Option 1: **Restrict (1) to Contingent Natural Properties**
     - **The fix**: Reformulate (1) to:  
       *For a belief to be about a* ***contingent natural property***, *that property must play a causal role in producing the belief*.  
       This exempts abstracta (numbers), modal facts (counterfactuals), and non-natural moral properties.
     - **Why it works**:  
       - Phenomenal properties (if natural and contingent) still fall under (1).  
       - Epiphenomenalism (2) still implies they're causally blank.  
       - Thus, (3) and (4) hold: the epiphenomenalist can't form beliefs *about phenomenal properties themselves*.  
       - Math/morals are untouched because (1) no longer applies to them.
     - **The price**:  
       - You must defend the **contingent natural** demarcation. Why are phenomenal properties "natural" while numbers aren't?  
       - *Cost*: Moderate. You'll need a clear criterion (e.g., "properties invoked in causal laws" or "detectable by observation/instrumentation"). This risks circularity if "natural" is defined by causality, but it's defensible (e.g., physicalism assumes phenomenality is natural).  
       - *Benefit*: Saves your core argument against epiphenomenalism.

  #### Option 2: **Replace (1) with a Broader Content-Fixation Theory**
     - **The fix**: Ditch (1) entirely. Use a theory of content that doesn't rely *solely* on causal history (e.g., **teleosemantics**, **conceptual role semantics**, or **interpretivism**). For example:  
       *A belief is about property P if it plays a role in cognitive systems that* ***track*** *P (via evolution, design, or normative constraints), even if P itself is acausal*.  
     - **Why it might work**:  
       - Abstracta: Math beliefs track formal relations via rules (e.g., Peano axioms).  
       - Phenomenal properties: If epiphenomenal, they *can't* be tracked. Evolution can't select for "awareness of qualia" if qualia do nothing.  
       - Thus, (4) still holds: Epiphenomenalists lack *genuine* phenomenal concepts.  
     - **The price**:  
       - You abandon (1)'s intuitive causal grounding, adopting a more complex theory.  
       - *Cost*: High. You must defend an entire semantic framework against competitors (e.g., causal theories). Dialectically messy in a reading group.  
       - *Benefit*: More philosophically robust long-term. Rescues math/morals without arbitrary distinctions.

  ### Recommendation: Take Option 1
  Your goal is to save your epiphenomenalism objection while minimizing collateral damage. Option 1 is cheaper:  
  1. **Restricting (1)** is a minor patch, not a theory overhaul.  
  2. **Phenomenal properties** are uncontroversially "natural" in debates about consciousness (unlike numbers).  
  3. **Epiphenomenalists** already treat qualia as natural properties—they just deny their efficacy.  
  4. **You keep (2), (3), and (4) intact**, with no threat to arithmetic.  

  The leak was assuming content fixation is *uniform* across all domains. Once you limit (1) to properties that purportedly inhabit the causal order, your argument holds without sinking mathematics. The paradox of phenomenal judgment stands—and your reading group gets its payoff.

  ---
  **Final note**: This is a sharp, self-critical argument. The overgeneralization trap is common in philosophy (e.g., Hume's problem of induction). You've done the hard work; now just narrow the scope.
