  - That perks attached to scores risk coercion—needs mitigation 
  Also, the losing side's autonomy argument deserves full respect, not caricature. 

  ...Wait, did the user imply the counseling records are voluntary? That's extra sensitive. The memo must wall those off strictly. And seven-year retention—why not shorter? Graduation+1 year seems sufficient. 

  *imagines the professors colleagues reading this* 
  The deans will want "student success" rhetoric; the librarians will freak out about reading habits being monitored. The memo needs to speak to all while staying philosophically airtight. 

  Final structure: 
