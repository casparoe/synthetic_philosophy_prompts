  First, I need to understand their core needs. They need a structured method that takes an hour per case, produces a summary both parties can accept without walking out. The examples given are a landlord-tenant dispute and a business partnership disagreement. The key is to validate each perspective without merging them into a false unity.

  The Jain principles emphasize multiple viewpoints and conditional language. So the procedure should guide each party through articulating their perspective, identifying intersections, and acknowledging contradictions. The goal isn't agreement but mutual recognition of each other's truths.

  For the landlord-tenant case: tenant claims harassment via unannounced visits; landlord says it's legal maintenance. Tenant has a log of 17 visits; landlord has work orders for half. The procedure must highlight verified facts (documented visits) and subjective experiences (tenant feels harassed, landlord asserts legality). The summary would note the discrepancy in documentation and the emotional vs. procedural aspects.

  For the business partners: one says a handshake deal is binding; the other calls it casual talk. Here, the lack of formal terms is key. The procedure would explore context (bar, drinks), mutual understanding then vs. now, and document any follow-up actions. The summary would present both interpretations without forcing a resolution on the deal's validity.

  The challenge is structuring this into clear steps within an hour. Steps like individual account-taking, identifying objective data, subjective experiences, points of convergence, divergence, and neutral framing. Using conditional language (syādvāda) like "from the tenant's perspective" or "the landlord states" avoids absolute claims.

  Also, the mediator must remain neutral, using open-ended questions to draw out details without judgment. For conflicts without clear resolution, the procedure should flag them as judgment calls for mediation. The output summary needs to be factual yet empathetic, ensuring neither party feels dismissed.

  Testing this on the examples: for the landlord, separating documented visits from undocumented ones, acknowledging tenant's distress and landlord's intent. For the partners, context matters—alcohol, lack of specifics—highlighting differing memories without declaring who's right.

  The user's deeper needs might include reducing prep time, preventing walkouts, and fostering cooperation. By validating each side early, parties may be more amenable during mediation. The procedure also preps them for compromise by framing contradictions as understandable differences rather than lies.

  Ensuring the method is efficient: timed phases, focused questions, template summaries. Role-playing both cases helps verify practicality. Success hinges on the mediator's skill in guiding without leading, maintaining neutrality, and synthesizing accounts respectfully.
answer: |-
  Here's a practical mediation procedure based on anekāntavāda and syādvāda, designed for efficiency and defusing defensiveness. It focuses on **structuring perception**, not forcing agreement on facts.

  **The "Multi-Perspective Summary" (MPS) Procedure (Target: 45-60 mins)**

  **Core Principles:**
  1.  **Separate Perception from Fact:** Distinguish verifiable events from interpretations/feelings.
  2.  **Qualify Relentlessly (Syādvāda):** Use phrases like "X states that...", "From Y's perspective...", "It appears that...", "Records show...".
  3.  **Map, Don't Merge:** Identify areas of overlap, divergence, and irreconcilable difference *without* requiring parties to agree on a single narrative.
  4.  **Neutral Language is Non-Negotiable:** Avoid judgmental words ("harassed," "negligent," "lied"). Use descriptive, factual terms.

  **The Steps:**

  1.  **Individual Account Capture (10 mins per party):**
      *   **Mediator:** "Help me understand the situation from your viewpoint. What are the key events or actions that led you to seek mediation? What impact has this had on you?"
      *   **Focus:** Listen actively. Take notes, separating:
          *   **Reported Events:** Specific dates, times, actions, communications (e.g., "Visit on Jan 15th", "Text message on Feb 3rd").
          *   **Reported Intent/Motive:** What the other party *said* or what the speaker *believes* was the intent (e.g., "He said he was checking the furnace", "I believe she was trying to intimidate me").
          *   **Impact/Feeling:** How these events affected the speaker (e.g., "I felt anxious", "My sleep was disrupted", "I felt my trust was broken").
          *   **Supporting Evidence:** What they have to back up their account (logs, texts, emails, work orders, witnesses).
      *   **Sufficient Answer:** A clear list of key incidents/actions and the associated impact/interpretation. Don't get bogged in minute details; focus on the core pattern.

  2.  **Evidence Review & Objective Fact Identification (10 mins - Mediator Alone):**
      *   Quickly scan any provided evidence (logs, work orders, texts). Look for:
          *   **Corroborated Events:** Events both parties mention or that are documented by both/neutrally (e.g., "Visit occurred on Jan 15th" - both logs and work order exist).
          *   **Singly-Documented Events:** Events mentioned by one party and supported by their evidence (e.g., Tenant logs a visit on Jan 22nd; Landlord has no work order).
          *   **Undocumented Claims:** Key assertions with no supporting evidence from either side.
          *   **Explicit Contradictions:** Where evidence directly conflicts (e.g., Tenant log says "no notice"; Landlord shows an email sent that day).
      *   **Output:** A simple list: Corroborated Facts, Party A's Supported Facts, Party B's Supported Facts, Contradictions, Undocumented Claims.

  3.  **Mapping the Perspectives (15 mins - Mediator Synthesis):**
      *   Build the summary structure:
          *   **Introduction:** "This summary reflects the different perspectives shared by [Party A] and [Party B] regarding [Brief Issue - e.g., 'the frequency and nature of property visits' or 'the discussion about business expansion on X date']. It aims to capture their viewpoints and any available documentation."
          *   **Area of Potential Overlap/Shared Reality:** Start with *anything* agreed upon, however small. "Both parties agree that interactions occurred on the following dates: [List Corroborated Dates]. Both parties agree a conversation took place at [Bar Name] on [Date]."
          *   **Party A's Perspective (Using Syādvāda):** "From [Tenant's/Partner A's] perspective: They report [Key Event 1 - qualify!], which they experienced as [Impact/Feeling 1]. They report [Key Event 2], which they state led to [Impact/Feeling 2]. They have provided [Evidence Mentioned - e.g., 'a log of visits'] showing [Specific Finding - e.g., '17 visits recorded between X and Y dates']." *Stick to their reported experience.*
          *   **Party B's Perspective (Using Syādvāda):** "From [Landlord's/Partner B's] perspective: They state their actions were motivated by [Reported Intent/Motive - e.g., 'fulfilling maintenance obligations'/'exploring possibilities']. They report [Their version of Key Event 1], intending [Their stated intent]. They have provided [Evidence Mentioned - e.g., 'work orders'] for [Specific Finding - e.g., '8 visits during that period']. They state that [Response to Party A's key claim, e.g., 'proper notice was given for scheduled visits' or 'the bar conversation was preliminary and non-binding']."
          *   **Identified Points of Divergence/Contradiction (Be Explicit & Neutral):** "The accounts differ regarding: (1) Whether notice was provided for visits on [List specific dates with contradiction]. (2) The purpose/frequency of visits beyond those documented with work orders. (3) [For Biz] The intended binding nature and specificity of the agreement discussed at [Bar] on [Date]." *DO NOT state who is right.*
          *   **The "Judgment Call" Flag:** Explicitly state: "The differing interpretations of [Specific Point of Contradiction, e.g., 'the adequacy of notice' or 'the legal bindingness of the bar conversation'] represent core disagreements where perspectives diverge significantly. These differences in perception and interpretation are central to the dispute and will likely be a focus of the mediation discussion."
          *   **Closing:** "This summary aims to fairly represent both viewpoints as presented, along with documented points of agreement and disagreement, to provide a foundation for discussion."

  4.  **Readback & Signoff (10 mins):**
      *   Read the summary aloud clearly and neutrally to both parties together.
      *   **Key Question:** "Does this summary fairly represent the key points *of your perspective* as you shared it with me? We are not asking you to agree with the other person's perspective, only that your own view has been captured accurately and neutrally."
      *   **Handling Objections:**
          *   *Factual Error in Reporting Their View:* Correct immediately ("You're right, I said you felt anxious, not angry. I'll amend that.").
          *   *Objection to the Other Side's Portrayal:* "The summary states that *they* report or believe [X]. It is not stating [X] is true, only that this is their perspective. Does it accurately state *what they said* from your recollection?" OR "Our goal right now is to ensure *your* view is captured. Their perspective, as they presented it, is included so both understand the starting points. We will discuss the differences in mediation."
          *   *Demand to Change Wording to Imply Their Truth:* Gently hold the line: "I understand you believe [X] is the absolute truth. The summary uses neutral language ('states,' 'reports,' 'from their perspective') to describe *what each of you communicated*. This allows the mediation to focus on finding a resolution moving forward."
      *   **Sufficient Signoff:** Both parties acknowledge the summary accurately reflects *what they themselves said and presented*, even if they vehemently disagree with the other side's account. They agree it's a fair starting point for mediation.

  **Walking Through the Cases:**

  **Case 1: Landlord (LL) vs. Tenant (T) - Visits & Harassment**

  *   **Step 1 (Accounts):**
      *   *T:* "LL came 17 times in 3 months, often unannounced, banging on the door. I have a log. I feel harassed and watched. Only half had work orders. My peace is destroyed." (Key: Frequency, lack of notice, feeling harassed, log evidence).
      *   *LL:* "I did about 8-10 routine maintenance checks and emergency calls (leak on Feb 1st!). I always give 24hrs notice by email/text. Tenant often ignores me. Work orders exist for scheduled work. I'm just doing my job legally." (Key: Legitimate purpose, notice given, tenant unresponsive, partial documentation).
  *   **Step 2 (Evidence Review):**
      *   Corroborated: Visits occurred on the 8 dates matching LL work orders.
      *   T Supported: Log shows 9 additional visits (no LL documentation).
      *   LL Supported: Emails/texts show notice sent for the 8 work order visits. *No evidence re: notice for other 9.*
      *   Contradiction: T claims no notice for *all* visits. LL claims notice given for *all* scheduled visits (and possibly some others?).
      *   Undocumented: LL's claim that T ignores them; T's claim about "banging"; Specific intent beyond work orders.
  *   **Step 3 (Synthesis - MPS Summary):**
      > "This summary reflects the different perspectives shared by the Tenant (T) and Landlord (LL) regarding the frequency and nature of property visits over a three-month period. It captures their viewpoints and available documentation.
      >
      > **Area of Agreement:** Both parties agree that visits occurred on the following dates: [List the 8 dates with corroborating work orders].
      >
      > **From the Tenant's (T) Perspective:** T reports a total of 17 visits to the property over three months. T states that many visits occurred without prior notice, causing significant distress, anxiety, and disruption to their quiet enjoyment of the home. T has provided a log documenting these 17 visits. T feels the pattern of visits constitutes harassment.
      >
      > **From the Landlord's (LL) Perspective:** LL states their visits were solely for legally required maintenance and emergency response (citing a leak repair on Feb 1st). LL states they provided proper 24-hour notice via email or text for all scheduled visits. LL has provided work orders for 8 visits and communication records showing notice was sent for those visits. LL describes T as often unresponsive. LL states their actions were motivated by fulfilling property management obligations.
      >
      > **Identified Points of Divergence:**
      > 1.  **Frequency:** T reports 17 visits; LL documentation supports 8 visits. T has a log for 9 additional visits not documented by LL work orders.
      > 2.  **Notice:** T states notice was often not provided. LL states notice was provided for all scheduled visits. Communication records show notice was sent for the 8 documented visits; there is no independent documentation regarding notice for the additional 9 visits logged by T.
      > 3.  **Purpose & Experience:** T perceives the frequency and alleged lack of notice as harassing. LL perceives their actions as necessary and lawful property management.
      >
      > **Core Disagreements for Mediation:** The differing interpretations of the adequacy of notice (particularly for visits beyond the 8 documented), the necessity and frequency of visits beyond those with work orders, and the overall characterization of the interactions (harassment vs. necessary maintenance) represent core disagreements where perspectives diverge significantly. These differences in perception and interpretation are central to the dispute."
  *   **Step 4 (Signoff):** Focuses on whether each sees *their own view* accurately captured. LL might grumble about the "harassment" word, but it's qualified as *T's perception*. T might want to remove LL's "unresponsive" claim, but it's qualified as *LL's statement*. The neutral framing of the divergences ("differing interpretations," "perspectives diverge") makes it palatable as a starting point.

  **Case 2: Business Partners (A & B) - The Bar Handshake Deal**

  *   **Step 1 (Accounts):**
      *   *Partner A:* "We met at [Bar] on [Date] after work. We had 3 drinks each, but we were fine. We discussed expanding into [Area]. We shook hands firmly and said 'Let's do this! It's a deal!'. That's binding. We've worked together for years; handshakes mean something. Now he's backing out." (Key: Binding agreement, explicit words ("deal"), context acceptable, handshake significance).
      *   *Partner B:* "We had a few drinks and brainstormed ideas over wings. Threw around the [Area] idea. Nothing specific – no numbers, no timelines, no responsibilities discussed. We said 'This could be cool' or 'Yeah, maybe'. A handshake at the end of a friendly chat doesn't mean a binding contract, especially after drinks with zero specifics. It was just talk." (Key: Informal brainstorming, lack of specifics, non-binding, context (drinks) relevant).
  *   **Step 2 (Evidence Review):**
      *   Corroborated: Meeting occurred at [Bar] on [Date]. Alcohol consumed (number disputed). Topic of expanding to [Area] discussed. Handshake occurred.
      *   Singly-Documented/Undocumented: *No* documentation of the conversation (recordings, notes). No follow-up emails/texts referencing a "deal." Differing recollections of specific words spoken ("Let's do this! It's a deal!" vs. "This could be cool").
      *   Contradiction: Nature of the agreement (binding contract vs. informal talk).
  *   **Step 3 (Synthesis - MPS Summary):**
      > "This summary reflects the different perspectives shared by Partner A and Partner B regarding a conversation at [Bar] on [Date] concerning the potential expansion of their business. It captures their viewpoints.
      >
      > **Area of Agreement:** Both partners agree they met socially at [Bar] on [Date], consumed alcohol (though the exact amount may differ in recollection), discussed the possibility of expanding their business into [Area], and ended the meeting with a handshake.
      >
      > **From Partner A's Perspective:** A states that during this conversation, a clear and binding agreement to expand the business into [Area] was reached. A recalls explicit language such as "Let's do this!" and "It's a deal!" being used, accompanied by a firm handshake. A believes that within their established business relationship and partnership, such a handshake constitutes a binding commitment, regardless of the social setting or consumption of alcohol. A feels Partner B is now reneging on this agreement.
      >
      > **From Partner B's Perspective:** B states the conversation was informal brainstorming and exploration of possibilities. B recalls the discussion lacking specific details such as financial commitments, timelines, or division of responsibilities, and characterizes the language used as more tentative (e.g., "This could be cool," "Maybe"). B states that the handshake was a friendly gesture concluding the conversation, not an indication of a formal, binding contract, especially given the social context and consumption of alcohol. B perceives no concrete agreement was made that night.
      >
      > **Identified Points of Divergence:**
      > 1.  **Nature of the Agreement:** A perceives a binding contractual agreement was formed. B perceives only informal, non-binding discussion occurred.
      > 2.  **Specifics Discussed:** A recalls discussion reaching a concrete "deal." B recalls only high-level ideas without essential details (finances, timelines).
      > 3.  **Language Used:** Differing recollections of the specific words spoken at the conclusion.
      > 4.  **Significance of Context:** Differing interpretations of the impact of the social setting and alcohol consumption on the seriousness/intent of the conversation.
      > 5.  **Meaning of the Handshake:** Differing interpretations of what the handshake signified within their relationship and the context.
      >
      > **Core Disagreements for Mediation:** The fundamental disagreement centers on whether a legally and practically binding agreement was formed during the bar conversation on [Date]. The differing perceptions of the conversation's substance, the language used, the significance of the context, and the meaning of the handshake represent core, potentially irreconcilable differences in interpretation that are central to this dispute."
  *   **Step 4 (Signoff):** The summary meticulously avoids declaring if a deal was made. It presents A's *belief* it was binding and B's *belief* it wasn't, along with their supporting reasons (words, context, handshake meaning). The "potentially irreconcilable differences" flag sets realistic expectations for mediation. Signoff focuses on accuracy of *their own stated position*.

  **Why this works for mediation:**

  1.  **Defuses Defensiveness Early:** Parties hear their perspective validated *first* in the readback. They don't feel silenced.
  2.  **Builds Shared (Minimal) Reality:** Starting with agreed facts, however small, creates a tiny foundation.
  3.  **Names the Divergence Neutrally:** Framing the core conflict as a "difference in perspective" or "differing interpretation" is less threatening than "you're wrong."
  4.  **Syādvāda Provides Safety:** Qualifiers ("states," "reports," "recalls," "perceives," "from X's perspective") protect the mediator and make the summary accurate without endorsing either truth claim.
  5.  **Focuses the Mediation:** The "Core Disagreements" section explicitly tells everyone what needs to be discussed. The "Judgment Call" flag warns where compromise is needed.
  6.  **Efficient:** The structure forces focus on key events, impacts, and divergences, preventing meandering narratives.
  7.  **Creates a Foundation:** Parties sign off on *the process* (that their view is fairly represented) before tackling the *substance* of their conflict. This increases buy-in.

  This procedure leverages the Jain insights pragmatically, turning philosophical nuance into a concrete tool for managing conflictual realities in mediation. Good luck!
