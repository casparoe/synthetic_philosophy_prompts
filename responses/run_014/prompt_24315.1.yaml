  We are grading a student's answer on Parfit's hitchhiker. The question asks to explain why the case shows that a strictly self-interested decision procedure can be self-defeating, and to be precise about the difference between (i) what it is rational to have as a stable disposition and (ii) what it is rational to do at the moment of decision, and which of these the case undermines.

  The student's answer makes several claims. We break down the answer into major claims and evaluate each.

  Claim 1: The student describes the scenario and how the driver's self-interested reasoning leads to the worst outcome.
  - Verdict: Correct. The student accurately describes the scenario: the driver, being transparent and unable to bluff, is not rescued because the rescuer knows he will renege, leading to the driver being stranded.

  Claim 2: The student states that the point is about dispositions and that having a stable disposition to keep promises (even when costly) would have been better because it would have led to rescue.
  - Verdict: Correct. This captures the idea that having a stable disposition (which is self-denying at the moment of action) can be beneficial in the long run.

  Claim 3: The student claims that the strictly self-interested procedure is self-contradictory because it leads to the worst outcome, so a fully rational agent shouldn't follow it at all.
  - Verdict: Partially Correct. The self-interested procedure is self-defeating in this case, but the student's reasoning that the agent "shouldn't follow it at all" is too strong. The case is meant to show that in some situations, a purely self-interested agent might be worse off, but it does not imply that self-interest is always self-defeating. Also, the student says the driver's decision to renege was irrational, but from a moment-by-moment self-interested perspective, reneging is the rational choice (since paying is costly). The irrationality is at the level of the overall decision procedure, not the particular action.

  Claim 4: The student argues that because the driver is transparent and can't bluff, the disposition must be real and cannot be faked, which is why the case is about the rationality of the disposition rather than the moment of choice.
  - Verdict: Correct. This is a key point: the transparency makes it impossible to fake the disposition, so the only way to get rescued is to actually have the disposition.

  However, note that the student does not explicitly address the difference between (i) and (ii) as requested. The question asks to "be precise about the difference between (i) what it is rational to have as a stable disposition and (ii) what it is rational to do at the moment of decision, and say which of these the case is meant to undermine."

  The student does talk about dispositions and the moment of choice, but they do not explicitly state the difference and which one the case undermines. The student implies that the case is about the rationality of the disposition (undermining the moment-by-moment self-interested action) but does not clearly contrast the two.

  Moreover, the student says: "the driver's decision to renege was the irrational move -- if he had just been rational, he'd have kept the promise and gotten rescued." This is incorrect in the context of the moment of decision. At the moment of decision (after being rescued), keeping the promise is costly and does not benefit the driver (since the rescue is already done). So, from a self-interested perspective at that moment, reneging is rational. The irrationality is at the level of the disposition: it would have been better to have a disposition that would lead to keeping the promise, but that disposition would cause the agent to act against self-interest at the moment.

  Therefore, the case is meant to undermine (ii): what it is rational to do at the moment of decision, by showing that if one always does what is rational at each moment (self-interestedly), one may end up worse off. The alternative is to have a stable disposition that sometimes leads to actions that are not self-interested at the moment but are beneficial in the long run.

