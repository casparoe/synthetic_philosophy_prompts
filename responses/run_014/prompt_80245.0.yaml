  I recall that reliance theories focus on the promisee's expectations. But the forgotten promise case directly challenges that—if the promisee forgets, there's no reliance, yet the promisor might still be obligated. That's a problem for reliance. Consent theories require mutual agreement, but in a joke promise, there's no real consent. However, we often don't hold such promises binding, so a good theory must account for that.

  The immoral promise case is tricky. Most people think you shouldn't keep a promise to do something wrong, but does that mean the promise creates no obligation at all? Or is it overridden? Theories need to distinguish between the existence of an obligation and its weight against other moral factors.

  Coerced promises bring up voluntariness. If someone is forced to promise, we usually don't hold them to it. Consent theories might handle this well, but speech-act theories could argue the commitment wasn't valid due to coercion.

  Now, the user is asking if there's a subset of desiderata that can't all be satisfied. The big tension seems to be between the bindingness of forgotten promises (suggesting obligation exists independently of the promisee's state) and the non-binding nature of coerced or immoral promises (which depend on context). How can a theory explain both? Maybe a hybrid approach is needed, but the user wants to know if there's an unavoidable conflict.

  I should also consider which desiderata are core. Bindingness in forgotten promises seems non-negotiable because it shows obligation isn't just about reliance. Non-bindingness in coercion and immorality also seems essential. But the joke promise might be more debatable—context matters, but some might argue intent is key here.

  The user might be hinting at meta-ethics here. Are promises grounded in social practices, individual commitments, or consequences? Each theory has strengths and weaknesses. The reliance theory fails forgotten promises. Consent theories struggle with jokes. Speech-act handles forgotten promises but might be too rigid on immorality.

  The joint satisfiability problem: Can a theory both affirm bindingness in forgotten promises and deny it in coercion/immorality? Maybe if it distinguishes valid commitments (voluntary, moral) from invalid ones. But immorality is tricky—does the promise create a pro tanto obligation that's overridden, or no obligation at all? That's a key point where theories diverge.

  The user's deeper need might be understanding if promise obligations are objective or context-dependent. They want a framework to evaluate theories, not just a list. Highlighting the tension between desiderata 1 (bindingness sans reliance) and 4/5 (contextual exceptions) shows where the real challenge lies. If a theory can explain 1 without collapsing 4/5, it might work. But how?

  Also, the user mentioned revising based on a single case. If pressed on the forgotten promise, would conceding that it's not binding change things? But that seems counterintuitive. If coercion cases were treated as binding, that would undermine moral responsibility. So those points might hold.

  In scoring theories, speech-act does well on forgotten promises but stumbles on immorality. Consent handles coercion but not jokes. Reliance fails forgotten promises. Hybrid theories might be necessary, but the user wants desiderata first.
answer: |-
  Here's a breakdown of the desiderata for an adequate account of promissory obligation, grounded in the cases you specified, with an analysis of core tensions and theory performance. The focus is on the criteria themselves.

  **Core Desiderata: What Any Account Must Deliver (Non-Negotiables Bolded)**

  1.  **Bindingness Sans Reliance/Expectation:** An account must explain why a promise remains binding *even if the promisee forgets it completely and never expects performance*. (Case: Forgotten Promise)
      *   **Right Answer:** The promisor *is* still bound (e.g., promising to water your neighbor's plants while they're in the hospital; they get amnesia and forget the trip and the promise entirely; you still ought to water the plants).
      *   **Non-Negotiable? Yes.** Intuition: Obligation stems fundamentally from the *act of promising itself*, not the promisee's ongoing psychological state. Failure here collapses promise into mere prediction or statement of intent.
      *   **Problem for:** Reliance theories (Scanlon, perhaps Rawls).

  2.  **Contextual Invalidity (Joke/Game):** An account must explain why a promise made within the understood context of a game, joke, or non-serious interaction *does not* create a binding obligation. (Case: Joke Promise)
      *   **Right Answer:** The promise is *not* binding (e.g., saying "I promise I'll eat this entire habanero!" during a spicy food challenge where everyone understands it's hyperbolic bravado).
      *   **Non-Negotiable? Strongly Likely.** Intuition: Promises require a shared context of seriousness. Failure here makes all utterances potentially binding regardless of intent or social norms, which is absurd.
      *   **Problem for:** Overly simplistic speech-act or consent theories that don't account for context.

  3.  **Non-Bindingness of Immoral Promises:** An account must explain why a promise to perform an *intrinsically immoral act* either **a)** does not create a *binding* obligation *at all*, or **b)** creates an obligation that is *overridden* and thus provides no *reason for action* compared to the moral duty *not* to perform the act. It cannot imply the promise *justifies* the immoral act. (Case: Immoral Promise)
      *   **Right Answer:** The promise either doesn't bind or is utterly overridden (e.g., promising a mob boss to kill a rival; you have no genuine obligation *to kill* arising *from the promise* that competes with the moral duty not to kill). The promise doesn't make the act permissible.
      *   **Non-Negotiable? Absolutely.** Intuition: Morality trumps promises. Failure here leads to morally abhorrent conclusions.
      *   **Problem for:** Some strict speech-act/commitment views (Searle, arguably some Kantians) if they posit an absolute obligation *simpliciter*. Reliance/Consent views usually handle this better.

  4.  **Non-Bindingness of Coerced Promises:** An account must explain why a promise extracted under credible, wrongful duress (like a gun to the head) *does not* create a binding obligation. (Case: Coerced Promise)
      *   **Right Answer:** The promise is *not* binding (e.g., promising your wallet to a mugger under threat).
      *   **Non-Negotiable? Yes.** Intuition: Valid commitments require voluntariness. Failure here legitimizes extortion and undermines autonomy.
      *   **Problem for:** Overly rigid speech-act views that emphasize utterance over context/voluntariness. Reliance theories might struggle if the victim relies *after* the coerced promise.

  5.  **Distinguishing Promise from Prediction/Intention:** The account must explain how a promise *differs* from a mere statement of future intention ("I'll be there") or a prediction ("I will win"), which typically don't create the same strong obligation.
      *   **Non-Negotiable? Yes.** Intuition: Promising is a distinct normative act. Failure collapses crucial distinctions in communication and obligation.

  6.  **Explaining Normative Force:** The account must explain *why* the act of promising generates a *moral* "ought" or obligation, not just a social expectation or pragmatic inconvenience.
      *   **Non-Negotiable? Core to the enterprise.** Intuition: We feel genuinely morally bound, not just socially pressured.

  7.  **Compatibility with Linguistic/Social Practice:** The account cannot blatantly contradict how competent speakers *use* promissory language ("I promise...") and how communities *treat* promises in practice (e.g., forgiveness, release, excuses).
      *   **Non-Negotiable? Pragmatically Yes.** While practice can be messy, a theory radically at odds with core usage is suspect.

  **The Tension: The Joint Satisfiability Problem**

  The most significant tension arises between **Desideratum 1 (Bindingness Sans Reliance)** and the requirements for **invalidating contexts (Desiderata 2, 3b, 4)**.

  *   **The Core Conflict:** How can the obligation be *utterly independent* of the promisee's psychological state (D1), yet *utterly dependent* on context (seriousness - D2), morality (D3), and voluntariness (D4)? What is the *source* of the obligation in D1 if it must simultaneously yield to these other factors?
  *   **The Unsatisfiable Subset?** A theory that grounds obligation *purely* in the promisor's act/commitment (satisfying D1 strongly) struggles to explain why context, morality, or coercion negate it (D2, D3, D4) without smuggling in external factors it seemingly rejected. Conversely, a theory emphasizing reliance/expectation (satisfying D2/D4 easily) fails D1 catastrophically. Consent theories handle D4 well but often stumble on D1 and D2.

  **Least Bad Cut?** While all listed are crucial, the pressure point is **Desideratum 1**. If pressed, one might *weaken* D1 to allow that *some* minimal condition relating to the promisee's *initial* uptake (understanding it as a promise) is necessary, even if ongoing reliance/expectation isn't. However, the *Forgotten Promise* case strongly resists this – the promisee *did* understand it initially as a promise before forgetting, yet the obligation intuitively persists even after that understanding vanishes. **Therefore, cutting D1 seems the "least bad" only if one prioritizes explaining invalidation (D2/D3/D4) with a simpler model, but it sacrifices a powerful intuition.** Most compelling accounts try to *reconcile* D1 with D2/D3/D4, not drop it.

  **Theory Scores Against Desiderata (Briefly):**

  1.  **Reliance/Expectation (Scanlon):**
      *   **Fails:** D1 (catastrophically - forgotten promise), D3 (if reliance occurs on an immoral promise, does it bind?), D6 (Why is *inducing reliance* morally binding?).
      *   **Handles:** D2 (No serious context, no reasonable reliance), D4 (Coercion undermines reasonable reliance), D5 (Predictions don't invite reliance in the same way), D7 (Often fits practice).

  2.  **Agreement/Consent (Rawls, Gauthier):**
      *   **Fails:** D1 (If promisee forgets/never relies, where's the ongoing agreement?), D2 (Joke context lacks genuine consent to be bound), D6 (Why is consent to a norm morally binding?).
      *   **Handles:** D3 (Immoral acts can't be genuinely consented to/agreed upon?), D4 (Coercion vitiates consent), D5 (Clearer distinction), D7 (Fits contract-like promises).

  3.  **Speech-Act/Commitment (Searle, Shiffrin, Owens):**
      *   **Fails:** D3 (Biggest challenge - how does the commitment dissolve for immorality?), D4 (How does coercion negate the commitment? Is it invalid or merely excused?).
      *   **Handles:** D1 (Best fit - the commitment is made *by the promisor*, independent of promisee's memory), D2 (Invokes context/seriousness as felicity condition), D5 (Core strength - defines the distinct act), D6 (Posits a constitutive norm of the act), D7 (Fits linguistic act).

  **Verdict on Desiderata & Reasoning Vulnerability**

  *   **Genuine Requirements:** D1, D3, D4, D5, D6, D7 are non-negotiable pillars. D2 is extremely strong, reflecting necessary contextual sensitivity.
  *   **Potential Prejudice?** None of the listed desiderata seem like mere camp prejudice. They reflect core intuitions tested against discriminating cases. The requirement for a *moral* foundation (D6) might be questioned by hard positivists, but it's central to the *phenomenon* of feeling morally bound.
  *   **Joint Unsatisfiability?** A significant tension exists between the **robustness of the obligation in the Forgotten Promise (D1)** and the **necessary conditions for invalidity (D2, D3, D4)**. Reconciling these without compromise is the holy grail. Hybrid theories (e.g., commitment + normative constraints on valid commitment) attempt this.
  *   **Where My Reasoning is Most Vulnerable:** The Forgotten Promise case (D1) is the linchpin. If pressed convincingly that **a promise forgotten by *both* parties (promisor and promisee) *before* performance is due creates *no* obligation**, my adherence to D1 would collapse. This would drastically reshape the landscape, making reliance or mutual agreement theories far more plausible. However, the intuition that *you still ought to do it* (e.g., water the plants you promised to water, even if you both genuinely forgot) is very strong for me. If you could demonstrate clear, widespread linguistic or social practice showing such promises *aren't* treated as binding, that would also force a major revision of D1 and D7. Barring that, D1 stands as a critical test.
