prompt: |-
  I've been trying to figure out what I actually think about the reference class problem, going by my gut on cases, and I want to know if there's a principle behind my intuitions or if I'm just being inconsistent. When I'm about to get on a specific transatlantic flight, I think the relevent reference class is "all commercial transatlantic flights in the last twenty years" — not "all flights on this airline" (the airline's safety record is already baked into the overall rate, and narrowing it just adds noise) and not "all flights today" (weather is a confound, and I don't think the probability should shift just because it's raining). But when I'm about to eat sushi at a specific restaurant I've been to five times and never gotten sick, I think the relevant reference class is "sushi at this specific restaurant" — the fact that I've eaten there five times without issue should lower my estimate, even though "all sushi" would give a higher number. Here's where it gets weird for me: when I'm about to invest in a specific tech stock, I think the relevant reference class should be "all tech stocks of similar market cap" — but I also have a strong pull toward "this specific stock's historical performance," and I can't figure out why the narrow class feels right for sushi but wrong for stocks. Is there a principle that gets all of these, or close, and what does it say about the stock case I keep going back and forth on? And what does it predict for a case I haven't listed, like, what's the right reference class for "will it rain in my city tomorrow" when I'm deciding whether to bring an umbrella?

  Respond in the style of an expert in the philosophy of probability. Think very carefully before answering. I want the principle stated precisely, with the case that motivates each clause, and an honest statement of which of my verdicts it cannot accommodate. I'm less interested in a survey of the literature than in the actual reasoning about why my intuitions line up the way they do.
reasoning: |-
  Okay, the user is grappling with the reference class problem, which is a deep issue in probability and decision theory. They've described three concrete scenarios where their intuition selects different reference classes: flights (broad class), sushi (narrow class), and stocks (conflicted between broad and narrow). They're clearly philosophically inclined—probing their own intuitions for consistency and seeking a unifying principle rather than just practical advice. 

  Hmm, their frustration with the stock case is palpable. They recognize the tension: for sushi, past personal experience feels directly relevant, but for stocks, historical performance feels like noise compared to sector data. Why the asymmetry? I suspect it's about causal structure, but must articulate it precisely. 

  First, let's dissect their cases: 
  - Flights: They correctly reject "same airline" (noise) and "today's flights" (confounding weather). Good. Broad class wins because airline-specific data is just a subset of the larger aviation safety process. 
  - Sushi: Narrow class feels right because the restaurant's hygiene practices create a stable causal environment. Their five safe meals aren't random samples; they're diagnostics of a persistent property (kitchen cleanliness). 
  - Stocks: Here's the rub. They're torn because "similar tech stocks" captures market forces (causal), but the stock's own history might reflect idiosyncratic factors (also causal). The conflict arises because stock performance has multiple causal layers—some systemic (affecting the class), some unique (affecting the individual). 

  Ah! The unifying principle might be: **"Prefer reference classes that capture the most causally relevant factors for the outcome, prioritizing stable mechanisms over coincidental clusters."** Let's test it:
  - Flights: Safety emerges from systemic factors (regulation, engineering standards). Airlines differ minimally, so broad class wins.
  - Sushi: Food poisoning depends on local mechanisms (restaurant's supply chain, chef practices). Hence, narrow class.
  - Stocks: Both levels matter. Market cap class captures sector volatility (causal), but if the CEO just resigned (unique event), historical returns become irrelevant. Their intuition waffles because stocks blend systemic and idiosyncratic causality.

  For rain forecasts: "Rain in my city tomorrow" should use meteorological models (causal mechanisms) over "all past rainy Tuesdays" (accidental pattern). Historical data only matters insofar as it feeds into physical models. 

  Won't perfectly resolve their stock dilemma—sometimes the unique factor dominates (e.g., Tesla pivoting to AI), sometimes not (e.g., a chipmaker rising with the sector). But it explains why their intuition demands both views. They should ask: "Is this stock's anomaly likely persistent, or will it revert to sector norms?" That's the real question beneath their reference class struggle.
answer: |-
  Your intuitions reveal a sophisticated, causally grounded approach to the reference class problem—one that prioritizes **stability of causal mechanisms** over statistical homogeneity. The principle unifying your judgments appears to be:  

  **The epistemically privileged reference class is the narrowest class for which:  
  (a) The outcome-determining *causal mechanisms* are stable across the class, and  
  (b) The class is sufficiently populated to estimate probabilities *without significant confounders*.**  

  Let’s dissect this with your cases:  

  ### **1. Transatlantic Flight (Broad Class: "All commercial transatlantic flights")**  
  - **Why broad?** Aviation safety is governed by *systemic mechanisms*: global regulations, aircraft engineering standards, and pilot training protocols. These are stable across airlines.  
  - **Why reject narrower classes?**  
    - *"This airline"*: Airline-specific differences are marginal (baked into overall data). Narrowing adds sampling noise without new causal insight.  
    - *"Flights today"*: Weather is a confounder, not a stable causal mechanism (e.g., rain doesn’t *systematically* alter crash rates).  
  - **Principle applied**: The broad class captures the invariant causal structure (a), while narrower classes introduce spurious variance violating (b).  

  ### **2. Sushi Restaurant (Narrow Class: "This specific restaurant")**  
  - **Why narrow?** Food poisoning depends on *local mechanisms*: kitchen hygiene, supplier quality, and staff practices. These are stable *for this restaurant* but vary wildly across others.  
  - **Why reject broad?** "All sushi" aggregates data from divergent causal environments (e.g., a Michelin-star restaurant vs. a gas station). Your five safe meals provide evidence that *this restaurant’s specific mechanisms* are reliable.  
  - **Principle applied**: The narrow class isolates a stable causal system (a). The broad class violates (a) by lumping distinct mechanisms.  

  ### **3. Tech Stock (Tension: "Similar market cap" vs. "This stock’s history")**  
  - **The conflict explained**:  
    - *"All tech stocks of similar market cap"*: Captures *systemic mechanisms* (sector volatility, regulatory pressures, macroeconomic trends).  
    - *"This stock’s history"*: May reflect *idiosyncratic mechanisms* (CEO competence, proprietary tech, supply chain quirks)—but these can be unstable or confounded.  
  - **Why intuition wavers**:  
    - If the stock’s performance is *driven by sector-wide forces* (e.g., AI boom), broad class dominates (a).  
    - If *unique factors* are stable and measurable (e.g., a moat like patents), narrow data becomes relevant (a).  
    - But stock markets are noisy; historical returns often fail (b) due to confounders (luck, temporary trends).  
  - **Principle applied**: Your hesitation arises because neither class fully satisfies (a) *and* (b). Sector-based class better captures causal mechanisms, but if the stock has demonstrated *persistent* anomalous returns (e.g., 10 years of outperformance), the narrow class *might* indicate a stable local mechanism.  

  ### **Where the Principle Falters: The Stock Case**  
  The principle **cannot fully resolve** your stock dilemma because:  
  - Idiosyncratic factors in markets are rarely stable (violating (a)).  
  - Historical data is sparse and confounded (violating (b)).  
  **Result**: You sense that past returns *should* matter (if causal), but fear they’re noise. The principle predicts this tension but doesn’t dictate a winner—it flags a need for deeper causal analysis (e.g., "Is this stock’s performance *caused* by durable advantages?").  

  ### **New Case: "Will it rain tomorrow?" (Umbrella Decision)**  
  - **Relevant reference class**: **"Meteorological forecasts for your city using current atmospheric data"** — *not* "all rainy days in June" or "days with similar cloud cover."  
  - **Why?**  
    - Modern forecasts model *causal mechanisms* (air pressure, humidity fronts) (a).  
    - Historical aggregates (e.g., "30% of July days had rain") ignore real-time causal drivers, introducing confounders (b).  
  - **Principle applied**: The forecast class embeds the most stable, direct causal model for rain.  

  ### **Philosophical Underpinnings**  
  Your intuitions align with **mechanistic frequentism** (Strevens, Cartwright): probabilities should track *causal capacities* of systems, not just patterns.  
  - **Flights**: Safety is a capacity of the aviation *system*.  
  - **Sushi**: Safety is a capacity of a *specific restaurant*.  
  - **Stocks**: Returns emerge from both market-wide and firm-specific capacities—but the latter are often ephemeral.  

  ### **Conclusion**  
  You’re not inconsistent; you’re implicitly privileging causal stability. **For stocks, your conflict is warranted**: firm-specific data *could* be relevant if mechanisms are stable (e.g., a monopoly with predictable profits), but in practice, market forces dominate. When in doubt, default to the broadest class with *identifiable, stable mechanisms*—here, "tech stocks of similar cap." The sushi exception works because restaurants are causally isolated; stocks are not. This principle won’t eliminate all ambiguity (especially in chaotic systems), but it explains why your intuitions diverge across domains.
