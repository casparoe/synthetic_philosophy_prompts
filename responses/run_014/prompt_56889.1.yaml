prompt: |-
  I am a TA for a second-year proofs course, and in three weeks I have a single seventy-five-minute section on non-constructive existence proofs. In lecture the students will have just met the two-case argument that some pair of irrationals has a rational power, without anyone saying which pair, and the six-people Ramsey argument; my section is supposed to consolidate the idea that a proof can establish that something exists while leaving you unable to point at it. I have decided to build the entire session around the strategy-stealing argument in positional games rather than treating it as one more example in a survey, because it is the case where the gap between knowing and doing is most vivid. There are twenty-six students. All have done induction, contradiction, contraposition, and the pigeonhole principle; none has taken game theory or graph theory. Two of them play serious competitive chess and one runs the board-game society, so I expect a couple of them to arrive confident that they already know what a winning strategy is and how you would find one. I have a whiteboard, a document camera, and about thirty printed 7×7 Hex boards with two colours of counter. What I want from you is not an explanation of the argument — I know it — but a plan for explaining it, and I want the plan to make the dependency structure explicit: which pieces genuinely cannot be stated until some other piece is in place, as opposed to a list of topics arranged in the conventional order. Please do not send me any readings, references, or suggested sources; I only want the pedagogy and the conceptual sequencing.

  On ordering and on the example. My instinct is to have them play in pairs for ten minutes before I say anything at all, so that they feel the impossibility of constructing a winning strategy before being handed a proof that one exists; but I worry that pairs will finish convinced the game is a draw, and the fact that Hex cannot be drawn is exactly the thing I cannot prove to them at this level. Tell me whether to open with play, with a game they already know cold, or with an explicit failed construction attempt on the board, and tell me what to concede openly about the no-draw property and what to simply assume in front of them. Then: which single game should carry the whole session, and what must that example have and lack in order to do the work? I have been going back and forth between Hex, ordinary 3×3 tic-tac-toe, where the argument yields only the weaker conclusion that the first player can force at least a draw, and Chomp, which appeals to me because the opening move that gets stolen is intuitively a terrible one. But I am not sure Chomp is running on the same rail at all: in Hex the licence seems to be that an extra stone of your own can never hurt you, whereas in Chomp the stolen move is the corner square, which is swallowed by every possible reply, so the extra material is never a genuine liability in the first place. Settle that for me, say whether those are two species of one argument or two different arguments wearing the same name, tell me which example to commit to, and identify the smallest change to that example that would make the argument fail. I would also like your view on whether the swap rule that real Hex players use to offset the first-player advantage is such a breaking change, or is itself a fresh application of the same trick.

  On the misconception map, which is the part I most need. I am already predicting these, and I want to know at which point in the sequence each should be headed off rather than corrected at the end: that the argument tells you how to play, so that a student who has followed it should be able to answer the question of where to put the third stone; that the strategy is literally copycat, with the whole thing collapsing the moment the mirrored cell is already occupied, because they do not see that the fallback of playing any free cell is available and, more importantly, harmless only under the monotonicity condition; that the conclusion is the first player wins at tic-tac-toe, conflating the second player has no winning strategy with the first player does in a game that admits draws; and that the argument is symmetric, so that the second player could equally steal the first player's strategy — I want a crisp way to show them exactly where the asymmetry is being used, since I suspect the free extra turn is doing all the work and they will not notice. I also expect someone to say that we were told a proof has to construct its object, and someone else to want to apply the argument to backgammon or poker. Give me a rough minute allocation across the session, one moment of genuine surprise, because my supervisor wants this section to function as recruitment for the combinatorics option, one closing question that will tell me whether the idea landed rather than merely entertained them, together with the two or three distinct wrong answers it might draw and what each of those would reveal about where the sequence failed, and finally a list of what I should deliberately leave out and announce as deferred — the topological argument that Hex cannot be drawn, determinacy for finite games of perfect information, Maker–Breaker theory, the complexity of finding the strategy, and how large a board an explicit winning strategy is actually known for — distinguishing the items worth naming and deferring from the ones I should simply not raise.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a TA preparing a session on non-constructive existence proofs using positional games. The main goal is to make students grasp that a proof can show existence without providing a concrete example. The user has specific concerns about sequencing, misconceptions, and choosing the right game.

  First, I need to address the opening activity. The user is torn between starting with gameplay, using a known game, or a failed construction. The risk with Hex is that students might think it's a draw. Since proving no-draw isn't feasible at their level, it's better to assume it. Starting with tic-tac-toe makes sense because students already know it. They can see the first player can force a draw, which sets up the contrast for Hex where a draw isn't possible. Using tic-tac-toe first avoids confusion and leverages prior knowledge.

  Next, choosing the main game. Hex is ideal because the strategy-stealing argument is clean, and the no-draw property is crucial. Chomp might confuse students because the stolen move (corner) is beneficial, which isn't as straightforward. The monotonicity in Hex (extra stone never hurts) is easier to grasp. The smallest change that would break the argument is if adding a stone could be a disadvantage, which isn't the case in Hex.

  For misconceptions, the key is timing. The "argument tells how to play" misconception should be addressed early. After stating the theorem, emphasize that the proof doesn't help in actual gameplay. The copycat fallacy can be handled during the strategy-stealing explanation by showing that when the mirrored cell is occupied, the fallback move is harmless due to monotonicity. Asymmetry is critical; highlight that the extra turn is what prevents the second player from stealing the strategy. Use a tic-tac-toe example to show that the first player can force a draw, but not necessarily a win, contrasting with Hex where no draw exists.

  The minute allocation needs to be efficient. Spend the first five minutes on tic-tac-toe to establish the concept of forcing outcomes. Then move to Hex, explain the rules and no-draw assumption. Let them play briefly to feel the complexity. The surprise moment comes when revealing that the second player can't have a winning strategy without constructing one. The closing question should test if they understand non-constructiveness, like "What's the first player's winning move?" Wrong answers would reveal if they missed the proof's point.

  Defer complex topics like the topological proof of no-draw or determinacy. Mention them briefly to pique interest for combinatorics but avoid derailing the session. Emphasize that the strategy's existence is known, but finding it is hard, which is the core takeaway.

  Overall, the structure should flow from known concepts (tic-tac-toe) to Hex, addressing misconceptions at each step, using concrete examples to highlight non-constructiveness, and carefully timing explanations to build understanding without overwhelming students.
answer: |-
  Here’s a pedagogical plan focused on conceptual sequencing, misconception prevention, and maximizing impact. The strategy-stealing argument is fragile if dependencies aren’t explicitly layered, so this sequence isolates each logical step.

  ---

  ### **Core Structure & Timing (75 min total)**
  1. **Tic-Tac-Toe Warm-Up: Forcing Outcomes (10 min)**  
     - *Do:* Project 3×3 tic-tac-toe. Ask: *"Can the first player force a win? Force a draw?"*  
     - *Show:* First player places X in center. Case 1: If O plays corner, X plays opposite corner → forces draw. Case 2: If O plays edge, X threatens two wins → forces win.  
     - *Key Point:* We *constructed* a strategy. **Concession:** "We built it step-by-step. Today, we’ll prove existence *without* construction."

  2. **Hex Setup: Rules & Critical Assumption (8 min)**  
     - *Do:* Distribute Hex boards. Demonstrate rules: Red connects left-right, Blue top-bottom, no draws. **Explicitly state:** "Assume no draw is possible (to be justified later)."  
     - *Play:* Pairs play 2–3 quick games (5 min max). **Stop before conclusions form.**  
     - *Why this first?* Students *feel* the game’s complexity but lack proof it’s not a draw. Preempts "draw belief" by making assumption explicit upfront.

  3. **Theorem Statement & Non-Constructive Hook (2 min)**  
     - *Write:* "Theorem: In Hex, first player has a winning strategy."  
     - *Emphasize:* "We’ll prove this *without knowing a single move* of the strategy."

  ---

  ### **Strategy-Stealing Argument (30 min)**  
  *Sequence dependencies (must follow this order):*  
  1. **Define "Winning Strategy" (3 min)**  
     - *Ask:* "What does a winning strategy guarantee?" → Correct: "A move for every opponent reply leading to win."  
     - *Prevent symmetry misconception:* Stress "**for every reply**" – no wiggle room.

  2. **Assume Second Player Has Winning Strategy S (5 min)**  
     - *Write:* "Assume Blue (second player) has winning strategy S."  
     - *Ask:* "If Red (first) steals S, what breaks?" → Guide to: "Red needs to *mirror* Blue, but Red moves first."

  3. **The Extra Move (10 min)**  
     - *Do:* Document camera: Red plays **anywhere** (say, center). Then Blue responds per S. Red now "becomes Blue" and uses S against Blue.  
     - *Critical dependency:* **Monotonicity must be established first.** Ask: "If Red adds an extra stone, could it *hurt* Red?" Visualize: Extra red stone only helps connect. State: "Hex is monotonic – your stones never harm you."  
     - *Fallback clarification:* Show a board where mirrored cell is occupied. "Red plays anywhere freely (monotonicity makes this safe), then continues with S."  
     - *Why not Chomp?* Chomp’s "bad move" (corner) is a distraction. Hex’s monotonicity is intuitive (extra stone = helpful). Smallest change to break: If a move could *block* your own path (e.g., in a variant where stones can be "moved"), argument fails.

  4. **Contradiction (2 min)**  
     - *Conclude:* Red wins using S *and* has an extra stone → contradiction. Thus, S cannot exist → first player wins.

  ---

  ### **Misconception Mitigation Map**  
  | Misconception | When to Address | How |
  |---------------|----------------|-----|
  | "Proof tells how to play" | Immediately after theorem | "The proof gives *zero* information about moves. If you ask me ‘Where should Red play?’, I shrug." |
  | "Copycat requires empty board" | During fallback move | Physically place a counter on "mirrored" cell: "Red plays elsewhere → board is still ‘better’ for Red." |
  | "Second player can steal too" | During extra move | **Asymmetry spotlight:** "Blue *never gets the extra move*. Red plays first → Blue can’t initiate the steal." |
  | "Applies to poker/backgammon" | After proof | "This requires perfect information, no chance, and monotonicity. Poker has hidden cards; backgammon has dice." |
  | "Proofs must construct objects" | During wrap-up | Contrast tic-tac-toe (constructive) and Hex (non-constructive): "Both valid; existence ≠ blueprint." |

  ---

  ### **Pacing & Impact**  
  - **Genuine Surprise (min 25):** After assuming Blue has strategy S: "So Red’s first move is... *arbitrary*? And *that’s enough* to steal?" Faces will show disbelief.  
  - **Swap Rule (3 min):** Mention: "Real players use ‘swap rule’: After first move, second player chooses colors. Why?" Let them reason: It’s *another* non-constructive argument! "First player *must* have a winning strategy, so if they play optimally, second player swaps to steal it."  
  - **Closing Question (5 min):** *"We know Red wins 7x7 Hex. What is Red’s first move?"*  
    - **Wrong answer 1:** "Center!" → Missed non-constructiveness.  
    - **Wrong answer 2:** "It doesn’t matter!" → Almost: but misses that some moves *might* lose (proof doesn’t show *all* moves win).  
    - **Right idea:** "The proof doesn’t say – it could be anywhere, but we can’t prove which one."  
  - **Deferred Topics (3 min):**  
    - **Name & defer:** Topological no-draw ("deep but exists"), explicit strategies for small boards ("known for 9x9, but messy").  
    - **Do not raise:** Determinacy, Maker-Breaker, complexity – too many new terms.

  ---

  ### **Why Hex Over Alternatives**  
  - **Tic-tac-toe:** Proves "first player forces draw" via construction. Weak for non-constructiveness.  
  - **Chomp:** Stealing the corner *is* counterintuitive (feels like a sacrifice). Hex’s "extra stone always helps" is transparent.  
  - **Hex embodies the gap:** Winning strategy exists for 7×7, but no human knows it. The argument fails if monotonicity is broken (e.g., a "suicide" move).

  ---

  ### **Final Script Snippet**  
  At contradiction: "Red has a winning strategy... but we *stole* Blue’s strategy and added a free move. So Blue’s strategy can’t exist. Thus, Red must have one – and we did this *without ever finding a single Red move!*"  

  This isolates non-constructiveness as the climax. The swap rule then hints at the argument’s versatility, leaving them with the unsettling power of existence proofs.
