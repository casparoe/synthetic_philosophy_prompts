  The pivotal feature is the qualitative gap between burden types. If all burdens were identical (say, 1,000 mild paralysis cases vs. one severe), contractualism might permit aggregation per Scanlon's "similar complaints" clause. But here, severity difference blocks that.

  For the reply: Scanlon would note that the paralysis isn't certain death—it's "merely" severe disability—so the admin could argue the child retains a worthwhile life. But this feels weak; the pain patients' cumulative suffering still seems weightier. Honestly? The reply fails. It exposes contractualism's real cost: refusing aggregation sometimes forces absurd sacrifices for principle.

