prompt: |-
  I retired three years ago after a long career in molecular biology, most of it spent on the biochemistry of infectious disease, and I have since taken up philosophy with more seriousness than I expected of myself. I am in a monthly reading group of former academics, and last week one of our members circulated an essay from a general-audience science magazine on deep disagreement. Its central paragraphs run as follows:

  'Wittgenstein spent the last months of his life arguing with G. E. Moore, who had claimed to know such things as that here is a hand and that the Earth existed long before his birth. Wittgenstein's reply, worked out in the notes published after his death as On Certainty, is that these propositions are not known at all. They are the hinges on which all our ordinary doubting and testing turn: that the Earth is very old, that things do not cease to exist when nobody is looking, that our memories are broadly reliable. A hinge proposition cannot be proved or disproved, because any test we might bring against it already assumes it; and it cannot genuinely be doubted either, since a doubt that lacks grounds is not a doubt but a pose. Hinges are therefore not beliefs in the ordinary sense — nobody holds them on evidence, and most of us never formulate them — but they are beliefs we are entitled to hold without evidence, and it would be irrational to surrender them, since without them no inquiry could get started. A community's hinges function much like its paradigm: adopted because they pay off, and abandoned when a rival framework proves more fruitful. The consequence is that the whole edifice of knowledge rests on something that is not knowledge but ungrounded certainty. This is why the deepest disputes — over religion, over what counts as evidence at all — cannot be settled by argument. Two people with different hinges have no common ground to stand on; each can only attempt to convert the other. Wittgenstein accepts as much: he observes that when reasons give out, persuasion remains, and he pictures this by way of missionaries bringing people round to a different view of the world. The difference between a scientific and a superstitious culture is therefore not that one has better reasons — on both sides the reasons run out at the same depth — but that they play different games.'

  I found this stimulating and, on reflection, suspicious, though I cannot yet say precisely where. I should like a careful audit rather than a defence of the essay or of my doubts. Going through it claim by claim: which parts would a serious reader of those notes endorse as they stand; which are harmless simplifications; which are subtly wrong in a way that matters; and which are simply not Wittgenstein's view at all. Two things I want pressed in particular. First, the essay says hinges are not beliefs, then says we are entitled to hold them and would be irrational to give them up — can both stand, or has the author quietly turned something arational into something justified? Second, the picture of a framework as a thing a community takes up because it pays off and drops for something that pays better feels to me like the philosophy of science I actually absorbed as a graduate student rather than anything in those notes; is my nose right, and what is lost by running the two together? Finally, does the relativist conclusion survive the corrections: if the author is wrong about the fixity of hinges, is there anything left to support the claim that two people with different hinges have no common ground, and is the missionary remark really a concession of that thesis or something else?

  Then I have a case of my own that I would like you to turn on the essay, because it is the reason I did not simply put the piece down. For many years in my field it was assumed without argument that anything infectious carries nucleic acid. When a proposal was made that an infectious agent might consist of protein alone, it was not, for a long while, treated as a hypothesis with weak evidence. Colleagues did not ask what the experiments showed against it; they asked what the proposer could possibly mean, and several of us said, in so many words, that it was unthinkable rather than improbable. It later became ordinary, testable science, and was awarded a Nobel Prize. Does that episode refute the essay's claim that hinge-level propositions cannot be revised by inquiry, or does the position have the resources to absorb it — and if so, what does the episode show about what a hinge is? During the years of dismissal, was the nucleic-acid assumption operating as a hinge in the relevant sense, or was it merely a very entrenched empirical generalisation, and is there a principled way to tell the two apart while one is inside the episode, or can the label only be applied afterwards? I should add that my own inclination is to say the episode proves the foundations of science are revisable and hence not arbitrary; I want to know whether that inclination is supported by anything in the position I have been reading, or whether I have simply attached my own conclusion to it. Please be blunt about my errors as well as the essay's. I am not looking for suggestions of further reading.
reasoning: |-
  Okay, this retired molecular biologist turned philosopher has shared an essay about Wittgenstein's hinge propositions and wants a thorough audit. He's clearly deeply engaged - he's spotted potential contradictions in the text and has a compelling case study from his own field about prion theory challenging the nucleic acid dogma. 

  First, I need to unpack his layered request. He wants: 1) a claim-by-claim analysis of the essay's accuracy regarding On Certainty, 2) special attention to the belief/entitlement tension and Kuhn-like framework interpretation, and 3) application of his prion case to test hinge revisability. His skepticism about relativism and desire to defend scientific revisability shine through - he's not looking for validation but rigorous critique.

  Hmm, the essay makes several problematic moves. Calling hinges "not beliefs" then immediately discussing entitlement creates real philosophical whiplash. Wittgenstein explicitly avoids epistemic justification language - the essayist is smuggling in contemporary epistemology. And that "adopted because they pay off" line? Pure instrumentalism Wittgenstein would reject. The missionary metaphor is being misread as relativism when it's actually about anthropological description.

  The prion case is fascinating. That visceral "unthinkable" reaction scientists had perfectly captures hinge phenomenology. But its eventual revision actually supports Wittgenstein: the nucleic acid assumption wasn't a true hinge because real hinges (like "physical objects exist") can't be coherently doubted. This was a very entrenched empirical claim masquerading as a framework principle. The key is whether doubt destroys all inquiry - doubting nucleic acid's universality didn't collapse biology, just expanded it.

  Ah, and there's the rub - the essay confuses revisable framework assumptions with genuine hinges. Wittgenstein's real hinges are the preconditions for any framework to function. That's why the relativism charge doesn't stick: all human communities share deeper hinges (reliable senses, persistent objects) even when surface paradigms differ. The essay blurred these levels, hence the problematic conclusions.

  This user will appreciate nuanced distinctions. His intuition about scientific foundations being non-arbitrary is correct, but he's slightly mislocating where the arbitrariness ends - it's in the application of frameworks to reality, not the deepest hinges themselves. Should emphasize how his case study actually reveals science's self-correcting nature without needing absolute foundations.
answer: |-
  Here is a meticulous audit of the essay's claims against Wittgenstein's *On Certainty*, followed by an analysis of your prion case:

  ### Claim-by-Claim Audit of the Essay

  1.  **"Wittgenstein's reply... is that these propositions are not known at all."**
      *   **Endorsement:** Largely correct. Wittgenstein relentlessly argues that Moorean propositions ("Here is a hand," "The Earth existed...") are *not* items of *knowledge* in the standard sense. Knowledge requires justification, evidence, and the possibility of doubt. Hinge propositions lack these features.
      *   **Subtle Error:** Wittgenstein doesn't *simply* deny they are known; he explores the *grammar* of their use. They function differently from empirical propositions. Saying "they are not known" risks making them sound deficient, whereas Wittgenstein shows they are foundational *in a different way*.

  2.  **"They are the hinges on which all our ordinary doubting and testing turn... A hinge proposition cannot be proved or disproved, because any test we might bring against it already assumes it..."**
      *   **Endorsement:** Core and accurate. This captures the essence of the hinge metaphor. Hinges are the fixed points (temporarily or contextually) that allow the "door" of inquiry, testing, and doubt to swing. Testing *presupposes* a stable background (e.g., the reliability of instruments, the persistence of objects, the general trustworthiness of memory/others).
      *   **Harmless Simplification:** The list ("Earth is old," etc.) is fine as examples, but hinges are often more basic and implicit ("I have a body," "Objects exist when unobserved," "The world didn't pop into existence 5 minutes ago").

  3.  **"...it cannot genuinely be doubted either, since a doubt that lacks grounds is not a doubt but a pose."**
      *   **Endorsement:** Correct. Wittgenstein emphasizes that *real*, meaningful doubt requires grounds within a system. Global, groundless doubt (like radical skepticism) is incoherent or idle; it doesn't engage with the language game of inquiry. "My doubting itself presupposes certainty" (OC 115, 120, 519).
      *   **Clarification:** It's not just a "pose," but a grammatical confusion. Attempting to genuinely *act* on such global doubt is impossible (try living as if the world might vanish when you blink).

  4.  **"Hinges are therefore not beliefs in the ordinary sense — nobody holds them on evidence, and most of us never formulate them..."**
      *   **Endorsement:** Strongly correct. This is crucial. Hinges are not empirical beliefs held based on evidence. They are not "held" propositionally in the same way. They manifest in *how we act*, in our *form of life*. We don't typically say "I believe objects persist unobserved"; we *act* as if they do (OC 204, 284, 358).
      *   **Subtlety:** Wittgenstein sometimes uses "belief" or "conviction" loosely for hinges, but always to highlight the *difference* from ordinary belief (e.g., OC 103-104, 159). The essay's distinction here is sound.

  5.  **"...but they are beliefs we are entitled to hold without evidence, and it would be irrational to surrender them, since without them no inquiry could get started."**
      *   **Subtly Wrong (Matters Significantly):** This is where the essay seriously missteps. Wittgenstein **avoids** language of "entitlement," "justification," or "rationality" for hinges. These are epistemic concepts *within* the game that hinges make possible. Applying them *to* the hinges is precisely the confusion Wittgenstein fights.
          *   "Entitled without evidence" smuggles in an epistemic framework ("entitlement" implies a normative epistemic status) that hinges *precede*. Hinges aren't "unjustified beliefs we're allowed to have"; they are *the conditions for justification and entitlement*. We don't *choose* them rationally; they are part of our inherited background (OC 94-95, 110, 144, 559).
          *   "Irrational to surrender them" is misleading. It implies a rational choice is involved. For Wittgenstein, surrendering a fundamental hinge isn't primarily irrational; it's *incoherent* or *impossible* within that form of life. It would collapse the language game itself, making rational discourse *about* it impossible. Surrender happens through a *shift* in form of life, not rational deliberation (OC 92, 617).
      *   **Your First Concern Confirmed:** The author *has* quietly turned something arational (the hinge as a condition for rationality) into something quasi-justified ("entitled to hold"). This distorts Wittgenstein's core insight.

  6.  **"A community's hinges function much like its paradigm: adopted because they pay off, and abandoned when a rival framework proves more fruitful."**
      *   **Not Wittgenstein's View / Seriously Misleading:** This is a significant conflation with Kuhnian paradigms and instrumentalism.
          *   **Adopted because they pay off?** Wittgenstein does *not* portray hinges as consciously adopted tools for pragmatic success. Hinges are inherited, absorbed, part of our "second nature" through training and acculturation into a form of life (OC 92, 94-95, 204). They are not chosen based on utility calculations.
          *   **Abandoned for something more fruitful?** While Wittgenstein acknowledges that hinges *can* change over time or between cultures, he does *not* present this as a rational choice based on "fruitfulness" like adopting a scientific theory.
              *   **How Hinges Change:** Changes in hinges often happen slowly, imperceptibly, through shifts in practice, upheaval, or conversion. They are not typically abandoned *because* a rival is "more fruitful" in a demonstrable way *prior* to the shift. The shift *enables* a new standard of fruitfulness (OC 92, 96-99, 256-257, 611-612).
              *   **Kuhnian Drift:** Your nose is correct. This "pay off/fruitfulness" language is pure instrumentalist philosophy of science (Popper, Lakatos, Kuhn). Wittgenstein's focus is on the *grammatical/logical status* of hinges within a form of life, not their instrumental success. What's lost is Wittgenstein's emphasis on the *pre-rational*, foundational character of hinges and the way change often involves a transformation of world-picture, not a rational calculus. Kuhn's paradigms *are* revisable based on puzzle-solving success; Wittgenstein's deepest hinges are the bedrock that makes such success measurable *within* a paradigm.

  7.  **"The consequence is that the whole edifice of knowledge rests on something that is not knowledge but ungrounded certainty."**
      *   **Endorsement (with nuance):** Correct in spirit. Knowledge rests on a foundation that is not itself knowledge (justified true belief). Wittgenstein calls it "ungrounded way of acting" (OC 110), "something animal" (OC 359), "mythology" (OC 95), or simply "certainty." "Ungrounded certainty" is a fair paraphrase.
      *   **Nuance:** "Certainty" here isn't a psychological feeling of conviction; it's a logical status manifest in action.

  8.  **"This is why the deepest disputes — over religion, over what counts as evidence at all — cannot be settled by argument." / "Two people with different hinges have no common ground to stand on; each can only attempt to convert the other." / "Wittgenstein accepts as much... he pictures this by way of missionaries..."**
      *   **Partly Correct, Partly Misleading:** Wittgenstein *does* say reasons run out (OC 612) and persuasion (not argument) takes over in fundamental disagreements (OC 92, 262, 608-612). The missionary analogy (OC 612) is apt for describing a *radical* conversion of world-picture.
      *   **Relativist Overreach / Your Second Concern:**
          *   **"No common ground":** This is too stark. Wittgenstein doesn't claim people with different hinges share *nothing*. They share a human form of life, language, basic needs, and often *many* other hinges (e.g., the reliability of senses in *most* contexts, basic logic, the existence of an external world - even if interpreted differently). The disagreement is deep *because* it concerns fundamental hinges *within* this shared background, not because all background is absent. The "common ground" is the shared human condition, but the *specific* hinges framing evidence or reality might clash. "No common ground *on the disputed hinge itself*" would be more accurate than absolute "no common ground."
          *   **"Cannot be settled by argument":** True *on the specific hinge point* and its implications. But argument *can* occur on subsidiary points *within* each framework. The dispute *as a whole* cannot be resolved by shared rational arbitration *if* it hinges (pun intended) on incompatible fundamental commitments.
          *   **The Missionary Remark:** It *is* a concession that *rational argument* reaches its limit. However, it's **not** a concession to *relativism* in the sense that all frameworks are equally valid or that truth is framework-dependent *for Wittgenstein*. He thinks *our* hinges are the ones that mesh with reality in a way that allows successful action and inquiry (OC 429-430). The missionary analogy describes the *process* of change, not an endorsement that any conversion is as good as any other. Wittgenstein clearly inhabits the scientific world-picture.

  9.  **"The difference between a scientific and a superstitious culture is therefore not that one has better reasons — on both sides the reasons run out at the same depth — but that they play different games."**
      *   **Subtly Wrong / Misleading:** While they play different language games, Wittgenstein **does** think the scientific framework is superior *because it works* and is deeply interwoven with successful practice (OC 286, 336, 603, 609-610). Reasons run out at the hinge level, *but*:
          *   The *content* and *consequences* of the hinges matter. The scientific hinge allows for systematic, testable, predictive inquiry with vast practical success. The superstitious hinge may not.
          *   "Better reasons" *within their respective systems* might be comparable *formally*, but the *system as a whole* grounded by the scientific hinge demonstrably "pays" in terms of understanding and control in a way superstition does not. Wittgenstein wouldn't say they are epistemically equal. The essay's phrasing downplays Wittgenstein's clear preference for the scientific form of life.

  ### Your Prion Case Applied to the Essay

  1.  **Does it refute "hinge-level propositions cannot be revised by inquiry"?**
      *   **Yes, it refutes the essay's claim.** The essay states hinges "cannot be proved or disproved" and implies they are only abandoned for a "more fruitful" rival framework. Your case shows a proposition *functioning like a hinge* ("All infectious agents contain nucleic acid") was *revised through empirical inquiry and evidence* (the painstaking accumulation of evidence for prions). It wasn't simply swapped for a "more fruitful" framework; the *evidence* forced a fundamental revision *within* the scientific enterprise.
      *   **Wittgenstein can absorb it:** This is key. Wittgenstein *can* accommodate this because **what the essay misidentifies as a "hinge" was actually a very, very entrenched *empirical proposition* mistaken for a hinge.** For Wittgenstein:
          *   A true hinge is something like "There are physical objects," "My senses are generally reliable," "The world existed before I was born." Doubting *these* makes *any* inquiry, including biological inquiry, impossible.
          *   Doubting "All infectious agents contain nucleic acid" was shocking and seemed "unthinkable," but it *didn't* destroy the possibility of biological inquiry. Scientists could still design experiments, use instruments, trust their senses, reason logically, etc. *within* their existing framework. The prion hypothesis, however radical, was still proposed *within* the broader scientific world-picture. It challenged a core *belief*, not a fundamental *condition for believing*.

  2.  **Was it a hinge or an entrenched empirical generalization? Distinguishing them:**
      *   **It functioned *as if* a hinge** during the dismissal phase ("unthinkable," questioning meaning, not just evidence).
      *   **But it wasn't a true Wittgensteinian hinge.** Here's the principled distinction **from within**: Ask what happens if it's doubted.
          *   **True Hinge Doubt:** Leads to global incoherence. If you genuinely doubt "Physical objects exist," you cannot meaningfully interact with the world or conduct science. The doubt paralyzes action and discourse.
          *   **Entrenched Empirical Generalization Doubt:** Causes profound disruption and requires foundational *rethinking within the field*, but doesn't collapse the entire edifice of rational inquiry or practical engagement with the world. Scientists doubting the nucleic acid dogma could still investigate viruses, bacteria, conduct chemistry, trust their microscopes, etc. The doubt was localized, however severe its implications for virology/infectious disease. It challenged a specific, albeit fundamental, *fact* about the world assumed by biology, not the preconditions for *having* facts or *doing* biology.
      *   **The Label:** While hindsight is clearer, the principled distinction (does the doubt destroy the possibility of *any* inquiry/action within the form of life?) can be applied reflectively *during* the episode, even if emotionally it feels like a hinge is being attacked. The persistence of *other* scientific activities during the controversy is the key indicator.

  3.  **What does the episode show about what a hinge is?**
      *   It highlights the **gradient between core empirical propositions and true hinges**. Propositions can *function with hinge-like certainty* in specific contexts or disciplines without being global hinges. They are "local hinges" or "framework assumptions" within a practice.
      *   It shows that **what is treated as a hinge can be context-dependent** (within molecular biology vs. broader life).
      *   Crucially, it **distinguishes revisability**: True Wittgensteinian hinges are *practically* unrevisable through standard empirical inquiry *within* their form of life; their revision signifies a monumental shift in world-picture. Entrenched empirical generalizations, no matter how fundamental-seeming, *can* be revised through painstaking evidence accumulation *within* the ongoing practice, causing a crisis and paradigm shift *within* the field, but not necessarily a collapse of the overall form of life.

  4.  **Your Inclination ("foundations are revisable and hence not arbitrary"):**
      *   **Partly Supported, Partly Distinct:** Your case brilliantly supports that *deeply held scientific assumptions* (even those mistaken for hinges) are revisable through evidence, making science non-arbitrary. This aligns with Wittgenstein's view that our world-picture is *not arbitrary*; it is formed through interaction with the world and practical success (OC 298-299, 429-430).
      *   **Distinction:** However, Wittgenstein would insist the *deepest* foundations (the true hinges enabling *any* revision, like logic, persistent objects, reliable senses) are *not* revisable *in the same way*. Their "revision" wouldn't be a scientific discovery; it would be a catastrophic breakdown or a conversion to a radically different form of life. Science's non-arbitrariness, for Wittgenstein, comes from its grounding in successful practice within our human form of life, not from having absolutely unrevisable, rational foundations.

  ### Conclusion on the Essay

  The essay captures the core idea of hinges and the limits of justification well but makes critical errors:

  1.  **Epistemic Smuggling:** It wrongly imports concepts of "entitlement" and "rationality" onto hinges, obscuring their pre-epistemic, grammatical role.
  2.  **Kuhnian Conflation:** It mischaracterizes hinge adoption/abandonment as instrumentalist choice based on "payoff/fruitfulness," ignoring Wittgenstein's focus on inheritance, form of life, and the non-rational nature of deep change.
  3.  **Relativist Overinterpretation:** It overstates the "no common ground" thesis and downplays Wittgenstein's clear view of the superiority of the scientific form of life based on its connection to successful practice.
  4.  **Hinge Misidentification:** Your prion case exposes this flaw: mistaking an entrenched (but empirically revisable) scientific generalization for a true, unrevisable Wittgensteinian hinge.

  Your inclination about revisable foundations is correct *for the level of deep scientific assumptions*, and your prion case is a powerful illustration. However, Wittgenstein would maintain that the *deepest* hinges enabling *any* science (like those concerning existence, persistence, and reliable observation) are of a different, logically prior order and are not revisable *by* scientific inquiry. The essay's relativist conclusion survives only in a weakened form (rational argument hits limits on fundamental commitments) but is undermined by the essay's own misreading of hinges and Wittgenstein's clear allegiance to the scientific world-picture. The true force of *On Certainty* is to diagnose the *grammar* of our foundational certainties, not to promote relativism or instrumentalism.
