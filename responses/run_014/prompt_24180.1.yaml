  2. **Distribution vs. Average:** The Cesaro mean provides a single number but fails to capture the full distribution of outcomes. The lottery has a heavy-tailed distribution with infinite variance, meaning that outcomes can be extremely volatile. A decision maker cares about the entire risk profile, not just a point estimate derived from a divergent series.

