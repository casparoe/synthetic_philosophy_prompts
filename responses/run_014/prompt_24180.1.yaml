  The Pasadena lottery presents a fascinating challenge for decision theory because its expected value is undefined—both the positive and negative parts of the series diverge—making traditional expected utility maximization inapplicable. While Cesaro and Abel summability methods assign a value of \( \frac{1}{4} \) to the divergent series, this result does not translate to a legitimate decision-theoretic value for a rational agent deciding whether to play the game. Below, I argue why this is the case, focusing on why the averaging approach fails to capture real decision-making concerns. I then discuss what might change this view.

  ### Why Cesaro/Abel Summation Fails as a Decision-Theoretic Value
  The core issue is that Cesaro and Abel summability are mathematical techniques for assigning values to divergent series, but they do not address the fundamental decision-theoretic problems posed by the Pasadena lottery. Here's why they fall short:

  1. **Ignorance of Risk and Extreme Outcomes**:
     - The Cesaro mean smooths out the oscillating partial sums (which alternate between \( \frac{1}{2} \) and 0) to arrive at \( \frac{1}{4} \), but this ignores the heavy-tailed risk inherent in the game. Specifically:
       - With probability \( \frac{2}{3} \), you win a positive amount (e.g., \( +\$1 \) with probability \( \frac{1}{2} \), \( +\$4 \) with probability \( \frac{1}{8} \), etc.), but the conditional expected gain given a win is infinite due to the small probabilities of large wins.
       - With probability \( \frac{1}{3} \), you lose a substantial amount (e.g., \( -\$2 \) with probability \( \frac{1}{4} \), \( -\$8 \) with probability \( \frac{1}{16} \), etc.), and the conditional expected loss given a loss is also infinite.
     - For a risk-averse decision-maker, the possibility of catastrophic losses (e.g., losing \( \$32,768 \) or more with probability \( \frac{1}{131,072} \)) is a major concern. Even though these losses are rare, their magnitude can be devastating, especially for someone with limited wealth. The Cesaro mean's "averaging" of the partial sums does not reflect this risk because it treats all terms equally, disregarding how utility functions (e.g., concave utility like log-wealth) amplify the disutility of large losses. If utility is bounded, expected utility exists but may not be close to \( U(\frac{1}{4}) \); if utility is unbounded, expected utility may not exist at all. Cesaro's \( \frac{1}{4} \) offers no insight into these issues.

  2. **Misrepresentation of the Distribution in Single or Finite Play**:
     - When playing the game once, you experience a single outcome, not an average of partial sums. The actual distribution of payoffs has key features that \( \frac{1}{4} \) obscures:
       - The median payoff is \( \$1 \), with \( P(X \leq 1) = \frac{5}{6} \) (since \( P(X=1) = \frac{1}{2} \) and \( P(X=-2) = \frac{1}{4} \), etc.).
       - However, the distribution is highly skewed and heavy-tailed: \( P(|X| > t) \sim \frac{1}{t} \) for large \( t \), meaning the variance and higher moments are infinite. This implies extreme volatility—e.g., in a single play, you could easily win \( \$1 \) or lose \( \$2 \), but with small probability, you face ruinous losses.
     - A rational agent cares about this full distribution, not a point estimate. For instance, a risk-neutral agent might accept \( \frac{1}{4} \) as a "fair" price, but only if the expectation were defined—which it isn't. A risk-averse agent would likely require a significant risk premium to play, making \( \frac{1}{4} \) an unattractive valuation. Cesaro's averaging pretends the series converges, but it doesn't, so the value \( \frac{1}{4} \) is an artifact of the summation method, not a summary of the game's inherent risk-reward trade-off.

  3. **Failure in Repeated Play**:
     - One might argue that \( \frac{1}{4} \) could represent the long-run average payoff if the game is played repeatedly. However, due to the infinite mean (\( E[|X|] = \infty \)), the sample average of payoffs does not converge to \( \frac{1}{4} \) (or any constant) by the law of large numbers. Instead:
       - Because \( P(|X| > t) \sim \frac{1}{t} \), the average payoff in \( K \) independent plays converges in distribution to a non-degenerate stable law (similar to a Cauchy distribution) as \( K \to \infty \). This means the long-run average can fluctuate wildly and does not settle near \( \frac{1}{4} \).
       - For example, simulations would show that after many plays, the average payoff can be positive, negative, or large in magnitude with non-negligible probability, depending on rare but extreme outcomes. Thus, Cesaro's \( \frac{1}{4} \) misleads by suggesting stability where none exists. A decision-maker planning repeated play cannot rely on this value for financial planning or risk management.

  4. **Dependence on Series Ordering and Lack of Robustness**:
     - The Cesaro sum depends critically on the order of terms in the series. If the payoffs were listed in a different sequence (e.g., grouping positive and negative terms separately), the Cesaro mean could change or remain undefined. Yet the game itself is unchanged—the probabilities and payoffs are fixed. Decision-theoretic value should be invariant to such mathematical manipulations, as it reflects objective features of the lottery. Cesaro's \( \frac{1}{4} \) is not robust; it is a consequence of how we choose to "count" the partial sums, not a property of the game.

  In essence, the Cesaro mean is a mathematical trick that forces convergence on a divergent series, but it does not engage with what matters for decision-making: the avoidance of ruin, the diminishing marginal utility of wealth, and the actual behavior of the game under real-world constraints (e.g., finite wealth, risk aversion). It fails to provide actionable guidance, such as a maximum entry fee or a risk-adjusted valuation, because it ignores decision theory's core tenets.

  ### What Would Change My Mind
  I would accept Cesaro summation (or similar methods) as a legitimate decision-theoretic tool for the Pasadena lottery if one or more of the following conditions were met:

  1. **Convergence in Repeated Play**: If it could be proven that, under reasonable assumptions (e.g., with a specific utility function or in a particular economic context), the sample average of payoffs in repeated independent plays converges to \( \frac{1}{4} \) with high probability. For instance, if a law of large numbers could be established for a modified version of the game (e.g., with truncated payoffs) that converges to the Pasadena lottery, and Cesaro emerges as the natural limit.

  2. **Utility-Based Justification**: If for a broad class of bounded utility functions (e.g., \( U(w) = -\exp(-aw) \)), the expected utility \( E[U(w + X)] \) is well-defined and close to \( U(w + \frac{1}{4}) \) when \( w \) is initial wealth. This would show that \( \frac{1}{4} \) is a reliable certainty equivalent. Similarly, if Cesaro summation arises naturally from a generalized expected utility framework (e.g., via weighted utilities or regret theory) that rational agents would adopt for heavy-tailed distributions.

  3. **Contextual Embedding**: If additional structure is imposed on the problem—such as a pre-commitment to multiple plays, a social or market context where the game is priced based on collective averaging, or a Bayesian prior that smooths the divergence—and Cesaro is shown to be the unique consistent valuation under that structure. For example, if the lottery is part of a larger portfolio and risk-neutral pricing with Cesaro yields arbitrage-free prices.

  4. **Empirical or Behavioral Evidence**: If experimental studies show that human subjects, when faced with Pasadena-like lotteries, report indifference prices or choices that cluster around \( \frac{1}{4} \), and this behavior is consistent with rational, welfare-maximizing decisions (e.g., under prospect theory with specific parameters). This would suggest that Cesaro captures something behaviorally relevant.

  Without such evidence, Cesaro summation remains an elegant mathematical solution to a convergence problem but not a decision-theoretic value. It distracts from the game's true challenges: managing tail risk and making coherent choices when expectations fail.
