prompt: |-
  I've been chewing on this thing I keep seeing in arguments and I wonder if there's a name for it in philosophy. Here's the pattern. Person A does something wrong. Person B calls them out, and B's criticism is totally accurate — the facts are right, the moral reasoning is sound. But B is themselves guilty of the very same thing (or something close to it). Now, nobody's saying B's criticism is false because B is a hypocrite. The point is different: it feels like B just doesn't get to make that criticism. Like they've lost the ticket to say it, even though what they're saying is true.

  Two examples to make it concrete. First: a politician who voted to authorize an invasion gives a speech condemning another country for invading its neighbor. Everything he says about the wrongness of the invasion is correct. But there's this widespread reaction — including from people who agree the invasion is wrong — that he of all people shouldn't be the one saying it. Second, smaller scale: my cousin, who dropped out of college after one semester and has never held a job for more than six months, loves to tell his younger brother that he's "not applying himself" and "needs to take responsibility." The things he says about responsibility might be true! But coming from him, it feels like a violation of some norm, not just annoying hypocrisy.

  I can think of nearby ideas — ad hominem (but that's attacking the arguer instead of the argument, and here the argument is fine), tu quoque (but that's "you do it too so you're wrong," and I'm not saying B is wrong), and hypocrisy (but that's a character trait, and what I'm tracking is a normative fact about whether B is in a position to speak). None of them quite nail it.

  So my question: is there an established term for this — the loss of standing or entitlement to make a sound criticism because of one's own conduct? And if there is, I want more than just the label. I want to understand what exactly the phenomenon is and where its edges are. Give me exactly five things: (1) the name of the concept, if there is one, (2) a precise definition that distinguishes it from nearby ideas, (3) the best account of why the standing deficit is genuinely normative and not just a social queasiness we should get over, (4) a boundary case where it's genuinely unclear whether standing is lost, and (5) whether the concept applies only when the speaker is guilty of the same wrong, or also when they're complicit in a broader or different way. One or two sentences each, no intro or conclusion.
reasoning: |-
  Okay, let me tackle this user's query. They're describing a situation where Person B accurately criticizes Person A for wrongdoing, but B themselves is guilty of the same thing. The user feels that B loses the standing to make that criticism, even if the criticism is factually correct. They've mentioned examples: a politician condemning an invasion they previously supported, and a cousin giving advice about responsibility despite their own failures. 

  The user has already ruled out ad hominem, tu quoque, and simple hypocrisy. They want to know if there's a specific philosophical term for this "loss of standing." The core seems to be about normative entitlement rather than truth or hypocrisy. 

  I recall the term "moral standing" or "standing to blame" from ethics, especially in discussions about blameworthiness. The idea is that even if your criticism is valid, your own past actions can undermine your authority to deliver it. This is different from hypocrisy—which is about inconsistency—because it’s about the right to speak in the first place. 

  For the normative weight, philosophers like Coates and Tognazzini argue that without clean hands, your blame lacks the moral force it should carry. It’s not just social discomfort; it’s about the legitimacy of the speaker’s role. 

  A boundary case could be someone who’s reformed. If a former smoker quits, do they have standing to criticize current smokers? It’s debatable—some say yes because they’ve changed, others say their past still taints their authority. 

  The user also asks whether complicity counts, not just identical wrongdoing. Standing can be lost through complicity too, like benefiting from systemic injustice while criticizing others for it. The key is the speaker’s involvement in similar harm, even if not identical. 

  I need to ensure each part of the answer addresses their five requests precisely: the term, definition, normative basis, boundary case, and scope. Keeping it concise without intros or conclusions as specified.
answer: |-
  Here are the five requested items:

  (1) **Moral Standing** (specifically, "standing to blame" or "standing to criticize").  
  (2) The concept denotes a normative condition where an agent forfeits the *authority* or *entitlement* to issue a valid criticism due to their own relevant moral failing, distinct from hypocrisy (which focuses on character inconsistency) and tu quoque (which wrongly conflates the speaker's flaw with the criticism's falsity).  
  (3) The deficit is normative because issuing blame while culpably implicated in the same wrong undermines the moral reciprocity and fairness inherent in holding others accountable—blaming while "dirty-handed" expresses an illegitimate claim to moral superiority or fails to acknowledge shared moral failure.  
  (4) A boundary case: a person who committed tax fraud a decade ago but has since reformed, served punishment, and now condemns another's unrelated tax fraud—whether their reformed status restores standing is contested.  
  (5) Standing can be lost through complicity or enabling similar wrongs, not just identical acts (e.g., a corporation lobbying against environmental regulations while condemning a factory for pollution).
