  ## Ten Minutes in the Space Between Doing and Allowing

  [Quiet breath, look at audience] My name is [Your Name]. I run a small bakery. I measure flour, I knead dough, I watch yeast work its quiet magic. Two months ago, I stood in an ICU, holding my mother’s hand, and told her doctors to remove the breathing tube keeping her alive. She died a few hours later. She had ALS. At the end, she was fully conscious, trapped inside a body that wouldn’t move anything except her eyes. She’d signed an advance directive years before, crystal clear: *No indefinite ventilator.* But when the moment came – when the doctors told my sister and me she could likely live another six months, lucid but imprisoned, or we could choose to let her go – *we* had to say the words. "Extubate." We said it.

  [Pause] I’ve been reading since then. Trying to understand the moral landscape of that decision. I keep circling back to this idea philosophers talk about: the difference between *doing* and *allowing*. Killing versus letting die. Actively causing death versus removing an intervention and allowing the underlying disease to take its course. I read articles saying the distinction is a convenient fiction. That pulling that tube, knowing death follows, *is* killing – morally identical to giving a lethal injection. We should just be honest about that, they say. Then I read others insisting, no, there’s a fundamental difference embedded in law and medical ethics. Withdrawing unwanted, burdensome treatment isn't killing; it's respecting autonomy and the natural progression of disease.

  [Slightly leaning forward] Standing here, as the person who *said* the words, I can tell you: the philosophy doesn’t resolve the feeling. It doesn’t dissolve the weight. Because in that hospital room, the distinction wasn’t an abstract argument. It was the terrifying space my sister and I had to occupy.

  **"Extubate."** Saying that word felt like an immense, terrifying *act*. A *doing*. We weren't passive. We initiated a chain of events. We *chose* this Tuesday, not some vague future Wednesday. The responsibility landed on us with a physical thud. My mother’s directive gave us the map, but *we* had to point and say, "Here. Stop here."

  And yet… [Looking down, then back up] When the tube came out, and we held her hands, and she breathed on her own – shallowly, then not at all – what unfolded felt profoundly like an *allowing*. The ALS, the disease she had fought so bravely for years, was finally, inevitably, taking her. The ventilator wasn't *her* life; it was a machine holding her captive *from* her death. Removing it wasn't introducing a new cause; it was removing an artificial barrier. We weren't wielding death; we were stepping aside from technology so her disease, her body’s reality, could follow its path. The law, the advance directive, the medical framework – they all treat it this way: not as homicide, but as honoring her refusal of treatment.

  [Voice quieter, more urgent] But here’s the brutal truth from the family side: **In the moment of decision, the line blurs until it vanishes.** The intellectual distinction between "doing" and "allowing" collapses under the emotional and moral gravity. Saying "extubate" felt both like performing a devastating act *and* stepping aside to allow an inevitable fate. It felt like *both* killing *and* letting die, simultaneously. The philosophical categories, however logically distinct on paper, fused into one unbearable burden of agency.

  [Looking at the clinicians] You have protocols. You have ethics committees. You have the law. You have the distinction. And thank God you do. It provides a necessary structure. But for the family standing at the bedside, translating a loved one’s directive into the final, irrevocable instruction… that structure feels less like solid ground and more like a tightrope strung over an abyss. We *inhabit* the ambiguity you debate. We *become* the point where the "doing" of withdrawing care meets the "allowing" of death. And the weight of that convergence is immense.

  I haven’t made peace with it. Maybe I never will. My mother didn’t want to live like that. We honored her. Logically, I know that. But logic doesn't lift the weight of being the one who *did* the thing that *allowed* the end. The bakery feels simple now. Flour is flour. Water is water. But life, death, and the words that bridge them? That’s infinitely more complex.

  [Final pause] So, when you discuss the doing/allowing distinction in your committees, in your policies, in your quiet moments of reflection… remember the family in the room. Remember that while the distinction provides crucial legal and ethical scaffolding, for us, in that raw moment, it feels less like a clear line and more like a chasm we are asked to step across, carrying the full, terrifying weight of love and responsibility. The philosophy gives you the map. We live the journey.

  **Summary: The doing/allowing distinction, while foundational to medical ethics, collapses into a single, crushing weight of agency for families tasked with enacting a loved one's wish to die.**

  ---

  **Note on Philosophical Liberty:**

  The speech leans heavily on the *subjective experience* of the doing/allowing distinction blurring ("the line vanishes," "it felt like both killing and letting die"). While powerfully capturing the *feeling* of agency, this framing risks implying the philosophical distinction itself is *objectively* invalid or merely perceptual in the clinical context. A strict philosopher might argue the distinction remains ontologically real and ethically crucial *regardless* of the family's intense emotional experience – the act *is* allowing death from the underlying disease, not killing, however it feels. The speech prioritizes the lived, emotional reality over this potential philosophical precision.

  **Key Contested Claim:** The assertion that the distinction "collapses" subjectively, while true to the speaker's experience, could be contested by those who believe the moral character of the act (allowing) remains distinct from the *feeling* of performing an act (doing), and that conflating the feeling with the moral reality is misleading.
