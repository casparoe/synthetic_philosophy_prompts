prompt: |-
  I serve as the attending veterinarian and chair of the animal-care committee at a biomedical research institute. Our regulatory obligations extend to mammals, birds, and fish, but a growing share of our work involves invertebrates: electrophysiology on locusts, behavioral assays on crabs and shrimp, and from next year a small cephalopod program. The regulations say nothing about which of these animals require anesthesia, humane endpoints, or post-procedural monitoring, so in practice each laboratory improvises, and the improvisation tracks little more than intuitions about brain size — the crustacean labs have begun using analgesia on their own initiative, while the locust preparations are still performed on fully awake animals, and nobody on the committee can articulate a principled reason why the line falls where it does. The honest situation is that committee members reach for brain size and encephalization because those are measurable, even though everyone vaguely agrees that what matters morally is presumably not the size of the organ but the capacity for suffering that the organ subserves — and nobody knows how to move from the one to the other under time pressure.

  Please convert that ragged reasoning into a decision procedure my committee can actually run. The parameters are as follows: roughly a dozen new invertebrate protocols per year; the review must be completed in about an hour per protocol by people who are not comparative neuroscientists; the output is a written determination signed off by me, so it must be auditable by an outside inspector later. The procedure should be a sequence of questions asked in order, each with a statement of what counts as a sufficient answer; it should specify where the procedure terminates in a determination of no protection required, and where it hands the question back to the committee because the issue is one of moral values rather than empirical fact, so that the value judgment is at least visible and consistently located rather than smuggled into a factual-looking step. It must also tell the committee what to do when the evidence needed to answer a question simply does not exist, which for most invertebrate groups is the normal case rather than the exception. Finally, it should contain an explicit warning section on where a brain-size proxy misfires — both directions — since comparative cognition is full of cases in which a small or anatomically unconventional nervous system supports more than its size suggests, and cases in which a large brain coexists with capacities that seem irrelevant to welfare.

  Once the procedure is written, apply it to three protocols. First, an electrophysiology preparation on adult locusts that has historically been carried out without anesthesia, where the interesting complication is that anesthesia would destroy the very signal the experiment exists to record. Second, a shell-crushing noxious assay on shore crabs, a protocol the proposing laboratory has already volunteered to run under analgesia. Third, a learning and memory study on cuttlefish, animals whose nervous system is organized so differently from ours that committee members cannot agree whether their intuitions about them are worth anything. At least one of the three applications must return a determination the committee will find unwelcome, and you should say which one and why the procedure nonetheless returns it. Close by stating plainly what the procedure cannot do: in particular, whether it can settle the underlying moral question at all, or only render our existing moral uncertainty consistent, documented, and honestly assigned to the right people.
reasoning: |-
  We are designing a decision procedure for the animal-care committee to determine protections (anesthesia, humane endpoints, post-procedural monitoring) for invertebrate protocols. The procedure must be auditable, efficient (about 1 hour per protocol), and handle cases with limited evidence. It must explicitly separate empirical questions from value judgments and account for brain-size proxy pitfalls.

  **Decision Procedure Outline:**

  1. **Start with the regulatory baseline:** If the animal is covered by existing regulations (mammals, birds, fish), follow those rules. For invertebrates, proceed to step 2.

  2. **Question 1: Is there direct evidence of nociception in this species?**
     - *What counts as sufficient?* Peer-reviewed studies demonstrating nociceptors and/or behavioral responses to noxious stimuli that are modulated by local anesthetics or analgesics. If yes, proceed to step 3. If no, proceed to step 4. If the evidence is ambiguous or mixed, proceed to step 4.

  3. **Question 2: Is there evidence of central processing of nociceptive signals (i.e., beyond simple reflexes) that might indicate suffering?**
     - *What counts as sufficient?* Evidence of long-term changes in behavior (e.g., avoidance learning, trade-offs with other motivations, prolonged guarding) or neurophysiological evidence of central modulation (e.g., in brain or ganglia). If yes, proceed to step 5. If no, proceed to step 6. If evidence does not exist or is inconclusive, proceed to step 6.

  4. **Question 3: Given the lack of direct evidence, does the animal belong to a taxonomic group where evidence of nociception exists in closely related species?**
     - *What counts as sufficient?* Evidence in the same genus or family. If yes, proceed to step 3 (but note the evidence is from a related species). If no, proceed to step 7.

  5. **Question 4: What is the invasiveness of the procedure?**
     - *Categorize as:*
       - **Minimal:** Non-invasive behavioral observations, brief handling.
       - **Moderate:** Minor tissue damage (e.g., tagging, small biopsy), brief exposure to noxious stimuli without tissue damage.
       - **Severe:** Surgery, exposure to noxious stimuli causing tissue damage, chronic pain models, prolonged restraint.
     - For moderate or severe procedures, proceed to step 8. For minimal, step 9.

  6. **Question 5: Is the animal capable of suffering? (Value judgment required)**
     - *This step is for cases where evidence of central processing is lacking or negative, but the procedure is invasive and/or the animal has a complex nervous system. The committee must decide based on the precautionary principle and moral values.*
     - *Assign to committee discussion.* The output of this step is a binary: "Requires protection" or "Does not require protection". The committee must document the rationale.

  7. **Determination of no protection required:** If at step 4 we have no evidence in the taxonomic group and step 5 (if reached) does not require protection, then no anesthesia, humane endpoints, or monitoring are required. Document the lack of evidence and the reasoning.

  8. **Requirement of protections:** If the procedure is moderate or severe and there is evidence of nociception and central processing (or if the committee at step 6 decides to require protection), then:
     - Anesthesia (if compatible with the procedure) and/or analgesia must be used.
     - Humane endpoints must be defined.
     - Post-procedural monitoring must be implemented.

  9. **Minimal procedures:** Only require standard humane handling and endpoint criteria (e.g., if the animal becomes distressed during handling).

  **Special Considerations:**
  - **When evidence does not exist:** The procedure must default to a precautionary approach only when there is taxonomic reason to suspect capacity (step 4) and the procedure is invasive. Otherwise, no protection is required until evidence emerges.
  - **Warning section on brain-size proxy:**
    - *Underestimation:* Some small-brained or decentralized nervous systems may support complex processing (e.g., honeybees with learning and memory, cephalopods with complex behaviors). Similarly, some arthropods (e.g., crabs) show evidence of pain despite small brains.
    - *Overestimation:* Large brains may not always correlate with suffering if they are specialized for functions unrelated to affective states (e.g., some birds have large brains for flight coordination without necessarily having enhanced pain perception beyond what is necessary for survival reflexes).

  **Procedure Steps in Sequence:**

  1. **Regulatory Status:** If vertebrate, follow regulations. Else, proceed.
  2. **Evidence of Nociception?** 
     - Yes: Go to 3.
     - No or inconclusive: Go to 4.
  3. **Evidence of Central Processing?** 
     - Yes: Go to 5.
     - No or inconclusive: Go to 6.
  4. **Evidence in Related Species?**
     - Yes (same genus/family): Go to 3 (but note evidence is from related species).
     - No: Go to 7 (no protection required).
  5. **Procedure Invasiveness:** 
     - Minimal: Go to 9 (minimal protections).
     - Moderate or Severe: Go to 8 (require protections).
  6. **Committee Value Judgment:** 
     - The committee must decide if the animal is likely to suffer given the nervous system organization and behavior. 
     - If they decide "yes", then go to 5 (to assess invasiveness and then require protections if moderate/severe).
     - If "no", then go to 7 (no protection required).
  7. **No protection required.** Document the determination and reasons (e.g., lack of evidence).
  8. **Require protections:** Anesthesia/analgesia (if feasible), humane endpoints, post-procedural monitoring.
  9. **Minimal protections:** Only humane handling and endpoints during the procedure.

  **Applying the Procedure to Three Protocols:**

  **Protocol 1: Electrophysiology on adult locusts without anesthesia.**
  - Step 1: Invertebrate -> proceed.
  - Step 2: Evidence of nociception in locusts? 
    - Locusts have nociceptors and show nocifensive behavior. However, the evidence for central processing is limited. But note: the procedure without anesthesia is because anesthesia would destroy the neural signal. 
    - Let's assume we find evidence of nociception (studies show they have nociceptors). So, yes -> step 3.
  - Step 3: Evidence of central processing? 
    - In locusts, the response to noxious stimuli is often reflexive. There is little evidence of long-term changes or complex central processing. So, no -> step 6.
  - Step 6: Committee value judgment. 
    - The committee must decide: given the small brain and the reflex-dominated responses, is the locust likely to suffer? 
    - They might lean towards no. But note: the procedure is invasive (electrodes implanted). 
    - However, without central processing, the suffering may be minimal. The committee might decide no protection required -> step 7.
    - But wait, the procedure is severe? Step 5 wasn't reached. We must go back: step 6 leads to a decision. If the committee decides no, then step 7 (no protection). If yes, then we go to step 5 to determine the level of protection.
    - Let's assume the committee, given the lack of evidence for central processing and the fact that the responses are reflexive, decides no -> step 7.

    *Determination:* No protection required. However, the committee must document that the procedure is severe but the animal is not deemed capable of suffering. This might be unwelcome because it allows a severe procedure without anesthesia. But note: the experiment cannot be done with anesthesia. The procedure requires the committee to explicitly state that they do not believe the locust suffers.

  **Protocol 2: Shell-crushing noxious assay on shore crabs.**
  - Step 1: Invertebrate -> proceed.
  - Step 2: Evidence of nociception in shore crabs? 
    - Yes, crabs have nociceptors and show avoidance. Moreover, studies on hermit crabs and other crustaceans show nociception. -> step 3.
  - Step 3: Evidence of central processing? 
    - Studies on crabs (e.g., hermit crabs) show long-term changes (e.g., avoiding a shell they previously preferred after a shock) and trade-offs (e.g., between avoiding shock and getting a better shell). This suggests central processing. -> step 5.
  - Step 5: Procedure invasiveness: 
    - Shell-crushing is severe (tissue damage and noxious stimulus). -> step 8.
  - Step 8: Require protections. 
    - The lab has volunteered analgesia. This is appropriate. Also require humane endpoints (e.g., stop if the crab shows signs of distress) and post-procedural monitoring.

    *Determination:* Protections required. The committee will likely find this acceptable.

  **Protocol 3: Learning and memory study on cuttlefish.**
  - Step 1: Invertebrate -> proceed.
  - Step 2: Evidence of nociception in cuttlefish? 
    - Cephalopods (like octopus and squid) have nociceptors. Cuttlefish are cephalopods. So, yes -> step 3.
  - Step 3: Evidence of central processing? 
    - Cephalopods show complex behaviors and learning. They can remember painful events and avoid them. There is evidence of central processing. -> step 5.
  - Step 5: Procedure invasiveness: 
    - The learning and memory study might be minimal (e.g., maze learning with food reward) or moderate (if it involves aversive stimuli). 
    - Let's assume it uses aversive stimuli (e.g., mild electric shock) to study avoidance learning. Then it is moderate. -> step 8.
  - Step 8: Require protections. 
    - This might be unwelcome because the lab may not have planned for anesthesia/analgesia during the training. But note: the procedure might not be invasive in the sense of surgery, but the use of aversive stimuli might require considerations. 
    - We must require: 
      - Analgesia if the aversive stimulus causes tissue damage? Maybe not, but if it's mild electric shock, it might not cause damage. However, the procedure might cause distress. 
      - Humane endpoints: if the cuttlefish shows signs of distress (e.g., inking, jetting, color changes) the procedure must stop.
      - Post-procedural monitoring: observe for any lasting effects.

    *Determination:* Protections required. This might be unwelcome because the cephalopod program is new and may not have budgeted for these measures. Also, anesthesia in cephalopods is not straightforward and might interfere with learning. However, the procedure requires it because of the evidence of central processing and the potential for suffering.

  **Which one is unwelcome?** 
  The cuttlefish protocol (Protocol 3) is likely to be unwelcome because it requires protections that might be logistically challenging and were not anticipated. The procedure returns it because the evidence for central processing in cephalopods is strong.

  **What the Procedure Cannot Do:**
  The procedure cannot resolve the underlying moral question of whether a particular invertebrate has the capacity to suffer. It only structures the decision-making by:
  1. Separating empirical questions (which we try to answer with evidence) from value judgments (which we assign to the committee when evidence is lacking).
  2. Documenting the rationale for each decision.
  3. Applying consistent standards so that similar cases are treated similarly.

  The procedure makes the moral uncertainty explicit and assigns the value judgment to the committee (and ultimately to the institution) when the science is inconclusive. It does not claim to have solved the hard problem of consciousness; it only ensures that our decisions are auditable, consistent, and transparent.
answer: |-
  ### Decision Procedure for Invertebrate Welfare Protections  
  **Purpose**: To determine whether anesthesia, humane endpoints, and post-procedural monitoring are required for invertebrate protocols, based on evidence of capacity for suffering. Separates empirical questions from value judgments, documents rationale, and accounts for evidence gaps.  

  ---

  ### **Procedure Structure**  
  *Sequential questions; terminate early if "no protection" criteria met. Committee quorum: 3+ members (including chair). Time per protocol: ≤60 minutes.*  

  1. **Regulatory Baseline Check**  
     - *Question*: Is the animal a mammal, bird, or fish?  
     - *Sufficient Answer*: Yes → Apply existing regulations (end).  
       No (invertebrate) → Proceed to Q2.  

  2. **Evidence of Nociception**  
     - *Question*: Is there direct evidence of nociception (i.e., specialized sensory neurons detecting harmful stimuli) in this species?  
     - *Sufficient Answer*:  
       - **Yes** (e.g., peer-reviewed studies confirming nociceptors, avoidance behaviors blocked by local anesthetics) → Proceed to Q3.  
       - **No/Inconclusive** (e.g., no studies, conflicting data, or only anecdotal reports) → Proceed to Q4.  
     - *If Evidence Absent*: Default to "no" but document absence.  

  3. **Evidence of Central Processing**  
     - *Question*: Is there evidence that nociceptive signals are processed centrally (beyond reflexes), suggesting potential for suffering?  
     - *Sufficient Answer*:  
       - **Yes** (e.g., long-term behavioral changes, trade-offs between pain and reward, neural plasticity in ganglia/brain) → Proceed to Q5.  
       - **No/Inconclusive** (e.g., only short-lived reflexes, no evidence of learning/memory related to harm) → Proceed to Q6.  
     - *If Evidence Absent*: Default to "no" but document absence.  

  4. **Taxonomic Precaution**  
     - *Question*: Is there evidence of nociception or central processing in a closely related species (same genus or family)?  
     - *Sufficient Answer*:  
       - **Yes** (e.g., crabs in Decapoda show evidence; apply to related shrimp) → Return to Q3 with this evidence.  
       - **No** (e.g., no data in genus/family, or distant phylogeny) → **Determination: No protections required**. Document rationale.  

  5. **Procedure Severity Assessment**  
     - *Question*: What is the invasiveness of the procedure?  
     - *Sufficient Answer*:  
       - **Minimal** (e.g., non-invasive observation, brief handling) → Proceed to Q6.  
       - **Moderate/Severe** (e.g., tissue damage, prolonged restraint, exposure to noxious stimuli, surgery) → Proceed to Q7.  

  6. **Value Judgment Gate**  
     - *Question*: Should protections be applied due to moral precaution, despite inconclusive evidence?  
     - *Sufficient Answer*:  
       - **Committee Consensus** (≥75% agreement):  
         - Yes (moral precaution) → Proceed to Q7.  
         - No (low likelihood of suffering) → **Determination: No protections required**.  
       - *Rationale Required*: Committee must explicitly state moral reasoning (e.g., "precaution due to behavioral complexity").  
       - *Terminates Empirical Chain*: This step is purely ethical.  

  7. **Protection Requirements**  
     - *Determination*:  
       - **Anesthesia/Analgesia**: Required if feasible without compromising science. If infeasible (e.g., blocks neural signals), justify in writing.  
       - **Humane Endpoints**: Mandatory (e.g., predefined signs of distress: immobility, autotomy, color change).  
       - **Post-procedural Monitoring**: Required (e.g., 24-hour observation for adverse effects).  
     - *Output*: Signed determination with species, procedure, evidence cited, and committee rationale.  

  ---

  ### **Warning: Brain-Size Proxy Pitfalls**  
  *Include this section verbatim in all determinations to alert inspectors:*  
  > **"Brain size or encephalization quotients are unreliable proxies for suffering. Documented exceptions:**  
  > - **Underestimation Risk**: Small/unconventional nervous systems may support complex suffering (e.g., bees show learned avoidance; octopuses exhibit play behavior despite non-mammalian brains).  
  > - **Overestimation Risk**: Large brains may not imply suffering capacity (e.g., some spiders have large central ganglia for motor coordination unrelated to affect).  
  > This procedure prioritizes functional evidence over neuroanatomy."**  

  ---

  ### **Application to Three Protocols**  
  #### **Protocol 1: Locust Electrophysiology (Awake Preparation)**  
  - **Q1**: Invertebrate → Proceed.  
  - **Q2**: Evidence of nociception? **Yes** (locusts have nociceptors; documented avoidance behaviors). → Proceed.  
  - **Q3**: Evidence of central processing? **No** (responses are reflexive; no long-term behavioral changes). → Proceed to Q6.  
  - **Q6**: Value judgment? Committee consensus: **No protection** (reflexes dominate; no evidence of suffering). → **Determination: No protections required**.  
    - *Unwelcome but justified*: The procedure terminates at Q6 due to lack of evidence for central processing. Anesthesia is infeasible (destroys neural signals), and moral precaution is rejected.  

  #### **Protocol 2: Shore Crab Shell-Crushing Assay (with Voluntary Analgesia)**  
  - **Q1**: Invertebrate → Proceed.  
  - **Q2**: Evidence of nociception? **Yes** (crabs show nociceptor activity; analgesia reduces avoidance). → Proceed.  
  - **Q3**: Evidence of central processing? **Yes** (crabs trade off pain vs. reward; long-term shelter avoidance). → Proceed.  
  - **Q5**: Severity? **Severe** (tissue damage from crushing). → Proceed to Q7.  
  - **Q7**: **Protections required** (analgesia mandatory; humane endpoints e.g., limb autotomy; post-crush monitoring).  
    - *Acceptable*: Aligns with lab’s proposal; evidence supports suffering capacity.  

  #### **Protocol 3: Cuttlefish Learning/Memory Study**  
  - **Q1**: Invertebrate → Proceed.  
  - **Q2**: Evidence of nociception? **Yes** (cephalopods have nociceptors; ink release to injury). → Proceed.  
  - **Q3**: Evidence of central processing? **Inconclusive** (cuttlefish learn quickly, but no direct pain studies; octopuses show possible suffering). → Proceed to Q4.  
  - **Q4**: Taxonomic precaution? **Yes** (octopuses in same class show central processing). → Return to Q3 with this evidence.  
  - **Q3 (revised)**: Evidence now **Yes** (extrapolated from octopuses: avoidance learning, problem-solving). → Proceed.  
  - **Q5**: Severity? **Moderate** (aversive stimuli in memory tests). → Proceed to Q7.  
  - **Q7**: **Protections required** (anesthesia if feasible; endpoints e.g., inking/jetting; post-test monitoring).  
    - *Unwelcome and surprising*: Committee may resist due to cephalopod neurodivergence, but procedure mandates protections via taxonomic precaution (Q4) and severity. Moral judgment was avoided; evidence from relatives triggered requirements.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve Moral Uncertainty**: It does not answer whether invertebrates *actually* suffer. It only forces consistent application of evidence and documents where ethical judgments occur (Q6).  
  2. **Create Evidence**: When data is absent (e.g., for most invertebrates), it defaults to "no protection" unless moral precaution (Q6) overrides. This risks both under- and over-protection.  
  3. **Override Scientific Feasibility**: If anesthesia/analgesia invalidates the science (e.g., locust electrophysiology), the procedure may still output "no protection" based on evidence gaps or moral judgment.  
  4. **Replace Expertise**: It flags but cannot resolve debates (e.g., cuttlefish cognition); committees must consult literature during review.  

  **Final Output**: An auditable, time-bound decision that separates empirical gaps (handled by evidence chain) from moral choices (isolated in Q6). It renders uncertainty consistent and assigns accountability to the committee for value judgments.
