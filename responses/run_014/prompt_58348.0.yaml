  hey so I'm running a discussion section for intro phil mind next week on original vs derived intentionality and I need a fresh case because everyone already knows the Chinese room and the thermostat by heart.

  my rough take for the students is like: Searle thinks real minds have intrinsic aboutness and gadgets or programs only get meaning second-hand from us, while Dennett thinks attributing beliefs and wants is justified whenever it helps you predict, even for really dumb systems like his two-bitser coin gadget that just sorts quarters from slugs and acts as if it wants quarters and believes such-and-such is a quarter. correct me if I'm mangling taht but that's the clash I want to probe.

  can you invent me a pair of everyday cases, think laundromat change machine or parking gate or self-checkout, nothing sci-fi, no evil robots or superintelligence, no Chinese rooms or brains in vats or perfect predictors, just normal hardware my freshmen would recognize.

  I need Case A to be one where Dennett's approach says yep, treat it as having simple beliefs and wants because that stance actually predicts better than just talking circuits, but Searle's approach has to say nope, still just second-hand meaning, no real understanding. Then Case B should be the same setup with one small tweak where even Dennett would say okay drop the belief-talk, just talk sensors and gears now.

  Keep each case to one paragraph max in plain language. Then after, show me the design actually works: what each guy would say about each case and why that follows from his view, not just because you stipulated it, plus which detail is doing the heavy lifting and what breaks if you remove it, and how a fan of the side that looks bad in Case A would try to wriggle out.

