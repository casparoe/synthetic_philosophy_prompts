answer: |-
  Here’s your Q&A prep sheet, tailored to your audience’s biases and the likely lines of attack. Prioritize clarity, Bayesian respectability, and strategic concessions. The objections are ordered by escalation: foundational first, then technical, then metaphysical traps.

  ### **Top 10 Objections & Replies**
  **1. "Isn't this just ordinary conditionalization on the proposition 'I am experiencing phenomenal state P* right now'? And doesn’t assuming I *am* such a token already presuppose SSA?"**  
      *Reply (2 min):* "Yes, it *is* conditionalization on that proposition—that’s intentional. But the key move is that phenomenal duplication isn’t a *sampling assumption*; it’s a constraint on what constitutes a *candidate referent* for 'I'. SSA samples from *observers*; here, I condition on being in a state that *only exists* in worlds where such a duplicate is instantiated. No prior sampling over observers is assumed—just logical possibility."  
      *Soft spot:* If the critic insists that selecting *which* phenomenal token is "me" requires SSA, you’re in a stalemate. Concede this might feel "SSA-like" but stress it’s metaphysically thinner.

  **2. "If self-locating evidence rarely matters, why not just reject anthropic reasoning entirely? Skeptics avoid your complexity and get the same negligible updates."**  
      *Reply:* "Skepticism throws out cases where self-location *does* work (e.g., 'Am I in the real lab or the simulation?'). My view preserves those while blocking paradoxes. It’s not that self-location *never* matters—it matters when duplicates are rare (e.g., if I have a unique headache). Simpler skepticism can’t explain *why* it sometimes works."  
      *Soft spot:* If pressed on "rarely matters," admit Doomsday/Presumptuous Philosopher are defanged—but argue this is a *virtue*.

  **3. "Exact phenomenal duplication is incoherent. What counts as 'exact'? Any threshold (e.g., indistinguishable neurons) reintroduces a reference class."**  
      *Reply:* "I mean *numerically identical* phenomenal states—same qualia vector. This is idealized (like perfect rationality), but it avoids vagueness by fiat. Graded similarity is an *epistemic* problem for *us*, not a flaw in the rule. The rule uses metaphysical duplication, not epistemic accessibility."  
      *Soft spot:* Critics will call this "unworkable." Hold firm on the idealization but concede *application* requires care (see #10).

  **4. (From the Halfers) "What does your view say about Sleeping Beauty? She wakes up—is that the same phenomenal state each time?"**  
      *Reply:* "She *should* be a halfer. Each waking is a distinct phenomenal token (different temporal location/memory causation). When asked 'What is P(Heads)?', she conditions on being in *this specific waking token*, which occurs in all Heads worlds but only half of Tails worlds. P(Heads | 'I am this token') = 1/2."  
      *Soft spot:* Thirders will demand why pre-experiment Beauty shouldn’t weight by observer-moments. **Win this exchange.** Aligning with halfers disarms key critics. Stress: "No new rule—just conditionalization on token states."

  **5. "Your rule depends on microscopic phenomenal differences (e.g., a single photon). No rational agent tracks this—so it’s useless for guiding action."**  
      *Reply:* "Ideally rational agents *should* care, but humans use coarse-grained proxies (e.g., 'I see red'). We can derive pragmatic rules for bounded agents, but the ideal theory shouldn’t bend to our limitations. Presumptuous Philosopher is solved *because* of fine-grained duplication."  
      *Soft spot:* If Bayesians insist epistemology must guide action, you’ll need to sketch a bridge (e.g., "Marginally different states get similar credence").

  **6. "What if two observers in a world have identical phenomenal states? Your rule double-counts, making P(I am in world W) depend on arbitrary duplication."**  
      *Reply:* "It *should* depend on that! If two people share my exact state, I’m twice as likely to 'be' one of them. But in practice, exact duplication is vanishingly rare (different spatiotemporal locations, causal histories). This is a feature: it handles cases like cloning machines."  
      *Soft spot:* Critics may claim this *is* SSA over phenomenal tokens. Draw the line: SSA samples pre-defined observers; here, observers are *constituted* by tokens.

  **7. "This violates Bayesian dynamics. Your 'weighting' isn’t conditionalization—it’s a new rule for priors."**  
      *Reply:* "The weighting *is* the prior, derived from indifference over *centered* metaphysical possibilities. Given that I *am* a token of P*, I assign priors proportional to the expected number of P*-tokens. Posterior updates are pure conditionalization."  
      *Soft spot:* Hardcore Bayesians may reject centered priors. Concede this is a foundational commitment but note it’s standard in anthropics (e.g., Bostrom).

  **8. "How is this testable? If phenomenal states are private, your rule can’t be confirmed/falsified."**  
      *Reply:* "Like all epistemic norms, it’s justified by internal coherence (solving paradoxes) and avoiding inconsistency. Testability comes indirectly: if I believe I’m unique, I act accordingly (e.g., in betting scenarios)."  
      *Soft spot:* Formalists may dismiss "coherence" arguments. Hold that anthropics is inherently normative.

  **9. (Metaphysician) "You treat phenomenal states as primitive. But if personal identity is reducible (e.g., to psychology), your duplication condition may beg the question."**  
      *Reply:* "I remain neutral on personal identity. The rule uses duplication of *experience*, not identity over time. Even if identity reduces to psychology, if two entities have identical experiences *at a time*, they are indistinguishable for *evidential* purposes."  
      *Soft spot:* If identity requires continuity, this may collapse. **Concede neutrality** but insist the evidential stance is prior.

  **10. "Your 'dissolution' of Presumptuous Philosopher assumes duplicates are rare in big universes. But if physics is deterministic, identical states recur infinitely!"**  
      *Reply:* "In infinite worlds, we need measure-theoretic tools (e.g., discounting by complexity). But crucially, *varying* population sizes (e.g., 10¹⁰ vs 10¹⁰⁰⁰) still yield ~equal credence if duplicates scale sub-linearly with observers—which they do, due to environmental diversity."  
      *Soft spot:* This is hand-wavy. Admit infinity is unresolved but stress your target is finite-case paradoxes.

  ---

  ### **Strategic Concessions & Holds**
  - **Concede upfront:**  
    - This is an *idealized* framework; humans use heuristics.  
    - It doesn’t resolve infinite cases cleanly.  
    - It may feel "SSA-like" in some intuitions (but isn’t!).  
  - **Hold without compromise:**  
    - This *is* standard conditionalization on centered propositions.  
    - Sleeping Beauty is halfer-compatible (crucial for alliance).  
    - Exact duplication avoids reference-class arbitrariness *in principle*.  
  - **Exchange you MUST win:** **#4 (Sleeping Beauty)**. If halfers accept your view, they become shields against thirders. Frame it as "Your halver intuition is vindicated by my general rule."  

  ### **The Question You Hope Nobody Asks**  
  > **"If my phenomenal state at time T is duplicated in two physically identical clones, does your rule imply I should have 0.5 credence I’m each clone—even if *I* (as a persisting entity) was only one person pre-cloning? Doesn’t this contradict the metaphysics of personal identity?"**  
      *Why it’s deadly:* Forces you to either (a) deny persistence (alienating the metaphysician) or (b) admit phenomenology doesn’t capture "I" (undermining your view).  
      *Reply (if asked):* "Epistemically, yes—you’d assign 0.5 to each center. But this doesn’t require a stance on whether *you* persist as both. It’s about evidence, not ontology."  
      *Danger:* Metaphysician may pounce: "But if evidence doesn’t track *me*, what justifies action?" Have a slide on *de se* betting to fall back on.

  ---

  **Final Tip:** Open by saying, "This is ordinary conditionalization applied to a centered ontology of phenomenal states." Use "centered proposition" not "new rule." Win the halfers early—their approval may quiet others. Good luck!
