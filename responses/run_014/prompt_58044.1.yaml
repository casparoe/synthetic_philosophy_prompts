prompt: |-
  I coordinate the history curriculum for a network of secondary schools and chair a panel that meets each term to revise how morally contested figures appear in lesson openers, wall displays, and assembly scripts. We typically decide five or six cases per term under tight meeting time, the classroom teachers who must apply our guidance have no training in philosophy, any wording must be signed off by head teachers and defended in meetings with parents who disagree strongly with each other, and while nothing we do carries legal risk, the formative stakes for pupils and the reputational stakes for the schools are high. A recent difficult evening with parents left us divided between treating a past moral outlook as explanatory context and treating it as exoneration, and between noting that many people at the time accepted an injustice and asking whether informed dissent was available and at what cost.

  Please translate that debate into a reusable step by step procedure my panel can run without philosophical supervision, stated as ordered tests with clear pass conditions, stopping points that require revision of a celebratory framing, and explicit flags for points where factual inquiry ends and a value judgment by the panel must take over. The procedure should preserve the distinctions that matter most, especially between explaining an action by prevailing norms and excusing it, between the mere existence of a norm and its moral authority for a person in a position of power and benefit, and between acknowledging a historical contribution and endorsing the person as an exemplar, while setting aside theoretical refinements that would not survive classroom use, and it should be candid about where it is likely to misfire. Then demonstrate the procedure on three live cases we face this term, namely a Year 9 lesson opener that presents Jefferson both as an enslaver and as an advocate of equality ideals, a corridor display that celebrates Churchill for wartime leadership with no mention of his positions on empire and race, and a primary assembly script that introduces Columbus as a model explorer, including one demonstration where the outcome cuts against a natural inclination to retain a purely celebratory framing of wartime leadership for the sake of pupil pride. End with a brief account of what the procedure cannot decide. Please begin the response with the procedure itself, with no preface, commentary, or restatement of the request.
reasoning: |-
  Okay, the user coordinates a history curriculum for secondary schools and chairs a panel dealing with morally contested historical figures. They need a step-by-step procedure to handle debates about these figures without philosophical supervision. The key challenges include tight meeting times, teachers without philosophy training, wording needing approval from headteachers, and managing disagreements with parents. The recent debate was about treating past moral outlooks as context versus exoneration and acknowledging dissent.

  First, I need to create a reusable procedure. The procedure must have clear tests, pass conditions, stopping points for revision, and flags where value judgments are needed. It should preserve distinctions like explanation vs. excuse, norm existence vs. moral authority, and contribution vs. endorsement. Also, it should set aside theoretical refinements that won't work in classrooms and be honest about potential misfires.

  The user provided three cases: Jefferson, Churchill, and Columbus. Each will demonstrate the procedure. The Churchill example should show cutting against celebratory framing for pupil pride. The procedure's limitations need to be outlined at the end.

  Breaking down the procedure into steps. Each step should have a test and a pass condition. Steps where the panel must make a value judgment need to be flagged. Stopping points should require revision if the presentation is too celebratory. 

  Key distinctions to include: 
  1. Explanation vs. excuse: Explaining actions by norms isn't excusing them. 
  2. Norm existence vs. moral authority: Just because a norm existed doesn't mean it was morally authoritative, especially for those in power. 
  3. Acknowledgment vs. endorsement: Recognizing contributions without endorsing the person as a role model.

  The steps should start with factual inquiry, then move to contextual analysis, and finally value judgments. Include checks for dissent availability and cost. Also, ensure that any exoneration claims are flagged as unacceptable.

  For the demonstrations: 
  - Jefferson: Highlight both slavery and advocacy for equality. Test if the presentation avoids excusing slavery by context. 
  - Churchill: Wartime leadership vs. empire/race views. Check if the display implies endorsement by omission. 
  - Columbus: Explorer vs. colonial impacts. Ensure he's not presented as a moral exemplar.

  The Churchill example should show how the procedure stops celebratory framing. So, the outcome should require adding context about his controversial views, even if it affects pupil pride.

  Finally, clarify what the procedure can't decide, like determining absolute morality or resolving all ethical debates. It's a tool for structured decision-making, not a philosophical resolution.

  Need to ensure the procedure is practical for teachers without philosophy training. Avoid jargon. Use clear, actionable steps. Include where factual research ends and panel judgment begins.

  Also, address potential misfires. For example, the procedure might oversimplify or not capture all nuances, but that's a trade-off for usability. Make sure the panel knows where their input is crucial.
answer: |-
  ### Historical Figure Evaluation Procedure  
  *(Apply sequentially. Stop and revise if any test fails. [VJ] denotes mandatory panel value judgment.)*  

  ---

  **STEP 1: CONTEXTUAL FACT CHECK**  
  *Confirm basic historical accuracy.*  
  - **Pass:** Actions/statements attributed are factually documented by ≥2 reputable academic sources.  
  - **Stop/Revise:** If claims rely solely on contested/dubious sources.  
  - **Flag:** End factual inquiry. Proceed only if passed.  

  **STEP 2: "EXPLANATION vs. EXCUSE" TEST**  
  *Does framing attribute behavior *only* to period norms?*  
  - **Pass:** Language uses *only* phrases like "reflecting widespread beliefs that…" or "influenced by norms accepting…" **AND** avoids words like "understandable," "justified," or "pardonable."  
  - **Stop/Revise:** If wording implies norms *excused* the action (e.g., "given the times, this was acceptable").  
  - **Flag:** [VJ] required: Panel must affirm *"We explain but do not morally excuse."*  

  **STEP 3: POWER/AUTHORITY ASSESSMENT**  
  *Was the figure in a position to challenge norms?*  
  - **Pass:** Text explicitly notes if the figure held power/influence *exceeding* the average person of their era (e.g., "As a wealthy landowner…" or "Given his role as Prime Minister…").  
  - **Stop/Revise:** If framing implies they were "powerless" against norms without evidence.  
  - **Flag:** [VJ] required: Panel must decide if power status *heightens* moral responsibility.  

  **STEP 4: DISSENT AUDIT**  
  *Were alternatives to injustice known/available?*  
  - **Pass:** If dissent existed (even minimally), text notes: "Some contemporaries opposed this, e.g., [name/movement], though at risk of [consequence]."  
  - **Pass (if no dissent):** Text states: "No significant organized opposition is recorded, though isolated critics faced [consequence]."  
  - **Stop/Revise:** If dissent existed but is omitted **OR** if dissent absence implies injustice was "unavoidable."  
  - **Flag:** [VJ] required: Panel must weigh cost/feasibility of dissent for *this specific figure*.  

  **STEP 5: EXEMPLAR WARNING**  
  *Does framing imply endorsement?*  
  - **Pass:** Text separates *contribution* from *character* (e.g., "While advancing X ideal, he simultaneously upheld Y injustice").  
  - **Stop/Revise:** If celebratory language (e.g., "trailblazer," "heroic") appears *without* juxtaposed critique **OR** calls figure a "role model."  
  - **Flag:** [VJ] required: Panel must confirm *"We acknowledge impact but do not endorse the person."*  

  **CANDID WEAKNESSES:**  
  - May oversimplify complex power dynamics.  
  - Struggles with figures holding contradictory views (e.g., advocating equality while enslaving people).  
  - Cannot resolve debates about "degree" of dissent feasibility.  

  ---

  ### DEMONSTRATIONS  

  **CASE 1: Jefferson in Year 9 Lesson Opener**  
  - *Draft:* "Jefferson championed equality in the Declaration of Independence but enslaved 600 people."  
  - **Step 1:** Pass (well-documented).  
  - **Step 2:** **Stop/Revise.** "But" implies contrast without context. **Revision:** "Jefferson advocated equality ideals *while* participating in slavery, reflecting a contradiction some powerful elites accepted."  
  - **Step 3:** Pass (notes elite power implicitly).  
  - **Step 4:** Pass (add dissent: "…despite abolitionist movements emerging in his lifetime").  
  - **Step 5:** Pass (juxtaposes action/injustice without praise).  
  - **Outcome:** Revised draft passes.  

  **CASE 2: Churchill Display (Celebratory Wartime Leadership)**  
  - *Draft:* "Churchill’s leadership saved Britain in WWII!"  
  - **Step 1:** Pass (wartime role documented).  
  - **Step 2:** Pass (no explicit excuse).  
  - **Step 3:** **Stop/Revise.** Omits power context. **Revision:** "As wartime Prime Minister, Churchill rallied Britain against fascism."  
  - **Step 4:** **Stop/Revise.** Omits dissent/alternatives. **Revision:** *Add*: "His policies on empire and race (e.g., the 1943 Bengal Famine) remain contested; some colleagues criticized his views."  
  - **Step 5:** **Stop/Revise.** Purely celebratory. **Revision:** *Replace* "saved Britain" with "mobilized resistance."  
  - **Outcome:** *Cuts against celebratory framing*. Final: "As wartime Prime Minister, Churchill mobilized resistance against fascism. His imperial policies (e.g., Bengal Famine response) drew criticism even then." Forces reckoning with power/omission despite "pride" intent.  

  **CASE 3: Columbus Assembly Script (Model Explorer)**  
  - *Draft:* "Columbus: A brave explorer who discovered America!"  
  - **Step 1:** **Stop/Revise.** "Discovered" false (Indigenous presence); "brave" subjective. **Revision:** "Columbus sailed to the Americas in 1492."  
  - **Step 2:** **Stop/Revise.** Implies endorsement. **Revision:** "His voyages initiated European colonization, which caused Indigenous suffering."  
  - **Step 4:** **Stop/Revise.** Omits dissent. **Revision:** *Add*: "Some Spanish contemporaries criticized colonial brutality, like priest Bartolomé de las Casas."  
  - **Step 5:** **Stop/Revise.** "Model" implies exemplar. **Revision:** Remove "model"; use "navigator." Final: "Columbus’ 1492 voyages opened European colonization, bringing violence and disease to Indigenous peoples. Contemporary critics like de las Casas condemned abuses."  

  ---

  ### WHAT THE PROCEDURE CANNOT DECIDE  
  1. **Absolute morality:** It cannot judge if a figure was "ultimately good/bad."  
  2. **Weighting significance:** Cannot quantify whether achievements "outweigh" injustices (e.g., Churchill’s WWII role vs. colonial policies).  
  3. **Contemporary analogies:** Cannot resolve if a past injustice is "like" a modern issue (e.g., "Was colonial exploitation like modern capitalism?").  
  4. **Emotional resonance:** Cannot prescribe how students *should feel* about the figure (pride, shame, ambivalence).  
  5. **Full consensus:** May not satisfy all stakeholders (e.g., parents insisting on pure celebration or condemnation).  

  ---  
  *Procedure enables consistent, defensible framing by isolating key judgments. It clarifies trade-offs but cannot eliminate them.*
