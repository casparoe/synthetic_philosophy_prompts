prompt: |-
  I'm preparing a set of teaching materials on the normative force of promises, and I keep coming back to a distinction I find harder to pin down than it should be: whether a promise obliges the promisor to *perform the promised act* or only to *make the promisee whole for whatever the promisee lost by relying on the promise*. I'd like you to construct a thought experiment, to the specifications below, that isolates exactly this distinction.

  Here is what I need. Build a single, realistic scenario — an everyday personal or workplace situation, not a trolley and not science fiction, and no longer than one paragraph — in which a promisor has made a promise that the promisee accepts, the promisee then relies on the promise by forgoing a cheaper alternative (so the reliance loss is a definite, quantifiable sum), and after the reliance an unforeseen event for which the promisor is not at fault makes performing the promised act possible but more costly for the promisor than the promisee's reliance loss. The promised act must remain something the promisor *could* still do — costly, not impossible — and the promisee must genuinely prefer the promisor's performing the act to simply taking the cheaper alternative, so that the choice between performance and compensation is live for the promisee. Do not stipulate the verdicts inside the scenario; the scenario should be the bare facts, and the verdicts should fall out of applying the theories to those facts.

  After the scenario, walk through what each of four standard accounts of why promises bind says the promisor owes, and why: the reliance-based account, the contract-based account, the will- or autonomy-based account, and the reason-based account (the view that a promise generates a new reason for the promisor to perform). I expect the reliance-based and reason-based accounts to come out on one side (no duty to perform, at most a duty to compensate) and the contract-based and will-based accounts to come out on the other (a duty to perform); I want you to say which structural feature of the case is doing the work in producing that split, what happens to the case if you remove that feature (does it collapse into a case where all four accounts agree?), and how the most plausible defender of the account that comes out worst would try to attack the case. Think very carefully before answering, and respond in the style of an expert who has actually worked through the literature. If the specifications as I've posed them are jointly unsatisfiable, or if the request rests on a confused premise about what these theories say, say so plainly and tell me where the problem is rather than forcing a scenario that can't do the job.
reasoning: |-
  Okay, let me tackle this problem step by step. The user wants a thought experiment that cleanly separates whether promises create duties to perform or merely to compensate for reliance losses. The key challenge is designing a scenario where:

  First, the reliance loss must be quantifiable and smaller than the cost of performance after an unforeseen event. That means choosing a situation with clear monetary alternatives - maybe something like home repair or event planning where backup options have exact prices.

  Second, the unforeseen event can't make performance impossible, just more expensive. Natural events like weather or supply chain issues would work here since they increase costs without being anyone's fault. 

  Third, the promisee must genuinely prefer performance over compensation even after the cost hike. This requires an act with non-monetary value - perhaps something personal like a custom gift or specialized service where alternatives lack the same meaning.

  Now considering the theoretical responses: Reliance-based views should focus on compensating the $100 loss, while will-based theories will insist on performance despite the $200 cost. The structural feature creating this split is that performance remains physically possible but economically inefficient. If we removed the unforeseen cost increase, all theories would agree on performance; if we made performance impossible, they'd all default to compensation.

  For the defender of the weakest position (likely reliance theory in this setup), they'd attack by arguing the promisee's true loss is only the reliance, not the unfulfilled expectation. But this feels unsatisfying when the promisee clearly values performance intrinsically.

  The workplace scenario with the graphic designer seems to satisfy all requirements: quantifiable alternative cost ($100), unforeseen cost increase (software crash adding $200), and non-monetary value in the original promise (brand consistency). It keeps the philosophical tension sharp without unrealistic elements.
answer: |-
  Here is a thought experiment designed to isolate the distinction, followed by analysis of the four accounts:

  **Scenario: The Graphic Designer's Commitment**  
  Ben, a freelance graphic designer, promises his long-term client, Maya, that he will design and deliver a custom logo for her new bakery by June 1st for $500. Maya accepts, trusting Ben’s reliability. She then forgoes a cheaper $100 pre-made template logo from an online marketplace (which she dislikes aesthetically but would suffice functionally). Two weeks later, Ben’s primary design computer crashes unexpectedly due to a rare hardware defect. He can still complete the logo by June 1st using backup software on an older machine, but this requires 15 extra hours of labor due to compatibility issues. The market value of Ben’s extra time is $200. Maya genuinely prefers Ben’s bespoke logo (reflecting her bakery’s ethos) over both the template and monetary compensation.

  ---

  ### Analysis of Normative Accounts  
  1. **Reliance-Based Account (e.g., Fuller, Atiyah)**  
     *What Ben owes*: Compensation for reliance losses ($100), *not performance*.  
     *Why*: The moral core is preventing harm from induced reliance. Maya’s loss is the $100 alternative she forgone. Ben’s unforeseeable hardship negates any duty to perform but not the duty to rectify losses flowing from reliance. Paying $100 makes Maya "whole" by restoring her pre-promise position.  

  2. **Contract-Based Account (e.g., classical contract law)**  
     *What Ben owes*: Performance of the promised act (delivering the logo by June 1st).  
     *Why*: Promises create enforceable expectations. Unless performance is truly impossible or excused by doctrine (e.g., impracticability), the promisor must perform regardless of cost. Ben’s $200 burden is a foreseeable business risk, not an impossibility. Maya’s preference for performance reinforces the expectation interest.  

  3. **Will-Based/Autonomy Account (e.g., Fried, Kant)**  
     *What Ben owes*: Performance.  
     *Why*: A promise transfers a "moral right" to the promisee via the promisor’s autonomous will. Maya now holds a right to Ben’s performance, not merely compensation. To pay compensation instead violates the autonomy exercised in promising and accepting. The increased cost is Ben’s problem; he bound himself unconditionally.  

  4. **Reason-Based Account (e.g., Raz, Scanlon)**  
     *What Ben owes*: Compensation ($100), *not performance*.  
     *Why*: Promises generate reasons to perform to prevent disappointment of the promisee’s *reliance-based expectations*. Here, compensating $100 fully addresses Maya’s reliance loss. The unforeseen $200 cost outweighs the reason to perform, as the net burden on Ben exceeds the value of preventing Maya’s disappointment.  

  ---

  ### Key Structural Feature & Theoretical Split  
  **The isolating feature**: *Performance remains physically possible but becomes disproportionately costly relative to the quantifiable reliance loss, while the promisee subjectively values performance over compensation.*  

  - **Split**: Reliance/Reason accounts prioritize economic efficiency and harm prevention → **compensation**. Contract/Will accounts prioritize fidelity to the promise as made → **performance**.  
  - **If removed**:  
    - If performance cost ≤ reliance loss (e.g., extra cost = $50), all accounts likely agree on performance (compensation is inadequate).  
    - If performance becomes impossible, all likely agree compensation is owed.  
    - If Maya valued compensation equally, the "live choice" vanishes, collapsing the distinction.  

  ---

  ### Attacking the Case: The Reliance Theorist's Defense  
  A sophisticated reliance theorist (e.g., Shiffrin) attacking the *will-based* account’s verdict would argue:  
  > *"The case subtly equivocates on 'harm.' Maya’s true reliance loss isn’t just $100—it’s the loss of her *reasoned choice* to forgo the template for a bespoke design. Compensating $100 ignores her non-pecuniary interest in contractual autonomy. Ben should pay the $100 *plus* damages for the lost opportunity to have a tailored logo by June 1st—potentially requiring him to perform or cover the cost of equivalent performance. Will-based accounts correctly intuit this but misattribute it to the promise itself rather than the harm of defeated reliance."*  

  **Weakest Account Here**: The **reason-based view** struggles most, as it must explain why Ben’s moral reason to perform dissolves at $200 cost when Maya’s preference for performance is undiminished. A defender (e.g., Scanlon) might counter that the promise only creates a reason to avoid *reliance harms*, not to fulfill expectations *per se*, and $100 achieves this.  

  **Conclusion**: The scenario successfully isolates the duty-to-perform vs. duty-to-compensate split. The tension arises because Contract/Will theories view the promise as binding the promisor’s *future conduct*, while Reliance/Reason theories bind the promisor only to *repair past reliance*. The case holds if "genuine preference for performance" is non-instrumental (here, aesthetic/identity-based), making compensation an inadequate substitute.
