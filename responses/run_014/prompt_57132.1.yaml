prompt: |-
  Two labs I work with have spent a year arguing about whether a certain kind of effect counts as "real", and I've been asked to draft the conceptual part of a protocol for flagging when a dispute like that is verbal rather than substantive — roughly: would the two sides agree about every concrete case if they pinned their terms down, so that the fight is only about how the word gets used? Before I write the procedure I want the spec first. What does an account of verbal disputes actually have to deliver to be good enough for that job?

  Give me the desiderata: the cases it has to come out right on (the ones everyone agrees are merely verbal, the ones everyone agrees are substantive, and the murky middle), the distinctions it can't collapse, and whatever it needs to be consistent with about how words get their meanings in the first place. For each one, the consideration that makes it a requirement rather than a nice-to-have, and whether its non-negotiable or just the taste of one camp. I especially want to know if some subset can't all be satisfied at once — my hunch is that insisting the diagnosis be checkable by the disputants themselves, from inside the argument and without first settling contested meta semantics, sits badly with insisting it never beg questions against either side. Argue for that if you agree, or point me at the real pressure points if the tension lives somewhere else. No scorecard of existing views and no reading suggestions — just the list.

  Exactly five numbered items, each a sentence or two covering the requirement, the case motivating it, and the negotiable-or-not verdict. Nothing before or after the list.
reasoning: |-
  Hmm, the user is asking for a very specific list of desiderata for diagnosing verbal disputes. They work with two labs that have been arguing for a year about whether a certain effect is "real," and they need to create a protocol to distinguish verbal disagreements from substantive ones. They want exactly five numbered items, each covering a requirement, the motivating case, and whether it's negotiable.

  The user is clearly frustrated with the ongoing dispute and wants a practical tool, not theoretical debates. They're hinting at a tension between making the diagnosis checkable by disputants themselves without resolving meta-semantics first, and ensuring it doesn't beg questions against either side. I need to address that directly.

  For the desiderata, I'll start with the core: the protocol must correctly sort clear cases. Everyone agrees on examples like "stool vs. chair" as verbal and "climate change denial" as substantive. Getting these wrong would make the protocol useless, so this is non-negotiable.

  Next, the protocol shouldn't collapse distinctions between meaning and fact. For instance, in arguments over whether viruses are "alive," the dispute mixes definitional and empirical elements. A good account must preserve this nuance to prevent forcing a false choice, which is crucial and non-negotiable.

  Third, the diagnosis has to be accessible to disputants mid-argument without requiring them to agree on meta-semantics first. If it depends on resolving how words get meanings, like in debates about "personhood" in abortion, it becomes circular. This is non-negotiable because the protocol must be practical.

  Fourth, it needs to avoid begging the question. In cases like arguing whether free will is "compatible" with determinism, the diagnosis shouldn't assume one side's semantics is correct. Otherwise, it biases the outcome, which is non-negotiable for fairness.

  Finally, I'll address the tension the user mentioned: the conflict between desiderata three and four. Making it checkable without meta-semantics might involve steps that implicitly favor one semantic view, as seen in disputes over "intelligence" in AI. This tension is inherent and negotiable only if we compromise on one end, but both are vital, so it's a pressure point to note.

  I'll keep each item concise, as requested: requirement, motivating case, and negotiable-or-not verdict. No intros or outros, just five numbered points that hit all the key issues without fluff.
answer: |-
  1.  **Must correctly classify paradigmatic clear cases:** It must identify universally agreed verbal disputes (e.g., "Is a 'stool' a 'chair'?" given agreement on object properties) as verbal, and universally agreed substantive disputes (e.g., "Does human activity cause significant climate change?" given agreement on data meaning) as substantive. *Failing this renders the account useless for its core purpose; non-negotiable.*
  2.  **Must preserve the meaning/fact distinction:** It cannot collapse the difference between disagreements arising from divergent definitions/meaning assignments ("Is a virus 'alive'?") and disagreements arising from conflicting beliefs about the non-linguistic world ("Did event X cause event Y?"). *Collapsing this distinction prevents identifying the *source* of disagreement, defeating the protocol's aim; non-negotiable.*
  3.  **Must be usable by disputants without presupposing contested meta-semantics:** The diagnostic procedure must be applicable by the disputants themselves, using only resources available *during* their dispute (shared observations, concepts, logic), without first needing to resolve external philosophical debates about how words *fundamentally* get their meaning (e.g., externalism vs. internalism). *Requiring external meta-semantic agreement makes the diagnosis impossible *within* the dispute it's meant to resolve; non-negotiable.*
  4.  **Must avoid begging the question against either disputant's semantics:** The diagnosis itself must not presuppose that one disputant's proposed definition or usage of the contested term(s) is correct or incorrect. *Begging the question invalidates the diagnosis as impartial and prevents resolution; non-negotiable.*
  5.  **Must acknowledge the inherent tension between usability and neutrality for murky cases:** For disputes involving highly theory-laden terms where meaning and fact are intertwined (e.g., "Is this AI system 'intelligent'?"), the account cannot guarantee both easy usability by disputants *and* perfect neutrality simultaneously. *The steps needed for disputants to check usability (e.g., proposing definitions, checking predictions) can subtly favor one semantic stance, creating the tension noted in the query; negotiable only in the sense that the account must explicitly recognize this limitation, not resolve it magically.*
