  ### Additional Case to Distinguish the Rules
  To cleanly separate the harm-based rule from the alternatives, the following case would be effective:

  **Case Description:**  
  *A researcher uses a non-invasive brain scan on a healthy, consenting human volunteer to study cognition, with no harm or discomfort. The same scan is then performed on a chimpanzee without its consent (as it cannot give it) for the same research. The chimpanzee is not harmed, restrained only briefly, and shows no signs of distress. The research advances medical knowledge.*

  **How this distinguishes the rules:**
  - **Under the harm-based rule**: Not speciesist because there is no harm or suffering to the chimp (similar to the parrot and elephant cases). Human comparability might not apply strongly since we perform such scans on consenting humans, but the lack of consent for the chimp could be overlooked due to no harm. Dana would likely say it's not speciesist.
  - **Under the interest-based equality rule**: Potentially speciesist because the chimp's comparable interest in autonomy or avoiding non-consensual use is disregarded due to species. Humans are asked for consent; chimps are not. This disregard, even without harm, might make it speciesist.
  - **Under the exploitation-centric rule**: Speciesist because the chimp is used as a mere resource (research tool) without consent, to its detriment (minor autonomy violation), even if unharmed. Humans are treated with respect; chimps are exploited.
  - **Under the justification-focused rule**: Not speciesist because the research has a strong justification (medical advancement), and the lack of harm makes the species difference less relevant. It mirrors culling in having a valid reason.

  This case highlights the key difference: whether non-harmful exploitation or consent violations alone can constitute speciesism. Dana's verdict here (e.g., if she focuses on the lack of consent vs. the lack of harm) would clarify if her rule is strictly harm-based or more aligned with interest/exploitation considerations. Based on her history, she might lean toward not speciesist due to no harm, but it would test the boundaries of her reasoning.
