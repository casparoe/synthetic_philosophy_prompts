prompt: |-
  You are to act as a professional metaphysician, specializing in ontology and the philosophy of persistence, who also has a talent for explaining things to technically minded people without formal training in philosophy. Think carefully and systematically before writing: begin by brainstorming, out of the view of the final answer, the full logical space of things one could reasonably demand of a theory of how objects persist through time, and only then organize that material into the deliverable described below. Do not just restate the standard textbook contrast; the point is to build the evaluation standard itself, and to be candid about where it is under dispute.

  Some background on me and why I'm asking. I'm a software engineer, no philosophy background. In my day job I keep running into the problem of modeling "the same thing over time": we have databases where a customer record is a single mutable row, other systems where every change is an immutable event with a validity interval and the "customer" is just the whole timeline, and a third pattern where each snapshot is a first-class version object and "the customer" is shorthand for a lineage of versions with an identity pointer to the latest one. I recently found out that metaphysicians have been arguing about which of these is the correct description of reality, under the names endurantism, perdurantism, and stage theory, and I want to read the primary literature. But before I do, I want the specification: what any adequate theory of persistence has to deliver, so I can evaluate what I read against it rather than just absorbing whichever author I pick up first.

  Here is what I want you to produce:

  1. A list of desiderata: what a theory of how objects persist through time must get right or explain. For each one, give the concrete case or consideration that motivates it, phrased so a layperson can evaluate it (e.g., a banana being green on Monday and yellow on Friday; a person surviving the replacement of all their atoms; a ship rebuilt plank by plank; a live human body and a corpse in the same location; the question of how many objects are in a room full of molecules). You should decide for yourself which desiderata belong on the list — I specifically do not want a list lifted from any one author's paper — but the list should be long enough to be a real constraint, roughly eight to twelve items, and should at minimum engage with: how things can have different properties at different times while remaining one thing; what happens in fission and fusion cases; how persistence relates to composition and the vagueness of when a thing begins and ends; how the theory handles counting questions; and what constraints, if any, modern physics puts on a theory of persistence (I gather the lack of an absolute "now" is somehow relevant, but I don't understand how, so explain that part carefully).

  2. For each desideratum, mark whether you consider it non-negotiable — a theory that fails it is not merely unattractive but not really a theory of persistence at all — or whether it reflects the prejudices of a particular camp, and say which camp. I want to be able to tell these apart when I read the literature, since I expect authors to present their own preferences as bare requirements.

  3. Flag any pairs or larger subsets of your desiderata that you suspect cannot be jointly satisfied, and explain why. If you think no subset is jointly unsatisfiable, say that and defend it briefly. This is the part I most want to see, so do not skip it even if the honest answer involves uncertainty.

  4. Identify the single desideratum that does the most work to exclude candidate theories, in the sense that settling it would decide most of the debate, and explain why the debate has tended to organize itself around that one rather than some other.

  5. Then, briefly, score the three pictures I named above — endurantism (objects are wholly present at each time they exist), the worm version of perdurantism (objects are four-dimensional wholes with temporal parts), and stage theory (objects are instantaneous stages, and persistence is a matter of temporal counterparts) — against your list. Keep this section short: a paragraph per position at most, plus any fourth position you think deserves a seat at the table. The weight of your answer should be on the criteria, not the scorecard.

  A few constraints on style and content: do not provide a bibliography or reading list; I am assembling one separately. Do not assume I know any technical vocabulary — define every term of art in plain language at first use, including terms like "temporal part," "counterpart," and "temporary intrinsics" if you use them. Where you describe a well-known thought experiment, describe it in enough detail that I can evaluate it from your description alone. If a desideratum is standardly motivated by a case you find overrated, say so and either drop it or replace it with a better-motivated version. Be explicit about your own judgments rather than hiding them behind "some philosophers think" — I want to be able to subtract your views later, which I can only do if I can see them.
