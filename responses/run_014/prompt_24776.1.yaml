prompt: |-
  I do data viz for a public health org and we keep getting asked to make "infographics" that are basically just bar charts with clip art, and I want to push us toward something more like Neurath's pictorial language idea — the Isotype thing where you build diagrams of social facts out of standerdized little pictorial elements, like rows of the same person-figure to show a proportion, so the picture is grounded in countable material stuff instead of just a designer's spin. I want a decison procedure my design team can actually run step by step when we get a statistic we're supposed to turn into one of these panels. For each step I want the question to ask, what counts as a sufficient answer to it, and where the procedure says no and stops. The steps, in order: (1) whether the fact we want to show can even be represented in a pictorial language at all, and what kinds of things resist it — rates, abstractions, negatives, "lack of X," stuff that isn't a countable material thing; (2) how to pick and standardize the elements we build it out of, so the same element means the same thing across all our panels; (3) how to handle scale and proportion, i.e. when the row-of-100-figures trick is the right tool and when it misleads, and what to do when the number is too big or too small to count out by hand; (4) how to check the finished picture for the failure modes Neurath himself was worried about, like a picture that looks more precise than the data actually are, or one that quietly picks a side by what it makes visible and what it leaves out; and (5) where the procedure has to stop and hand the decision back to a person, because choosing which facts to foreground in the first place is an editorial or value call, not something the formalism settles. Mark which steps are judgment calls dressed up as procedure. Then run the whole thing on two concrete facts: the share of a city's households that don't have access to a car, and the change in a region's infant mortality rate over a decade. I suspect the second one hits a wall on a rate-of-change and I want to see exactly where and why.
reasoning: |-
  We are designing a decision procedure for creating Isotype-style infographics. The steps are:

  1. **Assess Representability**: Can the fact be represented in a pictorial language? What kinds of facts resist it?
  2. **Element Standardization**: How to pick and standardize the pictorial elements?
  3. **Scale and Proportion**: How to handle scale and proportion? When to use a row of figures and how to handle large/small numbers?
  4. **Validation Checks**: How to check for failure modes (e.g., false precision, bias in visibility)?
  5. **Editorial Handoff**: When does the procedure stop and require human judgment?

  We must mark which steps are judgment calls dressed as procedure. Then, we apply the procedure to two examples:

  **Example 1**: The share of a city's households that don't have access to a car.

  **Example 2**: The change in a region's infant mortality rate over a decade.

  Let's break down each step.

  ---

  ### Step 1: Assess Representability

  **Question**: Can the fact be represented in a pictorial language?

  **Sufficient Answer**: The fact must be about a countable and concrete entity. The pictorial language is best for:
  - Discrete, tangible objects (e.g., people, cars, houses)
  - Proportions of a whole (using part-whole relationships)
  - Counts (how many of something)

  **Resists Representation**:
  - Abstract concepts (e.g., happiness, democracy)
  - Rates (e.g., per 100,000) unless converted to counts in a defined population
  - Negatives or "lack of X" (e.g., "without a car") can be tricky but can be shown by absence or contrast.
  - Continuous data (e.g., temperature change) unless discretized.
  - Very large or very small numbers (handled in Step 3).

  **Stop Condition**: If the fact is abstract, a rate without a clear base, or a negative that cannot be shown by contrast, then pictorial representation may not be appropriate.

  **Judgment Call?** Yes. Determining what is "countable and concrete" is subjective. What one person considers concrete (e.g., "access to healthcare") might be abstract to another.

  ---

  ### Step 2: Element Standardization

  **Question**: How to pick and standardize the pictorial elements?

  **Sufficient Answer**:
  - Create a style guide of standardized symbols (e.g., a person figure, a car, a house) that are simple, recognizable, and culturally appropriate.
  - Each symbol must have a clear, consistent meaning across all panels (e.g., one person figure always represents one person, or a fixed number of persons if scaled).
  - Symbols should be distinct and avoid ambiguity.

  **Stop Condition**: If a suitable symbol cannot be agreed upon or standardized, the procedure stops.

  **Judgment Call?** Yes. The choice of symbols and their design involves aesthetic and cultural judgments.

  ---

  ### Step 3: Scale and Proportion

  **Question**: How to handle scale and proportion?

  **Sufficient Answer**:
  - For proportions: Use a grid or row of identical symbols (e.g., 100 figures) and color or mark a subset to show the proportion.
  - For large numbers: Use a single symbol to represent a fixed number of units (e.g., one figure = 1,000 people). The scale must be clearly labeled.
  - For small numbers: Show the actual count if feasible (e.g., 5 out of 100). If the proportion is too small to see, consider grouping or using a magnified inset.

  **Pitfalls**:
  - Avoid misleading representations: ensure the visual proportion matches the numerical proportion.
  - Do not use partial symbols (each symbol must be whole). If the number isn't an integer, round appropriately and note the rounding.

  **Stop Condition**: If the number is too large or too small to represent without extreme scaling (e.g., one symbol representing millions, making the graphic too large or too sparse) and no workaround is feasible, then stop.

  **Judgment Call?** Yes. Deciding on the scale factor and how to round involves judgment.

  ---

  ### Step 4: Validation Checks

  **Question**: How to check for failure modes?

  **Sufficient Answer**:
  - **False precision**: Ensure the graphic does not imply more precision than the data has (e.g., if data is rounded to the nearest 10%, don't show individual figures that suggest 1% increments).
  - **Bias in visibility**: Check what is shown and what is omitted. Are both sides of a comparison represented? Does the symbol choice or arrangement lead the viewer to a particular conclusion?
  - **Clarity**: Is the graphic immediately understandable? Test with a sample audience.

  **Stop Condition**: If the graphic fails any check, it must be redesigned or abandoned.

  **Judgment Call?** Partially. Some checks (like false precision) can be objective, but bias and clarity are often subjective.

  ---

  ### Step 5: Editorial Handoff

  **Question**: When must the procedure stop for human judgment?

  **Sufficient Answer**: 
  - The choice of which facts to show and which to omit is inherently editorial.
  - The framing of the fact (e.g., showing "lack of cars" vs. "car ownership") involves values.

  **Stop Condition**: At the beginning and end of the process, when choosing the fact to represent and when interpreting the results, human judgment is required.

  **Judgment Call?** This step explicitly acknowledges the need for judgment.

  ---

  ### Summary of Judgment Calls
  - Step 1: Judgment call (what is representable?)
  - Step 2: Judgment call (symbol choice)
  - Step 3: Judgment call (scaling and rounding)
  - Step 4: Partially judgment (especially bias and clarity)
  - Step 5: Explicitly about judgment.

  ---

  ### Applying the Procedure to Examples

  **Example 1: Share of a city's households without car access**

  **Step 1: Representability**
  - Fact: Proportion of households without a car. This is a proportion of a concrete entity (households) and can be represented by showing a group of household symbols and marking those without a car.
  - Negatives ("without") can be shown by absence or by using two colors: one for households with cars and one without.
  - Sufficient? Yes.

  **Step 2: Element Standardization**
  - Standard element: A simple house symbol to represent a household. We must define one house = one household? Or use a scale? Since it's a proportion, we can use a grid of houses (e.g., 100 houses) to show the share.
  - For "without a car", we might use a grayed-out house or a house with a crossed-out car? But note: we are representing households, not cars. Alternatively, we can show two types: a house with a car symbol and a house without. But then we are introducing two symbols. Standardization: Let's say we use a house symbol and then a car symbol to denote access? Or more simply, we can use one house symbol and color-code: green for with car, red for without.
  - We decide: one house symbol per household (or per fixed number of households if scaled). Color: green = with car, red = without. We'll standardize the house symbol and the color scheme.

  **Step 3: Scale and Proportion**
  - Suppose there are 1,000,000 households and 30% without a car. We cannot show 1,000,000 houses. We scale: one house symbol = 10,000 households. Then we show 100 houses (representing 1,000,000 households). Then 30 houses are red (without car) and 70 green (with car). 
  - Alternatively, to avoid scaling, we can show a grid of 100 houses and then 30 red and 70 green. This is a proportion and doesn't require scaling if we use a fixed grid (100 is manageable).
  - We choose the 100-house grid: each house represents 1% of households. Then 30 red houses show the share without a car.

  **Step 4: Validation Checks**
  - False precision: If the data is 30.5%, we round to 30 or 31? We must round to the nearest integer and note the rounding. But in a 100-house grid, we can only show whole houses. So we round and note: "Approximately 31%".
  - Bias: By showing the red houses (without car), we highlight the lack. Is that biased? We must also show the majority (with car) to provide context. The graphic does both. It's balanced.
  - Clarity: The 100-house grid with color coding is clear.

  **Step 5: Editorial Handoff**
  - The choice to represent "without a car" (rather than "with a car") is an editorial decision. The procedure doesn't decide that.

  **Result**: The infographic is feasible.

  ---

  **Example 2: Change in a region's infant mortality rate over a decade**

  **Step 1: Representability**
  - Fact: Change in a rate (infant mortality rate, typically per 1,000 live births) over time. This is a rate of change of a rate. The base is a rate (not a count) and the change is an abstract trend.
  - Can we represent it? We can try to represent the rate at two time points by converting to counts (if we know the number of births) and then show the change. But the change itself (the difference) is not a countable thing.
  - Alternatively, we might show two groups of infant symbols (for two years) to represent the number of deaths. But note: the rate is per 1,000 births, so we must also represent births? And then the change in the rate might be due to changes in birth counts? 
  - The challenge: The rate is a ratio. To show it pictorially, we need to fix the denominator (e.g., 1,000 births) for both years and then show the number of deaths (as a count) for each year. Then the change in the rate is the change in the count per 1,000 births.
  - But what if we want to show the trend? We might show two panels: one for year 1 and one for year 2, each with 1,000 baby symbols and the deceased ones marked. Then the change is the difference in the number of marked symbols.
  - However, the procedure stops if the fact is the change itself (as an abstract trend line) and not the two points. If we are asked to show the change over the decade (with multiple points), then we cannot easily show that with a grid of symbols for each year (it would be too big). 
  - Also, note: infant mortality is a sensitive topic. The symbol (a baby) must be chosen carefully to avoid being distressing.

  **Decision**: We can represent two points in time (if we fix the denominator) but not a continuous trend without multiple panels. If the request is for a line chart of the rate over time, that is abstract and not easily represented in Isotype.

  **Stop Condition?** The procedure may stop at Step 1 if we cannot break down the change into two comparable counts. But let's try.

  **Step 2: Element Standardization**
  - Standard element: A baby symbol to represent an infant. We must define: one symbol = one infant? Or for the rate, we fix the denominator: 1,000 live births. Then one baby symbol might represent one infant at risk? But we are representing deaths. So we might show a group of 1,000 baby symbols and mark the ones who died (e.g., with a cross or a different color). 
  - We standardize: a baby symbol for a live birth, and then we mark the deceased infants.

  **Step 3: Scale and Proportion**
  - For a fixed denominator (1,000 live births) we show two panels: one for year 1 and one for year 10. We show 1,000 baby symbols for each panel and mark the number of deaths (say, 50 for year 1 and 40 for year 2). Then we can see the reduction by 10 marks.
  - But what if the actual number of births changed? The rate is per 1,000, so we are holding the denominator constant. This is acceptable because the rate is defined that way.
  - However, if the change is small (e.g., from 50 to 49 per 1,000) we would only mark 50 and 49. The difference of 1 might be hard to see. We might need to magnify or use a different representation? 
  - Also, if we are to show the trend over 10 years, we would need 10 panels? That might be too many.

  **Step 4: Validation Checks**
  - False precision: The rate is per 1,000, so we are showing integers. If the rate is 49.5, we round to 50? Then we are showing 50 deaths per 1,000. We note rounding.
  - Bias: By showing the deaths, we are highlighting infant mortality. This is the fact, but we must ensure the context (that it is per 1,000 live births) is clear.
  - Clarity: Two panels side by side showing the change might be clear. But for a trend over 10 years, 10 panels would be cumbersome.

  **Step 5: Editorial Handoff**
  - The choice to show two endpoints (and not the entire trend) is an editorial decision. Also, the focus on mortality (rather than survival) is a value call.

  **Result**: The infographic is feasible only for two points in time. If the request is for the entire trend, we hit a wall at Step 1 (or Step 3) because representing a trend (a line) is abstract and not easily broken into countable units. We might then fall back to a line chart and explain that Isotype is not suitable for trends.

  ---

  ### Conclusion for Example 2
  The change in infant mortality rate over a decade (as a trend) hits a wall at Step 1 because a trend is a continuous abstract concept that is not directly representable as countable units. We can represent two points (by converting the rate to counts in a fixed denominator), but not the entire trend without multiple panels (which becomes unwieldy). Thus, the procedure stops at Step 1 for the trend representation and continues for two points.

  **Final Note**: The procedure provides a structured approach but requires human judgment at multiple steps. It helps avoid pitfalls but does not eliminate the need for thoughtful design.
answer: |-
  ### Decision Procedure for Isotype-Style Pictorial Infographics

  This 5-step procedure guides your team through creating Isotype-inspired graphics. Steps marked with **🤔 JUDGMENT** involve unavoidable human decisions disguised as protocol. The procedure stops ("**HALT**") if any step lacks a sufficient answer.

  ---

  #### **Step 1: Representability Check**  
  *Question: Can this fact be represented as countable, concrete units?*  
  **Sufficient Answer**:  
  - Fact describes **discrete entities** (people, objects, events) or **proportions** of a whole.  
  - Avoids:  
    - Abstract rates (e.g., "5.2 deaths per 1,000") without a fixed denominator.  
    - Negations ("lack of X") unless shown via *absence* within a defined group.  
    - Continuous/speculative concepts ("happiness," "risk perception").  
  **HALT If**:  
    - Fact is inherently abstract (e.g., "democracy index"), a ratio without a base population, or relies on "non-things" (e.g., "policy impact").  
  **🤔 JUDGMENT**: Defining "concrete" depends on context (e.g., "unmet healthcare needs" might be reframed as people receiving/not receiving care).

  ---

  #### **Step 2: Element Standardization**  
  *Question: What standardized pictorial element (pictogram) can represent 1 countable unit?*  
  **Sufficient Answer**:  
  - Element is **simple, repeatable, and unambiguous** (e.g., a stick-figure person for individuals, a house for households).  
  - **Style guide rules**:  
    - Same element = same meaning globally (e.g., "car" pictogram never used for "traffic").  
    - Elements avoid cultural bias (e.g., gender-neutral figures).  
  **HALT If**:  
    - No agreed-upon pictogram exists after consulting the style guide (e.g., "corruption" has no standard symbol).  
  **🤔 JUDGMENT**: Selecting symbols involves cultural/contextual interpretation.

  ---

  #### **Step 3: Scale & Proportion Handling**  
  *Question: How to scale units without distorting proportions?*  
  **Sufficient Answer**:  
  - **<100 units**: Show 1:1 (e.g., 50 people = 50 figures).  
  - **>100 units**: Use **"one pictogram = X units"** scaling (e.g., 1 figure = 100 people).  
  - **Tiny proportions**: Use an **inset magnifier** (e.g., a zoomed-in box showing 5 out of 10,000).  
  **Avoid**:  
    - Rows-of-figures if partial units arise (e.g., 250.5 people). *Always round to whole units*.  
    - Scaling that misrepresents order-of-magnitude differences (e.g., 1 figure=1,000 vs. 1 figure=10,000 in same graphic).  
  **HALT If**:  
    - Scaling requires fractional pictograms or exaggerates differences (e.g., showing 0.001% as 1 tiny figure in 100,000).  
  **🤔 JUDGMENT**: Choosing scale factors and rounding thresholds.

  ---

  #### **Step 4: Validation & Bias Check**  
  *Question: Does the graphic mislead via overprecision, omission, or framing?*  
  **Sufficient Answer**:  
  - **Precision**: Icons match data rounding (e.g., 53% shown as 53/100 figures, not 52.9 or 53.1).  
  - **Bias audit**:  
    - What is *not* shown? (e.g., only showing "carless households" without "car-owning" context).  
    - Do visuals imply causality? (e.g., arrows pointing to "decline" icons).  
  - **Test**: Show graphic to 3 non-experts; they must accurately paraphrase the fact.  
  **HALT If**:  
    - Data uncertainty is high (e.g., "~40–60%") but graphic implies exact counts.  
    - Testers misinterpret the core fact.  
  **🤔 JUDGMENT**: Assessing "misleading" framing is subjective.

  ---

  #### **Step 5: Editorial Handoff**  
  *Question: Does this choice reflect values, not just formalism?*  
  **Sufficient Answer**:  
  - Acknowledge that **fact selection**, **framing** (e.g., "carless" vs. "car access"), and **context** (e.g., including/excluding historical data) are human decisions.  
  - Procedure **always stops here** for final review by stakeholders.  
  **Non-Negotiable**:  
    - The *how* is procedural; the *what* and *why* are editorial.  
  **🤔 JUDGMENT**: All value-laden choices are made explicitly here.

  ---

  ### Procedure Applied to Concrete Examples

  #### **Example 1: Share of City Households Without Car Access**  
  - **Step 1**: ✅ Representable. "Households without cars" is a countable proportion (concrete: households). Negation ("without") handled by showing absence in a group.  
  - **Step 2**: 🏠 Standard element = *1 house pictogram = 1 household*. Style guide defines "house" icon.  
  - **Step 3**: City has 800,000 households; 20% lack cars.  
    - Use scaling: 1 house = 1,000 households → 800 houses total.  
    - 160 houses grayed out (no car), 640 colored (car access).  
  - **Step 4**: ✅ Clear part-whole relationship. No false precision (20% exact). Bias check: Shows both groups.  
  - **Step 5**: Editorial: Framing focuses on "lack" (value decision to highlight inequity). ✅ Proceed.  

  #### **Example 2: Change in Infant Mortality Rate (IMR) Over Decade**  
  - **Step 1**: ⛔️ **HALT**. Fact is a *rate trend* (e.g., "IMR fell from 8 to 5 per 1,000 births"). Rates resist direct representation:  
    - "Per 1,000 births" is abstract (not a concrete group).  
    - *Change* is a relationship between rates, not countable units.  
  - **Workaround Attempt**:  
    - *If* reframed as **counts for a fixed base** (e.g., "in 10,000 births, deaths fell from 80 to 50"):  
      - Step 1: ✅ Proceed (countable deaths).  
      - Step 2: 👶 Standard element = *1 baby pictogram = 1 infant death*.  
      - Step 3: Show two panels:  
        - Year 1: 80/10,000 figures (with 10,000 implied by context).  
        - Year 10: 50/10,000 figures.  
      - Step 4: ⚠️ **Risk of bias**: Graphic implies "deaths avoided" but omits *why* (e.g., better healthcare vs. fewer births).  
      - Step 5: Editorial: Choosing a fixed base hides demographic shifts.  
    - **Result**: Possible but misleading. *Better to use a line chart*.  

  **Why Rate-of-Change Hits a Wall**:  
  Isotype requires **static, countable units**. Rate changes are:  
  1. **Relational** (comparison between abstract measures).  
  2. **Dynamic** (trends imply motion, hard to show with static pictograms).  
  3. **Scale-dependent** (e.g., a 0.5% drop in IMR might require showing 9950/10,000 vs. 9955/10,000, which is visually indistinguishable).  

  ---

  ### Summary of Judgment Calls  
  - **Step 1**: 🤔 What is "countable"?  
  - **Step 2**: 🤔 Symbol selection/meaning.  
  - **Step 3**: 🤔 Scaling/rounding thresholds.  
  - **Step 4**: 🤔 Bias interpretation.  
  - **Step 5**: 🤔 All value-based framing.  

  This procedure forces explicit deliberation at friction points, ensuring Isotype’s ethos—**clarity through standardized repetition**—isn’t undermined by unexamined choices. When abstraction creeps in (like rates), it flags the need for non-pictorial alternatives.
