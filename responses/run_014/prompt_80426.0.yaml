prompt: |-
  You're a professional philosopher who specializes in Kant's moral theory, so think carefully here and start by brainstorming the space of possible readings before you commit to a menu. My debate partner keeps citing "act only if you could will that everyone acted that way" as if it's Kant's universalizability test, and he's using it to shut down my argument that I shouldn't buy sweatshop goods: if everyone boycotted, those countries' economies would collapse, so obviously I can't "will everyone doing it," so the boycott fails the test. I'm pretty sure hes applying something different from what Kant actually had, but I cant pin down exactly what's wrong. Can you lay out the different precise principles that slogan could be standing in for — what kind of "universal" is being invoked, what each test actually checks for, which readings are trivial or just misapplications, and which of them would actually condemn the boycott maxim?
reasoning: |-
  Okay, the user is dealing with a debate partner who's using a simplified version of Kant's universalizability test to argue against boycotting sweatshop goods. Let me unpack this carefully.

  First, I notice the user is clearly familiar with philosophical discourse but feels stuck on pinpointing the exact flaw in their opponent's application. Their frustration suggests they intuitively sense the misapplication but lack the technical vocabulary to dismantle it. 

  Hmm... the core issue seems to be about three layers of confusion: (1) the debate partner's conflation of hypothetical outcomes with moral permissibility, (2) misunderstanding what "willing universalization" actually means for Kant, and (3) possibly confusing the Formula of Universal Law with the Formula of Humanity. 

  I should start by mapping all possible interpretations of that slogan they quoted. Let me mentally list them: 

  First reading - Literal consequence universalization. That's clearly wrong because Kant isn't utilitarian. The "collapsed economy" argument would make any action impossible since universalizing anything creates absurd outcomes. Like if everyone quit their jobs simultaneously, society collapses - but that doesn't make employment immoral. 

  Second reading - Logical contradiction test. For sweatshop boycotts, the maxim "I'll boycott unethical goods to pressure reform" seems logically consistent when universalized. No inherent contradiction. 

  Third reading - Volitional contradiction. Here's where it gets interesting. Could you rationally will a world where everyone boycotts sweatshops? Well, yes - if the goal is ethical production. The suffering during transition might be problematic, but Kant would likely focus on the intent to end exploitation. 

  Ah! And the Formula of Humanity angle is crucial. Buying sweatshop goods treats workers as mere means, while boycotting respects their dignity. The economic collapse argument ironically commits the same error - treating workers as mere cogs rather than ends. 

  The user's real need seems to be: how to expose the opponent's category error between empirical consequences and a priori reasoning. I should emphasize Kant's distinction between practical contradictions (irrelevant) vs logical/volitional ones. 

  Also noting the user might benefit from concrete maxim reformulation. Instead of "boycotting sweatshops", specifying "boycotting to abolish exploitative systems" makes the ethical intent clearer. 

  ...Wait, is there a deeper layer here? The user might be wrestling with whether Kantian ethics can handle real-world complexity. Maybe I should subtly reinforce that moral duty exists even when systems make compliance difficult - hence the importance of distinguishing "ought" from pragmatic outcomes.
answer: |-
  Your debate partner is misapplying Kant's test through a common misunderstanding. Let's dissect the precise formulations of Kant's universalizability principle and evaluate the boycott case systematically. Here's a breakdown of possible readings:

  ### 1. **Literal Consequence Universalization (Your Partner's Flawed Reading)**
     - **Principle:** "If universal adoption of an action would cause disastrous consequences, the act is immoral."
     - **Test Applied:** Boycott fails because if *everyone* boycotted sweatshops, economies would collapse.
     - **Why Wrong:** 
       - Kant *explicitly rejects* judging maxims by empirical consequences (*Groundwork*, 4:424). His test is about *logical* and *volitional* consistency, not predicting outcomes.
       - **Trivializes Ethics:** This makes any action immoral (e.g., "If everyone became a doctor, no one would farm = starvation"). Kant’s test isn’t about real-world causal chains.

  ### 2. **Logical Contradiction in Conception (Kant's First Test)**
     - **Principle:** "Can you conceive a world where everyone acts on your maxim *without logical contradiction*?"
     - **Test Applied:**  
       - **Maxim (Properly Formulated):** "I will boycott goods produced in exploitative conditions to reduce harm and incentivize ethical labor practices."  
       - **Universalized:** "Everyone boycotts goods produced in exploitative conditions."  
       - **Analysis:** No *logical* contradiction. A world where consumers universally reject exploitation is coherent.  
     - **Result:** **Permissible**. Sweatshop boycott passes this test.

  ### 3. **Volitional Contradiction in the Will (Kant's Second Test)**
     - **Principle:** "Could you *rationally will* your maxim as universal law *without undermining your own goals*?"
     - **Test Applied:**  
       - **Key Question:** Would universal boycott *defeat the purpose* of your maxim?  
       - **Analysis:**  
         - Your goal: End exploitation.  
         - Universal boycott *advances* this goal by forcing reform. Economic "collapse" (a temporary disruption) isn't relevant to *volitional* contradiction.  
         - *Volitional failure would occur if*, e.g., your maxim required exploitative systems to exist *for you to boycott them* (no contradiction here).  
     - **Result:** **Permissible**. You *can* rationally will this universal law.

  ### 4. **Formula of Humanity Test (The Real Issue)**
     - **Principle:** "Act so that you treat humanity as an end, never merely as a means." (*Groundwork*, 4:429)  
     - **Test Applied:**  
       - **Buying Sweatshop Goods:** Treats workers as *mere means* to cheap products, ignoring their autonomy and dignity.  
       - **Boycotting:** Treats workers as *ends* by refusing to participate in their exploitation.  
     - **Crucial Point:** The economic-collapse argument *itself* treats workers as mere cogs in a machine—prioritizing systemic stability over their humanity.  
     - **Result:** **Buying sweatshop goods fails this test**. Boycotting aligns with it.

  ### Why Your Partner's Argument Fails:
  - **Misreads Universalizability:** They confuse Kant’s *a priori* test (about rational consistency) with *empirical* prediction (consequentialism).  
  - **Flawed Maxim Formulation:** Their test implicitly uses a maxim like: "I will boycott despite knowing universalization would collapse economies." This distorts the agent’s actual intent.  
  - **Ignores Moral Motivation:** Kant cares about *why* you act. Boycotting to uphold human dignity is fundamentally different from, say, boycotting to harm a country’s economy.  

  ### Key Kantian Insights for Your Argument:
  1. **Maxim Matters:** Properly formulate your maxim to reflect your moral intent:  
     *"I will refrain from purchasing goods made in conditions violating human dignity to promote ethical labor practices."*  
     
  2. **Reject Consequentialism:** Kantian ethics judges the *principle* behind the action, not its hypothetical outcomes.  

  3. **Emphasize Humanity:** The core condemnation of sweatshops is treating workers as tools. Boycotting affirms their status as ends-in-themselves.  

  **Conclusion:** Your boycott is **Kantianly defensible**. Your partner’s application commits three errors: (1) conflating universalizability with utilitarianism, (2) misformulating the maxim, and (3) ignoring the Formula of Humanity. Cite *Groundwork* 4:424 to show Kant explicitly rejects consequence-based judgments in the universalization test.
