answer: |-
  Here's a precise comparison of how endurantism and perdurantism handle the **Problem of Temporary Intrinsics (PTI)**, specifically highlighting why the **anti-attitude case** (e.g., being happy *and* sad) is particularly acute for endurantists:

  **The Core Problem of Temporary Intrinsics:**
  *   How can one and the *same*, *numerically identical* object have incompatible intrinsic properties (like shape, temperature, or happiness/sadness) at different times?
  *   **Incompatibility:** These properties seem contradictory if possessed by the *whole* object at the *same* time and in the *same* respect. (A *single* object can't be both a perfect sphere and a perfect cube *simultaneously*, or fully happy and fully sad *simultaneously*).

  **Endurantism's Solution & Its Vulnerability:**
  1.  **Thesis:** The *whole* object exists at each moment it persists. There is only one entity (e.g., "Alice") present at t1 and t2.
  2.  **Solution to PTI:** Properties are *indexed* to times. Alice-at-t1 has property P (e.g., happy); Alice-at-t2 has property ~P (e.g., sad).
  3.  **How it Avoids Contradiction (Standardly):** The object doesn't have P and ~P *simultaneously* or *simpliciter*. It has *P-at-t1* and *~P-at-t2*. The properties are *relational* or *time-bound*: "is happy *at t1*", "is sad *at t2*".
  4.  **The Vulnerability (The "Anti-Attitude" Challenge):** This seems to change the *nature* of the properties.
      *   **For Shapes/Masses:** Saying "The paperweight is spherical-at-t1 and cubical-at-t2" might feel awkward, but we can accept that shapes are relations to times. Being spherical *just is* being spherical-at-a-time.
      *   **For Anti-Attitudes (Happy/Sad):** This is much harder to swallow. Happiness and sadness are **intrinsically experiential states**. Saying "Alice is happy-at-t1" feels like it describes a genuine, intrinsic state *of Alice* at t1. Similarly, "Alice is sad-at-t2" describes a genuine intrinsic state *of Alice* at t2. Crucially, *both* "happy-at-t1" and "sad-at-t2" are properties *possessed by the numerically identical whole Alice* (since she's wholly present at both times). While there's no *logical* contradiction (as they are indexed), there's a deep **metaphysical tension**: How can the *very same subject of experience*, wholly present then and now, be the bearer of *both* the intrinsic state of happiness (bound to t1) *and* the intrinsic state of sadness (bound to t2)? It feels like these incompatible experiential states are both "owned" by the same core self in a way that indexed shapes aren't. The endurantist struggles to explain *how* the numerically identical subject can *be* the bearer of these fundamentally incompatible intrinsic experiences, even at different times, without fragmenting the subject.

  **Perdurantism's Solution & Its Advantage:**
  1.  **Thesis:** Persisting objects are 4D "spacetime worms." They persist by having different temporal parts at different times. Alice is composed of Alice-stage-t1, Alice-stage-t2, etc.
  2.  **Solution to PTI:** Different temporal parts bear different properties. Alice-stage-t1 is happy. Alice-stage-t2 is sad.
  3.  **How it Avoids Contradiction:** The *whole* 4D worm (Alice) is never said to be happy *simpliciter* or sad *simpliciter*. Only its temporal parts have these properties *non-relationally*. The whole worm has the property "has a happy temporal part at t1" and "has a sad temporal part at t2" – which are compatible.
  4.  **Advantage with Anti-Attitudes:** This dissolves the metaphysical tension completely for the anti-attitude case.
      *   The property "is happy" is borne *simpliciter* by the temporal part *at t1*.
      *   The property "is sad" is borne *simpliciter* by a *different* temporal part *at t2*.
      *   The *whole* Alice (the worm) doesn't bear either property intrinsically and non-relationally. It's no more contradictory for Alice to have a happy part and a sad part than it is for a road to have a bumpy part and a smooth part. The *subject* of the happy experience (the t1 part) is *numerically distinct* from the *subject* of the sad experience (the t2 part). There is no single, wholly present subject bearing both incompatible intrinsic states.

  **Why the Anti-Attitude Case is Sharper for Endurantism:**
  *   **Intrinsic Nature of Experience:** Happiness and sadness are not just properties *of* the object; they are constitutive *of the subject's state of being* at a time. Indexing ("happy-at-t1") feels like it trivializes the deep, intrinsic, immediate nature of the experience. It turns a core state of consciousness into a relation.
  *   **Singleness of the Subject:** Endurantism insists the *whole* subject is present at t1 *and* t2. This makes it harder to conceptually separate *who* is happy at t1 from *who* is sad at t2 – it's the *same whole self* both times. This forces the question: How can the *identical* subject *be* both states (even at different times) without those states somehow "belonging" to the same core in a conflicting way? Perdurantism sidesteps this by having *different* subjects (the temporal parts) for each state.
  *   **Metaphysical Intuition vs. Logic:** While endurantism avoids formal contradiction through indexing, the anti-attitude case highlights a deep *metaphysical unease* about how a single, unified subject can undergo radical intrinsic change in its core states of being without being temporally fragmented. Perdurantism embraces the fragmentation explicitly, resolving the unease at the cost of a different intuition about personal identity.

  **Novel Scene Dialogue Suggestion:**

  **Endurantist (E):** "Alice *herself* was happy yesterday, and Alice *herself* is sad today. The very same person, wholly present at both moments. She changed. We account for this by saying she possessed the property 'being happy' *yesterday* and possesses the property 'being sad' *today*. Different times, different properties – no contradiction."

  **Perdurantist (P):** "But *how*? You say the *whole* Alice is present both days. Yesterday's wholly present Alice is happy. Today's wholly present Alice is sad. So the *same* entity – the core Alice – bears both happiness and sadness. Indexing masks the problem. Think of the *experience itself*. The feeling of joy yesterday was an intrinsic state of *that* subject. The feeling of sorrow today is an intrinsic state of *that* subject. And you insist it's the *same* subject! How can the identical bearer of experience genuinely *be* joy *and* sorrow, even spread out? You've turned profound states of being into mere relations to times. My view is cleaner: only *yesterday's temporal part* of Alice was happy. Only *today's temporal part* is sad. Different subjects of experience within the larger whole. The Alice sitting here now, the current temporal part, is simply sad. There's no residue of yesterday's happiness clinging to *this* part of her. The contradiction vanishes because the bearers are distinct."

  **E:** "But that fragments her! Alice isn't a worm, she's a person *here now*! You're saying the person experiencing sadness *isn't* the one who experienced joy yesterday – it's just a *part* connected to it. That denies the unity of her identity over time!"

  **P:** "And your view struggles to explain how that unified identity can genuinely *be* both states without conflict. My 'fragmentation' cleanly resolves the intrinsic properties. Your unity creates a tension when those properties are as fundamental as happiness and sadness."

  This exchange captures the core disagreement: Endurantism preserves strict numerical identity at the cost of making intrinsic states relational, which feels particularly problematic for conscious states. Perdurantism preserves the non-relational nature of intrinsic properties (at the part level) at the cost of fragmenting the subject over time. The anti-attitude case sharpens this trade-off dramatically.
