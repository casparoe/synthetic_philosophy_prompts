prompt: |-
  I am a second-year undergraduate currently taking a course on normative ethics. In our recent seminar on supererogation, our tutor characterised a supererogatory act as one that is neither morally required nor morally forbidden, that is morally good to perform and morally praiseworthy, and whose omission is permissible and does not deserve blame or moral criticism. I am having difficulty distinguishing such acts from permissible acts that are admirable for primarily non-moral reasons, such as kindness as etiquette, intellectual skill, or prudence, especially when both kinds involve some cost to the agent and some benefit to others. Could you help me by constructing a pair of original, everyday examples set in university life featuring the same student protagonist and broadly similar personal costs and benefits to others, where the first example satisfies the characterisation of supererogation and the second example is admirable but not supererogatory because its goodness is mainly non-moral? For each example, please walk through how it meets or fails each element of the characterisation, and explain why failing to perform the first act would be morally worse yet still blameless, whereas failing to perform the second act would not even be morally worse.
reasoning: |-
  Okay, the user is a second-year undergrad in a normative ethics course, struggling with supererogation. They need clear examples to distinguish supererogatory acts from merely admirable non-moral ones. The tutor's definition is specific: supererogatory acts are not required or forbidden, good to do, praiseworthy, and their omission is blameless. 

  Hmm, the core confusion seems to be about moral vs. non-moral admirability. Like when kindness feels "moral" but is really just etiquette. I should pick uni-life scenarios since that's their context. The protagonist should be consistent—let's call them Sam—to highlight how similar costs/benefits play out differently morally. 

  First example must tick all supererogation boxes. How about Sam anonymously covering a stranger's emergency textbook cost? It's costly ($50), beneficial (prevents academic crisis), and morally optional since uni doesn't require charity. Omitting it would be understandable (no blame!) but doing it is extra-good. 

  Second example needs identical surface elements but non-moral goodness. Ah—Sam meticulously organizing a study guide to ace a group project. Same cost (effort/time), same benefit (helps peers), but the admirability is about diligence, not morality. Skipping it might disappoint peers but isn't morally worse; it's just less industrious. 

  Key differences to stress: 
  - In the first, Sam's help addresses a dire need beyond social expectations (moral weight). 
  - In the second, the help is competence-based within expected academic cooperation (no moral failure if omitted). 
  Also, omitting the supererogatory act leaves a moral "remainder"—we might wish Sam did it, but can't blame them. For the study guide, no such residue exists. 

  ...Wait, did I cover all definition points? Let me checklist: 
  - Supererogatory: ✓ optional, ✓ good/praiseworthy, ✓ omission blameless 
  - Non-moral: ✓ skips moral "ought," ✓ admirability from skill/prudence 
  Plus the "why worse yet blameless" contrast is crystal clear in the examples. 
  User's likely aiming for essay/exam precision, so academic phrasing helps, but examples keep it grounded. Nailed it.
answer: |-
  Below are two original examples featuring "Sam," a second-year undergraduate, designed to highlight the distinction between **supererogation** (morally admirable beyond duty) and **non-morally admirable acts** (praiseworthy for reasons unrelated to morality). Both scenarios involve similar costs (time/effort) and benefits (helping peers), but only the first qualifies as supererogatory.

  ---

  ### **Example 1: Supererogatory Act**  
  **Scenario:** Sam notices a first-year student, Alex, crying in the library after losing their wallet containing £50 earmarked for a critical textbook. Sam anonymously slips £50 into Alex’s bag with a note: "*Pay it forward someday.*" Sam sacrifices a week’s leisure budget (cost) to prevent Alex from failing an assignment (benefit).  

  **Analysis Against Supererogation Criteria**:  
  1. **Neither required nor forbidden**:  
     - Sam has no prior obligation to Alex (not a friend, tutor, etc.). Helping is optional.  
     - *Not forbidden*: No rule prohibits generosity.  
  2. **Morally good & praiseworthy**:  
     - Alleviating severe distress is intrinsically morally good.  
     - Sam’s anonymity shows pure altruism, making it praiseworthy.  
  3. **Omission permissible and blameless**:  
     - If Sam *omitted* the act, they would **not** deserve blame. Alex’s plight isn’t Sam’s responsibility.  
  4. **Why omission is *morally worse* yet blameless**:  
     - The world is *morally poorer* without Sam’s act—Alex suffers unnecessarily.  
     - However, Sam’s *duty* was only to avoid harm (e.g., not stealing Alex’s wallet). Helping exceeds duty, so omission isn’t blameworthy.  

  ---

  ### **Example 2: Non-Morally Admirable Act**  
  **Scenario:** Sam spends 10 hours creating a meticulously formatted study guide for their philosophy seminar group, sharing it ahead of finals. This costs Sam significant time (equal to Example 1’s financial cost) and benefits peers (like Example 1). Peers praise Sam’s diligence.  

  **Analysis Against Supererogation Criteria**:  
  1. **Neither required nor forbidden**:  
     - Sharing notes isn’t mandatory (unless group-agreed).  
     - *Not forbidden*: No rule bars academic collaboration.  
  2. **Admirable but *not morally good***:  
     - The act showcases **intellectual diligence/prudence**, not moral virtue.  
     - Its "goodness" lies in efficiency/skill (non-moral), not addressing a moral need (e.g., suffering, injustice).  
  3. **Omission permissible and blameless**:  
     - If Sam *omitted* the act, peers might be disappointed, but Sam deserves **no moral criticism**.  
  4. **Why omission is *not morally worse***:  
     - Peers lose a *convenience*, not a necessity (they could make their own guides).  
     - No moral "deficit" occurs—the act’s value is in **competence**, not moral rectitude. Failing to be exceptionally diligent isn’t a *moral* failing.  

  ---

  ### **Key Distinctions**:  
  | **Element**               | **Supererogatory (Example 1)**                     | **Non-Moral (Example 2)**                          |  
  |---------------------------|---------------------------------------------------|---------------------------------------------------|  
  | **Nature of benefit**     | Addresses *urgent need* (preventing harm/failure) | Provides *optional advantage* (academic efficiency) |  
  | **Source of admirability** | Moral character (compassion, altruism)           | Non-moral excellence (skill, diligence)           |  
  | **If omitted**            | **Morally worse world** (Alex suffers)            | **No moral difference** (peers have alternatives) |  
  | **Praiseworthiness**      | Moral praise ("virtuous," "selfless")             | Non-moral praise ("impressive," "reliable")       |  

  ### **Why the Difference Matters**:  
  - **Supererogation** involves **moral sacrifice** for others’ *welfare* beyond social/contractual expectations. Omission leaves a moral "remainder" (we *wish* it was done) but no blame.  
  - **Non-moral admiration** stems from **excellence in non-ethical domains** (etiquette, skill, prudence). Omission doesn’t affect moral goodness—it’s neutral.  

  This distinction clarifies why heroic acts (e.g., running into a burning building) are supererogatory, while mastering violin or acing exams—though admirable—aren’t *moral* achievements. Supererogation belongs to ethics; other admirability belongs to practical wisdom or aesthetics.
