answer: |-
  ## Dialogue: The Queue That Wasn't There

  **Setting:** A bench overlooking the harbour in a small seaside town. Nadia and Owen, both moral philosophers on holiday, sip coffee after hearing about the pharmacy incident from a local.

  **Characters:**
  *   **Nadia:** Believes social conventions, when reasonably established and cooperative, can generate genuine moral obligations.
  *   **Owen:** Believes only rule-independent moral principles (non-harm, non-deception, fidelity) create duties; conventions are morally inert guides, breaches being inelegance, not immorality.

  **(The scene opens with Owen chuckling, shaking his head.)**

  **Owen:** Honestly, Nadia, this whole pharmacy business? It perfectly illustrates my point. That poor tourist, blundering in, utterly unaware of the local ritual of the 'invisible queue'. Treated like a moral pariah by some for... what? Acting entirely normally? She *did* nothing wrong.

  **Nadia:** Did nothing wrong? Owen, she jumped the queue. She took a service that rightly belonged to someone else – that woman who waited silently. That’s a real harm, however minor. Five minutes stolen.

  **Owen:** "Stolen"? Dramatic. She didn't *steal* anything. The pharmacist chose to serve her. There was no physical barrier, no sign, no announcement. She acted on the perfectly reasonable, indeed universal, assumption that if you walk up to an unoccupied counter, you get served. The *harm* – those five minutes – is trivial. More importantly, it wasn't inflicted through malice, deception, or force. It was an accident of ignorance.

  **Nadia:** Ignorance might excuse *blame*, Owen, but it doesn't negate the *wrong*. This practice exists for a reason: fairness and efficiency. Everyone who participates – by asking "who's last?" and respecting the answer – is upholding a cooperative scheme. The tourist benefited from that scheme – she got served promptly – while doing nothing to uphold it. She took the benefit without the burden. That *is* unfair, a kind of free-riding.

  **Owen:** Ah, the "free-rider" accusation! But how can she free-ride on a scheme she didn't know existed, didn't consent to, and couldn't possibly have anticipated? There was no *undertaking* on her part. No promise made, no agreement entered. Morality, at its core, binds us through principles that don't depend on local quirks – don't harm others, don't lie, keep your promises. This? This is shoes at a wedding territory. Improper? Perhaps by local standards. Immoral? No.

  **Nadia:** But what *about* consent? We participate in countless cooperative schemes we never explicitly agreed to – traffic rules, paying taxes, not littering. We inherit the obligations because we benefit from the order they create. Imagine if the roles were reversed. Suppose this tourist is back home, patiently waiting in a physical queue, and a local from *this* town walks straight up and gets served, saying, "Oh, we don't *do* queues back home, we just ask." Wouldn't she rightly feel wronged? Resentful?

  **Owen:** *(Pauses, considering)* She might *feel* resentful, certainly annoyed. But feelings aren't proof of moral violation. She’d feel that way because she perceived an unfair outcome and an affront to *her* convention. But her resentment would stem from the *harm* of the delay and perhaps the *perceived* disrespect, not from the breach of a duty the newcomer *actually* owed her under fundamental morality. The newcomer, like our tourist here, was ignorant. Annoying? Yes. Morally culpable? No. The wrong, if any, lies solely in causing that minor frustration, which the ignorant tourist didn't *intend* and couldn't *reasonably avoid*.

  **Nadia:** You separate the harm and the convention too cleanly. The *only* reason that five-minute delay is a harm *to that specific woman* is *because* of the convention! Without the convention, there is no "her turn" to be taken. The convention *creates* the entitlement. By disregarding it – even unknowingly – the tourist violated that specific entitlement generated by the local practice. The wrong *is* the violation of the reasonable expectation established by the cooperative practice. It’s not *just* about the minutes; it’s about the undermining of the scheme itself, however slightly.

  **Owen:** And there's our core disagreement. You see the convention *generating* the entitlement and thus the duty. I see the convention merely as a *means* to satisfy pre-existing duties – here, the duty not to harm others by causing unreasonable delay or frustration. In a chaotic free-for-all, that harm is constant and severe. The convention prevents that harm. But the duty flows from the harm principle, *not* from the convention itself. If the tourist unknowingly causes a minor frustration by acting reasonably given her knowledge, she hasn't breached a moral duty. She's just been clumsy in a complex social world. She couldn't comply because she couldn't anticipate the need to ask a question she had no reason to ask! How can a duty bind someone who lacks even the conceptual framework to recognize it?

  **Nadia:** The duty exists objectively within the context of the practice. Her ignorance means she isn't *blameworthy*, perhaps not even rude, but it doesn't mean no wrong occurred. We hold very young children or the severely cognitively impaired harmless for actions that are objectively wrong. The tourist was a moral accident. But the woman whose turn it was *was* wronged – her legitimate expectation, founded on a reasonable social practice, was violated. The tourist failed a duty she *had*, even if she couldn't know it, because she participated in the social context (entering the pharmacy to be served) where that duty operates.

  **Owen:** And I maintain that "duty" is an illusion projected onto the convention. The *only* duty she had upon entering that pharmacy was the universal one: don't knowingly cause harm or frustration, don't deceive, don't force your way. She didn't knowingly cause harm (she was oblivious), she didn't deceive (she just walked up), she didn't use force. The "legitimate expectation" you cite is entirely convention-dependent and unknown to her. Therefore, no *moral* wrong. Social faux pas? Absolutely. A teachable moment? Certainly. A breach of a genuine moral obligation? No.

  **(A silence falls, broken by the cry of gulls.)**

  **Nadia:** So, where does that leave us, Owen? The chasm seems wide.

  **Owen:** It does. For me, the dispute rests on whether morality is fundamentally rooted in universal principles accessible to reason independent of social context, or whether local practices can create genuinely *new*, context-specific moral facts. I see the former; you see scope for the latter in cooperative schemes. To move me, you'd need to show how breaching a beneficial convention like this, *unknowingly and without ill intent*, inherently violates a universal principle like fairness or non-harm in a way that isn't merely contingent on the convention existing. Or show that participation in a society, however brief, constitutes implicit consent to *all* its local cooperative norms, which I find implausible.

  **Nadia:** And for me, Owen, the dispute rests on whether the goods produced by stable, reasonable social cooperation – fairness, predictability, reduced conflict – generate moral obligations for those who participate in and benefit from that cooperation, even if they don't grasp the specific rules. You reduce everything to baseline harms and individual undertakings; I see morality as partly constituted by the shared practices that make decent social life possible. To move me, you'd need to convincingly argue that the woman whose turn was taken suffered *no* distinct wrong *because* of the convention, or that the convention itself is somehow unreasonable or purely arbitrary, not a genuine cooperative practice. Or prove that obligations *cannot* arise implicitly from participation in a beneficial scheme without explicit agreement.

  **Owen:** *(Stands, offering a hand to help Nadia up)* Seems we've earned more coffee. And perhaps a careful approach to the bakery counter?

  **Nadia:** *(Smiles wryly, taking his hand)* Indeed. Ask who's last, just to be safe... or perhaps, on principle?

  **Owen:** *(Chuckles)* On principle? Let's call it... prudent inelegance avoidance. Lead on.

  **(They walk towards the town, the philosophical tension unresolved, but the companionship intact.)**
