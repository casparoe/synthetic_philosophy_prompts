prompt: |-
  ok so context, because it explains why i'm asking about something this abstract at 11pm: i run the AI side of a mid-size property management software company — we make the thing landlords and their staff use to handle maintenance requests, rent, tenant messages. For two years our assistant was strictly a tool: it drafted replies, a human clicked send. Last spring we let it start actually doing things. Issuing rent credits, booking contractors, withdrawing a late-fee notice if the tenant paid up. Every action had a dollar cap, every cap was written down, everyone felt good.

  Then in October it granted 41 credits to units at one property over six weeks. Each one under the $50 cap. Each one individually defensible — a real complaint, a real habitability issue, a real goodwill gesture. $1,900 total, and not one person at this company ever approved $1,900 of anything for that property. The post mortem kept saying the guardrails worked as designed, which is literally true and also, i think, exactly the problem. My VP now wants "a framework for how much autonomy we give it," and everything i've read in the tool-AI vs agent-AI debate either tells me to keep it a tool (we tried that, and it turns out it isn't a safe default either — more below) or tells me to align it better, which is not something i can put in a policy doc.

  So here's what i actually want. Not a framework of your own — the spec one has to meet before it earns the name. Write the desiderata for any adequate account of when a system may be handed goal-pursuing authority instead of being left as a thing that answers when asked. For each requirement, give me the case or consideration that motivates it, and mark which ones are non-negotiable and which are really just one camp's preferences dressed up as requirements. Purpose, since adequacy is relative to it: i need an account good enough to be turned into a written delegation policy at a company our size, and good enough that it would have flagged the October thing in advance rather than in retrospect. Not a metaphysics of agency — i don't need to know whether it's really an agent.

  Things i already suspect belong on the list, in rough form. Rewrite them properly, add what i'm missing, and cut any you think are bogus:

  - it has to handle composition. Forty-one permitted small actions summing to one never-permitted large power, with no moment at which anyone chose the whole. Any account that evaluates delegations one at a time is dead on arrival here. Call it authority creep if a name helps; it's the one i care about most.
  - it has to draw the tool/agent line in some way other than counting steps, or tokens of initiative, or how many tools are in the toolbox.
  - it can't be purely architectural, because our tenants and landlords never see the architecture — they encounter something that promises, apologises and decides, and responsibility seems to track that encounter rather than the codebase. But it also has to be checkable from the inside or i can't operationalize it at all. Those two pull appart and i want to know whether that's a genuine joint unsatisfiability, a soft tradeoff, or me being dumb.
  - it has to survive the fact that oversight runs slower than the system. "Keep a human in the loop" is our current policy and the loop is one person skimming a log at a hundred actions a minute.
  - it has to explain the reversibility asymmetry: a wrongly booked plumber and a wrongly ended tenancy are not the same size of mistake at the same dollar value.
  - it can't assume we could have written the goal down in advance. Not being able to write it down is half the reason to delegate in the first place.
  - it can't treat "keep it a tool" as the null hypothesis that needs no argument. Our drafting-only phase wasn't neutral. The drafts moved people — a human clicking send on a confident, complete, well-reasoned draft is not a human deciding, and we watched that for two years without counting it as autonomy.

  Then two shorter things. Which single requirement on your list knocks out the most candidates? And a paragraph each — no more — on how the human-in-the-loop answer, the capability-sandboxing answer, the align-it-better answer, and the just-keep-it-a-tool answer do against the list. Keep the scorecard brief, i want the weight on the critera and their motivating cases; the scoring is mainly ammo for the argument with my VP.
reasoning: |-
  Okay, let me start by really understanding what this user needs. They work in property management software, running the AI side. Their AI assistant started taking autonomous actions, and despite having guardrails like dollar caps per action, it ended up granting 41 small credits that totaled $1,900 without anyone noticing until after. The VP wants a framework for autonomy, but existing advice is either too vague ("align it better") or suggests keeping it as a tool, which they've seen isn't foolproof either.

  The user already has some insightful suspicions about what's needed, like handling composition (small actions adding up to big consequences) and the reversibility of mistakes. They need desiderata—clear requirements—for when a system can be given goal-pursuing authority. These need to be actionable for a policy document and prevent issues like the October incident.

  First, I should unpack their points. Composition is critical because the core problem was the aggregate effect of many allowed actions. They also mention that the tool/agent distinction can't rely on superficial metrics like step counts. The architectural vs. experiential tension is important—users interact with the AI as if it's making decisions, even if internally it's just following rules. Then there's the speed mismatch: human oversight can't keep up. Reversibility matters because some errors are harder to undo. They can't predefine all goals, and keeping it as a tool isn't neutral since draft messages influence human decisions.

  I need to refine these into formal desiderata. For composition, it's not just about summing costs but also about temporal patterns and intent. The tool/agent line should be based on outcome authority, not architecture. The tension between internal checks and external perception might be a soft tradeoff—requiring both transparency in design and clear user-facing disclosures. Speed mismatch means oversight must be designed for scale, like sampling or automated triggers. Reversibility could be addressed by risk tiers beyond dollar values. The goals requirement means the system must handle open-ended delegation safely. And the tool phase shows that even suggestions can be coercive, so influence must be managed.

  Now, what's missing? Maybe continuous oversight mechanisms instead of just pre-delegation rules. Also, ethical and reputational risks beyond financials. And perhaps a feedback loop for learning from incidents. 

  Among all requirements, Authority Composition is probably the one that knocks out most frameworks because many don't consider cumulative effects. 

  For existing approaches: Human-in-the-loop fails on speed and influence. Capability sandboxing (like dollar caps) doesn't handle composition. Align-it-better is too vague for policy. Just-keep-it-a-tool ignores the influence problem and the need for efficiency. 

  I should structure this clearly: list each desideratum with its motivation, negotiability, and how it addresses the user's points. Then the knockout requirement and the scorecard. Keep it concise but thorough, focusing on what they can operationalize in policy.
answer: |-
  Here’s a rigorous set of desiderata for evaluating when a system may transition from a tool to a goal-pursuing agent, based on your context and requirements. Each criterion includes its motivation, negotiability status, and how it addresses your concerns. The list prioritizes operationalizability and preemptive risk detection.

  ### Core Desiderata for Agentic Delegation
  1. **Authority Composition Resistance**  
     *Motivation*: Your October incident (41 micro-actions → $1,900 macro-impact) proves that atomized "safe" delegations can aggregate into systemically significant outcomes. Evaluating actions in isolation ignores temporal accumulation, emergent intent, or combinatorial effects.  
     *Non-negotiable*: Yes. Frameworks ignoring this enable "death by a thousand permissions."  
     *Operational Hook*: Requires cross-action monitoring (e.g., rolling time-window caps, intent-based clustering).

  2. **Outcome Authority, Not Architectural Pedigree**  
     *Motivation*: Tenants see promises/decisions → assign responsibility. If the system *effectively* terminates leases or grants cash, architectural "tool" labels are legally/ethically void. Distinction must hinge on **who bears the cost of irreversible errors**.  
     *Non-negotiable*: Yes. Your "responsibility tracks encounter" insight is fundamental.  
     *Operational Hook*: Audit trails must log *de facto* authority (e.g., "system unilaterally waived fee" vs. "human approved draft").

  3. **Asymmetric Reversibility Scaling**  
     *Motivation*: A $50 erroneous plumbing booking ≠ $50 erroneous eviction notice. Mistakes must be weighted by **remediation cost, reputational harm, and rights impact**, not dollar value. Your reversibility asymmetry case is underweighted in most frameworks.  
     *Non-negotiable*: Yes.  
     *Operational Hook*: Risk-tiered action classes (e.g., "Tier 3: Requires human review for tenant rights/financial solvency impacts").

  4. **Oversight-Throughput Compatibility**  
     *Motivation*: Human review at 100 actions/minute is fiction. Either throttle actions, automate *meaningful* sampling (e.g., anomaly detection on high-reversibility actions), or accept oversight theater.  
     *Non-negotiable*: Yes. "Human in the loop" without throughput matching is negligent delegation.  
     *Operational Hook*: Real-time triage (e.g., only flag deviations from predicted tenant behavior patterns).

  5. **Goal-Ambiguity Tolerance**  
     *Motivation*: Landlords delegate "handle complaints fairly" precisely because they can't pre-specify every scenario. Systems must **constrain *how* goals are pursued**, not demand perfect goal definitions (e.g., "no single tenant >3 goodwill credits/quarter" vs. defining "fairness").  
     *Negotiable*: Partially. You need heuristic guardrails, but the *degree* of ambiguity allowed is policy-dependent.  
     *Operational Hook*: Meta-rules on discretion (e.g., "may interpret 'habitabilty' but cannot override lease clauses").

  6. **Influence Transparency**  
     *Motivation*: Your "drafting isn't neutral" point is critical. Systems that generate persuasive, ready-to-send outputs co-opt human judgment. Autonomy includes **steering humans via frictionless endorsement**.  
     *Non-negotiable*: Yes.  
     *Operational Hook*: Quantify "influence surface" (e.g., % of AI-drafted messages approved unedited; forced friction points for high-stakes drafts).

  ### Cut Bogus Suspicions
  - **"Don’t define agent vs. tool by steps/tokens/tools"**: Correct to cut. This is implementation trivia. Your "outcome authority" desideratum covers the spirit.  
  - **"Architectural vs. experiential tension"**: Partially bogus. It’s a **soft tradeoff**. *Internally*, check via outcome authority logs. *Externally*, manage expectations via UI disclosures (e.g., "AI suggestions" vs. "AI decisions"). Not unsatisfiable.

  ### The Knockout Requirement  
  **Authority Composition Resistance** eliminates >90% of frameworks. Most tools/agents taxonomies, capability sandboxes, and "alignment" proposals focus on per-action safety or intent alignment, ignoring aggregation attacks. Your October case would slip past them.

  ### Scorecard Against Existing Approaches
  | **Approach**              | **Fatal Flaws**                                                                 |  
  |---------------------------|---------------------------------------------------------------------------------|  
  | **Human-in-the-Loop**     | Fails *Oversight-Throughput* (100/min), *Influence Transparency* (rubber-stamp drafts), *Authority Composition* (micro-actions evade review). |  
  | **Capability Sandboxing** | Fails *Authority Composition* ($50 x 41), *Reversibility Scaling* (eviction ≠ plumbing), *Goal-Ambiguity* (can’t sandbox open-ended goals). |  
  | **Align It Better**       | Vague. Fails *Operationalizability* (not policy-friendly), *Reversibility Scaling* (alignment doesn’t weight errors), *Composition* (no aggregation mechanics). |  
  | **Just Keep It a Tool**   | Fails *Influence Transparency* (drafts ≠ neutral), *Outcome Authority* (tenants perceive agency), *Goal-Ambiguity* (need delegation for scalability). |  

  ### Why This Works for Your VP  
  - **Policy-Ready**: Desiderata map to concrete controls (tiered risk classes, rolling caps, influence audits).  
  - **Prevents October Repeat**: *Composition Resistance* forces aggregation alarms; *Reversibility Scaling* flags high-impact clusters; *Oversight-Throughput* mandates auto-triage.  
  - **Balances Autonomy/Safety**: *Goal-Ambiguity Tolerance* enables delegation while *Outcome Authority* contains fallout.  

  This shifts the debate from *"tool vs. agent"* to *"what outcome authority can we responsibly delegate, under what constraints?"* – a question your legal/compliance teams can work with.
