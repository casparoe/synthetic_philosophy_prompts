prompt: |-
  I train LLMs for a living, and I've been keeping a running list of my gut verdicts about when process-based supervision (grading the steps / reasoning) beats outcome-based supervision (grading the final product), and I want to know whether there's an actual principle under all of them or whether I'm just vibes-ing. Here are the verdicts:

  - Math word problems: grading each step is clearly better. When I train on final answers only, the model learns to leap to answers with subtly broken reasoning, and step-grading catches the rot early. Verdict: process.
  - A legal research assistant: outcome check only — did the cited cases actually support the proposition. Checking the proccess would mean me redoing the research, at which point why have the model. Verdict: outcome, even though it's superficially the same "grade the reasoning?" question.
  - Go: if you'd graded AlphaGo's moves against "what strong human players consider sound," move 37 never happens. Outcome-only (win/loss) was right, and it's not close. Verdict: outcome, even though a human process-grader would have flagged exactly the moves that made it work.
  - A coding model whose spaghetti passes all the tests: I still want to penalize the ugly code, even though the outcome check passed. And this feels in tension with Go — both are "unorthodox route to a verified win."
  - A writing assistant: grading its "reasoning about the essay" feels wrong even when I could do it — good essays get written in weird ways, and the model's stated plan is often post-hoc anyway. Verdict: outcome (human preference on the essay itself).
  - A model that reaches a benign, correct answer through a chain of paranoid or rationalizing justifications: I'd penalize the chain even with a fine outcome. Verdict: process.

  The case I keep going back and forth on: interpretability people keep finding that a written-out chain of thought isn't always doing the causal work — sometimes the answer gets computed elsewhere and the "reasoning" is a plausible-sounding press release. If that's right, isn't process grading just grading the press release and hoping it becomes load-bearing? Do you penalize a correct answer with confabulated reasoning, and if the goal is to make the stated process be the actual process, is that still "supervision" or is it something else?

  And the thing that bugs me most: math says process, Go says outcome, coding says process-but-only-sort-of. My tentative principle is just "grade whatever you can verify cheaply and honestly" — i.e., process grading is what outcome grading looks like when the outcome decomposes into checkable pieces. But that principle seems to tell me to leave the spaghetti code alone (the tests passed!), and I really don't want to leave the spaghetti code alone.

  So: is there one principle that captures all or most of these, and if so, what does it predict for the confabulated-reasoning case and for the Go-vs-coding tension? Which of my verdicts does it force me to drop? I'd take a small set of candidate principles over one bloated one. Please answer in American English.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're an LLM trainer struggling to find a unifying principle for when to use process-based vs. outcome-based supervision. Their examples show clear conflicts: math needs process grading, Go needs outcome, coding is messy, and confabulated reasoning creates doubt. 

  First, I notice their "cheap verification" principle feels insufficient - it'd approve spaghetti code that passes tests, which clashes with their intuition. The core tension seems to be about two different goals: competence (does it work?) vs. alignment (does it work the right way?). 

  Looking at their cases: Math fails without step grading (alignment issue). Legal research can't practically verify steps (competence suffices). Go needs outcome because human judgment limits innovation. Coding needs process grading for maintainability (alignment). Writing requires outcome since process is often post-hoc. The paranoid justification case clearly needs process grading for alignment.

  Ah! The pattern emerges: When the how matters beyond functional correctness, process wins. When only the result counts or process verification is impossible, outcome suffices. But this needs refinement - "mattering" depends on context. For coding, spaghetti is penalized because humans must maintain it. In Go, unorthodox moves are fine because only winning matters. 

  The confabulated reasoning case is tricky. If the goal is trustworthy reasoning (e.g. medical diagnosis), penalizing confabulation makes sense - it's about building reliable mechanisms. If it's just answer generation, maybe not. 

  Their Go vs. coding tension resolves: Go's "how" doesn't matter if it wins; coding's "how" affects future human work. My principle would force them to accept that outcome-only is correct for Go, but defend process for coding due to secondary requirements. 

  The verdicts mostly hold except: They might need to accept that outcome-only is indeed correct for spaghetti code... unless they redefine "outcome" to include code quality as part of the spec. That's the key insight - outcome definitions can expand to include process qualities when they're mission-critical.
answer: |-
  Here's a distilled framework based on your cases, with two core principles and their implications:

  ### **The Two Principles**
  1. **Supervise for Trustworthy Generalization**  
     *Use process-based supervision when:*  
     - The *reasoning path itself* impacts future reliability or safety (e.g., math, paranoid justifications).  
     - The outcome is underspecified or vulnerable to "good enough" shortcuts (e.g., spaghetti code, subtly broken math).  
     - You need the model to *generalize* beyond the training distribution via robust reasoning.  

     *Use outcome-based when:*  
     - The outcome is unambiguous, measurable, and directly aligns with the goal (e.g., winning Go, legal citation accuracy).  
     - Human judgment of the process is unreliable or would stifle innovation (e.g., AlphaGo’s move 37).  

  2. **The Verification Funnel**  
     - **Process grading is viable** when steps are *atomic and verifiable* (e.g., math steps, code syntax).  
     - **Outcome grading is pragmatic** when the process is *expensive, subjective, or unfalsifiable* (e.g., legal research, essay planning).  

  ---

  ### **How It Explains Your Verdicts**
  | **Case**               | **Principle Applied**                                                                 | Verdict   |
  |------------------------|---------------------------------------------------------------------------------------|-----------|
  | **Math word problems** | Broken steps → future unreliability. Steps are atomic/verifiable.                    | Process ✅ |
  | **Legal research**     | Outcome is clear; verifying steps = redoing work.                                     | Outcome ✅ |
  | **Go**                 | Human process judgment would limit superhuman play. Win/loss = perfect signal.        | Outcome ✅ |
  | **Spaghetti code**     | Ugly code → future maintenance risk (unreliable generalization). Code is verifiable. | Process ✅ |
  | **Writing assistant**  | Outcome (human preference) matters; "reasoning" is often post-hoc/unverifiable.       | Outcome ✅ |
  | **Paranoid reasoning** | Toxic justifications → unsafe generalization, even if outcome is benign.              | Process ✅ |

  ---

  ### **Resolving Tensions**
  - **Go vs. Spaghetti Code**:  
    - *Go*: The *only* goal is winning. Unorthodox moves aren’t "wrong" if they win. Outcome suffices.  
    - *Coding*: Passing tests ≠ robust, maintainable code. **Spaghetti code fails the "trustworthy generalization" test** because it’s brittle to future modifications. Verifying code structure is feasible (unlike judging Go moves).  

  - **Confabulated Reasoning**:  
    - **Penalize it if trust matters**. If the goal is *truthful reasoning* (e.g., medical diagnosis), confabulation is dangerous even with correct answers.  
    - **Ignore it if only outcomes matter** (e.g., generating marketing copy where plausibility suffices).  
    - *Your principle*: Use process supervision **only if you can verify the steps** (e.g., penalize unsupported claims in a reasoning chain). Otherwise, you’re just training better confabulators.  

  ---

  ### **Predictions & Forced Drops**
  - **Prediction for confabulation**:  
    If you *can* verify steps (e.g., grounding each claim in a knowledge base), penalize confabulation. If not, outcome-only is safer.  

  - **Forced drop**: **Spaghetti code must be process-graded** under this framework. But if you *truly* only care about passing tests (e.g., in a coding competition), you’d drop "ugly code" complaints and use outcome. **Your instinct to penalize it implies you care about *more* than just functionality**—so redefine the "outcome" to include readability/maintainability.  

  ---

  ### **The One-Sentence Principle**
  > **Supervise the process if the *path to the answer* affects safety, generalization, or future reliability *and* you can verify it cheaply; otherwise, supervise the outcome.**  

  This forces you to explicitly define:  
  1. What "reliability" means beyond the immediate task (e.g., code maintenance ≠ Go winning).  
  2. Whether verification is scalable (e.g., legal research isn’t; math steps are).  

  Your "cheap verification" intuition was 80% right—but **adding "trustworthy generalization" resolves the spaghetti/Go conflict**.
