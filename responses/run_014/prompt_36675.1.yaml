  ### Absent-Minded Driver Workshop Plan  
  **Participants:** 16 adults, familiar with basic rationality concepts but not formal decision theory.  
  **Time:** 90 minutes  
  **Materials:** Play money ($0/$1/$4 bills), two identical exit stations (e.g., tables labeled "Exit A" and "Exit B"), blindfolds, index cards, a scoreboard, and a shared group ledger.  

  ---

  ### **Game Setup**  
  1. **Payoff Structure**:  
     - Exit at first intersection: **$0**  
     - Exit at second intersection: **$4**  
     - Overshoot both: **$1** (paid only if driver reaches the end).  

  2. **Absent-Mindedness Protocol**:  
     - Each "journey" has two possible intersections. Participants are **blindfolded and led to a random exit station** (Exit A or B). They cannot see or deduce which intersection they’re at.  
     - **No memory**: After each intersection decision, players return to a waiting area (distraction task: solving simple puzzles) and are reshuffled blindfolded before the next journey.  

  3. **Roles**:  
     - **Drivers**: 8 players per round (each makes one intersection decision per journey).  
     - **Coordinator**: Manages blindfolds, station assignments, and payouts.  
     - **Planners**: All 16 participants jointly decide a group strategy during planning phases.  

  ---

  ### **Rounds** (Total: 45 minutes)  
  1. **Training Round (5 min)**  
     - Players experience one practice journey.  
     - Payoffs revealed to illustrate outcomes (e.g., "You exited at first intersection: $0").  

  2. **Planning Phase (10 min)**  
     - Group chooses a **mixed strategy**: Probability `p` to exit at any intersection (e.g., "Exit with 30% chance").  
     - Rationale: Maximize expected group payoff. Optimal `p` = 1/3 (≈33%).  

  3. **Execution Phase 1: Follow Group Plan (10 min)**  
     - Players **must** follow the group’s `p` (enforced by coordinator rolling dice: exit if roll ≤ `p`).  
     - 4 journeys per player. Record payoffs.  

  4. **Execution Phase 2: Free Choice (15 min)**  
     - Players **choose freely** at their intersection (exit or continue).  
     - 4 journeys per player. Track individual choices and payoffs.  

  5. **"Information Twist" Mini-Round (5 min)**  
     - Half the players (randomly chosen) **learn their intersection** (e.g., "This is Exit 1").  
     - Others remain ignorant. Compare payoffs.  

  ---

  ### **Payoff Calculation**  
  - **Continuation handling**: If a player continues at Intersection 1, the coordinator silently moves them to Intersection 2 (reshuffled blindfolded).  
  - **End condition**: After two decisions per journey (or if a player exits early), payouts occur.  

  ---

  ### **Debrief (30 min)**  
  1. **Scoreboard Analysis**:  
     - Phase 1 (forced `p`): Show average payoff (theoretical optimum: $1.6 at `p=1/3`).  
     - Phase 2 (free choice): Highlight divergence. Players who defected to "always exit" earn more if group `p` was too low (e.g., 20%), but *less* if `p` was optimal.  

  2. **Key Insights**:  
     - **Ex ante vs. ex post**: The plan (`p=1/3`) maximizes *expected* payoff, but at *any single intersection*, exiting seems better if `p` is low (e.g., "I might be at Exit 2!").  
     - **Paying not to know**: Players given information in the twist round typically earn **less** (e.g., $0 if they exit at Exit 1, vs. $1.6 if ignorant). Explain: Knowledge tempts suboptimal state-dependent actions.  

  3. **Limitation Note**:  
     - *Real problem complexity*: In the true AMDP, the driver’s strategy alters the probability of being at each intersection. Our protocol fixes stations randomly, so we simulate uncertainty but not **endogenous state probability**. Verbalize this gap.  

  ---

  ### **Predicted Failure Modes**  
  1. **Blindfold distrust**: Players peek. *Mitigation*: Use opaque eyewear and enforce shuffling.  
  2. **Misunderstood payoffs**: Confusion between "continue" and "overshoot." *Mitigation*: Clarify with examples in training.  
  3. **Groupthink in planning**: Dominant voices push non-optimal `p` (e.g., 0% or 100%). *Mitigation*: Steer with Socratic questions ("What if everyone exits at Exit 1?").  
  4. **No divergence in Phase 2**: If group chooses `p=1/3`, players may comply (indifference). *Mitigation*: Seed a suboptimal `p` (e.g., 20%) to trigger defections.  

  ---

  ### **Why This Works**  
  - **Emergent tension**: The scoreboard forces players to confront the planning/action gap.  
  - **Tangible twist**: Paying not to know becomes visceral when informed players earn less.  
  - **Scalable**: Works with 16 players via parallel stations.  

  > Total words: 798
