prompt: |-
  I'm building a probability module for an on-call incident-response tool, and I want to pin down the math behind a heuristic the team relies on constantly: "two independent signals pointing at the same root cause is far stronger evidence than one." I want you to construct a concrete, realistic scenario — something an SRE team could actually face, no exotic physics, no perfect predictors, one paragraph — in which this heuristic, formalized as a naive independence assumption, badly overstates the posterior probability that a hypothesis is true.

  The scenario must have exactly this structure. There is a hypothesis H with a low prior, P(H) = 0.1, that a recent deploy genuinely degraded the service for users in a particular region. There are two signals, E1 (an error-rate dashboard spike for that region) and E2 (a failing synthetic canary test that simulates a user in that region). The deploy bundled a service change with a change to the monitoring stack. Given H, the two signals are genuinely independent, each a separate noisy manifestation of the same real degradation, so P(E1 ∧ E2 | H) = P(E1|H)·P(E2|H). Given ~H, the two signals are not independent: the monitoring-stack change, shipped in the same release, can on its own make both the dashboard falsely spike and the canary falsely fail, so P(E1 ∧ E2 | ~H) > P(E1|~H)·P(E2|~H).

  Use these numbers: P(E1|H) = 0.9, P(E2|H) = 0.8, P(E1|~H) = 0.1, P(E2|~H) = 0.1, and the true joint under ~H, P(E1 ∧ E2 | ~H) = 0.06.

  Then deliver the following:

  1. Compute P(H | E1 ∧ E2) two ways. First the naive way, assuming E1 and E2 are independent under both H and ~H. Second the correct way, using the joint 0.06 under ~H. Show the likelihood ratio and the final posterior for each.
  2. State the exact conditional-independence assumption, as a formal statement, that the naive calculation smuggles in. Then identify which of the two conditionals — given H or given ~H — the "presumption of independence" is actually defensible about, and explain why.
  3. Name the single structural feature of the case that does the work, and state what happens to the two posteriors if that feature is removed (i.e., if the monitoring-stack change cannot produce correlated false alarms).
  4. Write a short paragraph on how a defender of the independence heuristic would attack this case — for example, on the grounds that the 0.06 joint is unjustified or unobservable, or that the presumption is a reasonable default when no correlation is known — and say which part of that attack is the strongest.
  5. Generalize. State a condition, in terms of the causal structure that generates each signal (not in terms of whether the agents or instruments reporting them are independent of each other), under which it is safe to multiply the two likelihoods when combining the signals.

  The point is a designed case that isolates one specific failure mode of one specific heuristic, with the arithmetic shown, not a general essay on Bayesian reasoning or on confirmation.
reasoning: |-
  We are given:
  - Prior probability of H: P(H) = 0.1
  - Therefore, prior of ~H: P(~H) = 1 - P(H) = 0.9

  Given H (the deploy genuinely degraded the service):
  - P(E1|H) = 0.9
  - P(E2|H) = 0.8
  - And we are told that given H, E1 and E2 are independent: so P(E1 ∧ E2 | H) = P(E1|H) * P(E2|H) = 0.9 * 0.8 = 0.72

  Given ~H (no genuine degradation, but note the monitoring-stack change might cause false alarms):
  - P(E1|~H) = 0.1
  - P(E2|~H) = 0.1
  - However, under ~H, the two signals are NOT independent. The true joint probability P(E1 ∧ E2 | ~H) = 0.06 (which is greater than the product P(E1|~H)*P(E2|~H)=0.1*0.1=0.01).

  We are to compute the posterior P(H | E1 ∧ E2) in two ways.

  First, the naive way (assuming independence under both H and ~H):
  - We already have P(E1 ∧ E2 | H) = 0.72 (by independence under H).
  - For ~H, we would (wrongly) assume independence and set P(E1 ∧ E2 | ~H) = P(E1|~H)*P(E2|~H) = 0.1 * 0.1 = 0.01.

  Then we can compute the posterior using Bayes:

  P(H | E1 ∧ E2) = [ P(E1 ∧ E2 | H) * P(H) ] / [ P(E1 ∧ E2 | H)*P(H) + P(E1 ∧ E2 | ~H)*P(~H) ]

  Naive:
    Numerator = 0.72 * 0.1 = 0.072
    Denominator = 0.072 + (0.01 * 0.9) = 0.072 + 0.009 = 0.081
    Posterior (naive) = 0.072 / 0.081 ≈ 0.8889

  Second, the correct way (using the true joint under ~H = 0.06):
    Numerator = 0.72 * 0.1 = 0.072
    Denominator = 0.072 + (0.06 * 0.9) = 0.072 + 0.054 = 0.126
    Posterior (correct) = 0.072 / 0.126 ≈ 0.5714

  Now, let's compute the likelihood ratios (LR) for each.

  The likelihood ratio for the event (E1 ∧ E2) is defined as:
    LR = P(E1 ∧ E2 | H) / P(E1 ∧ E2 | ~H)

  Naive LR (assuming independence under ~H): 
    LR_naive = 0.72 / 0.01 = 72

  Correct LR (using the true joint under ~H):
    LR_correct = 0.72 / 0.06 = 12

  So the naive LR is 72 and the correct LR is 12.

  The posterior can also be expressed in terms of the prior odds and the LR:

    Posterior odds = Prior odds * LR

  Prior odds = P(H)/P(~H) = 0.1/0.9 = 1/9

  Naive posterior odds = (1/9) * 72 = 8
    => Posterior (naive) = odds / (1+odds) = 8/9 ≈ 0.8889

  Correct posterior odds = (1/9) * 12 = 12/9 = 4/3 ≈ 1.333
    => Posterior (correct) = (4/3) / (1 + 4/3) = (4/3)/(7/3) = 4/7 ≈ 0.5714

  Now, the answers:

  1. 
     Naive: 
        Likelihood ratio = 72
        Posterior ≈ 0.8889 (or 8/9 ≈ 0.8889)

     Correct: 
        Likelihood ratio = 12
        Posterior ≈ 0.5714 (or 4/7 ≈ 0.5714)

  2. The exact conditional-independence assumption that the naive calculation smuggles in is:
        P(E1 ∧ E2 | H) = P(E1|H) * P(E2|H)   [which is given and correct]
        and 
        P(E1 ∧ E2 | ~H) = P(E1|~H) * P(E2|~H)   [which is false in this scenario]

     The presumption of independence is defensible under H (given H) because the two signals are generated by two separate noisy manifestations of the same real degradation (and we are told they are independent given H). Under ~H, the independence is not defensible because there is a common cause (the monitoring-stack change) that can cause both false alarms simultaneously.

  3. The single structural feature that does the work is the existence of a common cause (the monitoring-stack change) that can cause both E1 and E2 in the absence of H (i.e., when H is false). If that feature is removed (i.e., the monitoring-stack change cannot produce correlated false alarms, meaning that under ~H, E1 and E2 become independent), then the naive calculation would be correct. In that case, the true joint under ~H would be 0.01, and the correct posterior would become the same as the naive one (0.8889).

  4. A defender of the independence heuristic might attack this case by arguing that the value 0.06 for the joint under ~H is arbitrary or unobservable. They might say that without prior data on the correlation, the independence assumption is a reasonable default. They might also question whether the monitoring-stack change is truly the only common cause and whether the correlation has been properly measured. The strongest part of the attack might be that in practice, without a large amount of data, it is difficult to estimate the joint probability under ~H (which is rare) and that the independence assumption, while sometimes wrong, is a tractable and conservative starting point.

  5. It is safe to multiply the two likelihoods (i.e., treat the signals as conditionally independent) when the signals are generated by conditionally independent mechanisms given both H and ~H. More specifically, the condition is that the causal structure that generates the signals must not have any common causes (other than H) that might influence both signals. In other words, if the only way both signals can occur is via H (and in the absence of H, the signals are generated by independent mechanisms) then the conditional independence holds under both H and ~H. However, note that in this scenario, under ~H there is a common cause (the monitoring change) that is not H. So the condition is: the absence of any confounding factor (common cause) that affects both signals and is not H. Alternatively, we can say: conditional on H and on ~H, the two signals are generated by mechanisms that do not share any other common influences (except for the state of H, which we condition on).
answer: |-
  ### Scenario
  An SRE team deploys a service update bundled with a monitoring-stack change. Hypothesis H (prior P(H)=0.1) posits that the deploy degraded service for users in Region X. Signal E1 is an error-rate spike in Region X's dashboard. Signal E2 is a failing synthetic canary for Region X. The monitoring-stack change can cause false alarms: under ~H, it may simultaneously corrupt the dashboard (causing E1) and the canary (causing E2), creating correlation.

  ### 1. Posterior Calculation
  **Naive (assumes independence under both H and ~H):**  
  - Likelihood under H:  
    P(E1 ∧ E2 | H) = P(E1|H) · P(E2|H) = 0.9 × 0.8 = 0.72  
  - Likelihood under ~H (incorrectly assumed independent):  
    P(E1 ∧ E2 | ~H) = P(E1|~H) · P(E2|~H) = 0.1 × 0.1 = 0.01  
  - Likelihood ratio (LR) = 0.72 / 0.01 = **72**  
  - Posterior:  
    P(H | E1 ∧ E2) = [P(H) · LR] / [P(H) · (LR - 1) + 1]  
    = [0.1 × 72] / [0.1 × (72 - 1) + 1] = 7.2 / (7.1 + 1) = **≈0.8889 (88.89%)**  

  **Correct (uses true joint P(E1 ∧ E2 | ~H) = 0.06):**  
  - Likelihood under H: **0.72** (same as above)  
  - Likelihood under ~H: **0.06** (given)  
  - LR = 0.72 / 0.06 = **12**  
  - Posterior:  
    P(H | E1 ∧ E2) = [0.1 × 0.72] / [(0.1 × 0.72) + (0.9 × 0.06)]  
    = 0.072 / (0.072 + 0.054) = 0.072 / 0.126 = **≈0.5714 (57.14%)**  

  ---

  ### 2. Conditional Independence Assumption
  - **Formal statement:** The naive calculation assumes:  
    $$P(E1 \land E2 \mid H) = P(E1 \mid H) \cdot P(E2 \mid H) \quad \text{and} \quad P(E1 \land E2 \mid \neg H) = P(E1 \mid \neg H) \cdot P(E2 \mid \neg H).$$  
  - **Defensible clause:** Independence **given H** is defensible. E1 and E2 are separate manifestations of the root cause (degraded service), with no shared failure mechanisms beyond H.  
  - **Indefensible clause:** Independence **given ~H** fails. The monitoring-stack change (shipped with the deploy) is a common cause that can simultaneously trigger both signals via correlated false alarms.  

  ---

  ### 3. Structural Feature and Its Removal
  - **Key feature:** Presence of a **common cause under ~H** (monitoring-stack change) that induces correlation between E1 and E2 when H is false.  
  - **If removed:** If the monitoring-stack change **cannot** cause correlated false alarms, then P(E1 ∧ E2 | ~H) = P(E1|~H)·P(E2|~H) = 0.01. Both naive and correct posteriors become **≈88.89%**.  

  ---

  ### 4. Defense of Independence Heuristic  
  A defender would argue:  
  > "The joint probability P(E1 ∧ E2 | ~H) = 0.06 is unobservable in practice. Without historical data proving correlation, independence is a conservative default. Assuming *no* correlation when none is measured avoids overcomplicating the model."  

  **Strongest attack point:** Estimating P(E1 ∧ E2 | ~H) robustly requires observing rare ~H events (e.g., false alarms) with both signals—a practical challenge. Defaulting to independence is often the only tractable option.  

  ---

  ### 5. Condition for Safe Likelihood Multiplication  
  **Causal condition:** It is safe to multiply likelihoods **if the signals share no common causes other than H itself**. Formally:  
  - Under H, signals are generated by H through independent mechanisms.  
  - Under ~H, signals are generated by **disjoint mechanisms** with no overlapping confounding factors (e.g., no shared instrumentation or environmental flaws).  

  This ensures conditional independence holds for both H and ~H.
