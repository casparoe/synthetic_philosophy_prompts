prompt: |-
  I am a high school junior currently taking an elective on storytelling across novels, film, and games, and a recent discussion with my friends after class left me confused about something I keep experiencing. Last month our teacher showed us an animated short about an elderly lighthouse keeper who loses his dog in a storm, rendered in a style so simplified that no one could mistake it for real footage, and I still found myself tearing up and feeling anxious during the storm scene even while I was fully aware that neither the keeper nor the dog ever existed. I have had similar reactions while reading a novel for homework, feeling angry at a cruel stepmother character and then feeling slightly embarrassed afterward because I knew there was no actual person to be angry at, unlike when I feel angry at someone at school.

  What puzzles me more is that the feeling seems to change when I am given a role in the story. In our after-school game design club, we played a student-made, choice-based game where I had to decide which of two villagers in a mountain village to warn about a flood, knowing I could only save one, and for days afterward I felt guilty and kept wanting to replay to undo my choice, almost as if I had harmed someone, which feels different from the sadness I felt watching the lighthouse keeper. Is there an established name for this pattern of having genuine-seeming emotions toward people and events we know are invented, and especially for the difference between merely witnessing such events and feeling responsible for them as a player or reader who must choose? I am not looking for just a single label, but for an explanation of what the closest existing ideas are, how my examples differ from simply pretending, being temporarily fooled, or caring about real people, and where the boundaries lie, and if there is no precise term, I would appreciate a clear proposed definition that separates the passive case from the interactive guilt case.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're a high school junior in a storytelling elective, and they're experiencing strong emotional reactions to fictional stories across different media—animation, novels, and games. Their main confusion is about why they feel genuine emotions toward characters and events they know aren't real, especially when those emotions differ based on their role (passive observer vs. active participant).

  First, I need to address their three examples: the animated short where they felt sadness despite knowing it's not real, the novel where they felt anger at a character and then embarrassed, and the game where they felt guilt after making a choice. The user is asking for established terms to explain these phenomena, especially the difference between passive and interactive involvement.

  I recall that in psychology and literary theory, there are concepts like the paradox of fiction and emotional transportation. For the passive cases, terms like "willing suspension of disbelief" and "emotional transportation" might apply. The embarrassment they felt after getting angry at the stepmother character ties into meta-emotion, where they're reflecting on their own reaction.

  The interactive part with the game is trickier. Here, the user feels guilt because they had agency in the decision. This reminds me of concepts like agency immersion and moral disengagement. The guilt stems from their active participation, making it different from passive sadness. Terms like "ludonarrative guilt" or "procedural guilt" come to mind, though these aren't standardized. I should also mention Murray Smith's work on engagement with characters and how interactivity heightens emotional stakes.

  I need to explain why these emotions feel genuine even though they know it's fiction. The distinction between cognitive and emotional responses is key. Cognitively, they know it's not real, but emotionally, the brain still reacts. For the game, the added responsibility of choice creates a deeper emotional impact, leading to persistent guilt.

  The user also wants to know the boundaries—how this differs from pretending or being fooled. They're not pretending; the emotions are involuntary. It's also not delusion because they maintain awareness of the fiction. The guilt in interactive scenarios is more personal because they authored the action, unlike passive consumption.

  I should structure the response to first address the passive experiences, then the interactive ones, and finally distinguish them. Highlighting terms like emotional transportation and agency immersion will provide clarity. For the guilt part, introducing "ludonarrative dissonance" or proposing a new term like "interactive guilt" might help, but I should note if it's not established.

  Also, considering the user's context: they're a student interested in storytelling across media. They might need this for their class or personal understanding. Their deeper need could be to articulate these concepts in their studies or discussions with peers. Providing clear definitions and distinctions will help them apply these ideas academically and reflect on their emotional experiences in media consumption.
answer: |-
  What you're describing is a sophisticated observation about how narrative immersion works, and you've pinpointed a crucial difference between passive consumption and interactive participation. There isn't a single, universally agreed-upon term for *every* aspect of this, but several well-established concepts in psychology, philosophy, literary theory, and game studies come together to explain the phenomena you've experienced. Let's break it down:

  ## 1. The Core Phenomenon: Genuine Emotions Towards Fiction

  *   **The Paradox of Fiction:** This is the philosophical problem you're wrestling with: How can we feel genuine emotions (sadness, anger, anxiety, guilt) towards characters and events we *know* are not real?
  *   **Established Explanations & Terms:**
      *   **"Willing Suspension of Disbelief" (Coleridge):** This is the *process* you engage in, often unconsciously. You temporarily set aside your intellectual knowledge ("this is drawn/animated/written") to allow the emotional import of the story to affect you. It's not about being fooled; it's a *choice* to engage emotionally. Your teacher's lesson on storytelling techniques likely primed you for this.
      *   **Emotional Transportation (Gerrig, Green & Brock):** This is the *state* you enter. You feel "transported" into the narrative world. Your focus narrows to the story, your mental imagery becomes vivid (even with simplified animation), and your emotional responses become aligned with the narrative's events. You feel *for* the characters and *with* the characters.
      *   **Empathy & Identification:** Your brain's capacity for empathy doesn't require a real person. Recognizing emotions in characters (facial expressions, body language, thoughts described in novels) triggers mirroring neural pathways. You might partially *identify* with a character, sharing their perspective and goals. The cruel stepmother violates your sense of fairness, triggering anger *as if* it were happening to someone you care about (or yourself).
      *   **Narrative Persuasion:** Stories are powerful tools for conveying emotions and ideas. Skilled creators use techniques (music, pacing, perspective, visual language) specifically designed to evoke targeted emotional responses. The simplified style of the animation likely amplified the core emotions by removing distracting detail.
  *   **Why it feels genuine, not pretend:**
      *   **Neurological Reality:** Brain scans show that emotional responses to compelling narratives activate similar areas (like the amygdala for fear/sadness, insula for disgust/empathy) as responses to real events. The physiological response (tears, anxiety) is real.
      *   **Cognitive vs. Affective Response:** You have two systems: a *cognitive* one ("This is a drawing/fictional character") and an *affective* one ("This situation is sad/scary/unjust!"). The affective system often reacts faster and more automatically, especially when the narrative is well-crafted and taps into universal themes (loss, injustice, danger).
      *   **Meta-Emotion:** Your subsequent embarrassment about being angry at the stepmother *is* the cognitive system catching up and reflecting on the affective response. This reflection is healthy and shows awareness of the distinction.

  **Boundaries vs. Pretending/Being Fooled/Caring for Real People:**

  *   **Pretending:** This is conscious role-play. What you describe is involuntary and visceral. You didn't *decide* to cry; it happened.
  *   **Being Temporarily Fooled (Illusion):** This implies a breakdown in the cognitive awareness that it's fiction. You *never* believed the lighthouse keeper was real; you cried *despite* knowing he wasn't. Suspension of disbelief is not delusion.
  *   **Caring for Real People:** While the neurological overlap exists, the *stakes* are fundamentally different. After the story ends, you know the suffering isn't ongoing in the real world. Your guilt in the game, while intense, lacks the profound, complex, and lasting consequences of real-world harm. Your embarrassment shows you *recognize* this difference.

  ## 2. The Intensified Feeling: When You Are the Agent (The Interactive Guilt Case)

  This is where your experience becomes particularly interesting and highlights a key difference:

  *   **The Source of the Difference: Agency & Responsibility:** In passive media (film, novel, non-interactive animation), you are a *witness*. Your emotions stem from empathy, identification, and transportation. In interactive media (like the choice-based game), you become an *agent*. You are given authorship over an action *within* the fictional world.
  *   **Key Concepts for the Interactive Case:**
      *   **Agency & Moral Responsibility:** By making the choice, you feel *personally responsible* for the fictional outcome. You authored the action ("I chose not to warn villager X"). This triggers powerful psychological mechanisms related to decision-making, consequence, and moral identity.
      *   **Procedural Rhetoric (Bogost):** Games argue through rules and processes. The game's design *forced* you into an impossible choice, making you experience the emotional weight of that dilemma directly. You didn't just watch a character face it; *you* faced it.
      *   **Ludonarrative Resonance/Dissonance:** This describes the relationship between the narrative elements (story) and the gameplay mechanics (rules/choices). In your case, the mechanics (only being able to save one) perfectly reinforced the narrative dilemma (tragic loss), creating strong resonance and amplifying the emotional impact.
      *   **"Ludonarrative Guilt" (Emerging Term):** While not a universally standardized academic term *yet*, "ludonarrative guilt" or "procedural guilt" is increasingly used in game studies to describe precisely this: the profound sense of guilt, remorse, or regret arising specifically from choices made *as a player* within a game's narrative framework, *because* of the agency granted by the mechanics.
      *   **Identification vs. Embodiment:** In passive media, you identify *with* a character. In interactive media, especially first-person or choice-driven games, you often *embody* the protagonist or decision-maker. The actions feel like *your* actions in a more direct way.
      *   **Counterfactual Thinking & Regret:** Your desire to "undo" the choice ("I could have saved the other one!") is classic counterfactual thinking, amplified because *you* made the active decision. This fuels the persistent guilt.
  *   **Why it feels different (and stronger) than passive sadness:**
      *   **Self-Authorship:** The emotion stems from *your own* action within the fiction, not just witnessing an external event. Guilt is inherently self-referential.
      *   **Moral Self-Evaluation:** Your action forced you to make a moral compromise ("I value one life over another," even if the reason was arbitrary). This challenges your self-perception as a "good" person.
      *   **Persistence:** Because the outcome resulted from *your* specific choice, the memory is tagged differently. You ruminate on the *what-if* scenario ("What if I chose differently?") in a way you wouldn't with a predetermined narrative outcome like the lighthouse dog's fate. You had control, then lost it, with permanent fictional consequences.

  ## Proposed Definitions Separating the Cases

  Based on established concepts and your experiences:

  1.  **Narrative-Transportive Emotion (Passive Case):** *The experience of genuine affective states (e.g., sadness, anger, anxiety, joy) evoked by a fictional narrative, stemming from empathy, identification, and emotional transportation, occurring despite full cognitive awareness of the narrative's fictionality.* (This explains the lighthouse keeper and stepmother anger).
  2.  **Agentive Ludonarrative Guilt (Interactive Case):** *A specific, intense form of regret or guilt arising from the exercise of player agency within an interactive narrative system. It results from the player feeling personally responsible for morally consequential fictional outcomes determined by their choices, leading to persistent counterfactual thinking ("what if?") and self-evaluative discomfort, distinct from emotions evoked through passive observation.* (This explains your village flood game experience).

  ## Conclusion

  You've astutely identified a fundamental truth about human cognition and narrative: **We are wired to respond emotionally to stories, even fictional ones, because they tap into our deep capacities for empathy, pattern recognition, and social understanding.** The "paradox of fiction" is resolved by understanding the separation (and sometimes conflict) between our cognitive and affective systems.

  The crucial difference you felt arises from **agency**. When you are merely a witness, your emotions are primarily empathic responses *to* the characters' plights. When you are an active agent making consequential choices, your emotions become deeply intertwined with your *own* sense of responsibility and moral self within the fictional framework. This "agentive ludonarrative guilt" is a powerful and increasingly recognized phenomenon in interactive storytelling, demonstrating how games can create unique and profound emotional experiences by making the player complicit in the narrative's unfolding drama. Your experiences are not only normal but also a testament to your engagement with these powerful narrative forms.
