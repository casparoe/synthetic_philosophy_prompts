prompt: |-
  so i'm an undergrad taking an animal ethics course this semester (honestly its my favorite class) and i somehow got elected student rep on the university's dining services advisory committee. every couple of weeks we vote on menu proposals from the dining staff -- stuff we've had this semester: swapping the default protein at the burrito station from beef to chicken to save money, adding a "meatless monday", switching to a cheaper chicken supplier, etc. the rest of the committee is staff who care about cost and student satisfaction, and i'm the only one who thinks about the animal side, but i can't exactly run a full utilitarian calculation on each proposal in the five minutes it gets in the meeting. from my course i've learned enough to know it's messy: the obvious stuff (chicken vs beef, where per kg chicken means vastly more animals killed), but also the less obvious stuff like animals dying in crop cultivation from harvesting, which makes even "just add more plant-based options" not a free win. i want a decision procedure i can actually run, maybe on a napkin: a short ordered list of questions to ask about any proposal, what counts as enough of an answer to each one, where the procedure outputs a no, and where it should punt and say "this is a values question, argue it in the open instead." then run it on three realistic proposals: (1) replacing beef with chicken at two stations to cut costs, (2) a meatless monday where the vegetarian option is just a bigger portion of veg they already serve, and (3) switching to a local pasture-raised beef that costs noticeably more. at least one of these should come out with an answer i won't like, and you should be upfront about where the procedure misfires or depends on numbers nobody actually has (like how many animals die per kg of each food, or per hectare of crops). also keep the philosophy jargon out or define it in plain words, since i have to hand a one-page version of this to the other committee members and they will not read anything that sounds like a seminar.
reasoning: |-
  Okay, the user is an undergrad in an animal ethics course and is serving as the student rep on their university's dining services advisory committee. They need a practical, quick decision-making tool for evaluating menu proposals from an animal welfare perspective. The committee focuses on cost and student satisfaction, so the user is the only one considering the animal side. They want a simple, step-by-step list of questions that can be applied in meetings where each proposal gets only about five minutes of discussion.

  First, I need to understand the core challenge: balancing ethical concerns with real-world constraints. The user mentioned complexities like comparing chicken vs. beef (where chicken involves more animals killed per kg) and the hidden impact of crop cultivation on animals. They need a method that's both practical and ethically sound, avoiding complex calculations.

  The user provided three proposals to test the procedure: replacing beef with chicken, implementing a Meatless Monday with existing veggies, and switching to local pasture-raised beef. The procedure must handle cases where the answer might be unfavorable, and it should flag when decisions depend on unavailable data or values-based debates.

  Breaking down the requirements: The tool must be concise, jargon-free, and fit on one page. It should have clear yes/no/maybe outputs and identify when to defer to committee discussion. Steps should prioritize high-impact factors first, like animal numbers and suffering intensity, before moving to secondary issues like environmental or student acceptance.

  For the procedure, start with a threshold question: Does this change increase or decrease animal product use? If it reduces, that's good; if it increases, bad. If neutral, move to the next step. Then assess which animals are affected—focus on numbers killed per kg and suffering levels. Here, chicken vs. beef is a key example: chickens suffer more in intensive farming, and more are killed per kg, so switching beef to chicken is worse despite cost savings.

  Next, consider secondary effects like crop deaths. But since data is scarce, this step should only adjust the decision if there's strong evidence. Otherwise, default to the earlier steps. Also, include practical checks: will this cause backlash that undermines future efforts? For Meatless Monday, even if crop deaths are a factor, the reduction in meat likely outweighs it, making it a net positive.

  Testing the proposals: For beef to chicken swap, the procedure clearly flags it as bad due to increased animal suffering and numbers. Meatless Monday is a yes, as it reduces meat consumption. Switching to pasture-raised beef is tricky—it might reduce suffering per animal but increase costs, potentially reducing consumption. Since the proposal doesn't specify consumption changes, it defaults to a values debate, highlighting cost vs. welfare trade-offs.

  The user's deeper needs include wanting to advocate effectively without alienating the committee. They need a tool that legitimizes their input with clear logic, making ethical considerations accessible. By providing a structured approach, the user can present arguments confidently, even when outcomes aren't ideal, and foster informed discussions when data is lacking.
answer: |-
  Here's a practical "Napkin Decision Procedure" for animal impact in dining proposals, designed for speed and clarity:

  **Animal Impact Quick Check (For Dining Proposals)**

  Ask these questions **in order**. Stop when you get a clear "Yes" (Good for Animals), "No" (Bad for Animals), or "Debate Needed" (Values/Data too murky).

  1.  **Does this proposal *directly* reduce the total amount of animal products (meat, dairy, eggs) served overall this week?**
      *   **Yes?** → **GOOD (Likely Yes)**. (Reducing consumption is generally the strongest lever for reducing harm). *Proceed to Step 3 briefly.*
      *   **No?** → Go to Step 2.
      *   **Unclear/Depends?** → Go to Step 2.

  2.  **Does this proposal *directly* increase the total amount of animal products served overall this week?**
      *   **Yes?** → **BAD (Likely No)**. (Increasing consumption generally increases harm). *Proceed to Step 3 briefly.*
      *   **No?** → Go to Step 3.
      *   **Unclear/Depends?** → Go to Step 3.

  3.  **Which specific animals are most affected? Focus on *numbers* and *suffering intensity*:** (Compare the *main* animal product being changed)
      *   **Higher Suffering & More Animals/Kg?** (e.g., Switching *to* Chicken/Pork/Fish *from* Beef/Lamb) → **BAD (Likely No)**. (Chickens/fish live shorter, more crowded lives; far more are killed per kg than cows/sheep).
      *   **Lower Suffering & Fewer Animals/Kg?** (e.g., Switching *to* Beef/Lamb *from* Chicken/Pork/Fish) → **GOOD (Likely Yes)**. (Fewer individual lives affected, potentially less intense suffering systems).
      *   **Switching Between Similar Types?** (e.g., Chicken to Chicken, Beef to Beef) or **Switching to Plants?** → Go to Step 4.

  4.  **Are there major secondary impacts? (Be conservative - data is usually fuzzy):**
      *   **Significant Increase in High-Death Crops?** (e.g., Proposing *massive* new soy/rice fields solely for this change? Unlikely!) → Might lean **BAD**, but usually **Debate Needed** (Data scarce, impact small per meal).
      *   **Clear Major Welfare Improvement?** (e.g., Switching to certified higher-welfare source like pasture-raised, cage-free) → Might lean **GOOD**, but see Step 5.
      *   **None Obvious or Tiny?** → Default to answer from Steps 1-3. If stuck at Step 3, **Debate Needed**.

  5.  **Practicality Check (Avoid Backfires!):**
      *   **Will this likely cause a major student backlash *increasing* animal product use elsewhere?** (e.g., Removing ALL burgers causes students to order *more* chicken delivery?) → Might lean against a "GOOD" proposal, **Debate Needed**.
      *   **Is the cost change so extreme it could sabotage future good proposals?** → **Debate Needed** (Values: Cost vs. Welfare).

  **Output Summary:**
  *   **GOOD (Yes):** Implement if feasible (consider cost/satisfaction too).
  *   **BAD (No):** Oppose based on animal impact.
  *   **DEBATE NEEDED:** Flag the animal welfare pros/cons clearly for committee discussion. Focus on the key trade-off identified (e.g., "This might slightly improve conditions per cow but costs much more, potentially reducing consumption overall. Is that trade-off worth it?").

  ---

  **Applying the Procedure to Your Proposals:**

  1.  **Replacing Beef with Chicken at Two Stations (Cost Savings):**
      *   Step 1: Reduces animal products? **No** (Same stations, similar protein amounts, just swap).
      *   Step 2: Increases animal products? **No**.
      *   Step 3: Which animals affected? **Switching Beef (Cows) to Chicken**. **→ BAD (Likely No)**. *Significantly more individual chickens will be killed, and they typically experience more intense confinement/suffering than beef cattle.*
      *   **OUTPUT: BAD (No) - Oppose on animal welfare grounds.** *Cost savings come at a high animal cost.*

  2.  **"Meatless Monday" - Bigger Portion of Existing Veggies:**
      *   Step 1: Reduces animal products? **YES!** (One day, no meat at stations where it was previously default). → **GOOD (Likely Yes)**.
      *   Step 3: (Briefly) Switching to Plants. No animal product directly involved in the *new* offering.
      *   Step 4: Secondary impacts? Minor increase in existing veggies. Crop deaths exist, but vastly fewer animals die per kg of plants than per kg of meat. This reduction in meat *overwhelmingly* reduces total animal harm. Tiny potential downside irrelevant here.
      *   Step 5: Backfire risk? Low if well-implemented (still offer meat elsewhere? Good promotion?).
      *   **OUTPUT: GOOD (Yes) - Support.** *Clear reduction in animal product consumption is the dominant factor.*

  3.  **Switching to Local Pasture-Raised Beef (Costs More):**
      *   Step 1: Reduces animal products? **Unclear/Depends.** (Higher cost *might* slightly reduce beef consumption if prices rise, but proposal doesn't specify changing portion sizes or availability). Assume **No** direct reduction for now.
      *   Step 2: Increases animal products? **No**.
      *   Step 3: Which animals affected? **Switching Beef to Beef.** → Go to Step 4.
      *   Step 4: Secondary impacts? **Clear Major Welfare Improvement?** YES (Pasture-raised generally = significantly better life for cows than feedlot). → Leans **GOOD**.
      *   **BUT CRITICAL STEP 5:** Practicality Check: **Will the cost increase *reduce* overall beef consumption?** (Good for animals) OR **Will students just pay more, keeping consumption the same?** (Just welfare improvement) OR **Could it *increase* prestige/consumption?** (Bad). **Data/Impact Unknown.** Also, **Cost Extreme?** Could hurt budget/future proposals.
      *   **OUTPUT: DEBATE NEEDED.** *Flag the key trade-off: "This *should* improve welfare per cow, but the higher cost is significant. Will it actually reduce the number of cows eaten, or just make beef more expensive? If consumption stays the same, it's a welfare win but costly. If consumption drops, it's a bigger win. If it increases, it's bad. We need to discuss this uncertainty and the cost impact."*

  **Where it Misfires/Depends on Missing Data:**

  *   **The Big One: Consumption Elasticity:** The hardest part is predicting *how much* a price change (like the expensive beef) actually changes how much students eat. This is crucial for proposals affecting cost (Steps 1/2 & Step 5). We rarely have this data. The procedure forces this uncertainty into the open ("Debate Needed").
  *   **Crop Deaths:** While real, their impact per calorie is orders of magnitude smaller than meat production. The procedure (Step 4) deliberately minimizes this unless there's a *huge, specific* crop increase, which is rare in dining hall tweaks. It avoids paralysis by this complex issue.
  *   **"Per Animal" Suffering Comparisons:** Step 3 relies on broad consensus (e.g., chicken factory farming vs. beef feedlots is worse per animal *and* per kg). Comparing pasture-raised chicken to feedlot beef would be messier, but your examples are clear-cut.
  *   **Indirect Effects:** Could Meatless Monday make people eat *more* meat Tuesday? Possible, but research suggests overall reduction usually wins. The procedure assumes Step 5 catches major, predictable backfires.

  **The Napkin Version (Handout for Committee):**

  **Animal Impact Quick Check (Student Rep Tool)**

  1.  **Does this *reduce* meat/dairy/eggs served?** YES → Likely **Good**.
  2.  **Does this *increase* meat/dairy/eggs served?** YES → Likely **Bad**.
  3.  **If swapping meats, is it TO chicken/fish/pork FROM beef/lamb?** YES → Likely **Bad** (Hurts more animals worse). Is it TO beef/lamb FROM chicken/etc.? YES → Likely **Good** (Helps fewer animals more).
  4.  **Big hidden downside (e.g., huge new crops) or clear welfare upgrade?** Rarely decisive alone.
  5.  **Will it badly backfire or break the budget?** Could change a Good to Debate.

  **Result:** Good (Support), Bad (Oppose), or **DEBATE** (Need to talk trade-offs: Welfare vs. Cost vs. Risk).

  **Applied to Proposals:**
  1.  Beef to Chicken: **BAD** (Hurts many more chickens).
  2.  Meatless Monday: **GOOD** (Less meat eaten).
  3.  Pricey Local Beef: **DEBATE** (Better life per cow? Yes. But will cost mean fewer cows eaten or just pricier burgers? Unknown. Cost is high.).
