prompt: |-
  I have been helping draft a collections policy for the small archive at the college where I work, and the more I look at what we already do, the less I understand what we think we are doing. Concretely: we hold the papers of a few dozen administrators, trustees, and prominent alumni, a number of which arrived with donor agreements sealing portions of them for twenty or twenty-five years; we work from a records-retention schedule under which most routine administrative files are destroyed after a set period and only a small remainder is flagged for permanent retention, with the destruction itself logged only as a note at the level of the whole series, so that no one can later tell what was in the files; our mission statement says we preserve the documentary record of the institution and make it available without taking sides in the disputes the records document; and we have a standing rule that we do not create records, we only acquire them — even though we also run an oral history program interviewing residents of the neighborhoods the college displaced in the 1960s and 1970s, and have begun digitizing the records of a few community organizations that keep the originals and let us host the scans. Meanwhile the same policy document complains that the collection is silent about the people most affected by the institution's decisions, and proposes outreach as the remedy.

  What I want from you is not a defense or an indictment of any of this, but the theory it presupposes. Taking these practices together, what must we believe about what makes a record worth keeping — is significance a property of the document itself, or of some relation to possible future users, or a byproduct of who happened to hold power and who happened to be written down? What must we believe about the archivist — a neutral conduit through which material passes, or a participant in the events being documented? What does the retention schedule assume about the value of the ordinary and the bureaucratic relative to the exceptional and the prominent? And what picture of the public, and of its claim on the record, is built into a mandate to preserve the record for accountability while sealing a donor's papers for a quarter century?

  Then separate what is genuinely forced on us from what is merely compatible. Which parts of this policy would be equally licensed by a rival account of what archives are for — say, a privacy-based account of donor restrictions, a property-based one, or a purely pragmatic "sealed is better than lost" one — and where do the pieces actually conflict rather than merely sit uneasily together? Finally, suppose we replaced the presupposed view with something like its opposite: that the archive's job is to document the exercise of power over people rather than to keep the papers of the powerful, and that a gap in the record is itself something to be recorded, dated, and explained. Tell me what would have to change in our acquisitions, our retention schedule, our access rules, and our finding aids, and which of those changes would be genuine implications of the new view rather than just things that would look nicer.
reasoning: |-
  Okay, the user is working on a collections policy for their college archive and feels confused by the existing practices. They've listed several conflicting elements: sealed donor agreements, destruction of routine files with minimal logging, a mission statement about neutrality, a rule against creating records, yet they run an oral history program and digitize community records. The policy also acknowledges gaps in documenting affected communities. 

  Hmm, the core issue seems to be internal contradictions in their archival philosophy. The user isn't asking for judgment but wants to uncover the underlying theory behind these practices. They're essentially asking: "What worldview makes these contradictions seem coherent?" That's a sophisticated meta-question—they're not looking for fixes but for diagnostic clarity.

  Breaking it down, I see four layers to address:
  First, the implicit theory behind current practices. The sealed donations and destruction logs suggest a custodial view where archives passively receive "important" documents (defined by institutional hierarchy). The neutrality claim and non-creation rule position archivists as neutral channels, yet the oral histories betray active documentation—which is philosophically at odds. The retention schedule's focus on permanent vs. disposable implies bureaucratic records only matter as evidence of formal decisions, not daily realities.

  Second, the user wants to separate necessary compromises from optional choices. For example, sealed donations could stem from privacy laws (necessary) or donor appeasement (optional). Minimal destruction logging might be efficiency (optional) versus legal compliance (necessary). This distinction helps identify where change is feasible.

  Third, they propose flipping the theory: what if archives documented power imbalances instead of powerful people? That would require proactive community acquisition, transparent gap-tracking in finding aids, and rethinking access restrictions that protect elites. The key is distinguishing cosmetic changes (rewriting mission statements) from operational ones (reallocating acquisition budgets).

  Finally, the user's tone suggests frustration with institutional hypocrisy—they see the oral history program as unintentionally highlighting the archive's failure to document marginalized groups. Their real need might be for leverage: a clear framework to convince stakeholders that current practices aren't just messy but philosophically inconsistent. The unspoken ask is for intellectual ammunition to justify reform.

  Notable tensions: The "no record creation" rule directly clashes with oral histories. Also, sealing elite papers while preaching accountability is ideologically jarring. Pragmatically, the college might depend on donor goodwill, making some restrictions unavoidable. But the policy could at least admit this tradeoff instead of claiming neutrality.

  Alternative theories to consider: A critical archiving model would treat gaps as active silences—requiring metadata like "Destroyed per Schedule X, 2023" in finding aids. Acquisition would prioritize power's subjects over power-holders. Digitization partnerships might shift to co-custodianship models where communities control scans. Genuine implications include: donor agreements might be rejected if sealing periods conflict with accountability timelines, and destruction logs would itemize contents to make erasure visible.

  What wouldn't change? Legal holds and FERPA-related redactions would remain. But the "neutral conduit" myth would dissolve—archivists would openly frame collections through historical power analysis. The hardest shift: accepting that documenting displacement means critiquing the college itself. That's where the new theory bites.
answer: |-
  Your current practices reveal a deeply embedded archival theory—a **Neo-Custodial Institutionalism**—characterized by these core presuppositions:

  ### Core Tenets of the Implicit Theory  
  1. **Value of Records**:  
     - Significance resides in **institutional hierarchy** & **formal exceptionalism**. Papers of trustees/administrators are inherently valuable; routine records are disposable unless flagged as "historic" by institutional criteria.  
     - **Silences are neutral byproducts**, not ethical failures. Gaps arise from organic acquisition ("who offered") rather than systemic exclusion.  

  2. **Archivist’s Role**:  
     - **Passive custodian**, not active documentarian. "Do not create records" enforces neutrality-as-invisibility, treating oral histories/digitization as exceptions, not challenges to the model.  
     - **Institutional servant**: Accountability is secondary to administrative convenience (e.g., aggregated destruction logs).  

  3. **Value of the Ordinary**:  
     - Bureaucratic records are **evidentiary widgets**, not cultural artifacts. Retention schedules assume routine operations lack historical insight—only "decisions" (minutes, reports) merit preservation.  

  4. **Public Claim vs. Private Control**:  
     - **Deferred accountability**: Sealed donations prioritize donor privilege over public right. The 25-year seal assumes accountability expires with living memory.  
     - **"Public" means institutional researchers**, not displaced communities. Outreach addresses "gaps" without redistributing authority.  

  ---

  ### What’s Forced vs. Merely Compatible  
  | **Practice**               | **Forced by...**                                                                 | **Compatible With...**                                                                 |  
  |----------------------------|----------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|  
  | **Sealed donations**       | Donor leverage (pragmatism); legal deeds (property rights)                       | Privacy ethics; "better sealed than lost" pragmatism                                   |  
  | **Minimal destruction logs** | Administrative efficiency; records management conventions                        | *Conflicts with accountability*: Conceals erasure of marginalized voices               |  
  | **Oral history program**   | *Contradicts core theory*: Reveals active documentation as "exception"           | Community-centered theory (if given primacy)                                           |  
  | **"Do not create records"**| Institutional self-protection; positivist neutrality myth                        | Traditional custodialism; legalist frameworks (archives as receptacle)                 |  

  **Irreconcilable Tensions**:  
  - **Neutrality vs. Silence**: Mission claims neutrality while practices silence power asymmetries.  
  - **Community Digitization vs. Power-Centered Acquisitions**: Digitizing community records *hosted* by the archive maintains institutional control; originals remain elsewhere.  

  ---

  ### Shifting to a **Critical Documentation of Power**  
  If archives exist to **document power structures and their consequences**, your practices would transform radically:  

  | **Current Practice**       | **Change Required**                                                                 | **Cosmetic vs. Core Change** |  
  |----------------------------|-------------------------------------------------------------------------------------|------------------------------|  
  | **Acquisitions**           | Prioritize records of the *governed* (students, staff, displaced residents) over governors; reject sealed donations exceeding 10 years. Require community co-stewardship for digitized materials. | **Core**: Shifts power from elites to subjects. |  
  | **Retention Schedule**     | Retain routine records (HR, facilities, student services) to expose systemic patterns; log destruction at item level with public metadata (e.g., "Financial Aid Appeals: Destroyed 2025"). | **Core**: Makes bureaucratic violence visible. |  
  | **Access Rules**           | Override donor seals for public-interest disputes; redact only personal data, not institutional critiques. | **Core**: Rejects property rights as paramount. |  
  | **Finding Aids**           | Annotate gaps: *"Trustee Papers 1965-1970: No records of displacement decisions exist; see Oral History Collection 'Voices of Elmwood.'"* | **Core**: Treats silence as evidence. |  
  | **Oral Histories**         | Integrate into core mission (not an "exception"); grant interviewees co-ownership rights. | **Core**: Archivists as facilitators, not owners. |  
  | **"Do Not Create Records"**| Revoke: Actively document institutional harm (e.g., protest footage, land-use audits). | **Core**: Archivists as witnesses. |  

  **Genuine Implications (Non-Negotiable)**:  
  - **Reject "neutrality"**: Take sides with the marginalized in descriptive practices.  
  - **Destroy less, document more**: Routine records become evidence of institutional culture.  
  - **Democratize control**: Community partnerships require shared authority, not token hosting.  
  - **Expose erasure**: Destruction logs must detail *what* was lost and *why* it mattered.  

  ---

  ### Key Philosophical Shift  
  Your current model assumes **history flows from institutional decisions**. The alternative centers **history as the collision between power and lived experience**. This isn’t about "niceness"—it demands dismantling the archive’s role as an institutional monument. To document power, you must first redistribute it.
