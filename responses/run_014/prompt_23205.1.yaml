prompt: |-
  I'm a software engineer with no formal philosophy background, but I've been getting dragged into reading about Kant's views on animals because a friend of mine is writing a paper on it and keeps pulling me into the conversation. I think I get the basic picture: Kant doesn't think animals are moral patients, so we don't owe them any direct duties, but he does say we have an indirect duty not to be cruel to animals, on the grounds that being cruel to them makes you a worse person toward other humans. But the more I think about it the more I'm confused, because it seems to me like the indirect duty thing is just a roundabout way of granting animals intrinsic value. Like, if the reason I'm not allowed to kick the dog is that the dog's suffering corrupts my character, then the dog's suffering is obviously the thing doing all the moral work, right? It's whole reason the duty exists in the first place. So doesn't Kant just smuggle intrinsic value for animals in through the back door and then pretend he hasn't?

  To be fair I tried to steelman the other side. My guess is that Kant would say the dog's suffering only matters insofar as it's a means to some end that does have value, like my own virtue or other people's well being. But then I get stuck, because if the suffering is just a means, why does it have to be the dog's suffering specifically? I could corrupt my character in a bunch of other ways that don't involve animals at all. So it feels like the animal's suffering is doing more work than just a means would allow, which brings me right back to thinking Kant secretly thinks it has value. I know I'm probably just confusing myself, but I'd love for someone to untangle this.
