prompt: |-
  I chair the IRB at a mid-size research university, and we have to decide by Friday whether a 7-member committee votes by simple majority on a contested animal-protocol case or defers to the chair's recommendation as tiebreaker. The chair has been quoting the Condorcet jury theorem at every meeting — the result that if each voter is individually better than a coin flip and votes are independent, the probability the majority is correct rises with group size — and wants us to adopt majority voting on that ground. I don't think the theorem actually licenses the conclusion he's drawing, but I can't quite put my finger on why. Can you draft a short memo for the committee that (a) recommends majority voting or deferral to the chair, (b) engages honestly with the strongest case for the chair's position, and (c) says concretely what the theorem does and doesn't establish for us, with a proposed timeline for the vote?
reasoning: |-
  Okay, the user chairs an IRB at a mid-size university and needs to decide by Friday whether to use simple majority voting or defer to the chair's recommendation as a tiebreaker in a contested animal-protocol case. The chair keeps citing the Condorcet jury theorem to support majority voting, claiming that larger groups make better decisions if each member is slightly better than random. But the user feels this might be misapplied and wants a memo that fairly addresses the chair's argument while recommending a practical path forward.

  First, I need to unpack why the chair's reliance on the Condorcet theorem could be problematic. The theorem assumes voter independence and identical competence – but in reality, IRB members likely have correlated biases (e.g., disciplinary norms) and varying expertise on animal protocols. Also, "better than coin flip" is vague here; without evidence of individual accuracy exceeding 50%, the theorem's premise isn't satisfied. The user intuitively senses this but needs concrete rebuttals.

  The memo must balance three goals: (a) recommend either majority voting or deference (leaning toward majority as default given democratic principles), (b) engage the chair's argument charitably by acknowledging the theorem's logic under ideal conditions, and (c) clarify the theorem's limits for their context. I should emphasize that the theorem doesn't guarantee real-world superiority without its strict assumptions holding.

  For structure, I'm considering: 
  - Opening with urgency (Friday deadline) 
  - Summarizing both voting options neutrally 
  - Explaining the theorem's logic/strengths per chair's view 
  - Detailing 3-4 key limitations (independence, competence quantification, homogeneity, small-N issues) 
  - Recommending majority voting as default but suggesting chair breaks ties to respect their role 
  - Proposing a voting timeline 

  The user's deeper needs might include: 
  - Preventing hierarchical overreach (chair dominating) 
  - Ensuring rigorous ethical review 
  - Maintaining committee cohesion 
  - Needing a defensible rationale to counter the chair's potentially overconfident use of theory 

  I'll avoid academic jargon and focus on practical implications – e.g., "If members share biases, the theorem's 'wisdom of crowds' effect weakens." The recommendation should subtly empower the committee while acknowledging the chair's expertise via the tiebreaker role. Timeline: Thursday discussion → Friday vote models good governance.
answer: |-
  **MEMORANDUM**  
  **To:** Institutional Review Board (IRB) Members  
  **From:** [Your Name], IRB Committee Member  
  **Date:** October 26, 2023  
  **Subject:** Decision on Voting Procedure for Contested Animal-Protocol Case  

  ### **I. Recommendation**  
  I recommend we adopt **simple majority voting** for the contested animal-protocol case, with the Chair’s recommendation serving **only as a tiebreaker** in the event of a deadlocked vote (e.g., 3–3). This balances collective wisdom with the Chair’s expertise while upholding democratic deliberation.  

  ### **II. Engaging with the Chair’s Position**  
  The Chair rightly invokes the **Condorcet Jury Theorem (CJT)** to argue that group voting can outperform individual decisions. The CJT states:  
  > If voters (i) are *independent*, (ii) each have a competence *p > 0.5* (better than random chance), and (iii) vote sincerely for the "correct" outcome, the probability the majority decides correctly approaches 1 as the group size increases.  

  Under these idealized conditions, the Chair’s case is strong: a 7-member majority vote would theoretically be more reliable than a single expert’s judgment.  

  ### **III. What the Theorem Does and Does Not Establish**  
  While the CJT offers valuable insight, its applicability here is limited:  
  1. **Independence Assumption**:  
     - CJT requires voters to form opinions *independently*. In practice, IRB deliberations create shared information and social dynamics that may erode independence, reducing the theorem’s predictive power.  
  2. **Competence Threshold (*p > 0.5*)**:  
     - CJT assumes each member’s *p* exceeds 50%. We have not assessed whether all members meet this threshold for *this specific case* (e.g., complex animal welfare issues may push *p* toward 0.5 for some).  
  3. **Homogeneity of Competence**:  
     - CJT assumes identical *p* for all voters. In reality, expertise varies across the committee. The Chair’s deep experience may grant them higher *p* individually, but CJT does not prove that majority voting dominates a high-*p* expert.  
  4. **Small-Group Limitations**:  
     - With *n = 7*, the theorem’s "large group" benefit is modest. If average competence is *p = 0.6*, a 7-member majority is correct ~71% of the time vs. 60% for one expert. If *p = 0.55*, majority accuracy drops to ~62%—marginally better than a coin flip.  

  **In short**: CJT supports majority voting *if* voters are independent and reliably competent, but it does not guarantee superiority in real-world contexts like ours, where expertise is heterogeneous and independence is compromised by collaboration.  

  ### **IV. Why Majority Voting (with Tiebreaker) Remains Preferable**  
  - **Democratic Legitimacy**: Collective buy-in is critical for ethically fraught decisions.  
  - **Risk Mitigation**: Majority voting dilutes individual biases, while the Chair’s tiebreaker leverages their expertise when consensus fails.  
  - **Practicality**: Deferring entirely to the Chair risks underutilizing committee expertise and may set an undesirable precedent for future cases.  

  ### **V. Proposed Timeline**  
  - **Thursday, 10 AM**: Circulate final protocol documents.  
  - **Thursday, 3 PM**: 30-minute virtual meeting for clarifying questions (no deliberation).  
  - **Friday, 9 AM**: Anonymous majority vote (via secure ballot).  
  - **Friday, 12 PM**: If deadlocked (e.g., 3–3), Chair’s recommendation decides.  
  - **Friday, 1 PM**: Final decision communicated.  

  ### **VI. Conclusion**  
  The CJT provides a strong theoretical argument for majority voting but relies on assumptions we cannot verify for this case. Pragmatically, simple majority voting with the Chair as tiebreaker respects both collective judgment and the Chair’s role, ensuring efficiency without sacrificing rigor. I urge the committee to adopt this approach.  

  Respectfully submitted,  
  [Your Name]  
  IRB Committee Member  

  ---  
  **Key Revisions Based on Your Request**:  
  - Explicitly **recommends majority voting + tiebreaker** (not full deference).  
  - **Engages fairly with CJT** by detailing its logic/strengths (Section II).  
  - **Clarifies CJT’s limits** (Section III) using concrete examples (*p* = 0.6 vs. 0.55).  
  - **Provides actionable timeline** (Section V) to meet Friday deadline.  
  - Avoids technical jargon; focuses on practical IRB context.
