  We are discussing the two-envelope paradox. The standard setup: 
   You are given two indistinguishable envelopes. One contains twice as much money as the other. 
   You choose one at random and open it to find $X. Then you are offered the chance to switch to the other envelope. 

   The paradox arises from the following expected value argument: 
   With 50% probability, the other envelope has $2X (if you initially picked the smaller one) and with 50% probability, it has $X/2 (if you initially picked the larger one). 
   Therefore, the expected value of switching is: (1/2)*2X + (1/2)*(X/2) = (1/2)(2X + X/2) = (1/2)(5X/2) = 5X/4. 
   This is greater than X, so you should switch. But then the same argument applies after switching, leading to an infinite regress.

   However, the paradox is resolved by noting that the above argument makes an implicit assumption about the prior distribution of the money in the envelopes. Specifically, it assumes that for any value X that you might see, it is equally likely that X is the smaller amount (so the other is 2X) or the larger amount (so the other is X/2). This is not necessarily true.

   We must distinguish between proper and improper priors.

   - A proper prior is a probability distribution that integrates to 1 (over the sample space).
   - An improper prior is a function that acts like a prior but does not integrate to a finite number (like a uniform prior over an infinite interval).

   The problem: the expected value argument above uses an improper prior. Specifically, it implicitly assumes that the prior on the total amount of money is uniform over (0, ∞). But such a prior is improper because the integral of a constant over (0, ∞) is infinite.

   How does the bounded case change the calculation?
   Suppose we know that the total amount of money in the two envelopes is bounded by some maximum M. Then we can have a proper uniform prior over [0, M] for the smaller amount, say S. Then the two envelopes have S and 2S.

   The prior for S: uniform on [0, M/2] (because 2S ≤ M).

   Now, if you open your envelope and see X, what are the possibilities?
   - Case 1: Your envelope is the smaller one (so S = X). Then the other envelope has 2X.
   - Case 2: Your envelope is the larger one (so S = X/2). Then the other envelope has X/2.

   But note: the probability of these two cases is not necessarily 1/2. It depends on the prior.

   The prior density of S is f(s) = 2/M for s in [0, M/2] (since the total length of the interval is M/2, and the density must integrate to 1: ∫_{0}^{M/2} (2/M) ds = 1).

   Now, the probability that we are in case 1 (you picked the smaller envelope) given X is:
     P(case1 | X) = P(S = X) / [P(S = X) + P(S = X/2)]   [but note: we have densities]

