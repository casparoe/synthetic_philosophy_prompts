          If it's the larger, then s = X/2 (which is in [0, M/2] because X<=M/2 in this interval? Actually, if X is in [0, M/2], then X/2 is in [0, M/4] which is a subset of [0, M/2]) -> so both cases are possible.

     - X in (M/2, M]: then it must be the larger envelope? Because if it were the smaller, then s = X > M/2, but s is bounded by M/2. So only case 2 is possible.

