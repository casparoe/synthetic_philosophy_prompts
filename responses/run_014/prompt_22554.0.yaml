                       = [ 2X + (X/2) e^{λX/2} ] / [1 + e^{λX/2}]
                       = X * [ 2 + (1/2) e^{λX/2} ] / [1 + e^{λX/2}]

          Let t = e^{λX/2} (which is >1). Then:

                       = X * [ 2 + (1/2)t ] / [1+t] 
                       = X * [ (4 + t) / (2(1+t)) ]

