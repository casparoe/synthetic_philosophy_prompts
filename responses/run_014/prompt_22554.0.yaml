   Now, what about the unbounded case?
   The problem is that without a bound, we cannot have a uniform prior on the positive real line because it would be improper. The expected value calculation then becomes:

          E[other | X] = (1/2)*2X + (1/2)*(X/2) = (5/4)X   [if we assume that the two cases are equally likely for every X]

   But why is this assumption of equal likelihood for every X problematic?

   In the unbounded case, if we try to use a proper prior, we must choose a distribution that integrates to 1. For example, let the smaller amount S have a proper prior, say an exponential distribution: f(s) = λ e^{-λs} for s>0.

   Then, the two envelopes have s and 2s.

   Now, we observe X. How do we update?

   The event that we see X in the chosen envelope can happen in two ways:

     - The chosen envelope is the smaller: then s = X, and the probability density for this event is (1/2) * f_s(X) = (1/2) λ e^{-λX}.
     - The chosen envelope is the larger: then s = X/2, and the probability density for this event is (1/2) * f_s(X/2) = (1/2) λ e^{-λX/2}.

   Therefore, the conditional probability that the chosen envelope is the smaller given X is:

          P(smaller | X) = [ (1/2) λ e^{-λX} ] / [ (1/2) λ e^{-λX} + (1/2) λ e^{-λX/2} ]
