          Similarly, when X < (2 ln 2)/λ, then t<2 and we do not switch? Actually wait:

          Let me check: t>2 when X > (2 ln 2)/λ -> then (4+t)/(2+2t) > 1 -> then E[other] > X -> switch.
          When t<2 (i.e., X < (2 ln 2)/λ), then (4+t)/(2+2t) < 1 -> then E[other] < X -> do not switch.

