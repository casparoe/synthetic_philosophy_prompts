  I should compare their agreements: both argue for indeterminacy beyond observational evidence. Differences: Quine is about translation from behavior, Putnam about reference in theories. Quine's is epistemic; Putnam's logical/ontological. Putnam targets metaphysical realism, whereas Quine is more about language and meaning.

  The user might also need to know if one argument succeeds where the other fails. Critics of Quine say behavioral evidence might be sufficient with more context. Putnam's argument is logically sound but might rely on ideal theories, which some dispute. Both have responses, but Putnam's is broader.

