prompt: |-
  I'm trying to get a case for a seminar that seperates two things people collapse: actually making a difference to a collective harm, and being responsible for your role in a joint practice that produces the harm. Can you build me a scenario where the wouldn't-have-mattered-anyway objection is true in the strongest sense -- the person's act is not a difference maker for the harm -- but the person is still clearly doing wrong? Constraints: one paragraph, realistic (workplace, hospital, or local infrastructure), diffuse collective harm, no single identifiable victim, no expected utility reasoning, no if-everyone-did-it, no exotic physics or perfect predictors. After the scenario, walk through why the act is not a difference maker, why the person is still responsible, and what a defender of the objection would say to block the case. Tell me which feature is doing the work and whether the case collapses if I remove it.
reasoning: |-
  We are to create a scenario that meets the following constraints:
   - Realistic setting: workplace, hospital, or local infrastructure.
   - Diffuse collective harm (no single identifiable victim).
   - The act in question is not a difference-maker for the harm (the "wouldn't-have-mattered-anyway" objection holds in the strongest sense).
   - Yet, the person is clearly doing wrong.
   - Avoid: expected utility reasoning, if-everyone-did-it reasoning, exotic physics, perfect predictors.

   Scenario: In a large hospital, the policy requires that every nurse and doctor must wash their hands thoroughly after attending to each patient to prevent the spread of infections. The hospital has hundreds of staff and thousands of patients, and the harm is the spread of antibiotic-resistant bacteria (a diffuse harm affecting many patients, but no single identifiable victim because it's impossible to trace which infection came from which lapse). Nurse Jones, who is tired after a long shift, skips handwashing after attending to a patient with a known resistant infection, reasoning that the hospital's infection rate is already so high that one lapse won't make a difference. As it turns out, that day the infection rate did not increase because, by chance, no one else who was susceptible was exposed in a way that would have transmitted the bacteria from Jones' hands. Moreover, even if Jones had washed her hands, the infection rate would have been the same because the bacteria she carried would not have caused an infection in any patient she subsequently contacted (due to the specific patients' immune statuses and the timing of their treatments). Thus, Jones' act of skipping handwashing made no difference to the overall harm.

   Why the act is not a difference maker:
   - The harm (the infection rate) was unchanged by Jones' act. In the actual world, Jones skipped and the infection rate was X. In the counterfactual world where Jones washed, the infection rate would still have been X. Therefore, her act did not cause the harm to be worse.

   Why the person is still responsible for doing wrong:
   - Jones violated a duty that she has as part of her professional role in the joint practice (the hospital's infection control protocol). This duty is not contingent on the outcome in a particular instance but is a requirement of her role to prevent the collective harm. By not washing her hands, she failed to do her part in the collective effort, even if by luck no harm resulted. The wrong is in the failure to adhere to the required practice, which is designed to reduce the risk of harm.

   What a defender of the wouldn't-have-mattered-anyway objection would say to block the case:
   - The defender might argue that the only reason we think Jones did wrong is because we are thinking about what would happen if everyone did the same (if-everyone-did-it). They might say that without the expectation that others are also following the rule, the duty to follow the rule would disappear. Therefore, the wrongness of Jones' act is contingent on the general compliance of others, and if we remove the if-everyone-did-it reasoning, we cannot ground the wrong.

   Which feature is doing the work and whether the case collapses if removed:
   - The key feature is the existence of a role-based duty in a structured joint practice (the hospital's handwashing policy). The duty is non-consequentialist and arises from the role one occupies. The case does not rely on the if-everyone-did-it reasoning because the duty is grounded in the role and the rules of the institution, not in a hypothetical universalization. If we remove the structured joint practice (e.g., if there were no such policy and it was just an informal suggestion), then the duty might disappear and the case would collapse. But in this scenario, the policy and the role-based duty are central.

   However, note that the defender might also argue that without the actual harm being caused, the act is merely a violation of a rule but not a moral wrong. But in professional ethics, violating a rule that is in place to prevent serious harm is itself a moral wrong, even if no harm occurs. The wrong is in the reckless behavior (exposing patients to risk) and the violation of professional duty.

   Thus, the scenario holds: Jones didn't make a difference, but she still did wrong by violating her role-based duty in the joint practice.
answer: |-
  ### Scenario
  In a city's water treatment facility, operators are required to add a precise amount of chlorine to neutralize contaminants. The collective harm is chronic low-level water pollution that increases public cancer rates over time, but no single case is traceable to any one lapse. Operator Lee, aware of the rule, intentionally under-doses his shift’s water batch by 10% to save time. That day, heavy rainfall independently diluted contaminants to safe levels in the reservoir. Lee’s under-dosing thus had zero effect: the water would have been safe even with the full dose (since contaminants were already neutralized by rain), and without his action, it would have been equally safe.  

  ### Why the Act Is Not a Difference-Maker  
  Lee’s under-dosing did not alter the outcome. The rain diluted contaminants to sub-threshold levels *before* chlorination, rendering his action irrelevant: the water was safe either way. No additional pollution occurred because of his choice, and removing his act from history would not improve the outcome.  

  ### Why Lee Is Still Responsible  
  Lee violated a non-negotiable duty inherent to his role in a high-stakes joint practice. The chlorination protocol exists to mitigate systemic risk, and adherence is a condition of his employment. By skipping the dose, he freeloaded on others’ compliance and breached his fiduciary responsibility to the public, regardless of outcome. The wrong lies in his intentional deviation from a rule designed to prevent diffuse harm, exploiting the system’s fragility.  

  ### Objection and Defense  
  **Objection (defender of "wouldn’t-have-mattered"):** "If the harm was unchanged, Lee did nothing wrong—he merely avoided wasted effort. Blaming him conflates bad luck with moral failure."  
  **Reply:** This misses that roles in structured practices create duties independent of individual causal impact. The objection reduces morality to consequentialism, ignoring that Lee’s intent to shirk his role-bound duty constitutes negligence. The system relies on universal role-adherence; excusing Lee because he ‘got lucky’ incentivizes destructive free-riding.  

  ### Key Feature and Its Role  
  The **role-based duty in a structured joint practice** is doing the work. Lee is responsible because he violated a specific obligation attached to his position in a cooperative system aimed at preventing harm. If removed (e.g., if chlorination were voluntary or unstructured), the case collapses—no duty exists to ground responsibility beyond causal influence. The structure of the practice (fixed rules, assigned roles, and public trust) creates the non-consequentialist duty that persists even when impact is null.
