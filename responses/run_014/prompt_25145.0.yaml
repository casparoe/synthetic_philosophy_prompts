  We are ranking the responses to the leveling-down objection by how much they force you to revise other parts of your view (i.e., how revisionary they are). The leveling-down objection is that egalitarianism sometimes recommends making some worse off without making anyone better off (leveling down) just to reduce inequality, which seems absurd.

   The responses to consider:
   1. Prioritarianism: We care about improving the situation of the worse off, but we do so by giving priority to the worse off. It avoids leveling down because leveling down doesn't help the worse off (it makes them worse off too). 
   2. Sufficientarianism: We care about people having enough. Inequality below the threshold might not matter, and above the threshold, we might prioritize those below. Leveling down doesn't help anyone reach sufficiency.
   3. Pluralist egalitarianism: Equality is one value among others (like total welfare) and can be outweighed. So leveling down might have a pro tanto good (equality) but overall bad because it reduces total welfare.
   4. Telic egalitarianism that bites the bullet: Accepts that leveling down is in one respect good (because it reduces inequality) but that in all things considered it may be bad. So they admit the intrinsic value of equality even in leveling down.
   5. Deontic egalitarianism: The objection only applies to telic (outcome-oriented) views. Deontic views focus on the wrongness of creating inequality, not on the badness of unequal states. So leveling down might not be required because it doesn't involve a wrongful act (or it might be wrong for other reasons).
   6. Person-affecting response: Leveling down doesn't benefit anyone, so it isn't better. This response typically argues that a change is only an improvement if it benefits someone. So leveling down, which doesn't benefit anyone, isn't an improvement.

   We are to rank from least revisionary (rank 1) to most revisionary (rank 6). We also note which rankings are contested and why.

   Let's analyze each:

   1. Prioritarianism:
      - What you give up: The intrinsic badness of inequality. Prioritarianism does not care about inequality per se, but about the absolute position of the worse off weighted by priority.
      - Independent motivation: The idea of giving priority to the worse off is independently motivated by diminishing marginal utility or compassion. But note that prioritarianism is often presented as an alternative to egalitarianism.
      - Revisionary rating: 2 (It abandons egalitarianism as such, but it's a well-known alternative that doesn't require overhauling everything. However, note that it does change the foundational commitment from equality to priority.)

   2. Sufficientarianism:
      - What you give up: The idea that inequality is bad at every level. Sufficientarianism only cares about people below the threshold. Above the threshold, inequality might not matter.
      - Independent motivation: The idea of sufficiency is independently motivated by the thought that what matters is meeting basic needs or having a decent life.
      - Revisionary rating: 3 (It changes the focus from equality to sufficiency, which is a significant shift but not a complete overhaul. It might still be combined with other views.)

   3. Pluralist egalitarianism:
      - What you give up: The idea that equality is the only value or that it always trumps. You have to accept that sometimes equality is outweighed by other values (like total welfare). Also, you might have to give up the idea that equality is intrinsically valuable in every context (because it can be outweighed).
      - Independent motivation: Pluralism is common in ethics (e.g., Ross's prima facie duties). It is independently plausible that we care about multiple values.
      - Revisionary rating: 1 (It seems the least revisionary because it preserves the intrinsic value of equality but tempers it with other considerations. It doesn't force you to abandon the core of egalitarianism.)

   4. Telic egalitarianism that bites the bullet:
      - What you give up: The intuition that leveling down is in no way good. You have to accept that leveling down is in one respect good (because it reduces inequality) even though it is overall bad. This might be counterintuitive.
      - Independent motivation: The intrinsic value of equality is preserved. The bullet-biting is motivated by the desire to preserve the core of telic egalitarianism.
      - Revisionary rating: 4 (It forces you to accept a highly counterintuitive claim, which might require revising how you think about the relationship between pro tanto goodness and all-things-considered judgments. It also might make egalitarianism less attractive.)

   5. Deontic egalitarianism:
      - What you give up: The idea that we should care about the badness of unequal states of affairs as such (telic). Instead, we focus on the wrongness of acts that create or exacerbate inequality. Also, deontic views might not give guidance for non-agential contexts (like natural inequality).
      - Independent motivation: The distinction between telic and deontic is common in ethics (e.g., consequentialism vs. deontology). It is independently motivated by the thought that we are responsible for what we do, not for what we don't cause.
