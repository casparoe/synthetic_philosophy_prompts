  For names, "Silas" for the assayer sounds appropriately weathered, and "Aris" for the client feels slightly enigmatic. The diagnostic glasses serve as the perfect proxy for the "disposition to discern dispositions" - their flickering will visually represent the epistemological uncertainty.

