answer: |-
  The bell above Silas Thorne's door chimed, a sound usually crisp and businesslike. Today, it felt brittle. Aris Vale stood framed in the doorway, rain glistening on a dark wool coat. His face was calm, almost placid, but Silas felt the familiar prickle – the pre-test hum of a disposition under scrutiny. It was Silas’s job to feel that hum, to assay its nature.

  "Mr. Vale," Silas greeted, gesturing to the worn leather chair opposite his cluttered oak desk. Tools gleamed under glass domes: calibrated hammers, empathy resonators, the intricate Dispositional Spectrograph. "Your broker mentioned ‘Integrity in Adversity’. For the partnership review?"

  "Precisely," Aris murmured, sitting. "They require certification. Intact, of course." His eyes, a startlingly clear grey, held Silas’s. There was no flicker of deceit, only... depth.

  Silas donned his diagnostic spectacles, intricate brass and quartz lenses humming faintly. He activated the Spectrograph. "Standard procedure, Mr. Vale. We induce simulated adversity – minor ethical quandaries, pressure scenarios – and observe the dispositional response." He initiated Program Epsilon-7.

  Aris’s image flickered on the screen: offered a shady shortcut to profit. Silas watched the spectrograph display. The ‘Integrity in Adversity’ disposition – usually a robust, steady amber light – *vanished* the instant the simulation pressure peaked. Not suppressed, not dimmed. *Gone*. Like a flame snuffed out.

  **Result: Finked.** The screen declared. The disposition wasn’t blocked; it ceased to exist under the triggering conditions.

  Aris frowned slightly. "A glitch? My integrity is core to who I am."

  "Occasionally happens," Silas said, masking his unease. Finks were rare, dangerous dispositions – promises inherently broken when called upon. Like brittle glass guaranteed not to shatter… until touched. He recalibrated, ran Program Theta-9, a subtler test.

  This time, the amber light of Integrity *was* there, pulsing steadily beneath the simulated pressure. But it was shrouded, muffled, like light seen through thick fog. It couldn’t manifest its characteristic actions – the refusal, the ethical stand. It was present, but utterly inert.

  **Result: Masked.** The screen updated. Something external was blocking its expression. Like a perfectly functional engine with no fuel.

  Silas’s palms were damp. Finked *and* masked? On consecutive tests? Dispositions were usually stable in their state. He tried Gamma-4, then Zeta-1. Each time, the result flipped: **Finked... Masked... Finked... Masked.** Like watching a coin spin impossibly on its edge. Aris remained unnervingly calm, observing Silas more than the screens.

  "It seems… inconsistent," Aris offered, his voice smooth as oiled stone.

  *Inconsistent*. The word echoed. Silas wiped his spectacles, the brass warm against his skin. He relied utterly on these lenses, on his innate, honed *disposition to discern dispositions*. It was his bedrock, the core tool making him Silas Thorne, Certified Disposition Assayer, Grade 1.

  A cold dread began to seep through him, sharp as the rain lashing the window. He looked at Aris, then at the screen flashing its contradictory verdicts. He looked at his own spectacles, reflected in the dark monitor glass.

  What if it wasn't Aris's disposition under scrutiny at all? What if the very act of assaying *this specific disposition* – Integrity in Adversity, perhaps the most complex and self-referential one could test – was triggering something... else?

  His own diagnostic disposition – was *it* finked? Destroyed the instant he tried to use it on a case that challenged its core function? Snuffed out like Vale’s integrity under pressure?

  Or was it masked? Still present, still *true*, but blocked, muffled by the sheer paradoxical nature of assaying a disposition that might reflect back on the assayer’s own defining trait? Was Aris Vale merely the catalyst, the adversity that revealed Silas's own hidden flaw?

  The spectacles felt suddenly heavy, unreliable. The familiar hum might be a lie. The amber light he *thought* he saw in others – was it ever really there? Or just a reflection of his own desperate need for it to be?

  He lowered the lenses. Aris Vale watched him, those clear grey eyes holding a question Silas realized, with a plummeting heart, he could no longer reliably answer. The certification form lay blank before him. His hand hovered over the pen, trembling. To write "Finked" or "Masked" was to pass judgment, not just on Aris Vale, but on the very foundation of Silas Thorne. And in that moment of profound, self-referential adversity, Silas couldn't manifest the certainty his entire career, his very identity, depended upon. The disposition to discern dispositions had gone utterly, terrifyingly silent.
