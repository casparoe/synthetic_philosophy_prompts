answer: |-
  That's an incredibly sharp observation – you've hit on a core, deeply political phenomenon with profound implications. While there isn't *one* universally agreed-upon term, your description taps into several well-established concepts and bodies of literature. Let's break it down:

  **Core Concepts & Literature:**

  1.  **The Monopoly of Legitimate Violence (Max Weber):** This is the bedrock. Weber famously defined the state as "a human community that (successfully) claims the *monopoly of the legitimate use of physical force* within a given territory." Your entire observation revolves around the contested nature of **legitimacy** within that monopoly.
  2.  **State Formation & State Capacity (Charles Tilly, Michael Mann, Joel Migdal):** Historians and sociologists studying how states *actually* emerged emphasize that this monopoly wasn't magically granted; it was violently contested and painstakingly built by suppressing or co-opting rivals (feudal lords, bandits, militias, private armies). Your examples (militias, lynch mobs, security firms) are precisely the kinds of actors states historically had to either destroy, absorb, or regulate to establish their monopoly. The "boundary" wasn't fixed; it was the *result* of conflict.
  3.  **The "State Idea" vs. the "State System" (Philip Abrams):** Abrams argued we conflate two things: the actual, messy, often contradictory institutions and practices of governing ("the state system") and the unified, legitimate, authoritative symbol we call "the State" ("the state-idea"). The "state-idea" is a powerful fiction necessary for order. Your condo fight is fundamentally about whether hiring armed patrols reinforces or undermines the *symbolic authority* ("state-idea") of the public state. Does it make the *idea* of the public police seem weaker?
  4.  **Boundary Work (Thomas Gieryn):** In science studies, Gieryn explored how scientists demarcate "science" from "non-science" to claim authority. This concept applies perfectly to the state. Groups constantly engage in **symbolic boundary work** around the "state/non-state" line to claim legitimacy for favored actors and deny it to others. The classification *is* the political act.
  5.  **Privatization, Neoliberalism, and the "Hollowing Out" of the State:** Scholars like Deborah Avant (on security privatization) or Allison Stanger (on outsourcing) analyze how shifting functions traditionally associated with the state (security, prisons, welfare) to private actors inherently blurs the state/non-state boundary and triggers legitimacy crises. Your condo security debate is a microcosm of this global trend.
  6.  **Vigilantism and "Informal" Justice:** Studies of vigilantism (e.g., Ray Abrahams, Janice Perlman) directly confront the ambiguity of groups claiming to enforce order when the "official" state is perceived as absent or illegitimate. Is it "private violence" or "community policing"?

  **What This Phenomenon IS (and ISN'T):**

  *   **IS:**
      *   **A Contest Over Legitimacy:** The core fight is about who has the *right* to wield coercive power, not just the power itself.
      *   **A Dispute About Sovereignty:** Who ultimately holds authority in this space? The public state? The condo association? The militia? The mob?
      *   **Symbolic Politics:** It's about what an action *represents* for the perceived legitimacy and authority of the public state ("state-idea").
      *   **Boundary Constitutive:** The argument *actively creates and defines* the boundary of the state in that specific context. The boundary isn't pre-set; it's the *stake* of the fight.
      *   **Inherently Political:** Classifying an actor as "state" or "non-state" is never neutral; it's an act of power with material consequences (e.g., is the patrol immune from lawsuit? Can it arrest?).
  *   **ISN'T:**
      *   **Merely Semantic:** It's not *just* arguing about dictionary definitions. The stakes are real power, legitimacy, and the perceived effectiveness of the public order.
      *   **Simple Hypocrisy/Word-Stretching:** While people *do* stretch definitions strategically, the underlying tension you identified – the symbolic weight of classifying violence as "state" or "private" – is a genuine structural feature of modern politics rooted in the Weberian ideal. The participants often *feel* the deep significance of the classification.
      *   **Just About Drawing a Fuzzy Line:** It's not merely acknowledging a gray area. It's recognizing that the *act* of drawing the line in a specific place *in a specific context* is a powerful political assertion that confers or denies legitimacy. The "gray area" *is* the contested political terrain.

  **The Proposed Name: Legitimacy Boundary Contestation**

  This term captures the core elements:
  *   **Legitimacy:** The central prize being fought over (Weber).
  *   **Boundary:** The line between state/non-state where the contest occurs.
  *   **Contestation:** Emphasizes the active, political struggle inherent in drawing that line.

  **Walking Through Boundary Cases with Your Term:**

  1.  **Your Condo Security:**
      *   **Contestation:** Is the association, by hiring armed guards, acting *like* a state (private sovereignty) or *alongside* the state (supplementing public order)? Does delegating security *delegitimize* the public police ("admitting the system doesn't work") or *support* the existing system by filling a gap ("supporting the system")?
      *   **Classification:** A clear case of **Legitimacy Boundary Contestation**. The physical guards are the same; the fight is entirely over what their presence *symbolizes* about the authority and competence of the public state vs. the private association. The association is forced to navigate this contested boundary.

  2.  **Campus Police:**
      *   **Contestation:** Do they derive authority *from* the state (sworn officers, state certification) or solely from the *private* university? Are they enforcing "state law" or "campus rules"? Does their existence represent the *extension* of state authority onto campus or the university claiming *its own* sovereign-like power?
      *   **Classification:** **Legitimacy Boundary Contestation.** The dispute centers on whether their actions fall under the umbrella of "state legitimacy" or constitute a separate, potentially rivalrous authority.

  3.  **Private Militia at a Protest:**
      *   **Contestation:** Is this armed group acting as an extension of a community's right to self-defense (private/personal), or are they performing a function reserved for the state (public order/policing), thereby challenging its monopoly? Does their presence signal state failure or an attempt to usurp state function?
      *   **Classification:** **Intense Legitimacy Boundary Contestation.** This is often a direct, explicit challenge to the state's claim to the monopoly of legitimate force within that space. The state's response (tolerance, suppression, negotiation) is *itself* part of the boundary contestation.

  4.  **"Unmarked Van" Contractors / Deniable Operations:**
      *   **Contestation:** Can the state plausibly claim this violence is *not* its own? Does outsourcing create a "legitimacy shield"? Is this an illegitimate *extension* of state power (hidden, unaccountable) or truly *private* action the state should punish? The state actively tries to *push* the action over the boundary into "non-state" to avoid accountability.
      *   **Classification:** **Covert Legitimacy Boundary Contestation.** The state actively manipulates the boundary to maintain the *symbol* of its legitimacy while engaging in actions that might undermine it if clearly classified as "state."

  5.  **Historical Lynch Mobs:**
      *   **Contestation:** Was this "private" criminal violence, or was it the "community" (acting as a *de facto* local sovereign) enforcing an order tacitly endorsed or deliberately ignored by the official state (law enforcement, courts)? Did the official state's *inaction* effectively *reclassify* the violence as legitimate within that community's boundary?
      *   **Classification:** **Legitimacy Boundary Contestation via State Collusion/Absence.** The lack of state intervention effectively *redrew* the boundary, granting legitimacy (or at least impunity) to the mob's violence within that specific context, blurring the line between "private" and "state-sanctioned."

  **Why Your Observation Matters:**

  You've identified that **the location of the "state/non-state" boundary is not a pre-political fact, but the very object of political struggle.** Where that boundary gets drawn determines who wields legitimate force, who is held accountable, and ultimately, whose authority prevails in a given space. Your condo argument wasn't just about security; it was a microcosm of the ongoing negotiation over who gets to define and control the legitimate use of force in your community – the essence of politics itself. Keep noticing this pattern; it reveals the deep structures of power and legitimacy shaping conflicts everywhere.
