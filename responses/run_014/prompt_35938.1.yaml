            - We can give points for distinct strings, and also for using each rule at least once? 
            - And we can have a prize for the group that has the string with the fewest I's? (but not zero) so maybe 1 or 2.

          How about after 25 minutes, we look at the groups' progress and then move to the hint phase.

   3. Hint phase and guided discussion (10 minutes)

     - After 25 minutes, stop the groups and ask: 
          "Has any group gotten to MU? ... I see no one has. Why do you think that is? Maybe it's impossible?"

     - Then give a hint: "Let me ask you, what do you notice about the number of I's in your strings? Can you count the number of I's in the string you started with? (MI had 1 I). What about the strings you generated? What are the numbers of I's you've seen?"

     - Write on the board: 
          MI: 1 I.

          Ask groups to report: 
            What are the numbers of I's they've seen? They might say: 1, 2, 4, 8, 5, 2, ... 

     - Then ask: "Is there a pattern? What do these numbers have in common? Let's compute each number mod3 (i.e., the remainder when divided by 3)."

          MI: 1 mod3 = 1.
          MII: 2 mod3=2.
          MIIII: 4 mod3=1.
          MIU: 1 mod3=1.
          MIUIU: 2 mod3=2? because there are two I's? 
          MIIU: 2 mod3=2? 
          MIIUIIU: 4 I's? -> 4 mod3=1.

     - Point out: "Notice that we never get a string with 0 I's? And also, we never get a string where the number of I's is divisible by 3? Why?"

     - Then explain the invariant: 

          "Let me show you what happens to the number of I's when we apply a rule:

            Rule1: ...I becomes ...IU -> the number of I's doesn't change.
            Rule2: Mx becomes Mxx -> if the part after M had k I's, then the new part after M has 2k I's. So the total I's becomes 2k. How does k mod3 relate to 2k mod3?
            Rule3: ...III... becomes ...U... -> we remove 3 I's and add 0 I's -> so the number of I's decreases by 3.
            Rule4: ...UU... becomes ...... (delete the two U's) -> no change to I's.

          Now, what happens to the residue mod3?

            Rule1: same residue.
            Rule3: removing 3 I's? That doesn't change the residue mod3? (because 3 mod3=0).
            Rule4: same residue.
            Rule2: if the residue of k was r, then the new residue is 2r mod3.

          Starting with residue1:

            Rule2: 2*1 mod3 = 2.
            Rule2 again: 2*2 mod3 = 4 mod3=1.
            Rule2 again: 2*1=2 mod3.

          So we only ever get residues 1 or 2.

          And MU has 0 I's -> residue0. So we can never get MU.

          Therefore, it's impossible."

     - This is the key moment: they were working inside the system, and now we've stepped outside to reason about the system.

   4. Debrief (10 minutes)

     - Discuss the experience: 
          "What were you doing when you were trying to solve the puzzle?" (applying rules, exploring branches, sometimes getting stuck in loops)
          "How did it feel when you couldn't find a way to MU?"
          "What did we do differently when we looked at the number of I's mod3?"

     - Introduce the concept of an invariant: a property that doesn't change under the rules (or changes in a controlled way). In this case, the residue mod3 of the number of I's is an invariant that starts at 1 and never becomes 0.

     - Connect to problem-solving in general: 
          "Sometimes in mathematics, we try to solve a problem by working within the rules (like you did for 25 minutes). But if we get stuck, it might be because the problem is impossible. And to prove it's impossible, we have to step outside and look for a property that is preserved by the rules but that is different in the starting point and the goal."

     - Mention that this is a powerful idea in computer science (for proving programs terminate or don't) and in mathematics (e.g., in group theory, topology).

     - Also, note that this puzzle comes from a book that explores the limits of formal systems and self-reference (Gödel, Escher, Bach).

     - Finally, ask: "What would you do differently next time you face a problem that seems impossible?"

          (Possible answers: look for an invariant, try to prove it's impossible, step back and look for a different perspective.)

   5. What can go wrong?

     - A student might google the puzzle and find out it's impossible. That would ruin the exploration. To mitigate: 
          - Tell them at the start: "Please don't look this up online. The fun is in the struggle and the discovery."
          - Walk around to monitor.

     - Some groups might get frustrated if they can't find a solution. Encourage them to aim for the highest score (most distinct strings) or the longest string.

     - The mod3 arithmetic might be too abstract? We can do it with counters: 
            Use three types of counters: M (only one), I's (many), U's (many).
            But the invariant is about counting I's mod3. We can show: 
               Start: 1 I -> put 1 counter in a circle labeled "mod3".
               Rule2: if we double the I's, then we double the counters. Then we group them in threes and see what's left: 
                   1 I -> double to 2 I's -> 2 mod3: two counters left over.
                   2 I's -> double to 4 I's -> 4 mod3: 4-3=1 left over.

     - Time might run out: be strict with the timing.

     - Some groups might dominate the discussion. Encourage everyone to participate.

   6. Session adjustments for 50 minutes:

     - We allocated 25 minutes for group work. If they are getting bored or frustrated earlier, move to the hint phase earlier.

     - If they are still engaged, let them work a bit longer.

     - The debrief is crucial to make the point, so don't skip it.

     - What the session can't do: 
          - It can't fully replicate the experience of a mathematician who spends weeks on a problem and then has the insight to look for an invariant. We are compressing that into 10 minutes of guided discovery.
          - Not every student will grasp the mod3 arithmetic immediately. That's okay. The main takeaway is that sometimes you need to step back.

     - Preparation: 
          - Practice the rules yourself so you can help groups.
          - Prepare a cheat-sheet of the rules to put on the board or hand out.

   Handout example:

     Rules for the MIU puzzle:

       1. If you have a string ending with I, you can add a U at the end.
          Example: MI -> MIU

       2. If you have a string starting with M, you can double the part after the M.
          Example: MIU -> M + IU + IU = MIUIU

       3. If you have three consecutive I's (III) anywhere in the string, you can replace them with a U.
          Example: MIIIU -> MUU   (because we replace III with U)

       4. If you have two consecutive U's (UU) anywhere in the string, you can delete them.
          Example: MUU -> M

     Goal: Starting from "MI", get to "MU".

     But note: the example for Rule2 in the problem statement was incorrect. We use the corrected version.

   7. Scoring system:

     - We will give 1 point for every new distinct string a group generates (up to a maximum of, say, 20 points to avoid counting forever).
     - Bonus points:
          +5 points if they get to MU (which they won't, so we can offer it as a challenge).
          +3 points for the group that generates the string with the smallest number of I's (but not zero) - but note we might have multiple groups with 1 I? Then they all get 3 points? Or we can do: 
              smallest number of I's among all groups: if a group has a string with 1 I, that's the best (since we can't get 0). 
          +3 points for the group that generates the longest string (by character count) at any point.

     - Alternatively, we can have a "first to 10 distinct strings" prize? But that might encourage rushing.

     - We can also give 1 point for every rule they use at least once? (to encourage using all rules).

     - Or we can just focus on participation and exploration.

     Given the time, we might not have time to tally a complex scoring. So maybe just tell them:

          "Each new string you find gets you a point. The group with the most points wins. Also, if you get to MU, you win instantly. And there's a prize for the most creative path."

     And then at the end, we can count the number of distinct strings per group and declare a winner.

   8. Conclusion:

     - This should be a fun and thought-provoking session.

     - Good luck!

   Let's write the session plan with timing:

     0:00-0:05 (5 min): Introduction and rules explanation.
     0:05-0:30 (25 min): Group work. Teacher circulates, helps, and gives points (on a clipboard for each group: count distinct strings, and note if they used each rule at least once).
     0:30-0:40 (10 min): Reconvene and hint: ask about the number of I's and mod3. Then explain the invariant.
     0:40-0:50 (10 min): Debrief and wrap-up.

     Note: Adjust as needed.
answer: |-
  ### Session Plan: MU Puzzle from *Gödel, Escher, Bach*

  **Objective:**  
  Students will explore the MU puzzle, discover it's unsolvable through brute force, and learn to step outside the system to find an invariant (number of I's modulo 3) that proves impossibility. They’ll experience the shift from *working within* rules to *reasoning about* rules.

  **Materials:**  
  - Whiteboard  
  - Mini-whiteboards (1 per group)  
  - Counters (to represent I’s; optional)  
  - Prize tokens (e.g., math-themed stickers, extra credit points)  

  **Group Structure:**  
  - Divide 14 students into **5 teams of 2–3**. Small teams reduce intimidation, encourage collaboration, and make it harder for one student to dominate. Assign roles: Recorder (writes moves), Strategist (suggests rules), and Checker (verifies rules).  

  **Timing & Phases:**  
  *(Total: 50 minutes)*  

  ---

  #### **Phase 1: Introduction (5 min)**  
  - **Hook (1 min):**  
    *"I’ve got a puzzle that’s stumped people for years. Start with MI, use 4 rules to turn it into MU. If you solve it, you’ll be legendary!"*  
  - **Rules (3 min):**  
    Write rules + examples on the whiteboard:  
    1. **Add U:** If it ends with I, add U.  
       *Example: MI → MIU*  
    2. **Double:** If it starts with M, double everything after M.  
       *Example: MIU → M + IU + IU = MIUIU*  
    3. **III → U:** Replace any "III" with "U".  
       *Example: MIIIU → MUU*  
    4. **Delete UU:** Remove any "UU".  
       *Example: MUU → M*  
  - **Goal & Scoring (1 min):**  
    - **Goal:** Transform MI to MU.  
    - **Scoring:**  
      - 1 point per **new valid string** (no repeats!).  
      - **Bounties:**  
        - +3 points for **shortest string** (e.g., "M" = 1 character).  
        - +3 points for **longest string** (e.g., "MIIUIUIU..." = most characters).  
        - **Grand Prize:** +5 points for **MU** (secretly impossible).  
    *"I’ll tally points every 10 minutes. Winning team gets prizes!"*  

  ---

  #### **Phase 2: Group Work & Exploration (25 min)**  
  - **Activity:**  
    Teams use mini-whiteboards to track moves and strings. Encourage them to:  
    - Try different rules.  
    - Aim for bounties (e.g., use Rule 2 to grow strings for "longest," Rule 4 to shrink).  
    - Write down each new string to earn points.  
  - **Teacher Role:**  
    - **Circulate:** Ask probing questions:  
      *"What happens if you use Rule 2 twice?"*  
      *"Can you get rid of all I’s?"*  
    - **Tally Points:** Every 10 min, announce scores. Praise creativity: *"Team 3 found 8 strings—new lead!"*  
  - **Predicted Student Strategies:**  
    - Common dead ends:  
      - Loops (e.g., MI → MII → MIIU → MIIUIIU → ...).  
      - "Almost MU" strings (e.g., MIU, MUU, but never MU).  
    - Rule 2 often creates long strings; Rule 3/4 reduces them.  
  - **Handling Google Cheaters:**  
    If spotted, say: *"Ah, you found it’s impossible? Prove why to the class later for bonus points!"* (Turns sabotage into a teachable moment.)  

  ---

  #### **Phase 3: Hints & Guided Discovery (10 min)**  
  - **When to Intervene:**  
    At 20 min, if no progress, pause groups: *"Time for a hint! Let’s look for patterns."*  
  - **Hint Sequence (Write on Whiteboard):**  
    1. **Count I’s in your strings:**  
       *"What’s the I-count in MI? (1) MII? (2) MIU? (1) MIIUIIU? (4)"*  
    2. **List I-counts:**  
       Teams share: 1, 2, 4, 1, 5, 2, 8, 1...  
    3. **Ask:** *"What do these numbers have in common? Think remainders when divided by 3."*  
       - Calculate together: 1 mod 3 = 1, 2 mod 3 = 2, 4 mod 3 = 1, 5 mod 3 = 2...  
    4. **Reveal:** *"Notice: We only get 1 or 2, never 0. Why?"*  

  ---

  #### **Phase 4: Proof & Debrief (10 min)**  
  - **The Invariant (5 min):**  
    Use the whiteboard to show why I-count mod 3 is **never 0**:  
    - **MI:** Starts with 1 I → **1 mod 3 = 1**.  
    - **Rule 1 (Add U):** I-count unchanged → mod 3 same.  
    - **Rule 2 (Double):** If string after M has *k* I’s, new I’s = *2k*.  
      *If k mod 3 = 1 → 2k mod 3 = 2*  
      *If k mod 3 = 2 → 2k mod 3 = 4 mod 3 = 1*  
      *(Never 0!)*  
    - **Rule 3 (III → U):** Remove 3 I’s → subtract 0 mod 3 (no change).  
    - **Rule 4 (Delete UU):** I-count unchanged.  
    **Conclusion:** MU requires 0 I’s (0 mod 3). Impossible!  
  - **Meta-Lesson (5 min):**  
    - *"What were you doing before?* (Applying rules → working **in the system**.)  
    - *"What did we do to solve it?* (Stepped back, counted I’s → reasoning **about the system**.)  
    - **Real-World Analogy:**  
      *"Like trying to solve a maze by walking forever vs. looking at the map. Sometimes you need the map!"*  
    - **Takeaway:**  
      *"When stuck, ask: Is there a hidden property (like I-count mod 3) that blocks the solution?"*  

  ---

  #### **What Works in 50 Minutes:**  
  - Students experience:  
    - Frustration of brute-force search → "Aha!" of stepping back.  
    - Basic invariants (modulo math in disguise).  
  - **Limitations:**  
    - Won’t replicate years of research! They’ll grasp the concept but not formal proof techniques.  
    - Some may miss the mod 3 insight; focus on the meta-lesson ("search vs. step back").  

  #### **Predictable Challenges & Fixes:**  
  - **Chaos/Frustration:**  
    - Use scoring to channel energy. Praise effort: *"Team 2’s 12 strings? Impressive exploration!"*  
  - **One Dominant Team:**  
    - Give bounties for different achievements (shortest/longest string) to spread wins.  
  - **Quick Solvers:**  
    - Challenge them: *"Okay, prove it’s impossible without the invariant!"*  
  - **Rule Misapplication:**  
    - Walk groups through examples; use counters for III → U (e.g., 3 counters → swap for 1 U).  

  **Final Tip:**  
  End with: *"If you loved this, read *Gödel, Escher, Bach*—it’s full of puzzles like this!"* Prize the winners with stickers or math trinkets.  

  Good luck! The kids may "eat you alive" if you lecture, but with this plan, they’ll be too busy hunting for I’s. 😊
