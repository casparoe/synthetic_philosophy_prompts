  The puzzle, in case it's useful to have it stated plainly: you start with the string MI, made of letters M, I, and U, and you can transform strings using four rules. (1) If a string ends in I, you can stick a U on the end. (2) If a string starts with M, you can double everything after the M — so MIU becomes MIUIUIU, for instance. (3) Any three consecutive I's anywhere in a string can be swapped for a single U. (4) Any two consecutive U's can be deleted. The task I'll set them: get from MI to MU. The thing I'm deliberately not telling them is that it can't be done — the real point of the session is the difference between grinding away inside the rules forever and stepping outside them to prove no sequence of moves gets you there. I gather the proof hinges on how the number of I's in the string behaves (something about divisibility by three, since I've honestly never worked through it myself), so I'd need you to spell that argument out for me too, in terms I could reproduce at a whiteboard.

  What I want from you, then, is the full session plan: how to hand the puzzle out, whether individuals or small teams work better, some kind of scoring or payoff scheme that makes the "search harder" phase feel genuinely competitive without anyone ending up in tears, how long to let them flounder before drip-feeding hints and what those hints should be, and then a debrief that maps what they were doing onto the distinction — working in the system versus reasoning about it — and shows them why jumping out of the system was the only way the question ever got answered. I'd love them to leave with a feel for when it's worth stopping the search and changing level, but I also want you to be honest about what a 50-minute puzzle can't reproduce about that lesson, and to tell me what will predictably go wrong the first time I run it — my main fear is that someone googles it under the desk, but I suspect that's not even the worst thing that'll happen. Also, please assume I have access to nothing fancier than a whiteboard, mini-whiteboards, and the maths cupboard's mysterious surplus of counters. Thanks alot in advance!
