answer: |-
  ## Joint Statement: Political Economy Society Consensus Framework

  **Authors:** The Signatory Members of the Political Economy Society  
  **Date:** Spring Meeting, [Year]  
  **Subject:** Framework for Understanding Disagreements on Interpersonal Comparisons and Collective Decision-Making

  ### Preamble: The Nature of Our Disagreement (Brainstorming)
  Our discussions revealed clusters of disagreement. Sorting them clarifies the path forward:

  1.  **Genuine Substantive Disagreements:**
      *   **Metaphysical Status:** Does a statement comparing *levels* of well-being ("Alice is happier than Bob") possess truth conditions at all, or is it inherently meaningless?
      *   **Epistemological Access:** *Even if* such statements have truth conditions, can we ever gather evidence sufficient to verify or falsify them with reasonable confidence? Are current methods (surveys, WTP, QALYs) capable of providing this evidence?
      *   **Validity of Scaling/Conversion:** Do techniques like rescaling survey responses, converting outcomes into WTP, or income-scaling VSL meaningfully overcome individual scale-use differences or merely impose an arbitrary structure?
      *   **Decision Under Uncertainty:** When faced with unavoidable choices impacting individuals differently, what is the epistemically and ethically defensible procedure *if* we lack justified interpersonal comparisons?

  2.  **Terminology-Based Disagreements:**
      *   **"Utility":** Used by Faction 1 solely ordinally (ranking only), often implying a purely mental state. Used by Faction 2 frequently cardinally (implying quantifiable gains/losses) and often operationally defined by chosen metrics (QALYs, WTP).
      *   **"Measurement":** Faction 1 requires strict cardinality with a known unit and often a zero point for "true" measurement. Faction 2 uses it pragmatically to mean systematic, quantified approximation using observable proxies.
      *   **"Interpersonal Comparison":** Often conflates comparing *levels* (Alice vs. Bob's state), *differences* (gain to Alice vs. loss to Bob), and *ratios* (Alice's gain is twice Bob's loss). Requirements differ: differences *might* require only a common unit; levels require a common zero point; ratios require both.

  3.  **Decision-Procedure Disagreements:**
      *   **Procedural Purity vs. Outcome Responsibility:** Faction 1 prioritizes avoiding procedures they deem conceptually invalid (any aggregation relying on interpersonal comparisons). Faction 2 prioritizes reaching a justifiable *decision* with the best available evidence, seeing refusal as abdication.
      *   **Burden of Proof:** Does the burden lie on those proposing an aggregation method to prove its validity for interpersonal comparison, or on those opposing all methods to propose a viable alternative decision procedure for collective action?

  ### Section 1: Agreed Claims (Numbered)
  We jointly affirm the following non-trivial propositions, recognizing that members of each faction may have previously assumed the other denied them:

  1.  **Revealed Preference Shows Ordinality, Not Cardinality:** Observed choices (revealed preference) demonstrate only an individual's *ranking* of alternatives. They do not, by themselves, reveal the *intensity* of preference (how much more A is preferred to B) or provide a cardinal scale with a defined unit. *[Faction 1 agrees Faction 2 acknowledges this; Faction 2 agrees Faction 1 accepts revealed preference data.]*
  2.  **Current Practices Embed Assumptions:** Many common economic and policy evaluation techniques (e.g., pooling responses on a 0-10 satisfaction scale across individuals, aggregating WTP estimates from different people, using a single income-scaled Value of a Statistical Life) necessarily *embed some assumption* about the comparability of units (e.g., satisfaction points, dollars) across individuals. These are not assumption-free. *[Faction 2 agrees these embed assumptions; Faction 1 agrees these practices are widespread and rely on such assumptions.]*
  3.  **Decision Requires Aggregation:** Choosing a single recipient for the club's donation from multiple candidates *requires* aggregating the disparate impacts on different individuals (donors, potential beneficiaries, others affected) into a single decision criterion. There is no neutral "non-aggregation" option when making a collective choice with distributive consequences. *[Faction 1 agrees a choice requires *some* implicit/explicit aggregation rule; Faction 2 agrees refusal to use *their* methods isn't necessarily refusal to decide, but requires an alternative aggregation rule.]*
  4.  **"No Meaning" is Different from "No Evidence":** The claim "Statement X has no truth conditions" (is meaningless) is distinct from the claim "We lack sufficient evidence to know if Statement X is true or false," which is distinct from "Statement X is false." *[Both factions agree these are logically distinct positions.]*
  5.  **Bad Arguments Exist on Both Sides:** It is invalid for Faction 1 to dismiss Faction 2's methods *solely* by asserting "interpersonal comparisons are impossible" without addressing the specific operationalization and assumptions of each method. It is equally invalid for Faction 2 to dismiss Faction 1's concerns *solely* by asserting "but we have to decide something" without engaging the substantive objections to the proposed comparisons. *[Both factions acknowledge the legitimacy of calling out these specific fallacious moves by their own side.]*

  ### Section 2: Disagreements Table

  | Disagreement                                                                 | Faction 1 Statement (Austrian/Praxeology)                                                                                             | Faction 2 Statement (Effective Altruism)                                                                                                                             | Survives Terminology Fix? | Required for Dissolution                                                                                     |
  | :--------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------ | :----------------------------------------------------------------------------------------------------------- |
  | **Meaningfulness of Interpersonal Level Comparisons**                        | Statements comparing the level of well-being or utility between two distinct individuals ("A is happier than B") possess no verifiable truth conditions; they are not empirically meaningful. | Statements comparing the level of well-being between individuals can be meaningful and potentially true or false, even if difficult to assess precisely, reflecting a shared concept of human welfare. | Yes                       | Agreement on the fundamental metaphysical nature of utility/well-being and the possibility of intersubjective concepts. |
  | **Feasibility of Measuring Preference Intensity/Well-Being**                 | The intensity of subjective preferences or well-being states cannot be measured cardinally (with a defined unit) within an individual, let alone across individuals. Revealed choice only shows order. | While perfect cardinal measurement is impossible, systematic methods (calibrated surveys, behavioral proxies like WTP under controlled assumptions) can provide sufficiently reliable cardinal *approximations* of well-being or preference intensity for practical decision-making, both within and across individuals. | Yes (Partly)              | Agreement on whether specific operationalizations (e.g., calibrated surveys) overcome epistemological barriers to cardinal approximation. See Cruxes. |
  | **Validity of Current Aggregation Methods (e.g., QALYs, WTP pooling)**       | Common methods like QALYs or pooling WTP across individuals rely on unjustified and arbitrary interpersonal comparisons (cardinality and common unit assumptions). They are invalid for ethical decision-making. | While imperfect, methods like QALYs and WTP aggregation, when applied carefully with sensitivity analysis, provide the best available, evidence-based, and *operationally meaningful* way to compare the impact of interventions across different people and contexts. | Yes                       | Evidence on whether specific techniques (e.g., vignette scaling - Crux 1) can overcome scale-use heterogeneity; agreement on whether operational meaningfulness suffices for ethical defensibility. |
  | **What Constitutes a Valid Decision Procedure Without Interpersonal Comps.** | Collective decisions impacting different individuals can and should be made using only individual ordinal rankings and Pareto principles (e.g., choose options where someone gains and no one loses, or use unanimity rules). | Pareto principles are often insufficient for real-world decisions (like choosing one charity) where gains and losses affect different people. Refusing *all* interpersonal comparison methods effectively blocks most consequentialist collective action. | Yes                       | Development and acceptance of a feasible, non-arbitrary decision procedure for non-Pareto improvements that avoids interpersonal cardinal comparisons. |

  ### Section 3: Cruxes – Testable Sub-Questions
  1.  **Crux: Can Vignette Equating Repair Scale Use?**
      *   **Question:** If different respondents are given identical, detailed written descriptions of hypothetical people in specific life situations (vignettes) and rate their hypothetical satisfaction on a 0-10 scale, can statistical techniques (like anchoring vignettes) successfully rescale the *actual* life satisfaction scores of these respondents to correct for systematic differences in how they use the scale (e.g., one person's "7" is another's "5"), creating a more interpersonally comparable metric?
      *   **Faction 1 Prediction:** No. The rescaling will fail to achieve true interpersonal comparability because it imposes an external researcher's judgment about what the vignette "should" be rated or assumes homogeneity in interpretation that doesn't exist. Differences will persist or be masked arbitrarily.
      *   **Faction 2 Prediction:** Yes, to a significant and practically useful degree. Vignette equating can correct for major response style differences (e.g., yea-saying, scale-end aversion), yielding scores better approximating comparable units of satisfaction across individuals.
      *   **Commitment:** If rigorous studies consistently show rescaling significantly reduces implausible cross-group differences *and* increases predictive validity for objective outcomes (e.g., health, behavior) compared to raw scores, Faction 1 commits to re-evaluating the potential of this *specific technique* for approximating comparable units. If such studies show minimal improvement or introduce new biases, Faction 2 commits to re-evaluating the validity of using simple pooled satisfaction scores for interpersonal comparison.

  2.  **Crux: Does WTP Conversion Assume or Create Comparability?**
      *   **Question:** When converting diverse outcomes (e.g., reduced risk of death, reduced pain, environmental benefit) into monetary Willingness-to-Pay (WTP) values *from different individuals* and then summing or comparing these values, does this process *assume* prior interpersonal comparability of utility (e.g., that $1 represents the same utility change for everyone), or does it merely create a *convention* for reporting value that sidesteps the need for direct utility comparison?
      *   **Faction 1 Statement:** This process *assumes* interpersonal comparability of the marginal utility of money. Summing WTP implicitly assumes $1 taken from A (causing loss X) and given to B (causing gain Y) is a neutral transfer if X=Y, which requires comparing A's utility loss to B's utility gain. It embeds cardinality and comparability.
      *   **Faction 2 Statement:** WTP conversion is primarily a *reporting convention* and an aggregation *tool*. It uses money as a common *numeraire* to express diverse values in a single metric, based on individuals' *own* trade-offs. While marginal utility of money differs, WTP reflects budget-constrained choices *at the margin* for specific goods. Aggregation sums monetary commitments, not directly utilities. It sidesteps direct utility comparison by using a transactional metric.
      *   **Commitment:** Analysis must focus on the *logical structure* of WTP aggregation. Does comparing total WTP for Project A vs. Project B *necessarily require* the assumption that $1 represents an equal utility change for all contributors? If a clear demonstration shows this assumption is logically entailed for the comparison to be meaningful as a *welfare* measure (not just a measure of total expenditure), Faction 2 commits to acknowledging this embedded assumption explicitly. If a clear demonstration shows the comparison can be interpreted solely as a measure of aggregate *monetary commitment* or *cost-equivalent* without implying equal marginal utility, Faction 1 commits to acknowledging this distinction, while still potentially objecting to its use on other grounds.

  3.  **Crux: Does Income-Scaling VSL Imply Interpersonal Comparison?**
      *   **Question:** The common practice of scaling the Value of a Statistical Life (VSL) with income (e.g., higher VSL in richer countries/for richer people) is often justified by assumptions about the diminishing marginal utility of income. Does this practice *itself* constitute an interpersonal comparison of utility (comparing the utility loss from death for a rich vs. poor person), or is it merely a technical adjustment reflecting observed differences in WTP without making a direct utility comparison?
      *   **Faction 1 Statement:** Income-scaling *directly* applies an interpersonal comparison. It assumes that the utility loss from death is proportional to income (or a function of it), implying we can compare the magnitude of loss between individuals based on their income. This is an explicit cardinal interpersonal comparison.
      *   **Faction 2 Statement:** Income-scaling is a *pragmatic adjustment* based on observed behavioral data (WTP studies showing richer people pay more for similar risk reductions) and the *theoretical expectation* of diminishing MUoI. It aims to reflect the different *budget constraints* and *opportunity costs* individuals face, not to directly compare the intrinsic "value of life" across people. It uses income as a proxy for differing circumstances affecting WTP.
      *   **Commitment:** Examine the *justification* used in policy guidelines (e.g., WHO, US DOT). If the primary justification explicitly references *interpersonal comparisons of welfare* or *equalizing the utility cost of risk reduction*, Faction 2 commits to acknowledging this embedded comparison. If the justification relies solely on *observed WTP differentials* and *equity concerns based on ability-to-pay* without invoking interpersonal utility, Faction 1 commits to acknowledging that the practice *can* be described without direct reference to interpersonal utility comparisons (while still potentially objecting to it).

  ### Section 4: Identifying Verbal Disputes
  **Ambiguous Sentence:** "Interpersonal comparisons of utility are impossible/meaningless."

  *   **Faction 1 Sense:** "It is impossible to make empirically verifiable, cardinal comparisons of utility *levels* or *differences* across individuals that have objective truth conditions. Utility is purely ordinal and subjective."
  *   **Faction 2 Sense:** "It is impossible to make *perfectly precise and objective* interpersonal comparisons, but sufficiently reliable *approximations* of well-being *differences* (impact) across individuals for decision purposes are achievable using evidence-based methods."

  **Rewritten Sentences (Disambiguated):**
  1.  "Cardinal comparisons of utility levels between individuals, asserting 'Person A has utility Ua > Person B has utility Ub,' possess no verifiable truth conditions and are therefore meaningless." (Faction 1 accepts, Faction 2 rejects)
  2.  "While imperfect, sufficiently reliable approximations of the relative *impact* (gain or loss) of interventions on the well-being of different individuals, expressed in common units (e.g., QALYs, dollars under specific assumptions), can be achieved for practical decision-making using systematic evidence and methods." (Faction 2 accepts, Faction 1 rejects)

  **Ambiguous Sentence:** "Utility cannot be measured."

  *   **Faction 1 Sense:** "Utility cannot be measured cardinally (assigned meaningful numerical values on a scale with a defined unit and often a zero point) because it is an ordinal mental state only revealed through preference rankings."
  *   **Faction 2 Sense:** "Utility cannot be measured *perfectly* or *with fundamental units like length or mass*, but it can be *operationalized* and quantified approximately using observable proxies (choices, surveys, physiological indicators) to create useful, cardinal-like measures for analysis."

  **Rewritten Sentences (Disambiguated):**
  1.  "Utility, understood as a subjective mental state, cannot be measured cardinally (assigned a numerical value with a defined, interpersonally comparable unit) through revealed preference or any other empirical method." (Faction 1 accepts, Faction 2 conditionally accepts depending on "defined, interpersonally comparable unit").
  2.  "Useful cardinal-scale approximations of preference intensity or well-being can be constructed operationally using observable data (e.g., choice probabilities under risk, carefully designed surveys, behavioral proxies), though these are imperfect and rely on specific assumptions." (Faction 2 accepts, Faction 1 rejects).

  ### Section 5: Claims to Retire
  Both factions agree to stop using the following unhelpful or misrepresentative claims in our discussions:

  1.  **"You just don't want to make a decision."** (Faction 2 to Faction 1) - Faction 1 seeks a decision based on different principles. This conflates disagreement on method with refusal to act.
  2.  **"You're ignoring the evidence/science."** (Faction 2 to Faction 1) - Faction 1 objects to the *interpretation* of the evidence and the validity of the methods producing it, not the data itself. This misstates the objection.
  3.  **"Your position makes all welfare economics impossible/pointless."** (Faction 2 to Faction 1 OR Faction 1 about Faction 2's goals) - This is hyperbolic. Faction 1 focuses on exchange, Pareto efficiency, and catalactics; Faction 2 seeks practical impact assessment. Neither renders the other's entire field invalid.
  4.  **"Interpersonal comparisons are used everywhere, so they must be fine."** (Faction 2) - Common practice doesn't establish validity. This commits the appeal-to-popularity fallacy and avoids addressing the substantive critique.
  5.  **"Any number is better than no number."** (Faction 2) - Faction 1 argues an invalid number can lead to worse decisions than acknowledged uncertainty. This claim dismisses legitimate concerns about arbitrariness.

  ### Section 6: Decision Procedure for the $600 Donation
  Recognizing our unresolved theoretical differences but acknowledging the necessity of making a joint decision, we adopt the following procedure for allocating the $600:

  1.  **Define Candidate Impacts:** For each potential recipient charity, collaboratively define the *types* of distinct impacts they claim to achieve (e.g., "provides 1 year of schooling for a child," "distributes 100 malaria bednets," "offers 50 hours of legal aid to refugees," "preserves 10 acres of rainforest"). Focus on concrete outcomes described in their own materials.
  2.  **Assess Impact per Dollar (Avoiding Interpersonal Comps Where Possible):** For each charity and each distinct impact type, estimate the *physical outcome per dollar* (e.g., cost per year of schooling provided, cost per bednet distributed) using the charity's reported data and independent evaluations (e.g., GiveWell, Charity Navigator impact reports, audited financials). *Do not attempt to convert different impact types into a single metric (like QALYs) at this stage.*
  3.  **Identify Pareto-Dominance/Non-Comparability:** Compare charities *within each specific impact type* based on cost-effectiveness (outcome per dollar). If Charity A delivers *more* of Impact X per dollar than Charity B, and all other impacts are equal or non-comparable, A is preferred for Impact X. Acknowledge when impacts are fundamentally different (e.g., schooling vs. bednets vs. rainforest) and resist premature aggregation.
  4.  **Apply Maximin Rule to Non-Comparable Impacts:** If no single charity dominates across all impact types, and impacts are deemed non-comparable in terms of type (e.g., health vs. education vs. environment), prioritize the charity whose work focuses on alleviating the condition judged by the group (through discussion of available evidence on severity, not utility levels) to involve the *most severe deprivation or suffering* based on broadly accessible indicators (e.g., mortality risk, extreme poverty metrics, lack of basic rights). This uses a procedural focus on avoiding the worst outcomes without requiring cardinal interpersonal utility comparisons.
  5.  **Vote Only as Last Resort:** If steps 3 and 4 yield no clear choice, hold a vote using a ranked-choice ballot. Members should rank charities based on their own assessment of impact importance and effectiveness, acknowledging this aggregates diverse individual valuations without claiming interpersonal comparability.

  This procedure respects Faction 1's concerns by:
  *   Avoiding imposed single-metric interpersonal comparisons (QALYs, $).
  *   Focusing on observable outcomes and Pareto efficiency within types.
  *   Using procedural rules (maximin on severity) instead of utility aggregation.
  *   Allowing individual valuation in the final vote.

  It addresses Faction 2's concerns by:
  *   Systematically using evidence on cost-effectiveness within impact types.
  *   Providing a clear, sequential process leading to a decision.
  *   Incorporating a concern for severity of impact.
  *   Ultimately enabling a choice based on collective input.

  **Closing:** This document represents a shared understanding of our disagreements and a commitment to more productive dialogue. We have identified genuine substantive divides, clarified terminological confusions, pinpointed testable cruxes, retired unhelpful arguments, and established a practical path forward for our immediate decision. We sign this not because we agree on the fundamental philosophy, but because we agree on the structure of the debate and the necessity of respectful, reasoned collaboration within our Society. We commit to revisiting the cruxes as relevant evidence emerges.
