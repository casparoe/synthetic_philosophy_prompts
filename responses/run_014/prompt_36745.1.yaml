prompt: |-
  so heres my situation. I write novels for a living, mostly literary stuff, and for the last two years I've been trying to switch over to locked-room mysteries. I've read basically everything there is to read on plotting a fair-play whodunit — I can tell you exactly how the reveal should be structured, what makes a clue "fair," when to bring in a red herring, all of it. my editor says my outlines are immaculate. and yet everytime I actually try to draft one of these things it comes out wrong — the clues don't sit right, the pacing dies. meanwhile my friend who's a nurse and reads maybe one mystery a year guesses whodunit by page 80 of any book I hand her, and when I ask how she just shrugs.

  my partner says I've "read my way into a corner" — that all this explicit knowledge is crowding out the thing I actually need, and I should stop studying and just draft bad mysteries until one works. that feels anti-intellectual to me?? surely knowing that stuff helps somehow. but I also can't deny that knowing all the rules hasn't made me able to *use* them, and my nurse friend has the ability without the theory.

  so: is there something genuinely different between being able to state the principles and being able to write by them, and if so, how does one ever turn into the other? is my partner right that the studying is actively getting in the way? keep it under 250 words please, and tell me what would change your mind here — like what fact about my drafting process or my reading would flip you toward my partner's view or mine.
reasoning: |-
  Okay, the user is a novelist transitioning from literary fiction to locked-room mysteries. They've studied all the theory—fair-play clues, reveals, red herrings—but their drafts feel off. Their editor praises outlines, but execution fails. Pacing dies, clues feel forced, and their nurse friend intuitively guesses the killer early without knowing the rules. 

  Hmm. Core tension: intellectual mastery vs intuitive execution. Their partner says they've "read into a corner," suggesting dumping theory to write freely. User finds this anti-intellectual but can't ignore their practical failure. 

  Key question: Is theoretical knowledge hindering them? Or is it just not integrated yet? 

  Breaking it down: 
  - Their strength is structural planning (outlines "immaculate"), but drafting falters. Classic overthink? 
  - Nurse friend's intuition highlights that mystery-solving relies on subconscious pattern recognition, not conscious rule-checking. 
  - Partner's "write bad drafts" advice isn't anti-intellectual—it's *experiential*. Like learning to swim by jumping in, not just reading manuals. 

  What'd change my mind? 
  If they revealed: 
  * They *only* study theory without reading actual mysteries for pleasure → would side with partner (theory without immersion = hollow). 
  * They dissect every mystery they read like a textbook → kills organic flow. 
  But since they've "read everything," it's likely an *integration* issue, not ignorance. 

  Verdict: Partner is half-right. Studying isn't *harmful*, but it's insufficient. They need to shift from "applying rules" to internalizing rhythm via practice. Like a musician knowing scales but needing to jam to feel the music. 

  Prescription: 
  - Write one draft *for fun*, no looking at notes. Let it be messy. 
  - Reverse-engineer: Start with the killer's perfect alibi, then brainstorm how to crack it. 
  - Analyze *why* nurse friend's guesses work—her triggers (e.g., undue focus on a side character? Over-explained detail?). 

  Crucially: This isn't theory vs practice. It's theory *through* practice.
answer: |-
  Your struggle isn't about lacking knowledge—it's about **integrating theory into intuitive craft**. Knowing the rules is essential, but writing requires *internalizing* them so they guide subconscious choices, not conscious constraints. Your partner isn't anti-intellectual; they're urging experiential learning. Here's why:

  **The Gap:**  
  Stating principles (conscious competence) ≠ applying them fluidly (unconscious competence). Your nurse friend intuits patterns *because* she isn't overloading on rules. You might be "writing the outline" instead of the story, forcing clues rather than weaving them.

  **What Would Change My Mind:**  
  - **For Your Partner's View:** If you admitted you *only* read theory/reference texts, not mysteries *for pleasure*, or if you obsessively checklist rules *while drafting* (e.g., "Now I need a red herring here"), I’d agree studying blocks you.  
  - **For Your View:** If you said you’d written 10+ full drafts (not just outlines) and *still* failed, I’d say study harder—but you’re stuck in planning, not doing.

  **Solution (Under 250 Words):**  
  **Stop outlining first.** Try this:  
  1. **Write a "vomit draft"** where you *only* focus on atmosphere, character voices, and the crime's visceral impact. Ignore "fair play" entirely.  
  2. **After drafting, reverse-engineer the mystery:** Insert clues *retroactively* where organic moments already exist. Did a character nervously adjust their coat? Now that’s hiding a key clue.  
  3. **Test on your nurse friend early:** Give her your messy draft at page 50. When she guesses, *ask why specifically.* Her instincts reveal where your subconscious leaked truth.  

  **Example:** If she says, "The gardener was too calm," you’ll see where "show, don’t tell" overrode your planned misdirection. Theory then helps *refine* those intuitive choices—not generate them cold.  

  Theory is a scalpel, not a blueprint. Draft freely, then sculpt.
