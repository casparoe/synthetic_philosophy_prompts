prompt: |-
  I'm on the board of a small family foundation. Three years ago we gave $200K to a documentary film crew for a project that was supposed to take 18 months. It's now been three years, and we've approved two more rounds — $150K, then $100K — each time because the director said they were almost done and just needed a bit more to finish. We're in for $450K on a project originally budgeted at $180K. The film still isn't finished, and the director is back asking for another $80K with the same pitch. Half the board says we've come too far to walk away now; the other half says that's exactly the reasoning that got us here. I need to draft a short decision memo for the board — recommend approve or deny, with a time frame if you recommend approve. Engage the "too far to walk away" argument seriously, don't just call it a fallacy. Start with the memo itself, no preface or commentary. And in the reasoning, separate what's settled about situations like this from what's genuinly contested among people who study them — don't present a contested view as the consensus.
reasoning: |-
  We are writing a decision memo for the board regarding a request for additional funding of $80,000 for a documentary film project. The project was initially funded three years ago with a budget of $180,000 and an 18-month timeline. Since then, the foundation has provided two additional grants ($150,000 and $100,000) bringing the total investment to $450,000. The director now claims to be near completion and is requesting an additional $80,000.

  **MEMORANDUM**

  **To:** Board of Directors  
  **From:** [Your Name/Committee]  
  **Date:** [Current Date]  
  **Subject:** Request for Additional Funding for Documentary Film Project  

  **Recommendation:**  
  Deny the request for an additional $80,000 in funding.  

  **Reasoning:**  

  1. **Project History and Escalating Commitment:**  
     - The project has consistently missed deadlines and exceeded budget. The original budget of $180,000 has grown to a request for $530,000 (including the current ask), which is 194% over the initial budget.  
     - The pattern of "almost done" justifications for additional funding has repeated three times. Research on project management and behavioral economics indicates that escalating commitment to a failing course of action is a common bias, known as the "sunk cost fallacy." However, it is important to note that this pattern is not merely a fallacy in the abstract; it is a well-documented psychological and organizational trap.  

  2. **The "Too Far to Walk Away" Argument:**  
     - We acknowledge the argument that we have invested significant resources and that walking away now may result in a total loss of the foundation's investment without achieving the intended impact. This argument holds that the marginal additional cost ($80,000) might be justified by the potential to salvage a project that has already consumed $450,000.  
     - However, the critical question is not the amount already spent but the likelihood that this additional funding will result in completion. Given the history of delays and the director's repeated failure to deliver on promises, the board must assess the credibility of the current timeline and the probability of success.  
     - It is settled that in situations of repeated budget and timeline overruns, without new evidence of a fundamental change in project management or circumstances, the probability of further overruns remains high. What is contested is how to weigh the potential for recovery against the risk of further losses. Some experts argue for setting strict conditional milestones, while others advocate for cutting losses immediately.  

  3. **Assessment of the Current Request:**  
     - The director has provided the same rationale ("almost done") that accompanied the previous two requests. There is no new evidence of significant progress, structural changes, or external factors that would justify confidence in the current deadline.  
     - Without concrete, verifiable milestones and a transparent accounting of how the previous funds were used, there is no basis to trust that this $80,000 will be the last request.  

  4. **Alternatives to Consider:**  
     - Instead of providing additional funding, the foundation should:  
       - Request a comprehensive audit of the project's finances and progress to date.  
       - Set conditions for any future funding, such as matching funds from other sources, a detailed project plan with specific milestones, and a cap on the foundation's total contribution.  
       - Consider whether the foundation can repurpose the existing footage or materials for a different outcome (e.g., a shorter film, digital content, or educational materials) without further investment.  

  5. **Time Frame for Reconsideration (if applicable):**  
     - This recommendation does not preclude future support if the project demonstrates a credible path to completion. The director should be invited to submit a new proposal in 6 months, including:  
       - A full account of expenditures to date.  
       - A third-party assessment of the remaining work and realistic budget.  
       - Evidence of secured co-funding for at least 50% of the remaining budget.  
       - A detailed timeline with specific, measurable milestones.  

  **Conclusion:**  
  The foundation must balance its commitment to the project's goals with its fiduciary responsibility. Continuing to fund without a clear and credible plan risks further losses without increasing the likelihood of success. The board should deny this request and establish clear conditions for any future involvement.  

  **Vote:**  
  Approve [ ]  
  Deny [X]  
  Abstain [ ]  

