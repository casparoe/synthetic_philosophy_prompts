answer: |-
  ### Joint Statement on Future Contingents  
  **Authored via Adversarial Collaboration**  
  **Between an Open-Future Indeterminist (OFI) and an Ockhamist (Ock)**  

  #### I. Agreed Claims  
  1. **Bivalence vs. Excluded Middle**:  
     - The *Law of Excluded Middle* (LEM) holds: For any proposition \(P\), \(P \lor \neg P\) is logically valid.  
     - *Bivalence* (the principle that every proposition is either true or false) is distinct from LEM. Bivalence may fail for future contingents without violating LEM.  

  2. **Branching-Time Models**:  
     - Branching-time structures (e.g., Prior-Thomason semantics) represent the *metaphysical openness* of the future: multiple possible futures exist relative to the present.  
     - These models are compatible with both views and do not entail fatalism.  

  3. **Fatalism Defined and Rejected**:  
     - *Fatalism* asserts that future events are *inevitable* and *causally independent* of present actions. Both parties reject fatalism.  
     - Future openness is consistent with causal influence: present actions can affect which future branch is realized.  

  4. **Norms of Assertion and Credence**:  
     - **Assertion**: It is improper to assert a future-contingent proposition (e.g., "A naval battle occurs tomorrow") when no present evidence guarantees its truth.  
     - **Credence**: Rational agents assign subjective probabilities to future contingents (e.g., 0.5 to "The satellite coin lands heads") based on objective chances or symmetry.  

  5. **Cases of Shared Analysis**:  
     - **Satellite Coin**: The coin flip is causally undetermined; no present factors bias the outcome.  
     - **Martian Storm**: The storm is causally determined by present conditions but *in principle unknowable* to any observer.  
     - **Retrospective Bet**: After the outcome, agents can correctly say, "What I said yesterday *turned out* to be true."  

  ---

  #### II. Disagreements Table  
  | Issue | OFI Position | Ockhamist Position |  
  |-------|--------------|-------------------|  
  | **Bivalence for future contingents** | Future contingents (e.g., "Naval battle occurs tomorrow") are *neither true nor false* at present due to metaphysical openness. | Future contingents are *either true or false* at present, even if the future is metaphysically open. |  
  | **Privileged branch ("Thin Red Line")** | No branch is ontologically privileged; all futures are symmetrical until realized. | One branch is the *actual future* (the "Thin Red Line"), fixed but unknown, grounding present truth values. |  
  | **Retrospective truth ascriptions** | "What I said yesterday *turned out* true" does not imply it *was* true when uttered; truth emerges at realization. | "What I said yesterday *turned out* true" entails it *was* true when uttered, per the actual future branch. |  
  | **Deliberation and openness** | Rational deliberation requires treating the future as *unsettled* (no present truth values); else, agency is illusory. | Rational deliberation requires treating the future as *epistemically open*; bivalence does not threaten agency, as actions causally influence outcomes. |  

  ---

  #### III. Cruxes  
  **Crux 1: Truthmakers for Retrospective Claims**  
  - **Consideration**: In the *Retrospective Bet* case, after the coin lands heads, the winner declares: "My claim yesterday (‘Heads will occur’) *was* true."  
    - **OFI Prediction**: Speakers will *reject* "was true" if asked yesterday but *accept* "turned out true" today. The asymmetry reflects truth-value indeterminacy at utterance.  
    - **Ockhamist Prediction**: Speakers will accept *both* "was true" and "turned out true" today, as the claim’s truth was fixed by the actual future branch at utterance.  

  **Crux 2: Determinism vs. Truth**  
  - **Consideration**: In the *Martian Storm* case, if Laplace’s Demon (knowing all present laws and conditions) asserts pre-storm: "The storm will occur."  
    - **OFI Prediction**: The Demon’s assertion is *incorrect*; even deterministic outcomes lack *present* truthmakers until realized.  
    - **Ockhamist Prediction**: The Demon’s assertion is *correct*; determinism ensures a present truthmaker via the actual future branch.  

  **Crux 3: Deliberation and Assertion**  
  - **Consideration**: An agent deliberating whether to launch a naval attack says: "If I order the attack, a battle *will* occur."  
    - **OFI Prediction**: Asserting the conditional is improper mid-deliberation; it presupposes a settled future, undermining openness.  
    - **Ockhamist Prediction**: Asserting the conditional is proper; it is true (or false) based on the actual future, and deliberation addresses *which* future is actualized.  

  ---

  #### IV. Merely Verbal Elements  
  Both parties agree the dispute is **not** merely verbal regarding:  
  - The existence of a Thin Red Line (ontological privilege).  
  - The grounding of present truth values for future contingents.  

  However, **verbal agreement exists** on:  
  - The *concept of openness*: Both define "open future" as multiple causally possible outcomes.  
  - The *impropriety of asserting future contingents*: Both ground this in epistemic (not semantic) norms.  

  ---  
  **Conclusion**: This collaboration clarifies that the core divergence lies in *truthmaker ontology* (e.g., the Thin Red Line) and its implications for agency, not logic or fatalism. Further empirical study of linguistic practices (per Cruxes 1–3) may resolve outstanding issues.  

  *Signed,*  
  **Open-Future Indeterminist**  
  **Ockhamist**  
  *Date: 16 October 2023*
