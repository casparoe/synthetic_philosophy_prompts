prompt: |-
  Please draft the joint statement that could be signed after a good-faith adversarial collaboration between two philosophers of time: an Open-Future Indeterminist who holds that a genuinely undetermined future contingent is at present neither true nor false, and an Ockhamist who holds that bivalence is preserved for future contingents even if the future is metaphysically open.

  The document should concern the familiar example of a naval battle occurring tomorrow and three further stipulated cases to be addressed by both parties: a Satellite Coin case in which an autonomous satellite will flip a genuinely indeterministic coin tomorrow at noon with no present causal factor favoring either outcome; a Martian Storm case in which a dust storm will occur tomorrow as a deterministic consequence of present conditions that are in principle unknowable to any observer; and a Retrospective Bet case in which two agents today place a symmetric bet to be settled tomorrow, and tomorrow one of them says that what was said today turned out to have been true.

  Structure the statement as a numbered section of agreed claims followed by a disagreements table and then a cruxes section. The agreed claims should cover at least the distinction between bivalence and excluded middle, what a branching-time model represents, what would count as fatalism, and what norms govern assertion and rational credence about the future. The disagreements table should state each residual disagreement in neutral wording that the holder of each view would accept as a fair formulation of their own position, including whether truth requires a privileged branch or thin red line, whether retrospective ascriptions of past truth are correct, and whether deliberation gives a practical reason to treat the future as open.

  For each crux, specify a concrete consideration, thought experiment, or linguistic pattern that both parties agree would bear on it, with each side's prediction about that consideration recorded in advance. Conclude by indicating which parts of the dispute, if any, both parties agree are merely verbal.
reasoning: |-
  We are drafting a joint statement after a good-faith adversarial collaboration between an Open-Future Indeterminist (OFI) and an Ockhamist (Ock). 
   The OFI holds that future contingents (like a naval battle tomorrow) are neither true nor false now, while the Ockhamist holds that they are either true or false now (bivalence) even though the future is open.

   We have four cases:
   1. Naval Battle (familiar): Will there be a naval battle tomorrow?
   2. Satellite Coin: An autonomous satellite flips a genuinely indeterministic coin (no present causal factors favoring heads or tails) tomorrow at noon.
   3. Martian Storm: A dust storm occurs tomorrow as a deterministic consequence of present conditions, but these conditions are in principle unknowable to any observer.
   4. Retrospective Bet: Two agents today place a symmetric bet (say, on the coin flip) to be settled tomorrow. Then tomorrow, after the flip, one agent says to the other: "What I said yesterday turned out to be true."

   Structure:
   I. Agreed Claims (numbered)
   II. Disagreements Table (with each row being a point of disagreement, stated neutrally, and columns for OFI and Ock)
   III. Cruxes Section (each crux has a concrete consideration, and both sides' predictions)

   Finally, indicate which parts are merely verbal.

   Let's begin:

   I. Agreed Claims:

   1. Bivalence vs. Excluded Middle:
      - Both parties agree that the Law of Excluded Middle (LEM) holds: for any proposition P, the disjunction (P or not-P) is true.
      - However, they agree that bivalence (the principle that every proposition is either true or false) is a distinct principle. The OFI denies bivalence for future contingents, while the Ockhamist affirms it.

   2. Branching-Time Models:
      - Both parties agree that branching-time models (like those in Prior's tense logic or the Belnap et al. framework) are a useful way to represent the openness of the future. In such models, the present moment is represented as a node, and multiple future branches represent possible ways the future might unfold.
      - They agree that these models capture the idea that there is no unique actual future at the present time (from the perspective of the present node).

   3. Fatalism:
      - Both parties agree that fatalism is the view that the future is fixed and inevitable, such that human actions cannot affect what will happen. They both reject fatalism.
      - They agree that the openness of the future (as represented in branching-time models) is compatible with human freedom and the efficacy of deliberation.

   4. Norms of Assertion and Rational Credence:
      - Both parties agree that, as a matter of rational credence, one should assign probabilities to future contingents that reflect the objective chances (if known) or one's best evidence. For example, in the Satellite Coin case, one should assign 0.5 to heads and 0.5 to tails.
      - They agree that it is typically inappropriate to assert a future contingent (e.g., "There will be a naval battle tomorrow") when the future is open in the relevant respect. This is because assertion requires knowledge (or at least truth) and, in the open future, we lack the grounds for such an assertion. However, they note that there might be pragmatic reasons for making such assertions in certain contexts (e.g., "I will meet you tomorrow" in planning).

   5. The Martian Storm Case:
      - Both parties agree that in the Martian Storm case, the storm will occur as a deterministic consequence of present conditions. However, because the present conditions are in principle unknowable, no one can know whether the storm will occur until tomorrow.
      - They agree that, from the perspective of rational credence, an agent who lacks the relevant information should assign a probability less than 1 to the occurrence of the storm (if they are aware of the possibility of error) but that the truth value of the proposition "There will be a dust storm on Mars tomorrow" is determined by the present state (even if unknown). The OFI, however, would not consider this proposition to have a truth value now because of the openness of the future, whereas the Ockhamist would.

      But note: we are in the agreed section. We must avoid disagreement. Therefore, we focus on what is common.

      Actually, we can rephrase: 
      - Both parties agree that the Martian Storm case involves a future event that is causally determined by the present state, but that this determination is in principle unknowable. They also agree that an agent who is ignorant of the present conditions should not be certain about the storm.

      However, the OFI and Ock might disagree on whether the proposition about the future storm is true now. So we cannot say they agree on that. Therefore, we stick to the epistemic point.

      Revised:
      5. The Martian Storm case: Both parties agree that the dust storm's occurrence is causally determined by the present state of the universe. They also agree that, due to the in principle unknowability of the relevant conditions, no agent can have knowledge today of whether the storm will occur. Thus, any assertion today about the storm would be unwarranted.

   6. Retrospective Bet Case:
      - Both parties agree that after the coin flip in the Satellite Coin case, one can truthfully say that the outcome (say, heads) was the outcome that occurred. They also agree that the agent who bet on heads and won can say, "What I said yesterday (that the coin would come up heads) turned out to be true." However, they disagree about whether the winning agent's statement yesterday was true at the time it was made.

      But again, we are in the agreed section. We can agree on the retrospective ascription of truth to the past utterance? Not exactly, because the OFI will say that the utterance yesterday was neither true nor false, but now we can say it was true (because now it is settled). The Ockhamist will say it was true yesterday. But both agree that now we can say it turned out to be true? 

      So we can say:
      - Both parties agree that in the Retrospective Bet case, after the outcome is known, it is correct to say that the winning agent's past assertion "turned out to be true" (or "was true" in the sense that it described what actually happened). However, they disagree about whether the past assertion was true at the time it was made.

   II. Disagreements Table:

   We state each disagreement in a neutral way that both parties can accept as a fair statement of their own position.

   | Issue | Open-Future Indeterminist (OFI) | Ockhamist (Ock) |
   |-------|--------------------------------|-----------------|
   | 1. Truth of Future Contingents | A future contingent (such as "There will be a naval battle tomorrow") is neither true nor false at the present time, because there is no fact of the matter about how the future will turn out in the relevant respect. | A future contingent is either true or false at the present time, even though the future is open and no one can know which truth value it has. |
   | 2. Privileged Branch / Thin Red Line | There is no privileged branch (or "thin red line") that represents the actual future among the many possible futures. The future is genuinely open and no branch is currently singled out as the one that will obtain. | Although the future is open in the sense that multiple branches are possible, there is a unique branch that is the actual future (the "thin red line"), which is the one that will obtain. This branch is not epistemically accessible but is ontologically privileged. |
   | 3. Retrospective Ascriptions of Truth | When, after the fact, we say that a past utterance about a future contingent "was true", we are not ascribing truth to the utterance at the time it was made. Rather, we are saying that the event it described came to pass. The utterance, when made, was neither true nor false. | When we say that a past utterance about a future contingent "was true", we are ascribing truth to the utterance at the time it was made. The truth of the utterance was determined by the actual future (the thin red line) that existed at that time, even though it was unknown. |
   | 4. Deliberation and the Open Future | The openness of the future is essential for rational deliberation: if the future were already settled, then deliberation would be pointless. Therefore, in deliberation, we must treat the future as open and not as already having a definite truth value. | Rational deliberation is compatible with the future being settled in the sense that there is a unique actual future. We deliberate because we do not know what that future is, and our actions can causally influence which future comes about. Therefore, we do not need to deny bivalence for future contingents to make sense of deliberation. |

   III. Cruxes Section:

   For each crux, we specify a concrete consideration that both parties agree would bear on the issue, and then each side's prediction.

   Crux 1: The Role of the Thin Red Line in the Retrospective Bet Case.

     - Consideration: In the Retrospective Bet case, after the coin flip, the winner says, "What I said yesterday was true." We ask: is the winner's statement about the past utterance correct? And what makes it correct?
     - OFI Prediction: The OFI predicts that the winner's statement is correct because the event described by the past utterance occurred. However, the past utterance itself, at the time it was made, was not true. The correctness of the retrospective statement does not require that the past utterance had a truth value at the time; it only requires that the event happened.
     - Ock Prediction: The Ockhamist predicts that the winner's statement is correct because the past utterance was true at the time it was made, and the truth of that utterance was grounded in the thin red line (the actual future) that existed at that time.

   Crux 2: The Norm of Assertion for Future Contingents.

     - Consideration: Consider an agent who, in the Satellite Coin case, asserts today, "The coin will land heads." Both parties agree that this assertion is improper. But why?
     - OFI Prediction: The OFI predicts that the assertion is improper because the proposition asserted lacks a truth value. One cannot assert something that is neither true nor false.
     - Ock Prediction: The Ockhamist predicts that the assertion is improper because the agent does not know whether the proposition is true (even though it has a truth value). The norm of assertion is knowledge, not mere truth.

   Crux 3: The Martian Storm and Determinism.

     - Consideration: In the Martian Storm case, we stipulate that the storm is causally determined by the present state. Does this make the proposition about the storm's occurrence true now?
     - OFI Prediction: The OFI predicts that even though the storm is determined, the future is still open in the relevant metaphysical sense (because the present state does not fix the future in a way that is accessible or that rules out alternative possibilities). Therefore, the proposition is still neither true nor false until the storm occurs.
     - Ock Prediction: The Ockhamist predicts that because the storm is determined by the present state, the proposition is true (if the storm will occur) or false (if it won't) now. The thin red line is fixed by the present state, even if we cannot know it.

   Crux 4: Deliberation and the Open Future.

     - Consideration: Imagine a deliberating agent who is deciding whether to bring an umbrella. The agent says to herself, "If I bring the umbrella, I will stay dry if it rains; but if I don't, I will get wet." How does the openness of the future play a role?
     - OFI Prediction: The OFI predicts that the agent must treat the future as open (i.e., without a definite truth value for "It will rain") in order for the deliberation to be rational. If the agent believed that it is already true (or false) that she will bring the umbrella and that it is already true (or false) that it will rain, she would see her deliberation as ineffective and irrational.
     - Ock Prediction: The Ockhamist predicts that the agent can rationally deliberate even if she believes that there is a fact of the matter about what she will do and about whether it will rain. She deliberates because she does not know these facts and because her deliberation can causally influence the future.

   Conclusion: Merely Verbal Disagreements

     Both parties agree that part of their disagreement might be verbal, particularly concerning the meaning of "truth" for future contingents. Specifically:

     - The OFI uses "truth" in a way that requires present determination or settledness. For the OFI, a proposition is true only if the facts that make it true are already in place.

     - The Ockhamist uses "truth" in a way that does not require present settledness but allows that the truthmaker might be a future event that is now determined (as in the Martian Storm) or even undetermined but with a privileged future (the thin red line).

     However, they agree that the core metaphysical disagreement about whether there is a unique actual future (the thin red line) is not merely verbal. The OFI denies such a unique actual future, while the Ockhamist affirms it.

     They also agree that the disagreement about the norm of assertion might be partly verbal if it turns on the definition of what it takes to properly assert, but they note that the disagreement about whether future contingents have a truth value is substantive.

     Therefore, the parties conclude that while some aspects of the debate might be terminological, there remains a substantial metaphysical disagreement about the existence of a privileged future branch.

