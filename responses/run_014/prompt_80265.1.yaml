answer: |-
  I'll break this down step by step, as you requested. The core issue you're facing—why your willingness to pay doesn't align with expected value across these games—stems from the fact that expected value alone doesn't account for how people subjectively value risky outcomes. The principle that explains all your decisions (and resolves the paradoxes) is **expected utility theory with a concave utility function**. This model incorporates risk aversion and diminishing marginal utility of wealth, meaning each additional dollar is worth less to you than the previous one. I'll state the principle clearly, explain how it fits your four verdicts, identify which verdicts motivate each part of the principle, and then apply it to your additional game. Finally, I'll address the trade-off you asked about with a "simpler principle."

  ### The Core Principle: Expected Utility with Concave Utility
  - **Precise statement**: You maximize expected utility, not expected value. Utility (\(U\)) is a function of wealth (\(W\)) that is concave (e.g., \(U(W) = \sqrt{W}\) or \(U(W) = \ln(W)\)), reflecting diminishing marginal utility. For a game with random payoff \(X\), your willingness to pay (\(P\)) is the price where the expected utility of playing equals the utility of not playing:
    \[
    E[U(W - P + X)] = U(W)
    \]
    Here, \(W\) is your current wealth, \(P\) is what you pay, and \(X\) is the payoff from the game. Concavity means \(U\) curves downward (e.g., the utility gain from $0 to $100 is larger than from $100 to $200), so you dislike risk and value high-probability moderate gains more than low-probability huge gains.

  - **Why it works**: Expected value treats all dollars equally, but in reality, you care about the distribution of outcomes—especially the risk (variance) and skew (e.g., tiny chances of huge wins). Concave utility downgrades extreme, unlikely payoffs because they add little to your happiness or security. This explains why you might pay far less than expected value for a long-shot game (like Game 3) but close to it for a simple bet (like Game 4).

  - **Motivation from your verdicts**: 
    - **Game 1 and Game 3** motivate the concavity part. You're willing to pay only $20 for both, despite Game 1's infinite EV and Game 3's $100 EV. This shows you underweight extreme, low-probability gains—concave utility captures that by making \(U(W)\) grow very slowly for large \(W\).
    - **Game 4** motivates the risk-aversion part. You pay $90 for a $100 EV bet, showing you slightly discount risky outcomes even when they're straightforward. Concave utility explains this small discount via its curvature.
    - **Game 2** supports both. With a $1M cap, the EV is only $21, and you pay $20. Concave utility keeps your valuation low because the cap doesn't eliminate the game's riskiness; it just trivially reduces the extreme tail.

  Now, let's apply this principle to your games, showing why your valuations make sense.

  ### Analysis of Your Games
  #### Game 1 (Classic St. Petersburg)
  - **Setup**: Fair coin, win \(2^n\) if first heads on flip \(n\). Expected value is infinite: \(\sum_{n=1}^{\infty} (1/2)^n \cdot 2^n = \sum_{n=1}^{\infty} 1 = \infty\).
  - **Your verdict**: Pay about $20.
  - **Expected utility explanation**: With concave utility (e.g., \(U(W) = \ln(W)\)), the expected utility is finite because \(\ln(2^n)\) grows slowly. For instance, with typical wealth around $50,000, the certainty equivalent (what you'd pay) is often $10–$20. The gap arises because infinite EV comes from absurdly large, improbable payoffs (e.g., 1-in-a-billion chance of winning billions), but you don't value those gains highly due to diminishing marginal utility. Concave utility resolves the paradox by making EU finite and low.
  - **Why your verdict fits**: It motivates concavity—you ignore the "infinite" EV tail because those dollars add little utility.

  #### Game 2 (Capped at $1 Million)
  - **Setup**: Identical to Game 1, but payouts capped at $1,000,000. Expected value is about $21 (calculation below).
  - **Your verdict**: Pay about $20.
  - **Expected value calculation**: Payout is \(\min(2^n, 10^6)\). For \(n \leq 19\), payout is \(2^n\); for \(n \geq 20\), payout is \(10^6\).  
    \[
    EV = \sum_{n=1}^{19} (1/2)^n \cdot 2^n + \sum_{n=20}^{\infty} (1/2)^n \cdot 10^6 = \sum_{n=1}^{19} 1 + 10^6 \cdot (1/2)^{20} \cdot \sum_{k=0}^{\infty} (1/2)^k
    \]
    The first sum is 19. The second sum simplifies: \((1/2)^{20} = 1/1,048,576\), and \(\sum_{k=0}^{\infty} (1/2)^k = 2\), so \(10^6 \cdot (1/1,048,576) \cdot 2 \approx 1.907\). Total EV ≈ 19 + 1.907 = 20.907 ≈ $21.
  - **Why EV is small**: The cap binds early—only payouts from \(n \geq 20\) are affected, but those have tiny probabilities (e.g., \(P(n=20) \approx 9.54 \times 10^{-7}\)). The EV barely changes from the uncapped case (which would be $20 at \(n=20\)) because the cap chops off negligible mass.
  - **Expected utility explanation**: The cap reduces the extreme tail, but the game is still risky (high variance). With concave utility, you value the sure $20 almost as much as the risky $21 EV—hence paying $20. If utility were linear, you'd pay $21, but concavity makes you slightly risk-averse.
  - **Why your verdict fits**: It supports both concavity and risk aversion—you pay near EV because the cap trims the tail, but not more because the risk profile is similar to Game 1.

  #### Game 3 (Truncated at 100 Flips)
  - **Setup**: Win \(2^n\) if first heads on flip \(n \leq 100\); win $0 if no heads in 100 flips. Expected value is $100: \(\sum_{n=1}^{100} (1/2)^n \cdot 2^n = \sum_{n=1}^{100} 1 = 100\).
  - **Your verdict**: Pay about $20.
  - **Why it feels paradoxical**: EV is $100—finite and modest—but you pay only $20, same as the infinite-EV Game 1. Meanwhile, Game 4 has identical EV but you pay $90.
  - **Expected utility explanation**: The game has high variance and positive skew. Most probability mass is on small wins (e.g., 50% chance of $2, 25% of $4), but a tiny chance of huge wins (e.g., \(2^{100} \approx 10^{30}\) dollars with \(P \approx 10^{-30}\)). Concave utility (e.g., \(U(W) = \sqrt{W}\)) severely underweights these huge gains because they add little utility. For example:
    - If \(W = \$50,000\), \(U(\$50,000 + 2^{100}) \approx U(\$10^{30})\) is only slightly higher than \(U(\$10^6)\)—diminishing returns set in fast.
    - Expected utility is dominated by likely small outcomes (e.g., winning $2–$128), which, after paying $20, often leave you worse off (e.g., winning $2 with 50% probability means you net -$18). The certainty equivalent drops to $20 because you dislike the risk of low net gains.
  - **Risk vs. Game 4**: Game 3 has massive variance (variance ≈ \(2^{101} - 100^2 \approx 10^{30}\), standard deviation ≈ \(10^{15}\)), while Game 4 has low variance (variance = \(10,000\), standard deviation = $100). Concave utility penalizes high variance/skew, so you pay much less for Game 3.
  - **Why your verdict fits**: It strongly motivates concavity—the $100 EV includes worthless extreme gains, and you focus on the likely poor outcomes.

  #### Game 4 (Simple Bet)
  - **Setup**: 50% win $200, 50% win $0. Expected value is $100.
  - **Your verdict**: Pay about $90.
  - **Expected utility explanation**: With low variance, concave utility gives a certainty equivalent close to EV. For \(U(W) = \sqrt{W}\) and \(W = \$50,000\), solving \(0.5 \sqrt{50,000 - P + 200} + 0.5 \sqrt{50,000 - P} = \sqrt{50,000}\) yields \(P \approx \$90\) (slightly less than $100 due to mild risk aversion). You pay $90 because the bet is simple and low-risk—no extreme outcomes to underweight.
  - **Why your verdict fits**: It motivates risk aversion in a way that's consistent with concavity but shows that when risk is low, you pay near EV.

  ### The Trade-Off: Simpler Principle vs. Your Verdicts
  - **Simpler principle**: "Pay up to the expected value." This assumes risk neutrality (linear utility).
  - **Why it fails**: It conflicts with your Game 3 and Game 4 verdicts—both have $100 EV, but you pay $20 for Game 3 and $90 for Game 4. If you followed this principle, you'd pay $100 for both, but you intuitively reject that for Game 3 because it feels too risky. It also fails Game 1 (infinite EV suggests infinite payment, but you pay $20).
  - **Which verdict must be abandoned**: If you insist on this simpler principle, you must abandon your Game 3 verdict (pay $20) and pay $100 instead. But your $20 willingness to pay is rational—it reflects real-world risk aversion. Game 3's $100 EV is mathematically correct but behaviorally irrelevant because it's driven by outcomes you don't care about.
  - **Adequate principle**: Expected utility with concave utility saves all your verdicts. It explains:
    - Game 1: Low payment due to concavity taming infinite tail.
    - Game 2: Near-EV payment because cap reduces tail risk.
    - Game 3: Low payment due to concavity penalizing high variance/skew.
    - Game 4: Near-EV payment due to low risk.

  ### Application to the Additional Game
  - **Setup**: You hold a sure $10,000. A ticket pays an extra $10,000 with 50% probability, nothing otherwise (EV = $5,000). A stranger has no sure money and is offered the identical ticket.
  - **Your belief**: You would pay less for the ticket than the stranger, even though EV is the same for both.
  - **Expected utility explanation**: Yes, the principle captures this. With concave utility, your marginal utility for money decreases as wealth increases. For you (wealthier), the ticket adds less utility than for the stranger (poorer).
    - **Stranger's perspective**: Suppose stranger's wealth is low (e.g., \(W_S = \$1,000\)). The ticket represents a huge gain: \(0.5 U(1,000 + 10,000) + 0.5 U(1,000)\). With \(U(W) = \sqrt{W}\), EU increase is large, so certainty equivalent is high—they might pay near $5,000.
    - **Your perspective**: Your wealth is higher (e.g., \(W_Y = \$10,000 +\) current wealth). The ticket adds less: \(0.5 U(20,000 + W_{\text{current}}) + 0.5 U(10,000 + W_{\text{current}})\). Concavity means \(U(20,000) - U(10,000) < U(10,000) - U(0)\)—diminishing returns. For instance, if \(W_{\text{current}} = \$40,000\), \(U(50,000) \approx 223.61\), \(U(60,000) \approx 244.95\), so EU gain is small. You might pay only $4,000 or less.
    - **Result**: You pay less than the stranger because your higher wealth reduces the marginal utility of the gain. This is a direct consequence of concave utility.

  In summary, expected utility with concave utility explains all your decisions—it resolves the paradoxes by accounting for how you subjectively value money and risk. If you force a simpler "pay up to EV" rule, you'd have to overpay for Game 3, but that ignores your (rational) risk aversion. The key insight is that dollars from different outcomes aren't equal to you, and concave utility models that perfectly. If you want to get quantitative, assume \(U(W) = \sqrt{W}\) or \(U(W) = \ln(W)\) and solve for \(P\) in each game—it'll closely match your $20/$90 valuations.
