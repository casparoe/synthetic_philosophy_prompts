  Below is a ready-to-use, beginner-friendly quiz that meets your specifications. It uses concrete vignettes (including your three cases) to reveal underlying beliefs about race, gender, and money without jargon. Each question has 2–3 intuitive answer choices, and the scoring system maps patterns to the four positions you described.

