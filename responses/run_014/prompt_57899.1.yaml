  ### **Scoring Key**  
  Tally your answers (mostly A’s, B’s, etc.), then match to the positions below:  

  #### **1. No-Nonsense Realism**  
  > *"Trees, race, gender, and dollars are all bedrock reality."*  
  - **Answers**: Mostly **A**’s.  
  - **Beliefs**: Money = tangible value (gold/chocolate). Race = biology. Gender = innate. Social forces only *reveal* differences.  

  #### **2. Causal Constructionism (Middle View)**  
  > *"Society shapes how race/gender/money work—but they’re grounded in real differences."*  
  - **Answers**: Mostly **C**’s.  
  - **Beliefs**: Money = proxy for labor/resources. Race = biological + cultural. Gender = innate + socialized. Society *magnifies* pre-existing categories.  

  #### **3. Full-Blown Constitutive Constructionism**  
  > *"Agreements *make* it real: dollars, gender, and race exist because we act like they do."*  
  - **Answers**: Mostly **B**’s.  
  - **Beliefs**: Money = collective trust (chocolate/rocks work!). Gender = performed rules (avatars count!). Race = lived identity ≠ DNA. Society *creates* categories.  

  #### **4. Race Eliminativist + Gender/Money Constructionist**  
  > *"Race isn’t real—but gender roles and money are human inventions."*  
  - **Answers**: **B/C mix, but B on Q3/Q6/Q9 + C on Q3/6/9**.  
  - **Beliefs**: Race = incoherent (DNA/society clash; drop it!). Gender = social performance (esports!). Money = shared fiction (chocolate!).  

