  ### **"Which Kind of Constructionist Are You *Really*?" Quiz**  
  *(9 questions, 5-minute gut reactions)*  

  **Instructions**: Pick the answer that feels most true to you for each scenario. No overthinking!  

  1. **The Chocolate Standard**  
     After a stranded Antarctic crew is rescued, they keep trading chocolate bars as "money." People back home play along for months. This shows that money...  
     A) Is ultimately about chocolate’s real scarcity and usefulness.  
     B) Works because everyone agrees it does—even if it’s silly.  
     C) Is just a placeholder for "real" value like gold or labor.  

  2. **Avatar Gender League**  
     A youth esports league creates a competitive division based *only* on players’ chosen avatar bodies (e.g., "dragon" or "robot") and treats it like gender on sign-up forms. This division...  
     A) Is a fun game, but unrelated to actual gender.  
     B) Proves gender rules are flexible inventions.  
     C) Might reflect players’ identities, but isn’t *real* gender.  

  3. **DNA Race Switch**  
     A hospital replaces "self-identified race" on intake forms with "DNA ancestry percentages," claiming it’s the same thing but more precise. This change...  
     A) Improves accuracy—race is biological.  
     B) Misses the point—race is about lived identity.  
     C) Shows race is too fuzzy to be useful.  

  4. **The Island Dollar**  
     People on a remote island use carved stones too heavy to move as money. Ownership is tracked via oral history. The stones have value because...  
     A) They’re rare physical objects (like gold).  
     B) Everyone trusts the shared story of ownership.  
     C) They’re backed by the chief’s authority.  

  5. **Baby X Experiment**  
     A child raised without gender labels is seen as "proof" gender is innate when they later "choose" boy/girl toys. This suggests gender...  
     A) Was always in their biology.  
     B) Was shaped by hidden social cues.  
     C) Is real, but society amplifies differences.  

  6. **Racial Reclassification**  
     A census changes a person’s race from "Black" to "White" based on DNA after they’d always identified as Black. This is...  
     A) Scientific progress—DNA doesn’t lie.  
     B) Erasing their life experience.  
     C) Why we should ditch race categories.  

  7. **Gamer Gender Hack**  
     In the esports league (from Q2), players start swapping avatars daily to enter different divisions. The league says they’re "cheating gender." The players are...  
     A) Breaking rules based on biology.  
     B) Exposing how arbitrary the divisions are.  
     C) Confusing performance with reality.  

  8. **Hyperinflation Story**  
     A country’s currency becomes worthless overnight after political chaos. This happens because money...  
     A) Needs stable resources (like oil) to back it.  
     B) Only works with collective faith in the system.  
     C) Is really about government control.  

  9. **Ancestry Surprise**  
     Two siblings with identical DNA ancestry percentages identify as different races due to upbringing. This shows race is...  
     A) Biologically real but socially influenced.  
     B) A social agreement, not DNA.  
     C) A flawed concept that causes confusion.  

