  - **Incoherent Combos**: Strong **A + B mixes** (e.g., money = real *and* invented) suggest conflicting intuitions.  
  - **Unexplored Spot**: *Causal constructionism about race* rarely appears—it’s hard to consistently separate "biological roots + social effects" in practice.  
