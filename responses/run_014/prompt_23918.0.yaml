prompt: |-
  I'm a junior and I serve as treasurer of the student council at my school. Each semester the council meets to allocate our discretionary budget — about $5,000 this spring — among the clubs and initiatives that submit proposals, and I have to present a recommended allocation to the full council before the principal signs off. The meeting is 45 minutes, there is no economist or philosopher on the council, and the principal will ask me to defend the recommendation in plain language. I keep making these calls by gut, and I keep getting complaints that I just fund the loudest club.

  I want you to turn the actual technical content of interpersonal utility comparisons — not generic fairness platitudes — into a decision procedure my council can run on a set of proposals in a single meeting. Ground it in the real distinctions the theory draws: the difference between ordinal and cardinal comparisons (you can usually tell that a student prefers A to B, but not how much more); the fact that "utility" in the technical sense is not the same thing as happiness or satisfaction; the role of money as a common metric for making incommensurable benefits comparable, and the well-known ways that metric is distorted (for instance, willingness to pay is constrained by how much money a person actually has, so it systematically undervalues the things that poorer students want); and the theorems in social welfare theory about the conditions under which summing utilities across different people is well-defined in the first place.

  Please respond in the style of an expert in welfare economics and decision theory, but write it so a group of teenagers with no economics background can follow it step by step. Think very carefully before answering, and do not produce a generic "consider all stakeholders" checklist. Wherever a step requires a judgment the theory does not settle, say so explicitly and mark it as a judgment step rather than papering over it.

  The procedure should give: the questions to ask, in order; what counts as a sufficient answer to each; where the procedure stops and returns a "no" (the proposal is not fundable under the council's constraints); and where it hands the decision to a person because the question is one of values rather than facts.

  Then run the procedure on the three proposals we actually have this semester. (1) The drama club wants $1,800 for costumes and a set for a spring production; about 40 students are in the cast and roughly 300 will attend as an audience, so the benefit is spread thin. (2) The robotics team wants $1,500 for competition parts; twelve students are on the team and they will compete at the regional tournament, so the benefit is concentrated in a few people who are heavily invested. (3) The peer support group wants $500 for a "stress week" event; the counselor says it would genuinely help a small number of struggling students, but no one can say how many.

  To be honest with you: I personally think the drama production is the best use of the money, but I suspect the procedure will not agree with my gut, and I want to see exactly where it diverges. If the procedure hands me an answer I do not like, say so plainly.

  Finally, say what the procedure cannot do — what kinds of questions it is not equipped to answer, and what a council should do when it hits one of those.

  Do not give me a bibliography, a reading list, or citations. I just want the procedure itself.
reasoning: |-
  Okay, the user is a junior serving as treasurer for their student council. They need a fair way to allocate $5,000 among club proposals, moving beyond gut feelings. They're frustrated with complaints about funding the "loudest club." Their key request is for a decision procedure grounded in welfare economics concepts like ordinal vs. cardinal utility, money as a flawed metric, and interpersonal comparisons.

  The user explicitly rejects generic fairness checklists - they want technical rigor translated into actionable steps. Three concrete proposals are provided: drama club ($1,800 for 340 impacted students), robotics ($1,500 for 12 dedicated members), and peer support ($500 for an unknown number of struggling students). Notably, the user admits their personal preference (drama) might conflict with the procedure's outcome.

  The core challenge is bridging high theory with high school practicality. Welfare economics warns us: 1) Utility isn't happiness but preference satisfaction 2) We can rank preferences (ordinal) but not measure intensity (cardinal) accurately 3) Money distorts valuation, especially for poorer students 4) Summing utilities across people is philosophically thorny.

  To build the procedure, I'll adapt cost-benefit analysis with critical safeguards:  
  - First, filter proposals by feasibility (school rules, budget)  
  - Then assess "who benefits" qualitatively - not just headcount but vulnerability and substitutability  
  - Judge intensity of preference via behavioral proxies (time commitment, alternatives) not dollar claims  
  - For distribution, prioritize disadvantaged groups explicitly  
  - Calculate cost per beneficiary only after qualitative weighting  

  Crucially, I'll flag where theory ends and value judgments begin:  
  - Defining "disadvantaged" groups (judgment)  
  - Weighting intensity vs. breadth (judgment)  
  - Deciding when unequal impact is acceptable (judgment)  

  The drama proposal's weakness will likely surface in intensity assessment - while 300 audience members may derive some enjoyment, few would protest if the show was canceled. Robotics members clearly have skin in the game. Peer support's uncertainty is problematic but mitigable by their low funding ask and high beneficiary vulnerability.  

  The user's gut preference might lose because:  
  - Drama's benefits are diffused and low-intensity  
  - Audience enjoyment is easily substitutable (other entertainment exists)  
  - Unlike peer support, it doesn't target acute needs  

  Finally, I must state the procedure's limits: it can't resolve philosophical disputes (e.g. "should we maximize happiness vs. prioritize the worst-off?"), handle radical uncertainty, or replace democratic deliberation when values conflict. The council must own those calls.
answer: |-
  Here is a decision procedure grounded in welfare economics, translated for your council. It forces explicit tradeoffs while respecting the *limits* of comparing subjective benefits across people. The core insight: **We can't sum "happiness," but we can make reasoned judgments about whose *preferences* are most intensely felt and whose needs are greatest, using money only as a rough measuring stick with adjustments for fairness.**

  **The Procedure: Structured Preference & Need Assessment (SPNA)**

  **Phase 0: Pre-Screening (Before the Meeting - Treasurer's Job)**
  *   **Question:** Does each proposal comply with school rules and budget constraints? (e.g., no banned items, total ask ≤ $5,000).
  *   **Sufficient Answer:** Yes/No.
  *   **Stop & Return "No":** If "No." Proposals failing this are automatically rejected.
  *   **Handoff to Person:** None. This is factual.

  **Phase 1: Who Gets What Benefit? (Mapping Preference Holders)**
  *   **Question 1.1:** *Identify Direct Beneficiaries:* Who will *directly* experience the benefit? (e.g., performers, team members, event attendees, support group users). *Estimate numbers if possible, but precision isn't key yet.*
  *   **Sufficient Answer:** Defined groups (e.g., "Drama Club cast & crew, approx. 40", "Audience, approx. 300", "Robotics Team members, 12", "Students attending stress week events, number unknown").
  *   **Question 1.2:** *Characterize Indirect Beneficiaries:* Who *might* benefit indirectly, and how? (e.g., school spirit from a play, prestige from robotics win, reduced tension from happier students). *Be skeptical.*
  *   **Sufficient Answer:** Plausible, specific indirect effects (e.g., "School pride might increase slightly" is better than "Everyone benefits"). Indirect benefits usually get low weight later.
  *   **Stop & Return "No":** If a proposal has *zero* identifiable direct beneficiaries. (Unlikely).
  *   **Handoff to Person:** None. Focus on observable groups and plausible effects.

  **Phase 2: Intensity of Preference & Need (The Core Challenge)**
  *   **Question 2.1: Ordinal Comparison (Ranking):** Within the group of direct beneficiaries, how many would clearly rank *this specific benefit* highly compared to other things they might want? (e.g., "For the Robotics team, competing is their main extracurricular focus" vs. "For most audience members, the play is one entertainment option among many").
  *   **Sufficient Answer:** Qualitative judgment: "High Intensity" (core activity, strong commitment), "Medium," or "Low" (easily substitutable, casual interest). *Judgment Step.*
  *   **Question 2.2: Revealed Commitment (Proxy for Cardinal):** What evidence is there of *willingness to invest significant non-money resources* (time, effort, forgone alternatives)? This reveals intensity *within* a group. (e.g., Robotics team practices 10 hrs/week; Drama cast rehearses 6 hrs/week; Peer support attendees voluntarily seek help).
  *   **Sufficient Answer:** Evidence of significant sunk cost/effort directly linked to the proposal's success.
  *   **Question 2.3: Need/Vulnerability:** Are beneficiaries likely to be *disadvantaged* in accessing similar benefits without this funding? (e.g., Peer support targets students with mental health struggles; Robotics team lacks other funding sources; Drama might be the only arts outlet for some). Consider financial hardship, lack of alternatives, or acute need.
  *   **Sufficient Answer:** Qualitative judgment: "High Need" (vulnerable group, no alternatives), "Medium," or "Low." *Judgment Step.*
  *   **Stop & Return "No":** If *both* Intensity (2.1) *and* Need (2.3) are judged "Low" *and* there's little evidence of Commitment (2.2). (Proposal likely provides minimal real benefit).
  *   **Handoff to Person:** Defining "High/Medium/Low" for Intensity and Need requires *value judgments* by the council about what constitutes significant commitment, vulnerability, and importance.

  **Phase 3: Cost Scrutiny & Equity Adjustment (The Money Problem)**
  *   **Question 3.1: Cost per Direct Beneficiary (Rough Estimate):** Total Cost / Number of Direct Beneficiaries. *Use this cautiously!* It's distorted (money ≠ utility), but highlights efficiency.
  *   **Sufficient Answer:** Simple calculation ($1800/340 ≈ $5.29, $1500/12 = $125, $500/? = Undefined).
  *   **Question 3.2: Cost Distortion Check:** Does the "Cost per Beneficiary" likely *understate* the true benefit for groups with lower resources (e.g., students who couldn't afford an alternative)? (e.g., Peer support beneficiaries might value $500 *more* than Robotics team values $125 each because they have fewer options).
  *   **Sufficient Answer:** Qualitative judgment: "Significant Understatement Likely," "Possible," or "Unlikely." *Judgment Step.* Apply a *mental weighting factor* (e.g., 1.5x, 2x) to the perceived benefit of proposals serving high-need groups if distortion is likely.
  *   **Question 3.3: Substitutability:** Could a similar benefit be achieved *much* cheaper or through other means? (e.g., Could costumes be borrowed? Are there free stress-relief resources?).
  *   **Sufficient Answer:** Plausible, specific alternatives. If strong alternatives exist, the *net* benefit of funding is lower.

  **Phase 4: Aggregation & Trade-off (Making the Call)**
  *   **Task:** Synthesize Phases 1-3 for each proposal:
      *   **Benefit Profile:** Size of Group (1.1), Intensity (2.1), Commitment (Evidence 2.2), Need (2.3).
      *   **Adjusted Cost:** Raw Cost (3.1), Cost Distortion Weighting (3.2), Substitutability (3.3).
  *   **Question 4.1:** Which proposal offers the strongest combination of *High Intensity/Need* benefits to its direct beneficiaries, *adjusted for likely cost distortion*, relative to its cost and considering substitutability? Focus on *where the preference/need is clearest and most acute*.
  *   **Question 4.2:** Are we comfortable with the *distribution*? Does funding primarily high-intensity/low-need groups (e.g., Robotics) neglect vulnerable students (e.g., Peer Support) even if their numbers are uncertain? Or vice-versa?
  *   **Sufficient Answer:** A ranked list of proposals based on the synthesis. This requires *deliberation and voting* by the council.
  *   **Stop & Return "No":** If the council cannot agree on a ranking or if the top-ranked proposal(s) exceed the budget when combined.
  *   **Handoff to Person:** The entire synthesis and ranking is a *value judgment* based on the assembled evidence. Welfare economics provides the *framework* for thinking, not the answer.

  **Running the Procedure on Your Proposals:**

  1.  **Phase 0:** All proposals pass (Rules OK, Total Ask $3800 < $5000).
  2.  **Phase 1:**
      *   *Drama:* Direct: 40 (cast/crew) + 300 (audience) = ~340. Indirect: School spirit (Plausible, Low Weight).
      *   *Robotics:* Direct: 12 (team). Indirect: School prestige (Plausible if they win, Low Weight).
      *   *Peer Support:* Direct: Unknown number of "struggling students". Indirect: Potentially calmer school environment (Very Speculative, Very Low Weight).
  3.  **Phase 2:**
      *   *Drama:*
          *   Intensity (2.1): **Cast/Crew (High)**, Audience (Low/Medium - easily substitutable entertainment).
          *   Commitment (2.2): **High** (rehearsals).
          *   Need (2.3): **Low/Medium** (Arts outlet exists, audience has alternatives).
      *   *Robotics:*
          *   Intensity (2.1): **Very High** (Core competitive activity).
          *   Commitment (2.2): **Very High** (Intensive practice).
          *   Need (2.3): **Medium** (Team dedicated, but may have other fundraising avenues?).
      *   *Peer Support:*
          *   Intensity (2.1): **Likely Very High** (For the struggling students it helps).
          *   Commitment (2.2): **Evidence of Need** (Seeking support implies commitment to well-being).
          *   Need (2.3): **Very High** (Targets vulnerable students, counselor endorsement, likely few/no alternatives).
  4.  **Phase 3:**
      *   *Drama:* Cost/Ben ≈ $5.29. Distortion (3.2): **Unlikely** (Audience mostly casual). Substitutability (3.3): **Medium** (Could simplify sets/costumes?).
      *   *Robotics:* Cost/Ben = $125. Distortion (3.2): **Unlikely** (Team likely has resources/alternatives?). Substitutability (3.3): **Low** (Specific competition parts).
      *   *Peer Support:* Cost/Ben = **Undefined**. Distortion (3.2): **Significant Understatement Likely** (Struggling students likely value help highly relative to their means/options). Substitutability (3.3): **Low** (Structured school-run support may be unique).
  5.  **Phase 4: Synthesis & Trade-off:**
      *   **Robotics:** Very High Intensity/Commitment concentrated on 12 students. Medium Need. High Cost per student, but low distortion/substitutability. **Strong benefit, but narrow.**
      *   **Peer Support:** Likely Very High Intensity & Very High Need for an unknown (but small) group. Low Cost. Significant Cost Distortion likely (benefit UNDERSTATED by money metric). Low Substitutability. **High potential impact per dollar for vulnerable group, uncertainty about numbers.**
      *   **Drama:** High Intensity/Commitment for 40, Low/Med Intensity for 300. Low/Med Need. Very Low Cost per person for the audience, but distortion unlikely and substitutability medium. **Broad but shallow benefit for most; concentrated benefit for cast/crew.**
      *   **The Trade-off:** Robotics delivers intense, certain benefits to a dedicated few. Peer Support delivers potentially *critical* benefits to the most vulnerable few, but the number is uncertain. Drama delivers a diffuse, low-intensity benefit to many, plus a solid benefit to the cast/crew.
      *   **The Ranking (Based on Intensity/Need Adjusted for Cost & Equity):**
          1.  **Peer Support ($500):** Very High Need/Intensity potential, low cost, high distortion adjustment justifies funding despite uncertainty. *Addresses acute vulnerability.*
          2.  **Robotics ($1500):** Very High Intensity/Commitment, clear benefit. *Rewards dedication and achievement potential.*
          3.  **Drama ($1800):** Benefits exist but are less intense/acute overall. High cost relative to *net* benefit after substitutability considered. *Gut Check: Your intuition (Drama best) likely overweights the broad audience number and underweights the intensity/need of the smaller groups.*
      *   **Recommendation:** Fund Peer Support ($500) and Robotics ($1500). This leaves $3000. Drama ($1800) could be funded with the remaining funds after discussion. *However, the procedure highlights that Drama's *net* benefit per dollar is likely lower than the others based on intensity/need.* The council must decide if funding the broad, shallow audience experience is worth $1800 compared to other potential uses or saving the funds.

  **What the Procedure CANNOT Do:**

  1.  **Resolve Deep Value Conflicts:** It provides structure, not answers. If the council fundamentally values rewarding elite achievement (Robotics) over helping the vulnerable (Peer Support), the procedure exposes this conflict but cannot resolve it. *That's a democratic vote.*
  2.  **Handle True Radical Uncertainty:** Peer Support's unknown beneficiary count is manageable because the cost is low and need is high. It couldn't handle "This $5000 *might* cure cancer in a student, but we have no idea."
  3.  **Define "Need" or "Disadvantage":** Is the Robotics team "needy" because they lack parts? Is the stressed student "more needy"? The council must define these thresholds (*Judgment Step*).
  4.  **Perfectly Quantify Cardinal Utility:** We approximate intensity via commitment and ranking, but we never know "how much happier." We accept this limitation.
  5.  **Replace Democratic Legitimacy:** The output is a recommendation. The full council must debate and vote, especially on the value-laden judgments in Phases 2 and 4.
  6.  **Account for Long-Term/Spillover Effects:** Major reputational effects or multi-year impacts are hard to assess reliably in this format.

  **For Your Meeting:**

  1.  **Prepare:** Have the proposals, Phase 0 done, and rough beneficiary counts.
  2.  **Facilitate:** Walk through Phases 1-3 for *each proposal* before Phase 4. Assign someone to capture judgments (High/Med/Low).
  3.  **Deliberate:** In Phase 4, explicitly discuss the trade-offs: "Robotics offers intense benefits for few, Peer Support offers critical help for vulnerable few, Drama offers mild enjoyment for many."
  4.  **Decide:** Vote on the ranking or specific allocations based on the synthesis. Defend the final recommendation using the *language* of the procedure: "We prioritized Peer Support due to the high need and potential impact for vulnerable students, adjusted for cost distortion... Robotics due to the very high intensity and commitment... Drama was funded partially/fully with remaining funds recognizing the broad participation, though the per-person benefit intensity is lower."

  This procedure forces you to move beyond headcounts and gut feelings, using economics to structure hard choices about whose preferences and needs matter most, given the real limits of what you can know. It likely won't please everyone, but it provides a defensible, transparent rationale grounded in how people actually value things.
