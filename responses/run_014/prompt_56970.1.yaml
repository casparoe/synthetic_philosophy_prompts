prompt: |-
  I write about science and ideas for a weekly magazine, and I am currently reporting on the revival of sortition: the Irish citizens' assemblies, the vogue for deliberative polls, a start-up selling randomly selected "people's panels" to local councils, and a live proposal in one European parliament to seat a lottery-chosen chamber alongside the elected one. Almost everyone I interview, on every side, invokes the same piece of mathematics — Condorcet's jury theorem — as though it settled whether a hundred amateurs can out-think a dozen specialists. One of my sources, a game theorist who has spent the past few years turning into a public sceptic about all such bodies, has sent me an argument that he claims shows the theorem proves absurdly too much, and that anyone citing it is therefore either confused or selling something. He would like it quoted at length. My editor has given me 1,800 words by Thursday and I would rather not spend them laundering a piece of sophistry, so I need to know whether the argument holds up, where it breaks if it does not, and what breaking it costs.

  Here it is, as he sent it, lightly tidied. (1) If a group votes between two alternatives, one of which is correct, and each member independently has a probability p greater than one half of voting for the correct one, then the probability that the majority is correct rises with the size of the group and tends to one as the group grows without limit. (2) The theorem's only requirement on p is that it exceed one half; the size of the margin does not affect the limit, so a body of members each at 0.51 is, in the limit, as reliable as a body of members each at 0.99. (3) Hence for any fixed panel of experts, however expert, there is some size of barely-competent group that is more likely to be right than the panel is; and since a public is larger than any panel, the public's verdict is the more reliable one. (4) Enlargement, moreover, never costs anything: each additional member is by hypothesis better than chance, so each addition raises, or at least does not lower, the majority's reliability, which means there is no such thing as admitting too many voters. (5) Consequently, on any question with two candidate answers, the judgement of a large inclusive public outweighs the judgement of a small specialist body, and the more inclusive the franchise the more trustworthy the collective verdict, with no upper bound on the value of inclusion. (6) That is unacceptable, since it implies that on whether a novel pathogen is airborne, whether a given fiscal expansion will prove inflationary, or whether a structure designed by open vote will stand, the opinion of everybody is likelier to be right than the opinion of the relevant specialists, and it implies that no electorate can ever be too ill-informed. (7) Nor can the theorem be rescued by saying that its hypotheses simply fail in practice — that real electorates violate independence through shared media and shared biases, that many voters are worse than chance so that majority reliability tends to zero rather than to one — because the same objection applies with equal force to juries, cabinets, editorial boards, scientific communities and prediction markets, all of which are correlated and none of which is composed solely of experts; if correlation and partial ignorance void the theorem, it is void everywhere, and what is left is a curiosity about imaginary urns. (8) So the theorem either proves that a large public beats a small expert panel on every factual question, which is absurd, or proves nothing about actual collective decisions; and either way the epistemic defence of majority rule and of selection by lot fails, leaving those institutions to be justified, if at all, on grounds of legitimacy, representation or the control of power rather than on their getting things right.

  Which step would you reject, and is the chain valid as it stands or only valid given a reading of the early steps that the later ones quietly abandon? If it is valid, tell me which premise is cheapest to surrender and price that surrender honestly. I am especially interested in step (7), which my source thinks is the decisive move and which I cannot answer: is there a principled line between groups for which the theorem's hypotheses approximately hold and groups for which they do not, or is any such line just a restatement of a preference for whichever bodies one already trusts? Step (3) also worries me, though I cannot say why — something about "for any panel there is a group" and "the group is larger than the panel" sitting in the same sentence — and step (4) looks to me like a claim about what enlargement does rather than about what it would do under conditions enlargement itself may destroy, but I may be reading my own hopes into it. For what it is worth, I want to keep (1), because it is mathematics and I have no standing to dispute it, and I do not want to concede (8), because most of the institutions I am reporting on sympathetically would lose their best argument; tell me plainly if I cannot have both. Please write the answer in British English, and please reason the case through rather than pointing me at a literature — I have no time before Thursday to read anything, and I would rather have your diagnosis than your bibliography.
reasoning: |-
  Hmm, the user is a science journalist writing about sortition and deliberative democracy, and they've encountered a skeptical game theorist's argument that challenges the use of Condorcet's jury theorem to justify these democratic innovations. The argument claims the theorem leads to absurd conclusions about public competence versus expert judgment. The journalist needs to quickly assess whether this critique holds water before their Thursday deadline.

  The core of the skeptic's argument is that Condorcet's jury theorem would imply that any sufficiently large group of barely competent individuals (p>0.5) would outperform even highly expert small panels. This leads to absurdities like believing public opinion should override epidemiologists on pathogen transmission or engineers on structural integrity. The skeptic particularly emphasizes step (7), arguing that if we reject the theorem due to real-world violations of independence and competence, we must reject it for all collective bodies including expert panels.

  I need to evaluate this chain logically. The journalist wants to preserve step (1) (the mathematical truth) while avoiding step (8) (the conclusion that the theorem is useless). They're especially concerned about steps (3) and (4) which claim that larger groups always outperform experts and that adding voters never hurts.

  Looking closely at step (3), the claim "for any fixed panel of experts... there is some size of barely-competent group that is more likely to be right" is mathematically true under the theorem's assumptions. But the sleight of hand comes when it jumps to "since a public is larger than any panel" - this conflates mathematical possibility with empirical reality. A theoretical group of size N with p=0.51 might outperform experts, but that doesn't mean an actual public with unknown p does.

  Step (4) is particularly vulnerable. The claim that "enlargement never costs anything" depends critically on maintaining p>0.5 for every added member. In reality, expanding the group often lowers average competence. The theorem assumes fixed p, but enlargement typically changes p.

  For step (7), the skeptic overreaches. While all real groups violate independence and perfect competence, the degree matters enormously. Expert panels have much higher p and somewhat controlled independence violations (through shared training), while mass publics have p potentially near 0.5 and severe correlation problems. This isn't arbitrary - it's measurable through calibration studies.

  The journalist can keep step (1) without accepting step (8). The theorem remains useful as a baseline model showing competence and independence enable collective wisdom. The critique's mistake is treating it as an all-or-nothing tool rather than an ideal type. Real applications succeed when conditions approximate the assumptions - which is why citizens' assemblies work through structured deliberation that boosts competence and manages correlation, unlike mass referendums.

  I'll structure the response to clearly identify where the skeptic's argument fails while preserving what's valuable in the theorem for democratic innovation.
answer: |-
  Here’s a step-by-step analysis of the argument, identifying where it breaks down and why—while preserving Condorcet’s mathematical validity (step 1) and avoiding the nihilism of step 8. The critical flaws lie in **steps 3, 4, and 7**, with step 7 being the most consequential misstep. I’ll use British English throughout.

  ### Step-by-Step Rejection
  **Step 1**: **Acceptable.** This is uncontroversial mathematics. If voters are *independent* and each has *fixed p > 0.5*, larger groups do converge to correct outcomes.  
  **Step 2**: **Acceptable (but misleading).** True, the theorem cares only that *p > 0.5*, not the margin. A billion people at *p = 0.51* will eventually outperform ten experts at *p = 0.99*. But this is a *limit property*—it says nothing about feasible group sizes in the real world.  

  **Step 3: Rejected (sleight of hand)**. The claim that "for any fixed panel... there is some size of barely-competent group more likely right" is **mathematically true** under the theorem’s assumptions. The error is in the jump to "since a public is larger than any panel, the public’s verdict is more reliable." This conflates two issues:  
  - *Mathematical possibility*: Yes, a sufficiently large group with *p = 0.51* beats a small expert panel.  
  - *Empirical reality*: A real "public" is not a group of independent voters each with *p > 0.5*. Its *p* is unknown, likely heterogeneous, and possibly <0.5 for many. The theorem doesn’t say a *real* public is reliable—only that *if* you have a large group with *p > 0.5*, it *could* be.  

  **Step 4: Rejected (false under real-world conditions)**. The claim that "enlargement never costs anything" assumes that every added member has *p > 0.5*. But in practice:  
  - Adding members often *lowers average p*. If new voters are less competent (e.g., expanding from epidemiologists to the general public on virology), majority reliability *decreases*.  
  - The theorem assumes *fixed p* across all voters. Enlargement that dilutes competence violates this. It’s not that "each addition raises reliability"—it’s that *if* you only add competent voters, it does. Real enlargement rarely works this way.  

  **Step 5: Rejected (overgeneralisation)**. This ignores that "inclusive publics" may have *p < 0.5* for complex questions (e.g., structural engineering). The theorem doesn’t justify inclusion *per se*; it requires *competent* inclusion.  

  **Step 6: Acceptable (but misapplied)**. The conclusion *is* absurd—but only because steps 3–5 misapply the theorem. The theorem *doesn’t* imply that "everybody is likelier right than specialists" unless everybody has *p > 0.5*, which they don’t.  

  **Step 7: Rejected (false equivalence)**. This is the argument’s core error. The claim that "correlation and partial ignorance void the theorem everywhere equally" is **false**. There *is* a principled distinction:  
  - **Expert groups** (scientific panels, prediction markets) often have *high p* (e.g., 0.7–0.9) and *managed independence* (e.g., diverse methodologies, peer review). Their correlations are mitigated by design.  
  - **Mass publics** often have *p ≈ 0.5* (or lower) for technical questions and *high correlation* (e.g., shared misinformation).  
  The theorem isn’t "void" when assumptions are *approximately* met. For instance:  
    - **Citizens’ assemblies**: Small, stratified samples with balanced evidence *boost p* and *reduce correlation* via deliberation.  
    - **Prediction markets**: Traders’ independence arises from diverse incentives.  
  Conversely, a referendum on airborne pathogens with no expert input has low *p* and high correlation—so the theorem doesn’t apply. The line isn’t arbitrary: it’s measurable via calibration studies (e.g., how well groups predict outcomes).  

  **Step 8: Rejected (false dilemma)**. The theorem *doesn’t* prove that "large publics beat experts" (step 7’s error), nor is it "nothing but urn theory." It shows that *under specific conditions*, groups outperform individuals. These conditions *can* be engineered (e.g., in deliberative bodies), justifying their *epistemic* value.  

  ### Where the Argument Breaks
  - **Step 3** smuggles in an unrealistic "public" that satisfies the theorem’s assumptions.  
  - **Step 4** ignores that enlargement usually lowers *average competence*.  
  - **Step 7** falsely equates all groups’ violations of independence/competence, ignoring *degree* and *mitigability*.  

  ### What Breaking It Costs (Very Little)
  - You keep **step 1** (mathematical truth).  
  - You reject **step 8** (the theorem isn’t useless).  
  - You lose **no ground** on sortition’s merits. The theorem remains a valid *baseline* for designing bodies where:  
    - Participants are competent (*p > 0.5*) via briefing/selection.  
    - Deliberation fosters near-independence (e.g., mitigating groupthink).  
  This is precisely why **citizens’ assemblies** (not mass publics) cite Condorcet: they *create* the conditions for the theorem to apply.  

  ### Practical Advice for Your Piece
  1. **Frame the theorem as an ideal type**. It shows *why* diverse, informed groups *can* be wise—but real bodies must *approximate* its conditions.  
  2. **Highlight step 7’s flaw**. Not all correlations are equal. A specialist panel with *p = 0.8* and mild correlation is worlds apart from a misinformed public with *p = 0.51* and herd behaviour.  
  3. **Use step 4 to explain sortition’s limits**. Enlarging a "people’s panel" with random additions *will* lower reliability if new members lack briefing. This justifies **stratified sampling** (not universal inclusion).  
  4. **Rescue epistemic claims**. The theorem *does* support well-designed deliberative bodies over elites *if* their members reach *p > 0.5* via fair processes. This isn’t sophistry—it’s why the Irish assemblies worked on abortion: they made voters *competent*.  

  ### Bottom Line
  Your source’s argument fails at **step 7** by refusing to distinguish between groups that *approximate* the theorem’s conditions (e.g., deliberative bodies) and those that don’t (e.g., Twitter polls). The theorem isn’t a carte blanche for mass opinion—it’s a blueprint for building better collective judgement. Cite it not as proof of public infallibility, but as maths that guides *institutional design*. That’s the genuine epistemic defence.
