prompt: |-
  I've been keeping a list of my gut verdicts about when a person is morally responsible for what they do, and I'd like to know whether any single principle captures them, or whether some of them have to go. Here are the verdicts.

  1. A man has four drinks, decides he is fine to drive, and kills a cyclist. Fully blameworthy — for the death, not just for the drinking.
  2. A bank teller hands over the vault combination because a robber is holding a gun to her son's head. Not blameworthy at all.
  3. A woman raised from childhood in an isolated cult, with every one of her information sources controlled, steals her family's savings for the leader. Not blameworthy, or nearly not.
  4. A man raised in terrible conditions by negligent parents mugs a stranger. Blameworthy, though somewhat mitigated.
  5. Another man is secretly administered a drug that produces in him an overwhelming desire to harm a neighbor, which he experiences as fully his own; he acts on it. Not blameworthy.
  6. The same man, tumor removed, later mugs a stranger out of ordinary greed. Fully blameworthy again. What changed between these two muggings was a medical fact about his brain, and it changed everything.
  7. A long-term heroin addict who wants to quit but relapses and steals to get the next dose. I go back and forth on this one.
  8. A scientist wins a major prize for work that depended on unusual intelligence, curiosity, and stamina, none of which she chose or earned. I want to say she deserves the prize and the honor. But the same reasoning that clears the manipulated man in 5 seems to say she doesn't deserve the qualities that produced the work.

  The pair I can't reconcile is 4 and 5. In both cases, the agent's desire to harm was fixed by factors outside his control — genes and upbringing in the one, a drug in the other — and in both cases the desire felt like his own. Yet my verdicts differ sharply, and I don't seem to believe that the difference is just the rarity of the causal route. A friend suggested that instead of asking whether free will exists, I should ask which of these verdicts is worth keeping, since that tells me what kind of control I actually care about — the kind of freedom worth wanting — and that the principle I'm looking for should be read off those verdicts rather than off metaphysics.

  So, please: state a principle, or a small set of candidates, as precisely as you can, that delivers or nearly delivers these verdicts, and identify which clause is motivated by which case. Then tell me what it says about the cases I haven't listed: the psychopath who knows the moral rules perfectly well but cannot feel their force; the person who, after a sudden brain injury, becomes selfish in ways he endorses and reports he prefers; and an artificial agent whose values were deliberately engineered by its makers, which behaves impeccably and insists it cares. Finally, be honest about which of my verdicts your principle cannot accommodate, and whether the friend's suggestion — keeping the verdicts and letting them define the freedom worth wanting — is stable, or whether some verdict, once I see what it costs to keep, should be given up instead.
reasoning: |-
  Okay, let me try to unpack this user's query. They've listed several scenarios where they judge moral responsibility and want a unifying principle. The key challenge is reconciling cases 4 and 5—both involve external factors shaping desires, yet the verdicts differ. 

  First, I need to understand why the user sees a contradiction. In case 4, the mugger with a bad upbringing is still blameworthy, while in case 5, the drugged man isn't. Both had desires shaped beyond their control, but the user feels one is responsible and the other isn't. The friend's suggestion about focusing on what control we care about seems crucial here.

  Looking at the cases, patterns emerge. Cases like 2 and 3 involve coercion or extreme manipulation, leading to no blame. Cases 1 and 6 show clear responsibility. The addict in case 7 is tricky—maybe partial blame because they resist sometimes? The scientist's desert in case 8 conflicts with the manipulated man's excuse. 

  The Principle of Reasons-Responsiveness comes to mind. It focuses on whether the person could have recognized and acted on moral reasons. The drugged man (5) couldn't resist the impulse, so no blame. The mugger (4), despite his upbringing, still had some capacity to understand wrongness. That explains the difference. 

  For the scientist (8), the principle separates deserving praise from deserving traits. She's praiseworthy for using her gifts responsibly, even if she didn't earn the gifts. The addict (7) might have diminished responsibility because addiction impairs reasons-responsiveness, but not entirely if they had moments of choice.

  Applying it to unlisted cases: the psychopath knows rules but can't feel their force—maybe not blameworthy if they truly lack moral understanding. The brain injury patient who becomes selfish—if the injury destroyed their ability to grasp moral reasons, no blame. The engineered AI that acts morally—praiseworthy because it responds correctly to reasons, regardless of origin.

  But there's tension. Case 4's mugger might have very limited reasons-responsiveness due to upbringing. The user might need to accept mitigated blame here. Also, the scientist's case highlights that we praise responsible use of unchosen traits, which might require accepting that "desert" applies to actions, not inherent worth.

  The friend's approach—letting verdicts define the freedom worth wanting—is practical. It avoids metaphysical debates and focuses on what matters for responsibility practices. But the user must decide if they can accept reduced blame for the mugger (4) if his upbringing severely damaged his moral capacity.

  In conclusion, Reasons-Responsiveness fits most cases, but the user might need to adjust verdict 4 or clarify the level of mitigation. The stability comes from aligning with our practices of holding people accountable based on their ability to respond to moral reasons.
answer: |-
  Based on your verdicts, the most promising principle is the **Principle of Reasons-Responsiveness**:

  **An agent is morally responsible for an action if and only if:**
  1.  **They possess the general capacity to recognize and respond to moral reasons;** and
  2.  **This capacity was sufficiently operative in the specific choice leading to the action, such that they could have recognized the relevant moral reasons and chosen/acted otherwise in response to them under the circumstances.**

  **How it captures your verdicts:**

  *   **1 (Drunk Driver):** Satisfies both clauses. He possesses the general capacity (1) and it *was* operative (2) – he made a reckless *choice* while impaired but not utterly incapacitated. His impairment is blameworthy but doesn't negate the operation of his capacity at the time of the driving decision.
  *   **2 (Bank Teller):** Fails clause (2). While she possesses the general capacity (1), the extreme duress (gun to son's head) severely compromised her ability to recognize/respond to moral reasons *in that specific moment*. Her choice was effectively compelled.
  *   **3 (Cult Member):** Likely fails clause (1). Her lifelong, extreme indoctrination and information control likely prevented the *development* of the general capacity to recognize and respond to independent moral reasons. She lacks the foundational capacity.
  *   **4 (Mugger with Bad Upbringing):** Satisfies clause (1) – he possesses the general capacity (he understands property, harm, rules, even if poorly internalized). Clause (2) is *partially operative but significantly impaired*. His choice reflects his warped values, but he *could* have recognized the wrongness and chosen differently (though it was much harder). Hence, blameworthy but mitigated. *(Motivated by preserving blameworthiness)*
  *   **5 (Drugged Man):** Fails clause (2). While he possesses the general capacity (1), the overwhelming, artificially induced desire utterly bypassed his capacity to recognize/respond to moral reasons *in that specific instance*. The desire "felt like his own" but its origin and intensity destroyed his normal reasons-responsive control.
  *   **6 (Same Man, Tumor Removed):** Satisfies both clauses. The medical intervention restored his general capacity (1) and it is now operative in his choices (2). His greed is ordinary and responsive to reasons (e.g., fear of punishment, empathy he *could* access).
  *   **7 (Addict):** **Ambiguous under this principle.** Mitigation depends on the *degree* to which addiction impairs the operation of clause (2) *during the specific act of stealing*. Does craving overwhelm their ability to recognize/respond to reasons against stealing? Or is there a window where capacity is still operative, making resistance difficult but possible? Your back-and-forth reflects this inherent ambiguity in addiction's impact on control.
  *   **8 (Scientist):** **Accommodated with a distinction:** She is *praiseworthy* for her *responsible exercise* of her capacities (clauses 1 & 2 were operative in her sustained, diligent work). However, the *basis* for her praise (intelligence, curiosity, stamina) are unchosen gifts. The principle separates responsibility/praiseworthiness *for the action* (which she exhibits) from "desert" *for the underlying traits* (which she lacks, as per your reasoning). We praise the *use* of the gifts, not the gifts themselves.

  **Reconciling 4 & 5:** The key difference is the *operation of the capacity in the specific instance* (clause 2). The mugger (4) *could* have recognized the moral reasons and chosen differently, though it was hard due to his upbringing. The drugged man (5) *could not* have recognized/responded to reasons *at that moment* due to the overwhelming, externally induced impulse. Upbringing shapes *how* the capacity operates; the drug *temporarily destroyed* its operation for that specific act. You care about the real-time capacity for control, not just the origin of desires.

  **Applying to New Cases:**

  1.  **The Psychopath:** Likely **not blameworthy** (or significantly diminished). If they *truly* lack the capacity to *feel* or *internally grasp* the force of moral reasons (clause 1 fundamentally impaired), even if they *know* the rules intellectually, they fail clause (1). Their "understanding" is purely cognitive/cost-benefit, lacking the essential connection to motivation that constitutes recognizing moral *reasons*.
  2.  **Sudden Brain Injury (Selfishness):** Likely **not blameworthy** for new selfish acts. If the injury directly caused the fundamental change in values/personality he now endorses, it likely destroyed or severely damaged his *prior* general capacity for moral reasons-responsiveness (clause 1). He now lacks the capacity he once had. (Similar to tumor/drug cases).
  3.  **Engineered AI:** **Praiseworthy** (if its behavior is impeccable). It demonstrably *does* recognize and respond correctly to moral reasons (clauses 1 & 2 are satisfied in its functioning). The *origin* of its values is irrelevant to its current reasons-responsiveness, just like the scientist's unchosen intelligence. We care about the reliable operation of the capacity, not its metaphysical origins.

  **Where the Principle Struggles & Costs:**

  *   **Case 4 (Mugger):** This is the biggest tension. The principle *requires* attributing at least *some* operative capacity for recognizing/responding to reasons to preserve blameworthiness. If the upbringing was *so* brutal and all-encompassing that it truly destroyed the *general capacity* (clause 1), akin to the cult member (Case 3), the principle would say *not blameworthy*. Your verdict of mitigated blame suggests you believe *some* capacity remains, however stunted. **Cost:** You must accept that the mugger, despite terrible luck, retained *some* fragment of the crucial capacity for control at the moment of action. If you can't accept *any* blameworthiness for someone with such an upbringing, Case 4 must be revised.
  *   **Case 7 (Addict):** The principle doesn't definitively resolve the ambiguity; it highlights why it *is* ambiguous. Resolving it requires a specific (and contested) view of how addiction impacts real-time control.
  *   **Case 8 (Scientist):** The principle cleanly delivers praiseworthiness for the *action*, but it explicitly decouples this from "desert" for the underlying traits. You must accept that "desert" applies to the responsible *use* of capacities, not to the unchosen capacities themselves. If you feel the scientist *deserves* her traits, the principle conflicts.

  **On Your Friend's Suggestion:**

  *   **Stability:** The "freedom worth wanting" approach defined by your considered verdicts (using Reasons-Responsiveness) is **largely stable and practical**. It focuses on the kind of control necessary for holding people accountable within our moral and legal practices, sidestepping intractable metaphysical debates about ultimate origins. It explains *why* coercion, manipulation, incapacity, and compulsion undermine responsibility, aligning with core moral intuitions.
  *   **Cost of Stability:** The stability comes at the cost of potentially **revising Case 4** if you conclude the upbringing destroyed the capacity entirely (though your verdict suggests you don't), and **accepting ambiguity in Case 7**. It also requires accepting that "desert" for actions is distinct from "desert" for traits (Case 8). The biggest potential revision is recognizing that **mitigation in Case 4 might need to be more substantial** if the capacity was *severely* impaired.
  *   **Should a Verdict Be Given Up?** Your verdicts are largely coherent under Reasons-Responsiveness. The verdict most under pressure is **Case 4**. If scrutiny reveals you believe the mugger truly *lacked any capacity* to recognize/respond to reasons (making him like the cultist), you *should* give up the "blameworthy" verdict. However, your description ("somewhat mitigated") strongly suggests you believe *some* capacity remained, so Case 4 can likely stand. Case 7 might remain unresolved, reflecting the true complexity of addiction.

  **Conclusion:** The Principle of Reasons-Responsiveness captures the vast majority of your verdicts and provides a coherent framework for the new cases. It reconciles 4 and 5 by focusing on the real-time operation of the capacity for moral control during the specific act. The cost of keeping your verdicts is accepting that Case 4 implies *some* residual capacity for control despite terrible luck, and that praiseworthiness (Case 8) is for the *exercise* of capacities, not the capacities themselves. Your friend's suggestion is sound: this principle defines the "freedom worth wanting" for moral responsibility, grounded in your practical judgments rather than metaphysics. Case 4 is the linchpin; if it holds, the system is stable.
