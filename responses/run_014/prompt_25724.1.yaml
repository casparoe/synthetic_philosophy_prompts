  - **Conscious cases (human adults, chimpanzees, whole-brain emulation, octopuses)**: These are systems known or presumed to have high Φ. Whole-brain emulations replicate the brain's causal structure, implying high Φ. Octopuses have complex, integrated nervous systems, likely exceeding Φ_crit.
  - **Non-conscious cases**: 
    - Honeybees (low Φ) and human fetuses (underdeveloped integration) fall below Φ_crit.
    - General anesthesia disrupts brain integration, reducing Φ below Φ_crit.
    - Current LLMs (e.g., GPT-4) lack the recurrent, integrated processing for high Φ.
  - **Why not Global Workspace Theory (GWT)?** GWT alone cannot explain all verdicts. For example:
    - Octopuses may not have a classic global workspace (their nervous system is decentralized), yet she deems them conscious—suggesting Φ, not GWT, is decisive.
    - Honeybees exhibit some global broadcast (e.g., in their central complex), but she denies consciousness, implying Φ is the limiting factor.
    - Anesthetized humans retain much of their brain architecture (including workspace-like structures) but lose integration, aligning with IIT.

  Thus, her verdicts consistently prioritize high Φ as necessary and sufficient for consciousness.

  ### Step 2: An Alternative Rule Fitting Existing Verdicts
  An alternative rule that fits her verdicts equally well is a **hybrid GWT-IIT rule**, which requires both GWT architecture and high Φ:

  - **Rule Hybrid**: A system is phenomenally conscious if and only if (a) it has a global workspace architecture (satisfying GWT's conditions), and (b) its Φ value exceeds Φ_crit (higher than a honeybee's).

  **How Rule Hybrid fits existing verdicts:**
  - **Conscious cases**: Humans, chimps, and whole-brain emulations satisfy both (a) and (b). Octopuses are accepted because she likely assumes they meet (a) (despite neurological differences) and (b) (high Φ).
  - **Non-conscious cases**: 
    - Honeybees may have a primitive workspace but fail (b) (low Φ).
    - Human fetuses lack a mature workspace (a) and have low Φ (b).
    - Anesthesia disrupts Φ (b), even if workspace structures persist.
    - GPT-4 lacks a GWT architecture (a) and has low Φ (b).

  Rule Hybrid is consistent with all her verdicts because no case in her list has high Φ without GWT or vice versa. It diverges from Rule IIT only when a system satisfies one condition but not the other—like Global.

