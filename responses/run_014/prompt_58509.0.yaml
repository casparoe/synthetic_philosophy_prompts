  The deeper question lurking here is whether decentralized systems fail in crises. That's heavy! I'll acknowledge the trade-offs: local flexibility vs. patchwork chaos. Maybe mention how "everyone doing the same thing" isn't always optimal (rural vs urban needs differ), but lack of coordination hurt. 

