  Okay, let me start by unpacking the journalist's question. They're working on a piece about the probability of conditionals and are confused about Lewis's triviality result versus the suppositional theory. They thought Lewis's result was a knockout blow against equating P(if A then B) with P(B|A), but they keep seeing suppositional theorists defending exactly that. So they're wondering if the suppositional theory is ignoring Lewis, if there's a loophole, or if the two sides are talking past each other.

  First, I need to recall Lewis's 1976 result. From what I remember, Lewis showed that if you assume P(if A then B) = P(B|A) for all A and B in a probability space, and if this holds under any conditioning, then it leads to triviality—only very simple probability distributions can satisfy this, which isn't realistic. The key here is that Lewis's proof requires the equality to hold even after conditionalizing on other events. That might be where the issue lies.

  Now, the suppositional theory, associated with Adams and Edgington, argues that indicative conditionals don't have truth values. Instead, their probability is given by P(B|A). But since they're not propositions, they don't fit into the standard probability framework in the same way. So perhaps the suppositional theory avoids Lewis's result by denying that conditionals are propositions that can be embedded in other logical structures. Lewis's proof assumes that conditionals are propositions with truth conditions, which is what the suppositional theory rejects.

  The journalist’s confusion might stem from the difference between treating conditionals as truth-apt versus non-truth-apt. If conditionals aren't propositions, then assigning them probabilities directly doesn't apply, so Lewis's argument doesn't get off the ground. The suppositional theory redefines the probability of a conditional as the conditional probability, but without claiming it's a standard probability. Instead, it's more about assertability or acceptability under supposition.

  Another angle is the application context. Lewis's triviality arises when you embed conditionals in complex sentences, like negations or conjunctions. The suppositional theory often restricts conditionals to simple, non-embedded uses. So in everyday reasoning, where conditionals aren't nested, the suppositional approach works fine. But Lewis's result shows problems in more complex logical structures.

  I should also consider Adams's work, which uses probabilistic validity instead of truth-conditional validity. Arguments involving conditionals are valid if preserving high probability, not truth. This bypasses Lewis's issue because it doesn’t require conditionals to be part of the propositional algebra.

  The journalist needs to understand that the two theories operate in different frameworks. Lewis assumes a truth-conditional approach, leading to triviality when equating probabilities. The suppositional theory avoids this by rejecting truth conditions, thus sidestepping the problem. So the suppositional theory is still viable but with limitations on embedding.

  Also, the "closure under conditioning" part: Lewis showed that if P(A→B) always equals P(B|A), then after learning new evidence, the updated P might not maintain this equality unless the space is trivial. The suppositional theory doesn't require the conditional to be a proposition that gets updated that way. Instead, the probability is dynamic and recalculated based on current beliefs.

  So, to answer the journalist: Lewis's result rules out the equation only if conditionals are truth-apt and can be freely embedded. The suppositional theory denies these premises, making it a live option by changing the framework. They're not ignoring Lewis; they're operating outside the assumptions that lead to triviality.
answer: |-
  I completely understand your frustration—Lewis's triviality results are notoriously tricky, and the debate around the suppositional theory can feel like wading through philosophical quicksand. Let me break this down in plain English, step by step, so you can navigate this for your piece. The short answer is: **Lewis's result does not kill the suppositional theory because they're operating in fundamentally different frameworks.** The suppositional theory isn't ignoring Lewis; it's sidestepping his assumptions. Here's why:

  ### 1. **Lewis's Triviality Result: What It Actually Says**
     - **The Core Claim**: Lewis (and others, like Hájek) proved that you **cannot consistently equate** \(P(\text{if } A \text{ then } B)\) with the conditional probability \(P(B|A)\) *if* you treat conditionals as ordinary propositions with truth values that fit into standard probability logic.
     - **The Killer Assumption**: Lewis assumed that conditionals like "if A then B" express **objective, truth-apt propositions** (i.e., they can be true or false in the world). Under this assumption:
       - The probability function must be "closed under conditioning": learning new evidence (via conditionalization) shouldn't break basic rules of probability.
       - But Lewis showed: if \(P(A \rightarrow B) = P(B|A)\) *always* holds for *all* A, B, and *all* probability distributions, then the only possibility is a "trivial" probability space (e.g., where all probabilities are 0 or 1, or where A and B are logically dependent in absurd ways). This makes the equation useless for real-world reasoning.
     - **The Punchline**: If conditionals are ordinary propositions, equating their probability with conditional probability forces irrationality. Example:
       - Suppose you start with \(P(\text{if } A \text{ then } B) = P(B|A) = 0.6\).
       - You learn \(\neg B\) (B is false). After updating your beliefs (conditionalizing on \(\neg B\)), \(P(B|A)\) might now be 0.
       - But \(P(\text{if } A \text{ then } B)\) might *still* be high if A is now unlikely! This violates probability axioms if conditionals are truth-apt.

  ### 2. **The Suppositional Theory: A Different Beast**
     - **Key Advocates**: Dorothy Edgington, Ernest Adams, and others.
     - **Core Idea**: Indicative conditionals (e.g., "If it rains, the match is canceled") **do not express truth-apt propositions**. They aren't about how the world *is*, but about how we *suppose* it might be.
       - Instead, the probability of "if A then B" is *defined as* \(P(B|A)\). Full stop.
       - This is not a claim about truth conditions—it's a claim about **rational commitment** or **assertability**. For example:
         - Saying "I believe 'if A then B' with confidence 0.8" just means "Given A, I believe B with confidence 0.8."
     - **Avoiding Lewis's Trap**: The suppositional theory rejects Lewis's starting assumptions:
       - **No truth values**: Conditionals aren't propositions, so they don't have probabilities in the standard sense. \(P(B|A)\) isn't the probability *of a thing*; it's a measure of *reasoning under supposition*.
       - **No embedding**: Conditionals can't be freely embedded in complex logical structures (e.g., "If 'if A then B' then C"). This is crucial because Lewis's proof relies on embedding conditionals in other operators (negation, conjunction, etc.).
       - **No closure under conditioning**: Since conditionals aren't propositions, they aren't "learned" in the way facts are. When you get new evidence, you simply recalculate \(P(B|A)\) with your updated beliefs. There's no inconsistency because the conditional itself isn't a fixed object in the probability space.

  ### 3. **Are They Talking Past Each Other? Absolutely.**
     - **Lewis's Target**: He was attacking the **truth-conditional view** of conditionals (e.g., Stalnaker's logic), which tries to assign truth values to "if A then B." His result shows this view *cannot* equate probability and conditional probability without collapsing.
     - **Suppositionalists' Defense**: They agree! Their response is: "We never claimed conditionals *have* truth values. Lewis's result is irrelevant to us because we're not playing the same game."
       - As Edgington puts it: "The probability of a conditional is not the probability that it is true."

  ### 4. **Is the Suppositional Theory a "Live Option"? Yes—But With Caveats**
     - **Strengths**:
       - It captures how we *use* conditionals in everyday reasoning (e.g., in science: "If theory T is true, we observe X" is assessed via \(P(\text{observation X} | \text{theory T})\)).
       - It avoids paradoxes like Lewis's while explaining why we intuitively link conditionals to conditional probabilities.
       - It's empirically grounded: psychological studies (e.g., by Phil Johnson-Laird) show people naturally judge the probability of "if A then B" as \(P(B|A)\).
     - **Weaknesses**:
       - **Embedding Problem**: It struggles with nested conditionals (e.g., "If 'if A then B' then C"). Suppositionalists often say such constructions are "grammatical but nonsensical" in natural language.
       - **Limited Scope**: It only works for indicative conditionals (e.g., "If it rained, the grass is wet"), not subjunctives ("If it had rained, the grass would be wet").
       - **Radical Revision**: Rejecting truth values for conditionals is a big philosophical pill to swallow. Critics (like van Fraassen) argue it makes logic "incomplete."

  ### 5. **Plain-English Summary: What's the State of Play?**
     - **Lewis's Result Rules Out**: Treating conditionals as *truth-bearing propositions* whose probability is *always* identical to conditional probability. If you do this, probability theory implodes.
     - **Suppositional Theory Survives**: By denying that conditionals *are* propositions, it defines their probability directly as \(P(B|A)\). This isn't refuted by Lewis—it's a different paradigm.
     - **The Debate Today**: Both views coexist. Truth-conditional theorists (e.g., Robert Stalnaker) tweak their systems to avoid triviality (e.g., allowing \(P(A \rightarrow B) \approx P(B|A)\) in context). Suppositionalists dominate psychology and experimental philosophy. **Neither is a "corpse"—they're tools for different jobs.**

  ### Key Takeaway for Your Piece
  Lewis's result isn't a "knockout blow" against the suppositional theory—it's a proof that *one specific approach* (truth-conditional + probabilistic) fails. The suppositional theory thrives precisely because it rejects Lewis's premises. When you hear "P(if A then B) = P(B|A)," always ask: **Is this a claim about truth, or a definition of rational supposition?** That's the fault line.

  If you dive deeper, look at:
  - Adams's (1975) work on "probabilistic validity" (arguments preserve high probability, not truth).
  - Edgington's (1995) *Mind* paper for a suppositionalist manifesto.
  - Hájek's (2011) "Triviality Pursuit" for modern refinements of Lewis.

  This is a live, nuanced debate—your readers will appreciate clarity on why both sides still have skin in the game! If you have a specific example you're wrestling with, I'm happy to help untangle it.
