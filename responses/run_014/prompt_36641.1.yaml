prompt: |-
  Something about how frontier model evaluations are done has been bugging me philosophically and I want someone to untangle what the practice actually presupposes. The setup, roughly: when a big AI model gets evaluated before release, the numbers that get reported are bascially average-case. The model gets run through a fixed suite of tasks plus some red-teaming, and what comes out is stuff like "resisted 98% of jailbreak attempts" or "performed at such-and-such level on the biosecurity uplift eval". Percentages, pass rates, means over a sampled distribution of propmts and attacks. But the decisions made on the basis of these evals are worst-case in flavour: if a single run crosses a dangerous-capability threshold, or if one jailbreak reproduces reliably, that can be treated as disqualifying no matter how rare it is under normal use, and the whole threat modelling exercise is built around imagining a determined adversary who keeps sampling and adapting until they get lucky. So the same institution measures one way and decides the other way, and I genuinely can't tell whether that's a principled combination or just two teams with two different vibes. What view of risk, or of evidence, does this practice presuppose? Is it something like a maximin stance where you act on the worst case, and if so how do the average numbers earn their keep at all — as a proxy for how bad the worst case is, as a bound on it, or as window dressing? Is the underlying picture closer to civil engineering, where you compute average loads and then slap on safety factors, or to cryptography, where a single workable attack kills the scheme outright? Those seem like pretty different epistemologies to be smuggling into one process. There's also the flip side, which some people in the field raise: if you take the worst case seriously enough, you can always find some adversarial prompt that degrades the model if you try hard enough, so the worst case is essentially always "the model fails" and the decision procedure collapses into refusing to deploy anything. If that's right, does the practice secretly rely on an informal notion of a plausible, bounded adversary — a threat model that never gets explicitly stated? Please reconstruct the implicit theory here, tell me which rival views of risk it quietly rules out (for instance a pure expected-value view, on which a rare capability that only shows up 0.1% of the time could just be priced into a risk budget rather than treated as disqualifying), and say where the practice is philosophically underdetermined, so that several different theories would license the exact same behaviour. And tell me what would actually have to change procedurally if the expected-value view were adopted instead — would the pass/fail capability thresholds go entirely, and what would replace them? Please write in British English, and no formatting at all: no headings, no bullet points, no bold, no tables — just continuous prose like a long email. As you go, flag how confident you are in the big claims, and at the end single out the one point you're least sure about.
reasoning: |-
  Okay, let me try to unpack this user's query about AI model evaluations. They're pointing out a tension between how evaluations are done (average-case metrics) versus how decisions are made (worst-case triggers). I need to figure out the philosophical underpinnings here.

  First, I recall that in AI safety, red-teaming often looks for any single failure as grounds for concern, while benchmarks report averages. The user wonders if this is principled or just conflicting vibes. I should consider different risk frameworks: maximin vs expected value.

  The user mentions civil engineering (safety factors) versus cryptography (one flaw breaks all). Which analogy fits better? For AI capabilities like biosecurity risks, a single successful attack could be catastrophic, so maybe it's more like cryptography. But for less critical failures, averages might suffice. That distinction seems important.

  They also bring up the problem of adversarial prompts - if we always find a failure, does that mean no model is deployable? That suggests an implicit threat model is at play, where adversaries are bounded by practicality. I need to explore what counts as a "plausible" adversary in practice.

  The expected-value view alternative is mentioned - treating rare failures as part of a risk budget. But for extreme risks, society doesn't accept expected value calculations (think of nuclear safety). The user asks what would change procedurally if we switched to this view. Probably thresholds would become probability-weighted rather than binary.

  I'm least confident about how exactly the unstated threat model works in practice. How do researchers determine what counts as a "realistic" adversary? That seems underspecified and might rely on expert intuition.
answer: |-
  Right, this is a proper philosophical tangle you've spotted, and it cuts to the heart of how AI labs practically manage risk in a field fraught with uncertainty. Let's tease it apart.

  The seeming contradiction you describe – measuring averages but acting on worst cases – rests on several intertwined presuppositions about risk, evidence, and the nature of the threats posed by frontier AI models. It’s not *necessarily* unprincipled, but it does rely on specific, often unstated, priors.

  The core presupposition is a **thresholded view of catastrophic risk coupled with an adversarial setting.** The reasoning goes like this: certain capabilities (e.g., autonomously creating a novel pathogen, enabling a devastating cyberattack) are considered unacceptable at *any* level of reliability if they can be triggered *at all* by a determined adversary. Why? Because the potential harm is existential or catastrophic, and an adversary only needs to succeed once. The average-case metric (like 98% jailbreak resistance) isn't primarily used to estimate the *magnitude* of the worst-case risk, but rather as **evidence concerning the feasibility and difficulty of *reaching* the worst case.** A high average resistance suggests the worst-case scenario (a reliable, dangerous jailbreak or capability) is harder to find, implying a higher "bar" for an adversary to overcome and, crucially, a lower *likelihood* that such a flaw exists *in a readily exploitable form*.

  This practice implicitly rules out a **pure expected-value (EV) calculation** for these catastrophic thresholds. On a pure EV view, a capability occurring with 0.1% probability would be factored into a cost-benefit analysis, perhaps deemed acceptable if the benefits are high enough and mitigation exists. But the current practice presupposes that for certain extreme risks, society (or the lab acting as a proxy) operates under a **deontic constraint or a maximin principle**: some outcomes are simply unacceptable to permit, regardless of their calculated probability, especially when that probability is fundamentally uncertain and the actor (an adversary) is actively trying to *make* it happen. The EV view treats probability as a known input; the threshold view acknowledges deep uncertainty and agency. (I'm quite confident this distinction is central to the practice.)

  So, where do the average numbers earn their keep? They serve several functions:
  1.  **Proxy for Robustness:** A high average suggests a "steeper gradient" – it's harder to find adversarial examples, implying the worst-case flaw might not exist *or* is buried very deep.
  2.  **Bound (of sorts):** While not a strict statistical bound (due to the nature of high-dimensional search spaces), consistently high performance across diverse evals makes it *unlikely* that a *trivially easy, highly reliable* worst-case exploit exists. It provides some assurance the model isn't "fragile by default."
  3.  **Progress Metric & Benchmarking:** They track improvement over time and against other models, indicating general safety/capability trends. For *non*-catastrophic risks (e.g., moderate bias, factual errors), the average *is* often used closer to an EV calculation, informing mitigation efforts rather than triggering non-deployment.
  4.  **Trigger for Deeper Investigation:** A significantly *low* average on a critical safety eval flags a higher likelihood that a disqualifying worst-case flaw *might* exist, warranting intensive red-teaming focused *specifically* on finding it.

  The analogies you mention are both relevant but incomplete:
  *   **Civil Engineering (Safety Factors):** Similar in applying a buffer, but crucially different. Safety factors multiply a *known* average load. Here, the "load" (adversarial ingenuity) is unknown and potentially unbounded. The average isn't the load being multiplied; it's evidence about the material's resilience *against* an unknown maximum load.
  *   **Cryptography (One Flaw Fails All):** This is closer, *especially* for jailbreaks or specific dangerous capability elicitation. Finding one reliably reproducible method to get the model to output dangerous CBRN information *is* treated like a cryptographic break – it invalidates the model's "safety claim" for that domain. (Highly confident this analogy holds for specific exploit classes.) However, unlike crypto, the "break" might be extremely hard to find, and the model might still be "safe enough" if no one *can* find it before patching.

  This leads directly to your "flip side": the collapse problem. You're absolutely right that an *unbounded*, infinitely resourced adversary can *eventually* find *some* adversarial input for almost any model. The practice **absolutely relies on an implicit, informal notion of a "plausible adversary" or "bounded threat model."** This is rarely explicitly quantified but involves priors about:
  *   **Computational/Query Budget:** How many attempts is a real-world attacker likely to make?
  *   **Adaptation Cost:** How hard is it to adapt known attacks or discover novel ones?
  *   **Access:** Does the attacker need white-box access, or only black-box?
  *   **Skill Level:** What expertise can we assume?
  *   **Deployment Context:** Will mitigations (output filters, monitoring, rate-limiting) be in place?

  The average-case evals and red-teaming are, in part, stress tests *against* this implicit, bounded adversary. If a flaw is found only under conditions wildly exceeding this implicit bound (e.g., requiring thousands of GPU-hours of specific optimisation), it's less likely to be treated as immediately disqualifying than a flaw easily found with a simple suffix appended to any prompt. The decision *not* to collapse into refusing all deployment rests on the belief that the worst-case under a *realistic* bounded adversary *can* be made acceptably rare or difficult to achieve through model design, safeguards, and monitoring. (This is a point of significant philosophical underdetermination – the definition of "realistic" is inherently fuzzy.)

  **What would change under an Expected-Value (EV) regime?**
  Adopting a pure EV view would fundamentally alter the process:
  1.  **Elimination of Binary Thresholds:** Pass/fail triggers based on a single instance of a dangerous capability would vanish. Instead, *all* risks would be characterised by their estimated **probability and impact**.
  2.  **Focus on Quantifying Likelihood:** Evals would need to move beyond averages and actively estimate the *likelihood* of rare, high-impact events. This is notoriously difficult for complex systems like LLMs (the "tail problem"). Techniques like extreme value theory or vast adversarial testing might be attempted, but confidence intervals would be wide.
  3.  **Risk Budgets:** A lab would define an acceptable overall "risk budget" (e.g., expected fatalities per year below X) and sum the EV contributions of *all* identified risks (misuse, accidents, alignment failures etc.). Deployment would be permitted if the total EV risk fell below the budget.
  4.  **Mitigation Valuation:** Safety efforts would be judged by how much they reduce the *probability* component of the EV calculation for specific high-impact risks. Cost-benefit analyses would be explicit: "Does spending $Y million on further red-teaming reduce the expected fatalities enough to justify the cost?"
  5.  **Acceptance of Residual Risk:** The EV framework explicitly accepts that some level of catastrophic risk is permissible if its probability is sufficiently low and benefits are high. This is philosophically anathema to the current threshold-based approach for existential risks.

  **Philosophical Underdetermination:**
  Several distinct risk philosophies *could* justify the current hybrid practice *if* certain conditions hold:
  *   **Maximin (Worst-Case Focus):** If the catastrophic outcomes are truly unacceptable *and* probabilities are deeply uncertain/unknowable.
  *   **Precautionary Principle:** If the potential harm is great and irreversible, shifting the burden of proof onto demonstrating safety/innocence.
  *   **Satisficing with Thresholds:** Setting a minimum required level of robustness (the average) *and* defining absolute no-go zones (the worst-case triggers).
  *   **Implicit EV with High Disutility:** If the disutility of the catastrophic outcome is set so high that even a miniscule estimated probability makes the EV negative, pushing towards a *de facto* threshold (though the calculation is still different).

  **The Point of Least Confidence:**
  The aspect I'm least sure about is the **practical effectiveness and consistency of the implicit "bounded adversary" model.** How do labs *actually* define and calibrate this bound internally? Is it based on empirical attack data, threat intelligence, expert intuition, or arbitrary conservatism? How reliably do average-case metrics and limited red-teaming *actually* predict the difficulty for a real-world, determined-but-resource-limited adversary? This seems highly variable, underspecified, and vulnerable to cognitive biases or institutional pressures. The gap between "we tried reasonably hard and didn't find it" and "no plausible adversary will *ever* find it" is vast, and bridging it confidently is perhaps the weakest link in the philosophical chain you've identified. It feels like the place where "vibes" are most likely to creep in, despite the quantitative trappings of the average-case evals.
