prompt: |-
  I retired a couple of years ago from a career in population biology — thirty-odd years of life-history work, mostly reproductive strategies in insects and fish — and since then I've been sitting in on a graduate seminar in the philosophy department at the local university as a non-degree student, which has been equal parts humbling and wonderful. This term it's population ethics, and I have to write a term paper (6,000 words, one semester, due at the end), and I want to spend it on the procreation asymmetry — the Benatar-ish claim that it's wrong to bring a miserable person into existence but not required to bring a happy one. What nags at me is that everyone states this as though a birth is a countable event that brings a determinate new individual into being, and my entire working life was spent on organisms for which that's just false: clonal reproduction, budding, fragmentation in marine invertebrates, parthenogenesis, monozygotic twinning, chimeras, colonial organisms where you genuinly cannot say whether you're looking at one organism or many. And alot of the boundary cases aren't exotic curiosities, they're the bread and butter of my old literature. So the question I want the paper to answer: does the asymmetry survive once you take the indeterminacy of biological individuality seriously, or is it actually a thesis about something else — about the direction of concern, say, or about an asymmetry of needs, since coming into existence creates needs that can be frustrated whereas not existing leaves no needs to satisfy — rather than about the ethics of creating particular people? My old co-author thinks I'm overthinking it: she says an organism is whatever biologists find it useful to count as one, a bookkeeping matter with no ethical upshot. I don't buy it, because the asymmetry seems to need the counting to be a fact about the world rather than a convention, but I can't yet say why.

  What I want from you is a proposal for the paper, not the paper itself. State the question precisely enough that it has a determinate answer, then explain why the positions people actually hold in this debate leave it open — I know the standard machinery (the person-affecting restriction, total versus average views, the thought that non-existence can't be a harm because there's nobody there to be harmed), so don't just list it back to me; I need to see why none of it settles my question. Then the method: what I'd actually do across the semester, in order, week by week if that's useful — which cases to work through and in what sequence so the biological material is doing real argumentative work rather than being colorful, which objections to my framing I should try to answer and which I should simply concede. Tell me what a result looks like (the thesis the paper would end up defending, in a sentence or two) and what would count as the project failing; I'd rather learn that now than in month three.

  No reading list or citations, please — I can find the literature myself and I'll add the references at the end, I just don't want a bibliography standing in for an argument. And please commit: if you think the indeterminacy angle is a dead end, say so outright and hand me the better question instead; don't give me three possible papers and leave me to pick. Same for the metaphysics-versus-convention point — take a side on whether my co-author is right. Scope the thing honestly for one semester of part-time work by somebody who reads philosophy slowly and writes it even slower.
reasoning: |-
  Hmm, the user is a retired population biologist with decades of experience in life-history work, specifically reproductive strategies in insects and fish. They're now auditing a grad seminar in philosophy on population ethics and need to write a term paper on the procreation asymmetry. Their unique concern is that the asymmetry assumes births create distinct individuals, which clashes with biological realities like clonal reproduction, budding, fragmentation, etc., where individuality is fuzzy. They want to know if the asymmetry holds under this indeterminacy or if it's really about something else, like the direction of concern or asymmetry of needs. Their co-author thinks biological individuality is just a bookkeeping convention without ethical implications, but the user disagrees, feeling the asymmetry needs counting to be a fact.

  The user wants a precise research proposal, not the paper itself. They need a clearly defined question, an explanation of why existing debates don't address it, a methodological plan (week-by-week), a clear thesis, and failure conditions. They emphasized avoiding bibliographies and wanting a committed stance—no hedging or multiple options. They also mentioned their slow reading/writing pace, so the scope must be realistic for one semester of part-time work.

  First, I need to unpack the core issue: the procreation asymmetry (e.g., Benatar) claims that creating a miserable person is wrong but creating a happy one isn't obligatory. This relies on births as discrete events producing determinate individuals. But in biology, entities like colonial organisms or chimeras blur these lines—is it one organism or many? This indeterminacy challenges the ethical framework. The user suspects the asymmetry might actually be about needs: existence creates needs that can be frustrated, while non-existence doesn't. Their co-author's view that individuality is conventional might undermine the asymmetry if ethics requires ontological facts.

  To formulate the precise question: "Does the procreation asymmetry retain its ethical force when applied to cases of biologically indeterminate individuals, or does its apparent plausibility depend on unexamined assumptions about the metaphysics of counting persons?" This targets whether the asymmetry is robust or if it's actually about something else in disguise.

  Why don't existing positions settle this? Standard tools like the person-affecting restriction (PAR) focus on harming or benefiting particular people, but indeterminate cases make "particular people" unclear. For example, in fragmentation, if a parent organism splits, is the offspring a new individual? PAR can't handle this ambiguity. Total vs. average utilitarianism might count welfare aggregates, but they still assume countable entities. The non-identity problem (where actions affect who exists) becomes messy when identity isn't fixed. Existing debates treat individuality as given, so they don't engage with the user's biological cases, leaving a gap.

  For the method, I propose a phased approach over 12 weeks. Start with the asymmetry and its standard justifications (weeks 1-2), then introduce biological indeterminacy with concrete examples (weeks 3-4). Pick key cases: colonial organisms (like corals), asexual clonality (aphids), fragmentation (planarians), and chimeras (grafting in trees). Each challenges counting differently. Weeks 5-7 apply the asymmetry to these cases to expose problems. Weeks 8-9 explore alternative foundations like the asymmetry of needs. Weeks 10-11 develop the thesis and address objections. Week 12 concludes.

  The thesis should be: "The procreation asymmetry fails as an account of creating particular individuals in biologically indeterminate cases but succeeds as a principle about preventing frustrated needs arising from existence." This reframes it, sidestepping metaphysics. Failure would mean the asymmetry holds regardless of indeterminacy, or that the needs-based view doesn't work.

  I need to commit: the co-author is wrong—conventions aren't ethically neutral here because the asymmetry's logic requires determinate individuals. If individuality is fluid, the ethical judgments might be arbitrary. A needs-based reframing is better. The user should concede that conventions matter for biology but argue that ethics needs more robustness. Scoping for part-time work: focus on 3-4 biological cases deeply, not a survey; avoid heavy metaphysics; use the user's expertise to add novelty. This is manageable in a semester with slow pacing. 

  Finally, ensure clarity and directness—no fluff, just structured reasoning tailored to the user's background.
answer: |-
  Here is a tightly scoped proposal for your paper, committing to a specific thesis and method, designed for one semester of part-time work. It rejects your co-author’s convention-based view and leverages your biological expertise to reframe the asymmetry.

  ---

  ### **Precise Research Question**  
  Does the procreation asymmetry retain its ethical force when applied to cases of biologically indeterminate individuals, or does its apparent plausibility depend on unexamined assumptions about the metaphysics of counting persons?  

  ### **Why Existing Debates Leave This Open**  
  - **Person-Affecting Views**: Assume a clear "person" who is benefited/harmed. They can’t resolve cases where it’s indeterminate *whether* a new "person" exists (e.g., coral budding) or *which* "person" is affected (e.g., monozygotic twinning pre-split).  
  - **Total/Average Utilitarianism**: Require countable individuals to aggregate welfare. When individuality is fuzzy (e.g., aphid clones), welfare can’t be assigned to discrete entities.  
  - **Non-Identity Problem**: Relies on fixed counterfactual identities ("this person would not exist"). Biologically indeterminate cases (e.g., fragmentation in planarians) make "this person" incoherent.  
  - **Benatar’s Asymmetry**: Explicitly ties harm/benefit to *bringing a person into existence*. If "a person" isn’t a discrete ontological unit (e.g., in colonial tunicates), the act of "bringing into existence" loses its defined ethical target.  

  *None engage biological indeterminacy because they treat "individual" as a primitive, stable category.*

  ### **Method: Week-by-Week Plan**  
  **Phase 1: Groundwork (Weeks 1–4)**  
  - **Weeks 1–2**: Map the asymmetry’s standard justifications (e.g., harm avoidance trumps benefit provision; non-existence isn’t deprivation).  
  - **Weeks 3–4**: Introduce 3–4 biologically indeterminate cases *as philosophical problems*, not illustrations:  
    - **Case 1**: Asexual cloning (aphids/rotifers) — Is each clone a "new individual" or growth of the original?  
    - **Case 2**: Fragmentation (starfish/planarians) — Does "creating" a new entity occur at fission? Is harm to the fragment assignable?  
    - **Case 3**: Colonial organisms (corals/siphonophores) — When does a "colony" become "multiple individuals"?  
    *Avoid exotic cases; stick to those central to your field.*  

  **Phase 2: Pressure-Testing (Weeks 5–7)**  
  - Apply the asymmetry to each case:  
    - If a starfish fragment regenerates into a suffering organism, did we "create a miserable person"?  
    - If a coral bud becomes a thriving polyp, is there no duty to "create" it?  
  - **Focus**: Show how standard ethical labels (harm/benefit, creation/non-creation) fracture when biological boundaries do.  

  **Phase 3: Reframing (Weeks 8–10)**  
  - Argue that the asymmetry’s intuitive appeal arises not from creating *persons*, but from:  
    - **Direction of concern**: We have stronger duties to prevent suffering than to enable pleasure.  
    - **Asymmetry of needs**: Existence *creates* needs that can be unmet; non-existence *negates* needs.  
  - Test this against your cases: Fragmentation creates needs (e.g., metabolic demands in a new fragment) without creating a "new person."  

  **Phase 4: Objections & Defense (Weeks 11–12)**  
  - **Address**:  
    - *Convention Objection* (your co-author): Concede that biologists *operationally* define individuals, but argue ethics requires ontological grounding for harm assignment. If individuality is *only* conventional, harming a fragment is arbitrary.  
    - *"You’re Changing the Subject" Objection*: Defend that needs-based asymmetry resolves the cases without metaphysical baggage.  
  - **Ignore**: General critiques of asymmetry (e.g., repugnant conclusion); stay focused on individuality’s role.  

  ### **Thesis Statement**  
  *The procreation asymmetry fails as an account of creating* particular individuals *in biologically indeterminate cases but succeeds as a principle about preventing* frustrated needs *that arise from processes initiating existence.*  

  ### **What Success/Failure Looks Like**  
  - **Success**: Your paper concludes the asymmetry is best understood **needs-based, not person-based**. Biological indeterminacy exposes that "creating a person" is ethically secondary to "creating needs that risk frustration."  
  - **Failure**: If the asymmetry’s standard form *can* coherently handle all your cases (e.g., by arbitrarily "counting" individuals), then your critique collapses.  
  - **Early Failure Signal**: If by Week 6, applying person-affecting principles to fragmentation/cases feels strained but not fatal, the project is at risk.  

  ### **Why Your Co-Author is Wrong (The Commit You Asked For)**  
  Biological conventions *do* have ethical upshot: If "individual" is merely a pragmatic label, then whether we "harm a person" by fragmenting a planarian depends on terminological choices, not moral facts. This makes the asymmetry arbitrary in key real-world cases. Your needs-based reframing avoids this by decoupling ethics from counting.  

  ### **Realistic Scope for One Semester**  
  - **Keep it tight**: 3–4 biological cases max (use your expertise; no survey of all reproductive strategies).  
  - **No deep metaphysics**: Don’t solve "what is an individual?"—show why the ethics *needs* an answer or a workaround.  
  - **Leverage your strength**: Your novelty is using population biology to reveal hidden assumptions. Spend 70% of the paper on Cases + Reframing.  

  This proposal forces the asymmetry to confront biology on its own terms—and either adapt or reveal its true foundations. If the indeterminacy breaks it, you’ve shown the asymmetry isn’t about "persons"; if it holds, you’ve exposed where biology bends to ethical convention. Either outcome is a philosophically substantive paper.
