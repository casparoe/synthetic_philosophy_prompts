prompt: |-
  I chair the publications review board at a mid-sized research institute — not a journal, we vet our own staff's papers before they go anywhere. We flag maybe twenty submissions a year, mostly mild dual-use worries, and the current process is basically whoever feels strongest wins: if one reviewer thinks a result is too risky, we agonise for weeks and usually publish anyway; if nobody feels strongly, it sails through. Someone told me this is the unilateralist's curse running in both directions — the optimists publish unilaterally by default, but any single pessimist can also stall everything indefinitely. I'd like an actual decision procedure my board can run in a ninety-minute meeting: the questions to ask in order, how to agregate five reviewers' risk judgements without just deferring to whoever is loudest or most senior, where the procedure stops with a no, and where it has to hand the decision back because we're looking at values rather than facts. Please also say which steps are really judgement calls dressed up as procedure, and where the whole thing will misfire. Then run it on three plausible cases: a method paper that speeds up vaccine development but could speed up pathogen engineering just as easily; a dataset mapping the locations of critical infrastructure; and a negative result showing a popular DIY biohacking supplement protocol is dangerous. At the very end, give one machine-readable verdict line per case, like \verdict{publish}, \verdict{withhold}, or \verdict{escalate}, plus a single line saying what the procedure could not settle.
reasoning: |-
  We are designing a decision procedure for a publications review board that must handle dual-use concerns efficiently. The procedure should:
  1. Avoid the unilateralist's curse (where one strong opinion dominates).
  2. Fit within a 90-minute meeting.
  3. Aggregate five reviewers' risk judgments systematically.
  4. Clearly indicate when to withhold publication, when to publish, and when to escalate due to value disagreements.

  The procedure will have the following steps:

  **Step 1: Initial Screening (5 minutes)**
  - Each reviewer independently answers two binary questions for the paper:
    a. Is there a non-negligible risk of significant harm from publishing? (Yes/No)
    b. Is the benefit of publishing clearly substantial? (Yes/No)
  - The chair collects the votes. If all five answer "No" to (a) and "Yes" to (b), the paper is approved for publication. If at least one reviewer answers "Yes" to (a), proceed to Step 2. If there's no consensus on (b) but no one flags a risk, then it's approved (since the default is to publish unless there's a risk concern).

  **Step 2: Risk Assessment (15 minutes)**
  - Reviewers who answered "Yes" to risk (Step 1a) must provide:
    a. The nature of the harm (e.g., dual-use, privacy, safety).
    b. The magnitude of harm (on a scale of 1-5, where 1 is minor, 5 is catastrophic).
    c. The probability of harm occurring (on a scale of 1-5, where 1 is very unlikely, 5 is very likely).
    d. The timeframe for harm (immediate, near-term, long-term, or uncertain).
  - Reviewers who answered "No" to risk may optionally provide comments.

  **Step 3: Benefit Assessment (10 minutes)**
  - All reviewers assess the benefit:
    a. Magnitude of benefit (scale 1-5, 1 being minor, 5 major).
    b. Probability of benefit (scale 1-5).
    c. Timeframe (immediate, near-term, long-term).

  **Step 4: Aggregation and Discussion (30 minutes)**
  - The chair displays the risk and benefit assessments (anonymously) and leads a structured discussion focusing on:
    a. Areas of agreement and disagreement on risk and benefit.
    b. The most extreme risk and benefit assessments and their reasoning.
    c. Whether the risks can be mitigated (e.g., by redaction, controlled access, etc.).

  **Step 5: Scoring and Decision (20 minutes)**
  - Each reviewer independently assigns a net risk score:
    Net Risk = (Average of harm magnitude and probability for risk) - (Average of benefit magnitude and probability for benefit)
    - But note: we are aggregating multiple reviewers. Alternatively, we can use:
      Total Risk Score (from each reviewer) = (Harm Magnitude + Harm Probability) 
      Total Benefit Score = (Benefit Magnitude + Benefit Probability)
      Then Net = Total Risk - Total Benefit
    However, we have to account for the fact that not every reviewer sees risk. For those who didn't flag risk in Step 1, they would assign 0 for harm magnitude and probability? But that might not be accurate because they might still see some risk but not enough to flag. Alternatively, we can have all reviewers rate both risk and benefit in Steps 2 and 3, even if they initially said no to risk.

    Revised plan: In Step 2, all reviewers rate the risk (even if they initially said no, they can assign 0 for magnitude and probability) and in Step 3 all rate the benefit. Then we compute:

    For each reviewer i:
      Risk_i = (Magnitude_i + Probability_i)   [each on 1-5 scale, so range 2-10]
      Benefit_i = (Magnitude_i + Probability_i) [range 2-10]

    Then, Net_i = Risk_i - Benefit_i   (range -8 to 8)

    But note: we want to avoid negative risk? Actually, if benefit is higher, net can be negative meaning we should publish.

    Then, we aggregate the net scores: we take the median of the five net scores (to avoid outliers). The median is robust to extreme views.

    Decision rule based on median net score:
      - If median net score <= 0: Publish (because benefit is at least as great as risk)
      - If median net score > 0 and <= 3: Discuss mitigation (Step 6)
      - If median net score > 3: Withhold

    However, we also need to consider the spread. If there's high disagreement, we might need to escalate.

  **Step 6: Mitigation (if needed, 10 minutes)**
  - If the median net score is between 0 and 3 (inclusive), the board discusses whether the paper can be modified to reduce risk (e.g., redacting key details, publishing in a restricted venue, etc.). If feasible, the paper is conditionally approved with modifications. If not, then withhold.

  **Step 7: Handling Disagreement (if necessary)**
  - If the standard deviation of the net scores is high (e.g., > 2.5 on the net score scale which goes from -8 to 8) and the median is near a threshold, or if the board feels that the issue is more about fundamental values (e.g., "should we ever publish this kind of information?") rather than quantifiable risks, then the decision is escalated to a higher authority (e.g., institute director) with a summary of the board's views.

  **Where it's judgment vs procedure:**
  - Step 1: Initial screening is a judgment call (what is non-negligible?).
  - Step 2 and 3: Assigning magnitudes and probabilities is subjective, but the procedure forces quantification.
  - Step 4: Discussion is guided but still judgment-based.
  - Step 5: The median net score is a procedure, but the underlying scores are judgments.
  - Step 7: Deciding that the disagreement is about values rather than facts is a judgment.

  **Where it might misfire:**
  - If reviewers are not honest in their initial screening (e.g., downplaying risk to avoid work).
  - If the quantification in Steps 2 and 3 is too arbitrary and reviewers don't take it seriously.
  - If the median net score is near a threshold and the group is polarized, the procedure might force a decision that doesn't reflect the intensity of minority concerns.

