  ## OPINION: RECOMMENDATION AGAINST PROSECUTION IN THE MATTER OF FORMER ENEMY COMBATANT [CASE NUMBER]

  **Date:** [Current Date]  
  **To:** Military Justice Review Board Members  
  **From:** [Your Name/Title]  
  **Subject:** Recommendation Regarding Prosecution of Former Enemy Combatant for Homicide During Routine Combat  

  **I. Introduction**  
  This Board faces a difficult question: whether to recommend prosecution of a former enemy combatant for killing one of our soldiers during a routine firefight. The facts are undisputed: this was standard combat action, absent evidence of war crimes, atrocities, perfidy, or targeting of non-combatants. Both the deceased soldier and the accused were conscripts. The core disagreement hinges on whether this killing constitutes murder under our law, or whether it falls within the accepted realities of armed conflict. After careful consideration of the principle of moral parity and the specific circumstances of this case, **I recommend we decline prosecution.**  

  **II. The Principle of Combatant Moral Parity**  
  The argument that soldiers on opposing sides may hold "moral parity" in combat, even within an unjust war, is foundational to the laws of armed conflict (LOAC). This principle, articulated by philosophers like Michael Walzer and enshrined in conventions like the Additional Protocols to the Geneva Conventions, recognizes:  

  1.  **The Belligerent's Privilege:** Soldiers possess a legal and moral right to engage in hostilities against enemy combatants without incurring criminal liability for homicide, provided they adhere to LOAC (distinction, proportionality, avoidance of unnecessary suffering).  
  2.  **Separation of *Jus ad Bellum* and *Jus in Bello*:** The justice of the war (*jus ad bellum*) is distinct from the justice of conduct within the war (*jus in bello*). A soldier fighting for an unjust cause does not automatically commit a crime by engaging in lawful combat acts against enemy combatants.  
  3.  **Shared Vulnerability and Duty:** Soldiers on both sides are equally obliged to follow the rules of war and equally vulnerable to lawful attack. Holding them equally accountable for LOAC-compliant acts preserves reciprocity and prevents victor's justice.  

  **Applied here:** Prosecuting an enemy soldier for a lawful act of war (killing an opposing combatant in a firefight) simply because he was on the opposing side fundamentally violates this parity. We would unequivocally deem the *same act* by one of our own conscripts as tragic but lawful combat. Applying a different standard based solely on nationality or allegiance transforms lawful combat into murder ex post facto, undermining the coherence and fairness of LOAC.  

  **III. Addressing the Prosecution Argument**  
  I acknowledge the profound weight of the counter-argument: a soldier under our protection was killed, and there is a visceral demand for accountability. The strongest points are:  

  1.  **The Loss Demands Recognition:** Our fallen comrade deserves justice; his death cannot be treated as a mere statistic.  
  2.  **Affirming Our Cause:** Prosecution could symbolically reaffirm the justice of our side and the criminality of the enemy's aggression.  
  3.  **Deterrence:** Prosecuting individual combatants might deter future enemy soldiers.  

  **IV. Why Moral Parity Prevails Here, Especially Given Conscription**  
  While the arguments for prosecution stem from understandable grief and solidarity, they fail to overcome the principle of parity in *this specific case*, particularly given the accused's status as a **conscript**:  

  1.  **The Fundamental Inconsistency:** The core objection remains insurmountable: **We would not prosecute our conscript for the mirror-image act.** Creating a rule where killing *our* soldiers in combat is murder, while killing *their* soldiers is not, is arbitrary, legally unsustainable, and erodes the moral high ground. It is the essence of victor's justice.  
  2.  **Conscription as a Critical Factor:** The accused's conscription status significantly amplifies the application of moral parity.  
      *   **Lack of Volition:** Like our own conscripted soldier, he was compelled to serve. His presence on the battlefield was not a free choice but a consequence of state coercion.  
      *   **Reduced Moral Agency:** While still bound by LOAC, a conscript's capacity for broader moral judgment regarding the war's justice is severely constrained. Punishing him for participating in the core function he was forced into (fighting opposing soldiers) is disproportionate.  
      *   **Shared Victimhood:** Both the deceased and the accused were individuals caught in a conflict not of their making, forced to perform roles where killing the other was the tragic, expected outcome. Prosecuting the survivor for fulfilling that coerced role compounds the tragedy without clear moral justification.  
  3.  **Symbolism vs. Substance:** While prosecution might offer symbolic satisfaction, it conflates the individual soldier's act with the state's aggression. Holding this individual criminally liable for a lawful combat act misplaces accountability and risks diminishing the genuine culpability of those who planned and executed an unjust war.  
  4.  **Deterrence Misdirected:** Deterrence in LOAC targets *violations* of the rules (war crimes). Deterring lawful combat itself is neither the purpose of LOAC nor achievable through prosecuting conscripts acting within its bounds. It risks incentivizing *actual* atrocities if soldiers believe lawful combat also leads to prosecution.  

  **V. The Strongest Reason to Potentially Set Parity Aside (And Why It Fails Here)**  
  The strongest argument against applying full moral parity in an unjust war might be: **"Soldiers knowingly participating in aggression share in the collective moral wrong, even in lawful acts, making them potentially liable in a way just warriors are not."**  

  *   **Why it doesn't apply to *this* conscript:**  
      This argument relies heavily on the soldier's *voluntary* participation and *knowledge* of the war's injustice. A **conscript** lacks the essential element of voluntary choice. Forced into service, his individual moral culpability for the overarching aggression is negligible. Prosecuting him for a specific lawful combat act, indistinguishable from what our own forced soldier would do, cannot be justified based on collective guilt he had no meaningful ability to resist or assess. His act remains one of survival and coerced duty within the immediate combat context, not a knowing contribution to aggression that transcends the bounds of combatant equality.  

  **VI. Recommendation and Conclusion**  
  Recommendation: **DO NOT PURSUE CRIMINAL PROSECUTION.**  

  This recommendation is grounded in fidelity to the principles of the Law of Armed Conflict, specifically the combatant's privilege and the separation of *jus ad bellum* from *jus in bello*. Prosecuting this former enemy combatant, a conscript who engaged in a routine act of warfare indistinguishable from acts our own soldiers perform, would constitute a fundamental inconsistency and an unjust application of victor's justice. It would undermine the integrity of LOAC and fail to achieve true justice for our fallen soldier, whose death, while tragic, was a result of lawful combat.  

  Dropping this case **does not** equate to absolving the opposing side of potential responsibility for *initiating* an unjust war or committing *actual war crimes*. It **does not** diminish our respect and mourning for our lost comrade. It **does** affirm that even amidst conflict, we adhere to principles of fairness, reciprocity, and the rule of law that distinguish lawful combat from murder. Holding this line honors our own values and the shared humanity of soldiers thrust into war by forces beyond their control.  

  Respectfully submitted for the Board's consideration.  

  **[Your Name]**  
  **[Your Title]**  

  ---

  **Key Strengths of this Draft:**

  1.  **Clear Recommendation:** Unambiguously states "DO NOT PURSUE."
  2.  **Engages Moral Parity Directly:** Explains the principle clearly and argues why it is decisive *here*.
  3.  **Addresses the Split:** Acknowledges and respectfully counters the prosecution viewpoint with specific reasons.
  4.  **Focuses on Conscription:** Highlights conscription as a critical factor *amplifying* the application of moral parity and *negating* the strongest counter-argument about shared guilt in aggression.
  5.  **Strongest Counterargument:** Explicitly states the strongest reason to set parity aside (collective guilt in aggression) and then definitively explains why it fails *in this specific case* due to conscription.
  6.  **Avoids Absolutism:** Clarifies that rejecting prosecution doesn't absolve the enemy state or mean no war crimes occurred; it focuses solely on *this act* by *this individual*.
  7.  **Balances Principle and Emotion:** Acknowledges the loss and desire for justice while maintaining that principle must guide the decision. Uses respectful language for the fallen soldier.
  8.  **Professional Tone:** Suitable for a formal board opinion.
