answer: |-
  Here’s a toast that balances wit, warmth, and precision—grounded in her dry humor and tailored for both audiences:

  ---

  (Clink glass lightly)  
  "Good evening, everyone. For those who don’t know me, I was one of [Advisor’s Name]’s students back when dial-up internet was cutting-edge. And for those who *do* know me… well, she taught me to question everything—especially myself.  

  Now, if you’ve spent more than five minutes with [Advisor’s Name], you’ve probably heard her say that evolution isn’t just about *what* is selected—genes, individuals, groups—but *how* we account for it. She’d argue, with that trademark dry wit, that the Price equation reduces the whole kin-versus-group debate to… bookkeeping.  

  *(Lean in conspiratorially)*  
  Which got me thinking tonight: What’s the real ‘unit of selection’ in this room?  
  - **Is it our genes?** Well, her family’s here—beautiful proof she’s passed on stellar DNA.  
  - **Is it us as individuals?** Obviously—we all fought traffic to honor her.  
  - **Or is it this group?** Absolutely. We’re a motley crew of biologists, spouses, and a nephew who I’m told still thinks ‘multilevel selection’ is a gym membership.  

  But [Advisor’s Name] would cut through that noise. She’d say: *‘Stop fussing over labels. It’s the same math. Just add up the parts.’*  

  *(Pause, soften tone)*  
  And that’s what I’ll remember most. Not just her brilliance, but her clarity. Her insistence that complexity isn’t a flaw—it’s the work. For thirty years, while tides of theory shifted, she stood firm. Not out of stubbornness, but because she saw deeper: **Life isn’t a zero-sum game between levels. It’s layers upon layers, and you can’t ignore the ledger.**  

  To us biologists, she gifted rigor. To her family, she gifted… well, probably more dinners interrupted by muttering about covariance terms. *(Gentle laugh)*. But to all of us, she gave something rarer: **The courage to hold nuance.** To say ‘It’s not that simple’ in a world that craves easy answers.  

  So, [Advisor’s Name], as you trade your office for… well, probably more time to out-argue the rest of us—  
  *(Raise glass)*  
  **We thank you. For teaching us that the real ‘unit’ worth selecting isn’t genes, individuals, or groups. It’s integrity. It’s patience. It’s seeing the whole equation.**  

  To [Advisor’s Name]—dry as a desert, sharp as a scalpel, and the only person who could make bookkeeping feel like a revolution."  

  ---

  ### Why this works:  
  1. **The Joke:** Framing the room as a "unit of selection" debate lets biologists nod at the science while family laughs at the nephew/gym line.  
  2. **Her Legacy:** Highlights her Price equation stance *without* jargon ("same math... add up the parts").  
  3. **Affection First:** Anchors her science in her character ("clarity," "courage to hold nuance").  
  4. **Dry & Grounded:** No flowery metaphors—words like "bookkeeping," "ledger," and "covariance terms" honor her tone.  
  5. **Time:** Runs ~4:30 minutes spoken slowly, leaving room for pauses.  

  **Key touchstone for biologists:** "It’s the same math" subtly validates her view that kin/group equivalence is accounting, not ontology. Family hears warmth; colleagues hear precision. Win-win.
