     Order of rules is important. We must remove pairs first, then remove zeros, then handle a single one.

     Example: "101" (even)
     - Rule1: no "11", skip.
     - Rule2: no "00", skip.
     - Rule3: remove the '0' -> becomes "11"
     - restart: Rule1: remove "11" -> becomes ""
     - Rule5: "" -> "1" -> output "1" -> correct.

     Example: "111" (odd: three ones)
     - Rule1: remove the leftmost "11" -> becomes "1" (and then restart)
     - Rule1: no "11"
     - Rule2: no
     - Rule3: no '0'
     - Rule4: "1" -> "0" -> becomes "0"
     - restart: now we have "0", so Rule3: remove '0' -> becomes ""
     - Rule5: "" -> "1" -> output "1", but we want output0 for odd. -> wrong.

     What went wrong? "111" -> remove one pair of ones leaves one one. Then Rule4 turns that one into "0", and then we remove the "0" by Rule3, and then we have empty -> output "1".

     We want: after removing pairs, if there is a one left, that means odd. So we should output0. So in Rule4, we should output0 immediately and stop.

     Change Rule4: "1" -> "0" and then stop. But the model continues until no rule applies. So after Rule4, the string becomes "0", then Rule3 will apply and remove it, then Rule5 will output "1".

     Instead, we can have Rule4: "1" -> "0" and also have a rule that says if you see "0", leave it and stop? But then for even, we have "" and Rule5 outputs "1", and for odd, we have "0" and no rule applies? Then output "0", which is correct.

     So rules:

     Rule1: "11" -> ""
     Rule2: "00" -> ""
     Rule3: "0" -> ""    # but only if there's not a single 1 left? We want to remove zeros always.
     Rule4: "1" -> "0"   # change a leftover one to 0 (indicating odd)
     Rule5: "" -> "1"

     But now for "111":
     - Rule1: remove "11" -> leaves "1"
     - Rule4: "1" -> "0" -> now we have "0"
     - Then Rule3: remove "0" -> ""
     - Rule5: "" -> "1" -> output1, but should be0.

     We need to remove only the zeros that are not the final answer. So we should remove zeros only if there are other things? This is messy.

     Given the time, I will provide Group3 (Rule-based) with the following rules that work by simulating the even parity with a state in the string:

     We allow the string to have the format: [state] + [input]
     State is either 'E' or 'O'.
     Start: "E" + the input string.

     Rules:
     Rule1: "E0" -> "E"
     Rule2: "E1" -> "O"
     Rule3: "O0" -> "O"
     Rule4: "O1" -> "E"
     Rule5: "E" -> "1"   # when the string is just "E", output "1"
     Rule6: "O" -> "0"   # when the string is just "O", output "0"

     Example: "101" with start state "E"
     - "E101": Rule1 doesn't match (no "E0" at the beginning? The string is "E101". The leftmost match is not for Rule1, because we have "E1" -> matches Rule2: "E1" -> "O", so becomes "O01"
     - Now we have "O01": Rule3: "O0" -> "O", so becomes "O1"
     - Now "O1": Rule4: "O1" -> "E"
     - Now "E": then Rule5: "E"->"1" -> output "1"

     Example: "111"
     - Start: "E111"
     - Rule2: "E1"->"O" -> becomes "O11"
     - Rule4: "O1"->"E" -> becomes "E1"
     - Rule2: "E1"->"O"
     - Rule6: "O"->"0" -> output "0"

     This works.

     So for Group3, we give them this rule set and the task is to understand it.

     Now, we have three models.

     Materials to prepare:

     For each group (6 groups: 2 groups per model type), a handout with:
     - The specification of their model.
     - The task (even parity for 3-bit strings).
     - For Group1 and Group2, they have to design the machine (states and rules).
     - For Group3, they are given the rules but have to understand how to apply them.

     But we want them to build, so for Group3, we give them the above rules and ask them to write them on index cards and be ready to explain.

     Alternatively, for Group3, we give them the idea of having a state in the string and let them come up with the rules? That might be too hard.

     Given time, we provide the rules for Group3.

     Timeline:

     Part 1: Introduction (5 minutes)
     - The instructor says: "Today we are going to experience how different mechanical procedures can be designed to solve the same problem. Each group has a different way of computing. Your task is to build a device (using index cards) that can compute whether a 3-bit string has an even number of 1's. You will then have to explain your device to another group and try to simulate their device."

     Part 2: Group work (25 minutes)
     - Divide into 6 groups (3-4 students per group).
     - Assign two groups to Model A (Tape Machine), two to Model B (State Machine), two to Model C (Rule-based).
     - Give each group a handout for their model that explains the model and the task.
     - For Model A and B, the handout does not provide the solution; they have to design the states and rules.
     - For Model C, the handout provides the rules and an example.
     - Groups work to build their device: for Tape Machine, they define the states and rules on index cards. For State Machine, similarly. For Rule-based, they write the rules on index cards and practice with examples.

     Part 3: Simulation challenge (30 minutes)
     - Re-group: form triples with one group from each model type. If not possible, form a few triples and the rest as a group of three from two types? Given we have two groups per type, we can have two triples.
     - In each triple, each group explains their model to the others.
     - Then, they are given a few input strings (e.g., "000", "011", "111") and for each input, each group must simulate the other two groups' models and see if they get the same output.

     Part 4: Whole-class discussion (20 minutes)
     - The instructor leads a debrief.

     The catch: the students will see that all models give the same output for the given inputs. They might then conclude that the models are equivalent. But are they? We only did three inputs.

     Then the instructor asks: what if we try a 4-bit input? We change the task to 4-bit. But their models are for 3-bit. 

     This is the moment: their models are hard-coded for 3-bit. So they would have to redesign. 

     The instructor then explains: in history, the models were designed for arbitrary-length inputs. And when people did that, they found that different models (Turing machines, lambda calculus, recursive functions) were all equivalent. That's the convergence.

     But note: we cannot do arbitrary-length inputs in class.

     So in the debrief, we must explain that the models they built are for fixed-size input, but the real models are for arbitrary input sizes. And then we show that for arbitrary input sizes, the different models (Turing machine, etc.) are equivalent.

     Now, what can go wrong:

     - A group might not finish designing their machine.
     - A group might design their machine incorrectly.
     - In the Rule-based group, they might not understand the rules and apply them wrongly.

     The instructor should circulate during group work to help.

     - A group might build a model that is not of the assigned type. For example, the State Machine group might build a Tape Machine. The handout should be clear.

     - A group might try to use a lookup table (e.g., for 3 inputs, 8 possibilities) and just have a table. That's valid, but then during simulation, the other groups will see that they can also do a table. But then we discuss: for 3-bit, a table is feasible, but for 100-bit, it's not. And mechanical procedures should be defined step by step.

     - The magical primitive: a group might say: "and then we have an oracle that tells us the answer". We handle that by saying: the procedure must be mechanical, step by step, with no magic. The rules must be finite and deterministic.

     During the debrief, we discuss:

     - What did you experience? (convergence on the same function)
     - But is this a proof that the models are always equivalent? (No, because we only did fixed-size and a few examples.)
     - What would we need to do to have more confidence? (Design the models for arbitrary input sizes and then prove they can simulate each other for any input size.)

     The activity cannot reproduce the historical convergence on the class of computable functions because we only did a simple function and fixed input size. The debrief must explain that the real Church-Turing thesis is about what is computable in principle (for any input size) and that the equivalence of the different models for that class is what is impressive.

     Also, the activity does not address the informal notion of what a human can compute. We must explain that the thesis identifies the informal notion with the formal one.

     Debrief outline:

     1. What happened in the activity? (Students built different models that all computed the same function.)
     2. Did they prove that the models are equivalent? (No, they only saw it for a few inputs.)
     3. In history, how did we get the thesis? (Multiple formal models were proposed for arbitrary input sizes, and they were proven equivalent. This is the convergence.)
     4. But is that a proof of the thesis? (No, because the thesis is about an informal notion. The convergence is evidence, but not proof.)
     5. What would count as evidence against the thesis? (If someone found a mechanical procedure that is intuitively computable but cannot be done by a Turing machine. None has been found.)

     Finally, the magical primitive: if a group used one, we can say: "But is that step mechanical? Does it follow a finite, well-defined rule?" If not, it's not allowed. We can use that to clarify the boundaries of mechanical procedures.

     Materials to prepare:

     - Handouts for each model type (3 types).
     - Index cards and markers.
     - Input strings for the simulation challenge (on index cards): "000", "001", "010", "011", "100", "101", "110", "111" (choose 3 or 4 for the challenge to save time).

     Handout for Model A (Tape Machine): 
     """
     Model A: Tape Machine

     You have a tape of 3 cells, initially holding the input string (one bit per cell). 
     A head is positioned over one cell (at the start, the leftmost cell).
     You have a finite set of states. One state is the start state (you can call it S0).

     A rule is defined by: (current state, current symbol under head) -> (new state, symbol to write, direction to move: L or R)

     However, you cannot move left from the leftmost cell or right from the rightmost cell.

     After processing, the output is the state the machine is in.

     Your task: Design rules and states so that for any 3-bit input, the final state is 1 if the number of 1's in the input is even, 0 if odd.

     Example: input "101" has two 1's -> even -> output 1.

     How to proceed:
     - You will need to traverse the tape.
     - You might use states to remember the current count mod 2.
     """

     Handout for Model B (State Machine):
     """
     Model B: State Machine (Mealy machine)

     You have a finite set of states, with one start state (S0).
     The input is a string of 3 bits, read one by one from left to right.
     At each step, based on the current state and the current input symbol, you go to a next state and output a symbol.

     We only care about the output after the third symbol.

     Your task: Design rules so that for any 3-bit input, the output after the third symbol is 1 if the number of 1's is even, 0 if odd. For the first two outputs, you can output anything (e.g., 0).

     Rules are: (current state, input symbol) -> (next state, output symbol)

     Example: input "101": 
       Step1: state=S0, input=1 -> (S1, 0)
       Step2: state=S1, input=0 -> (S1, 0)
       Step3: state=S1, input=1 -> (S0, 1)  [because two 1's -> even]
     """

     Handout for Model C (Rule-based):
     """
     Model C: Rule-based String Transformer

     You have a string that initially is "E" followed by the input string (e.g., for input "101", the initial string is "E101").

     You have a set of rules applied in order. For each rule, you look for the leftmost occurrence of the pattern and replace it with the replacement. Then you start over from the first rule. If no rule applies, you stop.

     Rules:
     1. "E0" -> "E"
     2. "E1" -> "O"
     3. "O0" -> "O"
     4. "O1" -> "E"
     5. "E" -> "1"
     6. "O" -> "0"

     Note: You apply the rules in this order: first rule1 is tried, then rule2, etc. Only the leftmost occurrence is replaced.

     Example: input "101":
       Start: "E101"
       Rule1: no "E0", so skip.
       Rule2: "E1" matches at the beginning -> replace with "O" -> string becomes "O01"
       Restart: now try rules from the beginning.
          Rule1: no "E0"
          Rule2: no "E1"
          Rule3: "O0" matches at the beginning -> replace with "O" -> string becomes "O1"
          Restart: 
               Rule1,2: no
               Rule3: no "O0" (now string is "O1")
               Rule4: "O1" matches -> replace with "E" -> string becomes "E"
          Restart: 
               Rule1,2,3,4: no
               Rule5: "E" matches -> replace with "1" -> output "1"

     Your task: 
     - Understand the rules and be ready to explain them.
     - Try with a few examples: "000", "111", "011", etc.
     - Write the rules on index cards (one per card) in the given order.
     """

     During the simulation challenge, the groups in the triple take turns to simulate each other's models for a given input.

     The instructor should have a few input strings on cards to give to the triples.

     This design should work within the time and with the materials.

     The activity cannot reproduce the full historical convergence (which involved models for arbitrary input and proofs of equivalence) and the informal notion of computability. The instructor will have to explain that in the debrief.
