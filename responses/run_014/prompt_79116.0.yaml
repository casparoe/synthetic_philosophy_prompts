  ### Session Design: Experiencing the Church-Turing Convergence  
  **Goal:** Students discover the convergence of computational models through hands-on construction and simulation, then confront the gap between empirical convergence and proof.  

  ---

  #### **Materials to Prepare in Advance**  
  1. **Index Cards** (100+):  
     - 60 cards pre-labeled:  
       - *Model A (Tape Machine)*: `[State: S0]`, `[State: S1]`, `[Symbol: 0]`, `[Symbol: 1]`, `[Move: ←]`, `[Move: →]`, `[Write: 0]`, `[Write: 1]` (20 cards).  
       - *Model B (State Machine)*: `[State: A]`, `[State: B]`, `[Input: 0]`, `[Input: 1]`, `[Output: 0]`, `[Output: 1]` (20 cards).  
       - *Model C (Rule Applier)*: `[Rule: 0→1]`, `[Rule: 1→0]`, `[Rule: X→Y]` (abstract primitive), `[String: ...]` (e.g., `[String: 101]`) (20 cards).  
     - 40 blank cards (for custom extensions).  
  2. **Handouts** (1 per group):  
     - Simple computational tasks (e.g., *Flip all 0s to 1s*, *Count the number of 1s mod 2*).  
     - Rules for each model (see below).  
  3. **Whiteboard Setup:**  
     - Left: "Computational Tasks" (list of 3 tasks).  
     - Right: "Simulation Challenge Rules".  

  ---

  #### **Timeline (90 Minutes)**  
  **1. Introduction (5 min)**  
  - **Instructor:** "Today, we’re engineers in 1930. Your goal: Design mechanical devices to solve computational tasks. Use index cards to build your device’s rules. We’ll share and test them later."  
  - Assign groups (6 groups of 3–4 students; 2 groups per model type).  

  **2. Group Work: Building Devices (30 min)**  
  - **Groups receive:**  
    - Model-specific cards + blank cards.  
    - Handout with:  
      - **Task 1:** Flip all bits (e.g., `010` → `101`).  
      - **Task 2:** Output 1 if the number of 1s is even, else 0.  
      - **Task 3 (Advanced):** Reverse the input string (e.g., `110` → `011`).  
    - *Model Rules:*  
      - **Model A (Tape Machine):**  
        - Tape: Finite sequence of symbols.  
        - Head: Reads/writes symbols, moves left/right.  
        - Rules: `(Current State, Read Symbol) → (New State, Write Symbol, Move)`.  
      - **Model B (State Machine):**  
        - Finite states + input/output alphabet.  
        - Rules: `(Current State, Input) → (Next State, Output)`.  
      - **Model C (Rule Applier):**  
        - String rewriting: Apply rules like `X → Y` to the leftmost match until no rules apply.  
  - **Group Goal:** Build a device for **Task 1** and **Task 2** using their model.  
  - *Predictable Issues:*  
    - **Magical Primitive (e.g., Model C):** A group adds `[Rule: ?→Answer]` to skip steps.  
      - *Response:* Ask: "Does this rule reflect a mechanical step? Could a person execute it without intuition?" (Let peers debate).  
    - **Overfitting:** Groups optimize for one task but struggle with others.  

  **3. Simulation Challenge (30 min)**  
  - **Regroup:** Pair Model A with Model B, Model B with Model C, etc. (e.g., Tape Machine ↔ State Machine).  
  - **Rules:**  
    - Group 1 explains their device to Group 2.  
    - Group 2 *uses their own model’s cards* to simulate Group 1’s device on **Task 2**.  
    - Both groups verify outputs (e.g., `010` should give `1` for even 1s).  
  - **Whiteboard:**  
    - "Challenge Log": Groups record if simulation succeeded (✓) or failed (✗).  

  **4. Convergence Discussion (10 min)**  
  - Groups share results. Most will succeed for Tasks 1–2 but fail on Task 3 (reversal).  
  - **Instructor:** "You all built different devices, yet they solved the same tasks. Is this coincidence? Or a pattern?"  

  **5. Debrief: The Epistemic Gap (15 min)**  
  - **Map to Church-Turing Thesis:**  
    - *Convergence:* "You arrived at similar capabilities from different starting points—just like Turing, Church, and Post. This is empirical evidence."  
    - *Not Proof:*  
      - "Did you *prove* all models are equivalent? No—you tested limited tasks. What about **Task 3**? What about *all possible* tasks?"  
      - "Your models assumed finite tapes/strings. Real computability requires unbounded memory (e.g., Turing’s infinite tape)."  
      - "The magical primitive? It violated mechanicality—the thesis requires no ‘oracles’."  
  - **Unsimulatable Element:**  
    - "The thesis claims equivalence to an *informal* notion: ‘what humans compute mechanically’. Your devices formalized steps, but the intuition of ‘mechanical’ remains unprovable. We rely on the weight of convergence."  
  - **Evidence Against?**  
    - "What would falsify the thesis? A clear example of a human-computable function *no formal model captures*. None exists... yet."  

  ---

  #### **Predictable Issues & Responses**  
  1. **Magical Primitive in Model C:**  
     - Groups may invent a rule like `[Input] → [Output]` to avoid step-by-step work.  
     - *Response:* "Does this rule reflect a ‘mechanical step’? If not, it’s an oracle—something we forbid. Try breaking it into smaller steps."  

  2. **Overfitted Devices:**  
     - A Tape Machine group might hardcode transitions for `010` but fail on `111`.  
     - *Response:* Ask other groups: "Can your model simulate *their* device? If not, why? What’s missing?"  

  3. **Simulation Fails on Task 3:**  
     - Most groups will fail to simulate string reversal with their devices.  
     - *Why?* Their models lack memory/resources (e.g., finite tape).  
     - *Use:* Highlight that convergence requires universality—real models (Turing machines) handle unbounded tasks.  

  ---

  #### **What the Activity Can’t Replicate**  
  - **The Informal Notion of Computation:** Students formalize rules but don’t interrogate what "mechanical" *means*. You must clarify:  
    > "The thesis bridges an intuitive idea (human computation) to a formal one (Turing machines). No experiment can prove this—it’s a defensible claim, not a theorem. Your convergence is compelling, but it’s a *scientific* consensus, not a proof."  

  ---

  **Outcome:** Students experience convergence organically and confront its limits. The debrief transforms their frustration (e.g., Task 3 failure) into epistemic clarity: *Evidence ≠ Proof*.
