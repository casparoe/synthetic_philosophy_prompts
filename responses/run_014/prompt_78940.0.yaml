prompt: |-
  Write a short internal FAQ — the kind of procedural document a company circulates to new employees, in numbered question-and-answer form, deadpan throughout, roughly 700 words — for an organization that has replaced all of its ordinary decision-making with majority votes, on the authority of the Condorcet jury theorem. The comedy has to come from the theorem's actual conditions rather than from generic jokes about committees: the piece should be funny to someone who teaches the result and still legible to someone who has never heard of it, and it must never announce, summarize, or wink at the objections it is enacting. Let the organization keep the theorem's assumptions in the letter of its policies and betray them in their spirit — an onboarding process that guarantees every voter receives the same information and attends the same briefing; a competence requirement satisfied by an examination the organization writes and grades itself; a standing commitment to keep hiring voters, since more voters means more certainty; a ban on discussing a question before voting, justified by the need for independence; a practice of putting every question to the whole staff, including questions on which the staff is no better informed than a coin. At least once the arithmetic should be allowed to show: the FAQ should state, in the flat voice of policy, what becomes of a majority's accuracy when the voters are worse than chance and the body grows. The organization should also have run into the fact that its majorities can cycle — it prefers the first option to the second, the second to the third, and the third to the first — and should treat the resulting dependence on which questions are put in what order as a matter for the office that sets the agenda, without ever remarking that this is where the power now sits. A short, quoted dissenting memo from an in-house statistician may be included, provided it stays inside the corporate register. End on a line that a reader could take as either reassuring or appalling, and do not explain which.
reasoning: |-
  Okay, the user wants me to create a satirical internal FAQ for a company that bases all decisions on the Condorcet jury theorem. This is a sophisticated request requiring understanding of both the mathematical theorem and bureaucratic humor. 

  The Condorcet jury theorem states that if voters are independent and each has better than 50% chance of being correct, majority decisions become more reliable as group size increases. The humor must come from literal implementation of the theorem's assumptions while violating them in practice.

  Key elements to include:
  - Mandatory identical briefings violating independence
  - Self-graded competency tests
  - Continuous hiring since more voters improve accuracy
  - No discussion policy
  - Applying voting to completely random decisions
  - Showing math when voters are worse than random
  - Agenda-setting power due to voting cycles
  - Deadpan corporate tone throughout

  I need to avoid explaining the joke or winking at the audience. The comedy should emerge from the contrast between the theorem's assumptions and the organization's implementation. The ending should be ambiguously reassuring/appalling.

  The user seems knowledgeable about probability theory and corporate satire. They likely want something that works on multiple levels: as an onboarding document parody, as a commentary on bureaucratic absurdity, and as a mathematical in-joke. The challenge is maintaining strict deadpan delivery while exposing the flaws through policy details.

  For structure, I'll use standard FAQ format with questions employees would logically ask. Each answer will reveal another absurd consequence of rigidly applying the theorem while violating its spirit. The dissenting memo will use corporate-speak to hint at problems without breaking character.

  The math demonstration will be crucial - stating plainly how accuracy decreases when voters are incompetent, presented as neutral policy. The agenda-setting power will be treated as normal procedure, not as the real seat of power.

  Final line must land perfectly ambiguous - something like "voting continues" that could sound either resilient or horrifying depending on interpretation. No explanation given.
answer: |-
  **Internal Policy FAQ: Collective Decision Protocol (CDP) v3.1**

  **1. What is the Collective Decision Protocol (CDP)?**
  The CDP is our organization's sole framework for determining all operational, strategic, and procedural outcomes. Every decision requiring resolution is settled by a majority vote of all active staff members. This ensures optimal decision accuracy and leverages the collective competence of the organization, as mathematically demonstrated by the Condorcet Jury Theorem.

  **2. Why must all voters attend the Standard Pre-Vote Briefing (SPB)?**
  The SPB guarantees all voters possess identical baseline information relevant to the decision. Attendance is mandatory and tracked. The briefing material is centrally prepared, distributed exactly 24 hours before the vote opens, and constitutes the *only* permissible information source for deliberation on the vote question. Consistent information parity is a foundational requirement for valid aggregate judgment.

  **3. How is "Individual Competence" established for voting eligibility?**
  All new hires must pass the Standardized Voter Competency Assessment (SVCA) within their probationary period. The SVCA, developed and graded internally by the Office of Policy Integrity (OPI), confirms a baseline probability of correct judgment exceeding random chance (p > 0.5). Successful completion grants permanent voting rights. Refresher assessments may be administered biannually.

  **4. Why does the organization prioritize continuous hiring?**
  The Condorcet Jury Theorem establishes that the probability of a correct majority decision strictly increases as the number of competent voters grows. Therefore, expanding the voting body is a primary strategic objective to enhance decision certainty. Hiring targets are set quarterly by the OPI based on projected vote volume and desired confidence intervals.

  **5. Can I discuss the vote question with colleagues after the SPB?**
  No. Pre-vote discussion of the merits of the vote question is strictly prohibited. This ensures the independence of individual judgments, a critical condition for the theorem's validity. Collaboration risks introducing correlated errors, degrading the aggregate outcome. Suspected discussion should be reported anonymously via the Policy Compliance Portal.

  **6. Does every issue really require a full-staff vote?**
  Yes. The CDP applies universally, encompassing matters ranging from strategic pivots ("Shall we enter the Antarctic market?") to routine operations ("Shall the breakroom coffee blend be 'Morning Roast' or 'Bold Awakening' next quarter?"). The theorem's power resides in aggregating individual judgments, regardless of the question's inherent complexity or the electorate's specific domain expertise relative to that question. All votes carry equal procedural weight.

  **7. What happens if the average voter competence is... below optimal?**
  The theorem quantifies the relationship between individual competence (p), group size (n), and majority accuracy. While we strive for p > 0.5 via the SVCA and SPB, the model remains applicable. Crucially, if the average probability of a correct vote (p) is less than 0.5, the probability of a *correct* majority decision *decreases* as more voters are added. This underscores the importance of rigorous SVCA standards and SPB adherence. The OPI monitors aggregate decision outcomes for trends requiring intervention.

  **8. How are conflicting pairwise preferences resolved (e.g., Option A beats B, B beats C, but C beats A)?**
  Such cyclical majorities, while statistically possible, are resolved procedurally. The Agenda Management Office (AMO) establishes the initial sequence of pairwise votes or formulates the final choice set presented (e.g., Ranked Choice ballot). The AMO's sequencing protocol ensures a definitive outcome is always reached. Concerns regarding specific sequencing should be directed to the AMO via standard channels.

  **9. Is there any review of the CDP's effectiveness?**
  The OPI continuously audits vote outcomes and SVCA performance. A recent internal statistical analysis memo noted: *"While the theoretical asymptotic convergence is robust under ideal conditions, persistent low-information environments (p ≈ 0.5) combined with mandatory universal suffrage on all questions may yield aggregate accuracy gains statistically indistinguishable from random for certain question classes, suggesting potential efficiency refinements."* (OPI Memo #4472-b). This analysis informs ongoing SPB and SVCA optimization efforts.

  **10. How can I ensure my vote is counted?**
  Log in to the Central Decision Hub (CDH) portal during the designated 2-hour voting window following the SPB. Votes are anonymous and immutable once cast. Technical issues must be reported to IT Support *before* the window closes. Failure to vote without documented OPI-approved exemption impacts your performance evaluation ("Organizational Participation" metric).

  **11. What if a vote outcome seems clearly detrimental?**
  All CDP outcomes are binding and final. The theorem guarantees that, over time and with sufficient competent voters, the majority will be correct more often than not. Questioning a specific outcome based on personal judgment undermines the system's mathematical foundation. Focus on enhancing your individual competency (utilize SVCA prep materials) and contributing to organizational growth (refer potential hires).

  **12. Who holds ultimate responsibility under the CDP?**
  Mathematical truth. The process is the authority. The AMO sets the sequence, the OPI upholds the conditions (SPB, SVCA, hiring), and the electorate collectively determines the outcome. Responsibility is distributed and emergent, as per the model.

  **13. How does this scale for urgent decisions?**
  The SPB and voting window protocols apply universally. "Urgency" is factored into the AMO's scheduling prioritization. Deliberation time is incompatible with independence. A correct, slightly delayed decision is superior to a swift, potentially incorrect one. Planning mitigates perceived urgency.

  **14. What is the future of the CDP?**
  Expansion. We will hire more competent voters. We will refine the SPB and SVCA. We will vote on more questions. The majority will become more certain. The process continues.
