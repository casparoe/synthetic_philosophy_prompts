answer: |-
  1.  **Must correctly classify paradigmatic clear cases:** The account must robustly identify uncontroversial verbal disputes (e.g., "Is Pluto a planet?" hinging solely on definition) and substantive disputes (e.g., "Does this drug cause side effect X?" where definitions are agreed but facts contested) as such. *Motivation:* Failure here renders the protocol useless for its core purpose; these are the anchors. *Non-negotiable.*
  2.  **Must preserve the distinction between meaning and fact:** The account must not conflate disagreement about how a term *should apply* (meaning/definition) with disagreement about the *properties* of the entities under discussion (fact/world). *Motivation:* Collapsing this distinction makes all disputes potentially verbal or substantive, destroying the protocol's function. *Non-negotiable.*
  3.  **Must respect that meaning has both public anchor points and potential variation:** The account must acknowledge that terms have core shared public uses anchoring communication ("water" means H₂O) while allowing for contextual nuance, vagueness, or differing technical stipulations without *always* declaring disputes verbal. *Motivation:* Ignoring shared meaning makes agreement impossible; ignoring variation falsely flags substantive disagreements in specialized contexts as merely verbal. *Non-negotiable.*
  4.  **Must be checkable by disputants without prior meta-semantic resolution:** Disputants must be able to apply the diagnostic procedure *from within* their disagreement, using their current understanding of the terms and the world, without first agreeing on a theory of reference or meaning. *Motivation:* Requiring meta-semantic consensus begs the question, as such consensus is often the *source* of the dispute; practicality demands internal application. *Negotiable (but highly desirable for practicality).*
  5.  **Must not presuppose a specific, contested meta-semantic view:** The account cannot *rely* on premises that inherently favor one side's implicit theory of how words hook onto the world (e.g., descriptivism vs. causal-historical theories) to declare a dispute verbal or substantive. *Motivation:* Begging the question against one disputant undermines neutrality and makes the diagnosis unacceptable to them. *Non-negotiable.*

  **Tension:** Desiderata 4 (internal checkability) and 5 (meta-semantic neutrality) conflict. Applying a procedure *from within* disputants' differing understandings inherently risks building in their contested meta-semantic assumptions. A truly neutral account might *require* meta-semantic agreement for conclusive diagnosis, violating Desideratum 4.
