  For each desideratum, I need to include the requirement, a motivating case, and whether it's negotiable or not. The user specifically mentioned a potential tension between the account being checkable by disputants themselves without settling meta-semantics and it not begging questions against either side. I should address this if relevant.

  Considering the key elements: First, the account must correctly classify clear cases. There are universally agreed verbal disputes (like "is a tomato a fruit or vegetable?") and substantive ones (like "does smoking cause cancer?"), plus murky middle cases (like philosophical debates on "free will"). Correct classification is non-negotiable because mislabeling could derail real disagreements or waste time on word games.

  Second, it must respect that meaning is shared enough for communication but can have variation. Words have public definitions but also personal nuances. If it ignores this, it might force false agreements or miss verbal elements. This is non-negotiable to avoid distorting how language actually works in disputes.

  Third, it shouldn't collapse into meta-semantic disagreements. For example, arguing about what "truth" means could be verbal itself, so the account must not depend on resolving those meta-issues. Non-negotiable, as otherwise it pushes disputes to a higher, messier level.

  Fourth, it must be usable by the disputants during the argument. They should apply it without external arbitration or settling contested theories. But this clashes with the fifth point: not begging questions. If disputants have to use the account impartially, but their meta-semantic views differ, it might require them to accept premises they reject, like a shared meaning framework.

  The tension I see is between desiderata 4 and 5. Desideratum 4 demands internal checkability for practicality, while desideratum 5 insists on neutrality to avoid bias. In practice, if disputants have deep-seated disagreements about how meanings are fixed, applying a neutral test might implicitly favor one view, making it question-begging. For instance, if one side thinks meanings are determined by community use and the other by personal intention, any test assuming one over the other could be rejected.

