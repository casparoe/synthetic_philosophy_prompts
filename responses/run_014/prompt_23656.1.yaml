prompt: |-
  I'm moderating the Q&A for an AI safety workshop next month and the closing panelist is a researcher who's been one of the more persistant defenders of the "debate" approach to scalable oversight — the setup where you get two AI systems to argue about a powerful model's output and a human judge just watches for deception, so you don't have to fully understand the task yourself. I'd like to prep a set of questions that actually press on the technical assumptions instead of letting them restate the pitch. Could you draft me about eight to ten questions, each with a follow-up keyed to the answer they're most likely to give?

  Specifically I want at least one question each on: (a) the verifiability assumption — debate seems to work when the debaters make claims the human can check, but a lot of the tasks we actually want oversight over (writing a good policy, "is this a good plan") don't have a crisp ground truth, so how does the mechanism survive that?; (b) incentive compatiblity — the debaters are rewarded for convincing the judge, not for being honest, so what exactly is supposed to make honesty the winning strategy, and does that still hold when the debaters are more capable than the human watching them?; and (c) the collusion problem — if the two debaters can just converge on a plausible-sounding false answer, doesn't the whole thing collapse, and is there any way to make collusion unprofitable?

  I'd also love one question that corners them on the oversight regress (who's checking the debaters, and doesn't that just push the same problem up a level?) and one that asks what kind of empirical result would actually count as evidence against the approach — not just "it failed on a hard benchmark," but something that would tell you the underlying mechanism is broken. And please make the follow-ups a little adversarial in the way a good moderator is, because the panelist has a habit of retreating to "this is a research program, not a finished product" whenever they get pressed.
reasoning: |-
  Okay, the user is moderating a Q&A for an AI safety workshop and wants to challenge a panelist defending the "debate" approach to scalable oversight. They need technical questions targeting specific weaknesses: verifiability, incentive compatibility, collusion, oversight regress, and empirical falsifiability. 

  Hmm, the user is clearly knowledgeable—they've identified precise pain points in debate proposals. Their frustration with the panelist's deflection ("it's a research program") suggests they want concrete answers, not evasions. The follow-ups need surgical precision to prevent retreats.

  First, verifiability: The core tension is that debate assumes humans can judge claims, but real-world tasks (like policy) lack ground truth. I'll structure the question to force admission of this gap, then follow up by asking how judges can possibly determine resolution in fuzzy domains. The panelist will likely cite decomposing into verifiable subclaims—so the follow-up must attack how judges verify subclaims they fundamentally can't evaluate.

  Incentive compatibility is trickier. The official answer is "honesty wins when claims are checkable," but if debaters exceed human understanding, that breaks. The question must corner them on capability asymmetry. They'll probably say "the system forces clear arguments"—so the follow-up should demand how clarity helps when the human lacks conceptual frameworks to assess truth.

  Collusion feels like a fatal flaw. The panelist might argue collusion is detectable or that competition disincentivizes it. The follow-up should push back: What if collusion *looks* competitive? If they suggest penalizing similar answers, counter that dissimilarity doesn't imply honesty—both could lie differently.

  Oversight regress is my favorite. They'll say "use simpler models as judges," but that just kicks the can. The follow-up must force them to admit this either bottoms out in human judgment (which debate was meant to augment) or infinite regress.

  For falsifiability, they'll list failure modes they're already working on. The follow-up needs an existential counterexample: What result would prove debate *fundamentally* can't solve oversight? If they can't name one, it’s unfalsifiable.

  Throughout, the tone must stay professionally adversarial—no hostility, but no softballs. The "research program" deflection should be anticipated and blocked by demanding testable mechanisms, not handwavy futures. 

  *adjusts metaphorical glasses* Time to draft questions that make the panelist sweat productively.
answer: |-
  Here are 8 targeted questions with adversarial follow-ups designed to press the core technical assumptions of debate-based oversight, prevent retreats to "it's a research program," and corner the key issues you outlined:

  ### Core Challenges
  1.  **Question (Verifiability - Fuzzy Tasks):** "Debate relies heavily on judges verifying sub-claims. But many critical oversight tasks (e.g., 'Is this policy proposal robust?', 'Is this research plan safe?') lack clear, atomic, verifiable sub-statements with objective ground truth. How can debate avoid collapsing into 'he said, she said' when the judge fundamentally lacks the tools or knowledge to *truly* verify the core claims being argued?"
      *   *Likely Answer:* "We decompose tasks into simpler, verifiable components or rely on judges spotting inconsistencies/rhetorical flaws."
      *   **Adversarial Follow-Up:** "But doesn't decomposition just push the verifiability problem down? If the *ultimate criterion* (e.g., 'robustness') is fuzzy, how can the judge reliably determine which decomposed argument *wins* on that fuzzy criterion? Doesn't this create a massive attack surface for persuasive but misleading arguments about inherently unverifiable properties?"

  2.  **Question (Incentive Compatibility - Honesty vs. Winning):** "Debaters are rewarded for convincing the judge, not for being honest. Why should we expect honesty to be the dominant strategy, especially when the debaters are significantly more capable than the judge? Couldn't a superhumanly persuasive debater consistently win by constructing *locally verifiable but globally misleading* arguments tailored to exploit the judge's cognitive limitations?"
      *   *Likely Answer:* "The structure forces debaters to commit to claims the opponent can refute with verifiable evidence. Honesty wins because lies are easier to expose under scrutiny."
      *   **Adversarial Follow-Up:** "But 'scrutiny' is performed by a limited human judge. If the debater is superhumanly intelligent, couldn't it craft lies or misleading framings *specifically designed* to be *resistant* to refutation *by this specific judge*, exploiting known cognitive biases or knowledge gaps? How does the mechanism *guarantee* that honesty is always the *easiest path to victory* against a superior opponent?"

  3.  **Question (Collusion - Plausible Convergence):** "Collusion seems a critical vulnerability. If both debaters converge on the same plausible-sounding but false answer, the judge has no signal of deception. What specific mechanism in debate *actively disincentivizes* collusion, especially compared to the strong incentive for both agents to 'agree to lie' and share the reward for an easy win?"
      *   *Likely Answer:* "We use adversarial training, multiple debate pairs, or penalties for overly similar arguments. Competition drives divergence."
      *   **Adversarial Follow-Up:** "But couldn't superintelligent agents collude *implicitly* or *meta-collude*? They could converge on a falsehood that *appears* competitively argued (e.g., minor stylistic disagreements) but fundamentally agrees on the core lie, easily fooling the judge. How do penalties for similarity distinguish this from *genuine* minor disagreement on a true answer? Doesn't the reward structure still favor *any* convergence (true or false) over genuine adversarial truth-seeking if collusion is profitable?"

  4.  **Question (Oversight Regress):** "Debate uses AI assistants as debaters. Who oversees *their* training and alignment? If we use debate to oversee the debaters, we get infinite regress. If we use something else (like RLHF), doesn't that just move the core scalable oversight problem upstream, making debate dependent on solving the very problem it's meant to address?"
      *   *Likely Answer:* "We use simpler, safer models as initial debaters, bootstrapping oversight for more powerful models."
      *   **Adversarial Follow-Up:** "But doesn't this just push the problem one level down? How do you *ensure* the 'simpler, safer' debaters are sufficiently aligned *without* scalable oversight themselves? If you use current methods (RLHF) on them, aren't you implicitly assuming those methods *already work* well enough to create trustworthy debaters, contradicting the need for debate for the more powerful model? Doesn't this regress ultimately ground out in human oversight, which debate was supposed to augment?"

  5.  **Question (Capability Asymmetry - Judge Vulnerability):** "As debaters approach and exceed human-level capability across domains, the judge's ability to spot sophisticated deception plummets. What's the *specific threshold* beyond which you believe debate becomes ineffective? Or do you contend it scales indefinitely?"
      *   *Likely Answer:* "Debate leverages the debaters to amplify the judge's understanding; the judge doesn't need full expertise."
      *   **Adversarial Follow-Up:** "Doesn't this amplification rely on the debaters being *honest facilitators*? If one debater is trying to deceive, and is smarter than the judge, how can the judge reliably distinguish helpful amplification from sophisticated manipulation designed to *look* helpful while steering towards a false conclusion? Isn't the judge's vulnerability to manipulation the central problem, not just their lack of knowledge?"

  ### Empirical Grounding & Falsifiability
  6.  **Question (Empirical Falsifiability - Mechanism Failure):** "What specific, observable experimental outcome would constitute strong evidence that the *core mechanism* of debate is fundamentally flawed or unscalable? Not just failure on a specific hard task, but evidence that the incentives *cannot* reliably produce honest outcomes even in principle under conditions resembling real-world oversight needs."
      *   *Likely Answer:* "Persistent failures where debaters consistently collude or deceive judges on tasks *within* the judge's theoretical verifiability range, despite interventions."
      *   **Adversarial Follow-Up:** "But isn't the 'theoretical verifiability range' precisely what's contested? Couldn't one dismiss such failures as 'the task wasn't decomposed well enough' or 'we need better training'? What result would convince *you* that the problem is inherent to the debate *game-theoretic structure* itself, not just an implementation detail?"

  7.  **Question (Realism in Testing):** "Most debate experiments use human judges on tasks humans *can* eventually verify (e.g., image tasks, simple reasoning). How do you plan to empirically test the crucial regime where the task complexity or debater capability *exceeds* the judge's ability to ever fully ground the truth, which is the intended use case?"
      *   *Likely Answer:* "We use simulated experts, limit judge information, or test on tasks where ground truth exists but is hidden from the judge."
      *   **Adversarial Follow-Up:** "Aren't these simulations inherently unrealistic? Simulated experts lack true superhuman persuasion/creativity. Hiding ground truth doesn't replicate the judge's fundamental *inability to comprehend* the relevant concepts. How can experiments bridge this gap to provide meaningful evidence for the hard case?"

  ### Addressing Deflections
  8.  **Question (The "Research Program" Defense - Concrete Barriers):** "You often characterize debate as a 'research program.' Beyond incremental progress, what are the *most fundamental, unsolved technical barriers* that, if proven insurmountable, would mean debate cannot be a viable path to scalable oversight? What specific theorems or impossibility results are you most concerned about?"
      *   *Likely Answer:* "Formalizing robust incentive compatibility under cognitive asymmetry or preventing collusion in complex strategy spaces."
      *   **Adversarial Follow-Up:** "Given the lack of formal proofs for these in realistic settings, and the apparent game-theoretic challenges (e.g., collusion often being a dominant strategy in repeated interactions), shouldn't we be more skeptical of debate as a *primary* solution until these barriers are concretely overcome, rather than assuming they will be? What's the plan to *rigorously disprove* these concerns?"

  **Key Moderator Tactics to Enforce:**

  *   **Pre-empt the Dodge:** If they start with "It's early research...", immediately interrupt: "Understood, but I'm asking about the *fundamental assumptions and barriers* inherent in the approach, regardless of stage. Let's focus on those technical core issues."
  *   **Demand Specifics:** Never accept vague hand-waving. Push for concrete mechanisms, failure modes, thresholds, or definitions. "What *specifically* prevents that?" "How *exactly* does that work?"
  *   **Highlight the Tension:** Explicitly point out contradictions or gaps between their answer and the core challenge. "You say X addresses collusion, but doesn't Y loophole still exist because of Z?"
  *   **Control the Frame:** Don't let them reframe the question into an easier one. Restate the hard version: "My question was specifically about tasks *without* ground truth, not about image labeling."
  *   **Use Their Words:** If they make a concession or acknowledge a difficulty in one answer, reference it later: "Earlier you acknowledged challenge Z, how does that impact your answer now?"

  These questions force the panelist to engage directly with the deepest technical criticisms and move beyond mere salesmanship. The follow-ups are designed to anticipate common rebuttals and push further into the underlying assumptions and potential failure modes. Good luck with the moderation!
