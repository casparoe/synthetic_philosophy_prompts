     - **Translation**: Clean at a high level. Natural selection is an optimization process that increases fitness. But note:
       - SGD is a directed, hill-climbing process that can get stuck in local optima, just like natural selection.
       - However, SGD is guided by an explicit reward function, while natural selection is driven by implicit fitness consequences. This difference might be important because in AI, the reward function is known and set by the programmer, whereas in biology, fitness is an emergent property.
