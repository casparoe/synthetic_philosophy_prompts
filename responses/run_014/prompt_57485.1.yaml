  The model answer should resist summary-style writing. It must demonstrate how to work through the case: first dissecting system eligibility, then exposing S3's emptiness even with natural properties, before landing the hammer - that without intrinsic traces, neither counterfactuals nor explanations can appeal to anything beyond the Humean mosaic. 

  For the marking scheme, I'm building traps: 
