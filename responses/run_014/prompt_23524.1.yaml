  ok so i'm a student in a philosophy of mind seminar and i'm moderating the Q&A after a talk next weeek by a philosopher who defends the higher-order thought theory of consciousness (the idea that a state is conscious just in case it's targeted by a higher-order representation). can you write me a sequnce of questions that go way beyond having her restate the view: i want at least one question each on the blindsight problem, on the regress problem (why the higher-order state itself doesn't need its own higher-order state to be conscious), and on what the theory says when the higher-order representation misrepresents the first-order state -- and for each, a follow-up keyed to the reply she's most likely to give, that makes it a little harder to use than the one before.
