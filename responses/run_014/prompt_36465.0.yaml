prompt: |-
  Under most endangered-species legislation, the protected unit is the species, and the following pattern is typical. First, protection tracks current taxonomy: when a review committee splits a widespread coastal bird into three species, two of the new species are instantly rare and eligible for listing, and funding follows the change in classification without any change in the field; when the committee later lumps them back together, the protection lapses although not a single animal has died. Second, hybrids receive nothing: an animal descended partly from a protected wild canid and partly from a common one is excluded from the captive-breeding programme and, in some schemes, culled — not for any defect in the individual animal, but purely because of its mixed ancestry. Reconstruct the implicit view of what a species is that these two rules rest on. Does the pattern presuppose that species are natural kinds with essences, so that cross-breeding is a kind of dilution or pollution, or is it equally at home with the view that species are lineages or populations rather than classes, or with outright pluralism about species concepts? Distinguish what the practice strictly requires from what it merely fits well with, and identify where it is philosophically underdetermined — that is, which rival accounts of the species problem would license exactly the same two rules. Finally, say what concretely would have to change in either rule if the unit of protection were populations or lineages rather than species.

  Please answer in British English, as exactly five numbered items of a sentence or two each, with no introduction or conclusion — for instance: one item stating the implicit view of species, one on the essentialism question, one on what is strictly required rather than merely convenient, one on the rival accounts that would license the same rules, and one on what would change under population- or lineage-based protection.
reasoning: |-
  Hmm, the user wants me to analyse how endangered-species legislation handles species classification and protection. They've described two key patterns: protection changes instantly when taxonomy is revised through splitting or lumping species, and hybrids are excluded from protection purely based on ancestry. I need to reconstruct the implicit view of species underlying these rules.

  Looking at the first rule about taxonomy changes, it's clear that species are treated as discrete categories defined by classification decisions rather than biological reality. Protection shifts immediately with taxonomic revisions, even when no actual population changes occur. This suggests species are viewed as fixed entities with clear boundaries.

  The second rule about hybrids is particularly interesting. The exclusion of hybrids regardless of individual fitness implies ancestry-based purity concerns. This feels reminiscent of essentialist thinking where species have immutable essences that get "diluted" through hybridization. It's troubling how this mirrors problematic historical notions of racial purity.

  For the essentialism question, while the rules fit well with essentialist views, they don't strictly require them. Other frameworks like certain lineage concepts could also support these practices if they emphasize strict reproductive isolation. The key point is that the rules prioritize categorical purity over biological continuity.

  Regarding rival accounts, both typological essentialism and certain versions of the biological species concept (emphasizing reproductive isolation) would produce identical rules. Even some phylogenetic concepts focusing on monophyly could justify hybrid exclusion.

  Finally, if protection shifted to populations or lineages, everything would change. We'd protect local populations regardless of taxonomic status, and hybrids could be valued if they contribute to lineage persistence. This would better align with conservation biology principles focusing on ecological functions and genetic diversity rather than arbitrary categories.

  The user seems interested in the philosophical underpinnings of conservation policy, particularly how definitions impact real-world outcomes. There's an ethical concern here about whether current practices actually serve conservation goals. I should maintain a neutral tone while highlighting these implications.
answer: |-
  1.  The implicit view treats species as discrete, immutable categories defined solely by current taxonomic authority, where protection status depends entirely on official classification rather than biological reality or population dynamics.
  2.  The rules fit well with an essentialist view, particularly the exclusion of hybrids suggesting a notion of pure, inviolable essences vulnerable to 'pollution', but they do not strictly require essentialism; they could also function under a strictly typological or phenetic concept focused solely on classification.
  3.  The practice strictly requires only that species be defined by authoritative taxonomic fiat and treated as fixed units with hard boundaries; it does not inherently require biological essences, merely that classification dictates status, hybrids are deemed impure, and boundaries are absolute.
  4.  Rival accounts licensing the same rules include typological essentialism (defining species by essential traits), the strictest interpretations of the biological species concept (emphasing reproductive isolation as absolute), and potentially some monophyletic phylogenetic concepts if hybrids break clade purity – all share the core notion of fixed, non-overlapping categories.
  5.  Under population- or lineage-based protection, splitting/lumping would not automatically alter protection (local populations remain protected regardless of species name changes), and hybrids could be protected if they represent part of a lineage's evolutionary trajectory or contribute to population viability, removing the ancestry-based exclusion.
