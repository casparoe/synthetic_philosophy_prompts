prompt: |-
  I'm trying to sort out when looking before you leap is actually rational and when it isn't, given Good's theorem that free information never hurts an ideal expected utility maximizer. Can you give me the desiderata list for any decent theory of rational inquiry and info-seeking — like what cases it has to get right, what distinctions it has to respect, with the why behind each one?

  I'm especially thinking of cases like a free medical test you know you'll overreact to, learning something that changes what you care about like finding out the ending of a novel you're halfway through, and peeking in a game where the other player knows you will peek. Tell me which requirements are non-negotiable vs just nice to have for one camp, and if any two on your list can't both be satisfied at once, plus which single requirement rules out the most simple theories. Keep it focused on the criteria, not a big tour of who says what, and short enough I can realy use it as a checklist.
reasoning: |-
  Okay, the user is asking for a checklist of desiderata for any decent theory of rational information-seeking. They want to know what cases a theory must handle correctly and what distinctions it needs to respect. They specifically mention scenarios like a free medical test where you might overreact, learning a novel's ending which changes your preferences, and a game where peeking affects the opponent's behavior.

  First, I need to recall Good's theorem, which states that free information never harms an ideal expected utility maximizer. But the user points out cases where this doesn't hold, so the desiderata must address when information can be harmful. The user wants a focused list, not a survey of existing theories. They also want to know which requirements are non-negotiable, which are nice-to-have, and if any conflict.

  Let me start with the core non-negotiables. The first one has to handle instrumental harm. In the medical test example, even if the test is free, the subsequent irrational actions (like overreacting) make the information harmful. So the theory must account for non-rational responses to information. That's essential.

  Next, endogenous preference change. Learning the novel's ending alters what the user cares about, so their utility function changes based on the information. The theory needs to distinguish between information affecting beliefs versus preferences. Without this, it can't explain why spoilers are harmful.

  Then, strategic disclosure in games. If peeking affects the opponent's actions because they anticipate your move, that's a game-theoretic issue. The theory must incorporate how information-seeking influences others' strategies. This is crucial for interactive scenarios.

  Now, considering epistemic costs. If processing information takes cognitive resources, even "free" info isn't really free. The theory should acknowledge bounded rationality. But maybe this is secondary, as ideal theories might ignore it. Still, the user might want it as a nice-to-have.

  Another point is non-bayesian updating. If an agent doesn't update beliefs rationally (like ignoring base rates), information can lead to worse decisions. The theory must account for deviations from ideal updating. This ties into the medical test overreaction.

  Value of computational actions. Sometimes, not calculating expected utility is better due to computational costs. But this might be a refinement rather than core.

  Now, conflicts between desiderata. Handling instrumental harm (non-rational responses) and maintaining Good’s theorem might conflict. Good’s theorem assumes rational responses, so relaxing that allows explaining harm but at the cost of idealization. Also, separating preference change from belief change is tricky but necessary.

  The user's deeper needs: They likely want a framework to evaluate different theories of rational inquiry, especially in real-world cases where information can backfire. They might be developing a theory themselves or critiquing existing ones. Emphasizing the non-negotiables helps them filter inadequate theories.

  Prioritizing: Instrumental harm, endogenous preferences, strategic disclosure are non-negotiable. Epistemic costs and non-bayesian updating are important but maybe secondary. Value of computational actions is a refinement.

  Need to ensure the list is concise, actionable, and addresses the examples given. Make sure each desideratum has a clear "why" and the cases it covers.
answer: |-
  Here's a concise desiderata checklist for rational information-seeking theories, focusing on core requirements derived from the cases you mentioned. Non-negotiables (NN) are essential for handling fundamental paradoxes to Good's theorem; nice-to-haves (NH) address realism but aren't strictly required for coherence. Conflicts and key exclusions are noted.

  ---

  ### **Core Desiderata (Non-Negotiables)**
  1. **Handles Instrumental Harm (NN)**  
     *What it must get right:* Explains why *free* information can be harmful due to *subsequent irrational actions*.  
     *Case:* Medical test you'll overreact to (e.g., unnecessary surgery).  
     *Why:* If information triggers non-rational behavior (violating EU-maximization *after* learning), Good's theorem breaks.  
     *Distinction:* Separates *information value* from *agent's operational rationality post-learning*.

  2. **Handles Endogenous Preference Change (NN)**  
     *What it must get right:* Accounts for information altering goals/values, not just beliefs.  
     *Case:* Learning a novel's spoiler ruins aesthetic experience (shifts utility function).  
     *Why:* Rational choice requires stable preferences; if information *changes* what you optimize, EU-maximization pre-learning is incoherent.  
     *Distinction:* Separates *belief updating* from *preference updating*.

  3. **Handles Strategic Disclosure in Games (NN)**  
     *What it must get right:* Explores how *seeking* information signals intentions to others.  
     *Case:* Peeking in a game where the opponent anticipates and adjusts to your peek.  
     *Why:* Information acquisition can alter others' strategies, changing the game tree. Good's theorem assumes non-strategic environments.  
     *Distinction:* Separates *passive* information receipt from *active* information-seeking in interactive settings.

  ---

  ### **Important Refinements (Nice-to-Haves)**
  4. **Acknowledges Epistemic Costs (NH)**  
     *What it should ideally handle:* Cognitive/effort costs of processing information.  
     *Case:* Avoiding overwhelming data that distracts from core decisions.  
     *Why:* "Free" information isn't free if it consumes scarce cognitive resources.  
     *Distinction:* Separates *information access* from *information integration*.

  5. **Accommodates Non-Bayesian Updating (NH)**  
     *What it should ideally handle:* Agents who don't update beliefs via strict conditionalization.  
     *Case:* Medical test where patient misinterprets statistics (base-rate neglect).  
     *Why:* Real agents aren't ideal Bayesians; information can worsen decisions via biased updating.  
     *Distinction:* Separates *rational* belief revision from *predictable irrational* revisions.

  6. **Values Computational Actions (NH)**  
     *What it should ideally handle:* Rationality of *not* computing expected utilities.  
     *Case:* Deliberate ignorance to avoid decision paralysis.  
     *Why:* Computing EU can be costly; sometimes heuristic avoidance is optimal.  
     *Distinction:* Separates *meta-rationality* (managing cognitive effort) from *object-level rationality*.

  ---

  ### **Conflicts & Exclusion Power**
  - **Key Conflict:**  
    **NN1 (Instrumental Harm)** vs. **Good’s Theorem**.  
    *Why:* NN1 requires abandoning Good’s core premise (ideal post-learning rationality). Theories satisfying NN1 *must* reject universal applicability of Good’s theorem.

  - **Most Exclusionary Requirement:**  
    **NN2 (Endogenous Preference Change)**.  
    *Why:* It forces theories to model *dynamic utility functions*, ruling out all static EU-maximization frameworks (e.g., classic Bayesianism). Simple theories that ignore preference shifts fail instantly on cases like spoilers.

  - **Theorist's Dilemma:**  
    No theory can satisfy all NN while preserving Good’s theorem in full generality. You must choose between:  
    - Upholding Good’s theorem (sacrificing NN1–NN3), or  
    - Explaining harmful information (sacrificing universal validity of Good’s theorem).

  ---

  ### **Summary Checklist for Evaluation**
  | Requirement                  | Type  | Critical Cases Covered                  | Why Essential                                  |
  |------------------------------|-------|-----------------------------------------|-----------------------------------------------|
  | Instrumental Harm            | NN    | Medical test overreaction               | Post-learning irrationality breaks Good.      |
  | Endogenous Preference Change | NN    | Novel spoilers, transformative experiences | Information alters goals, not just beliefs. |
  | Strategic Disclosure         | NN    | Game peeking, signaling                 | Info-seeking changes others' actions.         |
  | Epistemic Costs              | NH    | Cognitive overload                      | Processing isn't free.                        |
  | Non-Bayesian Updating        | NH    | Biased interpretation of test results   | Real agents aren't perfect Bayesians.         |
  | Computational Actions        | NH    | Deliberate ignorance for simplicity     | Meta-rationality over object-level EUM.       |

  Use this to stress-test theories: A viable framework must satisfy all NN requirements. If it fails NN1–NN3, it cannot explain your core cases. NH requirements refine plausibility but don’t invalidate a theory if missed. The hardest trade-off is between NN2 and the simplicity of static utility models.
