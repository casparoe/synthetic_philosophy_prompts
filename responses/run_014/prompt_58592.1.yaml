  I should break down the two types of irrationality: synchronic (at a single time) and diachronic (over time). The trading cards case is synchronic irrationality due to intransitive preferences. The work location case involves diachronic irrationality because the sequence of actions leads to a dominated outcome, even though preferences at each time are consistent. Philosophers like McClennen and Gauthier argue for resolute choice, where you commit to a plan to avoid exploitation. Others, like Holton, emphasize managing temporary preferences without strict commitment. The user needs clarity on these different approaches.

