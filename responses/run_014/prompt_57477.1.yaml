answer: |-
  ## Dissecting "You Can't Legislate Morality": A Framing Statement for the Hart-Devlin Seminar  

  **Opening Remark for Thursday:**  
  "Last week’s intervention—that ‘you can’t legislate morality’—was elegant in its brevity, but its power lies in its ambiguity. Before we return to Devlin’s disintegration thesis or Hart’s harm principle, let’s map what that slogan *could* mean. Is it a truism? A factual claim? A moral stance? And crucially: does any reading refute Devlin, or merely restate a premise he already rejects? This handout dissects six interpretations. Our task today is to test which, if any, dissolves the debate."  

  ---

  ### HANDOUT: "You Can’t Legislate Morality" — Six Readings  

  **Core Ambiguities:**  
  - **"Can’t"**: Conceptual impossibility? Practical futility? Moral impermissibility?  
  - **"Legislate"**: Criminal prohibition only? Or taxes, licenses, education?  
  - **"Morality"**: Outward conduct? Inner motives? Moral beliefs? Shared social sentiment?  

  | Reading | Proposition (Resolved Ambiguity) | What’s Doing the Work? | Verdict | Engages Devlin? | Hart’s View |
  |---------|----------------------------------|------------------------|---------|-----------------|------------|
  | **1. Conceptual Impossibility (Inner States)** | "Law cannot directly regulate inner moral character or motives." | *Can’t* = conceptual impossibility; *Legislate* = any state action; *Morality* = inner virtue/motive. | **Platitude.** Law targets conduct, not souls. | **Irrelevant.** Devlin cares about *conduct* threatening social cohesion, not inner virtue. Concedes freely. | Also irrelevant—Hart agrees law regulates conduct. |
  | **2. Causal Inefficacy (Behavioral Futility)** | "Criminal prohibition cannot durably suppress conduct rooted in moral conviction." | *Can’t* = causal inefficacy; *Legislate* = criminal prohibition; *Morality* = conduct violating deep beliefs. | **Contestable empirical claim.** (See Prohibition, sodomy laws). | **Weakens Devlin if true.** But Devlin: law expresses/shapes sentiment (e.g., decriminalization signals approval). Hart: agrees efficacy matters but focuses on *principle*. | Could borrow—questions disintegration thesis’s empirical basis. |
  | **3. Moral Worth Undermined (Kantian)** | "Coerced conformity to duty lacks moral worth and corrupts virtue." | *Can’t* = normative undesirability; *Legislate* = coercion; *Morality* = virtuous action. | **Substantive normative claim.** | **Irrelevant.** Devlin seeks social order, not individual virtue. "I don’t care about their souls—I care about the glue." | Sympathetic but orthogonal—Hart fights moralism, not for virtue. |
  | **4. Liberal Restraint (No Paternalism/Moralism)** | "The state *ought not* to enforce moral standards for their own sake." | *Can’t* = normative impermissibility (masked as impossibility); *Legislate* = any enforcement; *Morality* = standards unrelated to harm. | **Substantive normative claim (Feinberg/Hart).** | **Restates Hart’s challenge, not refutes Devlin.** Devlin: society *may* protect its moral fabric pro tanto. Hart: this is core objection. | **Hart’s core position.** Rejects Devlin’s premise that morality alone justifies law. |
  | **5. Democratic Constraint (No Moral Absolutism)** | "Law cannot enforce morality *without broad social consensus*." | *Can’t* = practical infeasibility/illegitimacy; *Legislate* = criminal law; *Morality* = contested standards. | **Contestable empirical/normative.** (See unenforced laws). | **Devlin concedes—but consensus exists via "right-minded person" test.** His claim: law *presupposes* shared morality. | Could borrow—highlights gap between positive/critical morality. |
  | **6. Critical Morality Gap** | "Law cannot enforce *true/critical morality*—only prevailing prejudices." | *Can’t* = conceptual/practical failure; *Legislate* = all state action; *Morality* = rational/ideal ethics. | **Platitude if morality = critical; false if morality = positive.** | **Misses Devlin.** He defends enforcing *positive* (shared) morality. Hart: critical morality should judge law, not positive sentiment. | **Central to Hart.** Law enforcing positive morality may entrench injustice. |

  ---

  ### Key Observations:  
  1. **The Self-Undermining Objection**:  
     - Every law enforces *some* morality (e.g., property rights enforce moral views on ownership).  
     - **Devlin’s Absorption**: He embraces this—law *should* enforce shared morality. The slogan only bites against readings 4–6, which reject moralism.  
     - **Hart’s Move**: Distinguishes "harm-preventing" laws (enforcing minimal morality) from "moralistic" laws (enforcing controversial ideals).  

  2. **Which Reading Earned the Nod?**  
     Likely **Reading 4 (Liberal Restraint)**, stated as a self-evident truth. The class treated it as a conversation-ender because:  
     - It reframes Devlin’s "may" as a "cannot," collapsing normative dispute into faux-impossibility.  
     - It resonates with liberal intuitions (and Feinberg’s shadow).  
     - **To earn that nod**: The slogan must be heard normatively—"we *ought not* try"—masked as impossibility.  

  3. **Opening the Discussion Without Pedantry**:  
     > "Our task isn’t to ‘gotcha’ a slogan but to ask: **which version of ‘can’t’ would Devlin fear?** If it’s causal inefficacy (Reading 2), he’d cite law’s expressive power. If it’s liberal principle (Reading 4), he’d say it begs the question. Let’s test Reading 2 first: does history support the claim that criminalizing ‘immoral’ conduct never works? And if it fails, does Devlin win—or does Hart’s harm principle still block him?"  

  **Purpose**: Show the slogan isn’t an argument—it’s a placeholder for one. Force clarity, then reopen the debate on Devlin’s terms.  

  ---  
  *Handout designed for mixed-readiness seminar: Group 1 sees nuances; Group 2 grasps core ambiguities. Focus on structure (table) and accessible examples.*
