prompt: |-
  For the final paper in my civics course, I am supposed to defend a principle for who belongs in a democracy's electorate, but before defending any particular principle I want to know what such a principle actually has to accomplish. Please write out the requirements any adequate answer to the boundary problem — the question of who belongs to the demos — must meet: the cases it has to classify correctly (children, tourists, permanent residents, people convicted of serious crimes, citizens living abroad, future generations affected by today's environmental laws), the distinctions it cannot collapse (being affected by a decision, being coerced by it, and having a long-term stake in the community), and the constraints it cannot violate — including that it not be circular, since a demos cannot democratically vote itself into existence without already presupposing a demos. For each requirement, give the case or consideration that motivates it, and mark which requirements are genuinely non-negotiable and which are just the preferences of one camp. Then address the part I most want to see: whether some subset of the requirements is jointly unsatisfiable — I suspect the demand that everyone affected by a decision be included and the demand that the demos remain a bounded, deliberating unit cannot both be satisfied, given how easily "affected" spreads across borders. Finally, briefly score the all-affected-interests principle, the all-subjected-to-coercion principle, and stakeholder views against your list; keep that part short, since the requirements are the substance.
reasoning: |-
  Okay, the user is working on a civics final paper about defending a principle for who should be included in a democracy's electorate. They need to understand the requirements any adequate principle must meet before choosing one. Let me start by breaking down their query.

  First, they mentioned specific cases: children, tourists, permanent residents, convicted criminals, expats, and future generations. Each of these groups tests different aspects of a principle. For example, children are affected by decisions but typically excluded, which challenges the all-affected principle. Tourists might be affected temporarily but not long-term stakeholders. Permanent residents live there but might not be citizens, so a principle needs to address residency vs. citizenship.

  They also highlighted distinctions: affected vs. coerced vs. having a long-term stake. These are key because conflating them could lead to over- or under-inclusion. For instance, someone affected by a policy (like a tourist facing a local law) isn't necessarily coerced long-term or invested in the community. Future generations are affected by environmental policies but can't participate, so how does a principle handle that?

  The constraints include non-circularity. A demos can't vote itself into existence without presupposing a demos. That's a logical must. Also, the paradox between including all affected people and keeping the demos bounded. The user suspects these conflict, especially with globalization. I need to confirm if these are incompatible.

  The user wants to evaluate principles like all-affected, all-subjected, and stakeholder views against these requirements. But they want this part brief, focusing more on the requirements. So I should list each requirement, explain why it's necessary, and mark if it's non-negotiable or debatable. Then analyze the conflict between affected inclusion and bounded demos. Finally, quickly score the principles against the requirements.

  I need to ensure each requirement is tied to a case or distinction. Non-negotiable constraints like non-circularity and avoiding paradoxes are critical. Others, like including children or future generations, might be preferences of certain camps. Highlighting which are strict vs. flexible helps the user weigh different principles.

  The user's deeper need might be understanding the core challenges in defining the demos to build a strong defense for their chosen principle. They might also seek clarity on unavoidable trade-offs, especially the affected vs. bounded demos tension. Recognizing this conflict shows the complexity and informs their argument that no principle is perfect, but some handle trade-offs better.

  Scoring the principles: All-affected struggles with over-inclusion and feasibility. All-subjected handles coercion better but might exclude stakeholders. Stakeholder views are practical but might under-include affected parties. Each has trade-offs the user can evaluate against the requirements.
answer: |-
  Here are the core requirements any adequate principle for defining the demos must meet, categorized by their motivation (cases, distinctions, constraints), their negotiability, and an analysis of potential conflicts and common principles:

  **I. Requirements Motivated by Specific Cases (Must Classify Correctly):**

  1.  **Exclude Young Children:** The principle must justify why young children (e.g., infants, toddlers) are typically excluded despite being affected by decisions.
      *   **Motivation:** Universality of exclusion for this group; lack of capacity for reasoned political participation.
      *   **Negotiability:** **Largely Non-Negotiable.** While the *exact age* is contested, the core exclusion of the very young based on capacity is near-universal.
  2.  **Exclude Short-Term Tourists:** The principle must justify why temporary visitors are excluded.
      *   **Motivation:** Widespread practice; lack of long-term stake or subjection to enduring coercion; impracticality.
      *   **Negotiability:** **Mostly Non-Negotiable.** Inclusion is rarely seriously proposed for fleeting visitors.
  3.  **Include Permanent Residents:** The principle must justify why long-term, law-abiding residents (non-citizens) *should* be included.
      *   **Motivation:** Deep, enduring subjection to laws; significant long-term stake; affectedness; normative commitment to "no taxation without representation."
      *   **Negotiability:** **Contested.** A strong normative requirement for many democratic theorists, but practice varies (some democracies exclude them). Crucial case for testing inclusivity.
  4.  **Handle Convicted Crimons:** The principle must provide a rationale for inclusion/exclusion (e.g., disenfranchisement during incarceration, post-release, or never).
      *   **Motivation:** Practice varies; tests whether subjection/stake overrides punishment or perceived forfeiture of rights.
      *   **Negotiability:** **Contested.** Reflects differing views on punishment, rights forfeiture, and reintegration. A principle must *address* it coherently.
  5.  **Address Citizens Abroad:** The principle must determine if citizens living permanently abroad retain voting rights and why/why not.
      *   **Motivation:** Common practice (often exclusion after a period); tests enduring stake vs. lack of current subjection/affectedness.
      *   **Negotiability:** **Contested.** Practice varies; principle must provide a clear rationale for inclusion or exclusion.
  6.  **Address Future Generations:** The principle must grapple with the status of those profoundly affected by present decisions (e.g., climate policy) but not yet existing.
      *   **Motivation:** Profound long-term consequences; ethical imperative; impossibility of direct inclusion.
      *   **Negotiability:** **Contested (Conceptually Challenging).** No principle can *directly* include them. Solutions are indirect (guardianship, constitutional constraints). A principle must *acknowledge* and *account* for this limitation meaningfully.

  **II. Requirements Motivated by Conceptual Distinctions (Must Not Collapse):**

  7.  **Distinguish Affectedness from Coercion:** The principle must not treat "being affected" (e.g., economic spillover, environmental impact abroad) as identical to "being subjected to coercion" (e.g., bound by enforceable laws).
      *   **Motivation:** Vast difference in scope (affectedness is potentially limitless, coercion is territorially bounded). Conflation justifies over-inclusion.
      *   **Negotiability:** **Non-Negotiable.** Collapsing this distinction renders bounded democracy impossible.
  8.  **Distinguish Affectedness/Coercion from Long-Term Stake:** The principle must recognize that having a fundamental, enduring interest in the community's future (e.g., permanent residents) is distinct from temporary affectedness (tourist) or even momentary coercion.
      *   **Motivation:** Justifies inclusion of permanent residents and potentially exclusion of tourists even if both are affected/coerced in the short term. Links membership to community fate.
      *   **Negotiability:** **Contested.** "Stakeholder" views prioritize this; other views (like all-subjected) might see it as derivative.
  9.  **Distinguish Formal Membership from Subjection/Stake:** The principle must not *assume* formal citizenship defines the relevant demos without independent justification.
      *   **Motivation:** Avoids circularity ("citizens vote because they are citizens"); forces justification for including/excluding non-citizen residents or excluding citizens abroad.
      *   **Negotiability:** **Non-Negotiable for Foundational Principles.** The point is to justify *who* should be a citizen/voter in the first place.

  **III. Foundational Constraints (Cannot Violate):**

  10. **Non-Circularity:** The principle cannot presuppose the existence of the very demos it is supposed to define. It must provide an independent justification.
      *   **Motivation:** The "Bootstrapping Problem" - a demos cannot democratically vote itself into existence without already existing. Foundational principles must be prior.
      *   **Negotiability:** **Absolutely Non-Negotiable.** Violating this renders the principle logically incoherent for defining the *initial* demos.
  11. **Feasibility/Workability:** The principle must define a demos capable of functioning as a collective decision-making body (deliberation, voting, implementation).
      *   **Motivation:** Democracy requires a bounded group with mechanisms for participation and collective action. An infinitely large or dispersed group is impractical.
      *   **Negotiability:** **Non-Negotiable (Pragmatically).** A principle defining an unworkable demos fails a core purpose of enabling democracy.
  12. **Avoid Moral Paradox/Incoherence:** The principle cannot justify outcomes fundamentally violating core democratic values (e.g., permanently disenfranchising a subjected group without recourse, creating permanent second-class members).
      *   **Motivation:** Upholds the normative foundations of democracy (equality, self-rule). E.g., permanently excluding subjected permanent residents creates a democratic deficit.
      *   **Negotiability:** **Non-Negotiable (Normatively).** A principle undermining democracy's core values is self-defeating.

  **IV. Addressing the Key Suspected Conflict:**

  *   **The Affectedness vs. Boundedness Dilemma:** Your suspicion is **correct and fundamental.** The requirement to include *all affected interests* (if taken literally and strongly) is **jointly unsatisfiable** with the requirements of **Non-Circularity (10), Feasibility/Workability (11),** and distinguishing **Affectedness from Coercion (7)**. In an interconnected world, "affectedness" cascades globally and intergenerationally. Including everyone affected by, say, climate policy or trade rules means including virtually everyone on the planet and future generations – an utterly unworkable, unbounded demos that violates 7, 10 (who decides this global demos?), and especially 11. *This is the core tension in the boundary problem.* Any adequate principle *must* resolve this, usually by:
      *   Rejecting pure "all-affected" as the sole criterion (acknowledging its overreach).
      *   Prioritizing subjection to coercion or long-term stake as the primary boundary-setter.
      *   Acknowledging the limitation and seeking indirect mechanisms (international law, representation, constitutional safeguards) for seriously affected outsiders/future generations.

  **V. Brief Scoring of Common Principles:**

  *   **All-Affected Interests Principle:**
      *   **Strengths:** Captures ethical intuition (8, partially 6 motivation), highlights limitations of current borders.
      *   **Failures:** **Catastrophically** violates **Feasibility (11)** and **Distinction Affectedness/Coercion (7)**. Fails **Non-Circularity (10)** for global application. Struggles with **Children (1), Tourists (2)** (over-includes?), **Criminals (4), Citizens Abroad (5)**. Provides no *practical* way to address **Future Generations (6)**. *Fails core constraints.*
  *   **All-Subjected-to-Coercion Principle:**
      *   **Strengths:** Strong on **Non-Circularity (10), Feasibility (11)**, clearly distinguishes **Affectedness/Coercion (7)**. Justifies including **Permanent Residents (3)**. Handles **Tourists (2)** well (temporary coercion ≠ full inclusion). Provides a clearer rationale for **Criminals (4)** (subjected, so should vote? Debate on forfeiture). Addresses **Citizens Abroad (5)** (often excluded due to lack of subjection).
      *   **Weaknesses:** Struggles with **Children (1)** (subjected but excluded on capacity grounds – requires an addendum). May under-include regarding **Long-Term Stake (8)** vs. affectedness (e.g., diaspora with strong stake). Provides weak *direct* mechanism for **Future Generations (6)**. May not fully resolve the moral paradox if permanent exclusion exists **(12)**.
  *   **Stakeholder Principles (e.g., Citizenship, Birthright+Residency, Long-Term Interest):**
      *   **Strengths:** Strong on **Feasibility (11)**, **Long-Term Stake (8)**, often clear boundaries. Handles **Tourists (2)** well. Can justify including **Permanent Residents (3)** based on stake. May offer *indirect* pathways for **Future Generations (6)** (via trusteeship).
      *   **Weaknesses:** Risk **Circularity (10)** if simply assumes citizenship. Struggles to justify *exclusion* of **Permanent Residents (3)** if stake is primary. Can be arbitrary on boundaries (e.g., birthright). May not fully capture **Subjection (7)** (excluded resident still coerced). **Citizens Abroad (5)** inclusion/exclusion depends on how "stake" is defined. **Criminals (4)** status depends on whether stake is forfeited. Can conflict with **Affectedness** intuition.

  **Conclusion:** Defining the demos requires navigating non-negotiable constraints (Non-Circularity, Feasibility, key Distinctions, avoiding Paradox) while resolving contested cases (Residents, Criminals, Expatriates, Future Generations). The fundamental tension between the intuitive pull of affectedness and the practical necessity of boundedness is unavoidable. Principles prioritizing subjection to coercion or long-term stake generally fare better against the core constraints, though none perfectly resolves all cases and tensions. Your defense will need to prioritize which requirements and values you find most compelling in light of these trade-offs.
