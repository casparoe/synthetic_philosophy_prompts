answer: |-
  This asymmetry in testimonial practices reveals a deep-seated view about the nature of moral knowledge, understanding, and agency. To analyze it, we must distinguish what the practice **strictly presupposes**, what it **fits well with**, and where it remains **philosophically underdetermined**.

  ### I. Core Presuppositions of the Asymmetry
  The practice commits us to at least these non-negotiable claims:

  1.  **Moral Understanding Requires First-Personal Engagement:** Moral judgment isn't merely knowing *that* something is wrong/right; it requires grasping *why*. Testimony typically transmits the "that" but not necessarily the "why" in a way that constitutes genuine understanding.
  2.  **Internalism about Moral Justification:** The justification for a moral belief isn't transferable like factual justification. For a moral belief to be *justified for me*, *I* must grasp the justifying reasons, not just know that someone else does.
  3.  **Moral Agency Involves Rational Deliberation:** Being a moral agent means taking responsibility for forming one's *own* judgments through reasoning. Deferring without engaging bypasses a core function of moral agency – exercising practical reason.
  4.  **Moral Facts are Reason-Dependent:** Moral truths depend on reasons/considerations in a way brute empirical facts (like store closing times) do not. Knowing the truth therefore requires accessing those reasons.

  ### II. Explaining the Block: Strong vs. Weak Claims
  The asymmetry does **not** strictly presuppose that moral knowledge *cannot* be transmitted by testimony (*Strong Claim*). It *does* presuppose that there is **something defective or inadequate** about acquiring *justified moral belief or understanding* solely via testimony (*Weak Claim*).

  *   **Strong Claim (Transmission Impossible):** The practice *fits well* with views holding moral facts are:
      *   **Non-Natural/Non-Empirical:** Requiring a special faculty (intuition, rational insight) inaccessible via testimony.
      *   **Radically Subjective/Constructivist:** Meaning truth is constituted by the agent's own reasoning process.
      *   **Essentially Tied to Motivation:** Where merely believing "X is wrong" on testimony lacks the necessary motivational force (internalism about motivation).
      *   **Epistemically Autonomous:** Governed by unique epistemic norms prohibiting second-hand knowledge.
      *   *However, the practice doesn't strictly require this. One could concede testimony *could* give true belief, while insisting it fails to give *understanding* or *justified belief for the agent*.*

  *   **Weak Claim (Transmission Possible but Defective):** This is the **minimal commitment** of the asymmetry. Key features explaining the defectiveness:
      *   **The Primacy of Reasons:** Moral truths supervene on non-moral facts *plus reasons*. Testimony transmits the conclusion but bypasses the essential reason-apprehension.
      *   **Understanding vs. Knowledge:** Moral *understanding* (grasping the reasons, seeing the connections) is valued over mere factual knowledge. Testimony struggles to transmit understanding.
      *   **Agency and Ownership:** Moral beliefs guide action in a deeply personal way. Beliefs formed passively lack the "agential stamp" required for authentic moral commitment and responsibility.
      *   **Phenomenology of Judgment:** Moral judgment often *feels* like an active process of weighing reasons. Deferring feels like abdicating this core experience.
      *   **Vulnerability to Error:** Moral disagreement is common. Agents feel a need to "check the reasoning" themselves because the stakes (moral action/character) are high.

  ### III. Reconstructed Implicit Epistemology
  The asymmetry reveals an implicit commitment to a form of **Internalist Rationalism about Moral Understanding**:

  1.  **Object of Knowledge:** Moral facts/properties exist (realism compatible, but not strictly required) and are knowable.
  2.  **Mode of Access:** Primary access is through *rational reflection* on relevant non-moral facts (reasons, consequences, principles, motives, relationships) and their *normative significance*. This is a first-personal cognitive achievement.
  3.  **Justification Condition:** Justification for a moral belief *S* held by agent *A* requires *A* to have cognitive access to (and ideally, grasp) the reasons that support *S*. This access is non-transferable.
  4.  **Understanding Condition:** Full moral competence requires *understanding* – the ability to see *why* something is right/wrong, articulate reasons, apply principles, and respond to objections. This is inherently active and first-personal.
  5.  **Agency Link:** Forming justified moral beliefs via one's own reasoning is constitutive of responsible moral agency.

  ### IV. Points of Underdetermination (Where Multiple Theories Fit)
  The asymmetry is compatible with several distinct philosophical frameworks:

  1.  **Moral Realism vs. Constructivism:**
      *   *Realist:* Moral facts exist independently. We access them via reason, but testimony fails to provide the necessary rational apprehension *for the agent*.
      *   *Constructivist (e.g., Kantian, Humean):* Moral truths are constituted by correct reasoning procedures (universalization, sentimental convergence). Testimony bypasses the truth-constituting act of reasoning itself.

  2.  **Nature of Moral Properties:**
      *   *Non-Naturalist:* Properties require sui generis rational intuition. Testimony cannot induce this intuition in another.
      *   *Naturalist (Sophisticated):* Properties are complex natural properties (e.g., "maximizes well-being under conditions C"). Grasping this complexity and its normative force requires personal reflection, even if testimony conveys the label.

  3.  **Role of Emotion:**
      *   *Cognitivist Sentimentalism:* Appropriate emotional responses (e.g., empathy, indignation) are part of correct moral judgment. Testimony cannot reliably induce the *appropriate* emotion in the listener.
      *   *Pure Rationalism:* Emotions are irrelevant or secondary; the defect is purely in bypassing rational deliberation.

  4.  **Strength of the Block:**
      *   *Strong Internalism:* Testimony *cannot* transmit justified moral belief/understanding *at all*.
      *   *Moderate Internalism:* Testimony can *sometimes* transmit a low-grade justified belief (e.g., in extreme expertise/novice cases), but this is inferior to understanding and fails the ideal of agency. The asymmetry reflects the ideal, not the absolute impossibility.

  5.  **Scope of the Asymmetry:**
      *   *Global:* Applies to *all* moral testimony.
      *   *Local:* Applies primarily to core, complex, or controversial moral judgments, but deference *might* be acceptable for derivative or highly technical moral facts (e.g., "This specific tax loophole is unjust" from an ethics professor specializing in tax policy).

  ### Conclusion
  The asymmetry in accepting moral testimony presupposes that **moral understanding and justified moral belief fundamentally require the agent's own rational engagement with the supporting reasons.** It commits us to the Weak Claim: acquiring moral beliefs *solely* via testimony is defective, lacking justification, understanding, and agential ownership, even if it *could* accidentally yield a true belief. This fits an implicit epistemology valuing first-personal rational reflection as essential to moral knowledge and agency.

  The practice is **strictly agnostic** on whether moral testimony can *ever* transmit true belief or even minimal justification (underdetermined between Strong and Weak Claims). It is also compatible with various metaethical views (realism, constructivism, some naturalism) and differing accounts of the role of emotion, as long as they uphold the **primacy of first-personal reason-apprehension for full moral competence.** The core, non-negotiable commitment is to the **internalist and agency-centric nature of moral cognition.**
