prompt: |-
  I'm writing the final for my upper-level seminar on moral psychology and the foundations of ethics, and I need one essay question that actually tests understanding rather than recall. It'll be a 90 minute question worth 20 marks. The topic is the difficulty of telling moral preferences apart from moral biases — i.e. the problem that a lot of what we take to be principled moral preferences might just be in-group favoritism, status-quo bias, or whatever our culture happens to reward, and the real trouble is that the preference/bias distinction looks like it needs a view from nowhere to apply, since you can only flag something as a bias if you've already got a bias-free vantage point. I want the question to force students to confront whether the distinction collapses into a purely etiological one (preferences are caused the right way by reason, biases the wrong way by evolution or socialization) and what that collapse would mean for the idea of moral progress. Please write the question itself, a model answer of roughly 600 words, and a marking scheme built around a handful of must-hit points that seperates an A from a B by naming the specific moves each has to make — and for the B-level answer, note the specific mistake that should cost marks.
