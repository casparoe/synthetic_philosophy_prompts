  ## Q3 REPORT TO THE TRUSTEES OF THE MORAL PORTFOLIO

  **Date:** October 15, 2023  
  **From:** Managing Director, Moral Portfolio Management  
  **Subject:** Quarterly Performance Review & Strategic Positioning  

  **Overview:**  
  The third quarter presented a challenging operational environment for the Moral Portfolio. While our core positioning remains robust, persistent volatility in theoretical conviction levels ("credences") and unresolved scaling issues ("the units problem") continued to generate noise in our expected choiceworthiness calculations. Overall portfolio stability was maintained through disciplined rebalancing, though several positions exhibited unusual sensitivity to external inputs (primarily new philosophical arguments encountered in journals and podcasts).

  **Performance Attribution:**
  *   **Core Holdings (Deontology 32%, Utilitarianism 28%, Virtue Ethics 25%):** These positions demonstrated relative stability. Deontology provided reliable downside protection against consequentialist overreach in several personal integrity scenarios (e.g., truth-telling obligations under pressure). Utilitarianism delivered strong performance in resource allocation decisions involving impersonal beneficiaries (charitable giving optimization). Virtue Ethics acted as a valuable counterbalance, tempering rigid rule-following and excessive calculus with considerations of character and context. Minor internal drift occurred within Utilitarianism regarding discount rates for future well-being, requiring a slight internal reweighting towards presentist interpretations.
  *   **Satisficing & Pragmatism (8%):** This holding performed well in low-stakes, time-sensitive decisions where exhaustive optimization was operationally infeasible (e.g., minor household purchases, choosing lunch options). Its value as a liquidity provider within the portfolio remains high.
  *   **Contractualism (4%):** Underperformed slightly due to increased complexity in identifying relevant "reasonable rejectors" in modern, anonymized social interactions (online discourse, traffic norms). Position size under review.
  *   **Fanaticism Exposure (Preference Utilitarianism Variant - 2%):** As anticipated, this small position continued to exert disproportionate influence. The variant holding a specific axiomatic view that assigns *infinite* positive weight to the prevention of certain types of suffering triggered aggressive buy signals in nearly every significant allocation decision. Strict position-sizing discipline was enforced (capped at 2%), preventing portfolio domination. We reiterate that managing this exposure is an operational necessity, not a reflection on the theory's intrinsic plausibility. Liquidity constraints (the practical impossibility of achieving infinite positive impact) further mitigate runaway scenarios.
  *   **Other Minor Holdings (3%):** Includes care ethics, ecological holism, and several domain-specific rule sets. Performance was mixed but within tolerance.

  **Rebalancing Activity:**  
  Credences shifted moderately following engagement with new critiques of aggregation methods and a compelling defense of agent-relative constraints. We reduced Virtue Ethics by 2% (reallocating 1% each to Deontology and a newly created "Hybrid Character-Consequence" sub-position within the broader Virtue allocation – see *Granularity & Individuation* below) and increased Satisficing by 1% at the expense of Contractualism. The Fanaticism position was actively trimmed back to the 2% cap on three occasions following its attempted takeover of decisions involving career choices and political donations. (The expected choiceworthiness metric remains inherently noisy due to unit incompatibility – different theories simply use different moral "currencies" – but directional trends derived from normalized scales provide actionable signals for relative weighting purposes. We continue to monitor developments in cardinal comparability research.)

  **Key Challenges & Risk Management:**
  1.  **The Units Problem:** As noted, translating diverse moral outputs (rightness, goodness, virtue, permissibility) into a common "choiceworthiness" unit for aggregation remains our most significant technical hurdle. While we employ normalization techniques to generate comparable scores *within* the portfolio framework, we acknowledge this introduces unavoidable approximation error. Two theories can agree Action A is better than B, yet provide no basis for quantifying *how much* better A is than B relative to a third theory. This is treated as background noise for now.
  2.  **Hedging Incompatibility:** One Trustee (you know who you are) consistently advocates for abandoning the portfolio approach entirely in favor of a "Maximum Credence" strategy – simply acting on the single theory currently holding the highest conviction weight. While we acknowledge the conceptual simplicity, our back-testing (reviewing past decisions under hypothetical single-theory regimes) shows significantly higher volatility in outcomes perceived as suboptimal *ex-post* under alternative plausible theories. The diversification benefit of holding multiple theories, even when one holds a slight edge, provides crucial resilience against credence volatility and model error. Treating moral uncertainty as a diversified portfolio offers a robust prudential approach where the consequences of backing the wrong single theory could be severe. Furthermore, one core holding explicitly condemns *intentional* moral hedging as a failure of commitment, viewing it as inherently wrong. We log this internal contradiction under "Diversification Benefits / Cost of Carry" – the cost of violating this specific theory's injunction is deemed acceptable within the overall risk-adjusted return profile of the diversified portfolio.
  3.  **Paralysis Threshold:** During periods where credences across the top 3-4 holdings converge near equilibrium (approximately 25-35% range each), the aggregated expected choiceworthiness scores for major actions often cluster tightly, losing discriminatory power. In Q3, this occurred during deliberations concerning a significant volunteer time commitment. When portfolio signals lack clear conviction, we default to pre-defined "Operational Considerations" (OC). OC protocols prioritize timeliness, precedent, cognitive load minimization, and alignment with low-risk established norms. The OC decision was made in this instance. We are reviewing OC parameters for potential refinement.
  4.  **Granularity & Individuation:** The ability to subdivide theories into finer-grained variants (e.g., splitting Virtue Ethics into Aristotelian, Humean, and Modern Neo-Aristotelian sub-positions) offers valuable flexibility for nuanced rebalancing. However, it introduces a degree of… *gerrymandering risk*. Assigning distinct credences to highly similar variants can feel operationally convenient but philosophically arbitrary. We are aware of this tension and strive to maintain defensible boundaries between distinct positions. The "Hybrid Character-Consequence" sub-position mentioned earlier is a borderline case, currently under internal audit for justification.

  **Q4 Outlook:**  
  We anticipate continued credence volatility based on the planned reading list (including several works on population ethics and demandingness objections). Focus will remain on disciplined position sizing, especially concerning the Fanaticism exposure and managing the Units Problem noise. We will also finalize the review of Operational Consideration protocols to enhance decision efficiency during low-conviction intervals. The portfolio remains well-diversified and positioned to navigate moral uncertainty prudently.

  Respectfully submitted,

  The Managing Director

  ---

  **APPENDIX: INTERNAL MEMO**

  **Date:** October 16, 2023  
  **From:** Compliance Officer, Ethical Standards & Oversight  
  **To:** Trustees, Moral Portfolio  
  **Subject:** Category Concerns re: Q3 Report  

  Trustees,

  While I have reviewed the Q3 Report for procedural adherence, I must reiterate my fundamental reservations about the underlying framework. Treating moral theories as analogous to financial asset classes constitutes a profound category error.

  1.  **Independence:** Asset returns are (ideally) statistically independent or diversifiable. Moral theories are deeply *interdependent*; they contend for the same explanatory ground, reference shared intuitions, and arguments against one often bolster another. This violates core diversification assumptions.
  2.  **Returns:** The concept of a moral "return" is undefined and likely undefinable. There is no equivalent to a risk-free rate of moral goodness, nor a market portfolio against which to benchmark. Claims of "performance" are purely circular, measured against the very portfolio construction being evaluated.
  3.  **Aggregation:** Averaging incommensurable moral outputs ("choiceworthiness") based on credences, while operationally convenient, lacks any rigorous philosophical foundation. It risks generating spurious precision and obscures genuine conflicts between fundamentally different ways of valuing actions and states of affairs. The "Units Problem" isn't noise; it's a fatal flaw.
  4.  **Purpose:** Pension funds aim for financial return. What is the telos here? Minimizing maximum regret? Maximizing expected moral "value" (undefined)? The portfolio manager operates without a clear, external metric of success, unlike the unambiguous dollar.

  The approach confuses managing *uncertainty about which theory applies* with managing *the application of the theories themselves*. The former is epistemological; the latter is substantive. Blurring them risks turning profound ethical deliberation into a technical exercise in weighting incommensurables. I question whether the reported "diversification benefits" are anything more than psychological comfort derived from an elaborate quantification scheme applied to an inherently unquantifiable domain.

  This is noted for the record.

  Compliance Officer
