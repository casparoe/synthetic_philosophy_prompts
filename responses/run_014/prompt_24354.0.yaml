  Ah, here's the crux: for Dennett, any unified "place" smuggles the theater back in. But Baars would argue his workspace isn't spatial; it's a dynamic capacity constraint. The difference hinges on whether functional unity implies spatial unity. I think Baars escapes the theater because his workspace has no "stage" - it's more like a radio broadcast tower than a cinema. Information isn't presented to anyone; it's just made accessible. 

