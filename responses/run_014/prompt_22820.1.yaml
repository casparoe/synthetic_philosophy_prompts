  I'm working through the Pasadena paradox for a paper on decision-making under indeterminacy, and I want to nail down the setup before I build my argument on it. As I understand it, the expected value of the Pasadena game is just zero: each outcome contributes ±1 to the expectation (the payoff is ±2^n with probability 2^(−n)), so the series 1 − 1 + 1 − 1 + ... has its positive and negative terms cancelling out, which makes the game a fair bet and means a risk-neutral expected-utility maximizer should be indifferent between playing and passing. If that's the right reading, the philosophical interest has to come from somewhere other than the expected value, since the game is just a fair gamble in disguise. Is this correct, or am I missing something about why the paradox is supposed to trouble expected utility theory?
