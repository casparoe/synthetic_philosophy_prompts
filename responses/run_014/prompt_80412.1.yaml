answer: |-
  ### Decision Tree: The Ineffective Objection in Individual Actions

  **Instructions:** Answer each question based on your beliefs about individual actions (e.g., buying a steak, voting, flying). Do not worry about philosophical labels—focus on what you genuinely think. The tree will sort you into a position based on your answers, with notes on its implications. Control cases: **Voting** (tests causal efficacy) and **Meat Purchase** (tests contribution to aggregate harm).

  ---

  #### **Q1: Does your individual action (e.g., buying one steak) make *literally no difference* to the outcome? (If you skipped it, everything would be identical?)**
  - **Yes (Causal Claim)** → Go to Q2.
  - **No (Magnitude Claim: it makes a tiny difference)** → Go to Q3.

  #### **Q2 (If Causal): But should we consider the *expected impact* of such actions? (Even if this act does nothing, similar acts sometimes matter, so we should act "as if" we might be decisive.)**
  - **Yes** → **Leaf 1: Expected-Value Rebuttal**  
    *Name:* Expected-Value Rebuttal  
    *Awkward commitment:* Must defend assigning non-zero decisiveness probabilities (e.g., your vote might swing an election) even in low-stakes or lopsided cases (e.g., voting in a safe state).  
    *Note:* This smuggles decision theory (expected consequences) into a deontic (duty-based) framework; removing it collapses the case to the causal objection.  
  - **No** → Go to Q4.

  #### **Q3 (If Magnitude): Does the moral duty attach to the *specific act* (e.g., buying steak) or to your *role* (e.g., being a consumer)?**
  - **Act** → Go to Q5.
  - **Role** → **Leaf 6: Role-based Duty with Impact**  
    *Name:* Role-based Duty with Impact  
    *Awkward commitment:* Roles (e.g., citizen, consumer) require harmful acts (e.g., voting in a broken system) even when your individual impact is small but real—risks incoherence if the role demands avoiding harm.

  #### **Q4 (If Causal + No Expected-Value): Does the moral duty attach to the *specific act* or to your *role*?**
  - **Act** → **Leaf 2: Hard Ineffectiveness**  
    *Name:* Hard Ineffectiveness  
    *Awkward commitment:* Denies any duty to vote (since your vote never decides an outcome) or avoid harmful purchases (e.g., meat), conflicting with widespread intuitions about civic duty.  
  - **Role** → **Leaf 3: Role-based Duty without Efficacy**  
    *Name:* Role-based Duty without Efficacy  
    *Awkward commitment:* Roles demand participation (e.g., voting) even when your action is causally inert—feels like "empty ritualism" (e.g., voting in a landslide).

  #### **Q5 (If Magnitude + Act): For moral responsibility, must your action be *sufficient by itself* to cause the harm (e.g., you alone could trigger it), or is *contribution* (e.g., one push in a crowd) enough?**
  - **Sufficiency** → **Leaf 4: Sufficiency Ineffectiveness**  
    *Name:* Sufficiency Ineffectiveness  
    *Awkward commitment:* No duty to avoid acts with small harms (e.g., flying) since your action isn’t decisive—forces denial of climate duties because no one’s flight suffices for disaster.  
  - **Contribution** → **Leaf 5: Contributionism**  
    *Name:* Contributionism  
    *Awkward commitment:* Even tiny harms (e.g., 0.001% of a slaughterhouse’s output) must be avoided—demands radical life changes for negligible gains.

  ---

  ### Summary of Leaves
  1. **Expected-Value Rebuttal** (from Q2-Yes)  
  2. **Hard Ineffectiveness** (from Q4-Act)  
  3. **Role-based Duty without Efficacy** (from Q4-Role)  
  4. **Sufficiency Ineffectiveness** (from Q5-Sufficiency)  
  5. **Contributionism** (from Q5-Contribution)  
  6. **Role-based Duty with Impact** (from Q3-Role)  

  ### Control Case Diagnostics
  - **Voting:** Tests causal efficacy.  
    - If you endorse a duty to vote *despite* causal inefficacy (e.g., Leaf 3 or 6), you reject the causal claim’s necessity.  
    - If you deny voting duty (e.g., Leaf 2 or 4), your position requires causal efficacy/sufficiency.  
  - **Meat Purchase:** Tests contribution to aggregates.  
    - If you see no duty (e.g., Leaf 2 or 4), you deny contribution matters.  
    - If you see a duty (e.g., Leaf 5 or 6), you accept constitutive contribution (your purchase is part of demand).

  ### Notes on Unoccupied Combinations & Ambiguities
  - **Incoherent combination:** Causal Claim + Contribution Condition (e.g., answering "Causal" at Q1 and "Contribution" at Q5).  
    *Diagnosis:* Incoherent—if an action makes *no difference*, it cannot "contribute" to harm. Avoided in the tree by routing Causal claims away from Q5.  
  - **Unseparated pair:** Leaf 3 (Causal + Role) and Leaf 6 (Magnitude + Role) are distinct but share the same "awkward commitment" about roles—the tree separates them via Q1 (Causal vs. Magnitude), but both struggle to explain why roles override harm concerns.  
  - **Unexplored combination:** Magnitude Claim + Sufficiency Condition + Role-based Duty (e.g., answering "Magnitude" at Q1, "Role" at Q3, but never reaching "Sufficiency").  
    *Diagnosis:* Unexplored—most role-based views don’t distinguish sufficiency/contribution, so the tree doesn’t force this split.  

  ### Tree Logic
  - **6 leaves** cover major positions; voting/meat cases expose inconsistencies.  
  - **Expected-Value Rebuttal** (Leaf 1) is the main "escape" from causal objections; its collapse reverts to Leaf 2/3.  
  - **No position occupies all branches**—e.g., denying expected-value (Q2-No) while endorsing contribution (Q5-Contribution) is coherent (Leaf 5) but demands high rigor for small harms.
