  The user wants a diagnosis, not a survey. Their hypothesis is already good, but I should push further: this isn't just verbal disagreement. The core clash is about what decision theory is FOR. Is it about prescribing flawless choices (like a math proof) or engineering practical cognition (like building a seaworthy ship)? 

  Empirical tests won't settle this because both sides can cherry-pick evidence—satisficers point to heuristics working IRL, maximizers say "but look at these biases!" What's needed is clarifying the PURPOSE upfront: "For goal X, which framework illuminates more?" 

