prompt: |-
  I'm putting together a problem set for a small seminar on measurement, incentives, and agency, and I keep wanting a case that is Goodhart without the obvious cheating story. I was discussing this with a friend who does econometrics, and she kept saying the interesting failure is not that people are deliberately gaming the metric, but that the optimization changes the world in which the metric was calibrated. I find that distiction a bit fuzzy, so I'd like an example that makes it crisp.

  Please give an example of a conceptual issue where a decision-maker optimizes a proxy variable, nobody is intentionally exploiting the metric, and the proxy nevertheless becomes unreliable because the intervention shifts the relevant population or environment. Make it concrete enough that I can put it in a handout, but not so complicated that the point gets lost. Ideally it should show why the proxy was not merely a noisy estimator, and why collecting more data from the original pre-intervention distribution might not fix the problem.
reasoning: |-
  We are looking for an example of Goodhart's law where:
  - A decision-maker uses a proxy variable to optimize a true goal.
  - There is no intentional gaming/cheating by agents.
  - The optimization process changes the environment such that the proxy becomes unreliable.
  - The issue is not just noise; the relationship between the proxy and the true goal breaks down due to the shift in the environment.
  - Collecting more pre-intervention data does not help because the post-intervention world is different.

  Example: **Emergency Room Wait Times as a Proxy for Quality of Care**

  **Background:**
  A hospital administrator wants to improve the quality of emergency care. The true goal is to reduce patient mortality and morbidity (i.e., improve health outcomes). However, measuring health outcomes directly is challenging because they are influenced by many factors beyond the hospital's control and may take time to manifest. Instead, the administrator uses "average wait time to see a doctor" as a proxy. The reasoning is that shorter wait times lead to quicker treatment, which should improve outcomes.

  **Pre-intervention calibration:**
  Before any intervention, the hospital collects data and observes a negative correlation between wait times and health outcomes (shorter waits associated with better outcomes). This correlation is used to justify using wait time as a proxy.

  **Intervention:**
  The administrator implements a policy to minimize average wait time. They hire more triage nurses, streamline the registration process, and set up a system to prioritize patients based on estimated severity (using a quick initial assessment). They also set strict targets and monitor wait times closely.

  **Unintended consequences (no cheating):**
  1. **Triage prioritization:** To reduce the average wait time, the hospital starts to focus on quickly seeing patients with conditions that are easy to diagnose and treat (e.g., minor injuries, colds). These patients can be processed quickly, bringing down the average. However, patients with complex conditions (who require more time) are often left waiting longer because they are deprioritized. This leads to worse outcomes for the very sick patients, even though the average wait time decreases.

  2. **Registration streamlining:** The hospital might implement a policy of collecting minimal information at registration to speed up the process. This could lead to missing critical information (e.g., allergies, pre-existing conditions) that is important for treatment, increasing the risk of medical errors.

  3. **Redefining "wait time":** The hospital might change the starting point of the wait time clock (e.g., starting the clock only after the patient is moved to an examination room, not from arrival). This doesn't change the actual wait but improves the metric.

  Note: In this example, we assume that the staff is not intentionally gaming the system (like falsifying records) but are responding to the incentives by changing operational procedures in ways that are aimed at reducing the metric. The problem is that the proxy (wait time) becomes less correlated with the true goal (health outcomes) because the population of patients and the care process have changed.

  **Why is this not just noise?**
  The pre-intervention correlation between wait time and outcomes was based on a mix of patient types and a particular care process. After the intervention, the hospital is seeing a different mix of patients (more low-severity, fewer high-severity in the quick-treatment stream) and the care process for high-severity patients has worsened. The relationship between wait time and outcomes has fundamentally changed: now, even with a low average wait time, outcomes for the sickest patients are worse, and overall outcomes might not improve (or might even decline). The proxy is no longer a valid indicator because the environment has shifted.

  **Why collecting more pre-intervention data doesn't help:**
  Suppose we collect more data before the intervention. We might get a more precise estimate of the correlation between wait times and outcomes in the pre-intervention environment. However, after the intervention, the environment changes (e.g., the patient mix and the hospital's prioritization). The pre-intervention data cannot capture how the relationship changes under the new policy because the policy alters the very context in which the proxy was calibrated. Thus, the pre-intervention model becomes obsolete.

  **Conclusion:**
  This example illustrates how optimizing a proxy (wait time) can change the environment (patient mix and care process) in ways that break the proxy's relationship with the true goal (health outcomes). It highlights the need for caution when using proxies and the importance of anticipating how the optimization process might alter the system.
answer: |-
  Here's a concrete example that cleanly illustrates the distinction you're seeking, designed for clarity in a handout:

  ---

  ### Case: River Water Quality Monitoring  
  **True Goal:** Improve ecological health of a river ecosystem (measured by biodiversity & species resilience).  
  **Proxy Metric:** Dissolved Oxygen (DO) levels at designated monitoring stations (high DO correlates with healthy ecosystems in historical data).

  #### Background
  - Pre-intervention data (10 years) showed strong correlation between DO levels and ecological health surveys (r = 0.85).  
  - Regulators implement a program to optimize DO levels, incentivizing municipalities to increase DO at monitoring points.  
  - No cheating occurs: all parties act in good faith with scientific tools.

  #### Intervention
  Municipalities invest in:  
  1. **Aeration systems** near monitoring stations (directly oxygenates water).  
  2. **Flow control** to redirect pollution away from stations (using temporary barriers).  
  3. **Selective treatment** focusing only on pollutants that reduce DO (ignoring toxins that don't affect oxygen).

  #### Consequences (Unintended Shifts)
  1. **Spatial distortion:** Pollution is diverted *around* (not eliminated), concentrating ecological damage in unmonitored tributaries.  
  2. **Chemical imbalance:** New toxins (e.g., pesticides unaffected by aeration) accumulate, harming species insensitive to oxygen.  
  3. **Ecosystem shift:** Oxygen-tolerant invasive species thrive near stations, outcompeting native species that require other conditions.  

  #### Result After 2 Years
  - **Proxy improves:** DO levels rise by 30% at all monitored stations.  
  - **True goal deteriorates:**  
    - Biodiversity declines by 15% (native fish extirpated).  
    - Toxin-related deformities in amphibians increase.  
  - **Correlation breaks:** DO no longer predicts ecological health (r = -0.1).  

  ---

  ### Why This Clarifies the Distinction  
  1. **No gaming:** No one falsifies data or "hacks" sensors. Solutions are technically valid for raising DO.  
  2. **Environment shifted:**  
     - **Population:** Pollutants/species redistributed to unmonitored areas.  
     - **Causality broken:** DO was a *symptom* of ecosystem health pre-intervention, but post-intervention it becomes an isolated mechanical target decoupled from the system.  
  3. **Not just noise:**  
     - Pre-intervention DO *was* a valid signal (noise wouldn’t show high correlation).  
     - The intervention *changed the causal structure*: DO now measures engineering efforts (aeration), not ecosystem state.  
  4. **More pre-data doesn’t help:**  
     - Collecting 20 more years of pre-intervention data would only refine the *historical* DO-ecosystem relationship.  
     - It cannot reveal how *redirecting pollution* or *altering flow paths* would break that relationship.  

  ---

  ### Pedagogical Takeaways  
  - **Goodhart failure mode:** Metrics become unreliable when optimization *changes the environment* in which the proxy was calibrated.  
  - **Key distinction:** Unlike cheating (e.g., dumping pollutants only near monitors), here the *legitimate* efforts to improve the proxy alter the underlying system.  
  - **Mitigation lesson:** Use multiple diverse proxies (e.g., toxin levels, invertebrate counts) and monitor for distributional shift.  

  ---  
  This example works for seminars because it’s intuitive (no math required), shows real-world relevance (environmental policy), and highlights why post-intervention dynamics require causal reasoning beyond statistical calibration.
