  ### Synthesized Principle for Betting Dispositions

  After analyzing your cases and working through the arithmetic, I propose the following principle as the best fit for your verdicts. It addresses the core issue of irrationality in betting dispositions by focusing on the expected utility relative to the agent's credences at the time of decision. This principle is precise, mechanical, and can be applied to new betting situations. I call it the **Expected Utility Dominance Principle**:

  **Expected Utility Dominance Principle**: A pattern of betting dispositions (defined as a policy for accepting or rejecting bets and taking actions related to betting) is irrational if and only if, by the agent's own credences at the time of planning or decision, there exists an available alternative pattern such that:
  - (a) The alternative has weakly higher expected utility in every possibility the agent assigns nonzero credence.
  - (b) The alternative has strictly higher expected utility in at least one such possibility.
  - (c) The availability of the alternative could have been foreseen at the time of planning.

  **Key Addendum for Collections**: The "pattern" assessed is the agent's complete policy for bet acceptance across all times and states, including how bets are grouped. Collections of bets are individuated by the decision context (e.g., bets offered and accepted in a single interaction or as part of a coherent plan). If multiple bets are accepted under a single decision (e.g., offered simultaneously or intended to be evaluated together), they form a single collection; if accepted separately in unrelated contexts, they are separate. This handles cases like Die and Hundred Tickets.

  **Clause Pairings with Cases**:
  - **Clause (a) and (b)**: Handle Die (the pair guarantees loss, violating weak dominance), No Good Options (no alternative avoids loss, so no violation), Information (declining free information violates strict dominance, as it has positive expected utility), Priced Swaps (cycling with cheap swaps violates dominance; expensive swaps may not if no better alternative exists), and Deferring to Future Self (no dominance violation, as refusing may maximize expected utility). Saves Die, No Good Options, Information, Priced Swaps, and Deferring to Future Self.
  - **Clause (c)**: Handles Bookie Knows More (loss due to unforeseen information advantage, so no violation). Saves Bookie Knows More.

  **Object of Assessment**: The object is a **betting policy**, defined as the agent's set of dispositions for:
  - Accepting or rejecting individual bets or collections of bets.
  - Taking actions that affect betting outcomes (e.g., acquiring information).
  This policy includes credences, preferences, and rules for updating beliefs. It is assessed as a whole package, not isolated elements. Collections of bets are treated as a single unit if they are part of the same decision context (e.g., offered or accepted together). In Die, the two tickets are a single collection when considered jointly; in Hundred Tickets, each ticket is separate if offered independently.

