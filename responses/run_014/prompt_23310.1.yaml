  Okay, let me try to figure out what Frank Ramsey would think about acausal trade. The user and their friend had an argument about whether FPA (Functional Decision Theory or something similar) is just expected utility with correlations or if it's not proper decision theory. The user mentioned vibes, so maybe they feel FPA is too vague.

  First, I need to recall Ramsey's key ideas. He was big on subjective probability as degrees of belief. His betting framework requires consistent probabilities to avoid Dutch books. He also thought that the probability of an action shouldn't depend on the act itself, which is the act-state independence. And he saw causality as rules for predicting rather than real empirical things.

  Now, acausal trade involves making decisions based on correlations with other agents, without any causal links. Like, you both run the same algorithm and decide to cooperate because you know the other will do the same. The user's friend thinks this is just extending expected utility to correlated cases, while the user calls it "vibes."

  So, applying Ramsey's views. He'd probably reject probabilities that depend on the action. In acausal trade, the probability that the stranger cooperates might depend on your own action. For example, if you cooperate, you might think it's more likely they do too because of the correlation. But Ramsey's act-state independence says that the states (like what the stranger does) should have fixed probabilities regardless of your choice. So he'd see this as incoherent, like you're assigning probabilities based on your decision.

  Also, Ramsey thought causality isn't about real connections but prediction tools. If the correlation is due to a common algorithm (same decision procedure), that might be seen as a structural dependency. But Ramsey might still say that without causal influence, you're treating the correlation as a fixed feature to use in predictions. However, incorporating that into decision-making might violate his independence requirement.

  The user asks if the stranger running the same procedure changes things. If both use identical algorithms, the correlation is logical, not just empirical. Maybe Ramsey would accept that as a structural constraint. But his act-state independence is strict. He might argue that even then, your action shouldn't affect the probability of their action; instead, the correlation should be part of the state descriptions. So decoupling might be necessary.

  Overall, Ramsey would likely see acausal trade as smuggling causal assumptions. By letting your action influence the probability of theirs, you're implying a causal link where there isn't one. He'd prefer a model where all correlations are part of the initial probability setup, not depending on the chosen act. So he'd side with the user, calling it "vibes" because it violates foundational principles of decision theory as he defined it.
answer: |-
  Based on Ramsey's foundational work in probability, decision theory, and causality, his likely position on acausal trade would be nuanced but ultimately **skeptical**. He would probably side with you ("that's not decision theory, that's just vibes") due to fundamental conflicts with his core principles, particularly **act-state independence** and his view of causality. Here's the reasoning:

  1.  **Probability as Degrees of Belief & Dutch Book Arguments:** Ramsey grounded probability in coherent degrees of belief, demonstrable through betting behavior and avoiding Dutch Books (sure losses). He would demand that any rational decision framework, including one handling correlations, must satisfy this coherence.

  2.  **The Crucial Problem: Act-State Independence:** Ramsey insisted that **"the probability you assign to an act shouldn't depend on which act you're choosing."** This is the core reason he'd reject standard FDT-style acausal trade as a fundamental violation of his decision theory framework.
      *   In acausal trade (e.g., Newcomb's Problem, Prisoner's Dilemma with identical algorithms), the probability you assign to the *other agent's action* (the "state") **depends critically on your own action**. If you decide to Cooperate, you assign a high probability to the other Cooperating (due to the acausal correlation). If you decide to Defect, you assign a high probability to the other Defecting.
      *   For Ramsey, this is incoherent. The state of the world (what the other agent does) must be assigned probabilities *independently* of the act you are contemplating. Your beliefs about the world shouldn't magically change based on what you *might* do; they should reflect your understanding *before* the decision is made. Acausal trade requires precisely this forbidden dependency.

  3.  **Causality as Rules for Prediction:**
      *   Ramsey viewed causal statements not as claims about metaphysical connections but as "rules for prediction" or "consequences of psychological laws" (*General Propositions and Causality*). A causal belief like "Smoking causes cancer" is a rule guiding our expectations: *if* you observe someone smoking, *then* you predict a higher chance of cancer.
      *   Applied to correlation: He would see a correlation (acausal or causal) as a pattern in experience that informs our predictive rules. If you've observed a pattern where agents running procedure X tend to do A, that informs your prediction about what *this* agent running X will do.
      *   **The Conflict:** The problem arises when this correlation is used to make the *probability of the state (other agent's action)* depend on your *own action*. Ramsey's view of causality as predictive rules doesn't inherently justify this dependency. He would likely argue that you are **smuggling in a pseudo-causal claim** – acting *as if* your decision *causes* or *logically necessitates* the other agent's decision in a way that violates his requirement for act-state independence. The correlation should inform your *initial* probability assignment to the *other agent's fixed disposition/procedure*, not dynamically change based on your contemplated choice.

  4.  **The Impact of Same Decision Procedure:**
      *   This *does* matter significantly for Ramsey, but likely not enough to salvage acausal trade as he defined decision theory.
      *   **Without Same Procedure:** If the correlation is purely empirical (e.g., "I noticed strangers who look like this tend to cooperate if I do"), Ramsey would see this as a standard correlation to be incorporated into your *initial* probability assessment of the *stranger's fixed disposition*. Your action shouldn't change your belief about *their* fixed disposition. You act based on your best prediction of *their* fixed behavior given *all* evidence (including their appearance, etc.). Act-state independence holds.
      *   **With Same Decision Procedure:** This introduces a logical/structural element. Knowing both agents are running *identical* deterministic (or stochastic) procedures creates a *logical connection* between the inputs/outputs. Ramsey would recognize this as a fundamentally different type of constraint.
      *   **Ramsey's Likely Response:** Even here, he would likely insist on **decoupling**:
          *   **Step 1:** Recognize the logical dependency as part of the *specification of the world state*. The "state" isn't just "what the stranger does," but "what is the output of Procedure P given input conditions C (which include my own decision being part of P's input logic)?". This state description *includes* the logical connection.
          *   **Step 2:** Assign probabilities to these *enlarged* possible world-states *before* choosing your act. This assignment must satisfy coherence (avoid Dutch Books).
          *   **Step 3:** Choose the act that maximizes expected utility *given these fixed, act-independent probabilities over the enlarged states*.
      *   **The Result:** This might *look* like acausal trade in its outcome. If the procedure logically implies mutual cooperation is the only stable/optimal outcome given the symmetry, then cooperating might be the dominant choice *based on the fixed probabilities assigned to the possible logical outcomes defined by the procedure*. However, the *mechanism* is crucially different. The probability of the *logical outcome* ("Procedure P outputs Cooperate-Cooperate") is fixed *before* you choose; it doesn't *dynamically change* because you decide to cooperate. The correlation is baked into the state definition and the initial probability assignment over those logically possible states, respecting act-state independence.

  **Conclusion:**

  1.  **On Acausal Trade Generally:** Ramsey would likely argue that treating the probability of the other agent's action as dependent on your own act is **irrational** according to his framework. It violates the fundamental principle of act-state independence necessary for coherent probability and utility maximization. He would see it as "smuggling in a causal claim" by treating the correlation *as if* it implied a causal/logical dependency that allows the state probability to vary with the act, which his view of causality as predictive rules does not justify.
  2.  **On Same Decision Procedure:** While the identical procedure introduces a crucial logical constraint, Ramsey would likely demand it be handled by **enlarging the state space** to include the logical outputs of the procedure and assigning fixed, act-independent probabilities over *those* states *before* choosing. The rational decision emerges from maximizing expected utility under *these* fixed probabilities. This respects his core principles and avoids the forbidden act-state dependency, even if it sometimes yields the same *action* as FDT-style reasoning.
  3.  **Who Won?** Based on Ramsey's foundational principles, especially act-state independence, **you likely won the argument** on the core point. Your friend's characterization of FPA as "just expected utility extended to correlated cases" glosses over the fundamental violation of act-state independence that Ramsey considered essential to rational decision theory. Ramsey would see the dynamic dependency of state probabilities on the chosen act as incoherent "vibes" that undermine the very structure of rational belief and decision. He would insist on a framework where all correlations, even logical ones arising from identical procedures, are incorporated into a fixed probability assessment over adequately defined states *prior* to the decision. The "trade" might still happen, but the *reasoning* leading to it would be structurally different and adhere to his stricter axioms.
