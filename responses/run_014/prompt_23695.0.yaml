  Here’s a structured argument defending the etiological account of biological function, tailored to your focus on repurposed traits and objections. You can adapt this directly for your paper:

  ---

  ### The Etiological Account of Function: Preserving Biology's Explanatory Power

  **Thesis:** The etiological account of biological function—where a trait's function is defined by the historical reason for its selection and retention—offers a superior and more defensible framework than the causal-role account. Its refusal to assign "function" status to novel effects of repurposed traits is not a flaw but a critical virtue, safeguarding key biological distinctions essential for explanation and understanding malfunction.

  **Core Argument: Why Denying Novel "Functions" is a Strength**  
  Consider a trait co-opted for a new role: feathers initially selected for thermoregulation later enabling flight in birds, or human vocal folds (selected for airway protection) enabling complex speech. The causal-role account would declare flight or speech a *new function* simply because these traits *reliably cause* those effects in the current system. This conflation is deeply problematic:

  1.  **Blurs Function vs. Fortuitous Effect:** Biology requires distinguishing between what a trait *was selected to do* (its function) and what it *merely happens to do* (a beneficial effect, exaptation, or side-effect). Granting "function" status to any current causal role ignores this historical distinction. Feathers *function* in thermoregulation; flight is a *beneficial exaptation*. Speech is an *exaptation* of vocal folds. Conflating these obscures the actual evolutionary explanation for the trait's origin and persistence.
  2.  **Undermines Explanation of Trait Presence:** We ask, "Why do birds *have* feathers?" The etiological answer is clear: because ancestors with proto-feathers had a thermoregulatory advantage. The causal-role account offers a confused answer: "For thermoregulation *and* flight." But flight cannot explain the *initial origin and retention* of feathers—only their later refinement. The etiological view ties function directly to the causal explanation for the trait's existence.
  3.  **Erodes the Concept of Malfunction:** Judging a heart as "malfunctioning" if it fails to pump blood presupposes that pumping blood is its *proper function*. The etiological account grounds this normativity: the heart exists *because* ancestors pumped blood, making pumping its function. The causal-role account struggles: if a heart reliably causes rhythmic thumping sounds (a causal role), is it malfunctioning if it stops pumping but keeps thumping? By allowing virtually any reliable effect to be a "function," it loses the normative force to distinguish *proper* operation from *mere* operation or even harmful operation. Only history can ground the "should" in function statements.

  By denying that novel effects of repurposed traits are suddenly their "functions," the etiological account preserves these indispensable distinctions: **function vs. effect**, **explanation of origin vs. description of current utility**, and **malfunction vs. mere difference**. This precision is essential for rigorous biological inquiry.

  **Addressing Key Objections:**

  1.  **Objection: "Doesn't this mean functions disappear if environments change? A trait could 'lose its function' overnight!"**
      *   **Reply:** This reflects reality, not a flaw. Functions *are* tied to the selective pressures that shaped them. If an environment changes radically (e.g., cave fish losing eyesight), the trait may indeed cease to perform its *evolutionary function*. Calling it "functionless" or recognizing its function is now unfulfilled is accurate. It highlights the trait's dependence on past conditions and avoids the misleading implication that it still possesses a relevant function in the new context. Its current causal roles (e.g., vestigial eye tissue absorbing nutrients) are just that—causal roles, not functions.

  2.  **Objection: "Evolutionary history is contingent and often impossible to reconstruct! Isn't the etiological account impractical?"**
      *   **Reply:** The practical difficulty of reconstructing history is a challenge for *applying* the etiological account, not a refutation of its *conceptual validity*. Biology often deals with difficult-to-observe past events (e.g., speciation events). We use inference to the best explanation (fossils, comparative anatomy, genetics) to reconstruct function. Crucially, **the causal-role account cannot provide what the etiological account explains:** *why* the trait exists. Even if history is hard to know, the *concept* of function tied to selective history remains essential for the explanatory goals of evolutionary biology. The causal-role account, while perhaps easier to apply observationally, provides a fundamentally different—and less explanatory—kind of description.

  **Conclusion:**  
  The etiological account's insistence that function is defined by historical selection, not current causal role, is its defining strength. By refusing to confer "function" status on the novel effects of repurposed traits, it maintains crucial distinctions between a trait's raison d'être and its fortuitous utilities. This safeguards the explanatory power needed to understand *why* traits exist and provides the normative foundation for identifying malfunction. While practical challenges exist in reconstructing history, these do not undermine the account's conceptual necessity for a biologically grounded understanding of function. The causal-role account's permissiveness, by contrast, blurs these lines, offering descriptive convenience at the cost of explanatory depth and normative clarity. For a theory aiming to capture the *design* inherent in life by natural selection, the etiological account remains the more defensible and biologically indispensable framework.

  ---

  **Key Strengths for Your Paper:**
  *   **Directly Addresses Your Focus:** Centers on the "repurposed trait" scenario as the critical test case.
  *   **Turns Perceived Weakness into Strength:** Explicitly argues why denying the novel role as a "function" is virtuous.
  *   **Identifies Specific Blurred Distinctions:** Function vs. effect, explanation of presence, malfunction vs. difference.
  *   **Anticipates and Rebuts Core Objections:** Handles environment change and knowability of history.
  *   **Emphasizes Explanatory Power:** Links function tightly to the core biological question: "Why is this trait here?"
  *   **Concise and Structured:** Presents a clear line of reasoning suitable for adaptation.
