answer: |-
  Here's a careful comparison of Bratman and Searle on joint action, pinpointing their core disagreements on the nature of collective intentionality and analyzing your three specific questions:

  **Core Disagreement: Reductionism vs. Primitivism**

  *   **Bratman (Reductionist/Constructionist):** Joint action is fundamentally *built up* from the individual psychological states (intentions, beliefs) of participating agents, combined with specific interrelations (mutual responsiveness, commitment to mesh subplans, mutual belief). The "sharedness" of the intention is *constituted* by these interlocking individual states. The "we" is an *achievement* of coordinated individuals.
  *   **Searle (Primitivist/Anti-Reductionist):** Collective intentionality is an *irreducible* primitive form of intentionality. "We-intend" is a basic type of mental state, just like "I-intend." It cannot be broken down into a set of individual "I-intend" states plus mutual beliefs without losing the *collective character* itself. The "we" is the *starting point* of the intentionality.

  **Addressing Your Three Points:**

  1.  **Normative Force:**
      *   **Bratman:** His account *does* generate a specific kind of normative force, but it's primarily **interpersonal and coordinative**, not necessarily moral.
          *   *Source:* The mutual commitments inherent in the structure. Each agent intends the joint activity *in part because* of their belief that the other intends it and that they are mutually responsive. This creates commitments *to each other* to play their role, be responsive, and adjust subplans to mesh.
          *   *Nature:* If you publicly commit to intending J (based on my commitment), and we are mutually responsive, you create expectations and obligations *towards me* within the context of *this specific joint action*. Failing to act (e.g., just walking away mid-task) violates these mutual commitments and expectations, generating a normative "pull" (e.g., I can legitimately complain *to you* about letting *me* down). It explains the *internal* obligations of collaboration.
          *   *Limitation:* This normativity is confined to the participants within the specific joint activity. It doesn't inherently generate broader moral obligations or explain why collective goals *should* be binding in a deeper sense.
      *   **Searle:** Normative force is **inherent in the collective intentional state itself**.
          *   *Source:* The we-intention. By having the primitive "we-intend to do J," an agent necessarily has a commitment to *J as a collective goal*. This commitment is part of the intentional content. It's constitutive of *what it is* to we-intend.
          *   *Nature:* This commitment is directed *towards the collective action itself* and implies an obligation to do one's part *for the sake of the collective achievement*. It's a more direct normative implication from the mental state. Failing to act violates this constitutive commitment inherent in the state you held.
          *   *Strength:* While Searle posits this inherent normativity, critics argue he doesn't fully *explain its source* beyond stating it's part of the primitive state. It risks being stipulative ("we-intending just *is* being committed").

  2.  **Searle's Primitive: Explanatory or Tautological?**
      *   **Searle's Claim:** He argues collective intentionality *must* be primitive because attempts at reduction (like Bratman's) fail to capture the essential "we-ness." He uses thought experiments (e.g., a group of people independently intending to push a car, unaware of each other vs. a group *collectively* intending to push it) to show that the same physical actions can lack collective intentionality without the primitive "we." He insists this state is psychologically real and basic.
      *   **Bratmanian (and Reductionist) Critique:** Searle risks **naming the phenomenon rather than explaining it**. Critics argue:
          *   **Circularity:** Saying "We J because we we-intend to J" explains very little. It doesn't tell us *how* the we-intention arises, coordinates action, or differs phenomenologically beyond labeling it.
          *   **Mystery:** How does a primitive we-intention emerge in individual minds? How does it connect to individual action? How do multiple individuals "hook onto" the *same* collective intention? Positing a primitive avoids explaining the mechanisms of coordination and sharedness that Bratman tackles head-on.
          *   **Explanatory Burden:** Reductionists argue Bratman's account *does* explain the phenomenon (shared agency) by showing how complex interrelations of individual states *constitute* it. Searle simply posits the phenomenon as a basic mental state without illuminating its structure or how it functions.
      *   **Assessment:** Searle successfully highlights a *problem* for reductionism – the distinct *phenomenology* and *logical structure* of collective action that seems irreducible. However, his solution arguably **risks being merely descriptive** ("this is what collective intentionality *is*") rather than providing a deep *explanation* of how it arises and functions in a world of individual minds. It solves the problem of irreducibility by fiat. Bratman provides a detailed *mechanism*, which Searle rejects as inadequate to capture the essence.

  3.  **Handling Breakdowns and Partial Agreement:**
      *   **Case 1: Participant Stops Caring Midway:**
          *   **Bratman:** This directly attacks the core conditions.
              *   **Loss of Mutual Responsiveness:** The disengaged agent is no longer responsive to the other's intentions and actions regarding the joint goal.
              *   **Loss of Commitment to Mesh:** They no longer care if their actions (or inaction) mesh with the subplans of the other(s).
              *   **Result:** The *shared intention collapses* for Bratman. What remains might be the other agent(s) continuing *individually* (perhaps now intending to "salvage what they can alone"), but the *joint action* ceases. The normative bonds dissolve. It clearly demonstrates the fragility built into the interdependent structure.
          *   **Searle:**
              *   The disengaged agent ceases to hold the primitive "we-intention." Their mental state changes from "We intend to J" to "They intend to J" or "I don't care."
              *   For the *remaining agents*, if they still hold the "we-intention" (perhaps now "We-the-remaining intend to J"), collective intentionality persists *among them*. The collective subject has changed, but the *form* of intentionality remains primitive we-intention.
              *   **Result:** The joint action *as originally constituted* breaks down because the collective subject changed. However, Searle's framework allows for the persistence of collective intentionality among the subgroup still committed. The breakdown is explained by a change in the individual agent's intentional state, not necessarily the collapse of the entire structure of sharedness *per se*.
      *   **Case 2: Acting Together Without Full Agreement (e.g., disagreeing on methods but committed to the goal):**
          *   **Bratman:** This is a core strength of his account. It handles this explicitly.
              *   **Meshing Subplans:** Bratman *requires* that the participants' individual subplans (how they intend to achieve their part) are *compatible* and that they are committed to adjusting them as needed to *maintain* compatibility. It doesn't require identical subplans, just compatible ones and a commitment to coordination.
              *   **Mutual Belief & Responsiveness:** They can disagree on the *best* method, but as long as they mutually believe they are both committed to *some* compatible way of achieving J and are responsive to each other's actions to coordinate, joint action is possible. The disagreement becomes part of the *content* of their mutual responsiveness and negotiation.
              *   **Result:** Partial disagreement is not only possible but expected and managed *within* the framework of shared intention. The "mesh" is dynamic.
          *   **Searle:** This scenario is less directly addressed by his core formulation.
              *   The primitive "we-intention" is directed at the collective goal (J). Individual subplans (how each does their part) may be part of the *background* or *individual* intentionality accompanying the we-intention.
              *   Disagreement on methods might not directly affect the *collective intentional state itself* (we-intend J), as long as the agents still hold that state and believe the others do too. Coordination to resolve the disagreement would rely on mechanisms outside the primitive we-intention itself (like individual intentions to coordinate or Bratman-like mutual responsiveness).
              *   **Result:** Searle *can* accommodate it by locating the disagreement at the level of individual implementation alongside the shared collective goal. However, his framework offers less detailed resources to explain *how* the coordination and meshing *despite* disagreement actually works compared to Bratman. It potentially separates the "collective glue" (we-intend) from the messy details of coordination.

  **Conclusion: Divergent Projects?**

  While both address "acting together," they tackle it from fundamentally different angles:

  *   **Bratman** provides a rich, **explanatory model** of *how* distinct individuals coordinate their minds and actions to create shared agency, generating specific interpersonal normative commitments. He focuses on the *structure* and *achievement* of sharedness.
  *   **Searle** provides an **ontological claim** about the *fundamental nature* of intentionality involved in collective action, arguing that a primitive mode of "we-intending" is essential to capture its distinctive character. He focuses on the *basic kind* of mental state involved.

  Their disagreement is deep: Bratman sees the collective as a complex construction from individual materials, complete with mechanisms for coordination and normative force. Searle sees the collective intentionality as a basic building block of the social world, irreducible to individual parts, carrying its own inherent normative commitment, but offering less detail on the mechanics of coordination. Searle challenges the *possibility* of Bratman's reduction; Bratman challenges the *explanatory power* of Searle's primitive. Understanding both reveals the profound philosophical puzzle at the heart of collective action.
