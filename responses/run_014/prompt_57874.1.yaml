  Below is a diagnostic decision tree designed to sort students by their judgments on the stipulated cases, leading to five distinct outlooks. The tree uses four questions (three case-based, one abstract) and avoids technical language. Unoccupied branches are diagnosed, and limitations are explicitly flagged.

  ### **Decision Tree**
  1. **Longhouse Case**:  
     After the server rollback deleted the communal meeting hall (built over eight weeks with no grade/money at stake), did the students suffer a **genuine loss**?  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q3.  

  2. **Abstract Principle**:  
     Can virtual objects be **truly owned** (like physical objects), not just treated as owned by agreement?  
     - **Yes** → **Computational Realism**.  
     - **No** → **Social Constructivism**.  

  3. **Lent Axe Case**:  
     Was the borrower **doing something wrong** by refusing to return the axe?  
     - **Yes** → Go to Q4.  
     - **No** → **Skepticism**.  

  4. **Cornering Case**:  
     Was the cornering incident (shouting, haptics) a **direct harm** to the targeted person?  
     - **Yes** → **Fictional Expressivism**.  
     - **No** → **Instrumental Harm Only**.  

  ---

  ### **Resulting Leaves**
  1. **Computational Realism** (Q1=Yes, Q2=Yes):  
     Virtual objects are genuine computational property; harms to them/avatars are direct harms to persons.  
  2. **Social Constructivism** (Q1=Yes, Q2=No):  
     Virtual objects are real only through community practices; wrongs matter via external effects on lives/relationships.  
  3. **Fictional Expressivism** (Q1=No, Q3=Yes, Q4=Yes):  
     Virtual objects are imaginative fictions; apparent wrongs reveal the agent’s character/dispositions.  
  4. **Skepticism** (Q1=No, Q3=No):  
     Nothing in-world qualifies as property/harm without external physical/financial/reputational loss.  
  5. **Instrumental Harm Only** (Q1=No, Q3=Yes, Q4=No):  
     Virtual harassment causes harm (e.g., distress), but virtual property lacks moral weight without real-world impact.  

  ---

  ### **Unoccupied Combinations & Limitations**
  - **Q1=No, Q3=No, Q4=Yes**:  
    *Incoherent*: Cornering cannot be "direct harm" (Q4=Yes) if Lent Axe isn’t wrong (Q3=No). Direct harm implies wrongfulness.  
  - **Overlap between Fictional Expressivism and Social Constructivism**:  
    The tree **cannot reliably separate** these if a participant judges *Longhouse=Yes* but *Ownership=No* (Social Constructivism) vs. *Longhouse=No* but *Lent Axe=Yes/Cornering=Yes* (Fictional Expressivism). Both may appeal to "external effects" (e.g., relationships/character), but Social Constructivism requires communal investment (Longhouse=Yes). If students blur this line (e.g., valuing community effort without seeing loss as "genuine"), the tree may misclassify.  

  ---

  ### **Reflexive Note**
  **Least Confident Branch**: Q2 (Abstract Principle on ownership).  
  - **Why**: Ownership intuitions may conflate legal ("by agreement") and metaphysical ("truly owned") senses. A student might reject "true ownership" (Q2=No) but still judge Lent Axe as wrong due to promise-keeping (aligning with Fictional Expressivism, not Social Constructivism).  
  - **Redraw Trigger**: If >20% of Social Constructivism-leaning students (Q1=Yes) answer Q2=Yes *or* Fictional Expressivists (Q1=No) answer Q2=No inconsistently.  
  - **Fix**: Replace Q2 with a case-based question (e.g., "If a player deletes a virtual item they own but others valued, is it *their right*?") to force concrete judgments.  
  - **Failure Point**: Assuming abstract principles cleanly map to case judgments. Students may hold hybrid views (e.g., "ownership is communal but harm is direct"), which the tree forces into discrete leaves.
