  ## The Impossibility of Pure Impartiality: Why Undiscounting Requires Sacrificing Completeness

  **The core dilemma** confronting the ethics of the far future is stark: Sidgwick and Parfit demand impartiality across time, condemning pure time preference (PTP) as irrational discrimination. Yet Koopmans’ theorem demonstrates that within the standard framework of rational intertemporal choice over an *infinite* future, satisfying seemingly minimal requirements (stationarity, continuity, sensitivity) *forces* a discount factor strictly less than one. Undiscounted orderings only avoid this by becoming insensitive to finite differences – precisely the catastrophic suffering they aim to prevent. This essay argues that **genuine undiscounting cannot be saved within the framework requiring a complete, stationary, and continuous ordering over all infinite utility streams.** The only viable escape preserving the moral core of Parfit's objection is to **surrender the requirement for a complete ordering.** Attempts to salvage completeness through declining weights or non-temporal keys either reintroduce PTP by another name or fail to address the fundamental arbitrariness.

  **Koopmans' Trilemma and Its Force:** Koopmans demonstrates that for an unbounded future, we face an inescapable choice:
  1.  **Discounting:** Employ a positive pure discount rate (δ < 1).
  2.  **Insensitivity:** Maintain no discount (δ = 1) but lose sensitivity to finite changes.
  3.  **Violate Stationarity/Continuity:** Abandon one of the other axioms.

  The undiscounter's position collapses if we choose (2), as it renders impotent the very concern for finite future harms or benefits that motivates rejecting PTP. A moral theory unable to distinguish between a world with a century of torture next year and a world where that century is painlessly skipped is useless. Therefore, (2) is morally unacceptable for anyone taking future suffering seriously. This leaves the undiscounter seeking an "exit" through (3).

  **Examining the Exits:**

  1.  **Accepting Positive Pure Discounting:** This is surrender, not rehabilitation. It directly violates Parfit’s core objection: it devalues future wellbeing simply because it occurs later. While it satisfies Koopmans' axioms and ensures sensitivity, it sacrifices temporal impartiality. This is not an "exit" for the undiscounter; it is capitulation.
  2.  **Surrendering Stationarity: Declining Weights (e.g., Hyperbolic Discounting):** Replacing a constant discount factor with weights declining asymptotically towards zero (e.g., hyperbolic discounting) avoids the specific *form* of exponential discounting but **does not escape the core of Parfit's objection. It is pure time preference under another name.** The discount applied to a benefit or harm remains fundamentally determined by its temporal distance from the evaluator, not by any inherent property of the wellbeing itself or the beings experiencing it. While it mitigates the extreme devaluation of the *very* far future inherent in exponential discounting, it still systematically devalues wellbeing further out in time *purely because it is further out in time*. The discrimination Parfit deemed irrational persists; only the *schedule* of discrimination changes. The moral arbitrariness remains.
  3.  **Refusing a Complete Ordering:** This is the only credible path for preserving the *spirit* of undiscounting. We acknowledge that demanding a complete, transitive ranking over *all conceivable infinite utility streams* is an impossible and potentially misguided requirement for practical ethics. Instead, we focus on *partial orderings* based on robust, context-sensitive principles that prioritize preventing catastrophic harms and securing essential thresholds of wellbeing across time, without claiming to rank *every* possible future. We might adopt:
      *   **A Sufficientarian Triage Approach:** Prioritize ensuring no generation falls below a minimum threshold of wellbeing. We can robustly compare futures where this threshold is violated in finite periods versus those where it isn't, without needing to rank all futures where it *is* universally met.
      *   **Catastrophe Avoidance as Paramount:** Treat the prevention of finite but extreme catastrophes (e.g., extinction, massive suffering) as lexically prior to optimizing amongst non-catastrophic futures. We know enough to act decisively against such catastrophes without needing a complete map of the infinite future.
      *   **Non-Archimedean Principles:** Introduce principles that cannot be traded off, such as "no generation may be sacrificed as a mere means for future benefit," providing strong constraints without requiring complete cardinal rankings.

  **The Illusion of Non-Temporal Keys:** What if we key declining weights not to temporal distance, but to something like "expected future wellbeing"? Does this evade Parfit? **No, it merely disguises the time preference.** The "expected future wellbeing" of a period *t* inherently depends on its temporal location – periods further out have more future periods *beyond them* whose uncertain outcomes factor into their "expected future wellbeing." Weighting based on this metric still systematically devalues periods further in the future *because* they are further in the future and thus have a larger, less certain future tail affecting their expected value. The discrimination remains temporally based, mediated through an expected utility calculation. The fundamental source of devaluation is still temporal position.

  **The Verdict:** Koopmans' theorem is correct and devastating for the project of formal, complete, and *stationary* undiscounted intertemporal ethics over an infinite future. Parfit’s objection to PTP as irrational discrimination stands. Attempts to preserve completeness through non-stationary weights or non-temporal keys either reintroduce temporal discrimination or fail to provide a coherent, impartial alternative.

  **Therefore, the undiscounting position can only be saved by abandoning the demand for a complete ordering over all infinite futures.** We must relinquish the ambition of a grand utilitarian calculus ranking every conceivable eternal outcome. Instead, we embrace a more modest, practically focused ethics of the far future grounded in robust partial comparisons: preventing catastrophic harms, securing basic sufficiency, and adhering to deontic constraints against temporal exploitation. This sacrifices the elegance and comprehensiveness of the discounted utilitarian framework but preserves the core moral conviction that the suffering of a being a billion years hence matters just as much, in itself, as the suffering of a being today. We cannot formally *rank* all futures impartially, but we can and must *act* impartially by prioritizing the prevention of finite suffering whenever and wherever it might occur. The impossibility of completeness is not a license for discrimination; it is a call for focused moral vigilance on the catastrophes we *can* foresee and prevent. We give up the map of eternity to keep our moral compass true.

