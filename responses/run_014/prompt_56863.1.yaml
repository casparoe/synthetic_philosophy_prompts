  Rejecting completeness feels like the strongest path. We can't compare all infinite futures, but we can prioritize avoiding catastrophic losses. This aligns with Parfit's emphasis on preventing great harms without claiming to rank every possible outcome. It sidesteps Koopmans by denying his premise that we need a full ordering. 

  The user might worry this is a cop-out, so I emphasize how it preserves moral urgency for finite suffering while acknowledging epistemic limits. Framing it as "triage ethics" makes it actionable—exactly what a seminar needs to avoid paralysis. 

  I should stress why other exits fail: discounting violates impartiality; non-stationary weights are time preference in disguise; well-being indexing doesn't fix the arbitrariness. The verdict must be clear: undiscounting stands only if we sacrifice completeness. 

