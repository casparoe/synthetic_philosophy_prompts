answer: |-
  Below is a complete design for your in-class Simpson's paradox game, structured to maximize engagement, reveal the core lesson, and fit within 75 minutes. The game forces students to confront the limitations of mechanical disaggregation by using identical numbers in two causally distinct scenarios.

  ---

  ### **Game Title**: **The Paradox Pill Protocol**  
  *The Cure Might Be in the Context*  

  **Learning Goals**:  
  1. Experience Simpson's paradox as a high-stakes decision (not just a math oddity).  
  2. Discover that "always disaggregate" leads to catastrophic errors when the partitioning variable is post-treatment.  
  3. Recognize that causal structure (not data patterns) resolves the paradox.  

  **Setup**:  
  - **Students**: 14 acting as a Drug Advisory Board.  
  - **Stakes**: Points = patient outcomes. Each student receives a "Patient Welfare Score" (PWS) based on population outcomes. Higher PWS = better grade bonus (e.g., +1% per 100 points).  
  - **Materials**:  
    - **Handout 1**: Aggregate data table (identical for Rounds 1 & 2).  
    - **Handout 2**: Subgroup data (leaked mid-discussion).  
    - **Voting cards**: Approve/Reject.  
    - **Outcome cards**: Revealed after votes.  
    - **Causal diagram slides**: For debrief.  
    *(Printable templates included at end)*  

  ---

  ### **Timeline (75 min total)**  
  **Round 1: Pre-Treatment Confounder (Severity)**  
  *(Time: 0–35 min)*  

  1. **Intro & Setup (5 min)**:  
     - *"You’re reviewing Drug X for 'CerebroFlex Syndrome.' Decide whether to approve it for the whole population. Your votes affect real patient outcomes."*  
     - Distribute **Handout 1 (Aggregate Data)**:  
       | Group      | Recovered | Total Patients | Recovery Rate |  
       |------------|-----------|----------------|--------------|  
       | **Drug X** | 260       | 400            | 65%          |  
       | Placebo    | 160       | 400            | 40%          |  
       - *Drug effect: +25% recovery*  

  2. **Initial Discussion (5 min)**:  
     - *"Discuss: Based on this, should we approve Drug X?"*  
     - **Predictable issue**: Students will lean toward approval (aggregate shows clear benefit).  

  3. **"Leak" Subgroup Data (5 min)**:  
     - Distribute **Handout 2 (Subgroups: Disease Severity)**:  
       - *Mild Cases*:  
         | Group      | Recovered | Total | Rate |  
         |------------|-----------|-------|------|  
         | **Drug X** | 180       | 300   | 60%  |  
         | Placebo    | 150       | 300   | 50%  |  
         - *Effect: +10%*  
       - *Severe Cases*:  
         | Group      | Recovered | Total | Rate |  
         |------------|-----------|-------|------|  
         | **Drug X** | 80        | 100   | 80%  |  
         | Placebo    | 10        | 100   | 10%  |  
         - *Effect: +70%*  
     - *"Stakeholder note: Subgroup analysis shows Drug X is less effective for mild cases!"*  

  4. **Crisis & Vote (15 min)**:  
     - *"New data! Reassess under time pressure. Vote in 2 min."*  
     - **Key tension**: Aggregate (+25%) vs. Mild (+10%)/Severe (+70%).  
     - **Predictable reactions**:  
       - Stats students: *"Disaggregate! Mild effect is weak."*  
       - Philosophy students: *"Why is mild underperforming? Investigate!"*  
     - **Forced vote**: Approve or Reject (majority wins).  

  5. **Reveal Round 1 Outcome (5 min)**:  
     - **TRUTH**: Severity is a *pre-treatment* confounder. Doctors gave Drug X more often to severe cases.  
     - **Correct decision**: **Approve** (drug helps everyone).  
     - **Scoring**:  
       - Approve: **+1,000 pts** (population recovers better).  
       - Reject: **-500 pts** (missed benefits).  

  ---

  **Round 2: Post-Treatment Collider (Adherence)**  
  *(Time: 35–65 min)*  

  6. **Reset Scenario (2 min)**:  
     - *"Same drug, new disease: 'NeuroVascular Inflammation.' Same trial data!"*  
     - Redistribute **Handout 1 (SAME Aggregate Data)**.  

  7. **Initial Discussion (3 min)**:  
     - *"Aggregate data identical to last time. Vote now?"*  
     - **Predictable issue**: Students distrust aggregate after Round 1. May rush to disaggregate.  

  8. **"Leak" Subgroup Data (5 min)**:  
     - Distribute **Handout 2 (Subgroups: Medication Adherence)** (Same numbers, relabeled):  
       - *High Adherence*: Identical to *Mild* table (60% vs. 50%).  
       - *Low Adherence*: Identical to *Severe* table (80% vs. 10%).  
     - *"Stakeholder note: Drug X only works for patients who skip doses!"*  

  9. **Crisis & Vote (15 min)**:  
     - **Key tension**: Same numbers, but now adherence is *post-treatment* (affected by drug side effects).  
     - **Predictable reactions**:  
       - Stats students: *"Disaggregate! Low adherence group shows huge benefit."*  
       - Philosophy students: *"But we can’t encourage skipping doses!"*  
     - **Forced vote**: Approve or Reject.  

  10. **Reveal Round 2 Outcome (5 min)**:  
      - **TRUTH**: Adherence is a *post-treatment* collider. Skipping doses correlates with unmeasured resilience.  
      - **Correct decision**: **Approve** (aggregate is unbiased).  
      - **Scoring**:  
        - Approve: **+1,000 pts** (drug works overall).  
        - Reject: **-1,000 pts** (missed benefits; subgroup analysis misled).  

  ---

  ### **Debrief (65–75 min)**  
  **Flip the Script**:  
  - *"Same numbers, opposite correct decisions. Why?"*  
  - Show causal diagrams:  
    - **Round 1 (Severity)**: Confounder → Treatment → Outcome (conditioning correct).  
    - **Round 2 (Adherence)**: Treatment → Collider ← Resilience → Outcome (conditioning *creates* bias).  

  **Key Lessons**:  
  1. **Data alone can’t tell you when to disaggregate** (identical tables, opposite conclusions).  
  2. **Marginal vs. conditional association**:  
     - Round 1: Marginal association confounded → trust conditional.  
     - Round 2: Marginal association causal → conditional biased by collider.  
  3. **Causal knowledge > mechanical rules**:  
     - *"Disaggregation works for pre-treatment confounders (e.g., severity), fails for post-treatment colliders (e.g., adherence)."*  

  **Connect to Formalism**:  
  - Simpson’s paradox = non-collapsibility.  
  - Conditioning only "works" when the variable blocks confounding paths (backdoor criterion).  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Students freeze on arithmetic**:  
     - *Fix*: Provide pre-calculated rates. Emphasize: *"Focus on interpretation, not math."*  

  2. **Treating it as a "lying with stats" trick**:  
     - *Fix*: Debrief explicitly: *"The paradox isn’t about deception—it’s about causal structure. Both tables are 'honest.'"*  

  3. **Over-indexing on Round 1**:  
     - *Fix*: Announce *"Round 2 is a new disease"* and reset votes. Physically swap handouts.  

  4. **Ignoring stakes**:  
     - *Fix*: Remind them of PWS: *"Your grade bonus depends on patient outcomes."*  

  ---

  ### **What the Game Can’t Replicate**  
  **The need for causal knowledge from outside the data**:  
  - In the game, you *declare* whether severity/adherence is pre/post-treatment.  
  - In reality, this requires domain expertise (e.g., *"Adherence can’t be measured pre-treatment"*).  
  - **How to handle**: Lecture *during debrief*:  
    *"Outside knowledge tells us severity is pre-treatment (diagnosed at admission), while adherence is post-treatment (you can’t adhere to a drug you haven’t taken). Tables alone can’t tell you this."*  

  ---

  ### **Printable Handouts**  
  **Handout 1 (Aggregate Data)**:  
  ```markdown
  # Drug X Trial: Aggregate Results  
  | Group      | Recovered | Total Patients | Recovery Rate |  
  |------------|-----------|----------------|--------------|  
  | **Drug X** | 260       | 400            | 65%          |  
  | Placebo    | 160       | 400            | 40%          |  
  ```  

  **Handout 2 (Subgroups)**:  
  ```markdown
  # Subgroup Analysis (Round 1: Severity | Round 2: Adherence)  
  ## GROUP A [Mild Severity / High Adherence]  
  | Group      | Recovered | Total | Recovery Rate |  
  |------------|-----------|-------|--------------|  
  | **Drug X** | 180       | 300   | 60%          |  
  | Placebo    | 150       | 300   | 50%          |  

  ## GROUP B [Severe Severity / Low Adherence]  
  | Group      | Recovered | Total | Recovery Rate |  
  |------------|-----------|-------|--------------|  
  | **Drug X** | 80        | 100   | 80%          |  
  | Placebo    | 10        | 100   | 10%          |  
  ```  

  **Outcome Cards**:  
  - **Round 1 Truth**: *"Severity is pre-treatment. Drug X benefits ALL patients. Mild: True effect +15% (not +10%). Severe: True effect +70%. Aggregate was confounded."*  
  - **Round 2 Truth**: *"Adherence is post-treatment. Drug X benefits ALL patients equally. Subgroup bias: 'Low adherence' patients are naturally resilient (unmeasured)."*  

  ---

  By forcing students to vote under identical numerical conditions but opposite causal structures, this game makes Simpson’s paradox viscerally memorable. The debrief ties their emotional frustration (*"But the tables were the same!"*) directly to the formal lesson: **causal diagrams > contingency tables**.
