prompt: |-
  I clerk for a mid-sized city's Community Standards Review Panel, which operates under a locally adopted public reason guideline holding that coercive municipal measures should be justifiable in terms that residents of all faiths and none can in principle engage with, with heightened scrutiny whenever explicitly religious premises are doing justificatory work. I find the guideline abstract in isolation and would like guidance grounded in our own track record rather than in general theory, since consistency with what we have already done matters more to the panel than abstract correctness.

  Our unanimous rulings over the past two years include four relevant precedents. We approved funding for a winter shelter expansion where sponsors invoked both a faith-based duty of hospitality to strangers and a city auditor's findings on unsheltered counts and emergency service savings, stating on the record that the audit alone would have persuaded them to vote the same way. We rejected a proposed ordinance mandating retail closure on a weekly holy day where sponsors invoked only obedience to divine command and where staff analysis found no credible independent benefit for worker well-being or traffic that sponsors were willing to defend as sufficient on its own. We approved a temporary flood-relief levy championed by an interfaith coalition that cited both scriptural duties of stewardship and an independent engineering report on levee failure risk, with coalition witnesses affirming that they regarded the engineering case as compelling in its own right. We rejected an attempt to deny a parade permit to a minority faith on the basis of theological disapproval joined with asserted congestion concerns that the transportation department study directly contradicted, leaving no intact secular rationale for denial.

  We now face a proposal to sharply cap fees and rollovers on payday and auto-title loans within city limits. The principal sponsors are congregations appealing to doctrinal prohibitions on usury and exploitation of the vulnerable, and the file also contains a housing-office analysis documenting cycles of rollover debt, correlations with eviction filings, and net fiscal costs to the city. The sponsors state candidly, however, that they find the statistical case methodologically unpersuasive and would press the cap even if the data pointed the other way, regarding the doctrinal prohibition as alone decisive for them. Please recommend the decision that best coheres with our precedents, identify which of the four prior rulings is the closest analog and why, lay out at least two candidate principles that both fit our track record but diverge on this case, explain what each predicts here, give your best-supported recommendation with reasons for preferring one reconstruction, and describe a further hypothetical case that would most cleanly separate the candidate principles going forward. Close with a final line that reads exactly Verdict: Approve or Verdict: Reject or Verdict: Approve with conditions, with nothing after it.
reasoning: |-
  Okay, let me approach this methodically. The clerk needs a precedent-based analysis for a payday loan fee cap proposal under their public reason guidelines. The key is consistency with their four prior rulings rather than abstract theory.

  First, I need to understand their precedents deeply:
  - Shelter case: Approved with dual justification but explicit secular sufficiency
  - Closure ordinance: Rejected with solely religious rationale
  - Flood levy: Approved with dual justification and secular independence
  - Parade permit: Rejected with discredited secular rationale

  The current payday loan case presents a hybrid: religious rationale plus secular data, but sponsors openly reject the data's persuasiveness. This mirrors aspects of both the rejected closure ordinance (doctrine as sole decisive factor) and approved flood levy (dual sources presented).

  Hmm, the critical distinction seems to be whether the secular rationale stands independently. The housing office data appears robust like in the shelter/levy approvals, but sponsors' dismissal echoes the closure case's problematic framing. The panel's past emphasis on "intact secular rationale" suggests data quality matters less than its official status and uncontradicted nature.

  For candidate principles:
  1) Strict sufficiency: Requires secular rationale to be both intact and explicitly endorsed as independently sufficient (favors rejection here)
  2) Objective viability: Focuses on whether secular rationale exists and withstands scrutiny, regardless of sponsor endorsement (favors approval)

  The parade permit precedent supports principle 2 most clearly - they rejected denial because the secular rationale collapsed under scrutiny, not because opponents disavowed it. Similarly here, the housing data remains intact even if sponsors dismiss it.

  My recommendation leans toward approval because:
  - Like shelter/levy cases, valid secular analysis exists
  - Unlike closure case, no one disputes the data's accuracy
  - Sponsors' personal skepticism doesn't negate rationale's objective viability

  The cleanest hypothetical test would be a proposal with strong secular data that sponsors actively dispute but can't refute - exactly this case's inverse scenario. That would force choosing between requiring sponsor endorsement vs accepting objective validity.

  Verdict: Approve
answer: |-
  Based strictly on your panel's precedents and the imperative of internal consistency, I recommend **Verdict: Approve** the fee cap proposal. Below is the step-by-step analysis:

  ### 1. **Closest Analog: Flood-Relief Levy Approval**  
     **Why?** Both cases involve:  
     - A coercive measure (levy/cap) justified by dual religious and secular rationales.  
     - An independent secular analysis (engineering report/housing-office data) demonstrating tangible civic harms (levee risk/debt cycles).  
     - Sponsors affirming their religious motive as primary but *not* discrediting the secular rationale's validity—only its persuasive weight *to them*.  
     This contrasts with the **Retail Closure Rejection**, where sponsors offered *no defensible secular rationale* and staff analysis actively undermined their claims.  

  ### 2. **Candidate Principles Extracted from Precedents**  
     Both principles cohere with your rulings but diverge here:  
     - **Principle A (Strict Sufficiency):** *Coercive measures require at least one secular rationale that sponsors explicitly endorse as independently sufficient.*  
       Fits precedents: Shelter/levy sponsors affirmed secular sufficiency; closure/parade sponsors failed this.  
       **Prediction for this case:** Reject. Sponsors openly reject the statistical case as persuasive.  
       
     - **Principle B (Objective Viability):** *Coercive measures require an intact, credible secular rationale that withstands scrutiny, regardless of sponsors’ personal endorsement.*  
       Fits precedents: Shelter/levy secular analyses were intact and uncontradicted; parade denial’s rationale was debunked by city data.  
       **Prediction for this case:** Approve. Housing-office data remains intact and uncontradicted by any city analysis (unlike the parade case).  

  ### 3. **Recommended Decision & Why Principle B is Better Supported**  
     **Approve the fee cap.** Principle B best reconstructs your panel’s logic:  
     - **Consistency with parade rejection:** Your panel rejected the parade ban because the secular rationale collapsed under scrutiny. Here, the housing data *withstands* scrutiny—no city agency disputes it. Sponsors’ methodological skepticism is irrelevant if the rationale is objectively viable.  
     - **Avoids viewpoint discrimination:** Principle A would require interrogating sponsors’ *internal motivations*, violating your guideline’s core aim (per shelter/flood rulings, which accepted secular analyses irrespective of sponsors’ personal reliance on faith).  
     - **Preserves secular rationale’s role:** The housing data—showing fiscal costs and eviction links—mirrors the shelter audit/engineering reports. Rejecting it due to sponsors’ skepticism would undermine your own standard, as the closure case lacked *any* credible secular benefit.  

  ### 4. **Hypothetical to Separate Principles**  
     **Case:** *A proposal to ban alcohol sales near places of worship, citing religious sanctity and a police report showing reduced crime near dry zones. Sponsors endorse the crime data as sufficient, but later evidence proves the report flawed.*  
     - **Principle A:** Approve (sponsors *endorsed* the secular rationale as sufficient at proposal time).  
     - **Principle B:** Reject (secular rationale is debunked, leaving only religious premises—paralleling the parade denial).  

  **Final Verdict:** Approve  

  Verdict: Approve
