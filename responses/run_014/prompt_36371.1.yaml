answer: |-
  ## The Enchanted Credence: Why Sleeping Beauty Must Be a Thirder

  The Sleeping Beauty problem presents a deceptively simple scenario that fractures probabilistic intuition. A fair coin is tossed on Sunday; if Heads, Beauty is awakened once (Monday); if Tails, she is awakened twice (Monday and Tuesday), with her memory of Monday erased before Tuesday. Upon each awakening, she knows the protocol but not the coin result or the day. The question is: what should her credence be that the coin landed Heads?

  The **Halfer** argues credence should remain 1/2. Beauty knew on Sunday the coin was fair, and upon waking, she learns nothing new *about the coin outcome*. She was certain an awakening would occur; this one provides no specific evidence favouring Heads or Tails. Her epistemic state regarding Heads is unchanged.

  The **Thirder** contends credence should be 1/3. They argue Beauty’s total evidence upon awakening is not just "an awakening occurred," but rather "this awakening is occurring now." Crucially, there are *three* possible centred experiences compatible with her knowledge: (Heads & Monday), (Tails & Monday), and (Tails & Tuesday). Given the symmetry of the setup and the coin’s fairness, each of these is equally likely *from her perspective upon awakening*. Since Heads is true in only one of these three scenarios, P(Heads) = 1/3.

  The **Double-Halfer** attempts a compromise, maintaining P(Heads) = 1/2 unconditionally, while resisting conditionalisation steps that would lead to absurdities like P(Heads | Monday) = 1/2 despite Monday always occurring. This position often struggles with coherence under pressure.

  To adjudicate, we must subject these views to rigorous testing:

  **1. The Pricing Test:**
  Suppose Beauty can buy a ticket on each awakening costing £10, paying £30 if Heads, settled post-experiment. Over many repetitions:
  *   If Heads (50% of experiments), Beauty buys 1 ticket for £10, wins £30, net +£20.
  *   If Tails (50% of experiments), Beauty buys 2 tickets for £20, wins £0, net -£20.
  *   Expected net gain per experiment: (0.5 * £20) + (0.5 * -£20) = £0.
  *   Expected net gain *per ticket purchased*: (£0 per experiment) / (1.5 tickets/experiment) = £0.

  The fair price per ticket is £10 (the £30 payout multiplied by the *objective* probability Heads occurs on a *random awakening*, which is 1/3). A Beauty who buys at £10 breaks even *per ticket*. A Beauty who buys at £10 *only if her credence is 1/3 or higher* would buy every ticket offered. A Halfer Beauty, believing P(Heads)=1/2, would see the ticket as having an expected value of (1/2 * £30) - £10 = £5 > £0. She would happily buy it every time. Yet, as shown, this leads to an expected loss *over time* because she buys twice as many tickets in the losing (Tails) worlds.

  Is this a mere divergence between fair betting quotients and credence under centred evidence? No. The divergence here is not an acceptable feature of self-locating uncertainty; it is a *symptom of error*. Rational credence should guide action. If Beauty’s credence in Heads is genuinely 1/2 upon awakening, she *should* value the ticket at £15 and see £10 as a bargain. But acting on this belief systematically impoverishes her. This demonstrates that the halfer credence misrepresents the *likelihood of Heads being true given the specific centred context of "this awakening"*. The thirder credence of 1/3 delivers the correct betting behaviour: buying at £10 is break-even, aligning with the objective chances governing her payouts based on the experiment's structure. The halfer view fails this pragmatic test decisively.

  **2. The Extreme Test:**
  Replace the fair coin with a lottery: Beauty wins with probability 1/1,000,000 (awakening once), loses with probability 999,999/1,000,000 (awakening one million times). Upon awakening, Beauty knows the setup.

  The halfer insists her credence in winning remains 1/1,000,000. She knew the odds on Sunday, and awakening provides no new *uncentred* evidence. Yet, intuitively, upon awakening, Beauty is virtually *certain* she has lost. The chance that *this specific awakening* is the single win awakening is astronomically small compared to the chance it is one of the million loss awakenings. The halfer position becomes untenable here, demanding Beauty cling to a tiny credence in winning that seems utterly disconnected from her reality.

  This differs from the original coin not merely in degree, but in principle. It starkly reveals the flaw in the halfer’s exclusive focus on the uncentred proposition "Heads/Win." Beauty’s awakening doesn’t just inform her that *some* awakening occurred; it informs her that *this specific, centred experience* – "I am awake now" – is occurring. In the extreme case, the vast majority of possible "now" experiences occur only if she has lost. The halfer position forbids her from updating her credence in the uncentred proposition "Win" based on this overwhelming centred evidence about the likelihood of *this moment*. The thirder position correctly incorporates this evidence: P(Win | This Awakening) = 1 / (1 + 999,999) ≈ 1/1,000,000. The extreme case forces the recognition that credence must be responsive to the *indexical* nature of the evidence gained upon awakening. The halfer view fails this intuitive test.

  **Verbal Dispute or Substantive Difference?**
  The dispute is partly verbal but ultimately substantive. The core ambiguity is what proposition "Heads" refers to *for Beauty upon awakening*. The halfer interprets it purely as the uncentred proposition: "The coin landed Heads." By this strict definition, Beauty truly gains no new evidence relevant to changing *that* credence. However, this interpretation ignores the fundamental nature of her uncertainty. Her ignorance isn't just about the coin; it's deeply *self-locating* ("Is it Monday or Tuesday?"). Her total epistemic state upon awakening is defined over a space of *centred possible worlds*: (Heads, Mon), (Tails, Mon), (Tails, Tue).

  Therefore, the best resolution distinguishes:
  1.  **Uncentred Credence (Halfer Domain):** Beauty's credence in the uncentred proposition "The coin landed Heads" *does* remain 1/2 throughout. She learns nothing that changes this.
  2.  **Centred Credence (Relevant upon awakening):** When Beauty considers "What should my degree of belief be *now, at this awakening*, that the coin landed Heads?", she is asking about a proposition that depends on her location. Her current centred evidence ("I am experiencing an awakening") makes the centred proposition "Heads and this is the only awakening" (i.e., Heads & Monday) less likely than the centred proposition "Tails and this is one of two awakenings." The thirder position correctly quantifies *this* credence as 1/3.

  **Verdict:**
  Sleeping Beauty, upon awakening, should hold a **credence of one-third that the coin landed Heads**. The halfer position, while coherent regarding the uncentred proposition, fails both the Pricing Test (by prescribing irrational action) and the Extreme Test (by demanding absurdly counterintuitive credences). The double-halfer position lacks stability under conditionalisation. The thirder position provides the correct framework for understanding Beauty's *centred* epistemic state upon awakening. Her uncertainty encompasses not just the coin outcome but her temporal location within the experiment. In this context, the centred evidence "this awakening is happening now" makes Heads objectively less probable *relative to her current perspective* than the uncentred evidence alone suggests. The fair betting behaviour and the intuitive force of the extreme case confirm that Beauty's rational credence *at an awakening* in the uncentred proposition "Heads" must be updated to reflect the indexical information gained, yielding one third. To deny this is to deny the relevance of self-locating evidence to rational belief and action.
