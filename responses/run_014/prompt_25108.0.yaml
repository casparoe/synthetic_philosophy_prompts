answer: |-
  You've hit on one of the most persistent objections to evolutionary debunking arguments (EDAs) in metaethics—the **cognitive scope problem**. Your reconstruction is spot-on, and the worry is legitimate. Let's break down the options, costs, and possible solutions. I'll outline the main strategies philosophers use to resist this overgeneralization, with their trade-offs.

  ### The Core Dilemma Recap:
  - **Premise (2)** is the engine of the problem: *"If a belief was produced by a process that doesn’t track truth about its subject matter, it’s unjustified without independent confirmation."*
  - Applied to morality (premises 1–3), it debunks moral realism.
  - Applied to perception/logic (4–6), it leads to global skepticism (absurdity).
  - **Conclusion** (7): Either reject (2), or find a relevant difference between morality and perception/logic.

  Most realists (moral or otherwise) reject the *universal application* of (2) or refine it significantly. Here are the main moves:

  ---

  ### 🛡️ **Option 1: Reject Premise (2) as Overly Broad**  
  **The Move:** Premise (2) is too strong. We *can* trust beliefs from processes that *reliably* produce true beliefs, even if they weren’t selected *for* truth-tracking. Evolution *might* have incidentally produced truth-tracking faculties.  
  **Cost for Debunkers:** Weakens the moral debunking argument. If evolution *could* deliver truth-tracking faculties elsewhere, why not for morality?  

  **Sub-options:**  
  - **Reliabilism:** Justification comes from *actual reliability*, not the *reason* for reliability. Perceptual/logical beliefs are reliable (verified by science/pragmatic success); moral beliefs lack comparable verification.  
    - *Cost*: Moral realism might survive if moral beliefs can be shown reliable (e.g., via reflective equilibrium).  
  - **Proper Functionalism** (Plantinga): Beliefs are justified if produced by cognitive faculties functioning *properly* in their intended environment. Evolution designed perception for survival, which *requires* rough accuracy about the environment.  
    - *Cost*: Still debunks morality if moral faculties weren’t "designed" to track truths.  

  **Does it save perception/logic?** ✅  
  **Does it save morality?** ❓ (Debunkers argue moral truth-tracking lacks evidence of reliability.)

  ---

  ### 🔍 **Option 2: Find a Relevant Difference Between Morality and Perception/Logic**  
  **The Move:** Accept (2) but argue evolution *does* track truth for perception/logic, but *not* for morality.  

  #### **A. The "Pragmatic Success" Argument**  
  Perception/logic enable survival *because* they track reality (e.g., dodging predators requires accurate spatial beliefs). Math/logic underpin tool-making, causal reasoning, etc.  
  - **For Perception**: Evolution selects for *ecological fitness*, which requires *approximate truth* about the world. A frog’s "dots" track flies well enough to eat; our "laptop" tracks objects well enough to manipulate them.  
  - **For Logic/Math**: Basic arithmetic ("two predators → danger") or inference ("if rustling, then predator") must track abstract truths to be useful. Evolution converges on these because they’re necessary for any agent in any world.  

  **Why Morality is Different**:  
  - Moral intuitions (e.g., "don’t steal") promote cooperation *regardless of moral truth*. They could be adaptive fictions (e.g., "stealing is wrong" deters punishment, even if no moral facts exist).  
  - **Key Point**: Truth-tracking isn’t needed for moral intuitions to enhance fitness. Social conformity suffices.  

  **Cost**:  
  - 🤔 *Is perception really "truth-tracking"?* Illusions (e.g., bent stick in water) show it’s not perfect. Reply: Reliability ≠ infallibility; science corrects errors.  
  - 🤔 *Does logic/math need truth?* If evolution selected for "good enough" reasoning (e.g., probability heuristics), higher math might be unreliable. Reply: Core logic/math are inescapable (e.g., modus ponens works in all contexts).  

  #### **B. The "Independent Verification" Argument**  
  Perception/logic can be *externally validated*; morality cannot.  
  - **Perception**: We cross-check senses (touch the laptop), build instruments (microscopes), and develop scientific consensus.  
  - **Logic/Math**: We formalize systems (e.g., proofs in arithmetic) and apply them successfully (e.g., engineering).  
  - **Morality**: No intersubjective tests or devices to detect "moral facts." Moral disagreement persists without resolution.  

  **Cost**:  
  - 😕 Moral realists argue for moral "discovery" via reason (e.g., Kant) or empirical observation (e.g., naturalist realism).  
  - 😕 If independent verification is required, does this condemn *all* unverifiable beliefs (e.g., aesthetic judgments)?  

  #### **C. The "Corrigibility" Argument**  
  Perceptual/logical beliefs are *corrigible* through evidence; moral intuitions resist correction.  
  - If you doubt perception, you can test it. If you doubt 2+2=4, you can count apples.  
  - Moral intuitions (e.g., disgust at homosexuality) often persist despite counter-evidence (e.g., harmlessness).  

  **Cost**:  
  - 😬 Some moral realists (e.g., Parfit) argue moral progress occurs via reason (e.g., rejecting slavery).  
  - 😬 Perception isn’t always corrigible (e.g., hallucinations).  

  ---

  ### 💥 **Option 3: Embrace Global Skepticism (The Nuclear Option)**  
  **The Move**: Accept that EDAs undermine all cognition. We can’t trust perception, logic, or science—including evolutionary theory itself.  
  - **Cost**: Self-defeating. If logic is unreliable, you can’t run the debunking argument.  
  - **Who Pays?** Only radical skeptics (rare).  

  ---

  ### 🧩 **Your Best Path Forward**  
  1. **Reject Premise (2) for Perception/Logic**: Argue that evolution *does* converge on truth for these domains (via pragmatic success/corrigibility).  
  2. **Preserve Premise (2) for Morality**: Stress that moral intuitions lack truth-tracking mechanisms *and* independent verification.  

  **Does this save the debunking argument?** Yes, but it must lean hard on the **explanatory gap**:  
  - Evolution *explains why* we have moral intuitions without invoking moral facts ("hurting innocents is wrong" aids cooperation, full stop).  
  - For perception/logic, evolution *explains why* we have reliable faculties (survival requires rough truth-tracking).  

  **What You Pay**: Moral realism. You must accept that moral intuitions are adaptive fictions unless given independent grounding (e.g., rationalist ethics).  

  **What You Keep**: Science, logic, and common sense—with the caveat that all cognition is fallible and subject to empirical refinement.  

  ---

  ### 📚 **Key Thinkers & Further Reading**  
  - **Against Debunking**: Sharon Street (EDAs target morality only), David Enoch (*Morality and Mathematics* parallels).  
  - **For Debunking**: Richard Joyce (*The Evolution of Morality*), Guy Kahane (on scope problems).  
  - **Middle Ground**: Justin Clarke-Doane (moral/math parallels), Alvin Plantinga (proper function).  

  You’re right that the speaker likely had a response—probably a version of Option 2A. But the debate is live because no solution is cost-free. If you preserve science by accepting evolution’s truth-tracking for perception/logic, you owe an account of *why morality is different*. The strongest answer points to morality’s dispensability in evolutionary explanation: We’d have the same intuitions even if moral facts didn’t exist. For perception/logic, we wouldn’t survive if they were wildly false.
