answer: |-
  ### Essay Question  
  **Analyze the epistemic status of the Church-Turing Thesis (CTT) and adjudicate the following dispute:**  
  *A physicist announces a device that solves the halting problem by exploiting exotic quantum-gravitational processes. Commentator A argues this refutes CTT, while Commentator B contends it only refutes a "Physical CTT" (the claim that all physically computable functions are Turing-computable) and leaves the original CTT untouched.*  
  In ~1000 words, defend a position on what kind of claim CTT is (e.g., definition, empirical conjecture, or framework commitment) and how this determines whether the device *could* refute it. Your analysis must:  
  1. Distinguish the original CTT (linking "effective method" and Turing-computability) from its physical strengthening.  
  2. Explain how evidence (e.g., the device) bears differently on each claim.  
  3. Justify which commentator is correct, grounding your verdict in CTT’s epistemic nature. Avoid historical narrative; focus on conceptual arguments.  

  ---

  ### Model Answer (600 words)  
  The Church-Turing Thesis (CTT) asserts that every effectively calculable function is Turing-computable. Crucially, this is not an empirical conjecture but a *conceptual claim* that partially defines "effective method" by aligning it with a formal model. The hypothetical device refutes only a *physical* extension of CTT, not the original thesis. Commentator B is correct, and their position reveals why CTT’s epistemic status immunizes it against empirical counterexamples.  

  CTT bridges an informal notion ("effective method") and a formal one (Turing-machine computability). "Effective method" refers to procedures that are deterministic, finite, and mechanically executable by an idealized human without creativity—capturing the pre-theoretic concept of computation. Turing’s analysis justifies CTT by arguing that any such method reduces to symbol manipulation on a tape, abstracting from physical limitations. Thus, CTT functions as a **framework commitment**: it fixes the meaning of "computation" within mathematics by stipulating that Turing machines exhaust the space of coherently conceivable algorithms. This is not a falsifiable hypothesis but a truth grounded in conceptual analysis, akin to defining "bachelor" as "unmarried man."  

  The physicist’s device, which exploits quantum-gravity to solve the halting problem, challenges a *physical* strengthening of CTT: "All functions computable by physical processes are Turing-computable." This claim *is* empirical, as it depends on contingent laws of physics. If verified, the device refutes this version by showing exotic processes exceed Turing-machine capabilities. However, it cannot refute original CTT, which concerns *conceivable* methods, not physically instantiated ones. For example, "oracle machines" compute non-Turing-computable functions, but we exclude them as "ineffective" because they require unmediated access to uncomputable information. Similarly, the device’s quantum-gravitational processes likely involve non-finite or non-deterministic elements (e.g., unmeasurable superpositions) that violate the constraints implicit in "effective method." CTT’s epistemic strength lies in this asymmetry: while physical CTT is testable via experiments, original CTT is evaluated through conceptual coherence.  

  Commentator A’s error is treating CTT as a quasi-empirical claim about human cognition or extant technology. But CTT does not state "humans can compute only Turing-computable functions"; it abstracts from flesh-and-blood limitations. Evidence from physics is irrelevant here because CTT’s support comes from the **failure to conceive of a counterexample** under shared constraints (finiteness, determinism). For instance, despite decades of attempts, no intuitively "effective" method violates CTT—not even quantum algorithms, which remain Turing-computable. The hypothetical device’s "computation" would resemble an oracle: it might *calculate* the halting problem but not via an effective *method*, as its exotic processes defy mechanical reproducibility. Thus, we would reject it as falling outside CTT’s scope, reinforcing rather than refuting the thesis.  

  In sum, CTT is a definitional linchpin for computation theory. The device refutes only physical CTT, affirming that empirical discoveries cannot threaten claims grounded in conceptual necessity.  

  ---

  ### Marking Scheme (Total: 20 points)  
  **A-grade answers must contain these moves:**  
  1. **Distinguish original CTT from physical CTT** (5 points)  
     - *Required:* Clearly state that original CTT links the *informal notion* of "effective method" (finite, mechanical procedures) to *formal* Turing-computability, while physical CTT claims all *physically realizable* processes are Turing-computable.  
     - *Typical mishandle:* Conflating the two or misdefining "effective method" as dependent on current physics.  

  2. **Explain epistemic asymmetry in support** (5 points)  
     - *Required:* Argue that original CTT is supported by conceptual analysis (e.g., Turing’s arguments, inability to imagine counterexamples) and is not empirically testable, whereas physical CTT is contingent on physical laws and falsifiable by devices like the one described.  
     - *Typical mishandle:* Treating original CTT as testable or citing historical consensus as its primary support.  

  3. **Adjudicate the commentators with reasoned verdict** (5 points)  
     - *Required:* Explicitly endorse Commentator B and justify it by showing the device’s "computation" would not qualify as an "effective method" (e.g., due to non-finitude/non-determinism in exotic physics), leaving original CTT intact.  
     - *Typical mishandle:* Claiming the device refutes CTT or dismissing both commentators without engagement.  

  4. **Clarity, coherence, and avoidance of irrelevance** (5 points)  
     - *Required:* Structured argument with a clear thesis; no significant digressions into history or formal proofs.  
     - *Typical mishandle:* Spending >20% of the essay on Church/Turing’s motivations or technicalities of the halting problem.  

  **Grade boundaries:**  
  - A (18–20): All moves present, precise, and philosophically nuanced.  
  - B (15–17): Key moves covered but with minor gaps (e.g., vague asymmetry explanation).  
  - C (12–14): Superficial treatment (e.g., labels CTT "empirical" without justification).  
  - D/F (<12): Ignores scenario, misdefines CTT, or recites history.
