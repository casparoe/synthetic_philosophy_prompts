answer: |-
  ### Research Proposal: The Causal Status of Omissions in Preemptive and Overdetermined Harm  

  #### **I. Central Research Question**  
  When an agent fails to perform an action that could have prevented a harm, but the harm occurs anyway due to an independent cause or a later intervention, what is the causal status of the omission? Specifically:  
  - Should it be classified as a **cause** of the harm?  
  - Is it merely a **background condition** (a non-causal enabling factor)?  
  - Or does it represent a **distinct category of causal contribution** (e.g., a "quasi-cause" or "difference-maker")?  

  This question targets cases where harm is *overdetermined* (multiple factors suffice to produce it) or *preempted* (one factor intercepts another’s potential to prevent harm). For example:  
  - A security guard fails to lock a door, but a fire breaks out independently and destroys the building regardless.  
  - A doctor neglects to administer a treatment that would have saved a patient, but the patient dies from an unrelated, unstoppable condition.  

  #### **II. Why Standard Accounts Leave the Issue Open**  
  Three dominant theories of causation fail to resolve this problem conclusively:  

  1. **Counterfactual Accounts**:  
     - Define causation via necessity: "C caused E" if E would not have occurred without C.  
     - *Problem*: In preemptive cases, the omission (e.g., not locking the door) is *not* necessary—the harm would still occur via the independent cause (e.g., the fire). Thus, omissions are excluded as causes. This clashes with moral intuition (e.g., the guard seems blameworthy).  
     - *Gap*: Cannot distinguish omissions from irrelevant absences (e.g., not building a fortress) and ignores cases where omissions intuitively "contribute" to harm.  

  2. **Process-Based Accounts**:  
     - Require a physical connection (e.g., energy transfer) between cause and effect.  
     - *Problem*: Omissions are absences; they lack physical properties. A guard’s failure to lock a door involves no energy transfer, so it cannot be a cause.  
     - *Gap*: Fails to explain why some omissions (e.g., a doctor’s neglect) are treated as causal in legal/medical contexts, while others (e.g., a bystander’s inaction) are not.  

  3. **Responsibility-Based Accounts**:  
     - Reduce causation to moral/legal liability: An omission is causal if the agent had a duty to act.  
     - *Problem*: Conflates causation with responsibility. Two guards may share equal blame for failing to lock a door, but if one’s omission is preempted (e.g., a flood destroys the building before the other could act), their causal roles may differ.  
     - *Gap*: Cannot resolve cases where responsibility is clear (e.g., contractual duty) but the causal link is absent (e.g., harm was inevitable).  

  These accounts either *overexclude* omissions (counterfactual/process views) or *overinclude* them (responsibility views), leaving the causal status ambiguous in overdetermined contexts.  

  #### **III. Method for Making Progress**  
  A three-part methodology will clarify the causal role of omissions:  

  **A. Taxonomy of Cases**  
  Classify scenarios along two axes to isolate variables:  
  1. **Source of Overdetermination**:  
     - *Preemptive*: An independent cause occurs first (e.g., fire preempts the guard’s chance to lock the door).  
     - *Symmetric*: Multiple factors are simultaneously sufficient (e.g., two toxins independently cause death; one was preventable by an omission).  
  2. **Type of Omission**:  
     - *Duty-Bound*: Agent has a specific obligation (e.g., doctor, security guard).  
     - *Non-Duty*: Agent has no obligation (e.g., passerby ignores a drowning swimmer).  
  *Example Taxonomy*:  
  - Case 1 (Preemptive/Duty): Guard fails to lock door; arsonist’s fire destroys building.  
  - Case 2 (Symmetric/Duty): Two guards each fail to lock separate doors; either lock would have prevented theft.  
  - Case 3 (Preemptive/Non-Duty): Bystander fails to rescue a child; a falling tree kills the child anyway.  

  **B. Test Cases to Separate Causation from Responsibility**  
  Design scenarios to decouple causal intuition from moral/legal judgments:  
  - *Test Case A*: A nurse omits a treatment that would delay a patient’s death, but the patient dies minutes later from an incurable condition. *Variant*: The nurse had no duty (e.g., was off-duty).  
  - *Test Case B*: A chef fails to clean a spill, but a diner slips due to independently wet floors. *Variant*: The spill was unrelated to the fall.  
  *Purpose*: By varying duty and inevitability, we isolate when people attribute *causation* (e.g., "the omission changed the outcome’s timing/nature") versus *responsibility* (e.g., "the agent was negligent").  

  **C. Proposed Criterion for Causal Relevance**  
  I propose: **An omission is causally relevant in overdetermined cases if it removes a barrier that *would have been* necessary for prevention in the closest non-overdetermined world.**  
  - *Explanation*: Even if harm was overdetermined, the omission is causal if, in a minimally altered scenario without the independent cause, the omission alone would suffice for harm.  
  - *Application*:  
    - In Case 1, if locking the door *could* have stopped the fire in a fire-only world, the omission is causal.  
    - If the fire was unstoppable (e.g., inferno), the omission is a background condition.  
  - *Advantage*: Avoids counterfactual fragility by anchoring in "closest worlds" and distinguishes causal relevance from blame.  

  #### **IV. Final Deliverable**  
  A comprehensive paper (12,000 words) addressing:  
  1. A critique of existing accounts’ failures in overdetermined cases.  
  2. The taxonomy/test cases framework.  
  3. The proposed criterion, defended against objections (e.g., "Why not treat all omissions as non-causal?").  
  4. Implications for law (e.g., negligence) and ethics (e.g., moral luck).  

  #### **V. Criteria for Project Failure**  
  The project fails if:  
  1. The taxonomy cannot distinguish causal roles across cases (e.g., duty-bound and non-duty omissions yield identical intuitions).  
  2. The criterion collapses into responsibility-based accounts (e.g., causal judgments track *only* duties).  
  3. Test cases reveal no stable distinction between causation and responsibility.  

  #### **VI. Realistic Month-by-Month Plan**  
  - **Months 1–2**: Refine taxonomy; draft test cases.  
  - **Months 3–4**: Analyze standard accounts’ limitations; develop objections.  
  - **Months 5–6**: Formalize the criterion; apply to test cases.  
  - **Months 7–8**: Identify and rebut counterarguments (e.g., "Does the criterion overextend causation?").  
  - **Months 9–10**: Draft paper sections; integrate revisions.  
  - **Months 11–12**: Finalize paper; prepare for dissemination.  

  ---  
  **Total words**: 1,190  
  This proposal addresses the causal ambiguity of omissions by combining conceptual clarity with practical testing, advancing toward a defensible criterion for overdetermined harm.
