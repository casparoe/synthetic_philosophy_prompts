  I've been thinking about Parfit's teleporter thought experiment on my own for a while now, and I recently ran into a draft answer that a friend wrote for a philosophy exam. I'd like you to grade the answer and give specific comments on what's right and what's wrong, so that I can give my friend useful feedback. Here's the question and the answer:

  **Question:** In Parfit's discussion of the teleporter thought experiment, he distinguishes between two cases: the case in which the original is destroyed and the case in which the original is not destroyed (and a duplicate is created). According to Parfit, what matters in the survival case is not identity but a certain relation he calls "Relation R." Explain what Relation R is, and explain why Parfit thinks that what matters in the standard teleporter case (with destruction) is no worse for the person than ordinary survival, but that what matters in the duplicate case is present to a lesser degree.

  **Student's answer:** Relation R is the relation of psychological continuity, which means that there is a chain of overlapping memories and other psychological connections between two stages of a person. Parfit thinks that what matters in the standard teleporter case (with destruction) is no worse for the person than ordinary survival because Relation R holds between the original and the copy. In the duplicate case, what matters is present to a lesser degree because Relation R holds only in a weaker sense — specifically, because the copy is not unique, the psychological continuity is "divided" between the original and the copy, so each of them has only a partial share of what matters.

  Please grade the answer on a scale of A to F, and give specific comments on each part of the answer, noting what's correct, what's incorrect, and what's missing.
