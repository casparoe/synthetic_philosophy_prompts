answer: |-
  Here’s a sharp, flowing sequence targeting Williams’ deepest integrity objections, avoiding predictable territory and forcing engagement with the nuances you want—especially the motivation/justification split and the identical-utility case. I’ve embedded follow-ups to preempt her likely replies.

  ---

  ### Opening: The Core Integrity Objection
  > "Williams argues utilitarianism reduces the agent to a 'mere conduit' for satisfying others’ preferences, dissolving projects that are genuinely *theirs*. Your response typically emphasizes that personal projects *do* create utility. But doesn’t that instrumentalize them? If my love for philosophy only has value because it happens to maximize welfare *this time*, isn’t Williams right that nothing is ever truly *mine* to do for its own sake—only as a vehicle for the impersonal good?"

  ### The Drowning Wife: Motivation vs. Justification (The Heart of Your Ask)
  > "Take Williams’ drowning wife case. The husband saves his wife without utilitarian calculation. You’d say that’s fine—even ideal—because the *decision procedure* uses ‘it’s my wife!’ while the *criterion of rightness* is utilitarian. But let’s press the ‘one thought too many’. **Is the problem that the thought appears in his *justification* (if asked why he saved her), or in his *motivation* (why he *actually* did it)?**  
  > *(If she says justification)*: So if his *motive* is pure love, but he *justifies* it later by saying ‘Saving her maximized utility’, is that still alienating?  
  > *(If she says motivation)*: If his *motive* is ‘Saving her maximizes utility’, but he never voices it, is the *action* itself compromised? Or is Williams worried about the self-understanding of the agent?"

  ### Follow-Up: The Decision Procedure Defense Under Pressure
  > "Suppose the husband *does* think, ‘I’m saving her because spouses saving each other generally maximizes utility’. You’d call this bad deliberation—a ‘faulty’ decision procedure. But **if the utilitarian *theory itself* tells him this thought is faulty, doesn’t that mean the theory *requires* him to deliberate in a way that hides its own truth from him?** Isn’t that a deep instability—good utilitarians must *avoid* thinking like utilitarians?"

  ### The Identical-Utility Trap (Where Criterion & Verdict Collide)
  > "Now imagine a variant: My wife and a stranger are drowning. I can save only one. Rescue costs, risks, and consequences are *identical* on every utilitarian metric—total welfare, equality, rights protection. Pure symmetry. **Does your theory permit me to save my wife? Or must I flip a coin?**  
  > *(If she says ‘permitted’)*: What grounds this permission? If the *outcomes* are identical, what utilitarian principle makes saving my wife non-wrong? Isn’t this a value *outside* utility?  
  > *(If she says ‘flip a coin’)*: Isn’t this result itself alienating? If utilitarianism forces indifference between my spouse and a stranger when utilities match, doesn’t that confirm Williams’ charge that it attacks the ‘ground projects’ constituting identity?"

  ### The Self-Undermining Charge: Impartiality or Unique Pathology?
  > "You often argue Williams’ ‘alienation’ critique applies to *all* impartial moral theories. But consider: Utilitarianism uniquely recommends raising children to *reject* utilitarianism if that maximizes utility (e.g., teaching deontology to foster stable commitments). **When the theory *requires* creating agents who must disbelieve it to serve it, isn’t this more than impartiality—isn’t it a self-devouring paradox? How is this not a special cost for utilitarianism?"**

  ### Closing: Integrity as More Than Preferences
  > "Williams’ point isn’t just that utilitarianism is demanding—it’s that it dissolves the self. If my ‘integrity’ is just another set of preferences to be fed into the calculus, doesn’t that miss his deeper claim: that some commitments define *who I am*, such that betraying them makes me ‘someone else’? Can utilitarianism acknowledge this constitutive role of projects without ceasing to be utilitarian?"

  ---

  ### Why this sequence works
  1. **Motivation vs. Justification**: Forces her to disentangle Williams’ "one thought too many" ambiguity head-on. Her answer reveals whether she thinks alienation infects deliberation, action, or accountability.  
  2. **Identical-Utility Trap**: Cornering. If utilities are truly equal, her theory either demands coin-flips (absurdly alienating) or smuggles in non-utilitarian value (self-refuting). The decision-procedure dodge fails because the *verdict* is at stake.  
  3. **Self-Undermining**: Blocks the "all impartial theories" deflection by highlighting utilitarianism’s unique propensity to *manufacture* agents who reject it—a literal alienation from its own truth.  
  4. **Flow**: Starts with core integrity, drills into drowning wife nuances, escalates to symmetrical drowning (hardest case), then traps the impartiality deflection. Ends with Williams’ existential point about identity.  

  **Delivery Tip**: Lean into the identical-utility case. It’s the most underrated and lethal. If she tries to deny symmetry is possible, press hard: "If *everything* that matters to utility is identical, what breaks the tie? If nothing, coin-flip. If something, it’s not utility." This exposes where utilitarianism bleeds into pluralism.
