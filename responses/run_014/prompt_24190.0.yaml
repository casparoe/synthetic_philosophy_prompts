prompt: |-
  Write a short story about the reference class problem. A person who has just been diagnosed with a disease, and the doctor gives them survival stats for a bunch of different groups they belong to — the group with their symptom, the group with their treatment, the group their age. The stats point in very different directions, and they cant just pick the group that sounds best. The point is to make the reader feel the tension of not knowing which reference class is the "right" one to use.
reasoning: |-
  Okay, the user wants a short story about the reference class problem, centered on a character who gets conflicting survival stats from different groups they belong to. The core tension should be the agony of not knowing which reference class is "correct."

  Hmm, this is actually a brilliant way to humanize a statistical paradox. The reference class problem is dry in theory, but when applied to life-and-death diagnosis... that's where the emotional weight lies. The user clearly understands the concept well – they're asking for a narrative that makes readers *feel* the uncertainty, not just understand it intellectually.

  Let me unpack their request deeper:  
  First, they want a medical scenario (diagnosis), which is perfect because medicine is where reference class ambiguity hits hardest. Survival rates vary wildly based on how you slice the data – age, comorbidities, treatment type, etc.  

  Second, they specified three conflicting reference classes: symptoms, treatment, and age. Good concrete examples. I'll make sure each stat feels legitimately defensible so the choice isn't obvious.  

  Third, the emotional core is "tension." Not just confusion, but active distress. The character *can't* just cherry-pick the rosiest statistic – that's crucial. I need to show why each group has flaws (e.g., age ignores treatment efficacy, treatment groups ignore age vulnerability).  

  For names... "Maya" feels right. Short, unassuming, someone you'd root for. Dr. Evans as the physician – professional but visibly uncomfortable with the ambiguity.  

  Setting the scene:  
  - Opening with the diagnosis shock ("incurable" lands harder than "serious").  
  - Doctor delivers stats methodically, almost clinically, which contrasts with Maya's spiraling panic.  
  - Stats must be plausibly divergent:  
    Symptom group: 35% (broad, pessimistic)  
    Treatment group: 65% (optimistic but excludes her fragility)  
    Age group: 15% (harsh reality check)  
  - No resolution. End on her paralysis in the parking lot, staring at percentages that feel like "dice in the dark." The metaphor of gambling with her life ties it together.  

  Key lines to include:  
  - "Which of these numbers is *mine*?" (Makes it personal)  
  - The doctor admitting stats are "messy" (undercuts authority)  
  - Focus on her physical sensations (paper crinkling, cold keys) to ground the abstraction.  

  Biggest risk is making the stats lecture-y. Need to bury the math in human moments – her son's birthday party, how she touches her collarbone like a talisman. The numbers should haunt, not educate.
answer: |-
  Dr. Evans’s office was too warm, the air thick with the smell of antiseptic and dread. Maya sat frozen, the words "Stage III Astral Carcinoma" echoing in the hollow space the doctor’s diagnosis had carved inside her. "Incurable," he’d said gently, "but treatable. Manageable. We have options."

  Options. The word felt slippery. Then came the numbers. Survival rates. Five-year survival rates. The statistics meant to offer a compass, a sliver of predictability in the terrifying unknown.

  Dr. Evans pulled up charts on his screen. "Now, survival varies significantly depending on several factors, Maya. It’s complex, but let’s look at the groups you belong to."

  **Group One:** "Based on your specific presentation – the neurological symptoms you’re experiencing alongside the primary tumor – patients in this *symptomatic group* have a documented five-year survival rate of... approximately **35%**." He tapped the screen. A graph showed a line dipping sharply. Maya’s knuckles whitened on the armrest. Thirty-five. Barely a third.

  *Okay,* she thought, the number pressing down on her chest. *That’s... a starting point.*

  **Group Two:** "However," Dr. Evans continued, clicking to a new window, "the treatment we’re proposing, Protocol Sigma-9, has shown promising results. Focusing specifically on patients *receiving this treatment*, the five-year survival jumps considerably." He pointed. "This cohort shows **65%**."

  Maya blinked. Sixty-five? A spark flickered. Hope, fragile and desperate. *That’s better. Much better. That’s… manageable?*

  **Group Three:** Dr. Evans wasn’t done. "We also must consider age. You’re 72, Maya." He brought up another chart, a starkly different landscape. "For patients *over 70* with Stage III Astral Carcinoma, regardless of specific symptoms or initial treatment response, the overall five-year survival rate is..." He paused, almost apologetic. "Closer to **15%**."

  Fifteen percent.

  The warmth of the room vanished, replaced by an icy tremor. Thirty-five. Sixty-five. Fifteen. Three numbers, each claiming to represent *her* odds, each belonging to a perfectly valid group she was undeniably a part of.

  *Which one is mine?* The question screamed silently in her head. *Am I the 35% defined by my frightening symptoms? The 65% buoyed by the hopeful new treatment? Or the grim 15% dictated by the unforgiving march of years?*

  Dr. Evans saw the turmoil. "Statistics are... messy," he offered, his voice soft. "They’re averages across populations. They don’t capture the individual. We use the treatment group as our primary guide for planning, but... age is a significant factor. The symptoms group gives context for potential complications." He spread his hands helplessly. "It’s about finding the most relevant reference class, but... that relevance isn't always clear-cut."

  Maya stared at the conflicting charts. The Symptom Group (35%) felt like her present reality – the dizziness, the tingling hands. The Treatment Group (65%) was the future she desperately wanted to believe in – the infusion chair, the fight. The Age Group (15%) was the cruel, unblinking truth – time itself, the enemy she couldn't outrun.

  She couldn't just choose the 65%. That felt like cheating, like ignoring the calendar and the persistent ache in her bones. Ignoring the 15% felt like denial. But the 35%... was that the compromise? The "average" fate? Was she an average 72-year-old with these symptoms? Or did the cutting-edge treatment truly override the decades?

  The tension wasn't just fear of the disease; it was the vertigo of standing at the crossroads of multiple identities, each offering a wildly different prophecy. Her life, her remaining time, condensed into incompatible percentages. Which lens showed the true picture? Which reference class held the key to *her* future?

  She left the office clutching pamphlets about Protocol Sigma-9. The hopeful 65% glowed on the cover. But the other numbers – the thirty-five, the crushing fifteen – echoed in the sterile hallway, each vying for dominance in her mind. She wasn't just fighting cancer; she was lost in a statistical labyrinth, desperately searching for the exit marked "Your Truth," knowing it might not even exist. The only certainty was the paralyzing weight of the question: *Which number is mine?* Her future felt like dice tumbling in the dark, impossible to call.
