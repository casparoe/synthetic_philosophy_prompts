prompt: |-
  I'm a PhD student in political philosophy, and my dissertation keeps circling the separateness of persons objection without ever landing on it. My advisor's line is that the objection is a family of complaints wearing one coat, and that most responses in the literature answer only one member of the family. I half believe her, but I also can't find anywhere that just lays out what the family members are. So before I read yet another paper I want the spec first: what does any adequate theory of moral aggregation have to deliver in order to count as respecting the separateness of persons? For my purposes the theory needs to be good enough for institutional choice -- how a state may trade off harms and benefits across its citizens -- not necessarily for private ethics, though say so if you think that restriction is doing suspicious work.

  Some of the cases I'd want on the list, though I'm sure I'm missing some: why I can accept a headache now to avoid my own agony later but can't impose your headache to relieve my agony (the intra- vs interpersonal tradeoff asymmetry); one person's torture versus tiny benefits spread over millions (transplant-adjacent but the budget version: a public health program that foreseeably kills a few to spare many small burdens); the utility monster; the fact that we're allowed to favor our kids over strangers, which pure aggregation seems to deny; whether aggregation is fine among strangers but not when a single person's life gets used up, or whether that's just a threshold effect and not a difference in kind; and whether there's any real distinction left between separateness of persons and the separateness of agents that anyone has to respect (states aggregate the choices of citizens all the time and nobody objects on these grounds). For each requirement I want the case or consideration that motivates it, and I want you to mark which are genuinely non-negotiable and which are just preferences of the anti-aggregation camp dressed up as constraints -- I suspect "no aggregation ever" and "aggregation is fine but not across life prospects" get conflated constantly.

  The part I most want to see: which pairs of requirements, if any, can't be jointly satisfied, because if the list itself is unsatisfiable that's actually my thesis chapter and not a problem. And which single requirement knocks out the most candidates -- my bet is it's something about interpersonal compensation, the idea that gains to one person can't count as compensating losses to another, and that it kills not just utilitarianism but prioritarianism too, which is awkward for people who present prioritarianism as the separateness-respecting reform of utilitarianism. At the end, briefly, score utilitarianism with diminishing marginal utility, prioritarianism, Rawlsian maximin, and Scanlon-style contractualism against your own list -- but keep that part short, the scoring is the least interesting bit and I can do it myself; the criteria are where the thinking is. A table is fine if it helps.
reasoning: |-
  Okay, the user is a PhD student in political philosophy wrestling with the separateness of persons objection in their dissertation. Their advisor suggests it's a family of complaints, but they can't find a clear breakdown. They need a structured list of requirements any moral aggregation theory must meet to respect separateness, specifically for institutional choices like state policies.

  First, I need to unpack what "separateness of persons" entails. Rawls introduced it as a critique against utilitarianism's tendency to treat individuals as mere containers for utility. But the user is right—it's not a monolithic idea. Different philosophers emphasize different aspects: compensation across persons, personal prerogatives, prohibitions on using persons as means, etc. The challenge is categorizing these coherently.

  The user listed several cases: intra vs. interpersonal trade-offs (headache vs. agony), small harms to many vs. large harm to few (public health killing a few), utility monsters, partiality to family, thresholds for life prospects, and state aggregation. Each case points to distinct requirements. For example, the headache case highlights non-compensation across persons, while the utility monster exposes issues with unrestrained aggregation.

  I should identify core requirements. Start with the non-negotiable ones. Non-Compensability Across Persons (NCAP) seems fundamental—gains for one don't morally offset another's loss. That's why you can't impose a headache on someone else to avoid your agony. Then there's the Constraint on Using Persons as Means (CUPM), which forbids sacrificing one for aggregate benefits, like in transplant cases. These feel like bedrock principles.

  Then there are negotiable requirements. Personal Prerogatives (PP) allow partiality, like favoring your kids, but this might be less crucial for state institutions. Threshold-Sensitivity (TS) suggests aggregation is acceptable until vital interests are threatened, but the exact threshold is debatable. Agent-Relative Restrictions (ARR) distinguish individual vs. state actions, which might not be a core separateness issue but more about agency.

  Potential conflicts arise. For instance, CUPM (no sacrificing individuals) might clash with TS (aggregation allowed below a threshold). If a policy harms one person significantly but below the "life prospects" threshold, is it acceptable? Also, NCAP challenges prioritarianism, which weights gains to the worse off but still aggregates across persons. Does that violate non-compensation?

  Scoring the theories briefly: Utilitarianism fails NCAP and CUPM. Prioritarianism might satisfy TS but still violates NCAP. Maximin avoids CUPM violations but is too rigid. Contractualism handles CUPM well but struggles with dispersed harms. The user suspects NCAP is the killer—it rules out both utilitarianism and prioritarianism, which is a key insight for their thesis.

  The user’s deeper need might be to show that the requirements are mutually unsatisfiable, making their dissertation point. Highlighting conflicts between NCAP and TS, or PP and institutional neutrality, could be pivotal. They also want to clarify that prioritarianism isn't the solution it's often presented as, due to NCAP. That’s a strong thesis angle.
answer: |-
  Here’s a structured breakdown of requirements for any institutional aggregation theory to respect the separateness of persons (SoP), organized by the cases/considerations you raised. I’ve marked **Non-Negotiable (NN)** for constraints widely seen as core to SoP (even by aggregators), and **Negotiable/Contested (N/C)** for those reflecting anti-aggregationist priorities or trade-offs. Conflicts are highlighted, and a scoring table follows.

  ---

  ### **Core Requirements for Respecting Separateness of Persons (Institutional Context)**
  *(Key: **NN** = Non-Negotiable; **N/C** = Negotiable/Contested)*

  1. **Non-Compensability Across Persons (NCAP)**  
     - **Case:** Intra- vs. interpersonal trade-off asymmetry (your headache for your future agony = permissible; imposing *my* headache to relieve *your* agony = impermissible).  
     - **Requirement:** Gains to one person cannot *morally compensate* for losses to another. The state cannot treat citizens as fungible containers of value.  
     - **Status:** **NN** (Widely accepted as *the* core SoP objection; targets utilitarianism’s "social sum" approach).  
     - *Conflict Point:* Directly undermines classical utilitarianism *and* prioritarianism (which permits cross-person compensation if weighted toward the worse off).

  2. **Constraint on Using Persons as Mere Means (CUPM)**  
     - **Case:** Public health program that foreseeably kills a few to spare many small burdens (e.g., "budget transplant").  
     - **Requirement:** Institutions cannot sacrifice one person’s fundamental interests (life, bodily integrity, basic liberty) *solely* to achieve aggregate net benefits for others.  
     - **Status:** **NN** (Derived from Kantian/deontological ethics; Rawls/Nozick/Scanlon all endorse variants).  
     - *Conflict Point:* Clashes with strong aggregation (e.g., saving a million from minor headaches by killing one person).

  3. **No Utility Monsters (NUM)**  
     - **Case:** Utility monster (one individual whose utility gains swamp everyone else’s losses).  
     - **Requirement:** No individual’s interests can dominate institutional choices regardless of distributional fairness.  
     - **Status:** **N/C** (Anti-aggregationists use this to expose absurdity; aggregators argue diminishing marginal utility solves it).  
     - *Note:* Easily satisfied by most non-utilitarian theories; not a major hurdle.

  ---

  ### **Negotiable/Debatable Requirements**
  4. **Permission for Agent-Relative Partiality (PARP)**  
     - **Case:** Favoring your children over strangers.  
     - **Requirement:** Institutions may (or must) permit *individuals* to prioritize personal ties, but need not replicate this partiality in *state* policy.  
     - **Status:** **N/C** (SoP is often conflated with personal prerogatives; but for *institutions*, neutrality is often expected).  
     - *Conflict Point:* Demands institutional neutrality, conflicting with theories requiring state-enforced familialism.

  5. **Threshold-Sensitivity (TS)**  
     - **Case:** Aggregation fine for small harms but not for life-destroying losses.  
     - **Requirement:** Aggregation is permissible only below a threshold of "significant harm" (e.g., not affecting life prospects).  
     - **Status:** **N/C** (Anti-aggregationists see thresholds as ad hoc; others argue it’s essential for feasible policy).  
     - *Conflict Point:* Risks collapsing into CUPM if threshold is "fundamental interests"; otherwise, arbitrary.

  6. **Agent-Relativity of Aggregation Authority (ARAA)**  
     - **Case:** States may aggregate citizen preferences (e.g., voting) without violating SoP, but individuals cannot.  
     - **Requirement:** Only institutions with legitimate authority may aggregate across persons; individuals lack this license.  
     - **Status:** **N/C** (Distinguishes SoP from "separateness of agents"; contested whether states have unique aggregation rights).  
     - *Note:* Justifies state action but doesn’t resolve *how* it should aggregate.

  ---

  ### **Key Conflicts Between Requirements**
  - **NCAP vs. ANY Aggregation:** NCAP forbids *all* interpersonal trade-offs. Satisfying it requires near-total rejection of aggregation (e.g., Scanlon’s "no justifiable complaint" test).  
  - **CUPM vs. TS:** If TS sets thresholds too low, it violates CUPM; if too high, it permits intuitively unacceptable sacrifices (e.g., killing one to cure 1 billion headaches).  
  - **PARP vs. Institutional Neutrality:** Demanding state partiality (e.g., favoring citizens) may violate SoP by treating outsiders as less valuable.

  **Most Damaging Requirement**: **NCAP** (Non-Compensability Across Persons). It rules out:  
  - Classical & total utilitarianism (directly),  
  - Prioritarianism (still aggregates across persons; weights aren’t compensation),  
  - Most forms of consequentialism.  
  *Your suspicion is correct: Prioritarianism does NOT resolve NCAP.*

  ---

  ### **Theory Scoring Against Requirements**
  | **Requirement**              | **Utilitarianism (w/ DMU)** | **Prioritarianism** | **Maximin (Rawls)** | **Scanlonian Contractualism** |
  |------------------------------|---------------------------|-------------------|-------------------|---------------------------|
  | **NCAP** (NN)                | ❌ Fails (aggregates sum) | ❌ Fails (weights but aggregates) | ⚠️ Mixed (avoids compensation but lexical) | ✅ Passes (no cross-person balancing) |
  | **CUPM** (NN)                | ❌ Fails (allows sacrifices) | ❌ Fails (allows if weighted) | ✅ Passes (forbids) | ✅ Passes (forbids) |
  | **NUM** (N/C)                | ⚠️ Passes (if DMU applied) | ✅ Passes | ✅ Passes | ✅ Passes |
  | **PARP** (N/C)               | ❌ Fails (demands neutrality) | ⚠️ Mixed (depends on weights) | ⚠️ Mixed (permits but doesn’t require) | ✅ Passes (allows personal prerogatives) |
  | **TS** (N/C)                 | ❌ Fails (no thresholds) | ⚠️ Partial (weights but no strict threshold) | ✅ Passes (lexical threshold) | ✅ Passes ("burdensomeness" threshold) |
  | **ARAA** (N/C)               | ✅ Passes (authority neutral) | ✅ Passes | ✅ Passes | ✅ Passes |

  **Summary**:  
  - **Utilitarianism (w/ DMU)**: Fails core NN requirements (NCAP, CUPM).  
  - **Prioritarianism**: Fails NCAP (fatal for SoP) and CUPM; not a genuine SoP alternative.  
  - **Maximin**: Strong on CUPM/TS but rigid; weak on dispersed harms (e.g., many small losses vs. one large gain).  
  - **Contractualism**: Best on NN requirements but struggles with large-number aggregation (e.g., climate policy).

  ---

  **Thesis Fuel**: The list *is* unsatisfiable if you insist on all NN requirements. **NCAP + CUPM alone rule out all forms of interpersonal aggregation**. Theories that "respect SoP" (e.g., Scanlon) relax NCAP for trivial harms or use thresholds (TS), but this concedes aggregation is *sometimes* permissible—contradicting pure NCAP. Your advisor is right: SoP is a family, and NCAP is the strict parent few live with. Prioritarianism’s failure on NCAP is a critical gap in the literature. If your thesis shows NCAP is incompatible with *any* institutional aggregation, you’ve landed the plane.
