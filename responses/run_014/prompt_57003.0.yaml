prompt: |-
  I keep going in circles on whether my phone is literally part of my mind, and I think the only way to sort it out is to lay out my gut calls case by case and see if there's a real principle hiding underneath them.

  Background: years ago I read that paper with the guy who has Alzheimer's and carries a notebook around — Otto, and Inga who just remembers the museum's address normally — and it felt obviously right at the time. But now I'm not sure it's earning its keep, because when I actually go through my own cases the verdicts don't fall out the way that paper wants them to.

  Here they are:

  1. The paper notebook where I write down every number, every grocery list, every half-formed arguement I want to come back to. Counts. Losing it would feel like losing part of my memory, not like losing a possession.

  2. My phone's photo library. Also counts. I genuinely don't remember what my niece looked like at two and the phone does, but consulting it doesn't feel like checking the world, it feels like remembering.

  3. Googling something. Doesn't count. As far as I can tell this is structurally the same as 1 and 2, but it feels like being told rather than thinking. Still no.

  4. My wife's memory for names and dates. Twenty years together, and I ask her when the Hendersons' wedding was in exactly the same automatic way I open the notebook. But her memory is not part of my mind and never will be. She'd be appalled and I'd agree with her.

  5. Our shared family calendar. Counts, for both of us. Which is embarrassing given 4, because the calendar is basically just her memory written down where I can reach it.

  6. A calculator. Counts when I sit down and use it. But there's a version where it's running in the background all day auto-categorizing my spending, and there I'd say no, I didn't compute anything at all.

  7. The car GPS. Doesn't count, and here's the part I can't explain to myself: after ten years of driving to the same office with it I still don't know the route. Whereas after ten years of the notebook I can often recite a number without looking. So maybe what matters is whether the thing leaves a residue in my head. But then 2 should fail too, since I can't recall a single one of those photos.

  8. The chatbot I've spent a year messing with — saved instructions, our whole history, it knows how I argue. This is the one I flip flop on. Some days it's the best scratchpad and second memory I have; other days it's obviously just a very fluent stranger.

  So: is there a principle that delivers 1 through 7 correctly? My suspicion is that any honest one has to be pretty baroque, and that either the 4/5 pair or the 1/3 pair is going to blow up the simple versions. What I want is the principle stated clause by clause, with each clause tied to the case that forces it; what it says about 8; and its verdict on at least one case I haven't listed here but should have. And if one of my verdicts has to be given up, tell me which one and argue for it. If it comes down to it I'd rather be argued out of the GPS one than the wife one.
reasoning: |-
  Hmm, the user is really wrestling with the extended mind hypothesis here. They've laid out eight concrete cases from their life where the boundary between "my mind" and "external tool" feels blurry, and they're frustrated that the classic Otto/Inga thought experiment doesn't map cleanly onto their lived experience. What they're secretly asking for is cognitive architecture - a set of rules that explains why some tools feel like self while others feel like other.

  Okay, let's autopsy their cases first. Notebook (1) and photo library (2) pass their "feels like me" test effortlessly. But Google (3) fails despite structural similarity - that's our first clue the answer isn't just about information storage. The wife case (4) is fascinating because it highlights social boundaries: even deeply coupled cognition stops at skin for them. Yet the shared calendar (5) somehow counts despite being proxy for wife's memory - contradiction territory. Calculator usage (6) gets split between active vs passive engagement. GPS (7) fails their test precisely because it doesn't leave mental residue, which ironically makes photo library (2) a problem case. And the chatbot (8) lives in quantum superposition between internal and external.

  Their suspicion about "baroque principles" is dead on. Any honest framework must account for at least four dimensions: reliability (notebook vs spotty wifi), transparency (calendar vs Google's black box), personalization (fine-tuned chatbot vs generic search), and most importantly - the residue question they stumbled on with GPS. But residue can't be the whole story because photos don't leave recall traces yet still feel internal. Unless... what if the feeling of "mineness" comes from controlled access rather than neural imprint? 

  For the wife/calendar paradox (4/5), the key is that the calendar transforms her biological memory into artifact - it becomes their collectively owned terrain. Whereas asking the wife directly keeps the knowledge anchored in her sovereign consciousness. The notebook/Google rift (1/3) might turn on predictability: the notebook's contents are perfectly known even when unrecalled, while Google's results are emergent and unstable. 

  On the chatbot (8), I'm leaning toward "not self" - not because it's artificial, but because its responses remain fundamentally opaque and uncontrollable. Even with saved instructions, there's always that moment where it surprises you, breaking the transparency requirement. The new test case they're missing should be something like muscle memory - is a tennis racket part of your mind when your serve depends on its weight distribution? 

  If we have to sacrifice one verdict, GPS (7) is the weakest. They're already conflicted about the residue argument, and one could argue that after ten years, the GPS ritual has become a cognitive habit - the pressing of buttons, the listening for turns - that's just as much "you" as reaching for the notebook. But I'll honor their preference to keep wife separate; that relational boundary feels existentially important. 

  The synthesis: tools become mind when they're as reliable as synapses, as transparent as introspection, and woven into your daily cognitive routines until consulting them feels like breathing. Everything else is just intelligence borrowed.
answer: |-
  Your gut verdicts reveal a nuanced, multi-factor principle that exposes the limitations of the Otto/Inga paper. The core insight is that **cognitive extension requires both *functional integration* and *phenomenological transparency***, but with critical sub-clauses triggered by your cases. Here's the principle clause-by-clause, tied to your cases:

  ### The Principle of Integrated Cognitive Tools (PICT)
  1. **Reliable Access & Automatic Deployment** (Forced by Case 1 & 2):  
     The tool must be as reliably accessible as biological memory *for the specific task*, and its use must feel automatic/unmediated.  
     *Case 1 (Notebook):* Always in your pocket, deployed instantly without conscious "retrieval effort."  
     *Case 2 (Photo Library):* Immediate access to personal history; no "search" effort required.  
     *Failure Case: Googling (3)* requires active query formulation and yields variable results—feels like "looking up," not remembering.

  2. **Personalized Integration** (Forced by Case 4 & 5):  
     The tool must be uniquely tailored to *your* cognition, not a shared or general-purpose resource.  
     *Case 5 (Shared Calendar):* It’s *your family’s* structured system, internalized as a collective cognitive routine.  
     *Case 4 (Wife’s Memory):* Fails—her mind is sovereign, even if reliably accessed. She could refuse, misremember, or die without it altering *your* cognitive architecture.  
     *Failure Case: Calculator (Background mode, 6)* isn’t personalized—it’s a generic tool running impersonally.

  3. **Transparency-in-Use** (Forced by Case 6 & 7):  
     *During active use*, the tool must feel phenomenologically transparent—like thinking, not manipulating an object.  
     *Case 6 (Active Calculator):* You engage deliberately; computation feels "effortless" (like mental math).  
     *Case 7 (GPS):* Fails—you remain aware of "following instructions." Even after years, it doesn’t integrate; it *replaces* the need for spatial cognition.  
     *Corollary: Residue is a red herring.* Photos (2) lack residue but still feel transparent; GPS lacks residue *because* it’s opaque.

  4. **Predictable Controllability** (Forced by Case 3 & 8):  
     Outputs must be predictable and directly controllable by you, without hidden intermediation.  
     *Case 3 (Google):* Fails—algorithmic curation introduces unpredictability.  
     *Case 8 (Chatbot):* Flip-flops because controllability varies. With saved instructions/history, it *sometimes* feels predictable ("scratchpad"). But its generative nature introduces randomness ("fluent stranger"), breaking transparency.

  ### Verdicts on Your Cases
  - **1 (Notebook)**: ✔️ (Reliable, automatic, personalized, transparent).  
  - **2 (Photo Library)**: ✔️ (Reliable, automatic, personalized—*your* curated archive).  
  - **3 (Google)**: ❌ (Unpredictable, requires mediation).  
  - **4 (Wife’s Memory)**: ❌ (Not personalized *to you*; sovereign other).  
  - **5 (Shared Calendar)**: ✔️ (Personalized *as a system*, reliable, transparent in use).  
  - **6 (Calculator)**: ✔️ *When active* (transparent tool); ❌ *Background* (no agency/transparency).  
  - **7 (GPS)**: ❌ (Lacks transparency; feels like external guidance).  
  - **8 (Chatbot)**: ❌ **On balance, no.** Controllability is illusory; its core is a black box generating responses, not *your* cognition extended. (More below).

  ### The Sacrifice: GPS (Case 7)
  You’d rather keep Case 4 (wife), so GPS must fall. **Why your GPS verdict is inconsistent:**  
  - The "residue" argument (*"after 10 years, I don’t know the route"*) confuses *outcome* with *process*. The GPS isn’t failing to extend your mind because you didn’t learn; it’s because using it never *felt* like cognition. Contrast with the notebook: even when you *can* recite a number, consulting it still feels like remembering. The GPS is a crutch, not an extension—it bypasses spatial reasoning rather than integrating with it. Surrendering this verdict aligns with PICT.

  ### Missing Case: Muscle Memory + Tool
  **Case 9: A chef’s knife.** After 20 years, its weight and balance feel like an extension of their hand. Chopping is "automatic"—they *think* "dice onions," and the knife executes seamlessly.  
  - **PICT Verdict**: ✔️ **Counts.** Reliable (always available), personalized (worn to their grip), transparent (no conscious manipulation), controllable (predictable output). Unlike the GPS, the tool is integrated into sensorimotor cognition.

  ### Final Chatbot Verdict (Case 8)  
  **❌ Not part of your mind.** Despite history/saved prompts, its outputs are fundamentally emergent and unstable. When it surprises you with insight, it feels like collaboration with an *other*; when it hallucinates, it breaks transparency entirely. It’s a powerful *social artifact* (like a brilliant colleague), not cognitive infrastructure. The notebook is a static record *you* created; the chatbot is a dynamic system *you negotiate with*.

  ### Why Otto/Inga Fails You
  The original thought experiment over-indexes on *functional equivalence* (notebook = biological memory for Otto). PICT adds:  
  - **Phenomenology** (how it *feels* to use),  
  - **Personalization** (is it *yours*?),  
  - **Controllability** (can you govern its outputs?).  

  Your cases show that without these, functional equivalence is sterile. The wife/calendar pair (4/5) doesn’t blow up PICT—it highlights that *institutionalized* external systems (like calendars) can become shared cognitive fixtures, while individual minds remain inviolate. The notebook/Google pair (1/3) shows reliability isn’t just about access speed, but about predictability and lack of intermediation.

  **In short:** A tool is part of your mind iff it’s *as dependable as your cerebellum*, *as transparent as your inner monologue*, and *as personal as your fingerprint*. Everything else is just a very useful intruder.
