  ### The Forgotten Lunchbox
  Your kid calls as you're leaving for work: they forgot their lunchbox at home, and you have to drop it off. There are two possible drop-off points: the elementary school (Point A) and the middle school (Point B). Point A is closer but only gives 1 "convenience point" (quick drop-off, minimal disruption). Point B is farther but gives 4 points (your kid avoids hunger, you feel like a hero). If you miss both, you get 0 (kid buys lunch, but it’s expensive and unhealthy). The roads look identical, so when you see a school, you can’t tell if it’s A or B. Last night, you set a rule on your phone: at each school, exit with probability *p* (continue with 1-*p*).  

  **Ex ante (night before)**:  
  The best *p* maximizes expected points. Calculate:  
  - Exit at A: 1 point.  
  - Continue to B: then exit (prob *p*) for 4 points or continue (prob 1-*p*) for 0.  
  Expected points:  
  **E = (p × 1) + (1-p) × [p × 4 + (1-p) × 0] = p + 4p(1-p) = 5p - 4p²**.  
  Maximize by setting derivative **5 - 8p = 0** → **p = 5/8 = 0.625**.  
  So you set *p* = 0.625: **mostly exit** (62.5% chance to exit at each school).  
  Expected points: **5(0.625) - 4(0.625)² = 3.125 - 1.5625 = 1.5625**.  

  **At an exit (your perspective now)**:  
  You’re staring at a school. You don’t know if it’s A or B, but you know:  
  - Probability it’s A: **1 / [1 + (1-p)]** (since you always reach A, but only reach B if you continued from A).  
  - Probability it’s B: **(1-p) / [1 + (1-p)]**.  
  With *p* = 0.625:  
  - P(A) = 1 / 1.375 ≈ 0.727  
  - P(B) = 0.375 / 1.375 ≈ 0.273  
  Expected points if you **exit now**:  
  **(0.727 × 1) + (0.273 × 4) = 0.727 + 1.092 = 1.819**.  
  Expected points if you **continue**:  
  - If it’s A: you face B next, with expected points **0.625 × 4 + 0.375 × 0 = 2.5**.  
  - If it’s B: you get 0 (no more schools).  
  So: **(0.727 × 2.5) + (0.273 × 0) ≈ 1.818**.  
  **1.819 > 1.818** → **You’d slightly prefer to exit now** (even though the night-before rule told you to mostly exit).  

  ### Why the Split Happens
  - **Key detail**: At an exit, the chance you’re at A (first school) is **higher** than at B (second school) because you *might* have exited at A and never seen B. This skews your *in-the-moment* decision toward exiting.  
  - **Tweak to kill the split**: If you could tell the schools apart, you’d always exit at B and never at A. The split vanishes because the ambiguity (and the resulting probability skew) is gone.  

  ### Your Roommate’s Best Counterargument
  > *"It’s still rigged! You’re double-counting the risk of missing both schools. If you’re at an exit and continue, you’re ignoring that you might be at B and about to get 0. But in reality, if you’re at B, you KNOW it’s your last shot—you just can’t tell! The whole thing implodes if you question the amnesia."*  

  ### Why He’s Half-Right... But Missing the Point
  The amnesia (not knowing A vs. B) *is* the core. Without it, the problem collapses. But with it, the math forces a conflict:  
  - Night-before: You weigh **all paths** (including missing B if you exit too often at A).  
  - At an exit: You weigh **your current uncertainty** (likely at A, so exiting feels safer).  
  The numbers don’t lie—it’s a real clash of perspectives. Serve it with fries and repeat: *"Dude, just let the coin decide."* 😉
