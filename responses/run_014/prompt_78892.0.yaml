prompt: |-
  I spent most of last night arguing with a friend who works on the epistemology of testimony, and whose view is that the whole pramāṇa apparatus is a baroque way of saying that we reason, well or badly, from the reliability of our sources. I defended the position set out below with rather more confidence than I actually feel, and I would now like an audit rather than an exposition. Here is what I hold.

  1. The Nyāya classification of the pramāṇas is, I think, on the right lines, and each of the four it lists is a distinct and irreducible route to knowledge: perception (pratyakṣa); inference (anumāna); comparison (upamāna), the stock case being the traveller who is told that a gavaya resembles a cow and who then, on seeing one in the forest, comes to know what a gavaya is; and testimony (śabda). I am also inclined to think that knowledge sources are not to be multiplied beyond need.

  2. Testimony is not reducible to inference. When someone competent and sincere tells me something and I understand the words, I can come to know it without first reasoning from her reliability; the epistemic basis I have is simply her telling me. The corridor case is the one I care about: a stranger in the department office mentions in passing that the seminar has moved to Thursday, and I take it that I now know that the seminar has moved.

  3. Testimony nonetheless yields knowledge only when the speaker is āpta, that is, competent and sincere. If I have reason to think my informant is guessing, repeating gossip, or lying, I do not know. I also do not think the source has to be a person: a printed timetable, or a properly calibrated instrument, can give me knowledge in the same way, so what matters is the reliability of the source rather than its communicative intentions.

  4. I accept the default-and-defeat picture of justification, on which cognitions are innocent until reasonably challenged, and doubt requires a reason rather than the reverse. I do not accept the stronger Mīmāṃsā and Vedānta thesis of svataḥ prāmāṇya, that a cognition's validity is intrinsic and known by the cognition itself; a cognition can fail to be knowledge even when nothing has yet gone wrong for me. Error, I take it, is best explained along Nyāya lines as misattribution (anyathākhyāti): the rope is cognised, but as a snake.

  5. I think the Mīmāṃsakas were right to insist on arthāpatti, postulation, as a pramāṇa in its own right. In the stock case — Devadatta is fat, and he does not eat during the day, so the only way to reconcile these is that he eats at night — the conclusion is genuinely known, and I do not believe we reach it by inference.

  6. I am not persuaded, however, that non-apprehension (anupalabdhi) is a pramāṇa in its own right. Knowing that there is no pot on the table seems to me to be a piece of inference: if there were a pot I should perceive one, and I do not.

  What I want is a consistency audit. Tell me which of these commitments genuinely pull against one another, which pairs only appear to conflict, and, for each real tension, what would have to give and how costly the cheapest repair would be. Order the tensions by severity instead of treating them as equally bad, and finish by naming the single revision that would clear up the most.
reasoning: |-
  Okay, the user has presented a detailed philosophical stance on epistemology, specifically regarding the Nyāya pramāṇa system and its application to testimony. They've outlined six key commitments and requested a consistency audit to identify tensions, prioritize them by severity, and suggest the most efficient revision. 

  First, I notice the user is deeply engaged in academic epistemology—likely a philosopher or graduate student—given their reference to departmental corridors and seminar logistics. Their all-night argument suggests passion for the topic, but their request for an audit reveals intellectual humility. They're not seeking validation but rigorous critique, which is admirable. 

  The core tension I see is between their anti-reductionist view of testimony (Commitment 2) and their external reliability requirement (Commitment 3). They insist testimony isn't inferential yet require speaker competence/sincerity for knowledge. This mirrors the internal Nyāya debate: If knowledge springs directly from the speech act, why does external reliability matter? Their analogy to instruments ("printed timetable") sharpens this: Does a broken thermometer "tell" me anything? 

  Then there's the arthāpatti puzzle (Commitment 5). Their rejection of inference for absence (Commitment 6) feels inconsistent here—both involve explanatory reasoning. Why treat Devadatta's nighttime eating as non-inferential but the absent pot as inferential? The Nyāya would call both inference, while Mīmāṃsā distinguishes them. 

  The svataḥ prāmāṇya rejection (Commitment 4) also subtly clashes with their testimony view. If cognitions aren't self-validating, why should testimony confer immediate justification? Their default-and-defeat model helps but doesn't fully resolve it. 

  Most salvageable is the anupalabdhi stance (Commitment 6)—many Naiyāyikas accept it as perception-based. But arthāpatti is costlier to defend; it risks pramāṇa inflation unless reframed as inference. 

  The highest-leverage fix? Reclassifying arthāpatti as anumāna. It resolves the explanatory reasoning asymmetry, maintains pramāṇa economy, and is historically attested (e.g., some Navya-Nyāya thinkers). Sacrificing this Mīmāṃsā commitment hurts less than rethinking testimony's structure. 

  User's position is impressively coherent otherwise. Their instinct about testimony's immediacy yet reliability-dependence is tenable—it just needs framing as externalist (like proper-function theories). No need to concede to their reductionist friend!
answer: |-
  Here is a consistency audit of your commitments, ordered by severity of tension, with analysis of conflicts, potential repairs, and costs:

  ### **Severity Ranking of Tensions**
  1.  **Commitment 5 (Arthāpatti as Irreducible) vs. Commitment 6 (Anupalabdhi as Reducible)**  
      **Tension:** Your rejection of non-apprehension (*anupalabdhi*) as irreducible hinges on its reducibility to inference ("if there were a pot, I should perceive one"). Yet you defend *arthāpatti* (postulation) as irreducible despite its structural similarity to inference-by-elimination. Both involve reasoning from known facts to a necessary conclusion:  
      - *Anupalabdhi*: "Perception would occur if X existed; perception is absent; therefore, X is absent."  
      - *Arthāpatti*: "Deviant facts F1 & F2 obtain; the only possible explanation is X; therefore, X obtains."  
      **Conflict:** Granting irreducibility to *arthāpatti* while denying it to *anupalabdhi* is inconsistent without a principled distinction.  
      **Repairs & Costs:**  
      - *Option 1 (Cheapest)*: Reclassify *arthāpatti* as a form of inference (*anumāna*). **Cost:** Abandons Mīmāṃsā influence; weakens pramāṇa pluralism.  
      - *Option 2 (Costly)*: Accept *anupalabdhi* as a distinct pramāṇa. **Cost:** Violates parsimony (Commitment 1); requires reworking your epistemology of absence.  
      - *Option 3 (Unstable)*: Argue *arthāpatti* involves "seeing" explanatory necessity (non-inferential), unlike *anupalabdhi*'s counterfactual. **Cost:** Ad hoc; risks circularity.  

  2.  **Commitment 2 (Testimony as Non-Inferential) vs. Commitment 3 (Āpta Requirement)**  
      **Tension:** You assert testimony delivers knowledge *without* inferring reliability (anti-reductionism), yet knowledge *requires* the source to be competent/sincere (*āpta*). If the hearer doesn’t access the speaker’s reliability, how does *āpta*-hood become a condition for knowledge? This risks either:  
      - *Internal Conflict*: Needing *āpta*-hood but not accessing it undermines the "basis" being "simply her telling me."  
      - *Externalism*: *Āpta*-hood functions as an external condition (like a properly functioning instrument).  
      **Conflict:** Anti-reductionism struggles to accommodate *āpta* as a necessary internal justifier without smuggling in inference.  
      **Repairs & Costs:**  
      - *Option 1 (Externalism)*: Embrace strict externalism—*āpta*-hood enables knowledge *causally*, not as part of the hearer’s basis. **Cost:** Weakens intuitive "default justification" (Commitment 4); may conflict with defeat conditions.  
      - *Option 2 (Default Entitlement)*: Treat *āpta*-hood as a *default assumption* (defeasibly justified) unless challenged. **Cost:** Blurs line with inference; may require weakening Commitment 3.  
      - *Option 3 (Minimal Inference)*: Allow a non-conscious, immediate "entitlement" to assume *āpta*-hood. **Cost:** Risks conceding to your friend’s "reliability reasoning" charge.  

  3.  **Commitment 4 (Rejection of Svataḥ Prāmāṇya) vs. Commitment 2 (Testimony as Basic)**  
      **Tension:** Rejecting *svataḥ prāmāṇya* (intrinsic validity of cognitions) means testimonial beliefs *can* be false even with no internal defeater. But if testimony is a basic source, its justification should be *prima facie* immediate (like perception). Without intrinsic validity, what provides this initial warrant?  
      **Conflict:** Default justification (Commitment 4) needs *some* positive feature to trigger innocence; denying intrinsic validity leaves this obscure.  
      **Repairs & Costs:**  
      - *Option 1 (Default Externalism)*: Justification arises from the *fact* of reliable testimony (external), defeatable by internal reasons. **Cost:** Coheres with Commitment 3 but may strain "basis is her telling me."  
      - *Option 2 (Weak Innocence)*: Testimonial beliefs *presumptively* inherit justification from the act of communication itself. **Cost:** Requires careful distinction from intrinsic validity.  

  4.  **Commitment 1 (Pramāṇa Parsimony) vs. Commitment 5 (Arthāpatti as Irreducible)**  
      **Tension:** Adding *arthāpatti* as a fifth pramāṇa (beyond Nyāya’s four) multiplies sources. Is this *needed*? Nyāya traditionally reduces *arthāpatti* to inference.  
      **Conflict:** Accepting *arthāpatti* challenges parsimony unless uniquely justified.  
      **Repairs & Costs:**  
      - *Option 1*: Defend *arthāpatti*’s irreducibility by showing inference cannot capture its "explanatory necessity." **Cost:** Demands robust criteria for pramāṇa individuation.  
      - *Option 2*: Revert to Nyāya’s four pramāṇas (drop Commitment 5). **Cost:** Abandons a key Mīmāṃsā insight.  

  ### **Apparent (Resolvable) Tensions**
  - **Commitment 3 (Non-Personal Sources) vs. "Testimony" Label:** Your inclusion of instruments/timetables under *śabda* stretches "testimony" beyond intentional communication. **Resolution:** Broaden *śabda* to "indicative signs" (like Nyāya’s *ākṣepaka*) or treat instruments under perception/inference. No deep inconsistency.  
  - **Commitment 4 (Default Justification) vs. Commitment 3 (Āpta Requirement):** The *āpta* condition can be part of the external "proper functioning" of testimony, not a conscious internal requirement. Defeaters apply when *āpta*-status is challenged. Coheres well.  

  ### **Highest-Leverage Revision**
  **Reclassify *arthāpatti* as a form of inference (*anumāna*).**  
  - **Why?**  
    1.  Resolves the most severe tension (vs. Commitment 6) by treating *arthāpatti* and *anupalabdhi* uniformly as inferential.  
    2.  Preserves pramāṇa parsimony (Commitment 1).  
    3.  Avoids ad hoc distinctions between explanatory/counterfactual reasoning.  
    4.  Less costly than alternatives (e.g., adding *anupalabdhi* or weakening testimony’s anti-reductionism).  
  - **Cost:** Sacrifices the Mīmāṃsā intuition about *arthāpatti*’s uniqueness. However, this is less central to your core Nyāya framework than testimony or parsimony.  

  ### **Summary of Recommended Path**
  - **Retain Core:** Commitments 1–4 (Nyāya-like epistemology with anti-reductionist testimony + default justification).  
  - **Revise:** Treat *arthāpatti* (Commitment 5) as inference.  
  - **Clarify:** Frame *āpta* for testimony as an *external condition* enabling default justification (defeatable if *incompetence/deceit* is suspected). This coheres with instrument reliability.  
  - **Result:** A streamlined, consistent Nyāya position that answers your friend—testimony is *sui generis* but externally grounded—without internal contradictions.  

  This audit strengthens your defense: testimony remains irreducible, but *arthāpatti*’s demotion to inference bolsters overall coherence.
