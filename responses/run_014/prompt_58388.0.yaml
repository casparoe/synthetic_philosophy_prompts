answer: |-
  Here’s a practical audit routine integrating experiential welfare and precautionary principles, designed for untrained staff under time constraints. It prioritizes observable indicators, sequences assessments to escalate ambiguity, and clearly flags value judgments.

  ### **Ordered Audit Routine: "PFR" Sequence**  
  **(Physical → Functional → Responsive)**  
  *Assess in this order; stop if "Recheck" or "Flag" is triggered early.*

  1.  **PHYSICAL HEALTH (5 mins)**  
      *Focus: Unambiguous harm.*  
      - **Rainbow Trout:** Skin lesions, ulcers, fin erosion (split/cracked fins), cataracts, mortality.  
      - **Whiteleg Shrimp:** Broken antennae/uropods, shell deformities, black gills, mortality.  
      **Thresholds:**  
      - *Pass:* ≤5% affected, no fresh injuries.  
      - *Recheck:* 6-15% affected OR isolated severe injuries.  
      - *Flag:* >15% affected OR widespread severe injuries.  

  2.  **FUNCTIONAL INDICATORS (10 mins)**  
      *Focus: Capacity to thrive.*  
      - **Both:** Water quality (DO, temp, ammonia—verify from farm logs), feed response (% actively eating).  
      - **Trout:** Growth consistency (size variation <20%).  
      - **Shrimp:** Molting frequency (≥70% with new shell sheen).  
      **Thresholds:**  
      - *Pass:* All parameters optimal for species; >80% feeding.  
      - *Recheck:* One parameter suboptimal (e.g., DO at min threshold); 60-80% feeding.  
      - *Flag:* Multiple parameters poor OR <60% feeding.  

  3.  **RESPONSIVE BEHAVIORS (15 mins)**  
      *Focus: Distress signals (precautionary emphasis here).*  
      - **Trout:** Erratic swimming, piping (gasping at surface), avoidance of humans/net, prolonged recovery post-stress.  
      - **Shrimp:** Vigorous tail-flicking (escape attempts), piling, thrashing in water.  
      **Thresholds:**  
      - *Pass:* Brief, occasional stress responses; normal exploration.  
      - *Recheck:* Sustained agitation (e.g., >30 sec thrashing) OR apathy in >20% of animals.  
      - *Flag:* Intense, prolonged distress (e.g., >1 min frantic activity) OR >30% lethargy.  
      **VALUE JUDGMENT CUTOFF:** *If physical/functional metrics "Pass" BUT responsive behaviors indicate severe distress, staff MUST "Flag" for manager. Sentience uncertainty mandates precaution—discomfort is treated as material even if unproven.*

  ---

  ### **Handling Live Disputes**  
  1.  **Trout Grading (Crowding + Air Exposure):**  
      - *Physical:* "Recheck" (split fins = physical harm).  
      - *Functional:* "Pass" (strong growth).  
      - *Responsive:* "Flag" (frantic thrashing = prolonged distress).  
      **Outcome: FLAG.** *Rationale:* Physical harm + behavioral distress override functional benefits. Precaution requires manager review of handling duration.  

  2.  **Shrimp Pre-Sort Chilling (Ice Slurry):**  
      - *Physical:* "Pass" (low mortality).  
      - *Functional:* "Pass" (assume no growth impact).  
      - *Responsive:* "Flag" (prolonged vigorous tail-flicking = distress signal).  
      **Outcome: FLAG.** *Rationale:* Behavioral response indicates suffering; low mortality ≠ welfare. Manager must assess chilling duration/temperature.  

  3.  **High-Density Shrimp Holding:**  
      - *Physical:* "Recheck" (frequent antenna loss = harm).  
      - *Functional:* "Pass" (viable margins ≠ welfare; assess feeding: "Recheck" if sluggish).  
      - *Responsive:* "Recheck" (sluggishness = possible chronic stress).  
      **Outcome: RECHECK** (escalates to manager if ≥2 "Rechecks"). *Rationale:* Antenna loss and behavioral changes suggest welfare trade-offs for density. Your preference for margins is a *value judgment*—manager must decide if harm is "acceptable."  

  ---

  ### **What This Routine CANNOT Do & Where It Fails**  
  **Limitations:**  
  - **Cannot** quantify suffering or prove sentience.  
  - **Cannot** detect chronic stress without physical/behavioral markers (e.g., hormonal changes).  
  - **Cannot** replace veterinary diagnostics or long-term welfare science.  
  - **Blind Spots:** Masked by "normalization" (e.g., accepting antenna loss as "routine").  

  **Most Likely to Misfire:**  
  1. **False Negatives:** Untrained staff miss subtle behaviors (e.g., shrimp lethargy misread as "calm").  
  2. **Context Ignorance:** Isolated "Pass" in one area overrides distress signals (e.g., grading "Passes" functional but ignores thrashing).  
  3. **Threshold Arbitrariness:** Fixed % targets may not reflect acute suffering (e.g., 15% fin damage could still mean thousands hurt).  
  4. **Value Judgment Avoidance:** Staff may avoid "Flagging" profitable practices without unambiguous harm.  

  **Critical Takeaway:** This routine makes precaution *operational*, not philosophical. It forces documentation of distress even when outcomes are "successful" by production standards—but its power hinges on managers *acting* on "Flags," not overruling them for profit.
