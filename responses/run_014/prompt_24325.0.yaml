  The user's examples are cleverly chosen to pressure-test different angles: the math notation tests institutional publicity, the couple's language tests minimal sociality, the blind navigator tests non-linguistic grounding. They're clearly well-read but avoiding textbook explanations - wants to stress-test their own raw judgments.

