prompt: |-
  I am a software engineer with no formal training in philosophy, and I have been asked to help design the final assessment for a graduate seminar on decision theory. The instructor wants one essay question on the Pasadena game and the problem of undefined expected values. I need you to write the question, a model answer of roughly 700 words, and a marking scheme that distinguishes an A from a B answer by naming the specific moves each must contain.

  The question should be aimed at students who have already seen the St. Petersburg paradox and the standard expected value maximization framework. It should be answerable in 90 minutes and worth 25 marks. It should not be answerable by simply reciting a summary of the Pasadena game or by saying that its expected value is undefined; it should force students to explain why the undefined expected value is a genuine problem for standard decision theory, not merely a mathematical curiosity, and to evaluate at least one proposed response.

  To make the question self-contained, here is the setup you should use. The Pasadena game: a fair coin is tossed until it lands heads for the first time. If heads appears on toss n, the payoff is (-1)^(n+1) * 2^n / n. So the payoffs are +2, -2, +8/3, -4, +32/5, and so on. The Altadena game: same setup, but the payoff is 2^n / n, so all payoffs are positive. The expected value series for the Pasadena game is the alternating harmonic series, which is conditionally convergent; its terms can be rearranged to yield any real number or diverge to positive or negative infinity. The Altadena game has an infinite expected value, and it dominates the Pasadena game in every outcome.

  The question should ask students to do the following: (1) explain why the Pasadena game's expected value is undefined rather than infinite, and why this is not just a technicality about infinite series; (2) explain what this implies for the principle that a rational agent should maximize expected value; (3) evaluate whether the dominance relation between the Altadena and Pasadena games offers a way out for the expected value maximizer, or whether it leaves the core problem untouched; and (4) assess at least one other response, such as restricting decision theory to games with well-defined expectations, adopting a bounded utility function, or using a non-expected-value criterion like stochastic dominance or median payoff.

  The model answer should be self-contained and should not rely on citations. It should make clear why conditional convergence matters: because the order in which you sum the probability-weighted payoffs changes the result, so there is no fact of the matter about what the game is worth in expected value terms. It should distinguish this from the St. Petersburg case, where the expectation is infinite and the problem is that the theory says to pay any finite amount. It should explain that the Pasadena case is worse because the theory is silent: it does not even say the game is worth infinity. It should discuss the Altadena game as a contrast: Altadena has an infinite expected value and dominates Pasadena, so if you are choosing between them, dominance reasoning might seem to favor Altadena, but that does not tell you what to do if you are offered the Pasadena game alone, and it does not restore a well-defined expected value to Pasadena. It should then evaluate one or more responses: for example, one might say that standard decision theory should be restricted to prospects with well-defined expectations, but then it fails to guide choice in this case; or one might say that we should use a bounded utility function, but that changes the subject from monetary payoffs to utilities and does not solve the problem for the original game; or one might say that we need a different decision rule altogether, such as maximizing the median or using stochastic dominance, but those rules have their own problems. The model answer should conclude by saying what the case shows: either that expected value maximization is incomplete as a theory of rational choice, or that it needs to be supplemented by a theory of how to handle undefined expectations, or that the Pasadena game is not a legitimate prospect for some other reason.

  The marking scheme should be built around five must-hit points, each worth 5 marks, for a total of 25. The points should be: (1) correctly explains that the Pasadena game's expected value series is conditionally convergent and therefore undefined, and why rearrangement can yield any value; (2) distinguishes undefined from infinite, and explains why the Pasadena case is a different and arguably deeper problem than the St. Petersburg case; (3) explains what this implies for expected value maximization: the principle cannot rank the Pasadena game against other prospects, and so it fails to be a complete decision rule; (4) discusses the Altadena game and the dominance relation, and correctly notes that dominance can sometimes guide choice between the two games but does not solve the problem of evaluating the Pasadena game on its own; and (5) evaluates at least one proposed response, such as restricting decision theory, bounded utility, or non-expected-value criteria, and states what the case shows about the limits or prospects of standard decision theory.

  An A answer must make all five moves, with the first two explained in a way that shows understanding of the mathematics, not just the labels. A B answer might make three or four of the moves, or might make all five but treat the undefined expected value as a mere technicality, or confuse undefined with infinite, or fail to see why the dominance relation does not fully resolve the problem. The marking scheme should also note common mistakes: saying the expected value is zero, saying it is infinite, saying that rearrangement is irrelevant because the probabilities are fixed, or thinking that the Altadena game's infinite expected value means the Pasadena game must also have an infinite expected value.

  Please write the exam question first, then the model answer, then the marking scheme. The question itself should be no more than 150 words, so that students have room to write. The model answer should be about 700 words. The marking scheme should be clear and usable by a teaching assistant.
reasoning: |-
  We are designing an exam question for a graduate seminar on decision theory. The topic is the Pasadena game and the problem of undefined expected values. The question must be self-contained and should force students to engage with the philosophical implications for decision theory.

  Exam Question (max 150 words):

  "The Pasadena game pays (-1)^{n+1} * 2^n / n if the first heads occurs on toss n of a fair coin. The Altadena game pays 2^n / n in the same scenario. (a) Explain why the Pasadena game's expected value is undefined (not infinite) and why this is a deeper problem than the St. Petersburg paradox. (b) Discuss the implications for the principle that rational agents should maximize expected value. (c) Evaluate whether the dominance relation (Altadena dominates Pasadena) resolves the problem. (d) Assess at least one proposed response (e.g., restricting to well-defined expectations, bounded utility, or non-expected-value criteria). Conclude by stating what the case shows about standard decision theory."

  Model Answer (approx 700 words):

  The Pasadena game presents a profound challenge to expected utility theory because its expected value is undefined. This occurs because the series representing the expected value, which sums the probability-weighted payoffs, is conditionally convergent. Specifically, the series is the alternating harmonic series: ∑_{n=1}^∞ [ (1/2)^n * (-1)^{n+1} * 2^n / n ] = ∑_{n=1}^∞ (-1)^{n+1} / n. This series converges to ln(2) when summed in the natural order, but by Riemann's rearrangement theorem, it can be rearranged to converge to any real number or even diverge. This mathematical fact implies that there is no unique expected value for the game; the sum depends on the order of summation. Since the probabilities are fixed, one might object that rearrangement is irrelevant. However, the problem arises because the standard definition of expected value for infinite discrete prospects requires summing in a particular order, but no order is privileged by the setup of the game. Thus, the expectation is undefined.

  This situation is distinct from the St. Petersburg paradox. In St. Petersburg, the expected value is infinite, and the problem is that the theory recommends paying any finite amount to play the game, which seems irrational. The Pasadena game, however, presents a more fundamental issue: the theory cannot assign any value at all, not even infinity. Therefore, it fails to provide any guidance on what a rational agent should do when faced with this game. This is not a mere technicality but a gap in the theory: it cannot rank the Pasadena game against other prospects, including the status quo (not playing). An agent might be indifferent between the game and nothing, or might strictly prefer one, but expected value maximization has nothing to say.

  Consider the Altadena game, which has positive payoffs: 2^n/n. Its expected value series is the harmonic series, which diverges to infinity. Moreover, the Altadena game dominates the Pasadena game in every state (i.e., for every n, the payoff of Altadena is greater). This dominance relation might seem to offer a partial solution: when choosing between the two, a rational agent should prefer Altadena. However, this does not solve the core problem. First, if offered the Pasadena game alone, dominance does not apply. Second, the undefined expectation of Pasadena remains undefined; dominance does not assign it a value. Therefore, while dominance can sometimes guide choices between prospects, it does not restore a well-defined expected value to the Pasadena game, and it does not help when the agent must decide whether to play Pasadena for a fee or compare it to a finite sure thing.

  One response is to restrict decision theory to prospects with well-defined expectations. This would avoid the problem by excluding the Pasadena game. However, this restriction is ad hoc and fails to guide agents in cases where they face such prospects. Another response is to adopt a bounded utility function. If utility is bounded, the Pasadena game's expected utility would be well-defined because the series would become absolutely convergent. But this changes the subject: the original problem was about monetary payoffs, and bounded utility addresses a different issue (risk aversion and extreme outcomes). Moreover, the problem can be restated in terms of utility if we define the payoffs in utils, but then we are just assuming away the problem by boundedness. A third response is to use a non-expected-value criterion. For instance, one might maximize the median outcome. For the Pasadena game, the median outcome after k tosses can be calculated, but this approach ignores the full distribution and may lead to counterintuitive results. Stochastic dominance might also be used, but as we saw, it only helps in pairwise comparisons and not for evaluating a single prospect.

  In conclusion, the Pasadena game reveals that expected value maximization is incomplete as a theory of rational choice. It cannot handle prospects with conditionally convergent series, which are well-defined games with uncertain outcomes. The case shows that either the theory must be supplemented with a method for handling undefined expectations (such as adopting a rule that specifies an order of summation) or we must accept that some rational choices cannot be made by expected value alone. The problem is not solved by dominance or by bounded utility without changing the problem. Therefore, the Pasadena game stands as a challenge to the universality of expected utility theory.

  Marking Scheme (25 marks total, 5 marks per must-hit point):

  The answer will be assessed on five key points, each worth 5 marks. An A answer must cover all five points clearly and accurately. A B answer may miss one point or be unclear on one or two.

  1. **Conditional Convergence and Undefined Expected Value (5 marks)**  
     - Correctly explains that the Pasadena game's expected value is given by the alternating harmonic series and is conditionally convergent.  
     - Explains that rearrangement can yield any real number or divergence, so the expected value is undefined.  
     - Common mistakes: saying the expected value is zero (the limit of the partial sums in natural order) or infinite, or claiming rearrangement is irrelevant.

  2. **Distinction from St. Petersburg (5 marks)**  
     - Contrasts with St. Petersburg (which has infinite expected value) and explains why undefined is a deeper problem: the theory is silent, not just demanding extreme prices.  
     - Notes that St. Petersburg provides a (problematic) recommendation, while Pasadena provides none.

  3. **Implications for Expected Value Maximization (5 marks)**  
     - Explains that the principle fails to rank the Pasadena game against any other prospect (including not playing) and thus is incomplete.

  4. **Altadena Game and Dominance (5 marks)**  
     - Notes that Altadena has infinite expected value and dominates Pasadena state-wise.  
     - Correctly argues that dominance can resolve the choice between Altadena and Pasadena but fails to assign a value to Pasadena and does not help when Pasadena is the only option or compared to a finite sure thing.

  5. **Evaluation of a Proposed Response (5 marks)**  
     - Assesses at least one response (e.g., restriction to well-defined expectations, bounded utility, non-expected-value criteria).  
     - Explains why the response does or does not solve the problem (e.g., restriction is ad hoc, bounded utility changes the subject, alternative criteria have limitations).  
     - Concludes by stating what the case shows about the limits of decision theory (e.g., incompleteness of expected utility).

  Common mistakes to penalize:
  - Confusing undefined with infinite.
  - Claiming the expected value is zero or infinite.
  - Saying that rearrangement is irrelevant because the probabilities are fixed.
  - Believing that the Altadena game's infinite expectation implies the Pasadena game must also have an infinite expectation.
  - Arguing that dominance alone fully resolves the problem without noting its limitations.

  A-grade: Hits all five points, with clear and accurate explanations, especially on the mathematics of conditional convergence and the distinction from St. Petersburg.  
  B-grade: Hits three or four points, or hits all five but with inaccuracies (e.g., treating undefined as a technicality without philosophical implications, or misrepresenting the role of dominance).  
  Lower grades: Misses two or more points or has significant errors.
answer: |-
  ### Exam Question (145 words)
  "The Pasadena game pays \((-1)^{n+1} \cdot 2^n / n\) if the first heads occurs on toss \(n\) of a fair coin. The Altadena game pays \(2^n / n\) in the same scenario. (a) Explain why the Pasadena game’s expected value is undefined (not infinite) and why this poses a deeper problem for decision theory than the St. Petersburg paradox. (b) Discuss the implications for expected value maximization as a principle of rationality. (c) Evaluate whether the dominance relation (Altadena dominates Pasadena state-wise) resolves the core problem. (d) Assess one proposed response (e.g., restricting to well-defined expectations, bounded utility, or non-expected-value criteria). Conclude by stating what the Pasadena game reveals about the limits of standard decision theory. Answers should be self-contained and focus on conceptual implications."

  ---

  ### Model Answer (705 words)
  The Pasadena game challenges the foundations of decision theory by exposing a critical flaw in expected value maximization: its expectation is undefined due to conditional convergence. The expected value is calculated as \(\sum_{n=1}^{\infty} \frac{1}{2^n} \cdot (-1)^{n+1} \frac{2^n}{n} = \sum_{n=1}^{\infty} (-1)^{n+1} \frac{1}{n}\), the alternating harmonic series. This series converges conditionally to \(\ln(2)\) when summed in order, but Riemann’s rearrangement theorem shows it can yield any real number (or diverge) if terms are reordered. Since no physical or probabilistic feature privileges one order of summation over another, the expected value is genuinely undefined—it is not a mathematical artifact but a fundamental indeterminacy. Consequently, decision theory cannot assign a value to the game, leaving rational agents without guidance.

  This diverges sharply from the St. Petersburg paradox. In St. Petersburg, the expectation is infinite, and the problem is that the theory demands irrational actions (e.g., paying unlimited sums to play). The Pasadena game is worse: it renders the theory silent. Expected value maximization cannot rank the game against alternatives—including doing nothing—because it lacks any expectation to maximize. Thus, the principle fails as a complete rule for rational choice. An agent might intuit that the game is desirable (early positive payoffs) or undesirable (risk of large losses), but the theory cannot affirm or deny this. This silence is not a technicality; it reveals that expected value maximization is inapplicable to conditionally convergent prospects, which are well-defined, feasible gambles.

  The Altadena game, with payoffs \(2^n / n\), highlights this issue. Its expectation is the harmonic series \(\sum_{n=1}^{\infty} \frac{1}{n}\), which diverges to infinity. Crucially, Altadena dominates Pasadena: for every \(n\), its payoff exceeds Pasadena’s. This dominance might seem to rescue rationality when choosing between the two—any rational agent should prefer Altadena. But dominance does not solve the core problem. First, if offered Pasadena alone, dominance provides no guidance (e.g., should one pay $5 to play?). Second, dominance fails to assign a value to Pasadena; it merely exploits a pairwise comparison. Third, dominance cannot rank Pasadena against a sure outcome (e.g., $10) or handle cases where both options have undefined expectations. Thus, while useful in limited contexts, dominance leaves the theory’s core failure—undefined expectations—untouched.

  One proposed response is to restrict decision theory to prospects with well-defined (absolutely convergent) expectations. This avoids the Pasadena problem but is ad hoc and incomplete. It abandons agents facing conditionally convergent games and offers no fallback rule. Worse, it implies that rationality is undefined in such cases—a troubling lacuna. Alternatively, adopting a bounded utility function resolves the issue by ensuring absolute convergence (e.g., with bounded utility, Pasadena’s series becomes absolutely convergent). But this changes the subject: the original problem concerns monetary payoffs, and boundedness sidesteps it by redefining utility. If payoffs are reinterpreted as utils, the problem recurs if utils are unbounded; if not, it assumes away the issue without justification. A third response uses non-expected-value criteria, like median payoff or stochastic dominance. For instance, the median outcome of Pasadena after \(k\) tosses might be computable, but this ignores tail probabilities and may produce inconsistent rankings (e.g., rejecting a dominant prospect). Stochastic dominance, while helpful in Altadena comparisons, fails to evaluate single prospects or handle undefined expectations more broadly.

  In conclusion, the Pasadena game demonstrates that expected value maximization is incomplete. It cannot handle conditionally convergent prospects, forcing recourse to auxiliary principles (e.g., dominance) that are partial fixes. This case shows that standard decision theory must either be supplemented with rules for undefined expectations (e.g., a canonical summation order) or admit limitations in its scope. The problem is not merely mathematical but philosophical: rationality requires guidance in all choices, and the theory falls short. While dominance and bounded utility offer pragmatic workarounds, they do not restore coherence to the original framework. Thus, the Pasadena game underscores the need for a more robust theory of rational choice under uncertainty.

  ---

  ### Marking Scheme (25 marks total)
  **Five key points, each worth 5 marks. Award marks for clarity, accuracy, and depth. Common mistakes (penalize 1–2 marks per error):**  
  - Claiming the expected value is zero, infinite, or "divergent" without distinguishing undefined vs. infinite.  
  - Asserting rearrangement is irrelevant because probabilities are fixed.  
  - Stating Altadena’s infinite expectation implies Pasadena’s must be infinite/undefined for the same reason.  
  - Arguing dominance fully resolves the problem (e.g., ignoring single-prospect cases).  
  - Misrepresenting a proposed response (e.g., "bounded utility solves it" without caveats).

  #### **Point 1: Conditional Convergence and Undefined Expectation (5 marks)**  
     - Correctly identifies the series as conditionally convergent (alternating harmonic).  
     - Explains rearrangement yields any real number (via Riemann’s theorem) due to lack of absolute convergence.  
     - Emphasizes this makes expectation undefined, not a specific value.  
     - *A-grade:* Derives the series from probabilities/payoffs; notes no privileged order.

  #### **Point 2: Distinction from St. Petersburg (5 marks)**  
     - Contrasts St. Petersburg (infinite expectation) with Pasadena (undefined).  
     - Explains St. Petersburg’s problem is counterintuitive recommendations, while Pasadena’s is no recommendation.  
     - *A-grade:* Highlights "silence vs. extreme demand"; calls Pasadena "deeper" due to theory failure.

  #### **Point 3: Implications for Expected Value Maximization (5 marks)**  
     - States the principle cannot rank Pasadena against any prospect (e.g., status quo).  
     - Argues this violates completeness: rationality requires guidance, but none exists.  
     - *A-grade:* Notes agent intuitions (e.g., "seems desirable") are unvalidated by theory.

  #### **Point 4: Altadena and Dominance (5 marks)**  
     - Notes Altadena’s expectation is infinite and it dominates Pasadena state-wise.  
     - Explains dominance aids pairwise choice but fails for Pasadena alone or vs. sure things.  
     - *A-grade:* Cites examples (e.g., "pay $5 to play?"); stresses dominance doesn’t define expectation.

  #### **Point 5: Evaluation of Proposed Response (5 marks)**  
     - Evaluates one response (e.g., restriction: ad hoc; bounded utility: changes subject; non-expected: incomplete).  
     - Concludes fairly what the case shows (e.g., "theory is incomplete," "needs supplementation").  
     - *A-grade:* Links response to core problem (e.g., "boundedness avoids but doesn’t solve original issue").

  #### **Grading Standards**  
  - **A (21–25 marks):** Hits all five points; demonstrates conceptual mastery (e.g., explains conditional convergence mathematically, distinguishes undefined/infinite rigorously, critiques responses incisively).  
  - **B (16–20 marks):** Hits 3–4 points, or all five with minor inaccuracies (e.g., vague on rearrangement, undersells dominance limitations, superficial response evaluation).  
  - **C (11–15 marks):** Hits 2–3 points with errors (e.g., confuses undefined/infinite, omits Altadena dominance).  
  - **D/F (0–10 marks):** Misses ≥3 points; major errors (e.g., claims expectation is zero, calls it a technicality).  

  **Teaching Assistant Note:** Focus on philosophical engagement. Reward clear explanations of "why it matters"; penalize rote summaries. Use common mistakes to adjust scores within bands.
