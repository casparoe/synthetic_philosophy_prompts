  First, I need to break down the three philosophical positions: intuitions as evidence (treating gut reactions as data points), intuition-pumping (crafting scenarios to elicit specific responses), and the experimental philosophy challenge (how context changes moral judgments). 

  For the literary translation: 
  - Focalization maps perfectly to how philosophers frame scenarios to control perspective. 
  - Scene construction directly parallels how thought experiments are designed - every detail serves a purpose. 
  - Character interiority has no real counterpart since thought experiments exclude subjective experience. 
  - Dramatic irony and show-vs-tell help explain why intuition-pumping feels manipulative. 

  The residue report shows:
