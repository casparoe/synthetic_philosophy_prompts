  - Distorted translations: Experimental philosophy's context effects resemble bad writing where reactions depend on superficial details. 
  - Unmappable elements: The philosophical debate about whether intuitions are "evidence" doesn't exist in fiction - novelists care about persuasion, not proof. 

  Key insight: Philosophers fight over epistemic validity (is this real evidence?) which has no parallel in fiction. Novelists already know stories persuade through craft, not proof. This gap exposes philosophy's insecurity about whether thought experiments actually discover truth. 

  For the user, this clarifies that their craft vocabulary is robust for understanding how thought experiments work, but the philosophers' core anxiety about evidence is foreign to narrative art. The takeaway: thought experiments are persuasive devices, and philosophers' debates about their evidentiary status might be missing the point.
answer: |-
  Here's the debate translated into your craft vocabulary, followed by the residue report:

  **The Debate Reframed:**

  1.  **Intuitions-as-Evidence:** Philosophers construct a tightly controlled **scene** (the trolley problem). They meticulously manage **focalization**, locking the reader into a specific **point of view** (omniscient observer, perhaps) designed to eliminate irrelevant **character interiority** or bias. The **scene construction** is sparse, showing only essential actions ("lever pulled," "man pushed"), forcing focus on the abstract moral act itself. The intended reader reaction (the intuition) is treated not as a feeling evoked *by the narrative*, but as direct evidence of a universal moral principle, revealed through this carefully managed **epistemic state** – the reader sees the "moral truth" clearly. It's pure **showing**, demanding the principle be inferred from the presented action.

  2.  **Intuition-Pumping (Rhetoric):** This view argues the "scene" is never neutral. It's a crafted narrative designed to *elicit* a specific reaction. The **focalization**, choice of details ("fat" man, "innocent" bystanders), and implied stakes **manage the reader's epistemic state** and emotional response deliberately. The gap between **what's shown** (the physical act) and **what's implied** (murder vs. sacrifice, utility vs. violation) is filled by the author's rhetorical intent. It's **showing** with a heavy dose of manipulative **telling** smuggled in through framing. The resulting intuition is a product of *craft*, not a transparent window to truth – closer to powerful dramatic persuasion than logical evidence.

  3.  **Experimental Philosophy Challenge:** This demonstrates how fragile the philosopher's carefully controlled **scene** really is. Changing minor **scene construction** elements (a name, ethnicity, even the *medium* – text vs. video) acts like altering seemingly insignificant descriptive details or **focalization**. Suddenly, the reader's **point of view** shifts subtly, their **epistemic state** (their understanding of the character's context or worth) changes, and the intended intuition flips. This exposes how the original thought experiment wasn't revealing a universal principle, but was a scene whose persuasive power depended on specific, often hidden, narrative choices – like a scene whose impact relies on a cliché or unexamined bias.

  **Residue Report:**

  1.  **Clean Translations:**
      *   **Scene Construction & Narrative Economy:** Translates perfectly. Both philosophers and novelists build minimal scenes to evoke specific responses. Every detail matters.
      *   **Focalization & Point of View:** Translates cleanly. Controlling *how* the scenario is perceived is central to both.
      *   **Managing Reader's Epistemic State:** Translates directly. Both aim to control what the reader knows, feels, and infers at key moments.
      *   **The Gap (Shown vs. Implied):** Translates perfectly. The philosophical debate hinges on what the scenario *implies* beyond its bare description, mirroring narrative subtext.
      *   **Show vs. Tell (Rhetoric):** Intuition-pumping as rhetoric maps directly to manipulative showing/telling designed to evoke a feeling/persuade.

  2.  **Translates with Distortion:**
      *   **Intuitions-as-Evidence:** The claim that the elicited feeling is *evidence* for an abstract universal principle doesn't have a direct craft counterpart. Novelists deal in persuasion, emotional truth, and thematic revelation, not formal logical evidence. Translating it requires distorting "evidence" into "compelling revelation" or "persuasive insight," losing the philosophical weight of *proof*.

  3.  **No Expression in Your Vocabulary:**
      *   **The Core Epistemic Claim:** The fundamental philosophical fight – **whether the raw, elicited intuition *justifies belief in* or *provides evidence for* an objective, abstract, universal moral principle** – has *no direct counterpart*. Novelists persuade readers of *a* truth (emotional, thematic, character-driven), not *the* universal truth discoverable through rational intuition. Your craft vocabulary is about *effect* (persuasion, feeling, understanding) within the narrative world, not about *epistemic justification* in the real world.

  **The Crucial Gap:**

  The part with **no counterpart** is the philosophers' core anxiety: **Is the intuition generated by the thought experiment *actually* a reliable indicator of objective, universal moral truth, or is it *just* a psychologically interesting or rhetorically powerful response?** Novelists don't fight over this because their craft *assumes* persuasion is achieved through skillful manipulation of perspective, detail, and emotion to create compelling *narrative* truth. The "evidence" debate is unique to philosophy's quest for foundational, objective principles. This **isn't a gap in your vocabulary**; it highlights that the philosophers' disagreement is **substantively different** – it's about the *epistemic status* of the reaction (is it truth-tracking?), while your craft focuses on *how* to generate powerful reactions and interpretations effectively. Their fight reveals philosophy's insecurity about whether its primary tool (the intuition pump) actually discovers truth or just manufactures compelling fictions – an anxiety inherent to their project, not yours.
