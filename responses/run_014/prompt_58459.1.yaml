prompt: |-
  ok im kinda drowning in hot takes about when a bunch of parts actually make a whole thing and I want the spec before more theories. can you lay out the desiderata for a decent answer to when some things compose something else, like good enough I could use it for everyday counting without getting laughed at by a biologist or physicist?

  give me a list where each item says what the theory has to deliver and why that counts as neccesary, not just a slogan. it should at least cover: what to do with ordinary lumps like chairs and rocks vs weird ones like my half-assembled bookshelf in the garage, two coins glued together vs just stacked, a transplanted heart that keeps beating in a new body, all the plastic floating in the ocean, and a wave that keeps its shape while the water moves through it. plus how to handle vague edges and change over time, like when teh thing loses parts or gains them and is it still the same whole.

  also tell me which distinctions a theory cant collapse, like existing vs just being convenient to count as one, and touching vs stuck together vs working together as a system, and being a heap vs being an integrated organism vs being totally scattered.

  then flag which requirements you think are non-negotiable and which are just prejudices from one camp, and point out any pair you suspect cant both be satisfied at once. and say which single requirement knocks out the most simple views, like the always-compose, never-compose, and sometimes-compose families. keep most of the weight on the criteria and why they matter, the scoring can be super brief.
reasoning: |-
  Okay, the user is asking for a clear set of criteria to determine when parts compose a whole, something practical enough for everyday use without being dismissed by scientists. They mentioned specific examples like chairs vs half-assembled bookshelves, glued vs stacked coins, transplanted hearts, ocean plastic, and waves. They also want handling of vagueness and change over time, plus key distinctions like existence vs convenience, touching vs functional unity.

  First, I need to identify the core problems in composition metaphysics. The user is frustrated with "hot takes" and wants a solid foundation. Their examples cover various edge cases: artifacts with vague assembly (bookshelf), different types of unity (glued vs stacked coins), functional persistence (transplanted heart), scattered objects (ocean plastic), and process vs matter (waves). They also emphasize temporal change and essential distinctions.

  The user's deeper need seems to be a practical, defensible framework for counting objects in real-world scenarios—avoiding ridicule from biologists or physicists. This suggests they value scientific plausibility and everyday applicability over purely philosophical elegance. They might be a student or researcher encountering these debates, needing a tool for consistent reasoning.

  Now, breaking down the desiderata:  
  1. **Ordinary Objects**: Must account for chairs/rocks as wholes, but not arbitrary collections. Why? Social practice and physics both recognize them as units.  
  2. **Partial Assembly**: A half-built bookshelf isn't a bookshelf yet. Necessity: Functionality matters for artifacts.  
  3. **Bonding Types**: Glued coins (one object) vs stacked (two). Why? Degree of unity affects behavior.  
  4. **Functional Persistence**: A transplanted heart remains a heart. Necessity: Biological functions persist beyond original context.  
  5. **Scattered Objects**: Ocean plastic isn't a single object. Why? Lack of cohesion/function.  
  6. **Process vs Matter**: Waves maintain form despite water movement. Key: Patterns can be wholes without static parts.  
  7. **Vagueness & Change**: Handle gradual part loss/gain (e.g., Ship of Theseus). Necessity: Real-world objects aren't static.  

  Critical distinctions:  
  - **Existence vs Convenience**: Must distinguish real wholes from useful fictions (e.g., "the Midwest" isn't an object).  
  - **Unity Types**: Touching (rocks in a pile) ≠ bonded (glued) ≠ functional (heart in body). Collapsing these misrepresents reality.  
  - **Integration Levels**: Heap (pile of sand) < organism (tree) < scattered (traffic jam). Each has different unity.  

  Non-negotiables:  
  - Ordinary objects must be covered (denying this makes the theory useless).  
  - Functional persistence (biology depends on it).  
  - Process-based wholes (waves are scientifically real).  
  - Vagueness accommodation (rigid boundaries don't fit reality).  

  Tensions:  
  - Functional unity vs. Mere bonding: A corpse's organs are bonded but non-functional—is it still a whole?  
  - Vagueness vs. Precision: Everyday counting needs crisp boundaries, but reality is fuzzy.  

  The "no arbitrary mereology" requirement likely kills simplistic theories (e.g., universalism). It forces selectivity, aligning with scientific and practical views.  

  I should structure the response as numbered desiderata with clear justifications, then analyze conflicts and non-negotiables. Highlight how the wave example challenges material persistence, and how vagueness is unavoidable. Emphasize that no theory satisfies all perfectly, but the best balance pragmatism with ontological rigor.
answer: |-
  Here's a distilled list of **desiderata** (requirements) for a theory of composition, focusing on *what it must deliver* and *why each is necessary* for everyday/scientific robustness. I'll then flag key distinctions, non-negotiables, tensions, and killer requirements. The goal is a theory that avoids absurdity in ordinary counting while respecting scientific reality.

  ---

  ### **Core Desiderata: What the Theory Must Deliver & Why Necessary**
  1.  **Accommodate Stable Ordinary Objects (e.g., chairs, rocks):**  
      *   **Requirement:** Must count clearly bonded, spatially contiguous, functionally stable macro-objects as wholes.  
      *   **Why Necessary:** Denying this makes the theory useless for daily life and basic science. Physics treats rocks as cohesive units; biology treats organisms as such. Failure means you can't count your coffee cup as one thing.

  2.  **Exclude Arbitrary Collections (e.g., "the stuff on my desk" as a single object):**  
      *   **Requirement:** Must *not* count random assortments of unrelated parts (e.g., a leaf, a coin, and your phone) as a composite object.  
      *   **Why Necessary:** Permitting this violates scientific parsimony and makes counting meaningless ("Is the leaf+coin one object or two?"). Biology/physics don't treat arbitrary sums as integrated systems.

  3.  **Handle Partial Assembly (e.g., half-built bookshelf):**  
      *   **Requirement:** Must explain why a pile of disassembled shelves isn't a bookshelf, why partially assembled parts *might* be a proto-bookshelf, and why a fully assembled one is unequivocal.  
      *   **Why Necessary:** Artifacts are defined by function/structure. A theory must reflect degrees of integration to explain repair, construction, and failure. Ignoring this misrepresents design and agency.

  4.  **Distinguish Bonding Types (e.g., glued coins vs. stacked coins):**  
      *   **Requirement:** Must treat permanently bonded parts (glued coins) as a single object, but *not* transiently connected parts (stacked coins).  
      *   **Why Necessary:** Bonding affects causal behavior (glued coins move as one; stacked coins scatter if bumped). Physics/engineering rely on cohesion thresholds for "objecthood."

  5.  **Account for Functional Persistence (e.g., transplanted heart):**  
      *   **Requirement:** Must recognize a heart as the *same functional whole* before/during/after transplant, even when detached or in a new body.  
      *   **Why Necessary:** Biology defines organs by intrinsic structure/function, not location. Denying this undermines medicine ("Was the heart not an organ while in transit?").

  6.  **Reject Non-Functional Aggregates (e.g., ocean plastic):**  
      *   **Requirement:** Must *not* count scattered debris (like plastic in the ocean) as a single object, despite shared material or location.  
      *   **Why Necessary:** There's no cohesive unity, shared function, or causal interdependence. Ecology treats this as particulate pollution, not a "thing."

  7.  **Include Dynamic Wholes (e.g., a wave):**  
      *   **Requirement:** Must count a wave as a whole *despite* changing parts (water molecules moving through it), as long as a stable pattern persists.  
      *   **Why Necessary:** Waves are scientifically real patterns with causal powers (erosion, energy transfer). Ignoring process-based wholes misrepresents physics.

  8.  **Accommodate Vagueness & Gradual Change (e.g., Ship of Theseus):**  
      *   **Requirement:** Must handle borderline cases (when exactly does a heap become a pile?) and identity over time (is a repaired ship the "same" ship?).  
      *   **Why Necessary:** Real objects have fuzzy boundaries (clouds, forests) and persist through part replacement. Rigid definitions fail biology (metabolism) and engineering (maintenance).

  ---

  ### **Critical Distinctions a Theory CANNOT Collapse**
  -   **Existence vs. Convenience:** Must distinguish *genuine composites* (a human heart) from *practical groupings* ("all socks in Ohio"). **Why:** Science relies on objective boundaries; collapsing these invites "anything counts" relativism.  
  -   **Touching vs. Bonded vs. Functional Unity:** Must differentiate:  
      - Mere contact (rocks in a pile),  
      - Physical bonding (glued coins),  
      - Functional integration (heart in a body).  
      **Why:** These have different causal profiles (a pile collapses; a glued unit doesn't; an organism dies if disintegrated).  
  -   **Heap vs. Organism vs. Scattered System:** Must distinguish:  
      - Aggregates (sand heap: no interdependence),  
      - Organisms (tree: parts mutually sustain life),  
      - Engineered systems (car: parts serve a designed function),  
      - Truly scattered entities (traffic jam: emergent pattern without cohesion).  
      **Why:** These require different explanatory frameworks (physics vs. biology vs. engineering vs. complexity theory).

  ---

  ### **Non-Negotiables vs. Debatable Preferences**
  -   **Non-Negotiables (failure here = theory unusable):**  
      1.  Accommodate ordinary objects (#1). *Why:* Without this, the theory is irrelevant to daily life.  
      2.  Exclude arbitrary collections (#2). *Why:* Permitting these destroys countable ontology.  
      3.  Functional persistence (#5). *Why:* Biology/medicine depend on persistent functional units (organs, cells).  
      4.  Dynamic wholes (#7). *Why:* Physics recognizes patterns (waves, vortices) as real.  
      5.  Vagueness accommodation (#8). *Why:* The world is fuzzy; crisp boundaries are artificial.  
  -   **Debatable / Camp-Specific:**  
      - Whether *all* artifacts (e.g., a nation) count as composites (social constructs vs. physicalism).  
      - How *much* functional integration is needed (is a dead body still a "body"?).  
      - Whether vague objects *exist* or are just semantic.

  ---

  ### **Key Tensions (Likely Unsatisfiable Pairs)**
  1.  **Functional Unity vs. Mere Bonding:** A corpse has bonded parts but no function. Is it still a "body"? (#5 vs. #4).  
  2.  **Vagueness vs. Precision:** Everyday counting needs crisp boundaries (#1), but reality is gradual (#8). No theory fully resolves this.  
  3.  **Dynamic Wholes vs. Part Persistence:** Waves (#7) challenge the idea that wholes require persistent parts.

  ---

  ### **Most Damaging Requirement to Simple Theories**
  -   **Killer Requirement: #2 (Exclude Arbitrary Collections) + #1 (Include Ordinary Objects).**  
      - **Why it kills simple views:**  
          - **Always Compose (Universalism):** Allows arbitrary collections (e.g., "your nose + the Eiffel Tower"), violating #2.  
          - **Never Compose (Nihilism):** Denies chairs/rocks exist as wholes, violating #1.  
          - **Sometimes Compose (Brutal Composition):** Claims composition only happens at fundamental physical "cuts." Fails #5 (transplanted heart) and #7 (waves), which aren't fundamental.  
      - **Impact:** Forces the theory to be *selective*—demanding a principled basis for inclusion/exclusion beyond simplicity or human whim.

  ---

  ### **Bottom Line for Practical Use**
  A viable theory must:  
  - **Anchor "wholes" in causal cohesion or functional unity** (not just location or human interest).  
  - **Accept graded boundaries** (a bookshelf can be "mostly whole" at 90% assembly).  
  - **Prioritize science over folk intuition** (e.g., waves count; ocean plastic doesn't).  
  - **Allow identity to persist through part-change** (your body is still "you" after haircuts or heart transplants).  

  No existing theory (mereology, process metaphysics, functionalism) nails all desiderata perfectly—**vagueness (#8) and dynamic wholes (#7) are the toughest nuts to crack**. But weighting non-negotiables (#1, #2, #5, #7) and allowing pragmatic vagueness gets you closest to a biologist/physicist-proof framework. For everyday counting? Lean on functional integration and causal unity; when in doubt, ask "does it *act* as one?"
