  ### Seminar Exercise: Prioritarianism and the Leveling-Down Objection  
  **Context:** You are a regional hospital director allocating rehabilitation resources between two wards (Ward 1 and Ward 2). Each ward has 100 patients. All patients are identical in desert, responsibility, and entitlement. There are no future people, risk, uncertainty, or instrumental effects. Lifetime well-being scores are interpersonally comparable and fixed for each option.  

  #### Options for Resource Allocation:  
  - **A (Status Quo):**  
    - Ward 1 (worse off): 10 units per patient.  
    - Ward 2 (better off): 25 units per patient.  
    - Total well-being: \(100 \times 10 + 100 \times 25 = 3,500\).  
    - Inequality gap: \(25 - 10 = 15\).  

  - **B (Partial Equalization, Moderate Waste):**  
    - Transfer resources from Ward 2 to Ward 1 with 20% administrative waste.  
    - Ward 1: 14 units per patient (gain of 4).  
    - Ward 2: 20 units per patient (loss of 5).  
    - Total well-being: \(100 \times 14 + 100 \times 20 = 3,400\).  
    - Inequality gap: \(20 - 14 = 6\).  

  - **C (Full Equalization, High Waste):**  
    - Transfer resources from Ward 2 to Ward 1 with 40% administrative waste.  
    - Both wards: 15.625 units per patient.  
    - Total well-being: \(200 \times 15.625 = 3,125\).  
    - Inequality gap: \(0\).  

  - **D (Pure Leveling Down):**  
    - Lower Ward 2 to Ward 1’s level with no gain to Ward 1.  
    - Both wards: 10 units per patient.  
    - Total well-being: \(100 \times 10 + 100 \times 10 = 2,000\).  
    - Inequality gap: \(0\).  

  ---

  ### Ethical Rankings and Arithmetic  
  **1. Utilitarianism (ranks by total well-being):**  
  - **Value:** Sum of individual well-being.  
  - **Ranking:**  
    - A: \(3,500\)  
    - B: \(3,400\)  
    - C: \(3,125\)  
    - D: \(2,000\)  
    - **Order:** A > B > C > D  
  - **Why:** Utilitarianism maximizes total well-being. A has the highest total. B reduces total slightly due to waste, C reduces it further, and D is worst (massive loss with no gain).  

  **2. Prioritarianism (uses square-root weighting):**  
  - **Value:** Sum of \(\sqrt{\text{well-being}}\) per person.  
  - **Arithmetic (per 100 patients):**  
    - A: \(100 \times (\sqrt{10} + \sqrt{25}) = 100 \times (3.162 + 5.000) = 816.2\)  
    - B: \(100 \times (\sqrt{14} + \sqrt{20}) = 100 \times (3.742 + 4.472) = 821.4\)  
    - C: \(100 \times (\sqrt{15.625} + \sqrt{15.625}) = 100 \times (3.953 + 3.953) = 790.6\)  
    - D: \(100 \times (\sqrt{10} + \sqrt{10}) = 100 \times (3.162 + 3.162) = 632.4\)  
  - **Ranking:** B > A > C > D  
  - **Why:** Prioritarianism weights gains to the worse off more heavily. B improves Ward 1 (from 10 to 14) significantly due to concavity, outweighing Ward 2’s loss (25 to 20). C’s high waste reduces total well-being too much, lowering its value. D is rejected—it lowers well-being with no benefit to the worse off.  

  **3. Telic Egalitarianism (ranks by total well-being minus inequality penalty):**  
  - **Value:** Total well-being \(- k \times \text{inequality gap}\).  
    - Assume \(k = 101\) (substantial weight to equality).  
  - **Arithmetic:**  
    - A: \(3,500 - 101 \times 15 = 3,500 - 1,515 = 1,985\)  
    - B: \(3,400 - 101 \times 6 = 3,400 - 606 = 2,794\)  
    - C: \(3,125 - 101 \times 0 = 3,125\)  
    - D: \(2,000 - 101 \times 0 = 2,000\)  
  - **Ranking:** C > B > D > A  
  - **Why:** Telic egalitarianism treats inequality as intrinsically bad. A’s large gap incurs a heavy penalty, making it worse than D (which eliminates inequality but lowers well-being). C is best—it eliminates inequality at a lower total cost than D.  

  ---

  ### Key Insights  
  **Structural Feature Separating Prioritarianism from Telic Egalitarianism:**  
  - **The role of waste in B and C** is crucial. Prioritarianism prioritizes the worse off but rejects equality when it reduces total well-being excessively (e.g., C’s high waste makes it worse than A). Telic egalitarianism, however, favors equality intrinsically, so it ranks C > A even though C has lower total well-being. This shows prioritarianism avoids leveling down (D) and avoids valuing equality for its own sake.  

  **Effects of Adjustments:**  
  1. **If waste in B and C is removed:**  
     - B becomes a lossless transfer: Ward 1 = 14, Ward 2 = 21 (total well-being: 3,500).  
       - Prioritarianism: \(100 \times (\sqrt{14} + \sqrt{21}) \approx 832.5\) → **B > A**.  
     - C becomes lossless equality: Both wards = 17.5 (total well-being: 3,500).  
       - Prioritarianism: \(100 \times (\sqrt{17.5} + \sqrt{17.5}) \approx 836.6\) → **C > B > A**.  
     - *Why:* Without waste, prioritarianism favors full equality due to concavity, but telic egalitarianism still ranks C > A (if \(k > 0\)).  

  2. **If prioritarian weighting is nearly linear (e.g., \(x^{0.99}\) instead of \(\sqrt{x}\)):**  
     - Prioritarianism approximates utilitarianism. It ranks A > B (since B’s total loss outweighs weak priority to the worse off), collapsing the distinction.  

  **Strongest Telic Egalitarian Reply to Resist D:**  
  - **The Pareto-Inclusiveness Reply:** A telic egalitarian can argue that equality only matters if it benefits someone. D harms the better off without improving the worse off, violating the Pareto principle. Thus, D is not better than A, even if A has inequality. This avoids ranking D > A by requiring that equality improvements must not be "purely destructive."  

  ---

  ### Self-Critical Note  
  **Weakest Step:** The assumption that telic egalitarianism *must* rank D > A (via a linear penalty \(k \times \text{gap}\)) is vulnerable. If telic egalitarianism incorporates a Pareto-respecting condition (e.g., "equality is only valuable when it benefits at least one person"), it can reject D > A while still ranking C > A. This would undermine the leveling-down objection’s force, as prioritarianism and telic egalitarianism could converge in rejecting D. If this Pareto-inclusive telic egalitarianism is defensible, the case fails to vindicate prioritarianism uniquely.  

  **Conclusion:** This exercise shows how prioritarianism can prioritize the worse off without endorsing leveling down, but its success hinges on telic egalitarianism’s inability to handle the D > A ranking plausibly. The administrative waste in B and C is the lever separating the theories.
