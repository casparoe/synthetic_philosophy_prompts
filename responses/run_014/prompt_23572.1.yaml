answer: |-
  Based on Hobbes's core philosophical commitments as articulated in *De Corpore* and evident in his dispute with Wallis, his reaction to the computational turn would be **fundamentally ambivalent, leaning towards rejection of its most radical implications despite its superficial alignment with his computational view of reason.** Here's a breakdown, engaging with his specific doctrines and the Wallis controversy:

  1.  **The Allure of Mechanization: Potential for Delight (But Superficial):**
      *   **"Reason is nothing but Reckoning":** Hobbes's central tenet (*Leviathan*, Ch. 5; *De Corpore*, Ch. 1) that reasoning is computational ("adding and subtracting of the consequences of general names") aligns perfectly with the *mechanism* of proof assistants. A machine performing flawless logical operations based on defined terms embodies his ideal of error-free calculation.
      *   **Settling the Wallis Dispute:** Hobbes would see immense value in a formal system forcing Wallis to explicitly define terms like "infinity" and "algebraic symbol" and demonstrate the constructive steps of his circle quadrature "solution" within a rigorous, definitional framework. Machine verification could definitively expose the flaws Hobbes perceived in Wallis's methods, vindicating Hobbes's insistence on constructive definitions and demonstrable generation of figures (*De Corpore*, Ch. 20; *Six Lessons*).
      *   **Formalization of Euclid as Vindication (Partially):** The successful formalization of Euclid in systems like Lean would strike Hobbes as a powerful vindication of his core argument *against the prevailing intuitive view* and *for* a definitional/computational foundation. It demonstrates that geometry *can* be reduced to explicit definitions, postulates, and rules of inference manipulated computationally. This directly counters the view (which he attributed to Wallis and others) that geometric truth relies on an unanalyzable intuition of figures.

  2.  **The Core Objection: Knowledge Requires Human Discourse & Signification:**
      *   **"Knowledge is the Evidence of Truth":** For Hobbes, knowledge isn't just correct symbols; it's the *human act of understanding* the causal connections signified by names (*De Corpore*, Ch. 6). A proof no human can read or comprehend step-by-step fails this fundamental criterion. The Feit-Thompson verification, while computationally correct, would be meaningless *as knowledge* for Hobbes because it lacks a human discursive path connecting definitions to conclusions via understood signification.
      *   **Hostility to "Insignificant Speech" & Scholasticism:** Hobbes railed against terms that lack clear, sensory-derived signification, calling them "insignificant sounds" and "abuses of speech" (*Leviathan*, Ch. 4-5; *De Corpore*, Ch. 3). He would likely view the immense, opaque symbol structures generated by proof assistants for complex theorems as the *ultimate scholasticism* – a system of signs manipulated according to rules, but where the connection between the symbols and the real concepts they are supposed to signify (especially concerning complex geometric constructions or abstract algebraic structures) is lost in the sheer scale and abstraction. The symbols become empty marks, precisely what he condemned.
      *   **The Primacy of Construction & Generation:** Hobbes's geometry was fundamentally about *motion* and *construction* – defining figures by how they are generated or composed from simpler parts (*De Corpore*, Ch. 15). A formal proof in Lean verifying a geometric property might be syntactically correct but could easily obscure the constructive, generative process that was paramount for Hobbes. If the formalization prioritizes logical deduction over the visualization of constructive acts (even symbolic ones traceable by the mind), he would see it as missing the point, potentially smuggling in non-constructive concepts akin to Wallis's infinity.
      *   **Language as the Medium of Reason:** Hobbes grounded all reasoning in human language, defined by agreed-upon significations derived from sense experience. Machine code and formal logic, divorced from this human linguistic and sensory context, exist in a realm he would likely deem irrelevant to true philosophical knowledge. Knowledge, for Hobbes, is a social, linguistic phenomenon (*Leviathan*, Introduction, Ch. 4-5). A machine proof exists outside this human discourse.

  3.  **Formalization of Euclid: Vindication or Betrayal?**
      *   **Vindication (Methodologically):** As noted, the *possibility* of formalizing Euclid computationally would strongly support Hobbes's argument against intuitive geometry and for a definitional foundation. It proves his core point about the nature of mathematical certainty arising from reckoning with definitions.
      *   **Betrayal (Epistemologically & Pedagogically):** However, Hobbes would likely see the *implementation* in a proof assistant as a potential betrayal of his project's spirit. His goal wasn't just abstract correctness but *human understanding* achieved through clear definitions, constructive generation, and comprehensible computation *within the human mind*. If the Lean formalization becomes an impenetrable black box, or if it relies on abstract type-theoretic foundations he would deem "insignificant" without clear sensory/constructive grounding, he would view it as replicating the obscurity he fought against in the scholastics and perceived in Wallis. It might prove geometry *can* be computational, but in a way that strips it of its status as *human knowledge* as he defined it.

  **Conclusion: Which Reaction is Better Supported?**

  The textual evidence strongly favors the **objection** – Hobbes would likely *reject* the notion that machine-verified proofs like Feit-Thompson constitute genuine *knowledge*, and he would have significant reservations about the epistemological status of large-scale formalization in proof assistants.

  *   **Strongest Argument for Objection:** Hobbes's entire philosophy anchors knowledge in human sense experience, language, and the discursive process of reasoning ("reckoning") with names that retain their clear signification. A proof beyond human comprehension violates every aspect of this. His vitriol against insignificant speech and his insistence that geometry must involve imaginable constructions point directly to a rejection of opaque formal symbol manipulation, regardless of its syntactic correctness. Knowledge, for Hobbes, is fundamentally anthropocentric and discursive.
  *   **Strongest Argument for Delight (Conceding the Main Point):** The undeniable alignment between his computational theory of reason and the *mechanism* of proof assistants is striking. He *might* accept machine verification for relatively simple, constructively clear geometric propositions derived directly from definitions (perhaps even seeing it as the ultimate arbiter for disputes like the circle quadrature), precisely because the human discursive path remains conceivable. The formalization of Euclid *as a project* vindicates his core methodological claim against Wallis and intuitionism.

  **Final Probable Position:** Hobbes would be intellectually fascinated by the computational turn, seeing in it a powerful tool for enforcing definitional rigor and settling disputes like his with Wallis. He might grudgingly admire its power. However, he would ultimately condemn its application to proofs beyond human comprehension as the creation of a new, sophisticated form of "insignificant speech," devoid of the essential human element of understanding grounded in sensory experience and clear linguistic signification. He would see the formalization of Euclid as a triumphant proof of his methodological principle but likely as a pedagogical and epistemological failure if it obscured the constructive foundations and human reasoning process he valued above all. His delight would be tempered by profound unease at the divorce between computation and *human* knowledge.
