prompt: |-
  I've been sorting out my intuitions about when someone has the right to criticize another person for a wrongdoing they themselves have committed. A brother who quit smoking a year ago tells me, a current smoker, to quit: fine — his past doesn't disqualify him, but it gives him no more right to say it than a person who never smoked. A friend who has been quietly under-reporting his income for years and is still doing it wants to say something to a colleague who has just done a much bigger evasion: not fine — I can't shake the feeling that he has no right to be the one to raise it, even though the scale is very different. A coach who doped early in his career, admits it, and now coaches teenagers wants to ban them from doing so: fine — and I think he has more right to say it than a coach who never doped, because he can speak to why it's tempting and what it costs. A parent who admits to lying to their kid when they were small, to protect them, now wants to scold the kid for lying: fine — the kinds of lying are different enough. A friend who once borrowed money and never returned it now wants to pressure their roommate to pay rent on time: fine — the domains are different enough that the past doesn't carry over. Is there a principle, or a small set of candidates, that captures all of these or comes close, stated precisely enough that I can tell which of my cases each clause is meant to cover? What does it predict for a case I haven't listed — a person who has never done the thing and has never been tempted to, criticizing someone who has? And if no principle accommodates all my verdicts, which one does it force me to drop, and would I actually drop it?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're trying to figure out a consistent principle for when someone has the right to criticize another for a wrongdoing they themselves have committed. They've provided several scenarios with their intuitive judgments, and they want a precise principle that explains all these cases. If no such principle fits, they want to know which judgment should be reconsidered.

  First, I need to analyze each case they mentioned. The brother who quit smoking criticizing a current smoker is fine, but the reformed smoker has no more right than someone who never smoked. Then there's the tax evasion friend who's still under-reporting income but wants to criticize a colleague for a bigger evasion—here, the user feels it's not okay. The coach who doped but now condemns it is acceptable, even more so because of his experience. The parent who lied to protect the child but scolds the child for lying is fine because the contexts differ. The friend who didn't repay a loan but pressures a roommate about rent is also fine, as the domains are different.

  Looking for patterns. In the acceptable cases, the critic either reformed (coach), the acts were contextually different (parent, friend), or the past doesn't affect the right to speak (brother). The tax evasion case is rejected because the critic is still engaging in the behavior, making it hypocritical. The key factors seem to be current commitment to the norm and contextual relevance.

  The user also asks about a new scenario: someone who never did the thing and was never tempted criticizes another. The principle should cover that too. The reformed critic (like the coach) has more standing because of insight, while the consistent non-offender (like someone who never smoked) has basic standing but less insight. The never-tempted person would have standing as long as they're committed to the norm.

  Formulating the principles. The main one is Current Normative Commitment: the critic must not be currently violating the norm they're invoking. If they are, they lose standing. The second is Contextual Similarity: if the past violation is in the same context as the current one, the critic must have reformed to have standing. Additionally, Reform as Amplifier: reformed critics gain extra standing due to insight.

  Applying these to each case. The brother quit, so current commitment is yes. Contextual similarity is high, but he reformed, so it's acceptable. The tax friend is still evading, so current commitment fails—no standing. The coach reformed and condemns current violations, so he has standing. The parent's lying was protective, while the child's is different, so contextual similarity is low, and current commitment holds. The friend's money issues are different contexts, so acceptable.

  For the new case: someone never tempted and never did the thing. Current commitment is strong, contextual similarity might be high, but since they never violated, they have standing. However, they lack the experiential insight that a reformed person has. So they can criticize, but their advice might lack depth.

  Checking if the principles cover all cases without contradiction. The tax evasion case is the outlier if someone thinks past hypocrisy alone disqualifies, but the user's intuition rejects it only when the critic is still offending. This fits the current commitment principle. If the tax friend had stopped, they could criticize even with a past violation. So the key is ongoing behavior.

  Would the user drop any intuition? Their judgment on the tax friend aligns with the principle. If they initially thought past hypocrisy alone disqualifies, the coach case shows that reform restores standing. The principle clarifies that it's about current actions, not past ones per se. So the user might adjust to see that past violations aren't disqualifying if the critic has reformed and is currently committed.

  Final principles: 1. Current Normative Commitment. 2. Contextual Similarity. 3. Reform as Amplifier. These explain all cases. The never-tempted critic has standing under principle 1, but less authority than a reformed one under principle 3.
answer: |-
  Based on your intuitions, a consistent principle emerges with three key clauses. This framework distinguishes **Standing to Criticize** (basic legitimacy) from **Critic's Authority** (added weight/effectiveness), and hinges on *current commitment to the norm* and *contextual relevance*.

  ### The Principle
  **A person has the *standing to criticize* another for violating norm N if and only if:**
  1.  **Current Normative Commitment:** The critic is not *currently* violating N in a context relevant to the criticism, and demonstrates commitment to N (e.g., has reformed, or never violated it).
  2.  **Contextual Similarity:** The critic's *past* violation of N does not occur in a context so similar to the present offense that it constitutes active hypocrisy *unless* they have demonstrably reformed (satisfying Clause 1).

  **A critic gains *additional authority* (beyond basic standing) if:**
  3.  **Reform as Amplifier:** The critic has *successfully reformed* from violating N (especially in a similar context), granting them unique experiential insight (e.g., understanding temptation, consequences, or pathways to change).

  ### Applying the Principle to Your Cases
  1.  **Brother (quit smoking) criticizes current smoker:**
      *   **Standing:** Yes (Clause 1: He is *currently* committed to N ("don't smoke"), not violating it).
      *   **Authority:** Equal to a never-smoker (Clause 3: He reformed, but insight may not significantly amplify authority here vs. simple health facts. He has no *more* right, but no *less*).
      *   **Verdict Match:** FINE.

  2.  **Friend (current tax evader) criticizes colleague's tax evasion:**
      *   **Standing:** **NO** (Clause 1: He is *currently* violating N ("pay correct taxes") in a relevant context. His ongoing action directly contradicts the norm he invokes).
      *   **Authority:** N/A (No standing).
      *   **Verdict Match:** NOT FINE.

  3.  **Coach (reformed doper) bans teen doping:**
      *   **Standing:** Yes (Clause 1: He is *currently* committed to N ("don't dope"), not violating it. Clause 2: Past violation is similar, but reform satisfies).
      *   **Authority:** **Higher** than a never-doper (Clause 3: His reform grants deep experiential insight into temptation, consequences, and quitting).
      *   **Verdict Match:** FINE (and MORE right).

  4.  **Parent (past protective lie) scolds child for lying:**
      *   **Standing:** Yes (Clause 1: Presumably committed to honesty norms *now*. Clause 2: Contexts are dissimilar - "protective lie" vs. general dishonesty. Not active hypocrisy).
      *   **Authority:** Likely similar to a parent who never lied (Clause 3: Reform from a *dissimilar* violation adds little unique authority here).
      *   **Verdict Match:** FINE.

  5.  **Friend (past unpaid debt) pressures roommate on rent:**
      *   **Standing:** Yes (Clause 1: Presumably committed to timely payment *now*. Clause 2: Contexts are dissimilar - informal loan vs. contractual rent obligation. Not active hypocrisy).
      *   **Authority:** Similar to someone without that past (Clause 3: Reform from a *dissimilar* financial violation adds little unique authority).
      *   **Verdict Match:** FINE.

  ### Prediction for Your New Case: The Never-Tempted Critic
  *   **Scenario:** A person who has never done the thing (e.g., never smoked, never doped, never evaded taxes) and claims they were *never even tempted*, criticizes someone who has.
  *   **Standing:** **YES** (Clause 1: They are *currently* committed to N and not violating it).
  *   **Authority:** **Lower** than a successfully reformed critic (Clause 3: Lacks experiential insight into temptation, struggle, or the actual costs *as felt by the offender*). However, their authority could be *higher* than a current hypocrite or equal to a reformed critic if they possess deep *external* knowledge (e.g., a scientist studying addiction). But purely based on their stated lack of experience/temptation, their persuasive authority on the *personal struggle* is diminished.
  *   **Summary:** They have the *right* to criticize (standing), but their criticism may lack the unique persuasive power derived from lived experience that a reformed critic possesses. Their authority rests purely on reason, evidence, or societal norms, not personal testimony.

  ### Does the Principle Force You to Drop a Verdict?
  *   **The principle perfectly accommodates all your stated verdicts.** It explains why the current tax evader lacks standing (violating Clause 1), while the others retain standing due to current commitment and/or contextual dissimilarity (Clauses 1 & 2). It also explains the coach's amplified authority (Clause 3).
  *   **Potential Point of Contention - The Brother's Equal Standing:** Your intuition that the reformed brother has "no more right" than a never-smoker is upheld by the principle regarding *standing* (both have it). However, the principle *allows* that the brother *might* have slightly more *persuasive authority* (Clause 3) due to his experience quitting, though you find this negligible. The principle doesn't *force* you to grant him *more* standing/authority than you do; it simply explains why he has *at least equal* standing and *potential* for slightly more authority based on insight.

  ### Key Insights from the Principle
  1.  **Hypocrisy is Contextual & Current:** What matters isn't *any* past violation, but whether the critic is *currently* acting against the norm *in a relevantly similar way* (Clauses 1 & 2). Past violations in *different* contexts or after reform don't automatically destroy standing.
  2.  **Reform Enables Criticism:** One must genuinely stop the behavior and endorse the norm to credibly criticize others for it (Core of Clause 1, especially when context is similar - Clause 2).
  3.  **Reform Enhances Persuasion:** Lived experience of violating *and overcoming* a norm provides unique, credible insight that pure avoidance cannot match (Clause 3).
  4.  **Never-Offenders Have Basic Standing:** Commitment to the norm is sufficient for the *right* to criticize, even without personal struggle (Clause 1), though their *effectiveness* might be different.

  This principle cleanly captures your intuitions by focusing on the critic's *current relationship to the norm* and the *contextual relevance of their past*, while separating the *right* to speak from the *weight* the speech carries.
