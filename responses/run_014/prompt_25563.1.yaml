answer: |-
  You've pinpointed a crucial and enduring debate at the heart of moral psychology and normative ethics. The book's summary represents a strong, popularized version of the situationist critique, but your instincts are correct: it significantly oversimplifies both the experimental findings and the nature of virtue ethics. Let's break down what a virtue ethicist (VE) would likely grant, dispute, and why the book's conclusion doesn't necessarily follow.

  **What Virtue Ethicists Would Grant:**

  1.  **The Power of Situations:** VEs readily acknowledge that situational factors exert a *massive* influence on behavior. They wouldn't be surprised that hurry, mood, perceived authority, or subtle environmental cues can *significantly impact* moral action in specific moments. Aristotle himself emphasized the importance of upbringing, habituation within a community, and external goods – all situational/environmental factors.
  2.  **The Fallibility of "Character":** VEs grant that people often *overestimate* the stability and consistency of their own and others' character, falling prey to the "fundamental attribution error" (over-attributing behavior to disposition, under-attributing to situation). The experiments powerfully demonstrate this human tendency.
  3.  **The Challenge to "Globalist" Conceptions:** VEs would agree that the experiments effectively refute an extremely naive, "globalist" conception of character traits. This view holds that possessing "compassion" means one will *always* act compassionately in *every* situation, regardless of context, fatigue, stress, or competing demands. The experiments clearly show this isn't the case.
  4.  **The Importance of Environment:** VEs fully endorse the idea that designing supportive environments is crucial for moral development and action. Cultivating virtue *requires* conducive social structures, good laws, supportive communities, and well-designed institutions. Aristotle's *polis* was precisely such an environment. They see this not as an alternative to character, but as its necessary foundation and scaffold.

  **What Virtue Ethicists Would Dispute (and Why the Book's Summary is Problematic):**

  1.  **The Non-Existence of Traits:** This is the core dispute. VEs argue the experiments don't prove traits *don't exist*, only that they are not *invariably dominant* in all situations. They reject the inference: "Behavior varies across situations, therefore no internal dispositions exist."
      *   **Alternative Explanation:** VEs propose a model of "local" or "situated" traits. Traits like compassion are real psychological dispositions, but they manifest reliably only within *relevant* situations and when the agent possesses *practical wisdom (phronesis)* to recognize the demands of the situation. Compassion might manifest reliably towards friends in need, but be overridden by overwhelming fear in a Milgram-like scenario or by intense time pressure in the Good Samaritan study. The trait exists, but its expression is context-dependent and requires judgment.
      *   **The Consistency/Stability Distinction:** VEs argue the experiments challenge *behavioral consistency* across wildly different situations, but not necessarily *trait stability* over time within relevant domains. A person might be stably compassionate in their daily interactions with colleagues but fail spectacularly under extreme, novel pressure or deception (like Milgram). Stability doesn't guarantee perfect cross-situational consistency.
      *   **The "Fragmentation" of Virtue:** Rachana Kamtekar, in particular, argues that the situationist interpretation assumes a fragmented psychology where traits are isolated "atoms." VEs see virtues as integrated aspects of a whole character, mediated by practical reason. A failure in one bizarre situation doesn't mean the integrated disposition is absent.

  2.  **The Misrepresentation of Virtue Ethics:**
      *   **Practical Wisdom (Phronesis):** VE centrally involves *phronesis* – the cultivated capacity for discerning the morally relevant features of a situation and knowing how to act rightly *in this context*. The experiments often place subjects in novel, ambiguous, or deceptive situations precisely designed to overwhelm normal judgment. VEs argue this tests *phronesis* under extreme duress, not the non-existence of dispositions. A virtuous person *ideally* has the wisdom to question illegitimate authority (Milgram) or recognize a genuine need despite time pressure (Good Samaritan), but VE acknowledges this is hard and requires cultivation.
      *   **Habit and Development:** VE emphasizes that virtues are *habits* developed through repeated practice and reflection over time. They are not static end-states but dynamic dispositions that need continual reinforcement. The experiments capture single, often highly artificial moments, not the longitudinal pattern of a life shaped by virtue cultivation. A single failure doesn't erase a habit, though it might indicate areas needing growth.
      *   **The Threshold for "Having" a Virtue:** VE doesn't require perfect, infallible expression. It allows for weakness of will (*akrasia*), mistakes in judgment, and being overcome by extreme circumstances. The bar for "having compassion" isn't "never fails to help," but rather "possesses a reliable disposition to recognize need and feel motivated to help, which generally leads to helping behavior in relevant situations, barring significant countervailing factors."

  3.  **The Interpretation of the Experiments:**
      *   **Not Zero Influence:** Even in the "failure" conditions, individual differences *do* appear (e.g., not *everyone* went to max shock in Milgram; some seminarians *did* stop). VEs argue these differences reflect variations in underlying dispositions, even if situational forces are powerful enough to override them in many.
      *   **Ecological Validity:** Some experiments (especially Milgram) involve highly artificial, deceptive, and extreme pressure. While revealing about human potential under duress, they may not generalize well to everyday moral life where virtues are cultivated and expressed.
      *   **What Counts as the "Situation"?** VE would argue that a person's *interpretation* of the situation (mediated by their character and *phronesis*) is crucial. The "situation" isn't purely objective; it's perceived through the lens of one's dispositions. Two people in the same physical setup might perceive very different moral demands.

  **Does the Practical Conclusion Follow? (Abandon Character, Focus Only on Nudges/Design)**

  1.  **No, It Doesn't Necessarily Follow:** Even granting the *power* of situations, it doesn't logically entail the *non-existence* of character traits or the *futility* of cultivating them. It only shows situations are powerful influences.
  2.  **The Danger of Eliminating Agency:** Abandoning character-talk entirely risks undermining moral responsibility, aspiration, and the concept of a morally integrated self. If "I" am merely a product of my current situation, concepts like integrity, moral growth, regret, and praise/blame become deeply problematic or incoherent. VE insists that while situations shape us, we also shape ourselves and our responses to situations through habituation and reflection.
  3.  **The Complacency Problem:** Solely focusing on "nudging" good behavior risks creating compliant subjects rather than virtuous agents. It might achieve desired behaviors but neglect the development of the underlying moral understanding, motivation, and reasoning capacity (*phronesis*) that allows people to act rightly even in *new* or *poorly designed* situations, or to challenge *unjust* systems. A well-designed environment might make casual helping easy, but it won't necessarily cultivate the courage to stand up to a tyrant.
  4.  **The Interdependence:** VEs (and many psychologists) argue that the dichotomy is false. Character development *requires* supportive environments ("nudges" in the broadest sense). Conversely, well-designed environments are often created and sustained *by* people of good character exercising practical wisdom. It's a feedback loop, not an either/or. We need environments that *foster* the development of robust character traits and practical wisdom, not just ones that bypass agency to elicit specific behaviors.
  5.  **The Empirical Record Isn't That Clear-Cut:** While situational power is undeniable, research also supports:
      *   **Behavioral Signatures:** Patterns of behavior *across* situations that reflect consistent personality traits (interactionism).
      *   **Longitudinal Stability:** Evidence for relative stability in personality traits over the lifespan.
      *   **Trait-Relevant Situations:** People show greater consistency in situations *relevant* to a specific trait.

  **In Conclusion:**

  Your nagging sense is spot-on. The book runs together claims: it conflates the *power of situations* with the *non-existence of traits*, and it attacks a caricature ("globalist") version of virtue ethics that few serious proponents hold. Virtue ethicists grant the profound influence of situations but argue for a more nuanced, situated, and practically wise conception of character traits. They see the experiments as highlighting the *difficulty* of virtue and the *importance* of *phronesis* and supportive environments, not as proof of its impossibility. The practical conclusion to abandon character-talk entirely does not follow from the empirical record; it ignores the reality of agency, the importance of moral development, and the interdependence of character and environment. A robust moral psychology and effective ethics likely requires attention to *both* the cultivation of character and the design of morally supportive situations.

  **Next Steps for Your Research:** Dive into the responses! Annas (*Intelligent Virtue*, articles on situationism) defends the developmental and reason-infused nature of virtue. Kamtekar ("Situationism and Virtue Ethics on the Content of Our Character") offers a powerful critique of the fragmentation assumption. Doris (*Lack of Character*) presents the strongest philosophical situationist case – engaging directly with him is crucial. Nancy Snow (*Virtue as Social Intelligence*) offers excellent empirically informed defenses. This debate remains vibrant and central to your field. Good luck!
