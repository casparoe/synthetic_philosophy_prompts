answer: |-
  ### Exam Question (125 words)
  **Decision theory faces foundational challenges when expected values are undefined. Consider the Pasadena game: a fair coin is tossed until first heads on toss *n*, paying \((-1)^{n+1} \cdot 2^n / n\). The Altadena game pays \(2^n / n\) for the same outcome.**

  1. Explain why the Pasadena game’s expected value is undefined (not infinite), and why this is philosophically problematic beyond being a mathematical curiosity.  
  2. What does this imply for the principle that rational agents should maximize expected value?  
  3. Does the fact that Altadena dominates Pasadena in every state resolve the problem? Justify your answer.  
  4. Evaluate ONE proposed response (e.g., restricting to well-defined expectations, bounded utility, or non-expected-value criteria). What does this case show about standard decision theory?  

  *(90 minutes; 25 marks)*

  ---

  ### Model Answer (710 words)

  The Pasadena game highlights a critical limitation in standard decision theory: its inability to handle prospects with undefined expected value (EV). Unlike the St. Petersburg paradox—where EV is infinite and the problem is that rationality demands paying any finite price—the Pasadena game has no determinate EV at all. This renders expected value maximization (EVM) silent, not just demanding, posing a deeper challenge to its completeness as a theory of rational choice.  

  **(1) Undefined EV and its significance**  
  The EV of the Pasadena game is the sum of the probability-weighted payoffs: \(\sum_{n=1}^{\infty} \frac{1}{2^n} \cdot (-1)^{n+1} \frac{2^n}{n} = \sum_{n=1}^{\infty} (-1)^{n+1} \frac{1}{n}\). This is the alternating harmonic series, which is *conditionally convergent*. By the Riemann rearrangement theorem, its sum can be altered to any real number (or made to diverge) by reordering its terms. Since all outcomes are possible and no canonical ordering exists for the summation, there is no unique EV. This is not a mere technicality. Decision theory requires a definite expectation to rank prospects. An undefined EV means the theory cannot assign *any* value—positive, negative, or infinite—to the game. Consequently, EVM cannot compare it to other prospects (e.g., receiving $0 for sure), leaving rational choice indeterminate.  

  **(2) Implication for EVM**  
  EVM assumes every prospect has a well-defined EV (finite or infinite) that agents should maximize. The Pasadena game violates this assumption. EVM cannot say whether playing it is better, worse, or equal to a sure payoff of $0, $10, or even -$100. This is distinct from St. Petersburg, where EV is infinite and the theory *does* give guidance (pay any finite amount). Here, the theory is *incomplete*: it fails to rank a feasible prospect against alternatives, undermining its claim to be a universal rule for rational choice under uncertainty.  

  **(3) Altadena dominance: Inadequate resolution**  
  The Altadena game (payoff \(2^n/n\)) has a divergent EV (positive infinity) and strictly dominates Pasadena: its payoff is always greater in every state (e.g., +2 > -2 on toss 1). If choosing *between* them, dominance reasoning clearly favors Altadena. However, this does not salvage EVM. First, dominance alone cannot assign a *cardinal value* to Pasadena, so the game remains incomparable to non-dominated prospects (e.g., $0). Second, if offered Pasadena *alone*, dominance provides no guidance. Third, dominance cannot resolve comparisons involving Pasadena and other prospects with undefined or infinite EVs. Thus, while useful in pairwise choices under dominance, it fails to restore a general EVM framework for Pasadena-like games.  

  **(4) Evaluating bounded utility**  
  One response is to adopt a bounded utility function (e.g., \(u(x) = \arctan(x)\)), transforming monetary payoffs to ensure absolute convergence. This yields a finite, well-defined expected utility for Pasadena. While mathematically effective, it *changes the subject*. Standard decision theory often assumes linear utility in money for such paradoxes. Bounded utility solves a *different* problem—evaluating utility—not the original problem of evaluating monetary EV. If we insist on monetary payoffs (e.g., in financial contexts), the problem persists. Moreover, bounding utility avoids confronting the core issue: that EVM lacks resources to handle conditionally convergent series in its native domain.  

  **Conclusion**  
  The Pasadena game demonstrates that EVM is not a complete theory of rationality. Its silence in the face of undefined expectations creates genuine normative gaps, unlike infinite expectations which merely produce counterintuitive prescriptions. The Altadena dominance relation offers limited situational guidance but cannot extend EVM to cover the Pasadena game generally. Technical fixes like bounded utility work only by redefining the decision problem. Ultimately, this case suggests EVM must either be supplemented with rules for handling undefined expectations (e.g., using convergence-sensitive summation methods) or concede that some prospects lie beyond its scope, demanding alternative criteria (e.g., minimax or qualitative dominance) in pathological cases.  

  ---

  ### Marking Scheme (25 marks total)
  **Award 5 marks per fully addressed criterion. An A answer (21-25 marks) must satisfy all five criteria with conceptual precision. A B answer (15-20 marks) satisfies 3-4 criteria, or all five superficially (e.g., mischaracterizing undefined vs. infinite, or missing the depth of the problem).**

  1.  **Conditional Convergence & Undefined EV:**  
      Correctly identifies the Pasadena EV series as \(\sum (-1)^{n+1}/n\). Explains conditional convergence: terms decrease to zero but absolute series diverges. States Riemann rearrangement allows any finite sum/diverge, so no unique EV exists. Must note probabilities are fixed, but *summation order* is arbitrary.  
      *Common errors (-1 to -3): Calls EV "infinite" or "zero"; claims rearrangement is irrelevant.*

  2.  **Distinction from St. Petersburg & Severity:**  
      Contrasts Pasadena (undefined EV → theory silent) vs. St. Petersburg (infinite EV → theory demands excessive payment). Must argue Pasadena is *worse*: EVM fails to rank the prospect at all, revealing incompleteness, not just extremity.  
      *Common errors (-2): Equates "undefined" and "infinite"; calls both mere mathematical quirks.*

  3.  **Implication for EVM:**  
      States EVM cannot rank Pasadena against *any* sure thing or other prospect (e.g., $0). Argues this violates EVM’s goal of providing complete rational ordering. Must note EVM is incomplete, not just counterintuitive.  
      *Common errors (-2): Only says "EVM doesn’t work" without explaining incomparability.*

  4.  **Altadena Dominance Analysis:**  
      Notes Altadena dominates Pasadena statewise and has infinite EV. Correctly states dominance resolves *pairwise choice* with Altadena but *fails* to: (a) assign value to Pasadena alone, (b) rank Pasadena vs. non-dominated prospects (e.g., $0), (c) extend EVM generally.  
      *Common errors (-3): Claims dominance "solves" the problem; infers Pasadena’s EV from Altadena’s.*

  5.  **Response Evaluation & Conclusion:**  
      Critically assesses ONE response (e.g., bounded utility: works mathematically but changes subject; restriction to well-defined EVs: protects theory but abandons guidance; alternative rules: have own limitations). Concludes that Pasadena shows EVM is incomplete or needs supplementation.  
      *Common errors (-2): Superficial treatment (e.g., "bounded utility fixes it"); no clear conclusion.*

  **Additional Guidance for TAs:**  
  - Award partial marks (1-4) per criterion if partially addressed.  
  - B answers often confuse "undefined" and "infinite" (Criterion 1/2) or overstate dominance (Criterion 4).  
  - Top marks require linking mathematical properties to philosophical consequences (e.g., "rearrangement arbitrariness → no fact of the matter → normative silence").  
  - Key A-grade phrases: "incomparability," "normative gap," "changes the subject," "silence vs. demandingness."
