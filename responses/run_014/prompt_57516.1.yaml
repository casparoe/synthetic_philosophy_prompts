answer: |-
  The Free Will Emporium was having a sale.

  “Libertarian Deluxe?” the shopkeeper offered. “Uncaused cause! Pure self-creation! Yours for a princely sum.”
  The customer frowned. “So... it’s random? Like a cosmic hiccup? Not *me* deciding?”

  “Exactly! Truly free!”
  “Pass. What’s the budget option?”

  “Compatibilist Classic! Very popular with the professionals.” The shopkeeper patted a sturdy, unassuming box. “Choices *are* you! Your reasons, your desires – just part of a causal chain. Feels like freedom, works great!”

  The customer squinted. “So... it’s just fancy determinism? Calling my predictable parts ‘free’?”

  “Well... yes? But it *feels* robust! Look, it’s half-price.”
  “Got anything *not* random, but *also* not just... me getting spit out by the universe?”

  The shopkeeper sighed, gesturing to the empty shelf labeled *Ultimate Origination + Intelligible Character*. “Sorry. That model’s perpetually out of stock. Always was.”

  In the corner, a determinist browsed the snacks, quietly certain.
