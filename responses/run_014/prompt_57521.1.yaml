prompt: |-
  I've been reading about Bell's theorem on my own and my friend is way deeper into the foundations stuff than me. She's got firm verdicts on which interpretations are "local": Bohmian mechanics, nonlocal, no question, because the velocity of a particle here depends on where all the others are at the same instant, so it needs a privileged now. GRW-type collapse, nonlocal, same reason. Many-worlds, local, no collapse just the wavefunction evolving smoothly. Superdeterminism, local — she despises it but says its sin isn't locality, it's what it does to the idea that our choice of measurement setting is free. Retrocausal versions where the influence runs backwards instead of sideways: local, just wierd. And textbook quantum mechanics with collapse in the recipe: nonlocal.

  I care less about whether she's right than about which rule she's actually running. Give me the candidate rules that fit all six of those verdicts — I've already worked out it can't be "does it let you signal faster than light", since none of them do. Then here's the case I want to predict: a collapse theory where the collapses are just random points sprinkled through spacetime, and the law for where they land is written so that every inertial observer agrees on it, no privileged now anywhere, but the odds of a collapse happening in my lab still depend on what happens in the other, spacelike-separated lab, in a way you provably can't send a message with. Would she call that local or nonlocal? Which rules say which, what's your best guess and why, and what one further case would separate the rules that come apart on this one?
reasoning: |-
  Okay, the user is deep into quantum foundations and Bell's theorem, trying to understand their friend's classification of interpretations as local or nonlocal. They've listed six specific verdicts from their friend and want to know the underlying rule. The key is that faster-than-light signaling isn't the criterion since none allow it. The user also presents a hypothetical collapse theory with random collapses in spacetime that all inertial observers agree on, asking if their friend would call it local or nonlocal.

  First, I need to recall Bell's theorem and locality definitions. Bell's theorem shows that quantum mechanics can't be explained by local hidden variables. But interpretations handle this differently. The friend's classifications: Bohmian and GRW are nonlocal due to instantaneous dependencies. Many-worlds is local because it has no collapse. Superdeterminism is local but denies free choice. Retrocausal is local with backward influences. Textbook QM with collapse is nonlocal.

  The user says signaling isn't the rule. So what's the friend using? Possible rules: Parameter Independence (PI) and Outcome Independence (OI). PI means the probability of an outcome here doesn't depend on the setting elsewhere. OI means the outcome here doesn't depend on the outcome elsewhere. Bell-locality requires both. Violating either allows nonlocal correlations without signaling.

  Checking against the verdicts:
  - Bohmian: Violates PI (settings affect outcomes elsewhere), so nonlocal. Matches.
  - GRW: Collapses affect distant outcomes instantly, violates PI? Probably yes.
  - Many-worlds: Pure wavefunction, no collapse. Satisfies both PI and OI? Controversial, but the friend calls it local. MWI might satisfy PI because measurements reveal pre-existing branches.
  - Superdeterminism: Correlations from common past, no dependency during experiment. Satisfies PI and OI? Yes, local.
  - Retrocausal: Influences backward in time, so settings can correlate via past, but during measurement, no spacelike influence. Might satisfy PI if handled right.
  - Textbook collapse: Measurement here affects distant state, violates OI or PI.

  So the friend likely uses Bell-locality: both PI and OI must hold.

  Now the hypothetical: random collapses in spacetime, Lorentz-invariant (all observers agree), but correlations between spacelike labs without signaling. Does it violate PI or OI?

  The collapses are sprinkled randomly, but the probabilities depend on distant events. So if the setting in Lab A affects the collapse probabilities in Lab B spacelike-separated, that violates PI. Even if no signaling, the dependency on distant settings breaks PI. So the friend would call it nonlocal.

  Further test case: A model that violates Outcome Independence but not Parameter Independence. For example, if outcomes are correlated but settings don't affect distant outcomes. Bohmian violates PI, but a model violating only OI might be like some hidden variable theories. If the friend calls such a model nonlocal (since OI violation still nonlocal by Bell), that confirms they require both PI and OI. If they accept it as local, they might only care about signaling or PI. But the friend's view on Bohmian (nonlocal due to PI violation) suggests they require both. So a pure OI-violating model would still be nonlocal to them. That's consistent.
answer: |-
  Based on your description of your friend's verdicts on the six interpretations, her underlying rule is almost certainly **Bell-locality**, defined by the conjunction of two conditions:

  1.  **Parameter Independence (PI):** The probability of an outcome *here*, given the complete state of the system, does *not* depend on the *setting* (choice of measurement) chosen *elsewhere*.
  2.  **Outcome Independence (OI):** The probability of an outcome *here*, given the complete state of the system *and* the setting *here*, does *not* depend on the *outcome* obtained *elsewhere*.

  **Why Bell-locality fits all six verdicts:**

  1.  **Bohmian Mechanics:** Violates PI. The velocity (outcome dependence) at one location depends instantaneously on the positions (configuration) of *all* particles, which depends on the *settings* everywhere. `(Nonlocal - Matches)`
  2.  **GRW-type Collapse:** Violates OI (and often PI implicitly). A collapse event *here* instantaneously changes the wavefunction, altering the probabilities for outcomes *elsewhere*, regardless of the distant setting. `(Nonlocal - Matches)`
  3.  **Many-Worlds (Everettian):** Satisfies both PI and OI *at the fundamental level*. There is no collapse or instantaneous influence. The wavefunction evolves unitarily and locally according to the Schrödinger equation. Correlations arise solely from past common causes (entanglement). `(Local - Matches)`
  4.  **Superdeterminism:** Satisfies both PI and OI *by construction*. The apparent correlation between settings and outcomes is explained by a common cause in the absolute past. There are *no* dependencies between spacelike-separated events *during* the experiment; everything was fixed. Its "sin" is violating statistical independence (freedom of choice), not locality. `(Local - Matches)`
  5.  **Retrocausal Models:** Can satisfy PI and OI *if carefully constructed*. Influences travel *backwards* in time to a common point in the past light cone, then *forwards* again. There is no direct dependency between spacelike-separated events *during* the experiment; the dependency is mediated along timelike or lightlike paths. `(Local - Matches)`
  6.  **Textbook Collapse:** Violates OI explicitly. Measurement *here* causes instantaneous wavefunction collapse, changing the state and thus the outcome probabilities *elsewhere*. `(Nonlocal - Matches)`

  **Key Point:** Bell-locality (PI + OI) is necessary and sufficient to prevent *any* violation of Bell inequalities without FTL signaling. Violating *either* PI *or* OI allows for Bell inequality violations while *still* prohibiting FTL signaling.

  **Your Hypothetical Collapse Theory:**

  *   **Description:** Lorentz-invariant random collapse events ("sprinkles") throughout spacetime. All inertial observers agree on where collapses occur. Probabilities for collapses in your lab depend on events in a spacelike-separated lab, but this dependency cannot be used for FTL signaling.
  *   **Analysis w.r.t. Bell-locality:**
      *   If the *probability* of a collapse event occurring in your lab *depends on the measurement setting chosen* in the distant lab, this **violates Parameter Independence (PI)**. The setting choice "there" is directly influencing the stochastic process (collapse occurrence) "here," even if it can't be controlled to send a signal.
      *   If the *probability* of a collapse event occurring in your lab *depends on the outcome obtained* in the distant lab, this **violates Outcome Independence (OI)**.
      *   Crucially, for the theory to reproduce quantum correlations necessary to violate Bell inequalities, it *must* violate *at least one* of PI or OI. The Lorentz invariance of the sprinkling process doesn't change this fundamental requirement. The dependency on the distant event (whether setting or outcome) is still a spacelike-separated influence, even if the *law* governing the sprinkles is Lorentz invariant.
  *   **Prediction:** Your friend would **call this theory NONLOCAL**. The core reason is the spacelike-separated dependence of the collapse probability in one region on events in another region, violating either PI or OI (or both). The inability to signal (no-signaling theorem) and Lorentz invariance of the *law* are important features, but they do not negate the violation of Bell-locality.

  **Separating Further Rules:**

  Your friend's rule (Bell-locality = PI + OI) is the most consistent with her verdicts. However, other nuanced definitions exist. Here's one further case to separate potential rules:

  *   **The Further Case: A model violating only Outcome Independence (OI) but satisfying Parameter Independence (PI).**
      *   **Description:** Imagine a deterministic hidden variable model where:
          1.  The hidden variable `λ` is set in the common past.
          2.  The outcome *here* depends *only* on `λ` and the local setting *here* (satisfies PI).
          3.  However, the outcome *here* is *also* a deterministic function of the outcome *there* (or vice-versa) for entangled pairs. This violates OI.
      *   **Analysis:**
          *   **Bell-locality (PI + OI):** Violated (OI violated) → `Nonlocal`.
          *   **"No Superluminal Causation" (focuses only on settings causing outcomes):** Potentially satisfied. The outcome *here* is caused by `λ` and the local setting. The correlation with the distant outcome arises because both are determined by `λ` and the respective local settings. There's no sense in which the distant outcome *caused* the local outcome faster than light; they are joint effects of `λ`.
          *   **"No FTL Signaling" (Operational):** Satisfied. Knowing the distant outcome doesn't give information about the local setting choice faster than light because the outcomes are random and correlated, but the local setting itself doesn't depend on the distant outcome.
      *   **Prediction for your friend:** She would **call this model NONLOCAL**. Her verdict on textbook collapse (nonlocal due to violating OI) strongly suggests she requires *both* PI and OI for locality. Bell's theorem explicitly shows that violating OI (even with PI satisfied) is sufficient to violate Bell inequalities and requires nonlocal correlations. This model blatantly violates OI via a spacelike link between outcomes.
      *   **Why this separates rules:** Rules focusing *only* on FTL signaling or *only* on superluminal causation (settings causing outcomes) might potentially classify this OI-violating-but-PI-satisfying model as "local," as there's no controllable influence or setting-dependence across spacelike separation. However, your friend's verdicts, especially on textbook collapse, show she considers OI-violation sufficient for nonlocality. Bell-locality (PI + OI) definitively classifies it as nonlocal.

  **Summary:**

  *   **Your friend's rule:** Bell-locality (Parameter Independence + Outcome Independence).
  *   **Hypothetical Collapse Theory Prediction:** She would call it **NONLOCAL** because it necessarily violates either PI or OI to reproduce quantum correlations.
  *   **Separating Case:** A model violating *only* Outcome Independence (OI) but satisfying Parameter Independence (PI). This would be **NONLOCAL** under Bell-locality (and your friend's likely view), but *potentially* "local" under rules focusing solely on FTL signaling or direct causation from settings to outcomes.

  Her classification system is fundamentally tied to the structure of dependencies between spacelike-separated events, specifically forbidding dependencies of local probabilities on distant settings (PI) and distant outcomes (OI), regardless of signaling capability or Lorentz invariance of the *overall law*.
