prompt: |-
  hey, im putting together a handout for a small metaphysics reading group and I keep getting stuck explaining what people actually believe about grounding, so can you build me a decision tree that takes someone from 'ok I grant there's a fundamental level of reality' down to a named position? each branch node should be one question they can answer without already knowing the label -- like, does the grounding relation have to be well founded (no infinite regresses), can the fundamental facts just be brute or do they have to be explained by something, is grounding a real relation out in the world or a feature of our descriptions, and does the fundamental level have to be one thing or can it be a bunch of separate facts. i need these to show up as leaves: priority monism, pluralist fundamentality with brute basic facts, an infinite grounding regress, coherentist or circular grounding, and the deflationary view that grounding isnt a real relation at all. give each leaf one sentence on its most awkward commitment, flag any two leaves the tree cant actually separate, and tell me which combinations of answers end up unoccupied and why (incoherent, unattractive, or just nobody has thought it through). keep the whole thing under 700 words.
