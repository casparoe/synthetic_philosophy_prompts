  We are drafting a sequence of 6-8 interview questions for a colloquium Q&A with a physicist defending the de Broglie-Bohm (Bohmian) interpretation. The questions should go beyond restating the theory and include specific topics: quantum equilibrium hypothesis, ontological status of the wave function, reconciliation of nonlocality with special relativity, and experimental evidence that could count against the theory.

  Each question should have a follow-up keyed to the most likely answer.

  Let's outline the topics and the required questions:

  1. **Quantum Equilibrium Hypothesis**: How the theory explains why systems are found in the |ψ|² distribution and what the typicality measure buys us.
  2. **Ontological Status of the Wave Function**: Whether it is a real physical field or merely nomological, and implications for "empty waves".
  3. **Nonlocality and Special Relativity**: How the explicitly nonlocal dynamics are reconciled with special relativity.
  4. **Experimental Evidence**: What could count against the theory given that in equilibrium it reproduces standard QM.

  We need at least one question on each of these. We can add 2-4 more questions to round out the sequence to 6-8.

  Possible additional topics:
  - The status of the particle trajectories (e.g., why we don't see them, how they account for quantum phenomena like interference).
  - The role of the wave function in guiding particles (the guiding equation) and whether it can be replaced or modified.
  - How Bohmian mechanics handles the measurement problem and why it avoids the need for wave function collapse.
  - The status of symmetries (like identical particles) in Bohmian mechanics.
  - Whether Bohmian mechanics can be extended to quantum field theory.

  Let's plan the sequence:

  1. Start with a question about the quantum equilibrium hypothesis.
  2. Follow up with the typicality measure.
  3. Move to the ontological status of the wave function.
  4. Then the issue of empty waves.
  5. Next, nonlocality and special relativity.
  6. Then, experimental evidence against the theory.
  7. Add one or two more on other aspects (e.g., trajectories, measurement problem, or symmetries).

  We'll aim for 8 questions with follow-ups.

  Draft:

  1. **Quantum Equilibrium Hypothesis**: 
     - Question: One of the distinctive features of Bohmian mechanics is the quantum equilibrium hypothesis, which says that the initial positions of particles are distributed according to |ψ|². How does the theory explain why we always find systems in this distribution and not some other?
     - Expected Answer: She might explain that the |ψ|² distribution is preserved by the dynamics (equivariance) and that it is the "typical" distribution in the sense that almost all initial configurations (with respect to the |ψ|² measure) will yield the quantum statistics.
     - Follow-up: You mention typicality. But what does this typicality buy us? In particular, since the theory is deterministic, why should we expect to see the |ψ|² distribution even if it is typical? And how does this relate to the justification of the Born rule?

  2. **Typicality Measure**:
     - Question: The typicality measure you refer to is defined by the |ψ|² distribution itself. Doesn't this lead to a circularity? How do we break out of that?
     - Expected Answer: She might argue that the measure is not arbitrary but natural given the wave function and the dynamics. The dynamics preserve this measure, and it is the only measure that is equivariant. Also, in the context of the universe, the wave function of the universe and the initial configuration might be fixed, and typicality is with respect to that.
     - Follow-up: But if the universe started in a configuration that is atypical with respect to |Ψ|², would we still see quantum statistics? If not, how do we explain that we are in a typical configuration?

  3. **Ontological Status of the Wave Function**:
     - Question: In Bohmian mechanics, the wave function plays a central role in guiding the particles. But there's a debate about its ontological status: is it a real physical field in configuration space, or is it merely nomological, like a law of nature? Which view do you take and why?
     - Expected Answer: She might argue for one of these views (likely the nomological view to avoid the high-dimensional ontology) and explain the advantages.
     - Follow-up: How does this view impact the status of "empty waves", that is, parts of the wave function that no longer contain any particles? For example, in a double-slit experiment, after a particle has gone through one slit, the part of the wave function in the other slit is still present but empty. What happens to it? And how does your chosen ontological view help (or not) in addressing the concern that we have a very complex entity (the wave function) that seems to have no direct physical effect in those empty regions?

  4. **Nonlocality and Special Relativity**:
     - Question: Bohmian mechanics is explicitly nonlocal, which seems to conflict with special relativity. How do you reconcile the nonlocal dynamics with the principles of special relativity?
     - Expected Answer: She might concede that the theory is nonlocal and therefore violates Lorentz invariance at the fundamental level, but note that the empirical predictions (in quantum equilibrium) are Lorentz invariant because they match standard QM. Alternatively, she might discuss ongoing efforts to construct a Lorentz-invariant Bohmian theory.
     - Follow-up: But if the underlying dynamics are nonlocal, doesn't that open the door to sending signals faster than light? How does Bohmian mechanics avoid that? And if the theory is not Lorentz invariant at the fundamental level, does that mean there is a preferred frame? If so, how does it remain hidden?

  5. **Empty Waves and their Implications**:
     - Question: Building on the issue of empty waves, if we take the wave function as a real physical field, then we have a very large ontology in configuration space. How do we avoid the charge that this is ontologically extravagant? And if we take the nomological view, how do we account for the fact that the wave function evolves in time and can have complex branching structures?
     - Expected Answer: She might emphasize that the nomological view treats the wave function as part of the law and hence not as a contingent entity. Therefore, its complexity doesn't add to the ontology of the universe. Alternatively, she might argue that the physical field view is acceptable because configuration space is the natural setting for the theory.
     - Follow-up: But if the wave function is nomological, then how do we account for its time evolution? Laws are usually thought of as static. And if the wave function is a physical field, then what is the status of configuration space? Is it a fundamental aspect of reality?

  6. **Trajectories and Quantum Phenomena**:
     - Question: Bohmian mechanics postulates definite particle trajectories at all times. However, these trajectories are not directly observable. How does the theory account for quantum phenomena like interference without being able to measure these trajectories? And why are they hidden?
     - Expected Answer: She might explain that the uncertainty principle in Bohmian mechanics is a consequence of the quantum equilibrium. Because we cannot know the exact initial positions without disturbing the system, the trajectories are hidden. The interference pattern is built up by the guiding equation that depends on the entire wave function.
     - Follow-up: But if we were able to prepare a system with a known initial position, could we predict the trajectory and hence violate the uncertainty principle? How does Bohmian mechanics prevent that?

  7. **Experimental Evidence**:
     - Question: In quantum equilibrium, Bohmian mechanics reproduces the predictions of standard quantum mechanics. What kind of experimental evidence could count against Bohmian mechanics? Are there any proposed experiments that could test it versus other interpretations?
     - Expected Answer: She might say that since the empirical predictions are the same, no experiment can distinguish it from standard QM. However, she might mention non-equilibrium scenarios (if they exist) or that the theory makes the same predictions as standard QM only under the equilibrium hypothesis. Alternatively, she might point out that some extensions (like stochastic variants) might be testable.
     - Follow-up: But if the theory is empirically equivalent to standard QM in all practical situations, isn't it then unfalsifiable? And what about the possibility of quantum non-equilibrium? Have there been any serious proposals to test for deviations from |ψ|²?

  8. **Extension to Quantum Field Theory and Relativity**:
     - Question: How does Bohmian mechanics fare when extended to quantum field theory and relativity? Are there consistent relativistic versions? And if so, how do they handle particle creation and annihilation?
     - Expected Answer: She might discuss the work on Bohmian quantum field theory, perhaps in terms of a preferred foliation of spacetime, or the idea of Dirac sea for fermions. She might also mention the challenges.
     - Follow-up: Doesn't the need for a preferred foliation conflict with the spirit of relativity? And how does the theory account for the fact that in high-energy experiments, we see particles being created and destroyed?

