prompt: |-
  You're a professional philosopher who specializes in deception and the ethics of assertion, so think this through properly — brainstorm the possible rules she could be running before committing to anything, and only then answer. Reply as a numbered list of exactly five items, each one or two sentences, no intro or conclusion.

  Some context: I'm a second-year student taking an ethics course, and we just wrapped a unit on lying vs misleading. My friend Maya from class has verdicts on cases that are weirdly consistent, like she's running some rule I cant pin down, and I want to predict her on new cases before seminar on Thursday. Her track record so far:

  - Her brother flatly denied eating her leftovers; we found the container in his trash an hour later. Verdict: lying, but trivial — "who cares about leftovers."
  - A guy in our seminar, asked if he'd done the reading, said "I've read the first half twice" (true, he never finished it). Verdict: not lying, just misleading, and mild — worst case was looking unprepared in front of fifteen people. She added that "you can always catch a misleader with a follow-up question."
  - Her ex, asked if he'd been texting his old girlfriend, said "my phone was on the charger all night" (true — he was texting her from his laptop). Verdict: not lying, but a genuine betrayal, relationship over.
  - Her coworker blamed a slipped deadline on the client "not getting back to us till Thursday" (true — but the coworker had sat on the draft for a week). Verdict: not lying, but shifty — worse than the seminar guy, not as bad as the ex.
  - Her cousin lied on an insurance form about a prior condition and was never caught. Verdict: lying, seriously wrong.

  The new cases I want predicted: (A) a former manager writes a reference letter for a job he believes the applicant would actually be bad at, including only true sentences ("never missed a deadline in two years," "always the first to volunteer") that together imply she'd thrive — is that as bad as writing outright false praise, or not? (B) two cousins get an ugly hand-knit sweater from their aunt: one says "I love it, I'll wear it constantly" (false), the other says "it's so warm, and it fits perfectly" (all true, implying she loves it) — does Maya rate one worse, and which? (C) a guy who just says "yes, I read it" when a single follow-up question from the professor would expose him — is that milder than the seminar guy's version, worse, or the same?

  Honestly I care less about the specific calls than about the rule behind them — I assume its definately in there somewhere, but her record seems to fit more than one story about what makes deception bad. So the five items should be: (1) the rule she seems to be running, stated in one sentence; (2) the strongest rival rule that fits her record just as well, and where it predicts differently; (3) your best guess on (A), with the reason; (4) your best guesses on (B) and (C), with reasons; (5) the single further case that would best tell the rules apart, and why it discriminates.
reasoning: |-
  Okay, let me think through this carefully. The user wants me to act as a philosopher specializing in deception ethics to analyze Maya's pattern of judgments across various cases. 

  First, I need to identify the underlying rule in Maya's verdicts. Looking at her responses: she distinguishes between lying (direct false statements) and misleading (true but deceptive statements), but her moral evaluations vary based on context. The key factors seem to be the stakes involved and the victim's ability to verify the truth. For trivial matters like leftovers, she dismisses lying as unimportant. But when verification was possible through follow-up questions (seminar case), she viewed misleading as mild. However, in high-stakes situations where verification was unlikely (ex-boyfriend case), she considered misleading as serious betrayal. The insurance fraud case shows she condemns lying that causes actual harm.

  The strongest rival rule would be one focusing primarily on the speaker's intention to deceive rather than the verifiability aspect. This alternative might predict similar verdicts in most cases but diverge in situations where the deception is easily discoverable but deliberately obscured.

  For the new cases:
  (A) The reference letter using selective truths would likely be seen as bad as false praise because the manager intentionally creates a false impression that can't be easily verified through follow-up questions. 
  (B) The cousin giving true but misleading praise would be rated worse than the outright liar because the deception is harder to catch, making it more manipulative. 
  (C) The direct lie about reading would be worse than the seminar guy's misleading statement because it prevents verification through follow-up questions.

  To distinguish between the two rules, I'd propose a case where someone makes a misleading statement that's easily verifiable but with high stakes - like a doctor using technically true but obscure language about side effects to a patient who could theoretically research it but is unlikely to. The verifiability rule would treat this more harshly than the intent-focused rule.
answer: |-
  Here are the five items as requested:

  1.  **Maya's likely rule:** She distinguishes lying (asserting false propositions) from misleading (using truthful statements to imply falsehoods), but condemns deception most severely when it involves high stakes *and* prevents easy verification by the hearer (e.g., no opportunity for follow-up, context obscures truth).
  2.  **Strongest rival rule:** A rule focusing solely on the *speaker's intention to deceive*, regardless of verifiability or stakes, would fit her record equally well *except* it predicts the seminar case (easily verifiable with follow-up) should be rated worse than she did, perhaps closer to the coworker.
  3.  **Prediction for (A):** Maya will rate the reference letter **as bad as outright false praise**; the manager intends deception with serious consequences (hiring a bad fit), and the selective truths create a false impression the recipient cannot easily verify through follow-up.
  4.  **Predictions for (B) & (C):** (B) Maya rates the misleading cousin **worse**; the true statements imply love and prevent easy discovery of the truth (no natural follow-up), unlike the blatant lie. (C) Maya rates the direct lie **worse** than the seminar guy's misleading; it removes the verification safeguard ("you can always catch a misleader") she valued in the seminar case.
  5.  **Discriminating case:** A politician truthfully says "My opponent voted against funding for school security" (implying they oppose school safety), when the vote was against a bloated bill containing that funding, *and* the politician refuses follow-up questions. The verifiability rule condemns this harshly (blocks verification, high stakes), while the pure intent rule rates it similarly to other intentional deceptions regardless of verifiability.
