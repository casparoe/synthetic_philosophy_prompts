prompt: |-
  I’m TA-ing a short problem set for a seminar on Kant’s Groundwork and need a careful, point-by-point grading pass that separates a correct conclusion from a bad argument, not a charitable summary.

  The exam question was:

  Kant’s Formula of Universal Law requires that one act only on maxims that can be willed as universal laws. In the Groundwork, he distinguishes cases where universalization yields a contradiction in conception from cases where it yields only a contradiction in the will.

  (a) State the maxim under consideration.  
  (b) Explain why the maxim “I will make a false promise to obtain a loan, intending not to repay” fails the test by producing a contradiction in conception.  
  (c) Explain why the maxim “I will never help others” does not fail by producing a contradiction in conception.  
  (d) Explain why “I will never help others” still fails by producing a contradiction in the will.  
  (e) State what this distinction implies about the moral status of the corresponding duties.

  A student answered:

  (a) The maxim is: make a false promise when I need money, with the intention of not repaying.

  (b) If everyone made false promises whenever they needed money, lenders would have no reason to lend, because promises would no longer be reliable. The agent’s maxim therefore presupposes a practice of trustworthy promising while universalizing a rule that would destroy that practice. Since the maxim cannot even be coherently conceived as a universal law, it violates a perfect duty.

  (c) The maxim “never help others” can be conceived as a universal law: a world in which no one helps anyone is not logically impossible. So universalizing it does not make the maxim self-contradictory in conception.

  (d) A rational agent cannot consistently will such a universal law, because as a vulnerable being the agent may need help and would thus be willing a law that excludes the very assistance on which the agent depends. The contradiction is therefore in the will, not in the conception.

  (e) Duties that fail by contradiction in conception are perfect duties; duties that fail only by contradiction in the will are imperfect duties.

  Please grade the answer out of 20, allocating four points to each subpart. For each subpart, give the score and a brief comment identifying what is correct, what is wrong or imprecise, and the specific deduction(s). I want a point-by-point assessment, not a general impression.
reasoning: |-
  Okay, the user is a TA grading a Kant seminar problem set and wants a strict, point-by-point evaluation. They're clearly focused on precision over charity - this isn't about spotting potential misunderstandings but catching every deviation from Kant's exact framework. 

  Hmm, the student answer looks strong at first glance but let's dissect it like Kant would a maxim. For (a), deducting 0.5 for omitting "to obtain a loan" is fair because Kant's cases hinge on specific purposes - the loan context matters for the promise's contingency. 

  (b) is nearly perfect but loses 0.5 for "lenders would have no reason to lend" - too pragmatic! Kant cares about conceptual annihilation of promising itself, not lender psychology. Should emphasize how universalization makes the practice inconceivable.

  (c) is flawless. Student correctly separates logical possibility from volitional consistency - that's the core of Kant's distinction. Full marks.

  (d) has two subtle flaws: "vulnerable being" anthropomorphizes when Kant grounds this in rationality itself, and "would thus be willing" implies hypothetical need rather than essential dependency. Each 0.5 deduction seems right.

  (e) loses 1 point for oversimplification. The student misses that perfect/imperfect maps to strict/meritorious - Kant's "narrow/wide duty" phrasing matters here. Also should explicitly note perfect duties prohibit actions while imperfect prescribe maxims.

  User's demand for "specific deductions not charity" suggests they've seen too many vague TA comments. I'll mirror their clinical approach - no padding, just forensic analysis. They'll appreciate catching that (d)'s "vulnerable" error: it's a common student mistake to psychologize Kant's rationality argument. 

  Noting how (b)'s "lenders" phrasing reveals a deeper issue: students often conflate Kant's transcendental argument with utilitarian consequences. That's worth flagging briefly since user might want to address it in class.
answer: |-
  Here is the point-by-point grading assessment, allocating 4 points per subpart (total 20 points), with specific deductions and explanations:

  **Grading Rubric**  
  *Each subpart graded out of 4 points. Deductions applied for inaccuracies, omissions, or imprecisions in Kantian terminology/concepts.*

  ---

  **(a) Maxim Statement**  
  **Score: 3.5/4**  
  ✅ **Correct:** Accurately captures the core action ("make a false promise") and intent ("intending not to repay").  
  ⚠️ **Imprecision:** Fails to include the **purpose** ("to obtain a loan"). Kant’s maxims explicitly include the end (e.g., *Groundwork* 4:422).  
  ➖ **Deduction:** -0.5 for omission of purpose.  

  ---

  **(b) Contradiction in Conception (False Promise)**  
  **Score: 3.5/4**  
  ✅ **Correct:**  
  - Identifies that universalization destroys trust in promising.  
  - Notes the maxim presupposes a practice it would annihilate.  
  - Correctly classifies it as violating a perfect duty.  
  ⚠️ **Imprecision:**  
  - Focuses on "lenders having no reason to lend" (pragmatic consequence) instead of Kant’s **logical contradiction**: Universal false promising makes *the concept of a "promise"* incoherent (*Groundwork* 4:422).  
  ➖ **Deduction:** -0.5 for framing the contradiction in terms of lenders' incentives rather than conceptual annihilation.  

  ---

  **(c) No Contradiction in Conception (Non-Help)**  
  **Score: 4/4**  
  ✅ **Fully Correct:**  
  - States the maxim *can* be universalized without logical contradiction.  
  - Correctly asserts a world without help is "not logically impossible."  
  - Perfectly distinguishes this from (b).  
  ➖ **No deductions.**  

  ---

  **(d) Contradiction in the Will (Non-Help)**  
  **Score: 3/4**  
  ✅ **Correct:**  
  - Identifies that a rational agent cannot *will* the universal law.  
  - Notes the agent’s dependence on possible help.  
  ⚠️ **Imprecisions:**  
  - "As a vulnerable being" is incomplete; Kant roots this in **rational agency**, not vulnerability (*Groundwork* 4:423).  
  - "Would thus be willing" implies hypothetical contingency; Kant argues it’s *structurally irrational* for a finite rational being to will non-help, as rationality requires pursuing ends that sometimes require aid.  
  ➖ **Deductions:** -0.5 for "vulnerable being" (misplaced emphasis), -0.5 for weakening Kant’s necessity claim ("would thus be willing" vs. "cannot rationally will").  

  ---

  **(e) Moral Status of Duties**  
  **Score: 3/4**  
  ✅ **Correct:**  
  - Correctly maps "contradiction in conception" → perfect duties.  
  - Correctly maps "contradiction in will" → imperfect duties.  
  ⚠️ **Omission:**  
  - Fails to specify **what the duties prescribe**:  
    - Perfect duties = **prohibition** (e.g., *never* make false promises).  
    - Imperfect duties = **positive obligation to adopt a maxim** (e.g., *sometimes* help others), not a specific action-timing.  
  ➖ **Deduction:** -1.0 for missing this key distinction in Kant’s theory (*Groundwork* 4:421n, 4:429).  

  ---

  **TOTAL SCORE: 17/20**  
  *Breakdown:*  
  (a) 3.5 + (b) 3.5 + (c) 4 + (d) 3 + (e) 3 = 17  

