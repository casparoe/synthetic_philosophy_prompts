  "Your answer demonstrates strong grasp of core distinctions (c is flawless). Key improvements: (1) Include *all* maxim components (purpose/end). (2) Focus on *conceptual* (not pragmatic) collapse in (b). (3) Ground (d) in rational agency, not vulnerability. (4) Specify duty *types* (prohibition vs. obligation) in (e)."
