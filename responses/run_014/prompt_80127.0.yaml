answer: |-
  ## The Public Sword

  The city chokes beneath the grasping **tyrant**,
  No God-anointed right adorns his **crown**.
  His touch corrupts; no blessing in his **hand**,
  But force that twists and breaks the common **law**.
  He feasts upon the suffering civic **body**,
  Declaring *his* desire the sole true **good**.

  Can any soul deny the urgent **good**
  In cleansing earth of such a monstrous **tyrant**?
  When rot consumes the suffering civic **body**,
  Who would not shatter that usurper's **crown**?
  His rule's a blight, a mockery of **law** –
  Is justice not placed in the righteous **hand**?

  This blade feels light within the ready **hand**.
  The cause seems clear, the necessary **good**:
  To end the reign that scorns all rightful **law**.
  Is it not virtue, felling this false **tyrant**?
  To smash the symbol of his stolen **crown**
  And free the life within the trampled **body**?

  But pause: the surgeon tending the sick **body**,
  Whose skilled incision steadies his own **hand**,
  Acts not for self, but for the patient's **good**.
  Though gangrene marks the limb (a creeping **tyrant**),
  His charge flows from the trust beneath the **crown** –
  The *public* power, the guardianship of **law**.

  For life and death belong to ordered **law**,
  Not private rage, though stirred by civic **body**.
  The charge to cut, to heal, to wield the **crown**'s
  Last dreadful power, rests not in my lone **hand**.
  Though clear the ill, though palpable the **good**,
  The sentence lies beyond the private **tyrant**-slayer.

  The office, sickened by the wicked **tyrant**,
  Holds still the power ordained for public **good**.
  Defect of title, rot within the **crown**,
  Is vacancy, not license for your **hand**.
  The charge endures beyond the failing **body**;
  The right to strike resides in public **law**.

  ---

  **Envoi**

  That **crown** is rotten, hollow to the core.
  Yet still, no private **hand** takes up that sword.
  The **law**'s grim work, to cleanse the public **body**,
  Demands the charge, the office, not the **good**
  Intent that marks the would-be slayer of the **tyrant**.
