answer: |-
  ## Frame Problem Sonnet

  The lifted arm displaces only air;
  The moved wheel turns, and leaves the walls alone.
  Assume unchanged what commonsense declares:
  The ceiling's height, the color of the stone.
  The list remains of things that stay the same,
  Each item noted, clear and unestranged.
  The action's done; no consequence to blame,
  Save what the axiom has pre-arranged.

  But wait – what rides upon the wagon's frame,
  Unnoticed freight that alters the result?
  No flag was raised to mark this hidden claim,
  No prior rule could name the thunderbolt.
  For meaning floods from any fact unchecked;
  A thousand things the simple plan inflect.

  What stays fixed cannot be a bounded thing;
  No list confined protects from open doors.
  The world pours in where thought presumed to cling
  To certain ground; the mind's eye scans the shores
  And sees each grain of sand, each wave's advance,
  A player now within the vast design.
  No wall exists to hold that happenstance
  At bay, or say which thread the Fates entwine.

  What must be lost? The hope held at the start
  That stillness could be written, part from part.

  ---

  **Notes on Execution:**

  1.  **Octave (Lines 1-8):** Calm, procedural tone ("Assume unchanged," "The list remains," "Each item noted"). Focuses on the *representational burden* - explicitly listing what *doesn't* change ("walls alone," "ceiling's height," "color of the stone"). The "axiom pre-arranged" captures the early AI belief in manageable axiomatization. Rhymes are straightforward: air/declares, alone/stone, same/blame, unestranged/pre-arranged.
  2.  **Volta (Line 9):** "But wait –" signals the philosophical shift. The wagon/bomb scenario is depicted implicitly ("what rides upon the wagon's frame," "Unnoticed freight," "hidden claim," "thunderbolt").
  3.  **Sestet (Lines 9-14):** Expands into the epistemological crisis. "Meaning floods," "thousand things," "vast design" convey the overwhelming scope. "No wall exists," "each grain of sand," "each wave's advance" emphasize the loss of boundaries and the potential relevance of *anything*. The tone becomes more urgent and expansive.
  4.  **Couplet (Lines 13-14):** Explicitly states the loss: "The hope held at the start / That stillness could be written, part from part." It rejects the initial solution (listing unchanged facts) without offering a new one, leaving it unresolved ("part from part" implying the impossibility of clean separation).
  5.  **Accessibility:** The core struggle of knowing what to ignore ("Assume unchanged," "Unnoticed freight," "sees each grain of sand," "hope... That stillness could be written") is central, making the poem resonate even without knowing the frame problem.
  6.  **Form:** Strict Shakespearean rhyme scheme (ABAB CDCD EFEF GG). Iambic pentameter generally holds, with tolerable substitutions (e.g., pyrrhic-spondee variations like "**What stays** fixed **can**not be **a** bound**ed** thing").
  7.  **No Names:** Adhered to strictly. The concepts drive recognition for those familiar.
