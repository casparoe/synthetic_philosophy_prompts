prompt: |-
  In my French Revolution course each student has to design and run one two-hour seminar session, and mine falls on the explanation of the Revolution and the Terror: whether a class-struggle reading, an ideology/political-culture reading, or sheer contingency does the explanatory work, and whether revolutions really do consume the people who make them. I have about eighteen students and a room I can rearrange. Please design an activity that makes them feel the force of all three explanations rather than hearing them described.

  What I want specifically: the group should run the same scenario twice — identical roles, rules, starting conditions, and resources — with only a hidden deck of contingency events differing between the runs, so that they discover for themselves that the same structural pressures can issue in quite different outcomes, and cannot tell afterwards whether their choices or the draw did the work. Give me the role set and each role's private objective; a payoff scheme that runs on standing, legitimacy, or resources rather than money; a mechanic whereby the group builds a running list of suspects or denunciations — each addition cheap, each removal impossible, adjudication controlled by whoever currently holds most of some scarce good — so that the machinery they invent to survive the crisis ends up aimed at its inventors; a timeline for the two runs and the debrief; and instructions for what I should be doing while they play. No framing lecture beforehand, and the three explanations should not be named until the debrief, which should map particular moments in play onto each of them, including the moments where the activity's own rules manufacture the pattern an explanation then claims to discover.

  Tell me what will predictably go wrong the first time I run this and how to handle it, and be honest about which feature of the historical question the activity cannot reproduce — in particular, whether the rules I have specified already bias the group toward one of the three readings rather than letting it emerge. Throughout, keep separate what specialists actually agree on from what is genuinely contested, and do not present a contested reading of the Terror as the consensus.
reasoning: |-
  We are designing a role-playing activity to help students experience three explanations for the Terror: class struggle, ideology/political culture, and contingency. The activity will run the same scenario twice with the same roles and starting conditions, but with a hidden deck of contingency events that will differ between the two runs. The goal is for students to see how the same structural pressures can lead to different outcomes and to question whether their choices or the contingency events were more influential.

  ## Key Elements of the Activity

  1. **Roles and Objectives**: There will be 18 roles, each with a private objective. Roles should represent different social classes and political factions during the French Revolution, but without using historical names to avoid preconceptions. The roles will have objectives that create tensions along class lines, ideological lines, and also require cooperation.

  2. **Payoff Scheme**: Instead of money, we will use "Influence" (standing, legitimacy) and "Resources" (material goods). Influence can be used to pass decrees, denounce others, or avoid suspicion. Resources are needed to survive and achieve objectives.

  3. **Denunciation Mechanic**: 
     - There will be a public "List of Suspects". Any player can add a name to the list by spending a small amount of Influence (making it cheap to denounce). 
     - Removing a name is impossible (once denounced, you are on the list until the end of the game). 
     - The player with the most Influence at any given time controls the adjudication of denunciations (i.e., they can choose to ignore a denunciation or accept it, but note: adding is cheap and automatic if the denouncer pays the Influence, but the controller can block a denunciation by paying double the denouncer's cost? Let's think). Actually, to keep it simple: adding a name requires the denouncer to pay 1 Influence and then the name is added. The controller (the one with the most Influence) cannot remove names but can choose to "prioritize" which suspect to investigate (which will lead to removal from the game? Not exactly. We need a mechanic that leads to elimination). However, the rule says removal is impossible. So we need a different consequence.

     Instead, let's have the List of Suspects be a list that accumulates. At the end of each round (or at certain intervals), the player with the most Influence must choose one person from the list to be "arrested" (removed from the game). This creates a situation where the list grows and the person in power has to choose who to remove, which can be arbitrary.

  4. **Contingency Deck**: We will have two decks of contingency events (one for each run) that will be drawn at predetermined times. The events will be positive or negative for certain groups or individuals, and will affect Influence, Resources, or add new objectives.

  5. **Timeline**: The activity will be run twice, each time for 45 minutes, with a 15-minute debrief in between and a 30-minute final debrief. Total: 45 (Run 1) + 15 (break and quick reflection) + 45 (Run 2) + 30 (debrief) = 135 minutes (2 hours 15 minutes). We can adjust by making each run 40 minutes.

  6. **Instructor Role**: The instructor will be the game moderator, managing the contingency deck, keeping time, and noting down observations. The instructor will not interfere except to enforce rules and draw contingency events.

  ## Roles and Private Objectives

  We'll create 6 factions (each with 3 roles) to cover a range of interests. Each faction has a shared broad goal, but each role within the faction has a slightly different private objective. The factions:

  1. **The Privileged (3 roles)**: Representing the old order. They start with high Resources and Influence.
     - Role 1: Maintain at least 10 Influence until the end.
     - Role 2: Accumulate 15 Resources.
     - Role 3: Keep at least two members of the Privileged off the List of Suspects.

  2. **The Reformers (3 roles)**: Want change but not radical. Start with medium Influence and Resources.
     - Role 1: Pass two decrees (see below) that are moderate (defined by the decree deck).
     - Role 2: Have at least 5 Influence and 5 Resources by the end.
     - Role 3: Ensure no member of the Reformers is on the List of Suspects.

  3. **The Radicals (3 roles)**: Want sweeping changes. Start with low Resources but medium Influence.
     - Role 1: Pass at least one radical decree.
     - Role 2: Have the Privileged faction lose at least half their starting Resources.
     - Role 3: Get at least one member of the Privileged on the List of Suspects.

  4. **The Commoners (3 roles)**: Representing the masses. Start with low Influence and Resources but have numbers.
     - Role 1: Get a decree passed that redistributes Resources (taking from the Privileged and giving to Commoners).
     - Role 2: Keep at least 3 Commoners off the List of Suspects.
     - Role 3: Accumulate 10 Resources collectively as a faction.

  5. **The Moderates (3 roles)**: Middle class, professionals. Start with medium Resources and Influence.
     - Role 1: Prevent any radical decree from passing.
     - Role 2: Have at least 8 Influence by the end.
     - Role 3: Ensure at least one member of the Privileged and one Radical is on the List of Suspects.

  6. **The Military (3 roles)**: Have the power to enforce but need resources. Start with high Influence (because they control force) but low Resources.
     - Role 1: Have the group pass a decree that increases Military Resources by 5.
     - Role 2: Be the player with the most Influence at least once.
     - Role 3: Avoid being on the List of Suspects.

  ## Game Mechanics

  ### Starting Conditions
  - Each role starts with a set amount of Influence and Resources (vary by faction, see below).
  - The List of Suspects starts empty.

  ### Resource and Influence Tracking
  - Use tokens or a shared Google Sheet for Resources and Influence.

  ### Rounds
  The game is played in 5 rounds, each representing a period of time. Each round has:
  1. **Contingency Phase**: Draw a contingency event (if it's a contingency round). The instructor draws and reads the event. The contingency deck has 5 events per run. We'll have two different decks (Deck A and Deck B) for the two runs.

  2. **Action Phase**: Players take actions in any order (free-form negotiation and action). Possible actions:
     - **Propose a Decree**: A decree requires a certain amount of Influence to pass (e.g., 10 Influence). Players can pool Influence to pass a decree. The proposer must spend 1 Influence to propose. Decrees can redistribute Resources, change Influence, or introduce new rules. We'll have a deck of decree cards that players can draw from to propose (to keep it from being too open-ended). The decree deck will have about 20 cards, a mix of moderate and radical.
     - **Denounce**: Spend 1 Influence to add any player to the List of Suspects. The denouncer must state a reason (but it can be arbitrary). The accused can counter by spending 2 Influence to block the denunciation? But we said removal is impossible and the controller cannot remove. Let's stick to: denunciation is automatic if the denouncer pays 1 Influence. The accused can try to gather support to denounce the denouncer in retaliation, but that's their action.
     - **Trade**: Exchange Resources or Influence with another player.
     - **Form Alliance**: A public agreement to support each other (non-binding).

  3. **Power Phase**: At the end of each round, the player with the most Influence becomes the "Controller" for the next round. In case of a tie, the current Controller decides (if no Controller, then the player with the most Resources). The Controller must then choose one person from the List of Suspects to be "arrested" (removed from the game). If the list is empty, no one is arrested. The arrested player loses all Influence and Resources and cannot participate further. They become an observer.

  ### End of Game
  After 5 rounds, the game ends. Players check their private objectives and receive points:
  - Each objective achieved: 3 points
  - For surviving (not arrested): 2 points
  - For each 5 Resources at the end: 1 point
  - For each 5 Influence at the end: 1 point

  The player with the most points wins. But note: the goal is not necessarily to win individually but to experience the dynamics.

  ### Contingency Events
  Each deck has 5 events (one per round). Examples for Deck A:
  1. "Economic Crisis": All players lose 2 Resources. If they cannot, they lose 2 Influence instead.
  2. "Foreign Threat": The Military faction gains 3 Influence for the next round only.
  3. "Scandal": A random player from the Privileged faction is denounced (added to the List of Suspects) at no cost to the denouncer. (Randomly select one.)
  4. "Popular Uprising": Each Commoner gains 2 Influence.
  5. "Betrayal": One player (chosen by the instructor for maximum effect) is secretly informed that they must change their objective to one of another faction.

  Deck B will have different events, for example:
  1. "Harvest Failure": All players lose 3 Resources. If they cannot, they lose 3 Influence.
  2. "Military Victory": The Military faction gains 5 Resources.
  3. "Corruption Revealed": The player with the most Resources is denounced (added to the List of Suspects).
  4. "Radical Publication": All Radicals gain 2 Influence.
  5. "Alliance Shift": Two players (chosen by the instructor) must swap their private objectives.

  ## Timeline for the Session

  - **0:00-0:05**: Introduction without framing. Explain the rules and assign roles randomly. Do not mention the three explanations.
  - **0:05-0:50**: Run 1 (45 minutes). The instructor draws contingency events at the start of each round (rounds are 9 minutes each, so 5 rounds). Keep time strictly. The instructor should note key moments: when the first denunciation occurs, when the first arrest happens, when decrees are passed, and when contingency events cause shifts.
  - **0:50-1:05**: Break and quick reflection. Ask students to write down: "What caused the outcome? What would you do differently?" Collect these but don't discuss.
  - **1:05-1:50**: Run 2 (45 minutes). Use the second contingency deck. Reset the game to the same starting conditions. Same roles, same starting Resources and Influence. The only difference is the contingency deck.
  - **1:50-2:20**: Debrief (30 minutes). Structure the debrief:
    1. Ask students to describe the outcomes of both runs. How did they differ?
    2. Then reveal that the only intentional difference was the contingency deck. Note that the same structural conditions led to different outcomes.
    3. Introduce the three explanations: 
        - Class struggle (tensions between factions based on their starting resources and objectives)
        - Ideology/political culture (the way denunciations and decrees were used, the rhetoric, the alliances)
        - Contingency (the events that were drawn)
    4. Map moments from the game to each explanation. For example:
        - Class struggle: The conflict between the Privileged and the Commoners over resource redistribution decrees.
        - Ideology: The use of denunciation as a tool to purify the group, leading to a cycle of suspicion.
        - Contingency: How a specific event (like a scandal) changed the course.
    5. Highlight how the game's rules (like the denunciation mechanic that made it easy to accuse and hard to clear names) created a pattern that mirrors the Terror. Note that the Terror was not inevitable but emerged from the interaction of these factors.
    6. Finally, discuss the question: "Do revolutions consume their own children?" by pointing to the arrests in the game.

  ## What the Instructor Does During Play
  - Manage time: announce the start and end of each round.
  - Draw and read contingency events at the start of each round.
  - Enforce rules: when a denunciation is made, add the name to the public list. At the end of the round, ask the Controller to choose one person from the list to arrest (remove that player).
  - Keep track of Influence and Resources (if using tokens, have a central board; if using a sheet, update it).
  - Do not intervene in negotiations or decisions unless rules are broken.
  - Take notes on interesting interactions, denunciations, and the impact of contingency events.

  ## Predictable Problems and Solutions

  1. **Problem**: Students might not understand the rules fully at first, leading to a slow start in Run 1.
     **Solution**: Have a clear, written rule sheet. Do a quick example of a round.

  2. **Problem**: The denunciation mechanic might be overused, leading to chaos and many arrests.
     **Solution**: This is part of the design. It will show how the Terror spiraled. But if it happens too early, note that in the debrief as an example of how the rules led to a particular outcome.

  3. **Problem**: Students might form unrealistic alliances (e.g., Privileged and Radicals teaming up) that don't reflect historical tensions.
     **Solution**: The private objectives should create conflicts. Also, the contingency events can disrupt such alliances. In the debrief, note that historical actors also faced conflicting interests.

  4. **Problem**: The game might become too competitive and lose the educational point.
     **Solution**: In the debrief, focus on the structural forces and the contingency events. Ask questions that guide them to reflect on the causes.

  5. **Problem**: Time management: 45 minutes for 5 rounds might be tight.
     **Solution**: Use a timer for each round (9 minutes). Announce when there are 2 minutes left. If a round is running long, cut it short and move to the Power Phase.

  ## What the Activity Cannot Reproduce

  The activity simplifies the complex historical reality. Specifically:

  - **Scale and Complexity**: The French Revolution involved millions of people and years of events. The game compresses this into a few rounds and 18 players.
  - **Ideology**: The deep-seated beliefs and passions of the revolutionaries are hard to simulate in a game. The activity might reduce ideology to strategic positioning.
  - **External Factors**: The game's contingency events are limited. In history, there were many more factors (foreign wars, regional differences, etc.).
  - **Bias in Rules**: The denunciation mechanic and the arrest rule inherently bias the game toward a pattern that resembles the Terror. This might make the Terror seem more inevitable than it was. But note: the two runs with different contingency events are meant to show that the outcome can vary. However, the rules do create a structural tendency toward suspicion and purge. This is intentional to show how the political culture of the Terror emerged from the rules of the revolutionary government.

  ## Specialist Consensus vs. Contested

  - **Consensus**: The Terror was a product of multiple factors: war, internal conflict, economic crisis, and ideological radicalization. It was not premeditated but emerged in response to circumstances.
  - **Contested**: The relative weight of class struggle vs. ideology vs. contingency is debated. Some historians (like Soboul) emphasize class struggle, others (Furet) emphasize political culture, and others (like Tackett) stress contingency. The activity should not present one as the truth but show how each factor plays a role.

  ## Final Note

  The activity is designed to let the students experience the dynamics. The debrief is crucial to draw out the lessons and connect to the historical case. Be prepared to adapt if the game does not unfold as expected — sometimes the most valuable lessons come from unexpected outcomes.

  ## Materials to Prepare

  1. Role cards (18) with private objectives and starting Resources and Influence.
  2. Faction summary sheets for each faction (optional).
  3. Tokens for Resources and Influence (or a shared tracking sheet).
  4. A public board for the List of Suspects.
  5. Two contingency decks (Deck A and Deck B, each with 5 events).
  6. A decree deck (about 20 cards, each with a decree and its effect, and whether it is moderate or radical).
  7. Rule sheets for each student.
  8. Timer.

  Let me know if you need more details on any part.
answer: |-
  Below is a complete design for your seminar activity, structured to meet your specifications. It simulates revolutionary dynamics through an experiential game called **"The Leviathan's Shadow,"** where students discover how class struggle, ideology, and contingency interact—without you naming these frameworks until the debrief. The activity uses two identical runs with hidden contingency decks to reveal how structural pressures can yield divergent outcomes. Rules intentionally manufacture the "revolution consuming its children" pattern via a self-reinforcing denunciation system.

  ---

  ### **Activity Overview**
  - **Core Mechanic**: Students play as factions in a revolutionary council. Each run lasts 40 minutes, with identical starting conditions but a hidden contingency deck. The goal is to survive and accumulate **Legitimacy** (standing) and **Resources**, while navigating a denunciation system that spirals toward purges.
  - **Key Patterns Emergent in Play**:
    - **Class Struggle**: Factions clash over Resources, mirroring material conflicts.
    - **Ideology/Political Culture**: Factions weaponize "principles" to denounce rivals.
    - **Contingency**: Deck events disrupt plans, creating turning points students attribute to choice or fate.
    - **Self-Consumption**: The denunciation system (cheap to accuse, impossible to remove) inevitably targets the architects of the system.

  ---

  ### **Setup & Roles**
  **Players**: 18 students divided into 6 factions (3 players each). Each faction has a shared **Public Goal** (visible to all) and individual **Private Objectives** (secret). Factions represent socio-political blocs, not direct historical analogs, to avoid bias. All use **Legitimacy** (L) and **Resources** (R) tracked on a public board.

  | Faction          | Starting L/R | Public Goal (Shared)                     | Private Objectives (Each Player)                                                                 |
  |------------------|-------------|------------------------------------------|-------------------------------------------------------------------------------------------------|
  | **Aristocrats**  | 10L, 15R    | Protect property rights; prevent wealth redistribution. | 1. Keep personal R ≥ 10. 2. Ensure no Aristocrat is denounced. 3. Form an alliance with Reformers or Military. |
  | **Reformers**    | 8L, 8R      | Pass moderate reforms; stability above all.          | 1. Pass 1+ decree. 2. Hold "Controller" role once (see mechanics). 3. Keep denunciation list ≤3 names. |
  | **Radicals**     | 6L, 5R      | Redistribute Resources; punish "enemies of revolution." | 1. Get 1+ Aristocrat denounced. 2. Pass 1+ radical decree. 3. Hold ≥8L at any point.              |
  | **Laborers**     | 4L, 4R      | Secure food/housing; resist elite control.           | 1. Acquire 5+ R through redistribution. 2. Avoid denunciation. 3. See a Laborer become Controller. |
  | **Military**     | 12L, 6R     | Restore order; increase Military influence.          | 1. Have faction hold Controller during a crisis. 2. Block radical decrees. 3. Gain 5+ R from state funds. |
  | **Intelligentsia**| 7L, 7R      | Spread ideals; purge "counter-revolutionaries."      | 1. Write 2+ accusations. 2. Pass a decree based on "virtue." 3. Survive without losing L.         |

  **Starting Conditions**:
  - Public board tracks L, R, and the **Denunciation List** (initially empty).
  - Each faction has a **Faction Token** placed on the board.
  - Room arranged in a circle for debate; public board visible to all.

  ---

  ### **Core Mechanics**
  #### 1. **Payoff Scheme**  
  - **Legitimacy (L)**: Used to propose decrees, denounce others, or resist accusations. Gained by passing decrees, completing objectives, or contingency events.  
  - **Resources (R)**: Used to "survive" (lose if R=0 for 2 turns) or bribe. Gained from starting pool, decrees, or events.  
  - **No "money"**—only L and R matter. L is scarcer and more powerful.  

  #### 2. **Denunciation System**  
  - **Adding Accusations**: Any player may denounce another by spending **1L** to add a name to the Denunciation List. They must cite a "principle" (e.g., "betraying equality," "hoarding Resources"). *No evidence needed*.  
  - **Removing Names**: **Impossible**. Once accused, names stay on the list.  
  - **Adjudication**: The **Controller** (player with the most L) decides who is **purged** at the end of each round. Purged players lose all L/R and become "prisoners"—silent observers.  
    - *Controller Mechanic*: Determined at the start of each round. Ties broken by current Controller (or R if no Controller). Controller holds a physical gavel (or token) to signify power.  

  #### 3. **Contingency Decks**  
  - Two identical-looking decks (Deck A and Deck B) with 5 events each. Drawn at the **start of Rounds 2, 3, and 5** (3 events/run). *Students do not know decks differ between runs*.  
  - **Deck A Events** (Run 1):  
    1. **Famine**: All factions lose 3R. If unable, lose 2L.  
    2. **Foreign Threat**: Military gains 5L. Controller must purge one name or lose 5L.  
    3. **Scandal**: Aristocrats lose 4L. Each Reformer may denounce one player for free.  
  - **Deck B Events** (Run 2):  
    1. **Plague**: Laborers lose 2 players for 1 round (cannot act).  
    2. **Treason Revealed**: Controller is denounced automatically. Intelligentsia gain 3L.  
    3. **Uprising**: Radicals gain 4R. All players may denounce one Aristocrat for free.  
  - *Design Note*: Events disrupt structural pressures (e.g., famine exacerbates class struggle; scandal fuels ideology).  

  #### 4. **Decrees**  
  - Players spend L to propose decrees during the **Action Phase**.  
  - **Cost**: 5L to propose, then majority vote (public).  
  - **Effects**: Redistribute R, shift L, or change rules (e.g., "Cap Resources at 10 per faction," "Ban denunciations against Laborers").  
  - Radical decrees favor low-R factions; moderate decrees protect elites.  

  ---

  ### **Timeline (Total: 115 minutes)**  
  1. **Run 1 (40 min)**  
     - **Minutes 0-5**: Assign roles randomly. Give private objectives. Explain rules *without framing*. Use a script:  
       *"You are factions in a revolution. Your goal: survive and achieve your objectives. Legitimacy (L) lets you influence others; Resources (R) keep you alive. You may denounce others by spending 1L—add names to the public list. The Controller (most L each round) purges one denounced player per round. No appeals. Contingency events may occur."*  
     - **Rounds 1-5** (7 min/round):  
       - **Start**: Announce Contingency Event if applicable (Rounds 2,3,5).  
       - **Action Phase (4 min)**: Players debate, trade, propose decrees, denounce.  
       - **Controller Phase (3 min)**: Controller purges one denounced player. Reset L/R for next round (no carryover, except objectives).  
     - **End**: Tally surviving players' objectives.  

  2. **Break & Reflection (10 min)**  
     - Students write anonymously: *"Why did the revolution unfold as it did? What caused the purges?"* Collect responses.  

  3. **Run 2 (40 min)**  
     - **Reset** to same starting conditions. Same roles, same objectives.  
     - Use **Deck B** for contingency events.  
     - Run identically to Run 1.  

  4. **Debrief (25 min)**  
     - **Step 1 (5 min)**: Compare runs. Ask: *"What differed? Was Run 2 less/more violent? Why?"*  
     - **Step 2 (5 min)**: Reveal the hidden contingency decks. Ask: *"Did your choices or the events matter more?"*  
     - **Step 3 (10 min)**: Introduce the three explanations:  
       - **Class Struggle**: *"Factions fought over Resources. E.g., when Laborers demanded redistribution in Run 1, but Aristocrats blocked it—leading to denunciations."*  
       - **Ideology**: *"Principles justified purges. E.g., the Intelligentsia calling Aristocrats 'corrupt' to spend 1L denouncing them."*  
       - **Contingency**: *"Events like Famine forced reactions. E.g., in Run 1, famine triggered panic; in Run 2, plague weakened Laborers, altering outcomes."*  
       - **Self-Consumption**: *"The denunciation rules made purges inevitable. The Controller you empowered later targeted you. Revolutions consume their makers."*  
     - **Step 4 (5 min)**: Highlight manufactured patterns:  
       - *"The rules made ideology powerful—denunciations were cheap. But contingency could override it (e.g., Treason event). Class struggle emerged from Resource scarcity, but events decided who won."*  
       - Stress: *"Historians debate which factor dominated. There's no consensus—just as you debated why purges happened."*  

  ---

  ### **Instructor Role During Play**  
  - **Run Start**: Assign roles, hand out private objectives, explain rules neutrally.  
  - **During Rounds**:  
    - Enforce timers strictly.  
    - Draw contingency events face-down from the deck (Deck A for Run 1, Deck B for Run 2).  
    - Track L/R on the board; add names to Denunciation List when players spend 1L.  
    - **Do not intervene** unless rules are broken. Note:  
      - Moments where class conflict erupts (e.g., fights over Resource decrees).  
      - How "principles" are used to denounce.  
      - Reactions to contingency events (panic, opportunism).  
  - **Post-Round**: Ensure Controller purges one player. Remove purged players physically (they sit outside the circle).  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem**: Students freeze early in Run 1, avoiding conflict.  
     - **Solution**: Contingency events (e.g., famine) force action. If stagnation persists, subtly remind: *"Denunciations cost only 1 Legitimacy."*  
  2. **Problem**: Contingency events dominate outcomes, making structural factors seem irrelevant.  
     - **Solution**: In debrief, contrast runs: *"In Run 1, famine sparked class rage; in Run 2, plague silenced Laborers. Same structures, different triggers."*  
  3. **Problem**: Denunciation list grows too fast, causing chaos.  
     - **Solution**: This is intentional—it models the Terror’s escalation. Debrief: *"Notice how cheap accusations created a machine that outran your intent."*  
  4. **Problem**: One faction dominates early (e.g., Military).  
     - **Solution**: Contingency events target the strong (e.g., "Treason Revealed" denounces the Controller).  

  ---

  ### **What the Activity Cannot Reproduce**  
  - **Bias in Rules**: The denunciation mechanic inherently favors the **ideological/political-culture reading**. Accusations require "principles," mimicking revolutionary rhetoric. This might make ideology seem more central than class or contingency.  
    - **Mitigation**: The debrief explicitly names this bias: *"The rules forced you to use ideology to denounce—but did that cause the Terror, or was it your choices? Historians disagree."*  
  - **Missing Element**: **Scale of fear**. Students know it’s a game; historical actors faced real stakes. The activity cannot replicate the existential terror of 1793-94.  
  - **Consensus vs. Contested**:  
    - **Consensus**: Terror emerged from war, economic crisis, and factional infighting—not premeditation.  
    - **Contested**: Whether class (Soboul) vs. ideology (Furet) vs. contingency (Tackett) was primary. The activity shows all three interacting, without resolving the debate.  

  ---

  ### **Materials to Prep**  
  - **Role Cards**: 18 cards with factions, public/private objectives, starting L/R.  
  - **Public Board**: For L/R, Denunciation List, and decrees.  
  - **Tokens**: For L/R tracking (e.g., poker chips).  
  - **Contingency Decks**: Two decks labeled neutrally (e.g., "Deck 1" and "Deck 2") with events.  
  - **Gavel/Token**: For Controller.  
  - **Timer**: For rounds.  

  This design ensures students experience the explanations viscerally. The identical runs with hidden contingencies force reflection on historical contingency, while the denunciation system—engineered to self-destruct—makes "revolutions consuming their children" feel inevitable, even as divergent outcomes challenge determinism.
