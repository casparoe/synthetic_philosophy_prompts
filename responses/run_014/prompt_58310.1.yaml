  ### Decision Tree for Prioritizing Reductions in Astronomical Suffering Risks  
  *Shared starting point: Future technologically created minds (digital or biological) are at least possible. Answer each question based on your core commitments, not labels. Test cases illustrate real choices.*  

  ---

  #### **Question 1: Is the concept of "s-risks" (astronomical suffering in future sentient minds) coherent and decision-relevant?**  
  *Test case: A project proposes modeling long-term AI governance to prevent torture-like experiences in digital minds. Skeptics call it science fiction.*  
  - **No** → **Leaf: Skeptic**  
    *Stance: Denies coherence/relevance of s-risks. Focuses on near-term, observable problems.*  
  - **Yes** → Proceed to Question 2.  

  #### **Question 2: Would suffering in *sentient* digital minds (e.g., AIs with aversive signals) matter morally?**  
  *Test case: Pausing AI training runs using punishment-like reward signals, due to sentience concerns.*  
  - **No** → Proceed to Question 7.  
  - **Yes** → Proceed to Question 3.  

  #### **Question 3: Is reducing large-scale *future* suffering tractable enough to outweigh near-term animal welfare?**  
  *Test case: Choosing between funding a far-future AI-safety project vs. a present-day shrimp-welfare campaign.*  
  - **No** → **Leaf: Near-term suffering-focused**  
    *Stance: Prioritizes tractable near-term work (e.g., factory farms). Skeptical of speculative futures.*  
  - **Yes** → Proceed to Question 4.  

  #### **Question 4: Will future tech abundance *automatically* prevent suffering without targeted effort?**  
  *Test case: Advocating for economic growth over direct s-risk interventions, assuming abundance solves everything.*  
  - **Yes** → **Leaf: Technology-led optimist**  
    *Stance: Believes future wealth/tech will dissolve suffering risks. Opposes dedicated s-risk efforts.*  
  - **No** → Proceed to Question 5.  

  #### **Question 5: Does preventing severe suffering have *lexical priority* over promoting happiness?**  
  *Test case: Halting an insect-brain-emulation project for pest control (may create suffering) despite ecological benefits.*  
  - **No** → **Leaf: Broader impartial welfarist**  
    *Stance: Weighs s-risks alongside other goods (e.g., happiness, extinction risks). Supports balanced longtermism.*  
  - **Yes** → Proceed to Question 6.  

  #### **Question 6: Is s-risk reduction so tractable it should dominate other longtermist goals?**  
  *Test case: Prioritizing "humane AI architecture" research over AI-alignment work aimed at preserving civilization.*  
  - **Yes** → **Leaf: S-risk minimizer**  
    *Stance: Focuses on minimizing s-risks, even at cost to other longtermist aims (e.g., existential risk reduction).*  
  - **No** → **Unexplored position**  
    *Diagnosis: Rare in practice—may reflect doubts about tractability despite lexical priority.*  

  #### **Question 7 (if Q2=No): Should we prioritize reducing suffering in *near-term* minds (e.g., animals)?**  
  *Test case: Funding insect welfare reforms today over speculative future-risk projects.*  
  - **Yes** → **Leaf: Near-term suffering-focused**  
    *Stance: Focuses on tangible near-term suffering. Dismisses digital minds’ moral weight.*  
  - **No** → Proceed to Question 4. *(If Q7=No and Q4=Yes → Technology-led optimist; if Q4=No → Unexplored position)*  

  ---

  ### **Leaf Summary**  
  1. **S-risk minimizer**: Lexical priority for suffering + future tractable + s-risks > other longtermism.  
  2. **Broader impartial welfarist**: Future tractable + no lexical priority. Weighs s-risks alongside flourishing.  
  3. **Near-term suffering-focused**: Prioritizes near-term tractability (animal welfare) over futures.  
  4. **Technology-led optimist**: Believes future abundance solves suffering; opposes dedicated interventions.  
  5. **Skeptic**: Rejects s-risk framing as incoherent/irrelevant.  

  ### **Unexplored Positions & Limitations**  
  - **If Q2=No, Q7=No, Q4=No**: *Diagnosis:* "Not suffering-focused." Rare in EA/rationalist circles; may reflect incoherence or unattractiveness in this context.  
  - **If Q5=Yes but Q6=No**: *Diagnosis:* "Lexical priority but low tractability." Rare—usually lexical prioritizers assume tractability.  
  - **Limitation**: This tree cannot distinguish "strong longtermists" from "strong near-termists" without tractability judgments (Q3/Q7). It also conflates *digital vs. biological* minds if moral relevance (Q2) is answered uniformly.  

  ### **How to Use**  
  1. Answer questions sequentially.  
  2. Match your leaf to substantive stances in discussions.  
  3. Identifies gaps: Unexplored positions signal inconsistencies or niche views.  

