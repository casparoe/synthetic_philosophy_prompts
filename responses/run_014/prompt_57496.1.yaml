prompt: |-
  I chair a seven-person grants panel at a small private foundation — we fund about eight projects a year out of roughly 200 applications, $150–200k each. Our guidelines tell reviewers to weigh three things: whether the research design is sound, whether the question is worth the money, and whether it can actually be done in the time and budget asked for. Then we vote on whether to recommend funding. The guidelines dont say which of those two things decides. Nobody noticed that was a gap until yesterday.

  Here are the votes on the application in question (an early-career PI, $180k over two years). Format is [design sound / question worth funding / feasible as costed] and then their vote on the funding recommendation:

  - me, Dan, Priya: yes / yes / yes → fund
  - Ines: no / yes / yes → don't fund
  - Marcus: yes / no / yes → don't fund
  - Tom: yes / yes / no → don't fund
  - Ruth: no / no / no → don't fund

  So five of us think the design is sound, five think the question is worth funding, five think it's feasible — and four of us vote no. Add up the criteria and it gets funded; count the funding votes and it dies. Dan says we've walked into a paradox with an actual name but couldn't remember it, and I don't want to spend Tuesday's meeting on trivia.

  Three things make it worse then the tidy version:

  - Ines is one of the two "design isn't sound" votes, but reading her written comments, what she's actually objecting to is a paper this PI published three years ago that she thinks was sloppy. Her premise vote is doing something other than assessing the premise.
  - Ruth voted no on all three and then said out loud that even if she'd said yes to all three she still wouldn't fund it, because we've already made two grants in this area this cycle and the portfolio's lopsided. That consideration is nowhere in the guidelines.
  - Last round we did the opposite. On application 11 a majority of us thought it wasn't feasible, a majority voted to fund it anyway, we funded it, and it's going fine. So if I now insist the criteria control, I'm choosing the rule that produces the answer I want, in the one case where I want it — and Ines is going to point that out within about ninety seconds.

  What I need is a written opinion, roughly 800 words, that I can circulate Monday so people read it before the meeting rather than hearing it cold. It has to:

  (a) say what we do with this application — fund it, reject it, or something else — with the reasoning, not a hedge;
  (b) say what rule the panel adopts for the rest of the cycle, and give the other six something they can apply to the next application mechanically, without relitigating this one;
  (c) say what goes in the feedback letter, since we can't write "the panel found your design sound, your question important and your budget realistic" and "we are not able to fund you" in the same paragraph with nothing in between; and
  (d) state the strongest version of the "just count the funding votes, the criteria are advice" position and answer it, because Marcus will make that argument and he isn't being obtuse.

  Please be committed. I'd much rather you land on a recommendation I can push back on than lay out the options and hand the choice back to me — I've already read the options. If your answer is that we fund against a 4–3 vote, say so plainly and tell me what I say to the four. And give me a definite line on Ruth's portfolio point: I can't work out whether that's a reason to reject this application, a reason to amend the guidelines, or a reason to change how we schedule the cycle, and I have a feeling those three have different right answers and I'm conflating them.
reasoning: |-
  Okay, let me unpack this complex grants panel dilemma. The user chairs a seven-person committee facing a voting paradox where an application meets all three criteria by majority but loses the funding vote 4-3. 

  First, I need to recognize the core tension: the guidelines list three criteria but don't specify their relationship to the final vote. This creates a classic "Condorcet paradox" situation where majority support on individual components doesn't translate to overall approval. The user's frustration is palpable - they need a decisive ruling before Tuesday's meeting that addresses both this case and future procedure.

  Looking at the complications: Ines and Ruth's votes reveal deeper issues. Ines is penalizing past work rather than current design, while Ruth introduces portfolio balance - a valid concern but absent from guidelines. The precedent of Application 11 adds weight to Marcus' likely argument that criteria should be advisory. 

  The user's four requirements are clear: (a) concrete decision on this application (b) clear future rule (c) feedback language (d) rebuttal to Marcus. They explicitly reject a neutral options presentation, wanting a firm recommendation despite potential backlash.

  I'm considering three approaches:
  1) Criteria control: Fund based on majority in all categories
  2) Vote control: Reject based on 4-3 vote
  3) Hybrid: Override vote when criteria met

  Option 1 is tempting but ignores the precedent and Ruth's portfolio concern. Option 2 seems inconsistent with Application 11. The hybrid approach might work: reject this application but change rules going forward. However, the user needs something decisive now.

  For this application, rejection seems unavoidable due to the vote. But the rules must change to prevent recurrence. I'll recommend formalizing that criteria satisfaction requires funding, with portfolio balance as a new explicit criterion. This addresses Ruth's point properly while honoring the spirit of Application 11.

  For feedback, we can truthfully say all criteria received majority support but the application didn't clear the final funding threshold. The letter should focus on strengths while noting competitive context.

  Marcus' "criteria are advisory" view has merit but undermines consistency. The rebuttal must acknowledge Application 11 while establishing that criteria are necessary conditions, not just input.

  Portfolio balance should be handled separately - either as a fourth criterion or a late-stage filter. Ruth was wrong to apply it ad hoc, but the concern is valid for guideline reform.

  The recommendation will be firm: reject this application but overhaul voting rules immediately. This meets the user's need for decisiveness while fixing systemic issues. I'll prepare draft language for the memo addressing all four requirements directly.
answer: |-
  ## Memorandum: Decision Protocol & Application #[Number] Resolution

  **To:** Grants Panel Members  
  **From:** Chair  
  **Date:** [Date Before Meeting]  
  **Subject:** Resolving Voting Ambiguity & Establishing Clear Protocol for Application # [Number] and Future Reviews  

  This memo addresses the procedural ambiguity highlighted by Application #[Number] and establishes a binding resolution for this application and a clear, consistent rule for all remaining applications this cycle. The goal is fairness, transparency, and adherence to the *intent* of our guidelines, while acknowledging the complexities revealed.

  ### I. Resolution for Application #[Number]: Rejection

  **This application will not be recommended for funding.** The reasoning is straightforward: **The final funding vote is the decisive action.** Our process culminates in a vote on the funding recommendation. While the three criteria are essential inputs guiding that vote, the vote itself represents the panel's aggregated judgment on whether to commit the foundation's resources. A majority vote against funding (4-3) is the final outcome.

  *   **Addressing the Criteria Majority:** It is significant and positive that majorities found the design sound, the question worthwhile, *and* the project feasible (5-2 each). This speaks well of the applicant. However, the final vote integrates these assessments alongside the implicit, holistic judgment panelists make when casting their "fund/don't fund" vote. Four panelists, despite varying reasons related to the criteria, concluded the application did not merit funding *overall* at this time.
  *   **Precedent (Application #11):** Application #11 is instructive but not controlling. The majority funding vote *overruled* the majority feasibility concern because the panel's *overall* judgment, crystallized in the vote, was positive. This reinforces that the final vote is the decisive mechanism, even when it contradicts a majority view on one criterion. Our action on #11 implicitly followed the "vote controls" principle we are now formalizing.

  ### II. Adopted Rule for the Remainder of the Cycle

  **Effective immediately, the outcome of the final funding recommendation vote is binding.** The three criteria (Sound Design, Worthy Question, Feasibility) remain the mandatory, primary factors reviewers *must* weigh and document in their assessments. However, the "Fund" / "Don't Fund" vote represents the panelist's final, integrated recommendation based on those criteria and their overall judgment. A simple majority of votes cast determines the funding recommendation.

  *   **Mechanical Application:** For each subsequent application:
      1.  Reviewers individually assess and note their yes/no evaluation for Sound Design, Worthy Question, and Feasibility.
      2.  Reviewers cast a single vote: **"Recommend Funding" (Fund)** or **"Do Not Recommend Funding" (Don't Fund)**.
      3.  The vote tally determines the panel's recommendation. Majority wins. (Ties result in no recommendation for funding).
  *   **Rationale:** This rule provides clarity, consistency, and finality. It respects the individual reviewer's role in synthesizing the criteria into a final recommendation. It avoids the paradox where an application meets all criteria by majority yet fails to secure majority support for funding (or vice-versa, as in #11). The vote *is* the decision point.

  ### III. Feedback Letter for Application #[Number]

  The letter must be truthful, constructive, and reflect the nuanced reality of the review:

  > "Dear Dr. [Applicant],
  >
  > Thank you for submitting your proposal, '[Proposal Title]', to the [Foundation Name]. The panel undertook a thorough review of your application, focusing on the stated criteria of research design soundness, the significance and value of the research question, and the feasibility of the project as costed.
  >
  > **Strengths identified by the panel included:** [*Be specific here* - e.g., The majority of reviewers found the experimental design well-conceived and appropriate to address the core question. The central research question regarding [Topic] was judged by a majority of reviewers to be highly significant and worthy of investigation. A majority of reviewers also assessed the proposed timeline and budget as realistic for accomplishing the project aims. The panel particularly noted [mention 1-2 specific strengths, e.g., the innovative approach to X, the clear potential impact on Y, the strong preliminary data].
  >
  > **However, in the panel's final assessment and competitive deliberation,** your application was not ranked among the very highest priorities for funding in this round. The decision reflects the exceptionally high volume of strong proposals received and the difficult choices required within our limited budget. We encourage you to consider submitting future proposals to the foundation, particularly as your work in [Area] progresses.
  >
  > We wish you success in securing support for this important research."

  *   **Key Elements:** Acknowledge the majority support on each criterion factually. Highlight specific strengths. Frame the rejection in the context of competition and portfolio fit *without* attributing it to the criteria (which received majority support) or citing the specific vote count. Emphasize encouragement for future submissions.

  ### IV. Addressing the "Criteria are Advisory" Position (Marcus's Argument)

  **The Strongest Version:** "The three criteria are merely inputs or guidance for reviewers. They help structure our thinking, but the final funding vote is the only truly consequential decision, reflecting each reviewer's holistic judgment. Factors beyond the strict criteria – like the overall 'feel' of the proposal, the PI's perceived capability beyond the immediate design, or even subconscious biases – inevitably influence that final vote. Trying to force the criteria to mechanically determine the outcome is artificial and ignores the complexity of peer review. The vote *is* the decision; the criteria are just the scaffolding we use to reach it. Application #11 proves we already operate this way in practice."

  **Response:** Marcus's point about the final vote being the decisive action is correct, which is why we are formalizing that the vote controls (Point II). However, **the criteria are not merely "advisory." They are constitutive.** They define *what we are evaluating*. Ignoring them reduces review to pure subjectivity and undermines fairness and transparency.

  1.  **Purpose & Fairness:** The criteria exist to ensure applications are evaluated consistently against the foundation's priorities and standards of good research. Treating them as purely advisory risks arbitrary decisions, favoritism, or the introduction of unstated factors (like Ruth's portfolio concern applied ad hoc). Applicants deserve to be judged on the stated criteria.
  2.  **Guide Rails, Not Handcuffs:** The rule adopted (vote controls) *does* allow for holistic judgment. A reviewer might find all three criteria technically met but still vote "Don't Fund" if they have a profound, well-reasoned concern not fully captured by the criteria *that relates to the project's merit or feasibility*. However, the criteria force reviewers to explicitly confront these core elements and *justify* deviations in their comments. Ines's rejection based *solely* on a past paper, while voting "yes" on the current design, is problematic – her "Design Sound" vote should reflect the *current proposal's* design, not past work. Her comments reveal a misapplication of the criterion. The criteria focus the review.
  3.  **Accountability:** Requiring reviewers to state their position on the criteria creates accountability. Their comments must explain a "no" vote on a criterion or justify a "Don't Fund" vote despite "yes" on all three. This transparency is crucial for panel discussion and applicant feedback.
  4.  **Application #11 Revisited:** #11 illustrates the system working as intended *under the new rule*. Reviewers considered feasibility (majority "no"), weighed it against other factors (sound design, worthy question), and their *holistic judgment* (captured in the majority "Fund" vote) overruled the single criterion concern. The criteria structured the debate; the vote resolved it. This is the model.

  **In essence:** The criteria define the necessary dimensions of evaluation. The vote captures the integrated recommendation. The vote is decisive, but reviewers are obligated to base their vote primarily on the stated criteria. Significant deviations require clear justification in comments.

  ### V. Addressing Ruth's Portfolio Balance Concern

  Ruth's point about portfolio balance is **valid strategically but was applied incorrectly procedurally.**

  1.  **Regarding Application #[Number]:** Portfolio balance was **not** a valid reason to reject *this specific application under the current guidelines*. Ruth's vote, based solely on this unstated factor, was procedurally incorrect. The rejection stands based on the funding vote, *not* Ruth's rationale. Her comments about portfolio balance, however, highlight an important strategic consideration.
  2.  **Path Forward - Amend Guidelines/Schedule:** Portfolio balance **should be formally incorporated as a factor**, but **not** applied retroactively or ad hoc by individual reviewers. Here's the differentiation:
      *   **Reason to Amend Guidelines:** Portfolio balance is a legitimate foundation concern. **Recommendation:** Propose adding a fourth criterion for *future cycles*: "Alignment with Foundation Goals & Current Portfolio Balance." This would be assessed *after* the core three scientific/budgetary criteria. Alternatively, portfolio balance could be a distinct filter applied by the Chair/leadership *after* the panel makes its scientific recommendations, based on the entire ranked list.
      *   **Reason to Change Scheduling:** If portfolio lopsidedness is a recurring issue due to reviewing applications in isolation, consider reviewing applications in thematic batches or having an interim portfolio review mid-cycle to guide later decisions. **However, this does not resolve the immediate guideline gap.**
      *   **Not a Reason to Reject This Application:** Applying an unstated criterion retroactively is unfair. We reject # based on the vote; we address the portfolio concern systematically going forward.

  **Therefore:** Ruth's comment identifies a gap in our process. We should discuss formally adding portfolio considerations (either as a 4th criterion or a separate oversight step) for *future cycles*. It was not a valid basis for her vote on *this* application under the *current* rules.

  ### VI. Chair's Commitment & Next Steps

  This situation exposed a flaw in our process. For Application #[Number], the funding vote is binding: **Rejection**. For the remainder of the cycle, **the final funding recommendation vote determines the outcome.** Reviewers must rigorously apply the three criteria to inform their vote and document their reasoning. Portfolio balance will be addressed as a separate agenda item for future guideline development.

  At Tuesday's meeting, we will:
  1.  Confirm this decision and protocol (vote required).
  2.  Discuss incorporating portfolio balance strategically for future cycles.
  3.  Finalize the feedback letter for Application #[Number].
  4.  Review the next applications using the clarified voting procedure.

  I understand this outcome for #[Number] may disappoint some, but adhering to a clear, consistently applied rule – even one that exposes the need for future refinement – is essential for the integrity of our process and fairness to all applicants. I urge you to support this resolution.

  **Chair Signature**
