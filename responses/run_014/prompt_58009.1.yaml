answer: |-
  Here’s a decision tree that meets your requirements: **6 yes/no questions**, no jargon, starts from the heart consensus, uses your three cases, and sorts into the five views based on concrete answers. I’ll first outline the logical space, then build the tree, noting gaps and limitations.

  ---

  ### **Decision Tree**
  *Start here for all users (begin with the heart consensus):*  
  1. **When we say "hearts are **for** pumping blood," do you think this is a real, objective fact (not just useful shorthand)?**  
     - **No** → Eliminativist view (rejects function as a real concept).  
     - **Yes** → Go to Q2.  

  2. **The synthetic *E. coli* (designed last month, no evolutionary history) detects arsenic perfectly. Is detecting arsenic its **function**?**  
     - **No** → Go to Q3.  
     - **Yes** → Go to Q4.  

  3. **The rabbit’s new gut mutation (first of its kind, not selected yet) helps it digest pesticide. Is digesting pesticide its **function**?**  
     - **No** → Go to Q5.  
     - **Yes** → Go to Q6.  

  4. **Human goosebumps (vestigial, do nothing now) — do they still have a **function**?**  
     - **No** → Go to Q5.  
     - **Yes** → Pluralist view (functions include both history and current contributions).  

  5. **If a vestigial trait (like goosebumps) gets co-opted for something new (e.g., signaling mood) but hasn’t been selected for it yet, is the **new job** its function?**  
     - **No** → Strict history-only view (function is only what was selected for).  
     - **Yes** → Current-contribution view (function is only what it does now).  

  6. **A car’s alternator charges the battery to power the engine — is this a **function** in the same biological sense?**  
     - **No** → Organizational closure view (function requires self-maintaining organization).  
     - **Yes** → Current-contribution view (function is only what it does now).  

  ---

  ### **How Views Map to Paths**
  - **Strict history-only**: Q1=Yes → Q2=No → Q3=No → Q5=No  
    *(Hearts have functions, but synthetic/rabbit/co-opted traits don’t; vestigial traits might retain historical function)*.  
  - **Current-contribution**: Q1=Yes → [Q2=No → Q3=Yes → Q6=Yes] **OR** [Q2=Yes → Q4=No → Q5=Yes]  
    *(Functions arise from current utility, regardless of history: synthetic/rabbit/co-opted traits all have functions; vestigial traits do not)*.  
  - **Organizational closure**: Q1=Yes → Q2=No → Q3=Yes → Q6=No  
    *(Functions only in self-sustaining systems: rabbit mutation has function, car parts do not)*.  
  - **Pluralist**: Q1=Yes → Q2=Yes → Q4=Yes  
    *(All traits can have functions from history or current role: vestigial traits retain historical function)*.  
  - **Eliminativist**: Q1=No  
    *(Hearts don’t objectively "have functions" — it’s just useful talk)*.  

  ---

  ### **Cases Used in the Tree**
  - **Synthetic *E. coli***: Q2 (tests if design/history matters).  
  - **Rabbit mutation**: Q3 (tests if new, unselected traits can have functions).  
  - **Vestigial trait (goosebumps)**: Q4 (tests if historical functions persist).  
  - **Co-opted trait**: Q5 (tests if new utility overrides history).  
  - **Car alternator (added case)**: Q6 (distinguishes organizational closure from current-contribution).  

  > **Why the car?**  
  > Organizational closure views restrict functions to **self-maintaining systems** (e.g., organisms). The car (a non-self-maintaining artifact) tests this. Bio undergrads grasp this intuitively — and it avoids jargon.

  ---

  ### **Gaps and Limitations**
  1. **Unoccupied paths**:  
     - **Q1=Yes → Q2=No → Q3=No → Q5=Yes**: Believes hearts/synthetic/rabbit lack functions, but co-opted traits *do*. Incoherent — rejects current utility for rabbit but accepts it for co-opted traits.  
     - **Q1=Yes → Q2=Yes → Q4=No → Q5=No**: Believes synthetic *E. coli* has a function but vestigial/co-opted traits don’t. Unexplored — might reflect "design-only" views (rare in bio-philosophy).  

  2. **Views the tree *can’t* fully separate**:  
     - **Current-contribution vs. organizational closure**: They agree on all cases *except non-living systems* (Q6). The tree separates them cleanly there.  
     - **Pluralist vs. organizational closure**: Pluralists accept vestigial functions (Q4=Yes); organizational closure does not (Q4=No). The tree distinguishes them.  

  3. **Edge cases not covered**:  
     - Traits with *both* historical and current utility (e.g., bird feathers for insulation and flight). The tree handles this via pluralism (Q4=Yes).  
     - "Swamp rabbit" (spontaneously formed rabbit with no evolutionary history). Not included — too niche for undergrads.  

  ---

  ### **Why This Works**
  - **No jargon**: Questions use concrete cases (e.g., "does the *E. coli* have a function?").  
  - **Logical flow**: Starts simple (hearts), escalates to edge cases (synthetic/rabbit/vestigial).  
  - **Efficient**: 5–6 questions, covers all target views.  
  - **Pedagogical**: Mirrors real debates — students "discover" their view through cases, not labels.  

  Test it with your group! If answers don’t fit a leaf, they’re likely hybrid views (e.g., "history + organization") — great discussion fodder.
