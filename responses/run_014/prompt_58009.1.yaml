          Any other combination -> "Your view is not among the standard ones covered by this tree. You might hold a mixed view or a less common theory."

    But then we miss the organizational closure view if they answer differently on the vestigial trait? But we assumed they answer (Y,Y,N,Y). That's our assumption.

    And the current-contribution view is captured in (Y,Y,N,Y) and then Q5=yes.

    Now, is there a combination that fits organizational closure that is not (Y,Y,N,Y)? Probably not, because they would say yes to synthetic, yes to rabbit, no to vestigial, yes to co-opted.

    And pluralist is (Y,Y,Y,Y).

    And SE is (N,N,Y,N).

    And eliminativist is Q0=no.

    What about if someone answers (Y,Y,N,N)? That would be: 
        synthetic: yes, rabbit: yes, vestigial: no, co-opted: no.

    This might be a view that only the effects that are selected or designed count, but not new beneficial effects? But then why yes to rabbit? The rabbit mutation is new and not selected. So they might be inconsistent.

