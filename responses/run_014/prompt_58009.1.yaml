        Q2: no (rabbit mutation does not)
        Q3: yes (vestigial has function)
        Q4: yes (co-opted has the new function)

    Why would they accept the synthetic and the vestigial and co-opted, but not the rabbit? Maybe they require either design or history, but not a new mutation without selection? So they might be a design/history view? Then they would also say no to the co-opted if it's not selected? But in Q4 they say yes? This is inconsistent.

    Given the complexity, we can assign the known combinations and leave the rest as "other views".

    But we only have five leaves, so we have to cover only those five.

