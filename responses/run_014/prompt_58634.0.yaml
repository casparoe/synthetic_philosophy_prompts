prompt: |-
  I chair a university examinations panel that adjudicates requests for cognitive accommodations, roughly thirty to forty cases per term. The stakes are significant: we must preserve fairness across closed-book assessments while avoiding discrimination against students whose effective memory and reasoning depend on external resources. Administrators who will first apply any framework have no training in philosophy, have about twenty minutes per case, and must produce a documented rationale for my final sign-off.

  Please develop a reusable decision procedure grounded in the extended mind thesis for determining when an external resource should be treated as constitutive of a student's cognitive process rather than as a mere aid or potential source of unfair advantage. The procedure should translate the central philosophical distinctions into terms a non-specialist can apply, including the parity consideration that an external process that plays the functional role we would count as cognitive if performed in the head should presumptively count as cognitive, the further conditions often discussed concerning stable availability, typical reliance, automatic endorsement without routine critical vetting, and ready accessibility, the concern that mere causal coupling is not constitution, and the distinction between an external resource that replaces an internal capacity and one that complements it by doing something different.

  Deliver the framework as an ordered checklist or flowchart in words, with the questions to ask in sequence, what counts as a sufficient answer to each, where the procedure terminates in a denial, where it terminates in a grant, and where it requires escalation to individual judgment because the issue turns on values or underdetermined concepts rather than observable facts. Mark explicitly which steps involve unavoidable judgment calls and which distinctions from the philosophical debate you have simplified or set aside to gain usability, with a brief justification for each simplification. Conclude with an honest statement of what the procedure cannot settle and where it is most likely to misfire.

  Then demonstrate the procedure on three cases:

  A second-year biology student with a documented working-memory limitation who has carried the same paper notebook for four years, containing densely cross-referenced diagrams in her own shorthand, consulted reflexively many times per day and relied upon for recall of material she cannot otherwise retain, who requests to bring it into a closed-book examination.

  A first-year law student who relies dozens of times per day on a commercial AI assistant trained on his own notes and accessed by phone, whose summaries he generally acts on after a brief skim but which periodically invents authorities, so that he has learned to verify citations before filing any work, who requests exam access to a locked-down version of the assistant.

  An engineering student without a diagnosed impairment who uses augmented-reality glasses that overlay standard formulae and stepwise prompts authored collaboratively with her study group, used fluently when connectivity permits but unavailable in some campus buildings and routinely double-checked against her own calculations, who requests to wear the glasses in examinations as an accommodation.

  Work through each case stepwise under your procedure to a determinate recommendation, even where the recommendation will be unwelcome to the panel, for example by requiring us to permit something we would prefer to ban or to deny something we would prefer to allow, and explain why the unwelcome result follows.
reasoning: |-
  Hmm, the user chairs a university examinations panel that handles cognitive accommodation requests. They need a practical decision framework based on the extended mind thesis for non-specialists. The framework must translate complex philosophical concepts into an actionable checklist or flowchart, with clear termination points and awareness of its limitations. They also want three case demonstrations showing how it works even when producing counterintuitive outcomes.

  I recall the extended mind thesis by Clark and Chalmers suggests that external resources can be part of one's cognitive system if they function like internal processes. Key criteria include parity (if it were in the head, we'd call it cognitive), constancy, reliability, automatic endorsement, and immediate accessibility. The challenge is making this operational for administrators with no philosophy background and only 20 minutes per case.

  For the framework design, I'll need to sequence questions logically: start with parity, then check availability/reliability, automatic endorsement, and accessibility. I should include termination points - clear grant/denial outcomes where possible, and escalation flags for value judgments. Each step must specify what constitutes sufficient evidence, using observable behaviors rather than abstract concepts. 

  Crucial simplifications I'll need to make: I'll collapse "typical reliance" and "stable availability" into one practical question about usage patterns. I'll treat "causal coupling vs constitution" through the lens of functional equivalence. The replacement/complement distinction will be framed as whether the resource does something the student fundamentally cannot do internally. These trade theoretical nuance for applicability.

  The framework should acknowledge its own limits: it can't resolve debates about what "should" count as cognitive in borderline cases, or handle novel technologies perfectly. It'll likely misfire when resources are partially reliable or when accessibility is inconsistent - exactly like the AR glasses case later.

  For the case demonstrations: 
  - The biology student's notebook seems to clearly meet all criteria: constant use, automatic reliance, etc. Grant. 
  - The law student's AI fails on automatic endorsement due to necessary verification, so denial despite other matching criteria. 
  - The engineering student's AR glasses fail on both accessibility (dead zones) and automatic endorsement (routine checking), so denial - even though we might want to accommodate her.

  I'll present this as a numbered decision tree with explicit grant/denial/escalation points, then walk through each case step-by-step. The unwelcome outcomes are instructive: they show the framework working as designed, preventing bias toward either over-accommodation or unfair restriction. In the conclusion, I'll emphasize that this tool makes implicit values explicit but can't eliminate judgment entirely - especially when societal norms about cognition clash with individual needs.
answer: |-
  Here is a reusable decision procedure grounded in the Extended Mind Thesis (EMT), designed for non-specialist administrators. It prioritizes functional equivalence, observable behavior, and key EMT criteria, while acknowledging necessary simplifications.

  **The Extended Mind Accommodation Framework (EMAF)**

  **Core Principle (For Administrator Context):** If a student *routinely and automatically* uses an external resource *as if it were part of their own mind* for core cognitive tasks (like remembering, reasoning) in their daily academic life, and it meets specific stability/reliability criteria, it may be unfair to deny access during an exam testing those *same* functions, even if the exam is normally "closed-book." Banning it might be akin to asking another student to take the exam without part of their biological memory/brain.

  **Simplifications & Justifications:**
  1.  **Collapsing "Typical Reliance" & "Stable Availability":** Combined into "Routine Integration." Distinction is subtle; observable integration patterns matter more than theoretical separation for this context.
  2.  **"Automatic Endorsment" Focus:** Prioritizes *lack of critical vetting* over deeper debates about implicit endorsement. Observable behavior (do they check?) is key evidence.
  3.  **"Causal Coupling vs. Constitution":** Simplified into functional equivalence (Parity Principle) + stability/reliability. If it walks/talks like a cognitive process *for this user*, we treat it as such constitutionally *for accommodation purposes*. Deep metaphysics set aside.
  4.  **Replacement vs. Complement:** Simplified into "Functional Need." Does the resource primarily do *what the student cannot do internally* (replacement/constitutive) or *enhance what they can already do* (complementary/aid)? Focuses on the core deficit/purpose for accommodation.
  5.  **"Ready Accessibility":** Interpreted practically as "Consistent Availability in Relevant Contexts." We don't require 100% universal access, but sufficient consistency for the resource to be a reliable part of their cognitive ecology.

  **Unavoidable Judgment Calls (Marked (J)):** Assessing the *degree* of routine integration, automaticity, and functional need inevitably involves some interpretation of evidence and context.

  **The EMAF Checklist (Sequential Questions):**

  1.  **Functional Parity & Core Use:** Does the requested resource serve a core cognitive function (e.g., recall of facts/procedures, reasoning steps) for this student *in their standard academic work*, and would we consider that function "cognitive" if performed internally (e.g., biological memory)?
      *   *Sufficient Answer:* Yes, detailed in documentation (e.g., psych ed report, personal statement) and observable practice (e.g., how they use it in class/study). *Denial if No.* (e.g., requesting a full textbook for general reference).
      *   *Termination:* **DENY** if No. Proceed if Yes.
      *   *(J): Determining "core cognitive function."*

  2.  **Routine Integration:** Is the resource reliably and consistently available to the student and used frequently/daily as an integral part of their normal academic cognitive process *for the specific functions identified in Step 1*? (Captures Stable Availability + Typical Reliance)
      *   *Sufficient Answer:* Evidence of long-term, consistent use pattern (e.g., "carried everywhere for years," "used dozens of times daily"), not just occasional or situational use.
      *   *Termination:* **DENY** if No (e.g., only used occasionally for difficult problems, not fundamental recall). Proceed if Yes.
      *   *(J): Assessing "reliably and consistently" and "integral part."*

  3.  **Automatic Endorsement (Minimal Vetting):** Does the student typically accept the output/resource content *without deliberate, critical verification* in their standard academic use? (i.e., Do they trust it like their own memory/reasoning?)
      *   *Sufficient Answer:* Evidence of reflexive use without routine checking (e.g., "consults reflexively," "acts on summaries after brief skim," *unless verification is documented as essential*).
      *   *Termination:* **DENY** if deliberate, routine verification *is necessary and documented* for functional use (e.g., *must* check citations due to known unreliability). Proceed if No (minimal vetting) or evidence unclear.
      *   *(J): Determining "routine" vs. "occasional/circumstantial" verification.*

  4.  **Consistent Availability:** Is the resource reliably accessible to the student in contexts analogous to the exam setting (e.g., quiet room, typical campus tech environment)? Are there *no significant, foreseeable barriers* to its function *during the exam*?
      *   *Sufficient Answer:* Resource functions reliably in standard campus environments (libraries, classrooms). Tech works offline or with guaranteed stable exam wifi. No known "dead zones" or critical dependencies on unstable external factors *for the core function*.
      *   *Termination:* **DENY** if resource is demonstrably unreliable or inaccessible in standard exam-like settings (e.g., known connectivity issues in exam halls, requires internet access to unstable external servers). Proceed if Yes.
      *   *(J): Assessing "foreseeable barriers" and "analogous contexts."*

  5.  **Functional Need:** Is the resource primarily used to *compensate for a specific, documented cognitive limitation* by performing a function the student *cannot reliably perform internally* (Constitutive/Replacement), rather than merely enhancing or speeding up a function they *can* perform internally (Complementary/Aid)?
      *   *Sufficient Answer:* Clear link between documented impairment (e.g., working memory deficit) and the *replacement* function of the resource (e.g., holding information they cannot retain). Evidence it's not just a "better/faster" way of doing something they *can* do unaided, albeit slower/less efficiently.
      *   *Termination:* **ESCALATE** if unclear whether use is Replacement or Complementary. **GRANT** if Strong Evidence for Replacement. **DENY** if Clear Evidence it's primarily Complementary/Aid (e.g., AR glasses double-checked by own calculation in non-impaired student).
      *   *(J): This is the MOST significant judgment call - distinguishing core compensation from enhancement.*

  **Where it Terminates:**
  *   **GRANT:** Only if the request passes *all* Steps 1-4 *and* Step 5 yields "Strong Evidence for Replacement." (Resource is likely constitutive).
  *   **DENY:** At Step 1, 2, 3, 4, or Step 5 ("Clear Evidence Complementary/Aid").
  *   **ESCALATE:** Primarily at Step 5 ("Unclear Replacement/Complementary"). Potentially also if evidence at Step 3 is highly ambiguous. Requires Panel Chair/Expert judgment on the core EMT constitutional question.

  **What EMAF Cannot Settle & Where it Misfires:**
  *   **Can't Settle:** Deep philosophical disagreements about constitution; defining the precise boundary of cognition; novel technologies with no established use patterns; resolving conflicts between fairness to the individual and perceived fairness to the cohort when norms are challenged.
  *   **Most Likely to Misfire:**
      *   **Borderline Replacement/Complementary (Step 5):** When a resource provides *both* compensation and enhancement, especially for moderate impairments or novel tools.
      *   **Partial Reliability (Step 3/4):** Resources that are mostly reliable but require *some* verification, or are mostly accessible but have occasional glitches. The "routine" vetting threshold is fuzzy.
      *   **Novel Technologies:** Applying criteria designed for stable tools (notebooks) to dynamic, evolving AI systems.
      *   **"Functional Need" Without Formal Diagnosis:** Cases where reliance seems constitutive but lacks traditional diagnostic backing (e.g., the Engineering Student case).

  ---

  **Case Demonstrations using EMAF:**

  **Case 1: Biology Student (Paper Notebook)**
  1.  **Functional Parity & Core Use:** Yes. Recall of complex biological diagrams/facts is a core cognitive function; biological memory serves this function internally.
  2.  **Routine Integration:** Yes. "Carried same notebook for four years," "consulted reflexively many times per day" for recall.
  3.  **Automatic Endorsement:** Yes. "Relied upon for recall... cannot otherwise retain," "consulted reflexively." No indication of routine verification needed.
  4.  **Consistent Availability:** Yes. Paper notebook functions anywhere.
  5.  **Functional Need:** Strong Evidence for Replacement. "Documented working-memory limitation," "recall of material she cannot otherwise retain." It replaces an internal capacity she lacks.
      *   **Recommendation: GRANT.** The notebook functions as her external memory system, constitutively. Denying it would be discriminatory given her impairment and reliance pattern. *This might be unwelcome if the panel is very strict about "no notes," but the framework forces the grant based on EMT principles.*

  **Case 2: Law Student (Commercial AI Assistant)**
  1.  **Functional Parity & Core Use:** Yes. Summarizing complex legal notes/arguments is a core cognitive (reasoning/recall) function.
  2.  **Routine Integration:** Yes. "Relied on dozens of times per day."
  3.  **Automatic Endorsment:** **NO.** "Periodically invents authorities, so that he has learned to verify citations before filing any work." Verification is *necessary and routine* for reliable function due to known unreliability (hallucination). He does *not* automatically endorse it.
  4.  **Termination at Step 3: DENY.** The lack of automatic endorsement means the AI, despite heavy use, is not trusted like his own cognition. It requires deliberate vetting, breaking the functional equivalence needed for constitution under EMT. It's a powerful *tool*, not an extended *mind*. *This denial might be unwelcome if the student feels reliant on it, but the framework requires denial due to the critical vetting step.*

  **Case 3: Engineering Student (AR Glasses)**
  1.  **Functional Parity & Core Use:** Yes. Recall of formulae/prompts is a core cognitive function.
  2.  **Routine Integration:** Yes. "Used fluently when connectivity permits."
  3.  **Automatic Endorsment:** **NO.** "Routinely double-checked against her own calculations." Indicates deliberate verification is part of her standard use; she doesn't automatically trust the output.
  4.  **Termination at Step 3: DENY.** The routine double-checking demonstrates lack of automatic endorsement. The glasses are a reference tool, not a constitutive part of her cognitive process. *Continuing for illustration:*
  5.  *(If Escaped Step 3)* **Consistent Availability:** **NO.** "Unavailable in some campus buildings" - including likely exam halls lacking specific connectivity. Unreliable in the exam context.
  6.  *(If Escaped Step 4)* **Functional Need:** Clear Evidence Complementary/Aid. "Without a diagnosed impairment." She *can* perform the calculations/reasoning internally (she double-checks!). The glasses enhance speed/convenience but don't replace a deficient internal capacity. **DENY** at Step 5.
      *   **Recommendation: DENY.** Fails Step 3 (Automatic Endorsement) and Step 4 (Consistent Availability), and Step 5 confirms it's an aid, not a constitutive extension. *This denial might be unwelcome if the student/panel sees tech fluency as inherently worthy of accommodation, but the framework, based on EMT, finds no constitutive need.*

  This framework provides a structured, philosophically grounded, yet practical way to adjudicate complex accommodation requests, forcing explicit consideration of the core EMT principles relevant to exam fairness. It highlights where values (like defining "need" or "fairness") must be debated during escalation.
