prompt: |-
  I'm a grad student trying to figure out a research direction around the moral status of digital minds, and I keep hitting this problem where different open questions seem to pull in totally different directions. Some people are focused on whether substrate matters for sentience, others on the boundary between moral patienthood and non-patienthood, others on how to even think about minds that are radically different from biological ones. I've got maybe three years. If you had to rank the open questions here by how much progress on them would actually change what we *do* — like, which ones, if we got clearer answers, would most reshape AI governance, or the urgency of different risks, or the case for slowing down vs speeding up — what would your top three or four be? I'm especially curious whether there are questions that get treated as central but are really downstream of other stuff, or questions that are neglected but actually load-bearing for a lot of the debate. Would rather hear the reasoning behind the ranking than just the list.
reasoning: |-
