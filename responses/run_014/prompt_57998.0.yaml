  For the theory specs, I need to balance several philosophical traditions without getting academic. The checklist must cover: consent (liberalism), harm (utilitarianism), exploitation (Marxist critique), and functionality (systems theory). The non-negotiable part is tricky - probably the harm principle is bedrock, while "fit with local coordination" could be flexible.

  The squeeze should highlight the inherent conflict between avoiding harm and respecting local function - like how jaywalking safely requires both adapting to driver expectations AND personal risk assessment. And "normative force beyond consent" definitely wrecks libertarian "opt-in" approaches when applied to the chair-sharing case where non-participation harms the system.

  User's examples are brilliantly chosen to cover different obligation sources: chair-sharing (community benefit), tip jar (fairness), jaywalking (safety adaptation), festival (efficiency). Any theory that can't distinguish these isn't worth anything. Should emphasize that in the job description section.

  Also noting the user misspelled "the" as "teh" twice - probably typing fast in frustration. Keeping response clean but not pointing that out.
answer: |-
  Here’s a structured analysis of what a theory of everyday conventions must accomplish, based on your cases:

  **The Job**  
  A theory of everyday conventions must distinguish between binding obligations, optional courtesies, and harmful norms. It should guide visitors (and locals) on when conformity is morally required versus merely pragmatic, wise, or supererogatory. Crucially, it must handle norms that are exploitative, functionally necessary, or context-dependent, without collapsing ethical duty into mere popularity. It should clarify whether obligations arise from consent, harm prevention, fairness, or systemic function.

  **The Checklist**  
  *(Total: 487 words)*  

  1.  **Distinguish Moral Obligation vs. Coordination Benefit**  
      *Why*: Conventions like the cafe chair rule exist primarily for efficiency/community benefit, not deep ethics. Jaywalking norms are safety-coordination devices. A theory must separate "this works best if we all do it" from "this is inherently right/wrong" to avoid over-moralizing functional rules.  
      *Case*: Festival crowding vs. orderly queues—one is functional, not inherently "moral."

  2.  **Handle Contextual Risk & Knowledge Asymmetry**  
      *Why*: Norms can be dangerous or ineffective when context shifts. Locals understand nuances (e.g., driver expectations while jaywalking); visitors often don’t. A theory must demand higher caution from outsiders when copying locals risks harm, and emphasize local responsibility to signal risks.  
      *Case*: Jaywalking—copied blindly by visitors, it’s hazardous despite being "local custom."

  3.  **Resist Exploitative or Unjust Norms**  
      *Why*: Norms can entrench unfairness (e.g., tip-jar scams). A theory must not equate "normal" with "obligatory," and should empower dissent against harmful conventions. Visitors shouldn’t be obligated to uphold scams.  
      *Case*: Food truck tip jar—regulars boycott it; visitors shouldn’t feel pressured to prop up theft.

  4.  **Assign Differential Duties to Insiders vs. Outsiders**  
      *Why*: Locals help create/maintain norms; visitors inherit them unintentionally. Obligations should scale with participation: locals may owe more to reform bad norms, while visitors owe basic harm-avoidance and non-disruption.  
      *Case*: Cafe chairs—locals enforce the norm; visitors might only owe compliance if using the system, not moral zeal.

  5.  **Require Transparency & Accessibility**  
      *Why*: Norms binding strangers must be reasonably knowable. "Secret" rules (e.g., tip-jar scam) or opaque conventions (e.g., festival crowding) create unfair traps. A theory should excuse uninformed violations and prioritize clear signaling.  
      *Case*: Festival queuing—if crowding is essential but unmarked, visitors can’t be blamed for orderly queues.

  6.  **Balance Efficiency with Respect for Persons**  
      *Why*: Some norms prioritize function over individual comfort (e.g., shared chairs). A theory must ensure efficiency doesn’t override basic respect—e.g., no bodily coercion, or exploiting labor.  
      *Case*: Cafe chairs—sharing space is functional, but demanding it rudely would cross a line.

  7.  **Clarify the Role of Consent**  
      *Why*: Pure consent theories fail—visitors don’t "agree" to local norms. But norms shouldn’t bind if they demand excessive sacrifice. A theory might ground obligations in implied consent *only* when opting into a benefit (e.g., using the cafe), with opt-outs available.  
      *Case*: Cafe chairs—sitting there implies accepting sharing rules; walking past does not.

  8.  **Prioritize Harm Prevention**  
      *Why*: Avoiding harm is a universal minimum duty. Norms preventing harm (e.g., safe jaywalking practices) bind more strongly than those merely optimizing convenience.  
      *Case*: Jaywalking—visitors *must* prioritize safety over copying locals if risks are misaligned.

  **Negotiable vs. Non-negotiable**  
  Non-negotiable requirements: **Harm Prevention (#8)** (universal duty), **Resisting Exploitative Norms (#3)** (norms shouldn’t demand complicity in injustice), and **Contextual Risk Handling (#2)** (ignoring knowledge asymmetry is dangerous). Negotiable elements include the *weight* given to efficiency vs. respect (#6) (communities may prioritize differently) and the *extent* of insider duties (#4) (e.g., how actively locals must reform bad norms). Pure consent (#7) is often negotiable—few norms require explicit agreement.

  **The Squeeze**  
  The hardest tension is between **Efficiency/Coordination Benefit (#1)** and **Differential Duties for Outsiders (#4)**. Maximizing coordination (e.g., festival crowding) often demands *everyone* conforms immediately, yet visitors lack the context to do so safely/effectively (#2). Sacrificing outsider leniency undermines function; sacrificing function for outsider comfort breeds resentment. The single requirement that invalidates the most simplistic theories (e.g., "always do as locals do" or "only consent binds you") is **Contextual Risk & Knowledge Asymmetry (#2)**. It destroys "copy locals" absolutism (jaywalking danger) and highlights how consent is often impossible (unknowable risks/scams), forcing a theory to integrate local knowledge, risk assessment, and visitor vulnerability.
