prompt: |-
  ok so I'm a third-year PPE student and my political theory seminar has me writing a paper on humanitarian intervention and regime change, and I've gotten stuck in kind of the worst way: I've read maybe six different accounts and I can't tell whether they're even answering the same question. Some are trying to tell a minister what to do next month, some are trying to render a verdict on whether NATO's Kosovo campaign was right all things considered now that we know how it went, and some are really trying to say when sovereignty stops shielding a regime from outsiders. So before I commit to arguing with anyone I want the spec first — the list of things any theory in this area has to be able to do before it's allowed to count as an answer, whatever it concludes.

  Fix the purpose like this, because I think a lot of the disagreement dissolves once you do: I want a theory good enough to be turned into a standing ex ante decision rule that a regional body could actually apply beforehand, by people who don't know how things will turn out. That means no criterion that can only be evaluated in hindsight, and no criterion that requires reading anyone's mind. With that constraint in place, give me the full requirements list: the phenomena a theory has to explain, the cases it has to get right (and say which case is doing the work for each requirement — Kosovo, Iraq 2003, Libya 2011, Rwanda 1994 as the non-intervention, Syria 2013 as the other non-intervention, anything else you think is load-bearing), the distinctions it can't collapse (I already suspect civilian-rescue vs. regime change is one, and intention vs. motive vs. publicly stated rationale is another), and the empirical findings it can't contradict if it wants to be taken seriously by IR people and not just philosophers — stuff like what the record actually shows about foreign-imposed regime change, the moral-hazard worry that credible promises of intervention encourage rebellion, and the selectivity problem of interventions happening somewhere other than where the killing is worst. Also tell me which of the standard requirements are genuine and which are just one camp's house prejudices wearing a lab coat: is the right-intention criterion a real requirement or a demand no institutional rule could ever operationalize, is reasonable prospect of success a requirement or a dressed-up status-quo bias, can last resort ever be satisfied by anything that isn't indefinite delay, and does saying an intervention can be unlawful yet morally justified name a coherent category or a contradiction. Flag any pair or trio of requirements you think can't be jointly satisfied — that's the part I most want, e.g. if authorization-by-international-body and effectiveness-under-a-veto simply can't both hold, say so, because then the list is itself the result. And then: which single requirement knocks out the most candidates?

  Format-wise, put the requirements in a markdown table with exactly these columns: id; requirement (one sentence, phrased as something a theory has to do, not as a claim about the world); motivating case or consideration; verdict, one of genuine / camp-prejudice / negotiable; status, one of settled / contested; and conflicts (which other ids it clashes with, or none). After the table, prose for the unsatisfiable sets and for the knockout-requirement answer. Keep the scorecard minimal — a few sentences at the very end on how the main contenders do against the list is plenty, I'm not asking you to referee the whole debate. One thing I do need: seperate clearly, in the status column and in the prose, what basically everyone who works on this agrees on from what is genuinely contested and you're taking a side on. Don't hand me a contested position as if it were the consensus — half my paper is going to be that the field doesn't agree, so if you flatten that out you've actively misled me.
reasoning: |-
  Okay, the user is a third-year PPE student working on a paper about humanitarian intervention and regime change. They're feeling stuck because they've read various accounts that seem to be addressing different questions. Some focus on practical advice for policymakers, others on retrospective evaluations like Kosovo, and some on theoretical principles like sovereignty limits. This confusion has made it hard for them to engage critically with the literature.

  To help, they want a clear specification of requirements for a theory of humanitarian intervention that can serve as an ex ante decision rule. Key constraints are: no hindsight-dependent criteria and no mind-reading requirements. The goal is a framework that regional bodies could apply prospectively.

  The user lists several elements they need covered: phenomena to explain, key cases (Kosovo, Iraq 2003, Libya 2011, Rwanda 1994, Syria 2013), critical distinctions (civilian-rescue vs. regime change, intention vs. motive), and empirical realities (e.g., outcomes of foreign-imposed regime change, moral hazard, selectivity). They also want problematic requirements flagged - like whether "right intention" is operationalizable or "last resort" is achievable.

  They specifically request identification of requirement conflicts (e.g., authorization vs. effectiveness under veto) and the "knockout requirement" that disqualifies most theories. The format must be a markdown table with columns: ID, requirement, motivating case, verdict (genuine/camp-prejudice/negotiable), status (settled/contested), and conflicts.

  The user emphasizes maintaining nuance: clearly separating settled vs. contested points and not presenting debatable positions as consensus. This is crucial because their paper focuses on field disagreements.

  For the framework, I need to identify core requirements like:
  - Threshold severity (genocide/war crimes - Rwanda as motivator)
  - Legitimate authority (who decides? - Kosovo's NATO vs. UNSC tension)
  - Proportionality (Libya's mission creep example)
  - Discrimination (avoiding civilian harm - Iraq collateral damage concerns)

  Key distinctions to preserve:
  - Civilian protection vs. regime change (Libya 2011 blurred this)
  - Stated rationale vs. hidden motives (Iraq 2003 WMD claims)

  Empirical constraints:
  - Poor regime change outcomes (Iraq insurgency)
  - Moral hazard (rebels provoking violence hoping for intervention)
  - Selectivity (Syria 2013 inaction vs. Libya action)

  Problematic criteria analysis:
  - "Right intention" - likely camp-prejudice (hard to prove prospectively)
  - "Last resort" - negotiable but contested (how to define exhaustion?)
  - "Unlawful but justified" - genuine category (Kosovo example)

  Major conflicts:
  - Legitimate authority vs. effectiveness (UNSC authorization vs. veto power paralysis - Syria 2013)
  - Sovereignty vs. threshold severity (Rwanda non-intervention vs. sovereignty norms)

  Knockout requirement: "Reasonable prospect of success" likely disqualifies most wishful-thinking proposals because it forces engagement with hard realities like capability assessments and unintended consequences. This is empirically grounded and non-negotiable for any operational rule.

  For the table, I'll include ~12 requirements covering threshold conditions, agent criteria, conduct rules, and empirical constraints. Conflicts will be explicitly mapped (e.g., ID1 vs. ID4). In prose afterward, I'll highlight key unsatisfiable sets (like the authorization-effectiveness tension) and explain why prospect-of-success is the knockout criterion.

  Finally, a brief scorecard will note how major approaches (e.g., cosmopolitan vs. international society) fare against the requirements, flagging where they struggle (e.g., realists reject threshold severity, liberals grapple with selectivity). This maintains the requested nuance on contested issues.
answer: |-
  Here is a specification for a theory of humanitarian intervention/regime change designed to serve as an **ex ante, institutionally operationalizable decision rule**, incorporating your constraints (no hindsight, no mind-reading). The requirements are derived from core problems in the literature, key cases, empirical realities, and operational logic. "Settled" means broad agreement exists on its relevance/validity as a *type* of consideration, even if its *application* is contested. "Contested" means the requirement itself is disputed by significant scholarly camps.

  ### Requirements Table

  | ID | Requirement                                                                 | Motivating Case/Consideration                                                                 | Verdict             | Status     | Conflicts |
  | :-- | :-------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------- | :------------------ | :--------- | :-------- |
  | 1  | **Define a clear, prospectively identifiable threshold of harm** triggering permissible override of sovereignty. | Rwanda 1994 (genocide); Syria 2013 (chemical weapons crossing "red line")                    | Genuine            | Settled    | None      |
  | 2  | **Distinguish permissible civilian protection from impermissible regime change** as the primary objective. | Libya 2011 (UNSC Res 1973 authorized protection; regime change ensued, undermining legitimacy) | Genuine            | Contested  | None      |
  | 3  | **Operationalize "legitimate authority"** for authorization without requiring unanimity in bodies subject to veto. | Kosovo 1999 (NATO acted without UNSC due to Russian veto); Syria 2013 (veto blocked action) | Genuine            | Contested  | 4         |
  | 4  | **Ensure effectiveness:** Require a reasonable prospect of achieving the core protective objective without causing greater harm. | Iraq 2003 (chaos, insurgency, sectarian violence post-regime change); Libya 2011 (collapse into civil war) | Genuine            | Settled    | 3, 11     |
  | 5  | **Incorporate empirical constraints:** Account for the historically poor outcomes of foreign-imposed regime change. | Iraq 2003, Libya 2011 (empirical IR findings on instability, violence, state failure)        | Genuine            | Settled    | 2 (if RC required), 11 |
  | 6  | **Address selectivity/moral hazard:** Provide a rule resilient to inconsistent application & not incentivizing rebel provocations. | Rwanda (inaction) vs. Libya (action); Syria (inaction); Moral hazard: rebels initiating violence hoping for intervention | Genuine            | Contested  | 1, 10     |
  | 7  | **Require proportionality:** Means must be proportionate to the specific protective objective. | Concerns over scale of force/destruction in Kosovo, Iraq                                     | Genuine            | Settled    | 2, 11     |
  | 8  | **Require discrimination:** Minimize foreseeable harm to civilians not directly participating in hostilities. | Civilian casualties in Kosovo air campaign, Iraq invasion                                    | Genuine            | Settled    | None      |
  | 9  | **Avoid reliance on actor motives or hidden intentions**; focus on objectively verifiable actions and mandates. | Iraq 2003 (WMD rationale vs. suspected democratization/strategic motives)                  | Genuine            | Settled    | N/A       |
  | 10 | **Require exhaustion of feasible non-military means** ("last resort"), defined prospectively as lack of viable alternatives likely to succeed *within the timeframe of the emergency*. | Rwanda (diplomacy failed as genocide accelerated); Libya (sanctions deemed insufficient as assault loomed) | Negotiable         | Contested  | 6         |
  | 11 | **Include "reasonable prospect of success"** defined prospectively based on capabilities, planning, and likely consequences. | Rwanda (limited forces, complex terrain argued against success prospect); Libya (initial success vs long-term failure) | Genuine (knockout) | Settled    | 4, 5, 7   |
  | 12 | **Acknowledge the category of "unlawful yet morally justified" intervention** as coherent (e.g., unauthorized but necessary). | Kosovo 1999 (Unauthorized by UNSC but widely deemed necessary/justified ex post)           | Genuine            | Contested  | 3         |

  ### Key Distinctions the Theory Must Preserve
  *   **Civilian Protection vs. Regime Change:** (ID 2) Blurring this leads to mission creep (Libya), undermines legitimacy, and ignores empirical risks (ID 5). The rule must define the objective narrowly as stopping mass atrocities.
  *   **Stated Rationale vs. Hidden Motives:** (ID 9) The rule must function based on publicly stated mandates, verifiable facts, and likely consequences, not speculative psychological or political motives of intervening states.
  *   **Sovereignty vs. Threshold Harm:** (ID 1) The rule must specify the point where the presumption of non-intervention is overridden by the imperative to protect.
  *   **Legality (UN Charter) vs. Legitimacy/Morality:** (ID 12) The rule must recognize that sometimes the necessary action might bypass blocked authorization procedures.

  ### Unsatisfiable Sets (Conflicting Requirements)
  1.  **Legitimate Authority (ID 3) vs. Effectiveness under Veto (ID 4) & Unlawful-Justified (ID 12):** This is the core tension. Requiring UNSC authorization (a strict reading of ID 3) *guarantees* ineffectiveness (violates ID 4) in cases like Syria 2013 or Kosovo 1999 where a veto is certain due to strategic interests of a P5 member, regardless of the atrocity threshold (ID 1). Any rule demanding UNSC approval cannot satisfy the effectiveness requirement (ID 4) universally. Conversely, allowing unauthorized action (ID 12) to satisfy ID 4 directly conflicts with a strict interpretation of ID 3 based on UN Charter legality. *Resolution is only possible by relaxing ID 3 (e.g., allowing regional bodies/coalitions when UNSC paralyzed, contingent on other criteria) or accepting that ID 3 sometimes cannot be met for justified interventions (ID 12).*
  2.  **Last Resort (ID 10) vs. Effectiveness (ID 4) & Moral Hazard (ID 6):** Strictly interpreting "last resort" as exhausting *all* conceivable non-military options indefinitely risks violating ID 4 (failing to protect in time, as in Rwanda) and can worsen ID 6 (moral hazard) by prolonging conflicts where rebels hold out for intervention. A feasible rule must define "last resort" prospectively and contextually (e.g., "no reasonably timely and effective non-military alternative exists").
  3.  **Reasonable Prospect of Success (ID 11) vs. Addressing Worst Cases (ID 1 & ID 6):** ID 11 can inherently bias against intervention in the most difficult, high-risk scenarios (like Rwanda 1994, where success seemed highly doubtful) while selectivity concerns (ID 6) push for action precisely where harm is worst. A rule must balance the imperative to act against grave crimes with the prudential requirement not to make things worse, accepting that ID 11 might preclude intervention in some dire situations.

  ### The Knockout Requirement
  **ID 11: Reasonable Prospect of Success** knocks out the most candidate theories. Many philosophical or legalistic approaches focus intensely on *jus ad bellum* principles (ID 1, ID 3, ID 10, ID 12) or *jus in bello* (ID 7, ID 8) but give insufficient weight or offer no operational method for prospectively assessing feasibility and likely consequences. Theories that are overly permissive (ignoring ID 5, ID 11) or overly restrictive (demanding impossible guarantees under ID 11) fail this test. Any rule ignoring the empirically demonstrated risks of failure, escalation, and unintended negative consequences (ID 4, ID 5) is institutionally irresponsible and practically dangerous. This requirement forces engagement with messy empirical realities (military capacity, political dynamics, historical precedent) and the potential for catastrophic failure, disqualifying purely normative or wishful-thinking approaches.

  ### Brief Scorecard on Main Contenders
  *   **Strict Legalism (UNSC Only):** Fails ID 3 (operationalization under veto), ID 4 (effectiveness when vetoed), ID 12 (rejects category), and struggles with ID 6 (selectivity due to veto politics). Strong on ID 3 (if defined narrowly).
  *   **Cosmopolitan "Duty to Protect":** Often strong on ID 1, ID 2. Frequently weak on ID 3 (authorization ambiguity), ID 4/ID 5/ID 11 (underestimates implementation risks, consequences of regime change), ID 6 (struggles with selectivity/moral hazard practically). May blur ID 2.
  *   **"Responsibility while Protecting"/Strict Criteria (ICISS-inspired):** Explicitly addresses ID 1, ID 2, ID 7, ID 8, ID 10, ID 11. Critically weak on **ID 3** (fails to resolve veto problem, operational ambiguity) and **ID 12**. Vulnerable on ID 6 (selectivity remains).
  *   **Pragmatic Institutionalist (Regional Bodies/Coalitions):** Attempts to resolve ID 3 vs ID 4/ID 12 conflict by relaxing ID 3. Success depends entirely on rigorous operationalization of ID 1, ID 2, ID 4, ID 5, ID 7, ID 8, ID 11. Still vulnerable on ID 6 (selectivity of regional bodies).
  *   **Skeptical/Realist:** Strong on ID 4, ID 5, ID 11 (emphasizes risks/failure). Rejects or minimizes ID 1 (threshold), ID 12. Views ID 2 as impossible, ID 3 as irrelevant (power matters), ID 6 as inevitable, ID 10 as meaningless. Offers no positive rule for *humanitarian* intervention.

  **Consensus vs. Contested:** Broad agreement exists on the *need* for requirements like Threshold Harm (ID 1 - type), Distinction Protection/RC (ID 2 - importance), Proportionality (ID 7), Discrimination (ID 8), Empirical Constraints (ID 5), and Prospect of Success (ID 11) as relevant *categories*. **Fierce contestation** exists over: the *operational meaning* of Legitimate Authority (ID 3), the achievability/strictness of Last Resort (ID 10), the validity of Unlawful-Justified (ID 12), whether Regime Change can *ever* be part of the objective (ID 2), and how to resolve the core tension between ID 3 and ID 4/ID 12. The status of "Right Intention" as a separate requirement is **widely rejected** (verdict: Camp-Prejudice) as un-operationalizable prospectively (covered by focusing on objective mandate/actions - ID 2, ID 9). "Reasonable Prospect of Success" (ID 11) is settled as necessary but heavily contested in its *application* and weight relative to the threshold (ID 1).
