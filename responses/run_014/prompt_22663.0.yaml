answer: |-
  Here's the gut-level intuition for the Kelly asymmetry, focusing on why overbetting is catastrophic while underbetting is merely suboptimal:

  1.  **Think Compound Growth, Not Single Bets:** The key is that Kelly maximizes the *geometric mean* of your growth. Each bet isn't just a standalone event; it compounds multiplicatively on your *previous bankroll*. Your current bankroll is the foundation for your *next* bet.

  2.  **The Devastating Power of Large Losses:** When you **overbet** (stake too much):
      *   A **loss** doesn't just set you back a little. It devastates your bankroll. Losing 70% of your bankroll means you now have only 30% left.
      *   To recover from that 70% loss, you need a **massive gain** (over 233%!) just to get back to where you started *before* you can even think about growing. This is the brutal math of percentages.
      *   **Variance Drag:** Even though each bet *individually* has a positive expectation (EV), the amplified losses caused by overbetting create a severe "variance drag" on your *compounded* growth. The volatility eats away at your geometric mean return.

  3.  **The Asymmetry of Recovery:** Losses require disproportionately larger gains to recover from. Overbetting makes losses so deep that the required recovery gains become statistically improbable or even impossible within the context of your betting strategy. Your bankroll gets trapped in a downward spiral where each loss makes the hole deeper, and the climb out steeper.

  4.  **Why "Positive EV" Isn't Enough:** Yes, each individual bet has positive EV. But when you overbet, the *sequence* of returns matters catastrophically. A single large loss, or a run of moderate losses, can cripple your bankroll so badly that the positive EV of future bets is applied to a tiny remnant of your original wealth. Even if your *expected wealth* keeps growing linearly (because EV is linear), the *median* or *typical* outcome plummets towards zero. The compounding effect of deep losses overwhelms the linear benefit of the edge.

  5.  **Underbetting is Forgiving:** When you **underbet** (stake too little):
      *   Losses are smaller and easier to recover from. Losing 10% only requires an 11.1% gain to break even.
      *   Gains are smaller too, but they compound positively.
      *   The variance drag is much lower. Your growth is slower than optimal, but it's *still positive geometric growth*. Your bankroll grows steadily, just not as fast as it could. There's no downward spiral triggered by devastating losses. Positive EV, even applied cautiously, eventually wins out.

  6.  **The Log Wealth Objective (The Crux):**
      *   **Expected Wealth (Linear):** Maximizing expected wealth (`E[W]`) cares only about the average *final dollar amount*. It ignores the *path* and the *risk of ruin*. It would tell you to bet your *entire* bankroll on any positive EV bet, leading to almost certain ruin eventually. It's blind to compounding and risk.
      *   **Expected Log Wealth (Geometric):** Maximizing `E[log(W)]` is equivalent to maximizing the *long-run geometric growth rate*. `log(W)` directly captures the *multiplicative* nature of compounding:
          *   `log(W * (1 + f*b)) = log(W) + log(1 + f*b)` (A win)
          *   `log(W * (1 - f)) = log(W) + log(1 - f)` (A loss)
          *   The *change* in log wealth (`log(1 + f*b)` or `log(1 - f)`) depends *only* on the fraction `f` and the outcome, *not* on the absolute size `W`. This is the natural framework for multiplicative growth.
      *   **Why Asymmetry Emerges Here:** The function `log(1 + x)` is highly asymmetric! Gains give diminishing marginal increases to log wealth (`log(1 + 2.0) = 1.10`, `log(1 + 3.0) = 1.39`), while losses give increasingly severe *decreases* as they get larger (`log(1 - 0.5) = -0.69`, `log(1 - 0.7) = -1.20`, `log(1 - 1.0) = -∞`!). Overbetting pushes you into the region where losses cause catastrophic drops in log wealth. Underbetting avoids these catastrophic drops but accepts smaller gains in log wealth.

  **The Gut Feeling Analogy:**

  Imagine your bankroll is water in a leaky bucket you're trying to fill (positive EV bets add water on average). Kelly tells you the optimal rate to pour water in.

  *   **Underbetting:** You pour very slowly. Water sloshes out (losses), but you add more (positive EV) than spills. The bucket fills slowly but surely.
  *   **Kelly Betting:** You pour at the perfect rate. Minimal sloshing, maximum net water gain. The bucket fills fastest.
  *   **Overbetting:** You pour way too fast. Huge waves form in the bucket. Each wave causes massive spillage (deep losses). Even though you *are* adding water on average, the catastrophic spillage during the waves means the bucket actually *empties* over time. You eventually end up with nothing. The harder you pour (overbet), the bigger the waves and the faster the spillage ruins you.

  **The Threshold:**

  There's a critical point (around double the true Kelly fraction) where the variance drag from overbetting *exactly* cancels out the positive edge, leading to zero growth (`E[log(W)] = 0`). Betting *beyond* this point (`f > f_double-Kelly`) makes `E[log(W)]` **negative**. This negative geometric growth rate mathematically guarantees your wealth will decay to zero with probability 1 over the long run, even though each bet has positive expected value (`E[return] > 0`). Underbetting always keeps `E[log(W)] > 0` (slow growth, but growth nonetheless).

  **In short:** Overbetting creates devastating losses that cripple your ability to compound future gains. The logarithm magnifies the pain of these large losses, making the geometric growth negative. Underbetting avoids this catastrophic risk, sacrificing only speed, not survival. Kelly finds the sweet spot for maximum safe compounding.
