prompt: |-
  So i never did college philosophy, I just drive for a parcel company and fall down youtube rabbit holes at night, and somehow I agreed to do a 15 minute talk for our library saturday puzzle club on that raven paradox thing where saying all ravens are black is logically the same as saying everything not black is not a raven, so a white sneaker supposedly proves something about ravens. My take I want to defend is that yeah a white sneaker does support it but only like a teeny tiny bit, because there are way way more non-black things in the world than ravens so each one moves the needle less, and I have this extra spin I came up with arguing with my brother-in-law that spotting ten black ravens in the park is worth more than checking my whole closet full of white socks and my green apple in the fridge, even though logic textbooks treat them the same.

  My audience is like fifteen regulars, mostly retired primary school teachers plus two serious birdwatchers who get annoyed at silly bird examples and one ex-engineer who loves catching people in math tricks and always asks about sample sizes, they all hate fancy jargon and care a lot about common sense and real world birdwatching. Can you make me a Q and A prep sheet for after my talk with the like six or seven objections they will actually throw at me in thier own words, ordered from most likely and most damaging down, each with a quick two minute reply I can actually say out loud plus a note on where my reply is soft and what I should just concede vs hold firm on, and at the end include the one nightmare question I am hoping nobody asks because I have no good arguement for it.
