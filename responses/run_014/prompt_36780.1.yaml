    \[
    E_{\text{exit}} = 7 - 6 \cdot \frac{5}{8} = 7 - 3.75 = 3.25,
    \]
    \[
    E_{\text{cont}} = \frac{5}{8} \cdot 2.8 + \frac{3}{8} \cdot 2 = 1.75 + 0.75 = 2.5.
    \]
    Since \(3.25 > 2.5\), the driver strictly prefers to exit, not randomize. Thus, \(p = 0.4\) cannot be rationally executed at the exit. Marco's policy maximizes ex-ante payoff but is dynamically inconsistent.

  #### (2) Petra: "The arithmetic is fine, but you answered a different question..."
