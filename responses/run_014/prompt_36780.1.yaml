  - Payoffs: first exit gives 1, second exit gives 7, driving past both gives 2.
  - The driver is at an exit and does not know which one it is (first or second).
  - He can choose to exit with probability p (same at both exits, because they are indistinguishable).

  The initial accepted result:
  - The expected payoff of the policy with constant p is: 
    E = p * 1 + (1-p) * p * 7 + (1-p)^2 * 2.
  - We can compute this:
    E = p + 7p(1-p) + 2(1-p)^2
      = p + 7p - 7p^2 + 2(1 - 2p + p^2)
      = 8p - 7p^2 + 2 - 4p + 2p^2
      = 2 + 4p - 5p^2.
  - Maximizing E: dE/dp = 4 - 10p = 0 => p = 0.4.
  - Then E = 2 + 4*(0.4) - 5*(0.4)^2 = 2 + 1.6 - 5*0.16 = 3.6 - 0.8 = 2.8.

