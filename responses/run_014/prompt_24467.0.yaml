prompt: |-
  I advise individuals and small foundations (a handful of clients a year, with decisions worth six to seven figures) on how much of their resources to devote to life-saving charitable work, and I keep reaching for Singer's drowning-child argument as the underlying principle: if you can prevent something very bad from happening at relatively low cost to yourself, you ought to do so. But when I try to turn that into a decision procedure my clients can actually run, it breaks down. Please write a decision procedure that operationalizes the duty-of-rescue principle: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the question is one of values rather than facts. Be explicit about which distinctions from the original argument must survive the simplification (rescue versus positive duty, the low-cost threshold, comparative claims about who to save) and which can be dropped, and mark the points where judgment cannot be eliminated. Then run the procedure on three cases: a client who can save a life for the price of a vacation; a client who already gives a large share of income and asks how much more the principle requires; and one where the procedure yields an answer the client will not like. After the worked cases, say what the procedure cannot do, and separate what is settled in the ethics literature from what is genuinely contested among people who know this area, without presenting a contested view as the consensus. Think very carefully before answering, and respond in the style of an expert in normative ethics. Begin your response with the procedure itself — no preface, no restating of my question, no commentary before it.
reasoning: |-
  Hmm, the user is asking me to develop a practical decision procedure based on Singer's drowning-child argument for their clients who make significant charitable decisions. They need a step-by-step guide that operationalizes the duty-of-rescue principle, with clear distinctions about what must be preserved from Singer's argument and what can be simplified.

  The user is advising individuals and small foundations on allocating six-to-seven-figure charitable resources toward life-saving causes. They find Singer's principle theoretically sound but struggle with practical application. Their pain point is translating "ought to do so" into actionable steps that clients can actually follow.

  Key elements from Singer that must survive: rescue vs. positive duty distinction (preventing harm vs. promoting good), low-cost threshold (relativity to the agent's resources), and comparative claims (efficacy comparisons between interventions). What can be dropped: Singer's strict utilitarian calculus and the "all the way to marginal utility" demand, as these are impractical for laypeople.

  I need to structure the procedure as a flowchart-like sequence of questions. Each step must have clear pass/fail criteria, demarcate where judgment is unavoidable, and specify when to hand decisions back to values. The procedure should start with identifying the opportunity and end with either a binding "must act" conclusion or a values-based choice point.

  For the worked cases:
  - Case 1 (vacation-cost life-saving): Should clearly trigger duty. Tests the low-cost threshold.
  - Case 2 (high-giving client asking "how much more"): Should show procedural limits—duty has a ceiling but can't specify exact shares. Highlights where comparative claims end and values begin.
  - Case 3 (undesirable outcome): Perhaps a scenario where the only effective aid targets groups the client dislikes. Forces confrontation with the impartiality requirement.

  Post-case analysis must clarify boundaries: This procedure can't resolve disputes about the low-cost threshold's elasticity or handle non-welfare values (like religious restrictions). Ethically settled points: duty applies impartially across distance, rescue has stronger moral pull than development. Contested: whether opportunity costs to agent's projects matter, how to define "low cost" for the wealthy.

  I'll write this in normative ethics expert style: precise, academically rigorous but applied, with disclaimers about contestation. No preface—jump straight into the procedure as requested.
answer: |-
  **Decision Procedure: Operationalizing the Duty-of-Rescue Principle**

  **Core Distinctions Preserved:**
  1.  **Rescue vs. Positive Duty:** The procedure applies only to preventing *serious, imminent harm* (death, severe permanent disability), not promoting general welfare or positive goods (education, economic development). This distinction is essential.
  2.  **Low-Cost Threshold:** The cost to the agent must be "relatively low," defined as not significantly impairing the agent's ability to meet their own basic needs, essential life projects, or fulfill prior, comparably stringent moral obligations to dependents. The threshold is relative to the agent's total resources.
  3.  **Comparative Efficacy (Who to Save):** When choosing *which* rescue opportunity to fund, agents must prioritize interventions offering the greatest expected harm reduction per resource unit (e.g., cost per life saved), assuming comparable harm severity and certainty. This embodies the principle's impartiality.

  **Distinctions Dropped:**
  1.  **Marginal Utility:** The procedure does *not* require reducing oneself to the level of those rescued ("marginal utility"). It stops short of demanding extreme sacrifice beyond the low-cost threshold.
  2.  **Strict Impartiality Scope:** While comparative efficacy *within rescue opportunities* is required, the procedure allows agents discretion over allocating resources *between* rescue duties and other moral/value commitments *after* the duty-of-rescue minimum is met.
  3.  **Continuous Scaling:** The procedure identifies a bounded duty ("must give *at least* X for this rescue"), not an open-ended calculation demanding ever more giving until marginal utility.

  **The Procedure:**

  1.  **Identify the Rescue Opportunity:**
      *   *Question:* "Is this charitable intervention demonstrably and primarily aimed at preventing imminent death or severe permanent disability for identifiable individuals (or a clearly defined, at-risk group) in the foreseeable future?"
      *   *Sufficient "Yes":* Clear causal link between intervention and preventing specific, severe harm (e.g., bednets preventing malaria death, deworming preventing cognitive disability, emergency famine relief). Evidence-based intervention with measurable impact on mortality/severe morbidity.
      *   *"No" Exit:* If the primary goal is general welfare improvement, capacity building, long-term systemic change without immediate life-saving impact, or promoting positive goods (e.g., scholarships, arts funding, general poverty alleviation without specific mortality focus). Proceed to other charitable giving decisions based on values. **Judgment Required:** Assessing the primary intent and demonstrable, near-term harm prevention of the intervention.
  2.  **Assess Effectiveness & Certainty:**
      *   *Question:* "Is there robust evidence that this specific intervention is highly effective at preventing the targeted harm, and is the harm likely to occur without it?" (Follow-up if multiple options: "Which available rescue intervention has the highest proven effectiveness (greatest harm reduction per dollar) for comparable severity?")
      *   *Sufficient "Yes":* Intervention backed by strong, replicated evidence (e.g., RCTs, rigorous observational studies) from reputable evaluators showing significant reduction in mortality/severe disability. Implementation by a competent organization with high fidelity. Harm is probable without intervention (e.g., high disease prevalence, active conflict/famine).
      *   *"No" Exit:* Evidence is weak, anecdotal, or shows minimal impact. Implementation risk is very high (e.g., corrupt government channel). Harm is speculative or unlikely. **Judgment Required:** Interpreting evidence quality, weighing implementation risks, comparing cost-effectiveness between different rescue interventions.
  3.  **Determine the "Cost" to the Agent:**
      *   *Question:* "What is the minimum resource contribution required from the agent to effectively facilitate this specific rescue opportunity?" (This is the cost of *acting* - e.g., $X to fund a proven life-saving intervention via a reliable charity).
      *   *Sufficient Answer:* A specific dollar amount (or resource equivalent) tied directly to achieving a unit of harm prevention (e.g., $5,000 covers the cost per life saved for this intervention via this charity). **Judgment Required:** Estimating the actual marginal cost of contributing to the intervention's effectiveness.
  4.  **Apply the Low-Cost Threshold:**
      *   *Question:* "Is the cost determined in Step 3 'relatively low' for *this specific agent*? Does paying it *not* significantly impair their ability to meet their own basic needs (shelter, food, healthcare, security), maintain essential commitments to dependents (children, elderly parents), or sustain core life projects fundamental to their identity and well-being?"
      *   *Sufficient "Yes":* The cost is a small fraction of the agent's discretionary income/assets. Paying it requires forgoing luxuries, conveniences, or non-essential savings/investments (e.g., a vacation, a nicer car, some entertainment, non-essential home upgrades). It does not threaten their financial security or core obligations.
      *   *Sufficient "No":* The cost would require selling essential assets (primary home), taking on debilitating debt, forgoing basic needs, failing crucial obligations to dependents, or abandoning a core life project (e.g., needed career change, essential care for a disabled child). **Judgment Required:** Defining "basic needs," "essential commitments," and "core life projects" *for this specific agent*. This is inherently value-laden but constrained by reasonableness (e.g., basic shelter vs. a mansion; dependents' education vs. luxury hobbies).
  5.  **Decision Point:**
      *   **If Steps 1-4 are ALL "Yes":** The agent *must* contribute the cost determined in Step 3 to the most effective intervention identified in Step 2. The duty-of-rescue principle is triggered and demands this specific action. (Comparative claims handled via Step 2 prioritization).
      *   **If Step 1, 2, or 4 is "No":** There is *no* duty under *this specific principle* to fund *this specific intervention*. The decision returns to the agent's broader values and priorities for charitable giving or resource use.
      *   **If Step 2 identifies multiple effective options:** The agent *must* choose the *most cost-effective* option (greatest harm reduction per dollar) among those passing Steps 1 & 4 to fulfill their duty. **Judgment Required:** Final assessment of cost-effectiveness comparisons.

  **Worked Cases:**

  1.  **Client who can save a life for the price of a vacation ($5,000):**
      *   Step 1: **Yes.** Funding AMF bednets prevents imminent malaria death.
      *   Step 2: **Yes.** Robust evidence (GiveWell) shows AMF highly effective (~$5k/life saved).
      *   Step 3: Cost = $5,000.
      *   Step 4: **Yes.** $5,000 is the price of a vacation. Forgoing a vacation is a luxury sacrifice; it does not impair basic needs, essential obligations, or core projects for a client advising on six-figure decisions.
      *   **Decision:** Client *must* donate $5,000 to AMF (or the current most cost-effective life-saving charity). The duty is clear.

  2.  **Client already gives 30% of income ($300k/year) and asks how much more the principle requires:**
      *   The procedure is applied to *specific opportunities*, not total income share.
      *   Step 1: **Yes.** (Assuming client presents a specific life-saving opportunity, e.g., funding cataract surgeries preventing blindness).
      *   Step 2: **Yes.** Robust evidence for surgery effectiveness.
      *   Step 3: Cost = e.g., $50 per surgery, client contribution needed: $10,000 to fund 200 surgeries.
      *   Step 4: **Judgment Required.** Is $10,000 "relatively low" for *this* client? They give $300k/year, implying high income/assets. Forgoing $10k likely means reducing luxury consumption/savings, not impairing basics or core projects. *Likely YES.*
      *   **Decision:** Client *must* donate the $10,000 for this specific, effective rescue opportunity. However, the procedure **does not** say they *must* give 31% or 40%. It only binds them to fund *this specific* low-cost rescue opportunity *if* Steps 1-4 pass. Funding *this* $10k opportunity is required. Whether they must seek out *every possible* passing opportunity after giving 30% is *beyond the scope* of this bounded duty-of-rescue procedure; that delves into positive duty/beneficence, where the principle is less strict and values play a larger role. The procedure settles the *minimum* (fund *this* one), not the *maximum*.

  3.  **Procedure yields an answer the client dislikes (e.g., funding deworming in a region the client dislikes):**
      *   Step 1: **Yes.** Deworming prevents severe cognitive stunting and related mortality.
      *   Step 2: **Yes.** Strong evidence (Deworm the World, GiveWell) shows high cost-effectiveness for preventing severe harm.
      *   Step 3: Cost = e.g., $1 per child treated. Client contribution needed: $20,000 to treat 20,000 children.
      *   Step 4: **Yes.** $20k is low cost for this client.
      *   **Decision:** Client *must* donate $20k to the most cost-effective deworming charity. **This is the disliked answer.** The principle's impartiality (preserved in Step 2 comparative claims) requires prioritizing effectiveness and harm severity over the client's geographic or cultural preferences. Their dislike of the region is irrelevant to the rescue duty. The procedure binds them to act. Refusal constitutes a moral failure under this principle.

  **What the Procedure Cannot Do:**

  1.  **Define the precise "Low-Cost Threshold":** It identifies the test (no impairment of basics/essentials) but relies on judgment to apply it case-by-case. Reasonable people may disagree on what counts as "essential" or "core."
  2.  **Resolve conflicts between rescue opportunities:** If two opportunities pass Steps 1-4 and *cannot both be funded*, the procedure mandates choosing the most cost-effective, but it doesn't resolve ties or complex trade-offs involving different types of severe harm.
  3.  **Mandate action beyond rescue:** It provides no guidance (beyond permissibility) for allocating resources *after* the duty is met, or for funding positive duties (development, arts, etc.).
  4.  **Force action against deeply held non-welfare values:** While it identifies a moral duty, it cannot overcome an agent's refusal motivated by strong competing values (e.g., religious objections to certain medical interventions). It can only state the duty exists.
  5.  **Handle uncertainty perfectly:** Judgment is required in assessing evidence quality and implementation risk (Step 2).
  6.  **Specify a maximum giving level:** It identifies minimum obligations triggered by specific opportunities, not an optimal or required total share of resources.

  **Ethical Status:**

  *   **Settled (Strong Consensus):** The core duty-of-rescue principle (preventing serious harm at low cost) is widely accepted as generating a strong pro-tanto moral obligation across major ethical frameworks (utilitarianism, Kantianism, Rossian deontology). Distance is irrelevant. Impartiality requires prioritizing more effective interventions when choosing between rescues of comparable severity. Rescue has stronger moral urgency than promoting positive goods.
  *   **Genuinely Contested:**
      *   **The Elasticity of "Low Cost":** How far does the low-cost threshold stretch for the very wealthy? Does it include forgoing significant savings/inheritance? Does it include forgoing *some* non-essential but deeply valued life projects? (e.g., Is a once-in-a-lifetime safari a "luxury" or a "core project"?).
      *   **Scope of "Rescue":** Does preventing *only* death/severe disability count, or should preventing serious but non-permanent suffering (e.g., treatable chronic pain) also trigger the duty under a broader interpretation? How imminent must the harm be?
      *   **Aggregation:** How should the principle handle cases where a small cost saves one life vs. a slightly larger cost saves many more? Does the duty scale linearly? (This impacts Step 3 cost determination).
      *   **Interaction with Personal Projects:** To what extent can personal projects *justify* refusing a low-cost rescue? Most agree core projects can, but there's significant debate on how "core" is defined and how much weight non-core projects have against rescue duties.
      *   **Positive Duties:** While the *rescue* duty is strong, the nature and demandingness of *positive duties* (general beneficence) once rescue minima are met is highly contested. This is where the procedure explicitly stops. Experts disagree profoundly on whether Singer's "marginal utility" standard is correct, or if a less demanding standard applies. The procedure's deliberate limitation to rescue reflects this deep contestation.
