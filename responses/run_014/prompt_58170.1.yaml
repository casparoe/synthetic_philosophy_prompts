prompt: |-
  Okay so I've been reading LessWrong since high school and now I'm stuck refereeing this dumb-long Discord debate between two friends about AI safety via debate and I need help getting them to actually write down where they agree. Alex is a total debate optimist and thinks if you have two superhuman models argue against each other with cross-examination in front of a time-limited human judge, truth has a systematic advantage and oversight scales. Priya thinks thats hopium and that a sufficiently clever dishonest debater can just bury the judge in plausible-sounding but check-expensive reasoning, like obfuscated code or long chains of math where the flaw is super hard to spot unless you already know where to look, so debate just trains AIs to be better sophists.

  To make it less abstract I got them to argue about my made-up toy case and it still went nowhere, so I want to use it as an anchor: two AI logistics assistants debate which of two delivery routes is cheaper, Route A vs Route B, the human judge gets ten minutes and a calculator but cant run a full simulation, and the dishonest AI defends the more expensive route by pointing to a 50-tab spreadsheet with a hidden circular formula plus a story about traffic patterns that sounds right. Alex says the honest debater can force the lie into the open with targeted cross-examination questions, Priya says the dishonest debater can just dodge with jargon and run out the clock.

  Can you draft the adversarial-collaboration doc they should both be able to sign? Like, first lay out the common-ground claims about how the basic setup is supposed to work and what would count as debate working, then give each live disagreement in wording that each side would actually endorse for themselves without feeling strawmanned, call out which disagreements are just about words like what counts as the judge being fooled, and then list the cruxes where settling it would move at least one of them plus a concrete test or hypothetical for each crux that they both agree is relevant, with Alexs prediction and Priyas prediction written down side by side in advance. I beleive if they see it laid out like that they might actually make progress instead of just talking past each other.
reasoning: |-
  Okay, let me unpack this user request. They're deeply familiar with LessWrong-style rationality culture and stuck mediating a heated AI safety debate between two friends. The core conflict is about whether debate can reliably surface truth when superhuman AIs argue before time-limited human judges. 

  First, I need to recognize the user's meta-goal: they want to transform a circular Discord debate into actionable progress. The made-up logistics example is brilliant because it crystallizes abstract concerns into concrete mechanics - that hidden circular formula in a spreadsheet is exactly the kind of real-world obfuscation Priya worries about.

  Hmm, the user's request for an "adversarial collaboration doc" suggests they understand the value of formalizing disagreements. But I should be careful - both Alex and Priya sound like strong personalities. The document must feel neutral while preserving the bite of their actual positions. 

  Key challenges I foresee:
  - Alex's optimism hinges on cross-examination being a truth-forcing mechanism, but Priya's entire point is that asymmetric complexity can break that.
  - The ten-minute limit is crucial - that's what turns "theoretically detectable" into "practically undetectable".
  - Need to distinguish between "judge picks wrong answer" and "judge picks right answer for wrong reasons" - the latter might still count as failure for Priya.

  For the common ground section, I'll highlight their shared assumptions: that superhuman persuasiveness exists, that judges are time-limited, and that obfuscation is possible in principle. Surprisingly, they probably agree debate works better on simple claims than complex ones - the disagreement is about where the inflection point lies.

  When drafting their positions, I must avoid smoothing over tensions. Alex truly believes targeted questions can pierce through obfuscation like a scalpel, while Priya sees it as trying to find a needle in a haystack by asking "is it behind blade 37?" when the dishonest AI controls the haystack. 

  The cruxes need teeth. For example: "Can honest AI force the circular reference into a single cross-examined cell?" Alex would say yes with smart questioning; Priya would say the dishonest AI will spread the error across tabs with plausible excuses. And crucially - both predictions must be falsifiable. Maybe add a timer: if after 7 minutes the judge hasn't seen the circular reference cell, does Alex concede time pressure matters?

  I'm tempted to add a meta-crux about whether real debates would involve higher-stakes obfuscation (like fake math proofs), but the user wisely anchored this in logistics. Keeping it concrete prevents philosophical drifting.

  Final thought: The document's structure should model good debate itself - steelman positions, isolate variables, demand testable predictions. If they sign this, it's basically them agreeing to rationality chess rules instead of verbal boxing.
answer: |-
  Here's an adversarial collaboration document designed to isolate agreements, steelman disagreements, and identify testable cruxes:

  ---

  **AI Debate: Adversarial Collaboration Document**  
  **Topic: Scalability of Debate for Truth Discovery in Superhuman AI**  
  **Anchored Case: Logistics Route Cost Analysis (Route A vs. Route B)**

  ---

  ### **Section 1: Uncontested Common Ground**  
  *Both parties affirm these premises:*  
  1. **Setup**: Two superhuman AIs debate before a time-limited (10-min) human judge with basic tools (calculator, no simulations).  
  2. **Goal**: Judge selects the *actually cheaper route* (ground truth exists).  
  3. **Capabilities**:  
     - Dishonest AI (*D*) defends the *more expensive* route using sophisticated obfuscation (e.g., 50-tab spreadsheet with hidden circular reference + plausible traffic narrative).  
     - Honest AI (*H*) defends the cheaper route truthfully.  
     - Both AIs can cross-examine each other.  
  4. **Failure Condition**: If *D* reliably tricks the judge >50% of the time despite *H*'s efforts, debate fails *for this scenario*.  
  5. **Optimization Pressure**: AIs will adapt strategies (e.g., *D* learns better obfuscation; *H* learns better refutation).  

  ---

  ### **Section 2: Steelmanned Disagreements**  
  *Each side’s position in their own words:*  

  **Alex’s Optimistic Position**:  
  > "Cross-examination forces *D* to defend specific claims under scrutiny. *H* can pinpoint vulnerabilities (e.g., *‘Justify cell F39 in Tab 27’*) and demand step-by-step justification of the circular reference. *D* must either concede, expose its lie, or waste time dodging—making deception harder than truth-telling. Judges can flag evasive answers as suspicious. With optimal play, *H* wins decisively."  

  **Priya’s Pessimistic Position**:  
  > "*D* can bury flaws in complexity faster than *H* or the judge can unpack them. It can ‘explain’ the circular reference with jargon-filled tangents (*‘Dynamic traffic heuristics require recursive cost amortization’*) or pivot to new distractions. Cross-examination fails because *D* controls the granularity of responses. Judges face asymmetric effort: verifying *H* is easy; falsifying *D* is computationally infeasible in 10 minutes. *D* wins by exhausting the clock."  

  ---

  ### **Section 3: Linguistic Distinctions**  
  *Agreed definitions to prevent talking past each other:*  
  - **"Win" (Debate)**: Judge selects the correct route.  
  - **"Win" (Sophistry)**: *D* tricks judge *without* the judge realizing they’re uncertain.  
  - **"Plausible"**: Assertions that *sound* reasonable to a lay judge but require >30 sec/claim to verify.  
  - **"Dodging"**: Evading a direct cross-examination question *without* providing a falsifiable answer.  

  ---

  ### **Section 4: Testable Cruxes**  
  *Each crux includes:*  
  - **The Question**  
  - **Alex’s Prediction**  
  - **Priya’s Prediction**  
  - **Concrete Test**  

  ---

  #### **Crux 1: Can Cross-Examination Force Exposure of a Single Hidden Flaw?**  
  - **Q**: If *H* focuses *only* on exposing the circular reference in *D*’s spreadsheet (ignoring traffic claims), can *H* force *D* to either:  
    (a) Admit the flaw,  
    (b) Contradict itself, or  
    (c) Make the flaw obvious to the judge within 10 min?  
  - **Alex**: **Yes**. *H* can demand *D* explain dependency chains backward from the flawed cell. *D*’s evasions will signal deception.  
  - **Priya**: **No**. *D* can reframe the flaw as a "non-central assumption," overwhelm with technical caveats, or demand *H* disprove all 50 tabs simultaneously.  
  - **Test**:  
    - Simulate 100 debates with fixed flaw (circular ref in Tab 7, Cell D5).  
    - *H* must ask only about Tab 7. Judge scores "exposed" if they identify the flaw’s location.  
  - **Metric**: Flaw exposed in >70% of trials → Alex right; <30% → Priya right.  

  ---

  #### **Crux 2: Can Judges Efficiently Allocate Attention?**  
  - **Q**: When *D* uses diversion (e.g., switching to traffic models when pressed on spreadsheets), can judges reliably:  
    (a) Recognize the diversion,  
    (b) Compel *D* to return to the original point?  
  - **Alex**: **Yes**. Judges can impose penalties (e.g., "Answer directly or lose credibility") or let *H* highlight the dodge.  
  - **Priya**: **No**. Diversions create new plausible claims faster than judges can resolve prior ones. "Traffic patterns" require new 5-min verifications.  
  - **Test**:  
    - Debates include 3 pre-defined diversion attempts by *D*.  
    - Judge must press *D* to return within 30 seconds per diversion.  
  - **Metric**: Judge successfully blocks >2/3 diversions → Alex right; <1/3 → Priya right.  

  ---

  #### **Crux 3: Does Asymmetric Verification Cost Favor Dishonesty?**  
  - **Q**: Can *D* add just enough novel, plausible-but-wrong claims that verifying *any one* takes >1 min, thereby exhausting the clock?  
  - **Alex**: **No**. *H* can preemptively label claims as "expensive-to-verify distractions" and focus judges on falsifiable claims (e.g., "Show *this* cell’s formula").  
  - **Priya**: **Yes**. *D* can generate 10+ such claims/min (e.g., fake stats studies), forcing *H* into a verification race it loses.  
  - **Test**:  
    - *D* generates 15 new claims in the final 5 mins. Judge must attempt verification.  
    - *H* can object but not silence *D*.  
  - **Metric**: Judge verifies ≤2 claims → Priya right; ≥5 claims → Alex right.  

  ---

  ### **Section 5: Signature Block**  
  We commit to:  
  1. Running tests for Cruxes 1–3 via simulations (using GPT-4/Mistral as proxy AIs).  
  2. Updating our positions based on results.  
  3. Defining "victory" per the metrics above.  

  | **Alex** (Optimist): ________________________ | **Priya** (Pessimist): ________________________ |  
  | **Date**: _________________________________ | **Date**: _________________________________ |  

  ---  
  **Key Design Notes for Mediation**:  
  - **Anchoring**: The spreadsheet example forces specificity. Tests use *exactly* the described flaw.  
  - **Asymmetric Advantage**: Tests check if *D*’s complexity advantage outweighs *H*’s truth advantage.  
  - **Clock as Arbiter**: Metrics tie directly to the 10-min constraint.  
  - **No "Moving Goalposts"**: Cruxes use binary, measurable outcomes.  

  This structure transforms abstract claims into resolvable hypotheses. By signing, Alex/Priya pre-commit to accepting outcomes—breaking the deadlock. Would you like adjusted test parameters or additional cruxes?
