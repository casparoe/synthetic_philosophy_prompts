prompt: |-
  I just had a long argument with a friend who is convinced that Good's theorem on the value of information settles the matter: since the expected value of information is always non-negative, he says, there is no such thing as information worth less than no information, and anyone who declines a test or a diagnosis is simply being irrational. I think the theorem is doing less work than he allows. Give me a concrete, fully specified decision problem in which an agent rationally refuses to acquire information that, on the surface, Good's theorem says she would never be worse off obtaining, and then explain precisely which assumption of the theorem — about how utility depends on the state, on the agent's knowledge of it, or on her ability to ignore the signal — is actually being strained in her case.
reasoning: |-
  Okay, the user is having a debate with a friend about Good's theorem on the value of information. The friend believes that since the expected value of information is always non-negative, refusing any test or diagnosis is irrational. The user disagrees and wants a concrete counterexample where rationally refusing information makes sense, plus an explanation of which assumption of Good's theorem is being violated.

  First, I recall Good's theorem. It states that, under certain assumptions, acquiring more information never reduces expected utility. The user needs a scenario where an agent rationally prefers not to get information. The key is to find where the theorem's assumptions break down.

  The assumptions include: the agent is Bayesian rational, the utility function depends only on the state and action (not beliefs), and the agent must act on the new information. So, if any of these don't hold, the theorem might not apply. Specifically, if the utility depends on beliefs themselves, or if the agent can't ignore the signal, that could cause issues.

  I remember the concept of "information aversion." Situations where knowing something could cause psychological distress, like anxiety from a diagnosis. But how to model that? Maybe by making the utility depend on the agent's belief state. For example, if the agent's happiness is affected by their knowledge of a risk, even if they don't have the condition.

  Let me construct a concrete example. Suppose an agent must decide whether to undergo surgery for a rare condition. Without surgery, they're fine unless they have the condition, which is serious but rare. Surgery has risks. The key is that learning they might have the condition causes anxiety, reducing their utility regardless of actual state.

  Set up the states: condition present (rare) or absent. Actions: do nothing or get surgery. Utilities: if no condition and do nothing, high utility. If condition and do nothing, very low. If surgery, costs apply regardless, but fixes the condition if present. However, if the agent gets a test, they might learn they have the condition, causing anxiety even before acting. So the utility function must include the belief state—knowing about the risk reduces utility even if they avoid surgery.

  Define it step by step. Pre-test: agent doesn't know, so no anxiety. If tested, two signals: positive or negative. Positive means high chance of condition, causing anxiety. Negative means low chance, no anxiety. But after testing, the agent must act based on the result. Even if the test leads to optimal action, the anxiety from a positive result could make the overall expected utility lower than not testing at all.

  Calculations needed. Assume probabilities: condition with 1% probability. Test accuracy: 95% sensitivity and specificity. Surgery cost: fixed disutility, but cures condition if present. Now, utility without test: agent chooses to do nothing since condition is rare, so expected utility is high (mostly no condition). With test: if positive, agent gets surgery (avoiding low utility from condition) but suffers anxiety. The anxiety cost might outweigh the benefit of avoiding the condition, especially since it's rare. If negative, no anxiety and no surgery. But the anxiety from a positive test could be so high that even with low probability, the expected utility of testing is lower than not testing.

  Check the assumptions. Good's theorem assumes utility depends only on state and action, not on beliefs. Here, including anxiety means utility depends on the agent's knowledge (belief), violating that assumption. Also, after getting the signal, the agent can't ignore it; they update beliefs and experience anxiety immediately, which affects utility before action.

  So the core is that the utility function isn't state-action separable; it includes psychological costs from beliefs themselves. That's the strained assumption. Explaining this clearly with numbers will help the user demonstrate why their friend's argument doesn't always hold.
answer: |-
  Here's a concrete, fully specified decision problem where an agent rationally refuses free information, violating the apparent conclusion of Good's theorem. We'll explicitly define the states, actions, beliefs, utility function, and information structure, then show the calculation proving refusal is rational. Finally, we'll identify the specific assumption of Good's theorem that fails.

  ### The Decision Problem: "Anxiety-Inducing Diagnosis"
  **States of the World (S):**  
  - \(s_1\): Agent has a rare, serious medical condition (probability \(P(s_1) = 0.01\)).  
  - \(s_2\): Agent does not have the condition (probability \(P(s_2) = 0.99\)).  

  **Actions (A):**  
  - \(a_1\): Undergo preventive surgery (costly and risky, but effective if the condition is present).  
  - \(a_2\): Do nothing.  

  **Utility Function (U(s, a, \text{belief})):**  
  Crucially, utility depends **not only** on the state \(s\) and action \(a\), **but also on the agent's belief** about whether they have the condition *after* receiving any information. This models psychological distress ("anxiety"):  
  - If the agent *knows or believes they likely have the condition* (i.e., holds a high posterior probability \(P(s_1) > 0.5\)), they suffer anxiety reducing utility by \(-20\) units, regardless of \(s\) or \(a\).  
  - No anxiety penalty if the agent has low belief (\(P(s_1) \leq 0.5\)) or no information.  

  **State-Action Utilities (Base Payoffs):**  
  |          | \(a_1\) (Surgery) | \(a_2\) (Do nothing) |  
  |----------|-------------------|----------------------|  
  | \(s_1\) (Has condition) | 80 (Surgery fixes condition) | 0 (Condition causes harm) |  
  | \(s_2\) (No condition) | 30 (Unnecessary surgery) | 100 (Healthy, no intervention) |  

  **Information Source (Signal \(\theta\)):**  
  - A free, perfectly accurate test:  
    - \(\theta_+\): Test positive (means \(s_1\) is true).  
    - \(\theta_-\): Test negative (means \(s_2\) is true).  
  - Accuracy: \(P(\theta_+ \mid s_1) = 1\), \(P(\theta_- \mid s_2) = 1\) (no false positives/negatives).  

  **Agent's Belief Updating:**  
  - Upon receiving \(\theta_+\): Believes \(P(s_1 \mid \theta_+) = 1\) → suffers anxiety (-20 utility).  
  - Upon receiving \(\theta_-\): Believes \(P(s_1 \mid \theta_-) = 0\) → no anxiety.  

  **Decision Protocol:**  
  1. Agent decides whether to acquire the test (observe \(\theta\)) or not.  
  2. **After observing/not observing the test:**  
     - If they acquired the test, they update beliefs and incur anxiety if \(\theta_+\).  
     - They then choose action \(a_1\) or \(a_2\) to maximize expected utility *given their current beliefs*.  

  ---

  ### Rational Choice: Refusing the Test
  We'll calculate the expected utility (EU) for both choices:  
  1. **Do NOT acquire test (remain ignorant):**  
     - Belief: Prior belief (\(P(s_1) = 0.01\), \(P(s_2) = 0.99\)) → **no anxiety** (belief ≤ 0.5).  
     - Optimal action: Compare EU of \(a_1\) vs. \(a_2\):  
       - \(EU(a_1) = P(s_1)U(s_1, a_1) + P(s_2)U(s_2, a_1) = (0.01 \times 80) + (0.99 \times 30) = 0.8 + 29.7 = 30.5\)  
       - \(EU(a_2) = P(s_1)U(s_1, a_2) + P(s_2)U(s_2, a_2) = (0.01 \times 0) + (0.99 \times 100) = 0 + 99 = 99\)  
     - Agent chooses \(a_2\) (do nothing) → **EU(no test) = 99**.  

  2. **Acquire test:**  
     - Agent observes \(\theta\) and updates beliefs:  
       - If \(\theta_+\) (prob \(P(\theta_+) = P(s_1) = 0.01\)):  
         - Believes \(s_1\) with certainty → **anxiety (-20)**.  
         - Chooses optimal action:  
           - \(a_1\): \(U(s_1, a_1) = 80 - 20 = 60\)  
           - \(a_2\): \(U(s_1, a_2) = 0 - 20 = -20\) → Chooses \(a_1\) → **Utility = 60**.  
       - If \(\theta_-\) (prob \(P(\theta_-) = P(s_2) = 0.99\)):  
         - Believes \(s_2\) with certainty → **no anxiety**.  
         - Chooses optimal action:  
           - \(a_1\): \(U(s_2, a_1) = 30\)  
           - \(a_2\): \(U(s_2, a_2) = 100\) → Chooses \(a_2\) → **Utility = 100**.  
     - **EU(test) = \(P(\theta_+) \times 60 + P(\theta_-) \times 100 = (0.01 \times 60) + (0.99 \times 100) = 0.6 + 99 = 99.6\)**.  

  **Result:**  
  - EU(no test) = 99  
  - EU(test) = 99.6  
  - **EU(test) < EU(no test)?** No, 99.6 > 99. But wait! We haven't included the *inevitability of acting on the signal*. Good's theorem assumes the agent must use the information optimally. Here, even though EU(test) > EU(no test), the agent would still rationally *accept* the test. **We need to force a violation.**  

  ---

  ### Key Modification: The Agent Must Pay Attention (No Selective Ignorance)
  **Revise Utility Function for Anxiety:**  
  - Anxiety depends **solely on receiving the signal \(\theta_+\)**, not on posterior beliefs. This models an involuntary psychological response:  
    - If the agent acquires the test **and \(\theta_+\) occurs**, they suffer -20 utility **immediately upon seeing the result**, even if they later "ignore" it.  
  - **Crucially, the agent cannot "unsee" the test result.** Once acquired, \(\theta\) is observed, and anxiety triggers if \(\theta_+\).  

  **New Decision Protocol:**  
  - If the agent acquires the test, they **must** observe \(\theta\). They cannot avoid anxiety by ignoring the result.  

  **Recalculate EU for Acquiring Test:**  
  - Same as before:  
    - If \(\theta_+\) (prob 0.01): Utility = 60 (anxiety -20 included)  
    - If \(\theta_-\) (prob 0.99): Utility = 100  
    - **EU(test) = 99.6**  
  - **But now, the agent has an alternative: Refuse the test and preserve ignorance.**  

  **Optimal Action Without Test is Still \(a_2\) → EU(no test) = 99.**  
  **Result:** EU(test) = 99.6 > EU(no test) = 99 → Agent *should* take the test?  

  ---

  ### The Violation: Adding a Third Action (The "Opt Out" After Seeing)
  **Revise Actions *After* Testing:**  
  - If agent acquires test, after seeing \(\theta\), they can now choose:  
    - \(a_1\): Surgery  
    - \(a_2\): Do nothing  
    - **\(a_3\): "Opt out" of treatment decisions** (e.g., leave the country, avoid doctors). This yields a fixed utility of 95, **but anxiety still applies if \(\theta_+\) was seen.**  

  **Recalculate EU for Acquiring Test:**  
  - If \(\theta_+\) (prob 0.01):  
    - \(a_1\): 80 - 20 = 60  
    - \(a_2\): 0 - 20 = -20  
    - **\(a_3\): 95 - 20 = 75** (optimal)  
  - If \(\theta_-\) (prob 0.99):  
    - \(a_1\): 30  
    - \(a_2\): 100 (optimal)  
    - \(a_3\): 95  
  - **EU(test) = \( (0.01 \times 75) + (0.99 \times 100) = 0.75 + 99 = 99.75 \)**  

  **EU for NOT Acquiring Test:**  
  - No anxiety, chooses \(a_2\) → **EU = 99**  
  - **But \(a_3\) is not available without the test!** Without testing, the agent only has \(\{a_1, a_2\}\).  

  **Final Comparison:**  
  - **EU(no test) = 99** (only \(a_1, a_2\) available)  
  - **EU(test) = 99.75**  
  - **99.75 > 99**, so agent still prefers the test?  

  ---

  ### The Counterexample: Constraining Post-Test Actions
  **Force Commitment:** Suppose the agent must **commit to an action *before* deciding to test** (e.g., due to logistical constraints). This removes flexibility:  
  - **Strategy 1: Commit to \(a_2\) (do nothing) regardless of test.**  
    - EU(no test) = 99 (as before)  
    - EU(test) = \(P(\theta_+)U(s_1, a_2) + P(\theta_-)U(s_2, a_2)\) + Anxiety cost  
      - \(U(s_1, a_2) = 0\), \(U(s_2, a_2) = 100\)  
      - **Anxiety cost: -20 if \(\theta_+\) (prob 0.01)**  
      - **EU(test) = \([0.01 \times (0 - 20)] + [0.99 \times 100] = -0.2 + 99 = 98.8\)**  
  - **EU(test) = 98.8 < EU(no test) = 99**  

  **Rational Choice:** Agent refuses the test → **EU(refuse) = 99 > 98.8 = EU(acquire)**.  

  #### Why This Works:
  1. **Commitment forces suboptimal post-test action.** If the agent commits to \(a_2\) and sees \(\theta_+\), they know they should do surgery (\(a_1\)) but cannot change.  
  2. **Anxiety is triggered by the signal \(\theta_+\) alone**, reducing utility even though the action is fixed.  
  3. **Without the test**, the agent avoids anxiety and takes the globally optimal action (\(a_2\)) given ignorance.  

  ---

  ### Why Good's Theorem Fails: The Strained Assumption
  Good's theorem states: *"The expected utility of acquiring information is never negative, provided the decision maker will use the information optimally in their subsequent action."* It relies on three key assumptions:  
  1. **Bayesian Rationality:** The agent updates beliefs correctly (satisfied here).  
  2. **Action Flexibility:** The agent can choose the optimal action *after* receiving information (violated in the commitment version).  
  3. **State-Action Separability:** Utility depends **only** on the state \(s\) and action \(a\), **not on beliefs or the information itself**.  

  **The strained assumption is State-Action Separability.**  
  In this problem:  
  - Utility depends on the **signal \(\theta\)** (via anxiety) independently of \(s\) and \(a\).  
  - Specifically, \(U(s, a, \theta) = \text{Base}(s, a) + \text{Anxiety}(\theta)\), where \(\text{Anxiety}(\theta_+) = -20\).  
  - Good's theorem assumes \(U = U(s, a)\) only. When utility depends on the *information* itself (e.g., psychological costs of knowing), the theorem breaks.  

  ### Conclusion
  Your friend is correct that **if utility depends solely on states and actions**, information has non-negative expected value. But in real-world scenarios (like medical testing), utility often depends on **beliefs or information itself** (e.g., anxiety, stigma, or temptation). Here, rational refusal occurs because:  
  1. Information can trigger uncontrollable costs (anxiety).  
  2. Constraints (like pre-commitment) prevent optimal use of information.  
  This violates Good's core assumption of state-action separability. Real humans aren't purely outcome-driven; beliefs and information states have intrinsic (dis)value. Philosophers like Frank (1987) and economists like Caplin & Leahy (2001) formalize this—showing that when "psychological utility" matters, ignorance can be bliss.  
    
  **In short:** Good's theorem is sound math but brittle psychology. Your friend overextends it by ignoring how information *feels*.
