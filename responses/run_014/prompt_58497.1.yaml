answer: |-
  ### Facilitation Plan: "The Contribution Dilemma"

  #### **Activity Title**: The Contribution Dilemma  

  #### **Phase Timings** (Total: 80 min)  
  - **Introduction & Setup**: 10 min  
  - **Stage A: Contribute/Retain Choice**: 15 min  
  - **Stage B: Bonus Pool Entry**: 15 min  
  - **Tallying & Results**: 15 min  
  - **Closing Discussion**: 25 min  

  #### **Materials Needed**  
  - Slips of paper (2 per participant: 1 for Stage A, 1 for Stage B)  
  - Pens/pencils  
  - Two opaque collection boxes (labeled "Stage A" and "Stage B")  
  - Whiteboard/flip chart + markers  
  - Participant ID numbers (pre-written on slips for anonymity)  
  - Master tally sheet (for facilitator)  

  #### **Token System**  
  - Use "workshop scrip" (points): No monetary value, purely for comparison.  
  - Final scores are symbolic; focus on relative outcomes.  

  ---

  ### **Step-by-Step Procedure**  

  #### **1. Introduction & Setup (10 min)**  
  **Wording**:  
  > "Welcome! Today we’ll explore a decision-making exercise. Each of you will make two private choices using these slips. We’ll use ‘workshop scrip’—points with no real-world value—to track outcomes. Everyone faces identical rules. No talking during choices, but we’ll discuss afterward. Write your participant ID on both slips."  

  **Actions**:  
  - Distribute pre-numbered slips.  
  - Emphasize privacy and identical conditions.  

  ---

  #### **2. Stage A: Contribute or Retain (15 min)**  
  **Rules Displayed on Board**:  
  ```  
  STAGE A:  
  - Choose ONE:  
    - [ ] CONTRIBUTE: You get 0 scrip. Each *other* person gets 1 scrip.  
    - [ ] RETAIN: You get 3 scrip, regardless of others.  
  ```  

  **Wording**:  
  > "Make your choice now. Remember: everyone has the same options. Fold your slip and drop it in the Stage A box. No communication, please."  

  **Facilitator Notes**:  
  - Circulate to ensure clarity.  
  - Collect all slips in the box.  

  ---

  #### **3. Stage B: Bonus Pool Entry (15 min)**  
  **Eligibility Check**:  
  - Quickly sort Stage A slips privately.  
  - Hand Stage B slips **only to those who chose "Retain"**.  

  **Rules Displayed on Board**:  
  ```  
  STAGE B (FOR RETAINERS ONLY):  
  - Choose ONE:  
    - [ ] ENTER BONUS POOL:  
      - If EXACTLY ONE enters: +15 scrip.  
      - If ZERO or MULTIPLE enter: −1 scrip.  
    - [ ] DO NOT ENTER: No change.  
  ```  

  **Wording**:  
  > "If you received a Stage B slip, you chose RETAIN. Now decide whether to enter the bonus pool. Your choice affects only your scrip. Fold and drop in the Stage B box."  

  **Facilitator Notes**:  
  - Non-retainers sit idle (no slip).  
  - Preserve anonymity; avoid revealing retainer identities.  

  ---

  #### **4. Tallying & Results (15 min)**  
  **Tally Process**:  
  1. **Stage A**:  
     - Count total participants (N).  
     - Announce:  
       - "X chose CONTRIBUTE. Y chose RETAIN."  
     - Calculate base scrip:  
       - Contributors: 0 + (X − 1) scrip (receives 1 from each *other* contributor).  
       - Retainers: 3 + X scrip (base 3 + 1 per contributor).  

  2. **Stage B**:  
     - Count bonus entries (Z).  
     - Announce:  
       - "Z retainers entered the bonus pool."  
     - Apply bonus outcomes:  
       - If Z = 1: Winner gains +15 scrip.  
       - If Z > 1: All entrants lose 1 scrip.  

  **Display Results**:  
  | **Group**       | **Base Scrip** | **Bonus Adjustment** | **Final Scrip** |  
  |-----------------|----------------|-----------------------|----------------|  
  | Contributors    | X − 1          | N/A                  | X − 1          |  
  | Non-entering R  | 3 + X          | 0                    | 3 + X          |  
  | Entering R (Z=1)| 3 + X          | +15                  | 18 + X         |  
  | Entering R (Z>1)| 3 + X          | −1                   | 2 + X          |  

  **Wording**:  
  > "Let’s see how choices played out. Contributors each earned [X−1] scrip. Most retainers earned [3+X], but those entering the bonus pool [adjusted accordingly]."  

  ---

  #### **5. Closing Discussion (25 min)**  
  **Guiding Questions**:  
  1. **Stage A Reflections**:  
     - "What made CONTRIBUTE tempting despite RETAIN guaranteeing personal gain?"  
     - "If you contributed, did you assume others might do the same? Why?"  

  2. **Stage B Reflections**:  
     - "Retainers: What made the bonus pool appealing or risky?"  
     - "Did knowing others faced the same choice affect your decision?"  

  3. **Core Tensions**:  
     - "Notice: In Stage A, mutual contribution helps everyone, but individual incentives push against it. How did that feel?"  
     - "In Stage B, the bonus created a ‘golden opportunity’—but only if you were the sole taker. How did that change your trust in others’ choices?"  

  **Conceptual Bridge**:  
  - **Without jargon**: "We experienced a tension between ‘what’s best for me alone’ and ‘what’s best if we all do the same.’"  
  - **Introduce terms**: "Philosophers call this a *coordination dilemma*. The bonus pool resembles a *luring lottery*—it rewards defection but collapses if too many defect."  
  - **Key insight**: "Believing others think like you can encourage cooperation... until a side prize makes that belief feel unstable."  

  ---

  ### **Implementation Challenges & Remedies**  
  1. **Challenge**: Confusion about scrip calculations.  
     **Remedy**: Simplify with visual aids (e.g., "If 5 contribute, each gets 4 scrip: 1 from each of the other 4").  

  2. **Challenge**: Participants discussing choices mid-exercise.  
     **Remedy**: Restate rules firmly; separate seats if needed.  

  3. **Challenge**: Slow Stage B eligibility checks.  
     **Remedy**: Use a helper to sort slips quickly.  

  4. **Challenge**: Disappointment over "unfair" outcomes.  
     **Remedy**: Stress that scrip has no value; focus on the thought process.  

  ---

  ### **Limit of the Exercise**  
  **Candid Statement**:  
  > "This activity cannot replicate the *diagnostic correlation* central to superrationality—the assumption that all players are identical rational agents who know they share identical reasoning. In reality, participants bring diverse motives and doubts. The exercise lets you *feel* the tension, but the theoretical leap—believing others will mirror your choice—must be explained afterward."  

  ---

  ### **JSON Summary**  
