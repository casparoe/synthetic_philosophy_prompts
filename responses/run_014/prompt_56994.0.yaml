answer: |-
  **Bottom line: Jefferson's 19-year rule is a pragmatic calculation derived from his core principle ("earth belongs to the living"), but it weakens his idealized model and faces significant objections when applied to laws or constitutions.**

  ### Plain English Walkthrough of Jefferson's Argument
  1.  **Core Premise (Assumed self-evident):** "The earth belongs in usufruct to the living." The dead have no rights or power over it. Property is held *in trust* for use by the current living generation.
  2.  **Idealized Model Premise:** Imagine synchronized generations: all born, become adults (21), and die (at 55 = 21 + 34) on the same days. Each generation is a distinct bloc.
  3.  **Idealized Conclusion:** Each generation inherits the earth "clear of the debts and incumbrances" of the prior one. A generation can only validly contract debts payable *within its own 34-year lifespan* (e.g., max 33-year debt in year 1).
  4.  **Real-World Adjustment Premise:** Generations overlap continuously ("constant course of decay and renewal" - births/deaths daily).
  5.  **Real-World Calculation:** Using Buffon's mortality tables, Jefferson calculates how long it takes for *a majority* of the adults alive when a debt/law is made to die. He determines this is **19 years**.
  6.  **Real-World Conclusion:** No debt (or law/constitution) can bind a society for longer than **19 years** from its enactment. After this point, a majority of the adults who consented (or whose representatives consented) are dead, and the living majority never consented.

  ### Your Specific Questions Answered

  1.  **The Shift from Ideal (Clean Slate) to Real (19-Year Timer):**
      *   **Is it just a difference of degree?** No, it's a fundamental shift in *mechanism*. The ideal model treats generations as discrete, sovereign entities. The real-world calculation abandons generational sovereignty for a principle of **ongoing majority consent**.
      *   **What principle generates the 19 years?** **Consent of the governed.** Once a majority of the adults *who were alive and of age when the obligation was created* are dead, the current living majority consists of people who never had a chance to consent to that specific obligation. Their consent is presumed absent.
      *   **Why majority of adults *at the signing date*, not everyone alive or unanimity?**
          *   *Adults at Signing:* These are the people deemed capable of consenting (or being represented) *at the time the obligation was created*. Their cohort's death marks the loss of the original consenting body.
          *   *Not Everyone Alive:* Minors couldn't consent originally; including them later wouldn't retroactively validate the original act for the new majority.
          *   *Not Unanimity:* Jefferson (and democratic theory) operates on majority rule for collective decisions. Requiring unanimity of the original cohort would be impractical and wouldn't solve the core problem for later majorities.

  2.  **34 years vs. 33 years:**
      *   This is **carelessness or minor inconsistency** in describing the idealized model. He states the period *after* reaching maturity is 34 years (life from 21 to 55), but then says a debt can be contracted for *33* years in year 1. The 33 likely comes from 34 minus 1 year (perhaps implying the debt is contracted *at* age 21 and must be settled *by* age 55, not exceeding it). It doesn't materially affect the core argument or the real-world 19-year calculation.

  3.  **Does it depend on the property premise? Can it extend to laws/constitutions?**
      *   **Yes, the argument heavily depends on the property premise ("earth belongs to the living").** Jefferson explicitly links debts to property: debts are claims on the earth's produce/resources. The dead cannot own or control that produce, so they cannot create claims on it that bind future generations.
      *   **Extending to Laws/Constitutions:** Jefferson *does* extend it later in the letter, arguing constitutions/laws are also "acts of the majority" binding the minority and "naturally expire" with the majority that made them. **The Weakest Link:** The property premise is concrete (control over physical resources). Laws/constitutions govern *behavior* and create *procedural/social structures*. The argument that future generations inherit *no obligations* from past social compacts is much harder to justify than the argument they inherit no *financial debts*. Stability, continuity, and the benefits of established institutions are countervailing factors Jefferson downplays. The leap from "cannot bind resources" to "cannot bind actions/governance" is significant.

  4.  **The Ulysses Comparison & Jefferson's Objection:**
      *   Jefferson's core objection is that **a society stretched across time is NOT one continuing agent.** The synchronized-generation model explicitly makes each generation a distinct "nation" inheriting the earth afresh. The rolling case calculation reinforces this by focusing on the mortality of the *original consenting cohort*, not the continuity of the nation.
      *   **Which objection is it?** Primarily the **separate agents** objection ("the guy tying and the guy tied are not the same guy"). The synchronized model forces this view. The rolling case calculation is his attempt to *approximate* the generational reset in a continuous society, still based on the idea that binding the future requires the consent of the current living majority, which inevitably changes.
      *   **Consent Issue:** The lack of consent by the future generation is the *consequence* of them being separate agents in Jefferson's view, not the primary objection itself. His argument starts from the separateness (via property rights and the generational model), leading to the consent problem.

  ### Two Major Objections
  1.  **The Necessity of Stability:** Binding future generations is essential for long-term projects, stable institutions, protecting minority rights against transient majorities, and honoring commitments (like debts *to* other nations or creditors). Jefferson's 19-year limit would cripple national planning, investment, and trust. A society needs continuity to function.
  2.  **The Nature of Societal Identity:** Societies *are* continuous entities that evolve. Laws, constitutions, traditions, and debts are part of an ongoing social contract where each generation inherits benefits *and* obligations. Individuals join an existing society; its foundational rules are part of the package. Jefferson's discrete generational model ignores this organic continuity and the intergenerational transmission of culture and institutions that define a nation.
