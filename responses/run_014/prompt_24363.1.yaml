prompt: |-
  Construct a thought experiment that separates the two standard readings of the private language argument in Wittgenstein's later work. On the verificationist reading, a private word is empty because there is no way to distinguish a correct application from one that merely seems correct; on the rule-following-regress reading, a private criterion can never fix a meaning, because any private standard or record can be read off as conforming to any rule. Build a case in which a person genuinely can tell, at each moment, whether they are in a certain private state or not, so that the verificationist objection is defused and that reading must grant the word a meaning, yet the regress reading still blocks the word from having a determinate meaning. A private diary in which the person marks the occurrences of the state is a useful device. After the scenario, walk through what each reading concludes and why, identify the single structural feature of the case that does the work, and say what happens if that feature is removed, for instance if the state comes to be checkable within a shared practice. Close with how a defender of the verificationist reading would try to recover their objection against your case. Throughout, separate what is settled in the interpretation of the argument, namely that Wittgenstein denies that a language whose only function is to report one's own immediate states, in the strong sense that no one else could in principle understand it, is a language, while granting that our ordinary sensation language works because it is embedded in public criteria, from what is genuinely contested among those who work on it, such as whether the argument is a reductio or a therapeutic dissolution, and whether the regress or the verificationist reading is the correct one. Keep the entire response under 500 words.
