  - Map theories: e.g., neo-Stoic (P=Y, B=N, M=N, U=N, D=N). 
  - Flag limitations: e.g., attitudinal vs. perceptual may blur on dispositional questions. 

  Ethical note: Include flat affect case sensitively (no stigmatizing language). 
  British English: "fortnightly," "exculpatory," "whilst," "queue". 
