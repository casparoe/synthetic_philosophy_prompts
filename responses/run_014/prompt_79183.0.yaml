answer: |-
  Below is a complete voting procedure designed for your committee, addressing each of your requirements. It is structured as a step-by-step checklist that can be executed in 10 minutes per question. The procedure explicitly handles factual vs. evaluative questions, correlated errors, multi-option questions, and weighting—while flagging points of discretion. I then apply it to your three test cases.

  ---

  ### **Voting Procedure Checklist**
  *Total Time: 10 minutes per question. Chair leads; members participate as directed.*

  #### **Step 1: Classify the Question (1 minute)**
  - **If the question has a determinate, objective answer** (e.g., "Will this program produce the claimed outcome?"), treat as **FACTUAL**.  
  - **If the question is subjective or value-based** (e.g., "Is this worth funding?"), treat as **EVALUATIVE**.  
  - **If there are >2 options** (e.g., "Which of three programs should we fund?"), note this for Steps 3/4.  
  - *Discretion alert:* Chair classifies based on whether an objective truth exists. For borderline cases, default to evaluative.

  #### **Step 2: Handle Non-Factual or Low-Independence Cases (2 minutes)**
  - **For evaluative questions**:  
    - Majority vote decides (Step 4), but the committee has no authority to be "correct."  
    - *Stop and delegate:* If the chair determines the question lacks an objective basis (e.g., ethical judgments), they name a decider (e.g., "Delegate to [Name] for final decision"). No vote occurs.  
    - *Rationale:* Evaluative questions violate CJT assumptions (no "truth"), so delegation avoids false rigor.  
  <br>
  - **For factual questions with high correlation risk** (e.g., shared sources):  
    - Chair asks: "Did >50% of members rely on identical sources (e.g., the same two reports)?" If yes, proceed to Step 3 with **independence discounting** (see Step 3b).  
    - *Discretion alert:* Chair estimates source overlap. If uncertain, assume high correlation.

  #### **Step 3: Address Correlation and Weighting for Factual Questions (4 minutes)**
  - **3a. Initial private vote (1 minute)**:  
    - Members write their choice (e.g., "Yes/No") privately.  
    - Chair collects and counts votes but **does not reveal results**.  
  <br>
  - **3b. Estimate independence (1 minute)**:  
    - Use initial vote to calculate the **independence score (IS)**:  
      - *Unanimous (9-0)* → IS = 1 (worst)  
      - *7-2 or 8-1* → IS = 3  
      - *6-3* → IS = 5  
      - *5-4* → IS = 7 (best)  
    - *Rationale:* IS adjusts for shared information. Narrow margins imply diverse views, preserving CJT benefits.  
  <br>
  - **3c. Structured discussion (1.5 minutes)**:  
    - Members share **only new, non-overlapping insights** (e.g., "My contact at Program X said...").  
    - No repeating shared sources (e.g., sector reports).  
    - Chair enforces 15-second comments per member.  
  <br>
  - **3d. Final vote with weighting (0.5 minutes)**:  
    - Members re-vote privately.  
    - Chair weights votes using **past accuracy** (if available) or defaults to equal weight:  
      - Use member’s historical accuracy on factual questions (from minutes) if:  
        - They have ≥5 past votes.  
        - Accuracy >50%.  
      - *Weight* = log(accuracy / (1 − accuracy)).  
        - *Example:* 70% accuracy → weight = log(0.7/0.3) ≈ 0.85.  
      - If data missing/inconclusive, use equal weight (weight = 1).  
    - *Do not use stated confidence* (prone to bias, per your request).  
  <br>
  - **3e. Apply independence discount (1 minute)**:  
    - Multiply the winning margin by (IS / 9).  
    - *Example:* If "Yes" wins by 3.0 weighted votes and IS=3, discounted margin = 3.0 × (3/9) = 1.0.  
    - **If discounted margin < 1.0**: Outcome is unreliable; chair names a decider.  
    - **If discounted margin ≥ 1.0**: Result stands.  
    - *Rationale:* Partial independence preserves some CJT benefit (e.g., IS=3 → ~1/3 of CJT confidence remains).

  #### **Step 4: Voting Mechanism (3 minutes)**
  - **For two-option questions (factual or evaluative)**:  
    - Majority vote (≥5 votes). Tie → chair decides.  
  <br>
  - **For multi-option questions**:  
    - **Factual**: Use **weighted plurality voting** (from Step 3d). Highest weighted total wins.  
    - **Evaluative**: Use **approval voting**. Members vote for all acceptable options. Most approvals wins.  
    - *Rationale:* Avoids Condorcet cycles and "split vote" issues.

  ---

  ### **Test Cases**
  *Assumptions:  
  - Members: 9, with uneven expertise.  
  - Past accuracy data: 6 members have 65% accuracy (weight=0.62), 3 have 55% (weight=0.20).  
  - Independence score (IS) based on initial vote.*

  #### **Case 1: Factual Question with Heavy Source Overlap**  
  *Q: "Will Program X achieve its claimed outcome?" (Shared sources: 2 sector reports, 3 funder assessments)*  
  - **Step 1:** Factual (determinate outcome).  
  - **Step 2:** High correlation (shared sources).  
  - **Step 3a:** Initial vote: 8 "Yes," 1 "No."  
  - **Step 3b:** IS = 1 (unanimous initial vote → high correlation).  
  - **Step 3c:** Discussion yields no new insights (all repeat shared reports).  
  - **Step 3d:** Final vote: 8 "Yes" (weighted total = 6×0.62 + 3×0.20 = 4.32), 1 "No" (0.62). Margin = 4.32−0.62=3.70.  
  - **Step 3e:** Discounted margin = 3.70 × (1/9) ≈ 0.41 (<1.0) → **Unreliable. Delegate to [Named Expert]**.  
  - *Why you won’t like it:* The committee’s vote is discarded due to low independence, forcing delegation.  
  - *Discretion flags:* Chair’s call on source overlap and delegation.

  #### **Case 2: Allocation Among Three Programs**  
  *Q: "Which program (A/B/C) gets funding?" (Fixed budget; one program)*  
  - **Step 1:** Multi-option → evaluative (subjective worth).  
  - **Step 2:** No delegation (chair opts for committee vote).  
  - **Step 4 (Evaluative):**  
    - Approval voting. Votes:  
      - Program A: 7 approvals  
      - Program B: 5 approvals  
      - Program C: 3 approvals  
    - **Result: Program A wins**.  
  - *Why you won’t like it:* A wins with broad but shallow support (may not be anyone’s top choice).  
  - *Discretion flags:* Chair’s choice to not delegate.

  #### **Case 3: Plainly Evaluative Question**  
  *Q: "Is Program Y worth funding?"*  
  - **Step 1:** Evaluative (subjective worth).  
  - **Step 2:** No delegation (committee vote).  
  - **Step 4 (Evaluative):**  
    - Final vote: 5 "Yes," 4 "No."  
    - **Result: Fund Program Y**.  
  - *No surprises:* Straightforward majority rule.

  ---

  ### **Key Design Notes**
  1. **Independence > Accuracy**:  
     - CJT’s power plummets with correlation, so IS discounts majority confidence.  
     - Structured discussion and initial voting mitigate bias but can’t eliminate it.  
  2. **Weighting Logic**:  
     - Past accuracy used only for factual questions (evaluative has no "truth" to measure).  
     - Small samples? Default to equal weight to avoid noise.  
  3. **Delegation Safeguards**:  
     - Triggered when CJT assumptions fail (evaluative questions) or independence is too low (discounted margin <1.0).  
  4. **Time Efficiency**:  
     - Initial vote + structured discussion fit in 10 minutes by design (short comments, no open debate).  
  5. **What This Doesn’t Do**:  
     - Guarantee correctness (CJT is probabilistic).  
     - Replace deliberation (it structures it).  
     - Handle strategic voting (assumes good faith).

  This procedure prioritizes transparency, isolates discretion, and respects CJT’s limits. It can be run by any colleague with the checklist.
