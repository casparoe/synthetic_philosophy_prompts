prompt: |-
  I'm a retired neuroscientist (did 25 years in a behavior lab, mostly on animal models of addiction) and I've only recently goten into philosophy, and it's gotten a little out of hand. I've been reading Ian Hacking's stuff on looping effects — the idea that categories in the human sciences don't just describe the people they're applied to, they actually change those people, so the category keeps drifting as the people internalize it — and I'm convinced that psychiatric diagnosis is a textbook case of this. I'm presenting a short talk at a philosophy colloquium at a university in about a month, and I'm defending a fairly strong claim: that psychiatric diagnostic categories are more unstable than the people who use them day to day are willing to admit, and that this instability isn't a bug to be engineered away but the thing that makes psychiatric classification genuinely different from, say, classifying rocks or bacterial species. The audience will be mostly clinical psychologists, a couple of psychiatrists, and two philosophers of psychiatry. I suspect the clinicians will be the ones who push back hardest, because their whole careers are built on making these diagnoses work in practice, so I expect them to be a bit hostile to an outsider telling them their categories are unstable in some deep sense.

  Can you draft me a Q&A prep sheet? I want the six or eight objections I'll actually get from this audiance, not the generic ones I'd get from a philosophy crowd — ordered by how much damage each one does, phrased the way a clinical psychologist or a philosopher of psychiatry would actually put it, with a reply I can give in about two minutes and a note on where each reply is soft. I also want you to flag which objections have real force so I know what to concede up front, and which are just misunderstandings I can gently correct without conceding anything. One concrete example I'll be using in the talk: gaming disorder, which the WHO's ICD-11 accepted as a full diagnosis while the American psychiatric manual kept it in a holding pattern as a condition for further study — I want to use that split to show the category's status is still being negotiated, and I'd like you to think through how the clinicians will push back on that example, like the objection that the two bodies just had different evidentiary standards, which doesn't show the category is unstable, only that the evidence was thin.

  Last thing, and I'd really appreciate it: please separate what's settled from what's genuinely contested among people who actually work in this area. For instance, if the view that psychiatric categories are just social constructions is only one camp's position among philosophers of psychiatry and clinicians, I don't want the prep sheet to present it as the consensus. And if you can, include the one question I'm hoping nobody asks, and what I should say if they do.
