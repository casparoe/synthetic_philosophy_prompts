  The advisor spent 30 years defending multilevel selection against the selfish-gene paradigm, and her key point was always that the kin/group selection debate boils down to accounting (Price equation) rather than fundamental truth. That's the core science hook. But the toast must land as affection, not a lecture—especially since she's described as "dry," meaning no fluff or sentimentality.

  Hmm... the joke about units of selection needs to work on two levels: rigorous enough for biologists (no oversimplifications like "genes are selfish" caricatures), but framed simply for family. Maybe anthropomorphize the conflict? Like genes, individuals and groups arguing over who deserves credit for her career? 

  The emotional arc should start with humor, pivot to her resilience during the selfish-gene era (calling it "bookkeeping" was a power move), then reveal how her scientific stance mirrored her mentorship: seeing the whole ecosystem of students, not just individual "fitness." 

  Key phrases to include: "thirty years of holding her ground," "matter of bookkeeping," and "Price equation" (can't omit it—biologists would notice). For family, translate "units of selection" into "what really drives evolution." 

  Avoid clichés ("unsung hero"). Instead, focus on concrete traits: her dry wit, how she'd dissect flawed arguments. The ending should toast to her as both scientist and human—maybe borrowing the "group selection" metaphor for her legacy? 

  ...Wait, is the user male or female? No pronouns used. Will default to neutral "they" in drafting. Also no name given for advisor—will use placeholders. User should personalize those. 

  Biggest risk: biologists nitpicking the Price equation reference. Must clarify it's about accounting equivalence, not taking sides. And never imply group selection "won"—it's about her defending its validity as perspective. 

  Family will care about respect and warmth. Biologists will care about precision. Advisor will care about not being misrepresented. This toast is a tightrope walk.
answer: |-
  Here’s a toast that balances wit, warmth, and scientific respect – landing firmly on affection:

  **(Raise glass, warm smile)**  
  "Thirty years. Thirty years of papers, debates, late nights in the lab, and… holding her ground. Especially about that *one thing*. *(Knowing glance at the biologists)*  

  We all know [Advisor's Name] never met a conventional wisdom she couldn’t politely, brilliantly, and dryly dismantle. Especially when it came to this whole… *who’s really running the show?* business. Genes? Individuals? Groups?  

  *(Lighthearted tone)* Frankly, it reminds me of a family argument over who *really* deserves credit for Thanksgiving dinner.  
  *(Mimicking voices)*  
  '*I* brought the spectacular pie!' (The Individual).  
  '*My* secret recipe made the turkey perfect!' (The Gene).  
  '*We* created the warm, festive atmosphere!' (The Group).  
  And in the end... *(shrugs, smiles)* ...everyone just wants to eat, and the meal is delicious. It’s all… connected.  

  That was always [Advisor's Name]’s point, wasn’t it? Through the 'selfish gene' tsunami, she kept calmly pointing at her whiteboard, covered in Price’s elegant equations, saying, 'Look. It’s not about who’s the *real* hero. It’s often just… bookkeeping. A different way of adding up the same beautiful, messy story.'  

  **(Shift to sincere affection)**  
  But here’s the thing about [Advisor's Name]. That wasn’t *just* a scientific stance. That was *her*. She saw the connections. She understood that the strength of a lab, a department, a *career*… comes from that interplay. The individual brilliance *and* the collective support. The fierce independence *and* the deep collaboration.  

  For thirty years, she wasn't just defending an idea; she was building an ecosystem. She nurtured students *(gesture around, perhaps to yourself or other colleagues)* – not just as individual minds to be sharpened, but as part of a thriving intellectual community. She saw the 'group selection' in a successful lab culture, where everyone lifts each other up. She knew the 'kin selection' of academic lineage, passing on wisdom and rigor.  

  Her dry wit could slice through faulty logic like a scalpel, but beneath it was always… profound care. Care for the science, yes, absolutely. But more importantly, care for the *people* doing the science. Care for asking the right questions, even when they were unpopular. Care for intellectual honesty. Care for *us*.  

  **(Raise glass higher)**  
  So, tonight, we’re not just celebrating thirty years of defending a powerful idea about evolution. We’re celebrating thirty years of defending *a powerful way of being a scientist, a mentor, and a colleague*.  

  [Advisor's Name], you taught us to look at the whole equation. Thank you for seeing the individual brilliance in each of us, *and* for tirelessly building the group where that brilliance could truly shine. Your legacy? It’s not just in the papers or the theories. It’s right here in this room – in the students you guided, the colleagues you inspired, and the family who loves you.  

  To [Advisor's Name]: May your retirement be filled with the perfect balance – all the peace of a quiet library corner, and all the vibrant energy of a thriving intellectual ecosystem. Cheers!"  

  **(Clink glasses)**  

  **Why this works:**  

  1.  **The Joke Lands:** The Thanksgiving dinner analogy makes the "units of selection" debate instantly relatable and funny for *everyone*, while being scientifically sound enough for the experts (it captures the essence of the equivalence debate without oversimplifying the science).  
  2.  **Science Respected:** Uses precise terms ("Price equation," "bookkeeping," "equivalence") correctly and in context, showing understanding. Acknowledges the historical tension ("selfish gene tsunami") without rehashing the fight.  
  3.  **Pivots to Affection:** The core of the toast is *her character* – how her scientific perspective mirrored her mentorship and collegiality ("building an ecosystem," "seeing the connections," "care for the people").  
  4.  **"Dry" Honored:** The language is grounded, avoids excessive sentimentality, and uses descriptors like "calmly," "dryly," "intellectual honesty," which fit her personality.  
  5.  **Includes Everyone:** The family hears warmth, appreciation for her as a person, and a funny analogy. The biologists hear respect for her specific scientific contribution and intellectual resilience.  
  6.  **Focus on Legacy:** Ends powerfully on her impact on *people* – students, colleagues, family – which transcends the specific scientific debate.  
  7.  **Time:** Easily fits within 5 minutes when delivered with natural pauses and warmth.  

  **Remember to:**  

  *   **Say her name warmly** throughout.
  *   **Pause** for the laugh after the Thanksgiving analogy.
  *   **Make eye contact** with her, then sweep the room (especially the biologists during the science bit, the family during the legacy/personal bit).
  *   **Speak clearly and sincerely.** The affection should come through in your tone more than overly flowery words.  

  Good luck! She’ll appreciate the thoughtful blend of respect and warmth.
