prompt: |-
  I'm a backend engineer, no philosophy degree, and I've somehow ended up co-running the "practical rationality" week of a decision-theory module for final-year CS students (long story, someone went on sabbatical). So I have to write the final essay question and the marking scheme, and I'd rather not embarass myself in front of people who actually know this stuff.

  The topic I've been handed is money pumps, and whether rationality is something that happens at a moment or something that happens across time. The reading group keeps saying "intransitive preferences are irrational, because you can money-pump someone who has them," and I want an exam question that makes that line do some actual work instead of just getting recited back at me.

  I've made up a case I want the question built around, so it won't be sitting in any textbook:

  Sam has a ticket to a gig on Friday. At any single moment, Sam's preferences are a perfectly ordinary, transitive ranking. But they shift predictably as the date approaches. Three weeks out, Sam would rather have £80 in hand than go. The night before, Sam would rather go than have £120. A scalper who knows all this buys the ticket off Sam three weeks out for £80, and sells it back to Sam the night before for £120. Sam goes to the gig having paid a net £40 for something that would've been free, and there's nothing special about gigs — the scalper can run the same play on Sam over and over with other events. Yet at no point were Sam's preferences internally inconsistent.

  I want the question to make students work out what, if anything, that shows about Sam's rationality, and to notice that this pump and the standard one (cyclic preferences, a trader offering swaps in a single sitting) might not be showing the same thing at all. Specifically I want them to seperate out (i) what the pump actually establishes — that Sam is down £40, or something stronger than that — (ii) what extra premise you'd need to get from "Sam can be bled" to "Sam is irrational," and (iii) whether precommitment changes the verdict: if Sam could sign something up front that blocks the night-before swap, is Sam then rational, or just insured? And I'd like a part where they say whether my own hunch is right. My hunch is that getting ripped off shows nothing about rationality by itself — it's just being ripped off.

  Constraints: one essay question, doable in about 60 minutes, worth 20 marks. The students are strong CS types with some decision theory and no philosophy of action. No citations, no reading list — it's closed book and I don't know the literature anyway, so keep everything to arguments. And please don't let it be answerable with "intransitive preferences are irrational because money pumps."

  Give me the question, a model answer of roughly 700 words that actually takes a stand rather than listing views, and a marking scheme with five must-hit points, the marks for each (adding to 20), and a one-line note per point on how students typically botch it. Make the very last line of the whole thing read exactly \answer{...} with a short phrase inside giving the model answer's bottom line on whether being pumpable is by itself enough to show irrationality.
reasoning: |-
  We are designing an essay question for a decision theory module focused on money pumps and the nature of rationality (whether it is momentary or across time). The scenario involves Sam, who has shifting but at each moment transitive preferences, and is exploited by a scalper. The question should push students to analyze:

  (i) What the pump establishes (Sam is down £40, or more?).
  (ii) What extra premise is needed to go from "Sam can be bled" to "Sam is irrational".
  (iii) Whether precommitment changes the verdict (if Sam can block the night-before swap, is that rational or just insurance?).
  (iv) The student's own view on whether being pumpable by itself shows irrationality (the instructor's hunch is that it does not).

  The question should avoid being answerable by just reciting "intransitive preferences are irrational because money pumps".

  We also need a model answer (700 words) that takes a stand and a marking scheme.

  Let's design the question:

  **Question:**

  Sam owns a ticket to a gig on Friday. Sam's preferences shift predictably over time. Three weeks before the gig, Sam prefers £80 in hand over attending the gig. The night before the gig, Sam prefers attending the gig over having £120. A scalper, knowing Sam's preferences, buys the ticket from Sam three weeks out for £80 and then sells it back to Sam the night before for £120. As a result, Sam ends up paying a net £40 to attend the gig that they originally could have attended for free. This pattern can be repeated for other events.

  (a) Explain what this scenario shows about Sam's situation. In particular, does it show that Sam is irrational? Why or why not? (5 marks)

  (b) The standard money pump argument against intransitive preferences (e.g., preferring A to B, B to C, and C to A) is often used to establish irrationality. Compare and contrast the standard argument with this gig ticket scenario. What key difference in the structure of preferences makes Sam's case distinct? (5 marks)

  (c) Suppose Sam could sign a binding contract at the three-week point that prevents them from buying the ticket back the night before. If Sam signs such a contract, would that make Sam's behavior rational? Explain your reasoning. (5 marks)

  (d) The instructor has a hunch that being susceptible to this kind of money pump does not by itself show that Sam is irrational. Do you agree? Defend your position. (5 marks)

  ---

  **Model Answer (approx 700 words):**

  The scenario with Sam and the scalper reveals a vulnerability to exploitation due to predictable preference shifts over time. However, it does not necessarily demonstrate that Sam is irrational at any single moment. At each point in time, Sam's preferences are transitive and consistent. Three weeks out, Sam prefers £80 to the ticket, and the night before, Sam prefers the ticket to £120. There is no intransitivity in the preferences at a given time. The problem arises because the scalper can exploit the dynamic inconsistency by engaging in two separate transactions that leave Sam worse off by £40.

  (a) The scenario shows that Sam can be made worse off by a series of transactions that are individually acceptable at the time they are made. However, this does not by itself prove irrationality. Rationality is often assessed at a moment in time, and at each moment Sam's choices are consistent with their current preferences. The loss of £40 is a consequence of the dynamic inconsistency, but it does not imply that Sam violated any principle of rationality at any single decision point. Without an additional premise that rationality requires consistency across time, we cannot conclude that Sam is irrational.

  (b) The standard money pump argument targets intransitive preferences at a single time. For example, if Sam had cyclic preferences (A>B, B>C, C>A) at one time, a trader could sequentially swap items to pump money. The key difference is that in the standard case, the irrationality is within a single set of preferences (intransitivity). In Sam's case, the problem is not intransitivity at a single time but a shift in preferences over time. The standard argument shows a contradiction in the preference ordering at a fixed time, while Sam's scenario shows a vulnerability due to changing preferences. Thus, the standard argument directly challenges the rationality of the preference structure, while Sam's case challenges whether rationality should extend across time.

  (c) If Sam signs a binding contract at the three-week point to prevent buying the ticket back, this precommitment strategy might avoid the loss. However, it does not necessarily make Sam's behavior rational. At the moment of signing, Sam is acting to prevent a future action that would be against the three-week-out Sam's interests. This is a form of self-binding. But the night-before Sam would still prefer to attend and would be frustrated by the contract. The rationality of precommitment depends on whether we view the agent as one entity over time. If we take a time-sliced view, each moment's preferences are rational, and precommitment is a tool to serve the earlier self. But if we require rationality for the whole person across time, precommitment might be seen as rational because it avoids the overall loss. However, note that without the precommitment, the earlier self's plan is thwarted by the later self. Thus, precommitment can be seen as a rational response to dynamic inconsistency, but it does not resolve the underlying issue that without it, the agent is vulnerable.

  (d) I agree with the instructor's hunch. Being pumpable in this dynamic way does not by itself show irrationality. It shows that Sam has predictable preference shifts that can be exploited. But if we define rationality as making choices that maximize utility given current information and preferences at the time, then Sam is rational at each step. The loss is an unfortunate outcome of changing preferences. To move from "Sam is pumpable" to "Sam is irrational", we need an additional normative principle that requires preferences to be stable over time or that requires the agent to anticipate and avoid future exploitation. Without such a principle, we only have a descriptive account of vulnerability. Rationality, as commonly understood in decision theory at a point in time, does not require preferences to remain fixed. Therefore, the money pump in this case does not establish irrationality; it merely shows that changing preferences can lead to exploitation.

  In conclusion, the gig ticket scenario illustrates a dynamic inconsistency that can lead to financial loss, but without an additional premise that rationality requires consistency across time, it does not prove Sam irrational. Precommitment can mitigate the loss but does not change the fact that without it, the agent's actions over time lead to a net loss. The standard money pump argument, by contrast, targets an internal inconsistency in preferences at a single time. Hence, the two cases are fundamentally different.

  \answer{Being pumpable does not by itself show irrationality.}

  ---

  **Marking Scheme (20 marks total):**

  (a) 5 marks: Explain what the scenario shows and whether it implies irrationality.
     - Must-hit: The scenario shows Sam ends up worse off (net £40 loss) due to a series of transactions that are individually acceptable at the time. It does not necessarily show irrationality because at each moment Sam's preferences are consistent.
     - Common botch: Students might say that because Sam ends up worse off, they are irrational, without addressing the time-consistency of preferences.

  (b) 5 marks: Compare and contrast with the standard money pump (cyclic preferences).
     - Must-hit: The standard money pump relies on intransitive preferences at a single time, which is a static inconsistency. Sam's case involves dynamic inconsistency (preferences changing over time) without intransitivity at any moment.
     - Common botch: Students might conflate the two and say both show the same thing (intransitivity) without noting the static vs dynamic difference.

  (c) 5 marks: Evaluate the effect of precommitment.
     - Must-hit: Precommitment (binding contract) can prevent the loss but does not necessarily make Sam's behavior rational. It serves the earlier self's interests but frustrates the later self. Rationality of precommitment depends on whether we adopt a time-sliced or a temporally extended view of the agent.
     - Common botch: Students might assume that because precommitment avoids the bad outcome, it makes the agent rational, without discussing the conflict between different temporal selves.

  (d) 5 marks: Agree or disagree with the instructor's hunch and defend.
     - Must-hit: The student must take a position on whether being pumpable by itself shows irrationality and provide reasoning. The model answer agrees and argues that without an additional principle requiring stable preferences or cross-temporal consistency, being pumpable doesn't prove irrationality.
     - Common botch: Students might simply assert that losing money is irrational without engaging with the definition of rationality at a moment.

  Note: The last line of the model answer has the required \answer{Being pumpable does not by itself show irrationality.}
answer: |-
  **Essay Question**  
  Sam owns a ticket to a gig on Friday. Their preferences shift predictably: three weeks out, Sam prefers £80 in hand over the ticket. The night before, Sam prefers the ticket over £120. A scalper exploits this by buying the ticket for £80 three weeks out and selling it back for £120 the night before. Sam attends the gig but pays a net £40 for what could have been free. This pattern repeats for other events.  

  (a) What does this money pump actually demonstrate about Sam’s situation? Does it prove Sam is irrational? Explain why or why not. (5 marks)  
  (b) Contrast this pump with the “standard” money pump (e.g., cyclic preferences exploited in one sitting). What key difference makes Sam’s case distinct? (5 marks)  
  (c) If Sam could sign a binding contract at the three-week point to block the night-before repurchase, would this make Sam’s behavior rational? Or is it merely insurance? Justify your view. (5 marks)  
  (d) The instructor suspects that susceptibility to this pump does not, by itself, show irrationality. Do you agree? Defend your position. (5 marks)  

  ---

  **Model Answer (≈700 words)**  
  The scalper exploits Sam’s predictable preference shifts to extract £40, demonstrating that Sam is vulnerable to exploitation across time. However, this does not inherently prove Sam is irrational. At each moment, Sam’s preferences are transitive and consistent: three weeks out, £80 > ticket is a coherent choice; the night before, ticket > £120 is equally coherent. The pump exploits a *dynamic inconsistency*—shifts in Sam’s valuation over time—not a logical flaw at any single point. Rationality, traditionally defined moment-by-moment (e.g., adhering to transitivity and maximizing utility given current preferences), is satisfied here. The loss arises from the scalper’s ability to manipulate Sam’s temporal trajectory, not from Sam violating decision-theoretic axioms at any instant. Thus, the pump shows Sam is *exploitable*, not necessarily irrational.  

  (a) The pump demonstrates that Sam can be systematically disadvantaged through sequential transactions that are individually rational at the time. Sam loses £40 net and ends up worse off than if they had kept the ticket. Yet this does not *prove* irrationality because rationality is typically evaluated locally (at decision points). Sam’s choices align with their preferences when made—no intransitivity or internal contradiction exists. The outcome is harmful, but harmful outcomes alone don’t define irrationality; they require a normative link between outcomes and reasoning.  

  (b) The standard money pump targets *intransitive preferences at a single time* (e.g., preferring A > B, B > C, and C > A simultaneously). A trader exploits this by offering swaps (e.g., A for C plus a fee, then C for B, etc.), draining money in one session. Crucially, the victim’s preferences are *statically inconsistent*—they violate transitivity, a core rationality axiom. Sam’s case differs fundamentally: preferences are transitive at each moment but *change predictably over time*. The standard pump reveals an immediate inconsistency in reasoning; Sam’s pump reveals vulnerability from temporal instability. One attacks the structure of preferences; the other attacks their persistence.  

  (c) Signing a binding contract to block repurchase would prevent exploitation but does not render Sam rational. It acts as *insurance* against future preference shifts, not a correction of irrationality. At the three-week point, Sam prefers £80 and commits to avoiding a future choice (repurchasing) that would contradict this preference. This serves the earlier self’s interests but ignores the later self’s preferences. If rationality is moment-bound, the contract is rational for the three-week Sam (maximizing utility then) but irrational for the night-before Sam (who values the ticket). If rationality requires unified agency across time, the contract is instrumentally rational—it secures a better outcome—but highlights a pathology: Sam must “self-bind” to avoid self-sabotage. This is mitigation, not absolution.  

  (d) I agree with the instructor: susceptibility to this pump does not, by itself, show irrationality. Rationality concerns *how choices align with preferences at the time of decision*. Sam meets this criterion. To condemn Sam as irrational, we need an *additional premise*—e.g., that rationality requires stable preferences, or that agents must optimize “global” outcomes across time. Without such a premise, the pump only shows that changing preferences + opportunistic traders = exploitation. For instance, someone might value family time over work today but reverse this in a crisis; we wouldn’t call this irrational, just context-dependent. Sam’s error is naïveté about exploitation, not flawed reasoning. Precommitment tools (like contracts) acknowledge this vulnerability but don’t resolve the philosophical question: if rationality is momentary, Sam is blameless; if it’s cross-temporal, the pump reveals a failure of extended agency. But absent an agreed-upon standard for “temporal rationality,” the pump merely proves exploitability, not irrationality.  

  In sum, Sam’s money pump reveals dynamic inconsistency leading to loss, distinct from the static incoherence of cyclic preferences. Precommitment mitigates harm but doesn’t erase the underlying tension. Rationality, as defined in orthodox decision theory, remains intact at each moment—so being pumpable is not sufficient evidence for irrationality.  

  \answer{Not sufficient by itself}  

  ---

  **Marking Scheme (20 marks total)**  
  **Must-hit points, marks, and common botches:**  
  1. **(a) Outcome vs. irrationality distinction (5 marks):**  
     - *Must-hit:* Clearly states the pump demonstrates exploitability (net £40 loss) but does not prove irrationality, as Sam’s preferences are transitive and consistent at each moment.  
     - *Common botch:* Assumes loss implies irrationality without addressing moment-by-moment coherence.  

  2. **(b) Static vs. dynamic inconsistency (5 marks):**  
     - *Must-hit:* Contrasts standard pump (exploits intransitive preferences at one time) with Sam’s pump (exploits shifting but locally transitive preferences across time).  
     - *Common botch:* Equates the two pumps or misattributes intransitivity to Sam.  

  3. **(c) Precommitment as tool, not rationality fix (5 marks):**  
     - *Must-hit:* Identifies precommitment as insurance that avoids loss but doesn’t resolve rational tension (e.g., serves earlier self at expense of later self’s preferences).  
     - *Common botch:* Claims precommitment makes Sam rational by preventing loss, ignoring conflicting temporal preferences.  

  4. **(d) Defense of instructor’s hunch with premise gap (5 marks):**  
     - *Must-hit:* Agrees (or coherently disagrees) and argues that exploitability ≠ irrationality without an added premise (e.g., cross-temporal stability requirement).  
     - *Common botch:* Assumes vulnerability inherently defines irrationality or ignores the need for extra normative premises.  

  5. **Overall coherence and stand-taking (embedded):**  
     - *Must-hit:* Essay takes a clear stand (e.g., “Sam is not irrational at any moment”) and maintains logical flow.  
     - *Common botch:* Waffles between views or recites “intransitivity = irrational” without engaging the temporal element.  
     *(Note: This point is not separately marked but is essential for full credit in each section.)*
