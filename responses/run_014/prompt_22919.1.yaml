prompt: |-
  Hey, I've been reading a lot about the Principal Principle and I'm tryin to get a handle on which accounts of objective chance actually support it well. I'm especially interested in how they handle the problem of defeaters. Can you rank the following accounts of objective chance in terms of how well they support the Principal Principle (from best to worst)?

  - Frequentist (chance as long-run frequency)
  - Propensity (chance as a physical tendency)
  - Logical (chance as a logical relation)
  - Humean (chance as a pattern in the Humean mosaic)

  Please give your answer as a JSON block:

  ```json
  {
    "ranking": ["...", "..."],
    "justification": "..."
  }
  ```
reasoning: |-
  We are going to rank the accounts of objective chance in terms of how well they support the Principal Principle (PP) and handle defeaters.

   The Principal Principle (PP) roughly states that if an agent knows that the chance of an event A is p, then the agent's credence in A should be p, unless they have additional information (defeaters) that trumps the chance information.

   Defeaters are typically of two kinds:
    1. Historical information that is inadmissible (like information about the exact outcome of a chance process) because it can undermine the chance assignment.
    2. Information about the future that might be relevant.

   The problem of defeaters is that an account of chance must specify what makes a defeater "inadmissible" and hence when the PP applies.

   Now, let's consider each account:

   1. Frequentist (chance as long-run frequency):
      - This account identifies chance with the long-run relative frequency in a sequence of events.
      - It has trouble with single-case probabilities (what is the chance of a particular coin toss landing heads?).
      - The PP might be applied by saying that the long-run frequency should guide our credence about a single event, but it's not clear how.
      - Defeaters: The long-run frequency might not be known exactly, and the sequence to which the event belongs is crucial. Information about the exact outcome of the single event is a defeater? But the PP requires that we have the chance, so if we know the long-run frequency for the sequence, then for a particular event in the sequence, we might use that frequency. However, if we have information that the single event is not typical (e.g., the coin is biased in a particular way for this toss), that would be a defeater. The frequentist account doesn't have a natural way to define admissibility because it doesn't have a clear connection to the causal structure of the single case.

   2. Propensity (chance as a physical tendency):
      - This account views chance as a physical disposition or tendency of a system to produce a certain outcome.
      - It is naturally suited for single-case probabilities.
      - The PP: If we know the propensity of a system, then we should set our credence to that value. 
      - Defeaters: Information that directly affects the outcome in a way that bypasses the propensity (e.g., if we know that the coin is double-headed, then even if we thought it had a 0.5 propensity, that would be defeated). Propensity accounts can naturally explain defeaters as information that interferes with the manifestation of the propensity. However, the exact nature of propensities is debated and some versions may be vague.

   3. Logical (chance as a logical relation):
      - This account (like Carnap's or Keynes') sees probability as a logical relation between evidence and a hypothesis.
      - However, it's not clear that this is an objective chance in the sense required for the Principal Principle. The PP is about objective chances, not epistemic probabilities. 
      - The logical interpretation is typically used for epistemic probabilities, not objective chances. Therefore, it doesn't fit naturally with the PP, which requires an objective chance that is part of the world.

   4. Humean (chance as a pattern in the Humean mosaic):
      - The Humean account (like the Best System Analysis of Lewis) defines chance as a feature of the best systematization of the entire history of the world (the Humean mosaic).
      - The PP is central to Lewis's development of Humean chance. In fact, Lewis initially used the PP to constrain what the best system is: the chances must be such that they would guide rational credence via the PP.
      - Defeaters: On the Humean view, the chance is defined by the entire pattern, so information about the future or about the entire pattern might be inadmissible? But note, the Humean account faces the "undermining" problem: a possible future that is inconsistent with the chance assignment. For example, a future that by chance has a very different frequency would undermine the current chance assignment. Thus, the PP must be modified to the New Principle to avoid this.

   Ranking from best to worst in supporting the Principal Principle:

   - Humean: Lewis developed the account with the Principal Principle in mind. Even though it requires modification (to the New Principle) due to undermining, it is still the account that is most explicitly designed to support the PP.

   - Propensity: It naturally handles single-case chances and defeaters can be understood as information that affects the propensity. However, it doesn't have the same explicit connection to the PP as the Humean account.

   - Frequentist: It has some ability to support the PP for long sequences, but it struggles with single-case chances and defining admissibility.

   - Logical: This account is not about objective chance at all, but about logical or epistemic probability. Therefore, it doesn't naturally support the Principal Principle which is about objective chance.

   However, note: Lewis himself was a Humean and the PP was formulated in a Humean framework. But let's compare:

   - The Humean account has the closest tie to the PP, even if it requires a modification (New Principle) to avoid undermining.
   - The propensity account is often seen as a natural candidate for objective chance and can support the PP, but it doesn't have the same formal integration as the Humean.
   - Frequentist: The PP is not naturally supported for single cases, which are the primary concern of credences.
   - Logical: Doesn't fit.

   But note: the problem of defeaters is handled most naturally by the propensity account? However, the Humean account has a well-defined notion of admissibility: information about the future is generally inadmissible except for the chance theory itself. But the undermining problem complicates things.

   After consideration, the ranking from best to worst in supporting the PP:

   1. Humean: Because the PP is built into the definition of chance (via the Best System Analysis). Even though there is a problem with undermining, the account is designed to support the PP (or a variant) and has the most developed theory of admissibility.

   2. Propensity: Because it is an objective chance that applies to single cases and defeaters can be understood as factors that affect the propensity.

   3. Frequentist: It can support the PP in a limited way for events in a long run, but it fails for single cases and the notion of admissibility is less clear.

   4. Logical: Not applicable.

   Therefore, the ranking:

     ["Humean", "Propensity", "Frequentist", "Logical"]

   Justification:

   - Humean: Explicitly designed to satisfy the Principal Principle (or a variant) and provides a framework for admissibility, though it requires a modification due to undermining.
   - Propensity: Naturally captures single-case chances and allows for a reasonable understanding of defeaters (as factors that interfere with the propensity), but lacks the same level of integration with the PP as the Humean account.
   - Frequentist: Struggles with single-case chances and has a less clear account of admissibility, making it less suited for the PP in the most important cases.
   - Logical: Not an account of objective chance and therefore does not support the Principal Principle.

