prompt: |-
  Been reading rationalist blogs since maybe 2010 and one thing I never fully sorted out for myself is when to actually trust the aggregate. The Condorcet jury theorem says: if each voter is better than 50% accurate and votes independently, a big enough majority is right with probability as close to 1 as you want. Fine, the math is fine. But when I go by my actual gut on cases, I'm not sure the theorem is tracking what I care about. Here are my verdicts, tell me if there's a principle that captures them:

  - 500 strangers guessing the weight of an ox: trust the median over any single guess, including mine. Easy.
  - 500 Yelp reviews saying a taqueria is great, vs one foodie friend who's never been there: I go with the crowd. The crowd at least ate the food, my friend is going off vibes.
  - Same 500 reviewers saying a philosophy book is badly written: I trust that way less than the taqueria case. Feels like one person's bias ('philosophy = pretentious') copied 500 times, not 500 separate biases.
  - 10,000 people each right 51% of the time on some hard binary call, fully independent. The math says the majority is right with probability ~1, and I'll grant the math, but in any real version of this I refuse to update much, because 'barely better than chance AND independent' basically doesn't happen in the wild — if 10k people all lean the same way it's almost always because they share an upstream source.
  - A poll average before an election: 20 polls, but with correlated error (same methodologies, same likely-voter screens, shared house effects). I trust the average more than the best single poll, but not 20-polls-worth more — like maybe the equivalent of 5.
  - A prediction market with tons of volume but a few whales doing most of the trading: I discount it hard, even though on paper thousands of participants traded.
  - A Wikipedia deletion debate where 30 editors vote keep but they all belong to the same wikiproject: don't trust it, maybe even update toward delete.
  - Voters each slightly worse than chance (49%), independent: adding voters makes the majority *worse*, so whatever principle I want can't just say 'more opinions = better,' competence has to enter somewhere.

  My tentative principle is something like: trust the aggregate insofar as the errors are independent and each voter is at least a bit better than chance, and scale your trust by the *effective* number of independent opinions, not the raw headcount. But here's the pair I can't square: I trust the crowd on the ox's weight and the taqueria without having any real evidence those people are above chance, while I'd take one mechanic with a great track record on my car over a survey of 500 drivers without hesitating. So maybe the real variable isn't 'competence + independence' at all, it's 'is the error idiosyncratic noise or is there a common cause' — but if it's the common-cause thing, I'm not sure what happens to the competence condition at all, since a shared bias makes everyone's track record look fine until it doesn't.

  So: give me the principle (or a couple of candidates), what each clause is doing for which verdict, what it predicts for the case I keep going back and forth on — two subcultures, each internally super-correlated, with biases in opposite directions; is averaging the two group verdicts good (biases cancel) or bad (you've really only got two data points) — and be honest about which of my verdicts your principle just cannot save.
reasoning: |-
  Okay, the user has been engaging with rationalist blogs since 2010 and is struggling with when to trust aggregated opinions. They understand the Condorcet jury theorem mathematically but feel it doesn't capture real-world nuances. They listed several scenarios where their intuition conflicts with the theorem and proposed a tentative principle but can't reconcile all cases. 

  Hmm, their core tension is between mathematical ideals (independent voters above 50% accuracy) and real-world messiness (correlated errors, competence variance). The ox weight vs. mechanic example is particularly telling—they default to crowd wisdom for some domains but not others, without explicit competence evidence. 

  Interesting how they're circling around two key variables: error independence and competence. But their examples suggest competence might be secondary to error structure. The taco reviews work because errors are culinary (idiosyncratic), while philosophy reviews fail because errors are ideological (systemic). 

  Ah! The mechanic example reveals something deeper: when systemic errors could be catastrophic (car repair), they prioritize proven individual competence over crowds. Whereas for low-stakes sensory judgments (tacos), idiosyncratic noise averages out. So stakes and error nature interact.

  Their unresolved case about two biased subcultures is juicy. Averaging could work if biases are equal and opposite (like statistical noise cancellation), but fails if bias magnitudes differ or if it's not a linear scale. Reminds me of how pollsters weight partisan samples. 

  The user's clearly done their homework—they're not rejecting math but demanding a framework that respects epistemic shadows (how can we know errors are independent?). Their frustration with the "51% independent" hypothetical shows they grasp that true independence is rare outside textbooks. 

  What they might really want is a decision tree for when aggregation adds value versus when it amplifies systemic risk. And an honest admission that some cases (like the two-subcultures dilemma) resist clean principles because real-world bias is never perfectly measurable or symmetric. 

  Also noting their meta-cognition: they're aware their own principle has holes and explicitly ask where it fails. That's sophisticated—they want the framework's boundary conditions, not just platitudes.
answer: |-
  Here's a principle that captures your intuitions and resolves the tensions, built on two core pillars: **Error Independence** and **Domain Suitability**. It explicitly rejects the idea that "barely better than chance + independence" is a realistic or useful category for real-world aggregation.

  ### The Principle
  **Trust an aggregate opinion proportionally to the *effective number of independent judgments* (N_eff), scaled by the *domain-appropriate baseline competence* (C_d), and discount heavily for identifiable *systemic error sources* (S).**

  1.  **N_eff (Effective Number of Independent Judgments):** How many *truly independent* estimates are present? This crushes raw headcount when:
      *   Opinions share a common source (upstream info, methodology).
      *   Opinions are driven by shared ideology/identity/bias.
      *   Social proof or herding is likely (e.g., Yelp reviews *after* a rating is established).
      *   *Calculation:* N_eff << Raw N in correlated cases (e.g., your poll example: 20 polls -> ~5 effective polls).

  2.  **C_d (Domain-Appropriate Baseline Competence):** What is the reasonable expectation of *minimal relevant competence* for individuals *in this domain*? This is not a precise 51% track record, but a qualitative assessment:
      *   *High C_d:* Tasks involving sensory perception, simple counting, universal experiences (ox weight, taco taste - people can taste, eat food).
      *   *Low C_d:* Tasks requiring specialized knowledge, nuanced aesthetic judgment, or resistance to common biases (philosophy book writing quality, complex car repair).
      *   *Critical Point:* **C_d must be plausibly > random chance for a *typical* contributor in the pool.** If C_d is fundamentally unknowable or likely < random, aggregation is useless or harmful (your 49% case).

  3.  **S (Systemic Error Discount):** Does a clear, identifiable *systemic error source* dominate the potential error?
      *   Shared ideology/bias (philosophy reviews, wikiproject vote).
      *   Flawed methodology (polls with correlated error).
      *   Non-representative sample (whales dominating a market, only fans of a genre reviewing).
      *   *Effect:* High S drastically reduces trust, potentially to zero or even reversing the update (your Wikipedia deletion example).

  **How it explains your verdicts:**

  *   **Ox Weight (500 strangers):** High C_d (anyone can look and guess weight), Presumed Moderate N_eff (guesses are sensory, relatively independent), Low S (no obvious systemic bias). **Trust aggregate.**
  *   **Taqueria (500 Yelp vs. Vibes Friend):** High C_d (they ate the food!), Presumed Moderate N_eff (taste is sensory, though herding exists), Low S for crowd vs. High S for friend (friend's opinion *is pure vibes*). **Trust crowd.**
  *   **Philosophy Book (500 Reviews):** *Low C_d* (most lack expertise/judgment in philosophy writing, common anti-pretentious bias), *Low N_eff* (shared cultural bias), *High S* (systemic bias against "pretentiousness"). **Distrust aggregate.**
  *   **10k @ 51% Independent:** Rejected as unrealistic. In reality, near-chance *and* true independence is vanishingly rare for complex judgments. If 10k lean the same way, N_eff << 10k (High S - shared upstream source/info/bias) dominates. **Refuse to update much.**
  *   **20 Polls w/ Correlation:** Moderate C_d (polling has known skill), *Low N_eff* (shared methodologies/errors), Moderate S (known correlated error). Trust scales with N_eff (~5 equivalent polls), not raw N. **Trust average more than one, but not 20x more.**
  *   **Prediction Market w/ Whales:** Moderate/High C_d (traders often skilled), *Very Low N_eff* (whales dominate, herding), High S (whale bias/agenda). **Discount hard.**
  *   **Wikipedia Delete Vote (Biased Group):** Moderate C_d (editors have knowledge), *Very Low N_eff* (single wikiproject = shared identity/bias), Very High S (clear group bias). **Distrust, maybe update opposite.**
  *   **Voters @ 49% Independent:** C_d < Chance. **Aggregation makes things worse.** Principle explicitly requires plausible C_d > Chance.

  **Resolving the Tension (Ox/Taco vs. Mechanic):**

  *   **Ox/Taco:** High C_d is assumed *based on the domain* (sensory experience is universally available and reasonably reliable for these tasks). You don't need individual track records because the *domain itself* confers sufficient minimal competence on average participants. Low S.
  *   **Mechanic vs. 500 Drivers:** *Low C_d* for the crowd in this domain (car repair requires specialized knowledge the average driver lacks). The mechanic's proven track record establishes *high individual competence* (C_ind >> C_d_crowd). The crowd's N_eff is high, but multiplied by a near-zero C_d, making the aggregate useless. **Trust the high-competence individual over the low-competence crowd.**

  **The Two Biased Subcultures Case:**

  *   **Scenario:** Group A (strong bias X), Group B (strong bias -X). Internally, each group has very low N_eff (high correlation). You get one aggregate opinion from A, one from B.
  *   **Analysis:**
      *   N_eff for the *combined* estimate is likely **~2** (one independent-ish estimate from A, one from B).
      *   C_d is uncertain - depends on the domain and if biases *prevent* basic competence.
      *   S is high *within groups*, but potentially **canceled** if biases X and -X are symmetric and the truth is midway. However, this is a *big if*.
  *   **Prediction:** The principle is **cautiously optimistic but heavily qualified**:
      *   **IF** biases are truly equal, opposite, and linear (averaging cancels them),
      *   **AND** each group has sufficient *internal* competence *on the non-biased aspects* of the judgment (C_d > Chance despite bias),
      *   **THEN** averaging the two group aggregates *might* be reasonably trustworthy, effectively giving you N_eff ~ 2 competent(ish) sources with canceled biases.
      *   **BUT** in reality, biases are rarely perfectly symmetric, measurable, or linear. Group competence (C_d) is hard to assess under strong bias. The principle **predicts this will often fail** because the preconditions (symmetric bias, underlying competence) are fragile and hard to verify. You should **strongly prefer** getting genuine independent opinions *within* each group to increase N_eff before averaging.
  *   **Your Intuition Match:** The principle explains *why* you go back and forth! It *could* work (biases cancel), but it's fragile (only 2 data points, hard to verify symmetry/competence). Your skepticism ("you've really only got two data points") is captured by N_eff ~ 2.

  **What the Principle Doesn't Save (and Why That's Okay)**

  *   **The Pure Math (10k @ 51% Independent):** The principle essentially says this scenario is **epistemically irrelevant** for real-world decisions. It dismisses it because true independence + bare competence is unrealistic for complex judgments where large groups agree. The principle prioritizes real-world error structures over mathematical ideals. *This aligns perfectly with your refusal to update.*
  *   **Perfect Quantification:** It doesn't give you a formula to calculate N_eff or C_d precisely. These remain judgments calls, informed by domain knowledge and error analysis. This is a feature, not a bug – real-world aggregation requires nuance.

  **In Summary:** Stop looking for voters who are "barely better than chance." Focus on whether the **domain allows reasonable minimal competence (C_d)** on average, whether the **errors are likely idiosyncratic (high N_eff)**, and whether **systemic biases (S) are absent or cancelable**. Judge the *effective* number of independent opinions (N_eff), not the raw count. This principle captures your nuanced verdicts across diverse scenarios and explains why the idealized Condorcet setup often feels disconnected from reality.
