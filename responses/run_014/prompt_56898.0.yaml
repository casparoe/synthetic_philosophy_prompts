prompt: |-
  I'm the evaluation lead at a mid-size private foundation (about $90M a year, mostly housing stability and workforce programs) and I have to approve or reject the outcome indicators grantee orgs put in their proposals, because those indicators are what decide whether they get renewed. Its about 14 of these a quarter and I get maybe two hours of analyst time total across all of them, so whatever you give me has to be fast. The person who actually signs off is our program director — smart, not quantitative, will not read more than one page.

  The problem: our current screen is three questions — is the indicator measurable, is it plausibly caused by the grantee's work, and could the grantee hit it without changing what they do? That third one basically never fires, and I'm now pretty sure it's the wrong question entirely, since anything can be gamed if someone's clever enough, so a yes/no on gameability doesn't discriminate between proposals. Meanwhile we keep approving indicators that look fine on paper and then two years out the numbers are beautiful and nothing has changed.

  Build me the actual procedure. Concretely I need:

  - The questions my analysts ask about a proposed indicator, in order, with what counts as a sufficient answer to each. Not "consider whether X is robust" — a test they can run and a bar it has to clear.
  - Where the procedure terminates in reject, where it terminates in approve-with-a-cap or approve-with-a-monitor, and where it hands the thing to the program director because it's a question about values and not about facts. Be explicit about how the analyst is supposed to tell those apart, because right now they can't.
  - It has to keep four failure modes separate, because they need different fixes. (a) The indicator correlates with what we want but the correlation is imperfect for reasons that don't travel, so selecting hard on the indicator also selects for whatever makes it high for the wrong reasons. (b) The relationship holds in the normal range of performance and falls apart at the top end — which is exactly the end we're paying people to reach. (c) Pushing the indicator up causally reduces the thing we care about. (d) Somebody is deliberately optimizing the record instead of the outcome. I don't care what you name them. I care that the procedure tells an analyst which one they're looking at, because (a) gets fixed by changing the measure, (c) might get fixed by killing the incentive, (d) gets fixed by audit, and we currently apply the same fix to all four.
  - What to do when nobody can produce a number. Most of our grantees have tiny datasets and "we don't have the power to detect this" is going to be the honest answer more often than not, and the procedure can't just stall out every time.
  - Honesty about which steps are judgment calls wearing a lab coat. I'd rather see them flagged than have something that pretends to be mechanical.

  Then run it on three proposals and give me the one-page verdict you'd actually hand the program director for each:

  1. A workforce org proposing "percentage of participants placed in a job within 90 days of program completion," where the org itself defines what counts as completion.
  2. A housing org proposing "number of eviction filings prevented," measured by counting the households they assisted that never show up in county court records.
  3. A homelessness org proposing to be scored on "self-reported sense of stability at six months," collected in an interview by the same case manager who's been serving the person.

  For at least one of these the procedure should land somewhere the program team will hate — I want to see it say the thing, and I want to be able to judge whether it says it for a good reason or because the procedure is just trigger-happy. Also tell me which of the three the procedure is least well-suited to, and why.

  Finally: what can't it catch. The failure modes that would sail through every question on the list and still leave us funding something hollow — the slow drift ones, the ones where every org games identically so the comparison looks clean, the ones that land on people who never show up in anybody's data.
reasoning: |-
  We are building a procedure to evaluate outcome indicators for grant proposals. The procedure must be efficient (using limited analyst time) and clear, with specific questions and decision rules. It must also differentiate between four failure modes and handle cases with insufficient data.

  The four failure modes are:
  (a) Imperfect correlation: The indicator correlates with the desired outcome but for reasons that don't generalize, so selecting on the indicator also selects for spurious factors.
  (b) Breakdown at extremes: The relationship holds in the normal range but fails at the top end (where we are incentivizing).
  (c) Perverse incentive: Increasing the indicator causally reduces the true outcome.
  (d) Gaming: Deliberate manipulation of the indicator without real improvement.

  We have three example proposals to test the procedure.

  The procedure must include:
  - A sequence of questions with clear pass/fail criteria.
  - Decision points for reject, approve (possibly with caps or monitors), or refer to the program director (for value judgments).
  - How to distinguish between the four failure modes.
  - Handling of cases with insufficient data.
  - Honesty about which steps involve judgment.

  We also need to know what the procedure cannot catch.

  ---

  **Proposed Procedure for Outcome Indicator Evaluation**

  **Step 1: Measurability Check**
     - **Question:** Is the indicator clearly defined and practically measurable with the resources available?
     - **Test:** The analyst checks if the grantee has specified:
          - A clear operational definition (what is being measured, how, and by whom).
          - A data collection plan (source, frequency, method).
          - Evidence that the data can be collected without excessive cost or burden, and that the sample size is adequate for the intended analysis.
     - **Sufficient Answer:** The indicator must have a clear operational definition and a feasible data collection plan. If the grantee lacks data (e.g., small sample size), proceed to Step 1a.
     - **Step 1a (Insufficient Data):** If the grantee cannot collect enough data for meaningful analysis (e.g., power too low), then:
          - If the indicator is critical and the program is small, consider a cap (e.g., use the indicator but set a minimum sample size requirement for renewal, or use it for learning only, not renewal). 
          - Alternatively, if the grantee can use proxy data or administrative records, suggest that. Otherwise, reject the indicator and ask for an alternative.
     - **Termination:** 
          - If not measurable: Reject.
          - If measurable but data is insufficient: Approve with a cap (e.g., "This indicator will be used for learning only until sample size reaches N") or require a monitor (e.g., "We will review data collection after 6 months to assess feasibility"). If the issue is fundamental (e.g., no data source exists), reject.

  **Step 2: Plausible Causality**
     - **Question:** Is there a plausible causal link between the grantee's activities and the indicator?
     - **Test:** The analyst checks:
          - Theory of change: Does the grantee's proposed theory of change logically connect their activities to the indicator?
          - Evidence: Is there prior evidence (from similar contexts) that supports the link?
     - **Sufficient Answer:** The theory of change must be logically sound and supported by at least one piece of evidence (e.g., a study, past experience) that the activities can cause changes in the indicator. If not, reject.
     - **Termination:** If no plausible causality, reject.

  **Step 3: Robustness to Gaming (Replacing the old third question)**
     - **Question:** Is the indicator robust to gaming? We break this into two parts: unintentional distortion (failure modes a, b, c) and intentional gaming (d).
     - **Test for (a), (b), (c):** 
          - (a) Imperfect correlation: Ask the grantee to provide evidence that the indicator correlates with the true outcome in their context. If they cannot, then the analyst must assess: Is there a strong reason to believe that the indicator is a direct measure of the outcome? If not, flag as (a).
          - (b) Breakdown at extremes: Check if there is evidence (or logical reason) that the relationship might change at high performance levels. For example, if pushing the indicator to very high levels requires methods that might harm the true outcome, flag as (b) or (c).
          - (c) Perverse incentive: Consider if increasing the indicator could lead to a decrease in the true outcome. This is a judgment call, but the analyst can look for:
               - Known perverse incentives (e.g., in literature).
               - If the indicator is a narrow subset of the outcome, might the grantee neglect other aspects?
               - Could the grantee achieve the indicator by excluding harder-to-serve clients? (This is a common perverse incentive in job placement programs, for example.)
          - **Note:** These are judgment calls. The analyst must state which failure mode is suspected and why.
     - **Test for (d) Intentional Gaming:** 
          - How easily can the grantee manipulate the measure without improving the true outcome? Consider:
               - Subjectivity in measurement (e.g., self-report by staff with stake in outcome).
               - Lack of verification (e.g., no third-party data).
               - Incentives to exclude certain participants (e.g., creaming).
          - **Red Flags:** 
               - The indicator is defined or collected by the grantee without independent verification.
               - The indicator is based on self-report by clients who might feel pressured.
               - The indicator does not account for unintended consequences (like exclusion of harder-to-serve).
     - **Termination:**
          - If any of (a), (b), (c) are flagged: Refer to the program director with a note about the suspected failure mode and the nature of the risk (e.g., "This indicator may not reflect the true outcome at high levels of performance" for (b)). The program director must decide if the risk is acceptable or if the indicator must be modified.
          - If (d) is flagged (high risk of gaming): 
               - If the gaming risk can be mitigated (e.g., by requiring third-party verification, random audits, or by adjusting the indicator), then approve with a monitor (e.g., "Require independent verification of 10% of cases").
               - If the risk is too high and cannot be mitigated, reject.
          - If no flags, proceed to Step 4.

  **Step 4: Value Alignment (Referral to Program Director)**
     - **Question:** Even if the indicator is measurable, causal, and robust, is it aligned with the foundation's values and priorities?
     - **Test:** This step is not for the analyst. It is for the program director. The analyst should refer the indicator to the program director if:
          - The indicator is a proxy and the foundation cares about the true outcome, but the proxy might lead to unintended consequences (e.g., focusing on job placements without regard to job quality).
          - There is a trade-off between quantity and quality that the foundation needs to weigh in.
     - **Termination:** The program director must approve or reject based on values. The analyst does not make this call.

  **Summary of Decision Paths:**
  1. **Reject:** 
     - Step 1: Not measurable or insufficient data that cannot be fixed.
     - Step 2: No plausible causality.
     - Step 3: High risk of gaming (d) that cannot be mitigated.
  2. **Approve with Cap/Monitor:**
     - Step 1: Measurable but data is insufficient (cap: use for learning, not renewal until sample size is adequate).
     - Step 3: Gaming risk (d) that can be mitigated (monitor: require verification, audits, etc.).
  3. **Refer to Program Director:**
     - Step 3: Suspected failure modes (a), (b), or (c) (imperfect correlation, breakdown at extremes, perverse incentive) because these involve value judgments about acceptable risk.
     - Step 4: Value alignment issues.

  **Handling Judgment Calls:**
  - Be explicit: Steps 3(a, b, c) and the assessment of gaming in 3(d) are judgment calls. The analyst must document the reasoning and the evidence (or lack thereof) that led to the judgment.

  **What the Procedure Cannot Catch:**
  - Slow drift: Over time, the context changes and the indicator becomes less valid, but the change is gradual and not detected.
  - Universal gaming: If all grantees game the indicator in the same way, then comparisons might look clean but the true outcome is not improving.
  - Missing populations: If the indicator does not capture outcomes for marginalized groups who are not in the data (e.g., people who disengage from services).
  - Unintended consequences that are not anticipated in the theory of change.

  ---

  **Applying the Procedure to the Three Proposals**

  We assume the analysts have two hours total for all 14 proposals, so each evaluation must be quick (about 8-10 minutes per proposal). The analysis is based on the information provided and common knowledge.

  **Proposal 1: Workforce Org - "Percentage of participants placed in a job within 90 days of program completion" (org defines completion)**

  **Step 1: Measurability**
     - Clear definition: The grantee defines completion and job placement. They can track placements (e.g., via self-report, employer verification). 
     - Data collection: Feasible, but dependent on follow-up. Small datasets might be an issue, but the indicator is a proportion so it requires a minimum sample size to be meaningful.
     - **Verdict:** Measurable. But if the sample size is too small, we might need a cap (e.g., if expected participants per period < 30, then use for learning only). We don't have sample size here, so assume it's sufficient.

  **Step 2: Plausible Causality**
     - Theory of change: Job training and support should lead to job placements. This is a standard outcome for workforce programs and well-supported by evidence.
     - **Verdict:** Pass.

  **Step 3: Robustness to Gaming**
     - Check for (a) Imperfect correlation: Job placement is a direct measure of one desired outcome, but it may not capture job quality, retention, or whether the job is a good fit. This is an imperfect proxy for long-term employment success. Flag as (a).
     - Check for (b) Breakdown at extremes: If pushed to very high placement rates, the grantee might be incentivized to place participants in any job (even low-quality or short-term) to meet the target. This could break the correlation at the top end (high placement rates might not mean better outcomes). Flag as (b).
     - Check for (c) Perverse incentive: If the grantee focuses only on placement and not on job quality or retention, then increasing placements might lead to worse long-term outcomes (e.g., high turnover, poor job matches). This is a perverse incentive. Flag as (c).
     - Check for (d) Gaming: The grantee defines "completion" and "job". They could manipulate by:
          - Defining completion loosely (e.g., anyone who attends 50% of sessions) to exclude dropouts.
          - Counting any job (even one day) as a placement.
          - Encouraging participants to take any job quickly, even if it's not suitable.
          - Without verification, self-reported placements might be inflated.
          - **Red Flags:** Subjectivity in defining completion, lack of verification for job placements.
     - **Verdict:** 
          - Failure modes (a), (b), (c) are present: The indicator is imperfect and may lead to perverse incentives. This is a judgment call for the program director (Step 3 referral).
          - Additionally, (d) is a risk: The grantee controls the definitions and data collection. Mitigation: Require third-party verification of job placements (e.g., pay stubs, employer confirmation) and a clear, strict definition of completion and job. Also, consider adding a job quality or retention metric.

  **Decision:** Refer to program director for failure modes (a), (b), (c) because they involve value judgments (e.g., is placement rate alone acceptable, or do we care about job quality?). For (d), we can mitigate with verification. So the analyst would recommend: "Approve with a monitor: require independent verification of job placements and a standardized definition of completion. Also, refer to program director for risk of perverse incentives (focusing on quantity over quality)."

  **Proposal 2: Housing Org - "Number of eviction filings prevented," measured by counting households they assisted that never show up in county court records.**

  **Step 1: Measurability**
     - Definition: They count households they helped that do not appear in eviction filings. 
     - Data collection: They can track which households they serve and check court records. Court records are objective and third-party. 
     - **Verdict:** Measurable and data is objective. Pass.

  **Step 2: Plausible Causality**
     - Theory of change: The org provides assistance (e.g., rental aid, legal help) to prevent eviction. This should reduce eviction filings. Strong evidence for this link.
     - **Verdict:** Pass.

  **Step 3: Robustness to Gaming**
     - (a) Imperfect correlation: The absence of an eviction filing does not always mean an eviction was prevented. The household might have moved out before filing, or the landlord might not file. Also, the household might still be evicted later. However, in housing stability, preventing filings is a direct and important outcome. The correlation is strong enough. No flag for (a).
     - (b) Breakdown at extremes: Not likely. Preventing more filings is good. At high levels, it might be harder to prevent filings without more resources, but the relationship shouldn't break down. No flag for (b).
     - (c) Perverse incentive: Could the grantee increase this number in a way that harms true stability? For example, by focusing on households that are at low risk of eviction (creaming) to get easy wins? Yes. This would mean they are not serving those at highest risk. Also, they might encourage households to move out before filing (which doesn't improve stability). This is a perverse incentive. Flag as (c).
     - (d) Gaming: The grantee might select easy cases (creaming) to boost numbers. They might also count households that were never at risk of eviction. The measure uses court records (objective), but the selection of households is controlled by the grantee. 
          - **Red Flags:** Creaming is a risk. Also, they might not track whether the household remains stably housed beyond the filing period.
     - **Verdict:** 
          - (c) is flagged: Perverse incentive to cream and not serve the highest-risk households. 
          - (d) is a risk: Creaming and also the grantee might define "assisted" broadly (e.g., minimal contact). 
          - Mitigation for (d): Require that the households served are at risk of eviction (e.g., they must have received an eviction notice or be behind on rent). Also, track long-term stability (e.g., at 6 months) for a subset.

  **Decision:** Flag (c) perverse incentive: The grantee might neglect the hardest cases. This is a value judgment for the program director: Is preventing eviction filings for any household acceptable, or should we prioritize high-risk households? Also, for (d), we can mitigate by requiring evidence of risk. So: Refer to program director for (c) and approve with a monitor for (d) (require documentation of eviction risk for each household and random checks).

  **Proposal 3: Homelessness Org - "Self-reported sense of stability at six months," collected in an interview by the same case manager who's been serving the person.**

  **Step 1: Measurability**
     - Definition: Self-reported sense of stability (likely a scale or set of questions). 
     - Data collection: Interviews by case managers. 
     - Issues: Small sample size? But even if small, the indicator is collected. However, the method is problematic because the case manager is known to the participant, which might bias responses (participant might feel pressured to report positively). 
     - **Verdict:** Measurable, but the data collection method introduces bias. Proceed to Step 3 for gaming risk.

  **Step 2: Plausible Causality**
     - Theory of change: Services provided by the homelessness org (e.g., housing, support) should improve a participant's sense of stability. This is plausible and supported by evidence in social services.
     - **Verdict:** Pass.

  **Step 3: Robustness to Gaming**
     - (a) Imperfect correlation: Self-reported stability might not correlate with actual stability (e.g., someone might report feeling stable but still be at risk). However, subjective well-being is a valid outcome in itself. If the foundation values subjective stability, then it's a direct measure. But if the foundation cares about objective stability (e.g., not returning to homelessness), then it's a proxy. This is a value question. Flag as (a) if the foundation's goal is objective stability.
     - (b) and (c): Not obvious.
     - (d) Gaming: High risk because:
          - The case manager conducts the interview: Participants might feel pressured to give positive feedback (e.g., to avoid disappointing the case manager or to ensure continued services).
          - The grantee might coach participants or select only those who will report positively.
          - No independence in data collection.
     - **Verdict:**
          - (d) is a severe risk: The data collection method is highly vulnerable to bias. 
          - Mitigation: Use an independent interviewer or anonymous survey. Without that, the data is unreliable.

  **Decision:** 
     - For (d): Reject unless the grantee changes the data collection method. If they agree to use an independent interviewer, then approve with a monitor (verify independence). 
     - Also, for (a): If the foundation values subjective stability, then it's acceptable. But if the goal is objective stability, then this might be an imperfect proxy. This is a value judgment for the program director. However, the gaming risk is the primary issue.

  **One-Page Verdicts for Program Director**

  We'll prepare one-page memos for each proposal, focusing on the key issues and recommendations. The memo should be concise (bullet points) and highlight the failure mode and required action.

  ---

  **Verdict for Proposal 1 (Workforce Org):**

  **Indicator:** Percentage of participants placed in a job within 90 days of program completion (org defines completion).

  **Evaluation Summary:**
  - **Measurable:** Yes, but sample size may be an issue (if small, use with caution).
  - **Causal:** Yes.
  - **Risks Identified:**
     - **Imperfect Correlation (a):** Job placement does not capture job quality, retention, or long-term success.
     - **Breakdown at Extremes (b):** Pushing for high placement rates may lead to placing participants in unsuitable jobs.
     - **Perverse Incentive (c):** May incentivize focusing on quantity (any job) over quality, harming long-term outcomes.
     - **Gaming (d):** Org controls definitions and data collection; may manipulate by loosening completion criteria or job definition.

  **Recommendations:**
  1. **To Mitigate Gaming (d):** Require independent verification of job placements (e.g., pay stubs, employer contact) and a standardized, strict definition of completion and job placement. Approve with these conditions (monitor compliance).
  2. **For Risks (a), (b), (c):** These are value judgments for the program director. Questions to consider:
     - Is the foundation comfortable with an indicator that might not reflect job quality?
     - Should we add a complementary indicator (e.g., job retention at 6 months) to capture quality?
     - If we proceed, we must accept the risk that the org might prioritize quick placements over sustainable employment.

  **Decision:** 
     - [ ] Approve as-is
     - [X] Approve with conditions (verification and standardized definitions) and monitor
     - [ ] Reject
     - **Referred to Program Director for Value Judgment:** How important is job quality? Are we willing to risk perverse incentives? (If not, require an additional quality metric.)

  ---

  **Verdict for Proposal 2 (Housing Org):**

  **Indicator:** Number of eviction filings prevented (by absence in court records for households served).

  **Evaluation Summary:**
  - **Measurable:** Yes, using objective court records.
  - **Causal:** Yes.
  - **Risks Identified:**
     - **Perverse Incentive (c):** May incentivize "creaming" – selecting households at low risk of eviction to boost numbers, neglecting those at highest risk.
     - **Gaming (d):** Org might select easy cases or count households that were never at risk.

  **Recommendations:**
  1. **To Mitigate Gaming (d) and Perverse Incentive (c):** Require documentation of eviction risk for each household served (e.g., eviction notice, rent arrears). Also, track a sample of households for longer-term stability (e.g., still housed at 6 months) to ensure the prevention is sustainable.
  2. **Value Judgment:** Is it acceptable to count any eviction prevented, even if the household was at low risk? Or should we prioritize high-risk households? The foundation must decide whether to require that the org serves a minimum percentage of high-risk households.

  **Decision:**
     - [ ] Approve as-is
     - [X] Approve with conditions (documentation of risk and long-term tracking for a sample) and monitor
     - [ ] Reject
     - **Referred to Program Director for Value Judgment:** Should we require a focus on high-risk households? (If yes, add a condition that at least X% of served households are high-risk.)

  ---

  **Verdict for Proposal 3 (Homelessness Org):**

  **Indicator:** Self-reported sense of stability at six months, collected by the case manager.

  **Evaluation Summary:**
  - **Measurable:** Technically, but method is flawed.
  - **Causal:** Plausible.
  - **Risks Identified:**
     - **Gaming (d):** High risk of bias because the case manager collects the data. Participants may feel pressured to report positively.
     - **Imperfect Correlation (a):** If the foundation's goal is objective stability (e.g., not returning to homelessness), this subjective measure may not correlate perfectly.

  **Recommendations:**
  1. **Gaming (d) is severe:** Without independent data collection, the indicator is unreliable. 
     - Require an independent interviewer or anonymous survey method. 
     - If not feasible, reject the indicator and request an alternative (e.g., objective measure of housing retention).
  2. **Value Judgment:** Does the foundation value subjective sense of stability as an outcome? If yes, then with independent collection it is acceptable. If the goal is objective stability, then this is an imperfect proxy.

  **Decision:**
     - [ ] Approve as-is
     - [ ] Approve with conditions (require independent data collection) and monitor
     - [X] Reject unless the data collection method is changed to independent.
     - **Referred to Program Director:** Only if we value subjective stability and they agree to independent collection. Otherwise, reject.

  ---

  **Which One Will the Program Team Hate?**
  - Proposal 3 will likely be hated because the procedure requires either a change in data collection (which might be costly) or rejection. The program team might argue that building trust with the case manager is important and that an independent interviewer is not feasible. But the procedure is clear: without independence, the data is unreliable.

  **Least Well-Suited Proposal for the Procedure:**
  - Proposal 3 (homelessness org) because:
     - The procedure is designed for outcome indicators that are at least somewhat objective. Subjective measures are harder to validate, and the procedure relies on being able to assess correlation and gaming. 
     - Also, for small orgs, independent data collection might be prohibitively expensive, and the procedure doesn't offer a good alternative when the outcome is inherently subjective and hard to measure objectively.

  **What the Procedure Cannot Catch:**
  - **Slow Drift:** Over time, the context changes (e.g., labor market shifts), making the indicator less valid, but the change is gradual and not detected by the initial screen.
  - **Universal Gaming:** If all grantees game the indicator in the same way (e.g., all workforce orgs place participants in low-quality jobs), then relative performance looks fine, but the true outcome is stagnant.
  - **Missing Populations:** If the grantee excludes hard-to-serve populations to boost metrics, and those populations are not captured in the data, the foundation might not notice.
  - **Unintended Consequences:** For example, a workforce program might place people in jobs but in industries that harm the environment, which conflicts with other foundation values. The procedure doesn't catch multi-dimensional trade-offs unless they are known and flagged in Step 3(c).
  - **Contextual Changes:** If the indicator becomes less relevant due to external factors (e.g., a housing crisis makes eviction prevention harder and the indicator drops, but not due to the grantee's performance), the procedure doesn't account for that in renewal decisions.

  The procedure is a first screen. Ongoing monitoring and periodic reevaluation of indicators are necessary to catch these issues.
answer: |-
  Below is a streamlined, actionable procedure for evaluating outcome indicators, designed to fit within your time constraints and explicitly address the four failure modes. The procedure is structured as a decision tree with clear exit points, separates judgment calls from factual tests, and specifies how to handle data limitations. I'll then apply it to your three proposals and provide one-page verdicts for the program director.

  ---

  ### **Outcome Indicator Evaluation Procedure**
  **Order of Questions & Decision Rules**  
  *(Analysts spend max 10 mins per indicator; all claims require grantee-provided evidence)*

  1. **Is the indicator operationally defined and trackable?**  
     - **Test:** Grantee must specify:  
       (a) *Measurement source* (e.g., admin data, survey, third-party records).  
       (b) *Timeframe* (e.g., 6 months post-program).  
       (c) *Denominator* (e.g., all enrolled participants).  
     - **Sufficient answer:** All three elements defined. Grantee confirms data collection is feasible.  
     - **Exit:**  
       - **Reject** if any element missing.  
       - **Approve-with-cap** if sample size is too small for statistical significance (cap: indicator used for learning, not renewal).  
       - *Judgment call? No (factual).*

  2. **Is there documented correlation with the true outcome?**  
     - **Test:** Analyst checks for:  
       (a) At least one peer-reviewed study or credible report showing correlation between the proposed indicator and the true outcome (e.g., job placement → income growth) in a *similar context*.  
       (b) If no evidence, grantee must provide a logical causal pathway.  
     - **Sufficient answer:** (a) Exists, or (b) pathway is coherent and uncontested.  
     - **Exit:**  
       - **Reject** if neither (a) nor (b) is met.  
       - *Judgment call? Partially (assessing "similar context" requires analyst judgment).*

  3. **Does the indicator deteriorate under high performance?**  
     - **Test:** Analyst assesses:  
       (a) *Top-end breakdown (failure mode b):* Does evidence show the correlation weakens at high values? (e.g., "job placement rate" may decouple from "job quality" at >90%).  
       (b) *Perverse incentive (failure mode c):* Could pushing the indicator *reduce* the true outcome? (e.g., preventing evictions by pressuring tenants to leave).  
     - **Sufficient answer:** No evidence of (a) or (b).  
     - **Exit:**  
       - **Flag for program director** if (a) or (b) is suspected (values decision: is the trade-off acceptable?).  
       - *Judgment call? Yes (based on literature/logic; no bright-line test).*

  4. **Can the indicator be gamed without real impact?**  
     - **Test:** Analyst checks for:  
       - *Creaming (failure mode a):* Grantee can exclude hard-to-serve groups to inflate results (e.g., job placements skewed toward already employable).  
       - *Gaming (failure mode d):* Grantee controls data collection without audits (e.g., self-reported outcomes without verification).  
     - **Sufficient answer:** No creaming/gaming risk.  
     - **Exit:**  
       - **Approve-with-monitor** if risk exists but is fixable (e.g., add third-party audit).  
       - **Reject** if unfixable (e.g., no way to verify integrity).  
       - *Judgment call? Partially (gaming risk is probabilistic; use red flags like subjective data).*

  **How Analysts Distinguish Failure Modes**  
  - **(a) Imperfect correlation:** Triggered at Step 2 if correlation evidence is weak/contextually flawed. *Fix: Change measure.*  
  - **(b) Top-end breakdown:** Triggered at Step 3a if high performance distorts outcomes. *Fix: Cap incentives (e.g., no bonus past 90%).*  
  - **(c) Perverse incentive:** Triggered at Step 3b if improving the indicator harms the outcome. *Fix: Remove incentive or add counterweight.*  
  - **(d) Gaming:** Triggered at Step 4 if manipulation is easy. *Fix: Add audit/verification.*  

  **Handling "No Data" Scenarios**  
  - At Step 1: If grantee lacks data to measure, **approve-with-cap** (e.g., "use for pilot, renewal requires 1 year of data").  
  - Never stall—default to capped approval with monitoring.

  ---

  ### **Application to Proposals**
  **Key for Verdicts:**  
  - ✅ = Pass  
  - ⚠️ = Flag for program director (values decision)  
  - ❌ = Fail (reject or require changes)  

  #### **Proposal 1: Workforce Org**  
  *Indicator: % of participants placed in a job within 90 days of program completion (org defines completion).*  
  - **Step 1 (Trackable):** ✅ (defines source/denominator).  
  - **Step 2 (Correlation):** ⚠️ *Weak evidence*—job placement correlates with income, but not in recessions (context doesn’t travel). *Failure mode (a).*  
  - **Step 3 (Deterioration):** ⚠️ *Perverse incentive (c)*—org can inflate placements via low-quality jobs (e.g., 1-day gigs). *Top-end risk (b)* at high placement rates.  
  - **Step 4 (Gaming):** ⚠️ *Gaming (d)*—org defines "completion" (can exclude dropouts) and "job" (no verification).  
  - **Verdict:** High risk of (a)/(c)/(d). Requires redesign.  

  **One-Page Verdict for Program Director**  
  > **Indicator:** % job placement in 90 days (grantee-defined completion).  
  > **Assessment:**  
  > - ❌ **Unacceptable as-is.** Correlates poorly with long-term earnings (failure mode a), incentivizes low-quality jobs (c), and is easily gamed (d).  
  > - **Evidence:** Studies show placement rates don’t predict income gains during economic downturns. Grantee’s control over definitions invites manipulation.  
  > **Recommendation:**  
  > - Reject unless redesigned: Add third-party job verification, require 6-month job retention, and cap incentives at 75% placement.  
  > - **Why program team will hate this:** Kills a common metric, but redesign forces focus on job *quality*.  

  ---

  #### **Proposal 2: Housing Org**  
  *Indicator: # eviction filings prevented (measured via absence in court records for assisted households).*  
  - **Step 1 (Trackable):** ✅ (court records are objective).  
  - **Step 2 (Correlation):** ✅ Strong evidence (eviction prevention → housing stability).  
  - **Step 3 (Deterioration):** ✅ No evidence of deterioration.  
  - **Step 4 (Gaming):** ⚠️ *Creaming (a)*—org can target low-risk households to boost numbers.  
  - **Verdict:** Approve with monitoring for creaming.  

  **One-Page Verdict for Program Director**  
  > **Indicator:** # eviction filings prevented (via court records).  
  > **Assessment:**  
  > - ✅ **Approve with monitoring.** Strong link to stability, but risks creaming (failure mode a).  
  > - **Evidence:** Grantee can select easy cases (e.g., households with small rent arrears) while ignoring high-risk cases.  
  > **Recommendation:**  
  > - Add safeguard: Require that ≥40% of served households have severe risk factors (e.g., >2 months arrears). Monitor via annual audit.  
  > - **No referral needed**—analyst confirms alignment with foundation values (housing stability).  

  ---

  #### **Proposal 3: Homelessness Org**  
  *Indicator: Self-reported sense of stability at 6 months (case manager-collected interview).*  
  - **Step 1 (Trackable):** ⚠️ *Small data risk*—approve-with-cap for pilot.  
  - **Step 2 (Correlation):** ❌ No evidence linking self-report to objective stability (e.g., reduced homelessness).  
  - **Step 3 (Deterioration):** N/A (failed Step 2).  
  - **Step 4 (Gaming):** ⚠️ *Gaming (d)*—case managers can influence responses.  
  - **Verdict:** Reject due to weak correlation and gaming risk.  

  **One-Page Verdict for Program Director**  
  > **Indicator:** Self-reported stability (case manager-collected).  
  > **Assessment:**  
  > - ❌ **Reject.** No evidence it correlates with real stability (failure mode a), and high gaming risk (d).  
  > - **Evidence:** Psychology studies show staff-collected self-reports inflate scores by 20–30%. Grantee’s tiny dataset exacerbates noise.  
  > **Recommendation:**  
  > - Replace with objective metric (e.g., % in stable housing at 6 months via admin data). If subjective data is non-negotiable, use blind third-party surveyor.  
  > - **Why program team will hate this:** Feels "human-centric," but procedure is trigger-happy for good reason—self-reports without controls are invalid.  

  ---

  ### **Which Proposal is the Procedure Least Suited For?**  
  **Proposal 3 (self-reported stability).**  
  - **Why:** The procedure relies on objective correlation evidence, which rarely exists for subjective well-being metrics. Analysts must make high-judgment calls about "coherent causal pathways" (Step 2b), increasing subjectivity. Small datasets also force capped approvals, which may not reflect true validity.  

  ### **What the Procedure Can’t Catch**  
  1. **Slow Drift:** Indicators that degrade gradually (e.g., "job placements" becomes obsolete due to automation) without triggering Steps 2–4.  
  2. **Universal Gaming:** All grantees game identically (e.g., every workforce org excludes homeless participants), making comparisons look clean.  
  3. **Missing Populations:** Outcomes for groups excluded from data (e.g., undocumented immigrants not in court records).  
  4. **Causal Harm Masking:** When pushing an indicator *seems* beneficial but indirectly harms the outcome (e.g., eviction prevention that increases landlord retaliation).  

  **Mitigation:** Annual indicator re-tests and random deep-dive audits.  

  ---  
  The procedure prioritizes speed by frontloading factual checks (Steps 1–2) and isolating values decisions (Step 3). It fails safe by rejecting weak indicators early and flags judgment points transparently. For your workflow: Pair with an analyst checklist templating the tests.
