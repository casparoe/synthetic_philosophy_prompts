prompt: |-
  Having recently been co-opted onto my parish council, I have become preoccupied by a pattern of compliance I observe in myself and my neighbours. We pay council tax willingly, attend consultations, and expect the police and bins to function, yet we routinely and quietly ignore particular rules we regard as pointless, for example leaving bins out a day early despite the fixed collection timetable and using a closed footpath across a field because the official diversion adds twenty minutes, without any wish to protest or to invite others to do the same. Is there an established name for this quiet, selective, non-protest noncompliance by people who otherwise accept the system, and if not, what should we call it. I do not want a bare label; please explain what the phenomenon is, what it is not, and where its edges lie by comparing it to the two or three closest established ideas and saying which fits best and why the others fail. Please answer in British English as a numbered list of exactly five items, each of one or two sentences, with no introduction or conclusion, and use one item to state which argument or consideration would most likely change your mind about the classification.
reasoning: |-
  Okay, the user is a member of their parish council who's noticed a pattern among themselves and neighbours: they comply with most rules like paying taxes but quietly ignore specific ones they see as pointless, like putting bins out early or using a closed footpath. They want to know if there's a name for this "quiet, selective, non-protest noncompliance" that doesn't challenge the system overall. The query asks for a precise classification, comparisons to similar concepts, and what might change their mind, all in British English as a five-item numbered list with no intro or conclusion.

  First, I need to recall relevant sociological or political concepts. Civil disobedience comes to mind, but that involves public protest to challenge laws, which doesn't fit here since the user describes no intent to protest or change anything. Everyday resistance is another idea – it's subtle and individual, like James Scott's work on hidden defiance by subordinate groups. That seems closer because it's about quiet noncompliance, but Scott's theory often frames it as resistance against oppression or power imbalances, which might not align with the user's context of generally accepting the system.

  Then there's the concept of social or informal norms versus formal rules. People often follow unwritten community practices over official ones if they seem inefficient, like the footpath example. This could be seen as a form of "pragmatic noncompliance" or "customary practice," where habits override bureaucracy without any deeper opposition. That feels like a strong fit because it explains the selective, low-stakes ignoring of rules that don't make sense locally.

  I should also consider rule avoidance or benign noncompliance. These emphasize the lack of protest and focus on convenience, which matches the bin and footpath scenarios. Unlike civil disobedience, there's no moral stance or call for change; it's just about practicality. And it's distinct from systemic rejection since people aren't opposing the whole structure.

  Now, to build the response: I'll define the phenomenon first, then compare it to civil disobedience, everyday resistance, and rule avoidance. I'll argue that rule avoidance fits best because it captures the apolitical, pragmatic nature without resistance undertones. For the mind-changing item, I'll note that evidence of any intent to resist or undermine authority could shift it toward everyday resistance.

  The user is likely seeking validation and understanding, not just a label. They might be worried about hypocrisy or community dynamics, so explaining this as common and non-threatening could address deeper concerns. Using British terms like "council tax" and "bins" keeps it relatable. Structuring as exactly five numbered items ensures clarity and adherence to their request.
answer: |-
  1.  This phenomenon is best termed **customary noncompliance** or **pragmatic rule avoidance**: it's the quiet, selective disregard of specific, low-stakes administrative rules deemed locally inefficient or pointless, enacted without challenge to the wider system's legitimacy or intent to mobilise others, motivated purely by convenience or established habit.
  2.  It is **not civil disobedience**, which involves public, principled law-breaking specifically intended to protest an injustice and provoke change; here, actions are private, lack protest intent, target minor administrative rules not perceived as unjust, and seek to avoid notice, not provoke a response.
  3.  It differs from **everyday resistance** (e.g., Scott's concept), which implies subtle acts by subordinate groups to undermine authority or mitigate oppression; this lacks that power-challenging motive, occurs amongst generally compliant citizens accepting authority, and targets bureaucratic inefficiency, not oppression.
  4.  It aligns most closely with **rule avoidance** or **benign noncompliance**, sharing the low-visibility, selective ignoring of inconvenient rules without broader challenge; however, it specifically characterises generally compliant citizens within a functioning system, distinct from avoidance driven by inability to comply or systemic alienation.
  5.  Evidence that these actions were motivated by an **implicit intent to resist authority or express latent dissent**, even if unspoken, rather than solely by immediate convenience or habit, would significantly shift classification towards 'everyday resistance'.
