prompt: |-
  My younger brother was in a car accident last month and declared dead by neurological criteria after two examinations twenty-four hours apart. His body remained on a ventilator for three more days while the organ donation team did their work. During those three days his chest rose and fell, his skin was warm, his wounds continued to heal, and when I held his hand it felt like holding a sleeping person's hand. The nurses spoke of him in the past tense and referred to him as "the donor." The death certificate lists a date two days before his heart stopped.

  I am not questioning the medical judgment or the donation — his organs saved four people, and he would have wanted that. But I am struggling with a philosophical question that has become urgently personal: what theory of life and death does this practice presuppose? The same body was dead for the purpose of extracting vital organs, yet alive enough that those organs remained viable, wounds healed, and a ventilator could drive respiration. What must we believe about what it means to be alive — or to be dead — for this to be coherent? Reconstruct the implicit theory, distinguish what the practice strictly presupposes from what it merely fits well with, and tell me where the practice is philosophically underdetermined.

  Please lead with your bottom line in the first sentence and then give your reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, let me start by unpacking the user's query. Their younger brother was declared dead by neurological criteria but kept on a ventilator for organ donation. The user is struggling with the philosophical underpinnings of this practice. They want to know what theory of life and death is presupposed here. 

  First, I need to recall the medical and legal definitions. Brain death is defined as the irreversible cessation of all brain functions, including the brainstem. That's the basis for declaring death before circulatory cessation. The user mentions that during those three days, the body showed signs like warm skin and healing wounds. So the question is how can the body perform these functions if it's considered dead?

  The user isn't questioning the medical decision but the philosophical consistency. They note that the body was dead for organ extraction but alive enough to sustain organs. This points to a distinction between biological life and the life of the organism as a whole. The key here is integrated biological functioning. When the brain is dead, the body's systems can be maintained artificially, but there's no central integration. 

  I should explain that brain death theory posits that without the brain, there's no self-regulation. The ventilator keeps oxygen flowing, so cells continue metabolizing, which allows wounds to heal. But the body can't maintain homeostasis on its own. So the theory separates cellular life from organismal life. 

  The user might be seeking validation of their experience—seeing their brother's body look alive but being told he's dead. The emotional conflict here is between clinical reality and personal perception. The practice presupposes that the loss of brain function equals death, even if the body appears alive. But the user's struggle is reconciling that with their sensory experience.

  I need to address where the practice is underdetermined. For example, how much brain function loss is necessary? There's debate about whether partial functions count. Also, the irreversibility criterion depends on medical capability, which can change. Philosophical views like higher brain theories might equate death with loss of consciousness, but the current standard includes the entire brain.

  The user's deeper need might be understanding how to process their loss. They might feel that the medical terminology dehumanized their brother ("the donor"). So acknowledging that tension between clinical efficiency and personal grief is important. Highlighting that the practice's coherence relies on a specific definition of life as integrated function could help them make sense of the situation.
answer: |-
  The practice presupposes the *neurological standard of death*, where death is defined as the irreversible cessation of all functions of the entire brain, including the brainstem, despite the artificial maintenance of cardiopulmonary functions and cellular/tissue activity.

  **Reasoning:**

  1.  **Core Presupposition: Brain Death as Organismal Death:** The practice strictly requires the belief that the integrated biological functioning of the organism *as a whole* ceases with the permanent loss of all brain function. The brainstem controls essential, automatic functions like breathing, consciousness, and regulating heartbeat, blood pressure, and body temperature. Without it, the body cannot maintain homeostasis independently. The ventilator and hormonal support temporarily sustain *subsystem* functions (cellular metabolism, circulation, wound healing) and organ viability, but they do not constitute the organism being alive as a unified, self-sustaining entity. The body is a collection of interdependent but now unintegrated biological processes.

  2.  **Distinguishing Life at Different Levels:** The practice fits well with a hierarchical view of life:
      *   **Organismal Life:** Requires integrated function, centrally coordinated by the brain. This is irreversibly lost in brain death.
      *   **Organ/Tissue/Cellular Life:** Can persist temporarily with artificial support (ventilator, fluids, hormones) due to residual oxygenation and metabolism. This explains wound healing and organ viability. The warmth and chest movement you observed were artifacts of this artificial subsystem support, not signs of the organism being alive.

  3.  **The Role of Irreversibility:** The practice strictly presupposes the *irreversible* nature of the neurological loss (confirmed by two exams 24 hours apart and the clinical context). If recovery were possible, organ retrieval would be homicide. The ventilator demonstrates the *permanence* of the condition – the body cannot breathe spontaneously because the brainstem is destroyed.

  4.  **Philosophical Underdetermination:**
      *   **The "Integrating Function" Threshold:** The practice assumes the *entire* brain's function is necessary for integration. It is underdetermined regarding whether the loss of *only* higher brain functions (consciousness, cognition) while the brainstem remains functional (permitting spontaneous breathing) constitutes death. The standard rejects the "higher brain" formulation, requiring brainstem death.
      *   **The Nature of the Organism "as a Whole":** The precise definition of what constitutes the integrated functioning of the organism "as a whole" is philosophically contestable. Does it require potential for consciousness? Or is brainstem-mediated regulation sufficient? The standard presupposes the latter.
      *   **Irreversibility vs. Current Technology:** The determination relies on current medical capabilities making reversal impossible. Philosophically, could future technologies challenge the irreversibility claim for *some* declared brain-dead states? The standard assumes current irreversibility is definitive.
      *   **The Significance of Appearance:** The practice is underdetermined regarding how to reconcile the appearance of life (warmth, color, healing, movement) with the declared state of death. Philosophically, it prioritizes functional integration over phenomenological appearance, but this creates the profound dissonance you experienced.

  The coherence hinges entirely on equating the death of the human being with the irreversible loss of all brain function, viewing the subsequently sustained biological processes as merely isolated subsystems artificially maintained, not evidence of the organism's continued life.
