  I've just finished a long argument with a friend about finkish and masked dispositions, and I'd like a clear comparison of the two phenomena. Explain precisely what each one is, what each threatens in the conditional or counterfactual analysis of dispositions, and why the fink case is typically said to be more serious than the mask case even though both involve a disposition that fails to manifest in the very circumstances that would ordinarily trigger it. Then take a side in the debate my friend and I were having: is the fink problem a genuine reductio of the conditional analysis of dispositions, or can it be defused — for instance, by restricting the triggering conditions in the analysis, by shifting to a more sophisticated counterfactual account, or by accepting that dispositions are not fully captured by any conditional at all? Defend your conclusion.
