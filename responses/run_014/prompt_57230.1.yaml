   (4) Both (2) and (3) as two levels -> we might not need this as a separate leaf if we can show the two levels in the reasoning, but we can have a leaf that separates the two assessments.
   (5) The case is underdescribed -> call this "Underdescribed"

   Alternatively, we might structure the tree so that (2) and (3) are combined or separated appropriately.

