prompt: |-
  I write about science and ideas, and for the past several weeks I have been reporting on a consortium of independent laboratories, each of which holds, on its own, the authority to decide whether to run a particular class of experiment: no member can veto another, and no proposal requires anyone else's consent. A decision theorist who has been advising the group sent me the argument below. I have read it closely enough to find it alarming and cannot quite take it apart. Each step looks reasonable to me on its own, yet the last one is a conclusion I do not believe anyone, including its author, would defend. I would be grateful if you would tell me which step to reject, why it looked sound, and what rejecting it would cost.

  (1) Each of the N member laboratories may, on its own authority, decide to proceed with a proposed experiment.

  (2) Each laboratory's judgment as to whether a given experiment is worth running is formed independently of the others' and is better than chance, though fallible.

  (3) A proposed experiment goes forward if at least one laboratory judges it worth running.

  (4) Consider any proposed experiment that is in fact not worth running. Each laboratory has some probability p, greater than zero, of mistakenly judging it worth running.

  (5) The probability that at least one laboratory so judges is 1 − (1 − p)^N, which rises with N and approaches certainty as the consortium grows.

  (6) So the larger the consortium, the closer to certain it is that any given bad experiment, once proposed, will be carried out by someone.

  (7) The same arithmetic ensures that good experiments are carried out more often as well, but the benefit of a good experiment is not of a size to offset the harm of a bad one, so the ledger worsens with size.

  (8) For any member who cares about the outcome, therefore, the expected harm the consortium does rises with the number of its members.

  (9) Hence a member should decline to act on his own authority, and should press instead for a rule under which nothing proceeds without the broad agreement of the membership.

  (10) Hence, other things equal, the consortium should be kept as small as possible and, if the sole aim were to minimize the chance of a bad experiment being run, would best be replaced by a single decision-maker, whose error rate is at least one person's rather than the union of N people's.

  Step (10) is where I balk. So far as I have ever been able to tell, the safe way to decide whether to run a dangerous experiment is not to hand the decision to one person; and yet (10) appears to follow from (4) through (6) by nothing more than arithmetic. If I must surrender something, I would rather not surrender (2): that the laboratories' judgments are independent, and individually better than chance, is the whole reason the consortium is worth writing about. So where does the argument go wrong, and what do I lose by fixing it there?
reasoning: |-
  Okay, I need to help this science writer figure out where this decision theorist's argument goes wrong. The conclusion in step (10) suggests that a single decision-maker would be best to avoid bad experiments, but that seems counterintuitive and alarming to the writer. Let me break down the argument step by step.

  First, the setup: multiple independent labs, each can decide to run experiments without needing others' consent. The problem arises from the probability math. Step (4) says each lab has a probability p > 0 of mistakenly approving a bad experiment. Step (5) calculates that as the number of labs (N) increases, the probability that at least one lab approves a bad experiment approaches certainty. That makes sense mathematically—more labs mean more chances for errors.

  Step (7) claims that while good experiments also get approved more often, the harm from a bad one outweighs the benefit of a good one. Step (8) concludes that the expected harm increases with more members, leading to step (9) and (10) advocating for requiring broad agreement or even a single decision-maker to minimize bad experiments.

  The writer balks at step (10) because, in reality, having only one person decide on dangerous experiments seems unsafe. They don't want to reject step (2), as the independence and better-than-chance judgment are key to the consortium's value. So where's the flaw?

  Looking at step (7): it assumes the harm of a bad experiment is so large that it overshadows the benefit of a good one. But is this always true? In science, not all bad experiments cause equal harm; some might have minor risks. Conversely, good experiments could have huge benefits that justify some risks. The argument treats all bad experiments as equally catastrophic and all good ones as moderately beneficial, which may not hold. If the harm isn't sufficiently larger than the benefit, increasing N could still be net positive. So step (7) might be a hidden assumption that's not necessarily valid.

  Another angle: step (4) assumes a fixed p for all labs, but in reality, different labs might have different error rates, and p could depend on the experiment's nature. The argument simplifies this to a constant p, which might not reflect real variability.

  Also, step (6) focuses only on bad experiments being run, ignoring that more good experiments get run too. The net effect depends on the balance. If good experiments are more common or more beneficial, a larger consortium could be better overall. The argument dismisses this by asserting that benefits don't offset harms, but without evidence.

  Rejecting step (7) seems the best move. By challenging the assumption that harm always outweighs benefit, the writer can keep the independence of labs (step 2) and still argue for a consortium. The cost is that they'd need to argue that in their specific context, the benefits of more good experiments justify the risks. That might require domain-specific knowledge about the experiments' potential impacts.

  The writer might worry that this opens a debate about harm-benefit ratios, but that's necessary. The original argument's conclusion only holds if the harm is disproportionately large. Without that, the math doesn't compel step (10).

  Another subtle point: step (3) says an experiment proceeds if any lab approves. The single decision-maker in step (10) would have an error rate of p, but if p is high, that's worse than a group's combined judgment. The argument assumes that the union of errors (probability almost 1 for large N) is worse, but if individual p is low, a single person might be acceptable. However, in practice, groups reduce individual biases, so a single person might have higher p. The argument doesn't account for that possibility.

  But the core issue is step (7)'s assumption. Fixing that preserves the consortium's value while avoiding the alarming conclusion. The writer needs to justify that the benefits of good experiments can offset the risks, which aligns with real-world scientific collaboration where diverse input often leads to better outcomes despite some errors.
answer: |-
  The flaw lies in step (7), specifically in the unstated assumption that **the harm of a bad experiment is so large that it cannot be offset by the benefit of any good experiment**, regardless of their relative frequencies or magnitudes. This is a critical hidden premise that the argument relies on but does not justify. Let me break this down step by step, explain why step (7) fails, and clarify the implications of rejecting it.

  ### Why Step (7) Is the Problem
  1. **The Arithmetic Oversimplifies Trade-offs**:  
     Steps (4)–(6) correctly state that as \(N\) (the number of labs) increases:  
     - The probability of a **bad experiment** being run approaches 1.  
     - The probability of a **good experiment** being run *also* approaches 1 (since \(p_{\text{good}} > 0.5\) by step (2), meaning labs are better than chance at identifying good experiments).  

     Step (7) then claims:  
     > "the benefit of a good experiment is not of a size to offset the harm of a bad one."  

     This is not derived from the earlier steps—it is an **unsupported assumption**. The argument provides no evidence that the harm of a bad experiment *always* dominates the benefit of a good one. In reality:  
     - **Not all bad experiments are equally harmful** (e.g., some might waste resources; others might cause catastrophic harm).  
     - **Not all good experiments are equally beneficial** (e.g., some might yield minor insights; others could be transformative).  
     - **The ratio of good-to-bad experiments matters**. If most proposed experiments are good (which step (2) implies, since labs are "better than chance"), a higher approval rate might yield net benefits even if some bad ones slip through.  

  2. **The Argument Ignores Expected Value**:  
     Step (8) claims "expected harm rises with \(N\)" only because step (7) dismisses the benefits. But if we define:  
     - \(H\) = harm from a bad experiment,  
     - \(B\) = benefit from a good experiment,  
     - \(q\) = probability a lab *correctly* approves a good experiment (\(q > 0.5\)),  
     - \(p\) = probability a lab *mistakenly* approves a bad experiment (\(0 < p < 0.5\)),  
     - \(r\) = fraction of proposed experiments that are truly good.  

     The **net expected value per experiment** for the consortium is:  
     \[
     \text{Net EV} = \overbrace{\left[1 - (1 - q)^N\right]}^{\text{Prob. good runs}} \cdot B \cdot r - \overbrace{\left[1 - (1 - p)^N\right]}^{\text{Prob. bad runs}} \cdot H \cdot (1 - r).
     \]  
     Step (7) assumes \(H \cdot (1 - r)\) dwarfs \(B \cdot r\) for all \(N\), but this is arbitrary. If \(B\) is large or \(r\) is high, increasing \(N\) could *improve* net outcomes. For example:  
     - If good experiments prevent pandemics (\(B\) = huge) and bad ones waste $10,000 (\(H\) = small), more approvals are better.  
     - If most proposals are good (\(r \approx 1\)), even a few bad approvals won’t outweigh the benefits.  

  3. **Why It *Looks* Sound**:  
     The math in steps (4)–(6) is impeccable, and if you accept step (7)’s assumption, steps (8)–(10) follow logically. It feels persuasive because:  
     - It mirrors real concerns (e.g., "a single bad apple can ruin things").  
     - It appeals to risk aversion (we fear harm more than we value benefit).  
     - It exploits the intuitive "law of large numbers" for errors.  

     But step (7) is not math—it’s a **value judgment** disguised as arithmetic. The decision theorist implicitly assumes that the consortium operates in a context where harm is catastrophic and benefits are marginal, but this isn’t justified by the premises.

  ### What Rejecting Step (7) Costs You
  Rejecting step (7) preserves what you care about:  
  - **You keep step (2)**: Labs’ independence and better-than-chance judgment remain intact.  
  - **You avoid step (10)’s absurdity**: No need to endorse a single decision-maker.  

  However, you must accept two costs:  
  1. **You lose the illusion of a universal answer**. The optimal consortium size depends on context:  
     - If bad experiments cause existential risk (e.g., bioweapons research), a smaller \(N\) or unanimous voting (step (9)) might be wise.  
     - If benefits are high and risks are low (e.g., climate modeling), a larger \(N\) could be better.  

  2. **You must engage with messy empirical questions**. To defend the consortium, you now need to argue that:  
     - The *actual* harm \(H\) from bad experiments isn’t catastrophic,  
     - Or the benefit \(B\) from good ones is sufficiently large,  
     - Or most proposals are good (\(r\) is high).  

  ### Why This Fixes the Argument
  Without step (7), the conclusion collapses:  
  - Steps (4)–(6) show that large \(N\) increases *both* good and bad experiments.  
  - Steps (8)–(10) no longer follow because net harm isn’t proven to dominate.  
  - The consortium’s value (diverse, independent judgment) can now outweigh risks.  

  ### Practical Advice for Your Reporting
  1. **Challenge the decision theorist’s assumption**: Ask: "What evidence supports that harm *always* outweighs benefit? Have you modeled real-world \(B/H\) ratios?"  
  2. **Highlight context**: Emphasize that in science, many good experiments (e.g., mRNA vaccines) have immense benefits that justify tolerating some duds.  
  3. **Consider alternatives**: Unanimous voting (step (9)) avoids bad experiments but might reject good ones—a trade-off worth exploring.  

  In essence, the argument fails by conflating probability with impact. You don’t need to reject math or independence—only an unfounded claim about the world. By doing so, you preserve the consortium’s purpose while acknowledging that size requires careful calibration to real risks and rewards.
