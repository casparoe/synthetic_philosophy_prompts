prompt: |-
  my friend who's deep into philosophy podcasts explained Mary's room to me the other day and I mostly believed her, but I want a sanity check on whether she's a reliable source before I take her word on other stuff too. Here's what she told me, as close to verbatim as I can manage:

  "So there's this famous thought experiment from Frank Jackson in the 80s. Mary is a vision scientist raised in a black-and-white room, and she's mastered neuroscience completely — she knows every physical fact there is to know about how color vision works, down to the last synapse. One day she walks out and sees a red tomato for the first time. And in that moment she learns something new: what red actually looks like. But wait — if physicalism is true, she already knew all the facts, since all facts are physical facts. So physicalism is false. Jackson took this to prove that qualia are nonphysical properties. And here's the kicker: he later admitted the argument doesn't work, which basically everyone agrees was the right call, because the obvious reply is that Mary didn't learn any new fact at all — she just gained a new ability, same as when you learn to ride a bike. Case closed, argument refuted."

  So: how fair is this as a summary? Go through it bit by bit and tell me what a philosopher of mind working on this would accept, what they'd call a simplification, and what they'd flat out correct. I'm especially curious about a few things: whether "knows every physical fact about color vision" is the same claim as the one the argument actually needs; whether the conclusion is really that physicalism is false / qualia are nonphysical, or something weaker that's getting dressed up; and whether the ride-a-bike reply is the settled answer she's making it out to be or just one move in a fight that's still going. Also, what does Jackson's recantation actually count for — does the author changing his mind settle anything here?

  One thing I want you to be careful about: please separate what's genuinely settled among people who know this literature from what's still contested, and don't present the contested stuff as consensus even though my friend did exactly that. If part of her summary is fine as far as it goes but hides a live debate, say that explicitly. And tell me whether her overall takeaway ("case closed, argument refuted") follows from the accurate parts alone, or whether she's leaning on the sketchy bits to get there. I'd also take a short note at the end on which of her specific claims most changed how I should think about the whole thing, since I'd sort of been taking the "refuted" framing as gospel.
reasoning: |-
  Okay, the user is asking for a sanity check on their friend's summary of Mary's Room, a philosophy thought experiment. The friend presented it as a refuted argument against physicalism, but the user wants to know how accurate that is. 

  First, I need to unpack the friend's claims point by point. The core argument seems correctly summarized: Mary knows all physical facts but learns something new upon seeing red, suggesting non-physical qualia. The friend says Jackson later admitted it doesn't work, and the "ability reply" (learning is like riding a bike) settles it. 

  But I know the reality is messier. The "every physical fact" claim is tricky—does it include all objective properties or just causal/functional ones? Physicalists would argue Mary's knowledge was incomplete without first-person experience. The ability reply isn't universally accepted; some argue Mary gains genuine factual knowledge. 

  Jackson's recantation is real but doesn't end debate—philosophers still cite both versions. The user seems sharp; they're spotting gaps in the "case closed" narrative and want to know where the live controversies are. They might be using this to assess their friend's reliability on other topics too. 

  I should flag where the friend oversimplifies: the fact/ability distinction is hotly contested, and Jackson's reversal just shifted the burden of proof. The key insight for the user is that Mary's Room remains a tool for probing physicalism's limits, not a settled knockout punch. 

  Most importantly, the user needs to walk away understanding that philosophy debates rarely get "refuted" like math theorems—they evolve. Their friend's summary isn't wrong, but it's like calling a chess game over after the first move.
answer: |-
  Here's a detailed breakdown of your friend's summary, assessing its accuracy with a focus on scholarly consensus vs. ongoing debate:

  ### Point-by-Point Assessment
  1.  **"Mary is a vision scientist raised in a black-and-white room... she knows every physical fact there is to know about how color vision works..."**
      *   **Accepted:** Core setup is accurate.
      *   **Simplification/Correction Needed:** "Every physical fact" is the crux. Physicalists argue this *must* include facts about the brain states *associated* with seeing red (neural firing patterns, computational processes). Jackson's argument hinges on whether *subjective experience itself* (the "what it's like") is captured by those physical facts. The debate centers on whether "physical facts" encompass *phenomenal properties* or just *structural/functional/causal* properties.

  2.  **"One day she walks out and sees a red tomato for the first time. And in that moment she learns something new: what red actually looks like."**
      *   **Accepted:** This is the core intuition pump. Nearly everyone agrees Mary gains *something* new upon leaving the room.
      *   **Contested:** *What exactly* she learns is the heart of the debate. The physicalist insists she gains a new *representation*, *ability*, or *mode of access*, not a new *non-physical fact*. The anti-physicalist insists she gains *phenomenal knowledge* – knowledge of a new *property* (qualia).

  3.  **"But wait — if physicalism is true, she already knew all the facts, since all facts are physical facts."**
      *   **Accepted:** This accurately captures Jackson's *conditional* argument *against* physicalism (If P, then Q; Not-Q; Therefore not-P).
      *   **Simplification:** "All facts are physical facts" is the physicalist thesis under attack. The argument forces physicalists to explain how Mary's new knowledge is compatible with knowing "all physical facts."

  4.  **"So physicalism is false. Jackson took this to prove that qualia are nonphysical properties."**
      *   **Accepted:** This was Jackson's *original conclusion* (1982, 1986).
      *   **Correction/Context:** While Jackson *argued* this proved physicalism false and qualia non-physical, this conclusion is **highly contested and not the consensus view**. The argument is primarily seen as a *challenge* to physicalism, not a definitive refutation. Many physicalists believe they have adequate responses.

  5.  **"And here's the kicker: he later admitted the argument doesn't work..."**
      *   **Accepted:** Jackson famously recanted in the late 1990s/early 2000s, becoming a physicalist.
      *   **Simplification/Context:** His recantation was significant, but **it doesn't "settle" the argument philosophically.** Philosophers engage with the *argument*, not the *author's later opinion*. Many anti-physicalists still find the thought experiment compelling despite Jackson's reversal. His recantation shifted the burden but didn't end the debate.

  6.  **"...which basically everyone agrees was the right call..."**
      *   **Overstatement:** While Jackson's recantation is widely noted and respected, **it is NOT true that "basically everyone agrees" physicalism wins or the argument is dead.** The Mary case remains one of the most discussed arguments in philosophy of mind. Many prominent philosophers (e.g., David Chalmers) still defend versions of the anti-physicalist intuition. Surveys show significant division among professional philosophers on physicalism vs. non-physicalism.

  7.  **"...because the obvious reply is that Mary didn't learn any new fact at all — she just gained a new ability, same as when you learn to ride a bike."**
      *   **Accepted:** The "Ability Reply" (often attributed to Lewis and Nemirow) is indeed a major and influential physicalist response.
      *   **Massive Oversimplification & Contested:** This is presented as the *settled* answer. **It is not.** It's one prominent response among many, and it is **hotly debated**. Critics argue:
          *   It conflates *knowing-how* (ability) with *knowing-what* (propositional knowledge/fact). Mary seems to learn *what seeing red is like*, not just *how to recognize or imagine red*.
          *   Mary gains new *knowledge by acquaintance* of a phenomenal property, which isn't reducible to an ability.
          *   Other physicalist replies exist (e.g., "Old Fact/New Way" - Churchland, "Representational" - Tye, "Acquaintance" - Conee, "Indexical" - Perry) and are also debated. The Ability Reply is powerful but faces serious objections.

  8.  **"Case closed, argument refuted."**
      *   **Flat Out Incorrect/Misleading:** This is **absolutely not the consensus view** in the philosophy of mind. The Mary argument remains:
          *   A central and highly influential thought experiment.
          *   A major challenge physicalists feel compelled to answer.
          *   Actively debated, with sophisticated arguments on both sides.
          *   Considered by many to expose a genuine explanatory gap, even if they ultimately side with physicalism.

  ### Summary of Key Points Regarding Your Questions
  *   **"Knows every physical fact":** This is crucial and contested. The debate hinges on whether phenomenal properties *are* physical properties or are captured by descriptions of structure/function/causation. Physicalists argue knowing all physical facts *includes* knowing the relevant brain states; Mary just gains a new *way* of accessing this knowledge. Anti-physicalists argue the phenomenal property itself is missing from the physical description.
  *   **Conclusion (Physicalism False/Qualia Nonphysical):** This *was* Jackson's conclusion. It is **not** the settled view. The argument is widely seen as a serious challenge, not a proof. Many philosophers remain physicalists who believe they can answer the challenge (e.g., via the Ability Reply or others). Others find the challenge insurmountable.
  *   **The "Ride-a-Bike" (Ability) Reply:** It's a major, influential, and *prima facie* strong physicalist response. **It is NOT the settled answer.** It faces significant objections and is part of an ongoing, active debate. Other physicalist strategies also exist and are debated.
  *   **Jackson's Recantation:** It's a notable historical fact showing the argument troubled even its creator. **It does NOT settle the philosophical issue.** Philosophers argue about the *logic* and *intuitions* of the thought experiment, not Jackson's personal journey. It shifted the burden of proof onto anti-physicalists but didn't end the discussion.

  ### Friend's Overall Takeaway
  Her summary gets the basic setup and Jackson's original intent/recantation mostly right. However, she **grossly overstates the degree of consensus** and **dramatically oversimplifies the current state of the debate.** Presenting the Ability Reply as the obvious, settled "case closed" refutation ignores the substantial ongoing controversy and the sophisticated objections to that very reply. **Her conclusion ("case closed") relies heavily on the sketchy bits (points 6, 7, 8 above).**

  ### Most Significant Correction
  The single most impactful correction is that **the Mary argument is categorically NOT "case closed, argument refuted."** Presenting it this way is profoundly misleading about the state of philosophy of mind. The Ability Reply is a powerful move *within* an ongoing debate, not the final word. Jackson's recantation is interesting biographical detail, not a philosophical knockout punch. The thought experiment continues to generate intense discussion precisely because the core intuition – that Mary learns *something* genuinely new about the world (what red *is like*) that wasn't captured by her exhaustive physical knowledge – remains deeply persuasive to many, even if others find physicalist responses convincing. Treating it as "refuted" closes off genuine philosophical exploration.
