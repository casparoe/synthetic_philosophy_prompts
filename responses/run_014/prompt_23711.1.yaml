answer: |-
  Here’s a toast that balances precision with warmth, honors her intellectual journey, and lands with affection — all in under five minutes:

  ---

  **(Clink glass lightly)**  
  "Friends, family, colleagues — and to the guest of honor, who I suspect is already mentally drafting a rebuttal to whatever I’m about to say…  

  We’re here to celebrate a thinker who spent thirty years asking one of the hardest questions: *How do we build a better economic world without pretending we have a crystal ball?*  

  For [Name], this wasn’t about grand manifestos or historical destiny. It was about something far more practical — and far more radical. She stood in that rare Vienna Circle tradition where the big debates — planning versus markets, democracy versus technocracy — weren’t wars over souls or human nature. They were engineering questions. *Which tools work best for which problems? What does the evidence say?*  

  **Her compass was Carnap’s:** If you can’t test it empirically, it’s noise, not knowledge. Not a socialist revolution in the stars, but a social democrat tinkering in the workshop.  

  **Her nemesis was historicism:** That idea that history’s ‘laws’ could predict our economic future. She spent years on the front lines of that old Popper-Carnap feud, defending the view that *we choose our systems* — they don’t choose us.  

  And then… **(pause, gentle smile)** …in her last act, she did the most Carnapian thing of all. She quietly set down the tool she’d polished for decades. Not because it was ‘wrong,’ but because the world had changed its shape.  

  **Which brings me to my metaphor — because even philosophers need to fix a leaky sink now and then.**  

  Imagine you’re handed two toolkits. One’s labeled ‘Planning,’ the other ‘Markets.’ Most people spend their lives arguing about which kit is *morally superior* or *naturally right*. [Name]? She’d say: *‘That’s like arguing whether a hammer is morally better than a screwdriver. It depends! What’s the job? What’s the material? What actually works here?’*  

  **That was her life’s work:** Not preaching which tools we *must* use, but teaching us to read the blueprint — and to stay humble when the walls don’t behave as predicted.  

  And yes — **(turn to family, warm chuckle)** — this is the same woman who once famously fell asleep during a keynote on ‘Predictive Dialectics.’ I’m told her snore harmonized perfectly with the Q&A. **That’s the real lesson, isn’t it?** That brilliance isn’t about having all the answers. It’s about staying awake to the world… most of the time.  

  So let’s raise a glass:  
  To [Name] — who taught us that changing your mind isn’t losing an argument. It’s *winning* the wisdom to listen.  
  To the architect who knew that buildings outlast blueprints, and humans outlast theories.  
  And to the rare soul who could disarm a Popperian with logic, and her nephew with a story about falling asleep on a dignitary’s shoulder.  

  **May your retirement be as empirically sound as your best model — and as full of surprises as that nap.** Cheers!"  

  ---

  ### Why this works:  
  1. **Precision:** Nails her Carnapian social democracy, the empirical/institutional lens, and the Popper-Carnap historicism rift without jargon.  
  2. **Metaphor (Toolkits):** Accessible (fixing things!), philosophically sharp (Carnap’s anti-metaphysical pragmatism), and funny ("morally better hammer").  
  3. **Her Evolution:** Frames her abandoned position as intellectual integrity — "setting down the tool" honors the work while celebrating growth.  
  4. **Family Hook:** The nap story is warm, humanizing, and ties to her work (staying awake to evidence!).  
  5. **Tone:** Dry humor ("mentally drafting a rebuttal"), zero eulogy vibes, ends on warmth and wit.  
  6. **Time:** Reads at ~4:30 mins with pauses.  

  **Delivery tip:** Lean into the pauses — especially before "And then…" and the toolkit metaphor. Let the humor land softly; her dryness deserves a light touch.
