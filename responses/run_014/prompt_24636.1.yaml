answer: |-
  The practice of honoring advance directives while overriding contemporaneous expressions of incapacitated patients rests on a **hierarchical psychological continuity theory of diachronic authority**, which carries specific metaphysical and ethical commitments. Here's a reconstruction:

  ### Core Presupposition: The "Competent Self" as Authoritative Agent
  The practice assumes that **personhood is fundamentally tied to rational agency**. The self that possesses competence—characterized by capacities for deliberation, valuation, and foresight—is the "true" self with moral standing to bind the entity over time. Authority derives from *who the person is at their most agential*, not from temporal proximity.

  ### Implicit Theory of Diachronic Authority
  1. **Authority Tracks Rational Capacity**:  
     The competent self (past or present) always supersedes the non-competent self. This presupposes that:  
     - Rational agency defines moral personhood.  
     - Biological continuity alone is insufficient for decision-making authority.  

  2. **Persistence Through Psychological Disruption**:  
     It assumes the demented patient is *numerically identical* to the prior competent person, despite radical psychological discontinuity. The directive is valid because it is *their own* past decision—not someone else’s.  

  3. **Temporal Neutrality of Authority**:  
     The past self’s authority "crystallizes" at the moment of competence. Time itself doesn’t diminish legitimacy; only a *later competent revocation* can override it.  

  ### Rival Views Ruled Out
  The practice implicitly rejects:  
  - **Lockean Threshold Theories**: If dementia severed personal identity (e.g., due to loss of psychological connectedness), the directive would apply to a "different person," rendering it invalid.  
  - **Present-Oriented Theories**: Views prioritizing current consciousness (e.g., some phenomenological or animalist accounts) would require deferring to present expressions, however irrational.  
  - **Parfitian Reductionism**: If selves are not unified entities over time (but mere "R-relations"), the past self’s wishes hold no special authority over future stages.  
  - **Bodily Autonomy Primacy**: Theories valuing biological life or bodily integrity independently of cognition would reject withdrawing care against a patient’s current resistance.  

  ### Underdetermined Aspects: Multiple Possible Groundings
  The practice *could* be licensed by:  
  - **Robust Psychological Continuity**: The person persists iff enough cognitive links exist (the past self binds the future).  
  - **Narrative Identity**: The directive expresses the patient’s "life story" arc (e.g., "I don’t want to live without my mind"), which the demented self cannot revise.  
  - **Constitutive Commitment View**: Competent selves define their identity through values; honoring directives respects their self-constitution.  

  ### Rejecting "Past Self Outranks Present Self"
  Abandoning this hierarchy would necessitate:  
  1. **Default to Present Wishes**:  
     - Even non-competent refusals of care (e.g., pulling out feeding tubes) would be honored, *or*  
     - All directives would require reconfirmation during incapacity (rendering them practically useless).  
  2. **Shift to "Best Interests" Standard**:  
     - Surrogates/physicians would decide based on well-being assessments, ignoring both past directives *and* current non-competent expressions.  
  3. **Temporal Neutrality Reversal**:  
     - Current expressions (however impaired) would always override past ones, privileging immediacy over prior reflection.  

  ### Ethical Tensions Exposed
  This asymmetry reveals a conflict between:  
  - **Precedent Autonomy** (extending control beyond competence) vs. **Current Well-Being** (protecting the vulnerable present self).  
  - **Identity vs. Welfare**: Is the demented patient the "same person" as the directive-writer? If not, enforcing directives risks harming a different entity.  

  The practice ultimately presupposes that **moral authority resides in the rational self**, and that profound dementia creates a "lesser self" whose expressions lack normative weight against prior competent choices. This reflects a deeply embedded view that personhood is diminished by cognitive decline—a stance carrying significant implications for disability ethics and the metaphysics of identity.
