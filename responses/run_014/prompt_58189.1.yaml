  We are comparing two notions of simplicity:
   1. The formal simplicity in Solomonoff induction and Kolmogorov complexity (K-complexity).
   2. The engineer's rule of thumb: prefer fewer moving parts, fewer special cases, lower maintenance cost.

   Let's break down the dimensions:

   a) What counts as simple?
      - Solomonoff-Kolmogorov: The length of the shortest program (in a fixed universal programming language) that outputs the string (or the hypothesis). The shorter the program, the simpler.
      - Engineer's rule: Fewer moving parts (fewer components, variables, parameters), fewer special cases (exceptions), and lower maintenance cost (which might include ease of understanding, modifying, and running).

   b) Sensitivity to language or vocabulary choice?
      - Solomonoff-Kolmogorov: It is sensitive to the choice of the universal language, but only up to a constant (that depends on the language but not on the string). This constant becomes negligible for large strings. However, the constant can be arbitrarily large for a given fixed string, so for small strings the sensitivity might be high. Also, the universal language is fixed at the outset.
      - Engineer's rule: The vocabulary is chosen by the engineer (e.g., programming language, domain concepts). The rule is highly context-dependent and subjective. What counts as a "moving part" or a "special case" may vary.

   c) Purpose: Belief about future observations vs. practical choice?
      - Solomonoff-Kolmogorov: It is a formalization of Occam's razor for inductive inference. The prior probability is higher for shorter programs because they are more likely a priori (by algorithmic probability). The goal is to predict future observations optimally (in a Bayesian sense). It is about truth and prediction.
      - Engineer's rule: It is a practical heuristic for managing complexity in engineering. The goal is to reduce effort (debugging, maintenance) and to avoid overfitting. It is about efficiency and practicality, not necessarily about truth.

   d) Handling overfitting (any data can be fit perfectly by a long enough enumeration):
      - Solomonoff-Kolmogorov: The enumeration (lookup table) for the data will have a high Kolmogorov complexity (because it must encode the entire string). Therefore, it will have a very low prior probability. The prior probability decreases exponentially with the length of the program. Therefore, even though the lookup table fits the past perfectly, it is not preferred because of its high complexity. The induction process balances fit and simplicity.
      - Engineer's rule: The lookup table is rejected as a bad model because it has too many special cases (each data point is a special case) and is not maintainable (if we get more data, the table must grow). Also, it doesn't generalize. So the engineer would prefer the compact rule.

   Concrete case:
     Hypothesis A: 30-line program (low K-complexity) that fits 9850/10000 and makes definite predictions.
     Hypothesis B: Lookup table (high K-complexity) that fits 10000/10000 perfectly but predicts by a gerrymandered pattern.

     In Solomonoff induction, A would get a higher prior than B because the program for A is shorter. The posterior would balance the prior and the likelihood. Since B fits the data perfectly, it has perfect likelihood. However, because the prior for B is extremely low (exponentially small in the length of the data), the posterior for A might still be higher if the data is not too long and the prior difference is large. But note: for 10,000 bits, the lookup table would require about 10,000 bits (plus a small fixed overhead for the program that prints the table). The 30-line program might be, say, a few hundred bits. Therefore, the prior for A is exponentially higher than for B.

     The engineer would reject B because it has 10,000 moving parts (each entry) and it is not maintainable (if we have 10,000 more minutes, the table must double). Also, it doesn't generalize and requires storing the entire history.

   How is Solomonoff a precisification of Occam?
     - Occam's razor: "Entities should not be multiplied beyond necessity." In the context of hypothesis selection, it says that among hypotheses that fit the data, the simplest is best for prediction.
     - Solomonoff gives a precise meaning to "simplicity" (K-complexity) and provides a Bayesian framework (with a universal prior) that formalizes the trade-off between simplicity and fit. The prior exponentially favors simpler hypotheses.

   How is it different in kind?
     - Uncomputability: K-complexity is uncomputable. We cannot compute the shortest program for an arbitrary string. This makes it impractical for direct use. Engineers use computable approximations (like MDL, or various heuristics).
     - Language dependence: The constant factor in K-complexity can be large, so for small problems the choice of language matters. In practice, we choose a language that we think is "natural" for the domain.
     - The engineer's rule is computable and context-dependent.

   Verdict: Which notion provides a reason to expect simpler hypotheses to predict better?

     Solomonoff-Kolmogorov: Yes, it does. The fundamental result is that the universal prior is optimal in the sense that it will dominate any computable probability distribution in the long run (in terms of prediction). Specifically, the Solomonoff prior converges to the true probability distribution faster than any computable prior. Therefore, it provides a theoretical reason to believe that simpler hypotheses (in the K-complexity sense) will predict better.

     Engineer's rule: It is primarily for practical reasons (ease of use, maintenance). However, it often coincides with the goal of generalization (avoiding overfitting). But it does not provide a theoretical guarantee of better prediction. It is a heuristic.

     Therefore, the Solomonoff-Kolmogorov idea provides a reason to expect better prediction, while the engineer's rule is about practical manageability.

