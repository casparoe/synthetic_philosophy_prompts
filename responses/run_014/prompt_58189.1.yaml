ge. Therefore, in this example, A wins.

     However, the uncomputability remains a challenge. We cannot know the true Kolmogorov complexity. And in practice, we use approximations.

     What would make me reverse the verdict?
     - If we consider a very small dataset (say, 10 bits) and a universal language with a huge constant (say, 1000 bits). Then the lookup table might be 10 + c1 (where c1 is the overhead for the print statement, say 10 bits) so 20 bits. The compact program might be 15 bits but then plus the constant 1000? That doesn't happen because the constant is already included in the interpreter. The Kolmogorov complexity is the length of the entire program that runs on the universal machine. So if we have a universal machine U, then the program for the compact rule is a program p that runs on U. The length of p is |p|. The lookup table program is a program q that is about 10 bits of data plus the print overhead. The print overhead is fixed (say, 10 bits). So |q| = 10 (for the data) + 10 (for the print) = 20. The compact program p might be 15 bits. So |p| = 15, |q| = 20. The constant of the universal machine is not added again? It's embedded in the fact that we are measuring the length of the program for that machine. So the constant is the same for both? Actually, the universal machine U has a fixed interpreter, and we are comparing the lengths of the programs that run on U. Therefore, the constant is already in the machine and does not add to the program length. So the comparison is absolute: 15 vs 20.

     But note: the choice of universal machine matters. If we take a universal machine that has a very long initial setup for the print statement, then the lookup table program would be long. However, by the invariance theorem, there exists a universal machine such that the complexity on that machine is within a constant of the complexity on any other universal machine. So we choose one that is reasonable.

