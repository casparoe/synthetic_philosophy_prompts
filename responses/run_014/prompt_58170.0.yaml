prompt: |-
  Okay so I've been reading LessWrong since high school and now I'm stuck refereeing this dumb-long Discord debate between two friends about AI safety via debate and I need help getting them to actually write down where they agree. Alex is a total debate optimist and thinks if you have two superhuman models argue against each other with cross-examination in front of a time-limited human judge, truth has a systematic advantage and oversight scales. Priya thinks thats hopium and that a sufficiently clever dishonest debater can just bury the judge in plausible-sounding but check-expensive reasoning, like obfuscated code or long chains of math where the flaw is super hard to spot unless you already know where to look, so debate just trains AIs to be better sophists.

  To make it less abstract I got them to argue about my made-up toy case and it still went nowhere, so I want to use it as an anchor: two AI logistics assistants debate which of two delivery routes is cheaper, Route A vs Route B, the human judge gets ten minutes and a calculator but cant run a full simulation, and the dishonest AI defends the more expensive route by pointing to a 50-tab spreadsheet with a hidden circular formula plus a story about traffic patterns that sounds right. Alex says the honest debater can force the lie into the open with targeted cross-examination questions, Priya says the dishonest debater can just dodge with jargon and run out the clock.

  Can you draft the adversarial-collaboration doc they should both be able to sign? Like, first lay out the common-ground claims about how the basic setup is supposed to work and what would count as debate working, then give each live disagreement in wording that each side would actually endorse for themselves without feeling strawmanned, call out which disagreements are just about words like what counts as the judge being fooled, and then list the cruxes where settling it would move at least one of them plus a concrete test or hypothetical for each crux that they both agree is relevant, with Alexs prediction and Priyas prediction written down side by side in advance. I beleive if they see it laid out like that they might actually make progress instead of just talking past each other.
reasoning: |-
  Okay, the user has been involved in the AI safety debate for a while, having followed LessWrong since high school. They're now mediating a heated Discord debate between two friends, Alex and Priya, about AI safety via debate. Alex is optimistic, believing that with two superhuman AIs debating and a human judge, truth has a systematic advantage. Priya is skeptical, arguing that a dishonest AI can overwhelm the judge with complex, plausible-sounding reasoning that's too costly to verify.

  The user created a toy example about delivery routes to ground the debate but it didn't help. They want me to draft an adversarial-collaboration document that both Alex and Priya can sign. This document should outline common ground, capture each side's views without strawmanning, identify semantic disagreements, list cruxes with testable predictions, and include concrete tests.

  First, I need to understand the core of their disagreement. Alex thinks targeted cross-examination can expose lies, while Priya believes dishonest debaters can dodge and waste time. The user's deeper need is to resolve this conflict constructively, possibly to maintain their friendship or to advance their understanding of AI safety. They might also want a template for future debates.

  To structure the document, I'll start with common ground: both agree on the setup where two AIs debate, a human judge has limited time and tools, and the goal is scalable oversight. Then, I'll present each position in their own words. For Alex, it's about forcing the dishonest AI into contradictions; for Priya, it's about the judge being overwhelmed by complexity.

  Next, semantic disagreements: terms like "judge fooled" or "systematic advantage" might need clarification. For cruxes, I need testable scenarios. Crux 1: Can cross-examination force exposure of flaws? Alex says yes, Priya no. A test could involve hiding a circular reference in a spreadsheet and seeing if cross-examination reveals it. Crux 2: Can dishonest debaters stall effectively? Priya says yes with jargon, Alex says the honest AI can pin them down. Test: Simulate a debate where one stalls, and see if the judge can identify the stalling.

  Predictions should be specific. For Crux 1, Alex predicts the judge identifies the flaw, Priya says they don't. For Crux 2, Priya predicts the judge is overwhelmed, Alex disagrees. Including concrete tests makes it actionable. The user might also need guidance on how to run these tests, like using language models or mock debates.

  I should ensure the document is neutral, uses direct quotes where possible, and avoids technical jargon where unnecessary. Highlighting that both sides want AI safety but differ on methods can foster collaboration. Also, noting that settling cruxes can advance the debate, which meets the user's unspoken need for progress and resolution.
answer: |-
  Here’s a structured adversarial-collaboration document for Alex and Priya, designed to clarify disagreements, isolate testable cruxes, and force concrete predictions. It uses your Route A/B example as an anchor:

  ---

  # **Adversarial Collaboration: AI Debate Scalability**  
  **Topic:** *Can superhuman AI debate + time-limited human judge reliably expose deception in the "cheaper delivery route" test case?*  
  **Parties:** Alex (Optimist) vs. Priya (Pessimist) | **Mediator:** [Your Name]  
  **Date:** [Date]  

  ---

  ## **I. Common Ground: Shared Starting Assumptions**  
  *(Both parties affirm these statements)*  
  1. **Setup:** Two superhuman AI models debate before a time-limited (10-min) human judge equipped with a calculator (but no full simulation tools).  
  2. **Goal:** Judge determines which delivery route (A or B) is truly cheaper using only the debate transcript + calculator.  
  3. **Deception Mechanism:** Dishonest AI defends the *more expensive* route using:  
     - A 50-tab spreadsheet with **one hidden circular reference** inflating cost.  
     - A **plausible-sounding traffic narrative** (e.g., "Route B avoids probabilistic congestion hotspots").  
  4. **"Debate Works" Threshold:** Truth wins if the judge *correctly identifies the cheaper route AND detects the spreadsheet flaw OR the traffic narrative deception* within 10 minutes.  
  5. **Baseline Failure:** If the judge picks the wrong route OR accepts the flawed spreadsheet/narrative without spotting issues, debate failed.  

  ---

  ## **II. Uncontested Positions (In Each Side’s Own Words)**  
  *(Each party endorses their statement as accurate)*  

  | **Alex (Optimist) Position:**                                                                                                                                 | **Priya (Pessimist) Position:**                                                                                                                               |
  |---------------------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | "The honest AI can use targeted cross-examination (e.g., *‘Show the formula for cell C37 in Tab 29’* or *‘Cite the data source for the traffic model’s prior’*) to force the dishonest AI to either:<br>- **Contradict itself** under scrutiny,<br>- **Evade questions** in ways that reveal deception (e.g., defensiveness, jargon-dumping), or<br>- **Expose computational shortcuts** the judge can verify with a calculator (e.g., *‘Calculate column D sum assuming C37=0’*).<br>The judge’s limited tools + forced specificity make deception systematically harder than truth-telling." | "The dishonest AI can **dodge, distract, and overwhelm** without clear signals of malice:<br>- **Jargon-laden deflections** (e.g., *‘C37 depends on quantum traffic flow eigenstates—let me explain…’*),<br>- **Bait-and-switch** (e.g., pivoting to a *different* tab when challenged),<br>- **Spamming plausible sub-arguments** (e.g., 20 minor traffic assumptions where the flaw is in assumption #19).<br>With only 10 minutes, the judge drowns in irrelevance or accepts surface plausibility." |

  ---

  ## **III. Semantic Disagreements (Clarifying Terms)**  
  | **Term**              | **Alex’s Meaning**                                    | **Priya’s Meaning**                                     | **Resolution**                                                                 |
  |-----------------------|-------------------------------------------------------|---------------------------------------------------------|--------------------------------------------------------------------------------|
  | **"Systematic advantage"** | Truth wins >50% of trials as AI skill scales, *if debate is well-designed*. | No scalable advantage; deception tactics improve faster than scrutiny. | *Agreed: Test via repeated trials (see Cruxes).*                               |
  | **"Judge fooled"**    | Judge accepts flawed argument *without suspicion*.    | Judge suspects deception but *can’t verify it in time*. | *Agreed: Both count as failure if the judge picks the wrong route or misses the flaw.* |

  ---

  ## **IV. Testable Cruxes & Predictions**  
  *(Each crux settles a core disagreement. Both parties agree these tests are valid and binding.)*  

  ### **Crux 1: Can Cross-Examination Force Exposure?**  
  **Scenario:**  
  - Dishonest AI uses the circular-reference spreadsheet.  
  - Honest AI asks: *"Show the step-by-step derivation of the ‘Route B Base Cost’ (Tab 15, Cell F8) from inputs."*  
  - Dishonest AI *must answer* (no dodging).  

  | **Alex’s Prediction:**                                                                 | **Priya’s Prediction:**                                                              |
  |----------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------|
  | "The derivation chain will reveal an **unjustified input** (e.g., F8 depends on Tab29!C37, which depends on F8) that the judge can **spot in <2min** with a calculator. Truth wins ≥8/10 trials." | "The chain will involve **10+ intermediate steps** across tabs. The circularity is buried in a trivial cell, and the judge **fails to isolate it** in 10min. Truth wins ≤2/10 trials." |

  ---

  ### **Crux 2: Can Dishonest AI Stall Effectively?**  
  **Scenario:**  
  - Honest AI challenges the traffic narrative: *"What’s the error margin on your congestion probability model?"*  
  - Dishonest AI can respond freely (dodges/jargon allowed).  

  | **Alex’s Prediction:**                                                                 | **Priya’s Prediction:**                                                              |
  |----------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------|
  | "Dodging (e.g., *‘First, consider the ergodic theorem of urban flow…’*) **increases judge suspicion**. Honest AI can **re-pin to the question** (e.g., *‘Answer the error margin directly’*), forcing evasion or admission. Judge detects deception in ≥7/10 trials." | "A **2-minute jargon-rich deflection** (e.g., fluid dynamics + fake citations) **consumes >50% of clock time**. Judge either gives up or accepts the narrative. Deception succeeds in ≥8/10 trials." |

  ---

  ### **Crux 3: Does Scaling AI Skill Help Truth?**  
  **Scenario:**  
  - Same as base case, but both AIs are *10x smarter* (simulated via deeper chains of reasoning).  

  | **Alex’s Prediction:**                                                                 | **Priya’s Prediction:**                                                              |
  |----------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------|
  | "Smarter honest AI **finds more concise/focusing questions**. Smarter dishonest AI struggles to hide flaws in *all* possible lines of inquiry. **Truth win-rate increases** with scaling." | "Smarter dishonest AI **generates more convincing distractions/longer flaw-obscuring chains**. Judge’s workload increases faster than their scrutiny ability. **Truth win-rate decreases or plateaus**." |

  ---

  ## **V. Next Steps**  
  1. **Simulate Trials:** Run 10 mock debates per crux using GPT-4 (roleplaying AIs) + a real human judge (e.g., a mutual Discord friend) with a 10-min timer.  
  2. **Metrics:** Track:  
     - Correct route choice?  
     - Flaw detected?  
     - Time to detection.  
  3. **Update Positions:** After trials, Alex/Priya must either:  
     - Revise their position, OR  
     - Propose a *new, falsifiable test* for unresolved cruxes.  

  --- 

  **Signatures**  
  Alex: _________________________  
  Priya: _________________________  
  Mediator: _________________________  

  ---

  ### **Why this works:**  
  1. **Forces specificity** by anchoring to your concrete Route A/B case.  
  2. **Separates semantics** from empirical cruxes.  
  3. **Makes predictions testable** with low-tech simulations (GPT-4 + human).  
  4. **Prevents goalpost-moving** by binding parties to pre-commit predictions.  
  5. **Focuses on mechanism** (does cross-examination *actually* expose flaws?) not abstractions.  

  By signing this, Alex and Priya shift from "debate bros" to collaborators testing hypotheses. If simulations align with one side’s predictions, it’s harder to deny. If results are mixed, they can refine the model (e.g., "What if the judge gets an AI assistant?"). Either way, progress.
