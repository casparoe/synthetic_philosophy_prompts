answer: |-
  Right, you've hit the nail squarely on the head regarding the genuine puzzle and potential overreach in Quine's gavagai argument. That gap between *underdetermination* (epistemic) and *indeterminacy* (metaphysical) is absolutely crucial and often glossed over. Let's break down why Quine makes that leap and why he jolly well *can't* appeal to the native's mental states.

  1.  **The Core Leap: From Underdetermination to Indeterminacy**
      *   **The Underdetermination:** As you say, the evidence – observable behaviour, assent/dissent patterns to "Gavagai?" in the presence of stimuli – is compatible with multiple, mutually incompatible translation manuals (e.g., "rabbit", "undetached rabbit part", "rabbit-stage", "rabbithood").
      *   **The Claimed Indeterminacy:** Quine argues this isn't *merely* a problem of *our ignorance*. There is **no fact of the matter** about which manual is "correct" in capturing the *actual meaning* of 'gavagai' in the native's language.

  2.  **What Must Be True About Meaning for the Leap to Work?**
      Quine's leap relies on a specific, radical view of meaning, stemming from his **Behaviourism** and **Naturalism**:
      *   **Meaning is Publicly Manifested:** Meaning isn't some private, inner entity (a "myth of the museum," as he called it). What a word *means* is constituted *entirely* by the publicly observable dispositions of speakers to use it and respond to it under various conditions. There's nothing "inside the head" that *is* the meaning beyond these observable patterns.
      *   **No Distinction Between Meaning and Evidence:** For Quine, the *only* evidence we have (or could ever have) for what words mean *is* this observable linguistic behaviour in response to environmental stimuli. Crucially, he argues that **meaning just *is* what is captured by the totality of these behavioural dispositions.** Therefore, *if* the evidence (behaviour) underdetermines the theory (meaning), it means there *is* no further fact of the matter to be known. The meaning *is exhausted by* the evidence we have (or could gather).
      *   **The Indeterminacy is Radical:** This isn't like the underdetermination of scientific theories (e.g., Newton vs. Einstein on certain predictions), where we believe there *is* an underlying physical reality that makes one right and the other wrong, even if we lack the evidence *now*. For Quine, in the case of meaning, there *is* no underlying reality *beyond the behavioural dispositions*. Therefore, if two manuals both account perfectly for *all* possible behavioural evidence (past, present, and future), they are *both* correct descriptions of the *only* facts there are – the dispositions. There is no "deeper" meaning fact they fail to capture. That's why it's *indeterminate*.

  3.  **Why Can't He Appeal to Mental States?**
      This is the crux, and Quine has principled reasons for rejecting this escape route:
      *   **The Private Language Argument (Wittgensteinian Influence):** Quine holds that meaning cannot be constituted by private, inner mental states. If meaning were private, how could communication ever occur? How could we learn the language? Meaning *must* be public and intersubjectively accessible.
      *   **The Myth of the Museum:** He explicitly rejects the idea that words are mere labels for pre-existing mental concepts ("ideas in the mind"). What *is* this "mental concept of rabbit" distinct from the "mental concept of rabbit-stage"? How do we know the native even *has* such distinct concepts? Any attempt to define these concepts would itself require language, leading to circularity or infinite regress.
      *   **The Inscrutability of Mental States:** Crucially, **Quine argues that mental states themselves are just as indeterminate as meaning.** How do we *know* what the native's mental state is when they utter 'gavagai'? We only have access to their *behaviour* (including verbal reports about their mental states!). If the behavioural evidence underdetermines the meaning of 'gavagai', it *also* underdetermines the ascription of any specific mental state (belief, intention, concept) associated with it. Claiming "But the native *really* means rabbit!" simply pushes the problem back one step: what behavioural evidence *determines* that their mental state is "rabbit" and not "undetached rabbit part"? Quine argues there isn't any evidence that could settle *that* question either.
      *   **Naturalism and Science:** Quine views philosophy as continuous with natural science. Science deals with observable phenomena and posits entities useful for explaining those phenomena. Mental states, as traditionally conceived (private, inner referents), are not observable and cannot play a scientifically respectable role in explaining linguistic behaviour *beyond* what is captured by describing behavioural dispositions. Appealing to them is, for Quine, unscientific and explanatorily empty in this context.

  4.  **Is it Defensible or an Overreach?**
      This is where the philosophical dust-up happens:
      *   **Quine's Defence:** He argues it's the only consistent position if you take behaviourism and naturalism seriously. Meaning *must* be grounded in public evidence, and that evidence simply doesn't pick out one unique translation. To insist there *must* be a fact of the matter is to cling to an untenable myth about private meanings. The indeterminacy thesis *follows from* his analysis of what meaning *is*.
      *   **The Charge of Overreach:** Many philosophers (like Chomsky, Davidson early on, Fodor, and proponents of various forms of semantic internalism or externalism) argue Quine *does* overreach. They contend:
          *   **Mental States *Do* Matter:** Internal cognitive structures, innate linguistic capacities, or causal relationships to the world *do* constitute meaning facts that go beyond mere behavioural dispositions, even if accessing them is difficult. Underdetermination of evidence doesn't entail metaphysical indeterminacy if such further facts exist.
          *   **Holism Doesn't Go That Far:** While Quine's semantic holism (meaning of a word depends on the whole web of belief) explains *some* slack in translation, critics argue it doesn't license the radical, permutational indeterminacy Quine claims (e.g., 'rabbit' vs 'rabbit-stage').
          *   **Charity/Truth is Constraining:** Davidson argued that the principle of charity (interpreting speakers as largely holding true beliefs) imposes strong constraints that Quine underestimated, potentially ruling out many of the bizarre alternative manuals as simply not making the native *rational*.
          *   **The First-Person Perspective:** We seem to *know* what we mean "from the inside," suggesting there *is* a determinate fact.

  **In Summation:**

  Quine thinks the leap from underdetermination to indeterminacy works because he defines meaning *exhaustively* as publicly observable behavioural dispositions. If the evidence (behaviour) doesn't favour one translation manual over another, then there is *literally nothing else* that *could* make one right and the other wrong. Meaning *just is* what the dispositions determine, and they determine multiple things. He rejects appealing to mental states because he sees *them* as either non-existent as meaning-constituting entities ("myth of the museum") or themselves just as behaviourally inscrutable and indeterminate as the meanings they're supposed to ground. Whether this is a profound insight into the nature of language or an indefensible overreach driven by overly restrictive behaviourist and naturalist assumptions remains one of the central debates in 20th-century philosophy. You're quite right to identify that the *gap* is where the real action is.
