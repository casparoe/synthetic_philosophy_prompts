  First, I need to recall the key concepts. Deontology comes to mind, especially Kantian ethics, where duties are absolute. The user mentioned examples like torture, lying to a murderer, and organ harvesting. The core issue is the agent's responsibility versus the outcome. 

  The user found terms like "agent-relative constraints" but feels they don't capture the paradox. They want to know if philosophers see this as a distinct problem. The Doctrine of Double Effect might be related, but it's more about intention versus outcome. 

  Threshold deontology is another angle—rules apply until a threshold is crossed. But the user's examples don't involve thresholds; the absolutist doesn't budge regardless of consequences. The paradox here is adhering to the rule causes more harm, which seems counter to the rule's purpose. 

  The deeper need might be understanding why this tension exists. Is it a flaw in deontology? Or is there a justification? The user might be seeking frameworks to evaluate such moral dilemmas, especially coming from a software background where efficiency and outcomes are prioritized. 

  Terms like "integrity" or "moral corruption" from Bernard Williams could explain the reluctance to violate personal principles. Also, the distinction between doing vs. allowing harm: the absolutist avoids being the cause, even if allowing more harm. 

  I should explain why "paradox of deontic detachment" fits—rules detach from their consequences. The user needs clarity on whether this is a named problem and how philosophers address it. Highlighting the debate between deontologists and consequentialists would show the lack of consensus. 

  Also, the user might be looking for resources or further reading. Recommending primary sources like Kant and contemporary discussions could help. Emphasizing that this is a central tension in ethics, not just a niche problem, validates their observation.
answer: |-
  What you've identified is a **central tension in deontological ethics**, specifically within **absolutist deontology**. Philosophers absolutely recognize and vigorously debate this structure, which highlights a fundamental clash between **agent-centered constraints** and **consequentialist reasoning**.

  Here's a breakdown of the key concepts and how they relate to your observation:

  1.  **The Core Concepts:**
      *   **Agent-Relative Constraints (or Side-Constraints):** These are rules prohibiting specific actions *regardless of their consequences*. They bind the *agent* specifically. "I must never do X," even if my doing X would prevent *others* from doing more X. The constraint is relative to *me* and *my actions*. Your description of the rule-follower's stance ("what matters is that *I* didn't do X") perfectly captures this.
      *   **Agent-Neutral Reasons:** Reasons for action that focus solely on states of affairs in the world, independent of who performs the action. "Minimize instances of X" is an agent-neutral reason. Consequentialism is built on agent-neutral reasons.
      *   **The Doing/Allowing Distinction:** The core deontological intuition is that there's a morally significant difference between *actively causing harm* (doing) and *merely allowing harm to occur* (allowing), even if the outcome is the same. Refusing to torture the suspect is "allowing" the terrorists to torture hostages; doing the torture oneself is "doing" the harm.
      *   **Integrity & Moral Corruption:** Deontologists often argue that violating a fundamental constraint (like torture or murder) corrupts the agent's moral character or integrity in a way that merely allowing others to do wrong does not. Becoming a torturer, even once, changes who *you* are.

  2.  **The Paradox You Observe:**
      This structure is widely recognized and debated. While it might not have a single, universally agreed-upon *label* beyond descriptions like "the problem of deontic constraints leading to worse outcomes" or "the clash between agent-relative constraints and agent-neutral values," it is a **defining feature and critical challenge for absolutist deontology**.
      *   It's arguably **the core paradox of absolutist deontology**: Rules justified by the inherent wrongness of an act (X) lead, in foreseeable scenarios, to *more* instances of that very act (X) occurring in the world than would occur if the rule were violated once. The rule, intended to prevent X, becomes counterproductive to that very goal in these cases.

  3.  **Distinguishing from Nearby Concepts:**
      *   **Threshold Deontology:** This is a *response* to the paradox you describe. Threshold deontologists accept strong agent-relative constraints *up to a point* (a threshold), but argue that when the consequences of adhering to the constraint become *sufficiently catastrophic* (e.g., millions die), consequentialist reasoning overrides the constraint. The absolutist you describe *rejects* threshold deontology – there is *no* threshold for them.
      *   **The Paradox of Deontic Detachment (or Paradox of Strict Obligation):** This is *very close* and often used interchangeably to describe the scenario you outline. It specifically highlights the counterintuitive result: Detaching oneself from committing the wrong act (X) leads to the detachment *causing* more instances of X. Your rule-follower is practicing deontic detachment ("My hands are clean, I didn't do X").
      *   **Doctrine of Double Effect (DDE):** DDE deals with actions that have both good and bad effects. It's relevant in some variations of your examples (like the organ transplant case, where the doctor *intends* to save lives but *foresees* causing death). However, in the core structure you describe (torture once to prevent multiple tortures, lie once to prevent a murder), DDE often wouldn't permit the act because the bad effect (the torture, the lie) is the direct means to the good end, violating the "means" condition of DDE. The paradox you see arises *precisely* because the absolutist rejects DDE as a justification in these cases.
      *   **The Problem of Dirty Hands:** This focuses on the moral burden an agent bears *even when* they justifiably violate a deep moral constraint for a greater good. The absolutist avoids dirty hands entirely by refusing to act.

  4.  **Philosopher's Perspectives & Justifications:**
      *   **The Deontological (Absolutist) Defense:**
          *   **Intrinsic Wrongness:** Acts like torture, murder of the innocent, or lying are intrinsically wrong. Their wrongness isn't derived from their consequences; it's inherent in the act itself. Therefore, committing such an act is never permissible, regardless of the consequences.
          *   **Agent-Centric Responsibility:** My primary moral responsibility is for *my own actions*. I cannot control the actions of others, only my own. I am responsible for the torture *I* commit; I am *not* responsible for the torture committed by the terrorists, even if I could have prevented it. My duty is to keep *my* hands clean.
          *   **The Slippery Slope / Corruption:** Allowing *any* exception, even in extreme cases, risks eroding the absolute prohibition and leading to abuse in less clear-cut situations. It normalizes the terrible act.
          *   **Respect for Persons:** Violating a constraint like "don't kill an innocent" treats that innocent person *merely as a means* to save others, failing to respect their inherent dignity and right not to be used.
      *   **The Consequentialist Critique:**
          *   **Irrationality of the Outcome:** It seems fundamentally irrational and morally perverse to adhere to a rule designed to prevent X when adhering to it demonstrably *causes more X*. The rule defeats its own purpose.
          *   **Moral Schizophrenia:** Critics like Shelly Kagan argue that deontology suffers from a kind of "moral schizophrenia" – it acknowledges the badness of the outcome (more X) but denies this badness provides a reason *for the agent* to act differently. This decoupling of value and reason for action is seen as incoherent.
          *   **Demandingness of Purity:** The absolutist stance prioritizes the agent's moral purity over the actual suffering or harm experienced by victims. This can seem selfish or fetishistic.

  5.  **Consensus?**
      There is **no consensus** on resolving this paradox without abandoning absolutism.
      *   **Absolutists** bite the bullet: They accept that the world might contain more instances of X as a result of their adherence to the rule, but maintain that this is the tragic cost of acting morally. The greater moral imperative is to avoid committing the intrinsically evil act oneself. (Key figures: Immanuel Kant - though interpretations vary, Elizabeth Anscombe, contemporary "neo-Kantians").
      *   **Threshold Deontologists** offer a compromise: Rules are absolute *until* consequences pass a catastrophic threshold, at which point consequentialism takes over. (Key figures: Many contemporary deontologists adopt some form of threshold).
      *   **Consequentialists** see the paradox as a fatal flaw in absolutist deontology: They argue morality *must* be responsive to outcomes, and any rule that isn't should be rejected or modified. Preventing more harm/instances of X is the paramount moral goal. (Key figures: John Stuart Mill, J.J.C. Smart, Shelly Kagan).
      *   **Virtue Ethicists** might reframe it: Focusing not on rules or consequences, but on what kind of character one cultivates. Would a virtuous person torture? Probably not. But would they feel responsible for the outcome? The analysis becomes more contextual and agent-focused.

  **In Summary:**

  You've pinpointed **the core challenge for absolutist agent-relative constraints in deontology**. While it might be called the **"Paradox of Deontic Detachment," "the Problem of Counterproductive Constraints,"** or simply **"the challenge of catastrophic consequences to deontological rules,"** it's a well-recognized and fiercely debated structure. Philosophers see it as a genuine and profound tension, not a minor quirk. The debate centers on whether:
  1.  **Integrity and non-violation** (avoiding doing X oneself) are paramount, even at the cost of more X occurring overall (Absolutist Deontology).
  2.  **Outcomes** (minimizing X overall) must ultimately override constraints when the stakes are high enough (Threshold Deontology / Consequentialism).

  There is no resolution acceptable to all camps. Understanding this structure is key to grasping the fundamental divide between deontological and consequentialist approaches to ethics. Your observation that the rule seems to decouple from its original purpose is precisely the consequentialist critique of deontological absolutism. The deontologist's response is that the purpose was never *solely* to minimize X; it was also, and primarily, to define the boundaries of morally permissible action *for the agent*.
