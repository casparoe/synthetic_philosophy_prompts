  Below is a decision-tree handout designed to sort metaphysical commitments about persistence using concrete cases, without relying on technical vocabulary. It fits on two sides of A4 and flags incoherent combinations. The tree starts with the coincidence case to force a fundamental commitment early, then branches through key puzzles (temporary intrinsics, fission, identity over time). Leaves include the main positions, with notes on unstable/incoherent combinations.

  ---

  **Persistence Commitment Tree**  
  *Answer intuitively; follow the arrows based on your "yes" or "no".*

  ### I. COINCIDENCE  
  **You see a Catholic sitting in a pew. In the same spot, there’s a statue-shaped lump of matter. Are there two things here?**  
  - **Yes** → Go to **II.A**  
  - **No** (Only one thing) → Go to **II.B**  

  ---

  ### II. TEMPORARY INTRINSICS (BANANA & POKER)  
  *A banana is green Monday, yellow Friday. A poker is hot at one end, cold at the other.*  

  #### A. (If you said "two things" in I)  
  **Is the poker having different temperatures at its ends analogous to the banana having different colors across days?**  
  - **Yes** (Time is like space: variation requires parts) → Go to **III.A**  
  - **No** (Time is special: variation without parts) → Go to **III.B**  

  #### B. (If you said "one thing" in I)  
  **Can the banana be both green (Monday) and not-green (Friday) without having temporal parts?**  
  - **Yes** (It changes properties without parts) → Go to **IV**  
  - **No** (It must have Monday/Friday parts) → Go to **III.A**  

  ---

  ### III. FISSION (AMOEBA SPLIT)  
  *Amoeba Amy splits into Beth and Cate. Post-split, is "Amy exists" true?*  

  #### A. (From II.A or II.B-"No")  
  **Before splitting, was Amy in the dish?**  
  - **Yes** → **But after splitting?**  
    - "Amy exists" is **false** (Amy is gone) → Go to **V.A**  
    - "Amy exists" is **true** for Beth *or* Cate → *Incoherent!* (One thing can’t become two without ambiguity. No position holds this.)  
  - **No** (Amy wasn’t there pre-split?) → *Incoherent!* (Denies Amy existed pre-split. Contradicts the case.)  

  #### B. (From II.A-"No")  
  **Does fission require time to be like space?**  
  - **Yes** → Go to **III.A** (Re-ask III.A with this commitment)  
  - **No** → *Incoherent!* (Time isn’t like space, but fission is unproblematic? No position combines these.)  

  ---

  ### IV. PROPERTY HANDLING (FOR ENDURANTISTS)  
  *(From II.B-"Yes")*  
  **When the banana is green Monday, is this the same property as a lime being green?**  
  - **Yes** (Greenness is identical; "on Monday" modifies how it’s had) → **Leaf: Adverbial Endurantism**  
  - **No** (Greenness is relativized: "green-at-Monday" ≠ "green-at-Friday") → **Leaf: Relativized-Property Endurantism**  

  ---

  ### V. IDENTITY OVER TIME (FETUS CASE)  
  *(From III.A-"false")*  

  #### A.  
  **"I was once a fetus" vs. "There was a fetus where I now stand." Are both equally good?**  
  - **Yes** (Location/identity equivalent) → **Leaf: Stage Theory**  
  - **No** (Only "I was a fetus" is correct) → **Leaf: Worm Theory**  

  ---

  ### LEAF DESCRIPTIONS  
  - **Adverbial Endurantism**: Objects endure (wholly present at each time). Properties are had *simpliciter* but modified by adverbs ("green *Monday-wise*").  
  - **Relativized-Property Endurantism**: Objects endure. Properties are relations to times ("green-at-t").  
  - **Worm Theory**: Objects perdure (exist as 4D "worms"). Temporal parts have properties; "I" refers to the whole worm.  
  - **Stage Theory**: Objects perdure as instantaneous stages. "I" refers to a stage; identity claims depend on counterpart relations.  

  ### FLAGGED COMBINATIONS  
  - **"Two things + Banana has no parts" (II.B → III.B)**: Incoherent. If time isn’t like space, coincidence (two objects in one spot) should be impossible, but you accepted it.  
  - **"One thing + Banana needs parts" (II.B → III.A)**: Unstable. Coincidence deniers typically reject temporal parts (e.g., endurantists), but you embraced parts.  
  - **"Amy exists post-split" (III.A)**: Incoherent. Fission forces choice: either Amy doesn’t survive (all standard views) or survival is indeterminate (not covered here).  

  ---

  ### DESIGN NOTES  
  1. **Cases over vocabulary**: Starts with coincidence/fission/fetus cases; "temporal parts" etc. never mentioned.  
  2. **Distinguishes theories**:  
     - Endurantism variants split via property handling (IV).  
     - Worm vs. Stage separated by fetus case (V.A): Worm theory prioritizes identity ("I was a fetus"); stage theory treats identity as derivative of location/counterparts.  
  3. **Embarrasses incoherence**: Branches like III.B and "Amy exists" in III.A lead to dead ends with explanations.  
  4. **Fits 2xA4**: Concise phrasing; most users hit a leaf in 3–4 steps.  

