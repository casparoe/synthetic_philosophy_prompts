  1.  **Situation:** The school vending machine is broken; it accepts dollar bills but doesn't dispense snacks or return the money. Alex just lost a dollar trying to use it. Jamie walks up, dollar in hand.
  2.  **Literal Utterance:** Alex says to Jamie, "Careful, this thing *really* hates cash."
  3.  **Speaker's Meaning (Implied):** Alex intends the cooperative hint: "Don't put your dollar in; it will just take it without giving you anything because it's broken." (Exploiting the Maxim of **Quantity** by being deliberately vague/indirect).
  4.  **Listener's Interpretation:** Jamie thinks Alex means: "The machine prefers coins over bills, so I should use a coin instead to get a snack." Jamie inserts a coin.
  5.  **Miscommunication & Maxim:** Jamie misinterpreted the hint about the machine being broken (Quantity violation leading to false inference) as a hint about payment method. The machine, being broken, eats Jamie's coin too.
