answer: |-
  Here is a concise, warm, and precise toast designed for your constraints. It uses the rowing club connection as a unifying metaphor while carefully separating key claims:

  ---

  (Clink glass) Friends, colleagues, family, and fellow oar-wielders… gather ‘round! It’s an honour to toast [Advisor's Name]. Thirty years of mentorship, and he still terrifies me into double-checking my premises. So, [Name], tonight, I promise: no misstatements. Just gratitude… and maybe one boat metaphor.  

  We all know [Name] as the man who can measure the flex in a carbon-fibre oar down to the micron, yet finds equal fascination in the unfathomable depths of the mind. His life’s work asks a deceptively simple question: *What is this ‘me’ experiencing all this?* His answer? Think of it like his beloved racing shell.  

  A shell is a perfect, stripped-down model: lightweight, efficient, designed purely to *do the thing* – to glide, to respond, to win. It doesn’t *need* a little captain sitting inside steering; the whole system *is* the steering. [Name] sees our sense of self the same way. The brain, he argues, builds an elegant, simplified model – a user interface – of its own incredibly complex processes. That model *is* our conscious experience. It’s the feeling of being *you*, sitting in the boat, feeling the oar pull. As he’d say (probably with a smirk): *"There’s a show happening, brilliantly staged… but don’t peek behind the curtain expecting a separate audience member."*  

  Now, Dev, if you’re listening, relax – [Name] isn’t calling us zombies! A zombie, by definition, lacks the show altogether. The whole point is the show *is real* – it’s the vivid, undeniable experience we all have. It’s just that the *‘self’* we experience within it is part of the performance, not a ghostly spectator. And [Name], ever the pragmatist, loves that this model *works*. It lets us row, argue, love, and even throw retirement dinners!  

  [Name], your genius was never about denying the richness of experience – heavens, your debates proved you feel it fiercely! – but about showing us how astonishingly the machinery hums behind the scenes. You taught us to question the map, not dismiss the territory. And you did it with unwavering intellectual honesty, even when… well, even when discussing it over dinner with your wonderfully patient wife, [Wife's Name], who proves daily that different maps can navigate the same life beautifully.  

  So, to [Advisor's Name]: For teaching us that understanding the stage lights doesn’t dim the show… and for reminding us that the most complex systems – brains, boats, or departments you’ve built – often find their grace in the simplest, most elegant models. May your retirement be as richly experienced as the consciousness you’ve spent a lifetime illuminating. Cheers!  

  \answer{The toast commits to claiming that the advisor's view holds the *feeling* of consciousness is real but identifies it as an internally generated self-model within the brain's processes, explicitly denying this implies philosophical zombies or the non-existence of subjective experience.}  

  ---

  **Why this works:**  
  1. **Rowing Metaphor:** Grounds the abstract philosophy ("stripped-down model," "system is the steering") in his tangible passion, making it accessible to the club/family.  
  2. **Precise Distinctions:**  
     - Explicitly separates the *reality of the conscious experience* ("the show is real") from the *nature of the self* ("part of the performance").  
     - Directly refutes the zombie claim ("isn’t calling us zombies... lacks the show altogether").  
     - Clarifies "illusion" as a functional interface/metaphor ("user interface," "performance"), not a deception of a separate entity.  
  3. **Respects Boundaries:**  
     - Mentions the wife’s faith positively without engaging debate ("different maps... same life").  
     - Avoids arguing correctness ("question the map, not dismiss the territory").  
     - Focuses on admiration for his intellectual approach ("unwavering honesty," "pragmatist").  
  4. **Tone:** Warm, slightly self-deprecating ("terrifies me"), celebratory, and concise (~5 mins spoken naturally).  
  5. **The Line:** Preserves his signature phrase while framing it accessibly ("don’t peek behind the curtain").  

  This keeps the philosophy sharp for his colleagues while ensuring the rowing club sees the heartfelt tribute to a man fascinated by how things—whether minds or boats—*work*. Good luck!
