    1. The length of the description of the model (model complexity).
    2. The length of the description of the data given the model (which relates to the model's fit, typically via the negative log-likelihood).

  However, Kolmogorov complexity is uncomputable, so we will use practical surrogates.

  We'll break the procedure into steps:

  Step 1: Check for significant differences in out-of-sample performance.
    - Why? Because if one model is significantly better on unseen data, we can choose it without worrying about complexity.
