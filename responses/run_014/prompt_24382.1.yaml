  Then run the procedure on two cases: (1) a 3-parameter model that fits our data slightly worse than a 12-parameter model, and (2) a 100-parameter model whose parameters are all generated by one simple formula, up against a 5-parameter model with hand-set weights. For at least one of them I want the procedure to land on an answer I won't love, and I want you to say plainly what the procedure can't do and where it's likely to misfire.

