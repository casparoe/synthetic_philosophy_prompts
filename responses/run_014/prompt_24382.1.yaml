answer: |-
  Below is a practical, reusable decision procedure for model selection, grounded in the theory of Occam's razor (via Minimum Description Length as a computable proxy for Kolmogorov complexity). It prioritizes out-of-sample performance and penalizes complexity, while explicitly flagging where human judgment is required. The procedure is designed for speed (<30 min) and includes a non-technical justification for stakeholders.

  ---

  ### **Model Selection Procedure: Structured Complexity vs. Fit Tradeoff**
  **Inputs**: Two trained models (A and B), validation dataset, number of data points (\(n\)), and likelihoods (or loss-based proxies).

  #### **Step 1: Out-of-Sample Performance Test**
  - **Question**: "Is one model significantly better on unseen data?"  
  - **Method**:  
    - Calculate out-of-sample loss (e.g., log-loss, MSE) for both models on a held-out validation set.  
    - Perform a **paired Diebold-Mariano test** (DM test) to check for statistically significant differences (5% significance level).  
  - **Decision Rules**:  
    - If Model A has significantly lower loss (\(p < 0.05\)) → **Choose Model A**.  
    - If Model B has significantly lower loss (\(p < 0.05\)) → **Choose Model B**.  
    - If difference is **not significant** (\(p \geq 0.05\)) → **Proceed to Step 2**.  
  - **Why?** Live trading depends on generalization, not training fit. This step avoids overfitting.

  #### **Step 2: Complexity Assessment (Adjusted Parameter Count)**
  - **Question**: "What is the effective complexity of each model, accounting for parameter generation?"  
  - **Method**:  
    - For each model, compute **adjusted parameter count** (\(k_{\text{adj}}\)):  
      - If parameters are **generated by a simple rule** (e.g., formula, algorithm with fixed logic), \(k_{\text{adj}} = \text{number of inputs to the rule}\).  
        - *Example*: A 100-parameter model with weights set by \(w_i = a \cdot i + b\) has \(k_{\text{adj}} = 2\) (only \(a\) and \(b\) are free).  
      - If parameters are **independently optimized** (no generating rule), \(k_{\text{adj}} = \text{total parameters}\).  
    - If generating rules are ambiguous → **Flag for human judgment** (see Step 4).  
  - **Why?** Kolmogorov complexity is uncomputable, but \(k_{\text{adj}}\) approximates "description length" of the model. Simpler rules compress complexity.

  #### **Step 3: Penalized Fit Comparison**
  - **Question**: "Does the better-fitting model justify its complexity after penalization?"  
  - **Method**:  
    - Compute **BIC (Bayesian Information Criterion)** for both models:  
      \[
      \text{BIC} = -2 \cdot \text{log-likelihood} + k_{\text{adj}} \cdot \ln(n)
      \]  
      (Use loss-based proxy like SSE if likelihoods are unavailable; see note below).  
    - Calculate \(\Delta \text{BIC} = \text{BIC}_A - \text{BIC}_B\).  
  - **Decision Rules**:  
    - If \(|\Delta \text{BIC}| \geq 10\) → **Strong evidence**: Choose model with lower BIC.  
    - If \(6 \leq |\Delta \text{BIC}| < 10\) → **Positive evidence**: Choose model with lower BIC.  
    - If \(2 \leq |\Delta \text{BIC}| < 6\) → **Weak evidence**: Proceed to Step 4.  
    - If \(|\Delta \text{BIC}| < 2\) → **Too close to call**: Proceed to Step 4.  
  - **Why BIC?** It consistently estimates true model complexity (unlike AIC) and approximates MDL. \(\Delta \text{BIC} > 10\) indicates >99% posterior probability for the better model.

  #### **Step 4: Human Judgment & Tiebreakers**
  - **Question**: "Which model is more robust, interpretable, and trading-safe?"  
  - **Factors to weigh**:  
    - **Stability**: Retrain models on bootstrapped data. Lower parameter variance → more robust.  
    - **Interpretability**: Can the PM understand the model’s logic? Hand-tuned models often win here.  
    - **Live-Trading Risk**: Does one model fail catastrophically in edge cases? Check historical stress tests.  
  - **Output**:  
    - If clear winner → **Choose it**.  
    - If still ambiguous → **Default to simpler model** (lower \(k_{\text{adj}}\)).  

  ---

  ### **Case Studies**
  #### **Case 1: 3-Parameter Model (A) vs. 12-Parameter Model (B)**  
  - **Step 1**: Assume no significant out-of-sample difference (\(p \geq 0.05\)).  
  - **Step 2**: Both models lack generating rules → \(k_{\text{adj,A}} = 3\), \(k_{\text{adj,B}} = 12\).  
  - **Step 3**: Model B fits slightly better but BIC penalizes complexity:  
    \[
    \Delta \text{BIC} = \text{BIC}_A - \text{BIC}_B = \left[ -2\mathcal{L}_A + 3\ln(n) \right] - \left[ -2\mathcal{L}_B + 12\ln(n) \right]
    \]  
    With \(\mathcal{L}_B \approx \mathcal{L}_A + \epsilon\) (small \(\epsilon\)) and \(n=1000\) (\(\ln(n) \approx 6.9\)):  
    \[
    \Delta \text{BIC} \approx -2\epsilon - 9 \cdot 6.9 = -2\epsilon - 62.1
    \]  
    This is \(< -10\) even for modest \(\epsilon\) → **Choose simpler Model A**.  
  - **Why you won’t love it**: You sacrifice slight fit for simplicity. BIC’s penalty dominates.

  #### **Case 2: 100-Parameter Formulaic Model (C) vs. 5-Parameter Hand-Tuned Model (D)**  
  - **Step 1**: Assume no significant out-of-sample difference (\(p \geq 0.05\)).  
  - **Step 2**: Model C’s parameters from \(w_i = a \cdot i + b\) → \(k_{\text{adj,C}} = 2\). Model D hand-tuned → \(k_{\text{adj,D}} = 5\).  
  - **Step 3**: Assume Model D fits better (\(\mathcal{L}_D > \mathcal{L}_C\)):  
    \[
    \Delta \text{BIC} = \text{BIC}_C - \text{BIC}_D = \left[ -2\mathcal{L}_C + 2\ln(n) \right] - \left[ -2\mathcal{L}_D + 5\ln(n) \right]
    \]  
    With \(\mathcal{L}_D = \mathcal{L}_C + \delta\) and \(n=1000\):  
    \[
    \Delta \text{BIC} = -2\delta - 3 \cdot 6.9 = -2\delta - 20.7
    \]  
    If \(\delta < 5.4\) (Model D’s fit advantage is small), \(\Delta \text{BIC} < -10\) → **Choose formulaic Model C**.  
  - **Why you won’t love it**: A 100-parameter model wins over a simpler hand-tuned model because its *effective complexity* is lower. Trading desks often distrust complex black boxes—but math says otherwise.

  ---

  ### **Limitations & Caveats**
  1. **BIC as a Proxy**:  
     - We use BIC because it approximates MDL (load-bearing proxy) and is computable. Kolmogorov complexity/Solomonoff induction are uncomputable and require this approximation.  
     - **Risk**: BIC assumes large \(n\) and correct model specification. With small \(n\), use **AICc** (corrected AIC) instead.  
     - **Non-Likelihood Models**: For non-probabilistic models (e.g., SVM), use validation loss in place of \(-2\mathcal{L}\) and ensure comparability (e.g., same loss function).  

  2. **Where Human Judgment is Critical**:  
     - **Generating Rules (Step 2)**: If a model’s parameter-generating rule is complex (e.g., a neural network), \(k_{\text{adj}}\) defaults to total parameters. This may misrepresent true complexity—flag for review.  
     - **Tiebreakers (Step 4)**: When BIC differences are weak (\(|\Delta \text{BIC}| < 6\)), stability/interpretability dominate. Example: A fragile model with volatile backtest performance should be rejected.  

  3. **Likely Misfires**:  
     - **Overly Simple Rules**: A model with a trivial generating rule (e.g., \(w_i = 0\)) will have low \(k_{\text{adj}}\) but poor fit → BIC penalizes it appropriately.  
     - **Adversarial Complexity**: If a model hides complexity in its "generating rule" (e.g., a formula with 100 terms), \(k_{\text{adj}}\) fails. Audit rules for simplicity.  

  ---

  ### **One-Paragraph Justification for Non-Quant PM**
  > "We use a three-step method to pick models that balances accuracy and simplicity. First, we test both models on unseen data to ensure they perform similarly in real-world conditions. Next, we adjust for complexity by favoring models where parameters follow simple rules (like a short formula), not just counting parameters. Finally, we apply a statistical penalty (BIC) that rewards fit only if it justifies added complexity. If these steps are inconclusive, we prioritize stability and ease of interpretation to avoid risky live-trading behavior. This ensures we don’t overcomplicate models for marginal gains."
