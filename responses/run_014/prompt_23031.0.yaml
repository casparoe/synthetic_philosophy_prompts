  Okay, let me try to unpack this user's query. They're a retired physicist diving into Hobbes, specifically chapters 4 and 5 of Leviathan and parts of De Corpore. They're confused about Hobbes' take on geometry's axioms, like "the whole is greater than the part." The user thought axioms were self-evident truths, but Hobbes seems to treat them as tautologies based on definitions. 

  First, I need to recall Hobbes' epistemology. He was a nominalist and materialist, so for him, all knowledge comes from sensory experience. Abstract concepts are just names we assign. Geometry works because we define the terms precisely, making it a science of definitions, not innate ideas. 

  The user is questioning if axioms are merely verbal conventions. Yes, that's Hobbes' point. By reducing axioms to definitions, he avoids relying on questionable intuitions. This makes geometry certain because it's based on human-constructed definitions. The user also wonders about "computation" – can you really derive theorems like Pythagoras just by adding and subtracting names? Hobbes probably simplifies the process, but his core idea is that reasoning is mechanical, like arithmetic.

  I should connect this to his political project. Hobbes wants a political science as certain as geometry. By basing it on defined terms (like sovereignty, covenant), he aims for similar certainty. The user might be hinting at this link, so I'll mention it but focus on their immediate math concerns.

  The user's background in physics might make them skeptical about reducing math to language. They might worry this undermines math's applicability. But Hobbes isn't denying usefulness; he's explaining why geometry is certain. The deeper need could be understanding how Hobbes' theory holds up against actual math practice and its implications for his political theory. They want to ensure they grasp the math part before tackling Leviathan's politics.

  I'll confirm their reading of axioms as tautologies, explain Hobbes' motivation for reliability, address the computation aspect honestly, and hint at the political relevance without diving in. Making sure to validate their insights as a physicist engaging with philosophy.
answer: |-
  Your reading is spot-on, and the confusion is completely understandable – Hobbes is deliberately overturning a long tradition about the nature of axioms. Let's unpack his move regarding common notions and the nature of geometrical reasoning:

  1.  **Demoting "Common Notions" from Self-Evident Truths to Linguistic Tautologies:**
      *   **Your Assumption (Traditional View):** Axioms like "the whole is greater than the part" are seen as *synthetic a priori* truths – fundamental intuitions about reality itself, built into the structure of reason or the universe, requiring no proof but serving as the bedrock for all further knowledge. They are discoveries about the fundamental nature of quantity or space.
      *   **Hobbes's Radical View:** Hobbes, the arch-nominalist and materialist, rejects this. For him, all knowledge starts with sensation, and universal terms ("whole," "part," "equal," "quantity") are merely *names* we apply to groups of similar particulars based on our sensory experience. There are no universal *things* (like Platonic Forms) corresponding to these names.
      *   **The Linguistic Turn:** Therefore, when we say "the whole is greater than the part," Hobbes argues we aren't revealing a deep truth about the cosmos. We are simply *unpacking the meanings of the words we have defined*. The proposition is true *solely* because of how we have chosen to define "whole" and "part." If "whole" signifies the aggregate, and "part" signifies a constituent element, then by definition, the aggregate (whole) must encompass more than any single constituent (part). It's an *analytic* truth, derived from the signification of names, not a *synthetic* discovery.
      *   **Why "Not Really Notions"?** Calling them "notions" suggests they are innate ideas or fundamental intuitions. Hobbes rejects innate ideas. These axioms are *propositions* built *from* defined names. They become "obvious" only *after* we grasp the agreed-upon definitions. The "obviousness" is linguistic/conventional, not metaphysical or innate.

  2.  **The Point of This Move: Why Demote Axioms?**
      *   **Precision & Certainty:** This is absolutely key. Hobbes thinks the *weakness* of other sciences (like natural philosophy or politics) is their reliance on vague terms, contested definitions, and appeals to dubious "self-evident" principles that aren't truly evident to everyone. By reducing geometry's axioms to *consequences of definitions*, he anchors them in something controllable: human agreement on the signification of words.
      *   **Human Control & Construction:** Geometry becomes a model science precisely because its certainty stems *entirely* from human linguistic convention and logical manipulation of those conventions. We define the terms ("point," "line," "circle"), we lay down the fundamental propositions that flow *necessarily* from those definitions (the "common notions"), and then we compute consequences. There's no reliance on potentially fallible intuition or observation of a messy external world beyond the initial definitions grounded in sensation. The whole edifice is built *by us* and *for us*.
      *   **Undermining Alternative Foundations:** This move directly challenges:
          *   **Scholasticism:** Which relied heavily on innate ideas, essences, and self-evident metaphysical principles.
          *   **Platonism/Cartesianism:** Which posited innate ideas or intellectual intuition grasping eternal truths.
          *   **Empiricism (Naive):** Which might think axioms are directly read off from constant conjunctions in experience. For Hobbes, they are *linguistic consequences* of how we *classify* experience with names.
      *   **Making Science Possible:** For Hobbes, *only* by grounding a science in arbitrary (but clear) definitions and logical computation from them can we achieve the kind of indubitable certainty he craves, especially for his political project. Geometry is the proof it can be done.

  3.  **"Computation in General": How Mechanical is it Really?**
      *   **The Ideal:** Hobbes presents reasoning as literal mental arithmetic: adding and subtracting names/conceptions. Define a line: "a body whose length alone is considered." Define a straight line: "a line that lies evenly between its points." Define parallel lines, etc. Then, through a chain of definitions and the logical consequences of the common notions (themselves consequences of definitions), you compute the properties of figures. In principle, yes, he thinks the Pythagorean theorem *should* be derivable by such a chain – it's a necessary consequence of the definitions and the rules of logic (which, for him, are also rules of correct naming and signification).
      *   **The Reality Gap:** Hobbes is being overly optimistic and somewhat simplistic here. While the *logical structure* of geometry fits his model (definitions -> axioms -> theorems via deduction), the actual *process* of mathematical discovery and proof involves far more than mechanical symbol shuffling:
          *   **Creativity & Insight:** Finding fruitful definitions, constructing auxiliary lines, recognizing patterns, formulating conjectures – these require insight not reducible to mechanical addition/subtraction.
          *   **Spatial Intuition:** Even Hobbes, despite his nominalism, likely relied on mental diagrams and spatial imagination to guide his "computations." Pure symbol manipulation without *some* intuitive grasp of the spatial relations defined is incredibly cumbersome for geometry.
          *   **The Nature of "Steps":** What counts as a valid "step" in the computation? Hobbes doesn't provide a rigorous formal system (like later logicists). His "steps" likely encompass intuitive leaps justified by spatial reasoning, which undermines the purely mechanical, definitional picture.
      *   **The Core Survival:** However, the *core* of Hobbes's picture survives remarkably well in the modern understanding of formal axiomatic systems:
          *   **Formal Systems:** Modern logic and foundations of mathematics show that mathematical truths *can* be derived purely syntactically, from axioms and rules of inference, within a formal system. The symbols can be manipulated according to rules *without* reference to their meaning (though meaning is what gives the system interest).
          *   **Conventionalism:** There's a strong echo of Hobbes in the logical positivist/conventionalist view that mathematical truths are true by convention (definitions and logical rules) and are analytic.
          *   **The Gap:** The crucial difference is that modern mathematics acknowledges the *semantic* level – the interpretation of the symbols in a model (e.g., the real plane for Euclidean geometry) – and the role of intuition in discovery and informal proof. Hobbes downplays or tries to eliminate this semantic/intuitive aspect in favor of pure nominal computation.

  **Connecting to the Political Project (Briefly, as requested):**

  You're absolutely right to sense the connection. Hobbes desperately wants political philosophy to be as certain as geometry. How?

  1.  **Define Key Terms Precisely:** "Sovereign," "Covenant," "Right of Nature," "Law of Nature," "Commonwealth" – these must be defined as clearly as "point" or "line."
  2.  **Establish "Common Notions" as Linguistic Truths:** Foundational propositions like "men seek self-preservation" or "covenants must be kept" are presented not as innate moral truths, but as *necessary consequences* of defining a human being (as a self-moving body seeking to preserve its motion/life) and a covenant (as a voluntary act transferring right). Their "truth" stems from the definitions.
  3.  **Reason as Computation:** Political conclusions (e.g., the necessity of absolute sovereignty) are meant to be computed through a chain of reasoning ("reckoning") from these definitions and their necessary consequences, just like the Pythagorean theorem. The goal is to make political science demonstrative and certain, removing contentious appeals to tradition, revelation, or disputed moral intuitions.

  **Conclusion:**

  Your reading is fair and insightful. Hobbes *does* demote common notions from self-evident truths about the world to definitional tautologies. He does this **precisely because** he believes it's the *source* of geometry's unique certainty and reliability – it grounds truth entirely within human-controlled linguistic conventions and logical manipulation. While his model of "computation" is an idealized simplification that doesn't fully capture the creative and intuitive aspects of mathematical practice, its core idea – that mathematical truth flows from definitions and logical rules – remains influential and captures a crucial aspect of formal reasoning. Understanding this foundational move in his epistemology is indeed essential for grappling with his ambitious (and controversial) attempt to build a science of politics on geometric principles. Keep wrestling with it – your physics background gives you a great lens for examining his claims about measurement, definition, and certainty!
