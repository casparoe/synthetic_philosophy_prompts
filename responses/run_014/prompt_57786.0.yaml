prompt: |-
  I am a novelist completing a revision of a novel that alternates between a post-industrial town in Yorkshire and a fast-growing port city in Ghana, and I find that my characters' disputes about corruption risk becoming mouthpieces for my own uncertainty rather than believable disagreements. To discipline the draft, I would like a formal specification of what an adequate philosophical account of what counts as corruption must accomplish, framed for the purpose of making cross-cultural disagreement intelligible in fiction rather than for prosecutorial use.

  I would be grateful for a carefully ordered set of desiderata, each accompanied by the reason or illustrative consideration that motivates it, with an indication of which requirements you take to be non-negotiable and which reflect the prejudices of a particular camp. The specification should at minimum handle three invented cases I keep returning to: a council housing officer in Yorkshire who stays strictly within her legal discretion yet systematically expedites repairs for former schoolmates and neighbours who can reciprocate with childcare and recommendations; a Ghanaian customs official who declines cash but accepts yams and festival invitations from traders whose containers he then clears no faster than the ordinary queue; and an expatriate clinic director who refuses a routine facilitation payment for medical supplies and thereby delays vaccines by six weeks. It should also preserve the distinctions my characters actually invoke, between violating a written law and betraying an entrusted role, between a gift that creates diffuse social obligation and a payment tied to a specific official act, and between patronage networks that substitute for an absent state and those that hollow out a functioning one, while addressing whether a single universal standard can survive anthropological variation or whether corruption must be indexed to local expectations about office.

  Please keep the emphasis on the criteria and their motivating cases rather than on an extended survey, though a brief closing note on how a broadly institutionalist view, a culturalist view, and a functionalist view fare against your list would help me distribute strengths and blind spots among my characters, including whether any subset of your desiderata appears jointly unsatisfiable. Conclude by stating how confident you are in the overall specification and singling out the single requirement about which you are least sure and why.
reasoning: |-
  Okay, the user is a novelist working on a novel set in Yorkshire and Ghana, struggling with how to portray corruption debates authentically. They want a philosophical framework to make character disagreements believable, not preachy. 

  Hmm, their core challenge is balancing universal ethics with cultural relativity in corruption depictions. They need rigor without losing narrative nuance—especially for three specific scenarios: the Yorkshire housing officer using discretion for reciprocity, the Ghanaian customs official accepting gifts but not speeding up service, and the expatriate causing delays by refusing "routine" payments. 

  *checks notes* Their characters already recognize key distinctions: law vs role betrayal, gifts vs bribes, functional vs destructive patronage. But they fear characters sound like mouthpieces. So the framework must accommodate these nuances while clarifying where universal standards might fracture. 

  *mental list forming* First, any corruption definition must separate personal gain from public duty—that's non-negotiable. The Yorkshire case tests this: her actions aren't illegal but abuse entrusted power. Then there's the anthropological trap: if Ghanaian gift-giving is normative, is it corruption? Must distinguish between cultural practice and systemic distortion. The expatriate case introduces consequentialism—when does purity become negligence? 

  *structuring thoughts* The novelist needs desiderata ordered by priority. Core principles first: public office integrity (universal), then functional harm (context-dependent). Cultural intent matters—the yams vs cash distinction in Ghana—but can't excuse role betrayal. The toughest tension is between functionalist views (does patronage work?) and institutionalist views (does it undermine rules?). 

  *flagging uncertainties* Least confident about weighting consequences vs principles. Refusing bribes delays vaccines—is that "more corrupt" than paying? Realistically, characters would clash here: the institutionalist purist vs the pragmatic functionalist. That’s where the novel’s conflict lives. 

  Final note: The framework should let characters authentically hold incompatible weights for each desideratum. The Ghanaian official might see yams as sustaining social fabric; the expatriate sees any gift as slippery slope. Neither is wholly wrong—that’s the point.
answer: |-
  Here is a formal specification of desiderata for an adequate philosophical account of corruption, designed to make cross-cultural disagreement intelligible in fiction, with your cases and distinctions in mind:

  **Core Desiderata (Non-Negotiable):**

  1.  **Role-Obligation Distinction:** *Must* distinguish between actions violating the core obligations of a specific entrusted role/office and actions merely violating written law or personal morality.
      *   *Reason:* A housing officer's role obligation is impartial service to *all* constituents, not just those who can reciprocate (Yorkshire case). Violating this *fiduciary duty* is central to corruption, even if legal.
      *   *Illustration:* The customs official declining cash but accepting yams *might* violate role obligations if impartiality is required, regardless of legal technicality or gift nature.
      *   *Handles Distinction:* Directly addresses "violating law vs betraying entrusted role."

  2.  **Public/Private Boundary:** *Must* identify the improper crossing of boundaries between private gain (broadly construed: material, social, political) and public duty/office resources.
      *   *Reason:* Corruption fundamentally involves misdirecting the power/resources of a public (or publicly entrusted) office for non-public ends. The reciprocity in the Yorkshire case crosses this boundary.
      *   *Illustration:* The expatriate's refusal stems from seeing *any* payment as crossing this boundary, privatizing a public function.
      *   *Handles Distinction:* Underpins the "gift vs payment" issue – both are private gains potentially crossing the boundary.

  3.  **Harm/Subversion Criterion:** *Must* account for how an action subverts the intended function or purpose of the institution/role, or causes demonstrable harm to its legitimate beneficiaries or the public trust.
      *   *Reason:* Patronage hollowing out a state subverts its function; delaying vaccines harms beneficiaries. Even if legal or customary, harm/subversion indicates corruption.
      *   *Illustration:* The Ghanaian official *might* subvert the customs system's purpose of impartial queue management if festival invitations systematically influence access, even without expedited service. The Yorkshire officer harms those outside her network.
      *   *Handles Distinction:* Key for differentiating "patronage substituting for absent state" (potentially functional, less subversive) vs. "patronage hollowing out functioning state" (inherently subversive).

  **Contextual Desiderata (Essential for Cross-Cultural Intelligibility):**

  4.  **Intent & Perception:** *Must* incorporate the actor's intent and the relevant community's perception of the act's legitimacy *as evidence*, but not as definitive.
      *   *Reason:* The Ghanaian official may genuinely see yams/festivals as social obligation, not payment; Yorkshire neighbours may see reciprocity as normal. This motivates characters' disagreements. However, intent/perception don't absolve subversion or harm.
      *   *Illustration:* Characters argue whether the customs official *intends* to trade favours or merely participate in reciprocity. Is the community harmed or accepting?
      *   *Handles Distinction:* Crucial for exploring "gift creating diffuse obligation vs payment for specific act" and indexing to local expectations.

  5.  **Scale & Systemic Effect:** *Must* consider whether the action is an isolated incident or part of a pattern/system, and its cumulative effect on institutional integrity/distributional fairness.
      *   *Reason:* An isolated yam gift differs from systemic network favouritism. The Yorkshire officer's *systematic* favouritism is key. Patronage substituting for an absent state may be systemic but functionally necessary *in that context*.
      *   *Illustration:* Is the customs official's acceptance an exception or the norm? Does the expatriate's refusal, while principled, ignore a systemic reality where *no* payment means *no* function?
      *   *Handles Distinction:* Vital for differentiating functional vs. hollowing-out patronage and assessing harm.

  6.  **Relativity of Norms:** *Must* acknowledge that the specific *norms* governing the public/private boundary and role obligations are culturally and institutionally contingent, while insisting the *distinction itself* is universal.
      *   *Reason:* Expectations about gifts, reciprocity, and official discretion vary (Ghana vs. Yorkshire vs. Expat). However, the *existence* of a boundary and role-specific duties is near-universal in formal office-holding.
      *   *Illustration:* Characters clash on whether "local expectations" (Ghanaian gift culture, Yorkshire neighbourliness) redefine the role obligation or merely describe how the boundary is *crossed*.
      *   *Handles Distinction:* Directly addresses "indexing to local expectations vs universal standard." The account allows universality of the *categories* (role, boundary, harm) while contingency in the *content* of norms.

  **Analysis of Key Distinctions & Cases:**

  *   **Yorkshire Housing Officer:** Violates **Role-Obligation (1)** and **Public/Private Boundary (2)** systematically. *Harm/Subversion (3)* occurs by disadvantaging outsiders. *Intent/Perception (4)* might see it as "helping neighbours," but scale **(5)** makes it corrupt. Local norms **(6)** don't override core role duty.
  *   **Ghanaian Customs Official:** Hinges on interpretation. If yams/festivals create obligations influencing *impartial* queue management, it violates **Role-Obligation (1)** & **Boundary (2)**, potentially causing **Harm/Subversion (3)** through unfair access (even if speed unchanged). *Intent/Perception (4)** is central to disagreement. *Scale (5)** matters. *Relativity (6)** is key: do local norms redefine the role or merely describe the transgression?
  *   **Expatriate Clinic Director:** Upholds **Role-Obligation (1)** & **Boundary (2)** rigidly. However, the **Harm/Subversion (3)** (delayed vaccines) creates tension. This highlights the conflict between deontological (duty-based) and consequentialist (outcome-based) views within the framework. *Intent (4)** is pure, but ignores systemic reality **(5)**. *Relativity (6)** – she imposes an external standard, potentially misunderstanding local functionality.

  **Views Against the Desiderata (For Character Development):**

  *   **Institutionalist View:** Prioritizes 1, 2, 3 (subversion). Strong on universal role integrity and rules. *Blind Spots:* May undervalue 4 & 6, appearing rigid or culturally imperial (like the Expat). May struggle with contexts where formal institutions are weak/absent (functional patronage).
  *   **Culturalist View:** Emphasizes 4, 6. Sees actions through local meaning. *Strengths:* Avoids ethnocentrism; explains motivations (Ghanaian official). *Blind Spots:* Risks collapsing 1 & 2 into local perception alone, potentially excusing systemic harm/subversion (3) if normalized. Weak on 5 (systemic effects).
  *   **Functionalist View:** Focuses intensely on 3 (harm/subversion) and 5 (system effects). Asks "does it work?" or "is it less bad than alternatives?" *Strengths:* Pragmatic; explains persistence of patronage in weak states. *Blind Spots:* Risks downplaying 1 & 2 (role integrity/boundary) if outcomes seem acceptable short-term. Can justify corrosive systems. May ignore 4 (intent/perception as harm itself).

  **Tensions & Satisfiability:** Desiderata 1-3 (core) are jointly satisfiable and essential. The main tension lies between the *universality* implied by 1-3 and the *relativity* required by 4 & 6. This tension is not fatal but *productive* for fiction – it *is* the core of believable disagreement. Can an act satisfy all core criteria (1-3) in one context but not another? The framework suggests "Yes" regarding the *nature* of the norms (6) and perception (4), but "No" regarding the fundamental violation of role/boundary causing harm (1-3) *if* those norms are shown *not* to legitimately redefine the role/boundary in that context.

  **Conclusion & Confidence:**

  **Confidence:** Moderately High (7/10). This specification robustly handles your cases, preserves your key distinctions, and provides a scaffold for cross-cultural disagreement by balancing universal core principles with contextual sensitivity. It avoids prosecutorial rigidity while offering clear criteria for argument.

  **Least Confident Requirement: Relativity of Norms (6).** *Why?* The line between "culturally contingent norms *defining* the legitimate scope of a role/boundary" and "culturally contingent norms *describing* how that boundary is *illegitimately crossed*" is exceptionally fine and context-dependent. It requires deep, nuanced understanding of specific institutions and social fabrics – something characters (and authors!) can reasonably dispute. Is the Ghanaian official's role *fundamentally different* because of local gift culture, or is the culture just the *mechanism* for corruption? This ambiguity is inherent but fruitful for fiction.
