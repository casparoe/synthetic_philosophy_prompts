prompt: |-
  I am trying to get clear on a family of arguments in combinatorial game theory that establish that the first player has a winning strategy in a symmetric game without ever exhibiting one, and I would like the full specification before I examine any more of them. Take the setting I have in mind: two players alternate moves in a finite game with perfect information and no chance, the winning condition treats the two players' pieces identically, and the argument usually runs as follows. Suppose the second player had a winning strategy; then the first player could make an arbitrary opening move and thereafter follow that strategy as though she were the second player, choosing some arbitrary move whenever the stolen strategy calls for a move that is no longer available to her, on the thought that an extra piece of her own can only help. Write the desiderata: everything an argument of this kind must deliver to count as having established that the first player wins. I want the requirements, each with the case or consideration behind it — the games it has to get right, the distinctions it cannot collapse, the results it must not contradict — along with your judgment about which of them are genuine requirements and which are artifacts of the way the argument is customarily told. Flag any pair of them that I should not expect to be jointly satisfiable; that is the part I care about most. In particular, I want to know what such an argument must say about the gap between showing that the second player cannot win and showing that the first player does win, what it must say about the assumption that a spare move is never a liability, and whether a requirement that the argument identify an opening move is compatible with its working uniformly across the whole class of games. Tell me which single requirement does the most to narrow the class of games the argument covers, what becomes of the argument in a game that can end in a draw or in which a player would sometimes rather not move at all, and how the requirements differ for the mirror-image arguments that establish a second-player win. I also want to know what the argument can and cannot be asked to deliver about the strategy itself, given that it is an existence proof and not a construction. I mean to use the list as a checklist for separating real arguments of this kind from hand-waving, so keep the weight on the criteria and the cases behind them rather than on scoring any particular argument. Set it out as continuous prose, with no headings, bullet points, bold text, or tables — the way you would explain it in a letter.
reasoning: |-
  We are discussing a family of arguments in combinatorial game theory that establish that the first player has a winning strategy in a symmetric game without explicitly constructing one. The core of the argument is a strategy-stealing idea: if the second player had a winning strategy, then the first player could steal it by making an arbitrary opening move and then following the second player's strategy (with some adjustments). The goal is to set out the requirements that such an argument must satisfy to be valid, and to highlight potential pitfalls.

  The setting is a finite two-player game of perfect information with no chance moves. The winning condition is symmetric: it treats the two players identically. The argument proceeds by contradiction: assume the second player has a winning strategy, then show that the first player can use that to win, leading to a contradiction. Therefore, the first player must have a winning strategy.

  Let us outline the requirements for such an argument to be valid:

  1. **Symmetry of the Game**: The game must be symmetric in the sense that the roles of the two players are interchangeable. This means that the set of moves available from any position is the same for both players when it is their turn, and the winning condition does not favor one player over the other. Without this symmetry, the strategy-stealing idea fails. For example, in a game like Chess (which is not symmetric because White moves first and the pieces are arranged asymmetrically), this argument does not apply. But in a symmetric game like Hex (on a symmetric board) or Bridg-it, symmetry holds.

  2. **No Draws**: The game must be such that a draw is impossible. In other words, the game must terminate with a win for exactly one player. If draws are possible, then the contradiction might not arise: the second player having a winning strategy does not necessarily imply that the first player cannot force a draw or even win. For example, if the game can end in a draw, then the first player might only be able to force a draw even if the second player does not have a winning strategy. Therefore, we require that the game is determined and without draws: one player must win.

  3. **Extra Move is Never a Liability**: The argument relies on the idea that having an extra piece (or an extra move) on the board cannot hurt the player. That is, when the first player makes an extra move (the opening move) and then follows the second player's strategy, if at any point the strategy calls for a move that is no longer available (because the first player has already made a similar move or because the extra piece occupies a critical spot) then the first player can make an arbitrary move. The assumption is that having an extra piece of one's own color is never disadvantageous. This is crucial because if an extra move could be harmful (for instance, by blocking one's own winning path), then the stolen strategy might lead to a loss. Therefore, the game must satisfy that having an extra piece (or an extra move) of your own color is always at least as good as not having it. This is sometimes called the "pie rule" property or that the game is "monotonic" in some sense.

  4. **Finite and Terminating**: The game must be finite and have no infinite sequences of moves. This ensures that the game ends in a finite number of moves and that one of the players wins (given no draws). Without this, we cannot use the backward induction argument that every position is either a win for the first player to move, a win for the second, or a draw (which we have already excluded).

  5. **Existence of a Strategy for the Second Player**: The argument begins by assuming the second player has a winning strategy. We need the game to be such that if the second player has a winning strategy, then the first player can steal it. This requires that the game is sufficiently rich to allow the stealing to work. In particular, the strategy-stealing move must not break the symmetry in a way that the stolen strategy becomes inapplicable.

  Now, let us consider the gaps and potential problems:

  - **The Gap between "Second Player Cannot Win" and "First Player Wins"**: The argument by contradiction shows that the second player cannot have a winning strategy. However, in a finite, deterministic, perfect-information game with no draws, the fundamental theorem of combinatorial game theory (Zermelo's theorem) tells us that exactly one player has a winning strategy. Therefore, if the second player does not have a winning strategy, then the first player must. Thus, the argument relies on Zermelo's theorem to bridge this gap. Without the no-draw condition, this gap cannot be bridged.

  - **The Spare Move as a Liability**: We have already mentioned that the argument requires that an extra move is never a liability. But what if it is? Consider a game where placing an extra piece of your own color can block your own winning path. For example, in a variant of Tic-Tac-Toe on a larger board where having too many pieces might cause a loss, the argument would fail. Therefore, the argument is restricted to games where having more pieces (or extra moves) cannot harm.

  - **Identifying an Opening Move**: The argument does not identify a specific opening move. It says that the first player can make an arbitrary opening move and then follow the stolen strategy. Therefore, it does not construct a winning strategy but only proves existence. This is compatible with working uniformly across the class of symmetric games: we do not need to specify a move because we assume symmetry and the extra-move condition.

  - **Joint Satisfiability**: The most critical point is that the requirement of symmetry and the requirement that an extra move is never a liability must hold simultaneously. However, note that symmetry alone does not guarantee that an extra move is not a liability. For example, in a symmetric game where an extra move can block a critical path, the argument fails. Therefore, the argument is only valid for games that are both symmetric and satisfy the monotonicity condition (extra piece never hurts).

  The single requirement that most narrows the class of games is the condition that an extra move is never a liability. This is because many symmetric games do not satisfy this. For example, in the game of Nim with a symmetric starting position, if the starting position is balanced (so second player wins) then an extra move by the first player might break the balance and lead to a loss. But note: in Nim, the starting position is not symmetric in the sense that the strategy-stealing argument requires because the strategy-stealing would not work (the stolen strategy might call for a move that the first player cannot mimic exactly). Therefore, the argument is typically applied to connection games (like Hex) or other placement games where having an extra piece cannot hurt.

  In a game that can end in a draw, the argument does not work because the contradiction does not necessarily follow: the second player having a winning strategy (meaning they can force a win no matter what the first player does) does not prevent the first player from having a strategy that forces a draw. Therefore, without the no-draw condition, we cannot conclude that the first player wins.

  In a game where a player might not want to move (for instance, because moving might cause a loss and passing is not allowed), the argument still holds because the game requires moves until termination. But note: if passing were allowed, then the symmetry might break. However, in the standard setting, passing is not allowed.

  Now, for mirror-image arguments that establish a second-player win: these would be in symmetric games where the starting position is such that the second player can force a win. The same requirements would apply, but note that if the game is symmetric and without draws, then the first player cannot have a winning strategy (by the same strategy-stealing argument applied in reverse). However, the strategy-stealing argument for the first player win is more common because the extra move condition favors the first player. For a second-player win, we might use a different argument (like showing the starting position is a second-player win by symmetry). But if we try to use a strategy-stealing argument for the second player, we would run into the problem that the first player has an extra move. Therefore, the mirror-image argument for a second-player win would typically not use strategy-stealing but might rely on direct symmetry: if the first player makes a move, then the second player can mirror it and win. This requires a different kind of symmetry (like a board symmetry) and does not require the extra-move condition.

  Finally, what can the argument tell us about the strategy? It only proves existence. It does not construct the strategy. Therefore, we cannot ask it to deliver a specific strategy or even an opening move. However, it does tell us that every opening move can be part of a winning strategy (because the first player can win no matter what opening move is chosen). But note: the argument does not say that every opening move leads to a win. It says that there exists a winning strategy, and in particular, for any opening move, the first player can still win by following the stolen strategy appropriately. However, if the opening move is so bad that it blocks a critical path, then the stolen strategy might fail. This is why we require that the extra move is never a liability: it ensures that even if the opening move is arbitrary, the stolen strategy can be adapted (by making arbitrary moves when necessary) without causing a loss.

  In summary, the checklist for a valid strategy-stealing argument for a first-player win in a symmetric game is:

  - The game is symmetric (the board and rules are invariant under swapping the players).
  - The game is finite, deterministic, with perfect information, and without draws (so one player must win).
  - Having an extra piece of your own color on the board is never a disadvantage (monotonicity).
  - The strategy-stealing procedure is well-defined: after the first move, the first player can pretend to be the second player and use the stolen strategy, and whenever the strategy calls for a move that is not available (because of the extra piece), the first player can make an arbitrary move without causing a loss.

  The most critical requirement is monotonicity (extra piece never hurts). Without it, the argument fails. And note that this requirement is not implied by symmetry. Therefore, the argument applies only to a restricted class of symmetric games that also satisfy monotonicity.

  When examining an argument, check that the game satisfies all these conditions. If any one fails, the argument is hand-waving.
answer: |-
  To clarify the requirements for a strategy-stealing argument that establishes a first-player win in symmetric games without explicitly constructing a strategy, we must carefully delineate the necessary conditions and their justifications, drawing on the structure and pitfalls of such proofs. The core of the argument, as you describe, assumes the second player has a winning strategy and derives a contradiction by having the first player "steal" that strategy after an arbitrary opening move, with the critical assumption that an extra piece or move cannot harm the first player. For this to hold, several interdependent requirements must be satisfied, each grounded in specific combinatorial properties and potential counterexamples. The aim is to ensure the argument is not merely plausible but logically watertight, avoiding contradictions with known results or misapplication to unsuitable games.

  First, the game must exhibit perfect symmetry between the players. This means the rules, board, and winning conditions are invariant under swapping the players' roles. For instance, in Hex or Bridg-it, the board is symmetric, and the winning condition (connecting opposite sides) is identical for both players. If symmetry is violated—as in Chess, where piece roles differ—the argument fails because stealing the strategy would not map moves correctly. Symmetry ensures that the second player's strategy, if it exists, remains meaningful when mimicked by the first player after the opening move. Without this, the stolen strategy might reference asymmetric elements, breaking the analogy. This requirement is genuine and non-negotiable; it is the bedrock of the strategy-stealing premise.

  Second, the game must be finite, deterministic, and have no draws. Finiteness guarantees termination, determinism means no chance elements, and the no-draw condition ensures every terminal position awards a win to one player. This trio is essential because the argument relies on Zermelo's theorem, which states that in such games, exactly one player has a winning strategy. The contradiction—showing the second player cannot have a winning strategy—thus implies the first player must. If draws were possible, as in Tic-Tac-Toe on a sufficiently large board, the non-existence of a second-player winning strategy would not prove a first-player win; it might indicate a draw is achievable. Similarly, infinite games might lack a winning strategy altogether. This requirement is genuine and narrows the scope significantly; it excludes many common games like Chess or Go, which can end in draws or stalemates.

  Third, the "spare move is never a liability" assumption must hold: after the first player's arbitrary opening move, any position arising from following the stolen strategy must be at least as favorable to the first player as it would be to the second player in the original scenario. Concretely, if the stolen strategy prescribes a move now impossible due to the first player's extra piece, the first player can make an arbitrary move without risking a loss. This is justified by the idea that an extra piece of one's own color cannot hinder one's position—it might help or be neutral. This monotonicity property is critical and often the weakest link. For example, in Hex, placing an extra stone cannot block your own path to victory, as the winning condition is about connection and the stone only aids connectivity. But in a game like Kayles (a bowling-pin game), an extra move might create an isolated group that the opponent can exploit, turning it into a liability. This requirement is genuine and stringent; it excludes symmetric games where moves can overcommit or clog the board, and it is the primary reason the argument fails for games like Nim on symmetric heaps if the extra move disrupts balance.

  Now, regarding the gap between "second player cannot win" and "first player wins": the argument must bridge this via Zermelo's theorem, as mentioned. The contradiction disproves a second-player winning strategy, but without the no-draw condition, this does not entail a first-player win. The argument thus implicitly depends on the game being a strict win-loss contest. This is a genuine requirement, as overlooking it would allow false positives in drawable games. For instance, in a symmetric variant of Chomp on a rectangle, the standard strategy-stealing argument shows the first player wins—but this holds only because Chomp cannot end in a draw; if it could, the conclusion might not follow.

  On the matter of identifying an opening move: the argument does not and cannot specify one, as it uses an arbitrary first move. This is compatible with uniformity across the class of games, as it relies on the universal quantifier—"for any opening move, the stolen strategy can be adapted." However, it requires that every possible opening move is non-detrimental under the spare-move assumption. If a particular move could be harmful (e.g., in a game where some moves self-sabotage), the argument would fail, but the spare-move assumption precludes this. Thus, while the argument works uniformly, it demands that the spare-move condition holds uniformly for all moves. This is feasible but constraining.

  The most narrowing requirement is the spare-move immunity, as it demands a form of monotonicity rare in combinatorial games. Many symmetric games (e.g., impartial games like Nim) lack this, as an extra move can disrupt equilibrium. For instance, in a symmetric Nim position, the second player might win by mirroring, but if the first player adds a stone arbitrarily, it could unbalance the position and lead to a loss—violating the assumption. Only connection or territory games with positive externalities for one's own pieces typically satisfy this.

  For games ending in draws or with preferences against moving, the argument collapses. If draws are possible, the contradiction vanishes, as explained. If a player might prefer not to move (e.g., in a game like Mu Torere, where moving can be forced but is sometimes disadvantageous), the spare-move assumption is undermined: the first player's extra move could force them into a losing path. The argument requires that players must move when possible and that moving is never inherently harmful—only the board state matters. Thus, it cannot handle games with move-aversion without modification.

  For mirror-image arguments proving a second-player win, the requirements shift. Such arguments typically use direct symmetry: after the first player moves, the second player mirrors it across a symmetry axis and maintains equality. This requires strict positional symmetry (e.g., a board invariant under reflection) but not spare-move immunity, as no extra move is involved. However, it must satisfy the same finiteness, determinism, and no-draw conditions. Crucially, it avoids strategy-stealing and thus sidesteps the spare-move assumption, making it applicable to more symmetric games (e.g., Skak or symmetric Nim).

  On what the argument can deliver about the strategy: it proves existence non-constructively. It cannot specify moves beyond the opening, nor guarantee efficiency or simplicity. It shows that a winning strategy exists but provides no insight into its structure. This suffices for existence claims but not for analysis or algorithm design. The argument must not be asked to characterize the strategy; it is purely existential.

  Finally, two requirements that may seem jointly unsatisfiable are the spare-move immunity and the compatibility with all symmetric games. Many symmetric games lack monotonicity, so the argument applies only to a subset. However, within that subset (e.g., Hex), they are compatible. A genuine tension arises if the game allows moves that are sometimes beneficial and sometimes harmful; the spare-move assumption requires uniform non-harm, which may not hold. But this is a limitation of the game class, not the argument.

  In sum, to separate rigorous instances from hand-waving, verify: symmetry, finiteness/determinism/no-draws, spare-move immunity, and reliance on Zermelo's theorem for the win-gap. The spare-move condition is the litmus test; its failure invalidates the argument. Use this to scrutinize claims: if a symmetric game has draws or harmful extra moves, the argument cannot hold.
