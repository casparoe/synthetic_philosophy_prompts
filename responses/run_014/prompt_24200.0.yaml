answer: |-
  Below is a decision procedure for evaluating patent applications claiming second-law violations via "information engines." The procedure is a fixed sequence of questions, designed to be run solely from the application's description. It forces you to fill in an explicit ledger first, then proceeds step-by-step. **Key features**:
  - **Ledger**: Must be completed before any questions. Ensures all critical components are explicitly defined. Omitting any field may force a referral.
  - **Terminals**: 
    - **Clean "no"**: The claim is physically impossible (application fails).
    - **Refer to specialist**: Accounting is incomplete, or the claim depends on untracked resources, disputed physics, or non-cyclic operations.
  - **Landauer bound**: Explicitly stated as "erasing one bit at temperature \(T\) requires dissipating at least \(kT \ln 2\) of heat to a bath at temperature \(T\) (or higher)." This is non-negotiable unless disputed (see misfire cases).
  - **Misfires and judgment calls**: Flagged at relevant steps. Common pitfalls:
    - Untracked resources (e.g., pre-existing correlations, non-equilibrium baths, quantum effects).
    - Non-cyclic operations (violation claims ill-formed).
    - Disputed Landauer bound (e.g., quantum regimes).
  - **Output**: For each terminal, the action is specified.

  ---

  ### **Ledger (Complete Before Proceeding)**
  Fill this table using the application's description. If a field is unspecified, note "unspecified" – this may cause a referral later.

  | **Ledger Field** | **Specification** | **Why Dropping Causes Misfire** |
  |------------------|-------------------|--------------------------------|
  | **System** | Physical system the device acts on (e.g., particle in a box, molecular switch). | Without this, energy/information flows cannot be tracked. |
  | **Controller/Demon** | Entity that measures and controls the system (e.g., feedback circuit, nanoscale sensor). | Distinguishes open-loop (no info) vs. feedback (info-dependent) engines. |
  | **Memory** | <ul><li>**Capacity**: Bits/qubits of storage.</li><li>**Reset**: Is memory erased per cycle? (Yes/No)</li><li>**Entropy disposal**: Where does erased information entropy go? (e.g., "to bath at \(T\)")</li></ul> | Dropping reset/disposal misses Landauer costs. Unreset memory limits cycle count. |
  | **Heat Baths** | <ul><li>**Number**: How many baths?</li><li>**Temperatures**: For each bath.</li></ul> | Essential for entropy accounting (e.g., Clausius/Kelvin violations require temperature gradients). |
  | **Operation** | <ul><li>**Cyclic**: System returns to initial state after each run? (Yes/No)</li><li>**Open-loop/Feedback**: Is control based on measurements? (Yes/No)</li></ul> | Non-cyclic operations invalidate cyclic violation claims. Open-loop devices cannot claim info advantages. |
  | **Claimed Output** | <ul><li>**Work/Heat**: Quantities extracted/dissipated.</li><li>**Second Law Violation Claimed**: Clausius (heat from cold to hot without work), Kelvin-Planck (work from single bath), or total entropy (decrease in \( \Delta S_{\text{total}} \)).</li></ul> | Different violations have distinct criteria (e.g., Kelvin-Planck vs. total entropy). |

  ---

  ### **Decision Procedure**
  **Order**: Ask questions sequentially. Do not skip. If a step forces a terminal, stop and act.  
  **Notation**:  
  - ✅ = Clean "no" (claim impossible, application fails).  
  - ⚠️ = Refer to specialist (accounting incomplete, untracked resource, or disputed physics).

  1. **Is the operation cyclic?**  
     - **Sufficient answer**: "Yes" if system + controller + memory return to initial state per application. Else "no."  
     - **➥ If no**:  
       - Claimed **cyclic violation** is ill-formed.  
       - ✅ Terminal: **Clean "no"** for cyclic violation claim.  
       - *But*: If the applicant claims a **one-shot violation** (non-cyclic), this is ⚠️ **Refer to specialist** – one-shot thermodynamics is unsettled.  
     - **➥ If yes**: Proceed to Q2.  
     - **Judgment call**: "Initial state" may be ambiguous (e.g., does it include memory content?). Resolve by application's description.  
     - **Misfire**: If operation is cyclic but relies on untracked initial correlations (see Q6).

  2. **Does the controller use feedback (measurement-based control)?**  
     - **Sufficient answer**: "Yes" if control depends on measurements (e.g., "demons"). Else "no."  
     - **➥ If no**: Device is not an "information engine"; it cannot leverage information for advantage.  
       - ✅ Terminal: **Clean "no"** – info-based violation claim fails.  
     - **➥ If yes**: Proceed to Q3.  
     - **Misfire**: If feedback is quantum (e.g., superposition measurements), classical accounting fails (see Q6).

  3. **Is the memory reset during the cycle?**  
     - **Sufficient answer**: "Yes" if memory is erased/reinitialized. Else "no."  
     - **➥ If no**: Proceed to Q3a.  
     - **➥ If yes**: Proceed to Q4.  
     - **Judgment call**: "Reset" must be explicit (e.g., "memory cleared" vs. "memory reused as-is").

  4. **Question 3a (if memory not reset): Is the memory finite?**  
     - **Sufficient answer**: "Yes" if capacity is bounded (e.g., "N-bit memory"). "No" only if application asserts infinite memory.  
     - **➥ If no**:  
       - Infinite memory is unphysical.  
       - ✅ Terminal: **Clean "no"** – device requires infinite resource.  
     - **➥ If yes**:  
       - Finite memory will saturate after \(N\) cycles, halting indefinite operation.  
       - ✅ Terminal: **Clean "no"** – claim of **indefinite operation** (e.g., "perpetual work extraction") is impossible.  
     - **Misfire**: If memory is quantum (e.g., holographic), capacity may not be classically bounded. Flag in referral.

  5. **Question 4 (if memory reset): Is the Landauer cost fully accounted for?**  
     - **Landauer bound**: Erasing one bit at temperature \(T\) dissipates \(\geq kT \ln 2\) heat to a bath \(\geq T\).  
     - **Sufficient answer**: "Yes" only if:  
       - Application explicitly includes heat dissipation during reset.  
       - Dissipated heat \(\geq kT \ln 2\) per bit erased.  
       - Heat dumped to a bath at temperature \(\geq T\) (where \(T\) is temperature at erasure).  
     - **➥ If no**:  
       - Landauer cost is missing.  
       - ✅ Terminal: **Clean "no"** – accounting incomplete.  
     - **➥ If yes**: Proceed to Q5.  
     - **Misfire**: If Landauer bound is disputed (e.g., quantum coherence, atomic-scale systems). ⚠️ Flag in referral (see Q6).  
     - **Judgment call**: "Accounted" means quantified in heat terms. Vague statements (e.g., "entropy exported") are insufficient.

  6. **Are there untracked physical resources?**  
     Check ledger for:  
     - Pre-existing correlations (system-demon initial correlation).  
     - Non-equilibrium baths (e.g., driven reservoirs, non-thermal states).  
     - External fields (e.g., gravity, EM fields) doing work.  
     - Quantum resources (e.g., entanglement, coherence, back-action).  
     - **Sufficient answer**: "None" if all resources are accounted (e.g., correlations included in entropy math). Else list resources.  
     - **➥ If any untracked resource**:  
       - Accounting is incomplete.  
       - ✅ Terminal: **Clean "no"** – violation claim invalid.  
     - **➥ If none**: Proceed to Q6.  
     - **Misfire**: Quantum resources may be misidentified as classical (e.g., "measurement" without back-action). ⚠️ If suspected, referral is safer.  
     - **Judgment call**: "Tracked" means explicit in application's energy/entropy balances.

  7. **After full accounting, does the device violate the second law?**  
     - Use ledger to compute \(\Delta S_{\text{total}} = \Delta S_{\text{system}} + \Delta S_{\text{demon}} + \Delta S_{\text{baths}}\).  
       - Cyclic operation \(\implies \Delta S_{\text{system}} + \Delta S_{\text{demon}} = 0\).  
       - \(\Delta S_{\text{baths}} = -\sum \frac{Q_i}{T_i}\) (heat \(Q_i\) dumped to bath at \(T_i\)).  
     - **Sufficient answer**:  
       - "Violates total entropy" if \(\Delta S_{\text{total}} < 0\).  
       - "Violates Clausius/Kelvin" but \(\Delta S_{\text{total}} \geq 0\) – this is possible (e.g., naive reading fails, but total law holds).  
       - "No violation" if \(\Delta S_{\text{total}} \geq 0\).  
     - **➥ If violates Clausius/Kelvin but \(\Delta S_{\text{total}} \geq 0\)**:  
       - Only a "naive" violation, not fundamental.  
       - ✅ Terminal: **Clean "no"** – total entropy non-decreasing.  
     - **➥ If no violation (\(\Delta S_{\text{total}} \geq 0\))**:  
       - ✅ Terminal: **Clean "no"** – device complies.  
     - **➥ If violates total entropy (\(\Delta S_{\text{total}} < 0\))**:  
       - ⚠️ Terminal: **Refer to specialist** – likely incomplete accounting or exotic physics.  
     - **Misfire**: If baths are non-equilibrium (bypassed Q5), \(\Delta S_{\text{baths}}\) calculation fails.  
     - **Judgment call**: Entropy calculations rely on application's claimed values. If inconsistent, use Q5 to reject.

  ---

  ### **What the Procedure Cannot Do**
  - **Evaluate quantum information engines**: Quantum resources (e.g., entanglement, coherence) are not captured in the classical ledger.  
  - **Handle one-shot or non-cyclic claims**: The second law is only well-defined for cyclic processes in this procedure.  
  - **Resolve disputed physics**: E.g., Landauer bound in quantum regimes or gravitational/relativistic effects.  
  - **Compensate for incomplete applications**: Unspecified ledger fields often hide critical flaws.  
  - **Replace domain expertise**: Specialist referral is required for ⚠️ cases, legal nuances, or novel physics.

  ---

  ### **Running the Procedure on Example Applications**
  #### **Example 1: Szilard-Style Single-Particle Engine**
  - **Claim**: Extracts \(kT \ln 2\) work per cycle from one bath. Violates Kelvin-Planck.  
  - **Ledger**:
    - **System**: Particle in a box (two halves).  
    - **Controller/Demon**: Measures which half particle occupies; inserts paddle.  
    - **Memory**: 1-bit (e.g., "left/right"). Reset each cycle. Entropy disposal: Unspecified.  
    - **Heat Baths**: One bath at \(T\).  
    - **Operation**: Cyclic, feedback-controlled.  
    - **Claimed Output**: \(W = kT \ln 2\) per cycle. Violates Kelvin-Planck.  

  - **Procedure Path**:  
    1. **Q1**: Cyclic? Yes → Q2.  
    2. **Q2**: Feedback? Yes → Q3.  
    3. **Q3**: Memory reset? Yes → Q4.  
    4. **Q4**: Landauer cost accounted?  
       - Application typically omits erasure cost (entropy disposal "unspecified").  
       - ➥ **No** → ✅ **Clean "no"**.  
  - **Terminal**: Claim impossible. Application fails.  
  - **Action**: Reject due to incomplete accounting (Landauer cost missing).

  ---

  #### **Example 2: Reversible-Computing Demon with Finite Memory**
  - **Claim**: Extracts work indefinitely from one bath without erasure costs.  
  - **Ledger**:  
    - **System**: Computational substrate (e.g., tape of bits).  
    - **Controller/Demon**: Reversible computer (e.g., Toffoli gates).  
    - **Memory**: Finite capacity (e.g., \(N\) bits). Never reset. Entropy disposal: N/A (no erasure).  
    - **Heat Baths**: One bath at \(T\).  
    - **Operation**: Cyclic, feedback-controlled.  
    - **Claimed Output**: Indefinite work extraction. Violates Kelvin-Planck.  

  - **Procedure Path**:  
    1. **Q1**: Cyclic? Yes (system resets; memory state changes but reusability claimed) → Q2.  
    2. **Q2**: Feedback? Yes → Q3.  
    3. **Q3**: Memory reset? No → Q3a.  
    4. **Q3a**: Memory finite? Yes → ✅ **Clean "no"**.  
  - **Terminal**: Claim of **indefinite operation** impossible (finite memory saturates).  
  - **Action**: Reject. Despite credible applicant, physics forbids indefinite operation.  
  - **Note**: If applicant appeals, specialist review may confirm, but procedure is robust here.

  ---

  #### **Example 3: Work Harvesting from Pre-Existing Correlation**
  - **Claim**: Extracts work from initial demon-system correlation (no reset).  
  - **Ledger**:  
    - **System**: Particles with position correlated to demon.  
    - **Controller/Demon**: Uses correlation to extract work.  
    - **Memory**: Stores correlation. Not reset. Entropy disposal: Unspecified.  
    - **Heat Baths**: One bath at \(T\).  
    - **Operation**: Cyclic? Application claims "cyclic," but initial correlation is consumed and not restored → **Not cyclic** (system returns, but correlation lost).  
    - **Claimed Output**: Work from one bath. Violates Kelvin-Planck.  

  - **Procedure Path**:  
    1. **Q1**: Cyclic?  
       - Demon and system not in initial state (correlation consumed).  
       - ➥ **No** → ✅ **Clean "no"** for cyclic violation.  
  - **Terminal**: Cyclic claim ill-formed.  
  - **Action**: Reject. If applicant claims one-shot violation, refer to specialist (⚠️).  

  ---

  ### **Final Summary**
  **Procedure Outputs**:  
  - ✅ **Clean "no"**: For missing Landauer costs, finite memory saturation, unphysical resources, or non-cyclic claims. Application fails.  
  - ⚠️ **Refer to specialist**: For quantum effects, one-shot claims, disputed Landauer bound, or negative \(\Delta S_{\text{total}}\) after accounting.  

  **What It Cannot Do**:  
  - Handle quantum information, one-shot thermodynamics, or disputed physics.  
  - Compensate for vague applications (unspecified ledger fields often hide fatal flaws).  
  - Overrule fundamental physics: Total entropy never decreases in classical cyclic processes.  

  Use this procedure rigorously, but escalate ⚠️ cases – some claims push the boundaries of settled science.
