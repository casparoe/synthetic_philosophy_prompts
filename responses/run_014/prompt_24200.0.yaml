  We are designing a decision procedure for patent examiners to evaluate claims of second-law violations in "information engine" applications. The procedure is a fixed sequence of questions that the examiner must answer based solely on the application's description. The goal is to determine whether the claimed device genuinely violates the second law or if the accounting is incomplete.

  The ledger must be filled explicitly for every application. It includes:
  - System: The physical system on which the device operates.
  - Controller/Demon: The entity that measures and controls the system.
  - Memory: The memory used by the demon, including its capacity, whether it is reset, and where the entropy of erased information goes (if erased).
  - Heat baths: How many, and at what temperatures.
  - Operation: Cyclic or one-shot? Open-loop or feedback?
  - Claimed output: What work or heat transfer is claimed? Which statement of the second law is claimed to be violated (Clausius, Kelvin-Planck, total-entropy form)?

  We explicitly state the Landauer bound: Erasing one bit of information at temperature T must dissipate at least kT ln 2 of heat.

  The procedure is designed to catch common mistakes. However, we must note that if the device uses resources not tracked in the ledger (like pre-existing correlations, non-equilibrium reservoirs, quantum resources, etc.), the procedure may misfire. Also, for non-cyclic operations, claims of cyclic violations are ill-formed. And in regimes where the Landauer bound is disputed, we note that the procedure relies on the settled form.

  Steps of the procedure:

  1. **Ledger Filling**: The examiner must fill in the ledger as described above, based solely on the application. If the application does not specify any of these, the examiner must note "unspecified" and proceed, but this may lead to a referral.

  2. **Question 1: Is the operation cyclic?**
     - If no, then the claim of a cyclic second-law violation is ill-formed. The procedure stops with a clean "no" for a cyclic violation. However, the application might be claiming a one-shot violation, which is a different matter and must be referred to a specialist (because the second law is usually stated for cyclic processes and one-shot extensions are complex).
     - If yes, proceed.

  3. **Question 2: Does the device use a feedback controller (demon) that makes measurements?**
     - If no, then the device does not use information and cannot be an information engine. The procedure stops with a clean "no" for an information-based violation. (But note: it might still be a violation by other means, which would be a different claim and might be impossible. However, without information, the standard second law applies without the information caveat.)
     - If yes, proceed.

  4. **Question 3: Does the memory get reset during the cycle?**
     - If no, then the memory is not being reused and the Landauer cost does not apply in the cycle. However, if the memory is finite and not reset, it will eventually fill up. The procedure must then check if the memory is infinite (which is unphysical) or finite. If finite, then the device cannot run indefinitely without resetting the memory. Proceed to Question 3a.
     - If yes, then the reset step must account for the Landauer cost. Proceed to Question 4.

     **Question 3a (if memory not reset): Is the memory finite?**
        - If yes, then the device cannot run indefinitely without resetting the memory. The claimed indefinite operation is impossible. The procedure stops with a clean "no": the device as described cannot achieve the claimed indefinite operation because the memory will eventually fill. (Note: the applicant might claim that the memory is large enough for practical purposes, but the second law violation claim for indefinite operation fails because of the finite memory constraint.)
        - If no (infinite memory), then we have an unphysical resource (infinite memory). The procedure stops with a clean "no" because the device relies on an unphysical component. (In practice, we cannot have infinite memory.)

  5. **Question 4 (if memory is reset): Is the Landauer cost for resetting the memory accounted for in the heat dissipation?**
     - The Landauer bound: erasing one bit at temperature T requires at least kT ln 2 of heat to be dissipated to a heat bath at temperature T (or higher, but at least at T). The reset must be done by interacting with a heat bath at some temperature.
