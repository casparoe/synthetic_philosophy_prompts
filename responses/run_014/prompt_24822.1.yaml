  The core tension they're wrestling with is: when does inference become "entitled" (conventionalized) versus purely contextual? Their rejection of "can" in salt-requests as having ability-implicatures shows particular insight – they recognize institutionalized indirect speech acts bypass compositional meaning entirely.

  For the "I'm not saying he's guilty" example, I immediately think of two layers: the literal denial of utterance act (no guilt-claim made) plus the negative space implicature (possibly implying incompetence or other accusations). The user seems to want a framework that explains why this case feels different from their "doctor" relevance example. 

  Their intuition about "I think I passed" not being implicature is spot-on – it's a sincerity condition issue, not pragmatic enrichment. But they might be overlooking how epistemic modals ("might", "probably") can generate implicatures in other contexts. 

  The unifying principle needs to handle:
  - Conventionalized inferences (Gricean generalized implicatures)
  - Utterance-type norms (like disjunctive permissions)
  - Relevance-driven inferences
  - Institutional speech acts
  While excluding:
  - Compositional meaning
  - Speaker's private intentions
  - Non-detachable inferences

  I consider mentioning Recanati's availability principle or Levinson's presumptive meanings, but worry that might overcomplicate. The cancellability test they already use implicitly ("and in fact all did") remains the most accessible tool. 

  For their unlisted example, the key is recognizing metalinguistic negation. "Not saying X" rarely concerns the speech act itself – it implicates the speaker believes X is unsayable/unprovable/too damaging to utter. This contrasts with their "doctor" example where relevance is the driver. 

  Their verdicts mostly hold up. The only potential adjustment is reconsidering disjunctions: while "or" permissions don't imply mutual exclusion, "A or B" in descriptive contexts ("he's in Boston or NY") often carries an exclusivity implicature. But their permission example correctly resists this because deontic modals change the game. 

  Ultimately they're seeking cognitive rhythm – when do listeners automatically "hear" implicatures versus constructing them? The answer lies in entrenchment: inferences baked into lexical items (like "some") or speech act conventions (requests) feel immediate, while relevance inferences require more work. Their salt example proves this – no English speaker processes "can you" literally in that context after age 5.
answer: |-
  Your intuitions align remarkably well with Gricean pragmatics, and a unified principle **can** capture most cases: **Implicatures arise when the literal meaning violates a conversational maxim *unless* the hearer infers an additional proposition.** Crucially, implicatures are **cancellable, calculable, and non-detachable** inferences, distinct from both the literal meaning ("what is said") and direct speaker meaning.

  Here's the breakdown using your examples and the principle:

  1.  **"Some of the students passed" (implicates "Not all passed")**:
      *   **Violation:** Literally saying "some" is true if "all" is true, making it *less informative* than required (violating Maxim of Quantity).
      *   **Inference:** If the speaker knew "all" passed, they *should* have said so to be maximally informative. Since they didn't, they must believe "all" did *not* pass.
      *   **Result:** Implicature "Not all passed" is inferred to satisfy the maxims.
      *   **Cancellability:** Confirmed by "...and in fact, all of them did."

  2.  **"You may bring a dog or a cat" (No "not both" implicature)**:
      *   **No Violation:** The literal meaning is perfectly informative and relevant regarding permissions. Adding "but not both" would be *more* informative, but failing to provide *maximal* information (Quantity) isn't a violation *if* the speaker lacks the knowledge or intention to restrict it further. Here, the speaker simply grants permission for each option without specifying combinability.
      *   **No Necessary Inference:** There's no conversational problem to solve by inferring "not both". The utterance fulfills its purpose as is.
      *   **Result:** No implicature arises. Interpretation depends on context/world knowledge (e.g., party rules, pet compatibility).

  3.  **"I don't know whether it's raining or not" (No "not both" implicature)**:
      *   **Violation? Different Reason:** Unlike permissions, "or" in factual contexts often *can* implicate mutual exclusivity ("He's in Boston or New York" often implicates he's not in both). However, here the ignorance claim ("I don't know whether P or Q") explicitly blocks any inference about the truth of P or Q, including their compatibility.
      *   **Blocked Inference:** The speaker explicitly states they lack the knowledge required to make *any* assertion about the state of the weather, including whether the possibilities are exclusive. Inferring "not both" would contradict the stated ignorance.
      *   **Result:** The explicit ignorance context suspends any potential implicature related to the disjunction itself.

  4.  **"He's a doctor" (in answer to "How's your health?")**:
      *   **Violation:** The literal answer seems irrelevant (violating Maxim of Relation).
      *   **Inference:** The hearer assumes the speaker *is* being relevant. Therefore, the speaker must believe the fact that "he's a doctor" *is relevant* to the question about health. The most obvious relevance link is that the doctor is *treating* the speaker for a health issue.
      *   **Result:** Implicature "I am seeing him professionally about my health" arises to satisfy Relation. It's *not* part of the meaning of "doctor".
      *   **Cancellability:** "...but I'm not seeing him professionally; I just admire his career." (The cancellation might sound odd, confirming the implicature was present).

  5.  **"Can you pass the salt?" (Means "Please pass the salt")**:
      *   **Violation:** Literally asking about ability is irrelevant/obvious in context (violating Relation and possibly Quantity - it's underinformative for the presumed goal).
      *   **Inference:** The speaker must intend something else relevant to the situation. The obvious relevant goal is requesting the salt.
      *   **Result:** This is a **standardized (conventionalized) indirect speech act**. While originally an implicature, it's become so conventional that speaker meaning *directly* maps to the request. The implicature from "can" (ability) is effectively bypassed entirely in favor of the direct request meaning. You're right that no implicature *about ability* is inferred; the whole utterance is interpreted as a directive.

  6.  **"I passed the exam" (Speaker means "I think I passed")**:
      *   **Violation:** None. Saying "I passed" when you only believe you passed violates the **Maxim of Quality** (saying something for which you lack adequate evidence). This is a **lie** or **misrepresentation**, not an implicature.
      *   **No Calculable Implicature:** The hearer has no rational basis *from the maxims* to infer "He only thinks he passed" from "I passed". The speaker is simply not adhering to Quality. The speaker *means* "I think I passed" but *says* "I passed". This is a case of **saying one thing but meaning something different**, driven by the speaker's failure to cooperate (Quality violation), not by the hearer inferring an implicature to *presume* cooperation.
      *   **Result:** This is **speaker meaning** differing from **what is said**, not an implicature. Implicature relies on the *assumption* of cooperation; here, the speaker is uncooperative regarding Quality.

  **The Principle & Your Verdicts:** The Gricean principle (implicatures arise to resolve maxim violations under the assumption of cooperation) captures your verdicts well: it explains the presence of implicatures in (1) and (4), the absence in (2), the suspension in (3), and the conventionalization in (5). It correctly identifies (6) as a Quality violation (misrepresentation), not implicature. Your intuitions are largely consistent.

  **The New Case: "I'm not saying that he's guilty."**

  1.  **What is said:** The speaker is explicitly denying making the utterance "He is guilty."
  2.  **Potential Violation/Inference:** Why mention what you're *not* saying? This seems potentially irrelevant or uninformative (violating Relation/Quantity) *unless* the hearer infers something more.
  3.  **Likely Implicature:** The most natural inference is that the speaker **believes he *is* guilty** (or at least suspects it strongly), but has reasons not to state it outright (e.g., lack of proof, legal caution, politeness). Denying the *utterance* often implies the *belief* is held.
      *   *Cancellability Test:* "...I'm not saying he's guilty; in fact, I think he's completely innocent." This cancellation feels natural, confirming the inference ("he might be guilty") was an implicature, not part of what was said.
  4.  **Result:** "I'm not saying that P" frequently implicates "But I believe P might be true/I suspect P" or "There is reason to suspect P". The implicated content resolves the potential irrelevance of denying an utterance no one necessarily accused you of making.

  **Does this force you to drop any verdict?** No. The analysis of "I'm not saying he's guilty" fits the principle perfectly: a potential violation of Relation/Quantity is resolved by inferring the speaker likely harbors the belief they are refusing to state. This reinforces your correct analysis of cases like (1), (4), and (5), and distinguishes them from (6). Your verdict on (6) is correct: it's a Quality violation (misrepresentation), not implicature generation.

  **In summary:** Your gut intuitions are largely explained by Grice's Cooperative Principle and conversational maxims. Implicatures are pragmatic inferences triggered to resolve apparent violations of conversational norms, assuming the speaker is being cooperative. They are distinct from literal meaning, direct speaker meaning (especially when it violates Quality), and conventionalized indirect speech acts. The principle validates your judgments and provides a framework for analyzing new cases like "I'm not saying...".
