  Okay, the user is dealing with a complex issue on their grants panel regarding scoring methods. They're confused about an engineer's claim that summing individual scores is the only defensible method to ensure unanimity. The engineer argues that if all members prefer A over B, the panel should rank A higher, and summing scores is the only way to guarantee that. The user has two main concerns: one member dominates the scores by giving extreme ratings, and the panel now averages probability estimates, which a new member says undermines the engineer's argument.

  First, I need to recall Arrow's Impossibility Theorem. Arrow's theorem states that no voting system can satisfy all fairness criteria when there are three or more options. The engineer's unanimity requirement is similar to Arrow's Pareto efficiency. But Arrow's theorem shows that it's impossible to have a system that always respects unanimity and avoids dictatorship while handling all possible preference profiles. So the engineer's claim that summing is the only way is flawed because Arrow's theorem implies no perfect system exists.

  The user mentioned that one member gives 100 to their subfield and 20 to others, leading to domination. This highlights that summing scores doesn't prevent strategic voting or extreme biases. While the engineer's argument assumes honest scoring, in practice, people might game the system. Arrow's theorem's non-dictatorship criterion is violated here because that one member's scores dictate the outcome.

  Regarding the new member's point about averaging probabilities: when the panel averages probability estimates, they're aggregating beliefs, not preferences. The engineer's argument was about preferences (ranking projects), but probabilities are about estimating likelihoods. Averaging probabilities is a method to combine different estimates into a collective belief, which is different from ranking based on preferences. So the new member is correct that mixing these two—using summed scores for preferences and averaged probabilities—introduces inconsistency. The panel is now using different aggregation methods for different aspects, which might not align with the unanimity principle the engineer emphasized.

  The user might be missing that the engineer's argument assumes individual scores represent cardinal preferences (strength of preference), not just ordinal rankings. But in reality, people interpret scores differently, leading to interpersonal utility comparison issues. The new member's observation points out that once you average probabilities, you're treating members as estimators of truth, not as voters expressing preferences, which conflicts with the preference aggregation framework.

  In conclusion, the engineer's argument is valid under strict assumptions (honest cardinal utilities, no interpersonal comparison issues), but those assumptions don't hold in practice. Arrow's theorem shows the impossibility, and real-world issues like strategic voting and differing score interpretations break the model. The new member is right that averaging probabilities shifts from preference aggregation to belief aggregation, making the engineer's unanimity argument less applicable. The user needs to recognize that no system is perfect, and procedural choices involve trade-offs between fairness, strategy-proofness, and practicality.
answer: |-
  You've hit on a profound debate in social choice theory, and the engineer's argument is clever but ultimately flawed. It relies on a specific interpretation of "preference" that doesn't hold up under scrutiny. Here's the breakdown:

  **1. The Engineer's Argument (And Its Core Flaw):**

  *   **The Claim:** "If all seven prefer A > B, the panel *must* rank A > B. Any rule violating this unanimity is indefensible. Summing scores guarantees this. Therefore, summing is the only defensible method."
  *   **The Flaw:** This argument confuses **cardinal scores** with **ordinal preferences**. It makes a hidden, critical assumption:
      *   **Assumption:** Each member's score *perfectly represents* their **cardinal utility** for the project, *and* these utilities are **interpersonally comparable** meaning a "70" from Alice means the same strength of preference as a "70" from Bob).

  *   **Why This Assumption Fails in Practice (and in Theory):**
      *   **Different Scales:** Alice might be stingy, scoring her favorite project ever as 85. Bob is generous, scoring mediocre projects as 90. Their "70s" don't mean the same thing.
      *   **Different Interpretations:** Does 50 mean "average"? "Barely fundable"? "Complete neutrality"? Panelists rarely calibrate identically.
      *   **Interpersonal Comparison Impossibility:** There's no objective way to say Alice's "disappointment" at losing a project she scored 80 is equivalent to Bob's disappointment for a project he scored 80. Utility is subjective.
      *   **Arrow's Impossibility Theorem (The Nuclear Bomb):** Kenneth Arrow mathematically proved that *no* voting system (with 3+ options) can simultaneously satisfy a few basic, reasonable-sounding conditions (including Unanimity and Non-Dictatorship) without being a dictatorship. **Summing scores violates Arrow's "Independence of Irrelevant Alternatives" (IIA) condition.** How well A scores compared to B *shouldn't* depend on how C scored. But with summing, if a new project C gets an extreme score from one voter, it can change the relative *difference* between A and B's totals, potentially flipping their ranking *even if no individual changed their A/B scores or preferences*. This is a fatal blow to the claim that summing is the "only" defensible method. It fails a fundamental test of fairness.

  **2. Why the "Steamrolling" Happens (and Why it Matters):**

  *   The engineer is correct that summing *can* satisfy unanimity *if* everyone scores honestly using the same cardinal scale. But that "if" is massive.
  *   Your colleague using 100/20 isn't just expressing preference; they are **strategically manipulating** the system precisely *because* they understand the properties of summation. They are exploiting the **interpersonal comparison** flaw.
  *   This highlights the difference between **preference intensity** and **ranking**. The steamroller cares *intensely* about their subfield and weakly about others. Summing *amplifies* this intensity difference. Other systems (like ranking/ordinal voting) deliberately *ignore* intensity to prevent exactly this kind of manipulation or disproportionate influence. The engineer's argument assumes honest cardinal utility expression, but real-world scoring is often strategic or inconsistent.

  **3. The New Member is Spot On About Averaging Probabilities:**

  *   This is where the engineer's logic completely unravels. The engineer's argument relies entirely on interpreting scores as **preferences** (A is better/worse than B).
  *   Probability estimates are **beliefs** about an objective state of the world (the project will/won't deliver). These are fundamentally different concepts.
  *   **The Contradiction:**
      1.  **For Preferences (Funding Decision):** The engineer says you *must* use a method that respects individual preferences/utilities (summing) to guarantee unanimity.
      2.  **For Beliefs (Probability):** You are *not* respecting individual beliefs by summing. You are **aggregating beliefs into a collective estimate** using the mean. This treats panelists as estimators of a single truth, not as sovereign preference-holders.
  *   **Why it "Destroys" the Argument?** By averaging probabilities, the panel explicitly acknowledges:
      *   There is an **objective reality** being estimated (the true probability of delivery).
      *   Individual estimates are **noisy signals** of that truth.
      *   The goal is **epistemic accuracy** (finding the best estimate), *not* respecting individual sovereignty over defining the truth.
  *   **The Implication:** If the panel accepts that individual *beliefs* about probability should be averaged to find the best collective estimate of truth, why should individual *preferences* about overall project value be treated as sacrosanct and aggregated only via summing? The new member correctly points out the inconsistency in the underlying philosophy. If you aggregate beliefs using an averaging method chosen for accuracy, it weakens the claim that aggregating preferences *must* use summing to respect sovereignty, especially when summing demonstrably leads to manipulability and distortion (the steamroller effect).

  **Who is Confused About What?**

  1.  **The Engineer:** Is confused about the nature of preference representation in group decisions. He believes:
      *   Cardinal scores are objective and interpersonally comparable.
      *   Unanimity (Pareto Efficiency) is the *only* requirement, ignoring other critical fairness criteria (like IIA or Non-Dictatorship from Arrow's theorem).
      *   That summing is uniquely determined by the unanimity requirement (it isn't; other cardinal methods like averaging *also* satisfy unanimity, though they have other flaws).
      *   He doesn't acknowledge the distinction between aggregating preferences vs. aggregating beliefs.

  2.  **The New Member:** Understands the crucial difference between aggregating preferences and aggregating beliefs. They correctly identify that the panel's practice of averaging probabilities implicitly adopts a different (and arguably conflicting) philosophical stance towards individual inputs than the engineer's strict preference sovereignty argument requires for the funding scores.

  3.  **You (Initially):** Were correctly skeptical of the steamrolling effect but couldn't articulate the theoretical underpinnings (interpersonal comparison, strategic manipulation, violation of IIA). You intuitively grasped the practical unfairness.

  **What Would You Have to Give Up to Escape Summing?**

  To justify moving away from summing *based on the engineer's specific argument*, you would need to challenge its core assumptions:

  1.  **Give up the idea that scores represent interpersonally comparable cardinal utilities.** Acknowledge that scores are inherently subjective, inconsistent, and vulnerable to manipulation. (This is the most realistic step).
  2.  **Acknowledge that other values matter besides just respecting unanimity.** Accept that preventing dictatorship/manipulation (Non-Dictatorship) and ensuring rankings between A and B aren't swayed by irrelevant option C (IIA) are also important, even if it means no perfect system exists (Arrow's Theorem). You might choose a system that better balances these competing goals (e.g., median score, ranking systems, approval voting).
  3.  **Accept that "preference" can be ordinal.** Recognize that knowing *if* A is preferred to B might be sufficient, and knowing *how much more* one member prefers A might not be reliably measurable or fairly comparable across members.

  **In Conclusion:**

  The engineer is **not right** that summing is forced upon you by the unanimity requirement. His argument relies on unrealistic assumptions about the nature and comparability of scores. Arrow's Theorem proves that no perfect system exists. Summing is one method among many, with significant flaws (vulnerability to scale manipulation, strategic voting, violation of IIA). The new member is absolutely correct that the panel's practice of averaging probabilities fundamentally conflicts with the philosophical basis of the engineer's argument for summing preference scores, as it treats individual inputs as estimates of an objective truth rather than sovereign expressions of preference. The confusion stems from the engineer's oversimplified view of preference representation and his neglect of fundamental social choice constraints.
