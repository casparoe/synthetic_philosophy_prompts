answer: |-
  Here’s a strategic Q&A prep sheet tailored to your audience, ranked by likelihood/damage potential. I’ve drawn on common hedonist rebuttals in the literature (Crisp, Feldman, Bramble) and neo-Epicurean priorities (e.g., simplicity, phenomenology).  

  ### **Top-Tier Objections (High Likelihood/High Damage)**  
  1. **The Feldman Defense (Prof/Likely)**  
      *Objection:* "You claim attitudinal hedonism can't unify pleasures, but Feldman *explicitly* avoids reducing pleasure to a common feeling! The 'attitude of favor' *is* the unifying feature—it’s a pro-attitude toward a sensory experience, regardless of heterogeneity in the *content*. Why isn’t that sufficient?"  
      *Your Reply (2 min):* "Feldman’s move shifts heterogeneity from sensory content to *objects of attitude*. But if the sensory content is irreducibly diverse, and the attitude is directed *at that content*, the value-grounding property fragments. Attitudinal pleasure in stubbing your toe vs. appreciating Kant isn’t a *single* good—it’s two distinct pro-attitudes toward incommensurable sensory states. Hedonism’s core promise—a *monistic* theory—collapses."  
      *Soft Spot:* If Feldmanians argue the attitude *itself* has a uniform phenomenological character (e.g., "feeling of liking"), your sensory-heterogeneity critique weakens.  

  2. **Heterogeneity as a Non-Problem (Prof/Peers)**  
      *Objection:* "Hedonism doesn’t require phenomenological homogeneity! We can have *one* fundamental good (pleasure) realized in diverse ways—just as 'knowledge' varies across domains. Isn’t your demand for a unified *feel* a category error?"  
      *Your Reply:* "Unlike knowledge—which we unify via its relation to truth—hedonism lacks a comparable unifying *relation*. Pleasure’s value is purportedly *intrinsic* and *felt*. If the felt character varies radically (orgasm vs. melancholy music), and that feeling *is* the good, we’re left with multiple intrinsic goods. This isn’t mere diversity—it’s *disunity* in the good itself."  
      *Soft Spot:* If hedonists bite the bullet ("Yes, there are plural intrinsic goods, but all are pleasures"), your "problem" becomes terminological—but this undermines hedonism’s reductive appeal.  

  3. **Desire Theories Are Worse (Prof/Peers)**  
      *Objection:* "Even if heterogeneity stands, desire theories face *fatal* problems—e.g., desires based on false beliefs (Railton’s "Experience Machine"), or trivial desires (wanting a blade of grass counted). How is that *less* problematic than diverse pleasures?"  
      *Your Reply:* "Desire theories *can* filter desires (e.g., idealized or life-goal frameworks) to avoid these issues. But my point isn’t that desire theory is flawless—it’s that *residual heterogeneity* in hedonism is systematically underexplored. If even sophisticated hedonism can’t unify the good, desire theory’s flexibility in accommodating diverse goods becomes a *virtue*, not a vice."  
      *Soft Spot:* If pressed, you concede desire theories have own challenges—but stress hedonism’s unique *monistic* commitment makes heterogeneity a deeper flaw.  

  ---

  ### **Mid-Tier Objections (Moderate Likelihood/Moderate Damage)**  
  4. **The Explanatory Power Trade-off (Prof)**  
      *Objection:* "Hedonism explains *why* diverse things are good (they feel pleasurable). Desire theories just say ‘because we desire them’—that’s circular. Isn’t heterogeneity a price worth paying for explanatory unity?"  
      *Your Reply:* "Hedonism’s ‘explanation’ is thin if ‘pleasure’ fragments into unrelated states. Desire theories avoid circularity by grounding goodness in *facts about agency* (e.g., fulfilling our nature as planners), not brute desires. The heterogeneity problem reveals hedonism’s ‘explanation’ is illusory."  
      *Soft Spot:* If hedonists argue phenomenology *does* unify pleasure (e.g., all pleasures "feel good" minimally), your critique relies on disputable intuitions about incommensurability.  

  5. **Neo-Epicurean Resilience (Prof)**  
      *Objection:* "Epicurus *embraced* heterogeneity! Kinetic (active) and katastematic (static) pleasures are distinct but both valuable. Why is this a ‘problem’ rather than a feature?"  
      *Your Reply:* "Epicurus maintained both reduce to *absence of pain* (aponia/ataraxia). Contemporary hedonists reject this reduction (e.g., Crisp on excitement). Without that core unity, we’re left with two irreducibly valuable states—violating monism."  
      *Soft Spot:* If the Prof argues her neo-Epicurean view *does* unify pleasures (e.g., via tranquility), you’ll need case-specific rebuttals.  

  ---

  ### **The Killer Question (Pray It Goes Unasked)**  
  **"If heterogeneity forces us to abandon monistic hedonism, why jump to *desire-satisfaction* instead of an objective list theory? Objective lists handle diversity trivially—e.g., knowledge, friendship, *and* pleasure are all goods. Your pivot feels arbitrary."**  
  *Why It’s Deadly:* It exposes your paper’s weak spot—desire theory isn’t the *only* alternative, and OL/Perfectionism better accommodates heterogeneity. Your hedonist critics *and* the OL half will pounce.  
  *Your Reply (Damage Control):* "Desire theory preserves *subject-relative* value better than OL (e.g., why is knowledge good for someone who despises it?). But crucially, residual heterogeneity shows hedonism fails *even on its own subjectivist terms*. This forces a reevaluation of *all* subjectivist options—desire theory included."  
  *Honest Note:* This reply is defensive. It admits desire theory isn’t a silver bullet—undercutting your paper’s positive claim.  

  ---

  ### **Tactical Notes**  
  - **Prof’s Style:** Expect her to frame objections as "friendly refinements" while undermining your core argument. Cite her work (e.g., "As you’ve argued, Prof, hedonism handles X...") to show engagement.  
  - **Hedonist Peers:** They’ll focus on Feldman’s resilience. Emphasize that attitudinal pleasure *inherits* sensory heterogeneity.  
  - **OL Allies:** They’ll soft-peddle critiques—use them to bait hedonists into overreaching.  
  - **Your Softness:** Your desire theory pivot *is* underdeveloped. Prep a pivot: "My goal today is hedonism’s internal problem—desire theory is a *speculative* direction, not a proven solution."  

  **Final Prep Tip:** Open Q&A by *posing* the killer question yourself: "One might wonder why I suggest desire theory over objective lists..." — then give your controlled reply. Steals their ammunition.  

  *Good luck. Target the monism—it’s hedonism’s Achilles’ heel.*
