prompt: |-
  I'm a novelist and my beta reader keeps dropping the phrase 'main character syndrome' in her notes — sometimes as a compliment (my protagonist is so vivid the rest of the cast feels like furniture), sometimes as a warning (you've written everyone else like a prop). I dont even know if its a real term or just internet slang. What precise claims could this one-liner actually be making — about how we experience our own lives, about how we treat other people, and about what makes a character feel real on the page — and which reading corresponds to which of her complaints? And which version is defensible, which is just a cliché, and which is actually false? Please answer in American English.
reasoning: |-
  Okay, the user is a novelist dealing with feedback from a beta reader who keeps using the term "main character syndrome." The beta reader uses it both positively and negatively, which is confusing. The user wants to understand what this term really means, how it applies to their writing, and which parts of the feedback are valid or not. 

  First, I need to unpack "main character syndrome." It's definitely internet slang, but it has roots in narrative theory. The user seems frustrated by the ambiguity—is the beta reader praising or criticizing? I should clarify the dual nature of the term. 

  The positive version: when the protagonist is so compelling that side characters fade. That's about narrative focus. The negative version: when side characters feel like props, which hints at weak worldbuilding. The user needs to distinguish these, so I'll map each to specific writing issues. 

  Hmm, the user also asks about real-life implications—how we see ourselves vs. others. That's deeper. Main character syndrome irl is a critique of self-centeredness, but in fiction, a strong protagonist isn't inherently bad. The defensible part is narrative necessity; the cliché is underdeveloped side characters; the false idea is that every character must be equally complex. 

  The beta reader's complaints likely stem from two problems: 1) the side characters lacking depth (negative MCS), and 2) the protagonist overshadowing them even when they should matter (positive but problematic). The user needs actionable fixes—like giving side characters hidden depths or ensuring their roles aren't purely functional. 

  Also, the user might feel defensive. I should validate that a vivid protagonist is good! But the "prop" criticism is worth addressing. Maybe suggest techniques: silent stakes, contradictions in side characters, etc. The key is balance—no need to demote the MC, just elevate others when relevant. 

  Finally, I’ll avoid jargon. Keep it practical. The user’s a novelist, so examples from literature (e.g., Gatsby’s side characters) could help. Stress that defensible ≠ cliché ≠ false is crucial—they’re overlapping but distinct. 

  ... Wait, did I cover all angles? Real-life MCS vs. narrative MCS, the beta’s dual feedback, and how to fix it? Yes. And I’ll remind them that "prop" characters are the real sin here.
answer: |-
  That's a sharp observation from your beta reader! "Main Character Syndrome" (MCS) is absolutely internet slang, but it taps into deep truths about narrative, psychology, and ethics. Let's break down what she's *really* saying in each context, what claims it makes, and how defensible they are:

  **1. The Compliment: "Your protagonist is so vivid the rest of the cast feels like furniture."**
  *   **The Claim:** This leans on the **psychological reality of focalization**. We experience life through our *own* subjective lens – we *are* the protagonists of our inner narratives. A writer who nails this intense, immersive perspective makes the MC feel hyper-real. The claim here is: *"Masterful focalization creates an authentic, compelling self-experience for the reader through the MC."*
  *   **The Reading:** Your beta reader is praising your ability to create deep, immersive **Point of View (POV)** and interiority for your protagonist. She's swept up in the MC's world.
  *   **Defensibility:** **Highly Defensible.** This is core craft. A vivid, complex protagonist experiencing the world intensely is non-negotiable for most compelling fiction. Readers *want* to connect deeply with the MC. The "furniture" feeling is often an acceptable side effect of masterful POV – *if* it serves the story's focus (e.g., a claustrophobic character study like *The Catcher in the Rye*). Holden's world *should* feel filtered through his alienation.

  **2. The Warning: "You've written everyone else like a prop."**
  *   **The Claim:** This critiques **narrative ethics and worldbuilding**. It claims: *"Treating secondary characters solely as functions of the MC's journey (obstacles, rewards, mirrors, comic relief) ignores their inherent personhood and undermines the story's realism and moral texture."* It points to a failure in **character function vs. character illusion**. Every character should feel like they *could* be the protagonist of their own story, even if we don't see it.
  *   **The Reading:** Your beta is flagging **underdeveloped secondary characters**. They lack:
      *   **Interiority:** Their own desires, fears, motivations (beyond serving the MC).
      *   **Contradictions:** Nuance and inconsistency that suggest inner lives.
      *   **Agency:** Actions driven by *their* needs, not just plot convenience for the MC.
      *   **Impact:** Changing the world/plot in ways not solely dictated by the MC.
      *   **Silent Stakes:** Things they stand to lose or gain that matter *to them*, even if the MC doesn't notice.
  *   **Defensibility:** **Highly Defensible as a Critique.** This is where "MCS" becomes a problem. It points to weak craft in character development beyond the protagonist. Even in a tightly focused MC-driven story, secondary characters need the *illusion* of depth to make the world feel real and the MC's interactions meaningful. Treating them as mere props makes the narrative feel manipulative and thin.

  **Connecting to Real Life & Character Reality:**

  *   **How We Experience Our Lives:** Psychologically, we *do* experience life as the protagonist (focalization). MCS-as-critique isn't denying this; it's saying fiction needs to *acknowledge* that *everyone else* experiences life this way too. Ignoring that creates an unrealistic, solipsistic narrative world.
  *   **How We Treat Other People:** Ethically, treating others solely as supporting characters in *our* story is narcissistic and dehumanizing. Fiction that replicates this without critique risks endorsing that worldview or creating emotionally shallow interactions. Compelling fiction often explores the *clash* or *collision* of subjective realities.
  *   **What Makes a Character Feel Real:** **Contradiction, Desire, and Unpredictability.** Real people have inner lives that surprise us. Prop characters lack this. They exist only to reflect, challenge, or serve the MC in obvious ways. A real-feeling character acts from their *own* center, even if we only glimpse it.

  **Breaking Down Defensibility, Cliché, and Falsehood:**

  1.  **Defensible:**
      *   **As Compliment:** Masterful focalization and creating a compelling, immersive MC perspective is essential craft.
      *   **As Critique:** Underdeveloped secondary characters who lack interiority, agency, and their own stakes weaken the narrative's realism, depth, and ethical texture. *This is the core valid concern behind the "prop" criticism.*
  2.  **Cliché (Often Misapplied or Oversimplified):**
      *   **The Term Itself:** "Main Character Syndrome" *is* internet slang. Overusing it can be reductive shorthand that doesn't pinpoint the *specific* craft issue (e.g., "needs more distinct secondary character goals" is more useful than "MCS").
      *   **Demanding Equal Focus:** Expecting *every* character to be as deeply explored as the MC in *every* story is unrealistic and misunderstands narrative focus. Not every shopkeeper needs a backstory. The cliché is applying "MCS" to *any* story where the MC is central, rather than only when support characters are *underwritten*.
  3.  **Actually False:**
      *   **"A Strong Protagonist Automatically Weakens Others":** This is false. A masterful writer (think Tolstoy, Dickens, George R.R. Martin) can have an incredibly vivid MC *and* a rich tapestry of equally vivid secondary characters. Strength in one doesn't necessitate weakness in others; it requires more skill.
      *   **"First-Person POV Excuses Prop Characters":** False. Even in deep 1st person, a skilled writer shows the reader that other characters have complex inner lives *through* the MC's observations (misinterpretations, surprises, unintended impacts). Nick Carraway in *Gatsby* is vivid, but Gatsby, Daisy, Tom, and Jordan are *not* props – their complexity is revealed *through* Nick's limited, biased lens.
      *   **"Readers Only Care About the MC":** False. Readers become deeply invested in compelling secondary characters, relationships, and the overall world. Treating others as props often *disengages* readers.

  **Actionable Takeaways from Your Beta Reader:**

  1.  **Acknowledge the Praise:** Your MC *is* working! That's huge. Don't lose that intensity.
  2.  **Address the Warning (The "Prop" Problem):** This is the crucial feedback. Ask yourself about *each* named secondary character:
      *   What do they want *for themselves*, independent of the MC?
      *   What's their biggest fear? What are they hiding?
      *   Do they have a contradiction? (e.g., The gruff mentor who secretly writes poetry).
      *   Do they change? Do their actions *surprise* the MC (and the reader) in a way that reveals hidden depth?
      *   Do they impact the plot in ways driven by *their* needs?
      *   **Fix:** Add subtle details, moments of unexpected behavior, hints of backstory, or specific desires that *don't* directly serve the MC's plot. Give them "silent stakes" in scenes.

  **In short:** Your beta is saying you've nailed the hardest part – a compelling protagonist. Now, elevate your craft by ensuring the world around that protagonist feels inhabited by *people*, not just plot devices. "Main Character Syndrome" as a critique isn't about dimming your star; it's about letting the supporting cast shine in their own right, making the whole story richer and more believable. Keep the MC vivid, just make sure the "furniture" has hidden drawers full of secrets.
