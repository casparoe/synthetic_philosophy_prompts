  > - ≤0.3% expected errors in automated high-trust rows (3,100 rows).  
  > - ≤5% expected errors in parser-processed rows (X rows).  
  > - ≤0.05% expected errors in hand-verified rows (400 rows).  
  > - ≤2% expected errors in other rows (Y rows).  
