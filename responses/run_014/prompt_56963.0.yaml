  ### **What the Procedure Can't Settle (Human Judgment)**  
  1. **Setting P(defect) for New Sources**: Start with Class D defaults; adjust after 2 releases.  
  2. **Escalation Thresholds**: Based on your cost of failure (e.g., hospital contracts → stricter thresholds).  
  3. **Senior Review Focus**: Prioritize classes with high systemic risk (e.g., clustered errors).  
  4. **Reject vs. Ship Ambiguous Rows**: When evidence is weak, reject if systemic cost > per-row cost.  
  5. **Admitting Uncertainty**: Compliance must accept that "expected errors" are estimates.  

