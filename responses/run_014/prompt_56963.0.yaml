  ### **Flowchart-in-Words**  
  1. **Classify each row** (A/B/C/D) based on evidence source.  
  2. **Look up P(defect)** for its class (table above).  
  3. **Compare to thresholds**:  
     - Accept if ≤ Accept Threshold.  
     - Escalate if between Accept/Reject Thresholds.  
     - Reject if ≥ Reject Threshold.  
  4. **Senior reviews escalated rows**:  
     - Fix if possible → mark Accepted.  
     - Else → Reject.  
  5. **Reject all unreviewed escalated rows** (if senior time runs out).  
  6. **Run random audits** on Classes A/C (juniors).  
  7. **Calculate release stats**: Expected errors, 95% upper bound.  
  8. **Write release note** with class-level expectations.  

  This balances efficiency, risk, and honesty. Systemic risks are managed by class-level controls and rejecting unreviewable data—not by pretending individual 99.5% certainty prevents release-level errors.
