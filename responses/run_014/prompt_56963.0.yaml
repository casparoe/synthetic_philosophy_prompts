  > *No process can guarantee 0 errors. We reject ambiguous data to minimize risk.*"  

  - **Calculate Overall Risk**:  
    - Expected Errors = Σ (Rows in Class × Class P(defect)).  
    - SD = √[Σ (Rows × P(defect) × (1-P(defect)))].  
    - 95% Upper Bound = Expected Errors + 1.65 × SD.  

