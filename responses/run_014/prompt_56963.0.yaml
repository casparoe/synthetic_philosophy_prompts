  Here's a step-by-step procedure addressing your requirements. It prioritizes actionable steps, systemic risk management, and honesty about limitations. The core insight: **When errors cause systemic damage (trust collapse, system failures), per-row thresholds are insufficient. You must manage release-level risk.**

