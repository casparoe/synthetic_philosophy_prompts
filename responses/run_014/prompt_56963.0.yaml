  ### **Procedure: Allergen Data Release QA**

  #### **1. Classify Rows by Evidence Type (Step 1)**  
  Sort rows into classes based on evidence quality. **Classes matter because errors cluster differently**, and systemic risk varies.  
  - **Class A (Automated High-Trust)**:  
    - *Criteria*: Data from trusted feeds with known error rates (e.g., distributor feeds).  
    - *Example*: 3,100 distributor rows (0.3% historical error rate).  
  - **Class B (Automated with Known Flaws)**:  
    - *Criteria*: Data with uncorrectable systemic risks (e.g., parser language errors).  
    - *Example*: Parser rows with potential French/Spanish mangling (errors clustered, unknown exact rows).  
  - **Class C (Hand-Verified)**:  
    - *Criteria*: Rows reviewed by seniors (e.g., "verified" tier).  
    - *Example*: 400 rows hand-checked twice.  
  - **Class D (Low-Evidence)**:  
    - *Criteria*: Supplier specs/scrapes without source history or human review.  
    - *Default*: Assign all other rows here.  

  #### **2. Set Per-Class Thresholds (Steps 1-2)**  
  Define rules for juniors:  
  | **Class** | **P(defect)** | **Accept Threshold** | **Escalate Threshold** | **Reject Threshold** |  
  |-----------|---------------|----------------------|------------------------|----------------------|  
  | A         | ≤0.3%         | P ≤ 0.5%             | 0.5% < P ≤ 2%          | P > 2%               |  
  | B         | ~5% (est.)*   | P ≤ 1%               | 1% < P ≤ 10%           | P > 10%              |  
  | C         | ~0.01%**      | P ≤ 0.05%            | 0.05% < P ≤ 0.5%       | P > 0.5%             |  
  | D         | ~1.5%***      | P ≤ 2%               | 2% < P ≤ 5%            | P > 5%               |  

  - **Juniors' Actions**:  
    - **Accept**: If row ≤ "Accept Threshold" for its class.  
    - **Escalate**: If between "Accept" and "Reject" thresholds.  
    - **Reject**: If ≥ "Reject Threshold" (or if evidence is ambiguous).  
  - **\*Class B Note**: Errors are clustered (e.g., language issues). Use *estimated* class-wide error rate. If possible, flag foreign terms (e.g., "lait", "soja") to escalate all such rows.  
  - **\*\*Class C Note**: Based on 1% error rate per senior review (0.01% = 1% × 1%).  
  - **\*\*\*Class D Note**: Default for new/unvetted sources. Adjust with historical data.  

  #### **3. Allocate Senior Time (Step 3)**  
  Maximize impact of 6 senior hours (~120 rows at 3 min/row):  
  - **Priority 1**: Escalated Class B rows (systemic risk).  
  - **Priority 2**: Escalated Class D rows (uncertain sources).  
  - **Priority 3**: Random audit of Class A/C (5% sample each).  
  - **Do Not Review**: Classes A/C/D rows below "Accept Threshold" (low risk).  

  *Example Allocation*:  
  - 100 escalated Class B rows (5 hrs).  
  - 20 escalated Class D rows (1 hr).  
  - Audit 15 Class A and 15 Class C rows (use junior time).  

