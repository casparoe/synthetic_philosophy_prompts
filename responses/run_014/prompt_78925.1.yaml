  The user wants several specific elements in this joint statement. First, a numbered list of agreed claims that both camps can accept - this should neutrally state the disputed pattern, clarify what it doesn't prove, and establish measurement criteria. Second, residual disagreements worded fairly for each side. Third, concrete cruxes with testable predictions for unresolved questions - including how a single country might change over time, choices of immigrant daughters, within-occupation task analysis, and credentialing differences.

  I need to be careful about neutrality throughout. The disposition camp emphasizes biological or deep psychological preferences, while the structure camp focuses on how institutions and culture shape choices. For the agreed claims, I can include things like: the pattern exists (more egalitarian countries show larger gender gaps in certain fields), this pattern doesn't prove innate differences, and measurements must avoid circular reasoning.

  For the disagreements, I should phrase them as "The disposition camp holds..." and "The structure camp holds..." to maintain fairness. The key disagreements will be about whether preferences exist independently of structure, and whether structure fully explains the observed patterns.

  For the cruxes, I need concrete tests both sides would accept as meaningful:
