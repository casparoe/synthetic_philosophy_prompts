  Thirty years as an evolutionary biologist and I've only just started reading philosophy of mind now that I'm retired, so forgive the muddle. Teleosemantics is the first topic that's made me actually slow down, and I keep getting stuck on the difference between Millikan's etiological account of proper function and Dretske's causal theory of content. Could you give me a concrete example of a case where the two come out differntly on what content a token has — say, a trait selected to track one thing but now reliably caused by a different one, or that's gone a bit maladaptive — and walk me through which account says it has which content and why that split is exactly where the misrepresentation problem lives? I'd like it grounded in an actual biological trait if you can manange, not just smoke detectors.
