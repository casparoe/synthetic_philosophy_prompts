  Here are five examples:

  1.  **Geopolitical Intelligence:** A low-credibility source claims a hostile nation will secretly launch a devastating cyberattack crippling global infrastructure within 48 hours unless pre-emptive military action is taken; the potential damage is incalculable, but the claim lacks verifiable evidence.
  2.  **Venture Capital Pitch:** An entrepreneur with a shaky prototype but immense charisma argues their unproven technology will inevitably become the foundation of a multi-trillion-dollar industry, demanding massive investment now or claiming competitors will lock you out forever.
  3.  **Personal Relationship Ultimatum:** A partner threatens that if you don't immediately abandon your career and move across the country with them, they will suffer a catastrophic mental breakdown leading to irreparable harm, citing vague but terrifying potential consequences they refuse to detail.
  4.  **Emerging Technology Risk:** A fringe AI researcher insists, without rigorous proof, that a specific, minor flaw in current AI training protocols has a non-zero chance of triggering an uncontrollable cascade leading to human extinction within a decade, demanding all resources be diverted to fix it immediately.
  5.  **Health & Wellness Marketing:** A supplement company claims their unregulated product uniquely prevents a specific, exceptionally rare but universally fatal future health crisis predicted by their proprietary (and secret) model, leveraging the fear of missing out on absolute protection despite negligible scientific backing.
