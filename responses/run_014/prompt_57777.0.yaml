prompt: |-
  I'm a software engineer, and eight months ago I was asked to join the five-person grants panel of a small private fund that gives to global health and poverty programs. I'm the only member with no background in economics or public health; I was added because a growing share of the proposals are about data systems. The chair is a former colleague of mine. For the coming round the panel has asked me to draft the recommendation memo, and the instruction I was given is that it should be consistent with what we have already done. I have gone back through six years of minutes. Here is the record, with the reasons recorded at the time and the vote.

  1. Funded, 5–0: a bed-net distribution program in an East African country, backed by two randomized trials, with a cost per case averted the panel could check independently. The minutes note that other donors were not covering the demonstrated need.

  2. Rejected, 5–0: an unconditional cash transfer program in the same country, also trial-backed, with a cost-per-outcome figure the minutes describe as at least as good as item 1. Three larger donors had committed to scaling it, and the recorded reason is that our money would have gone in regardless.

  3. Funded, 3–2: a grant covering living and training costs for someone moving into a high-paying trading job, against a written pledge to give away half of all income above a fixed threshold, directed to the charities the panel already rated highest. Two members objected that this was one more step removed from the people we are trying to reach. The chair's recorded answer was that the expected donations were large and computable and the destinations were already vetted.

  4. Rejected, 5–0: a school-based treatment program whose original trial had been followed by two replications finding much smaller effects. The minutes are terse: we no longer have the number we thought we had.

  5. Rejected, 5–0: a campaign for a national ballot measure that would have funded programs of the kind in items 1 and 2 at roughly a hundred times our annual budget. The applicant supplied a political scientist's model of passage probability and a cost-effectiveness estimate that beat everything the panel had ever funded. One member wrote that the numbers were borrowed from a model of a different country's elections. Another wrote, separately, that the panel should not be in the business of funding politics. Both reasons appear in the file, and the minutes never say which one carried the vote.

  6. Funded, 4–1: a two-year grant to an established evaluation shop to build a shared, open-source reporting tool for clinics the panel already funds. There is no cost-effectiveness estimate in the file, only a budget. The dissenting member's note is that nothing about it touches a patient.

  The proposal now in front of us: a small organization in a South Asian country, not rated by any of the third-party evaluators whose rankings the panel usually consults, proposes to build and run the routine health information system for one province — facility reporting, supply-chain tracking, and an independent audit layer. The technical design is unambitious and I could assess it myself. A completed randomized evaluation of the same design in two other provinces is published, and its cost per life-year is better than item 1. No other donor has offered to fund it, and the applicant states that the province has asked for it repeatedly. But the system produces nothing unless the provincial ministry adopts it and keeps staffing it, and adoption in the third province stalled for two years after a change of minister.

  What I need from you:

  - How do you expect the chair to vote, and with what confidence? The chair voted with the majority in all six cases.
  - Lay out the candidate rules that would account for all six outcomes at once. I can think of: fund only if we can put a defensible number on it; fund only if our money is what makes the difference; fund only if success doesn't depend on politicians or powerful institutions choosing to cooperate; fund only if we ourselves are competent to evaluate it; fund only if a trusted outside evaluator already vouches for the organization. I suspect some of these are refuted by the record, that others can't be told apart by it, and that at least one pair I haven't thought of does the real work.
  - For each rule that survives all six, say what it implies about the new proposal, and identify which rule you think is most likely driving the chair and why.
  - Which of the six is the closest analog to the new proposal, and at what point does the analogy break down?
  - If we fund it and if we decline it, what general commitment would we be taking on that we have not taken on before?
  - Describe one further hypothetical proposal that would most cleanly separate the two rules you think are genuinely in play.

  I should say what is worrying me, so you can judge whether it is a fact about the record or a bias of mine. I have read that funders like ours drift toward whatever is easy to count, and that this quietly starves the slow, political, hard-to-measure work that changes the most. I don't know whether our six cases show that pattern, or whether some other rule explains them just as well, and I would rather not write the memo out of a suspicion I can't defend.
reasoning: |-
  Hmm, the user is a software engineer serving on a grants panel for global health and poverty programs. They've been asked to draft a recommendation memo consistent with past decisions and have analyzed six historical cases. Now they're evaluating a new proposal for a health information system in South Asia and need help interpreting the panel's implicit rules.

  Looking at the six cases, several patterns emerge. The panel consistently funded interventions with strong evidence (like the bed-net program) but rejected equally evidence-backed programs if other donors were already covering them (like the cash transfer). They showed flexibility in funding indirect interventions (like the trader fellowship) but only when downstream impacts were quantifiable and vetted. Political initiatives were rejected regardless of cost-effectiveness claims, while technical infrastructure got funded despite lacking direct patient impact metrics.

  The new proposal presents an interesting test case. It has excellent cost-effectiveness data from RCTs and fills an unfunded gap, but carries implementation risk tied to government adoption - precisely the factor that sank the political campaign proposal. This creates tension between the panel's apparent "quantifiable impact" preference and "avoid political dependency" aversion.

  For the chair's position, their historical pattern suggests they'll likely reject this proposal due to government dependency risk, despite strong numbers. The closest analog is actually Case 6 (the reporting tool) - both are data systems with implementation dependencies, but the new proposal has better evidence while carrying higher political risk.

  The two most consistent rules seem to be: 1) Require quantifiable impact estimates (supported by Cases 1,3,4,5 rejection) and 2) Avoid success dependencies on external actors (Cases 2,5 rejection). A clean test between these would be a proposal with ironclad impact numbers but requiring government cooperation that isn't guaranteed.

  I agree with the user's concern about measurement bias - the record shows this panel does prioritize quantifiable interventions, though not exclusively. The key is recognizing that "quantifiable" here means both numerically defensible and institutionally controllable. Their rejection of the cash transfer despite good numbers reveals an equally strong preference for being the decisive funder.
answer: |-
  Based on the historical record and the chair's voting pattern, here's a systematic analysis of your questions:

  ### 1. Chair's Likely Vote & Confidence
  - **Vote: Reject**  
  - **Confidence: High (80-90%)**  
    Reasoning: The chair consistently rejected proposals where success depended on third-party actors beyond the grantee's control (Cases 2, 5) or lacked verifiable evidence (Case 4). The new proposal’s dependency on provincial ministry adoption mirrors Case 5's political risk and Case 6’s institutional dependency, both rejected unanimously or near-unanimously. The chair only supported "removed" interventions (Case 3) when downstream impacts were contractually guaranteed and quantifiable—a condition absent here.

  ---

  ### 2. Candidate Rules & Survivorship Analysis
  Below are rules tested against all six cases. **Bolded** rules survive all cases; *italicized* are refuted:

  | Candidate Rule | Case 1 | Case 2 | Case 3 | Case 4 | Case 5 | Case 6 | Verdict |
  |----------------|--------|--------|--------|--------|--------|--------|---------|
  | **A. Fund only if success doesn’t depend on uncommitted external actors (gov’t, donors, etc.)** | ✓ (No dependency) | ✓ (Depended on other donors) | ✓ (Pledge binding) | ✓ (No dependency issue) | ✓ (Depended on voters/gov’t) | ✓ (Depended on clinics) | **Survives** |
  | **B. Fund only if defensible cost-effectiveness evidence exists *and* is currently valid** | ✓ (RCTs + independent check) | ✓ (Good evidence but rejected for other reasons) | ✓ (Computable expected donations) | ✗ (Evidence invalidated) | ✓ (Evidence disputed) | ✗ (No CE estimate) | *Refuted (fails Case 6)* |
  | C. Fund only if our money is pivotal (no other funding) | ✓ (Unmet need) | ✓ (Others funding) | ✓ (No other funder mentioned) | ✓ (Not mentioned) | ✓ (Not pivotal) | ✓ (No other funder) | **Survives** |
  | D. Fund only if directly touches end-beneficiaries | ✗ (Indirect via systems) | ✓ (Direct) | ✗ (Indirect) | ✓ (Direct) | ✗ (Indirect) | ✗ (No patient touch) | *Refuted (fails Cases 1,3,6)* |
  | **E. Fund only if *either* (i) direct evidence exists, *or* (ii) implementation is fully controllable by grantee** | ✓ (Direct evidence) | ✓ (Direct evidence) | ✓ (Controllable via contract) | ✗ (Evidence invalid) | ✗ (Uncontrollable) | ✓ (Implementation controllable) | **Survives** |

  **Key Insights**:  
  - Rules A, C, and E are fully consistent with all decisions.  
  - Rule B fails Case 6 (funded without CE estimate); Rule D fails Cases 1, 3, 6.  
  - "Avoid politics" (from Case 5) is subsumed under Rule A (external dependencies).  

  ---

  ### 3. Surviving Rules → New Proposal Implications & Chair's Likely Driver
  - **Rule A (No External Dependency)**: **Reject**. Success hinges on provincial ministry adoption—an uncommitted external actor with proven instability (ministerial changes stalled adoption).  
  - **Rule C (Pivotal Funding)**: **Fund**. No other donor is involved; province requested it repeatedly.  
  - **Rule E (Evidence OR Controllability)**: **Reject**. While evidence exists (RCT), implementation is *not* controllable by the grantee (requires gov’t action).  

  **Chair's Likely Driver: Rule A**  
  The chair emphasized avoiding uncontrollable dependencies:  
  - In Case 2, rejected cash transfers due to other donors' actions.  
  - In Case 5, rejected politics due to voter/gov’t dependency.  
  - In Case 6 (funded), the tool was controllable by clinics *already funded by the panel* (internal dependency).  
  The new proposal’s gov’t dependency is a higher-risk version of Case 5/6, making rejection likely.  

  ---

  ### 4. Closest Analog & Breakdown Point  
  - **Closest Analog: Case 6 (Reporting tool)**  
    - Similarities: Technical system build; no direct patient impact; dependency on institutions (clinics/gov’t).  
    - **Breakdown**:  
      - Case 6 clinics were *already funded by the panel* (controlled dependency). Here, the ministry is an *external actor* with no commitment.  
      - Case 6 had no CE evidence; this proposal has strong RCT evidence.  
    - *Why not Case 5?* Case 5 was explicitly political; this is technical (but still gov’t-dependent).  

  ---

  ### 5. New Commitments if Funded/Declined  
  - **If Funded**: Commitment to fund *externally dependent implementations without binding commitments*. This overrules precedents from Cases 2 (donor dependency) and 5 (gov’t dependency).  
  - **If Declined**: Commitment to reject *all interventions requiring uncommitted third-party adoption*, even with strong evidence. Strengthens Rule A as a non-negotiable filter.  

  ---

  ### 6. Hypothetical Proposal to Separate Rules  
  To cleanly separate **Rule A (No External Dependency)** vs. **Rule C (Pivotal Funding)**:  
  - *Proposal*: A bed-net program (like Case 1) in a country where 3 other donors fund 90% of the need, but a funding gap leaves 10% uncovered.  
    - Cost-effectiveness: Identical to Case 1 (defensible).  
    - External dependency: None (grantee directly implements).  
    - Pivotality: Our funds cover the gap (pivotal for 10%).  
  - **Prediction**:  
    - Rule A would fund (no dependency).  
    - Rule C *could* reject (since other donors exist, per Case 2 logic).  
    Outcome would show whether dependency (A) or pivotality (C) dominates.  

  ---

  ### Addressing Your Concern  
  Your worry about "drifting toward easy-to-count" interventions is partially supported:  
  - The panel *does* prioritize quantifiable evidence (Cases 1, 3, 4).  
  - **But** it also rejects quantifiable programs due to dependencies (Cases 2, 5).  
  The deeper pattern is **avoiding institutional risk**, not just measurement ease. Case 3 (trader fellowship) was funded *because contractual pledges reduced uncertainty*, despite being "removed" from beneficiaries. The new proposal’s fatal flaw isn’t its measurability—it’s the uncontrollable reliance on a government actor.  

  ### Recommendation for Memo  
  Frame the decision around **controllability**:  
  - *If rejecting*: "While cost-effectiveness is strong, success depends on sustained provincial ministry adoption—a factor outside the grantee’s control and inconsistent with prior decisions (Cases 2, 5)."  
  - *If funding*: "Our pivotal role in filling an unfunded gap (Case 1 precedent) outweighs implementation risks, contingent on the province formalizing adoption commitments."  

  The chair will likely prefer the rejection rationale. Document both the evidence strength and dependency risk transparently to uphold the panel’s consistency.
