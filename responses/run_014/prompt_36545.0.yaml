prompt: |-
  I work in people analytics at a large employer, and lately I've been responsible for the "adverse impact testing" we do on hiring screens — including algorithmic ones. The practice, for anyone unfamiliar: under the Uniform Guidelines on Employee Selection Procedures, US employers treat a selection procedure as showing evidence of adverse impact whenever the selection rate for any race, sex, or ethnic group falls below four-fifths (80%) of the rate for the highest-selected group. So if we pass 60% of applicants from group A and 40% from group B, the impact ratio is 0.67 and the screen is flagged; the practical workflow is then to either drop the procedure or show it is job-related and consistent with business necessity. With algorithmic screens, the common pattern is to test the model on a held-out dataset, and if the ratio dips below 0.8, re-tune or adjust thresholds until it passes. It's a purely distributional test: nothing about the mechanism, the inputs, or the causal path from application to outcome enters at the checking stage.

  I've been trying to figure out what theory of fairness this practice actually presupposes, and I keep finding it slippery. On its face the four-fifths rule presupposes that fairness is a fact about outcome ratios across groups — something in the neighborhood of demographic parity, which is striking, because demographic parity is one of the fairness criteria that formal work treats as most problematic: when base rates of the underlying trait differ between groups, satisfying it seems to require passing over higher-scoring members of one group in favor of lower-scoring members of another, which conflicts with any "rank by score" view of merit and can lower overall utility. And there are results showing that when base rates differ, you cannot simultaneously have a calibrated score and equal error rates across groups, so any single threshold-based test has to give something up. Meanwhile, the business-necessity defense points in a completely different direction: it says that outcome disparities are acceptable if they trace to job-relevant traits, which sounds like fairness is about the process and the inputs, not the outcome distribution at all — closer to "the score measures what it claims to measure, apply it evenhandedly, and let the rates fall where they may." So the same regulatory apparatus seems to presuppose an outcome-based fairness conception at the screening stage and a process-based one at the defense stage, and I can't tell whether these are genuinely in tension or whether the practice is deliberately layered so that only the conjunction of the two commitments is real — a rebuttable presumption rather than a criterion. There's also the awkward fact that the four-fifths threshold is a rule of thumb with no statistical grounding: it ignores sampling error badly at small n, so the same underlying procedure can be "fair" or "unfair" depending on applicant-pool size, which seems like it shouldn't follow from any serious theory of fairness.

  So here's what I'd like from you. First, reconstruct the implicit theory of fairness the adverse-impact testing practice presupposes — does it commit us to demographic parity, or to something weaker like a presumption against unexplained disparities, and what exactly separates those? Second, say which rival fairness conceptions the practice rules out (calibration-within-groups, equalized error rates, a purely causal or process-focused view) and which it is merely compatible with. Third, be honest about whether the layered structure — a distributional screen plus a process-validity defense — is a coherent single theory or an unstable compromise, and whether the impossibility results make the incoherence deep rather than incidental. Finally, tell me concretely what would have to change in day-to-day practice if the presupposed conception were replaced with, say, an equalized-odds standard: what would we test, what would we tune, and what kinds of screens that currently pass would fail (and vice versa). Please lead with the reconstruction rather than a survey of fairness metrics, and end your response with a single final line of the form "Verdict: " followed by one sentence stating whether the four-fifths rule, as actually practiced, presupposes one coherent conception of fairness — and if so, which one.
reasoning: |-
  Hmm, the user is asking about adverse impact testing in hiring, specifically the four-fifths rule under the Uniform Guidelines. They're confused about the underlying theory of fairness it implies, noting a tension between demographic parity during screening and process-based justifications later. They want me to reconstruct the implicit theory, identify incompatible fairness concepts, evaluate coherence, and compare with alternatives like equalized odds.

  First, I need to understand the structure of adverse impact testing. The four-fifths rule flags a procedure if any group's selection rate is below 80% of the highest group's rate. If flagged, the employer can either drop the procedure or prove it's job-related and consistent with business necessity. For algorithmic screens, they adjust thresholds to meet the ratio. The user points out that this seems like demographic parity, which is problematic when base rates differ. The business necessity defense, however, shifts to a process-based view, where disparities are acceptable if they stem from job-relevant traits.

  So, the implicit theory here is a rebuttable presumption. Screening uses a distributional check (demographic parity) to flag potential issues, but the defense allows process-based validation. This isn't a full commitment to demographic parity but a trigger for scrutiny. The rule of thumb nature of the 80% threshold, ignoring sample size, adds to its heuristic nature.

  Now, rival fairness conceptions: Demographic parity requires equal selection rates, which the rule approximates but doesn't enforce strictly. Calibration (scores meaning the same across groups) and error rate equality (equal FPR/FNR) are incompatible with demographic parity when base rates differ. The four-fifths rule doesn't consider these, so it's incompatible with them unless base rates are equal.

  Is this layered structure coherent? It's a legal compromise rather than a philosophical one. The presumption shifts the burden of proof to the employer, which makes sense in a regulatory context. However, the impossibility theorems show that you can't satisfy multiple fairness criteria simultaneously if base rates differ. So while the structure is pragmatically coherent for regulation, it's theoretically inconsistent if you try to hold all ideals at once.

  If replaced with equalized odds, the practice would change significantly. Equalized odds requires equal true positive rates and false positive rates across groups. Instead of adjusting thresholds to meet a ratio, you'd ensure that the model's error rates are balanced. This might mean different thresholds per group. Screens that pass the four-fifths rule but have imbalanced error rates would fail under equalized odds, and vice versa. For example, a screen with equal selection rates but higher FNR for a disadvantaged group would pass four-fifths but fail equalized odds.

  The user works in people analytics, so their day-to-day involves running these tests and tuning models. They need clarity on the rationale behind the rules to handle audits or justify methods. Their deeper need might be to understand if current practices are defensible or if they should advocate for changes. They might also be concerned about legal risks or ethical implications when tuning models to meet the 80% rule without addressing underlying disparities.

  Finally, the verdict: The four-fifths rule as practiced presupposes a rebuttable presumption model, not a single coherent fairness conception. It's a procedural mechanism to trigger review, blending outcome and process elements pragmatically.
answer: |-
  Here's a reconstruction of the implicit theory, its implications, and practical alternatives, structured to address your core concerns:

  ### 1. **Implicit Theory of Fairness: Rebuttable Presumption of "Unexplained Disparate Impact"**
     - **Core Presupposition**: Fairness requires the *absence of group disparities unexplained by job-relevant factors*. The four-fifths rule acts as a *heuristic trigger* for suspicion of potential discrimination, not a direct commitment to demographic parity. It establishes a rebuttable presumption: 
       - **Screening Stage (Distributional)**: Disparities ≥20% are *prima facie* evidence of unfairness, implying that outcome parity is the default expectation *absent justification*.
       - **Defense Stage (Process)**: Disparities become acceptable *only if* causally traced to job-relevant traits (via validation studies). This treats fairness as *non-discriminatory measurement*—i.e., scores reflect legitimate qualifications, and thresholds are applied uniformly.
     - **What Separates This from Demographic Parity?**  
       Unlike strict demographic parity (which demands equal selection rates regardless of base rates), this framework permits disparities *if explained by job relevance*. It’s closer to a **burden-shifting mechanism**: outcomes must not *unfairly* disadvantage protected groups, with "unfairly" defined by the failure to link disparities to job necessity.

  ### 2. **Rival Fairness Conceptions: What’s Ruled Out vs. Compatible**
     - **Ruled Out**:  
       - **Demographic Parity (DP)**: The defense stage explicitly rejects DP, as it allows disparities justified by job relevance.  
       - **Calibration/Well-Calibration**: Scores predicting the same probability of success across groups? Incompatible, as the rule permits outcome disparities even with calibration (e.g., if group A has higher job-relevant trait prevalence).  
       - **Equalized Odds/Error Rate Balance**: Requires equal FPR/FNR across groups. The four-fifths rule ignores error rates—it’s possible to pass 4/5 while having wildly unequal FNR (e.g., qualified Group B candidates rejected at higher rates).  
     - **Compatible With**:  
       - **Predictive Parity (if job-relevant)**: If the "business necessity" defense establishes that scores predict performance equally well for all groups, PPV equality could hold.  
       - **Causal Fairness**: The defense stage aligns with "no direct discrimination" (scores don’t use protected attributes) and "meritocracy" (selection based on job-relevant factors).  
       - **Threshold-Free Meritocracy**: If disparities are justified, the practice allows "rank by score and select top N," accepting unequal outcomes.

  ### 3. **Coherence of the Layered Structure: Pragmatic Compromise, Theoretically Unstable**
     - **Surface Coherence**: Legally/pragmatically coherent as a *burden-shifting framework*: Disparities trigger scrutiny; employers must prove legitimacy. This balances efficiency (simple screening) with due process (defense via validation).  
     - **Deep Instability**:  
       - The impossibility theorems (e.g., Kleinberg et al.) show that satisfying DP *and* calibration/error rate balance is mathematically impossible when base rates differ. The framework ignores this by prioritizing the rebuttable outcome test first and process second.  
       - **Core Tension**: The screening stage *assumes* that unexplained disparities imply unfairness (outcome-focused), while the defense stage *defines fairness* via job relevance (process-focused). When base rates differ, the rule may flag procedures that are causally fair (no discrimination) or overlook procedures with equal rates but internal bias (e.g., mismeasurement of qualifications).  
       - **Statistical Arbitrariness**: The 80% threshold and ignorance of sampling error divorce the test from both fairness theory and statistics. A procedure with a 0.79 ratio and small *n* may be "unfair," while one with 0.81 and large *n* is "fair"—despite identical underlying mechanics.

  ### 4. **Concrete Changes Under an Equalized Odds Standard**
     - **What to Test**: Instead of selection rates, measure **group-specific FPR and FNR** (or TPR/FPR parity). A screen passes if:  
       $$ \text{FPR}_A \approx \text{FPR}_B \quad \text{and} \quad \text{FNR}_A \approx \text{FNR}_B $$  
       (with statistical tests for significance).  
     - **What to Tune**:  
       - Adjust **group-specific thresholds** to balance error rates.  
       - Modify the **algorithm** (e.g., fairness constraints, re-weighting) to minimize error rate disparities without decimating utility.  
     - **Screens That Pass Now But Would Fail**:  
       - A model with equal selection rates (passes 4/5) but higher FNR for Group B (more qualified candidates incorrectly rejected).  
       - A screen with "fair" scores (calibrated) but uniform thresholds, leading to higher FPR for Group A if base success rates differ.  
     - **Screens That Fail Now But Would Pass**:  
       - A procedure with justified disparities (e.g., 70% selection for Group A vs. 50% for Group B, ratio=0.71) but equal FPR/FNR across groups.  
       - A screen using group-specific thresholds to equalize TPR, even if selection rates differ.

  **Verdict:** The four-fifths rule, as practiced, presupposes a **rebuttable presumption model** centered on unexplained disparate impact—not a coherent philosophical conception of fairness, but a procedural mechanism blending pragmatic outcome monitoring with process-based justification.
