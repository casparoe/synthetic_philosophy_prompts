  ### Activity Design: Separating Risk Attitude from Utility Curvature

  **Objective:** Demonstrate that risk-weighted expected utility (REU) isn't just EU with a curved utility function, using a currency with linear marginal utility (raffle tickets for a fixed prize). 

  **Materials:**  
  - Raffle tickets (1 ticket = 1 entry for a $50 gift card)  
  - Random number generator (e.g., 10-sided die, app, or deck of cards)  
  - Worksheets for choices (see tables below)  
  - Display for instructions/outcomes  

  **Payoff Scheme:**  
  - Only **one** choice (randomly selected post-activity) determines tickets:  
    1. Randomly pick 1 of 3 rounds.  
    2. Randomly pick Choice 1 or 2 in that round.  
    3. Resolve the student’s selected option for that choice.  
  - Prize raffle held after class.  

  **Key Rules:**  
  - **Linear marginal utility:** Emphasize that tickets are linear in value (e.g., "100 tickets = 100x the chance of winning $50").  
  - **No EU talk:** Avoid terms like "expected value" until debrief.  
  - **Anonymity:** Students submit choices privately (e.g., Google Form or paper) to reduce peer influence.  

  ---

  ### Activity Flow (80 minutes)  
  **Round 1: Trivial Stakes (15 min)**  
  *Frame: "Small warm-up with low ticket amounts."*  
  - **Choice 1:**  
    - Option A: **10 tickets for sure.**  
    - Option B: **90% chance of 11 tickets, 10% chance of 0 tickets.**  
  - **Choice 2:**  
    - Option C: **10% chance of 11 tickets, 90% chance of 0 tickets.**  
    - Option D: **9% chance of 10 tickets, 91% chance of 0 tickets.**  

  **Round 2: Scaled-Up Stakes (20 min)**  
  *Frame: "Now with 10x higher stakes."*  
  - **Choice 1:**  
    - Option A': **100 tickets for sure.**  
    - Option B': **90% chance of 110 tickets, 10% chance of 0 tickets.**  
  - **Choice 2:**  
    - Option C': **10% chance of 110 tickets, 90% chance of 0 tickets.**  
    - Option D': **9% chance of 100 tickets, 91% chance of 0 tickets.**  

  **Round 3: News Update (20 min)**  
  *Frame: "We ran a test draw—it doesn’t change your odds, but here’s what happened..."*  
  - **News:** "We drew a random number for practice. It was a losing number (0 tickets), but it was **discarded and put back**. Probabilities are unchanged."  
  - **Re-choose for Round 2’s options** (same as A'/B'/C'/D').  

  ---

  ### Debrief (25 min)  
  **Step 1: Reveal Choices**  
  - Poll class results (anonymously):  
    - Round 1: How chose A (over B)? D (over C)?  
    - Round 2: Same for A' and D'.  
    - Round 3: Who switched choices after the news?  

  **Step 2: Introduce EU Violation**  
  - *"With linear utility, EU says: If you picked A over B, you should pick C over D. Why? Let’s calculate..."*  
    - EU(B) = 0.9×11 + 0.1×0 = 9.9 → A (10) > EU(B)  
    - EU(D) = 0.09×10 + 0.91×0 = 0.9 → EU(C) = 0.1×11 = 1.1 > EU(D)  
    - **But many pick A and D—contradiction!**  

  **Step 3: Risk-Weighted EU (REU)**  
  - *"REU weights outcomes by how likely you are to do at least this well. For example, in Option B’:*  
    - Best outcome (110): Weight = \( w(0.9) \)  
    - Worst outcome (0): Weight = \( w(1.0) - w(0.9) \)  
    - REU(B’) = \( w(0.9) \times 110 \)  
  - *"Risk aversion: If \( w(0.9) < 0.9 \), you underweight good outcomes. Picking A’ over B’ implies \( w(0.9) < 100/110 \approx 0.91 \).*  
  - *"Picking D’ over C’ requires \( w(0.09)/w(0.1) > 1.1 \)—you overweight tiny probabilities."*  

  **Step 4: News Round & Pumpability**  
  - *"The news didn’t change any outcome or probability. Did anyone switch? If we kept ‘testing’ and drawing losing numbers, would you keep switching? REU says no—it only cares about final probabilities."*  
  - **Pumpability Q:** *"If I did 100 test draws (all losing, all put back), would you revert to your original choice? Or would uncertainty fatigue change your risk attitude?"*  

  **Step 5: Trade-offs**  
  - *"To keep REU, you give up EU’s simplicity. But you gain: Explaining why people pay for both lotteries and insurance, or why the same person picks A’ and D’. It’s not utility curvature—it’s risk as a separate parameter."*  

  ---

  ### Predictable Challenges & Limitations  
  **What will go sideways:**  
  1. **Misunderstanding linearity:** Students may still invoke "diminishing returns" for tickets.  
     - *Mitigation:* Stress that 100 tickets = 100 independent raffle entries.  
  2. **Round 3 confusion:** Students may think the test draw changes probabilities ("gambler’s fallacy").  
     - *Mitigation:* Explicitly state: "The test draw was discarded. Your actual odds are identical to Round 2."  
  3. **Selection bias:** Only 1 choice counts, so some may not take all rounds seriously.  
     - *Mitigation:* Warn that skipping rounds forfeits raffle eligibility.  
  4. **Time crunch:** Resolving lotteries for 24 students takes time.  
     - *Mitigation:* Use apps (e.g., random.org) for instant draws.  

  **Classroom limitation:**  
  - **Hypothetical stakes vs. real life:** Even with raffle tickets, choices may not reflect true risk attitudes (e.g., students treat tickets as "fun" currency). REU models deep, context-dependent preferences—hard to replicate in a game.  

  ---

  ### Worksheet Example  
  **Round 1**  
  | Choice | Option A | Option B |  
  |--------|----------|----------|  
  | 1      | 10 tickets (sure) | 90%: 11 tickets, 10%: 0 tickets |  
  | 2      | 10%: 11 tickets, 90%: 0 tickets | 9%: 10 tickets, 91%: 0 tickets |  

  **Round 2**  
  | Choice | Option A' | Option B' |  
  |--------|-----------|-----------|  
  | 1      | 100 tickets (sure) | 90%: 110 tickets, 10%: 0 tickets |  
  | 2      | 10%: 110 tickets, 90%: 0 tickets | 9%: 100 tickets, 91%: 0 tickets |  

  **Round 3**  
  *Same as Round 2, after news.*  

  ---  
  This design forces confrontation with risk attitude independent of utility curvature, using the Allais paradox at two stakes and "irrelevant news" to test robustness. The debrief maps choices directly to REU’s probability weighting, priming deeper discussion on rational choice foundations.
