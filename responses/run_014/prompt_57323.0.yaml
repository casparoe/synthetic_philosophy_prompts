        B': 90% chance of 110 tickets, 10% chance of 0 tickets.

     Choice 2:
        C': 10% chance of 110 tickets, 90% chance of 0 tickets.
        D': 9% chance of 100 tickets, 91% chance of 0 tickets.

   Round 3: Same as round 2, but with the news announcement.

   We will create a worksheet for each student to record their choices.

   We will also need a random method to select the round and choice at the end, and to resolve the lotteries.

   We can use a random number generator for the lotteries (e.g., a 10-sided die or a computer).

   Debrief questions:

     - "In round 1, how many of you chose A in choice 1? How many chose B? How many chose C in choice 2? How many chose D?"
     - "In round 2, same questions."
     - "In round 3, did anyone change their choice in either decision from round 2? How many?"

     Then we explain the expected utility calculation and the violation.

     Then we introduce REU.

     Finally: "The news in round 3 did not change the actual probabilities. So if you changed your choice, what was your reason? If we kept drawing practice balls and putting them back, would you keep changing your mind?"

   We hope to see that in round 1 and 2, a significant number choose A and D, violating EU. And in round 3, some might switch due to the salience of the loss, but ideally they shouldn't.

   Let's hope it works!
