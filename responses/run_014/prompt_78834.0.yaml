  3.  **Application of PP-3 Trigger to Inoculant (Correct):**
      *   **Quote:** "PP-3 is the reading that governs. The threatened harm is serious and irreversible if it occurs, since the permanent local loss of a native species is not recoverable. The pathway condition is met too, because the two consortium strains colonize the same root niche as the native species, so competitive displacement is a live mechanism rather than a bare possibility."
      *   **Assessment:** This is a strong application of the PP-3 trigger to the *inoculant*. It correctly identifies the threatened harm (permanent local species loss) as serious/irreversible. It correctly identifies the plausible causal pathway (competitive displacement via shared root niche colonization). It correctly distinguishes this from "bare possibility". This justifies triggering PP-3 regarding the inoculant activity.
      *   **Severity:** N/A (Correct)

  4.  **Application of PP-2 (Incorrect - Misapplication of Default Rule):**
      *   **Quote:** "PP-2 applies as well, since the registrant is the proponent of the activity and must show that it is acceptably safe. It has not: three years of yield data say nothing about native fungi. **The default under PP-2 is therefore to withhold registration, which here means imposing the five-year moratorium.**"
      *   **Assessment:** This misapplies the course apparatus regarding PP-2 and the default rule. The apparatus explicitly states: "PP-2 does not by itself make prohibition the default." PP-2 is purely procedural; it shifts the burden of proof (argumentative burden) to the proponent to demonstrate safety. It does *not* dictate the substantive outcome (prohibition) if the burden isn't met. The substantive outcome comes from applying PP-1 or PP-3. Here, the student incorrectly treats PP-2 as creating a substantive default rule of prohibition if the burden isn't met. This is a significant conceptual error.
      *   **Correction:** A full-credit answer would state: "PP-2 applies, shifting the burden to the registrant to demonstrate the inoculant's safety regarding native fungi. The registrant has not met this burden (yield data ≠ ecological safety data). However, PP-2 does not dictate the outcome; the substantive decision comes from applying PP-3 (or PP-1). PP-3, triggered by the threat of irreversible harm via a plausible pathway, requires restriction pending safety demonstration, supporting the moratorium." The *outcome* (moratorium) is justified by PP-3, not by a non-existent default rule in PP-2.
      *   **Severity:** Major (Fundamental misreading of apparatus)

  5.  **Application of Symmetry Requirement (Partially Correct, Major Omission):**
      *   **Quote:** "The symmetry requirement requires that the moratorium's harms be entered on the same footing as the harms it averts. The cost side includes the yield gains and the nitrogen savings that farmers give up for five years, which are real but recoverable. Weighed against the possible permanent loss of a native species, the species loss dominates: a recoverable five-year delay in cost savings cannot outweigh an irreversible ecological loss."
      *   **Assessment:** The student correctly identifies the *principle* of symmetry (harms of measure vs. harms averted on same footing/currency). They correctly identify one set of "harms" of the moratorium: forgone benefits (yield gains, nitrogen savings) and correctly characterize them as recoverable. They correctly identify the harm averted (possible irreversible species loss). However, the student **completely omits the primary *harm* caused by the moratorium as identified in the scenario: the continued nitrogen runoff into the watershed.** The scenario explicitly states: "the agency's own modelling estimates that during the moratorium farmers would keep applying synthetic nitrogen at current rates, so nitrogen runoff into the watershed would continue at current levels rather than fall; the agency treats that runoff as a harm to the watershed, and one that is reversible once loading falls." Failing to include this concrete, recognized harm caused by the precautionary measure (the moratorium) is a critical omission violating the symmetry requirement. Only comparing forgone *benefits* (cost savings) to averted ecological harm is insufficient and misapplies symmetry. Symmetry requires comparing the *harms caused by the measure* (continued runoff harm) to the *harms averted by the measure* (potential species loss). Full credit requires including and weighing the runoff harm.
      *   **Correction:** A full-credit answer would state: "Symmetry requires weighing the harms *caused* by the moratorium against the harms it *averts*. The moratorium causes continued nitrogen runoff (a reversible harm to the watershed) and forgoes yield gains/cost savings (recoverable economic harms). It averts the potential irreversible loss of a native fungal species. We must weigh the reversible watershed harm and recoverable economic costs against the potential irreversible ecological harm." The conclusion about species loss dominating might still be defensible, but only *after* including the runoff harm in the calculus.
