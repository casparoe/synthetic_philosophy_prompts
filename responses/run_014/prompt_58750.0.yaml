answer: |-
  *(Leans back, smirking)* Alright, look. Everyone *chose* to give Maya their token for dumplings. Voluntary trade. She earned those tokens fair and square. Now she’s got ‘em, she can *spend* ‘em however she wants—that’s her right. Booking the machines? That’s just her using her property. You don’t *have* to babysit her kids for a slot—that’s *your* choice too. Walk away! But if you *do* deal, that’s another voluntary trade. Taking tokens *back* from her later ’cause you don’t like how she spent ‘em? *That’s* stealing. Period. Fair isn’t forced equality—it’s honoring the deals people make. Don’t like the outcome? Don’t give her your token next time. Simple.  

  *(Shrugs)* Bossing her around *after* she played by the rules? That’s the real theft.
