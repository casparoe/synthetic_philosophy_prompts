  I am an evolutionary biologist who works on signaling and communication — honest signals, costly signaling theory, indices, handicaps, deception, mimicry, aggressive mimicry, eavesdropping, the whole behavioral ecology toolkit. I keep hearing colleagues in AI safety talk about "deceptive alignment" and "the treacherous turn" as if they have discovered something profound, and I suspect it is just the problem of deceptive signaling in a new technical setting. But I want to give the argument a fair hearing before I dismiss it.

