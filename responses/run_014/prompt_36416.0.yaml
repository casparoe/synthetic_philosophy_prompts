prompt: |-
  I run the disagreement reviews at a mid-size reinsurance firm — whenever two of our teams give materialy different probability estimates for the same risk (a pandemic loss year, a specific counterparty defaulting within five years, whatever), my job is to figure out whether we can pool them into one number or whether the difference needs to go up the chain. I recently got interested in Aumann's agreeing-to-disagree result and the whole "common prior assumption" debate behind it — the idea being that if two rational parties have common priors, then once they've shared their evidence they shouldn't still disagree, so persistent disagreement is either unshared information or a difference in priors themselves. I want that operationalized. Please write a procedure my analysts can run in a single afternoon meeting with both teams present: the questions to ask in order, what counts as a sufficient answer at each step, where the procedure terminates in "pool the estimates" versus "escalate, because this is a prior-level difference, not an info-level one," and — this matters — which steps are honestly just judgment calls dressed up as a checklist. Then run it on two cases: (1) our epidemiology team puts 12% on a major pandemic loss year and our cat-modeling team puts 7%, and probing reveals they're feeding off different base datasets neither can fully articulate; (2) two veteran underwriters who have sat in the same meetings and seen all of each other's evidence still disagree 8% vs 25% on a counterparty defaulting, because one of them thinks the whole credit-rating framework is broken post-2008 and the other thinks that's paranoia. Include at least one case where the procedure gives an answer I won't like, and say plainly where the procedure will misfire.
reasoning: |-
  We are designing a procedure based on Aumann's agreement theorem to determine if the disagreement between two teams is due to unshared information (which can be resolved by sharing) or due to differences in priors (which may require escalation). The procedure will be structured as a checklist for an afternoon meeting with both teams.

  ### Procedure: Resolving Disagreements via Information and Prior Alignment

  **Objective:** To determine if the disagreement can be resolved by sharing information (then pool the estimates) or if it stems from fundamentally different priors (then escalate).

  #### Step 0: Preparation
  - **Action:** Each team prepares a concise summary of their estimate, the key evidence they used, and the reasoning that led to their number. They must also be prepared to share any data or models that support their estimate.
  - **Sufficient Answer:** Written summaries and supporting materials are shared with the other team and the facilitator (you) at least one day before the meeting.

  #### Step 1: Share All Information
  - **Action:** In the meeting, each team presents their evidence and reasoning. The other team is allowed to ask clarifying questions. The goal is to ensure that all information is on the table.
  - **Key Questions:**
    - "Can you walk us through the key pieces of evidence and reasoning that led to your estimate?"
    - (To the other team) "After hearing this, do you have any questions to clarify the evidence or reasoning?"
    - (After both presentations) "Is there any critical information that either team has not shared yet? If so, please share it now."
  - **Sufficient Answer:** Both teams acknowledge that they have heard and understood the other's evidence and reasoning. Any unshared information is now shared.
  - **Judgment Call:** Assessing whether the information has been fully shared and understood. This may require the facilitator to probe for hidden assumptions or data.
  - **Termination Condition:** If after this step, one or both teams change their estimate such that they now agree, then pool the estimates (use the new agreed-upon estimate). If not, proceed to Step 2.

  #### Step 2: Identify the Source of Discrepancy
  - **Action:** The teams jointly examine the points of disagreement in the reasoning. The facilitator helps break down the reasoning chain into components (e.g., for a pandemic: base rate, current indicators, model assumptions).
  - **Key Questions:**
    - "Where exactly in the reasoning chain do the two estimates diverge? Let's break it down step by step."
    - "For each diverging point, is the difference due to different data, different interpretation of the same data, or different assumptions (including model choices)?" 
  - **Sufficient Answer:** A clear mapping of the disagreement points and their nature (data, interpretation, or assumptions).
  - **Judgment Call:** Deciding how granular to break down the reasoning and categorizing the nature of the difference. This requires subjective judgment.

  #### Step 3: Resolve Data Differences (If Any)
  - **Action:** If the teams used different datasets, attempt to reconcile by:
    - Comparing the datasets and identifying overlaps and gaps.
    - Deciding on a common dataset (if possible) or a method to combine them (e.g., meta-analysis).
  - **Key Questions:**
    - "Can we agree on a single dataset to use? If not, can we combine the datasets in a principled way?"
    - "If we use the same dataset, do the estimates converge?"
  - **Sufficient Answer:** Either the teams agree on a common dataset (or combined approach) and recalculate their estimates, or they cannot and must explain why (e.g., one dataset is considered unreliable by one team).
  - **Termination Condition:** If the estimates converge after using the same data, pool the estimates. If not, proceed to Step 4.
  - **Judgment Call:** Deciding if a dataset is reliable or if a combination method is acceptable.

  #### Step 4: Resolve Interpretation Differences (If Any)
  - **Action:** If the disagreement is due to different interpretations of the same data, the teams must explain their interpretations and try to find a common ground.
  - **Key Questions:**
    - "Why do you interpret this data point differently? What is the reasoning behind your interpretation?"
    - "Is there a third interpretation we can agree on? Or can we design an experiment or find additional data to test which interpretation is more valid?"
  - **Sufficient Answer:** Either the teams agree on a common interpretation and recalculate (leading to convergence) or they cannot and must explain why (e.g., the difference is due to fundamental beliefs that cannot be tested with current data).
  - **Termination Condition:** If the estimates converge, pool. If not, proceed to Step 5.
  - **Judgment Call:** Evaluating whether an interpretation is reasonable and whether a compromise is valid.

  #### Step 5: Examine Assumptions (Including Priors)
  - **Action:** Focus on the assumptions that differ. This includes model choices, prior beliefs, and structural assumptions (like the credit-rating framework being broken). The teams must articulate their assumptions and the reasons for holding them.
  - **Key Questions:**
    - "What specific assumption leads to this part of your estimate? Why do you hold that assumption?"
    - "Is this assumption testable with data we have (or could get)?"
    - "If we cannot test it, is this assumption a fundamental prior belief (e.g., about how the world works) that is not likely to change with more data?"
  - **Sufficient Answer:** Clear articulation of the assumptions and whether they are testable or are deep priors.
  - **Termination Condition:** 
    - If the assumption is testable with available data (or data that can be gathered quickly), then agree to test it and recalculate. If the estimates then converge, pool. 
    - If the assumption is not testable and represents a fundamental prior difference (e.g., one team believes credit ratings are broken and the other doesn't), then **escalate** because this is a prior-level difference.
  - **Judgment Call:** Deciding if an assumption is testable and whether it is a deep prior. This is the most subjective step.

  #### Step 6: Final Decision
  - **Action:** After the above steps, if the teams have not converged, the disagreement is due to prior differences. Escalate to higher management with a clear report of:
    - The two estimates.
    - The shared information.
    - The points of disagreement (data, interpretation, assumptions) and the unresolved prior differences.
  - **Termination:** Escalate.

  ### Running the Procedure on Cases

  #### Case 1: Pandemic Loss Estimates (12% vs 7%)
  - **Step 1:** Teams share their datasets and reasoning. It's revealed they use different base datasets (neither can fully articulate why, but they are historical pandemic data from different sources).
  - **Step 2:** Disagreement is traced to the base datasets and how they are used in the models.
  - **Step 3:** Attempt to reconcile data:
    - Compare datasets: They cover different time periods and regions. 
    - Attempt to combine: The teams agree to use a merged dataset (if feasible in the meeting) or a standard industry dataset. 
    - Outcome: After recalculating with the same dataset, the estimates become 10% and 9%. They are now close. 
    - **Decision:** Pool the estimates (e.g., average to 9.5% or use a weighted average). 
    - **Why:** The difference was primarily due to unshared information (different data) which was resolved.

  #### Case 2: Counterparty Default (8% vs 25%)
  - **Step 1:** Both teams have seen all the same evidence (same meetings, same data). They share again, but no new information is added.
  - **Step 2:** The divergence is in the interpretation of the counterparty's credit rating and the overall reliability of the credit-rating framework.
  - **Step 3 and 4:** No data differences. Interpretation difference: 
    - Team A (8%) trusts the rating and the framework. 
    - Team B (25%) thinks the framework is broken post-2008 and adjusts the rating downward.
  - **Step 5:** Examine assumptions:
    - Team B's assumption: "Credit ratings are systematically biased and cannot be trusted without a heavy discount."
    - Team A's assumption: "The credit-rating framework, while imperfect, is the best available tool and adjustments are already factored in."
    - Testability: The teams cannot test this assumption with current data (it's about future reliability and systemic bias). It's a fundamental prior about the world.
    - **Decision:** Escalate because this is a prior-level difference. The teams won't agree by sharing information.

  #### Case 3: A Case You Won't Like (Procedure Misfire)
  - **Scenario:** Two teams disagree on the probability of a natural catastrophe in a region: 15% vs 5%. 
  - **Step 1:** They share information. Both have the same data but different models (one uses a Bayesian network, the other a frequentist approach). 
  - **Step 2-4:** They try to reconcile by using the same data and even the same interpretation, but the models produce different results. 
  - **Step 5:** The assumption difference: one team assumes stationarity of the climate (frequentist model) and the other does not (Bayesian model with a non-stationary prior). 
    - The teams argue about whether the climate is stationary. This is testable in principle with historical data, but the test is complex and cannot be done in the meeting. 
    - **Judgment Call:** The facilitator must decide: is this a prior-level difference or just an unshared information issue (because the test hasn't been done)? 
      - If the facilitator decides it's testable and the test can be done quickly, they might delay the decision to run the test. 
      - But if the facilitator decides it's a deep prior (one team fundamentally believes in non-stationarity and the other doesn't) then they escalate. 
  - **Misfire:** The procedure might misfire here because the facilitator might incorrectly judge the assumption as a deep prior when it is actually testable (or vice versa). This could lead to unnecessary escalation (if testable) or a forced and invalid pooling (if not). 

  ### Where the Procedure Will Misfire
  - **Subjectivity in Steps 2, 4, and 5:** The breakdown of the reasoning and the categorization of differences (data, interpretation, assumption) is judgment-based. Misclassification can occur.
  - **Step 5 (Assumptions):** The line between a testable assumption and a deep prior is blurry. What one person sees as a testable model choice, another might see as a core belief. 
  - **Time Constraints:** The procedure is designed for one afternoon. Complex reconciliations (like merging datasets or running new tests) might not be feasible, forcing a judgment call to escalate prematurely.

  ### Conclusion
  This procedure provides a structured way to apply Aumann's insight. It will work best when disagreements are due to unshared information or resolvable model differences. It will break down when there are truly irreconcilable prior beliefs or when the judgment calls are incorrect. The key is to document the process so that even when escalating, the reason is clear.
answer: |-
  Below is a step-by-step procedure for your analysts, designed to operationalize Aumann's theorem in a single afternoon meeting. The goal is to distinguish between disagreements resolvable by sharing information ("info-level") and those rooted in irreconcilable prior beliefs ("prior-level"). Steps requiring judgment calls are explicitly flagged.  

  ---

  ### **Disagreement Resolution Procedure**  
  **Objective:** Determine if disagreement stems from (a) *unshared information* (pool estimates) or (b) *divergent priors* (escalate).  
  **Time:** 3-hour meeting with both teams + facilitator (you).  
  **Materials:** Whiteboard, shared document for notes.  

  #### **Step 0: Independent Briefing (Pre-Meeting)**  
  - **Action:** Each team submits a 1-pager:  
    - Their estimate (e.g., "7% probability").  
    - Key evidence (data, models, assumptions).  
    - Reasoning chain (e.g., "Base rate X + Indicator Y → Estimate Z").  
  - **Sufficient Answer:** Both documents received 24h pre-meeting. Proceed if both are clear and complete.  

  #### **Step 1: Share All Evidence Aloud (20 min)**  
  - **Action:** Teams take turns presenting their evidence. No debate yet.  
  - **Key Questions:**  
    - "What specific data/inputs did you use?"  
    - "What assumptions bridge your data to your estimate?"  
  - **Sufficient Answer:** Both teams confirm: "We’ve heard all evidence."  
  - **Judgment Call?** Minimal. Focuses on facts, not interpretation.  

  #### **Step 2: Identify Overlaps/Gaps in Evidence (20 min)**  
  - **Action:** Map evidence to a shared table:  
    | **Evidence Type** | **Team A** | **Team B** | **Overlap?** |  
    |-------------------|------------|------------|--------------|  
    | Data source       | Dataset X  | Dataset Y  | No           |  
    | Assumption        | A1         | B1         | Partial      |  
  - **Key Question:**  
    - "Is there evidence one team has that the other lacks?"  
  - **Sufficient Answer:** Explicit list of unshared evidence.  
  - **Judgment Call?** Low. Binary (shared/not shared).  

  #### **Step 3: Re-Estimate with Full Evidence (30 min)**  
  - **Action:** Teams privately recalculate estimates using *all* evidence (theirs + the other team’s).  
  - **Key Question:**  
    - "Given *all* evidence now, what’s your revised estimate?"  
  - **Sufficient Answer:** Revised estimates shared aloud.  
  - **Termination Condition:**  
    - If estimates converge (e.g., within 2 percentage points), **POOL**.  
    - If not, proceed.  

  #### **Step 4: Break Down Reasoning Chains (40 min)**  
  - **Action:** For each team, decompose estimate into:  
    `Base Prior → Evidence Adjustments → Final Estimate`.  
  - **Key Questions:**  
    - "What base rate/prior did you start from?"  
    - "How did each piece of evidence adjust your prior?"  
    - "Where do the chains diverge?"  
  - **Sufficient Answer:** Isolated divergence points (e.g., "We weight Evidence E differently").  
  - **Judgment Call?** **YES**. Teams may rationalize past choices. Facilitator must push for honesty.  

  #### **Step 5: Stress-Test Divergence Points (40 min)**  
  - **Action:** For each divergence point, run:  
    - *Counterfactual Test:* "If you adopted the other team’s view on [specific point], how would your estimate change?"  
    - *Neutral Evidence Test:* "Is there neutral data (e.g., industry reports) that could resolve this?"  
  - **Key Questions:**  
    - "Is this divergence due to (a) missing data, (b) different interpretation, or (c) different starting beliefs?"  
  - **Sufficient Answer:**  
    - If (a) or (b): Explore resolution (e.g., seek neutral data).  
    - If (c): Flag as prior difference.  
  - **Termination Condition:**  
    - If all divergences resolved via data/interpretation, **POOL**.  
    - If prior-level differences remain, **ESCALATE**.  
  - **Judgment Call?** **YES**. Assessing if a difference is "interpretation vs. prior" is subjective.  

  #### **Step 6: Final Decision (10 min)**  
  - **Action:** Classify the disagreement:  
    - **POOL** if:  
      - Estimates converged post-evidence-sharing (Step 3), OR  
      - Divergences resolved by neutral data (Step 5).  
    - **ESCALATE** if:  
      - Teams agree on all evidence but disagree on priors (Step 5).  
  - **Output:** 1-paragraph summary for the record.  

  ---

  ### **Case Applications**  

  #### **Case 1: Pandemic Loss (12% vs. 7%)**  
  - **Step 1:** Teams share evidence. Epi team uses real-time outbreak data; cat-modeling team uses historical loss databases.  
  - **Step 2:** Overlap? None. Different datasets, neither fully articulated.  
  - **Step 3:** Re-estimate. Epi team adjusts to 10% using historical data; cat-modeling team adjusts to 9% using outbreak data.  
  - **Step 4:** Divergence point: Epi team weights recent outbreaks heavily; cat-modeling weights long-term averages.  
  - **Step 5:** *Counterfactual Test:* If epi team used historical data more, they hit 9.5%. If cat-modeling used outbreak data, they hit 10%.  
    *Neutral Evidence Test:* Agree to use WHO pandemic severity index (neutral data). Revised estimates: 9.8% vs. 9.6%.  
  - **Step 6:** **POOL** at ~9.7%.  
  - **Why:** Unshared information caused disagreement. Sharing + neutral evidence resolved it.  

  #### **Case 2: Counterparty Default (8% vs. 25%)**  
  - **Step 1:** Both teams share identical evidence (same meetings, same reports).  
  - **Step 2:** Overlap? Full. No unshared evidence.  
  - **Step 3:** Re-estimate. Estimates unchanged (8% vs. 25%).  
  - **Step 4:** Divergence point: Underwriter A trusts credit ratings ("BBB = reliable"); Underwriter B thinks ratings are broken post-2008.  
  - **Step 5:** *Counterfactual Test:* If B trusted ratings, estimate drops to 9%. If A distrusted ratings, estimate jumps to 22%.  
    *Neutral Evidence Test:* No neutral data exists—dispute is about the rating framework’s validity.  
  - **Step 6:** **ESCALATE**. Core difference in priors (trust in institutional frameworks).  
  - **Why:** Shared evidence but irreconcilable prior beliefs.  

  #### **Case 3: The Answer You Won’t Like (Procedure Misfire)**  
  - **Scenario:** Two teams disagree on climate change impact on hurricane losses (Team X: 15%, Team Y: 5%).  
  - **Process:**  
    - Step 1-3: Share all data. Both use same climate models but disagree on emission-scenario weighting. Re-estimates: 14% vs. 6%.  
    - Step 4: Divergence point: X weights IPCC "high-emission" scenarios; Y weights "low-emission" ones.  
    - Step 5: *Counterfactual Test:* Estimates shift but stay 10% apart. *Neutral Evidence Test:* None—IPCC scenarios are equally valid.  
    - **Step 6:** Facilitator judges this as "prior-level" (escalate).  
  - **Why You’ll Hate It:** This *could* be an info-level gap (e.g., new data on emission trajectories exists), but the procedure forces escalation if neutral evidence is unavailable. Teams may resent not escalating "obvious" disagreements.  
  - **Where It Misfires:** When "neutral evidence" exists but isn’t accessible in the meeting. Judgment calls in Step 5 may prematurely escalate resolvable disputes.  

  ---

  ### **Where the Procedure Misfires**  
  1. **False Escalations:**  
     - If teams *could* resolve disagreements with more time/data (Case 3), but the meeting forces a binary choice.  
     - **Mitigation:** Allow a "tiered escalation" (e.g., "2-week data-gathering period" before full escalation).  
  2. **False Pooling:**  
     - If teams superficially converge but harbor unresolved prior differences (e.g., one team acquiesces to avoid conflict).  
     - **Mitigation:** In Step 5, require explicit rationale for estimate changes.  
  3. **Judgment Call Failures:**  
     - Misclassifying a prior difference as "interpretation" (or vice versa) in Step 5.  
     - **Mitigation:** Use a voting rule (e.g., if ≥2/3 of divergence points are prior-level, escalate).  

  **Final Note:** This procedure makes implicit disagreements explicit but can’t eliminate subjectivity. Its value is in forcing teams to articulate *why* they disagree—turning a debate about numbers into a debate about beliefs.
