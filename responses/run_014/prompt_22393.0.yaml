prompt: |-
  Give an example of a binary collective decision problem in which the Condorcet jury theorem’s usual conclusion—that majority accuracy increases with group size—does not follow because the voters’ signals are correlated through a shared epistemic source, even though each voter is individually more likely than not to be correct; specify the correlation structure, explain how the probability that the majority is correct behaves as the group size increases, and say what this implies for using forecast aggregation as an epistemic device.
reasoning: |-
  We are going to construct an example where the Condorcet jury theorem fails due to correlated signals.
   The Condorcet jury theorem assumes that voters' signals are conditionally independent given the state of the world.
   We will break that by having a shared epistemic source that causes the voters' signals to be correlated.

   Setup:
   - There is a binary state of the world: ω ∈ {0, 1}. Without loss of generality, assume that ω=1 is the true state.
   - Each voter i receives a signal s_i ∈ {0,1}. We want each voter to be individually more likely than not to be correct: 
     P(s_i = ω | ω) > 0.5.

   However, we will introduce a common source of error. Specifically, imagine that there is a single "expert" who has a noisy signal about the state.
   Then, each voter's signal is actually a copy of this expert's signal (or with some independent noise, but let's make it simple).

   Example design:
   - Let the true state be ω = 1.
   - The expert observes the state and flips a coin: 
       With probability p, the expert reports the truth (so 1).
       With probability 1-p, the expert reports 0 (false).
   - Then, each of the n voters is given the expert's report. So all voters have the same signal.

   Now, if the expert is correct (which happens with probability p), then all voters are correct. If the expert is wrong, then all voters are wrong.

   Therefore, the majority vote will be:
     - If the expert is correct (prob p), then all voters vote correctly so the majority is 100% correct.
     - If the expert is wrong (prob 1-p), then all voters vote incorrectly so the majority is 0% correct.

   Therefore, the probability that the majority is correct is exactly p.

   Now, note that each voter is individually correct with probability p. We require p>0.5 for the individual competence.

   However, as the group size n increases, the majority accuracy does not change: it remains p. In fact, it is independent of n.

   This violates the Condorcet jury theorem, which would predict that the majority accuracy goes to 1 as n→∞.

   Why? Because the signals are perfectly correlated: all voters get the same signal.

   Therefore, we have:
     - Each voter is correct with probability p>0.5 (so individually competent).
     - The majority accuracy is p (same for any group size).

   This implies that having more voters does not help at all.

   For forecast aggregation as an epistemic device, this example shows that if there is a shared source of error (like relying on the same expert), 
   then increasing the number of people who rely on that expert does not improve the collective accuracy. In fact, the group is only as good as the expert.

   To break the independence, we need to have independent sources of information. Without independence, the wisdom of crowds may not emerge.

   However, note that in reality, we might have partial correlation. We can adjust the example to have a mixture of independent and common noise.

   But the extreme case above clearly shows the failure.

   Let's write down the example with specific numbers.

   Example:
     Let p = 0.6 (so each voter is 60% likely to be correct).
     Then, for any group size n (odd, for majority to be well-defined), the probability that the majority is correct is 0.6.

     For n=1: 0.6
     For n=3: 
          Either all are correct (prob 0.6) -> majority correct, 
          or all are wrong (prob 0.4) -> majority wrong.
          So P(majority correct) = 0.6.

     Similarly for any n.

   Thus, the majority accuracy does not increase with n; it remains constant at 0.6.

   This implies that for forecast aggregation to work well, we must have independent sources of information. 
   If all the information comes from a single source, then having more people does not add any new information and hence does not improve the accuracy.

   In practice, we should seek diversity in information sources to break the correlation.
answer: |-
  ### Example: Correlated Voters Due to a Shared Expert

  Consider a binary decision problem where the true state of the world is **ω = 1** (e.g., "Defendant is guilty"). Voters receive signals from a single expert, whose report is broadcast to all. The expert has a fixed accuracy of **p = 0.6**, meaning:  
  - With probability 0.6, the expert reports correctly (**s_i = 1** for all voters).  
  - With probability 0.4, the expert reports incorrectly (**s_i = 0** for all voters).  

  **Correlation structure:**  
  All voters receive the **identical signal** from the expert. Thus, their signals are perfectly correlated:  
  - If the expert is correct, all voters are correct.  
  - If the expert is wrong, all voters are wrong.  

  #### Individual Competence  
  Each voter is individually correct with probability **0.6 > 0.5**, satisfying the individual competence requirement of the Condorcet Jury Theorem (CJT).  

  #### Majority Accuracy  
  The majority vote outcome depends **entirely on the expert’s report**:  
  - For an **odd group size \(n\)**:  
    - If the expert is correct (prob. 0.6), **all \(n\) voters vote correctly**, so majority accuracy = 1.  
    - If the expert is wrong (prob. 0.4), **all \(n\) voters vote incorrectly**, so majority accuracy = 0.  
  - **Result**:  
    \[
    P(\text{majority correct}) = P(\text{expert correct}) = 0.6 \quad \text{for all} \quad n.
    \]  

  #### Behavior as Group Size Increases  
  - **n = 1**: Accuracy = 0.6.  
  - **n = 3**: Accuracy = 0.6 (all vote identically; no benefit from aggregation).  
  - **n → ∞**: Accuracy remains **0.6**, **not converging to 1**.  

  This violates the CJT, which would predict accuracy → 1 as \(n\) → ∞.  

  ### Implications for Forecast Aggregation  
  1. **Failure of Independence**:  
     The CJT’s conclusion breaks because voters’ signals are **not conditionally independent** given ω. A shared epistemic source (the expert) creates perfect correlation.  
  2. **Epistemic Risks**:  
     - **No wisdom of crowds**: Larger groups add no new information when all rely on the same source.  
     - **Fragility**: The group’s accuracy is **bounded by the source’s accuracy** (here, 0.6). If the source is biased or unreliable, aggregation fails to correct errors.  
  3. **Practical Guidance**:  
     - **Diversify information sources** to reduce correlation.  
     - **Independence is critical**: Aggregation only improves accuracy when individual judgments derive from **independent evidence**.  

  > **Key Takeaway**: Forecast aggregation is an unreliable epistemic device when decision-makers share a common epistemic source. Independence is not just beneficial—it is *necessary* for the "wisdom of crowds" to emerge.
