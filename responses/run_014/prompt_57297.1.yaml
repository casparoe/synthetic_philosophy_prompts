prompt: |-
  I chair my hospital's committee on novel and non-protocol interventions: roughly once a month we receive a request to permit something whose evidence base is thin — an unapproved device for a single patient, a prediction algorithm validated only retrospectively, a protocol adapted from an analogous condition. Our members are clinicians and administrators with no decision theory, we have forty minutes per case, and the chief medical officer signs off on our recommendation. I want a decision procedure the committee can actually run, not an essay on ambiguity aversion.

  The procedure should preserve what I take to be the substance of the Ellsberg material rather than its slogan. Reluctance to act when probabilities are imprecise is not one thing, and it matters whether we have no information at all, information from a source we cannot evaluate, or conflicting information from sources we can evaluate separately. Aversion to an unfamiliar source often shrinks once that source is judged on its own instead of against a familiar benchmark; a committee that always sees the novel request next to standard care will be systematically harsher than one that sometimes does not. And the formal responses are different procedures with different consequences, not interchangeable glosses: adopting a set of admissible probability judgments rather than a single one; choosing what performs best under the least favorable member of that set; or declining to rank at all and defaulting to the status quo until some option dominates. Tell me which of these you are building into our workflow, and what following each of the others would have required instead. The procedure must also include a step that decides whether further evidence could reduce the ambiguity or would only relocate it, and it should treat squarely the possibility that commissioning another study is itself a way of avoiding the decision.

  Then run it on three cases: (i) single-patient use of an unapproved implantable device for a condition with no remaining alternative, where the mechanism is plausible and three foreign case reports exist; (ii) hospital-wide deployment of a sepsis early-warning model with strong retrospective performance on our own data, no prospective validation, and evidence that it underperforms in a population we serve heavily; (iii) continuation of a two-year pilot whose outcome data are mildly positive but statistically weak, and which clinicians now depend on. I expect (ii) to be permitted and (i) denied; if your procedure says otherwise, identify the conflation my expectation rests on.

  Please use these sections, in this order: "What the theory licenses" (about 250 words); "The procedure" (numbered questions in order, with what counts as a sufficient answer to each and the stopping rules for deny, permit, and permit-with-conditions; about 700 words); "Where judgment cannot be eliminated" (about 300 words); "Worked cases" (about 600 words); "How this procedure will fail" (about 250 words); and "What would change my mind" (about 200 words). In that final section, be candid about which consideration would move you to a different verdict on how much weight imprecise evidence should carry — a successful Bayesian rejoinder, a reason to think the laboratory findings do not generalize to committees deciding about identifiable patients, or a defect in how I have separated the three kinds of epistemic predicament — and say where your own reasoning is most likely to break.
reasoning: |-
  Okay, let me approach this systematically. The user chairs a hospital committee that reviews novel medical interventions with thin evidence bases, and needs a practical decision procedure grounded in ambiguity theory. They've clearly studied Ellsberg paradox deeply and want substance over slogans.

  First I need to unpack their core requirements:
  - Must distinguish between three ambiguity types: no information vs unevaluable source vs conflicting information
  - Should account for framing effects (novel vs standard care comparisons)
  - Must choose between formal approaches: admissible sets vs minimax vs status quo default
  - Needs explicit step for evaluating if more evidence would help
  - Must handle the "commissioning study as avoidance" problem
  - Requires application to three specific cases with predicted outcomes

  The user is sophisticated about decision theory but constrained by real-world limits: 40 minutes per case, non-expert committee members, CMO sign-off. Their frustration with "ambiguity aversion" as a buzzword suggests I should avoid oversimplification.

  For the procedure design, I'm considering a stepwise approach that:
  1. Classifies the ambiguity type upfront
  2. Uses different evaluation methods for each type
  3. Builds in the "admissible probabilities" framework explicitly
  4. Includes a stop rule about evidence gathering
  5. Has clear deny/permit/conditions thresholds

  The case predictions reveal their priorities: they expect approval for the algorithm (ii) but denial for the device (i), suggesting they weight population benefits over individual desperation when evidence is weak. I'll need to address this potential conflation.

  Most challenging will be balancing theoretical rigor with executable steps within the word limits. The "where judgment remains" section will be crucial - this procedure can't be fully algorithmic. I'll need to identify where committee discretion is unavoidable.

  For my own transparency, I should note in the final section that failure modes include committees misclassifying ambiguity types or underestimating clinician dependency in pilots. My biggest worry is whether minimax is too conservative for life-saving interventions.
answer: |-
  ## What the theory licenses
  Decision theory under ambiguity distinguishes epistemic states demanding different responses. True ignorance (no information) warrants status quo bias; using an unvetted source requires judging its *intrinsic* reliability, not comparing it to familiar standards; conflicting evidence permits identifying an "admissible set" of plausible probability judgments. We adopt a *minimax regret* criterion: permit an intervention if, relative to the admissible set, its *maximum possible regret* (compared to alternatives) is acceptable, or if it could dominate under plausible scenarios. This avoids conflating ambiguity types and counters framing bias by isolating source evaluation. We explicitly reject defaulting to status quo unless *no* admissible probability favors change. The procedure operationalizes these insights without requiring committee expertise in theory.

  ---

  ## The procedure
  1.  **Specify the intervention and alternatives.** What is precisely requested? What are the concrete alternatives (e.g., standard care, another novel approach, doing nothing)? *Sufficient:* Clear description of intervention and 1-3 key alternatives. *Stop if:* Intervention or alternatives are undefined. → **Deny**
  2.  **Classify the ambiguity type for primary outcomes.** Is the imprecision due to:
      *   **(A) No information?** (Truly novel mechanism/context, zero relevant data).
      *   **(B) Source unevaluable?** (Data exists but from a source/method we cannot currently assess for reliability/bias/generalizability).
      *   **(C) Conflicting evidence?** (Multiple credible sources/methods point to different probabilities).
      *   **(D) Insufficient precision?** (Data exists but is statistically weak or limited in scope, without fundamental conflict or unevaluability). *Sufficient:* Consensus on primary type (A-D). *Stop if:* Committee cannot classify after 10 mins. → **Deny** (Presumption against acting under unresolved ambiguity).
  3.  **Define the admissible set for key outcomes.** For the primary outcome(s) (efficacy, major safety):
      *   *If (A) No information:* The set includes any probability within [0,1]. Focus shifts to mechanism plausibility (Step 4).
      *   *If (B) Source unevaluable:* Judge the source *alone*. Ignore comparisons to standard care. What is the *minimum credible probability* of benefit and *maximum credible probability* of harm based solely on evaluating this source's potential biases and limitations? The set spans between these bounds.
      *   *If (C) Conflicting evidence:* Identify the *range* of probabilities suggested by the conflicting credible sources/methods. The set is this range.
      *   *If (D) Insufficient precision:* Use the confidence interval (e.g., 95% CI) as the admissible set. *Sufficient:* Defined lower bound (LB) and upper bound (UB) for probability of key benefit and key harm. *Stop if:* Cannot define LB/UB for key outcomes. → **Deny**
  4.  **Assess mechanism plausibility (if relevant).** Does the proposed biological or operational mechanism make success more likely than failure, based on established science/logic? *Sufficient:* "Yes" (>50% chance plausible), "No" (<50%), or "Unclear". *Stop if:* "No". → **Deny** (Applies mainly to A, B).
  5.  **Calculate maximum regret vs. alternatives.** For each key alternative (e.g., standard care), compare outcomes under the intervention:
      *   *Benefit Regret:* (Benefit_Alt - Benefit_Int) *if UB_Int < Benefit_Alt*
      *   *Harm Regret:* (Harm_Int - Harm_Alt) *if LB_Int > Harm_Alt*
      *   *Max Regret for Alt:* Max(Benefit Regret, Harm Regret) considering worst case *within the admissible set*.
      *   *Overall Max Regret:* Highest Max Regret across all alternatives. *Sufficient:* Numeric estimate or qualitative assessment (High/Moderate/Low/Negligible) of Overall Max Regret. *Stop if:* Cannot assess. → **Deny**
  6.  **Evaluate dominance.** Is there *any* probability within the admissible set where the intervention is clearly better (or non-inferior) on all key outcomes than *all* alternatives? *Sufficient:* Yes/No. *Stop if:* "Yes". → **Permit** (Low-regret opportunity).
  7.  **Assess evidence gathering.**
      *   *Feasibility:* Could feasible, timely evidence (e.g., registry, prospective audit, focused RCT) significantly narrow the admissible set for key outcomes? *Sufficient:* Yes/No/Uncertain.
      *   *Value:* Would reducing ambiguity change the decision? (Refer back to Max Regret - if Max Regret is already Low/Negligible, less value). *Sufficient:* High/Moderate/Low value.
      *   *Avoidance Check:* Is requesting more evidence a justified step or an avoidance tactic? (Consider patient urgency, pilot inertia). *Sufficient:* Brief justification.
  8.  **Decision Rule:**
      *   **Permit:** If (Overall Max Regret is **Negligible/Low**) OR (Evidence Gathering is **not feasible** AND Max Regret is **Moderate** AND Mechanism is **Plausible** OR (C)/(D) type ambiguity) OR (**Dominance** exists).
      *   **Permit with Conditions:** Primarily if Evidence Gathering is **Feasible & High Value**. Mandate specific data collection/review triggers tied to narrowing ambiguity (e.g., "Permit for next 5 patients with mandatory review of outcomes," "Deploy algorithm but audit performance monthly in vulnerable subgroup").
      *   **Deny:** If Max Regret is **High** OR ambiguity type is **(A) No Information** without strong dominance/plausibility OR **Stop Rules** triggered in Steps 1, 2, 3, 4 OR Evidence Gathering is **Feasible & High Value** but intervention is not urgent. *Default:* **Deny** if no rule for Permit/Permit-with-Conditions met.

  ---

  ## Where judgment cannot be eliminated
  Judgment is irreducible at critical points: classifying the ambiguity type (Step 2) involves interpreting the nature of uncertainty; defining the admissible set bounds (Step 3, especially for B/C) requires weighing source credibility and conflict severity; assessing mechanism plausibility (Step 4) relies on biological/clinical reasoning; qualitatively rating Max Regret (Step 5) involves valuing outcomes (e.g., how much worse is a 5% absolute increase in mortality?); and evaluating evidence gathering feasibility/value/avoidance (Step 7) hinges on contextual factors like resource constraints, patient acuity, and institutional capacity. The procedure structures these judgments with specific questions and defined outputs but cannot eliminate their subjective component. The committee's role is to exercise collective, informed clinical-administrative judgment within this framework.

  ---

  ## Worked cases

  1.  **Unapproved Implantable Device:**
      *   *Step 1:* Intervention: Device X. Alternatives: Palliative care (only option).
      *   *Step 2:* Ambiguity: **(B) Source unevaluable.** (3 foreign case reports - reliability unknown).
      *   *Step 3:* Admissible Set: Plausible benefit LB: Very Low (0.05?), UB: Moderate (0.4?) based solely on case report potential for bias/error. Harm LB: Low (0.1?), UB: High (0.6?) (unknown device safety).
      *   *Step 4:* Mechanism: Plausible ("Yes").
      *   *Step 5:* Max Regret vs. Palliative: *Benefit Regret:* Palliative benefit ~0. If device fails (UB_Benefit=0.4 < 1.0? - palliative offers comfort), regret = Moderate/High (lost chance). *Harm Regret:* If device causes harm (LB_Harm=0.1 > Palliative Harm~0), regret = Moderate/High. Overall Max Regret: **High**.
      *   *Step 6:* Dominance? No. Device could be much worse.
      *   *Step 7:* Evidence Gathering? Feasible: Maybe (detailed report/registry), but patient urgent. Value: High (for future). Avoidance? Not primary here, urgency real.
      *   *Decision:* **Deny** (High Max Regret). *Your Expectation Confirmed.* Conflation avoided: Focused on intrinsic source uncertainty (B), not just lack of data.

  2.  **Sepsis Early-Warning Model:**
      *   *Step 1:* Intervention: Deploy Algorithm Y. Alternatives: Current clinical assessment (Standard).
      *   *Step 2:* Ambiguity: **(C) Conflicting evidence.** (Strong retrospective here vs. known underperformance in similar subgroup elsewhere).
      *   *Step 3:* Admissible Set: Benefit (Early Detection): LB: Moderate (subgroup underperformance drags down), UB: High (retrospective here). Harm (False Alarms/Over-treatment): LB: Similar to Standard? UB: Higher (esp. in subgroup).
      *   *Step 4:* Mechanism: Plausible ("Yes" - data-driven prediction).
      *   *Step 5:* Max Regret vs. Standard: *Benefit Regret:* If UB_Alg < Standard? Unlikely. *Harm Regret:* If LB_Alg_Harm > Standard_Harm? Possible (UB_Harm higher). Max Regret: **Moderate** (potential for increased resource use/fatigue, unlikely catastrophic harm).
      *   *Step 6:* Dominance? Unlikely.
      *   *Step 7:* Evidence Gathering? Feasible: Yes (prospective audit, subgroup monitoring). Value: High (especially for subgroup). Avoidance? Possible, but deployment enables better data.
      *   *Decision:* **Permit with Conditions:** Mandate prospective audit with specific subgroup analysis triggers; automatic review at 6 months; deploy with clear protocols for subgroup handling. *Your Expectation Confirmed.*

  3.  **Continuation of Pilot:**
      *   *Step 1:* Intervention: Continue Pilot Z. Alternatives: Stop and revert to pre-pilot standard.
      *   *Step 2:* Ambiguity: **(D) Insufficient precision.** (Mildly positive, weak stats).
      *   *Step 3:* Admissible Set: Benefit: Use reported CI (e.g., LB: Very Small Benefit, UB: Moderate Benefit). Harm: Likely similar or slightly increased (CI includes no increase).
      *   *Step 4:* Mechanism: Assume plausible (established pilot).
      *   *Step 5:* Max Regret vs. Stopping: *Benefit Regret:* If UB_Pilot_Benefit < Benefit_Stop? Unlikely (LB positive). *Harm Regret:* If LB_Pilot_Harm > Harm_Stop? Possible (CI includes harm). Max Regret: **Low/Moderate** (Potential for small net harm or wasted resources).
      *   *Step 6:* Dominance? Unclear. Stopping could be better if harm exists.
      *   *Step 7:* Evidence Gathering? Feasible: Yes (Continue pilot *is* evidence gathering). Value: **High** (Pilot hasn't resolved ambiguity! Weak data after 2 years). Avoidance? **High Risk** - Clinician dependence creates inertia; continuing without a decisive evidence plan *is* avoidance. Requires a *new*, rigorous evidence plan.
      *   *Decision:* **Permit with Stringent Conditions:** Continue *only* under a new, binding protocol with strict enrollment targets, defined endpoints, powered interim analysis at 6 months, and automatic sunset if ambiguity isn't significantly reduced. No indefinite continuation.

  ---

  ## How this procedure will fail
  The procedure will fail when committees misclassify ambiguity types (e.g., mistaking insufficient precision (D) for conflicting evidence (C)), leading to flawed admissible sets. Defining bounds (Step 3) remains subjective and vulnerable to anchoring or groupthink. Qualitative Max Regret assessments (Step 5) can be inconsistently applied, undervaluing certain harms (e.g., resource drain) or overvaluing desperation. The evidence gathering step (Step 7) is susceptible to institutional inertia, especially in pilots (Case iii), where "collecting more data" becomes perpetual motion without a decisive endpoint. Time pressure (40 mins) may force rushed judgments, particularly on complex cases. Crucially, it cannot eliminate the tension between individual patient needs (Case i) and population/system risks, potentially appearing heartless in dire single cases despite theoretical justification.

  ---

  ## What would change my mind
  My reasoning is most likely to break under the weight of *identifiable patient suffering* in true last-resort scenarios (Case i). A compelling argument that the minimax criterion systematically undervalues potential life-saving benefits for individuals facing certain poor alternatives, grounded in a coherent alternative decision rule (e.g., a justified, non-arbitrary optimism principle for plausible mechanisms under unevaluable evidence), could shift my view. Empirical evidence that committees *routinely* and *accurately* transform unevaluable sources (Type B) into usable evidence through structured judgment (Step 3) would challenge the need for such strong caution. Conversely, rigorous lab studies demonstrating that committees *cannot* reliably avoid severe framing effects or source misjudgment, even with this procedure, would push me towards a stricter default of denial under ambiguity Types A and B. A flaw in the separation of ambiguity types – particularly if "no information" (A) is indistinguishable from "insufficient precision" (D) in practice – would undermine the procedure's core structure. The tension between theoretical robustness and the imperative to act for identifiable individuals remains the most vulnerable point.
