prompt: |-
  I am the employee-elected member of the board of the Nordic subsidiary of an American software company, and I have to circulate a written opinion before Thursday's board meeting.

  Management has put a single item on the agenda: rolling out in our region a programme the parent company already runs in the United States. It has three parts. Every quarter, a ranked list of the top ten per cent of employees by performance score is published to the whole region. The top twenty-five are sent to a three-day retreat with the CEO. And the next recruiting campaign is to be built around one employee who began on the support desk and is now a team lead, held up as proof of the parent company's slogan, that here anyone can make it.

  Our Nordic employee council has voted nine to two against, and its written objection is one sentence long: that in Jante's town no one gets to stand above the others. Jantelagen, as I understand the norm they are invoking, is the old Nordic rule that you must not think you are anything special, or that you are better or know more than the rest of us; the same reflex, exported, is what elsewhere gets called the tall poppy syndrome.

  Write the opinion I will circulate. It must recommend a definite course — approve as proposed, reject, or approve subject to conditions I can put in writing with a date by which they must be met — and it must argue rather than survey. I want the board to be able to interrogate it, so please do the following.

  First, state what each side is actually claiming about what the company owes the people who work for it. Neither side is a caricature: the council is not simply against praise, and the parent company's slogan is not mere naivety.

  Second, use a distinction I have found clarifying. Call recognition a prize when it is scarce and rank-ordered, so that one person's gain is another's loss, and call it acknowledgment when it is not scarce and can be extended to anyone who did the work. Say which of the two the programme actually implements, and whether the other would serve the purposes the company says it has.

  Third, meet the strongest case for the losing side head-on. If the purpose is to motivate effort, does a rank-ordered prize do that, given that the people most likely to win it may be those who would have worked hard regardless? If the purpose is to advertise that the company rewards talent, whose interests does the advertisement serve? And say what would have to turn out to be true for the opposite recommendation to be the right one.

  Fourth, say plainly what a published ranking does to the people who finish at the bottom of it, and whether the company has an answer to that.

  Two details should be taken into account. The employee who would front the recruiting campaign said in the internal interview that the company's training fund and a manager who covered for her during a family illness were what made the difference; the parent company's version of the story drops both. And the council's objection was drafted by two of our most productive engineers.

  No citations and no literature review — I want an argument in prose that a sceptical board can push back on, under nine hundred words.
reasoning: |-
  Okay, the user is an employee-elected board member for a Nordic subsidiary of an American software company. They need to write a board opinion by Thursday. The agenda is about rolling out a US parent company program in the Nordic region. The program has three parts: publishing a top 10% performance ranking quarterly, sending the top 25 to a retreat with the CEO, and using a success story in recruiting. 

  The Nordic employee council voted 9-2 against it, citing Jantelagen - the cultural norm against standing out. The user needs a written opinion that recommends a clear action (approve, reject, or approve with conditions) and argues rigorously. They also want it structured around specific analytical points: defining what each side believes the company owes employees, distinguishing between "prize" vs "acknowledgment" recognition, addressing counterarguments, and discussing impacts on lower-ranked employees.

  Hmm...this is a classic clash between American individualistic recognition and Nordic egalitarian values. The employee council's objection isn't about rejecting recognition entirely - it's about the ranking system violating deep-seated cultural norms. Meanwhile, the parent company's "anyone can make it" slogan reflects genuine belief in meritocracy but overlooks how systems shape opportunity. 

  The key insight is recognizing that both sides want high performance - they just disagree fundamentally on how to achieve it. The US approach relies on scarce "prizes" (ranking creates artificial scarcity), while the Nordic preference aligns with non-scarce "acknowledgment" (celebrating achievements without ranking). 

  For counterarguments: Yes, rankings might motivate some top performers, but research shows they often demotivate the majority. And that "anyone can make it" recruiting story? Problematic because the sanitized version removed mention of structural support (training fund, manager flexibility) that actually enabled mobility - making it bootstrap propaganda rather than truth. 

  Most damning is the impact on bottom performers. Publishing rankings publicly humiliates them with no upside. Even if intended as "motivation," it ignores how shame actually functions in Nordic work culture. 

  Conditions for approval would need to: 1) Eliminate public ranking entirely 2) Rethink rewards as non-rank-based (e.g., threshold-based bonuses) 3) Restore truth to the recruiting story by mentioning institutional support. But given the council's strong opposition (including top engineers!), rejection seems more prudent. 

  The user's real challenge is navigating loyalty to both employees and parent company. My draft must arm them with irrefutable logic - hence focusing on how the program's design undermines its own stated goals in this cultural context. Keeping it under 900 words means every sentence must punch.
answer: |-
  ## Board Opinion: Proposed Performance Recognition Program

  **Recommendation:** Reject the rollout of the parent company's performance recognition program in its current form.

  **Analysis:**

  1.  **Core Claims on Company Obligations:**
      *   **Parent Company:** Believes the company owes employees a clear demonstration that exceptional effort and achievement are visibly rewarded, fostering individual aspiration and proving upward mobility ("anyone can make it"). This is seen as fundamental to motivation, retention, and attracting ambitious talent.
      *   **Employee Council (Nordic):** Believes the company owes employees an environment focused on collective effort, psychological safety, and minimizing status-based friction. "Jantelagen" reflects a deep-seated cultural aversion to systems that actively create public hierarchies, fearing it breeds resentment, undermines collaboration, and damages morale for the majority not highlighted. They are not against recognition *per se*, but against recognition structured as zero-sum competition.

  2.  **Prize vs. Acknowledgment:**
      *   This program is unequivocally a **prize** system. The top 10% ranking (especially the top 25 retreat) is inherently scarce and rank-ordered. Recognition for one employee explicitly comes *at the expense* of others' non-recognition within this structure. Success is defined relatively ("better than peers") rather than absolutely ("met/exceeded objectives").
      *   **Acknowledgment**, in contrast, focuses on appreciating specific contributions, skills, or achievements *without* requiring others to lose. It recognizes effort, improvement, or mastery against standards or goals, and can be extended widely. While the recruiting story *could* be acknowledgment, its framing as proof of a universal principle ("anyone can make it") tied to the prize system pushes it towards being an aspirational prize advertisement.

  3.  **Addressing the Strongest Case for the Program & Counterpoints:**
      The strongest case is that **prizes uniquely motivate extraordinary effort and signal the company's commitment to rewarding talent, thereby attracting high performers.**
      *   **Motivation:** While prizes *might* motivate a small subset intensely competitive by nature, they demonstrably demotivate the majority who perceive the chance of winning as low or unfair. Crucially, the employees most likely to win prizes are often those already intrinsically motivated. The program risks disengaging the 90% not listed – the core engine of our work. Acknowledgment systems (e.g., spot bonuses for specific achievements, skill-based development opportunities) can motivate effort across the board without creating losers.
      *   **Advertising Rewards & Serving Interests:** Advertising a prize system primarily serves the interests of the company seeking to attract *specifically* individuals driven by external validation and competition. It signals less about rewarding inherent "talent" and more about rewarding *winning a competition*. The sanitized recruiting story (removing the crucial support structures like the training fund and manager flexibility) turns a genuine example of institutional enablement into potentially misleading bootstrap propaganda, serving the company's narrative rather than the complex reality of career progression. It risks attracting individuals expecting unrealistic, individualistic heroics and deterring collaborative, team-oriented talent prevalent here.
      *   **When the Opposite Recommendation Might Hold:** Approval would only be justified if we believed (1) intense internal competition is *the* primary driver of superior *collective* results in our Nordic context, (2) the significant morale risk to the non-ranked majority is negligible or outweighed by top-performer gains, and (3) the cultural aversion to public ranking is superficial and easily overridden. Our evidence – including the council's strong objection drafted by highly productive engineers – suggests these premises are false.

  4.  **Impact of Published Ranking & Company's Answer:**
      Publishing a ranked list of the "top" 10% explicitly labels the remaining 90% as "not top." For those at or near the bottom of the list, it is a public declaration of relative inadequacy. For solid performers consistently outside the 10%, it signals their contributions are insufficiently valued, breeding discouragement and cynicism. **The company has no credible answer to this inherent harm within a ranked prize system.** Explanations about "motivation" or "aspiration" ring hollow to those publicly designated as lesser contributors. This directly contravenes the psychological safety and collaborative ethos valued in our Nordic operations and emphasized by the elected council.

  **Conclusion:**
  While the parent company's intent to recognize excellence is valid, the proposed program's core mechanism – a scarce, rank-ordered prize system – is culturally misaligned and counterproductive in our Nordic subsidiary. It undermines collaboration, risks demotivating the majority, ignores the cultural resonance of Jantelagen, and utilizes a potentially misleading narrative. The employee council's decisive rejection reflects a deep understanding of these dynamics. Implementing this program as-is would damage morale, trust, and our unique collaborative culture without demonstrably superior outcomes to alternative, acknowledgment-based recognition systems.

  **Recommendation:** Reject the rollout. I propose we task regional management, in consultation with the Employee Council, to develop alternative recognition and motivational strategies aligned with Nordic values and operational realities, reporting back to the board by [Date - e.g., October 31st].
