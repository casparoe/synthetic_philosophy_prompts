prompt: |-
  everybody keeps saying there are gains from trade between clashing value systems — that two people who disagree about what matters can each come out ahead by giving a little. I want the spec before I read any actual accounts. what does a theory of morally permissible compromise between value systems have to deliver, where the purpose is telling an institution whether to broker such a deal and not just surviving a seminar? give me the requirements with the case behind each: it has to handle the deal that leaves both sides worse off than no deal at all (a clinic that half-honors a conscientious objection and half-honors patient choice and ends up violating both principles), it has to say whether offsetting counts (I do what you think is wrong and fund what you think is right — trade or bribe?), it can't just default to a 50/50 split when the two sides aren't equally confident or equally intense, and it has to keep compromise seperate from capitulation and from a bare truce that nobody endorses. then mark which requirements are non-negotiable and which are one camp's priors, and tell me which subset can't be jointly satisfied — my suspicion is that each side judging the deal better by its own lights can't be had together with the deal surviving third parties who object to trading in that value at all. and which single requirement knocks out the most candidates? skip the scorecard.
reasoning: |-
  Okay, the user is asking about the theoretical requirements for morally permissible compromise between conflicting value systems. They want a specification before diving into actual cases, focusing on what makes such compromises valid for institutional decisions, not just academic discussions.

  The user outlines several key requirements. First, they mention a scenario where a compromise leaves both sides worse off, like a clinic that half-honors conscientious objection and half-honors patient choice, violating both principles. The theory must address this "lose-lose" outcome.

  Second, they bring up offsetting—where one side does something the other considers wrong but funds something they consider right. The question is whether this counts as a legitimate compromise or just a bribe.

  Third, the theory must avoid defaulting to a 50/50 split, especially when the parties have different levels of confidence or intensity. A rigid split wouldn't account for asymmetries in their commitments.

  Fourth, the compromise must be distinct from capitulation (one side giving up) and a mere truce (temporary ceasefire without endorsement). It needs genuine, albeit partial, acceptance from both sides.

  The user also wants to know which requirements are non-negotiable versus based on priors, which subset can't be satisfied together, and which single requirement eliminates most candidate theories. Their suspicion is that satisfying both sides' values while withstanding third-party objections might be incompatible.

  The user's deeper need seems to be practical application. They mention institutions brokering deals, not just surviving seminars. They're likely involved in policy, ethics committees, or conflict resolution where real-world compromises are necessary. They need a robust framework to evaluate proposals, avoiding pitfalls like ineffective or exploitative agreements.

  Their frustration with vague academic discussions suggests they've encountered theories that don't translate to practice. The emphasis on distinguishing compromise from capitulation or bribery indicates concerns about legitimacy and integrity in negotiations. They might be dealing with polarized groups where maintaining trust is crucial.

  The conflict between mutual improvement and third-party objections is a key tension. In practice, compromises often face backlash from purists on both sides. The user needs the theory to address this reality—perhaps by including mechanisms for accountability or thresholds for permissible trade-offs.

  Offsetting is another pain point. It's common in politics (e.g., funding environmental projects to offset pollution permits), but critics call it transactional ethics. The user wants clarity on when this is acceptable versus corrupt.

  The 50/50 split issue reflects real-world power imbalances. A theory must weight demands by intensity or conviction, not just numbers. For example, in medical ethics, a minority view might deserve disproportionate weight if it involves life-or-de-matter stakes.

  The user's suspicion about incompatibility between mutual gains and third-party validity is astute. Hardliners often reject any compromise as betrayal. The theory might need to define "relevant parties" or allow for phased agreements where third parties are gradually incorporated.

  The toughest requirement is likely mutual gains (each side prefers the deal to no deal). It's intuitive but hard to achieve when values are incommensurable. Many theories fail here by either forcing homogeneity (undermining pluralism) or accepting lose-lose outcomes. This probably knocks out the most candidates.

  Non-negotiables would include avoiding lose-lose outcomes and distinguishing compromise from capitulation. These are core to the concept. Offsetting and asymmetry handling might depend on priors—e.g., consequentialist vs. deontological views.

  The unsatisfiable subset is mutual gains + third-party validity. If hardliners view any trade as taboo, satisfying them while delivering gains is impossible. The theory might need to exclude unreasonable third parties or focus on negotiators' representativeness.

  In sum, the user needs a actionable, institution-friendly framework that navigates real-world constraints without oversimplifying moral conflicts. Prioritizing mutual gains while acknowledging external dissent is the key challenge.
answer: |-
  Here’s the specification for a theory of morally permissible compromise between clashing value systems, tailored for institutional decision-making, with requirements derived from your cases. Non-negotiable elements (NN) are foundational; others reflect substantive priors (P). The tension analysis follows.

  ---

  ### **Core Requirements & Supporting Cases**  
  1. **Avoid Pareto-Inferior Outcomes (NN)**  
     - **Case**: A clinic compromises between a provider’s conscientious objection (e.g., abortion) and a patient’s choice. Half-measures (e.g., delayed access + coerced participation) violate both principles: providers feel complicit, patients face burdens. Both sides are worse off than under a clean "no-deal" (e.g., referral system or clear opt-out).  
     - **Theory Must**: Ensure the compromise leaves each side *at least as well off* as no deal by their *own* metrics. Lose-lose deals fail legitimacy.

  2. **Define Permissible Offsetting vs. Bribery (P)**  
     - **Case**: A logging company funds reforestation to offset old-growth forest destruction. Environmentalists deem this "blood money" (bribe), while the company calls it "balance" (trade).  
     - **Theory Must**: Distinguish when offsetting (a) genuinely reconciles values (e.g., reparative justice) vs. (b) commodifies sacred values (e.g., selling indulgences). Requires criteria for "moral fungibility": Can the offset *reasonably* negate the harm *within the objector’s framework*?

  3. **Weighted Bargaining, Not 50/50 Default (NN)**  
     - **Case**: Vaccine distribution: Side A (utilitarian) prioritizes high-density cities; Side B (equity-focused) demands equal per-capita allocation. A 50/50 split wastes doses in low-risk areas while underserving cities. Intensity (lives vs. fairness) and confidence (data vs. principle) differ.  
     - **Theory Must**: Incorporate asymmetric stakes/conviction. Allocate concessions proportionally to moral weight (e.g., severity of violation) and conviction strength (e.g., epistemic certainty), not raw bargaining power.

  4. **Distinguish Compromise from Capitulation/Truce (NN)**  
     - **Case**: Labor negotiations: Union accepts sub-inflation raises to avoid strikes (capitulation), or management pauses automation without endorsing job security (truce). Neither affirms the outcome.  
     - **Theory Must**: Require *endorsement* (both sides see the deal as *positively valuable* within their system) and *integrity preservation* (no core principle is fully abandoned). Capitulation sacrifices integrity; truces lack endorsement.

  ---

  ### **Tensions & Non-Negotiables**  
  - **Non-Negotiables (NN)**: Requirements 1 (avoid lose-lose), 3 (weighted splits), and 4 (endorsement ≠ surrender/truce). These define *minimal coherence* for "permissible compromise."  
  - **Priors (P)**: Requirement 2 (offsetting rules). Consequentialists may accept offsets; deontologists often reject "moral bookkeeping."  

  - **Unresolvable Tension**:  
    - **Mutual Gains** (each side prefers the deal to no deal *by their own lights*) **vs. Third-Party Objections** (external groups rejecting the *very act* of trading a value).  
    - **Example**: A hospital brokers a deal allowing limited euthanasia under strict criteria. Both sides (autonomy vs. sanctity-of-life) gain vs. total ban/total permission. But absolutists on either side condemn *any* euthanasia (or *any* restriction) as evil. The deal cannot satisfy them without abandoning mutual gains.  
    - **Why Incompatible?** Mutual gains require negotiators to accept trade-offs within their systems. Third-party absolutists deny the *moral possibility* of such trade-offs. Satisfying both would require the deal to simultaneously be "no compromise" (for absolutists) and "better than stalemate" (for negotiators) — a contradiction.  

  ---

  ### **Most Discriminating Requirement**  
  **Mutual Gains (Requirement 1)** eliminates the most candidate theories:  
  - **Utilitarian bargaining** (maximize aggregate welfare) fails if one side is net worse off.  
  - **Majoritarian compromise** (vote-splitting) risks Pareto-inferior outcomes.  
  - **Ideal theory approaches** (e.g., Rawlsian consensus) collapse when values are irreconcilable.  
  - Only theories that *embed pluralism* (e.g., **value-pluralist contractarianism** or **agent-relative consequentialism**) can satisfy this — but still struggle with the absolutist veto (third-party problem).

  ---

  ### **Summary for Institutional Design**  
  A viable theory must:  
  - Guarantee **no mutual loss** (NN),  
  - Weight concessions by **moral gravity/conviction** (NN),  
  - Demand **principled endorsement** (NN),  
  - Rule on **offsetting legitimacy** (P),  
  - Acknowledge that **third-party absolutism** is incompatible with mutual gains.  

  **Institutional Implication**: Brokered deals require excluding actors who reject *all* compromise on a value. Otherwise, mutual gains are impossible, and the institution risks facilitating lose-lose bargains or capitulation.
