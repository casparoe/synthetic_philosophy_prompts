answer: |-
  Here’s a comprehensive exam question package designed for your upper-level seminar, targeting the core dilemma of distinguishing moral preferences from biases and its implications for moral progress.

  ---

  ### **Essay Question (90 minutes, 20 marks)**  
  **"The distinction between 'principled moral preferences' and 'moral biases' (e.g., in-group favoritism, status-quo bias) appears to collapse under scrutiny. If we can only label something a 'bias' from a standpoint we believe is unbiased, does this reduce the distinction to a purely *etiological* one (i.e., preferences stem from 'good' causes like reason, biases from 'bad' causes like evolution/socialization)? Critically evaluate this etiological collapse and its consequences for the possibility of **moral progress**. Use at least two thinkers from the course (e.g., Haidt, Appiah, Greene, Singer, Churchland) to anchor your analysis."**

  ---

  ### **Model Answer (≈600 words)**  
  The tension between moral preferences and biases reveals a foundational crisis in ethics: declaring something a "bias" seems to presuppose an objective, bias-free vantage point—a "view from nowhere" that metaethics increasingly deems illusory. This forces us toward an etiological distinction, where preferences are valorized as products of reasoned deliberation (e.g., Kantian autonomy), while biases are pathologized as evolutionary or cultural artifacts (e.g., Haidt’s "social intuitionist" model of tribal loyalty). However, this etiological framing fails to resolve the problem and catastrophically undermines moral progress.  

  First, the etiological collapse is self-undermining. If we judge moral commitments *only* by their origins, we face an infinite regress: how do we validate the "good" etiology of reason itself? As Appiah argues in *Experiments in Ethics*, reason is culturally scaffolded; our tools of rational critique (e.g., Rawlsian reflective equilibrium) emerge from the same social contexts that produce "biases." Greene’s dual-process theory exacerbates this: if deontological "preferences" are emotional intuitions in disguise (e.g., disgust-driven condemnations), and utilitarianism is just another cognitively biased "trolley-solving" instinct, etiology cannot cleanly bifurcate bias from principle.  

  This collapse devastates moral progress. Progress traditionally presumes movement toward objectivity (e.g., Singer’s expanding circle). But if all moral claims reduce to causal chains, progress becomes a mirage—merely the dominance of one etiology over another. For instance, the abolition of slavery might reflect Enlightenment rationality (preference) *or* contingent economic shifts (bias). Haidt’s moral foundations theory illustrates this: what liberals call "progress" (rights expansion) conservatives deem erosion of binding foundations (loyalty, authority). Without a non-etiological standard, we cannot arbitrate; progress reduces to *power*, not truth.  

  Yet all is not lost. We might salvage progress by redefining it *immanently*, using coherence across etiologies (e.g., Churchland’s neurobiological view of values as dynamic, self-correcting networks). Appiah’s "rooted cosmopolitanism" offers a path: progress as the iterative, dialogical refinement of biases through cross-cultural encounter—not by transcending etiology but by diversifying it. This rejects the "view from nowhere" while resisting relativism by demanding that biases withstand external scrutiny. Moral progress becomes not the discovery of pre-existing truths but the pragmatic success of inclusive moral systems at reducing suffering and expanding agency.  

  In conclusion, while the etiological distinction crumbles under its own assumptions, it reveals a deeper insight: the preference/bias dichotomy is a false binary. Moral reasoning is always situated, but progress remains possible through collective, reflective negotiation of our etiological inheritance—a project forever incomplete but indispensable.  

  ---

  ### **Marking Scheme (20 marks total)**  
  **A-Grade (17–20 marks):**  
  1. **Explicitly identifies the "view from nowhere" problem** as the catalyst for etiological collapse.  
  2. **Critiques etiology’s circularity**: Shows how "good" causes (reason) cannot self-validate (e.g., "Who rationalizes the rationalizers?").  
  3. **Uses ≥2 course thinkers** to demonstrate etiology’s instability (e.g., Greene undercutting deontology; Haidt on tribal foundations).  
  4. **Links collapse to moral progress**: Argues that without non-etiological standards, progress becomes epistemically vacuous (power/relativism).  
  5. **Offers a sophisticated alternative**: Proposes a coherent, non-objectivist account of progress (e.g., Appiah’s dialogue, Churchland’s network model) *without* reverting to naiveté.  

  **B-Grade (13–16 marks):**  
  - **Hits 4/5 A-Grade criteria** but with one gap:  
    - *(Common B-level mistake)* **Superficial treatment of progress**: E.g., "Progress is still possible because we see it historically," without addressing *how* we justify it post-collapse.  
    - **OR** **Underdeveloped thinker engagement**: Names thinkers but doesn’t exploit tensions (e.g., notes Haidt’s in-group bias but misses how it challenges Kantian autonomy).  
  - **May concede the collapse** but lacks an original resolution.  

  **C-Grade (9–12 marks):**  
  - Describes the preference/bias problem but **doesn’t engage etiology deeply**.  
  - **Vague on progress implications** (e.g., "This makes ethics harder").  
  - Uses thinkers **only descriptively** (e.g., "Haidt says biases are intuitive").  

  **D/F-Grade (≤8 marks):**  
  - Misrepresents core concepts (e.g., conflates bias with "false beliefs").  
  - Ignores the "view from nowhere" challenge.  
  - No meaningful engagement with course material.  

  ---

  ### **Why This Works**  
  - **Tests Understanding**: Forces students to *use* theories (Haidt, Greene) to dissect a meta-problem, not recite them.  
  - **Targets the Core Tension**: The question’s phrasing ("does this reduce...") demands they confront etiology as a response to epistemological despair.  
  - **Progress as the Stakes**: Links abstract metaethics to a concrete, urgent dilemma (can we improve morally?).  
  - **Clear Differentiation**: A/B separation hinges on whether students *solve* the collapse or just diagnose it.  

  This question rewards nuanced thinking while punishing superficiality—exactly what your seminar deserves. Good luck with your final!
