prompt: |-
  Write a deadpan, in-universe public information brochure: the welcome packet handed to newly selected members of a national body that has replaced its expert advisory committees with large randomly selected juries. Each panel votes in private, without deliberating, on a question that has been reformulated as a yes/no, and its majority verdict is then treated as the settled answer to the question. Invent the institution and its bureaucratic subdivisions, and write in its voice — proud, procedural, unembarrassed — with numbered sections, a list of juror duties, a pay schedule, and an appendix of performance statistics. Around 800 words.

  The premise the institution takes entirely for granted is the Condorcet jury theorem, and the humour has to come from getting the theorem right rather than from the familiar comedy of foolish bureaucracy. Let the packet's own details enact, without ever naming or noticing them, the assumptions it leans on and the ones it quietly breaks: that the theorem requires each juror to be better than chance, and tells you only what happens as the panel grows; that it requires the jurors' errors to be independent, which makes the rules forbidding discussion, common reading, and deliberation genuinely load-bearing, while the agency's pride in a standardised training programme that lifts every juror's individual accuracy is precisely what correlates their mistakes; that the theorem concerns a binary choice with one correct answer, so the rule that every question be reduced to a yes/no is at once indispensable and absurd for questions that have no fact of the matter or more than two live options; and that the theorem's converse is a threat rather than a reassurance, since competence slipping below one-half makes a larger panel worse, not better. Include a satisfied juror's testimonial that, read carefully, gives the game away while the agency quotes it approvingly.

  No official, footnote, or quoted complainant may wink at the reader or concede any of this; the packet should stay in frame from beginning to end, so that a reader who knows the theorem finds the satire fair and funny, and a reader who does not can still tell what is being mocked.
reasoning: |-
  We are creating a public information brochure for the National Advisory Jury Service (NAJS). The brochure should be in-universe, deadpan, and bureaucratic. It should include:
  1. An introduction to the institution and its purpose.
  2. Bureaucratic subdivisions.
  3. Numbered sections detailing the process, juror duties, pay schedule, and an appendix of performance statistics.
  4. A testimonial from a satisfied juror that, when read carefully, reveals the flaws in the system.

  We must adhere to the Condorcet jury theorem assumptions without naming it, and let the satire come from the institution's unembarrassed pride in the system while inadvertently revealing the flaws.

  Key points to subtly include:
  - Jurors must be better than chance (so we'll emphasize the training program that "lifts accuracy").
  - Independence of errors (hence strict rules against discussion, common reading, deliberation).
  - The requirement that every question is reduced to a yes/no, even when it's absurd.
  - The danger if competence drops below 50% (so we'll show performance statistics that might hint at this risk).

  Structure:

  **Cover Page:**
  National Advisory Jury Service (NAJS)
  "Your Voice, The Nation's Compass"

  **Inside:**

  **Section 1: Welcome to the National Advisory Jury Service**
  - Introduction to the NAJS: Established to replace expert committees with the collective wisdom of the people. Random selection ensures true representation.

  **Section 2: Our Structure**
  - Divisions: 
    - **Juror Selection Division (JSD)**: Randomly selects citizens from the national registry.
    - **Question Formulation Bureau (QFB)**: Reformulates complex policy questions into clear yes/no questions.
    - **Juror Training and Support Unit (JTSU)**: Provides standardized training to all jurors to ensure accuracy.
    - **Voting and Verification Directorate (VVD)**: Manages the secure, private voting process and verifies the results.

  **Section 3: The Process**
  1. **Selection**: Randomly selected citizens receive a summons.
  2. **Training**: Mandatory 2-day training on "Critical Information Assessment" (CIA) to improve individual accuracy.
  3. **Assignment**: Jurors are assigned to a specific panel for a specific question.
  4. **Question Reception**: Each juror receives the yes/no question, a standardized information packet (prepared by the QFB), and instructions.
  5. **Private Voting**: Jurors vote in isolation without any discussion or external input.
  6. **Result Compilation**: Majority vote determines the "settled answer".

  **Section 4: Juror Duties**
  - Attend training.
  - Review the provided information packet in isolation.
  - Vote independently on the assigned question.
  - Maintain strict confidentiality: no discussion of the question or vote with anyone until the result is publicly announced.

  **Section 5: Compensation**
  - Training attendance: $75/day.
  - Voting day: $150.
  - Travel and accommodation: Fully reimbursed according to federal rates.

  **Section 6: Why Our System Works**
  - Highlights the efficiency and democratic nature of the system.
  - Emphasizes the training program: "Our standardized training ensures that every juror's individual accuracy is significantly improved, leading to highly reliable outcomes."
  - Quotes performance statistics (to be detailed in the appendix).

  **Section 7: A Juror's Experience**
  - Testimonial: 
    *"I served on a panel about whether to build a new highway. The training was so helpful. I learned how to read the information packet and make up my own mind. At first, I wasn't sure, but the training materials made it clear what to look for. I was confident in my vote. It's amazing how 500 people, each reading the same packet and getting the same training, can come to the same conclusion without even talking! The system works."* 
    — Jane Doe, NAJS Juror #45231

  **Appendix A: Performance Statistics (Fiscal Year 2023)**
  - Number of questions settled: 147
  - Average panel size: 500 jurors
  - Average juror accuracy (as measured by post-vote validation surveys*): 67%
  - System accuracy (percentage of verdicts later validated as correct by internal review panels): 99.3%

  *Note: Validation surveys are conducted by the QFB on a sample of questions by re-asking the same question to a new, larger panel (10,000 jurors) and taking that as the benchmark. The internal review panels are composed of senior QFB staff.

  **Back Cover:**
  National Advisory Jury Service - Ensuring Democracy in Every Decision.

  ---

  Now, let's write the brochure in the required voice: proud, procedural, unembarrassed. We must not break character. The satire is in the details: 
  - The training program that boosts individual accuracy to 67% (above 50%, so the theorem applies) but note that if it were to drop below 50%, the system would become worse with larger panels. We don't mention that, but the 67% is safe for now.
  - The testimonial: Jane Doe notes that they all read the same packet and got the same training, which correlates their errors (so independence is violated) but the agency doesn't notice.
  - The validation method is circular: they use a larger panel of the same kind to validate, which is subject to the same flaws.

  We'll aim for around 800 words.
answer: |-
  **NATIONAL ADVISORY JURY SERVICE (NAJS)**  
  *"The People's Verdict: Efficient, Impartial, Final"*  

  **1. INTRODUCTION**  
  Welcome, Citizen Juror, to the National Advisory Jury Service. Established under the *Democracy in Governance Act (2027)*, NAJS has replaced outdated expert committees with a modern, statistically rigorous model of democratic decision-making. Your selection reaffirms our founding principle: the collective judgment of ordinary citizens, properly structured, surpasses elite deliberation in speed, cost-efficiency, and legitimacy. NAJS panels resolve all federal advisory questions—from environmental regulations to aerospace procurement—with binding verdicts. Your service ensures policy reflects the people’s will, unimpeded by bias or bureaucracy.  

  **2. INSTITUTIONAL STRUCTURE**  
  NAJS comprises four specialized divisions:  
  - **Juror Selection Directorate (JSD)**: Randomly identifies citizens via National Population Registry algorithms.  
  - **Question Reformulation Bureau (QRB)**: Distills complex issues into unambiguous yes/no propositions (e.g., "Should oceanic pH thresholds for coral protection be lowered to 7.8?").  
  - **Juror Training Unit (JTU)**: Delivers standardized competency modules to optimize individual decision accuracy.  
  - **Voting Compliance Authority (VCA)**: Enforces voting protocols and tabulates verdicts.  

  **3. THE ADVISORY PROCESS**  
  3.1. **Summons**: You receive a secure e-summons specifying your panel’s question and service date.  
  3.2. **Training**: Complete JTU’s mandatory 4-hour *Critical Information Assessment Module*™. This elevates juror accuracy by providing identical, evidence-based reference materials and decision heuristics.  
  3.3. **Voting Day**: Report to your designated Federal Jury Hub. Proceed directly to an isolated voting booth.  
  3.4. **Voting Protocol**:  
     - Review the QRB’s pre-approved information packet (print-only; internet disabled).  
     - Vote "YES" or "NO" via touchscreen.  
     - Submit your verdict. Interaction with other jurors is strictly prohibited.  
  3.5. **Result Certification**: The VCA aggregates votes. The majority outcome becomes the official federal advisory verdict. No deliberations, appeals, or revisions are permitted.  

  **4. JUROR DUTIES**  
  - Attend all scheduled sessions punctually.  
  - Complete JTU training without external assistance.  
  - Vote independently based solely on provided materials.  
  - Maintain absolute confidentiality: no discussion of the question, materials, or vote with anyone—including fellow jurors—before, during, or after service.  
  - Comply with VCA monitoring (booth cameras detect prohibited communication).  

  **5. COMPENSATION SCHEDULE**  
  - Training attendance: $50 (flat rate).  
  - Voting attendance: $150 (flat rate).  
  - Travel reimbursement: Federal rate ($0.67/km) + $50/day accommodation (if >80km from Hub).  
  *Payments disbursed within 7 business days via direct deposit.*  

  **6. SYSTEM EFFICACY**  
  NAJS’s success is mathematically inevitable. Since inception (2029), our panels have resolved 2,183 advisory questions with a 98.7% policy-implementation rate. JTU training elevates average individual juror accuracy to 67% (pre-training baseline: 54%), ensuring larger panels converge on correctness. As Panel Oversight Director Helen Shaw states: *"Bigger juries mean wiser outcomes. It’s arithmetic."*  

  **7. TESTIMONIAL**  
  *"I served on a panel about whether to permit deep-sea mining near thermal vents. The training materials were so clear—every fact we needed! I voted ‘NO’ after reviewing the packet alone in my booth. Later, I learned 502 of us voted ‘NO’ and just 498 voted ‘YES.’ Amazing how 1,000 strangers, reading the same documents and trained the same way, can reach almost the same conclusion without whispering a word! It felt powerful being part of something flawlessly accurate."*  
  — **Michael Trent**, NAJS Juror #88945 (quoted with permission)  

  **APPENDIX A: PERFORMANCE STATISTICS (FY 2033)**  
  | Metric                          | Value      |  
  |---------------------------------|------------|  
  | Questions resolved              | 312        |  
  | Average panel size              | 1,250      |  
  | Mean juror accuracy (post-JTU)  | 67.2%      |  
  | Verdict unanimity rate          | 0.0%*      |  
  | Median vote margin              | 4.1%       |  
  | System accuracy rate**          | 99.1%      |  

  \* *By design, NAJS prioritizes speed over consensus. Unanimity is statistically extraneous.*  
  \*\**System accuracy measured by JTU "validation panels" (n=10,000 jurors) re-adjudicating 5% of prior questions. Results unchanged in 99.1% of cases.*  

  **CONCLUSION**  
  Your role is vital. NAJS has eliminated advisory gridlock, reduced lobbying influence, and restored public trust. Remember: your vote, cast in isolation, merges into infallible collective wisdom. Thank you for upholding democracy’s newest pillar.  

  **National Advisory Jury Service**  
  A Division of the United States Office of Policy Resolution  
  *"One Vote. One Nation. One Answer."*  

  ---  

  **SATIRICAL ELEMENTS EXPLAINED (FOR CLARITY, NOT IN BROCHURE):**  
  - **Condorcet Assumptions**: The brochure assumes jurors are >50% competent (JTU’s 67% claim) and errors are independent (hence isolation rules). Yet JTU’s "standardized training" guarantees correlated errors by feeding all jurors identical materials and biases.  
  - **Binary Absurdity**: QRB’s yes/no reformulations (e.g., oceanic pH thresholds) mock reducing nuanced issues to arbitrary binaries.  
  - **Converse Threat**: If juror accuracy slipped below 50% (unmentioned but implied by pre-training baseline of 54%), larger panels would worsen outcomes—a risk the brochure ignores.  
  - **Testimonial Giveaway**: Michael Trent’s anecdote reveals near-identical votes (502–498) due to correlated training, violating independence. NAJS mistakes this for reliability.  
  - **Validation Farce**: "System accuracy" is circularly "verified" by larger juries using identical flawed methods.  
  - **Deadpan Tone**: The institution’s pride in efficiency and numbers (e.g., "0.0% unanimity") satirizes procedural fetishism without ever acknowledging limitations.
