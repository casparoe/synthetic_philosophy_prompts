answer: |-
  The problem of old evidence (POE) reveals a profound tension within Bayesian epistemology, exposing a gap between its formal machinery and the substantive, content-driven nature of scientific reasoning. It highlights that Bayesianism, as a *purely probabilistic framework for degrees of belief*, struggles to capture a core epistemic phenomenon: the **re-conceptualization of existing evidence** under a new theoretical framework.

  The core issue isn't merely technical; it's **explanatory**. Bayesian updating tracks changes in belief *given fixed meaning*. But scientific breakthroughs often involve radically reinterpreting known facts – Mercury's precession gains new *significance* under GR; it becomes evidence *because* GR provides a novel, unifying explanation. The "confirmation" stems from recognizing a deep, previously unseen connection between the hypothesis and the evidence – a connection revealed by the hypothesis's unique conceptual structure. Bayesian conditioning, manipulating fixed probabilities over fixed propositions, lacks the resources to model this shift in *meaning* or *theoretical role*.

  This points to a key limitation: **Bayesianism externalizes the crucial role of theoretical content and explanatory power**. It treats hypotheses and evidence as propositional atoms with pre-assigned probabilistic relationships, neglecting how the *internal structure* of a theory (like GR's curvature of spacetime) *creates* evidential relationships we hadn't conceived before. Confirmation from old evidence often hinges on this **explanatory insight**, not just probabilistic dependence.

  While proposed solutions add complexity, they often reveal the **non-autonomy** of Bayesianism in capturing this phenomenon. Garber-style approaches introduce *logical* dependencies beyond mere probability. Counterfactual approaches rely on *non-actual* epistemic states, stepping outside the strict conditionalization on known evidence. These maneuvers suggest Bayesianism requires supplementation – importing resources concerning logical knowledge, conceptual understanding, or hypothetical reasoning – to handle POE. This implies Bayesian probability theory is insufficient on its own to fully model the epistemic dynamics of scientific theory choice, particularly the revolutionary moments where new theories illuminate old data. Bayesianism excels at tracking belief revision *within* a conceptual framework but falters in modeling the epistemic impact of *changing* that framework itself. POE thus underscores that a complete epistemology of science must integrate probabilistic coherence with an account of conceptual innovation and explanatory understanding.
