prompt: |-
  I'm a graduate student in philosophy of science, and I've been wrestling with Clark Glymour's problem of old evidence in Bayesian confirmation theory. The standard Bayesian picture says that a piece of evidence E confirms a hypothesis H just in case P(H | E) > P(H). But if E is already known to be true — if it counts as old evidence — then its probability is 1, and conditioning on it can't shift any probabilities at all. Yet the history of science seems full of cases where a theory derives genuine confirmation from data that were sitting in plain view long before the theory was proposed: the anomalous precession of Mercury's perihelion had been measured for decades before general relativity accounted for it, and the explanatory success felt like a real reason to believe the theory. So we seem to face a dilemma: either Bayesianism is missing something essential about how scientific reasoning actually works, or we have misunderstood what it means for evidence to be old in the first place.

  I am less interested in the technical details of the various proposed fixes — whether Garber-style approaches that add extra hypotheses about logical entailments, or Jeffrey-style redefinitions of the probability space, or counterfactual approaches that ask what the probability would have been had we not already known E — than I am in what the problem reveals about the ambitions and limits of Bayesian epistemology as a whole. If Bayesian confirmation theory struggles to capture one of the central epistemic activities of science (namely, recognizing that a new theory makes sense of facts we already had), what does that imply about the broader Bayesian picture of rationality and belief revision? Does the problem point toward a deeper tension between purely formal constraints on credence and the substantive, content-sensitive judgments that seem to drive theory choice? And to the extent that proposed solutions work, do they do so by quietly importing non-Bayesian or non-probabilistic resources — and if so, what does that tell us about the autonomy of Bayesian epistemology as a framework? Please keep your response to at most 400 words.
