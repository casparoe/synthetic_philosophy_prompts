answer: |-
  Below is a decision procedure designed for your weather forecasting context, addressing the reference class problem with explicit guardrails for data scarcity, relevance tradeoffs, and judgment calls. It's structured as a flowchart-like sequence of questions, with clear stopping points and flags for when human judgment is unavoidable. The procedure prioritizes *actionability* (what to do at 5 AM) and *accountability* (documenting your reasoning).

  ---

  ### **Reference Class Decision Procedure for Probability Forecasts**  
  **Goal:** Select a defensible reference class or halt issuance.  
  **Inputs:** Event to forecast (e.g., "65% chance of precip"), available historical data, meteorological expertise.  

  #### **Step 1: Define the Event and Minimum Data Threshold**  
  **Question:** Is the event **well-defined and measurable** in historical data?  
  - **Good enough:** Yes, if you can unambiguously identify past occurrences (e.g., "precip ≥ 0.01 inches in 24h").  
  - **Dealbreaker:** No (e.g., "heat wave" without a fixed temperature/duration threshold).  
    → **Halt:** Redefine the event with measurable criteria.  
  **Question:** Does *any* plausible reference class have **≥15 data points**?  
  - **Good enough:** Yes (proceed to Step 2).  
  - **Dealbreaker:** No (e.g., forecasting a 1-in-100-year event with <20 years of data).  
    → **Halt:** Do not issue a number; use qualitative language (e.g., "elevated risk of flooding").  
  **Judgment call:** Setting the "minimum data threshold" (here, 15). Adjust based on event rarity (e.g., 30+ for extreme events).  

  #### **Step 2: Identify Candidate Reference Classes**  
  **Question:** What are the **narrowest meteorologically plausible classes**?  
  - **Examples:**  
    - *High-relevance:* "Days with similar 500mb height anomaly, soil moisture, and month."  
    - *Low-relevance:* "All days in June."  
  **Question:** What are the **broadest classes with ample data** (n ≥ 30)?  
  - **Examples:** "All summer days," "all days since 1990."  
  **Output:** List 3–5 candidate classes (narrow to broad).  
  **Judgment call:** Which variables define "meteorological similarity"? (e.g., choosing upper-air patterns vs. surface temps).  

  #### **Step 3: Assess Relevance vs. Data Tradeoff**  
  **Question:** Is there a **narrow class with n ≥ 30**?  
  - **Yes:** Use it. Proceed to Step 5.  
  - **No:** Proceed to Step 4.  

  #### **Step 4: Evaluate Small-Sample Narrow Classes**  
  **Question:** For the best narrow class (highest relevance):  
  - **Is n ≥ 10?** AND  
  - **Is the class homogeneous?** (e.g., no major regime changes like urban heat island effects).  
    - **Yes:** Calculate probability but **compute uncertainty** (e.g., 95% confidence interval).  
      - If CI width ≤ 30% (e.g., 50–80%), use the estimate with a disclaimer: "based on limited similar cases."  
      - If CI width > 30% (e.g., 20–90%), do **not** issue a point estimate; use an interval or qualitative terms.  
    - **No (n < 10 or inhomogeneous):** Discard this class.  
  **Question:** Is there a **broader class with n ≥ 30 and acceptable relevance loss**?  
  - **Test relevance loss:**  
    - Compare broad/narrow class probabilities for recent events.  
    - If differences are ≤15% (e.g., broad: 60%, narrow: 50–65%), relevance loss is acceptable.  
  - **Yes:** Use the broad class. Proceed to Step 5.  
  - **No:** Proceed to Step 6.  
  **Judgment call:** Defining "acceptable relevance loss" (here, ≤15% probability difference).  

  #### **Step 5: Sanity Check and Calibration**  
  **Question:** Is the estimate **plausible given physical constraints**?  
  - **Examples:**  
    - Precipitation probability can’t be 100% if RH < 50%.  
    - "1-in-50-year flood" probability can’t be 0% if dam upgrades occurred.  
  **Question:** Is the class **calibrated** (e.g., 70% forecasts should verify 70% of the time)?  
  - **Good enough:** Yes, or minor drift (<5% bias).  
  - **Dealbreaker:** No (e.g., past forecasts using this class are off by >15%).  
    → Adjust estimate or discard class.  
  **Output:** Issue forecast with reference class documented (e.g., "based on 40 similar days since 2010").  

  #### **Step 6: Final Fallback and Judgment**  
  **Question:** After Steps 1–5, is there **no viable class**?  
  - **Yes:** Do not issue a quantitative forecast. Use:  
    - Qualitative statements (e.g., "high confidence in precipitation").  
    - Expert judgment with disclosure (e.g., "based on model blend and forecaster assessment").  
  - **No:** Revisit Step 2 with expanded classes.  
  **Judgment call:** When to override procedure (e.g., imminent high-impact event).  

  ---

  ### **Case Studies**  
  **Case 1: 3-Day Heat Wave Probability (City, 30-Year Records)**  
  - **Event:** 3 consecutive days >95°F in July.  
  - **Step 1:** Event defined; ≥15 data points exist (30 summers).  
  - **Step 2:** Candidates:  
    - Narrow: "July days with similar high-pressure dome aloft" (n = 8).  
    - Broad: "All July days" (n = 930).  
  - **Step 3:** Narrow class n = 8 < 30 → Proceed to Step 4.  
  - **Step 4:**  
    - Narrow class: n = 8 (<10) → Discard.  
    - Broad class: n = 930; relevance loss test: heat wave probability in broad class (5%) vs. narrow (estimated 30–40% from models). Loss = 25–35% >15% → **relevance loss unacceptable**.  
  - **Step 6:** No viable class → **Do not issue a number.**  
    - **Action:** Use a model-based probability or qualitative forecast ("very likely due to persistent high pressure").  

  **Case 2: "1-in-50-Year Flood" Probability (River, Dam Built 20 Years Ago)**  
  - **Event:** Peak flow ≥ 10,000 CFS (pre-dam 1-in-50-year threshold).  
  - **Step 1:** Event defined; post-dam data n = 20 (<15 for extreme events) → **Halt.** Do not issue.  
    - **Why:** Extremes require n ≫ return period (here, 50 years). Post-dam n=20 is useless (expected events: 0.4). Pre-dam data invalid (regime change).  
  - **Action:** Use physical hydrology models or regional frequency analysis. If forced, disclose: "Insufficient data; estimate based on regional analogues."  

  ---

  ### **Key Takeaways**  
  - **When to halt issuance:**  
    - Data < minimum threshold (Step 1).  
    - No class balances relevance/data (Step 4).  
    - Calibration fails (Step 5).  
  - **Judgment flags:**  
    - Defining meteorological similarity (Step 2).  
    - Setting "acceptable" relevance loss (Step 4).  
    - Overriding procedure for high-stakes events (Step 6).  
  - **Documentation:** Always note:  
    > "Reference class: [class], n=[size], uncertainty=[CI]. Alternatives considered: [classes]."  

  This procedure forces explicit tradeoffs and guards against overconfidence in small samples. At 5 AM, focus on Steps 1–4: if you hit a halt, default to qualitative statements. Your lead wants to see your reasoning—not a perfect number.
