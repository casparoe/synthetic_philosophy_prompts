prompt: |-
  As manager of a small apartment cooperative, I keep encountering two frustrations that residents treat as the same problem. The shared laundry machines are run constantly in half-empty loads, so they wear out early, while a proposed hallway lighting improvement that everyone says they would benefit from never gets funded because almost no one will contribute toward it. Residents describe both as a tragedy of overuse, yet one involves too much use and the other too little contribution. Is there an established distinction for these two configurations, and what exactly marks the boundary between them? I am not looking for a bare label; please identify the nearest concepts for each case, explain how they differ and where their edges lie, and if there is no established term for the second pattern, propose one with a definition that separates it from simple free-riding.
reasoning: |-
  Okay, the user is a manager of a small apartment cooperative dealing with two distinct but commonly conflated problems. The first issue is the overuse of shared laundry machines, where residents run half-empty loads leading to premature wear. The second is the underfunding of hallway lighting improvements, where everyone wants it but few contribute. Residents see both as "tragedy of overuse," but the user correctly identifies that one involves excessive use while the other involves insufficient contribution. 

  Hmm, the user is clearly knowledgeable—they recognize the nuance between these two patterns and want precise conceptual distinctions, not just labels. They’re likely frustrated by the misdiagnosis because it leads to ineffective solutions. Their deeper need might be for clear frameworks to communicate these differences to residents and justify tailored interventions. 

  First, the laundry problem is a classic **tragedy of the commons (ToC)**: a subtractable resource (machine lifespan) depleted by individual overuse. Each resident gains from using the machine freely (clean clothes now), while costs (maintenance, replacement) are shared. The asymmetry is key: my extra load harms everyone but costs me little. 

  The lighting issue is trickier. It’s not about overuse but under-provision of a public good. Everyone benefits from better lighting regardless of contribution—it’s non-excludable and non-rivalrous. This creates a **free-rider problem**, but the user wants to distinguish it from "simple free-riding." Ah, right—simple free-riding might imply one person shirking, but here it’s systemic: *most* withhold contributions because they hope others will pay. That’s the **assurance problem**: no one trusts others to cooperate, so everyone under-contributes. 

  The boundary lies in the core conflict:  
  - **ToC**: Conflict between *individual and collective rationality* in *consumption* (e.g., "If I don’t use it now, someone else will").  
  - **Assurance Problem**: Conflict in *contribution* due to lack of trust (e.g., "I’ll pay only if others do").  

  For the lighting case, "Collective Action Problem" is too broad, and "Free-Rider Problem" misses the coordination element. Since no perfect term exists, proposing **"Underprovision Trap"**—defined as a *systemic failure to fund a public good due to mutual distrust in reciprocal contribution*. This highlights the structural trap (distrust) versus individual selfishness.  

  User’s solution space:  
  - Laundry (ToC): Enforce rules (usage caps, fees) to align costs with use.  
  - Lighting (Underprovision Trap): Build trust via pledges, staged funding, or selective incentives (e.g., naming donors).  

  Key insight: The laundry’s costs are *divisible* (trackable per use), while lighting’s benefits are *indivisible* (all enjoy equally). That’s why solutions diverge.
answer: |-
  Your residents are conflating two distinct collective action problems, each with its own dynamics and solutions. The established concepts are:

  ### 1. **Laundry Machines: Classic "Tragedy of the Commons" (ToC)**  
     - **Core Mechanism**: *Overconsumption of a rivalrous, subtractable resource*.  
       Each use directly depletes the finite lifespan of machines (a "common-pool resource"). Residents gain *private benefits* from using the machine (clean laundry), while the *costs* (wear-and-tear, replacement) are socialized. Rational individuals maximize personal utility by overusing the resource, leading to premature depletion.  
     - **Boundary Conditions**:  
       - **Rivalry**: One user's consumption reduces availability for others (e.g., machines occupied longer).  
       - **Subtractability**: Cumulative use physically degrades the resource.  
       - **Low Accountability**: Costs aren't tied to individual usage volume.  

     **Solution Lever**: **Internalize costs** (e.g., per-load fees, usage caps) to align individual incentives with collective preservation.

  ---

  ### 2. **Lighting Improvement: "Assurance Problem" (or "Underprovision Trap")**  
     - **Core Mechanism**: *Under-contribution to a public good due to coordination failure*.  
       Hallway lighting is a **non-rivalrous, non-excludable public good**: one resident's benefit doesn’t reduce others' access, and no one can be excluded from using it. Residents withhold contributions fearing others won’t pay ("free-riding"), making the project fail even though all desire it. Unlike simple free-riding, this is a **mutual distrust dilemma**—each would contribute *if assured others will too*.  
     - **Boundary Conditions**:  
       - **Non-Rivalry/Non-Excludability**: Contributions create shared benefits no one can be denied.  
       - **Threshold Dependency**: The good requires a minimum funding level to materialize.  
       - **Conditional Cooperation**: Willingness to contribute depends on perceived participation of others.  

     **Solution Lever**: **Build assurance** (e.g., pledges, visible commitments, staged funding targets) to overcome distrust.

  ---

  ### Key Distinctions:  
  | **Trait**               | Tragedy of the Commons (Laundry)       | Assurance Problem (Lighting)          |  
  |--------------------------|----------------------------------------|----------------------------------------|  
  | **Core Conflict**        | Over-*extraction* of finite resources | Under-*provision* of shared benefits |  
  | **Resource Type**        | Common-pool (rivalrous, subtractable) | Public good (non-rivalrous, non-excludable) |  
  | **Individual Incentive** | "Use it before others do"             | "Don’t pay if others won’t"           |  
  | **Failure Mode**         | Resource depletion                   | Project abandonment                  |  
  | **Primary Trust Issue**  | Lack of restraint (greed)            | Lack of mutual commitment (distrust) |  

  ---

  ### Proposed Term for the Lighting Case: **"Underprovision Trap"**  
  - **Definition**: *A collective failure to produce a public good due to widespread conditional cooperation, where individuals withhold contributions unless assured others will reciprocate, leading to mutually undesired underinvestment.*  
  - **Distinction from Simple Free-Riding**:  
    Simple free-riding involves *unilateral exploitation* (one person benefits without contributing). The Underprovision Trap is *multilateral*—most or all residents are *conditional cooperators* who *would* contribute if assured of collective action, but mutual skepticism paralyzes funding. It’s a coordination failure, not just selfishness.

  ---

  ### Practical Implications for Your Cooperative:  
  - **Laundry (ToC)**:  
    - Implement **usage-based pricing** (coin-operated machines) or **access rules** (booking slots).  
    - **Goal**: Make costs proportional to consumption.  
  - **Lighting (Underprovision Trap)**:  
    - Use **assurance devices**:  
      - **Threshold pledges**: "Project launches if 80% commit $X."  
      - **Sequential contributions**: Display a "funding thermometer" to show progress.  
      - **Seed funding**: Secure a small anchor donor to inspire confidence.  
    - **Goal**: Transform conditional cooperators into active contributors.  

  By treating these as distinct syndromes, you can deploy targeted solutions. The laundry issue requires *restraint mechanisms*; the lighting needs *commitment catalysts*. Clarifying this to residents may itself reduce resistance to interventions.
