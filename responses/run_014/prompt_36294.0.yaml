prompt: |-
  My friend is one of those people with a hot take on everything the EU should and shouldn't be allowed to do. Her verdicts so far: trade deals and tariffs at EU level, yes; product standards for anything sold across borders, EU level, yes; emission rules where the pollution crosses borders, yes; letting the EU court strike down national rules that discriminate against citizens of other member states, yes; making candidate countries abolish the death penalty before they can join, yes; retirement age, national; how history gets taught in schools, national; abortion, national; income tax rates on individuals, national. Next week's argument is about an EU court ruling that would force every member state to legalize same-sex marriage. What's she going to say? I care less about the answer than about the rule she's implicitly running -- is it pooling sovereignty wherever effects leak across borders, or keeping anything touching national identity out of Brussels while taking the "technical" stuff, or treating the EU as a shield for minorities against national majorities? Several of those fit her track record, they don't all agree on this case, and I want to know which one she's really running and what case I should bring up to tell them apart.
reasoning: |-
  Okay, let me tackle this user's query. They're describing their friend's stance on EU competencies and want to predict her reaction to an EU court ruling on same-sex marriage. The user really wants to uncover the underlying principle behind her positions. 

  First, I need to map out her existing positions to identify patterns. She supports EU-level authority on trade deals, product standards, cross-border pollution, non-discrimination rulings, and accession criteria like abolishing the death penalty. On the other hand, she reserves retirement age, history education, abortion, and income tax for national control. 

  The key here is distinguishing between cross-border spillover issues and national sovereignty concerns. Her "yes" list clearly deals with preventing negative externalities between member states - like trade barriers or environmental impacts. The "national" list involves core identity or fiscal autonomy, where decisions mainly affect domestic populations. 

  For the same-sex marriage issue, her likely objection would be framing marriage as a core societal institution tied to national identity/culture, not a cross-border matter. But there's tension here: the death penalty ban is also value-driven, yet she accepts it as an accession requirement. 

  Ah, that's the critical differentiator! Accession criteria set pre-entry conditions for joining a club, while imposing marriage rules on existing members overrides their domestic policies. This reveals her deeper principle: pooled sovereignty only where necessary to prevent tangible cross-border harm, not to impose shared moral values internally. 

  The user's best test case would be contrasting same-sex marriage with the death penalty stance to force this distinction. If she rejects the court ruling but accepts accession criteria, her model is spillover-focused; if she rejects both, she might be more sovereignty-absolutist. But her track record suggests the former. 

  I should emphasize how this exposes her core framework: Brussels as a technical problem-solver for border-crossing issues, not a values enforcer. The death penalty exception is pragmatic - you don't have to join the club if you disagree. Same-sex marriage would break that contract.
answer: |-
  Based on your friend's track record and the underlying principles you've identified, here's the prediction and the key test case:

  1.  **Prediction:** Your friend will **vehemently oppose** the EU court forcing member states to legalize same-sex marriage.
  2.  **Her Likely Argument:** She will argue that the definition of marriage is a fundamental aspect of **national identity, societal values, and cultural tradition**. It falls squarely within the realm of decisions that should be made by national parliaments and reflect the will of the national majority. She will likely see this as Brussels (or the court) overstepping its bounds and imposing a values judgment on sovereign nations, akin to dictating abortion policy or how history is taught.
  3.  **The Rule She's Implicitly Running:** The dominant principle in her track record is **"Pooling sovereignty only where necessary to manage tangible cross-border spillovers or ensure the core function of the single market."**
      *   **Trade/Tariffs/Product Standards/Pollution:** Directly prevent negative externalities (trade barriers, unsafe products, pollution) crossing borders.
      *   **EU Court Striking Down Discrimination:** Ensures the core freedom of movement and non-discrimination *within* the single market, preventing national rules from undermining it.
      *   **Death Penalty for Candidates:** Seen as a pre-condition for joining the *club* based on shared fundamental values, decided collectively by existing members before accession. It's about defining the club's identity *before* entry, not imposing rules *after*.
      *   **Retirement Age/History/Abortion/Income Tax:** Primarily have domestic impact, deeply tied to national social contracts, culture, identity, or fiscal autonomy.

  4.  **Why the Other Rules Don't Fit as Well:**
      *   **"Keeping technical stuff in Brussels, identity stuff national":** While partially true (product standards = technical? mostly, death penalty = identity?), the cross-border pollution rule is more about solving collective action problems than being purely "technical." The non-discrimination court ruling is fundamentally about values (equality) but justified by the *functional need* for the single market to work. Her rule is more nuanced than just "technical vs. identity."
      *   **"EU as a shield for minorities":** Her track record actively *rejects* this as a core EU function. She explicitly says abortion (a key minority rights issue in many places) should be national. Supporting non-discrimination for *mobile EU citizens* (cross-border workers, students) is functional for the single market, not a general mandate for the EU to protect *all* domestic minorities from their own national majorities. Her "no" on an EU abortion mandate is the clearest rejection of this principle.

  5.  **The Crucial Test Case to Tell Them Apart: The Death Penalty vs. Same-Sex Marriage**
      *   **This is the key contradiction** apparent in her track record that reveals her true principle.
      *   **Bring This Up:** Ask her: *"You supported requiring candidate countries to abolish the death penalty as a condition for joining the EU, which is a profound value judgment imposed by Brussels. If the EU can impose that value for membership, why can't it impose the value of marriage equality on existing members to protect a minority?"*
      *   **Her Likely Response (Revealing the True Rule):** She will distinguish **accession criteria** from **internal governance**.
          *   **Accession Criteria:** These are the *entry requirements* for joining the *club*. Existing members collectively decide the fundamental values new members must share *before* they join. It's about defining the club's identity and setting the bar for entry. The death penalty is seen (in the EU context) as a fundamental human rights violation incompatible with membership. Candidate countries accept these conditions *voluntarily* as part of the accession process.
          *   **Internal Governance:** Once a country is *in* the club, core societal structures like marriage, deeply tied to national identity and culture, should remain the domain of the nation-state, *unless* there is a clear, demonstrable *cross-border functional need* (like ensuring free movement rights for same-sex couples *already married elsewhere* – which she might accept as a limited spillover, but not a mandate to *create* same-sex marriage nationally). Forcing same-sex marriage on existing members is seen as violating national sovereignty on an issue without the *necessary cross-border spillover* to justify pooled sovereignty.
      *   **What This Confirms:** Her core principle is **functional spillover and pre-emptive club definition**, **not** a general mandate for the EU to enforce progressive values against national majorities. The death penalty ban is about setting the *minimum baseline for club membership* agreed upon by existing members. Mandating same-sex marriage internally is seen as exceeding the EU's functional remit and infringing on national identity.

  **In Summary:**

  *   **Prediction:** She'll say "National!" on same-sex marriage.
  *   **Her Implicit Rule:** **Pool sovereignty only where essential to manage demonstrable cross-border spillovers (economic, environmental, market-functioning) or to define the fundamental values required *before* joining the club. All else, especially core societal values and identity, remains national.**
  *   **Test Case:** Contrast her "yes" on the EU imposing the death penalty ban *on candidate countries* with her "national!" stance on abortion/same-sex marriage *for existing members*. Her justification for distinguishing between accession criteria and internal governance will confirm the functional/club-definition principle over a minority-shield or pure identity/technical split.
