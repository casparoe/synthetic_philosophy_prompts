prompt: |-
  I chair a seven-person grants panel at a small private foundation — we fund about eight projects a year out of roughly 200 applications, $150–200k each. Our guidelines tell reviewers to weigh three things: whether the research design is sound, whether the question is worth the money, and whether it can actually be done in the time and budget asked for. Then we vote on whether to recommend funding. The guidelines dont say which of those two things decides. Nobody noticed that was a gap until yesterday.

  Here are the votes on the application in question (an early-career PI, $180k over two years). Format is [design sound / question worth funding / feasible as costed] and then their vote on the funding recommendation:

  - me, Dan, Priya: yes / yes / yes → fund
  - Ines: no / yes / yes → don't fund
  - Marcus: yes / no / yes → don't fund
  - Tom: yes / yes / no → don't fund
  - Ruth: no / no / no → don't fund

  So five of us think the design is sound, five think the question is worth funding, five think it's feasible — and four of us vote no. Add up the criteria and it gets funded; count the funding votes and it dies. Dan says we've walked into a paradox with an actual name but couldn't remember it, and I don't want to spend Tuesday's meeting on trivia.

  Three things make it worse then the tidy version:

  - Ines is one of the two "design isn't sound" votes, but reading her written comments, what she's actually objecting to is a paper this PI published three years ago that she thinks was sloppy. Her premise vote is doing something other than assessing the premise.
  - Ruth voted no on all three and then said out loud that even if she'd said yes to all three she still wouldn't fund it, because we've already made two grants in this area this cycle and the portfolio's lopsided. That consideration is nowhere in the guidelines.
  - Last round we did the opposite. On application 11 a majority of us thought it wasn't feasible, a majority voted to fund it anyway, we funded it, and it's going fine. So if I now insist the criteria control, I'm choosing the rule that produces the answer I want, in the one case where I want it — and Ines is going to point that out within about ninety seconds.

  What I need is a written opinion, roughly 800 words, that I can circulate Monday so people read it before the meeting rather than hearing it cold. It has to:

  (a) say what we do with this application — fund it, reject it, or something else — with the reasoning, not a hedge;
  (b) say what rule the panel adopts for the rest of the cycle, and give the other six something they can apply to the next application mechanically, without relitigating this one;
  (c) say what goes in the feedback letter, since we can't write "the panel found your design sound, your question important and your budget realistic" and "we are not able to fund you" in the same paragraph with nothing in between; and
  (d) state the strongest version of the "just count the funding votes, the criteria are advice" position and answer it, because Marcus will make that argument and he isn't being obtuse.

  Please be committed. I'd much rather you land on a recommendation I can push back on than lay out the options and hand the choice back to me — I've already read the options. If your answer is that we fund against a 4–3 vote, say so plainly and tell me what I say to the four. And give me a definite line on Ruth's portfolio point: I can't work out whether that's a reason to reject this application, a reason to amend the guidelines, or a reason to change how we schedule the cycle, and I have a feeling those three have different right answers and I'm conflating them.
reasoning: |-
  Okay, the user chairs a grants panel facing a tricky voting paradox. They need a decisive recommendation, a clear rule for future applications, guidance on feedback letters, and a rebuttal to the "just count votes" argument. 

  Hmm, the core problem is a logical inconsistency: the application meets all three criteria by majority but fails the funding vote. First, I should identify the paradox—likely Condorcet-related, where individual majorities don't translate to overall approval. 

  The user's hidden stressors are apparent: Ines and Ruth are applying non-guideline criteria, and precedent inconsistency from Application 11 weakens their position. Ruth's portfolio-balance concern is valid but procedural—it shouldn't tank this application. 

  For (a), funding is the only defensible call. The criteria were met, and overriding them invites arbitrariness. For (b), a strict "unanimous no on any criterion kills it, else fund if all pass by majority" rule closes loopholes. 

  The feedback letter (c) must be honest but kind—cite strengths, then note competitive context. For (d), Marcus' "just count votes" stance confuses judgment with rules; the criteria exist to prevent bias. 

  Ruth's portfolio point? Separate it entirely—amend guidelines later, but don't punish this applicant. 

  User needs authority here. No hedging. They’ll push back if needed, but they want ammunition.
answer: |-
  Here is a concise, decisive written opinion (approx. 780 words) for your panel, addressing all requirements:

  ---

  **TO:** Grants Panel Members  
  **FROM:** Chair  
  **SUBJECT:** Decision Protocol for Application [ID] and Future Reviews  
  **DATE:** [Circulation Date]

  **1. Decision on Application [ID]: FUND**  
  This application meets all three funding criteria by majority vote (5/7 on sound design, 5/7 on question merit, 5/7 on feasibility). Despite four "no" votes on the funding recommendation, the criteria threshold is satisfied. We must fund it. To reject an application that fulfills our stated benchmarks would violate our guidelines, undermine our credibility, and penalize the applicant for panel inconsistencies. The fact that individual votes diverged from the aggregate criteria assessment highlights a procedural flaw, not an issue with the application itself.  

  **2. Rule for Current/Future Cycles: Criteria Control Funding**  
  Effective immediately, the following rule applies:  
  > *"An application will be recommended for funding if, and only if, a majority of reviewers approve it on ALL THREE criteria (design, question merit, feasibility). Final votes are advisory but not determinative; the criteria outcomes decide."*  

  **Why this rule?**  
  - **Clarity:** Our guidelines prioritize the criteria, not subjective final votes. This aligns action with intent.  
  - **Accountability:** Reviewers must justify "no" votes within the criteria framework. Extraneous objections (e.g., past publications, portfolio balance) become inadmissible.  
  - **Efficiency:** Future applications are assessed mechanically: Tally criterion votes first. If all three pass by majority, fund. If one fails, reject. Relitigation is precluded.  
  - **Fairness:** Applicants are evaluated solely on published standards.  

  **3. Feedback Letter for Application [ID]**  
  The letter must reconcile the criteria approval with rejection by stating:  
  > *"The panel assessed your proposal as having a sound research design, an important research question, and a feasible budget/timeline. However, due to the exceptionally competitive nature of this cycle and limitations in available funding, we are unable to support your application at this time. We encourage you to resubmit in future cycles."*  

  **Rationale:**  
  - Acknowledges strengths truthfully without contradiction.  
  - Attributes rejection to competition (implicitly addressing Ruth’s portfolio concern without endorsing it).  
  - Maintains the foundation’s reputation for impartiality.  

  **4. Addressing "Just Count the Votes" (Marcus’ Position)**  
  *Strongest version of Marcus’ argument:* "Final votes capture nuanced judgment beyond rigid criteria. Forcing funding against a 4–3 majority overrides collective wisdom and disregards unquantifiable concerns like risk or strategic fit."  

  *Rebuttal:*  
  - **Guidelines as Contract:** Reviewers and applicants rely on the published criteria. Overruling them based on opaque deliberations introduces arbitrariness and potential bias.  
  - **Precedent Risk:** Application 11 (funded despite feasibility concerns) proves final votes can ignore criteria. This inconsistency damages our legitimacy. If criteria are merely "advice," our process is performative.  
  - **Diluted Accountability:** Allowing final votes to supersede criteria enables Ruth’s portfolio objections or Ines’ unrelated critiques to override guidelines. This invites chaos.  
  - **Practical Reality:** The "paradox" (likely a *Condorcet cycle* or *majority criterion failure*) arises when reviewers apply criteria inconsistently. Fix the process, not the outcome.  

  **5. Ruth’s Portfolio Concern: Separate the Issues**  
  Ruth’s point about portfolio balance is **valid but misapplied**:  
  - **Not a reason to reject this application:** Portfolio balance is a *foundation-level strategy*, not a criterion for individual reviews. Penalizing this applicant retroactively is unjust.  
  - **A reason to amend guidelines:** Add a fourth criterion: *"Alignment with foundation priorities and portfolio diversity."* Discuss at our next annual review.  
  - **A reason to change scheduling:** Review all applications *before* voting on any, allowing strategic adjustments. Implement this next cycle.  

  **Action for Tuesday:**  
  1. Formally approve funding for Application [ID].  
  2. Adopt the criteria-controlled rule for all remaining applications.  
  3. Draft feedback per Section 3.  
  4. Table guidelines/scheduling amendments for post-cycle review.  

  **To the Four "No" Voters (Including Me):**  
  This decision prioritizes process integrity over individual judgment. We each had the opportunity to reject the application within the criteria framework. Where we failed to coordinate our votes with our criteria assessments, the system corrects the outcome to reflect the application’s merit under our rules. Going forward, the new rule ensures our votes align with our mandate.  

  ---  

  **Key Strengths of This Approach:**  
  - **Decisive:** Forces funding for the application without ambiguity.  
  - **Procedural:** Fixes the voting process transparently, preventing future paradoxes.  
  - **Legitimizes Dissent:** Acknowledges Marcus/Ruth’s concerns while firmly subordinating them to guidelines.  
  - **Isolates Ruth’s Point:** Treats portfolio balance as a *systemic* issue, not an ad hoc veto.  
  - **Anticipates Ines:** Preempts the Application 11 comparison by making criteria the *sole* determinant.  

  **Tuesday Strategy:** Circulate this early. Open the meeting by asking for objections to the proposed *rule* (not the individual decision). If challenged, reiterate: "Our duty is to apply the guidelines consistently, not to rationalize inconsistencies."
