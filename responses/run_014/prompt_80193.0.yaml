answer: |-
  Below is a formal specification of requirements for a fair group decision procedure in your context: a small co-operative with about a dozen members, choosing a point on a one-dimensional continuum (e.g., location on a strip of land or allocation of a budget), where each member has **single-peaked preferences** (one favorite point, with utility decreasing monotonically as you move away). The goal is to define what "fairness" necessitates, independent of any specific rule.  

  ### Core Requirements for Fairness  
  These requirements are derived from social choice theory, tailored to your single-peaked, one-dimensional setting. I classify each as **non-negotiable** (essential for any fair system) or **preferential** (reflects values some groups prioritize). Concrete failure modes illustrate why each is needed.  

  1. **Unanimity (Pareto Efficiency)**  
     - **What**: If all members prefer outcome A over outcome B, the procedure must not select B when A is feasible. In your case: if every member has the same peak, that peak must be chosen.  
     - **Failure mode**: Without this, the group could choose a location all members dislike more than another available point (e.g., planting the garden at a swampy end when everyone prefers the sunny center).  
     - **Status**: Non-negotiable. Violations imply collective irrationality.  

  2. **Anonymity**  
     - **What**: The outcome must depend only on the *set* of reported peaks, not on *who* reported them. Swapping preferences between members shouldn’t change the result.  
     - **Failure mode**: If violated, the system favors specific individuals (e.g., always weighting Alice’s opinion higher than Bob’s), breeding resentment and inequity.  
     - **Status**: Non-negotiable for a co-operative of equals.  

  3. **Neutrality**  
     - **What**: The procedure must not inherently favor any region of the line. If all peaks are mirrored (e.g., shifted or reflected across a point), the outcome should mirror identically.  
     - **Failure mode**: Bias toward one end (e.g., always choosing a point near the left, regardless of preferences) unfairly disadvantages members with peaks on the right.  
     - **Status**: Non-negotiable. Essential for symmetric fairness.  

  4. **Strategy-Proofness (Incentive Compatibility)**  
     - **What**: No member can gain an advantage by misreporting their true peak. Truthful reporting is always optimal.  
     - **Failure mode**: If absent, members might manipulate outcomes (e.g., falsely claiming an extreme preference to "pull" the result closer to their true peak). This erodes trust and distorts the true will of the group.  
     - **Status**: Non-negotiable. Critical to prevent gaming and ensure honest participation.  

  5. **Ordinality / Independence of Irrelevant Alternatives (IIA)**  
     - **What**: The group’s choice between two outcomes should depend *only* on members' relative rankings of those two outcomes (not on other alternatives). In your setting: if no member’s ranking of points A and B changes, the group’s choice between A and B should not change.  
     - **Failure mode**: Procedure becomes manipulable by introducing dummy options (e.g., adding a fake "decoy" location to alter the outcome). Also risks inconsistent decisions.  
     - **Status**: **Preferential** (associated with Arrow-style liberalism). Some argue it’s vital for robustness; others find it too stringent for practical use.  

  6. **Majority Principle (Condorcet Consistency)**  
     - **What**: If a majority of members share a common preference (e.g., all prefer A over B), the procedure must respect it. In single-peaked settings: the outcome should be the "median peak" (the point where ≥50% of peaks are ≤ it and ≥50% are ≥ it).  
     - **Failure mode**: Without this, a minority could override a majority (e.g., 7/12 members want the garden near the river, but it’s built near the road anyway).  
     - **Status**: Non-negotiable for democratic legitimacy.  

  7. **Continuity**  
     - **What**: Small changes in reported peaks should cause only small changes in the outcome.  
     - **Failure mode**: A tiny reporting error (e.g., misplacing a peak by 1cm) could drastically alter the result (e.g., jumping from one end of the land to the other), making outcomes chaotic and unpredictable.  
     - **Status**: **Preferential**. Prioritizes stability but isn’t strictly necessary for fairness.  

  ---

  ### Suspected Incompatibilities  
  - **Ordinality (IIA) is the primary troublemaker**. It conflicts with **Strategy-Proofness** and **Majority Principle** in *generic* voting systems (per Arrow’s Impossibility Theorem).  
  - **Why IIA causes problems**: It demands that pairwise choices depend *only* on rankings of those pairs. In unrestricted preference domains, this forces procedures to be dictatorial or ignore majorities.  
  - **In your specific setting (single-peaked on a line), these incompatibilities dissolve**. Single-peakedness restricts preferences sufficiently to avoid Arrow’s impossibility.  

  ---

  ### The Median Procedure: Does It Survive?  
  Your hunch—that the **median of all reported peaks** is fair and strategy-proof—is **largely correct and satisfies all non-negotiable requirements** in your setting:  
  - **Unanimity**: If all peaks are identical, the median is that point. ✅  
  - **Anonymity**: Only peak values matter, not who reports them. ✅  
  - **Neutrality**: The median is symmetric under reflection/translation. ✅  
  - **Strategy-Proofness**: In single-peaked domains, no one benefits from lying. Moving your peak away from the median only pulls the outcome farther from your true peak. ✅  
  - **Majority Principle**: The median *is* the Condorcet winner (beats any other point in pairwise comparisons). ✅  
  - **Continuity**: Small peak shifts cause small median shifts (if group size is odd). ✅  
  - **Ordinality (IIA)**: Holds *for pairwise comparisons* because the median voter’s preference between A and B determines the group’s choice. ✅  

  **Caveats**:  
  1. **Even group sizes**: With an even number (e.g., 12), the median is an interval. You must break ties:  
     - **Midpoint of central peaks**: Satisfies Neutrality and Continuity, but *fails Strategy-Proofness* (members can manipulate by misreporting to shift the midpoint).  
     - **Random tie-break**: Neutral and Strategy-Proof *in expectation*, but random outcomes may feel unfair.  
     - **Predefined rule (e.g., leftmost median)**: Strategy-Proof, but *fails Neutrality* (biases toward one side).  
     - **Solution**: Use an odd-sized subgroup or consensus for tie-breaking.  
  2. **Ordinality (IIA)**: The median satisfies IIA *only because preferences are single-peaked*. In generic settings, IIA would kill it—but your structure saves it.  

  **Conclusion**: Your hunch survives. The median procedure is fair, strategy-proof, and robust *precisely because your problem is one-dimensional with single-peaked preferences*. This structure is "special" and avoids generic impossibilities. For your co-operative, the median is ideal if:  
  - You handle ties cleanly (e.g., ensure an odd number of voters).  
  - You reject strict Ordinality (IIA) as non-essential (many theorists do).  

  **Final recommendation**: Adopt the median rule. It meets all non-negotiable requirements, is intuitive, and incentivizes honesty. Test it with historical data or simulations to confirm robustness for your group size.
