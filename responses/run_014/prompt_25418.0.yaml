answer: |-
  Based on your deep engagement, here’s a rigorous specification of the **desiderata** any adequate accuracy-first epistemology (AFE) must satisfy to be a viable foundational framework, framed as non-negotiable requirements with their justifications and critical tensions:

  ### I. Core Normative Capture: What *Must* Be Recovered?
  1.  **Synchronic Probabilism (Non-Negotiable):** *Must* show that coherent credences (satisfying probability axioms) are strictly accuracy-dominant over incoherent ones under *any rational choice rule* (dominance/strict dominance/admissibility).  
      *   **Why Requirement?** Probabilism is the bedrock synchronic norm. Failure here collapses AFE's claim to ground core epistemology.  
      *   **Pressure Point:** Requires **Strict Propriety** (see III.1). Without it, incoherent credences can be equally accurate, undermining the argument.

  2.  **Diachronic Conditionalization (Conditional Success):** *Must* recover (some form of) conditionalization (e.g., strict dominance arguments for plan conditionalization).  
      *   **Why Requirement?** Updating is central to epistemology. AFE cannot remain purely synchronic and claim comprehensiveness.  
      *   **Pressure Point:** Requires significant auxiliary assumptions (e.g., **Ur-Prior Rationality**, **Plan-Intention Commitment** - see IV.3). This is the **primary locus of "smuggling" charges**.

  3.  **Evidential Constraints (Scope Challenge):** *Must* accommodate norms linking credences to evidence (e.g., Principal Principle, Reflection, Indifference principles).  
      *   **Why Requirement?** Epistemic rationality is evidence-responsive. Purely "structural" norms (probabilism, cond.) are insufficient.  
      *   **Pressure Point:** Requires showing how evidence *fixes* the uniquely rational prior/ur-prior via accuracy arguments (e.g., **Objective Bayesianism**). Highly contentious.

  ### II. The Accuracy Measure: Constraints & Justifications
  1.  **Propriety (Minimal Rationality):** *Must* use a (strictly) proper inaccuracy measure.  
      *   **Why Requirement?** **Non-Negotiable.** Propriety ensures that *announcing* your true credence minimizes *expected* inaccuracy *by your own lights*. This prevents the "epistemic tragedy" where you believe credence C is best, yet know that announcing a *different* credence D would be more accurate in expectation. Violating propriety makes epistemic self-undermining rational. Strict Propriety ensures unique minimization.

  2.  **Strict Propriety (Core Synchronic Success):** *Must* use a strictly proper inaccuracy measure.  
      *   **Why Requirement?** **Non-Negotiable for Probabilism.** Only strict propriety guarantees that *only* coherent credences avoid strict dominance by some alternative credence function. Without it, incoherent credences might be non-dominated (e.g., with asymmetric scores), undermining the dominance argument for probabilism.

  3.  **Continuity & Convexity (Plausibility/Workability):** *Should* use continuous, strictly convex measures.  
      *   **Why Requirement?** Ensures robustness (small credence changes cause small inaccuracy changes) and that mixtures of credences are less accurate than their endpoints (plausible for epistemic risk). Not *absolutely* non-negotiable, but highly desirable for technical workability and intuitive results. Non-convex measures yield bizarre dominance relations.

  ### III. Philosophical Burdens: What Accuracy-First Must Own
  1.  **The Primacy & Normativity of Accuracy:** *Must* justify why accuracy is the *fundamental* epistemic good.  
      *   **Why Requirement?** AFE isn't just *using* accuracy; it claims accuracy *grounds* all other epistemic norms. It must:  
          *   Argue why accuracy is intrinsically/epistemically valuable (not merely instrumentally pragmatic).  
          *   Address the "Swamping Problem" variant: Why is accurate belief *as such* valuable, not just the consequences of having it?  
      *   **Pressure Point:** Risk of conflating epistemic and pragmatic value. Must delineate epistemic value as distinct.

  2.  **The Value Problem (Minimal Success):** *Must* explain why true belief is better than false belief.  
      *   **Why Requirement?** **Non-Negotiable.** This is the minimal, core intuition about epistemic value AFE builds upon. If it can't explain *this*, it fails at the starting block. It's "someone else's job" only *after* AFE explains this bedrock fact.

  3.  **The Scope of Epistemic Normativity:** *Must* either:  
      a) Derive *all* central epistemic norms solely from accuracy (ambitious monism), OR  
      b) Provide a principled account of why some norms (e.g., diachronic, evidential) require auxiliary principles *compatible* with accuracy's primacy.  
      *   **Why Requirement?** AFE's claim to be "first" implies explanatory comprehensiveness or a clear meta-normative story for its limits.

  ### IV. Mandatory Objections to Defuse (Not Dismiss)
  1.  **The "Direction of Explanation" Problem:** *Must* convincingly argue that accuracy norms *explain* epistemic rationality, not merely track it.  
      *   **Why Critical?** The core objection: We value accuracy *because* rational beliefs aim at truth, not vice-versa. AFE must show its directionality isn't backwards. Requires meta-normative argument about grounding.

  2.  **Pragmatism/Conflation Charge:** *Must* demonstrate that accuracy-based arguments generate genuinely *epistemic* reasons, distinct from pragmatic/instrumental reasons for wanting true beliefs.  
      *   **Why Critical?** If AFE just shows "believing accurately is useful," it hasn't captured distinctively epistemic normativity. Requires a robust account of epistemic value vs. practical value.

  3.  **The "Extra Assumptions" Charge (Diachronic):** *Must* justify any auxiliary principles needed for diachronic norms (e.g., rationality of initial priors, commitment to plans) as inherently epistemic or necessarily entailed by the accuracy-first project.  
      *   **Why Critical?** Critics (e.g., Schoenfield, Carr) argue principles like "Plan Conditionalization is Rational" are smuggled in and aren't *derived* solely from accuracy. AFE must show these are *essential* to accuracy-minimization over time/agency.

  ### Critical Tensions & The Most Exclusionary Requirement

  1.  **The Sharpest Tension: Monism vs. Diachronic Success:**  
      *   **Conflict:** The purest monistic ambition (derive *all* norms solely from minimizing expected inaccuracy) struggles mightily with diachronic norms. Recovering conditionalization robustly *requires* significant auxiliary assumptions (rational ur-priors, commitment to plans).  
      *   **Forcing Choice:** You must either:  
          a) **Weaken Monism:** Accept that accuracy is primary but *requires* supplementation with other rational commitments (e.g., agency, diachronic coherence) to get a full picture. (Greaves, Wallace).  
          b) **Restrict Scope:** Claim AFE successfully grounds synchronic norms, and diachronic norms have a different (but compatible) source. (Less satisfying for a foundational project).  
          c) **Pursue Radical Options:** E.g., "Quantum" approaches evaluating entire credal histories at once (technically complex, philosophically novel).

  2.  **Strict Propriety vs. Uniqueness/Intuitions:**  
      *   **Conflict:** Strict Propriety is non-negotiable for probabilism, but it heavily constrains the inaccuracy measure (e.g., only Brier Score is strictly proper, continuous, convex *and* separable). This raises concerns about arbitrariness ("Why Brier?") and clashes with intuitions favoring other measures (e.g., Log Score) in specific contexts.

  **The Single Most Exclusionary Requirement: Strict Propriety**

  *   **Why it Does the Most Work to Exclude:** Strict Propriety is the linchpin of the dominance argument for probabilism. Without it, incoherent agents can be accuracy non-dominated, fatally undermining AFE's core synchronic result. However:
      *   It **excludes virtually all intuitive but non-strictly-proper measures** (e.g., absolute value score).
      *   It **forces the use of measures** (like Brier or Log) that have specific, sometimes counter-intuitive properties (e.g., Log Score's extreme sensitivity to small credences near 0/1).
      *   It **creates the pressure** driving the "uniqueness" debate: If multiple strictly proper scores exist, which one is "correct"? Arguments for Brier (convexity, continuity) or Log (information-theoretic) become crucial but potentially contentious additions *beyond* strict propriety itself.
  *   **Impact:** Committing to Strict Propriety locks you into a specific mathematical landscape for the inaccuracy measure, decisively shaping all subsequent arguments. Attempts to relax it (e.g., to mere propriety) fatally weaken the case for core norms like probabilism.

  ### Strategic Implications for Your Dissertation

  1.  **Pressure Test Monism:** Can your argument genuinely derive the norms you focus on *without* smuggling in auxiliary assumptions incompatible with accuracy's primacy? Scrutinize the diachronic case hardest.
  2.  **Justify Strict Propriety:** Don't just assume it. Engage with why it's necessary (dominance avoidance) and defend your choice of measure (Brier vs. Log) if needed. This is a foundational commitment.
  3.  **Tackle the Normativity Head-On:** Don't postpone explaining why accuracy is the fundamental epistemic good. How does your account handle the "direction of explanation" and "pragmatic conflation" objections? This is where AFE often feels philosophically thinnest.
  4.  **Map the Tensions:** Explicitly position your work within the tensions (e.g., "I accept the need for Plan Rationality to recover conditionalization, arguing it's a necessary component of epistemic agency compatible with accuracy-first"). Acknowledge the cost.

  By rigorously demanding that AFE satisfies these desiderata and confronting the tensions (especially Monism vs. Diachronic and the exclusionary power of Strict Propriety), you'll build a far stronger chapter, whether you ultimately endorse, modify, or reject the accuracy-first framework. Good luck!
