prompt: |-
  I'm a PhD student in philosophy of economics, and I TA an intermediate microeconomics seminar with a mixed group of economics and philosophy students — about 16 of them, one 60-minute session. I'd like you to design an in-class game that makes them feel the force of the ordinality of utility: the point that revealed preference over certain outcomes recovers only an ordering, so the numerical utility values are arbitrary up to monotonic transformation and carry no independent meaning. I want them to hit a second, sharper point on their own, before anyone names it: when the modeler tries to use those revealed numbers to predict a choice under risk, the "distances" between the numbers turn out to be arbitrary and the prediction breaks, so the ordering the choices revealed is not enough to model risk. Please give me the roles (agent, modeler, and how the rest of the class is used), a payoff scheme that needs no real money, a minute-by-minute timeline, and a debrief that maps specific moments to the invariance point and to the ordinal-versus-cardinal gap. I also want to know what will predictably go wrong the first time I run it — I suspect their revealed preferences won't be transitive, and I'd like your read on whether that's a bug or a feature I can exploit — and a frank note on which part of the expected-utility story the activity cannot reproduce and I will have to supply myself.
