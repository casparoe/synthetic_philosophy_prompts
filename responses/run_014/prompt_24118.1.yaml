  We are designing an in-class game to illustrate the ordinality of utility and the problem when extending to risk.
   Key points:
   1. Ordinality: Utility numbers are arbitrary up to monotonic transformations; only the order matters for certain choices.
   2. The gap: When moving to risky choices, the arbitrary scaling of utility (the "distances") becomes crucial and the model breaks.

   Structure:
   - We will have one student play the role of an "Agent" (whose preferences we observe).
   - Another student (or a pair) as the "Modeler" (who tries to assign utility numbers and then predict risky choices).
   - The rest of the class (the "Audience") will be divided into groups to observe and help with the modeling.

   Steps:

   1. **Revealed Preferences for Certain Outcomes**: 
      - We present the Agent with a set of 5 alternatives (e.g., bundles of goods or named outcomes: A, B, C, D, E).
      - The Agent ranks these alternatives (without assigning numbers) by making pairwise choices in front of the class.
      - We record the ranking. (We assume transitivity, but if not, we can discuss as a feature.)

   2. **Assigning Utility Numbers**:
      - The Modeler (with help from the Audience) assigns utility numbers to each outcome that are consistent with the observed ranking (i.e., if A > B, then U(A) > U(B)).
      - We encourage them to assign numbers arbitrarily (but they must be increasing with the ranking). They might assign linear, concave, convex, etc.

   3. **Predicting a Risky Choice**:
      - We present the Agent with a choice between two lotteries:
          Lottery 1: p chance of outcome X, (1-p) chance of outcome Y.
          Lottery 2: q chance of outcome Z, (1-q) chance of outcome W.
      - The Modeler uses the assigned utilities to compute expected utilities and predicts which lottery the Agent will choose.

   4. **Agent's Actual Choice**:
      - The Agent chooses between the two lotteries (without knowing the modeler's prediction).
      - We then compare the prediction and the actual choice.

   5. **Debrief**: 
      - We reveal that the Modeler's prediction was based on arbitrary utility numbers (because any monotonic transformation would preserve the ranking for certain choices, but not for the risky ones).
      - We discuss why the prediction failed: the Modeler assumed cardinal utility (with meaning in the differences) but the revealed preferences only gave ordinal information.

   How to avoid real money? 
      - Use hypothetical payoffs (e.g., "imagine these are bundles of goods you like") or use non-monetary rewards (like candy, but not necessary). 
      - We can use abstract outcomes: e.g., A = 1 apple and 1 banana, B = 2 apples and 0 bananas, etc. But to keep it simple, we can label them as "Outcome A", "Outcome B", etc. and let the Agent have an internal ranking (which they must be consistent with).

   Timeline (60 minutes):

   0-5 min: Introduction and setup. Explain the roles and the task. Choose the Agent and the Modeler(s). (Modeler can be a pair of students, or one with help from the class.)

   5-15 min: **Revealed Preferences**.
      - Present 5 outcomes (A, B, C, D, E) on the board. 
      - The Agent makes pairwise choices (e.g., "A vs B", then "winner vs C", etc.) until we have a complete ranking. (We can do a tournament.) 
      - Record the ranking. (If there's intransitivity, note it and ask the Agent to reconsider. If they stick, then we have a discussion point about rationality assumptions.)

   15-25 min: **Assigning Utilities**.
      - The Modeler (with input from the Audience) assigns utility numbers to each outcome. They must assign numbers that are increasing with the ranking. 
      - They write them on the board: U(A), U(B), etc.

   25-35 min: **Predicting a Risky Choice**.
      - Present two lotteries. Example:
          Lottery 1: 50% chance of the top-ranked outcome, 50% chance of the bottom-ranked.
          Lottery 2: 100% chance of the middle-ranked outcome.
      - But to make it more interesting, we can choose non-trivial lotteries. For example:
          Lottery 1: 50% chance of A (best), 50% chance of E (worst)
          Lottery 2: 100% chance of C (middle)
      - The Modeler computes:
          EU1 = 0.5 * U(A) + 0.5 * U(E)
          EU2 = U(C)
      - Then predicts: if EU1 > EU2, then the Agent will choose Lottery 1; else Lottery 2.

   35-40 min: **Agent's Actual Choice**.
      - Ask the Agent: "Given these two lotteries, which one do you choose?" 
      - The Agent chooses without knowing the modeler's prediction.

   40-50 min: **Reveal and Discuss**.
      - Reveal the Modeler's prediction and the actual choice. They will likely differ.
      - Ask the Modeler and Audience: Why did the prediction fail?

   50-60 min: **Debrief**.
      - Map the steps to the concepts:
          a. The revealed preferences (pairwise choices) only gave us an ordering. The utility numbers were arbitrary (monotonic transformations preserve the order). 
