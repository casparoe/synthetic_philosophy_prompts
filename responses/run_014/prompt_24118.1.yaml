answer: |-
  ### In-Class Game: **The Utility Arbitrage Challenge**

  #### **Learning Objectives**
  1. **Ordinality of Utility**: Revealed preferences over certain outcomes yield only an ordering; numerical utilities are arbitrary up to monotonic transformation.
  2. **Cardinality Gap**: When predicting choices under risk, the "distances" between utility numbers matter—but these distances are arbitrary without additional assumptions, leading to prediction failures.

  ---

  ### **Game Setup**
  **Outcomes**: 5 abstract rewards (no real money needed):  
  - **A**: "Private concert with your favorite artist"  
  - **B**: "All-expenses-paid weekend getaway"  
  - **C**: "Latest smartphone"  
  - **D**: "Gourmet dinner for two"  
  - **E**: "Signed book from a renowned author"  

  **Roles**:  
  - **Agent (1 student)**: Chooses between certain outcomes (revealing preferences) and later between risky lotteries.  
  - **Modelers (2 students)**: Assign utility numbers to outcomes based on the Agent's revealed preferences. Predict the Agent's lottery choice using expected utility.  
  - **Audience (13 students)**: Split into two teams (Team 1 and Team 2) to advise the Modelers. Observe inconsistencies.  

  **Payoff Scheme**:  
  - No real money. "Bragging rights" for correct predictions.  
  - Agent receives symbolic "choice tokens" (e.g., stickers) to incentivize authentic preferences.  

  ---

  ### **Timeline (60 Minutes Total)**

  #### **Phase 1: Revealing Ordinal Preferences** (15 mins)
  - **0–5 mins**: Introduce outcomes. Agent ranks them via **pairwise comparisons** (e.g., "A vs. B? B vs. C?").  
    - *Example*: If Agent chooses A > B, B > C, C > D, D > E, final ranking: **A > B > C > D > E**.  
  - **5–10 mins**: Record ranking publicly. If intransitivity occurs (e.g., A > B, B > C, but C > A), pause and discuss:  
    - "Can we assign utilities if preferences aren't transitive? Why/why not?"  
    - *Exploit this bug*: Highlight that transitivity is necessary for **any** utility representation (ordinal or cardinal).  
  - **10–15 mins**: Assign Modelers and Audience teams.  

  #### **Phase 2: Assigning Utility Numbers** (15 mins)  
  - Modelers (advised by their Audience teams) assign utilities to outcomes **consistent with the ranking**.  
    - **Modeler 1 (Team 1)**: Uses linear scale (e.g., U(A)=100, U(B)=80, U(C)=60, U(D)=40, U(E)=20).  
    - **Modeler 2 (Team 2)**: Uses nonlinear scale (e.g., U(A)=100, U(B)=95, U(C)=30, U(D)=25, U(E)=0).  
  - Emphasize: *Both are valid ordinal representations*.  

  #### **Phase 3: Predicting Risky Choices** (15 mins)  
  - Present two lotteries:  
    - **Lottery 1**: 70% chance of **A**, 30% chance of **E**.  
    - **Lottery 2**: 100% chance of **C**.  
  - Modelers compute expected utilities (EU) and predict the Agent's choice:  
    - *Modeler 1 (linear)*: EU1 = (0.7×100 + 0.3×20) = 76; EU2 = 60 → Predicts Lottery 1.  
    - *Modeler 2 (nonlinear)*: EU1 = (0.7×100 + 0.3×0) = 70; EU2 = 30 → Predicts Lottery 1.  
    - *Adjust if predictions align*: Use asymmetric probabilities (e.g., 60% A/40% E) to force divergence.  
  - **Agent chooses** between lotteries (secretly, to avoid bias).  

  #### **Phase 4: Reveal & Discuss** (15 mins)  
  - Announce Modelers' predictions and Agent's actual choice.  
  - *Likely outcome*: Predictions conflict, or both are wrong (e.g., risk-averse Agent picks Lottery 2).  

  ---

  ### **Debrief** (15 mins)  
  | **Game Moment**          | **Conceptual Link**                                                                 | **Discussion Question**                                                                 |
  |--------------------------|-------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------|
  | Agent’s pairwise choices | **Ordinality**: Preferences reveal ordering, not magnitudes.                        | "Why did both Modelers’ utilities ‘work’ for certain choices? What do they share?"      |
  | Nonlinear vs. linear U   | **Monotonic invariance**: Any increasing transformation preserves ordinal rankings. | "If U(B)=80 or 95, does it change the Agent’s ranking? Why is this a problem for risk?" |
  | Conflicting predictions  | **Cardinality gap**: Arbitrary "distances" break risk predictions.                  | "Why did both models fail? What’s missing if we only know the order?"                   |
  | Agent’s lottery choice   | **Risk requires cardinality**: vNM utilities need intensity, not just order.         | "What would we need to know to predict this choice correctly?"                          |

  **Key Points**:  
  - Ordinal utility is sufficient for **certain choices** (ranking is invariant to monotonic transforms).  
  - Risk predictions fail because **EU relies on arbitrary utility differences** (e.g., U(A)–U(E) varies between Modelers).  
  - **Resolution**: von Neumann-Morgenstern (vNM) theory adds axioms (continuity, independence) to extract cardinal utilities from lottery preferences—not from certain outcomes.  

  ---

  ### **Predictable Challenges & Solutions**  
  1. **Intransitivity (Bug → Feature)**:  
     - **Likelihood**: High (e.g., Agent picks A > B, B > C, but C > A).  
     - **Exploit**: "Without transitivity, we can't even define an ordinal utility! This exposes a foundational rationality assumption."  

  2. **Modeler Predictions Align**:  
     - **Why**: If linear utilities coincidentally match Agent’s risk attitude.  
     - **Fix**: Use asymmetric probabilities (e.g., 60% A/40% E) to amplify scaling differences.  

  3. **Agent Chooses "Irrationally"**:  
     - **Why**: Risk aversion/seeking, or indifference.  
     - **Use**: "This shows why we need vNM axioms—real people deviate, but the model assumes consistency."  

  ---

  ### **Limitations & What You Must Teach**  
  - **Cannot Replicate**: The **independence axiom** (vNM’s key insight).  
    - *Why*: The game shows why cardinality is *needed*, not how vNM *derives* it from lottery preferences.  
    - *Bridge the gap*: Post-game, explain:  
      > "vNM asks: ‘What probability p makes you indifferent between **C for sure** and **p chance of A, (1-p) chance of E**?’ This reveals cardinal ‘distances’."  

  - **Cardinality Nuance**:  
    - Emphasize that vNM utilities are **unique up to affine transforms** (U → aU + b, a > 0), preserving risk attitudes. Ordinal transforms (e.g., U³) do not.  

  ---

  ### **Instructor Notes**  
  - **Prep**: Print outcome cards; use whiteboard for rankings/utilities.  
  - **Pacing**: Keep phases strict; use timers. Debrief is critical.  
  - **Depth**: Post-game, formalize vNM axioms and contrast with ordinality.  
  - **Reusability**: Swap outcomes (e.g., "A = 4 apples, 0 bananas; B = 3 apples, 2 bananas") for economics-focused groups.  

  This game forces students to confront the **ordinal-cardinal gap** viscerally. By the debrief, they’ll grasp why "revealed preference isn’t enough for risk"—and why economics needs vNM for predictions.
