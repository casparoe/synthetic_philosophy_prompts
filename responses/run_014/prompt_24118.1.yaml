      - The Agent might choose in a way that is not consistent with expected utility (e.g., due to risk aversion or seeking). But that's the point: the modeler's assignment of utility numbers did not capture the Agent's risk attitude because the original utility numbers were arbitrary. We can then explain that in expected utility, we need to elicit preferences over lotteries to assign a cardinal utility.

