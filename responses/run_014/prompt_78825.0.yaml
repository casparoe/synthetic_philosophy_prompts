  First, the dilemma: either introspection presents phenomenal properties, making illusionism self-undermining, or the seeming is just functional states, which denies the datum and can't explain why the illusion is so persistent. The TA wants students to engage deeply, not just repeat standard arguments.

  The user's explicit needs are clear: an essay question, a model answer, and a marking scheme. But deeper, they probably want students to move beyond surface-level critiques. The TA mentioned their friend's argument was "sharper" than typical eliminativism claims, so they likely want to highlight this specific dilemma's strength. Also, the model answer should show where reasoning might be contested, indicating they want students to recognize both sides critically.

  For the essay question: It needs to be concise for a 50-minute exam. Must reference the dilemma directly. Avoid jargon—use "seemings" instead of terms like "qualia." Make sure it's unanswerable with memorized slogans. The question should force analysis of both horns.

  Model answer: Around 650 words. Needs to address both horns fairly. First, explain why the first horn is problematic (self-undermining). Then, the second horn (denying the datum). Argue for a middle path where seemings are non-phenomenal but still explain the illusion's persistence. Include the closing paragraph on what would make the dilemma fatal or defuse it. Mention potential weaknesses, like if non-phenomenal seemings can truly capture the introspective experience.

  Marking scheme: Five points, 4 marks each. Key points: explaining the dilemma, first horn problem, second horn problem, illusionist response, assessment of that response. Common mistakes: oversimplifying either horn, not engaging with why the illusion is persistent, missing the meta-problem link.

  Potential pitfalls: Students might conflate illusionism with eliminativism. The model answer should clarify that illusionism accepts the existence of the illusion but not phenomenal properties. Also, ensuring the response to the second horn adequately addresses the inescapability of the illusion—using predictive processing or cognitive architecture as examples.

  Closing paragraph considerations: The dilemma is fatal if non-phenomenal seemings can't explain the compelling nature of introspection. Defused if cognitive mechanisms (like predictive processing) can account for it without invoking phenomenality. Highlight that this is where the debate hinges.

  Need to keep terminology accessible. Avoid names like Dennett or Frankish unless necessary—stick to concepts. For example, use "introspective reports" instead of "heterophenomenology."

  Overall, structure the question to push students into the dilemma's nuances, ensuring the model answer demonstrates deep engagement and the marking scheme rewards critical analysis over rote learning.
answer: |-
  ## Essay Question (20 marks, 50 minutes)
  **Critically evaluate illusionism about phenomenal consciousness in light of the following dilemma:**
  1.  If illusionism claims introspection *seems* to present us with phenomenal properties, then this seeming must itself be a phenomenal state, undermining the claim that phenomenal properties are illusory.
  2.  If illusionism claims the seeming is merely a disposition to judge or a functional state, then it denies the very introspective datum (the compelling *seeming*) it set out to explain, and fails to account for why this "illusion" is so powerful and resistant to correction.
  Does this dilemma fatally undermine illusionism? Develop your answer by addressing both horns of the dilemma and assessing the strongest possible illusionist response.

  ---

  ## Model Answer (Approx. 650 words)

  Illusionism claims our sense of possessing phenomenal consciousness – the raw, intrinsic, qualitative "feel" of experiences (like the redness of red or the painfulness of pain) – is a pervasive cognitive illusion. There is no such thing as phenomenal properties; there are only complex neurocognitive processes. The presented dilemma challenges illusionism at its core, questioning whether it can even coherently describe the illusion it posits without self-destructing or abandoning its explanatory task.

  The first horn argues that acknowledging the *seeming* presence of phenomenal properties via introspection commits the illusionist to the existence of a phenomenal state – the seeming itself. If introspection genuinely *seems* to reveal qualia, then this introspective seeming must possess its own phenomenal character. But illusionism denies the existence of all phenomenal character. Therefore, by describing the illusion as a seeming *of* phenomenality, illusionism implicitly affirms the very thing it seeks to eliminate, rendering it self-refuting. This horn forces the illusionist to clarify the ontological status of the introspective report. Simply calling it an "illusion" isn't enough; they must explain *what it is* without invoking phenomenality.

  The second horn presents an equally serious challenge. If the illusionist avoids the first horn by claiming the "seeming" is *not* phenomenal but merely a functional state (e.g., a disposition to make certain reports, engage in specific behaviors, or form certain beliefs based on internal processing), then they appear to have changed the subject. The core datum illusionism promised to explain is the *first-person, introspective impression* that there *is* something it is like for us, an impression that feels immediate, private, and non-functional. If the illusionist redefines "seeming" as a purely functional disposition, they are denying the existence of this introspective datum rather than explaining it. Furthermore, this move leaves illusionism without resources to explain *why* this functional disposition gives rise to such a powerful, inescapable, and cognitively opaque conviction of inner phenomenality that persists even after accepting illusionist arguments. Why does the disposition *feel* like a revelation of intrinsic qualities? The second horn accuses illusionism of explaining away the phenomenon (the seeming) instead of explaining it, and failing to account for its unique psychological force.

  The strongest illusionist response involves navigating a path *between* the horns by offering a rich, non-phenomenal account of the "seeming." They accept the second horn's premise that the seeming is constituted by non-phenomenal functional/cognitive states but deny they are thereby abandoning the datum. Instead, they argue that *what it is like* to have the illusion *just is* the complex operation of these cognitive mechanisms – mechanisms that systematically misrepresent their own nature. Crucially, they explain the power and inescapability of the illusion by appealing to deep features of our cognitive architecture, particularly predictive processing models. On this view, the brain is constantly generating models of the world, *including itself*. The model of our own sensory and cognitive states is inherently "thick" – it represents these states as having intrinsic, qualitative properties because that is the most efficient way (given evolutionary constraints) for the system to track and manage its complex internal dynamics for the purposes of action and prediction. This model is "transparent" – we look *through* it to the world (and ourselves), not *at* it as a model. This transparency and the model's deep embedding in our core cognitive functions make the illusion incredibly robust and resistant to intellectual correction.

  **Can this response defuse the dilemma?** The verdict hinges on whether this non-phenomenal account of "seeming" genuinely captures the *what-it's-likeness* of the introspective datum *as we experience it*. If the illusionist can successfully argue that the predictive mechanisms *constitute* the feeling of seeming without residue, then the dilemma is defused: the seeming is explained non-phenomenally, and its power is accounted for by the architecture. However, if the opponent insists that the *experiential immediacy* and *intrinsic quality* captured in introspection *cannot* be reduced to any functional/cognitive description, no matter how complex or involving misrepresentation (i.e., if they hold that there is an unbridgeable explanatory gap), then the dilemma remains fatal. The illusionist's account will always seem to leave out the very essence of the seeming it tries to explain, falling back onto the second horn. The most contested point in the model answer is likely the claim that predictive processing mechanisms *fully constitute* the subjective sense of phenomenality without any phenomenal residue. Critics will argue this simply ignores the hard problem, while illusionists see it as dissolving it. The success of illusionism ultimately depends on the plausibility of this constitutive claim.

  ---

  ## Marking Scheme (5 points x 4 marks = 20 marks)

  1.  **Accurate Exposition of the Dilemma's Two Horns:**
      *   *Must-hit:* Clearly and correctly states the two options: (1) Seeming = phenomenal state (self-undermining), (2) Seeming = functional state (denies datum, fails to explain power/resistance).
      *   *Common Mistake:* Conflating the horns, misrepresenting one horn (e.g., saying horn 2 denies *all* consciousness), or failing to articulate the specific problems each horn poses to illusionism (self-refutation vs. explanatory failure).

  2.  **Critical Analysis of the First Horn:**
      *   *Must-hit:* Explains why the first horn is a problem for illusionism (acknowledging a phenomenal seeming contradicts the denial of phenomenality) and considers the illusionist's need to define the seeming non-phenomenally.
      *   *Common Mistake:* Simply agreeing the horn is fatal without analysis, or dismissing it too easily without acknowledging the conceptual pressure it applies to the illusionist's description of the illusion.

  3.  **Critical Analysis of the Second Horn:**
      *   *Must-hit:* Explains the dual problem of the second horn: the accusation that illusionism denies the introspective datum (the compelling seeming *as experienced*) rather than explaining it, and its failure to account for the illusion's unique psychological power and resistance.
      *   *Common Mistake:* Focusing only on the "denial of datum" OR the "explanatory failure" but not both, or failing to articulate *why* the functional re-description might be seen as changing the subject/denying the datum.

  4.  **Evaluation of Strongest Illusionist Response:**
      *   *Must-hit:* Presents and engages with the core illusionist strategy: accepting the seeming is functional/cognitive (avoiding horn 1) but arguing this *constitutes* the datum (avoiding horn 2), explaining power/resistance via cognitive architecture (e.g., predictive processing, model transparency, misrepresentation).
      *   *Common Mistake:* Attributing a weak or straw-man response to illusionism, failing to mention the constitutive claim or mechanisms for power/resistance, or not linking the response explicitly to navigating the dilemma.

  5.  **Assessment of Dilemma's Force & Key Contested Point:**
      *   *Must-hit:* Clearly identifies the verdict hinges on whether the non-phenomenal account *succeeds in capturing the experiential character* of the seeming. States that failure means the dilemma is fatal (horn 2 holds), while success defuses it. Explicitly flags the contested nature of the constitutive claim (mechanisms = seeming) as the likely point of failure/contestation.
      *   *Common Mistake:* Giving a vague or indecisive verdict, failing to identify the constitutive claim as the critical point, or neglecting to mention the role of the explanatory gap/intuition in sustaining the opponent's challenge.
