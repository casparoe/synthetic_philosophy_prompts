prompt: |-
  So me and my partner just took over her dads tiny farm in Ohio, six outdoor trout raceways and four indoor shrimp tanks, and I somehow got voluntold to be the welfare guy even though my background is auto repair not fish.

  I need something I can actually run every morning before feeding, like a decision procedure or checklist that turns all that fish and shrimp sentience and welfare stuff into steps a non-expert can follow. It should tell me what to check in what order, what counts as good enough to move on, when to stop with a straight no this is not okay, and when to kick it up to the vet or to us as owners becuase its really a values call not a facts call.

  Some constraints: I have like 15-20 minutes per raceway or tank max, mornings are chaos, my crew is me plus two part timers with zero biology training, our vet only comes once a month to sign off unless theres an emergency, and the stakes are dead or stressed animals plus losing money if we get it wrong.

  Can you build that for trout and for whiteleg shrimp seperately where they differ, keep what actually matters for welfare but drop the super technical stuff we cant measure, and be honest about where the checklist will misfire or need human judgment.

  Then run it on three real calls I am facing right now:

  1. crowding trout tight in a grading net for 5-6 hours becuase we are short staffed, they go off feed for a day after but it saves us hiring extra help
  2. our electric stunner broke and the replacement is 3 weeks out, so going back to ice slurry for harvest in the meantime
  3. keeping berried shrimp females in bare bright tanks with lights on 24/7 to push more larvae, we get more babies but the females lose antennae and die younger

  Include at least one where the procedure tells me something I am not gonna like, like I have to spend money or stop doing the easy thing, and end with what the procedure cannot do no matter how good it is.
reasoning: |-
  Okay, the user has taken over a small aquaculture farm in Ohio with trout raceways and indoor shrimp tanks. They need a practical welfare checklist for daily use, given their background in auto repair and limited time. The request is to create separate procedures for trout and shrimp that are non-technical, time-efficient, and clear on when to escalate issues. 

  First, I need to understand the core constraints: 15-20 minutes per unit, untrained staff, monthly vet visits, and financial pressures. The user emphasized avoiding jargon and focusing on actionable steps. They also want honesty about limitations and misfires. 

  For the trout checklist, the key welfare indicators would be oxygen levels (critical), visible stress signs, water clarity, and physical injuries. For shrimp, it's similar but adds monitoring of antenna damage and broodstock condition since they mentioned issues with berried females. Each checklist needs clear pass/fail criteria and escalation paths. 

  The three real scenarios they presented are ethical dilemmas disguised as operational choices. The crowding during grading clearly violates stocking density limits - the procedure must flag this as unacceptable. The ice slurry versus electric stunning is trickier; while ice slurry isn't ideal, it's temporarily acceptable if done correctly to avoid prolonged suffering. The 24/7 lighting for shrimp broodstock is a hard "no" - the checklist should catch the antenna damage and mortality as systemic welfare failures. 

  I should structure each checklist with a rapid flow: start with life-or-death parameters (like oxygen), then visible animal indicators, then environmental factors. The "judgment calls" section is crucial - it validates their role as owners when values-based decisions arise, like whether to invest in backup equipment. 

  For the scenarios, I'll deliberately make one outcome uncomfortable (rejecting the broodstock lighting practice) to show the procedure works even when inconvenient. Ending with limitations keeps it honest - no checklist can replace experienced observation or predict novel diseases. 

  The tone needs to be supportive but firm. They're trying to do right by the animals despite inexperience, so the procedures must empower them to push back against harmful shortcuts ("voluntold" suggests internal conflict about welfare compromises). Highlighting that some fixes save money long-term (like proper stunning reducing harvest losses) might make tough calls palatable.
answer: |-
  Here's a no-nonsense welfare checklist designed for speed and practicality, built for your constraints. **Core Principle: If it stresses them out or kills them faster, it's costing you money.**

  **Trout Raceway Morning Welfare Scan (15-20 min max per raceway)**
  **Goal:** Catch life-or-death issues fast, spot brewing problems early.
  **Tools:** Dissolved Oxygen (DO) meter, Secchi disk (or clear tube), net, bucket, flashlight, notebook.
  **Order:** Do this sequence FAST. Stop immediately if you hit a RED.

  1.  **OXYGEN (DO):** *Check IMMEDIATELY on arrival.*
      *   **Action:** Stick DO probe in flowing water (not stagnant corner). Read.
      *   **GREEN (GO):** >6 mg/L. Move on.
      *   **YELLOW (WARNING):** 5-6 mg/L. **Action:** Increase aeration NOW. Re-check in 15 min. Note it. *Cause? Clogged inlet? Pump issue?*
      *   **RED (STOP/EMERGENCY):** <5 mg/L. **Action:** MAXIMIZE AERATION IMMEDIATELY (all aerators on, open flow valves). **Call Partner & Vet NOW.** Do NOT feed. Prioritize fixing this above *everything* else.
  2.  **DEAD FISH COUNT:**
      *   **Action:** Quickly count dead fish visible on bottom/sides. Scoop out with net.
      *   **GREEN (GO):** <5 dead (adjust for raceway size, e.g., 0-1 dead per 100 fish is ideal, <0.5% is good target). Note number.
      *   **YELLOW (WARNING):** 5-10 dead, OR sudden increase from yesterday. **Action:** Note exact count & location. Check Water Clarity & Behavior EXTRA carefully. Be ready to call Vet if other issues.
      *   **RED (STOP/EMERGENCY):** >10 dead OR lots of fish gasping at surface/gulping. **Action:** STOP. Check DO again! **Call Partner & Vet IMMEDIATELY.** Do NOT feed.
  3.  **WATER CLARITY:**
      *   **Action:** Use Secchi disk (or clear tube filled with water) - how deep can you see it clearly? Or just look - is it murky?
      *   **GREEN (GO):** Can see bottom clearly (>24 inches visibility). Water looks clean.
      *   **YELLOW (WARNING):** Slightly murky (12-24 inches visibility). **Action:** Note it. Check inflow/outflow for blockages. Check feeding amount yesterday. Prep for extra cleaning.
      *   **RED (STOP):** Very murky (<12 inches visibility) OR thick foam/scum. **Action:** STOP normal routine. Increase water exchange IMMEDIATELY. Check filters/settling. Reduce feeding today. ESCALATE to Partner/Owner - may need major cleaning/flow adjustment.
  4.  **FISH BEHAVIOR:**
      *   **Action:** Stand still for 60 seconds. Watch the school. Scoop a *single* fish gently into bucket with water for quick look.
          *   *School:* Swimming normally? Evenly distributed? Not huddled or frantic?
          *   *Single Fish:* Gills moving steadily? Eyes clear? Fins erect? No red sores, fungus, or major injuries? Slime coat smooth (not peeling)? Release gently.
      *   **GREEN (GO):** School active, feeding response if you tap side (don't actually feed yet!). Single fish looks clean, fins good, gills steady.
      *   **YELLOW (WARNING):** Some fish lethargic, huddled near inflow, OR minor fin nips/slight redness. Single fish slightly ragged fins or minor scrape. **Action:** Note specifics. Reduce feeding slightly today. Monitor closely tomorrow. Check for parasites? (Flashing?).
      *   **RED (STOP):** Many fish gasping at surface, flashing (rubbing), clamped fins, visible sores/fungus, OR single fish has major injuries/rotten fins/bulging eyes. **Action:** STOP. Isolate issue if possible. **Call Vet TODAY.** Do NOT move fish unless absolutely necessary. Prepare for treatment. Review last 48 hours for cause.

  **Whiteleg Shrimp Tank Morning Welfare Scan (15-20 min max per tank)**
  **Goal:** Spot dead/dying shrimp, check water basics, spot stress signs.
  **Tools:** DO meter, Ammonia test kit (simple dip strips OK), salinity refractometer, net, flashlight, notebook.
  **Order:** Fast sequence. Stop on RED.

  1.  **OXYGEN (DO):** *Check IMMEDIATELY.*
      *   **Action:** Probe in water away from aerators.
      *   **GREEN (GO):** >5 mg/L (shrimp tolerate lower than trout). Move on.
      *   **YELLOW (WARNING):** 4-5 mg/L. **Action:** Increase aeration NOW. Re-check in 15 min. Note it.
      *   **RED (STOP/EMERGENCY):** <4 mg/L. **Action:** MAX AERATION NOW! **Call Partner & Vet NOW.** Do NOT feed.
  2.  **DEAD SHRIMP COUNT:**
      *   **Action:** Scan bottom, sides, surface. Count dead/obviously dying (white, pink, motionless). Scoop out.
      *   **GREEN (GO):** <5 dead (adjust for tank size/bio-load, <0.5% is good). Note number.
      *   **YELLOW (WARNING):** 5-15 dead OR sudden increase. **Action:** Note count. Check Water Quality & Behavior EXTRA carefully. Prep for water change.
      *   **RED (STOP/EMERGENCY):** >15 dead OR many lethargic on bottom. **Action:** STOP. Check DO again! **Call Partner & Vet IMMEDIATELY.** Do NOT feed. Prepare for emergency water change.
  3.  **AMMONIA & SALINITY:**
      *   **Action:** Dip test strip for Ammonia. Check salinity with refractometer.
      *   **GREEN (GO):** Ammonia <0.5 ppm. Salinity within target range (e.g., 15-25 ppt, know YOUR target). Move on.
      *   **YELLOW (WARNING):** Ammonia 0.5-1.0 ppm OR salinity slightly off target (e.g., +/- 2 ppt). **Action:** Note values. Increase water exchange today. Check filters/feeds. Adjust salinity slowly if needed.
      *   **RED (STOP):** Ammonia >1.0 ppm OR salinity way off target (> +/- 5 ppt). **Action:** STOP. Initiate significant water change IMMEDIATELY (25-50%). Identify source (dead shrimp? overfeeding? salinity mix error?). ESCALATE to Partner/Owner.
  4.  **SHRIMP BEHAVIOR & APPEARANCE:**
      *   **Action:** Observe for 60 seconds. Look for molts (good sign). Use flashlight to spot issues on bottom/shaded areas. Try to see antennae and rostrum (nose spike).
      *   **GREEN (GO):** Most shrimp active, swimming/feeding normally. Antennae long & intact. Shells look clean, no black spots. Healthy molts present.
      *   **YELLOW (WARNING):** Some lethargy, reduced feeding response. A few (<5%) with shortened/broken antennae or minor shell discoloration (not black). **Action:** Note observations. Check lights (too bright?), hiding places adequate? Reduce stress.
      *   **RED (STOP):** Many shrimp lethargic, swimming erratically, OR high % (>10%) with broken/missing antennae, eroded rostrum, OR visible black splotches (shell disease). **Action:** STOP. **Call Vet TODAY.** Assess environment (lights, substrate, crowding?). Prepare for possible treatment. Review management practices.

  **Key Escalation Rules (Both Species):**
  *   **VET NOW (Emergency):** Any RED on Oxygen or Mass Mortality (Dead Count RED). Suspected contagious disease (sores, fungus, shell disease). Major environmental failure (severe ammonia, salinity crash).
  *   **OWNER/VET DISCUSSION (Urgent Judgment Call):** Persistent YELLOWs across multiple days despite fixes. Questionable practices impacting welfare long-term (like your scenarios). Equipment failure impacting welfare. Need for major investment/cost.
  *   **OWNER CALL (Values Judgment):** Trade-offs between welfare and cost/staffing. Implementing new procedures with welfare impact. Defining acceptable limits for "minor" issues.

  ---

  **Running Your Real Calls Through the Procedure:**

  1.  **Crowding Trout in Grading Net for 5-6 Hours:**
      *   **DO:** Risk of localized depletion in the net, especially if flow is restricted. Likely dips into YELLOW or even RED zone during crowding. **CHECK FAILS (RED - Emergency)** if DO drops. Requires constant monitoring/correction *in the net*, which isn't happening.
      *   **Behavior:** Post-crowding, "off feed for a day" = classic stress response (RED Flag on Behavior scan the next morning - lethargy, no feeding response). Physical damage (scale loss, fin damage) highly likely during netting/crowding (RED Flag on Single Fish check - injuries).
      *   **Verdict:** **Procedure says NO.** This is a clear welfare fail causing measurable stress and likely physical harm. The "saved labor" cost is offset by lost growth, increased disease susceptibility (stress weakens immune system), and potential mortality. **Procedure forces you to find another solution:** Hire temp help, grade smaller batches faster, invest in a better grader, or accept slower grading over more days.

  2.  **Electric Stunner Broken, Using Ice Slurry:**
      *   **Assumption:** Ice slurry is done correctly - shrimp/trout are rapidly chilled to unconsciousness (<60 seconds for shrimp, <2-3 mins for trout) *before* death, slurry is well-mixed, not just ice cubes.
      *   **Welfare Check:** Not a *morning* routine issue, but the procedure highlights the importance of humane harvest.
      *   **Procedure Insight:** The procedure flags stress/injury *before* harvest. If pre-harvest handling is rough (causing YELLOW/RED on Behavior/Injuries before stunning), ice slurry on already stressed animals is worse.
      *   **Verdict:** **Procedure YELLOW WARNING - Needs Careful Execution & Monitoring.** It's not ideal (electric is usually faster/better), but ice slurry *can* be humane *if done perfectly*. The procedure forces you to: 1) Train crew EXTRA carefully on correct slurry method (critical time to unconsciousness), 2) Minimize pre-stun handling stress (keep calm, avoid air exposure), 3) Monitor closely for signs animals aren't stunned fast enough (movement > target time - RED FLAG, stop process). **Kick to Owners:** Confirm this temporary method is acceptable *only* if done correctly. Budget for a backup stunner or faster repair next time.

  3.  **Berried Shrimp in Bare Bright Tanks 24/7 Lights:**
      *   **Behavior & Appearance:** "Females lose antennae and die younger" = **RED FLAG (STOP)** on Shrimp Behavior/Appearance scan. Broken antennae indicate severe stress/aggression from the unnatural environment and constant light. Increased mortality is the ultimate welfare failure.
      *   **Water Quality:** Bare tanks likely have poorer biofiltration, increasing risk of Ammonia/Nitrite spikes (potential YELLOW/RED).
      *   **Verdict:** **Procedure says ABSOLUTELY NO.** This is sacrificing individual adult welfare (pain, stress, premature death) for higher larvae production. It's unsustainable and inhumane. **Procedure forces you to change:** Implement a dark period (8-12 hours), add substrate/hiding places (PVC pipes, tiles), closely monitor antenna damage/mortality. Accept *slightly* lower larvae production for sustainable, healthier broodstock. **This is the "spend money/stop easy thing" answer.** You need better broodstock tanks.

  ---

  **What the Procedure CANNOT Do (No Matter How Good):**

  1.  **Predict the Future:** It won't catch a disease *before* symptoms show, or predict equipment failure *before* it happens. It catches problems *as they become visible*.
  2.  **Diagnose Complex Diseases:** It flags "sick" (RED Behavior/Appearance), but the Vet must diagnose *what* and *how* to treat.
  3.  **Replace Experience & Nuance:** It won't tell you *why* DO is dipping slightly (YELLOW) - is it weather, bio-load, or a failing aerator? It flags the symptom, you diagnose the cause. It won't perfectly calibrate "minor" fin nip vs. "major" injury – it gives ranges, you use judgment.
  4.  **Handle Truly Novel Situations:** If something completely unexpected happens (chemical spill, freak weather), the checklist provides a *framework* (check O2, check dead, check behavior) but can't script the response.
  5.  **Force You to Care:** If you ignore YELLOWs or rationalize away REDs, the checklist is useless. Its power comes from consistent, honest use.

  **Final Tip:** Laminate these checklists. Have your crew run through them WITH you for a week until it's habit. Initial every scan. This isn't bureaucracy, it's your early warning system against dead fish, lost money, and sleepless nights. Good luck!
