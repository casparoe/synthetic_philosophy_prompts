  I've been locked in a long, increasingly exasperating argument with a friend about the sorites paradox, and I think the whole thing hinges on a distinction neither of us has actually pinned down, so I'd like your help laying it out carefully. We were going around in circles over whether the "tolerance" premise of the paradox is best stated as a one‑way conditional ("if a pile of *n* grains is not a heap, then a pile of *n*+1 grains is not a heap") or as a biconditional (the "if and only if" version). I keep insisting that the biconditional is the premise that's really doing the paradoxical work, because it's what lets the argument run in both directions — from "one grain is not a heap" all the way up to "a million grains is not a heap," and symmetrically from "a million grains is a heap" back down to "one grain is a heap" — whereas the bare conditional only generates the paradox in one direction. My friend counters that the biconditional is just two conditionals bundled together, that it's no more mysterious than either half, and that any solution that can defuse one conditional can defuse the biconditional for free.

  Could you explain, in a way that settles this for me, exactly what the biconditional adds over the conditional, why the two‑directional (or "revenge‑type") version of the puzzle is genuinely harder than the one‑directional version, and how the leading candidate solutions — epistemicism, supervaluationism, fuzzy/many‑valued logics, and paraconsistent approaches — differ in precisely how they treat the tolerance biconditional rather than just the tolerance conditional? In particular, I want to understand the pressure point for the epistemicist: if there is a sharp but unknowable cutoff, then there is some adjacent pair of cases across which the predicate flips its truth value, and I want to see clearly whether the epistemicist is forced to reject the biconditional, the conditional, both, or something subtler (such as a weakened or non‑classical connective), and what the cost of each move is. And please be precise about the logical form at each step — I don't mind notation — because I suspect our whole disagreement is really just us silently assuming different logical systems.
