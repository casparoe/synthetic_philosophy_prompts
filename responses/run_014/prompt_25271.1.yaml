prompt: |-
  ok so i'm trying to get clear on what a theory of higher-order evidence actually has to do before i read another paper that just picks a side on the disagreement debate. i want the desiderata: the cases it has to handle, the distinctions it can't collapse, the puzzles it has to dissolve, and the results from other parts of epistemology it has to be consistent with. for each one, say what the motivating case or consideration is, and tell me whether it's something everyone in the debate accepts or whether it's a requirement that only one camp insists on (and which camp, and why the other side thinks it's not a genuine constraint).

  then, crucially: are there any pairs or subsets of these desiderata that can't all be satisfied at once? i keep hearing people say things like "if you accept that higher-order evidence can require you to set aside first-order evidence, you get a regress" or "the enkratic principle plus peer disagreement forces conciliationism" — i want to know which of these tradeoffs are real and which are overblown.

  if you can, flag which single requirement does the most work in narrowing down the options — the one where, once you commit, a lot of the rest of the theory falls into place (or becomes impossible).

  and please, separate what's actually settled among people working on this from what's still genuinely contested. i can't tell from the outside whether the enkratic requirement is something everyone grants and the fight is about what follows from it, or whether rejecting it is a live option that serious people take seriously. also if there's a camp that thinks the whole framing is confused and the distinction between first-order and higher-order evidence doesn't cut at the joints, i want to know that too — and whether that camp's objection is itself a desideratum the theory has to answer.
