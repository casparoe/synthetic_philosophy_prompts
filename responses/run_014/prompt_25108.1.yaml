answer: |-
  This is a razor-sharp reconstruction, and your anxiety is completely justified. You've hit on the "companions in guilt" objection – arguably the most powerful critique of evolutionary debunking arguments (EDAs). The speaker *should* have anticipated this, so let's dissect the escape routes (and their costs). **The core problem is premise (2). It's too broad and leads to global skepticism.** Here's how defenders typically try to save the EDA for morality without sinking everything:

  ### The Main Move: Distinguishing Reliability (Not Just Origin)
  The most common and promising defense is to argue that while *all* our cognitive faculties have evolutionary origins, **the *reliability* (truth-tracking ability) of those faculties *with respect to specific domains* is what matters.** The key question isn't "Why did this faculty evolve?" but rather **"Is there a plausible connection between the *success* of the faculty (in terms of survival/reproduction) and its *truth-tracking* in this specific domain?"**

  1.  **Perception:** Here, the link is incredibly strong.
      *   **How Reliability Emerges:** For an organism to navigate the world effectively (find food, avoid predators, manipulate objects), its perceptual systems *must* generate representations that are systematically correlated with stable features of the external environment relevant to survival. Misrepresenting the location of a predator or the solidity of a branch is catastrophically maladaptive.
      *   **Evolutionary "Goal" vs. Truth:** Evolution didn't "aim" for truth, but it *inevitably selected for* perceptual systems whose outputs were *reliable indicators* of fitness-relevant aspects of reality. Success *required* a significant degree of veridicality about the macro-physical world.
      *   **Fix:** Premise (2) is modified: A belief is unjustified *if produced by a process that is systematically unreliable in tracking truths within the relevant domain, AND where the evolutionary pressures shaping that process provided no selective advantage for truth-tracking in that domain.* Perception passes the reliability test for macro-physical objects.

  2.  **Logic & Basic Math:** The link is also strong, though perhaps slightly less direct than perception.
      *   **How Reliability Emerges:** The core of logical reasoning (e.g., modus ponens, non-contradiction) and basic numerosity/quantification are essential tools for effective planning, prediction, social exchange ("If I give you two berries, you give me that tool"), tracking resources/predators, and causal inference. An organism whose basic inferences led it to constantly believe contradictions or utterly fail to track quantities (e.g., unable to distinguish one predator from three) would be at a severe disadvantage.
      *   **Evolutionary "Goal" vs. Truth:** While evolution didn't select for proving Fermat's Last Theorem, it *did* select for cognitive mechanisms capable of handling basic logical relationships and approximate quantities *reliably enough* for survival needs. Success *required* inferential mechanisms that generally got the world right at the level of practical engagement. The core principles work because they reflect fundamental, abstract relations that constrain any coherent interaction with reality.
      *   **Fix:** Logic and basic math pass the reliability test for their core principles within the domain of practical reasoning about the world. Their later extension to abstract realms leverages this reliable core.

  3.  **Morality: The Alleged Disanalogy (The Debunker's Hope)**
      *   **How Reliability *Might* Be Missing:** The debunker argues that for moral beliefs, the connection between adaptive success and tracking *mind-independent moral truths* is broken or absent.
          *   **Behavior is Key:** Evolution only cares about *behavior* that promotes cooperation, reduces conflict, boosts status, etc., within a specific social context. A "moral intuition" that reliably produced *fitness-enhancing behavior* would be selected for, **regardless of whether the *content* of the belief corresponded to some objective moral fact.** Different, contradictory moral frameworks (e.g., favoring kin exclusively vs. universal altruism) could be equally adaptive in different environments.
          *   **Social Coordination vs. Truth:** Moral intuitions might function primarily as *social coordination tools* or internalized social norms, not as perceptions of objective properties. Their "success" is measured in group cohesion and reduced punishment, not in accurately depicting a moral reality "out there." Evolution could easily have favored useful fictions ("We *must* share meat fairly" promotes group stability, even if "fairness" isn't a cosmic property).
          *   **No Necessary Truth Link:** There's no reason to think the intuitions selected (e.g., "Care for kin," "Reciprocate," "Defer to authority") track some independent moral landscape any more than the frog's "edible moving dot" representation tracks the true, complex nature of a fly. The adaptive pressures shaped the *response*, not its truth-aptness regarding objective morality.
      *   **The Claim:** Therefore, while perceptual and logical beliefs are produced by processes where adaptive success *required* a significant degree of reliability in tracking relevant features of objective reality, moral beliefs are produced by a process where adaptive success depended *only* on producing socially useful behaviors/attitudes, with no necessary connection to objective moral truth. Morality fails the reliability test for objective truth-tracking.

  ### What Does This Cost? (The Price of Saving Morality-Only Debunking)

  1.  **Rejecting Premise (2) as Stated:** You *must* modify or reject the broad version of premise (2). You need a more nuanced criterion for justification that incorporates the *reliability* of the cognitive process *in the relevant domain*, grounded in the link between evolutionary success and truth-tracking *for that type of belief*. This is philosophically complex.
  2.  **Burden of Proof Shifts:** The debunker now bears the burden of *showing* the disanalogy holds for morality. They must argue convincingly that there *is no plausible evolutionary link* between the adaptive success of moral intuitions and their tracking objective moral facts. Critics will argue that reliable cooperation *does* require tracking real features of agency, well-being, and social dynamics that *could* ground objective morality.
  3.  **"Just So" Story Risk:** Both sides risk trading speculative evolutionary psychology stories ("Here's why reliability *was/wasn't* selected for"). Firm empirical evidence for the precise evolutionary function and cognitive mechanisms behind moral intuitions is still developing.
  4.  **Scope of Debunking:** Even if successful, this argument likely only debunks *core, evolutionarily ancient moral intuitions* (like kin preference, reciprocity, purity). It may not touch more abstract, reasoned moral beliefs developed later. Conversely, it might expose *some* perceptual/logical beliefs (e.g., certain optical illusions, probabilistic fallacies) as unreliable byproducts of otherwise reliable systems.
  5.  **Dependence on Moral Realism's Vulnerability:** This defense only works *if* moral realism is the kind of view that *could* be undermined by a lack of evolutionary truth-tracking. Non-realist views (expressivism, constructivism) might be immune or interpret the evolutionary story differently. The debunker usually assumes realism as the target.

  ### Alternative Escape Routes (Less Promising)

  *   **Biting the Bullet on Global Skepticism:** Few take this seriously. It's philosophically suicidal and pragmatically impossible. The speaker certainly wasn't advocating this.
  *   **Distinguishing Domains by Evolutionary Directness:** Argue perception/logic are "closer" to survival needs than morality. This seems arbitrary and ignores the deep social nature of human evolution. Cooperation *was* survival.
  *   **Appealing to Coherentism/Reflective Equilibrium:** Justification comes from the overall coherence of the belief system, including science, not just origins. This partially sidesteps EDAs but leaves them with significant force against foundational moral intuitions. It also doesn't directly solve the "why trust *any* starting point?" worry raised by evolution.

  ### Conclusion & What You're Paying

  1.  **You Must Reject Premise (2) as Stated:** The broad version leads to absurdity. The cost is accepting a more complex theory of justification that incorporates process reliability and domain-specific evolutionary links between success and truth-tracking.
  2.  **The Fix is Nuanced Reliability:** The most plausible way to save the moral EDA without sinking everything is to argue that while evolution shaped all cognition, it forged a **reliable truth-tracking link for perception/logic** (because success *required* it for interacting with the physical/social world), but **failed to forge such a link for objective moral truth** (because success only required socially useful behaviors, achievable with potentially false beliefs).
  3.  **The Cost is Argumentative Burden & Speculation:** You buy into a complex epistemological framework and place a heavy burden on the debunker to demonstrate the lack of a truth-tracking link specifically for morality. The debate becomes heavily reliant on interpretations of evolutionary psychology and the nature of moral facts.
  4.  **Does it Leave the Argument with Teeth? Yes, but...** It leaves the moral EDA as a powerful *challenge* to moral realism. The realist must now provide a *positive* account of *how* our evolved moral intuitions *could* reliably track objective moral facts, given the debunker's story about the pressures shaping them. It shifts the dialectic but doesn't deliver a knockout blow. The argument retains significant skeptical weight against a naive reliance on moral intuitions as direct evidence for realism.

  **Your instinct is correct:** The unmodified argument *is* too strong. Saving it requires surgical precision on the justification criterion, focusing on the domain-specific *reliability* forged (or not forged) by evolution. Whether the disanalogy for morality ultimately holds is the billion-dollar question at the heart of this debate. Your flight realization captured the central tension brilliantly.
