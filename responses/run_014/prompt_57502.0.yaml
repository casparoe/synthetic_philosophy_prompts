answer: |-
  Here’s the spec for a defensible karma theory as a genuine account of moral desert, structured as requested:

  **Purpose:** To function as a practical ethical framework for praise, blame, and punishment, grounded in desert, not merely as a comforting narrative.

  ---

  ### I. Essential Phenomena to Explain & Cases to Get Right
  1.  **The Innocent Sufferer (Non-negotiable)**
      *   **Case:** A kind child dies slowly of a painful congenital disease.
      *   **Requirement:** The theory *cannot* imply the child *deserves* this suffering due to past actions (blaming the victim). It must distinguish suffering from desert.
  2.  **The Unpunished Wicked Prosperous (Non-negotiable)**
      *   **Case:** Gyges - commits atrocities in secret, lives luxuriously, dies peacefully, unrepentant and unexposed.
      *   **Requirement:** The theory must explain how ultimate justice/desert is served *despite* apparent worldly success/impunity. It cannot collapse "gets away with it" and "justice is done."
  3.  **Moral Luck & Proportionality (Non-negotiable)**
      *   **Case:** Two people harbor identical malicious intent. One accidentally gets a chance to act, causing great harm; the other never gets the chance. Identical negligent act by two drivers: one kills a child, the other hits an empty car.
      *   **Requirement:** Must account for differential outcomes/responsibility without collapsing intent/action or violating proportionality. Desert must track *more* than just external consequence or raw intent alone.
  4.  **Moral Growth & Regression (Negotiable - Taste of Character Camp)**
      *   **Case:** A reformed criminal lives virtuously for decades; a lifelong "decent" person becomes cruel in old age.
      *   **Requirement:** A *robust* theory should ideally explain desert accrual/loss over time and changing character, not just final state or isolated acts. Not strictly non-negotiable for core desert, but weakens the theory if ignored.
  5.  **The Limits of Self-Knowledge (Non-negotiable)**
      *   **Case:** An agent sincerely believes they act justly but causes severe harm due to deep, unexamined flaws they cannot perceive.
      *   **Requirement:** Must allow that an agent's *actual* desert can diverge from their *perceived* desert. Desert cannot collapse into subjective feeling.

  ### II. Distinctions That Must Be Maintained
  6.  **Suffering vs. Punishment (Non-negotiable)**
      *   **Case:** Natural disasters cause immense suffering to morally random populations.
      *   **Requirement:** Must distinguish inherently bad events (suffering) from the *intentional imposition* of negative consequences *because* of desert (punishment). Not all suffering is punitive desert.
  7.  **Consequence vs. Desert (Non-negotiable)**
      *   **Case:** A good Samaritan is crippled trying to save a child.
      *   **Requirement:** Bad consequences for a good act ≠ desert for punishment. Must distinguish the natural outcome of an act from its moral worthiness of praise/blame.
  8.  **Moral Responsibility vs. Causal Contribution (Non-negotiable)**
      *   **Case:** A minor accomplice in a large crime vs. the mastermind.
      *   **Requirement:** Desert must track degree of *moral* agency (intent, knowledge, choice), not merely causal chain involvement.

  ### III. Constraints That Cannot Be Violated
  9.  **Agent Trackability Constraint (Non-negotiable)**
      *   **Case:** An agent strives to be good, reflecting on known past actions, yet experiences seemingly random, severe misfortune.
      *   **Requirement:** Agents must be able to form a *reasonably accurate* (though not perfect) understanding of their desert status based on *knowable* factors (intentions, conscious choices, known consequences). Desert cannot be utterly inscrutable.
  10. **Temporal Locality Constraint (Negotiable - Taste of Retributive Camp)**
      *   **Case:** Punishment/suffering occurs lifetimes removed from the causative act, with no conscious link.
      *   **Requirement:** A *strong* desert theory requires a meaningful connection between the act and its desert consequences within a timeframe where the agent can potentially learn/atone. Violation weakens the link to *this* agent's desert. (Non-negotiable for some, negotiable for others).
  11. **No Cosmic Injustice Constraint (Non-negotiable)**
      *   **Case:** Cumulative suffering/fortune vastly outweighs any conceivable lifetime of good/evil deeds by the agent.
      *   **Requirement:** The total desert balance assigned to an agent must be *proportionally justifiable* by the moral quality of their *own* actions/character over their existence. Cannot permit gross, unrectified cosmic unfairness.

  ### IV. The Core Tension & The Key Requirement
  *   **The Trilemma:** (a) **Not Blaming the Victim** (Requirement 1), (b) **Explaining Undeserved Suffering/Apparent Injustice** (Requirement 2 & Implicit in 6, 7, 11), and (c) **Agent Trackability** (Requirement 9) are inherently in tension.
      *   (a) Prevents attributing *all* suffering to the sufferer's past misdeeds.
      *   (b) Demands an explanation for *why* suffering lands where it does, especially on the innocent *or* avoided by the wicked.
      *   (c) Requires the agent to connect their actions to their fate based on comprehensible rules.
  *   **The Key Requirement that Knocks Out Theories:** **Not Blaming the Victim (Requirement 1)** is the most devastating. Theories that rigidly attribute *all* suffering to past bad karma (the child's disease) fail this catastrophically. To avoid this, theories must either:
      1.  Introduce non-desert causes for suffering (undermining karma as a *complete* account of fate).
      2.  Severely weaken the link between specific past acts and current suffering (undermining proportionality and trackability).
      3.  Push desert consequences entirely into a future existence (violating Trackability and Temporal Locality).

  ### V. Amnesty & Mechanism
  *   **Amnesty (Forgiveness, Expiation):**
      *   **Problem:** True desert is inherently *backward-looking* and *retributive* (you deserve X *because* you did Y). Forgiveness/expiation is *forward-looking* or *relational* (cleansing the slate, restoring relationship). **A theory incorporating robust amnesty has likely stopped being a *pure* theory of desert and become a hybrid theory incorporating mercy, grace, or rehabilitation.** Pure desert theories struggle with genuine amnesty; consequences *must* be borne.
  *   **Mechanism (Law of Nature vs. Cosmic Bookkeeping):**
      *   **Gyges Test:** A Law-of-Nature view (actions generate impersonal, automatic consequences) *could* allow Gyges to escape *if* his actions somehow generated no negative karmic imprints or were perfectly isolated. Bookkeeping (conscious recording/judgment) *must* catch him eventually. **Bookkeeping better satisfies Requirement 2 (Unpunished Wicked) but risks violating Requirement 9 (Trackability) if the accounting is secret.** Law-of-Nature risks making karma arbitrary or escapable.

  ---

  ### Scorecard: Three Karma Models

  1.  **Hard Cross-Lifetime Retributive:**
      *   **Strengths:** Clear desert link, strong on Gyges & proportionality.
      *   **Weaknesses:** Fails *catastrophically* on Innocent Sufferer & Trackability. No amnesty. Cosmic Injustice risk high.
  2.  **Secularized Character-Formation:**
      *   **Strengths:** Handles Growth/Regression, avoids blaming victim (suffering ≠ punishment), allows trackability via character.
      *   **Weaknesses:** Weak on *desert* for Gyges/past acts; suffering often looks pedagogical, not punitive. Blurs desert/consequence. Amnesty possible but muddies desert basis.
  3.  **Hybrid (e.g., Past Acts Shape Character/Fate):**
      *   **Strengths:** Tries to link past acts to current disposition/circumstances, addresses Innocent Sufferer indirectly (karma shapes fate, not *causes* specific suffering).
      *   **Weaknesses:** High risk of *de facto* blaming victim. Trackability very low. Suffering explanation becomes vague ("fate"). Struggles severely with Gyges and Cosmic Injustice. Amnesty incoherent.
