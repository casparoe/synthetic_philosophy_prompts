prompt: |-
  I am a teaching assistant assigned to lead a fifty-minute section for first-year undergraduates with no prior background in philosophy or behavioral economics. My topic is weakness of will and its relation to hyperbolic discounting. Do not explain the topic to me directly; instead develop a teaching plan for how I should explain it. The plan must specify the order in which the components have to be introduced and why each step depends on the previous ones, identify a single extended case that will carry the whole explanation and state what features that case must have and what complications it must avoid, map the misconceptions students are likely to bring to the session or to form during it and indicate the precise point in the sequence where each should be headed off, propose a check for understanding that would show the central distinction has landed, and state what should be openly left out at this level. To keep the discussion concrete and to avoid a familiar textbook illustration, center the plan on the following invented case: a doctoral student who sincerely judges that completing her dissertation chapter this evening is better on the whole than streaming a series, resolves to work, yet at 9 p.m. watches the series while still endorsing her earlier judgment, and whose pattern of choices over several weeks systematically favors a smaller immediate reward until a larger delayed reward becomes imminent. Please write your response in British English.
reasoning: |-
  Okay, the user is a teaching assistant preparing a fifty-minute session for first-year undergraduates with no background in philosophy or behavioural economics. The topic is weakness of will and hyperbolic discounting. They've provided an invented case about a doctoral student to avoid textbook clichés. 

  Hmm, the challenge here is scaffolding complex concepts for complete beginners while maintaining strict pacing. The doctoral student case is clever—it's relatable but avoids oversimplification. I should note its advantages: temporal immediacy (tonight's decision), repeated pattern (showing it's not a one-off), and endorsement persistence (she still believes work is better). 

  Right, the sequence must build like Lego bricks. Can't mention discounting before establishing what rational time-consistency looks like. The student's pre-class misconception will likely be "weakness = moral failing," so I'll plant the rebuttal early when discussing her sincere judgment. 

  Ah! The critical moment is when they might confuse hyperbolic with exponential discounting. Must preempt that during the graph comparison by emphasising the steep initial drop. The "future Monday" trap is perfect for exposing this—if they think her Monday self would exponentially discount, the prediction fails. 

  For the understanding check... yes, asking them to predict her Wednesday choice based on Monday's resolution tests if they grasp dynamic inconsistency. Must avoid normative language—no "should" statements. 

  *checks clock metaphorically* Fifty minutes is tight. Will explicitly sacrifice commitment mechanisms and neuroscience links. The dissertation case can carry everything if we prune tangential examples. 

  Noticing the user specified British English. Will use "behavioural" and "realise" throughout. Also... no jokes about the student's streaming choice—keep it professional. 

  The trap to avoid: letting them conclude the student is "irrational" full-stop. Need to emphasise this is systematic (hence the weekly pattern) and paradoxically "rational" in the momentary frame. That nuance is vital for behavioural econ. 

  Final thought: The chocolate vs apple analogy in Q&A is risky—might trivialise. Better to stick with variations of the core case if they need clarification.
answer: |-
  Here’s a structured 50-minute teaching plan centred on your doctoral student case, designed for first-year undergraduates with no prior background. The sequence builds incrementally, with each step relying on the previous concepts.  

  **Teaching Plan: Weakness of Will & Hyperbolic Discounting**  
  *Core Case: "Elena" – A doctoral student who resolves to work on her dissertation nightly but streams series instead, despite consistently judging work more important.*  

  **1. Introduce Weakness of Will (Akrasia) (10 mins)**  
     * **Content**: Define weakness of will (acting against one’s better judgement) using Elena’s case:  
       * *9 a.m.*: She sincerely judges completing her chapter > streaming.  
       * *9 p.m.*: She streams, *while still endorsing* her morning judgement.  
     * **Why this first?** Establishes the core puzzle: *How can someone freely choose X while believing Y is better?*  
     * **Misconception to preempt**: "She didn’t *really* believe working was better."  
       * **Preemption**: Stress her *sincere, consistent endorsement* of the judgement. Ask: *"If she secretly preferred streaming, would this be weakness of will?"* (No—it’d be deception/hypocrisy).  

  **2. Reveal the Pattern: Time Inconsistency (10 mins)**  
     * **Content**: Show Elena’s weekly pattern:  
       * *Monday*: Resolves to work all week.  
       * *Tue/Wed*: Chooses streaming when 9 p.m. arrives (smaller immediate reward).  
       * *Sunday*: Works frantically as deadline looms (larger delayed reward becomes imminent).  
     * **Why next?** Moves from a single puzzling act to a *systematic behavioural pattern*.  
     * **Case Requirement**: Must show repeated "small sooner" choices *until* the "larger later" reward is near. Avoid one-off lapses.  
     * **Misconception to preempt**: "She’s just lazy/undisciplined."  
       * **Preemption**: Note her *Sunday productivity*: If laziness, why work then? Highlights the role of *timing*.  

  **3. Contrast Discounting Models (15 mins)**  
     * **Content**:  
       * **Step A**: Explain *discounting* (devaluing future rewards). Use Elena: *"Why is ‘streaming now’ more appealing than ‘better job later’?"*  
       * **Step B**: Introduce **Exponential Discounting** (ED):  
         * *Hypothetical*: If Elena used ED, her resolve *now* (Monday) to work *Sunday* would be strong and stable.  
         * *Reality check*: Her Sunday resolve crumbles by Tuesday. ED fails to predict this.  
       * **Step C**: Introduce **Hyperbolic Discounting** (HD):  
         * Show HD curve: Steep drop for immediate delays, flattening later.  
         * Map to Elena: Streaming *tonight* (immediate) is wildly overvalued vs. distant deadline; but when Sunday looms (imminent), work’s value spikes.  
     * **Why here?** HD explains the *time inconsistency* (Step 2), which itself exemplified *weakness of will* (Step 1).  
     * **Misconception to preempt**: "HD is just ‘impulsivity’."  
       * **Preemption**: Contrast HD with "impulse" (random acts). HD is *predictable*: Elena *always* streams when reward is immediate, works when imminent.  

  **4. Integrate: Weakness of Will as Discounting-Driven (5 mins)**  
     * **Content**: Revisit the 9 p.m. choice:  
       * At 9 a.m., both rewards are delayed (low discounting). She judges work better.  
       * At 9 p.m., streaming is *immediate* (steep discounting). Work’s value plummets *relative to streaming*—hence she "chooses against her judgement."  
     * **Why now?** HD provides the *mechanism* for akrasia. Weakness of will isn’t magic—it’s distorted valuation under time pressure.  
     * **Check for Understanding**:  
       * *Question*: "If Elena resolves on *Monday* to work *next Monday*, but uses HD, will she follow through?"  
       * *Correct Answer*: **No**—next Monday is distant, so its value is discounted steeply when immediate alternatives arise.  
       * *Why it works*: Tests grasp of HD’s dynamic inconsistency vs. ED’s stability.  

  **5. Complications to Avoid in the Case**  
     * **Avoid**: External excuses (e.g., "The Wi-Fi died so she couldn’t work"). Weakness of will must be *free choice*.  
     * **Avoid**: Changing judgements (e.g., "At 9 p.m. she decided streaming *was* better"). The paradox requires *endorsed but overruled* judgement.  
     * **Avoid**: One-off lapses. The *pattern* proves systematic discounting.  

  **6. Openly Omit at This Level**  
     * **Normative debates**: Whether akrasia is "irrational" or a failure of rationality.  
     * **Neuroscience**: Dopamine pathways, dual-process models.  
     * **Commitment strategies**: How Elena *could* pre-commit (e.g., website blockers).  
     * **Alternative theories**: e.g., Aquinas’s account of akrasia.  

  **Session Flow & Timing**  
  - Intro & Weakness of Will (10 mins)  
  - Time Inconsistency Pattern (10 mins)  
  - Discounting Models (15 mins)  
  - Integration & Check (5 mins)  
  - Q&A / Consolidation (10 mins)  

  **Why This Sequence Works**  
  1. **Starts intuitive** (a puzzling action), then reveals a **pattern** (inconsistency).  
  2. **HD explains the pattern**, which **solves the puzzle** of weakness of will.  
  3. The case **carries the whole arc**: Elena’s single evening (akrasia) → weekly pattern (inconsistency) → HD curve (explanation).  

  **Q&A Handling Tip**: If asked "Is this just poor willpower?", redirect to HD: "Willpower might help resist HD, but HD explains *why* resisting is hard—the value distortion is real and measurable."  

  This approach grounds abstract philosophy/economics in a relatable, sustained example while preempting natural misconceptions at each stage. The focus on HD as a *descriptive* tool (not a moral failing) keeps it accessible for beginners.
