answer: |-
  **Research Proposal: Formalizing the Presumption of Independence as a Default Heuristic in Probabilistic Reasoning**

  **Core Question:** *Under which formalization of "maximal initial ignorance about dependence" does the heuristic "treat evidence as independent absent contrary information" produce reliably accurate beliefs in downstream probabilistic inference tasks, compared to alternative defaults?* This frames the heuristic’s justification not as an abstract principle but as a tool for achieving reliable inference, demanding empirical validation within a defined model of learning and belief updating.

  **Problem: Why Standard Positions Are Inconclusive**
  The debate centers on two irreconcilable formalizations of ignorance:
  1.  **Maximum Entropy (MaxEnt) w/ Fixed Marginals:** Maximizing entropy subject to fixed marginal distributions uniquely yields the product distribution (independence). Advocates argue this is the *least assumptive* distribution given only the marginal information. However, this presupposes that fixing marginals is the correct representation of "knowing only the individual probabilities," which is not inherent. The justification relies critically on the chosen constraint set and is non-invariant under reparameterization of the sample space (e.g., using log-odds instead of probabilities). It assumes the marginal constraints exhaust the relevant information, begging the question of what constitutes "relevant."
  2.  **Uniform Prior Over Joint Distributions:** Assigning a uniform prior over the space of all possible joint distributions (e.g., over the simplex for discrete variables) yields a *spread* over the dependence parameter (e.g., correlation). Independence, being a lower-dimensional manifold within this space, has prior probability zero. Proponents argue this is the only truly non-arbitrary starting point, as it imposes no structure beyond the existence of a joint distribution. However, this renders the independence heuristic *infinitely improbable* as a default starting point, contradicting its practical utility. It also ignores the functional role of the heuristic: agents often *need* a specific joint distribution to compute posteriors, and a diffuse prior may be computationally intractable or lead to unstable inferences with limited data.

  Both positions assume crucial, contested premises: MaxEnt assumes the constraint set defines ignorance; the Uniform Prior assumes the parameterization defines ignorance. Neither addresses whether either formalization *operationalizes* the heuristic’s intended function – enabling tractable, reasonably robust inference when dependence structure is genuinely unknown.

  **Proposed Approach: Functional Analysis via Agent-Based Inference Modeling**
  We resolve the impasse by shifting focus: the heuristic’s justification lies in its *functional efficacy* for an agent performing probabilistic reasoning under uncertainty. We propose a comparative simulation framework:

  1.  **Define Inference Tasks:** Construct a suite of canonical inference problems where evidence items *could* be dependent, but the dependence structure is unknown initially. Examples include: combining diagnostic test results, fusing sensor readings, pooling expert opinions, or sequential hypothesis testing. Each task involves observing data (the evidence) and updating beliefs about a hypothesis.
  2.  **Model Agent Strategies:** Define agents embodying different "ignorance" defaults:
      *   *MaxEnt Agent:* Assumes independence by default (product joint given marginals).
      *   *Uniform Joint Prior Agent:* Uses a prior distribution over the full space of joint distributions (e.g., Dirichlet over joint categories for discrete variables).
      *   *Alternative Default Agents:* (e.g., a minimally correlated prior, a maxent prior over dependence parameters).
  3.  **Simulate Learning & Inference:** For each task and agent:
      *   Provide initial information (e.g., marginal probabilities, no dependence info).
      *   Agents apply their default to form an initial joint belief.
      *   Present simulated evidence data generated from ground-truth joint distributions exhibiting varying *degrees* of dependence (including independence).
      *   Agents update their beliefs (joint and hypothesis) using Bayesian updating.
  4.  **Evaluate Performance:** Measure key metrics over many trials:
      *   *Calibration:* How well do posterior beliefs match the true probability of the hypothesis?
      *   *Accuracy:* Speed and robustness of convergence to correct beliefs as data arrives.
      *   *Robustness:* Performance when the true dependence deviates from the default (e.g., when dependence exists but the MaxEnt agent assumed independence, or when independence holds but the Uniform Prior agent starts diffuse).
      *   *Computational Cost:* Tractability of belief representation and updating.

  **Justification for Approach over Alternatives**
  *   **Purely Axiomatic Treatments:** While valuable, they remain vulnerable to the parameterization-dependence critique. This approach tests which axioms (implicit in the defaults) lead to *functional* success in realistic reasoning scenarios.
  *   **Accumulating Puzzle Cases:** Ad-hoc puzzles lack generalizability and fail to quantify the *degree* of failure/success under varying conditions. This framework systematically probes performance across the dependence spectrum.
  *   **Theoretical Analysis Only:** Abstract analysis cannot resolve the core tension between measure-theoretic objections (favoring Uniform Prior) and information-theoretic arguments (favoring MaxEnt). Simulation provides concrete, measurable outcomes tied to the heuristic's purpose.

  **Success Criteria, Failure Conditions, and Tractability**
  *   **Success:** A clear, statistically significant pattern emerges across tasks showing one default consistently outperforms others in calibration, accuracy, and robustness, particularly in early inference stages with limited data. This identifies which formalization best *implements the heuristic's goal* of enabling reliable inference under ignorance. Success also includes identifying *boundary conditions* (e.g., specific dependence types or data regimes) where one default fails catastrophically.
  *   **Failure:** Performance differences are negligible, highly context-dependent (no clear winner), or favor a different default entirely (e.g., minimal correlation). Failure also occurs if defining "reliable inference" non-arbitrarily proves impossible or if computational costs dominate differences, rendering the functional comparison moot.
  *   **Tractability:** The scope is well-defined but **moderately challenging**. Defining a representative task suite and fair, measurable metrics requires careful design. Simulating Bayesian updating for complex joint priors (especially the Uniform Joint Prior agent) can be computationally intensive. However, focusing on small, discrete probability spaces (e.g., binary variables) for initial proof-of-concept keeps computations manageable while capturing the core conceptual conflict. The lack of need for a comprehensive literature review (per instruction) streamlines execution. The primary risk is ensuring the chosen tasks genuinely reflect the contexts where the heuristic is used.
