  | 7  | Endurance      | (No clear view) | Perdurance       | B is rare (location-essentialism); exdurantists often pick C.        |
  | 8  | Endurance      | Perdurance      | Exdurance        | Clean separation.                                                    |
  | 9  | Endurance      | Perdurance      | Exdurance        | Clean separation.                                                    |

  #### **How to Score**
  - **Endurance**: Count A for Q1, Q3, Q4, Q6, Q8, Q9; **A or B** for Q2 and Q5.  
  - **Perdurance**: Count B for Q1, Q3, Q4, Q6, Q8, Q9; **C** for Q5; **C** for Q7.  
  - **Exdurance**: Count C for Q1, Q3, Q4, Q6, Q8, Q9; **C** for Q7.  

  **Interpretation**:  
  - Your highest score is your dominant view.  
  - **Ties?** Likely mixing intuitions (common!).  
  - **Q2/5/7 Caveats**:  
    - Q2: All options lean endurance (most pick B). Perdurantists *can* pick B but reframe it as temporal overlap.  
    - Q5: Endurance dominates A/B. Perdurantists *must* pick C. Exdurance has no clear option (stages don’t resolve the puzzle).  
    - Q7: Option B isn’t standardly aligned—treat as a wildcard.  

  **Why some combos "break" views**:  
  - Picking **Q1A (Endurance) + Q3B (Perdurance)** is inconsistent—endurance rejects temporal parts.  
  - Picking **Q4C (Exdurance) + Q8A (Endurance)** is contradictory—exdurance denies objects "survive" gaps.  
  - If your answers are split, you’re likely context-dependent (normal!).  

  This quiz highlights why your group argues: cases like the statue/lump (Q2) or Ship of Theseus (Q5) *don’t cleanly separate views*, while time travel (Q3) or the NPC (Q4) do. Your disagreements probably stem from applying different intuitions to different cases—welcome to metaphysics! 😄
