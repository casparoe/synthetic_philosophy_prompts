  Light-cone quandary: Ah, the eternalism/spotlight tension. Here’s the rub: The past light cone is indeed invariant, but its "growth" requires a dynamic view of time—something the block universe denies. The user’s distinction between "structure exists" vs "all equally real" is crucial. Not a full escape, but a coherent alternative metaphysics. This needs nuance, not surrender.

  CMB paragraph: Keep it! Their hunch is right—basing presentism on contingent matter distribution (CMB frame) is philosophically shaky. It’s a band-aid, not a solution. The "bad trade" instinct is sound.

  Weakest link? Probably the light-cone section—it’s where metaphysics gets murkiest. They haven’t *fully* resolved the spotlight charge, but they’ve shown local becoming isn’t self-contradictory. The "conservative option" claim? Earned, if framed as challenging R–P’s implied globality premise rather than claiming victory.

