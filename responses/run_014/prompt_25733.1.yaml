prompt: |-
  I serve on the editorial board of a mid-tier philosophy journal. Last night I had a long argument with a friend—a colleague in my department—about whether our journal should adopt a mandatory data-sharing requirement for empirical submissions. We currently only encourage it. My friend argued that this is a textbook case of a well-intentioned reform that backfires: any journal that unilaterally imposes extra requirements loses submissions to competitors that don't, which then pressures the stricter journals to relax their standards, and the field converges on the lowest common denominator—except now the lax venues have captured more of the prestige. I pushed back, but I couldn't offer a clean way around the structural problem. The board meets next week to decide, and I need to draft a short memo recommending a concrete policy with a timeline. The memo should take my friend's collective-action worry seriously rather than dismissing it as cynicism, and it should give the board something they can actually vote on.
reasoning: |-
  Okay, let me unpack this user's situation. They're a philosophy journal editor preparing a policy memo on mandatory data sharing, grappling with their colleague's collective-action argument. The core tension is between scholarly ethics (ensuring empirical integrity through data sharing) and practical realities (potential submission loss if they act alone).

  Hmm, the user needs more than just policy options - they need diplomatic framing. The colleague's "lowest common denominator" warning can't be dismissed as cynicism; it's a legitimate game theory concern in academia. I recall studies showing journals that mandate data sharing DO experience initial submission drops of 15-30%, though quality often increases.

  The memo must achieve three things: validate the collective-action problem, propose a credible solution pathway, and give the board actionable voting options. The timeline is critical - jumping straight to mandatory would be reckless, but perpetual encouragement maintains the status quo. A phased approach seems wisest, perhaps with clear adoption triggers tied to competitor journals' policies.

  Wait, what about carrots? The user's journal could offset perceived burdens by offering data curation services or "open data" badges. And the "critical mass" framing is strategic - positioning them not as radicals but as responsible followers once a threshold of adopters exists. That might ease board members' anxieties.

  The implementation details matter most: 6 months for tool development, 12 months of strong encouragement with monitoring, then contingent mandatory adoption. Specific metrics like "when 3/5 top competitors mandate sharing" makes the trigger objective. Including an opt-out clause for legitimate cases (privacy concerns etc.) maintains flexibility.

  ...I should emphasize this isn't about forcing revolution. It's about building responsible momentum while protecting the journal's position. The "if-then" structure gives the board control - they're not committing to mandates, just committing to reconsider when conditions change. That's palatable.
answer: |-
  Here’s a concise, actionable memo draft addressing the collective-action concern while proposing a concrete phased policy:

  ---

  **MEMO: Recommendation for Staged Implementation of Mandatory Data Sharing Policy**  
  *To: Editorial Board*  
  *From: [Your Name]*  
  *Date: [Date]*  

  ### 1. **Acknowledging the Collective-Action Problem**  
  My colleague’s warning about unilateral mandates leading to submission loss and a "race to the bottom" is empirically plausible and strategically valid. Adopting burdensome requirements alone could disadvantage our journal without meaningfully advancing transparency. This is not cynicism—it’s a structural dilemma requiring collective solutions.

  ### 2. **Proposed Policy: A Conditional, Phased Mandate**  
  I recommend a **two-stage approach** that commits to mandatory data sharing *only* once critical mass is achieved, minimizing risk while incentivizing field-wide adoption:  

  #### **Stage 1: Strengthened Encouragement + Coalition Building (12–18 Months)**  
  - **Immediate Action (0–3 months):**  
    - Revise guidelines to **strongly recommend** data/code sharing, detailing benefits (replicability, citations) and offering **optional peer review of materials**.  
    - Introduce an **"Open Data" badge** on published articles that share data, displayed prominently online and in PDFs.  
    - Co-sign public statements (e.g., with *Peer Community in Philosophy*) urging journals to adopt shared standards.  
    - Actively recruit ≥5 peer journals to join a "Transparency Coalition" (goal: draft shared requirements by Month 12).  

  #### **Stage 2: Conditional Mandate (Trigger-Based)**  
  - **Implementation Trigger:** When ≥3 of our top 5 competitor journals (e.g., *Journal X, Y, Z...*) adopt mandatory data sharing.  
  - **Post-Trigger Action (Within 3 Months):**  
    - Enforce mandatory data/code sharing for all new empirical submissions.  
    - Exemptions permitted for sensitive data (with anonymization plans) or legal constraints.  
    - Provide author support: curation tools, FAIR guidelines, and a 12-month grace period for minor non-compliance.  

  ### 3. **Why This Works**  
  - **Mitigates Submission Loss:** No mandate until peers act, preserving competitiveness.  
  - **Builds Leverage:** The coalition and badges incentivize adoption elsewhere. Journals face reputational pressure if they resist joining peers.  
  - **Demonstrates Leadership:** We signal commitment without unilateral sacrifice, accelerating field-wide change.  
  - **Low-Risk Transition:** Stage 1 tests infrastructure (e.g., repositories, review workflows) before mandates.  

  ### 4. **Timeline Summary**  
  | **Phase**         | **Timeline**     | **Key Actions**                             |  
  |-------------------|------------------|--------------------------------------------|  
  | **Prep (0–3 mo)** | Immediate        | Launch badges; draft coalition invites     |  
  | **Stage 1**       | Months 4–18      | Promote badges; recruit coalition; monitor peers |  
  | **Stage 2**       | When trigger met | Enforce mandate (with exemptions/support)  |  

  ### 5. **Voting Recommendation**  
  I move: **"Adopt the staged policy above, with Stage 2 activation contingent on ≥3 competitor journals mandating data sharing."**  

  ---  

  ### Key Strategic Advantages  
  - **Safety:** Abandon Stage 2 if competitors don’t act, avoiding unilateral burden.  
  - **Momentum:** Badges/coalition make *our* journal a hub for transparency-minded authors.  
  - **Field-Wide Impact:** Shifts the collective-action problem from a barrier to a catalyst.  

  This turns our dilemma into leadership—without gambling the journal’s position.
