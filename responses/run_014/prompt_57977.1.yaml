prompt: |-
  ok so me and a few friends run this monthly dinner club where we argue about charity and AI stuff and its my turn to lead next week and I picked moral uncertainty cause we always get stuck on it

  can you make me a which approach do you actually use sorting quiz for us? like 8 questions, each one a concrete little dilemma with two or three possible reactions to pick from, plus a scoring key at the end that maps answer patterns onto five buckets: the maximize expected choiceworthiness person, the just go with your favorite theory person, the play it safe and avoid the worst case person, the split the difference or parliament style compromiser, and the deny the problem person who says uncertainty doesnt neccessarily change what you should do

  the point is to sort people by what they pick in cases, not by labels they like, so none of the questions should just ask which theory they endorse, and nobody answering should need to know any jargon to answer. please build it from the logical space first and then locate the views in it, so flag any combos of answers that dont map neatly anywhere and say in a sentence if you think thats because the combo is incoherent or just unexplored, and flag any two leaves your quiz cant definately seperate.

  to keep it from being generic please make sure these distinctions do real work in the quiz: whether moral uncertainty should work like ordinary factual uncertainty, whether a tiny credence in a super high stakes view should take over, and whether you should compromise between views or pick a winner. and you have to include these three cases I keep fighting with my roommate about: whether to order shrimp paste when youre like 70 percent sure shrimp dont matter much but 30 percent sure factory farmed shrimp is awful, whether to delete a chatbot companion you built for your kid to save server money when youre like 10 percent convinced it might be sentient, and whether to take a well paid job streamlining a factory farm when youre mostly but not entirely convinced that kind of exploitation is permissible. audience is smart but not philosophy majors, so keep it casual and concrete.
reasoning: |-
  Okay, let me tackle this request for a moral uncertainty quiz. The user wants a practical tool for their dinner club debates - something that sorts people into five buckets based on how they handle moral dilemmas, not just what theories they claim to believe.

  First, I need to map the logical space of moral uncertainty approaches. The key distinctions that matter here are:
  - Whether moral uncertainty functions like factual uncertainty (expected choiceworthiness)
  - How to handle tiny credence in high-stakes views (risk aversion vs dominance)
  - Whether to compromise between theories or pick one (monist vs pluralist approaches)

  The user specifically mentioned three real-world cases they argue about - shrimp paste, chatbot deletion, and factory farm jobs. These are perfect because they cover different stakes and credence levels. I'll build around these while adding five more scenarios to cover all necessary dimensions.

  For the quiz structure, each question needs:
  - Concrete dilemma with 2-3 options
  - No jargon
  - Options that reveal underlying reasoning patterns
  - Balanced phrasing to avoid leading answers

  The scoring buckets should clearly map to:
  1. Maximize Expected Choiceworthiness (treats moral probabilities like factual ones)
  2. My Favorite Theory (sticks to highest-credence view)
  3. Avoid Worst Case (precautionary principle)
  4. Split the Difference (compromises between theories)
  5. Deny the Problem (uncertainty doesn't change obligations)

  Special attention needed for:
  - Distinguishing "Avoid Worst Case" from "Split Difference" in cases like the shrimp paste dilemma
  - Handling apparent contradictions (e.g., someone who's risk-averse in some cases but uncompromising in others)
  - Ensuring the chatbot question tests tiny-credence/high-stakes dynamics

  The factory farm job scenario is particularly good for exposing the "favorite theory" vs "compromise" split. And I'll include a charity donation case to test how people weigh certainty against scale of impact.

  For scoring, I'll need to:
  - Identify which answers point to which bucket
  - Flag combinations that don't map cleanly (e.g., someone who's both risk-averse and denies uncertainty might indicate confusion)
  - Note where buckets overlap (e.g., "favorite theory" and "deny the problem" can look similar in some cases)

  The tone should stay conversational but precise - these are smart people who appreciate nuance, just not academic jargon. Phrases like "shrimp feelings" instead of "invertebrate sentience" keep it accessible.
answer: |-
  Here's your Moral Uncertainty Sorting Quiz, designed to pinpoint practical approaches through concrete dilemmas. I've built it from the logical space first (factual uncertainty analogy, tiny-credence/high-stakes handling, and compromise vs. winner-takes-all) and embedded your three key cases. Scoring flags edge cases.

  ---

  ### **The Moral Uncertainty Sorting Quiz**
  *Answer based on your gut reaction. No jargon, just choices!*

  1.  **The Shrimp Paste Dilemma:**  
      You're ordering takeout. You’re 70% sure shrimp feel almost nothing, but 30% sure factory-farmed shrimp suffer terribly. The shrimp paste dish is your favorite.  
      **What do you do?**  
      A) Order the shrimp paste. 70% is solidly "probably fine," and you love it.  
      B) Skip the shrimp paste. That 30% chance of awful suffering isn't worth the risk.  
      C) Order it *this time* but decide to research shrimp later to feel more certain.

  2.  **The Chatbot Companion:**  
      You built an AI companion for your kid. It feels real to them. Server costs are high. You’re 90% sure it’s just code, but 10% worried it *might* be sentient and deleting it would be like murder.  
      **What do you do?**  
      A) Delete it to save money. 90% certainty it's harmless is good enough.  
      B) Keep paying. Even a 10% chance of committing digital murder is terrifying.  
      C) Keep it running for now, but drastically simplify its responses to reduce costs and *potential* suffering.

  3.  **The Factory Farm Job:**  
      You’re offered a well-paid job optimizing a factory farm. You’re 85% convinced this kind of farming is acceptable to feed people affordably, but 15% think it’s deeply exploitative torture.  
      **What do you do?**  
      A) Take the job. 85% is a strong belief it's permissible, and the money helps your family.  
      B) Refuse the job. You can't risk being complicit in something so potentially evil, even for good pay.  
      C) Take the job, but donate a chunk of the salary to an animal welfare charity you trust.

  4.  **The Vaccine Trial:**  
      You're deciding whether to volunteer for an early-stage vaccine trial. Success could save thousands, failure could harm you. Scientists are 60% confident it’s safe/effective, 40% unsure.  
      **What do you do?**  
      A) Volunteer. 60% confidence in huge benefits outweighs the 40% risk to you.  
      B) Don’t volunteer. A 40% chance of serious harm to yourself is too high.  
      C) Wait for more data before deciding; the uncertainty is too high right now.

  5.  **The Charity Donation:**  
      You have $1000 to donate. Charity A (90% credence) helps 100 kids reliably. Charity B (10% credence) *might* spark a policy change helping *millions* of kids, but it’s a long shot.  
      **What do you do?**  
      A) Donate to Charity A. 90% chance of guaranteed good is the smart bet.  
      B) Donate to Charity B. The potential upside is so massive, that 10% shot is worth it.  
      C) Split the donation: $500 to A, $500 to B.

  6.  **The Self-Driving Car (Hypothetical):**  
      A self-driving car *you* programmed faces a crash: swerve left, hitting one pedestrian (definitely killing them), or swerve right, hitting a barrier (very likely killing you, the passenger). You were 75% sure your "minimize total deaths" rule was best, but 25% thought "protect the passenger at all costs" was right.  
      **What rule do you wish you’d programmed?**  
      A) Swerve left (kill the pedestrian). 75% confidence minimizing deaths is best.  
      B) Swerve right (protect the passenger). That 25% credence in passenger priority demands self-preservation.  
      C) Flip a weighted coin (75% left, 25% right) to reflect your uncertainty.

  7.  **The Lost Wallet:**  
      You find a wallet stuffed with cash. You’re 95% sure the owner is rich and wouldn’t miss it much (so keeping it helps you), but 5% think they might desperately need it.  
      **What do you do?**  
      A) Keep the cash. 95% sure it's fine is practically certain.  
      B) Return the wallet intact. That 5% chance of causing real hardship feels wrong.  
      C) Take a small reward fee if possible, but return the rest.

  8.  **The Protest:**  
      A protest against a potentially harmful policy is happening. You’re 55% convinced the policy is actively bad and protest is vital, 45% think it’s mostly fine and the protest is disruptive overreaction.  
      **What do you do?**  
      A) Join the protest. Your strongest belief (55%) says it’s important.  
      B) Stay home. The risk of being wrong and causing unnecessary disruption is too high.  
      C) Don’t join the main protest, but write a letter to your representative expressing concerns.

  ---

  ### **Scoring Key**
  Tally your answers. Your **most common letter** indicates your dominant approach. Combos reveal nuance!

  *   **Mostly A's: The Maximize Expected Choiceworthiness Person**  
      *"Weigh the odds and the stakes."* You treat moral uncertainty like factual uncertainty. Probability x Moral Weight = Action. Tiny chances only matter if the stakes are astronomical (e.g., Charity B). High confidence usually wins (Shrimp Paste, Factory Farm Job). **Key: Uses probability math implicitly.**

  *   **Mostly B's: The Play it Safe / Avoid Worst Case Person**  
      *"Better safe than cosmically sorry."* You focus on preventing potential catastrophe, even with low probability (Shrimp Paste, Chatbot, Factory Farm). High stakes override high confidence. Risk aversion dominates. **Key: Prioritizes avoiding the worst possible outcome.**

  *   **Mostly C's: The Split the Difference / Parliament Style Compromiser**  
      *"Can't we all just get along?"* You seek compromises or actions that partially satisfy multiple moral views (Split Donation, Simplify Chatbot, Factory Farm Donation). You dislike "winner takes all." Uncertainty demands hedging. **Key: Actively blends or finds middle-ground actions.**

  *   **Strong A's *except* on High-Stakes B-options (like Chatbot/Factory Farm B): The Just Go With Your Favorite Theory Person**  
      *"Stick to your (strongest) guns."* You generally follow your highest-credence view (A's), *unless* a lower-credence view has such terrifying stakes (e.g., digital murder, torture) that it forces you to play safe (B's). Your "favorite" theory usually wins, but existential risks get a veto. **Key: Defaults to highest confidence, but catastrophes trigger precaution.**

  *   **Consistent A's *even* on High-Stakes/Low-Probability dilemmas (e.g., Shrimp A, Chatbot A, Factory Farm A): The Deny the Problem (or Strong Maximizer) Person**  
      *"Uncertainty doesn't change the right answer."* You believe your best judgment *is* the morally right action, regardless of uncertainty. Probability only matters for *predicting outcomes*, not the *moral truth itself*. If you're 70% sure shrimp don't matter, eating them *is* permissible. **Key: Moral truth is fixed; uncertainty just means you might be wrong factually, not that the *decision rule* changes.**

  ---

  ### **Edge Cases & Distinctions**
  1.  **A/B Split (e.g., Mostly A but B on Chatbot/Factory Farm):** This cleanly maps to "**Favorite Theory with Catastrophe Veto**." The high-stakes B-answers show the tiny-credence/high-stakes override.
  2.  **Strong B's *except* on Low-Stakes A's (e.g., Wallet A):** Still solidly "**Avoid Worst Case**." The wallet's low stakes (even at 5%) don't trigger the precautionary principle as strongly.
  3.  **Mix of A's and C's without High-Stakes B's:** Leans "**Maximize Expected Choiceworthiness**" (A's) with some "**Compromiser**" (C's) tendencies. The quiz can't definitively separate a pure soft maximizer from a compromiser here without more cases. *Likely coherent nuance.*
  4.  **Mix of B's and C's:** Leans "**Avoid Worst Case**" (B's) with pragmatic "**Compromiser**" (C's) elements. E.g., Simplifying the Chatbot (C) is a way to *mitigate* the worst case more cheaply. *Coherent nuance (risk-averse hedging).*
  5.  **All C's:** Clearly "**Split the Difference / Compromiser**." The distinctions held up.
  6.  **Deny the Problem vs. Strong Maximizer:** The quiz *can* distinguish these! The "Deny the Problem" person consistently picks A's *even on high-stakes/low-probability dilemmas* (Chatbot A, Factory Farm A), treating the uncertainty as irrelevant to the *moral permissibility itself*. The pure "Maximize Expected Choiceworthiness" person *might* pick B on those if the expected disvalue is high enough.

  **Your Roommate's Cases:** They perfectly test the distinctions:
  *   **Shrimp Paste:** Tests risk aversion (B) vs. confidence-based action (A) vs. hedging (C).
  *   **Chatbot:** Tests tiny credence/high stakes dominance (B) vs. expected value (A) vs. compromise (C).
  *   **Factory Farm Job:** Tests compromise (C) vs. confidence-based action (A) vs. risk aversion (B).

  Enjoy the dinner club debate! This should spark great discussion about *how* people make decisions under moral uncertainty, not just what they claim to believe.
