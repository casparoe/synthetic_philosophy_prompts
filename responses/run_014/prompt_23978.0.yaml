     This works, and the nations are making import decisions based on the other nation's prices and their own gold.

     Now, the catch: the exports are determined by the import demands of the other nation. So:

          E_apples = min(D_apples_B, 10)
          E_books = min(D_books_B, 10)
          E_bananas = min(D_bananas_A, 10)
          E_chairs = min(D_chairs_A, 10)

     And the gold flow for Nation A is:
          (revenue from exports) - (expenditure on imports) = [E_apples*P_apples + E_books*P_books] - [E_bananas*P_bananas + E_chairs*P_chairs]

     This design allows the trade imbalance and gold flow.

     Let's run a hypothetical with the initial conditions:

     Suppose prices:
          Nation A sets: P_apples = 10, P_books = 10  (high)
          Nation B sets: P_bananas = 2, P_chairs = 2   (low)

     Nation A's import demand for Nation B's goods:
          They want to buy as many as possible because they give 2 utility points and are cheap.
          They can afford: with 100 gold, they can buy up to floor(100/2)=50 of each, but Nation B only has 10 of each.
          So they will demand 10 bananas and 10 chairs, costing 10*2 + 10*2 = 40 gold.

     Nation B's import demand for Nation A's goods:
          They want to buy apples and books (2 utility points) but they are expensive.
          With 20 gold, they can afford at most 2 of either (since 10 gold each), so they might buy 2 apples and 0 books, or 1 apple and 1 book, etc. Let's say they buy 2 apples: cost 20 gold.

     Then trade:
          E_bananas = min(10,10)=10
          E_chairs = min(10,10)=10
          E_apples = min(2,10)=2
          E_books = min(0,10)=0   [if they bought no books]

     Gold flow for Nation A:
          Revenue from exports: 2*10 + 0*10 = 20 gold
          Expenditure on imports: 10*2 + 10*2 = 40 gold
          Net gold flow: 20 - 40 = -20 gold, so they lose 20 gold.

     Nation A's utility:
          apples: 10 - 2 = 8 -> 8 points
          books: 10 - 0 = 10 -> 10 points
          bananas: 10 -> 20 points
          chairs: 10 -> 20 points
          total = 8+10+20+20 = 58

     Nation B's utility:
          bananas: 10 - 10 = 0 -> 0 points
          chairs: 10 - 10 = 0 -> 0 points
          apples: 2 -> 4 points
          books: 0 -> 0 points
          total = 0+0+4+0 = 4

     This is not great for Nation B. They might choose to not export everything? But in this design, export is forced by the import demand of the other nation. They don't choose how much to export; it's determined by the other nation's demand.

     And here, Nation B exports all their goods and gets only 2 apples in return, and no books. They also lose their domestic consumption of bananas and chairs? They exported everything.

     This is a flaw. We forgot that Nation B might not want to export everything. They might want to reserve some for domestic consumption.

     To fix: when a nation sets its import demand, it doesn't affect its own domestic supply. The domestic supply is fixed at 10. The nation can choose to consume some domestically and export the rest, but in this design, the export is forced by the other nation's demand, and they might be forced to export even if they want to keep some.

     We need to let each nation choose how much to export (i.e., how much of their goods to make available for export) and how much to consume domestically. The import demand from the other nation is then limited by the export supply.

     Revised centralized market:

     - Each nation, in addition to setting prices, decides how much of each good to make available for export (0 to 10).
     - Then, the other nation decides how much to import (up to the available export supply) given the prices and their gold constraint.

     Steps:

     a. Set prices and export supplies:
          - Nation A: sets P_apples, P_books, and also chooses:
                 S_apples_export = amount of apples available for export (0-10)
                 S_books_export = amount of books available for export (0-10)
          - Nation B: sets P_bananas, P_chairs, and also chooses:
                 S_bananas_export = amount of bananas available for export (0-10)
                 S_chairs_export = amount of chairs available for export (0-10)

     b. Import decisions:
          - Nation A, given Nation B's prices and export supplies, and given its initial gold (100), chooses how many bananas and chairs to import, denoted D_bananas_A and D_chairs_A, such that:
               D_bananas_A <= S_bananas_export
               D_chairs_A <= S_chairs_export
               D_bananas_A * P_bananas + D_chairs_A * P_chairs <= 100
          - Nation B, similarly, with initial gold (20), chooses D_apples_B and D_books_B such that:
               D_apples_B <= S_apples_export
               D_books_B <= S_books_export
               D_apples_B * P_apples + D_books_B * P_books <= 20

     c. Trade happens:
          - Actual exports of apples = min(D_apples_B, S_apples_export)  [but since D_apples_B<=S_apples_export, it's D_apples_B]
            Similarly for others.
          - Payments are as before.

     d. Domestic consumption:
          - Nation A: 
               apples: 10 - [actual exports of apples]   [note: they might have made available more than they exported? The exports are what was demanded, up to the supply they made available. The domestic consumption is 10 minus the actual exports.]
               books: 10 - [actual exports of books]
               bananas: D_bananas_A
               chairs: D_chairs_A
          - Nation B: similarly.

     e. Utility as before.

     f. Gold update: 
          Nation A's new gold = 100 - ( expenditure on imports from B ) + ( revenue from exports to B )

     This allows each nation to choose how much to make available for export, so they can reserve some for domestic consumption. The actual exports are then the minimum of the export supply and the import demand.

     Now, let's run the example again:

     Prices as before: 
          A: P_apples=10, P_books=10; 
          B: P_bananas=2, P_chairs=2.

     Export supplies:
          Nation A: might set S_apples_export=10, S_books_export=10 (because they get only 1 point for domestic consumption but 2 points for imported goods, so they want to export as much as possible to then import).
          Nation B: might set S_bananas_export=8, S_chairs_export=8 (reserving 2 of each for domestic consumption).

     Import demands:
          Nation A: 
               They can afford up to 100/2=50 of each, but the export supply is 8 for each.
               So they will demand 8 bananas and 8 chairs, costing 8*2+8*2=32 gold.
          Nation B:
               They can afford up to 20/10=2 of apples or books.
               Suppose they demand 2 apples and 0 books, costing 20 gold.

     Trade:
          Apples exported: min(2,10)=2
          Books exported: min(0,10)=0
          Bananas exported: 8
          Chairs exported: 8

     Nation A's utility:
          apples: 10 - 2 = 8 -> 8 points
          books: 10 - 0 = 10 -> 10 points
          bananas: 8 -> 16 points
          chairs: 8 -> 16 points
          total = 8+10+16+16 = 50

     Nation B's utility:
          bananas: 10 - 8 = 2 -> 2 points
          chairs: 10 - 8 = 2 -> 2 points
          apples: 2 -> 4 points
          books: 0 -> 0 points
          total = 2+2+4+0 = 8

     Gold flows:
          Nation A: 
               revenue from exports: 2*10 + 0*10 = 20
               expenditure on imports: 8*2 + 8*2 = 32
               net gold change: 20 - 32 = -12, so new gold = 100 - 12 = 88
          Nation B: 
               revenue from exports: 8*2+8*2=32
               expenditure on imports: 2*10=20
               net gold change: 32-20 = 12, so new gold = 20+12 = 32

     In the next round, Nation B has more gold (32) and might set higher prices or import more. Nation A has less gold (88) but still a lot.

     This can continue.

     Given time, we might run 3-5 rounds.

     The scoring (utility) should be reported after each round.

     Debriefing: 
     - We should see that initially, Nation B has a trade surplus (exports > imports in value) and gains gold. 
     - Over time, as Nation B gains gold, they might start to experience higher prices (if they choose to set higher prices) because they have more gold chasing the same goods? Or they might not. 
     - Eventually, Nation B's prices might rise relative to Nation A's, making Nation B's goods less attractive, and Nation A's goods more attractive, thus reversing the flow.

     However, in this simulation, prices are set by the nations, so they might not raise them immediately. We hope that in later rounds, Nation B, having more gold, might become less competitive by setting higher prices (or because they can afford to), while Nation A, having less gold, might lower prices to attract demand.

     What might go wrong:

     1. Prices might not adjust: 
          - Students might not change prices, or might not understand the impact. We might see no change in the trade balance.

     2. Nation B might not increase prices even with more gold, because they want to remain competitive.

     3. The utility functions might lead to behavior that doesn't show the mechanism.

     4. The simulation might not run long enough for the reversal.

     To encourage price adjustment, we can impose that each nation must set prices in round 1 and then can adjust in later rounds. We can also suggest in the instructions that having more gold might lead to inflation.

     Additionally, we can have a rule that if a nation's gold stock changes by a lot, they might be forced to adjust prices? But that might be too interventionist.

     Alternatively, in the debrief, we can discuss why prices might adjust in reality (because with more gold, people have more money to spend, bidding up prices) but in the simulation, the students might not feel that pressure.

     Parts of Hume's argument that are not reproduced:

     - Time lags: the adjustment happens immediately in the simulation.
     - Free movement of specie: in the simulation, gold flows freely and immediately.
     - The simulation assumes that prices are set by the nations deliberately, whereas in Hume's mechanism, prices adjust naturally in the market.
     - The simulation has fixed production each round, whereas in reality, production might respond to prices.

     Concrete rules for the simulation:

     Materials:
       - Gold tokens for each nation (starting: Nation A: 100, Nation B: 20)
       - Goods: use paper cards or something. For simplicity, we can use tallies on a sheet.

     Steps for each round:

     1. Each nation meets separately and decides:
          - The prices for their two goods (in gold per unit).
          - The amount of each good they make available for export (0 to 10).

     2. The nations announce their prices and export supplies.

     3. Each nation then meets and decides how much to import from the other nation, given:
          - the other nation's prices and export supplies,
          - and their own gold stock at the start of the round.
          - They must ensure the total cost of imports does not exceed their gold stock.

     4. The instructor collects the import decisions.

     5. The instructor calculates the actual trade:
          - For each good, the actual export is the amount demanded by the importer (because it is limited by the export supply and the importer's demand and gold).
          - Then calculates the gold flows and updates gold stocks.

     6. Calculate domestic consumption and utility.

     7. Report the results to both nations.

     We provide a worksheet for each nation to record and calculate.

     Number of rounds: 3 to 5.

     Debriefing points:

     - After the simulation, ask the students to describe what happened to gold stocks and trade balances over the rounds.
     - Did the trade imbalance (surplus/deficit) change? Why?
     - How did prices change over time? Why?
     - How did the changes in prices affect the trade flows?
     - Relate to Hume: 
          - Initially, Nation B had a trade deficit and little gold. What happened? (They ran a surplus and gained gold.)
          - As Nation B gained gold, what happened to their prices? (Hopefully, they rose.) Why might that happen in reality? (Because with more gold, the money supply increases, leading to inflation.)
          - How did that affect their exports and imports? (Their exports became more expensive and imports became relatively cheaper, leading to a decrease in their surplus or even a deficit.)

     - Discuss the limitations:
          - In the simulation, prices are set by the nations, but in reality, prices are determined by supply and demand in the market.
          - The time frame is compressed.
          - We assumed that goods are perishable and produced fresh each round, whereas in reality, inventories matter.
          - We assumed that the utility functions are given and constant, whereas in reality, preferences might change.

     - Emphasize Hume's insight: the trade deficit is self-correcting because the gold flows change relative prices.

     - Finally, highlight: the real wealth is in the goods and the capacity to produce, not in the gold itself. In the simulation, when Nation B gained gold but also consumed more goods (including imports), their utility increased. And when Nation A lost gold but still consumed a variety of goods, they also had high utility.

     This should help the students feel the mechanism.

     Let's now write the concrete rules for the instructor.
answer: |-
  ### In-Class Simulation: Hume's Price-Specie Flow Mechanism  
  **Objective:** Demonstrate how trade imbalances self-correct through price adjustments and gold flows, challenging mercantilist fears of deficits.  

  ---

  #### **Setup**  
  1. **Divide the Class:**  
     - Nation A (initially gold-rich/surplus nation): 7 students.  
     - Nation B (initially gold-poor/deficit nation): 7 students.  
     - Assign roles:  
       - Each nation has 1 "Central Banker" (sets prices and tracks gold).  
       - 3 "Producers" (manage goods production and domestic sales).  
       - 3 "Traders" (negotiate imports/exports with the other nation).  

  2. **Starting Conditions (Rigged for Imbalance):**  
     - **Nation A:**  
       - Gold: 100 tokens.  
       - Goods: 10 units of **Wool** (cost: 5 gold/unit to produce).  
     - **Nation B:**  
       - Gold: 20 tokens.  
       - Goods: 10 units of **Wine** (cost: 5 gold/unit to produce).  
     - *Why this works:* Nation A’s high gold stock mimics chronic trade surpluses; Nation B’s low gold forces aggressive exports.  

  3. **Utility Points (Scoring Without Real Money):**  
     - Consuming **1 domestic good** = 1 point (e.g., Nation A gets 1 pt for Wool).  
     - Consuming **1 imported good** = 2 points (e.g., Nation A gets 2 pts for Wine).  
     - *Rationale:* Models gains from trade. Higher utility from imports incentivizes trade, but requires gold spending.  

  ---

  #### **Rules & Sequence**  
  **Each Round = 10 Minutes (Run 3-4 Rounds Total)**  

  1. **Price Setting (2 mins):**  
     - **Central Bankers** set domestic prices:  
       - Nation A sets price of **Wool** (in gold).  
       - Nation B sets price of **Wine** (in gold).  
     - *Constraint:* Prices must cover production costs (≥5 gold).  

  2. **Production & Domestic Sale (2 mins):**  
     - **Producers** create 10 new units of their good (e.g., Nation A makes 10 Wool).  
     - Sell domestically:  
       - Producers sell goods to their own nation’s consumers at the set price.  
       - Gold paid by consumers goes to the nation’s treasury (not producers).  

  3. **Trade Negotiation (4 mins):**  
     - **Traders** negotiate cross-border deals:  
       - Nation A’s Traders buy Wine from Nation B (imports).  
       - Nation B’s Traders buy Wool from Nation A (imports).  
     - **Rules for Trade:**  
       - Imports must be paid in gold at the *exporter’s* set price.  
       - Gold flows immediately from importer to exporter.  
       - No credit/debt: Trade only if importer has enough gold.  

  4. **Consumption & Scoring (1 min):**  
     - Nations consume:  
       - Domestic goods not sold + imported goods.  
       - Record utility points (1 pt/domestic good, 2 pts/imported good).  
     - Update gold:  
       - Add: Export revenue (gold from sales to the other nation).  
       - Subtract: Import costs (gold paid to the other nation).  

  5. **Reset for Next Round:**  
     - Unconsumed goods expire (no carryover).  
     - Production restarts (10 new units per nation).  

  ---

  #### **Expected Flow & Key Lessons**  
  - **Round 1 (Imbalance):**  
    - Nation B (gold-poor) sets **low Wine prices** (e.g., 6 gold) to attract buyers.  
    - Nation A (gold-rich) sets **high Wool prices** (e.g., 15 gold), confident in spending power.  
    - Result: Nation A imports heavily (spends gold on Wine), Nation B exports desperately. Gold flows **A → B**.  
    - *Debrief hook:* "Why did Nation B 'win' by losing gold initially?"  

  - **Round 2 (Self-Correction Begins):**  
    - Nation B’s gold rises → **raises Wine prices** (e.g., 10 gold) due to optimism.  
    - Nation A’s gold falls → **lowers Wool prices** (e.g., 8 gold) to stay competitive.  
    - Result: Nation A’s exports (Wool) become cheaper; Nation B’s exports (Wine) become pricier. Trade deficit shrinks.  

  - **Round 3 (Reversal):**  
    - Nation B’s high prices make Wine less attractive; Nation A’s lower prices boost Wool demand.  
    - Gold flows **B → A** as Nation A runs a trade surplus.  
    - *"Aha!" moment:* Nation B sees high utility points from earlier imports (Wool) despite "losing" gold.  

  ---

  #### **Debrief: Mapping to Hume’s Mechanism**  
  1. **Gold Flow & Price Changes:**  
     - "When Nation B gained gold, why did prices rise? Hume argued specie inflow raises prices (inflation)."  
     - "When Nation A lost gold, why did prices fall? Deflation restores competitiveness."  

  2. **Self-Correction:**  
     - "Did the trade imbalance persist? No! High prices in the surplus nation (B) made its goods less desirable, reversing the flow. Hume’s insight: Deficits are temporary."  

  3. **Wealth ≠ Gold:**  
     - "Nation B had less gold in Round 3 but more utility points. Why? Real wealth is in goods consumed, not gold hoarded. Hume: ‘Money is none of the wheels of trade’—it’s the oil."  

  4. **Mercantilism Debunked:**  
     - "Mercantilists feared gold outflows. But Nation B’s ‘deficit’ brought utility gains. Hume: Trade deficits self-correct and benefit both sides."  

  ---

  #### **What Will Go Wrong (And How to Fix)**  
  1. **Prices Won’t Adjust:**  
     - *Risk:* Students freeze prices to "control" the economy.  
     - *Fix:* Announce: "If your gold changes by >30% last round, you MUST adjust prices by at least 20%."  

  2. **Deficit Nation Hoards Gold:**  
     - *Risk:* Nation B refuses to spend gold on imports to "protect" reserves.  
     - *Fix:* Impose penalties ("If imports = 0, your utility drops 50%. Consumers riot!").  

  3. **Negotiation Chaos:**  
     - *Risk:* Traders haggle endlessly.  
     - *Fix:* Use a timer. If no deal in 2 mins, trade halts for that round.  

  4. **Over-Simplification:**  
     - *Risk:* Students miss real-world complexity.  
     - *Fix:* Ask: "How would tariffs or transport costs change this? Hume assumed free flow, but what if gold moves slowly?"  

  ---

  #### **Limitations to Clarify in Debrief**  
  - **Time Lags:** Hume’s mechanism works over years, not rounds. Prices don’t adjust instantly irl.  
  - **Free Specie Flow:** Simulation assumes gold moves freely, but wars/regulations can block it.  
  - **Wages/Employment:** Hume assumed full employment; recessions break the mechanism.  
  - **Non-Gold Economies:** Modern fiat money and central banks alter the dynamics.  

  ---

  **Final Tip:** Run a "trial round" with fixed prices to teach mechanics. Then reset and begin. By Round 3, students will groan when the gold-rich nation’s goods become "too expensive"—they’ll feel Hume’s logic in real-time.
