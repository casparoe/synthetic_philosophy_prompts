answer: |-
  Here's an example tailored for a software engineer, framed in terms of type checks (compile-time) versus runtime behavior, avoiding the common "I am here" and "water=H2O" examples:

  ### Example: **"The CEO of Meta is Mark Zuckerberg."**
  - **Rigid Designator Setup**: Imagine we define a fixed reference to "Zuck" as *"the actual CEO of Meta (as of 2024)"*.  
    (This is like hardcoding a variable at compile-time based on the "actual world" context.)

  #### Primary Intension (Compile-Time/Type Check)
  - **What it does**: Evaluates the sentence in **any hypothetical context** (like running a type check across all possible codebases).  
  - **How it works**: In every context (e.g., different "actual worlds" you might compile in), "Zuck" rigidly refers to whoever is the *actual* CEO of Meta *in that specific context*.  
    ```python
    # Primary Intension Pseudocode (Type Check)
    def primary_intension(world_as_actual):
        zuck = world_as_actual.CEO_of_Meta  # "Zuck" binds to the CEO in *this* world
        return (zuck == world_as_actual.CEO_of_Meta)  # Always True!
    ```
  - **Result**: `True` in all contexts.  
    Why? No matter which world you designate as "actual" during compilation, "Zuck" points to its local CEO, so the sentence reduces to "The CEO is the CEO" (a tautology). **Necessary primary intension.**

  #### Secondary Intension (Runtime Behavior)
  - **What it does**: Evaluates the sentence in **counterfactual scenarios**, *after* fixing the "actual world" reference (like running code after compile-time).  
  - **How it works**: We fix "Zuck" to the *real-world CEO* (Mark Zuckerberg). Now we test hypothetical scenarios (e.g., parallel universes where Meta has a different CEO).  
    ```python
    # Secondary Intension Pseudocode (Runtime)
    actual_world = Earth_2024  # Fixed reference: Zuck = Mark Zuckerberg
    def secondary_intension(counterfactual_world):
        # "Zuck" is rigid! Always points to Mark Zuckerberg (fixed at compile-time)
        return (actual_world.zuck == counterfactual_world.CEO_of_Meta)
    ```
  - **Result**: `True` only if Mark Zuckerberg is CEO in the counterfactual world.  
    In a world where Sheryl Sandberg is CEO (e.g., `counterfactual_world = Earth_2024_alt`), it returns `False`. **Contingent secondary intension.**

  ---

  ### Key Analogy to Software
  | Concept                | Software Analogy                                                                 | Example Breakdown                                                                 |
  |------------------------|----------------------------------------------------------------------------------|----------------------------------------------------------------------------------|
  | **Primary Intension**  | **Type check / Compile-time**                                                    | Like a generic type `T` that resolves to `local CEO` in every compilation context. Always passes. |
  | **Secondary Intension**| **Runtime execution**                                                            | After compilation, `T` is fixed to `MarkZuckerberg`. Fails if runtime input differs.             |
  | **Why Contingent?**    | Hardcoded values behave differently under new inputs.                            | If you compile on Earth (`zuck = MarkZuckerberg`) but run on Mars (`CEO = Elon Musk`), it fails. |

  ### Why This Works
  - **Primary = Necessary**: In *any* "actual world" context, "Zuck" locally resolves to the CEO, making the statement trivially true (like a type check verifying `x: T` is `T`).  
  - **Secondary = Contingent**: Once references are fixed (e.g., `zuck = MarkZuckerberg`), runtime checks depend on external state (e.g., "Is Zuck CEO *here*?").  

  > This mirrors how a function compiled with hardcoded values (e.g., `API_KEY = "123"`) always type-checks, but fails at runtime if the environment changes (e.g., the key is invalid). The "actual world" is your compile-time context, while counterfactuals are runtime inputs.
