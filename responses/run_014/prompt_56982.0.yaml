answer: |-
  ### Examination Paper: Time, Risk, and Rational Choice  
  **Section B (Answer this question)**  
  **Time Allowed:** 45 minutes  
  **Marks:** 25  
  **Instructions:**  
  - Answer all parts of the question below.  
  - You may use the precomputed figures in Table 1 without re-deriving them.  
  - No calculators or external resources are permitted.  
  - **Rubric:** Marks are awarded for precise identification of maximised criteria, conditions under which criteria diverge, and critical evaluation of arguments. Restating general properties of the Kelly criterion without contextual engagement (e.g., "it maximises growth rate" or "avoids ruin") earns no marks. Focus on the specifics of the endowment’s claims and the data provided.  

  ---

  **Table 1: Performance of gamble G for various stakes \(f\)**  
  | \(f\) | \(g(f)\) (per-round growth rate) | \(E[W_{10}]/W_0\) | \(P(W_{10} \geq 2W_0)\) | \(P(W_{10} < W_0)\) |  
  |-------|----------------------------------|-------------------|--------------------------|---------------------|  
  | 0.1   | 0.0150                           | 1.219             | 0.046                    | 0.367               |  
  | 0.2   | 0.0201                           | 1.480             | 0.167                    | 0.367               |  
  | 0.25  | 0.0188                           | 1.629             | **0.382**                | 0.367               |  
  | 0.3   | 0.0147                           | 1.791             | **0.382**                | 0.367               |  
  | 0.35  | 0.0077                           | 1.967             | **0.382**                | 0.367               |  
  | 0.4   | -0.0024                          | 2.159             | **0.382**                | 0.618               |  
  | 0.5   | -0.0340                          | 2.594             | 0.382                    | 0.618               |  
  | 1.0   | \(-\infty\)                      | 6.192             | 0.006                    | 0.994               |  

  **Notes:**  
  - \(g(f) = 0.6\ln(1+f) + 0.4\ln(1-f)\).  
  - \(P(W_{10} \geq 2W_0)\) is maximised at 0.382 for \(f \in [0.25, 0.5]\).  

  ---

  **Question:**  
  The board of a fictional endowment (created for this exam) has published a memo defending its 20% stake (\(f = 0.2\)) in gamble G, criticising a proposal to stake 40% (\(f = 0.4\)). Evaluate claims (i)–(iv) from their memo:  
  > *(i) The fund is a going concern with no terminal date. The question before us is therefore not what maximises our expected capital at some arbitrarily chosen future date, but what maximises the rate at which capital grows along the single path we shall actually travel; under G, that is a stake of 20 per cent.*  
  > *(ii) Let it be clear that this is not the logarithmic utility function in disguise. Our reason for the 20 per cent rule is a fact about how capital compounds through time, not a fact about our tastes. Any agent, however risk-loving, confronts the same arithmetic and is undone by it in the same way.*  
  > *(iii) It follows that staking more than 20 per cent is irrational whatever the fund's objectives. The board's proposal to stake 40 per cent, in order to raise the probability of doubling the endowment within ten years, therefore rests on a confusion: it buys a better chance at an arbitrary milestone at the price of a strictly worse growth rate, and a going concern has no business attending to milestones.*  
  > *(iv) Nor should the board take comfort from the observation that staking everything maximises expected capital. An expectation averages over histories of the fund, only one of which will ever be ours, and the fund does not get to average across its own alternatives. Expected capital is the wrong criterion because the process is non-ergodic; the growth rate is the right criterion because it is the one the fund actually faces.*  

  **For each claim:**  
  (a) Identify what is correct and why.  
  (b) Identify what is incorrect or misleading and why.  
  (c) State what would need to be true of the fund’s situation for the claim to hold.  
  Use Table 1 to support your analysis.  

  ---

  ### Model Answer (≈900 words)  
  **Overall Summary:**  
  The memo correctly identifies growth-rate maximisation (Kelly criterion) as optimal for infinite horizons but misapplies it to reject all alternatives. Critically, Table 1 shows that criteria diverge over finite horizons: \(f = 0.3\) dominates \(f = 0.4\) on *both* growth and the 10-year target, and loss probabilities exhibit step-function artefacts.  

  **Claim (i) Evaluation:**  
  (a) **Correct:** For a fund with no terminal date, maximising the asymptotic growth rate \(g(f)\) is rational. The stake \(f = 0.2\) maximises \(g(f)\) (0.0201), aligning with the Kelly criterion.  
  (b) **Incorrect:** Implies that *only* the growth rate matters. Table 1 reveals \(f = 0.4\) has \(g(f) = -0.0024\) (negative), but \(f = 0.3\) achieves the **same** maximum \(P(W_{10} \geq 2W_0) = 0.382\) while retaining a *positive* growth rate (0.0147). Thus, \(f = 0.3\) strictly dominates \(f = 0.4\) on both criteria the memo prioritises.  
  (c) **Condition for validity:** The fund must have an infinite horizon, no intermediate consumption, and care *only* about long-run compounding. The 10-year milestone must be irrelevant.  

  **Claim (ii) Evaluation:**  
  (a) **Correct:** Maximising \(g(f)\) relies on the mathematics of multiplicative growth, not utility. The optimal stake (0.2) is determined by probabilities and payoffs, not risk preferences.  
  (b) **Incorrect:** Asserts "any agent, however risk-loving, confronts the same arithmetic." This is false:  
    - A risk-loving fund (e.g., maximising expected wealth \(E[W_{10}]\)) should choose \(f = 1.0\) (highest \(E[W_{10}]/W_0 = 6.192\)).  
    - A fund needing to double in 10 years should choose \(f \in [0.25, 0.5]\), as all maximise \(P(W_{10} \geq 2W_0) = 0.382\).  
    Growth-rate maximisation *is* equivalent to maximising expected logarithmic utility. The memo conflates *computation* (arithmetic) with *rationale* (objective).  
  (c) **Condition for validity:** The fund must have log utility over terminal wealth. For non-log preferences (e.g., linear or S-shaped utility), stakes diverge from Kelly.  

  **Claim (iii) Evaluation:**  
  (a) **Correct:** Staking \(f > 0.2\) reduces \(g(f)\), and \(f = 0.4\) sacrifices growth for a milestone.  
  (b) **Incorrect:**  
    - **Dominance failure:** The memo attacks \(f = 0.4\) but ignores \(f = 0.3\), which offers identical \(P(W_{10} \geq 2W_0) = 0.382\) and *higher* \(g(f)\) (0.0147 > -0.0024). Thus, \(f = 0.4\) is irrational even for milestone-seekers.  
    - "Whatever the fund’s objectives" is false: If the fund must double in 10 years, \(f = 0.2\) (\(P = 0.167\)) is inferior to \(f = 0.3\) (\(P = 0.382\)).  
  (c) **Condition for validity:** The fund must prioritise *only* long-run growth and disregard all finite-horizon targets. The memo’s own focus on a 10-year milestone contradicts this.  

  **Claim (iv) Evaluation:**  
  (a) **Correct:** Expectation-maximisation (\(f = 1.0\)) risks ruin (\(P(W_{10} < W_0) = 0.994\)). The non-ergodicity argument (one realised path vs. ensemble average) validly criticises expectation for multiplicative processes.  
  (b) **Incorrect:**  
    - **Misleading contrast:** The memo pits growth rate against expectation but omits other criteria. Table 1 shows \(P(W_{10} < W_0)\) jumps from 0.367 to 0.618 at \(f = 0.4\), not because \(g(f)\) turns negative, but due to **discrete outcomes in finite rounds**. After 10 rounds, \(W_{10} = W_0(1+f)^k(1-f)^{10-k}\) for \(k\) wins. At \(f = 0.4\), 4 losses reduce wealth to \(W_0(1.4)^6(0.6)^4 \approx 0.98W_0\), crossing below \(W_0\). At \(f = 0.35\), 4 losses yield \(W_0(1.35)^6(0.65)^4 \approx 1.01W_0\). This threshold effect is finite-horizon-specific.  
    - The growth rate is not "the one the fund actually faces" if horizons are finite or payouts are required.  
  (c) **Condition for validity:** The process must be infinitely repeated with no withdrawals. For finite horizons, ergodicity arguments weaken, and expectation may align with objectives (e.g., if the fund liquidates after 10 years).  

  **Key Insights from Table 1:**  
  1. **Dominance of \(f = 0.3\):** It achieves the maximum target probability (0.382) while maintaining positive growth (0.0147), unlike \(f = 0.4\) (-0.0024). The memo’s rejection of \(f > 0.2\) ignores this.  
  2. **Step-function artefacts:** The jump in \(P(W_{10} < W_0)\) at \(f = 0.4\) occurs because 10 rounds create discrete wealth levels. At \(f = 0.4\), exactly 4 losses push wealth below \(W_0\), while at \(f = 0.35\), 4 losses leave wealth above \(W_0\). This is coincidental with \(g(f) \approx 0\) and vanishes in longer horizons.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  **General Principles:**  
  - **No marks** for: "Kelly maximises growth", "avoid ruin", or "compounding matters".  
  - **Deduct 1 mark** for: Equating negative growth with "likely loss in 10 rounds" (ignores step functions).  
  - **Deduct 2 marks** for: Claiming \(f = 0.4\) is uniquely bad for \(P(W_{10} < W_0)\) (identical to \(f = 0.5\)).  
  - **Deduct 2 marks** for: Suggesting "half-Kelly" as a compromise (at \(f = 0.1\), \(P(W_{10} \geq 2W_0) = 0.046\), near-zero).  

  **Per-Claim Allocation (6 marks per claim; 1 mark for structure):**  
  **Claim (i)**  
  - Correct: Identifies \(f = 0.2\) maximises \(g(f)\) for infinite horizons (1 mark).  
  - Incorrect: Fails to note \(f = 0.3\) dominates \(f = 0.4\) on growth *and* target probability (2 marks).  
  - Condition: Fund cares *only* about infinite-horizon growth (1 mark).  
  - Uses Table 1 to show \(g(f)\) and \(P(W_{10} \geq 2W_0)\) for \(f = 0.3\) vs. \(0.4\) (2 marks).  

  **Claim (ii)**  
  - Correct: Growth maximisation requires no utility assumption (1 mark).  
  - Incorrect: "Any agent" faces same arithmetic (e.g., \(f = 1.0\) optimal for linear utility) (2 marks).  
  - Condition: Fund has log utility/only cares about long-run growth (1 mark).  
  - Notes that growth maximisation *implies* log utility (1 mark).  
  - Contrasts with \(f = 1.0\) for linear utility (1 mark).  

  **Claim (iii)**  
  - Correct: \(f = 0.4\) sacrifices growth for target vs. \(f = 0.2\) (1 mark).  
  - Incorrect: Ignores \(f = 0.3\) dominating \(f = 0.4\) (2 marks).  
  - "Whatever objectives" false: \(f = 0.2\) suboptimal for 10-year target (1 mark).  
  - Condition: Fund disregards all finite-horizon targets (1 mark).  
  - Uses Table 1 to show identical \(P(W_{10} \geq 2W_0)\) at \(f = 0.3\) and \(0.4\) (1 mark).  

  **Claim (iv)**  
  - Correct: Non-ergodicity justifies criticising expectation-maximisation (1 mark).  
  - Incorrect: Attributes \(P(W_{10} < W_0)\) jump to growth rate sign (true cause: discrete outcomes) (2 marks).  
  - Growth rate not "faced" if finite horizons/payouts exist (1 mark).  
  - Condition: Infinite rounds, no withdrawals (1 mark).  
  - Explains step-function using 4-loss threshold at \(f = 0.4\) (1 mark).  

  **First-Class Distinctions (4+ marks from below):**  
  1. Identifies \(f = 0.3\) dominates \(f = 0.4\) on both memo’s criteria.  
  2. Explains discrete-outcome cause for \(P(W_{10} < W_0)\) jump (not growth rate sign).  
  3. Notes memo’s incoherence: Invokes infinite horizon but addresses 10-year milestone.  
  4. Observes that growth-rate maximisation *is* equivalent to log utility maximisation.  

  **Alternative Routes for Competent Scripts:**  
  A script arguing the memo’s framing is incoherent (infinite horizon vs. 10-year target) may earn full credit if it:  
  - Uses Table 1 to show optimal stakes differ for growth (\(f = 0.2\)) vs. 10-year target (\(f = 0.25–0.5\)) (4 marks).  
  - Explains why criteria diverge in finite horizons (3 marks).  
  - Critiques non-ergodicity claim for finite \(T = 10\) (2 marks).  
  - Avoids slogan-reliance and engages data (1 mark).  
  *(Such scripts may omit step-function analysis but must note \(f = 0.3\) dominance over \(f = 0.4\) to score ≥20/25.)*  

  ---  
  **END OF PAPER AND MARKING SCHEME**
