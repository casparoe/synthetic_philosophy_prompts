  First-class answers should include: 1) Exploiting the doubling probability plateau to show f=0.3 superiority, 2) Disaggregating the loss probability jump from growth rate sign change, 3) Critiquing the ergodicity claim for finite horizons, 4) Noting that growth-rate maximization itself implies a specific (logarithmic) preference.

