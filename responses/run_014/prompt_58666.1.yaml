prompt: |-
  Hi, I'm prepping my metaethics week on WEIRD psychology and whether cross-cultural disagreement threatens moral objectivity, and I want to use my co-teacher Maya as a foil because my students know her takes.

  Here is Maya's track record so far in our planning meetings, all about whether a given difference puts pressure on there being objective moral truths:

  1. US undergrads treat diverting a runaway trolley as okay but pushing a guy off a footbridge as terrible, while Ni-Vanuatu adults treat the two as roughly the same. Maya says no threat, that's just fragile gut reactions to weird thought experiments.

  2. Americans tend to say a CEO who harms the environment as a foreseen side effect did it intentionally, Japanese participants much less so. Maya says no threat, that's language and mindreading stuff, not morals.

  3. Big US-India gaps on stuff like eating a pet dog after it dies naturally or consensual adult sibling incest with contraception where nobody is harmed. Maya says no threat once you factor in different background beleifs about spiritual contamination and hidden harms.

  4. Sustained Swedish-Saudi disagreement on whether bribery and family favoritism in hiring is wrong, where both sides are given the same info about consequences and consent, talk it through, and still disagree year after year. Maya says yes, that one does put real pressure on objectivity.

  5. Americans in the 1980s vs Americans now on same-sex relationships. Maya says no threat, that's just moral learning over time.

  The new case I wanna spring on them comes from an anthro friend: two small fishing communities with similar tech and religion, call them North Cove and South Cove. Both agree suffering matters and fairness matters, and they agree on all the facts about risk and need. But North Cove says you are obligated to risk your own boat to try to rescue a drowning stranger even at significant cost to yourself and your kin, failing to do so is seriously wrong. South Cove says that kind of rescue is heroic but not required, what is actually required is prioritizing your kin nets even if strangers go hungry, failing that is seriously wrong. Fieldworkers had them discuss each others reasons for weeks, no factual confusion left, and neither side budged. Stable across generations.

  So predict for me: will Maya say the Cove split threatens objectivity if she wants to stay consistent? I think there are at least two different rules she could be running that both fit 1-5 but come apart here, like a principles-vs-applications rule versus a persists-after-full-information rule. Lay out the candidate rules, say what each predicts for the Coves, give me your best guess with reasons, and name one further test case that would separate the rules cleanly.

  Also tell me what would change your mind here, like which consideration or extra detail would flip your prediction or where your reasoning is most likely to fail.
reasoning: |-
  Okay, let me start by understanding the user's query. They're prepping a metaethics week on WEIRD psychology and cross-cultural disagreement's threat to moral objectivity. The user's co-teacher, Maya, has a track record of responses to different cases, and they want to predict how she'll respond to a new case about two fishing communities, North and South Cove.

  First, I need to analyze Maya's previous positions. Looking at the five cases:

  1. Trolley problem differences: Maya dismisses it as fragile gut reactions.
  2. Intentionality in CEO harm: She attributes it to language/mindreading.
  3. US-India differences on dog eating/sibling incest: She points to background beliefs about spiritual harm.
  4. Swedish-Saudi bribery disagreement: She sees this as a real threat to objectivity.
  5. Changing attitudes on same-sex relationships: Calls it moral learning.

  The key is identifying patterns. Cases 1-3 and 5 involve factors that Maya thinks don't touch core moral truths—either psychological quirks, linguistic issues, factual beliefs, or societal progress. Case 4 stands out because it's a persistent disagreement even after full information and discussion. That seems to be her threshold: when disagreement persists despite shared facts and reasoning.

  The new Cove case has both communities agreeing on facts (suffering, fairness, risk, need) but differing on obligations to strangers vs. kin. They discussed for weeks without resolution. This seems similar to the Swedish-Saudi case. So, following Maya's pattern, she should see this as a threat to objectivity.

  But the user suggests two possible rules Maya might be using: the "principles-vs-applications" rule or the "persists-after-full-information" rule. The first would say that if disagreements stem from applying shared principles differently, it's not a threat. The second focuses on whether disagreement remains after full information exchange. 

  In the Cove case, both communities share principles (suffering, fairness) but apply them differently. If Maya uses the principles rule, she might see no threat. If she uses the full-information rule, she's likely to see a threat. Looking at her past responses, especially Case 4 (Swedish-Saudi), she emphasized sustained disagreement after discussion. That supports the full-information rule. Case 3 had different background beliefs, which she dismissed as not threatening, so factual disagreements don't count. The Cove case has no factual confusion, so it should be a threat.

  A test case to differentiate the rules: imagine two societies agreeing that harm is wrong but one prohibits all alcohol due to unseen spiritual harm, while the other allows it. If Maya dismisses this due to background beliefs (using the principles rule), it aligns with her Case 3 response. If she sees it as a threat because they share principles but disagree post-discussion, she's using the full-information rule. Given her reaction to Case 3, she'd likely dismiss it due to differing factual beliefs about spiritual harm.

  Factors that could flip my prediction: If Maya considers kinship obligations as part of core moral principles, she might see the Cove disagreement as application. Or if she thinks the communities don't truly share principles. Also, if "fairness" is interpreted differently, it might not be a core principle disagreement. But based on the info, the full-information rule seems consistent.

  The user might also want to challenge students to think about when disagreements are fundamental versus derivative. The Cove case tests whether obligations to kin vs. strangers are core moral truths. Maya's stance could highlight the debate on whether morality requires specific duties or general values. The deeper need might be engaging students in critiquing objectivity using relatable examples, especially with a known foil like Maya.
answer: |-
  Based on Maya's track record and reasoning patterns, here's the breakdown:

  **Candidate Rules Fitting Maya's Past Responses:**

  1.  **The Persists-After-Full-Information Rule (PAFI):**
      *   **Description:** Disagreement threatens objectivity *only* if it persists *even after* parties share all relevant non-moral facts, understand each other's reasoning, and engage in sustained discussion, eliminating differences in factual belief, conceptual confusion, or misunderstanding of the situation.
      *   **Fit with Past Cases:**
          *   **1 (Trolley):** Dismissed. Disagreement stems from artificial thought experiments and immediate psychological reactions, not full consideration of facts/reasons.
          *   **2 (Intentionality):** Dismissed. Disagreement stems from linguistic/conceptual differences (meaning of "intentional") and mindreading heuristics, not core moral facts after full information.
          *   **3 (Dog/Incest):** Dismissed. Disagreement stems from different factual beliefs about contamination/hidden harm. Once *those* beliefs are factored in, the disagreement potentially dissolves or becomes non-moral.
          *   **4 (Bribery):** **Threat.** Disagreement persists *despite* shared facts about consequences/consent and sustained discussion.
          *   **5 (Same-Sex):** Dismissed. Framed as "learning," implying earlier views were based on factual/cultural errors or incomplete reasoning resolved over time.
      *   **Prediction for Cove Split:** **YES, Threat.** The case explicitly states both communities agree on *all* facts (risk, need, suffering matters, fairness matters) and engaged in weeks of discussion ("no factual confusion left") yet maintain their stable, opposing positions. This mirrors the Swedish-Saudi bribery case (#4) that Maya found threatening.

  2.  **The Shared-Fundamental-Principles Rule (SFP):**
      *   **Description:** Disagreement threatens objectivity *only* if it stems from a fundamental clash in core moral principles/values themselves. Disagreement arising from different applications of *shared* fundamental principles (due to context, weighting, or contingent beliefs) does not threaten objectivity.
      *   **Fit with Past Cases:**
          *   **1 (Trolley):** Dismissed. Implicitly shares principles (don't kill, save lives) but applies them differently in weird scenarios due to psychological mechanisms.
          *   **2 (Intentionality):** Dismissed. Shares principle (harming environment might be wrong) but disagreement is about a non-moral prerequisite (intentionality).
          *   **3 (Dog/Incest):** Dismissed. Implicitly shares principles (avoid harm, respect life/relationships) but applies them differently due to different factual beliefs about what *constitutes* harm (spiritual/hidden).
          *   **4 (Bribery):** **Threat.** Suggests a fundamental clash in principles: fairness/impersonality vs. familial duty/loyalty as core, potentially incommensurable, values.
          *   **5 (Same-Sex):** Dismissed. Shares principle (respect relationships, avoid harm) but earlier society misapplied it due to false factual beliefs about harm/nature.
      *   **Prediction for Cove Split:** **NO Threat (or less threat).** Both communities explicitly share the *same* fundamental principles: suffering matters and fairness matters. The disagreement is about the *application* and *weighting* of these shared principles in a specific context (obligation to kin vs. stranger in high-risk rescue). It's a conflict *within* their shared moral framework (how much does fairness to strangers outweigh the suffering risk to kin, and vice versa?), not a clash *between* fundamentally different frameworks.

  **Best Guess & Reasoning:**

  I predict Maya will say the **Cove split *does* threaten objectivity**, consistent with the **Persists-After-Full-Information (PAFI) Rule**.

  *   **Why PAFI over SFP?** Her reasoning in Case 4 (Swedish-Saudi bribery) is the clearest indicator. She didn't dismiss it based on a potential clash of principles *alone*; she emphasized the *persistence* of the disagreement *after* full discussion and shared facts ("talk it through, and still disagree year after year"). The Cove case meticulously mirrors this setup: agreement on facts/principles, sustained discussion, stable disagreement. Her dismissals of Cases 1-3 & 5 consistently focus on the *presence* of confounding factors (weird psych, language, factual beliefs, historical error) that prevent the disagreement from reflecting a fundamental clash *after full consideration*. The Cove case explicitly removes those confounders.
  *   **SFP's Weakness:** While she implicitly relies on shared principles in Cases 1-3 & 5, Case 4 shows she sees the PAFI condition as *sufficient* for threat, even if the disagreement *could* be framed as an application of potentially shared values (fairness vs. loyalty). The PAFI rule better explains why #4 is a clear "yes threat" for her while the others are "no threat."

  **Test Case to Separate the Rules:**

  *   **The Case:** Two societies, the Sun People and the Moon People, both fundamentally agree: "Minimizing suffering is the paramount moral duty." They have identical scientific knowledge. The Sun People believe causing *any* suffering to animals for food is absolutely forbidden. The Moon People believe causing suffering to animals for food is permissible *if* it significantly reduces overall suffering (e.g., by efficiently feeding more humans and preventing human starvation/hardship). They engage in years of dialogue, fully understanding each other's reasoning and sharing all facts, but neither side budges. The disagreement is stable.
  *   **Prediction under PAFI Rule:** **YES, Threat.** Disagreement persists after full information and discussion about the application of their *shared* fundamental principle.
  *   **Prediction under SFP Rule:** **NO Threat.** They share the *same* fundamental principle (minimize suffering). The disagreement is solely about its application to a specific context (animal suffering vs. potential human suffering) and potentially about factual weightings (efficiency calculations), not a clash of core values.

  **What Could Change My Mind / Weaknesses in Reasoning:**

  1.  **Maya's Interpretation of "Principles":** My prediction relies on Maya seeing "suffering matters" and "fairness matters" as sufficiently fundamental *shared* principles in the Cove case. If she argues that the *real* fundamental principle in conflict here is **"duty to kin is paramount" vs. "duty to strangers is paramount,"** and that these are *different* core principles, then she might see it as a threat *even under SFP*. However, the case presents *both* communities as valuing both suffering and fairness, suggesting the conflict is about balancing/prioritizing shared values, not rejecting one entirely. This is the biggest potential flaw in my SFP prediction.
  2.  **The "Moral Learning" Escape Hatch:** Could Maya potentially frame *one* Cove's position as "more evolved" or based on a subtler understanding of fairness/suffering, akin to the same-sex marriage case (#5)? This seems unlikely given the case description (stable across generations, both positions seem internally coherent and justified within their contexts). But if she latches onto this, she might dismiss it as "no threat."
  3.  **Weighting as Fundamental?** If Maya views the *relative weighting* of suffering of kin vs. suffering of strangers as *itself* a fundamental moral principle rather than an application, she might see the Cove case as a threat under SFP. However, her dismissal of Case 3 (where weightings of harm based on spiritual belief differed) suggests she sees weightings influenced by contingent beliefs as less fundamental.
  4.  **Scope of "Full Information":** Does "no factual confusion left" *really* mean *all* relevant non-moral facts? Could Maya argue there are *still* hidden factual differences about the nature of community bonds, risk perception, or the long-term consequences of each norm that haven't been resolved? The case strongly implies these *are* resolved, but if Maya questions that, she could dismiss it like Cases 2 or 3.

  **In summary:** Based on her emphasis on persistent disagreement *after* full information exchange in Case 4 and her consistent dismissal of cases where other factors (psych, language, specific beliefs) explain the disagreement, I predict Maya will see the Cove split as a threat to objectivity, applying the **Persists-After-Full-Information Rule**. The Shared-Fundamental-Principles Rule fits less well with her definitive "yes threat" response to Case 4. The "Animal Suffering vs. Human Suffering" test case cleanly separates the predictions of these two rules. My reasoning is most vulnerable if Maya interprets the core conflicting duties (kin vs. stranger) in the Cove case as *fundamentally* different principles rather than different weightings/applications of shared principles.
