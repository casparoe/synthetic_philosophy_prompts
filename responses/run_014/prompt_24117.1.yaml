prompt: |-
  Compare epistemic contextualism — the view that whether a subject knows that p depends on the conversational context in which the attribution is made — with pragmatic encroachment — the view that the practical stakes or interests at issue affect whether the subject knows that p. Both views predict that a subject may be credited with knowing that p in a low-stakes setting but not in a high-stakes one. Given this overlap, what exactly do the two views disagree about? In particular, is the difference between them substantive, or is it merely a difference about where the context-sensitivity is located — in the conversational context on the one hand, and in the practical situation on the other?
reasoning: |-
  Okay, the user is asking about the difference between epistemic contextualism and pragmatic encroachment. Both theories acknowledge that knowledge attributions can vary with stakes—saying someone knows in low stakes but not in high stakes. The user wants to know if the difference is just about where the context-sensitivity is located or if there's a deeper disagreement.

  First, I need to recall the core of each view. Contextualism says that the meaning of "knows" changes based on the conversational context. So the standards for what counts as knowledge shift depending on what the attributors are talking about. Pragmatic encroachment, though, argues that knowledge itself depends on practical factors. For them, stakes affect the epistemic status directly, not just the word's meaning.

  The user seems to understand the surface similarity but is probing whether the disagreement is substantive. They might be studying epistemology and need to clarify these concepts for a paper or exam. Maybe they're confused because both theories predict the same outcomes in cases like bank examples. Their deeper need could be understanding if these are competing theories or if they can coexist.

  I should highlight the key distinctions. Contextualism is about semantic context-sensitivity, like indexicals. Pragmatic encroachment is about the nature of knowledge itself—whether practical factors are part of truth conditions. That's a metaphysical difference, not just linguistic. Also, disagreement cases: contextualism allows for simultaneous truth of "S knows" and "S doesn't know" in different contexts, but pragmatic encroachment would say one must be false because stakes change the fact.

  Another point is the role of stakes. For contextualism, it's the attributor's context that matters. For pragmatic encroachment, it's the subject's practical situation. So location matters too. But the main clash is over semantics vs. metaphysics of knowledge.

  I should also mention how each view handles disagreement. Contextualism might use "non-indexical contextualism" to avoid relativism, but that's more complex. Pragmatic encroachment maintains invariantism but adds stakes to truth conditions. The user might need examples to grasp this.

  Finally, the user might be wondering if the theories are reconcilable. Some hybrid views exist, but generally, they're seen as rivals because one denies stakes affect truth (contextualism) while the other insists they do (pragmatic encroachment). Emphasizing the substantive disagreement in their core claims is key.
answer: |-
  The overlap in predictions between epistemic contextualism and pragmatic encroachment is significant, but the disagreement is **substantive**, not merely about the *location* of context-sensitivity. They offer fundamentally different explanations for *why* knowledge attributions shift with stakes, reflecting deep divides in epistemology, semantics, and the metaphysics of knowledge.

  Here's a breakdown of the key disagreements:

  1.  **The Nature of the Context-Sensitivity: Semantic vs. Epistemic/Metaphysical:**
      *   **Contextualism:** The context-sensitivity is **semantic**. The word "knows" (or the concept expressed by "S knows that p") is an *indexical* or *context-sensitive term*, like "tall" or "here." Its *semantic content* (the standard required for its application) changes depending on the *conversational context* of the *attributor*. The *fact* about the subject's epistemic position remains constant; what changes is *what is meant* by saying they "know."
      *   **Pragmatic Encroachment:** The context-sensitivity is **epistemic or metaphysical**. What changes is the *truth condition* of the knowledge attribution itself. Practical stakes directly affect *whether the subject actually meets the invariant epistemic standard* for knowledge (e.g., whether their evidence is sufficient, whether their belief is justified). The *meaning* of "knows" is fixed; the *facts* about knowledge change with the *subject's* practical situation.

  2.  **What Drives the Shift: Attributor vs. Subject:**
      *   **Contextualism:** Shifts are driven by features of the **attributor's context** – the interests, presuppositions, purposes, and standards salient *in the conversation where the knowledge claim is made or assessed*. The *subject's* stakes might be irrelevant if they aren't salient to the attributor's context.
      *   **Pragmatic Encroachment:** Shifts are driven by features of the **subject's situation** – the *practical costs of being wrong for the subject themself* in their specific circumstance. The attributor's conversational context doesn't *directly* change the truth value; it changes only insofar as it reflects or reveals the subject's actual stakes.

  3.  **The Role of Stakes in the Nature of Knowledge:**
      *   **Contextualism:** Denies that practical stakes are constitutive of knowledge itself. Stakes affect the *language* we use to describe a fixed epistemic relation. Knowledge remains a purely *epistemic* state concerning belief, truth, justification/reliability/safety (depending on the theory), invariant to practical concerns.
      *   **Pragmatic Encroachment:** Asserts that practical stakes are **partly constitutive** of knowledge. Whether a given epistemic position (evidence, reliability) *counts as knowledge* depends on what is practically *at stake* for the believer. Knowledge is not purely epistemic; it has an ineliminable *pragmatic* dimension. Stakes affect the *threshold* of justification/evidence/reliability required.

  4.  **Handling Disagreement:**
      *   **Contextualism:** Can explain apparent disagreements (e.g., low-stakes attributor says "S knows," high-stakes attributor says "S doesn't know") as *merely verbal*. Both speakers can be correct *relative to their own conversational contexts* because they express different propositions using the same word "knows." There is no single proposition "S knows p" that both are affirming and denying.
      *   **Pragmatic Encroachment:** Must treat such situations as cases where *one speaker is objectively wrong*. If the *subject's* stakes are high, then the proposition "S knows p" is *false*, regardless of what the low-stakes attributor says. If the subject's stakes are low, "S knows p" is *true*, and the high-stakes attributor is mistaken (though perhaps excusably so). The disagreement is substantive, not merely verbal.

  **Addressing the Core Question:**

  *   **Is it just about location?** No. While location (attributor's context vs. subject's situation) is *a* difference, it points to the deeper, substantive disagreement: **Does context-sensitivity reside in the meaning of the word "knows" (Contextualism), or does it reside in the nature of knowledge itself, such that practical stakes change the epistemic facts (Pragmatic Encroachment)?**
  *   **The Substantive Disagreement:** Contextualism preserves **Classical Invariantism** about the *epistemic standards* for knowledge (they are invariant; only the semantic standard expressed by "knows" changes) and denies that practical factors are relevant to whether the epistemic relation holds. Pragmatic Encroachment rejects Classical Invariantism, endorsing a form of **Subject-Sensitive Invariantism**, where the *invariant* epistemic standard itself incorporates practical factors, meaning the truth conditions for "S knows p" are fixed but *include* the subject's stakes.

  **In essence:** Contextualism sees the stakes effect as an illusion created by language, while Pragmatic Encroachment sees it as revealing a deep truth about the nature of knowledge. This disagreement about the fundamental relationship between epistemology and practical rationality is highly substantive.
