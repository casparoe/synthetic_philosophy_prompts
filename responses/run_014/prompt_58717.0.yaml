prompt: |-
  Okay so I'm a second year PhD student in cog sci working on motivation and irrationality and I keep running into something wierd that I don't have good language for. Act as a professional philosopher of psychology and think through this carefully, maybe brainstorm a few options before you land on anything.

  Like my flatmate insists she wants to apply for postdocs and even opens the portal every evening but always finds a reason to close it without submitting and gets irritated if I offer to sit with her while she does it, but she doesn't seem to actually beleive the excuses she gives. Same with me doomscrolling when I have a deadline tomorrow — I'm not really convinced my break is deserved, I'm more like arranging things so I don't have to notice the time, putting my laptop clock out of sight and stuff.

  I know the self-deception literature is nearby but this doesn't feel like straight-up believing something false. Is there an established concept for this active avoidance-plus-half-belief thing, and how is it different from its nearest neighbours? I don't just want a label, I want the carving — what counts, what doesn't, and where the edges are — and if there's no good term, coin one that separates it cleanly.
reasoning: |-
  Okay, I'm looking at this query from a second-year PhD student in cognitive science. They're studying motivation and irrationality and have encountered a specific phenomenon they can't quite label. They describe situations like their flatmate who intends to apply for postdocs but always finds excuses not to submit, and their own habit of doomscrolling before deadlines while hiding the clock—not truly believing their excuses but actively avoiding the task.

  The user mentions familiarity with self-deception literature but feels this isn't about believing false things. They want a precise conceptual "carving" of this phenomenon—what defines it, what differentiates it from related concepts, and possibly a new term if none exists. Their deeper need is for rigorous theoretical framing to advance their research, not just a superficial label.

  I need to approach this as a professional philosopher of psychology. First, I should map the conceptual neighborhood: akrasia (weakness of will), self-deception, procrastination, denial, motivational conflict, etc. Then analyze why this case is distinct. The key elements seem to be: active engagement in avoidance tactics, meta-awareness that the avoidance is irrational, and tactical diversion of attention rather than belief formation.

  For differentiation: Unlike classic self-deception, there's no false belief—the person knows they're avoiding. Unlike simple procrastination, there's active effort to structure the environment to enable avoidance. The core mechanism appears to be attentional redirection: deliberately manipulating stimuli to prevent conscious confrontation with the intention-action gap.

  Existing terms like "motivated ignorance" or "willful blindness" come close but don't fully capture the behavioral component. After considering options like "attentional bypass" or "deliberate disregard," I land on "Strategic Attention Diversion (SAD)" as a potential coinage. It emphasizes the tactical aspect (strategic), the cognitive mechanism (attention), and the purposeful avoidance (diversion).

  I'll structure the response by: 1) Diagnosing why adjacent concepts don't fit, 2) Defining the core features, 3) Proposing the new term with clear boundaries, 4) Providing usage examples. The goal is to give the user a precise conceptual tool that distinguishes this phenomenon from procrastination or self-deception while highlighting its active, attention-focused nature. This should support their research on motivation-irrationality interfaces.
answer: |-
  Based on your vivid descriptions and the need for precise conceptual carving, this phenomenon sits at a fascinating intersection of volition, cognition, and motivation. It's not quite captured by standard terms, requiring careful differentiation. Let's break it down systematically:

  **1. Why Adjacent Concepts Don't Fully Capture It:**
  *   **Akrasia (Weakness of Will):** While akrasia involves acting against one's better judgment, it often implies a simple failure of impulse control ("I know I shouldn't eat cake, but I do"). Your cases involve *active, tactical maneuvering* (closing portals, hiding clocks) to *avoid confronting* the akratic impulse itself. It's meta-akrasia – weakness of will actively *facilitated* and *hidden* from conscious engagement.
  *   **Standard Self-Deception:** Classical models (e.g., intentionally acquiring a false belief) don't fit. As you note, your flatmate isn't truly *believing* her excuses ("I'll do it tomorrow when I'm fresher"), nor are you believing scrolling is deserved. There's a meta-awareness that the justification is flimsy, yet it's *used instrumentally*. It's more about *suspending* belief assessment than forming a false one.
  *   **Procrastination:** This is too broad. Procrastination *encompasses* these behaviors but doesn't specify the *mechanism* you're highlighting – the active, tactical avoidance *within* the procrastination. Many procrastinate passively or via distraction; this is a specific, *agentive* form.
  *   **Denial:** Denial typically involves rejecting an uncomfortable *truth* or *reality* (e.g., "I don't have a problem"). Here, the uncomfortable reality (the need to act) *is* acknowledged abstractly ("I *want* to apply", "I *have* a deadline"). The denial is about *the immediacy of the required action* or *the validity of the avoidance itself* in the moment.
  *   **Motivated Ignorance / Strategic Ignorance:** These involve avoiding *knowledge acquisition* ("Don't tell me the results!"). Your cases involve avoiding *action initiation* or *confrontation with the intention-action gap*, not necessarily avoiding new information *about* the task. The clock is hidden not to avoid *knowing* the time, but to avoid the *normative pressure* the knowledge imposes.
  *   **Cognitive Dissonance Reduction:** While discomfort is present, the behavior isn't primarily aimed at *resolving* the dissonance by changing a belief ("This task isn't *that* important"). Instead, it's aimed at *bypassing* the dissonant state altogether by preventing its full conscious emergence ("If I don't see the clock, the contradiction between my intention and my action feels less acute").

  **2. Core Features of the Phenomenon:**
  Based on your cases, the defining characteristics are:
  1.  **Strong Conscious Intention:** A genuine, consciously held goal or commitment exists (apply for postdocs, meet deadline).
  2.  **Meta-Awareness of Impending Failure/Avoidance:** An implicit or explicit recognition that action is not being taken *now*, contrary to intention.
  3.  **Active, Tactical Avoidance:** Deliberate, often physical or environmental, maneuvers *aimed at*:
      *   Preventing the triggering of awareness of the intention-action gap.
      *   Blunting the normative force or aversiveness associated with that gap.
      *   Creating plausible (though not fully believed) justifications for inaction *in the moment*.
  4.  **Instrumental Use of "Half-Beliefs":** Generating or latching onto justifications ("I'm too tired", "Just 5 more minutes") not as sincerely held beliefs, but as *tools* to facilitate the avoidance maneuver and temporarily quell discomfort. There's a simultaneous awareness of their flimsiness *and* their utility.
  5.  **Preservation of Abstract Commitment:** The core intention ("I *will* apply", "I *must* do this work") remains largely intact *in principle*, while its *immediate enactment* is sabotaged. The commitment is compartmentalized.

  **3. Proposed Coinage: Strategic Attention Diversion (SAD) / Tactical Engagement Avoidance (TEA)**

  *   **Strategic Attention Diversion (SAD):**
      *   **Core Idea:** Consciously or semi-consciously directing attention *away* from cues that would force a confrontation with the aversive gap between intention and action, while simultaneously directing attention *towards* activities or justifications that provide temporary relief or plausible cover.
      *   **"Strategic":** Highlights the agentive, goal-directed (though subverting the main goal) nature of the maneuvering.
      *   **"Attention Diversion":** Pinpoints the core cognitive mechanism – manipulating the *focus* of awareness to prevent the problematic state (intention-action gap awareness) from becoming fully salient and affectively potent.
      *   **Carving the Joints:**
          *   *In:* Any behavior where an agent actively manipulates their environment or cognitive focus to *prevent* salient awareness of the conflict between a standing intention and current inaction (e.g., closing portal, hiding clock, actively seeking distractions when a cue arises).
          *   *Out:* Passive drifting into distraction, genuine belief in excuses, simple failure to act without active avoidance tactics, avoiding *knowledge* acquisition (motivated ignorance). Pure akrasia without the tactical layer is out.
          *   *Edge Case:* Repeated SAD can *lead* to genuine self-deception over time ("Maybe I don't *really* want that postdoc"), but the core mechanism remains distinct initially. SAD is the *tactic* enabling the prolonged state of inaction-with-intention.

  *   **Tactical Engagement Avoidance (TEA):**
      *   **Core Idea:** Actively deploying maneuvers to *disengage* from the psychological state (awareness + normative pressure) required to initiate action on a commitment.
      *   **"Tactical":** Similar to "Strategic," emphasizing the instrumental, maneuver-based nature.
      *   **"Engagement Avoidance":** Focuses on the target – avoiding *engagement* with the specific cognitive-affective state triggered by the intention-action gap (e.g., guilt, anxiety, effort anticipation).
      *   **Carving:** Very similar to SAD, perhaps emphasizing the *affective disengagement* aspect slightly more. "Engagement" captures the mental state being avoided.

  **Why SAD/TEA are Distinct and Useful:**

  1.  **Agentive Focus:** They center the *active role* of the individual in structuring their environment and attention to *enable* procrastination/akrasia, moving beyond passive failure.
  2.  **Mechanism-Specific:** They isolate the core mechanism: *attention/engagement manipulation* as a shield against the discomfort of the intention-action gap.
  3.  **Half-Belief Explained:** The "excuses" are not beliefs *per se*, but *tools* used within the diversion/avoidance tactic. Their flimsiness is recognized but tolerated because their function is *tactical relief*, not *truth*.
  4.  **Differentiates from Neighbors:** Clearly separates from passive procrastination (no active tactics), classic self-deception (sincere false belief), and pure akrasia (no meta-maneuvering).

  **Applying the Terms:**

  *   Your flatmate is engaging in **Strategic Attention Diversion (SAD)**. She opens the portal (acknowledging intention), feels the aversive pressure, and *actively closes it* (diversion tactic) while latching onto an excuse (instrumental half-belief) to blunt the discomfort and disengage. Her irritation at your offer stems from it forcing the awareness she's actively diverting.
  *   Your doomscrolling + clock hiding is **SAD/TEA**. You're actively removing the salient cue (time) that triggers the aversive gap awareness and engaging in an absorbing activity to divert attention *away* from the looming task and its associated discomfort. You know scrolling isn't "deserved"; it's instrumental avoidance.

  **Conclusion:**

  Your phenomenon is best conceptualized as an **agentive tactic for managing the cognitive-affective discomfort arising from the salient gap between a conscious intention and current inaction, primarily through the active diversion of attention or avoidance of engagement with the problematic state.** **Strategic Attention Diversion (SAD)** or **Tactical Engagement Avoidance (TEA)** provide precise labels that carve nature at this joint, differentiating it from procrastination (general category), akrasia (core failure), self-deception (belief formation), and motivated ignorance (knowledge avoidance). This framing highlights the dynamic, almost preemptive, self-sabotage involved – not just failing to act, but actively arranging the world and one's mind to make that failure momentarily tolerable. This conceptual precision should significantly aid your research into motivation and irrationality.
