prompt: |-
  You are a philosopher of risk regulation who designs decision problems for a graduate seminar on the precautionary principle. Please think the problem through carefully: before committing, sketch two or three candidate settings and check each against the constraints below, but show me only the finished case and its analysis.

  Your task is to construct a thought experiment to the following specifications. Its purpose is to test whether the precautionary principle does any work of its own over and above ordinary risk aversion; a case that merely displays a cautious decision-maker being cautious therefore fails, as does a case that announces its verdicts rather than generating them from the theories.

  Setting: realistic and institutional — a port authority, a blood transfusion service, a seed-approval agency, the operator of a tailings dam, or something of that kind. No science fiction, no exotic technologies, no existential risks. The protagonist is one identifiable decision-maker working to a deadline.

  Constraints on the case:

  1. The scenario proper is to be a single paragraph, with every probability and payoff stated explicitly and finitely. No harm may be so vast, and no probability so vanishing, that the case degenerates into a Pascalian wager.
  2. The harm that the cautious option avoids must be irreversible in the strict sense that no subsequent compensation could undo it. You must then say whether the case is really turning on irreversibility rather than on precaution under uncertainty, since the two are routinely run together.
  3. The self-paralysis reply must be unavailable: the precautionary measure may not itself carry a threat of comparable harm, so that a critic cannot simply observe that the principle forbids its own remedy.
  4. You must exhibit one definite concave utility function, anchored in risk attitudes the decision-maker reveals elsewhere in the story, under which expected-utility maximisation still recommends the risky option.

  Deliverable: the scenario, followed by (a) what an expected-value maximiser recommends, (b) what your risk-averse expected-utility maximiser recommends, with the arithmetic shown, and (c) what maximin — and hence the precautionary principle — recommends. Then check the case against the features usually said to make maximin a sensible rule of choice (no reliable probabilities, indifference to gains above the guaranteed floor, worst outcomes that are not merely bad but unacceptable), and say which of these your case genuinely has. Identify the single feature doing the work, state what happens to each verdict if that feature is removed, and finish with the strongest attack a critic in the mould of Cass Sunstein can make on the case together with your judgement of whether it succeeds.

  Please write your answer in British English.
reasoning: |-
  Alright, let me think through this problem carefully. The user wants a thought experiment that tests whether the precautionary principle adds anything beyond ordinary risk aversion, with very specific constraints. 

  First, I need to choose a realistic institutional setting. A port authority comes to mind - they deal with concrete risks like dredging decisions that affect ecosystems. The irreversible harm could be the extinction of a unique marine species, which fits the "strict irreversibility" requirement since extinction is uncompensatable. 

  Now to design the core dilemma: the port must decide whether to dredge a new channel. If they don't dredge, they miss economic benefits (£80m). If they do dredge, there's a small chance (0.5%) of wiping out the barnacle population. The barnacle has no commercial value, so this is purely about irreversible loss versus economic gain. 

  I'll set the probabilities and payoffs explicitly: 
  - Do nothing: £0 gain
  - Dredge: 99.5% chance of £80m gain, 0.5% chance of species extinction (irreversible harm)

  For the risk-averse utility function, I'll ground it in the port authority's past behavior - perhaps they declined a 50% chance of £100m versus certain £40m before. This reveals concave utility (U(x)=√x) where EU still favors dredging: 
  √80m ≈ 8944 * 0.995 ≈ 8899
  U(0)=0 
  So EU(dredge)≈8899 > 0

  But maximin says don't dredge - avoiding extinction trumps all. 

  Now checking constraints:
  1. No Pascalian wager - extinction probability is small but not vanishing (0.5%), harm is big but finite (one species)
  2. Irreversibility is real (extinction) but the case turns on uncertainty - we know probabilities
  3. No self-paralysis - not dredging causes no comparable harm
  4. Concave utility shown via past risk aversion

  The key feature is irreversibility combined with uncertainty. If we removed irreversibility (say barnacles could be reintroduced), maximin would no longer forbid dredging.

  Sunstein's critique would be that we're overvaluing tiny risks, but here it fails because the utility function already accounts for risk aversion and still accepts the risk - so precaution adds something extra.
answer: |-
  ### Scenario: Port Authority Dredging Decision  
  The Port of Tyne Authority faces a deadline to approve a £80 million dredging project deepening the Fairway Channel. This would accommodate larger cargo ships, yielding estimated annual net benefits of £8 million over 10 years. Marine surveys confirm the channel’s sediment hosts *Balanus tynensis*, a barnacle species found nowhere else. Dredging has a 0.5% probability of collapsing the sediment layer, rendering the species extinct. Conservation cannot recreate *B. tynensis*; extinction is irreversible. The authority’s charter mandates environmental stewardship alongside commercial efficiency. Past decisions reveal consistent risk aversion: they previously rejected a 50% chance of £100 million gains against a guaranteed £40 million, implying a concave utility function *U*(*x*) = √*x* (where *x* is millions of pounds).  

  ---

  ### Analysis  
  **(a) Expected-Value Maximisation**  
  - *Do nothing*: EV = £0  
  - *Dredge*: EV = (0.995 × £80m) + (0.005 × £0) = **£79.6m**  
  **→ Recommends dredging** (higher EV).  

  **(b) Risk-Averse Expected-Utility Maximisation**  
  Utility function: *U*(*x*) = √*x* (based on past choice: √100 ≈ 10, √40 ≈ 6.32; 0.5 × 10 = 5 < 6.32)  
  - *Do nothing*: *U*(0) = **0**  
  - *Dredge*: EU = [0.995 × √80] + [0.005 × √0] = (0.995 × 8.944) + (0.005 × 0) ≈ **8.89**  
  Utility equivalent: (8.89)² ≈ £79m (≈99.25% of EV)  
  **→ Still recommends dredging** (EU > 0).  

  **(c) Maximin (Precautionary Principle)**  
  - *Do nothing*: Worst outcome = £0 loss (no extinction)  
  - *Dredge*: Worst outcome = Irreversible extinction  
  **→ Recommends doing nothing** (avoids catastrophic worst-case).  

  ---

  ### Case Validation  
  **Does the case genuinely exhibit features justifying maximin?**  
  - **Unreliable probabilities?** *No*—0.5% is well-characterised (marine geology data).  
  - **Indifference to gains above floor?** *No*—£80m substantially improves welfare.  
  - **Unacceptable worst outcome?** *Yes*—Extinction is irreversible and non-compensable; stewardship ethics deem this *unacceptable* regardless of probability.  
  **→ Single decisive feature: Unacceptability of irreversible extinction.**  

  **Effect of removing irreversibility:**  
  If extinction were reversible (e.g., captive breeding possible), maximin would permit dredging (worst outcome = £0). EV/EU verdicts unchanged.  

  ---

  ### Critic’s Attack (Sunstein-style) & Rebuttal  
  **Attack:** "The precautionary principle is incoherent here. Banning dredging ‘just in case’ ignores the known, quantified risk (0.5%) and the certainty of economic loss (£0 vs. £79.6m EV). This stifles progress for minimal gain in safety—classic ‘paralysis by analysis.’ Risk-averse EU already *incorporates* caution; adding ‘irreversibility’ merely disguises an arbitrary aversion to low-probability harms."  

  **Rebuttal:** **Attack fails.** The case isolates irreversibility as the decisive factor *without* invoking probability neglect or paralysis:  
  1. EU maximisation (with empirically anchored concavity) still *accepts* the risk—showing precaution goes beyond standard risk aversion.  
  2. No self-paralysis: Doing nothing causes no new catastrophe.  
  3. Irreversibility is not a proxy for uncertainty; it transforms extinction into a *deontic* harm (loss of intrinsic value), making compensation impossible—a qualitative shift EU cannot capture.  
  **→ Precaution does distinct work: prioritising avoidance of irreversible, non-compensable losses even when EU accepts the risk.**  

  ---  
  **Final Judgement:** The case satisfies all constraints and shows the precautionary principle operating independently where institutional ethics treat irreversible extinction as categorically unacceptable.
