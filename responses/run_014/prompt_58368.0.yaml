  So me and my girlfriend keep going in circles on this whole is-the-world-getting-less-violent thing and I want to figure out where we actually disagree.

  I'm like at 0.65 that yeah, in the morally relevant sense the world is truely becoming less violent, she's at like 0.2 that its basically a definitional trick. Can you give me your own credence on that same claim, but don't just give me a number — break it down for me?

  Like something like: a) whats the chance that deaths from war and murder per person are actually on a long-term decline, b) whether per-capita is even the right math vs total amount of suffering, c) whether we should count the newer expanded stuff — domestic violence that used to be hidden, factory-farmed animals, chronic humiliation online, that kind of thing — as violence for this purpose, and d) whether there is even a fact of the matter here or if its just how you define violence.

  Give a rough number for each piece with a sentence on why, show how they add up to your overall number, and tell me which piece explains most of the gap between 0.65 and 0.2. And what arguement or evidence would move your overall number the most? You don't need exact datasets, just rough sense is fine.
