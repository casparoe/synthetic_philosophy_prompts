answer: |-
  Here's my breakdown of the claim *"the world is becoming less violent in a morally relevant sense"*, structured as you requested. My **overall credence is ~0.25 (25%)**, leaning closer to your girlfriend's view. I'll explain step-by-step, assign rough probabilities to each component, show how they compound, identify the key gap, and note what evidence could move my needle most.

  ---

  ### a) **Deaths from war/murder per capita are on a long-term decline?**  
  *Credence: 70%*  
  *Why:* Data (e.g., Pinker's *Better Angels*, UCDP, WHO homicide stats) show strong downward trends in battle deaths, genocide, and homicide *per capita* over centuries. Even with recent wars (Ukraine, Gaza), absolute numbers remain low relative to 20th-century peaks or pre-modern eras. However, data quality pre-1950 is patchy, and reversals (like post-2010 conflicts) introduce uncertainty.  

  ### b) **Is per-capita the right metric (vs. total suffering)?**  
  *Credence: 35% that per-capita is sufficient*  
  *Why:* Morally, *total suffering* matters. Global population has exploded (1.8B in 1910 → 8B today). Even with lower *rates*, sheer numbers could mean more victims (e.g., more people experiencing trauma from violence). If war deaths fall 50% per capita but population triples, total suffering might still rise. Per-capita tracks *individual risk* but obscures aggregate harm—which feels morally central.  

  ### c) **Should we count "expanded" violence (hidden abuse, animals, digital harm)?**  
  *Credence: 20% that including these *doesn't* reverse the trend*  
  *Why:*  
  - **Domestic/gender violence**: Historically underreported; modern data (WHO) suggests 1 in 3 women experience physical/sexual violence. Better reporting ≠ actual decline.  
  - **Animal suffering**: Industrial farming now kills 80+ billion land animals yearly. Pre-1900, numbers were trivial in comparison.  
  - **Digital/structural harm**: Cyberbullying, chronic stress from inequality, or psychological trauma from conflict are pervasive now but unquantified historically.  
  Including these likely *inverts* the "less violent" narrative. Factory farming alone may cause more daily suffering than all historical wars combined.  

  ### d) **Is there an objective fact—or just definitional choices?**  
  *Credence: 85% that there's a fact beyond semantics*  
  *Why:* We *can* measure physical harm, death, and psychological trauma objectively (e.g., via biomarkers, surveys). But "morally relevant violence" *requires* subjective choices (e.g., is a factory-farmed chicken's suffering equal to a human's?). The core disagreement is which harms "count," not whether data exists.  

  ---

  ### **How these compound to my overall credence (0.25):**  
  - Start with (a): **70%** chance direct violence per capita is falling.  
  - Adjust for (b): Total suffering is the real moral metric → apply a **0.5x multiplier** (since total harm may not fall even if rates do).  
  - Adjust for (c): Including expanded violence likely negates decline → apply a **0.7x multiplier** (lower confidence trend holds).  
  - (d) doesn’t directly adjust probability but constrains the debate: **85%** certainty we *can* resolve this with agreed definitions.  
  **Calculation:**  
  `0.70 (a) × 0.50 (b adjustment) × 0.70 (c adjustment) = 0.245 → ~25%`  

  ### **Biggest gap between your 0.65 and her 0.2?**  
  **Component (c)**—the "expanded violence" category. You might weight war/homicide heavily, while she (and I) sees animal suffering, structural oppression, and revealed domestic abuse as morally central. If you exclude these, violence *is* declining. If included, it’s likely rising. This explains >60% of the gap.  

  ### **Evidence that would move my overall number most:**  
  **Reliable longitudinal data on non-lethal suffering**—especially for animals and domestic violence. For example:  
  - If global surveys proved physical/sexual abuse rates fell 50+% since 1900 (controlling for reporting bias) → my (c) credence jumps to 50%, raising overall to ~40%.  
  - If we agreed animal suffering doesn’t count → my overall leaps to ~65%.  
  - Conversely, proof that industrial farming causes more daily pain than all historical wars combined → drops me to <10%.  

  ---

  ### **Why this matters**  
  Your disagreement isn’t about data—it’s about **moral scope**. You (0.65) likely emphasize reduced *lethal* violence per person. She (0.2) likely sees violence as *any unjust suffering*, including newly visible or systemic forms. Bridging this requires agreeing on definitions *first*. My number is low because I default to an expansive view: if we ignore factory farms or online trauma, we’re missing most of the violence that defines modern life.
