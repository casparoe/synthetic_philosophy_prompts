  2.  Regarding the headset muting the self-model, he'd argue it disrupts the interface *to* the self/soul but doesn't negate the existence of the immaterial soul itself, which remains the true agent.
  3.  He might concede the "user illusion" concept effectively describes the *phenomenal experience* of self as constructed, but maintain his argument proves there must be a substantial, non-physical subject *having* that experience or illusion.
  4.  He would absolutely double down that the Floating Man's irreducible sense of existence, even without sensory input *or* a functional self-model, definitively points to a non-physical, self-aware essence.
  5.  While intrigued by neuroscience, he'd ultimately reject the user illusion claim as undermining the self, viewing these findings as revealing bodily instruments the soul uses, not disproving the soul itself.
