  ## The Weighted Choice

  We tally each soul's private, pulsing gain,  
  The scale each utters for the common state.  
  **Choose what all prefer, when all prefer the same.**  
  Can disparate measures forge a single aim?  
  The social function seeks to arbitrate,  
  We tally each soul's private, pulsing gain.  

  Must options vanish, leaving just the pair?  
  Their standing holds though rivals dissipate.  
  **Ignore alternatives that won't be chosen.**  

  The social verdict, strained against the grain,  
  Seeks weights to balance every person's weight.  
  We tally each soul's private, pulsing gain.  

  But shifting weights betray the structure's frame –  
  If choice depends on *which* alternatives wait,  
  **Ignore alternatives that won't be chosen.**  

  The axioms compel, a binding chain:  
  The *form* is fixed, a sum of private fate.  
  We tally each soul's private, pulsing gain.  

  **Choose what all prefer, when all prefer the same.**  
  **Ignore alternatives that won't be chosen.**  
  The weights combine, a fixed design, constrained,  
  *Their values* free, a separate ethical gate –  
  The theorem shapes the scale, but leaves unnamed  
  Which soul counts more until impartial hand  
  Declares the weights are equal, just, and planned.  

  ---

  **How the poem delivers on your request:**

  1.  **Refrains as Axioms:**
      *   "Choose what all prefer, when all prefer the same." (Pareto Principle)
      *   "Ignore alternatives that won't be chosen." (Independence of Irrelevant Alternatives - IIA)
      *   These repeat unchanged, hammering home their constraining power.

  2.  **Form Mirrors Conclusion:**
      *   The relentless, unchanging recurrence of the refrains embodies the theorem's core message: satisfying these axioms *forces* the social welfare function into a specific, rigid form (the weighted sum with fixed weights). The repetition *feels* inevitable and inescapable, just like the conclusion.

  3.  **Journey to Realization:**
      *   **T1:** Introduces individual utilities ("private, pulsing gain") and the social function's task ("arbitrate"), setting up the aggregation problem with the first refrain.
      *   **T2:** Directly references IIA ("Must options vanish..."), showing its operational role.
      *   **T3 & T4:** Introduce the concept of weights ("seeks weights to balance every person's weight") and the crucial point that weights cannot shift based on alternatives ("shifting weights betray... If choice depends on *which* alternatives wait"). This leads to the central realization: "The axioms compel... The *form* is fixed, a sum of private fate."
      *   **T5:** Repeats the axioms forcefully, emphasizing their dominance.

  4.  **The "In-The-Weeds" Point:**
      *   The penultimate *new* line before the couplet is: "The theorem shapes the scale, but leaves unnamed / Which soul counts more..." This explicitly states that the theorem pins down the *structure* (weighted sum, fixed weights) but not the *values* of the weights.

  5.  **Impartiality as Separate Step:**
      *   The closing couplet resolves the unnamed weights: "until impartial hand / Declares the weights are equal, just, and planned." This clearly separates the mathematical theorem from the ethical imposition of equality.

  6.  **Accuracy for Decision Theorists:**
      *   Correctly identifies the axioms (Pareto, IIA).
      *   Correctly states the conclusion: fixed-weight linear aggregation ("sum of private fate", "weights combine, a fixed design").
      *   Correctly distinguishes the theorem's scope (shape/form of weights) from the separate step needed to set weight values (impartiality/equality).

  7.  **Accessibility & Poetic Merit:**
      *   The axioms are phrased plainly.
      *   Abstract concepts ("utilities," "social function," "weights," "aggregation") are rendered in concrete, rhythmic language ("private, pulsing gain," "arbitrate," "scale," "combine").
      *   Strong villanelle structure (ABA rhyme scheme in tercets, AA in couplet, strict refrain pattern).
      *   Evocative language: "pulsing gain," "strain against the grain," "binding chain," "impartial hand."
      *   The poem builds tension through the tercets and resolves it satisfyingly in the couplet.

  The poem uses the villanelle's inherent cyclical insistence to make the *feel* of Harsanyi's inevitability palpable, while carefully navigating the technical nuances you specified.
