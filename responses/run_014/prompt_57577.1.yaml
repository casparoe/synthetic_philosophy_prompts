answer: |-
  ### Revised In-Class Game: "The Token Contest"

  **Core Objective:** Show that the social outcome (tokens claimed) is fixed by structural constraints (number of tokens), not individual psychologies, even though individuals' actions fully determine *who* wins. This creates a gap between (a) "social facts are nothing over and above individuals" (which holds) and (b) "individual-level facts alone explain social outcomes" (which fails because structural constraints are indispensable).

  **Key Improvements to Your Skeleton:**
  - **Fixed team/imitator assignment:** Replaced slips with pre-assigned roles (no passing cards mid-game). Uses colored paper clips for stealthy, instant role changes.
  - **Player ratio:** 12 tokens for 22 players is perfect—creates scarcity (over 45% lose) without chaos.
  - **Bid transparency:** Reveal only the *cutoff bid* (13th-highest) after each round—not full bids. This preserves uncertainty for imitators (round 3) and avoids anchoring.
  - **Structural objection addressed:** Added "null tokens" in round 4 to show constraints aren't rigged; they emerge from rules.
  - **Reverse-engineering defense:** Embraced coordination attempts (they highlight structural power).
  - **Debrief sequence:** Questions build from observation to theory, avoiding jargon until the end.

  ---

  ### **Full Rules & Materials**
  **Materials:**
  - **Index cards:** 120 total (22 players × 5 rounds + 10 extras).
  - **Poker chips:** 20 total (12 red for tokens, 8 blue as "null tokens" for round 4).
  - **Paper clips:** 14 red (team players), 14 green (imitators). *Distribute during setup.*
  - **Bowl:** For tokens.
  - **Whiteboard:** Track per-round data (table below).
  - **Markers & timer.**

  **Setup (5 min):**
  1. Assign roles covertly:  
     - Hand 7 random players a **red paper clip** ("team player").  
     - Hand 7 *different* players a **green paper clip** ("imitator").  
     - *Tell everyone:* "Paper clips mark special roles. Don’t reveal your role. Roles activate only when I say."  
  2. Place 12 red tokens in the bowl.  
  3. Draw table on whiteboard:  

  | Round | Total Effort | Tokens Claimed | Cutoff Bid | Notes               |  
  |-------|-------------|----------------|-----------|---------------------|  
  | 1     |             | 12             |           | Baseline            |  
  | 2     |             | 12             |           | Team players active|  
  | 3     |             | 12             |           | Imitators active   |  
  | 4     |             | 12             |           | Cost halved + null tokens |  
  | 5     |             | 16             |           | Extra tokens       |  

  ---

  ### **Round-by-Round Timeline (Total: 55 min)**
  **Round 1: Baseline (10 min)**  
  - **Rules:** "Bid 0–10. Effort costs 1 point. If you win a token, gain 5 points. Highest 12 bids win; ties random. Play for your own points."  
  - **Process:**  
    1. Players write bids secretly on index cards (1 min).  
    2. Collect cards. Sort bids high to low. Declare cutoff bid (13th-highest) and winning bids.  
    3. Calculate **total effort** (sum all bids), fill into table.  
    4. Players write *one sentence* on new card: **"Why did total effort end up at [total]?"** (2 min).  
    5. Collect and read 3–4 explanations aloud. *Do not comment.*  

  **Round 2: Team Players Active (8 min)**  
  - **Activate roles:** "Red paper clip players: Your payoff is now the *sum of your team’s points*. Teams are you and two neighbors (left/right)." *(No slips—paper clips pre-assigned.)*  
  - **Rules:** Same as round 1.  
  - **Process:** Same as round 1.  

  **Round 3: Imitators Active (8 min)**  
  - **Activate roles:** "Green paper clip players: Bid **1 higher than your prediction of the median bid**. Others play normally."  
  - **Process:** Same, but **do not reveal median bid** (imitators must guess).  

  **Round 4: Policy Change + Null Tokens (8 min)**  
  - **Rules:** "Effort now costs **0.5 points** (half cost)." *Then add 8 blue "null tokens" to the bowl without comment.*  
  - **Key twist:** Null tokens look identical but have **no value** (0 points). Still award to top 12 bidders.  
  - **Process:**  
    - After bids, award tokens to top 12. Then reveal: "Blue tokens were worth 0 points. Did you notice them?"  
    - *This shows constraints are structural (rules + tokens), not arbitrary.*  

  **Round 5: Extra Tokens (8 min)**  
  - **Rules:** Silently add 4 red tokens (now 16 total). No other changes.  
  - **Process:** Award tokens to top 16 bidders. Highlight jump to 16 tokens claimed.  

  ---

  ### **Debrief Questions (25 min)**  
  **Order matters—start concrete, end abstract:**  
  1. **Observe outcomes:**  
     - "Look at the whiteboard. What stayed the same in rounds 1–4? What changed in round 5?"  
     - *Goal:* Notice tokens claimed fixed at 12 until structure changed.  

  2. **Analyze explanations:**  
     - "We heard explanations like '[effort] was high due to competition' or 'people copied others.' Did *any* explanation mention the number 12? Why not?"  
     - *Goal:* Expose that players focused on psychologies, not constraints.  

  3. **Probe role impacts:**  
     - "Team players aimed to help their team, imitators tried to outguess others. Did these changes alter *how many tokens were claimed*? Why?"  
     - *Goal:* Show psychologies affect *distribution* (who wins), not *outcome* (12 tokens).  

  4. **Test cost changes:**  
     - "When effort cost halved in round 4, bids likely rose. But did that change tokens claimed? What about the null tokens?"  
     - *Goal:* Show cost affects behavior, but outcome is fixed by tokens + rules.  

  5. **Confront structure:**  
     - "In round 5, tokens claimed jumped to 16. What caused this? Could individual psychologies alone explain it?"  
     - *Goal:* Force admission that structural change (token count) drove outcome.  

  6. **Bridge to theory:**  
     - "You all agree social outcomes come from individuals (e.g., bids). But did individual facts explain *why exactly 12 tokens were claimed*? What did?"  
     - *Then introduce terms:* "This is the gap between **methodological individualism** (social facts supervene on individuals) and explanation. The constraint (12 tokens) is **multiply realizable**—it emerges from *any* psychology. Ignoring this is **holism**."  

  7. **Limit of the game:**  
     - "What *can’t* this game show? It assumes fixed rules/tokens. Real-world structures (e.g., laws, markets) are *dynamic*—shaped by past actions. But once they exist, they constrain outcomes independently of current psychologies."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Sharp student organizes low bids in round 2 (teams):**  
     - *Why it’s great:* If someone whispers "bid 0 to save costs," let it happen. When bids are low, the cutoff bid drops (e.g., top 12 win with bid 1).  
     - *Debrief pivot:* "Did coordination change the tokens claimed? No—it only changed how *cheaply* we hit 12 tokens. The structure forced 12 winners regardless."  

  2. **Imitators (round 3) cause bid inflation/death spiral:**  
     - *Likely outcome:* Imitators overbid, lifting the median. Total effort rises, but tokens claimed unchanged.  
     - *Handling:* If bids explode (e.g., median=9), note: "Psychologies changed effort, not the outcome."  

  3. **Spotting null tokens (round 4):**  
     - *If caught:* "Yes, I added tokens, but they had no value. Why did you still compete? Because the rules said 'win tokens,' not 'maximize points.'"  

  4. **Time crunch:**  
     - **Cut bid/explanation time:** Use 30-second bids, 60-second explanations.  
     - **Skip reading all explanations:** Read 2 per round; collect and skim the rest.  

  5. **Philosophy students dominate:**  
     - **Assign them roles:** Make them imitators (round 3) to constrain over-theorizing.  

  ---

  ### **What This Game Cannot Show**  
  **The endogeneity of structures.** Your game (like Schelling) shows emergence of *patterns* from individuals, but here the *constraint* (token count) is **exogenous** (set by you). In real social life, structures (e.g., laws, institutions) are often *endogenous*—shaped by historical individual actions. This game cannot model how structures themselves emerge or evolve. You’ll need to state this explicitly:  
  > *"Structures start as individual actions but, once institutionalized, become autonomous constraints. For example, a law (initially created by legislators) later binds everyone, regardless of their psychology. This game isolates the constraining power of structures but can’t show their origins."*  

  This flaw is unavoidable without pre-game readings (e.g., Searle on institutional facts). Use it to motivate future classes.  

  ---  
  **Final Note:** This forces students to *experience* the gap. By round 5, they’ll see that citing individual bids feels inadequate to explain "why 12 tokens?"—primes them for your debrief. Run it straight through; chaos is data!
