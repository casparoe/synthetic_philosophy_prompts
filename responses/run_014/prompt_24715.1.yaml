prompt: |-
  I work in software engineering, not philosophy, so I'll state the use case directly: I'm building a decision-support module for an engineering team. Given a pending decision (ship or hold a feature, buy or build a component, run the migration this quarter or next) and a candidate information-gathering action (an A/B test, a user survey, a load test, a vendor quote), the module should estimate the value of the information and compare it against the cost of acquiring it, so we can decide whether to run the test before we make the call. I keep running into a result usually attributed to I. J. Good — that under standard expected utility the expected value of free information is never negative — and before I read further I want the specification: what must a theory of the value of information deliver to count as adequate for backing a decision rule of the form "acquire this information at cost c only if its value exceeds c"?

  Write the desiderata list. For each requirement, give the case or consideration that motivates it, and mark which are non-negotiable (a theory that fails one is simply wrong) and which are preferences of a particular modeling camp. Below are the requirements I expect to see in the neighborhood; add the ones I haven't listed, and drop any of these that are actually prejudices rather than genuine desiderata, saying so.

  - It must derive the non-negativity result rather than assume it, and must say exactly which assumptions do the work — whether the agent is free to ignore the signal, whether preferences are fixed, whether processing the information is costless — because I need to know which of those my team actually satisfies.
  - It must separate value ex ante, before the result is seen, from value ex post, after it; the module reports a number before the test runs, and "the test came back bad" must not get logged as "information can have negative value."
  - It must handle information that changes what the agent wants, not just what the agent believes — a trial that reveals we actually hate the new UI — since the non-negativity result is usually stated for belief-only updates.
  - It must handle information about the agent's own preferences, and say whether self-discovery is the same channel as preference change in general or a different one.
  - It must treat value as defined relative to a decision problem rather than as an intrinsic property of the information, and say what happens when the same measurement is worth more to one decision than to another.
  - It must accommodate the value of information about information — the option value of learning now partly because it tells us whether to buy more information later — and say whether the non-negativity result survives that recursion.
  - It must handle information whose acquisition has side effects on what is being measured (the survey changes the users, the experiment changes the system), i.e., information that is not a passive observation.
  - It must be consistent with the fact that people and teams actually avoid information — skip the doctor's appointment, don't open the survey results — without either declaring the avoiders irrational or quietly giving up the non-negativity result; it should say where the negative-value cases live: cost, preference change, disutility of knowing, or a violation of one of the theorem's assumptions.

  Then two closing items. First, identify any subset of the requirements you think is jointly unsatisfiable — in particular, whether "preserve the non-negativity theorem as a core result" and "treat rational information avoidance as a first-class case" can both be met, and if so at the price of which assumption. That part matters most to me. Second, a brief scorecard: how do vanilla expected-utility decision theory, models that let information change preferences, and models of costly attention or information avoidance each do against the list? Keep the scorecard short; the requirements and the joint-satisfiability question are the point.
reasoning: |-
  We are building a decision-support module for an engineering team. The goal is to estimate the value of a piece of information (like an A/B test, user survey, etc.) and compare it to the cost of acquiring that information. The core challenge is to reconcile the non-negativity of the expected value of free information (as per I.J. Good) with real-world cases where information might be avoided (like skipping a doctor's appointment). We need a set of desiderata for a theory of the value of information that can back a decision rule of the form: "acquire this information at cost c only if its value exceeds c".

  We have a list of candidate requirements. Let's go through each one, clarify, and then add any missing ones and remove any that are not genuine.

  ### Desiderata List:

  1. **It must derive the non-negativity result rather than assume it, and must say exactly which assumptions do the work — whether the agent is free to ignore the signal, whether preferences are fixed, whether processing the information is costless — because I need to know which of those my team actually satisfies.**
     - **Motivation**: The non-negativity result is foundational, but in practice, we must know the conditions under which it holds. For example, if processing information is costly, then even if the information is free, the overall value might be negative. The theory should make explicit the assumptions (like the ability to ignore the signal, fixed preferences, zero processing cost) so that we can check if they hold in our context.
     - **Non-negotiable**: Yes. Without deriving the result, we cannot trust the theory. Also, knowing the critical assumptions is essential for application.

  2. **It must separate value ex ante (before the result is seen) from value ex post (after it is seen); the module reports a number before the test runs, and "the test came back bad" must not get logged as "information can have negative value."**
     - **Motivation**: The decision to acquire information is made ex ante. The value of information is the expected improvement in decision making from having the information, taken before the information is obtained. Ex post, we might regret having acquired the information (e.g., if the test result is bad and we would have been better off not knowing and taking the default action). But the ex ante value must account for the distribution of possible outcomes and the ability to act on them. The module must report the ex ante value.
     - **Non-negotiable**: Yes. Confusing ex ante and ex post would lead to incorrect valuation and possibly to avoiding tests that are actually beneficial on average.

  3. **It must handle information that changes what the agent wants, not just what the agent believes — a trial that reveals we actually hate the new UI — since the non-negativity result is usually stated for belief-only updates.**
     - **Motivation**: In many cases, gathering information can change preferences (e.g., trying a new food might change your taste). In software, a user survey might reveal that users hate a feature we thought was good, and this might change our goals (e.g., we now want to remove it). The standard non-negativity result assumes fixed preferences. The theory must account for preference changes.
     - **Non-negotiable**: No, but highly desirable. The standard theory (expected utility with fixed preferences) does not handle this. But in practice, this is important. However, note that if preferences change, the notion of "value" becomes tricky because the utility function is changing.

  4. **It must handle information about the agent's own preferences, and say whether self-discovery is the same channel as preference change in general or a different one.**
     - **Motivation**: Sometimes, we run tests to learn about our own preferences (e.g., A/B testing to see which design we prefer). This is related to preference change but might be a distinct mechanism (e.g., uncovering pre-existing but unknown preferences vs. forming new ones). The theory should clarify this.
     - **Non-negotiable**: No, but important. This is a special case of preference change, but might be treated separately.

  5. **It must treat value as defined relative to a decision problem rather than as an intrinsic property of the information, and say what happens when the same measurement is worth more to one decision than to another.**
     - **Motivation**: The value of information depends on the decision at hand. For example, a load test might be very valuable for a deployment decision but irrelevant for a UI design decision. The theory must be contextual to the decision problem.
     - **Non-negotiable**: Yes. This is a core tenet of decision theory.

  6. **It must accommodate the value of information about information — the option value of learning now partly because it tells us whether to buy more information later — and say whether the non-negativity result survives that recursion.**
     - **Motivation**: In sequential decision making, information now can inform whether we need to gather more information later. For example, a preliminary A/B test might show that the feature is clearly good (so we ship) or inconclusive (so we run a larger test). The theory should account for this option value.
     - **Non-negotiable**: Highly desirable. This is common in practice.

  7. **It must handle information whose acquisition has side effects on what is being measured (the survey changes the users, the experiment changes the system), i.e., information that is not a passive observation.**
     - **Motivation**: In many engineering contexts, running a test can alter the system or the users (e.g., a survey might make users aware of a feature and change their behavior). The theory must account for these measurement effects.
     - **Non-negotiabl**e: Yes, because in practice many information-gathering actions are not passive.

  8. **It must be consistent with the fact that people and teams actually avoid information — skip the doctor's appointment, don't open the survey results — without either declaring the avoiders irrational or quietly giving up the non-negativity result; it should say where the negative-value cases live: cost, preference change, disutility of knowing, or a violation of one of the theorem's assumptions.**
     - **Motivation**: Rational information avoidance is a real phenomenon. The theory must explain it without contradicting the non-negativity of free information. Potential reasons: costs (including non-monetary, like anxiety), preference changes (e.g., learning bad news might cause disutility beyond the decision consequences), or violations of the assumptions (like the freedom to ignore the signal).
     - **Non-negotiable**: Yes. We must account for observed behavior.

  ### Additional Desiderata:

  We might add:

  9. **It must account for the cost of processing and acting on the information.**
     - **Motivation**: Even if the information is free, the effort to understand it and change the decision accordingly might be costly. This is distinct from the cost of acquisition.
     - **Non-negotiable**: No, but important. This is often included in the cost but might be modeled separately.

  10. **It must be computationally tractable for the intended application.**
      - **Motivation**: We are building a software module. The model must be implementable and run efficiently.
      - **Non-negotiable**: No, but a practical necessity.

  ### Dropping any Prejudices:

  None of the listed requirements seem to be prejudices. They are all motivated by practical concerns.

  ### Joint Satisfiability and the Core Tension:

  The main tension is between:
  - Preserving the non-negativity of the expected value of free information (ex ante, under the standard assumptions).
  - Allowing for rational information avoidance (which might suggest that sometimes the value of information is negative).

  How can both be satisfied?

  The key is to note that the non-negativity result for free information (under the standard assumptions: fixed preferences, no side effects, free disposal of the information, and no direct disutility from the information itself) holds ex ante. However, information avoidance can be rational when:
  - There are costs (monetary, time, cognitive) beyond the acquisition cost (e.g., processing cost, or the cost of acting on the information).
  - The information might change preferences in a way that leads to a lower ex post utility (even though the ex ante expected utility might still be non-negative under fixed preferences? Not exactly: if preferences change, then the utility function is not fixed, so the standard result doesn't apply).
  - There is a direct disutility from knowing (e.g., anxiety from bad news). This can be modeled as a cost of acquisition (a negative utility) that is incurred when the information is received, regardless of the decision.

  Therefore, the non-negativity result holds under the standard assumptions (fixed preferences, no direct disutility, no side effects, free disposal). But when we relax these assumptions, the value of information can be negative. So the theory must clearly state the assumptions and then allow for extensions.

  Thus, both can be satisfied if we:
  - Maintain the non-negativity for free information under the core assumptions (which we derive explicitly).
  - Allow that in practice, when the core assumptions are violated (e.g., by including the disutility of knowing, or by having the information change preferences), the value can be negative.

  In the case of rational information avoidance, we can say that it occurs when the total cost (acquisition cost + expected disutility from knowing + any other side effects) exceeds the expected improvement in the decision (which is non-negative under core assumptions). Alternatively, if preferences change, then the ex ante value might be defined in terms of the current preferences, but the future preferences might make the information undesirable.

  ### Scorecard:

  We evaluate three approaches:

  1. **Vanilla Expected Utility (EU) Decision Theory**:
     - Non-negativity of free information: Yes, under fixed preferences, no costs, free disposal.
     - Handles ex ante vs ex post: Yes, ex ante value is non-negative.
     - Preference change: No, fixed preferences.
     - Self-discovery: Only as belief updating about pre-existing preferences (if modeled as uncertainty about a fixed utility function).
     - Relativity to decision problem: Yes.
     - Option value: Can be handled by dynamic programming, but becomes complex. The non-negativity still holds for each step.
     - Side effects: Not handled.
     - Information avoidance: Only by cost (if cost>value) or by assuming irrationality. Cannot explain avoidance due to disutility of knowing or preference change.
     - Overall: Fails requirements 3, 4, 7, and 8.

  2. **Models that let information change preferences**:
     - Non-negativity: The standard result does not hold because preferences change. The value of information might be negative if the change in preferences leads to worse outcomes (e.g., if after learning, the agent becomes pessimistic and abandons a project that would have succeeded). However, we must define the ex ante value with respect to the ex ante preferences. Then, even if the information leads to a change in preferences, the ex ante value (using ex ante preferences) might still be non-negative? Not necessarily: the updating of beliefs and preferences might lead to an action that ex ante is considered worse. So non-negativity is not guaranteed.
     - Ex ante vs ex post: Still defined, but the ex ante value might be negative because the ex ante preferences might dislike the changes in preferences that the information causes.
     - Preference change: Handled.
     - Self-discovery: Handled as a form of preference change.
     - Relativity: Yes.
     - Option value: Can be modeled, but non-negativity is lost.
     - Side effects: Not specifically addressed, but could be added.
     - Information avoidance: Can explain avoidance if the information might cause a change in preferences that the current self dislikes.
     - Overall: Better on 3,4,8. But the non-negativity result is lost. This might be acceptable if we are clear about the assumptions.

  3. **Models of costly attention or information avoidance** (e.g., rational inattention, or models with direct disutility from information):
     - Non-negativity: For free information (no acquisition cost) and no direct disutility, the value is non-negative. But if there is a direct disutility (like anxiety) from receiving the information, then even free information can have a negative component. The theory can separate the decision-improvement value (non-negative) from the direct disutility (which might be negative). The total value is the sum and might be negative.
     - Ex ante vs ex post: Handled.
     - Preference change: Not handled (unless combined with the above).
     - Self-discovery: Not handled.
     - Relativity: Yes.
     - Option value: Can be modeled, but the non-negativity of the decision-improvement part holds.
     - Side effects: Can be incorporated as costs or changes in the state.
     - Information avoidance: Explains avoidance by direct costs (including disutility) or processing costs.
     - Overall: Handles 1,2,5,6,7,8 (if we include disutility as a cost) but not 3 and 4.

  ### Conclusion:

  The desiderata are jointly satisfiable if we build a theory that:

  - Starts with the standard expected utility model (for fixed preferences, no side effects, free disposal, no direct disutility) and derives non-negativity of free information ex ante.
  - Then extends by:
    - Adding a direct disutility term for receiving the information (which can be negative).
    - Allowing for preference changes (which breaks the non-negativity under ex ante preferences? Not necessarily: we can define the ex ante value using the ex ante preferences, but the information might lead to actions that are worse by the ex ante preferences because of the change in future preferences. This is complex and might lead to negative value).
    - Including costs (acquisition, processing) and side effects.

  The non-negativity result then holds for the decision-improvement component (the classic value of information) but the total value (including disutility and costs) can be negative. Information avoidance is rational when the total value is negative.

  For the engineering context, we might:
  - Use the standard model for the decision-improvement value (which is non-negative for free information).
  - Add a separate term for the direct disutility (if any) and costs.
  - If preference changes are a concern, we must model them explicitly and note that the non-negativity result does not hold.

  In practice, for software engineering, preference changes might be rare (we assume fixed goals) so the standard model plus costs and disutility might suffice.

  But note: in the case of self-discovery (like learning user preferences), we can model that as reducing uncertainty about a fixed but unknown utility function (within the standard model). That would preserve non-negativity.

  So the key is to separate:
  - Uncertainty about the world (including about our own fixed preferences) -> standard model, non-negative value for free information.
  - Changes in the utility function (which break the model) and direct costs/disutility.

  Thus, the list of desiderata is valid and the theory must be explicit about these distinctions.
answer: |-
  Below is the desiderata list for a theory of the value of information (VoI) suitable for your decision-support module. Each requirement includes the motivating case, non-negotiability status, and whether it reflects a modeling camp preference. I've added missing desiderata, dropped one redundant item, and provided the joint-satisfiability analysis and scorecard at the end.

  ---

  ### **Desiderata List**  
  *Non-negotiable (NN): Failure invalidates the theory for your use case.*  
  *Preference (P): Reflects a modeling choice; not inherently required for adequacy.*

  1. **Derive non-negativity from explicit assumptions**  
     - **Motivation**: Good’s theorem assumes free disposal (ignore the signal), fixed preferences, zero processing cost, and no side effects. Your team must verify these hold (e.g., if a load test disrupts production, disposal isn’t free).  
     - **Status**: NN. The theorem must be derived, not assumed, to audit applicability.  

  2. **Separate ex ante and ex post value**  
     - **Motivation**: The module reports a pre-test value (ex ante). Ex post "regret" (e.g., "the test revealed a showstopper bug") must not imply negative VoI, as ex ante value is probabilistic.  
     - **Status**: NN. Confusing these misattributes negative value to rational decisions.  

  3. **Handle preference-changing information**  
     - **Motivation**: A user survey might reveal that users hate a new UI, changing your goal (e.g., from "increase engagement" to "minimize backlash"). Standard VoI assumes fixed preferences.  
     - **Status**: P. Crucial for realism, but some camps (e.g., Bayesian) treat preferences as immutable.  

  4. **Handle self-discovery as distinct from general preference change**  
     - **Motivation**: Learning your team’s true risk tolerance (e.g., via a retrospective) differs from external preference shifts (e.g., users changing desires). Self-discovery may involve pre-existing latent preferences.  
     - **Status**: P. Important for introspection-heavy decisions, but reducible to #3 in some frameworks.  

  5. **Define value relative to a decision problem**  
     - **Motivation**: A vendor quote’s value differs for a "buy/build" decision vs. a "hire/fire" decision. VoI is not intrinsic.  
     - **Status**: NN. VoI must contextualize to the choice at hand.  

  6. **Accommodate recursive VoI (information about information)**  
     - **Motivation**: A small A/B test may inform whether a larger test is needed (e.g., if results are ambiguous). Option value must be captured.  
     - **Status**: NN. Non-negativity should survive recursion: each step’s VoI is non-negative under standard assumptions.  

  7. **Handle information with side effects**  
     - **Motivation**: Running a user survey may bias future responses; a migration dry-run might corrupt data. VoI must adjust for active measurement.  
     - **Status**: NN. Common in engineering; passive observation is idealized.  

  8. **Explain rational information avoidance**  
     - **Motivation**: Teams skip tests (e.g., delaying a security audit to avoid morale loss) or ignore results (e.g., not reading negative feedback). The theory must reconcile this with non-negativity without ad-hoc rationalizations.  
     - **Status**: NN. Avoidance is empirically common; the theory must pinpoint causes (e.g., costs, preference shifts, or violated assumptions).  

  9. **Account for processing costs and limited attention**  
     - **Added Motivation**: Analyzing A/B test results consumes engineering time; a vendor quote requires legal review. VoI must net out these costs, which can outweigh benefits even if information is "free."  
     - **Status**: P. Vanilla VoI ignores this, but it’s critical for realism (e.g., cognitive load in teams).  

  10. **Distinguish instrumental from non-instrumental value**  
      - **Added Motivation**: Information may have intrinsic cost/disutility (e.g., stress from bad news) beyond its decision utility. The theory must isolate "usefulness for decisions" (non-negative) from "impact on well-being" (can be negative).  
      - **Status**: NN. Avoidance often stems from non-instrumental factors (e.g., anxiety).  

  ---

  ### **Dropped Requirement**  
  - *"It must treat value as defined relative to a decision problem..."* was redundant with #5 and merged.  

  ---

  ### **Joint Satisfiability Analysis**  
  **Core tension**: *Preserving non-negativity* vs. *rational information avoidance*.  
  **Resolution**: They are **jointly satisfiable** under these conditions:  
  - Non-negativity holds **ex ante** for the *instrumental* value of **free, disposable information** under **fixed preferences** and **no side effects**.  
  - Avoidance arises from:  
    - **Costs** (acquisition/processing) exceeding instrumental value.  
    - **Non-instrumental disutility** (e.g., dread of bad news).  
    - **Preference shifts** (e.g., learning you dislike a feature demotivates work).  
    - **Violations of assumptions** (e.g., side effects: a test degrades system performance).  
  **Price**: The theory must explicitly separate:  
  - Instrumental VoI (always non-negative ex ante under standard assumptions).  
  - Non-instrumental components (may be negative).  
  - Costs/side effects (subtract from net value).  
  - Preference changes (break non-negativity if utilities are redefined).  

  ---

  ### **Scorecard of Modeling Approaches**  
  *(+ = satisfies, ~ = partial, – = fails, ✓ = non-negotiables met)*  

  | **Requirement**                       | **Vanilla EU** | **Preference-Change Models** | **Costly Attention Models** |  
  |---------------------------------------|----------------|------------------------------|-----------------------------|  
  | 1. Derive non-negativity              | + ✓            | – (fails if preferences shift) | + ✓ (for instrumental VoI) |  
  | 2. Ex ante vs. ex post separation     | + ✓            | + ✓                          | + ✓                         |  
  | 3. Preference-changing information    | –              | + ✓                          | –                           |  
  | 4. Self-discovery                     | ~ (as beliefs) | + ✓                          | –                           |  
  | 5. Decision-relative value            | + ✓            | + ✓                          | + ✓                         |  
  | 6. Recursive VoI                      | + ✓            | ~ (option value may change)  | + ✓                         |  
  | 7. Side effects                       | –              | ~ (if modeled as costs)      | + ✓                         |  
  | 8. Explain information avoidance      | – (labels as irrational) | + ✓ (via preference shifts) | + ✓ (via costs/disutility) |  
  | 9. Processing costs/attention        | –              | –                            | + ✓                         |  
  | 10. Instrumental vs. non-instrumental| – (conflates)  | ~ (if disutility modeled)    | + ✓                         |  
  | **Non-negotiables met?**              | 4/8 ✓          | 6/8 ✓                        | **8/8 ✓**                   |  

  **Summary**:  
  - **Vanilla EU** (e.g., Good’s theorem): Fails #3,7–10. Explains avoidance only via costs, not disutility or preference shifts.  
  - **Preference-change models** (e.g., state-dependent utility): Handle #3,4,8 but lose non-negativity if preferences shift. Best for "self-discovery" cases.  
  - **Costly attention models** (e.g., rational inattention): Best fit. Preserve non-negativity for instrumental VoI while explaining avoidance via costs, disutility, and side effects. Add preference changes to cover all cases.  

  **Recommendation**: Start with a **costly attention framework** (e.g., net VoI = [Expected EU with info] – [Expected EU without info] – [Costs + Disutility]). Augment with preference-change logic for surveys/trials that alter goals. This satisfies all non-negotiables and handles engineering realities.
