prompt: |-
  I'm a systems programmer — I work on OS kernels and distributed systems, not philosophy. But I keep stumbling on debates about which computations matter morally: integrated information theory, global workspace theory, computational functionalism, the question of whether a simulation of a brain is conscious or just a calculation, where the boundaries of a "subject of experience" actually are. I want you to restate this whole cluster of debates in the vocabulary I actually use: processes, threads, address spaces, virtual memory, hypervisors, containers, message passing vs. shared memory, scheduling, interrupts, kernel mode vs. user mode, and so on. Be as precise as you can — don't just wave at analogies, actually do the translation. Then give me the residue report: what maps cleanly, what you had to fudge, and what in the philosophers' debate has no counterpart in my vocabulary at all. And I want your honest take on the residue: is the stuff that doesn't translate pointing to genuine features of consciousness that my vocabulary simply can't capture, or is it pointing to confusion in the philosophy that dissolves when you try to make it concrete? Basically, if I think of a mind as a process tree running on hardware, does the moral-status-of-computations debate get clearer or does it just break?
reasoning: |-
