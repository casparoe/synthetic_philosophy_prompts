  ## The Radical Conservator: Why Field's Truth Theory Outperforms Kripke's Fixed Points

  **Introduction: The Liar's Persistent Bite and the Search for Truth**

  The Liar Paradox – captured in its simplest form by the sentence "This sentence is false" (L) – remains a profound challenge to any coherent theory of truth. It seemingly forces us to abandon cherished logical principles or intuitive features of truth itself. Saul Kripke's fixed-point semantics, presented in "Outline of a Theory of Truth" (1975), offered a landmark solution: a non-classical, partially interpreted language admitting truth-value gaps. Hartry Field's *Saving Truth from Paradox* (2008), however, presents a more radical departure, embracing a non-classical logic with truth-value *gluts* (sentences being both true and false) and a non-monotonic revision rule semantics. Superficially, Kripke's solution appears the gentler modification of classical logic, preserving bivalence at the cost of excluded middle only for pathological sentences and maintaining the full T-schema. Field sacrifices bivalence, classical conjunction/disjunction distribution, and semantic monotonicity. Yet, I argue that Field's account ultimately constitutes the *better* solution precisely because it preserves more of what we fundamentally desire in a truth theory: the ability to express its own semantic concepts without collapse or hierarchy, the recovery of classical reasoning as a stable core, and a more internally honest treatment of pathological sentences. While Kripke provides an elegant map, Field builds a more resilient and expressive structure on the challenging terrain of semantic paradox.

  **I. Kripke's Fixed Points: Elegance, Gaps, and the Preserved T-Schema**

  To steelman Kripke’s account is to appreciate its remarkable elegance and initial plausibility. Kripke’s core insight is that truth is a predicate that can be partially defined. We start with a classical base language (devoid of 'true') and iteratively build interpretations for 'true' by adding sentences that are grounded in non-semantic facts. At each stage, we declare a sentence true (false) if it is already evaluated as true (false) in the base language or via previously established truths (falsities) involving 'true'. Crucially, this process reaches a *fixed point*: a stage where adding the truths determined by the current interpretation doesn’t change the interpretation itself. Sentences like L, which assert their own falsity, find no stable truth value in this construction – they remain *undefined* (neither true nor false) at the fixed point.

  The virtues are significant. **First, classical logic is largely preserved.** For sentences that achieve a classical truth value (true or false) at the fixed point, all classical tautologies hold, and classical rules of inference are valid. Only pathological sentences like L fall into the gap, and excluded middle (A ∨ ¬A) fails precisely for these sentences. This seems a minimal, targeted sacrifice. **Second, and crucially, Kripke maintains the full, unrestricted Tarski T-schema:** "S" is true if and only if S. This holds for *every* sentence S in the language, including L. If L is in the extension of truth, then L is true; but if L is true, it says it is false – a contradiction. Conversely, if L is false, then since it says it is false, it would be true – again contradiction. The only consistent outcome within the fixed point is that L lacks a truth value. The T-schema thus *explains* L's pathology by showing its truth value cannot be coherently assigned, not by restricting the schema itself. **Third, the model is monotonic:** as we build interpretations, once a sentence is declared true (or false), it stays true (or false). This aligns with the intuition that gaining more semantic information shouldn’t overturn established truths. Kripke thus offers a seemingly conservative extension of classical logic, handling the simple Liar by judiciously acknowledging semantic incompleteness while preserving the core truth schema and most classical reasoning.

  **II. The Cracks in the Fixed Point: Strengthened Liar and Curry's Wrath**

  Despite its elegance, Kripke’s fixed-point theory faces devastating challenges from strengthened versions of the Liar and from Curry’s paradox. These reveal that the preservation of the T-schema and classical logic for "safe" sentences comes at a high cost: an inability to fully express semantic concepts within the object language itself, pushing us towards hierarchy or expressive limitation.

  Consider the **Strengthened Liar (L*):** "This sentence is not true." Within Kripke’s framework, what is L*'s status? If L* is true, then it is not true – contradiction. If L* is false, then what it says is false, meaning it *is* true – contradiction again. If L* is undefined (gappy), then it is *not true*. But that’s *exactly what L* says! So if L* is undefined, it seems to correctly assert its own non-truth. This suggests it *should* be true. Yet, declaring it true leads back to contradiction. Kripke’s framework lacks the resources to consistently assign *any* status to L* within the object language. The gappy status itself becomes ineffable. To say "L* is undefined" requires stepping outside the object language into a metalanguage with a more expressive truth predicate (able to name the gap). This reintroduces the very Tarskian hierarchy Kripke aimed to avoid. The fixed-point language cannot semantically characterize its own pathology without collapsing or requiring external resources – a significant failure for a theory aspiring to provide a unified account of truth.

  **Curry’s Paradox** presents an even more severe threat, showing that Kripke’s preservation of the full T-schema, combined with classical logic for non-pathological sentences, leads directly to triviality (everything being true). Consider a sentence C that says: "If this sentence is true, then 0=1." (Or any absurdity). Assume C is true. By the T-schema, if C is true, then (if C is true, then 0=1). Modus ponens (valid in Kripke for classically valued components) then gives us: If C is true, then 0=1. But we *have* assumed C is true, so we get 0=1. Therefore, the assumption that C is true leads to 0=1. This means we have proven: If C is true, then 0=1. But that *is* what C says! Therefore, by the T-schema, C is true. But we just showed that if C is true, then 0=1. Therefore, 0=1. And generalizing, anything follows.

  Kripke blocks this derivation only by declaring that C, being ungrounded and pathological, is undefined. Crucially, however, the *steps* of the Curry derivation involve sentences that Kripke must deem gappy (like C itself). Yet, the logical rules used (modus ponens, conditional proof) are *only* guaranteed by Kripke to preserve truth for sentences that *have* classical truth values. Applying them to gappy sentences like C is invalid within Kripke’s framework. Thus, Kripke avoids triviality not by restricting the T-schema or adding a hierarchy, but by declaring the key inference steps invalid when applied to pathological sentences. While technically blocking the paradox, this is deeply unsatisfying. It means that the intuitive reasoning pattern leading to Curry’s conclusion – a pattern that seems compellingly valid for *any* sentence C – is deemed illicit only *after* we recognize C's pathology, which we cannot adequately express within the language. The logic becomes hostage to the pathology it tries to contain, lacking clear, general principles governing reasoning involving truth that can prevent such explosions without *ad hoc* restrictions on inference.

  **III. Field's Radicalism: Gluts, Non-Monotonicity, and Absorbing Paradox**

  Field confronts these challenges head-on by adopting a fundamentally different logical framework: a paraconsistent, non-classical logic (specifically, a Łukasiewicz continuum-valued logic with a custom conditional) and a non-monotonic revision-rule semantics. Sentences like L and L* are assigned the value "both true and false" (a *glut*) at certain stages. Crucially, Field’s logic rejects the principle of explosion (ex contradictione quodlibet) – a contradiction does not entail everything. This allows gluts to exist without collapsing the system into triviality.

  **Handling Strengthened Liar and Curry:** Field’s framework smoothly absorbs both paradoxes. For L*, the statement "This sentence is not true," Field’s semantics shows it oscillating in value. Crucially, Field introduces a **determinacy operator (D)**, where DA means A is true and not false (i.e., consistently true). Within Field’s system, we *can* consistently say that L* is *not* determinately true (¬DL*). This correctly captures L*'s pathological status – it’s unstable and not consistently true – *within the object language itself*. No hierarchy is needed. For Curry’s sentence C ("If this sentence is true, then 0=1"), Field’s solution lies in his non-classical **conditional (→)**. Field’s conditional is weak enough that C → (C → Absurdity) does *not* entail C → Absurdity within his logic. The derivation of triviality is blocked at the step where we infer the inner conditional. Field’s conditional is designed precisely to invalidate contraction (A→(A→B) entails A→B) and similar principles that fuel Curry-like paradoxes, while still satisfying desirable properties like Modus Ponens for the conditional itself. The T-schema (now formulated semantically as || is true || = || || ) holds for all sentences, but crucially, the *logical connectives* (especially the conditional) are no longer fully classical, preventing the Curry explosion without banning reasoning about truth. Paradoxical sentences become gluts, but contained ones.

  **IV. Radical Means, Conservative Ends: Ultimate Truth and Classical Recovery**

  Field’s radical departure from classical logic seems like a high cost. However, Field provides a powerful response: the concept of **"ultimate truth" (or "stable truth").** While sentences like L and L* oscillate endlessly in truth value throughout the revision process (sometimes true, sometimes false, sometimes a glut), many sentences, including all non-semantic facts and safe semantic claims, eventually stabilize to a single, classical truth value (either consistently true or consistently false) and remain there forever after in the revision sequence.

  This stabilization is the key to Field’s conservatism. **Classical logic is recovered as the logic of *stable truth*.** For any argument where all the premises are *stably true*, the conclusion will be stably true if and only if it follows by classical logic. All classical tautologies are stably true. Crucially, this includes instances of excluded middle involving paradoxical sentences: "L ∨ ¬L" is *stably true* in Field’s system, even though L itself is unstable and glutty. While L is never *determinately* true or false, the disjunction "L ∨ ¬L" is always stably true. Field thus sacrifices classical logic *at the level of the revision process* but recovers it *at the level of stable semantic evaluation*. What we lose is not classical validity itself, but the guarantee that reasoning with *unstable* sentences using classical rules will preserve truth *at every revision stage*. However, for the core purpose of reasoning about the stable world – which encompasses virtually all ordinary discourse and mathematics – classical logic is perfectly preserved as the logic governing stable truth. The radical logic is a scaffolding used to construct a stable semantic edifice where classical principles reign supreme.

  **V. Truth, Nonsense, and Expressive Completeness**

  This brings us to the original third point: the claim that Kripke endorsing the Liar as "true" via the T-schema is problematic. Upon reflection, this needs refinement. Kripke doesn’t endorse L as *simply* true; he endorses the T-biconditional "L is true iff L". Since L is gappy, "L is true" is also gappy. The T-biconditional itself comes out *true* in Kripke’s model, but it’s true precisely *because* both sides lack a truth value (in three-valued Kleene logic, P ↔ Q is true if both P and Q are undefined). There’s no simple "endorsement" of L as true.

  The stronger argument against Kripke lies in **expressive incompleteness**. Kripke’s object language cannot express the thought "This sentence is gappy" or "This sentence is pathological" without resorting to hierarchy. As the Strengthened Liar shows, it cannot even consistently *deny* its own truth. Field’s language, equipped with the determinacy operator D, *can* express these notions. We can say ¬DL ("L is not determinately true"), and this statement itself can be stably true. Field’s system provides the resources to *diagnose and state* the pathology of the Liar *within its own language*. Kripke’s system, by contrast, forces us into a metalinguistic stance to characterize the very phenomenon (the gap) that is central to its solution. Field’s glut-theoretic approach, paradoxically, allows for a *more comprehensive and self-contained* description of truth and its limitations. The Liar being both true and false isn't inherently "better" than it being gappy; but the theoretical framework surrounding Field's gluts provides the tools to *talk about* that status meaningfully within the system itself, without collapse or external hierarchy. This expressive completeness is a significant advantage over Kripke's fixed points.

  **Conclusion: The Virtues of Radical Foundations**

  Kripke’s fixed-point semantics is a masterpiece of philosophical logic, offering an elegant, minimally disruptive path around the simple Liar while preserving the unrestricted T-schema and most classical reasoning. Its intuitive appeal and relative conservatism are undeniable. However, the demands of a full theory of truth are greater. The Strengthened Liar exposes Kripke’s inability to semantically characterize his own central concept (the gap) within the object language, pushing him back towards hierarchy. Curry’s paradox reveals that preserving classical logic for safe sentences alongside the full T-schema requires blocking seemingly natural inferences involving pathological sentences in ways that feel *ad hoc* and lack clear justification within the object language logic itself.

  Field’s solution, while initially appearing more radical and costly, addresses these shortcomings decisively. By embracing a paraconsistent logic with gluts and a non-monotonic revision semantics, Field constructs a system that absorbs both the Strengthened Liar and Curry’s Paradox without collapse or hierarchy. His introduction of the determinacy operator provides the crucial tool for expressing pathology internally. Most importantly, through the concept of ultimate stable truth, Field *recovers* classical logic as the governing principle for all stable, non-pathological discourse. The radicalism of the underlying logic is not an end in itself but the necessary means to achieve a more robust and expressively complete theory of truth. The logic of the revision process is the dynamic machinery; stable truth is the classical equilibrium state it reliably produces. Field pays the price of non-classical local dynamics to preserve the global structure of classical truth and inference for the stable core of language, *and* to gain the ability to coherently discuss the unstable periphery within that very language. For a theory aspiring to comprehensively handle truth and paradox, Field’s radical foundations ultimately provide the more conservative outcome, conserving more of what we truly need: expressive power, freedom from hierarchy, containment of paradox, and the robust recovery of classical reasoning where it matters most. Kripke maps the safe paths but leaves the swamps uncharted; Field builds bridges across the swamps, leading us back to secure classical ground.
