  First, I need to distill the relevant linguistic theories. Semantic theories argue slurs' derogation is part of their meaning, so it persists in mentions or quotes. Pragmatic theories see it as speaker attitude, which might not apply in mentions. But evidence shows slurs offend even when quoted, supporting a semantic or hybrid approach. The mention/use distinction is crucial here—mentioning a word (talking about it) versus using it (to refer pejoratively). However, for slurs, even mentions can cause harm, so this isn't foolproof.

  The user's cases: a legislator's hot mic slur, a gay activist's self-referential use, archival material with historical slurs, and a scientific study mentioning slurs as stimuli. Each scenario tests different aspects. The procedure must address when to mask, paraphrase, or print verbatim, and where human judgment is needed.

  Constraints: The procedure must be accessible to editors, flag its failure modes, and address the user's instinct about archival material. Also, confess limitations, especially regarding reader harm regardless of context.

  Building the procedure step-by-step. Step 1: Identify if the word is a slur. Resources like academic lists or style guides can help. Step 2: Determine if it's mentioned or used. If mentioned (e.g., discussing the word itself), proceed to Step 3 to check context. If used (direct derogatory reference), mask or paraphrase unless reclaimed. Step 3: Context filters—scientific mention, historical artifact, reclaimed by subject. These might allow verbatim use with warnings. Step 4: Human judgment for unresolved cases, considering harm versus information value.

  For the legislator case: Mentioned in news context, but the story's about its use. High harm potential; mask with explanation. Activist case: Reclaimed, self-referential; use verbatim with context. Archival case: Historical, but harm remains; mask with original in archives. Science case: Mentioned as stimulus; use verbatim with heavy framing.

  Failure modes: Reclamation is ambiguous; harm can occur despite context; reader trauma may override theoretical safety. The procedure can't eliminate harm, only mitigate it. The user's archival instinct conflicts with modern harm; masking with access to originals balances both.

  Finally, the procedure can't account for individual trauma or evolving social norms. Editors must weigh harm versus necessity case by case, especially when information value is high but harm risk is significant.
answer: |-
  Here is a practical decision procedure for editors, grounded in linguistic theory but stripped of academic jargon, designed for speed and clarity. It prioritizes minimizing harm while acknowledging linguistic realities and unavoidable judgment calls.

  **Decision Procedure: Handling Slurs in Journalism**  
  *(Time Target: 15 minutes)*

  ---

  ### **Step 1: IS THIS WORD A SLUR?**
     - **Check:** Does the word **historically and systematically denigrate** a group based on identity (race, ethnicity, religion, sexual orientation, gender identity, disability)? Is it widely recognized *as a slur* by authorities (NAACP, GLAAD, ADL, major dictionaries/style guides like AP/APA), academic literature, or the affected community?
     - **Sufficient Answer:** YES (proceed to Step 2). NO (stop; no special handling needed).  
     - **Failure Mode:** Words in reclamation or with contested status (e.g., "queer") may be ambiguous. When unsure, *pause and consult affected community guidelines*.

  ### **Step 2: IS THE WORD BEING *USED* OR *MENTIONED*?**
     - **Check:**  
       - **USING:** Is the speaker/writer deploying the word **to refer to a person/group pejoratively**? (e.g., "Those [slur] are lazy").  
       - **MENTIONING:** Is the word **itself the topic of discussion**? (e.g., "He called them [slur]", "The term [slur] is harmful", scientific stimuli).  
     - **Sufficient Answer:**  
       - **USING →** Go to Step 4 (mask or paraphrase).  
       - **MENTIONING →** Go to Step 3 (context filters).  
     - **Failure Mode:** "Mentioning" *does not neutralize harm* (linguistic theory confirms slurs retain sting in mention). This step clarifies intent but doesn’t resolve risk.

  ### **Step 3: CONTEXT FILTERS (For Mentioned Slurs)**
     - **Check ALL that apply:**  
       - **A. Scientific/Clinical Context?** Is the slur a stimulus in published research, data, or linguistic analysis? *Requires explicit academic framing.*  
       - **B. Historical Artifact?** Is the slur in an *unedited, verbatim quote* from archival material (diary, historical document)?  
       - **C. Reclaimed/In-group Use?** Is the speaker a member of the targeted group using it self-referentially *with clear intent*?  
       - **D. Essential Public Interest?** Is the word’s verbatim use critical to understanding newsworthiness (e.g., investigation of hate speech)?  
     - **Sufficient Answer:**  
       - **If ANY of A-D apply →** Go to Step 4 (consider verbatim with safeguards).  
       - **If NONE apply →** Mask or paraphrase (Stop; no verbatim use).  
     - **Failure Modes:**  
       - Reclamation (C) is highly context-dependent and contested.  
       - Historical/B (D) may expose modern readers to trauma.  
       - Scientific (A) may be misread as endorsement.  
       - *Proceed with extreme caution.*

  ### **Step 4: HUMAN JUDGMENT CHECK (Irreducible Questions)**
     - **Answer these:**  
       1. **Harm Assessment:** Could printing this word retraumatize readers, even with context? *Assume YES unless rigorously disproven.*  
       2. **Alternatives:** Is there a *equally informative alternative* (masking, paraphrase, e.g., "the n-word") that preserves meaning?  
       3. **Necessity Test:** Is the verbatim word *absolutely essential* to the story’s truth, accuracy, or impact?  
       4. **Mitigation:** If printed, can harm be offset? (e.g., content warnings, framing explanation, consultation with affected group).  
     - **Decision:**  
       - **YES to 1 + NO to 3 →** Mask/paraphrase (Stop).  
       - **NO to 1 + YES to 3 →** Consider verbatim with safeguards (Stop).  
       - **Uncertain →** Escalate to Standards Editor + affected community consultation.  
     - **Failure Mode:** This step *cannot eliminate harm*. It weighs ethical trade-offs.

  ### **OUTPUT RULES**
     - **MASK/PARAPHRASE:** Use established conventions (e.g., "n-word", "anti-gay slur").  
     - **VERBATIM (Rare, High-Bar):** Only if:  
       - Mentioning *and* passes Context Filter *and* passes Necessity Test *and* has mitigation.  
       - *Never* for slurs in active use as weapons (e.g., hate speech).  
     - **ESCALATE:** If ambiguity persists at any step.

  ---

  ### **Applied to Your Cases**

  1. **Legislator on Hot Mic:**  
     - Step 1: YES (slur).  
     - Step 2: MENTIONING (reporting his use).  
     - Step 3: D (Essential Public Interest? YES – newsworthiness of his utterance).  
     - Step 4: Harm (HIGH). Alternatives? YES ("used the n-word"). Necessity? NO – masking preserves news value ("used a racial slur" suffices).  
     - **OUTPUT: MASK.** Verbatim adds no unique insight; harm outweighs benefit.

  2. **Gay Activist Self-Reference:**  
     - Step 1: YES (slur).  
     - Step 2: MENTIONING (discussing his identity).  
     - Step 3: C (Reclaimed? YES – in-group, self-referential, explicit consent).  
     - Step 4: Harm (MODERATE, but context mitigates). Alternatives? YES, but violates subject’s agency. Necessity? YES – authenticity central to profile.  
     - **OUTPUT: VERBATIM** with framing: "Smith, who reclaims the slur once used against him, says: '[slur] is my armor now.'"

  3. **19th-Century Travel Writer:**  
     - Step 1: YES (slur).  
     - Step 2: MENTIONING (archival quote).  
     - Step 3: B (Historical Artifact? YES).  
     - Step 4: Harm (PERSISTENT – past doesn’t sanitize present impact). Alternatives? YES (modern paraphrase). Necessity? NO – historical accuracy can be achieved with "[slur]" or paraphrase + footnote. Your instinct (print verbatim) fails Necessity Test.  
     - **OUTPUT: MASK** (e.g., "[slur]") + editorial note: "Original language reflects bigoted historical norms; archived text available [link]." *Truth isn’t compromised – readers understand the writer’s bigotry without encountering the slur.*

  4. **Cognitive Science Study:**  
     - Step 1: YES (slur).  
     - Step 2: MENTIONING (stimulus word).  
     - Step 3: A (Scientific Context? YES – methodology requires it).  
     - Step 4: Harm (HIGH). Alternatives? NO – methodology would be obscured. Necessity? YES – core to understanding the science. Mitigation? YES – explicit framing: "Participants were exposed to slurs including [slur] to measure neural responses to hate speech."  
     - **OUTPUT: VERBATIM** with heavy scientific framing and content warning.

  ---

  ### **What the Procedure CANNOT Do (The Confession Section)**

  1. **Cannot Neutralize Harm:** Linguistics confirms slurs carry derogatory *semantic content* (not just pragmatic attitude). This means **no context is truly "safe"** – even mention in science/history can cause trauma. The procedure *minimizes* risk but cannot eliminate it.
     
  2. **Cannot Resolve Reclamation Debates:** Whether a reclaimed slur is "empowering" or "harmful" is a *social/political question*, not linguistic. The procedure defers to speaker identity/intent but flags risk.

  3. **Cannot Override Reader Trauma:** If a reader is harmed by seeing **any printed instance** of a slur, **that reaction is valid and irreconcilable with linguistic theory**. Semantics/pragmatics explains *why* the harm persists but cannot justify *ignoring* it. This is where "audience and harm" supersede language mechanics.

  4. **Cannot Provide Moral Absolution:** This is a *harm-reduction tool*, not an ethical justification. When verbatim use occurs, it is a conscious choice to prioritize information over potential harm – linguistics informs the choice but doesn’t excuse it.

  5. **Cannot Predict Cultural Shifts:** Words gain/lose slur status over time. Editors must update Step 1 checks annually.

  ### **Your Archival Instinct vs. The Procedure**
  Your belief that bowdlerizing history is a "lie" is understandable but linguistically naive. The *semantic content* of a slur means printing it **re-enacts the harm** in the present, regardless of intent. Paraphrasing or masking **names the harm** ("the writer used slurs against Indigenous people") without weaponizing the term. It tells the truth *about* the language without replicating its violence. The procedure calls for masking here because modern harm outweighs historical literalism – and offers archives as a compromise for purists.

  This procedure forces explicit trade-offs. It won’t satisfy everyone, but it replaces ad-hoc decisions with a structured, theory-informed approach that centers harm reduction. The final call will always rest with human judgment.
