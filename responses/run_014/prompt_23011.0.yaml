  I've been going through Lewis's work on chance and probablity for a seminar, and I keep landing on the conclusion that the Principal Principle is basically a tautology, which I suspect means I'm just missing the point. As far as I can tell, the PP says that your subjective probability (your 'credence') in some proposition A should equal the objective chance of A. But hold on — credence is a probability, and chance is a probability, so isn't the PP just saying 'your probability should equal the probability'? That's either trivially true or just baked into what it means to have a probability in the first place. I don't see where the actual content is.

  And I don't even get why Lewis needs this whole apparatus of 'admissible' vs. 'inadmissible' evidence. If the principle is just 'set your credence to the chance,' then the answer to 'what should I believe?' is always just 'look up the chance and copy it,' and the admissibility stuff looks like a distracting technicality. I've also seen it mentioned that Lewis later replaced the PP with something called the 'New Principle,' but I don't even know what problem that was supposed to solve, so I'm pretty lost at this point. Can someone walk me through what the PP is actually doing that's non-trivial? I feel like I'm not getting the point at all.
