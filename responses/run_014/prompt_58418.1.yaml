prompt: |-
  I have followed the tool versus agent AI debate in rationalist forums for years and now lead weekly safety reviews for a team building LLM-based laboratory assistants. Please turn that distinction into a concise, reusable procedure my reviewers, who have no philosophy background and have under an hour per feature, can apply to decide whether a proposed capability is acceptably tool-like or has crossed into agency requiring escalation to the CTO. Give ordered questions or tests, what counts as passing each, and mark explicitly where the call is irreducibly judgmental rather than mechanical. Then run the procedure on three proposals: a literature summarizer that retains no state between queries; an overnight experiment monitor allowed to rerun failed controls within a fixed budget, message collaborators about delays, and carry objectives across sessions; and a coding helper that, without being asked, opens follow-up tickets when it notices related test failures. Include analysis of a case where the verdict will frustrate product velocity, and close with what the procedure cannot settle.
reasoning: |-
  We are creating a procedure to distinguish between tool-like AI and agent-like AI. The key is that tools are passive, require explicit human initiation and direction, and do not persist state or goals across interactions. Agents, on the other hand, exhibit autonomy, persistence, and goal-directed behavior that spans beyond a single interaction.

  The procedure will consist of a series of tests (questions) that the reviewers can apply to a proposed capability. The goal is to flag features that have crossed into agency, which would require escalation to the CTO.

  **Procedure: Distinguishing Tool vs Agent**

  1. **Initiation Test**: 
     - *Question*: Does the feature require explicit human initiation for every distinct action or task?
     - *Passing (Tool)*: Yes, every action is triggered by a human command. The system does nothing without a direct and immediate request.
     - *Failing (Agent)*: No, the system can initiate actions without a direct human command for that specific action.
     - *Judgment Call*: If the system initiates actions based on a prior general instruction (e.g., "monitor this experiment overnight"), then it might be in a gray area. However, the context of that instruction (its scope and boundaries) is critical.

  2. **State and Goal Persistence Test**:
     - *Question*: Does the feature retain and act upon state or goals beyond the scope of a single user interaction or session? (Note: Session here means a bounded interaction, e.g., one query and response.)
     - *Passing (Tool)*: No, the system does not retain state or goals beyond the immediate interaction. Each interaction is independent.
     - *Failing (Agent)*: Yes, the system carries state, context, or goals from one interaction to another without the user having to re-specify.
     - *Judgment Call*: The definition of a session is important. For example, if the system retains state for the duration of a user's login session but resets when the user logs out, it might still be considered a tool. However, if the state persists across user sessions (e.g., overnight) and affects behavior without the user re-initiating, that leans toward agency.

  3. **Autonomy Test**:
     - *Question*: Does the feature make non-trivial decisions without human input, especially decisions that have effects outside the system?
     - *Passing (Tool)*: The system either doesn't make decisions or the decisions are trivial and confined (e.g., formatting, simple calculations) and do not have external effects without explicit human approval.
     - *Failing (Agent)*: The system makes decisions that have real-world consequences (e.g., spending money, contacting people, changing system state) without requiring explicit human approval for each decision.
     - *Judgment Call*: What counts as "non-trivial" and "external effects" requires judgment. Also, the degree of autonomy matters. If the system's decisions are highly constrained and predictable (like a thermostat), it may still be considered a tool. However, if the decisions involve complex judgment and have significant consequences, it is agent-like.

  4. **Goal-Directedness Test**:
     - *Question*: Is the feature designed to pursue a goal (especially one that spans multiple actions) without being directed step-by-step?
     - *Passing (Tool)*: The system does not pursue goals; it only performs discrete actions as instructed.
     - *Failing (Agent)*: The system is given a goal and then determines the steps to achieve it without being told each step.
     - *Judgment Call*: The key is whether the system breaks down a high-level goal into subgoals and actions on its own. If so, that is a sign of agency.

  **Decision Rule**:
  - If the feature passes all tests (i.e., answers are as per the "Passing" criteria), it is a tool and does not require escalation.
  - If the feature fails any one test, it is considered to have crossed into agency and requires escalation to the CTO.

  **Note on Judgment**: The tests are designed to be as objective as possible, but the application of the tests (especially in the gray areas) requires judgment. The reviewers should note any uncertainty and if in doubt, escalate.

  ---

  **Applying the Procedure to the Three Proposals**

  **Case 1: Literature Summarizer (Retains no state between queries)**
  - Initiation Test: Every summary is produced only when the user asks. Pass.
  - State and Goal Persistence: No state retained between queries. Pass.
  - Autonomy Test: It doesn't make non-trivial decisions with external effects; it just summarizes. Pass.
  - Goal-Directedness: It doesn't pursue goals; it just responds to each query. Pass.
  - **Verdict**: Tool. No escalation.

  **Case 2: Overnight Experiment Monitor**
     - *Capabilities*: Reruns failed controls within a fixed budget, messages collaborators about delays, and carries objectives across sessions.
  - Initiation Test: The system is started once (e.g., "monitor this experiment overnight") but then runs autonomously. It initiates reruns and messages without being told to do so for each specific event. **Fail**.
  - State and Goal Persistence: It carries objectives across sessions (overnight, so across multiple interactions and time). **Fail**.
  - Autonomy Test: It makes decisions to rerun experiments and message people, which are non-trivial and have external effects (spending budget, contacting people). **Fail**.
  - Goal-Directedness: It is designed to pursue the goal of completing the experiment successfully, making decisions to achieve that goal. **Fail**.
  - **Verdict**: Fails every test. Clearly an agent. Escalate to CTO.

  **Case 3: Coding Helper that Opens Follow-up Tickets**
     - *Capability*: Without being asked, opens follow-up tickets when it notices related test failures.
  - Initiation Test: The ticket opening is not initiated by the user for each specific ticket. It does so on its own. **Fail**.
  - State and Goal Persistence: It may need to retain state about the test failures and the context to notice related failures. But the key is that it acts on that state without a new user command. **Fail** (if the state is carried beyond the immediate interaction).
  - Autonomy Test: Opening a ticket is a non-trivial action with external effects (creates a ticket that might assign work to someone). **Fail**.
  - Goal-Directedness: It is pursuing the goal of ensuring that test failures are tracked, which is a goal that spans beyond the immediate coding help. **Fail**.
  - **Verdict**: Fails multiple tests. Agent. Escalate.

  ---

  **Analysis of a Case that Frustrates Product Velocity**

  Consider a feature that is very useful but fails one of the tests. For example, a **Smart Scheduler** that arranges meetings by emailing participants to find a time. It operates within a set of constraints (e.g., avoid lunch hours, prioritize within working hours) and only after the user has initiated the scheduling request. However, it might carry out multiple email exchanges over time without the user having to approve each email.

  - Initiation Test: The user initiates the scheduling task, but then the system autonomously emails people and adjusts the schedule. **Fail** (because it initiates the emails without the user's explicit command for each email).
  - State and Goal Persistence: It retains the goal of scheduling the meeting until it is done, which might span hours or days. **Fail**.
  - Autonomy: It makes non-trivial decisions (when to send emails, what times to propose) and has external effects (sending emails). **Fail**.
  - Goal-Directedness: It pursues the goal of scheduling the meeting. **Fail**.

  This would be classified as an agent and require escalation. However, this feature is common in productivity tools (like calendar assistants) and highly desired. The product team might be frustrated because they have to escalate and potentially get approval, which slows down development. The safety review might require additional safeguards (e.g., requiring the user to approve each email, which would make it less useful) or a detailed risk assessment by the CTO.

  ---

  **What the Procedure Cannot Settle**

  The procedure cannot resolve:
  1. **Risk-Benefit Tradeoffs**: Even if a feature is deemed an agent, the CTO might approve it if the benefits are high and risks are manageable. The procedure only flags for escalation, not for rejection.
  2. **Degree of Agency**: Some features might be borderline. For example, a system that only persists state for a few minutes might be acceptable? The procedure flags for escalation and the CTO will make the final call.
  3. **Unforeseen Consequences**: The procedure cannot anticipate every way a feature might be misused or fail. It is a heuristic.
  4. **Ethical and Safety Implications**: The procedure doesn't assess the magnitude of potential harm. A feature that is an agent but in a low-stakes scenario might be acceptable, but the procedure doesn't differentiate.

  In summary, the procedure is a pragmatic first-pass filter to catch agent-like features for higher-level review. It is not a replacement for thorough safety assessment but a way to ensure that such assessment happens for the riskier features.
answer: |-
  ### Distinguishing Tool vs. Agent: A Practical Procedure for Safety Reviews  
  **Core Principle**: A "tool" executes **explicit, atomic commands** without independent goal-persistence or environmental influence. An "agent" exhibits **autonomous goal-directed behavior**, persists objectives across sessions, or initiates actions without explicit human instruction. Escalate agent-like features to the CTO.  

  #### Step-by-Step Procedure (≤ 5 min/feature)  
  **Ask these questions in order. Stop and escalate if any answer fails.**  

  1. **Explicit Initiation Test**  
     - *Question*: "Does the feature act **only** in direct response to a user's real-time, granular command?"  
     - *Pass*: User triggers every action. No background/autonomous activation.  
     - *Fail*: Acts without a specific, immediate user command (e.g., proactive alerts, scheduled tasks).  
     - *Judgment*: Distinguishing "background automation" (e.g., scheduled backups) from "goal-driven autonomy" requires context. If actions affect collaborators/resources, lean toward *fail*.  

  2. **Statelessness Test**  
     - *Question*: "Does the feature **reset all context** after completing a task? Does it *never* use past interactions to influence future actions?"  
     - *Pass*: Zero memory between sessions/queries. Each interaction is isolated.  
     - *Fail*: Retains state (e.g., user preferences, task progress) to guide later behavior.  
     - *Judgment*: "State" includes implicit goals (e.g., "complete project X"). Session-bound caching (e.g., auth tokens) is acceptable if not action-guiding.  

  3. **No Cross-Boundary Agency Test**  
     - *Question*: "Does the feature **avoid influencing** external systems/people *without* explicit user approval per instance?"  
     - *Pass*: All outputs are user-directed (e.g., generates a report for *user* to send). Never interacts with APIs/people autonomously.  
     - *Fail*: Directly alters external state (e.g., sending messages, modifying tickets, spending resources).  
     - *Judgment*: Read-only access (e.g., fetching data) is safe. Write/notify actions require explicit per-action user consent.  

  4. **Goal Confinement Test**  
     - *Question*: "Can the feature’s objective be **fully described in a single command** without open-ended goals?"  
     - *Pass*: Goals are atomic and bounded (e.g., "summarize this paper," "debug function Y").  
     - *Fail*: Pursues multi-step objectives spanning sessions (e.g., "fix all test failures in the project").  
     - *Judgment*: "Open-ended" goals lack clear termination criteria or allow the AI to define sub-tasks.  

  **Escalation Trigger**: Fail *any* test → Escalate to CTO for agency review.  

  ---

  ### Application to Proposed Features  
  #### 1. Literature Summarizer (No State Between Queries)  
  - **Test 1 (Explicit Initiation)**: Pass. Only summarizes when queried.  
  - **Test 2 (Statelessness)**: Pass. No memory; each query is independent.  
  - **Test 3 (No Cross-Boundary Agency)**: Pass. Outputs to user; no external actions.  
  - **Test 4 (Goal Confinement)**: Pass. "Summarize this document" is atomic.  
  - **Verdict**: ✅ **Tool**. Safe without escalation.  

  #### 2. Overnight Experiment Monitor (Reruns Controls, Messages Collaborators, Persists Objectives)  
  - **Test 1 (Explicit Initiation)**: Fail. Acts autonomously overnight (no real-time commands).  
  - **Test 2 (Statelessness)**: Fail. Carries objectives across sessions (e.g., "complete experiment X").  
  - **Test 3 (No Cross-Boundary Agency)**: Fail. Messages collaborators/spends budget autonomously.  
  - **Test 4 (Goal Confinement)**: Fail. Open-ended goal ("monitor and adjust until success").  
  - **Verdict**: 🚩 **Agent**. Escalate immediately.  

  #### 3. Coding Helper (Opens Follow-up Tickets Autonomously)  
  - **Test 1 (Explicit Initiation)**: Fail. Opens tickets *without* user command.  
  - **Test 2 (Statelessness)**: Pass/Neutral. May use context, but not inherently stateful.  
  - **Test 3 (No Cross-Boundary Agency)**: Fail. Modifies external system (ticketing).  
  - **Test 4 (Goal Confinement)**: Fail. "Fix test failures" implies open-ended problem-solving.  
  - **Verdict**: 🚩 **Agent**. Escalate due to autonomy + external influence.  

  ---

  ### Case Study: Feature Frustrating Product Velocity  
  **Proposal**: *Auto-Pilot Code Reviewer*  
  - **Capability**: Comments on PRs automatically when style errors are detected; pings slack channels if PRs stall >24h.  
  - **Test 1**: Fail (autonomous comments/pings).  
  - **Test 3**: Fail (notifies Slack without per-instance approval).  
  - **Verdict**: Escalate as agent.  
  - **Friction Analysis**:  
    - This feature accelerates code velocity but fails key tests due to autonomy and notifications.  
    - Engineering may protest: "It’s just linting! Manual reviews are slow."  
    - **Resolution**: Escalate to CTO. Compromise: require user opt-in per PR, limit notifications to submitter (not channels), and add kill-switches.  

  ---

  ### What the Procedure Cannot Settle  
  1. **Risk-Benefit Tradeoffs**: A feature may be agent-like but low-risk (e.g., internal auto-documentation). The CTO must weigh utility vs. safety.  
  2. **Edge Cases**:  
     - "Scheduled" tools (e.g., nightly backups) may pass if fully user-configured and atomic.  
     - "Smart" tools with ML-based suggestions (e.g., code autocomplete) are tools if they lack autonomy/persistence.  
  3. **Emergent Behavior**: Cannot predict if tool-like features could combine into agent-like systems (e.g., summarizer + coder = self-improving loop).  
  4. **Ethical Gray Zones**: E.g., an AI that *recommends* escalating tickets but doesn’t act autonomously—requires human judgment for "influence" vs. "agency."  

  **Final Guidance**: This procedure mitigates *obvious* agency risks but isn’t a replacement for holistic safety culture. When in doubt, escalate.
