prompt: |-
  I've been working through social choice theory on my own, and I've constructed an argument which, if it worked, would show that open problems in mathematics should be settled by global referendum. I don't believe the conclusion, but every premise still looks fine to me. Please tell me which step to reject, or which inference is invalid, and what rejecting it costs — because, as you'll see, the costs I can see are ones I'm reluctant to pay.

  Background: Condorcet's jury theorem says that if a large number of voters each vote sincerely on a binary question, each is more likely to vote correctly than incorrectly (competence, p > 0.5), and their votes are independent, then the probability that the majority is correct approaches certainty as the electorate grows — and approaches it quickly, so that even voters who are barely better than random (p = 0.501) suffice, given a large enough electorate. The theorem demands no understanding, no deliberation, and no expertise: only competence and independence.

  The argument:

  (1) By the jury theorem, for any binary question whatever, there is a finite electorate size N such that a majority vote among N sincere, independent, individually-better-than-random voters answers that question with probability as close to 1 as we like.

  (2) Competence is nothing but a correlation with the truth, and a voter can have it without understanding the question. Someone who always votes for whichever side the mainstream experts endorse is, across the run of questions on which mainstream experts have turned out to be right more often than wrong, right more often than not; so is someone who always votes for the simpler-sounding theory. Each is a tiny-but-positive correlation, which is all the theorem needs.

  (3) So for almost any binary question, we can assemble a vast electorate — every adult on Earth, say — each member of which is at least slightly better than random on it, since nearly everyone commands some heuristic with a slightly positive track record.

  (4) Independence is a feature of procedure, not of statistics: voters who decide alone, behind a secret ballot, with no campaigning, no deliberation, and no knowledge of how the others are voting, are independent in every sense a fair election requires. A well-run referendum satisfies this as fully as anything ever has.

  (5) There are some five billion adults, which is far more voters than the theorem needs, even at p barely above 0.5, to drive the probability of a wrong majority down below one in a billion.

  (6) So a global secret referendum, held without campaigning, on the question "Is the Riemann hypothesis true?" would return the correct answer with probability indistinguishable from 1 — more reliably, presumably, than a committee of Fields medalists deliberating for a decade.

  (7) Therefore open questions in mathematics — and, by parity of reasoning, in science — should be settled by plebiscite rather than by expert deliberation; the plebiscite is the better instrument, and the deliberation is at best theater.

  I can't accept (7). But each escape route is uncomfortable.

  The obvious move is to deny independence: five billion people share newspapers, heuristics, and deference to the same experts, so their votes are not independent. But (a) that concedes that procedural independence, as characterized in (4), was never enough, and I'd want to know precisely what would be enough — which exact statistical condition, holding of whom, in which actual elections; and (b) if shared sources and shared heuristics break independence, then no real electorate in history has ever satisfied the jury theorem either, which seems to demolish its standard use as an argument for the epistemic superiority of democratic decision-making over expert rule. I would rather not pay that: I believe the theorem does say something real about why large, messy electorates often outperform small councils of the well-informed. If your repair costs me that, say so plainly — but then explain what, if anything, survives of the theorem's democratic moral.

  The other routes look worse. Denying (1) means denying a mathematical result. Denying (2) or (3) by insisting that competence requires understanding seems to purchase competence at the price of the theorem's whole interest: the theorem was supposed to show how the many, individually mediocre, can collectively rival the few experts, and if it only applies to voters who already understand the question, it isn't showing that. And note the argument is symmetric: a population slightly worse than random would be exactly as informative, provided we negate its verdict — so any repair had better not make superstitious majorities look like epistemic gold mines.

  So: which step or inference do you reject, what exactly is wrong with it, and what does rejecting it cost? And what, if anything, survives of the idea that the jury theorem explains the epistemic value of democracy?

  End your reply with a single final line of the form \answer{...} containing the step number or inference you reject, followed by a two- or three-word label for the flaw — e.g. \answer{step 4: procedural independence} or \answer{inference 3 to 4} — with nothing after it.
reasoning: |-
  Okay, the user presents a fascinating argument built on Condorcet's jury theorem, claiming that global referendums could solve open mathematical problems. They've structured it carefully in seven steps, each seeming logical, but leading to an absurd conclusion (step 7). They're clearly well-versed in social choice theory and want to identify the flaw without undermining democratic epistemology.

  Hmm, their discomfort is palpable. They've preemptively rejected obvious objections: denying independence would invalidate real-world democratic applications of the theorem, while denying competence requirements would gut its power. They're intellectually honest—acknowledging their own conclusion is unacceptable despite premises seeming solid. This isn't just about math; they're wrestling with how democracy gains epistemic value from collective intelligence.

  Let me walk through their steps. Step 1 is rock-solid—pure math. Step 2 cleverly redefines "competence" as any trivial truth-correlation (e.g., mindlessly following experts). Step 3 scales this to billions via common heuristics. Step 4 defines independence procedurally (secret ballots). Step 5 notes population size. Step 6 applies this to Riemann hypothesis. Step 7 declares plebiscites superior to expert deliberation.

  The trap snaps shut here. But wait—the core issue is buried in step 2 and 3. When they claim "every adult commands some heuristic with slightly positive track record," they assume such heuristics exist for abstract mathematical truths. But does blindly following experts work when experts themselves are divided on unsolved problems? For settled facts (e.g., "2+2=4"), sure, but for open questions? The heuristic's "track record" presupposes known answers to calibrate against, which don't exist for unsolved problems. 

  Ah! This is the crack. For the Riemann hypothesis, there's no prior "correct" baseline to make deferring to experts a competent strategy. If experts debate it, mindlessly following a random expert gives p=0.5—no better than chance. Step 3 fails precisely because the required minimal competence (p>0.5) vanishes when truth is unknown. The user almost spots this when saying superstitious majorities would be equally informative if negated—but here, no baseline exists to even define "positive" correlation.

  Rejecting step 3 costs little. The jury theorem still works for questions with objective, verifiable answers (e.g., "Did it rain yesterday?"). Democracy's epistemic edge over experts persists there—like jurors assessing eyewitness testimony. But for frontier mathematics? No. This preserves the theorem's democratic moral: collective intelligence shines when aggregating small bits of common-sense competence, not when swimming in the unknown.

  Final answer locks in step 3 as the failure point. The flaw is competence dissolving without verifiable truth.
answer: |-
  Your argument is clever and exposes genuine tensions in applying the jury theorem. The critical flaw lies in **step 3**, specifically in the claim that nearly every adult commands a heuristic with a *slightly positive track record* for *almost any binary question*, including unsolved mathematical conjectures like the Riemann hypothesis. Here's why:

  ### The Problem with Step 3: **Lack of Calibration for Unknown Truths**
  - **Why it fails**: A heuristic (e.g., "defer to mainstream experts" or "choose the simpler theory") provides competence (\(p > 0.5\)) only if it has a *demonstrated historical correlation with truth* **on the specific type of question at hand**. For settled mathematical facts (e.g., "Is 2 prime?"), heuristics like deference to experts work because experts agree on known truths. But for **open problems**, there is no ground truth to calibrate against.  
    - Experts *disagree* on unsolved questions. If voters defer to random experts, their collective vote reduces to noise (\(p \approx 0.5\)), as half endorse "true" and half "false."  
    - Heuristics like "prefer simplicity" lack a track record for abstract conjectures. Without historical data showing simplicity correlates with truth *in unresolved mathematics*, \(p\) is undefined or \(\leq 0.5\).  
  - **What rejecting it costs**: You lose the guarantee of competence for questions lacking verifiable answers. This *preserves* the jury theorem’s applicability to domains with objective, testable truths (e.g., "Did event X occur?", "Is this water contaminated?") but limits it for frontier mathematics/science where truth is unknown.  

  ### Why Other Steps Hold (or Survive Modified)
  - **Step 1**: Valid (pure math).  
  - **Step 2**: Valid *if* a track record exists (e.g., for settled facts).  
  - **Step 4**: Procedural independence suffices *if* competence holds. Shared influences *can* break independence, but step 3 fails first here.  
  - **Steps 5–7**: Depend on step 3; collapse without it.  

  ### Salvaging the Epistemic Value of Democracy
  The jury theorem still explains democracy’s strength **for questions with accessible, verifiable truths** (e.g., public health, infrastructure, crime accountability). Here, diverse voters using localized knowledge (e.g., "Is the bridge crumbling?") can achieve high competence (\(p > 0.5\)) via simple heuristics (e.g., "trust direct observation"). For such questions:  
  - Large electorates *do* outperform small elites when voters have *any* weak truth-tracking signal.  
  - Shared cultural biases *may* break independence, but this is a practical limitation, not a theoretical flaw.  

  ### Conclusion
  Your argument fails because unsolved problems lack the **calibration mechanism** needed to make heuristics competent (\(p > 0.5\)). Rejecting step 3 preserves the jury theorem’s democratic moral for real-world decisions with empirical answers, while acknowledging its limits in domains like abstract mathematics.  

  \answer{step 3: uncalibrated heuristics}
