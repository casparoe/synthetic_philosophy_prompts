  For the disagreements table, I'll present each camp's position in their own terms. The degree camp focuses on quantitative belief updating while the aboutness camp emphasizes contextual relevance. Some disagreements may be substantive (like whether confirmation requires subject-matter relevance) while others might be verbal (like how strictly to define "confirmation").

