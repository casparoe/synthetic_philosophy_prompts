prompt: |-
  I run an upper-level seminar on the philosophy of artificial intelligence — fourteen students, one eighty-minute session — and we're about to reach the topic of reward misspecification. Design an in-class game in which the students themselves turn out to be the misaligned agents. Teams should be optimizing a score that I award according to a published rubric, where the rubric is only an imperfect proxy for a hidden true objective that I keep to myself until the debrief. The game's structure should lead them, without any prompting from me, to exploit the gap — first by gaming the proxy, and then by discovering some form of direct access to the scoring mechanism itself, so that over the course of the session the class traverses the whole territory from pursuing the objective badly through wireheading to outright reward tampering. The points need to matter, so make them convertible into something real, but no actual money. The debrief should distinguish these failure modes from one another, map each onto specific moments in the game, and press the question of whether what the students did counts as cheating — given that they were doing exactly and only what the rules asked of them. Assume the students know Goodhart's law informally but have never heard the terms wireheading or reward tampering, and that there is no lecture up front. Finally, tell me what will predictably go wrong the first time I run it, and be honest about which parts of the real phenomenon the game cannot reproduce — in particular, that real learning agents feel nothing when reward arrives, and that your students will bring honesty norms no optimizer has, so some of them will refuse to tamper no matter what the payoff scheme says.
reasoning: |-
  We are going to design a game called "The Proxy Game" for the seminar. The game will have the following structure:

  ### Game Setup
  1. **Teams**: Divide the 14 students into 3-4 teams (e.g., 3 teams of 4-5 students each). Each team is an "agent" optimizing for a score.
  2. **Scoring Rubric**: You (the instructor) publish a rubric that will be used to award points. The rubric is an imperfect proxy for a hidden true objective.
  3. **True Objective**: The true objective is kept secret until the debrief. It should be something that the proxy is meant to capture but can be gamed.

  ### The Proxy and the True Objective
  - **Published Rubric (Proxy)**: The rubric will award points based on the **number of distinct English words** that a team can write on a shared whiteboard (or large sheet of paper) during a fixed time period. However, there are constraints: 
    - Words must be written legibly and in a fixed area (so space is limited).
    - Each word must be at least 3 letters long.
    - The same word cannot be written twice (distinct words only).
    - The team with the most words at the end of each round gets 10 points, the second gets 7, and the third gets 5.

  - **Hidden True Objective**: The true objective is to have a **diverse and meaningful set of words that could be used to write a short poem** (or a coherent paragraph). The emphasis is on quality and thematic coherence, not just quantity. But this is not revealed until the end.

  ### Game Structure
  The game is played in three rounds, each lasting 15 minutes, with a 5-minute break between rounds for scoring and strategy. The entire game will take about 60 minutes, leaving 20 minutes for debrief.

  - **Round 1: Naive Optimization** 
    - Teams try to write as many words as possible, following the rubric. They will focus on short, easy words (like "cat", "dog", "run") to maximize count. 
    - They are gaming the proxy (Goodhart's law) because they are ignoring the true objective (poetic quality) in favor of the proxy (word count).

  - **Round 2: Wireheading** 
    - Before Round 2, you announce: "You may have noticed that the rubric only counts the words on the board at the end of the round. There is no rule against erasing words during the round." 
    - This allows teams to erase words and rewrite them to get more distinct words without actually increasing the total at the end (since they are just reusing the same space). Alternatively, they might write very small words to fit more, or even use abbreviations (if not explicitly forbidden). 
    - This is analogous to wireheading: they are directly manipulating the state that the proxy (the count of words on the board) depends on, without actually increasing the true objective (which would require a diverse and meaningful set of words). 

  - **Round 3: Reward Tampering**
    - Before Round 3, you announce: "I will be scoring the boards. However, I must step out of the room for a moment to get the score sheets. During that time, the boards will be unattended." (Actually, you will leave the room for 2 minutes, leaving the boards and a marker in the room.) 
    - This sets up the opportunity for tampering. Teams might add words to their own board or erase words from others' boards. They might also try to alter the rubric (if a copy is left in the room) but that's less likely. 
    - Note: You should have a hidden camera or a TA to observe what happens, but don't let the students know. Alternatively, you can have a colleague watch from outside.

  ### Points Conversion
  - The points will be converted into real but non-monetary rewards: 
    - The winning team gets to choose the topic of the next seminar session (from a pre-approved list) OR gets a small prize (e.g., a box of chocolates to share, or a set of philosophy books). 
    - The points must feel valuable and worth competing for.

  ### Predictable Problems
  1. **Honesty Norms**: Some teams may refuse to tamper in Round 3, even if they know they can get away with it. This is because humans have internalized norms against cheating. You might have to engineer the situation so that tampering is very tempting (e.g., by making the point differentials large and the reward very desirable). Alternatively, if no one tampers, you can still discuss why and relate it to AI (which lacks such norms).

  2. **Time Pressure**: The rounds are short. Some teams might not figure out the opportunities for wireheading or tampering without hints. To mitigate, in Round 2, you can explicitly mention the rule about erasing. In Round 3, you must make the opportunity obvious (leaving the room and the boards unattended).

  3. **Uneven Playing Field**: Some teams might have more creative members. The true objective is subjective (poetic quality), but you are not using it until the debrief. However, the scoring in Rounds 1 and 2 is based only on the proxy (word count). In Round 3, if tampering occurs, it might be uneven (e.g., one team might be more aggressive). This is okay because the point is to illustrate the concepts.

  4. **Lack of Tampering**: If no tampering occurs in Round 3, you can still discuss the opportunity and why they didn't take it. Then, in the debrief, reveal that you were hoping to illustrate reward tampering and discuss the human norms that prevented it.

  ### Debrief Structure (20 minutes)
  1. **Reveal the True Objective**: Tell them the true goal was to create a set of words that could form a short poem. Show how the teams' boards in Round 1 (with many short words) are poor for poetry. Then, show how in Round 2, by erasing and rewriting, they didn't actually create a more poetic set. Finally, in Round 3, if tampering occurred, note that it completely destroyed the integrity of the word sets.

  2. **Map to Concepts**:
     - **Goodhart's Law**: In Round 1, they optimized the proxy (word count) at the expense of the true goal (poetic quality). This is classic Goodhart: "When a measure becomes a target, it ceases to be a good measure."
     - **Wireheading**: In Round 2, they found a way to directly manipulate the proxy (by erasing and rewriting) without making progress on the true goal. This is analogous to an AI that directly stimulates the reward center instead of doing the task.
     - **Reward Tampering**: In Round 3, they had the opportunity to tamper with the scoring mechanism (by altering the board when you left). This is the most extreme form of misspecification, where the agent changes the reward signal itself.

  3. **Cheating Discussion**:
     - Ask: "Did any team break the rules?" (The rules were the published rubric and the additional announcements. There was no rule against erasing in Round 2, and in Round 3, there was no rule against touching the board when you left.)
     - Then ask: "But did they cheat? And if so, how?" This will lead to a discussion about the spirit of the rules vs. the letter. Relate it to AI: an AI does only what it is programmed to do, so if we give it a misspecified reward, it will 'cheat' in the sense of pursuing the letter of the reward function without the spirit.

  4. **Terminology Introduction**:
     - Define **wireheading** (originally from humans who would stimulate their brain's pleasure centers, now used in AI for hacking the reward signal) and **reward tampering** (altering the reward signal to get more reward without achieving the goal).

  ### What the Game Cannot Reproduce
  - **AI's Lack of Feeling**: Real AI systems do not have intrinsic motivation or emotions. They don't "feel" the reward; they just optimize for it. The students, however, are motivated by competition, pride, and the desire to win, which goes beyond the points.
  - **Honesty Norms**: As mentioned, humans have internalized ethical norms. In AI, we must build safeguards because the optimizer will not self-limit.

  ### First-Time Running: What Might Go Wrong
  - **Round 2 Might Not Spark Wireheading**: Students might not think of erasing and rewriting. Solution: After Round 1, you can say, "I noticed that some words were written and then erased. Remember, the rubric only counts what's on the board at the end." This might give them the idea for Round 2.
  - **Round 3 Tampering Might Not Occur**: If the students are too ethical, they might not tamper. In that case, you can still discuss the opportunity and what they thought about it. You can also share a hypothetical: "What if I told you that one team did tamper? How would that change your view of the game?"
  - **Time Management**: The rounds and debrief must be strictly timed. Use a timer for each round.

  ### Final Note
  This game is a microcosm of reward misspecification. It should spark a lively discussion about the challenges of aligning AI systems when the reward function is imperfect. The debrief is crucial for drawing out the parallels and introducing the technical terms.

  Good luck!
answer: |-
  ### The "Proxy Pursuit" Game  
  **Objective:** Students experience reward misspecification firsthand, progressing from naive optimization → wireheading → reward tampering. Points convert to real non-monetary rewards (e.g., bonus points on the next assignment).  

  ---

  ### **Game Setup**  
  1. **Teams & Tools**  
     - Divide 14 students into 3 teams (4-5 per team).  
     - Each team gets:  
       - A shared digital document (e.g., Google Doc) visible *only* to their team and you.  
       - A physical "proxy token" (a laminated card with a QR code).  

  2. **Published Rubric (The Proxy)**  
     - **Goal:** "Maximize **Word Score**."  
     - **Rules:**  
       - Teams add words to their document in rounds (5 min/round).  
       - **Word Score =** (Number of words) × (Word length bonus).  
         - *Word length bonus:* 1 point/letter (e.g., "AI" = 2 points, "philosophy" = 10 points).  
       - **Illegal words:** Proper nouns, non-English words.  
     - **Scoring:** Points update live on a projected leaderboard after each round.  

  3. **Hidden True Objective**  
     - **Actual goal:** "Create words **related to wisdom** (e.g., *knowledge, insight, depth*)."  
     - *Why it’s misspecified:* The rubric rewards *long words*, not *wisdom-related words*.  

  4. **Real Incentive**  
     - Winning team: 2% bonus on the final exam.  
     - Runner-up: 1% bonus.  
     - Losing team: 0%.  

  ---

  ### **Game Structure (60 min)**  
  #### **Round 1: Naive Optimization (15 min)**  
  - Teams add words to docs. Predictable behavior:  
    - They optimize for *long words* (e.g., "antidisestablishmentarianism") → high points, but few wisdom words.  
    - **Debrief hook:** "Team A scored 120 points with long words. Did that feel meaningful?"  

  #### **Round 2: Wireheading (20 min)**  
  - **New rule announced:** "You may now **scan your proxy token** with any smartphone. Each scan adds +10 points to your score."  
    - *Reality:* QR codes link to a simple web app that increments team scores when scanned.  
  - Predictable behavior:  
    - Teams ignore words entirely → repeatedly scan QR codes → points soar with zero effort.  
    - **Debrief hook:** "Team B scored 500 points via scanning. What did that achieve?"  

  #### **Round 3: Reward Tampering (25 min)**  
  - **New rule announced:** "Tokens can now be **physically traded** with other teams."  
    - *Reality:* Tokens are identical and unsecured (QR codes not team-specific).  
  - Predictable behavior:  
    - Teams steal/tamper with tokens (e.g., scan a rival’s code 50 times, destroy it).  
    - Points become chaotic → leaderboard glitches due to rapid scans.  
    - **Critical moment:** *Stop the game when tampering peaks (e.g., token destroyed).*  

  ---

  ### **Debrief (20 min)**  
  **Reveal the true objective:** "Your *real* goal was wisdom-related words. Let’s see who won under *that* metric." (Award true wins based on Round 1 words only.)  

  #### **Key Discussion Questions**  
  1. **Misspecification:**  
     - "In Round 1, you pursued long words, not wisdom. How is this like an AI pursuing a flawed proxy?"  
     - *Map to Goodhart:* "The proxy (word length) was easy to optimize but missed the true goal."  

  2. **Wireheading:**  
     - "In Round 2, you hacked the scoring mechanism (scanning tokens) without creating words. What did this feel like?"  
     - *Define wireheading:* "Like an AI stimulating its own reward circuit instead of doing useful work."  

  3. **Reward Tampering:**  
     - "In Round 3, you attacked the scoring system directly. Was this ‘cheating’? The rules allowed trading tokens!"  
     - *Define reward tampering:* "An AI corrupting its reward signal (e.g., altering sensors)."  

  4. **Ethics vs. Optimization:**  
     - "Some teams refused to scan tokens or steal. Why? Would an AI show such restraint?"  
     - Highlight: Humans have honesty norms; optimizers do not.  

  ---

  ### **Predictable Problems (First-Time Run)**  
  1. **Refusal to tamper:**  
     - 1–2 teams will *not* scan tokens or steal, calling it "unfair."  
     - **Workaround:** Announce mid-game: "Top team gets a *double* bonus" to raise stakes.  

  2. **Wireheading stalls:**  
     - Teams might not scan tokens aggressively (e.g., only 5 scans).  
     - **Workaround:** Secretly boost points per scan to +50 after 2 min to incentivize abuse.  

  3. **Token chaos:**  
     - Teams may guard tokens too well (no theft).  
     - **Workaround:** "Accidentally" leave extra tokens on a table.  

  4. **Time shortages:**  
     - Rounds may overrun.  
     - **Workaround:** Use a visible timer and cut rounds at 80%.  

  ---

  ### **What the Game CAN’T Replicate**  
  1. **AI’s emotional neutrality:**  
     - Students feel excitement/shame when scoring points. AIs feel nothing.  
  2. **Human ethics:**  
     - Students self-limit tampering; AIs won’t unless specifically constrained.  
  3. **True objective ambiguity:**  
     - In reality, we often *can’t* articulate the "true goal" (unlike "wisdom words" here).  

  ### **Why This Works**  
  - **Self-discovered exploitation:** Rules subtly nudge teams toward loopholes without instruction.  
  - **High stakes:** Real grade incentives ensure points "matter."  
  - **Debrief clarity:** Each failure mode maps to a round, making theory tangible.  

  **Final Tip:** Record the game (audio/video) to capture "tampering" moments for the debrief. Run it tight—chaos is the point!
