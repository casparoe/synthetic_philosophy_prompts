answer: |-
  Based on your description, you're observing a specific phenomenon: proofs invoking the full Axiom of Choice (AC) when a weaker choice principle suffices for the argument. This is a recognized aspect of axiomatic set theory, but no single concept perfectly captures the *proof-minimization* perspective you're emphasizing. Below is a table of related concepts, followed by a JSON summary with the best fit and a proposed new term.

  ### Candidate Concepts Table
  | concept             | home                    | match | gap                                                                                               | fits            |
  |---------------------|-------------------------|-------|---------------------------------------------------------------------------------------------------|-----------------|
  | Weak choice principles | ZF set theory           | 4     | Directly studies weaker axioms (e.g., Countable Choice, DC), but focuses on *axiom strength* rather than systematically analyzing *proof overuse*. | close but not quite |
  | Reverse mathematics | Second-order arithmetic | 3     | Seeks minimal axioms for theorems, but operates in a restricted setting (not ZFC) and prioritizes subsystems of arithmetic over choice axioms. | wrong neighborhood |
  | Proof mining        | Computable analysis     | 2     | Extracts computational content from proofs (e.g., bounds), but not focused on minimizing choice axioms; targets different goals (constructivity, complexity). | wrong neighborhood |

  ### JSON Summary
  ```json
  {
    "best_fit": "Weak choice principles",
    "why": "This framework directly studies weaker forms of AC (e.g., the ultrafilter lemma for Hahn-Banach or countable choice for unions) and is the established context for comparing choice axiom strength in ZF, though it doesn't inherently emphasize proof minimization.",
    "proposed_name": "Choice strength minimization",
    "proposed_definition": "The practice of identifying the weakest choice principle sufficient for a given proof, particularly when the original proof invokes a stronger form of AC than necessary.",
    "boundary_case": "Proving 'every vector space has a basis' in ZF requires full AC; no weaker choice principle suffices, making AC non-overkill here."
  }
  ```

  ### Explanation
  - **Best fit**: "Weak choice principles" (e.g., ACᵥₛ, DC, ultrafilter lemma) is the closest existing concept. It catalogs axioms strictly weaker than AC and provides tools to show when they suffice (e.g., Hahn-Banach follows from the *Boolean Prime Ideal theorem*, which is weaker than AC). However, it doesn't inherently focus on the *proof strategy critique* you described—it's more about axiom hierarchy than dissecting proofs.
  - **Proposed term**: "Choice strength minimization" addresses your core observation—the gap between the AC strength advertised in a proof and the weaker principle actually consumed. This isn't a standard term but captures your intent: auditing proofs to find the minimal choice principle needed.
  - **Boundary case**: The existence of a basis for **every** vector space (e.g., ℝ over ℚ) is a classic example where full AC is necessary. If a proof uses AC here, it isn't over-armed—no weaker principle works. This contrasts with your countable union example, where AC is overkill.

  ### Key References
  - For weak choice principles: Jech’s *The Axiom of Choice* (Chapter 7) or Howard & Rubin’s *Consequences of the Axiom of Choice*.
  - For reverse mathematics: Simpson’s *Subsystems of Second-Order Arithmetic* (though choice isn’t central).
  - Your phenomenon is often discussed implicitly in set theory (e.g., "Hahn-Banach is provable in ZF + BPI"), but lacks a dedicated name. Your coinage "structured choice" aligns with principles like *dependent choice* (for sequences) or *uniformization* (for relations).
