  The core tension seems to be between proof-as-truth-establishment and proof-as-persuasion. The member's hypothesis about this duality feels promising - it might dissolve rather than relocate the dispute if both conceptions are valid but separate. But I must test whether the dialectical camp can defend their stance without circularity. 

