  Alright, the user is working on a derivation for a seminar about origin essentialism, specifically Kripke's idea that a person couldn't have originated from a different sperm and egg. They've constructed an argument that ends up proving too much—it concludes that even the same parents couldn't produce the same person at a different time with different gametes. The user finds this conclusion too strong and wants to reject it while keeping the weaker claim that a person couldn't have come from different parents. They're asking which step to reject and why, and whether the weaker claim can stand independently.

  First, I need to understand each step of their argument. Step (1) assumes for reductio that the user could have come from different gametes. Step (2) considers a hypothetical scenario where the same parents have another child a month later with different gametes. Step (3) states that this child would have a different genetic makeup. Step (4) claims that genetic makeup is necessary for personal identity—any genetic difference means a different person. Step (5) concludes that this later child isn't the user, and step (6) follows that the user couldn't have come from different gametes even from the same parents.

  The problem is step (4). The user's personal identity being "fixed by physical, genetic constitution" is the key premise that's causing the issue. By asserting that any genetic difference means a different person, it rules out not just different parents but even the same parents at a different time. This is what leads to the overly strong conclusion (6).

  Why might step (4) seem plausible? People often think of genetics as fundamental to identity—after all, identical twins have nearly identical DNA but are different people. However, this premise conflates genetic makeup with numerical identity. While genetics might be sufficient for certain characteristics, it's not necessarily necessary for being the same person. Kripke's origin essentialism is about the necessity of origin in a specific zygote, not about genetic identity per se. For example, one could imagine scenarios involving genetic mutations or chimeras where genetics change but the person remains the same. So step (4) is stronger than what origin essentialism actually requires.

  Rejecting step (4) allows the user to keep the weaker claim. The weaker claim—that one couldn't have come from different parents—can be defended without relying on genetic determinism. Kripke's original argument is based on the necessity of origin: you must originate from the specific gametes you did, meaning different parents would entail a different origin. This doesn't hinge on genetics but on the causal-historical origin itself. So by rejecting the genetic-constitution principle, the user can still argue that different parents would mean a different individual, without committing to the idea that even the same parents couldn't produce the same person at a different time.

  The user might be concerned about whether the weaker claim stands without genetic arguments. Yes, it does. Kripke's argument is metaphysical, not biological. It's about the necessity of coming from the particular zygote formed by specific gametes. Changing parents changes that origin entirely, whereas the same parents at a different time would still be a different zygote. So the weaker claim is intact, and the stronger conclusion (6) is avoided by rejecting step (4).

  Underlying the user's discomfort with (6) might be an intuition that personal identity isn't solely tied to genetics. For example, if the same parents had a child with a genetic mutation, we might still consider that child as potentially the same person in some counterfactual scenario. Or philosophical thought experiments where gradual changes occur without changing identity. By rejecting step (4), the user avoids these counterintuitive implications.

  The user also asked if there's an independent route for the weaker claim. Yes, through Kripke's origin essentialism directly, without genetics. Emphasizing the necessity of the specific causal origin—the particular conception event—supports the weaker claim without needing genetic identity. This approach aligns better with Kripke's original position and avoids overcommitment.
answer: |-
  (4) If a person has a different genetic makeup from me, then that person is not me.  

  Step (4) should be rejected because it conflates genetic distinctness with numerical identity in a way that is stronger than required by origin essentialism and unsupported by Kripke's arguments. While Kripke defends the necessity of one's actual origins (e.g., the specific gametes), he does not equate identity with genetic constitution. Genetic makeup is a contingent biological feature, not a metaphysically necessary criterion for being the same person. Kripke's origin essentialism hinges on the necessity of the causal-historical origin—the specific zygote—not on genetic properties that could vary (e.g., through mutation) while preserving identity. Step (4) appears plausible because genetics is often practically sufficient for distinguishing individuals, but it is not necessary for identity in all possible scenarios. For instance, a person could (in principle) undergo genetic changes without ceasing to exist, such as in gradual replacement thought experiments, or in cases of chimerism where two genomes coexist in one individual.  

  Rejecting (4) allows you to retain the weaker claim (that you could not have come from different parents) while abandoning the stronger claim (6). The weaker claim can be supported independently by Kripke's original argument: your identity is necessarily tied to the specific gametes that produced you, so different parents would entail a different origin, and thus a different individual. This relies solely on the necessity of the causal origin itself, not on genetic constitution. The two claims are not locked together; (6) depends critically on (4), while the weaker claim does not. You can defend origin essentialism for gametes without genetic determinism by emphasizing the uniqueness of the originating event: you could not have originated from different gametes (even from the same parents at a different time) because that would be a different originating event—but this does not require that genetic differences alone suffice for non-identity. The independent route for the weaker claim is Kripke's modal intuition: if your parents had been different, the person born would not be you, full stop. No genetic premise is needed. By rejecting (4), you pay the price of abandoning a biologically tidy but metaphysically inflated principle, preserving the core of origin essentialism without overextension.
