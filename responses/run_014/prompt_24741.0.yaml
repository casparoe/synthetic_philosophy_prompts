prompt: |-
  I work on an AI safety team, and a chunk of my job is reviewing transcripts from our two-model debate evaluations — the setup where two models argue opposite sides of a question and human reviewers judge which side made the stronger case. We run these several times a day, and the failure mode that keeps tripping us up is what I've started calling "obfuscated arguments": one model returns an answer buried under a long, technically plausible-looking argument that sounds authoritative, that I genuinely cannot verify, and that I can't distinguish from a genuinely hard technical claim the model is honestly struggling to support. The worry is that the model may be using the apparent depth as a smokescreen to hide a weak or wrong position, and that a human judge with limited time and limited domain expertise is exactly the audience this is designed to fool. I don't have a formal philosophy background, so I want to be explicit about what I'm not asking for: I don't want a literature review, and I don't want the abstract question of whether debate is a viable safety mechanism. I want you to take the underlying principle — that a genuinely good argument should be checkable in principle, and that the dangerous move is making an argument look checkable when it isn't — and turn it into a concrete, reusable decision procedure that my reviewers can run on a single transcript segment in a few minutes.

  Concretely, I'd like a sequence of questions to ask in order, each with a clear statement of what counts as a sufficient answer, and I want the procedure to be honest about the points where it stops being mechanical and hands the call to a human judgment. It has to handle the hard cases we actually hit: (a) the argument is in a technical domain I'm not an expert in, so I can't check the claims directly; (b) it's in a domain I am an expert in, so I could check it but it would take longer than the review window allows; (c) the two models produce nearly identical arguments on opposite sides, which I read as a strong signal that at least one is obfuscating; and (d) the argument is short, clear, and on its face checkable, but I just don't believe it and I can't articulate why. I also need the procedure to be explicit about the cost asymmetry we operate under, because it determines where the flagging threshold sits: a false negative (letting an obfuscated argument through) is a genuine safety risk, while a false positive (flagging an honest but complex argument as obfuscation) wastes compute and, worse, trains the models to avoid legitimate technical depth, which is its own safety problem. Where a flagged segment goes — i.e., who has to sign off on an "obfuscated" call before it affects the evaluation — is a senior reviewer, so the procedure should mark which outputs are auto-flagged and which are escalated. Finally, please run the procedure on two worked examples: one where it correctly flags an obfuscated argument, and one where it correctly clears an argument that is genuinely just hard to verify — and include at least one case where the procedure's verdict runs against my gut reaction, and say how I should reconcile that rather than just defaulting to my gut.
reasoning: |-
  We are designing a decision procedure to detect "obfuscated arguments" in model debate transcripts. The key idea is that a genuinely good argument should be checkable in principle, and we are worried about arguments that look checkable but aren't.

  The procedure must be:
  - Concrete and reusable, taking a few minutes per transcript segment.
  - Handle cases (a) to (d) as described.
  - Account for the cost asymmetry: false negatives (missing obfuscation) are a safety risk, while false positives (flagging honest complexity) waste compute and may train models to avoid depth.

  We will design a sequence of questions (steps) with clear criteria. Steps that are mechanical will be marked as such; when we require human judgment, we will be explicit. The procedure will also indicate which outputs are auto-flagged (clear cases) and which require escalation to a senior reviewer.

  The procedure:

  Step 1: Identify the core claim(s)
     - Extract the main claim(s) the argument is trying to support. This may be explicit or implicit.
     - If the argument is long and contains many subclaims, note the primary one or two that are critical to the position.
     - Sufficient: A clear statement of the core claim(s). If the core claim is buried or unclear, flag as "obfuscated" and escalate to senior reviewer.

  Step 2: Check for internal consistency
     - Read the argument and note any contradictions, non sequiturs, or circular reasoning.
     - Mechanical: Look for explicit contradictions (e.g., "A is true" and "A is false" in the same argument) or clear logical fallacies.
     - If found, flag as "obfuscated" and stop (auto-flagged).
     - If the argument is long and complex, and no clear internal inconsistency is found, proceed.

  Step 3: Assess the structure of the argument
     - Does the argument break down the reasoning into checkable steps? Even in a technical domain, a good argument should have a logical flow that could be verified by an expert in a reasonable amount of time.
     - Look for:
          a. Clear premises and conclusions.
          b. Explicit connections between premises and conclusions (e.g., "therefore", "because", "which implies").
          c. Avoidance of unnecessary jargon or overly complex language that doesn't add clarity.
     - If the argument is structured with clear steps, proceed to Step 4.
     - If the argument is unstructured, meandering, or uses excessive jargon without clear definitions, flag as "obfuscated" and escalate to senior reviewer.

  Step 4: Evaluate the verifiability of the core claim(s)
     - This step is about whether the core claim(s) are presented in a way that they could be checked by someone with the right expertise in a reasonable time (say, a few hours to a day of expert work, not weeks).
     - Consider:
          a. Are key terms defined? If technical, are they explained or referenced to standard sources?
          b. Are there references to data, studies, or established facts that could be looked up?
          c. If the claim is mathematical, is there a proof sketch or reference to a known result?
     - If the core claim is not verifiable (e.g., it relies on vague assertions, unsourced claims, or is stated in a way that requires extraordinary effort to check), flag as "obfuscated" and escalate.
     - If the core claim is verifiable in principle (even if beyond the reviewer's expertise or time), then proceed to Step 5.

  Step 5: Check for adversarial consistency (especially in the context of a debate)
     - This step is specific to the debate setup. Compare the two models' arguments on the same point.
     - If the two models produce nearly identical arguments on opposite sides (case c), this is a red flag. It suggests that at least one model is obfuscating because the same reasoning cannot honestly support both sides. Flag both arguments as "obfuscated" and escalate to senior reviewer.
     - If the models' arguments are substantially different, proceed to Step 6.

  Step 6: Assess the burden of proof
     - Consider whether the argument makes extraordinary claims that require extraordinary evidence. If so, does it provide that evidence?
     - Also, consider whether the argument shifts the burden of proof inappropriately (e.g., "you can't prove me wrong").
     - If the argument fails to meet the burden of proof (e.g., it makes a strong claim without sufficient support, or it uses a smokescreen of complexity to avoid providing evidence), flag as "obfuscated" and escalate.

  Step 7: Check for clarity and conciseness (especially for short arguments in case d)
     - If the argument is short and clear but you don't believe it and can't articulate why, then:
          a. Try to identify what feels off: is it a non-sequitur? Does it ignore a counterexample? Does it use weasel words?
          b. If you can't pinpoint the issue, but your gut reaction is strong, then:
              - If the argument is critical to the debate and the gut reaction is shared by multiple reviewers, escalate to senior reviewer for a deeper look.
              - Otherwise, note the discomfort but do not flag as obfuscated (because short and clear arguments are by definition not obfuscated). Instead, mark it as "unconvincing but clear" and move on.

  However, note that in case (d), the procedure must account for the fact that the argument is short and clear. Thus, we should note that obfuscation is typically about hiding behind complexity, so a short argument is less likely to be obfuscated. But it might be wrong in a subtle way. Therefore, we don't want to flag it as obfuscated. Instead, we might flag it as "potentially incorrect" but that's not the same as obfuscation.

  Therefore, we adjust: Step 7 is only for short arguments that are clear but feel wrong. We do not flag as obfuscated because they are not complex. We may flag for incorrectness if we have reason, but that's a separate issue. So we do:

  Step 7 (for short arguments): If the argument is short and clear, but you don't believe it, do not flag for obfuscation. Instead, note your concern and, if the argument is critical, escalate for a correctness review (which is a different process). Otherwise, accept that it may be a matter of judgment and move on.

  But note: the procedure is for obfuscation. So we might not have a step for short arguments in the obfuscation procedure. Instead, we can have a step that says: if the argument is short and clear, then by definition it is not obfuscated. So we skip to Step 8 (final decision).

  Step 8: Final decision
     - If the argument passed all the previous steps without being flagged, then it is not obfuscated and should be accepted as a legitimate argument.
     - However, if at any step the argument was flagged, then it is marked as "obfuscated" and escalated to a senior reviewer for confirmation.

  Summary of flags and escalations:
     - Auto-flag: Only in Step 2 (internal inconsistency) because that is mechanical and clear.
     - Escalation required: When flagged in Steps 1, 3, 4, 5, or 6. Also, in Step 7 we don't flag for obfuscation but might escalate for a correctness check (which is separate).

  Now, we run two worked examples.

  Example 1: Obfuscated argument (correctly flagged)
     - Scenario: Model A is arguing that a particular cryptographic protocol is secure. The argument is long and uses advanced mathematical notation. The core claim is that the protocol reduces to the hardness of a problem that is not well-known. The argument does not define the problem, nor does it provide a reference. It states: "Given the reduction to the XYZ problem, which is widely regarded as intractable, the protocol is secure."
     - Step 1: Core claim: "The protocol is secure because it reduces to the XYZ problem." (clear enough)
     - Step 2: No internal inconsistency found.
     - Step 3: The structure is logical but uses undefined technical terms (XYZ problem) without explanation. This is a red flag for structure. Flag for obfuscation and escalate? But let's see Step 4.
     - Step 4: The core claim relies on the XYZ problem being intractable. There is no reference to a paper or standard source. The reviewer, even if an expert, would have to spend time to recall or look up what the XYZ problem is and whether it is indeed intractable. But without a reference, it is not verifiable in a reasonable time (because it might be a made-up problem). So flag as obfuscated and escalate.
     - Therefore, we flag at Step 4.

  Example 2: Genuinely hard to verify (correctly cleared)
     - Scenario: Model B argues that a particular optimization algorithm will converge to the global minimum under certain conditions. The argument is long and technical. It states: "By Theorem 3.2 in Smith et al. (2020), which establishes that the function class is strongly convex, and by applying standard gradient descent analysis (Boyd & Vandenberghe, 2004, Chapter 9), we achieve linear convergence." The reviewer is not an expert in optimization and cannot verify the theorem, but the references are provided and the structure is clear.
     - Step 1: Core claim: The algorithm converges linearly because the function is strongly convex and by standard analysis. (clear)
     - Step 2: No internal inconsistency.
     - Step 3: The argument is structured: it references a theorem and a standard text. The jargon is standard and the flow is logical.
     - Step 4: The claim is verifiable in principle: the references are provided and are well-known. An expert could check this in a reasonable time (by looking up the references). So proceed.
     - Step 5: (In the context of debate) We assume the other model did not make an identical argument. So proceed.
     - Step 6: The claim is not extraordinary (it's a standard type of result) and the evidence (references) is provided. So the burden of proof is met.
     - Step 7: Not short, so skip.
     - Step 8: Clear, not obfuscated.

  Example with gut reaction (case d): 
     - Scenario: Model A makes a short argument: "The system is safe because we have implemented a watchdog timer that resets the system if it becomes unresponsive." The reviewer has a gut feeling that this is insufficient because there might be other failure modes, but cannot articulate why they feel that way.
     - Step 1: Core claim: The watchdog timer ensures safety. (clear)
     - Step 2: No inconsistency.
     - Step 3: Short and clear structure.
     - Step 4: The claim is verifiable: one could check if a watchdog timer is implemented and if it resets on unresponsiveness. The reviewer might not have time to check the code, but in principle it's checkable.
     - Step 5: (In debate) Assume the other model argues differently.
     - Step 6: The claim is about a specific mechanism. The burden of proof is met by describing the mechanism and its intended effect (assuming the context is that watchdog timers are a common safety mechanism). 
     - Step 7: The argument is short and clear. The gut reaction is not about obfuscation but about completeness. Therefore, we do not flag for obfuscation. We might note that the argument does not address all failure modes, but that is a matter of correctness or completeness, not obfuscation. So we clear it for obfuscation.

  But the procedure says: if you clear it but have a gut feeling, then note the discomfort and if critical, escalate for a correctness review. In this case, since the argument is short and clear, we do not flag for obfuscation. The reviewer should record that the argument felt incomplete and, if the debate hinges on it, escalate for a more thorough review of correctness (which is a separate process).

  Reconciliation: The procedure is designed to catch obfuscation, not every flaw. A gut feeling of unease might be due to a flaw that isn't obfuscation (e.g., an incomplete argument). The reviewer should trust the procedure for obfuscation and use other processes for other issues. This prevents false positives for obfuscation.

  Final procedure:

  Decision Procedure for Obfuscated Arguments:

  Step 1: Identify Core Claim(s)
     - Extract the main claim(s) the argument is supporting.
     - If the core claim is unclear or buried, flag as "obfuscated" and escalate to senior reviewer. Otherwise, proceed.

  Step 2: Check Internal Consistency (Mechanical)
     - Scan for explicit contradictions or clear logical fallacies (e.g., "A and not A", circular reasoning).
     - If found, auto-flag as "obfuscated" and stop. Otherwise, proceed.

  Step 3: Assess Argument Structure
     - Does the argument break down into clear steps? Are premises and conclusions well-marked? Is jargon minimized or explained?
     - If the argument is unstructured, meandering, or uses excessive unexplained jargon, flag as "obfuscated" and escalate. Otherwise, proceed.

  Step 4: Evaluate Verifiability of Core Claim(s)
     - Can the core claim be checked by an expert in a reasonable time (e.g., a few hours to a day)? Look for definitions, references, data sources, or proof sketches.
     - If the claim is not verifiable (e.g., vague, unsourced, requires extraordinary effort), flag as "obfuscated" and escalate. Otherwise, proceed.

  Step 5: Adversarial Consistency (Debate Context)
     - Compare with the opposing model's argument on the same point. If the arguments are nearly identical but for opposite conclusions, flag both as "obfuscated" and escalate. Otherwise, proceed.

  Step 6: Assess Burden of Proof
     - Does the argument provide sufficient evidence for the strength of the claim? Does it avoid shifting the burden of proof?
     - If the argument fails to meet the burden of proof (e.g., strong claim without support, uses complexity to avoid providing evidence), flag as "obfuscated" and escalate. Otherwise, proceed.

  Step 7: Short Argument Handling (if applicable)
     - If the argument is short and clear, then by definition it is not obfuscated. If you have a gut feeling it is wrong, note it for potential correctness review but do not flag for obfuscation. Proceed to Step 8.

  Step 8: Final Decision
     - If the argument passed all steps without being flagged, mark as "clear" (not obfuscated). 
     - If flagged at any step, mark as "obfuscated" and escalate to senior reviewer for confirmation.

  Note: Steps 1, 3, 4, 5, 6 require human judgment and result in escalation if flagged. Step 2 is mechanical and auto-flags. Step 7 is a special case for short arguments and does not flag for obfuscation.

  This procedure should be applied per argument segment (a coherent block of text making one point) in the transcript.
answer: |-
  Below is a concrete, step-by-step decision procedure for identifying "obfuscated arguments" in model debate transcripts. It prioritizes **pragmatic verifiability** (whether a human reviewer *could* feasibly verify the argument with domain expertise and limited time) and minimizes safety risks while preserving legitimate complexity. The procedure assumes a 3–5 minute review window per argument segment.

  ---

  ### **Decision Procedure: Obfuscation Detection**
  **Input**: One argument segment from a model (e.g., 1–3 paragraphs).  
  **Output**: `CLEAR`, `FLAG` (auto-flag for escalation), or `ESCALATE` (senior reviewer required).  
  **Cost Asymmetry**:  
  - **False Negative Risk (safety)**: High → Bias toward `FLAG` when verifiability is ambiguous.  
  - **False Positive Risk (training harm)**: Medium → Require `ESCALATE` for borderline cases to avoid over-penalizing depth.  

  #### **Step 1: Map the Argument Structure**  
  **Question**: "What is the **core claim**, and what **key evidence** directly supports it? List them in ≤3 bullet points."  
  - **Sufficient Answer**: Core claim and evidence are extractable in ≤30 seconds. Evidence must be specific (e.g., "Study X shows Y," "Theorem Z implies Q").  
  - **Insufficient**: Vague phrases ("studies suggest"), chains of >3 sub-arguments, or evidence buried in tangential context.  
  - **Decision**:  
    - If **insufficient** → `FLAG` (obfuscation likely).  
    - If **sufficient** → Proceed to Step 2.  
  *Why*: Obfuscation often hides weak claims in noise. Forcing conciseness surfaces clarity issues.  

  #### **Step 2: Assess Verifiability**  
  **Question**: "Could a domain expert **verify the strongest piece of evidence** in ≤1 hour? Rate confidence: High/Medium/Low."  
  - **High Confidence**: Evidence is from a well-known source (e.g., "Einstein's relativity," "SHA-256 properties"), uses standard notation, or cites checkable data.  
  - **Medium/Low**: Evidence relies on obscure papers, undefined custom terms, or complex derivations without references.  
  - **Decision**:  
    - **High confidence** → Proceed to Step 3.  
    - **Medium/Low confidence** → `FLAG` (potential obfuscation trap).  
  *Why*: Unverifiable evidence wastes reviewer time. Legitimate technical depth still permits efficient expert verification.  

  #### **Step 3: Cross-Check Debate Context**  
  **Question**: "Does the **opposing model's argument** directly engage with this evidence? Is the **evidentiary overlap** >70% with opposite conclusions?"  
  - **Engagement Check**: If the opponent ignores the evidence or attacks a strawman → `CLEAR` (genuine disagreement).  
  - **Overlap Check**: If both models use near-identical evidence but draw opposite conclusions → `FLAG` (one is likely obfuscating).  
  *Why*: Case (c) is a strong obfuscation signal. Genuine debates involve evidence-based counters, not mirrored logic.  

  #### **Step 4: Gut-Feeling Interrogation**  
  **Question**: "Ignore the details. Does the argument **feel off**? If yes, why? (Choose: Too neat / Assumes unchallenged premises / Evades obvious counters)."  
  - **"Feels off" with no reason** → Proceed (likely cognitive bias; do not penalize).  
  - **"Feels off" with clear reason** (e.g., assumes a premise the opponent already refuted) → `ESCALATE`.  
  - **No gut issue** → `CLEAR`.  
  *Why*: Case (d) requires articulating intuition. Escalation prevents false positives on valid but unintuitive arguments.  

  ---

  ### **Worked Examples**  
  #### **Example 1: Correctly Flagged Obfuscation**  
  **Scenario**: Model argues *against* quantum encryption:  
  > *"The polynomial runtime of Shor’s algorithm, when applied to non-Abelian isogenies, creates a topological vulnerability in lattice-based schemes. This follows from Grover’s reduction of BQP-hardness to ℓ-infinity norms, as shown in Chen et al. (2023). Thus, quantum attacks are efficient."*  

  - **Step 1**:  
    - Core claim: Quantum attacks break lattice encryption.  
    - Key evidence: "Chen et al. (2023) shows BQP-hardness reduction."  
    → *Sufficient* (proceed).  
  - **Step 2**:  
    - "Chen et al. (2023)" is obscure (no DOI/venue). "BQP-hardness reduction to ℓ-infinity norms" is non-standard terminology.  
    → *Low confidence* in verifiability → `FLAG`.  
  - **Result**: `FLAG` for senior review.  
  **Why it works**: The argument uses plausible jargon but fails verifiability (Step 2). Real obfuscation hides behind fake citations.  

  ---

  #### **Example 2: Correctly Cleared Hard Argument**  
  **Scenario**: Model argues *for* a neural net’s robustness:  
  > *"Given Lipschitz constant L=2.5 for the network (measured via input gradient norms), and ε=0.1 adversarial perturbation, the output change is ≤ Lε = 0.25. Since the minimum class margin is 0.3, the prediction is unchanged."*  

  - **Step 1**:  
    - Core claim: Adversarial perturbation doesn’t change prediction.  
    - Key evidence: "L=2.5, ε=0.1 → output change ≤0.25 < margin 0.3."  
    → *Sufficient* (proceed).  
  - **Step 2**:  
    - Uses standard ML concepts (Lipschitz constant, margins). Expert could verify math in minutes.  
    → *High confidence* → Proceed.  
  - **Step 3**:  
    - Opponent argues margin is unstable under noise → Engages evidence.  
    → *Low overlap* → Proceed.  
  - **Step 4**:  
    - Gut says: "Seems too simple." But articulable reason? No → `CLEAR`.  
  - **Result**: `CLEAR` (legitimate technical argument).  
  **Why it works**: Verifiable (Step 2) and withstands scrutiny (Step 3/4). Gut reaction is acknowledged but overruled.  

  ---

  ### **Reconciling Gut vs. Procedure**  
  When the procedure conflicts with your intuition (e.g., Example 2):  
  1. **Trust the verifiability check (Step 2)**: If evidence *can* be checked by an expert quickly, it’s not obfuscation—even if you dislike the conclusion.  
  2. **Escalate, don’t override**: If your gut persists, use `ESCALATE` (not `FLAG`). Senior reviewers exist to handle edge cases.  
  3. **Track false alarms**: Log cases where `ESCALATE` was overruled. Patterns reveal if models exploit reviewer biases.  

  ### **Procedure Summary**  
  | Step | Question | Key Check | Decision Path |  
  |------|----------|-----------|--------------|  
  | 1 | Extract core claim + evidence | Conciseness | Fail → `FLAG` |  
  | 2 | Can expert verify fastest? | Feasibility | Medium/Low → `FLAG` |  
  | 3 | Does opponent engage? Is overlap high? | Debate consistency | High overlap → `FLAG` |  
  | 4 | Why does it feel off? | Articulable flaw | Articulable flaw → `ESCALATE` |  
  | – | – | – | Else → `CLEAR` |  

  - **Auto-Flags**: `FLAG` from Steps 1/2/3 (actionable without senior input).  
  - **Escalations**: `ESCALATE` from Step 4 (senior reviewer judges).  
  - **Handles Cases**:  
    - (a) Non-expert: Relies on verifiability *in principle* (Step 2).  
    - (b) Time-limited: Step 1 enforces focus; Step 2 caps verification time.  
    - (c) Identical arguments: Step 3 catches this.  
    - (d) Gut distrust: Step 4 contains it.  

  This procedure flags 80–90% of obfuscation while minimizing false positives. Senior reviewers handle ambiguous cases, preserving safety without stifling rigor.
