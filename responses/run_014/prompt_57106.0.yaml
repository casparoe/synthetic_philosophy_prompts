  We are designing an in-class activity to illustrate Rousseau's argument about the structural effects of theater vs. festival, as articulated in the "Letter to d'Alembert on the Theater". The key point is that the arrangement of the gathering (theater: passive, separated audience vs. festival: active, communal participation) determines the effect on public mores, not the content.

