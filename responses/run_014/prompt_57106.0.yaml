answer: |-
  ### In-Class Activity: Experiencing Rousseau's Structural Critique  
  **Objective:** Illuminate Rousseau's argument that the *structure* of gathering (theater vs. festival) shapes civic health, independent of content.  

  ---

  ### Activity Design  
  **Core Structure:** Students experience two versions of the same scenario—first as a **theater**, then as a **festival**—with identical content but divergent arrangements.  

  #### **Setup**  
  - **Content:** A 3-minute scripted scene about a community dispute (e.g., neighbors debating whether to build a public garden).  
    - *Sample Dialogue*:  
      > *A: "The garden will unite us!"*  
      > *B: "But it costs too much!"*  
      > *C: "Let’s vote—every voice matters."*  
  - **Props:** None needed (avoid distracting from structure).  
  - **Room Setup:** Rearrangeable chairs.  

  #### **Phase 1: Theater (15 mins)**  
  - **Roles:**  
    - 3 actors (hired "substitutes"): Perform the scene.  
    - 13 audience members: Sit in rows, facing the "stage."  
    - Instructor: Plays "theater manager" (collects imaginary "tickets" at the door).  
  - **Rules:**  
    - Actors perform the scene on a demarcated "stage."  
    - Audience remains seated, silent, and immobile. No interaction permitted.  
    - After the scene, actors exit; audience writes private reflections.  
  - **Observable Record:**  
    - Track audience fidgeting, eye contact, or attempts to speak (forbidden).  
    - Note physical distance between actors/audience.  

  #### **Phase 2: Festival (15 mins)**  
  - **Roles:**  
    - All 16 students become participants. No audience.  
    - Instructor: Facilitates (no authority role).  
  - **Rules:**  
    - Chairs form a circle. Same scene is re-enacted, but now:  
      - Each line is delivered by the whole group in unison (choral speaking).  
      - Participants physically embody emotions (e.g., step forward for "unite us," step back for "costs too much").  
      - Eye contact required; no one may sit or withdraw.  
    - After the scene, the group debates the garden issue *as themselves* for 5 mins.  
  - **Observable Record:**  
    - Track participation levels (who speaks/moves), group cohesion, and discomfort.  
    - Note peer pressure (e.g., reactions to hesitant participants).  

  #### **Transition (2 mins)**  
  - Students jot quick notes comparing their experiences (to prime debrief).  

  ---

  ### Debrief (48 mins)  
  **Goal:** Connect activity to Rousseau’s text, then complicate the festival’s idealism.  

  #### **1. Map Activity to Rousseau’s Claims (15 mins)**  
  - **Theater as Isolation:**  
    - *Text*: "In the theater, we think we assemble, but it is there each isolates himself... [We] go to forget our neighbors." (*Letter*, Penguin ed., p. 126).  
    - *Activity Link*: Point out audience immobility, silence, and physical separation. Ask: *"How did the seating and rules shape your engagement? Did you feel part of a community?"*  
  - **Festival as Unity:**  
    - *Text*: "Let the spectators become actors... Let each see and love himself in the others" (p. 136).  
    - *Activity Link*: Highlight unison speaking, circular arrangement, and forced movement. Ask: *"How did collective action change your connection to the group?"*  
  - **Key Insight:** Emphasize **identical content**—differences arose solely from structure (bodies, roles, mobility).  

  #### **2. Explore the Festival’s Costs (20 mins)**  
  - **Confronting Discomfort:**  
    - *Ask*: "In the festival, could you opt out? How did it feel to be forced to participate?"  
    - *Map to Text*: Rousseau ignores how festivals demand transparency (p. 137: "No one may stand aloof"). Point out peer pressure observed in the circle.  
  - **Cost of Unity:**  
    - *Activity Evidence*: Note if students felt exposed, exhausted, or conformist during unison actions.  
    - *Theoretical Tension*: Argue that Rousseau’s festival sacrifices individual autonomy for cohesion. Ask: *"Is unity worth the loss of privacy or choice?"*  
  - **Synthesize**: "Rousseau’s festival builds community but risks coercion. The theater permits anonymity but breeds passivity. Which is more dangerous?"  

  #### **3. Failure Modes & Mitigation (8 mins)**  
  - **Risk 1: Superficial Engagement**  
    - *If students treat activity as "silly play"*: Mitigate by framing it as a "social experiment" pre-debrief.  
  - **Risk 2: Uneven Participation**  
    - *If dominant students monopolize the festival*: Assign rotating "facilitator" roles next time.  
  - **Risk 3: Misattributing Differences to Content**  
    - *If students focus on dialogue*: Reiterate in debrief: "The words were identical. What changed?"  

  #### **4. Unreproducible Element: Long-Term Mores (5 mins)**  
  - **Frank Limitation**:  
    > "This exercise captures *immediate* structural effects but cannot show Rousseau’s core concern: how theater *erodes civic virtue over time* by habituating people to passivity. You must supply this through textual analysis—e.g., his claim that theater replaces active citizenship with 'indolent spectatorship' (p. 120)."  

  ---

  ### Instructor Notes  
  - **Pre-Activity Prep**: Rehearse the scene with 3 volunteers beforehand to save time.  
  - **Timing**: Strictly enforce phases (theater: 15 mins, festival: 15 mins, debrief: 48 mins, buffer: 2 mins).  
  - **Textual Handout**: Provide key excerpts during debrief (e.g., pp. 120, 126, 136–137).  
  - **Outcome**: Students leave grasping Rousseau’s structural critique *and* its tensions—no verdict, just deepened inquiry.  

  **Rationale**: This design forces students to *live* Rousseau’s dichotomy, making abstract theory visceral. By holding content constant and spotlighting observable behaviors, it reveals how spaces construct citizenship—then complicates Rousseau’s idealism with the festival’s demands.
