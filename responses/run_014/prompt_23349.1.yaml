  2. **Prior Distribution**: The prior over θ is based on observing m = kN agents from the population for some constant k, leading to a prior variance σ^2 = O(1/N).
  3. **Payoff Structure**: We considered both linear and threshold public goods games, but the argument holds for any payoff function where the incremental benefit from the evidential effect scales at most linearly in the shift of the distribution of K (or the fraction of cooperators), which is O(1/N).

  Without the scaling of the prior variance with N, the argument does not go through.
answer: |-
  ### Argument Against Evidential Cooperation in Large N

  **Core Claim:** In a one-shot coordination dilemma with \(N\) autonomous agents, the evidential-cooperation argument fails to provide a rational basis for cooperation when \(N\) is very large. Even with weak pairwise correlation among agents (via a shared prior over an unknown cooperativeness parameter \(\theta\)), the evidential value of an agent's own action diminishes to insignificance as \(N\) grows. Consequently, the expected payoff gain from others' cooperation cannot justify the cost of cooperating.

  ### Setup and Assumptions
  1. **Game Structure**:  
     - \(N\) agents play a one-shot simultaneous-move game.  
     - Each agent \(i\) chooses action \(A_i \in \{C, D\}\) (Cooperate or Defect).  
     - There is an unknown population-level cooperativeness parameter \(\theta \in [0, 1]\), where \(\theta\) represents the probability that a randomly selected agent cooperates.  
     - Agents share a common prior belief about \(\theta\), denoted \(p(\theta)\), with mean \(\mu\) and variance \(\sigma^2\).  

  2. **Correlation Mechanism**:  
     - Actions are conditionally independent given \(\theta\): \(P(A_1, \dots, A_N \mid \theta) = \prod_{i=1}^N P(A_i \mid \theta)\).  
     - Specifically, \(P(A_i = C \mid \theta) = \theta\) for all \(i\).  

  3. **Evidential Cooperation Argument (ECA)**:  
     - An agent conditions on its own action to update its belief about \(\theta\).  
     - Cooperation (\(A_i = C\)) is evidence that \(\theta\) is high, which implies others are more likely to cooperate.  
     - Defection (\(A_i = D\)) is evidence that \(\theta\) is low, implying others are less likely to cooperate.  
     - The expected payoff for cooperation includes a term from others' cooperation, scaled by this evidence.  

  4. **Payoffs**:  
     - Let \(K\) be the number of cooperating agents *among the other \(N-1\) agents*.  
     - Payoff for cooperating: \(u_C(K)\).  
     - Payoff for defecting: \(u_D(K)\).  
     - Cooperation has a fixed cost \(c > 0\) (e.g., \(u_C(K) = f(K) - c\), while \(u_D(K) = g(K)\)).  
     - **Critical assumption**: The benefit from others' cooperation depends on \(K\) (e.g., linearly as in public goods games, or via thresholds).  

  5. **Scaling Requirement**:  
     - Analyze how the *evidential shift* (change in posterior belief about \(\theta\) due to one's own action) scales with \(N\).  
     - Show that the induced change in expected payoff becomes negligible as \(N \to \infty\).  

  ---

  ### Step-by-Step Argument

  #### Step 1: Posterior Belief Shift is Independent of \(N\)
  When agent \(i\) observes its own action, it updates its belief about \(\theta\) using Bayes' theorem:  
  - **If \(A_i = C\)**:  
    \[
    p(\theta \mid A_i = C) = \frac{P(A_i = C \mid \theta) p(\theta)}{P(A_i = C)} = \frac{\theta \cdot p(\theta)}{\mu},
    \]
    where \(\mu = E[\theta]\) is the prior mean. The posterior mean is:  
    \[
    E[\theta \mid A_i = C] = \frac{E[\theta^2]}{\mu} = \mu + \frac{\sigma^2}{\mu}.
    \]  
    The shift in mean is \(\Delta_C = E[\theta \mid A_i = C] - \mu = \sigma^2 / \mu\).  

  - **If \(A_i = D\)**:  
    \[
    p(\theta \mid A_i = D) = \frac{(1 - \theta) p(\theta)}{1 - \mu},
    \]
    \[
    E[\theta \mid A_i = D] = \mu - \frac{\sigma^2}{1 - \mu},
    \]
    with shift \(\Delta_D = \mu - E[\theta \mid A_i = D] = \sigma^2 / (1 - \mu)\).  

  **Key Insight**: Both \(\Delta_C\) and \(\Delta_D\) depend only on the prior moments (\(\mu\) and \(\sigma^2\)) and are *independent of \(N\)*.  

  #### Step 2: Evidential Effect on Others' Cooperation
  Agent \(i\) cares about \(K\) (cooperators among others). Given \(\theta\), \(K \sim \text{Binomial}(N-1, \theta)\). The expected value of \(K\) given \(\theta\) is \((N-1)\theta\).  

  - **Posterior expectation of \(K\) after conditioning on \(A_i = C\)**:  
    \[
    E[K \mid A_i = C] = E\left[E[K \mid \theta, A_i = C] \mid A_i = C\right] = E[(N-1)\theta \mid A_i = C] = (N-1) \left(\mu + \frac{\sigma^2}{\mu}\right).
    \]  
    The shift in \(E[K]\) due to cooperation is:  
    \[
    \Delta_K^C = E[K \mid A_i = C] - (N-1)\mu = (N-1) \frac{\sigma^2}{\mu}.
    \]  

  - **Relative shift (fractional change)**:  
    \[
    \frac{\Delta_K^C}{(N-1)\mu} = \frac{\sigma^2}{\mu^2}.
    \]  
    This is \(O(1)\) in \(N\) but scales the *mean*, not the *uncertainty*.  

  #### Step 3: Diminishing Marginal Impact of the Shift in Large \(N\)
  While \(\Delta_K^C\) grows linearly with \(N\), the *relevance* of this shift to the agent's payoff diminishes:  
  - **Variance of \(K\)**:  
    \[
    \text{Var}(K) = \text{Var}(E[K \mid \theta]) + E[\text{Var}(K \mid \theta)] = (N-1)^2\sigma^2 + (N-1)E[\theta(1 - \theta)].
    \]  
    For large \(N\), \(\text{Var}(K) \approx (N-1)^2\sigma^2 + (N-1)\mu(1 - \mu) = \Theta(N^2)\) (quadratic in \(N\)).  

  - **Signal-to-noise ratio of the shift**:  
    The shift \(\Delta_K^C = (N-1)\sigma^2 / \mu\) is linear in \(N\), but the standard deviation of \(K\) is \(\Theta(N)\). Thus:  
    \[
    \frac{\Delta_K^C}{\text{Std}(K)} \approx \frac{(N-1)\sigma^2 / \mu}{(N-1)\sigma} = \frac{\sigma}{\mu} = O(1).
    \]  
    The shift is a constant number of standard deviations, independent of \(N\).  

  - **Consequence for payoffs**:  
    - The agent's payoff depends on \(K\) (e.g., through \(u_C(K)\) or \(u_D(K)\)).  
    - For large \(N\), \(K\) is highly concentrated around its mean \((N-1)\mu\) by the Law of Large Numbers.  
    - The evidential shift \(\Delta_K^C\) moves the mean by \(O(N)\), but the distribution of \(K\) has width \(\Theta(N)\).  
    - **Critical point**: The *marginal change in expected payoff* due to the shift scales as \(O(1)\) or slower, while the cost \(c\) is fixed.  

  #### Step 4: Payoff Analysis and Cost Justification
  Consider two representative cases:  

  1. **Linear Payoffs (e.g., Public Goods Game)**:  
     Suppose \(u_C(K) = b \cdot \frac{K}{N-1} - c\) and \(u_D(K) = b \cdot \frac{K}{N-1}\).  
     - Expected payoff for cooperating (conditional on \(A_i = C\)):  
       \[
       E[u_C(K) \mid A_i = C] = b \cdot E\left[\frac{K}{N-1} \mid A_i = C\right] - c = b \left(\mu + \frac{\sigma^2}{\mu}\right) - c.
       \]  
     - Expected payoff for defecting (conditional on \(A_i = D\)):  
       \[
       E[u_D(K) \mid A_i = D] = b \cdot E\left[\frac{K}{N-1} \mid A_i = D\right] = b \left(\mu - \frac{\sigma^2}{1 - \mu}\right).
       \]  
     - Cooperation is preferred if:  
       \[
       b \left(\mu + \frac{\sigma^2}{\mu}\right) - c > b \left(\mu - \frac{\sigma^2}{1 - \mu}\right).
       \]  
       Simplifying, cooperation is rational if:  
       \[
       c < b \cdot \sigma^2 \left(\frac{1}{\mu} + \frac{1}{1 - \mu}\right) = b \cdot \frac{\sigma^2}{\mu(1 - \mu)}.
       \]  
       **For large \(N\)**: The right-hand side is \(O(1)\), so if \(c\) exceeds this fixed bound (e.g., if \(\sigma^2\) is small), cooperation fails. **But crucially, the bound does not scale with \(N\)**, so the cost \(c\) is not offset by growing benefits.  

  2. **Threshold Payoffs (e.g., Critical Mass Scenario)**:  
     Suppose cooperation pays only if \(K \geq T\), where \(T = \gamma N\) for \(\gamma \in (0,1)\). Let:  
     \[
     u_C(K) = \begin{cases} B - c & \text{if } K \geq T \\ -c & \text{otherwise} \end{cases}, \quad u_D(K) = \begin{cases} B & \text{if } K \geq T \\ 0 & \text{otherwise} \end{cases}.
     \]  
     - The key quantity is \(P(K \geq T \mid A_i = C)\). By the LLN, \(K/(N-1) \to \theta\) as \(N \to \infty\), so:  
       \[
       P(K \geq T \mid A_i = C) \approx P(\theta \geq \gamma \mid A_i = C).
       \]  
     - The shift in \(P(\theta \geq \gamma)\) due to \(A_i = C\) is:  
       \[
       \Delta_P = P(\theta \geq \gamma \mid A_i = C) - P(\theta \geq \gamma).
       \]  
       This shift is \(O(\sigma^2)\) (from the posterior shift) and *independent of \(N\)*.  
     - Expected payoff gain from conditioning on cooperation:  
       \[
       E[u_C \mid A_i = C] - E[u_D \mid A_i = D] \approx B \cdot \Delta_P - c.
       \]  
       **For large \(N\)**: \(\Delta_P = O(1)\), so \(B \cdot \Delta_P\) is bounded. If \(c > 0\) is fixed and \(B\) does not scale with \(N\), \(B \cdot \Delta_P\) is eventually dominated by \(c\).  

  ---

  ### Conclusion
  - **Evidential value vanishes in magnitude relative to uncertainty**:  
    While the absolute shift in \(E[K]\) grows with \(N\), the distribution of \(K\) becomes increasingly concentrated (variance \(\Theta(N^2)\)), so the shift's impact on payoffs does not scale with \(N\).  
  - **Cost cannot be justified for large \(N\)**:  
    The evidential shift in beliefs (and thus expected payoff) is \(O(1)\) in \(N\), while the cost \(c\) is fixed. For sufficiently large \(N\), the benefit from the shift (e.g., \(b \cdot \sigma^2 / \mu\) or \(B \cdot \Delta_P\)) is dwarfed by \(c\), making defection dominant.  
  - **Dependence on assumptions**:  
    1. Conditional independence of actions given \(\theta\).  
    2. Payoffs depend on \(K\) with no \(N\)-scaling in benefits (e.g., \(c\) fixed, \(B\) fixed).  
    3. Prior moments (\(\mu, \sigma^2\)) are \(N\)-independent (if \(\sigma^2\) scaled as \(1/N\), the argument would fail, but this requires prior knowledge to tighten with \(N\), which is not assumed here).  

  **Final Verdict**: Rational cooperation under ECA collapses for large \(N\) because the evidence from one's own action is statistically insignificant for shifting beliefs about population-wide behavior. The cost of cooperating is unjustifiable when scaled against diminishing marginal returns.
