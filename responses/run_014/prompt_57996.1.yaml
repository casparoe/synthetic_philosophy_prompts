prompt: |-
  ok so im trying to get clear on what i should even demand from an account of supererogation before i wade into all the back and forth, and i keep getting stuck

  can you write me the desiderata list, like what any adequate theory has to deliver if its going to be actually usable by normal people, say the organizers of a mutual aid network who need to decide what to require from members vs what to praise and reward but not require

  i care about a few weird cases so the list cant just be textbook stuff, it has to handle these:

  a lifeguard, Maya, who stays two extra hours in a storm after her shift ends because her replacement never shows, at some real risk to herself, versus just doing her job well. i want to call that supererogatory but not required, even if staying was clearly the better thing to do.

  a guy, Luis, who promised to drive his friend to the airport but blows off the promise to stop at a crash scene and help, which is better overall but breaks a duty. is that still going beyond duty or does breaking the smaller duty disqualify it.

  and the normalization worry, where if enough people in the group start donating like 20% of income or doing weekly night shifts, it starts to feel required, and then the theory seems to eat itself. i need a desideratum about that shift from heroic to expected.

  so for each requirement on your list, give me the case or reason behind it, and say which ones you think are non-negotiable vs which are just preferences of one camp, like Kantians vs consequentialists vs virtue people. and flag if you suspect some subset cant all be true together, that part matters most to me. also tell me which single requirement you think knocks out the most otherwise plausible views.

  dont give me a literature review or anything, just the criteria and why they matter, bullet list is fine. im gonna do the scoring myself later.

  oh and at the end, say what would change your mind about the list, like which argument or counterexample would make you drop or demote one of your non-negotiables, or where you think your reasoning is most likely to fail. teh whole point is i want to know how fragile the spec is.
reasoning: |-
  Okay, the user is trying to figure out what requirements a theory of supererogation must meet to be practical for real-world groups like mutual aid networks. They want a clear list of criteria, not a literature review. They mentioned three specific cases: Maya the lifeguard, Luis breaking a promise to help at an accident, and the normalization problem where frequent acts become expected.

  First, I need to identify the core desiderata. The user wants these to handle their cases and flag conflicts between them. They also want to know which are non-negotiable versus debatable among different philosophical schools. The key is to ensure the list is actionable for organizers who need to distinguish obligations from praiseworthy extras.

  Starting with the lifeguard case, Maya's action is supererogatory because it involves significant personal risk beyond her duty. So, one desideratum must be that supererogation involves going beyond basic duties, even if the action is better. For Luis, he breaks a promise to help in an emergency. Here, the theory must allow that breaking a minor duty for a greater good can still be supererogatory, not obligatory. The normalization problem requires a desideratum that prevents frequent acts from becoming duties, so the definition must include an element of sacrifice or optionality.

  Now, considering philosophical divides. Kantians might emphasize moral worth and intentions, while consequentialists focus on outcomes. Virtue ethicists look at character. The user needs to know which desiderata are shared across these views. For example, the boundary between duty and supererogation is crucial for all, but the cost-to-agent might be more emphasized by virtue ethicists.

  The user is concerned about conflicts between desiderata. For instance, demanding significant cost might clash with maintaining optionality in normalization cases. If an act becomes common, does its cost diminish? Also, the Luis case highlights tension between duty and supererogation when duties conflict. A theory must resolve whether breaking a duty for a greater good is still supererogatory or becomes obligatory.

  The most critical desideratum is the non-collapsibility into duty. Without this, supererogation disappears over time, which undermines the whole concept. This is probably the one that knocks out many theories, especially those that don't account for normalization.

  For fragility, the user wants to know what could challenge the list. If a counterexample shows that optionality and praiseworthiness can coexist without significant cost, that might force a rethink. Also, if all supererogatory acts could be framed as duties in some systems, the boundary desideratum might need reevaluation.

  The user's deeper need is practical application. They need a framework that mutual aid networks can use without philosophical confusion. They might be avoiding overly theoretical debates and want clear, actionable criteria. Ensuring the list addresses real-world scenarios like shifting expectations in communities is key. Highlighting conflicts helps them anticipate problems in implementation.
answer: |-
  Here’s a distilled list of desiderata for a usable theory of supererogation, grounded in your cases and normalization worry. Non-negotiables are marked with **★**. Conflicts are flagged.

  ---

  ### **Core Desiderata for a Usable Supererogation Theory**
  1.  **★ Boundary Between Duty & Supererogation**  
      *Why*: Must clearly distinguish what’s required (enforceable) vs. optional-but-praiseworthy.  
      *Case*: Maya’s storm rescue isn’t job duty; Luis’s crash aid isn’t required despite promise-breaking.  
      *Non-negotiable*: Without this, supererogation collapses. Kantians, consequentialists, and virtue theorists all need *some* version of this line (though they draw it differently).  

  2.  **★ Non-Collapsibility into Duty (Anti-Normalization)**  
      *Why*: Prevents "expected" supererogatory acts from becoming obligatory through common practice.  
      *Case*: If 20% donations become standard, they shouldn’t morph into duties—or the concept self-destructs.  
      *Non-negotiable*: Essential for preserving moral flexibility and avoiding burnout. Virtue ethics often struggles here; consequentialism risks collapse if "optimal" becomes "required."  

  3.  **Praiseworthiness Without Requirement**  
      *Why*: Supererogatory acts must merit admiration/reward but not punishment for omission.  
      *Case*: Maya deserves praise (and maybe hazard pay), but firing her for leaving on time would be unjust.  
      *Debatable*: Kantians tie praiseworthiness to motive; consequentialists to outcomes. But all camps accept this core idea.  

  4.  **Cost/Sacrifice to the Agent**  
      *Why*: Explains why the act isn’t demanded—it imposes significant personal burden.  
      *Case*: Maya’s risk, Luis’s broken promise (social cost), 20% donors’ financial sacrifice.  
      *Debatable*: Consequentialists may downplay cost if net good is high; virtue ethics emphasizes character in facing cost. **Crucial for your normalization worry** (high cost prevents expectation).  

  5.  **Permissibility of Duty-Violation for Greater Good**  
      *Why*: Allows breaking minor duties for supererogatory acts without framing them as obligatory.  
      *Case*: Luis isn’t *required* to break his promise for the crash, but doing so is supererogatory (not blameworthy).  
      *Hotly Contested*: Kantians often reject this (duties are inviolable). Consequentialists/virtue theorists may allow it. **Your Luis case demands this**.  

  6.  **Context-Sensitivity**  
      *Why*: What’s supererogatory depends on relationships, roles, and circumstances.  
      *Case*: Maya’s act is supererogatory *because* her shift ended; a nurse in a pandemic may have expanded duties.  
      *Shared*: All major camps accept context matters, but disagree on *how* (e.g., roles vs. outcomes vs. virtues).  

  ---

  ### **Key Conflicts & Tensions**
  - **★ Boundary vs. Anti-Normalization**: If duties expand to absorb common supererogation (normalization), the boundary vanishes. **This is the core tension in your mutual aid example**.
  - **Cost vs. Luis Case**: If cost is too strictly defined (e.g., only physical risk), Luis’s social/reputational sacrifice might not count. But if cost is too broad, *any* inconvenient good act becomes supererogatory.
  - **Permissibility vs. Duty (Kantians)**: Desideratum 5 is incompatible with strict deontology. If you need Luis to count, Kantianism may fail without modification.

  ---

  ### **The Desideratum That Knocks Out Plausible Views**
  **★ Non-Collapsibility into Duty (Anti-Normalization)**. Many theories struggle:  
  - **Act Consequentialism**: If an act produces net good, why isn’t it always required? Normalization is inevitable.  
  - **Rule Consequentialism**: If enough people do X, a rule requiring X becomes optimal.  
  - **Rigid Deontology**: Fixed duties can’t adapt to shifting social expectations (e.g., 20% donations becoming standard).  
  *This is the hardest desideratum to satisfy* without building in explicit anti-collapse mechanics (e.g., "sacrifice" thresholds).

  ---

  ### **Where My Reasoning is Fragile / What Would Change My Mind**
  1.  **Cost as Essential**: If you presented a robust case where an act with *no discernible cost to the agent* (e.g., pushing a button to save a life) is widely seen as supererogatory, I’d demote Cost (Desideratum 4) from near-core to optional.  
  2.  **Anti-Normalization**: If someone demonstrated a real-world mutual aid system where frequent high sacrifice *never* created social pressure or expectation (e.g., via strong cultural norms of autonomy), I’d question if this needs to be baked into the *theory* itself.  
  3.  **Luis Case (Duty-Violation)**: A compelling counterexample where breaking a minor duty for greater good is *blameworthy* (e.g., "He should have called another helper!") might force me to split this into a subtype or add nuance.  
  4.  **Biggest Vulnerability**: **Assuming praiseworthiness implies non-requirement**. If someone argued that some duties *are* praiseworthy (e.g., heroic duties of role), the core boundary (Desideratum 1) could blur. This is where virtue ethics often pushes back hardest.

  **Your scoring sheet should test for these tensions**. Prioritize the **★** items—without those, the theory fails your use case. Luis’s case (Desideratum 5) is a major differentiator between theories. The normalization worry (Desideratum 2) is the acid test for practicality.
