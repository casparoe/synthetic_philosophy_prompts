  For the demographic cases, the Americas (3) led to irreplaceable loss of cultures, while the Black Death (6) allowed recovery. So the ceiling was altered in 3 but not in 6. Ratchet is permanent in both, but substitutability isn't the issue here; it's the uniqueness of what was lost. 

  The principle needs clauses that address irreversibility (ratchet), non-substitutability (unique actors or timing), and ceiling alteration (changing what's possible long-term). However, the nukes case complicates substitutability. So perhaps substitutability isn't a deal-breaker if the ratchet creates a new, permanent risk that alters the ceiling. 

  Clauses could be: 
  - **Irreversible Loss or Gain (Ratchet)**: The change must be permanent, preventing a return to the prior state. 
  - **Non-Substitutable Path**: The specific actor or timing was crucial; no other path could achieve the same outcome. 
  - **Ceiling Alteration**: The change modifies the highest achievable future potential, not just the speed or path. 

  But nukes challenge non-substitutability. So maybe ceiling alteration combined with irreversibility is sufficient, even if substitutable. The bomb created a new existential risk, permanently altering the ceiling. Meiji didn't alter the ceiling; Japan caught up but didn't change the global trajectory fundamentally. 

  For the Black Death vs. Americas: The loss of indigenous knowledge and systems in the Americas was irreplaceable (ceiling altered), while Europe recovered post-Black Death, maintaining the same developmental ceiling. 

  Printing press (10): If it accelerated developments but didn't alter the ceiling (e.g., mass literacy might have happened slower but still occurred), then it's not pivotal. However, the user is unsure. The principle might judge it as not pivotal because other methods (like woodblock printing) could have led to similar outcomes, albeit slower. 

  Prospective cases: 
