answer: |-
  ### Analysis and Principle Development

  Your difficulty arises from tension between two dimensions: **permanence of change** (ratchet) versus **path dependence** (substitutability and ceiling effects). Case 2 (nukes) forces a critical insight: *substitutability does not negate pivotality when the ratchet creates irreversible, ceiling-altering risks*. The bomb made civilizational extinction *feasible*; even if others would have built it later, the *first* deployment permanently expanded the set of possible futures to include terminal outcomes. Similarly, Case 10 (printing) fails because it accelerated existing trajectories without altering Europe’s achievable ceiling. Conversely, Case 8 (Meiji) was reversible and substitutable because Japan’s modernization didn’t change the global frontier—only who reached it first.  

  Cases 3 (Americas) and 6 (Black Death) diverge on **irreplaceability of loss**. The extinction of Mesoamerican epistemologies and institutions deleted unique civilizational options (ceiling lowered). Post-plague Europe retained recoverable knowledge and institutions; its "ceiling" of possible development paths was unchanged.  

  This yields a principle with three ordered clauses:  

  #### **The Irreversible Frontier-Shift Principle**  
  A juncture is pivotal iff:  
  1. **Irreversibility**: The change cannot be undone by later actors (ratchet).  
  2. **Frontier Alteration**: It expands or contracts the set of *maximally reachable long-term futures* (ceiling), not merely the speed or path to existing frontiers.  
  3. **Non-Substitutability (contingent)**: The specific actor/timing was essential *only* when the change is a pure gain (e.g., Case 4, smallpox). For losses or risks (Cases 2, 3, 5), substitutability is irrelevant—the mere feasibility of the outcome alters the frontier.  

  #### Conflict Resolution  
  Clauses are applied in order. Irreversibility (1) is mandatory. Frontier Alteration (2) is sufficient for pivotality when the change introduces irreversible risks or losses (e.g., nukes make extinction possible; smallpox eradication removes a threat). Non-Substitutability (3) *only* gates cases where the change is a net gain without inherent risks.  

  #### Verdicts Overturned  
  - **Case 9 (Sarajevo)**: You judged "not pivotal" due to substitutability. But Clause 2 applies: the war’s *scale* (enabled by industrialization) permanently narrowed civilizational options (e.g., ended fragile pre-1914 globalization). Pivotal.  
  - **Case 6 (Black Death)**: Retain "not pivotal"—no ceiling shift.  

  #### Cost of Simplicity  
  Sacrifices substitutability as a universal veto. Justification: existential risks (Case 2) or civilizational losses (Case 3) are pivotal even if "inevitable" because *when* they occur determines the baseline for all subsequent actions.  

  #### Printing Press (Case 10) Resolution  
  **Not pivotal**. Accelerated information diffusion but didn’t alter Europe’s *achievable ceiling*: mass literacy, the Reformation, and early modern science would likely have emerged via other technologies (e.g., cheaper paper, improved lithography) or slower manuscript circulation. Decisive feature: substitutable *and* no frontier shift.  

  #### Prospective Junctures  
  - **Single-lab frontier AI**: Pivotal. *Irreversibility* (if deployed, could concentrate power permanently); *Frontier Alteration* (creates singleton risk/opportunity).  
  - **Open-weight release**: Not pivotal. *Substitutability* (others would achieve similar capability soon); no frontier shift.  
  - **Genome editing agreement**: Pivotal if bans heritable edits. *Irreversibility* (prevents germline changes); *Frontier Alteration* (locks out certain human evolutionary paths).  

  Design sensitivity: The genome agreement verdict flips if it allows edits (no ratchet) or lacks enforcement (reversible).  

  #### Are We at a Hinge?  
  **Yes, conditionally**. The principle implies pivotality when:  
  - **For**: Evidence of *asymmetric irreversibility* (e.g., one lab near AGI while rivals lack compute; climate tipping points breached).  
  - **Against**: Evidence of *distributed inevitability* (e.g., multiple AI labs at parity; genome editing tools democratized).  

