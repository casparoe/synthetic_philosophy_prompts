  In the JSON, clauses would be: irreversibility, ceiling alteration, and non-substitutability. Conflict resolution: irreversibility is necessary; ceiling alteration is sufficient even if substitutable. Overturned verdicts: maybe Sarajevo if considered pivotal by some, but the user has it as not, so retained. Printing resolved as not pivotal. 

