  Okay, the user is asking for help in setting up criteria to evaluate different theories on how to make moral decisions when you're not sure which moral principles are correct. They want these criteria to be practical—something that can guide real decisions without needing all philosophical disagreements resolved first. 

  Hmm, the user seems to be an academic or researcher, probably in philosophy or ethics, given how technical the query is. They’re building a framework to compare theories, so they need this to be rigorous but also applicable to concrete cases. The two scenarios they provided—about fund allocation and medical decisions—are meant to test the theories against real-world dilemmas. 

  First, I need to unpack what they’re really after. They’re not asking for the "right" theory but for standards to judge competing ones. That means the desiderata have to be neutral enough to apply to different approaches. They also flagged four specific challenges: comparing rival moral demands, separating confidence from stakes, balancing moral risk, and handling justification to others. 

  The user’s examples are cleverly designed to stress-test these points. The fund director case pits impartiality against local loyalty, with added tension around how seriously to treat waste. The clinician case forces a choice between past autonomy and present well-being, with asymmetric risks—mistakes could harm the patient gravely or just annoy them. 

  I should structure the desiderata around their core asks but also anticipate unspoken needs. For instance, they might want the framework to:  
  - Avoid collapsing into standard decision theory (since moral uncertainty is unique).  
  - Acknowledge psychology (e.g., how people actually weigh confidence vs. stakes).  
  - Handle "deep" disagreements where values aren’t just weights but fundamentally conflict.  

  The tension points will matter too. Like, how can a theory be sensitive to stakes without overcautiousness? Or weigh confidence without ignoring extreme risks? And justifying actions to others might clash with doing what’s objectively right under uncertainty.  

  For the conclusion, I’ll need to flag which criteria are non-negotiable (like practicality and avoiding absurd extremes) and which are debatable (like specific weighting methods). The strongest constraint is probably proportionality—it kills theories that ignore extreme risks or trivial stakes.  

  Finally, the two broad families of theories (weighting vs. max-credibility) will show how the desiderata play out. Weighting handles stakes better but might "split the difference" incoherently; max-credibility is simpler but could recklessly ignore minority views with grave risks. That contrast should help the user see trade-offs.
answer: |-
  Here is a set of desiderata for evaluating theories of action under moral uncertainty, developed with your parameters in mind, along with rationales, applications, and analysis:

  **Core Desiderata:**

  1.  **Practical Action Guidance:** The theory must output a concrete prescription for action (or a clear ranking of options) in specific choice situations, using the agent's credences and the specifications of rival moral outlooks as inputs.
      *   **Rationale:** The core purpose of the theory. Without this, it fails to address the agent's dilemma. Decision theory requires a choice rule. (Conceptual Boundary: Distinguishing a normative theory from mere description or meta-ethical analysis).
      *   **Fund Director:** Must tell the director *how* to allocate the budget (e.g., 70% locally, 30% distantly, or choose one strategy entirely).
      *   **Clinician:** Must prescribe whether to follow the advance directive or override it based on current interests.

  2.  **Sensitivity to Credence:** The recommended action must vary appropriately with the agent's degree of belief (credence) in the rival moral outlooks.
      *   **Rationale:** Ignoring confidence levels treats extreme skepticism and near-certainty identically, violating basic epistemic rationality. Higher credence in an outlook demanding action X should generally make choosing X more likely. (Conceptual: Rational action under uncertainty requires sensitivity to evidence/belief strength).
      *   **Fund Director:** If the director becomes highly confident in impartiality, the theory should shift recommendations towards more distant aid (ceteris paribus).
      *   **Clinician:** If confidence in the "precedent autonomy" outlook increases, following the directive should become more recommended.

  3.  **Sensitivity to Stakes:** The recommended action must vary appropriately with the magnitude of the potential moral gains or losses predicted by each outlook under each option.
      *   **Rationale:** Ignoring stakes treats minor moral inconveniences identically to catastrophic wrongs, leading to absurd insensitivity. A theory must account for "how wrong" something would be *if* a given outlook is true. (Conceptual: Distinguishing trivial from severe moral errors; Economic/Decision Theoretic: Basic expected utility requires weighting outcomes by their magnitude/disutility).
      *   **Fund Director:** The outlooks' disagreement on the severity of wastefulness must impact the decision. If waste is seen as catastrophic by one view, avoiding it becomes more critical, even if the credence in that view is moderate.
      *   **Clinician:** The asymmetric burdens are crucial. Overriding the directive if autonomy is decisive might be a profound violation, while following it if experiential interests are decisive might cause severe suffering. The theory must weigh these potential wrongs.

  4.  **Proportionality:** The influence of an outlook on the overall decision should be proportional to the *product* of the agent's credence in it and the *stakes* (magnitude of potential moral value/loss) it assigns to the actions under consideration.
      *   **Rationale:** This integrates Desiderata 2 & 3 correctly. High credence in a low-stakes outlook shouldn't dominate low credence in a high-stakes outlook, and vice-versa. Avoiding both excessive caution (overweighting tiny risks of catastrophe) and objectionable indifference (ignoring significant risks of serious wrongs). (Decision Theoretic: Foundational principle of expected value maximization; Psychological: Reflects intuitive weighting of likelihood and impact, though biases exist).
      *   **Fund Director:** If the associative outlook assigns *huge* moral disvalue to "wasting" funds on distant strangers (seeing it as betrayal), even moderate credence might justify significant local bias. Conversely, high credence in impartiality combined with its view that local bias causes significant harm (high stakes) pushes towards distant aid.
      *   **Clinician:** Low credence in the "experiential interests" outlook might still justify overriding the directive *if* the potential suffering predicted by that outlook is extreme, while high credence in the "precedent autonomy" outlook combined with its view that overriding is a profound violation pushes towards following it. Proportionality forces the asymmetric burdens to directly shape the choice.

  5.  **Non-Domination by Extreme Views:** The theory should not be easily hijacked by an outlook to which the agent assigns extremely low credence, simply because that outlook posits infinitely high stakes (e.g., "Donating to charity X is infinitely wrong").
      *   **Rationale:** Preserves the link between credence and influence. Without this, any tiny risk of infinite disvalue paralyzes action (excessive caution/moral fanaticism). (Conceptual: Maintaining the role of credence; Decision Theoretic: Addressing problems of infinitarian paralysis).
      *   **Fund Director:** An outlook claiming that *any* aid to distant strangers merits eternal damnation (infinite disvalue), held with 0.001% credence, shouldn't automatically force all funds locally.
      *   **Clinician:** An outlook claiming overriding *any* directive is an unforgivable sin (infinite disvalue), held with minimal credence, shouldn't force compliance even if the patient is screaming in avoidable agony.

  6.  **Distinction Between Correctness and Justification:** The theory should account for the difference between acting *correctly* (doing what the true moral theory requires) and acting *justifiably* under uncertainty (making the best decision given one's epistemic limitations and the competing demands). Justifiability should depend on the agent's epistemic position and the reasonableness of their process.
      *   **Rationale:** Even good-faith agents with reasonable credences can act wrongly if their best judgment is mistaken. Conversely, acting correctly by luck isn't justified if the reasoning was reckless. This matters for blame, responsibility, and self-assessment. (Conceptual: Epistemology of justification vs. truth; Moral: Separating culpability from outcome).
      *   **Fund Director:** The director might allocate funds locally based on a sincere, reasonable weighing of credences and stakes. If impartialism is true, this was wrong, but the director acted justifiably. If they allocated locally solely out of bias, ignoring strong impartialist arguments (high credence/high stakes), even if associative ethics is true, their action was less justifiable.
      *   **Clinician:** Following the directive after careful weighing might be justifiable even if it causes suffering (if autonomy is false). Overriding it recklessly, ignoring strong autonomy arguments, might be unjustifiable even if it prevents suffering (if experiential interests are false).

  7.  **Inter-Personal Justifiability (Aspirational):** The recommended action should, ideally, be defensible *to others* holding different moral outlooks, based on shared norms of rational decision-making under uncertainty, even if they disagree with the substantive moral views or the outcome.
      *   **Rationale:** Promotes social coordination, reduces conflict, and reflects a commitment to public reason. While full agreement on the act is impossible under fundamental disagreement, justifiability focuses on the *reasonableness of the decision process*. (Conceptual: Distinguishing substantive moral agreement from procedural justification; Political/Social: Need for cooperation amidst pluralism).
      *   **Fund Director:** The director should be able to explain: "I weighed my belief that local priority is permissible (X%) against my belief in impartiality (Y%), and considered how seriously each view treats waste vs. unmet distant needs. Given the high stakes associative ethics assigns to local neglect and waste, I prioritized locally, though I funded some distant projects recognizing the impartialist concern." An impartialist might still dislike the outcome but acknowledge the process was reasonable.
      *   **Clinician:** "Given my significant credence in precedent autonomy and the profound violation overriding represents under that view, combined with my assessment that the potential suffering under the experiential view, while serious, was not *clearly* catastrophic in this case, I followed the directive. I monitored closely for distress." An advocate for current interests might disagree but see the reasoning as responsible.

  **Analysis & Conclusion:**

  *   **Central Desiderata (Likely Non-Negotiable):** Practical Action Guidance (1), Sensitivity to Credence (2), Sensitivity to Stakes (3), Proportionality (4), and the Distinction Between Correctness and Justification (6). These form the core response to the problem of *acting* under moral uncertainty. Proportionality (4) is arguably the most central and restrictive, as it explicitly integrates credence and stakes – the fundamental inputs – and rules out many simplistic approaches.
  *   **Potentially Contested Desiderata:**
      *   *Non-Domination by Extreme Views (5):* Strict utilitarians or those embracing "maximin" under deep uncertainty might accept more influence from low-credence/high-stakes views. Others see it as essential to avoid paralysis.
      *   *Inter-Personal Justifiability (7):* While desirable, some theories (e.g., pure "maximize expected moral value") prioritize the agent's own perspective over public defense. Its centrality depends on the weight given to social/political dimensions.
  *   **Key Tensions:**
      *   *Proportionality (4) vs. Non-Domination (5):* Strict proportionality could allow a *sufficiently* high-stakes/low-credence view to dominate. Non-Domination requires limiting proportionality's reach, often via ad-hoc thresholds or discounting extreme stakes. (e.g., Capping disvalues, ignoring infinitarian claims, or requiring a minimum credence floor for high-stakes influence).
      *   *Sensitivity to Stakes (3)/Proportionality (4) vs. Inter-Personal Justifiability (7):* Deeply conflicting views of stakes (e.g., associative "betrayal" vs. impartial "inefficiency") make it hard to justify the weight given to certain stakes to holders of rival views. Justification might require downplaying or translating the stakes.
  *   **Strongest Restriction:** **Proportionality (4)**. It forces the theory to engage directly and quantitatively (or ordinally) with the core inputs (credence and stakes) and rules out theories that ignore either one (e.g., follow-the-most-probable) or treat them independently. It defines the core "weighing" mechanism.

  **Illustration of Two Families:**

  1.  **Weighting (e.g., "My Favorite Theory" or Maximize Expected Choice-Worthiness - MEC):** Applies Desiderata 2, 3, and 4 directly by calculating the expected moral value of each action, weighting each outlook's evaluation by the agent's credence. Handles asymmetric stakes well (Clinician: weighs catastrophic suffering risk against profound violation risk). Faces challenges with Non-Domination (5) (needs safeguards against infinitarianism) and Inter-Personal Justifiability (7) (if stakes are deeply contested, the calculation may seem opaque or question-begging to opponents).
  2.  **Follow Most Credible (e.g., Myopic or Threshold Views):** Satisfies Practical Guidance (1) and Sensitivity to Credence (2) (if credence is above threshold). Fails Sensitivity to Stakes (3) and Proportionality (4) dramatically. In the Clinician case, if credence in autonomy is 51%, it follows the directive regardless of whether overriding risks mild discomfort or agonizing torture. Ignores asymmetric burdens. Handles Non-Domination (5) trivially (ignores low-credence views) but fails the core task of weighing competing moral demands under uncertainty. Justifiability (7) is weak to opponents whose view is ignored despite significant credence/stakes.

  Proportionality (4) is the crucial filter: Weighting theories satisfy it (by design), while Follow-Most-Credible theories fundamentally violate it. This makes Proportionality the strongest constraint on viable theories.
