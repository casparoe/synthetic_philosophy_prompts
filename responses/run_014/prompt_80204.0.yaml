answer: |-
  ### Anchoring Procedure for Mechanism Events in Prediction Markets

  **Philosophical Grounding**:  
  This procedure is based on the *Principal Principle* (David Lewis): rational credence in an event should equal its objective chance, conditional on your total evidence. A "defeater" is evidence that either (1) the chance is not what you think (*undermining defeat*), or (2) the event isn't generated by the assumed process (*misalignment defeat*). Defeaters override the anchor. Steps (a)–(d) are structured to minimize bias, but **Step 3 is a judgment call**—it relies on the analyst's calibrated skepticism. The procedure misfires when:  
  - Analysts mistake noise for a defeater (e.g., overreacting to random streaks).  
  - Analysts ignore subtle contextual evidence (e.g., overlooking a magician's reputation).  
  - Judgment calls in Steps 1/3 are skewed by cognitive biases (e.g., gambler’s fallacy).

  ---

  ### Procedure  
  *Time limit: 10 minutes. End with a 1-line recommendation.*  

  1. **Step 1: Objective Probability Check (1 min)**  
     - **Question**: Is the outcome produced by a process with a *genuine, in-principle knowable* probability (e.g., dice, certified lottery, weather model)?  
       - *Yes*: Proceed to Step 2.  
       - *No* (e.g., elections, court rulings): Stop. **Recommendation: "List as judgment event (no objective probability)."**  
     - **Judgment call**: Misfires if a process is falsely assumed random (e.g., a "random" number generator with backdoors).  

  2. **Step 2: Knowledge Reliability Check (2 min)**  
     - **Question**: Is the analyst’s stated probability (e.g., 1/38 for roulette) grounded in a *reliable, verifiable source* (e.g., math, manufacturer specs, peer-reviewed model)?  
       - *Yes*: Proceed to Step 3.  
       - *No* (e.g., probability is estimated from thin data): Stop. **Recommendation: "List as judgment event (insufficient knowledge of chance)."**  
     - **Judgment call**: Misfires if analysts conflate "known" probabilities with folk wisdom (e.g., assuming a coin is fair without testing).  

  3. **Step 3: Defeater Check (5 min)**  
     - **Question**: Is there evidence that either:  
       (i) The *true chance differs* from the stated probability, or  
       (ii) The *process is misaligned* with the assumed mechanism?  
     - **Test for defeaters**:  
       - *Direct evidence* (e.g., lab tests showing a biased die, video of rigging): **Strong defeater**.  
       - *Contextual evidence* (e.g., a magician’s reputation, wheel maintenance logs): **Moderate defeater** if credible and specific.  
       - *Statistical anomalies* (e.g., 11 reds in roulette): **Weak defeater** *only* if:  
         (a) The anomaly is extreme (p < 0.01 under the null hypothesis), *and*  
         (b) It is corroborated by non-statistical evidence (e.g., wheel damage).  
       - *Otherwise*: Not a defeater.  
     - **Decision**:  
       - *No defeater*: Proceed to Step 4a.  
       - *Strong/moderate defeater*: Proceed to Step 4b.  
       - *Weak defeater*: Proceed to Step 4c.  
     - **Judgment call**: Misfires if noise is overvalued (e.g., streaks alone) or undervalued (e.g., ignoring a croupier’s history of tampering).  

  4. **Step 4: Final Recommendation (2 min)**  
     - **Step 4a (No defeater)**: **Recommendation: "Anchor at [stated probability]."**  
     - **Step 4b (Strong/moderate defeater)**: **Recommendation: "List as judgment event (defeater: [state evidence])."**  
     - **Step 4c (Weak defeater)**: **Recommendation: "Anchor at [stated probability] (weak defeater noted: [state evidence])."**  
       - *Rationale*: Weak defeaters are recorded but don’t override the anchor—they inform risk but lack conclusive force.  

  ---

  ### Test Cases  

  #### **Case 1: 1-in-38 number on a fresh, certified wheel**  
  - **Step 1**: Objective probability? Yes (roulette is a known random process).  
  - **Step 2**: Knowledge reliable? Yes (1/38 is mathematically derived from wheel specs).  
  - **Step 3**: Defeater? None (fresh certification means no bias/misalignment evidence).  
  - **Recommendation**: **"Anchor at 1/38."**  
  - **Desk preference**: ✅ Matches. Analysts should defer to the certified mechanism.  

  #### **Case 2: Same wheel after an 11-red streak**  
  - **Step 1**: Objective probability? Yes (same as Case 1).  
  - **Step 2**: Knowledge reliable? Yes (red probability is 18/38, per wheel specs).  
  - **Step 3**: Defeater?  
    - *Evidence*: 11-red streak (p ≈ 0.0004 under fair wheel).  
    - *Corroboration?* None (no maintenance issues, tampering reports, or wheel damage).  
    - **Verdict**: Weak defeater (extreme but uncorroborated).  
  - **Recommendation**: **"Anchor at 18/38 (weak defeater noted: 11-red streak)."**  
  - **Desk preference**: ✅ Matches. The streak is noise—traders are wrong to demand adjustment ("red is due"), and statisticians are wrong to call it a wheel defect without evidence. Anchoring stands with a risk note.  

  #### **Case 3: Coin flip by a magician with a trick coin (no inspection)**  
  - **Step 1**: Objective probability? Yes (coin flips have a knowable chance).  
  - **Step 2**: Knowledge reliable? **No**. The magician’s reputation implies likely misalignment, and the coin can’t be inspected.  
  - **Stop at Step 2**: **Recommendation: "List as judgment event (insufficient knowledge of chance)."**  
  - **Desk preference**: ✅ Matches. Reputation is contextual evidence of misalignment—this *isn’t* the assumed process. Forcing an anchor (e.g., 0.5) would be reckless.  

  ---

  ### Why This Works  
  - **Efficiency**: Focuses on quick wins (Steps 1/2) and reserves time for defeater analysis (Step 3).  
  - **Bias mitigation**: Explicitly flags statistical noise as weak, blocking gambler’s fallacy. Forces documentation of defeaters.  
  - **Safety net**: Defaults to judgment events when knowledge or process integrity is in doubt.  
  - **Desk alignment**: Balances empiricism with skepticism—only overrides anchors with evidence, not feelings.
