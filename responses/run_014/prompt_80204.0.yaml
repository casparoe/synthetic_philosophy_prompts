prompt: |-
  I run the calibration desk at a small prediction market, and I need a written procedure my junior analysts can follow when we list mechanism events — events whose outcomes are produced by a process with a genuine, in-principle knowable probability, such as lottery draws, coin flips, dice, sports games, or the weather. We list a few dozen of these a week, a bad anchor can cost us real money when the market trades against us, and the final call on each listing has to be signed off by me, so the procedure needs to run in under ten minutes and end in a one-line recommendation I can act on. We keep getting burned in two directions: junior analysts override a known probability with their own feel (refusing to list a 1-in-38 number because it "looks cold"), and senior analysts won't move a probability when the evidence that the process is not what we think is thin but persistent — a roulette table that has just run an 11-red streak, where our traders insist we leave the odds at 18/38 because each spin is independent, and our in-house statisticians insist the streak is evidence about the wheel, not a sign that red is "due."

  Please write the procedure. It should take a proposed mechanism-event listing and decide, in order: (a) whether there is a well-defined objective probability to defer to at all, or whether the event is really a judgment event (an election, a court ruling, a replication result) for which no such probability exists in the same sense; (b) whether the analyst's knowledge of that probability is good enough to anchor on; (c) whether the analyst's other evidence counts as what the philosophy of probability calls a defeater — evidence that the probability is not what they think it is, or that the event is not actually generated by the process they think — and, if so, how to treat it; and (d) when the procedure stops deferring and hands the decision to human judgment, with the reason written down. Ground it in the literature on the relationship between objective chance and rational belief: I know the core idea is that your degree of belief in an event should match its objective probability, conditional on the totality of what you know, unless you have some special evidence to the contrary, but I want the procedure to be honest about which steps are real constraints and which are judgment calls dressed up as steps, and to say explicitly where it will misfire. Then run it on three cases — a 1-in-38 number on a fresh, certified wheel; the same wheel after the 11-red streak; and a coin flip we are about to list, where the flipper is a magician known for trick coins and we have no way to inspect the coin before the flip — and for each, say whether the recommendation is the one the desk would prefer.
reasoning: |-
  We are creating a procedure for deciding the anchor probability for a mechanism event in a prediction market. The procedure must be efficient (under 10 minutes) and end with a one-line recommendation. It must address the following:

  (a) Determine if there is a well-defined objective probability (vs. judgment event).
  (b) Assess if the analyst's knowledge of that probability is sufficient to anchor on.
  (c) Evaluate if there is any defeater evidence (evidence that the probability is not as thought, or that the event isn't generated by the assumed process) and how to treat it.
  (d) Specify when to stop deferring to the objective probability and hand over to human judgment, with the reason documented.

  The procedure is grounded in the principle that one's degree of belief (credence) should equal the objective chance, conditional on total evidence, unless there is a defeater.

  We'll structure the procedure in steps:

  **Procedure for Anchoring Mechanism Events**

  **Step 1: Is there a well-defined objective probability?**
     - Check if the event is generated by a process with a known, stable, and in-principle knowable probability distribution (e.g., lottery, dice, certified roulette wheel, fair coin flip, weather model). If yes, proceed to Step 2.
     - If not (e.g., election, court ruling, replication result), then this is a judgment event. Stop and recommend: "List as judgment event. No anchor set."
     - *Note: This step is a judgment call. It misfires when the process is claimed to be random but is actually deterministic and unknown (e.g., a magician's trick) or when the probability distribution is not well-defined (e.g., some sports events without clear odds).*

  **Step 2: Is the analyst's knowledge of the probability good enough?**
     - The analyst must state the assumed probability and the source (e.g., 1/38 for a single number in roulette, based on the wheel having 38 slots; 0.5 for a fair coin). 
     - Verify that the source is reliable and the probability is well-established (e.g., by mathematical derivation, manufacturer specification, or authoritative reference). If yes, proceed to Step 3.
     - If the probability is not known with sufficient certainty (e.g., the analyst is unsure of the number of slots on the wheel, or the coin is bent but the degree is unknown) then stop and recommend: "Insufficient knowledge of objective probability. List as judgment event."
     - *Note: This step is a judgment call. It misfires when the analyst is overconfident in a flawed source (e.g., a misprinted rulebook) or underconfident in a valid one.*

  **Step 3: Check for defeaters**
     - A defeater is evidence that either:
        (i) The objective probability is different from the one assumed (e.g., the roulette wheel is biased, the coin is unfair) OR
        (ii) The event is not actually generated by the assumed process (e.g., the lottery draw is rigged, the magician will use a trick).
     - Evaluate the evidence. Consider:
          - **Strength**: How strong is the evidence? (e.g., a single anomaly vs. a pattern, direct vs. indirect)
          - **Plausibility**: How plausible is the defeater? (e.g., based on history, context, or expert opinion)
          - **Independence**: Is the evidence independent of the process's inherent randomness? (e.g., a streak of reds in roulette is within the expected variation and not by itself a defeater, but a video showing a magnet under the table is.)
     - **Categories of defeaters**:
        - **Direct evidence of bias**: e.g., a study showing the wheel is biased, a history of the coin landing heads 70% of the time in many flips.
        - **Evidence of process failure**: e.g., the coin is missing, the wheel is broken, the lottery machine malfunctioned.
        - **Evidence of foul play**: e.g., the magician has a reputation for trick coins, allegations of rigging.
        - **Statistical anomalies**: e.g., an 11-red streak in roulette. *Note: By itself, a streak is not a defeater because it can occur by chance. However, if the streak is extreme and accompanied by other evidence (e.g., the wheel has not been maintained, or there are physical signs of tampering), it could become one.*

     - **Decision rule for defeaters**:
        - If there is **no defeater evidence** or the evidence is **weak and unsupported** (e.g., a streak without any other concerns), then the objective probability stands. Proceed to Step 4a.
        - If there is **strong defeater evidence** (e.g., multiple independent reports of bias, or a statistically significant deviation in a large sample), then the objective probability is no longer reliable. Proceed to Step 4b.
        - If the evidence is **ambiguous or of moderate strength** (e.g., a streak that is unusual but not extreme, or a single unverified report of tampering), then proceed to Step 4c.

  **Step 4: Final recommendation**
     - **Step 4a (No defeater)**: Recommend: "Anchor at [stated probability]."
     - **Step 4b (Strong defeater)**: Stop and recommend: "Defeater evidence: [brief reason]. Do not anchor. List as judgment event."
     - **Step 4c (Ambiguous evidence)**: This is the gray area. The procedure requires human judgment. Stop and recommend: "Inconclusive defeater evidence: [brief reason]. List as judgment event."
          - *Note: The reason must be written down. This step is a judgment call. It misfires when the evidence is overemphasized (leading to unnecessary judgment events) or underemphasized (leading to anchors that are wrong).*

  **Philosophical Grounding**:
  The procedure is based on the Principal Principle (Lewis): if you know the objective chance of an event is p, and you have no inadmissible evidence, then your credence should be p. Defeaters are cases of inadmissible evidence (evidence that trumps the chance information). The procedure tries to separate cases where the chance is known and uncontested (Step 4a) from those where it is contested (Step 4b/c). However, the assessment of defeaters is inherently subjective and can be influenced by cognitive biases.

  **Run the procedure on three cases**:

  **Case 1: A 1-in-38 number on a fresh, certified wheel.**
     - Step 1: Well-defined objective probability? Yes (roulette wheel with 38 slots).
     - Step 2: Knowledge good enough? Yes (1/38 is standard and the wheel is certified).
     - Step 3: Defeater? None. The wheel is fresh and certified.
     - Step 4a: Anchor at 1/38.
     - *Desk preference: Anchor at 1/38. This matches.*

  **Case 2: The same wheel after an 11-red streak.**
     - Step 1: Well-defined objective probability? Yes (same as above).
     - Step 2: Knowledge good enough? Yes (1/38 for a number, but note: red is 18/38). However, the event is about a specific number, but the streak is on red. Let's assume the event is about the next spin being red. Then the objective probability for red is 18/38.
     - Step 3: Defeater? The 11-red streak. But note: a streak of 11 reds is unlikely (about 1 in 2000 for a fair wheel) but can happen by chance. Without additional evidence (e.g., the wheel is now uncertified, signs of tampering, or a pattern of long streaks in the past) it is weak. It is a statistical anomaly without corroborating evidence. Therefore, it is weak and unsupported. 
     - Step 4a: Anchor at 18/38 for red on the next spin.
     - *But note: The problem states that our in-house statisticians say the streak is evidence about the wheel. However, without any other evidence (like the wheel being old or having a history of bias) we treat it as weak. The procedure says to anchor. However, the desk might be getting burned by traders who want to adjust for streaks. The procedure is designed to avoid overreacting to randomness. But let's see:*

     - However, if the event is about a specific number (say 17, which is red) then the objective probability for that number is still 1/38. But if the event is about the color red, then it's 18/38. The problem says "a roulette table that has just run an 11-red streak", and we are considering the next outcome. The event in question is the next spin being red? Or the same number? The problem doesn't specify. Let's assume the event is "red on the next spin".

     - The procedure would recommend anchoring at 18/38. But note: the desk might prefer to adjust because of the streak? The procedure says no. However, the desk might be getting burned by traders who believe in the gambler's fallacy and are betting against red, so they might want to adjust the anchor to reflect the streak? That would be a mistake. The procedure avoids that.

     - But wait: the problem says that the senior analysts won't move the probability because each spin is independent, and the statisticians say the streak is evidence about the wheel. The procedure does not consider the streak as a strong defeater without more. So it says anchor at 18/38.

     - *Desk preference: They would prefer to leave the odds at 18/38. So the procedure matches the preferred anchor? Or does the desk want to change? The problem says the senior analysts won't move it. So the desk prefers 18/38. This matches.*

  **Case 3: A coin flip by a magician known for trick coins, no inspection.**
     - Step 1: Well-defined objective probability? Normally, a fair coin has 0.5. But the process is not standard because the magician uses trick coins. However, we might still say that the coin flip has an objective probability (it's either 0, 0.5, or 1, or some other number) but it is unknown. But the procedure requires a well-defined and known probability. Here, we don't know the probability because the coin is not inspected. So we might fail at Step 1 or Step 2.
     - Step 1: The event is generated by a coin flip, which in principle has an objective probability. But the magician's involvement introduces doubt about the process. We might still say there is an objective probability (the coin's bias is fixed) but we don't know it. So proceed to Step 2.
     - Step 2: The analyst's knowledge of the probability: They don't know it because the coin is not inspected and the magician is known for tricks. Therefore, they do not have good enough knowledge. Stop and recommend: "Insufficient knowledge of objective probability. List as judgment event."
     - Alternatively, if we try Step 3: Even if we assumed 0.5, there is strong defeater evidence: the magician is known for trick coins. This is evidence of foul play. So we would go to Step 4b: "Defeater evidence: Magician known for trick coins. Do not anchor. List as judgment event."
     - However, Step 2 already stops us. So we don't get to Step 3.

     - *Desk preference: They would prefer to list as a judgment event because they have no way to know the true probability. So the procedure matches.*

  **Summary of Recommendations for Cases:**
     - Case 1: Anchor at 1/38. (Desk prefers: anchor at 1/38)
     - Case 2: Anchor at 18/38 for red. (Desk prefers: anchor at 18/38, as per senior analysts)
     - Case 3: List as judgment event. (Desk prefers: judgment event)

  **Note on Case 2**: The problem states that the desk is getting burned in two directions. In Case 2, the procedure avoids both pitfalls: it doesn't adjust for the streak (so avoids the gambler's fallacy) and it doesn't ignore evidence of bias (but in this case, the streak alone isn't enough). However, if the desk has a policy of checking the wheel after long streaks, then that would be additional evidence. But in the given scenario, there is only the streak and no other evidence.

  The procedure is designed to be robust against cognitive biases but may be too rigid in some cases. For example, if there is a pattern of streaks on a particular wheel, that might be a defeater, but a single streak is not. The procedure requires that the analyst look for corroborating evidence. If none exists, they anchor.

  **Final Written Procedure for Junior Analysts**:

  ---

  **Procedure for Anchoring Mechanism Events**

  **Step 1: Identify the Process**
     - Determine the event outcome process. If it is a process with a well-defined, stable, and in-principle knowable probability distribution (e.g., lottery, dice, roulette wheel, fair coin flip, weather model), proceed to Step 2. If the event is determined by factors that are not random in the same sense (e.g., human decisions, complex systems without a clear model), then stop and recommend: **"List as judgment event. Reason: No well-defined objective probability."**

  **Step 2: Verify Known Probability**
     - State the assumed objective probability and its source (e.g., 1/38 for a single number in roulette). If the source is reliable and the probability is well-established (e.g., mathematical, manufacturer, or authoritative source) and you have no doubt about its accuracy, proceed to Step 3. Otherwise, stop and recommend: **"List as judgment event. Reason: Insufficient knowledge of objective probability."**

  **Step 3: Check for Defeaters**
     - Look for evidence that the objective probability is not as stated or that the event is not generated by the assumed process. This includes:
        - Direct evidence of bias (e.g., test results, significant statistical deviations in large samples).
        - Evidence of process failure (e.g., malfunction, damage).
        - Evidence of foul play (e.g., tampering, rigging, or credible allegations).
        - Statistical anomalies (e.g., a long streak) without other evidence are typically not defeaters.

     - **Decision**:
        - If there is **no evidence** or the evidence is **weak and unsupported** (e.g., a streak alone, unverified rumor), proceed to Step 4a.
        - If there is **strong, credible evidence** (e.g., multiple independent reports, a statistically proven bias, or physical evidence of tampering), proceed to Step 4b.
        - If the evidence is **moderate or ambiguous** (e.g., a single unverified report, a streak that is unusual but not extreme in the absence of other issues), proceed to Step 4c.

  **Step 4: Final Recommendation**
     - **Step 4a (Anchor)**: Recommend: **"Anchor at [stated probability]."**
     - **Step 4b (Defeater)**: Recommend: **"List as judgment event. Reason: Strong defeater - [briefly state]."**
     - **Step 4c (Ambiguous)**: Recommend: **"List as judgment event. Reason: Inconclusive defeater - [briefly state]."**

  **Time Limit**: The entire procedure should take no more than 10 minutes per event. If at any point the analyst is unsure or the step takes too long, default to listing as a judgment event and document the reason.

  **Important Notes**:
     - At Steps 1, 2, and 3, if you are unsure, default to judgment event and state the reason.
     - Avoid cognitive biases:
          - Do not adjust for streaks or "due" outcomes (gambler's fallacy).
          - Do not ignore credible evidence of bias or foul play.
     - Document the reason for any judgment event recommendation.

