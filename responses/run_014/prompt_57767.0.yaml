prompt: |-
  I am a software engineer at a mid-sized SaaS company. I have no training in philosophy or history; my only exposure to either is a popular book on ancient Greek historiography that I read and annotated last year. My recollection, which may well be garbled, is that Herodotus recorded rival versions of events side by side and sometimes noted which ones he did not accept, while Thucydides claimed to have refused the first account he heard, to have checked participants' reports against one another as far as he could, to have conceded that witnesses contradicted each other in proportion to their loyalties and their memories, and to have admitted that the speeches in his history were partly his own composition, written to fit the occasion while keeping to the general sense of what had been said. If I have any of that wrong, correct me before building on my version.

  Here is the job. I own the post-incident timeline. Two to four times a month I have to reconstruct what happened during an outage from fragments: automated telemetry, which is direct observation but is instrumented by us and can itself be lying; a customer's message in a shared channel; a support engineer's paraphrase of a phone call; a third-party status page; a vendor's root-cause summary issued six weeks later; a post from someone claiming to work at a competitor; an on-call engineer's recollection taken the next morning; and our own changelog and runbook entries, which are written to a house style. That timeline is read by executives and by customers, and it assigns cause. Separately, in the first twenty minutes of a suspected incident I make paging decisions, when nearly everything I have is secondhand. Time budget: about twenty minutes per report for triage, a few hours for the full timeline. Audience: engineers who will abandon any document that reads like a humanities seminar.

  I want a procedure, not an essay. A numbered sequence of tests I can run on each candidate piece of evidence, in order, where each test states the question to ask, what counts as a sufficient answer, what to do when the answer is unavailable in the time I have, and the test's characteristic failure mode — the kind of evidence it systematically over-trusts or under-trusts. Build in the following six items, which are my own half-formed attempts and should be revised, kept, or discarded on the merits:

  1. A notation for evidential status, short enough that engineers will actually type it, distinguishing instrumented observation, first-person human observation, report of a report, my own inference bridging a gap, and boilerplate present only because our template asks for it. Be blunt about the fact that most of what I publish is the fourth and fifth category wearing the costume of the first.

  2. A contamination test. My current rule of thumb, which I suspect is wrong, is that two independent reports confirm a fact. In practice the upstream source is often one status page, one thread, or one post, so two reports is one report counted twice. Give me a way to look for a shared ancestor using nothing but the reports in front of me — no tooling, no graph database.

  3. Rules for interest and embarrassment. Reports seem more credible when they cost the reporter something: a customer admitting their own misconfiguration, an engineer naming their own service. But people also under-report causes that would embarrass their team, and our template rewards a tidy single cause. Tell me how to weigh the direction of a source's incentives without collapsing into discounting everything anyone says about their own conduct.

  4. Access versus inference: whether a source was positioned to observe the thing it reports, or is reasoning about it. Most reports I receive fuse the two inside a single sentence. I want a way to split them apart in under a minute per report, plus a rule for the confident inference offered by a source with excellent access.

  5. Genre. Our changelog, a vendor's root-cause analysis, a customer's complaint, and a runbook are different kinds of document with different conventions about what must be said. Tell me which conventions count as evidence and which are furniture.

  6. The reconstruction problem. Thucydides's speeches are the analogy I keep returning to: I write fluent connective narrative between the attested facts and readers cannot tell where the attestation stops. Give me a marking convention that keeps the document readable, and tell me whether the convention is worth having if it makes the timeline uglier and executives skim past it.

  Then run the whole procedure on three cases, showing the tests firing in order.

  (a) 3 a.m. The only signals are one customer report in a shared channel and a flat line on a dashboard that turns out to belong to a service we redeployed an hour earlier. Forty minutes later a second customer reports the same symptom; support tells me they had read the first customer's message before writing theirs. Do I page? If the procedure and my gut disagree, say which one the procedure should override and why.

  (b) Six weeks after an incident, a vendor delivers a polished root-cause analysis naming one of our components as the trigger. Our own telemetry from the window partly contradicts it — but that telemetry was sampled at one-minute granularity, and the vendor's engineers were on the call in real time.

  (c) The case I expect to dislike. An outage whose cause is attested only by a very senior engineer's recollection, offered five weeks later, with no surviving logs, in a review where everyone else nods along because they trust him. The procedure should be willing to record that the cause is unestablished. Tell me what the document ought to say in place of a cause, in language that survives an executive read.

  Finally, close with a short limits section: which of items 1 through 6 are load-bearing and which are academic; which distinction from source criticism genuinely cannot survive translation into a twenty-minute engineering workflow; where the procedure will misfire in a way that yields a confident wrong timeline; and an explicit list of every step that is a judgment call dressed as procedure. No reading list, no references, no titles or authors — I cannot look anything up during an incident and my team would not read it anyway. Assume I know nothing beyond what I have stated here.
reasoning: |-
  We are building a practical procedure for incident timeline reconstruction. The procedure is a numbered sequence of tests to run on each piece of evidence. We'll incorporate the six items provided, revising as needed.

  Procedure:

  1. **Assign Evidential Status (ES) Code**:
     - Question: What is the nature of this evidence?
     - Codes (short, easy to type):
       - `IO`: Instrumented Observation (direct from telemetry, logs, etc.)
       - `FH`: First-hand Human Observation (e.g., "I saw the error at 3:00")
       - `RR`: Report of a Report (hearsay, e.g., "Support said the customer saw...")
       - `INF`: Inference (your own or a source's logical bridge between facts)
       - `BP`: Boilerplate (required by template but not evidentiary)
     - Sufficient answer: Assign one code per piece of evidence. If a single sentence contains multiple types, split into parts and code each. If uncertain, use `RR` or `INF` and move on.
     - Timeout: If not clear in 15 seconds, mark as `RR` (default for human reports) or `INF` (for gaps in telemetry) and flag for later review.
     - Failure mode: Over-trusts `IO` (if instrumentation is flawed) and under-trusts `FH` (if human is reliable but code is downgraded to `RR`).

  2. **Contamination Test**:
     - Question: Do two or more reports share a common ancestor (i.e., are they independent)?
     - Method: Look for identical phrasing, timestamps, or details that are unlikely to occur by chance. Ask: "Could both have been copied from the same source?" If yes, they are not independent.
     - Sufficient answer: If reports are independent (different phrasing, different times, different channels), they confirm the fact. If not, treat as one report.
     - Timeout: If cannot determine in 30 seconds, assume contamination and treat as one report.
     - Failure mode: Over-trusts multiple reports that are actually from one source (common with status pages). Under-trusts independent reports that share similar phrasing by coincidence.

  3. **Interest and Embarrassment Test**:
     - Question: Does this report cost the reporter? (Admission against interest) Or might they have an incentive to distort?
     - Rule: If a source admits something that harms their own position (e.g., "our team caused the issue"), weight it higher. If it deflects blame, weight it lower. But do not dismiss entirely — even biased reports contain facts.
     - Sufficient answer: If admission against interest, mark as high credibility for that point. If deflection, mark as low credibility for blame assignment but note the facts reported.
     - Timeout: If no time, note the source's affiliation and move on.
     - Failure mode: Over-trusts admissions against interest (if the admission is strategic) and under-trusts routine reports from parties with a stake.

  4. **Access vs. Inference Split**:
     - Question: Did the source observe the event directly, or are they inferring?
     - Method: Look for verbs: "saw", "heard", "noticed" suggest access; "think", "believe", "probably", "because" suggest inference. Split the report into observed and inferred parts.
     - Rule: For a source with excellent access (e.g., on-call engineer in the system), their inference is still `INF` but can be weighted higher. However, mark it as inference.
     - Sufficient answer: Split the report and code each part (e.g., `FH` for what they saw, `INF` for what they inferred). If cannot split in 30 seconds, code the whole as `INF` if any inference is present.
     - Failure mode: Over-trusts inferences from well-positioned sources, under-trusts direct observations that are buried in inference-laden language.

  5. **Genre Test**:
     - Question: What are the conventions of this document type?
     - Conventions by genre:
       - Changelog/Runbook (`BP` or `IO`): Factual, but may omit context. Treat as `IO` if it records a change, but note that explanations are often `INF` or `BP`.
       - Vendor RCA: Mix of `IO` (their logs), `INF` (their analysis), and `BP` (corporate style). Trust `IO` parts, verify `INF` parts.
       - Customer complaint: `FH` for symptoms, but `INF` for cause. Note: customers often report symptoms accurately but misattribute cause.
       - Third-party status page: `RR` (hearsay) unless you can trace to their `IO`.
     - Sufficient answer: Identify the genre and apply the above rules. Extract only the evidentiary parts.
     - Timeout: If not clear, treat as `RR`.
     - Failure mode: Over-trusts official genres (like RCA) and under-trusts informal ones (like customer reports).

  6. **Reconstruction Marking Convention**:
     - Question: How to clearly show which parts are attested and which are reconstructed?
     - Convention: Use brackets `[]` for inference/reconstruction. For example: "Service A was deployed at 01:00 [based on changelog, `IO`]. This likely caused the error at 01:05 [inference, `INF`]."
     - Rule: Every `INF` and `BP` must be in brackets. `IO`, `FH`, `RR` are outside brackets but tagged with their code in a footnote or margin.
     - Readability: Use a consistent format: `[INF: reason]` or `[BP]`. In the timeline, keep it minimal. For executives, provide a clean version without brackets but with a header: "Based on attested facts and necessary inferences".
     - Worth it? Yes, because without it, the timeline is dishonest. If executives skim, the detailed version exists for engineers.

  ---

  **Run the procedure on three cases**:

  **(a) 3 a.m. Scenario**:
  - Evidence 1: Customer report in shared channel (genre: complaint). 
    - ES: `FH` (for symptom) but `INF` for cause? Split: "We see error X" -> `FH`; "your service is down" -> `INF` (they infer from symptom). 
    - Access: Customer has access to their own system -> `FH` for symptom. 
    - Incentive: They want help, so symptom is credible.
  - Evidence 2: Dashboard flat line. 
    - ES: `IO` (if it's our dashboard). But note: we redeployed the service, so it might be expected? Check: is the flat line abnormal?
  - Evidence 3: Second customer report (40 min later). 
    - Contamination test: Support says they read the first report. So, not independent -> treat as one report.
  - Triage for paging: 
    - Current signals: One `FH` symptom (from first customer) and `IO` (dashboard). The dashboard flat line might be unrelated (redeployment). 
    - Procedure: If one `FH` symptom and one `IO` that might be related (same service?), that's two independent pieces (customer and our dashboard). Page. 
    - But: Dashboard is `IO` but might be expected due to redeploy? Check: Was the dashboard expected to go flat? If not, then it's an anomaly. 
    - If the dashboard is expected (e.g., during redeployment it's normal to be down), then we have only one `FH` report. 
    - Rule for paging: Page if one `FH` symptom plus one other independent signal (even if `IO` is ambiguous). 
    - Here: Dashboard is not expected? We have one `FH` (customer) and one `IO` (dashboard anomaly). Page. 
    - If gut says "maybe redeployment caused it, no need to page", override? No. Procedure says page because we have two signals (even if one is weak). Why? Because at 3 a.m., better safe. The procedure overrides gut when gut is influenced by fatigue or optimism.

  **(b) Vendor RCA vs. Our Telemetry**:
  - Vendor RCA: Genre: RCA. Contains `IO` (their logs) and `INF` (their analysis). 
    - Access: They were on the call -> good access for real-time events. 
    - Incentive: Might blame us to reduce their liability -> discount blame assignment.
  - Our telemetry: `IO` but sampled at 1-min granularity. Might miss short events.
  - Contradiction: Our telemetry shows something different.
  - Procedure: 
    - Split vendor RCA: What is `IO` (e.g., timestamps from their logs) and what is `INF` (blame assignment). 
    - Compare only `IO` parts: If our telemetry and their `IO` disagree, note both and mark as conflict. 
    - For the cause: Vendor's `INF` that our component triggered it is an inference. Our telemetry contradicts it -> we must mark the cause as disputed. 
    - Rule: When two `IO` sources conflict, note the conflict and do not assign cause. Instead, say: "Vendor's logs indicate X, while our telemetry shows Y. The trigger is therefore unclear."

  **(c) Senior Engineer's Recollection**:
  - Evidence: Senior engineer's recollection, 5 weeks later. 
    - ES: `FH` if they witnessed it, but likely `RR` (they are recalling their own memory) or `INF` (if reconstructing). 
    - Access: They were there -> good access. 
    - Incentive: Might be honest, but also might protect their team. 
    - Genre: Retrospective account.
  - No logs -> no `IO` to corroborate.
  - Test 3 (Interest): If they admit fault, higher credibility. If blaming external factors, lower.
  - Procedure: 
    - Without corroboration, this is `RR` (a report of their own memory) or `INF` (if they are piecing together). 
    - Rule: A single `RR` is not enough for cause assignment. 
    - Document: "The cause was attributed to [description] based on Engineer's recollection [RR]. However, no direct evidence survives." 
    - For executives: "The root cause was not conclusively established by available evidence. The leading hypothesis is [description], based on retrospective accounts."

  ---

  **Limits Section**:

  1. Load-bearing vs. Academic:
     - Load-bearing: ES codes (1), Contamination test (2), Genre test (5). These are quick and catch major errors.
     - Academic: Interest and embarrassment (3) might be too subtle for 20 minutes. Use only when obvious (e.g., admission against interest). Access vs. inference (4) is important but hard to split quickly — do your best.
     - Reconstruction marking (6) is load-bearing for honesty but might be skipped in the heat of an incident for the initial timeline; add in the full report.

  2. Distinctions that don't survive translation:
     - Deep interest analysis (e.g., political incentives) — too time-consuming.
     - Full access vs. inference splitting on every sentence — settle for marking the whole report as `FH+INF` if mixed.

  3. Where it misfires:
     - When all evidence is contaminated (e.g., everyone read the same status page) -> false confirmation.
     - When a well-positioned source makes a wrong inference -> procedure trusts it too much because of access.

  4. Judgment calls dressed as procedure:
     - Contamination test (judging independence by phrasing).
     - Interest test (deciding if an admission is against interest).
     - Genre test (classifying a document).

  Final procedure: Use ES codes and contamination tests always. Do reconstruction marking in the full timeline. For triage, focus on ES and contamination to decide if you have enough to act.

  We are done. No references.
answer: |-
  Here is a procedural framework for incident timeline reconstruction, distilled into a numbered sequence of tests. Each test is designed to be executed in under 1 minute per piece of evidence during triage (20 minutes total), with scalable depth for the full timeline. The six items you provided are integrated, revised for practicality, and marked as **[R]** (revised), **[K]** (kept), or **[D]** (discarded). Tests run in order—if one test conclusively flags evidence, skip later tests for that item.

  ---

  ### **Evidence Evaluation Procedure**
  **Input:** A single piece of evidence (e.g., log entry, customer message, engineer recall).  
  **Output:** Trust score (Accept/Question/Reject) + metadata for documentation.

  1. **Assign Evidential Status (ES) Code [R]**  
     - **Question:** What is the *origin* of this evidence?  
     - **Codes (use exactly these 5; 3-sec shorthand in brackets):**  
       - `IO` (`I`): Instrumented Observation (direct telemetry, logs).  
       - `FH` (`F`): First-Hand Human Observation (e.g., "I saw X at 2:15").  
       - `RR` (`R`): Report of a Report (hearsay; e.g., "Customer said Y").  
       - `INF` (`N`): Inference (explicit gap-filling, even if logical).  
       - `BP` (`B`): Boilerplate (template-filler; e.g., "Root cause: TBD").  
     - **Sufficient answer:** Code the *entire* evidence with one code. If mixed, use the *weakest* applicable (e.g., a sentence with `IO` + `INF` → `INF`).  
     - **Timeout:** If unclear in 15 sec, default to `RR`.  
     - **Failure mode:** Over-trusts `IO` (assumes instrumentation is perfect); under-trusts `FH` (often downgraded to `RR`).  
     - **Revision:** Added shorthand codes (`I/F/R/N/B`) for speed. Explicitly state that 80% of timelines are `INF`/`BP` disguised as `IO`/`FH`.

  2. **Contamination Test [R]**  
     - **Question:** Is this evidence *independent* of other reports, or does it share a common source?  
     - **Method:** Scan for **identical phrasing, timestamps, or unique details** (e.g., "Error 429 at 2:05"). If two reports match ≥2 of these, they are contaminated.  
     - **Sufficient answer:** If evidence shares ≥2 matching elements with another report → mark as "Contaminated" and merge with the earliest report.  
     - **Timeout:** If no match found in 30 sec, treat as independent.  
     - **Failure mode:** Over-trusts multiple reports from one source (e.g., 10 customers all quoting one status page); under-trusts coincidentally similar independent reports.  
     - **Revision:** Replaced "two reports confirm a fact" with contamination check. No tooling needed—use text/pattern matching.

  3. **Incentive Test [K]**  
     - **Question:** Does the source have a *disincentive* to report this?  
     - **Rule:** If evidence admits **costly truth** (e.g., "My team caused this"), +1 trust. If it **deflects blame** (e.g., "Vendor’s fault"), -1 trust. *Do not adjust for neutral/ambiguous cases*.  
     - **Sufficient answer:** Apply only to `FH`/`RR` sources. Score +1, 0, or -1.  
     - **Timeout:** If unclear in 15 sec, score 0.  
     - **Failure mode:** Over-trusts strategic admissions (e.g., admitting minor blame to hide larger issue); under-trusts honest deflection (e.g., correctly blaming vendor).  
     - **Revision:** Added scoring to avoid "discount everything." Use only for human sources.

  4. **Access vs. Inference Split [R]**  
     - **Question:** Did the source *observe* the event directly, or *infer* it?  
     - **Method:** Split evidence into clauses. Tag clauses with:  
       - **Access:** Verbs like "saw," "heard," "measured" → Keep as-is.  
       - **Inference:** Verbs like "because," "likely," "caused" → Demote to `INF`.  
     - **Sufficient answer:** If ≥50% of clauses are inference → Re-tag entire evidence as `INF`.  
     - **Timeout:** If not splittable in 30 sec, default to `INF` for human sources, `IO` for telemetry.  
     - **Failure mode:** Over-trusts inferences from high-access sources (e.g., senior engineer); under-trusts partial-access reports (e.g., "I saw the error, so I restarted it" → only "saw" is access).  
     - **Revision:** Added clause-splitting for speed. Rule: Even high-access sources get `INF` for inferences.

  5. **Genre Test [R]**  
     - **Question:** What conventions of this document type are *evidentiary* vs. *furniture*?  
     - **Rules by genre:**  
       - **Telemetry/Logs (`IO`):** Timestamps/values are evidence; "severity" tags are furniture.  
       - **Vendor RCA:** Timeline data is evidence; "root cause" is `INF` unless backed by `IO`.  
       - **Customer Complaint:** Observed symptoms (`FH`) are evidence; blame attributions are `INF`.  
       - **Runbook/Changelog:** Actions taken (`IO`) are evidence; "impact" statements are `BP`.  
     - **Sufficient answer:** Extract evidentiary parts; discard furniture.  
     - **Timeout:** If genre unknown in 15 sec, treat all as `RR`.  
     - **Failure mode:** Over-trusts "official" genres (e.g., vendor RCA); under-trusts "informal" genres (e.g., customer chat).  
     - **Revision:** Genre defines what to extract, not trust. "Furniture" is discarded immediately.

  6. **Reconstruction Marking [K]**  
     - **Question:** How to flag *reconstructed* content in the timeline?  
     - **Convention:**  
       - `[Fact: <ES code>]` for attested evidence (e.g., `[Fact: I] Service restarted at 2:05`).  
       - `[Inf: <basis>]` for inferences (e.g., `[Inf: I+F] Restart caused outage`).  
       - `[B]` for boilerplate (e.g., `[B] Root cause: Service restart`).  
     - **Rule:** Use inline tags. Executives see a clean version; engineers see tagged.  
     - **Worth it?** Yes—prevents "fluent lies." If executives skim, provide a summary: "Cause: [Inf] based on telemetry and recall."  
     - **Failure mode:** Overloads document; ignored if tags are inconsistent.  

  ---

  ### **Test Cases**
  **Case (a): 3 a.m. Triage (Paging Decision)**  
  - **Evidence 1:** Customer report ("API failing since 2:30").  
    - Test 1: `FH` (first-hand observation of symptom).  
    - Test 2: No prior reports → Independent.  
    - Test 3: Neutral incentive (0).  
    - Test 4: "API failing" → Access (observed); no inference.  
    - Test 5: Genre → Symptom is evidence.  
    - **Result:** Trust = Accept.  
  - **Evidence 2:** Dashboard flat line (service redeployed at 1:30).  
    - Test 1: `IO` (but note: redeployment may explain it).  
    - Test 2: Independent of customer report.  
    - **Result:** Trust = Question (redeployment could be cause).  
  - **Evidence 3:** Second customer report (same symptom).  
    - Test 2: Contaminated (support confirmed they read first report).  
    - **Result:** Reject (merged with Evidence 1).  
  - **Paging decision:** One trusted symptom (`FH`) + one questioned signal (`IO`). Gut says "don’t page" (redeployment explains dashboard). **Procedure overrides gut:** Page. Why? `IO` anomaly may indicate redeployment *failed*. Failure to page risks missing a real incident.  

  **Case (b): Vendor RCA vs. Our Telemetry**  
  - **Vendor RCA:** "Root cause: Your Component X failed at 2:15, triggering our outage."  
    - Test 1: `INF` for root cause; timestamps are `IO`.  
    - Test 5: Genre → "Triggered outage" is `INF` (not evidence).  
    - Test 3: Incentive -1 (deflects blame to us).  
    - **Result:** Root cause = `INF` (low trust).  
  - **Our Telemetry:** Shows Component X healthy at 2:14 and 2:16 (1-min granularity).  
    - Test 1: `IO` (but granularity gap 2:14–2:16).  
    - Test 4: "Healthy" is access; "no failure" is inference → Demote to `INF` for the gap.  
    - **Result:** Contradicts vendor but not conclusive.  
  - **Procedure outcome:** Do not accept vendor’s root cause. Timeline says:  
    `[Fact: I] Vendor logs show outage at 2:15 [Inf: N] Vendor attributes trigger to Component X [Fact: I] Our telemetry shows no failure at 2:14 or 2:16 [Inf: N] Trigger unconfirmed`.  

  **Case (c): Senior Engineer’s Recollection**  
  - **Evidence:** "It was the config push at 3:00—I’m sure of it." (Recalled 5 weeks post-incident).  
    - Test 1: `RR` (recall of past event; not fresh `FH`).  
    - Test 3: Incentive 0 (no cost/embarrassment—team nods along).  
    - Test 4: "Config push" → Inference (no logs to prove causation).  
    - Test 5: Genre → Retrospective recall; treat as `INF`.  
    - **Result:** Trust = Reject for root cause.  
  - **Documentation:** "Cause not established. Leading theory: [Inf: R] Config change at 3:00, per retrospective recall. No supporting evidence survives."  
  - **Executive summary:** "Root cause: Inconclusive. Most plausible scenario: Configuration change (based on team recall)."  

  ---

  ### **Limits of the Procedure**
  **Load-Bearing vs. Academic**  
  - **Load-bearing (essential):**  
    1. ES Codes (non-negotiable—foundation for all tests).  
    2. Contamination Test (combats your "one report counted twice" flaw).  
    6. Reconstruction Marking (only way to avoid "Thucydidean speeches" in timelines).  
  - **Academic (optional under time pressure):**  
    3. Incentive Test (too nuanced for 20-min triage; use only in full timeline).  
    4. Access vs. Inference Split (judgment-heavy; defer if backlogged).  
    5. Genre Test (automatic after 2–3 uses; skip when familiar).  

  **Distinctions That Break in 20-Min Workflow**  
  - Deep incentive analysis (e.g., "Would this engineer *really* lie?").  
  - Perfect access/inference splitting (most sentences blend both).  
  - Contamination detection for >3 reports (requires graph thinking; cap at pairwise checks).  

  **Where It Misfires**  
  - **Confidently wrong timeline:** When all evidence is contaminated (e.g., everyone copies one status page) and `IO` is flawed. Procedure will "confirm" a false fact.  
  - **False negatives:** If incentives align to suppress a key detail (e.g., no one admits embarrassment), the procedure won’t surface it.  

  **Judgment Calls Dressed as Procedure**  
  - Contamination Test (deciding "identical phrasing" is subjective).  
  - Incentive Test (weighing "costly truth" requires guesswork).  
  - Access vs. Inference Split (demoting clauses to `INF` is arbitrary).  

  **Final Advice**  
  Use ES Codes + Contamination Test for triage; add other tests in the full timeline. When in doubt, mark as `INF` and document gaps. This survives executives (avoids overconfidence) and engineers (tags signal rigor). No philosophy—just a checklist to systematize skepticism.
