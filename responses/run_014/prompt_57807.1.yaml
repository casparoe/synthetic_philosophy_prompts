  The three cases are interesting: Gradual Reservoir shows linear harm accumulation with imperceptible individual contributions; Buffer Order involves probabilistic causation with mostly zero but occasionally large effects; and Landslide Election combines near-zero decisiveness with expressive value. I'll need to ensure my desiderata address all these nuances.

