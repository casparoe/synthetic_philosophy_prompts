prompt: |-
  I was a population geneticist for thirty years before I retiered, and only then did I start reading philosophy of mind. Teleosemantics, the Millikanian idea that a mental state represents just what it was selected to represent, feels almost obvious to me, selection should be doing the work. But I keep getting stuck on the problem of novel content. How can an organism come to represent something no ancestor ever represented, say a quark? No selction pressure ever shaped a quark detector. The usual Millikan reply is that the content of a new state is fixed by the functions of the older capacities that build it up, so we don't need a fresh selection event. I want you to argue that this compositional move doesn't actually solve the problem. It just relocates the question of where content comes from onto the constituent capacities, and it still leaves unexplained how the first, non-compositional representations ever got any content at all. Make the case as sharply as you can, and keep it to a few tight paragraphs.
reasoning: |-
  Okay, the user is a retired population geneticist with thirty years of experience who's now delving into philosophy of mind, specifically teleosemantics. They find Millikan's idea intuitive—that mental states represent what they were evolutionarily selected to represent. But they're stuck on novel content representation, like how an organism could represent something entirely new such as a quark, which no ancestor ever encountered.

  The user's main concern is that Millikan's compositional solution—where new representations derive content from older, selected capacities—doesn't actually solve the problem. Instead, it just shifts the question to how those older capacities got their content in the first place. The user wants a sharp argument against this compositional move, emphasizing the unresolved origin of non-compositional representations.

  First, I need to recall the basics of teleosemantics. Millikan's theory grounds representation in biological function: a state represents what it was selected to detect or respond to. For novel content, she argues that new representations are built from existing functions. For example, a quark detector might combine detectors for subatomic particles or scientific instruments, each with their own evolutionary history.

  The user's objection is that this pushes the problem back. If quark representation relies on prior representations (like particle detectors), then how did those get their content? If those are also compositional, it leads to infinite regress. Eventually, you hit basic representations—like edge detectors or predator alerts—that must be non-compositional. But how did *those* originally acquire content without prior selection? That's the crux: teleosemantics seems to presuppose basic representations without explaining their origin.

  I should structure the argument in a few tight paragraphs. Start with the compositional move: it explains novelty by combining existing functions. Then point out that it relocates the problem—each constituent capacity must have its own content. This leads to a regress, ending at foundational representations. Emphasize that teleosemantics lacks an account for these basics. If they rely on selection, but were the first of their kind, no history exists. So the theory is either circular or incomplete.

  Also, consider the user's background. As a geneticist, they understand selection deeply. Highlighting that even in biology, traits need an initial variation for selection to act upon might resonate. Here, the "variation" is the proto-representation, but teleosemantics doesn't address how it gains initial content. The user wants the case made sharply, so avoid digressions. Focus on the regress and the foundational gap. Conclude that compositionality doesn't solve the origin problem; it just exposes a deeper hole in the theory.
answer: |-
  Here’s the case against Millikan’s compositional solution, sharpened to its core:

  Millikan’s appeal to compositionality merely **defers, rather than resolves, the grounding problem**. When a novel representation (e.g., "quark") is built from older capacities (e.g., capacities for detecting instrument readings, theoretical consistency, particle tracks), its derived content *presupposes* that these constituent capacities *already possess determinate content* fixed by their own evolutionary histories. The quark representation inherits its meaning parasitically from these prior functions.

  **This relocation exposes the foundational gap:** How did the *first*, non-composite representations acquire their content? If every representational state ultimately derives its content from the functions of simpler states built into it, we face an infinite regress. There must be a base layer of representations that are *not* composed of other representations – the biological "atoms" of content (e.g., simple perceptual detectors for edges, looming motion, or sugar). Crucially, these basic states cannot rely on compositional inheritance; their content must be fixed *directly* by selection.

  **Here lies the fatal flaw:** Teleosemantics requires selection history to fix content. But for the *very first* representational state in an evolutionary lineage, there *was no prior selection for representation*. Selection could only shape a proto-representational mechanism *after* it existed and performed *some* function (e.g., causing advantageous behavior). Teleosemantics explains how selection *refines* or *stabilizes* content, but it offers no account of how a purely physical, non-representational state *acquires* representational status *in the first place* purely through selection. Compositionality pushes the question back to the base layer, where the theory lacks the resources to explain the initial emergence of "aboutness" from non-aboutness. Selection refines functions; it cannot conjure intentionality *ex nihilo*.

  **Thus, compositionality fails:** It solves novelty *within* a system already possessing representational content, but remains silent on the origin of content itself at the fundamental level. The theory presupposes what it needs to explain.
