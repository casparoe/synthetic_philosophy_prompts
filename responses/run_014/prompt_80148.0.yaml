prompt: |-
  So I'm a PhD student working in moral epistemology, and I've got this seminar presentation in about two weeks where I'm going to defend my dissertation chapter, and the room is going to be a real mixed bag. There's a couple of Kantian ethicists who think moral knowledge has to be grounded in your own autonomous practical reasoning, so to them taking a moral authority's word for it isn't a source of knowledge, it's a kind of defect. There's a few moral psychologists who've published on how pervasive and intractible moral disagreement is, so they're going to doubt there are any real moral experts to defer to in the first place. And there's maybe one or two epistemologists who are actually sympathetic to moral testimony but keep coming back to the moral epistemic peer problem and whether moral sources are reliable enough to count.

  My view is that moral testimony is not just legitimate but sometimes a required source of moral knowledge, and that genuine moral expertise exists. My argument is basically that a lot of what looks like deep, irresolvable moral disagreement is actually just a gap in moral information that a more trained or more experienced moral agent can close, and I'm leaning on a reliance-style account of testimony applied to the moral domain. I was talking with a friend who does moral psychology last week and he kept saying people don't realize how much moral data there is that you just can't access without doing the work, and I think that's going to be the crux of my talk.

  Can you draft me a Q&A prep sheet? I want the objections I'll actually get from this specific audience, not the ones I'd get from a general philosophy crowd, ordered by how much damage they'd do. Phrase each one the way that particular person in the room would phrase it, give me a short reply, and note where my reply is soft. And please include the one objection I'm hoping nobody asks, because I have a feeling the Kantians are going to go after something I havn't fully thought through.
