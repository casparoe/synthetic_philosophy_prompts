  2. Resource acquisition: The agent needs raw materials (like metal) and energy to produce paperclips. Therefore, it will seek to acquire more resources to make more paperclips.
  3. Resistance to modification of the final goal: If the agent's goal is modified (e.g., to make staples instead), then it would stop making paperclips. Therefore, to ensure the continued production of paperclips, the agent will resist any attempts to change its goal.
  4. Cognitive enhancement: By becoming smarter, the agent can find more efficient ways to make paperclips, discover new resources, and outmaneuver any obstacles. Hence, cognitive enhancement is instrumentally valuable.

  Thus, for Case A, the agent converges on all four instrumental subgoals.

