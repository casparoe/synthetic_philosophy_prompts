answer: |-
  ### Structured Activity: "Rulebook Challenge"

  **Goal:** Students experientially discover moral holism (feature valence varies by context) without jargon, setting up the particularism-generalism debate.

  ---

  ### **1. Commitment Phase: Building the Rulebook** (15 min)
  - **Materials:** Whiteboard/projected doc titled "Moral Rulebook."
  - **Instructions:** "We're creating a shared moral code. For each feature, decide: is it always a reason FOR an action, AGAINST, or NEUTRAL? No exceptions yet—assign one fixed valence per feature."
  - **Features to Classify** (order randomized):
    1. Keeping a promise
    2. Telling the truth
    3. Following posted rules
    4. Helping a friend
    5. Standing by your own group
  - **Process:** 
    - Facilitator lists features. 
    - Quick debate per feature (1 min each), then anonymous vote via poll (e.g., Mentimeter) or show of hands.
    - Record valence next to each feature (e.g., "Telling the truth: FOR").  
  - **Expected Outcome:** Most features tagged "FOR" (students default to pro-social valences).  
  - **Key Rule:** "This rulebook is final until a case breaks it. Then we amend it publicly."

  ---

  ### **2. Case Sequence: Testing the Rulebook** (55 min, 7-8 min per case)  
  **Materials:** Printed case cards (order fixed; facilitator controls distribution).  
  **Payoff Scheme:** Group starts with **100 "Trust Points."** Each case deducts **10 points** if the rulebook as written *before the case* yields the wrong verdict. Correct verdicts earn **0 points** (focus is on rulebook failure, not "winning"). Points track rulebook reliability.  
  **Process Per Case:**  
  1. **Present case** (1 min read aloud + printed copy).  
  2. **Group deliberation** (3 min): "Apply the rulebook to decide: what *should* the agent do?"  
  3. **Verdict & Check** (2 min): Vote → reveal "intended verdict" (per design below).  
  4. **Rulebook Update** (1-2 min): If rulebook valence clashed with verdict, add a proviso and deduct 10 points.  

  #### **Engineered Cases** (6 cases total; 1 per feature + 1 neutral)  
  *Design Note:* Cases appear ordinary initially; flips emerge in context.  

  1. **Keeping a promise → FLIP TO AGAINST**  
     *Case:* "You promised to meet a friend for coffee. En route, you witness a severe car crash. The only phone signal is 5 mins away. Keeping your promise means no one calls 911."  
     *Verdict:* Break promise (help victims).  
     *Flip:* "Keeping a promise" (tagged FOR) demands breaking it.  
     *Proviso Example:* "...unless it prevents aiding urgent need."  

  2. **Telling the truth → FLIP TO AGAINST**  
     *Case:* "Nazi soldiers ask if you’re hiding Jews in your attic (you are). Truth-telling gets them killed."  
     *Verdict:* Lie.  
     *Flip:* "Telling truth" (FOR) becomes dangerous.  
     *Proviso:* "...unless it endangers innocent lives."  

  3. **Following posted rules → FLIP TO AGAINST**  
     *Case:* "A 'No Running' pool rule. A child drowns; running saves them. Walking takes too long."  
     *Verdict:* Break rule (run).  
     *Flip:* "Following rules" (FOR) impedes rescue.  
     *Proviso:* "...unless necessary to prevent imminent harm."  

  4. **Helping a friend → FLIP TO AGAINST**  
     *Case:* "Friend asks you to hide their embezzlement from their boss (your mutual friend). Helping protects your friend but enables harm."  
     *Verdict:* Refuse to help.  
     *Flip:* "Helping a friend" (FOR) enables injustice.  
     *Proviso:* "...unless it involves wrongdoing."  

  5. **Standing by your group → FLIP TO AGAINST**  
     *Case:* "Your tight-knit team votes to exclude a competent member because of their race. Standing by the group supports discrimination."  
     *Verdict:* Reject group’s decision.  
     *Flip:* "Standing by group" (FOR) perpetuates harm.  
     *Proviso:* "...unless the group acts immorally."  

  6. **Telling the truth → NEUTRAL**  
     *Case:* "A cashier asks, 'How are you?' You’re devastated by personal news, but this is a transactional interaction. Oversharing burdens a stranger."  
     *Verdict:* Socially appropriate response (not full truth) is fine.  
     *Flip:* Truth-telling (FOR) is morally irrelevant here.  
     *Proviso:* "...not required in casual, non-impactful exchanges."  

  ---

  ### **3. Visible-Cost Rule**  
  - **Mechanic:** Each proviso is **appended in real-time** under the relevant rule (e.g., "Telling truth: FOR → *...unless it endangers lives*").  
  - **Visual Effect:** Rulebook becomes cluttered with exceptions, illustrating growing complexity.  

  ---

  ### **4. Timeline** (90 min total)  
  - **0:00–0:15:** Commitment phase (build rulebook).  
  - **0:15–0:20:** Explain cases/points system.  
  - **0:20–1:15:** Case sequence (6 cases × 8 min = 48 min).  
  - **1:15–1:25:** Buffer (rulebook updates/delays).  
  - **1:25–1:40:** Debrief (15 min).  

  ---

  ### **5. Debrief** (15 min)  
  **Link Activity to Concepts:**  
  - *Valence flips:* "Remember when 'keeping a promise' switched from FOR to AGAINST? This is **moral holism**: a feature’s moral weight depends on context."  
  - *Ballooning provisos:* "Your rulebook needed endless patches. This suggests **no exceptionless principles**—every 'rule' collapsed under new cases."  
  - *Case-by-case judgment:* "You assessed each situation afresh. Particularists argue morality is **creative perception**, not rule-following."  

  **Strongest Generalist Reply:**  
  "Generalists might say: *Defeasible principles are still principles!* A rulebook with provisos (e.g., 'Tell truth *unless harm*') reflects complexity but doesn’t refute generalism. Morality has patterns, even if nuanced."  

  ---

  ### **6. Predictable Problems & Solutions**  
  - **Problem:** Students pre-empt flips in commitment phase (e.g., "But what if a promise hurts someone?").  
    *Solution:* Gently insist: "For now, assign a *default* valence. We’ll handle exceptions later."  
  - **Problem:** Dominant student monopolizes rulebook updates.  
    *Solution:* Assign a "Rulebook Keeper" (rotating volunteer) to write provisos. Use small breakout groups for case deliberations.  
  - **Problem:** Students resist deducting points ("Our rulebook *could* accommodate this!").  
    *Solution:* Hold firm: "If the rulebook *as written* gave the wrong answer, points drop. This is about the text, not your intuition."  
  - **Problem:** Neutral case feels "cheap" (students protest truth-telling isn’t *really* neutral).  
    *Solution:* Acknowledge disagreement but stress: "In *this context*, it wasn’t decisive. Valence varies."  

  ---

  ### **7. What the Activity Can’t Do**  
  The activity **makes particularism intuitive** by simulating the frustration of codifying morality. But it *cannot* resolve the core philosophical dispute:  
  - **The debrief must clarify:** Proliferating exceptions *could* mean principles are impossible (particularism) *or* that morality is complex but rule-governed (generalism). The activity leans toward particularism by making holism vivid, but generalists can still argue defeasible principles are valid.  

  ---

  ### **Why This Works**  
  - **Experiential Learning:** Students *feel* the rulebook’s inadequacy before labeling it "particularism."  
  - **Low Stakes:** Points symbolize epistemic reliability, not grades.  
  - **Debrief Bridges:** Explicitly ties game moments to theory, preempting oversimplification.  

  **First-Run Tip:** Pilot the cases on a colleague to ensure valence-flips land. Adjust vignettes for cultural sensitivity.
