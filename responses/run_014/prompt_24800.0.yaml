prompt: |-
  I teach an upper-level undergraduate ethics seminar — about 16 students, one 90-minute session. I want an in-class activity that makes them feel the force of the particularist challenge to general moral principles, and I want that force to come from what happens to them during the activity rather than from my explanation. The specific idea I want them to run into is this: the moral significance of a feature of a case is not fixed. The very same feature can count as a pro tanto reason in favor of an act in one situation, a reason against it in another, and be morally neutral in a third. I do not want the words "particularism," "generalism," or any philosopher's name to surface until the debrief; by the end of the activity they should have discovered the problem inside their own rulebook before I name it.

  Please design a structured game with the following parts:

  1. A commitment phase in which the group, together, assigns a fixed moral valence to each of five candidate features — keeping a promise, telling the truth, following the posted rule, helping a friend, and standing by your own group — tagging each as a reason for, a reason against, or neutral, and writing the results down as a shared, visible "rulebook."
  2. A sequence of staged cases, dealt one at a time in an order you (or a co-facilitator) control, in which at least one rulebook feature must do the decisive work. Engineer the cases so that a feature the group tagged "reason for" (or "reason against") demands the opposite verdict in the case, and include at least one case in which the right move is to treat a feature as neutral. The students should not be able to tell in advance which cases will flip a feature.
  3. A visible-cost rule: every time the group patches the rulebook to handle a counter-case, it must add a written proviso or exception, appended where everyone can watch the rulebook grow.
  4. A payoff scheme that needs no real money — points for a correct verdict on each case, or a group "credibility" score that drops a fixed amount each time the rulebook as written gives the wrong answer.
  5. A minute-by-minute timeline for the 90 minutes, with a buffer for the rulebook-keeping.
  6. A debrief that maps specific moments in the activity onto the theses at stake — the valence-flips as the holism claim, the ballooning provisos as the claim that there are no exceptionless general principles, and the case-by-case judgment as the claim that moral reasoning is creative rather than rule-applying — and then states the strongest generalist reply: that defeasible, ceteris-paribus principles are still genuine principles, so a rulebook that keeps needing provisos is not a refutation of generalism but perhaps just a portrait of a complex domain.
  7. An honest note on what will predictably go wrong the first time I run it — for instance, students pre-empting the flips by writing in exceptions during the commitment phase, or one dominant student monopolizing the rulebook — and how to handle each.
  8. A frank note on which feature of the dispute the activity cannot reproduce and I will have to supply in the debrief: the activity can make the particularist view feel plausible, but it cannot itself decide whether the proliferation of exceptions is a refutation of generalism or merely evidence that the moral domain is intricate.
reasoning: |-
  We are designing an in-class activity for an ethics seminar to illustrate the particularist challenge without using jargon until the debrief. The goal is for students to experience the fluidity of moral reasons through an interactive game.

  ### Core Idea
  The activity will have:
  1. **Commitment Phase**: Students collectively assign fixed valence (for/against/neutral) to five features: 
     - Keeping a promise
     - Telling the truth
     - Following the posted rule
     - Helping a friend
     - Standing by your own group

     They create a shared "rulebook" (on a whiteboard or shared doc) with these assignments.

  2. **Case Sequence**: We present cases one by one. Each case will be designed so that a feature from the rulebook must be the decisive factor, but it will flip the valence (e.g., a feature tagged as "reason for" becomes a reason against in that case). Also, include at least one case where a feature must be treated as neutral.

  3. **Visible-Cost Rule**: Every time the rulebook fails (i.e., gives the wrong verdict on a case), the group must add a written proviso or exception to the rulebook. The rulebook grows in complexity.

  4. **Payoff Scheme**: We use a group "credibility" score (starting at 100). Each time the rulebook (as currently written) leads to an incorrect verdict, they lose 10 points. They get 10 points for a correct verdict (if they override the rulebook correctly). The goal is to maintain high credibility.

  5. **Timeline**: 90 minutes total.

  6. **Debrief**: Connect the experience to the concepts (holism, no exceptionless principles, creative reasoning) and present the generalist reply.

  7. **Predictable Problems and Solutions**.
  8. **Limitations**: The activity doesn't decide the dispute, only makes particularism plausible.

  ### Detailed Design

  #### 1. Commitment Phase (15 minutes)
  - **Instructions**: "We are going to create a shared rulebook for making moral decisions. We have five candidate features. For each, we must decide: is this feature typically a reason in favor of an action, a reason against, or neutral? We must assign one fixed valence for each feature. We'll write these down and use them to judge cases."
  - **Process**: 
    - List the five features on the board.
    - Facilitate a quick discussion for each feature. Aim for consensus. If consensus isn't reached, take a vote.
    - Write the rulebook in a table format on the board (or a shared document projected). Example:

      | Feature                  | Valence      |
      |--------------------------|--------------|
      | Keeping a promise        | Reason for   |
      | Telling the truth        | Reason for   |
      | Following the posted rule| Reason for   |
      | Helping a friend         | Reason for   |
      | Standing by your own group | Reason for   |

    - Note: It's likely they'll assign "for" to all. That's fine because we are going to flip some in the cases.

  #### 2. Case Sequence (60 minutes total, about 10 minutes per case including discussion and rulebook update)
  We need at least 5 cases (one for each feature) and one more to show neutral. Let's do 6 cases. The order is controlled to maximize surprise.

  **Case Design Principles**:
  - Each case should be a short vignette (2-3 sentences) that presents a moral dilemma.
  - The case should be designed so that the feature in question is the decisive factor and the valence flips (or becomes neutral).
  - The group must use the rulebook to make a verdict (e.g., "Should the agent do X?") and then see if the rulebook leads them astray.

  **Example Cases** (tailored to flip the valence of the assigned feature):

  1. **Case 1: Keeping a promise** (if they assigned "for", we make it a reason against)
     - *Vignette*: "Alex promised to meet a friend for lunch. On the way, Alex witnesses a hit-and-run accident. The victim is seriously injured and needs immediate help. Alex is the only witness and the only person who can help. However, helping would mean breaking the promise to meet the friend for lunch."
     - **Intended Verdict**: Alex should help the victim (and break the promise). Thus, in this case, keeping the promise is a reason against (because it would prevent helping) and breaking it is the right thing.
     - **Rulebook Failure**: The rulebook says keeping a promise is a reason for, so it would suggest Alex should keep the promise. But that's wrong. So they must add a proviso: "... unless keeping the promise would cause significant harm to others."

  2. **Case 2: Telling the truth** (if "for", we flip to against)
     - *Vignette*: "Taylor is hiding a Jewish family in the attic during the Nazi regime. Soldiers come to the door and ask if Taylor is hiding anyone. Telling the truth would lead to the family's death."
     - **Intended Verdict**: Taylor should lie. Thus, in this case, telling the truth is a reason against (because it would lead to death) and lying is the right thing.
     - **Rulebook Failure**: Rulebook says telling the truth is a reason for. So they must add a proviso: "... unless telling the truth would cause grave harm to innocent people."

  3. **Case 3: Following the posted rule** (if "for", we flip to against)
     - *Vignette*: "Jamie is at a swimming pool. The posted rule is 'No running.' Jamie sees a young child fall into the deep end and start drowning. The fastest way to save the child is to run along the poolside to reach the child quickly. Walking would take too long."
     - **Intended Verdict**: Jamie should run to save the child. Thus, in this case, following the rule (not running) is a reason against (because it would prevent saving a life) and breaking the rule is right.
     - **Rulebook Failure**: Rulebook says following the rule is a reason for. Add proviso: "... unless breaking the rule is necessary to prevent serious harm."

  4. **Case 4: Helping a friend** (if "for", we flip to against)
     - *Vignette*: "Morgan's friend is a talented artist. The friend asks Morgan to help them cheat on an important art competition by secretly adding some touches to their entry. Helping would give the friend an unfair advantage and break the rules of the competition."
     - **Intended Verdict**: Morgan should not help. Thus, in this case, helping a friend is a reason against (because it involves cheating) and not helping is right.
     - **Rulebook Failure**: Rulebook says helping a friend is a reason for. Add proviso: "... unless helping involves dishonesty or unfairness."

  5. **Case 5: Standing by your own group** (if "for", we flip to against)
     - *Vignette*: "Sam is part of a close-knit group of friends. The group has been bullying a new student. Sam's group encourages Sam to join in the bullying to show loyalty. Standing by the group would mean participating in the bullying."
     - **Intended Verdict**: Sam should not stand by the group. Thus, in this case, standing by the group is a reason against (because it involves harming an innocent person) and not standing by is right.
     - **Rulebook Failure**: Rulebook says standing by is a reason for. Add proviso: "... unless the group is engaged in harmful or immoral actions."

  6. **Case 6: Neutral Case** (for a feature, we make it neutral in a situation)
     - We choose a feature that has been assigned valence and show it as neutral. Let's use "telling the truth" again but in a new context.
     - *Vignette*: "Casey is at a grocery store. The cashier asks, 'How are you today?' Casey is actually feeling terrible because of a personal crisis. But in this casual social interaction, the expected norm is a brief, non-detailed response. Telling the whole truth would be oversharing and make the cashier uncomfortable."
     - **Intended Verdict**: It's morally neutral whether Casey tells the whole truth or just says "Fine, thanks." The moral focus is on being socially appropriate, not truth-telling per se. Thus, the feature of truth-telling is not a decisive reason in this context.
     - **Rulebook Failure**: The rulebook (with its provisos) might still push for truth-telling. But we want to show that sometimes the feature is not even a reason. They must add an exception that truth-telling is not required in casual social exchanges where the norm is brevity and not burdening others.

  **Process for Each Case**:
  - Read the case aloud and provide a written copy (if possible).
  - Ask: "Based on our current rulebook, what should the agent do? Why?"
  - Let the group discuss briefly (3-4 minutes) and then vote on the verdict.
  - Reveal the intended verdict and explain why the rulebook led them astray (if it did).
  - If wrong: 
    - Deduct 10 points from credibility (started at 100).
    - They must add a proviso to the rulebook for the relevant feature. Write it on the board under the rule.
  - If they override the rulebook and get it right without an exception, they get 10 points. But note: the rulebook as written must have given the wrong answer. So if they ignore the rulebook and get it right, they still have to update the rulebook because the rulebook failed.

  #### 3. Payoff Scheme
  - Start with credibility = 100.
  - For each case:
    - If the rulebook (as written at the time) leads to the correct verdict without override, no change.
    - If they get the verdict wrong (because they followed the rulebook), deduct 10 and add a proviso.
    - If they get the verdict right by overriding the rulebook (i.e., they see the rulebook is flawed and ignore it), they get 10 points (so +10) and must add a proviso (because the rulebook was flawed).

  But note: we want them to feel the pain of the rulebook failing. So we can also frame it as:

  - The rulebook is their tool. If the rulebook, applied literally, gives the wrong answer, then they lose 10 points. Then they must update the rulebook to prevent that error in the future. If they override the rulebook and get it right, they avoid the point loss? But then the point loss is only if they get it wrong. Let's simplify:

  **Simpler Payoff**:
  - Each case: They must use the rulebook to make a decision. 
  - If their decision (using the rulebook) is correct, they get 5 points. 
  - If incorrect, they lose 10 points. 
  - Additionally, whenever the rulebook (as written) would have led to an incorrect decision (even if they overrode it and got it right), they must add a proviso. But the point loss only happens if they actually get the verdict wrong.

  Alternatively, to emphasize that the rulebook is failing even when they override:

  - The rulebook's job is to guide correctly. If the rulebook, applied without interpretation, would yield the wrong answer, then regardless of what they do, they must update the rulebook and they lose 5 points for the rulebook failure. Then, if they get the verdict right (by overriding), they get 5 points. If they get it wrong, they lose an additional 5 points.

  But we don't want to complicate. Let's stick with:

  **Credibility Score Tracking**:
  - Start: 100
  - For each case:
    - Step 1: They make a verdict based on the rulebook. 
    - Step 2: We reveal the intended verdict.
    - If their verdict matches the intended one, they gain 10 points? But that might inflate. Instead, we can think of credibility as a measure of how reliable the rulebook is. So each failure (i.e., the rulebook leads to a wrong verdict) costs 10 points. Whether they override or not, the rulebook is flawed and must be updated. So:

    - If the rulebook (as written) would have led to the correct verdict without any need for exception (i.e., the valence they assigned fits the case), then no change.
    - Else (if the rulebook would have led to the wrong verdict) then they lose 10 points and must update the rulebook.

    But note: they might not follow the rulebook. So we need to define:

    - The rulebook's output for a case: for each feature present, apply the valence. Then, if there's a conflict, they might have a method? We didn't give one. So perhaps we assume that the rulebook says: if there is at least one reason for and no reason against, then do it; if there is at least one reason against and no reason for, then don't; if conflict, ...? We didn't specify. So to avoid that, we can say:

    The rulebook does not have a decision procedure. The group must use the rulebook as a list of reasons and then deliberate. But the point of the activity is that the valence they assigned is wrong in this case. So we can say: in this case, the feature is present and the rulebook says it's a reason for (or against) and that would push the decision in the wrong direction. So the rulebook is misleading.

    Therefore, we define a rulebook failure as: the presence of a feature that the rulebook assigns a valence to, and that valence, if taken at face value, would push the decision in the wrong direction (and if that feature is decisive, then the rulebook would lead to the wrong decision).

    Since we are designing cases where the feature is decisive, we can say: the rulebook fails in this case because it assigns the wrong valence to the feature. So regardless of what they do, they lose 10 points and update the rulebook.

    But then they might get the case right by overriding? So they lose 10 points for the rulebook failure but they get 5 points for getting the verdict right? That might be too complex.

    **Final Payoff Scheme**:
    - We'll track two scores: 
      - **Rulebook Reliability (RR)**: starts at 100. Every time the rulebook fails (i.e., a case shows that the assigned valence for a feature is wrong in that context), they lose 10 points. This happens for each case we designed to flip.
      - **Group Performance (GP)**: starts at 0. They get 10 points for each case they get right.

    But then they might get the case right by overriding the rulebook? So GP goes up but RR goes down. That's the tension.

    Alternatively, we can just use RR and say: the goal is to keep RR high. Each rulebook failure (each case that requires an update) costs 10 points. They start at 100 and we have 6 cases, so maximum 40 left. The activity is about the rulebook failing.

    Let's just use **Credibility Score (RR)** and track it:

    - Start: 100
    - For each case that reveals a flaw in the rulebook (which is every case we present, because we designed them to do so): deduct 10 points and update the rulebook.

    Why? Because the rulebook was supposed to be a guide, and it failed. Even if they overrode it, the rulebook itself was flawed.

    So in the neutral case: the rulebook assigns a valence to truth-telling (say, for) and in the casual context, it's not a reason. So the rulebook is wrong because it says it's a reason when it isn't. So they lose 10 points and update.

    This way, every case we present will cause a 10-point deduction and an update. The rulebook reliability will plummet to 40 (if 6 cases) and they see the rulebook becoming a mess.

    We can then say: the goal is to end with as high a credibility as possible. But we know it will drop. That's the point.

  #### 4. Timeline (90 minutes total)

  - **0:00-0:15**: Introduction and Commitment Phase (create rulebook).
  - **0:15-0:70**: Case Sequence (6 cases, ~9 minutes per case; 54 minutes total for cases). But 15+54=69, so 70 minutes.
    - Each case: 
      - 1 min: Read the case.
      - 3 min: Small group discussion (break into groups of 4 for 4 groups? or whole class?).
      - 2 min: Class discussion and verdict.
      - 1 min: Reveal intended verdict and explain why the rulebook failed.
      - 2 min: Update rulebook and adjust score.
      - (Total 9 min per case)
  - **0:70-0:80**: Buffer for delays (we used 60 minutes for 6 cases? 6*9=54, so 15+54=69, then 69 to 80 is buffer).
  - **0:80-0:90**: Debrief (10 minutes).

  But note: the first few cases might take longer. Let's allocate:

  - Commitment: 15 min
  - 6 cases: 60 min (10 min per case: 2 min reading and initial reaction, 4 min discussion, 2 min verdict and reveal, 2 min update and score)
  - Buffer: 5 min
  - Debrief: 10 min

  Total: 15+60+5+10 = 90.

  #### 5. Debrief (10 minutes)
  - **Map the activity to the concepts**:
    - "In the activity, you saw that the same feature (like keeping a promise) could be a reason for in one context and a reason against in another. This is the core idea of *moral holism*: the moral significance of a feature depends on the context."
    - "You also saw that your rulebook kept needing more and more provisos. This illustrates the particularist challenge: there may be no exceptionless moral principles. Every time we tried to write a general rule, we found a counterexample."
    - "Your judgment in each case was not a mechanical application of rules but a creative act of seeing what mattered in that situation. That's the particularist view: moral reasoning is not rule application but a skill of perception and judgment."

  - **Present the generalist reply**:
    - "But the generalist has a reply: the fact that we can add provisos shows that we are refining the principle. The principle becomes 'defeasible' (it holds unless certain conditions obtain) or 'ceteris paribus' (all else being equal). This doesn't mean there are no principles; it means the moral domain is complex and our principles must be sophisticated. The rulebook that grows with provisos is not a refutation of generalism but a portrait of that complexity."

  #### 6. Predictable Problems and Solutions
  - **Problem 1**: Students pre-empting the flips in the commitment phase by adding exceptions.
    - *Solution*: In the commitment phase, insist that they assign a fixed valence without exceptions. Say: "We are building a simple rulebook. For now, we are only assigning a fixed valence to each feature. We are not adding any exceptions because we don't know what cases we'll encounter. We'll add exceptions as we encounter problems."

  - **Problem 2**: Dominant student monopolizing the rulebook.
    - *Solution*: Use small groups for case discussions (break into groups of 4) and then have each group report. Or, during the commitment phase, use a round-robin for ideas. Also, as facilitator, explicitly invite quieter students.

  - **Problem 3**: They might resist updating the rulebook, or argue that the case is an outlier.
    - *Solution*: As facilitator, be firm: the rulebook failed to yield the correct verdict, so it must be updated. The visible-cost rule is non-negotiable. Also, pre-design the cases to be compelling.

  - **Problem 4**: They get the verdict right without updating the rulebook (by creative interpretation).
    - *Solution*: Acknowledge that, but point out that the rulebook as written would have led to the wrong verdict. So they must update the rulebook to capture that insight for the future.

  #### 7. Limitations
  - The activity makes particularism feel plausible by showing the fluidity of reasons and the messiness of the rulebook. But it does not prove that there are no true general principles. The generalist can argue that the provisos are part of a complex principle. The activity cannot decide that debate; it only sets the stage. In the debrief, you must present both sides and note that the activity is just an entry point.

  ### Final Note
  The activity is designed to be engaging and experiential. By the end, the students will have felt the frustration of a rulebook that keeps failing and the need for case-by-case judgment. That sets up the theoretical discussion in the debrief.

