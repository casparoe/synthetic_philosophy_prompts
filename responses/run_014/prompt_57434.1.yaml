  - **Surrogate goal** → published no-pay policies. Both are commitment devices, but the acausal version requires irreversible precommitment unlike revisable corporate policies. The squint here ignores real-world flexibility.
  - **Repeat interactions** → deterrence through reputation. But acausal "reputation" exists without any interaction history, which doesn't translate to actual threat actor ecosystems.

  The untranslatable elements reveal where the acausal model diverges from reality:
