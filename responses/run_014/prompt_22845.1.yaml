prompt: |-
  I'm a retired neuroscientist — decision making was my whole career — and I only recently got into philosophy, so I may be using the terms wrong. I sit on my hospital's AI governance commitee, and we vote next month on a system that infers each patient's treatment preferences from behavior: past choices, how answers shift when the same option is rephrased, even passive cues like how long someone hovors over a choice. It's meant to personalize recommendations and to fill in advance directives when a patient can no longer speak for themselves. I can't shake three worries, and I'd like a short memo I can circulate before the vote that takes them seriously. (1) My own field shows that choices flip with framing, so is there a stable "preference" for the system to infer at all, or is it just fitting the noise of how the question was asked? (2) For a patient in chronic pain or early dementia, current behavior may reflect what they've adapted to rather than what the person they used to be would want — whose preference should count? (3) When a patient can still state what they want, do we trust the words or the behavior, and what do we do when the two disagree? Give us a clear recommendation — approve, reject, or approve with conditions — with the reasoning, and be honest about the strongest case for the side you're not picking. Keep it followable by non-technical members.
reasoning: |-
  Okay, the user is a retired neuroscientist on a hospital AI governance committee. They need a memo addressing three concerns about an AI system that infers patient preferences from behavior. The memo must be clear for non-technical members and end with a recommendation.

  First, let's unpack the user's worries. The first point is about preference instability due to framing effects, which is a core finding in decision neuroscience. The user is questioning whether there's a stable preference to infer or if the AI is just capturing noise. That's a valid concern because if preferences aren't stable, the AI's inferences might be unreliable.

  The second issue involves patients with chronic pain or early dementia. Their current behaviors might reflect adaptation, not their past selves' values. The user is asking whose preferences should count—past or present. This touches on identity continuity and ethical considerations about autonomy. The committee needs to decide which version of the patient to prioritize, which is complex.

  Third, there's the conflict between stated preferences and observed behavior. If a patient says one thing but their behavior suggests another, which should be trusted? This discrepancy could stem from cognitive decline, social pressure, or other factors. The AI might prioritize behavior, potentially overriding explicit statements, which is ethically risky.

  The user's deeper needs include ensuring ethical deployment of AI, preserving patient autonomy, and avoiding harm. They want the memo to guide the committee by addressing these concerns transparently. The recommendation needs to balance innovation with caution, considering both medical and philosophical aspects.

  For the memo structure, start with a summary of concerns, then address each one clearly. For the first point, acknowledge framing effects but suggest temporal analysis to find patterns. For the second, differentiate between pain and dementia cases, emphasizing capacity assessments. For the third, prioritize verbal statements unless contradictions arise, then use behavior as supplementary.

  The recommendation should be to approve with strict conditions: mandatory capacity assessments, temporal analysis for preferences, conflict protocols, and opt-out options. Highlight the strongest case for rejection: the risk of misinterpreting behavior and overriding autonomy. Also, note the opposing view's strength—efficiency and filling directives when patients can't communicate.

  Need to ensure the memo is accessible. Avoid jargon, use plain language, and structure each section clearly. Emphasize that conditions are non-negotiable for ethical implementation. The goal is to support the committee in making an informed decision that respects patient autonomy while leveraging AI's benefits cautiously.
answer: |-
  **MEMORANDUM**  
  To: AI Governance Committee  
  From: Dr. [Your Name], Retired Neuroscientist & Committee Member  
  Subject: Critical Concerns & Recommendation: AI Preference Inference System  
  Date: [Current Date]  

  ### **Summary of Concerns & Recommendation**  
  **Recommendation: Approve with Strict Conditions**  
  *Reasoning:* The system’s potential to personalize care and honor patient wishes when they cannot speak is significant. However, unaddressed risks could undermine autonomy or misrepresent true preferences. Conditions must ensure rigorous safeguards for ethical deployment.  

  *(Strongest Case for Full Rejection: If preferences are fundamentally unstable or behaviorally ambiguous, the system risks automating bias, overriding explicit patient wishes, or making life-altering decisions based on noise. This could erode trust in medical AI long-term.)*  

  ---

  ### **Detailed Analysis of Concerns**  
  **1. "Do stable preferences exist, or is the AI just fitting noise?"**  
     - **Neuroscience Insight:** Decisions *do* flip with framing (e.g., "90% survival" vs. "10% mortality"). Preferences are context-dependent, not fixed.  
     - **AI Risk:** The system may mistake situational reactions (e.g., stress-induced choices) for core values.  
     - **Mitigation Condition:**  
       - **Require temporal analysis.** The AI must demonstrate *consistency* across repeated scenarios over time, not rely on single interactions.  
       - **Reject models using passive cues (e.g., cursor hovering) alone.** These are highly vulnerable to noise.  

  **2. "Whose preference counts? Past self or adapted present self?"**  
     - **The Dilemma:**  
       - *Chronic pain patients* may adapt preferences to current limitations (e.g., refusing PT due to pain, despite valuing mobility historically).  
       - *Early dementia patients* may lose connection to past values but retain decision-making capacity *now*.  
     - **Ethical Imperative:** Current wishes of capacitated patients must override historical data.  
     - **Mitigation Conditions:**  
       - **Mandate capacity assessments** before AI data collection. Exclude non-capacitated patients unless they have prior directives.  
       - **Separate protocols for progressive conditions:** For dementia, use AI *only* to support advance directives completed *before* significant decline.  

  **3. "When words and behavior clash, which do we trust?"**  
     - **Core Conflict:** A patient may *say* "I want life-extending care" but avoid filling out DNR forms (behavior). Or vice versa.  
     - **Neuroscience Reality:** Verbal statements can be influenced by family pressure; behavior may reflect unconscious bias or fatigue.  
     - **Mitigation Conditions:**  
       - **Prioritize explicit verbal/written statements** when available.  
       - **Require human review for contradictions:** If behavior and words conflict, the AI flags it—**never resolves it automatically**. A clinician/ethics team must discuss with the patient.  

  ---

  ### **Recommended Conditions for Approval**  
  1. **Exclude non-capacitated patients** unless using pre-decline directives.  
  2. **AI training must emphasize longitudinal data** (patterns over time), not single interactions.  
  3. **Human oversight required:** All AI outputs reviewed by clinicians *before* use; conflicts trigger ethics consultation.  
  4. **Transparency & Opt-Out:** Patients/families see AI-inferred preferences and can reject/correct them.  
  5. **Independent Audit:** Annual review for bias (e.g., does system devalue preferences of elderly or cognitively impaired?).  

  ### **Strongest Case for Full Approval**  
  *Efficiency and compassion:* This system could prevent agonizing family decisions when preferences are unrecorded. It uses real-time data to respect a patient’s current voice—especially valuable for those who struggle to articulate wishes but can demonstrate them through behavior. Without AI, we risk defaulting to one-size-fits-all care or burdensome guesswork.  

  ---

  **Conclusion:** This AI has transformative potential *if* constrained by neuroscience and ethics. Unconditional approval risks harm; rejection misses an opportunity to humanize care. **Approve only with the above conditions.** These guardrails turn a predictive tool into a dignity-preserving instrument.  

  Respectfully submitted,  
  Dr. [Your Name]
