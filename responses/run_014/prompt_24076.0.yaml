prompt: |-
  I cover science and ideas for a national news outlet, and I also sit on the outlet's standards and ethics board. A case has come before the board that I have been asked to write up in advance of Thursday's meeting, and I would like you to draft the written opinion for me.

  About six years ago, a scientist at a pharmaceutical company gave a set of internal documents to one of our science reporters, who was then working as a freelancer. The documents suggested that the company had known for years about a serious adverse effect of one of its drugs and had suppressed it. The reporter promised the scientist that neither the documents nor the scientist's identity would ever be published, and the scientist agreed to hand them over on that condition alone. The scientist has since died. The drug is still on the market, and a study published this year links it to the very adverse effect the documents described. The editor wants to publish the documents now, arguing that the public interest in an ongoing safety hazard outweighs a promise made to a dead man by a freelancer who is no longer with the paper.

  Please draft the short written opinion I will circulate before Thursday's meeting. It should recommend a concrete course of action — publish, withhold, or publish with redaction — with a time frame, and it should engage seriously with the question of why the promise binds in the first place: whether its force rests on the scientist's reliance on it, on the autonomy of the person who made it, or on the practice of promising that the paper is part of, rather than simply restating our confidentiality policy. It should also treat honestly the strongest consideration on the losing side. Please keep the opinion to no more than 450 words.
reasoning: |-
  Okay, the user is asking me to draft a written opinion for a journalism ethics board. They're a science journalist who also sits on their news outlet's standards board. The case involves a tricky ethical dilemma: six years ago, a now-deceased scientist leaked internal pharma documents showing suppressed drug risks to a freelancer (now gone) who promised absolute confidentiality. Now the editor wants to publish since new evidence confirms the risk.

  I need to craft a concise recommendation (publish/withhold/redact) under 450 words that deeply examines why promises bind journalists. The user specifically wants analysis beyond just policy - exploring whether promise-keeping stems from the source's reliance, the promisor's autonomy, or institutional practice. They also want honest engagement with the strongest counterargument.

  Hmm... this is complex. The public safety argument is compelling - people could be harmed by this drug right now. But breaking promises to sources threatens journalism's core function. Dead sources can't defend themselves, and freelancers represent the outlet's integrity. 

  The strongest tension is between consequentialism (publish to save lives) and deontology (keep promises as principle). I should acknowledge that withholding leaves real-world harm unaddressed, while publishing risks future sources distrusting all journalists.

  For structure: I'll open with a clear recommendation against publishing, then analyze the promise's binding nature through all three requested lenses. The reliance argument feels weakest since the source is dead, but autonomy and institutional practice remain powerful. I'll dedicate a paragraph to the compelling public interest counterargument before concluding with procedural next steps.

  Word count is tight - need crisp phrasing. "Withhold" sounds better than "don't publish," and I should specify "permanently" since time frames were requested. For the practice argument, I'll emphasize how this isn't about legal liability but the social contract of journalism.

  ...Wait, should I suggest redaction? Probably not - the documents would still violate the spirit of "neither published." The promise was categorical. Better to take a clear stand.

  Final thought: The conclusion should reinforce that this isn't indifference to public safety but a defense of the mechanisms that expose such dangers. Maybe suggest the newsroom pursue other angles without these documents.
answer: |-
  ## Recommendation: Withhold Publication Permanently

  **Recommended Action:** Withhold the documents permanently. Do not publish.

  **Reasoning:**

  The promise made to the source – absolute confidentiality regarding both the documents and their identity – is binding on this organization, despite the scientist's death and the freelancer's departure. The force of this promise rests primarily on **upholding the practice of promising that the paper is part of**.

  1.  **Institutional Practice & Integrity:** Journalism fundamentally relies on promises of confidentiality to uncover vital truths that sources cannot safely reveal otherwise. Breaking such a promise, even posthumously, erodes the bedrock trust essential to investigative reporting. Future sources, seeing promises discarded when convenient, will be far less likely to come forward, significantly impairing our ability to serve the public interest long-term. The promise was made under the implicit or explicit authority of representing journalistic integrity; the organization inherits that obligation.
  2.  **Autonomy of the Promisor:** The freelancer, acting as a journalist, exercised their autonomy in making a binding agreement. To break it now usurps that autonomy and implies promises made by journalists are contingent on their continued employment or the source's survival, which is untenable.
  3.  **Source Reliance:** While the source's reliance cannot now be harmed, the initial act was predicated on that reliance. Breaking the promise retroactively validates the source's worst fear – that their trust could be betrayed – damaging the perception of journalistic ethics.

  **Strongest Counterargument (Public Interest):**

  The editor rightly identifies a compelling public interest: new scientific evidence confirms a serious, ongoing safety hazard potentially suppressed by the company. Publishing the documents could definitively prove corporate malfeasance, accelerate regulatory action, warn the public, and potentially save lives. This is the most powerful argument for publication.

  **Why Public Interest Does Not Outweigh the Promise:**

  While the public interest is profoundly important, sacrificing core journalistic ethics to serve it is ultimately self-defeating. This specific truth might be revealed, but the mechanism enabling the discovery of *future* truths of equal or greater importance would be critically damaged. The public interest is best served *sustainably* by rigorously maintaining the principles that allow investigative journalism to function. We must pursue this story aggressively *without* violating our promise – through the new study, expert analysis, regulatory inquiries, and demanding accountability from the company and regulators based on the *publicly available* evidence.

  **Conclusion & Next Steps:**

  The ethical imperative to honor our foundational commitment to source confidentiality outweighs the significant public interest in publishing these specific documents. Publishing them would irreparably damage trust in our journalistic practice. We recommend **permanently withholding** the documents.

  **Action for Meeting:** Board to formally ratify this position. Newsroom leadership to be tasked with developing alternative strategies for investigating and reporting on the drug's safety concerns and the company's actions, utilizing all *ethical* means available. (Meeting: Thursday, [Date]).
