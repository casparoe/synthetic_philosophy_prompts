answer: |-
  ### Contractualist Analysis of the 1976 Swine Flu Immunization Program  

  #### **Decision Problem Sketch**  
  **Parties:** (a) The vaccinated population (43 million); (b) Unvaccinated citizens (including high-risk groups); (c) Fort Dix recruits (identifiable, immediate risk-bearers); (d) Merely possible pandemic victims (statistical lives); (e) Taxpayers (bearing indemnification costs); (f) Future cohorts (affected by eroded trust).  
  **Alternatives:** (1) Mass immunization (chosen); (2) Watchful waiting (surveillance + delayed action); (3) Targeted vaccination (military/high-risk groups only); (4) Stockpiling + phased rollout; (5) Morris’s proposal (safety trials first).  
  **Object of Assessment:**  
  - *Outcome-relativized contractualism* assesses actual outcomes (post hoc).  
  - *Risk-relativized contractualism* assesses ex ante prospects (pre hoc).  
  The comparator for reasonable rejection must be a feasible alternative policy (e.g., watchful waiting vs. mass immunization). Verdicts shift sharply with the comparator: e.g., rejecting mass immunization in favor of watchful waiting ignores the Fort Dix recruits’ heightened risk.  

  ---  

  #### **1. Contractualist Setup**  
  - **Standing to Complain:**  
    - *Vaccinated:* Bear actual harm (GBS) or ex ante risk.  
    - *Fort Dix recruits:* Faced immediate, high-probability harm; mass immunization addressed their concrete threat.  
    - *Possible pandemic victims:* Only statistical under watchful waiting; no standing if pandemic never occurs (outcome-relativized) or ex ante high-magnitude risk (risk-relativized).  
    - *Taxpayers:* Minimal per-capita burden; complaint weak unless financial harm is severe for specific individuals.  
    - *Future cohorts:* Complaints hinge on actual erosion of trust (post hoc) or ex ante risk to public goods.  
    **Theoretical Silence:** Contractualism lacks clear criteria for weighting complaints from "statistical" vs. identifiable parties. Changing comparators (e.g., mass vs. targeted vaccination) alters rejectability: Fort Dix recruits reasonably reject watchful waiting; healthy adults might reject mass immunization under risk-relativized view.  

  ---  

  #### **2. Outcome-Relativized Contractualism**  
  - **Verdict:** The program is *impermissible*.  
    - **Reason:** It caused 24 actual deaths and 400 paralysis cases, while saving zero identifiable lives (since the pandemic never occurred). Each GBS victim has a maximal complaint (grave harm), and no one has a countervailing complaint of being saved. The prohibition on aggregating "small" complaints (here, statistical pandemic risk) blocks trading actual deaths for merely possible lives.  
  - **Reductio or Indictment?**  
    - If this implies the decision was immoral, it is a *reductio* of outcome-relativized contractualism. The view cannot accommodate *ex ante justified risks* when bad outcomes materialize and good ones do not. It confuses permissibility with moral luck.  
    - **Alternative:** The view may be misapplied. If the object of assessment is the *prospect* (March 1976 decision), not the outcome, outcome-relativized contractualism has no tools—it only evaluates actual outcomes. This exposes a fatal gap: it cannot guide action under uncertainty.  

  ---  

  #### **3. Risk-Relativized Contractualism**  
  - **Verdict:** The program is *permissible* under March 1976 evidence.  
    - **Mechanics:**  
      - Each vaccinee’s complaint strength = ex ante risk (1/100,000 of GBS death).  
      - Aggregate complaint = 43M × (1/100,000) = ~430 expected severe harms (including deaths).  
      - Pandemic risk: Assume a 10% chance (Sencer’s estimate) of 1M deaths. Expected harm averted = 100,000 lives.  
      - Aggregate complaint (430) < Harm averted (100,000) → No reasonable rejection.  
  - **Justification to Each Person:**  
    - Each person’s complaint is *weaker* than the ex ante benefit (reduced pandemic risk). The vaccinee faces a 1/100,000 risk of GBS but a (e.g.) 1/1,000 ex ante risk of pandemic death *averted*. Net expected benefit justifies imposition.  
    - **Contractualist Survival:** Unlike cost-benefit analysis, this preserves individual justifiability. Complaints are not summed impersonally; each must be *individually* weak enough that no one can reasonably reject the policy given alternatives. However, the "relabeling" charge holds: the machinery reduces to expected-value reasoning framed in deontic terms. The core contractualist element—mutual justifiability—endures but is thinned to pairwise risk comparisons.  

  ---  

  #### **4. Identifiable-Victim Asymmetry**  
  - **Testimony’s Role:** Contractualism treats testimony as *evidentially irrelevant* to permissibility.  
    - Moral weight derives from ex ante risk imposition (risk-relativized) or actual harm (outcome-relativized). Victim narratives may illustrate the *gravity* of harm (e.g., GBS as a basis for rejection), but they cannot alter the ex ante risk magnitude or the policy’s justifiability.  
    - **Exception:** Testimony could reveal *misestimated* risks (e.g., Morris’s warnings). If harms were foreseeable but ignored, victims’ complaints gain strength. Here, however, GBS risk was unknown in March 1976; hindsight testimony is epistemically inert.  
    **Theoretical Silence:** Contractualism cannot explain the *psychological potency* of identifiable victims without smuggling in consequentialist concerns (e.g., demoralization costs).  

  ---  

  #### **5. Uncertainty and Hindsight**  
  - **Evidence-Relative Assessment:** Permissibility hinges on *reasonable beliefs in March 1976*.  
    - Sencer/Ford knew: (a) 1918-like strain; (b) Fort Dix outbreak; (c) no spread beyond base (uncertain durability); (d) vaccine safety data limited.  
    - "Reasonably" in "reasonable rejection" incorporates evidence-relative risks: Given scientific consensus, rejecting mass immunization was unreasonable for high-risk groups (e.g., Fort Dix recruits).  
  - **Post Hoc Facts:**  
    - *2009 immune response:* Irrelevant to 1976 permissibility; future benefits were unforeseeable.  
    - *GBS outcomes:* Confirm the risk was real but do not retroactively make the decision impermissible. A policy is not reasonably rejected simply because bad luck materialized.  
    **Structural Limitation:** Contractualism cannot condemn outcomes while endorsing decisions. It lacks the resources to say, "The decision was justified but tragic."  

  ---  

  #### **6. Institutional Features**  
  - **Indemnification:**  
    - *Contractualist Improvement:* Dispersing costs across taxpayers aligns burden-bearing with risk-bearing. Each taxpayer’s ex ante cost (cents) is too small to ground reasonable rejection, while manufacturers’ concentrated liability risk could have scuttled the program.  
    - *Aggregation Evasion:* Yes—it masks the GBS victims’ claims by dissolving their compensation into diffuse public cost. Contractualism overlooks this unless victims can reject the *indemnification structure* itself (e.g., as inadequate redress).  
  - **Silencing Dissent:**  
    - Contractualism assesses policies, not decision-making processes. However, legitimacy requires that *all relevant evidence* inform the justification. If Morris’s dismissal distorted risk assessment, those facing undisclosed risks (vaccinees) could reasonably reject the policy. His firing may thus invalidate the program’s ex ante justifiability.  

  ---  

  ### **Verdict**  
  The episode **refutes your hypothesis** that risk-relativized contractualism cleanly resolves aggregation in mass-risk cases. While it delivers a plausible ex ante verdict (permissibility), it does so by collapsing into expected-value reasoning, stripping contractualism of its distinctive commitment to *individual justifiability*. The vaccinee who actually developed GBS can still reasonably reject the policy: ex post, their harm is catastrophic, and the ex ante "net benefit" is irrelevant to their actual condition. Contractualism’s core tension—between ex ante and ex post perspectives—remains unresolved.  

  **Where Theory is Silent:**  
  1. Weighting statistical vs. identifiable lives.  
  2. Incorporating hindsight (moral luck).  
  3. Handling process failures (e.g., dissent suppression).  
  4. Justifying redress for ex post victims after ex ante permissible acts.  

  **Conclusion:** Contractualism lacks distinctive deliverables here. It either (a) mimics cost-benefit analysis (risk-relativized), or (b) falls silent on decision-guidance (outcome-relativized). The axis of trouble is not *ex ante* vs. *ex post* but **the ineliminable conflict between prospect and outcome**. For social risk policy, contractualism must either abandon individualism or admit defeasibility—neither of which Scanlon’s framework easily tolerates. This case suggests contractualism is the wrong tool for distributed risk.
