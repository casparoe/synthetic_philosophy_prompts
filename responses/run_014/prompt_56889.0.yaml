prompt: |-
  I am a TA for a second-year proofs course, and in three weeks I have a single seventy-five-minute section on non-constructive existence proofs. In lecture the students will have just met the two-case argument that some pair of irrationals has a rational power, without anyone saying which pair, and the six-people Ramsey argument; my section is supposed to consolidate the idea that a proof can establish that something exists while leaving you unable to point at it. I have decided to build the entire session around the strategy-stealing argument in positional games rather than treating it as one more example in a survey, because it is the case where the gap between knowing and doing is most vivid. There are twenty-six students. All have done induction, contradiction, contraposition, and the pigeonhole principle; none has taken game theory or graph theory. Two of them play serious competitive chess and one runs the board-game society, so I expect a couple of them to arrive confident that they already know what a winning strategy is and how you would find one. I have a whiteboard, a document camera, and about thirty printed 7×7 Hex boards with two colours of counter. What I want from you is not an explanation of the argument — I know it — but a plan for explaining it, and I want the plan to make the dependency structure explicit: which pieces genuinely cannot be stated until some other piece is in place, as opposed to a list of topics arranged in the conventional order. Please do not send me any readings, references, or suggested sources; I only want the pedagogy and the conceptual sequencing.

  On ordering and on the example. My instinct is to have them play in pairs for ten minutes before I say anything at all, so that they feel the impossibility of constructing a winning strategy before being handed a proof that one exists; but I worry that pairs will finish convinced the game is a draw, and the fact that Hex cannot be drawn is exactly the thing I cannot prove to them at this level. Tell me whether to open with play, with a game they already know cold, or with an explicit failed construction attempt on the board, and tell me what to concede openly about the no-draw property and what to simply assume in front of them. Then: which single game should carry the whole session, and what must that example have and lack in order to do the work? I have been going back and forth between Hex, ordinary 3×3 tic-tac-toe, where the argument yields only the weaker conclusion that the first player can force at least a draw, and Chomp, which appeals to me because the opening move that gets stolen is intuitively a terrible one. But I am not sure Chomp is running on the same rail at all: in Hex the licence seems to be that an extra stone of your own can never hurt you, whereas in Chomp the stolen move is the corner square, which is swallowed by every possible reply, so the extra material is never a genuine liability in the first place. Settle that for me, say whether those are two species of one argument or two different arguments wearing the same name, tell me which example to commit to, and identify the smallest change to that example that would make the argument fail. I would also like your view on whether the swap rule that real Hex players use to offset the first-player advantage is such a breaking change, or is itself a fresh application of the same trick.

  On the misconception map, which is the part I most need. I am already predicting these, and I want to know at which point in the sequence each should be headed off rather than corrected at the end: that the argument tells you how to play, so that a student who has followed it should be able to answer the question of where to put the third stone; that the strategy is literally copycat, with the whole thing collapsing the moment the mirrored cell is already occupied, because they do not see that the fallback of playing any free cell is available and, more importantly, harmless only under the monotonicity condition; that the conclusion is the first player wins at tic-tac-toe, conflating the second player has no winning strategy with the first player does in a game that admits draws; and that the argument is symmetric, so that the second player could equally steal the first player's strategy — I want a crisp way to show them exactly where the asymmetry is being used, since I suspect the free extra turn is doing all the work and they will not notice. I also expect someone to say that we were told a proof has to construct its object, and someone else to want to apply the argument to backgammon or poker. Give me a rough minute allocation across the session, one moment of genuine surprise, because my supervisor wants this section to function as recruitment for the combinatorics option, one closing question that will tell me whether the idea landed rather than merely entertained them, together with the two or three distinct wrong answers it might draw and what each of those would reveal about where the sequence failed, and finally a list of what I should deliberately leave out and announce as deferred — the topological argument that Hex cannot be drawn, determinacy for finite games of perfect information, Maker–Breaker theory, the complexity of finding the strategy, and how large a board an explicit winning strategy is actually known for — distinguishing the items worth naming and deferring from the ones I should simply not raise.
reasoning: |-
  We are designing a 75-minute session on non-constructive existence proofs using the strategy-stealing argument for positional games. The goal is to consolidate the idea that a proof can establish existence without providing a construction.

  ## Key Decisions

  ### Opening Activity
  Start with a short (5-7 minutes) play session of a simple game that they can quickly grasp. Use **3x3 Tic-Tac-Toe** (TTT) for this, not Hex, because:
  - TTT is universally known and can be played quickly.
  - Students will immediately recognize that the first player can force a draw (which they might think of as "winning" if they are not careful) and that there is no winning strategy for the second player.
  - This avoids the Hex draw issue: Hex cannot end in a draw, but that is non-trivial to prove. We don't want to get sidetracked.

  After the play session, ask:
  - "Did anyone find a winning strategy for the first player? For the second player?"
  - They will likely say that the first player can force at least a draw. We then clarify that TTT is a draw with best play.

  Then we say: "What if we change the rules a little? What if we remove the draw condition? That's what happens in Hex." But we don't play Hex yet.

  ### Choosing the Main Example: Hex
  Commit to **Hex** as the main example because:
  - It has no draws, which is crucial for the strategy-stealing argument to yield a win (as opposed to a draw in TTT).
  - The symmetry of the board and the monotonicity of the winning condition (once a cell is colored, it stays that way and helps the player) are essential.

  We avoid Chomp because:
  - Chomp is more complex (partially ordered set) and the winning condition (taking the poison cookie) is counterintuitive for some.
  - The strategy-stealing in Chomp uses the fact that the corner is a special move, but Hex's monotonicity is more natural for the argument.

  ### The Swap Rule in Hex
  The swap rule (or pie rule) is a way to offset the first-player advantage by allowing the second player to swap colors after the first move. This is actually another application of the same non-constructive idea: the first player's first move must be good enough that the second player would want to steal it. But we skip this to keep focus.

  ### Conceptual Sequence

  1. **Introduction (5 minutes):** 
     - Play Tic-Tac-Toe in pairs (3 minutes). 
     - Discuss: What did you observe? (2 minutes) -> First player can force a draw, second player can force a draw? (Actually, both can force a draw.)

  2. **Transition to Hex (5 minutes):**
     - Explain Hex rules: two players (Red and Blue), connect opposite sides, no draws. 
     - Show a 3x3 Hex board and play a quick game (with the document camera) to demonstrate. Emphasize that the board must be filled and one player must win.

  3. **The Big Question (2 minutes):**
     - "Does the first player have a winning strategy? Or the second? Or can both force a draw?" 
     - We are going to prove that the first player must have a winning strategy without knowing what it is.

  4. **Strategy-Stealing Argument (20 minutes):**
     - Break down the argument step by step:

       a. **Assume for contradiction** that the second player has a winning strategy, call it S.
          - This means that no matter what the first player does, the second player can win.

       b. The first player can **steal** this strategy as follows:
          - First, the first player makes an arbitrary move (say, at cell X). 
          - Then, for the rest of the game, the first player **pretends to be the second player** and uses S. 
          - How? When the second player moves, the first player sees what move S would have recommended for the second player in the current position (but note: the board has an extra red stone at X). 
          - The first player then plays that move (as if they were the second player using S). 

       c. **The problem**: What if the strategy S calls for a move at cell X? But that cell is already occupied (by the first player's initial move). 
          - Then the first player, acting as the second player, must choose an alternative move. 
          - We allow the first player to choose any available move (and we don't specify which). 

       d. **Why is this okay?** 
          - Because having an extra stone on the board (for the first player) is never a disadvantage in Hex. 
          - This is the **monotonicity** (or "extra stone never hurts") property: having more stones of your own only helps you connect your sides. 
          - Therefore, if the strategy S would have worked for the second player without the extra stone, then by having that extra stone, the first player should still be able to win (or at least not lose) by following S.

       e. **Contradiction**: The first player is using a strategy that guarantees a win, but we assumed the second player had a winning strategy. Therefore, the second player cannot have a winning strategy.

       f. **Asymmetry**: The argument uses the fact that the first player has an extra move. The second player cannot do the same because they don't have an extra move. 

       g. **Conclusion**: Therefore, the first player must have a winning strategy.

  5. **Addressing Misconceptions (10 minutes):**

     - **Misconception 1**: The argument tells you how to play.
       - Correction: The proof is non-constructive. We assumed the existence of a winning strategy for the second player and used it to get a winning strategy for the first. But we never built one. In fact, we don't know how to play.

     - **Misconception 2**: The strategy is copycat (mirroring).
       - Correction: We are not mirroring. We are using the opponent's strategy. The mirroring strategy (like in Hex on a symmetric board) is constructive and works only if the board is symmetric and the opponent mirrors. Our argument does not require symmetry and does not tell the first player to mirror.

     - **Misconception 3**: The conclusion is that the first player wins at Tic-Tac-Toe.
       - Correction: Tic-Tac-Toe admits draws. The strategy-stealing argument in TTT would only prove that the second player cannot have a winning strategy, but the first player might only force a draw. In Hex, because there are no draws, we get that the first player must have a winning strategy.

     - **Misconception 4**: Why can't the second player steal?
       - Point out the asymmetry: The first player makes the extra move. The second player doesn't have that luxury. The first player uses the extra move to set up the stealing.

  6. **Why Hex and not TTT? (3 minutes)**
     - Reiterate: In TTT, if we try the same argument, we get that the second player cannot have a winning strategy. But the first player might not have one either (because of draws). In Hex, because there are no draws, the first player must have a winning strategy.

  7. **Smallest Change to Break the Argument (5 minutes):**
     - What if we change the rules so that an extra stone might be a disadvantage? 
       - Example: Suppose we say that having a stone in a particular cell (say, the center) causes you to lose. Then monotonicity fails. 
       - Alternatively, if the game could end in a draw, then the argument would only show that the second player doesn't have a winning strategy, but the first might not either.

  8. **Genuine Surprise (5 minutes):**
     - Reveal that the strategy-stealing argument doesn't just work for Hex. It works for any symmetric game with no draws and monotonicity. 
     - Surprise: Even though we proved the first player has a winning strategy for any board size, we don't know the winning strategy for even a 9x9 board! (We do for small boards, but not for large ones.)

  9. **Closing Question (5 minutes):**
     - "Suppose we try to apply the strategy-stealing argument to Chess. Would it work? Why or why not?"
       - Expected wrong answers:
          a. "Yes, because it's a two-player game." -> But Chess has draws and the extra piece (if we try to steal) might be a liability (e.g., if it's a pawn that blocks your own king).
          b. "No, because Chess has draws." -> Correct, but we also need monotonicity (which fails: an extra piece might be captured and used against you).
          c. "No, because Chess is too complex." -> The real issue is the draw condition and non-monotonicity.

     - This question tells us if they understood the necessary conditions: no draws and monotonicity.

  10. **Deferred Topics (2 minutes):**
      - We are assuming that Hex cannot end in a draw. This is true but we are not proving it today.
      - We are not discussing how to find the winning strategy (it's hard!).
      - We are not talking about other games (like Chomp) or advanced topics (determinacy, Maker-Breaker). But we name:
          - The no-draw property (topological fact) for Hex.
          - The fact that for finite perfect information games without draws, one player must have a winning strategy (but we might not know which one, and the strategy-stealing helps in symmetric games).

  ### Minute Allocation
  - 0-5 min: Play TTT and discuss.
  - 5-10 min: Introduce Hex and play a quick game.
  - 10-12 min: Pose the question: Who has a winning strategy?
  - 12-32 min: Present the strategy-stealing argument step by step (with board illustrations).
  - 32-42 min: Address misconceptions.
  - 42-45 min: Why Hex and not TTT?
  - 45-50 min: Smallest change to break the argument.
  - 50-55 min: Genuine surprise (we don't know the strategy for large boards).
  - 55-60 min: Closing question (Chess) and discussion.
  - 60-75 min: Wrap-up, deferred topics, and answer questions.

  ### What to Leave Out
  - Explicitly state we are deferring:
     - The proof that Hex cannot end in a draw (topological argument).
     - The general theory of determinacy for finite games (though we use it implicitly).
     - Maker-Breaker games and other variants.
     - The complexity of finding the winning strategy in Hex (it's PSPACE-complete).
     - Known winning strategies for small boards (we can mention that for 7x7 we know one, but for large boards we don't).

  This plan ensures that the core idea of non-constructive proof is highlighted, the necessary conditions for the argument are clear, and common misconceptions are addressed proactively.
answer: |-
  Below is a complete pedagogical plan for your 75-minute section, structured around dependency and misconceptions. The goal is to make the strategy-stealing argument's non-constructive nature vivid while preempting conceptual pitfalls. I recommend **Hex** as the primary example (over tic-tac-toe or Chomp) for its clarity, symmetry, and lack of draws. I'll justify this choice, address your concerns, and provide a minute-by-minute sequence with misconception handling.

  ### Why Hex (and Not Tic-Tac-Toe or Chomp)?
  - **Hex is ideal** because:  
    (1) It has **no draws** (critical for the conclusion that the first player wins, not just forces a draw),  
    (2) It satisfies **monotonicity** (an extra stone never hurts, making the stolen move "harmless"),  
    (3) The board is **symmetric** (simplifies the stealing analogy), and  
    (4) It's **visually intuitive** (connect opposite sides).  
  - **Tic-tac-toe is flawed** for this argument: It allows draws, so strategy-stealing only proves the second player *cannot win*—not that the first player *must win*. This dilutes the non-constructive "gap."  
  - **Chomp is problematic**: The corner move isn't "stolen" in the same way; it's a specific optimal move. Hex's monotonicity is more general and illustrates the core license (any extra stone helps).  
  - **They are two species of one argument**: Both rely on **ownership symmetry** and **no-draws**, but Hex better isolates the non-constructive essence.  
  - **Smallest change to break the argument**: If Hex allowed draws (e.g., by adding a third player), the contradiction fails—you could only conclude "second player has no winning strategy."  
  - **Swap rule**: This *is* a fresh application of the same non-constructive trick (proving the first move must be good enough to "steal"), but skip it to avoid complexity.  

  **Concession about no-draws**: Openly state: *"Hex can never end in a draw—one player always wins. We'll assume this as a fact today because proving it requires topology, which is beyond this class. Focus on how we use this property."*  

  ---

  ### Session Plan: Dependency Structure & Timing (75 min total)
  **Core Dependency Chain**:  
  `Game rules → Winning strategy defined → Assume second player wins → Steal strategy → Handle collisions → Monotonicity license → Contradiction → Asymmetry insight → Non-constructive conclusion`  

  #### Phase 1: **Experience the Void** (10 min)
  - **Activity**: Pairs play 3×3 Hex (5 min) with printed boards.  
    - **Why before theory?** To make them feel the frustration of *not finding* a strategy. Use 3×3 because games end quickly.  
  - **Immediate Discussion** (5 min):  
    - *"Did anyone find a guaranteed winning strategy for Player 1? Player 2?*"  
    - **Expected confusion**: Some pairs will think it's a draw or that Player 2 wins. Mitigate this by:  
      - **Conceding openly**: *"Hex has no draws, but on small boards, it's hard to see why. For now, trust that draws are impossible—we’re using that."*  
      - **Pivot**: *"What if I told you we can prove Player 1 wins without knowing how?"*  

  #### Phase 2: **Build the Argument** (35 min)
  1. **Define winning strategy** (3 min):  
     - Use tic-tac-toe as a warm-up: *"In tic-tac-toe, Player 1’s winning strategy would guarantee a win no matter what Player 2 does. But we know it only forces a draw. Hex is different—no draws exist."*  
     - **Key dependency**: Must clarify "winning strategy" before assuming one exists.  

  2. **Assume second player has a winning strategy** (2 min):  
     - *"Assume Player 2 (Blue) has a magic notebook that tells them how to respond to any Player 1 (Red) move to guarantee a win."*  
     - **Misconception preemption**: Emphasize this is hypothetical.  

  3. **Steal the strategy** (10 min):  
     - **Player 1’s trick**:  
       - Move 1: Player 1 makes an *arbitrary* move (e.g., cell X).  
       - Move 2 onward: Player 1 "steals" Player 2’s strategy. After Player 2 moves, Player 1 asks: *"What would Player 2’s strategy do in this position if cell X were empty?"* Then plays that move.  
     - **Visual aid**: Use the document camera to simulate a partial game.  
     - **Dependency**: Students must grasp "simulating the opponent’s strategy" before handling collisions.  

  4. **Collisions and monotonicity** (15 min):  
     - **Problem**: *"What if Player 2’s strategy says to play in cell X, but it’s already taken?"*  
     - **Solution**: Player 1 plays *anywhere* (free choice).  
     - **Why this is okay? Monotonicity license**:  
       - *"In Hex, an extra Red stone never helps Blue and might help Red. So if the strategy wins for Blue on a board with X empty, it should still win for Blue with X occupied by Red—unless Blue’s move was blocked, but Player 1 can just play elsewhere."*  
       - **Demo**: Show a 3×3 board where Red has an extra stone in a harmless position (e.g., corner). Ask: *"Does this hurt Red? Could it help?"*  
     - **Misconception preemption**: Explicitly contrast with tic-tac-toe: *"In tic-tac-toe, an extra X might block a win. Hex lacks this—stones only help their owner."*  

  5. **Contradiction and asymmetry** (5 min):  
     - *"Player 1’s stolen strategy guarantees a win. But we assumed Player 2 wins—contradiction! So Player 2 cannot have a winning strategy."*  
     - **Asymmetry insight**: *"Why can’t Player 2 steal too? Player 1 has an extra stone—they start with more 'resources.' Player 2 has no free move to compensate."*  
       - **Visual cue**: Circle Player 1’s first move on the board: *"This stone is the source of the asymmetry."*  

  #### Phase 3: **Consolidate and Test Understanding** (30 min)
  1. **Address misconceptions head-on** (10 min):  
     - **"The argument tells you how to play"**:  
       - *"Where should Player 1 move first? Could it be anywhere? The proof doesn’t say—it just assumes one arbitrary move."*  
       - **When**: Immediately after explaining the contradiction.  
     - **"It’s just copycat"**:  
       - *"Copycat mirrors moves symmetrically, but our theft isn’t mirroring—it’s simulating the opponent’s strategy. And we have a fallback for collisions, which only works because of monotonicity."*  
       - **Demo**: Show a board where mirroring would fail (e.g., asymmetric opening), but strategy-stealing still holds.  
       - **When**: During monotonicity discussion.  
     - **"Conflation with tic-tac-toe"**:  
       - *"In tic-tac-toe, this argument would only prove Player 2 can’t force a win—Player 1 might still only draw. Hex’s no-draw property forces a win."*  
       - **When**: Contrast Hex and tic-tac-toe after the contradiction.  
     - **"Symmetry fallacy"**:  
       - *"Player 2 has no extra stone to use as a ‘free action’—the asymmetry is in who moves first."*  
       - **When**: During asymmetry discussion.  

  2. **Genuine surprise** (5 min):  
     - *"We’ve proved Player 1 wins on any size Hex board, but we only know explicit strategies for boards up to 9×9. For 10×10, we know a win exists but have no idea how to achieve it!"*  
     - **Recruitment hook**: *"This is why combinatorics is thrilling—proving something exists without finding it is just the start."*  

  3. **Closing question** (10 min):  
     - *"Could this argument work for chess? Why or why not?"*  
     - **Correct answer**: No, because (a) chess has draws, and (b) monotonicity fails (an extra piece might be captured, helping your opponent).  
     - **Wrong answers and diagnoses**:  
       - *"Yes, chess is a two-player game"* → Misses dependency on no-draws/monotonicity.  
       - *"No, because chess isn’t symmetric"* → Partial credit, but the core issue is draws/monotonicity.  
       - *"No, because strategies are too complex"* → Confuses non-constructive proof with computational complexity.  
     - **Why this question**: Tests grasp of the necessary conditions (no draws, monotonicity).  

  4. **What to defer explicitly** (5 min):  
     - Name and postpone:  
       - *Topological proof for no-draws in Hex* (worth naming to validate your earlier concession).  
       - *Determinacy of finite games* (mention it exists but requires deeper game theory).  
       - *Explicit winning strategies for large boards* (note it’s an active research area).  
     - **Do not raise**: Maker-Breaker theory, computational complexity, or Chomp. They distract from the core idea.  

  ---

  ### Summary of Key Pedagogical Moves
  - **Start with play** to create cognitive dissonance ("I can’t find it, but it exists").  
  - **Use Hex exclusively** for its no-draw property and monotonicity.  
  - **Isolate asymmetry** by highlighting Player 1’s extra stone as the lynchpin.  
  - **Preempt misconceptions in flow**:  
    - Block "copycat" confusion during monotonicity discussion.  
    - Contrast Hex/tic-tac-toe immediately after the contradiction.  
  - **Surprise with the unknown**: Emphasize that we lack strategies for large boards.  
  - **Close with chess** to test transfer of necessary conditions.  

  This sequence ensures each concept builds on the last, misconceptions are dismantled as they arise, and the non-constructive "gap" remains the star.
