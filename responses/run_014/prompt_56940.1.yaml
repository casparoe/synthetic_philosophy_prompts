  ## The Pasadena Gamble: A Problem Dissolved, Not Solved

  The Pasadena game presents a stark challenge to the foundations of decision theory. A fair coin is flipped until it lands heads, on flip *n*. The payoff is then (-1)^{n+1} * (2^n)/n dollars. Summing the expected values in the order of play yields the tantalizingly finite ln(2) ≈ $0.69. Yet, this convergence is purely conditional. Rearrange the terms of the infinite series representing the expectation, and you can make it converge to *any* real number or even diverge to positive or negative infinity. Unlike the St. Petersburg paradox, where expectation is unambiguously infinite, the Pasadena game possesses *no* unique expected value. This leads to the provocative claim: when expectation fails to exist in this specific manner (conditional convergence), the question "should you take the bet?" is fundamentally ill-posed. It is not a difficult decision problem awaiting a clever solution; it is a conceptual mirage. I argue forcefully for this view. The Pasadena game isn't a paradox demanding resolution within standard expected utility theory (EUT); it is a revelation of EUT's inherent boundaries, exposing absolute convergence as a hidden precondition we blissfully ignore until violated.

  ### The Illusion of Solutions: Dissecting Proposed Fixes

  Proponents of finding a determinate answer propose various "repairs." Let's engage the strongest contenders and see how they fail to address the original problem, instead substituting a different one:

  1.  **Truncation (Stop at N flips):** "The game cannot literally run forever; bound it at a large but finite N. Then expectation exists and is computable (approaching ln(2) as N grows)."
      *   **Why it changes the game:** This doesn't solve the *infinite* Pasadena game; it replaces it with a *different*, finite game. The core unsettling feature – the infinite tail whose contribution is pathologically sensitive to ordering – is explicitly removed. While practical for real-world approximations, truncation dodges the conceptual problem. The question was about the gamble *as defined*, with potentially unbounded flips and payoffs. Answering "take it" for the truncated game tells us nothing about the ill-defined infinite original. It answers a safer, adjacent question.

  2.  **Privileged Temporal Ordering:** "The outcomes occur sequentially in time. Therefore, the order of summation *is* fixed – the order in which the payoffs would actually be received. Use that order to get ln(2)."
      *   **Why it misses the point (and changes the question):** This confuses the *calculation* of expectation with the *existence* of expectation. Mathematical expectation, as defined for discrete random variables, is the sum of (payoff * probability) over *all* possible outcomes, considered simultaneously. The temporal sequence of *how* you reach an outcome is irrelevant to the static mathematical definition. Privileging the temporal order smuggles in a specific summation procedure to force a finite answer. It doesn't prove the expectation *exists* independently; it imposes an ordering to manufacture one. Furthermore, it implicitly shifts the question from "what is the expected value of this random variable?" to "what is the time-averaged payoff if I play sequentially?" – subtly different questions where the latter might have an answer while the former does not.

  3.  **Utility Bounding/Discounting:** "No one values infinite money linearly. Bound utility or discount improbable, extreme payoffs. Then expectation converges absolutely."
      *   **Why it changes the game (and the theory):** This is perhaps the most principled *revision* of EUT itself, not a fix for the Pasadena game within standard EUT. It acknowledges that unbounded utility functions can cause pathologies. However, applying it *retroactively* to the Pasadena game alters the fundamental gamble. The game was defined with specific dollar payoffs. Imposing a utility transformation changes the structure of rewards the agent faces. It answers the question "should you take the bet *if your utility function is bounded*?" – a different question than the one posed about the gamble with its stated dollar payoffs. It solves a problem *created* by unbounded utility in EUT, not the problem *of* the non-existent expectation defined by the original payoffs.

  ### Defining Away or Legitimate Self-Limitation?

  Critics might argue that declaring the problem ill-posed is simply "defining away" an embarrassment, a retreat from decision theory's ambition to guide rational choice under uncertainty. This mischaracterizes the move. Recognizing the limits of a formal concept is not weakness; it is intellectual rigor. We accept that division by zero is undefined in arithmetic, not because it's "embarrassing," but because defining it consistently within the system is impossible. Similarly, probability theory doesn't assign probabilities to non-measurable sets; it acknowledges this as a boundary. EUT relies on the existence of a well-defined expectation operator. The Pasadena game demonstrates a scenario where this operator *fails to yield a unique value*, violating a core mathematical requirement of the theory (absolute convergence being necessary for the sum to be order-invariant).

  Insisting on applying EUT here is like insisting on using Newtonian mechanics at relativistic speeds and then demanding a "fix" when it breaks down. The rational response isn't to contort Newtonian mechanics; it's to recognize its domain of applicability and switch to relativity. Treating the Pasadena game as ill-posed within standard EUT is acknowledging its domain of applicability – situations where expectation exists unambiguously, which requires the payoff series to be absolutely convergent or at least yield an unambiguous infinite value. Making EUT self-limiting in this way isn't defining away problems; it's *correctly identifying* problems that fall outside its scope. It prevents the theory from generating nonsensical or contradictory "answers" where none can exist.

  **Verdict: The Question is Ill-Posed.**

  The strongest arguments for a determinate answer ultimately rely on altering the gamble (truncation, utility transformation) or misapplying the definition of expectation (privileged ordering). They do not successfully extract a unique, well-defined expected value *for the gamble as originally defined* within the standard framework of EUT. The pathological sensitivity to summation order is not a quirky mathematical artifact; it is a fatal symptom revealing the non-existence of the central quantity EUT requires – the expected value. To ask "should you take the bet?" presupposes this quantity exists to guide the decision. When it demonstrably does not, the question itself lacks meaning within the theory. The Pasadena game isn't a puzzle for decision theorists to crack; it is a brilliantly designed litmus test, exposing the hidden precondition of absolute convergence and demonstrating that rationality, as formalized by EUT, is simply silent in this logically possible but mathematically pathological corner. The right response is not a repair, but recognition: this is not a valid decision problem for expected utility theory. The paradox dissolves when we acknowledge the theory's limits.
