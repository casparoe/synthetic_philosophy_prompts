prompt: |-
  I'm a third-year history undergrad and I'm applying for my department's summer research fellowship — ten weeks, a small stipend, two-page proposal due Friday, and my supervisor is on sabbatical so I've got nobody to sanity-check this on. My half-formed idea came out of an argument at a pub a few weeks ago that never resolved. Someone said 'the Middle Ages' is obviously a bogus category, because the people living in it didn't think they were in the middle of anything, and the label only exists because the humanists afterwards wanted to define themselves against a dark stretch. Someone else said fine, but 'the Scientific Revolution' isn't the same kind of mistake, because whatever you end up calling it, there's a real knot of change in the seventeenth century that any narrative of modernity has to route through. And I genuinely couldn't tell what the disagreement was about — the world, or the words, or something else.

  The distinction I want to build the project on (I'm aware I may have reinvented it, but it's mine for now): some period labels look like *boundary* terms, which pick out a stretch purely by what it sits between, so their content is mostly residual — after Rome, before the moderns. Others look like *trajectory* terms, which claim a direction of change and smuggle in an evaluation (rebirth, revolution, enlightenment), so they can't be neutral about whether what they name was good. And a third kind are *threshold* terms, which assert that some specific property switches on at a datable point — print, experiment, the mechanical philosophy, whatever you like. My hunch is that the deflationists and the defenders talk past eachother because they test all three kinds against the same criterion, roughly 'did the people at the time recognise it', and that's a fair test for threshold terms but a category error for boundary ones.

  So: turn this into the two-page proposal. I need the research question stated precisely enough that it could genuinely come out either way, plus a defence of why the two existing camps — the 'all periodization is retrospective projection' people and the 'some labels track real discontinuities' people — don't already settle it. Then the method, week by week with more detail for the first three weeks and in blocks after that, and please make it a real method rather than 'read widely and think carefully'. I'm imagining I take two or three labels, ideally one of each type, and run them through some explicit test, but you tell me which labels and what the test actually is — that's the part I can't see yet. Say why that approach beats the obvious alternative, which would just be tracing the history of the words themselves. Then: what a result would look like at the end, i.e. what I'd hand in that someone who doesn't care about historiography could use, and what would count as the project *failing* rather than merely being inconclusive, because the committee will definitely ask. And be honest about whether ten weeks is realistic for a third-year and where I should cut scope if it isn't. No bibliography and no literature survey — I'll add citations once I've actually read the stuff. Just begin with the proposal itself, no preamble, no throat-clearing paragraph restating my idea back at me, since two pages is two pages.
