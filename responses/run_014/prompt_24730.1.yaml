  Ah, and the "only time-consistent scheme" claim - this is technically true under dynamic consistency axioms, but that's circular reasoning! The axioms define consistency as requiring exponential discounting. Philosophers like Parfit would argue that changing valuations over time isn't irrational per se. Need to flag this as definitional rather than empirical.

