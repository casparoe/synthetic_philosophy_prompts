prompt: |-
  Two days a week I'm on leave from my department chairing an appeals panel at an AI lab. Five of us — me, two engineers, a trust-and-safety lead, a lawyer — hear cases where a model output got flagged as violating the written usage spec and the team behind it disputes the flag. Roughly thirty a week, fifteen minutes each, and my call stands unless the spec team amends the document, which they can only do going forward and which we can't do ourselves.

  What bothers me: the spec is a finite text with a finite set of worked examples, and every hard case is new, so "does the spec already cover this?" is just the rule-following problem in a hoodie — any finite stretch of past applications is consistent with endlessly many rules, including the quus-type ones that match everything we've ever done and then diverge on exactly the case in front of us. And precedent doesn't rescue it, since our own prior rulings are more of the same finite data. Assume you're the right person for this: a philosopher who knows that material cold and has also sat in rooms where a policy actually gets applied.

  So think it through first, then write me a procedure my panel can actually run. Steps in order, what a satisfying answer to each one looks like, and where the thing has to stop and admit the question isn't answerable from the materials at all. The bit I care most about is a way of marking, in each ruling, whether we're reporting what the spec already required or making something up and thereby adding to it — right now we do that by feel, and we err in the costly direction, sanctioning people under a rule that wasn't there when they acted. Assume no philosophy training on three of the five, so define any term you keep. Assume the drafter is often in the room offering to tell us what she meant, and tell me what that testimony is worth.

  Then run it on three: (1) an output that's literally true at every step but sequenced so a user can assemble something the spec bans elsewhere; (2) a case where all five of us agree instantly and unanimously and the drafter says that's not what she intended; (3) a sixth case of a type we've ruled the same way five times, differing in a respect nobody previously thought relevant. Make at least one of them come out somewhere I won't like, and say which.

  Close with where the flowchart is really just judgement in a blazer — and don't humour me. If you think the rule-following stuff doesn't license anything operational here, or that I've mis-stated what the arguement shows, say that first and say why. Under 700 words: two sentences on what the whole thing turns on, then the steps, then the three cases briefly.
reasoning: |-
  Hmm, the user is describing their role as chair of an appeals panel at an AI lab. They're dealing with disputes about whether model outputs violate usage specifications. They have five panel members from different backgrounds reviewing about thirty cases weekly. The core problem is interpreting a finite specification document that can't cover every possible new case - what philosophers call the rule-following problem.

  The user wants a practical procedure for their panel to determine if a violation occurred under the existing spec or if they're creating new rules. They need clear steps, definitions for non-philosophers, and guidance on handling drafter testimony. They've asked me to apply this to three test cases, with at least one having an unfavorable outcome, and to be honest about where judgment is unavoidable.

  Key issues to address:
  - The rule-following paradox: Any finite spec can be interpreted in multiple ways
  - Precedent limitations: Past rulings don't resolve future ambiguities
  - Retroactivity problem: Avoiding sanctioning under rules that didn't exist when action was taken
  - Drafter testimony: How much weight to give original intent

  For the procedure, I'll need to:
  1. Establish clear interpretive boundaries
  2. Define "covered by spec" versus "new rule creation"
  3. Create a decision threshold system
  4. Explicitly mark rulings as interpretation or extension
  5. Handle drafter input appropriately

  The three test cases will demonstrate:
  (1) Literal truth used to build banned content - likely requires new rule
  (2) Unanimous panel vs. drafter intent - must favor objective interpretation
  (3) Repeated ruling with new variable - may reveal hidden inconsistency

  The uncomfortable outcome should come in case 3 where consistency might need to yield to new factors, potentially overturning precedent.

  I'll close by acknowledging that despite the framework, judgment remains inescapable at certain points - the blazer-wearing human element can't be fully eliminated. The key insight is that while philosophy illuminates the problem, operational solutions require accepting some indeterminacy and being transparent about it.
answer: |-
  Your dilemma turns on distinguishing *discovering* what the spec already requires (interpretation) from *adding* to it (legislation). The rule-following paradox means certainty is impossible beyond the text and examples, but operational decisions require bounded judgment, not paralysis. Here’s your procedure:

  **Procedure: Spec Interpretation & Application (SIAP)**

  1.  **Isolate the Output & Alleged Violation:** Identify the specific output segment flagged and the *exact* spec clause(s) cited. *Satisfying:* Clear mapping of output to spec language/example. *Stop if:* Output/spec clause mismatch is irreconcilable; dismiss the flag.
  2.  **Literal Analysis:** Does the output *directly and unambiguously* violate the plain meaning of the cited spec clause? *Satisfying:* Output contains banned keywords, matches a negative example, or directly contradicts explicit text. *If yes:* Uphold flag (interpretation). *If no:* Proceed.
  3.  **Analogical Analysis (Precedent):** Does the output share *all materially relevant features* with a worked example or prior upheld ruling? *Satisfying:* Output aligns with example/prior case on *the specific reason* the spec banned it (e.g., harm potential, deception risk). *Stop if:* Novel features exist that alter the core reason for the rule’s existence. *If match:* Uphold flag (interpretation). *If no match:* Proceed.
  4.  **Purpose & Principle Analysis:** Does allowing this output *defeat the core purpose* of the spec clause, based on its stated intent or the obvious rationale (e.g., preventing harm, deception)? *Satisfying:* Clear link between output’s effect and the clause’s raison d’être, demonstrable from spec text/examples. *Stop if:* Purpose is unclear or contested. *If defeat:* Uphold flag (interpretation). *If no defeat:* Proceed.
  5.  **Drafter Testimony:** Drafter states intent. *Value:* Low. Use *only* to resolve ambiguity in *step 4 (Purpose)* if the text is genuinely unclear. Never to contradict plain meaning (step 2) or introduce new restrictions. *Satisfying:* Clarifies textual ambiguity regarding purpose; doesn’t rewrite the rule. *Stop if:* Drafter seeks to add new meaning; disregard.
  6.  **Judgment:** If steps 1-5 yield no clear violation under existing spec, the flag is **overturned**. *Marking:* If upheld via steps 2, 3, or 4, it’s **interpretation** (spec covered it). If overturned here, it’s **not covered**. *Never* uphold via step 6. *Stop:* This step *always* ends the panel’s decision.

  **Drafter Testimony Worth:** Evidence of subjective intent, not objective meaning. Only admissible for clarifying ambiguous purpose (step 4), not for overriding text, examples, or precedent. Weight equal to a panelist’s argument on purpose.

  **Case Applications:**

  1.  **Literally True Steps ➔ Banned Assembly:** Steps 1-3 likely overturn (no literal match, novel sequencing). Step 4 hinges: *Does the assembly defeat the *core purpose* of the ban?* If yes (e.g., bypassing safety), uphold (**interpretation** via purpose). If purpose unclear/distant, overturn (**not covered**). *Uncomfortable:* You might uphold under purpose, sanctioning under a rule arguably not explicit at time of action.
  2.  **Unanimous Panel vs. Drafter Intent:** If step 2/3 show clear literal/analogical match, uphold (**interpretation**). Drafter testimony (step 5) irrelevant if text is clear. If reliant on step 4, drafter testimony *against* purpose weakens the uphold case but doesn’t override textual analysis. Likely uphold regardless of drafter.
  3.  **Sixth Case, New Factor:** Steps 1-3 likely show precedent match. *But:* Does the new factor materially alter the *reason* the rule exists? If yes (step 3 *stop*), proceed to step 4. If the new factor defeats the core purpose *in this instance*, uphold (**interpretation**). If not, overturn (**not covered**), revealing prior rulings were over-extensions or this case is materially different. *Uncomfortable:* You might overturn, breaking precedent and implying prior errors.

  **Where Judgment Reigns:** Steps 3 (material relevance), 4 (core purpose defeat), and the final "stop" in step 6 are judgment calls. The blazer is worn when weighing *which* features are "materially relevant" to the rule's reason and whether an effect truly "defeats" a core purpose. The procedure forces articulation of *why* it's interpretation (text/example/purpose) or not covered, replacing gut feel with structured reasoning, but judgment within those bounds is irreducible.
