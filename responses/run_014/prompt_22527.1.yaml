prompt: |-
  I sit on my company's forecasting committee, which produces the probability estimates the board uses for capital allocation, and this quarter we have to put a number on whether our new logistics platform will be live by year-end. We're deadlocked on which base rate to anchor on, and I think the disagreement is really about how specific our reference class should be. One faction wants to use the industry-wide on-time delivery rate for projects of this size, which comes out to about 55% on a sample of a few hundred projects, but our stack and our team are unusual in ways that rate probably doesn't capture. Another faction wants to use our own internal track record for similar platforms, which is 6 out of 8 — more directly relevant, but a small enough sample that one bad quarter moves the number a lot. A third faction, mostly the PM, argues the project is genuinely novel and we should just take her subjective judgment (roughly 85%) at face value, which I suspect is a polite way of abandoning the reference-class approach altogether. I was talking this through with a colleague over lunch who keeps saying we should just weight the classes by sample size, and I'm not sure that's coherent, because the narrower classes are precisely the ones where the sample size is small.

  Can you draft the committee's decision memo recommending which reference class — or what principled combination of them — we should use for this particular estimate? I need the reasoning to be something we could actually stand behind in front of the board, and I'd like an honest treatment of the strongest case for the approach we end up not adopting, because the PM will be in the room and she's sharp.
reasoning: |-
  Okay, the user is on a forecasting committee and needs to draft a decision memo for their board. They're stuck on which reference class to use for estimating the probability that their new logistics platform will be live by year-end. There are three factions: one wants industry-wide data (55% from hundreds of projects), another prefers internal track record (75% from 6 out of 8 projects), and the PM argues for subjective judgment (85%). The user's colleague suggests weighting by sample size, but the user is skeptical because narrower classes have smaller samples.

  First, I need to understand the core issue. The debate is about how specific the reference class should be. The industry data has a large sample but may not account for the company's unique stack and team. The internal data is more relevant but only has eight data points. The PM's view is highly specific but subjective. The user wants a principled approach that can be defended to the board, including addressing the PM's argument.

  The user’s deeper needs include credibility in front of the board, reconciling different viewpoints, and ensuring the decision is data-driven yet practical. They need a solution that balances statistical rigor with real-world applicability. Also, they must maintain team cohesion, especially since the PM is sharp and will challenge the decision.

  I recall that reference class forecasting involves choosing a relevant class of similar projects. The tension here is between representativeness and sample size. Industry data is broad but may not capture company-specific factors. Internal data is specific but small. The PM’s view is too narrow and subjective. Weighting by sample size might overemphasize the industry data, ignoring the company's unique strengths.

  A combined approach seems best. Use the internal data as the anchor but adjust towards the industry mean to account for the small sample size. This is the Bayesian approach: the internal success rate (75%) is the prior, and the industry data (55%) provides evidence to temper overconfidence. The adjustment would be based on the strength of the prior, which relates to sample size. For example, with eight internal projects, the weighted estimate might be around 65-70%.

  The memo needs to acknowledge the PM's expertise but explain why subjective judgment alone isn't sufficient. It's prone to optimism bias. However, her insights could be used to adjust the final probability if there are specific reasons the current project differs from past ones.

  For the board, clarity is key. Presenting a combined estimate with a clear methodology shows thoroughness. Highlighting the sensitivity analysis (e.g., success rates with seven or five projects) addresses sample size concerns. Including a table comparing options helps visualize trade-offs.

  The PM's strongest case is that the project's novelty makes past data irrelevant. The counter is that all projects have unique aspects, but base rates still provide valuable anchors. Subjectivity can supplement but not replace data.

  I should structure the memo to outline each option's pros and cons, then recommend the Bayesian weighted approach. Emphasize that internal data is the best anchor but needs tempering due to sample size. Include implementation steps: calculate the weighted estimate, document adjustments based on PM's input, and present a range. Stress that the PM's insights are valued and will inform adjustments, maintaining her involvement without over-relying on subjectivity.
answer: |-
  ## MEMORANDUM  
  **To:** Forecasting Committee Members  
  **From:** [Your Name], Chair, Forecasting Committee  
  **Date:** October 26, 2023  
  **Subject:** Recommended Reference Class Methodology for Logistics Platform Go-Live Probability Estimate  

  ### 1. Purpose
  This memo recommends a principled methodology for estimating the probability that the new logistics platform will be live by year-end, resolving our deadlock on reference class selection. The approach balances statistical rigor, relevance to our unique context, and defensibility to the Board.

  ### 2. Core Challenge
  Our disagreement centers on the tension between **specificity** and **statistical reliability** in reference classes:
  *   **Industry Data (55%):** High reliability (n=~200) but lower specificity (may not capture our stack/team advantages).
  *   **Internal Data (6/8 = 75%):** High specificity but low reliability (n=8, highly sensitive to small changes).
  *   **Subjective Judgment (85%):** Maximum specificity but lacks external validation and is vulnerable to optimism bias.

  Weighting purely by sample size (as suggested) is inadequate. It would overwhelmingly favor the industry data (55%), effectively ignoring our internal track record and unique strengths – the very factors making our context unusual.

  ### 3. Recommended Approach: Bayesian Anchoring with Calibrated Adjustment
  We propose anchoring on the **internal track record** as the most directly relevant prior belief, then systematically adjusting this prior towards the **industry base rate** based on the relative uncertainty of our internal sample. The Project Manager’s (PM) expertise will then be applied as a final, documented adjustment factor for project-specific factors not captured by either class.

  **Step 1: Anchor on Internal Track Record (The Prior)**
  *   **Rationale:** Our 75% success rate (6 out of 8) on "similar platforms" is the best available starting point. It inherently incorporates our company-specific culture, processes, technology stack maturity, and team capabilities – factors not fully reflected in broad industry data. Specificity is paramount when credible internal data exists.
  *   **Calculation:** Prior Success Rate = 6/8 = 75%.

  **Step 2: Adjust Towards Industry Base Rate (The Likelihood/Update)**
  *   **Rationale:** Our internal sample (n=8) is small, creating significant uncertainty. The industry base rate (55%, n=~200) provides a robust estimate of the underlying probability *absent our specific advantages/disadvantages*. We adjust our prior towards this broader evidence proportionally to the strength (or weakness) of our internal sample.
  *   **Calculation (Simplified Bayesian Shrinkage):**
      *   "Effective Weight" of Internal Data: `Internal_n / (Internal_n + K)`
      *   "Effective Weight" of Industry Data: `K / (Internal_n + K)`
      *   **Where `K` is a "stability constant"** representing how strongly we pull towards the industry mean. `K` should reflect our confidence in the industry data capturing *general project risk*. Given the industry sample size, a `K` of 10-20 is reasonable (representing 10-20 "pseudo-observations" from the industry). **We recommend `K=15` for initial calculation.**
      *   Adjusted Estimate = (Internal_Weight * Internal_Rate) + (Industry_Weight * Industry_Rate)
      *   **Example (`K=15`):**
          *   Internal Weight = 8 / (8 + 15) = 8/23 ≈ 0.348
          *   Industry Weight = 15 / (8 + 15) = 15/23 ≈ 0.652
          *   Adjusted Estimate = (0.348 * 0.75) + (0.652 * 0.55) = 0.261 + 0.359 = **0.62 (or 62%)**

  **Step 3: Incorporate PM Judgment as a Calibrated Adjustment (The Specific Override)**
  *   **Rationale:** The PM possesses deep, current knowledge of *this specific project's* risks and progress unseen in historical data. However, subjective judgment must be applied transparently and conservatively to avoid bias.
  *   **Implementation:**
      1.  The PM presents specific, documented reasons why *this project* deviates significantly *favorably* from the historical internal projects or industry norms (e.g., unique mitigation for past failure causes, exceptional current team performance metrics, reduced scope critical path).
      2.  The Committee assesses these reasons and assigns a *calibrated upward adjustment* to the Step 2 estimate (62%). This adjustment should be **modest and justified** (e.g., +5%, +10% absolute maximum). *The burden of proof is high.*
      3.  **Example Adjustment:** If compelling evidence is presented, final estimate = 62% + 8% = **70%**. (PM's initial 85% is not adopted outright but informs the *magnitude* of the adjustment).

  **Final Recommended Estimate Range:** **62% - 70%**  
  *(Based on K=15 adjustment + 0-8% PM adjustment)*

  ### 4. Strongest Case for the Rejected Alternative (Subjective Judgment)
  The Committee acknowledges the compelling argument presented by the PM and supporters of relying primarily on expert judgment:
  *   **"This project is genuinely novel."** Our new logistics platform integrates unprecedented technologies (X, Y) with a uniquely skilled team assembled specifically for this challenge. Past projects, internal or external, are argued to be poor analogs. The PM's 85% estimate incorporates real-time, granular insights into current sprint velocity, resolved critical path risks, and vendor performance that aggregate base rates cannot capture. Subjectivity, in this view, is not abandoning reference classes but recognizing that *no sufficiently specific reference class exists*, making expert intuition the least bad option. It prioritizes the most current and project-specific information over potentially misleading historical aggregates.

  ### 5. Why We Do Not Recommend Pure Subjective Judgment
  While compelling, the Committee finds this approach carries unacceptable risks for Board-level capital allocation:
  1.  **Optimism Bias:** Extensive research (e.g., Kahneman, Lovallo) shows experts, especially project leaders, are systematically over-optimistic. Anchoring is essential to mitigate this.
  2.  **Lack of Calibration:** Subjective estimates are hard to calibrate or hold accountable post-hoc. Base rates provide an objective benchmark.
  3.  **Reproducibility:** A process relying solely on judgment is difficult to replicate consistently across future forecasts.
  4.  **Ignoring Relevant Data:** It dismisses the valuable, albeit imperfect, signals from our own 75% track record and the industry's 55% reality check. Even novel projects share fundamental execution risks (integration, scope creep, testing) reflected in those rates.
  5.  **Governance:** The Board expects forecasts grounded in data and structured methodology, not solely in individual conviction, however well-informed.

  ### 6. Implementation & Board Presentation
  1.  **Calculate Baseline:** Present the 62% estimate derived from anchoring internally (75%) and adjusting towards industry (55%) using K=15.
  2.  **Document PM Adjustment:** Clearly list the specific, project-positive factors cited by the PM and the Committee's rationale for the chosen adjustment (e.g., +8%), or the decision for zero adjustment.
  3.  **Present Final Estimate:** State the final probability (e.g., 70%) and the range (62-70%) representing the methodological boundaries.
  4.  **Acknowledge Uncertainty:** Explicitly state this remains an estimate. Highlight key risks that could lower the probability (e.g., specific unresolved integrations, vendor dependencies) alongside the PM's positive factors.
  5.  **Recommendation:** **Adopt a final probability estimate of 70%** (incorporating the K=15 adjusted baseline and the documented +8% PM adjustment based on specific mitigating factors).

  ### 7. Conclusion
  This methodology provides a robust, defensible framework:
  1.  **Principled:** Anchors on the most relevant data (internal), adjusts for uncertainty using broader data (industry), and explicitly incorporates novel project aspects (PM input).
  2.  **Balanced:** Avoids over-reliance on small samples or uncalibrated optimism without ignoring our unique context or the PM's expertise.
  3.  **Transparent:** Each step and adjustment is documented and auditable for the Board.
  4.  **Actionable:** Delivers a specific, justified number for capital allocation decisions.

  We move to adopt this approach and present the resulting 70% probability estimate to the Board, clearly articulating the rationale and documented adjustments as outlined.

  **Attachments:**  
  *   Table: Comparison of Reference Class Options (Specificity vs. Reliability)
  *   Calculation Summary: Internal Anchor, Industry Adjustment (K=15), PM Adjustment Factors

  ---
  **Approved by Forecasting Committee:**  
  [Signatures/Names]  
