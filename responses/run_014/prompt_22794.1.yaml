answer: |-
  This situation involves a painful auction format where the top two bidders both pay but only the winner gets the property—a classic "all-pay auction." Your friend's reasoning **is flawed** (it's the **sunk cost fallacy**), but ironically, his behavior might still be rational due to the auction's structure. Your strategy should focus on minimizing losses. Let's break this down step by step.

  ### 1. **Why Your Friend is Wrong (But Might Still Bid Higher)**
     - **The sunk cost fallacy**: Your friend thinks, "I've already bid $112,000, so I must keep bidding to avoid losing it." This is irrational because the $112,000 is **already gone**—it's a "sunk cost." Whether he bids more or not, he loses that money if he doesn't win.
     - **But here's the twist**: In this auction format, his *decision to keep bidding* can be rational **if it reduces his overall loss**. Here's the math:
       - If he stops now, he loses $112,000 and gets nothing.
       - If he bids a higher amount $Z$ and wins, he loses $Z - 120,000$ (since he pays $Z$ for a $120,000 property).
       - **He should keep bidding as long as losing $Z - 120,000$ is better than losing $112,000$**:
         $$
         Z - 120,000 < 112,000 \implies Z < 232,000
         $$
       - So yes, he rationally should bid up to **$232,000** to minimize his loss, even though it seems absurd. At $232,000$, his loss if he wins ($232,000 - 120,000 = 112,000$) equals his loss if he stops now ($112,000).

  ### 2. **Your Rational Strategy: Walk Away Now**
     You're at $110,000. If you bid higher and lose, you lose your bid. If you win, you get the property but pay your bid. Your decision depends on:
     - Your current sunk cost ($110,000$).
     - The property's value ($120,000$).
     - What your friend might bid (he's at $112,000$ and will rationally go much higher).

     **Key insight**: Your friend has a higher sunk cost ($112,000$ vs. your $110,000$), so **his maximum rational bid ($232,000$) is higher than yours ($230,000$)**. This means he will always outbid you if he acts rationally. Here's the math for you:
     - If you bid $Z$ and win, your loss is $Z - 120,000$.
     - If you stop now, your loss is $110,000$.
     - **You should bid only if winning reduces your loss**:
       $$
       Z - 120,000 < 110,000 \implies Z < 230,000
       $$
     - So rationally, you could bid up to $230,000$... but this is a trap!

     **Why you should walk away immediately**:
     - If you bid (e.g., $113,000$ to beat his $112,000$), he will counter-bid (e.g., $114,000$) since he can go to $232,000$. This escalates the auction.
     - If you bid $X$ and he outbids you, you lose $X$—which is **worse than losing $110,000** now. For example:
       - If you bid $115,000$ and he bids $116,000$, you lose $115,000$ instead of $110,000$.
     - Since he can and will bid higher than you, continuing only increases your guaranteed loss. **The moment his bid exceeds yours, your best move is to cap your loss at $110,000** by walking away.

  ### 3. **The Brutal Outcome**
     - If you both bid rationally:
       - You drop out now, losing **$110,000**.
       - Your friend wins at $112,000$ (since no one outbids him), pays $112,000$, and gets the property. His net loss: $112,000 - 120,000 = -$8,000$ (better than his sunk-cost alternative of losing $112,000$).
     - If you *don't* walk away:
       - You might push the bid to $230,000$ (your max), he bids $231,000$ (his max), you lose $230,000$, and he loses $231,000 - 120,000 = 111,000$—a **mutually destructive** outcome where both lose more than necessary.

  ### 4. **Practical Advice**
     - **For you**: Walk away **now**. Every additional bid you make increases your loss if you lose (which is likely). Cut your losses at $110,000.
     - **For your friend**: Explain that his sunk cost shouldn't dictate his bidding, but given the auction rules, his behavior is rational up to $232,000$. However, if he understands you'll drop out, he can win cheaply at $112,000$.
     - **Negotiate**: Propose a deal where you both stop bidding and one buys the property post-auction, compensating the other. For example:
       - He wins at $112,000$ and pays you $20,000$ to offset your loss. He gets the property net at $132,000$ (better than bidding higher), and you lose $90,000$ (better than $110,000$). This requires trust, but it's Pareto-superior to irrational bidding.

  ### Summary
  - **Your friend is irrational in his reasoning** (sunk cost fallacy) but **rational in his actions** (he should bid up to $232,000$).
  - **You should walk away immediately**. Bidding further only risks increasing your loss with no realistic path to victory.
  - **The real villain** is this auction format—it incentivizes bidders to throw good money after bad. If possible, both of you should lobby the seller for a fairer system (e.g., only the winner pays).
