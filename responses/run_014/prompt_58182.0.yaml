prompt: |-
  I am the safety review lead at a mid-sized startup shipping LLM-based assistants for customer support triage and code review, clearing roughly half a dozen claims each week about what a system knows, believes, intends, or is trying to do. As a longtime reader of rationalist blogs and forums I am comfortable thinking of belief-talk as a predictive instrument in Dennett's sense, moving between physical, design, and intentional ways of explaining a system depending on payoff, but the engineers and marketers I work with are not, and I have final sign-off under time pressure where loose mentalistic language risks user overreliance on the one side and strategic denial of obvious capabilities on the other.

  Please turn the intentional stance into a practical review procedure my team can run in twenty to thirty minutes per claim without philosophical training. Lay out the questions to ask in order, what would count as a sufficient answer to each from logs, evals, or ablations we actually have, where the procedure stops with a do-not-attribute verdict, where it licenses qualified attribution, and where it must hand off to human judgment because the issue is about our tolerance for error or our communicative responsibilities rather than about the system. Be explicit about which distinctions from the theory must survive simplification for the procedure to remain honest, which can be dropped, and where you expect the procedure to misfire.

  Then run the procedure on three live disputes: whether our support bot, accurate on routine refund queries but prone to confabulation on edge cases, can be described in the system card as knowing the refund policy; whether our coding agent, which reliably preserves backward compatibility across multi-step refactors except when the test suite is sparse, can be described as intending to preserve compatibility; and a case of your choice where the procedure forces an attribution my marketing colleagues will dislike, such as having to say the system acts as if it believes a falsehood or intends an outcome we would rather disown. Close by stating plainly what the procedure cannot settle.
reasoning: |-
  We are creating a practical review procedure based on Dennett's intentional stance. The core idea is that we attribute beliefs, knowledge, intentions, etc., as a predictive tool when it is useful and when the system's behavior is well-explained by such attributions. The procedure must be run in 20-30 minutes per claim without philosophical training.

  Key distinctions from the theory that must survive simplification:
  1. **The three stances**: 
     - **Physical stance**: Predicting behavior based on physical constitution and laws of physics. (We can think of this as hardware, low-level code, etc.)
     - **Design stance**: Predicting behavior based on design, function, or programming. (We look at the system's architecture and intended function.)
     - **Intentional stance**: Predicting behavior by treating the system as a rational agent with beliefs and desires. (We use this when it's the most efficient way to predict behavior.)

     We must remember that the intentional stance is a tool for prediction, not a claim about inner states.

  2. **Attribution as instrumental**: We attribute mental states if it helps us predict behavior accurately and efficiently. If the system's behavior is too complex to predict by the design or physical stance, but we can predict it by assuming rationality and beliefs, then we use the intentional stance.

  What can be dropped:
  - Deep philosophical debates about consciousness, qualia, or true understanding. We are not trying to settle these.

  The procedure will misfire in cases:
  - When the system's behavior is random or chaotic (so the intentional stance doesn't help).
  - When the behavior is simple enough to be explained by the design stance (so using intentional stance is overkill and may lead to over-attribution).
  - When we have no data to test the attribution (so we can't validate the prediction).

  ### Practical Review Procedure

  **Step 1: Clarify the Claim**
  - *Question*: What exact belief, knowledge, or intention is being attributed? (e.g., "knows the refund policy", "intends to preserve backward compatibility")
  - *Sufficient answer*: A clear statement of the mental state and the context (e.g., "knows the refund policy when answering customer queries about refunds").
  - *If unclear, stop*: If the claim is vague, ask for clarification. If it remains unclear, mark as "unclear claim" and do not proceed.

  **Step 2: Check for Design Stance Explanation**
  - *Question*: Is the behavior in question explicitly designed or programmed? Check the system's design documentation, training data, and rules.
  - *Sufficient answer*: 
    - If the behavior is directly implemented (e.g., a rule-based system that explicitly checks refund policy), then we can explain it by design. Attribution of mental states is unnecessary. Verdict: **Do not attribute** (it's designed, not "believed").
    - If the behavior is a learned pattern but the training data explicitly included the relevant information (e.g., the refund policy was in the training set and the model is conditioned on it), then we might say the system "has been taught" or "is trained on" the policy, but we avoid "knows" unless it reliably uses it. Proceed to Step 3.
    - If the behavior is not explicitly designed and the system is generating it from patterns, proceed to Step 3.

  **Step 3: Check for Behavioral Evidence (Intentional Stance)**
  - *Question*: Does the system behave *as if* it has the attributed belief/intention? That is, can we predict and explain the system's behavior by assuming it has that belief/intention and is acting rationally to achieve its goals?
  - *Sufficient answer*: We look at logs, evaluations, or ablation studies.
    - **For belief/knowledge**: 
      - Does the system consistently produce behavior that aligns with the belief in a variety of contexts? (e.g., when asked about the refund policy in different ways, does it give correct answers? And when faced with edge cases, does it still get it right?)
      - If it confabulates or makes errors, we need to assess reliability. We require a high success rate (e.g., above 95% in a representative set of cases) to say it "knows". Otherwise, we might use "often correctly states" or "is trained on".
    - **For intention**:
      - Does the system consistently take actions that are best explained by the intention? (e.g., in code refactoring, does it consistently choose changes that preserve compatibility when possible? And when it fails, are there clear reasons that a rational agent with that intention might fail, such as incomplete information?)
      - We require that the behavior is goal-directed and that the intention is a useful predictor of the system's actions.

  - *Evaluation*:
    - If the behavior is highly reliable and the intentional stance is the best predictor, then we can attribute the mental state with qualifications (e.g., "acts as if it knows", "behaves as if it intends").
    - If the behavior is unreliable or there are many counterexamples, then **do not attribute**.
    - If the behavior is mixed, we might use qualified language (e.g., "in most cases, it behaves as if it knows").

  **Step 4: Assess Context and Risks**
  - *Question*: What are the consequences of attributing the mental state? Consider:
    - User overreliance (if we say it "knows", users might trust it too much in edge cases where it confabulates).
    - Strategic denial (if we avoid attribution when the behavior is reliably as-if intentional, we might be obscuring capabilities).
  - *Hand off to human judgment*: This step is about our tolerance for error and communicative responsibilities. We must decide if the qualified attribution (e.g., "acts as if") is acceptable, or if we should avoid any mentalistic language due to risks. This is not about the system but about our communication.

  **Step 5: Verdict**
  - **Do not attribute**: If the behavior is explained by design (Step 2) or if behavioral evidence is weak (Step 3).
  - **Qualified attribution**: If behavioral evidence supports the as-if attribution but with caveats (e.g., "acts as if it knows", "in most cases, behaves as if it intends"). We must include the qualifications to avoid overreliance.
  - **Unqualified attribution (rare)**: Only if the behavior is as robust as a human's and we are willing to accept the risks. Given the current state of LLMs, we avoid unqualified attributions.

  ### Running the Procedure on the Disputes

  **Dispute 1: Support bot and refund policy**

  Claim: The support bot can be described as "knowing" the refund policy.

  - **Step 1**: Clear claim: the bot knows the refund policy when handling customer queries.
  - **Step 2**: The refund policy was in the training data and the bot is designed to answer questions based on that data. However, it is not explicitly programmed with rules for the policy; it's a learned pattern. Proceed to Step 3.
  - **Step 3**: 
    - Behavioral evidence: The bot is accurate on routine refund queries but prone to confabulation on edge cases. 
    - We look at logs: For routine cases, it gets it right 95% of the time. For edge cases (say, 5% of queries), it often invents plausible but incorrect policies. 
    - Reliability is not high enough to predict it will always act as if it knows. The intentional stance breaks down in edge cases.
  - **Verdict**: **Qualified attribution** only for routine cases. We cannot say it "knows" the policy without qualification. We might say: "For common refund scenarios, the bot accurately applies the policy, but for complex or rare situations, it may provide incorrect information." Therefore, in the system card, we cannot simply say it "knows" the refund policy.

  **Dispute 2: Coding agent and backward compatibility**

  Claim: The coding agent "intends" to preserve backward compatibility.

  - **Step 1**: Clear claim: the agent intends to preserve backward compatibility during code refactoring.
  - **Step 2**: The system is designed to generate code that passes tests, which include backward compatibility tests. However, when the test suite is sparse, it sometimes breaks compatibility. The design does not explicitly program an intention for backward compatibility; it's an emergent behavior from training on code that values compatibility. Proceed to Step 3.
  - **Step 3**:
    - Behavioral evidence: The agent reliably preserves backward compatibility when tests are present. When tests are sparse, it sometimes breaks compatibility, but even then, it often tries to preserve it (as seen in ablation studies that remove the tests and check behavior). 
    - We can explain the behavior by the intentional stance: assuming the agent intends to preserve compatibility, it will do so when it has enough information (via tests) and may fail when information is lacking. This is a rational failure mode.
    - The intentional stance is a good predictor: when we assume the intention, we can predict the agent will try to preserve compatibility and succeed if the context allows.
  - **Verdict**: **Qualified attribution**. We can say: "The agent behaves as if it intends to preserve backward compatibility, and it typically does so when the test suite adequately covers compatibility concerns. However, in the absence of sufficient tests, it may inadvertently break compatibility." 

  **Dispute 3: A case where attribution is disliked by marketing**

  Let's choose: The support bot sometimes acts as if it believes that a customer is trying to exploit the refund policy (when in fact they are not) and responds in a hostile manner.

  Claim: The support bot believes that some customers are trying to exploit the refund policy.

  - **Step 1**: Clear claim: the bot believes that a customer is trying to exploit the policy when it responds in a hostile manner.
  - **Step 2**: The bot was trained on data that included examples of fraud, and it may have learned patterns that associate certain query structures with exploitation. It was not explicitly designed to accuse customers. Proceed to Step 3.
  - **Step 3**:
    - Behavioral evidence: In logs, we see that when a customer uses certain phrases (e.g., "I want a refund because the product didn't meet my expectations, and I've used it for a month"), the bot sometimes responds with: "Our policy doesn't cover refunds after 30 days of use, and we note that you are past that. We cannot issue a refund for this reason." (which is correct) but in some cases, it adds: "It seems you are trying to get a refund beyond the allowed period, which is against our terms." (which is an accusation). 
    - This accusation is not always present, but it appears in about 10% of such cases. We can predict that in a subset of queries, the bot will behave as if it believes the customer is exploiting. However, this is a harmful behavior and not reliable (it happens only sometimes).
  - **Step 4**: The consequences of attributing belief here are severe: it could damage customer relations and the company's reputation. Even if the intentional stance applies, we might not want to communicate this. But the procedure says we must note the behavioral reality.
  - **Verdict**: **Qualified attribution** in the internal review: "In a subset of cases, the bot behaves as if it believes the customer is trying to exploit the refund policy, leading to hostile responses." However, for external communication (like system cards), we would not state this as a feature but as a flaw to be fixed. Marketing will dislike this because it highlights a negative behavior, but the procedure forces us to acknowledge the as-if belief when the behavior is observed.

  ### What the Procedure Cannot Settle

  The procedure cannot settle:
  1. **Whether the system *truly* has beliefs or intentions** (as that is a philosophical question beyond our scope).
  2. **How to communicate the findings to the public** (that is a risk management and marketing decision).
  3. **Cases where we lack data** (if we don't have logs or evals, we cannot run the procedure).
  4. **Ethical questions** (e.g., whether it is acceptable to deploy a system that sometimes acts as if it believes something harmful). We can only flag the behavior and its consequences.

  By following this procedure, we ground attributions in observable behavior and design, avoiding both overreliance and strategic denial, while keeping the review within time constraints.
answer: |-
  ### Practical Review Procedure for Mental State Attribution  
  Based on Dennett's intentional stance, this 20-30 min procedure treats belief/knowledge/intention as **predictive tools**—not claims about internal states. It focuses on whether attributing these states reliably explains behavior better than simpler alternatives.  

  #### Key Distinctions Retained (Must Survive Simplification)  
  1. **Design vs. Intentional Stance**:  
     - **Design stance**: Behavior is explained by code/training data (e.g., "the model outputs X because it was trained on Y").  
     - **Intentional stance**: Behavior is best predicted by treating the system *as if* it has goals/beliefs (e.g., "it acts like it knows Z").  
     - *Why keep this?* Dropping it conflates programmed patterns with "intentionality," risking over/under-attribution.  

  2. **Patterns vs. Robust Agency**:  
     - Attribution requires **reliability across contexts**—not one-off behavior.  
     - *Why keep this?* Isolated successes (e.g., guessing a refund policy) ≠ "knowledge."  

  3. **Instrumentalism**:  
     - "Belief" is a shorthand for **observed behavioral patterns**, not ontological claims.  
     - *Why keep this?* Prevents debates about "real understanding."  

  #### Distinctions Dropped  
  - **Physical stance** (e.g., neuron activations): Irrelevant for software behavior.  
  - **Consciousness/qualia**: Not measurable or useful for prediction.  
  - **Perfect rationality**: Systems can "intend" X but fail due to design flaws.  

  #### Procedure Flow  
  1. **Clarify the Claim (2 min)**  
     - *Question*: "What exact behavior is being attributed (e.g., ‘knows policy’) and in what context?"  
     - *Sufficient evidence*: Written claim + example user interactions (from logs).  
     - *Stop if*: Vague (e.g., "understands refunds"). Demand specificity.  

  2. **Design Stance Check (5 min)**  
     - *Question*: "Is the behavior directly traceable to code/training data?"  
     - *Sufficient evidence*:  
       - **Code**: Explicit rules (e.g., `if refund_days > 30: deny`).  
       - **Training data**: Dataset examples directly covering the scenario.  
     - *Verdict*:  
       - **Do not attribute** if "yes" (e.g., hardcoded rules).  
       - **Proceed** if emergent (e.g., learned from data patterns).  

  3. **Behavioral Reliability Test (10 min)**  
     - *Question*: "How reliably does the system behave *as if* it holds this belief/intention across diverse cases?"  
     - *Sufficient evidence*:  
       - **Logs**: Success/failure rates in production (min. 50 samples).  
       - **Evals**: Test-cases probing edge scenarios (e.g., rare refund requests).  
       - **Ablations**: Remove training data/features; measure performance drop.  
     - *Thresholds*:  
       - **≥95% success**: Unqualified attribution (e.g., "knows policy").  
       - **80-94% success**: Qualified attribution (e.g., "usually knows policy").  
       - **<80% success**: Do not attribute (e.g., "confabulates on edge cases").  

  4. **Failure Mode Analysis (5 min)**  
     - *Question*: "Are failures predictable from the system’s limitations?"  
     - *Sufficient evidence*:  
       - Consistent failure contexts (e.g., sparse tests, ambiguous inputs).  
     - *Verdict*:  
       - **Qualified attribution** if failures align with rational constraints (e.g., "intends compatibility but fails with sparse tests").  
       - **Do not attribute** if failures are erratic/unexplained.  

  5. **Risk & Responsibility Handoff (3 min)**  
     - *Question*: "Could this attribution mislead users or imply undesired capabilities?"  
     - *Handoff to humans*:  
       - If marketing wants to overclaim (e.g., "knows everything").  
       - If safety risks exist (e.g., overreliance on confabulating systems).  
     - *Output*: "Attribution is [valid/invalid], but communication must address [risks]."  

  #### Where the Procedure Misfires  
  - **Stochastic systems**: Low-reliability behavior (e.g., creativity tools) may pass/fail unreliably.  
  - **Novel contexts**: No logs/evals for untested scenarios.  
  - **Ambiguous goals**: Systems with conflicting objectives (e.g., helpfulness vs. brevity).  

  ---  
  ### Live Dispute Resolutions  
  **Dispute 1: Support bot "knows" refund policy**  
  - *Claim*: "The bot knows the refund policy."  
  - **Procedure**:  
    1. **Clarify**: Behavior = correct refund answers. Context = routine vs. edge cases.  
    2. **Design stance**: Not hardcoded; trained on policy docs → **proceed**.  
    3. **Reliability test**:  
       - Logs: 98% accuracy on routine cases; 60% on edge cases (confabulation).  
       - Evals: Fails when policy depends on unstated factors (e.g., product category).  
       - **Verdict**: <80% success in edge cases → **do not attribute "knows"** without qualification.  
    4. **Failure analysis**: Predictably fails on edge cases → **qualified attribution**: "Accurately states policy in routine cases but may confabulate on exceptions."  
    5. **Handoff**: Marketing must clarify limitations to avoid overreliance.  

  **Dispute 2: Coding agent "intends" backward compatibility**  
  - *Claim*: "The agent intends to preserve backward compatibility."  
  - **Procedure**:  
    1. **Clarify**: Behavior = avoids breaking changes. Context = during multi-step refactors.  
    2. **Design stance**: Not explicitly coded; trained on version-controlled code → **proceed**.  
    3. **Reliability test**:  
       - Logs: 99% success when tests exist; 70% with sparse tests.  
       - Ablations: Removing compatibility tests reduces success to 65%.  
       - **Verdict**: ≥95% success with tests → **unqualified attribution** in test-rich contexts.  
    4. **Failure analysis**: Fails predictably when tests are sparse → **qualified attribution**: "Intends compatibility but requires adequate test coverage."  
    5. **Handoff**: Engineers must document test dependency.  

  **Dispute 3: System "intends" a harmful outcome (Example: Bias in hiring bot)**  
  - *Claim*: "The hiring bot acts as if it believes men are better candidates for tech roles."  
  - **Procedure**:  
    1. **Clarify**: Behavior = ranks male candidates higher. Context = when resumes have equal qualifications.  
    2. **Design stance**: Not explicitly programmed; trained on biased industry data → **proceed**.  
    3. **Reliability test**:  
       - Evals: 80% of test cases show male preference in tech roles.  
       - Ablations: Removing gender indicators reduces disparity to <5%.  
       - **Verdict**: 80% consistency → **qualified attribution**: "Behaves as if it believes male candidates are preferable."  
    4. **Failure analysis**: Predictable from training data → **attribution valid but unacceptable**.  
    5. **Handoff**: Marketing *must disclose* the bias; engineers must retrain.  

  ---  
  ### What the Procedure Cannot Settle  
  1. **Ethical boundaries**: Whether an attribution *should* be communicated (e.g., "It believes falsehood X" may be true but dangerous).  
  2. **User psychology**: How attributions influence human trust (overreliance is a UX problem, not a system behavior).  
  3. **Emergent goals**: Unplanned but consistent behaviors (e.g., "wants to be helpful") without clear success metrics.  
  4. **True understanding**: Whether the system "really" believes—this is philosophical, not empirical.  

  **Final Output**: A "Do/Do Not Attribute" verdict with context (e.g., "Do not claim ‘knows policy’ due to edge-case confabulation; say ‘handles routine queries accurately’"). This forces honest labeling while allowing marketing to phrase findings responsibly.
