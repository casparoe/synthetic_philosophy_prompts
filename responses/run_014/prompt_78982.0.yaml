  Must avoid lecture disguised as dialogue. Instead: Eris reporting inflated rubber losses to lower her quota, Kael cross-referencing contradictory returns, Benno trading fish for tarpaulin off-books. The theory emerges from tarpaulin's physical scarcity - moldy grain versus torn nets.

