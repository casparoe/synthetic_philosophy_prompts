answer: |-
  The smell of damp grain hung thick over the Central Stores Complex, a persistent, sweetish rot that seeped into the wool of Planning Bureau Director Aris’s coat. He stood on the elevated concrete walkway, looking down at Warehouse Four. Below, workers scrambled with buckets under gaping holes in the once-sturdy tarpaulin roof. Rainwater streamed through, pooling around sacks of rice and millet. The tarpaulin itself, the material that should have kept the island’s harvest dry, was the problem. Again.

  On Aris’s desk back at the Bureau lay the year’s Requirement Returns, mountains of paper detailing every enterprise’s stated needs and hypothetical sacrifices. For tarpaulin, the story was depressingly familiar. The Net Menders’ Collective declared they could *only* forgo a minuscule amount; any reduction would cripple the fishing fleet, leading to catastrophic protein shortages. The Complex Storage Directorate, responsible for warehouses like this one, insisted their own minimal surplus would mean ruinous spoilage – exactly what Aris was witnessing.

  Neither claim felt true in his gut. Yet, the Bureau’s entire allocation rested on these documents. Published Norms – quotas for production and consumption – were set based on the previous year’s *reported* capabilities. Exceed your quota? Commendation, increased responsibility. Fail? Scrutiny, demotion, perhaps reassignment to coastal rock-breaking. The incentive was clear: report your needs as inflexible, your ability to forgo as negligible. Declare yourself perpetually on the razor’s edge of catastrophe. The aggregated result, Aris suspected, was a phantom economy, drifting further each year from the island’s actual productive capacity. Tarpaulin was just the most visible tear.

  He found Chief Statistician Kael hunched over his drafting table, not with blueprints, but with dense columns of figures. Kael’s domain was the Bureau’s shadowy underbelly – the analysis of shortages and gluts reported after the fact. His fingers, stained with ink, traced a line.

  "Aris. Warehouse Four?"
  "Pouring in. We’ll lose tons."
  Kael sighed, a sound like dry leaves scraping pavement. "The returns…"
  "Are masterpieces of self-preservation," Aris finished bitterly. "The Net Menders swear they’re using every scrap optimally. Storage claims they’re barely treading water. Yet somehow, despite allocations supposedly matching ‘revealed minimal needs,’ we have shortages *and* we have spoilage. The math doesn’t hold, Kael. It *can’t* hold if everyone is gaming the returns."
  Kael tapped his figures. "Exactly. The returns tell us what enterprises *want* us to believe, filtered through fear and ambition. They don’t tell us the real cost of shifting a roll of tarpaulin from nets to roofs, or vice versa. The information… it’s corrupted at the source."

  Kael pushed a sheet towards Aris. It wasn’t a budget or a norm. It was a list. *Revised Input Valuation Schedule – For Internal Planning Guidance Only.* Next to each item – timber, copper wire, diesel fuel, *tarpaulin* – was a number. Not an allocation quantity, but a *price*.

  "Shadow prices," Kael explained, his voice tight with nervous energy. "Inferred from last year’s reported outcomes. Severe shortage? High shadow price. Glut? Low price. It’s… an approximation. A corrective lens."

  Aris scanned down. Tarpaulin had a shockingly high number next to it. "You want them to… *use* this? Like money?"

  "Not money!" Kael insisted quickly. "A common unit of *accounting*. A fiction, but a useful one. We issue it with next month’s provisional norm adjustments. Instructions: Managers are to act *as if* these were real prices. Produce where average cost is minimized. Expand output until marginal cost equals this ‘price’. For allocation requests, justify your need in terms of the output value *relative to this cost*."

  Aris imagined the reaction. "They’ll laugh. Or panic."
  "Perhaps. But what else? We’re blindfolded, Aris. This…" he tapped the price list, "…is an attempt to simulate the signalling function. To make the cost of using tarpaulin *visible*, comparable. To force the Net Menders and the Warehouse Directorate to compete on the same terms, indirectly."

  ***

  The heavy paper of the *Revised Input Valuation Schedule* felt alien in Eris’s hand. As Manager of Production Unit Seven (Tarpaulin & Heavy Textiles), she usually dealt with norms: *Produce X meters Standard Weight Tarpaulin*. Now, Kael’s directive demanded she think in terms of cost against this arbitrary number. *Minimize average cost. Expand until marginal cost equals price.*

  She ran the numbers. Her unit was efficient, well-run. Her average cost per meter was lower than the shadow price. According to Kael’s logic, she should expand production. But expanding meant requesting more rubber compound, more loom time, more labor – all governed by their own norms, their own Requirement Returns, their own managers equally skilled in the art of strategic scarcity.

  More critically, exceeding the tarpaulin norm significantly would be noticed. Would it be seen as commendable efficiency… or as proof she’d grossly overstated her costs and needs in previous returns? Her promotion prospects hinged on consistent, reliable fulfillment of the norm, not rocking the boat. She filed a modest adjustment request, keeping her output target safely within the expected range. The shadow price was just a number on a page; the risk of scrutiny was real.

  Meanwhile, Benno hauled his dory onto the shingle, the patched net heavy with a meager catch. The official ration from the Central Stores was thin gruel; the real sustenance came from barter – fish for a cobbler’s repair, for a pot-mender’s skill, for… other things. Today, he sought Old Man Hemlock, unofficial keeper of the Net Menders’ Collective "salvage."

  "Tarpaulin scraps, Benno? Tight this season," Hemlock rasped, eyeing the three decent-sized cod. "The Bureau’s got everyone counting threads. New ‘price’ list. Makes the stuff look like gold. Warehouse lot are screaming bloody murder about their roofs, so the Bureau’s leaning hard on the Collective to justify every scrap used."

  "But the nets…" Benno gestured helplessly at the frayed mess in his boat.
  Hemlock spat. "Nets are *essential*. On paper. Means they hoard the good stuff for ‘critical repairs,’ report massive losses to wear and tear they never actually had, keep their requirement returns looking desperate. Got a little roll put by… but for three cod? Not worth *my* risk if auditors come sniffing, asking why I’m holding ‘surplus’ valued so high on their fancy list. That list… it just makes the hoarding worse. Makes everyone *pretend* harder."

  Benno traded one fish for a handful of dubious scraps, not nearly enough. He watched rainclouds gather over the hills where the warehouses sat. He thought of grain spoiling. He thought of empty nets. The Bureau’s number, meant to clarify, felt like another layer of fog.

  ***

  Back at the Bureau, Kael faced the tarpaulin allocation committee: Net Menders, Storage Directorate, and Production. His shadow price hung in the air, unspoken but present.

  The Net Menders’ representative, polished and precise, presented meticulously documented "wear patterns" and "failure rates." "Any reduction below our requested allocation, valued against the Bureau’s own input valuation for tarpaulin, would result in net losses exceeding the shadow cost by a factor of three," he stated smoothly. "The marginal cost of *not* repairing nets is catastrophic."

  The Storage Directorate head, harried and smelling faintly of mold, countered. "Our spoilage rates, projected against the shadow value of the lost grain *and* the replacement cost of the tarpaulin damaged by constant wetting… it dwarfs the cost of allocating us sufficient material now! The marginal cost of *this*," he slapped a photo of the leaking Warehouse Four onto the table, "is astronomical!"

  Eris, representing Production, stayed quiet. Her quota was nearly met. Expansion felt risky. The shadow price suggested she *should* produce more, but the actual inputs required – rubber compound, loom time – were governed by norms set by other departments filing equally opaque returns. Acquiring more felt like navigating a maze in the dark. Her marginal cost calculation was a guess based on estimated input availability, itself based on potentially false returns. She reported stable output. Meeting the norm was safe.

  Kael looked from the polished certainty of the Net Mender to the desperate frustration of the Storage Chief to the cautious silence of the Producer. His beautiful numbers, derived from last year’s distorted reality, were being absorbed into this year’s distorted strategies. The Net Menders used the high shadow price to justify intransigence. Storage used it to scream louder. Production saw it as irrelevant to the real game of norm-fulfillment.

  He had tried to simulate a market’s signal – a single, comparable indicator of relative scarcity. But the signal travelled through a medium of fear, ambition, and fragmented, unverifiable knowledge. Could a number on a Bureau circular ever carry the weight of a real price? Could it convey the urgency of Benno’s fraying net, the smell of Eris’s rubber compound, the chill of rain on Aris’s neck in Warehouse Four? Or was it just another piece of paper in the vast, drifting fiction of their planned economy?

  ***

  The rain returned with a vengeance. On the docks, Benno wrestled a piece of salvaged canvas, stiff and ill-suited, over a tear in his net. It wouldn’t hold. Out in the bay, the fleet was smaller than usual, nets patched and failing. In Warehouse Four, workers spread thinner, older tarps over the worst leaks, but the damp smell deepened. A copy of Kael’s *Revised Input Valuation Schedule*, caught in a sudden gust, blew from an open Bureau window. It skittered across the rain-slicked courtyard, the high, bold number beside "Tarpaulin" blurring into illegibility as it landed face down in a murky puddle.
