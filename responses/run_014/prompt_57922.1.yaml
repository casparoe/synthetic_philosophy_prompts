prompt: |-
  so I'm taking epistemology this term and im stuck on the knowing how vs knowing that debate. There's this revision blog everyone on my course uses that basically says knowing that is stuff you can state as facts, knowing how is just abilities, Ryle thought they were completely separate, and the newer intellectualist view just says knowing how is really a kind of knowing that about methods, which means you could in theory learn to swim from a manual without getting in the water. That last bit sounds off to me but I cant put my finger on why. Could you go through what the blog gets right and what it messes up, and use my gran vs TikTok example to explain – like she can cook perfect jollof without explaining how, while I can recite the recipe from videos but would burn it – which one really knows how on each view? Please answer in British English, im still getting my head around it and definately need it kept simple but not dumbed down.
reasoning: |-
  Okay, the user is taking an epistemology course and is stuck on the knowing how vs. knowing that debate. They mentioned a revision blog that their peers use, which summarizes Ryle's view and the intellectualist counter-argument. The user feels that the intellectualist claim—that you could learn to swim from a manual without getting in the water—seems off but can't articulate why. They want me to critique the blog's accuracy and use their gran vs. TikTok example to clarify who really "knows how" on each view. They also requested British English and a simple but not dumbed-down explanation.

  First, I need to recall the key points of Ryle's argument. Ryle argued against the "intellectualist legend," which posits that all intelligent acts require prior theoretical knowledge. He used the regress argument: if every action requires contemplating a rule, you'd need another rule for that contemplation, leading to an infinite regress. Instead, Ryle claimed knowing-how is a distinct capacity, not reducible to knowing-that. For example, knowing how to ride a bike isn't just knowing facts about biking; it's the ability to perform the action. This seems relevant to the user's gran, who can cook jollof rice without articulating the recipe—her knowledge is practical, embodied.

  Next, the intellectualist view, championed by Jason Stanley and others, contends that knowing-how is a species of knowing-that. They argue that when we say someone knows how to do something, it means they possess propositional knowledge about methods. For instance, knowing how to swim involves knowing that certain movements achieve swimming. Intellectualists might say that a manual could theoretically convey this knowledge, though they acknowledge practical engagement might be necessary for humans due to psychological limitations. This relates to the user's TikTok example: reciting a recipe (knowing-that) without being able to cook it suggests a lack of practical ability, which intellectualists might attribute to insufficient propositional knowledge or failure to apply it.

  The user's confusion about the swimming manual example is key. The blog oversimplifies intellectualism by suggesting one could learn to swim solely from a manual. Stanley actually clarifies that while knowing-how is propositional, acquiring that knowledge typically requires experience. The manual might provide facts, but without practice, one wouldn't grasp the relevant propositions contextually. The user's TikTok case is similar: they know the recipe (facts) but can't execute it, which intellectualists might explain as lacking the ability to apply the knowledge, not that knowing-how isn't propositional.

  Applying this to the gran vs. TikTok scenario: Gran embodies Ryle's knowing-how—her skill is practical, possibly tacit. She might not articulate the method but performs it successfully. The user, with their TikTok knowledge, represents knowing-that—they can state facts but lack the ability. Ryle would say gran knows-how; the user doesn't. Intellectualists would argue gran has propositional knowledge, even if implicit, and the user's failure indicates their knowledge is incomplete or inapplicable.

  I should also address the blog's oversimplification. It presents intellectualism as claiming skills can be learned from manuals alone, which isn't accurate. Intellectualists like Stanley recognize the role of practice in gaining propositional knowledge. The blog might mislead by not distinguishing between the nature of knowledge and its acquisition. The user's intuition that the swimming example is "off" is valid; it confuses the metaphysical claim (knowing-how is knowing-that) with the epistemic process (how we acquire such knowledge).

  The user's deeper need might be understanding how these theories apply to real-life examples beyond academic texts. They want to grasp the debate's nuances without jargon. Using their gran and TikTok makes it relatable. They might also need to critique the blog's accuracy for their coursework, so pointing out where it oversimplifies is crucial. Emphasizing that intellectualism doesn't deny the need for practice but redefines what constitutes knowledge could clarify their confusion.

  In conclusion, the blog correctly outlines the basic positions but messes up by oversimplifying intellectualism and misrepresenting the swimming manual claim. Gran's practical skill versus the user's theoretical knowledge illustrates the core disagreement: Ryle sees them as distinct; intellectualists see gran's ability as based on implicit propositions. Highlighting the acquisition vs. nature distinction resolves why the manual example feels wrong.
answer: |-
  Right, let's crack this open proper. That blog's got the basics down but simplifies things a bit too much, especially on the intellectualist side, which is likely why the swimming manual bit felt "off". Your gran vs. TikTok example is spot on for illustrating the clash. Here's the breakdown, keeping it clear but not simple:

  **What the Blog Gets Right:**

  1.  **The Core Distinction:** Yes, Ryle fundamentally argued that "knowing-**that**" (propositional knowledge) and "knowing-**how**" (ability or skill) are **different kinds of beasts**. Knowing-that is about facts, truths, things you can state ("I know *that* Lagos is in Nigeria"). Knowing-how is about capacities ("I know *how* to ride a bike").
  2.  **Ryle's Separation:** Ryle *did* think they were separate. His big point was against the "intellectualist legend" – the idea that intelligent action *always* requires first contemplating some bit of knowing-that. He argued this leads to an infinite regress (e.g., to act on rule A, you'd need a rule B about applying rule A, and so on forever). Knowing-how, for Ryle, isn't built *from* knowing-that; it's the *basis* for intelligent action. It's a practical disposition.
  3.  **The Intellectualist Counter:** Correct, modern intellectualists (like Jason Stanley & Timothy Williamson) argue that knowing-how *is* actually a *form* of knowing-that. Specifically, knowing how to φ is knowing, *under a practical mode of presentation*, that a certain way (w) is a way for *you* to φ. It's still propositional knowledge, just presented differently to the agent.

  **What the Blog Messes Up / Oversimplifies:**

  1.  **The Swimming Manual Blunder:** This is the big one. The blog makes it sound like intellectualism *entails* that you could learn to swim *perfectly* just from a detailed manual without ever getting wet. **This is a misrepresentation.** While intellectualists *do* argue that knowing-how *is* knowing-that, they **do not** necessarily claim that all propositional knowledge *about* swimming *is* knowing-how, nor that you can *acquire* the relevant propositional knowledge *only* from a manual.
      *   **Why it's wrong:** Intellectualists generally accept that for many skills (like swimming or cooking), the *specific, contextually relevant* propositional knowledge needed ("knowing *that* *this* specific kinaesthetic feel is the way *for me* to stay afloat *right now*") **cannot** be fully grasped or possessed purely from descriptive facts in a book. You often need **practical engagement** to understand *which* propositions are the crucial ones and what they *really mean* in practice. The manual might give you *some* knowing-that *about* swimming, but it likely won't give you the *specific* knowing-that (under the practical mode) that *constitutes* knowing-how *to swim*.
  2.  **Oversimplifying "Knowing-That" in Intellectualism:** The intellectualist "knowing-that" isn't just *any* fact. It's knowing a specific proposition *about a method*, understood in a practical way. It's not just reciting a recipe; it's *grasping* the method propositionally, in a way directly linked to action.

  **Applying it to Your Gran vs. TikTok:**

  *   **Gran:** Knows how to cook perfect jollof.
  *   **You:** Can recite the recipe and techniques from TikTok videos perfectly but would burn it if you tried.

  **Ryle's View (Separate):**
  *   **Gran:** Clearly possesses **knowing-how**. It's a skill, a complex set of dispositions and capacities she's honed through practice. Her inability to fully articulate *every* nuance ("a bit of this, a pinch of that, you just know when it looks right") doesn't matter. The ability *is* the knowledge. She might have *some* knowing-that about ingredients, but her core knowledge is practical.
  *   **You:** You possess **knowing-that** *about* jollof (facts from the recipe). You possess **knowing-that** *about* how jollof is *supposed* to be made. But you **lack** the **knowing-how**. Reciting facts isn't the same as having the practical skill. Ryle would say you *don't* truly know *how* to cook jollof, despite the facts you know.
  *   **Conclusion for Ryle:** Gran knows how. You don't. Knowing-that isn't sufficient for knowing-how.

  **Intellectualist View (Knowing-how is a type of Knowing-that):**
  *   **Gran:** *Does* possess the relevant **knowing-that**, but it's under a **practical mode of presentation**. She knows, implicitly, propositions like "*this* specific adjustment (e.g., stirring now, adding a dash of water) is the way *for me* to achieve perfect jollof *in this situation*". She gained this propositional knowledge through experience, not theory. Her knowledge *is* propositional, even if she can't easily articulate it in theoretical terms. Her practical ability *is* her possessing this specific type of propositional knowledge.
  *   **You:** You possess **knowing-that** *about* the recipe and method, but likely *only* under a **theoretical mode of presentation**. You know the *general* propositions ("add tomatoes, fry onions for 5 mins"). Crucially, you likely **lack** the *specific, contextually sensitive* propositional knowledge under the *practical* mode. You don't know the propositions about *how things should look/smell/feel at each stage to guide your actions correctly in real-time*. Your TikTok knowledge isn't the *right kind* of knowing-that to constitute knowing-*how* yet. It might be *necessary* information, but it's not *sufficient*.
  *   **Conclusion for Intellectualists:** Gran knows how (because she has the relevant practical-mode knowing-that). You *don't* truly know how yet (because you only have theoretical-mode knowing-that about the method, lacking the crucial practical-mode propositions). **Importantly: They would likely agree you couldn't learn Gran's skill *just* from TikTok videos alone. You'd need practice to acquire the *practical-mode* propositional knowledge.**

  **Why the Swimming Manual Felt "Off":**

  Your intuition was spot on. The blog made intellectualism sound silly by implying it claimed skills are *acquired* solely from manuals. Proper intellectualism argues that the *nature* of the skill/knowledge *is* propositional (knowing-that), but crucially, **acquiring that specific propositional knowledge often *requires* practical experience.** You can't get the vital, practical-mode propositions about swimming from a book – you need to get in the water to grasp them. The blog confused the *nature* of knowledge (propositional) with the *method of acquisition* (often practical).

  **The Takeaway:**

  *   **Ryle:** Knowing-how and knowing-that are distinct. Ability is key. Gran knows how; you (with just TikTok facts) don't.
  *   **Intellectualists:** Knowing-how *is* a type of knowing-that (practical-mode). Gran has it; you (with just theoretical TikTok facts) lack the *specific, practical-mode* knowing-that needed.
  *   **Both:** Would likely agree Gran is the one who *really* knows how to cook the jollof, and you can't get that skill *just* from watching videos – you need practice to gain the crucial knowledge (whether seen as a new capacity (Ryle) or new practical-mode propositions (Intellectualists)).

  The debate hinges on *what kind of thing* knowledge-how fundamentally *is*, not necessarily on how easy it is to get from a book. The blog oversold the latter point. Hope this clears the water a bit – good luck with the course!
