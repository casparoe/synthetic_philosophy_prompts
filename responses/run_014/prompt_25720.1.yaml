prompt: |-
  I'm taking this astrobiology seminar and we've been going in circles about what "life" even means, and it's driving me kind of nuts. The textbook gives the standard NASA-style checklist — metabolism, growth, reproduction, response to stimuli, evolution — but then every single week someone brings up a counterexample that breaks it. Viruses don't metabolize. Mules don't reproduce. A frozen tardigrade does basically nothing on the list but nobody wants to call it dead. And then there's the really weird stuff like prions, transposons, and those synthetic minimal cells the Venter group made that have like 473 genes and can divide but arguably aren't "alive" in any rich sense. Plus the origin-of-life people need a definition that can handle the transition from chemistry to biology, which means it can't presuppose the very thing your trying to define.

  So before I read yet another paper proposing a definition, I want to know what I should actually be asking of one. Write me the desiderata: what any adequate theory or definition of life has to deliver. Which cases must it get right (the clear positives, the clear negatives, the borderline ones), which distinctions must it respect (alive vs. dead vs. never-was-alive vs. dormant vs. having-the-capacity-for-life), and which results from biology and biochemistry can't it contradict? I also want to know which of these requirements are non-negotiable and which are more like preferences of particular camps — the astrobiologists want something operational you could run on a Mars rover, the philosophers of biology care more about conceptual coherence, the origin-of-life chemists want it to not presuppose evolution. And here's the thing I'm most curious about: are there pairs of desiderata that can't be jointly satisfied? Like, maybe you can't have a definition that's both operational and handles all the edge cases, or maybe being non-Earth-centric and being grounded in actual terrestrial biochemistry pull in opposite directions. If some subset of the requirements is jointly unsatisfiable, that's basically a result in itself and I want that flagged. Also, if you had to pick the single requirement that does the most work eliminating candidate definitions, which one is it?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're in an astrobiology seminar struggling with the definition of life. They mentioned the NASA checklist and counterexamples like viruses and mules. Their main request is for desiderata—what any adequate theory of life must deliver.

  First, I need to identify the core issues they're facing. The frustration comes from circular debates and counterexamples breaking standard definitions. They want a structured way to evaluate any proposed definition. Key points include handling clear cases (positives, negatives, borderline), distinctions (alive, dead, dormant), and not contradicting established science.

  The user also wants to know which requirements are essential versus preferred by different fields (astrobiologists, philosophers, chemists). They’re particularly interested in conflicting desiderata and which single requirement is most stringent.

  I should start by listing necessary desiderata. Clear positives like bacteria, negatives like rocks. Borderline cases include viruses, prions, frozen tardigrades. Distinctions like dormant vs dead are crucial. The definition can't contradict evolution or biochemistry.

  Then, field-specific preferences. Astrobiologists need operationality for missions, philosophers want coherence, origin-of-life chemists need a chemical transition without presupposing life. Conflicts arise here, like operational vs comprehensive handling of edge cases.

  Identifying conflicts is key. For example, operational definitions might exclude borderline cases like viruses, while a universal scope could be too vague for a rover. The capacity for evolution might be necessary but hard to detect on Mars.

  The most stringent requirement? Probably the capacity for evolution, as it's fundamental yet challenging to observe directly. Highlighting these conflicts shows why a single definition is elusive.

  Also, considering the user's deeper needs: they might want a framework to critically assess definitions rather than seeking one answer. They need clarity on why the debate persists and tools to navigate it. Emphasizing the trade-offs helps them understand the seminar discussions better.
answer: |-
  Here’s a rigorous breakdown of desiderata for a definition of life, structured to address your frustrations. This framework exposes why the debate persists and why no single definition satisfies everyone. **Bold** denotes core tensions.

  ### I. Non-Negotiable Requirements (Must-Haves for Credibility)
  1.  **Cover Clear Positives:** Must unambiguously include:
      *   Unicellular organisms (e.g., *E. coli*, yeast).
      *   Multicellular organisms in active state (e.g., a fish, a tree).
      *   Simple active microbes (e.g., archaea in a hydrothermal vent).
  2.  **Exclude Clear Negatives:** Must unambiguously exclude:
      *   Inanimate matter (e.g., a rock, a water molecule).
      *   Simple machines (e.g., a thermostat, a car engine).
      *   Complex non-living systems (e.g., fire, a hurricane).
  3.  **Respect Core Biological Principles:** Cannot contradict established science:
      *   **Evolution by Natural Selection:** Life's diversity *must* be explainable by this process. A definition cannot preclude evolution.
      *   **Biochemistry:** Must be consistent with the fact that known life is carbon-based, uses water as a solvent, encodes heritable information in nucleic acids (DNA/RNA), and employs proteins/RNA for function (even if alternatives are conceivable).
      *   **Thermodynamics:** Must acknowledge life as a dissipative system far from equilibrium, requiring energy flow to maintain its low-entropy state.
  4.  **Handle Key Distinctions:**
      *   **Alive vs. Dead:** Must distinguish a living bacterium from a heat-killed one *of the same type*.
      *   **Alive vs. Dormant:** Must account for states like frozen tardigrades, bacterial spores, or seeds where metabolic activity is suspended but potential for life remains. (Implies life is a *potential* or *dispositional* property, not just current activity).
      *   **Never-Alive vs. Once-Alive:** Must distinguish a rock (never-alive) from a piece of wood (once-alive).
      *   **Individual vs. Lineage:** Must clarify if the definition applies primarily to individuals (*E. coli* cell) or lineages/populations (the evolving *E. coli* population).

  ### II. Essential Handling of Borderline/Edge Cases (Where Definitions Are Tested)
  An *adequate* definition must provide a principled way to categorize these, even if the answer is "borderline":
  5.  **Viruses:** Must explain why they are included/excluded based on criteria beyond simple anthropocentrism.
  6.  **Viroids/Plasmids/Transposons:** Simpler replicators than viruses. Must be addressed.
  7.  **Prions:** Self-replicating conformational states of proteins. Challenge information-based definitions.
  8.  **Synthetic Minimal Cells (e.g., JCVI-syn3.0):** Must grapple with whether a chemically synthesized, genomically minimal, dividing system counts as life. Does "artificiality" matter?
  9.  **Sterile Hybrids (Mules):** Must account for organisms that are *clearly* alive but lack reproductive *capacity* (distinguishing capacity from activity).
  10. **Potential Extraterrestrial Life:** The definition shouldn't *unreasonably* exclude plausible non-Earth biochemistries we haven't encountered (e.g., silicon-based, non-water solvent). This doesn't mean accepting *anything*, but avoiding Earth-biased assumptions like "must use DNA".
  11. **Origin of Life Threshold:** Must provide a framework for identifying the transition from non-living complex chemistry (e.g., autocatalytic sets, replicating RNA molecules) to the first minimal living system. Cannot presuppose complex evolved traits.

  ### III. Field-Specific Preferences (Often Source of Conflict)
  12. **Operationalizability (Astrobiology Priority):**
      *   Must yield testable predictions/measurements for remote detection (e.g., on a rover).
      *   Favors measurable *signatures* (e.g., metabolic byproducts, disequilibrium chemistry, complex organic molecules, replication detection) over abstract concepts hard to observe directly (e.g., "evolutionary potential").
      *   *Conflict:* Tends to favor simpler, activity-based definitions that might exclude dormant states or borderline cases like viruses.
  13. **Conceptual Coherence & Generality (Philosophy of Biology Priority):**
      *   Must be logically consistent, avoid circularity, and apply universally (terrestrial and potential ET life).
      *   Favors definitions capturing the *essence* of life (e.g., autopoiesis, information processing with heredity, open ended evolution).
      *   *Conflict:* Can become abstract and difficult to operationalize; may struggle with "grey areas" by design.
  14. **Compatibility with Abiogenesis (Origin-of-Life Chemistry Priority):**
      *   Must not presuppose complex, evolved features (like ribosomes, complex membranes, DNA replication machinery).
      *   Should be satisfiable by a system arising spontaneously from prebiotic chemistry.
      *   Favors minimal chemical/system definitions (e.g., autocatalytic sets capable of evolution, compartmentalized replicators).
      *   *Conflict:* Definitions relying on "heritable information" or "metabolism" need careful unpacking to avoid presupposing complex evolved mechanisms.

  ### IV. Key Conflicts & Trade-offs (Where Desiderata Clash)
  *   **Operationalizability vs. Conceptual Coherence/Borderline Cases:** The most pervasive conflict. A definition simple and measurable enough for a rover (e.g., "detects metabolic activity + replication") will likely misclassify dormant states (frozen tardigrade = dead?) and exclude viruses/prions. A definition sophisticated enough to handle all edge cases conceptually (e.g., "a system capable of open-ended evolution") is often impossible to implement directly on a remote platform. **This is the primary source of frustration.**
  *   **Non-Earth-Centric vs. Grounded in Known Biochemistry:** While avoiding *unreasonable* Earth-centrism is desirable, grounding the definition *solely* in known biochemistry (C, H, O, N, P, S, water) makes it potentially blind to truly novel ET life. Conversely, definitions *too* abstract (e.g., "any self-sustaining chemical system") risk becoming vacuous or including non-living systems like flames. **Requires careful balance.**
  *   **Defining the Individual vs. Defining the Lineage:** Is a single mule alive? Most say yes. But if life fundamentally requires the *capacity for evolution*, then the *lineage* is the primary unit, and sterile individuals are dead-ends within a living lineage. This tension underlies debates about mules and viruses (which require a host lineage).
  *   **Capacity vs. Activity:** Must a system be *currently active* (metabolizing, growing) to be alive, or is the *potential* or *disposition* to do so under appropriate conditions sufficient? This is crucial for dormant states. Operational definitions often favor activity; philosophical definitions often favor capacity. **Frozen tardigrades exemplify this tension.**

  ### V. The Most Stringent Requirement: The Capacity for Evolution
  *   **Why it eliminates candidates:** Many definitions stumble here.
      *   **Activity-Based Definitions:** A metabolizing, replicating system *incapable* of heritable variation/evolution (e.g., a hypothetical perfectly copying machine) arguably isn't truly "alive" – it's just complex chemistry. It lacks the defining feature of biology: adaptation and diversification. Origin-of-life research hinges on identifying systems that cross this threshold.
      *   **Individual vs. Lineage:** Requires defining life at the lineage/population level, making sterile individuals (mules) problematic *if* the definition strictly applies only to evolving lineages. (Solutions often involve defining the *individual* as alive *because it belongs to a type/lineage that evolves*).
      *   **Operational Challenge:** Detecting the mere *capacity* for evolution remotely (e.g., on Mars) is incredibly difficult compared to detecting current metabolism or replication. This forces astrobiology towards proxies.
      *   **Borderline Cases:** Viruses *do* evolve, bolstering arguments for their inclusion. Prions replicate but don't *evolve* in a Darwinian sense (no heritable variation leading to adaptation), often excluding them. Minimal cells (JCVI-syn3.0) *are* designed to evolve, supporting their status as life.
  *   **The Work it Does:** This requirement forces the definition beyond mere complexity or self-replication towards the dynamic, historical, adaptive nature of biology. It connects directly to the origin of life and provides the clearest distinction from non-living complex systems (crystals grow, fire dissipates energy, but neither evolves). It's the requirement most likely to expose definitions that are merely descriptive lists of *current terrestrial life's characteristics* rather than capturing life's fundamental nature.

  ### Conclusion & Implications
  This framework explains why the seminar feels circular: **different camps prioritize different desiderata, and core conflicts exist (especially Operationalizability vs. Handling Edge Cases/Coherence).** There likely *is no single definition* satisfying all desiderata equally well for all purposes.

  *   **For Astrobiology:** Operational definitions prioritizing detectable signatures (metabolism, replication, complex molecules) are necessary pragmatically, even if philosophically incomplete. They accept the risk of false negatives (missing dormant life/viruses) and potential false positives (complex non-life).
  *   **For Philosophy/Biology:** Definitions centered on **evolutionary potential** (e.g., "a self-sustaining chemical system capable of Darwinian evolution") offer the greatest conceptual coherence and handle most terrestrial edge cases best (including viruses), but remain difficult to apply to origin scenarios or remote detection.
  *   **For Origin-of-Life:** Definitions focusing on **autocatalytic systems with heritable information and compartmentalization** provide the most plausible bridge from chemistry to biology, but may define systems less complex than what we typically call "alive" today.

  Your takeaway: **Evaluate any proposed definition by mapping it onto these desiderata.** Where does it excel? Where does it fail? Which trade-offs does it make? Understanding the *why* behind the disagreement is more valuable than finding a mythical "correct" definition. The unsatisfiable core conflict (Operational vs. Comprehensive/Coherent) is itself a profound insight into the nature of the problem.
