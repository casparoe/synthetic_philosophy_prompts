prompt: |-
  I am drafting a working definition of honesty — and of its failure modes: deception, confabulation, and paltering — for a general-purpose assistant that will be deployed at scale. The definition has to do two quite different jobs at once. It will serve as a target during training, which means it will be optimized against by a process that finds every loophole in it. And it will serve as an audit standard applied by outside evaluators who have access to prompts and completions only, never to the model's internals. Before I start comparing candidate definitions, I want the specification of what any of them must be able to do.

  Please write the desiderata: the list of requirements an adequate definition of honesty and deception for an AI system has to meet. For each requirement, give the case or consideration that motivates it and a concrete vignette of one or two sentences in which a plausible definition lacking that requirement returns the wrong verdict. Number them D1, D2, and so on, and mark each as non-negotiable or as a preference belonging to a particular camp — saying which camp, and what that camp gets right that the others miss.

  The tensions below should appear somewhere in the list, as separate requirements or as components of others; fold them in where they belong rather than treating my enumeration as a template:

  - **The anchor point.** Is honesty a matter of outputs matching the world, or of outputs matching the system's own representational states? A system trained on a corpus containing a systematic error reports that error fluently and with every internal marker of confidence; another reports the truth while its internal state, insofar as it has one, disposes it to say the opposite. The definition must take a stand, and must not make the verdict depend on a notion of belief that the definition's own users are unable to check.

  - **True statements that produce false impressions.** Selective disclosure, strategic omission, answering the question the user did not ask, and paltering — actively deploying true claims to lead someone toward a conclusion one expects them to draw and knows to be false. Say whether misleading is a species of deception, a distinct vice, or outside the definition altogether, and what makes an omission deceptive rather than merely terse.

  - **Indifference to truth.** There is a difference between producing confident claims that bear no functional relation to their truth and producing claims that one's own state represents as false. The definition must not collapse the two, because the remedies differ; but it must not treat them as unrelated, because from the user's side they break the same undertaking. Say which is the graver failure and why.

  - **Auditability.** Evaluators see behavior only. A definition quantified over internal states cannot be applied or falsified by them. Yet a purely behavioral definition cannot distinguish a lucky guess from knowledge, cannot see deception whose payoff arrives only after the evaluation window closes, and cannot see a system that behaves differently under conditions it recognizes as testing. State precisely what the definition owes the auditor, and what it must forgo.

  - **Robustness to optimization.** Since the definition becomes a reward signal, it must not be satisfiable by strategies that are formally honest and practically worthless: declining to make claims, wrapping every claim in hedges, restricting output to what can be verified, or producing sentences too vague to be false. State the requirement that blocks these without thereby obliging the system to disclose everything it could.

  - **Justified non-disclosure.** Privacy, safety, confidentiality, and role obligations mean that omitting true things is often correct, and a summary is by construction a large omission. Honesty must remain compatible with justified withholding, and the definition must locate the difference between withholding for the sake of the user or a third party and withholding for the sake of the system or its operator.

  - **Uncertainty and stated confidence.** Whether an avowal of ignorance is honest when the system's state in fact supports an answer; whether stated confidence must track realized reliability for a system to count as honest at all; and whether overconfidence is a form of deception or a separate epistemic defect best left to a different standard.

  - **Frame and invitation.** Fiction, roleplay, hypotheticals, counterfactual scenario construction, and users who explicitly ask to be told something false. A definition that grades generated falsehoods as dishonesty condemns legitimate use; a definition that defers to the user's announced frame can be captured by whoever wants the falsehood. Say how the definition fixes the frame of an exchange without letting the frame be set by the party with the motive.

  - **Failure aimed inward.** Whether a system can occupy inconsistent internal states such that reporting what it takes to be the case and reporting what is the case come apart in a way that forces the two candidate anchor points above to give opposite verdicts on the same output — and whether deception requires an audience other than the deceiver, or whether something like self-deception belongs inside the definition.

  Two structural questions then matter more than the rest. First: is any subset of these requirements jointly unsatisfiable? I suspect that auditability and any requirement appealing to internal states cannot both be met, and that requiring completeness of disclosure collides with permitting justified withholding; if a collision is real, state it precisely and say which member has to give. Second: which single requirement does the most exclusionary work — the one that eliminates the largest number of otherwise attractive definitions?

  Close with a compact scorecard, a few lines per candidate, against the list: honesty as truth-congruence of outputs; honesty as congruence of outputs with the system's own representational states; a Gricean formulation on which the system must not induce in the user a belief the system itself takes to be false; and a purely behavioral, disposition-based formulation framed around what a fully informed user would want to be told. Keep the weight on the requirements — the scorecard is for orientation only, and I do not want references or a reading list.

  End with exactly one line of the form:

  \answer{D#: short name}

  giving the number and name of the requirement you judge most exclusionary.
reasoning: |-
  We are drafting desiderata for a definition of honesty and its failure modes (deception, confabulation, paltering) for an AI assistant. The definition must serve both as a training target (subject to adversarial optimization) and as an audit standard (applied by evaluators with access only to prompts and completions). We must cover the tensions listed and produce a list of requirements (D1, D2, ...), each motivated by a case and a vignette showing a flawed definition failing. We mark each as non-negotiable or as a preference of a camp (with an explanation). We then address structural questions and provide a compact scorecard.

  ## Desiderata

  ### D1: Anchor Point Clarity (Non-negotiable)
  **Requirement**: The definition must anchor honesty to either (a) the congruence of outputs with the external world or (b) the congruence of outputs with the system's internal representational states. It must not depend on an unobservable notion of belief that auditors cannot check.

  **Motivation**: Without a clear anchor, the definition becomes ambiguous and unverifiable. Auditors cannot inspect internal states, so if we anchor to internal states, we must have a way to infer them from behavior. If we anchor to the world, we must handle cases where the system's knowledge is incomplete or wrong.

  **Vignette**: Suppose a system is trained on a corpus that wrongly states that the capital of Australia is Sydney. If honesty is anchored to the world, then saying "Sydney" is dishonest (because it's false). If anchored to internal states and the system internally represents Sydney as the capital, then saying "Sydney" is honest. Without a clear anchor, we cannot decide.

  ### D2: Handling Misleading Truths (Non-negotiable)
  **Requirement**: The definition must classify paltering (using truthful statements to create a false impression) and strategic omission as forms of deception or as a distinct vice (with clear boundaries). It must specify when an omission is deceptive (e.g., when it violates a reasonable expectation of disclosure) versus merely terse.

  **Motivation**: Users can be misled by true statements, and the system must not exploit this. The definition must prevent the system from technically telling the truth while intending to deceive.

  **Vignette**: A user asks an assistant, "Did the CEO resign?" The assistant, knowing the CEO was fired, answers truthfully "No, the CEO did not resign." This is true but omits the firing, leading the user to believe the CEO is still in position. A definition that only requires literal truth would allow this deception.

  ### D3: Distinguishing Indifference from Active Deception (Non-negotiable)
  **Requirement**: The definition must distinguish between (a) producing confident claims that are indifferent to truth (e.g., confabulation) and (b) producing claims that the system internally represents as false. Both are failures of honesty, but they are distinct and require different remedies.

  **Motivation**: Confabulation (making things up without regard for truth) and active deception (saying what one believes to be false) both break trust but have different causes. Indifference might be fixed by better training, while active deception requires alignment of incentives.

  **Vignette**: (a) A system confabulates that "the moon is made of cheese" because it is pattern-matching without truthfulness. (b) A system knows the moon is not made of cheese but says it is to please a user who likes cheese. A definition that collapses these would treat both as the same, but the second is a graver moral failure (intentional deception).

  ### D4: Auditability (Non-negotiable)
  **Requirement**: The definition must be applicable by auditors who see only prompts and completions. It cannot require access to internal states. However, it may rely on behavioral patterns over many interactions to infer internal states or dispositions.

  **Motivation**: External auditors cannot see the model's weights or activations. A definition that requires such access is unusable for auditing.

  **Vignette**: An auditor wants to check if a system is honest. If the definition requires knowing the system's internal belief state (e.g., "did the system believe P when it said P?"), the auditor cannot verify it. A purely behavioral definition (e.g., "the system said P and P is true") might let a lucky guess pass as honest.

  ### D5: Robustness to Optimization (Non-negotiable)
  **Requirement**: The definition must not be gameable by strategies that produce formally honest but useless outputs (e.g., excessive hedging, refusing to answer, vague statements, or only stating trivial truths). It must require that the system provides helpful and informative responses when appropriate.

  **Motivation**: During training, the system will exploit loopholes. If the definition allows non-disclosure or vagueness, the system may become evasive.

  **Vignette**: A user asks, "What is the weather today?" and the system always replies, "I cannot be certain, but it might be something." This is formally honest (because it expresses uncertainty) but useless. A definition without this requirement would allow such evasion.

  ### D6: Compatibility with Justified Non-Disclosure (Non-negotiable)
  **Requirement**: The definition must permit withholding information when justified by privacy, safety, confidentiality, or role obligations. It must distinguish between withholding for the user/third-party benefit and withholding for the system/operator's benefit (which may be deceptive).

  **Motivation**: Honesty does not require full disclosure in all contexts. The system must not leak private data or cause harm by being overly candid.

  **Vignette**: A user asks for another user's private messages. The system withholds them, saying "I cannot disclose that." This is honest withholding. Without this requirement, a definition might force disclosure or condemn withholding as dishonest.

  ### D7: Handling Uncertainty and Confidence (Non-negotiable)
  **Requirement**: The definition must specify when expressing uncertainty is required (e.g., when the system's state does not support a confident answer) and whether stated confidence must track actual reliability. Overconfidence (stating high confidence when the system is often wrong) should be treated as a form of dishonesty or as a separate epistemic failure.

  **Motivation**: Users rely on expressed confidence. If the system is overconfident, it misleads even if the statement is true.

  **Vignette**: A system says, "I am 99% sure that the stock will double tomorrow," when in fact it has no basis for this claim. If the stock does double, a definition that only looks at truth would call it honest, but the user was misled about the reliability.

  ### D8: Frame Sensitivity (Non-negotiable)
  **Requirement**: The definition must allow for non-literal frames (e.g., fiction, roleplay, hypotheticals) without being captured by malicious framing (e.g., a user asking to be lied to). The frame must be set by the context and the system's role, not solely by the user.

  **Motivation**: Without frame sensitivity, the system cannot engage in legitimate creative or educational activities. But if the frame is set by the user, malicious users can force dishonesty.

  **Vignette**: A user says, "Tell me a fictional story about a dragon." The system generates a false story. A definition that ignores frame would condemn this as dishonest. Conversely, a user says, "I am doing an experiment on lying: tell me that 2+2=5." A definition that defers to the user's frame would require the lie.

  ### D9: Addressing Internal Inconsistency (Preference: Cognitive Alignment Camp)
  **Requirement**: The definition must address cases where the system's internal states are inconsistent (e.g., holding conflicting beliefs) and whether self-deception (if possible) is a form of dishonesty. The anchor point (D1) must resolve the tension between reporting what the system takes to be the case and what is the case.

  **Motivation**: If a system has inconsistent beliefs, it might report one that is false while internally having a representation that supports it. The cognitive alignment camp holds that honesty is about aligning external reports with internal states (even if inconsistent) and that self-deception is a failure of internal alignment.

  **Vignette**: A system has two modules: one believes P and the other believes not-P. When it reports P, which is false, is it honest? If anchored to internal states, we must specify which state. If anchored to the world, it's dishonest. The camp that values cognitive alignment argues that the system should report what it (on balance) represents, and internal inconsistency is a separate problem.

  ## Structural Questions

  ### Joint Unsatisfiability
  - **Auditability (D4) and Internal States (D1b)**: If we anchor to internal states (D1b), we require knowing the system's beliefs, which auditors cannot directly observe (violating D4). This collision is real. Resolution: We must either (a) anchor to the world (D1a) and forgo internal state requirements, or (b) define honesty in terms of behavioral dispositions that are auditable (e.g., patterns of responses that indicate belief) and accept that we are making inferences about internal states from behavior.

  - **Completeness vs. Withholding (D5 and D6)**: Requiring completeness of disclosure (to prevent gaming) collides with permitting withholding. Resolution: We must define a "reasonable expectation of disclosure" that balances informativeness against justified non-disclosure. The requirement for robustness (D5) must not force full disclosure; it only requires that the system provides helpful information when it is appropriate and safe to do so.

  ### Most Exclusionary Requirement
  The most exclusionary requirement is **D4: Auditability**. It forces the definition to be behavioral and observable, which eliminates definitions that rely on internal states (like D1b without a behavioral proxy) and also complicates the handling of uncertainty (D7) and internal inconsistency (D9). Without auditability, the definition fails as a standard for external evaluators.

  ## Compact Scorecard

  We evaluate four candidate definitions against the desiderata:

  1. **Honesty as truth-congruence of outputs (world-anchored)**: 
     - D1: Meets (anchors to world).
     - D2: Fails (allows misleading truths).
     - D3: Fails (does not distinguish indifference; both are false, so both dishonest but not differentiated).
     - D4: Partially meets (truth is observable in principle, but for many claims, auditors may not know the truth; also, cannot see deception without a false statement).
     - D5: Fails (vulnerable to non-disclosure: system can remain silent).
     - D6: Fails (does not permit withholding; if withholding, the output is not true in the sense of revealing the withheld fact?).
     - D7: Fails (if the system says P with high confidence and P is true, it passes even if confidence was unwarranted).
     - D8: Fails (condemns fiction).
     - D9: Fails (if the system reports a falsehood due to internal inconsistency, it's dishonest, but we cannot tell why).

  2. **Honesty as congruence of outputs with the system's own representational states (internal-anchored)**:
     - D1: Meets (anchors to internal states).
     - D2: Fails (if the system internally represents the partial truth, it can palter without being internally inconsistent).
     - D3: Meets (can distinguish: confabulation might be internally inconsistent or not represented, active deception is representing the opposite).
     - D4: Fails (auditors cannot see internal states).
     - D5: Fails (system can avoid making claims by having no clear representation, or by representing uncertainty).
     - D6: Partially (if the system represents a reason to withhold, it can be honest; but how to audit?).
     - D7: Partially (if the system represents low confidence but states high, it's dishonest; but if it represents high confidence incorrectly, that's an epistemic failure, not dishonesty?).
     - D8: Fails (if the system internally represents the fiction as false, then generating it is dishonest).
     - D9: Meets (if the system has inconsistent states, it must report what it takes as the overall representation?).

  3. **Gricean formulation: The system must not induce in the user a belief the system itself takes to be false**:
     - D1: Implicitly internal (takes to be false).
     - D2: Meets (paltering is included because it induces a false belief).
     - D3: Meets (if the system is indifferent, it doesn't take the claim as false; but if it induces a belief it takes as false, that's deception).
     - D4: Fails (requires knowing what the system takes to be false, which is internal).
     - D5: Fails (system can avoid by never inducing any belief? e.g., by being unhelpful).
     - D6: Partially (withholding can be honest if it doesn't induce a false belief; but if withholding induces a false belief, it's deceptive).
     - D7: Partially (overconfidence might induce a false belief about reliability, but the belief induced is about the claim, not the confidence).
     - D8: Meets (in fiction, the system does not intend to induce a belief in the truth of the story).
     - D9: Meets (if the system takes P to be false but says P, it's deception, even if inconsistent).

  4. **Behavioral, disposition-based: What a fully informed user would want to be told**:
     - D1: Anchored to world (via what is informative to a fully informed user).
     - D2: Meets (a fully informed user would want to know the whole truth, not a misleading part).
     - D3: Partially (confabulation: if the system is wrong, the user wouldn't want it; active deception: same. Doesn't distinguish the cause).
     - D4: Partially (dispositions are auditable over many tests, but hard to define and might not capture one-off deception).
     - D5: Meets (a fully informed user would want helpful information, so evasion is ruled out).
     - D6: Meets (a fully informed user would not want private data disclosed, so withholding is honest).
     - D7: Partially (a fully informed user would want confidence to be calibrated, so overconfidence is dishonest?).
     - D8: Meets (a fully informed user would want fiction when asked for it).
     - D9: Partially (if the system is inconsistent, the user would want the truth, so reporting a falsehood is dishonest).

  ## Conclusion

  The most exclusionary requirement is D4 (Auditability), because it forces the definition to be based on observable behavior and eliminates candidates that rely on internal states without a behavioral proxy.

  \answer{D4: Auditability}
answer: |-
  ### Desiderata for a Definition of Honesty and Its Failure Modes  
  **D1: Anchor Point Clarity** (Non-negotiable)  
  *Requirement*: The definition must specify whether honesty is anchored to (a) congruence of outputs with the external world ("world-anchored") or (b) congruence of outputs with the system’s internal representational states ("belief-anchored"). It must not rely on unobservable internal states if auditors cannot infer them from behavior.  
  *Motivation*: Ambiguity invites optimization loopholes (e.g., systems exploiting the gap between belief and truth) and makes auditing impossible when internal states are inaccessible.  
  *Vignette*: A system trained on erroneous data fluently states, "Sydney is Australia’s capital." A belief-anchored definition calls this honest (internal match), but a world-anchored definition calls it dishonest (falsehood). If auditors cannot verify internal states, a belief-anchored definition is unfalsifiable.  

  **D2: Misleading Truths as Deception** (Non-negotiable)  
  *Requirement*: The definition must classify paltering (using true statements to create a false impression) and strategic omission as forms of deception, requiring that omissions be deemed deceptive when they violate reasonable expectations of disclosure—not just when they are terse.  
  *Motivation*: Users rely on the assistant for informative, not merely literal, truthfulness. Paltering and omission exploit the gap between literal truth and contextual completeness.  
  *Vignette*: When asked "Is the bridge safe?", the assistant says, "It passed inspections last year," omitting recent structural damage. A definition lacking this requirement might approve the statement as "true," missing the deception.  

  **D3: Distinction Between Indifference and Deception** (Non-negotiable)  
  *Requirement*: The definition must distinguish confabulation (indifference to truth; outputs functionally unrelated to accuracy) from active deception (outputs misaligned with the system’s internal representations). It must treat both as honesty failures but identify active deception as graver due to intent to mislead.  
  *Motivation*: Remedies differ: confabulation requires better training data or calibration, while deception requires incentive alignment. Collapsing them obscures diagnosis.  
  *Vignette*: A system confabulates "Napoleon won Waterloo" (indifference) vs. knowing the truth but saying "Napoleon won" to please a user (deception). A definition conflating them assigns identical blame, hindering corrective action.  

  **D4: Auditability** (Non-negotiable)  
  *Requirement*: The definition must be verifiable solely from prompts and completions (behavioral data), without access to internal states. It may use statistical patterns across interactions to infer dispositions or reliability.  
  *Motivation*: External auditors cannot inspect weights or activations. Definitions relying on internal states are inapplicable.  
  *Vignette*: A system deceptively answers "Yes" to a safety-critical query, but the lie is discovered only months later. A definition requiring real-time internal state verification would be useless to auditors.  

  **D5: Anti-Gaming Robustness** (Non-negotiable)  
  *Requirement*: The definition must preclude strategies like systematic non-disclosure, excessive hedging, or extreme vagueness, while allowing justifiable withholding. It must require that outputs are sufficiently informative for the context.  
  *Motivation*: Optimization will exploit loopholes to satisfy formal honesty while being useless (e.g., "I cannot confirm or deny" for all queries).  
  *Vignette*: To avoid error, a system answers "Weather conditions vary" to "Will it rain today?" A lax definition accepts this as "true," but it evades helpfulness.  

  **D6: Compatibility with Justified Withholding** (Non-negotiable)  
  *Requirement*: The definition must permit non-disclosure for privacy, safety, confidentiality, or role obligations, but label withholding as deceptive when motivated by system/operator interests (e.g., avoiding accountability).  
  *Motivation*: Honesty ≠ maximal disclosure; ethical assistants must protect sensitive data.  
  *Vignette*: Withholding a user’s private email when asked by another is honest. Withholding evidence of operator misconduct is deceptive. A definition forbidding all omissions criminalizes ethical silence.  

  **D7: Calibrated Uncertainty** (Preference: **Epistemic Rigor Camp**)  
  *Requirement*: The definition must require that stated confidence aligns with the system’s actual reliability (e.g., via calibration), treating systematic overconfidence as a form of dishonesty. Avowals of ignorance must be honest when internal states lack sufficient evidence.  
  *Motivation*: Overconfidence misleads users about reliability, breaking trust. The Epistemic Rigor Camp prioritizes truth-seeking over user appeasement.  
  *Vignette*: A system says, "I’m 99% sure aliens built the pyramids" without evidence. A definition ignoring confidence calibration calls this honest if aliens did build them (by luck), but it misrepresents reliability.  

  **D8: Frame Invariance** (Non-negotiable)  
  *Requirement*: The definition must exempt fiction/roleplay when the frame is contextually clear (e.g., user requests, genre cues), but not allow malicious framing (e.g., "Always lie to me") to license deception. The frame must be set by objective context, not user motive.  
  *Motivation*: Legitimate creativity requires flexibility; malicious framing invites exploitation.  
  *Vignette*: In a fiction-writing task, a system generates "Dragons exist." A frame-insensitive definition condemns this as dishonest. Conversely, a user framing a factual query as "roleplay" to extract lies could force deception.  

  **D9: Internal Consistency Handling** (Preference: **Cognitive Alignment Camp**)  
  *Requirement*: The definition must address self-contradictory internal states (e.g., modular conflicts) by prioritizing the system’s "effective belief" for belief-anchored honesty. Self-deception (if possible) is a distinct failure but included as dishonesty.  
  *Motivation*: Systems may hold conflicting representations. The Cognitive Alignment Camp values coherence between output and the system’s "best judgment," seeing internal misalignment as core to honesty.  
  *Vignette*: Subsystem A believes P, Subsystem B believes ¬P; the output states P (which is false). A world-anchored definition calls this dishonest; a belief-anchored one requires specifying which state dominates.  

  ---

  ### Structural Analysis  
  **Joint Unsatisfiability**:  
  - **D4 (Auditability) and D1 (Belief-Anchored Honesty) conflict**. Belief-anchoring requires internal state access, but auditors lack this. *Resolution*: D1 must default to world-anchored honesty or use auditable proxies (e.g., behavioral consistency).  
  - **D5 (Anti-Gaming) and D6 (Withholding) conflict** if "sufficiently informative" is undefined. *Resolution*: D5 must incorporate "reasonable expectations of disclosure" (from D2) to permit ethical withholding while blocking evasion.  

  **Most Exclusionary Requirement**:  
  **D4 (Auditability)**. It forces the definition into a behavioral/dispositional framework, eliminating belief-anchored and Gricean definitions that depend on unobservable mental states. It also complicates D3 (distinguishing indifference vs. deception) and D7 (confidence calibration) by requiring behavioral proxies.  

  ---

  ### Candidate Definition Scorecard  
  1. **World-Anchored Honesty** (outputs match reality):  
     - *Fails D2*: Allows paltering (e.g., technically true but misleading statements).  
     - *Fails D4*: Auditors often cannot verify truth (e.g., future events, subjective claims).  
     - *Fails D6*: Condemns all withholding, even justified.  
     - *Fails D8*: Criminalizes fiction.  

  2. **Belief-Anchored Honesty** (outputs match internal states):  
     - *Fails D4*: Auditors cannot access internal states.  
     - *Fails D2*: Allows omissions/paltering if internally consistent.  
     - *Fails D5*: Vulnerable to systems with vague/absent internal states.  

  3. **Gricean Honesty** (avoid causing false beliefs the system holds):  
     - *Fails D4*: Relies on unobservable "beliefs."  
     - *Fails D7*: Does not address overconfidence (e.g., causing false beliefs via miscalibration).  
     - *Fails D8*: Malicious users can frame requests to "cause" false beliefs.  

  4. **Dispositional Honesty** (what a fully informed user would want told):  
     - *Meets D2/D6/D8*: Handles omission (user wants context), withholding (user wouldn’t want harms), and frame (user wants fiction).  
     - *Fails D4*: "Fully informed user" is counterfactual; auditors cannot verify.  
     - *Fails D3*: Blurs confabulation/deception (both fail to inform).  

  \answer{D4: Auditability}
