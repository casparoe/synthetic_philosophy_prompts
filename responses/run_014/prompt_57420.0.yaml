answer: |-
  ### Practice Final Exam Question: Identity of Indiscernibles  
  *(You do not need to cite or name specific philosophers or texts.)*

  **World W1**: A universe containing nothing except two perfectly identical iron spheres. They share all properties: same diameter, color, temperature, atomic structure, etc. They are suspended at a fixed distance from each other in otherwise empty space. Nothing ever changes.  
  **World W2**: Initially identical to W1. After some time, **one sphere** acquires a small dent (a permanent, non-relational alteration) while the other remains unchanged. The universe remains otherwise empty and symmetric.  

  **Answer all three parts:**  
  **(A)** (4 marks) In **W2**, are the two spheres discernible? If so, by what property or properties? Justify your answer.  
  **(B)** (8 marks) Consider this argument:  
  > *"W2 is just W1 with a dent added later. In W2, the spheres are clearly discernible (e.g., one has a dent, the other does not). Therefore, Black’s original world (W1) never threatened the Identity of Indiscernibles, since adding a dent breaks the symmetry and makes discernibility obvious."*  
  Evaluate this argument. Does it successfully defend the Identity of Indiscernibles against Black’s W1? Explain why or why not.  
  **(C)** (8 marks) What does **W2** reveal about the challenge posed by **W1** to the Identity of Indiscernibles? Specifically, address this problem: We cannot even *describe* W2 without implying *which* sphere gets the dent (e.g., "the left sphere dented"). How does this impact the debate over whether distinct objects must differ in some non-trivial property?  

  ---

  ### Model Answer (650 words)  
  **(A)** In W2, the spheres **are discernible** after the dent appears. They are discernible by the **non-relational, intrinsic property** *having a dent* (or conversely, *being pristine*). Before the dent, they share all properties (like in W1). After the dent, one sphere instantiates *having a dent* while the other instantiates *lacking a dent* (where "lacking" is not a mere absence but a positive, intrinsic state contrasting with the altered sphere). This is a qualitative difference, making them discernible.  

  **(B)** The argument **fails** to defend the Identity of Indiscernibles (IoI) against Black’s W1. It misunderstands both the challenge of W1 and the implications of W2.  

  First, the argument claims W2 is "W1 with a dent added," but this misrepresents W1. W1 contains *no change, no time, and no potential for alteration* by definition. Adding a dent to W1 would create a *different world* (W2) with temporal properties W1 lacks. W1’s spheres are indiscernible *because they share all properties eternally and immutably*. W2 does not "fix" W1; it replaces it with a scenario where discernibility emerges *only after* a break in symmetry.  

  Second, the argument assumes that because discernibility exists in W2, IoI was never threatened by W1. This ignores IoI’s core claim: **if two objects share *all* properties, they are identical**. In W1, the spheres *do* share all properties (including relational, temporal, and modal properties), yet they are numerically distinct. W2 does not resolve this because the spheres in W2 were *indiscernible* before the dent. If IoI were true, there could not be two indiscernible spheres *even temporarily*—yet W2 shows this is possible.  

  Crucially, W2’s temporal asymmetry (one sphere dents, the other doesn’t) **presupposes** the spheres were distinct *before* the dent. If the spheres were identical (per IoI), there would be no "one" sphere to dent rather than the other. The dent breaks symmetry but does not explain how two distinct spheres existed *prior* to the dent without differing properties. Thus, W2 *reinforces* Black’s point: W1 shows distinct objects can share all properties, and W2 shows that breaking symmetry requires prior distinctness.  

  **(C)** W2 reveals that W1’s challenge to IoI is **inescapable without haecceities** (primitive "thisness"). The problem of describing W2 ("one sphere dents") exposes that we must *pick out* an object to attribute change to it, even when no qualitative properties distinguish it initially.  

  In W2, before the dent, the spheres are indiscernible. To describe *which* sphere dents, we must refer to it non-qualitatively (e.g., "*this* sphere" or "*that* sphere"). But in a universe with only two spheres, there are no spatial landmarks (left/right is relative to an observer, who doesn’t exist). We cannot say "the sphere at location L dents" because location is relational (defined relative to the other sphere), and both share the same relational properties (e.g., each is "1 meter from the other"). **No qualitative description can specify which sphere changes.**  

  This shows IoI’s fatal flaw: it cannot ground numerical diversity. If objects are distinct only if they differ qualitatively, then in W1 (or pre-dent W2), the spheres should not be distinct—but they are. W2 proves we need **primitive individuation**: the spheres must have non-qualitative identities ("haecceities") to explain *why* one dents and not the other. Without haecceities, W2 is *literally indescribable*—we cannot assign the dent to a particular sphere without smuggling in brute identity.  

  Furthermore, "sharing all properties" cannot mean a finite list of observable traits (e.g., color, size). Properties include **all intrinsic and extrinsic attributes across time and possibility**. In W1, spheres share all such properties: both *always* have temperature T, both *could* have been moved (but don’t), etc. In pre-dent W2, both share the property *could dent at time t* (since neither has a "essence" preventing it). Yet only one *actually* dents, revealing a brute difference in identity.  

  Thus, W2 confirms that W1 defeats IoI. Indiscernible objects *can* be distinct, and attempts to "break" symmetry (like the dent) rely on prior distinctness that cannot be reduced to qualitative properties.  

  ---  

  ### Marking Scheme  
  **Total: 20 marks**  
  #### Rubric (Top answer = 18–20 marks; Bare pass = 10–12 marks)  
  1.  **A: Discernibility in W2 (4 marks)**  
      - 4/4: Correctly identifies spheres as discernible post-dent via *intrinsic* dent/pristine properties; notes initial indiscernibility.  
      - 2/4: Only states they are discernible but misattributes to relational properties (e.g., "position").  
      - 0/4: Claims they are indiscernible.  

  2.  **B: Argument Evaluation (8 marks)**  
      - **Rejects the argument (3 marks)**: Clearly states it fails to defend IoI.  
      - **W2 ≠ "W1 + dent" (2 marks)**: Notes W1 lacks time/change; W2 is distinct.  
      - **Pre-dent indiscernibility in W2 (2 marks)**: Explains that W2’s spheres were indiscernible *before* dent, so IoI still fails.  
      - **Dent presupposes distinctness (1 mark)**: Argues dent requires prior numerical diversity.  
      *Deduct 2 marks* if answer treats the dent as empirical "proof" against W1 (misunderstanding IoI as epistemological).  

  3.  **C: Implications for W1 (8 marks)**  
      - **Description problem (3 marks)**: Explains we cannot state *which* sphere dents without non-qualitative reference.  
      - **IoI’s inability to ground distinctness (3 marks)**: Links W2’s indescribability to haecceitism/brute facts.  
      - **"All properties" ≠ finite list (2 marks)**: Notes properties include temporal/modal attributes.  

  #### Five Specific Mistakes (Deduct 2–3 marks per error)  
  1.  **Invoking trivial properties**: *"In W1, sphere A has the property 'being identical to A', so they differ."*  
      → **Error**: Confuses discernibility with grounding. "Being identical to A" is trivial (circular) and does not explain *how* A and B are distinct.  
  2.  **Spatial relations discern in W1**: *"In W1, each sphere has a unique position: one is 'left', the other 'right'."*  
      → **Error**: Relies on an observer. In an empty universe, "left" is relational and symmetric (each is "left of the other").  
  3.  **Dent confirms distinctness empirically**: *"W2 shows we can tell them apart by looking, so they were always distinct."*  
      → **Error**: Reduces IoI (metaphysical principle) to an epistemological claim. IoI demands qualitative *grounds* for distinctness, not mere detectability.  
  4.  **W2 rescues IoI**: *"Since the dent breaks symmetry, IoI holds in all possible worlds."*  
      → **Error**: Ignores that pre-dent spheres were indiscernible yet distinct, violating IoI.  
  5.  **Misdefining properties**: *"Properties are just observable features like color or shape; W1 spheres share these but are still two."*  
      → **Error**: Fails to grasp that "all properties" includes relational, temporal, and modal attributes (e.g., *could have been dented*).  

  ---  
  **Rationale**: This question forces engagement beyond memorization. Part A tests basic comprehension. Part B’s flawed argument requires critical analysis of time and individuation. Part C targets the core metaphysical problem (indescribability without haecceities) and blocks "list" interpretations of properties. Mistakes 1–2 penalize superficial "solutions"; mistake 3 rejects empiricist misreadings. The model answer defends haecceitism without using the term, pushing students to articulate *why* brute facts are unavoidable.
