  I'm a junior in high school, and I've been reading some decision theory and moral philosophy material on my own over the past few months — not as part of any course, just because I got interested in expected value and moral uncertainty after a long conversation with a friend. I've come across the idea that consequentialists might be "clueless" about the actual moral value of their actions, especially when the consequences are potentially enormous, and I think I understand the basic claim. But I'm getting confused about a specific technical point, and I'd really appreciate a clear explanation.

  My confusion is this: I think I've seen the cluelessness problem stated in two different ways, and I'm not sure whether they're the same thing or whether one is stronger than the other. The first way is "we don't know the moral value of our actions," which sounds like ordinary uncertainty — we have some probability distribution over possible values, it's just very wide. The second way is "we don't even have a probability distribution over the possible values," which sounds much stronger, like we're so clueless that we can't even say which range of values is more likely. Could you explain the difference between these two kinds of cluelessness? And more importantly, why does the second kind (no probability distribution) pose a problem for expected value maximization in a way that the first kind (a wide probability distribution) does not? I'm trying to understand whether the cluelessness problem is really a problem for expected value maximization specifically, or whether it's a problem for any decision procedure that relies on expected value in some way.

  My friend thinks the two kinds of cluelessness are basically the same, and that the problem is just that we're "very uncertain," which is a problem for any decision procedure. I'm not sure who's right, and I'd love a clear explanation that helps me settle this. If it helps, I'm mostly interested in the conceptual distinction and the logic of why one kind of cluelessness breaks expected value maximization while the other doesn't — I don't need a full survey of the literature, just a clear, careful explanation.
