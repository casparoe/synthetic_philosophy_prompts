  We are setting up an adversarial collaboration between two camps on the old evidence problem. The goal is to produce a joint statement they'd both sign. The two camps are:

  1. **Synchronists**: They view confirmation as a timeless relation defined as P(H|E) > P(H). Old evidence can confirm because confirmation is about the logical relation, not the agent's belief update.

  2. **Diachronicists**: They view confirmation as a diachronic process where evidence E confirms H for an agent only if it raises the agent's credence in H at the time of learning E. Old evidence, already known, cannot confirm in this strict sense. They require a special account (like the 'fitting' relation or conditionalization on the discovery of a connection).

  The document should include:

  - **Agreed claims**: About the formalism, the structure of the old evidence problem (beyond Mercury), and common ground.

  - **Disagreements**: Precisely stated, with wording acceptable to each side. The cruxes are:
    a) Whether confirmation is synchronic or diachronic.
    b) Whether 'fitting' (or similar) is a species of confirmation or a different relation.
    c) Whether the diachronicist's move (conditionalization on discovering the connection) is a genuine Bayesian update or a fudge.

  - **For each crux**: A concrete case or argument both sides agree bears on it, and each side's prediction.

  **Structure**:

  I. **Agreed Claims (Numbered Section)**:

     We agree that:

     1. The formalism of Bayesian confirmation theory is a useful starting point, where confirmation is typically defined in terms of a probability function P. The standard definition of confirmation is that evidence E confirms hypothesis H relative to P if and only if P(H|E) > P(H).

     2. The old evidence problem arises when E is already known (so the agent's current credence in E is 1) and we ask whether E confirms H. The classic example is the anomalous precession of Mercury's perihelion (E) and its confirmation of General Relativity (H). But the problem is general: for any E that is old (known with certainty) and any H, the standard definition seems to imply that E does not confirm H because P(H|E) = P(H) when P(E)=1.

     3. Both camps acknowledge that the old evidence problem challenges the standard Bayesian definition. However, they differ in how they resolve this challenge.

     4. Both camps agree that in the Mercury case, and in many similar cases, we have a strong intuition that the old evidence (Mercury's perihelion) did confirm the new theory (General Relativity). Therefore, any adequate account of confirmation should accommodate this intuition.

     5. Both camps accept that the agent's background knowledge (K) is crucial and that the probability function P is defined relative to K. In particular, when E is old, it is part of K.

     6. Both camps accept that the discovery of a logical or explanatory connection between E and H can lead to an increase in credence in H, even when E is old. The diachronicist takes this as the key to a solution, while the synchronist sees it as an unnecessary complication.

     7. Both camps agree that the following formal point holds: if P(E)=1, then P(H|E)=P(H). Therefore, under the standard definition, old evidence cannot confirm. The dispute is over whether this formal point is the end of the story.

  II. **Disagreements (Table Format)**:

  We'll now present the disagreements in a table. The table will have the following columns:

  - **Crux**: The specific point of disagreement.
  - **Synchronist Position**: As they would phrase it.
  - **Diachronicist Position**: As they would phrase it.
  - **Concrete Case/Argument**: A scenario or argument both sides agree is relevant to the crux.
  - **Synchronist Prediction**: What the synchronist expects in the concrete case.
  - **Diachronicist Prediction**: What the diachronicist expects in the concrete case.

  Let's outline the cruxes:

  Crux 1: The nature of confirmation: is it synchronic or diachronic?
  Crux 2: The status of the 'fitting' relation: is it a species of confirmation or a different relation?
  Crux 3: The legitimacy of the diachronicist's update: is conditionalization on the discovery of the connection a genuine Bayesian update?

  Now, we build the table:

  | Crux | Synchronist Position | Diachronicist Position | Concrete Case/Argument | Synchronist Prediction | Diachronicist Prediction |
  |------|----------------------|------------------------|------------------------|------------------------|--------------------------|
  | 1. The nature of confirmation: Is confirmation fundamentally a synchronic relation (holding at a time) or a diachronic process (involving change over time)? | Confirmation is a synchronic relation: it holds between H and E relative to a probability function P at a given time. The fact that an agent's credence in E is 1 at that time does not negate that E confirms H in the synchronic sense. | Confirmation is fundamentally diachronic: it is a three-place relation between H, E, and an agent at a time, and it requires that learning E would raise (or did raise) the agent's credence in H. If E is already known, it cannot confirm H in the diachronic sense. | **The Jupiter Case**: Consider an agent who has known for years that Jupiter has 79 moons (E). A new hypothesis H is proposed: that the number of moons is prime. The agent then checks and finds that 79 is prime. Both camps agree that the agent's credence in H increases upon this discovery, but what is the status of E as evidence? | In the Jupiter case, E (79 moons) does confirm H (the number is prime) synchronically: P(H\|E) > P(H) holds once we take into account the agent's background knowledge without E. But note: the agent's background knowledge includes E, so we must use a probability function that does not have E as certain? The synchronist might say: we evaluate P(H\|E) and P(H) relative to a probability function that does not include E (or conditional on background without E). Alternatively, they might use a counterfactual probability function. The prediction: the synchronic confirmation relation holds even before the agent realizes the connection. | In the Jupiter case, the old evidence E (79 moons) does not confirm H (prime) in the diachronic sense because the agent already knew E. The increase in credence occurs not because of E (which was old) but because of the new evidence: the discovery that 79 is prime (or the logical connection). Thus, the diachronicist predicts that the confirmation event is the learning of the connection, not the old evidence itself. |
  | 2. Is the 'fitting' relation (or the relation that holds when we discover a connection) a species of confirmation or a different relation? | The 'fitting' of old evidence to a new hypothesis is just an instance of synchronic confirmation. The relation we are calling 'fitting' is nothing but the synchronic confirmation relation. | The 'fitting' relation is not confirmation in the strict (diachronic) sense. It is a distinct epistemic virtue, perhaps called 'explanatory fit' or 'retrospective support', that is important but not the same as confirmation. | **The Neptune Case**: Suppose Le Verrier uses Newtonian mechanics (H) to predict the existence and position of Neptune, leading to its discovery (E). Later, a new hypothesis H' (e.g., modified gravity) is proposed that also accounts for the orbit of Uranus (without Neptune). Now, consider an agent who has known E (Neptune's position) for years. When H' is proposed, the agent realizes that H' also fits E. Does E confirm H'? | The synchronist predicts: yes, E does synchronically confirm H' because P(H'\|E) > P(H') relative to a background that does not include E (or in a counterfactual scenario without E). The fact that E is old doesn't change the timeless relation. | The diachronicist predicts: no, E does not confirm H' in the diachronic sense because the agent's credence in H' does not increase upon learning E (they already knew E). The realization that H' fits E is a new piece of evidence (call it F: the fact that H' entails or explains E) that causes the increase. Thus, what confirms H' is F, not E. |
  | 3. Is the diachronicist's update (conditionalization on the discovery of the connection) a genuine Bayesian update or an artificial fudge? | The diachronicist's move is a fudge: it is not a standard Bayesian update because the evidence they conditionalize on (the discovery of the connection) is not a simple proposition but a complex one that presupposes E and H. Moreover, it requires an ad hoc adjustment to the probability space. | The diachronicist's update is a genuine Bayesian update: we conditionalize on the new evidence, which is the proposition that H entails E (or that E is derivable from H). This proposition is a legitimate piece of evidence that the agent learns. | **The Logic Discovery Case**: An agent knows E (the data from a physics experiment) and is considering two hypotheses H1 and H2. The agent then learns that H1 logically implies E (and that H2 does not). This is the new evidence: the logical implication. | The synchronist predicts: the update upon learning the logical implication is not a case of confirmation by E, but by a different piece of evidence (the logical fact). Moreover, this update can be modeled in the synchronic framework by changing the probability function to reflect the new background knowledge. However, they argue that the diachronicist is conflating the evidence E with the evidence about the connection. | The diachronicist predicts: the update is a straightforward Bayesian update on the new evidence (the logical implication). The agent's credence in H1 increases because they conditionalize on this new evidence. This is how diachronic confirmation works, and it does not involve E as the confirming evidence because E was old. Thus, it is a genuine update. |

  Let me refine the concrete cases to be more precise and ensure both sides agree on the setup.

  Note: In the Jupiter case, we must be careful about the background knowledge. The synchronist might want to evaluate P(H|E) and P(H) relative to background without E, so that even though E is old, we can still compute a synchronic confirmation by considering a probability function that doesn't include E. The diachronicist, however, will insist that the agent's actual probability function has P(E)=1, so we cannot use that.

  For the agreed claims, we might add:

  8. Both camps agree that the agent's actual credence function at a time is defined over their current knowledge, including E if E is old.

  9. Both camps agree that if we consider a probability function that does not include E, then E can confirm H relative to that function. But the synchronist takes this as the relevant function for confirmation, while the diachronicist does not.

