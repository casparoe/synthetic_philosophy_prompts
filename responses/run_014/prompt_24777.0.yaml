answer: |-
  ### Joint Statement on the Old Evidence Problem: Adversarial Collaboration  
  **Between Synchronists and Diachronicists**  

  This document represents the outcome of an adversarial collaboration between two camps addressing the old evidence problem in Bayesian confirmation theory. We agree on core formalisms, the structure of the problem, and key intuitions, but we diverge on the interpretation of confirmation and its implications for old evidence. Below, we outline points of agreement (§I) and disagreements (§II), including concrete cases to test our competing predictions. Both camps endorse this statement as a fair representation of their views and a basis for future resolution.  

  ---

  ### I. Agreed Claims  
  We, the synchronists and diachronicists, jointly affirm the following:  

  1. **Formalism**: Bayesian confirmation theory is our shared framework. We agree that:  
     - Confirmation is standardly defined as a relation where evidence \(E\) confirms hypothesis \(H\) relative to a probability function \(P\) if and only if \(P(H|E) > P(H)\).  
     - \(P\) incorporates an agent’s background knowledge \(K\) at a given time. Probabilities are subjective and reflect rational credences.  

  2. **The Old Evidence Problem**:  
     - This problem arises when \(E\) is "old evidence" (i.e., an agent already knows \(E\) with certainty, so \(P(E) = 1\)).  
     - The core challenge: If \(P(E) = 1\), then \(P(H|E) = P(H)\), so \(E\) cannot confirm \(H\) under the standard definition. This contradicts the strong intuition that old evidence *does* confirm new hypotheses in scientific practice (e.g., Mercury’s perihelion \(E\) confirming general relativity \(H\)).  
     - The problem is generalized beyond Mercury: For any \(E\) already in \(K\), and any \(H\) proposed later, we face a conflict between formalism and intuition.  

  3. **Intuition and Scientific Practice**:  
     - In cases like Mercury, we share the intuition that \(E\) (old evidence) provides genuine support for \(H\). Any adequate account of confirmation must accommodate this.  
     - We agree that the discovery of a logical, explanatory, or probabilistic connection between \(H\) and \(E\) often triggers increased credence in \(H\), even when \(E\) is old.  

  4. **Role of Background Knowledge**:  
     - \(K\) evolves over time. When \(E\) is old, it is part of \(K\), so \(P\) assigns \(P(E) = 1\).  
     - If we consider a counterfactual probability function \(P'\) where \(E \notin K\) (so \(P'(E) < 1\)), then \(P'(H|E) > P'(H)\) typically holds for intuitively confirmatory cases.  

  5. **Diachronic Response**:  
     - Diachronicists propose that upon discovering a connection (e.g., that \(H\) entails \(E\) or explains \(E\)), the agent updates on a *new* proposition \(F\) (e.g., "\(H\) implies \(E\)" or "\(E\) fits \(H\)"). This raises \(P(H)\) via conditionalization.  
     - Synchronists accept that this update occurs but dispute its relevance to defining confirmation.  

  6. **Synchronist Response**:  
     - Synchronists argue that confirmation is timelessly defined by \(P(H|E) > P(H)\) relative to a \(P\) that excludes \(E\) from \(K\) (or uses counterfactual \(P'\)).  
     - Diachronicists accept that this relation holds in counterfactual scenarios but deny it applies to actual agents with \(P(E) = 1\).  

  7. **Shared Goal**: Both camps seek a unified account of confirmation that respects formalism, intuition, and scientific practice.  

  ---

  ### II. Disagreements  
  We disagree on three cruxes, detailed below. For each crux, we:  
  - State the disagreement in neutral terms.  
  - Phrase each camp’s position as they endorse it.  
  - Specify a concrete case both accept as relevant.  
  - Outline each camp’s *testable prediction* for the case.  

  | Crux | Synchronist Position (as endorsed by synchronists) | Diachronicist Position (as endorsed by diachronicists) | Concrete Case | Synchronist Prediction | Diachronicist Prediction |
  |------|---------------------------------------------------|--------------------------------------------------------|---------------|------------------------|--------------------------|
  | **1. Nature of Confirmation**: Is confirmation fundamentally a *synchronic* relation (holding relative to \(P\) at a time) or a *diachronic* process (requiring a change in credence over time)? | Confirmation is synchronic: It is a timeless, logical relation between \(H\), \(E\), and \(P\), defined by \(P(H\|E) > P(H)\). Temporal factors, such as when \(E\) was learned, are irrelevant to whether \(E\) confirms \(H\). The diachronic asymmetry is a red herring. | Confirmation is diachronic: It is a three-place relation between \(H\), \(E\), and an *agent* at a time, defined by \(E\) causing or potentially causing an increase in the agent’s credence in \(H\). If \(E\) is already known (\(P(E) = 1\)), it cannot confirm \(H\) in this sense. | **The Jupiter Case**: An agent has known for decades that Jupiter has 79 moons (\(E\)). A new hypothesis \(H\) is proposed: "The number of Jupiter’s moons is prime." Later, the agent realizes that 79 is prime. Both camps agree the agent’s credence in \(H\) increases upon this realization. | The synchronic confirmation relation \(P(H\|E) > P(H)\) holds *before* the realization. We evaluate it relative to a \(P\) where \(E \notin K\) (or counterfactual \(P'\)). Thus, \(E\) confirms \(H\) timelessly; the realization only makes this relation salient. Prediction: Agents will *retrospectively* judge \(E\) as having confirmed \(H\) all along. | The increase in credence occurs only upon learning the *connection* (that 79 is prime), not when \(E\) was initially learned. Thus, \(E\) (old evidence) does not confirm \(H\) diachronically. What confirms \(H\) is the new evidence \(F\): "79 is prime." Prediction: Agents will report that \(E\) *itself* did not confirm \(H\); only the discovery of the connection did. |
  | **2. Status of 'Fitting'**: When old evidence \(E\) "fits" a new hypothesis \(H\) (e.g., via entailment or explanation), is this a species of *confirmation* or a distinct epistemic relation? | The fitting relation *is* confirmation: When \(E\) fits \(H\) (e.g., \(H\) entails \(E\)), this reduces to synchronic confirmation. Specifically, \(P(H\|E) > P(H)\) holds relative to a \(P\) lacking \(E\), capturing why \(E\) supports \(H\). No separate "fitting" relation is needed. | The fitting relation is *not* confirmation: It is a distinct epistemic virtue (e.g., "explanatory fit" or "retrospective coherence"). Fitting may *accompany* confirmation but is not identical to it, as confirmation requires credence change. Confirmation only occurs via updating on \(F\) (the discovery of the fit). | **The Neptune Case**: Le Verrier used Newtonian mechanics (\(H_1\)) to predict Neptune’s existence/position (\(E\)), later confirmed. Decades later, a new hypothesis \(H_2\) (e.g., a modified gravity theory) is proposed, which also entails \(E\). An agent with old evidence \(E\) learns \(H_2\) and recognizes that \(H_2\) entails \(E\). Does \(E\) confirm \(H_2\)? | Yes: \(E\) synchronically confirms \(H_2\) because \(P(H_2\|E) > P(H_2)\) relative to \(P\) without \(E\). The fit (entailment) is part of this relation. Prediction: Scientists will describe \(E\) as "confirming evidence" for \(H_2\) in historical analyses, regardless of its age. | No: \(E\) does not diachronically confirm \(H_2\) because the agent’s credence in \(H_2\) does not increase upon learning \(E\) (it is old). The increase occurs upon learning \(F\): "\(H_2\) entails \(E\)." Thus, \(F\) confirms \(H_2\); \(E\) merely fits. Prediction: Scientists will emphasize the *discovery of the entailment* as the confirmatory event, not \(E\). |
  | **3. Legitimacy of the Diachronicist Update**: Is conditionalizing on \(F\) (e.g., "\(H\) entails \(E\)") a genuine Bayesian update or an artificial fudge? | The diachronicist update is a fudge: It conflates evidence \(E\) with meta-evidence \(F\). \(F\) presupposes \(E\) and \(H\), making it circular. Updating on \(F\) requires an ad hoc expansion of the probability space to include logical knowledge, which violates standard Bayesianism. | The diachronicist update is genuine: Learning \(F\) (e.g., "\(H\) entails \(E\)") is acquiring new evidence about logical relations. Conditionalizing on \(F\) is standard Bayesian updating. The agent’s background \(K\) includes logical omniscience, so learning \(F\) represents overcoming a limitation of \(K\). | **The Logic Discovery Case**: An agent knows experimental data \(E\) and two hypotheses \(H_1\) and \(H_2\). Initially, \(P(H_1) = P(H_2)\). The agent then learns \(F\): "\(H_1\) logically entails \(E\), and \(H_2\) does not." Both camps agree \(P(H_1)\) increases upon learning \(F\). | The increase in \(P(H_1)\) is due to synchronic confirmation by \(F\), not \(E\). However, \(F\) is not a simple empirical proposition; it requires logical learning, which standard Bayesianism doesn’t handle. Thus, the update is a workaround, not pure conditionalization. Prediction: Agents will struggle to specify \(P(F)\) before learning it, revealing the update’s artificiality. | The increase in \(P(H_1)\) is a legitimate Bayesian update on \(F\). \(F\) is a new proposition that changes the agent’s knowledge of logical relations. Standard conditionalization applies if we extend \(P\) to include logical uncertainty. Prediction: Agents can coherently assign \(P(F) < 1\) before learning \(F\), and \(P(H_1\|F) > P(H_1)\) holds, validating the update. |

  ---

  ### Next Steps  
  This collaboration clarifies that our core disagreement reduces to whether confirmation is an atemporal relation or a temporal process. We commit to empirical tests of the predictions above (e.g., through psychological studies on the Jupiter/Neptune cases) and formal work on the Logic Discovery case. Resolving these cruxes will advance the debate without presupposing either camp’s correctness.  

  **Endorsed by:**  
  - **Synchronist Camp**: Confirmation is synchronic; old evidence confirms via timeless relations.  
  - **Diachronicist Camp**: Confirmation is diachronic; old evidence cannot confirm, but "fitting" or updating on connections may provide other epistemic benefits.  

  ---  
  This document, produced collaboratively, reflects our shared commitment to resolving the old evidence problem through rigorous adversarial engagement.
