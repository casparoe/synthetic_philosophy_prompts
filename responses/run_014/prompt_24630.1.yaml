  We are considering a scenario in cosmology where the universe is eternal and approaches thermal equilibrium. In such a universe, the number of "Boltzmann brains" (BBs) — random fluctuations that create a conscious brain with false memories of a past — is vastly larger than the number of "ordinary observers" (OOs) who arise from the low-entropy early universe. A naive application of self-locating probability (which observer am I?) then seems to imply that we should expect to be BBs. But this is absurd because we have consistent memories and experiences that seem to come from a structured universe.

  We restate the argument and objections in probabilistic modeling terms.

  **The Argument:**

  1. **Generative model:** Consider a model of the universe that produces two types of observers: OOs (via the low-entropy early universe) and BBs (via thermal fluctuations). The model specifies the expected number of each type over the entire history of the universe.

  2. **Expected counts:** Let N_OO be the expected number of OOs and N_BB the expected number of BBs. In an eternal universe with thermal equilibrium, N_BB >> N_OO (because the equilibrium phase lasts much longer and allows for many fluctuations).

  3. **Sampling assumption:** We assume that we are a random observer among all observers. Therefore, the probability of being an OO is proportional to N_OO and of being a BB is proportional to N_BB. Thus:

     P(being OO) = N_OO / (N_OO + N_BB) ≈ 0

     P(being BB) = N_BB / (N_OO + N_BB) ≈ 1

  4. **Absurd conclusion:** Therefore, we should expect to be BBs. But we observe that we are not BBs (we have consistent memories and experiences that fit with being an OO). This is a contradiction.

  **Objections:**

  1. **Reference class problem:** The probability assignment depends on the reference class of "observers". What counts as an observer? If we restrict to observers with experiences as coherent as ours, then perhaps BBs are not in that class? But note: BBs by definition have the same experiences as OOs (they have false memories that are coherent). So if the reference class includes both, then the problem remains.

     However, one might argue that the reference class should be defined by the internal state (which is the same for BBs and OOs) or by the causal history. The problem is that we don't have access to the causal history. So we must condition on the data (our experiences) and ask: what is the probability that a random observer with these experiences is a BB or an OO?

     But note: if BBs and OOs have the same experiences, then conditioning on experiences doesn't help. Then the probability of being a BB is still high because there are more BBs.

  2. **Finite measure problem:** The integral over the entire eternal universe might not be finite. If the universe is eternal, then the expected number of BBs might be infinite. Similarly, the number of OOs might be finite. Then the ratio is undefined (infinity over infinity). We must regularize the measure.

     One way is to consider a finite time interval and then take a limit. However, in an eternal universe, the number of BBs grows without bound over time, while the number of OOs is fixed (they are produced only in the early universe). So even in a finite time interval [0, T], we have:

       N_BB(T) = rate_BB * T   (if the rate is constant in the equilibrium phase)

       N_OO is constant (say, N0).

       Then as T → ∞, N_BB(T) → ∞, so P(being OO) → 0.

     However, if the rate of BB production is very low (exponentially small in the size of the fluctuation), then even over infinite time, the total number of BBs might be finite? But in an eternal universe with a steady state, the expected number of BBs per unit time is a constant, so over infinite time the total is infinite.

     Alternatively, if the universe is spatially infinite, then we have the same problem: infinite numbers of both. Then we must consider densities per unit volume. But again, if the density of BBs is higher, then the problem remains.

  3. **Model selection prior:** The entire model (eternal universe with thermal equilibrium) might be disfavored by the data. We can compare it with a model that does not produce many BBs (e.g., a universe that does not last long enough or that has a different end state). We can compute the Bayes factor:

       P(data | model) = P(we are OOs | model) * P(our specific experiences | we are OOs, model) 
                      + P(we are BBs | model) * P(our specific experiences | we are BBs, model)

     But note: if our experiences are the same whether we are OOs or BBs, then the second term is the same as the first? Actually, the probability of having our specific experiences might be very low for both, but we are conditioning on having them. The key is the probability of being in a state that has these experiences.

     However, the model with many BBs assigns a very high probability to the existence of observers with our experiences (because there are so many BBs) but a very low probability to the event that we are OOs. On the other hand, a model without BBs (or with very few) would assign a high probability to being OOs. But note: if we condition on the existence of at least one observer with our experiences (which is necessary because we exist), then the model with many BBs makes it very likely that we are a BB. So the likelihood of the model with many BBs is:

       P(we have these experiences | model) = P(being OO) * 1 + P(being BB) * 1 = 1   (if we condition on the existence of both types, and we are equally likely to be either given the experiences).

     But that is not the right conditioning. We should condition on the fact that we have these experiences and we are an observer. So:

       P(we are OO | model) = N_OO / (N_OO + N_BB)

       P(we are BB | model) = N_BB / (N_OO + N_BB)

     Then the probability of our observation (which is that we have these experiences and we are in a world that looks like it has a history) is:

       P(our observation | model) = [N_OO * P(experiences|OO) + N_BB * P(experiences|BB)] / (N_OO + N_BB)

     But if P(experiences|OO) = P(experiences|BB) = 1 (because both types have the same experiences by definition), then:

       P(our observation | model) = (N_OO + N_BB) / (N_OO + N_BB) = 1

     This doesn't help. So we must look at the prior over models.

     Alternatively, we can argue that the model that predicts we are almost certainly BBs is disconfirmed by the fact that we are not BBs (we have evidence that we are in a structured universe). But note: the BB scenario says that we are BBs who have false memories of a structured universe. So how do we know we are not?

