answer: |-
  The air in the Continuity Bureau's highest audit chamber tasted of dust and ozone, thick with the subsonic hum of the vast archives below. Lena Vanya traced a finger along the cracked leather spine of a ledger, the numbers blurring before her tired eyes. Across the obsidian table, Kael Brenner scowled at his own identical copy, the tension between them a physical thing, sharp as the quartz shards embedded in the chamber walls.

  For ten days, they’d wrestled with the impossible audit. The Bureau’s purpose was simple, terrifying, and absolute: scan every resident of the Citadel, store them as dormant instances within the mountain beneath them, a frozen army against oblivion. Every ten years, two auditors verified the scope. This time, the ledgers were ambiguous, corrupted by data-loss during the Great Quarantine decades prior. The question was brutal in its simplicity: how many instances slept in the vaults?

  Two estimates warred:
  *   **The Lean View:** Scans only completed the affluent Inner Districts before the quarantine sealed the Citadel. Approximately 400,000 instances stored.
  *   **The Deep View:** Scans miraculously finished the entire city, including the sprawling, chaotic Outer Districts, during the quarantine itself. Approximately 7.2 million instances stored.

  Either way, the current living population stood at 2.4 million souls. The implications were profound. If Deep was true, it meant the Bureau defied plague and panic to achieve its mandate – a historical controversy with no surviving records, only whispers and scars. If Lean was true, the Outer Districts were never scanned, their people lost forever should catastrophe strike again.

  “We’re deadlocked, Brenner,” Lena stated, her voice tight. “The material evidence is dust. We need the rules.”

  Kael grunted. The rules were their compasses in this statistical void.
  *   **The Continuity Principle:** Your estimate should shift based on *specific* attributes tied to your situation – your recorded district, your wake-date, physical discrepancies – but not the bare fact of your own existence. You are one random draw from the relevant set; your presence tells you nothing new.
  *   **The Living Lens:** An account of the world that includes more potential observers *like you* – conscious, experiencing entities – is inherently more probable, simply because you *are* one such observer. Your existence *is* evidence.

  Kael was a Continuity man, rigid and precise. Lena favored the Living Lens, finding it captured a deeper resonance. They’d applied their principles, cross-referenced fragmented logs, argued over corrupted district codes. Still, stalemate.

  Lena leaned back, staring at the vaulted ceiling where phosphorescent lichen cast eerie green light. The numbers swirled in her mind: 400,000 stored (Lean) + 2.4 million living = 2.8 million total potential observers under Lean. 7.2 million stored (Deep) + 2.4 million living = 9.6 million total potential observers under Deep. The Living Lens said her own existence as an observer favored the scenario with *more* potential observers.

  She sat bolt upright, knocking her stylus to the floor. “Kael! We don’t need the archives!”

  He looked up, brow furrowed. “Don’t be absurd, Vanya. Where else?”

  “Here!” She tapped her temple, then scribbled frantically on a scrap of synth-parchment. “Living Lens. Right now. The two scenarios. Lean: 400k stored plus us 2.4 million living. How many possible observers? 2.8 million total.” She wrote it down: *Lean Total: 2.8 mil*.

  “Obviously,” Kael muttered.

  “Deep: 7.2 million stored plus us 2.4 million living. 9.6 million total possible observers.” *Deep Total: 9.6 mil*.

  “Still obvious.”

  “The Lens,” Lena pressed, her voice rising with excitement. “It tells me the scenario where observers like me – conscious, right now – are more numerous is more likely *because I am here to observe*. The odds favor Deep! Look: 9.6 million versus 2.8 million. Ratio is… 9.6 divided by 2.8 is… approximately 3.4286 to 1. So Deep is roughly… 3.4286 over 4.4286… about 77.4% probable! Lean only has about 22.6%.” Her eyes shone. “Seventy-seven percent, Kael! From my desk! It *fits*. Deep implies they scanned during the quarantine – it *has* to be right!”

  She was triumphant. Armchair history, resolving the Citadel’s greatest archival mystery.

  Kael’s face had darkened like a thunderhead. He slammed his palm on the table, making the ledgers jump. “Seventy-seven percent nonsense, Vanya! That’s not evidence, that’s… solipsistic arithmetic!”

  “It’s the Lens!” Lena insisted. “It’s valid!”

  “It’s a self-congratulatory illusion,” Kael spat. “Objection one: *No information arrived*. Think! Did you *learn* something new about the world just now? Did a datacrystal decrypt? Did a witness walk in? No! You always knew you existed. You always knew you’d be sitting here, wondering about this audit, regardless of whether the Bureau scanned ten districts or ten thousand! Your existence was a *fixed point*. It cannot *move* the probability needle because it was *always* part of the background condition! Applying your Lens is like saying the fact you breathe air is evidence the Citadel has an atmosphere – it tells you *nothing* new!”

  “But the *ratio*…”

  “Is meaningless in this context!” Kael cut her off. “Which brings me to objection two: your *category* is flawed. ‘Observers like you’? Are those dormant instances in the vaults ‘observers like you’? Are they observing *anything*? They’re frozen patterns, Lena! Data ghosts! They possess the *potential* for observation, maybe, if woken, but right now? They are inert. Including them in your count of ‘observers’ alongside living, breathing, *thinking* people like us is like counting unlit lamps as sources of light! The Living Lens, if it applies at all, should only count *currently conscious* entities. That’s just us 2.4 million. And guess what? Under *both* scenarios, there are exactly 2.4 million conscious observers right now! So your Lens gives *no distinction at all*! It’s dead! The Continuity Principle is our only tool, and by Continuity, the evidence of the *specifics* – the fragmented logs, the distribution patterns, the tech limitations during quarantine – all point firmly towards Lean!”

  Lena felt her certainty waver under the force of his logic. The warmth of her revelation cooled. The humming of the archives seemed louder, more mocking. Kael’s arguments *felt* solid, grounded. The dormant instances… were they truly observers? Or just potential? And had she really learned anything new by contemplating her own existence? The 77% suddenly felt fragile, a castle built on philosophical sand.

  She looked down at her own open file on the table, brought up for reference. District of Origin: Inner Ring, Sector 5. A safe, documented beginning. But her fingers unconsciously brushed the faint, almost invisible scar along her hairline – a childhood fall, patched with crude biogel in a makeshift clinic. Scanners often missed such minor imperfections. Her eyes snagged on the address listed for her biological parents: *Inner Ring, Sector 5, Quadrant Gamma*. Standard, unremarkable.

  A cold knot formed in her stomach. Quadrant Gamma was pristine, rebuilt *after* the quarantine. Her parents… they’d always been vague about the early years. They’d moved *in* from… somewhere. A memory surfaced, sharp and unexpected: her mother’s voice, strained, years ago, whispering arguments about "District 12" and "owing them silence," quickly hushed when Lena entered the room. District 12. Deep in the Outer Ring. A plague hotspot during the quarantine.

  If Deep was true… if scans *had* happened during the quarantine… then her dormant instance *might* exist. And it would have been scanned *where*? Her file said Inner Ring, Sector 5. But if her parents had fled District 12 early in the quarantine, before scans supposedly began under Lean… then her true origin would be buried. Her instance *should* be from the Outer Ring, a fact erased, hidden. Only if scans happened *later*, deep into the quarantine when her family was already settled in the Inner Ring (as her file claimed), would the record be accurate.

  The Deep View wasn't just an abstract probability to her anymore. If Deep was true, and the Bureau scanned the Outer Districts during the quarantine, then her dormant self, her frozen echo, was stored under the wrong district. An Outer Ring ghost trapped in an Inner Ring file. Proof of her family’s flight, their buried past. Proof *she* wasn't truly from the privileged core. If Lean was true, the Outer Districts were never scanned, her origin story remained intact, and her instance (if it existed at all) was correctly tagged Inner Ring. Safe. Clean.

  The 77% probability wasn't just an intellectual triumph anymore. It was a key to her own hidden history – a history potentially marked by plague-flight and bureaucratic lies. The Living Lens, flawed or not, pointed towards that truth. Kael’s Continuity Principle, solid as it felt, would bury it.

  She looked at Kael, still fuming, utterly convinced by his objections. He saw only numbers and principles. She saw… herself. Her hidden self.

  Lena picked up the heavy, ceremonial verification stylus. Its tip glowed faintly blue, ready to imprint her biometric signature on the final audit declaration. She looked at the two boxes: [ ] LEAN ESTIMATE CONFIRMED. [ ] DEEP ESTIMATE CONFIRMED.

  Her gaze lingered on the scar on her hand, a faint white line the scanners had also missed. A tiny flaw, easily overlooked. Like an origin story.

  Without a word, without looking at Kael, Lena Vanya pressed the stylus firmly onto the synth-parchment beside the Deep Estimate box. The blue light flared, then settled, etching her signature indelibly into the record. She placed the stylus down with a soft click that echoed in the silent chamber, the humming of the archives the only sound as she stared at the confirmed truth she’d chosen.
