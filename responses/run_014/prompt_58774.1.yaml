  First, they're clearly intelligent - they've already identified nuanced differences between their behaviors (e.g., shipping broken code vs visa constraints). But they want a practical, single-rule framework to judge future actions. The British English request suggests they might be UK-based, possibly working in a high-pressure tech environment with sprint deadlines.

  Hmm... their examples reveal interesting tensions:
  - Shipping broken code feels like a cop-out (bad faith)
  - Visa/mortgage constraints feel genuine (not bad faith)
  - Avoiding mentoring feels like an excuse
  - Blaming CV screeners feels "less rotten" than shipping bad code

  The Slack example is particularly telling - it's about constant availability culture in tech. They're sensing the bad faith in "I have to" when they actually choose to prioritize work over boundaries.

  For a single rule, I need to focus on Sartre's core: the denial of choice. But must acknowledge that some constraints (visas) have heavier consequences than others (missing Slack messages). 

  The mentoring example is tricky - claiming "I'm not a mentor person" is classic bad faith (denying freedom to develop those skills). But if I include this in the rule, it might overturn their initial take where they correctly identified it as cop-out. That's acceptable philosophical consistency though.

  For the Slack case: keeping it on 24/7 would be bad faith only if they deny they're choosing career priorities over wellbeing. The rule should expose that hidden choice.

  Must avoid academic jargon. Practical test: "Could I choose differently if I accepted the consequences?" If yes, then claiming "I must" is bad faith. Visa constraints pass this test (consequences too severe), Slack fails (consequences are manageable).

  Ah - and I should explicitly call out which of their initial judgments would be overturned. The CV screener example: blaming external factors when they could improve their CV is still bad faith, even if "less rotten". That's the one their intuition might resist, but philosophically it fits.
answer: |-
  Right then, let's crack this open Sartre-style, keeping it grounded for a dev. Quick brainstorm first:

  1.  **Sartre's Core:** Radical freedom = You're *always* choosing, even inaction is a choice. Bad faith = Lying to yourself to dodge the agony of that freedom & responsibility. You pretend you *have* to do X or *can't* do Y because of circumstances, genetics, roles, etc.
  2.  **Your Cases Analysed:**
      *   **Broken Code:** You *chose* prioritising deadline over quality/ethics. Calling it "the sprint made me" is bad faith. (Agreed = Cop-out)
      *   **High-Paying Job:** The consequences of leaving (losing visa/home) are brutally real. *Choosing* to stay to avoid these consequences is a genuine exercise of freedom *within* severe constraints. Not denying the choice, just weighing it. (Agreed = Not Cop-out)
      *   **Not a Mentor Person:** Claiming an immutable identity ("I *am* not X") to avoid the effort/risk of *choosing* to try mentoring (or *choosing* not to, but owning that). Classic bad faith. (Agreed = Cop-out)
      *   **Blaming CV Screener:** Shifting responsibility entirely externally ("*They* didn't see my value"). You *could* choose to seek feedback, improve CV, network etc., but claiming powerlessness is dodging your part. Less rotten than code? Maybe, but still dodging. (Your take: Excuse/Less Rotten. Sartre likely says: Cop-out).

  **The Single Rule (British English Pragmatism Edition):**

  > **"If I catch myself saying 'I *have* to...' or 'I *can't*...', I must ask: What painful consequence am I *choosing* to avoid by framing it this way? Own that choice, or it's bad faith."**

  **Applying it to Slack-on-Phone 24/7:**

  *   "I *have* to keep Slack on my phone 24/7 because my team plans everything there."
  *   **Rule Test:** Is it truly *impossible* to turn it off? Could you:
      *   Set specific 'offline' hours/days and communicate them?
      *   Delegate or agree on a backup for true emergencies?
      *   Negotiate core hours where you *are* expected to be responsive?
      *   Accept the *risk/consequence* of missing a non-critical message?
  *   **Verdict:** Framing it as "I *have* to" is likely **bad faith**. You're *choosing* to prioritise immediate responsiveness/avoiding potential friction with the team/avoiding perceived career risk over your own boundaries, mental space, or personal time. You *could* choose differently, but the potential consequences (missed info, annoyed colleagues, maybe slower promotion) feel painful, so you pretend it's unavoidable. Own the choice: "I *choose* to be constantly available on Slack to minimise work friction and career risk, even though it costs me downtime."

  **What Your Takes This Rule Overturns (For Simplicity/Sartrean Consistency):**

  1.  **Blaming the CV Screener:** The rule forces you to overturn your sense that this is "less rotten" or just "an excuse". According to the rule, it's firmly **bad faith** (a cop-out). You're denying your freedom to influence the outcome (improving CV, targeting roles better, networking, following up) by pretending the *entire* responsibility lies with the screener. You're *choosing* not to take those actions, likely to avoid the effort, potential rejection, or confronting flaws in your application. Own *that* choice or change it. (This is the price of keeping the rule simple and true to Sartre's core – denying freedom = bad faith).

  **Why This Rule Works for Your Cases:**

  *   **Broken Code:** You *chose* avoiding sprint consequence over code quality. Bad faith was pretending the sprint *made* you.
  *   **High-Paying Job:** You *own* the choice: "I choose to stay *because* the consequence of losing visa/home is unacceptable." No denial of freedom, just a heavy choice.
  *   **Not a Mentor Person:** You *choose* avoiding the effort/awkwardness of mentoring. Bad faith is pretending you *can't* due to fixed identity.
  *   **Slack:** You *choose* constant availability. Bad faith is pretending you *have* to.

  **The Takeaway:**

  Sartre isn't saying constraints aren't real (mortgages, visas, sprint pressures *are*). He's saying you always retain the terrifying freedom to *choose how you respond* to them, even if the options are awful. Bad faith is inventing stories ("I *have* to", "I *am* not", "*They* made me") to hide that you're making a choice – usually to avoid anxiety, effort, or owning an unpopular decision. The rule forces you to expose that hidden choice. Use it as a gut-check when you feel that twinge of making an excuse. It won't make the choices easier, but it'll make you more honest with yourself.
