prompt: |-
  i'm writing my master's thesis on cultural transmission in orcas and my supervisor is... opinionated about the units of selection question. before I hand her my framing I'm trying to predict what she'll say. her record over the years, as best I can collect it: on ordinary stuff like a giraffe's neck she says gene's-eye talk is just bookkeeping and the individual organism is the level selection actually sees; on sterile termite workers she insists it's kin selection, which she calls gene-level in the end, and gets annoyed if you call it group selection; on meiotic drive and on imprinted genes where the paternal copy pushes fetal growth harder than the maternal copy likes she's adamant that genes can be selected against the interest of the whole organism, so gene-level selection is real and not shorthand; and when I once brought up clonal selection in the immune system she said that's selection alright but not natural selection proper, since nothing gets passed through a germline.

  so the new case, which is basically my thesis: orca pods where a foraging technique -- deliberately beaching to grab sea lion pups, and investing real teaching time in calves, which cuts into the adults' own hunting -- spreads culturally and pods that have the tradition do better than pods that don't. is that natural selection at the level of the cultural variant, or the pod, or is she forced to say genes for social learning are the real unit and the cultural spread is development? predict her verdict, tell me which rule she seems to be running, which other rules fit her record just as well, and what further case would best pull those rules apart. I care because if she rules it "not natural selection proper" my whole framing is dead in the water.
reasoning: |-
  Okay, the user is working on their master's thesis about cultural transmission in orcas and needs to predict how their supervisor will react to their framing. The supervisor has strong opinions on the units of selection, and the user's thesis hinges on whether the cultural transmission in orcas is seen as natural selection at the level of the cultural variant or pod. If the supervisor deems it "not natural selection proper," their framing is invalid.

  First, I need to parse the supervisor's past positions. Let me list out her stances:

  1. **Giraffe's neck**: She considers gene-level talk as bookkeeping; the organism is the unit.
  2. **Sterile termite workers**: Kin selection, which she sees as gene-level, and rejects group selection.
  3. **Meiotic drive and genomic imprinting**: Genes can be selected against the organism's interest, so gene-level selection is real.
  4. **Clonal selection in immune system**: Selection occurs but isn't natural selection because no germline transmission.

  Now, the orca case: Cultural transmission of foraging techniques (beaching, teaching calves). Pods with this tradition do better. Is this selection on the cultural variant, the pod, or just genes for social learning?

  Key elements in the orca scenario:
  - **Cultural variant**: The foraging technique spreads via learning, not genetics.
  - **Teaching investment**: Adults spend time teaching, reducing their own hunting. This is a cost, so there's a trade-off.
  - **Pod-level benefit**: Pods with the tradition have higher fitness.

  The supervisor's likely verdict: She'll argue it's not natural selection proper because the cultural variants aren't passed through the germline. Similar to her immune system example—selection happens, but without germline inheritance, it's not natural selection. She might see the cultural spread as developmental, with the real selection on genes enabling social learning.

  Rules she follows:
  1. **Germline inheritance is essential** for natural selection. Traits must be passed genetically.
  2. **Gene-level selection** is valid when conflicts exist (like meiotic drive), but otherwise, organisms are the primary unit unless genes conflict.
  3. **Kin selection** is gene-centered, not group selection.
  4. **Developmental processes** (like cultural transmission) don't count as units of selection; the underlying genes do.

  Alternative rules that might fit her record:
  - **Replicator vs. Vehicle**: She might align with Dawkins, where genes are replicators, and organisms/vehicles are selected based on gene transmission. Cultural variants aren't replicators without germline inheritance.
  - **Inheritance System Requirement**: Natural selection requires a system of inheritance that's stable and germline-based. Cultural traits, being non-genetic, don't qualify.

  To pull the rules apart, test cases:
  1. **Primate tool use with group extinction**: If groups without a tool tradition die out, is that group selection? She'd likely say no, emphasizing genes for learning instead.
  2. **Horizontal gene transfer in bacteria**: Genes transferred horizontally affecting survival. Since it's genetic but not vertical, she might accept it as natural selection if genes enter the germline eventually.
  3. **Endosymbiosis (e.g., mitochondria)**: Initially, symbionts aren't genetic, but become heritable. Early stages might not count, but later do once genetically fixed. This challenges the germline strictness.

  For the user's concerns: Their framing as cultural group selection might be rejected. To salvage, they could:
  - Emphasize gene-culture coevolution: Genes for social learning are selected because they enable beneficial traditions.
  - Avoid claiming the cultural variant itself is a unit of selection. Frame it as the mechanism by which genetic selection operates.
  - Use terms like "cultural evolution" without equating it to natural selection proper.

  The user's deeper need is to frame their thesis in a way their supervisor accepts, ensuring it's not dismissed. They need to align with her emphasis on germline inheritance and gene-centric views, even if cultural transmission is the focus. Highlighting the genetic underpinnings and fitness benefits at the pod level through traditional kin selection arguments might be safer.
answer: |-
  Based on your supervisor's track record, I predict her verdict on your orca case will be: **"Not natural selection proper" at the level of the cultural variant or pod.** She will argue this is **gene-level selection for social learning capacity**, with cultural transmission being a developmental mechanism. Your framing of "selection on the cultural variant" or "pod-level selection" is likely dead in the water unless you reframe it strategically.

  ### Why She'll Say This: Her Core Rules
  1. **Germline Inheritance is Non-Negotiable**:  
     Her rejection of immune clonal selection ("nothing passed through germline") is the *closest parallel* to your case. Cultural variants (beaching technique) aren't genetically inherited—they're learned. For her, natural selection requires **replicator transmission via germline**. Cultural traits fail this test.  

  2. **Gene-Centrism with Exceptions**:  
     - She accepts gene-level selection *only* when genes visibly conflict with organismal fitness (meiotic drive, imprinting).  
     - In cooperative cases (termites), she defaults to kin selection = "gene's-eye view" (genes for altruism spreading via relatives).  
     - Your orcas show *no intra-pod genetic conflict*—adults sacrifice for kin calves. She'll see this as classic kin selection favoring genes for teaching/social learning, not selection on pods or culture.  

  3. **Units Must Be "Visible" to Selection**:  
     She treats organisms as units for giraffes because selection "sees" phenotypes. Pods are ephemeral; cultural variants aren't "replicators" like genes. Social learning is just a phenotype enabling genetic fitness.  

  4. **Group Selection is a Red Flag**:  
     Her termite reaction shows she equates "group selection" with sloppy thinking. Pod-level benefits will be dismissed as a byproduct of kin-selected genes.  

  ### Prediction Breakdown:
  - **Cultural Variant?** "Not a replicator. It's developmental noise—no germline transmission."  
  - **Pod?** "Not a unit. Pod fitness differences arise from shared genes + kin selection. The 'tradition' is just a phenotype."  
  - **Real Unit?** "Genes for social learning, teaching propensity, or brain plasticity. Spread because pods *with these genes* out-reproduce others."  

  ### Alternative Rules That *Also* Fit Her Record:
  Her logic aligns with **Dawkins-style gene-centrism** but with a **strict germline requirement**. However, alternative frameworks could explain her positions:  
  - **"Replicator vs. Vehicle"**: She sees genes as the only replicators; organisms/pods are vehicles. Cultural traits aren't replicators.  
  - **"Inheritance System Fidelity"**: Natural selection requires high-fidelity inheritance (genes). Cultural transmission is too error-prone/labile.  
  - **"Conflict as the Litmus Test"**: Gene-level selection is real only when genes conflict with higher levels (e.g., meiotic drive). No conflict? Default to organism/kin.  

  ### Test Case to Split These Rules:  
  **Horizontal Gene Transfer (HGT) in Bacteria.**  
  - *Scenario:* A plasmid conferring antibiotic resistance spreads through *horizontal* transfer (not vertical). Groups with the plasmid outcompete others.  
  - *Why it splits her rules:*  
    - **If she insists "not natural selection"** (no *vertical* germline transmission), she prioritizes **germline purity**.  
    - **If she accepts it as gene-level selection**, she prioritizes **replicator spread** regardless of transmission mechanism.  
    - *Your orcas vs. HGT:* Both lack vertical inheritance. If she rejects HGT too, her rule is "germline-only." If she accepts HGT but not orcas, she's inconsistently applied.  

  ### Strategic Reframing to Save Your Thesis:  
  Since she’ll likely kill "cultural group selection," pivot to:  
  1. **Gene-Culture Coevolution**:  
     "Genes for social learning are selected *because* they enable adaptive cultural traditions. Pod traditions are the *environment* shaping genetic fitness." (This mirrors her kin selection view.)  
  2. **Phenotypic Plasticity**:  
     Frame teaching as a plastic phenotype under genetic control. Pod success reflects genetic adaptation to local ecology via behavior.  
  3. **Avoid "Units of Selection"**:  
     Focus on: "Cultural transmission *mediates* fitness differences between pods with vs. without genes for social learning."  

  **Key Phrase for Her Buy-in:**  
  "Kin-selected genetic predispositions for cultural transmission, where teaching effort is a reproductive strategy enhancing inclusive fitness."  

  This matches her termite stance and dodges "group selection." If you preemptively reframe thus, your thesis survives—without conceding the science, just her terminology. Test the HGT case on her first to confirm her germline rigidity!
