  The moral parity argument suggests that soldiers on both sides should be treated equally when following orders in combat, regardless of the war's justice. The user mentioned this idea but is unsure how far it applies. The strongest counterargument might be that the enemy's side fought an unjust war, but since the soldier was a conscript, that weakens individual culpability. 

  The prosecution side likely views the act as murder because it resulted in their soldier's death. But under IHL, killing in combat isn't murder unless it violates laws of war. Since there's no evidence of atrocity, prosecuting might violate the principle of combatant immunity. 

  The conscript aspect is crucial. Conscripts have less choice, making prosecution seem even more unjust. Also, reciprocity is important: if they prosecute an enemy for this, their own soldiers could face similar treatment. This could lead to cycles of retribution.

  The user needs a balanced recommendation. The opinion should clearly recommend against prosecution, explaining the legal basis under IHL and the moral implications of parity. It must address the emotional desire for accountability while showing why it's misplaced here. 

