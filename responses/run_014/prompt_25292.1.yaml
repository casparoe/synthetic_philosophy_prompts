prompt: |-
  I've been going down a rabbit hole on anthropic reasoning for a piece I'm working on, and I'm stuck on something that's probably obvious to people in the field. So the self-indication assumption says we should reason as if we're randomly sampled from all possible observers, weighted by how likely they are to exist. And the self-sampling assumption says we should reason as if we're randomly sampled from actual observers in our reference class. Now here's what I don't get: if SIA is right, then the presumptuous philosopher seems totally correct. Like, if Theory A and Theory B make all the same empirical predictions about what we'll observe, but Theory A says the universe contains a trillion observers and Theory B says it contains a billion, then under SIA Theory A is a thousand times more likely. The philosopher who believes Theory A isn't being "presumptuous" — they're just doing straightforward Bayesian updating. So why is this thought experiment treated as a devasting objection to SIA? What am I missing?
