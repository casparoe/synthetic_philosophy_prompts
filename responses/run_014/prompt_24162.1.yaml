prompt: |-
  I've landed on the position that evolutionary psychology is a real science, not a genre of just-so stories in the Kipling sense, and I'd like a map of what would count against it. My working view: the core program -- that a lot of the mind is a suite of domain-specific modules shaped by natural selection in the ancestral environment -- is doing exactly the kind of historical-functional explanation that makes evolutionary biology science, and the standard just-so objection (post-hoc, unfalsifiable, any story can be spun) is a generic attack that would sink paleontology and phylogenetics too, so it doesn't land. What would have to be true for me to be wrong? I want the defeaters sorted from fatal to merely awkward, and I'd be helped if you separated (a) evidence that would count against the modular-architecture claims specifically, (b) evidence that would count against the ancestral-environment reconstruction method, and (c) things that would only embarrass particular famous hypotheses without touching the program. I also want to know which of these a committed evolutionary psychologist would themselves concede as counting against them versus wave away as bad examples, and whether the program has a signature prediction that rival accounts -- say, general-purpose-learning-mechanism views or cultural-evolution accounts -- genuinely don't make, or whether its testability is mostly negative (it's just the absence of a better alternative). One more thing: I suspect part of the defense is definitional, i.e. "any hypothesis that could in principle be tested counts, and we just have to wait for the tests." Is the position insulated that way, and if so, is that a problem for it, or is that just what historical sciences are like? What I'd personally find most persuasive is a case where the program made a risky, dated, specific prediction and got it wrong in a way a rival account got right -- or, failing that, a clear statement of how much of the "science" label is load-bearing versus how much is already on the table from the fact that selection is a real cause.
reasoning: |-
  Okay, the user has a solid grasp of evolutionary psychology (EP) and is looking for potential defeaters to their position that it's a legitimate science. They want a structured breakdown of what could challenge the field, sorted by severity and category. 

  First, I need to acknowledge their core argument: that EP's historical-functional approach is no different from established fields like paleontology, so the "just-so story" critique is unfair. They're right about that equivalence—historical sciences do face unique challenges in testability. 

  The user's request is highly systematic. They want three categories of counterevidence: (A) against modularity claims, (B) against ancestral environment reconstructions, and (C) against specific hypotheses without dooming the whole program. They're also asking about EP's testability compared to rival theories and whether its scientific status relies too heavily on definitional shielding ("in principle testable"). 

  Hmm, the trickiest part is their last point: they want a concrete example where EP made a unique, falsifiable prediction that failed while rivals succeeded. That's tough because EP rarely makes such isolated predictions—its hypotheses are usually embedded in broader frameworks. The best I can think of is the Savannah Hypothesis debacle, where EP-adjacent claims about innate landscape preferences were undermined by cross-cultural data, while cultural theories explained the variance better. 

  For the modularity debate, the strongest counterevidence would be neural reuse/plasticity data showing domain-general mechanisms achieving "modular-like" outcomes through development. EP defenders might dismiss this by redefining modules as functional rather than structural, but that risks unfalsifiability. 

  On ancestral reconstructions, the killer would be proof that key human traits emerged too recently for Pleistocene selection—like if complex theory of mind was shown to be Neolithic. EP would likely counter that cultural evolution can't work without cognitive adaptations, but it'd weaken their selectionist narratives. 

  The user seems sophisticated enough to handle nuances like: EP's reliance on reverse engineering creates circularity risks, and its "in principle testable" shield is valid but must be held to the same standards as, say, astrophysics—no special pleading. 

  I should emphasize that EP isn't pseudoscience; it's a high-risk/high-reward program facing legit methodological growing pains. Its strongest asset is still the "no alternatives" argument for complex adaptations, but that's getting pressure from niche construction theory. 

  ...Time to structure this into fatal/awkward categories with clear concessions from EP advocates. The Savannah example goes in [C] as embarrassing but not fatal, while evidence of recent trait origins would be a major [B]-category problem. For [A], modularity's fatal flaw would be proven domain-general mechanisms for putatively modular tasks—like if AI trained only on general data spontaneously developed cheater-detection. That'd hurt.
answer: |-
  You've nailed the core defense of evolutionary psychology (EP) against the "just-so story" charge. The critique *is* often applied inconsistently, ignoring that *all* historical sciences (paleontology, cosmology, phylogenetics) infer past causes from present evidence and face challenges of testability. However, EP faces unique hurdles. Here's a structured breakdown of potential defeaters, categorized as you requested:

  **Fatal Defeaters (Would Fundamentally Undermine the Core Program)**

  1.  **Proof of Massively Domain-General Architecture (Against A - Modularity):**
      *   **What:** Strong evidence that the human mind/brain operates primarily via *a few* extremely flexible, content-independent learning mechanisms (powerful associative learning, Bayesian inference engines, general problem-solving) capable of generating *all* observed complex, domain-specific behaviors *without* requiring innate, domain-specific modules shaped by selection.
      *   **Evidence Needed:** Computational models demonstrating how general mechanisms *reliably and efficiently* produce complex, adaptive behaviors (e.g., language acquisition, cheater detection, complex kinship inferences, intuitive physics/biology) across diverse cultures *without* innate constraints or domain-specific structure. Neuroimaging showing no consistent, specialized neural circuitry for proposed modules across individuals/cultures, just diffuse activation patterns consistent with general processing.
      *   **EP Concession?** Most would concede this would be fatal. EP's core thesis is *specifically* that domain-general mechanisms are insufficient to explain the speed, efficiency, universality, and specificity of many human cognitive adaptations. They'd argue existing general-learning models fail this test spectacularly for complex social cognition.
      *   **Rival Prediction:** This *is* the signature rival prediction (General-Purpose Learning accounts). EP's core signature prediction is the *existence* of such specialized functional structure.

  2.  **Demonstration that Key Human Traits Evolved Too Recently for Pleistocene Selection (Against B - Ancestral Environment Method):**
      *   **What:** Conclusive evidence that fundamental aspects of human cognition (e.g., complex language, advanced theory of mind, sophisticated cooperation beyond kin, symbolic thought) emerged *after* the dispersal from Africa and major diversification of modern human populations (i.e., within the last 50-100k years, too rapidly for significant selection pressures to shape complex neural modules).
      *   **Evidence Needed:** Archaeological/paleoanthropological data showing unambiguous signs of these complex cognitive traits only appearing very recently. Genetic evidence showing no significant selection signals on relevant neural genes during the Pleistocene. Models showing cultural evolution alone can produce these traits on such short timescales without prior cognitive adaptations.
      *   **EP Concession?** Many would concede this is a serious challenge. EP heavily relies on the Pleistocene (EEA) as the crucible. Some might retreat to "older foundations were selected then, elaborated later," but if the *complex functional specificity* is demonstrably recent, it weakens the selectionist narrative for that module. They'd likely argue cultural evolution *requires* underlying cognitive adaptations.
      *   **Rival Prediction:** Cultural evolution accounts predict rapid emergence of complex traits via cultural accumulation without requiring slow genetic adaptation for each specific cognitive component.

  3.  **Proof that Natural Selection is Ineffectual on Complex Neural/Cognitive Traits:**
      *   **What:** Strong evidence that the genetic architecture of the brain is so constrained (e.g., by pleiotropy, developmental constraints, lack of genetic variation) or the mapping from genes to complex cognition is so indirect that natural selection *cannot* shape domain-specific cognitive modules with any reliability, even over long timescales.
      *   **Evidence Needed:** Evolutionary developmental biology (Evo-Devo) models demonstrating inherent limitations on selecting for complex cognitive specializations. Evidence that variation in complex cognitive traits shows little heritability or is uncorrelated with fitness. Proof that "modules" are purely emergent developmental byproducts of general growth rules, not direct targets of selection.
      *   **EP Concession?** Fatal if proven. EP is fundamentally an application of selectionist thinking to the mind. They'd likely counter that selection demonstrably shaped complex organs (eye, liver), so why not the brain? And that behavioral genetics shows significant heritability for many traits relevant to fitness.

  **Serious/Awkward Defeaters (Would Severely Constrain or Radically Reshape the Program)**

  4.  **Overwhelming Evidence for Massive Neural Reuse/Plasticity (Against A - Modularity):**
      *   **What:** Consistent findings that brain regions are highly multifunctional ("neural reuse"), recruited for diverse tasks based on computational properties, not domain-specific content. Evidence that early experience can radically rewire proposed "modules."
      *   **Evidence Needed:** Neuroimaging showing the same regions active across wildly different proposed modules (e.g., fusiform face area also active in expert bird watchers for birds). Studies showing individuals deprived of key inputs (e.g., congenital blindness) repurpose "visual" areas for complex non-visual tasks successfully. Lack of double dissociations for many proposed modules.
      *   **EP Concession?** Many would acknowledge this as a challenge, prompting redefinition. The response is often to shift to "functional modularity" (modules as descriptions of information processing, not fixed neural structures) or "developmental modules." Critics argue this risks making "module" unfalsifiable. It forces EP towards less localized, more developmentally plastic conceptions of specialization.

  5.  **Systematic Failure of Key EEA Reconstructions (Against B - Ancestral Method):**
      *   **What:** Accumulating evidence that the proposed adaptive problems central to many EP hypotheses (e.g., specific hunting strategies, pervasive warfare, specific mating patterns, pathogen prevalence) were highly variable, insignificant, or simply incorrect for the actual EEA of *Homo sapiens*.
      *   **Evidence Needed:** Archaeological, paleoclimatic, and genetic data consistently contradicting specific EEA assumptions underpinning multiple prominent hypotheses (e.g., evidence for low warfare prevalence, diverse mating systems, different dietary emphases). Demonstrating that proposed selection pressures weren't stable or intense enough.
      *   **EP Concession?** They'd concede specific reconstructions can be wrong, but argue the *method* of using best-available evidence is sound. They might argue for a "statistical" EEA or shift focus to more fundamental, less variable problems (e.g., social exchange, kin recognition). It weakens the specificity of explanations but not the core logic.

  6.  **Dominance of Niche Construction / Gene-Culture Coevolution:**
      *   **What:** Evidence that human cognitive evolution is primarily driven by cultural innovation altering selection pressures (niche construction), leading to rapid coevolution where genetic changes *follow* and stabilize cultural traits, rather than genetic adaptations *preceding* and enabling complex culture.
      *   **Evidence Needed:** Models showing cultural evolution outpacing and directing genetic evolution for key traits. Evidence of strong recent selection on genes clearly linked to culturally novel practices (e.g., dairy farming -> lactase persistence, but for cognitive traits). Difficulty finding Pleistocene genetic signatures for traits heavily dependent on modern culture.
      *   **EP Concession?** Most accept gene-culture coevolution *now*, but argue Pleistocene modules provided the *foundation* for complex culture. Evidence that cultural evolution *initiated* major cognitive shifts without prior specific genetic adaptation would be awkward. EP would argue niche construction itself requires cognitive adaptations.

  **Merely Embarrassing (Against C - Specific Hypotheses)**

  7.  **Failed Famous Hypotheses:**
      *   **Examples:** The Savannah Hypothesis (innate preference for park-like landscapes debunked by cross-cultural variation). Extreme Sexual Strategies Theory predictions (e.g., universal massive sex differences in mate preferences) contradicted by cross-cultural data showing smaller effects or reversals. Specific modules (e.g., "cheater detection module" shown to be part of broader reasoning or context-dependent).
      *   **Impact:** Embarrasses specific proponents and hypotheses, fuels "just-so" critiques. Shows the difficulty of reverse engineering. EP defenders argue this is normal science: bad hypotheses get falsified. Rivals (cultural psych, social learning accounts) often explain the variance better here.

  **On Testability, Signature Predictions, and the "Science" Label**

  *   **Signature Predictions:** EP's strongest signature prediction is **domain-specificity in cognitive performance or neural processing** for evolutionarily relevant tasks (e.g., Wason selection task performance improving when framed as detecting cheaters vs. abstract logic). Finding such specificity where general-learning models predict none is a win. Another is **early emergence without explicit instruction** (e.g., infants showing precursors of theory of mind). Rivals (especially general-learning) struggle to explain the *pattern* of specificity and early emergence without invoking *some* innate constraints, though not necessarily massive modularity.
  *   **Negative Testability ("No Better Alternative"):** EP often relies on this, arguing that complex, universal, functional traits *must* be adaptations unless proven otherwise. This is contentious. Critics argue it privileges adaptationist explanations and underestimates non-selective forces (drift, exaptation, constraints) and cultural learning. However, EP counters that *identifying* complex functional design *is* the hallmark of adaptation in biology.
  *   **"In Principle Testable" Defense:** Yes, EP is insulated this way, and it **is** largely what historical sciences are like. Paleontology infers dinosaur behavior from bones "in principle." The problem isn't the principle, but the *practice*:
      *   **Epistemological Risk:** Reverse engineering behavior/psychology to ancestral function is inherently riskier than reconstructing phylogenies from fossils/DNA or stellar evolution from light. Behavior leaves no direct fossils, and cognition is even more elusive. The chain of inference is longer and more tenuous.
      *   **Circularity Danger:** There's a greater risk of circularity: inferring the adaptive problem from the behavior, then explaining the behavior by the problem. Good EP avoids this by *independent* evidence for the adaptive problem (e.g., paleoecology, comparative primatology) and by making novel predictions *from* the hypothesized module.
      *   **Burden of Proof:** The defense places the burden on critics to wait for future tests. Critics argue the burden is on EP to provide stronger, less post-hoc tests *now*. The field's reputation suffers when weak studies dominate.
  *   **The "Science" Label:** The "science" label isn't *solely* load-bearing because selection is a real cause. Selection *is* real, and minds *are* products of evolution. The core scientific claim is the **specific mechanistic implementation via complex, domain-specific, naturally selected cognitive adaptations (modules) shaped in the Pleistocene EEA.** *That* is the load-bearing hypothesis distinguishing EP from broader claims that "evolution shaped the mind." The science lies in empirically testing *that specific claim* about cognitive architecture and its origins, not just the fact of evolution.

  **Your Most Persuasive Case: The Savannah Hypothesis (Embarrassing but Illustrative)**

  *   **EP (Adjacent) Prediction:** Based on ideas about the EEA (African savannah), humans should have an innate, universal preference for landscapes with open vistas, water, and scattered trees (like a savannah park), as this environment was optimal for survival. This preference should be evident in choices, art, and even reduced stress in such environments.
  *   **Rival Account (Cultural/Learning):** Landscape preferences are learned through experience and shaped by cultural meaning (e.g., mountains as spiritual, deserts as barren, forests as sheltering or foreboding). Preferences should show significant cultural variation.
  *   **What Happened:** Cross-cultural research found significant variation. While some elements (openness, water) often had positive valence, preferences for specific features (density of trees, type of terrain, presence of mountains) varied greatly. People showed strong preferences for landscapes familiar to them or iconic in their culture (e.g., English rolling hills, Japanese mountain vistas, desert peoples appreciating deserts). The "universal savannah preference" was largely debunked; cultural and experiential factors dominated.
  *   **Why it's Persuasive (for Critics):** It was a seemingly clear, testable, evolutionary prediction based on EEA reconstruction. It failed empirically in a way a rival (cultural learning) account readily explained. It highlighted the danger of assuming universality based on a specific EEA narrative and underestimating cultural/developmental plasticity.
  *   **EP Response:** Defenders argue this was never a core EP hypothesis (more human ethology/environmental psychology), or that the underlying preference is for "prospect and refuge" (which has some support) misapplied to savannah. It shows how *specific* EEA narratives can be wrong, but doesn't touch the core logic of modular adaptations for things like avoiding predators, finding resources, or navigating *within* a known environment.

  **Conclusion:**

  Your position that EP's core logic is scientifically valid (akin to other historical sciences) is defensible. The fatal flaws would involve fundamental disproofs of modularity or the relevance of Pleistocene selection for core cognition. The major "awkward" challenges are neural reuse/redefining modularity, refining EEA reconstructions, and incorporating gene-culture coevolution more thoroughly. While specific hypotheses fail embarrassingly, the program persists because rivals struggle to explain the *pattern* of human cognitive universals, early emergence, and domain-specific efficiencies *without* invoking *some* kind of evolved functional specialization. The "in principle testable" defense is necessary but insufficient; the field's scientific credibility hinges on progressively generating stronger, less post-hoc, predictive tests and integrating evidence from neuroscience, development, and cross-cultural psychology more rigorously. It's a high-risk, high-reward program grappling with the immense difficulty of its subject matter.
