  ### Rules & Materials  
  - **Materials:**  
    - Two envelopes.  
    - Token cards with values: 1, 2, 4, 8 (6 sets of pairs: (1,2), (2,4), (4,8)).  
    - A six-sided die (or RNG) for the banker.  
    - Board to record: Observed amount (X), switch decision, outcome, and whether switching would have helped.  
  - **Banker’s Role:**  
    - **Knows:** Pairs are always (1,2), (2,4), or (4,8), each chosen with **equal probability (1/3)**. The smaller amount (A) is 1, 2, or 4.  
    - **Does:**  
      1. Rolls die: 1–2 → (1,2), 3–4 → (2,4), 5–6 → (4,8).  
      2. Places amounts in envelopes and shuffles.  
      3. Records the pair secretly (e.g., "Pair B" for (2,4)) but **never reveals it to students**.  
  - **Player’s Turn:**  
    1. Pick one envelope; open it to see X (e.g., "I see 4 tokens").  
    2. Decide: Switch or Keep.  
    3. Reveal both amounts. Player earns the tokens in their final envelope.  
    4. Record on board:  
       - X (observed value),  
       - Decision (Switch/Keep),  
       - Outcome (tokens earned),  
       - "Switch Benefit": + (if switching gained), – (if switching lost), 0 (if same).  
  - **Token Economy:**  
    - 1 token = 0.1 participation point (capped at 20 tokens = 2 points).  
    - Emphasize: Goal is learning, not maximizing tokens.  

  ### Timeline (75 min)  
  1. **Intro (5 min):** Explain rules, token system, and recording. Stress: "Record every X and whether switching helped."  
  2. **Game (40 min, ~24 rounds):**  
     - Each of 24 students plays one round.  
     - Banker: Roll die, fill envelopes, shuffle, hand to student.  
     - Student: Open, decide, reveal both, record data.  
     - **Critical:** Track on board a table:  
       | X | # Times Switched | # Times Switch Beneficial | Total Occurrences |  
       (e.g., after 24 rounds, expect ~6 occurrences of X=4).  
  3. **Data Analysis (10 min):**  
     - Calculate for each X:  
       - **Proportion of times switching was beneficial** (e.g., for X=4: Switch Beneficial / Total Occurrences).  
     - Compute **empirical expected gain if switched**: (Avg. tokens when switched) – X.  
  4. **Debrief (20 min):**  
     - **Threshold Discovery:**  
       - Students see: Switching always helps at X=1, helps ~50% at X=2 and X=4, but *always hurts at X=8*.  
       - Conclude: Switch if X < 8; keep if X=8.  
     - **Map to Paradox:**  
       - **Symmetry Problem:** "You assumed for any X, the other envelope is equally likely to be 2X or X/2. But when X=8, 2X=16 isn’t possible. The *boundary* breaks symmetry." (Point to X=8 data.)  
       - **Prior Smuggled In:** "The 1.25X calculation assumes all amounts are equally likely. But our prior—uniform over (1,2), (2,4), (4,8)—makes X=8 *always* the max. You can’t ignore the prior!" (Show banker’s die rolls.)  
     - **Generalize:** In unbounded cases, no uniform prior exists, making 1.25X incoherent.  

  ### Predictable Issues & Bounded Pot Limitations  
  - **First-Time Failures:**  
    - **Data Skew:** Too few X=8 draws (expected: 3–4 in 24 rounds). If missing, use pre-generated data (e.g., "Suppose we ran 100 rounds: X=8 occurred 16 times; switching always lost").  
    - **Misrecording:** Students confuse "Switch Benefit" (e.g., mark "+" when switching from 4 to 2). Fix: Banker verifies each entry.  
    - **Overgeneralization:** Students switch indiscriminately after seeing 1.25X gains mid-game. Let them lose at X=8 later to correct.  
  - **Bounded Pot Limitation:**  
    - **Cannot reproduce the infinite uniform prior** that makes the paradox seem inescapable. In this game, the prior is explicit and finite, so students see boundary effects. You must emphasize: "Real paradox assumes no max/min, but no such prior exists mathematically."  

  ### Why It Works  
  - Students generate the 1.25X expectation organically (e.g., "When I saw 2, switching gave me 1 or 4—average 2.5!").  
  - They bet on it, then watch it fail catastrophically at X=8.  
  - The threshold (X<8) emerges from their data, not lecture.
