answer: |-
  Here's your verdict in two sentences: **No, the tradition isn't fake. It's a genuine community ritual that *became* meaningful, regardless of its invented origin story.**

  The reasoning:
  1.  **Function Over Origin:** Traditions gain authenticity through repeated performance and shared meaning, not just age. For 30+ years, this walk *has* genuinely connected generations, symbolized transition, and fostered community pride. That lived experience is real.
  2.  **Invented Traditions Are Common:** Many powerful traditions (like modern Christmas customs or national ceremonies) were intentionally created or reshaped relatively recently. Their value comes from the purpose and connection they foster *now*.
  3.  **The "Why" Matters:** The 1897 story was fabricated *to preserve the practice itself* because people felt it was valuable. The 1991 act started something people wanted to keep. The meaning developed *after* the origin.
  4.  **Knowing Changes Perception, Not Necessarily Value:** Yes, knowing the origin shifts your personal feeling from "ancient ritual" to "successful modern invention." But the emotional weight it holds for your grandma, mom, and town, built on decades of participation, isn't diminished. The *current* meaning and bonds are authentic.

