prompt: |-
  I cover science and ideas, but I'm stuck on a tiny newroom dispute and I think I'm overthinking it. We have a style rule that says when a politician announces a policy, we should write "the mayor said she will raise the minimum wage," not "the mayor will raise it." A new reporter wrote the latter after a press conference because the mayor's office confirmed it and no one is denying it. I told them we have to keep the "said" because the rule is about attribution. They say the rule is really about not turning claims into facts, and in this case it's already a fact. I can't point to a fact that settles it except our past usage, and they can always say they meant the rule a little differently. Is there a principled way to decide who's right, or is this just two people inventing a rule after the fact?
reasoning: |-
  Okay, the user is dealing with a newsroom style dispute. Let me break down the problem. The reporter wrote "the mayor will raise the minimum wage" without attribution, arguing that since the mayor's office confirmed it and no one is denying, it's a fact. The editor insists on keeping "said" based on a style rule about attribution. 

  First, I need to understand the core issue. The style rule's intent is crucial. Is it solely about attribution, or is it about distinguishing claims from facts? The editor thinks it's the former, the reporter the latter. The user needs a principled way to resolve this beyond just past usage.

  Looking at journalism principles, attribution isn't just for unverified claims. Even for factual statements, attributing to a source maintains transparency. Readers should know the information comes from the mayor's statement, not the newsroom's independent verification. That's a key point. Even if true, the event here is the announcement, not the policy change itself. 

  The reporter's argument mistakes the nature of the fact. The fact is that the mayor announced the policy, not that the policy will happen. Implementation depends on many factors. By omitting "said," the statement becomes the outlet's assertion, which they can't guarantee. 

  Also, consistency matters. If exceptions are made whenever something seems confirmed, it opens the door to subjective judgments. Sticking to "said" avoids slippery slopes. The AP Stylebook likely supports this, emphasizing attribution for promises or future actions. 

  The user might be overcomplicating by focusing on the rule's wording. The underlying principle of transparency and accountability in journalism should guide the decision. The editor's stance aligns with best practices, even if the reporter sees the rule differently. Explaining these principles clearly could help the reporter understand it's not about doubt but about proper sourcing.
answer: |-
  This is a classic newsroom tension, and you're right to be thoughtful about it. While it feels like a tiny stylistic dispute, it actually touches on core principles of journalistic integrity. **The principled answer leans strongly in your favor: the "said" (or equivalent attribution) should remain.** Here's why:

  1.  **The Core Principle is Attribution, Not Just Verification:**
      *   The rule isn't *only* about distinguishing claims from verified facts (though that's part of it). Its primary function is **transparency about sourcing.** Readers deserve to know *where* the information came from. Did the reporter witness the policy being enacted? Did they see the signed legislation? Or did they hear the politician *say* they would do it?
      *   Omitting "said" implies the statement originates from the *news organization itself* as an established fact about the future. Attribution makes it clear the statement originates from the *source*.

  2.  **Future Actions are Inherently Uncertain:**
      *   A politician's announcement is a *promise* or an *intention*, not an immutable fact about the future. Countless things can intervene between announcement and implementation: legal challenges, legislative hurdles, budget constraints, changing circumstances, or even the politician changing their mind.
      *   **The verifiable fact *at the time of reporting* is:** "*The Mayor **said** she will raise the minimum wage.*" or "*The Mayor **announced plans** to raise the minimum wage.*" The future wage increase itself is *not* a present fact; it's a projection based on a statement.

  3.  **Confirmation Doesn't Eliminate the Need for Sourcing:**
      *   The Mayor's office confirming the announcement doesn't magically turn the future action into a fact established by the *news organization*. It simply confirms that the Mayor *did indeed make that statement/intention known*. The sourcing is still the Mayor/her office.
      *   Saying "the Mayor *said*" accurately reflects what the newsroom *knows for certain*: the statement was made. It doesn't cast doubt on its truthfulness; it accurately describes the nature of the information.

  4.  **Precedent and Consistency Matter:**
      *   Your past usage isn't just arbitrary; it reflects an established practice based on the principles above. Deviating now creates inconsistency and sets a dangerous precedent. If you drop "said" here because it seems confirmed, where do you draw the line next time? What level of confirmation is enough? This introduces subjectivity and potential bias.

  5.  **Avoiding the Slippery Slope:**
      *   The reporter's interpretation ("it's already a fact") opens the door to problematic judgment calls. Is a campaign promise a "fact" if the candidate repeats it often? Is a policy announced in a press release but not yet debated "fact"? Consistently attributing statements removes this ambiguity and potential for error or perceived bias.

  **Addressing the Reporter's Point:**

  *   **"The rule is really about not turning claims into facts":** They are partially correct, but incomplete. Attribution *is* the primary mechanism for achieving that distinction. Keeping "said" inherently prevents turning the *claim* (the future action) into a *statement of fact by the news organization*. The claim remains sourced to the politician.
  *   **"It's already a fact":** The *intention* stated by the Mayor is a fact (she stated it). The *future occurrence* of the wage increase is *not* yet a fact. Journalists report on verifiable current realities (statements, events, data), not future certainties.

  **The Principled Resolution:**

  1.  **Reaffirm the Core Principle:** Explain that the rule's primary purpose is **transparent sourcing and accurately reflecting the nature of the information** (a statement of future intent, not an accomplished fact). Attribution protects the paper's neutrality and allows readers to assess the source.
  2.  **Highlight the Nature of Future Actions:** Emphasize that journalistic practice treats future promises/intentions differently from accomplished events, *even when confidently stated and not disputed*. The sourcing remains crucial.
  3.  **Clarify the "Fact":** Agree that it's a fact *that the Mayor made the statement and intends to do this*. That's precisely why "The Mayor **said**..." is the accurate, factual reporting of that event.
  4.  **Offer Alternatives (While Keeping Attribution):** You could soften it slightly while maintaining the principle:
      *   "The Mayor **said** she will raise the minimum wage." (Clear, direct)
      *   "The Mayor **announced** she will raise the minimum wage." (Focuses on the action of announcing, still implies her statement)
      *   "The Mayor **pledged/vowed/promised** to raise the minimum wage." (Stronger verbs highlighting the nature of the statement, still sourced to her).
      *   "**Following the Mayor's announcement,** the minimum wage will be raised..." (Still anchors the future action explicitly to her statement).

  **Conclusion:**

  This isn't just two people inventing a rule after the fact. Your stance is grounded in fundamental journalistic principles of accuracy, transparency, and sourcing. The reporter's interpretation, while understandable in this specific instance where the statement is uncontested, risks eroding those principles by blurring the line between a sourced statement and a news organization's assertion of future fact. **Stick with the attribution.** It's the principled, consistent, and safest approach for maintaining credibility and avoiding potential pitfalls down the road. Explain the *why* behind the rule clearly, focusing on sourcing and the inherent uncertainty of future actions, not just doubt.
