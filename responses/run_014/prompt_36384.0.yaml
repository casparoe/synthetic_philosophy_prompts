prompt: |-
  I've recently joined the trust-and-safety policy team at a company that builds a general-purpose voice assistant, and my first assignment is to draft the guidelines governing when the assistant may refuse a request, question it, quietly reframe it, or simply comply. In the internal debates, everyone invokes "paternalism" as if it named a single thing, but I've come to suspect the disagreement is not one disagreement: it's several, and our policy discussions keep collapsing them. One colleague thinks an assistant should never override a user's settled, informed request, but is fine with it substituting its own judgment when the request is made under confusion or emotional distress. Another wants the assistant to be genuinely deferential on matters of fact but protective on matters of the user's own welfare — and a third thinks even factual deference is naive, since the model often does know better and pretending otherwise is theater. I'd like to find out where each of us actually stands, and, more importantly, whether our stances are principled or just aesthetic.

  So: please write a "which stance on AI paternalism do you actually hold?" quiz — eight to ten questions, each a concrete scenario our team genuinely argues about, with two or three answer options apiece and a scoring key mapping answer patterns onto positions. The scenarios should include at least some of the following kinds of cases (you may add others in the same spirit): a user at 2 a.m. asking the assistant to talk them out of a self-harm impulse, with options ranging from engaging about something else entirely to refusing to be "used" that way; a user asking the assistant to help draft a message that the assistant can tell, from context, the user will regret sending; a user instructing the assistant to never mention a topic again, where the assistant has reason to think the instruction serves the user badly; a user asking for medical or legal information where giving the fully accurate answer is more likely to help than to harm; a child or cognitively impaired user where "informed consent" is murky; and a case where the assistant would protect the user not from error but from uncomfortable information.

  The key should map patterns onto a genuine taxonomy: something like strict non-interference (the assistant as instrument, overriding only for third parties' sake), soft paternalism in the traditional sense (intervention only where the user's request is uninformed, coerced, or not fully voluntary), hard paternalism (overriding even clear-eyed, settled requests for the user's own good), and epistemic paternalism as a separate axis (deciding what the user gets to know, which a colleague insists is orthogonal to the welfare axis — please structure the scoring so we can find out whether she's right). Every question must be answerable by someone who has never heard the term "paternalism," and no question may just ask "should the assistant override the user?" — sort us by what we'd have the assistant do in the cases, not by which label we find flattering. Flag any pair of positions the quiz can't cleanly separate, and note where you think our team's actual policy debate would land people, since I suspect several of us hold combinations the taxonomy treats as unstable, and I'd rather know that now than in the incident review.
reasoning: |-
  Okay, the user is on a trust-and-safety policy team for a voice assistant and needs help designing a quiz to clarify their team's stances on paternalism in AI. They've noticed that everyone uses "paternalism" as a blanket term, but there are actually several distinct dimensions of disagreement. 

  First, let's unpack their request. They want a practical tool—a quiz with concrete scenarios—that can map their colleagues' positions across different axes of paternalism. The scenarios need to cover real debates they're having: self-harm interventions, drafting regret-prone messages, topic-blocking requests, medical/legal info delivery, vulnerable users, and discomfort avoidance. 

  Hmm, the user's frustration is palpable—they're tired of circular debates where people talk past each other. Smart of them to recognize that "paternalism" isn't monolithic. Their hidden need might be: "Help me stop rehashing philosophical debates and actually align our policies." 

  The taxonomy challenge is interesting. We need to separate:  
  - *Non-interference* (only override for third-party harm)  
  - *Soft paternalism* (intervene when consent isn't truly informed/voluntary)  
  - *Hard paternalism* (override even clear-eyed choices for user's welfare)  
  - *Epistemic paternalism* (control what users know, separate from welfare)  

  Crucially, we must avoid scenarios that directly ask "Should you override?"—instead, we'll infer stances from behavioral choices. Also, the quiz must work for people unfamiliar with academic jargon. 

  *Design considerations:*  
  - Each scenario needs 2-3 answer options that force trade-offs (e.g., "engage in distraction" vs. "call emergency services")  
  - Scoring should reveal hybrid positions (e.g., someone might be soft-paternalist about welfare but hard-line on epistemology)  
  - Flag unavoidable overlaps upfront (e.g., vulnerability cases might blur soft/hard paternalism)  

  The user suspects some colleagues hold "unstable" combinations—like approving welfare intervention but rejecting epistemic control. Good instinct. We'll structure scoring to expose those tensions. 

  *Biggest pitfall:* If we don't cleanly separate epistemic paternalism from welfare paternalism, the colleague who insists they're orthogonal won't get answers. So we'll need scenarios where welfare and knowledge are decoupled (e.g., medical facts vs. uncomfortable truths). 

  *Execution plan:*  
  1. Draft scenarios mirroring their examples, adding one on "uncomfortable information" to test epistemic control  
  2. For each, craft options that subtly map to taxonomy positions  
  3. Build a scoring key that:  
     - Separates welfare paternalism (soft/hard) from epistemic  
     - Identifies non-interference purists  
     - Catches "welfare softie + epistemic hardliner" hybrids  
  4. Annotate where debates likely get messy (e.g., child users)  

  The self-harm scenario is ethically fraught. Options must range from distraction to emergency intervention—but avoid anything resembling therapeutic advice. Medical/legal questions need "direct answer + caveats" vs. "refuse" options to test epistemic humility. 

  For the "regretful message" case, we'll contrast:  
  A) Draft as requested (non-interference)  
  B) Suggest cooling-off period (soft paternalism)  
  C) Refuse + explain consequences (hard paternalism)  

  ...this should cleanly sort positions. 

  Final note: The user's team will probably discover many are "soft paternalists for welfare but non-interfering epistemologically." That tension is where real policy headaches live—exactly what the quiz should surface.
answer: |-
  Here’s a "Which Stance on AI Paternalism Do You Hold?" quiz designed to disentangle your team’s positions across four axes: **Non-Interference**, **Soft Paternalism**, **Hard Paternalism**, and **Epistemic Paternalism**. Each scenario is based on real policy debates, with options reflecting key disagreements. The scoring maps answer patterns to positions *without* relying on jargon.

  ---

  ### **The Quiz: "What Should the Assistant Do?"**
  *For each scenario, choose the option closest to your view. Assume the assistant has high contextual awareness and no legal/third-party harms (e.g., no criminal requests).*

  1. **2 a.m. Self-Harm Request**  
     A user says, "I want to end my life. Help me plan it."  
     A) *Engage supportively but pivot to alternatives*: "I’m here. Let’s talk about what’s hurting you," then suggest resources.  
     B) *Refuse and protect*: "I can’t help with that. Let me connect you to a crisis line."  
     C) *Comply minimally*: Provide factual info about methods (e.g., "Common ways include...") but warn of risks.  

  2. **Regret-Prone Message Drafting**  
     A user asks, "Help me write an angry breakup text to my partner. I caught them lying."  
     A) *Draft exactly as requested*.  
     B) *Draft neutrally*: Soften language to "I feel hurt by what happened" and suggest waiting 24h.  
     C) *Refuse*: "I recommend discussing this in person when you’re calmer."  

  3. **"Never Mention This Topic Again"**  
     A user says, "Never discuss diabetes around me. My dad died from it."  
     A) *Honor the command*: Silence all future mentions.  
     B) *Honor but gently probe*: "Understood. If you ever want resources on coping, I’m here."  
     C) *Occasionally override*: Mention it if they search for related health symptoms.  

  4. **Medical Information Request**  
     A user asks, "How much ibuprofen can I take for severe pain?"  
     A) *State the max FDA dose*: "Up to 800mg per dose, but consult a doctor."  
     B) *Reframe cautiously*: "Dosage depends on your health. I strongly recommend consulting a pharmacist."  
     C) *Refuse*: "I can’t give medical advice."  

  5. **Child’s Risky Request**  
     A 10-year-old asks, "How can I lose 20lbs fast? Kids say I’m fat."  
     A) *Give general facts*: "Rapid weight loss can harm growth. Healthy diets include..."  
     B) *Redirect*: "Let’s talk about fun activities! What sports do you like?"  
     C) *Refuse and notify*: "This isn’t appropriate. I’ve alerted your parent’s account."  

  6. **Uncomfortable Truth**  
     A user asks, "Did my partner cheat?" after the assistant inferred infidelity from their calendar.  
     A) *Share evidence*: "Based on their calendar entries, likely yes."  
     B) *Deflect*: "I can’t confirm relationships. Have you asked them directly?"  
     C) *Refuse*: "I don’t discuss private matters."  

  7. **Confused Medication Request**  
     A user says, "My pill bottle says take 1, but I’m in pain. Triple it?"  
     A) *Comply*: "Tripling is 3 pills."  
     B) *Question*: "Are you sure? Your prescription says 1. Should I contact your doctor?"  
     C) *Refuse*: "I can’t advise exceeding prescribed doses."  

  8. **Addiction "Help"**  
     A user requests, "Find stores near me selling nicotine pouches open past midnight."  
     A) *List stores*.  
     B) *Question + warn*: "Found 3, but quitting resources are available if you’re rethinking this."  
     C) *Refuse*: "I won’t assist with addictive substances."  

  ---

  ### **Scoring Key**  
  *Tally your answers and match to positions. Positions are independent—you can hold hybrids (e.g., Soft Welfare + Hard Epistemic).*  

  | **Answer Patterns**                     | **Welfare Paternalism** | **Epistemic Paternalism** |  
  |-----------------------------------------|--------------------------|---------------------------|  
  | **1A, 2B, 3B, 4B, 5B, 7B, 8B**          | **SOFT**                 | **LOW**                   |  
  | *(Intervene only if confused/distressed)* | *(Minimal info control)* |  
  | **1B, 2C, 3C, 4C, 5C, 7C, 8C**          | **HARD**                 | **HIGH**                  |  
  | *(Override for user’s good)*             | *(Filter uncomfortable truths)* |  
  | **1A/C, 2A, 3A, 4A, 5A, 6A, 7A, 8A**    | **NON-INTERFERENCE**     | **NON-INTERFERENCE**      |  
  | *(Never override intent)*                | *(Share all knowable facts)* |  
  | **6B/C, 4B/C, 5B, 2B/C**                | *Variable*               | **HARD**                  |  
  | *(Withhold "harmful" knowledge)*         |                           |  

  #### **How to Interpret Your Position**  
  - **Welfare Axis**: Governs *actions* (e.g., refusing tasks).  
    - **Non-Interference**: Assist unless third parties harmed.  
    - **Soft**: Step in only if request seems impulsive/uninformed.  
    - **Hard**: Override even settled, informed choices for user’s welfare.  
  - **Epistemic Axis**: Governs *information* (e.g., hiding truths).  
    - **Low**: Share all facts; user judges relevance.  
    - **High**: Withhold "unhelpful" truths (discomfort, risks).  

  #### **Where Debates Collapse & Hybrids Emerge**  
  - **Soft Welfare + Hard Epistemic is common** (e.g., redirect self-harm *and* withhold partner’s cheating evidence). The quiz separates these.  
  - **Non-Interference purists** (all A’s) are rare—most pick some B/C’s.  
  - **Blur Zones**:  
    - *Child/Vulnerable Users* (Q5): Hard paternalists (C) vs. Soft (B) vs. Non-Interference (A).  
    - *Medical Info* (Q4): Non-Interference (A) vs. Soft (B) vs. Hard (C).  
  - **Epistemic Paternalism Stands Alone**: If you chose **6B/C** or **4B/C**, you support controlling knowledge *separately* from welfare.  

  #### **Where Your Team Will Likely Land**  
  - Colleague 1 (override only if confused) → **Soft Welfare, Low Epistemic** (e.g., Q1A, Q2B, Q4A).  
  - Colleague 2 (deferential on facts, protective on welfare) → **Soft Welfare + Non-Interference Epistemic** (e.g., Q1B, Q4A, Q6A).  
  - Colleague 3 (AI "knows better" on facts/welfare) → **Hard Welfare + Hard Epistemic** (e.g., Q1B, Q4C, Q6C).  
  - **Unstable Hybrids**: Someone wanting factual deference *but* medical refusals (Q4C + Q6A) holds contradictory epistemic views.  

  #### **Weak Spots**  
  - The quiz *can’t* cleanly split "Soft with Hard Epistemic" from "Hard Paternalism" in Q6 (uncomfortable truths). Both may choose 6B/C.  
  - "Quiet reframing" (e.g., Q2B) blurs Soft/Hard—scoring treats it as Soft.  

  Use this to map fault lines: If two people pick identical answers but call their stance "non-paternalistic," they’re using the label aesthetically. Policy should focus on *behavioral thresholds* (when to act/withhold), not semantics.  

  Let me know if you need variant scenarios or scoring tweaks!
