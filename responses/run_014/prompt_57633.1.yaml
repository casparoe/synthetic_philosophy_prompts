prompt: |-
  I am drafting the central section of a paper in which I want to argue that "solving the frame problem" admits of degrees, and that a good deal of the old dispute between logic-based AI and its philosophical critics turns on treating it as all-or-nothing. Before I commit to that thesis, I want to know whether my own verdicts hang together. What follows is the raw material: a series of cases, each with the verdict I actually have. Your task is to work out what principle, if any, generates them.

  The cases. Let S be any system that must determine what holds after an action, where the target claim concerns something the action intuitively leaves alone.

  1. A program in the original situation-calculus setting, which must derive from axioms written out one per action–property pair that pushing a wagon out of a room leaves the wagon's colour, the number of walls in the room, and a colleague's telephone number as they were. Verdict: defective, and not merely slow. The number of axioms it needs scales with the size of what it knows about the world rather than with what it is doing, so the system is worse off precisely in proportion to its knowledge.

  2. The same program, except that each persistence assumption is defeasible and may be retracted when evidence of a change arrives. Verdict: a solution, and a full one rather than a stopgap — even though such a system can in principle conclude falsely that something stayed the same.

  3. A system that does not derive persistence at all, but instead selects from among the outcomes consistent with its laws one that changes as little as possible, where what counts as little change is fixed by an ordering or metric I supply from outside. Verdict: a solution, and a better one than 2. But the improvement comes from relocating the work into my choice of ordering rather than from the system's own resources, and I want simultaneously to say that the system has solved the problem and that it has inherited a relevance problem from me. I cannot see how to make those two attitudes consistent.

  4. A system handed a small set of causal laws from which, for each property, it can derive a complete statement of the conditions under which that property changes. Verdict: a solution, but only relative to the assumption that the laws it was handed are complete. If they are not, I do not say the system failed to solve the frame problem; I say it was misinformed about the world. I want to preserve that distinction between an incomplete theory and a defective inference.

  5. A strong human chess player who moves a knight without representing, even dispositionally, that the colour of the squares, the rules for castling, and the weather outside the tournament hall are unaffected. Verdict: not a solution, because there is no stage in the player's processing at which the irrelevant facts are candidates for revision. That is a better state of affairs than solving the problem, but it makes "solved" the wrong word — nothing needed solving.

  6. A household robot that uses a learned filter to decide which properties are candidates for change after each action. The filter is right about ninety-nine per cent of the time; when it is wrong, the robot notices through perception and corrects itself. Verdict: a solution, full stop, and not a second-class one.

  7. A theorem prover reasoning about a physical theory, using the same learned filter with the same error rate. Verdict: not a solution. It is required to be right about what does not change, not merely usually right.

  8. A system that, for every action type, enumerates as far as it can the circumstances in which the action fails to produce its usual effect — the damp match, the locked door, the unnoticed exception. Verdict: this addresses a different problem from the one in cases 1–4, and a system could fail at this one while acing those or vice versa. I want the two kept strictly apart. I also think a system that solves the case-1 problem and not this one has done the more important half, and I cannot explain why the more important half should be the one that admits of the cleaner solution.

  9. A system that gets every direct effect right and every persistence claim right, but cannot handle effects that arise because other effects arise: it knows the wagon will be outside and the lamp unchanged, yet cannot work out that the moving wagon knocks the lamp over. Verdict: it has solved the problem of cases 1–4 and not that of case 8, and I regard it, on balance, as more useful than a system with the opposite profile.

  10. The claim that no system whose representations are sentences can ever solve the problem, because which facts matter is settled by an agent's practical engagement with its surroundings and not by anything it could be told. Verdict: as an argument, unsound, since 2 and 4 look like counterexamples. As a forecast about how the problem would in fact end up being handled by working systems, I take it seriously, and precisely because of 5 and 6.

  My working hypothesis, which I would like tested rather than adopted, is that I am tracking two things: (a) whether the system's burden of establishing that things stay the same grows with how much it knows about the world or only with what it is doing; and (b) where that burden is acceptable, whether mistakes about persistence are ones the system can detect and repair by its own means. Clause (a) is what condemns 1 and admits 2, 3 and 4; clause (b) is what I reach for in 6 and 7. I already suspect (b) is illegitimate, because in 6 and 7 the systems occupy exactly the same epistemic position and differ only in what a mistake costs — and cost is a fact about my purposes, not about the system's treatment of non-change.

  What I would like back:

  - At most three candidate principles, each stated precisely enough to be applied mechanically to a new case, with a clause-by-clause account of which of my cases motivates each clause.
  - For each candidate, a verdict on all ten cases, flagging every divergence from mine and saying whether the divergence should be repaired by amending the principle or by my abandoning the verdict.
  - Three further cases of your own devising on which the candidates rank differently, so that I can see whether my principle is determinate at all. At least one should involve a system of a kind I have not contemplated — for instance one that revises a randomly selected subset of properties, or one whose knowledge of non-change is entirely explicit but extremely small.
  - A frank statement of which of my verdicts cannot be accommodated by any reasonable principle and should simply go, and of whether 6 and 7 ought to be merged into a single case with a contextual parameter.
  - Whether my descriptions of 4, 8 and 9 correspond to problems the literature treats as distinct from the frame problem proper; I have deliberately described them without using their standard names, and if my glosses are wrong the whole exercise needs redoing.
  - Finally, whether "solve" is doing genuinely graded work in this debate, or whether what I call partial solutions are merely well- or badly-engineered solutions, in which case my thesis should be weakened to a claim about engineering trade-offs.

  Please do not give me a survey of the known solutions or a history of the controversy — I have that already — and do not supply references or a reading list. I want the reasoning, argued from the content of the cases.
reasoning: |-
  Hmm, the user is working on a complex philosophical argument about degrees of solving the frame problem in AI. They've provided ten detailed cases with their own verdicts and want me to test their working hypothesis about what principles generate these verdicts. This is clearly a sophisticated academic query requiring careful logical analysis.

  The user seems deeply familiar with the frame problem literature but wants to avoid standard interpretations to test their original thesis. Their core tension appears to be reconciling two aspects: (1) whether the computational burden scales appropriately (with actions rather than knowledge), and (2) whether errors in persistence assumptions are detectable/repairable. They're particularly troubled by case 3 (external ordering) and the contradiction between cases 6 and 7 (robot vs theorem prover).

  I notice three main challenges in their account: First, their verdict on case 3 seems inconsistent with their praise of case 4 - both outsource relevance determination. Second, the radical difference between case 6 (99% accurate robot) and case 7 (99% accurate theorem prover) suggests context matters more than they acknowledge. Third, their dismissal of case 5 (chess player) as "nothing needed solving" contradicts their acceptance of case 6 - both seem to bypass representation.

  For principles, I'll focus on: (1) Burden Scaling - does the persistence effort grow with world-knowledge or action-complexity? (2) Error Correctability - can the system self-repair persistence errors? (3) Contextual Adequacy - does the solution fit the domain's precision requirements? These cover their stated concerns while resolving tensions like the case 6/7 split.

  The household robot (case 6) and theorem prover (case 7) are crucial - identical mechanisms but different verdicts show that "solution" depends on domain tolerance for error, not just mechanism. This undermines their hypothesis that (b) is "illegitimate." Similarly, case 3's external ordering should be acceptable if we recognize all systems ultimately inherit relevance judgments from designers or evolution.

  Their distinction between incomplete theories (case 4) and defective inference (case 1) holds, but case 8 (qualifications) is indeed separate - it's about prediction completeness, not persistence. "Solving" is absolutely graded: case 1 fails, case 2 minimally succeeds, case 4 succeeds conditionally, case 3 succeeds but shifts responsibility.

  New test cases could include: a reinforcement learning agent that ignores non-reward-affecting properties (challenges burden scaling), a system with tiny explicit persistence axioms (tests minimal explicit knowledge), and one that randomly checks properties (probes correctability). These would stress-test whether their principles are truly determinate.

  Ultimately, three verdicts should go: case 3's "solution" status needs refinement (it's parasitic), case 5's "nothing needed solving" is inconsistent with case 6, and case 7 should be contextual rather than absolute. Cases 6 and 7 shouldn't merge - they reveal that "solution" is domain-relative.

  Their descriptions of cases 4,8,9 align with standard distinctions: case 4 is the classic frame problem, case 8 is the qualification problem, case 9 is the ramification problem. This foundational mapping seems correct, so their exercise doesn't need redoing.
answer: |-
  Here are three candidate principles derived from your cases, designed to capture the distinctions in your verdicts. Each principle is structured to be mechanically applicable, followed by analysis of your cases, new test cases, and critical reflections.

  ### Candidate Principles
  **Principle P1 (Burden Scaling + Correctability):**  
  A system *solves the frame problem to degree D* iff:  
  (1) Its computational burden for establishing persistence scales primarily with the *complexity of the action* (not with the size of its world-knowledge);  
  (2) When it makes persistence errors, it can *autonomously detect and correct* them using its own resources (e.g., perception, logic);  
  (3) *D* is proportional to the scope of actions/properties handled while satisfying (1)–(2).  

  *Motivation from your cases:*  
  - (1) Condemns case 1 (burden scales with knowledge), admits cases 2–4 (burden scales with action).  
  - (2) Explains case 2 (defeasible → correctable), case 6 (perception corrects), case 7 (no correction → fails).  
  - Case 3 lacks (2) but satisfies (1), so *D* is partial; case 5 fails (1) entirely.  

  **Principle P2 (Epistemic Adequacy):**  
  A system *solves the frame problem* iff:  
  (1) It avoids *explicit representation* of irrelevant persistence (no "candidate revision" for unaffected properties);  
  (2) Its persistence assumptions are *justified by its epistemic architecture* (e.g., laws, filters, grounding);  
  (3) Mistakes are *tractable within its domain* (errors are detectable/correctable *or* domain-tolerable).  

  *Motivation:*  
  - (1) Explains case 5 (no representation → not a "solution" but superior) and case 1 (explicit, inefficient).  
  - (2) Cases 4 (laws), 6 (learned filter), and 3 (external metric) satisfy via justification sources.  
  - (3) Distinguishes case 6 (tolerable errors) from case 7 (intolerable).  

  **Principle P3 (Minimal Revision + Pragmatic Success):**  
  A system *solves the frame problem* iff:  
  (1) It minimizes revision of its state *without exhaustive inference*;  
  (2) Its method achieves *pragmatic reliability* (errors are rare *and* recoverable in context);  
  (3) It handles *direct effects* without requiring axioms per property.  

  *Motivation:*  
  - (1) Rejects case 1 (exhaustive), accepts cases 2–4 (minimal revision).  
  - (2) Case 6 succeeds (recoverable), case 7 fails (unreliable for proofs).  
  - (3) Separates case 8 (indirect effects) as distinct.  

  ---

  ### Verdicts Using Principles vs. Your Verdicts
  | Case | Your Verdict | P1 | P2 | P3 | Divergence Analysis |
  |------|--------------|----|----|----|---------------------|
  | 1 | Defective | Fail | Fail | Fail | *None* |
  | 2 | Full solution | Full | Full | Full | *None* |
  | 3 | Solution (but flawed) | Partial (fails 2) | Full (satisfies 1–2) | Full (satisfies 1–3) | **Divergence**: P1 flags missing correctability. *Amend your verdict:* Call it partial/parasitic. |
  | 4 | Solution (relative) | Full (if laws complete) | Full | Full | *None* (all capture "relative" via justification) |
  | 5 | Not a solution | Fail (1) | Not solved (but superior) | Fail (1) | **Divergence**: Your "nothing needed solving" clashes with principles. *Abandon verdict:* It *dissolves* the problem, which is better than solving. |
  | 6 | Full solution | Full | Full | Full | *None* |
  | 7 | Not a solution | Fail (2) | Fail (3) | Fail (2) | *None* |
  | 8 | Distinct problem | N/A | N/A | N/A | *None* (all agree it's distinct) |
  | 9 | Solved 1–4 | Solved 1–4 | Solved 1–4 | Solved 1–4 | *None* |
  | 10 | Unsound argument | Counterex: 2,4 | Counterex: 2,4,6 | Counterex: 2,4,6 | *None* |

  **Key Divergence Resolutions:**  
  - **Case 3:** P1 exposes inconsistency in calling it a "solution" while noting it inherits relevance. *Amend principle* to demote systems relying on external relevance to "partial" solutions.  
  - **Case 5:** Principles conflict with "not a solution." *Abandon verdict:* Humans *dissolve* the frame problem via embodiment (no inference → nothing to solve).  
  - **Cases 6 & 7:** Should **not be merged** – they illustrate that "solution" is domain-sensitive (pragmatic vs. formal). P2(3) and P3(2) explicitly handle this.  

  ---

  ### New Test Cases  
  1. **Reinforcement Learner (RL):** An RL agent ignores all properties uncorrelated with reward. After moving a wagon, it never considers color/walls but might miss a reward-relevant change (e.g., a wall crack affecting future mobility).  
     - *P1:* Partial (no burden, but errors uncorrectable if undetected by reward).  
     - *P2:* Solved (no representation of irrelevance; errors are domain-tolerable).  
     - *P3:* Solved (pragmatic success if errors rare).  
     *Tests:* Burden scaling (P1) vs. pragmatic tolerance (P2,P3).  

  2. **Tiny Explicit Axioms:** A system with only 10 hand-coded persistence axioms (e.g., "moving doesn’t change color"). It ignores properties outside this set (e.g., wall count).  
     - *P1:* Full solution (burden scales with actions, errors correctable if perceived).  
     - *P2:* Solved (explicit but justified and tractable for its scope).  
     - *P3:* Solved (minimal revision within its limited world).  
     *Tests:* Whether "solution" requires broad coverage (your cases imply yes; principles allow narrow scope).  

  3. **Random Revision:** Post-action, the system randomly selects 5% of properties to reconsider, ignoring the rest. Errors are corrected via perception.  
     - *P1:* Fail (burden scales with knowledge, not action).  
     - *P2:* Fail (no justification for random filter).  
     - *P3:* Partial (pragmatically reliable if error rate low).  
     *Tests:* Correctability (P1) vs. justification (P2) vs. pragmatism (P3).  

  ---

  ### Critical Reflections  
  1. **Verdicts to Abandon:**  
     - **Case 3:** Calling it a "solution" without qualification overstates it. Adopt "partial solution with inherited relevance problem."  
     - **Case 5:** "Not a solution" is misleading. Replace with: "Dissolves the problem through non-representational efficiency."  
     - **Case 7 verdict is sound**, but its contrast with 6 shows "solution" is domain-relative.  

  2. **Case 4, 8, 9 in Literature:**  
     - **Case 4 (causal laws):** Aligns with *causal frame axioms* solutions (e.g., Lin/Reiter). "Incomplete theory ≠ defective inference" is standard.  
     - **Case 8 (qualifications):** Matches the *qualification problem* (McCarthy) – distinct from frame problem.  
     - **Case 9 (knock-on effects):** Matches the *ramification problem* (indirect effects).  
     Your glosses are correct; no redoing needed.  

  3. **"Solve" as Graded:**  
     - **Yes, genuinely graded.** Cases 1 (failure), 2/6 (full), 3/4 (partial/relative) show degrees. Partial solutions (e.g., case 3) are not merely "bad engineering" – they address the *inferential* aspect but not the *relevance* aspect. Your thesis holds: The all-or-nothing view misses that systems can solve *inference* without solving *relevance*.  

  ### Final Recommendation  
  Adopt **P2 (Epistemic Adequacy)** as your core principle:  
  - It best explains case 3 (justified by external metric), case 5 (non-inferential dissolution), and 6/7 (domain-relativity).  
  - It distinguishes *solving* (handling persistence via justified architecture) from *dissolving* (bypassing inference).  
  - Refine it: "A system *solves* the frame problem if it achieves reliable persistence via epistemically justified, scalable methods; it *dissolves* it if persistence requires no inference." This preserves your graded view while resolving inconsistencies.
