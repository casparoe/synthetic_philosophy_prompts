          b) Explicit training required.
    7. User test (if deemed necessary): run up to two 90-minute sessions. If successful, no training; else, training.
    8. In any step, if there is ambiguity or a close call, the team makes a values-based decision (trade-off between training burden and risk) and the medical director signs off.

