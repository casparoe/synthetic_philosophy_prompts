  We are addressing Molyneux's problem in a practical, procedural way for a company building sensory substitution/restoration devices.
   The key is to determine whether a skill in one sensory modality (e.g., touch) will automatically transfer to a new modality (e.g., vision) without explicit training.

   The procedure must consider:
    1. The three collapsed questions: discrimination, naming, and action.
    2. The type of property being perceived (amodal vs. modality-specific).
    3. The concept of calibration (the need for the new sense to be "taught" what the signals correspond to).

   Steps:

   We are designing a checklist procedure for a design review. The goal is to decide: 
     - Do we assume transfer (no explicit training needed) OR 
     - Do we build explicit training?

   The procedure should be run by clinicians and engineers in a one-hour review. We can do up to two 90-minute user sessions if needed.

   The procedure must include:
     - Ordered questions with clear criteria for sufficient answers.
     - Stopping points that lead to a "no" (explicit training needed) or a "yes" (transfer assumed) or a "maybe" that requires a user test.
     - Distinctions based on philosophy of perception and cross-modal learning research.

   Research insights:
     - Amodal properties: properties that are not tied to one sense (e.g., spatial location, numerosity, temporal sequence). These are more likely to transfer.
     - Modality-specific properties: properties that are tied to a particular sense (e.g., color for vision, pitch for hearing). These are less likely to transfer.
     - Calibration: Even for amodal properties, there might be a need for calibration (e.g., mapping the new sensory input to the existing representation).

   Proposed Procedure:

   Step 1: Define the capability and the property.
     - What is the task? (discrimination, naming, action)
     - What property is being perceived? (e.g., shape, location, orientation, emotion)

   Step 2: Classify the property.
     - Is the property amodal? (i.e., can it be perceived through multiple senses without prior experience? e.g., spatial location, motion, numerosity, duration, texture? Note: texture is both tactile and visual, but visual texture might require learning.)
     - Or is it modality-specific? (e.g., color, pitch, timbre, smell)

     Criteria for amodal:
       - The property can be perceived by more than one sense in typical development (e.g., we can see and hear rhythm, we can feel and see size).
       - The property is abstract and not tied to the physics of the energy (e.g., light vs. sound).

     If the property is amodal, proceed to Step 3.
     If the property is modality-specific, then explicit training is required (go to Step 6).

   Step 3: Check for inherent cross-modal mapping.
     - Does the property have a natural, inherent mapping between the existing sense and the new sense? 
          Example: spatial location in auditory and tactile senses (via the haptic belt) might map naturally because both use spatial coordinates.
          Counterexample: the shape of an object (cube vs. sphere) might be amodal (can be seen and touched) but the mapping from vision to touch is not automatic for a newly sighted person (as per Molyneux).

     However, research suggests that some amodal properties (like spatial location) are automatically integrated, while others (like shape) require experience.

     Factors to consider:
       - Spatial and temporal properties are more likely to have inherent mappings.
       - Feature-based properties (like shape) may require calibration.

     We can ask: 
          - Is the property primarily spatial or temporal? (if yes, then more likely to transfer)
          - Is the property a feature that is processed in a modality-specific way? (if yes, then less likely)

     If the property is primarily spatial/temporal and the new sense provides spatial/temporal information in a way that preserves the structure, then it is likely to transfer (go to Step 4). 
     Otherwise, if it is a feature property (like shape, texture) then we must consider the need for calibration (go to Step 5).

   Step 4: Assess the alignment of the new sense with the existing representation.
     - Does the new sense deliver the property in a format that is structurally similar to the existing sense?
          Example: The haptic belt provides vibration on the waist that corresponds to compass directions. This is a spatial mapping that is similar to auditory localization or visual peripheral cues. Thus, it might align with the user's existing spatial representation.

     Criteria:
          - The new sensory input is topographically organized (e.g., a camera for vision projects onto a 2D grid, which is similar to the retinotopic map; the haptic belt has a circular spatial layout).
          - The property is represented in the same frame of reference (e.g., egocentric vs. allocentric).

     If the representations are aligned, then transfer is likely (go to Step 6: assume transfer). 
     If not, then we need to consider calibration (Step 5) or explicit training.

   Step 5: Calibration requirement.
     - Can the property be calibrated by the user without explicit training? 
          - This is where the user might be able to figure out the mapping by using the intact sense simultaneously? But note: in our case, the user might not have the intact sense (e.g., for a retinal prosthesis, the user is blind and is now seeing). However, they have the existing representation from touch.

     We can ask:
          - Is the user able to simultaneously access the property through the existing sense and the new sense? (e.g., in the haptic belt, the user can feel the vibration and also see the doorway? Then they can calibrate on the fly.)
          - Or, is the new sense the only way to access the property? (e.g., the retinal prosthesis user cannot see without the device, so simultaneous access is not possible.)

     If simultaneous access is possible, then minimal training (or even none) might be needed because the user can self-calibrate. We can assume transfer but with a note that the device should allow for simultaneous use and self-calibration.

     If simultaneous access is not possible, then we need explicit training to build the mapping (go to Step 6: explicit training).

   Step 6: Decision.
     - If we have reached this step without a clear "yes", then we have two paths:
          a) We assume transfer (no explicit training) if:
               - The property is amodal and the mapping is inherent (Step 3) and the representations are aligned (Step 4) OR 
               - The property is amodal and simultaneous access allows self-calibration (Step 5).
          b) We require explicit training in all other cases.

     But note: even if we assume transfer, we may still want to do a user test if the stakes are high (e.g., critical function, high cost of failure). We will build in a step for considering user testing.

   Step 7: User testing consideration (optional).
     - If the decision is to assume transfer, but the capability is critical and the cost of being wrong is high (e.g., safety issue, or high engineering cost), then run a user test.
     - If the decision is ambiguous (e.g., we are not sure about alignment in Step 4) then run a user test.

     How to run the user test:
          - We can set up a 90-minute session with a user (or two sessions) to test the specific capability without training.
          - The test should check for discrimination, naming, and action as needed.

     Criteria for success in the user test:
          - Discrimination: can the user tell the two stimuli apart above chance?
          - Naming: can the user correctly label the stimuli?
          - Action: can the user perform the correct action?

     If the test is successful, then no explicit training is needed. Otherwise, we build training.

   Step 8: Values-based decision.
     - There might be cases where the procedure suggests no explicit training, but the team is willing to impose some training to reduce the risk of failure. Or vice versa.
     - We explicitly note that when the procedure leads to a close call, the team must decide based on:
          - The cost of being wrong (if we assume transfer and it fails, how bad is it?)
          - The burden of training on the user (how much time and effort?)
          - The criticality of the feature.

     This is a point for the medical director to sign off.

   Summary of the procedure:

    1. Define the capability and the property it relies on.
    2. Is the property modality-specific? 
          - Yes: explicit training (go to 6b).
          - No (amodal): go to 3.
    3. Is the property primarily spatial or temporal? 
          - Yes: go to 4.
          - No (feature-based): go to 5.
    4. Are the representations aligned? 
          - Yes: assume transfer (go to 6a).
          - No: go to 5.
    5. Is simultaneous access to the property via the new sense and an existing sense possible? 
          - Yes: assume transfer with self-calibration (go to 6a).
          - No: explicit training (go to 6b).
    6. Decisions:
          a) Assume transfer (no explicit training). Then consider: is the capability critical? 
