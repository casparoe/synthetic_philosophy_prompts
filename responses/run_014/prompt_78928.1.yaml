answer: |-
  ### Procedure for Determining Cross-Modal Skill Transfer in Sensory Devices  
  **Goal**: Decide whether to assume automatic skill transfer (no explicit training) or build explicit training/scaffolding for a capability in a new sensory channel.  
  **Runtime**: 45-60 minutes in a design review. Attendees: Clinicians, engineers, medical director (final sign-off).  
  **Inputs**: Device specs, user profile (intact senses, experience), task description (discrimination, naming, action).  
  **Outputs**: "Assume transfer" (no training), "Require explicit training," or "Run user test" (if critical/ambiguous).  

  ---

  #### Step-by-Step Procedure  
  **Question 1: Is the capability tied to a *single sense* in typical human experience?**  
  - *Ask*: "Could a typical human perform this task using only one sense (e.g., only vision for color, only touch for roughness)?"  
  - **Sufficient "No"**: The property is **amodal** (e.g., spatial location, motion, numerosity, size, temporal rhythm). → Proceed to Question 2.  
  - **Sufficient "Yes"**: The property is **modality-specific** (e.g., color, pitch, facial expression patterns). → **Require explicit training** (Stop).  
  - *Rationale*: Amodal properties (e.g., "left of") map across senses naturally; modality-specific ones (e.g., "red") do not.  

  **Question 2: Does the new sense deliver the property in a *structurally isomorphic* way?**  
  - *Ask*: "Is the property represented similarly in the new sense as in the intact sense? (e.g., spatial relations map 1:1, temporal sequences match timing)."  
  - **Sufficient "Yes"**: → Proceed to Question 3.  
  - **Sufficient "No"**: Representation differs (e.g., 2D vision vs. 3D touch for shape; abstract encoding of emotions as vibrations). → **Require explicit training** (Stop).  
  - *Rationale*: Cross-modal transfer fails without structural alignment (e.g., shape perception requires calibration between vision/touch).  

  **Question 3: Is *calibration* possible with simultaneous multisensory input?**  
  - *Ask*: "Can the user access the property through the new sense AND an intact sense *at the same time* during typical use?"  
  - **Sufficient "Yes"**: User can self-calibrate (e.g., feeling vibrations while seeing a doorway). → **Assume transfer** (Proceed to Question 4).  
  - **Sufficient "No"**: Simultaneous input impossible (e.g., retinal prosthesis user cannot "see" while blindfolded). → **Require explicit training** (Stop).  
  - *Rationale*: Calibration bridges senses when representations align (e.g., touch teaches vision during real-time interaction).  

  **Question 4: Is the capability *critical* or *high-risk*?**  
  - *Ask*: "If transfer fails, could it cause safety issues, device abandonment, or high engineering rework costs?"  
  - **Sufficient "Yes"**: → **Run user test** (see below).  
  - **Sufficient "No"**: → **Assume transfer** (Stop).  
  - *Values-based decision*: Weigh training burden against risk. Medical director breaks ties.  

  **User Test Protocol** (If triggered in Question 4 or team disagreement):  
  - **When**: Capability is critical or Questions 1–3 are ambiguous.  
  - **How**: One 90-min session with 1–3 users (max two sessions).  
  - **Test**:  
    - Discrimination: Can user distinguish targets (e.g., sphere vs. cube)?  
    - Naming: Can user correctly label targets?  
    - Action: Can user perform task (e.g., reach for cup)?  
  - **Success**: >70% accuracy on first exposure (no training). Else, require explicit training.  

  ---

  ### Case Applications  
  #### Case 1: Haptic Belt for Orienting Toward a Doorway  
  - **Capability**: Orient toward doorway (action).  
  - **Property**: Spatial direction (amodal).  
  1. **Q1**: Amodal (spatial) → Proceed.  
  2. **Q2**: Structurally isomorphic? Yes (belt vibrations map egocentric direction 1:1). → Proceed.  
  3. **Q3**: Calibration possible? Yes (user can feel vibrations while seeing/turning toward doorway). → **Assume transfer**.  
  4. **Q4**: Critical? Yes (navigation safety) → **Run user test**.  
  - **User Test**: Without training, can user turn toward doorway using belt?  
  - **Outcome**: Likely passes (spatial transfer is robust).  
  - **Practical Shadow**: *Against current practice* if you build scaffolding; test may show it’s unnecessary.  

  #### Case 2: Retinal Prosthesis for Picking a Cup from Clutter  
  - **Capability**: Identify and pick cup (discrimination + action).  
  - **Property**: Shape (amodal but complex).  
  1. **Q1**: Amodal → Proceed.  
  2. **Q2**: Isomorphic? No (touch integrates 3D shape; prosthesis delivers 2D low-res edges). → **Require explicit training**.  
  - **Why**: Shape requires calibration between 3D touch and 2D vision. Molyneux’s problem suggests no automatic transfer.  
  - **Practical Shadow**: *Against current practice* if you assume transfer; training is likely needed.  

  #### Case 3: Vibrotactile Display for Reading Facial Expressions  
  - **Capability**: Identify emotion (e.g., "happy") from vibrations.  
  - **Property**: Facial expression (modality-specific).  
  1. **Q1**: Modality-specific (naturally visual) → **Require explicit training**.  
  - **Why**: Expressions are tied to visual patterns; vibrations are arbitrary symbols. No cross-modal mapping exists.  
  - **Outcome**: Aligns with typical practice.  

  ---

  ### What the Procedure Cannot Do  
  1. **Predict individual differences**: Some users may self-calibrate faster than others.  
  2. **Handle degraded inputs**: If the device delivers noisy/low-res data (e.g., blurry prosthesis), transfer may fail even if criteria pass.  
  3. **Resolve ambiguous properties**: e.g., "texture" could be amodal (vision/touch) but may need calibration. Default to "Require training" if unclear.  
  4. **Replace long-term adaptation**: Tests only first exposure; users may improve with natural use.  
  5. **Override ethical constraints**: If training burden is excessive (e.g., for frail users), skip tests and default to scaffolding.  

  ### Where It Might Misfire  
  - **False "Assume Transfer"**: For complex amodal properties (e.g., shape) if structural alignment is overestimated (Case 2).  
  - **False "Require Training"**: For simple spatial tasks if calibration is overlooked (Case 1).  
  - **User test limitations**: 90-min tests may miss subtle learning curves.  

  ---  
  **Final Recommendation**: Use this procedure to replace ad hoc debates. For 80% of cases, it will enforce evidence-based decisions. For edge cases, the user test or medical director’s values call prevents costly errors. Update annually with real-world outcomes.
