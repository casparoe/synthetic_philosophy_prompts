answer: |-
  Here are five structural vulnerabilities of UDT, ranked from potentially fatal to merely awkward, focusing on core theoretical challenges:

  1.  **The Idealized Agent Assumption:** UDT fundamentally requires agents to have perfect, explicit self-knowledge of their own source code and decision procedure to compute logical counterfactuals globally, rendering it inapplicable to any real-world, resource-bounded, or self-modifying agent where such self-knowledge is impossible or uncertain. A defender *must* concede this restricts UDT's direct descriptive/prescriptive scope severely, potentially to an empty set of real agents.

  2.  **Löbian Obstacles & Self-Referential Consistency:** UDT agents reasoning about their own actions face profound challenges like Löb's Theorem, potentially leading to infinite regress, logical contradictions, or undecidability when trying to prove theorems about what their output *would* be in counterfactual scenarios. This strikes at the logical coherence of UDT's core mechanism; defenders acknowledge it's a deep unsolved problem requiring workarounds with unclear validity.

  3.  **Causal Delegitimization ("EDT in a Trenchcoat"):** The objection that UDT's prescriptions (like one-boxing) are merely sophisticated evidential reasoning, failing to capture genuine *causal* efficacy and potentially prescribing disastrous actions in scenarios where correlation doesn't imply causation (e.g., variants where Omega is fallible or malicious). Defenders *wave this off*, arguing UDT *is* capturing acausal control via logical correlation, fundamentally distinct from EDT's purely statistical conditioning.

  4.  **Unfalsifiability via Idealization:** The retreat to defining UDT only for mathematically idealized agents knowing their precise code acts as an escape hatch, potentially making UDT unfalsifiable by any real-world observation or practical failure. Defenders *concede* this limits applicability but argue it's the price of rigor for a *foundational* theory, analogous to idealized models in physics.

  5.  **Ambiguity vs. FDT & Implementation Dependence:** It's unclear whether UDT and FDT (Functional Decision Theory) are substantively distinct or just different framings of the same core idea. If they prescribe the same actions in all conceivable problems, UDT's complexity is redundant; if they differ, UDT faces specific challenges FDT avoids. Defenders often *wave this off* as a terminological/implementation detail, but the lack of consensus on a canonical UDT formalism is an awkward blemish.
