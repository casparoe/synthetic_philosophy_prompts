prompt: |-
  I'm an undergraduate taking an upper-level metaphysics course, and we've spent the last month on the special composition question — under what conditions do some things compose a further thing? Our TA, a fourth-year grad student, is openly hostile to unrestricted composition but equally dismissive of van Inwagen's view that only living things compose; she thinks stones and chairs exist, but she refuses to state her own principle, telling us that if we want it that badly we can reverse-engineer it from her verdicts. Between discussion section and office hours, we've now assembled quite a track record. Her rulings so far: the atoms of a stone compose a stone; the parts of a living human compose one thing; a chair is a genuine composite; the students seated across the front row do not compose a further object; the keys, the phone, and the earbuds lying a few inches apart on my desk do not compose one thing, even though they're all in the same place at the same time; the Eiffel Tower and my coffee mug do not compose anything over and above the tower and the mug; and the beads strung on a necklace do compose one thing.

  Next section we've been told to bring new cases, and I want to be the one with the interesting ones. I'm planning to spring three on her. First, dry sand poured through a funnel so that it sits as a neat cone on a lab bench: the grains touch their neighbors and the pile has a perfectly determinate shape, but nothing binds them — tip the bench and it all runs. Second, a line of demonstrators linked arm in arm stretching down several blocks: contact all along the chain, but each demonstrator can unlink and walk away at any moment, and the line has no fixed shape. Third, a spiral galaxy: its stars are gravitationally bound into a single persistent system, but no two stars touch, and the spiral is a statistical pattern rather than a fixed arrangement. I designed the first and third as a pair — the first has the parts touching but not bound together, the third has them bound together but not touching — because my hunch is that her rulings so far never separate those two features, and that if her principle exists at all, it has to pick one of them as the thing that matters.

  Before section, I'd like your help thinking it through. What rules could she be running that fit all seven of her earlier verdicts — and are there several, or does the track record really narrow it to one? For each rule you think is live, tell me what it predicts for each of my three cases, and where the rules disagree. Then give me your best guess as to how she'll actually rule on each, with your reasons — I care less about the answers than about which rule is most plausibly hers, given that she's already rejected both universalism and organicism. Finally, tell me which further case, not necessarily one of mine, would best discriminate between the surviving rules: if she answers my three the way you predict, I want to know what to bring to section after that.
reasoning: |-
  Okay, the user is an undergraduate in a metaphysics course focusing on the special composition question. They've been trying to figure out their TA's stance on when composition occurs. The TA has given several specific examples but hasn't stated her principle outright. The user has come up with three new cases to test the TA's views and wants help predicting the TA's responses and identifying the underlying principle.

  First, I need to recall the TA's previous rulings. She accepts stones, living humans, chairs, and beaded necklaces as composite objects. But she rejects compositions like students in a row, unrelated items on a desk, and the Eiffel Tower with a coffee mug. This suggests she's against universalism (everything composes) and van Inwagen's organicism (only living things). 

  Looking for patterns in the TA's approvals: stones have parts in contact and are cohesive; living humans are biological unities; chairs are functional artifacts; a beaded necklace is a connected artifact. Rejections include non-contiguous groups (students in a row), spatially proximate but unrelated items (keys, phone, earbuds), and arbitrary pairs (Eiffel Tower and mug). 

  Key factors might include causal or functional unity, spatial contiguity, and human intention. But the TA dismissed mere contact when it didn't involve cohesion or function, like the keys and phone. So cohesion and functional unity seem important. 

  The user's cases are designed to test cohesion versus contact. The sand pile has contact but no binding; the protesters have contact but can disconnect; the galaxy has binding without contact. If the TA requires both, she might reject all three. But that seems too strict given she accepts stones and necklaces, which aren't permanently fixed. 

  Possible principles: 
  1. **Functional Unity**: Objects must serve a common purpose. Stones protect or support, chairs are for sitting, necklaces for adornment. Sand pile and galaxy lack human-centric functions. Protesters might if they're demonstrating, but individuals can leave. 
  2. **Cohesion or Dynamic Stability**: Parts remain together without external force. Stones and chairs resist separation; necklaces hold shape. Sand pile collapses easily, galaxy is bound by gravity but stars don't touch. Protesters are voluntarily linked. 
  3. **Artifact Status**: Human-made objects with intended function. Stones might be natural artifacts. Galaxy is natural, sand pile isn't an artifact. Protesters are temporary assemblies. 

  Predictions:
  - Sand pile: Likely rejected. No function, low cohesion. 
  - Protesters: Ambiguous. If functional unity (protest), maybe accepted, but individuals can leave. More likely rejected as temporary. 
  - Galaxy: Rejected. Natural, no function, no contact. 

  A discriminating case could be a natural object with functional unity but no human intention, like a bee hive. Or a designed object without cohesion, like a temporary scaffold. If she accepts the hive but rejects the scaffold, functional unity is key. If she requires both, she might reject both. 

  The user's deeper need is to understand the TA's principle to engage effectively in class. They want to challenge the TA logically and showcase their understanding. Providing a follow-up case that tests functional vs. cohesion aspects would help them continue the dialogue. 

  The TA's dismissiveness suggests she might favor a functional approach, as it's more flexible. But her acceptance of stones as natural objects complicates things. Maybe she allows natural kinds with cohesion. The galaxy's gravitational binding might not suffice if it lacks a unified function. 

  In summary, the TA likely values functional unity and cohesion. The sand pile fails both, protesters might have function but lack cohesion, galaxy has cohesion but no function. A beehive case could test if natural functional unities count without human intention.
answer: |-
  Based on her rulings and rejection of both universalism and van Inwagen, your TA likely adheres to a principle emphasizing **functional unity** or **cohesive persistence**, possibly combined with **causal interdependence** or **artifact status**. Here's an analysis of viable principles fitting her 7 verdicts, predictions for your 3 cases, and a strategy for the next step:

  ---

  ### **Plausible Principles Fitting Her 7 Verdicts**
  1. **Functional Unity Principle (FUP)**:  
     *Composition occurs iff the parts are integrated to serve a common function that cannot be performed by the parts alone.*  
     - **Fits verdicts**: Stones (load-bearing/protection), humans (biological unity), chairs (sitting), necklace (adornment). Rejects students in a row (no collective function), desk items (no unified purpose), Eiffel + mug (arbitrary pairing).  

  2. **Cohesive Persistence Principle (CPP)**:  
     *Composition occurs iff the parts maintain a stable arrangement *without external containment* and resist casual dissociation.*  
     - **Fits verdicts**: Stones/chair/humans/necklace maintain shape/cohesion. Rejects students (easily disbanded), desk items (no cohesion), Eiffel + mug (no unified structure).  

  3. **Artifact + Natural Kind Hybrid (ANKH)**:  
     *Composition occurs iff the whole is either (a) a functional artifact, or (b) a natural kind with intrinsic cohesion.*  
     - **Fits verdicts**: Stones (natural cohesive kind), humans (biological natural kind), chairs/necklaces (artifacts). Rejects students/desk items (not artifacts/natural kinds), Eiffel + mug (not a single artifact/kind).  

  ---

  ### **Predictions for Your 3 Cases**
  | Case                  | FUP Prediction             | CPP Prediction             | ANKH Prediction           |
  |-----------------------|----------------------------|----------------------------|----------------------------|
  | **Sand Cone**         | ❌ No unified function     | ❌ Easily dissociated      | ❌ Not artifact/natural kind |
  | **Protesters**        | ⚠️ *Maybe* (if "protest" counts as function) | ❌ No stable shape/resistance | ❌ Not artifact/natural kind |
  | **Spiral Galaxy**     | ❌ No teleological function | ⚠️ *Maybe* (gravitationally bound) | ❌ Not artifact; natural *system* but not "kind" |

  **Key Disagreements**:  
  - **Protesters**: FUP *might* accept if collective action is seen as a function; CPP/ANKH reject.  
  - **Galaxy**: CPP *might* accept due to gravitational binding; FUP/ANKH reject.  

  ---

  ### **Predicted TA Rulings & Reasoning**
  1. **Sand Cone**: **❌ NO composition**  
     - *Why*: Lacks function (FUP), cohesion (CPP), and artifact/natural-kind status (ANKH). Matches her desk-items ruling (proximity ≠ composition).  

  2. **Protesters**: **❌ NO composition**  
     - *Why*: Humans aren't "parts" of a functional whole (contra chair/necklace); arrangement is voluntary/temporary. She rejected student-rows for similar reasons. ANKH seals rejection.  

  3. **Spiral Galaxy**: **❌ NO composition**  
     - *Why*: She likely distinguishes *systems* from *composite objects*. Galaxies lack teleology (FUP), contact (implied by CPP), and aren’t artifacts/natural-kinds (ANKH). Gravitational binding is too weak vs. atomic bonds in stones.  

  **Most Plausible Principle**: **Functional Unity (FUP)**.  
  - Best explains her acceptance of *artifacts* (chair, necklace) alongside *natural cohesive kinds* (stone, human), while rejecting arbitrary groupings. Her dismissal of van Inwagen suggests she includes non-living composites *if* they have a function.  

  ---

  ### **Next Discriminating Case: "The Beehive"**  
  To test FUP vs. CPP/ANKH after your cases:  
  - **Description**: A beehive with thousands of bees working as a colony. Parts are mobile and not physically bound, but the colony exhibits thermoregulation, division of labor, and collective defense.  

  | Principle          | Prediction for Beehive | Why? |
  |--------------------|------------------------|------|
  | **FUP**            | ✅ Composition         | Bees serve colony-level functions (e.g., reproduction, survival). |
  | **CPP**            | ❌ No composition      | No rigid structure; bees detach freely. |
  | **ANKH**           | ⚠️ *Maybe*            | If "superorganism" counts as natural kind; else ❌. |

  **Why this works**:  
  - If TA accepts the hive, FUP is confirmed (function > cohesion).  
  - If she rejects it, CPP/ANKH gain traction (cohesion/kind-status needed).  
  - Forces her to clarify if biology extends beyond organisms to superorganisms.  

  ---

  ### **Strategic Notes**
  - **Sand & Galaxy**: Your pair brilliantly isolates contact vs. binding. Her likely rejections suggest she requires *both* functional unity *and* cohesion (hence FUP’s edge).  
  - **Her Evasiveness**: She may resist stating a principle because hybrid views (like ANKH) are vulnerable to counterexamples (e.g., is a sandcastle an artifact?).  
  - **Next Move**: If she rejects all three of your cases, press her on *why* a galaxy differs from a stone. If she cites "human-scale relevance," she’s likely a *pragmatist*—another viable option fitting her rulings.  

  Bring the beehive case—it’s a litmus test for function-driven composition and will force her to reveal her hand.
