prompt: |-
  I am recording secretary for a federation of roughly forty worker cooperatives, and I have been asked to prepare an internal review of our governance documents. Three features of the federation's practice puzzle me, and I want to know what they presuppose before I attempt to describe them.

  First, the three federation officers are elected by secret ranked ballot under an instant-runoff rule. The bylaw commentary on that election provides that if the final round is a tie the winner is drawn by lot, and it defends the lot on the ground that at that point no counting rule can be shown to be fairer than any other.

  Second, all substantive decisions are taken in open assembly by formal consensus. A facilitator states the proposal and tests the meeting; any single member may block, and a block halts the proposal and returns it to a working group with the blocker's reasons attached. A block is never put to a count and never overridden. Members are asked to say whether they can live with a proposal, not how strongly they prefer it, and the official record notes only the sense of the meeting — no tallies are recorded for consensus decisions.

  Third, the bylaws contain a fallback that they themselves treat as a failure: if a proposal has been through two rounds of revision and still cannot reach consensus, the assembly may adopt it on a seventy-five percent vote. In the federation's four decades this has happened four times, and on each occasion the officers issued a statement regretting that the assembly had been reduced to counting.

  So we count preferences and then pronounce the counting rule arbitrary at the margin; and elsewhere we refuse to count at all, treating a single dissent as decisive.

  What theory of the group's decision — of what a collective choice is, and of what makes one legitimate — does the consensus procedure presuppose? Does it presuppose that there is a single right answer to be discovered by deliberation, that members' preferences are material to be transformed rather than data to be aggregated, that legitimacy requires that every member could accept the outcome, or some combination of these? Which rival accounts does it thereby rule out, and does it rule them out or merely decline to engage them?

  Are the three practices consistent with one another? In particular, is the lot-drawing bylaw an admission that aggregation is underdetermined — and if so, does that admission undercut the assembly's confidence that consensus finds something rather than merely produces something? Does Arrow's impossibility theorem actually bear on the assembly's procedure, or does it fail to apply because the assembly never fixes a rule mapping profiles of individual preference onto outcomes? Be explicit about which of Arrow's conditions the consensus practice evades, and by what means.

  Finally, distinguish what the practice strictly presupposes from what it merely fits comfortably with; mark the places where it is philosophically underdetermined, so that several incompatible theories would license exactly the same procedure; and say concretely what would have to change in the bylaws and in the conduct of the assembly if the federation adopted the opposite view — that a group's decision is nothing over and above the output of a stated rule applied to members' expressed preferences.

  Lead with your bottom line in no more than three sentences, stating what you take these practices jointly to presuppose and whether they are consistent; then give the reconstruction. Keep the whole answer under 700 words, and do not append references or suggested reading.
reasoning: |-
  Okay, let me unpack this fascinating governance puzzle from a worker cooperative federation's recording secretary. The core tension revolves around three distinct decision-making methods: ranked-choice voting with random tiebreakers for officer elections, strict consensus for substantive decisions, and a reluctant supermajority fallback. 

  Hmm, the secretary wants to understand the underlying philosophical coherence - particularly whether the consensus model assumes a "discovered truth" versus preference aggregation, and how the tiebreaker lottery affects this. They also probe about Arrow's theorem relevance. 

  First, I notice consensus treats each member as a veto-wielder, which suggests legitimacy requires universal acceptability. That's fundamentally different from aggregation systems where minority preferences get overridden. The refusal to record tallies reinforces that preferences aren't being measured but transformed through deliberation. 

  But then the ranked-choice voting for officers does aggregate preferences! Though interestingly, they defend the random tiebreaker by acknowledging the arbitrariness of voting rules at the margin. That's a subtle admission that aggregation mechanisms are imperfect social constructs. 

  For Arrow's theorem... ah, consensus cleverly sidesteps it by never establishing a fixed preference-to-outcome mapping. No ranking of options? Arrow's IIA condition doesn't apply. No voting rule? Transitivity isn't required. The block function essentially makes each decision a separate sovereignty test rather than part of an ordered set. 

  The supermajority fallback feels like an emergency exit - philosophically inconsistent but pragmatically necessary. Its rare use suggests the federation sees counting as governance failure, implying they view consensus as qualitatively superior to aggregated preferences. 

  What would change if they flipped to pure preference aggregation? Blocking would disappear, tallies would be recorded, and proposals would advance based on thresholds rather than unanimity. Deliberation would focus less on transforming preferences and more on revealing them. 

  Ultimately these practices hold together if we see officer elections as administrative (hence tolerable aggregation) while substantive decisions require deeper legitimacy. The tiebreaker lottery's humility about aggregation actually strengthens the consensus model by contrast. Not perfectly consistent, but coherent in their shared rejection of majoritarianism as ideal.
answer: |-
  ### Bottom Line
  Your federation's practices jointly presuppose that legitimate collective choice emerges through deliberative transformation of perspectives toward universal acceptability, not preference aggregation. They are philosophically consistent in prioritizing consensus as discovery of shared solutions, with electoral counting treated as a necessary but imperfect administrative tool. The tie-breaker lottery openly acknowledges aggregation's indeterminacy without undermining consensus, as the procedures address fundamentally distinct questions.

  ### Reconstruction of Presuppositions
  Consensus procedure assumes:
  1.  **Legitimacy requires universal acceptability:** A decision is legitimate only if every member can assent to it ("live with it"), making a single block decisive. This rejects majoritarian legitimacy.
  2.  **Deliberation transforms preferences:** The goal isn't to tally pre-existing preferences but to shape proposals via dialogue until they become acceptable to all. Preferences are mutable material, not fixed data. Recording only the "sense" underscores this.
  3.  **Discovering shared solutions:** The process aims to uncover outcomes reflecting the group's collective interest or common ground ("a single right answer" discoverable through reason and revision), rather than merely balancing competing interests.

  This rules out theories where legitimacy stems solely from aggregating fixed preferences via a rule (e.g., utilitarianism, majoritarianism) or where the "right answer" is independent of member assent.

  ### Consistency and Arrow's Theorem
  1.  **Consistency:** The practices are consistent. Officer elections (aggregation) handle administrative roles distinct from substantive policy. The lottery's defense explicitly highlights aggregation's inherent arbitrariness *at its limits*, reinforcing why consensus (rejecting aggregation) is preferred for substance. The supermajority fallback is a pragmatic, regretted last resort, not a legitimizing principle.
  2.  **Arrow's Theorem:** **It does not apply** to the consensus procedure itself. Arrow's theorem requires a social welfare function mapping *ordered individual preferences* onto a *social ordering*. Consensus evades this:
      *   **Evades "Unrestricted Domain" (C1):** Consensus doesn't require members to submit rank-ordered preferences over all options. Preferences are expressed only as assent/dissent to specific proposals emerging from deliberation.
      *   **Evades "Independence of Irrelevant Alternatives" (IIA) (C3):** The outcome (assent or block) depends entirely on the specific proposal and the deliberative context, not on comparisons to other unchosen alternatives.
      *   **No Social Ordering Produced:** Consensus yields a binary "yes/no" on *one* proposal, not a ranking of states. Arrow's conditions for a coherent social ordering are irrelevant.
      *   **The "Rule" is Veto, Not Aggregation:** The mapping rule is simple: unanimity for passage, any single veto for failure. This isn't the type of complex aggregation rule Arrow's theorem targets.

  ### Underdetermination and Alternatives
  *   **Underdetermined:** The practice fits both "deliberative democracy" (common good discovery) and "unanimity contractarianism" (each member's veto right as protection). It doesn't strictly presuppose an objective "right answer" independent of the process, only that the *process* aims for universal assent.
  *   **Opposite View (Pure Aggregation):** Adopting the view that decisions are *only* rule-based preference aggregation would require:
      *   Eliminating blocks and consensus.
      *   Requiring all proposals be decided by a defined voting rule (e.g., majority, supermajority).
      *   Recording individual votes/tallies for all decisions.
      *   Abandoning the requirement that members "live with" the outcome; strength of preference would become relevant.
      *   Justifying the voting rule itself as fair aggregation, making the tie-breaker lottery's defense incoherent. The supermajority fallback would become the norm, not a failure.

  The practices cohere around a core commitment: substantive legitimacy flows from universal assent achieved through transformed understanding, while aggregation is a limited, fallible tool for necessary administration. The lottery's humility about aggregation reinforces, rather than contradicts, the primacy of consensus.
