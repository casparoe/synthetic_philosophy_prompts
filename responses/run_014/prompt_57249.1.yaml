answer: |-
  ## The Paper Persimmon

  The dust in the Archive-City of Lexica tasted like forgotten arguments. Elara inhaled it as she surveyed the stack of parchment slips assigned for Audit Batch Gamma-Seven. Beside her, Kael shuffled his feet, the worn stone floor cool even through thin apprentice sandals. Nineteen, found swaddled at the Gate before he could form memories of sky beyond the high walls, Kael moved through the labyrinthine stacks with the confidence of a native, his vocabulary a polished shield. Elara, nearing fifty, carried the faint, fading ghost of an unripe persimmon on her tongue.

  “Right,” Elara said, her voice raspy. “Gamma-Seven. Focus: entries flagged for potential redundancy or weak ostension chains. The Prefect wants leaner definitions for the new edition. Paper’s scarce.” The stated reason, frugality, felt flimsy against the weight of the Termination Rule inscribed above every archway: *All chains must find their anchor in the witnessed world.* The last OSTENSIVE stamps were applied by her grandfather’s generation. Now, they sought proof the anchors still held.

  Kael nodded, already scanning the first slip. “Start with ‘Peculate’?” His finger traced the definition. “‘Peculate: (OSTENSIVE) To pilfer public monies, esp. by subtle diversion. Witnessed: Magistrate Theron’s trial, Grain Ledger #447.’” He looked up. “The ledgers exist. Theron’s trial transcripts are in Vault Epsilon. Ostension seems sound.”

  “Agreed. Stamp confirmed,” Elara said, her stylus hovering over the ‘Audit Passed’ box. Easy. Concrete. Money, ledgers, a disgraced magistrate. The world held that theft firmly.

  The next slip was thicker. “Ah, ‘Astringent’,” Kael murmured. Elara’s mouth tightened imperceptibly.

  Kael read aloud, his voice clear and precise: **‘Astringent: (adj.) Producing a drying, puckering sensation, esp. upon mucous membranes. See: DRY, PUCKER, HARSH. Syn: Biting (archaic).’** He flipped the slip. “No OSTENSIVE stamp. Chain required.”

  They pulled the referenced entries.

  **‘Dry: (adj.) Lacking moisture or natural lubrication; producing a sensation of roughness or friction. See: HARSH, ROUGH. OSTENSIVE: Demonstrated with sandpaper (Grade 3, Archive Stores) on unvarnished cedar plank. Witnessed: Compiler Lenos, Apprentice Pelia.’**

  **‘Pucker: (v.) To gather or contract into wrinkles or small folds. See: CONTRACT, WRINKLE. OSTENSIVE: Demonstrated by observing the effect of lemon juice (Citrus limon, preserved sample #221) on the inner lining of a volunteer’s cheek. Witnessed: Compiler Myra, Scribe Joren.’**

  **‘Harsh: (adj.) Unpleasantly rough or grating to the senses. See: ROUGH, BITING. OSTENSIVE: Demonstrated via the auditory comparison of slate scraped with iron nail versus brushed with soft cloth. Witnessed: Compiler Alden, Gatekeeper Bren.’**

  **‘Biting: (adj.) (Archaic) Stingingly sharp or severe, capable of causing a shrinking or drawing-in sensation. See: ASTRINGENT, HARSH. Note: Superseded in precision by ‘Astringent’ for tactile/mucosal contexts.’**

  Kael laid the slips out on the worn oak table. Sandpaper. Lemon juice. Scraping slate. All ostensively grounded, witnessed. And then the chain circled back: ‘Biting’ pointed to ‘Astringent’, and ‘Astringent’ pointed back through ‘Dry’, ‘Pucker’, and ‘Harsh’. A closed loop, suspended in the air of definitions, never quite touching the thing it described.

  “The persimmon,” Elara said quietly. “The reference *was* the fruit. The last tree in the Scholar’s Terrace orchards died… before you came, Kael. In my grandmother’s time. The OSTENSIVE stamp would have been for the fruit itself, tasted. But that entry was lost in the Great Damp, they say. This definition chain is what replaced it.”

  Kael frowned, not in confusion, but in concentration. “So, ‘astringent’ describes the effect. We have ostension for the *components* of the description: dryness, puckering, harshness. But not for the specific combination elicited by the persimmon?”

  “Yes. But is the *combination* the same? Does knowing about sandpaper, lemon juice, and scraping slate… does that truly tell you what an unripe persimmon does?” Elara watched his face, smooth and earnest. He used ‘astringent’ perfectly. Just yesterday, he’d corrected a junior scribe’s draft: “No, not *merely* sour. The tannins produce a distinctly *astringent* quality, like alum on the tongue – see the entry.” He’d even joked about the Prefect’s withering glare being ‘visually astringent’.

  “It seems comprehensive,” Kael offered. “The definition is clear. The sensations are individually attested.”

  “But have you ever *felt* it?” The question escaped before Elara could stop it.

  Kael blinked. “Felt… astringency? Not as defined by the persimmon, no. But I understand dryness, puckering, harshness. I’ve tasted alum solution as per the hygiene protocols – it makes the mouth feel… tight. Uncomfortably dry. Is that similar?”

  Close, but not quite. Alum was chemical, sharp. The persimmon was… vegetal, profound, a mouth suddenly turned to parchment. Elara grasped for a way in. “Imagine… imagine your mouth is a damp cloth. Suddenly, every thread in that cloth pulls tight, shrinks, draws together. It’s not just dry, it’s… actively *sucking* the moisture back, pulling your cheeks in. It’s… startling. Unpleasant, but… memorable. Distinct.”

  She mimed it, her own cheeks hollowing involuntarily at the phantom sensation. “Like… like your tongue is trying to fold itself into an envelope.”

  Kael watched her performance intently. He nodded slowly, his expression thoughtful, receptive. “I see. A pronounced, involuntary contraction of the buccal tissues, exceeding simple dryness, characterized by a tangible sense of withdrawal or shrinkage. More pronounced than alum, more… organic in its manifestation of desiccation?”

  His definition was flawless. Clinically perfect. It captured the mechanics she’d gestured towards. But his eyes held only the bright focus of comprehension, not the shadow of remembered discomfort. He’d translated her struggle into impeccable Lexicon-speak. It landed nowhere near the ghost on her tongue.

  “Yes,” Elara said, the word tasting like dust again. “Exactly like that.” The failure had a shape: a perfect translation that carried no cargo. The bridge was built, but nothing crossed.

  They moved on. ‘Melancholy’ was grounded in descriptions of observed posture and tear production witnessed during public laments. ‘Effervescent’ in the behaviour of specific mineral springs (long dried up, but the description of the bubbling remained valid). The chains held, if tenuously.

  Then came ‘Querencia’.

  **‘Querencia: (n.) (Regional, obs.) The specific place within a designated arena (esp. for ritual combat or ceremonial debate) where a participant feels most grounded, capable, and instinctively returns to for respite or to gather resolve. See: REFUGE, CENTER, COURAGE. OSTENSIVE: Witnessed during the Trial of Resolve (Archival Record #998), wherein claimant Elara’s mother (Compiler Miren) repeatedly retreated to the northwest corner of the Hall of Contention, visibly steadying herself before each rebuttal. Witnessed: Senior Compiler Torin, Gate Lieutenant Vale.’**

  Elara froze. Her mother. The dusty, sun-warmed corner near the old cedar pillar. She remembered the scent of her mother’s linen robe, the rough stone against her small back as she’d hidden there during the terrifying, booming arguments of the Trial. Her mother hadn’t gone there for courage; she’d gone there to *breathe*, to press her forehead against the cool stone and shut out the noise, a moment of pure, desperate hiding before stepping back into the fray. *Querencia*. The word felt alien on the slip.

  Kael was frowning at the chain. “Refuge… center… courage. Ostension is present, but…” He tapped the slip. “The definition speaks of feeling ‘grounded’ and ‘capable’. The witnessed event describes retreat and steadying. But… *what was felt*? How can you point at a feeling of being grounded *in a specific spot*? You can point at the spot. You can point at the person standing there. But the… the *belonging* of it? The *feeling*?”

  Elara stared at him. This was the other failure. Worse than the missing persimmon. The persimmon *had* existed. You *could* point at it, taste it. Its absence was a tragedy of time. ‘Querencia’… its ostension was a pantomime. They had pointed at a location and an action (retreating, steadying) and stamped it as proof of an internal state – a state that could never truly be *pointed at*, only inferred or reported. The stamp was a lie born of necessity, trying to nail down smoke. Her mother’s fear and exhaustion in that corner had been real, but the stamp claimed they witnessed ‘grounded capability’. They had witnessed the *symptoms*, perhaps, and labeled the disease without ever touching it. The persimmon was gone; ‘querencia’ had never been graspable in that way at all.

  “It’s… insufficient,” Elara managed, her voice thick. “The ostension… it doesn’t reach.” She couldn’t articulate why without stepping into the forbidden territory of internal states. How could she explain that witnessing a location and an action wasn’t witnessing the *meaning* of that location? Kael looked puzzled but nodded slowly, accepting her judgment.

  “The tree is gone,” Kael said later, as they reviewed the Gamma-Seven recommendations under the flickering oil lamp. “No persimmon can be ostended. The chain is circular. ‘Querencia’… its ostension is flawed in kind.” He stated the facts cleanly. “Both are deletion candidates.”

  Elara held the ‘Astringent’ slip. The dry, puckering, harsh, biting loop. She thought of her grandmother’s gnarled hands offering the small, hard fruit. The immediate, shocking clench of her mouth, the gasp, the burst of childish tears followed by her grandmother’s rasping laugh. Was that memory real? Or was it woven from stories, from the definition itself? Did the ghost on her tongue belong to the fruit, or to the word? Her doubt was a fog obscuring a lost landmark. Kael’s ignorance was a blank wall where no landmark had ever been. Both left ‘astringent’ ungrounded, but the *lack* felt different. Hers was an erosion; his was an absence.

  Kael needed the Lexicon to be whole; it was his only world, his only family. He wanted certainty, structure, the comfort of flawless procedure. Elara feared the hollowness beneath the words, the growing suspicion that the magnificent edifice of the Standard Lexicon, the bedrock of contracts and boundaries, might be built on sand – some eroded, some never there to begin with. The audit mattered because the Lexicon *was* the world within these walls. To find its core rotting was to find the walls themselves might be an illusion.

  She picked up her stylus. For ‘Querencia’, the decision was clear. The OSTENSIVE stamp was invalid. A red line slashed through it, the entry marked for deletion. The pantomime couldn’t stand.

  She held the ‘Astringent’ slip over the deletion pile. The loop was undeniable. The referent was gone. Frugality demanded it.

  But then she thought of Kael’s impeccable use of the word, the way it *worked* within the system, conveying *something* – even if it wasn't the ghost on her tongue. She thought of the phantom clench in her own jaw, indistinct but persistent. Was it a memory, or merely the definition echoing in her flesh? Did it matter, if the word held its place, performing its function? Deletion felt like closing a door on the last whisper of sunlight from a lost orchard.

  Her stylus hovered. The Prefect demanded leanness. Paper was scarce.

  She moved the slip aside, not to the deletion pile, nor back to the confirmed stack. She dipped her stylus not in red ink, but in the deep blue used for marginalia. Carefully, precisely, she drew a small circle around the cluster of cross-references: ‘DRY, PUCKER, HARSH, BITING’. She drew no line, wrote no word. Just that single, azure circle, embracing the loop, acknowledging its closed path without confirming its anchor. She placed the slip in the small stack marked ‘Review – Senior Compiler’. It was a reprieve, not an exoneration. A holding action.

  Kael watched, his face unreadable in the lamplight. He saw the blue circle, the deviation from procedure. He said nothing, merely gathered the other slips, his movements as precise and efficient as his definitions.

  Elara looked at the circle. Had she preserved a connection to a lost reality, however tenuous? Or had she merely enshrined a beautiful, empty knot of words? The blue ink gleamed, holding both possibilities suspended, as dry and unresolved as the definition it surrounded. The paper persimmon remained, its taste a question mark etched in azure.
