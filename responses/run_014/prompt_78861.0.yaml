  The renewal arguments must avoid straw men. Pro-sortition points should acknowledge systemic flaws (slow decisions, emotional toll), not just utopian talking points. Anti-sortition voices should sound pragmatic, not villainous—maybe a small-business owner crushed by unstable water policies. 

