prompt: |-
  A general science monthly directed toward educated non specialists publishes several features each year that explain striking biological traits as adaptations for particular functions.

  I serve as features editor with responsibility for vetting freelance pitches for such features. Each month I must assess approximately six pitches. The stakes are recurrent and asymmetric: publication of an unsupported adaptive story misleads readers and damages long term credibility, while excessive caution delays coverage of well supported work and strains relations with writers. Members of the screening staff hold undergraduate level biology and can devote about forty minutes to each pitch. Final authority for acceptance, revision, or rejection rests with me, with consultation of an external academic referee only when the procedure calls for escalation.

  I request a reusable screening procedure, presented as a flowchart in words, grounded in the Gould-Lewontin critique of adaptationism and its call for pluralist explanation. The procedure should translate that critique into sequential tests suitable for use by non specialists, preserving the distinctions among adaptation in the strict sense, exaptation or coopted function, byproduct or spandrel, developmental and architectural constraint, and drift, while indicating which refinements may be set aside for practical use.

  For each step, specify the question to be addressed, the kind of evidence that would count as adequate for a magazine level claim, the conditions that require revision or rejection without further review, and the conditions that require escalation for judgment. Mark explicitly those points where editorial judgment cannot be eliminated and where the procedure is most likely to misfire.

  The procedure must be equipped to handle three recurring hard cases: claims about human cognition or behavior where experimental manipulation is limited, claims about visually compelling animal structures where reader appeal creates pressure to publish, and claims where adaptive and non adaptive factors plausibly interact.

  Demonstrate the procedure by applying it to the following three stylized submissions, taking the stated evidential claims as given without additional fact checking. First, a pitch asserting that throat fan color in a desert lizard evolved to deter a particular avian predator, supported by a within population correlation and a single clay model experiment, without comparative data, heritability estimates, or fitness measures in the wild, and favored by senior staff as a potential cover story. Second, a pitch asserting that rhythmic humming during concentrated individual work evolved to promote social cohesion in ancestral groups, supported by a cross cultural survey and a laboratory study of mood, without developmental, comparative, or fitness evidence. Third, a pitch asserting that reduction of eyes in a cave fish population is best explained largely by neutral accumulation and developmental tradeoffs rather than direct selection for eyelessness, supported by comparative data from neighboring populations, breeding experiments, and quantitative estimates of metabolic cost.

  Include full step by step application in each case, including at least one case where correct application yields a result contrary to editorial or commercial preference. Conclude with a concise statement of what the procedure cannot accomplish.
reasoning: |-
  Hmm, the user is a features editor for a science magazine, looking for a reusable screening procedure based on Gould and Lewontin's critique of adaptationism. They need a flowchart in words to evaluate pitches about biological traits, distinguishing between adaptation, exaptation, spandrels, constraints, and drift. The procedure must be usable by staff with undergraduate biology knowledge in about 40 minutes per pitch.

  Key requirements include sequential tests that incorporate pluralistic explanations, handling three hard cases: human cognition with limited experiments, visually striking animal structures with publication pressure, and traits where adaptive and non-adaptive factors interact. The editor wants explicit markers for where judgment is needed and where the procedure might fail.

  The user also provides three stylized submissions to demonstrate the procedure: a lizard throat fan claim, human humming behavior, and cave fish eye reduction. The procedure must handle cases where correct application goes against editorial preference.

  I'll build the procedure around Gould-Lewontin's core ideas: rejecting "just-so stories," considering alternatives to adaptation, and emphasizing constraints/historical contingency. The screening should progress from basic plausibility checks to evidentiary thresholds, with clear rejection/revise/escalation points.

  For the structure, I'll create a 5-step flowchart: 
  1) Function specification test (is the proposed function clearly defined?) 
  2) Adaptationist evidence test (does evidence support adaptation specifically?) 
  3) Pluralism screen (are non-adaptive alternatives considered?) 
  4) Interaction assessment (for mixed-factor cases) 
  5) Holistic editorial decision

  Each step needs: 
  - Specific question 
  - Evidence standards for magazine claims 
  - Rejection/revise conditions 
  - Escalation triggers 
  - Judgment/failure markers

  For the lizard case (favored cover story), the procedure should flag missing comparative/heritability data and force revision despite senior staff preference - demonstrating how it counters publication pressure. The humming claim should reveal insufficient evidence for adaptation due to lack of fitness measures. The cave fish example should show adequate support for non-adaptive explanations.

  Finally, I'll clarify limitations: the procedure can't replace specialist knowledge, assess evidence quality deeply, resolve all ambiguities, or eliminate judgment at decision points. It's a screening tool, not an oracle.
answer: |-
  Here is a reusable screening procedure grounded in the Gould-Lewontin critique, designed for efficiency and pluralism, presented as a verbal flowchart. It prioritizes distinguishing adaptation (direct selection *for* the trait's current function) from alternatives (exaptation, spandrel, constraint, drift).

  **The Screening Procedure (Verbal Flowchart)**

  1.  **STEP 1: FUNCTION SPECIFICATION & PLAUSIBILITY**
      *   **Question:** Is the proposed *current function* clearly defined and biologically plausible? Is the *selective agent/pressure* specified? Could the trait conceivably serve this function?
      *   **Evidence Adequate for Magazine:** Clear articulation of function/pressure; basic biological coherence (e.g., predator deterrence *could* involve visual signals; humming *could* affect mood/cohesion; eye loss *could* save energy).
      *   **Revise/Reject Without Review:** Function/pressure vague, implausible, or contradicts known biology (e.g., "humming evolved to talk to aliens"). *REJECT.*
      *   **Escalate:** Novel or highly controversial function/pressure specification requiring specialist input.
      *   **Judgment/Failure Point:** Assessing "plausibility" is inherently subjective. Likely to misfire on highly novel claims or those relying on complex, poorly understood systems (like human cognition). *Proceed to Step 2 only if plausible.*

  2.  **STEP 2: ADAPTATIONIST EVIDENCE - IS THERE EVIDENCE *FOR* ADAPTATION?**
      *   **Question:** Is there evidence suggesting the trait *was shaped by natural selection specifically for the proposed current function*? (Gould-Lewontin: Ruling out alternatives requires strong positive evidence *for* adaptation).
      *   **Evidence Adequate for Magazine (Minimal Threshold):** Requires evidence beyond mere correlation or plausibility. *Requires at least TWO of the following*:
          *   **Manipulation/Experimental Test:** Experimental alteration of the trait (or its function) showing a *fitness consequence* related to the proposed function (e.g., predation rates change when signal altered).
          *   **Comparative Evidence:** Consistent correlation between trait presence/form and proposed selective pressure across related species/populations *accounting for phylogeny*, or demonstration of convergent evolution under similar pressure.
          *   **Heritability & Selection Gradient:** Evidence of heritable variation *in the trait* and a measurable link between trait variation and fitness variation *in a relevant environment* (even if proxies used).
          *   **Optimality/Engineering Test:** Evidence the trait is well-designed *specifically* for the proposed function, outperforming feasible alternatives in relevant metrics (e.g., signal efficiency, energy saving).
      *   **Revise/Reject Without Review:** Evidence *only* shows correlation or plausibility (fails 2/4 threshold). *REVISE (demand stronger evidence or reframe as non-adaptive hypothesis) or REJECT.*
      *   **Escalate:** Evidence is complex, contradictory, or relies on novel/unvalidated methods. Threshold met but interpretation highly contentious.
      *   **Judgment/Failure Point:** Judging sufficiency/quality of evidence types is critical. Non-specialists may overvalue weak "optimality" arguments or correlations. Threshold setting is editorial policy. *If threshold MET, proceed to Step 3. If NOT MET, proceed to Step 4.*

  3.  **STEP 3: PLURALISM SCREEN - RULING OUT KEY ALTERNATIVES**
      *   **Question:** Given evidence *for* adaptation (Step 2), is there strong positive evidence *ruling out* major non-adaptive explanations for the trait's origin or current form? (G-L: Burden of proof is on adaptationist claim).
      *   **Evidence Adequate for Magazine:** Positive arguments *against* the most plausible alternatives:
          *   **Exaptation/Co-option:** Evidence against the trait having a different original function (e.g., fossil/paleo evidence, developmental patterns showing prior utility).
          *   **Spandrel/Byproduct:** Evidence against the trait being a necessary consequence of development, architecture, or selection *on another trait* (e.g., no tight developmental linkage, trait varies independently).
          *   **Constraint:** Evidence against the trait form being strongly limited by physics, development, or history (e.g., viable alternative forms exist in related species or mutants).
          *   **Drift:** Evidence against the trait being selectively neutral (e.g., trait shows evidence of stabilizing or directional selection, not just variation; functional importance demonstrated).
      *   **Revise/Reject Without Review:** No attempt made to address plausible alternatives; evidence *for* adaptation equally supports a plausible alternative (e.g., trait could easily be a byproduct). *REVISE (require discussion of alternatives) or REJECT.*
      *   **Escalate:** Plausible alternatives exist, and evidence for/against them is complex or requires specialist knowledge to weigh (common in human behavior/cognition, complex structures).
      *   **Judgment/Failure Point:** Identifying the *most plausible* alternatives requires biological intuition. Non-specialists may miss subtle constraints or byproduct relationships. *Proceed to Step 5.*

  4.  **STEP 4: POSITIVE EVIDENCE FOR NON-ADAPTIVE EXPLANATIONS (If Step 2 Threshold NOT Met)**
      *   **Question:** If evidence *for* adaptation is insufficient (Step 2), is there positive evidence supporting a specific non-adaptive explanation (Exaptation, Spandrel, Constraint, Drift)?
      *   **Evidence Adequate for Magazine:** Requires positive evidence *for* a specific alternative:
          *   **Exaptation:** Evidence of a different original function (comparative, fossil, developmental).
          *   **Spandrel/Byproduct:** Evidence of tight developmental/architectural linkage to another selected trait; trait appears as necessary consequence.
          *   **Constraint:** Evidence of physical/developmental impossibility of alternative forms; phylogenetic inertia.
          *   **Drift:** Evidence of neutrality (e.g., lack of correlation with environment/function, molecular clock consistency, population bottlenecks), *especially when coupled with* evidence *against* adaptation (e.g., no fitness benefit shown).
      *   **Revise/Reject Without Review:** Only negative evidence (lack of support for adaptation) without positive evidence for a specific alternative. *REVISE (require positive evidence for non-adaptive claim) or REJECT.*
      *   **Escalate:** Evidence for non-adaptive factors is complex, involves multiple interacting factors, or requires specialist knowledge (e.g., quantitative genetics models for drift vs. constraint).
      *   **Judgment/Failure Point:** Distinguishing "no evidence for adaptation" from "evidence *for* non-adaptation" is crucial. Non-specialists may conflate them. Strong evidence *against* adaptation combined with plausibility of an alternative can be persuasive but requires care. *Proceed to Step 5.*

  5.  **STEP 5: HOLISTIC ASSESSMENT & DECISION**
      *   **Question:** Synthesizing Steps 1-4 (or 1 & 4), considering the strength and coherence of the evidence, the plausibility of alternatives addressed (or not), and the specific context of the claim (e.g., human behavior, visual appeal), what is the appropriate action?
      *   **Conditions:**
          *   **Accept:** Strong evidence for adaptation *and* key alternatives ruled out (Steps 1-3 passed robustly). OR Strong positive evidence for a well-articulated non-adaptive explanation where adaptation evidence is weak/lacking (Steps 1 & 4 passed robustly). Claim is clear, evidence sufficient for magazine level.
          *   **Revise:** Evidence promising but incomplete or flawed:
              *   Adaptation claim lacks one key evidence type (Step 2) but others are strong; requires acknowledging gaps/alternatives.
              *   Non-adaptive claim needs stronger positive evidence (Step 4).
              *   Plausible alternatives not addressed sufficiently (Step 3).
              *   Overstatement of certainty ("evolved *for*" vs. "may function as", "could be explained by").
          *   **Reject:** Fundamental implausibility (Step 1). Insufficient evidence for *any* specific explanation (Adaptation or non-Adaptation) after screening (Steps 2 or 4 failed, revision impossible). Evidence fundamentally flawed or misinterpreted.
          *   **Escalate:** Ambiguous outcome; high-stakes claim (cover story, controversial topic); credible arguments exist for conflicting interpretations; complex interaction of factors; requires specialist input on evidence interpretation.
      *   **Judgment/Failure Point:** This step *requires* editorial judgment. Weighing the totality of evidence, the severity of gaps, the plausibility of alternatives, and magazine context (accuracy vs. appeal) cannot be eliminated. Most likely to misfire under commercial pressure or when complex interactions are oversimplified.

  ---

  **Application to Stylized Submissions**

  **Case 1: Lizard Throat Fan Color for Predator Deterrence**
  *   **Step 1 (Function):** Plausible. Function (deter specific bird predator) & agent specified. *Pass. Proceed.*
  *   **Step 2 (Adaptation Evidence):** Claim: Within-pop correlation + single clay model exp. **Threshold NOT Met.**
      *   Has Manipulation (clay model) - Shows *potential* function/deterrence effect.
      *   *Lacks* Comparative (no other pops/species), Heritability/Selection (no trait variation linked to fitness), Optimality (not addressed).
      *   **Result:** Only one type of evidence (Manipulation). Threshold requires TWO. *FAIL Step 2. Proceed to Step 4.*
  *   **Step 4 (Non-Adaptive Evidence):** Pitch provides no positive evidence for exaptation, spandrel, constraint, or drift. Only negative (lack of other adaptation evidence). *FAIL Step 4.*
  *   **Step 5 (Decision):** Evidence insufficient for adaptation claim (Step 2 Fail). No positive evidence for non-adaptive claim (Step 4 Fail). Senior staff favor/cover potential creates pressure. **Judgment:** *REVISE* strongly. Require: Comparative data (is fan color correlated with predator presence across pops/species?), evidence on heritability/fitness link (even if proxy), or explicit discussion of alternatives (e.g., is it a signal for something else? Could color variation be drift?). Cannot support "evolved *for*" claim as-is. **Contrary to Preference:** Forces revision/rejection despite cover story appeal.

  **Case 2: Human Humming for Social Cohesion**
  *   **Step 1 (Function):** Plausible. Function (promote ancestral group cohesion) & general pressure (sociality) specified. *Pass. Proceed.*
  *   **Step 2 (Adaptation Evidence):** Claim: Cross-cultural survey + lab mood study. **Threshold NOT Met.**
      *   *Lacks* Manipulation (no fitness impact test), Comparative (limited utility for uniquely human traits; no primate homology?), Heritability/Selection (no link to fitness, even modern proxy), Optimality (not addressed). Survey & mood study show correlation/current effect, not evidence of *evolutionary adaptation*. Lab mood ≠ ancestral fitness.
      *   **Result:** No clear evidence types meet threshold. Correlation/current effect insufficient. *FAIL Step 2. Proceed to Step 4.*
  *   **Step 4 (Non-Adaptive Evidence):** Pitch provides no positive evidence for exaptation (e.g., derived from breathing control?), spandrel (byproduct of vocal learning/rhythm processing?), constraint, or drift. *FAIL Step 4.*
  *   **Step 5 (Decision):** Insufficient evidence for adaptation (Step 2 Fail). No evidence for specific non-adaptive origin (Step 4 Fail). Human cognition hard case. **Judgment:** *REVISE* or *REJECT*. Revision must reframe: Humming *may* foster cohesion *now* (supported by survey/lab), but its *evolutionary origin* is unclear. Discuss plausible alternatives explicitly (spandrel of vocal learning, exaptation from parent-infant interaction?). Avoid "evolved *for*". If unwilling, reject.

  **Case 3: Cave Fish Eye Loss via Drift & Tradeoffs**
  *   **Step 1 (Function):** N/A. Pitch argues *against* a function (direct selection *for* eyelessness) and *for* non-adaptive explanations. Plausible that eye loss could save energy (tradeoff). *Pass. Proceed.* (Note: Screening non-adaptive claim starts here).
  *   **Step 2 (Adaptation Evidence):** Pitch *denies* adaptation is the best explanation. Screening focuses on evidence *for* the non-adaptive claim. *Skip Step 2/3, proceed directly to Step 4.*
  *   **Step 4 (Non-Adaptive Evidence):** Claim: Comparative pops (eyed surface vs. blind cave), Breeding expts (show heritability/pathway), Metabolic cost estimates.
      *   **Positive Evidence For:**
          *   **Drift:** Comparative data (blindness only in isolated pop) *suggests* possible neutrality/isolated evolution. Breeding expts show variation is heritable (prerequisite for drift). (Ideally needs molecular/pop gen evidence for true drift, but comparative+heritability is *suggestive* positive evidence).
          *   **Constraint/Tradeoff:** Metabolic cost estimates provide *positive evidence* for a tradeoff (energy saved = potential selective pressure *against eyes* in cave, but *not for* blindness per se). Breeding expts likely show developmental linkage (constraint).
      *   **Evidence Against Adaptation:** Comparative data (no predators/light requiring eye loss? - implies *lack* of strong *positive* selection *for* loss), Metabolic costs (counters "advantage" of loss beyond saving energy).
      *   **Result:** Positive evidence for Constraint/Tradeoff (strong: breeding + costs) and suggestive evidence for Drift (comparative + heritability). Adequate for magazine-level claim that drift & tradeoff > direct selection *for* eyelessness. *PASS Step 4.*
  *   **Step 5 (Decision):** Positive evidence for non-adaptive factors (drift/constraint/tradeoff) exists (Step 4 Pass). Pitch appropriately frames explanation as pluralistic ("largely by... rather than direct selection"). **Judgment:** *ACCEPT* (potentially with minor revisions for clarity on the interaction drift/tradeoff). Well-supported example of non-adaptive explanation.

  ---

  **What the Procedure Cannot Accomplish:**

  1.  **Replace Specialist Expertise:** It cannot deeply evaluate the *quality*, methodology, or statistical validity of cited evidence within the 40-minute limit. It relies on the pitch's representation.
  2.  **Resolve Fundamental Ambiguities:** It cannot definitively settle cases where evidence is genuinely ambiguous or multiple factors strongly interact without clear primacy.
  3.  **Eliminate Judgment:** Critical points (plausibility, evidence sufficiency, holistic decision) inherently require editorial judgment, especially under commercial pressure.
  4.  **Prove Negatives:** It cannot definitively *prove* a trait is *not* an adaptation; it assesses the strength of evidence *for* specific adaptive or non-adaptive claims.
  5.  **Handle Novelty Perfectly:** Truly novel mechanisms or functions might be incorrectly flagged as implausible in Step 1.
