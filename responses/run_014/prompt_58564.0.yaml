  Notably, the user hasn't mentioned existentialist thought (Sartre's radical choice) or narrative identity theories (Ricoeur) - I'll hint at those connections without citations since they requested no bibliographies. The avoidance of empirics/modeling suggests they want pure conceptual analysis. 

