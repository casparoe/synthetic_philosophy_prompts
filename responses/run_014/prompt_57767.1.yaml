prompt: |-
  I am a software engineer at a mid-sized SaaS company. I have no training in philosophy or history; my only exposure to either is a popular book on ancient Greek historiography that I read and annotated last year. My recollection, which may well be garbled, is that Herodotus recorded rival versions of events side by side and sometimes noted which ones he did not accept, while Thucydides claimed to have refused the first account he heard, to have checked participants' reports against one another as far as he could, to have conceded that witnesses contradicted each other in proportion to their loyalties and their memories, and to have admitted that the speeches in his history were partly his own composition, written to fit the occasion while keeping to the general sense of what had been said. If I have any of that wrong, correct me before building on my version.

  Here is the job. I own the post-incident timeline. Two to four times a month I have to reconstruct what happened during an outage from fragments: automated telemetry, which is direct observation but is instrumented by us and can itself be lying; a customer's message in a shared channel; a support engineer's paraphrase of a phone call; a third-party status page; a vendor's root-cause summary issued six weeks later; a post from someone claiming to work at a competitor; an on-call engineer's recollection taken the next morning; and our own changelog and runbook entries, which are written to a house style. That timeline is read by executives and by customers, and it assigns cause. Separately, in the first twenty minutes of a suspected incident I make paging decisions, when nearly everything I have is secondhand. Time budget: about twenty minutes per report for triage, a few hours for the full timeline. Audience: engineers who will abandon any document that reads like a humanities seminar.

  I want a procedure, not an essay. A numbered sequence of tests I can run on each candidate piece of evidence, in order, where each test states the question to ask, what counts as a sufficient answer, what to do when the answer is unavailable in the time I have, and the test's characteristic failure mode — the kind of evidence it systematically over-trusts or under-trusts. Build in the following six items, which are my own half-formed attempts and should be revised, kept, or discarded on the merits:

  1. A notation for evidential status, short enough that engineers will actually type it, distinguishing instrumented observation, first-person human observation, report of a report, my own inference bridging a gap, and boilerplate present only because our template asks for it. Be blunt about the fact that most of what I publish is the fourth and fifth category wearing the costume of the first.

  2. A contamination test. My current rule of thumb, which I suspect is wrong, is that two independent reports confirm a fact. In practice the upstream source is often one status page, one thread, or one post, so two reports is one report counted twice. Give me a way to look for a shared ancestor using nothing but the reports in front of me — no tooling, no graph database.

  3. Rules for interest and embarrassment. Reports seem more credible when they cost the reporter something: a customer admitting their own misconfiguration, an engineer naming their own service. But people also under-report causes that would embarrass their team, and our template rewards a tidy single cause. Tell me how to weigh the direction of a source's incentives without collapsing into discounting everything anyone says about their own conduct.

  4. Access versus inference: whether a source was positioned to observe the thing it reports, or is reasoning about it. Most reports I receive fuse the two inside a single sentence. I want a way to split them apart in under a minute per report, plus a rule for the confident inference offered by a source with excellent access.

  5. Genre. Our changelog, a vendor's root-cause analysis, a customer's complaint, and a runbook are different kinds of document with different conventions about what must be said. Tell me which conventions count as evidence and which are furniture.

  6. The reconstruction problem. Thucydides's speeches are the analogy I keep returning to: I write fluent connective narrative between the attested facts and readers cannot tell where the attestation stops. Give me a marking convention that keeps the document readable, and tell me whether the convention is worth having if it makes the timeline uglier and executives skim past it.

  Then run the whole procedure on three cases, showing the tests firing in order.

  (a) 3 a.m. The only signals are one customer report in a shared channel and a flat line on a dashboard that turns out to belong to a service we redeployed an hour earlier. Forty minutes later a second customer reports the same symptom; support tells me they had read the first customer's message before writing theirs. Do I page? If the procedure and my gut disagree, say which one the procedure should override and why.

  (b) Six weeks after an incident, a vendor delivers a polished root-cause analysis naming one of our components as the trigger. Our own telemetry from the window partly contradicts it — but that telemetry was sampled at one-minute granularity, and the vendor's engineers were on the call in real time.

  (c) The case I expect to dislike. An outage whose cause is attested only by a very senior engineer's recollection, offered five weeks later, with no surviving logs, in a review where everyone else nods along because they trust him. The procedure should be willing to record that the cause is unestablished. Tell me what the document ought to say in place of a cause, in language that survives an executive read.

  Finally, close with a short limits section: which of items 1 through 6 are load-bearing and which are academic; which distinction from source criticism genuinely cannot survive translation into a twenty-minute engineering workflow; where the procedure will misfire in a way that yields a confident wrong timeline; and an explicit list of every step that is a judgment call dressed as procedure. No reading list, no references, no titles or authors — I cannot look anything up during an incident and my team would not read it anyway. Assume I know nothing beyond what I have stated here.
reasoning: |-
  We are designing a practical procedure for evidence evaluation in incident timelines. The procedure must be step-by-step, with tests that are quick to apply and yield actionable results. We'll incorporate and refine your six items.

  Procedure: Evidence Evaluation for Incident Timelines

  Notation: We need a compact notation for evidential status. Use:
  - [I]: Instrumented observation (direct from telemetry, logs)
  - [H]: First-person human observation (eyewitness account by someone present)
  - [R]: Report of a report (hearsay, secondhand information)
  - [B]: Boilerplate (required by template but not evidence-based)
  - [G]: Gap-filling inference (your own reasoning to connect dots)

  We accept that [G] and [B] are common but must be clearly marked.

  Test Sequence:

  1. **Source Independence Test (Contamination Check)**
     - Question: Are these two reports independent or do they share a common source?
     - How to check: Look for shared language, timing (did one report come out before the other?), and attribution. Ask: "Could Report B have been influenced by Report A?" If both reports cite the same upstream source (e.g., a status page URL, a tweet, a chat message) or if one report references the other, they are not independent.
     - Sufficient answer: Independence if no shared source and no opportunity for contamination (e.g., two customers reporting the same symptom from different locations without seeing each other's reports).
     - If unavailable: Treat as potentially contaminated. Default to one report until independence is proven.
     - Failure mode: Over-trusts multiple reports that are actually echoes of one source. Under-trusts genuinely independent reports when contamination is suspected but unproven.

  2. **Incentive Alignment Test (Interest and Embarrassment)**
     - Question: What incentives does the source have? Does reporting this fact cost them (embarrassing) or benefit them (self-serving)?
     - How to check: Look for:
       - Admissions against interest (e.g., "our team made a mistake") → higher credibility.
       - Self-exonerating statements (e.g., "it wasn't our fault") → lower credibility, especially if it shifts blame.
       - Neutral statements (no clear gain/loss) → moderate credibility.
     - Rule: Trust admissions against interest more. For self-serving statements, require corroboration. Do not reject a statement solely because of incentives, but adjust confidence.
     - If unavailable: Treat as neutral.
     - Failure mode: Over-trusts self-deprecating sources (who might be covering for others) and under-trusts self-serving sources who might be right.

  3. **Access vs. Inference Test**
     - Question: Did the source directly observe the event, or are they inferring it?
     - How to check: Look for verbs of observation ("saw", "heard", "measured") vs. inference ("think", "believe", "probably", "due to"). Also, consider the source's position: were they present?
     - Rule: Split the report: if a sentence mixes both, mark the part that is observed and the part that is inferred. For a source with excellent access (e.g., a system they own) making a confident inference, treat it as [H] if the inference is about their own system's state, but [G] if about external factors.
     - Time budget: <1 minute per report. Focus on key claims.
     - Failure mode: Over-trusts confident inferences from authoritative sources; under-trusts indirect observations that are actually well-founded.

  4. **Genre Convention Test**
     - Question: What are the document's conventions, and which parts are evidence vs. filler?
     - How to check:
       - Changelog: Lists changes; evidence = what changed, when. Furniture: why it was changed (unless backed by [I] or [H]).
       - Vendor RCA: Evidence = specific observations and actions taken. Furniture: apologies, promises of future fixes.
       - Customer complaint: Evidence = symptoms observed, time. Furniture: emotional language, demands.
       - Runbook: Evidence = steps executed (if timestamped). Furniture: pre-written explanations.
     - Rule: Extract the evidence parts and mark the rest [B]. Ignore furniture for causal attribution.
     - Failure mode: Over-trusts boilerplate in formal documents; under-trusts emotional reports that contain real evidence.

  5. **Gap-Filling Marking Convention (Reconstruction Problem)**
     - Notation: In the timeline, use:
       - **Bold** for attested facts ([I], [H]).
       - *Italics* for [G] (your inferences).
       - Plain text for [R] and [B].
       - Use [I], [H], etc., in parentheses after the fact for the source type.
     - Example: "10:05: Service X latency spiked to 2s [I]. *This caused the timeout in Service Y [G].* 10:07: Customer reported error [H]."
     - Rule: If the document becomes too ugly, sacrifice some [B] and [R] markings but never remove [G] marking. Executives may skip, but engineers need it.
     - Worth it? Yes, because unmarked [G] is a lie. If executives skim, that's acceptable; the goal is to be honest and useful for engineers.

  6. **Corroboration Threshold (Replaces your "two independent reports" rule)**
     - After applying tests 1-4, require:
       - For a fact to be "confirmed": at least two independent sources of type [I] or [H] that pass the contamination test, or one [I] plus one [H] that agree.
       - For a fact to be "probable": one [I] or [H] that passes incentive and access tests, or two non-independent but high-quality reports.
       - Otherwise, mark as [G] if you are inferring, or leave out.

  Now, apply the procedure to the cases:

  Case (a): 3 a.m. Page?
  - Signals: 
    - Customer 1 report: [R] (because it's in a shared channel, and you didn't observe it directly) but treat as [H] for the customer's observation of symptoms.
    - Dashboard flat line: [I] (but note: it belongs to a redeployed service – is that the cause?).
  - Contamination: Customer 2 report is [R] and support says they saw Customer 1's message. So, not independent. Only one independent symptom report (Customer 1) and one [I] (dashboard).
  - Incentive: Customer reports are against their interest (they want the service up) → credible.
  - Access: Customer 1 observed symptoms → good access. Dashboard: instrumented, but might be misconfigured (redeployment).
  - Genre: Customer message – evidence: symptom and time. Dashboard: evidence of state.
  - Corroboration: One [H] (Customer 1) and one [I] (dashboard) – but they don't directly confirm the same fact. The dashboard shows a problem in one service, but the customer reports might be about a different symptom.
  - Gap: You infer that the redeployment caused the flat line and the customer symptom? [G]
  - Procedure: Page if the symptom is severe and the [I] plus [H] suggest an active incident. But note: the dashboard flat line might be expected (after redeployment). Check: was the redeployment intended to cause downtime? If not, page. The procedure says: with one credible [H] and an [I] that might be related, and no clear benign explanation, page. Override gut if gut says "don't wake people for a fluke" – but the procedure errs on the side of paging because contamination doesn't make the symptom false, only less corroborated. Here, the dashboard is independent and shows a problem. Page.

  Case (b): Vendor RCA vs. Our Telemetry
  - Vendor RCA: [R] (it's their report to you) but we'll treat as [H] for their engineers' observations during the incident? Not quite: it's a polished document, so apply Genre test.
    - Genre: Vendor RCA. Evidence: specific observations by their engineers (if they were present) → mark as [H] for those parts. Inferences about cause → [G] or [R]? Since they were on the call, we might treat their direct observations as [H] but their causal attribution as [G].
    - Access: They were on the call → good for real-time events they witnessed. But the RCA might include inferences.
    - Contamination: Not applicable (single source).
    - Incentive: They name our component → might be self-serving? But also, if they are reputable, it might be against their interest to blame a customer? Weigh: if they admit their own fault, high credibility; if blaming others, lower. Here, they blame us → moderate credibility (requires corroboration).
  - Our telemetry: [I] but sampled at 1-min granularity → might miss short spikes.
  - Conflict: Vendor says event X at time T, our telemetry doesn't show X at T.
  - Procedure: Split the vendor RCA into parts. For the event they claim: 
    - If they have direct observation ([H]) and our telemetry ([I]) conflicts, consider:
      - Granularity: Our telemetry might have missed it.
      - Time sync: Are clocks aligned?
    - Mark vendor's direct observation as [H] but note conflict. Their causal inference (that our component triggered it) is [G] (their inference) and our telemetry contradicts it → not confirmed.
    - Outcome: In the timeline, state: "Vendor engineers reported [event] at [time] [H], but our telemetry [I] at 1-min granularity did not capture this event. Vendor attributes the incident to [our component] [G, by vendor]. This attribution is not confirmed by our data."

  Case (c): Senior Engineer's Recollection
  - Only evidence: Senior engineer's recollection [H] but five weeks later → memory decay.
  - No logs, no corroboration.
  - Incentive: Might be protecting team or self? Or might be honest. But without evidence, we cannot confirm.
  - Genre: Review meeting → the recollection is [H] but note the delay.
  - Procedure: 
    - Access: He was present → good.
    - But no corroboration and high incentive to shape narrative → low confidence.
    - Corroboration threshold: Only one [H] source, no [I]. Mark as [G] if you use it, but better to mark as unconfirmed.
    - Reconstruction: Do not state as fact. In the document: "The root cause could not be definitively established due to lack of contemporaneous data. Based on retrospective accounts, one hypothesis is [recollection] [G, by engineer X]. However, without logs or other evidence, this remains unverified."
    - For executives: "Root cause: Inconclusive. Leading hypothesis: [brief summary of recollection] (unverified)."

  Limits Section:
  - Load-bearing: 
    1. Notation (essential for honesty). 
    2. Contamination test (avoids false corroboration). 
    3. Incentive test (crucial for human sources). 
    4. Access vs Inference (prevents overtrusting inferences). 
    5. Genre (avoids mistaking boilerplate for evidence). 
    6. Gap-filling marking (essential for integrity).
  - Academic distinctions that might not survive 20-min workflow: 
    - Deep historical source criticism (e.g., analyzing author's worldview) is too slow. 
    - In 20 minutes, you can't trace every report to its ultimate source; the contamination test is a heuristic.
  - Judgment calls dressed as procedure: 
    - Incentive test: Deciding "against interest" is subjective. 
    - Genre test: Separating evidence from furniture requires judgment. 
    - Corroboration threshold: How much evidence is enough is context-dependent.
  - Where it misfires: 
    - Confident wrong timeline when: 
      - All sources are contaminated but appear independent (e.g., a rumor spreads fast and is reported independently). 
      - Incentives are misread (e.g., a source admits fault to cover a bigger issue). 
      - Genre conventions are misunderstood (e.g., taking a vendor's apology as admission of fault).

  Final Procedure Steps for Each Evidence Piece:
  1. Apply notation: Mark [I], [H], [R], [B], or [G] (for your own inferences).
  2. Check for contamination (if multiple reports: are they independent?).
  3. Assess incentives (against interest, self-serving, neutral).
  4. Split access vs. inference in the report.
  5. Apply genre conventions to extract evidence.
  6. When writing the timeline, use bold/italics and notations to mark attested vs. inferred.
  7. Corroborate: Only use "confirmed" facts with two independent high-quality sources.

  This procedure is designed to be fast, with most tests taking seconds to a minute per piece of evidence. It prioritizes clarity and honesty in the timeline while accepting the constraints of an engineering environment.
answer: |-
  Below is a practical, step-by-step evidence evaluation procedure for incident timelines. It incorporates your six requirements as revised tests, optimized for speed (applied in <1 minute per evidence piece), engineer-friendly notation, and explicit handling of uncertainty. The procedure is designed for your 20-minute triage and few-hour timeline builds. Tests are ordered by speed and failure impact—perform them sequentially. If a test's answer is unavailable within 15 seconds, skip it (noted per test).

  **Core Notation for Evidential Status (Item 1)**  
  Use these symbols **in all documents and timelines**. Engineers only need to type 1–2 characters:  
  - `[I]` Instrumented observation (logs, telemetry, dashboards).  
  - `[H]` First-person human observation (eyewitness: "I saw X").  
  - `[R]` Report of a report (hearsay: "Customer said X").  
  - `[G]` Your gap-filling inference (connective tissue you create).  
  - `[B]` Boilerplate (template-mandated text with no evidence).  
  **Rule**: Label every fact in your timeline with these. If unlabeled, readers assume `[I]`. Admit that 80% of typical timelines are `[G]` or `[B]` disguised as `[I]`.  

  ---

  ### Evidence Evaluation Procedure: 6 Tests  
  *Apply these to each piece of evidence as you collect it. Run tests 1–4 during triage (first 20 min); tests 5–6 during timeline build.*

  1. **Independence Test (Contamination Check - Item 2)**  
     - **Question**: Does this report share a common source with another?  
     - **Check**: Scan for 3 red flags:  
       - Identical phrasing (e.g., "API returned 500" in both).  
       - Reference to a shared artifact (e.g., both cite "Status Page X" or "Thread Y").  
       - Temporal proximity + low originality (e.g., two customer reports within 5 minutes; second uses same examples as first).  
     - **Sufficient answer**: "Independent" only if zero red flags and sources are unrelated (e.g., two customers in different industries).  
     - **Unavailable**: Skip after 15 sec. Default to "contaminated" if uncertain.  
     - **Failure mode**: Over-trusts crowds (e.g., 10 `[R]` reports all echoing one tweet). Under-trusts genuinely independent sources that share jargon (e.g., two engineers coincidentally using "cache failure").  
     - **Output**: Tag evidence as `IND` (independent) or `CONT` (contaminated). Never treat `CONT` as corroboration.

  2. **Pain Test (Interest/Embarrassment - Item 3)**  
     - **Question**: Does admitting this fact cost the source something?  
     - **Check**: Ask: "If false, would this make the source look incompetent, negligent, or costly to fix?" If yes, it's high-pain. Examples:  
       - High-pain: "Our team caused the outage," "I ignored the alert."  
       - Low-pain: "The network was slow," "Vendor X failed."  
       - Neutral: Timestamps, metrics.  
     - **Sufficient answer**: High-pain if source admits fault or error; low-pain if it blames external factors; neutral if objective.  
     - **Unavailable**: Skip after 15 sec. Default to "neutral."  
     - **Failure mode**: Over-trusts self-flagellation (e.g., a junior engineer over-confessing). Under-trusts low-pain truths (e.g., a vendor correctly blaming their own hardware).  
     - **Rule**: High-pain claims get +1 credibility but require no corroboration. Low-pain claims require `[I]` or 2x `IND` reports. Ignore incentives if evidence is `[I]`.

  3. **Access/Inference Split Test (Item 4)**  
     - **Question**: What part is observed vs. inferred by the source?  
     - **Check**: Underline verbs in the report:  
       - Access words ("saw," "heard," "logged"): Mark as `[H]` or `[I]`.  
       - Inference words ("think," "likely," "because"): Mark as `[G]` (their gap-fill).  
     - **Sufficient answer**: Split sentences. E.g., "I **saw** the server crash (`[H]`), so I **think** it was overloaded (`[G]`)."  
     - **Unavailable**: Skip after 30 sec. Default to `[R]` (assume inference-heavy).  
     - **Rule for strong access**: If source has direct control (e.g., a service owner reporting their own system's state), treat their inference as `[H]`, but only for their domain.  
     - **Failure mode**: Over-trusts "confident" inferences from seniors. Under-trusts vague-but-accurate reports from juniors.

  4. **Genre Sanity Test (Item 5)**  
     - **Question**: Which parts are evidence vs. genre furniture?  
     - **Check**: Use this lookup table (memorize or pin to your desk):  
       | **Genre**          | **Evidence**                     | **Furniture (ignore)**               |  
       |---------------------|----------------------------------|--------------------------------------|  
       | Vendor RCA         | Timeline, actions taken          | Apologies, "we’ll improve" promises |  
       | Customer complaint | Symptoms, timestamps             | Ranting, demands                     |  
       | Changelog/Runbook  | What changed/executed            | Why changed, pre-written hypotheses |  
       | Engineer recollection | What they did/observed         | Why they think it happened           |  
     - **Sufficient answer**: Extract evidence column only. Tag furniture as `[B]`.  
     - **Unavailable**: Skip after 15 sec. Default to "assume 50% furniture."  
     - **Failure mode**: Over-trusts vendor RCA furniture (e.g., "root cause" sections). Under-trusts emotional customer reports that contain gold.

  5. **Corroboration Threshold (Replaces "two reports" rule)**  
     - **Apply during timeline build, post-triage**.  
     - **Rule**: A fact is "confirmed" only if:  
       - `[I]` + 1x `[H]` with `IND`, OR  
       - 2x `[H]` with `IND` and no conflict.  
       Else, mark as `[G]` (your inference) or omit.  
     - **Never use**: Contaminated reports (`CONT`), low-pain claims without `[I]`, or genre furniture as evidence.

  6. **Gap-Filling Marking (Reconstruction - Item 6)**  
     - **Convention**: Use **bold** for confirmed facts (`[I]`/`[H]` + corroborated). Use *italics* for `[G]` (your inferences). Keep `[R]`/`[B]` in plain text with symbols.  
     - **Example**: "**10:05: API latency spiked to 5s (`[I]`)**. *This triggered customer errors (`[G]`)*. 10:07: Customer reported outage (`[H]`)."  
     - **Is it worth it?** Yes. Executives will skim, but engineers need truth. If it looks "ugly," shorten `[G]` sections but never remove italics. Tradeoff: Better a skimmed honest doc than a believed lie.

  ---

  ### Procedure in Action: Case Studies  
  **Case (a): 3 a.m. Triage (Page?)**  
  - Evidence 1: Customer report ("Service down") → `[R]` (hearsay in channel).  
    - Test 1 (Independence): N/A (first report).  
    - Test 2 (Pain): High-pain (customer admits downtime).  
    - Test 3 (Access): "Service down" is inference; mark as `[G]` by customer.  
    - Test 4 (Genre): Evidence = symptom; furniture = none.  
  - Evidence 2: Dashboard flatline → `[I]`.  
  - Evidence 3: Second customer report → `[R]`.  
    - Test 1 (Independence): `CONTAM` (support admits they saw first report).  
  - **Triage decision**:  
    - Corroboration: Only one independent evidence of symptom (`[I]` dashboard + high-pain `[R]` from Customer 1).  
    - Your gut says: "Redeployment might explain dashboard, don’t page."  
    - **Procedure overrides gut**: Page. Why? High-pain `[R]` + `[I]` meets threshold for "possible incident." Redeployment is a `[G]` explanation (not confirmed yet).  
  - **Output**: Page with: "Observed: Dashboard failure (`[I]`) + customer report (`[R]`). Investigating redeployment link (`[G]`)."

  **Case (b): Vendor RCA vs. Telemetry**  
  - Evidence 1: Vendor RCA → Genre: Evidence = "Engineers saw event X at 10:05 (`[H]`)." Furniture = "Root cause was your component (`[B]`)."  
    - Test 2 (Pain): Low-pain (blames you).  
    - Test 3 (Access): Direct observation (`[H]`) for events; inference (`[G]`) for cause.  
  - Evidence 2: Your telemetry → `[I]` but 1-min granularity.  
  - **Contradiction**: Vendor claims event at 10:05:30; your telemetry shows normal at 10:05 and 10:06.  
  - **Procedure**:  
    - Vendor’s event observation is `[H]` but low-pain. Your telemetry `[I]` has coarse granularity → Not conclusive.  
    - Vendor’s root cause (`[B]`) is furniture → Ignore.  
    - **Timeline entry**: "**Vendor engineers observed event X at ~10:05 (`[H]`)**. *Our telemetry (`[I]`) at 1-min granularity did not capture X, but this is inconclusive (`[G]`). Vendor’s root cause attribution is unverified."  
  - **No blame assigned**. Telemetry granularity limits are noted.

  **Case (c): Senior Engineer’s Recollection**  
  - Evidence: Senior’s recollection → `[H]` (he was there).  
    - Test 2 (Pain): Neutral (describes cause without self-blame).  
    - Test 3 (Access): Direct for actions; inference for cause → Split: "I rolled back service (`[H]`)" vs. "It was a config error (`[G]` by engineer)."  
    - Test 1 (Independence): N/A (only report).  
  - **Procedure**:  
    - No `[I]`, no corroboration → Cause remains `[G]` (his inference).  
    - **Timeline entry for executives**: "**Engineer X performed rollback at 11:30 (`[H]`)**. *Leading hypothesis: Config error (`[G]` by Engineer X). No supporting logs; root cause unverified.*"  
  - **Key**: Use "unverified" and "hypothesis." Executives accept this; engineers see the gap.

  ---

  ### Limits of the Procedure  
  **Load-Bearing Tests (Never Skip)**  
  1. Notation (`[I]`/`[H]`/`[G]`): Without this, the timeline is fiction.  
  2. Genre Test: Avoids mistaking boilerplate for evidence.  
  3. Gap-Filling Marking: Critical for integrity.  

  **Academic Distinctions (Not Worth It in 20-Min Workflow)**  
  - Deep contamination tracing (e.g., "Who first tweeted this?"). Use the 15-sec heuristic.  
  - Thucydides-level source criticism (e.g., "Does this engineer have a bias pattern?"). Too slow.  

  **Where It Misfires**  
  - Confident wrong timelines when:  
    - All `[I]` is faulty (e.g., sampling obscures truth).  
    - High-pain lies (e.g., an engineer confesses to cover for a friend).  
    - Genre conventions are unknown (e.g., a new vendor’s RCA style).  

  **Judgment Calls Dressed as Procedure**  
  - Pain Test: "Does this *really* cost them?" (Subjective).  
  - Access Split: Deciding "observed vs. inferred" in messy reports.  
  - Corroboration Threshold: When to accept 1x `[H]` without `[I]` (e.g., in total log loss).  

  **Final Advice**  
  This is a toolbox, not a truth machine. Use tests 1–4 to triage, 5–6 to build. Revise notation if engineers reject it (e.g., drop `[B]` if unusued). When in doubt, mark `[G]` and move fast.
