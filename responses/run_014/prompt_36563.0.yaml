answer: |-
  ## MEMORANDUM  
  TO: Board of Trustees, State University System  
  FROM: Policy Advisory Team  
  SUBJECT: Analysis & Recommendation on SB-174 (Public University Tuition Phase-Out)  
  DATE: October 26, 2023  

  **RECOMMENDATION:** We recommend the Board endorse SB-174 *contingent upon* the legislature incorporating three critical safeguards: (1) A binding, inflation-adjusted minimum funding floor for university operating budgets, replacing lost tuition revenue dollar-for-dollar from general funds; (2) A requirement that the "high-earner surtax" demonstrably targets the top 15% of state income earners; and (3) The establishment of a joint legislative-board commission to monitor student engagement and outcomes, reporting annually. Without these conditions, the risks to institutional stability and program quality are significant. With them, the societal benefits of universal access outweigh the valid concerns about fairness and efficiency.

  ---

  ### I. UNDERLYING QUESTIONS: BRAINSTORMING KEY CONSIDERATIONS

  Before drafting our position, we rigorously examined the core philosophical and economic questions embedded in this debate. Here are the key considerations we identified:

  1.  **The Nature of Education as a "Good":**
      *   **Private Investment:** Education undeniably benefits the individual graduate through higher lifetime earnings, better health outcomes, and increased job satisfaction. This suggests individuals *should* bear some cost.
      *   **Public Good:** Education generates significant spillover benefits for society: a more productive workforce, lower crime rates, greater civic engagement, faster technological innovation, and a more adaptable economy. These benefits are non-excludable (everyone enjoys them regardless of who paid) and often non-rivalrous (my benefit doesn't diminish yours). This justifies collective funding.
      *   **Merit Good:** Society deems education intrinsically valuable and necessary for individual flourishing and informed citizenship, regardless of immediate economic return or personal demand. This often motivates public provision/subsidy.
      *   ***Conclusion:*** Higher education is a **hybrid good:** a significant private investment *creating* substantial public goods and merit good characteristics. Financing models must balance these facets.

  2.  **Fairness Between Stakeholders:**
      *   **Students vs. Non-Students:** Is it fair for taxpayers who never attend university to pay for those who do? Conversely, is it fair to burden students with debt for an education generating public benefits?
      *   **Graduates vs. Non-Graduates:** Graduates typically earn more. Should they pay more *back* into the system? The "janitor subsidizing the consultant" argument highlights this.
      *   **Intergenerational Fairness:** Current taxpayers fund future societal benefits. Is this a fair exchange across generations?
      *   ***Conclusion:*** Fairness requires examining *who pays* (progressive vs. regressive taxation) and *who benefits* (direct graduates vs. broader society). No model is perfectly "fair"; each prioritizes different equity dimensions (access vs. cost-recovery).

  3.  **Financing Models & Their Philosophies:**
      *   **German/Nordic Model (Tuition-Free + High Taxes):**
          *   **Philosophy:** Treats higher education primarily as a **public good/merit good** essential for societal well-being and equal opportunity. Access is a right, not contingent on wealth. The cost is socialized through progressive taxation.
          *   **Fairness Assumption:** Focuses on **ex-ante equality of access**. Everyone gets the same chance. The higher lifetime earnings of graduates are recouped via a progressive *general* tax system over their careers. The janitor might pay some tax towards universities, but benefits from living in a more educated, prosperous society, and the consultant pays significantly more income tax overall.
          *   **Key Concerns:** Potential for underfunding if political will wanes; risk of perceived devaluation by students ("free=worthless"); potential inefficiency if demand surges without corresponding funding/resource increases.
      *   **Tuition + Loans/Debt Relief Model (US/UK Approach):**
          *   **Philosophy:** Emphasizes higher education as a **private investment** with public good spillovers. Individuals bear significant upfront cost, mitigated by loans and targeted aid for the needy. Society subsidizes access for the poor and benefits from the spillovers.
          *   **Fairness Assumption:** Focuses on **ex-post cost recovery/progressivity**. Those who benefit most (graduates) pay more directly. Targeted aid minimizes burden on non-attendees/non-graduates. Income-contingent loans (ICLs) aim for fairness in repayment (you pay based on what you earn).
          *   **Key Concerns:** Upfront tuition creates a psychological and financial barrier, deterring qualified low-income students ("debt aversion"). ICLs are complex administratively. High debt burdens can delay life milestones (homeownership, family) and create hardship, even with ICLs. Targeting can miss the "squeezed middle."

  4.  **Operational Concerns:**
      *   **Budget Autonomy:** Reliance on state appropriations can make universities vulnerable to political pressure and budget cuts during downturns, potentially impacting academic freedom and long-term planning. Tuition provides a more stable, direct revenue stream.
      *   **Student Effort & Value Perception:** Does requiring payment (even via loans) create a stronger sense of ownership and commitment? Does "free" lead to complacency or lower completion rates? Evidence is mixed and culturally context-dependent.
      *   **Efficiency & Demand:** Will eliminating price signals lead to over-enrollment in programs with limited societal value or labor market demand? How will quality be maintained if funding doesn't keep pace with enrollment growth?

  ---

  ### II. ANALYSIS & RECOMMENDATION

  SB-174 proposes a fundamental shift, aligning our state with the German/Nordic philosophy of treating public university education as a universally accessible public good, funded collectively. The core argument for this model is powerful: **removing the upfront financial barrier maximizes equal opportunity and recognizes the broad societal benefits of an educated populace.** The cost of tuition, and the fear of debt, demonstrably deters talented students from lower-income backgrounds, regardless of loan availability or aid promises. This is a net loss for both those individuals and our state's human capital and economic potential. By making access truly universal, we invest directly in our collective future, fostering greater social mobility and a more robust, innovative economy that benefits *all* citizens, not just graduates. The proposed funding mix (general funds + high-earner surtax) aligns with the principle of progressive burden-sharing, where those with the greatest ability to pay contribute more.

  However, the concerns raised by other board members are serious and cannot be dismissed:

  1.  **The Regressive Transfer Argument (Strongest Counter-Argument):** The claim that "free tuition" represents a regressive transfer – where lower-income taxpayers subsidize the education of students who will likely become higher earners – has substantial merit. *This is not a strawman.* University graduates *do* disproportionately come from more affluent backgrounds, even with financial aid. Under this model, a low-wage worker *will* contribute some tax dollars towards a system they may never personally use, while the future high-earning graduate benefits directly. This is an inherent tension in universal, tax-funded programs.

      *   **Our Mitigation & Rebuttal:** This concern is valid but must be viewed holistically within the *entire* tax and social system.
          *   **Progressive Funding is Key:** The fairness critique hinges entirely on *how* the replacement revenue is raised. A flat sales tax increase *would* be regressive. SB-174's reliance on general funds (which include progressive income taxes) and a *specific high-earner surtax* is crucial. Our recommended condition strengthens this by demanding the surtax demonstrably targets the top earners. The goal is to ensure the primary burden falls on those most able to pay, including future high-earning graduates themselves via their lifetime income taxes.
          *   **Societal ROI:** The "transfer" isn't solely to the individual graduate. The janitor, the nurse, the small business owner all benefit from living in a state with: a larger pool of skilled workers driving economic growth (potentially leading to higher wages generally), more innovative businesses, lower social service costs, and a more engaged citizenry. The graduate's higher taxes over their lifetime also fund other essential services the janitor relies on (roads, healthcare, safety nets). This is **intergenerational and cross-class reciprocity.**
          *   **Access Expands the Beneficiary Pool:** While current enrollment skews affluent, eliminating tuition *is* the most effective way to significantly increase participation from underrepresented, lower-income groups over time, gradually making the direct beneficiary pool more representative. Targeted aid alone struggles to overcome deep-seated financial barriers and debt aversion completely.

  2.  **Budget Autonomy & Stability Risk:** Shifting reliance entirely to state appropriations creates significant vulnerability. Universities could face devastating cuts during economic downturns or if political priorities shift. This threatens program quality, faculty retention, research capacity, and long-term planning. Tuition revenue provides a more stable and independent foundation.
      *   **Our Mitigation:** This is the most significant operational risk. Our **first condition (binding minimum funding floor)** is non-negotiable. The state must commit, statutorily, to replacing lost tuition revenue dollar-for-dollar, adjusted annually for inflation and enrollment changes. This floor must be insulated from annual budget battles as much as possible. The Board must retain strong advocacy powers.

  3.  **Student Effort & Value Perception:** Will students value "free" education less, leading to lower engagement, higher dropout rates, or frivolous choices? While intuitive, evidence from Germany and Nordic countries generally doesn't show significantly lower completion rates compared to the US model. Cultural attitudes towards education and strong academic advising/support structures play larger roles. However, the *perception* risk exists.
      *   **Our Mitigation:** Our **third condition (joint monitoring commission)** is designed to proactively track this. We must monitor metrics like course completion, time-to-degree, and program selection rigorously. Universities should be empowered and funded to enhance academic advising, mentoring, and early intervention programs to support student success, fostering a culture of responsibility that isn't solely tied to financial cost.

  **Why Endorse Conditionally, Not Oppose?**

  Opposing the bill maintains a status quo with known, significant flaws: persistent access barriers for lower-income students and crippling debt burdens for many graduates. While the targeted loans/debt relief model tries to address this, it fails to eliminate the upfront barrier completely and creates its own administrative burdens and anxieties. The potential societal payoff of universal access – a larger, more diverse talent pool, increased innovation, greater social cohesion – is substantial.

  Endorsing unconditionally, however, ignores the very real risks of underfunding and the valid fairness concern about regressive funding. Our recommended conditions directly address these critical vulnerabilities:

  1.  **The Funding Floor** protects institutional quality and autonomy.
  2.  **The Progressive Surtax Requirement** ensures the funding model aligns with the principle of ability-to-pay, mitigating the regressive transfer concern.
  3.  **The Monitoring Commission** provides accountability for student outcomes and allows for data-driven adjustments if effort or efficiency issues emerge.

  **Conclusion:**

  The philosophical case for treating public higher education as a collectively funded gateway to opportunity and societal benefit is compelling. SB-174 aligns with this vision and offers the most direct path to removing the significant access barrier posed by tuition. While the "regressive transfer" argument against it is the strongest counter-point, a well-designed progressive funding mechanism, combined with the broader societal returns on investment, makes this model defensible and desirable. The risks to university budgets and autonomy are serious but can be managed with ironclad legislative commitments. The concern about student effort is manageable through proactive support and monitoring.

  Therefore, we urge the Board to endorse SB-174 *contingent upon* the inclusion of the specified conditions regarding guaranteed funding replacement, progressive surtax targeting, and ongoing outcomes monitoring. This provides a pathway to achieving the transformative goal of universal access while safeguarding institutional integrity and addressing core fairness and operational concerns. We must seize this opportunity to build a more equitable, prosperous, and resilient future for our state, but we must do so with our eyes wide open to the risks and a firm commitment to mitigating them.
