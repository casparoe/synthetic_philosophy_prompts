prompt: |-
  I have just had a long argument with a friend about whether equality should be understood as equality of welfare, resources, or capabilities. Please describe the most important implications of choosing among these three metrics for the design of a small university housing allocation policy, focusing on cases where the metrics rank the same individuals differently.
reasoning: |-
  Okay, the user just had a long argument with a friend about equality metrics and wants me to apply this to university housing allocation. Interesting pivot from abstract philosophy to concrete policy design. 

  First, let's unpack what's underneath this query. The user mentions a "long argument," which suggests this isn't just academic for them - there's probably emotional residue. They're likely seeking resolution through practical application. The choice of university housing as a case study is smart: it's bounded, has real-world constraints (budget, space), and involves competing values like fairness versus efficiency.

  Hmm... the three metrics they mention are classic - welfare (Sen's critique), resources (Rawlsian), capabilities (Sen's alternative). But in housing allocation, the devil's in the details. I should avoid rehashing their entire debate and focus where the metrics diverge practically. 

  Noticing they care about "cases where metrics rank individuals differently" - that's the goldmine. Like when a physically disabled student might rank low on resources (needs expensive modifications) but high on capabilities (small intervention unlocks independence). Or the anxious student where welfare-maximizing housing conflicts with resource equality. 

  The university context adds layers: Is this a luxury dorm or basic accommodation? Are we prioritizing academic outcomes? Student retention? The policy goals will shape which metric fits best. Should probably flag that upfront - no "correct" answer without knowing institutional values.

  Biggest trap to avoid: presenting this as purely technical. The metrics reflect different visions of justice. Resource equality feels "fair" until someone needs Braille signage to use the bathroom independently. Might subtly expose how capability theory emerged precisely because these conflicts kept arising in real policies. 

  ...Better structure this around concrete allocation dilemmas. The examples must feel visceral - like choosing between giving a wheelchair user a ground-floor room (capabilities) versus splitting that prime space between two abled students (resources). That's where the philosophy becomes tangible.
answer: |-
  Here's how each equality metric would shape university housing allocation, focusing on key differences in outcomes when the same students are ranked differently:

  ### Core Implications in Conflicting Cases
  1. **Disabled Student Needing Accessible Housing**
     - **Welfare**: Prioritize housing minimizing distress (e.g., avoiding stairs reduces anxiety).  
     - **Resources**: Assign same room type/resources as others (e.g., standard room on 3rd floor).  
     - **Capabilities**: Provide accessible ground-floor room *even if it costs more/resources are unequal*.  
     *Conflict:* Resources treats rooms equally; welfare/capabilities require unequal investment.

  2. **Anxious Student Requesting Single Room**
     - **Welfare**: Assign single room to maximize mental health and study focus.  
     - **Resources**: Assign same room type (e.g., double) as peers with equal room "value".  
     - **Capabilities**: Provide single room *only if* anxiety demonstrably impairs academic functioning.  
     *Conflict:* Welfare prioritizes comfort; capabilities require evidence of academic impact; resources ignore both.

  3. **Low-Income Student vs. Social Butterfly**
     - **Welfare**: Assign quiet study space to low-income student (high welfare gain from academic security) vs. social dorm for extrovert (high welfare from interaction).  
     - **Resources**: Assign identical room types regardless of personal traits.  
     - **Capabilities**: Prioritize low-income student if financial stress impedes academic capability.  
     *Conflict:* Welfare customizes for preferences; resources standardize; capabilities target academic barriers.

  4. **Student Needing Proximity to Medical Care**
     - **Welfare**: Assign nearby housing to reduce health-related stress.  
     - **Resources**: Assign room via lottery or equal cost.  
     - **Capabilities**: Assign proximity *only if* it enables attending classes/studies.  
     *Conflict:* Welfare addresses health comfort; capabilities focus on academic function; resources ignore need.

  ---

  ### Policy Design Implications
  | **Metric**       | **Housing Priorities**                     | **Trade-offs**                                  | **Administrative Challenges**              |
  |------------------|--------------------------------------------|-----------------------------------------------|-------------------------------------------|
  | **Welfare**      | Maximize happiness/well-being              | ↑ Subjective satisfaction<br>↓ Perceived fairness | Assessing subjective welfare; gaming preferences |
  | **Resources**    | Equal room value/type for all              | ↑ Transparency/fairness<br>↓ Responsiveness to needs | Ignores differential needs; may exacerbate disadvantages |
  | **Capabilities** | Enable academic participation/functioning  | ↑ Focus on empowerment<br>↓ Difficult to measure | Defining "capabilities"; complex individual assessments |

  ---

  ### Why Conflicts Matter
  - **Welfare vs. Resources**: Resources may force a diabetic student into a distant dorm (equal "resource"), harming welfare and capabilities.  
  - **Capabilities vs. Welfare**: An introvert might *welfare*-maximize with a single room, but *capabilities* might prioritize a disabled student needing space for equipment.  
  - **Resources vs. Capabilities**: A deaf student needs visual fire alarms (unequal resources) to achieve equal capability (safety awareness).

  ### Practical Recommendations
  1. **Hybrid Approach**: Use **capabilities** for defining minimum accommodations (disability, health), **resources** for standard allocations, and **welfare** for remaining preferences (e.g., roommate matching).  
  2. **Transparency**: Clearly state which metric governs different aspects (e.g., "Accessibility needs prioritized under capability framework").  
  3. **Trade-off Acceptance**: Acknowledge that no single metric satisfies all values – e.g., strict resource equality may violate capability fairness.

  **Bottom Line**: Choosing a metric determines whose disadvantages "count." Capabilities best addresses barriers to academic equality, resources appeals to procedural fairness, while welfare prioritizes lived experience – but conflicts reveal their philosophical stakes in concrete terms.
