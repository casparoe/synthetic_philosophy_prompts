prompt: |-
  My two friends Maya and Dev got into it after we saw a news story that a painting at our local museum had been reattributed — the master apparently only painted the faces, his workshop did everything else, and the museum had known for a decade without saying anything. The argument started about whether we'd been ripped off but quickly got more general.

  Maya's position was that the value of an original is basically causal: what we pay for, when we crowd around an original, is standing in front of the actual object the artist's hand produced, and a duplicate — even a molecule-for-molecule duplicate — just doesn't have that history. Dev said that's relic worship, no different from venerating a saint's fingerbone: everything we actually love about the painting is fully present in a good reproduction or a perfect copy, so the extra value has to be something we bring to it, not something in the picture. Maya replied that "something we bring to it" isn't a debunking — people also care whether they're hearing a live performance vs. a recording, and caring about the actual historical object isn't obviously irrational, just not aesthetic in the narrow sense. Dev then fired back with a swap case: suppose the museum secretly hung a perfect duplicate, kept the original in the vault, and nobody could tell even on close inspection. The visitors would be getting the full experience Maya says matters — same room, same light, paint strokes indistinguishable — so on her own account they lose nothing, yet everyone agrees they'd be wronged if the swap came out. Maya's answer was that they're wronged because they're deceived about history: what the object is connected to, not what it looks like, and the fact that people feel betrayed and no one thinks that feeling is silly is actually evidence for her side, not Dev's. Dev said that just shows provenance functions like a guarantee of authenticity — an invisible certificate — which is fine for the art market but can't be why the original matters to people who just want to look.

  Can you adjudicate this move by move — who's right at each step, and whether Maya's causal-history story or Dev's "it's all brought by us" story better fits the swap case? I couldn't tell whether Dev's swap argument actually works or whether Maya has a good reply to it. Lead with your bottom line in the first sentence, then give the reasoning, and don't restate the question back to me first.
reasoning: |-
  Okay, let me tackle this art authenticity debate between Maya and Dev. The user wants a clear adjudication of each move in their argument, especially regarding the swap case. 

  First, I need to map their core positions: Maya emphasizes causal history (the physical object's lineage matters intrinsically), while Dev argues value comes entirely from our perception and context. The swap case is the crux - where Dev thinks substitution proves value is subjective, while Maya counters that deception about history itself causes harm.

  For the initial "ripped off" concern: Maya's right that museums have an ethical duty for transparency, but both oversimplify value. Art value isn't binary; it's layered - historical significance (Maya's point) and aesthetic experience (Dev's point) coexist.

  When Maya distinguishes live performance from recording: She scores here. The analogy holds because both involve valuing the genesis of the experience, not just sensory output. Dev dismissing this as "relic worship" misses that historicity has legitimate non-religious value.

  Now the swap case - Dev's strongest move. His logic seems sound: if perception is identical, what's lost? But Maya's rebuttal about deception is crucial. The betrayal people feel isn't about aesthetics; it's about broken trust in the institution's role as history-keeper. This does support her claim that causal history has standalone value.

  Dev's "invisible certificate" reduction is weak here. Provenance isn't just paperwork; it's the actual chain of existence. People don't just want a guarantee - they want contact with the real historical object, however irrational that may seem to Dev.

  Final assessment: Maya wins the swap round because her historical-connection argument explains the visceral sense of betrayal better than Dev's subjectivism. The feeling isn't silly - it reveals how humans anchor meaning to material continuity. Both perspectives capture parts of art's value, but history isn't reducible to perception.
answer: |-
  **Bottom line: Maya has the stronger overall position, particularly in her rebuttal to the swap case, as the causal history of the artwork genuinely matters beyond aesthetics or deception, and Dev misinterprets the source of the "wronging" in the swap scenario.**

  Here’s the adjudication move by move:

  1.  **Initial "ripped off" argument:**  
      *   **Maya:** Partially right. The value of an original *does* derive partly from its causal history (the artist's direct touch). A molecule-for-molecule copy lacks this history, diminishing its unique value.  
      *   **Dev:** Partially right. Much of the *aesthetic* value (color, composition, technique) is indeed present in a perfect copy. However, he oversimplifies by dismissing the historical value as "relic worship."  
      *   **Adjudication:** Both capture aspects of value, but Maya identifies a real non-aesthetic value (historical genesis) that Dev dismisses too readily.

  2.  **Dev's "Relic Worship" vs. Maya's "Live Performance" Analogy:**  
      *   **Dev:** Wrong. Equating valuing the artist's handiwork to venerating a saint's bone is a false equivalence. Art's value is partly *about* human creation and skill in a way a relic's often isn't.  
      *   **Maya:** Right. The live performance vs. recording analogy is strong. It highlights that the value of an event or object can include its mode of creation and existence in history ("liveness," "authenticity"), not just sensory data. Caring about this isn't irrational; it's a different *kind* of value (historical, experiential) beyond pure aesthetics.  
      *   **Adjudication:** Maya successfully defends the legitimacy and non-silliness of valuing causal history.

  3.  **Dev's Swap Case Argument:**  
      *   **Dev:** Makes a clever but flawed move. He argues that if the experience (light, room, visual appearance) is identical, Maya's "causal history" value must be irrelevant since visitors get the experience she claims matters. The feeling of being "wronged" upon discovery, he claims, is just about deception regarding provenance as an "invisible certificate."  
      *   **Adjudication:** **Dev's argument fails.** He conflates the *aesthetic experience* (which visitors indeed get) with the *entire value proposition* of viewing an original. The swap *does* deprive visitors of what Maya values: encountering the actual historical artifact. Dev mistakenly thinks the "wronging" is solely about deception breaking a market guarantee.

  4.  **Maya's Rebuttal to the Swap Case:**  
      *   **Maya:** Right. Her reply is decisive. The visitors *are* wronged because they are deceived about the *history* of the object they are viewing. They came to see *Rembrandt's painting*, not a perfect copy. The value they sought (encountering the artist's actual work) was denied, even if the visual stimulus was identical. The intense feeling of betrayal *is* evidence that people care deeply about the object's real history and connection to the artist, validating her core claim. The deception matters precisely because the causal history matters intrinsically, not just as a certificate.  
      *   **Adjudication:** Maya accurately identifies the source of the wronging (denial of access to the historical object) and uses the visceral reaction as evidence *for* her causal-history thesis, directly countering Dev.

  5.  **Dev's "Invisible Certificate" Response:**  
      *   **Dev:** Wrong. Reducing provenance to a mere "guarantee of authenticity" for the art market misses Maya's point. Provenance *is* the history itself. People don't just want a guarantee; they want the *actual thing* the history belongs to. The feeling of connection to the artist or the past is tied to the *object's* identity, not just a label.  
      *   **Adjudication:** Dev fails to engage with Maya's core argument about the value residing in the object's history. His "invisible certificate" is a reductive mischaracterization.

  **Final Assessment:**  
  *   **Causal-History (Maya) vs. "Brought by Us" (Dev):** Maya's causal-history story better fits the swap case. The profound sense of betrayal stems from being denied access to the *actual historical artifact* they believed they were engaging with. Dev's subjectivist view ("it's all brought by us") cannot adequately explain why the deception about the object's *past* causes such outrage if the present experience is identical. The outrage confirms that the object's history *is* part of its value to viewers, independent of aesthetics or market guarantees.  
  *   **Swap Case Outcome:** Dev's swap argument does not work as a refutation of Maya. It backfires, becoming strong evidence *for* her position. Maya has the superior reply, correctly diagnosing the deception as being about history itself.
