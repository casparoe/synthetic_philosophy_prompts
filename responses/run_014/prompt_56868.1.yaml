answer: |-
  Here's my decomposed credence for Claim C, structured as requested. I'll avoid the both-sides shrug — you've earned rigor after that debate.

  **My Overall Credence in C: `0.35`**  
  (Where C = "In a typical informed disagreement about democratic backsliding where institutional facts are agreed upon, swapping partisan/ideological labels would cause at least one party to flip their verdict.")

  ---

  ### Core Decomposition (Multiplicative Interaction)  
  These probabilities reflect interdependent factors that *jointly* determine whether label-swapping flips verdicts. Think of them as filters: all must be "passed" for C to hold.

  1.  **`P1: Existence of a determinate core`**  
      *Credence: `0.70`*  
      Justification: Experts broadly converge on core anti-democratic acts (e.g., banning opposition parties, jailing journalists), but ambiguity exists at the edges (e.g., voter ID laws, NGO restrictions). Motivated reasoning exploits this ambiguity.

  2.  **`P2: Disagreement driven by weighting/severing borderline moves`**  
      *Credence: `0.75`*  
      Justification: Most real-world backsliding disputes center on *how severely* to weight ambiguous acts (e.g., is court-packing a `0.3` slide or a `0.9` rupture?), not core violations. Weighting is highly susceptible to partisan framing.

  3.  **`P3: Sensitivity to domestic stakes`**  
      *Credence: `0.85`*  
      Justification: Disagreements in polarized democracies (e.g., US) show *extreme* label-dependence vs. detached analyses (e.g., Hungary). Domestic actors anchor to "our side = legitimate hardball; their side = backsliding."

  4.  **`P4: Baseline manipulation`**  
      *Credence: `0.80`*  
      Justification: Unstated baselines ("backsliding relative to what?") dominate disputes. Swapping labels often swaps implicit baselines (e.g., "their purge vs. our necessary reform").

  **Combined Calculation**:  
  `P(C) = P1 * P2 * P3 * P4 = 0.70 * 0.75 * 0.85 * 0.80 ≈ 0.357 → **0.35**`  
  *(Multiplicative: each factor compounds the opportunity for label-swapping to flip verdicts.)*

  ---

  ### Key Sensitivity
  - **Most Sensitive to `P2 (Weighting Borderline Moves)`**  
    If evidence showed experts *agree on severity scores* for ambiguous tactics (e.g., court-packing always = `0.6` slide) regardless of partisan context, `P2` drops to `~0.30`, dragging `P(C)` to **`0.10`**. Current research (e.g., V-Dem expert surveys) shows high variance in severity ratings for "gray zone" tactics, suggesting this is the critical lever.

  ---

  ### Addressing Your Specifics
  **1. Your Proposed Instrument (Label-Swap Experiment)**  
  - **Diagnostic Value**: **High** for detecting partisan bias in *weighting*, even with noise.  
  - **Her Objection (Ratings Instability)**: Partly valid but overstated.  
    - *Why it works*: Systematic flip patterns (e.g., "Tactic X by Party A = backsliding, but identical Tactic X by Party B = hardball") reveal motivated reasoning *despite* individual noise. High flip rates (>40%) on borderline items would strongly support C.  
    - *Limitation*: Only measures *explicit* bias; won't catch deep ideological priors where actors genuinely believe their side's tactics are inherently legitimate. Still, for C, it's probative.  
  - **My Verdict**: Your design **is diagnostic**. Her critique reduces its precision but doesn't invalidate it for detecting flips.

  **2. Verbal vs. Partisan Disagreement**  
  - **Credence in Purely Verbal Disagreement** (Same facts, same actors, different label due to conceptual mismatch): **`0.40`**  
    Justification: Genuine definitional disputes exist (e.g., "Is illiberalism *always* backsliding?"), but in practice, these are often entangled with partisanship. Pure verbal disagreements are rare in elite discourse but possible in academic edge cases.

  **3. The 0.85 vs. 0.30 Gap**  
  The difference likely lives in:  
  - **Her focus on high-stakes cases** (e.g., US): Where `P3 ≈ 0.95` and flips are obvious.  
  - **Your focus on core consensus**: Where `P1` suggests some objectivity exists.  
  - **Underweighting baseline manipulation** (`P4`): If she assumes baselines are always partisan, `P4 ≈ 0.95` for her, inflating `P(C)`.  
  - **Overindexing on explicit hypocrisy**: She may equate *any* disagreement with partisan bias, neglecting genuine weighting ambiguities (`P2`).  

  **Bridge the Gap**: Show her cases where **detached experts agree** (e.g., "Orbán's early moves = backsliding, regardless of ideology") versus **polarized experts flip** (e.g., "SCOTUS reform under Democrats = backsliding, under Republicans = hardball"). The divergence in flip-rates between these scenarios isolates partisan bias.

  ---

  ### Summary
  - **`P(C) = 0.35`**: Label-swapping flips verdicts in about 1/3 of "typical" informed disagreements, primarily due to partisan weighting of ambiguous tactics (`P2`) and baseline selection (`P4`).  
  - **Your friend's `0.85` overestimates** by ignoring consensus on core violations and overgeneralizing from polarized contexts.  
  - **Your `0.30` is defensible** but slightly underweights how often domestic polarization (`P3`) infects even fact-agreed disputes.  

  To move my number: Demonstrate **consistent expert severity ratings for gray-zone tactics** across partisan contexts (lower `P2`), or prove **baselines are fixed conceptually** (lower `P4`). Until then, the evidence points to partisan lenses distorting borderline judgments.
