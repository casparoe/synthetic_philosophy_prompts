answer: |-
  Here's a precise comparison of Gricean conversational and conventional implicature, focusing on your specific queries regarding the mechanism of recovery, and addressing the core question about the status of conventional implicature:

  **Core Comparison:**

  | Feature                     | Conversational Implicature (CI)                                     | Conventional Implicature (ConvI)                                  |
  | :-------------------------- | :------------------------------------------------------------------ | :---------------------------------------------------------------- |
  | **(i) Source of Inference** | Pragmatic inference based on Cooperative Principle (CP) & maxims, contextual assumptions, and literal meaning. Generated by *how* something is said (e.g., flouting a maxim). | Lexically encoded meaning. Triggered directly by the **conventional meaning** of specific words or constructions (e.g., "but", "therefore", "even"). Decoded, not inferred. |
  | **(ii) Role of Mutual Knowledge/Convention** | **Essential:** Relies on mutual knowledge of CP/maxims, context, and speaker's likely adherence to rationality/cooperation. Inference is defeasible based on shared context. | **Minimal:** Relies *only* on mutual knowledge of the **linguistic convention** governing the expression. Context determines *what* is contrasted (for "but"), not *that* contrast is implicated. The implicature itself is context-invariant. |
  | **(iii) Status of Cancellation** | **Explicitly Cancellable:** Can be negated or withdrawn without contradiction/infelicity ("He has three children, in fact he has four" cancels the "exactly three" implicature). | **Non-Cancellable:** Attempts to cancel result in pragmatic **infelicity** or **contradiction**, not falsity. The conventional meaning *itself* generates the implication. |
  | **(iv) Relation to Gricean Speaker Meaning** | **Paradigm Case:** Recovered by recognizing the speaker's **reflexive intention** (intending the hearer to recognize the intention via the utterance & context/maxims). Central to speaker meaning. | **Problematic:** Not derived via intention-recognition in the same way. Triggered conventionally regardless of speaker's *specific* intention for that content. |

  **Addressing the Core Question: Is ConvI Speaker Meaning?**

  Conventional implicature is **best understood as a separate dimension of content**, distinct from both "what is said" (the truth-conditional content) and conversationally implicated speaker meaning, though it *constrains* the interpretation of speaker meaning.

  1.  **Not (Fully) Speaker Meaning:** Gricean speaker meaning crucially involves the speaker's reflexive communicative intention (S intends that H recognize that S intends to convey P by uttering U). ConvIs **do not rely on this mechanism for their recovery.** The hearer decodes the ConvI directly from the conventional meaning of the expression, without needing to infer a specific intention *to convey that implicature* in that context. The speaker cannot *avoid* conveying the ConvI by using the word "but"; it's an automatic consequence of lexical choice.
  2.  **A Separate Dimension of Content:** ConvIs contribute non-truth-conditional, non-cancellable content attached to the utterance. They often express **conventionalized attitudes** (contrast, concession), **discourse relations** (consequence, explanation), or **presuppositions** (in some analyses). They exist alongside "what is said" and any conversational implicatures. Christopher Potts' work formalizes this as a distinct dimension in the grammar.
  3.  **Constraining Speaker Meaning:** ConvIs provide a **conventional frame** within which speaker meaning is interpreted. Using "but" signals the speaker's view of a contrast, shaping how the hearer understands the *point* of the utterance and potentially guiding the generation of further conversational implicatures. The speaker exploits this convention to structure their overall message.

  **Illustrative Example: "but" and Non-Cancellability**

  *   **Utterance:** "She is poor *but* she is honest."
  *   **What is said (Truth-Conditional):** She is poor AND she is honest. (True if both conjuncts are true).
  *   **Conventional Implicature (ConvI):** There is a contrast between being poor and being honest (in the speaker's view). Poverty might lead one to expect dishonesty, yet honesty prevails.
  *   **Attempted Cancellation:** "She is poor *but* she is honest, **#and there is no contrast between poverty and honesty.**"

  **Why is the cancellation infelicitous (#) rather than simply false?**

  1.  **Source Conflict:** The word "but" **conventionally encodes** the expectation of contrast. Adding "and there is no contrast..." directly contradicts the meaning contribution *inherent in choosing "but"* over a neutral conjunction like "and".
  2.  **Not a False Statement:** The cancellation clause isn't false *about the world*; it could be true that poverty and honesty aren't inherently contrasting properties. The infelicity arises because the speaker's own utterance (via "but") has **performed the conventional act of signaling contrast**. Denying this act creates a pragmatic contradiction akin to saying "I hereby promise to come, but I have no intention of coming".
  3.  **Violation of Linguistic Convention:** The utterance violates the rules governing the conventional meaning of "but". It tries to use the word while stripping away its essential, non-truth-conditional contribution. This results in **misfire** or **abuse** (Austin's terms) of the linguistic convention, not a false description of a state of affairs.

  **Conclusion:**

  Grice's distinction hinges on the **mechanism of recovery**:

  *   **Conversational Implicature:** Recovered through **pragmatic inference** driven by the Cooperative Principle, maxims, context, and the recognition of speaker intentions. It is cancellable and central to speaker meaning.
  *   **Conventional Implicature:** Recovered through **linguistic decoding** of the conventional meaning of specific expressions. It is non-cancellable (leading to infelicity upon attempted cancellation) and functions as a **separate, conventional dimension of content** that frames and constrains the interpretation of speaker meaning, but is not itself derived via the reflexive intention mechanism central to Gricean speaker meaning. The "but" example powerfully illustrates how ConvI is an inescapable consequence of lexical choice, resistant to cancellation without pragmatic incoherence. For your paper, emphasizing this difference in recovery mechanism (inference vs. decoding) and the status of ConvI as a conventional, non-intention-driven dimension of content is key.
