answer: |-
  Your argument is coherent and philosophically interesting – here's a breakdown addressing your specific queries, keeping it in British English:

  1.  **The Move About the Second-Party Requirement: Is it Sound?**
      *   **Yes, it's conceptually sound.** You're not assuming what you want to prove; you're offering a plausible *refinement* of the standard second-party requirement in promise theory. The standard view emphasises the *distinctness* of the promisor and promisee as crucial. You're arguing that the crucial feature isn't distinctness *per se*, but the **functional separation of roles** (promisor vs. promisee) *and* the **difficulty/impossibility of the promisee releasing the obligation** inherent in the structure when those roles collapse onto a single entity (either simultaneously or across time).
      *   **Why it works:** It shifts the focus from "who" to "how the obligation functions". In both self-promises and promises to the dead, the structural problem is identical: **the entity holding the normative claim (the promisee role) is incapable of releasing the promisor from the obligation**, either because they *are* the promisor (creating a conflict of interest) or because they are absent/dead. This neatly explains the "weakness" as structural rather than merely psychological. The requirement for distinct parties was likely always a shorthand for ensuring this functional separation and enforceability/release mechanism. Your move exposes that the deeper need is for the promisee role to be occupied in a way that allows the normative claim to exert independent force, which is compromised when the roles coincide or the promisee is inaccessible.

  2.  **Future-Self vs. Dead-Friend: Do They Belong Together?**
      *   **Yes, they belong together *under your specific structural argument*.** You are absolutely right that the core structural similarity is the **inability of the promisee to release the promisor**, rendering the promise "unilateral" in its enforceability.
      *   **The Key Similarity:** In both cases:
          *   The promisor creates the obligation.
          *   The normative claim exists.
          *   The *only* entity who *could* potentially release the obligation (the promisee) is functionally incapable of doing so *at the relevant time* (when release is sought): the future self isn't "present" as promisee during the moment of temptation to break the promise, and the dead friend is permanently absent.
      *   **A Potential Difference (But Not a Fudge):** The *grounds* for the promisee's inability differ:
          *   **Future Self:** The inability stems from the *temporal separation* of roles within one identity. The "promisee" is a future temporal stage of the same person who is the promisor.
          *   **Dead Friend:** The inability stems from the *literal absence* (death) of a distinct person.
      *   **Why it's not fudging:** Your argument cleverly bypasses the deep metaphysics of personal identity *over time* by focusing on the **functional occupancy of the promisee role *at the time release is needed***. Whether the future self is "truly" the same person as the present promisor is *less relevant* to your point than the fact that, *operationally*, the promisee role is unoccupiable *in the moment* when the promisor seeks release (just as it is unoccupiable with the dead friend). The controversial identity question might be relevant to *why* we feel bound to our future selves, but your structural point about the *mechanism of release* (or lack thereof) holds regardless. The dead friend case reinforces this by being a clearer instance of promisee absence.

  3.  **Silent Promises & Performatives: Anything Flat-Out Wrong?**
      *   **No, nothing flat-out wrong.** Your usage aligns with a defensible philosophical position, though it touches on debates.
      *   **Silent Promises as Performatives:**
          *   Austin focused on utterances, but subsequent philosophy of language recognises that internal mental acts can have performative *force* for the agent themselves. Saying "I promise myself..." internally *is* an act of commitment, creating an intention with a specific normative weight distinct from a mere resolution. It *feels* different – we experience guilt or failure differently when breaking a silent promise versus abandoning a mere intention. This internal performative force is real *psychologically* and *normatively for the agent*.
          *   **The Crucial Distinction from Social Promises:** The *social* aspect is missing. There is no "uptake" by another party, no public accountability, no social mechanism for enforcement or release. This is precisely *why* they are structurally weaker in the way you describe. The lack of social scaffolding is a key part of their structure. Calling it a "promise" highlights the *form* of the commitment the agent makes to themselves, even if it lacks the full social apparatus.
      *   **Resolution vs. Promise:** Your distinction here is vital. A resolution is a commitment with only one party involved from the start. A self-*promise*, even silent, involves the agent *taking on* the *role* of both promisor *and* promisee, invoking the *structure* of a promise internally. This explains why breaking it feels like a *betrayal* (to oneself), not just a failure of willpower. The performative act is the internal adoption of these dual roles.

  **Overall Comments & Suggestions:**

  *   **Strength:** Your core insight – that the weakness of self-promises stems from the structural collapse of roles and the consequent inability of the promisee to release the promisor – is compelling and well-argued. Linking this to promises to the dead is insightful and strengthens the structural argument by showing the same functional problem arising from a different cause (absence vs. identity).
  *   **Clarify "Structural Weakness":** Emphasise that "weakness" here means vulnerability to unilateral dissolution by the promisor *due to the structure*, not necessarily that the obligation is *felt* less strongly. Sometimes self-promises feel incredibly binding precisely *because* we are both judge and accused.
  *   **Addressing the Identity Question (Lightly):** You can explicitly say: "While the future-self case might *invite* questions about personal identity over time, the core structural weakness identified – the inability of the promisee to release the obligation – persists *regardless* of how those metaphysical questions are resolved. It is sufficient that the promisee role is functionally unoccupiable *at the time the promisor seeks release*."
  *   **The Dead Friend Case:** Be precise. The obligation persists *as a promise*, but its nature might *also* involve elements of honouring the dead, loyalty, or carrying out their wishes – these are additional normative forces layered *on top of* the promise structure. Your point is that the promise *itself* isn't invalidated by death; its structural weakness (inability to gain release) remains.
  *   **Silent Promises:** Acknowledge the debate ("While some might argue only public utterances constitute true promises...") but firmly state your position: that the internal performative act of adopting the promisor/promisee roles creates a distinct and recognisable normative commitment *for the agent*, which we aptly call a promise to oneself, characterised by the structural features outlined.

  Your argument holds water philosophically. It's a clear, logical extension of promise theory that accounts for a common phenomenon (self-promises) and interesting edge cases (promises to the dead) by focusing on the functional requirements of the promisee role. Proceed with confidence.
