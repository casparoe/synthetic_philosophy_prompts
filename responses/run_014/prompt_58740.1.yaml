answer: |-
  The ultrasound wand moved like a ghost over Sarah’s belly, revealing the fluttering heartbeat of their daughter – Embryo A, now Lily. Mark squeezed Sarah’s hand, his eyes fixed on the grainy screen, a familiar ache blooming beneath the joy. It was the ache for Embryo B.

  Before Lily, there had been two frozen clusters of cells, two potential futures. The clinic called them "A" and "B." Statistically, both had a chance. But they’d chosen A first. It worked. Lily was here, perfect, demanding, exhausting, wonderful.

  Yet, Mark couldn’t shake Embryo B. He’d stare at Lily’s sleeping face, her tiny fist curled near her chin, and wonder: *Who would you have been?* Not Lily. Not this specific, miraculous combination of his DNA and Sarah’s that made *this* child, with her particular shade of brown eyes and the way she furrowed her brow just like Sarah when concentrating.

  The thought that had haunted him since his own teen years – that if his parents had conceived a month earlier or later, it wouldn’t be *him* staring at the ceiling at night – now had a terrifyingly concrete counterpart. Embryo B wasn't just a hypothetical "what if." It had been a real, unique genetic blueprint, frozen in time. A *different* sperm, a *different* egg. A completely different person.

  He started calling B "Sam" in his head. A boy, he decided. Quiet, thoughtful. He’d imagine taking Sam to the park Lily loved, picturing a smaller, darker-haired boy cautiously approaching the swings instead of Lily’s fearless dash. He’d see a kid with Sarah’s nose and his own stubborn chin, a kid who might have hated peas instead of Lily gleefully smashing them.

  "Is he still frozen?" Mark asked Sarah one night, washing bottles while she fed Lily.

  Sarah sighed, a sound laced with weary understanding. "Mark... they are. For now. We agreed we'd decide later…"

  "He was our kid too, wasn't he?" The question hung heavy. "Just… waiting?"

  Sarah shifted Lily to her shoulder. "He was a *possibility*, Mark. A beautiful, heartbreaking possibility. But Lily *is*." She touched his arm. "Thinking about B… it’s like mourning a path not taken. But that path never actually existed as a person. Lily does. Right here."

  But logic felt thin against the tide of Mark’s obsession. Was Sam a child he’d lost? An abstract concept? A ghost born of a petri dish? He researched identical twins – same egg, same sperm split early. Undeniably two distinct people. Embryo B was the opposite: same parents, entirely different genetic code. As different from Lily as a cousin would be. Yet, he’d helped create that potential. He felt a responsibility, a phantom grief.

  He visited the clinic alone once, just sat in the waiting room, staring at the door to the cryogenic storage room. Was Sam in there? A microscopic bundle of cells holding an unrealized future? Or was it just… biological material? The distinction blurred painfully.

  One afternoon, watching Lily meticulously stack blocks only to knock them down with a shriek of laughter, it hit him. The sheer, overwhelming *specificity* of her. Her laugh, the exact curve of her cheek, the determined set of her jaw when she focused. She wasn't just any child. She was the result of that *one* sperm finding that *one* egg on that *one* day IVF created them. Embryo A. **This** combination.

  Embryo B, Sam, was the result of a different sperm and a different egg. A different combination. A different life entirely. Not a version of Lily lost, but a different person who never came to be. Mourning Sam felt like mourning the child he *might* have had with Sarah *if* they’d conceived naturally a month later – a child who also wouldn't have been Lily.

  The ache didn't vanish. The wonder at the fragile, biological lottery of existence remained. But the sharp edge of grief for "Sam" began to soften, replaced by a profound gratitude for the specific, chaotic, irreplaceable reality of Lily – the child born from the only combination that could have created *her*. He still thought of Embryo B sometimes, the shadow child, the path forever untrodden. But he understood now it wasn't a child lost. It was a poignant reminder of the incredible, singular chance that had brought Lily, *this* specific sperm and egg miracle, roaring into their world. He leaned down, kissed the top of her head, inhaling the scent of baby shampoo and pure, improbable life. This was his daughter. The only one who could ever be *this* her.
