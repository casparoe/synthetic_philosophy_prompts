prompt: |-
  I'm putting together a small seminar-podcast next month and I've invited a historian of early modern science who has a strong view that the usual story of Galileo and the Bible is too simple: he wasn't really defending a "two truths" doctrine, and his 1615 letter to the Duchess Christina was mostly a rhetorical play to get the Church to keep out of the Copernican debate, not a settled hermenetic theory. I want to push him on that without turning it into "tell us about Galileo again." Could you draft eight to ten interview questions, each with a likely answer and a sharper follow-up? I especially want at least one question on whether Galileo's appeal to the literal sense of Scripture is coherent if he also thinks Scripture is inspired and cannot err; one on the tricky move from "Scripture does not teach how the heavens move" to "philosophers can be wrong about nature"; one on whether the Council of Trent's edition rule actually forces a literal reading of the relevant passages; and one on whether his use of Salviati, Sagredo, and Simplicio in the Dialogue was meant to make readers, not just Simplicio, look like the defenders of the old astronomy.

  Make the questions sound like something I'd actually ask on air, not like a journal article. I was talking with a grad student who kept saying this whole episode is basically "Galileo vs. the Pope," and I want the questions to make that story visibly too tidy. If the guest is likely to retreat to the standard line that Galileo was just being careful about his sources, build that into the follow-up rather than pretending it won't come up.
