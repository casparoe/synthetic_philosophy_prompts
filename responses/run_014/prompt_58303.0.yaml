prompt: |-
  hey, longtime lurker on lesswrong and the ea forum, trying to figure out if my views on moral uncertainty acutally fit together. here's my current mess:

  1. when i'm torn between moral theories i should just maximize expected choice-worthiness — weight each theory by my credence, like 60% total utilitarian, 30% commonsense deontology with a real do-no-harm constraint, 10% on a bug-suffering view where shrimp pain counts full stop.
  2. empirical and moral uncertainty are basically the same thing decision-wise, no reason to be extra humble about one vs the other.
  3. but i also think it would be dumb to donate my whole budget to shrimp welfare just cause the expected-value math blows up on that 10%, that just feels like getting pascal-mugged by myself.
  4. and i still wouldn't push the fat guy off the bridge to save five even though my main theory says to, cause hedging makes sense when i'm not sure.

  does this package work or am i double counting somewhere? flag the real conflicts vs the ones that look bad but aren't, put the worst first, and for each say what the cheapest way out would be.
reasoning: |-
  Okay, let me try to unpack this user's moral uncertainty dilemma. They're a longtime LW/EA reader, so they're familiar with concepts like expected utility and Pascal's mugging. Their four points feel contradictory, and they want to know if it's coherent or where the conflicts lie. 

  First, point 1 is standard MEC - moral uncertainty handled like empirical uncertainty. But point 3 rejects the extreme implications of that when small probabilities dominate (the shrimp welfare case). Point 4 also rejects MEC in deontological dilemmas (trolley problem). Yet point 2 insists moral/empirical uncertainty should be treated equally. Hmm... that's the core tension.

  The user seems intellectually honest - they notice the discomfort between theory and intuition. Their "dumb" and "feels like" language suggests they've hit a practical limit in their belief system. Probably looking for rigor without self-delusion. 

  Biggest conflict: Claiming moral/empirical uncertainty are identical (point 2) while applying different decision rules to them (points 3-4). Can't have both. Cheapest fix might be to drop point 2 - just admit moral uncertainty needs different handling sometimes. 

  Second conflict: Using MEC formally (point 1) but overriding it in high-stakes cases (point 3-4). That's inconsistent unless they adopt a modified framework like variance aversion or lexical thresholds. 

  Shrimp example is classic small probability/huge impact scenario. Their intuition is rejecting unlimited willingness to pay - which is rational! The fix here might be capping utility functions or using bounded rationality. 

  Fat man case is trickier. MEC should recommend pushing if 60% utilitarian, but they refuse. This feels like variance aversion - avoiding catastrophic moral failure has intrinsic value. Could formalize that with risk-sensitivity. 

  Underlying all this: They might be wrestling with how "real" moral theories are compared to empirical ones. Maybe moral beliefs feel more like commitments than probabilities. But that's a deeper metaphysical can of worms...
answer: |-
  Here's a breakdown of your positions, the conflicts (ranked by severity), and the cheapest resolutions:

  ### Core Conflicts (Worst First)
  1. **Conflict 1: MEC vs. Avoiding Shrimp-Pascal Mugging**  
     - **The Clash:** Your point 1 (maximize expected choice-worthiness) demands you donate massively to shrimp welfare if your 10% bug-suffering view assigns astronomical disvalue to shrimp suffering (e.g., 1 shrimp suffering = -1 human torture unit). Point 3 explicitly rejects this.  
     - **Why it’s bad:** You can’t simultaneously endorse unbounded MEC *and* reject its most extreme implications without inconsistency.  
     - **Cheapest Fix:** **Bound your utility functions.** Cap the maximum disvalue/choice-worthiness any theory can assign to an outcome (e.g., "no theory can assign >X disvalue to a single shrimp"). This preserves MEC’s form while neutering Pascalian explosions.

  2. **Conflict 2: Moral vs. Empirical Uncertainty (Point 2 vs. Points 3 & 4)**  
     - **The Clash:** Point 2 claims moral/empirical uncertainty are identical decision-theoretically. But points 3 (shrimp) and 4 (fat man) show you treat moral uncertainty differently: you *don’t* maximize expected choice-worthiness when it demands extreme/unthinkable acts.  
     - **Why it’s bad:** If they’re truly identical, you’d push the fat man and donate to shrimp without hesitation. Your intuition says otherwise, violating point 2.  
     - **Cheapest Fix:** **Drop point 2.** Admit moral uncertainty is special because:  
       - Moral theories can have unbounded/incommensurable values (unlike empirical probabilities).  
       - Moral errors feel qualitatively worse (e.g., murder vs. misprediction).  
       - **Alternative:** Adopt a **risk-averse MEC** (e.g., variance-sensitivity) that downweights low-probability moral theories demanding extreme acts.

  3. **Conflict 3: MEC vs. Fat Man Hedging**  
     - **The Clash:** MEC (point 1) at 60% utilitarianism says *push the fat man* (5 lives > 1). Point 4 refuses, citing "hedging." But hedging *is part of MEC* if your deontology assigns infinite disvalue to pushing. If it doesn’t, MEC says push.  
     - **Why it’s less bad:** If your deontology has a *finite* disvalue for pushing, MEC *could* still say "don’t push" if the disvalue is high enough. But if your deontology is soft (e.g., "pushing is -1000 utils"), MEC likely says push. Your refusal suggests either:  
       - Your deontology has near-infinite disvalue for pushing (resolving the clash), or  
       - You’re intuitively rejecting strict MEC in extreme cases.  
     - **Cheapest Fix:** **Clarify your deontology’s choice-worthiness.** If it assigns prohibitively high disvalue to pushing (e.g., −∞, or −10¹⁰ utils), MEC agrees with not pushing. If not, embrace a **lexical threshold** (e.g., "never violate deontology unless utility gains exceed threshold Y").

  ### Non-Conflicts (Things That Look Bad But Aren’t)
  - **"Hedging" in the Fat Man case:** This is consistent with MEC *if* your deontology’s choice-worthiness function makes pushing net negative in expectation. No conflict if deontology’s "constraint" is strong enough.  
  - **Rejecting shrimp donations while having a 10% credence:** This only conflicts with MEC if your bug-suffering theory has unbounded disvalue. With bounded disvalue (Conflict 1 fix), MEC won’t demand your entire budget.

  ### Summary of Fixes
  1. **Bound utility functions** to avoid Pascal mugging (resolves shrimp conflict).  
  2. **Drop or refine point 2** — moral uncertainty isn’t identical to empirical uncertainty (resolves core inconsistency).  
  3. **Specify deontology’s choice-worthiness** — if it’s extremely high for constraints, MEC agrees with not pushing the fat man.  

  ### Coherent Package After Fixes
  - **Revised Point 1:** Maximize expected choice-worthiness *with moral theories using bounded/normalized utility functions*.  
  - **Revised Point 2:** Moral uncertainty requires special handling (e.g., variance-sensitivity or lexical thresholds) unlike empirical uncertainty.  
  - **Point 3:** No longer a conflict (bounded utilities prevent shrimp mugging).  
  - **Point 4:** Consistent if deontology has high disvalue for pushing (or under risk-averse MEC).  

  This resolves your clashes while preserving your intuitions. The cheapest fix is **bounding utilities** — it’s minimal, technically sound, and kills infinite Pascalian problems. If you cling to point 2, adopt **variance-weighted MEC** (e.g., [OpenPhil’s approach](https://www.openphilanthropy.org/research/moral-uncertainty/)), which discounts low-probability moral theories demanding extreme actions.
