  For evidentiary support: Bengal shows wartime denial policies combined with refusal to declare famine; Ireland presents the puzzle of functioning information flows amid mass death; China exemplifies systemic distortion through ideological pressure. The Great Leap Forward case best demonstrates both mechanisms - fabricated reports AND willful disbelief.

  Ah, Ireland is the trickiest. The free press and parliamentary representation seem to refute epistemic failure. But Peel's accurate potato blight reports were drowned out by Treasury officials clinging to laissez-faire ideology. The epistemic crime here was treating market logic as inviolable physical law despite contrary evidence.

