  Chain A: Original text → valid entrenchment (2019) → current rules (with entrenchment) 
  Chain B: Original text → 2023 board vote (ignoring entrenchment) → current rules (without entrenchment) 

  Neither chain is internally defective. The tie-breaker (chair's ruling) is part of the contested framework. This is more specific than general self-amendment - it's about competing historical paths. 

  For coinage: "Mutually exclusive constitutional continuities" captures the core. Boundary conditions would require: 
