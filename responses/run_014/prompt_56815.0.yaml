prompt: |-
  I have spent the better part of two decades reading rationalist blogs and forums, where the first question asked of any thesis is what observation would count against it. Applying that reflex to the philosophy of technology has left me stuck, because both of the standard positions appear to survive any evidence at all. On one side, the claim that artifacts carry politics in their structure can be defended for any artifact by pointing to some differential effect it has; on the other, the claim that artifacts are neutral and only people are political can be defended for any artifact by pointing to its designers and users. Neither position tells me anything I did not already know. What I want is a criterion I can apply to a description of a thing and get a definite answer from — one that could be shown wrong by a badly chosen case.

  I have read Winner's 1980 essay in *Daedalus* asking whether artifacts have politics, including the parkway example, and I know that the historical particulars of that example have been disputed and that Joerges pressed an objection along those lines. I am not asking for a literature map or references; I want the criterion. Here is what I actually believe, arrived at case by case rather than derived from any theory, and I would like to know what principle, if any, generates all of it.

  1. Overpasses built low enough that buses cannot pass, so that only car owners can reach a public beach: political, on any criterion I would accept.
  2. The same overpasses at the same clearance, built for drainage and sight-line reasons, where nobody involved registered the consequence for buses for a decade and where the effect on who reaches the beach is identical: also political. Intent strikes me as a red herring here, and this is the verdict I hold most firmly.
  3. A speed bump where an officer used to enforce the limit: not political. The question of what speed is acceptable was settled in the open, by people who could be replaced; the bump is a cheaper way of carrying that settlement out. The politics is upstream.
  4. Air conditioning: not political, despite the sealed office tower, the migration to the Sun Belt, and the changed electoral map. It made available a set of choices that people then made, in the ordinary political way, and could have made otherwise.
  5. A facial-recognition system that performs worse on darker skin, where nobody intended it and nobody checked until after deployment: political. My reason is not simply that outcomes are unequal; it is that the artifact distributes a public benefit and burden along a line of subordination that already existed.
  6. Shears shaped so that a left-handed grip forces the blades apart, imposing a real recurring cost on left-handers: not political. Left-handers are a minority but not a subordinate group, and nothing about their standing in the community is being settled.
  7. Nuclear power as an inherently political technology, in the sense of requiring centralized and hierarchical management: rejected. Solar farms, container shipping, and data centers are at least as technically demanding and admit of either centralized or distributed organization. I suspect discarding this whole category costs me something, but I cannot say what.
  8. An opt-out default for organ donation: political. A browser's default search engine: not, or at least not in the same way — yet both are defaults and both allocate something, and the only distinction I can produce is that the second is trivial, which is not a principle.
  9. A lock on a door: not political, since it secures a property right the law already settled. Though the lock does something the law cannot, namely make that rule effective at three in the morning with no authority present, and I cannot tell whether that is taking over a decision or merely executing one. This is the case I keep going back and forth on.

  Two pairs I cannot reconcile. First, 2 and 6: both are unintended differential effects that entrench a disadvantage, and I call one political and the other not. My stated reason is whether the affected group is subordinate, but that seems to import the very political judgment I was trying to locate in the artifact, and it makes the criterion's output depend on my own views about society rather than on anything about the thing. Second, 3 against 1 and 2: a device that merely carries out a decision made elsewhere is not political, but the overpasses also carry out a decision made elsewhere — unless in case 2 nobody decided anything at all, in which case my criterion must be doing work I cannot yet articulate.

  So: state the principle, or the two or three best candidates, precisely enough that I could apply it to an unfamiliar artifact without consulting you again. Tie each clause to the verdict that motivates it — I want to know which of my cases is doing the work of which condition. Then tell me honestly which of my verdicts it forces me to abandon. I would rather be told that 3 and 9 have to go than be handed a criterion with a discretionary fudge factor that saves all nine; if the price of consistency is complexity, show me the complexity rather than hiding it. Say also what would falsify the criterion: what sort of artifact, described in what way, would count against it.

  Finally, apply it to three cases on which I am withholding my verdict, so that I can see whether the principle has independent traction. A stair-only apartment building constructed in 1910 and no longer alterable at reasonable cost, versus an otherwise identical building constructed last year under a different code, both excluding the same people. A programming language whose type system renders a whole class of error inexpressible, adopted voluntarily by its users rather than imposed on anyone. And a paper ballot counted by hand in public view versus an electronic machine whose software no outsider can inspect, where my gut says the difference is political but has nothing to do with which party wins and I cannot say why.
reasoning: |-
  Okay, the user has spent two decades engaging with rationalist communities, where evidence against a thesis is crucial. Now they're stuck on whether artifacts have politics. They've read Winner's essay and know about the disputes but want a clear criterion, not more literature. They listed nine cases where they judge if an artifact is political and two pairs they can't reconcile. They want a principle precise enough to apply independently, that explains their judgments, possibly overruling some, and falsifiable.

  First, I need to unpack their cases. They distinguish between artifacts that are political based on effects, regardless of intent (like low overpasses excluding buses), versus those that aren't (like speed bumps enforcing pre-decided rules). Key conflicts are between cases 2 (unintended exclusion) and 6 (shears disadvantaging left-handers), and between case 3 (speed bump as non-political) and cases 1-2 (overpasses as political). The user admits using societal subordination as a factor but worries it's circular.

  The user's deeper need seems to be a consistent, objective criterion that doesn't rely on subjective societal judgments. They value falsifiability—wanting to know what evidence could prove the criterion wrong. They also prefer complexity over fudge factors, even if it means abandoning some of their initial judgments.

  Looking at their unresolved cases: the stair-only buildings (historical vs. new), programming languages, and voting methods. These test whether the criterion can handle context, voluntary adoption, and transparency without partisan bias.

  To build the criterion, I should focus on institutional capture—whether the artifact entrenches power by bypassing democratic processes. Case 1's overpasses exclude bus riders without public debate, fitting this. Case 2, even unintended, still bypasses deliberation. Case 6's shears don't entrench subordination because left-handers aren't systematically oppressed. 

  For the voting example: hand-counted ballots allow public oversight, while black-box machines lack accountability, making the latter political under this criterion. The apartment built under old codes isn't political if alteration is impossible, but the new one, built under current norms without inclusive design, is. The programming language isn't political because adoption is voluntary and errors don't entrench power imbalances.

  The user might resist tying "political" to democratic processes, but it resolves their conflicts. Cases 3 (speed bump) and 9 (lock) are non-political because they enforce pre-established rules. Case 4 (AC) is neutral as choices were made politically later. This means abandoning their view that unintended exclusion (case 2) is political only if the group is subordinate—instead, it's about whether the design bypassed deliberation.

  Falsification would be an artifact that entrenches power but went through democratic channels, or vice versa. If an exclusionary design was openly debated and accepted, it wouldn't be "artifact politics" under this criterion. The user might accept this trade-off for consistency.
answer: |-
  Here is a criterion derived from your judgments, articulated precisely enough for independent application. It resolves your core conflicts by focusing on **institutional capture** and **democratic bypass**, not intent or raw differential effects. The key is whether the artifact *entrenches or executes power relations in a way that circumvents ongoing democratic contestation*.

  ### The Criterion: The Institutional Capture Test
  An artifact is political **if and only if** it meets both conditions:
  1.  **Entrenchment:** It materially allocates a significant public benefit or burden (access, safety, opportunity, cost, risk) in a way that entrenches an *existing* structure of social subordination *or* concentrates decision-making power in non-accountable actors.
  2.  **Democratic Bypass:** The allocation operates by bypassing or displacing the ordinary, revisable processes of democratic will-formation (lawmaking, regulation, public debate, accountable administration) that *should* govern that type of allocation *at the time of its creation or deployment*.

  ### Tying Clauses to Your Verdicts & Resolving Conflicts
  *   **Case 1 (Low Overpass, Intentional):** Political. **Entrenchment:** Allocates beach access based on wealth/car ownership (subordination). **Bypass:** Built without democratic debate on exclusion; substitutes private/technical decision for public deliberation on access rights.
  *   **Case 2 (Low Overpass, Unintentional):** Political. **Entrenchment:** *Same allocation effect* as Case 1, entrenching subordination. **Bypass:** *Same bypass* – engineers decided drainage/sight-lines without democratic scrutiny of *consequences* for access, even if unaware. (Your firm verdict motivates the irrelevance of intent and focus on *effect + institutional process*).
  *   **Case 3 (Speed Bump):** **Not Political.** **Entrenchment:** Enforces democratically set speed limit (no new subordination). **Bypass:** *Executes* a prior, revisable democratic decision (speed limit law) via cheaper means; doesn’t *displace* the process. (This is your "politics is upstream" verdict).
  *   **Case 4 (Air Conditioning):** **Not Political.** **Entrenchment:** Enabled choices, but didn’t *allocate* benefits/burdens itself or entrench subordination *directly*. Migration/electoral shifts resulted from myriad individual/political choices. **Bypass:** No bypass; choices unfolded through ordinary political/economic processes.
  *   **Case 5 (Biased Facial Recognition):** Political. **Entrenchment:** Allocates public safety/benefit (recognition accuracy) disparately along racial lines (subordination). **Bypass:** Deployed without accountability/testing for bias, bypassing safeguards for equitable public resource allocation.
  *   **Case 6 (Left-Handed Shears):** **Not Political.** **Entrenchment:** Imposes cost, but left-handers lack systemic subordination; cost isn’t tied to an *existing* hierarchy. **Bypass:** No significant public allocation bypassed; product design in competitive market. (Distinguishes from Case 2: *nature of the group and the allocation’s link to subordination is crucial*).
  *   **Case 7 (Nuclear Power):** **Not Political (per your rejection).** **Entrenchment/Centralization:** Centralization is a *choice* within the technology’s deployment, not inherent. Solar etc. show alternatives exist. **Bypass:** Centralization, if it occurs, results from political/economic decisions, not the artifact forcing bypass.
  *   **Case 8a (Opt-Out Organ Donation):** Political. **Entrenchment:** Allocates scarce life-saving resource (organs) based on a default rule. **Bypass:** Default rule *sets* the allocation framework, often enacted without robust public deliberation on the ethical weight of defaults vs. express consent, displacing individual choice *by design*.
  *   **Case 8b (Browser Default Search):** **Not Political (in the same way).** **Entrenchment:** Allocates minor convenience/market advantage, not a core public good/burden linked to subordination. **Bypass:** Changeable by user; market competition/regulation exists (even if imperfect) – doesn’t fundamentally bypass democratic processes for *significant public allocation*. (Distinction driven by *scale/type of benefit* and *revisability*, not triviality alone).
  *   **Case 9 (Lock):** **Not Political.** **Entrenchment:** Secures democratically established property rights. **Bypass:** *Executes* the law (enforcement at 3 am), acting as a tool of the accountable legal system; doesn’t *create* or *bypass* the rule itself. (Your "executing a decision" verdict).

  ### Verdicts You Must Abandon
  The criterion forces you to abandon **one core aspect of your reasoning**, though not necessarily the verdicts themselves in all cases:
  *   **Intent is irrelevant (Case 2):** The criterion *embraces* this. Intent doesn’t matter; *effect + institutional bypass* do.
  *   **Subordination as sole marker (Cases 2 vs. 6):** You must abandon **relying solely on perceived subordination without the institutional bypass component**. Case 6 lacks *democratic bypass* of a *significant public allocation* linked to subordination. Case 2 has both, regardless of intent. The criterion *incorporates* subordination analysis but ties it to institutional processes, avoiding pure subjectivity. Your societal judgment is needed to identify "subordination" (e.g., bus riders vs. left-handers), but the *bypass* clause provides the objective anchor.

  ### Falsification
  The criterion is falsified if an artifact is found that:
  1.  **Entrenches subordination/concentrates power *without* bypass:** E.g., A poll tax explicitly enacted by democratic vote after public debate. (Artifact executes politics, isn't political itself).
  2.  **Causes bypass *without* entrenching subordination/concentrating power:** E.g., A purely aesthetic traffic calming measure (like unique street paving) implemented secretly by a rogue mayor, causing minor confusion but no significant allocation of burdens/benefits along lines of power/subordination. (Undemocratic, but not materially entrenching power).
  3.  **Has significant differential effect + bypass, but *not* linked to subordination/power concentration:** E.g., A bridge toll discount for electric vehicles, enacted without debate via administrative rule, benefiting affluent early adopters but primarily aimed at environmental goals, not entrenching class hierarchy. (If the effect *is* deemed to entrench subordination, it *would* be political per the criterion).

  ### Application to Your Withheld Cases
  1.  **Stair-Only Building (1910 vs. New):**
      *   **1910 Building:** **Not Political** under criterion. **Entrenchment:** Excludes disabled, linked to subordination. **BUT Bypass:** Built under norms/laws lacking disability inclusion; no revisable democratic process *existed* to bypass *at the time*. Alteration now impossible at reasonable cost - current society bears cost of past exclusion, but the artifact itself isn't *currently* bypassing democratic processes. (It's a legacy injustice, not an actively political artifact *now*).
      *   **New Building:** **Political.** **Entrenchment:** Same exclusion, same subordination. **Bypass:** Built *now* under codes/laws where inclusion *is* a recognized democratic concern. Choosing stairs-only bypasses current processes/norms (like accessibility regulations or inclusive design debates) that *should* govern such allocations. The artifact *embodies* a choice to exclude despite alternatives.
  2.  **Programming Language Type System:**
      *   **Not Political.** **Entrenchment:** May prevent errors, but doesn't allocate public benefits/burdens along lines of subordination or concentrate power. Users voluntarily adopt it; benefit is technical/individual. **Bypass:** No democratic process governs language design choices; adoption is individual/community-based, not imposed via bypass of accountability.
  3.  **Paper Ballot vs. Electronic Voting Machine:**
      *   **Paper Ballot (Hand Count):** **Not Political.** **Entrenchment:** Secures voting integrity (public benefit). **Bypass:** *Executes* the democratic process (voting) with inherent transparency/accountability (public count). Doesn't bypass or displace it.
      *   **Electronic Machine (Black Box):** **Political.** **Entrenchment:** Allocates the core democratic benefit of vote integrity/trust. **Bypass:** Concentrates verification power in unaccountable actors (software vendors, select technicians) and *displaces* the transparent, publicly verifiable process (hand counting) that is the historical and normative standard for ensuring democratic accountability. It bypasses the essential *public* aspect of vote verification, regardless of partisan outcome.

  ### Principle in Summary
  The Institutional Capture Test: **An artifact is political if it materially entrenches social subordination or concentrates power *by* circumventing the democratic processes accountable for making such allocations.** It explains your core intuitions (bypass vs. execution, irrelevance of intent, focus on subordination *in context*) while resolving your conflicts by demanding *both* entrenchment *and* bypass. It forces abandonment of judging Case 2 solely on subordination without the bypass clause and clarifies the lock/speed bump as execution, not politics. Complexity lies in defining "significant public benefit/burden," "subordination," and "revisable democratic processes" contextually, but these are inherent to political analysis, not discretionary fudge factors.
