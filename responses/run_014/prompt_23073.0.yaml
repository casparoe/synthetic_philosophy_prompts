  Make sure to avoid jargon. Use analogies like the ink drop in water for entropy increase. For Boltzmann brains, compare to dreaming versus reality. The key is making the paradox clear: if fluctuations are random, why are we part of a huge ordered universe instead of a fleeting brain?

