answer: |-
  Here are five technically accurate yet memorable limericks for Hempel's Raven Paradox:

  1.  A hypothesis that scientists state:
      "All ravens are black" is its trait.
      To put it quite plain,
      If it flies in the rain,
      Its feathers are dark, sealed by fate.

  2.  Said Nicod, and Hempel agreed too,
      A black raven gives quite a clue:
      "Observing this sight
      Makes the hypothesis right -
      Confirms it! (Though some think that's untrue)."

  3.  Now logic steps in, crystal clear:
      Our statement, reshuffled, we hear:
      "All things that aren't black
      Are non-ravens" - alack!
      The contrapositive's logically near.

  4.  But wait! What's this? Something absurd!
      A white shoe (or green apple) occurred!
      It's not black, not a bird,
      So the logic I've heard
      Says *it* confirms "All ravens are black"! How absurd!

  5.  So what does this puzzling thing show?
      Does the shoe really make ravens glow
      Blacker? Or did we err
      In how things confer
      Support? The debate lives on, apropos.

  **Short Note on Caveats:**
  Steps 1 (hypothesis statement) and 3 (logical equivalence/contrapositive) are uncontroversial logic. Step 2 (Nicod's intuition/Hempel's initial acceptance of instance confirmation) leans hardest on a contested reading – it's the core premise later challenged (e.g., by relevance theorists, Bayesians). Steps 4 (the paradoxical consequence) and 5 (the unresolved discomfort) depend entirely on accepting Step 2 and highlight the contested nature of confirmation criteria.
