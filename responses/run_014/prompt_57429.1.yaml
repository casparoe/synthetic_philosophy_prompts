prompt: |-
  Two members of my epistemology reading group spent an entire session arguing about a third member, Jonah, and then asked me to referee. I couldn't decide, so I'm passing it on.

  The case under dispute: Jonah is currently about 0.9 confident that a certain argument against free will is sound. Next month he spends a week working closely with a famously charismatic author whose book argues the opposite way, and Jonah confidently expects that by the end of the week he will be down to roughly 0.4. He does not expect any new evidence. A professor has already walked him through what she takes to be a definite flaw in the book's central move, and Jonah found her diagnosis convincing; he simply expects the prose to be overwhelming.

  Here is the exchange, more or less as it happened.

  (a) Priya said Jonah is already incoherent. Van Fraassen's Reflection principle says that if you are certain your later credence in A will be x, your present credence in A should be x. Sitting at 0.9 while certain he will be at 0.4 is a violation, and it exposes him to the two-bet diachronic Dutch book.

  (b) Dev replied that Reflection only binds when the expected change is evidential. Jonah expects his shift to be produced by rhetoric, not by information, so his future self is someone he already knows will have been taken in. Deferring to that self is deferring to a mistake.

  (c) Priya asked how Jonah knows it will be a mistake. His future self will have everything he has now plus a week of close reading. Refusing to defer is a claim to infallibility — and Reflection is in any case derivable from conditionalization given the assumption that the later self only ever adds to, never loses, the earlier self's evidence, which plainly holds here.

  (d) Dev said that derivation is what sinks the principle rather than saving it: it assumes the later credence results from conditionalizing on a richer body of evidence. If the change comes from charisma, the premise fails. And Priya's reading has an absurd consequence — anyone who knows she will be badly sleep-deprived tomorrow ought today to shade her confidence in elementary arithmetic toward whatever she expects her exhausted self to think.

  (e) Priya said that is just the price of knowing you will be unreliable, and the sleep case is disanalogous anyway: the exhausted person does not expect her tired self to settle on 2+2=5, only to be sloppy and error-prone, whereas Jonah expects to be genuinely persuaded. Reflection tracks settled conviction, not predicted performance failure.

  (f) Dev replied that this concedes the point. A principle that applies only to future selves who are better informed is not a coherence constraint but a heuristic, and once the condition is spelled out Reflection does no independent work: it collapses into conditionalizing on expected future evidence. Besides, Jonah's 0.4 is a prediction about a psychological process, not a report of a future evidential state, and predictions about one's own psychology have not earned that kind of authority.

  Please adjudicate move by move: for each of (a) through (f), say whether it is right, wrong, or partly right, and why. Then say who is more right overall about whether Jonah should lower his credence now, and identify anything substantive that both of them missed — including whether Jonah has any legitimate way to handle the coming week, such as declining the invitation or precommitting in advance, that does not itself violate whatever the correct principle turns out to be.
reasoning: |-
  We are adjudicating a debate between Priya and Dev about Jonah's epistemic state. Jonah is currently 0.9 confident that an argument against free will is sound, but he expects that after a week with a charismatic author (who argues the opposite) he will drop to 0.4. He does not expect new evidence; he expects to be overwhelmed by rhetoric.

  We'll go through each move (a) to (f) and then give an overall assessment.

  (a) Priya: Jonah is incoherent because of van Fraassen's Reflection principle. Reflection says that if you are certain your future credence in A will be x, then your current credence should be x. Jonah is at 0.9 and certain of going to 0.4, which violates Reflection and exposes him to a Dutch book.

  Assessment: Priya is right about the violation of Reflection, but she may be overlooking conditions for Reflection's applicability. Reflection assumes that the future self is rational and that the change is due to evidence. Without these, the principle might not apply. So she is partly right but misses the nuances.

  (b) Dev: Reflection only binds when the change is evidential. Jonah expects a change due to rhetoric, so he should not defer to a future self that has been "taken in." Deferring would be deferring to a mistake.

  Assessment: Dev is right that Reflection is typically motivated by evidential updating. The principle is often defended under the assumption that the future credence is based on more evidence and rational updating. So if the change isn't evidential, Reflection might not be required. However, note that the standard Reflection principle does not explicitly require the change to be evidential; it is a general principle. But many philosophers (including van Fraassen) have discussed the evidential context. So Dev is partly right.

  (c) Priya: How does Jonah know it's a mistake? His future self has more (the same plus a week of reading). Refusing to defer is claiming infallibility. Also, Reflection is derivable from conditionalization given that the later self has more evidence.

  Assessment: Priya's point about the future self having more evidence is valid in the standard setting. However, Jonah does not expect to gain any new evidence (only to be swayed by rhetoric). So the "more evidence" might be a red herring. Also, the derivation of Reflection from conditionalization assumes that the future credence is the result of conditionalizing on new evidence. If that assumption fails, the derivation fails. Priya is partly right about the standard connection but may be wrong about the evidence in this case.

  (d) Dev: The derivation of Reflection from conditionalization fails because the change is due to charisma, not evidence. Also, Priya's view has an absurd consequence: if one knows they will be sleep-deprived, they should adjust their current beliefs to what they expect to believe in that state.

  Assessment: Dev is right that the derivation fails if the change is not evidential. The sleep-deprivation example is a good challenge: if we applied Reflection to a future state of known irrationality, we would get absurd results. This suggests that Reflection should not apply in such cases. Dev's point is strong here.

  (e) Priya: The sleep case is disanalogous because the exhausted person doesn't expect to believe 2+2=5, only to be error-prone. Jonah expects to be genuinely persuaded. Reflection tracks settled conviction, not performance failure.

  Assessment: Priya makes a distinction: in the sleep case, the future state is one of known impaired performance, but Jonah's future state is one of conviction. However, Jonah knows that the conviction is due to non-evidential factors (rhetoric). So even if he is genuinely persuaded, he knows that the persuasion is not based on evidence. This is similar to knowing that one will be in an altered state (like under hypnosis) and having a belief that one currently deems irrational. Reflection should not apply. Priya's distinction is not entirely convincing. She is partly right that the cases are different, but the underlying issue is about rationality and evidence.

  (f) Dev: Reflection, when conditioned on future selves being better informed, collapses into conditionalizing on expected evidence and does no independent work. Also, Jonah's 0.4 is a psychological prediction, not an evidential state, and predictions about psychology don't have that authority.

  Assessment: Dev is right that if we restrict Reflection to cases of expected rational updating, then it becomes a consequence of conditionalization. And in this case, since no new evidence is expected, conditionalization doesn't require a change. Moreover, the 0.4 is a prediction about a psychological state, not a rational response to evidence. Therefore, it does not have the normative force that an evidential credence would have. This point is strong.

  Summary of each move:

  (a) Partly right: Jonah violates the letter of Reflection, but the principle may not apply in this non-evidential scenario.

  (b) Right: Reflection is typically meant for evidential changes.

  (c) Partly right: The future self has more experience, but not necessarily more evidence. The connection to conditionalization fails without evidential change.

  (d) Right: The derivation of Reflection fails in non-evidential cases, and the sleep example shows the absurdity of applying Reflection to known irrational states.

  (e) Partly right: There is a difference between performance failure and conviction, but Jonah knows his conviction will be based on non-evidential factors.

  (f) Right: Reflection without the evidential assumption collapses into a derivative principle, and psychological predictions lack normative authority.

  Overall, Dev is more right. Jonah should not lower his credence now because he expects the change to be non-evidential and irrational. However, both miss some points.

  What did they miss?

  1. **The possibility of precommitment:** Jonah might avoid the situation by declining the invitation. If he goes, he might precommit to not changing his mind without new evidence. This is consistent with conditionalization: if no new evidence comes in, he should not change. But if he expects to be swayed by rhetoric, he might set up mechanisms to stick to his current view.

  2. **Self-doubt and higher-order evidence:** The situation might be seen as Jonah having higher-order evidence that he will be irrational. This could lead him to lower his confidence now because he anticipates being irrational. But note: that would be a different reason (not Reflection) and might be a form of self-doubt. However, it's not clear that he should lower his credence for the proposition itself. Instead, he might become less confident in his own ability to judge.

  3. **The role of evidence again:** Even if the author's book doesn't provide new evidence, the experience of being overwhelmed by rhetoric might itself be evidence of something (e.g., the power of the rhetoric, or the weakness of his own current conviction). But Jonah has already been warned about the flaw. So he might interpret the experience as a non-rational influence.

  4. **Alternative principles:** Some have proposed principles for when one expects to be irrational. One might use a modified Reflection that only applies when the future self is rational. Or, one might apply a principle of "self-governance" that allows for discounting future irrational states.

  Adjudication:

  - Jonah should not lower his credence now because the expected change is non-evidential and he has reason to believe it will be irrational. Therefore, he is not required by Reflection to lower it.

  - He has legitimate ways to handle the week: 
    - Decline the invitation to avoid the non-rational influence.
    - Precommit to his current view and not update without new evidence. This precommitment is rational if he believes the change will be non-evidential.

  However, note that if he goes and is swayed, he might become 0.4 even without new evidence. But from his current perspective, that future state is irrational. So he should not pre-emptively adopt that state.

  In conclusion, Dev is more right: Jonah need not lower his credence now. The Reflection principle does not apply because the change is non-evidential and Jonah knows it will be a mistake. Both missed the option of precommitment and the possibility of interpreting the experience as higher-order evidence (though that might not directly affect the first-order credence).
answer: |-
  ### Adjudication of Moves

  I will evaluate each move (a) through (f) step by step, explaining why it is right, wrong, or partly right. Then, I will determine who is more right overall about whether Jonah should lower his credence now, and identify substantive points both missed, including legitimate strategies for Jonah.

  ---

  #### (a) Priya: Jonah is incoherent due to violating Reflection, exposing him to Dutch books.
  - **Assessment: Partly right, but incomplete.**  
    Priya is correct that van Fraassen's Reflection principle (if you are certain your future credence in \(A\) will be \(x\), your current credence should be \(x\)) is violated here: Jonah is at 0.9 now but certain he will be at 0.4 later. This violation does expose him to a diachronic Dutch book (a series of bets he would accept now and later that guarantee a loss). However, Priya overlooks that Reflection is not an absolute coherence constraint. It assumes the future self is rational and the credence change is driven by evidence. If the change is non-evidential (as Jonah expects), Reflection may not apply. Thus, Jonah's incoherence is not automatic; it depends on whether the principle's conditions hold.

  #### (b) Dev: Reflection only binds for evidential changes; deferring to a "mistaken" future self is unwarranted.
  - **Assessment: Right.**  
    Dev correctly identifies that Reflection is typically justified by the assumption that future credences result from rational updating on new evidence. Jonah expects his shift to 0.4 to be caused by rhetoric (a non-evidential factor), so his future self is anticipated to be irrational. Deferring would mean endorsing a known error, which is not required by Reflection. This aligns with philosophical critiques (e.g., by Christensen or Briggs) that Reflection only constrains when the future self is better informed or rational. Dev's point saves Jonah from incoherence in this case.

  #### (c) Priya: Jonah's future self has more evidence; refusing to defer claims infallibility. Reflection derives from conditionalization.
  - **Assessment: Partly right, but flawed.**  
    Priya is right that Jonah's future self has "more" in a temporal sense (a week of reading), but she conflates temporal enrichment with evidential gain. Jonah explicitly expects no new evidence—only rhetorical persuasion—so the "more" is not evidential. Thus, conditionalization (updating on new evidence) does not apply, and the derivation of Reflection from conditionalization fails. Priya's infallibility point is weak: Jonah isn't claiming infallibility; he is anticipating a known bias. However, she is right that Reflection is often derived from conditionalization *if* evidence grows monotonically (never lost), but this condition is not met here because the shift is non-evidential.

  #### (d) Dev: Reflection's derivation fails for non-evidential changes; sleep-deprivation analogy shows absurdity.
  - **Assessment: Right.**  
    Dev correctly argues that the derivation of Reflection from conditionalization assumes evidential updating, which doesn't hold here (charisma isn't evidence). The sleep-deprivation analogy is strong: if you know you'll be exhausted tomorrow and prone to errors, you shouldn't adopt your future irrational credences today (e.g., shading confidence in \(2+2=4\) toward what you expect to believe). This highlights that Reflection is not a universal requirement—it should not apply when future irrationality is anticipated. Dev exposes a key flaw in Priya's argument: applying Reflection blindly leads to absurd consequences in cases of known unreliability.

  #### (e) Priya: Sleep case is disanalogous; Reflection tracks conviction, not performance failure.
  - **Assessment: Partly right, but insufficient.**  
    Priya makes a valid distinction: Jonah expects genuine conviction (he will feel persuaded), whereas the sleep-deprived person expects performance errors (sloppiness but not sincere belief in falsehoods). This suggests Reflection might apply to "settled convictions" but not temporary impairments. However, this doesn't save Reflection here. Jonah's "conviction" is still based on non-evidential factors (rhetoric), which he already recognizes as misleading. Reflection requires deference to a rational future self, not just a sincere one. Priya's response fails to address why sincerity alone should compel deference when irrationality is expected.

  #### (f) Dev: Reflection collapses into conditionalization; Jonah's 0.4 is psychological, not evidential.
  - **Assessment: Right.**  
    Dev is correct that a "better informed" restriction on Reflection reduces it to conditionalization on expected evidence, rendering it redundant. Since Jonah expects no new evidence, conditionalization doesn't mandate a change, and Reflection does no independent work. Moreover, Jonah's 0.4 is a prediction about his psychology (how he'll feel after rhetoric), not a report of a future evidential state. Psychological predictions lack normative authority over current beliefs—they are not evidence for the proposition itself. Dev rightly notes that granting such authority would overextend Reflection.

  ---

  ### Overall Verdict: Who is More Right?
  - **Dev is more right overall.** Jonah should **not** lower his credence now.  
    Reflection does not apply because Jonah anticipates a non-evidential, irrational shift. His current 0.9 is based on evidence (e.g., the professor's critique), while his future 0.4 is expected to stem from bias. Lowering his credence preemptively would be irrational, as it would incorporate a known error. Dev's arguments successfully limit Reflection to evidential contexts and highlight the dangers of deferring to irrational future states. Priya overextends Reflection by ignoring the non-evidential nature of the change.

  ### Substantive Points Both Missed
  1. **Higher-order evidence:** Both overlook that Jonah's expectation of being swayed by rhetoric is itself evidence—but about his cognitive fragility, not about free will. This higher-order evidence could justify a *slight* adjustment to his credence (e.g., from 0.9 to 0.85) as a hedge against bias, without collapsing to 0.4. This avoids violating Reflection while acknowledging his epistemic vulnerability. However, this is not required by coherence; it's a nuanced response to self-doubt.
     
  2. **Legitimate strategies for Jonah:** Both ignore options that avoid incoherence and irrationality:
     - **Decline the invitation:** Jonah can avoid exposure to the charismatic author entirely, preserving his current credence. This is rational if he believes the rhetoric will corrupt his judgment without evidence.
     - **Precommitment:** Jonah can precommit to not updating his credence without new evidence. For example, he could:
       - Write down his current evidence and reasons now.
       - Commit to only changing his view if presented with new logical or empirical evidence (not rhetoric).
       - This aligns with conditionalization and avoids diachronic incoherence. Precommitment is not a violation of rationality; it is a tool for self-control when bias is anticipated (as in Ulysses contracts).
     - **Bracket the expected shift:** Jonah can treat his future 0.4 as a temporary state to be corrected later (e.g., by revisiting the professor's critique). This views the shift as a performance error, not a rational update.

  3. **Alternative principles:** Both focus on Reflection but miss other relevant norms:
     - **The Principle of Rational Deference (Meacham):** Deference is only owed to rational future selves, not irrational ones.
     - **Self-governance (Titelbaum):** Credences should align with your current epistemic standards. Jonah's current standards (evidence-based) reject the future shift, so he need not defer.
     - **Stalnaker's principle:** If you know your future credence will be based on a mistake, you can ignore it.

  ### Conclusion
  Jonah is not incoherent, and he should not lower his credence to 0.4 now. Dev's evidential restriction on Reflection is sound, while Priya's inflexible application risks endorsing known errors. Jonah can handle the week rationally by declining, precommitting, or using higher-order evidence for minor adjustments—all without violating coherence. The core oversight is that credence changes driven by non-evidential factors do not compel deference, and agents have proactive tools to manage anticipated irrationality.
