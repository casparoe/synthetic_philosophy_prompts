  Misfire joke: "If this were a philosophy lecture..." but stop short, reassuring it’s not. Academics chuckle at the near-misfire averted; others hear a warm aside. Ensures the act isn’t hollow—emphasizes genuine intent.

  End with blessings as performatives. "May you..." is a blessing, not a prediction. It’s conventional, so it’s safe. Then the declaration is the legal performative.

  Choices: Avoiding describing the couple. Instead, focus on their actions (choosing each other) and the community’s support. Using "bearing witness" frames everyone’s role as active. The avowal line is the philosophical core—showing performative language in action without theory terms. The misfire joke nods to Austin subtly, reassuring validity without derailing into lecture.
answer: |-
  Here’s a draft grounded in performative logic, designed for clarity and warmth while honoring your constraints. The structure leans into illocutionary acts (blessing, thanking, avowing) and avoids constative assertions about the couple’s qualities or future. Austin’s "misfires" are woven in as a light, inclusive joke.

  ---

  **Wedding Remarks Draft**  

  Friends, family—thank you all for gathering here. Your presence *does* something important: it holds this moment for [Partner 1] and [Partner 2]. You’re not just watching; you’re *witnessing*, and that matters.  

  [Partner 1] and [Partner 2], look around. These people love you. They’ve traveled here not just to celebrate, but to stand with you. That’s no small thing. When life gets tangled—and it will—you’ll remember this circle around you today.  

  You’ve chosen each other. That choice isn’t a one-time declaration; it’s a promise you’ll keep making, daily. And we? We’re here to say: **we see that choice, we honor it, and we’ll hold you to it**.  

  *[Pause, slight smile]*  
  Now, if this were a philosophy lecture, I’d worry about misfires. Wrong words, wrong person... but today? We’re exactly where we need to be, with exactly who should be here. So let’s do this thing properly.  

  *[Turning fully to the couple, deliberate eye contact]*  
  **[Partner 1] and [Partner 2], I stand with you here, wholly.**  
  *[Pause]*  

  By the power vested in me...  

  ---

  ### Key Philosophical Choices & Rationale  
  1. **The Avowal Line: "I stand with you here, wholly."**  
     * **Why it works:** It’s a first-person present act of commitment—not describing a feeling ("I feel present") but *enacting* solidarity. Austin would call it a "behabitive" (taking a stance). It’s non-falsifiable; its "truth" is in the doing. Philosophers will hear the Husserl/Austin echoes; others feel its weight as a vow.  
     * **Alternative avoided:** "I’m so happy for you" (descriptive; claims inner knowledge).  

  2. **Reframing "Witnessing" as Collective Action:**  
     * **Why:** "Your presence *does* something" transforms guests from passive observers into participants in a performative act. "Witnessing" here is Austinian: it creates social reality. The line "we’ll hold you to it" is a commissive (pledging future action), not a prediction.  
     * **Alternative avoided:** "You all look wonderful" (description) or "They’ll support you" (prediction).  

  3. **The "Misfire" Joke:**  
     * **Why:** Nods to *How to Do Things with Words* without citation. "Wrong words, wrong person" flags infelicities (misfires) but dismisses them immediately—reassuring *this* act is valid. Academics grin; others hear "we’ve got this."  
     * **Alternative avoided:** Explaining infelicities or using terms like "felicity conditions."  

  4. **Blessing as Directive-Performative Hybrid:**  
     * **"May you..."** lines were avoided (too predictive). Instead, "When life gets tangled... you’ll remember this circle" **presupposes** challenges without describing the couple’s future. The imperative "look around" *directs* attention to an existing support system—grounded in the present.  

  ---

  ### Why This Structure?  
  - **No assertions about the couple:** Focus stays on *acts* (choosing, witnessing, vowing).  
  - **Family-friendly depth:** Kids/grandma hear warmth and communal promise; academics spot the performative scaffolding.  
  - **Emotion without overreach:** "We’ll hold you to it" bonds community/couple without claiming prophetic insight.  
  - **The avowal** ("I stand with you...") is the linchpin—your unmistakable performative anchor.  

  This walks Austin’s line: doing things with words while keeping the gravity (and joy) intact. Would serve as a strong foundation for the declaration itself.
