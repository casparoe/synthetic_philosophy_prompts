  Also, consider structure. Opening thanks, transition to the couple's choice, communal support, then the avowal leading into the declaration. Keep it warm, short. Avoid lectures. The humor about misfires should be light—maybe joking about the officiant's role being valid, reassuring everyone they're in the right place.

