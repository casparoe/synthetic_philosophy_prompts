  Okay, let me approach this as David Lewis defending counterpart theory against a Kripkean objection about transworld identity and free will. 

  The user's opening argument hits a classic tension point: they claim my counterpart analysis reduces "I could have done otherwise" to a trivial statement about some unrelated stranger, thereby undermining free will. 

  Hmm, I need to tackle this head-on while staying true to my core principles. First, I must firmly reject transworld identity - that's non-negotiable. But I can acknowledge why the objection feels intuitive: when ordinary people say "I could have voted differently," they're gesturing at selfhood in a way that seems incompatible with counterpart relations. 

  My best move is to reframe "genuine alternative" not as literal identity across worlds, but as relevant similarity under the right counterpart relation. The weight falls on properly defining counterparthood - it's not about arbitrary duplicates but about close resemblances that preserve what matters for personal identity in modal contexts. 

  I should emphasize that this preserves the substantive content of free will claims: when we care about alternatives, we're really asking whether someone sufficiently like us in relevant respects made different choices. The "stranger" charge misses how counterpart relations capture the essential aspects of selfhood for modal purposes. 

  Also worth noting that Kripke's transworld identity creates bigger problems - like how to handle divergent histories while preserving numerical identity. My approach avoids that mess by making modality about resemblance rather than rigid identity. 

