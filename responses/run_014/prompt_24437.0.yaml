prompt: |-
  i'm putting together a seminar on the Hart-Devlin exchange and i keep seeing people just restate the harm principle vs. legal moralism without noticing that Devlin's own argument is weirder than the label suggests. before i commite to reading anything further i want the spec: what does a theory of the proper scope of the criminal law with respect to private morality have to deliver to count as adequate -- good enough to tell a legislator which of the cases the Wolfenden report actually had to decide (consual homosexuality between adults in private, prostitution, drug use for pleasure, obscenity) it should keep, decriminalise, or leave alone? write out the desiderata: the cases it has to get right, the distinctions it can't seperate (harm to others vs. offense vs. mere disapproval; persuading vs. coercing; a moral view being true vs. being widely and intensely held; the public/private boundary itself), and the arguments it has to answer, including Devlin's claim that a society needs a shared body of moral beliefs held with enough intensity or it will fall apart, and his own concession that the law can't enforce every norm the majority dislikes. give the consideration behind each desideratum, and mark which are non-negotiable and which are just prejudices of one camp. then flag any pair you suspect can't be jointly satisfied -- i'm particularly curious whether the requirement that the state justify its moral legislation to the coerced person on grounds that person can in principle recognise and the requirement that the majority's moral convictions count as a legitimate ground for enforcement even when the minority thinks they're wrong can live together. and then, briefly, how the harm principle and Devlin's intensity limit do against the list, but keep the weight on the criteria. finally, say how confident you are in the list overall and single out the one point you're least sure of -- like whether Devlin's case is really a consequentialist one about the social fabric or a deontological one about the law having to express moral truth.
reasoning: |-
  Okay, the user is organizing a seminar on the Hart-Devlin debate and has noticed that many people oversimplify Devlin's position as just "legal moralism" versus Mill's harm principle. They want to clarify the actual criteria a theory of criminal law regarding private morality must satisfy to be considered adequate. 

  First, I need to unpack what they're asking for. They want a list of desiderata—specific requirements such a theory must meet. These include cases it should resolve correctly (like homosexuality, prostitution, etc.), distinctions it must handle (harm vs. offense, public/private boundaries), and arguments it needs to address, especially Devlin's claim about societal cohesion. 

  The user also wants to know which criteria are non-negotiable versus those that might be biased toward one side. They’re particularly interested in whether two requirements can coexist: the state justifying coercion on grounds the coerced could accept, and the majority's moral convictions counting as legitimate even if the minority disagrees. 

  I should structure this carefully. Start with the cases the theory must resolve, then move to distinctions, key arguments to address, and finally the conflicts and evaluations. The user is sharp—they’ve spotted Devlin’s "intensity" limit as a nuance most miss, so I’ll highlight how it makes his view weirder than generic legal moralism. 

  For non-negotiables, things like "must distinguish harm from mere disapproval" seem essential for any liberal framework, while "majority morals as sufficient grounds" is likely contested. The tension between justifying coercion to the coerced and accepting majority morals is the core puzzle—I’ll flag that Hart might call this impossible without shared values, while Devlin dodges it via societal survival. 

  When evaluating the harm principle and Devlin’s theory against the list, I’ll note where each struggles. The harm principle falters on prostitution (offense? exploitation?) and Devlin’s intensity test is hopelessly vague. The user’s suspicion about the two conflicting requirements seems valid—maybe they can’t be reconciled cleanly. 

  Confidence-wise, the list feels solid except for Devlin’s rationale. Is his argument consequentialist (society crumbles without shared morals) or deontological (law must mirror moral truth)? The user’s uncertainty here is spot-on; Devlin waffles. I’ll lean consequentialist but note the ambiguity. 

  Overall, the user’s done their homework. Their focus on Devlin’s weirdness and the adequacy conditions shows they want to move beyond superficial takes. I’ll keep the response dense but precise, matching their rigor.
answer: |-
  Here's a breakdown of the desiderata for an adequate theory of criminal law concerning private morality, structured for your seminar prep:

  **Core Desiderata for an Adequate Theory:**

  1.  **Decisive Guidance on Core Cases (Non-Negotiable):**
      *   **What:** Must deliver clear conclusions (criminalize, decriminalize, leave alone) for the Wolfenden cases: consensual adult homosexuality in private, street solicitation/"public nuisance" prostitution, private adult drug use for pleasure, sale/distribution of obscenity (e.g., "deprave and corrupt" standard).
      *   **Why:** The theory's primary practical purpose is to guide legislators on precisely these contested areas. Vagueness here renders it inadequate for its core function. Must handle the "hard cases" that sparked the debate.

  2.  **Robust Conceptual Distinctions (Largely Non-Negotiable):**
      *   **Harm to Others vs. Mere Offense/Disgust:** Must differentiate causing tangible, non-consensual physical, psychological, or significant material damage to specific individuals *from* causing feelings of repugnance, shock, or moral disapproval in others, even intensely. (Consideration: Preventing harm is a core state function; suppressing offense/disgust risks tyranny of the majority).
      *   **Harm to Others vs. Harm to Self:** Must address whether/when the state can legitimately prevent competent adults from causing harm *only to themselves* through criminal law. (Consideration: Autonomy vs. Paternalism).
      *   **Coercion vs. Persuasion:** Must clarify the fundamental difference between using state power (fines, imprisonment) to compel conformity and using non-coercive means (education, debate) to influence moral views. (Consideration: Liberalism's core commitment against state imposition of beliefs).
      *   **Truth of a Moral View vs. Intensity of Belief:** Must grapple with whether the *validity* of a moral principle is relevant to its legal enforcement, distinct from how *strongly* or *widely* it is held. (Consideration: Natural law vs. Positivism; can/should law enforce "false" morals?).
      *   **The Public/Private Boundary:** Must provide a workable (even if fuzzy) criterion for distinguishing conduct affecting only the willing participants in a secluded setting ("private") from conduct impacting unwilling others or occurring in shared/public spaces ("public"). (Consideration: Autonomy flourishes in private; public order and unwilling exposure matter in public).

  3.  **Essential Arguments to Address (Non-Negotiable):**
      *   **Devlin's Societal Cohesion Thesis:** Must engage with Devlin's core claim: A society requires a *shared* body of fundamental moral beliefs held with *sufficient intensity* by the populace to maintain its existence and stability. Undermining these beliefs (even via private acts) risks societal disintegration. (Consideration: Empirical claim about social stability; challenges liberal neutrality).
      *   **Devlin's "Intensity" Limit:** Must account for Devlin's concession: Not *every* majority moral dislike justifies criminalization. Only those beliefs provoking "intolerance, indignation, and disgust" intense enough to threaten the social fabric if violated. (Consideration: Attempts to limit moralism; introduces profound vagueness).
      *   **The Liberal Challenge:** Must respond to the Mill/Hart argument: The *only* legitimate ground for criminalization is preventing **harm to others**. Morality enforcement per se is illegitimate. (Consideration: Protection of individual liberty from majoritarian imposition).
      *   **The Problem of Paternalism:** Must justify or reject criminalizing acts solely because they harm the actor. (Consideration: Respect for autonomy vs. preventing self-destruction).
      *   **The Problem of Exploitation/Corruption:** Must address arguments that seemingly private acts (e.g., certain drug use, hardcore obscenity, some prostitution) inherently degrade participants or create harmful social conditions that extend beyond the immediate participants, even if consensual. (Consideration: Can consent be vitiated? Do "victimless" crimes create diffuse societal harms?).

  4.  **Justification & Legitimacy (Highly Contentious):**
      *   **Justification to the Coerced (Liberal Ideal - Contested):** The state should be able to justify its use of coercive force to the individuals being coerced on grounds they can, in principle, recognize as reasonable (even if they disagree with the specific conclusion). (Consideration: Legitimacy requires reasons beyond "because we say so/most of us believe X"; linked to respect for persons).
      *   **Majority Conviction as Sufficient Ground (Moralist Claim - Contested):** The intense moral conviction of the majority *itself* constitutes a legitimate ground for criminalization, even if the minority subject to it finds the conviction baseless or wrong. (Consideration: Democratic will; societal self-definition; Devlin's core position).

  **Suspected Incompatibility:**

  *   **The Core Tension:** The **Justification to the Coerced** and **Majority Conviction as Sufficient Ground** desiderata appear fundamentally incompatible.
      *   *Why?* Justification-to-the-coerced requires appealing to reasons the minority *could* accept (e.g., harm prevention, fairness). Appealing *only* to the majority's intense conviction ("we find this abhorrent") is precisely the kind of reason the coerced minority *cannot* recognize as legitimate justification for *their* punishment, as it offers no reason *they* should accept beyond conforming to majority taste. Devlin explicitly rejects needing to justify enforcement beyond societal self-preservation via shared morals. Hart would argue this fails the justification-to-coerced test spectacularly.

  **Evaluation Against Key Theories:**

  1.  **The Harm Principle (Mill/Hart):**
      *   *Strengths:* Excels at distinctions (Harm vs. Offense/Self-Harm; Coercion vs. Persuasion). Clearly rejects Majority Conviction as sufficient ground. Provides clear guidance: Decriminalize private consensual homosexuality & drug use; regulate public nuisance aspects of prostitution/obscenity based on harm/offense to unwilling publics. Meets Justification-to-Coeced ideal robustly. Clearly separates moral truth from enforcement.
      *   *Weaknesses:* Struggles with Devlin's Cohesion Thesis (dismisses it as empirically weak/exaggerated). Struggles with complex "harms" (exploitation in prostitution? societal degradation from drugs/obscenity? psychological harm to self?). Vagueness of "harm" itself. Public/Private boundary becomes crucial site of contestation (e.g., is buying obscenity "harmful"?). May seem inadequate to those prioritizing social cohesion via shared values.

  2.  **Devlin's "Intensity of Feeling" Moral Conservatism:**
      *   *Strengths:* Directly addresses Cohesion Thesis; takes seriously Majority Conviction/Societal Self-Definition as grounds. Provides a *potential* limit via Intensity. Acknowledges law's expressive/moral function.
      *   *Weaknesses:* Fails catastrophically on distinctions (collapses Harm/Offense/Disapproval; conflates Intensity with Truth/Sufficiency; public/private boundary subsumed under societal impact). "Intensity" is fatally vague, subjective, and easily manipulated/majoritarian. Provides *no clear guidance* on cases – when is disgust intense *enough*? Utterly fails Justification-to-Coeced. Vulnerable to "slippery slope" (what *isn't* covered by "shared morality"?). His concession (not all morals enforced) lacks principled limit.

  **Confidence & Uncertainty:**

  *   **Overall Confidence:** High in the core list (Cases, Distinctions, Arguments to Address). These capture the essential demands of the debate and the practical task facing a legislator informed by the Hart-Devlin exchange.
  *   **Key Uncertainty:** **The precise nature of Devlin's foundational claim.** Is it:
      *   *Consequentialist (Dominant Reading):* Criminalizing fundamental immorality is necessary *to prevent the collapse of society*. The shared morality is an instrument for survival/stability. (Evidence: "Society disintegrates...")
      *   *Deontological/Expressivist:* The law *must* affirm and uphold fundamental moral truth (or the society's constitutive moral commitments) *because it is right/true/essential to the society's identity*, regardless of specific collapse consequences. Enforcement is a duty of the state. (Evidence: Law as "custodian of morality"; references to shared morality defining the society itself).
      *   **My Lean:** Devlin's *primary* argument is **consequentialist** (social disintegration), but it is *underpinned* by a **deontological/expressivist** view that a society *is* its shared morality, making its affirmation non-negotiable. The "intensity" test leans consequentialist (measuring the threat level). However, the *justification* for why this shared morality matters so deeply remains ambiguous between survival and intrinsic value/identity. This ambiguity weakens his theory. **This is the point I'm least sure of**, as Devlin's text arguably supports both readings at different points.

  This framework should provide a solid foundation for your seminar, moving beyond simplistic labels to engage the deep structure and enduring puzzles of the Hart-Devlin debate. Good luck!
