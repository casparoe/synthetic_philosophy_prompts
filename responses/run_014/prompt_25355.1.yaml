prompt: |-
  I have been working on a short essay concerning a difficulty for David Lewis's Principal Principle, and I would appreciate your comments. The essay is below. I am particularly interested in whether the objection I raise to Lewis's New Principle has genuine force, or whether it rests on a confusion. I would also welcome suggestions for how the argument might be strengthened or restructured.

  ---

  The Principal Principle, as formulated by Lewis, states that a rational agent's credence in a proposition A, conditional on the proposition that the objective chance of A is x (together with any admissible evidence), should equal x. More formally: Cr(A | Ch(A) = x ∧ E) = x, where E is any admissible evidence. The principle captures the intuitive thought that we ought to defer to objective chances: if a fair coin has chance 0.5 of landing heads, our credence that it will land heads should be 0.5.

  Lewis himself identified a difficulty for the Principal Principle when combined with his Humean Best System Account (BSA) of chance. On the BSA, the chances are given by whatever system of probabilistic laws best balances simplicity, strength, and fit with the total history of the world. This means that what the chances are depends on what actually happens across all of history, future included.

  The problem of undermining futures runs as follows. Suppose the BSA assigns a non-zero chance to some future F that, if it occurred, would make a different system of laws the best system — and would therefore make a different chance function the correct one. Call F an undermining future. Conditional on F occurring, the chance of F according to the original chance function would not be what that chance function says it is, because F's occurrence would change which chance function is correct. This generates a conflict with the Principal Principle: the principle instructs us to set our credence in F equal to its chance, yet we also know that if F occurs, the chance of F was not what we took it to be.

  Lewis's proposed remedy was the New Principle (NP). Rather than deferring to the chance function Ch simpliciter, we defer to Ch conditional on the proposition that Ch is the actual chance function. That is: Cr(A | Ch = f ∧ E) = f(A | Ch = f). Lewis argued that NP reduces to the original Principal Principle in most ordinary cases and avoids the undermining problem by explicitly conditioning on the chance theory being correct.

  I wish to suggest that NP faces a residual difficulty. The New Principle requires that the chance function f assign a well-defined conditional probability to A given that f itself is the correct chance theory. But on the BSA, whether f is the correct chance theory depends on the entire pattern of events across all of history. The proposition "Ch = f" is a proposition about the total history of the world. For f to assign a probability to A conditional on this proposition, f must assign probabilities to propositions about its own correctness — propositions that, on the BSA, are global and partly about the future. This seems to require that f assign probabilities to futures that would make f incorrect, conditional on f being correct. If f is correct, then futures that would make f incorrect presumably have chance zero conditional on f being correct — but this looks as though it may beg the question, since whether those futures have chance zero is part of what is at issue.

  I suspect this circularity is not vicious, but I am not confident. I would welcome comments on whether this line of objection has force, and whether there are alternative resolutions to the undermining problem that avoid the difficulty entirely.
reasoning: |-
  Okay, the user is working on an essay critiquing David Lewis's New Principle for handling undermining futures in the Principal Principle. They've identified a potential circularity issue when the New Principle interacts with the Humean Best System Account (BSA). 

  First, I need to parse their core argument: They claim that when the chance function f tries to compute f(A | Ch=f), it must assign probabilities to global historical propositions—including those that determine f's own correctness. This seems circular because evaluating "Ch=f" requires knowing the entire history, but f is supposed to assign probabilities to that very history.

  Hmm, I recall Lewis addressed this in his 1994 paper. He argued that "Ch=f" functions as a rigid designator—once we fix f, "Ch=f" just means the actualized chance theory. So technically, f doesn't "know" it's assigning probabilities to its own correctness; it's just crunching numbers based on its own probability measure. That might defuse the circularity charge.

  But I see why the user feels uneasy. Even if mathematically coherent, it's philosophically odd for f to assign probabilities to futures that would negate f. Like a weather model predicting its own inaccuracy. Still, Lewis would insist this is a feature, not a bug—it handles undermining futures by giving them zero weight when conditioning on Ch=f.

  The user also asks about alternatives. Hall's "Newer Principle" comes to mind—it replaces Ch=f with "the chances are as they actually are," which might feel less circular. Or Ismael's approach using indexical chances. These might avoid the self-referential flavor while solving undermining.

  For strengthening their argument, I should suggest they:
  - Engage explicitly with Lewis's rigid designator move
  - Explore whether f(A | Ch=f) really is well-defined on BSA
  - Consider if non-Humean accounts avoid this entirely
  - Use a toy model to test the coherence claim

  The user's worry isn't confused—it touches real tensions in Humean chance. But Lewisians have technical responses. The deeper issue might be whether we're comfortable with chances that "know" about their own metaphysical status. Maybe that's where to push further.
answer: |-
  This is a sharp and well-structured critique that identifies a genuine tension in Lewis's New Principle (NP). Your objection **has significant force** and highlights a deep conceptual challenge for Humean accounts of chance, though it may not be a fatal *technical* flaw. Below, I’ll clarify the objection, assess its strength, suggest refinements, and outline alternative approaches.

  ---

  ### **Core Objection: A Residual Circularity?**
  Your argument targets the self-referential nature of NP under the Best System Account (BSA):
  1. **"Ch = f" is a global historical proposition**: On BSA, whether *f* is the true chance function depends on the *entire* history of the world (past, present, and future).
  2. **f must assign probabilities to its own correctness**: NP requires *f* to compute *f*(A | Ch = f). But "Ch = f" is a proposition about the global history that *f* itself governs. 
  3. **The conditional probability seems question-begging**: If *f* is correct, futures that would make *f* incorrect (undermining futures) should have *f*-probability 0 *given Ch = f*. Yet this presumes *f*’s authority while evaluating scenarios that would dethrone it.

  This *is* circular in a philosophical sense: **the chance function *f* is asked to assign probabilities conditional on a proposition ("Ch = f") that is *metaphysically dependent on the very outcomes *f* is probabilifying***. 

  ---

  ### **Does the Objection Succeed? Assessing the Force**
  - **Lewis's defense (and its limits)**:  
    Lewis (1994) argued this circularity is benign because *f*(A | Ch = f) is *mathematically well-defined*: once we fix *f*, "Ch = f" is a specific proposition in the domain of *f*. Technically, *f* can compute the probability of A conditional on the set of histories where *f* is the best system.  
    - **Why this may not satisfy**: While mathematically coherent, it feels *conceptually unstable*. *f* is being used to assign probabilities to histories that would determine whether *f* is "correct" — a status that, for Humeans, is *not* a primitive fact but *emerges* from the history. If *f* assigns positive probability to an undermining future *F* (where a different system is best), but *also* assigns *f*(F | Ch = f) = 0, this strains the intuition that chances should track "possible" futures.

  - **A genuine difficulty**:  
    The circularity becomes acute for **non-trivial chance theories** (e.g., statistical mechanics or quantum mechanics under BSA). Here, "Ch = f" is an immensely complex, history-dependent proposition. For *f* to compute *f*(A | Ch = f), it must "know" its own metaphysical status across all possible histories — a task that seems to require prior knowledge of which histories make *f* the best system. This risks conflating:
    - *Epistemic* probability (our credence about which system is best)
    - *Metaphysical* chance (the best system itself).

  **Verdict**: Your objection **successfully exposes a residual problem** for NP under BSA. While NP technically avoids contradiction, it relies on a *fragile equilibrium* between chance and metaphysics that many find philosophically unsatisfying. It doesn’t so much *solve* the undermining problem as *repackage* it into the structure of conditional chance.

  ---

  ### **Strengthening the Argument**
  1. **Emphasize the incoherence of *f*'s perspective**:  
     Stress that *f* is *defined* by BSA as the best summary of *actual* history. Yet *f*(· | Ch = f) requires *f* to evaluate *counterfactual histories* where it *is* the best system — including histories where undermining occurs. But if *f* is *not* the best system in a history, it *lacks authority* to assign probabilities there. This makes *f*(· | Ch = f) an *artificial* construct, not a natural probability.

  2. **Use a toy model**:  
     Construct a minimal world (e.g., finite coin-flip sequences) where:
     - The "best system" is simplicity-focused (e.g., "chance of heads = 0.4" if ≥40% of flips are heads).
     - An undermining future *F* exists (e.g., a sequence with <40% heads, making a different system best).  
     Compute *f*(F | Ch = f): it *must* be 0 (since *f* only "trusts" itself if *F* doesn’t occur). But this implies *f* assigns probability 0 to futures that are *physically possible* (and even have positive unconditional *f*-chance). This highlights the disconnect.

  3. **Contrast with non-Humean chance**:  
     Note that non-Humean accounts (e.g., primitive chances or propensity theories) avoid this. For them, "Ch = f" is a *metaphysical primitive*, not history-dependent. NP faces no self-reference issue there, underscoring that the problem arises specifically from BSA’s reductionism.

  ---

  ### **Alternative Resolutions**
  1. **Hall's "Newer Principle" (NNP)**:  
     Ned Hall (1994) proposed:  
     \[ \text{Cr}(A | \text{Ch} = f \land E) = f(A | \text{The chances are whatever they actually are}) \]  
     - **Advantage**: Removes direct self-reference by using a "blind" indexical ("actually are").  
     - **Problem**: Still relies on *f* evaluating histories where chances differ, and the meaning of "actually" in a Humean framework is contested.

  2. **Ismael's Indexical Account**:  
     Jenann Ismael (2008) treats chance as *indexical*: chances are relative to a temporal perspective. Later evidence can override earlier chances without contradiction.  
     - **Avoids undermining**: Chances aren't "undermined" by the future; they are superseded.  
     - **Cost**: Abandons Lewis's timeless, objective chance.

  3. **Reject Humeanism**:  
     Non-Humean accounts (e.g., propensities or primitivism) avoid undermining entirely. The cost is metaphysical inflation.

  4. **Modify BSA**:  
     Some propose restricting BSA to *past* evidence (making chance "evolving"), but this clashes with Lewis's original view.

  ---

  ### **Conclusion**
  Your objection is **both valid and important**, exposing a foundational tension in Lewis’s project: NP’s mathematical fix doesn’t fully reconcile Humean metaphysics with the normative force of chance. While not a *technical* refutation, it shows that NP under BSA requires chance to perform a paradoxical self-validation. Strengthen the essay by:
  - Framing the circularity as a *metaphysical* (not just formal) problem.
  - Contrasting Humean vs. non-Humean implementations of NP.
  - Briefly surveying alternatives (Hall, Ismael) to highlight trade-offs.

  This critique remains a live issue in philosophy of probability — your essay contributes clearly to that debate. If you pursue this further, engage with Hall's NNP and Ismael’s work to test if they truly resolve the tension.
