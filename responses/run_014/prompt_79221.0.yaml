answer: |-
  ## PRACTICE DIRECTION No. 4: THE MORAL ASSESSMENT OF HISTORICAL CONDUCT

  **Issued by the Office for Temporal Standards under Section 7(1)(c) of the Chronological Integrity Act 2010**

  **Date: 17th Vendémiaire, CCXXXI (Regulatory Calendar)**

  **Preamble**

  1.  The Office for Temporal Standards ("the Office") is established to regulate scholarly temporal practice and ensure the integrity of historical discourse within the Realm.
  2.  It has come to the Office's attention that certain Regulated Persons engage in the assessment of Historical Actors' Conduct using standards, values, or normative frameworks demonstrably alien to the Temporal Context of said Conduct. Such assessments constitute Prohibited Presentism, a Category 1 Temporal Breach under Schedule 2 of the Temporal Standards Regulations 2012 ("the Regulations").
  3.  This Practice Direction ("the Direction") provides mandatory guidance on the application and enforcement of Regulation 15 (Prohibition on Anachronistic Moral Assessment) and supersedes all previous informal guidance notes on the subject.
  4.  The fundamental principle governing this area is that the Moral Valence of Historical Conduct must be determined exclusively by reference to the standards, norms, and legal frameworks that were operative and enforceable within the specific Temporal and Geographical Context of that Conduct. Assessments utilising the standards of the historian's own time are strictly forbidden.

  **Definitions**

  5.  For the purposes of this Direction:
      *   **"Actor's Own Designations"**: The terms, categories, and self-understandings employed by the Historical Actor themselves, or contemporaneous persons directly interacting with them within the relevant context, to describe their actions, status, or identity. This excludes retrospective categorisation by historians.
      *   **"Enforced Standards"**: The prevailing legal statutes, customary practices, religious doctrines, or social norms that were actively upheld and imposed by recognised authorities (state, ecclesiastical, tribal, or other dominant institutional power) within the relevant Temporal and Geographical Context. Where conflict exists between stated ideals and actual enforcement, the latter prevails for assessment purposes.
      *   **"Historical Actor"**: Any human agent whose actions or existence form the subject of historical research or teaching by a Regulated Person.
      *   **"Historical Conduct"**: Any action, omission, statement, belief, or practice attributable to a Historical Actor within a specific Temporal Context.
      *   **"Moral Valence"**: The determination of whether Historical Conduct was "good", "bad", "virtuous", "vicious", "praiseworthy", "blameworthy", "progressive", "regressive", or any similar evaluative judgement.
      *   **"Prohibited Presentism"**: The application of contemporary (i.e., post-20th century Common Era) ethical, political, social, or legal standards to the assessment of Historical Conduct.
      *   **"Regulated Person"**: Any individual licensed by the Office to engage in the Teaching of History or the Writing of History for public dissemination within the Realm.
      *   **"Temporal Context"**: The specific combination of date(s) and geographical location(s) in which the Historical Conduct occurred.

  **Commencement and Transition**

  6.  This Direction comes into force on 1st Frimaire, CCXXXI.
  7.  All assessments of Historical Conduct undertaken by Regulated Persons after the Commencement Date must comply fully with this Direction.
  8.  Existing publications or teaching materials containing assessments deemed non-compliant with this Direction upon review must be withdrawn or amended prior to their next use. A Transitional Amendment Licence (Form TAL-4) may be applied for where substantial revision is required; such Licences will be granted subject to a Compliance Undertaking.

  **Governing Principle & Application**

  9.  **Assessment Standard (Mandatory):** In assessing the Moral Valence of any instance of Historical Conduct, the Regulated Person **must** utilise the Enforced Standards applicable to that Conduct within its precise Temporal Context. No other standard is permissible.
  10. **Actor's Own Designations (Mandatory):** Where categorisation of a Historical Actor or their Conduct is necessary (e.g., regarding social role, legal status, perceived intent), the Regulated Person **must** employ the Actor's Own Designations. Retrospective application of modern categories (e.g., applying contemporary concepts of human rights, gender identity, or political ideology where such concepts demonstrably did not structure the Actor's self-understanding or the Enforced Standards of their context) constitutes Prohibited Presentism.
  11. **Atypical Standards:** Instances where a Historical Actor professed or appeared to act upon personal ethical standards that diverged significantly from the Enforced Standards of their Temporal Context **do not** establish a permissible alternative assessment standard. The Moral Valence is determined solely by conformity to or deviation from the Enforced Standards. An Actor's personal dissent from prevailing norms does not license the historian to substitute those personal standards for the Enforced Standards when rendering Moral Valence. (See Annex, Example 3).
  12. **Office Enforcement:** The Office's assessment of a Regulated Person's compliance with this Direction, including the imposition of sanctions for breaches (Category 1 Temporal Breach: Revocation of Licence, Mandatory Retraining, Publication Retraction), shall be conducted according to contemporary (21st century Common Era) standards of professional conduct, administrative fairness, and regulatory best practice as defined by the Office and the Regulations. *[Note: This is Clause 12]*.
  13. **Permissible Severity of Judgement:** While the *basis* for Moral Valence is fixed by the Enforced Standards, the *tone and emphasis* accorded to assessments of negative Conduct judged against those Enforced Standards may be moderated by temporal distance. The Schedule to this Direction provides the Permitted Judgement Gradient.

  **Licensing Procedure for Complex Assessments**

  14.  Where a Regulated Person anticipates significant complexity in determining the precise Enforced Standards applicable to a specific case of Historical Conduct (e.g., periods of rapid social transition, areas of contested jurisdiction), they may apply for a Pre-Assessment Temporal Compliance Certificate (Form TCC-4).
  15.  Application must be made at least 60 working days prior to the intended dissemination (publication or teaching) of the assessment. The application must detail the Conduct, Temporal Context, proposed Enforced Standards to be applied, and justification based on primary sources demonstrating enforcement.
  16.  The Office will review the application and may issue a Certificate confirming the proposed assessment standard is compliant, request modification, or reject the application. A Certificate provides a statutory defence against allegations of Prohibited Presentism relating to the standard applied for the specified Conduct, provided the final assessment adheres strictly to the Certified standard.

  **Annexe: Worked Examples**

  *   **Example 1 (Application of Enforced Standards):** An official in the 15th-century Aerelonian colonial administration authorised the compulsory relocation of indigenous communities under statutes deemed lawful by the then-ruling Aerelonian Crown. **Compliant Assessment:** "The official's actions accorded fully with the Enforced Standards of the Aerelonian colonial legal framework, which vested such authority in administrators and prioritised territorial consolidation. Contemporary Aerelonian jurisprudence provided no basis for challenging compulsory relocation orders grounded in Crown prerogative." **Non-Compliant Assessment:** "The official's actions constituted a violation of fundamental human rights and were morally reprehensible by modern standards of self-determination."
  *   **Example 2 (Actor's Own Designations):** A figure prominent in pre-modern mercantile activity owned other human beings, designated under the Enforced Standards of the time and place as "chattel servants" or "bonded labourers". **Compliant Assessment:** "The individual managed a significant portfolio of bonded labourers, a status explicitly defined and regulated by the commercial codes of the City-State of Meridia, where such ownership conferred legal rights and social standing upon the holder." **Non-Compliant Assessment:** "This merchant was a slave-owner, participating in a brutal system of exploitation."
  *   **Example 3 (Atypical Standards):** A 17th-century theologian argued publicly for greater tolerance towards minority religious groups, a position contravening the Enforced Standards (state-mandated religious uniformity) and leading to their prosecution. **Compliant Assessment:** "The theologian's published views contravened the Edict of Uniformity enforced by the Concordat authorities. Their prosecution was a lawful application of prevailing statutes designed to maintain religious and social order, despite the theologian's personal belief in the virtue of tolerance." **Non-Compliant Assessment:** "The theologian was a heroic pioneer of religious freedom, unjustly persecuted by an intolerant regime." (Note: While the *fact* of prosecution for dissent is compliantly assessed against Enforced Standards, the terms "heroic" and "unjustly" import a contemporary Moral Valence not derivable from the Enforced Standards *of that time*).

  **Schedule: Permitted Judgement Gradient**

  | Elapsed Time (Years) | Permitted Descriptive Tone for Conduct Assessed as Negative under Enforced Standards |
  | :------------------- | :--------------------------------------------------------------------------------- |
  | 0 - 50               | Neutral statement of fact required (e.g., "Action X contravened Standard Y").      |
  | 51 - 100             | Mildly critical modifiers permissible (e.g., "problematic", "controversial").      |
  | 101 - 200            | Moderately critical modifiers permissible (e.g., "harmful", "exploitative").       |
  | 201 - 300            | Strongly critical modifiers permissible (e.g., "brutal", "oppressive").            |
  | 301 - 500            | Very strongly critical modifiers permissible (e.g., "abhorrent", "barbaric").      |
  | 501+                 | Most severe critical modifiers permissible. Tone must still derive from period-specific condemnation evidenced in sources. |

  **Issued by Order of the Chief Temporal Auditor, Office for Temporal Standards.**

  ---

  **Note on the Satire**

  This document satirises the strong presentist prohibition against historians making *any* moral judgements about the past using contemporary values. By applying this prohibition consistently and bureaucratically, the Direction exposes its absurdities: (1) It forces historians to adopt the perspective of the powerful ("Enforced Standards") as the sole moral arbiter, implicitly endorsing historical injustices if they were legal. (2) It mandates the use of "Actor's Own Designations," requiring historians to replicate oppressive or superseded categories (e.g., accepting "chattel" as a valid description). (3) The arbitrary "Permitted Judgement Gradient" highlights the impossibility of finding a non-arbitrary point where moral judgement becomes "safe." (4) Its handling of "Atypical Standards" deflates moral courage or insight, reducing it to mere non-conformity irrelevant to assessment. (5) Crucially, the Office's self-exemption (Clause 12) reveals the inherent contradiction: the rule against presentism is itself enforced presentistically, demonstrating the unavoidable nature of present concerns in historical practice.

  The strongest reply from the non-judgement historian might be that the satire conflates *explanation* (requiring historical context) with *endorsement*, and that historians can explain past norms without adopting them morally. The Direction deliberately overstates by making "Enforced Standards" purely institutional and ignoring subaltern or contested norms, and by formalising the suppression of retrospective moral categorization (Whig history) to an extreme degree. Its bureaucratic machinery highlights the practical and ethical impossibility of the rule when applied rigorously to teaching and writing for present audiences who inevitably bring contemporary moral frameworks. The target is the notion that historical understanding requires historians to completely suspend their own moral compass when evaluating past actions.
