answer: |-
  Here is a disambiguation of Hacking's slogan, structured as requested, followed by analysis of the scene and R.'s position.

  ### Numbered Menu of Precise Theses
  1.  **Criterion of Reality (Metaphysical)**: *Thesis*: An entity is real if and only if it can be reliably manipulated (e.g., isolated, sprayed, or used as a tool) to produce predictable, observable effects. *Verdict*: Substantive and defensible, but vulnerable. *Strongest Pressure*: Manipulative success may arise from systemic properties or background conditions (e.g., collective electron behavior mimicking a "hole"), not a discrete entity.  
  2.  **Epistemic License**: *Thesis*: Successful manipulation of an entity licenses justified belief in its existence, regardless of ultimate metaphysical status. *Verdict*: Defensible. *Strongest Pressure*: Does not guarantee truth (manipulation could align with a false model, e.g., 19th-century "luminiferous aether" experiments).  
  3.  **Referential Grounding (Semantic)**: *Thesis*: A theoretical term (e.g., "electron") refers to a real entity if it is stably associated with experimental interventions (e.g., spraying), fixing its reference across theories. *Verdict*: Substantive and defensible, but vulnerable. *Strongest Pressure*: Reference may shift or be ambiguous across theories (e.g., "electron" in Bohr vs. QFT), and fails for derivative posits (e.g., holes) where the term describes emergent behavior.  
  4.  **Selective Realism (Entity vs. Theory)**: *Thesis*: Entities that are manipulable persist through theory change, even when the theories describing them are discarded; theories are tools, but manipulated entities are real. *Verdict*: Vulnerable. *Strongest Pressure*: Historical counterexamples (e.g., manipulated phlogiston or caloric fluid were later abandoned).  
  5.  **Operational Definition**: *Thesis*: "Reality" is operationally defined by intervenability; to be real just is to be sprayable. *Verdict*: False. *Strongest Pressure*: Excludes legitimate entities that cannot be manipulated (e.g., stars, dinosaurs) or abstracta (e.g., mathematical objects).  

  ---

  ### Scene Analysis: Neve's Challenges and R.'s Dismissal  
  - **Electron Holes Challenge**:  
    - *Which reading lets R. dismiss it?* **Reading 1 (Criterion of Reality)**. R. treats manipulability as sufficient for reality, ignoring ontological status (e.g., holes as "absence").  
    - *Neve's non-caricatured response*: "But spraying holes relies on collective electron behavior—you're manipulating *electrons* to create a useful pattern. Does patterning electrons make the pattern 'real' in the same way electrons are?"  
  - **Pessimistic Induction (Discarded Entities) Challenge**:  
    - *Which reading lets R. dismiss it?* **Reading 4 (Selective Realism)**. R. claims manipulable entities "stay put" despite theory changes.  
    - *Neve's non-caricatured response*: "What about Millikan's oil-drop experiments 'spraying' electrons? If today's electron is ontologically distinct from Thomson's 'corpuscle', is 'manipulability' enough to guarantee continuity?"  
  - **Is the quarrel merely verbal?** Partially. It hinges on definitions of "real" (metaphysical vs. epistemic) and "entity" (fundamental vs. emergent). R. conflates manipulation with fundamental existence; Neve distinguishes them.  
  - **Party-Line Meaning**: Likely **Reading 2 (Epistemic License)**—a glib justification for trusting instrumental success without ontological commitment.  

  ---

  ### Origin Story (Fractional Charge Search)  
  The slogan's origin does not embarrass it. In Hacking’s example (spraying electrons to change a sphere’s charge), the intervention verified the electron’s reality. Fractional charge searches (e.g., for quarks) similarly rely on manipulating hypothesized entities—failure wouldn’t undermine the slogan’s logic, as it only claims manipulability implies reality, not that unmanipulated entities are unreal.  

  ---

  ### Final Answer  
  R. must rely on **Reading 1 (Criterion of Reality)** to dismiss the hole question, as it reduces "reality" to intervenability, ignoring Neve's distinction between fundamental particles and emergent phenomena.  

  \answer{Criterion of Reality}
