   III. Cruxes:

   We list sub-questions that could move at least one party. For each crux, we provide:
     - The question
     - The evidence or arguments both would accept as bearing on it
     - Each side's prediction (written in advance)

   Crux 1: Calibration of Expert Forecasters
     - Question: When expert forecasters (e.g., in meteorology, medicine, or geopolitics) assign probabilities to single events, how well calibrated are they? (That is, do events with assigned probability p occur roughly p percent of the time?)
     - Evidence: Studies of forecasting tournaments (e.g., the Good Judgment Project) and calibration curves.
     - F's prediction: F would expect that only when forecasts are made for events that are part of a well-defined reference class (e.g., "patients with these symptoms") will the forecasts be calibrated. For unique events (e.g., "this specific patient" without a reference class) or events that are not repeatable, calibration is not possible and therefore the probabilities are not meaningful.
     - S's prediction: S would expect that well-calibrated forecasts are possible for any event, provided the forecaster has relevant information and updates coherently. The subjectivist would note that calibration is a desirable property of a forecaster, but even without a reference class, a coherent degree of belief is still meaningful. However, S would expect that in practice, using frequency data (i.e., building a reference class) improves calibration.

   Crux 2: Behavior under Model Misspecification
     - Question: In statistical inference, when the model is misspecified (i.e., the data-generating process is not in the model class), how do frequentist and Bayesian methods perform?
     - Evidence: Simulation studies and theoretical results (e.g., White 1982 on maximum likelihood under misspecification, and Bayesian asymptotics under misspecification).
     - F's prediction: F would expect that frequentist methods (e.g., M-estimation) can still provide consistent estimates of the parameter that minimizes the Kullback-Leibler divergence (or other loss) and that confidence intervals can be adjusted to have approximately correct coverage. F would also note that without a true model, the interpretation of the parameter is tied to the procedure and the loss function.
     - S's prediction: S would expect that Bayesian methods, by conditioning on the data, provide a coherent update of beliefs. However, under misspecification, the posterior may concentrate on the pseudo-true parameter, and the interpretation of the posterior as representing uncertainty about the true parameter is compromised. S might argue that the prior and model can be chosen to be robust, but the problem remains.

   Crux 3: The Reference Class Problem
     - Question: When assigning a probability to a single event (e.g., this patient's recovery), how should one choose the reference class? And does the subjectivist avoid the problem?
     - Evidence: Analysis of the reference class problem (e.g., by Reichenbach) and practical examples (e.g., in medicine, where a patient belongs to multiple reference classes).
     - F's prediction: F would argue that the reference class must be chosen based on causal relevance and homogeneity. But F acknowledges that this is often difficult and that the problem is a challenge for the frequentist view. F might also note that without a reference class, the probability is not defined.
