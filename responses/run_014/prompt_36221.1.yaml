   | **Quantum Mechanics** | Quantum probabilities are relative frequencies in repeated experiments under identical conditions. They are objective in the sense that they are determined by the physical setup and do not depend on an agent's beliefs. | Quantum probabilities can be interpreted as coherent degrees of belief about the outcome of a measurement, which are constrained by the quantum state (which is objective). The agent's belief about the outcome is updated by the quantum mechanical probabilities. | Substantive: The frequentist sees quantum probabilities as frequencies, while the subjectivist sees them as constraints on beliefs. However, both agree on the mathematical formalism and the numerical values. |
