   | **The Basis of Objective Constraints** | Objective constraints on probabilities come from the physical world via repeated trials. The choice of reference class is guided by empirical knowledge and causal structure. | Objective constraints on degrees of belief come from the requirement of calibration and from the use of external data (via exchangeability). However, the subjectivist allows that two agents with the same information may have different priors. | Substantive: The frequentist seeks an objective grounding in the world, while the subjectivist sees objectivity as arising from intersubjective agreement or calibration. |
   | **Propensity** | Some frequentists (but not all) may endorse propensity interpretations for single cases (e.g., in quantum mechanics), where propensity is a physical disposition that manifests in long-run frequencies. | The subjectivist does not require propensities. Degrees of belief may be informed by physical symmetries or propensities if available, but they are not necessary. | Substantive: The frequentist who is a propensity theorist posits a physical property (propensity) that the subjectivist does not require. However, note that the original frequentist in the problem is of the older statistics tradition and might reject propensities. We note that the frequentist here is described as focusing on relative frequency, so we assume she does not endorse propensities. If she does, we adjust. But the problem states: "a probability claim is a claim about relative frequency", so we stick to that. Thus, for our F, propensity is not accepted. So we leave this row out or adjust. |

