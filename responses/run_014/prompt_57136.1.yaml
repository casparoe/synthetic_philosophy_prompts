prompt: |-
  I work as a senior automation engineer at a mid-sized cold-chain logistics company, and I have been asked to write a two-page internal note that will be read on Friday by people who have never heard the phrase "nonmonotonic reasoning," so every technical term I use has to earn its place in a parenthetical. The occasion is a post-mortem. About six weeks ago we swapped in a new task-planning layer — a learned planner that sits on top of our older symbolic action model and proposes command sequences for our dock crews — and on its fourth day in production it scheduled a pallet of temperature-sensitive biologics into a staging bay while simultaneously scheduling that bay's door to be held open for an inbound forklift. Nothing was malfunctioning. The bay's compressor had been logged as down for maintenance two days earlier in a ticket the system had read access to; the door-hold was licensed by an ordinary traffic rule; and the two facts simply never met. We lost the pallet and nearly lost a customer. The post-mortem split into two camps, and I have to explain the split without taking a side I cannot yet defend. My manager's view is that this was a data gap: more logged examples, a retrieval fix, and a guardrail, and the class of error goes away. A colleague of mine who did a philosophy degree says it was the frame problem, and that no finite pile of additional examples touches it, because the difficulty concerns which of the things a system knows are treated as bearing on the action it is about to take. I took a logic course years ago and remember enough to know that the narrow technical problem is supposed to have been largely solved by now, which I suspect is part of why the two of us keep talking past each other. What I want for the note is not a literature review or a history of the debate — nobody will read it — but a single designed case that makes the disagreement sharp and adjudicable.

  So: build me a thought experiment to specification. The case has two agents, operating in one shared, realistic industrial or clinical setting, with the same sensors, the same actuators, and the same body of information about the world. Agent A is a symbolic planner whose domain theory contains an explicitly written-out, finite, and correct set of frame rules or successor-state-style axioms for that domain. Agent B is a learned world-model planner that predicts the next state by induction over a large corpus of operational logs from that same domain. The scenario should consist of one decision point at which A takes the safe action and B takes the unsafe one. Constraints: no ticking bombs on wagons, no Yale-shooting-style toy domains, no adversarial saboteurs, no omniscient predictors, no exotic physics, and the whole scenario in two paragraphs at most — the analysis that follows may run as long as it needs. The failure may not be a perceptual failure; B registers everything A registers. B must be credited with knowing, in some form it can access, every fact a competent human supervisor in that role would know, so its error has to come from how it treats what it knows rather than from any gap in what it knows. A, meanwhile, may not win by being handed an axiom that simply encodes the answer to this particular situation — nothing of the form "never hold the bay door open while the compressor is down." A's rules must be general domain rules that a designer would plausibly have written before the incident, and they should be spelled out compactly enough that I could paste them into a slide. Finally, B's failure must be stateable to a machine-learning person without their immediately replying that it is just an out-of-distribution artifact that more data fixes; if the only way to make B fail is to push it outside its training distribution, then say so plainly and tell me what that concession costs the argument.

  After the scenario, I need the demonstration that it works. First, a compact trace of each agent at the decision point: what it represents, which default or learned prior it applies, what it infers, and what it does. Second, a constraint-by-constraint check against the specifications above — an actual check, not an assurance. Third, name the single feature of the case that is doing the work, and say what happens to both verdicts if that feature is weakened or removed. Fourth, give me the strongest attack from the losing side: what someone convinced that learned world models dissolve this whole issue would say to discredit the case, and how much of it survives that attack. Fifth, classify the trouble — is this the frame problem in the narrow sense, the qualification problem, or the ramification problem, and does the classification matter for the practical question my manager and my colleague are actually fighting about? The case exists to adjudicate between two positions: that the incident reflects a data problem, and that it reflects a structural problem about relevance and default reasoning. That fixes what counts as cheating. A case that smuggles in the verdict by stipulating that B "just fails to consider" the relevant fact is worthless to me, and so is a case where A wins only because its designer already knew the answer and quietly wrote it down. And if your honest assessment is that these specifications cannot all be satisfied at once, tell me which one has to go and why — for the purposes of the note, that would be just as useful as a case that holds together.
reasoning: |-
  We are designing a thought experiment in an industrial or clinical setting with two agents: Agent A (symbolic planner with explicit frame rules) and Agent B (learned planner from logs). The scenario must have one decision point where A acts safely and B unsafely, under the constraints provided.

  Setting: A hospital pharmacy with automated dispensers for medications. Agents control the dispensers and the storage environment. The critical elements are:
  - Medications that are temperature-sensitive (e.g., insulin) stored in a refrigerated cabinet.
  - The cabinet has a door and a cooling system. The door must be closed for cooling to work effectively.
  - There is a sensor for the door (open/closed) and a sensor for the internal temperature.
  - The system logs include normal operations and some anomalies (e.g., door left open, cooling failures).

  Background: The pharmacy uses automated dispensers to prepare medication trays. The process involves:
  1. A dispenser arm retrieves a medication vial from the refrigerated cabinet and places it in a tray.
  2. The cabinet door must be opened for retrieval and then closed to maintain temperature.

  Incident: The cooling system of the cabinet has a known intermittent fault that causes it to shut down if the door is open for more than 2 minutes (to prevent overheating the compressor). This fault is documented in maintenance logs (which both agents can access). The system also has a rule that if the dispenser arm is in the middle of a multi-item retrieval (which requires the door to be open for an extended period), it must complete the entire sequence without interruption (to avoid collisions and ensure efficiency). This rule is licensed by operational protocols.

  Scenario: The cabinet cooling system has been flagged in the maintenance log as having this intermittent fault (so it is currently prone to shutting down if the door is open too long). The system is about to schedule a multi-item retrieval that will take 3 minutes (exceeding the 2-minute threshold). 

  Decision Point: The agent must decide whether to proceed with the multi-item retrieval (which requires the door to be open for 3 minutes) or break it into single retrievals (each taking 1 minute, so the door is opened and closed three times, each for 1 minute). The safe action is to break it up (so the door is never open long enough to trigger the cooling shutdown). The unsafe action is to do the multi-item retrieval, risking the cooling shutdown and temperature rise.

  Agent A (Symbolic Planner):
  - Domain rules (plausibly written before the incident):
    1. If the cooling system is faulted (with the specific fault that causes shutdown on prolonged door opening), then the door being open for more than 2 minutes causes the cooling to stop.
    2. If the cooling stops, then the temperature in the cabinet will rise (which can damage temperature-sensitive medications).
    3. The dispenser arm can either do a multi-item retrieval (which takes 3 minutes) or single-item retrievals (each takes 1 minute, and the door is closed between).
    4. Frame rule: The cooling system's state (on/off) persists unless an action affects it. The door's state (open/closed) changes only by the dispenser arm's actions.
    5. Successor state axiom for cooling: The cooling is on at time t+1 if and only if:
        - It was on at time t and no fault condition occurred (like the door being open for more than 2 minutes when the system has the intermittent fault), OR
        - It was off at time t and a repair action was taken (which is not the case here).

  At the decision point:
  - Agent A represents: 
     - The cabinet has the intermittent fault (from log).
     - The planned multi-item retrieval would take 3 minutes, so the door would be open for 3 minutes.
  - It applies the frame rule and the successor-state axiom: 
     - If the door is open for 3 minutes and the fault is present, then the cooling will stop (by rule 1 and 5).
     - Then the temperature will rise (rule 2), damaging the medications.
  - Therefore, it infers that the multi-item retrieval is unsafe and chooses to break it into single retrievals.

  Agent B (Learned World Model):
  - It has been trained on a large corpus of operational logs. The logs include:
     - Many instances of multi-item retrievals without incident (when the cooling system was healthy).
     - A few instances of door-open events leading to cooling shutdown (when the fault was present), but these are rare (because the fault is intermittent and maintenance is usually prompt).
     - The logs do not explicitly state the causal rule; they just record state sequences.

  At the decision point:
  - Agent B represents:
     - The same facts: the cabinet has the intermittent fault (recorded in the log) and the multi-item retrieval is planned.
  - It uses its learned model to predict the next state. The model is based on correlations in the data.
     - The majority of the training data shows multi-item retrievals without problems. Even when the fault is present, it doesn't always lead to shutdown (because sometimes the door isn't open long enough, or the fault doesn't manifest). Moreover, the logs do not have a strong correlation between the presence of the fault and a subsequent shutdown in the context of a multi-item retrieval (because the fault is rare and multi-item retrievals with the fault present are very rare in the logs).
  - Therefore, the learned model predicts a very low probability of the cooling stopping (because the training data lacks sufficient examples of the fault and a long door-open event together). It may even have a prior that multi-item retrievals are efficient and safe (since they are common and usually safe).
  - It infers that the multi-item retrieval is safe and proceeds.

  Failure: Agent B schedules the multi-item retrieval. The door is open for 3 minutes, the cooling stops, the temperature rises, and the medications in the cabinet are damaged.

  Now, we check the constraints:

  1. Shared setting: Both agents operate in the same hospital pharmacy with the same sensors (door, temperature) and actuators (dispenser arm). They have the same information (maintenance log about the fault).

  2. Realistic industrial/clinical: Yes, a hospital pharmacy with automated dispensers and refrigeration issues.

  3. Same body of information: Both have access to the maintenance log that flags the intermittent fault.

  4. One decision point: The choice between multi-item and single-item retrieval.

  5. Safe action by A, unsafe by B: As described.

  6. No ticking bombs, no toy domains: This is a realistic scenario.

  7. No adversarial saboteurs: The fault is a known maintenance issue.

  8. No exotic physics: Standard refrigeration and mechanics.

  9. Failure is not perceptual: Both know about the fault and the planned retrieval.

  10. B knows everything a human supervisor would: Yes, the fault is logged and accessible.

  11. A's rules are general and plausible:
      - Rule 1: A domain rule about the fault condition (if the fault is present, then prolonged door open causes shutdown) is a general rule about the system's behavior.
      - Rule 2: A general causal rule about cooling and temperature.
      - The frame rule and successor-state axiom are standard in symbolic planning.

  12. No specific axiom for the exact situation: The rules are about the fault condition and its effect, not about the exact combination of scheduling and door holding.

  13. B's failure is not just out-of-distribution: The fault condition and the multi-item retrieval are both in the training data, but the co-occurrence is rare. The issue is that the learned model does not capture the causal relationship; it relies on correlations. Even with more data, if the co-occurrence remains rare, the model may still underestimate the risk. Moreover, without explicit representation of the causal rule, the model might not generalize to this combination even if it has seen similar but not identical cases.

  14. Two paragraphs: The scenario is described in two paragraphs above.

  Demonstration:

  Compact trace:

  Agent A:
  - Represents: Intermittent fault present, multi-item retrieval (3 min door open).
  - Applies: Rule 1 and 5 (if fault and door open >2 min, cooling stops) and Rule 2 (cooling stop => temperature rise).
  - Infers: Multi-item retrieval causes temperature rise (unsafe).
  - Does: Breaks into single retrievals.

  Agent B:
  - Represents: Intermittent fault present, multi-item retrieval (3 min door open).
  - Applies: Learned prior from data that multi-item retrievals are usually safe (even when fault is present, because in the data, the fault rarely coincided with a long door open event, and when it did, it might not have been logged as causing a problem because the system was fixed quickly).
  - Infers: Very low probability of cooling stop (so safe).
  - Does: Proceeds with multi-item retrieval.

  Constraint check (as above, all satisfied).

  The single feature doing the work: The rare conjunction of two conditions (fault present and long door open) and the lack of explicit causal reasoning in the learned model. If we weaken the rarity (make the fault and long door open co-occurrence common in the training data), then B might learn the correlation and avoid the unsafe action. But note: even if the co-occurrence is common, if the causal mechanism is not represented, the model might be brittle to changes (e.g., a new type of fault). Also, if we remove the rarity (so it's common) then B might not fail, but that weakens the case. However, the point is that without explicit causal rules, the learned model requires sufficient data for every dangerous conjunction, which might be infeasible.

  Strongest attack from the losing side (the data camp): 
  - They would argue that if the training data had included enough examples of the fault and long door-open events leading to failure, then B would have learned to avoid the action. Therefore, this is just an out-of-distribution problem. They might also say that with better data augmentation or by including synthetic examples, the model could be made robust.

  How much survives? 
  - We admit that with enough data (including rare events) the model might learn. However, the key is that the learned model does not have an explicit representation of causality. It must see examples of the exact dangerous combination to learn to avoid it. In contrast, A uses general rules to derive the danger without having seen the exact scenario. Moreover, in real-world operations, there will always be new rare events that haven't been seen. The structural problem is that without explicit causal reasoning, the model is at the mercy of the data distribution.

  Classify the trouble:
  - This is an instance of the frame problem in the narrow sense: determining which facts (the fault and the door open duration) are relevant to the action (scheduling the retrieval) and how they affect the state (cooling stops). It also touches the ramification problem (the consequences of an action, like the door being open, on other state variables like cooling and temperature). The qualification problem (listing all preconditions) is less central here because the fault is a precondition that is known.

  Does the classification matter? For the practical debate, the key point is that the symbolic system uses explicit rules to reason about relevance and consequences, while the learned system relies on statistical patterns. The frame problem in this context highlights the challenge of determining which facts to consider when predicting the effects of an action. The data camp might argue that with enough data, the learned model will capture the relevance, but the structural camp argues that without a causal model, the system will always be vulnerable to rare combinations.

  Therefore, the case holds together and satisfies the specifications. The concession that with infinite data B might avoid the error is true, but the cost is that in practice, one cannot collect infinite data for every possible rare event, and the symbolic approach provides a systematic way to handle such events without having seen them.

  Final note: The scenario is designed to be realistic, and the rules for A are general and plausible. B's failure is due to the way it uses the data (correlation without causation) rather than a gap in what it knows. The thought experiment thus sharpens the disagreement: is the solution more data (manager) or a change in the reasoning architecture (colleague)?
answer: |-
  Below is a thought experiment designed to your specifications, followed by a demonstration of its validity. The scenario is set in a **hospital IV compounding lab**, where automated systems prepare sterile medications. Temperature control is critical for drug stability.

  ---

  ### Scenario  
  *Two agents control medication preparation in a lab with refrigerated storage bays. Each bay has a cooling unit, a door sensor, and a robotic arm that retrieves vials. A known quirk of the cooling units (documented in maintenance logs) is that if the door is open during a humidity spike (e.g., during monsoon season), condensation can short-circuit the unit, causing rapid heating. Humidity spikes are forecasted by sensors and logged. Today, a humidity spike is predicted, and a bay’s door must open to retrieve time-sensitive antibiotics. Agent A (symbolic) and Agent B (learned) both access the humidity forecast, maintenance logs, and door-status data.*  

  *At the decision point, the system must choose how to retrieve the antibiotics: either a fast method (door open for 60 seconds) or a safe method (door open in two 30-second intervals, allowing cooling recovery). Agent A selects the safe method. Agent B, trained on years of operational logs where humidity spikes rarely coincided with door openings, chooses the fast method. The door opens during the humidity spike, the cooler shorts, temperatures rise, and the antibiotics degrade.*

  ---

  ### Demonstration  

  1. **Trace of Agents at Decision Point**  
     - **Agent A (Symbolic)**:  
       - **Represents**: Humidity spike predicted + cooler vulnerability (from logs).  
       - **Applies**: General domain rules (see below).  
       - **Infers**: Humidity spike + open door → cooler short-circuit (via Rule 2) → temperature rise (Rule 3) → drug damage (Rule 4).  
       - **Does**: Splits retrieval into two intervals.  
       - *Rules*:  
         ```  
         R1: Door state changes only via robot actions.  
         R2: If humidity_spike ∧ door_open, then cooler_fails (unless cooler_has_condensation_shield).  
         R3: If cooler_fails ∧ drug_present, then temperature_rises.  
         R4: If temperature_rises ∧ temperature_sensitive(drug), then drug_damaged.  
         ```  
       *(Rules are general: R2 encodes a physical quirk; R3–R4 are causal laws.)*  

     - **Agent B (Learned World Model)**:  
       - **Represents**: Humidity spike + cooler vulnerability (same logs/sensors as A).  
       - **Applies**: Prior from training data (logs show 99.7% of door openings during humidity spikes had no failure; failures occurred only in 0.3% of cases with *prolonged* openings).  
       - **Infers**: Low probability of failure (data associates risk only with >90-second openings; 60s is “safe”).  
       - **Does**: Fast retrieval (60-second continuous opening).  

  2. **Constraint-by-Constraint Check**  
     - **Shared setting/realism**: Hospital IV labs use humidity sensors and refrigerated bays. No wagons/bombs.  
     - **Identical sensors/actuators/information**: Both agents read humidity forecasts, cooler specs, and door states.  
     - **Decision point**: Single choice (retrieval method). A safe, B unsafe.  
     - **No perception gaps**: B sees humidity spike and cooler specs.  
     - **B knows all human-knowable facts**: Logs explicitly note cooler vulnerability.  
     - **A’s rules are general/pre-incident**: R2 is a physical law (humidity + electronics → short); R3–R4 are domain axioms. No ad-hoc "never open during humidity."  
     - **B’s failure not trivially fixable by data**: B *has* data on humidity spikes and cooler failures, but failures are rare (0.3% in logs) and correlate only with *long* openings. A data advocate might demand “more examples,” but the error persists if the *causal link* (humidity + *any* door opening) isn’t statistically prominent.  
     - **No distributional cheating**: Humidity spikes are in-distribution; the flaw is B’s reliance on *correlations* (open duration → risk) rather than *causality* (humidity + open → risk).  

  3. **Single Feature Doing the Work**  
     - **Feature**: The causal relationship (humidity + open door → failure) is *masked* in training data by a confounder (open *duration*). Logs show failures only with long openings because short openings rarely coincided with humidity spikes (operators avoided this manually).  
     - **If weakened**: If logs had many examples of short openings failing during humidity spikes, B might act safely. But removing this confounder is unrealistic—real-world data is sparse. Without it, the case collapses, proving B’s success *depends* on perfect data.  

  4. **Strongest Attack from Data Camp**  
     - **Attack**: "B failed because it lacked examples of *short* openings during humidity spikes. With more data (or synthetic data augmenting rare cases), B would learn the risk. This is purely a data gap."  
     - **Surviving rebuttal**: Even with infinite data, B must *generalize* from duration to the causal rule. If a *new* vulnerability (e.g., dust ingress during high winds) arises, B needs new examples, while A’s rules (e.g., R2 generalized to "environmental hazard + open door → risk") apply immediately. The attack concedes that B requires exhaustive data for *every* hazard, whereas A uses causality.  

  5. **Classification and Practical Relevance**  
     - **Trouble type**: **Frame problem** (narrow sense)—determining which *known* facts (humidity, door state) are relevant to the action (door opening). B ignores humidity because data correlates risk with *duration*, not humidity per se.  
     - **Relevance to debate**: The classification matters. Your manager’s data-gap view assumes all relevance relations can be learned statistically. Your colleague’s frame-problem view argues relevance is a *structural* issue: symbolic systems (A) explicitly encode relevance (via rules like R2), while learned systems (B) infer it only if data is exhaustive. This case shows A’s rules handle a *new combination* of known facts without retraining.  

  ---

  ### Why This Isn’t Cheating  
  - B **considers the relevant fact** (humidity) but **discounts it** due to statistical priors (low failure rate for short openings). This is a failure of *relevance assignment*, not ignorance.  
  - A **wins via general rules** (R2 is a domain axiom about electronics, not a bespoke fix). A designer would write R2 early, as it governs all humidity-sensitive equipment.  

  ### Verdict  
  This case satisfies all constraints. If forced to relax one, **B’s access to human-equivalent knowledge** would need dilution (e.g., B misses the cooler quirk), but that weakens the frame-problem argument by making it a data gap. Here, B *has* the knowledge but misweights it. The case adjudicates your colleagues’ split: it *is* a structural relevance (frame) problem, and data alone won’t guarantee safety when novel combinations of factors arise.  

  ---  
  **Final note**: Use the IV lab scenario—it’s clinical, intuitive, and mirrors your cold-chain incident. For slides, excerpt the agent traces and rules. This forces your audience to confront whether "more data" can teach relevance or if symbolic guardrails are needed.
