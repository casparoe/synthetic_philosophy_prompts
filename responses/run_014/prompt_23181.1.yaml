prompt: |-
  I recently had a long argument with a friend about two thousand dollars a bank deposited into my account by mistake, which I have not yet reported. My friend says I must return it, on the ground that if everyone kept money paid to them in error, the whole practice of accurate payment would collapse, since no one could trust that a transfer was made in the right amount — and so my action, if it were everyone's rule, would destroy the very practice it relies on. I concede that a rule as broad as "keep any money paid to you by mistake" could not plausibly be everyone's rule. But I am not sure the test is stable, because the answer seems to depend on how I phrase my rule: stated narrowly, as "keep an overpayment only when the payer is a large institution unlikely to notice or be much harmed," it looks like it could be everyone's rule without the practice collapsing. So is my friend right that I must return the money, or does my objection show that his test simply yields whatever answer the person formulating the rule wants?
reasoning: |-
  Okay, let's start by unpacking the user's dilemma. They have $2000 from a bank error and are arguing with a friend about keeping it. The friend uses Kant's universalizability principle: if everyone kept mistaken payments, trust in payments would collapse. The user concedes that a broad rule wouldn't work but wonders if a narrow rule (only keeping overpayments from large institutions) could be universalized without harm.

  First, I need to assess both ethical arguments. The friend's point relies on Kantian ethics, which is solid for the broad rule. But the user's counter about a narrow rule is interesting. They're trying to find a loophole where their specific action doesn't cause systemic harm. 

  Looking deeper, the user might be seeking justification to keep the money without feeling unethical. They mention the bank is unlikely to notice or be harmed, which hints at self-interest. But there's also genuine philosophical confusion here—how rule formulation affects ethical outcomes. 

  The key is whether the narrow rule truly passes the universalizability test. If everyone kept money only from large institutions, would those institutions adapt? Probably. Banks might implement stricter audits, increasing costs, which could lead to higher fees for everyone. So the harm spreads, just indirectly. 

  Also, the user's rule assumes harmlessness, but even large institutions have operational costs. Plus, fairness matters—why should banks bear the burden of errors? If universalized, this could erode trust between individuals and institutions. 

  The user's deeper need might be reassurance that returning the money is the right choice, despite their reluctance. They might want validation that their friend's argument holds, or they're looking for a way to ethically justify keeping it. But the ethical frameworks (Kantian, utilitarianism, legal) all point to returning it. 

  I should also consider practical aspects. Legally, the bank can reclaim the money, so keeping it is risky. Ethically, consent and fairness are violated. The user's attempt to narrow the rule fails because universalization still leads to negative consequences, even if not immediate collapse. 

  In conclusion, the friend is correct. The money should be returned. The user's objection shows how phrasing affects the test, but the underlying principle remains: systemic harm occurs when exceptions are made for convenience.
answer: |-
  Your friend's argument uses Kant's ethical principle of **universalizability** ("act only according to that maxim whereby you can at the same time will that it should become a universal law"). While your objection highlights a genuine challenge with rule formulation, it **does not justify keeping the money**. Here's why:

  ### 1. **Your Friend's Core Argument Holds**
     - The broad maxim **"Keep any money mistakenly deposited into your account"** *cannot* be universalized without contradiction. If everyone followed this:
       - Trust in payment systems would collapse.
       - Banks/individuals would demand extreme pre-verification for every transaction, increasing costs and delays.
       - The practice of efficient electronic transfers *relies* on the expectation that errors will be corrected. Universalizing your maxim destroys this expectation.
     - **Conclusion:** The broad rule fails Kant's test. Keeping the money violates a duty to maintain systemic trust.

  ### 2. **Your Narrow Rule Also Fails Universalization**
     Your proposed maxim: **"Keep an overpayment only when the payer is a large institution unlikely to notice or be much harmed."**  
     - **Why it collapses:**  
       - **Institutions *would* adapt:** If large institutions consistently lost money to unreported errors, they *would* invest in better detection (e.g., AI audits, stricter reconciliation). Costs would rise, passed onto customers via fees.  
       - **Harm isn't trivial:** $2,000 might be negligible to a bank, but multiplied by thousands of "small" errors, it becomes material. Shareholders, depositors, or borrowers ultimately bear this loss.  
       - **Erodes fairness:** Universalizing this rule creates a double standard: large institutions (deemed "harmless" victims) vs. individuals/small businesses (who "deserve" rectification). This undermines uniform commercial ethics.  
       - **Encourages exploitation:** It incentivizes people to *avoid* notifying large institutions of errors, knowing they might "get away with it." This is corrosive to honest dealing.  
     - **Result:** The practice of accurate payment *still* degrades because institutions must assume errors won't be reported and act defensively.

  ### 3. **The "Rule-Formulation" Problem & Why It Doesn't Save You**
     - **The Issue:** Yes, phrasing a maxim narrowly (*"I keep money if X, Y, Z"*) can sometimes "pass" universalization artificially. Critics call this "casuistry."  
     - **The Solution:** Kant requires maxims to reflect your *true reason for acting*. Your actual motive isn't a principled distinction between large/small payers—**it's self-interest.** You noticed the error, recognized the payer might not pursue it, and want to keep the money.  
       - A truthful maxim would be: **"Keep money erroneously sent to me if I think I can benefit without consequence."**  
       - *This* maxim *cannot* be universalized: If everyone acted solely on self-interest when errors occur, trust evaporates entirely.  

  ### 4. **Other Compelling Reasons to Return the Money**
     - **Legal Obligation:** The money is not yours. Banks have legal recourse to reverse erroneous deposits (often automatically). Keeping it may constitute **unjust enrichment** or theft.  
     - **Utilitarian Harm:** Even if the bank absorbs the loss, it contributes to higher costs for all customers.  
     - **Virtue Ethics:** Keeping the money violates honesty, integrity, and fairness—traits essential to trustworthy relationships.  

  ### Conclusion
  **Your friend is correct: you must return the money.**  
  - The broad rule ("always keep mistaken payments") clearly fails Kant's test.  
  - Your narrow rule ("keep payments from large institutions") *also* fails when universalized, as institutions would adapt in ways that harm societal trust and efficiency.  
  - The "rule-formulation" objection doesn't apply because your *actual* maxim is self-interested, not a principled distinction.  

  **Act ethically and legally:** Notify your bank of the error immediately. Attempting to keep the funds risks legal action, fees, credit damage, and the erosion of trust that enables our financial system to function. The universalizability test, when applied rigorously to truthful maxims, robustly supports this duty.
