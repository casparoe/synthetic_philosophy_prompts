prompt: |-
  At the last meeting of my epistemology reading group, a Clifford partisan shut down all discussion of William James by reciting Clifford's maxim that it is always wrong, for anyone, anywhere, to believe anything on insufficient evidence, adding that since the shipowner's "sincerity of his conviction can in no wise help him," the ethics of belief is settled and James's will-to-believe position is just special pleading for wishful thinking. I suspect the maxim is doing several jobs at once and that not all of them can be done. Disentangle the distinct precise theses it could be expressing: whether the wrong it names is genuinely moral (a blameworthy act) or only a defect of rationality; whether insufficiency is measured against the evidence the subject actually has or the evidence she could have obtained with a fair inquiry — Clifford's island agitators seem condemned on the latter ground, since the evidence of the accused's innocence "was such as the agitators might easily have obtained, if they had attempted a fair inquiry"; whether the target is the state of belief itself, the omission of inquiry, or the action taken on the belief — noting that Clifford concedes that so far as it goes, the reading on which "it is not the belief which is judged to be wrong, but the action following upon it" is "right and necessary"; and whether anything and anyone are meant literally, so that the maxim condemns trusting your partner's fidelity or a friend's honesty before enough evidence is in. For each reading, say whether it is a platitude, defensible but limited, or false, and say which reading our Clifford partisan actually needs in order to get his conclusion that belief ahead of the evidence is never permissible. Finally, tell me which of the surviving readings are genuinely engaged by James's reply — that in forced, momentous, intellectually undecidable cases, suspending judgment is not a neutral option one can always retreat to — and which of them James's reply leaves completely untouched. Lay the readings out as a menu I can bring to the next meeting, not as a case for one of them.
reasoning: |-
  Hmm, the user is describing a debate from their epistemology reading group where a Clifford partisan shut down discussion of William James by invoking Clifford's maxim about believing on insufficient evidence. The user wants me to disentangle the different interpretations of Clifford's maxim and assess each one.

  Let me break down Clifford's maxim: "it is always wrong, for anyone, anywhere, to believe anything on insufficient evidence." The user has highlighted several key points of ambiguity. First, what kind of "wrong" is Clifford talking about - moral wrong or just irrational? Second, what counts as "insufficient evidence" - evidence actually possessed or evidence that could have been obtained? Third, what exactly is being condemned - the belief state itself, the failure to investigate, or actions based on the belief? And finally, how universal is this "always" and "anyone" - does it apply to everyday trusting relationships?

  I recall Clifford uses two main examples: the negligent shipowner who believes his ship is seaworthy without evidence and the island agitators who spread rumors without investigation. In the shipowner case, Clifford emphasizes that the sincerity of belief doesn't absolve moral guilt when the ship sinks. For the agitators, he condemns them for not seeking readily available evidence of innocence. These examples suggest Clifford might be blending different types of wrongs.

  For the different interpretations: When "wrong" means morally blameworthy (like the shipowner), this seems defensible but limited to cases with serious consequences. When it means irrational, that's closer to a platitude about epistemic norms. Regarding evidence standards, Clifford sometimes uses actual evidence (shipowner) and sometimes attainable evidence (agitators) - the latter is much stricter. As for the target of condemnation, Clifford explicitly says it's not just actions but the belief-forming habit itself that's problematic. And the universal "anyone, anywhere" claim seems clearly false for everyday trust relationships.

  The Clifford partisan needs the strongest version to dismiss James: that it's always morally wrong to believe without sufficient attainable evidence, targeting the belief state itself. But this version is vulnerable to James's critique about "forced, momentous, undecidable" situations where evidence is genuinely unavailable and suspension of judgment isn't neutral.

  James's counterargument specifically engages the "undecidable cases" interpretation where evidence is insufficient even after inquiry. It doesn't touch cases where evidence was obtainable but ignored, or situations without high stakes. For the partisan to maintain their absolute position, they'd need to deny that any situation is truly undecidable or that momentousness changes the calculus.

  I should present these interpretations clearly as a menu: listing each dimension of variation, possible interpretations, their plausibility, which ones the partisan relies on, and where James's response applies. This will help the user facilitate a more nuanced discussion at their next meeting.
answer: |-
  Here’s a menu of distinct readings of Clifford’s maxim, disambiguated across the dimensions you identified. Each reading is assessed for plausibility, and the Clifford partisan’s required reading(s) for their conclusion are specified. James’s engagement is noted for each. Present this as a neutral framework for discussion.

  ---

  ### **Menu of Readings for Clifford’s Maxim**  
  *"It is always wrong, for anyone, anywhere, to believe anything on insufficient evidence."*

  #### **1. Nature of the "Wrong"**  
  - **Reading 1A: Moral Wrong (Blameworthy Act)**  
    *Thesis:* Believing on insufficient evidence is a *moral* failing, akin to negligence or dishonesty.  
    *Plausibility:* **Defensible but limited.** Strong in cases with high-stakes consequences (e.g., shipowner), weak for trivial beliefs (e.g., believing a cloud resembles a rabbit). Clifford’s shipowner example anchors this.  
    *Partisan’s Need:* **Required.** To condemn James as "special pleading," the wrong must be moral (not just rational).  
    *James’s Engagement:* **Directly engaged.** James argues moral urgency can *require* belief in undecidable/momentous cases (e.g., faith enabling action).  

  - **Reading 1B: Epistemic Wrong (Defect of Rationality)**  
    *Thesis:* The wrong is purely about violating epistemic norms (irrationality), not moral duty.  
    *Plausibility:* **Platitude** for most philosophers. Even James accepts that beliefs *should* track evidence where possible.  
    *Partisan’s Need:* **Insufficient alone.** A purely epistemic "wrong" doesn’t support the claim that James is *morally* misguided.  
    *James’s Engagement:* **Partially engaged.** James concedes rationality demands evidence *when available* but disputes its sufficiency in forced/momentous cases.  

  #### **2. "Insufficient Evidence": Scope of Inquiry**  
  - **Reading 2A: Against Actual Evidence**  
    *Thesis:* Wrongness depends *only* on the evidence the subject *currently possesses*.  
    *Plausibility:* **False** if applied strictly. Clifford’s agitators are condemned for *not seeking* evidence ("might easily have obtained").  
    *Partisan’s Need:* **Unworkable.** It excuses willful ignorance (e.g., avoiding facts to "believe in innocence").  

  - **Reading 2B: Against Obtainable Evidence**  
    *Thesis:* Evidence is insufficient if a "fair inquiry" (Clifford’s phrase) *could have* yielded more.  
    *Plausibility:* **Defensible but stringent.** Demands proactive investigation proportionate to stakes.  
    *Partisan’s Need:* **Required.** To condemn James, belief must be wrong *even if* new evidence is inaccessible (e.g., undecidable cases).  
    *James’s Engagement:* **Crucially engaged.** James’s "forced option" directly challenges this: if inquiry *cannot* resolve the issue, 2B forbids belief *unconditionally*—which James rejects.  

  #### **3. Target of Condemnation**  
  - **Reading 3A: The Belief State Itself**  
    *Thesis:* The *belief* is intrinsically wrong, regardless of action.  
    *Plausibility:* **Defensible but controversial.** Clifford insists belief-formation shapes character/society (e.g., "no belief is trivial").  
    *Partisan’s Need:* **Required.** To reject James’s permissibility claim, the *belief itself* must be blameworthy.  
    *James’s Engagement:* **Directly engaged.** James defends the *right to believe* in specific contexts, attacking 3A’s absoluteness.  

  - **Reading 3B: Omission of Inquiry**  
    *Thesis:* Wrongness lies in *failing to investigate* before believing.  
    *Plausibility:* **Defensible.** Aligns with Clifford’s focus on "doubt" and "inquiry" as duties.  
    *Partisan’s Need:* **Insufficient alone.** James allows belief *after* inquiry reaches an impasse.  

  - **Reading 3C: Action on the Belief**  
    *Thesis:* Only *acting* on insufficiently supported beliefs is wrong (Clifford’s "right and necessary" concession).  
    *Plausibility:* **Platitude.** Even James agrees actions require evidential support.  
    *Partisan’s Need:* **Incompatible.** If only actions are wrong, James’s "will-to-believe" (as pre-action belief) escapes condemnation.  

  #### **4. Universality ("Always, Anyone, Anywhere")**  
  - **Reading 4A: Literal Universality**  
    *Thesis:* Applies to *all* beliefs, including trust in partners/friends without "evidence first."  
    *Plausibility:* **False.** Demanding evidence for mundane trust is paralyzing and alien to human sociality. Clifford’s examples are high-stakes.  
    *Partisan’s Need:* **Rhetorically useful** but logically unnecessary; weakens their position if pressed.  

  - **Reading 4B: Contextual Universality**  
    *Thesis:* Applies *whenever* belief influences action/others (per Clifford’s social epistemology).  
    *Plausibility:* **Defensible.** Expands Clifford’s scope beyond shipowners to public beliefs (e.g., agitators).  
    *Partisan’s Need:* **Required.** To block James’s "momentous cases" exception, the maxim must cover *all* high-stakes contexts.  
    *James’s Engagement:* **Engaged.** James limits permissibility to *specific* contexts (forced/momentous/undecidable), implicitly accepting 4B elsewhere.  

  ---

  ### **Clifford Partisan’s Required Readings for Their Conclusion**  
  To claim James’s position is "always impermissible wishful thinking," the partisan **must** hold:  
  - **1A** (moral wrong),  
  - **2B** (against obtainable evidence),  
  - **3A** (belief itself is wrong),  
  - **4B** (universal in high-stakes contexts).  

  Weaker readings (e.g., 1B, 3C) fail to morally condemn belief itself in undecidable cases.  

  ---

  ### **James’s Reply: Engagement with the Readings**  
  James’s "will-to-believe" **engages**:  
  - **1A/1B**: He redefines the "moral wrong" in undecidable cases: *not* believing can be a greater failing.  
  - **2B**: His core target. If evidence is *unobtainable* ("intellectually undecidable"), Clifford’s demand for more evidence is impossible.  
  - **3A**: He defends the *right* to hold the belief itself when evidence is exhausted.  
  - **4B**: He carves an exception within high-stakes contexts (momentous/forced options).  

  **James leaves untouched**:  
  - **2A** (beliefs contrary to actual evidence): James agrees this is irrational.  
  - **3B** (omission of inquiry): He requires inquiry *before* believing.  
  - **3C** (action without evidence): He condemns reckless actions.  
  - **4A** (literal universality): He grants Clifford applies to most beliefs.  

  ---

  ### **Summary Table for Discussion**  
  | **Reading**                     | **Plausibility**          | **Partisan’s Need?** | **James’s Engagement** |  
  |----------------------------------|---------------------------|----------------------|------------------------|  
  | **1A: Moral wrong**              | Defensible (limited)      | Required             | Engaged                |  
  | **1B: Epistemic wrong**          | Platitude                 | No                   | Partial                |  
  | **2A: Against actual evidence**  | False                     | No                   | Untouched              |  
  | **2B: Against obtainable evidence** | Defensible (stringent) | Required             | **Core Engagement**    |  
  | **3A: Belief state wrong**       | Defensible                | Required             | Engaged                |  
  | **3B: Omission of inquiry**      | Defensible                | No                   | Untouched              |  
  | **3C: Action wrong**             | Platitude                 | Incompatible         | Untouched              |  
  | **4A: Literal universality**     | False                     | No                   | Untouched              |  
  | **4B: Contextual universality**  | Defensible                | Required             | Engaged (with exception)|  

  Use this menu to show how Clifford’s maxim is *not* a single, unambiguous thesis. The partisan relies on the strongest, most contested readings (1A+2B+3A+4B), while James’s reply specifically targets **2B** and **3A** in undecidable cases. This reframes the debate: Is Clifford’s stringent standard defensible *even when evidence is inaccessible*, or does James’s exception hold?
