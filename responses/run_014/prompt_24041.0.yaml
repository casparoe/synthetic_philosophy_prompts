prompt: |-
  I'm a PhD student in philosophy of mind and I'm TA-ing for an intro philosophy of mind section next week. I have to get heterophenomenology across to first-years in a single 50-minute slot — Dennett's idea that you study consciousness by taking the subject's own reports at face value as third-person data, which is already a mouthful for people who've never seen the term. I don't want the explanation spelled out for me, I want a plan how to teach it. Specifically: what has to be in place before the term can mean anything to them and in what order (I'm guessing its the first-person/third-person gap, but I'm not sure of the dependencies, i.e. what has to click before what), what single example should carry the whole thing and what it needs to have and lack, the misconceptions they're going to walk in with or form as we go (I'm worried the big one is "this is just asking people what they feel, which is introspection, which we already know is unreliable") and exactly where in the sequence each one should be defused, one question I can ask at the end to tell whether the idea actually landed, and what I should explicitly leave out at this level and say so. Keep the whole thing under 500 words.
reasoning: |-
  Okay, the user is a PhD student in philosophy of mind preparing to teach a 50-minute intro class on heterophenomenology. They need a clear teaching plan that builds understanding step-by-step. 

  First, I need to identify the core challenge: heterophenomenology is a jargon-heavy concept that combines third-person methodology with first-person reports. The students are freshmen with zero prior exposure, so I must avoid philosophical baggage and build from common intuitions.

  Key structural dependencies emerge: 
  1) They must grasp the first-person/third-person distinction first - not just intellectually, but viscerally. The "red experience" example comes to mind because it's universal yet private. 
  2) Next comes the problem of verification - how do we study something that only exists for the subject? This sets up Dennett's solution. 
  3) Only then can I introduce heterophenomenology as the methodological bridge.

  For misconceptions, the big one is definitely "isn't this just introspection?" I'll need to explicitly contrast them: heterophenology records reports as data, not as truths. The timing is crucial - right after defining the method, before discussion spirals.

  The carry-it-home example should be simple but reveal layers. "Describe your headache" works because: 
  - It's universally relatable 
  - Allows showing how reports ≠ experiences (e.g. "throbbing" could mean different things) 
  - Demonstrates neutrality (we record "throbbing" without assuming what that qualia is)

  For assessment, I'll use the "How would you study dreams?" question. If they mention collecting dream journals as data rather than interpreting symbols, they've got it. 

  What to exclude: 
  - No autoheterophenomenology (self-study) 
  - No critiques from other philosophers 
  - No discussion of whether it "solves" hard problems 

  The pacing has to be tight: 5 min setup, 15 min for the gap, 15 min for the method, 10 min for examples and Q&A. I'll suggest writing "WE DON'T KNOW WHAT IT'S LIKE" on the board as a mantra - shocking but effective.
answer: |-
  Here's a 50-minute lesson plan focused on conceptual dependencies, defusing misconceptions, and ensuring comprehension:

  **1. Anchor & Problem Setup (15 min)**
  *   **Start Concrete:** "Close your eyes. Imagine a bright red apple. Open them. Did you *experience* something 'red' privately in your mind? How do I *know*? Can I ever see *your* red?" (Elicits 1st-person privacy).
  *   **Define the Gap:** Explicitly label **1st-person (subjective, private, what it's like)** vs. **3rd-person (objective, public, measurable)**. Write these on the board. Emphasize the **Epistemic Problem:** "How can science, which deals in 3rd-person data, study 1st-person conscious experience?"
  *   **Contrast Old Views:** Briefly mention **Introspectionism (Wundt/Titchener):** "Early psychologists *assumed* people could directly report their inner states accurately." **Problem:** "But it was unreliable (different labs, different results). We can't verify if the report matches the *actual* private experience."

  **2. Introducing Heterophenomenology (20 min)**
  *   **Dennett's Core Move:** "Dennett says: STOP trying to *directly* access the private 1st-person experience. That's impossible for a 3rd-person observer. INSTEAD, treat the subject **as a text-generator**."
  *   **The Method (Step-by-Step):**
      1.  **Record the Report:** "Ask the subject questions, get their verbal/written reports, note behaviors (e.g., wincing)." *Example:* "Subject says: 'I see a bright red circle.'"
      2.  **Take it *as* Data (Neutral Stance):** "We record this statement *exactly* as a **3rd-person fact**. It's data *about what the subject said/believes they experience*. We **bracket** (set aside) whether the private experience *actually* matches the report." (KEY POINT).
      3.  **Build the 'Subject's World':** "Use *all* the reports/behaviors to construct the **'heterophenomenological world'** – the world *as it seems to the subject*."
  *   **Defuse Misconception NOW:** "Is this just asking people 'what do you feel?' like old introspection? **NO!** Introspection assumed reports *were* the experience. Heterophenomenology **doesn't**. The report is **data *about* the subject**, not a direct window. We remain agnostic about the exact nature of the private qualia. We study the *subject's perspective* as a 3rd-person phenomenon."

  **3. The Carry-It-Home Example & Nuance (10 min)**
  *   **Example:** "Studying **Pain Reports.** Subject stubs toe, yells 'OW! That's a sharp, throbbing pain!', hops on one foot."
      *   Heterophenomenology: Records the utterance ('sharp, throbbing pain'), the yell, the hopping as **objective data points**.
      *   Constructs the World: "In the subject's world, there is an intense, sharp, throbbing sensation in their toe causing distress and hopping."
      *   **What it Lacks:** Assumption about the *exact* qualia of "sharpness" or "throbbing." Assumption that the report *perfectly* captures the private feel.
      *   **What it Has:** Rich, structured description of the subject's *expressed perspective* using public data.
  *   **Why it's Powerful:** "It gives science a rigorous, intersubjective method to study *reports of consciousness* without getting stuck in the private mind."

  **4. Check for Understanding & Wrap-up (5 min)**
  *   **Key Question:** "Imagine studying dreams using heterophenomenology. What would you actually *do* as the researcher, and what would your data *be*?" (Correct Answer: Collect dream journals/interviews verbatim, note behaviors like REM sleep; Data = the *texts/recordings* and behaviors, used to build the subject's 'dream world' description. *Not* interpreting symbols or assuming the report *is* the dream).
  *   **Explicitly Leave Out:**
      *   Deep dive into Dennett's "multiple drafts" model or full-blown eliminativism.
      *   Detailed critiques (e.g., from phenomenologists like Husserl).
      *   Autoheterophenomenology (studying oneself).
      *   **Say:** "We're focusing purely on the core *methodological* move: treating subjective reports as objective data to build the subject's world, bracketing the private qualia itself. We're not tackling *why* Dennett thinks this is necessary or all its implications yet."

  **Why this order:** Establishes the fundamental problem (1st/3rd gap) → Shows why old methods fail → Presents HP as the solution *to that specific problem* → Immediately defuses the major misconception (vs. introspection) → Uses concrete example to solidify → Checks comprehension via application.
