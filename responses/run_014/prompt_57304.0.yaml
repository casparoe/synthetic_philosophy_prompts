prompt: |-
  I'm the clinical lead on a work group that maintains the diagnostic classification our country's public child and adolescent mental health services run on — it's what decides who gets seen, what a school has to put in place, and whether a family qualifies for a disability allowance. We meet twice a year, get about twenty-five proposals a cycle, mostly new categories, and each one gets a 90-minute session. Our review template checks four things: can the criteria be applied reliably by different raters, is there evidence the category picks out a real group, does it change what a clinician would actually do, and can it be told apart from what's already in the manual. That's the whole thing. Nothing in there asks what happens to the kids once the label exists, which is the part I care about most, because I keep coming back to Hacking's point that human kinds arent like chemical kinds — classify people and they move, they talk back, they reorganise themselves around the classification, and then the category's own evidence base shifts underneath it. He had the historical cases (fugue, multiple personality, and the fact that deleting a category remakes people just as much as adding one does), but I've never seen anybody turn that into something a committee can actually run on a Tuesday morning.

  So: write us the procedure. Ordered questions, what counts as a sufficient answer to each, where it stops at "reject," where it stops at "we can't settle this, it goes to the full comittee as a values question rather than a fact question," and what would count as evidence for the looping questions given our limits — no social scientist on staff, one clinical epidemiologist who thinks all of this is untestable philosophy, and field trials that run six months maximum across about a dozen clinics. It has to handle deletions and pure renamings, not just additions. And be straight with me about which steps really follow from the theory and which ones are reasonable-sounding guesswork wearing a checklist costume, plus where the procedure will systematically misfire (my guess: rare categories, and anything that spreads through the internet faster than we can measure).

  Then run it on three live proposals.

  1. Adding "anticipatory school avoidance disorder," ages 8–15: recurrent physical complaints in the hour before school, refusal episodes at least three times a month across a term, marked relief when the school day is cancelled. I drafted this one myself. In the field trial, 41 of the 67 labelled kids were using the manual's own vocabulary to describe themselves at six-month follow-up, 9 of them said they'd started answering intake questions differently after seeing the criteria sheet, and three districts have already begun citing the label to approve full-time home education.
  2. Deleting "oppositional conduct pattern, juvenile" and folding it into a dimensional severity score inside a broader conduct category. Substance of the criteria barely changes; roughly four thousand kids currently carrying the label would stop having it.
  3. Renaming "childhood emotional lability syndrome" to "emotion dysregulation disorder." Identical criteria, identical prevalence, no clinical change whatever — a parent coalition wants it because the old name gets used as an insult in staff rooms. My own view is that a rename is a nothing-change and shouldn't eat a session; tell me if the procedure disagrees with me.

  Two housekeeping things. Don't hand me a bibliography or a reading list, I'm not chasing anything down — just make the reasoning visible. And every question the procedure asks has to be statable in plain language, because the final committee includes two parent representatives with no philosophy background and they will (rightly) refuse to sign off on anything that sounds like it's hiding behind jargon.

  On proposal 1, I know I'm attached in a way that isn't healthy. If the procedure kills it, kill it and say so plainly rather than softening the verdict.
reasoning: |-
  Okay, the user is the clinical lead of a diagnostic classification workgroup for child and adolescent mental health services. They need a practical procedure to evaluate proposals (additions, deletions, renamings) that incorporates Hacking's idea of "looping effects" - how classifications affect the people being classified. The current template focuses on reliability, validity, clinical utility, and differentiation, but misses the real-world impact of labels on kids.

  Hmm, this is a complex request. The user clearly understands the theoretical framework but needs something operational for committee meetings. The key challenge is translating philosophical concepts into actionable questions without jargon. They've given concrete constraints: no social scientists on staff, limited field trials, parent representatives on committee. 

  The user seems frustrated that existing frameworks ignore human consequences of labeling. They're self-aware about their attachment to Proposal 1 (anticipatory school avoidance disorder) and want objectivity. Underneath, I sense concern about iatrogenic harm - that diagnostic labels might inadvertently worsen problems through self-fulfilling prophecies or systemic misuse.

  For the procedure design, I need to:
  - Break down "looping effects" into measurable components
  - Define stopping rules for committee decisions
  - Specify evidence types within existing resources
  - Handle all three proposal types equally
  - Flag where the method is theoretically sound vs. pragmatic guesswork

  The tricky parts will be:
  1) Assessing identity/cultural adoption without longitudinal data
  2) Measuring diagnostic drift in short timeframes
  3) Evaluating deletions' impact when kids "lose" labels
  4) Making value judgments explicit for parent representatives

  For Proposal 1, the field trial already shows looping effects: kids adopting diagnostic language, changing symptom reporting, systems using the label to justify home schooling. That's exactly what Hacking describes. But is this harmful? The procedure should force confronting that.

  For Proposal 2 (deletion), the key issue is whether removing "oppositional conduct pattern" changes services or identity for those 4000 kids. Do they benefit from losing a stigmatizing label? Or lose support?

  Proposal 3 (rename) seems trivial but matters for stigma reduction. The procedure should validate that symbolic changes can have real effects if the parent coalition reports harm from current terminology.

  I'll build the procedure around five core questions about looping effects, with clear decision thresholds. Must emphasize that for rare/online-driven conditions, the method will fail - that's inherent in the six-month field trial limitation. The epidemiologist's skepticism is valid; some aspects ARE untestable in this framework, so we'll need explicit "values judgment" off-ramps.

  Most importantly: every question must pass the "parent representative test" - no jargon, just plain consequences: "Could this label stick to a kid's identity?" "Might schools misuse this term?" That's the real innovation needed here.
answer: |-
  Here's a practical procedure incorporating Hacking's looping effects, designed for committee use. It adds **Five Mandatory Looping Questions** to your existing template, with clear decision rules, evidence requirements, and plain-language framing.

  ---

  ### **LOOPING EFFECTS EVALUATION PROCEDURE**
  *(To be completed AFTER your existing reliability/validity/utility/differentiation review)*

  **Question 1: Identity Adoption Risk**  
  *Plain Language: "Could this label become part of how kids see themselves?"*  
  - **What Counts as Evidence:** Field trial interviews, parent/teacher reports on child's self-descriptions, social media monitoring (if available), pre/post-labeling language shifts.  
  - **Sufficient Concern:** >20% of labelled kids in trials use the diagnostic term *positively or negatively* to describe themselves within 6 months.  
  - **Decision:** **REJECT** if >30% adoption + existing evidence shows harm (e.g., reduced agency, reinforced avoidance). **COMMITTEE** if 15-30% adoption OR conflicting harm/benefit reports.

  **Question 2: System Response Shift**  
  *Plain Language: "Will schools/governments use this label to change rules or resources?"*  
  - **What Counts as Evidence:** Documented policy changes during trials, stakeholder surveys (school admins, disability boards), pre-emptive citations (like Proposal 1's home education use).  
  - **Sufficient Concern:** Any evidence of systems *already* altering access (eligibility, funding, placement) based *solely* on the label during trials.  
  - **Decision:** **REJECT** if change *reduces* appropriate care/services (e.g., incentivizes isolation). **COMMITTEE** if impact ambiguous or values-driven (e.g., "Is home schooling ever an acceptable outcome?").

  **Question 3: Diagnostic Behavior Feedback**  
  *Plain Language: "Could knowing the criteria change how kids show symptoms?"*  
  - **What Counts as Evidence:** Direct child reports (e.g., "I answered differently after seeing the sheet"), clinician notes on symptom presentation shifts, mismatch between pre-awareness and post-awareness reports.  
  - **Sufficient Concern:** >10% of trial subjects show *conscious adaptation* of symptoms to criteria.  
  - **Decision:** **REJECT** if adaptation is widespread (>25%) + distorts clinical picture. **COMMITTEE** if adaptation is minor but criterion-specific.

  **Question 4: Stigma/Advocacy Pathway**  
  *Plain Language: "Will this name help or hurt kids in daily life?"*  
  - **What Counts as Evidence:** Parent/teacher focus groups on label perception, bullying records linked to labels, advocacy group endorsements/opposition.  
  - **Sufficient Concern:** Clear evidence of current derogatory use (for renames) OR high stigma potential for new terms (e.g., "avoidance" = laziness).  
  - **Decision:** **REJECT** only for *new* labels with unambiguous stigma risk. **COMMITTEE** for renames/deletions or ambiguous cases.

  **Question 5: Resistance to Future Change**  
  *Plain Language: "If this label turns out wrong, could we take it back?"*  
  - **What Counts as Evidence:** Patient group attachment to existing labels, rapid community mobilization (online groups), services built *exclusively* around the label.  
  - **Sufficient Concern:** Label adoption by >3 advocacy groups OR dedicated support services using the term within trial period.  
  - **Decision:** **REJECT** for new labels with rapid community uptake (>5 groups/services in 6mo). **COMMITTEE** for deletions facing organized resistance.

  ---

  ### **Where This is Guesswork vs. Theory**
  - **Theory-Based:** Q1 (identity formation), Q2 (institutional reactivity), Q3 (symptom performance). Directly from Hacking.  
  - **Pragmatic Guesswork:** Thresholds (20%, 10%, etc.) – these are placeholders; adjust based on committee tolerance. Q5 ("reversibility") extrapolates from Hacking but isn't explicit.  
  - **Systematic Blind Spots:**  
    - **Rare conditions:** Looping needs critical mass; small groups won’t trigger thresholds.  
    - **Online-driven spread:** Field trials can’t capture TikTok/Reddit-driven identity adoption.  
    - **Long-term effects:** 6-month trials miss cultural entrenchment.  
    - **Clinician bias:** Won’t detect if *clinicians* unconsciously reshape symptoms to fit labels.

  ---

  ### **Application to Live Proposals**

  #### **Proposal 1: Anticipatory School Avoidance Disorder**  
  1. **Identity Adoption:** 41/67 (61%) kids using label → **>30% + harm risk** (reinforces avoidance).  
  2. **System Response:** 3 districts using label for home schooling → **Reduces access** to school-based support.  
  3. **Diagnostic Feedback:** 9/67 (13%) admit changing symptoms → **>10% concern**.  
  4. **Stigma:** "Avoidance" may imply volitional behavior → Moderate risk.  
  5. **Reversibility:** Rapid system uptake → **High lock-in risk**.  
  **VERDICT:** **REJECT** per Q1 (identity), Q2 (system harm), Q5 (lock-in). *Your attachment aside, the looping risks are severe and measurable.*

  #### **Proposal 2: Delete "Oppositional Conduct Pattern, Juvenile"**  
  1. **Identity Adoption:** *Deletion-specific question: "Will removing this label harm identity or services?"* Evidence: If label is stigmatizing, removal may help. If it’s tied to disability supports, may harm.  
  2. **System Response:** Track if deletion changes school/disability decisions. Evidence: Review records of similar past deletions.  
  3. **Diagnostic Feedback:** Unlikely (deletion, not addition).  
  4. **Stigma:** Deleting stigmatizing term → **Likely benefit**.  
  5. **Reversibility:** *Deletion-specific: "Will advocates resist removal?"* Evidence: No organized groups use this exact label → Low resistance.  
  **VERDICT:** **COMMITTEE** for Q1/Q2 (values: "Is stigma reduction worth potential service disruption?"). *Needs debate on systemic trade-offs.*

  #### **Proposal 3: Rename "Emotional Lability" to "Emotion Dysregulation"**  
  1. **Identity Adoption:** Unlikely to change self-perception quickly.  
  2. **System Response:** Minimal (same criteria).  
  3. **Diagnostic Feedback:** None.  
  4. **Stigma:** Parent coalition reports current name used as insult → **Clear harm evidence**.  
  5. **Reversibility:** Low risk.  
  **VERDICT:** **ACCEPT** per Q4 (stigma reduction). *Procedure disagrees with you: renames aren’t neutral if the old term causes harm. This is a low-risk, high-compassion change.*

  ---

  ### **Key Implementation Notes**  
  - **Parent Reps:** All questions use real-world consequences ("Will this name get my child bullied?", "Could this stop my kid getting help?").  
  - **Epidemiologist Pushback:** Frame as *risk assessment* (e.g., "We have evidence of X happening; do we accept this risk?"). Avoid theoretical debates.  
  - **Field Trial Limits:** Use rapid surveys/focus groups. Track "off-label" system changes during trials.  
  - **Time Saver:** Renames/deletions skip irrelevant questions (e.g., diagnostic feedback for renames).  

  This forces the committee to confront *what the label does in the wild* – not just whether it "exists" reliably. It won’t catch everything, but it makes looping effects actionable.
