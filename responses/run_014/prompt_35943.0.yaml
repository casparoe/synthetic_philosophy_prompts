prompt: |-
  I'm writing a short paper on the metaphysics and normativity of promising, and I'd appreciate critical comments on the draft below — both on the soundness of the argument and on whether the central proposal is doing any real work.

  The paper defends a view I call the "transferred authority" account of promissory obligation, against the two views I take to be the main competitors.

  Draft:

  It is a commonplace that promises bind, but remarkably hard to say what a promise does such that it binds. I consider two familiar accounts and find both wanting. The first, which I call the practice view, holds that promising is a conventional practice, like chess, and that the wrong of breaking a promise is the wrong of breaking the rules of the practice — just as it would be wrong to move a rook diagonally even if nobody is harmed. This correctly explains why a promise binds even when the promisee neither relies on it nor even remembers it. But it faces a difficulty: it seems to get the explanation backwards. The rules of a game bind only those who have chosen to play, and it is implausible that each individual promise is a fresh decision to enter the practice. If the practice view says we are all already players, it owes an account of how we got in the game — and no plausible account of that avoids circularity, since the natural story is that joining a practice is itself something like a promise.

  The second, the reliance view, holds that a promise generates an obligation by inducing an expectation in the promisee, thereby exposing the promisee to a risk the promisor has a duty not to exploit. This nicely explains why promises bind proportionally to the reliance they induce, but it cannot explain the bindingness of promises made to people who cannot rely on them: promises to small children, to the severely forgetful, or to the dead. Yet these seem to be paradigm promises, not degenerate cases.

  I propose instead that a promise is a transfer of authority. In promising to φ, the promisor grants the promisee a standing to determine that the promisor φ — a private, localized version of the authority a principal grants an agent. The obligation is not owed to a practice, nor generated by the promisee's psychological states, but is simply the mirror image of a normative power the promisee now holds. The promise is like handing someone keys: in ordinary speech you hand over the keys to your house, in promising you hand over the keys to a piece of your own will.

  This account predicts, correctly I think, that promises made under duress do not bind: coerced transfers of authority, like coerced transfers of property, are defective transfers. It also explains why third parties can feel the existence of an obligation even when the promisee has forgotten: an unexercised right is still a right.

  Comments requested on the following, though please raise anything else you notice:

  1. The dead-promisee case is meant to be an objection to reliance views, but does my own account handle it? A dead person seems unable to hold any standing, yet I claim the promise still binds. Is this an embarrassment for my view, or can the appeal to "unexercised rights" be made to work?
  2. Does the keys analogy carry any argumentative weight, or is it merely decorative?
  3. Is my characterization of the two competitor views fair, or am I attacking weakened versions of them?
reasoning: |-
  Okay, the user is working on a philosophical paper about promising and wants feedback on their draft. They're defending a "transferred authority" account against two competitors: the practice view and the reliance view. 

  First, I need to understand their core argument. The practice view is criticized for circularity - how do we "enter" the practice without already promising? The reliance view fails with non-reliant promisees (children, forgetful people, dead people). Their solution: promising transfers authority over the promisor's will to the promisee. 

  The user has three specific concerns. For the dead promisee problem: their "unexercised rights" response might work if we consider normative powers persisting beyond death, like wills. But they should address the metaphysical worry - can a dead person hold rights? 

  The keys analogy isn't just decorative; it illustrates the core mechanism of transferring control. But they could strengthen it by emphasizing the power-transfer aspect more explicitly. 

  Their characterization of competitors seems fair. They've represented standard versions of these theories, though they could acknowledge more sophisticated variants to preempt objections. 

  Beyond their questions, I notice their account needs to explain how authority is transferred linguistically. Also, the duress example works well, but they should consider other edge cases like revocation. The writing is clear, but the conclusion could reinforce why this avoids circularity better than practice views. 

  The user seems to be in mid-stage drafting - confident in their framework but testing its robustness. They're probably a grad student or early-career philosopher given the paper's sophistication. Their unspoken need is likely anxiety about whether this original account holds up to scrutiny, especially regarding normativity sources. I should reassure while offering constructive pressure points. 

  For the dead promisee issue, I'll suggest either defending posthumous rights or modifying the view to allow third-party enforcement. The analogy does real work but could be tighter. Competitor portrayals are acceptable though citing key proponents would help. Overall the account is promising (pun intended) but needs more development on the metaphysics of transferred authority.
answer: |-
  Here’s a critical assessment of your draft, addressing your specific questions and broader concerns about argument soundness and the originality/utility of your "transferred authority" view:

  ### Strengths of the Draft
  - **Clarity & Structure**: Your critique of competing views is concise and compelling, especially the circularity problem for practice views and the scope problem for reliance views.
  - **Originality**: The "transferred authority" account is a fresh, metaphysically rich alternative that avoids pitfalls of existing theories.
  - **Explanatory Power**: Your view elegantly handles cases of forgotten promises, non-reliant promisees, and duress without ad hoc adjustments.

  ### Critical Comments & Suggestions

  #### 1. **Dead-Promisee Case & Unexercised Rights**
     - **Problem**: Your account *does* face a metaphysical challenge here. If authority is transferred to the promisee, and the promisee ceases to exist (e.g., dies), how can they "hold" authority? Rights typically require a rights-bearer.
     - **Defense Potential**: This *isn’t fatal* but needs refinement:
       - **Option A**: Argue that normative powers can persist posthumously (like testamentary authority). The *right* exists independently of the promisee’s current capacity to *exercise* it (analogous to property bequeathed to an heir).
       - **Option B**: Allow third parties (e.g., executors, family) to "hold" the authority on behalf of the deceased promisee, preserving the obligation’s force.
       - **Weakness**: Without clarification, the "unexercised right" line risks being question-begging. **Recommendation**: Explicitly frame authority-transfer as creating a *relational normative state* that survives the promisee’s death, akin to a debt owed to an estate.

  #### 2. **Keys Analogy: More Than Decorative**
     - **Argumentative Weight**: The analogy *does substantive work*:
       - Illustrates the **irreversibility** of the transfer (you can’t take back keys without consent).
       - Clarifies **what is transferred**: control over a specific domain (will/action, not property).
       - Highlights **defects in transfer** (duress = invalid "handing over").
     - **Enhancement Suggestion**: Tighten the link to **normative powers**. Emphasize that promising, like granting property rights, alters deontic relationships by conferring *Hohfeldian powers* (e.g., the power to release the obligation or claim redress).

  #### 3. **Fairness to Competing Views**
     - **Practice View**: Your characterization is fair against *austere* conventionalism (e.g., early Rawls). However, sophisticated practice theorists (e.g., Searle, Gilbert) might argue the "game" is constitutive of social agency, not entered voluntarily. **Mitigation**: Briefly note that even if participation is non-voluntary, the *content* of promissory obligations remains unexplained by convention alone.
     - **Reliance View**: You accurately target *pure* expectation-based accounts (e.g., early Scanlon). Some hybrid views (e.g., Owens) ground obligation in the promisee’s *right to rely*, which might handle dead promisees via surrogate rights-holders. **Mitigation**: Acknowledge hybrids but argue they still reduce obligation to contingent psychological states, unlike your deontic-power focus.

  ### Broader Concerns: Is the Proposal Doing Real Work?
  - **Yes, but clarify its unique contributions**:
    - **Solves the "Circularity vs. Scope" Trilemma**: Your account avoids the circularity of practice views *and* the narrow scope of reliance views. This is significant work.
    - **Metaphysical Payoff**: It grounds obligation in a *single act of normative empowerment*, not practices or psychology. Emphasize how this simplifies the ontology of promissory bonds.
    - **Explains Asymmetry**: Only the promisee (or their surrogate) can release the obligation, which practice/reliance views struggle to explain. Your view predicts this naturally.
  - **Potential Gaps**:
    - **How is authority transferred?** What speech acts or intentions constitute this "transfer"? Needs more detail (e.g., is it performative?).
    - **Source of Normativity**: *Why* does transferring authority create obligation? Practice views cite social rules; reliance views cite harm. Your view needs a meta-normative foundation (e.g., autonomy or rights-transfer as inherently binding).
    - **Revocation**: Can the promisor reclaim "keys" unilaterally? If not, why? (Hint: Stress that transfers are *alienations* of authority).

  ### Suggested Revisions
  1. **Refine the dead-promisee response**: Opt for "persisting normative state" or "third-party exercisable right" to avoid metaphysical discomfort.
  2. **Strengthen the analogy**: Explicitly tie "keys" to the transfer of *normative control*, distinguishing it from physical property.
  3. **Preempt sophisticated competitors**: Add a footnote or clause acknowledging hybrid/reformed versions of practice/reliance views and why they still fail.
  4. **Address the normativity gap**: Briefly gesture toward why authority-transfer binds (e.g., "as an exercise of autonomy, transferring control over one’s will generates correlative duties").
  5. **Sharpen the conclusion**: Contrast how your view handles duress, forgotten promises, and dead promisees *systematically* where rivals fragment.

  ### Overall
  Your core argument is sound and the "transferred authority" account is promising (pun intended). It avoids major pitfalls of competitors and offers a unified explanation of promissory phenomena. With refinements (especially on the metaphysics of transferred rights and the normativity source), it could be a compelling original contribution. The keys analogy is effective, but grounding it in normative powers will reinforce its substance.
