answer: |-
  ## Research Proposal: Testing Material Coincidence Theories through Artworld Instability

  **Summary (120 words):**  
  This project investigates the persistent metaphysical puzzle of material coincidence (e.g., a statue and its constituting lump of clay) by testing the three dominant theoretical families against under-explored cases from the artworld. Standard debates rely heavily on a narrow set of crafted examples, potentially creating a false impression of stability. I propose examining cases where an object’s sortal status (e.g., ‘artwork’, ‘mere thing’) is unstable or reversible: ephemeral instruction-based works, exhibited manufactured objects losing art status, and conserved objects undergoing complete material replacement. By rigorously analyzing each theory’s predictions and required adjustments for these cases, the project aims to reveal hidden vulnerabilities, assimilative strengths, or expose the debate’s potential conventionality, offering fresh perspective on object identity and persistence.

  **The Question (180 words):**  
  When a sculptor shapes clay into a statue, are there two distinct objects (statue and lump) sharing all matter but differing in persistence conditions? Or only one object described differently? Or is the dispute merely verbal, reflecting different conventions for counting? This core metaphysical question concerning material coincidence and identity remains contested. Crucially, the debate’s perceived resilience may stem from its reliance on a limited repertoire of standard cases (creation, destruction, gradual replacement) designed by proponents of each view. The central question of this project is: **Do unconventional cases involving *unstable or reversible sortal status* – specifically drawn from artistic practice and conservation – expose fundamental weaknesses in, or necessitate significant revisions to, one or more of the three dominant positions (two-objects, one-object, deflationary), or do they demonstrate the theories' robust flexibility, potentially reinforcing a deflationary conclusion?**

  **Why Existing Positions Leave the Question Open (250 words):**  
  While each position offers solutions to the standard cases, their ability to handle *instability* remains untested and constitutes a genuine gap. The two-objects view posits distinct, co-located entities with essential sortal properties (e.g., *being a statue* vs. *being a lump*). Cases where an object systematically gains and loses such a sortal property (e.g., a manufactured item exhibited and then deaccessioned) challenge the stability and fundamentality of these sortals. Can the lump suddenly acquire and shed the *statue* sortal without ontological consequence? The one-object view must explain how a single entity can undergo radical shifts in its defining persistence conditions or modal properties based on external factors like exhibition context. Does the *same* object fundamentally change *what it is* when placed on a plinth versus a shelf? The deflationary view attributes differences to linguistic/conventional practices. Instability cases directly probe the nature and grounding of these conventions: are they arbitrary, or answerable to something (intention, function, recognition) that might impose a degree of objectivity or constraint, even if not full-blown ontological difference? The standard defenses against traditional objections (e.g., appeals to temporal parts, phase sortals, or context-sensitivity) are not obviously sufficient for explaining reversible, context-dependent *ontological categorization* itself. The persistence of the debate, despite sophisticated arguments within the standard framework, suggests a need for novel pressure points. These artworld cases provide precisely that pressure by introducing instability at the level of the sortal concepts central to all three views' formulations.

  **Method and Plan for Twelve Weeks (300 words):**

  *   **Phase 1: Case Articulation & Neutral Framing (Weeks 1-2):** Precisely characterize the three artworld case types, drawing on art-historical and conservation literature. Crucially, describe them in metaphysically neutral terms, avoiding vocabulary (e.g., "the artwork ceases to exist") that presupposes answers to the ontological questions under investigation. Define key parameters: temporal boundaries, material constitution changes, intentional acts, and contextual shifts.
  *   **Phase 2: View-Specific Analysis (Weeks 3-8):** For each of the three metaphysical positions and each case type:
      *   Deduce the position's specific ontological commitments regarding the entities present at each stage (e.g., pre-creation, during exhibition, post-destruction/deaccession, post-conservation).
      *   Determine its predictions for how many objects exist and how they persist through the described changes and instabilities.
      *   Identify any internal tensions or required theoretical adjustments (e.g., redefining persistence conditions, sortal essentialism, convention scope) needed to accommodate the case.
  *   **Phase 3: Comparative Assessment & Pressure Points (Weeks 9-11):** Systematically compare the results of Phase 2. Where do the views conflict in their predictions for the same case? Which view(s) handle the cases most naturally, and which require the most significant, potentially ad-hoc, modifications? Does any view face an insurmountable contradiction or a need to abandon a core tenet? Does the deflationary view's flexibility become a strength or reveal a lack of substance?
  *   **Phase 4: Synthesis & Implications (Week 12):** Draft a paper synthesizing findings. Articulate whether and how the instability cases successfully challenge or support specific views, or reveal the debate's conventional nature. Refine the implications for the metaphysics of material objects and persistence.

  **What Success and Failure Would Look Like (200 words):**

  *   **Success:** The project succeeds if it achieves a clear, well-argued assessment of how the instability cases impact the three views. Success includes:
      *   Demonstrating that one view struggles significantly with a case type, forcing revision or weakening its plausibility.
      *   Showing that one view offers a particularly elegant or robust explanation across the cases.
      *   Revealing that all views can assimilate the cases, but only by stretching their core concepts (e.g., making persistence conditions highly context-sensitive, conventions implausibly fluid, or sortals non-essential) in ways that themselves warrant critical examination and potentially favor a deflationary stance.
      *   Clarifying the demands placed on the notion of a "convention" by the deflationary view in light of instability. Even if all views absorb the cases, rigorously mapping *how* they do so constitutes valuable philosophical progress by exposing hidden complexities or flexibilities.
  *   **Failure:** The project would fail only if the cases prove entirely inert – if they can be dismissed as irrelevant by all sides with minimal, uncontroversial adjustments, offering no new philosophical traction. Given the novelty and inherent tension of the cases, this outcome seems unlikely, but its deflationary implication (that standard cases *are* sufficient and the debate might be terminological) would still be a significant, publishable result. Failure also includes failing to articulate the cases neutrally or analyze the views rigorously.

  **Scope and Risks (120 words):**  
  The primary scope limitation is the focus on three specific artworld instability types as test cases for the three core metaphysical positions. A significant risk is case-selection bias; I mitigate this by drawing cases from established art-historical/conservation discourse, not crafting them to target specific views. The 12-week timeframe necessitates focus: if analysis proves more complex, I will prioritize depth on one case type demonstrating the strongest pressure, ensuring a robust result within the grant period. Another risk is ensuring accessibility to non-philosophers; I will rigorously avoid jargon, define key terms contextually (e.g., 'sortal', 'persistence condition'), and ground arguments in the concrete case descriptions. The project's feasibility is high, building directly on my metaphysical training and ongoing research.
