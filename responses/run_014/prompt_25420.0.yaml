answer: |-
  ### 1. The Phenomenon Restated (147 words)
  You observed an argumentative pattern where "adaptation" is used in two distinct senses without acknowledgment, enabling an unfalsifiable claim. **Sense 1 (Current Utility):** A trait serves a beneficial function in the *present* (e.g., jealousy prevents mate infidelity). **Sense 2 (Historical Selection):** The trait *evolved* via natural selection *for* that function (e.g., jealousy was genetically shaped by ancestral mate-guarding pressures). Evidence for Sense 1 (current benefit) is presented as proof of Sense 2 (evolutionary origin). When challenged on historical origins, your interlocutor retreated to Sense 1 ("it’s useful, so it’s adaptive"), then slipped back to Sense 2 ("so it *was* selected for this"). This creates a closed loop: utility "proves" historical selection, but historical claims lack independent evidence and default to utility when pressed. The slippage immunizes the adaptationist claim against counterarguments like exaptation or byproducts.

  ### 2. Nearest Established Concepts (247 words)
  - **Adaptationism (Gould & Lewontin):** Critiques the *preference* for adaptationist explanations over alternatives (e.g., spandrels, constraints). This overlaps by highlighting overreliance on "just-so stories," but your case focuses on a *logical equivocation within the argument itself*, not just methodological bias. Adaptationism doesn’t explicitly name the semantic slippage between utility and history.
  - **Brandon’s Distinction (Historical vs. Ahistorical Adaptation):** Philosopher Robert Brandon distinguishes "adaptation as a process" (historical selection) from "adaptation as a state" (current fitness contribution). This directly mirrors your two senses. However, Brandon’s framework clarifies the *concepts* but doesn’t label the *fallacy* of conflating them evidentially. Your case shows how this conflation functions rhetorically.
  - **Teleonomy vs. Adaptation:** Pittendrigh/Mayr’s "teleonomy" describes *current* goal-directedness (Sense 1), while "adaptation" often implies evolutionary history (Sense 2). This is conceptually close but not widely used as a dichotomy in arguments. The slippage occurs because "adaptation" colloquially absorbs both meanings.
  - **Exaptation (Gould & Vrba):** Highlights traits co-opted for new functions *after* evolving for another reason. Your friend’s dismissal of this possibility ("it’s still an adaptation either way") ignores that exaptations are *not* adaptations *for* their current function in Sense 2. The divergence: exaptation challenges Sense 2 directly, but your phenomenon is the *logical move* used to evade such challenges.

  ### 3. Is There a Name? (142 words)
  **No.** While the *conceptual distinction* is established (Brandon, Mayr), and the *methodological critique* is named (adaptationism), this specific **argumentative tactic**—leveraging the semantic ambiguity of "adaptation" to equivocate between current utility and evolutionary origin, thereby shielding historical claims from falsification—lacks a dedicated term. Philosophers note the ambiguity (e.g., Sterelny, Griffiths) but focus on clarifying concepts, not naming the dialectical fallacy. The move exploits a recognized linguistic blurring but functions as a distinct rhetorical strategy. Your observation identifies a gap: we have names for the concepts and the bias, but not for this *exploitation of conceptual ambiguity in real-time argumentation*.

  ### 4. Proposal: "Adaptive Equivocation" (148 words)
  **Term:** **Adaptive Equivocation**  
  **Definition:** The fallacious argumentative move in evolutionary biology where the term "adaptation" is equivocated between its sense of *current functional utility* and its sense of *historical selection for that function*. Evidence for the former is illicitly treated as sufficient evidence for the latter, and challenges to the historical claim are deflected by retreating to claims about current utility.  
  **Fallacious vs. Harmless:**  
  - **Fallacious:** When used to assert/defend a claim about *evolutionary history* without providing historical evidence, solely relying on current utility, and dismissing alternatives (exaptation, byproduct).  
  - **Harmless:** When discussing *only* current function (e.g., "the heart is an adaptation for pumping blood" in a physiology context), or when historical evidence *is* provided and the senses are distinguished. The fallacy lies in the evidential bait-and-switch during historical claims.

  ### 5. Boundary Cases (147 words)
  1. **Strong Stabilizing Selection:** A trait (e.g., vertebrate eye design) has maintained the *same* function for millions of years via stabilizing selection. Current utility *and* historical origin align closely. Is it equivocation to infer history from current use here? **Hard because:** While independent evidence (fossils, genetics) exists, the functional argument *alone* seems stronger. The slippage becomes problematic if historical novelty is asserted *without* evidence, but the line blurs when continuity is probable.
  2. **Repurposed Vestiges:** Penguin wings are vestigial *for flight* but exapted *for swimming*. Calling them "adaptations for swimming" uses Sense 1 (current utility). Calling them "adaptations *for* swimming" implies Sense 2 (historical selection), which is false. **Hard because:** If swimming efficiency is high, the "utility = historical origin" intuition tempts equivocation. Resolving this requires explicit distinction: it’s an *adaptation for swimming* only in Sense 1, but an *exaptation* in Sense 2. Ambiguity arises when the repurposing event is recent or poorly documented.
