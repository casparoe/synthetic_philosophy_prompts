  Okay, let me start by unpacking the user's query. They're on a condo board and had a heated debate about hiring armed private security. The core issue wasn't about cost or effectiveness but whether this action supports the system or admits its failure. One side saw it as creating a "private state," while the other argued a neighborhood can't be the state. The user noticed this pattern in other contexts too—like campus security, militias at protests, contractors, and lynch mobs. The key point is that the physical facts aren't disputed, but the classification of the actor as state or non-state determines the moral judgment.

  First, I need to identify the phenomenon. The user wants to know if there's a term for when disputes revolve around categorizing an actor rather than their actions. They mentioned examples where labeling something as state makes violence legitimate, while private makes it a threat. They’re looking for established concepts, not just a label, and want to understand how this differs from mere semantic stretching or boundary disputes.

  I recall theories about state sovereignty and legitimacy. The state's monopoly on violence is central, as Weber defined. But the edges of that monopoly are fuzzy. When private entities perform state-like functions, it challenges that monopoly. This is about performative boundary drawing—where the act of categorizing is political. 

  The user’s examples show how categorization confers legitimacy. Campus security might be seen as either part of the state or private, affecting perceived authority. Contractors in unmarked vans create plausible deniability, blurring state involvement. Lynch mobs historically operated with implicit state approval, making it quasi-official. 

  I should consider concepts like sovereignty, legitimacy, and performativity. Agamben's state of exception comes to mind, where norms are suspended. Foucault's governmentality discusses how power disperses beyond formal state structures. Delegation and outsourcing, like using private security, could be seen as reconfiguring state boundaries. 

  The user also wants to know how this differs from ordinary definitional disputes. Here, the classification isn’t neutral; it’s a power move. Calling something state-sanctioned legitimizes it, while labeling it private delegitimizes. The contest itself reinforces or challenges state authority. 

  For the condo example, hiring security could be seen as either supplementing the state (thus supporting it) or replacing it (admitting failure). The argument over classification is the political act, shaping perceptions of legitimacy. 

  The term "performative sovereignty" might fit, emphasizing that defining what’s sovereign is an act of power. "Boundary work" in sociology also applies, where groups demarcate social lines. The user’s deeper need might be understanding how power dynamics operate through categorization, affecting real-world decisions and legitimacy.
answer: |-
  You've hit on a profoundly important and under-discussed phenomenon in political theory and sociology: **the contested boundary of the state as the locus of legitimacy itself.** **There isn't a single universally accepted term, but several established concepts capture key facets of this:** Here's a breakdown of the phenomenon, relevant concepts, and its boundaries:

  1.  **The Core Phenomenon: Contested Monopoly & Legitimacy through Classification**
      *   **Weber's Definition:** Max Weber famously defined the state as the entity holding a "monopoly on the *legitimate* use of physical force" within a territory. Your observation pinpoints the crucial, contested word: **"legitimate."** Legitimacy isn't inherent; it's socially and politically *conferred* through recognition and classification.
      *   **The Boundary is Political:** Where the state ends and "private" or "non-state" begins is not a fixed, natural line. **Drawing that boundary is an inherently political act with profound consequences.** Classifying an actor or act as "state" attempts to cloak it in the presumptive legitimacy of the state's claimed monopoly. Classifying it as "private" strips it of that legitimacy and often frames it as a threat *to* that monopoly.
      *   **Classification as Argument:** The argument *is* about the boundary itself. The physical facts of the patrol, the militia, the contractors, or the lynch mob are secondary to the struggle to define *what kind of social/political entity* is acting. The classification *creates* the moral/political meaning.

  2.  **Key Concepts & Frameworks:**
      *   **Performative Sovereignty / Boundary Work:**
          *   **Concept:** This draws on J.L. Austin's idea of "performative utterances" (words that *do* something, like declaring a marriage) and applies it to political boundaries. **The act of *categorizing* the actor (as state/private) is itself a performative act that *creates* or *reinforces* the political reality it describes.** It's an attempt to *make* the patrol part of "the system" or *make* it an attack on the system by labeling it.
          *   **Boundary Work:** Sociologists (like Thomas Gieryn) study how groups draw boundaries (e.g., science/non-science) to claim authority or legitimacy. Your examples show **political boundary work** – groups struggle to place actors on one side or the other of the "state/non-state" line to claim the mantle of legitimacy (state) or frame the other as illegitimate (non-state threat).
      *   **State Delegation & the Blurred Monopoly:**
          *   **Concept:** Modern states constantly delegate coercive functions (security, prisons, military support) to private entities. Scholars debate whether this constitutes a "crisis of the monopoly" or simply a reconfiguration. **The *argument* you observed is the *political negotiation* inherent in this delegation:** Does hiring private security *extend* the state's reach (supporting the system) or *replace* it (admitting failure)? The delegation itself becomes a site of contest over the state's integrity.
      *   **Plausible Deniability & Shadow State:**
          *   **Concept:** The unmarked vans/denials example highlights how states sometimes intentionally *obscure* the boundary. Using actors whose status can be denied allows the state to wield force while potentially avoiding accountability and maintaining the *appearance* of the monopoly. **This creates ambiguity that fuels the classification dispute.** Is it "really" the state acting secretly, or truly rogue private actors? The ambiguity *is* the strategy.
      *   **Legitimacy & Social Recognition:**
          *   **Concept:** Legitimacy isn't just legal; it's deeply social. Does the community *recognize* the campus security, the militia, or the lynch mob *as* legitimate authority? **The dispute you describe *is* the process of social recognition/non-recognition playing out.** The condo argument was fundamentally about whether the association *could* be recognized as wielding legitimate coercive power, or whether that recognition belonged solely to the official state.
      *   **Giorgio Agamben's "State of Exception":**
          *   **Concept:** Agamben argues the sovereign (the state) defines itself by its power to declare the normal rules (law) suspended (exception). **Your examples often occur in perceived "grey zones" – areas of insecurity, protest, or historical oppression – where the normal rules feel suspended.** The argument over classification is a struggle over who gets to define the situation: Is this a space where the state's monopoly holds, or is it an "exception" where other entities (militias, mobs, private patrols) can claim the right to wield force? The condo fight arises from a *perceived* local breakdown (break-ins), creating a mini "state of exception" where the boundary is contested.

  3.  **How This Differs From Mere Semantic Stretching or Definitional Disputes:**
      *   **Stakes:** The stakes are fundamentally about **legitimacy, power, and the authority to wield force.** It's not just about winning an argument; it's about defining who has the *right* to coerce and under what conditions. This directly impacts perceptions of justice, order, and threat.
      *   **Nature of the Act:** The classification argument *is* the primary political act. In your condo meeting, arguing "private state" vs. "supplementing the system" *wasn't rhetoric supporting a separate point about cost or efficacy; it was the core point itself.* The physical act (hiring guards) was secondary to the act of defining its political meaning.
      *   **Reinforcement/Undermining:** Successfully classifying an act as "state" *reinforces* the state's claimed monopoly and legitimacy. Successfully classifying it as "private" *undermines* it and positions that act as a challenge. The argument itself shapes the perceived strength and reach of the state.
      *   **Implicit Power:** The ability to successfully impose a classification ("That's just private thuggery!" vs. "That's legitimate community defense!") is itself an exercise of social and political power.

  4.  **A Proposed Name: "The Legitimacy Boundary Contest" or "The Performative Monopoly"**
      *   **Legitimacy Boundary Contest:** This emphasizes that the core dispute is over where the line marking legitimate state coercion ends, and that drawing this line *is* the contest that confers or denies legitimacy.
      *   **Performative Monopoly:** This emphasizes that the state's monopoly on *legitimate* violence isn't a static fact but is constantly *performed* and *reaffirmed* (or challenged) through acts of social and political classification like the arguments you witnessed. The monopoly exists only insofar as people collectively perform the act of recognizing it and policing its boundaries.

  5.  **Applying it to Your Condo Situation:**
      *   **The Contest:** The fight was precisely a **Legitimacy Boundary Contest**. One side ("supporting the system"/"supplementing") was attempting to classify the private patrols as an *extension* of the state's function (delegation/support), thus preserving the state's monopoly and legitimacy. The other side ("private state"/"admitting failure") was attempting to classify the patrols as existing *outside* and *in opposition* to the state's monopoly, framing it as an illegitimate usurpation or an admission that the state's monopoly had locally failed.
      *   **The Stakes:** The moral valence ("order" vs. "lawlessness") flowed entirely from which classification "won." If the patrols are classified as part of "the system" (even privately delegated), they become "order." If classified as outside/replacing the system, they become "lawlessness" (a rival claim to force).
      *   **The Outcome:** Whichever framing prevails doesn't just decide the hiring; it shapes residents' perception of their own community's relationship to the state and the legitimacy of the security presence itself. Did they bolster the system, or did they tacitly secede?

  **In essence, you've identified the fundamental political struggle over the definition and limits of sovereignty itself. The state's monopoly on legitimate violence isn't a physical fact like a mountain; it's a social and political construct maintained through constant acts of recognition, classification, and contestation at its ever-shifting edges. Your condo fight wasn't about security; it was a microcosm of defining where "the state" ends and who gets to decide.** This phenomenon sits at the heart of understanding power, legitimacy, and the often-blurry line between public authority and private force.
