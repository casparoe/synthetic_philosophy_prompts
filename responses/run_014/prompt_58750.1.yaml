  *(Leans back, smirking)* Oh come on, that’s totally different! You all *chose* to give Maya those tokens because you valued her dumplings more than your laundry slots. That was fair. Now she’s using *her property*—those tokens she earned—to book machines. That’s her right! If you didn’t want her booking all the slots, you should’ve thought of that *before* handing over tokens like suckers. You don’t get to cry "unfair" later just 'cause she outplayed you. Taking her tokens back now? That’s literal theft. You made your bed—lie in it.  

