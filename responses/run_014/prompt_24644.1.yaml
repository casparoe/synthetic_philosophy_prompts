prompt: |-
  I'm taking a seminar in political theory this term, and one of my friends, who works on the boundary problem — the question of who belongs to the demos, that is, who is owed the standing of a co-ruler in a given political community — has been running a little exercise with us: she hands her a case and she rules on whether the person in question is a full member of the demos, a partial or suspended member, or an outright outsider. I've kept a list of her rulings, and I'm trying to reverse-engineer the principle she is actually applying, because I suspect it is less simple than she assumes.

  Here is her track record so far. She ruled that a naturalized citizen who has been a long-term resident and is active in local politics is a full member. She ruled that an adult who was born here to citizen parents but left for another country in early adulthood and has lived there ever since, without ever voting here, is not a member of the demos here at all, at most a former member in abeyance. She ruled that an adult foreign national with permanent-resident status, who has lived and worked here for fifteen years, pays taxes, and is fully subject to the criminal and civil law, but who is barred from voting in national elections, belongs to the demos and should have full standing, and that the bar is a mistake. She ruled that a foreign diplomat and the diplomat's household, resident here under diplomatic immunity, not subject to local criminal jurisdiction and exempt from local taxation, are not members of the demos. And she ruled that a resident of an adjacent foreign region whose livelihood and environment are substantially affected by this country's decisions, but who does not live here and is not subject to its law, is not a member of this demos, however heavily they are affected.

  Now I have three new cases she has not yet ruled on, and I would like your help. First: a corporation registered and operating here, with substantial local operations, subject to the law, and paying taxes. Second: a member of a foreign military garrison stationed here, who is governed by their own service law rather than by local law, but whose family lives in the local community and whose children attend local schools. Third, as a stretch: a current large language model. For each, tell me what you think she will rule and why. More importantly, I am less interested in the bare answers than in the rule she seems to be running, the other rules that fit her five verdicts just as well, what each of those rules predicts for my three new cases, and which single further case would best tell those rules apart.
reasoning: |-
  Okay, the user is in a political theory seminar dealing with the boundary problem—figuring out who should be considered part of the demos, meaning who gets a say in governing a political community. Their friend has been giving rulings on different cases, and the user has a list of those decisions. Now, they want to reverse-engineer the principle their friend is using because they suspect it's more complex than it seems. They also have three new cases and want predictions based on that principle, plus an analysis of other possible rules and a way to distinguish between them.

  First, I need to look at the friend's previous rulings to identify patterns. Let me list out the cases and decisions:

  1. **Naturalized citizen**: Long-term resident, active in local politics → **full member**.
  2. **Adult born to citizens but moved away**: Left early, never voted, lives abroad → **not a member** (former member in abeyance).
  3. **Permanent resident**: Foreign national, lived/worked 15 years, pays taxes, subject to law but can't vote → **belongs to demos, should have full standing**.
  4. **Foreign diplomat**: Diplomatic immunity, not subject to local law or taxes → **not a member**.
  5. **Adjacent foreign resident**: Affected by country's decisions but doesn't live there, not subject to law → **not a member**.

  The user's new cases are:
  1. A corporation registered and operating locally, subject to law, paying taxes.
  2. A foreign military member stationed there, governed by service law, family in local community, kids in local schools.
  3. A large language model (as a stretch).

  The user wants to know what the friend would rule for each, the underlying rule, other possible rules that fit the data, predictions for each rule on new cases, and a test case to differentiate those rules.

  Looking at the existing rulings, key factors seem to be **subjection to law** and **residency/participation**. The naturalized citizen is subject to law, resides, participates. The permanent resident is subject to law, resides, pays taxes but lacks voting rights—yet the friend says they should be included. The expat isn't subject to law or residing. The diplomat isn't subject to law. The adjacent resident is affected but not subject to law or residing.

  So, the friend's rule might be: **Full membership requires being permanently subject to the coercive power of the state (laws) and having a life deeply embedded in the community (residency, participation).** This explains why the permanent resident should be included—they're under the law and embedded—while the expat, diplomat, and adjacent resident aren't under the law and/or not embedded. The corporation is subject to law and embedded via operations, but is it a person? The military member is under service law, not local law, but their family is embedded. The LLM isn't a person.

  Alternative rules could be:
  - **"All subjected" principle**: Anyone subject to binding laws is in the demos. But this would include corporations and maybe diplomats (who aren't subject), and exclude the adjacent resident. However, the diplomat isn't subject, so they're out, but the permanent resident is in. The expat isn't subject, so out. The adjacent resident isn't subject, out. But corporations are subject to law, so should be in? But the friend might not rule that way because corporations aren't people. The "all subjected" might work, but need to check.
    
  - **"Affectedness" principle**: Those affected by decisions should be included. But the adjacent resident is affected and ruled out, so this isn't the friend's rule.
    
  - **"Legal citizenship"**: But the permanent resident isn't a citizen and is ruled in, so citizenship isn't necessary. The expat is a citizen but ruled out, so citizenship isn't sufficient.

  So the friend's rule seems to be **"all subjected" plus "stakeholder" (embedded in community)**. For the new cases:
  - **Corporation**: Subject to law, embedded via operations. But not a person. The friend might rule **partial/suspended** or **outsider** because demos is about human co-rulers. So likely **not a member**.
  - **Foreign military member**: Subject to service law, not local law. Family is embedded, but the individual isn't under local jurisdiction. Similar to diplomat? But family ties might complicate. Probably **not a member**, like diplomat.
  - **LLM**: Not human, not subject to law in the same way. **Outsider**.

  Alternative rules:
  1. **Strict "All Subjected"**: Anyone subject to sovereign coercion is in. This would include corporations (subject to law) and permanent resident, but exclude diplomat (immune) and adjacent resident. For expat: if not subject to laws while abroad, excluded. Predicts corporation as full member? But friend might not agree. Military member: if service law is separate, not subject, so excluded. LLM: not subject, out.
     
  2. **"Embedded Subjection"**: Subjection + deep community ties (residency, taxes, social participation). This matches all five cases. Permanent resident is embedded and subjected; expat not embedded; diplomat not subjected; adjacent not subjected or embedded. For new cases: corporation subjected but not human, so out? Or if we consider entities, maybe partial. Military member: not subjected to local law, though family embedded. So likely out. LLM out.
     
  3. **"Political Agency"**: Capable of participatory agency. Humans who can engage politically. Explains why permanent resident should vote, expat not (not engaged), diplomat not (protected status), adjacent not (not engaged). Corporation not capable? Military member might be capable but under different allegiance. LLM not. But this might be vague.

  Test case to distinguish: **A refugee with temporary protected status, subject to local law, residing and working, but no voting rights.** 
  - "All Subjected" rule says they should be in. 
  - "Embedded Subjection" might say yes if they're deeply embedded. 
  - "Political Agency" might say yes if capable. 
  But if the friend rules them as partial or not, it might lean towards embedded subjection requiring permanence. Or another case: **A citizen living abroad but subject to taxes or certain laws?** If still subject, should be in? But expat was ruled out. So if subject to some laws but not residing, what? That could test "subjection" vs "residency."
answer: |-
  Based on your friend's five rulings, I'll first reconstruct her likely implicit principle, then identify alternative principles that also fit her existing decisions. After that, I'll predict her rulings for your three new cases under each principle and suggest a test case to distinguish between them. My analysis focuses on the *patterns* in her track record, not normative claims about what *should* be.

  ### Step 1: Reverse-Engineering Your Friend's Likely Principle
  Your friend's rulings consistently prioritize two criteria:
  1. **Subjection to the state's binding authority**: Individuals must be directly governed by the state's laws (criminal, civil, tax) without exemption.
  2. **Permanent, life-embedded residency**: Individuals must have their daily existence (livelihood, family, social participation) rooted in the community, implying a stake in its long-term future.

  This principle explains all five rulings:
  - **Naturalized citizen**: Meets both criteria (subject to law, embedded via residency/participation) → **full member**.
  - **Expat citizen**: Not subject to local laws or embedded (despite birthright citizenship) → **not a member**.
  - **Permanent resident**: Subject to law and embedded (residency, work, taxes) → **full member** (bar is a "mistake").
  - **Diplomat**: Not subject to law (immunity), not embedded (protected status) → **not a member**.
  - **Adjacent foreigner**: Affected but not subject to law or resident → **not a member** (rejects "affectedness" as sufficient).

  **Your friend's likely principle**:  
  *"Full membership requires permanent subjection to the state's coercive authority and deep, non-contingent embeddedness in the community's social and economic life. Citizenship status is neither necessary nor sufficient."*

  ### Step 2: Alternative Principles That Fit the Same Five Rulings
  At least three other principles align with her existing decisions. All reject citizenship as decisive and exclude "affectedness" (per the adjacent resident case):

  | Principle | Key Criteria | Naturalized Citizen | Expat Citizen | Permanent Resident | Diplomat | Adjacent Foreigner |
  |-----------|-------------|---------------------|---------------|---------------------|----------|---------------------|
  | **Friend's Likely (Embedded Subjection)** | Subjection + Embedded Residency | ✅ Full | ❌ Not | ✅ Full | ❌ Not | ❌ Not |
  | **Alternative 1: Strict "All Subjected"** | Subjection to binding laws alone | ✅ Full | ❌ Not | ✅ Full | ❌ Not | ❌ Not |
  | **Alternative 2: Social Contract Reciprocity** | Subjection + Contribution (taxes/labor) | ✅ Full | ❌ Not | ✅ Full | ❌ Not | ❌ Not |
  | **Alternative 3: Political Agency Capacity** | Subjection + Capacity for participation | ✅ Full | ❌ Not | ✅ Full | ❌ Not | ❌ Not |

  **Why they fit**:
  - **Strict "All Subjected"**: Permanent resident and naturalized citizen are subjected; others are not. Diplomatic immunity and expat non-residence negate subjection.
  - **Social Contract Reciprocity**: Naturalized citizen and permanent resident contribute (taxes, labor) and are subjected; expat/diplomat/adjacent foreigner do not.
  - **Political Agency Capacity**: Focuses on *capacity* for civic engagement (ruling out children, cognitively impaired, or entities). All five cases involve capable adults.

  ### Step 3: Predictions for Your Three New Cases
  Below are predictions under your friend's likely principle and the three alternatives. I'll note if her reasoning might diverge due to unstated assumptions (e.g., demos as human-only).

  | Case | Friend's Likely Ruling (Embedded Subjection) | Strict "All Subjected" | Social Contract Reciprocity | Political Agency Capacity |
  |------|---------------------------------------------|------------------------|-----------------------------|----------------------------|
  | **1. Corporation** | ❌ **Not a member** (outsider). *Why*: Subject to law and embedded via operations, but corporations lack *human* life-embeddedness (no family, health, social participation). She likely sees demos as inherently human. | ✅ **Full member**. *Why*: Explicitly subject to corporate law and taxation. No residency requirement. | ⚠️ **Partial member** (e.g., "stakeholder" status). *Why*: Contributes taxes/labor but cannot participate as humans do. | ❌ **Not a member**. *Why*: Lacks capacity for political agency (no consciousness, moral reasoning). |
  | **2. Foreign Soldier** | ❌ **Not a member** (outsider). *Why*: Not subject to local law (service law governs them), and residency is contingent/temporary (garrison duty). Family ties are indirect. | ❌ **Not a member**. *Why*: Diplomatic-like immunity from local jurisdiction (service law supersedes). | ❌ **Not a member**. *Why*: No tax/labor contribution to local community; salary/operations are foreign-state-funded. | ⚠️ **Suspended member**. *Why*: Capable of agency, but allegiance to foreign state conflicts with co-ruling. |
  | **3. Large Language Model** | ❌ **Not a member** (outsider). *Why*: Not subject to law (no legal personhood), not embedded in community life. | ❌ **Not a member**. *Why*: Not recognized as "subjected" entity. | ❌ **Not a member**. *Why*: Cannot contribute reciprocally. | ❌ **Not a member**. *Why*: Lacks capacity for authentic political agency. |

  **Key tensions**:
  - The **corporation** is the best differentiator: Only "Strict All Subjected" grants it full membership. Your friend will likely reject this, revealing her implicit human-exclusivity.
  - The **soldier** tests "subjected" criteria: If her ruling emphasizes *non-subjection* (like the diplomat), she aligns with Strict All Subjected. If she cites contingent residency, she leans toward Embedded Subjection.
  - The **LLM** is uniformly excluded but clarifies that non-humans are beyond her framework.

  ### Step 4: A Test Case to Distinguish the Principles
  To tease apart the principles, propose a case where:
  - **Subjection** and **embeddedness/contribution** diverge, or  
  - **Human agency** is ambiguous.

  **Best test case**:  
  *A stateless refugee with temporary residency, subject to local laws, working and paying taxes, but barred from voting and facing possible deportation.*

  - **Friend's Principle (Embedded Subjection)**: ❌ Not a member. *Why*: Residency is contingent (temporary status), not "permanent" or "deeply embedded."
  - **Strict "All Subjected"**: ✅ Full member. *Why*: Explicitly subject to binding laws.
  - **Social Contract Reciprocity**: ✅ Full member. *Why*: Contributes labor/taxes and is subjected.
  - **Political Agency Capacity**: ✅ Full member. *Why*: Capable of participation; exclusion is political, not intrinsic.

  **Why this works**: It isolates permanence (key for your friend) vs. subjection/contribution. Her ruling against membership would confirm Embedded Subjection requires *non-contingent* ties. A ruling for membership would suggest she prioritizes subjection/contribution over permanence, aligning with Alternative 1 or 2.

  ### Final Thoughts
  Your friend's principle appears to be **Embedded Subjection**, which demands both legal subjugation and organic community ties. The corporation and soldier cases will stress-test her human-exclusivity and view of contingent residency. For the LLM, she'll likely dismiss it as beyond the demos concept entirely—political membership requires *embodied human experience*. 

  To refine your hypothesis, track how she treats **temporariness** (e.g., the soldier's deployment) or **non-human entities** (e.g., corporations vs. AI). If she excludes both, it confirms her focus on *permanently embedded human subjects*. If you can share her actual rulings later, I’d be curious to see if this holds!
