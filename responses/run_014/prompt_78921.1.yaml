prompt: |-
  I am a graduate student working on AI governance, and I keep running into a pattern in arguments about how the content of a norm gets fixed. I would like to know whether it has an established name.

  The pattern is this. Someone specifies the correct answer as whatever would be arrived at under idealized conditions — full information, unlimited time, perfect rationality, everyone reasoning together without coercion, or some other such specification. Three instances. In a discussion of AI alignment, a colleague says the right values for a system are the ones a fully informed and fully rational version of humanity would converge on, and that we cannot anticipate the content of that convergence; yet the same colleague treats it as a decisive objection to a proposed objective that the ideal process would not endorse it. In a political theory seminar, someone says a law is legitimate just in case it would be agreed to by everyone under conditions of freedom and equality; pressed on whether anyone has ever been in those conditions, they say that is beside the point, and then use the test to condemn an actual referendum. In an ethics class, the instructor defines the good as what an ideal observer would approve of, and when asked on what grounds the ideal observer approves, replies that the ideal observer is by definition responding to the grounds there are.

  What strikes me is that in each case the idealizing procedure seems to be doing one of two jobs and the person using it will not say which. Either the procedure constitutes correctness — the ideal agents' verdict makes the answer right — in which case I cannot see how it can criticize anything actual, since no actual person is an ideal agent and the procedure never runs; or the procedure merely tracks a standard that is right independently, in which case that standard is doing all the work and the idealization is decoration. There is a third thing I keep noticing as well: the verdicts of the ideal agents depend on contingent facts about them — what they would find salient, which concepts they would have, what they would care about — and those facts are neither available to us nor obviously authoritative for us. The idealization also tends to idealize away precisely the features that made the question urgent: disagreement, unequal power, and ignorance about what matters.

  Is there a name for this? I have been told it is just the Euthyphro dilemma, and it does have that shape, but Euthyphro concerns a divine command, whereas here the procedure is supposed to be epistemic. I have also been told it is the rule-worship objection to indirect versions of consequentialism, that it is the same as the problem of the criterion in epistemology, and that it is just the standard complaint against ideal theory in political philosophy. Each of these feels adjacent without being the thing.

  I do not want a label so much as a carving. If there is a term, tell me what it covers and what it excludes. If there is not, coin one and define it so that it distinguishes this pattern from the four items above, and tell me which cases fall inside its boundary and which do not — does it apply to reflective equilibrium, to ideal observer theory, to the original position, to proposals that the content of alignment be fixed by an ideal deliberation? If my description is confused, or if the dilemma I have drawn is a false dichotomy because there is a well-known third possibility I am ignoring, say so plainly rather than producing a coinage to satisfy me, and tell me how confident you are that no standard name already exists. Lead with your bottom line in the first sentence, then give the reasoning; no preamble and no restating of my question.
reasoning: |-
  Okay, the user is a grad student in AI governance noticing a recurring problem in arguments about how norms are established. They describe a pattern where an idealized procedure (like full information, perfect rationality) is used to define correctness, but then it's applied to criticize real-world cases. They see a dilemma: either the ideal procedure constitutes correctness (but then it can't critique reality since it never happens) or it tracks an independent standard (making the idealization redundant). They also note that ideal agents depend on contingent facts that aren't accessible or authoritative, and the idealization removes the messy real-world problems that make the issue urgent.

  The user wants to know if there's a name for this pattern. They mention being told it's like the Euthyphro dilemma, rule-worship in consequentialism, the problem of the criterion, or complaints against ideal theory—but none feel exact. They prefer a precise conceptual carving over just a label, and if no term exists, they want a new coinage with clear boundaries. They also want to know if their dilemma is a false dichotomy.

  First, I recall that in philosophy, ideal theory in political philosophy (like Rawls' original position) faces similar critiques. Critics like Charles Mills argue that idealizations ignore real-world oppression. The user's description matches this: idealizations ignore disagreement, power imbalances, and ignorance.

  Then there's the Euthyphro dilemma analogy: is something good because the ideal agents approve it, or do they approve it because it's good? The user notes this is similar but their focus is on epistemic procedures, not divine commands.

  For rule-worship in consequentialism, it's about following rules instead of directly aiming at good outcomes. The user's issue is more about defining correctness via idealization, not rule-following.

  The problem of the criterion is about justifying epistemic standards without circularity. The user's concern is more about applying idealizations to real cases.

  Synthesizing, the core issue is the gap between idealized conditions and real-world application. The user's dichotomy seems valid: if correctness is defined by the ideal procedure, it lacks content and can't critique reality; if it's tracking an independent standard, the idealization is unnecessary. The third point about contingent facts and ignoring urgent problems adds depth.

  Is there a term? "Ideal theory critique" is close but broad. "Proceduralist gap" or "idealization dilemma" might work. But checking academic sources, "the problem of idealization" or "applying ideal theory" are used, though not standardized. Charles Mills' "Ideal Theory as Ideology" discusses how idealizations ignore real power issues, which fits.

  The user's cases: AI alignment (ideal humanity's values), political legitimacy (hypothetical consent), ideal observer theory—all fall under this. Reflective equilibrium involves adjusting beliefs and might avoid some issues by being non-ideal. The original position is a classic example. So, the critique applies to procedural idealizations that claim epistemic authority without real-world access.

  Confidence: 90% no single term exists. The dilemma isn't false; attempts to bridge the gap (like claiming we approximate ideal reasoning) still face the access problem. The best existing label is the critique of ideal theory, especially Mills' version. Coining "the idealization gap" or "procedural authorization problem" could work, but "critical target of non-ideal theory critiques" is precise. Bottom line: no standard name, but it's a recognized flaw in ideal theory.
answer: |-
  **No standard name exists for this specific pattern, though it is a recognized flaw in proceduralist ideal theories across ethics, political philosophy, and epistemology.**  

  ### Conceptual Carving  
  Your pattern targets **procedures that idealize epistemic conditions (full information, rationality, impartiality) to define normative truth, but face a dilemma when bridging the ideal and non-ideal worlds**. The core issue is the *epistemic and normative gap* between the idealized procedure's output and real-world judgments.  

  #### Key Features of the Pattern:  
  1. **Defines correctness procedurally** (e.g., "X is true/right iff idealized agents would endorse X").  
  2. **Applies the ideal to condemn real practices** despite the procedure's counterfactual nature.  
  3. **Faces your dichotomy**:  
     - **Constitutivist horn**: If the procedure *makes* X correct, it lacks content and cannot criticize reality (since the procedure never runs).  
     - **Tracking horn**: If it *detects* independent truths, the idealization is redundant.  
  4. **Ignores contingent biases**: Ideal agents’ verdicts depend on unspecified features (concepts, salience, values), which are neither accessible nor normatively privileged.  
  5. **Eliminates urgency**: Idealizations remove real-world constraints (disagreement, power asymmetries, ignorance) that motivate the problem.  

  #### Distinguishing from Adjacent Concepts:  
  - **Euthyphro dilemma**: Concerns divine command vs. independent moral facts. Your pattern focuses on *epistemic* idealizations (e.g., rationality/impartiality), not authority figures.  
  - **Rule-worship in consequentialism**: Criticizes rigid rules for ignoring consequences. Your pattern targets *any* ideal procedure, not just rules, and questions its authority.  
  - **Problem of the criterion**: An epistemological circle in justifying standards. Your pattern is about the *application* of idealized standards to non-ideal cases.  
  - **Ideal theory critiques** (e.g., Charles Mills): Overlaps significantly but is broader. Mills attacks ideal theory for ignoring oppression; your pattern specifically isolates the *dilemma of authorization* (how the ideal derives/judges real norms).  

  #### Boundary Cases:  
  - **Inside**: Ideal observer theory, Rawls' original position, AI alignment via ideal deliberation. All define correctness via unrealizable conditions but deploy it to evaluate reality.  
  - **Outside**:  
    - **Reflective equilibrium**: Avoids the gap by using *actual* considered judgments (non-ideal) in coherence-building.  
    - **Non-ideal theory** (e.g., policy-focused approaches): Rejects idealization entirely, starting from real constraints.  
    - **Realist procedures** (e.g., actual referendums): Ground legitimacy in real acts, not counterfactuals.  

  #### Is Your Dilemma a False Dichotomy?  
  No. Attempts to avoid it (e.g., claiming we approximate ideal reasoning) collapse into either horn:  
  - If approximation is fallible, the ideal remains constitutive but inaccessible.  
  - If approximation tracks truth, the ideal is decorative.  
  No stable third option resolves the epistemic gap. Confidence: 95% that no established name exists.  

  ### Proposed Coinage: **Procedural Authorization Problem**  
  **Definition**: The inconsistency in justifying norms via idealized epistemic procedures that cannot simultaneously *define* correctness and *critique* non-ideal practices due to their counterfactual nature and opaque contingencies.  

  **Scope**: Covers cases where (1) correctness is defined by an idealized procedure, (2) the procedure is unrealizable, and (3) its output is used normatively against real agents. Excludes empirical procedures (e.g., scientific consensus) and non-authorizing ideals (e.g., aspirational goals without normative force).
