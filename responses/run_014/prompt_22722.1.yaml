  Next, the epistemicist view comes to mind. Epistemicists like Williamson argue that there are sharp boundaries, but we just can't know them. But the user's stipulation approach is different—they're defining boundaries, not claiming they exist unknowingly. Still, forcing sharp boundaries might be seen as ad hoc and not addressing the core issue of vagueness permeating all levels.

