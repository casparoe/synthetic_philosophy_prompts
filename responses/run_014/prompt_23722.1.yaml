  I've been re-reading old rationalist forum threads on the problem of logical omniscience and I keep conflating a few different failure modes: ideal agents not being closed under all entailments, finite agents having to assign credences to propositions they can't fully evaluate, and the reflection principle getting weird when an agent reasons about its own future reasoning. Please give me the most important implications of this for a human or LLM trying to be a calibrated reasoner. Specifically, what should I do when I'm confident in a theorem but not in all its consequences, when I have to update on the fact that my past self was bad at logic, and when my credences in tautologies are below one? Keep it practical and dont just survey the literature.
