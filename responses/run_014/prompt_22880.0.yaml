answer: |-
  I completely understand your frustration—the textbook treatments often glide over the profound difficulties here. The Frege-Geach problem (FGP) is the central technical challenge for expressivism (and non-cognitivism broadly), and the "higher-order attitude" response feels intuitively plausible until you see why it fails to capture the *logical* structure of moral discourse. Let's dive into the weeds.

  **Clarifying Terms: Embedding Problem vs. Frege-Geach Problem**
  *   **Embedding Problem:** This is the *broader* challenge. How can any theory (expressivism, emotivism, prescriptivism) account for the meaningful use of moral sentences embedded in complex syntactic contexts (conditionals, negation, disjunction, belief reports, questions) when the theory claims these sentences don't express propositions (truth-apt beliefs) in their simple, declarative form? It highlights the discrepancy between surface grammar and the proposed underlying function.
  *   **Frege–Geach Problem:** This is the *specific* and most devastating *instance* of the embedding problem for expressivism, focusing on **logical validity and inference**. Peter Geach, building on Frege's point about assertions occurring unasserted in embeddings, argued that expressivism cannot explain how moral sentences function logically *in the same way* as descriptive sentences when embedded, particularly in contexts like modus ponens. The core issue is **logical relations and truth-preservation**.

  **Why the "Higher-Order Attitude" Response Fails (The Heart of FGP)**

  Your summary of the expressivist response is correct: "If stealing is wrong, then stealing that specific book is wrong" expresses a higher-order attitude, like disapproval of the combination of (1) disapproving of stealing *and* (2) not disapproving of stealing that specific book. The problem isn't that this *can't* be said; the problem is **why this attitude should correspond to a *logically valid inference*** or why the embedded sentences retain their core meaning and logical role.

  Here's the breakdown of why it doesn't work:

  1.  **Loss of Compositionality & Meaning Identity:**
      *   In the simple assertion "Stealing is wrong," the expressivist says it *expresses* disapproval of stealing (e.g., "Boo stealing!").
      *   In the antecedent of the conditional "If stealing is wrong...," the expressivist *cannot* say it expresses disapproval. If it did, asserting the conditional would involve simultaneously expressing disapproval of stealing (via the antecedent) and expressing a complex attitude about disapproval of stealing and approval/neutrality of stealing the book. This is nonsense – you can't simultaneously express disapproval *of stealing* within an attitude that's *about* disapproval of stealing.
      *   So, the expressivist must say the antecedent in the embedded context *doesn't* express disapproval; it merely *mentions* or *refers to* the attitude expressed by the simple sentence. It signifies something like "the state of mind of disapproving of stealing."
      *   **Problem:** This means the *meaning* of "stealing is wrong" changes radically depending on whether it's asserted or embedded. In the simple case, it *expresses* an attitude. In the embedded case, it *refers* to that attitude. Geach argued this violates Frege's principle that the meaning of a sentence part must be consistent across contexts for logic to work. The sentence token "stealing is wrong" in the antecedent is *semantically different* from the same token when asserted alone. Logic relies on the same meaning being used in premises and conclusions.

  2.  **The Problem of Logical Form and Validity (Geach's Punch):**
      *   Consider a modus ponens argument:
          *   P1: If stealing is wrong, then stealing that specific book is wrong.
          *   P2: Stealing is wrong.
          *   C: Therefore, stealing that specific book is wrong.
      *   This argument is intuitively valid. Its validity seems to depend on the *logical form*: If P, then Q; P; therefore Q. We understand "P" and "Q" standing for propositions with truth values, and the inference preserving truth.
      *   **Expressivist "Translation":**
          *   P1: Expresses disapproval towards (disapproving of stealing AND not disapproving of stealing the book). (Disapproval of <Att1 & ~Att2>)
          *   P2: Expresses disapproval of stealing. (Att1)
          *   C: Expresses disapproval of stealing the book. (Att2)
      *   **The Fatal Gap:** Why is it logically inconsistent (or rationally incoherent) to hold the attitude expressed by P1 (Disapproval of <Att1 & ~Att2>), hold the attitude expressed by P2 (Att1), but *fail* to hold the attitude expressed by C (Att2)? The expressivist needs to explain why having the first two attitudes *rationally necessitates* having the third attitude.
      *   **Why the Explanation Fails:** The expressivist might say: "Holding P1 (Disapproval of <Att1 & ~Att2>) means you are committed to disapproving of *not* having Att2 *if* you have Att1. Since you have Att1 (P2), you *must* have Att2 (C) to avoid the disapproved combination."
      *   **The Deep Problem Revealed:** This explanation smuggles in the *very logical structure* it was meant to explain non-cognitively! The "if...then..." and the "must" in this explanation are *logical* operators. The expressivist is relying on the *logical validity* of the inference "If (Att1 & ~Att2) is bad, and Att1 is had, then Att2 must be had" to explain the moral inference. But this just pushes the problem back: How does the expressivist explain *this* logical "must"? What non-cognitive state corresponds to *this* logical commitment? The attempt to ground logic in attitudes inevitably presupposes the logic it's trying to ground. The attitude explanation doesn't *capture* the logical necessity; it *presupposes* it.

  3.  **Inferential Opacity:**
      *   A logically valid argument guarantees that *if* the premises are true, the conclusion *must* be true. Truth is transparent to logical form.
      *   Attitudes are not transparent in this way. Someone could hold Att1 (disapprove of stealing) and hold the complex attitude expressed by P1 (Disapproval of <Att1 & ~Att2>), but due to confusion, inconsistency, weakness of will, or simply failing to make the connection, *not* hold Att2 (disapprove of stealing the book). This is a *psychological* failure, not necessarily a *logical* error. Logic, however, demands that accepting the premises *entails* accepting the conclusion, regardless of psychology. The attitude account reduces logical error to psychological failure, which seems inadequate. The person who fails to draw the conclusion is making a *mistake in reasoning*, not just being inconsistent in their feelings.

  4.  **The "Pew!" Problem (Geach's Illustration):**
      *   Geach used the example of "pew" (an expression of disgust). If I say "Pew! That mushroom is poisonous", the "pew" expresses my disgust. But if I say "If 'pew! that mushroom is poisonous', then you shouldn't eat it", the "pew!" in the antecedent *doesn't* express my disgust; it *refers* to the disgust-expression. The meaning changes.
      *   Similarly, if "wrong" in "Stealing is wrong" is like "pew!" expressing disapproval, then in "If stealing is wrong..." it can't be expressing disapproval; it has to be mentioning it. But logic requires the *same meaning* ("wrong" meaning the same property) to be present in both asserted and embedded contexts for the inference to be valid in the standard way.

  **How Quasi-Realism (Blackburn) Tries to Solve It**

  Simon Blackburn's quasi-realism is the most sophisticated expressivist attempt to solve FGP. His core idea is **projectivism plus a discipline of attitudes**. The goal is to "earn the right" to talk *as if* moral judgments are truth-apt and participate in logical relations, even though their fundamental nature is expressive.

  1.  **Projectivism:** We project our attitudes (approval, disapproval) onto the world, talking *as if* they were properties of actions (wrongness, goodness).
  2.  **The Need for Discipline:** Simply projecting attitudes isn't enough. We need shared, stable ways of discussing and reasoning about these projected properties. This requires developing practices and norms for how attitudes relate to each other and to the world.
  3.  **Mimicking Propositions & Logic:** Blackburn argues we develop a system of "propositional reflection." We create syntactic and inferential practices that *mimic* the behavior of truth-apt propositions and logical operators. The key move is to define the meaning of logical connectives *in terms of their role in constraining combinations of attitudes*.
      *   **Negation ("not P"):** Expresses a "higher-order disapproval" of holding the attitude expressed by P. (Disapproving of disapproving of stealing? Needs careful formulation).
      *   **Conditional ("If P, then Q"):** Expresses disapproval of holding the attitude expressed by P *without* holding the attitude expressed by Q. (Exactly what you described: Disapproval of <Att-P & ~Att-Q>).
      *   **Conjunction ("P and Q"):** Expresses holding *both* Att-P *and* Att-Q.
      *   **Disjunction ("P or Q"):** Expresses disapproval of holding *neither* Att-P *nor* Att-Q.
  4.  **Explaining Validity (The Tricky Bit):** Blackburn argues that the *point* of developing these logical practices is to achieve coherence and stability in our practical lives. The "validity" of modus ponens arises because adopting the complex attitude expressed by "If P, then Q" (disapproval of <Att-P & ~Att-Q>) *commits* one, upon adopting Att-P, to adopt Att-Q *on pain of practical inconsistency*. This inconsistency isn't mere psychological discomfort; it's a violation of the normative standards *built into the very practices we've developed* for managing our projected attitudes. The logical "must" is grounded in the norms constitutive of this attitude-management system.

  **Why Critics Say Quasi-Realism Doesn't Fully Solve FGP (The Lingering Wall)**

  1.  **The Circularity/Precariousness Charge:** Critics (like Bob Hale, Crispin Wright, Nick Zangwill) argue that Blackburn's solution only works if the logical norms governing attitudes are *already* in place and sufficiently robust *before* the mimicry of logic begins. But where do *these* norms come from? If they are themselves explained in terms of yet higher-order attitudes (e.g., disapproval of failing to disapprove of <Att-P & ~Att-Q> when one has Att-P and lacks Att-Q), we risk an infinite regress or a circular grounding of logic in logic. The worry is that the "discipline" needed to make the attitudes behave logically ultimately presupposes the independent validity of the logic it's trying to mimic.
  2.  **The Problem of Justification:** Even if quasi-realism successfully mimics the *syntax* and *inferential patterns* of logic, does it provide the right *justification* for why modus ponens is valid? The realist says it's truth-preserving. The quasi-realist says it's necessary for avoiding a type of practical inconsistency defined by our attitude-management norms. Critics argue this changes the subject. The *reason* we feel the force of modus ponens seems tied to truth-preservation, not just avoiding attitudinal incoherence defined by our own practices.
  3.  **The Gap Between Mimicry and Reality:** Does successfully mimicking truth-apt discourse and logic *actually make* moral judgments truth-apt? Or is it just a sophisticated pretense? If quasi-realism succeeds, it arguably collapses into a form of realism (the "collapse" objection). If it fails, it hasn't solved FGP. Blackburn walks a tightrope.
  4.  **Complexity and Fragility:** The quasi-realist machinery (layers of higher-order attitudes defining logical operators) is complex and seems vulnerable. Does it extend smoothly to all complex embeddings (quantifiers, belief reports)? Critics argue it feels ad hoc compared to the straightforward realist semantic story.

  **Conclusion: Where You're Hitting the Wall**

  You're hitting the wall because the "higher-order attitude" response feels like it *describes* a psychological state associated with conditionals, but it utterly fails to explain *why that psychological state corresponds to a logically valid inference form*. It doesn't capture the *normative force* of logic ("*must* follow") or the *identity of meaning* required for compositionality. Quasi-realism attempts to build this normativity out of the practical demands of managing our projected attitudes, but critics argue this either smuggles in the logic it needs or provides the wrong kind of justification for logical validity.

  The FGP remains the most potent argument against expressivism precisely because it exposes the fundamental tension: non-cognitive attitudes seem ill-suited to play the semantic and logical roles that moral language undeniably plays in our discourse and reasoning. Quasi-realism is the best shot, but whether it truly solves the problem or merely papers over it with immense complexity is still hotly debated in metaethics. Your struggle is at the very core of the viability of expressivism. Keep wrestling with it – the textbooks *are* often too glib about this profound difficulty. Focus on the Geach point about meaning identity and the justification problem for logical validity; that's where the deepest challenges lie.
