prompt: |-
  I'm a PhD student in philosophy working on metaethics, and I'm trying to get a really solid handle on the Frege–Geach problem for expressivism, but I keep running into the same wall. I get the basic setup — that if moral sentences like 'Stealing is wrong' aren't truth-apt because they're only expressing non-cognitive attitudes, then embedded contexts like 'If stealing is wrong, then it is wrong to steal that specific book' become a problem, since the whole conditional seems to have a truth value even though its parts don't. But I'm not sure I understand why the expressivist's standard response — that the whole conditional just expresses some higher-order attitude, like 'I disapprove of the situation where stealing is wrong and stealing that specific book is permitted' — is supposed to be problematic. Why doesn't that just work?

  And I keep getting confused about whether the 'embedding problem' and the 'Frege–Geach problem' are actually the same thing or two different problems. Can you clarify that? Also, I've read that Blackburn's quasi-realism is supposed to handle this, but I'm not sure how, if it does. I'd really appreciate a detailed explanation that gets into the weeds, because the textbook treatment feels to glib to me and I want to actually understand what's going on.
