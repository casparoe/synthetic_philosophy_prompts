  Also, terminology. Embedding problem is broader—any non-truth-apt content in complex sentences. Frege-Geach specifically targets expressivism's ability to handle logic. Quasi-realism tries to mimic realist logic through projective discipline, but the student might be skeptical if this is just mimicry without real logical structure.

  I should emphasize Geach's original point. Using "pew" as an example shows that reinterpreting embedded contexts changes meaning. The antecedent in "If stealing is wrong..." isn't expressing an attitude; it's referenced. So the expressivist must account for that without attitude expression.

  Blackburn's solution involves propositional reflection and disciplined syntactic practices. But the deep worry is whether this is just a formal trick. Can expressivists genuinely explain why modus ponens feels compelling without invoking truth conditions? The student might need a step-by-step walkthrough of how quasi-realism constructs logical constraints from attitudes.

  I should also clarify that the problem extends beyond conditionals to negation, disjunction, etc. Each embedding requires a new attitude explanation, risking ad hoc complexity. And the inferential opacity issue—why can't attitudes explain logical mistakes? That's crucial.

