prompt: |-
  So there's this thing about big museums I keep turning over and I can't quite get it to hang together.

  They sink a huge share of their money into objects almost nobody sees. Most of what a major museum owns never gets hung — it sits in climate-controlled storage, sometimes for decades, and the place still pays to keep the humidity right, catalogue it, conserve it, insure it. And selling is basically taboo: the long-standing professional norm was that money raised by selling a work could only be spent acquiring other works, so a museum facing layoffs still can't flog a middling drawing to keep its free schools programme going. Some of the bodies have loosened the wording in recent years, but when a few American museums floated something like that during the pandemic the backlash was instant and at least one planned sale got called off.

  Then the same institutions justify themselves to funders entirely in terms of experience: visitor numbers, participation, community engagement, wellbeing surveys.

  And two other habits sit awkwardly with that second paragraph. When a picture turns out to be a forgery — the van Meegeren Vermeers are the classic case — it doesn't just lose some lustre, it comes off the wall, even though not one brushstroke changed and people had been sincerely moved by it for years. Provenance runs the other way: a work jumps in value if it once belonged to someone famous, again with zero change to how it looks. Same museums, incidentally, run Friends societies and name galleries after donors, i.e. they deliberately cultivate personal affection and then convert it into money.

  What picture of value does all this presuppose? Is the store-it-and-never-sell rule committed to the objects mattering whether or not anyone is looking at them, or is it just rule-of-thumb consequentialism about perverse incentives — once directors are allowed to sell, everything gets sold? (Why can a public library weed its stacks without scandal, but a museum can't?) Does the forgery reaction show the place isn't valuing experiences at all, or can an experience-based account absorb it — I have a vague memory of an argument from around that period that the good lies neither in the beautiful thing nor in the pleasure but in the whole complex of a mind admiring something worth admiring, and that sounds like exactly what's wanted here, except that on that view selling to fund access looks totally fine.

  So: reconstruct the implicit theory as best you can, separate what the practice strictly commits you to from what merely fits it comfortably, tell me which rival accounts of beauty and of value the habits quietly rule out, whether the three parts of it presuppose consistent things (including the donor-affection bit), where it's just underdetermined so that several theories would license it, and what a museum would actually have to do differently if it took an experience-based view seriously.
reasoning: |-
  Okay, let me start by unraveling the user's query. They're really digging into the contradictions in how big museums operate. The main points are: museums spend a lot on storing art that's rarely seen, can't sell art to fund other programs, justify their existence through visitor experiences, but then react strongly to forgeries and provenance, and cultivate donor relationships. 

  First, I need to figure out the core tension. The user is pointing out that museums claim to value public engagement, yet their actions suggest the objects themselves have intrinsic value. The storage issue is a big one—why keep so much hidden if the goal is access? And the deaccessioning taboo is another puzzle. Libraries can weed books, but museums can't sell art without backlash. That comparison is key. 

  Then there's the forgery and provenance parts. If the experience matters, why does a forgery being exposed change anything? People were still moved by it. Provenance adding value without changing the artwork's appearance seems odd if experience is central. And donor naming rights tie personal affection to funding, which complicates the idea of intrinsic value.

  The user wants the implicit theory behind these practices. I should break it down into what museums commit to versus what's just practical. For example, the no-sell rule might be about preventing slippery slopes, but it's presented as ethical. They also want to know which theories of value are ruled out. Experience-based theories seem at odds with the forgery reaction, unless there's a way to frame it as the context mattering.

  I recall the aesthetic attitude theory from the user's mention. That could bridge the gap—value comes from the relationship between viewer and object, needing both authenticity and appreciation. But then selling art for access programs should be acceptable, yet it's not. So maybe there's an institutional duty to preserve, separate from public experience.

  Donor recognition adds another layer. Personalizing galleries might create quasi-ownership, which clashes with the idea of art as public heritage. But it's a funding necessity. That inconsistency suggests the implicit theory isn't fully coherent.

  The user also asks what a truly experience-based museum would do differently. I think of the Stedelijk selling art for social programs. They'd rotate collections more, prioritize conservation based on display plans, and maybe accept forgeries if they provide value. But that's risky. Funders might not support storage costs without the intrinsic value argument.

  Underdetermined areas: the storage practice could fit multiple theories. An intrinsic view says preserve everything. An experience view might keep pieces for future access. The donor part is more about pragmatism than theory.

  Inconsistencies: Valuing donor attachments (personal) while rejecting provenance's market effect (impersonal) is contradictory. The forgery reaction emphasizes authenticity, which an experience theory might not prioritize as much.

  Rival theories ruled out: Pure subjectivism (forgeries would still be valued) and strict aesthetic formalism (provenance shouldn't matter). Also, radical instrumentalism (selling art for programs) is taboo.

  Putting it all together, the implicit theory is a hybrid: objects have intrinsic value requiring preservation, but public access legitimizes the institution. The tensions arise when these conflict. Experience-based changes would face practical and ethical hurdles, challenging traditional museum identities.
answer: |-
  Here's a reconstructed implicit theory of value underlying major museum practices, analyzing its tensions and alternatives:

  **The Implicit Theory: Institutional Stewardship of Authentic Cultural Capital**

  1.  **Core Commitment:** Objects possess **intrinsic, non-fungible value** derived from their **authenticity, uniqueness, and historical/cultural significance.** This value is inherent and objective, residing *in the object itself*.
  2.  **The Museum's Sacred Duty:** The primary role of a major museum is to act as a **perpetual steward** of this cultural capital. Acquisition and preservation (even in storage) are ends in themselves, fulfilling a duty to humanity, history, and the objects.
  3.  **Experience as Justification (Not Foundation):** Public access and engagement are crucial *justifications* for public funding and donor support, demonstrating social utility. However, they are **secondary to the core stewardship mission.** The value of the object precedes and validates the experience; the experience does *not* create the primary value.
  4.  **The Anti-Market Imperative:** Objects are **inalienable.** Selling treats them as fungible commodities, violating their intrinsic value and the stewardship duty. Deaccessioning is only permissible for collection refinement (trading up) or dire ethical necessity (e.g., Nazi loot). "Perverse incentives" (sell-off risk) reinforce this taboo but stem from the core belief in inalienability.
  5.  **Authenticity as Paramount:** A forgery lacks the essential intrinsic value – its historical context, creator's genius, and provenience are false. The experience it provided was based on a deception, rendering it **valueless** (or deeply negative) within the stewardship framework, regardless of aesthetic pleasure. Provenance adds layers of historical significance (intrinsic value), explaining its market impact.
  6.  **Donor Affection as Strategic Instrumentalism:** Cultivating personal connections leverages human psychology (attachment, prestige-seeking) to secure resources *for the core mission* (stewardship). Naming rights acknowledge the instrumental contribution, not that the donor's affection *constitutes* the object's value. It's a practical necessity operating *alongside*, sometimes awkwardly, the core theory.

  **What This Strictly Commits To vs. What Fits Comfortably:**

  *   **Strict Commitment:**
      *   Objects have intrinsic value independent of current viewers.
      *   Perpetual stewardship is the primary institutional duty.
      *   Authenticity is a necessary condition for an object's primary value.
      *   Objects are fundamentally inalienable public/universal assets.
  *   **Comfortable Fit (but not strictly required):**
      *   High levels of public access (though storage is acceptable).
      *   Using experience metrics for funding justification.
      *   Donor recognition strategies.
      *   The "perverse incentives" argument against selling (reinforces but doesn't define the taboo).

  **Rival Accounts Ruled Out:**

  1.  **Strict Experientialism/Subjectivism:** The view that value resides *only* in the subjective experience of the viewer is ruled out by:
      *   Storage of unseen objects.
      *   Deaccessioning taboo (object can't be converted to fund experiences).
      *   Intense forgery reaction (experience was identical, but object is now worthless).
      *   Provenance value (experience unchanged, value shifts).
  2.  **Pure Aesthetic Formalism:** The view that value resides *only* in the formal aesthetic properties is ruled out by:
      *   Provenance value (form unchanged, value shifts).
      *   Forgery reaction (formal properties unchanged, value destroyed).
      *   Deaccessioning taboo (form persists elsewhere, but *this specific object* must be kept).
  3.  **Radical Instrumentalism:** The view that museums are *only* tools for generating social goods (education, wellbeing, community cohesion) is ruled out by:
      *   Deaccessioning taboo (cannot liquidate assets for social programs).
      *   Massive resources devoted to storage/preservation of unseen objects.
      *   Authenticity obsession over experiential effect.
  4.  **Market-Based Valuation:** The view that value is primarily determined by market price is ruled out by:
      *   Deaccessioning taboo (market value irrelevant to stewardship duty).
      *   Storage (unseen objects have no market exposure but are preserved).
      *   Rejection of provenance's *solely* market-driven aspect (it's valued as *historical* significance).

  **Consistency & Underdetermination:**

  *   **Consistent Core:** The core tenets (intrinsic value, stewardship, inalienability, authenticity) cohere tightly. Storage, no-selling, and forgery reactions flow directly from this core.
  *   **Tension with Justification:** The reliance on *experience-based metrics* for funding creates tension. It suggests museums must *appeal* to instrumental/experiential values they don't fully embrace internally. This is a pragmatic inconsistency, not a theoretical one within the core.
  *   **Donor Affection:** This is pragmatically necessary fundraising operating *within* the system. It leverages subjective attachment but ultimately serves the objective, intrinsic-value mission. It doesn't fundamentally contradict the core, though the *personalization* (named galleries) sits oddly with the idea of objects as universal heritage.
  *   **Underdetermined:**
      *   **Storage Extent:** The core theory *requires* preservation but doesn't specify *how much* or for *how long*. Does "perpetual" mean forever, or just until cultural priorities shift? (Practice assumes forever).
      *   **Access Level:** The core theory *allows* for storage but doesn't *require* minimal display. Current high display percentages are driven by justification needs, not the core theory itself.
      *   **Provenance Value:** The core theory *explains* why historical provenance adds intrinsic value. It doesn't *require* the specific market *magnification* often seen, which blends intrinsic historical value with market speculation.

  **What an Experience-Based Museum Would Do Differently:**

  If a museum truly adopted experiential value as foundational, its practices would fundamentally shift:

  1.  **Radical Deaccessioning:** Selling significant portions of the permanent collection to fund access, education, conservation of *displayed* works, community programs, and endowment would be standard practice, akin to library weeding. The Stedelijk Museum's (Amsterdam) recent moves are a tentative step.
  2.  **Dynamic Collections:** Collections would be smaller, more actively curated for display and engagement potential. Long-term storage would be minimized to only items with strong potential for future *experiential* use or irreplaceable research value.
  3.  **Conservation Priorities:** Conservation resources would focus overwhelmingly on items in active use or slated for imminent display. "Preservation for preservation's sake" of rarely seen objects would be deprioritized.
  4.  **Forgery Policy:** A discovered forgery might remain on display with a new label explaining its fascinating history as a forgery and the experience it provided, acknowledging the power of the *belief* in its authenticity. Its value would lie in its story and its demonstrated ability to move people.
  5.  **Provenance Transparency over Value Shift:** Provenance would be presented as interesting context, but wouldn't inherently inflate the object's institutional value compared to a visually identical piece with less glamorous history. Market value based on provenance would be irrelevant to the museum's internal valuation.
  6.  **Funding Justification Alignment:** Metrics would focus *directly* on depth and quality of experience (learning outcomes, emotional impact surveys, community co-creation projects) rather than just visitor numbers or the prestige of holdings. The collection would be seen as a *tool* for creating experiences, not the primary asset.
  7.  **Donor Recognition Nuance:** While still necessary, naming might focus more on *programs* or *access initiatives* rather than implying personal ownership of galleries/objects. Emphasis would be on funding experiences for all.

  **Conclusion:**

  The dominant museum model presupposes a **sacerdotal theory of intrinsic value and perpetual stewardship.** Objects are sacred relics; the museum is their temple and eternal guardian. Public access is a form of worship that justifies the temple's existence, but the relics' inherent sanctity demands preservation above all else, even unseen. This explains the taboo on selling, the horror of forgeries, and the logic of storage. While experience metrics and donor cultivation are essential practical tools for survival, they exist in tension with, and are ultimately subservient to, this core theology of the object. Truly embracing experiential value would require dismantling the priesthood of the permanent collection and transforming the museum into something fundamentally different: an engine for generating meaningful human encounters, using art as a powerful catalyst, but not its eternal, inalienable guardian. The resistance to this change highlights the depth of commitment to the implicit theory.
