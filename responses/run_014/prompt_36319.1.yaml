  We are drafting a document for two philosophers: a gap theorist (paracomplete, strongly Kleene) and a glut theorist (paraconsistent, dialetheic). Both agree on transparency and the failure of classical logic for the truth predicate, but they differ on how to handle the Liar.

  The document has four parts:
  1. Agreed claims (numbered section)
  2. Disagreements table
  3. Cruxes with shared test cases and predictions
  4. Closing section on verbal vs. substantive disputes

  We must mark settled vs. contested issues and avoid presenting contested views as consensus.

  Settled (by common acknowledgment):
  - Tarski's undefinability theorem: In classical logic, no consistent language can define its own truth predicate for all sentences.
  - The inconsistency of naive truth (transparency and classical logic) is a mathematical fact.
  - Fixed-point constructions (like Kripke's) show that one can have a language with a transparent truth predicate by using non-classical valuations (with gaps or gluts) to avoid triviality.

  Contested (to be marked as such):
  - Whether gaps or gluts are the right way to handle the Liar.
  - Coherence of dialetheism (glut theorist's view that some contradictions are true).
  - The revenge problem and whether it is fatal.
  - The viability of non-classical conditionals (especially for Curry's paradox).
  - The extent to which classical recapture is possible.

  Part 1: Agreed Claims

  We list the claims that both parties accept.

  1. The semantic paradoxes (especially the Liar) demonstrate that any language with a transparent truth predicate (i.e., one for which the T-schema holds: for every sentence φ, Tr(<φ>) is equivalent to φ) cannot be consistently closed under classical logic. This is a consequence of Tarski's undefinability theorem and the inconsistency of naive truth with classical logic.

  2. Both parties acknowledge that the classical logician has a point: without a non-classical logic, the only known ways to avoid the paradoxes are either to restrict the truth rules (e.g., by type distinctions) or to climb a hierarchy of languages (Tarski's hierarchy) or to give up transparency. Both parties reject these options because they hold transparency to be non-negotiable.

  3. A successful theory of truth must satisfy the following criteria (shared by both parties):
     a. Transparency: The truth predicate must be fully intersubstitutable with the object language (i.e., Tr(<φ>) and φ are interchangeable in all non-opaque contexts).
     b. Compositionality: The truth conditions of complex sentences should be determined by the truth conditions of their parts (though the exact compositional rules may differ between gap and glut theories).
     c. Non-triviality: The theory must not entail trivialism (that every sentence is true) or collapse into inconsistency that leads to trivialism by explosion (which the glut theorist blocks by having a paraconsistent logic).
     d. Account of classical recapture: The theory must explain why classical reasoning is so dependable for sentences that are paradox-free (i.e., those that are grounded in Kripke's sense).

  4. Both parties accept that Kripke's fixed-point construction (or a similar construction) provides a model for a language with a transparent truth predicate. In this construction, the Liar sentence is assigned a third value (a gap or a glut, depending on interpretation) and the logic is non-classical.

  5. Both parties agree that the Liar sentence is pathological and that it cannot be consistently assigned a classical truth value (just true or just false). They agree that it is a fixed point that is unstable under the valuation process.

  Part 2: Disagreements Table

  We present the remaining disagreements. Each view is stated in wording acceptable to the respective party.

  | Issue | Gap Theorist's View | Glut Theorist's View |
  |-------|---------------------|----------------------|
  | The nature of the Liar sentence | The Liar sentence lacks a truth value: it is neither true nor false. This is because the rules for assigning truth values do not determine a classical value for it, leaving it in a gap. | The Liar sentence has too many truth values: it is both true and false. This is because the rules for assigning truth values overdetermine it, resulting in a glut. |
  | The logic for truth | The correct logic is paracomplete (strongly Kleene). This means that the law of excluded middle may fail for some sentences (like the Liar), and that we must adjust our reasoning accordingly. | The correct logic is paraconsistent (LP, for "Logic of Paradox"). This means that some contradictions are true (like the Liar), but that not every sentence follows from a contradiction (explosion fails). |
  | The status of classical logic | Classical logic is a special case that holds for grounded (paradox-free) sentences. For these, the gap theorist recaptures classical reasoning by showing that in the absence of gaps, the logic behaves classically. | Classical logic is an approximation that works for consistent sentences. For these, the glut theorist recaptures classical reasoning by showing that in the absence of gluts, the logic behaves classically. |
  | The valuation of the Liar in the fixed point | In the fixed-point construction, the Liar is assigned the value "neither" (or "undefined"). This is a gap. | In the fixed-point construction, the Liar is assigned the value "both" (or "overdefined"). This is a glut. |

  Part 3: Cruxes

  Each crux is a point of divergence, and we provide a shared test case and each side's prediction.

  (a) The revenge problem

  Test case: Consider a revenge sentence, R, which says: "This sentence is not true in the sense of being definitely true (or not gappy)." In other words, R asserts that it is not true (in the gap theorist's sense of true, which excludes gaps) or that it is gappy. For the glut theorist, we can consider a similar revenge sentence that says: "This sentence is not true (in the sense of being only true, without being false)."

  Gap theorist's prediction: The gap theorist holds that their theory can handle revenge by extending the language with a "determinately" operator. They predict that R will also be gappy (or that a hierarchy of such operators is needed, but that it does not collapse to classical logic and does not require a Tarskian hierarchy). They might argue that the revenge sentence R is also gappy and that this is consistent.

  Glut theorist's prediction: The glut theorist holds that the revenge sentence R is a dialetheia (both true and false) and that their logic can handle it without collapse. They predict that R will be both true and false (a glut) and that this does not lead to triviality because of their paraconsistent logic.

  (b) Curry's paradox

  Test case: Consider a Curry sentence, C, which says: "If this sentence is true, then the butler did it." (We assume the butler did not do it.)

  Gap theorist's treatment: The gap theorist uses a non-classical conditional (e.g., in strong Kleene logic, the conditional is defined so that if the antecedent is gappy, the whole conditional might be true, false, or gappy). They hold that C is gappy because the antecedent is gappy, so the conditional does not force the butler to have done it. Thus, they avoid the paradox by having the Curry sentence not being true.

  Glut theorist's treatment: The glut theorist uses a paraconsistent conditional (e.g., in LP, the conditional is defined differently, often as in the material conditional). They might hold that C is both true and false. However, they must avoid the triviality that would follow from accepting C as true (which would entail the butler did it). They might use a different conditional (such as a relevant conditional) to block the inference. Alternatively, in LP, the material conditional (defined as ~A ∨ B) might lead to the Curry sentence being both true and false, but then the modus ponens rule is not valid in LP for the material conditional, so the inference is blocked.

  Prediction on damage: The gap theorist argues that the glut theorist's conditional is too weak for ordinary reasoning (e.g., it invalidates modus ponens in some cases). The glut theorist argues that the gap theorist's conditional is also non-classical and that their own conditional (if they use a relevant one) is more suitable.

  (c) Classical recapture

  Test case: Consider a mathematical proof by reductio ad absurdum in a context without any semantic paradoxes (e.g., a proof in number theory).

  Gap theorist's explanation: The gap theorist explains that in grounded sentences (those that do not involve semantic paradoxes), there are no gaps. Therefore, for these sentences, the law of excluded middle holds and classical reasoning (including reductio and disjunctive syllogism) is fully reliable.

  Glut theorist's explanation: The glut theorist explains that in consistent sentences (those that are not both true and false), there are no gluts. Therefore, for these sentences, classical reasoning (including reductio and disjunctive syllogism) is reliable because the paraconsistent logic collapses to classical logic in consistent contexts.

  (d) Iterating "determinately" or "is true"

  Test case: Consider a sequence of operators: D0: "true", D1: "determinately true", D2: "determinately determinately true", etc., applied to the Liar sentence.

  Gap theorist's prediction: The gap theorist may hold that each iteration produces a gap (so that Dn(Liar) is gappy for every n). They might also introduce a hierarchy of determinateness operators, but they maintain that this does not collapse to a Tarskian hierarchy because the language remains one and the same, and the operators are definable within it.

  Glut theorist's prediction: The glut theorist holds that the Liar sentence is both true and false, and that applying "determinately" (which they might interpret as "only true") will also lead to a sentence that is both true and false (if the operator is defined appropriately). They reject the need for a hierarchy and maintain that the language is universal.

  Both sides agree that iterating such operators does not force them into a Tarskian hierarchy because they are defined internally and the language remains unified.

  Part 4: Closing Section on Verbal vs. Substantive Disputes

  The two parties jointly state:

  We agree that a significant part of our dispute is verbal. In particular, we both rely on the same fixed-point structure (such as Kripke's). We assign different labels to the value of the Liar: one calls it a gap (neither true nor false) and the other calls it a glut (both true and false). This difference in labeling does not affect the underlying mathematics. Moreover, both logics (strong Kleene and LP) are three-valued and share the same truth tables for conjunction and disjunction (min and max, respectively). The difference lies only in the designated values: for the gap theorist, only truth is designated (so a valid argument preserves truth from premises that are just true); for the glut theorist, truth and both are designated (so a valid argument preserves truth from premises that are at least true, even if they are also false). This difference in designation accounts for the different logical consequences.

  However, we also have substantive differences. The gap theorist holds that the pathological status of the Liar is properly understood as a failure of truth-value assignment (a gap), and that this requires a paracomplete logic in which we cannot always assert excluded middle. The glut theorist holds that the pathological status is a truth-value glut, and that this requires a paraconsistent logic that tolerates some contradictions. These differences lead to distinct approaches to the conditional (as seen in Curry's paradox) and to different ways of handling revenge. Moreover, the gap theorist is committed to the view that the Liar is not true (in the sense of being definitely true) and the glut theorist is committed to the view that it is true (as well as false). This difference is not merely verbal because it affects what we are committed to asserting about the Liar.

  Furthermore, the two positions have different costs: the gap theorist must explain why we are not entitled to assert excluded middle in all cases, and the glut theorist must explain why we do not have to accept all contradictions. These explanations are substantive and not merely verbal.

  Finally, we agree that the question of whether dialetheism is coherent (i.e., whether it makes sense to assert that a contradiction is true) is a substantive philosophical issue that goes beyond the formal system. Similarly, the gap theorist's view that we can meaningfully have truth-value gaps is also a substantive philosophical commitment.

  Thus, while we share a common formal framework, our interpretations of that framework and the philosophical commitments we draw from it are genuinely different.

  ---

  This document is now drafted. It remains for both parties to sign.
answer: |-
  ### Collaborative Document: Gap and Glut Theories of Truth

  #### 1. Agreed Claims  
  Both parties endorse the following as settled mathematics or shared commitments:  

  1.1 **Semantic Paradoxes and Undefinability**:  
  - Tarski’s undefinability theorem demonstrates that no consistent, classical language can contain its own transparent truth predicate (i.e., full intersubstitutability of \( \text{Tr}(\langle \phi \rangle) \) and \( \phi \) without restriction).  
  - The inconsistency of naïve truth (transparency + compositionality + classical logic) is mathematically proven: Liar-like sentences induce triviality if classical logic is applied universally.  

  1.2 **Debt to Classical Logicians**:  
  - Classical logic is maximally reliable for "paradox-free" domains (e.g., arithmetic, empirical statements without self-reference). Both theories must non-trivially recover classical reasoning in these domains (classical recapture).  
  - Tarski’s hierarchy and truth-restriction approaches are viable alternatives that avoid paradox, but both parties reject them for sacrificing transparency or universality.  

  1.3 **Criteria for Success**: A theory of truth must satisfy:  
  - **Transparency**: Truth is fully intersubstitutable (e.g., \( \phi \) and \( \text{Tr}(\langle \phi \rangle) \) are equivalent in all contexts).  
  - **Compositionality**: Truth values of compounds depend functionally on the values of parts (e.g., conjunction, negation).  
  - **Non-Triviality**: The theory avoids ex falso quodlibet (explosion) for pathological sentences, preserving consistency for non-semantic domains.  
  - **Classical Recapture**: Explains why classical patterns (e.g., excluded middle, reductio) succeed in grounded/paradox-free fragments.  
  - **Fixed-Point Foundation**: Kripke-style fixed-point constructions (using three-valued logics) provide a model-theoretic basis for both theories. Pathological sentences (e.g., Liar) are "fixed points" assigned a non-classical value.  

  #### 2. Disagreements Table  
  Remaining divergences, stated neutrally:  

  | Issue | Gap Theorist’s View (Acceptable Wording) | Glut Theorist’s View (Acceptable Wording) |
  |-------|------------------------------------------|-------------------------------------------|
  | **Liar’s Status** | "The Liar sentence lacks a truth value: it is neither true nor false, as no consistent assignment satisfies the truth rules." | "The Liar sentence has multiple truth values: it is both true and false, as the truth rules overdetermine its value." |
  | **Logic** | "The logic is paracomplete (strong Kleene): excluded middle fails for pathological sentences, and gaps prevent explosion." | "The logic is paraconsistent (LP): some contradictions are true, but explosion is restricted to preserve non-triviality." |
  | **Pathology Interpretation** | "Gaps reflect indeterminacy: the Liar’s failure to stabilize under evaluation shows it is truth-valueless." | "Gluts reflect overdetermination: the Liar’s unstable evaluation shows it embodies a true contradiction." |
  | **Designated Values** | "Only ‘true’ is designated for validity; gappy premises cannot entail conclusions." | "Both ‘true’ and ‘both’ are designated; truth-entailment holds even for glutty premises." |

  #### 3. Cruxes with Test Cases and Predictions  
  Each crux includes a shared test case and advance predictions.  

  **(a) Revenge Problem**  
  - **Test Case**: The sentence \( R \): “This sentence is not true or is gappy” (for gaps) / “This sentence is not [solely] true” (for gluts).  
  - **Gap Prediction**: \( R \) remains gappy. Gaps are closed under their own characterization; revenge is inert.  
  - **Glut Prediction**: \( R \) is both true and false. Revenge sentences are new dialetheias, handled without hierarchy.  
  - **Settled**: Fixed-point models accommodate such sentences.  
  - **Contested**: Whether this stabilizes (gap) or proliferates dialetheia (glut).  

  **(b) Curry’s Paradox**  
  - **Test Case**: \( C \): “If this sentence is true, then \( 0 = 1 \).”  
  - **Gap Treatment**: \( C \) is gappy. Strong Kleene invalidates contraction, blocking entailment of \( 0 = 1 \).  
  - **Glut Treatment**: \( C \) is both true and false. LP uses a material conditional (\( \neg C \lor \bot \)), and modus ponens fails for gluts.  
  - **Damage Assessment**:  
    - Gap: Glut’s conditional is “too weak” for mathematics.  
    - Glut: Gap’s conditional is “non-compositional” for entailments.  
  - **Contested**: Viability of non-classical conditionals in mathematics.  

  **(c) Classical Recapture**  
  - **Test Case**: A reductio proof in number theory (e.g., “\( \sqrt{2} \) is irrational”).  
  - **Gap Explanation**: Excluded middle holds for grounded sentences; gaps only arise in ungrounded cases. Reductio is reliable when no pathology is present.  
  - **Glut Explanation**: Disjunctive syllogism and reductio hold in consistent fragments; gluts are confined to semantics. Mathematics is glut-free.  
  - **Settled**: Both logics reduce to classical for bivalent sentences.  
  - **Contested**: Scope of “groundedness” vs. “consistency.”  

  **(d) Iterating ‘Determinately’ or ‘True’**  
  - **Test Case**: The hierarchy \( D_0(\text{Liar}) = \text{‘true’} \), \( D_{n+1}(\text{Liar}) = \text{‘}D_n\text{ is true’} \).  
  - **Gap Prediction**: Each \( D_n(\text{Liar}) \) is gappy. No hierarchy emerges; determinacy operators are internal.  
  - **Glut Prediction**: Each \( D_n(\text{Liar}) \) is both true and false. Iteration folds back into dialetheia.  
  - **Settled**: Fixed points tolerate such operators without Tarskian stratification.  
  - **Contested**: Whether this amounts to hidden hierarchy.  

  #### 4. Verbal vs. Substantive Disputes (Joint Statement)  
  We jointly concede the following as **verbal differences**:  
  - The fixed-point structure (e.g., Kripke’s construction) is shared. Assigning “gap” or “glut” to the same value (e.g., # in strong Kleene, *both* in LP) is terminological.  
  - Both logics use identical truth tables for \( \land \), \( \lor \), and \( \neg \); divergences arise only in entailment (designated values) and conditionals.  
  - Descriptions of the Liar as “indeterminate” vs. “overdetermined” reflect perspectives on the same mathematical object.  

  We maintain the following as **substantive differences**:  
  - **Coherence of Contradictions**: Whether true contradictions (glut) are intelligible or gaps are metaphysically warranted.  
  - **Conditional and Recapture**: Whether strong Kleene or LP offers a more serviceable conditional for mathematics and science.  
  - **Revenge Tolerance**: Whether gap avoidance or glut accommodation better handles extended paradoxes without collapse.  
  - **Epistemic Norms**: Gaps demand agnosticism toward the Liar; gluts permit (non-explosive) assertion of its truth.  

  ---  
  **Signed**,  
  The Gap Theorist  
  The Glut Theorist  

  ---  
  **Annotation Key**:  
  - ✅ **Settled**: Shared theorems or models (e.g., fixed points, undefinability).  
  - ⚠️ **Contested**: Specialist disagreements (e.g., dialetheism’s coherence, revenge severity).  
  - _Neutral Wording_: Claims phrased so neither party is misrepresented (per collaboration terms).
