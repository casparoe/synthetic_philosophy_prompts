  Okay, the user is a professor teaching an ethics of war seminar, and they're frustrated with the same recurring problem every year: the moral equality of combatants debate. They want a clear list of desiderata—requirements that any adequate theory of killing in war must satisfy. They've provided some specific points they want addressed, like the conscripted teenager, the civilian machinist, irregular fighters, consistency with individual self-defense, and the epistemic limitations of soldiers. They also want me to identify any conflicting desiderata and highlight which requirement is most challenging for existing theories.

  First, I need to outline the key desiderata. The user mentioned several cases, so each desideratum should stem from a concrete scenario. Let's list them:

  1. **Conscripted Teenager**: Avoid absolutes—neither labeling them as murderers nor treating war as morally neutral. This requires a middle ground that acknowledges their reduced responsibility without excusing participation in unjust wars.

  2. **Civilian Machinist**: Addresss civilians contributing to war efforts without erasing the combatant/civilian distinction. The case challenges theories that rely solely on direct participation, as making fuses is indirect but crucial. The desideratum here is to handle complicity without making all contributors targetable.

  3. **Irregular Fighters (Partisans)**: Theories must account for fighters without uniforms, who blend with civilians. This tests the traditional requirement of distinction. The desideratum is to maintain ethical principles even when formal criteria like uniforms are absent.

  4. **Consistency with Individual Self-Defense**: War ethics shouldn't wildly diverge from peacetime self-defense without clear justification. The case of a homeowner vs. an aggressor shows potential conflict with symmetrical combatant permissions in war. This desideratum demands alignment or an explanation for divergence.

  5. **Soldiers' Epistemic Limitations**: Most soldiers can't know if their side is just. A theory mustn't require knowledge they can't possess. The desideratum ensures that moral assessments are feasible under real-world ignorance.

  Now, considering potential conflicts. The user suspects that desideratum 4 (self-defense consistency) and desideratum 1's permission for symmetrical killing might clash. In individual self-defense, you can't kill someone who isn't a threat, but in war, combatants on both sides are allowed to kill each other regardless of the war's justice. If we apply individual self-defense strictly, soldiers on the unjust side may not have the right to kill, but desideratum 5 says they can't know their side is unjust. So there's tension between holding soldiers responsible for their role and acknowledging their ignorance. McMahan's revisionism struggles here because it makes moral permissibility depend on the war's justice, which soldiers can't reliably know. Traditional equality avoids this by treating all combatants equally, but then conflicts with self-defense principles.

  The most disruptive requirement is likely desideratum 5 (epistemic limitation). It challenges both traditionalism and revisionism. Traditionalism assumes moral equality without addressing individual responsibility, which revisionism highlights. But revisionism requires knowing the war's justice, which is impractical. Conventionalist approaches might work around this by focusing on rules, but they need to explain why those rules override deeper moral principles.

  Pairs that might be unsatisfiable:
  - Desideratum 4 (self-defense consistency) and desideratum 1 (symmetrical permissions). If we insist that killing must align with individual self-defense, then soldiers on the unjust side cannot permissibly kill just combatants. But desideratum 1 requires a verdict that doesn't condemn the conscripted teenager as a murderer, and desideratum 5 says they can't know their side is unjust. So allowing symmetrical killing contradicts self-defense principles. Any theory satisfying 4 might not permit symmetrical killing, but 1 and 5 push for it. This seems unresolvable without compromising one or the other.

  The user's hunch about the conflict between self-defense consistency and symmetrical permissions is spot on. It's the core tension. Desideratum 5 (epistemic limitation) is the key disruptor because it forces theories to accommodate uncertainty, which neither traditionalism nor revisionism handles perfectly. Traditionalism ignores the deeper morality, while revisionism imposes unrealistic epistemic demands. Conventionalism might mediate by adopting rules that respect epistemic limits, but then has to justify why those rules are morally binding despite conflicting with individual self-defense in some cases.
answer: |-
  **Bottom line:** The epistemic limitation requirement (soldiers' inability to know their war's justice) most disrupts existing theories, while the joint demand for consistency with individual self-defense and symmetrical combatant permissions is unsatisfiable.  

  ### Desiderata for an Adequate Theory (with Grounding Cases)  
  1. **Mitigated Responsibility for Conscripted Combatants**  
     *Case:* A conscripted 18-year-old on the unjust side shoots at advancing enemy soldiers.  
     *Requirement:* Must avoid absolutes: not conflating participation with murder, nor treating war as a morally neutral game. Grounded in the recognition of coercion, lack of alternatives, and social conditioning—denying this ignores moral psychology and risks inhuman rigor.  

  2. **Non-Binary Complicity for Contributing Civilians**  
     *Case:* A civilian machinist in a just society produces artillery fuses essential for military operations.  
     *Requirement:* Must not reduce liability to combatant status alone, nor collapse into making all contributors targetable. Grounded in the reality of modern war economies: if the combatant/civilian distinction does "all the work," it excuses systemic complicity or over-targets essential workers.  

  3. **Legitimacy Without Uniforms (Irregular Fighters)**  
     *Case:* Partisans resisting an unjust occupation wear civilian attire and ambush invading forces.  
     *Requirement:* Must address liability without relying on formal distinctions like uniforms. Grounded in historical and contemporary conflicts (e.g., resistance movements): if uniforms are necessary for legitimacy, it unjustly privileges state militaries and ignores morally justified irregulars.  

  4. **Consistency with Peacetime Self-Defense or Justified Divergence**  
     *Case:* An aggressor breaks into a homeowner's house; the homeowner kills them in defense. In war, two soldiers from opposing sides (one just, one unjust) kill each other in a firefight.  
     *Requirement:* Must align with individual self-defense ethics (e.g., necessity, proportionality, liability) or explain why war creates unique moral permissions. Grounded in the need for moral coherence: if war ethics diverges radically without justification, it implies a dangerous moral exceptionalism.  

  5. **Epistemic Constraints on Soldier Liability**  
     *Case:* A soldier on the unjust side believes their government’s propaganda and cannot reasonably access evidence of their war’s injustice.  
     *Requirement:* Must not make permissibility depend on unknowable facts (e.g., the macro-level justice of the war). Grounded in the fog of war and institutional deception: holding soldiers culpable for unattainable knowledge is practically absurd and ethically unfair.  

  ### Unsatisfiable Pair  
  - **Consistency with peacetime self-defense (4)** and **symmetrical permissions in combat (implied by 1)** cannot both hold.  
    *Why:* Peacetime self-defense requires that only unjust aggressors are liable to defensive harm. If applied strictly, a soldier on the unjust side is an aggressor and thus not permitted to kill just combatants—contradicting the intuition that conscripted combatants (per 1) aren’t murderers and may permissibly defend themselves in symmetrical engagements. Yet granting symmetrical permissions (as traditionalism does) violates self-defense principles by allowing unjust combatants to kill those who retain a right of self-defense. Epistemic constraints (5) exacerbate this: even if the unjust soldier *could* know their war is unjust, they often don’t, making liability assessments incoherent.  

  ### Most Disruptive Requirement  
  - **Epistemic limitation (5)** does the most damage:  
    - **To McMahan-style revisionism:** Directly undermines its core claim that combatant liability hinges on the objective justice of their cause. If soldiers cannot know this, revisionism demands the impossible, collapsing into moral luck or impracticality.  
    - **To traditionalism:** Exposes its evasion of deeper moral responsibility—insisting on moral equality without addressing epistemic limits appears willfully ignorant.  
    - **To conventionalism/contractualism:** Forces a choice: either rules must override individual liability (risking injustice) or admit rules are merely pragmatic (weakening their normative force).
