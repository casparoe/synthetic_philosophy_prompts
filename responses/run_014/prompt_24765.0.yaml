answer: |-
  Below is a decision-tree handout designed for your reading group, structured to navigate key distinctions in causal theories without assuming prior philosophical knowledge. It starts from the core idea of "A made a difference to B" and branches through diagnostic cases. Each branch node is a concrete question answerable with intuition or scientific reasoning. The tree identifies 8 positions (including "unoccupied" or "no single theory") and flags limitations.

  ---

  ### **Decision Tree: What Theory of Causation Fits Your View?**  
  *Start here:* You want to say **A** (a specific event/variable) made a difference to **B** (another event/variable).  

  #### **Q1: Preemption**  
  *Scenario: A caused B, but a backup process (C) would have caused B if A had failed. Did A cause B?*  
  - **Yes** (A still matters despite backup) → Q2  
  - **No** (A is irrelevant if backup exists) → **L1: Unoccupied**  
    *Why?* No major theory denies preempting causes (e.g., throwing a rock that breaks a window first, even if a backup thrower existed).  

  #### **Q2: Overdetermination**  
  *Scenario: A and C both occur; either alone could cause B. Did A cause B?*  
  - **Yes** (A is a cause, even with redundant factors) → Q3  
  - **No** (A isn’t a cause if B would’ve happened anyway) → Q4  

  #### **Q3: Omissions**  
  *Can the absence of an event (e.g., not watering a plant) cause an effect (e.g., the plant dying)?*  
  - **Yes** (absences can be causes) → Q5  
  - **No** (causes require active events) → **L2: Process Theory**  
    *Position:* Physical processes (e.g., energy transfer) are essential. Absences lack physicality, and overdetermination is accepted (e.g., two bullets hitting simultaneously both cause death).  

  #### **Q4: Omissions**  
  *Can absences be causes?*  
  - **Yes** (e.g., not watering causes death) → Q6  
  - **No** → **L3: Unoccupied**  
    *Why?* No theory combines overdetermination-denial with omission-denial. Process theories deny omissions but accept overdetermination (Q3→No).  

  #### **Q5: Probabilistic Causes**  
  *Can A cause B if A only raised B’s probability (e.g., smoking increases cancer risk, but not all smokers get cancer)?*  
  - **Yes** (probability-raising suffices) → **L4: Probabilistic Causation**  
    *Position:* Causation is inherently stochastic (e.g., epidemiology). Accepts omissions, overdetermination, and preemption.  
  - **No** (causes must guarantee effects) → Q7  

  #### **Q6: Intervention Modality**  
  *To test if A causes B, must interventions on A be physically possible (e.g., lab experiments), or is counterfactual imagination sufficient?*  
  - **Physically possible** → **L5: Interventionist**  
    *Position:* Causation requires testable interventions (e.g., Woodward). Rejects overdetermination (Q2→No) but accepts omissions.  
  - **Counterfactual sufficient** → **L6: Lewis-Style Counterfactual**  
    *Position:* Causation is counterfactual dependence (e.g., "if A hadn’t happened, B wouldn’t have"). Rejects overdetermination (Q2→No) but accepts omissions.  

  #### **Q7: Causal Level**  
  *Is your focus general types (e.g., "smoking causes cancer") or specific tokens (e.g., "this smoking caused this cancer")?*  
  - **General types** → **L7: Regularity Theory**  
    *Position:* Causation is constant conjunction (e.g., Hume). Deterministic, accepts omissions/overdetermination, but ignores preemption nuances.  
  - **Specific tokens** → **L8: No Single Theory**  
    *Position:* Token-level deterministic causation with omissions/overdetermination is undersupported (e.g., no theory handles all three).  

  ---

  ### **Key Notes on the Tree**  
  1. **Unoccupied Branches** (L1, L3, L8):  
     - L1/L3: No theories reject preemption or pair overdetermination-denial with omission-denial.  
     - L8: Token-level deterministic views accepting omissions/overdetermination lack a unified theory.  

  2. **Indistinguishable Leaves** (Flags):  
     - **Interventionist (L5) vs. Lewis-Style (L6)** are only separated by intervention modality (Q6). Both reject overdetermination and accept omissions.  
     - **Probabilistic (L4) vs. Others**: L4 is unique in accepting probability without guarantees.  

  3. **Missing Elements**:  
     - *Masking/Prevention* (e.g., A would fail if M were present, but M was absent) is covered: all "Yes" to preemption (Q1) imply A causes B in masking cases.  
     - *Transitivity* (if A→B and B→C, must A→C?) is not a branch; most theories reject it (e.g., A=birthday, B=anniversary, C=death; A→B→C but A doesn’t cause C).  

  4. **Theories Not Explicitly Branched**:  
     - *Difference-Making* is a theme across leaves (especially L4–L6).  
     - *Process Theory* (L2) is the only leaf rejecting omissions.  

  ---

  ### **Tree Summary**  
  - **8 Branch Nodes**: Q1–Q7 (with Q5–Q7 nested).  
  - **8 Leaves**: 6 named positions + 2 unoccupied/no single theory.  
  - **Paths Cover**: Preemption, overdetermination, omissions, probabilistic causes, token/type-level, intervention modality.  

  Use this tree to stimulate debate. Where your group’s answers land will highlight philosophical alignments—and where theories struggle!
