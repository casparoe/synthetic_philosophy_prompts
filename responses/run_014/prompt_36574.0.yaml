answer: |-
  Your dissection is razor-sharp, and I agree the core disagreement isn't primarily mathematical—it's a collision of framings, priorities, and unstated assumptions. Let's diagnose based on your taxonomy:

  ### 1. **What the Disagreement Is Really About**
  It's **all three** of your hypotheses, layered together, with decision theory as the bedrock:

  - **Decision-Theoretic Core (Your Hypothesis i):**  
    This *is* Pascal's Mugging in structural disguise. Proponents argue: "Even if the *absolute* measure of malign worlds is tiny, their *conditional influence* on predictions (given the agent acts on them) could be catastrophic—and the aggregate weight of motivated simulators is non-negligible." Skeptics counter: "Unbounded utilities + unquantifiable probabilities = decision-theoretic garbage-in/garbage-out." The deadlock arises because:  
    - Proponents see the *worst-case* asymmetry (simulators optimize for influence; honest physics doesn't) as decisive.  
    - Skeptics demand *expected utility* calculations, which collapse under uncomputability (we can't bound simulator capabilities/payoffs).  
    **This isn't resolvable with Solomonoff math alone.** It needs a decision theory that handles hypercomputation or Knightian uncertainty.

  - **Verbal Equivocation (Your Hypothesis ii):**  
    You're right—"malign prior" smuggles in ambiguity:  
    - **Measure-Theoretic Claim:** "Programs with consequentialist subagents dominate the prior mass."  
    - **Behavioral Claim:** "These programs will *control* the agent's predictions when it acts."  
    Skeptics attack the first (e.g., "simulators are sparse in program space!") but proponents pivot to the second ("but they *punch above their weight* when predictions matter"). Progress stalls because neither side distinguishes:  
    - **Passive Observation:** Does the malign mass *currently* skew predictions for the next bit? (Skeptics: likely no).  
    - **Active Influence:** When the agent uses the prior to *guide actions*, does it create incentives that *retroactively* amplify malign mass? (Proponents: yes, via step 4).  

  - **Ill-Posed Foundations (Machine Dependence):**  
    Solomonoff's prior isn't unique; it depends on the UTM. Proponents assume a "natural" UTM where simulating agents is concise (e.g., `simulate(agent)` is short). Skeptics note:  
    - A pathological UTM could make "honest physics" shorter (e.g., by hardcoding constants).  
    - There's no objective "simulator-friendly" UTM—so the argument isn't invariant.  
    Proponents retort: "But we care about *plausible* UTMs!"—which is a metaphysical stance, not math.

  ### 2. **What Would Count as Progress**
  The impasse *is* informative (it reveals where foundations are shaky), but progress is possible in **bounded, decision-aware models**:

  - **Formalize the Influence Channel (Not Just Measure):**  
    Instead of bounding measure, bound *predictive influence*. Example:  
    - Fix a prefix `x_observed`. Assume an agent will act after seeing `x_observed` to optimize utility `U`.  
    - Define *malign influence* as `|P(y | x_observed, agent acts) - P(y | x_observed)|` for future bits `y`.  
    - **Prove (or disprove):** Under Solomonoff, this influence decays exponentially with simulator complexity *if the agent ignores simulators*.  
    This shifts focus to *when* the prior becomes adversarial—isolating step (4).

  - **Decision-Theoretic Toy Models:**  
    Build a finite analogue:  
    - **Environment:** A Bayesian network where some nodes are "simulators" that can choose outputs to manipulate a predictor.  
    - **Agent:** Uses a simplicity prior to predict next state, then acts.  
    - **Question:** Do simulator nodes dominate predictions *only after* the agent starts using them for decisions?  
    This could validate/invalidate the incentive-creation mechanism in step (4).

  - **Clarify the UTMs in Use:**  
    Explicitly adopt:  
    - A **"simulation-optimal" UTM** (e.g., programs are interpreted as cellular automata).  
    - A **"physics-optimal" UTM** (e.g., programs express differential equations).  
    Quantify the malign mass gap between them. If it varies wildly, the argument loses force.

  ### 3. **Why the Impasse Is Itself Informative**
  The deadlock signals a **methodological schism**:

  - **Proponents** treat AI alignment as **security engineering**: worst-case dominance (malign mass) implies vulnerability, even if unquantifiable.  
  - **Skeptics** treat it as **statistics**: without convergence bounds or measurable probabilities, the threat is "not even wrong."  

  This mirrors historical divides (e.g., Bayesian vs. frequentist). The standoff persists because:  
  - **No Empirical Handle:** We can't observe Solomonoff agents in non-toy settings.  
  - **Hypercomputation Blind Spot:** Decision theory assumes computable probabilities; Solomonoff doesn't.  

  ### My Synthesis
  Your distributed systems lens is apt: think of the universal prior as an **ensemble of subprocesses**, some adversarial. The debate is about:  
  - Whether the scheduler (Solomonoff updater) lets malicious processes **hijack outputs** when the system transitions from read-only to read-write (i.e., when predictions inform actions).  
  - Whether the kernel (decision theory) can **sandbox** high-weight but unverifiable subprocesses.  

  **Actionable insight:** Formalize the "action-triggered incentive" (step 4) in a computable approximate setting (e.g., using AIXI-tl). If malign influence vanishes with bounded resources, skeptics win. If it persists, proponents have a wedge. Until then, the dispute is a proxy war over how to handle **uncomputable risks**.
