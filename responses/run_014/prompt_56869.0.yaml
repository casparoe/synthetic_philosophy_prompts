prompt: |-
  I don't have any philosophy training — business degree, and now I run the people-and-ops side of a fully remote company of about 300 — but I've been reading around this stuff on my own for a couple of months because we're about to try to kill a norm I hate. On a flight last week I got through a chapter of one of those pop social-science books a behavioural economist writes, and it spent several pages on a philosopher named David Lewis and his 1969 book *Convention*. I copied down the part that mattered, roughly word for word from my notes:

  "A convention is a stable regularity in how a group behaves that everyone in the group would be better off keeping — driving on the same side of the road, shaking with the right hand, saying your name when you answer the phone. Lewis gave a short list of conditions for when a regularity counts as one: everyone does it, everyone expects everyone else to do it, everyone wants everyone else to do it, and everyone knows all of this and knows that everyone knows it. That last layer is called common knowledge and it's the whole engine of the theory. The other big idea is that conventions are arbitrary — left is as good as right — so there's no principled way to choose between them; whichever one gets going first wins, and after that nobody has any reason to change. Lewis was arguing against people who thought rules had to come from an agreement: he showed that a convention is really just a tacit agreement that's been around so long everyone forgot it was ever made. And because common knowledge does all the work, the practical payoff is enormous — a public announcement from someone credible literally manufactures common knowledge, and a convention along with it. That's also why norms evolve: people copy whoever seems to be doing well. So you change a culture by changing what gets announced, not by training people or appealing to their values."

  Some of that felt too smooth, but I can't tell which parts. My sister, who's a lawyer, said "an email doesn't make a norm, that's ridiculous," but she couldn't say why, and I half want the chapter to be right because it would make my job easy. So: can you go through that passage claim by claim and tell me what someone who actually works on Lewis would accept, what's a fair simplification for a general reader, what's subtly off, and what's just wrong? I'm especially suspicious of four spots — the "tacit agreement everyone forgot" line, the slide from "arbitrary" to "nobody has any reason to change," the idea that an announcement manufactures a convention, and the copying-whoever's-winning bit, which I suspect belongs to a different tradition of thinking about norms entirely and got stapled onto Lewis. I'd also like to know whether the conditions he actually gave are the ones the book lists, since I get the feeling "everyone wants everyone else to do it" is doing a lot of dishonest work. Then tell me whether the practical upshot survives the correction, and run the corrected version on our case: when a customer escalation lands in our shared channel, whoever sees it first quietly tags the most junior support person on shift, and it's now simply expected — the juniors resent it, the seniors don't notice it's happening, and nobody ever decided it. Leadership plans to announce on Monday that escalations belong to the senior on call that week, and they think the announcement plus everyone knowing everyone heard it is the whole job. Does Lewis's framework, properly understood, say that will take? If not, what has to be true for it to take, and is our thing even a Lewis-style convention at all given that some people clearly lose out under the current arrangement? No reading list, please — I can't chase down sources, I just want the audit and what to actually do.
reasoning: |-
  Okay, let me tackle this query methodically. The user runs operations for a 300-person remote company and wants to overhaul a problematic norm using David Lewis's convention theory. They've encountered a simplified version in a pop-science book and need help separating Lewis's actual ideas from potential misinterpretations.

  First, I need to verify the four conditions listed in the passage against Lewis's original work. The book's phrasing "everyone wants everyone else to do it" seems problematic - Lewis actually emphasizes mutual benefit rather than universal desire. This distinction matters because in the user's case, juniors clearly don't want the current norm. 

  The "tacit agreement" simplification is misleading. Lewis explicitly argued against conventions requiring explicit agreement - they emerge through coordination, not forgotten promises. The arbitrariness claim also needs nuance: while many conventions are arbitrary (like driving sides), some have inherent differences (like the user's junior/senior support case).

  On common knowledge: yes, Lewis considered it crucial, but announcements alone can't instantly create conventions. They only work when the new behavior solves a coordination problem better than alternatives. The "copying successful people" idea actually comes from evolutionary game theory, not Lewis.

  For the user's specific problem: their current practice seems unstable since it violates Lewis's mutual benefit condition. The planned announcement might help if:
  1) The new system clearly improves coordination 
  2) People trust leadership's credibility 
  3) There's visible early adoption by key figures 
  But it won't stick automatically because the status quo still "works" for seniors. They'll need to actively reinforce the new norm through consistent processes and address junior resentment.

  The core practical insight survives correction: common knowledge matters, but must be paired with actual coordination benefits. For Monday's announcement, I should emphasize making the new system beneficial for all parties and ensuring leaders model the change consistently.
answer: |-
  Here's a systematic audit of the passage, corrected Lewis framework, and actionable advice for your norm change:

  **Audit of the Passage (Claim by Claim):**

  1.  **"A convention is a stable regularity in behavior... everyone better off keeping"**
      *   **Lewis Accepts:** Core definition. Conventions solve coordination problems where mutual conformity benefits all (e.g., driving sides).
      *   **Simplification:** Fair, but "better off" needs nuance. It means *coordination* is better than chaos; the *specific* convention might not be optimal for all, just stable.
      *   **Subtly Off:** "Better off" implies Pareto improvement. Lewis focuses on *coordination gain* over non-coordination. Some individuals might personally prefer a different convention but still gain from *having one*.

  2.  **Conditions: Everyone does it, expects others to do it, wants others to do it, common knowledge.**
      *   **Lewis Accepts:** This is a *rough* simplification of Lewis's conditions (Preferences, Beliefs, Common Knowledge).
      *   **Subtly Off/Wrong:** The critical flaw is **"everyone *wants* everyone else to do it."** Lewis is more precise: individuals have a *preference to conform* conditional on *believing others will conform*. It's not necessarily a desire for the *specific* action universally, but a desire to *match* the expected behavior to achieve coordination. This distinction is crucial for your case.
      *   **Common Knowledge:** Correct. This *is* the engine - the recursive "I know, you know I know, I know you know I know..." state.

  3.  **"Conventions are arbitrary... no principled way to choose... whichever gets going first wins... nobody has any reason to change."**
      *   **Lewis Accepts:** Arbitrariness is key (left vs. right driving). Path dependence ("first wins") is central.
      *   **Subtly Off:** The slide to "nobody has any reason to change" is **overstated and dangerous**. Reasons *can* exist:
          *   *Inefficiency:* The convention might be sub-optimal (e.g., QWERTY vs. Dvorak).
          *   *Fairness:* The distribution of benefits/costs might be uneven (like *your* junior-tagging norm).
          *   *External Shocks:* Technology, environment, or values change.
      *   **Correction:** People *do* have reasons *not* to unilaterally change (they'd lose coordination), but groups can have collective reasons to *shift* conventions if a better alternative emerges and common knowledge of it forms.

  4.  **"Tacit agreement everyone forgot... conventions come from coordination, not agreement."**
      *   **Lewis Accepts:** Lewis **explicitly argues *against*** conventions requiring explicit agreement. They emerge from repeated coordination problems and precedent.
      *   **Wrong:** The "tacit agreement everyone forgot" line **misrepresents Lewis entirely**. He rejects the need for *any* agreement, tacit or explicit. Conventions are patterns of mutually reinforcing expectations and behaviors, *not* forgotten promises.

  5.  **"Public announcement manufactures common knowledge, and a convention along with it."**
      *   **Lewis Accepts:** A credible public announcement *can* create common knowledge *of the announcement itself* (everyone heard it, everyone knows everyone heard it, etc.).
      *   **Subtly Off/Wrong:** It **does not** automatically manufacture the *convention*. The convention requires: a) The new behavior being a *solution* to a coordination problem, b) People *preferring* to follow it *if* they believe others will, c) The announcement successfully creating common knowledge *of the new expectation* (which is different from just common knowledge *of the announcement*), d) People *actually* changing their behavior based on that expectation. Announcements can *initiate* a shift but aren't magic.

  6.  **"Norms evolve: people copy whoever seems to be doing well."**
      *   **Lewis Accepts:** Lewis *does* discuss how conventions can change through precedent and learning, often driven by perceived success.
      *   **Subtly Off:** This phrasing leans more towards evolutionary game theory or social learning theory (e.g., Robert Boyd, Peter Richerson). Lewis's core model focuses on rational actors solving coordination problems via expectations. While compatible, the "copying winners" emphasis isn't the *primary* driver in Lewis's *Convention*; it's more about shifting expectations based on observable behavior and precedent. It's not "stapled on," but it's a bit reductive of Lewis's mechanism.

  **Summary of Corrections:**
  *   **"Wants" is Wrong:** Replace with "prefers to conform *conditional on expecting others to conform*."
  *   **"Tacit Agreement" is Wrong:** Conventions emerge from coordination, not agreements.
  *   **"Nobody has Reason to Change" is Overstated:** Groups *can* have reasons to shift conventions.
  *   **Announcement ≠ Instant Convention:** Announcements create common knowledge *of the message*, not automatically the new behavior pattern. Behavior change requires the new pattern to be a viable coordination solution people adopt based on expectations.
  *   **Copying is Compatible but Secondary:** Lewis emphasizes expectation-based conformity over pure imitation.

  **Practical Upshot (Survives, but Nuanced):**
  Yes, common knowledge is powerful. Credible public announcements *are* potent tools for *initiating* norm change by establishing a new focal point and creating common knowledge of leadership's expectation. However, they are **not sufficient alone**. The new pattern must also:
  1.  Be perceived as a viable solution to a coordination problem.
  2.  Be preferable (or at least not worse) *for coordination* than the old way, considering switching costs.
  3.  Gain traction - early adopters need to act, reinforcing the expectation that others will too.

  **Applying the Corrected Lewis Framework to Your Case:**

  1.  **Is the Current Junior-Tagging a Lewis Convention?**
      *   **Yes, but an unstable/flawed one.** It *is* a regularity everyone expects. *Conditionally*, people prefer to conform (seniors avoid work, juniors feel pressured to comply). It solves a coordination problem ("Who handles this escalation?") albeit poorly. **Crucially, it violates the "mutual benefit" spirit:** It's not Pareto optimal. *Juniors are clearly worse off.* It persists due to path dependence and conditional preferences (seniors prefer it *given* juniors comply; juniors comply *given* they expect seniors won't and fear repercussions). It's a *bad* convention sustained by power imbalance and lack of alternatives.

  2.  **Will Leadership's Announcement Alone Work?**
      *   **Highly Unlikely.** The announcement creates common knowledge of leadership's *desire* for a new norm. But:
          *   **Coordination Problem:** The new system (senior on call owns it) *is* a clearer, fairer solution. This is good.
          *   **Conditional Preferences:** The critical hurdle. *Seniors currently prefer the old norm* (it benefits them). They have little *immediate* incentive to change *unless* they are certain others (especially other seniors and leadership) will enforce it and juniors won't cave. Juniors *want* the change but need certainty seniors will actually comply and not retaliate.
          *   **Common Knowledge of Expectation ≠ Common Knowledge of Compliance:** Everyone knows leadership *said* it. But do they know if *seniors* will actually *do* it? Will leadership *enforce* it? This uncertainty creates a coordination trap. Seniors might wait to see if others change; juniors might still tag juniors out of fear.

  3.  **What Has to Be True for the New Norm to Take Hold?**
      Using Lewis, the new convention requires:
      *   **Common Knowledge of the New Rule:** The announcement achieves this.
      *   **Common Belief that Others Will Follow:** This is the missing piece. People need to believe that *enough* others (especially key seniors and leadership) *will actually adhere* to the new rule.
      *   **Perceived Viability & Benefit:** The new system must be clearly better *for coordination* than the old one (it seems so) *and* perceived as fairer (it is).
      *   **Overcoming the Old Equilibrium:** The current bad convention is stable *because* of conditional preferences. Breaking it requires a shift in expectations.

  4.  **What To Actually Do (Beyond the Announcement):**
      Leadership's belief that "announcement + common knowledge is the whole job" is naive. To make the Lewis framework work *for* you:
      *   **Credibility & Consistency:** Leadership must *immediately and visibly* model and enforce the new rule. If a senior tries to deflect, leadership *must* publicly (in the channel) reinforce: "Per Monday's announcement, this is yours, [Senior Name]. Please handle it." Common knowledge of *enforcement* is vital.
      *   **Create Early Signals of Compliance:** Identify trusted, influential seniors to be "first movers." Brief them beforehand. Have them *immediately* and visibly take ownership of the first few escalations post-announcement ("I've got this one, team"). This starts building common knowledge *that the new behavior is happening*.
      *   **Address the Conditional Preference:** Make *non-compliance* costly or embarrassing for seniors. Gentle public reinforcement by leadership or ops ("[Senior], can you confirm you're on this?") signals that defiance won't be tolerated. Simultaneously, empower juniors to *not* jump in; maybe institute a brief "hold" period before anyone responds.
      *   **Monitor & Reinforce Publicly:** For the first few weeks, actively monitor the channel. Publicly acknowledge correct behavior ("Thanks [Senior] for picking that up promptly"). Privately address slips immediately. This builds common knowledge of *compliance*.
      *   **Formalize Slightly (Temporarily):** Consider a *very brief* period (1-2 weeks) where the "senior on call" is explicitly named in the channel header or a pinned message daily/weekly. This reduces ambiguity and reinforces the focal point.
      *   **Acknowledge the Asymmetry:** Explicitly state *why* this is fairer and better for the team/customers in the announcement. Don't pretend the old way benefited juniors.

  **Conclusion:** Lewis's core insight about common knowledge and coordination is powerful and relevant. The announcement is necessary to set the new expectation. However, treating it as sufficient ignores the dynamics of conditional preferences and the need to actively *establish* common knowledge *of compliance* to break the old, bad equilibrium. Your leadership needs to actively manufacture not just the announcement, but the early precedents and enforcement that make everyone believe the new rule is *real* and *expected*. Focus on visible leadership modeling, immediate reinforcement of correct behavior, and swift, gentle correction of non-compliance to shift expectations rapidly.
