prompt: |-
  OK so theres a fight that keeps eating my reading group's time and I want a diagnosis rather than another round of it.

  The fight: eliminativists say belief and desire aren't real -- folk psychology is a bad theory and mature cognitive science won't need it -- and the other side says sure, fine, maybe there's no little sentence in the head, but something is doing that work, so what exactly are you denying? Nobody ever moves.

  My suspicion is that three seperate claims get asserted as if they were one. (a) Nothing in the head has the causal profile folk psych attributes to belief -- inferentially promiscuous, decoupled from stimulus, that sort of thing. (b) 'Belief' fails to refer: it's not just that folk psych is wrong, it's that the term doesn't pick anything out. (c) Cognitive science would do better to stop using belief-talk as a modeling primitive, even if beliefs exist. (a) feels empirical, (b) is a reference-under-a-false-theory question, (c) is research strategy, and people slide between them mid-sentence. Meanwhile everyone's gut analogy -- belief is like phlogiston, or like caloric, or like 'atom' which survived a theory that was wrong about it -- is doing enormous unargued work.

  The part I actually want help with. I've been toying with a cut I don't think anyone has made cleanly, and I can't tell if it's the distinction the debate needs or just the old camps renamed. Call it state-eliminativism vs norm-eliminativism. State: there are no internal states with the functional profile of belief. Norm: ascriptions of belief aren't answerable to any standard of correctness -- there's no fact of the matter about what someone believes, so 'she believes that p' is a useful fiction on the order of 'the average family has 2.4 kids', never true or false. My hunch is that everything interesting is on the norm side, that the state side is basically empirical and boring, and that once you split them most of the shouting turns out to be two camps defending different halves. But I may just be reinventing instrumentalism vs realism, or the predictive-vs-explanatory-success thing, or the question of whether belief is a normative kind. If so, tell me which one, and why my cut isn't earning its keep.

  Then: what would actually count as progress here? A result out of computational cognitive science? A semantics of reference failure? The field quietly dropping the word? Or nothing -- is this the kind of dispute that stays open forever because it's really about what we want an explanation of the mind to do? Diagnose it, don't adjudicate it. And don't hand me a reading list, I know Fodor and Churchland. I want the structure of the disagreement in your own words.

  Side thing that might matter: people keep waving LLMs at this -- "it predicts our text without believing anything, so eliminativism wins" -- and I genuinely can't tell if that's a category error or a decent new argument. Say whether it bears on any of the above.
reasoning: |-
  Okay, the user is dealing with a persistent debate in their reading group about eliminative materialism and wants a clear diagnosis without rehashing the same arguments. They suspect three distinct claims (a, b, c) are being conflated and propose a new distinction between "state-eliminativism" and "norm-eliminativism." They're worried this might just be renaming existing positions and want to know if it adds value. Also, they're curious about whether LLM examples contribute anything meaningful.

  First, I need to unpack their three conflated claims. Claim (a) is about the empirical mismatch—nothing in the brain matches the functional profile of beliefs. Claim (b) is semantic: does "belief" refer to anything real? Claim (c) is pragmatic: should cognitive science avoid belief-talk? The user is right that these often get blurred in debates, leading to talking past each other.

  Their proposed state/norm split is interesting. State-eliminativism denies internal states with belief's functional profile, while norm-eliminativism says belief ascriptions lack truth conditions. I see this as distinct from instrumentalism vs realism because it isolates the normative dimension—whether belief is inherently a normative kind (answerable to rationality standards). This could clarify debates where one side focuses on cognitive architecture (state) and the other on interpretation practices (norm). 

  On progress: the user wants to know how this could resolve. Empirical results (like neuroscience showing distributed representations) might address state-eliminativism but won't touch norm-eliminativism. For the latter, it's more about philosophical arguments on whether interpretation requires normative standards. LLMs are relevant here—they show systems producing belief-like behavior without obvious propositional states, which pressures state-eliminativism but leaves norm-eliminativism untouched since LLM outputs are still interpreted normatively. 

  The core friction might be about explanatory goals. Some want a purely causal account of cognition; others think rationality norms are indispensable. Until the group agrees on what counts as a "good explanation," the debate will loop. The state/norm distinction helps by showing these are separate battlegrounds. 

  LLM point: They're useful against state-eliminativism by demonstrating functional profiles without folk-psychology atoms, but don't engage norm-eliminativism because we still apply intentional stance to them. Not a category error, but incomplete.

  Overall, the user's framework earns its keep by disentangling empirical, semantic, and normative layers. Progress would require either settling the empirical question (unlikely soon) or agreeing on whether norms are part of cognition's ontology. Otherwise, it's a perpetual meta-debate about what explanation should look like.
answer: |-
  Your diagnosis is sharp, and the state/norm split *is* a fresh cut that clarifies the stalemate. It's not just renaming old camps—it isolates a core ambiguity that fuels the circularity. Here's why it earns its keep and how it reframes the impasse:

  ### 1. **Your Distinction Unpacks the "What Are You Denying?" Trap**
     - **State-Eliminativism** (empirical claim): "No neurocognitive state *functionally mirrors* the folk-psychological role of belief (inferential integration, propositional content, causal independence from stimuli)."  
       *If true, cognitive science must posit alternative mechanisms (e.g., distributed activation patterns, Bayesian priors).*
     - **Norm-Eliminativism** (conceptual/semantic claim): "Belief ascriptions *lack truth conditions*. There’s no fact of the matter about whether ‘S believes p’ is correct; it’s a *heuristic gloss* on behavior, not a description of a real state."  
       *If true, cognitive science must abandon belief as an explanatory primitive—even if states exist that *resemble* beliefs.*

     This split reveals why the debate spins:  
     - The anti-eliminativist says, *"Something does the work!"* → This challenges **State-Eliminativism** (if "the work" = functional role).  
     - The eliminativist replies, *"But it’s not *belief*!"* → This often smuggles in **Norm-Eliminativism** (if "belief" requires FP’s *normative commitments*).  
     Your norm-focused hunch is right—the heat comes from Norm-Eliminativism, which threatens the *intentional stance itself*.

  ### 2. **How It Differs From Existing Cuts**
     - **Instrumentalism vs. Realism**: Your norm-eliminativism *is* a form of instrumentalism about belief, but it’s **more precise**: it targets *specifically the normative dimension* of belief ascriptions (e.g., rationality constraints, holism). Instrumentalism could allow that "belief" refers loosely; norm-eliminativism denies reference *because* norms fail.  
     - **Predictive vs. Explanatory Success**: This is a symptom, not the core. Norm-eliminativism argues that belief-talk’s predictive success is *accidental* (like predicting weather with astrology), not evidence of explanatory traction.  
     - **Belief as a Normative Kind**: Bingo—this is the heart. Norm-eliminativists argue that *without* norms of rationality/consistency, "belief" is just a label, not a natural kind. Your distinction makes this explicit.

  ### 3. **What Counts as Progress?**
     - **Against State-Eliminativism**: Progress is empirical. If cognitive science finds states with FP-functional profiles (e.g., global workspace architectures with decoupled representations), State-Eliminativism loses. **But**: this won’t touch Norm-Eliminativism.  
     - **Against Norm-Eliminativism**: Progress is philosophical/conceptual. Key question: *Must successful belief ascription presuppose rationality norms?*  
       - If yes → Norm-eliminativism undermines itself (interpreting *anything* requires norms).  
       - If no → Belief ascriptions could be "directly" physical (e.g., neural states encoding propositions).  
       This is deadlocked because it hinges on conflicting intuitions about intentionality.  
     - **Real Stalemate-Breaker**: Agreement on **explanatory goals**.  
       - If the goal is *causal-mechanical explanation* (e.g., how neurons produce behavior), Norm-Eliminativism pushes for non-intentional primitives.  
       - If the goal is *interpretive/predictive success* (e.g., aligning with agents’ reasons), Norm-Eliminativism seems self-defeating.  
       Until the group settles what cognition *needs explaining*, the debate is meta-philosophical.

  ### 4. **LLMs: Category Error or New Argument?**
     - **State-Eliminativism**: LLMs *are* relevant. They generate belief-like behavior *without* discrete, inferentially integrated states. This pressures the idea that FP-functional profiles are necessary.  
     - **Norm-Eliminativism**: LLMs change nothing. We *apply* norms to LLM outputs ("ChatGPT *thinks* vaccines cause autism") despite knowing they lack beliefs. This shows our *practice* of belief ascription is **decoupled from ontological commitment**—exactly what norm-eliminativists claim about humans.  
     - **Verdict**: Not a category error. LLMs empirically challenge State-Eliminativism by showing FP-like behavior *can* emerge from non-FP mechanisms, while reinforcing Norm-Eliminativism by revealing how easily we project norms onto systems lacking inner states.

  ### The Core Structure of Disagreement
  | **Axis**                | **Eliminativist Emphasis**       | **Anti-Eliminativist Emphasis** |
  |--------------------------|----------------------------------|----------------------------------|
  | **Target**               | Folk Psychology (FP) as a whole | FP’s core entities (belief/desire) |
  | **State Claim (a)**      | FP-functional profiles don’t exist | *Something* must fill that role |
  | **Reference Claim (b)**  | "Belief" fails to refer (FP is false) | Reference can survive theory change |
  | **Pragmatic Claim (c)**  | FP impedes science               | FP is indispensable heuristically |
  | **Your State/Norm Split**| **Norm-eliminativism**: FP’s norms are the real illusion | **State realism**: FP roles are real, even if FP details are wrong |

  **Diagnosis**: The fight persists because eliminativists treat (a)+(b)+(c) as a package deal (if FP is *false*, reference fails and science must drop it), while anti-eliminativists see (a) as contingent, (b) as non-fatal (reference without perfect theory), and (c) as premature. Your norm/state split forces clarity: **State-eliminativism is vulnerable to empirical progress; Norm-eliminativism is a philosophical gambit about whether interpretation requires norms**. The shouting happens when one side switches mid-argument from state-claims (empirically resolvable) to norm-claims (conceptually fraught).

  **Path Forward**: Ask each side: "If cognitive science finds states functionally identical to FP beliefs, would you still deny *beliefs exist*?" If yes, they’re norm-eliminativists—and the real dispute is about intentionality’s nature. If no, it’s empirical and tractable. This exposes the meta-disagreement: **Is the mind fundamentally a normative space, or just a causal engine we *describe* normatively?** That’s the immovable rock.
