prompt: |-
  I spent thirty-seven years in a physical chemistry laboratory, most of it measuring things nobody can see — binding energies, transition rates, chemical potentials — and I have been reading philosophy and the philosophy of economics since I retired. I am auditing a course in the foundations of social science this term, and in the second week the instructor defended the utility concept with an analogy I keep hearing, from economists and from textbook authors alike, and which I find both appealing and slippery.

  The analogy runs as follows. A choosing agent is like a body moving in a potential. Utility is the landscape; the agent's choices are the local gradient of that landscape; utility itself is like potential energy, which is never observed in itself, is defined only up to an additive constant, and is objectionable to no one. On this picture, only differences matter, the zero point is a convention, an agent need not calculate anything in order to be described as descending the gradient, and departures from the prediction are friction and noise rather than failures of the law. The conclusion drawn from it in my class was that the complaints about utility being an unobservable mental fiction are confused in exactly the way a complaint about potential energy being unobservable would be confused, and that the revealed preference programme was simply doing what physics had already done: discarding an occult quality in favour of what the behaviour shows.

  I would like a careful audit of this analogy, written for someone fluent in the physics but new to the economics and to the philosophy of it. Specifically:

  1. A correspondence table. State what plays the role of the coordinates, the landscape, the gradient, the equation of motion, the zero point, the friction, and the conservation law — and mark any role for which the analogy has no answer.

  2. Where the mapping breaks, sorted into the disanalogies that matter for the use my instructor made of it and those that are merely picturesque. I care above all about whether the analogy survives as a defence of utility's unobservability and as a claim about the empirical content of the theory.

  3. What features of the source domain the analogy quietly imports that the target lacks. I have three suspicions and would like them tested rather than echoed: that a potential requires a conservative field, so that path-independence is a substantive assumption and not a convenience; that a gradient requires a metric and a dynamics, neither of which the theory supplies; and that the claim that only differences matter presupposes a scale type that ordinal theories do not license.

  4. Whether the integrability problem in revealed preference — the question of when local choice data can be reconstructed into a single global ordering — is literally the physicist's question of whether a one-form is exact. If it is, tell me what that does to the analogy: does it vindicate the comparison by showing where the analogy must be cashed out in a theorem, or does it expose the analogy as concealing the one place where the economics has to do work the physics does for free?

  5. Whether a better analogy exists. If some other physical or biological image — a temperature with an absolute zero, a free-energy landscape with kinetics, something else — carries the reasoning more honestly, say what conclusions it would license and which of my instructor's it would withdraw.

  Please do not supply a bibliography; I will chase the literature myself. Do avoid hedging into generalities about models being useful fictions: I want the specific joints of the comparison examined, and I want to be told plainly where the analogy is load-bearing and where it is decoration. If any step of your argument depends on a technical result you are not certain of, flag it as something I should verify rather than asserting it.
reasoning: |-
  Okay, let me approach this systematically. The user presents a sophisticated analogy between utility in economics and potential energy in physics, requesting a detailed audit from someone with deep physics knowledge but newer to economic philosophy. 

  First, I need to map the analogy point by point as requested. The coordinates would correspond to consumption bundles, utility to potential energy, and the gradient to marginal utility. But immediately I notice gaps - unlike physics, economics lacks a defined metric for its "space" and has no equivalent to mass or conservation laws. The zero-point arbitrariness holds for cardinal utility but breaks for ordinal interpretations where only ranking matters.

  The friction analogy to behavioral noise seems superficially plausible but conceals a deeper issue: in physics, friction is a measurable perturbation to known laws, while in economics the "laws" themselves are what's being tested. This directly impacts the instructor's defense of utility's unobservability - potential energy's unobservability is compensated by predictive power via force laws, whereas revealed preference often circularly defines utility from the choices it's meant to predict.

  On integrability, yes, it's mathematically identical to checking if a differential form is exact. But this exposes a critical disanalogy: physics assumes conservative fields from symmetry principles (Noether's theorem), while economics must empirically verify path-independence through revealed preference axioms - work physics doesn't need. The analogy thus hides where economics does heavier lifting.

  The user's suspicions are well-founded. The gradient metaphor smuggles in assumptions of differentiability and convexity absent in economics. More fundamentally, potential energy requires conservation of energy, but no equivalent conserved quantity exists for utility. This makes the "only differences matter" claim misleading - for ordinal utility, even differences lack meaning.

  For a better analogy, I consider temperature but reject it due to its absolute zero. Free energy landscapes with kinetics offer promise by incorporating constraints and dynamics, but may overcomplicate. The most honest approach might be to drop analogies entirely and treat utility as a theoretical construct validated through predictive coherence.

  Throughout, I'll maintain precision about where the analogy holds mathematically versus where it misleads conceptually, respecting the user's capacity to follow technical arguments while flagging any uncertain points. The goal is to equip them with clear distinctions to evaluate their instructor's argument.
answer: |-
  Here is a careful audit of the potential energy/utility analogy, structured per your request. The analogy is illuminating but ultimately leaks under pressure, particularly regarding the empirical content and unobservability defense.

  ### 1. Correspondence Table
  | Physical Concept          | Economic Analog                 | Notes                                                                 |
  |---------------------------|----------------------------------|-----------------------------------------------------------------------|
  | **Coordinates (x)**       | **Consumption Bundles (x₁, x₂, ...)** | The space of possible choices.                                      |
  | **Potential Energy (V)**  | **Utility Function (U)**        | The scalar field representing "height".                              |
  | **Gradient (∇V)**         | **Marginal Utility (∂U/∂xᵢ)**   | Direction of steepest ascent; drives "motion" (choice).              |
  | **Force (-∇V)**           | **(Negative) Marginal Utility** | The "push" toward higher utility. Implicit, not directly theorized. |
  | **Equation of Motion**    | **Choice Rule (e.g., max U)**   | Typically first-order conditions (∂U/∂xᵢ = λpᵢ). No dynamics.      |
  | **Zero Point**            | **Affine Transformation (U → U+c)** | Arbitrary for cardinal utility. **Breaks for ordinal.**           |
  | **Friction/Noise**        | **Behavioral Noise, Errors**    | Deviations from predicted choice (e.g., trembles, biases).           |
  | **Conservation Law**      | ***No direct analog***          | Critical disanalogy (see below).                                     |
  | **Mass/Inertia**          | ***No analog***                 | No concept of resistance to change or momentum in choices.           |
  | **Metric (ds²)**          | ***No explicit analog***        | No defined "distance" between bundles; topology matters, not geometry.|

  ### 2. Where the Mapping Breaks
  #### **Disanalogies Damaging to the Instructor's Defense**
  - **Conservation Absence:** Potential energy is embedded in a *conservative system* (∇×F=0). Energy conservation provides empirical content: predicted paths and velocities must satisfy T + V = constant. Utility lacks any conserved quantity. Choices reveal only *local* gradients, not global conservation. This voids the analogy's claim that utility's unobservability is as harmless as potential energy's.
  - **Dynamics vs. Statics:** Physics uses potentials to predict *trajectories* under dynamics (F=ma). Economics predicts *equilibria* (∇U ∝ p). The gradient in physics is a causal force; in economics, it's a static optimality condition. Unobservable V predicts observable acceleration; unobservable U "predicts" choices via circularity (revealed preference).
  - **Empirical Content:** Potential energy + Newton's laws predict *new phenomena* (e.g., orbital periods). Revealed preference often just rationalizes *existing* choices. The analogy masks this predictive weakness by implying utility has similar inferential power.
  - **Ordinality:** Potential energy differences are physically significant (work done). Utility differences are meaningless in ordinal theory—only rankings matter. The "additive constant" defense only works for *cardinal* utility, which standard economics explicitly rejects. This directly undermines the "only differences matter" claim.

  #### **Merely Picturesque Disanalogies**
  - **No Inertia/Mass:** Choices lack momentum or resistance to change.
  - **No Time Dependence:** Utility landscapes are static; potentials can be time-varying.
  - **Discrete vs. Continuous:** Bundles are often discrete; space is continuous.

  ### 3. Smuggled Assumptions from Physics
  Your suspicions are correct:
  - **Conservative Field Requirement:** Path-independence (∫F·dx path-independent) is equivalent to ∇×F=0. This is a *substantive physical law*, not a convention. Economics assumes transitivity (acyclic choice) to build a "potential," but this is an axiom, not an empirically grounded conservation law. The analogy hides that path-independence is a *testable hypothesis* in economics, not a given.
  - **Implicit Metric & Dynamics:** A gradient requires a metric to define (e.g., ∇U = g⁻¹(∂U/∂x)). Economics has no metric over bundles. The gradient metaphor also implies a dynamic process (steepest descent), but choice theory is static equilibrium. Kinematics are absent.
  - **Scale Type:** The "differences matter" argument assumes *interval scale* (affine transformations). Ordinal utility only permits *monotonic transformations*, making differences and gradients meaningless. The analogy conflates cardinal and ordinal utility.

  ### 4. The Integrability Problem
  - **Yes, it is literally exactness:** Given a "marginal utility" vector field (Mᵢ(x) ≈ ∂U/∂xᵢ), integrability asks: ∃ U such that Mᵢ = ∂U/∂xᵢ? This is equivalent to asking if the 1-form ω = Mᵢdxᵢ is exact (dω=0 ⇔ ∂Mᵢ/∂xⱼ = ∂Mⱼ/∂xᵢ).
  - **Effect on the Analogy:** It **exposes concealed work**. Physics assumes dω=0 from fundamental symmetries (Noether). Economics must *impose* integrability conditions (e.g., Slutsky symmetry) as axioms of rationality. The analogy disguises that economics needs *additional constraints* to mimic the conservative field physics gets "for free" from conservation laws. This is where revealed preference does heavy lifting the analogy obscures.

  ### 5. Is There a Better Analogy?
  The potential energy analogy overreaches. More honest options:
  - **Temperature (Ordinal):**  
    - *Analogy:* Utility ~ Temperature, Indifference curves ~ Isotherms.  
    - *Pros:* Captures ordinality (only order matters), no natural zero, "heat flow" (trade) toward equilibrium.  
    - *Cons:* No "gradient" driving force; temperature differences *are* physically meaningful (unlike ordinal utility differences).  
    - *Conclusion:* Withdraws the gradient/dynamics pretense. Defends ordinal unobservability but not cardinal comparisons.
    
  - **Free Energy Landscape (with kinetics):**  
    - *Analogy:* Utility ~ Free Energy (G), Choices ~ Stochastic transitions between states.  
    - *Pros:* Explicitly incorporates constraints (like budget), noise (thermal fluctuations), and dynamics (kinetic rates). Explains suboptimal/multimodal choices.  
    - *Cons:* Overly complex for standard choice theory. Requires specifying kinetics (economics lacks analogs to rate constants).  
    - *Conclusion:* Withdraws determinism. Defends unobservability but emphasizes stochasticity and path-dependence. Highlights that "gradient descent" is probabilistic.

  ### Verdict on the Instructor's Defense
  - **Unobservability Defense:** Partially survives for *cardinal* utility, but **fails for ordinal**. Potential energy's unobservability is compensated by predictive power via dynamics; ordinal utility lacks comparable empirical leverage. Revealed preference doesn't "discard occult qualities"—it *defines* utility via choices, risking tautology.
  - **Empirical Content:** The analogy **badly overstates** utility theory's predictive power. Physics predicts new trajectories; revealed preference often just rationalizes observed choices. The "friction" excuse masks this gap.

  **Bottom Line:** The analogy is pedagogically useful but philosophically deceptive. It conceals cardinal assumptions, overstates empirical content, and ignores that physics' success relies on symmetries/conservation laws absent in economics. For ordinal utility, temperature is safer; for richer dynamics, free energy landscapes are more candid—but neither fully rescues the instructor's argument.
