  Below is a decision procedure for your team, designed as a flowchart of questions with clear stopping points. It prioritizes physical mechanisms over philosophical principles, outputs defensible sampling schemes or explicit bracketing, and includes documentation requirements. The procedure is operational, using engineering terms (nucleation, tooling, impact dynamics), and ensures two analysts produce identical outputs for the same inputs.

  ---

  ### **Decision Procedure: Random Chord Sampling in Circular Cross-Sections**

  #### **Step 0: Define the Event**
  - **Action:** Specify:
    - Circular region radius \(R\).
    - Critical inner region (e.g., concentric circle radius \(r\)).
    - Event: Chord severs (intersects) the inner region.
  - **Output:** Document \(R\), \(r\), event definition.

  #### **Step 1: Is the Physical Mechanism Fully Known?**
  - **Question:** "Do we know the physical process generating the chord (e.g., crack nucleation, tool impact, arc-fault) and its measurable parameters?"
  - **Sufficient Answer:**  
    - **Yes** (fully known): Proceed to Step 2.  
    - **No** (unknown/partially known): Proceed to Step 4.  
  - **Kill Early:** If the mechanism is vague (e.g., "random line"), skip to Step 4.

  #### **Step 2: Map Mechanism to Chord Parameters**
  - **Question:** "Which physical parameters directly define the chord, and what are their distributions?"
  - **Sufficient Answer:**  
    - **Endpoint-Driven** (e.g., crack starts/stops at boundary): Use **Endpoint-Uniform (EU)**.  
      - *Sampling:* Two endpoints uniform on circumference.  
      - *Justification:* Physical endpoints are independent and uniformly distributed (e.g., corrosion points).  
    - **Direction/Offset-Driven** (e.g., tool scratch orientation): Use **Direction-Offset-Uniform (DU)**.  
      - *Sampling:* Direction uniform in \([0, 2\pi)\); perpendicular distance from center uniform in \([0, R]\).  
      - *Justification:* Orientation and position are uniform (e.g., tool dropped from height with random alignment).  
    - **Midpoint-Driven** (e.g., defect at material flaw): Use **Midpoint-Uniform (MU)**.  
      - *Sampling:* Midpoint uniform in disk.  
      - *Justification:* Chord centered at a uniformly distributed defect (e.g., material inhomogeneity).  
  - **Definite Verdict:** Output sampling scheme. Proceed to Step 5.  
  - **Kill Early:** If distributions are non-uniform (e.g., cracks prefer certain angles), use observed data to sample; if unavailable, proceed to Step 4.

  #### **Step 3: Check for Invariance (Mechanism Known)**
  - **Question:** "Is the mechanism invariant under rotation/translation?"  
    - **Test:** Rotate/translate the setup; does the chord distribution change?  
  - **Sufficient Answer:**  
    - **Rotation-Invariant:** All methods (EU, DU, MU) satisfy this; no change.  
    - **Translation-Invariant (in plane):** Requires **DU** (Jaynes' argument).  
      - *Justification:* DU is the only measure invariant under Euclidean motions.  
  - **Definite Verdict:** Use DU if translation-invariance is physical (e.g., homogeneous material). Else, stick with Step 2 choice.  
  - **Stop Here:** Proceed to Step 5.

  #### **Step 4: Mechanism Unknown/Partially Known**
  - **Question:** "Is there symmetry or data to constrain the chord?"  
  - **Sufficient Answer:**  
    - **No symmetry/data:** Output **Bracketing (EU, DU, MU)**.  
      - *Deliverable:* Report probability range \([P_{\text{min}}, P_{\text{max}}]\) from three methods.  
      - *Client Message:* "Probability is between \([P_{\text{min}}, P_{\text{max}}]\) due to unknown mechanism. Physical data on [X] would narrow this."  
        - *Example:* For inner radius \(r\), \(P_{\text{EU}} = \frac{1}{3}\), \(P_{\text{DU}} = \frac{1}{2}\), \(P_{\text{MU}} = (r/R)^2\).  
    - **Partial symmetry (e.g., nucleation site known):** Use known parameter; assume uniformity for unknowns *only* if symmetry demands it.  
      - *Example:* Crack starts at uniform point on boundary (EU endpoint) + unknown direction → assume uniform direction by rotational symmetry.  
  - **No Principled Choice:** If no symmetry/data, output bracketing.  
  - **Stop Here:** Proceed to documentation.

  #### **Step 5: Document and Implement**
  - **Document:**  
    - Physical mechanism (or "unknown").  
    - Chosen sampling method (or bracketing).  
    - Assumptions made (e.g., "uniform direction by rotational symmetry").  
    - Physical data needed to validate (e.g., "crack angle distribution").  
  - **Output:** Sampling code or bracketed probabilities.

  ---

  ### **Worked Examples**

  #### **Case (a): Fatigue Crack from Weld Circumference**  
  - **Step 1:** Mechanism known (nucleation at boundary + inward propagation).  
  - **Step 2:** Endpoint-driven (one endpoint fixed at nucleation site).  
    - **Unknown:** Propagation direction.  
  - **Step 4:** Symmetry → rotational invariance at nucleation site.  
    - **Action:** Assume uniform direction in \([0, \pi]\) relative to tangent.  
    - **Sampling:**  
      - Endpoint: Uniform on circumference.  
      - Direction: Uniform in \([0, \pi]\).  
    - **Probability:** \(P = \frac{2}{\pi} \arcsin(r/R)\) (not classic 1/3 or 1/2).  
  - **Documentation:** "Assumed uniform propagation direction by rotational symmetry at nucleation site. Requires crack angle data to validate."

  #### **Case (b): Scratch from Dropped Tool**  
  - **Step 1:** Mechanism known.  
  - **Step 2:** Direction/offset-driven (position/orientation uniform).  
  - **Step 3:** Translation-invariant (homogeneous region) → **DU method**.  
  - **Sampling:** Uniform direction + uniform offset.  
  - **Probability:** \(P = \frac{1}{2}\) for inner circle.  
  - **Documentation:** "Tool position/orientation uniform → DU sampling."

  #### **Case (c): Unknown Composite Crack Mechanism**  
  - **Step 1:** Mechanism unknown.  
  - **Step 4:** No symmetry/data → **Bracketing (EU, DU, MU)**.  
  - **Deliverable:**  
    - \(P_{\text{EU}} = \frac{1}{3}\), \(P_{\text{DU}} = \frac{1}{2}\), \(P_{\text{MU}} = (r/R)^2\).  
    - Range: \([\min(P), \max(P)]\) (e.g., \([0.01, 0.5]\) if \(r/R = 0.1\)).  
  - **Client Message:** "Probability between [X] due to unknown initiation. Data on crack location/orientation needed."  

  ---

  ### **Annotation: Real Tests vs. Judgment Calls**
  | **Step**       | **Nature**          | **Determinate Output?** | **Engineer Judgment?** |  
  |----------------|---------------------|-------------------------|------------------------|  
  | Step 1         | Physical fact       | Yes (known/unknown)     | None                   |  
  | Step 2         | Mechanism mapping   | Yes (if parameters clear)| None (if data exists)  |  
  | Step 3         | Invariance test     | Yes (testable)          | Translation-invariance |  
  | Step 4         | Symmetry/data gap   | Bracketing (objective)  | Assumption of uniformity |  
  | Documentation  | Record              | N/A                     | None (factual)         |  

  - **Judgment Dressed as Procedure:** Assuming uniformity in Step 4 (if symmetry) is a choice. Engineers must document: "Assumed uniformity due to symmetry; physical data could override."

  ---

  ### **What the Procedure Cannot Do**
  1. **Resolve Underdetermined Symmetries:**  
     - If symmetries conflict (e.g., translation vs. scale invariance), bracketing is required.  
     - *Example:* A crack in a fractal material might break scale invariance; DU no longer unique.  
  2. **Replace Data with Philosophy:**  
     - Invariance arguments (e.g., Jaynes) resolve ambiguity *only* if the physical system obeys Euclidean symmetry (homogeneous plane). Otherwise, they relocate ambiguity to symmetry selection.  
  3. **Handle Non-Geometric Uncertainty:**  
     - Material properties, load dynamics, or boundary effects require separate FEA/physics models.  
  4. **Bypass Expert Judgment:**  
     - Engineers must decide if "rotational symmetry" applies (e.g., is the weld isotropic?).  

  ---

  ### **Documentation Template**
  ```markdown
  # Random Chord Sampling Documentation
  - **Scenario:** [e.g., Fatigue crack in weld]
  - **Physical Mechanism:** [e.g., Nucleation at boundary + inward propagation]
  - **Known Parameters:** [e.g., Nucleation site: uniform on circumference]
  - **Unknown Parameters:** [e.g., Propagation direction]
  - **Sampling Method:** [e.g., Uniform direction by rotational symmetry]
  - **Probability of Event:** [e.g., 0.45 or [0.01, 0.5]]
  - **Assumptions:** [e.g., "Uniform direction assumed; requires crack angle data"]
  - **Validation Data Needed:** [e.g., "High-speed imaging of crack angles"]
  ```

  ---

  ### **Final Outputs for Consistency**
  - **Same Scenario → Same Output:** Two analysts will always:  
    - Agree on known/unknown mechanism (Step 1).  
    - Map to same parameters if data exists (Step 2).  
    - Compute identical bracket if unknowns remain (Step 4).  
  - **Auditable:** Documentation allows reviewers to challenge assumptions without rederivation.

