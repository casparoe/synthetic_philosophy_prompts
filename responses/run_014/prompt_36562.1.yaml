  Key sampling methods and their physical justifications:
  1. **Endpoint-uniform method (EU)**: Choose two points independently and uniformly on the circumference. Physical meaning: The chord is defined by two independently occurring events on the boundary (e.g., initiation and termination points). Yields P(sever) = 1/3 for a concentric circle of radius r < R.
  2. **Direction-uniform with uniform offset (DU)**: Choose a direction (angle) uniformly in [0, 2π) and then a perpendicular distance from the center uniformly in [0, R]. Physical meaning: The chord is defined by a random direction and a random offset, which might model a linear feature whose orientation and position are arbitrary. Yields P(sever) = 1/2 for the same concentric circle.
  3. **Midpoint-uniform method (MU)**: Choose a point uniformly within the circle and let that be the midpoint of the chord. Physical meaning: The chord is defined by its center, which might be the point of maximum stress or the center of the defect. Yields P(sever) = (r/R)^2.

  We note that these are the three classic methods in Bertrand's paradox.

