  **Therefore, for case (c):** 
      - Since mechanism is unknown and no symmetries beyond rotation (which does not break the tie), we go to Step 4 and bracket.

  **Final Procedure in Steps:**

  **Step 0: Define the event.**
     - Clearly state the circular region and the event (e.g., severing an inner circle of radius r).

  **Step 1: Describe the physical mechanism.**
     - If the mechanism is known and fully specified (including distributions), map to a chord sampling method and go to Step 5.
     - If the mechanism is partially known (some parameters known, some unknown), go to Step 2.
     - If the mechanism is unknown, go to Step 3.

  **Step 2: Partially known mechanism.**
     - For each unknown parameter:
          - If there is physical data, use the empirical distribution.
          - Else if there is a symmetry argument that determines the distribution, use that distribution (e.g., rotational symmetry -> uniform angle).
          - Else, go to Step 4 (bracketing) with a note that the parameter is unknown and without an assumption the model is incomplete.
     - If all parameters are now known, go to Step 5.

  **Step 3: Unknown mechanism.**
     - Consider symmetries:
          - Is the problem rotationally invariant? (Yes for a circle.)
          - Is the problem translationally invariant in the plane? (This would be true if the circle is an arbitrary subset of a homogeneous medium. If yes, then the DU method is chosen by the invariance under the Euclidean group. Use DU and go to Step 5.)
          - If not, go to Step 4.

  **Step 4: Bracketing.**
     - Run the simulation with the three classic methods:
          - EU: two endpoints uniform on circumference.
          - DU: uniform direction in [0, 2π) and uniform perpendicular distance in [0, R].
          - MU: uniform midpoint in the disk.
     - Report the range of probabilities and specify what physical data would collapse the bracket.

  **Step 5: Implement the chosen sampling method.**
     - Document:
          - The mechanism as described.
          - The parameters and their distributions, including any assumptions made.
          - The sampling method.

  **Case (a) in the procedure:**
     - Step 1: Partially known. Starting point uniform. Propagation direction unknown.
     - Step 2: For propagation direction, no data. But symmetry: at each starting point, the circle is rotationally symmetric, so the direction should be uniform in [0, π] relative to the tangent. Use that.
     - Step 5: Sample as described.

  **Case (b):**
     - Step 1: Known. Use DU.

  **Case (c):**
     - Step 1: Unknown.
     - Step 3: We ask: is there translational invariance? We don't know. If the client says the composite is homogeneous and the circular region is arbitrary, then we use DU. But if we have no information, we might not assume translational invariance. Therefore, we go to Step 4 and bracket.

  **Ensuring Consistency:**
     - Two analysts given the same physical scenario should follow the procedure and document their answers. The judgment calls (like symmetry for the propagation direction in case a) are made explicit in the documentation. For case (c), if both analysts agree that translational invariance holds (or not), they will get the same method (DU) or the same bracket.

  **Final Note:** The procedure is designed to be run in 15 minutes. It focuses on the physical mechanism and uses symmetries and data when available, falling back to bracketing when necessary.
