answer: |-
  ### Analysis of Lena and Marcus's Exchange

  **Lena's First Move (Malfunction):**  
  Lena is correct that the etiological account (Millikan) uniquely handles malfunction. By defining function based on *historical selection*, a diseased kidney can be said to malfunction because it fails to perform the task it was selected for. The causal-role account (Cummins) struggles here, as it defines function solely by a part's current causal contribution; if a kidney isn't filtering waste, it isn't fulfilling its causal role, but this lacks the normative force of "what it *should* do."  
  ***Verdict: Lena wins this point.***

  **Marcus's First Move (Exaptation and Selection History):**  
  Marcus is right that exaptation challenges the etiological view. Traits like feathers evolved for one purpose (insulation) but were co-opted for another (flight). Etiological accounts must trace complex selection histories, which can be ambiguous or untestable. Causal-role accounts avoid this by focusing on a trait's *current* contribution (e.g., feathers enabling flight now), making it more empirically tractable.  
  ***Verdict: Marcus wins this point.***

  **Lena's Second Move (Exaptation as Support for Etiology):**  
  Lena's rebuttal is logically consistent within the etiological framework: if a feather's original function was insulation, flight is merely a "byproduct." However, this narrowness is a weakness. Marcus correctly implies that restricting "function" to historical origins ignores biologically significant *current* contributions (e.g., flight being critical for modern birds). Lena's move preserves internal coherence but sacrifices explanatory breadth.  
  ***Verdict: Lena is technically correct but highlights a limitation of her view.***

  **Marcus's Final Move (Breadth and Artificial Systems):**  
  Marcus decisively wins here. The etiological account cannot assign functions to non-evolved systems (e.g., AI, synthetic biology, or engineered organs). Causal-role accounts easily handle these by analyzing a part's contribution to system capacities (e.g., a filter in a dialysis machine). Even in biology, traits can enhance fitness without being selected *for that specific role* (e.g., human chin exaptations), which causal-role captures better.  
  ***Verdict: Marcus wins this point.***

  ### Overall Assessment  
  While Lena's etiological account excels at explaining malfunction and normativity, Marcus's causal-role account is **more versatile and empirically robust**. It avoids the pitfalls of reconstructing selection histories, accommodates exaptation without denying current functions, and extends to non-evolutionary contexts. Philosophy of biology increasingly favors pluralism, but if forced to choose, the causal-role account's generality gives it the edge.  

  \answer{Marcus}
