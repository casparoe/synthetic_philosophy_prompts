  Looking at the technical requirements, I need to accurately portray at least three of these concepts: heritability as a ratio of variances specific to a population in particular environments; how equalizing environments increases heritability without changing trait fixity; the difference between predictable genetic variance and total genetic variance; and how high heritability is compatible with environmental shifts in trait means.

