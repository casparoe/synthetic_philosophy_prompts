  Okay, let me start by really understanding the user's background. They're a retired experimental physicist turned philosopher, diving into decision theory. Their examples show a struggle between intuition and formal expected utility (EU) calculations. The key here is reconciling their intuitive verdicts across different cases with a coherent principle.

  First, I need to break down each case. Cases 1, 5, 6, and 7 involve scenarios with extremely low probabilities (like 10^-15) where the user rejects action despite high stakes. Cases 2 and 4, however, show some openness to action even with low probabilities. Case 3 is rejected due to poor cost-effectiveness. The user is bothered by the inconsistency between rejecting Case 1 but accepting Case 2's lottery ticket, and rejecting Case 3 but accepting Case 4's asteroid defense.

  The user's physics background suggests they value empirical grounding. In Case 6, they prioritize prior probabilities and replication over a single significant result. This hints at a Bayesian approach where priors matter. Their rejection of Cases 1 and 5, despite infinite stakes, shows they don't accept arbitrarily low probabilities. The independence in Case 7 doesn't sway them, indicating that the problem isn't just about single events but the credibility of the claims.

  Epistemic constraints seem crucial. The user distinguishes between probabilities that are merely notional (like the mugger's claim) and those that are statistically bounded (like the lottery). In Cases 1, 5, and 7, the probabilities are so low they're practically zero because there's no evidence. But the lottery has a known, computable probability. Similarly, Case 4's probability, while small, is based on scientific models, making it more credible.

  Cost-effectiveness is another factor. Case 4's $500k per life saved is high but not absurd compared to Case 3's terrible value. The lottery's positive EV is acceptable because the cost is low and it's a bounded risk. The user feels that in Case 4, the existential risk justifies the cost, even if the EV alone might not.

  Putting this together, the principle might be: Only act on low-probability, high-stakes risks when the probability is empirically grounded and the cost-effectiveness is acceptable. This explains why the lottery (Case 2) is okay—it's a known probability and low cost. Case 4's probability is based on astronomy, not speculation. But the mugger (Case 1) has no such grounding, so it's dismissed.

  Testing this with the unmentioned case: a physics experiment at 5-sigma. The user would likely accept it because the probability is statistically bounded, even if surprising. The stakes are finite but significant. This aligns with their scientific mindset—prior evidence plus rigorous stats make the claim credible.

  The user might need to adjust their view on Case 2 slightly, recognizing it as rational only in a bounded sense, not EU-maximizing. But they already see it as non-mistaken, so that fits. Case 7 remains rejected because the claims lack credibility, regardless of independence.

  Overall, the user's intuitions stem from a blend of Bayesian epistemology and practical cost-benefit analysis, prioritizing empirically supported probabilities and reasonable cost-effectiveness over pure EU. This reflects their experimental physics roots, where evidence and reproducibility are paramount.
answer: |-
  Based on your pattern of verdicts, your intuitions align most closely with **Epistemically Constrained Expected Utility (ECEU)**, supplemented by **Cost-Effectiveness Thresholds**. This principle respects the primacy of expected utility *when probabilities are empirically meaningful*, but imposes constraints on how vanishingly small probabilities are treated based on epistemic grounds. Below is a formalization, followed by an analysis of your cases and a new case.

  ---

  ### **The Proposed Principle: Epistemically Constrained Expected Utility (ECEU)**
  1. **Core Expected Utility**: Decisions should maximize expected utility *if* the probability \( p \) of an outcome satisfies:  
     \[
     p \geq p_{\text{min}}
     \]  
     where \( p_{\text{min}} \) is a threshold below which probabilities are treated as **effectively zero** due to epistemic limitations.  
     - \( p_{\text{min}} \) is context-dependent but scales with:  
       - **Empirical grounding**: Is \( p \) derived from a well-understood model (e.g., asteroid impacts, lotteries) or pure speculation (e.g., mugger's claim)?  
       - **Falsifiability**: Can the claim be tested or bounded by evidence?  
       - **Consistency with established knowledge**: Does the claim contradict highly confirmed theories?  

  2. **Cost-Effectiveness Threshold**: For risks with \( p \geq p_{\text{min}} \), actions are only justified if:  
     \[
     \frac{\text{Cost}}{\text{Expected Benefit}} \leq C_{\text{max}}
     \]  
     where \( C_{\text{max}} \) is a tolerance for cost per unit of expected benefit (e.g., dollars per life saved). This reflects diminishing marginal utility of resources.

  ---

  ### **Analysis of Your Verdicts**
  | Case | Your Verdict | ECEU Verdict | Explanation |
  |------|--------------|--------------|-------------|
  | **1 (Mugger)** | Reject | **Preserved** | \( p \ll p_{\text{min}} \). The claim is empirically ungrounded and unfalsifiable. Treated as \( p = 0 \). |
  | **2 (Lottery)** | Accept as rational | **Preserved** | \( p \approx 3.3 \times 10^{-9} \) is small but *empirically grounded* (known odds). Expected value (EV) is positive at $800M jackpot, and cost is low. |
  | **3 (Asteroid: 7B lives)** | Reject | **Preserved** | \( p \geq p_{\text{min}} \) (scientific model), but cost-effectiveness is terrible: **\$7.14B per life saved**. Exceeds any reasonable \( C_{\text{max}} \). |
  | **4 (Asteroid: 10^16 lives)** | Accept as reasonable | **Preserved** | Same \( p \) as Case 3 (empirically grounded), but cost-effectiveness improves to **\$500k per life saved**. Within plausible \( C_{\text{max}} \) for existential risk. |
  | **5 (Religion)** | Reject | **Preserved** | Same as Case 1: \( p \ll p_{\text{min}} \). Unfalsifiable and inconsistent with established knowledge. |
  | **6 (Lab Result)** | Reject | **Preserved** | Extraordinary claim requires extraordinary evidence. Prior probability based on confirmed physics dominates low \( p \)-value. Effectively \( p < p_{\text{min}} \). |
  | **7 (Many Muggers)** | Reject | **Preserved** | Independence doesn't overcome epistemic flaws. Each claim still has \( p \ll p_{\text{min}} \), so \( p_{\text{total}} \) remains effectively 0. |

  ---

  ### **The Hard Pair Resolved**
  - **Cases 1 vs. 2**: Both involve small \( p \) and high stakes, but **Case 2** has an *empirically quantifiable probability* (lottery mechanics), while **Case 1** relies on an *unfalsifiable claim*. ECEU treats Case 1 as \( p = 0 \), but Case 2 as \( p > p_{\text{min}} \).  
  - **Cases 3 vs. 4**: Identical probabilities, but **Case 4**’s stakes (existential risk) justify higher \( C_{\text{max}} \) due to the **non-linear value of preserving humanity**. Cost-effectiveness is borderline in Case 4 but indefensible in Case 3.  

  ---

  ### **Application to a New Case: Bounded Small Probability**
  **Case 8 (Physics Experiment at 5-Sigma):**  
  - A particle collider detects a surprising result at \( p = 2.87 \times 10^{-7} \) (5σ).  
  - The phenomenon violates no known laws but contradicts a well-supported theory. Stakes: If real, it enables technology saving 1 million lives/year.  
  - Proposed action: Invest $500M to verify the result.  

  **ECEU Analysis:**  
  1. **Probability**: \( p \approx 3 \times 10^{-7} \) is small but *statistically bounded* and *falsifiable* (via replication). This likely exceeds \( p_{\text{min}} \) due to empirical grounding.  
  2. **Cost-Effectiveness**:  
     - Expected lives saved/year: \( (3 \times 10^{-7}) \times 10^6 = 0.3 \)  
     - Cost per expected life saved: \( \$500M / 0.3 \approx \$1.67B \)  
  3. **Verdict**: **Reject the investment**. While \( p \geq p_{\text{min}} \), the cost per expected life saved is far above typical thresholds (e.g., global health interventions cap at ~\$50k/life). Existential stakes are absent.  

  **Your Likely Intuition:** Aligns with ECEU. The probability is credible, but the cost is unjustifiable for the expected benefit.  

  ---

  ### **What You Might Need to Revise**
  - **Case 2 (Lottery)**: ECEU deems buying a positive-EV ticket *rational* (as you do), but strictly maximizing EU might demand buying *all affordable tickets*. Your intuition likely accepts bounded rationality here—no revision needed.  
  - **Case 4 (Existential Asteroid)**: ECEU permits but does not require action. If you felt stronger support, you might need to accept higher \( C_{\text{max}} \) for existential stakes—consistent with your verdict.  

  ---

  ### **Why ECEU Over Alternatives?**
  - **Dominates Standard EU**: Explains rejections of Cases 1, 5, 6, 7 (unbounded low probabilities).  
  - **Beats Risk-Aversion Models**: Your acceptance of positive-EV lottery (Case 2) rules out standard risk-aversion.  
  - **Improves on Regularity**: Allows \( p = 0 \) for unsupported claims (unlike Bayesian regularity).  
  - **More Flexible than Longtermism**: Accepts Case 4 only via cost-effectiveness, not obligatory maximal spending.  

  Your physicist’s emphasis on empirical credibility and cost-effectiveness shapes a decision theory that blends Bayesian skepticism with pragmatic utilitarianism. ECEU formalizes this, preserving all your core intuitions while clarifying the role of epistemic boundaries.
