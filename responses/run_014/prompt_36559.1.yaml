  First, I need to anticipate objections this crowd would raise. Scholastically trained folks will use distinctions, so objections should be structured with premises and distinctions. The user mentioned texts like De Regno and Summa Theologiae on killing. Key points: Aquinas discourages killing tyrants due to potential chaos but allows it if done by public authority. The ambiguity around usurpers is central.

  Possible objections:
  1. **Objection based on Aquinas's distinction in the Summa (ST II-II Q64 A3)**: He mentions killing by public authority is lawful. The objection could be that this applies only to legitimate authorities, not rebels. How does the usurper fit in? The user's thesis says Aquinas doesn't resolve this, so the reply needs to highlight that ambiguity. Weakness: Aquinas might imply existing structures only.

  2. **De Regno's emphasis on toleration**: The audience might argue Aquinas prioritizes order over justice, making resistance quietist. Reply: Aquinas does permit removal if possible without greater evil, but the method (public authority) is key. Weakness: The texts focus on the dangers, not mechanisms for usurpers.

  3. **Later reception (Bellarmine/Suarez)**: Political theorists might say these thinkers resolved the ambiguity using Aquinas. Reply: Yes, but they added principles like popular sovereignty, which Aquinas doesn't explicitly state. Weakness: Aquinas's texts don't provide a clear basis for their extensions.

  4. **Restating standard commentary**: The user fears this. Objection that their thesis is just a dressed-up version of existing scholarship. Reply: While elements are recognized, the synthesis and focus on authority's source as the critical ambiguity is original. Weakness: Needs textual evidence beyond the synthesis.

  5. **Thomistic natural law**: If tyranny is injustice, natural law might permit killing regardless of authority. Reply: Aquinas separates private revenge from public justice. Private killing is always prohibited. Weakness: Whether natural law mandates resistance isn't addressed.

  Ordering by damage: The usurper authority objection (#1) is most damaging as it challenges the core ambiguity. Then later reception (#3) as it questions the thesis's novelty. Standard commentary (#4) affects originality. Toleration (#2) and natural law (#5) are less critical.

  For replies, each must be under two minutes. Highlight Aquinas's texts, point out where he's silent, and distinguish from later thinkers. Acknowledge weaknesses like lack of explicit textual support for popular sovereignty.

