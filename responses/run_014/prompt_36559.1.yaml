answer: |-
  Here is your Q&A sheet, ordered by potential damage to your thesis, with scholastically phrased objections, concise replies (under 2 mins), and notes on soft spots. Key texts assumed: *De Regno* (esp. ch. 6-7) and *ST* II-II, q. 64, a. 3.

  ---

  ### **Q&A Sheet: Aquinas on Tyrannicide**

  **1. Objection (Most Damaging: Undercuts Core Thesis)**  
  *Objector:* "Distinguo: Your thesis turns on ‘public authority’ resolving the usurper ambiguity. Sed contra, in *ST* II-II, q.64, a.3, Aquinas explicitly restricts licit killing *ad auctoritatem publicam* to those holding *legitimate* office (e.g., judges). When the ruler is a *usurper*, no such office exists. Ergo, Aquinas *does* settle the issue: no one licitly kills the usurper *as public authority*, since authority is null. Your ‘underdetermination’ is a misreading."  
  **Reply:** "Respondeo: Aquinas defines public authority functionally—as acting *for the common good* (*propter bonum commune*), not solely by title. In usurpation, he is silent on *who* holds this function (e.g., the people collectively? Nobles? *ST* I-II, q.90, a.3 implies authority derives from the community). Where he *is* determinate is that *private* killing is always illicit (*nullo modo licet*). The usurper gap persists precisely because he never identifies the functional authority-source absent a lawful ruler."  
  **Soft Spot:** Assumes Aquinas *intends* functional authority. Opponent could argue he only recognizes *de jure* officeholders.

  ---

  **2. Objection (High Damage: Challenges Originality)**  
  *Objector:* "Concedo your public/private distinction, sed contra, this is the standard reading (e.g., Finnis, Gilby). Your ‘underdetermination’ thesis merely restates their work. Nonne?"  
  **Reply:** "Respondeo: While commentators note the distinction, they underplay its *systematic* role in *causing* later disputes. Finnis/Gilby treat ambiguity as incidental; I argue it’s the *engine* of reception history. Aquinas’ silence on usurpation isn’t a gap—it’s the pivot allowing both Bellarmine (popular authority) and quietists (no authority sans ruler) to claim him. My synthesis shows why *this specific indeterminacy* explains the polemics."  
  **Soft Spot:** If audience thinks your "pivot" point is implicit in existing scholarship, it weakens novelty.

  ---

  **3. Objection (Moderate Damage: Leverages Later Reception)**  
  *Objector:* "Sed contra, Suarez (*De Legibus* III.4) and Bellarmine (*De Laicis* ch.6) resolve your ‘gap’ via Aquinas: authority reverts to the *populus* under tyranny. Since they claim his principles, doesn’t this confirm Aquinas *implies* popular authority?"  
  **Reply:** "Respondeo: Distinguo: They *develop* his principles, but Aquinas himself never locates authority in the *populus* for tyrannicide. *De Regno* (I.6) warns against *popular* action due to disorder risk. Suarez/Bellarmine import Aristotelian *popular sovereignty* (cf. *Politics* III.15)—a step beyond Aquinas, who treats the people as beneficiaries of authority, not its holders (*ST* I-II, q.90, a.3 ad 2)."  
  **Soft Spot:** Aquinas *does* say the ruler’s authority is "from God *through* the people" (*De Regno* I.7), leaving room for interpretation.

  ---

  **4. Objection (Lower Damage: Textual Counterweight)**  
  *Objector:* "In *De Regno* I.6, Aquinas prioritizes tolerating tyranny over ‘greater perils’ from resistance. Doesn’t this *praxis* of caution override your authority distinction, implying quietism?"  
  **Reply:** "Respondeo: Distinguo: Toleration is *prudential*, not doctrinal. He says removal is *praiseworthy* (*laudabilis*) if possible without worse outcomes (I.7). The authority distinction is the *deontological* frame: even if prudent, private killing remains illicit. His caution reinforces, not overrides, the distinction: public authority alone can weigh such prudence."  
  **Soft Spot:** Aquinas’ emphasis on danger *could* be read as making prudence primary.

  ---

  **5. Objection (Least Damage: Natural Law Angle)**  
  *Objector:* "Sed contra: Tyranny violates natural law (*ST* I-II, q.93, a.3). Since anyone may resist injustice (cf. *ST* II-II, q.69, a.4), doesn’t this license private killing of a usurping tyrant?"  
  **Reply:** "Respondeo: Negative. Aquinas *distinguishes* resisting injustice (licit for all) from *killing* (restricted to authority). *ST* II-II, q.64, a.7 allows self-defense, but not premeditated killing. Killing a tyrant usurps judgment, which requires public role (*actus iudicii*). Natural law forbids private usurpation of public functions."  
  **Soft Spot:** If tyranny is ongoing violence (e.g., genocide), Aquinas *might* allow lethal self-defense by individuals—but this is extrapolated.

  ---

  ### **The Dreaded Question (You Suspect): #2**  
  As predicted, the sharpest challenge is originality. The reply (#2) must frame your contribution as synthesizing the distinction’s *systematic consequences* for reception history—not just noting the gap.

  **Word Count:** 895 (American English).  
  **Delivery Tip:** For objections #1–3, preempt by emphasizing Aquinas’ functional view of authority (*bonum commune*) in your presentation.
