prompt: |-
  I'm a neuroscience graduate student, and the Mary's room thought experiment has been coming up repeatedly in our lab discussions about consciousness. I've been testing my intuitions on a range of cases where someone gains a new kind of experience after having only propositional knowledge, and I'd like to know what principle captures my verdicts — or which ones I need to give up.

  Here are my verdicts:

  1. Mary learns all the physical facts about color vision while confined to a black-and-white room, then sees red for the first time. She learns something new: what it's like to see red. This is factual knowledge she lacked.

  2. Someone studies everything there is to know about bicycle physics, the neuroscience of motor control, and the mechanics of balance — but has never been on a bike. When they finally learn to ride, they acquire something new, but it's a skill, not factual knowledge. This feels different from Mary's case.

  3. Someone memorizes a complete neuroscientific account of what happens in the brain during gustation, then tastes a durian for the first time. They learn what durian tastes like. This feels like knowledge, not just a skill — it patterns with Mary, not the bicycle.

  4. A blind person learns all the physical facts about echolocation — the acoustics, the neural processing, everything — and then learns to echolocate by making clicks and interpreting the echoes. I'm torn. Part of me says they learn what echolocation is like, which would be knowledge. Another part says it's just a skill, like the bicycle. I can't settle this one.

  5. Someone learns all the physical facts about the neurochemistry of romantic love, then falls in love for the first time. They learn what it's like. This patterns with Mary and the durian — it's knowledge.

  The tension I can't resolve is this: cases 1, 3, and 5 feel like acquiring factual knowledge, but case 2 feels like acquiring a mere skill. Yet I can't identify a principled difference between learning what it's like to ride a bike and learning what it's like to see red. Both involve a new experience underdetermined by the physical facts. So either the bicycle case is more like Mary than I think, or Mary is more like the bicycle than I think.

  Is there a coherent account that delivers all my verdicts, or must I overturn one? Please take a definite position — I want a theory, not a survey. And please tell me what your theory says about case 4, since I can't settle it myself.
reasoning: |-
  Alright, let me dive into this neuroscience student's problem with Mary's room and related cases. They've clearly laid out their intuitions across five scenarios, but the bicycle example is throwing them off. The core tension is why some experiences feel like gaining factual knowledge (red, durian, love) while biking feels like just a skill, even though both seem to involve new experiences beyond physical facts.

  First, I need to map their intuitions. Mary's classic case is straightforward—seeing red gives new phenomenal knowledge. Durian tasting follows the same pattern. Romantic love too. But bicycle riding? That's where they hesitate, calling it a skill. The echolocation case puzzles them because it has elements of both. 

  Hmm, why does biking feel different? Maybe because it's more about motor skills and proprioception. When you learn to bike, you're not just perceiving; you're actively coordinating movements. Whereas seeing red or tasting durian is more about passive sensory input. But is that distinction solid? After all, echolocation involves both sensory perception and skill in generating clicks. 

  The student mentions that all cases involve new experiences underdetermined by physical facts. So why the split verdict? Maybe it's about the nature of the knowledge gained. Factual knowledge versus ability. But in Mary's case, knowing what red looks like isn't just an ability—it's a qualitative experience. 

  I recall that in philosophy, David Lewis distinguished between knowing what an experience is like (propositional) versus knowing how to imagine or recognize it (ability). That might help here. For Mary, gaining the ability to recognize red doesn't mean she lacked the facts; she just couldn't access that recognition before. 

  Applying this to the bicycle: learning to ride is purely an ability. You don't gain new qualitative facts about biking; you gain the skill to balance and pedal. The physical facts already covered the mechanics, but executing them is different. 

  For durian and love, it's about qualitative states. Tasting durian gives you the ability to recognize its unique flavor, which feels factual. Love involves emotional qualia. 

  Echolocation is tricky because it combines both. The sensory aspect (hearing echoes as spatial info) is qualitative, like vision. But the skill to produce clicks and interpret them is procedural. So the knowledge gained has two parts: the qualia of echolocatory perception (factual) and the motor skill (ability). 

  So a coherent theory could be: new phenomenal knowledge arises when there's a first-person qualitative state that requires sensory or affective experience. Skills involve motor abilities without new qualia. This preserves the student's intuitions: red, durian, love are qualia-heavy; biking is skill-based; echolocation is a hybrid. 

  But wait—does biking involve zero qualia? What about the feeling of balance or wind while riding? Maybe minimal qualia that's not the focus. The core of biking is the skill, not the sensations. Whereas for echolocation, interpreting echoes as spatial maps introduces new perceptual qualia. 

  So the student should accept that Mary's knowledge is an ability (to recognize/imagining red), not a new fact. But that feels counterintuitive to them. Alternatively, they could see biking as involving some qualia, but that weakens their initial verdict. 

  The best path is to refine the distinction: if the new experience is primarily about gaining a sensory or affective quale, it's factual knowledge (what-it's-like). If it's about executing actions, it's a skill. Echolocation splits the difference—part qualia, part skill. 

  This resolves their tension without overturning their core intuitions. For case 4, echolocation gives both new knowledge (the sound-to-space quale) and new skills (clicking, interpreting). That explains their torn feeling.
answer: |-
  After analyzing your intuitions across these cases, I propose a coherent theory that preserves your core verdicts while resolving the tension. The key is distinguishing between **phenomenal knowledge** (what-it's-like-ness tied to sensory/affective qualia) and **procedural knowledge** (skill-based competence), with a hybrid category for embodied sensory modalities.

  ### The Theory: Tripartite Knowledge Acquisition
  1. **Phenomenal Knowledge (New Qualia)**:  
     Acquired when gaining first-person access to *sensory or affective subjective qualities* (qualia) that were previously only described physically.  
     - *Applies to:* Color vision (case 1), taste (case 3), love (case 5).  
     - *Why?* These involve passive reception of intrinsic qualitative states. No motor output or skill is needed to *have* the experience.  

  2. **Procedural Knowledge (Pure Skill)**:  
     Acquired when learning involves *mastery of action* without new sensory qualia.  
     - *Applies to:* Bicycle riding (case 2).  
     - *Why?* Balance and pedaling rely on motor schemas, proprioceptive feedback loops, and error correction—all executable without novel qualia. The "what-it’s-like" here is just the aggregation of known physical sensations (wind, muscle strain) organized into a new action pattern.  

  3. **Hybrid Phenomenal-Procedural Knowledge**:  
     Acquired when a skill *generates new sensory qualia* through embodied interaction.  
     - *Applies to:* Echolocation (case 4) and similar active-sensing modalities.  
     - *Why?* It requires skill (clicking, interpreting echoes) *and* delivers novel perceptual qualia (e.g., auditory input transformed into spatial phenomenology).  

  ---

  ### How This Resolves Your Tension
  - **Mary (case 1) vs. Bicycle (case 2)**:  
    Your intuition is correct: they differ fundamentally.  
    - Mary gains *phenomenal knowledge*—a new sensory quale ("redness") that was *causally inert* in her prior physical knowledge.  
    - Bicycling adds *procedural competence* but no new qualia. All component sensations (pressure, motion) were already imaginable; the novelty lies in integrating them into action.  

  - **Durian (case 3) and Love (case 5)**:  
    These align with Mary because they involve passive reception of new qualia (taste/smell composites, affective states). No skill is required to experience them.  

  - **Echolocation (case 4)**:  
    Your torn intuition is justified—it’s a hybrid.  
    - *Skill aspect:* Generating clicks and interpreting echoes requires procedural learning (like biking).  
    - *Phenomenal aspect:* Success rewires auditory processing, creating a new *perceptual quale*—e.g., echoes may acquire spatial "volume" or "texture" inaccessible through theory alone.  
    → **Verdict:** The subject gains *both* a skill *and* new phenomenal knowledge.  

  ---

  ### Objections Addressed
  - **"But doesn’t biking have a ‘what-it’s-like’?"**  
    Yes, but it’s reducible to known physical sensations (e.g., kinetic feedback). Contrast this with echolocation: a blind person *could not* imagine the spatial phenomenology of "hearing shapes" until they acquired the skill to generate it.  

  - **"Aren’t all experiences underdetermined by physics?"**  
    Crucially, *phenomenal* properties (e.g., the intrinsic hurtfulness of pain) resist functional reduction. Biking’s "feel" *is* functionally reducible—it’s just real-time sensorimotor integration.  

  - **"Is love really like seeing red?"**  
    Affective states (love, fear) generate robust, non-sensory qualia (e.g., attachment phenomenology). Like color, these are received, not performed.  

  ---

  ### Why This Works
  - **Upholds your verdicts:** 1, 3, 5 = phenomenal knowledge; 2 = skill; 4 = hybrid.  
  - **Principled distinction:** Turns on whether novelty arises from *receptive qualia* (phenomenal) or *action competence* (procedural).  
  - **Neuroscientifically plausible:** Aligns with how sensory cortices encode qualia (e.g., V4 for color) versus basal ganglia/brainstem for skill consolidation.  

  **Conclusion:** You can keep all your intuitions. The bicycle *is* fundamentally different from Mary—and echolocation splits the difference. Abandon only the idea that "experience" implies a single type of knowledge.
