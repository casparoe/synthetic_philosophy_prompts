prompt: |-
  I'm in a philosophy of biology seminar and the etiological account of biological function keeps coming up — the Millikan-style view that a trait's function is just whatever it was selected for — and my group-mate built this argument that the etiological account proves way too much, and I can't get out of it. Here's what he wrote down:

  (1) A trait's function is just what it was selected for.
  (2) A trait was selected for F-ing just in case F-ing was a causal contribution to its fitness.
  (3) So a trait's function is just what it currently does causally to boost its fitness.
  (4) But that's exactly the causal-role account, the one the etiological account was supposed to be a rival to.
  (5) And on that account malfunction is impossible, since if a trait stops playing that causal role it stops having that function.
  (6) But malfunction is obviously real — a heart that's had an infarction still "has the function" of pumping blood, we'd all agree.
  (7) So the etiological account either collapses into the causal-role account and loses malfunction, or it's just incoherent.

  I feel like something slid between (2) and (3) but I can't name it. I'd rather keep (1) and (6) than give up either, and I honeslty don't want to conclude Millikan is wrong, but I cant point to the exact move that's doing the work. Can you tell me which step to reject, why it looked fine on the page, and what I'm paying by rejecting it? And if the real problem is that (2) is only true under one reading of "selected for" and false under another, say which reading the etiological account actually needs to hold.

  End your answer with a single line that begins "Verdict:" followed by the number of the step I should reject.
reasoning: |-
  Okay, the user is grappling with a philosophical argument against the etiological account of biological function. They're in a philosophy of biology seminar and their group-mate has constructed an argument claiming that Millikan's view collapses into the causal-role account and makes malfunction impossible. The user feels something's wrong between steps (2) and (3) but can't articulate it. They want to preserve both the etiological account and the reality of malfunction.

  First, I need to unpack the argument. Premise (1) is standard Millikan: a trait's function is what it was selected for. Premise (2) defines selection: selected for F-ing means F-ing causally contributed to fitness. The conclusion (3) then says function is just what currently boosts fitness. That's problematic because it leads to (4) - collapsing into the causal-role view - and then to (5) which says malfunction becomes impossible since function depends on current contribution. But (6) points out that malfunction is real (like a damaged heart still having blood-pumping function), so (7) concludes the etiological account is either incoherent or collapses.

  The key flaw is definitely in step (3). The etiological account strictly separates past selection from current performance. Millikan would reject (3) because it conflates what the trait was historically selected for with what it currently does. The critical word is "currently" - that's where the slide happens. 

  For example, hearts were selected for pumping blood in ancestors. A modern heart with infarction doesn't pump well now, but its function is still pumping because that's why hearts exist today. The "selected for" in (2) refers to historical causation across generations, not present contribution. The user's group-mate has equivocated on the timeframe.

  Rejecting (3) doesn't cost much. It preserves the core etiological insight while acknowledging that malfunction occurs when a trait fails to perform its historically determined function. The only "cost" is accepting that function is backward-looking - which is the whole point of Millikan's account anyway.

  The user might be hesitant because (3) seems logically derived from (1) and (2), but only if we ignore the temporal aspect baked into "was selected for." By clarifying that "was" refers strictly to evolutionary history, we block the collapse. The reading of "selected for" needed for etiological accounts is the historical one, not the synchronic one implied in (3).

  Verdict: step (3) is where the argument fails. The user should reject it because it misrepresents the etiological account by collapsing historical function into current causal role. Millikan remains intact, and malfunction is perfectly explicable as failure to perform the historically selected function.
answer: |-
  You've rightly spotted a subtle but fatal equivocation in the argument between (2) and (3). The move that causes the collapse is **step (3)**, and here's why:

  1.  **Why (3) is the Problem:** Step (3) interprets "what it was selected for" (from (1) and (2)) as "what it **currently** does causally to boost its fitness." This is a massive shift in tense and reference. The etiological account (Millikan, Neander, etc.) is **explicitly historical**. A trait's function is **what its ancestors did in the past** that caused them to be selected, thereby explaining why the trait exists *now*. Step (3) erases this history and reduces function to *current* causal contribution. This is *not* what the etiological account claims.

  2.  **Why (2) Looked Fine (The Equivocation):** Premise (2) is ambiguous. It *can* be read in a way that *seems* compatible with etiological theory:
      *   **Acceptable (Historical) Reading of "selected for":** "A trait T (in current organisms) was selected for F-ing just in case F-ing by **ancestral tokens** of T was a causal contribution to **their** fitness (and thereby causally contributed to the propagation and current existence of T)."
      *   **Problematic (Synchronic) Reading of "selected for" (Implied in (3)):** "A trait T (in a current organism) was selected for F-ing just in case F-ing by **this current token** of T is a causal contribution to **its current individual** fitness (or the fitness of its bearer)."
      The argument slides from the acceptable historical reading needed for the etiological account (used implicitly in (1) and stated in (2)) to the problematic synchronic reading in (3). The etiological account absolutely relies on and requires the **historical reading**. The synchronic reading transforms it into a causal-role account.

  3.  **What You Pay by Rejecting (3):** Rejecting (3) costs you very little within the etiological framework. You simply reaffirm the core commitment that function is defined by *past* selection, not *current* performance. This is precisely what allows the etiological account to:
      *   **Distinguish itself from the causal-role account:** Function is historical explanation, not current causal role.
      *   **Explain malfunction:** A trait has the function F *because* doing F is what its ancestors were selected for. A *current* token of the trait can *fail* to do F (or fail to contribute to fitness by doing F) and still have F as its function. It malfunctions precisely *because* it fails to perform the historically defined function F. (Your group-mate's point (6) about the heart is actually a *strength* of the etiological account, not a problem for it).
      *   **Explain vestigial traits:** A trait can have a function (based on past selection) even if it performs no beneficial causal role *now*.

  4.  **Addressing the Other Premises:**
      *   **(1)** is the core etiological claim. Keep it.
      *   **(2)** is acceptable *only* under the **historical reading** clarified above. The etiological account needs this reading. The synchronic reading makes (2) false for the etiological account.
      *   **(4)** only follows if (3) is accepted. Rejecting (3) blocks the collapse.
      *   **(5)** only applies to the causal-role account (or the misinterpreted etiological account in (3)). It's *not* a consequence of the *actual* etiological account.
      *   **(6)** is correct and is *explained* by the etiological account (see above).
      *   **(7)** is avoided because the collapse doesn't happen once the equivocation is resolved.

  **Verdict: Reject step (3).** The move from "what it *was* selected for" (historical) to "what it *currently* does" (synchronic) is illegitimate within the etiological framework and creates the false impression of collapse. Function is fixed by past selection history, not current causal contribution.
