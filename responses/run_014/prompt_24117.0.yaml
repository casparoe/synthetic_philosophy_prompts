prompt: |-
  Compare epistemic contextualism — the view that whether a subject knows that p depends on the conversational context in which the attribution is made — with pragmatic encroachment — the view that the practical stakes or interests at issue affect whether the subject knows that p. Both views predict that a subject may be credited with knowing that p in a low-stakes setting but not in a high-stakes one. Given this overlap, what exactly do the two views disagree about? In particular, is the difference between them substantive, or is it merely a difference about where the context-sensitivity is located — in the conversational context on the one hand, and in the practical situation on the other?
reasoning: |-
  Okay, the user is asking about the difference between epistemic contextualism and pragmatic encroachment. Both theories agree that knowledge attributions can vary with stakes—someone might be considered to know something in a low-stakes situation but not in a high-stakes one. But they're asking whether the disagreement is substantive or just about where the context-sensitivity is located.

  First, I need to recall the core of each view. Contextualism says that the meaning of "knows" changes based on the attributor's context. So when the stakes are high, the standards for knowledge go up. Pragmatic encroachment, on the other hand, argues that knowledge isn't just about truth and belief but also practical factors like what's at stake for the subject. So the subject's own situation affects whether they know.

  The user is pointing out that both predict the same outcome in varying stakes scenarios. So where's the real disagreement? Maybe it's about the nature of knowledge itself. Contextualism keeps knowledge purely epistemic but makes the word context-sensitive. Pragmatic encroachment mixes practical factors into knowledge itself. That seems like a big philosophical difference.

  Also, the location of context-sensitivity differs. Contextualism focuses on the attributor's conversational context, while pragmatic encroachment looks at the subject's practical situation. But is that just a surface difference? Probably not, because it ties into deeper debates about whether knowledge is influenced by practical concerns.

  I should think about examples. Take DeRose's bank case. In a low-stakes context, attributor A says S knows the bank is open. In high-stakes, attributor B says S doesn't know. Contextualism explains this by saying "knows" means different things in each context. Pragmatic encroachment would say S's knowledge changes based on their own stakes, regardless of the attributor.

  But what if the stakes are high for the subject but the attributor is in a low-stakes context? Contextualism might still say S knows if the attributor's standards are low. Pragmatic encroachment would say S doesn't know because their stakes are high. That's a key divergence showing the difference is substantive.

  The user might be trying to understand if these theories are just two sides of the same coin. But the answer is no; they have different implications for epistemology. Contextualism preserves a purer epistemic notion, while pragmatic encroachment blurs the line between epistemic and practical. This affects how we define knowledge and its role in rational action.

  Also, considering the user's deeper needs: they might be studying epistemology, preparing for an exam, or writing a paper. They need a clear distinction to grasp the theories. They might also be interested in how these views handle skepticism or the relationship between knowledge and action. Clarifying the substantive disagreement helps them apply these concepts correctly.

  I should make sure to highlight the theoretical commitments: contextualism's semantic flexibility vs. pragmatic encroachment's expansion of knowledge factors. Emphasize that while both accommodate stakes sensitivity, they do so through fundamentally different mechanisms with broader philosophical consequences.
answer: |-
  The overlap you note is significant—both contextualism and pragmatic encroachment predict that knowledge attributions can shift with stakes—but their disagreement is **substantive**, not merely about the *location* of context-sensitivity. Here's a breakdown of the core differences:

  ### 1. **Nature of the Underlying Mechanism**
     - **Contextualism**:  
       - **Semantic/linguistic thesis**: The word "knows" is *context-sensitive*, like indexicals (e.g., "I," "here"). Its semantic content (i.e., the epistemic standard required) shifts with the **attributor's conversational context**.  
       - **Knowledge itself is invariant**: Whether a subject *has* knowledge (under a fixed epistemic standard) doesn’t change with practical stakes. Only what we *mean* by "knows" changes.  
       - *Example*: In a low-stakes context, "S knows the bank is open" means S meets a low epistemic standard. In a high-stakes context, the same sentence means S meets a high standard (which S may fail).

     - **Pragmatic Encroachment**:  
       - **Metaphysical/epistemic thesis**: Knowledge depends *constitutively* on **practical factors affecting the subject** (e.g., stakes, interests).  
       - **Knowledge itself is variant**: What constitutes knowledge changes with the subject’s practical situation. Even if the epistemic standard is fixed, stakes affect whether justified true belief counts as knowledge.  
       - *Example*: S has the same evidence about the bank in low/high-stakes scenarios. In low stakes, this evidence suffices for knowledge; in high stakes, it does not—because knowledge requires more evidence when error costs are high.

  ### 2. **What Drives the Change?**
     - **Contextualism**: The attributor’s conversational goals, salience of error possibilities, or communal norms determine the epistemic standard.  
     - **Pragmatic Encroachment**: The subject’s practical interests (e.g., the cost of being wrong) directly impact whether their belief rises to the level of knowledge.

  ### 3. **Key Disagreement: The Purity of Epistemology**
     - **Contextualism** preserves a "pure" epistemology:  
       - Knowledge is strictly a relation between a subject, a proposition, and evidence/reliability. Practical factors only affect *language*, not knowledge itself.  
     - **Pragmatic Encroachment** rejects this purity:  
       - Practical stakes are part of *what knowledge is*. Ignoring them mischaracterizes knowledge’s role in rational action (e.g., "knowledge-action norms": if you know P, you can act on P).

  ### 4. **Divergent Predictions**
     While both views predict shifting knowledge attributions in standard cases (e.g., DeRose’s bank cases), they clash in **asymmetric situations**:
     - **Case 1**: *High stakes for subject, low stakes for attributor*.  
       - Contextualism: Attributor uses a low standard → "S knows."  
       - Pragmatic Encroachment: S’s high stakes raise the bar for knowledge → S *does not know*.  
     - **Case 2**: *High stakes for attributor, low stakes for subject*.  
       - Contextualism: Attributor uses a high standard → "S does not know."  
       - Pragmatic Encroachment: S’s low stakes mean lower evidential requirements → S *knows*.

  ### 5. **Theoretical Motivations**
     - **Contextualism** aims to resolve skeptical paradoxes by allowing "knowledge" to flexibly accommodate ordinary/high-stakes contexts without contradiction.  
     - **Pragmatic Encroachment** ties knowledge to rational action: if acting on P risks disaster, you need stronger evidence to "know" P—otherwise, claiming knowledge violates practical rationality.

  ### Conclusion: Substantive, Not Merely Terminological
  The debate is **not** just about "where context-sensitivity is located." It’s about:  
  - Whether practical stakes are **external to knowledge** (contextualism) or **internal to it** (pragmatic encroachment).  
  - Whether epistemology is autonomous from practical reasoning.  
  - How to explain the link between knowledge and action.  

  While both views accommodate stakes-sensitivity, they represent **fundamentally different accounts of knowledge**: one semantic, the other metaphysical. Pragmatic encroachment challenges the traditional view that knowledge is purely truth-directed, while contextualism attempts to preserve that purity by outsourcing variability to language.
