prompt: |-
  I'm a high school senior who runs a small philosophy-of-science podcast, and next week's guest is a philosopher of biology who defends Gould and Lewontin's spandrels critique of adaptationism. I'd like to prepare a set of interview questions that go beyond having her simply restate the critique, so could you draft eight to ten questions for me? I want at least one question each on three things: the distinction between an adaptation, a byproduct (a "spandrel"), and an exaptation, and why drawing that line matters; what exactly the "Panglossian paradigm" is, including whether its target is the claim that every trait is an adaptation or the stronger claim that every trait is optimally designed for a specific function; and at least one concrete biological case, such as feathers or the peacock's tail, where the classification is genuinely contested. For each of those three, please add a follow-up keyed to the answer she is most likely to give, and close the set with a question about what kind of evidence could count against the spandrels critique itself.
