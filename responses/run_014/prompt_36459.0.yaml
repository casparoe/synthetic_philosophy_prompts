  For the moral vs rational distinction, I recall Clifford frames it as a societal duty - he's worried about how careless beliefs pollute the "common stock". But labeling it "morally wrong" feels strong when applied to private beliefs like trusting one's partner. Maybe Clifford's real target is social consequences.

  The evidence standard is tricky. The shipowner example uses actual evidence (he avoided inquiry), but the agitators case explicitly references evidence they "might easily have obtained". So both readings exist in Clifford's text. The user is right to flag this tension.

  On the target question, Clifford explicitly says actions are primary but beliefs become blameworthy when they're "stolen" (formed without due diligence). This three-way distinction is crucial - I should map belief formation, maintenance and action separately.

  About scope - the "anyone, anywhere" language seems absolute, but Clifford's own examples focus on high-stakes scenarios. The user's example of trusting a partner suggests this absolutism might be unsustainable in practice.

  Now for grading each interpretation:
