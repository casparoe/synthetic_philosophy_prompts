  The user might be wondering if their approach is ahead of philosophy or if there's a deeper challenge. Since their field already treats outputs as data, they've adopted the methodological part. The residue is the philosophical commitment to explaining consciousness, which isn't applicable to LLMs. So they can set aside the consciousness aspect but might consider the method validated for behavioral studies.

