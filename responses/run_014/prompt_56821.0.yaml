  First, I need to establish Dewey's theoretical framework circa 1937: the structure of inquiry from indeterminate to determinate situation, warranted assertibility, anti-spectator epistemology. Then map it to the commission's work - the Moscow Trials as indeterminate situation, their problem formulation as "are these trials legitimate?", with hypotheses ranging from "wholly fabricated" to "substantially true." 

  The operational testing question is tricky. Since they couldn't experiment on the actual events, they treated testimony and documents as the material to be operationally tested through cross-examination and consistency checks. The Beals walkout becomes fascinating here - does it represent inquiry breakdown or healthy self-correction? Dewey's framework suggests the latter if dissent was procedural rather than substantive. 

  Flipping it: does this case rescue experimentalism from the "lab-only" critique? Partially - it shows inquiry can work for historical events through rigorous examination of evidence, but concedes limitations when key data is inaccessible. The Trotsky withholding revelation later tests fallibilism - the original verdict was warranted then, though new evidence would require re-inquiry. 

