  I've been an atheist since my early twenties and currently put my credence in theism somewhere around 1 in 50. The argument from divine hiddenness — that a perfectly loving God would ensure no one ever fails to believe in God through no fault of their own, and that such nonresistant nonbelievers do in fact exist, so no such God exists — should be my strongest card, yet I find it moves me much less than the problem of evil, and I can't tell whether that reflects a real weakness in the argument or just that I'd already priced its conclusion in. So give me your credence that the argument is sound, decomposed into terms like: the probability that a perfectly loving God would guarantee nonresistant belief in every person; the probability that nonresistant nonbelief actually occurs, given how hard it is to distinguish it from culpably motivated unbelief or from cases where the person could have sought more honestly; the probability that the standard defenses (skeptical theism, the value of free inquiry, divine respect for epistemic autonomy) all fail; and anything else you think belongs in the decomposition. Assign a rough number and a line of justification to each term, show how they combine into your overall figure, and identify which term dominates the result. My theist friend puts the soundness of the argument at about 0.05, and I'd also like to know where, given your decomposition, her disagreement with me most likely lives.
