prompt: |-
  I'm a science and ideas journalist preparing a long-form interview with a philosopher of artificial intelligence who has argued that the frame problem reflects a fundamental, not merely technical, limitation of symbolic approaches to reasoning. I'd like you to draft eight to ten interview questions that go well beyond the standard "what stays the same when something changes" framing. I want at least one question each on: the distinction between the inertia problem and the qualification problem, and why the two are so often conflated; the argument that the frame problem cannot be solved by simply adding more axioms or background knowledge, and what exactly that argument depends on; and the relationship between the frame problem and the broader common-sense problem in AI. For each of these three, include a follow-up question keyed to the answer the guest is most likely to give, and make the follow-up one that would be hard to deflect.
