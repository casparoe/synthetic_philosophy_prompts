  *scribbles notes* The model answer needs to walk this tightrope: Grant that her method looks empirical while showing why it's still bootstrapping. The overgeneralization test is crucial—if rejecting Mira means rejecting all track-record arguments, that's a problem. The thermometer comparison is perfect for this; students must explain why trusting thermometers isn't circular but trusting dream-memories is.

  Marking scheme traps to anticipate: Students might (1) miss that memory contaminates the journal data, (2) equate her method with induction generally, (3) ignore the non-recording of non-matches, (4) fail to construct a non-bootstrapping alternative, or (5) dodge the overgeneralization challenge. The 16-20 tier requires connecting all these dots while spotting the journal's false objectivity.

