  I should also discuss the problem of higher-level properties being epiphenomenal. If all causal work is done by physical properties, then mental properties don't add anything. The user wants a rigorous argument, so using Kim's property exemplification model would help. Emphasize that causation requires properties, not just events.

  Another angle: the subset strategy. While it claims physical properties realize a subset of causal powers, Kim would argue that the subset is still determined by the physical base. So the mental property doesn't contribute anything new.

