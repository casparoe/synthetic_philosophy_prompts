  If they use EDT:

  Let V be "I am the victim", and NV be "I am not the victim".

  If I pay:
    - If I am the victim (50%), then I lose $1000 and my secret is safe.
    - If I am not the victim (50%), then both secrets are revealed (which is bad for me) and I lose $1000.

  If I don't pay:
    - If I am the victim (50%), then I don't lose money but my secret is revealed.
    - If I am not the victim (50%), then I don't lose money and my secret is safe (only the victim's secret is revealed).

  So the expected payoff for paying:

    - Victim: -1000 (money) but secret safe, say utility -1000 (if we assume that money is the only loss and secret safe is 0 utility change).
    - Non-victim: -1000 (money) and secret revealed, say utility -1000 - 1000000 = -1001000 (if secret revealed is -1000000 utility).

  Similarly, not paying:

    - Victim: 0 money loss but secret revealed: -1000000.
    - Non-victim: 0 money loss and secret safe: 0.

  So expected utility of paying: 0.5 * (-1000) + 0.5 * (-1001000) = -500 - 500500 = -501000.

  Expected utility of not paying: 0.5 * (-1000000) + 0.5 * 0 = -500000.

  So they prefer not to pay (-500000 > -501000).

  But now, from the perspective of precommitment: both Alice and Bob can agree on a policy. They can either both pay, or both not pay, or one pay and the other not.

  If they both don't pay, then the victim's secret is revealed. Each has an expected utility of 0.5 * (-1000000) + 0.5 * 0 = -500000.

  If they both pay, then the blackmailer reveals both secrets anyway (because the non-victim paying triggers revelation of both) and both lose $1000. So both get -1000 -1000000 = -1001000. This is worse.

  If they agree that only the victim should pay, then the victim pays and the non-victim doesn't. Then the victim loses $1000 but their secret is safe. The non-victim doesn't lose money and their secret is safe. But the victim doesn't know they are the victim and the non-victim doesn't know they are non-victim. So how to implement?

  In UDT, they can choose a policy: "if I am the victim, I will pay; if I am not, I will not pay". But they don't know who is the victim. However, this policy is conditional on the actual state (which they don't know). In UDT, the agent chooses a mapping from states to actions. Here the state includes who is the victim.

  So the policy: 
    - If I am the victim, pay.
    - If I am not the victim, don't pay.

  Then, in the actual world, the victim will pay and the non-victim will not. The outcome: victim pays -> their secret is safe, and since the non-victim doesn't pay, the blackmailer doesn't reveal both secrets. So only the victim loses $1000, and both secrets are safe for the victim and non-victim? 

  Wait, the victim's secret is safe because they paid. The non-victim's secret is safe because they didn't pay and only the victim's action matters for the non-victim's secret? Not exactly: the non-victim's secret is safe by default unless they pay (which would cause both to be revealed) or unless the victim doesn't pay (which would reveal the victim's secret, not the non-victim's).

  So under this policy:
    - Victim: pays, so their secret is safe.
    - Non-victim: doesn't pay, so their secret is safe (because the non-victim's payment is the only thing that would have caused their secret to be revealed in this scenario, and they didn't pay).

  Therefore, the victim loses $1000, and the non-victim loses nothing. The expected utility for each ex ante is: 0.5 * (-1000) + 0.5 * 0 = -500.

  This is better than -500000.

  So the policy of "pay if and only if I am the victim" is best.

  But can they implement it? They don't know who is the victim. However, in UDT, you don't condition on your knowledge; you choose the policy that maps the state (which includes your identity as victim or not) to actions. So you choose the best policy, which is the one above.

  In EDT, each agent conditions on their own state (which they don't know) and then uses the evidence of the letter to update. But the letter doesn't provide any information about whether they are the victim? They still have 50% credence. And then EDT recommends not to pay, as we saw, which is worse.

  The tension is that in UDT, the agent chooses a policy that conditions on the state (victim or not) even though they don't know the state at the time of the decision. In EDT, they only have their beliefs (50%) and then their action provides no additional evidence about whether they are the victim (because the victim and non-victim are symmetric in their evidence), so they cannot update. Therefore, EDT recommends the dominated action.

  In this example, the disagreement is not about the credence in which branch they are on (which is fixed at 50%), but about whether to condition on the branch in the policy or to use the branch as evidence at the time of the decision.

