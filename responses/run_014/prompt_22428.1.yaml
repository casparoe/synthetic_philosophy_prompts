  One idea is to use a scenario with self-locating uncertainty and precommitment. Consider a scenario where an agent must make a decision that affects multiple branches (or copies) of themselves, but the decision is made before they know which branch they are in. The tension arises because EDT would condition on the agent's current state (which they don't know yet) and thus might recommend an action that is suboptimal from a precommitment perspective.

