  Here's a concise example highlighting the tension between updateless decision theory (UDT) and evidential decision theory (EDT) in a non-Newcomb, non-gamble scenario with self-locating uncertainty. The issue arises when an agent must commit to a policy before knowing their identity, and EDT's conditioning on evidence leads to a dominated outcome.

  ### **The Twin Prisoners' Dilemma with Precommitment**
  **Setup:**  
  Two identical twins, Alice and Bob, will play a symmetric Prisoner's Dilemma. A coin flip determines which twin is in which role:
  - **Role 1 (e.g., "Left Player")**: Payoffs depend on their action and the other's action.  
  - **Role 2 (e.g., "Right Player")**: Payoffs depend on their action and the other's action.  

  Both twins are given amnesia drugs, so when they wake up, each knows:  
  - They are one of the twins (50% chance of being Alice or Bob).  
  - They are in one of the roles (50% chance of Role 1 or Role 2).  
  - They cannot communicate and must choose an action: **Cooperate (C)** or **Defect (D)**.  

  The payoff matrix (identical for both roles) is:  
  |          | Other: C | Other: D |  
  |----------|----------|----------|  
  | **You: C**| (2, 2)   | (0, 3)   |  
  | **You: D**| (3, 0)   | (1, 1)   |  

  *Clarification*:  
  - Payoffs are symmetric and identical for both roles.  
  - (You, Other) = (2, 2) means mutual cooperation gives both 2 utility.  
  - Defection yields higher individual payoff but causes mutual loss if both defect.  

  **Precommitment stage (UDT-style):**  
  Before the amnesia, the twins can agree on a *policy*:  
  - **Policy 1**: "Always cooperate (C), regardless of role or identity."  
    - Expected utility per twin: 2 (if both follow).  
  - **Policy 2**: "Always defect (D), regardless of role or identity."  
    - Expected utility per twin: 1 (if both follow).  
  - **Policy 3 (UDT-optimal)**: "Cooperate if I am Role 1, defect if I am Role 2."  
    - *Why?* Role asymmetry allows them to "coordinate": one cooperates, one defects, avoiding mutual defection.  
    - Expected utility per twin: 50% chance of (3, 0) or (0, 3) → average 1.5.  

  Policy 3 (avg 1.5) dominates Policy 2 (1) and ties Policy 1 (2) but is risk-dominant. Crucially, **Policy 3 requires conditioning on their role**, which they won't know post-amnesia.  

  **Post-amnesia decision (EDT-style):**  
  After waking up, a twin uses EDT:  
  - They have 50% credence of being Role 1 or Role 2.  
  - They condition on their action as *evidence*:  
    - If they choose **C**, EDT reasons:  
      - "My cooperation is evidence that I am Role 1 (since the policy says Role 1 cooperates).  
      - But if I am Role 1, the other (Role 2) will defect (per Policy 3), so I get 0."  
    - If they choose **D**, EDT reasons:  
      - "My defection is evidence that I am Role 2 (since the policy says Role 2 defects).  
      - If I am Role 2, the other (Role 1) will cooperate, so I get 3."  
  - **EDT outcome**: They defect (since 3 > 0), leading to mutual defection if both reason this way → (1, 1).  

  **The tension**:  
  - UDT (precommitment) recommends Policy 3 (avg 1.5) by choosing a role-conditional strategy upfront.  
  - EDT (post-amnesia) defects regardless of policy, forcing mutual defection (utility 1) and undermining Policy 3.  
  - **Key disagreement**:  
    - UDT treats the policy as a *function* from roles to actions, maximizing global expectation.  
    - EDT treats the action as *evidence* about their role, leading to a locally optimal but globally suboptimal choice.  
    - The twins' 50% credence is fixed, so the conflict isn't about credence calibration. Instead, it's about **whether to update on actions as evidence when the policy ties actions to unobserved states**.  

  **Why this works**:  
  - Avoids Newcomb: No predictor; outcomes depend on both players' actions.  
  - Not a one-shot gamble: Policy optimization vs. conditional decision creates a clear clash.  
  - Self-locating uncertainty is intrinsic, and the tension arises from EDT's inability to "commit" to a role-contingent plan without updating on actions.  

  This shows UDT's "updateless" commitment can outperform EDT when identity-dependent policies are optimal, but EDT's local conditioning sabotages them.
