  We are building desiderata for an account of "acting for the right reason". The account must separate "did the right thing" from "did the right thing for the right reason".

  Key cases that must be handled:
  1. Pure accident: Doing the right thing by pure accident (e.g., saving a child because you tripped and fell into the pool, and the child happened to be grabbed by you).
  2. Wrong motive: Doing the right thing but for a wrong motive (e.g., returning a wallet to get the reward, not because it's honest).
  3. Ignorance of rightness: Doing the right thing without knowing it's the right thing (e.g., giving to charity to show off, but the charity is actually effective and your action is right, but you didn't know that and you didn't care about effectiveness).

  But we want more than these three.

  Distinctions:
  - Right action vs. right reason: We must be able to say that an action was right (or had a good outcome) but the reason for doing it was not the right reason.
  - Acting because of a reason vs. acting for a reason: There might be a gap. For example, a reason might be present and cause the action (because of a reason) but the agent might not have taken that reason as their reason for acting (for a reason). E.g., you return the wallet because you want the reward, and the fact that it's honest is present but you didn't act for that reason.

  Structural facts about reasons:
  - There might be multiple reasons for an action, some good, some bad. We want the right reason to be the one that actually motivated the agent (if any) and that is also the morally right reason.

  Non-negotiable vs. negotiable:
  - Non-negotiable: The account must be able to distinguish the pure accident case from the case where the agent acted for the right reason.
  - Negotiable: How to handle cases of overdetermination (multiple reasons, some right, some wrong) might be contested.

  Tensions:
  - If we require that the right reason must be a moral reason (i.e., the reason that makes the action right), then we might run into trouble with anti-double-counting. The anti-double-counting idea is that we don't want to say that the same consideration counts twice (e.g., in both justifying the action and in being the motivating reason). But note: the moral reason that justifies the action is often taken to be the right reason to act for.

  Desiderata (to be listed in the table):

  1. **Accidental Rightness**: The account must rule out that an agent acted for the right reason when the right action was done purely by accident (non-negotiable). Motivating case: the tripping and saving a child case.

  2. **Wrong Motive**: The account must rule out that an agent acted for the right reason when the agent did the right thing but for a clearly wrong motive (non-negotiable). Motivating case: returning the wallet for the reward.

  3. **Ignorance of Rightness**: The account must rule out that an agent acted for the right reason when the agent is unaware that the action is right and does not act because of the right-making feature (non-negotiable). Motivating case: giving to charity for show, not knowing it's effective.

  4. **Knowledge of the Reason**: The agent must be aware of the reason for which they are acting? (contested) Motivating case: a person who habitually does the right thing without consciously thinking about the reason. Some might say they act for the right reason even without explicit awareness. Case: A person who always helps others in need because they were raised that way, but when asked why, they might not be able to articulate the reason. We want to allow that they might be acting for the right reason.

  5. **Causal Efficacy**: The right reason must be causally efficacious in producing the action (non-negotiable in naturalistic accounts, contested in others). Motivating case: if the right reason (e.g., that an act is honest) is present in the situation but does not play a role in the agent's decision, then the agent did not act for that reason. Case: returning the wallet for the reward, and the honesty of the act never crossed the agent's mind.

  6. **Non-Deviant Causation**: The causal connection between the reason and the action must not be deviant (non-negotiable but tricky). Motivating case: a person who believes that returning the wallet is honest, and this belief makes them so nervous that they drop the wallet and it is returned. The right reason (honesty) caused the action, but in a deviant way. We don't want to count this.

  7. **Overdetermination**: The account must handle cases where there are multiple motives, some good and some bad. (negotiable) Motivating case: an agent returns a wallet partly because it's honest and partly for the reward. Some accounts might require that the right reason be the sole reason, others might allow it to be one among many but dominant, etc. We need to decide.

  8. **The Right Reason as a Justifying Reason**: The reason for which the agent acts must be a reason that actually justifies the action (non-negotiable). Motivating case: if an agent acts for a reason that is not a good reason (e.g., they return the wallet because they believe it will bring them good luck, and it does, but that's not the right reason for returning the wallet), then they are not acting for the right reason. But note: we want the right reason to be the one that is morally relevant.

