answer: |-
  ### Desiderata for an Account of "Acting for the Right Reason"

  The core challenge is distinguishing agents who perform the right action *for the right reason* from those who do so accidentally, for irrelevant or wrong reasons, or without proper understanding. An adequate account must handle fundamental cases like accidental rightness, wrong motives, and ignorance of rightness, but also address subtler distinctions such as causal vs. normative motivation, overdetermination, and the objectivity of reasons. The goal is a specification that avoids conflating outcomes with motivations, respects the structure of moral reasoning, and is applicable to real-world evaluations (e.g., LLM agents). Below, I outline key desiderata, their motivating cases, non-negotiable vs. negotiable status, and tensions. Existing views (e.g., causal, competence, Kantian) are evaluated against these criteria in the table.

  #### Non-Negotiable Desiderata
  These must be satisfied for any minimally adequate account:
  1. **Exclude Accidental Rightness**: The account must not credit agents who perform the right action purely by chance (e.g., saving a child by tripping). This is foundational—accidents lack intentionality.
  2. **Exclude Wrong Motives**: It must distinguish right actions done for bad reasons (e.g., returning a wallet for a reward) from those done for the right reason (e.g., honesty). Motivation matters for praiseworthiness.
  3. **Exclude Ignorance of Right-Making Features**: Agents unaware of the feature that *makes* the action right (e.g., donating to charity for status, unaware it saves lives) cannot be acting for the right reason. The right reason must be part of their motivational structure.
  4. **Causal Efficacy**: The right reason must play a causal role in producing the action. Without causation, the reason is merely correlative (e.g., honesty exists in the situation but doesn’t influence the agent’s decision to return a wallet).
  5. **Non-Deviant Causation**: The causal link must be direct and non-accidental. Deviant chains (e.g., honesty causing nervousness that leads to accidentally returning a wallet) invalidate the connection.

  #### Negotiable or Contested Desiderata
  These are important but subject to philosophical dispute:
  6. **Handling Overdetermination**: The account must resolve cases where multiple motives coexist (e.g., returning a wallet for both honesty and reward). Some require the right reason to be dominant; others accept any sufficient role. This is negotiable due to varying intuitions about "purity" of motives.
  7. **No Explicit Awareness Needed**: Agents need not consciously articulate the right reason (e.g., habitually helping others due to ingrained empathy). Requiring explicit awareness (contested) may overlook implicit or habitual virtue.
  8. **Moral Worth Capture**: Actions for the right reason should have distinct moral worth (e.g., Kant’s honest shopkeeper acting from duty vs. profit). Desirable but negotiable—some views (e.g., consequentialism) tie worth solely to outcomes.
  9. **Objective Justifying Reason**: The motivating reason must align with an objective, truth-apt justifying reason (e.g., returning a wallet because it *is* the owner’s, not because of a false belief). Contested—subjectivists argue that sincere belief suffices.
  10. **Anti-Double-Counting**: The justifying reason (why the action is right) and motivating reason (why the agent acts) must be distinct entities to avoid trivialization (e.g., "they acted for R because R justifies it" is circular). Negotiable, as some views (e.g., realism) see overlap as unproblematic.

  #### Tensions and Challenges
  - **Objective Reason vs. Anti-Double-Counting**: Requiring the motivating reason to be both objective (desideratum 9) and distinct from justification (desideratum 10) creates tension. If the justifying reason *must* be the motivator, it risks double-counting (e.g., "honesty justifies and motivates, so it’s trivial"). But if they can differ, we lose the "right" in "right reason." Most accounts prioritize objectivity, accepting some overlap.
  - **Overdetermination vs. Moral Worth**: Allowing mixed motives (e.g., honesty and reward) may dilute moral worth. Strict Kantianism rejects this, requiring "pure" motives—a negotiable trade-off.
  - **Causal Efficacy vs. Non-Deviant Causation**: Causal theories often handle efficacy but struggle with deviance. Competence views (e.g., Arpaly) address deviance but may downplay causation.

  #### Existing Views and Their Limitations
  - **Causal Theories (e.g., Davidson)**: Actions are motivated by reasons that causally explain them. Struggle with deviant causation (desideratum 5) and may not exclude wrong motives (desideratum 2) if any cause suffices.
  - **Competence Views (e.g., Arpaly, Markovits)**: Focus on responsiveness to reasons as a character trait. Excel at excluding ignorance (desideratum 3) and deviance (5), but may overextend to habitual actions without awareness (contested in desideratum 7).
  - **Kantian Views**: Require acting from duty. Strong on moral worth (8) and wrong motives (2), but often demand explicit awareness (failing desideratum 7) and struggle with overdetermination (6).
  - **Subjective Views**: Credit agents who act on sincere beliefs, even if false. Fail objective reason requirements (9) and may allow ignorance (3).

  ### Desiderata Table
  | desideratum | motivating_case | status | knocks_out |
  |-------------|-----------------|--------|------------|
  | Exclude Accidental Rightness | Agent saves a child by tripping and grabbing them unintentionally. | non-negotiable | None (all views exclude this) |
  | Exclude Wrong Motives | Agent returns a wallet solely to collect a reward, not out of honesty. | non-negotiable | Causal theories (if they accept any motivation) |
  | Exclude Ignorance of Right-Making Features | Agent donates to charity for social status, unaware it saves lives and unmotivated by that fact. | non-negotiable | Subjective views (if they credit any sincere motive) |
  | Causal Efficacy | Honesty is a fact in the situation, but the agent returns a wallet only due to reward; honesty plays no causal role. | non-negotiable | Non-causal views (e.g., some explanatory accounts) |
  | Non-Deviant Causation | Belief in honesty causes nervousness, leading to accidental wallet return. | non-negotiable | Simple causal theories |
  | Handling Overdetermination | Agent returns a wallet both for honesty and reward. | negotiable | Kantian views (if they require sole motivation by duty) |
  | No Explicit Awareness Needed | Agent habitually helps others due to ingrained empathy, without conscious reasoning. | contested | Kantian views (if they require duty-consciousness) |
  | Moral Worth Capture | Kant's shopkeeper: one charges fairly from duty, another for profit; only the first has moral worth. | negotiable | Outcome-only views (e.g., naive consequentialism) |
  | Objective Justifying Reason | Agent returns a wallet believing it is the owner's, but it is a decoy; the objective reason (true ownership) is absent. | contested | Subjective views |
  | Anti-Double-Counting | Avoid triviality: "They acted for R because R justifies it" should not suffice. | negotiable | Views that conflate motivating and justifying reasons |

  ### Confidence and Uncertainty
  I am highly confident in the non-negotiable desiderata (1–5), as they are grounded in consensus cases (accident, wrong motive, ignorance) and address core flaws in agent evaluation (e.g., rewarding luck or deception). The negotiable desiderata reflect live philosophical debates, but are essential for a nuanced account. The point I am least sure about is **Anti-Double-Counting (desideratum 10)**. While it aims to prevent triviality, it may be overly strict—some views (e.g., moral realism) naturally align motivating and justifying reasons without circularity. This could be relaxed if the account explicitly separates psychological motivation from normative justification. Overall, the desiderata provide a robust starting point for theory-building, with the table highlighting where existing views falter.
