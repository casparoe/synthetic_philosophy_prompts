prompt: |-
  For our faculty-student ethics forum I will interview a moral philosopher who maintains that some actions are genuinely beyond duty yet morally praiseworthy to perform and not blameworthy to omit, and that this category cannot be accommodated by any view equating the morally best action with the morally required one.

  Please prepare nine questions for the conversation that move past exposition to pressure points in the debate. Organize them around three lines of inquiry, with planned follow-ups that anticipate her probable replies: first, how the permission to omit the best action can be principled rather than ad hoc, using the contrast between Mara, a nurse who after fulfilling all rostered duties during a week of flooding volunteers for three additional night shifts staffing an evacuation shelter when a competent substitute was available, and Luis, a landlord who at comparable financial cost forgives back rent for displaced tenants largely to ease his own discomfort; second, whether praiseworthiness, cost to the agent, or motive is what makes an act belong in the extra-duty category; third, how the account handles the tension that if an act is truly best from the moral point of view it seems it should be required.

  Provide concise context for each line that separates points on which specialists largely agree from points that remain actively disputed, without presenting a disputed position as the field's consensus.
reasoning: |-
  Okay, the user wants me to prepare questions for an interview with a moral philosopher about supererogation - actions that are beyond duty but praiseworthy. They need nine questions organized into three lines of inquiry with follow-ups, focusing on key pressure points in the debate.

  First, I need to understand the core of this philosophical position. The philosopher argues that some morally best actions aren't required - we can praise people for doing them but can't blame others for not doing them. This directly challenges theories that equate "morally best" with "morally required." The user wants me to push on three specific tensions in this view.

  For the first line about principled permission to omit best actions, I'll use the contrasting cases of Mara the nurse and Luis the landlord. The challenge is explaining why we can excuse not doing the best action without making morality arbitrary. The follow-up should press on whether this permission relies on hidden assumptions about personal costs or autonomy that might not hold universally.

  The second line needs to unpack what actually makes an action supererogatory - is it praiseworthiness, high cost, or good motives? This is notoriously messy in the literature. The follow-up should test whether these criteria can be separated, using Luis's case where motive seems to undermine what would otherwise be supererogatory.

  For the third line on the "best action paradox," I need to confront the intuition that if something is morally best, how can it not be required? The follow-up should challenge whether calling it "beyond duty" just disguises a double standard in moral demandingness.

  Throughout, I must carefully frame the context to distinguish settled points from live debates - for example, noting that most philosophers accept supererogation exists, but fiercely dispute how to define it and whether it conflicts with moral rationality. The examples need to expose these fault lines without presupposing any resolution.

  The user is clearly preparing for a rigorous academic discussion, so questions should avoid rehashing basics and instead target conceptual tensions. I'll structure each line with one main question and two follow-ups that anticipate defensive moves the philosopher might make. The Mara/Luis contrast is particularly useful because it separates objective action from subjective motive - a key point of contention.
answer: |-
  Here are nine questions organized into three lines of inquiry, designed to pressure key debates around supererogation ("beyond duty"), with concise context, anticipated replies, and planned follow-ups:

  ### Line of Inquiry 1: Principled Permission to Omit the Best
  **Context:** While specialists largely agree that common-sense morality recognizes supererogatory acts (e.g., heroic sacrifices), there is active dispute about whether this permission *systematically* follows from fundamental moral principles (e.g., agent-relative permissions, limited demandingness) or is merely an *ad hoc* concession to human frailty or psychological realism.

  1.  **Core Question:** Your Mara/Luis contrast suggests Mara’s volunteering is supererogatory while Luis’s rent forgiveness isn’t, even at comparable cost. But both involve significant sacrifice for others' benefit. What *principled* distinction, beyond intuitive judgment, explains why omitting Mara’s act is *permissible* (non-blameworthy) while omitting Luis’s act might *not* be? Is the permission grounded in the *nature of the duty* (professional vs. contractual), the *source of the cost* (voluntary extra effort vs. forfeited income), or something else?
      *   *Anticipated Reply:* "Mara had already fulfilled her stringent professional duties; her extra shifts were a freely chosen surplus demanding exceptional effort. Luis’s minimal duty as a landlord arguably extends further in crisis, or his primary motivation (self-ease) negates the act's supererogatory potential."
      *   **Follow-Up 1a:** If demandingness is key, does this imply a *quantifiable threshold* where sacrifice becomes supererogatory? How do we avoid arbitrariness? If Luis had sacrificed *twice* as much as Mara, purely to ease discomfort, would his omission *still* be blameworthy while hers remains permissible?
      *   **Follow-Up 1b:** Doesn't framing the permission around Mara's fulfilled "core duties" risk making supererogation parasitic on a potentially *ad hoc* definition of what constitutes "enough"? Couldn't a strict utilitarian argue her core duty *wasn't* fully met until she did the *maximally* beneficial act possible?

  ### Line of Inquiry 2: The Defining Criterion (Praiseworthiness, Cost, or Motive?)
  **Context:** Specialists agree that supererogatory acts are (1) morally optional, (2) morally good/praiseworthy, and (3) involve significant cost/effort. However, there is sharp dispute about which element is *definitive* or *primary* in distinguishing them from other good acts (e.g., obligatory ones or minimally costly kind acts), and how these elements interact – particularly the role of motive.

  2.  **Core Question:** Is an act supererogatory *because* it’s especially praiseworthy, *because* it imposes significant cost on the agent, or *primarily because* of the agent’s motive (e.g., altruism vs. self-ease)? Luis’s act involved significant cost but seems disqualified as supererogatory due to motive. Does this mean motive is the *sine qua non*?
      *   *Anticipated Reply:* "Cost is necessary but not sufficient. Motive is crucial: an act is supererogatory only if done from a virtuous motive (e.g., benevolence, compassion), not primarily self-interest. Luis fails this test. Praiseworthiness is a consequence of the costly, virtuously motivated, optional act."
      *   **Follow-Up 2a:** If motive is essential, does this collapse supererogation into a category of *especially virtuous acts*? Could someone perform an act identical to Mara’s (same cost, same benefit) purely for fame, and thereby *not* make it supererogatory? Would omitting *that* act then be *blameworthy*?
      *   **Follow-Up 2b:** Doesn't prioritizing motive create a problem of access? We often praise acts without knowing the inner motive (e.g., we praise Mara based on her action). If supererogation requires a specific motive, how can we ever confidently identify or encourage it externally? Is the *category* then more about the agent’s psychology than the act’s moral status?

  ### Line of Inquiry 3: Reconciling "Best" with "Not Required"
  **Context:** Specialists largely agree that morality isn't always maximally demanding. However, there is deep and active dispute about whether calling an action "morally best" while simultaneously holding it is *not required* constitutes a fundamental inconsistency within a coherent moral system, or if moral theories can successfully accommodate optional "bests."

  3.  **Core Question:** The core tension remains: If an act is *genuinely best* from the moral point of view (optimizing overall good, virtue, etc.), how can failing to perform it *not* be a moral failure or blameworthy? Doesn't labeling it "supererogatory" risk being a euphemism for letting agents off the hook for not doing the morally optimal thing?
      *   *Anticipated Reply:* "Morality isn't solely about maximizing the good impersonally. It incorporates agent-centered *permissions* allowing individuals to pursue their own reasonable projects and well-being, even when doing something *slightly* better (but much costlier) for others exists. Insisting the 'best' is always required ignores legitimate personal sovereignty."
      *   **Follow-Up 3a:** Doesn't this permission imply the agent's perspective *overrides* the impersonal moral perspective in determining what's "required"? Does this mean the "morally best act *simpliciter*" is different from the "morally best act *for this agent, given their permissions*"? Isn't this a problematic duality?
      *   **Follow-Up 3b:** If personal sovereignty creates a 'protected sphere' where sub-optimal choices are permissible, how do we non-arbitrarily define the *boundaries* of this sphere? Why is Mara protected when choosing *not* to do 3 extra shifts, but potentially *not* protected if she chose not to do *any* of her rostered shifts? What principle draws this line between duty and supererogation?

  These questions move beyond basic exposition to target the philosopher's core justificatory challenges: grounding the permission systematically (1), defining the category rigorously amidst overlapping criteria (2), and resolving the apparent paradox of the optional best (3), all while respecting the nuances of the ongoing academic debate. The Mara/Luis contrast provides concrete grounding for the first line, while the follow-ups directly engage with likely defensive moves.
