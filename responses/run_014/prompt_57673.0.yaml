prompt: |-
  I'm a litigator in federal civil practice, fifteen years in; I know the rules of evidence and Rule 11 backwards, and I have no philosophy training. The debate I want translated is the epistemologists' argument over the norm of assertion — that one should assert only what one knows (the view associated with Williamson), against the rivals holding that assertion requires truth, or reasonable belief, or nothing more than sincerity.

  Render each candidate in the vocabulary I work in: personal knowledge as a foundation requirement for a witness, the certification that factual contentions have evidentiary support after an inquiry reasonable under the circumstances, the perjury standard's preoccupation with what the declarant believed rather than with what was so, materiality, willfulness, sanctions, and the allocation of risk between the one who speaks and the one who relies. Translate faithfully; don't smuggle my framework's assumptions back to me as conclusions about theirs.

  Then give me the residue report. Which candidate has an exact legal counterpart and which only an approximate one? Where does the translation force distortion — for instance, because every standard I know is imposed from outside on an activity that would exist anyway, whereas the philosophers hold that at least one of these norms is constitutive of the activity itself? What in their debate is inexpressible in my vocabulary at all? And where translation fails, is that a limitation of the legal framework, or a sign that the philosophical claims were less determinate than they sound?
reasoning: |-
  Okay, the user is a federal litigator with 15 years of experience. They want to understand the philosophical debate about the norm of assertion using legal concepts they're familiar with. The key points are Williamson's view that you should only assert what you know versus other positions like requiring truth, reasonable belief, or just sincerity.

  Hmm, I need to map each philosophical position to legal equivalents without biasing the translation. For Williamson's knowledge norm, the closest legal parallel seems to be witness testimony rules - specifically FRE 602's personal knowledge requirement. But there's a gap because witnesses don't need certainty, just firsthand perception. 

  For the truth norm, I'm considering Rule 11's certification requirement about evidentiary support. But Rule 11 focuses on reasonableness before filing, not absolute truth. The perjury standard is tempting here but it's about belief, not truth.

  The reasonable belief norm aligns well with Rule 11's "inquiry reasonable under circumstances" standard. This feels like the cleanest fit since both involve an objective reasonableness assessment.

  Sincerity-only is tricky. The perjury statute's willfulness requirement comes close by focusing on the speaker's belief, but it adds materiality and falsehood elements that philosophers don't require. 

  Now for the residue report... The reasonable belief standard has the closest legal counterpart in Rule 11. Witness testimony rules approximate the knowledge norm but imperfectly. The big differences are that legal standards are externally imposed regulations, while philosophers debate what makes an assertion "proper" at its core. 

  The constitutive claim - that assertion fundamentally requires knowledge - just doesn't translate to law. Our system regulates speech but doesn't define what assertion "is." Also, the philosophers' focus on non-legal contexts (like casual conversation) creates untranslatable aspects. 

  Where translation fails, it's partly due to law's pragmatic focus on consequences rather than essence. But it also reveals philosophical concepts aren't as precise as they sound - "knowledge" means different things to epistemologists versus courts. 

  The user might be testing how philosophical concepts hold up in practice, or looking for deeper justification of legal standards. The untranslatable parts suggest why lawyers and philosophers approach truth-telling differently - we care about provable violations, they care about what makes speech acts meaningful.
answer: |-
  Here's a translation of the epistemological debate on the norm of assertion into your federal litigation framework, followed by a residue report analyzing the fit and limitations:

  **Translation of Philosophical Positions into Litigation Vocabulary:**

  1.  **Williamson's "Knowledge Norm" (Assert only what you know):**
      *   **Legal Counterpart:** **FRE 602 (Personal Knowledge Requirement for Witnesses).** Just as FRE 602 bars a witness from testifying to a matter unless evidence is introduced sufficient to support a finding that the witness has personal knowledge, the Knowledge Norm bars an assertion unless the asserter possesses knowledge (justified true belief + anti-luck condition).
      *   **Translation:** "You cannot make a factual contention (assertion) unless you possess *personal knowledge* meeting the evidentiary standard for admissibility (FRE 602 threshold). The risk of being wrong falls squarely on the asserter/witness; if you lack this foundation, your assertion is improper *in itself*, regardless of its truth or your sincerity."
      *   **Focus:** The intrinsic *qualification* of the asserter/speaker based on their cognitive state and access.

  2.  **Truth Norm (Assert only what is true):**
      *   **Legal Counterpart:** **Ultimate Goal of Adjudication, but no direct procedural counterpart.** While the *system* aims for truth (Fed. R. Civ. P. 1), no rule requires *every assertion by a litigant or counsel* to be *actually true* to be permissible. Sanctions arise for lack of support or bad faith, not mere falsity.
      *   **Translation:** "Factual contentions are permissible only if they are *materially true*. Falsity, even if sincerely and reasonably believed after diligent inquiry, renders the assertion improper. The risk of objective falsehood invalidates the act." (Contrasts sharply with perjury's focus on belief).
      *   **Focus:** The objective *factual accuracy* of the proposition asserted, irrespective of the asserter's state of mind or diligence.

  3.  **Reasonable Belief Norm (Assert only what you reasonably believe):**
      *   **Legal Counterpart:** **Rule 11(b)(3) Certification Standard ("evidentiary support... after reasonable inquiry").**
      *   **Translation:** "Factual contentions must have *evidentiary support* based on an *inquiry reasonable under the circumstances* conducted *at the time they are presented*. The assertion is proper if your belief was objectively reasonable based on diligent pre-filing investigation. The risk is allocated to the asserter to conduct this due diligence; failure to meet this standard triggers sanctions, regardless of ultimate truth or personal certainty (knowledge)."
      *   **Focus:** The *process* and *objective reasonableness* of the pre-assertion inquiry and the resulting belief state.

  4.  **Sincerity Norm (Assert only what you believe):**
      *   **Legal Counterpart:** **Perjury Standard (18 U.S.C. § 1621) - Specifically, the "willfully... false" belief requirement, *minus* the materiality and formal oath elements.**
      *   **Translation:** "The core requirement for an assertion is that you *believe it to be true* at the time you make it. Asserting something you know is false, or are reckless about its truth, is what makes it improper. Falsity itself is irrelevant if you believed it; lack of support is irrelevant if you believed it. The risk is solely on the speaker's subjective honesty." (This clashes directly with Rule 11's objective reasonableness element).
      *   **Focus:** The *subjective belief state* of the asserter at the moment of assertion.

  **Residue Report:**

  1.  **Exact Counterpart:**
      *   **Reasonable Belief Norm ≈ Rule 11(b)(3):** This is the strongest fit. Both define propriety based on an *objectively reasonable pre-assertion inquiry* and the resulting belief. The standard is external, regulative, and violation triggers sanctions/consequences. Risk allocation (speaker must investigate) is explicit in both.

  2.  **Approximate Counterparts (With Significant Distortion):**
      *   **Knowledge Norm ≈ FRE 602:** Approximate in requiring a *foundation* based on the speaker's cognitive access. **Distortions:** (1) FRE 602 is a threshold *admissibility* rule for *witness testimony*, not a universal norm for *all assertions* (e.g., arguments in a brief). (2) "Personal knowledge" (sensory perception/experience) is narrower than philosophical "knowledge" (justified true belief + anti-luck). (3) FRE 602 doesn't require *certainty* or guarantee against error, just a minimal foundation. (4) Violating FRE 602 means exclusion, not that the *act* of testifying was inherently improper (just inadmissible).
      *   **Sincerity Norm ≈ Perjury "Willfully False" Belief Element:** Approximate in focusing on the speaker's *subjective belief*. **Distortions:** (1) Perjury requires an *oath*, *materiality*, and *willfulness* (knowledge of falsity or reckless disregard) – the pure Sincerity Norm only requires belief. (2) Perjury is a severe *criminal* sanction; the Sincerity Norm violation is presented as making the assertion inherently improper, not necessarily sanctionable. (3) Perjury focuses on *factual statements under oath*; the Sincerity Norm applies to *any assertion*.

  3.  **Translation Failure / Distortion:**
      *   **The Constitutive Claim:** This is the core distortion point. Your legal vocabulary inherently describes **external, regulative norms** imposed on pre-existing activities (filing pleadings, testifying). Philosophers (especially Williamson) argue the Knowledge Norm is **constitutive** – meaning that an utterance *counts as* an assertion *only if* governed by this norm. Violating it means you didn't *really* assert, you did something else (guessed, conjectured, lied). This concept – that the norm *defines the speech act itself* – has **no direct parallel** in the legal framework. Law regulates *actions* (testimony, filing) that are defined procedurally, not constitutively by epistemic norms. Translating "constitutive norm" into "foundational admissibility requirement" (FRE 602) or "mandatory pre-filing standard" (Rule 11) smuggles in the *regulative* assumption and misses the philosophical claim about the *essence* of assertion.
      *   **Truth Norm's Lack of Direct Counterpart:** The absence of a rule demanding *actual truth* for every permissible assertion highlights a gap. Law cares about *process* (Rule 11) and *subjective honesty in specific contexts* (Perjury), but not *objective truth* as a standalone norm for assertion. Translating it feels forced and alien to the system.
      *   **"Knowledge" vs. "Personal Knowledge":** Translating philosophical "knowledge" as legal "personal knowledge" (FRE 602) seriously undersells the concept. Philosophical knowledge includes justification and an anti-luck condition ("Gettier cases") far beyond the basic foundation of perception/experience required by FRE 602. This distortion is necessary but significant.
      *   **Context Neutrality:** Philosophical norms aim to govern *assertion as such*, from casual conversation to expert testimony. Legal norms are highly context-specific (pleading vs. testimony vs. argument). Translating philosophical norms into specific legal contexts inevitably narrows them.

  4.  **Inexpressible Concepts:**
      *   **The Constitutive Nature of the Norm:** As above, the idea that violating the norm means you *didn't perform an assertion* is alien to law. Law defines acts procedurally (e.g., filing a document with factual allegations *is* making assertions for Rule 11 purposes, regardless of the filer's state of mind or the truth).
      *   **The "Proper" vs. "Sanctionable" Distinction:** Philosophers debate what makes an assertion *proper* or *correct* as a speech act. Law focuses on what makes it *actionable* or *sanctionable*. The gap between something being inherently defective as an assertion and something being sanctionable under court rules or criminal law is vast and largely inexpressible in your terms. "Improper" in law usually means "violating a rule," not "failing to be a true instance of the act."
      *   **Pure Sincerity Outside Perjury Context:** The idea that *only* subjective belief matters, with *no* requirement for reasonableness, truth, or foundation, has no clean legal expression outside the specific, narrow confines of the *belief element* of perjury (which itself includes willfulness and materiality). Assertions in briefs governed by Rule 11 *cannot* meet a pure sincerity norm and be proper.

  5.  **Limitation of Framework vs. Indeterminacy of Philosophy:**
      *   **Limitation of Legal Framework:** The legal framework is fundamentally **pragmatic and consequentialist**. It regulates speech to serve procedural fairness, efficiency, truth-seeking (as a system goal), and deterrence. It cares about *provable violations* and *manageable standards* (like objective reasonableness). It has no need for, and cannot easily accommodate, concepts about the *essential nature* of assertion. The constitutive claim is genuinely inexpressible because law operates at a different level of analysis.
      *   **Indeterminacy of Philosophy?** Where translation fails most conspicuously (constitutive norm, pure sincerity), it highlights that these philosophical concepts **are less determinate in their practical implications** than they sound in the abstract debate. The pure Sincerity Norm, if taken seriously as the *only* norm, leads to consequences (e.g., blameless assertion of wildly unsupported claims) that the legal system finds intolerable and which philosophers themselves often try to avoid. The constitutive claim, while logically argued, posits a fundamental essence that is difficult to isolate from the regulative norms that clearly *do* govern communication in complex social/legal contexts. The translation failure exposes a potential lack of grounding for these concepts outside the specific dialectic of epistemology.

  **Conclusion:** The **Reasonable Belief Norm** finds an exact counterpart in **Rule 11(b)(3)'s certification standard**. The **Knowledge Norm** finds an approximate, distorted counterpart in **FRE 602's personal knowledge requirement for witnesses**. The **Sincerity Norm** finds a very narrow, distorted counterpart in the **belief element of perjury**. The **Truth Norm** lacks a meaningful counterpart. The most significant translation failure concerns the **constitutive claim** (that the norm defines assertion itself), which is inexpressible in the legal vocabulary of external regulation and sanctions. This failure stems primarily from the **inherent limitations of the legal framework's pragmatic, consequentialist focus**, though it also suggests the **philosophical concepts of constitutive norms and pure sincerity are less determinate in practical application** than their abstract formulations imply.
