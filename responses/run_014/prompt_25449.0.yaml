prompt: |-
  I'm on my university's faculty senate rules committee and we're stuck. We're revising how we vote on tenure-track hiring decisions. Right now we use simple plurality — whoever gets the most votes wins, even if a majority of the department actually ranked them last. Some of us want to switch to ranked-choice (instant runoff) or approval voting. But one committee member keeps bringing up Arrow's impossibility theorem and saying, look, no voting system can be truly fair, so why bother changing anything — we should just stick with plurality and move on. This has kind of paralyzed the discussion and we're supposed to have a recommendation by next meeting.

  Can you draft a short memo for me to circulate? It should recommend a specific voting method for our hiring decisions and give reasons. It needs to take the Arrow-based objection seriously — not just handwave it away, but explain what Arrow's theorem actually does and doesn't imply for a practical choice like ours. The memo should have a clear bottom-line recommendation we can vote on, and it should be honest about the downsides of whatever method we pick.
