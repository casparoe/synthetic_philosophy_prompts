  Okay, the user is part of a university faculty senate rules committee stuck on revising their tenure-track hiring voting system. They're currently using simple plurality, which has clear flaws—like someone winning even if most ranked them last. Some members want ranked-choice or approval voting, but one keeps citing Arrow's impossibility theorem to argue against change. The user needs a memo that recommends a specific method, addresses Arrow's theorem seriously, and has a clear recommendation with downsides.

  First, I need to understand Arrow's theorem and its real-world implications. Arrow proved that no ranked voting system can meet all fairness criteria simultaneously: non-dictatorship, Pareto efficiency, independence of irrelevant alternatives, and unrestricted domain. But in practice, especially in small committees like a faculty hiring process, this might not be as paralyzing as it seems. The theorem applies to systems that rely on full preference rankings, which might not even be necessary here.

  The user's main need is to break the deadlock. They need a persuasive memo that acknowledges the objection but moves past it. The key is to show that while no system is perfect, some are better than others for their specific context. Plurality has well-documented issues, like vote-splitting and lack of majority support. The committee might be more concerned about consensus and avoiding polarizing candidates rather than theoretical perfection.

  Considering the alternatives: Ranked-choice voting (RCV) allows ranking candidates and eliminates the least popular in rounds. It ensures the winner has broad support, but it can be complex and might lead to strategic ranking. Approval voting is simpler—vote for all acceptable candidates. It encourages consensus but might lead to bullet voting or unclear preferences.

  Given the hiring context, approval voting seems more practical. Faculty might not want to rank colleagues explicitly, and approval is easier to implement. Downsides like bullet voting can be mitigated by reminding voters to support all they find acceptable. The committee's small size reduces Arrow's impact since strategic voting is less likely, and they're not dealing with a large electorate.

  The memo should stress practical improvements over the current system. Highlighting that Arrow's theorem doesn't justify sticking with a flawed method but encourages choosing a better one despite imperfections. Recommending approval voting with clear guidelines could be the actionable solution they need.
answer: |-
  ## MEMO: Faculty Senate Rules Committee - Voting Method Recommendation for Tenure-Track Hiring

  **To:** Faculty Senate Rules Committee Members  
  **From:** [Your Name/Committee Member]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for Revised Voting Method on Tenure-Track Hiring Decisions  

  ### 1. The Problem with Plurality Voting
  Our current simple plurality system allows a candidate to win with the most first-place votes, even if a substantial majority of the department actively *disapproves* of them (e.g., ranks them last). This creates significant risks:
  *   **Lack of Consensus:** Winners may not reflect broad departmental support.
  *   **Polarization:** Encourages strategic voting and factionalism.
  *   **Spoiler Effect:** Similar candidates can split the vote, allowing a less-preferred candidate to win.
  *   **Perceived Unfairness:** Undermines confidence in hiring outcomes.

  ### 2. Addressing Arrow's Impossibility Theorem
  Committee Member X rightly raises Arrow's theorem, a profound result in social choice theory. It demonstrates that *no ranked voting system* can simultaneously satisfy all of the following seemingly reasonable criteria when voters rank three or more options:
  1.  **Non-dictatorship:** No single voter dictates the outcome.
  2.  **Pareto Efficiency:** If everyone prefers A over B, A should win.
  3.  **Independence of Irrelevant Alternatives (IIA):** The ranking between A and B shouldn't change if a third option C is added or removed.
  4.  **Unrestricted Domain:** The system works for any possible set of individual voter rankings.

  **What Arrow Means (and Doesn't Mean) for Us:**
  *   **It Means:** There is no mathematically "perfect" ranked voting system that avoids all paradoxes or satisfies every ideal criterion in every conceivable scenario. All systems have potential flaws.
  *   **It Does NOT Mean:**
      *   That all voting systems are equally flawed or unfair.
      *   That practical improvement over our demonstrably problematic plurality system is impossible.
      *   That Arrow's specific paradoxes (often involving complex, cyclical preferences) are *common* or *likely* in a small committee evaluating a small number of candidates for a specific, high-stakes position like tenure-track hiring.
      *   That criteria like IIA are always paramount in this context. Ensuring the winner has broad *support* (avoiding plurality's "most firsts despite most lasts") may be more operationally critical.

  **The Key Takeaway:** Arrow's theorem is a vital caution against seeking a mythical "perfect" system. It does *not*, however, justify retaining a system known to produce outcomes that frequently contradict the collective will of the department (like electing a candidate ranked last by a majority). We can and should choose a system that is *more robust, fairer in practice, and better suited to identifying consensus* than plurality, even if it isn't theoretically flawless.

  ### 3. Recommended Voting Method: Approval Voting

  **Procedure:** Voters select ("approve") *all* candidates they find acceptable for the position. The candidate with the most approval votes wins.

  **Why Approval Voting is the Best Practical Choice:**
  1.  **Simplicity & Transparency:** Extremely easy to understand, administer, and count. Minimizes voter confusion and errors.
  2.  **Promotes Consensus:** Directly encourages voters to support *all* candidates they deem acceptable, naturally identifying the candidate with the broadest support base. A winner disliked by a large minority is unlikely.
  3.  **Avoids Plurality's Core Flaw:** Eliminates the "spoiler effect" and prevents a candidate widely disliked (but with a passionate minority) from winning simply by having the largest single faction. A candidate ranked last by many is unlikely to receive many approval votes.
  4.  **Reduces Strategic Complexity:** While no system is immune to strategy, Approval is generally considered one of the most strategy-resistant. The optimal strategy ("Vote for all candidates you genuinely find acceptable") is straightforward and aligns with sincere preferences.
  5.  **Mitigates Arrow's Concerns:** Approval does not rely on *ranking* candidates (voters provide a set of approved choices, not a strict order), placing it outside the strict scope of Arrow's theorem, which applies to ranked systems. It focuses solely on measuring breadth of support.
  6.  **Practical for Hiring:** It answers the most relevant question for a departmental hire: "Who is broadly acceptable to us?" rather than forcing complex rankings that may be fraught in a small-group context.

  **Acknowledged Downsides of Approval Voting:**
  *   **Lack of Preference Intensity:** It doesn't capture *how much* voters prefer one approved candidate over another. A candidate who is everyone's *second* choice might lose to a candidate who is many voters' *barely acceptable* choice but also the passionate first choice of a smaller group. (However, this is often preferable to a candidate who is *unacceptable* to many winning under plurality).
  *   **Potential for "Bullet Voting":** Voters *might* strategically approve only their absolute top choice (voting for fewer candidates than they genuinely find acceptable) to avoid helping a compromise candidate beat their favorite. This risks turning it back into plurality. (This can be mitigated by clear voter instructions: "Vote for ALL candidates you find acceptable for this position").
  *   **Possible Ties:** Requires a clear tie-breaking procedure (e.g., revote, department chair breaks tie, alphabetical order).

  ### 4. Why Not Ranked-Choice Voting (RCV)?
  RCV (Instant Runoff) is a good system and addresses many plurality flaws. However, for our specific context:
  *   **Increased Complexity:** Requires voters to rank all/many candidates, which can be burdensome and lead to errors. Counting involves multiple rounds, which is less transparent than a single Approval count.
  *   **Potential for Non-Monotonicity:** In rare cases, ranking a candidate *higher* can cause them to lose, or ranking them *lower* can cause them to win – a counterintuitive result that can undermine confidence. (This *is* a manifestation of Arrow-type limitations).
  *   **Strategic Ranking Concerns:** Voters might misrepresent their true preferences (e.g., ranking a strong challenger low to protect their favorite). This strategic complexity is arguably higher than with Approval.
  *   **Focus on Rankings vs. Acceptability:** While RCV seeks majority support, it may not maximize broad *acceptability* as directly as Approval Voting does. A candidate eliminated early might have been broadly acceptable as a compromise.

  ### 5. Recommendation and Proposed Vote

  Based on the significant flaws of our current plurality system, the practical realities of departmental hiring, and a careful consideration of alternatives acknowledging Arrow's theorem (which cautions against perfectionism, not improvement), **the Rules Committee recommends adopting Approval Voting for tenure-track hiring decisions.**

  **Proposed Motion:**  
  "*The Faculty Senate Rules Committee recommends replacing the current simple plurality voting system for tenure-track hiring decisions with Approval Voting. Under Approval Voting, faculty voters will be instructed to indicate ('approve') all candidates they find acceptable for the position. The candidate receiving the highest number of approval votes will be recommended for hire. In the event of a tie, a revote between the tied candidates will be held, followed by alphabetical selection if the tie persists.*"

  We believe Approval Voting offers the best combination of fairness, practicality, resistance to undesirable plurality outcomes, and promotion of departmental consensus for this critical decision. It represents a significant and necessary improvement over our current system.

  **Attached:** [Optional: Brief comparison chart of Plurality, RCV, and Approval Voting highlighting key features and downsides]
