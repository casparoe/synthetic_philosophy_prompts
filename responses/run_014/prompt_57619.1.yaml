prompt: |-
  I spent thirty-six years studying early mammalian development in a laboratory and retired two years ago. Philosophy has since become my principal occupation, and I have now reached the debate over whether an organism's origin is essential to it — the thesis, most famously defended by Kripke, that a person could not have come from a different sperm and a different egg. What strikes me is how little of that discussion is disciplined by what embryos actually do. Before I invest further in the arguments, I want to know what should be asked of a theory in this area at all.

  So: write the specification. What must an adequate account of origins deliver in order to count as a solution rather than a restatement of an intuition?

  The purpose, since adequacy is relative to it: I want an account I could defend in a philosophy of biology seminar and that would not embarrass me in front of colleagues who make embryos for a living. The standard is therefore joint acceptability to metaphysicians and to developmental biologists, and any account that quietly assumes a picture of conception no embryologist would recognize fails on that ground alone.

  Requirements for your answer:

  1. State each requirement together with the case or consideration that motivates it, and mark it as non-negotiable or as the preference of a particular camp. Where it is camp-relative, say which camp, and what it costs them to give it up.

  2. Say what the theory must take the origin to be — the pair of gametes, the zygote, the genome, the cytoplasmic environment, the developmental process initiated at fertilization — and note that this choice, rather than the modal claim, determines which problems arise. The requirements should be stated at that resolution.

  3. The account must handle the following without special pleading:
     (a) Monozygotic twinning, where one zygote yields two individuals; in humans the split may occur anywhere from the two-cell stage to the second week, and late splitting gives conjoined twins. In the nine-banded armadillo a single zygote reliably yields four genetically identical offspring.
     (b) Deliberate embryo splitting, routine in livestock: an early embryo is bisected or its blastomeres separated, each part regulating into a complete animal, and the parts may be carried by different surrogates or one of them frozen for years and transferred later.
     (c) Chimerism, where two early embryos fuse into a single individual carrying two distinct cell lines.
     (d) Nuclear transfer, in which an adult somatic nucleus is introduced into an enucleated egg.
     (e) Mitochondrial replacement, in which a child's nuclear DNA comes from two people and its mitochondrial DNA from a third.
     (f) Artificial activation of an unfertilized egg, which in some vertebrate species produces viable offspring.
     (g) Intracytoplasmic sperm injection, where one sperm out of hundreds of millions is chosen by a person holding a micropipette, so that no fact determines which gamete would otherwise have fertilized the egg.

  4. It must supply identity conditions for the entities it appeals to. An ovulated human oocyte has been arrested in meiotic prophase since before its mother was born; a sperm is a short-lived cell budded off a stem-cell population that renews itself continuously and generates hundreds of millions of competitors. If that very gamete is not a determinate object, an account anchored in gametes inherits the indeterminacy, and I want that counted as a requirement rather than an aside.

  5. It must say what force the necessity bears — metaphysical, nomological, or something weaker — and it must have something to say about the sliding-scale worry: if an organism could have arisen from gametes differing from the actual ones in progressively less significant respects, where does the slide stop, and why.

  6. Identify any subset of these requirements you believe cannot be jointly satisfied. This is the part I most want. If a no-branching condition, the twinning and splitting cases, and the demand that origins not be brute facts pull against one another, I want that stated as a result with the argument sketched, not smoothed over by a distinction introduced at the last minute.

  7. Tell me which single requirement eliminates the most candidates, and where the live disagreement actually lies once the requirements every account already meets have been set aside.

  You may close with two or three sentences on how the best-known accounts fare against the list. Keep it short: the scorecard is the part I can do myself, and I do not want a reading list, as I have one.

  Finally, an epistemic request. Tell me what would change your mind: which of these requirements you hold least securely, and what argument or what piece of biology would make you withdraw it or demote it from non-negotiable to sectarian. And tell me where you expect me to catch you out — a case described inaccurately, an empirical claim stated with more confidence than it deserves, or a modal intuition mistaken for a fact about organisms.
reasoning: |-
  Okay, let me approach this systematically. The user is a retired developmental biologist with 36 years of experience, now deeply engaged in philosophical inquiry about organismal origins. They're frustrated by the lack of embryological grounding in metaphysical debates, particularly Kripke's essentialism about gametes. Their core request is for a specification of what constitutes an adequate theory - one that satisfies both metaphysicians and practicing embryologists.

  Hmm, the level of specificity in their query is remarkable. They've listed seven concrete requirements, including handling complex biological edge cases like monozygotic twinning, chimerism, and mitochondrial replacement. The emphasis on gamete identity is particularly sharp - they want to ensure theories don't treat gametes as metaphysically simple when biologically they're processes. 

  I notice they're especially interested in contradictions between requirements (#6). That suggests they suspect Kripkeanism can't handle twinning without special pleading. The epistemic request at the end is also telling - they want me to flag where I might be wrong, showing they'll scrutinize any overconfident biological claims.

  Right, I'll structure around their seven demands but group related ones. First, the gamete problem: if sperm are transient buds from stem cells, how can "this very sperm" be essential? That alone may sink gamete-based theories. Then the twinning paradox: if the zygote is essential, how can it become two people? Any "no branching" rule seems biologically naive. 

  The sliding scale issue (#5) feels connected to cytoplasmic contributions - if we allow minor mitochondrial differences, why not major nuclear ones? But developmental biology shows cytoplasmic factors can be decisive in some species. 

  For requirement conflicts, the big one seems to be: if we take zygote identity seriously (to avoid gamete indeterminacy), we must explain how it can split into two distinct organisms. No metaphysical account handles both conjoined twins and late-splitting armadillos well. 

  Most eliminative requirement? Probably gamete determinacy - it wrecks Kripke immediately. But the deeper divide is whether identity can be vague (like the cytoplasmic continuum) or must be all-or-nothing. 

  I'll admit cytoplasmic factors might be negotiable if shown truly replaceable. And I'm least sure about artificial activation cases - if parthenogenesis works, does that undermine fertilization's necessity? 

  The user will likely catch any overstatement of mitochondrial influence or underestimation of chimerism frequency. Must tread carefully there.
answer: |-
  Here is a specification for an adequate account of origins, structured by your requirements. The core tension lies in reconciling metaphysical identity with biological process metaphysics.

  ### 1. **Core Requirements & Motivations**
     - **Non-Negotiable: Biological Adequacy**  
       *Motivation*: Accounts must cohere with established embryology (e.g., twinning timing, chimerism frequency). A theory contradicting empirical facts (e.g., claiming zygotes *cannot* split) fails. *Cost of failure*: Rejection by biologists.
     - **Non-Negotiable: Entity Determinacy**  
       *Motivation*: Gametes are transient biological objects. Sperm lack strict identity conditions (stem cell origin; functional equivalence). Anchoring identity in "this gamete" inherits this indeterminacy. *Cost*: Vague origins undermine necessity claims.
     - **Non-Negotiable: No Special Pleading**  
       *Motivation*: Cases like twinning or chimerism must be handled uniformly. If fusion creates one individual, splitting must create two without ad hoc exemptions. *Cost*: Inconsistency in identity criteria.
     - **Negotiable (Metaphysicians): Modal Force**  
       *Metaphysical camp*: Requires *metaphysical* necessity (origins essential in all possible worlds). *Cost of demotion*: Concedes Kripkeanism.  
       *Biological camp*: Prefers *nomological* necessity (essential given biological laws). *Cost*: Weakens anti-haecceitist intuitions.

  ### 2. **Origin Specification**  
  The origin must be the **zygotic stage** (first diploid cell) *including its initial cytoplasmic state*.  
  *Why this choice*:  
  - Gametes alone fail determinacy (Requirement 4).  
  - Genome alone ignores cytoplasmic contributions (mitochondria, mRNAs; Cases e,f).  
  - The "developmental process" is too extended for strict identity conditions.  
  - The zygote is the last biologically identifiable stage *before* individuation events (twinning/splitting).

  ### 3. **Handling Edge Cases (Without Special Pleading)**  
     - **(a) Twinning**: Account must allow one zygote → two individuals. Late splits (conjoined twins) show identity *can* be deferred.  
     - **(b) Embryo Splitting**: Identity must survive artificial disruption if the embryo regulates. Cryopreservation implies identity persists despite metabolic arrest.  
     - **(c) Chimerism**: Fusion of two zygotes → one individual challenges "unique origin" intuitions.  
     - **(d) Nuclear Transfer**: The organism originates from the *reconstructed zygote* (enucleated egg + somatic nucleus), not the donor nucleus.  
     - **(e) Mitochondrial Replacement**: Nuclear DNA + mitochondrial DNA from different sources; the origin is the engineered zygote.  
     - **(f) Artificial Activation**: Parthenotes show fertilization is not metaphysically necessary; the activated oocyte *is* the zygote.  
     - **(g) ICSI**: Gamete selection is arbitrary; "which sperm" can't be essential if biologically interchangeable.

  ### 4. **Identity Conditions for Entities**  
     - **Gametes**: Oocytes are continuous with fetal precursors; sperm are ephemeral products of spermatogonial mitosis. Neither are "fixed" individuals.  
     - **Zygote**: A discrete cell with a membrane, genome, and cytoplasm. Its identity begins at syngamy (nuclear fusion) or artificial activation. *Indeterminacy risk*: If cytoplasmic gradients are essential, boundaries may blur.

  ### 5. **Modal Force & Sliding Scale**  
     - **Force**: Must specify *nomological* necessity (essential under biological laws) to accommodate cases like artificial activation. Metaphysical necessity is untenable (Case f).  
     - **Sliding Scale**: The account must ground "significant respects" in developmental constraints. *Solution*: Essential properties are those whose alteration disrupts developmental capacity (e.g., major aneuploidy). Mitochondrial variants may be tolerable; nuclear DNA changes are not if they block gastrulation. The "slide" stops at thresholds where regulation fails.

  ### 6. **Incompatible Requirements**  
  **The triad that cannot be jointly satisfied**:  
     (i) **No-Branching** (one origin → one organism)  
     (ii) **Biological Adequacy** (twinning occurs)  
     (iii) **Origins Not Brute Facts** (identity must have principled basis)  
  *Conflict*: Twinning violates (i). To save (i), one must either deny twinning creates new individuals (biologically false) or posit retroactive identity (brute fact). *Result*: Accounts must reject (i) or accept brute facts. Kripkeanism fails here.

  ### 7. **Most Eliminative Requirement & Live Disagreement**  
     - **Eliminates Most Candidates**: **Entity Determinacy** (Requirement 4). Gamete-based views (Kripke) fail outright; genome-only views ignore cytoplasmic indeterminacy.  
     - **Live Disagreement**: Whether identity *must* be all-or-nothing (**metaphysicians**) or can admit degrees/vagueness (**biologists**). This frames disputes over:  
       - Is a chimera *one* organism or a colony?  
       - Does cryopreservation interrupt identity?  

  ### Scorecard for Major Accounts  
  - **Kripkeanism** (gamete essentialism): Fails Cases a,b,d,e,g; Ignores Requirement 4.  
  - **Zygote Essentialism**: Struggles with twinning (Case a) unless identity branches (violating no-branching).  
  - **Process-Based Views** (e.g., developmental life history): Best on biology (handles splitting/fusion), but vague on modal force.  

  ---

  **Epistemic Transparency**:  
  - **Least Secure Requirement**: Nomological necessity (Requirement 5). If parthenogenesis showed *identical* development to fertilization, I might demote it to nomological.  
  - **Where You Might Catch Me**: Overstating cytoplasmic determinism. If proven that cytoplasm is fully replaceable *without* developmental effects, Requirement 2 weakens. Also, I may underweight chimerism’s natural frequency.  

  This specification forces accounts to ground identity in biologically tractable entities (*zygotes*, not gametes) while accepting that embryology disrupts tidy metaphysical intuitions. The path forward likely involves *processual identity*.
