  Okay, let's tackle this step by step. The user is deeply engaged with Douglass's 1860 Glasgow address and has three specific, thorny questions about his argumentative strategy. They're clearly not looking for a summary but a rigorous philosophical dissection. 

  First, I need to recall Douglass's core move here: he's insisting on separating the Constitution-as-text from both the government's actions and the framers' unstated intentions. The navigation metaphors feel intentionally layered—compass (direction), chart (map), course (actual path taken). That progression isn't accidental; it visually argues that the text is a tool, not the outcome. The user's spot-on about instruments not being interchangeable, but Douglass might be deliberately escalating from component (compass) to system (chart) to highlight misalignment.

  On textualism: Douglass absolutely rejects original-intent originalism. His "so far, and so far only" is a scalpel—intentions matter only if textualized. But then he paradoxically uses the framers' secretive behavior (closed doors, unpublished debates) as evidence. This seems contradictory until you see his underlying logic: the secrecy isn't proof of their specific intentions about slavery, but proof that their unstated intentions were irrelevant to ratification. The people adopted the text, not the backroom deals. That's why he can leverage their conduct while dismissing their private aims. 

  The "ashamed" point is brilliant. By framing omission as shame-driven concealment, Douglass preempts the "neutral silence" reading. If they'd merely struck a bargain, why hide debates? Why feel shame? He doesn't argue this because he's anchoring it in widely known historical context—the framers' contemporaneous writings (like Madison's notes, though unpublished then) revealed discomfort. His reading of silence isn't assumed; it's inferred from their documented anxiety about slavery's moral stain. 

  Originalism mapping: Douglass is eerily close to public-meaning originalism. He cares what reasonable readers at ratification would glean from the text's "plain reading," not secret framers' intent. But he parts ways with modern originalists by denying that terms like "persons" or "Service or Labour" could honestly include slaves without explicit dehumanizing language. For him, the public meaning collapses when you apply definitions consistently—e.g., if slaves are "persons," they can't be three-fifths human elsewhere. The text's internal contradictions force an antislavery reading. 

  User's depth here is impressive—they’ve caught every nuance. My job is to show how Douglass's moves cohere into a airtight case: the metaphors build, the secrecy evidence supports textualism, and "ashamed" isn't a cheat but a historically grounded rebuttal to neutrality claims.
answer: |-
  Let's dissect Douglass's argument methodically, addressing each query while respecting his 19th-century abolitionist context. I'll avoid anachronisms but clarify where modern concepts might illuminate or diverge.

  ### 1. The Metaphor Shift: Navigational Precision  
  Douglass intentionally layers metaphors to dismantle constitutional conflation:  
  - **Compass vs. Ship**: Distinguishes the Constitution (tool for *direction*) from the Government (actor that *steers*).  
  - **Chart vs. Course**: The Constitution is the *map*; the Government’s actions are the *actual path taken*.  
  **Argumentative Work**: The progression isn’t careless. A compass gives *immediate* direction; a chart provides the *broader framework*. By shifting, he shows:  
    - The Constitution is **both** a specific guide (compass) **and** a structural blueprint (chart).  
    - The Government’s failure ("steering wrong") is a betrayal of the text’s design, not proof of the text’s flaw.  
  The instruments aren’t interchangeable—they’re *complementary*. This forces the audience to see the Constitution as a multi-role document, separable from corrupt implementation.

  ### 2. Textualism vs. Framers' Conduct: A Coherent Doctrine  
  Douglass’s stance: **Radical Textualism with Contextual Ratification Constraints**.  
  - "So far, and so far only" means: Framers’ *unstated* intentions are irrelevant. **But** their *conduct* during drafting/ratification reveals *procedural facts* about the text’s legal status:  
    - **Secrecy of Debates**: Proves the framers knew their *unwritten compromises* (e.g., slavery bargains) lacked democratic legitimacy. Only the public text was ratified.  
    - **25-Year Publication Delay**: Shows the framers *deliberately insulated* the text from scrutiny of their hidden agendas. Thus, post-ratification revelations can’t alter the Constitution’s meaning.  
  **Precise Position**: "The Constitution’s authority derives solely from its adopted text. Evidence of framers’ behavior is admissible only to prove that extra-textual intentions were *excluded by design*, not to import meaning into the text."  

  ### 3. "Ashamed" and the Semiotics of Silence  
  Douglass’s reading of silence is not assumed—it’s *historically grounded inference*:  
  - **Why "ashamed" carries weight**:  
    - Framers like Jefferson and Madison *explicitly condemned slavery in private writings* but avoided constitutional language admitting its immorality.  
    - The Constitution uses euphemisms ("persons held to service or labour") instead of "slaves," signaling discomfort.  
    - The 1808 importation clause (Art. I, Sec. 9) implicitly acknowledges slavery’s barbarity by permitting its future abolition.  
  - **Counter-reading refuted**: If silence meant *neutrality* or *non-endorsement*, why:  
    - Include clauses protecting slave property (Fugitive Slave Clause, 3/5 Compromise)?  
    - Fear publishing debates if their aims were honorable?  
  **Conclusion Dependency**: His antislavery reading *requires* this interpretation. If silence meant neutrality, the Constitution could tolerate slavery. By framing silence as *concealment of shame*, he argues the text’s avoidance of explicit pro-slavery terms *denies it constitutional legitimacy*.  

  ### Originalism Mapping: Convergences and Divergences  
  - **Public-Meaning Originalism (PMO) Resonance**:  
    - Douglass prioritizes the text’s "plain reading" by the ratifying public.  
    - Rejects framers’ secret intentions (like PMO’s rejection of "original intent" in favor of "original public meaning").  
  - **Critical Breaks with Modern Originalism**:  
    - **Moral Absolutism**: PMO seeks historical semantic meaning; Douglass argues semantics *cannot* include slavery without self-contradiction (e.g., "persons" implies full humanity; "republican form of government" forbids tyranny).  
    - **Rejection of Structural Complicity**: Modern originalists might read the 3/5 Clause as *tacitly* protecting slavery. Douglass insists its text only counts population—it *doesn’t* say slaves are property.  
    - **Ratification Sovereignty**: For Douglass, "We the People" included abolitionists and excluded enslaved people. Thus, any pro-slavery reading betrays the People’s trust. Modern originalism rarely engages this democratic legitimacy argument.  

  **Core Insight**: Douglass isn’t just doing early originalism—he’s *weaponizing textualism* against systemic evil. His textual purity claim is a radical democratic argument: The Constitution’s words, untainted by elite cabals, *must* align with natural justice because "the people" would not ratify barbarism. The metaphors, historical evidence, and moral reading of silence all serve this foundational move.
