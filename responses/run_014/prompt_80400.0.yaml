  - Is the equation the right target? Moderate, 50%. Some argue that preserving it is key to intuitive probability assignments (Adams' thesis), while others think it's a red herring if conditionals aren't propositions.
  - Other factors: Empirical work (like probabilistic modals in linguistics) might influence this. Also, formal semantics advances could make non-Boolean frameworks more palatable.

  Overall credence: 30%. Most likely, the equation survives only in weakened forms (e.g., restricted to non-nested conditionals) or in frameworks where conditionals aren't truth-apt. Mainstream acceptance of full Boolean sacrifice seems unlikely.

  Sensitivity: Highest on whether philosophers accept the cost. If new formal tools make non-classical logic easier, or if influential papers push it, this could rise. But currently, resistance is strong.

  Classmate's view: The disagreement is likely about philosophy, not math. The math is clear—Lewis's proof is solid. The debate is over what it implies: whether to abandon the equation or the Boolean framework. The classmate probably sees non-Boolean approaches as "not serious," while the user is open to them.

