answer: |-
  Here are five desiderata for an adequate theory of negative causation:

  1.  **(Profligacy Solution - Non-negotiable):** The theory must provide a principled criterion distinguishing *relevant* omissions (e.g., the gardener's not watering) from the vast number of irrelevant non-occurrences (e.g., Napoleon's not watering) that are equally absent. This criterion should typically involve normative expectations, duties, capacities, or typical causal roles within the specific context.

  2.  **(Counterfactual Grounding - Non-negotiable):** The theory must explain how an omission can be a cause despite the absence of a corresponding positive event (e.g., the non-occurrence of watering). It owes us an account of the counterfactual dependence involved ("if the omission had not occurred, the effect would not have happened") without necessarily reifying the omission as an event, potentially by analyzing dependence on the non-occurrence of an *action* or *event-type*.

  3.  **(Ontological Flexibility - Negotiable):** The theory must either (a) remain neutral on the ontological status of absences (e.g., whether they are genuine entities, properties, or merely ways of speaking) or (b) explicitly justify a specific ontological commitment regarding omissions as causes. It should not presuppose an ontology of absences without argument nor preclude theories that do posit them.

  4.  **(Genuine Causation - Non-negotiable):** The theory must accommodate the strong intuition that omissions can be genuine causes of outcomes (e.g., the death *was caused by* the lack of watering), not merely explanatory factors or conditions. It should explain how an absence can play a genuine causal role in bringing about a positive event.

  5.  **(Preemption & Overdetermination - Non-negotiable):** The theory must handle cases involving preempted or potentially overdetermined omissions (e.g., if the gardener didn't water, *and* the automatic system also failed, which omission caused the death?). This requires an account of causal selection or influence that avoids making causation by omission trivially overdetermined. *Tension may arise with desideratum 1's relevance criteria in complex scenarios.*
