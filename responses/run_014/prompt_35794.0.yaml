  Next, the counterfactual issue. Since omissions aren't events, how can counterfactuals handle them? Desideratum 2 needs the theory to explain how we can meaningfully say "if X had acted, Y wouldn't have happened" without reifying absences. This is probably non-negotiable for any viable theory.

