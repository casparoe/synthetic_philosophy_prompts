answer: |-
  To settle the argument with your roommate, let's break down the puzzle and the reasoning step by step, addressing your specific points of confusion. The puzzle involves a game theory scenario where players must make decisions without communication, assuming all are perfectly rational and know that everyone else is rational. We'll cover both the telegram game (20 people, billion dollars for exactly one sender) and the magazine contest (million dollars divided by total entries), and explain why the symmetric mixed strategy (e.g., sending with probability \( \frac{1}{20} \) in the telegram case) is considered the rational solution in this context.

  ### Key Concepts: Rationality, Symmetry, and Mixed Strategy Nash Equilibrium
  - **Perfect rationality and common knowledge**: Everyone is rational, everyone knows everyone is rational, and this is common knowledge. This doesn't mean all players do the same thing in a pure strategy (like all sending or all not sending). Instead, it leads to a symmetric mixed strategy Nash equilibrium, where each player randomizes their action to make others indifferent. This equilibrium is symmetric because all players are identical and use the same strategy.
    
  - **Why not all do the same thing?** In pure strategies:
    - If all send, multiple people send, so payoff is 0.
    - If none send, payoff is 0.
    - But all-not-send is not a Nash equilibrium because any single player can deviate to sending and get the full prize if no one else sends (which they would, under the belief that others might not send). However, all-send is a Nash equilibrium (albeit a bad one, with payoff 0) because no player gains by deviating to not-sending (payoff is still 0). But all-send is inefficient, and rational players can achieve a better outcome with randomization.

  - **Mixed strategy equilibrium**: In a mixed strategy, each player sends (or enters) with some probability \( p \) that makes them indifferent between sending and not sending. This requires that the expected utility of sending equals the expected utility of not sending. For this to work, we often need a small cost associated with sending (e.g., the cost of sending a telegram or postcard), which is implied in these puzzles even if not explicitly stated. Without a cost, the indifference condition fails, and pure strategies dominate (e.g., always sending if no cost). But with a small cost \( C > 0 \), the equilibrium makes sense.

  ### The Telegram Game: 20 People, Billion Dollars
  - **Setup**: 20 people; if exactly one sends a telegram, that person gets a billion dollars (\( V = 10^9 \)); if zero or multiple send, all get nothing. No communication allowed.
    
  - **Symmetric mixed strategy solution**: Each player sends with probability \( p = \frac{1}{n} \), where \( n = 20 \) is the number of players. This is derived as follows:
    - With a small cost \( C \) for sending (e.g., telegram fee), the indifference condition is:  
      \[
      V \times (1 - p)^{n-1} = C
      \]
      Here:
      - \( V \times (1 - p)^{n-1} \) is the expected utility of sending: it's the prize \( V \) multiplied by the probability that no one else sends.
      - \( C \) is the cost of sending.
      - At equilibrium, this must equal the utility of not sending (which is 0).
    - If \( C \) is chosen such that \( C \approx \frac{V}{e} \) (where \( e \approx 2.718 \)), then \( p = \frac{1}{n} \) satisfies the equation for large \( n \), since \( (1 - \frac{1}{n})^{n-1} \approx e^{-1} \). For \( n = 20 \), \( (1 - \frac{1}{20})^{19} \approx 0.377 \), so if \( C \approx 0.377V \), then \( p = \frac{1}{20} \) holds. Even if \( C \) isn't exactly that, \( p \approx \frac{\ln(V/C)}{n} \) for large \( n \), but \( \frac{1}{n} \) is a practical approximation often used in such puzzles.
    
  - **Why is this rational?**
    - If all players use \( p = \frac{1}{20} \), the probability that exactly one person sends is:
      \[
      P(\text{exactly one}) = n \times p \times (1-p)^{n-1} = 20 \times \frac{1}{20} \times \left(\frac{19}{20}\right)^{19} \approx 0.377
      \]
      This is about 37.7% for \( n = 20 \), which is better than the 0% from all-send or all-not-send.
    - In equilibrium, no player can deviate to improve their expected payoff. If others use \( p = \frac{1}{20} \), then:
      - EU(send) ≈ \( V \times (0.377) - C \), and with \( C = V \times 0.377 \), this equals 0.
      - EU(not send) = 0.
      - So players are indifferent and have no incentive to change their strategy.
    - Without a cost, the mixed strategy doesn't work because EU(send) > EU(not send) if others send with low probability, forcing players to always send (leading to the bad outcome). The cost \( C \) is crucial for indifference.

  - **Does this work for large groups?** Yes, and the probability of success doesn't go to zero. As \( n \) increases:
    - With \( p = \frac{1}{n} \), \( P(\text{exactly one}) = (1 - \frac{1}{n})^{n-1} \approx e^{-1} \approx 0.367 \) (about 36.7%), which is constant. For example:
      - With \( n = 2 \), \( P(\text{exactly one}) = 2 \times \frac{1}{2} \times \frac{1}{2} = 0.5 \).
      - With \( n = 100 \), \( P(\text{exactly one}) \approx e^{-1} \approx 0.367 \).
    - This is far better than all-send (0%) and avoids the inefficiency of pure strategies. It's not a "small-group trick."

  - **Why can't you just agree that one person sends?** Communication is forbidden, which is a key part of the puzzle. If communication were allowed, players could coordinate to have exactly one sender (e.g., by drawing lots), achieving a near-100% chance of success. But without communication, coordination is impossible, and players must rely on decentralized strategies. Forbidding communication makes the puzzle non-trivial and highlights the challenge of achieving coordination through rationality alone.

  ### The Magazine Contest: Million Dollars Divided by Total Entries
  - **Setup**: Readers mail in a postcard with a number \( k \) (entries); the prize is \( \frac{10^6}{S} \) where \( S \) is the total entries; one entry wins the full divided prize. Assume a small cost per entry (e.g., postage or effort), though not always stated.
    
  - **Rational strategy**: Each player should decide whether to enter (send one entry) with a low probability, not send large numbers. Your roommate's "die-rolling" analogy means:
    - Let \( s \) be the expected number of contestants (entries).
    - In equilibrium, each player enters with probability \( q = \frac{1}{s} \).
    - Since \( s = m \times q \) (where \( m \) is the number of potential players), solving \( q = \frac{1}{m q} \) gives \( q = \frac{1}{\sqrt{m}} \) and \( s = \sqrt{m} \).
    - For example, if \( m = 10,000 \) readers, \( s \approx 100 \), and each enters with probability \( \frac{1}{100} \).
    
  - **Why is sending large numbers (like a googolplex) irrational?**
    - If a player sends a huge \( k \), it increases \( S \) (total entries), which dilutes the prize ( \( \frac{10^6}{S} \) becomes very small) and increases the cost (if there's a per-entry cost). In equilibrium, this over-participation reduces expected payoffs for everyone.
    - With rational play, sending \( k = 1 \) with low probability is better because:
      - It avoids excessive dilution of the prize.
      - The mixed strategy balances the chance of winning against the cost and the actions of others.
    - In reality, people sent large numbers because they ignored how their entry affected the total, leading to a "tragedy of the commons" where \( S \) became huge, the prize was diluted, and many lost money on postage. This doesn't mean people are "dumb"—it shows a failure of rationality or common knowledge, as the equilibrium requires everyone to play the symmetric strategy.

  ### Who is Correct? Settling the Argument
  - **Your roommate is mostly correct**, but with nuances:
    - For the telegram game, \( p = \frac{1}{20} \) is a valid symmetric mixed strategy Nash equilibrium if we assume a small cost \( C \) (which is reasonable for real-world actions like sending telegrams or postcards). This strategy maximizes the probability of success (about 37–38% for \( n=20 \)) and works for any group size, with \( P(\text{success}) \approx 36.7\% \) for large \( n \).
    - For the magazine contest, the die-rolling strategy (enter with probability \( \frac{1}{s} \)) is rational and prevents the prize from being diluted, unlike sending large numbers.
    - The prohibition on communication is not "rigging" the puzzle; it's essential to make coordination impossible, forcing players to use individual rationality.
    
  - **Where you were stuck**:
    - "If everyone is rational, shouldn't we all do the same thing?" Not necessarily—rationality can lead to randomization (mixed strategies) to break symmetry and achieve a better group outcome than pure strategies.
    - "The chance of exactly one sender should go to zero as the group gets bigger." It doesn't; it stabilizes around 36.7% with \( p = \frac{1}{n} \).
    - "Why not agree on one sender?" Communication is forbidden, so it's not an option. This constraint makes the puzzle interesting.

  In summary, the symmetric mixed strategy (e.g., \( p = \frac{1}{20} \)) is the rational solution under common knowledge of rationality and with an implied small cost. Your roommate's explanation aligns with game theory, but the cost assumption is key. Without it, the equilibrium falls apart, which might be the source of your confusion. For the magazine contest, sending large numbers is indeed irrational and led to the poor outcome.
