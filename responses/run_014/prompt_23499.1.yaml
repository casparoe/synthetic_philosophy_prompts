  Actually, no. The natural numbers of a transitive model of ZFC must be standard. Why? Because the natural numbers are defined by the formula that says "the smallest inductive set", and in a transitive model, the natural numbers are the real natural numbers. However, note that the problem does not say that M is transitive, only well-founded. But a well-founded model is isomorphic to a transitive model. So without loss of generality, we can assume M is transitive. Then in a transitive model, the natural numbers are standard. Now, what about N? N is an elementary submodel of M. Since M is transitive, N might not be transitive, but the natural numbers of N are the same as the natural numbers of M? 

  Yes. Because the natural numbers are absolute for transitive models. Specifically, the set ω is defined by a Δ0 formula and is absolute. Therefore, if M is transitive, then ω^M is the real ω. Since N is an elementary submodel of M and M is transitive, we have that the elements of N that are natural numbers are the same as in M. Therefore, ω^N = ω^M = ω (the real natural numbers). So the natural numbers in N are standard.

