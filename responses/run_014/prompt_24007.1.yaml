prompt: |-
  I've been reading on my own about how knowledge works — no formal training, just books and articles I come across — and I keep coming back to a paragraph in a book I read last month that tried to explain Nozick's tracking theory and his famous bank case. I copied it out below because I want to know what I can trust from it: I have a nagging feeling that the last part is getting something backwards, but I can't say exactly what, and I'd rather not build more of my thinking on top of a misreading.

  "Nozick's tracking theory says that you know a proposition p just in case p is true, you believe p, and your belief is sensitive to the truth: in nearby possible worlds where p would be false, you would not believe p. The idea is that knowledge requires your belief to be connected to the truth in the right way, which is what rules out the lucky true beliefs of the Gettier cases. The theory's most famous application is the bank case. Suppose you deposited your paycheck at the bank on Friday and have a receipt; you know you deposited your checks, and you know that if you deposited them then the bank has your money. But the bank might have been robbed, or a teller might have embezzled, so you don't know the bank has your money. Nozick's conclusion is that knowledge is not closed under known entailment, since otherwise you'd know the bank has your money. But the cost is less serious than it looks, because on Nozick's own theory you don't actually know you deposited your checks either — you might be a confabulating amnesiac, and your receipt and memory could both be illusions — so the case really just shows that we overstate our knowledge, and the threat to closure dissolves once you see what you really do know."

  I have two suspicions, and I can't tell which is right. First, if Nozick's own theory says you don't know you deposited your checks, I don't see how the bank case threatens closure at all — closure only breaks if you know the premise, know the entailment, and fail to know the conclusion — so either the book is wrong about what Nozick concludes or it's wrong about what his theory says, and I can't tell which. Second, I have a vague sense that the theory is stated a bit thin, that "tracking" is supposed to involve more than the single counterfactual the book mentions, but I can't say why. Could you go through the paragraph and tell me what is accurate, what is a fair simplification, and what is actually wrong — and in particular, does the book's reassurance that the bank case is harmless to closure survive once the details are corrected? No citations or reading list needed; I just want to know what to trust from this paragraph.
