prompt: |-
  I run avalanche search-and-rescue for a mountain rescue association, and I'm the one who has to call, in the field, which of two buried groups we commit the dog team and the diggers to when we can only work one site at a time. It comes up more then I'd like in a winter: two beacons triangulate to two different pockets, the snow is bad, the team is a single unit, and I've got maybe a two hour window before the buried people are gone. I need a decision procedure I can actually run on a slope in the cold with a head full of static, that tells me what to do when I can get the group of four out of the east pocket or the single hiker out of the west gully but not both, and I make the call and I sign for it.

  I don't want it to just be "save the most people." I've read enough of the debate to know that's contested, and I don't want a procedure that papers over that. So ground it in what the argument actually says: what is the real force of the claim that the number of people saved is, by itself, not a reason to save the many over the few (the Taurek line), what are the strongest replies to it, and where does the procedure have to stop and hand the call back to me as a person because it's a values question and not a facts question? Give me the questions to ask in order, what counts as a good enough answer to each, where the procedure stops with a "no, don't commit to that site," and the points where it just has to flag "this one's on you." Be straight about which steps are really judgment calls wearing a procedure costume. Then run it on two real-ish calls from last season: one where the four are a ski patrol team with a radio and the single is a solo backpacker who's already been out longer, and one where the single is a kid. And tell me the cases where the procedure hands me an answer I'm going to hate, and what it simply can't do for me.
reasoning: |-
  Okay, the user runs avalanche search-and-rescue and needs a decision procedure for choosing which group to save when resources are limited. They mentioned two scenarios: saving four ski patrollers versus one solo backpacker, and four people versus a child. They want a procedure grounded in ethical debates, not just "save the most people," and need something practical for field use.

  First, I recall Taurek's argument that numbers alone don't matter. Each person has equal value, so saving one group isn't inherently better than another. The procedure must address this. But counterarguments like Kamm's Aggregation Principle or Scanlon's Contractualism might justify saving more lives. The user needs clarity on when to apply which principle.

  The user’s deeper needs include reducing cognitive load in high-stress situations and having a structured yet flexible process. They also need to handle emotional aspects, like when a child is involved, without compromising ethics. The procedure should flag where personal judgment is unavoidable.

  For the procedure, I consider steps like assessing odds of survival, rescue time, and gear. But Taurek's view complicates Step 3 (numbers). The key is distinguishing between numerical aggregation and other factors like special responsibilities. For example, ski patrollers might have radios, aiding quicker rescues, which is a practical factor, not just numbers.

  In the ski patrol vs. backpacker scenario, the backpacker's longer burial time lowers survival odds. So Step 2 might lead to prioritizing the patrollers. Step 3’s tie-breaker here is practical: better odds and patrollers' gear. The child scenario forces Step 4—emotional weight versus numbers. The procedure stops here, handing the decision back, as ethics can't resolve this objectively.

  The user needs to know where the procedure can't help, like conflicting values. Also, it might yield hard choices, like saving a child over four others, which could be ethically and emotionally taxing. Transparency about judgment calls is crucial for trust in the process.
answer: |-
  Here's a field-deployable decision procedure grounded in the ethical debate, designed for cold, high-stress conditions. It prioritizes actionable questions, flags judgment calls, and explicitly identifies where the ethical buck stops with you. The core tension is **Taurek's Challenge**: *"Why is saving five lives better than saving one? Only if the one life is less valuable, or if the loss of five creates more grief. But each person is equally valuable, and the grief of losing one child can outweigh losing five strangers. Numbers alone don't compel a choice."*

  **The Strongest Replies to Taurek:**
  1.  **Aggregation (Kamm, Parfit):** While each life is equally valuable, allowing *more* equally valuable things to be lost when you could prevent it *is* worse. Preventing greater loss is a reason in itself.
  2.  **Contractualism (Scanlon):** A principle permitting rescue of the many over the few when all else is equal is one no individual could reasonably reject (they'd want it if they were in the larger group). Choosing the few *requires* a special justification.
  3.  **Agent-Neutral Value:** Value exists independently of the agent. More lives saved is objectively better state of affairs, even if the *reason* to act is agent-relative (saving *these* people).

  **The Avalanche SAR Decision Procedure: "C.O.L.D. Call"**

  **(C) Chances: Survival Probability & Rescue Time**
  *   *Question 1: "Based on beacon signal, burial depth, snow conditions, time buried, and visible clues, which group has the HIGHEST estimated probability of survival RIGHT NOW?"*
      *   *Good Enough Answer:* >20% difference in estimated probability (e.g., Group A 60%, Group B 30%). If clear difference, go to that group. STOP. Proceed.
      *   *Judgment Call:* Estimating probability is inherently uncertain. Rely on standard protocols (e.g., burial time curves, snow density assessment).
  *   *Question 2: "Which group can we reach and dig out SIGNIFICANTLY FASTER (e.g., >30 mins difference)?"*
      *   *Good Enough Answer:* Clear difference in terrain access, approach hazards, or digging complexity (e.g., slab vs. tree well). If clear difference, go to the faster-dig group. STOP. Proceed.
      *   *Judgment Call:* Assessing "significant" time difference under pressure. Err on the side of caution.

  **(O) Obligations & Roles**
  *   *Question 3: "Does our team have a STRONG, FORMAL, PRIOR COMMITMENT to one group?" (e.g., patrollers searching for their own teammate, a guided client).*
      *   *Good Enough Answer:* Explicit contractual duty (e.g., guide-client) or core organizational mission (e.g., patroller mutual aid). If YES, go to that group. STOP.
      *   *Judgment Call:* Distinguishing strong duty (guide-client) from weaker affiliation (fellow club member). Weak affiliation is NOT enough. Proceed.
  *   *Question 4: "Is one group composed of PROFESSIONALS (e.g., patrollers) whose rescue enables them to IMMEDIATELY assist other rescues?"*
      *   *Good Enough Answer:* Group has skills/gear AND a viable role in *this specific ongoing operation* if rescued (e.g., patrollers with probes/shovels/radio who can join the dig). If YES, significant weight towards that group. Proceed.
      *   *Judgment Call:* Realistic assessment of their condition post-rescue. Don't count hypothetical future rescues. "Immediately assist *this* op" is key.

  **(L) Lives: The Number Question & Taurek's Challenge**
  *   *Question 5: "Is there a SIGNIFICANT DIFFERENCE in the number of lives?" (e.g., 4 vs 1, 3 vs 1; NOT 2 vs 1).*
      *   *Good Enough Answer:* Significant difference exists (e.g., 4 vs 1). Acknowledge Taurek: Numbers alone aren't decisive, but Aggregation/Contractualism provide strong reasons to save more lives *if no other relevant factors differ*. This step DOES NOT dictate choice; it *flags the reason*. **PROCEDURE STOP:** No automatic decision. Proceed to final integration.
      *   *If "No" (e.g., 2 vs 1, 3 vs 2):* Numbers provide little/no reason. Decision rests entirely on C & O factors. Proceed to Integration.
      *   *Judgment Call:* Defining "significant." 4 vs 1 is clear. 3 vs 1 is likely significant. 2 vs 1 is highly contested – treat as "No significant difference."

  **(D) Decision: Integration & Values Crucible**
  *   *Question 6: "After C & O, do factors CLEARLY favor one group?" (e.g., Group A has much better odds + faster dig, Group B has a strong duty).*
      *   *Good Enough Answer:* Clear preponderance of factors from C & O. Make the call. GO TO THAT GROUP.
  *   *Question 7 (If Step 6 is UNCLEAR, ESPECIALLY AFTER STEP 5): "Is there a COMPELLING VALUE JUDGMENT that overrides the reason provided by numbers?"*
      *   *This is the "ON YOU" FLAG.*
      *   *Examples:* Saving a child over adults (intuitive greater loss/grief?), saving a sole caregiver of dependents vs. unrelated individuals? Saving the group *you* have a deep personal connection to?
      *   *Crucial:* This isn't about "better person." It's about recognizing a value *you* hold deeply that counters the aggregation reason. **PROCEDURE STOP:** This decision is fundamentally yours. Make the call. Sign for it.

  **Procedure Output Summary:**
  *   **STOP & ACT:** Clear answers in C1, C2, O3, O4 (if decisive), or D6.
  *   **PROCEDURE STOP (Values):** D7. The algorithm hands you the ethical weight.
  *   **PROCEDURE STOP (Numbers Reason):** L5. It flags the reason to save more but forces you to integrate it with C & O and potentially D7.

  ---

  **Running the Calls:**

  **Call 1: Four Ski Patrollers (Radio, shorter burial) vs. Solo Backpacker (Longer burial)**
  1.  **C1: Survival Probability:** Patrollers likely higher (shorter burial time, known team protocol). *Difference likely significant.* **Weight: PATROLLERS**
  2.  **C2: Rescue Time:** Patrollers likely faster (better beacon location, accessible slope vs. gully complexity?). *If gully is complex, significant difference. Assume gully adds >30 mins.* **Weight: PATROLLERS**
  3.  **O3: Formal Commitment?** No (unless SAR team is *their* patrol, unlikely). Proceed.
  4.  **O4: Professionals Enabling Rescue?** YES. Rescued patrollers (if viable) can IMMEDIATELY assist with probes/shovels/radio on *this* site. **STRONG Weight: PATROLLERS**
  5.  **L5: Significant Number Difference?** YES (4 vs 1). Strong reason to save patrollers via Aggregation/Contractualism, *reinforced* by C & O factors.
  6.  **D6: Clear Preponderance?** YES. Overwhelming factors favor Patrollers (C1, C2, O4, L5).
  7.  **D7: Compelling Value Override?** Unlikely. Backpacker's solitude isn't typically seen as a *compelling* value override for 4 lives + operational boost. **CALL: COMMIT TO PATROLLERS.**

  **Call 2: Four Adults vs. One Child**
  1.  **C1: Survival Probability:** *Assume equal for this scenario.* Proceed.
  2.  **C2: Rescue Time:** *Assume equal.* Proceed.
  3.  **O3: Formal Commitment?** No. Proceed.
  4.  **O4: Professionals Enabling Rescue?** No. Proceed.
  5.  **L5: Significant Number Difference?** YES (4 vs 1). Strong reason to save the four adults.
  6.  **D6: Clear Preponderance?** NO. Only L5 provides a reason (for the adults). C & O are neutral.
  7.  **D7: Compelling Value Override?** **THIS IS THE "ON YOU" FLAG.**
      *   *The Procedure:* "Step L5 gives a strong reason to save the four adults. However, C and O factors don't add weight. Do you judge that the value of saving the child's life, considering potential greater loss/grief/future potential, constitutes a *compelling* reason to override the reason provided by saving four adults? This is a fundamental value judgment only you can make."
      *   *Possible Outcomes:*
          *   You judge "No Override": **COMMIT TO FOUR ADULTS.**
          *   You judge "Yes Override": **COMMIT TO THE CHILD.**
      *   **The procedure DOES NOT resolve this.** It forces you to confront that L5 provides a reason, but D7 acknowledges a potential, deeply personal, countervailing value. **YOU MUST MAKE THIS CALL.**

  ---

  **Cases Where the Procedure Hands You an Answer You'll Hate:**
  1.  **Saving the Few Over the Many (Due to C/O):** If the single hiker has vastly better odds (C1) and is much faster to dig (C2), while the group of 4 has very low odds and a complex dig, the procedure will clearly direct you to the single hiker. Saving one when you *could* have tried for four (even with low odds) feels terrible, but C1/C2 are paramount survival factors.
  2.  **Saving the Many Over the Child (If No Override):** If you don't invoke D7 in Call 2, the procedure (via L5) leads you to the four adults. Choosing four strangers over one child will feel morally wrenching, even if intellectually justified by aggregation.
  3.  **Letting a Group Die Due to Formal Commitment (O3):** Having to prioritize a single client under contract over a group of 4 unrelated skiers because of O3 feels like violating the "save more lives" principle, but the procedure respects prior commitments.

  **What the Procedure Cannot Do For You:**
  1.  **Resolve Fundamental Value Conflicts (D7):** It can't tell you if saving a child *should* override saving four adults. It can only structure the question.
  2.  **Eliminate Uncertainty in Judgment Calls (C1, C2, "Significant?"):** It relies on your best, stressed, cold assessment. It can't make those assessments for you.
  3.  **Absolve You of Responsibility:** It structures the decision, highlights reasons, and flags value judgments, but YOU are the agent making the call and signing for it. It makes the ethical landscape clearer, not easier.
  4.  **Account for Perfectly Equal Scenarios:** If *everything* is perfectly equal (odds, time, no obligations, same number), it stalls. Flip a coin? That's Taurek's point. (Realistically, perfect equality is vanishingly rare).
  5.  **Predict Grief/Impact:** It deals in survival probability and reasons for action, not the immeasurable future grief of families or societal impact.

  **In essence:** This procedure forces you to prioritize immediate survival factors (C) and specific duties (O) first. It acknowledges the reason provided by numbers (L) but refuses to let it automatically dominate. Most crucially, it **explicitly flags the point (D7) where you must confront your own deepest values under the weight of the aggregation argument and make a choice no algorithm can make for you.** It ensures you've considered the key operational and ethical dimensions before that final, solitary judgment. It won't make the static in your head go away, but it might help you hear your own reasoning through it. Stay safe out there.
