prompt: |-
  A friend who's really into trading sent me his summary of the Kelly criterion after I asked him how much of my account I should risk per trade. He wrote: "The Kelly criterion says to size each bet so you maximize the geometric growth rate of your bankroll, which turns out to be the same thing as assuming you have logarithmic utility of wealth. The deep insight is that ordinary expected-value reasoning is self-defeating: any bet sized above the Kelly fraction has negative expected growth, so an EV-maximizer who takes every positive-EV bet will go broke with probability one. The Kelly bettor, by contrast, can never go broke, because log utility isn't defined at zero wealth. And when you're unsure about the true odds, the standard fix is half-Kelly, which is exactly optimal under uncertainty." I'm inclined to believe him because he sounds confident and the "never go broke" part is appealing, but something about the utility bit feels off. Go through it sentance by sentence and tell me what a careful person who actually works on this stuff would accept, what's subtly wrong, and whether his practical bottom line -- never size above Kelly, because anything more is literally worse -- survives the corrections. End with a final line starting "Verdict:" naming the single worst offender in a few words.
reasoning: |-
  Okay, the user's friend is explaining the Kelly criterion, and the user wants me to dissect it sentence by sentence. Let me start by recalling what the Kelly criterion actually is. It's a formula for determining the optimal size of a series of bets to maximize wealth growth over time. The key points are maximizing the geometric growth rate and using logarithmic utility.

  First sentence: The friend says Kelly maximizes geometric growth rate and is linked to logarithmic utility. That's correct. The criterion does come from maximizing the expected value of the log of wealth. So that part holds up.

  Next, the friend claims that any bet above the Kelly fraction has negative expected growth. This is tricky. Technically, it's the expected growth rate that becomes negative, not the expected value of wealth. If someone bets more than Kelly, the expected log return is negative, meaning their wealth grows slower over time. But the expected monetary value could still be positive. For example, high-risk bets might have high EV but also high variance, leading to potential ruin. So the friend's statement is mostly right but a bit oversimplified. They should specify "expected growth rate" instead of just "negative expected growth."

  Then the friend says an EV maximizer taking every positive bet will go broke with probability one. That's not entirely accurate. It depends on the bet sizes. If they bet small fractions, they might not go broke. But if they risk too much, especially their whole bankroll repeatedly, ruin is likely. The key here is that without proper sizing, ruin is probable but not absolute. The friend's generalization is too strong here.

  The next part about Kelly bettors never going broke because log utility isn't defined at zero. This is misleading. While the Kelly fraction approaches zero as wealth nears zero, it never allows betting everything if there's a risk of loss. So theoretically, you never hit zero. But in practice, if bets are discrete and large, or with leverage, going broke is still possible. Also, log utility approaching negative infinity at zero doesn't physically prevent ruin—it's just a mathematical property. So the friend's claim is mathematically true in continuous models but not in real-world scenarios with large bets or minimum bet sizes.

  Then he mentions half-Kelly as standard under uncertainty. Half-Kelly is a heuristic to reduce volatility and estimation errors. But it's not "exactly optimal" under uncertainty. Optimality depends on the specific uncertainty model. Half-Kelly reduces risk but might be too conservative in some cases. It's a rule of thumb, not a universal solution.

  The user's concern about the utility part makes sense. The friend conflates utility with actual outcomes. Logarithmic utility is a model choice; it's not that other utilities are invalid. People might prefer different risk profiles. Kelly avoids ruin mathematically but might not fit all risk tolerances.

  The practical bottom line: never size above Kelly because it's worse. But "worse" depends on the goal. If someone prioritizes avoiding ruin and long-term growth, Kelly is optimal. For high-risk tolerance seeking larger short-term gains, above-Kelly might be acceptable, though risky. So the friend's advice is generally sound for conservative growth but isn't an absolute rule.

  The worst offender? Probably the claim that EV maximizers go broke with probability one. That oversimplifies and isn't always true, ignoring proper sizing strategies. It misrepresents the risk of ruin.
answer: |-
  Here's a careful, sentence-by-sentence breakdown of your friend's summary, identifying what's accurate, subtly wrong, and the implications for his practical advice:

  1.  **"The Kelly criterion says to size each bet so you maximize the geometric growth rate of your bankroll..."**
      *   **Careful Acceptance:** This is the core definition and correct. The Kelly fraction *f* maximizes the expected growth rate of wealth (G = lim_{n->∞} (1/n) log(W_n / W_0)), which is equivalent to maximizing the geometric mean return.

  2.  **"...which turns out to be the same thing as assuming you have logarithmic utility of wealth."**
      *   **Careful Acceptance:** This is fundamentally correct. Deriving the Kelly criterion *does* arise naturally from maximizing the expected value of the logarithm of wealth (E[log(W)]). This is often stated as having log utility (U(W) = log(W)).
      *   **Subtle Wrongness:** The phrasing "turns out to be the same thing as assuming" can imply that log utility is the *only* sensible utility function or that it's inherently "correct." While log utility has desirable properties for long-term growth (like myopia), other utility functions (e.g., CRRA with γ ≠ 1, CARA) represent different, valid risk preferences. Kelly is optimal *for the specific goal* of maximizing long-term growth.

  3.  **"The deep insight is that ordinary expected-value reasoning is self-defeating..."**
      *   **Careful Acceptance:** This captures the spirit. Pure expected monetary value (EMV) maximization ignores risk of ruin and variance. Betting too large on repeated positive-EV bets *can* lead to ruin or suboptimal growth.
      *   **Subtle Wrongness:** "Self-defeating" is strong. EMV maximization isn't *inherently* self-defeating; it depends on the bet sizing and risk profile. An EMV maximizer who bets *very small* fractions repeatedly won't necessarily go broke and will see their wealth grow, albeit typically slower than the Kelly bettor in the long run.

  4.  **"...any bet sized above the Kelly fraction has negative expected growth..."**
      *   **Careful Acceptance:** This is correct *if* "expected growth" refers specifically to the *expected growth rate* (G) or the *expected change in log wealth*. Betting *f* > *f_Kelly* results in E[Δ log W] < 0.
      *   **Subtle Wrongness:** The term "expected growth" is ambiguous. It does **not** mean E[ΔW] (expected change in monetary wealth) is negative. E[ΔW] can still be positive for bets above Kelly (if the bet has positive EV). The negative growth refers to the *geometric mean* or *log wealth*. Clarifying "expected growth *rate*" or "expected log growth" is crucial.

  5.  **"...so an EV-maximizer who takes every positive-EV bet will go broke with probability one."**
      *   **Careful Acceptance:** Captures the *potential* danger of naive EMV maximization with poor sizing.
      *   **Subtle Wrongness:** This is **significantly overstated and generally false**. It depends entirely on *how* the EMV maximizer sizes their bets.
          *   If they bet their *entire bankroll* on *every* positive-EV bet, yes, ruin is almost certain.
          *   If they bet a *fixed monetary amount* independent of bankroll, they won't go broke (though growth may be poor).
          *   If they bet a sufficiently *small fixed fraction* of their bankroll on each positive-EV bet, they will *not* go broke with probability one (by the Law of Large Numbers or even the Kelly rationale itself). Their growth rate will just be lower than Kelly's. The problem is that naive EMV maximization provides *no guidance* on sizing, leading many to size too large.

  6.  **"The Kelly bettor, by contrast, can never go broke, because log utility isn't defined at zero wealth."**
      *   **Careful Acceptance:** This highlights a key mathematical property: the Kelly fraction *f* approaches 0 as wealth approaches 0. The bet size (f * W) becomes vanishingly small as W approaches 0, preventing a discrete jump to zero from a finite bet. In a continuous model with arbitrarily divisible wealth, ruin is technically avoided.
      *   **Subtle Wrongness:** This is **misleading practically and philosophically**.
          *   **Practical Ruin:** While theoretically avoiding ruin in continuous models, with discrete bets or minimum bet sizes, a Kelly bettor *can* still go broke if a single bet loss exceeds their remaining capital (e.g., bet size = $10, remaining bankroll = $9). "Never go broke" is a theoretical ideal, not a practical guarantee.
          *   **Utility ≠ Physical Law:** The statement "because log utility isn't defined at zero wealth" implies the math *physically prevents* ruin. It doesn't. The property *informs the optimal strategy* (betting f*W), which *minimizes the probability of ruin* but doesn't eliminate it in the real world. The strategy avoids ruin mathematically; the utility function's domain is a consequence, not the cause, in practical terms.

  7.  **"And when you're unsure about the true odds, the standard fix is half-Kelly, which is exactly optimal under uncertainty."**
      *   **Careful Acceptance:** Using a fraction (like half or third) of the Kelly fraction is indeed a *very common and often sensible heuristic* to reduce volatility and protect against estimation errors in real-world uncertainty.
      *   **Subtle Wrongness:** "Exactly optimal under uncertainty" is **false and oversimplified**.
          *   "Uncertainty" is too vague. Optimality depends on the *specific model* of uncertainty (e.g., Bayesian prior, known distribution of estimation error, robust optimization).
          *   Half-Kelly is **not** generally *exactly optimal* under any rigorous, universal model of uncertainty. It's a pragmatic rule of thumb that significantly reduces risk (variance and drawdowns) at the cost of reduced growth, often providing a better risk-adjusted growth profile when estimates are imperfect. There's no single "optimal" fraction without a specific utility function encompassing both growth and risk aversion.

  **Analysis of the Practical Bottom Line:**
  *   **"Never size above Kelly":** This is **largely robust** from the perspective of maximizing long-term geometric growth. Betting *f* > *f_Kelly* does reduce E[log W] and increases the risk of significant drawdowns and potential ruin. For someone whose *sole* objective is maximizing long-term wealth growth, betting above Kelly is indeed suboptimal.
  *   **"Because anything more is literally worse":** This is **true *only* for the specific goal of maximizing E[log W] (long-term geometric growth)**. It is **not universally true**:
      *   **Different Goals:** If an investor has a different utility function (e.g., more risk-averse, needing to meet a specific liability, prioritizing survival probability over max growth), a different fraction (even above Kelly, though rare) *could* be optimal *for their specific utility*.
      *   **Skew Preferences:** An investor specifically seeking high upside potential (positive skew) might accept a lower E[log W] for a chance at much larger, faster gains, even with higher risk of ruin. Kelly minimizes the probability of ruin *for a given growth rate*, not absolutely.
      *   **"Worse" Depends on Metric:** Above Kelly gives higher expected *monetary* value (E[ΔW]) and higher variance. It's "worse" for growth and risk of drawdown, but "better" for potential large short-term gains if luck is favorable.

  **Verdict:** "Probability one" ruin for EMV.
