prompt: |-
  I'm constructing a specification for what an adequate theory of the bootstrapping problem — the puzzle of whether an agent can come to know the reliability of her own information sources by using those very sources — must deliver. Before I evaluate any particular account, I want the full desiderata list: the cases any such theory must get right, the distinctions it must respect, the structural constraints it must be consistent with, and the results it must not contradict. For each desideratum, give the motivating case or consideration behind it, and flag which are non-negotiable (failure on them disqualifies the theory outright) and which are preferences of particular camps.

  The cases to cover should include, at minimum:

  1. The canonical perceptual bootstrapping case: a subject who sees a zebra in a field and reasons that her visual system must be reliable, since it is producing coherent, stable, and successful perceptual output. The theory must say whether she has come to know that her visual system is reliable, and if not, exactly which step in the reasoning fails.

  2. The instrument-checking case: a subject who reads a thermometer, gets a plausible value, and concludes the thermometer is functioning. The theory must say what, if anything, makes this case different from the perceptual case.

  3. The no-lose bootstrapping case: a procedure that is guaranteed, by design or by the structure of the situation, to produce a correct output about the reliability of the source in question (for example, a test that can only pass if the source is reliable, or a situation in which the source's output is trivially entailed by its own reliability). The theory must say whether such a procedure confers knowledge of reliability, and if so, whether this is a genuine exception to the anti-bootstrapping principle or a sign that the principle is too strong.

  4. The rollback case: a subject who uses a belief formed by a process to justify the reliability of the process, and then uses that reliability judgment to justify the original belief. The theory must say whether the circularity is vicious or benign, and what makes it so.

  5. The verification-versus-ratification distinction: the theory must distinguish between using a source to verify a specific claim (which may be legitimate) and using a source to ratify its own general reliability (which is the bootstrapping move). It must say what the line is, and whether it is sharp or gradient.

  6. The first-order-versus-second-order knowledge distinction: the theory must say whether knowing p is different from knowing that one knows p, and whether the bootstrapping problem is a problem about the latter.

  7. The closure principle: the theory must say whether it accepts, denies, or restricts the principle that knowledge is closed under known entailment, and if it restricts it, say what the restriction is and why it is needed.

  8. The trilemma structure: the theory must say which horn of the trilemma (easy knowledge, closure failure, or skepticism) it lands on, and whether it thinks the trilemma is genuine or dissolvable.

  9. The anti-circularity constraint: the theory must say whether it accepts a general anti-circularity constraint on justification (no belief may be justified by a chain of reasons that loops back to itself), and if so, what the constraint is and how it applies to the bootstrapping cases.

  10. The safety and sensitivity conditions: the theory must say whether the bootstrapped belief about reliability is safe (would be true in nearby possible worlds where the subject forms the belief) and sensitive (would not be formed in nearby possible worlds where the process is unreliable), and whether either condition is necessary for knowledge.

  11. The disjunctive response: the theory must address the move whereby the subject is said to know the disjunction "either the process is reliable or p is false" without knowing which disjunct is true, and say whether this is a legitimate response to the bootstrapping problem.

  12. The legitimate self-correction and calibration cases: the theory must distinguish between bootstrapping and legitimate self-correction (using a source to detect and correct a specific error, such as a broken thermometer) and legitimate calibration (using a source to adjust its own output against a known standard). It must say what makes the latter legitimate and the former illegitimate, if it thinks the former is illegitimate.

  For each desideratum, give the case or consideration behind it, and flag any pair of desiderata you suspect can't be jointly satisfied. Then, briefly, score the main existing contenders (reliabilist bootstrapping embracers, closure-deniers, anti-circularity theorists, easy-knowledge deniers, and the skeptical horn) against the list, and say which single desideratum does the most to exclude candidates. A table is fine for the scorecard.
reasoning: |-
  Okay, the user is constructing a specification for a theory on the bootstrapping problem. They want a comprehensive list of desiderata with cases, motivations, and whether each is non-negotiable. They also want to know which desiderata conflict and how existing theories score on them.

  First, I need to understand each of the 12 cases they listed. The perceptual bootstrapping case is key—it's the classic example where someone sees a zebra and concludes their vision is reliable. Any theory must explain why this fails. The instrument-checking case seems similar but might differ because instruments can be independently verified. The no-lose case is tricky because if a test can only pass when reliable, maybe bootstrapping works there? That could challenge the anti-bootstrapping principle.

  The rollback case involves circular justification. Is that always bad? The verification vs. ratification distinction is crucial—using a source to check a claim vs. its own reliability. That line needs clarification. First-order vs. second-order knowledge ties into whether bootstrapping is about knowing reliability or knowing that you know it.

  Closure is a biggie. If knowledge is closed under entailment, bootstrapping might be valid, but that leads to easy knowledge. Denying closure avoids that but is counterintuitive. The trilemma presents three tough choices: accept easy knowledge, deny closure, or embrace skepticism. Each theory picks one.

  Anti-circularity constraints might block bootstrapping, but are they too strict? Safety and sensitivity conditions could help—if the belief isn't sensitive to reliability, it's not knowledge. The disjunctive response is a workaround, but does it solve anything? Legitimate self-correction and calibration must be distinguished from bootstrapping; maybe because they involve independent checks.

  Now, conflicting desiderata. Closure vs. anti-bootstrapping is a major clash. If closure holds, bootstrapping might work, but that's counterintuitive. Anti-circularity and legitimate self-correction might conflict if self-correction seems circular but is acceptable. 

  Scoring theories: Reliabilists embrace bootstrapping but fail on anti-bootstrapping. Closure deniers avoid easy knowledge but reject closure, which is unpopular. Anti-circularity theorists block bootstrapping but struggle with no-lose cases. Easy-knowledge deniers accept skepticism, which is harsh. Skeptics reject all bootstrapping, which might be too extreme.

  The most exclusionary desideratum is probably the anti-bootstrapping intuition—the core idea that you can't justify a source's reliability using itself. Theories that allow this are seen as non-starters by many. 

  The user is likely preparing for academic work, maybe a paper or thesis. They need a structured framework to evaluate theories. Their deeper need is to navigate the philosophical landscape without bias, identifying where compromises must be made. They might also want to develop their own theory, so understanding conflicts is essential. They didn't mention but probably care about practical applications, like AI reliability or epistemology education.
answer: |-
  Below is a comprehensive specification of desiderata for a theory of the bootstrapping problem, structured to address your requirements. For each desideratum, I provide the **motivating case/consideration**, **non-negotiable (NN)** vs. **camp-specific (CS)** status, and **conflicts** with other desiderata. A scorecard for major theories and the most exclusionary desideratum follow.

  ---

  ### **Desiderata for a Theory of Bootstrapping**  
  *(NN = Non-Negotiable; CS = Camp-Specific Preference)*

  1. **Perceptual Bootstrapping Case**  
     - **Case**: Subject sees a zebra, infers visual reliability from coherent perceptual output.  
     - **Requirement**: Theory must explain why this fails to yield knowledge of reliability (or defend success).  
     - **Motivation**: Intuition that self-supporting circularity is epistemically defective (e.g., Vogel 2000).  
     - **Status**: NN (failure implies the theory ignores core problem).  

  2. **Instrument-Checking Case**  
     - **Case**: Subject reads thermometer, infers it’s functioning from plausible readings.  
     - **Requirement**: Theory must explain differences from perceptual case (e.g., independent design standards).  
     - **Motivation**: Thermometers are artifacts with external validation; perception is innate.  
     - **Status**: NN (tests theory’s ability to handle non-innate sources).  
     - **Conflict**: With #12 (if thermometers can bootstrap, why not vision?).  

  3. **No-Lose Bootstrapping Case**  
     - **Case**: A test that only passes if the source is reliable (e.g., "Is 2+2=4?" for a calculator).  
     - **Requirement**: Explain if this yields knowledge and whether it refutes anti-bootstrapping.  
     - **Motivation**: Challenges whether all bootstrapping is vicious (e.g., Weisberg 2010).  
     - **Status**: CS (embraced by reliabilists, rejected by skeptics).  

  4. **Rollback Case**  
     - **Case**: Belief *p* justifies process reliability, which then justifies *p*.  
     - **Requirement**: Diagnose circularity as vicious/benign and why.  
     - **Motivation**: Tests coherence of justification structure (e.g., Fumerton 1995).  
     - **Status**: NN (any theory must address circularity).  

  5. **Verification vs. Ratification Distinction**  
     - **Case**: Using a source to verify "this is a zebra" (legitimate) vs. ratifying "vision is reliable" (illegitimate).  
     - **Requirement**: Define the line (e.g., scope of claims) and its sharpness.  
     - **Motivation**: Blocking bootstrapping while permitting ordinary use (e.g., Cohen 2002).  
     - **Status**: NN (core to isolating the problem).  

  6. **First-Order vs. Second-Order Knowledge**  
     - **Case**: Knowing *p* (e.g., "zebra") ≠ knowing that one knows *p* (requires reliability knowledge).  
     - **Requirement**: Clarify if bootstrapping targets second-order justification.  
     - **Motivation**: Skepticism arises at higher orders (e.g., Sosa 2009).  
     - **Status**: CS (internalists emphasize this; externalists may reject).  

  7. **Closure Principle**  
     - **Case**: If *S* knows *p* and *p entails q*, does *S* know *q*?  
     - **Requirement**: Accept, deny, or restrict closure (e.g., deny for reliability claims).  
     - **Motivation**: Bootstrapping arguments exploit closure (e.g., Dretske 1970).  
     - **Status**: CS (closure-deniers vs. preservers).  
     - **Conflict**: With #1 and #8 (accepting closure enables bootstrapping; denying it avoids skepticism).  

  8. **Trilemma Structure**  
     - **Case**: Must choose: (a) Accept easy knowledge (bootstrapping works), (b) Deny closure, or (c) Embrace skepticism.  
     - **Requirement**: State which horn is taken and defend dissolution if attempted.  
     - **Motivation**: Frameworks the debate (e.g., Vogel 2008).  
     - **Status**: NN (theory must locate itself).  

  9. **Anti-Circularity Constraint**  
     - **Case**: Reject justification chains like *A justifies B justifies A*.  
     - **Requirement**: State if such constraints exist and how they block bootstrapping.  
     - **Motivation**: Avoids question-begging (e.g., Bergmann 2004).  
     - **Status**: CS (internalists endorse; externalists/reliabilists often reject).  
     - **Conflict**: With #3 (no-lose cases may satisfy anti-circularity).  

  10. **Safety and Sensitivity Conditions**  
      - **Case**: Is the belief "vision is reliable" sensitive (if unreliable, wouldn’t believe it) and safe (true in nearby worlds)?  
      - **Requirement**: Apply modal conditions to bootstrapped beliefs.  
      - **Motivation**: Bootstrapped beliefs are insensitive (e.g., fails in hallucination worlds).  
      - **Status**: CS (safety/sensitivity theorists vs. those rejecting conditions).  

  11. **Disjunctive Response**  
      - **Case**: Subject knows "thermometer reliable or T≠98.6°F" but not which.  
      - **Requirement**: Assess if this avoids bootstrapping while preserving closure.  
      - **Motivation**: Proposed solution (e.g., Luper 2006).  
      - **Status**: CS (often a compromise for closure-preservers).  

  12. **Legitimate Self-Correction/Calibration**  
      - **Case**: Using a thermometer to detect its own outlier readings (self-correction) or calibrate against a standard.  
      - **Requirement**: Explain why this differs from bootstrapping (e.g., local error detection vs. global ratification).  
      - **Motivation**: Preserve scientific practices; avoid overgeneralization (e.g., Lyons 2009).  
      - **Status**: NN (theory must not rule out calibration).  

  ---

  ### **Conflicting Desiderata Pairs**  
  1. **#7 (Closure) vs. #1 (Anti-Bootstrapping Intuition)**  
     - Closure + anti-bootstrapping → skepticism (#8). Denying closure avoids this but is counterintuitive.  
  2. **#9 (Anti-Circularity) vs. #3 (No-Lose Cases)**  
     - No-lose cases may satisfy anti-circularity (e.g., infallible sources), challenging NN status of #1.  
  3. **#6 (Second-Order Knowledge) vs. Externalist Theories**  
     - Requiring second-order knowledge invites skepticism; externalists reject this demand.  

  ---

  ### **Theory Scorecard**  
  *(✓ = Satisfies; ✗ = Fails; ~ = Mixed/Partial)*  

  | Desideratum                     | Reliabilist (Embrace BS) | Closure-Denier | Anti-Circularity | Easy-Knowledge Denier | Skeptical Horn |
  |---------------------------------|--------------------------|----------------|------------------|------------------------|----------------|
  | 1. Perceptual BS Fails          | ✗                        | ✓              | ✓                | ✓                      | ✓             |
  | 2. Instrument vs. Perception    | ~ (No distinction)       | ✓              | ✓                | ✓                      | ✓             |
  | 3. No-Lose BS Works             | ✓                        | ✗              | ✗                | ✗                      | ✗             |
  | 4. Rollback Circularity Vicious | ✗                        | ✓              | ✓                | ✓                      | ✓             |
  | 5. Verification ≠ Ratification  | ✗                        | ✓              | ✓                | ✓                      | ✓             |
  | 6. Distinguish FO/SO Knowledge  | ✗                        | ~              | ~                | ✓                      | ✓             |
  | 7. Preserve Closure             | ✓                        | ✗              | ~                | ~                      | ~             |
  | 8. Trilemma: Skepticism Avoided | ✓                        | ✓              | ✓                | ✗                      | ✗             |
  | 9. Anti-Circularity Respected   | ✗                        | ~              | ✓                | ~                      | ✓             |
  | 10. Safety/Sensitivity Applied  | ✗                        | ~              | ✓                | ✓                      | ✓             |
  | 11. Disjunctive Response Valid  | ~                        | ✓              | ✗                | ✗                      | ✗             |
  | 12. Legitimate Calibration      | ✓                        | ✓              | ~                | ✓                      | ✗ (no knowledge) |

  **Most Exclusionary Desideratum**:  
  **#1 (Perceptual Bootstrapping Fails)**. This is the core anti-bootstrapping intuition. Theories embracing reliabilist bootstrapping (e.g., Sosa, some forms of process reliabilism) fail here and are non-starters for most participants in the debate. It forces a choice between closure denial, skepticism, or anti-circularity.

  ---

  ### **Key Insights**  
  - **Non-negotiable desiderata** (#1, #2, #4, #5, #8, #12) ensure the theory engages the problem’s core.  
  - **Camp-specific splits** center on closure (#7), circularity (#9), and no-lose cases (#3).  
  - **Critical tension**: Preserving closure (#7) without permitting bootstrapping (#1) requires rejecting second-order knowledge (#6) or accepting skepticism (#8).  
  - **Best performers**: *Closure-deniers* (e.g., Dretske) and *anti-circularity theorists* (e.g., Bergmann) satisfy most NN desiderata but face counterintuitive costs (denying closure/embracing radical constraints).  

  This framework isolates the trade-offs any adequate theory must navigate, with #1 acting as the primary filter. A successful theory will either dissolve the trilemma (#8) or defend a palatable horn while satisfying all NN desiderata.
