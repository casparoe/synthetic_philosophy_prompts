prompt: |-
  I'm presenting at a two-day workshop on formal epistemology in the spring. The room is mostly traditional epistemologists — internalists about justification and a couple of virtue epistemologists, none of whom work formally — plus three decision theorists who use scoring rules, and a research forecaster at a national weather service who designs verification scores and has told me privately that he thinks the philosophy literature on proper scoring rules is naive about practice.

  The thesis I am defending: the accuracy-dominance argument for Probabilism should be replaced rather than repaired. My sketch runs in three steps. First, every such theorem is relative to a choice of scoring rule. Second, the accuracy-first framework offers no non-question-begging way to choose among strictly proper rules: they agree that incoherence is dominated, but they disagree about how badly a given incoherent agent has gone wrong and about which coherent credence function counts as the minimal revision of it. Third, the only resources left for making that choice are facts about what the inquirer needs the credences for — so epistemic rationality is interest-relative through and through, and the field's standing assumption that the scoring rule must be neutral among the agent's practical purposes is a prejudice nobody has argued for.

  Build me the question-period prep sheet. Give me the eight or nine objections I will actually get in this room, ordered by how much damage each would do, and phrase each one the way the subgroup raising it would phrase it — the forecaster's version should not read like the virtue epistemologist's. For each objection, supply a reply I can deliver in about two minutes, what I should concede immediately, and a candid note on where the reply is softest. Then identify the single objection I will be hoping nobody raises and explain why my argument cannot currently absorb it, and tell me which of the objections I should raise and defuse myself in the body of the talk rather than leave to the floor.
reasoning: |-
  Okay, the user is preparing for a workshop presentation on formal epistemology. They're defending a thesis that the accuracy-dominance argument for Probabilism should be replaced. Their argument has three main steps: scoring rule relativity, no non-question-begging way to choose among proper scoring rules, and the necessity of practical purposes for choosing a scoring rule. The audience includes traditional epistemologists, decision theorists, and a research forecaster, each with different perspectives.

  First, I need to anticipate objections they might face. The user wants eight or nine objections, ordered by potential damage, and phrased in the style of each subgroup. The forecaster should sound different from the virtue epistemologist. Then, for each objection, I should provide a two-minute reply, concessions, and note where the reply might be weak. Also, identify the objection they hope isn't raised and which one to preempt in the talk.

  Let me think about the different subgroups. Traditional internalists might focus on justification without practical interests. Virtue epistemologists could emphasize intellectual virtues. Decision theorists using scoring rules might question the claim that all rules are equal. The forecaster might point out practical implementation issues.

  Top objections by damage:
  1. **Forecaster's objection:** Practical constraints make some scoring rules infeasible. High damage because it challenges the applicability of the argument to real-world scenarios.
  2. **Decision theorist's objection:** All strictly proper rules share core properties. This attacks the second step, suggesting that the choice isn't as arbitrary as claimed.
  3. **Internalist's objection:** Practical interests contaminating epistemology. Undermines the entire interest-relativity conclusion.
  4. **Virtue epistemologist's objection:** Replacing accuracy with practical needs abandons epistemic goals. Questions the shift in focus.
  5. **Internalist's objection:** Minimal revision isn't necessary. Challenges the need for a unique revision, which is part of the argument.
  6. **Decision theorist's objection:** Dominance avoidance as the core. Argues that the core argument doesn't require choosing a rule.
  7. **Internalist's objection:** Justification as internal access. Questions how practical purposes fit with internalism.
  8. **Virtue epistemologist's objection:** Virtues can guide rule choice. Offers an alternative, reducing the need for practical interests.
  9. **Forecaster's objection:** Trade-offs between properness and other features. Highlights that properness isn't the only consideration in practice.

  The user should preempt the internalist's contamination objection in their talk since it's foundational and could derail the discussion. The objection they hope isn't raised is the decision theorist's point about shared core properties because it directly challenges the claim that rules disagree on how badly incoherence is scored, which is central to the argument.

  For each objection, replies should acknowledge valid points while defending the thesis. For example, conceding that dominance avoidance is important but arguing that assessing incoherence severity requires rule choice. Weaknesses might include not fully addressing how to integrate practical purposes or lacking concrete examples.

  The user's deep need is to convincingly argue for interest-relativity in epistemic rationality, challenging established views. They need to handle objections persuasively, especially from diverse experts. Identifying and addressing the most damaging objections proactively is crucial for their presentation's success.
answer: |-
  Here's your question-period prep sheet, designed for maximum impact mitigation in that specific room. The objections are ordered by potential damage (high to medium), phrased in authentic subgroup voices, with tailored replies, concessions, and candid weakness notes. The "hoped-not-raised" objection and preemption strategy are at the end.

  **Core Damage Control Principle:** Your replies must *validate the speaker's core concern* before pivoting to your thesis. Concede ground where their point is technically correct but doesn't fatally wound your argument.

  ---

  **The Objections & Replies**

  1.  **The Forecaster (High Damage - Undercuts Practical Relevance):**
      *   **Objection Phrasing:** "Look, this is ivory tower stuff. In operational verification, we *never* use raw Brier or Log scores. We normalize, weight events by impact, use skill scores against climatology, or focus on specific quantiles. Strict properness is a *baseline* we often sacrifice for stability, interpretability, or aligning incentives with *user* needs like avoiding false alarms for tornadoes. Your 'practical purpose' isn't some abstract 'use' – it's messy, multi-objective, and often requires *breaking* strict properness. How does your 'interest-relativity' handle that?"
      *   **Reply (2 mins):** "You're absolutely right, and thank you for highlighting the crucial gap. My claim isn't that *any* strictly proper rule is used raw in practice – your work shows they often aren't. My point is deeper: *even the choice of baseline strictly proper rule* (Brier vs. Log vs. Spherical) which underpins theoretical arguments like dominance-avoidance, lacks justification *within the purely epistemic accuracy framework*. Your operational tweaks (weighting, normalization, skill scores) are precisely complex, purpose-driven choices *beyond* the baseline rule. This reinforces my third step: the core epistemic norm (avoid dominance) depends on a rule choice driven by purposes, and your work shows these purposes get even *more* complex and practical. My argument explains *why* you *must* move beyond the naive baseline."
      *   **Concede Immediately:** That operational scoring constantly sacrifices strict properness for practical goals.
      *   **Where Reply is Soft:** You haven't provided a clear *epistemological* framework for integrating these messy operational trade-offs back into the "epistemic rationality" debate. It risks making your "epistemic" rationality purely instrumental to non-epistemic goals.

  2.  **Decision Theorist #1 (High Damage - Challenges Core Premise 2):**
      *   **Objection Phrasing:** "You overstate the disagreement. All strictly proper rules agree on dominance-avoidance *and* that coherent credences dominate incoherent ones *in expectation relative to the credence itself*. That's the core normative bite! Differences in 'how badly' a specific incoherent credence scores are like differences in measuring distance – meters vs. feet. The *ordinal* fact of dominance is what matters for the norm, not the cardinal 'badness'. Why isn't that sufficient?"
      *   **Reply (2 mins):** "I agree the dominance-avoidance result itself is robust across rules – that's the 'first step' in my sketch. But Probabilism isn't *just* 'avoid dominance'. We need to assess *degrees* of irrationality for gradational norms and to explain *why* an agent *should* move to a *specific* coherent point (e.g., minimal revision). Here, the choice of rule matters critically. Using Brier might suggest one coherent credence is closest, Log suggests another. The rules disagree wildly on the *expected score* of an incoherent credence relative to the *actual* state. If rationality demands minimizing expected inaccuracy *from the agent's own perspective* – a core accuracy-first claim – then choosing which rule defines that expectation is crucial and rule-relative."
      *   **Concede Immediately:** That dominance-avoidance is invariant across strictly proper rules.
      *   **Where Reply is Soft:** If the norm is *only* "avoid dominated credences," your second step weakens. You need to firmly establish that accuracy-first epistemology *requires* more than just this binary norm (e.g., guidance for revision, gradation).

  3.  **Internalist #1 (High Damage - Contaminates Epistemology):**
      *   **Objection Phrasing:** "This dissolves epistemology into pragmatics! Justification is about *why* the agent holds the belief, accessible internally. Tying rationality to 'what the credences are for' – some future, possibly unknown purpose – makes justification depend on external, contingent factors the agent might not even know about. That destroys the internalist project. How is this still *epistemic* rationality?"
      *   **Reply (2 mins):** "This is the crucial tension. I agree my view is incompatible with standard internalism. But the accuracy-first project *starts* with an externalist, consequentialist notion of epistemic value (accuracy). My argument shows that pursuing this project consistently *forces* us to incorporate purpose. The 'internal access' point hits home: the agent likely *doesn't* know the 'true' scoring rule relevant to their future purposes. This generates a new internalist challenge *within* my framework: what scoring rule *should* an agent adopt *given their uncertainty about their future needs*? This might point towards more robust rules, but it doesn't rescue purpose-neutrality."
      *   **Concede Immediately:** That this view is fundamentally externalist and incompatible with traditional internalism about justification.
      *   **Where Reply is Soft:** You haven't provided a *positive* internalist story within your framework, only highlighted a problem. Internalists will feel their core concern is dismissed as a "tension" rather than a refutation.

  4.  **Virtue Epistemologist (High Damage - Abandons the Good):**
      *   **Objection Phrasing:** "You're replacing the pursuit of accuracy (a core intellectual good) with mere instrumentality. Virtue epistemology shows how intellectual character virtues (like intellectual courage, humility, thoroughness) guide inquiry towards truth *as such*. Reducing this to 'what the credence is for' makes epistemic rationality hostage to potentially trivial or even vicious purposes. Doesn't this sacrifice the *distinctive value* of epistemic rationality?"
      *   **Reply (2 mins):** "A powerful concern. My framework doesn't abandon accuracy as the *goal*; it challenges the idea that there's a single, purpose-neutral *measure* of accuracy. Different virtues might be highlighted by different scoring rules: Log score heavily penalizes extreme confidence errors, perhaps linking to humility; Brier might link more to overall calibration. The choice of rule *itself* could be seen as expressing a virtue relative to anticipated needs. Crucially, *ignoring* purpose doesn't avoid the problem – it just hides the arbitrary choice of a default rule (e.g., Brier). A virtue theory needs to explain *why* that default virtue is universally apt."
      *   **Concede Immediately:** That purpose-relativity risks making epistemic rationality subservient to non-epistemic goals if purposes are ill-chosen.
      *   **Where Reply is Soft:** Linking virtues to scoring rules feels ad hoc. You haven't shown how virtues *determine* a rule choice; it might just push the problem back a step.

  5.  **Internalist #2 (Medium-High Damage - Minimal Revision Not Required):**
      *   **Objection Phrasing:** "Why is 'minimal revision' even a requirement for the *epistemic* norm? Probabilism says 'be coherent'. It doesn't specify *how* to get there from incoherence. Maybe any coherent credence dominating the incoherent one suffices to show irrationality. The scoring rule disagreement on 'minimal revision' seems irrelevant to the core argument."
      *   **Reply (2 mins):** "That's a fair point about the *minimal* dominance argument. However, the accuracy-first program often *does* seek to justify more than just coherence; it aims to justify updating rules (e.g., Conditionalization) via principles like 'minimize expected inaccuracy'. *That* requires a specific scoring rule to define 'expected inaccuracy'. Furthermore, even for dominance, saying an incoherent credence is irrational *because* it's dominated implies it *should* be replaced by one that dominates it. But *which* dominating credence? If different rules point to different dominating points as 'best', the norm 'adopt a dominating credence' lacks specificity. The rule choice determines what counts as 'fixing' the irrationality."
      *   **Concede Immediately:** That the dominance argument *alone* doesn't logically require identifying a unique minimal revision.
      *   **Where Reply is Soft:** If the norm is purely "Be coherent, period," and dominance is just a *way* to show incoherence is bad, the scoring rule choice for dominance matters less. Your reply leans on the broader ambitions of accuracy-first.

  6.  **Decision Theorist #2 (Medium Damage - Misses the Point of Dominance):**
      *   **Objection Phrasing:** "The power of dominance arguments is that they avoid needing to quantify *how much* better one option is. Showing option A is dominated (there exists *some* B better in all states) is sufficient to rule out A, regardless of the exact scoring metric. Why does the 'how badly' or 'minimal revision' point matter for establishing the *norm* against incoherent credences? Isn't the existence of *any* dominating coherent credence enough?"
      *   **Reply (2 mins):** "You're right that for the binary norm 'Reject dominated options,' the *existence* of a dominating coherent credence is sufficient and invariant across rules. However, the accuracy-first literature often presents dominance avoidance as compelling *because* incoherent credences are *accuracy-dominated* – implying that accuracy is the relevant good being violated, and violated *badly* in a measurable way. If the 'badness' is entirely rule-relative, it weakens the intuition pump. More importantly, as mentioned earlier, if we want accuracy-first to do more (justify specific coherent credences as rationally required, justify updating rules), we need the cardinal comparisons that *are* rule-sensitive."
      *   **Concede Immediately:** That dominance *avoidance* as a binary norm can be established without choosing a specific scoring rule.
      *   **Where Reply is Soft:** If the audience is satisfied with *only* the binary norm from dominance, your second step seems less urgent. You rely on the ambition of accuracy-first for broader applications.

  7.  **Internalist #3 (Medium Damage - Justification is Accessible):**
      *   **Objection Phrasing:** "Even if purposes matter, how can an agent rationally choose a scoring rule? Their future needs might be unknown or multifaceted. If they can't know *which* rule is 'correct' for their purpose, how can their credence function be epistemically justified *now*? This seems to make justification perpetually unstable or inaccessible."
      *   **Reply (2 mins):** "This is a profound challenge and a key implication. It *does* introduce a new layer of uncertainty for the agent: uncertainty about the appropriate epistemic standard itself. This might push towards more 'robust' scoring rules that perform reasonably well across a range of potential purposes (e.g., Spherical score vs. Log), or towards credences that are coherent *and* satisfy dominance-avoidance under a *wider class* of rules. It doesn't eliminate justification, but it makes it more complex and context-sensitive, reflecting the agent's (often limited) understanding of their future epistemic situation. Purposive rationality is hard!"
      *   **Concede Immediately:** That this introduces significant complexity and potential instability into the notion of epistemic justification.
      *   **Where Reply is Soft:** This feels hand-wavy ("robustness," "complexity"). You lack a developed account of how agents *should* manage this higher-order uncertainty about scoring rules.

  8.  **Virtue Epistemologist #2 (Medium Damage - Virtues Can Guide):**
      *   **Objection Phrasing:** "Perhaps the choice *between* strictly proper rules *isn't* arbitrary. Couldn't intellectual virtues provide the needed guidance? For instance, a virtue of 'epistemic diligence' might favor the Logarithmic score because it most severely punishes neglect of evidence, while 'intellectual caution' might favor Brier. Purpose matters, but virtue provides the normative framework *for choosing* the purpose-relative rule."
      *   **Reply (2 mins):** "That's a fascinating suggestion and potentially a fruitful way to integrate virtue theory with the formal challenge I'm raising. However, it concedes my core point: the choice of scoring rule isn't determined by accuracy considerations alone. It requires *additional* normative input – in this case, virtues. This reinforces my thesis that the accuracy-dominance argument for probabilism *as standardly presented* (relying solely on dominance and propriety) is incomplete and needs supplementation. Whether virtues are the best source for that supplementation is a further question, but it moves beyond the purely accuracy-focused framework."
      *   **Concede Immediately:** That virtues *could* potentially provide a framework for choosing a scoring rule.
      *   **Where Reply is Soft:** If virtues *can* provide a non-arbitrary, purpose-transcendent way to choose a rule, it partially defangs your "no non-question-begging way" claim. You need to argue virtues *themselves* might be purpose-relative or insufficient for a unique choice.

  9.  **Forecaster #2 (Follow-up / Lower Damage - Implementation Trumps Propriety):**
      *   **Objection Phrasing:** "Following up: In practice, we often care more about *eliciting* honest forecasts than about abstract 'accuracy' measured by a single score. We design scores for incentive compatibility first. Sometimes that *requires* non-proper scores! Doesn't this show that 'accuracy' itself is being defined by the practical goal (honest elicitation), making your 'epistemic accuracy' secondary?"
      *   **Reply (2 mins):** "Exactly! This reinforces my core argument. The dominance argument relies on 'accuracy' defined by a scoring rule. But as you show, the scoring rule is chosen for practical goals like incentive compatibility. What gets labeled 'accuracy' in the formal theorem is *itself* shaped by practical purposes. The forecaster's 'accuracy' (what the score measures) is defined by what best achieves their operational goal (elicitation). This is a concrete example of how the 'epistemic good' (accuracy) is operationalized relative to purpose. The philosopher's quest for a purpose-neutral accuracy measure is an illusion."
      *   **Concede Immediately:** That properness is often sacrificed for elicitation in practice.
      *   **Where Reply is Soft:** You risk conflating "accuracy" (as truth-directedness) with the *measure* of accuracy. A forecaster might say "I use this non-proper score to elicit forecasts, but I *evaluate* true accuracy with a different metric." Your argument needs to handle this potential separation.

  ---

  **The Objection You Hope Nobody Raises:**
  *   **Objection (Likely from a Sharp Decision Theorist):** "Your 'disagreement about how badly' point assumes that expected inaccuracy *relative to the agent's own credence* is the relevant measure for assessing 'badness' or guiding minimal revision. But why privilege *that* expectation? Dominance shows incoherent credences are bad *regardless* of the agent's beliefs. We can assess 'how badly' using the *actual* inaccuracy (or expected inaccuracy relative to a privileged prior, like the equivocator) after the fact. The agent's own credences shouldn't define the standard by which their irrationality is measured. This severs the link between the rule choice and the agent's perspective that your 'question-begging' claim relies on."
  *   **Why it's Devastating:** This attacks the foundational move of your second step. Your claim that choosing a rule is necessary *and* question-begging *within the accuracy-first framework* hinges on accuracy-firsters accepting that the agent's *own* credences define the relevant expectation for expected accuracy (e.g., for minimal expected inaccuracy revision). If the objector rejects that the agent's perspective defines the measure of "how badly" they've erred, then your claim that different rules give different answers (using the agent's credence) becomes irrelevant. The dominance argument could stand alone, and "how badly" could be assessed externally/objectively, potentially independent of the agent's specific rule (or using a single privileged rule). Your entire argument for arbitrariness collapses if the standard for "badness" isn't tied to the agent's own credence-function.
  *   **Why Your Argument Can't Absorb It Now:** Your current sketch likely leans heavily on the standard accuracy-first commitment to "immodesty" or the idea that rational agents should endorse their own credences as best by their own lights. This objection directly challenges that commitment in the context of *evaluating irrationality*. You need a robust defense of why "how badly" an incoherent credence function errs *must* be judged from its own perspective (via expected score relative to itself) for the accuracy-dominance argument to have its full normative force. This requires digging deep into the philosophy of expected utility/immodesty within epistemic contexts, which your current 3-step sketch may not explicitly prepare for.

  **Preemption Strategy: Address THIS in the Talk**
  *   **Which Objection to Preempt:** **Objection #2 (Decision Theorist #1 - "Overstating Disagreement / Ordinal Suffices")**.
  *   **Why Preempt It:** This is highly likely, comes early from a sympathetic but critical subgroup (decision theorists), and if not handled firmly *before* Q&A, it can derail the entire discussion by making your second step seem weak or irrelevant. Conceding the invariance of dominance is essential, but you need to immediately pivot to *why* that's insufficient for the broader accuracy-first ambitions *before* they can raise it. It sets the stage for defending against the "hoped-not-raised" objection later if it comes.
  *   **How to Preempt:** During your presentation of Step 2, explicitly say: "One might object: 'All that matters is the dominance itself; the differences in scores are like units of measurement.' I agree dominance-avoidance is rule-invariant. But accuracy-first epistemology promises more: it aims to explain *gradations* of irrationality, justify *specific* coherent credences as rationally mandated (e.g., as minimal revisions), and ground updating rules like conditionalization on minimizing *expected inaccuracy*. For *these* crucial tasks – which move beyond the binary 'be coherent' command – the choice of scoring rule *is* decisive and lacks a purpose-neutral justification within the framework. The units *do* matter when you need cardinal comparisons." This preemptive strike acknowledges their point, concedes what must be conceded, and redirects to your stronger ground.

  **Good luck!** Your argument is provocative and targets a key foundational assumption. Expect lively pushback, especially from internalists and decision theorists. Focus on validating concerns before redirecting, concede technical points freely where needed, and keep hammering the core dilemma: *If not purpose, then what non-arbitrary principle picks the scoring rule?* Silence on this from the tradition is your best evidence.
