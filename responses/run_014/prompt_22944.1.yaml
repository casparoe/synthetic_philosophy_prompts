  Absolutely, this is a knotty issue that trips up many people—even seasoned game theorists—because the shift from strict to weak dominance reveals hidden assumptions, especially about mixed strategies. I'll walk you through the conceptual differences step by step, using intuition and a custom-built example to anchor everything. The goal is to untangle why weak dominance behaves so strangely, how mixed strategies change what gets eliminated, why deletion order matters, and how this all connects to Nash equilibria. I'll avoid heavy formalism and focus on the underlying logic.

  ### The Core Idea: Why Mixed Strategies Change Everything
  First, recall the definitions:
  - A strategy **S** is **strictly dominated** if another strategy (pure or mixed) *always* gives a higher payoff, no matter what others do. Elimination is uncontroversial: rational players would never play **S**.
  - A strategy **S** is **weakly dominated** if another strategy (pure or mixed) gives at least as good a payoff in *all* scenarios and a strictly better payoff in *at least one* scenario. Here, controversy begins: **S** isn't irrational, but it's never strictly better than its dominator. A rational player *might* avoid it, but they don't *have to*.

  The critical hidden choice you noted is whether the "dominating" strategy must be **pure** or can be **mixed**. This is where the intuition gap lives:
  - **Pure-strategy weak dominance (PSWD)**: **S** is eliminated only if a single pure strategy dominates it. Simple, but limited.
  - **Mixed-strategy weak dominance (MSWD)**: **S** is eliminated if a *blend* of other strategies dominates it. This is more powerful because a mix can "average out" weaknesses no single pure strategy can cover.

  **Why does blending work?** A mixed strategy pools the strengths of multiple pure strategies. Imagine you're a general: no single soldier can win every battle, but a diverse army might. Similarly, a mixed strategy can compensate for scenarios where one pure strategy is weak by combining it with others that are strong there. This lets MSWD eliminate strategies that PSWD can't touch.

  ### Key Question: Can MSWD Eliminate What PSWD Spares?
  **Yes, absolutely.** Here's a minimal 2-player example to show this. I'll construct it so Player 1 has a strategy that no pure strategy dominates, but a mix of their other strategies does.

  #### The Game: "The Unpredictable Weather Dilemma"
  - **Players**: Player 1 (P1, row player), Player 2 (P2, column player)
  - **P1 Strategies**: `A`, `B`, `C`
  - **P2 Strategies**: `X`, `Y`
  - **Payoffs** (P1's payoff shown; P2's are irrelevant for dominance from P1's perspective):

  | P1 \ P2 | `X` | `Y` |
  |---------|-----|-----|
  | **`A`** | 4   | 0   |
  | **`B`** | 0   | 4   |
  | **`C`** | 1.5 | 1   |

  **Intuition**: P1 is choosing how to prepare for weather (`X` or `Y`). `A` is great for `X` but terrible for `Y`; `B` is great for `Y` but terrible for `X`; `C` is a "safe" but mediocre option, decent in both.

  #### Step 1: Pure-Strategy Weak Dominance (PSWD)
  - Compare `C` to `A`:  
    - If P2 plays `X`, `C` (1.5) < `A` (4) → `A` better.  
    - If P2 plays `Y`, `C` (1) > `A` (0) → `C` better.  
    → No dominance (neither always as good or better).  
  - Compare `C` to `B`:  
    - If `X`, `C` (1.5) > `B` (0) → `C` better.  
    - If `Y`, `C` (1) < `B` (4) → `B` better.  
    → No dominance.  
  - `A` vs. `B`: No dominance (each wins in one scenario).  

  **Result under PSWD**: Nothing is eliminated. `C` survives because no single pure strategy (`A` or `B`) weakly dominates it.

  #### Step 2: Mixed-Strategy Weak Dominance (MSWD)
  - Now allow P1 to use a mixed strategy. Consider a 50-50 blend of `A` and `B`:  
    - If P2 plays `X`: Expected payoff = (0.5 × 4) + (0.5 × 0) = 2  
    - If P2 plays `Y`: Expected payoff = (0.5 × 0) + (0.5 × 4) = 2  
  - Compare this mix to `C`:  
    - Against `X`: Mix (2) > `C` (1.5)  
    - Against `Y`: Mix (2) > `C` (1)  
    → The mix *strictly* dominates `C`! (But even weak dominance suffices—if `C` paid 2 against `X`, it would be weakly dominated).  

  **Result under MSWD**: `C` is eliminated because it's weakly dominated by the mix of `A` and `B`.

  #### Why the Blend Works When No Pure Strategy Can
  - **The intuition**: `A` is strong when `X` happens but weak when `Y` happens; `B` is the opposite. Alone, each has a fatal flaw. But a 50-50 mix "hedges" against P2's choices: no matter what P2 does, the mix guarantees P1 a solid payoff of 2 by balancing the risks. `C` is less flexible—it's consistently mediocre. A rational P1 prefers the blend because it strictly outperforms `C` in all cases.
  - **The big picture**: MSWD captures the idea that rational players can use randomization to reduce vulnerability. PSWD misses this because it only looks at pure actions, which might be too "fragile" in isolation.

  ### Why Deletion Order Matters (Only for Weak Dominance)
  Under strict dominance, order doesn't matter—eliminations are robust. But under weak dominance (whether pure or mixed), the sequence can change outcomes. Why? Because eliminating one strategy might *remove the scenario* where another strategy is dominated. Let's extend the example:

  #### Adding a Twist: P2's Payoffs and Iteration
  - **P2's payoffs** (now P2 cares, so eliminations can cascade):
    - If P1 plays `A`, P2 gets 1 for `X`, 0 for `Y` → P2 prefers `X`.
    - If P1 plays `B`, P2 gets 0 for `X`, 1 for `Y` → P2 prefers `Y`.
    - If P1 plays `C`, P2 gets 0 for `X` or `Y` → P2 is indifferent.

  **Scenario 1: MSWD Applied First (Eliminate `C`)**  
  1. `C` is eliminated by MSWD (as above).  
  2. Remaining: P1 has `A` and `B`; P2 has `X` and `Y`.  
  3. P2 now eliminates? Against `A`, `X` is better; against `B`, `Y` is better. But no strategy is dominated for P2 (each is best in some case).  
  4. P1 eliminates? `A` and `B` have no dominance.  
  **Surviving strategies**: `A`, `B` for P1; `X`, `Y` for P2.  

  **Scenario 2: PSWD Applied First (Nothing Eliminated Initially)**  
  1. No PSWD elimination (as above).  
  2. But P2 is indifferent when P1 plays `C`. Suppose we assume P2 avoids dominated strategies first. P2 has no dominated strategies (since against `C`, both `X` and `Y` are equally bad).  
  3. Now, if P2 *believes* P1 might play `C`, and P2 plays `X` (e.g., arbitrarily), then:  
     - P1: Against `X`, `A` (4) > `C` (1.5) > `B` (0) → `A` weakly dominates `B` (since `B` is worse when `X` is played, and equal when `Y` is played if `Y` isn't chosen).  
  4. Eliminate `B` for P1 (weakly dominated by `A` *if P2 plays `X`*).  
  5. Now P1 has `A` and `C`. P2, if P1 plays `A`, prefers `X` (eliminates `Y`).  
  **Surviving strategies**: `A` for P1; `X` for P2.  

  **Outcome depends on order**:  
  - In Scenario 1 (MSWD first), `B` survives.  
  - In Scenario 2 (PSWD first + P2 plays `X`), `B` is eliminated.  

  **Why?** Weak dominance depends on the set of possible opponent strategies. Eliminating `C` first (via MSWD) changes P2's beliefs and incentives, which can alter whether other strategies (like `B`) appear dominated. Order matters because weak dominance is context-sensitive—it's not a global property but depends on which strategies are still "live."

  ### Connection to Nash Equilibria
  Iterated elimination (especially under weak dominance) can remove strategies that are part of Nash equilibria (NE). NE requires strategies to be mutual best responses, but elimination rules out strategies that are never rational *under any belief about opponents*. However, weakly dominated strategies can still be part of NE if the dominance isn't "activated" in equilibrium.  

  In our example:  
  - **PSWD perspective**: `C` survives. One NE is (`C`, `X`) if P2 plays `X` (since if P2 plays `X`, P1 gets 1.5 for `C` > 0 for `B` and 4 for `A`—but if P1 plays `A`, P2 would deviate to `Y`? Let's check properly).  
    - Potential NE: (`C`, `X`).  
      - P1: If P2 plays `X`, `C` gives 1.5. Deviating to `A` gives 4 (better), so not NE.  
    - Another: (`A`, `X`).  
      - P1: If P2 plays `X`, `A` gives 4 (best).  
      - P2: If P1 plays `A`, `X` gives 1 (best).  
      → NE. `C` is not played here.  
  - **MSWD perspective**: `C` is eliminated. But suppose we force `C` into consideration:  
    - (`C`, `X`) is not NE (P1 prefers `A`).  
    - (`C`, `Y`) is not NE (P1 prefers `B` if P2 plays `Y`).  
    - No NE includes `C` because it's never a best response.  

  **The logic**: In this game, `C` is not part of any NE regardless, but in general:  
  - Strictly dominated strategies are *never* in NE.  
  - Weakly dominated strategies *can* be in NE if the opponent's strategy doesn't exploit the weak spot (e.g., a NE where P2 never plays the scenario where `C` is outperformed). But iterated MSWD often eliminates these because it assumes players anticipate and avoid vulnerabilities, even if unexploited.  
  - **Why this clashes with intuition**: Elimination assumes "rationality under all possible opponent plays," while NE only requires "rationality given the equilibrium play." Weak dominance cares about *off-equilibrium* behavior, which NE ignores.  

  ### Key Takeaways for Your Piece
  1. **Mixed strategies unlock "hedging"**: MSWD allows players to blend strategies to dominate inflexible ones, which PSWD misses. This is why economists love MSWD—it models real-world diversification.  
  2. **Weak dominance is fragile**: Order matters because elimination changes the game's information structure. PSWD and MSWD share this flaw, but MSWD amplifies it by enabling more eliminations.  
  3. **NE compatibility**: Iterated elimination (especially MSWD) can be too aggressive, stripping strategies that *could* be rational in equilibrium if opponents don't probe weaknesses. But if a strategy is eliminated, it's "irrational" under broader beliefs.  
  4. **Real-world analogy**: Think of PSWD as "one-tool-fits-none"—it only eliminates obviously flawed strategies. MSWD is "Swiss Army knife"—combines tools to cover more cases, but overzealous deletion might discard useful tools for niche scenarios.  

  This should untangle your knot. For your readership, emphasize intuition: weak dominance is messy because it forces us to confront *how* players think about uncertainty and whether randomization is "rational." Use the weather example—it's relatable and shows how blending outperforms mediocrity. If you need the matrix visualized or more examples, let me know!
