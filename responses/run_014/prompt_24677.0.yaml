  First, I need to recall the core of teleosemantics. Millikan and Dretske argue that a belief's content isn't just what it correlates with, but what it's *supposed* to correlate with based on evolutionary design. The key is the selection history - why a mechanism exists. 

  Now, mapping this to control theory: Setpoints are like desired states, error signals are mismatches between belief and reality. Feedback loops maintain stability by minimizing error. But here's the rub - in control theory, "function" means current input-output relationships (transfer functions), while teleosemantics cares about *why* that function exists historically. 

