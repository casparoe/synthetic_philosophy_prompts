answer: |-
  ### Essay Question Text (as it would appear on the exam paper)

  **Question (25 marks; 75 minutes):**  
  Consider a concrete case: Sam, a competent and focused agent with no distractions or defeaters, believes that the library is open (P) and believes that if the library is open, then their friend is there (P → Q). However, Sam has not yet formed the belief that their friend is at the library (Q)—perhaps due to a momentary lapse.  

  1. **Problem Identification (5 marks):** Explain why this case challenges the standard possible-worlds model of belief. Focus on why the model cannot represent Sam’s state without attributing belief in Q.  

  2. **Repair Comparison (10 marks):** Compare how *two* of the following approaches would handle Sam’s case:  
     - **Impossible worlds** (adding worlds where logic fails)  
     - **Awareness** (requiring explicit "awareness" of a proposition to believe it)  
     - **Restricted closure** (only closing belief under consequences the agent has actually inferred)  
     - **Idealization** (treating logical omniscience as a harmless idealization, like frictionless planes in physics)  
     For each approach, explain: (i) how it avoids attributing belief in Q to Sam; and (ii) what it *gives up* from the original possible-worlds framework.  

  3. **Evaluation and Verdict (10 marks):** Argue which of your two chosen approaches provides a more satisfactory solution to the problem. In your argument:  
     - Explain why a repair that makes belief sets arbitrarily fine-grained (e.g., allowing any pattern of beliefs) risks making belief ascriptions meaningless.  
     - Discuss why idealization might *not* be harmless here—specifically, why "dropping computational limits" differs from "dropping friction" in physics.  
     Conclude with a clear verdict: which approach would you keep, and why does it better preserve what made possible-worlds models valuable?  

  ---

  ### Model Answer (Approx. 700 words; strong student voice, argumentative, with verdict)  

  The problem of logical omniscience exposes a flaw in possible-worlds models of belief: they force agents to believe all logical consequences of their beliefs, which is psychologically unrealistic. In Sam’s case, the model requires Sam to believe Q (their friend is at the library) because every possible world where P (library open) and P→Q hold must also satisfy Q. Sam’s failure to believe Q, despite competence and focus, shows the model cannot capture ordinary agents who haven’t drawn obvious inferences. This isn’t just about time or memory—it’s about how beliefs are *individuated*. Possible worlds tie belief to logical structure, but real agents like Sam have "gaps" where content isn’t fully integrated.  

  I’ll compare impossible worlds and restricted closure as repairs. **Impossible worlds** handle Sam by adding worlds where P and P→Q are true but Q is false (e.g., a world where "if open, friend is there" holds, but the friend isn’t there—a logical impossibility). Sam’s belief set includes this world, so they don’t believe Q. But this gives up the *normative power* of possible worlds. Originally, belief sets were constrained by logic: you couldn’t believe P and ¬P without trivializing everything. Now, with arbitrary impossible worlds, we can ascribe *any* belief set to Sam—say, believing P but not P∨P—by inventing worlds that match. This makes belief ascriptions unconstrained and risks rendering the model vacuous: if anything goes, why use worlds at all?  

  **Restricted closure** solves Sam’s case differently. It only requires belief in consequences the agent has *actually inferred*. Sam hasn’t applied modus ponens to P and P→Q, so Q isn’t in their belief set. This gives up *closure under known implication*, a core feature of possible worlds. Originally, belief was "closed" under logic, ensuring rationality; now, beliefs are fragmented. Crucially, this doesn’t collapse into arbitrariness because inference steps anchor beliefs: Sam’s belief set expands only when they perform explicit reasoning, preserving a link to cognitive dynamics.  

  For a satisfactory solution, we must avoid two pitfalls: (1) making belief so fine-grained that ascriptions lose predictive/normative force, and (2) pretending computational limits are "noise" like friction. Impossible worlds fail (1) spectacularly—by allowing any world, they let us say Sam believes contradictions or nothing at all, gutting the model’s value. Idealization (not my focus but relevant) fails (2): it argues logical omniscience is a harmless idealization, like frictionless planes approximating motion. But friction is external to Newton’s laws, while computational limits are *constitutive* of belief. Two agents with identical explicit beliefs (like Sam pre- and post-inference) differ cognitively only because of these limits; idealization erases that difference, treating Sam as always committed to Q. This undermines the point of modeling *belief*—it’s not about "commitments" but actual cognitive states.  

  Restricted closure survives best. It avoids fine-grained chaos by tying beliefs to inferences: Sam’s belief set isn’t arbitrary but reflects their reasoning history. Yes, it sacrifices closure, but that’s a feature—it mirrors how real agents update beliefs step by step. Crucially, it preserves possible-worlds’ core strength: worlds still define content (e.g., P→Q means the same across worlds), but belief sets are now dynamic. Impossible worlds, by contrast, gut content individuation—if "P→Q" can be true in worlds where Q is false when P is true, what does P→Q even mean? Restricted closure also explains why Sam isn’t irrational: they’re "incompetent" only if we ignore the process of derivation.  

  Verdict: Keep restricted closure. It solves the problem without making belief ascriptions trivial or ignoring computational limits. Impossible worlds are a dead end—they fix omniscience by making the model so flexible it can’t constrain or explain anything.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  **A-grade answers (21–25 marks)** explain what standard a repair must meet to *solve* the problem (not just redescribe it): it must avoid logical omniscience while preserving the possible-worlds framework’s core value (e.g., constraining belief ascriptions, providing normative force, or individuating content). **B-grade answers (16–20 marks)** list repairs and their costs but lack this meta-analysis.  

  1. **Problem Identification (5 marks)**  
     - Explains why possible-worlds models *require* Sam to believe Q: all worlds where P and P→Q hold must satisfy Q, leaving no room for Sam’s unbelief (3 marks).  
     - Clarifies this is not about memory/time but content individuation (e.g., beliefs are tied to logical structure) (2 marks).  

  2. **Repair Comparison (10 marks; 5 per approach)**  
     For *each* of two approaches:  
     - Describes how it handles Sam’s case (e.g., impossible worlds add a world where Q fails; restricted closure omits Q due to no inference) (2 marks per approach).  
     - States what it "gives up" (e.g., impossible worlds sacrifice constraint on belief sets; restricted closure gives up closure under implication) (3 marks per approach).  

  3. **Evaluation and Verdict (10 marks)**  
     - Explains how fine-grained repairs (e.g., impossible worlds) risk unconstrained belief ascription (e.g., "any belief set can be modeled") and why this undermines the model (3 marks).  
     - Discusses why idealization is inadequate: computational limits are *constitutive* of belief (not external like friction), so idealizing them away loses key differences between agents (3 marks).  
     - Chooses one approach and justifies it by arguing how it meets the *standard for a solution*: avoids omniscience while preserving core value (e.g., restricted closure keeps content individuation via worlds but adds dynamics) (4 marks).  

  **A-grade differentiator**: The answer must explicitly state and apply a **standard for a successful repair** (e.g., "must constrain belief ascriptions" or "must explain actual cognitive states without collapsing into triviality"). This is worth 3 of the 4 marks in the verdict section.  

  ---  

  ### Five Common Student Mistakes and Penalties  
  1. **Mistake**: Treating the problem as solely about memory, time, or cognitive load (e.g., "Sam is too busy to think about Q").  
     **Penalty**: -2 marks (misses the core issue of content individuation).  
  2. **Mistake**: Assuming the problem only applies to knowledge (not belief) because "knowledge requires justification."  
     **Penalty**: -2 marks (logical omniscience arises in belief models like doxastic logic).  
  3. **Mistake**: Equating "giving up closure under known implication" (e.g., for restricted closure) with "giving up necessitation" (closure under logical truth).  
     **Penalty**: -2 marks (these are distinct; the former is about inferences between beliefs, the latter about believing tautologies).  
  4. **Mistake**: Proposing impossible worlds as a solution without explaining how worlds are individuated (e.g., not addressing arbitrary ascription).  
     **Penalty**: -3 marks (fails to engage with the cost of the repair).  
  5. **Mistake**: Comparing only one repair or failing to contrast them head-to-head in Part 2.  
     **Penalty**: -5 marks (violates the question’s core requirement).
