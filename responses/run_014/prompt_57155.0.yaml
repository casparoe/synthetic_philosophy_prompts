  The idealization approach, defended by Stalnaker, treats logical omniscience as a harmless idealization, akin to frictionless planes in physics. The model captures an agent's rational commitments, not their actual beliefs. Alex's failure to believe Q is a performance issue, due to computational limits, but the model still correctly represents Alex's belief state as committed to Q. However, this repair also has a cost: it cannot capture the actual beliefs of non-ideal agents like Alex. More critically, computational limits are not analogous to friction. Friction is an external disturbance that distorts an underlying physical law, but computational limits are constitutive of cognitive agents — they define what the agent actually believes at a given time. Two agents with the same explicit beliefs but different inferential capacities (one having derived Q, the other not) would be represented identically in the idealized model, erasing a crucial difference.

