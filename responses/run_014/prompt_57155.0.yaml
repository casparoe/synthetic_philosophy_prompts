  Therefore, impossible worlds, suitably constrained, offer a more realistic model of belief that avoids logical omniscience without sacrificing the ability to capture non-ideal agents. The challenge of constraining impossible worlds is substantial, but it is a refinement of the model, not an abandonment of its core. Idealization, while elegant, abandons the project of modeling actual belief states, which is the very aim of a belief model.

