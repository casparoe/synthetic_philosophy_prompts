    ]
  }
  ```

  **Final Tips**:  
  - **Pre-seed one fanatic option** if groups design only safe bets.  
  - **Track EV on the board** during allocation to highlight optimal choices.  
  - **Embrace chaos**: A jackpot win or stubborn refusal is fodder for debrief.  
  - **Assign pre-reading** *after* the game to avoid priming.  

  This design forces students to confront fanaticism through their own choices, making the philosophical tension visceral. The payoff scheme ensures fanaticism is ex ante rational, while physical randomization and repeated play make the stakes feel real—even when the numbers defy intuition.
