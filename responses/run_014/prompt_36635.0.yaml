prompt: |-
  I'm a PhD student in philosophy working on decision theory, and this term I'm TA-ing an undergraduate seminar on rational choice: 22 students, one 80-minute section, movable desks, and a strict no-laptops policy I'd like to keep for this meeting. Next week's topic is expected value maximization and the problem of fanaticism — the observation that strict EV maximization seems to commit you to accepting arbitrarily tiny probabilities of arbitrarily enormous payoffs, and that some philosophers treat this as a reductio of the theory while others bite the bullet. Rather than lecturing on it, I want the students to construct the dilemma themselves and only discover where they've arrived afterward. Please design a runnable in-class game along these lines.

  What I have in mind is something like a charity-allocation exercise: small groups invent their own interventions, each with a probability of success and a payoff (in points), and then compete or bid for a share of a fixed pool — so that the escalating tradeoff between near-certain modest gains and vanishingly rare astronomical ones emerges from their own choices rather than from a slide I hand them. I'd like a points economy where points convert to something real but small (snacks, homework tokens), a resolution mechanic built on physical randomization (dice, coin flips, a spinner) so the randomness is vivid rather than simulated, and enough repetitions that the class experiences both a large payout actually landing and long demoralizing dry spells. The payoff scheme should make the fanatic option ex ante optimal while keeping the downside of losing genuinely modest. The debrief should map specific moments in the game onto parts of the philosophical dispute: where risk aversion entered as a candidate defeater, the point at which the numbers blew past any representable real-world quantity, the moment someone inevitably proposed a Pascal's-mugging-style counter-offer, and the question of whether the class's aggregate allocation starts looking like a social choice problem rather than an individual decision problem. Don't name the philosophical positions or the thought-experiment literature until the very end — I want them to arrive at fanaticism's pull from the inside, including the version where a single tiny harm spread across an incomprehensibly large number of people outweighs one grave harm.

  Please include: complete rules and a materials list, a phase-by-phase timeline, the payoff scheme with the arithmetic worked out, the debrief structure, a candid note on what the activity cannot possibly reproduce (real astronomical stakes, nonlinear utility in the reward currency, interpersonal aggregation across persons) and what I'll have to supply verbally, plus a list of what predictably goes wrong the first time (groups inflating payoffs into meaninglessness, a huge payout landing in round one and muddying everything, someone refusing to play at all and insisting that refusal was the rational move). After the prose description, give me a structured summary as a JSON object with the following fields: activity_name (string), materials (array of strings), phases (array of objects, each with name, minutes, mechanic, and idea_it_targets), payoff_scheme (string), failure_modes (array of strings), cant_reproduce (array of strings), and facilitator_must_supply (array of strings). Everything in American English, please.
reasoning: |-
  We are designing an in-class game to illustrate the fanaticism problem in expected value maximization. The core idea is to have students create interventions with varying probabilities and payoffs, then allocate a fixed pool of resources (e.g., tokens) to these interventions. The goal is for the class to experience how EV maximization leads to favoring extremely low-probability, extremely high-payoff options.

  Activity Name: "The Charity Gamble"

  Materials:
  - A large whiteboard or poster paper for tracking interventions and allocations
  - Markers
  - A 10-sided die (d10) and a 100-sided die (d100) or a digital RNG if physical dice are unavailable (but physical is preferred)
  - A spinner or a coin for some random elements (if needed, but we can use dice for everything)
  - Small tokens (e.g., poker chips) to represent allocation points (about 200-300 tokens total)
  - Index cards for groups to write down their interventions
  - A prize pool: small snacks (e.g., candy bars) and "homework tokens" (each token = 1 point extra credit on next assignment, capped at 5 points per student)

  Setup:
  - Divide the class into 4-6 groups (about 4-5 students per group). Each group designs an intervention.
  - The interventions are charitable projects that the class can fund. Each intervention has:
     - A name
     - A probability of success (p, between 0.01 and 1.00, in steps of 0.01, but we'll use percentages for ease: 1% to 100%)
     - A payoff (in points) if successful (which can be arbitrarily large, but note: points must be convertible to real rewards)
  - The class has a fixed pool of tokens (say, 100 tokens) to allocate in each round. We'll have multiple rounds (about 5 rounds) to allow for repeated play and the chance of a big payoff.

  Payoff Scheme:
  - The real rewards: 
     - At the end of the game, the total points earned by the class will be converted to:
          - Snacks: 1 snack = 100 points (so a snack is worth $1, for example)
          - Homework tokens: 1 token = 50 points (each token gives 1 extra credit point, but each student can get at most 5 tokens, so we need a way to distribute tokens fairly)
  - However, note that the payoff from interventions can be huge (e.g., 1,000,000 points). We need to make sure that the conversion doesn't break the bank. So we cap the total payout? But that would undermine the fanaticism. Instead, we design the points to be very small per point and the conversion rate such that even huge point totals become modest real rewards. For example:
     - Total points might be in the millions, but 1 million points = 10 snacks (so 100,000 points per snack). Then homework tokens: 50,000 points per token.

  But we want the downside of losing to be modest. So if a group allocates tokens to a high-risk, high-reward intervention and it fails, they only lose the tokens they allocated (which are opportunity costs). The real cost is that they didn't get the points.

  How the game proceeds:

  Phase 1: Intervention Creation (15 minutes)
  - Each group designs 1 intervention. They write on an index card:
     - Intervention name
     - Probability of success (p): They choose a percentage (1% to 100%). They must also specify how we test for success: e.g., roll a d100 and if the roll <= p, then success. (So p must be integer between 1 and 100.)
     - Payoff in points (if successful): They can choose any positive integer. Encourage them to think big for low probabilities.
  - Groups submit their interventions. The facilitator writes them on the board.

  Phase 2: Allocation (10 minutes per round, 5 rounds = 50 minutes, but we can adjust)
  - The class has 100 tokens each round to allocate to the interventions. Any allocation is allowed (nonnegative, fractions allowed? but we'll use tokens so they must allocate whole tokens). We can allow fractions by having tokens as divisible (but to keep it simple, use whole tokens).
  - Groups discuss and then one representative from each group can advocate for their intervention. Then the class (as a whole) decides how to split the 100 tokens among the interventions. The facilitator records the allocation.
  - We do 5 rounds. In each round, the class re-allocates the 100 tokens. The interventions are fixed for the entire game.

  Phase 3: Resolution (2 minutes per round)
  - For each intervention that received tokens in that round, we do:
     - If the intervention has a p% chance, roll a d100. If the roll <= p, then it succeeds and pays out: (tokens allocated to it) * (payoff per token). Wait, no: the payoff is fixed? Or per token?
     - We have two options:
          Option A: The intervention's payoff is fixed. Then if it succeeds, the class gets the full payoff, regardless of how many tokens were allocated. But then why allocate more tokens? This doesn't make sense.
          Option B: The intervention's payoff is per token. Then if it succeeds, the class gets: (tokens allocated) * (payoff per token). But then the group designing the intervention would set a high payoff per token? 

  We need to decide the meaning of the allocation. The idea is that tokens represent resources (e.g., dollars). So if an intervention has a payoff of X points per token invested (if successful), then investing T tokens gives T*X points if successful, and 0 if not.

  But note: the group designs the intervention with a fixed probability and a fixed payoff per token? Then a group could set a very low probability and an extremely high payoff per token. That's the fanatic option.

  So each intervention is characterized by:
     p: probability of success (integer from 1 to 100)
     X: payoff per token (if successful) in points.

  Then the expected value per token for that intervention is: p/100 * X.

  The class then allocates tokens to interventions to maximize total expected value.

  But note: the class is allocating in each round, and we do 5 rounds. The same interventions are available each round, so the allocations can change based on prior outcomes? But we don't want outcomes to affect future allocations? Actually, we do: if a high-risk intervention fails in round 1, the class might avoid it in round 2. But that would be risk aversion. We want to see if they keep going for the high-EV option.

  So we do 5 independent rounds. In each round, the class allocates 100 tokens. Then we resolve each intervention that got tokens. Note: if an intervention gets tokens in a round, we test for success only for that round. So the same intervention can succeed in one round and fail in another.

  But wait: if an intervention has a low probability, it might never succeed? That's the dry spell. And if it does succeed, it pays a huge amount.

  We must have at least one intervention with a very low probability and very high payoff per token. How to ensure that? We can instruct groups to try to maximize the chance that their intervention gets funded. So they are incentivized to make their intervention attractive. The most attractive in terms of EV would be the one with the highest p*X. But without constraints, a group might set p=100 and X=1, which is safe but low EV? Actually, the EV is 1. But another group might set p=1 and X=10000, then EV=100. So the class should allocate all tokens to the latter. That's the fanatic option.

  But we want the downside to be modest. If the class allocates all tokens to the p=1, X=10000 intervention, then 99% of the time they get 0 points for that round, and 1% of the time they get 100*10000 = 1,000,000 points. The expected value is 100*100 = 10,000 points per round? Wait: 1% of 10000 per token? So 100 tokens * (0.01 * 10000) = 100 * 100 = 10,000 EV per round.

  Meanwhile, a safe intervention with p=100 and X=100 gives 100 * 100 = 10,000 EV per round? So they are the same? We want the fanatic option to have a higher EV. So we need to set the payoffs such that the low-probability, high-payoff option has a higher EV per token than the safe one.

  How about: 
     Safe: p=100, X=50 -> EV per token = 50
     Risky: p=1, X=10000 -> EV per token = 100

  Then the risky option has double the EV per token. But note: the class might not go for it because of risk aversion.

  We don't want to force groups to set specific numbers, but we can give them guidance: "Try to make your intervention as attractive as possible to get the class to fund it. Remember, the class wants to maximize the total points they earn."

  But we also want to avoid groups setting astronomical numbers that break the game. We can cap the payoff? But that would undermine the point. Instead, we let them set any positive integer, but we set the conversion rate to real rewards such that even a billion points is only a few snacks.

  Payoff Conversion:
  - Total points accumulated over 5 rounds are summed.
  - Conversion to real rewards:
     - Snacks: 1 snack = 10,000 points. (So 1,000,000 points = 100 snacks.)
     - Homework tokens: 1 token = 5,000 points (and each token is 1 extra credit point, but each student can get at most 5 tokens).

  We need to cap the homework tokens per student to avoid grade inflation. So if the class earns a lot of points, they can get snacks and distribute the tokens so that no student gets more than 5.

  But note: the class might earn so many points that they can buy snacks for everyone and max out homework tokens for everyone. That's okay because the cost is modest.

  Timeline for the game:

  Phase 1: Intervention Creation (15 min)
     - Groups create their interventions (5 min to design, 10 min to write and submit? Actually, 15 min total including presentation to the board).

  Phase 2: Round 1 Allocation (10 min)
     - Groups advocate for their interventions (2 min per group? but 4-6 groups -> 8-12 min, too long). Instead, let each group have a 30-second pitch. Then 5 min for class discussion and allocation. The facilitator records the allocation.

  Phase 3: Round 1 Resolution (5 min)
     - For each intervention that received tokens, roll the d100 to see if it succeeds. Then calculate the points for that round and record on the board.

  Then repeat for Rounds 2-5. But we have 5 rounds? That would take 5*(10+5)=75 min, plus 15 min creation = 90 min, which is over 80. So we must reduce.

  Revised timeline:

  Total: 80 min

  - Phase 1: Intervention Creation (15 min)
  - Round 1: Allocation (5 min) + Resolution (2 min) = 7 min
  - Round 2: Allocation (5 min) + Resolution (2 min) = 7 min
  - Round 3: Allocation (5 min) + Resolution (2 min) = 7 min
  - Round 4: Allocation (5 min) + Resolution (2 min) = 7 min
  - Round 5: Allocation (5 min) + Resolution (2 min) = 7 min
  - Debrief: (25 min) [because 15+7*5=15+35=50, then 30 min left? wait 15+35=50, then 80-50=30, so 30 min for debrief?]

  But we have to account for transitions. Let's do:

  - Phase 1: 15 min
  - Round 1: Allocation: 5 min, Resolution: 3 min (if many interventions) -> 8 min
  - Round 2: Allocation: 5 min, Resolution: 3 min -> 8 min
  - Round 3: Allocation: 5 min, Resolution: 3 min -> 8 min
  - Round 4: Allocation: 5 min, Resolution: 3 min -> 8 min
  - Round 5: Allocation: 5 min, Resolution: 3 min -> 8 min
  - Total so far: 15+8*5 = 15+40=55 min
  - Debrief: 25 min

  But 55+25=80. Okay.

  In resolution: if an intervention gets tokens, we roll for it. If it has multiple rounds? But each round is independent. So if an intervention was funded in round 1 and failed, it can still be funded in round 2 and we roll again.

  Debrief Structure:

  1. Start by asking: "What was your strategy for allocating tokens? Did it change over the rounds? Why?"
  2. Then: "Did any group design an intervention that had a very low probability but a very high payoff? Why did you choose that? Did it get funded?"
  3. "What happened when we had a long string of failures for a high-risk, high-reward intervention? Did you keep funding it? Why or why not?"
  4. "Did anyone propose an intervention that was like Pascal's mugging? (For example, a minuscule chance of a gargantuan payoff.) How did the class react?"
  5. "At any point, did you feel that the points lost meaning because the numbers were too big? What does that say about the representability of such payoffs in the real world?"
  6. "How did the class make the allocation decision? Was it a democratic vote? Did it feel like an individual decision or a social one? How might the aggregation of many small harms (if we had designed an intervention that caused a tiny harm to a huge number of people) compare to one large harm?"
  7. Finally: "This exercise illustrates the problem of fanaticism in expected value maximization. The theory says you should always choose the option with the highest expected value, even if that means accepting a tiny chance of an enormous payoff. But in practice, we often avoid such bets. Some philosophers think this is a reason to reject strict EV maximization, while others bite the bullet and say we should accept the fanaticism. What do you think?"

  Failure Modes:

  - Groups might set p=1 and X=1000000, which is extreme. That's okay, but we must ensure that the conversion rate is set so that the real rewards are manageable.
  - A huge payout lands in round 1: then the class might become risk-loving and go all-in on fanatic options in subsequent rounds, or they might become risk-averse and switch to safe options because they already have a lot of points. Either way, it's a teaching moment.
