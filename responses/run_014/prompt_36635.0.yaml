answer: |-
  ### Activity Design: "The Charity Gamble"

  **Overview**:  
  Students design charitable interventions with probabilistic outcomes, then allocate a shared resource pool (tokens) across these options over multiple rounds. The setup incentivizes high-EV, low-probability bets ("fanatic options") through a points system convertible to real rewards. Randomization uses dice for vivid risk, and repeated play ensures both jackpot wins and dry spells. The debrief connects gameplay to philosophical themes without naming them until the end.

  ---

  ### **Rules and Materials**  
  **Materials**:  
  - Whiteboard + markers  
  - 100 tokens (e.g., poker chips)  
  - 10-sided die (d10) × 2 (simulate d100: one for tens, one for units)  
  - Index cards (one per group)  
  - Snacks (e.g., candy bars; 1 snack = 5,000 points)  
  - Homework tokens (e.g., slips of paper; 1 token = 1 extra credit point; max 5/student)  

  **Player Count**:  
  - 4–5 groups (5–6 students each)  

  **Setup**:  
  - Each group designs **one intervention** on an index card:  
    - **Name** (e.g., "Asteroid Defense Fund").  
    - **Probability of success** (1%–100%, integer only).  
    - **Payoff** (points if successful; any positive integer).  
  - Class starts with **100 tokens** per round (5 rounds total).  

  **Gameplay**:  
  1. **Creation Phase (15 min)**:  
     - Groups invent interventions. Facilitator writes all on the board.  
     - **Example interventions**:  
       - Safe: "Vaccine Drive" (90% success, 150 points).  
       - Fanatic: "Dyson Sphere" (1% success, 1,000,000 points).  

  2. **Allocation Phase (5 min/round)**:  
     - Groups advocate for their intervention.  
     - Class **allocates all 100 tokens** across interventions (whole tokens only).  

  3. **Resolution Phase (3 min/round)**:  
     - For each funded intervention:  
       - Roll d100 (two d10s: one for tens, one for units).  
       - **Success** if roll ≤ probability (e.g., roll 03 for 5% success).  
       - **Points earned** = (Tokens allocated) × (Payoff) if successful.  
     - Record outcomes on the board.  

  4. **Repeat** for 5 rounds (interventions fixed, allocations reset each round).  

  **Payoff Scheme**:  
  - **Points convert post-game**:  
    - 5,000 points = 1 snack.  
    - 2,000 points = 1 homework token.  
  - **EV optimization example**:  
    - Safe: 10 tokens to "Vaccine Drive" (90% success, 150 points).  
      - EV = 10 × 0.9 × 150 = **1,350 points**.  
    - Fanatic: 10 tokens to "Dyson Sphere" (1% success, 1M points).  
      - EV = 10 × 0.01 × 1,000,000 = **100,000 points** (74× higher EV).  
  - **Fanatic incentive**: High per-token payoffs make low-probability options EV-optimal.  
  - **Downside protection**: Losing tokens costs only opportunity (no debt); real rewards are capped per student.  

  ---

  ### **Timeline** (80 min total)  
  | Phase | Time | Description |  
  |-------|------|-------------|  
  | **1. Setup** | 5 min | Explain rules, form groups, distribute materials. |  
  | **2. Creation** | 15 min | Groups design interventions; facilitator records on board. |  
  | **3. Rounds 1–5** | 40 min (8 min/round) | Allocate (5 min) → Resolve (3 min). Repeat ×5. |  
  | **4. Reward Calculation** | 5 min | Sum points; distribute snacks/tokens based on conversion rates. |  
  | **5. Debrief** | 15 min | Guided discussion mapping gameplay to philosophy (see below). |  

  ---

  ### **Debrief Structure**  
  **Goal**: Elicit student experiences first, then reveal philosophical connections.  
  1. **Risk Attitudes** (4 min):  
     - *Ask*: "Did your allocations change after a big win/loss? Why avoid high-EV bets after failures?"  
     - *Target*: Emergence of risk aversion as a "defeater" of EV maximization.  

  2. **Payoff Scale** (3 min):  
     - *Ask*: "When payoffs reached millions, did points feel ‘real’? How might this apply to real-world stakes like human lives?"  
     - *Target*: Representability problem (astronomical numbers → loss of meaning).  

  3. **Pascal’s Mugging** (3 min):  
     - *Ask*: "Did any group propose a ‘too good to refuse’ option? Would you fund an intervention with 0.001% success for 10B points?"  
     - *Target*: Slippery slope to fanaticism; tension between intuition and EV.  

  4. **Aggregation Dilemma** (3 min):  
     - *Ask*: "As a class, did you prioritize one big bet or spread tokens? What if ‘tokens’ were $1 from each human on Earth?"  
     - *Target*: Social choice vs. individual rationality; tiny harms over large populations.  

  5. **Reveal** (2 min):  
     - Name "fanaticism" and "EV maximization" as the topic. Assign reading (e.g., Bostrom on Pascal’s Mugging).  

  ---

  ### **Limitations and Failure Modes**  
  **What the activity cannot reproduce**:  
  - **Real astronomical stakes**: Snacks/tokens trivialize life-or-death consequences.  
  - **Nonlinear utility**: Points assume linear rewards (no diminishing returns for extra credit).  
  - **Interpersonal aggregation**: Harms/benefits distributed across populations remain abstract.  

  **Facilitator must supply verbally**:  
  - "Points represent abstract ‘good done’ (e.g., lives saved), not money."  
  - "EV-max is technically optimal here due to linear point conversion."  
  - "Real-world analogs: climate change (tiny risks of catastrophe), AI safety."  

  **Predictable failure modes**:  
  - **Inflated payoffs**: Groups set payoffs at billions → emphasize conversion rates to ground them.  
  - **Early jackpot**: If Round 1 hits a huge payout, note how it skews risk attitudes (e.g., overconfidence).  
  - **Refusal to play**: A student rejects bets → discuss: "Is ‘do nothing’ rational? What does EV calculation say?"  
  - **Allocation stalemate**: Groups deadlock → impose a 2-min voting timer.  

  ---

