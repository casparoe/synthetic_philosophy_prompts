  - Clarification that each round is independent and interventions can be funded multiple times.
  - The fact that the class must allocate exactly 100 tokens per round (nonnegative integers, and whole tokens only).
  - The idea that the interventions are charitable projects and the points represent the good done (so higher points are better).

