  ok so im taking this phil of social science class and last week we did superrationality, basically the idea that if two really similiar reasoners play a one-shot prisoners dilemma they should both cooperate since they can expect to do the same thing.

  after lecture two friends from my section kept going at it and i couldnt tell who was winning. Maya started saying if you know the other person reasons just like you then defecting while hoping they cooperate makes no sense, you should pick the move that is best when both do it, so cooperate. Leo said that is magical thinking because my choice doesnt cause their choice, rationality is picking the best reply to what they will actually do.

  then Maya said its not about causing, its about evidence, if we really are similiar then me finding myself about to cooperate tells me they probably will too, so cooperation still maximizes expected payoff. Leo answered that only helps with perfect clones with common knowledge, in any realistic case where similarity is partial you just get exploited by a straight defector, so as practical advice its either empty or risky.

  can you walk through their back and forth move by move and say who is right on each point and who is more right overall, plus what both are missing? please finish with a last line that just says Verdict: Maya or Verdict: Leo or Verdict: split
