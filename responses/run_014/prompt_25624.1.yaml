prompt: |-
  I'm organizing a reading group of software engineers and data scientists who meet monthly to discuss decision theory. None of them have formal economics training, but they're comfortable with probability, expected value, and basic calculus. Next month I'm leading a session on Kelly betting and the idea that when you face a sequence of favorable repeated bets, you shouldn't maximize expected wealth — you should maximize expected geometric growth rate, which means betting a fraction of your bankroll rather than going all-in. The session is ninety minutes, and I'll have a whiteboard.

  Don't explain Kelly betting to me. I already understand it. Plan how I should teach it: the order in which the pieces must be introduced and what depends on what, the one worked example that should carry the entire session and what features it needs to have, the misconceptions this audience will predictably form and exactly where in the sequence I should head each one off, what I should explicitly refuse to cover at this level, and a check for understanding I can use near the end to see whether the core idea actually landed.

  I'm especially worried about a few traps. These people know enough math to follow a derivation but not enough to notice when a derivation is answering a different question than the one they thought they asked. They'll have seen expected-value reasoning before and will trust it. And at least two of them will have heard the phrase "Kelly criterion" from poker or sports betting and will arrive with half-remembered rules of thumb. I need the session to make them feel the problem viscerally before I give them the mathematics — otherwise the math will just feel like a clever trick whose motivation they accept on my say-so.

  End your response with a single sentence, on its own line, that summarizes the central pedagogical challenge this topic presents for this audience.
reasoning: |-
  We are teaching Kelly betting to software engineers and data scientists with math background but no economics.
   Key goal: They should understand that for repeated bets, maximizing expected log wealth (geometric growth) is better than maximizing expected wealth (which leads to ruin).
   Central challenge: They trust expected value, so we must make them feel why it fails here.

   Session plan: 90 minutes
   1. (10 min) Set the stage with a simple repeated bet example and ask: "How much should you bet?"
      - Example: A coin flip bet: heads 60%, tails 40%. If heads, you win the amount you bet; if tails, you lose it.
      - Ask: "You have $100. How much would you bet? Why?"
      - Expect: Some will say all-in (because EV is positive: 0.6*1 + 0.4*(-1) = 0.2 per dollar bet). Others might say half.

   2. (15 min) Simulate the all-in strategy for multiple rounds and show ruin.
      - Simulate 10 rounds: with all-in, even one tail ruins you. Show that after 10 rounds, you are broke with 40% chance in the first flip, and even if you win the first, one loss later ruins you.
      - Then, show a fixed fractional betting strategy (say 50% of current bankroll) and simulate 10 rounds. Show that it grows but doesn't go to zero. However, note that 50% might not be optimal.

   3. (15 min) The problem with expected wealth maximization for repeated bets.
      - Ask: "What is the expected value of wealth after one bet if you bet fraction f of your bankroll?"
          - Let initial wealth be W0.
          - After one bet: W1 = W0 * (1 + f) with prob p=0.6, and W0 * (1 - f) with prob 0.4.
          - So E[W1] = W0 * [0.6*(1+f) + 0.4*(1-f)] = W0 * [1 + 0.2f]
          - This is increasing in f -> so to maximize E[W1], bet everything (f=1).
      - But after two bets? 
          - W2 = W0 * (1+f)^2 with prob (0.6)^2, 
          - W0 * (1+f)(1-f) with prob 2*0.6*0.4, 
          - W0 * (1-f)^2 with prob (0.4)^2.
          - E[W2] = W0 * [ (0.6)^2*(1+f)^2 + 2*0.6*0.4*(1+f)(1-f) + (0.4)^2*(1-f)^2 ]
          - Simplify: (1+f)^2 * 0.36 + 2*(1-f^2)*0.24 + (1-f)^2 * 0.16
          - This is a quadratic in f. We can compute for f=1: E[W2] = W0 * [0.36*4 + 0.48*0 + 0.16*0] = W0 * 1.44
          - For f=0: E[W2] = W0 * 1
          - For f=0.5: E[W2] = W0 * [0.36*(2.25) + 0.48*(0.75) + 0.16*(0.25)] = ... = 1.15 * W0? Actually, let me compute:
            = 0.36 * 2.25 = 0.81
            + 0.48 * (1 - 0.25) = 0.48 * 0.75 = 0.36
            + 0.16 * 0.25 = 0.04
            total = 0.81+0.36+0.04 = 1.21 -> so 1.21*W0
          - But note: the expected value after two bets for f=1 is 1.44*W0, which is higher than 1.21. Why is this not convincing?
      - Point: The expected value is higher for f=1, but the problem is that in the all-in strategy, you have a 16% chance of being broke after two bets (if two tails) and a 48% chance of having 0 (if one head and one tail, because after the first loss you are broke and the second bet doesn't happen? Actually, we must be careful: if we are ruined after the first loss, then we cannot bet again. So we need to model bankruptcy.

   4. (10 min) Adjust the model to include bankruptcy and show that all-in leads to ruin with probability 1 in the long run.
      - If you bet all-in repeatedly, the first time you lose you are broke. The probability of never losing is (0.6)^n -> 0 as n->infty. So ruin is certain.
      - Therefore, we must avoid ruin. So we need to bet a fraction.

   5. (20 min) Introduce the idea of growth rate: we want to maximize the long-term growth rate.
      - The growth rate per bet is the logarithm of the growth factor. Why log?
          - Because if we multiply the bankroll by factors, the log of the bankroll adds up.
          - After n bets, wealth Wn = W0 * (1+f)^(wins) * (1-f)^(losses)
          - So log(Wn) = log(W0) + wins * log(1+f) + losses * log(1-f)
          - The growth rate per bet is (log(Wn) - log(W0)) / n = (wins/n) * log(1+f) + (losses/n)*log(1-f)
          - As n->infty, by law of large numbers, wins/n -> p, losses/n -> 1-p.
          - So the long-term growth rate is: g(f) = p * log(1+f) + (1-p)*log(1-f)
      - We want to maximize g(f) over f in [0,1).

   6. (15 min) Derive the Kelly fraction for the coin flip.
      - g(f) = 0.6 * log(1+f) + 0.4 * log(1-f)
      - Take derivative: g'(f) = 0.6/(1+f) - 0.4/(1-f)
      - Set to zero: 0.6/(1+f) = 0.4/(1-f) -> 0.6(1-f) = 0.4(1+f) -> 0.6 - 0.6f = 0.4 + 0.4f -> 0.6-0.4 = 0.6f+0.4f -> 0.2 = f -> f=0.2
      - So the optimal fraction is 20%.

   7. (5 min) Compare the growth rates for f=0.2, f=0.5, f=1.0.
      - For f=0.2: g(0.2) = 0.6*log(1.2) + 0.4*log(0.8) = 0.6*0.1823 - 0.4*0.2231 = 0.10938 - 0.08924 = 0.02014 (about 2% per bet)
      - For f=0.5: g(0.5) = 0.6*log(1.5) + 0.4*log(0.5) = 0.6*0.4055 - 0.4*0.6931 = 0.2433 - 0.27724 = -0.03394 (negative -> leads to ruin in the long run)
      - For f=1.0: g(1.0) = 0.6*log(2) + 0.4*log(0) -> undefined because log(0)=-inf. So growth rate is -infinity.

   8. (10 min) Worked example: Show a simulation of 100 bets for f=0.2 and f=0.5 and f=1.0 (if we allow negative wealth, but we don't, so for f=1.0 it stops at first loss). Compare the terminal wealth and the growth paths.

   9. (5 min) Address misconceptions:
      - Misconception 1: "Kelly is about maximizing expected value." -> No, it's about maximizing growth rate. We saw that maximizing expected value leads to ruin.
      - Misconception 2: "Kelly is the same as the rule of thumb I heard in poker." -> The rule of thumb (edge/odds) is a special case. We derived it for a simple coin flip. In general, the Kelly fraction is (bp - q)/b for a bet that pays b:1, which in our case b=1, so p - q = 0.6-0.4=0.2. But we are not covering general payouts in this session.
      - Misconception 3: "I should always bet the Kelly fraction." -> We are not discussing risk preferences or the effect of uncertainty in p. We are assuming known p and a long sequence.

  10. (5 min) Check for understanding:
      - Ask: "Suppose you have a bet that wins 70% of the time, and when you win you double your bet (so you get 2:1 odds, meaning if you bet $x and win, you get $2x back, so net gain $x). How would you compute the Kelly fraction?"
          - Let b = 1 (because for every dollar bet, you win $1 net? Actually, no: if you bet $x and win, you get $2x back (so you get your bet back plus $x net). So the net odds are 1:1? Actually, wait: the payout is 2:1 meaning you get $2 for a $1 bet? But then net gain is $1. So b=1.
          - However, note: the example above had a 1:1 payout. Now the win gives you a net gain of 100% of your bet (so same as above) but the probability is 70%? Then f = p - q = 0.7 - 0.3 = 0.4.
          - But let's do it by the formula: 
            g(f) = 0.7 * log(1 + f) + 0.3 * log(1 - f)   [because when you win, you gain f fraction, so multiply by (1+f); when you lose, you lose f, so multiply by (1-f)]
          - Then set derivative: 0.7/(1+f) - 0.3/(1-f) = 0 -> 0.7(1-f)=0.3(1+f) -> 0.7 - 0.7f = 0.3 + 0.3f -> 0.4 = f -> f=0.4.
          - So they should be able to set up the growth rate function.

  11. What to avoid:
      - We are not covering multiple simultaneous bets, correlated bets, or the full Kelly criterion for arbitrary payoff distributions.
      - We are not discussing the volatility of the Kelly strategy or fractional Kelly.
      - We are not proving the optimality beyond the derivative test.

  Central pedagogical challenge: Overcoming the deeply ingrained intuition that maximizing expected value is always optimal, by demonstrating its catastrophic failure in repeated bets and replacing it with the geometric growth paradigm.
answer: |-
  ### Teaching Plan: Kelly Betting for Software Engineers and Data Scientists

  #### **Session Structure (90 min)**  
  **Goal:** Replace expected-value maximization with expected log-wealth maximization as the intuitive standard for repeated bets.  
  **Core Conflict:** Make them viscerally feel why maximizing expected wealth fails catastrophically in repeated bets.

  ---

  #### **1. Introduce the Betting Scenario (10 min)**  
  - **Problem Setup:**  
    - "A casino offers a coin-flip game: 60% chance of heads (win what you bet), 40% chance of tails (lose what you bet). You start with $100 and can play monthly for 20 years (240 bets). How much of your bankroll do you bet *each time*?"  
    - *Audience trap:* They’ll default to expected-value reasoning. Let them suggest strategies (all-in, half, etc.).  

  - **Highlight the Misalignment:**  
    - "Maximizing expected wealth after one bet says: Bet everything! Expected value = 0.6 × (double bankroll) + 0.4 × (zero) = +20% return. But is this sane for 240 bets?"  
    - *Preempt misconception:* Ask: "What happens if you go all-in twice? What’s the probability of ruin?" (Answer: 64% chance of ruin after two bets).

  ---

  #### **2. Simulate Disaster with Expected-Value Maximization (15 min)**  
  - **Worked Example (All-In Strategy):**  
    - Simulate 10 bets on the whiteboard. Start with $100.  
      - Bet 1: Heads → $200. Bet 2: Tails → $0. **Ruin by bet 2.**  
    - Key observation: Probability of survival after *n* bets = \(0.6^n\). For 240 bets, \(0.6^{240} \approx 10^{-50}\) → **certain ruin**.  
    - *Visceral takeaway:* "Maximizing expected wealth ignores ruin. It’s mathematically correct but practically suicidal."  

  - **Contrast with Fractional Betting:**  
    - Show 50% fractional bet: $100 → Heads: $150 → Tails: $75. No ruin, but is this optimal?  

  ---

  #### **3. Reframe the Objective: Growth Rate (20 min)**  
  - **The Flaw in Expected Wealth:**  
    - Wealth multiplies: If you win, wealth grows by \((1 + f)\); lose, shrinks by \((1 - f)\).  
    - After two bets: Expected wealth = \( (0.6^2)(1+f)^2 + (2 \times 0.6 \times 0.4)(1-f^2) + (0.4^2)(1-f)^2 \).  
    - Plug in \(f = 1\): Expected wealth = \(0.36 \times 4 + 0.48 \times 0 + 0.16 \times 0 = 1.44 \times \text{initial}\). Still attractive!  
    - *Trap:* "The math says all-in is best! Why does it feel wrong?" → **Because it ignores compounding and ruin.**  

  - **Introduce Geometric Growth:**  
    - "We care about multiplicative growth: \(\text{Wealth}_n = \text{Wealth}_0 \times (1+f)^{\text{wins}} \times (1-f)^{\text{losses}}\)."  
    - Take logs: \(\log(\text{Wealth}_n) = \log(\text{Wealth}_0) + \text{wins} \times \log(1+f) + \text{losses} \times \log(1-f)\).  
    - **Growth rate per bet:** \( g(f) = \frac{\log(\text{Wealth}_n) - \log(\text{Wealth}_0)}{n} \approx p \log(1+f) + q \log(1-f) \) (by law of large numbers).  

  ---

  #### **4. Derive the Kelly Criterion (15 min)**  
  - **Maximize Growth Rate:**  
    - \( g(f) = 0.6 \log(1+f) + 0.4 \log(1-f) \).  
    - Calculus: Solve \(\frac{dg}{df} = 0\) → \( \frac{0.6}{1+f} = \frac{0.4}{1-f} \) → \( f^* = 0.2 \).  
    - *Why logs?* Logs turn multiplicative growth into additive growth → align with long-term compounding.  

  - **Compare Strategies:**  
    - \( f = 0.2 \): \( g = 0.6 \log(1.2) + 0.4 \log(0.8) \approx 0.6 \times 0.182 - 0.4 \times 0.223 = 0.020 \).  
    - \( f = 0.5 \): \( g \approx 0.6 \times 0.405 - 0.4 \times 0.693 = -0.034 \) (ruin inevitable).  
    - \( f = 1.0 \): \( g = -\infty \) (certain ruin).  

  ---

  #### **5. Worked Example: Terminal Wealth Simulation (15 min)**  
  - **Simulate 20 bets for \(f = 0.2\) vs. \(f = 0.5\) vs. all-in:**  
    - Use a simple script (or whiteboard):  
      - \(f = 0.2\): Start = $100. Bet 1: Win → $120. Bet 2: Lose → $96. Bet 3: Win → $115.2, etc.  
      - \(f = 0.5\): Start = $100. Win → $150. Lose → $75. Win → $112.5 → Volatile, likely decline.  
      - All-in: Ruin on first loss (median ruin time: 1-2 bets).  
    - **Key insight:** \(f = 0.2\) grows steadily; others risk ruin or degrade.  

  ---

  #### **6. Debunk Misconceptions (10 min)**  
  - **Where to address traps:**  
    - *After deriving \(f^* = 0.2\):* "I heard Kelly is ‘edge over odds’!" → Acknowledge: For bets paying \(b\):1, \(f^* = \frac{bp - q}{b}\). Here \(b = 1\), so \(f^* = p - q = 0.2\). But we focus on why logs, not rules of thumb.  
    - *During growth rate discussion:* "Isn’t maximizing EV always rational?" → No: EV maximizes one-shot wealth; log-wealth maximizes long-term compounding. They answer different questions.  
    - *At the end:* "Should I always bet exactly Kelly?" → No (mention overbetting risk, uncertainty in \(p\)), but that’s advanced. Today: Why log-wealth beats EV in repeated bets.  

  - **Explicitly Exclude:**  
    - Multiple simultaneous bets, uncertain probabilities, non-linear utility, Kelly’s volatility properties.  
    - "Today’s goal: Why geometric growth beats arithmetic growth in repeated bets. Period."  

  ---

  #### **7. Check for Understanding (5 min)**  
  - **Question:** "You find a new coin: 70% win chance, same payout (1:1). What’s the Kelly fraction? What’s wrong with betting 60%?"  
    - *Answer:* \(f^* = 0.7 - 0.3 = 0.4\). Betting 60%: \(g = 0.7 \log(1.6) + 0.3 \log(0.4) \approx 0.7 \times 0.470 - 0.3 \times 0.916 = -0.02\) → slow ruin.  
    - **Why this works:** Tests grasp of \(f^* = p - q\), log-growth intuition, and overbetting risk.  

  ---

  #### **Central Pedagogical Challenge**  
  Making the failure of expected-value maximization feel viscerally inevitable—not just mathematically provable—so that maximizing expected log-wealth emerges as the natural solution.
