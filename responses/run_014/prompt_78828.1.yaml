prompt: |-
  I'm taking a philosophy of mind course this term (second year, mostly undergrads) and we just did a session on the color phi phenomenon, where you flash a dot in one place and then a dot of a different colour somewhere else a fraction of a second later, and subjects report a single dot that travels across the gap and changes colour partway — which is strange, because the colour change gets reported as happening before the second dot has even appeared. Our lecturer laid out the two standard stories for it: either the experience itself gets edited before it's ever presented to you (the Stalinesque version, where the show trial happens backstage before the audience is let in), or the experience happens as normal and then your memory of it gets quietly rewritten (the Orwellian version). Then she said something quick about there being no fact of the matter between the two and moved on, and I didn't catch the arguement. We have a 1500 word response paper due friday so I'd rather not get this wrong.

  Anyway, two people in my study group, Maya and Jonah, have been argueing about it ever since, and they've asked me to referee and I honestly can't. It went roughly like this. Maya: the distinction is fake, because anything we ever learn about a person's experience comes out as some kind of output — a sentence, a button press, a rating — and every output is produced after the fact, so no experiment could ever tell you whether the editing happened before or after the experience. It's like asking whether a file was edited before or after it was saved when the only thing you ever get to look at is the saved file. Jonah: that's too quick, because if "the experience" just means whatever eventually gets reported, then you've defined consciousness as the output and turned yourself into a behaviourist who's dissolved the puzzle instead of solving it — there's an obvious difference between a system that revises a signal and then presents it and a system that presents it and then revises the record, one of them is a lie and the other is a rewrite, and that difference doesn't stop being real just because we can't see it. Maya: real in what sense? If no possible observation could distinguish them then they're the same state of affairs described in two vocabularies, which is a distinction without a difference. Jonah: not everything real has to be observable, and anyway I think you could test it — don't ask them about the colour, use a probe that isn't a report, like priming something during the gap, or a measure that's sensitive to whether the first dot was already coloured in by the time the second one landed; if the revision is finished by then the processing signature should look different from a system that only revises on the way into memory. Maya: a priming measure is still an output, just a quieter one, you're still reading the finished product in a different font — and to catch the difference you'd have to look at the system mid-stream, before it's done, and there's no moment where the stream stops being a process and becomes a presentation you could compare things against, there's no finish line. Jonah: the finish line is wherever you want it to be, which is exactly the problem, you've built the conclusion into the picture — a brain is a physical system with a causal order, so if the second colour is influencing the earlier part of the signal, that's a structural fact about what the system must be like, and structure is observable in principle even if not by asking. Maya: then show me the experiment, because every one you've proposed either asks for a report (which is memory) or measures a correlate of the report (which is also downstream); and notice that your structural difference only exists if you assume a particular architecture, one with a buffer that holds the original around long enough to be overwritten — if the system never had an original to store then the Orwellian story has nothing to revise, so your real difference is conditional on a design choice, and the design choice is exactly what's at issue. Jonah: then the distinction isn't empty, it's architecture-relative, and that's true of every claim in cognitive science — whether a process stores an intermediate result is a perfectly respectable empirical question. Maya: right, and that's my point, it's an engineering question about buffers, not a fact about when consciousness happened, so by the end of the argument you've quietly swapped the interesting claim for a boring one.

  Can you go through it move by move and tell me who's right about what — rate each of the moves if that helps — and say what both of them are missing? I'm especially interested in whether the "no fact of the matter" line is a deep result about consciousness or just an artifact of the fact that all our evidence about experience has to come out of the person somehow, and whether these two are even still disagreeing about the same thing by the end or whether it's gone partly verbal. And if you think one of them is more right overall, say so and say why.
