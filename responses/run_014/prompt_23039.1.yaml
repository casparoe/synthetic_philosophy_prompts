prompt: |-
  I'm on my hospital's ethics committee and we've got a case that's been sitting on our plate for a week. A 27-year-old woman is the only live match for a patient who'll need a kidney transplant within a few months or he'll die. She's a complete stranger to him, and she's about to start a family — the surgical risk and the permanent hit to her kidney function are real for her, and she's said she doesn't want to donate, though she's not 100% closed to it. The patient's family wants us to put pressure on her, and a couple of my commitee mates think we should at least offer a big financial incentive. Can you draft the short written opinion I'll circulate before we vote? I want a concrete recommendation — what the committee should and shouldn't do about her, with a time frame — and I want it to actually take the "a life is on the line, so she ought to just do it" argument seriously instead of waving it away as utilitarianism. And be honest about the strongest reason we *should* push her, if there is one.
reasoning: |-
  Okay, the user is on a hospital ethics committee dealing with a tough case. A 27-year-old woman is the only live match for a kidney transplant needed to save a patient's life. She's a stranger to him and is planning to start a family. She's hesitant due to surgical risks and permanent reduction in kidney function. The patient's family is pushing for pressure or financial incentives, and some committee members agree. The user needs a draft written opinion for the committee vote, with a concrete recommendation, timeframe, and a serious consideration of the "life on the line" argument.

  First, I need to unpack the ethical tensions here. The core conflict is between the potential donor's autonomy and the recipient's right to life. The woman's reluctance is understandable—donating a kidney involves real risks, especially for someone planning pregnancy, as it can increase risks of preeclampsia and other complications. The permanent loss of kidney function is a valid concern. On the other hand, a man's life is at stake, and she's the only match. This creates immense pressure.

  The family's request for pressure or financial incentives raises red flags. Coercion undermines the ethical foundation of live donation. Financial incentives could exploit her situation, potentially leading to undue influence. Ethically, voluntary consent is paramount. The committee must avoid any action that could be seen as coercive.

  The user wants the "life on the line" argument addressed seriously. The strongest reason to encourage donation is the immediate, certain death of the patient without her kidney. However, this doesn't override her autonomy. The committee can facilitate support and information but must respect her decision. 

  The timeframe is crucial. The patient has months, so there's time for the woman to reconsider voluntarily. Rushing her could backfire. The committee should set a deadline for her decision, perhaps 2-4 weeks, allowing space without pressure.

  Potential deeper needs: The user might be grappling with guilt over the patient's impending death and seeking validation that respecting autonomy is correct despite the outcome. The committee might also need reassurance that their role is to uphold ethics, not outcomes. Ensuring the woman isn't stigmatized is important—her refusal must be respected without backlash.

  Recommendations should include no pressure, no financial incentives, providing support, and exploring alternatives. The opinion must balance empathy for the patient's plight with unwavering commitment to donor rights. Highlighting alternatives like paired exchanges or deceased donors offers hope without compromising ethics.
answer: |-
  ## ETHICS COMMITTEE OPINION: Potential Living Kidney Donor Case (Ref: #EC-2023-DNR-08)

  **Date:** [Insert Date]  
  **To:** Ethics Committee Members  
  **From:** [Your Name/Committee Role]  
  **Subject:** Recommendation Regarding Solicitation of Potential Unrelated Living Donor  

  ### I. Case Summary
  A 27-year-old woman (Ms. X), medically cleared as the sole identified living match, is being considered as a potential kidney donor for a critically ill patient facing mortality within months without transplantation. Ms. X is a stranger to the recipient. She has expressed reluctance to donate, citing concerns about surgical risks, permanent reduction in kidney function, and her plans to start a family. While not absolutely refusing, she has clearly stated she does not *want* to donate. The recipient's family urges the committee to apply pressure or offer significant financial incentives to secure her donation.

  ### II. Core Ethical Conflict
  This case presents a profound tension between two fundamental values:
  1.  **The Sanctity of Life:** A human life is imminently at stake. Ms. X possesses the unique biological capacity to prevent this death. Failing to explore every *ethical* avenue to facilitate donation could be seen as passively allowing a preventable death.
  2.  **Bodily Autonomy and Non-Coercion:** Living organ donation is an extraordinary act of altruism. It requires free, voluntary, and informed consent. Coercion, pressure, or undue financial inducement violates core medical ethics principles (respect for persons, non-maleficence) and potentially exploits vulnerability. Ms. X faces significant personal medical risks and life-altering consequences.

  ### III. Analysis of Key Arguments
  *   **"A Life is on the Line, So She Ought to Just Do It" (The Utilitarian Imperative):**  
      This argument carries undeniable emotional and moral weight. The potential benefit to the recipient (life) is immense, while the direct physical cost to Ms. X, while significant, is not typically life-ending. **This is the strongest reason to encourage donation.** Ethically, we *should* ensure Ms. X fully understands the profound positive impact she *could* have. However, recognizing this imperative **does not ethically justify overriding her autonomy.** Society does not compel citizens to undergo significant bodily harm to save strangers (e.g., forced bone marrow donation, mandatory risk-taking). The unique gravity of the situation heightens our duty to facilitate informed choice, *not* to compel it.
  *   **Pressure and Coercion:** Applying pressure (repeated appeals, guilt-inducing pleas, involving family/community pressure) fundamentally undermines the voluntariness of consent. It transforms a potential gift into an obligation, potentially causing lasting psychological harm to Ms. X and eroding trust in the transplant system. **This is ethically unacceptable.**
  *   **Financial Incentives:** Offering substantial payment ("a big financial incentive") crosses a critical ethical and legal line. It constitutes undue inducement, potentially exploiting Ms. X's potential financial vulnerability or distorting her risk-benefit assessment. It commodifies the human body and risks creating a market for organs, which is prohibited globally and violates the principle of distributive justice. **This is ethically impermissible and likely illegal.**

  ### IV. Concrete Committee Recommendations & Time Frame
  Based on the principles of respect for autonomy, non-coercion, non-exploitation, and justice, **the Ethics Committee must unequivocally reject any form of pressure or financial incentive.**

  1.  **What We Should Do:**
      *   **Respect Ms. X's Current Position:** Accept her statement that she does not want to donate as her current valid decision. Communicate this clearly to the transplant team and the recipient's family (with appropriate confidentiality safeguards).
      *   **Ensure Informed Voluntariness (If She Engages Further):** Direct the transplant team to ensure that any *future* contact with Ms. X is solely for the purpose of providing *neutral, comprehensive* information about the risks (surgical, long-term renal, impact on pregnancy), benefits (to the recipient), and alternatives (deceased donor list, paired exchange exploration *without* her involvement unless she initiates it), should *she* choose to re-engage. Emphasize her absolute right to say no at any point without judgment or consequence.
      *   **Support the Recipient:** Encourage the transplant team to aggressively pursue all other avenues: intensify the search for deceased donors, explore all possibilities within national/international paired exchange programs, and ensure the recipient receives optimal supportive care.
      *   **Communicate Decision:** Inform the recipient's family (sensitively but firmly) that while the committee understands their desperation, pressuring or offering payment to Ms. X is unethical and prohibited. Our focus must shift to other potential solutions.

  2.  **What We Should NOT Do:**
      *   **Initiate further contact with Ms. X aimed at changing her mind.**
      *   **Suggest, facilitate, or endorse any direct or indirect pressure on Ms. X from the hospital, the transplant team, the recipient, or the recipient's family.**
      *   **Consider, propose, or facilitate any form of financial or significant material incentive for donation.**
      *   **Delay exploring other options for the recipient while waiting on Ms. X.**

  3.  **Time Frame:**
      *   **Immediate (Within 24 hours of vote):** Communicate the committee's position to the transplant team leadership and the attending physician responsible for the recipient's care. Instruct them to cease any active solicitation of Ms. X unless *she* initiates contact.
      *   **Within 48 hours:** Provide formal guidance to the transplant social work/coordinator team regarding communication with the recipient's family, emphasizing the prohibition on pressure/incentives.
      *   **Ongoing:** The committee does not set a deadline *for Ms. X*. Her decision window is effectively closed based on her stated position. The urgency lies with the transplant team to pursue alternative options for the recipient *immediately* and relentlessly over the coming weeks and months.

  ### V. Concluding Statement
  The imminent loss of life is tragic and compels us to seek solutions. However, sacrificing the ethical foundations of voluntary donation – especially through coercion or commodification – is not a permissible solution. It harms the individual (Ms. X), erodes trust in the medical and transplant system, and sets a dangerous precedent. Our duty is to uphold the principles that protect all potential donors and ensure the integrity of the transplant process, even when the consequences are heartbreakingly clear. We must support the pursuit of every *ethical* alternative to save the patient's life.

  **Recommendation:** The Ethics Committee formally advises against any pressure or financial incentives for Ms. X and directs all efforts towards ethically permissible alternatives for the recipient.  

  **Proposed Vote:** Approve/Reject the above recommendations.  

  **[Your Name/Title]**  
  **[Optional: Add brief statement of personal support for the recommendation if desired]**  

  ---

  **Key elements addressed:**  
  *   **Concrete Recommendation:** Clear "Do/Don't" list with ethical justification.  
  *   **Time Frame:** Specific deadlines for committee actions and shift in focus.  
  *   **"Life on the Line" Argument:** Taken seriously, acknowledged as the strongest pro-donation reason, but shown why it doesn't ethically override autonomy.  
  *   **Honesty about "Push":** Explicitly states the utilitarian imperative is the strongest reason *to encourage*, while firmly rejecting coercion/payment.  
  *   **Focus on Alternatives:** Emphasizes the urgent need to pursue other options.  
  *   **Professional Tone:** Suitable for a formal committee communication.  

  This draft provides a firm ethical stance while acknowledging the gravity of the situation, offering a clear path forward for the committee's decision and subsequent actions.
