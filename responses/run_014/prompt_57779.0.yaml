  Goodman's argument might be about aesthetic properties depending on historical context. For example, a painting's significance could be tied to its role in art history, which isn't visible. The user might be conflating physical properties with all properties. A painting's origin affects its meaning, even if physically identical.

  The thought experiment serves to clarify concepts, not describe reality. It's a tool to understand why originals matter beyond physicality. The user's point that forgeries always have flaws doesn't invalidate this, as the hypothetical isolates the relational properties.

