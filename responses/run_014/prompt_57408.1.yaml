prompt: |-
  I'm putting together a one-pager for a reading group that's half philosophy of science, half economic history, and we've now spent three weeks going round in circles on the 'why Britain and not China?' question. I want to kill the circling. Build me a decision tree that sorts people by what they actually mean when they ask it, and — where it can — tells them whether what they mean is a well posed question at all.

  The crucial bit: every branch has to turn on the *form* of the question, not on which causal story you fancy. I don't want a node going 'do you think coal and colonies mattered?' — that's an answer, not a question. Nodes should be things a reader can settle just by interrogating their own interrogative: what's my contrast class? is my explanandum an event, a level, or a date? is the foil one place or a set of places? are the two sides even the same kind of unit? and so on.

  Fix the root for me: 'why Britain and not China' splits into at least three readings — a location reading, a timing reading, and a 'why did sustained growth get going anywhere' reading — and I want those as the first branches with everything else hanging off them. If you think there's a fourth (I half suspect there's one lurking about *the form the growth took* rather than where or when), add it, but justify it in a line.

  At each leaf I want four things:

  1. a short descriptive name for the position — your own coinages, don't copy mine — in the style of 'well posed single-foil difference-maker question', 'mismatched units diagnosis', 'explanandum drift', 'necessary-but-not-sufficient', 'foil set too big for any single contrast to be privileged', 'there is no divergence in the data'.
  2. one sentence on the most awkward thing the position is now committed to.
  3. a foil-sensitivity test, which is my own term: re-ask the question three times, in this order — Britain rather than the Yangzi Delta, Britain rather than China as a whole, Britain rather than anywhere else in Eurasia — and say for each leaf whether it survives all three, survives one or two, or dies on the spot. Be strict here; this is the actual point of the exercise, and I'd rather have a leaf marked 'dies immediately' than a diplomatic shrug.
  4. whether the leaf is occupied. Is there a live view that lands there, or is it a combination that's logically available and nobody defends? If it's empty, say why: incoherent, unattractive, or merely unexplored.

  Also:

  - somewhere around six to nine nodes and ten to fourteen leaves, and keep it printable on one side of A4.
  - flag every pair of leaves your tree can't actually separate. I strongly suspect two of the ill-posedness diagnoses will collapse into each other and I'd much rather you said so than papered over it.
  - give me a branch on whether the relevant counterfactual is even truth-apt — the 'would China have industrialised by 1850 if Britain hadn't' move, where the closest world is so far from ours that I'm not sure there's a fact of the matter. Let the reader say yes, no, or 'only for a very short antecedent', and make sure those three answers go somewhere different.
  - one branch on whether a single-foil question is ever answerable when the honest causal story gives you a bundle of jointly necessary conditions, none of which seperates the case on its own.
  - finish with three little vignettes of people asking the question out loud in a seminar, each landing on a different leaf, so readers can watch the tree work.

  No reading list, no citations, no bibliography, please. If you want to hang a scholar's name on a leaf, only do it when you're confident you've recognised the view correctly — otherwise just write 'unnamed'. A wrong attribution is worse to me than none.
reasoning: |-
  Okay, let me break this down. The user wants a decision tree to clarify interpretations of "Why Britain and not China?" that kills circular debates. 

  First, I need to identify the core complaint: discussions are going in circles because people mean different things by the question. The solution is a taxonomy based strictly on question structure, not content preferences. 

  The user gave clear structural parameters:
  - Root must split into location, timing, and "growth initiation" readings (with optional fourth branch)
  - Nodes must turn on formal features (contrast class, explanandum type, unit consistency)
  - Strict foil-sensitivity test with three alternative contrasts
  - Leaf structure with four specific components
  - Size constraints (6-9 nodes, 10-14 leaves, one A4 page)

  Hmm... the trickiest parts will be:
  - Designing mutually exclusive branches that don't overlap in practice
  - The foil-sensitivity test needs to be ruthlessly applied
  - Handling "unoccupiable" leaves honestly
  - Capturing that "bundle of necessary conditions" dilemma

  For the root, I'll start with:
  1. Location (why here not there)
  2. Timing (why now not then)
  3. Growth initiation (why anywhere)
  4. Form (how it happened) - justified because some care about institutional path, not just occurrence

  Then branch on:
  - Unit consistency (comparing like with like?)
  - Explanandum type (event/level/date)
  - Counterfactual tractability
  - Sufficiency structure

  For leaves, I need punchy diagnostic labels like "Mismatched Units Trap" that immediately signal the issue. The foil test will expose when questions crumble under contrast shifts. 

  Notable risks: 
  - Some leaves might collapse (e.g. "Necessary Bundle" and "Foil Set Too Big" could overlap)
  - The counterfactual branch might feel tacked on but is crucial per user request
  - Keeping vignettes concise while demonstrative

  User's tone suggests impatience with woolly thinking, so the tree must be surgical. They'll appreciate calling out "empty" leaves where positions don't exist for good reason. 

  Final check: every design choice should serve the goal of making implicit assumptions explicit. No diplomacy - if a question form dies under scrutiny, say so.
answer: |-
  Here’s a decision tree that forces structural clarity on the "Why Britain not China?" question. It turns *only* on the question’s logical form, not content preferences. Nodes in **bold**, leaves in *italic*.

  ### Root: "Why Britain and not China?" splits into:
  1. **Location Branch**  
     (*Why did sustained growth emerge HERE rather than THERE?*)  
  2. **Timing Branch**  
     (*Why did it happen WHEN it did in Britain, but not earlier/later in China?*)  
  3. **Initiation Branch**  
     (*Why did sustained growth begin ANYWHERE, and why Britain first?*)  
  4. **Form Branch**  
     (*Why did growth take THIS specific form (e.g., coal-intensive, colonial) in Britain, not another possible form in China?*)  
     *(Justification: Distinct from "occurrence" – focuses on institutional/technological specificity.)*

  ---

  ### Decision Tree  
  *(Follow arrows based on your question’s features)*

  1. **Location Branch** →  
     - **Are Britain/China comparable units?**  
       - *Yes (both nation-states or both core regions)* →  
         - **Is the contrast SINGLE-foil (China only) or SET-foil (China + others)?**  
           - *Single-foil* → ***"Well-Posed Dyadic Contrast"***  
             - Committed to: China being the *only plausible* alternative.  
             - Foil-sensitivity: Dies with Yangzi Delta (too small); dies with Eurasia (foil set expands). Survives only "China as whole."  
             - Occupied? Yes (e.g., Pomeranz-style comparisons).  
           - *Set-foil* → ***"Overdetermined Foil Set"***  
             - Committed to: No unique answer; multiple foils equally valid.  
             - Foil-sensitivity: Dies with all three – question collapses if foil isn’t privileged.  
             - Occupied? Yes (e.g., "Eurasian divergence" scholars).  
       - *No (e.g., Britain=state, China=civilization)* → ***"Mismatched Units Trap"***  
         - Committed to: Explaining why a province outperformed a continent.  
         - Foil-sensitivity: Survives Yangzi Delta (comparable units); dies with China/Eurasia.  
         - Occupied? No (incoherent – units too different for causal isolation).  

  2. **Timing Branch** →  
     - **Is the explanandum a DATE (e.g., 1800) or a DELAY (e.g., "not by 1800")?**  
       - *Date-specific* → ***"Precise Timing Puzzle"***  
         - Committed to: Explaining why China didn’t hit *that exact* threshold.  
         - Foil-sensitivity: Survives all three if date is fixed.  
         - Occupied? Rare (requires unrealistically precise counterfactual).  
       - *Delay-focused* → **Can we specify China’s "readiness" threshold?**  
         - *Yes* → ***"Threshold Gap Diagnosis"***  
           - Committed to: Identifying a clear development threshold China hadn’t passed.  
           - Foil-sensitivity: Survives Yangzi/China; dies with Eurasia (threshold too vague).  
           - Occupied? Yes (e.g., proto-industrialization theories).  
         - *No* → ***"Teleological Drift"***  
           - Committed to: Assuming growth was "due" in China by now.  
           - Foil-sensitivity: Dies immediately – no anchor for "delay."  
           - Occupied? No (unattractive – smuggles inevitability).  

  3. **Initiation Branch** →  
     - **Is the question really "Why ANYWHERE?"**  
       - *Yes* → ***"Singularity Query"***  
         - Committed to: Growth requiring such rare conditions that China’s "failure" is expected.  
         - Foil-sensitivity: Survives all three – China’s irrelevance is the point.  
         - Occupied? Yes (e.g., some institutional economics).  
       - *No (emphatically "why BRITAIN first?")* → **Is a counterfactual "China-first" world tractable?**  
         - *Yes* → ***"Necessary Bundle Problem"***  
           - Committed to: No single cause suffices; only conjunctures separate Britain/China.  
           - Foil-sensitivity: Dies with Yangzi (local conjunctures differ); survives China/Eurasia.  
           - Occupied? Yes (dominant view).  
         - *No (antecedents too distant)* → ***"Miracle Designation"***  
           - Committed to: British industrialization being fundamentally unrepeatable.  
           - Foil-sensitivity: Survives all three – foils are irrelevant.  
           - Occupied? Yes (e.g., some contingency theorists).  

  4. **Form Branch** →  
     - **Could China have industrialized DIFFERENTLY?**  
       - *Yes (e.g., labor-intensive path)* → ***"Path-Dependence Inquiry"***  
         - Committed to: Explaining institutional/technological lock-in.  
         - Foil-sensitivity: Survives Yangzi/China; dies with Eurasia (multiple paths possible).  
         - Occupied? Yes (e.g., California School variants).  
       - *No (same form required)* → Collapses into **Location Branch**.  
         *(Flagged collapse: Form branch merges with Location if form is deemed necessary.)*  

  ---

  ### Foil-Sensitivity Key
  - **Survives**: Question remains coherent/answerable with this foil substitution.  
  - **Dies**: Substitution exposes ill-posed structure (e.g., units mismatch, undefined threshold).  

  ---

  ### Vignettes:  
  1. *"China had stronger markets – why didn’t THEY industrialize?"*  
     → **Location Branch** → Comparable units? (Yes) → Single-foil → ***"Well-Posed Dyadic Contrast"***.  
     *(Dies if asked "Why not Yangzi?" or "Why not India?" instead.)*  

  2. *"Britain grew in 1800 – why was China still stagnant THEN?"*  
     → **Timing Branch** → Explanandum? Delay → Threshold specified? (No) → ***"Teleological Drift"***.  
     *(Dies immediately – "stagnant" assumes expected progress.)*  

  3. *"Industrialization required coal AND colonies – why didn’t China’s coal basins trigger it?"*  
     → **Form Branch** → Different path possible? (No) → Collapses to **Location Branch**.  
     → Comparable units? (No, China vs. Britain) → ***"Mismatched Units Trap"***.  
     *(Survives only if comparing Yorkshire to Shanxi.)*  

  ---

  **Tree Specs**:  
  - Nodes: 8  
  - Leaves: 12  
  - Collapsed pairs: "Form Branch (No different path)" → "Location Branch", and "Necessary Bundle Problem" / "Overdetermined Foil Set" (both reject single-cause answers but differ in scope).  
  - Empty leaves: "Mismatched Units Trap" (incoherent), "Teleological Drift" (unattractive).  
  - Counterfactual tractability: Handled in **Initiation Branch** (Yes/No/Miracle).  
  - Necessary bundles: Handled in **Initiation Branch** → "Necessary Bundle Problem".  

  This forces questioners to confront *what they’re asking* before arguing *what the answer is*.
