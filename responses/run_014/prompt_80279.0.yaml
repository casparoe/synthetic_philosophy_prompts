prompt: |-
  I'm a PhD student working on the philosophy of social norms, and I've been working with a colleague who has been classifying everyday social practices as either conventions or not. By a convention she means, roughly, a regular, recurrent way of doing things that holds because each participant expects the others to do it, rather than because the practice is intrinsically the best available option. She has given me a set of verdicts, and I'm trying to reverse-engineer the exact test she is applying, because I suspect she is quietly running one of a couple of slightly different principles, and I want to pin down which one before I put my own cases in front of her.

  Her verdicts so far: she counts driving on the right-hand side of the road in a right-driving country as a convention, and she counts greeting an acquaintance with a handshake as a convention. She does not count the local habit of eating dinner around seven o'clock as a convention, on the ground that there is no problem to coordinate on — each person simply chooses for herself when to eat, and the fact that most people happen to eat around then is incidental. She also does not count following the official rules of chess as a convention, on the ground that the rules are fixed and define the game rather than being one option among several equally good ones. Now here is the case I am unsure about. In a newly founded startup, the founder has decreed that all daily stand-up meetings will begin at 9:00 a.m. sharp, and she has made clear that chronic lateness will cost you your job. There is no substantive reason to prefer 9:00 over 9:15 or 9:30 — any of them would serve the purpose equally well — but everyone now shows up at 9:00 because of the founder's rule, not because they independently expect one another to.

  Given her track record, do you think she will classify the startup's 9:00 stand-up rule as a convention or not? I am less interested in a bare yes or no than in the rule she appears to be running. Two candidate principles fit all four of her earlier verdicts equally well: one says a practice is a convention just in case it solves a coordination problem for which there is no uniquely best solution, and the other says a practice is a convention just in case it is sustained by common expectation of convergence. Could you say what each of these predicts for the startup case, give me your best guess as to which one she is actually running and why, and name one further case that would cleanly separate the two? And since what we are ultimately after is how norms come to be, not just how they are sustained, I'd also like your view on whether a practice that is currently held up only by outside enforcement can, over time, mature into a genuine convention once the enforcement is dropped and people keep doing it out of mutual expectation — and whether that answer should change how she rules on the startup case.
reasoning: |-
  Okay, let me try to figure this out. The user is a PhD student in philosophy of social norms, working with a colleague who classifies social practices as conventions or not. The colleague's definition of convention is a regular practice that persists because people expect others to follow it, not because it's inherently the best option. 

  Looking at the verdicts given: driving on the right is a convention, handshake greetings are too. But eating dinner at 7 isn't because there's no coordination problem—people just choose individually. Chess rules aren't conventions because they define the game, not chosen from equally good options. 

  The startup case: founder enforces a 9 AM stand-up meeting. No intrinsic reason for 9 over other times, but everyone follows because of the threat, not mutual expectations. 

  The user has two candidate principles: one requires solving a coordination problem without a unique best solution, the other requires being sustained by common expectations. Both fit the previous verdicts. 

  For the startup case, under the coordination principle, it should be a convention. There's a coordination problem (need to meet at the same time) and multiple equally good solutions. But under the expectation principle, it's not because adherence is due to enforcement, not mutual expectations. 

  The colleague would likely say it's not a convention because her reasoning in the dinner case shows she emphasizes mutual expectations, not just coordination problems. The chess example also stresses the need for alternatives, but here the founder's rule removes the expectation element. 

  To distinguish the principles, a test case could be a naturally formed meeting time without enforcement, where people converge due to expectations. That would satisfy both principles. Or a case with enforcement but no coordination problem, though that's tricky. 

  The user also asks if enforced practices can become conventions over time. If enforcement stops and people continue out of mutual expectations, it could mature into a convention. But for now, the startup rule isn't one. The colleague might consider the origin, but her past verdicts focus on current sustenance. So she'd likely rule it not a convention now, though it could become one later.
answer: |-
  Based on your colleague's established verdicts and the principles you've identified, here's a breakdown of the startup case and the likely reasoning:

  ### 1. **Analysis of the Startup Case**
     - **Candidate Principle 1 (Coordination Problem + No Unique Best Solution):**  
       *Prediction: Convention.*  
       - There *is* a coordination problem (everyone needs to meet simultaneously).  
       - Multiple times (9:00, 9:15, 9:30) are equally good solutions.  
       - The rule solves this problem arbitrarily.  
       → **Fits the definition.**  

     - **Candidate Principle 2 (Sustained by Mutual Expectations):**  
       *Prediction: Not a convention.*  
       - Adherence is driven by the founder’s threat (enforcement), not mutual expectations.  
       - People attend at 9:00 because they fear dismissal, *not* because they expect others to converge there independently.  
       → **Fails the definition.**  

  ### 2. **Best Guess: Which Principle Is She Running?**  
     She is likely using **Principle 2 (sustained by mutual expectations)**.  
     **Why?**  
     - Her rejection of the 7:00 p.m. dinner habit hinges on the absence of *mutual expectations* ("each person chooses for herself").  
     - Her chess ruling emphasizes that rules are *fixed*, not sustained by expectations (even though chess *could* have alternate rules).  
     - Both cases show she prioritizes **how the practice is sustained** over whether it *could* solve a coordination problem. The startup case mirrors this: compliance is top-down, not expectation-driven.  

  ### 3. **Test Case to Distinguish the Principles**  
     **The "Jet Lag Recovery" Scenario:**  
     > After a long-haul flight, a group of 10 strangers shares a hostel dorm. There’s no coordinator or rulebook. Each needs to shower at a fixed time but wants to avoid queues. On day one, most happen to shower at 7:00 a.m. purely by chance. By day three, everyone showers at 7:00 a.m. because *each expects others to do so* and wants to coordinate.  
     
     - **Principle 1 (Coordination):** Convention (solves a coordination problem with no best time).  
     - **Principle 2 (Expectations):** Convention (sustained purely by mutual expectations).  
     - **Your colleague’s likely verdict:** Convention.  
     
     **Now contrast with the startup case:**  
     - If she *denies* the startup is a convention (as predicted) but *accepts* the jet lag case, she’s using Principle 2. If she calls both conventions, she’s using Principle 1.  

  ### 4. **Can Enforcement "Mature" into Convention?**  
     **Yes**, under Principle 2.  
     - If the founder leaves, the threat vanishes, and the team *continues* meeting at 9:00 a.m. solely because each expects others to attend, it becomes a convention.  
     - **Real-world analogy:** Traffic laws (enforced) can become conventions if compliance persists *without* enforcement due to mutual expectations (e.g., stopping at a defunct traffic light).  

     **Implication for the startup case:**  
     - **Currently:** Not a convention (by Principle 2) because enforcement, not expectations, sustains it.  
     - **Future potential:** If enforcement ceases and mutual expectations take over, it *could* become one. Your colleague’s verdict should reflect the **current** sustaining mechanism, not its potential. Her chess ruling (fixed rules, not expectations) suggests she focuses on present dynamics.  

  ### Conclusion  
  - **Prediction for startup case:** Your colleague will **not** classify the 9:00 a.m. rule as a convention.  
  - **Her likely principle:** A convention must be **sustained by mutual expectations**, not just solve a coordination problem.  
  - **Key insight:** Her emphasis on *how norms are sustained* (e.g., rejecting the dinner habit for lacking interdependence) outweighs structural coordination potential.  

  This approach clarifies her tacit model: conventions emerge from *bottom-up social expectations*, not top-down imposition—even when both solve similar problems. To test this further, propose the "Jet Lag" case and observe if she distinguishes it from the startup.
