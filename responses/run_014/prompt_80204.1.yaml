prompt: |-
  I run the calibration desk at a small prediction market, and I need a written procedure my junior analysts can follow when we list mechanism events — events whose outcomes are produced by a process with a genuine, in-principle knowable probability, such as lottery draws, coin flips, dice, sports games, or the weather. We list a few dozen of these a week, a bad anchor can cost us real money when the market trades against us, and the final call on each listing has to be signed off by me, so the procedure needs to run in under ten minutes and end in a one-line recommendation I can act on. We keep getting burned in two directions: junior analysts override a known probability with their own feel (refusing to list a 1-in-38 number because it "looks cold"), and senior analysts won't move a probability when the evidence that the process is not what we think is thin but persistent — a roulette table that has just run an 11-red streak, where our traders insist we leave the odds at 18/38 because each spin is independent, and our in-house statisticians insist the streak is evidence about the wheel, not a sign that red is "due."

  Please write the procedure. It should take a proposed mechanism-event listing and decide, in order: (a) whether there is a well-defined objective probability to defer to at all, or whether the event is really a judgment event (an election, a court ruling, a replication result) for which no such probability exists in the same sense; (b) whether the analyst's knowledge of that probability is good enough to anchor on; (c) whether the analyst's other evidence counts as what the philosophy of probability calls a defeater — evidence that the probability is not what they think it is, or that the event is not actually generated by the process they think — and, if so, how to treat it; and (d) when the procedure stops deferring and hands the decision to human judgment, with the reason written down. Ground it in the literature on the relationship between objective chance and rational belief: I know the core idea is that your degree of belief in an event should match its objective probability, conditional on the totality of what you know, unless you have some special evidence to the contrary, but I want the procedure to be honest about which steps are real constraints and which are judgment calls dressed up as steps, and to say explicitly where it will misfire. Then run it on three cases — a 1-in-38 number on a fresh, certified wheel; the same wheel after the 11-red streak; and a coin flip we are about to list, where the flipper is a magician known for trick coins and we have no way to inspect the coin before the flip — and for each, say whether the recommendation is the one the desk would prefer.
reasoning: |-
  We are designing a procedure for calibrating prediction markets for mechanism events — events with an in-principle knowable objective probability. The procedure must be efficient (under 10 minutes per event) and end with a one-line recommendation. It must address four key questions:

  (a) Is there a well-defined objective probability?
  (b) Is the analyst's knowledge of that probability good enough to anchor on?
  (c) Is there any defeater evidence that should alter the anchor?
  (d) When to stop deferring and hand over to human judgment?

  The procedure should be grounded in the philosophy of probability, particularly the Principal Principle (which says that, conditional on knowing the objective chance and having no additional "inadmissible" information, your subjective degree of belief should equal the objective chance). However, we must be cautious about defeaters — evidence that the objective chance might not be what we think, or that the event isn't generated by the process we assume.

  We'll structure the procedure as follows:

  ### Procedure: Mechanism Event Anchor Setting

  **Step 1: Objective Probability Check**
     - Ask: Is there a well-defined process generating the event that has a known, objective probability distribution? (e.g., lottery, dice, certified roulette wheel, fair coin, weather model)
     - If no, stop: this is a judgment event. Hand over to the judgment event procedure. (Not covered here.)
     - If yes, proceed.

  **Step 2: Knowledge Quality Check**
     - Ask: Do we know the objective probability with sufficient precision? 
       - Consider: Are the theoretical probabilities well-established? (e.g., 1/2 for a fair coin, 1/6 for a fair die, 1/38 for a single number in double-zero roulette)
       - If the process is complex (e.g., weather) but we have a reliable model that outputs probabilities, we accept the model's output as the objective probability for our purpose.
     - If we do not know the objective probability (e.g., the mechanism is not fully specified, or the probabilities are not known with precision), then we cannot anchor and must treat it as a judgment event.
     - If yes, we have a candidate anchor (the known objective probability). Proceed.

  **Step 3: Defeater Check**
     - Here we consider evidence that the objective probability might be different from what we think, or that the event is not generated by the assumed process. We are looking for two types of defeaters:
       1. **Type 1: Process Defeater** — Evidence that the event is not actually generated by the process we think (e.g., the coin is flipped by a magician known for trick coins, or the roulette wheel might be biased).
       2. **Type 2: Chance Defeater** — Evidence that the objective chance itself is not what we thought, even though the process is the same (e.g., the wheel has been found to be biased in a certain way, or the weather model has a known flaw).
     - How to handle:
       - If there is *no* defeater evidence, then the anchor is the known objective probability. Proceed to Step 5.
       - If there is defeater evidence, then we must assess its strength and decide whether to adjust the anchor or hand over to judgment.

  **Step 4: Defeater Assessment**
     - We must quantify the strength of the defeater evidence. However, we note that sometimes the evidence is too weak to warrant a change (e.g., a short streak in a game of independent trials) and sometimes it is strong (e.g., multiple independent reports of a biased wheel).
     - Guidelines:
       - For independent trials (like coin flips, dice, roulette spins): 
          - A streak (like 11 reds in roulette) is not by itself evidence of a biased wheel because the process is memoryless and the streak is within the realm of normal variation. Therefore, we do not count this as a defeater. 
          - However, if there is evidence of tampering, malfunction, or a pattern that is highly improbable under the null model, then we have a defeater.
       - For non-independent events (like weather): 
          - We rely on the model but if we have evidence that the model is not performing well (e.g., recent inaccuracies in similar conditions) then we have a defeater.
     - Action:
       - If the defeater evidence is strong and we can quantify the adjustment (e.g., we have a new probability based on the evidence), then adjust the anchor accordingly and proceed.
       - If the defeater evidence is strong but we cannot quantify the adjustment (e.g., we suspect the magician's coin is biased but don't know how), then we cannot anchor and must treat as a judgment event.
       - If the defeater evidence is weak (e.g., a streak that is within expected variation) then we ignore it and proceed with the original anchor.

  **Step 5: Final Recommendation**
     - If we have an anchor (either original or adjusted) and no unresolved defeaters, then recommend: "Anchor at [probability]".
     - If we had to adjust the anchor, note: "Adjusted from [original probability] to [adjusted probability] due to [brief reason]".
     - If we cannot set an anchor, then recommend: "Do not anchor. Treat as judgment event." and state the reason.

  ### Where are the judgment calls?
     - Step 1: Determining if there's a well-defined objective probability. Sometimes it's borderline (e.g., a sports game might have an objective probability in theory, but in practice it's too complex to compute and we rely on models).
     - Step 3: Deciding whether a piece of evidence counts as a defeater and of which type. This is inherently subjective.
     - Step 4: Assessing the strength of the defeater and whether we can adjust the anchor. This requires judgment, especially when the evidence is ambiguous.

  ### Known Misfires:
     - The procedure may fail when:
       1. The event is borderline between mechanism and judgment (e.g., a complex sports game) and we misclassify.
       2. We ignore weak defeaters that in aggregate are strong (e.g., a series of short streaks that individually are normal but together suggest bias).
       3. We adjust for a defeater when we shouldn't (e.g., overreact to a streak) or fail to adjust when we should (e.g., ignore credible reports of bias).

  ### Case Studies

  **Case 1: A 1-in-38 number on a fresh, certified wheel.**
     - Step 1: Yes, roulette has an objective probability (1/38 for a single number).
     - Step 2: We know the probability (1/38) with sufficient precision.
     - Step 3: No defeater evidence (the wheel is fresh and certified).
     - Step 4: Not needed.
     - Recommendation: "Anchor at 1/38".

  **Case 2: The same wheel after an 11-red streak.**
     - Step 1: Yes, objective probability exists (for the next spin, the probability of red is still 18/38).
     - Step 2: We know the probability (18/38) with sufficient precision.
     - Step 3: Is the streak a defeater?
          - Type 1: The streak itself is not evidence of a process defeater because the spins are independent and the streak is not extremely long (probability of 11 reds in a row is (18/38)^11 ≈ 0.0005, but note that we are observing one streak among many possible ones and it's not that rare in the long run). Without other evidence (like a malfunction report), we do not consider it a defeater.
          - However, if we have additional evidence (e.g., the wheel was recently moved, or there were multiple long streaks) we might reconsider. But per case: no such evidence.
     - Step 4: Not needed because we don't have a defeater.
     - Recommendation: "Anchor at 18/38". We note that the streak is irrelevant.

  **Case 3: Coin flip by a magician known for trick coins, and we cannot inspect the coin.**
     - Step 1: Yes, in principle a coin flip has an objective probability, but we are uncertain about the coin.
     - Step 2: Normally we know the probability (1/2 for a fair coin), but here we have reason to doubt the coin is fair.
     - Step 3: Defeater evidence: the magician is known for trick coins. This is a strong Type 1 defeater (the process may not be a fair coin flip).
     - Step 4: We cannot inspect the coin, so we cannot quantify the bias. Therefore, we cannot set an anchor.
     - Recommendation: "Do not anchor. Treat as judgment event. Reason: The coin may be biased and we cannot determine the degree of bias."

  ### Desk Preference
     - Case 1: The desk would prefer the anchor at 1/38. This is the known probability and there's no reason to deviate.
     - Case 2: The desk would prefer to leave the odds at 18/38, as the streak does not change the probability. The procedure matches this.
     - Case 3: The desk would prefer not to anchor because of the magician's reputation. The procedure matches this.

  This procedure should help avoid the two common errors: overriding known probabilities without cause and failing to adjust when there is legitimate evidence of a problem.
answer: |-
  ### Calibration Procedure for Mechanism Events  
  **Purpose:** To set an anchor probability for mechanism events (events with in-principle knowable objective probabilities) by leveraging the Principal Principle (PP) — rational credence should match objective chance, conditional on total evidence — while accounting for defeaters. Junior analysts must complete this in ≤10 minutes. Final output is a one-line recommendation for senior sign-off.  

  ---

  ### Step-by-Step Procedure  
  **Input:** Proposed event (e.g., "Coin lands heads," "Roulette wheel hits 00").  
  **Output:** One-line anchor recommendation or "Treat as judgment event."  

  #### **Step 1: Objective Probability Check (1 min)**  
  - **Question:** Is there a well-defined, in-principle knowable *objective probability* (e.g., derived from physical symmetries, established models, or frequentist data)?  
    - **Yes** if:  
      - Process is mechanistic (e.g., dice, lottery, certified roulette, weather model with verified track record).  
      - Probability is computable from known physics/math (e.g., 1/2 for fair coin, 1/38 for roulette number).  
    - **No** if:  
      - Outcome depends on unquantifiable human behavior (e.g., election, court ruling).  
      - Process is opaque or lacks a stable probability model (e.g., "Will this AI paper be cited?").  
  - **Decision:**  
    - **No →** "Treat as judgment event. Reason: No objective probability." Stop.  
    - **Yes →** Proceed to Step 2.  
  - **Judgment Call:** Borderline cases (e.g., sports games with reliable models) may require discretion. *Misfire risk:* Misclassifying judgment events as mechanistic.  

  #### **Step 2: Knowledge Quality Check (2 min)**  
  - **Question:** Is our knowledge of the objective probability (\(P_{\text{obj}}\)) sufficient to anchor?  
    - **Sufficient** if:  
      - \(P_{\text{obj}}\) is precisely known and uncontroversial (e.g., 1/6 for fair die).  
      - Verified by calibration data (e.g., weather model validated against 10,000 forecasts).  
    - **Insufficient** if:  
      - \(P_{\text{obj}}\) relies on unstable assumptions (e.g., "coin is fair" without verification).  
      - Data is sparse (e.g., new lottery with <100 draws).  
  - **Decision:**  
    - **Insufficient →** "Treat as judgment event. Reason: Inadequate knowledge of \(P_{\text{obj}}\)." Stop.  
    - **Sufficient →** Set candidate anchor \(P_{\text{anchor}} = P_{\text{obj}}\). Proceed to Step 3.  
  - **Judgment Call:** Deciding "sufficiency" hinges on context (e.g., 10 coin flips may suffice for calibration; 2 may not). *Misfire risk:* Anchoring on unstable probabilities (e.g., overfitting sparse data).  

  #### **Step 3: Defeater Check (4 min)**  
  - **Question:** Is there **defeater evidence** — information suggesting \(P_{\text{obj}}\) is wrong or the process isn’t as assumed? Use two-tier test:  
    - **Type 1 (Process Defeater):** Evidence the event isn’t generated by the assumed process (e.g., rigged wheel, trick coin).  
    - **Type 2 (Chance Defeater):** Evidence \(P_{\text{obj}}\) is incorrect (e.g., wheel bias, weather model drift).  
  - **Assessment Rules:**  
    - **Relevant Evidence:** Physical tampering, malfunctions, empirical outliers (e.g., 100 reds in 100 roulette spins), credible third-party reports.  
    - **Irrelevant Evidence:**  
      - Short-term streaks in independent trials (e.g., 11 reds in roulette).  
      - "Gambler’s fallacy" cues (e.g., "red is due").  
    - **Strength Threshold:**  
      - **Weak evidence:** Ignore if statistically plausible under \(P_{\text{obj}}\) (e.g., 11 reds: prob. = \((18/38)^{11} \approx 0.0014\), expected ~1x per 700 spins).  
      - **Strong evidence:** Act if likelihood under null is <0.001 OR multiple independent reports exist.  
  - **Decision:**  
    - **No defeater →** "Anchor at \(P_{\text{anchor}}\) (no defeater)." Stop.  
    - **Defeater present →** Proceed to Step 4.  
  - **Judgment Call:** Strength assessment is subjective. *Misfire risk:* Overreacting to noise (e.g., streaks) or ignoring subtle bias.  

  #### **Step 4: Defeater Adjustment (3 min)**  
  - **Question:** Can we quantify a new anchor from the defeater?  
    - **Yes** if:  
      - Defeater implies a clear alternative \(P_{\text{obj}}\) (e.g., 60% heads from coin-testing data).  
      - Defeater can be Bayesian-updated (e.g., posterior bias estimate after streak).  
    - **No** if:  
      - Defeater is qualitative (e.g., "magician uses trick coins" with no bias estimate).  
      - Uncertainty is too high (e.g., conflicting reports).  
  - **Decision:**  
    - **Yes →** Set \(P_{\text{anchor}} =\) new estimate. "Anchor at [adjusted probability] (adjusted for defeater: [brief reason])."  
    - **No →** "Treat as judgment event. Reason: Defeater present, unquantifiable."  
  - **Judgment Call:** Choosing adjustment method (e.g., Bayesian vs. heuristic). *Misfire risk:* Quantifying noise as signal (e.g., overfitting streaks).  

  ---

  ### Philosophical Grounding  
  - **Core Principle (Principal Principle):** \( \text{Cr}(A | P_{\text{obj}}(A)=p \land E) = p \), where \(E\) is "inadmissible" evidence not impacting chance (e.g., past outcomes of independent trials).  
  - **Defeaters:** Violate PP’s assumptions. Process defeaters negate \(P_{\text{obj}}\)’s relevance; chance defeaters negate its value (Lewis 1980; Hoefer 2007).  
  - **Total Evidence Requirement:** PP requires conditioning on *all* evidence (e.g., a streak may be inadmissible for predicting independent spins but admissible for detecting bias).  

  ---

  ### Case Applications  
  #### **Case 1: 1-in-38 number on fresh, certified roulette wheel**  
  - **Step 1:** Objective probability? Yes (roulette mechanics).  
  - **Step 2:** Knowledge sufficient? Yes (1/38 precise; wheel certified).  
  - **Step 3:** Defeater? None (fresh wheel, no anomalies).  
  - **Recommendation:** "Anchor at 1/38 (no defeater)."  
  - **Desk Preference:** ✅ Correct. Overrides junior’s "cold number" fallacy.  

  #### **Case 2: Same wheel after 11-red streak**  
  - **Step 1:** Objective probability? Yes (roulette).  
  - **Step 2:** Knowledge sufficient? Yes (18/38 for red).  
  - **Step 3:** Defeater?  
    - Streak is statistically plausible (prob. ~0.0014; expected rarely but not impossibly).  
    - No physical evidence of tampering.  
    - **Decision:** Not a defeater (irrelevant under PP; past spins don’t affect future).  
  - **Recommendation:** "Anchor at 18/38 (no defeater)."  
  - **Desk Preference:** ✅ Correct. Overrides statistician’s bias overreaction.  

  #### **Case 3: Coin flip by magician with uninspected trick coin**  
  - **Step 1:** Objective probability? Yes (coin flip mechanics).  
  - **Step 2:** Knowledge sufficient? **Insufficient.** Assumed \(P_{\text{obj}}\) = 1/2 relies on "fair coin," but magician’s reputation negates this.  
  - **Decision (Step 2):** "Treat as judgment event. Reason: Inadequate knowledge of \(P_{\text{obj}}\) (uninspected trick coin)."  
  - **Alternate Path (if Step 2 passed):**  
    - **Step 3:** Defeater? Strong Type 1 (process defeater: trick coin).  
    - **Step 4:** Adjustment possible? No (no bias estimate).  
    - **Recommendation:** "Treat as judgment event. Reason: Defeater present, unquantifiable."  
  - **Desk Preference:** ✅ Correct. Avoids anchoring on 1/2 despite uncertainty.  

  ---

  ### Procedure Summary  
  - **Key Strengths:** Enforces discipline via PP; ignores irrelevant noise (streaks); flags unquantifiable uncertainty.  
  - **Weaknesses:** Relies on subjective thresholds (defeater strength, knowledge quality). Misfires if misjudging evidence admissibility.  
  - **Output Clarity:** One-line recommendation with explicit reason for judgment fallback.  
  **Total Time:** 7–9 minutes (analyst) + 1 minute (senior sign-off).
