  ### Absent-Minded Driver Workshop Plan  
  *Total: ~780 words*  

  **Session Goal:** Make participants *experience* the planning/action tension via gameplay, with real payoffs and enforced absent-mindedness.  

  #### Setup (10 mins)  
  - **Participants:** 16 players. Each is a "driver."  
  - **Payoffs (play money):**  
    - Exit at 1st intersection: **$0**  
    - Exit at 2nd intersection: **$4**  
    - Overshoot both: **$1**  
  - **Absent-mindedness protocol:** Players never know which intersection they’re at. Use **two identical rooms** (Room A/B). When moving between rooms, players are blindfolded and disoriented (spin twice, then led).  
  - **Journey sequence:**  
    1. Every player *starts* at 1st intersection (Room A).  
    2. If they **CONTINUE**, they are blindfolded, moved to Room B (2nd intersection), and decide again.  
    3. If they **EXIT**, journey ends. If they **CONTINUE** at Room B, journey ends with $1.  

  #### Rules (5 mins)  
  - Players **cannot communicate** during rounds.  
  - At each room, they choose: **EXIT (🟥 card)** or **CONTINUE (🟩 card)**.  
  - After deciding, they *return to waiting area* (no revealing choices yet).  
  - Repeat journeys until all 16 complete one full trip. Payoffs revealed after all journeys.  

  #### Rounds (45 mins)  
  1. **Planning Phase (10 mins):**  
     - Group discusses optimal *strategy* (e.g., "Always CONTINUE at 1st, EXIT at 2nd").  
     - Vote on a plan: "What % to EXIT at a given intersection?" (Optimal: 1/3 EXIT, 2/3 CONTINUE).  
     - Record consensus (e.g., "EXIT with 33% probability").  

  2. **Round 1: Naive Execution (15 mins):**  
     - Players **must follow the group’s strategy**.  
     - Each rolls a die: EXIT on 1-2 (33%), CONTINUE on 3-6 (67%) *at every intersection*.  
     - Run journeys. **Payoffs calculated** but not shown yet.  

  3. **Round 2: Free Choice (20 mins):**  
     - Players choose **freely** (no dice).  
     - Crucially: **Half the room** (randomly selected) is *secretly told*:  
       > *"You are at the 2nd intersection. If you EXIT, you get $4!"*  
       (This simulates "ex post reasoning" without technically breaking absent-mindedness).  
     - Run journeys. Record all choices.  

  #### Payoff Calculation & Reveal (10 mins)  
  - **Scoreboard** shows:  
    - Round 1: Group-strategy earnings.  
    - Round 2: Earnings of (A) players who followed group plan vs. (B) players who defected (used free choice).  
  - **Predictable outcome:**  
    - **Round 1:** Avg. payoff ≈ $1.33 (optimal mixed strategy).  
    - **Round 2:**  
      - Players who followed group plan: ~$1.33.  
      - "Defectors" (ex post reasoners): Mostly EXIT → **lower avg.** ($0 if at 1st, $4 if at 2nd; but 1st is more common).  
      - *Example*: If 8 defectors all EXIT, and half are at 1st (pay $0), half at 2nd (pay $4), avg. = $2. But in reality, **>50% are at 1st** (since CONTINUE at 1st is required to reach 2nd), so actual avg. ~$1.5, **below** optimal $1.33.  

  #### Debrief (20 mins)  
  1. **Map gameplay to theory:**  
     - **Planning phase = agent-level:** Optimize *overall* journey (mixed strategy).  
     - **Free choice = moment-level:** At an intersection, EXIT seems better (since $4 > $1), but this ignores *which* intersection you’re at. Defectors’ lower payoffs show the cost of "local" thinking.  
  2. **The twist:**  
     - Reveal that in Round 2, half were *told* "You’re at the 2nd intersection."  
     - Paradox: Players would **pay to avoid knowing!** If you *know* you’re at 2nd, you EXIT ($4 > $1), but if you *know* you’re at 1st, you CONTINUE (hoping for $4 later). With no info, the mixed strategy balances this. Information can destroy the equilibrium.  
  3. **Limitation of the game:**  
     - *Verbally note*: "In the real problem, intersections are identical, and you *truly* can’t know if it’s 1st or 2nd. Here, we simulated ex post reasoning by *telling* some of you—but in reality, you’d *never* have that info. The core tension is about what you’d do *without certainty*."  

  ---

  ### Failure Modes (First Run)  
  1. **Blindfolding isn’t perfect:** Players might track movement (e.g., "I heard door squeaks!"). Fix: Add white noise, randomize paths.  
  2. **Scoreboard confusion:** Players may misunderstand defector vs. planner payoffs. Fix: Use color-coded cards (blue = planners, red = defectors).  
  3. **Group strategy too vague:** If planning phase doesn’t specify *how* to randomize, players improvise poorly. Fix: Provide dice with "EXIT on 1-2" instructions.  
  4. **Defectors dominate:** If >50% defect, earnings *appear* higher (e.g., $1.50 > $1.33), contradicting theory. Fix: **Pre-run the math**:  
     - With 11 players at 1st intersection, 5 at 2nd (due to prior CONTINUEs), defectors’ avg. is (11×$0 + 5×$4)/16 = $1.25, *below* optimal $1.33. Explain: "More of you were at 1st than you thought!"  

  **Why this works:** Players *see* the gap between group planning (Round 1 success) and individual defection (Round 2 penalties), then *feel* the irony of paying to avoid information. The blindfolded rooms make absent-mindedness visceral.
