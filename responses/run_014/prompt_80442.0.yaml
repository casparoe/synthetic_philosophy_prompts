  The replies must be precise: use Lewis's actual machinery (e.g., contextually weighted similarity, counterpart relations as primitive). For the transitivity defense, emphasize that "possible version of" is genuinely non-transitive in ordinary discourse. When conceding, don't give ground on metaphysical commitments—only linguistic flexibility.

  The nightmare question is indeed "how we track counterparts without identity." It cuts deep because it challenges epistemology of modality. The reply must distinguish metaphysical and epistemic issues sharply, invoking Lewis's contextualism to avoid mystification.

