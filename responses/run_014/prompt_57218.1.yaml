prompt: |-
  I am part of a small working group drafting an expert-elicitation protocol for estimating the probability that a specified class of ageing civil structure fails within a twenty-year horizon, on the basis of sparse and heterogeneous inspection records. The eventual users are engineers and a licensing authority, but the group includes two philosophers, and one of them repeatedly reaches for the slogan "you should not be more precise than your evidence." He has now deployed it three times in ways I strongly suspect are not the same claim, and I would like the claims separated before our next meeting.

  The three uses:

  1. An analyst reported a point posterior of 0.043 for a twenty-year failure probability, derived from a parametric degradation model with a deliberately diffuse prior. Our colleague objected that not merely the third decimal place but the point value itself outruns what eleven inspection records can support, and asked for an interval or a set of distributions in its place.

  2. When the group proposed to meet that demand by publishing a credal interval — say [0.01, 0.30] — or the set of posteriors generated by a family of priors, he objected again, on the grounds that the endpoints are no better grounded than the point estimate was, so that an interval too is more precise than the evidence.

  3. In the discussion of how results are to be communicated to the licensing authority, he invoked the same slogan to argue that a report should never display a single number, even where the analysts themselves hold that the evidence supports one.

  Please give me a menu of the distinct precise theses this slogan could be expressing, aiming for something in the range of five to eight readings, ordered from the most platitudinous to the most radical. For each reading: state it in a form specific enough that it could be false; identify which notion of precision it trades on (sharpness of the credal state as against narrowness of an interval, as against the number of digits reported, as against the sensitivity of the assignment to further data); identify which notion of evidence it requires (the total evidence, the data set, the amount of evidence as distinct from what it points toward, its resilience or fragility under further enquiry); classify it as a platitude, a substantive but defensible thesis, or false, with a sentence of justification; and say whether it functions as a requirement or merely as a permission, and whether it governs what an agent may believe or what she may assert and publish.

  Then, on that basis, tell me which readings would license each of his three uses; whether any single reading licenses all three; and if none does, which conjunction comes closest without collapsing into inconsistency. I would also like you to address two objections explicitly. First, that a maximally imprecise credal state is insensitive to evidence, and so appears to violate the slogan under at least one of its own readings. Second, that adopting a determinate set of probability functions is itself a precision commitment that has merely been relocated one level up, so that the imprecise response to use 1 may not escape the charge it was meant to answer.

  Finally, indicate how a Keynesian framework that separates the probability of an argument from its weight, and a framework on which rational credal states may be sets of probability functions, come apart with respect to this slogan: whether it is best read as a claim internal to one of those frameworks, to both, or to neither, and what turns on that.

  I would rather have the distinctions than the literature map, so please omit any bibliography or list of sources, and feel free to conclude that in one of the three uses the slogan is doing no work at all.
reasoning: |-
  Hmm, this is a fascinating and nuanced request about interpreting the slogan "you should not be more precise than your evidence" in the context of expert elicitation for civil engineering risk assessment. The user is part of a working group with philosophers and engineers, and needs to unpack three distinct uses of this slogan before their next meeting.

  First, let me analyze the three scenarios where the slogan was deployed:

  1. Against a point posterior estimate (0.043) derived from sparse data (11 inspection records) 
  2. Against replacing it with a credal interval ([0.01, 0.30]) or set of posteriors 
  3. Against ever reporting a single number to stakeholders

  The core tension seems to be between engineering pragmatism (needing actionable outputs) and philosophical rigor (acknowledging epistemic limitations). The user wants me to disentangle potential meanings of this slogan systematically.

  I consider structuring the response around five to eight distinct interpretations of "precision," ordered from least to most controversial. For each, I need to specify:
  - The exact thesis
  - Type of precision involved (numerical, credal sharpness, etc.)
  - Concept of evidence used (data, total evidence, resilience)
  - Epistemic status (platitude to false)
  - Normative force (belief vs assertion requirement/permission)

  Key dimensions to vary include:
  - Whether precision refers to numerical specificity vs credal determinacy
  - Whether evidence means raw data or interpreted weight/resilience
  - Whether the constraint applies to belief formation or communication

  The most platitudinous reading might be about numerical rounding (don't report 0.043 if data only supports 0.04), while the most radical could be that indeterminate evidence requires indeterminate credence (rejecting any probabilistic summary).

  I also need to address the two objections mentioned:
  1. That maximal imprecision (e.g., [0,1] interval) ignores evidence completely
  2. That credal sets merely shift precision to a meta-level

  For the Keynesian weight vs imprecise probabilities framework, the distinction matters because weight concerns confidence in probabilities (without necessarily rejecting point values), while imprecise credence rejects point probabilities entirely.

  For the three uses:
  - Use 1 could be supported by several readings (e.g., numerical overreach or credal determinacy)
  - Use 2 requires stronger theses (like rejecting any bounded intervals)
  - Use 3 seems to demand a radical communication norm

  I suspect no single interpretation covers all three objections consistently - the philosopher might be equivocating. The closest coherent position would combine: 
  - Rejection of point estimates for sparse data (thesis 4)
  - Rejection of narrow intervals (thesis 5)
  - A communication norm favoring ambiguity in high-stakes contexts (thesis 7)

  But this still faces the meta-precision objection about credal sets. Ultimately, the slogan serves different functions across contexts: as a statistical caution in Use 1, an epistemic challenge in Use 2, and a communication principle in Use 3.
answer: |-
  Here is a menu of distinct readings for "you should not be more precise than your evidence," ordered from most platitudinous to most radical. Each is analyzed per your specifications, followed by application to the three uses, objections, and framework comparisons.

  ---

  ### **Menu of Readings**
  1. **Numerical Specificity Constraint**  
     - **Thesis**: Do not report probability values with decimal places unjustified by data granularity or sample size.  
     - **Precision type**: Number of digits reported (numerical representation).  
     - **Evidence**: The dataset's informational content (e.g., sparse records limit resolution).  
     - **Status**: Platitude (e.g., reporting 0.043 with 11 records misrepresents statistical reliability).  
     - **Norm**: Governs assertion/publication (not belief); a requirement to avoid misleading presentation.  

  2. **Credal Resilience Requirement**  
     - **Thesis**: Do not assign sharp probabilities if small changes in data would drastically alter the estimate.  
     - **Precision type**: Sensitivity to further data (stability of the credal state).  
     - **Evidence**: The fragility of the evidence under counterfactual data (resilience).  
     - **Status**: Defensible (e.g., diffuse priors + sparse data → volatile posteriors).  
     - **Norm**: Governs belief/assertion; a requirement to avoid brittle commitments.  

  3. **Weight-of-Evidence Constraint**  
     - **Thesis**: Do not assert a precise probability if the evidence lacks "weight" (e.g., is sparse, indirect, or non-repeated).  
     - **Precision type**: Sharpness of the credal state.  
     - **Evidence**: Keynesian "weight" (amount/quality of evidence, distinct from probability).  
     - **Status**: Defensible (weight justifies confidence, not just probability values).  
     - **Norm**: Governs assertion; a permission to withhold precise reports when weight is low.  

  4. **Epistemic Humility Principle**  
     - **Thesis**: Sparse/non-robust evidence warrants representing uncertainty via sets (intervals, families) rather than points.  
     - **Precision type**: Credal determinacy (point vs. set).  
     - **Evidence**: Total evidence, including its limitations (sparsity, heterogeneity).  
     - **Status**: Defensible (avoids false precision; common in imprecise probability frameworks).  
     - **Norm**: Governs belief/assertion; a requirement for imprecise credence when evidence is weak.  

  5. **Interval Skepticism**  
     - **Thesis**: Even intervals/sets are unjustified if their bounds lack direct evidential grounding (e.g., endpoints are arbitrary).  
     - **Precision type**: Narrowness of interval (credal breadth).  
     - **Evidence**: Direct support for bounds (e.g., data must explicitly constrain endpoints).  
     - **Status**: False/radical (intervals can validly represent ignorance; rejecting them paralyzes decision-making).  
     - **Norm**: Governs belief/assertion; a requirement to avoid all bounded quantifications.  

  6. **Total Rejection of Precise Credence**  
     - **Thesis**: Weak evidence prohibits any probabilistic belief (point or interval), demanding non-probabilistic representations (e.g., qualitative rankings).  
     - **Precision type**: Any probabilistic commitment.  
     - **Evidence**: Amount of evidence (insufficiency for quantification).  
     - **Status**: Radical/false (probabilities can still guide decisions under ignorance; violates norms of rational choice).  
     - **Norm**: Governs belief; a requirement for indeterminate doxastic states.  

  7. **Assertoric Restriction**  
     - **Thesis**: Never assert a single number to stakeholders if evidence is contestable, regardless of analysts' beliefs.  
     - **Precision type**: Communicative determinacy (presenting a unique value).  
     - **Evidence**: Social context (stakes, expertise of audience, fragility of consensus).  
     - **Status**: Defensible (pragmatic caution in high-stakes contexts).  
     - **Norm**: Governs assertion; a permission to withhold numbers for ethical/pragmatic reasons.  

  ---

  ### **Application to the Three Uses**
  - **Use 1 (Objection to point posterior)**: Licensed by **1, 2, 3, 4**. Most plausibly **4** (prefer sets over points).  
  - **Use 2 (Objection to credal interval)**: Licensed by **5** (interval bounds lack grounding) or **6** (reject all quantification).  
  - **Use 3 (Objection to reporting any single number)**: Licensed by **7** (assertoric caution) or **6** (reject precise credence).  

  **Single Reading?** None covers all three. **Reading 5** (Interval Skepticism) licenses Use 1 and Use 2 but not Use 3 (which targets communication).  
  **Closest Conjunction**: **4 + 5 + 7** (epistemic humility for beliefs + interval skepticism + assertoric restriction). This avoids inconsistency but risks impracticality.  

  ---

  ### **Addressing Objections**
  1. **Maximal Imprecision Ignores Evidence**:  
     - Under **Reading 4**, a maximally imprecise credal state (e.g., [0,1]) violates the slogan because it fails to reflect *any* evidential support (e.g., 11 inspections likely rule out failure probabilities near 0 or 1). The slogan requires precision *commensurate* with evidence—not under- or over-precision.  
     - **Resolution**: The credal set must be *minimally narrow* given the evidence (e.g., [0.01, 0.30] if data weakly constrains bounds).  

  2. **Credal Sets Relocate Precision**:  
     - True: Choosing a specific set (e.g., all priors in Γ) commits to meta-precision about the *scope* of uncertainty. **Reading 5** rejects this, but **Reading 4** accepts it as unavoidable.  
     - **Resolution**: The slogan cannot demand *total* indeterminacy (which is self-defeating). Instead, it targets inappropriate precision at the object level (e.g., a point estimate). Meta-precision is a lesser evil.  

  ---

  ### **Keynesian vs. Imprecise Probability Frameworks**
  - **Keynesian "Weight"**:  
    - The slogan is internal to this framework. "Precision" refers to the assertibility of a probability *value*; "evidence" includes weight. Low weight prohibits precise *communication* but allows precise *belief* (if justified by balance of evidence).  
    - **Turns on**: Whether analysts can defensibly hold a point belief (Use 3).  

  - **Imprecise Credence**:  
    - The slogan is internal here too. "Precision" means credal determinacy; "evidence" determines the *permissible set* of probabilities. Low evidence widens the set.  
    - **Turns on**: Whether belief itself must be imprecise (Use 1 and 2).  

  - **Divergence**:  
    - Keynesians separate probability (balance of evidence) from weight (resilience), allowing precise beliefs with low weight. Imprecise probabilists reject sharp beliefs under weak evidence.  
    - **Slogan’s Scope**: Best read as *framework-neutral* but emphasized differently: Keynesians restrict *assertion*; imprecise probabilists restrict *belief*.  

  ---

  ### **Conclusion**
  - **Use 1** is justified under moderate readings (e.g., **4**).  
  - **Use 2** relies on radical **5** or **6**, which are harder to defend.  
  - **Use 3** is defensible under **7** (pragmatic communication) without implicating belief.  
  - **Slogan in Use 2**: Likely does little work beyond rhetorical emphasis; **Reading 5** is self-undermining (objecting to intervals for lacking precision, yet demanding "less precision" without specifying alternatives). A better objection would demand wider intervals or non-probabilistic qualifiers.  
  - **Recommendation**: Challenge the philosopher to disambiguate. If they endorse **4 + 7**, consensus is possible; if they insist on **5** or **6**, the position may be incoherent/impractical.
