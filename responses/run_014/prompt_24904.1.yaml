  ### In-Class Trading Game: Illustrating the No-Trade Theorem  
  **Objective:** Students experience how rational traders with common priors and private signals should cease trading once they infer information from counterparties' willingness to trade.  

  ---

  ### **Game Rules & Setup**  
  **Asset:** A fictional stock with true value \(V\) (either $100 or $0).  
  **Prior Belief:** Common prior—\(P(V=100) = P(V=0) = 0.5\).  
  **Private Signals:**  
  - Each student receives a noisy signal: H (suggesting \(V=100\)) or L (suggesting \(V=0\)).  
  - Signal accuracy:  
    - If \(V=100\), \(P(\text{H}) = 0.7\), \(P(\text{L}) = 0.3\).  
    - If \(V=0\), \(P(\text{H}) = 0.3\), \(P(\text{L}) = 0.7\).  

  **Initial Endowments:**  
  - Each student starts with **1 share** of the stock and **$50** in play money.  
  - Constraints:  
    - No short-selling (shares ≥ 0).  
    - No borrowing (cash ≥ $0).  
    - Max 2 shares per student.  

  **Trading Rounds (15–20 min total):**  
  1. **Round 1 (3 min):**  
     - Random pairings (e.g., draw numbers from a hat).  
     - Pairs negotiate **one share** trade:  
       - Buyer pays cash to seller; seller transfers share.  
       - Agree on any price (e.g., $30–$70).  
     - **Rule:** No explicit signal revelation (e.g., cannot say "I have H"). Only discuss prices (e.g., "I’ll buy if ≤$60" or "I’ll sell if ≥$40").  
     - Record trades (students track cash/shares on a worksheet).  

  2. **Rounds 2–4 (3 min each):**  
     - Re-pair randomly (new partners each round).  
     - Repeat negotiations.  
     - Observe declining trade volume as students update beliefs.  

  **Scoring (Post-Revelation):**  
  - Final wealth = Cash + (Shares × \(V\)).  
  - \(V\) revealed at the end (e.g., coin flip: heads = $100, tails = $0).  
  - Goal: Maximize wealth (non-monetary; "winning" is bragging rights).  

  ---

  ### **Session Timeline (90 min)**  
  1. **Intro & Rules (10 min):**  
     - Explain asset, signals, endowments, and trading rules.  
     - Emphasize: "Maximize wealth; signals are private; no explicit signal sharing."  

  2. **Setup (5 min):**  
     - Flip coin for \(V\) (secretly, record it).  
     - Distribute signals:  
       - If \(V=100\): 10 H, 5 L.  
       - If \(V=0\): 10 L, 5 H.  
     - Hand out worksheets (cash/share tracker).  

  3. **Trading Rounds (20 min):**  
     - 4 rounds × 3 min negotiation + 2 min pairing/transitions.  
     - **Instructor:** Silently tally trades per round on the board.  

  4. **Reveal & Scoring (10 min):**  
     - Announce \(V\).  
     - Students calculate final wealth.  
     - Quick show of hands: "Who increased/decreased wealth?"  

  5. **Debrief (45 min):**  
     - **Step 1: Observations (10 min):**  
       - Plot trades/round on board (expect decline: e.g., 7 trades → 3 → 1 → 0).  
       - Ask:  
         - "Why did trades decline?"  
         - "What made you suspicious when someone wanted to trade?"  
     - **Step 2: Map to No-Trade Theorem (15 min):**  
       - Formal structure:  
         - Common prior + rational Bayesians → trade requires *asymmetric info*.  
         - But willingness to trade *reveals* counterparty’s signal → beliefs update → trade vanishes.  
       - Example:  
         - H-signal buyer meets L-signal seller at $50.  
         - Pre-trade: Buyer values share at $70, seller at $30.  
         - Post-trade: Both infer counterparty’s signal → both update to $50 → no further trade.  
     - **Step 3: Predictable "Failures" First Time (10 min):**  
       - Early trades occur because:  
         - Students ignore *why* counterparty trades (naive updating).  
         - Overconfidence in private signals (e.g., "My H is stronger than their L!").  
         - Non-Bayesian heuristics (e.g., "Trading is fun!").  
       - Real markets: Trade persists due to liquidity/risk-sharing, not just info.  
     - **Step 4: Theorem’s Unrealized Feature (10 min):**  
       - **Missing:** *Common knowledge of rationality*.  
         - Game: Students doubt peers’ rationality ("Maybe they’re dumb!").  
         - Theorem: All know all are rational → no trade even with asymmetric info.  
       - Instructor adds: "Real trade exists because we *don’t* assume common knowledge of rationality or priors."  

  ---

  ### **Materials**  
  - Coin (for \(V\)), signal cards (pre-prepared envelopes: 10 H/5 L or vice versa).  
  - Worksheets:  
    | Round | Cash | Shares | Trade? (B/S/Price) |  
  - Board: Tally trades per round.  

  ### **Why This Works**  
  - **Gradual Discovery:** Early trades feel profitable (signals differ). Decline happens as students realize "Their offer tells me something!" without being told.  
  - **Debrief Links Intuition to Theory:** Observing belief updates in action demystifies the theorem.  
  - **Limitations Emphasized:** Highlights where the theorem diverges from reality (common knowledge).  

  **Outcome:** Students viscerally grasp why "no trade" should occur—and why real markets defy it.
