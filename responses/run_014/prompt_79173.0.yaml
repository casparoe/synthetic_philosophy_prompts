  First, I need to recall the core of the SE theory: a trait's function is the effect for which it was historically selected, and this history provides the normative aspect—why malfunctions are possible. The user mentions three problematic cases: traits maintained by new selection pressures, vestigial traits, and signals benefiting receivers. 

  The user's explicit requests are to map objections from fatal to awkward, separate defensible from weak objections, and assess if adding a causal-role component undermines the normative advantage. They also want predictions unique to SE and whether the surviving theory remains substantive.

  Hmm, the user seems well-versed in philosophy of biology. They're likely an academic or grad student. Their deep focus on edge cases suggests they're constructing or critiquing a nuanced argument, possibly for a paper. The mention of "normative payoff" hints they care about how SE handles the "should" in function claims—which is central to debates like naturalized normativity.

  I should tackle the objections in tiers. Fatal ones first: vestigial traits and receiver-side signals directly contradict SE's necessity claims. These are hard to dismiss because SE can't attribute function without historical selection. The defender might try to reinterpret selection history, but vestigial organs have no current function yet we still refer to their past function. That's a real tension.

  Next, maintained-but-repurposed traits. Here, SE has flexibility—if the effect changed but selection persists, the function updates. But if the trait is maintained without contributing to fitness (say, as a byproduct), SE struggles. The defender could argue that selection maintenance implies a function, but cases like sperm motility being maintained for fertilization while originally selected for locomotion show ambiguity in "original" vs. "current" selection. This is awkward but maybe fixable with careful selection-history delineation.

  For signals like alarm calls, SE traditionally assigns sender-side function (manipulating receivers). But if the receiver's response is the adaptive point (e.g., in mutualisms), SE might misattribute. The defender could stretch to say selection acts on the entire signaling system, but this feels forced. This case seems moderately damaging.

  The user also asks if adding causal-role elements forfeits SE's normative edge. Absolutely—if we supplement with systemic capacities, normativity collapses into mere causal contribution. SE's big selling point was grounding "should" in historical success. Diluting that loses the advantage over causal-role theories.

  Unique predictions? SE implies no function without selection history, so artifacts or convergent traits without common descent wouldn't have "real" functions—a bold claim rivals reject. Also, SE can explain why traits exist (selection history) where rivals can't. Post-objections, SE survives but is narrowed: functions require selection history, but we must accept that current maintenance can update functions and past functions can be referenced vestigially. It remains substantive if we accept these tweaks aren't ad hoc.

  Underlying all this, the user might be probing if SE's compromises make it indistinguishable from adjusted causal-role theories. That’s the real existential threat: if normativity relies on contingent history alone, but we keep bending rules for edge cases, does "selected for" stop meaning anything specific? I’d argue no—history still anchors the "should," even if we allow for reference shifts. The core thesis isn't empty, just messier than idealized versions.
answer: |-
  Here’s a structured map of objections to the Selected-Effects (SE) account of function, categorized by severity, defensibility, and implications for the theory’s core claims. The analysis addresses your focal cases and assesses whether supplementation erodes the normative advantage.

  ---

  ### **Fatal Objections** (Defender *Must* Concede)  
  *Threaten the core necessity of historical selection.*

  1. **Vestigial Traits with No Current Function**  
     - **Problem**: Vestigial organs (e.g., human appendix, whale pelvis) *had* a historical function but now lack any selected effect. SE cannot ascribe a current function, yet we intuitively say they are "non-functional" (implying they *should* do nothing).  
     - **SE Concession**: Vestigial traits have *no function* under SE. This forces awkward rephrasing: "It *was* functional for digestion" ≠ "It *is* malfunctioning." Normativity collapses for traits that lost their historical role.  
     - **Fatality**: Directly contradicts SE’s claim that function is defined *only* by past selection.  

  2. **Receiver-Side Functions in Communication**  
     - **Problem**: Signals like alarm calls are selected because receivers *respond adaptively* (e.g., evading predators). But SE assigns function to the *sender’s trait* (producing calls), not the receiver’s response. Yet the "function" of the signal is arguably the receiver’s reaction.  
     - **SE Concession**: SE must assign the function to the sender ("manipulating receivers"), but this misplaces normativity. If a meerkat’s call fails to trigger flight, is the *call* or the *receiver’s ears* malfunctioning? SE cannot explain why the receiver’s response is normative.  
     - **Fatality**: SE cannot ground normativity for traits whose fitness depends on *other organisms’ traits*.  

  ---

  ### **Severe Objections** (Defender Can *Partially* Respond, but at Cost)  
  *Force concessions that weaken SE’s explanatory uniqueness.*

  3. **Repurposed Traits Maintained by New Selection**  
     - **Problem**: A trait recruited for effect E1 (e.g., feathers for thermoregulation) is later maintained for E2 (flight). Is its function E1, E2, or both? SE typically says E1, but this clashes with current normativity (e.g., a feather that insulates but can’t support flight isn’t "broken").  
     - **SE Defense**: Adopt "continuing selection" (Millikan): if *current* selection acts on E2, then E2 is the function.  
     - **Cost**: Undermines SE’s reliance on *historical origins*. Why prefer "original selection" if current maintenance defines the function? This blurs SE’s distinction from systemic accounts.  

  4. **Byproducts Maintained by Selection**  
     - **Problem**: Traits like human chin (byproduct of selection on jaw shape) may be *maintained* by selection but not *selected for*. SE denies them functions, yet they can malfunction (e.g., asymmetrical chin).  
     - **SE Defense**: Only *directly selected effects* are functions; byproducts lack normativity.  
     - **Cost**: Fails to explain why maintained byproducts *feel* functional (e.g., sexual selection on chins).  

  ---

  ### **Awkward Objections** (Defender Can Wave Away)  
  *Challenges SE handles inelegantly but non-fatally.*

  5. **Convergent Evolution without Common Descent**  
     - **Problem**: Wings in birds/bats have identical functions (flight) but distinct selection histories. SE denies a unified functional category.  
     - **SE Response**: Functions are lineage-specific. "Flight" is analogous, not homologous.  
     - **Awkwardness**: Counters scientific practice of generalizing functions across taxa.  

  6. **Artifacts & Novel Traits**  
     - **Problem**: SE cannot assign functions to new artifacts (e.g., pacemakers) or mutations not yet selected.  
     - **SE Response**: Functions apply only to traits with selection histories. Artifacts derive "derived" normativity from designer intentions.  
     - **Awkwardness**: Forces dualism (biological vs. artifact functions).  

  ---

  ### **Supplementation & Normative Payoff**  
  - **Can SE Add Causal-Role (CR) to Cover Gaps?**  
    Yes (e.g., define vestigials as "CR functions lost"). But this forfeits SE’s *key normative advantage*: CR alone cannot explain why a heart pumping poorly is *malfunctioning* (vs. merely inefficient). CR only describes capacities, not norms.  
  - **Hybrid Solution**: Adopt a "dual theory" (e.g., Neander): SE for normativity ("*should* pump blood"), CR for system-stability ("*does* circulate fluid").  
  - **Cost**: SE no longer fully explains normativity; CR handles edge cases at the price of theoretical unity.  

  ---

  ### **Unique Predictions & Surviving Thesis**  
  - **What SE Predicts that Rivals Don’t**:  
    - Traits identical in current role but with different histories have different functions (e.g., human vs. octopus eyes).  
    - No function without selection history (rejects CR for non-selected traits).  
  - **Substantive or Empty?**  
    Surviving SE remains **substantive but narrowed**:  
    - **Core Thesis**: Normativity *requires* selection history.  
    - **Qualifications**:  
      - Functions can "shift" if selection acts on a new effect (solves repurposing).  
      - Vestigials/receiver-functions require auxiliary concepts (e.g., "vestigial *for* X").  
    - **Non-Empty**: Still explains *why* traits exist (selection history) and provides norms (via historical success). Rivals cannot do both.  

  ---

  ### **Conclusion**  
  SE survives as the only account grounding biological normativity but **fails on vestigials and receiver-driven signals**. A hybrid approach (SE + CR) covers these but dilutes SE’s explanatory monopoly on "malfunction." The qualified thesis remains robust for traits under *current or recent selection* but requires ad-hoc adjustments elsewhere. Its chief advantage—naturalizing "should"—persists only where history and current selection align.
