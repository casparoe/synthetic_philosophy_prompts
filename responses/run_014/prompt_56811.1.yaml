answer: |-
  ## Research Proposal: The Normative Architecture of Institutional Assertion

  **Project Title:** Beyond the Speaker: Institutional Assertion and the Unsettled Norms of Public Claim-Making

  **Precise Research Question:** Does institutional assertion (specifically within professional news production) operate under a distinct normative structure for evaluation and blame, characterized by a necessary *procedural justification* dimension separable from and irreducible to considerations of truth or individual knowledge, and if so, what is the precise nature of this structure and its implications for the general theory of assertion?

  **The Gap in Existing Theory: Why Individualist Norms Leave the Question Open**

  The dominant norms proposed for assertion – the Knowledge Norm (KN: assert only what you know), the Truth Norm (TN: assert only what is true), and the Justified (or Reasonable) Belief Norm (JBN: assert only what you justifiably believe) – alongside contextualist variations modulating the required epistemic threshold by stakes, share a foundational limitation: they are fundamentally modelled on *individual speakers* making *single, unqualified* utterances in *relatively simple conversational contexts*. My investigation posits that the institutional setting of professional journalism generates pressures and practices revealing inadequacies in this individualist framework:

  1.  **The Hedging Challenge & Modal Vocabulary:** News institutions systematically employ graded modal language ("reportedly," "allegedly," "sources indicate," "appears to be"). KN struggles: if hedging disqualifies these as assertions, then core philosophical cases describe an unrealized ideal; if they *are* assertions (as practice suggests), KN is routinely violated without obvious blame, suggesting a different or lower threshold. TN seems too weak, as false hedged assertions still attract criticism. JBN is ambiguous – whose justification? The reporter's? The editor's? The institution's aggregate state? The modal vocabulary explicitly signals a *procedural status* regarding evidence gathering, not necessarily the individual reporter's belief state, suggesting a norm tracking the *process* leading to utterance, potentially distinct from the individual's epistemic condition.
  2.  **The Blame Dissociation:** Professional practice distinguishes two types of criticism for institutional assertions:
      *   *Content Fault:* Criticism for publishing something *false* ("The correction shows they got it wrong"), even if impeccably sourced.
      *   *Process Fault:* Criticism for publishing something *without adequate justification* ("Their sourcing was thin/unreliable"), even if it turns out *true*.
      KN would render the true-but-unjustified assertion blameless. TN would render the false-but-well-justified assertion blameless. JBN, focused on the *speaker's* justification, struggles with the distributed, institutional nature of the justification process and the distinct *kind* of blame (focused on methodology, not belief) for process failures. This dissociation strongly suggests a two-dimensional normative standard: one dimension governing the *content* (truth/falsity), another governing the *process* of justification *for that institutional context*. Neither KN, TN, nor standard JBN adequately captures or explains this bifurcation.
  3.  **Institutional Epistemology & Retraction:** Institutions lack first-personal knowledge; their "knowledge" is entirely testimonial and procedural. Yet, they assert constantly. Furthermore, institutional retraction corrects the record but does *not* dissolve the criticism attached to a poorly sourced assertion in the way an individual’s retraction might mitigate criticism of their earlier belief. The criticism for *how* the assertion was made persists independently of the content's later status. This indicates that the normative evaluation targets the *assertion-making procedure itself* at the time of publication, a dimension orthogonal to the eventual truth-value and distinct from individual belief retraction.

  Existing norms and contextualism fail to provide a determinate answer to the core question because they lack the conceptual resources to adequately model: (a) the distributed, procedural nature of justification within an institution; (b) the explicit signalling of justification level via hedging; and (c) the distinct, persistent types of blame targeting content and process independently. Contextualism modulates the *epistemic threshold* (e.g., requiring more evidence for high-stakes claims) but does not fundamentally alter the *structure* of the norm from an individualist, belief/knowledge/truth-centric model. It does not introduce a separable procedural justification dimension.

  **Methodology: A Dialectical Synthesis of Conceptual Analysis and Grounded Reporting (12-Month Plan)**

  The project rejects purely armchair theorizing (risking irrelevance to actual practice) and purely quantitative error-rate studies (failing to capture the *normative reasoning* and *conceptual distinctions* embedded in practice). Instead, it employs a *dialectical method* where conceptual refinement and empirical investigation continuously inform each other:

  *   **Months 1-3: Foundational Framing & Taxonomy:**
      *   *Conceptual:* Deep dive into assertion norm literature (KN, TN, JBN, contextualism, assurance views) to precisely map their predictions regarding hedging, blame, and institutional agency. Develop initial taxonomy of institutional speech acts (hedged claims, corrections, retractions, editor's notes) and potential normative categories (procedural justification standards).
      *   *Empirical:* Preliminary, unstructured conversations with 3-4 senior standards editors/journalists to identify key pain points, terminology, and illustrative cases regarding sourcing, hedging, corrections, and criticism. Gather examples of internal style guides/policies on sourcing levels and modal language.
      *   *Synthesis:* Refine initial conceptual taxonomy and research questions based on empirical input. Identify core tensions between theory and practice.

  *   **Months 4-6: Probing Process & Justification:**
      *   *Conceptual:* Develop a robust analysis of "procedural justification" for institutions. How does it differ from individual justification (JBN)? Is it reducible to aggregated individual justifications? What are its necessary components (source verification, editorial review, fact-checking rigor appropriate to claim type)?
      *   *Empirical:* Conduct 10-12 structured interviews with standards editors, managing editors, and senior reporters across diverse news organizations (wire services, national papers, niche publications). Focus: How are sourcing levels determined? How is the choice of modal language (e.g., "said" vs. "confirmed") made? What constitutes a "sufficient" process for different claim types? How is "process failure" internally defined and distinguished from "factual error"?
      *   *Synthesis:* Analyze interviews for recurring justificatory procedures, thresholds, and implicit norms. Test conceptual models of procedural justification against reported practices. Begin formulating hypotheses about the separable procedural dimension.

  *   **Months 7-9: Analyzing Accountability & Blame:**
      *   *Conceptual:* Rigorously analyze the structure of blame and criticism in light of the content/process dissociation. Develop models of potential two-factor norms (e.g., "Assertion P is permissible only if (i) P is true *and/or* (ii) the institution followed justification procedure J for claims of type T" – exploring disjunctive, conjunctive, and threshold variations).
      *   *Empirical:* Systematic collection and qualitative analysis of 50-75 high-profile public corrections, retractions, and editor's notes, plus the accompanying internal reviews and external criticism (from media critics, public, subjects). Code explicitly for: stated reason for error (factual vs. process/sourcing), nature of external criticism (focused on falsity vs. irresponsible process), and institutional response.
      *   *Synthesis:* Map the empirical blame patterns onto the conceptual models of two-factor norms. Does the data support a consistent distinction? Does it suggest a hierarchy or interaction between content and process norms? Refine the two-factor model.

  *   **Months 10-12: Synthesis, Model Refinement & Implications:**
      *   *Conceptual:* Finalize the proposed normative model for institutional assertion, integrating the procedural justification dimension. Defend its necessity against the individualist norms and contextualism. Explore implications: Does this model apply beyond journalism (e.g., scientific publishing, government reports)? What does it say about institutional epistemic agency? How does it reshape the understanding of retraction?
      *   *Empirical:* Targeted follow-up interviews (3-4) to test the coherence and resonance of the developed model with practitioners. Does it capture their normative reasoning?
      *   *Synthesis:* Integrate all findings into a comprehensive argument. Draft core chapters/articles outlining the critique of individualist norms, the empirical basis for the two-factor structure, the precise model of institutional procedural justification, and its philosophical significance.

  **Success: The Defensible Claim**

  A successful residency will enable me to articulate and defend the following claim: **Professional institutional assertion is governed by a constitutive two-dimensional norm, where permissible assertion requires not only appropriate alignment with truth (the content dimension) but also, and distinctly, adherence to contextually defined standards of procedural justification for evidence acquisition and verification (the process dimension). Criticisms of institutional assertions track these dimensions separately, and the persistence of process-based blame even after retraction confirms the independence and necessity of the procedural justification requirement within the normative structure of institutional speech acts.** This claim directly challenges the sufficiency of KN, TN, and JBN for institutional contexts and offers a novel framework for analyzing public claim-making.

  **Failure Conditions & Scope Challenges**

  The project fails if:
  1.  **Empirical Collapse:** The reporting reveals no consistent distinction in practice between content and process blame, or shows that practitioners themselves reduce all criticism ultimately to truth/falsity or individual reporter justification, undermining the core premise. (Mitigation: Initial observations are strong; focus on high-profile cases known for process criticism).
  2.  **Conceptual Absorption:** Despite the blame dissociation, a compelling argument emerges showing procedural justification is fully reducible to a complex form of JBN applied distributively or contextually modulated KN/TN, negating the need for a distinct structural norm. (Mitigation: Focus on the *kind* of blame and its persistence post-retraction as evidence for structural difference).
  3.  **Scope Exceeded:** Mapping the precise contours of "procedural justification" across diverse journalistic contexts proves too vast. (Mitigation: Focus on core, widely shared standards; prioritize depth in key areas like confidential sourcing and breaking news). Synthesizing a robust, generalizable model from complex empirical data within 12 months is ambitious; failure here might mean delivering a compelling *problem* and *initial framework* with clear pathways for future refinement, rather than the final polished model.

  **Anticipating Deflations**

  *   **Deflation 1 (Applied Media Ethics):** "This is just a project in media ethics, describing journalistic standards, not contributing to core epistemology or assertion theory."  
      *   **Argumentative Work Required:** I must rigorously demonstrate that the *structure* of normativity revealed – particularly the *dissociation of blame types* and the *necessity of a procedural dimension irreducible to individual epistemic states* – poses a fundamental challenge to the *existing models* of assertion norms *as philosophical theories*. The project argues that institutional practice exposes a *conceptual gap* in the general theory, forcing a reevaluation of the nature of assertion itself in complex social epistemic contexts. It uses journalism as the paradigmatic case study to reveal this theoretical insufficiency, not as an end in itself.
  *   **Deflation 2 (Trivial Distinction):** "Of course institutions aren't individuals; it's trivial that their assertion practices differ."  
      *   **Argumentative Work Required:** I must move beyond the mere observation of difference to establish a *philosophically significant consequence*. The triviality charge is avoided by demonstrating that this difference: (a) necessitates a novel *normative structure* (the two-dimensional norm) not merely a variation in application; (b) challenges the individualist *assumptions* underpinning the debate (e.g., that justification is primarily a property of individual belief states); and (c) has implications for the *general* theory of assertion by showing that core phenomena like blame assignment are more complex than current models allow, potentially revealing facets obscured in individual cases. The argument is that the institutional case isn't just *different*, but *revealing* of a structural aspect of assertion norms previously under-theorized.

  This project contends that the newsroom is not merely a laboratory for applying philosophical theories of assertion, but a site where the inadequacy of the individualist paradigm becomes starkly visible, demanding a richer normative architecture centred on the justification of public claim-making procedures. The residency provides the essential time and intellectual environment to rigorously build this argument, bridging empirical practice and core philosophical debate.
