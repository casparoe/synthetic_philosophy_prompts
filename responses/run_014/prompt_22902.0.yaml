answer: |-
  Here’s a precise sequence targeting the interpretive load-bearing walls of this Spinoza reading, designed to force textual engagement and avoid restatements. Each question includes a follow-up anticipating common dodges:

  ### Core Questions
  1. **On "Natural Government" (Descriptive vs. Normative):**  
     "Spinoza calls democracy the 'most natural' form of government (TP 11.1) but also states the state of nature is violent war (TTP 16.4). How can democracy reconcile being both 'natural' (implying descriptive alignment with conatus) and normatively superior, given that nature isn’t inherently harmonious?"  
     *Likely Dodge:* "Natural here means aligning human power dynamics."  
     *Follow-up:* "But if democracy’s 'naturalness' is merely descriptive—tracking how power aggregates—why call it *most* natural? Doesn’t despotism also reflect power dynamics (e.g., TP 5.2 on monarchy’s instability)?"

  2. **On *Potentia* vs. Might-Makes-Right Collapse:**  
     "If 'right is coextensive with power' (TP 2.3-4), and the state’s legitimacy rests solely on its *potentia*, doesn’t this reduce obedience to fearing punishment? How is this different from Hobbesian de facto authority?"  
     *Likely Dodge:* "Spinoza distinguishes rational obedience via utility, not fear."  
     *Follow-up:* "But if utility = self-preservation (conatus), and the sovereign’s *potentia* defines utility, doesn’t this create a tautology? When Spinoza says a sovereign 'exceeds their right' by demanding self-destruction (TP 4.4), is that a normative limit or just observing power failure?"

  3. **On the Untransferable Right to Philosophize:**  
     "Spinoza insists the mind’s 'right' cannot be transferred (TTP 20.6-7). Is this liberty principled (e.g., an inalienable expression of conatus) or pragmatic (since 'thoughts can’t be controlled')? If pragmatic, could a state legitimately suppress speech if it develops mind-control technology?"  
     *Likely Dodge:* "It’s both: pragmatism reflects conatus limits."  
     *Follow-up:* "But if the state *could* control thought without backlash, would Spinoza concede it *should*? Or is there a deeper normative claim in TTP 20 that free thought is intrinsically necessary for rational self-preservation?"

  4. **On Rational Self-Interest vs. Obedience Divergence:**  
     "When rational self-interest conflicts with state commands—e.g., a law harming my self-preservation—Spinoza says I retain 'natural right' to resist (TP 4.5). But if democracy’s legitimacy rests on harmonizing interests, doesn’t such conflict undermine the entire conatus-based theory?"  
     *Likely Dodge:* "Democracy minimizes conflict by aggregating interests."  
     *Follow-up:* "But if an individual rationally dissents (e.g., a minority), is the state still 'legitimate' for them? Or does Spinoza’s theory only bind those whose conatus aligns with the majority? (See TP 3.9 on minorities 'submitting' but not 'transferring' right)."

  ### Supplemental Questions
  5. **On the Multitude’s Unity:**  
     "Spinoza says the state becomes 'as if one mind' (TP 2.15-16). But if individuals retain divergent conatus-driven interests, how can the multitude’s 'will' be unitary? Isn’t this will just the emergent power of the majority, not a true unity?"  
     *Likely Dodge:* "Unity arises from shared rational self-interest."  
     *Follow-up:* "But Spinoza admits democracy requires managing 'inconstant' masses (TP 7.27). If unity is aspirational, not actual, how does this avoid being a circular claim that democracy works when interests align?"

  6. **On Free Thought vs. Resistance:**  
     "How does Spinoza prevent the right to philosophize from becoming a right to resist? He bans seditious speech (TTP 20.12) yet says we judge laws by utility (TTP Pref.23). Where’s the line between rational critique and illegitimate dissent?"  
     *Likely Dodge:* "Resistance is only justified when survival is threatened."  
     *Follow-up:* "But since Spinoza ties survival to rationality (Ethics IVP24), doesn’t any law impeding rational judgment (e.g., banning philosophy) *itself* threaten self-preservation, justifying resistance? (See TTP 20.7 on thought as self-preservation)."

  ### Anchor Question (Preempts "Liberal or Not?" Tangents)
  7. **On Consent vs. Conatus:**  
     "You argue Spinoza’s theory isn’t consent-based. But if democracy’s legitimacy rests on individuals recognizing obedience as rational (TTP 16.10), isn’t this tacit consent? Or is 'recognition' just an epiphenomenon of power dynamics?"  
     *Likely Dodge:* "Consent implies voluntarism; Spinoza is deterministic."  
     *Follow-up:* "If conatus-driven 'recognition' functions identically to consent in practice (e.g., justifying obligation), why is the *liberal* label inaccurate? Is the difference merely metaphysical?"

  ### Tactical Notes
  - **Textual Grounding:** Each question cites specific passages (TP = *Political Treatise*; TTP = *Theologico-Political Treatise*). Speaker can’t evade without engaging Spinoza’s words.
  - **Avoiding Tangents:** Questions 2, 4, and 7 explicitly block retreats to Hobbes or liberalism. The EU question is replaced by Q5 (multitude unity), which addresses collective action without modern analogies.
  - **Pressure Points:** Follow-ups target contradictions: e.g., Q1’s nature/norm tension, Q3’s pragmatism/principles gap, Q6’s thought/resistance slippery slope.
  - **Skimmer-Proofing:** Requires knowing Spinoza’s key claims (e.g., conatus, *potentia*=right) but not obscure details. A summary-reader would flounder on the *implications*.

  Use these to force the speaker into the interpretive trenches—good luck!
