answer: |-
  **Most serious problem:** Claim (3)'s proposed budgeted knowability operator likely fails to block Fitch's paradox under diagonalization at fixed budgets, undermining its core purpose.

  **(a)** Claim (1) offers more than relabeling. Framing P/NP modally shifts focus from "what structures exist?" to "what structures are *accessible* to us under constraints?". It emphasizes the epistemic agent's limitations as constitutive of the modal category ("doable"), making resource-boundedness central rather than an add-on to traditional possibility.

  **(b)** Claim (2) risks sliding. "Checking is cheap" enables testimony *functionally* by lowering the barrier to acceptance. "Authority" is a sociological/psychological overlay. While complexity *explains how* cheap checking allows testimony to function scalably (justifying "condition under which testimony works"), directly inferring social authority requires bridging sociological concepts (trust, institutions) that complexity alone doesn't provide. The inference to the social *basis* of proof is licensed; the inference to specific social *forms* (authority) is less direct.

  **(c)** The budgeted reading likely fails against Fitch. Suppose at fixed resource budget B, we define ◇_B Kp as "p is knowable by some agent within B". Fitch's construction seems to re-emerge: consider the proposition q = "q is not known by anyone within B". If ◇_B Kq, then someone knows q within B, making q false (contradiction). If ¬◇_B Kq, then q is true ("q is not known within B") yet unknowable within B, violating knowability. The fixed budget doesn't obviously prevent this self-reference.

  **(d)** Conflation is present, particularly in (1) and implications for "the world being different if P=NP". The empirical impact hinges on *typical* or *average-case* hardness for real problems/cryptosystems. Worst-case P=NP could still leave specific instances hard; worst-case hardness ≠ practical infeasibility. Polynomial time as "feasible" is also a significant idealization glossed over when linking to "doable" in the real world.

  **(e)** If forced to cut one, cut (3). While intriguing, it's the least developed, the Fitch application is shaky (as per (c)), and "sayability" via communication complexity feels less tightly integrated with the core modal epistemology theme than "doable" (P/NP) and "checkable" (asymmetry). Claims (1) and (2) form a strong, interdependent core about resource-bounded agency and epistemic access/sociality. (3) extends laterally but risks diluting focus without a robust resolution to the identified weak point.
