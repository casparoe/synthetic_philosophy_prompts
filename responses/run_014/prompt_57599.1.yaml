  Looking at their draft, they raise several interesting points. In claim (1), they argue that complexity classes like P and NP are indexical classifications relative to resource budgets rather than natural kinds. Claim (2) suggests that the verification asymmetry is foundational for mathematical testimony and division of epistemic labor. Claim (3) introduces "sayability" through communication complexity and attempts to resolve Fitch's knowability paradox with budget constraints.

