answer: |-
  ## Essay Question (20 marks, 50 minutes)

  **Explain the dilemma presented below and evaluate its force against illusionism about phenomenal consciousness. The dilemma states:**  
  *Either illusionism must accept that the introspective "seeming" of having phenomenal properties (like redness or painfulness) is itself a phenomenal state, undermining the claim that there are no such properties; or, illusionism must reduce this seeming to a merely dispositional or functional state (like a disposition to judge), thereby failing to explain the distinctive, inescapable, and persistent subjective character of our experience that illusionism sets out to account for.*  
  **How might an illusionist respond to this challenge? Does the dilemma ultimately succeed in defeating illusionism? Justify your answer.**

  ---

  ## Model Answer (Approx. 650 words)

  The presented dilemma poses a significant challenge to illusionism, the view that phenomenal consciousness (the "what-it's-likeness" of experience) does not exist as a fundamental, non-physical property, but is rather a powerful *illusion* generated by cognitive processes. The dilemma attacks illusionism’s core claim by focusing on the nature of the *introspective seeming* – the compelling appearance that we *are* directly acquainted with phenomenal properties.

  The first horn of the dilemma contends that if the illusionist characterizes this introspective seeming *as itself a phenomenal state* (a state with genuine "what-it's-likeness"), then illusionism is self-undermining. If the seeming *that* phenomenal properties exist itself possesses phenomenal character, then phenomenal properties *do* exist, at least in the form of this seeming itself. This directly contradicts illusionism’s central thesis that there are no such properties. The illusionist cannot consistently deny phenomenal properties while simultaneously relying on a phenomenal state to explain the illusion of them.

  The second horn argues that if the illusionist avoids this by reducing the seeming to a purely dispositional or functional state (e.g., a strong, non-phenomenal *disposition to judge or report* that one has phenomenal experiences, driven by underlying cognitive mechanisms), then illusionism fails to explain the very phenomenon it targets. The datum illusionism promises to explain is not merely the *judgment* that we have phenomenal experiences, but the *compelling subjective character* of those experiences – why it *feels* so vividly like *something* to see red or feel pain, why this feeling is impossible to ignore through introspection alone, and why knowing the illusionist theory intellectually doesn’t make the feeling disappear. Reducing the seeming to a mere disposition to judge seems to sidestep explaining this inescapable subjective dimension; it replaces the explanandum (the feeling of phenomenality) with something else (a disposition). The theory thus appears to deny the very experience it set out to explain, leaving the persistence and resistance of the illusion unexplained.

  An illusionist has several potential responses. Firstly, they might **reject the demand for an explanation of the "subjective character" as phenomenally loaded from the start.** They could argue that the "subjective character" just *is* the complex of dispositions, access relations, and cognitive mechanisms at play. What we call the "inescapable feeling" is nothing over and above the system being strongly disposed to represent itself as having phenomenal states, coupled with limitations in our capacity to introspect these underlying mechanisms effectively. Secondly, they could offer a **deeper mechanistic account of the seeming's persistence.** Drawing on frameworks like predictive processing, the illusionist might explain the seeming as the inevitable output of a highly evolved, self-modeling prediction engine optimized for fast action. The model generates rich, unified sensory representations tagged with "subjective presence" because this is computationally efficient for guiding behavior; the "resistance" arises because the model generating the seeming is also the tool we use for introspection, creating a blind spot. The seeming's inescapability isn't evidence of phenomenality, but of the model's entrenchment and opacity. Thirdly, they could **challenge the coherence of the "datum".** The illusionist might argue that the pre-theoretical intuition of irreducible phenomenality is precisely *the illusion*, and it's incoherent to demand an explanation *within the theory* that reproduces that illusory quality. The theory explains why we *think* there's something extra; it doesn't need to reproduce the "extra" itself.

  Whether the dilemma succeeds is contentious. It succeeds only if one insists that *any* adequate explanation of the introspective seeming *must* either invoke genuine phenomenality (contradicting illusionism) or fail to capture the pre-theoretical "feel" (making illusionism irrelevant). **The dilemma is fatal** if the illusionist cannot provide a compelling, non-question-begging account of why the *dispositional/functional state* possesses the specific qualities of inescapability, subjective immediacy, and resistance that make the illusion so powerful *without* smuggling in phenomenal properties by another name. If the "seeming" genuinely reduces to cold dispositions, the charge that illusionism changes the subject seems strong. **The dilemma is defused** if the illusionist can successfully argue that their rich, mechanistic account of the seeming (e.g., via predictive self-modeling) *does* fully explain the subjective force and persistence of the illusion in purely non-phenomenal terms, rendering the demand for an explanation reproducing the "feel" as a relic of the illusion itself. The key battleground is whether the illusionist's explanation of the seeming's *character* is sufficient. Critics will argue the explanation leaves out the essential "what-it's-likeness" of the seeming itself; illusionists will counter that this "what-it's-likeness" is the illusory output, not a requirement for the explanation. This point – whether the functional account *really* captures the target phenomenon or redefines it away – is where the model answer's reasoning is most vulnerable to contestation.

  ---

  ## Marking Scheme (5 points, 4 marks each = 20 marks)

  1.  **Accurate Dilemma Exposition:** Student clearly and correctly explains both horns of the dilemma (phenomenal seeming undermines illusionism; non-phenomenal seeming fails to explain the datum). *Common Mistake:* Misstating the horns (e.g., confusing the seeming with the phenomenal property itself, or misrepresenting the failure mode of the second horn as just "denying the datum" without specifying *why* this is a failure for illusionism's explanatory goal).
  2.  **Problem Identification for Illusionism:** Student articulates *why* each horn is problematic for illusionism (1st horn = self-contradiction; 2nd horn = explanatory failure regarding the specific character/persistence of the illusion). *Common Mistake:* Stating the horn but not clearly linking it to a specific failure for illusionism's core claims or goals (e.g., just saying "it's eliminativism" without explaining *how* the dilemma shows this).
  3.  **Plausible Illusionist Response(s):** Student outlines at least one coherent illusionist counter-move (e.g., redefining the explanandum functionally, offering a mechanistic account of seeming/persistence like PP, challenging the coherence of the pre-theoretical datum). *Common Mistake:* Offering weak or irrelevant responses (e.g., "illusionism just says it's an illusion," without addressing *how* the seeming works; or confusing this with standard meta-problem answers without connecting to the dilemma's specific challenge).
  4.  **Critical Evaluation of Responses:** Student evaluates the strengths/weaknesses of the illusionist response(s) in light of the dilemma, specifically addressing whether it resolves the tension (e.g., does the functional account *truly* explain the inescapable subjective character, or does it evade the issue?). *Common Mistake:* Merely listing responses without critically assessing them against the dilemma's force, or accepting the response uncritically without acknowledging the core point of contention.
  5.  **Balanced Verdict & Key Sticking Point:** Student provides a justified conclusion on the dilemma's success/failure, explicitly identifying the crucial consideration (e.g., adequacy of non-phenomenal explanation of seeming's character), and acknowledges the contested nature of this point. *Common Mistake:* Stating a verdict without justification rooted in the prior analysis, failing to identify *why* the dilemma might succeed/fail (the key consideration), or presenting the verdict as uncontested.
