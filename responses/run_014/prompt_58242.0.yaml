answer: |-
  ### Grading Procedure for Analogical Reasoning Completions  
  **Goal**: Consistently classify candidate completions as **Acceptable (A)**, **Strained but Defensible (S)**, or **Incorrect (I)** based on structural fidelity to the source transformation. Focus on preserving core fluid-concept principles while simplifying for speed.  

  #### Core Principles to Preserve (Must Survive Simplification)  
  1. **Structural > Surface**: Reward mappings based on relational structure (e.g., "successor" or "reversal") over superficial features (e.g., copying specific letters).  
  2. **Principled Slippage**: Allow changes to concepts (e.g., successor → predecessor, left → right) if applied *consistently* and *analogously* to the source.  
  3. **Boundary Handling**: Snags (e.g., end of alphabet) must resolve analogously to the source (e.g., wrap if source wraps).  

  #### Simplifications for Speed (Safe to Drop)  
  - Deep ontology of "conceptual neighborhoods" (e.g., exact similarity scores between slippages).  
  - Multi-step justifications: Require only one coherent slippage.  
  - Ambiguous edge cases: Escalate after basic checks.  

  ---

  ### Decision Procedure Flowchart (for Raters)  
  **Instructions**: Ask these questions in order. Stop and assign a grade when criteria are met. Escalate if unresolved after **Step 4**. Use the justification template:  
  *"Letter: [A/S/I] because [one-sentence reason]."*  

  1. **Literal Match?**  
     - *Question*: Does the candidate apply the *exact same operation* (e.g., successor, reversal) to the *same relative positions* in the target as the source, with identical boundary handling?  
     - *Sufficient Answer*: **Yes** → **A**.  
     - *No* → Proceed to Step 2.  
     - *Flag*: If source has no boundary snag but target does, skip to Step 2.  

  2. **Principled Slippage?**  
     - *Question*: Does the candidate alter the concept (e.g., successor → predecessor) or structural role (e.g., leftmost → rightmost) in a *single, consistent way* that mirrors the source’s logic?  
     - *Sufficient Answer*: **Yes** (with analogous boundary handling) → **A**.  
     - **Partial/Inconsistent Slippage?** → Proceed to Step 3.  
     - **No Slippage** OR **Unrelated Operation** → Proceed to Step 4.  
     - *Flag*: Escalate if slippage involves >1 unrelated changes (e.g., successor→predecessor + group-splitting).  

  3. **Strained but Defensible?**  
     - *Question*: Is the candidate’s mapping weakly justifiable? Check:  
       - (a) Slippage is *coherent* (e.g., "mirroring the alphabet axis").  
       - (b) *No surface mimicry* (e.g., not copying source letters).  
       - (c) Boundary handling is *non-arbitrary* (e.g., wrap → wrap, not wrap → mirror).  
     - *Sufficient Answer*: Meets (a)–(c) → **S**.  
     - Fails (a), (b), or (c) → **I**.  
     - *Flag*: Escalate if justification requires >10 seconds of thought.  

  4. **Surface Mimicry?**  
     - *Question*: Does the candidate copy superficial features (e.g., source letters, position counts) or ignore structural roles?  
     - *Sufficient Answer*: **Yes** → **I**.  
     - **No** → Escalate to supervisor (unresolved).  

  ---

  ### Procedure Applied to Example Items  
  **Key**:  
  - ✅ = Criteria met  
  - ❌ = Criteria not met  
  - ⚠️ = Escalate or requires judgment  

  #### Item 1: Source `aab → aac`; Target `xyy`  
  - **Operation**: Change last token to successor (`b→c`).  
  - **Candidate One**: `xyz` (increments final letter `y→z`).  
    - **Step 1**: Literal match? ✅ (same operation: successor on final token).  
      - → **A**: Applies source operation identically to target.  
  - **Candidate Two**: `xzz` (increments final group `yy→zz`).  
    - **Step 1**: Literal match? ❌ (source changes one letter, not a group).  
    - **Step 2**: Principled slippage? ✅ (slips "token" → "group" but preserves successor consistently).  
      - → **A**: Principled group-based slippage.  

  #### Item 2: Source `abc → abd`; Target `xyz`  
  - **Operation**: Successor on final letter (`c→d`).  
  - **Candidate One**: `xya` (wraps `z→a`).  
    - **Step 1**: Literal match? ❌ (source has no wrap).  
    - **Step 2**: Principled slippage? ✅ (slips "no-boundary" → "wrap" to handle target snag analogously).  
      - → **A**: Principled boundary handling.  
  - **Candidate Two**: `wyz` (changes `x→w`, applies predecessor to leftmost).  
    - **Step 1**: Literal match? ❌.  
    - **Step 2**: Principled slippage? ✅ (slips "successor→predecessor" and "rightmost→leftmost" consistently; mirrors alphabet position).  
      - → **A**: Coherent mirror slippage.  
  - **Candidate Three**: `xyd` (replaces final letter with `d`).  
    - **Step 1**: Literal match? ❌.  
    - **Step 2**: Principled slippage? ❌ (no slippage; copies letter `d` from source).  
    - **Step 4**: Surface mimicry? ✅ (copies source letter `d` ignoring target structure).  
      - → **I**: Surface mimicry of source output.  

  #### Item 3: Source `abc → cba`; Target `XX`  
  - **Operation**: Full reversal (`abc→cba`).  
  - **Candidate One**: `XX` (unchanged).  
    - **Step 1**: Literal match? ✅ (reversal of identical elements is invisible but structurally identical).  
      - → **A**: Reversal preserved; no structural change needed.  
  - **Candidate Two**: `XY` (introduces asymmetry to "show" reversal).  
    - **Step 1**: Literal match? ❌ (reversal of `XX` is `XX`, not `XY`).  
    - **Step 2**: Principled slippage? ❌ (changes reversal to "add difference," unrelated operation).  
    - **Step 4**: Surface mimicry? ✅ (prioritizes "visible effect" over structure; copies source’s *observability* not its *logic*).  
      - → **I**: Surface mimicry of source’s perceptual outcome.  
    - *Note*: Your preference for cleverness is overruled—procedure prioritizes structural fidelity.  

  ---

  ### Limitations and Escalation Triggers  
  **What the Procedure Cannot Do**:  
  - Reward **meta-slippages** (e.g., "applying reversal requires first making elements distinct").  
  - Evaluate **multi-layered analogies** (e.g., slippage + new boundary resolution).  
  - Handle **radically creative** answers (e.g., reinterpreting "reversal" as "alphabetical inversion").  

  **Escalate to Supervisor When**:  
  - Slippage involves >1 *unrelated* conceptual changes (Step 2 flag).  
  - No surface mimicry but no clear slippage (Step 4 unresolved).  
  - Ambiguity in source transformation (e.g., multiple valid readings).  

  **Creative Answers Needing Human Review**:  
  - Candidates where structural fidelity is achieved via **non-obvious slippages** (e.g., treating letters as numbers and applying arithmetic).  
  - **Boundary-resolving innovations** (e.g., "z→a" via wrap vs. "z→ space").  
  - **Self-referential** solutions (e.g., modifying the target to "enable" the operation).  

  This procedure ensures 90%+ consistency for straightforward cases while flagging 5–10% of items for your review. It misfires only on candidates balancing structural fidelity with high novelty—precisely where expert judgment adds value.
