prompt: |-
  Background: I'm a backend engineer, no philosophy training, just random blog posts and podcasts. Something's been nagging at me for about a month and I don't have a word for it, so I figured I'd describe it and see if it's a known thing.

  Instance one. We had a bad outage last quarter. I could write down the complete low-level story of it in exhausting detail — which process held which socket at which millisecond, every retry that fired, the GC pause, the kernel buffers, the whole chain — and there's no gap anywhere in that story. You never have to say "and then something extra happened." If I handed you that account, you could see exactly why the request died; nothing is left out. But the explanation I actually put in the postmortem was one sentence: the retry policy had no backoff, so a handful of slow responses snowballed into a storm that used up the connection pool. And here's the part that bugs me — that sentence doesn't add any causal work on top of the detailed account. It's not like the packets did 80 percent and the retry policy did 20. If the low-level story is already complete, there is nothing left over for my sentence to do. And yet mine is the one that was useful: it generalized to services we hadn't looked at, and it told us what to change.

  Instance two. A perf regression, same shape. The full explanation is a specific trace of executed instructions, and it's complete. What I told the team was "someone changed the lookup from indexed to a scan." Again, no leftover work for that sentence to do, again it's the only sentence anyone could act on.

  Now the wrinkle, which is where I think my case stops being the standard version of whatever this is. The usual way I've seen people try to make the worry go away — in comment threads, not papers — is to say the coarse story is the one that's proportional to the effect, because tons of different fine-grained details would have produced the same outcome anyway, so the fine-grained ones are the irrelevant ones and the coarse one does the real work. But in both of my cases that looks backwards. The detailed level isn't a big pile of equally good routes to the same outcome — it's one extremely specific chain, and I can point at particular milliseconds that mattered. And the coarse property is the narrow one: "no backoff on retries" is a pretty specific defect, and a huge range of alternative designs would *not* have caused this outage. So I can't tell which level is the vague-and-robust one and which is the precise-and-fragile one, and if that's the move that dissolves the problem, I don't see how it's supposed to go here.

  Separate thing: someone told me this is supposed to be the same shape as the mind/brain puzzle, where a person deciding to raise their arm and the neurons firing look like they're competing for the same job and the neurons always win because they're the ones doing the physics. If it's the same problem, I want to know where my version lines up with that one and where it doesn't — because code and hardware are both things we built, and the relation between them (compile, deploy, run) feels nothing like whatever the relation is between a thought and a brain state, and I can't tell whether that difference matters or whether it's a red herring.

  So: does what I'm describing have a name? I'd like three things, and I'm not satisfied with just a label — the carving is the point.

  1. The nearest established concepts, whatever they turn out to be, and for each one a sentence or two on why my thing is or isn't it.
  2. If the exact configuration doesn't have a name, coin one, define it, and give me its edges: what counts, what doesn't, and one example of a case that looks like mine on the surface but isn't.
  3. Whether the wrinkle actually changes anything about the bigger worry, or whether I've just re-described the ordinary thing with extra steps.

  Please explain it all in your own words — no reading list or bibliography, I can't look anything up right now anyway.

  End your reply with one final line, exactly `\answer{...}`, containing only the name (the established term if there is one, otherwise the one you just coined) inside the braces.
reasoning: |-
  Okay, let me tackle this user's query. They're a backend engineer without formal philosophy training, trying to understand a conceptual problem they've encountered in their work. The core issue revolves around two technical incidents where a detailed low-level account of an outage was complete, yet a high-level summary provided the actionable insight. The user is struggling with why the high-level explanation is useful when the low-level account seems causally sufficient. 

  First, I need to map their examples to existing philosophical concepts. The mind-brain analogy they mentioned points to multiple realizability or supervenience. But their "wrinkle" complicates this—unlike mental states that can be realized by various physical states, their technical examples involve specific low-level details that mattered. The coarse explanation ("no backoff") is actually narrow, not broad. This suggests that standard multiple realizability arguments don't quite fit.

  Considering causal overdetermination or explanatory levels might be closer. The high-level explanation isn't adding new causes; it's providing a pattern that abstracts the relevant details for intervention. The user's examples show that while low-level details are necessary, they aren't sufficient for explanation because they lack generalizability. This sounds like pragmatic or perspectival explanation—choosing a level based on human needs like actionability.

  The user's wrinkle about specificity is key. The coarse explanation is precise in its own way—it identifies a critical factor among many possible configurations. This isn't robustness through variability but relevance through constraint. The concept of "explanatory target" comes to mind: the "why" vs. "how" distinction. The low-level account answers "how" step-by-step, while the high-level answers "why it mattered" for decision-making.

  I should coin a term if existing ones don't fit. "Causal lens" captures the idea of focusing on a specific aspect of causation relevant to the observer's goals. It emphasizes that explanation selects features based on utility, not ontological primacy. This avoids the mind-brain issue since code/hardware are designed systems where levels are intentionally coupled.

  Finally, affirm that their wrinkle changes the standard narrative: specificity exists at both levels, but utility determines which level "does the work" for a given purpose. The answer should reflect this synthesized view—perhaps "pragmatic abstraction" as the established core, with their case as a focused variant.
answer: |-
  Your examples perfectly illustrate a tension between **causal completeness** and **explanatory utility**, with a twist that makes standard philosophical responses feel unsatisfying. Here's the breakdown:

  1.  **Nearest Established Concepts & Why They Fit (or Don't):**
      *   **Multiple Realizability:** (The standard move you mentioned) *Why it seems to fit:* Your coarse explanation ("no backoff") *could* be realized by many different specific low-level chains (different timestamps, different buffer states, slightly different GC pauses). *Why it doesn't fully fit your wrinkle:* You emphasize that *this specific* low-level chain was necessary *this time* ("particular milliseconds mattered"), and the coarse property ("no backoff") is itself quite specific, not a broad category like "pain" realized by diverse brain states. Your coarse level isn't *robustly* multiply realizable in the classic sense.
      *   **Explanatory Levels / Granularity:** *Why it fits:* Explanations exist at different levels (physical, circuit, logic gate, software function, system design). Each level abstracts away details irrelevant to *its* purpose. *Why it doesn't dissolve the worry:* It describes *what* you did but doesn't resolve *why* the higher level feels "causal" when the lower level is complete. It doesn't address your observation that *both* levels seem specific.
      *   **Causal Overdetermination / Epiphenomenalism:** (Related to the mind/brain puzzle) *Why it seems to fit:* It feels like the low-level story *fully* causes the outcome, making the high-level property ("no backoff") seem epiphenomenal (a byproduct with no causal power). *Why it doesn't fit (especially with your wrinkle):* Your high-level explanation demonstrably *does* work – it guides intervention and prediction. Code is *intentionally designed*; the high-level property ("no backoff") *is* a real, implemented feature causing specific low-level behaviors. It's not an emergent property of a complex system in the same way consciousness might be. The "relation" (compile/deploy/run) is direct design & implementation, fundamentally different from mind/brain.
      *   **Pragmatics of Explanation:** *Why it fits best:* Explanations aren't just about listing causes; they are *for* an audience with a purpose (e.g., fixing the problem, preventing recurrence). The "complete" low-level story, while causally sufficient, is **explanatorily deficient** for the audience's needs (engineers needing to act). It drowns them in irrelevant detail. Your coarse explanation identifies the **salient feature** – the specific, high-level design flaw that was the *necessary enabling condition* for *this class* of failures, making action possible. Its "causal work" isn't *adding* physical force; it's *selecting* the crucial *type* of cause relevant to the *explanatory goal*.

  2.  **Coining a Term & Defining Edges:** Since the standard terms feel mismatched due to your wrinkle, let's define:
      *   **The Specificity Flip in Explanatory Salience:** The phenomenon where:
          1.  A causally sufficient, highly specific low-level account of an event exists.
          2.  A higher-level, seemingly more abstract explanation is found to be necessary for practical action and generalization.
          3.  Crucially, *contrary to typical multiple realizability arguments*, the high-level explanation is *itself highly specific* (e.g., "no backoff", "index changed to scan") and *narrowly constrains* the possible low-level realizations that would lead to the same *type* of failure, while the specific low-level instance *was necessary for this particular occurrence*.
      *   **What Counts:**
          *   Requires a designed system with identifiable levels of abstraction (hardware, code, design).
          *   Requires a complete low-level causal chain.
          *   Requires a high-level explanation that is *actionable* and *generalizable*.
          *   Requires the high-level explanation to be *specific* (not broadly realizable) and the low-level chain to be *necessary* for the specific instance.
      *   **What Doesn't Count:**
          *   Emergent properties in complex systems (e.g., consciousness, flocking behavior) where the high-level property is broadly multiply realizable and the low-level details are largely interchangeable.
          *   Cases where the high-level explanation *is* broadly realizable (e.g., "server overloaded" could be caused by countless specific traffic patterns and resource states).
          *   Cases where the low-level details *are* interchangeable for the outcome (e.g., *any* sequence of packets causing buffer overflow, regardless of content).
      *   **Looks Similar But Isn't:** A traffic jam caused by "too many cars on the road." The low-level account (position/speed of every car) is complete. The high-level explanation ("traffic volume exceeded capacity") is actionable (build more lanes, encourage transit). *However*, "too many cars" *is* broadly multiply realizable (countless specific configurations of cars cause it), and many specific low-level car movements *wouldn't* have caused a jam. This fits the *standard* multiple realizability model, not your "Specificity Flip."

  3.  **The Wrinkle and the Bigger Worry:** Your wrinkle **significantly changes** the standard framing of the "mind/brain" type problem:
      *   **Not About Robustness vs. Fragility:** In the standard mind/brain or multiple realizability view, the high level is robust/flexible, the low level is fragile/specific. You show the high level (the design flaw) can be *just as specific and fragile* ("no backoff" is a precise, flawed design choice; changing it slightly avoids the failure). The low level is specific but *was necessary*.
      *   **Built Systems vs. Natural Systems:** The key difference is that code/hardware are *designed artifacts*. The high-level property ("no backoff") *is directly implemented by and constrains* the low-level behavior. It's not an emergent property; it's a *design intention* (flawed in this case). The "causal power" of the high level comes from its *role in the design specification* that *dictates* low-level behavior patterns. Its explanatory power comes from identifying *which design constraint* failed. In the mind/brain case, the high level (thought) isn't a "design specification" for the low level (neurons) in the same direct, implemented way.
      *   **Dissolving *Your* Worry:** The high-level explanation ("no backoff") isn't doing *physical* causal work *on top* of the low level. The low level *is* the physics. The high-level explanation is doing *explanatory* work: it identifies the **critical design constraint** whose implementation *necessarily led to* the specific class of low-level behaviors that caused the failure *in this context*. Its utility comes from targeting the *leverage point* within the designed system – the thing *you can change* to prevent *this type* of failure, knowing that the system's implementation will enforce the causal connection between that design change and the altered low-level behavior. The completeness of the low-level story doesn't negate the high-level design flaw; it *exemplifies* it.

  **In your own words:** You've hit upon why debugging is both science and art. The trace tells you *how* it broke, step by step. But seeing "no backoff" tells you *why* it broke *in a way that matters* – it points to the exact screw you can turn to stop it happening again, even though that screw was already fully represented in the detailed noise of the trace. The trace has all the causes, but your sentence highlights the *critical* cause you control. The "flip" is realizing that the thing you control ("no backoff") is just as precise and necessary for the failure mode as the milliseconds in the trace were for *this specific* crash.

  \answer{Specificity Flip in Explanatory Salience}
