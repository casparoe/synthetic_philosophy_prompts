  Okay, let me start by unpacking the user's query. They're in a philosophy of science seminar and keep encountering a specific pattern. They describe two rival theories underdetermined by evidence, but then point out that the evidence itself isn't neutral—each theory comes with its own set of observations. The user feels this goes beyond standard theory-ladenness or Duhem-Quine.

  First, I need to recall the key concepts here. Theory-ladenness, as Hanson and others discussed, focuses on how theories influence the interpretation of observations. Duhem-Quine is about the holism of testing—hypotheses can't be tested in isolation. The user is suggesting something more radical: that the evidence sets themselves are theory-dependent. 

  The user's concrete example mentions measurements requiring instruments and background assumptions tied to the theory. That makes the raw data "cooked" by the theory. So, the issue isn't just interpretation but the very availability of data. 

  I remember Kuhn's paradigms as a possible fit. In "Structure of Scientific Revolutions," he talks about how different paradigms define what counts as legitimate problems, methods, and data. So under different paradigms, the evidence sets differ fundamentally. For example, pre- and post-Copernican astronomy didn't just interpret the same data differently; their observational practices and what they considered data varied. 

  Another angle is Feyerabend's "counterinduction," where he argues that rival theories can have incommensurable observation languages. Hacking's "styles of reasoning" also seems relevant—each style introduces new objects, evidence, and standards. 

  Now, how is this distinct from theory-ladenness? Theory-ladenness is about perception and interpretation of individual data points. The user's concern involves the entire evidential framework. Duhem-Quine still assumes a common set of observations; the problem is assigning blame in a network. Here, the evidence sets themselves are disjoint or non-overlapping. 

  The user wants to know if there's a name for this. "Evidential framework relativity" comes to mind, but I should check if existing terms cover it. "Kuhnian incommensurability" is close, but often debated. "Constructive empiricism" by van Fraassen touches on observability but might not fully capture it. 

  Boundary cases are important. When does this apply? If two theories share instruments and data formats but interpret differently, that's theory-ladenness. But if the instruments, data types, or standards of validity are theory-specific, that's the radical case. For example, in phlogiston vs. oxygen chemistry, the methods for collecting gases differed, leading to different datasets. 

  The user might need clarity for seminar discussions. They might be encountering historical case studies where theories seem to talk past each other. Naming this concept could help articulate that challenge. Their deeper need could be understanding how scientific debates resolve when evidence itself is contested, or grappling with relativism in science. 

  I should emphasize that this doesn't make science arbitrary. Evidence within a framework still constrains theories, but switching frameworks involves more than just data—it's about methodology, standards, and ontology. The closest term is Kuhn's paradigm-dependent evidence, but coining "framework-constituted evidence" could provide precision. Defining it with boundary cases will help distinguish from milder forms of underdetermination.
answer: |-
  You've hit upon a deeply significant and contentious issue in the philosophy of science. What you're describing **isn't adequately captured by "theory-ladenness of observation" alone, nor by Duhem-Quine underdetermination.** You're pointing toward a more radical consequence of the entanglement between theory and observation, specifically concerning the *constitution* of the evidentiary field itself. The closest established concept is **Kuhnian "Incommensurability" (specifically, methodological/evidential incommensurability)**, but let's dissect it carefully and refine the terminology to match your precise concern.

  ### Core Concept: Framework-Constituted Evidence (FCE)
  Your insight describes a situation where:
  1.  **Theory T1 defines/entails Evidential Framework E1:** This includes:
      *   What counts as a legitimate observation/measurement.
      *   The instruments/techniques deemed valid and reliable.
      *   The categories used to record data.
      *   The standards of precision, accuracy, and relevance.
      *   What background conditions must be controlled for.
  2.  **Theory T2 defines/entails a *different* Evidential Framework E2:** E2 specifies a potentially disjoint set of observational practices, instruments, data categories, and standards.
  3.  **No Theory-Neutral Arbiter:** There is no standpoint ("view from nowhere") external to T1/E1 or T2/E2 to declare *which* evidential framework (E1 or E2) constitutes the "real" or "correct" evidence set for adjudicating between T1 and T2.
  4.  **Radical Underdetermination + Evidential Relativity:** The underdetermination isn't just that *given* a shared evidence set E, both T1 and T2 fit E. It's that **there is no shared E**. The very *domain* of evidence is framework-relative. T1 lives in the world of E1, T2 lives in the world of E2, and these worlds overlap minimally or not at all in their raw data.

  This is **Framework-Constituted Evidence (FCE)**.

  ### Distinguishing FCE from Neighbors

  1.  **Theory-Ladenness of Observation (TLO):**
      *   **Focus:** How background theories shape the *perception*, *description*, and *interpretation* of a specific sensory input or experimental outcome *within a broadly shared evidential practice*. (e.g., seeing an X-ray tube image as bones vs. seeing it as densities; interpreting a spectrometer reading as confirming element Y).
      *   **Shared Basis:** TLO generally assumes a relatively stable world of stimuli or instrument outputs *that can be pointed to*, even if described differently. The "pointer readings" or "buzzes and flashes" are often taken as a common, albeit thin, layer.
      *   **FCE Difference:** FCE denies this stable common layer. It argues that **the set of possible "pointer readings" themselves are constituted by the framework.** What counts as a valid instrument *output*, let alone its interpretation, is framework-dependent. TLO is about coloring the picture; FCE is about defining what counts as canvas and paint.

  2.  **Duhem-Quine Thesis (Holism):**
      *   **Focus:** The impossibility of testing a single hypothesis `H` in isolation. `H` always relies on auxiliary assumptions `A` (about instruments, background conditions, other theories). If experiment conflicts with prediction, the blame can be placed on `H` *or* some part of `A`. Many combinations (H + A') can save `H`.
      *   **Shared Basis:** Duhem-Quine assumes a **shared observation language or set of basic experimental outcomes (`O`)** that forms the test base. The problem is distributing credit/blame *given* `O`. (`T1` + `A1` entails `O`; `T2` + `A2` entails `O`; which pair is wrong?).
      *   **FCE Difference:** FCE argues there is **no shared `O`**. `O1` (the data relevant to `T1` + `A1`) and `O2` (the data relevant to `T2` + `A2`) are fundamentally different sets constructed by their respective frameworks. The holism is deeper – it engulfs the data generation itself. D-Q is about the web *fitting* the data; FCE is about the web *spinning* the data.

  3.  **Kuhnian Incommensurability:**
      *   **Closest Fit:** Kuhn's later work (especially post-"Structure of Scientific Revolutions") emphasized that paradigms define their own standards, problems, and **worlds of evidence**. "Proponents of competing paradigms practice their trades in different worlds... [they] see different things when they look from the same point in the same direction" (Structure, Ch. X). This includes what counts as a significant problem, a valid solution, and crucially, relevant *data*.
      *   **Relation to FCE:** FCE is **the evidential core of methodological incommensurability.** Kuhn's point wasn't just that theories interpret data differently (TLO) or that testing is holistic (D-Q), but that the *criteria for what counts as evidence* and the *methods for generating it* are paradigm-bound. Your description perfectly captures this aspect.
      *   **Why "FCE" might be better:** "Incommensurability" is a broad, often misunderstood, and controversial term covering semantic, methodological, and perceptual aspects. "Framework-Constituted Evidence" directly names the specific *mechanism* you've identified: the evidence set is not neutral ground but is actively constituted by the theoretical framework.

  ### Boundary Cases: When is it FCE vs. Standard Underdetermination?

  *   **FCE Applies When:**
      *   Theories require fundamentally different instruments (e.g., T1 relies on cloud chamber tracks; T2 relies on statistical correlations in particle decay rates measured by complex detectors whose validity T1 rejects).
      *   Theories define different fundamental observables (e.g., T1 deals with "caloric flow"; T2 deals with "mean kinetic energy"; the *kinds* of measurements made differ).
      *   Theories impose incompatible standards of precision/accuracy/control (e.g., T1 demands lab conditions impossible under T2's cosmology, or vice-versa).
      *   The *format* of data is theory-laden at the level of ontology (e.g., T1 records "positions and momenta"; T2 records "wavefunction amplitudes" – these aren't easily translatable data formats).
      *   **Key Test:** Can the *raw output* of a measurement procedure designed for T1 be meaningfully *input* into T2's evaluative process *without presupposing T1's framework*? If not, FCE is likely in play.

  *   **Standard Underdetermination Applies When:**
      *   Theories share a common evidential framework (E) – same instruments, same data categories, same standards.
      *   Both T1 and T2 can be logically formulated to entail or be consistent with the *same set of observation statements* described in a relatively neutral way (e.g., "needle points to 5.2", "photographic plate shows a line at position X", "substance boiled at 100°C at sea level").
      *   The dispute is about *which theory best explains E*, or *which auxiliaries are more plausible*, given E.
      *   **Key Test:** Is there a core set of "readings" or "events" that both sides agree happened and are relevant, even if they interpret them differently? If yes, it's likely TLO/D-Q underdetermination over a shared E.

  ### Implications and Nuances of FCE

  1.  **Not Total Relativism:** FCE doesn't mean *anything goes* within a framework. T1 must still be consistent with *its own* E1. Internal coherence and predictive power within the constituted evidence world still matter. FCE highlights the difficulty of *cross-framework* comparison and choice.
  2.  **Dynamic & Historical:** FCE is most evident during major scientific revolutions (e.g., Aristotelian -> Newtonian mechanics; Phlogiston -> Oxygen chemistry; Classical -> Quantum physics). Established frameworks solidify their evidence sets over time.
  3.  **Role of Bridging:** Progress often involves developing techniques, instruments, or mathematical translations that *create* overlap between E1 and E2, allowing some form of comparison. FCE highlights the *challenge*, not the impossibility, of such bridging.
  4.  **Closest Thinkers:** Beyond Kuhn, aspects resonate with:
      *   **Feyerabend ("counterinduction"):** Advocating developing theories with *different* observational bases to challenge dominant ones.
      *   **Hacking ("styles of reasoning"):** Different historical "styles" (e.g., statistical, laboratory science) introduce new objects, evidence types, and standards of proof.
      *   **Goodman ("ways of worldmaking"):** Emphasizing the constructive role of conceptual schemes.
      *   **Van Fraassen ("constructive empiricism"):** While focused on observability, his emphasis on the theory-dependence of *what is observable* touches on FCE.

  **Conclusion:** Your "pattern" is the robust concept of **Framework-Constituted Evidence (FCE)**, forming the evidential heart of Kuhnian methodological incommensurability. It marks a radical departure from the idea of a fixed, theory-neutral observation base. FCE arises when rival theories don't just interpret the *same* world of data differently (TLO), nor merely embed hypotheses in different auxiliary webs relative to shared data (D-Q), but actively *constitute different worlds of evidence* through which they operate. The boundary is crossed when the instruments, data formats, standards, and very definitions of what counts as an observation become disjoint and framework-dependent, eliminating a common empirical ground for direct comparison. This doesn't render science irrational, but it fundamentally reshapes our understanding of theory comparison and scientific progress. Your seminar discussions are grappling with one of the deepest challenges in the field.
