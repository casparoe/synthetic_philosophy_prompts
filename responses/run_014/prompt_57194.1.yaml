     Full rules:

     1. Each student is given 100 tokens at the start.
     2. They are told that they will be asked to assign probabilities to some propositions. These probabilities will be used as betting odds.
     3. Elicitation: assign probabilities to the 5 propositions.
     4. The instructor collects and computes the average for each. Writes on the board.
     5. Call for arbitrageurs: a student can volunteer to be the arbitrageur. They get 10 minutes to work.
     6. The arbitrageur must:
          a) Identify a logical relation between two or more propositions (e.g., P entails Q, or P and Q are equivalent).
          b) Check if the aggregate probabilities violate probability laws given that relation.
          c) Design a set of bets that guarantees a profit no matter what the truth values are.
     7. The arbitrageur presents the logical argument to the instructor. The instructor verifies the logic (without revealing truth values).
     8. The arbitrageur announces the bets: which bets they are making and at what odds (which are the aggregate probabilities).
     9. The bets are executed with the class pool. The class pool is the sum of all students' tokens (1200). The arbitrageur will interact with the class pool.
     10. After the bets are placed, the instructor opens the sealed envelope and reveals the truth values.
     11. The bets are settled.
     12. The class pool is reduced (or increased) by the settlement. The remaining tokens are divided equally among the 12 students (including the arbitrageur). The arbitrageur also has their own profit from the bets.

