     Now, the two common student arguments:

     Argument 1: "I wasn't uncertain, I just hadn't done the calculation yet."

          Response: Bayesianism typically requires that your credences be coherent at every moment, even when you haven't done a calculation. The fact that you haven't done the calculation doesn't absolve you from the requirement of logical omniscience in the ideal. But we are not logically omniscient. The point is that the Bayesian norms seem to demand the impossible. So we need a Bayesianism that accounts for limited computational resources.

     Argument 2: "Thinking moves your credence without new evidence, so conditioning is broken."

          Response: Conditioning is about updating on new evidence. But when you do a computation, you are not getting new empirical evidence. You are deducing consequences of what you already know. So this is a different kind of updating, sometimes called "logical updating". Some Bayesians have tried to extend conditioning to handle logical uncertainty. But it's an open problem.

