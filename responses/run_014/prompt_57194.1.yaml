          5. P5: "1000001 is divisible by 7." -> false

     And a spare (if we want to replace one):
          6. P6: "1000001 is odd." -> true (since it's not even)

     But we have five.

     We can replace P5 with something else? Or keep as is.

     This should be enough.

     Let's hope the students don't know the factors of 1000001.

     Summary of the plan.
answer: |-
  Below is a complete betting game designed for your seminar, adhering to all your constraints and requirements. It targets the tension between Bayesian coherence and logical uncertainty, with a focus on non-obvious entailments and the computational cost of exploiting incoherence. The game fits within 90 minutes for 12 students, uses tokens for scoring, and includes mechanisms to handle common student objections during the debrief.

  ---

  ### **Game Overview: "The Logical Lottery"**
  **Core Idea**: Students assign credences (as probabilities) to 5 mathematical propositions with fixed but non-obvious answers. A volunteer "Arbitrageur" then exploits incoherent aggregate credences (e.g., violating \(P(A) \leq P(B)\) when \(A \models B\)) by designing a guaranteed-profit bet. Crucially, the Arbitrageur must first *prove the logical entailment* to the instructor, simulating the "work" required to spot arbitrage. The sealed answer key prevents retreats to indeterminacy.

  ---

  ### **Materials List**
  1. **Student Sheets**: 12 copies, each listing the 5 propositions (Table 1) and space to write probabilities.  
  2. **Answer Key**: In a sealed envelope, visible throughout.  
  3. **Tokens**: 1200 poker chips (100 per student), or use a ledger on the board.  
  4. **Aggregation Tools**: Whiteboard for averages, calculator.  
  5. **Timer**: For phases.  
  6. **Debrief Notes**: Key talking points (provided in debrief section).

  **Table 1: Propositions**  
  *(Answers fixed and pre-computed; entailments hidden)*  
  | Proposition | Statement                                                                 | Answer | Notes |
  |-------------|---------------------------------------------------------------------------|--------|-------|
  | P1          | The number 100,001 is prime.                                              | False  |       |
  | P2          | The number 100,001 is divisible by 11.                                    | True   |       |
  | P3          | The number 100,001 is divisible by 9,091.                                 | True   | P2 or P3 entail P4 (non-obvious) |
  | P4          | The number 100,001 is composite.                                          | True   | Equivalent to ¬P1 (non-obvious) |
  | P5          | The number 100,001 is divisible by 7.                                     | False  |       |

  **Answer Key Details**:
  - **P1**: False (100,001 = 11 × 9,091).  
  - **P2**: True (100,001 ÷ 11 = 9,091).  
  - **P3**: True (100,001 ÷ 9,091 = 11).  
  - **P4**: True (product of two primes).  
  - **P5**: False (100,001 ÷ 7 ≈ 14,285.857...).  
  - **Logical Relations**:  
    - P4 ≡ ¬P1 (if composite, not prime).  
    - P2 ⊨ P4 (divisibility by prime ≠ itself entails composite).  
    - P3 ⊨ P4 (same as above).  
  - *Instructor pre-computes these with pencil/paper (e.g., long division). On-the-spot resolution: e.g., "11 × 9,091 = 100,001? 11 × 9,000 = 99,000; 11 × 91 = 1,001; total 100,001. Yes."*

  **Why these propositions?**  
  - Non-trivial but resolvable: Requires arithmetic, not just intuition.  
  - Hidden entailments: Students rarely connect "divisible by prime" → "composite" for large numbers. P4 ≡ ¬P1 is often missed.  
  - Balanced: Mix of true/false to avoid bias.  

  ---

  ### **Rules and Timeline (90 Minutes Total)**  
  **Phase 1: Elicitation (15 min)**  
  - **0–5 min**: Intro without jargon. Distribute sheets. Instructions:  
    > *"Assign probabilities (0–1) to each proposition, representing your genuine belief in its truth. Use tokens to bet later. No devices!"*  
  - **5–15 min**: Students write probabilities privately. Example: Alice assigns P1: 0.3 (likely not prime), P2: 0.6 (maybe divisible?), P4: 0.8 (probably composite).  

  **Phase 2: Aggregation and Arbitrage Challenge (25 min)**  
  - **15–20 min**: Collect sheets. Compute/display aggregate credences (avg. for each P1–P5).  
    - *Example Aggregates*: P1: 0.25, P2: 0.55, P3: 0.45, P4: 0.70, P5: 0.40.  
  - **20–30 min**: **Arbitrageur volunteer** selected. Their task:  
    > *"Find a logical link between propositions (e.g., if A true, must B true?). Prove it to me. Then design bets using class averages to guarantee yourself token profit, no matter the answers."*  
    - **Work Phase (10 min)**: Arbitrageur scribbles proofs (e.g., "If P2 true, 100,001 ÷ 11 = integer, so it has factors → composite → P4 true. So P2 ⊨ P4").  
    - **Instructor Check**: Arbitrageur privately proves entailment. Instructor confirms validity *without* confirming truth values (e.g., "Yes, P2 ⊨ P4 holds logically").  
  - **30–35 min**: Arbitrageur announces bets (see *Exploitation Mechanics* below).  

  **Phase 3: Bet Execution and Settlement (15 min)**  
  - **35–40 min**: Execute bets between Arbitrageur and Class Pool (all tokens pooled).  
  - **40–45 min**: Open sealed envelope. Reveal answers. Settle bets.  
  - **45–50 min**: Redistribute Class Pool tokens to students (minus Arbitrageur’s winnings).  

  **Phase 4: Debrief and Discussion (40 min)**  
  - **50–90 min**: Guided discussion (see *Debrief Guide* below).  

  ---

  ### **Exploitation Mechanics**  
  **Token Economy**:  
  - Each student contributes 100 tokens to a Class Pool (1,200 total).  
  - Arbitrageur starts with 0 tokens (no contribution) but keeps winnings.  
  - After bets, Class Pool remainder split equally among students.  

  **Bet Design (Arbitrageur’s Toolkit)**:  
  - **Case 1 (Entailment, e.g., P2 ⊨ P4)**: If avg. P2 > avg. P4:  
    - Arbitrageur *sells* \$1 bet on P2 at price $avg(P2)$ (receives tokens upfront).  
    - Arbitrageur *buys* \$1 bet on P4 at price $avg(P4)$ (pays tokens upfront).  
    - **Net initial gain**: $avg(P2) - avg(P4)$.  
    - **Settlement**:  
      - If P2 true: P4 true (entailment), so Arbitrageur pays \$1 for P2 bet but receives \$1 for P4 bet → net \$0.  
      - If P2 false: No payout for P2. If P4 true, Arbitrageur gains \$1; if false, gains \$0.  
    - **Guaranteed profit**: At least $avg(P2) - avg(P4) > 0$ (since $P2 \models P4$ implies $P2$ false or $P4$ true).  
    - *Example*: If avg(P2)=0.55, avg(P4)=0.70, no arbitrage (0.55 < 0.70). But if avg(P2)=0.70, avg(P4)=0.55, gain $0.15$ tokens upfront + at least $0$ later.  

  - **Case 2 (Equivalence, e.g., P4 ≡ ¬P1)**: If avg(P1) + avg(P4) ≠ 1:  
    - If $avg(P1) + avg(P4) < 1$: Arbitrageur buys \$1 bets on both at total cost $avg(P1) + avg(P4)$. Since one must be true (P4 ≡ ¬P1), gains \$1 → profit $1 - (avg(P1) + avg(P4))$.  
    - If $avg(P1) + avg(P4) > 1$: Sells both bets for $avg(P1) + avg(P4)$, pays out max \$1 → profit $avg(P1) + avg(P4) - 1$.  
    - *Example*: If avg(P1)=0.25, avg(P4)=0.70, sum=0.95 < 1. Arbitrageur pays 0.95 tokens to buy bets, gains \$1 if P1 or P4 true → profit 0.05 tokens.  

  **Why this works**:  
  - Exploits $P(A) \leq P(B)$ violation for $A \models B$ or $P(A) + P(\neg A) \neq 1$.  
  - Arbitrageur’s "work" = proving entailment *before* betting (costs effort).  
  - Class loses tokens if aggregates incoherent.  

  ---

  ### **Debrief Guide (40 min)**  
  **Uncover the Moments** (Reveal gradually):  
  1. **Settlement (5 min)**: Highlight token losses. *"Why did the Class Pool shrink? Was there a ‘factual’ mistake?"*  
  2. **Logical Relations (10 min)**: Show P2 ⊨ P4 and P4 ≡ ¬P1. *"Did you spot these? Why not?"*  
  3. **Vocabulary Introduction (5 min)**: Name the problem:  
     > *"This is **logical omniscience** in Bayesianism: Coherence assumes free, instant knowledge of all logical truths. But you lacked it → incoherent credences → Dutch book. The Arbitrageur’s ‘work’ mirrors the cost of *gaining* logical knowledge."*  
  4. **Bayesian Tensions (20 min)**: Address objections:  
     - **Objection 1 (Uncertainty vs. Calculation)**:  
       > *"I wasn’t uncertain—I just hadn’t calculated yet!"*  
       **Response**: "Bayesian norms require coherence *now*, not post-calculation. But humans can’t instantly compute everything. So we need ‘bounded’ Bayesianism (e.g., resource-rational models) that discounts hard computations. Your credences were *about your current state*, not the math—that’s why they shifted when you saw the proof."  
     - **Objection 2 (Broken Conditioning)**:  
       > *"Thinking changed my credence without new evidence—conditioning is broken!"*  
       **Response**: "Conditioning handles empirical updates. **Logical updating** is different: You deduced consequences of existing knowledge (e.g., ‘P2 true → P4 true’). Some frameworks (e.g., *Jeffrey conditioning*) extend Bayesianism for this, but it’s unsolved. The takeaway: Bayesianism must account for *how* logical knowledge is acquired, not ignore it."  

  **Core Lessons**:  
  - Coherence assumes free logical omniscience → unrealistic for math/computation.  
  - Exploiting incoherence costs work → Dutch books aren’t "free" indictments.  
  - Bayesianism needs extensions (e.g., logical priors, bounded rationality).  

  ---

  ### **Limits and Mitigations**  
  **What the Game Distorts**:  
  1. **Group vs. Individual Coherence**:  
     - Dutch books target *individual* incoherence, but aggregates may misrepresent it (e.g., consistent individuals could aggregate incoherently).  
     - **Mitigation**: Stress this in debrief: "Real Dutch books exploit individuals. Here, the Class Pool simulates a single incoherent agent."  
  2. **Cost of Work**:  
     - Arbitrageur’s "work" is effortful but not token-costed (unlike real computational resources).  
     - **Mitigation**: Discuss: "If the proof took hours, would the arbitrage still be ‘fair’? Should coherence demands weaken for hard logic?"  
  3. **Risk of Obvious Entailments**:  
     - Students might spot P4 ≡ ¬P1 easily.  
     - **Mitigation**: Use large numbers (100,001) and primes to obscure links. Test propositions on peers first.  

  **If Short on Time (60-Minute Cutdown)**:  
  - Skip individual token redistribution (use a leaderboard).  
  - Shorten elicitation (10 min) and debrief (30 min).  
  - Use 3 propositions (P1, P2, P4) with P2 ⊨ P4 and P4 ≡ ¬P1.  

  ---

  ### **Why This Works**  
  - **Catches attention**: Students invest tokens → viscerally experience incoherence.  
  - **Answers pre-committed**: Sealed envelope blocks "no fact" retreats.  
  - **Forces work**: Arbitrageur can’t exploit without proving entailment.  
  - **Fits constraints**: All props resolvable by hand; no devices; 12 students; 90 min.  

  Run this, and when the room goes quiet at the revealed entailments, you’ll know it landed.
