answer: |-
  That's a brilliant dissection of a genuine philosophical problem. You've hit on a core issue in utilitarianism (and consequentialism more broadly) when confronted with infinite universes. Your friend is making a move that reveals a deep tension, and there are several ways to understand it:

  1.  **The Move Itself: Infinitarian Paralysis Escape Hatch (or Moral Particularism in the Face of Infinity)**
      *   **The Problem (Your Point):** Strict, unmodified total utilitarianism (maximize the *sum* of utility) suffers from **infinitarian paralysis** or the **problem of infinite utility** in an infinite universe with infinite (or unbounded above/below) good and bad. Finite actions become **incommensurable** – adding +X or +Y utility (where X and Y are finite) to an infinite sum results in the same cardinal value (infinity). The theory loses its ability to rank finite actions.
      *   **Your Friend's Move:** When confronted with this paralysis, your friend instinctively rejects the conclusion that actions don't matter. They appeal to moral intuition ("*obviously* we should still try"). This is effectively rejecting the *implication* of strict totalism under infinity without explicitly rejecting totalism itself or providing a modified principle. It's an **ad hoc exemption** driven by moral intuition.
      *   **Why it's problematic:** It's logically inconsistent *within their stated framework*. They haven't provided a *new* principle that *replaces* totalism or modifies it coherently for infinite contexts. They're relying on pre-theoretical moral certainty ("doing good is good") to override the mathematical consequence of their chosen theory. This move is sometimes criticized as **moral particularism run amok** – abandoning the general principle when it gives counterintuitive results, without offering a better general principle.

  2.  **The Principle They *Might* Be Reaching For (Implicitly):**
      Your friend's intuition points towards principles that *avoid* direct summation over the infinite whole. Here are the most plausible candidates:
      *   **Local Obligations / Moral Proximity:** Our primary moral duties are to beings we can *affect* and who are *spatiotemporally or causally proximate* to us. We should improve the welfare of those we encounter or can influence, regardless of the state of the infinitely distant universe. The "total" is irrelevant; what matters is the impact *here and now* on *this person* or *this group*. This aligns strongly with "making any particular person better off."
      *   **Set Density / Average Utility over Accessible Regions:** Instead of summing the infinite total, focus on increasing the *density* or *average* level of good (or decreasing bad) within the finite regions we can access or influence. Even if the universe is infinite, making *this* galaxy, or *this* planet, or *this* civilization happier *increases the proportion* of good within a significant local volume. This avoids direct comparison of infinities.
      *   **Causal Approachability / Affecting the Accessible Future:** Our actions matter because they affect the *causally accessible future* – the finite (or potentially infinite but *shaped by us*) portion of the universe that our actions can influence. We should maximize good (or minimize bad) within this accessible domain. The infinitely distant, causally disconnected past/present doesn't negate the importance of shaping *our* future light cone.
      *   **Deontology/Virtue Ethics Sneaking In:** Their "obviously" might stem from non-consequentialist intuitions: "Causing suffering is intrinsically wrong," "Promoting happiness is intrinsically right," or "Helping those in need is what a virtuous person does," *regardless* of net cosmic sums. They might be implicitly rejecting pure consequentialism when it clashes with these intuitions.

  3.  **What This Principle Commits You To:**
      If we take the "Local Obligations" or "Causal Approachability" principles as the best fit for their intuition:
      *   **Radical Context-Dependence:** Moral value is tied to the *context of agency*. What matters is the impact within the sphere of your potential influence. An action is good if it improves well-being *locally*, even if identical actions elsewhere (or the cosmic sum) render it insignificant mathematically.
      *   **Rejection of Cosmic Significance:** It explicitly rejects the idea that moral value is determined by an ultimate, cosmic sum-total. The "total" is either irrelevant or undefined for practical ethics.
      *   **Focus on Finite Scales:** Ethics operates on finite scales – individuals, communities, planets, civilizations, causally connected regions. Summing only happens over these finite domains.
      *   **"Making Particular People Better Off" IS Central:** This principle *directly* licenses making particular people better off within your sphere of influence as the core moral imperative. Your earlier objection that it's "not about making any particular person better off" might be where the disconnect lies; this principle says that *is* precisely what matters.
      *   **Potential for Parochialism:** It risks neglecting distant suffering/good if "local" is defined too narrowly (e.g., only humans, only contemporaries, only one planet).

  4.  **Where It Stops Applying (The Limits & Challenges):**
      *   **Prioritization Problems:** If you can help *either* Group A (100 people suffering horribly nearby) *or* Group B (10,000 people suffering slightly less horribly, but very far away/causally isolated), how do you decide? Pure locality might favor Group A, while a density view might favor Group B. The principle needs refinement to handle trade-offs between different finite domains.
      *   **Defining "Local" or "Accessible":** Where is the boundary? Our light cone expands at the speed of light. Does morality only apply within a certain radius? Only to beings we can currently interact with? What about future generations within our causal future? This is philosophically and practically messy.
      *   **Very Long-Term / Large-Scale Effects:** What about actions with small local effects but potentially massive long-term or large-scale consequences within the accessible future (e.g., preventing an extinction event vs. feeding 100 people today)? Does "local" include the long-term causal consequences?
      *   **Ignoring Distant Suffering?:** Does this principle imply we have *no* obligation to beings in distant galaxies, even if we somehow learned of intense suffering there and had a (hypothetical) way to help? Many find this counterintuitive.
      *   **Infinities Within Reach:** What if our actions *can* create or destroy *infinite* good/bad within our causal future (e.g., seeding galaxy-spanning civilizations or preventing them)? Does the paralysis problem re-emerge *locally*? Modified theories like "aggregation over finite sets" (density) or specific infinite ethics (like the causal approach of Bostrom or Vallentyne) try to handle this, but it's complex.

  **In Summary:**

  *   **The Move:** Your friend is escaping **Infinitarian Paralysis** via an **ad hoc appeal to moral intuition** ("obviously"), implicitly abandoning strict *cosmic* totalism without providing a coherent alternative principle.
  *   **The Implicit Principle:** Their intuition best aligns with **Local Obligations / Moral Proximity** or **Improving Set Density / the Accessible Future**. This makes the well-being of beings *within our sphere of influence* paramount, regardless of the infinite cosmic sum.
  *   **Commitments:** Context-dependent morality focused on finite impacts, rejection of cosmic summation as the source of value, central importance of helping particular individuals/groups we can affect.
  *   **Limits:** Difficulty defining "local/accessible," problems prioritizing between finite domains, potential parochialism, unresolved issues if our actions *can* cause infinite local effects.

  **What to Tell Your Friend:**

  "Look, when the math shows that adding finite good to an infinite total doesn't change the sum, and you say 'obviously we should still do it,' you're *right* that the conclusion feels wrong. But that feeling means you're rejecting strict cosmic totalism in practice. You're likely relying on a different principle: that we have a duty to make things better *for the people we can actually affect*, right here and now, regardless of the distant infinite universe. That's a coherent position – it's about **local obligations** or improving the **density of good in our accessible world**. But you need to own that principle explicitly! It means our focus shouldn't be the impossible cosmic sum, but the finite suffering and happiness within our reach. The challenge then becomes: how do we define 'our reach,' and how do we prioritize when we can help different groups?"

  This shifts the debate to the much more tractable (and interesting) question of *which* finite-scale ethical principle best captures our obligations, rather than banging heads against the wall of cosmic infinities.
