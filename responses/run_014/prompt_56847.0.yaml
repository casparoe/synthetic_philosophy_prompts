answer: |-
  ## Sestina for the Hinge  
  *(After a Year in the Room)*  

  Not the claim, but the **hand** that lifts the plane,  
  smoothing the oak. No question how to **step**  
  across this **ground** that holds the workshop floor.  
  The lock accepts the familiar **key**,  
  its turn unthought. The whetstone's steady **stone**  
  against the blade. The basin holds the **water**.  

  Cool **water** rinses sawdust from the **hand**.  
  The apprentice tests the edge against the **stone**,  
  a silent query. Watch the master **step**,  
  not to the shelf for rules, but take the **key**  
  that fits the chest where spare parts **ground**  
  old mechanisms. This is the **floor**  

  we build upon. Not the static **floor**,  
  but the swept surface cleansed with **water**,  
  the space prepared for work. This solid **ground**  
  beneath the bench? We trust the builder's **hand**,  
  the joist secured. The intricate clock’s **key**  
  winds springs unseen. A careful **step**  

  avoids the shavings. Even doubt must **step**  
  around the obvious, the trusted **floor**,  
  the known resistance turning with the **key**.  
  It cannot drink the basin’s **water**  
  nor think the tool suspended by no **hand**.  
  Its weight requires this taken **ground**.  

  No bedrock underneath, just shifting **ground**  
  that holds us now. The sceptic takes a **step**  
  towards the door, demanding proof the **hand**  
  won't vanish. Yet he leans against the **floor**,  
  still breathing air, still blinking. Cold **water**  
  splashed wouldn't answer. Where's the missing **key**?

  Is certainty the turn, the turning **key**,  
  or the lock shaped by use? This common **ground**  
  is worn by feet, not axioms. The **water**  
  reflects the rafters. Every practiced **step**  
  belongs to patterns laid before this **floor**,  
  to generations shaping with the **hand**.  

  This weathered **stone**, smoothed by the **hand** and **water**,  
  marks time, not truth. The riverbed will **step**  
  aside. New silt becomes the settled **ground**,  
  the changed **floor** where the future turns its **key**.  

  ---

  **End Words & Rotation:**  
  hand / step / ground / key / stone / water  
  water / hand / stone / step / key / ground  
  ground / water / key / hand / step / stone  
  stone / ground / step / water / hand / key  
  key / stone / hand / ground / water / step  
  step / key / water / stone / ground / hand  
  (Envoi: stone / hand / water / step / ground / key / floor)  

  **Structural Analogy:** The sestina's strict, unspoken rotation of end-words embodies the hinge-as-verb. The words (hand, step, ground, key, stone, water) are concrete tools or elements. Their shifting syntactic roles force them to *act* differently each stanza ("ground" as earth, electrical earth, basis; "step" as movement, stage, avoiding; "key" as tool, solution, map reference; "stone" as weight, sharpener, test; "water" as element, flow, time; "hand" as limb, action, skill). The rule is never questioned within the poem, enabling varied expression – just as hinges enable language-games through use, not assertion.

  **Content Alignment:**  
  - **Hinges as Verbs/Actions:** The poem depicts *using* a plane, *stepping*, *turning* a key, *testing* an edge, *sweeping* a floor. Moore's "hand" demonstration becomes the *act* of planing wood or testing a blade.  
  - **Background for Doubt:** The sceptic appears (stanza 5), but his doubt is idle – he still leans on the floor, breathes air. Doubt depends on the unchallenged ground it tries to question.  
  - **Communal/Historical:** The workshop setting implies inherited skill ("generations shaping with the hand"), shared tools ("common ground... worn by feet"), and practice ("patterns laid before this floor").  
  - **Justification Ending in Action:** When the apprentice tests the blade (stanza 2), the response isn't argument but *continuing work* – reaching for a key, avoiding shavings.  
  - **No Foundationalism:** The "ground" shifts; the riverbed moves (envoi). Certainty is the "space prepared for work," not bedrock.  
  - **Envoi as Riverbed:** The final tercet explicitly states the riverbed ("ground") shifts ("step aside"), silt becomes new floor, yet action continues ("future turns its key"). The water (actions, language) flows over the changing bed.  
  - **No Quotation:** Wittgensteinian concepts (hinges, riverbed, justification ending) are enacted or paraphrased, never quoted.  
  - **Syllables:** Lines consistently 10-11 syllables, unrhymed.

  The poem aims to make the hinge-as-action flicker through the relentless, unquestioned rotation of concrete words within a communal scene of inherited practice, where doubt remains possible only against a background of unspoken, active certainty. The envoi’s moving riverbed crystallizes the non-foundational, dynamic nature of what "stands fast."
