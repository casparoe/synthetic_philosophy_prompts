prompt: |-
  Hey — I'm a journalist who covers the science beat, and I'm working on a longread about the evolutionary psychology wars. I've been reporting on this for a while and I've sort of accumulated a set of views, but I've never actually checked whether they're consistent with each other. Before I write this piece I want someone to audit my position. Here's where I've landed:

  (1) The adaptationist program — the approach of assuming a psychological trait is an adaptation and then working backwards to figure out the selection pressures that shaped it — is a legitimate and productive research strategy. You've got to start somewhere, and reverse-engineering is how you generate testable hypotheses.

  (2) That said, I think a very large fraction of specific evolutionary psychology hypotheses — the stuff about mate preferences, cheater-detection modules, waist-to-hip ratio preferences, sex differences in jealousy — are basically just-so stories. They're underdetermined by the available evidence and often formulated in ways that make them unfalsifiable in practice.

  (3) Evolutionary psychology should be held to exactly the same epistemic standards as other historical sciences like paleontology, geology, or cosmology. No special skepticism, but also no special pleading.

  (4) When an evolutionary hypothesis makes a surprising, non-obvious prediction that gets confirmed empirically, that's strong evidence for it. This is how historical sciences make progress, and evo psych should be no different.

  (5) The charge that evolutionary psychology rationalizes the status quo or provides scientific cover for regressive politics is a political objection, not an epistemic one. It shouldn't affect our assessment of whether the science is good science.

  (6) Cross-cultural consistency of a psychological trait is decent evidence that it has an evolved basis, but it's not decisive — convergent cultural evolution can produce similar patterns independently.

  (7) The reverse-engineering approach — inferring ancestral selection pressures from the structure of present-day psychological mechanisms — can yield genuine knowledge even when we don't have independant evidence about ancestral environments. The design of the mechanism itself tells you something about what it was designed for.

  Go through these and tell me which pairs are genuinely in tension and which only look like they are. Rank the real tensions by severity, and for each one say what the cheapest fix would be — which commitment I'd have to modify or drop, and what it would cost me. Don't just flag every pair; some of these sit together fine and I need to know which ones do. Keep it to 500 words max — I have a deadline.
reasoning: |-
  Okay, let me tackle this query systematically. The journalist has outlined seven distinct positions on evolutionary psychology and wants a consistency check before publishing. The core tension I immediately spot is between point 1 (defending adaptationist reverse-engineering) and point 2 (criticizing specific hypotheses as just-so stories). This seems fundamental because the methodology endorsed in point 1 often produces the kinds of hypotheses criticized in point 2.

  Looking deeper, point 4 (valuing confirmed predictions) actually provides the bridge between these positions. By emphasizing that hypotheses need testable predictions, it offers a criterion to distinguish legitimate reverse-engineering from mere storytelling. This suggests a refinement opportunity: the journalist could maintain both points by specifying that reverse-engineering is valid only when generating properly testable hypotheses.

  Another subtle tension exists between point 6 (cross-cultural consistency as evidence) and point 7 (reverse-engineering without environmental data). While not contradictory per se, overreliance on point 7 could lead to the just-so stories warned about in point 2. The cheapest fix here would be to add nuance - acknowledge that reverse-engineering gains strength when combined with independent evidence about ancestral environments.

  The other points appear largely compatible: point 3's call for consistent epistemic standards aligns with point 5's rejection of political objections to scientific evaluation. Point 6 and point 7 can coexist if framed as complementary rather than competing forms of evidence.

  For the most severe tension between points 1 and 2, the solution lies in stressing testability as the dividing line. This preserves the productive core of adaptationism while filtering out unsupported speculation. The cost is minimal - just clearer articulation of what makes reverse-engineering scientifically valid. The overall framework remains intact while becoming more defensible.
answer: |-
  Here's your consistency audit, ranked by severity of tension with suggested fixes:

  **Severe Tension: Points 1 & 2**  
  Your strongest endorsement (adaptationism as productive) clashes directly with your strongest critique (many specific hypotheses are just-so stories). This *is* resolvable but requires nuance.  
  **Cheapest Fix:** Modify Point 1 to explicitly demand **testability** as a core requirement: "The adaptationist program is legitimate *only if* it generates *testable, falsifiable hypotheses*." Cost: Softens your endorsement slightly but strengthens your critique in Point 2 by providing the key demarcation.

  **Moderate Tension: Points 6 & 7**  
  Point 6 cautions that cross-cultural consistency isn't decisive evidence for an evolved basis (due to convergent evolution). Point 7 asserts reverse-engineering *can* yield genuine knowledge *without* independent evidence about ancestral environments. Over-reliance on Point 7 risks creating the just-so stories you criticize in Point 2.  
  **Cheapest Fix:** Add a caveat to Point 7: "...can yield genuine knowledge, *though this is significantly strengthened when combined with independent evidence about ancestral environments or phylogeny.*" Cost: Weakens the strongest claim of Point 7 slightly but aligns it with the caution of Point 6 and strengthens your defense against Point 2 critiques.

  **Minor Tension/Clarification Needed: Point 4 & Point 2**  
  Point 4 (confirmed surprising predictions = strong evidence) is your key criterion for *avoiding* the just-so stories of Point 2. This is consistent *if* you argue that many specific evo psych hypotheses *fail* to meet this standard.  
  **Cheapest Fix:** Make this link explicit: Add to Point 2 or Point 4: "The prevalence of just-so stories (Point 2) highlights the critical importance of Point 4 – hypotheses *must* generate and pass tests of surprising predictions." Cost: Requires brief connective phrasing, no core change.

  **Compatible Pairs:**  
  *   **Points 3 & 5:** Holding evo psych to general historical science standards (3) directly supports dismissing purely political objections (5) as epistemically irrelevant.  
  *   **Points 4 & 1:** Point 4 (confirmed predictions) is *how* the adaptationist program (1) succeeds when done well.  
  *   **Points 6 & 2:** Point 6's caution about cross-cultural evidence is a *reason* specific hypotheses (2) can be underdetermined.  
  *   **Points 7 & 1:** Point 7 justifies the reverse-engineering core of Point 1 (though needs the fix above).

  **Summary Fixes:**  
  1.  **Anchor Point 1 in Testability.** (Resolves tension with Point 2, supports Point 4).
  2.  **Temper Point 7 with the need for corroboration.** (Resolves tension with Point 6, protects against Point 2 critique).
  3.  **Explicitly link Point 4 as the antidote to Point 2.** (Clarifies consistency).

  These modifications cost minimal wording changes but significantly strengthen the internal consistency and defensibility of your position by emphasizing **testability, prediction, and corroboration** as the safeguards against the just-so stories you rightly criticize. Your core framework remains intact.
