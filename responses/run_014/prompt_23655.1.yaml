answer: |-
  Your analysis identifies a **genuine and significant tension** between the moral residue account and the marginal principle. You've accurately captured the core conflict: one grounds supererogation in intrinsic *moral properties* (residue), while the other grounds it in extrinsic *contextual factors* (available alternatives). Here's a breakdown of the tension, potential objections/responses, and areas for refinement:

  ### Strengths of Your Analysis
  1.  **Clear Articulation of Tension:** You correctly identify the metaphysical grounding conflict. The residue account implies supererogation status is tied to the act's *moral quality* (generating residue), making it agent-neutral-ish. The marginal principle makes it entirely agent-relative and context-dependent.
  2.  **The "Goodness vs. Obligation" Problem:** You pinpoint a key challenge for the residue account: *If an act generates moral reasons for gratitude (or blame for omission), doesn't that imply it was morally good/required? Why isn't it obligatory?* This echoes the classic "Paradox of Supererogation" but applied specifically to the residue account.

  ### The Tension is Real - Why It's Problematic
  1.  **Divergent Groundings:** The accounts offer fundamentally different explanations for *why* an act is supererogatory:
      *   **Residue Account:** "It's supererogatory *because* it generates residue (a moral property)."
      *   **Marginal Principle:** "It's supererogatory *because* a significantly more demanding alternative was available (a non-moral fact about the situation)."
      Reconciling these requires explaining *why* residue arises only in contexts where more demanding alternatives exist, which the residue account itself doesn't provide.
  2.  **Marginal Principle Undermines Intrinsic Residue?** According to the marginal principle, the *same physical act* (e.g., donating $100) could be obligatory (if max effort) or supererogatory (if a $1000 donation was possible). The residue account struggles: Why would donating $100 generate gratitude/residual regret *only* in the context where $1000 was possible? What intrinsic moral property changes?

  ### Standard Objections & Responses You Might Consider
  1.  **Objection to Residue Account (Your Core Worry):** "Residue entails moral goodness/demand, so supererogation collapses into obligation."
      *   **Potential Response (Defending Residue):** Proponents (like David Heyd or Alfred Archer) argue residue *presupposes* optionality. Residue isn't a *demand*; it's a *response* to the *sacrifice* or *goodwill* displayed *given that it wasn't demanded*. Gratitude responds to the *voluntary going beyond*, not to an inherent goodness that *should* have been demanded. Blame for omission arises *because* the agent *could* have done significantly more *and* chose not to, not because the act itself was strictly required. The residue is conditional on optionality.
  2.  **Objection to Marginal Principle:** "It makes supererogation status too contingent and potentially arbitrary. Does jumping on a grenade stop being supererogatory if a slightly larger grenade appears?"
      *   **Potential Response:** Marginal principle defenders (drawing on classical economics or satisficing models) argue moral demandingness *is* inherently comparative. What counts as "significantly more demanding" needs careful definition to avoid arbitrariness (e.g., requiring disproportionate sacrifice, exceeding a baseline of reasonable expectation).
  3.  **Objection to Both/Reconciliation Attempt:** "Can't residue be *explained by* the marginal situation?"
      *   **Potential Reconciliation:** Perhaps the moral residue *arises precisely because* a more demanding alternative was available and *not chosen*. Gratitude is due *for* choosing the good option *when* a less demanding one was permissible. Regret/blame is appropriate *because* a significantly better option was possible and rejected. This makes the residue *context-sensitive* but still a genuine moral phenomenon. **This is the most promising reconciliation route.** You could argue the residue account *needs* the marginal principle to explain *when* residue arises, while the marginal principle *needs* the residue account to explain the *moral significance* of acting supererogatorily vs. merely permissibly.
  4.  **The "Blame" Component Problem:** Your residue definition includes "reason for blame if not performed." This is the most controversial element.
      *   **Objection:** Blame strongly suggests the omitted act was *wrong* (i.e., obligatory to perform). This directly contradicts supererogation's optionality. How can an omission be blamelessly optional *and* blameworthy?
      *   **Response/Refinement:** Many residue theorists (e.g., Mellema, Archer) focus on **regret** or **disappointment** rather than blame. Blame might be reserved for failures of minimal decency, not supererogation omission. *Refine your residue definition:* Consider specifying that the "blame" reason applies *only* if the omission also violated a minimal decency standard, or replace "blame" with "criticism," "disappointment," or "agent-regret" (regret focused on one's own choice, not necessarily implying wrongness to others). This weakens the "goodness→obligation" inference.

  ### Suggestions for Strengthening Your Draft
  1.  **Explicitly Address the Reconciliation Attempt:** Discuss the idea that residue might be *constituted by* or *emerge from* the context defined by the marginal principle (available alternatives). Evaluate its plausibility. Does it preserve the core insights of both accounts, or does it amount to abandoning the residue account's claim to intrinsic moral grounding?
  2.  **Refine the "Blame" Element:** Acknowledge its problematic nature and consider modifying the residue definition or offering a defense of how blame *could* be appropriate without implying obligation (e.g., blame for lack of beneficence *character*, not blame for violating a duty).
  3.  **Clarify "Morally Good":** Distinguish between "morally good" (praiseworthy, desirable) and "morally required" (obligatory, blameworthy for omission). The residue account clearly claims supererogatory acts are morally good. The tension lies in explaining why they aren't required *despite* being good and generating residue. Emphasize this distinction.
  4.  **Mention Key Proponents:** Briefly name philosophers associated with these views (e.g., Heyd, Urmson for marginal principle/satisficing; Mellema, Archer for residue accounts) to ground your discussion.
  5.  **State Your Stance:** After presenting the tension and responses, indicate whether you find the tension fatal, reconcilable, or requiring modification of one/both accounts.

  ### Conclusion
  Yes, the tension you identify is **real and significant**. It highlights a fundamental divide in how supererogation is understood: as an intrinsic moral category defined by responses like gratitude and regret, or as a relational category defined by the structure of available alternatives. The core challenge for the residue account is explaining why generating residue doesn't entail obligatoriness, while the marginal principle needs to explain the distinctive moral phenomenology (the residue) that it seemingly overlooks. Addressing the "blame" component and exploring the context-sensitive reconciliation are crucial next steps. Your draft effectively sets up this important philosophical problem.
