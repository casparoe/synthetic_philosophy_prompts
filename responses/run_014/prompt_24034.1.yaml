prompt: |-
  I'm teaching an upper-level philosophy of biology seminar and I'm writing the final, and I want one essay question on whether it's really right to call DNA a code -- the kind that forces students past the easy "it stores information, so yes" answer and onto the independence problem. In a genuine code the message is supposed to be seperable from the code, but the genetic code's own interpreter (ribosome, tRNAs, the aminoacyl-tRNA synthetases) is itself encoded in the genome, so the message isn't free-standing the way a code's message is. Please give me, in this order: (1) "The question" -- a single essay prompt, a couple of sentences, answerable in 90 minutes; (2) "Model answer" -- about 500 words; (3) "Marking scheme" -- the specific moves an A answer must make, the specific mistake that drops it to a B, and where the degeneracy point (61 codons mapping to 20 amino acids) fits, since students love to cite that redudancy as if it settles things and I want the scheme to say why it doesn't.
