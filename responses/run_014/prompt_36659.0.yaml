    Only animals that are self-aware (pass the mirror test or equivalent) are conscious. This is a form of HOT skepticism but focused on self-awareness.
  - **No** → This path is unexplored. You might hold a very restrictive view or require other evidence.

  ## Precautionary Principle Option
  At any point, if you are unsure, you can choose:  
  **Leaf H: Precautionary Principle Agnosticism**  
  We should treat animals as if they are conscious to avoid potential harm, even if we don't know for sure.

  ## Notes on the Tree
  - **Overlaps:** Both the liberal distribution (Leaf C) and panpsychism (Leaf B) can end up attributing consciousness to insects, but for different reasons.
  - **Unexplored Paths:** Some paths (like Node 6 -> No) may lead to combinations that are uncommon or require more refinement.
  - **Assumptions in the Tree:**
    1. We assume that infant consciousness is a starting point. If you said infants are not conscious, you are forced into HOT skepticism.
    2. The tree assumes that behavior (like pain behavior) is a key indicator, but some theories downplay behavior.
    3. The tree focuses on learning and pain behavior, but there are other criteria (e.g., neural correlates).
    4. The tree doesn't cover the possibility that consciousness might be graded (more in some animals, less in others) except in the graded gating view.
    5. The precautionary principle is an escape hatch but doesn't provide a positive verdict.

  Use this tree to reflect on your commitments, but remember it's a simplification. Happy discussing!
answer: |-
  Below is a decision tree designed to help participants navigate the distribution of consciousness question without relying on jargon. It uses 10 concrete, case-based branch nodes to guide users toward one of the key positions (or reveal inconsistencies). The tree avoids asking about abstract theories (e.g., "Are you a functionalist?") and instead focuses on intuitive judgments about real-world examples. Each branch is phrased accessibly (no prior philosophy background needed), and the tree ends with a reflection on its own assumptions.

  ---

  ### **The Consciousness Distribution Decision Tree**  
  *Answer the questions below based on your gut feelings about concrete cases. No philosophy jargon required!*

  #### **1. Infant Pain**  
  Human infants can’t describe their feelings, but they cry when injured and calm down when given painkillers. Do you think they feel *conscious pain*?  
  - **Yes** → Go to 2.  
  - **No** → Go to 3.  

  #### **2. Perfect Robot Test**  
  Suppose scientists build a robot that *behaves exactly like a conscious human*: it “screams” when harmed, avoids danger, and begs not to be shut down. Would it be conscious?  
  - **Yes** → Go to 4.  
  - **No** → Go to 5.  

  #### **3. Metacognition Mandate**  
  If an animal (e.g., a dog) can’t reflect on its own thoughts (e.g., “I know I’m in pain”), can it still be conscious of pain?  
  - **Yes** → You circled back! **Return to 1** (infants lack metacognition too).  
  - **No** → **Leaf A: Higher-Order Thought (HOT) Skepticism**  
    *Only animals with self-reflection/metacognition are conscious (e.g., great apes, dolphins, corvids). Infants and most animals aren’t.*  

  #### **4. Insect Learning**  
  Bees can learn new tasks (e.g., navigating mazes) flexibly, but some scientists say this is “just” automatic gating (like a spam filter). Does this flexibility imply consciousness?  
  - **Yes** → Go to 6.  
  - **No** → Go to 7.  

  #### **5. Octopus Pain Behavior**  
  An octopus avoids a place where it was shocked, and painkillers reduce this avoidance. Is this evidence of *conscious* pain (not just reflexes)?  
  - **Yes** → Go to 8.  
  - **No** → Go to 9.  

  #### **6. Plant Sensitivity**  
  Plants react to damage (e.g., closing leaves) and some even “learn” (e.g., Venus flytraps remember touches). Could this mean they’re conscious?  
  - **Yes** → **Leaf B: Panpsychism/Liberal-Plus**  
    *Consciousness is everywhere (plants, microbes, etc.), or at least in all living things. Robots might qualify too.*  
  - **No** → **Leaf C: Liberal Distribution**  
    *Consciousness starts at insects/arthropods (bees, ants) due to flexible behavior. Not plants or microbes.*  

  #### **7. Crustacean Suffering**  
  Crabs abandon a preferred shelter after shocks and avoid it for weeks. Painkillers reduce this. Does this prove conscious suffering?  
  - **Yes** → **Leaf D: Graded Gating/Census View**  
    *Sentience requires flexible attention (not just learning). Starts at crustaceans/cephalopods, not insects.*  
  - **No** → Go to 10.  

  #### **8. Brainless Awareness**  
  Jellyfish (no brain) avoid obstacles and hunt, but can’t learn new tricks. Could they be conscious?  
  - **Yes** → **Leaf B: Panpsychism/Liberal-Plus** (same as above).  
  - **No** → **Leaf E: Nervous System Essential**  
    *Consciousness requires a brain or complex nerves. Starts at fish/cephalopods, not jellyfish.*  

  #### **9. Mirror Recognition**  
  If an animal (e.g., a magpie) passes the “mirror test” (touches a mark on its body while looking in a mirror), does that prove self-consciousness?  
  - **Yes** → **Leaf A: HOT Skepticism** (same as above).  
  - **No** → Go to 10.  

  #### **10. Uncertainty Rule**  
  Even if evidence is inconclusive (e.g., for insects or fish), should we treat an animal as conscious *to avoid potential harm*?  
  - **Yes** → **Leaf F: Precautionary Agnosticism**  
    *We shouldn’t claim certainty but should act as if crabs/insects are conscious to prevent suffering.*  
  - **No** → **Leaf G: Vertebrate-Centric View**  
    *Consciousness likely starts at vertebrates (fish, amphibians, etc.) due to brain similarity. Invertebrates are “too simple.”*  

  ---

  ### **Key Leaves (Final Positions)**  
  - **Leaf A: HOT Skepticism** (requires metacognition).  
  - **Leaf B: Panpsychism/Liberal-Plus** (all life/robots or minimal consciousness everywhere).  
  - **Leaf C: Liberal Distribution** (insects+ conscious via flexible behavior).  
  - **Leaf D: Graded Gating/Census View** (sentience starts at crustaceans/cephalopods).  
  - **Leaf E: Nervous System Essential** (brain/nerves required; starts at fish/octopuses).  
  - **Leaf F: Precautionary Agnosticism** (act as if they’re conscious without certainty).  
  - **Leaf G: Vertebrate-Centric** (consciousness starts at vertebrates).  

  ### **Notes on the Tree**  
  - **Overlaps**:  
    - **Leaf B (Panpsychism) and Leaf C (Liberal)** both extend to insects, but for different reasons (B is theory-based; C is behavior-based). The tree can’t fully separate them.  
    - **Leaf A (HOT) and Leaf G (Vertebrate-Centric)** often align but not always (e.g., HOT includes magpies; Vertebrate excludes octopuses).  
  - **Incoherent/Unattractive Paths**:  
    - Saying **“No” to Infant Pain (1) → Yes to Metacognition (3)** lands at HOT, but **“No” to Infant Pain → No to Metacognition** loops back—this is *incoherent* (infants must be conscious or not; no middle ground).  
    - **“No” to Octopus Pain (5) → No to Mirror Test (9) → No to Precaution (10)** leads to Vertebrate-Centric, but it’s *unattractive* to many—it ignores octopus/crab evidence without offering alternatives.  
  - **Unexplored Paths**:  
    - **“No” to Robot (2) → No to Octopus Pain (5) → Yes to Mirror Test (9)** lands at HOT, but skipping octopus evidence is rare and *under-explored*.  

  ### **Where This Tree Sneaks In Assumptions**  
  1. **Behavior as Evidence**: The tree assumes behavior (e.g., pain responses) is relevant to consciousness. If you think consciousness is *entirely* hidden (e.g., a “philosophical zombie” could act conscious), you’ll hit dead ends.  
  2. **Human-Centric Starting Point**: Beginning with infants assumes humans are the “benchmark.” If you reject this, the tree might frustrate you.  
  3. **Binary Choices**: Reality isn’t always yes/no (e.g., “graded consciousness” isn’t a leaf). The tree forces clarity at the cost of nuance.  
  4. **Science-Led**: It prioritizes empirical evidence (learning, pain behavior) over pure intuition. If you distrust science, you’ll resist branches like 4 or 7.  

  ---

  ### **How to Use This**  
  Hand out copies at your event. Encourage people to work through it individually, then discuss where they landed and why. The "snack guy" should find it approachable—no terms like "functional gating" appear, just crabs, bees, and robots. The end note lets the group critique the tree itself, shifting focus from "who's right" to "what are we assuming?" This should spark lively debate without devolving into "dogs are obvious." Enjoy!
