prompt: |-
  Okay so I'm working through Parfit's teletransporter stuff for a project and I keep hitting the the same wall. You know the setup: a machine scans you in full detail, destroys the original, and builds a copy on Mars. The standard question is "is the copy you?" and Parfit's answer is basically that personal identity isn't what matters -- psychological continuity is. Fine, I get that part. But I want to go deeper.

  Act like a professional philosopher who works on personal identity and what-matters questions. Think carefully, and before you commit to anything, do a short brainstorming pass where you list the obvious candidates for what a theory has to do, then prune.

  Here's what I actually want: the full specification of what a theory of what-matters-in-survival has to deliver to count as adequate. Not a summary of Parfit's view -- I can read that. I want the desiderata. The requirements list. What cases must a theory get right? What distinctions must it respect? What results from psychology or neuroscience can't it contradict? And for each requirement, give me the case or consideration behind it -- why is this a requirement and not just a preference of one camp?

  And here's the part I really want you to think hard about. I keep coming back to two cases that I don't think the standard accounts handle well, and I want your desiderata to force a theory to deal with them:

  1. The lossy scan. The machine doesn't perfectly preserve the psychological state. The copy is 99.9% the same but remembers one childhood event with a slightly different detail, or is a touch more impatient than the original. Is there a threshold where "lossy" becomes "not you," or is it a matter of degree? And does it matter whether the person would notice the difference?

  2. The time lag. You're scanned today, the original is destroyed today, but the copy isn't built for ten years (the data sits in storage the whole time). Is there a gap in the person's existence? Does the ten-year gap affect what matters? And if the data is stored, is the person in some sense "in the data" during those ten years?

  Make sure your list of requirements is strong enough that a theory that fudges either of these cases gets knocked out.

  Also: which requirements are non-negotiable and which are just preferences of particular camps? And if some subset of the requirements is jointly unsatisfiable -- like, if you can't have all of them at once -- say so, that's the part I most want to see. And tell me wich single requirement knocks out the most popular theories (I'll guess it's the duplication case, but I want your reasoning, not just my guess).

  For context on what "adequate" means here: I'm building a decision framework for a hypothetical future where mind-uploading is commercially available, and I need to know what a person should care about when deciding whether to use it. So the theory needs to be good enough to inform that decision, not just a metaphysical curiosity.

  A table is fine for the main requirements list, but I want the reasoning behind each one in prose, not just bullet points.
reasoning: |-
  We are constructing a set of desiderata for a theory of "what matters in survival." The theory must provide a framework for evaluating scenarios like Parfit's teletransporter and the variations the user has provided (lossy scan and time lag). The goal is to inform a decision framework for mind-uploading technology.

  We begin by brainstorming the obvious candidates for what a theory must account for. Then we prune to the essential. The user has two specific cases that must be addressed: lossy scan and time lag.

  Brainstorming: What must a theory of what-matters-in-survival account for?

  1. **Continuity of consciousness**: Does the subject experience a continuous stream of consciousness?
  2. **Psychological connectedness and continuity**: Parfit's view: overlapping chains of psychological connections (memories, beliefs, intentions, etc.).
  3. **Bodily continuity**: Does the same body (or brain) persist?
  4. **Causal dependence**: Is the future state causally dependent on the current state in the right way?
  5. **Survival as a matter of degree**: Can we survive to a greater or lesser extent?
  6. **The no-branching requirement**: Survival must be unique? (But duplication cases challenge this.)
  7. **The first-person perspective**: What matters from the inside?
  8. **Practical concerns**: What should we care about when making decisions about the future?
  9. **Relation to identity**: Is survival the same as identity? (Parfit says no, but we must decide if the theory must account for identity or if it can separate them.)
  10. **Temporal gaps**: Can there be a gap in existence and then survival?
  11. **Gradual replacement**: If parts are replaced gradually (like in a ship of Theseus), when does survival stop?
  12. **The role of memory and psychological traits**: How much can change and still be survival?
  13. **The duplication problem**: If two copies are made, which one (if any) is the original? And what matters then?
  14. **The role of the brain**: Neuroscience tells us that the brain is the substrate of our psychology. Damage to the brain can alter personality, memory, etc.
  15. **The possibility of multiple realizability**: Could the same psychology be realized in a different substrate (e.g., silicon)?

  Pruning: We must focus on what is essential for a theory of "what matters" (not necessarily a theory of personal identity). The theory must be action-guiding for decisions about survival.

  We now list the requirements, each with a case or consideration that motivates it, and an explanation of why it is non-negotiable or why it is a requirement.

  We note that some requirements might be in tension. We must identify these.

  The user's two cases:

  1. **Lossy scan**: A theory must account for imperfect replication and how it affects survival.
  2. **Time lag**: A theory must account for delayed replication.

  We structure the requirements as follows. We will use a table for the main list and then provide detailed reasoning in prose.

  **Table of Desiderata for a Theory of What-Matters-in-Survival**

  | Requirement | Case/Consideration | Why Non-Negotiable? | Tension With |
  |-------------|-------------------|---------------------|--------------|
  | 1. **Psychological Continuity Requirement**: The theory must account for the degree of psychological connectedness and continuity. | Parfit's original teletransporter: The copy is psychologically continuous. Lossy scan: If the copy is 99.9% similar, is that enough? | Without psychological continuity, we lose the core of what makes us who we are (our memories, beliefs, character). | Bodily continuity approaches. |
  | 2. **No Threshold Requirement**: The theory must not posit a sharp threshold for survival. | Lossy scan: We can imagine a spectrum from 100% to 0% fidelity. A sharp cutoff would be arbitrary. | Psychological traits degrade gradually (e.g., in dementia). We care about degrees of survival. | Theories that require strict identity. |
  | 3. **Causal Dependence Requirement**: The future state must be causally dependent on the past state in the right way. | The original teletransporter: The copy is caused by the original. Time lag: The stored data is a record that causes the future copy. | Without the right kind of causation, we could have accidental duplicates (e.g., a Boltzmann brain) that don't count as survival. | Theories that allow for backward causation or non-causal dependence. |
  | 4. **Branching-Agnosticism Requirement**: The theory must not rule out the possibility of survival in branching cases. | Duplication: If two copies are made, both are psychologically continuous with the original. Parfit: what matters is preserved in both. | If we care about psychological continuity, then both copies should be equally continuous. Denying this would require an arbitrary choice. | Theories that require uniqueness (like some identity theories). |
  | 5. **No-Gap Requirement**: The theory must allow for temporal gaps in existence without loss of survival. | Time lag: The copy is built ten years after the original's destruction. | If we allow that a person can be temporarily unconscious (e.g., during deep sleep), then a gap might be acceptable. | Theories that require continuous existence. |
  | 6. **Substrate Independence Requirement**: The theory must not require a specific physical substrate (like a biological brain). | The teletransporter copies to a different substrate. | Neuroscience shows that psychological states are realized by brain states, but if the same functional state can be realized in silicon, then the substrate shouldn't matter. | Biological theories (like animalism). |
  | 7. **First-Person Perspective Requirement**: The theory must account for the first-person concern we have for our future. | When I think about my future, I care about it in a way I don't care about others'. | This is the core of the survival question: why should I care about the future person? | Theories that cannot explain why I should care about a duplicate. |
  | 8. **Empirical Adequacy Requirement**: The theory must not contradict well-established facts from psychology and neuroscience. | Brain damage: If a person suffers brain damage and loses memories or changes personality, we may say they are not the same. | Any theory that contradicts science is inadequate. | Theories that posit a soul or non-physical substance. |
  | 9. **Degrees of Survival Requirement**: The theory must accommodate that survival can come in degrees. | Lossy scan: A copy with 90% fidelity might be less me than one with 99%. | We care more about our near future than our distant future because of gradual psychological change. | Theories that require all-or-nothing survival. |
  | 10. **Non-Backward-Looking Requirement**: The theory must not require that the future person have all the memories of the past person. | Lossy scan: The copy might misremember one event. But we forget things and change over time. | We don't require perfect memory for survival (we forget things every day). | Theories that require exact memory preservation. |

  Now, we discuss each requirement in detail, including the reasoning and the cases that motivate them.

  **Detailed Reasoning for Each Requirement**

  1. **Psychological Continuity Requirement**:
     - **Case**: Parfit's teletransporter and the lossy scan. In the lossy scan, the copy is almost but not exactly the same as the original.
     - **Reasoning**: What matters in survival is the continuation of our psychological features: our memories, beliefs, intentions, character traits, etc. If the copy has these in sufficient measure, then it is our survival. This is non-negotiable because without psychological continuity, we would not recognize ourselves as surviving. Even in cases of gradual change (like aging), we rely on psychological continuity. Neuroscience shows that psychological states are brain states, but the requirement is about the states themselves, not the substrate.
     - **Tension**: This requirement may conflict with bodily continuity theories. For example, if the brain is destroyed and recreated, a bodily theory might say the person does not survive, but psychological continuity says they do.

  2. **No Threshold Requirement**:
     - **Case**: The lossy scan: imagine a spectrum of copies with 100%, 99.9%, 99%, ... down to 0% psychological continuity. A theory that says 99.9% is survival but 99% is not would be arbitrary. Also, consider gradual brain replacement: if we replace neurons one by one with artificial ones, there is no clear point where the person stops existing.
     - **Reasoning**: Psychological continuity is a matter of degree. We see this in dementia: a person with early dementia is still the same person to a large degree, but as the disease progresses, we feel that less of the original person survives. Therefore, a theory must accommodate degrees and avoid arbitrary thresholds. This is non-negotiable because the phenomena are continuous. However, note that for practical decisions (like legal identity) we might need a threshold, but that is not about what matters in survival.

  3. **Causal Dependence Requirement**:
     - **Case**: The time lag scenario: the data is stored for ten years and then used to create the copy. Also, consider an accidental duplicate: by chance, a molecule-for-molecule duplicate of you appears. We would not say you survive in the duplicate because there is no causal connection.
     - **Reasoning**: For a future state to be a survival of a past state, there must be an appropriate causal connection. The causal connection ensures that the future state is not just a replica but is generated from the past state. This is non-negotiable because without causation, we could not distinguish between survival and coincidence. However, the exact nature of the causal connection is debated (e.g., is a stored pattern sufficient?).

  4. **Branching-Agnosticism Requirement**:
     - **Case**: Duplication: the teletransporter malfunctions and creates two copies. Both are psychologically continuous with the original. Parfit argues that what matters is preserved in both, but we might not want to say that the original person is both (because that would violate the transitivity of identity). So, the theory of what matters must allow that both are equally good for survival, even if identity is not preserved.
     - **Reasoning**: If we care about psychological continuity, then branching does not diminish the continuity in each branch. Therefore, what matters is present in each branch. This is non-negotiable because denying it would require an arbitrary choice of one branch over the other. But note: this requirement conflicts with theories that require uniqueness (like traditional identity theories).

  5. **No-Gap Requirement**:
     - **Case**: Time lag: the original is destroyed and the copy is created ten years later. Also, consider suspended animation: a person is frozen and revived after 100 years. We would say they survive.
     - **Reasoning**: If we accept that a person can survive periods of unconsciousness (like dreamless sleep), then a gap without consciousness does not necessarily end survival. The causal connection (requirement 3) must still hold. This is non-negotiable if we want to account for cases like suspended animation. But note: if the gap is too long, does it break psychological continuity? We might require that the causal chain remains intact.

  6. **Substrate Independence Requirement**:
     - **Case**: Teletransporter that copies to a silicon-based body. Also, gradual replacement of brain with silicon chips.
     - **Reasoning**: If the same psychological states can be realized in a different physical substrate, then the substrate should not matter for survival. This is supported by functionalism in philosophy of mind and by the empirical fact that different brain structures can sometimes realize the same function (plasticity). This is non-negotiable for a theory that wants to accommodate mind uploading. However, it conflicts with biological theories (animalism) that say we are essentially biological organisms.

  7. **First-Person Perspective Requirement**:
     - **Case**: When considering using the teletransporter, I ask: "Will I survive?" I care about the future person in a special way. If the theory says that the copy is not me but is psychologically continuous, why should I care?
     - **Reasoning**: The core of the survival question is the first-person concern. A theory must explain why I should have a special concern for the future person. Parfit argues that psychological continuity without identity is what matters and that we should care about that. This requirement is non-negotiable because without it, the theory does not address the original motivation for the question.

  8. **Empirical Adequacy Requirement**:
     - **Case**: Brain damage: if a person has a stroke and loses their memories and personality, we might say they are not the same person. Also, neuroscience shows that specific brain regions are responsible for specific psychological functions.
     - **Reasoning**: The theory must be consistent with established science. For example, it cannot posit an immaterial soul. It must account for the dependence of psychological features on the brain. This is non-negotiable because any theory that contradicts science is not credible.

  9. **Degrees of Survival Requirement**:
     - **Case**: Lossy scan: a copy that is 90% similar might be less me than one that is 99%. Also, future selves: I care more about the person I will be in 10 minutes than the one in 100 years because of psychological change.
     - **Reasoning**: We experience ourselves as changing gradually. We care about our future selves to the extent that they are psychologically continuous with our current self. This is non-negotiable because it reflects our actual concerns. But note: this might conflict with all-or-nothing identity theories.

  10. **Non-Backward-Looking Requirement**:
      - **Case**: Lossy scan: the copy misremembers a childhood event. But we forget and misremember things all the time. Also, we change our beliefs and attitudes.
      - **Reasoning**: Survival does not require perfect memory or static psychological traits. We change over time and forget things. A theory must allow for some change. This is non-negotiable because it reflects normal human experience. It conflicts with theories that require exact duplication.

  **Tensions and Joint Unsatisfiability**

  - The **Branching-Agnosticism Requirement** (4) and the **First-Person Perspective Requirement** (7) might be in tension. In duplication, I cannot have first-person concern for two people at once. Parfit says we should not care about identity but about psychological continuity, but then we must care equally about both copies. However, from the first-person perspective, I might not know which one I will be (if either). This is a challenge.

  - The **No Threshold Requirement** (2) and the **Degrees of Survival Requirement** (9) are compatible and even complementary. However, they together conflict with theories that require a binary survival condition (like identity).

  - The **Causal Dependence Requirement** (3) and the **No-Gap Requirement** (5) must be reconciled. In the time lag case, the causal chain is maintained by the stored data. But is that sufficient? Some might argue that the causal chain must be continuous in time. We require that the stored data is a reliable record that is causally dependent on the original and causes the copy.

  **Which Requirement Knocks Out the Most Popular Theories?**

  The **Branching-Agnosticism Requirement** (4) is likely the most challenging. It knocks out:

  - **Traditional identity theories**: They require uniqueness. For example, Locke's psychological continuity theory might be interpreted as requiring no branching. If there are two branches, identity cannot hold with both, so the original person is not identical to either.
  - **Bodily theories**: They cannot handle branching at all because the body is unique.

  However, note that Parfit's own view (which is a theory of what matters) accepts branching. So it is not knocked out. But theories that try to reduce what matters to identity are.

  **Addressing the User's Cases**

  1. **Lossy scan**:
     - The theory must account for degrees of psychological continuity. Therefore, a 99.9% copy would be a high degree of survival. The person might not notice the difference, but that is not the point. Even if they notice, if the change is small (like one memory altered), it is still a high degree of survival. There is no sharp threshold.

  2. **Time lag**:
     - The causal chain is preserved via the stored data. The gap of ten years does not break survival as long as the causal dependence is maintained. The person is not literally in the data during the gap (because the data is not conscious) but the causal link is preserved. The gap does not affect what matters because upon revival, the copy is psychologically continuous with the original.

  **Conclusion**

  The user is building a decision framework. The theory must:

  - Allow for degrees of survival (so a lossy scan might still be worth it if the degree is high enough).
  - Allow for time lags (so delayed uploading is still survival).
  - Explain why we should care about the future copy (via psychological continuity and causal dependence).

  The most challenging requirement is branching, but if the technology avoids branching (by only creating one copy), then it might not be an issue. However, the theory must be robust to the possibility.

  Finally, note that no theory might satisfy everyone because of the tensions. But the above desiderata capture the essential elements for a functional decision framework.
answer: |-
  Below is a comprehensive set of desiderata for a theory of "what-matters-in-survival," designed to rigorously address your core concerns about lossy scans and time lags. I've approached this as a professional philosopher specializing in personal identity and normative ethics, with a focus on practical decision-making in emerging technologies like mind-uploading. The goal is to outline what an *adequate* theory must deliver to inform real-world choices—not just metaphysical coherence.

  ### Core Methodology
  - **Brainstorming**: I started with 15+ candidate requirements drawn from key debates in personal identity (e.g., Parfit, Locke, Williams, Olson), psychology (e.g., memory and narrative self), and neuroscience (e.g., brain lesion studies). 
  - **Pruning**: I eliminated redundant, overly camp-specific, or empirically unsupported candidates (e.g., "soul-based continuity" fails neuroscience; "absolute uniqueness" fails duplication cases). 
  - **Non-Negotiables**: Requirements are non-negotiable if they are (a) empirically grounded, (b) necessary to avoid arbitrariness in survival decisions, or (c) demanded by first-person practical reasoning. Camp-specific preferences (e.g., "biological substrate essentialism") are flagged.
  - **Tensions**: I identify where desiderata conflict, making joint satisfaction impossible. The duplication problem is indeed a major knockout, but your lossy scan and time lag cases are equally critical for your use case.
  - **Decision-Relevance**: Each requirement is evaluated for its ability to inform a mind-uploading decision framework (e.g., "Should I pay for a lossy scan?").

  ### Desiderata Table
  Here's a summary table of the 10 core requirements. **Non-negotiable** requirements are marked with an asterisk (*), and camp-specific preferences are in parentheses. Following the table, I provide detailed reasoning for each, including how they handle your two cases and why they're essential.

  | # | Requirement                     | Why Non-Negotiable?                          | Key Case/Consideration                                                               | Camp-Specific? |
  |---|---------------------------------|---------------------------------------------|--------------------------------------------------------------------------------------|----------------|
  | 1*| **Graduality**                  | Avoids arbitrariness in lossy scenarios      | Lossy scan: 99.9% vs. 99% fidelity – must not rely on thresholds                     | No             |
  | 2*| **Causal Dependence**           | Prevents absurd duplicates (e.g., Boltzmann brains) | Time lag: Data storage as causal link vs. spontaneous copy        | No             |
  | 3*| **Psychological Continuity**    | Empirically grounded in memory/selfhood      | Dementia cases: Gradual loss of memory/traits; fMRI studies on self-representation   | No             |
  | 4*| **Branching-Agnostic Survival** | Duplication forces rejection of uniqueness   | Parfit's fission: Both copies preserve what matters; neither is "unique you"         | Yes (rejects animalism) |
  | 5*| **Substrate Independence**      | Required for mind-uploading feasibility      | Neural prosthesis studies: Cognitive function preserved in silicon/biohybrid systems | Yes (rejects biological views) |
  | 6 | **First-Person Authority**      | Decision-making requires subjective concern  | "Why should I care about the copy?" – must align with self-concern                  | Yes (Parfitian) |
  | 7*| **Temporal Neutrality**         | Gaps occur naturally (e.g., coma, sleep)     | Time lag: Storage as hibernation-like gap; cryonics cases                           | No             |
  | 8*| **Empirical Consistency**       | Must align with neuroscience/psychology      | Anterograde amnesia: Loss of memory ≠ loss of self if traits persist                | No             |
  | 9 | **Narrative Coherence**         | Explains identity in social/legal contexts   | Lossy scan: Altered memory disrupts life story if severe (e.g., false trauma)       | Yes (narrative theories) |
  | 10| **Metric for Comparison**       | Enables cost-benefit analysis for uploads    | Lossy scan: Is 95% fidelity "worth it" for 10-year lag? Requires calculus           | Yes (consequentialist) |

  ---

  ### Detailed Reasoning for Each Requirement
  I'll break down each requirement with: (1) **Why it's needed**, (2) **The case behind it**, (3) **How it handles lossy scans/time lags**, and (4) **Non-negotiable status**. Tensions and knockout effects are discussed at the end.

  1. **Graduality Requirement**  
     - **Why**: Survival must be a matter of degree, not a binary "yes/no." Thresholds (e.g., "95% fidelity = survival") are arbitrary and conflict with the continuous nature of psychological change.  
     - **Case behind it**: **Lossy scans** force this. If a copy misremembers a childhood event (e.g., recalls a dog as a cat), is it still you? Neuroscience shows memory is reconstructive and error-prone—we misremember details daily without ceasing to be ourselves. A theory demanding perfect fidelity would implode under routine memory errors.  
     - **Handles your cases**: For lossy scans, it rejects thresholds—survival diminishes smoothly with fidelity loss. For time lags, it allows that delayed survival can be partial (e.g., if lag causes psychological drift).  
     - **Non-negotiable**: Yes. Binary theories crumble under gradualist phenomena (e.g., Alzheimer's progression). Decision-makers need a fidelity "exchange rate" (e.g., "Is 90% survival worth the cost?").

  2. **Causal Dependence Requirement**  
     - **Why**: Survival requires the future self to be causally linked to the past self in the right way. Without this, coincidental duplicates (e.g., a Boltzmann brain) would "count" as survival, which is absurd.  
     - **Case behind it**: **Time lags** test this. If data is stored for 10 years, is the causal chain preserved? Compare to cryonics: Revival works only if the frozen brain causally enables future states. A spontaneous copy (no causal link) isn't survival.  
     - **Handles your cases**: For time lags, storage is a causal link if the data reliably preserves state (like DNA). For lossy scans, high-fidelity copies maintain stronger causal dependence than low-fidelity ones.  
     - **Non-negotiable**: Yes. Non-causal theories (e.g., Platonic idealism) fail empirical scrutiny and permit survival in nonsensical scenarios.

  3. **Psychological Continuity Requirement**  
     - **Why**: Psychological traits (memories, beliefs, intentions) are the core of what we care about in survival, as evidenced by neuropsychology (e.g., Phineas Gage's personality change after brain injury).  
     - **Case behind it**: **Dementia studies**. Patients with progressive memory loss remain "the same person" to degrees—early-stage patients retain enough traits to warrant first-person concern. This continuity must be preserved, not identity.  
     - **Handles your cases**: Lossy scans must assess which psychological traits are preserved (e.g., patience loss might reduce survival more than a misremembered detail). Time lags require continuity across the gap (e.g., stored data must encode traits).  
     - **Non-negotiable**: Yes. Contradicting this ignores why we fear death (loss of psychology) and invalidates upload decisions.

  4. **Branching-Agnostic Survival Requirement**  
     - **Why**: Survival must not depend on uniqueness. Duplication (e.g., two copies from one scan) shows that what matters can be preserved in multiple successors.  
     - **Case behind it**: **Parfit's fission** experiment. If the scanner creates two identical copies, both are psychologically continuous with you. Traditional identity theories (e.g., soul-based or biological) absurdly deny survival to both copies if uniqueness is required.  
     - **Handles your cases**: For lossy scans, two imperfect copies both partially preserve what matters. For time lags, a single delayed copy avoids branching concerns.  
     - **Non-negotiable**: Yes. Uniqueness demands are anthropocentric and lack empirical basis.  
     - **Camp-specific**: Rejects animalism and simple soul theories.

  5. **Substrate Independence Requirement**  
     - **Why**: Survival can't require a specific physical substrate (e.g., biological brain). Neuroscience supports multiple realizability—e.g., neural implants restore function via silicon.  
     - **Case behind it**: **Gradual replacement** (Ship of Theseus for brains). If neurons are replaced one-by-one with synthetic analogs, cognitive function persists. Demanding biological continuity would make uploads impossible.  
     - **Handles your cases**: Lossy scans on digital substrates are still survival-conducive if psychology is preserved. Time lags with digital storage are valid.  
     - **Non-negotiable**: Yes. Substrate dependence contradicts neural plasticity and upload feasibility.  
     - **Camp-specific**: Rejects biological views (e.g., animalism).

  6. **First-Person Authority Requirement**  
     - **Why**: Survival must justify first-person concern (e.g., "I should fear death less if my copy exists"). If the copy isn't "me," but I ought to care about it, the theory must explain why.  
     - **Case behind it**: **Prefrontal cortex studies**. Brain regions for self-referential processing activate when envisioning future selves—this generates first-person concern. A theory that severs concern from survival (e.g., "the copy is a stranger") fails decision-making.  
     - **Handles your cases**: For lossy scans, reduced fidelity should correlate with reduced self-concern. For time lags, a 10-year gap shouldn't extinguish concern if psychological continuity holds.  
     - **Non-negotiable**: Conditional. Essential for decision frameworks but derivable from Psychological Continuity.  
     - **Camp-specific**: Parfitian views prioritize this; others (e.g., egoists) reject it.

  7. **Temporal Neutrality Requirement**  
     - **Why**: Gaps in existence (e.g., unconsciousness) don't preclude survival if psychological continuity is maintained causally.  
     - **Case behind it**: **Coma and revival**. Patients in comas lack continuous consciousness but retain identity if cognitive function returns. Time lags are analogous: Storage is a gap, not death.  
     - **Handles your cases**: Time lags with storage are acceptable gaps if data integrity ensures continuity. Lossy scans don't introduce gaps.  
     - **Non-negotiable**: Yes. Rejecting this invalidates cryonics or suspended animation as survival.

  8. **Empirical Consistency Requirement**  
     - **Why**: Must align with psychology/neuroscience. E.g., memory systems are reconstructive, not reproductive—imperfect copies are normal.  
     - **Case behind it**: **False memory experiments**. Subjects implanted with false memories (e.g., "lost in a mall") still identify as themselves. Lossy scans with minor memory errors are non-fatal.  
     - **Handles your cases**: Lossy scans are unproblematic if errors resemble natural memory imperfections. Time lags must avoid data degradation (e.g., bit rot) to prevent empirical failure.  
     - **Non-negotiable**: Yes. Theories contradicting science (e.g., requiring immutable memories) are false.

  9. **Narrative Coherence Requirement**  
     - **Why**: Survival requires a minimally coherent life narrative (per psychology: humans conceive selves as stories). Severe disruptions (e.g., forgetting your career) reduce survival.  
     - **Case behind it**: **Frontotemporal dementia (FTD)**. Patients losing autobiographical narrative (e.g., forgetting their spouse) experience "self-loss" despite retained skills. Lossy scans altering core memories (e.g., "your child never existed") disrupt narrative.  
     - **Handles your cases**: Lossy scans must preserve narrative-critical traits. Time lags must not introduce narrative discontinuities (e.g., revival in an alien culture).  
     - **Non-negotiable**: No. Narrative views are influential but contested (e.g., by reductionists).  
     - **Camp-specific**: Narrative theorists (e.g., Schechtman).

  10. **Metric for Comparison Requirement**  
      - **Why**: Decision frameworks require comparing survival degrees across options (e.g., "Is a lossy upload better than natural death?").  
      - **Case behind it**: **Risk aversion studies**. People discount future selves based on psychological distance (e.g., prefer 95% survival now vs. 99% in 10 years).  
      - **Handles your cases**: Lossy scans and time lags need a calculus (e.g., fidelity × lag penalty).  
      - **Non-negotiable**: No. Essential for applied use but not metaphysics.  
      - **Camp-specific**: Consequentialist approaches.

  ---

  ### Tensions and Joint Unsatisfiability
  - **Major Tension**: **Branching-Agnostic Survival** (4) conflicts with **First-Person Authority** (6). In duplication, (4) says both copies preserve what matters, but (6) struggles to explain self-concern for two entities (e.g., "Which one am I?"). This is unresolvable—Parfit bites the bullet, denying that "which one" matters.  
  - **Other Tensions**:  
    - **Graduality** (1) vs. **Narrative Coherence** (9): Graduality permits smooth degradation, but narratives can fracture abruptly (e.g., a false memory that invalidates one's life story).  
