  First, I need to recall the frameworks they mentioned: Chalmers' verbal disputes, Hirsch's quantifier variance, and deflationism. The student says these don't fit. Chalmers involves ambiguity that, when resolved, ends the dispute. Here, disambiguation doesn't help because both sides use "exist" in the same sense but apply different standards. Hirsch's quantifier variance posits different meanings for quantifiers, leading to both being true in their own frameworks. But here, both sides share the same meaning but disagree on where the threshold is. Deflationism sees these disputes as shallow, but the participants treat them as substantive, even normative.

  So the core issue is a shared semantic understanding but divergent criteria for applying ontological terms. The disagreement is about what standards should be used to judge existence or identity, not about facts or word meanings. This sounds like a metaontological debate on criteria selection rather than a first-order ontological one.

  I remember terms like "ontological minimalism" vs. "robust realism," but those are positions, not the dispute type. The student needs a label for the dispute structure itself. Eli Hirsch talks about quantifier variance, but that's not it. Maybe Amie Thomasson's easy ontology? She thinks existence questions can be resolved by conceptual analysis, but here the parties disagree on that analysis. 

  What about "criterial variance"? That captures the idea of differing application standards. Or "metaontological criterion disagreement"? That's descriptive but a bit clunky. Carnap's linguistic frameworks come to mind, where different frameworks have different existence conditions. But the dispute here is about which framework to adopt, which Carnap might see as pragmatic. However, the participants see it as normative, not just pragmatic. 

  The normative aspect is key. They're arguing over which standard ought to be used, making it a second-order normative disagreement. So maybe "normative metaontological disagreement"? But does that distinguish it enough? Perhaps "criterial dispute in ontology" to emphasize the criteria conflict. 

  Looking at similar concepts, Putnam's conceptual relativity involves different conceptual schemes, but here the schemes aren't fully different; they share semantics but differ on application. Sider's ontological realism argues for a privileged structure, which might relate, but the dispute itself isn't labeled. 

  I think "metaontological criteriology" could work, though it's not established. Or "threshold variance in ontological commitment." The latter highlights the different stringency levels. Since the student wants to carve at the joints, emphasizing the standard of application as the joint makes sense. 

  Boundaries: Unlike verbal disputes, semantics are shared. Unlike quantifier variance, meaning is univocal. Unlike deflationism, the dispute is seen as substantive and normative. The key differentiator is the normative disagreement over application criteria. 

  So the suggested terms are "metaontological criteriology" or "threshold variance," with definitions focusing on shared semantics but divergent normative criteria for applying ontological terms. This avoids collapsing into neighboring categories by stressing the normative, criteria-based disagreement after factual and semantic agreement.
answer: |-
  Based on your detailed description and the nuanced distinctions you've drawn, what you're observing doesn't map perfectly onto any *single* established term in mainstream metaontology. However, it fits a **specific configuration within metaontological debates**, and we can define it precisely by synthesizing existing concepts and addressing your concerns. The core phenomenon is **normative disagreement about ontological criteria despite agreement on non-ontological facts and univocal semantic content**.

  ### Proposed Term: **Normative Metaontological Disagreement (NMD)**  
  *or*  
  **Criterial Variance in Ontological Commitment**

  ### Definition & Boundaries
  NMD occurs when:  
  1.  **Full agreement exists on all non-ontological facts** (e.g., physical, mathematical, modal, temporal properties).  
  2.  **Shared semantic meaning** is maintained for ontological terms (e.g., "exist," "object," "identity").  
  3.  **Persistent disagreement** arises solely over the *correct normative standard or criterion* for applying these ontological terms to the agreed-upon facts.  
  4.  **The dispute is experienced as substantive** because it concerns *which ontological framework or criterion ought to be adopted*, not factual error or semantic ambiguity.

  ### Key Differentiators from Neighboring Concepts
  | **Concept**               | **How NMD Differs**                                                                 | **Example from Your Cases**                                                                 |
  |---------------------------|-------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------|
  | **Chalmers-style Verbal Dispute** | Disputes resolve after disambiguation. In NMD, disambiguation *is already achieved*; the conflict persists over *application standards*, not meaning. | Both sides agree "exist" means the same thing (e.g., mind-independent reality). They disagree on whether holes *meet that standard*. |
  | **Hirsch's Quantifier Variance** | Asserts *semantic divergence* in quantifiers (e.g., "∃" means different things). In NMD, quantifiers share semantic content; variance is in *normative thresholds*. | Both mean the same by "there is." They dispute whether the criterion for "there is" *requires materiality* or *admits immaterial entities*. |
  | **Deflationism (e.g., Carnap, Thomasson)** | Treats disputes as shallow or pragmatic. NMD treats them as *normatively substantive* (about which standard *should* bind us). | Deflationists might say "choose a useful framework." NMD participants argue their criterion is *objectively correct* (e.g., "Existence *must* imply causal efficacy!"). |

  ### Why This Isn't Collapse into Existing Categories
  - **Not Verbal**: Semantic content is fixed; disagreement is about *whether the concept applies* given shared meaning (like disagreeing whether a "bachelor" must be unmarried *and* adult, despite agreeing on marital status).  
  - **Not Quantifier Variance**: Meaning is univocal; variance is in the *extension* of the term based on criteria (analogous to "tall" having a fixed meaning but disputing whether 6'0" qualifies).  
  - **Not Deflationism**: The dispute isn’t about convenience but *correctness* (e.g., "Mathematical objects *must* exist if they are indispensable!" vs. "Existence *requires* spatiotemporal location!").  

  ### Philosophical Anchors & Boundaries
  1.  **Metaphysical vs. Normative**: NMD is a **second-order normative dispute** about first-order ontological criteria. It asks, "Given our shared concepts and facts, *how ought we to apply* 'existence'?"  
  2.  **Boundary Condition**: NMD collapses if:  
      - Non-ontological facts are disputed (e.g., "Does the cheese *really* have a perforation?").  
      - Semantic content diverges (e.g., "By 'exist,' I mean *mental representation*").  
      - Disagreement is purely pragmatic (e.g., "Calling it a hole is *useful for cheesemongers*").  
  3.  **Closest Relatives**:  
      - **Carnap's Frameworks**: NMD disputes *which framework to choose*, but Carnap saw this as pragmatic; NMD participants treat it as normative.  
      - **Sider's Ontologese**: If both sides accept a "joint-carving" quantifier but dispute *what the joints are*, it approaches NMD. However, Sider assumes joints are objective; NMD can arise even without this assumption.  
      - **Putnam's Conceptual Relativity**: Similar, but Putnam often emphasizes semantic variance; NMD fixes semantics and focuses on criteria.  

  ### Why This Configuration Matters
  NMD reveals that **ontology is inherently normative**. When all facts and semantics align, what remains is a debate about *what existence demands of reality*—a disagreement about the **virtues of ontological frameworks** (e.g., parsimony, explanatory power, intuitive fidelity). Your examples show this:  
  - The hole debate hinges on whether existence *requires* materiality.  
  - The numbers dispute turns on whether abstractness *precludes* existence.  
  - The statue/clay case involves whether modal differences *entail* distinctness.  

  ### Recommended Literature for Nuance
  1.  **Karen Bennett** (*Making Things Up*) on "ontological seriousness" and criteria for "real" entities.  
  2.  **Theodore Sider** (*Writing the Book of the World*) on whether ontological thresholds can be objective.  
  3.  **Amie Thomasson** (*Ontology Made Easy*) vs. **Hirsch** (*Quantifier Variance and Realism*): Contrast their deflationism with NMD’s normativity.  

  In essence, you’ve pinpointed a metaontological "joint": **disagreements about the normative constraints on ontological commitment**. NMD isn’t about *what there is* or *what words mean*—it’s about *how to judge* what there is. If no existing term suffices, **normative metaontological disagreement** carves this joint precisely.
