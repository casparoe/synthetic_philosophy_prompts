prompt: |-
  Ok so I just spent like two hours at a coffee shop losing an argument with my friend about the difference principle, and it has really soured my confidence because in three weeks I have to present my paper on it to a political economy seminar in my department. The regulars are mostly welfare economists who care about efficiency and incentives more than fairness, there's a libertarian political theorist who shows up every time and thinks any redistribution is just a tax on voluntary exchange, and the one person I'm actually dreading is a social choice guy who has read Harsanyi to death and will absolutely bring up that a rational agent behind the veil, doing expected utility with equal probabilities, ends up picking utilitarianism.

  My paper's thesis, in case its useful: I'm not defending the difference principle as an equality principle, I'm defending it as a constraint on background institutions only, so the principle governs the rules of the game rather than the final distribution. And to answer the sufficiency objection I argue that people behind the veil would accept a floor-plus-maximin package because the veil makes them risk averse in a way expected utility can't model, since they don't know what their own conception of the good is and so can't attach probabilities to the utility of primary goods.

  What I want is a Q&A prep sheet: the seven or eight objections I'm actually going to get from this specific audience, not the standard Rawls critique other Rawlsians trade, ordered by how much damage each does to my actual argument, each phrased the way a welfare economist or the libertarian would actually put it, with a two minute reply for each and an honest note on where that reply is soft. Also include the one question I'm hoping nobody asks, and tell me which of my two main moves, the institutional reading or the risk aversion argument, I should be most worried about, and whether I should concede anything up front to save the rest.

  My friend's argument, in case it is a hint about what the economists will do: he kept saying any transfer that makes the top percent worse off to help the bottom is Pareto dominated so no rational agent would ever choose it, and I was stuck on that for like twenty minutes. Im not sure I actually won that one.
