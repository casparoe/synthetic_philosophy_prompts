prompt: |-
  I'm a senior analyst at a national body that decides which health services get publicly funded. We have informally adopted a policy of giving priority to the worse off — benefits to more disadvantaged patients count for more than equal benefits to better-off ones — but we have no worked-out method, and committee members keep disputing particular cases on instinct. Please write a decision procedure my team can actually run on a funding proposal.

  Context: we make roughly ten of these decisions a year, each involving thousands of patients and significant budgets. An analyst has about two weeks per case, with QALY-style effectiveness estimates and subgroup data, but no way of making fine-grained interpersonal utility comparisons. Final sign-off is by a mixed committee of clinicians, economists, and lay members, so every step must be explainable to a non-theorist in a paragraph.

  The procedure should cover, in order: how to characterize the relevant sense of "worse off," including when current condition, lifetime health prospects, and socioeconomic position point in different directions and which controls; how to set the priority weights, and how to report the recommendations that flip as the weights vary; an explicit leveling-down test — what the procedure should say about a policy that benefits no one but narrows the gap between groups, and whether prioritarianism has any principled basis for rejecting it; and the points at which the questions stop being technical and must go to the committee as questions of values.

  Then run the procedure on three cases: (1) a drug extending life by a few months for patients with a severe progressive condition, competing against a mental-health program with a larger total benefit spread across many mildly affected people; (2) a case where following the procedure's own weights yields a recommendation I will dislike — a small benefit to the very worst off purchased at a very large cost in aggregate health — and the procedure must show how it handles that rather than hiding it; and (3) a rationing rule that withholds a service from the better-off group without extending it to anyone, which is pure leveling-down.

  You are a professional philosopher specializing in distributive justice, with experience translating theory for health priority-setting bodies. Before writing anything, brainstorm which distinctions from the prioritarianism literature must survive the simplification — e.g., prioritarianism's reason for rejecting leveling-down versus the objection's usual use against egalitarianism — and which can safely be dropped. Mark honestly wherever the procedure cannot settle the matter. Answer in American English.
reasoning: |-
  Alright, let me approach this systematically. The user is a senior analyst at a national health funding body needing a practical decision procedure for prioritizing the worse off. They've informally adopted prioritarianism but need structure for consistent application. 

  First, I need to identify the core philosophical distinctions that must survive simplification. Prioritarianism's cardinal features: concave weighting (diminishing marginal moral value of health), rejection of leveling-down (since it violates Pareto), and focus solely on health-state disadvantages (not social status). These are non-negotiable. What can be dropped? Complex utility comparisons and multidimensional disadvantage aggregation - we'll use QALYs as the currency and define "worse off" through lifetime health deficits.

  The procedure must handle three tension points: defining "worse off" when health and socioeconomic factors conflict (we'll prioritize health deficits but flag socioeconomic divergence), setting weights without arbitrary choices (sliding scale with committee oversight), and explicitly rejecting leveling-down (with a test step). 

  For the cases: 
  Case 1 will likely favor the progressive condition patients due to severe baseline disadvantage, even with smaller aggregate benefit. 
  Case 2 must transparently show when small gains for the worst off override large aggregate losses - the procedure will calculate it but require committee ratification. 
  Case 3 will trigger the leveling-down rejection protocol immediately.

  The trickiest part is making value judgments explicit without over-simplifying philosophy. Every technical step needs a plain-English justification paragraph - like explaining why we reject leveling-down ("it wastes health benefits without helping anyone"). Committee involvement points are carefully placed: disadvantage definition, weight selection, and approval of counterintuitive results.

  I'm structuring the response to first outline the procedure steps, then demonstrate them on the cases. The annexes will handle implementation details like weight tables. Honesty about indeterminacy is crucial - we'll mark where committee judgment supersedes calculation (e.g., when socioeconomic factors might override health deficits). 

  The tone must balance academic rigor with bureaucratic pragmatism. No jargon without translation. For instance, "concave weighting" becomes "benefits matter more when given to those with worse health prospects."
answer: |-
  Here is a practical decision procedure for health funding priority setting, grounded in prioritarianism, designed for operational use with explicit handling of value judgments and the cases specified. It prioritizes transparency, feasibility, and committee oversight.

  **Core Principles Retained from Prioritarianism:**
  1.  **Diminishing Marginal Moral Value of Health:** An additional QALY is morally more valuable when given to someone with worse lifetime health prospects.
  2.  **Rejection of Leveling-Down:** Prioritarianism *always* rejects policies that make no one better off (or make some worse off) purely to reduce inequality. Health benefits are necessary.
  3.  **Outcome-Focused:** Weights are applied to *health gains* based on the recipient's *lifetime health prospects*, not to their utility or socioeconomic status directly.
  4.  **Pareto Respect:** If a policy makes everyone better off (or some better off and no one worse off), it is always preferred.

  **Simplifications Made:**
  1.  **Single Metric:** Uses QALYs as the sole health outcome measure.
  2.  **"Worse Off" Definition:** Focuses *primarily* on *lifetime health prospects* (LHP). Socioeconomic status (SES) is a contextual flag, not directly weighted.
  3.  **Weighting Function:** Uses a simple, adjustable concave function (power function) instead of complex utility models.
  4.  **No Fine Comparisons:** Avoids interpersonal utility comparisons beyond QALY aggregation.

  ---

  **The Priority Weighting Procedure (PWP)**

  **Phase 1: Define the Target Population & Subgroups (Analyst - Technical)**
  1.  Identify the specific patient population(s) affected by the proposal and comparator(s).
  2.  Define relevant subgroups based on:
      *   **Current Health Condition:** Diagnosis, severity, comorbidities (using standard clinical classifications).
      *   **Lifetime Health Prospects (LHP):** *This is the core disadvantage measure.* Estimate mean remaining lifetime QALYs *without* the intervention, based on:
          *   Condition-specific mortality/morbidity.
          *   Age (using standard life tables adjusted for condition).
          *   Relevant baseline population health data. *Report uncertainty ranges.*
      *   **Socioeconomic Status (SES) - Contextual Flag:** Identify if subgroups differ significantly on SES factors (e.g., income quintile, deprivation index, education) using available data. *Do NOT integrate into LHP calculation. Flag for committee attention if LHP and SES disadvantage diverge.*

  **Phase 2: Calculate Baseline "Worse Off" Status (Analyst - Technical)**
  1.  For each subgroup, calculate the key metric: **Mean Baseline Lifetime QALYs (LHP₀)**. Lower LHP₀ = Worse Off.
  2.  *Report:* LHP₀ for all subgroups, highlighting groups with very low LHP₀ (e.g., < 50% of population average remaining QALYs). Clearly state if significant SES differences exist alongside LHP₀ differences.

  **Phase 3: Estimate Health Benefits (Analyst - Technical)**
  1.  Estimate mean incremental QALYs gained per patient for each subgroup under the proposal vs. comparator(s), using standard health technology assessment methods. *Report uncertainty (e.g., confidence intervals).*
  2.  Estimate the number of patients affected in each subgroup annually.

  **Phase 4: Apply Priority Weights & Calculate Weighted Benefit (Analyst - Technical w/ Committee Input)**
  1.  **Select the Weighting Factor (k):** *This is the primary value judgment point.* The committee must choose a `k` value (0 ≤ k) based on the strength of priority to the worse off. Provide guidance:
      *   `k = 0`: No priority (Standard Cost-per-QALY).
      * `k = 1`: Moderate priority. A QALY to someone with half the average LHP₀ is worth 2x a QALY to someone with average LHP₀.
      * `k = 2`: Strong priority. A QALY to someone with half the average LHP₀ is worth 4x.
      * Higher k: Very strong priority. *Provide a table showing weight multipliers for different LHP₀ levels relative to population average for proposed k values (see Annex A).*
  2.  **Calculate Weighted QALYs for each Subgroup:**
      *   Define a reference LHP₀ (e.g., population average remaining QALYs).
      *   For each subgroup `i`:
          `Weight_i = (Reference LHP₀ / LHP₀_i)^k`
          `Weighted QALYs_i = Incremental QALYs_i * Number of Patients_i * Weight_i`
      *   *This gives more moral weight to QALYs gained by those with lower LHP₀.*
  3.  **Sum Total Weighted QALYs** for the proposal and comparator(s).
  4.  **Conduct Sensitivity Analysis:** Calculate Total Weighted QALYs for `k=0, k=1, k=2` (or other committee-specified values). *Flag if the recommendation (proposal vs. comparator) flips between k=0 and k=1 or k=1 and k=2.* Report the "k-threshold" where the flip occurs.

  **Phase 5: Leveling-Down Test (Analyst - Technical)**
  1.  **Explicit Check:** Does the policy *only* reduce the health (or opportunities) of a better-off group *without* providing any health benefit to a worse-off group? (e.g., withholding service A from Group B solely because Group C can't access it, without using the resources to help Group C or others).
  2.  **Procedure Mandate:** *If Leveling-Down is detected, REJECT the policy outright.* Prioritarianism provides a principled basis: it violates the Pareto principle and wastes potential health benefits. Improving equality *without* improving anyone's health has no value under prioritarianism. *Mark this clearly in the report.*

  **Phase 6: Cost-Effectiveness & Recommendation (Analyst - Technical)**
  1.  Calculate incremental cost per Weighted QALY gained (for the chosen `k`) vs. comparator(s). Apply standard cost-effectiveness threshold rules.
  2.  **Formulate Recommendation:** Based on cost per Weighted QALY and threshold.
  3.  **Transparency Requirements:**
      *   Clearly state the chosen `k` and justification (committee decision).
      *   Report results for `k=0` (standard QALY) for comparison.
      *   Report if the recommendation flips with different `k` values.
      *   Explicitly state if SES was flagged and how it was handled (only contextually).
      *   Explicitly confirm Leveling-Down was tested and result (rejected or not applicable).
      *   *Flag any case where the weighted recommendation prioritizes a very small gain for the worst-off over a large aggregate loss (see Case 2). This requires explicit committee ratification.*

  **Phase 7: Committee Decision & Reporting (Committee - Value Judgment)**
  *   The committee reviews the analyst's report, focusing on:
      *   The choice of `k` (strength of priority to worse off).
      *   The context of SES disparities flagged alongside health disadvantage.
      *   Cases where the recommendation flips with `k` or involves small gains/large costs for the worst-off.
      *   Confirmation of Leveling-Down rejection.
  *   Committee makes the final funding decision, ratifying or overriding the technical recommendation based on societal values, considering the transparently presented trade-offs.
  *   Final report clearly documents committee's rationale, especially regarding `k` and any overrides.

  **Key Points Requiring Committee Value Judgment (Non-Technical):**
  1.  **Defining Disadvantage Priority:** "How much more should a QALY count when given to someone with much worse lifetime health prospects?" (Choosing `k`).
  2.  **Resolving Divergence:** "When a group is socioeconomically disadvantaged but has *average* lifetime health prospects (or vice versa), how much extra consideration, if any, should they receive beyond the health-based weights?" (Handling the SES flag).
  3.  **Accepting Trade-offs:** "Are we willing to accept significantly lower total health gains (or higher costs) to prioritize a small health improvement for the very worst-off?" (Ratifying Case 2-type outcomes).
  4.  **Rejecting Leveling-Down:** Affirming the principle that reducing inequality *only* by making some worse off, without helping anyone, is unacceptable.

  ---

  **Application to Cases**

  **Case 1: Severe Progressive Condition Drug vs. Mild Mental Health Program**
  *   **Define Groups:**
      *   Group S: Severe progressive condition. Very Low LHP₀ (e.g., 5 remaining QALYs). Small QALY gain (e.g., 0.2). Few patients.
      *   Group M: Mild mental health condition. Moderate LHP₀ (e.g., 20 remaining QALYs). Smaller per-person QALY gain (e.g., 0.05). Many patients. *Larger total unweighted QALYs.*
  *   **Apply Weights (e.g., k=1, Ref LHP₀=20):**
      *   Weight_S = (20 / 5)^1 = 4.0
      *   Weighted QALYs_S = 0.2 * N_S * 4.0 = 0.8 * N_S
      *   Weight_M = (20 / 20)^1 = 1.0
      *   Weighted QALYs_M = 0.05 * N_M * 1.0 = 0.05 * N_M
  *   **Analysis:** Even if N_M is 20x N_S, Weighted QALYs_S (0.8*N_S) likely exceeds Weighted QALYs_M (0.05 * 20 * N_S = 1.0 * N_S) *only* if N_M < 16x N_S. **Likely Flip:** The unweighted analysis (k=0) favors the mental health program (larger total QALYs). The weighted analysis (k=1) likely flips to favor the severe condition drug unless N_M is *very* large. *Report the threshold N_M/N_S ratio where the flip occurs.* Committee chooses `k` knowing this.
  *   **Leveling-Down:** Not applicable.
  *   **Committee Value Point:** Choosing `k` determines if priority to the severe group outweighs the larger aggregate benefit of the mental health program.

  **Case 2: Small Gain for Worst-Off at Large Aggregate Cost**
  *   **Define Groups:**
      *   Group W: Extreme disadvantage. Very Low LHP₀ (e.g., 2 remaining QALYs). Tiny QALY gain (e.g., 0.05). Few patients. Very High Cost.
      *   Group O: Other patients (moderate LHP₀). Large *forgone* aggregate QALYs if Group W funded (opportunity cost).
  *   **Apply Weights (e.g., k=2, Ref LHP₀=20):**
      *   Weight_W = (20 / 2)^2 = 100
      *   Weighted QALYs_W = 0.05 * N_W * 100 = 5 * N_W
      *   The *forgone* Weighted QALYs for Group O (if funded instead) would be larger in aggregate but with low weights (e.g., Weight_O = 1, so Aggregate QALYs_O).
  *   **Analysis:** The massive weight (100x) on the tiny gain (0.05) for Group W (5 * N_W) could easily exceed the *weighted* benefit of alternative uses *if N_W is significant*. However, the *unweighted* (k=0) aggregate QALY loss from not funding the alternative (Aggregate QALYs_O) is large. **Transparency:** The report must clearly show:
      *   The massive weight applied (k=2, Weight=100).
      *   The small absolute gain per person (0.05 QALYs).
      *   The large total *unweighted* QALY opportunity cost (Aggregate QALYs_O).
      *   "Recommendation: Fund Group W intervention based on priority weighting (k=2). **Note:** This results in a net loss of [X] unweighted QALYs compared to the next best alternative, prioritizing a very small health gain for the extreme worst-off."
  *   **Leveling-Down:** Not applicable.
  *   **Committee Value Point:** **Mandatory Ratification.** The committee must explicitly approve funding despite the large aggregate health loss, based on the extreme priority given (`k=2`). The procedure forces this trade-off into the open.

  **Case 3: Pure Leveling-Down Rationing Rule**
  *   **Define Proposal:** Withhold Service A from Group B (moderate LHP₀) because Group C (low LHP₀) cannot access Service A (e.g., due to location, cost-sharing). No alternative use of resources specified to benefit Group C or others.
  *   **Analysis:**
      1.  **Leveling-Down Test (Phase 5):**
          *   Does it *only* reduce health/opportunities for Group B? Yes (they lose Service A).
          *   Does it provide *any* health benefit to Group C or anyone else? No.
          *   **Conclusion:** Pure Leveling-Down. **Recommendation: REJECT.** *"This policy is rejected under the Priority Weighting Procedure because it reduces health benefits for Group B without providing any health benefits to Group C or any other group, solely reducing inequality. Prioritarianism requires improving health outcomes, particularly for the worse off; it does not value reducing inequality if no one benefits."*
  *   **Committee Value Point:** The committee must affirm the rejection of leveling-down as a matter of principle. The procedure provides the principled basis (Pareto violation, waste of health benefits).

  **Annex A: Example Weight Multiplier Table (Reference LHP₀ = 20 QALYs)**
  | Baseline LHP₀ (QALYs) | k=0 Weight | k=1 Weight | k=2 Weight |
  | :-------------------- | :--------- | :--------- | :--------- |
  | 2 (Extreme Worst-Off) | 1.0        | **10.0**   | **100.0**  |
  | 5 (Severe)            | 1.0        | **4.0**    | **16.0**   |
  | 10 (Major)            | 1.0        | **2.0**    | **4.0**    |
  | 20 (Reference/Average)| 1.0        | 1.0        | 1.0        |
  | 30 (Better than Avg)  | 1.0        | 0.67       | 0.44       |
  | 40 (Much Better)      | 1.0        | 0.5        | 0.25       |

  This procedure provides a structured, auditable, and explainable method to implement prioritarianism in health funding, balancing technical rigor with necessary value judgments by the committee, explicitly handling critical issues like disadvantage definition, weighting, trade-offs, and the principled rejection of leveling-down.
