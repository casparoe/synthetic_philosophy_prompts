prompt: |-
  To inform policies on acquisition, attribution, and exhibition, set out the standards of adequacy for a philosophical account of why original works are taken to be more valuable than fakes, forgeries, and perceptually indistinguishable replicas. Take as stipulated the following variations the account must handle: (a) a deceptive imitation of a seventeenth-century portrait that matches the original in visual appearance and material composition yet was produced with intent to mislead, compared with an openly produced study replica with the same observable properties; (b) two posthumous bronze casts taken from a single surviving mould left by the artist, one authorized by the estate and one produced without authorization but with identical process and alloy; (c) a venerated wooden panel that through centuries of consolidation and inpainting retains almost none of its initial matter, compared with a newly constructed atom-by-atom duplicate that has never been restored. Give your answer as exactly five numbered items with no introduction or conclusion, each item limited to one or two sentences and stating one requirement together with the consideration that motivates it. Within each item, indicate whether the requirement is non-negotiable or may be relaxed for certain purposes, and where two requirements appear to pull against one another, note the tension in the relevant item.
reasoning: |-
  Hmm, the user wants me to set standards for a philosophical account explaining why original artworks are more valuable than fakes, forgeries, and replicas. They've provided three specific cases to help test any account: deceptive versus study replicas, authorized versus unauthorized bronze casts, and a heavily restored panel versus a perfect atomic duplicate. 

  I need to give exactly five numbered items without any introduction or conclusion. Each item should state one requirement and the motivation behind it, while indicating whether it's non-negotiable or can be relaxed. If two requirements conflict, I should note that tension in the relevant item.

  The core challenge here is balancing different aspects of what makes art valuable. Authenticity seems crucial—whether it's about the artist's direct involvement, historical continuity, or institutional validation. But the cases complicate things: the study replica isn't deceptive but still lacks originality, while the unauthorized bronze cast has material authenticity but not authorization. 

  For the wooden panel case, the restored piece has historical traces despite minimal original matter, while the atomic duplicate is perfect physically but lacks any history. This highlights the tension between material authenticity and historical narrative. 

  I should also consider intentionality—why the creator made the work matters, especially in distinguishing deceptive forgeries from study replicas. And provenance or documentation plays a role in establishing legitimacy, as seen in the bronze cast scenario where authorization determines value despite identical physical properties. 

  The requirements need to be robust enough to handle all three cases. Material continuity matters but isn't absolute; historical path dependency is key but can be overridden by institutional factors like authorization. I'll make sure each requirement addresses these nuances and flags where they might conflict—like when prioritizing historical continuity might clash with institutional validation in edge cases. 

  Finally, I'll keep each item concise—one or two sentences—and explicitly state for each whether it's non-negotiable (core to the concept of originality) or relaxable (context-dependent for policy purposes).
answer: |-
  Here are five numbered items setting out standards of adequacy for such a philosophical account:

  1.  **Requirement:** The account must explain the value difference based on the artwork's causal-historical genesis connecting it to the originating artist's creative act, even when perceptual properties are identical. This is **non-negotiable** as it addresses the core intuition that originality stems from the artist's specific creative moment, relevant to all variations including (a), (b), and the original panel in (c).
  2.  **Requirement:** The account must distinguish the moral and epistemic harm of deceptive intent (as in the deceptive forgery in (a)) from the ontological status of being non-original, while still explaining the lower value of non-deceptive copies (like the study replica). This is **non-negotiable** to handle variation (a) and prevent conflating fraud with the inherent lack of originality.
  3.  **Requirement:** The account must incorporate institutional validation (e.g., authorization by the artist or legitimate estate, as in the authorized bronze in (b)) as a significant, though **potentially relaxable**, factor contributing to authenticity and value, especially when material genesis alone is ambiguous (like the posthumous casts in (b)).
  4.  **Requirement:** The account must recognize the enduring value of material continuity and historical path dependency (the "career of the object"), even when original matter is minimal (like the venerated panel in (c)), contrasting it with the lack of such history in a perfect replica. This is **non-negotiable** for capturing the significance of an object's unique biography and physical journey through time.
  5.  **Requirement:** The account must reconcile the primacy of historical genesis (Requirement 1 & 4) with the potential sufficiency of institutional authorization (Requirement 3) when direct artist connection is absent (**tension noted**), while clearly differentiating both from mere physical replication. This is **non-negotiable** to adequately address variations like (b) (authorized vs. unauthorized cast) and (c) (historically embedded object vs. replica), acknowledging the complex interplay of factors beyond mere matter.
