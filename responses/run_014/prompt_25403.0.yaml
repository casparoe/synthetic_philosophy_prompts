  Another angle: without precommitment, what justifies entrenchment? Functional necessity for stable institutions or preventing tyranny of the majority. Mentioning historical examples like Germany's eternity clause shows real-world applications. The user might appreciate knowing that alternatives exist beyond simple majoritarianism.

