  ### The Sestina of the Urn and the Queue

  First stands before the urn,  
  Alone, the only in the line.  
  He reaches in, makes one draw,  
  Holds up a single ball,  
  Makes public his first guess,  
  Hopes it will match the urn's true count.  

  Next comes, observes the count:  
  One vote. He scans the urn,  
  Considers that first guess,  
  Then joins the growing line.  
  He draws a ball,  
  Prepares to make his own draw.  

  He takes his draw:  
  A black ball. But the count  
  Shows two votes, both white. The urn  
  Stays veiled. He eyes the line,  
  The pair ahead. His ball  
  Says black. Their shared guess  

  Says white. The public guess  
  Outweighs his draw.  
  He drops his ball  
  Unspoken. Adds to the count  
  His voice: "White." The line  
  Grows, fixed by the urn.  

  The fourth notes the guess  
  Of three. He joins the line,  
  Makes his own draw:  
  A black ball. Ignores the count  
  That overrules. The urn  
  Holds truth, but he holds only a ball.  

  Fifth holds a ball,  
  White now. He knows the guess  
  Required. The urn  
  Is distant. In the line,  
  The count  
  Demands his draw.  

  Sixth in the endless line,  
  He draws a ball. The count  
  Now five, all white. His draw  
  Must be the public guess.  
  He speaks it. The urn  
  Stays sealed. The line's guess is the only ball.  

  The urn at last reveals its count.  
  The line's long guess is shattered by a ball  
  From every truthful draw.  

