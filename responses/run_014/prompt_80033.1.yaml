prompt: |-
  I sit on my city's housing and commerce policy board, and we've been asked to rule on a new price-control proposal. Our own precedents so far: we approved rent stabilization — caps on annual increases, not fixed ceilings — for buildings in neighborhoods with documented displacement, with a five-year sunset; we rejected a citywide minimum-wage floor set above the state level; we approved a 90-day cap on the price of emergency repair and towing services after a major storm; we rejected a permanent price floor for produce at the city farmers' market; and we approved a two-year moratorium on converting long-term rentals to short-term rentals in one high-demand district. The new proposal would impose a permanent, citywide cap on the nightly rate for short-term rental listings, on the grounds that short-term rentals are driving up long-term rents and displacing residents. If we want to be consistent with ourselves, what should we decide, and which of our precedents is the closest analog? I'd also like you to lay out the distinct rules our past verdicts are jointly consistent with, what each of those rules predicts for this new case, and which future case would best tell those rules apart. And if our precedents genuinely underdetermine the answer, say honestly what principle we would be adopting by approving the cap versus by rejecting it.
reasoning: |-
  Okay, the user is on a city housing and commerce policy board and needs to rule on a new short-term rental price cap proposal. They've provided their past decisions and want to know how to be consistent. Let me start by listing their precedents to understand their pattern.

  First, they approved rent stabilization in neighborhoods with displacement, with a five-year sunset. That's targeted and temporary. Then they rejected a citywide minimum wage above the state level, which was a broad, permanent control. They approved a 90-day cap on emergency services after a storm—temporary and situational. Rejecting a permanent price floor for farmers' market produce shows aversion to permanent controls. Finally, they approved a two-year moratorium on rental conversions in one district—again, temporary and targeted.

  So the common threads: they favor temporary, targeted interventions over permanent, broad ones. They avoid permanent measures and citywide applications unless there's a specific, urgent issue. 

  Now the new proposal: a permanent, citywide cap on short-term rental rates. This seems to clash with their past rejections of permanent and broad measures. The closest analog is the rejected minimum wage floor because both are permanent and citywide. The rent stabilization and moratorium were temporary and targeted, which they approved, but this cap isn't. 

  The user might need to justify their decision based on consistency. If they approve this, they're shifting towards accepting permanent controls, which contradicts their previous stance. But maybe there's pressure to address housing issues. The underlying principle here is whether they prioritize market freedom or intervention for community stability. 

  They also asked for future cases to test their rules. A temporary cap in high-displacement areas would align with past approvals, while a permanent produce price floor would contradict their prior rejection. That would clarify if the key factors are temporariness and targeting. 

  The user's deeper need might be to maintain credibility by staying consistent while addressing housing concerns. They might need to frame the decision in a way that aligns with their precedents or acknowledge a policy shift if they approve the cap. Highlighting the temporary nature or targeting could be a compromise, but the proposal as is doesn't allow that.
answer: |-
  Based on your precedents, **rejecting the permanent citywide nightly rate cap on short-term rentals** is the most consistent decision. The closest analog is your **rejection of the citywide minimum-wage floor set above the state level**.

  Here's the breakdown:

  **Distinct Rules Consistent with Your Precedents:**

  Your past rulings reveal a coherent set of principles prioritizing **temporality, targeting, and market freedom**:

  1.  **Rule 1: Prefer Temporary, Crisis-Driven Interventions:** You approve price controls when tied to a *specific, acute, and time-limited crisis* (90-day storm repair cap, 2-year conversion moratorium). Permanent controls are disfavored.
  2.  **Rule 2: Prefer Geographically/Situationally Targeted Interventions:** You approve interventions only in *specific, documented problem areas* (rent stabilization in displacement neighborhoods, conversion moratorium in one high-demand district). Citywide interventions without specific localized justification are disfavored.
  3.  **Rule 3: Reject Permanent, Broad Price Controls:** You reject interventions that impose *permanent, citywide price floors or ceilings* on core market functions without a documented, acute crisis (minimum wage floor, produce price floor). This reflects a preference for market mechanisms absent specific, urgent harm.
  4.  **Rule 4: Address Documented Harms Directly:** Interventions are justified when they directly address a *documented, proximate harm* (displacement in specific neighborhoods, storm price gouging, loss of long-term rentals in a specific district).

  **Applying the Rules to the New Proposal (Permanent, Citywide STR Cap):**

  *   **Rule 1 (Temporality):** **Violated.** The proposal is permanent, unlike your approved temporary interventions (5-year sunset, 90-day, 2-year). It aligns with the *rejected* permanent controls (wage, produce).
  *   **Rule 2 (Targeting):** **Violated.** The proposal is citywide, unlike your approved geographically targeted interventions. It aligns with the *rejected* citywide wage floor.
  *   **Rule 3 (Reject Permanent/Broad Controls):** **Violated.** A permanent, citywide price ceiling fits squarely within the type of intervention you've consistently rejected.
  *   **Rule 4 (Direct Harm):** **Partially Met/Contentious.** The proposal cites displacement/higher rents. While potentially true, your precedent requires *documented* harm in *specific areas* (like the rent stabilization case). A citywide mandate based on a general claim doesn't meet the specificity bar you set previously. The conversion moratorium *directly* addressed the mechanism causing harm (conversion); a price cap addresses a different mechanism (price).

  **Closest Analog:** The **rejection of the citywide minimum-wage floor** is the strongest parallel. Both involve:
  *   Permanent price controls (wage floor vs. STR ceiling).
  *   Citywide application.
  *   Based on a general social/economic goal (higher wages vs. housing affordability).
  *   Not tied to a specific, acute, temporary crisis event.
  *   Rejected by your board.

  The approved rent stabilization *differs* significantly due to its geographic targeting, sunset clause, and direct link to documented displacement in specific areas. The conversion moratorium was targeted and temporary.

  **If Precedents Underdetermine (But They Lean Strongly):**

  While your precedents strongly point to rejection, the *claimed harm* (displacement) echoes the justification for rent stabilization. If this creates ambiguity:

  *   **Approving the Cap:** Would signal a shift towards accepting **permanent, broad price ceilings as a legitimate tool for addressing systemic housing market failures**, prioritizing affordability/stability over market pricing in this specific sector, despite previous rejections of similar broad/permanent controls. It weakens Rules 1, 2, and 3 significantly.
  *   **Rejecting the Cap:** Reinforces the principles of **temporality, targeting, and market primacy** established in your previous rulings. It maintains that broad, permanent price controls require an exceptional justification not yet met, consistent with rejecting the wage and produce floors.

  **Future Case to Test/Distinguish Rules:**

  The most revealing future case would be a proposal for a **"Temporary Nightly Rate Cap on STRs *only* in Neighborhoods with Documented High Displacement Rates Directly Linked to STRs."**

  *   **Rule 1 (Temporality) & Rule 2 (Targeting):** Would predict **APPROVAL** if temporary and targeted, similar to rent stabilization/conversion moratorium.
  *   **Rule 3 (Reject Permanent/Broad):** Would predict **REJECTION** only if the cap were permanent or citywide. A temporary, targeted cap doesn't violate this rule as strictly as the current proposal.
  *   **Rule 4 (Direct Harm):** Would require strong evidence linking STR prices directly to displacement in those specific areas for approval.

  **Conclusion:** Consistency demands **rejecting the permanent citywide STR rate cap.** It violates the core principles of temporality, targeting, and aversion to broad permanent price controls established by your board, most closely mirroring your rejection of the citywide minimum wage. Approving it would represent a significant departure towards accepting permanent, broad price ceilings as a primary policy tool for housing affordability. If displacement by STRs is a documented crisis, a *temporary, targeted* intervention (like a moratorium extension or a localized pilot cap) would be the consistent path forward.
