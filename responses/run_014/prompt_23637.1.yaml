prompt: |-
  I'm a science journalist who sits on the scientific advisory committee of a natural history museum, and we are reviewing the draft text for a new exhibit on the human body. One panel asserts that the shape of the human nose — narrower in cold, dry climates, broader in warm, humid ones — is a direct product of natural selection, evolved to condition the air we breathe, and that this is why nose shape tracks climate across populations. Half the committee is comfortable with the wording; the other half thinks it is precisely the kind of unfalsifiable, pan-adaptationist claim that Gould and Lewontin's spandrels critique targets, since the same nose shape could just as well be a byproduct of other changes in the face or a target of sexual selection rather than of selection for air-conditioning. Please draft the short written opinion I will circulate before Thursday's meeting: it should recommend a concrete course of action (publish the panel as written, publish it with a stated caveat, or strike it), and it should give the committee a standard for when an adaptationist claim of this sort is strong enough to put in front of the public, while fairly engaging the strongest reason to simply publish the adaptation story as it stands.
reasoning: |-
  Okay, the user is a science journalist on a museum's scientific advisory committee. They're reviewing an exhibit panel about human nose shape and climate adaptation. Half the committee thinks it's solid, while the other half sees it as a classic example of unfalsifiable adaptationist thinking—like Gould and Lewontin's spandrels critique. The user needs a written opinion for the committee meeting that recommends action (keep, modify, or remove the panel) and establishes criteria for when such adaptationist claims are public-ready. 

  Hmm, this is fascinating because it's really about science communication philosophy. The nose-climate connection *does* have published support (e.g., Thomson and Buxton's old studies, more recent 3D modeling papers showing nasal cavity correlations with climate variables). But the critics aren't wrong either—nose shape could be influenced by genetic drift, allometry with facial structure, or sexual selection. The museum's dilemma is balancing scientific accuracy with public engagement: oversimplified narratives can mislead, but over-qualified exhibits become unreadable. 

  The strongest pro-adaptation argument? Empirical consistency across studies. The counterpoint? Nobody's done a knockout experiment proving nasal morphology *causes* differential survival/reproduction in humid vs. dry climates. It's inference from comparative anatomy. 

  For the draft opinion, I'll suggest a middle path: keep the panel but add a caveat. Why? Because scrapping it entirely dismisses legit evidence, but presenting it dogmatically ignores evolutionary biology's nuance. The caveat should explicitly name non-adaptive alternatives ("byproduct of facial evolution" / "sexual preference") without drowning the main point. 

  As for standards... Public-facing claims need: 1) consensus across multiple methods (morphometrics, genetics, physiology), 2) quantifiable effect sizes (e.g., "17% wider nostrils correlate with X% humidity increase"), and 3) mechanistic plausibility (here, nasal turbinates *do* warm/humidify air). Bonus points if it avoids "just-so story" language ("evolved for" → "may enhance"). 

  Final note: The museum's role isn't to settle debates but to show science as process. A well-framed caveat models intellectual honesty better than either extreme.
answer: |-
  ## Committee Opinion: Exhibit Panel on Nasal Evolution  
  **Recommended Action: Publish with a stated caveat**  
  *(Add 1–2 sentences acknowledging alternative explanations)*  

  ### Rationale:  
  The claim that nasal morphology tracks climate due to natural selection for air conditioning *is supported by substantial evidence*, including:  
  - **Biophysical studies** demonstrating narrower noses warm/humidify air more efficiently (e.g., Noback et al., 2011; Zaidi et al., 2017).  
  - **Global morphological analyses** showing strong correlation between nasal traits and temperature/humidity (e.g., Thomson & Buxton, 1923; Maddux et al., 2016).  
  - **Evolutionary modeling** indicating selection, not drift, drives these patterns (Carey & Steegmann, 1981).  

  **However**, the committee’s concern about unfalsifiable adaptationism is valid. Gould and Lewontin’s critique reminds us that:  
  - Nasal shape *could* be a byproduct of facial allometry, genetic drift, or sexual selection.  
  - Experimental evidence for *differential survival/reproduction* tied to nasal climate adaptation remains indirect.  

  ### Standard for Public Adaptation Claims:  
  Adaptationist explanations should meet **three criteria** before presentation:  
  1. **Consilience of Evidence:** Agreement across multiple disciplines (e.g., anatomy, genetics, biophysics).  
  2. **Fitness Correlation:** Demonstrated link between the trait and survival/reproduction *in relevant environments*.  
  3. **Exclusion of Simpler Alternatives:** Ruling out drift, allometry, or pleiotropy as primary drivers *where feasible*.  

  ### Proposed Wording Revision:  
  > "The shape of the human nose varies across climates—narrower in cold/dry regions, broader in warm/humid ones. Research suggests this pattern may reflect natural selection for efficient air conditioning: narrower nasal passages better warm and humidify inhaled air. *However, other factors like genetic drift, facial structure, or sexual selection could also contribute to this variation.*"  

  ### Why Not Remove the Panel?  
  The climate-nose correlation is **too robust to omit** and serves as a compelling example of biogeography. The *strongest argument for the original wording* is that air-conditioning is the *only hypothesis with mechanistic and cross-population empirical support*. Yet, science communication demands humility where multiple processes *could* explain a trait.  

  This revision honors evidence while modeling scientific nuance—a core educational goal for the museum.  

