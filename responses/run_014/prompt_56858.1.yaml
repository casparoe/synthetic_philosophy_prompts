   So for Alice to synchronize with B: at time t1' on her clock, she sends a messenger to B. The messenger arrives at B at floor time t_arr, and the clock at B shows t_arr. The messenger immediately returns. Alice receives it at t2' on her clock. Then, the event at B of the arrival of the messenger is simultaneous with the event on her worldline at time (t1' + t2')/2.

   The time at B when the messenger arrived is t_arr, and she will set her mental clock for B to (t1' + t2')/2 at that event.

