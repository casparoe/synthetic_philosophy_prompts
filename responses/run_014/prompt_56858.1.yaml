  ### In-Class Activity: Feeling the Relativity of Simultaneity

  **Core Insight:** Students enact Einstein's synchronization procedure with "slow light" to discover frame-relative simultaneity, leading them to derive a 1.25-million-year disagreement about "now" in Andromeda. The "block universe" emerges as the only consistent ontology.

  **Key Innovation:** Use **human messengers on rollerblades/skateboards** to enforce light-speed invariance. Messengers move at fixed speed (1 m/s) relative to the floor, regardless of sender motion, by starting/stopping only at designated "inertial markers" (students holding signs).

  ---

  ### Materials & Setup
  - **Space:** Clear a 20m straight path (e.g., hallway or cleared classroom). Mark positions with tape:  
    - **O (Origin):** Center (0m)  
    - **A (Andromeda):** Left end (-10m)  
    - **B (Betelgeuse):** Right end (+10m)  
  - **Roles:**  
    - **Alice & Bob:** Hold stopwatches, walk in opposite directions.  
    - **Light Messengers (2):** On rollerblades/skateboards; move at **1 m/s** (use metronome or timer).  
    - **Inertial Markers (6):** Stand at -10m, -5m, -2m, +2m, +5m, +10m with signs.  
    - **Andromeda/Betelgeuse Observers (2):** Stand at A and B with event flags (e.g., color cards).  
  - **Tools:**  
    - Stopwatches (for Alice, Bob, instructor).  
    - Metronome/timer app (set to 60 BPM for 1 m/s pace).  
    - Signs: "🚀 ANDROMEDA", "🌠 BETELGEUSE", position markers.  

  ---

  ### Scaled Parameters (Room-Sized Physics)
  - **Light speed (\(c\)):** 1 m/s (messenger speed).  
  - **Alice/Bob speed (\(v\)):** 0.5 m/s (walking pace).  
  - **Distances:**  
    - Andromeda (A): 10m left of O.  
    - Betelgeuse (B): 10m right of O.  
  - **Time Dilation/Ignored:** \(\gamma \approx 1\) (classical limit for clarity).  
  - **Predicted Effect:**  
    - Time offset in moving frame: \(\Delta t' = -\frac{v \Delta x}{c^2}\)  
    - At \(v = 0.5c\), \(\Delta x = 20\)m (A to B): \(\Delta t' = -10\) seconds.  
    - **Andromeda Offset:** When scaled to real Andromeda (2.5M ly), \(\Delta t' = -1.25\) million years.

  ---

  ### Timeline (90 Minutes)
  #### **0–10 min: Setup & Frame Sync (Floor Frame)**  
  - Instructor synchronizes floor-frame clocks using Einstein’s method:  
    1. Messenger from O to A (10m at 1 m/s = 10 sec).  
    2. A sets clock to \(T_{\text{send}} + 10\) sec.  
    3. Repeat for B.  
    ➔ **All agree: "Now at A/B is synchronized with O."**  

  #### **10–20 min: Alice/Bob Meet & Move**  
  - Alice (right at 0.5 m/s) and Bob (left at 0.5 m/s) start at O.  
  - At instructor’s clap (**floor \(t = 0\)**):  
    - Alice/Bob set stopwatches to 0.  
    - A and B raise event flags (e.g., "ANDROMEDA EVENT", "BETELGEUSE EVENT").  

  #### **20–40 min: Einstein Sync in Motion**  
  - **Alice syncs with Andromeda (A):**  
    1. At her stopwatch time \(t_1'\), Alice shouts "SEND TO ANDROMEDA!" from her location.  
    2. *Nearest inertial marker* relays to messenger. Messenger moves **at 1 m/s to A**.  
    3. A timestamps message with **floor time \(t_{\text{arr}}\)**, sends reply via messenger.  
    4. Alice records stopwatch time \(t_2'\) at reply arrival.  
    5. Alice calculates:  
       - Time at Andromeda during sync event: \(T_{\text{sim}} = \frac{t_1' + t_2'}{2}\)  
       - **Result:** \(T_{\text{sim}} \approx +5\) sec (later than her "now").  

  - **Bob syncs with Betelgeuse (B):**  
    - Same steps. **Result:** \(T_{\text{sim}} \approx -5\) sec (earlier than his "now").  

  #### **40–60 min: The Disagreement**  
  - Alice and Bob stop walking after 10 sec (floor time).  
  - **Report Results:**  
    - Alice: "At MY 'now' (stopwatch=0), Andromeda's time was +5 sec."  
    - Bob: "At MY 'now' (stopwatch=0), Betelgeuse's time was -5 sec."  
  - **Instructor:** "At floor 'now' (t=0), both events happened. Why do Alice/Bob disagree?"  

  #### **60–75 min: Scale to Andromeda**  
  - Students derive offset formula \(\Delta t' = -\frac{v \Delta x}{c^2}\) from their data.  
  - **Calculate for real Andromeda (2.5M light-years):**  
    \[
    \Delta t' = - \frac{(0.5c)(2.5 \times 10^6 \, \text{ly})}{c^2} = -1.25 \, \text{million years}.
    \]
  - **Payoff:** Alice and Bob realize they disagree by **1.25 million years** on "now" in Andromeda.  

  #### **75–90 min: Debrief & Block Universe**  
  - **Premises Revealed:**  
    1. *Light Speed Invariance:* Messengers enforced fixed \(c\) (all frames).  
       - **Resist?** Deny invariance (e.g., aether theories) → abandon relativity.  
    2. *Einstein Sync Defines Simultaneity:* "Now" is sync-dependent.  
       - **Resist?** Privileged sync (e.g., Newton's absolute time) → reject relativity.  
    3. *Relativity of Simultaneity:* Alice/Bob’s "nows" slice spacetime differently.  
       - **Resist?** Assert universal present → paradoxes (e.g., ladder in barn).  
  - **Conclusion:**  
    - No privileged "now" → past/present/future equally real → **block universe**.  
    - **Reveal the Term:** "This 4D frozen landscape is the *block universe*."  

  ---

  ### What Goes Wrong & Limitations
  1. **Predictable Issues:**  
     - Messenger speed ≠ exactly 1 m/s → use metronome and practice.  
     - Student motion not perfectly inertial → use straight path and markers.  
     - Calculation errors → provide formula scaffolding.  

  2. **What the Activity *Can’t* Reproduce:**  
     - **Time Dilation/Length Contraction:** Ignored to focus on simultaneity.  
     - **True Light-Speed Invariance:** Messengers are frame-dependent (simulate only floor frame).  
     - **Spacetime Interval Invariance:** Must explain that \(\Delta s^2\) is the true invariant.  

  **What You’ll Need to Supply:**  
  - Lorentz transforms (for rigor).  
  - Why \(c\) is invariant in *all* frames (not just floor).  
  - How the block universe resolves disagreements causally (light cones).  

  ---

  ### Why It Works
  - **Tactile Learning:** Students *feel* the sync procedure’s frame-dependence.  
  - **Scaled Discovery:** Room-sized offsets → cosmic disagreement.  
  - **No Jargon:** "Block universe" emerges from their own calculations.  

