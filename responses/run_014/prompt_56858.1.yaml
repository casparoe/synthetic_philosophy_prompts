  2. We have Alice moving to the right at 0.5 m/s. She has her own clock set to 0 at the center at floor time 0.

  3. She wants to synchronize her frame's clocks. In her frame, there are moving observers (which are the floor observers) but she considers them moving. Instead, we can have her own set of observers moving with her, but that is hard.

   Alternatively, we can have two students moving with Alice and Bob.

   Given the complexity, I think we should use the Lorentz transformation to pre-calculate and then have the students see the result.

   But the request is for a physical enactment.

   I found a resource online: a common activity is to use a long table and have people with stopwatches. We can do the following from the resource " how to teach special relativity with and without a photon":

   They use a string of Christmas lights or something, but that's not slow light.

   Another idea: use a long line of students sitting in a row. The message is passed along the row. Each student represents a point in space. For the floor frame, the students are at rest. For the moving frame, we have a moving observer who walks along and collects times. But then the light speed is not constant.

   Given the snag, I think we can approximate by having the light speed constant relative to the floor by having a designated messenger who always walks at 1 m/s relative to the floor. For example, when Alice wants to send a message to a point, she hands it to a messenger who then walks at 1 m/s to the destination.

   So in the activity:

  - We have the floor frame. We synchronize the clocks at different positions in the floor frame by using messengers. For example, to synchronize clock B with clock O: O sends a messenger to B at 1 m/s. The distance is 10m, so it takes 10 seconds. The messenger carries the time at which it was sent, say t0. When it arrives at B, B sets its clock to t0 + 10 seconds.

