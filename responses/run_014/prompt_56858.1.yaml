   But we want the event at B that is simultaneous with her event where she is.

   In her frame, the event at B that has the same t' as her current event.

   Let her current event be Q: in floor frame, x=0.5m, t=1 second.
   In her frame (moving at v=0.5 m/s), the Lorentz transformation:
     x' = γ (x - v t) = γ (0.5 - 0.5 * 1) = γ * 0 = 0.
     t' = γ (t - v x / c^2) = γ (1 - 0.5*0.5/1) = γ (1 - 0.25) = γ * 0.75.

   For event at B: x=10m, and we want t' = γ * 0.75.
     t' = γ (t - v *10 / c^2) = γ (t - 5)
     set equal: γ (t - 5) = γ * 0.75  => t - 5 = 0.75 => t = 5.75 seconds.

