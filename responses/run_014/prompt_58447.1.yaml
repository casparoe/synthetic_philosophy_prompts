prompt: |-
  Our city council receives about a dozen internal proposals each month presented as win-win changes to bus routing, clinic scheduling, and data sharing across departments, and I as programme officer must triage them. Please develop a reusable decision procedure grounded in the idea of a safe Pareto improvement, which for our purposes means a change that improves at least one affected group by its own informed preferences while making no group worse off, where that assessment must remain true under a range of plausible forecasts and without counting uncompensated losses as outweighed by larger gains elsewhere. The procedure should be usable in about forty-five minutes by staff without economics training, give ordered checks with plain standards of evidence for passing each, specify when to reject outright, and mark explicitly where factual checking ends and a value judgment requiring director sign-off begins. Then apply it to two fictional proposals: a widely supported consolidation of two evening bus routes into a single frequent corridor that lengthens the walk for one housing estate, and automatic swapping of unused clinic appointments across departments. Conclude by stating what the procedure cannot settle and where it is likely to misfire.
reasoning: |-
  We are developing a decision procedure based on the concept of a "safe Pareto improvement". The key elements are:
   1. The change must improve at least one group by its own preferences without making any group worse off.
   2. The assessment must hold under a range of plausible forecasts (i.e., robust to uncertainty).
   3. We do not allow uncompensated losses to be outweighed by gains elsewhere (i.e., no interpersonal utility compensation).

   The procedure should have ordered checks with clear standards of evidence, take about 45 minutes, be usable by non-economists, and specify when to reject and when to require director sign-off for value judgments.

   Steps:

   Step 1: Identify Affected Groups
     - List all groups that would be affected by the proposal (e.g., bus riders, clinic patients, staff, etc.).
     - Standard: Must be a comprehensive list. If any group is missed, the proposal may fail later.

   Step 2: Document Each Group's Current Situation
     - For each group, describe the status quo (what they currently experience).
     - Standard: Based on available data (e.g., surveys, usage statistics, complaints). If data is missing, note it.

   Step 3: Forecast Changes Under the Proposal
     - For each group, describe the expected change from the proposal. Include both direct and indirect effects.
     - Standard: Must consider a range of plausible scenarios (optimistic, pessimistic, most likely). Use expert opinions or historical data if available.

   Step 4: Check for Absolute Harm
     - For each group, under every plausible scenario, does the group experience harm? Harm is defined by the group's own preferences (e.g., if they perceive a loss in convenience, time, cost, etc.).
     - Standard: If any group is worse off in any scenario, then the proposal fails the safe Pareto criterion. However, if the harm is negligible (to be defined by the organization, e.g., less than 1 minute extra walk) and the group is indifferent, then it may pass. But note: the definition of negligible might require a value judgment.

   Step 5: Check for At Least One Improvement
     - Is there at least one group that is better off in every plausible scenario? And is the improvement non-negligible?
     - Standard: The improvement must be clear and significant enough to be considered an improvement by the group.

   Step 6: Robustness Check
     - Are there any scenarios (even if less likely) in which the proposal causes harm to any group? If so, how likely are those scenarios? And can the harm be mitigated without altering the core proposal?
     - Standard: If the harm in any plausible scenario (say, more than 10% chance) is non-negligible, then the proposal fails unless there is a mitigation plan that is part of the proposal and that ensures no harm in all scenarios.

   Step 7: Value Judgment Check
     - If the proposal passes Steps 4-6, then it is a safe Pareto improvement. However, if there is a group that experiences a negligible harm (as defined by the organization) and the organization deems that acceptable, then we require director sign-off at this point because accepting a negligible harm is a value judgment.

   Step 8: Decision
     - If the proposal passes Steps 4-6 without any harm (even negligible) then accept.
     - If it passes but with negligible harm to any group, then it requires director sign-off (value judgment: is negligible harm acceptable?).
     - Otherwise, reject.

   Now, let's apply this to the two fictional proposals.

   Proposal 1: Consolidation of two evening bus routes into a single frequent corridor that lengthens the walk for one housing estate.

   Step 1: Affected groups:
     - Residents of the housing estate that currently uses one of the two routes (Group A).
     - Residents of other areas currently using the two routes (Group B).
     - The transit agency (Group C) in terms of operational costs and efficiency.

   Step 2: Current situation:
     - Group A: Currently have a bus stop very close (say, 2 minutes walk). The bus comes every 30 minutes.
     - Group B: Currently have buses every 30 minutes on each route, but the routes overlap in the city center so some segments have more frequent service. However, in the suburbs, the service is every 30 minutes.
     - Group C: Currently operates two separate routes with some overlapping, which is inefficient.

   Step 3: Forecast changes:
     - Proposal: Merge the two routes into one corridor with buses every 15 minutes. The new route would not go as close to the housing estate of Group A. They would have to walk 10 minutes instead of 2.
     - Group A: Now have a 10-minute walk and a bus every 15 minutes (instead of 2-minute walk and every 30 minutes). The total travel time might change: the walk is longer but the wait time is shorter. However, the walk is perceived as more burdensome, especially in bad weather or for the elderly.
     - Group B: Now have a bus every 15 minutes on the main corridor (which covers most of the old routes). This is an improvement in wait time.
     - Group C: May save on operating costs (one route instead of two) and have more efficient resource use.

   Step 4: Check for absolute harm:
     - Group A: In the best scenario, the shorter wait might compensate for the longer walk for some, but in the worst scenario (e.g., during bad weather, for elderly or disabled residents) the longer walk is a significant burden. Also, even in the best scenario, if the residents of Group A value the short walk more than the reduced wait, they are worse off. Therefore, Group A is harmed in some scenarios.
     - Group B: Better off in all scenarios (shorter wait).
     - Group C: Better off (cost savings).

     Since Group A is harmed (even if in some scenarios they might be indifferent or even better, but in others worse), the proposal fails Step 4.

   Step 5: Check for at least one improvement: Yes, Groups B and C are better off.

   Step 6: Robustness: The harm to Group A is plausible (especially in bad weather or for vulnerable populations). Without mitigation (e.g., a shuttle from the housing estate to the new stop, or a shelter at the new stop) the harm remains.

   Step 7: Value judgment: Not applicable because the harm to Group A is non-negligible in some scenarios.

   Step 8: Decision: Reject. However, if the proposer can add a mitigation for Group A (e.g., a covered walkway, a shuttle, or a compromise that reduces the walk) and then the harm is eliminated in all scenarios, then we could reconsider.

   Alternatively, note that the harm to Group A might be compensated (e.g., by giving them discounted fares) but the safe Pareto criterion does not allow compensation because it requires no group to be worse off. Therefore, without mitigation, the proposal fails.

   Proposal 2: Automatic swapping of unused clinic appointments across departments.

   Step 1: Affected groups:
     - Patients who are waiting for appointments (Group P).
     - Clinic staff (Group S): doctors, nurses, administrative.
     - The healthcare system (Group H): overall efficiency.

   Step 2: Current situation:
     - Group P: Patients sometimes have to wait a long time for an appointment. Unused slots in one department cannot be used by another department even if a patient from another department could use it (if they are flexible).
     - Group S: Staff may have idle slots or be overbooked. They are used to a fixed schedule per department.
     - Group H: System has inefficiencies due to rigid departmental boundaries.

   Step 3: Forecast changes:
     - Proposal: An automatic system that allows a patient from one department to take an unused slot in another department if the patient is willing and if the clinical requirements are met (e.g., the doctor in the other department is qualified to handle the condition?).
     - Group P: Some patients (those who are flexible) may get appointments sooner. However, there might be confusion if the appointment is in a different department. Also, if the patient is not comfortable with a different department, they might be worse off. But the system would only swap if the patient opts in? Let's assume the system is opt-in: so only patients who agree to swap are affected. Then, for those who opt-in, they get an earlier appointment. For those who don't, they keep their original appointment. However, what about the original slot? If a slot in department A is given to a patient from department B, then a patient in department A might have to wait longer? Not necessarily because the slot was unused. So if it was truly unused then it's free capacity.
     - Group S: Staff might have to handle patients from different departments. This could disrupt their workflow or require cross-training. Also, administrative burden may increase initially until the system is optimized.
     - Group H: Better utilization of resources, shorter waiting times on average.

   Step 4: Check for absolute harm:
     - Group P (those who opt-in): They are better off (earlier appointments). 
     - Group P (those who do not opt-in): They are unaffected (they keep their original appointment). 
       But what if the swap system leads to a reduction in the number of slots available for non-opt-in patients? It shouldn't because we are only using unused slots. However, if a slot in department A is swapped to a patient from department B, then if a patient from department A later wants that slot, they cannot have it. But the slot was going to be unused otherwise. So without the swap, the slot would have been wasted. Therefore, non-opt-in patients are not harmed.

     However, there is a scenario: what if the unused slot in department A could have been used by a last-minute patient from department A? But the proposal is to use only slots that are about to go unused (say, within 24 hours). So if there is a possibility of a last-minute booking in the same department, then we are taking that opportunity away. To avoid harm, the system must ensure that the slot is truly unused (i.e., no chance of being filled by the original department). This requires a clear definition of "unused".

     - Group S: Staff might be worse off if they are forced to see patients they are not prepared for, or if the swapping causes scheduling conflicts. In the worst-case scenario, staff may experience increased stress and errors. Therefore, we need to ensure that staff are adequately trained and that the system does not overload them.

     Without mitigation, Group S (staff) might be harmed in some scenarios.

   Step 5: Check for improvement: Group P (opt-in) is better off. Group H (system) is better off.

   Step 6: Robustness: 
     - For Group P: We must ensure that the swap does not lead to any patient (even those who don't opt-in) having fewer available slots. We must define "unused" very carefully (e.g., only slots that are still empty 24 hours before the appointment time). Also, the system must be opt-in and patients must be fully informed (so they don't end up in a department that is not appropriate for their condition).
     - For Group S: We need to ensure that the staff are consulted and that the system is designed to not increase their workload beyond a manageable level. We might need to run a pilot and collect feedback.

     Without these safeguards, the proposal might cause harm.

   Step 7: If we can design the system so that:
     - Only truly unused slots (that would otherwise go empty) are swapped.
     - Only patients who opt-in are swapped, and they are fully informed.
     - Staff are trained and the system is implemented with their input so that it does not cause undue burden.

     Then the harm can be mitigated. However, if we cannot guarantee that staff will not be worse off (e.g., if it leads to more complex work without additional compensation), then we have harm.

     If we can show that in all plausible scenarios staff are not worse off (e.g., because the number of patients seen remains the same and they are just distributed differently, or because the system reduces idle time and thus overall workload doesn't increase) then the proposal passes. Otherwise, we must have a mitigation plan (e.g., additional staffing during transition, training, or compensation for increased complexity).

   Step 8: Decision: 
     - Without mitigation, the proposal fails because of potential harm to staff. 
     - With mitigation (ensuring no harm to staff and proper safeguards for patients), it could pass Step 4. Then we would check again.

     Also, note: if the staff are compensated for any additional burden (e.g., with bonuses or reduced workload elsewhere) then that might eliminate harm. But the safe Pareto criterion does not require compensation? Actually, it requires that no group is worse off. So if we can ensure that staff are not worse off (by compensating them or by designing the system so that their burden doesn't increase) then we pass.

   What the procedure cannot settle:

   1. When there are negligible harms: The procedure requires a definition of "negligible", which is a value judgment. The director must decide what level of harm is acceptable.

   2. When the proposal fails the safe Pareto criterion but might be desirable on other grounds (e.g., large overall net benefit). This procedure would reject such proposals because it does not allow compensation. Therefore, the procedure cannot be used for Kaldor-Hicks efficiency improvements.

   3. When there is uncertainty that cannot be resolved: If we cannot rule out harm in some low-probability scenarios, then we must reject. But if the director is willing to take the risk, then the procedure would require an override (which is outside the safe Pareto framework).

   4. When the groups are not clearly defined or when there are externalities to groups not initially considered.

   Where it is likely to misfire:

   1. If the evidence gathering is inadequate (e.g., missing a key affected group or a plausible scenario), then the procedure might pass a proposal that actually causes harm.

   2. If the definition of "harm" is too narrow (e.g., only considering financial harm and not time or convenience) then it might pass a proposal that causes non-financial harm.

   3. If the forecasting is overly optimistic or pessimistic, the robustness check might be flawed.

   4. When the proposal involves very small harms to a large number of people and large benefits to a few, the procedure might reject it even if it would be desirable under a utilitarian approach. However, the procedure is designed to avoid such trade-offs.

   Conclusion: The procedure is designed to be cautious and to avoid any harm. It is best suited for proposals where we can clearly identify the affected groups and forecast the impacts with reasonable certainty.
answer: |-
  ### Decision Procedure for Safe Pareto Improvements

  **Core Principle**: A proposal passes only if it improves at least one group by its own preferences while making no group worse off, with assessments holding across plausible forecasts. Uncompensated losses (even if outweighed gains) fail the test.

  **Procedure Steps** (45 min max; staff completes Steps 1–5, Director signs off at Step 6 if needed):

  #### **Step 1: Identify Affected Groups** (5 min)  
  - *Standard*: List all groups experiencing material changes (e.g., bus riders, clinic staff, data users).  
  - *Reject if*: Any key group is omitted.  
  - *Evidence*: Proposal documents, stakeholder maps.  

  #### **Step 2: Forecast Impacts** (10 min)  
  - *Standard*: For each group, project outcomes under **3 scenarios**: optimistic, pessimistic, and most likely. Use historical data or expert input.  
  - *Reject if*: Forecasts rely on unsupported assumptions (e.g., "riders will adapt quickly").  
  - *Evidence*: Past similar changes, pilot studies, or departmental estimates.  

  #### **Step 3: Check for Absolute Harm** (10 min)  
  - *Standard*: **No group is worse off** in any scenario by their own preferences (e.g., time, cost, access).  
  - *Reject if*: Any group faces uncompensated losses (e.g., longer walks, higher workload).  
  - *Evidence*: Surveys, usage data, or focus group feedback showing preferences.  

  #### **Step 4: Verify Genuine Improvement** (5 min)  
  - *Standard*: **At least one group is better off** in all scenarios, with benefits they affirm (e.g., shorter waits).  
  - *Reject if*: Improvements are speculative or offset by hidden costs.  
  - *Evidence*: Quantifiable gains (e.g., time saved, throughput increased).  

  #### **Step 5: Robustness Test** (10 min)  
  - *Standard*: Outcomes hold under **sensitivity analysis** (e.g., 20% lower demand, 15% staff turnover).  
  - *Reject if*: Harm emerges in ≥1 plausible scenario (e.g., bad weather worsening walk times).  
  - *Evidence*: Scenario modeling, risk assessments.  

  #### **Step 6: Value Judgment Gate** (5 min review)  
  - *Director sign-off required*: If all checks pass **but** losses are deemed "negligible" (e.g., <3 min walk increase). Staff must document:  
    - Why losses are negligible *to the affected group*.  
    - Why compensation (e.g., added shelters) is infeasible.  
  - *Non-negotiable*: Director cannot override uncompensated material harm.  

  ---

  ### **Application to Proposals**

  #### **Proposal 1: Bus Route Consolidation**  
  - *Affected Groups*:  
    - **Housing Estate Riders** (new 10-min walk vs. old 2-min).  
    - **Other Commuters** (more frequent buses).  
    - **Transit Agency** (lower operating costs).  

  - *Step 2 Forecasts*:  
    - Optimistic: All riders value frequency > walk time.  
    - Pessimistic: Estate riders (elderly/disabled) struggle with walk; some abandon buses.  
    - Likely: 15% of estate riders quit buses; others tolerate walk.  

  - *Step 3 Check*: **Fails**. Housing estate riders worse off in pessimistic/likely scenarios (longer walk = time loss, discomfort). Uncompensated harm.  
  - *Step 4 Check*: Passes (other commuters gain).  
  - *Verdict*: **Reject outright**. Harm to estate riders violates safe Pareto.  

  #### **Proposal 2: Clinic Appointment Swapping**  
  - *Affected Groups*:  
    - **Patients** (faster appointments via swaps).  
    - **Staff** (new coordination tasks).  
    - **Departments** (higher resource utilization).  

  - *Step 2 Forecasts*:  
    - Optimistic: Swaps cut wait times 30%; staff adapt quickly.  
    - Pessimistic: Double-bookings cause chaos; staff burnout increases.  
    - Likely: Short-term errors frustrate staff; long-term efficiency gains.  

  - *Step 3 Check*: **Fails** in pessimistic scenario (staff workload → burnout = harm).  
  - *Step 4 Check*: Passes (patients gain access speed).  
  - *Step 5 Robustness*: Fails if staff shortages occur (common scenario).  
  - *Verdict*: **Reject** unless redesigned with staff safeguards (e.g., training, temp hires).  

  ---

  ### **Limitations and Failure Points**  

  #### **What the Procedure Cannot Settle**  
  1. **Non-quantifiable trade-offs**: E.g., privacy loss from data sharing vs. efficiency gains.  
  2. **"Negligible harm" thresholds**: Defining "minor" losses (e.g., 4-min walk) requires Director judgment.  
  3. **Long-term/societal impacts**: E.g., environmental effects of bus changes.  

  #### **Where It May Misfire**  
  1. **Overlooking hidden groups**: E.g., failing to identify indirect stakeholders (nearby businesses affected by bus stops).  
  2. **Forecast bias**: Over-optimism in projections (e.g., assuming tech fixes for clinic swaps).  
  3. **Misjudging preferences**: Assuming "efficiency" outweighs staff autonomy without evidence.  
  4. **Compensation blind spot**: Proposals with compensable harm (e.g., free umbrellas for walkers) may be rejected prematurely.  

  **Conclusion**: This procedure ensures no group bears net losses but requires rigorous evidence. It fails proposals with unmitigated harm or forecast fragility, directing contentious value calls to the Director. It is weakest in ambiguous trade-offs and hidden externalities.
