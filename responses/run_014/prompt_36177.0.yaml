prompt: |-
  After a career in psychophysics — mostly contrast adaptation and aftereffects, in the tradition of the vision laboratories of the 1980s and 90s — I have lately been reading philosophy of perception, and I keep encountering the claim that belief, desire, or conceptual know-how penetrates experience itself: the oenologist tasting the vintage that a novice cannot, the racially primed subject seeing a face as angrier than it is, the fisherman seeing a catch where I see weeds. Before I evaluate any theory of this, I want the specification first. State the desiderata that any adequate theory of cognitive penetrability must meet: which empirical phenomena it must accommodate without reclassifying every top-down effect as attention, adaptation, or response bias; which distinctions it must respect — penetration proper versus pre-perceptual tuning of the inputs versus post-perceptual judgment, and effects on perceptual content versus effects on phenomenology alone; what it must say about the epistemic consequence, since an experience that has been shaped by a belief seems unable to serve as independent testimony for that very belief; and how it must handle the stubbornness of illusions, which refuse to shrink no matter how often I have measured the lines and know them to be equal. For each requirement, give the case or consideration behind it, and mark which requirements are non-negotiable and which are merely the prejudices of one camp. Then say which pair of the desiderata, if any, cannot be jointly satisfied — my suspicion, from the laboratory, is that a theory that both captures the expert's genuine perceptual advantage and preserves the epistemic constraint is impossible, but I would like to see the argument. Close with a brief scorecard of predictive-coding accounts, where priors reach down into perception itself, against your list. Lead with your bottom line in the first sentence, then give the reasoning; no preamble, and do not restate my question.
reasoning: |-
  Hmm, the user is a former psychophysics researcher with expertise in contrast adaptation and aftereffects, now exploring philosophy of perception. They're encountering claims about cognitive penetrability—how beliefs or concepts might shape perceptual experience itself—and they want a structured framework for evaluating theories on this topic before diving into specific models.

  The user clearly wants desiderata (essential requirements) for any adequate theory of cognitive penetrability. They mention several key concerns: distinguishing true penetration from attention/adaptation/bias, handling epistemic consequences (how belief-shaped experiences can justify those same beliefs), and explaining stubborn illusions. They also suspect a tension between accounting for expert perception and maintaining epistemic integrity.

  From their background, I recognize they'll expect rigorous distinctions like:
  - Pre-perceptual tuning (e.g., attentional priming) vs. penetration proper
  - Effects on perceptual content (what's seen) vs. phenomenology (how it feels)
  - Post-perceptual judgment confounds

  Their skepticism about predictive coding suggests they've seen overly ambitious claims about priors "reaching down" into perception. As a lab scientist, they'll prioritize empirical adequacy over philosophical elegance.

  The core tension they identify—between expert advantages (e.g., oenologist tasting nuances) and epistemic constraints (circular justification)—is astute. I'll need to show why these pull theories in opposite directions: one requires beliefs to alter perception, the other requires perception to remain belief-independent for justification.

  For the scorecard, predictive coding excels at framing priors as perception-shaping but struggles with immunity to reason (e.g., Müller-Lyer illusion persisting despite knowledge) and risks overextending "penetration" to trivial cases. I should note where it handles cross-cultural variation well but stumbles on illusions.

  Non-negotiables must include:
  1. Immunity to reason (stubborn illusions)
  2. Avoiding trivialization (not calling all top-down effects penetration)
  3. Epistemic constraint (to prevent circular justification)

  Versus negotiables like:
  - Whether phenomenology changes are sufficient for penetration
  - Whether conceptual vs. non-conceptual content matters

  The closing scorecard should be frank: predictive coding is powerful for explaining adaptive perception (e.g., Bayesian cue integration) but falters on illusions and risks epistemic circularity unless heavily constrained.
answer: |-
  **Bottom line:** Any adequate theory of cognitive penetrability (CP) must satisfy six core desiderata, with three non-negotiable requirements (1, 2, 6) and three negotiable ones (3, 4, 5), but a fundamental tension exists between desiderata 4 (expert advantage) and 6 (epistemic constraint), making their joint satisfaction impossible without compromising perceptual realism or epistemic justification.

  ### Desiderata for a Theory of Cognitive Penetrability:
  1. **Accommodate Paradigm Cases Without Trivialization**  
     *Requirement:* Explain cases like the oenologist tasting nuanced flavors or the racially primed subject misperceiving anger *as genuine perceptual changes*, not merely attentional shifts (e.g., focusing on tannins), adaptation (e.g., contrast aftereffects), or response bias (e.g., reporting anger due to expectation).  
     *Case:* The expert fisherman *sees* the fish camouflaged in weeds, while the novice sees only weeds—suggesting perception itself is altered by knowledge.  
     *Status:* **Non-negotiable.** Failure reduces CP to post-perceptual judgment or noise.

  2. **Respect the "Immunity to Reason" of Illusions**  
     *Requirement:* Explain why some percepts (e.g., Müller-Lyer illusion) persist despite *knowing* the lines are equal, resisting cognitive correction.  
     *Case:* Measuring the Müller-Lyer lines proves equality, yet the illusion endures, implying limits on cognitive penetration.  
     *Status:* **Non-negotiable.** Violation contradicts foundational psychophysical data.

  3. **Distinguish Penetration from Pre-Perceptual Tuning & Post-Perceptual Judgment**  
     *Requirement:* Separate CP (beliefs altering *online* perceptual processing) from pre-perceptual effects (e.g., priming attention to wine attributes) or post-perceptual effects (e.g., interpreting ambiguous sensations as "angry").  
     *Case:* Racial priming altering early visual ERP components (N170) suggests penetration; post-hoc rating biases do not.  
     *Status:* **Negotiable.** Some theories (e.g., predictive coding) blur these lines intentionally.

  4. **Capture Genuine Perceptual Advantages of Expertise**  
     *Requirement:* Explain how expertise (e.g., oenology) enables novel perceptual discriminations inaccessible to novices, without reducing to learned associations.  
     *Case:* The oenologist distinguishes Merlot from Cabernet by taste alone—a perceptual, not cognitive, feat.  
     *Status:* **Negotiable.** Empiricists may attribute this to sensory learning, not CP.

  5. **Specify Effects on Content vs. Phenomenology**  
     *Requirement:* Clarify whether cognition alters *what* is perceived (e.g., seeing a fish) or merely *how* it feels (e.g., heightened salience of weeds).  
     *Case:* Does racial priming change the *facial expression* seen (content) or just its perceived intensity (phenomenology)?  
     *Status:* **Negotiable.** Some philosophers (e.g., Siegel) prioritize content; others (e.g., Block) focus on phenomenology.

  6. **Resolve the Epistemic Constraint**  
     *Requirement:* Address how perception penetrated by belief (e.g., seeing a face as angry due to bias) can provide independent justification for beliefs without circularity.  
     *Case:* If belief shapes experience, that experience cannot "testify" against the belief (e.g., biased perception reinforcing racial stereotypes).  
     *Status:* **Non-negotiable.** Violation undermines perception’s role in rational belief revision.

  ### Tension Between Desiderata:
  - **Desiderata 4 & 6 cannot be jointly satisfied:**  
    To capture the expert’s advantage (4), cognition must alter perceptual content (e.g., the oenologist’s gustatory experience is structurally richer). But this entails that the experience is partly constituted by prior belief/knowledge, violating the epistemic constraint (6): the experience cannot independently justify the expert’s belief (e.g., "This is a 2010 Bordeaux") because it is shaped by that very belief. Illusions (desideratum 2) heighten this tension—they show perception’s *resistance* to cognition, yet expertise shows its *malleability*.

  ### Scorecard for Predictive Coding (PC) Theories:
  - **Accommodates Paradigm Cases (1):** Strong. PC treats priors (beliefs) as actively shaping sensory signals (e.g., explaining expert wine perception as precision-weighted priors enhancing relevant features).  
  - **Immunity to Reason (2):** Weak. PC struggles with stubborn illusions, as higher-level priors (knowing lines are equal) should correct lower-level predictions; often resorts to "entrenched priors" or hyper-precision in error units.  
  - **Pre-/Post-Perceptual Distinction (3):** Poor. PC inherently blurs this, as priors continuously constrain perception in a bidirectional hierarchy.  
  - **Expert Advantage (4):** Strong. PC frames expertise as optimized priors enabling finer-grained prediction errors (e.g., sommelier detecting subtle flavor differences).  
  - **Content vs. Phenomenology (5):** Ambiguous. PC equates content with successful prediction, but phenomenology is underspecified.  
  - **Epistemic Constraint (6):** Poor. PC’s circularity (priors generate the evidence that confirms them) risks doxastic bootstrapping, failing to explain perceptual justification.  

  **Result:** PC excels at mechanistic explanations of learning and expertise (1,4) but fails epistemic and illusion constraints (2,6) due to its circular architecture.
