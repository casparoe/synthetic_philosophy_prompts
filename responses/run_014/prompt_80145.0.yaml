  ### How to Use  
  - **Teaching Focus**: Highlight how the scale argument is **blocked** in most positions (9/12 leaves) due to rejecting expected-value uncertainty or aggregation.  
  - **Debate Hook**: Use the "awkward commitments" to spark discussion (e.g., *"Must we really prioritize insects over humans if we accept Graded Utilitarianism?"*).  
  - **Visual Aid**: Convert this into a flowchart with branches labeled by the questions and leaves color-coded for scale argument vulnerability (green = reaches, red = blocked).  

