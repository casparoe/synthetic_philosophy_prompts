  Hmm, the key here is to reverse-engineer the friend's underlying rule from her existing pattern. Her verdicts consistently grant original intentionality only to biological systems (bacteria, humans) while denying it to artificial systems (thermostat, two-bitser, LLM). That suggests a biological criterion - which would classify the robot case as derived since it's non-biological. 

  But wait, there's an equally plausible alternative: the systemic autonomy rule. This would focus on whether the system generates its own goals rather than serving external purposes. The existing verdicts still fit - bacteria pursue nutrients for themselves, while thermostats serve human goals. The robot two-bitser becomes interesting here: if the robot has an independent energy-seeking goal and the bit helps achieve it, autonomy theory might grant original intentionality. 

