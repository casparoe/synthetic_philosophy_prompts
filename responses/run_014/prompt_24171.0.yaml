prompt: |-
  I'm working through the original/derived intentionality distinction with a philosopher friend who has firm verdicts on a series of cases. So far: a thermostat's temperature "reading" is derived; a bare two-bitser (a device with two binary states, causally isolated from any larger system) is derived; a bacterium chemotaxing toward a nutrient gradient is original; a human is original; a large language model's apparent beliefs are derived. The new case is a two-bitser wired into a small robot so that one bit causally controls its behavior — bit 1 "on" makes the robot turn toward a light, bit 1 "off" makes it turn away — so the bit's causal role is fixed by the circuitry rather than by any interpreter. Predict her verdict, identify the rule she seems to be running and the other rule that fits her verdicts just as well, say what each predicts for the robot two-bitser, and name the further case that would best tell the two rules apart.
