  We are designing an activity for a 75-minute seminar on practical reason, focusing on the sunk cost fallacy but with a twist: we want to show that the standard advice "ignore sunk costs" can be misleading because prior investments can sometimes be (b) a live asset or (c) a change in identity/expectations, not just (a) pure waste.

  We'll create a portfolio of ongoing projects for students to triage (continue or kill). Each project will have a backstory that secretly falls into one of the three categories. The activity will have:
  1. Rules and roles
  2. A scoring scheme (no real money)
  3. Timeline for 75 minutes
  4. Debrief that maps specific moments to the three-way distinction and then opens the harder question.

  First, brainstorm project scenarios that isolate one of the three cost kinds:

  **Project Scenarios:**

  1. **Pure Waste (Category A):** A project where the prior investment is truly gone and irrelevant to future outcomes.
     - *Example:* You've spent $10,000 on a software development project that is now obsolete because a better, free alternative has become available. Continuing would require an additional $5,000 and yield no benefits because the software won't be used. The $10,000 is gone regardless.
     - *Why it isolates:* The prior cost has no bearing on the future. The only reason one might want to continue is to avoid feeling the loss, but that would be irrational.

  2. **Live Asset (Category B):** A project where the prior investment has created an asset that still has value and can be utilized.
     - *Example:* You paid a non-refundable $5,000 deposit for a conference venue. Now you are considering canceling the conference because of low expected attendance. However, the deposit isn't just a loss: it's a live option because you can still use the venue for a smaller event or repurpose it (e.g., as a co-working space for a month). The deposit is an asset that you own and can use in a different way than originally planned.
     - *Why it isolates:* The prior cost isn't sunk in the sense that it has created a currently available asset (the right to use the venue). The decision to continue or kill should factor in the value of that asset.

  3. **Change in Identity or Expectations (Category C):** A project where prior investment has changed who you are or what others expect, thereby altering the value of the options.
     - *Example:* You've been working for 3 years on a research project on ancient philosophy, presenting at conferences and building a reputation in that area. Now you realize the project is unlikely to yield significant results. However, abandoning it would mean letting down colleagues who expect you to complete it, and it would force you to redefine your academic identity. The time and effort have shaped your identity and others' expectations, which affects the value of continuing (e.g., maintaining relationships and reputation) versus quitting (e.g., loss of credibility in that circle).
     - *Why it isolates:* The prior investment has changed the context of the decision. The cost isn't just about money or time spent; it's about the social and personal identity that has been built.

  Now, we design the activity:

  **Activity Title:** Project Triage: When Sunk Costs Aren't Sunk?

  **Goal:** Students, in small groups, will evaluate a portfolio of 6 projects (2 of each category) and decide whether to continue or kill each one. The scoring will reward decisions that correctly account for the type of cost.

  **Setup:**
  - 18 students -> 6 groups of 3 students each.
  - Each group gets a packet with 6 project descriptions (each on a separate page). The descriptions will include:
    - The project name and goal.
    - The amount of money and time already invested (the "sunk cost").
    - The future costs and benefits of continuing (quantified in points).
    - Additional context that reveals the category (without explicitly stating it).

  **Rules:**
  1. Groups have 25 minutes to read all projects and make a decision (continue or kill) for each.
  2. For each project, they must record:
     - Their decision.
     - A brief reason for the decision.
