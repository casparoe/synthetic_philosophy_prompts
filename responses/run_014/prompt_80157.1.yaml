  2. **Project A2 (Pure Waste):** Marketing Campaign
     - Prior cost: $50,000 for a campaign that is now irrelevant because the product is recalled.
     - Future if continue: spend $20,000, benefit $0 -> net -$20,000
     - Future if kill: $0
     - Scoring: Continue: -20 points, Kill: 0 points.

  3. **Project B1 (Live Asset):** Data Analytics Software Project (as above)
     - Prior cost: $50,000 (license) + $20,000 (development) = $70,000 sunk.
     - Future if continue: net -$25,000 (as calculated: $5,000 - $30,000 opportunity cost)
     - Future if kill: sell license for $30,000 -> +$30,000
     - Scoring: Continue: -25 points, Kill: +30 points.

  4. **Project B2 (Live Asset):** Concert Promotion
     - Prior cost: $8,000 deposit for the band.
     - Future if continue: spend $12,000, get $15,000 -> net +$3,000
     - Future if kill: $0 (and lose the deposit, which is sunk, but note: the deposit is sunk so killing doesn't cost extra, but you get nothing)
     - Wait, this is not showing the opportunity cost. Let's redesign to include an alternative use?
     - *Redesign:* 
          - You can use the deposit to host a smaller event with local bands. This would cost an additional $5,000 and bring in $10,000. 
          - But then we have three options? We want two.
     - *Stick to two options and ensure the asset is only utilized by one option:*
          - Future if continue: spend $12,000, get $15,000 -> net +$3,000
          - Future if kill: you can use the deposit to host a smaller event: spend $5,000, get $10,000 -> net +$5,000
          - But then kill and repurpose is better. But we only want two options: continue (original) or kill (which means abandon completely). 
          - Let's change: 
            - Continue: proceed with the original concert -> net +$3,000
            - Kill: abandon completely -> net 0
          - But then continue is better. And the deposit is a live asset that enables the $3,000 gain. The standard advice would say continue. 
          - We want a live asset example where killing is better because of an opportunity cost. So we'll use the software license example for B1 and for B2 we can do:

     - **Project B2 (Live Asset):** Real Estate Development
          - Prior cost: $200,000 for purchasing land and initial designs.
          - Future if continue: build a shopping mall, which will cost $1,000,000 and yield $1,100,000 -> net +$100,000
          - Future if kill: sell the land and designs to a competitor for $150,000.
          - So the net future of continue: $100,000
          - Net future of kill: $150,000
          - But wait, this is similar to the software license: kill is better. 
          - However, the opportunity cost of not selling is $150,000. So continue: $100,000 - $150,000 = -$50,000? No, because if you continue, you are not selling, so you forgo the $150,000. But you get $100,000 from the mall. So the net of continue is $100,000. The net of kill is $150,000. So kill is better by $50,000.
          - Scoring: Continue: +100 points, Kill: +150 points? 
          - But then the difference is $50,000. 
          - Alternatively, we can score from the current state:
            - Continue: spend $1,000,000, get $1,100,000 -> net +$100,000
            - Kill: get $150,000
          - So kill is better. 
          - The live asset is the land and designs, which can be sold. 
          - The trap: if they think they must continue to recoup the $200,000, they might continue even though kill yields more.

  5. **Project C1 (Identity/Expectations):** Academic Research Project (as above)
     - Scoring: Continue: 0 points (expected), Kill: -20 points

  6. **Project C2 (Identity/Expectations):** Family Business
     - Backstory: You inherited a family business (a restaurant) and have invested $100,000 of your own money into it. It is losing money. If you continue, it will lose $20,000 per year. If you shut it down, you will save $20,000 per year but will cause a rift in the family and lose your standing as the heir. This would cost you emotionally and in terms of family support, valued at $50,000.
     - Future if continue: -$20,000 per year (for the next 5 years, say) -> -$100,000
     - Future if kill: -$50,000 (family rift) + save $20,000 per year for 5 years -> -$50,000 + $100,000 = +$50,000
     - But then kill is better. We want continue to be better because of identity? 
     - *Redesign:*
          - If you kill: you lose family standing worth $50,000 per year (ongoing) and save $20,000 per year. We can do one-year decision for simplicity.
          - Future if continue for one more year: -$20,000 (financial) but maintain family standing (which is worth $0 in financial terms for this year? Or we can say it avoids a one-time loss of $50,000).
          - Let's set:
            - Continue: cost $20,000, benefit: avoid the family rift cost (which is $50,000) -> net +$30,000? 
            - Kill: save $20,000 but incur $50,000 family rift cost -> net -$30,000.
          - So continue is better. 
          - Scoring: Continue: +30 points, Kill: -30 points.

     - Or to make it closer to your experience: the investment has changed who you are. If you kill, you lose your identity as the family business heir, which is very valuable to you. 

  **Final Project List for Portfolio:**
  - A1: Obsolete Software (Pure Waste) -> Kill is better.
  - A2: Marketing Campaign (Pure Waste) -> Kill is better.
  - B1: Data Analytics Software (Live Asset) -> Kill and sell license is better.
  - B2: Real Estate Development (Live Asset) -> Kill and sell the land is better.
  - C1: Academic Research (Identity) -> Continue is better (or at least not worse, but in our scoring continue is better than kill).
  - C2: Family Restaurant (Identity) -> Continue is better.

  But wait, in the scoring for C1 we have continue:0, kill:-20 -> so continue is better.
  In C2: continue: +30, kill: -30 -> continue is better.

  **Scoring Rules for Students:**
  - They won't know the scoring until after they make decisions.
  - After they decide, we give them a scoring key for each project that shows the points for their decision.

  **Activity Timeline (75 minutes):**
  1. Introduction (5 minutes): Explain the activity. Groups of 3 will act as a project management committee for a company. They have a portfolio of 6 projects. For each, they must decide: continue or kill. They have 25 minutes to decide on all 6.
  2. Group Work (25 minutes): Groups read the project descriptions and decide. They record decisions and reasons.
  3. Scoring and Reveal (15 minutes): Hand out the scoring key. Groups calculate their total score.
  4. Discussion (30 minutes): 
     - First, ask groups to share their total scores and which projects were hardest.
     - Then, debrief project by project, focusing on the reasons groups gave for their decisions. 
     - For each project, reveal the category (without initially naming A, B, C) and how the scoring worked. 
     - Highlight:
          - For pure waste (A1, A2): the sunk cost should be ignored. Any decision to continue because of the prior cost is irrational.
          - For live asset (B1, B2): the prior cost created an asset that should be considered in the decision. The standard advice to ignore sunk costs does not mean to ignore the current asset.
          - For identity/expectations (C1, C2): the prior cost has changed the context (reputation, identity, expectations) which affects the value of the options. Ignoring these factors would be a mistake.
     - Then, introduce the three categories explicitly.
     - Finally, open the harder question: Is it irrational to let history reshape your preferences (as in identity/expectations) or is that just what preferences are? And for live assets, are they really sunk costs or are they current assets?

  **What will predictably go wrong:**
  1. **Time pressure:** 25 minutes for 6 projects is tight. Groups might not read carefully and miss key details (like the opportunity to sell the license in B1). 
  2. **Scoring confusion:** Students might not understand the scoring, especially for the live asset and identity projects, where opportunity costs and reputation are quantified.
  3. **Misapplication of sunk cost:** Students might fall into the sunk cost fallacy even in the pure waste projects, or they might ignore the live asset because they think it's sunk.
  4. **Group dynamics:** Some groups might have dominant members who sway the decision without proper discussion.
  5. **Harder question:** The activity cannot reproduce the deep personal and emotional aspects of identity change. In the activity, we quantify reputation and identity in points, but in reality, these are hard to measure and involve complex emotions and social dynamics. You must supply this insight in the debrief: that while we can quantify for the activity, in real life these factors are often incommensurable with money and involve personal values that are shaped by our history. The philosophical question is whether it is rational to let your history shape your values or whether that is a form of irrational commitment.

  **You must supply in the debrief:** 
  - The activity simplifies by quantifying identity and reputation. In reality, these are qualitative and deeply personal. The harder question is: if our past investments change who we are, then the value we assign to options is inherently historical. Is it irrational to be influenced by this history, or is it simply that our preferences are formed by our experiences? This relates to the concept of "transformative experience" and identity-constituting commitments. 

  This design should meet your goals. Let me know if you want any adjustments.
answer: |-
  ### Brainstorm: Project Scenarios Isolating Each Cost Kind  
  **Design Goal:** Each scenario must present prior costs that appear "sunk" but secretly fall into one category—**(a) pure waste**, **(b) live asset**, or **(c) identity/expectations shift**—with no overlap. Students must *discover* through decision-making that costs are only irrelevant if options' value is history-independent.  

  1. **Pure Waste (Isolates Category A: Costs Truly Gone)**  
     - **Project:** *Quantum Computing Chip Fabrication*  
     - **Backstory:** Spent $800K developing a quantum chip. New research shows the core design is fundamentally flawed (impossible to stabilize).  
     - **Options:** Continue ($200K more; certain failure) or Kill ($0).  
     - **Why It Isolates:** The prior investment created *no salvageable asset* (no patents, no usable data). Continuation is pure loss. Students must ignore the $800K to avoid throwing good money after bad.  

  2. **Live Asset (Isolates Category B: Purchased Option Still Active)**  
     - **Project:** *Tropical Bioprospecting License*  
     - **Backstory:** Paid $500K for a non-refundable 5-year license to research rare plants in Costa Rica. Research stalled after Year 1 ($300K spent).  
     - **Options:** Continue ($100K/year; 40% chance of $1M drug discovery) or Kill ($0; license expires unused).  
     - **Why It Isolates:** The license is a *transferable asset* (worth $200K if sold to a competitor). Killing wastes this option. Students must recognize the license as a live opportunity, not a sunk cost.  

  3. **Identity/Expectations Shift (Isolates Category C: Altered Self/Social Context)**  
     - **Project:** *Urban Sculpture Installation*  
     - **Backstory:** Invested $400K and 2 years in a public art project. City planners now oppose it. Your reputation as a "public artist" is tied to completion.  
     - **Options:** Continue ($100K more; 50% chance of acclaim, 50% ridicule) or Kill (lose credibility; colleagues view you as unreliable).  
     - **Why It Isolates:** Prior costs reshaped your *identity* (artist role) and *others' expectations*. Continuation has symbolic value beyond profit. Students must weigh identity costs, not just finances.  

  ---

  ### Activity Design: "Project Triage Challenge"  
  **Objective:** Students triage 6 projects (2 of each category) by voting "Continue" or "Kill." Scoring reveals that "ignore sunk costs" is misleading for (b) and (c).  

  #### Rules & Roles  
  - **Groups:** 6 teams of 3 students.  
  - **Roles per Team:**  
    - **Economist:** Focuses on cash flows/statistical outcomes.  
    - **Sociologist:** Considers reputation/team dynamics.  
    - **Strategist:** Weighs long-term opportunities.  
  - **Materials:** Project portfolio (6 cards), voting tokens (green=Continue, red=Kill), scorecard.  

  #### Scoring Scheme (Points = Virtual Currency)  
  - **Pure Waste (A):**  
    - Kill: **+0 pts** (avoid future loss)  
    - Continue: **–200 pts** (future costs with no benefit)  
  - **Live Asset (B):**  
    - Kill: **–100 pts** (wasting the asset’s option value)  
    - Continue: **+50 to +300 pts** (scaled by probability of success)  
  - **Identity/Expectations (C):**  
    - Kill: **–150 pts** (reputational/identity loss)  
    - Continue: **+0 to +200 pts** (scaled by symbolic/social gain)  

  #### Timeline (75 Minutes)  
  1. **Intro (5 min):** Frame as "corporate board meeting." Teams must triage projects to maximize points. Emphasize: *"Past costs are incurred—focus on future outcomes."*  
  2. **Team Deliberation (25 min):**  
     - Teams review projects, debate using role perspectives.  
     - Secret vote per project (tokens in box).  
  3. **Scoring & Reveal (15 min):**  
     - Instructor reveals point outcomes for each project based on votes.  
     - Teams calculate total scores.  
  4. **Debrief (30 min):**  
     - **Step 1:** Map projects to categories A/B/C. Ask: *"When did ‘ignore sunk costs’ backfire?"* (e.g., killing a live asset).  
     - **Step 2:** Discuss why B/C defy the slogan:  
       - *Live Asset:* "You bought a ticket—not using it is wasting what you *own*."  
       - *Identity Shift:* "Quitting changes who you are—that *itself* is a cost."  
     - **Step 3:** Pose the hard question: *"Is it irrational for history to reshape your preferences, or is that just what it means to have preferences?"*  

  ---

  ### Predictable Challenges & Limitations  
  **What Will Go Wrong:**  
  1. **Teams Misattribute Categories:** Students will initially treat *all* prior costs as pure waste. Live assets (B) will be killed (losing points), while identity projects (C) spark overconfidence in continuation ("We’ve committed, so we must finish").  
  2. **Role Conflict:** Economists will dominate, dismissing sociologists’ "soft" concerns. This mirrors real-world undervaluing of social capital.  
  3. **Scoring Confusion:** Point values for identity (C) will feel arbitrary. Students may protest: *"How can you quantify reputation?"*  

  **What the Activity Can’t Replicate (You Must Supply):**  
  The activity quantifies identity costs (e.g., "–150 pts for credibility loss"), but **real identity shifts are *existential*, not computational**. In debrief, emphasize:  
  - *"Your research investment didn’t just waste money—it made you ‘the person pursuing X.’ Letting go isn’t a spreadsheet decision; it’s identity surgery. Is that irrational? Or is rationality itself defined by the self you’ve become?"*  
  This bridges to philosophers like Christine Korsgaard (self-constitution) or L.A. Paul (transformative experience).  

  ---

  ### Project Portfolio (Abridged)  
  | Project                 | Prior Costs         | Future If Continue                          | Future If Kill                     | Hidden Category |  
  |-------------------------|---------------------|--------------------------------------------|------------------------------------|----------------|  
  | Quantum Chip            | $800K               | –$200K; guaranteed failure                 | $0                                 | A (Pure Waste) |  
  | AI Chatbot              | $500K               | –$100K; obsolete tech, no demand          | $0                                 | A (Pure Waste) |  
  | Bioprospecting License  | $500K license       | –$100K; 40% chance of $1M drug discovery   | License expires (asset wasted)     | B (Live Asset) |  
  | VR Education Platform   | $300K dev + $200K IP| –$50K; 60% chance of $400K partnership     | IP expires unsold (asset wasted)   | B (Live Asset) |  
  | Urban Sculpture         | $400K + 2 years     | –$100K; 50% acclaim (+$200K), 50% ridicule | Reputation loss; seen as unreliable | C (Identity)   |  
  | Community Garden Network| $250K + volunteer trust | –$50K; strengthens local ties            | Erodes community trust             | C (Identity)   |  

  **Outcome:** Students experience the slogan’s failure firsthand. Debrief ties to your research dilemma—sometimes "sunk costs" aren’t sunk; they’re seeds of a new self.
