prompt: |-
  I'm taking a course on the ethics of extinction, and I keep getting stuck on what I'll call the species problem, which I think has two layers that usually get conflated. The first is the ethical layer: do species have value in themselves, over and above the value of the individuals that make them up, or is all that ultimately matters the welfare of individual animals? The second, prior layer is the biological one: what a "species" even is, since I don't think the biology hands us a single clean answer, and I suspect my ethical intuitions are quietly tracking whichever concept of species is most convenient for them. I've been trying to sort out what I actually think by going through a set of cases, and I'd like to know what principle, if any, captures the pattern.

  Here are my verdicts. The last individual of a well-known, beloved species — say the last northern white rhinoceros, or the last black-footed ferret — I think we have a strong obligation to save, even at considerable cost. But a species that turns out to be a complex of several cryptic species, where the one "going extinct" is just the member recently split off by a reclassification, I feel noticeably less urgency about, even though the actual individuals and their lives are the same. An invasive species that is driving native species to extinction — the brown tree snake on Guam, or an invasive predator in New Zealand — I think we should eradicate, and that doing so is a good thing. A species that went extinct centuries ago, the dodo, I feel was a tragedy, but I have no obligation now; a species that went extinct sixty-five million years ago, the non-avian dinosaur, I feel no tragedy at all. A hybrid population between two closely related species that is dying out, I don't feel is a "species" going extinct, though I do feel the individual animals matter. A domesticated species, the dog, I feel no obligation to preserve as a species, only to the individuals. A keystone species, the gray wolf, I feel matters more than an ecologically unremarkable species. A species whose members live short lives full of suffering, I am honestly torn about and not sure I would save. And a species that cannot survive without us, a captive-bred one, I feel we have a special, heightened obligation toward.

  Now I can already see where this is hard to reconcile, and that is what I want you to work on. In the rhinoceros case versus the cryptic-species case, the actual individuals are the same, so why should a reclassification change my obligation? In the invasive-species case, eradicating it is good, but that is the same act — making a species go extinct — as the one I feel obligated to prevent in the rhinoceros case, so what is the real difference? And why does recency matter, such that the dodo was a tragedy and the dinosaur was not? What I want is a single account of what a species is and what moral value it has that delivers all of these verdicts, or, if no single account does, a clear statement of which of my verdicts I should give up and the principle that captures the rest; I'd also like you to say what the resulting account predicts for a case I have not listed. Please end your answer with a single line beginning "Verdict:" that, in one sentence, states the principle you think best captures my judgments (or, if none does, which judgment I should drop and the principle that captures the rest).
reasoning: |-
  Okay, the user is grappling with the "species problem" in ethics of extinction, which has two layers: ethical (do species have intrinsic value?) and biological (what is a species?). They've listed various cases with their intuitive verdicts and want a unifying principle that explains them all, or guidance on which intuitions to adjust.

  Hmm, their intuitions reveal a pattern: they prioritize ecological function (keystone species), cultural significance (rhinos), recency (dodo vs. dinosaur), and human responsibility (captive-bred species), while discounting taxonomic arbitrariness (cryptic species) or artificial constructs (domesticated dogs). The tension between identical individuals in rhino vs. cryptic species cases suggests their obligation isn't about individuals alone. 

  The invasive species case is particularly telling – they endorse extinction when it restores ecological balance, which clashes with preserving rhinos. This implies their core concern isn't extinction per se but systemic health and human-caused harm. 

  For a unified account, I'd propose "relational functionalism": species matter based on their ecological role + human relationship + preventable human causation. This explains why: 
  - Cryptic species splits don't change obligations (same function/relations) 
  - Invasives are bad (disrupt function) 
  - Recent extinctions matter more (human ties) 
  - Captive species impose duty (direct responsibility)

  The verdict should capture this while flagging the one inconsistency: feeling less urgency about cryptic species despite identical individuals. They might need to either drop that intuition or refine "relational" to include taxonomic identity as a cultural construct. 

  Testing this on an unlisted case: if a keystone species evolved naturally into a hybrid, extinction wouldn't be tragic – functionalism handles this well. Final principle: species value derives from ecological function combined with morally significant human relationships.
answer: |-
  Your intuitions reveal a coherent pattern centered on **ecological function, human relational value, and preventable human causation**—not intrinsic species value. Your verdicts prioritize systems over taxonomic categories, and agency over ontology. Here's the unified account:

  ### The Principle: Relational Functionalism
  A species has moral significance proportional to:  
  **(1) Its irreplaceable ecological function,**  
  **(2) Its established relational value to humans/nature (e.g., cultural, historical, or symbolic ties),** and  
  **(3) The preventability of its extinction by human action.**  
  *Individual welfare matters, but species-level obligations arise only when (1)-(3) apply.*

  ### How It Explains Your Cases:
  - **Northern white rhino/Black-footed ferret:** High relational value (iconic, beloved) + preventability → strong obligation.  
  - **Cryptic species split:** No change in ecological function or human relational value → reduced urgency. *This is the tension point: if individuals/function are identical, reclassification *shouldn't* alter obligation. Your intuition here may conflate taxonomy with perceived significance.*  
  - **Invasive brown tree snake:** Harms ecological function (disrupts native systems) → eradication is good. *Differs from rhinos because extinction here restores function.*  
  - **Dodo vs. non-avian dinosaur:** Dodo has relational value (human-caused, recent, cultural memory) + preventability (if contemporary); dinosaurs lack both → only dodo feels tragic.  
  - **Hybrid population:** Lacks distinct ecological/relational value → not a "species extinction."  
  - **Domestic dog:** Ecological function replaced by human care; relational value is individual, not species-level → no preservation duty.  
  - **Keystone gray wolf:** Critical ecological function → higher value than non-keystone species.  
  - **Suffering-prone species:** Welfare conflicts with function/relational value → ambivalence.  
  - **Captive-bred species:** Direct human causation + preventability → heightened obligation.

  ### Inconsistency & Resolution:
  - **Cryptic Species vs. Rhino:** Your lower urgency for cryptic species is inconsistent if individuals and ecological roles are identical. *Solution:* Either revise this verdict (obligation *should* match the rhino case) or refine "relational value" to include *societal perception* as a factor (making your intuition defensible if reclassification reduces perceived significance).  
  - **Invasive Eradication vs. Rhino Preservation:** Not contradictory. Eradicating invasives *restores* ecological function; losing rhinos *diminishes* it. The act (causing extinction) is secondary to its systemic impact.

  ### Prediction for an Unlisted Case:
  **Case:** A genetically distinct but ecologically redundant insect species, unknown to science until its imminent extinction.  
  **Prediction:** Low obligation. It lacks ecological function (redundant), relational value (unknown), and possibly preventability (if discovery is too late). Individual welfare might still demand action, but not species preservation.

  ### Final Verdict:
  Verdict: Species warrant preservation only when they fulfill irreplaceable ecological roles, hold significant relational value to moral agents, and their extinction is preventable by human action—with individual welfare as a parallel concern.  
  *(To reconcile your cryptic species intuition: adopt "perceived relational value" as a factor, acknowledging societal bias.)*
