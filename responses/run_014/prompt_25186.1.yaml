answer: |-
  You've astutely identified a core dynamic in egalitarian theory—a dialectical structure that lacks a single established name but is widely recognized. Below is an analysis of its characteristics, potential labels, and distinctions from similar philosophical patterns:

  ### Key Features of the Dialectic
  1. **Iterative Vulnerability**: Each proposed currency (C₁, C₂, C₃...) is vulnerable to a *new dimension of human diversity* (needs, conversion efficiency, tastes, responsibility, etc.).
  2. **Non-Convergence**: Proposals cycle or dead-end rather than reach stability (e.g., welfare equality’s "expensive tastes" problem loops back to resources/opportunities).
  3. **Value Pluralism Underlying the Regress**: Each shift reflects a conflict between core values (fairness, responsibility, autonomy, compassion) that resist full reconciliation.

  ### Proposed Names & Their Justifications
  While no universally accepted term exists, scholars refer to it contextually using these phrases:
  - **"The Currency Escalation"** (e.g., Anderson 1999): Highlights the sequential "climb" to ever-more-sophisticated metrics.
  - **"The Equality Treadmill"**: Emphasizes the Sisyphean effort without progress toward consensus.
  - **"The Metric Problem Regress"** (coined by commentators on Sen/Dworkin): Directly references the search for an egalitarian "metric."
  - **"The Egalitarian Dialectic"**: Captures its Hegelian structure (thesis → antithesis → modified thesis).
  - **"Sophistication Spiral"**: Stresses increasing complexity without resolution.

  ### Distinguishing from Other Philosophical Patterns
  | **Pattern Type**       | **Key Difference**                                                                 |
  |-------------------------|------------------------------------------------------------------------------------|
  | **Skeptical Regress**   | *This is substantive, not epistemic*: Driven by empirical diversity and value conflicts, not doubt about knowledge. |
  | **Sorites Paradox**     | *Not about vagueness*: Challenges arise from categorical differences (disability, temperament), not blurred boundaries. |
  | **Refinement Spiral**   | *Unique dead-end/cycling*: Unlike (e.g.) Rawls' reflective equilibrium, it lacks a stable terminus due to incommensurable values. |
  | **Infinite Regress**    | *Not formally infinite*: It loops (resources → welfare → opportunity → resources) or stalls, rather than proceeding ad infinitum. |

  ### Why This Structure Persists
  As Cohen noted, the cycle stems from **irreducible tensions in egalitarianism**:
  1. **The Ambition Problem**: Fully accommodating human diversity risks ignoring personal responsibility (e.g., subsidizing expensive tastes).
  2. **The Framing Problem**: Choosing a currency (resources, welfare, capabilities) presupposes contested views of the "moral person" (e.g., Dworkin’s "ambition-sensitive" vs. "endowment-insensitive" ideal).
  3. **The Plurality Problem**: No single currency satisfies all intuitions about fairness (e.g., Anderson’s "democratic equality" abandons distributive precision for relational parity).

  ### Scholarly Recognition
  While unnamed as a whole, the pattern is frequently dissected:
  - **Sen** (1979) frames it as the "space of capabilities" response to welfarist/resourcist limitations.
  - **Dworkin** (1981) positions his "equality of resources" as escaping the welfare/resource pendulum.
  - **Anderson** (1999) critiques the entire "equality of fortune" tradition as a futile "escalation."
  - **Cohen** (1989) calls welfare equality a "cul-de-sac," forcing a return to responsibility-sensitive opportunities.

  In essence, you’re observing the **structural inertia of egalitarian theory**—a regress born of competing moral imperatives that resist synthesis. Naming it the **"Egalitarian Impasse"** or **"Currency Regress"** would aptly capture its stalled, cyclical nature. Its persistence suggests that equality’s "what" may be less a solvable problem than a reflection of deeper ethical pluralism.
