answer: |-
  Here’s a comprehensive map of the desiderata for a theory of metaphysical grounding, structured to capture the phenomena, formal constraints, distinctions, test cases, and key tensions you requested. I’ll flag negotiability, conflicts, and the most field-narrowing requirement.

  ---

  ### **Core Desiderata for a Theory of Grounding**
  **(Non-Negotiable = Consensus; Contested = Camp-Specific)**

  1. **Explanatory Power**  
     - **Requirement**: Grounding must back non-causal explanation. It should answer "in virtue of what" questions (e.g., "In virtue of what is the glass fragile?").  
     - **Motivation**: The *moral wrongness of torture* is grounded in *pain*; grounding explains why torture is wrong without invoking causes.  
     - **Negotiability**: Non-negotiable that grounding *backs* explanation. Contested whether grounding *is identical to* explanation (e.g., Fine vs. Schaffer).

  2. **Irreflexivity**  
     - **Requirement**: Nothing grounds itself.  
     - **Motivation**: If a fact grounded itself, explanation would be circular (e.g., "Why is 2+2=4?" → "Because 2+2=4").  
     - **Negotiability**: Near consensus. Rejected only in niche theories (e.g., dialetheism).

  3. **Asymmetry**  
     - **Requirement**: If A grounds B, B cannot ground A.  
     - **Motivation**: *Conjunctions*: ⟨P∧Q⟩ is grounded in ⟨P⟩ and ⟨Q⟩, but ⟨P⟩ isn’t grounded in ⟨P∧Q⟩.  
     - **Negotiability**: Non-negotiable. Asymmetry avoids explanatory loops (e.g., if pain grounded wrongness and wrongness grounded pain, explanation collapses).

  4. **Hyperintensionality**  
     - **Requirement**: Grounding distinctions must hold between necessarily equivalent facts.  
     - **Motivation**: ⟨2+2=4⟩ and ⟨√16=4⟩ are both necessary truths, but plausibly grounded in different mathematical facts.  
     - **Negotiability**: Non-negotiable. Grounding must be finer-grained than modal entailment (e.g., Fine 2012).

  5. **Necessitation**  
     - **Requirement**: If A grounds B, then A metaphysically necessitates B.  
     - **Motivation**: If pain grounds moral wrongness, pain cannot exist without wrongness.  
     - **Negotiability**: Non-negotiable for most. Rejected by contingent grounding theorists (e.g., Leuenberger 2020).

  ---

  ### **Contested Formal Properties**
  6. **Transitivity**  
     - **Requirement**: If A grounds B and B grounds C, then A grounds C.  
     - **Motivation**: *Causal chain analogy*: If neurons firing ground pain, and pain grounds wrongness, neurons ground wrongness.  
     - **Counterexample**: ⟨A⟩ grounds ⟨A∨B⟩, and ⟨A∨B⟩ grounds ⟨⌜A∨B⌝ is true⟩, but ⟨A⟩ doesn’t ground ⟨⌜A∨B⌝ is true⟩ (Raven 2013).  
     - **Negotiability**: Highly contested (~50% reject). Failure implies grounding isn’t a strict partial order.

  7. **Well-Foundedness**  
     - **Requirement**: All grounding chains terminate in fundamental (ungrounded) facts.  
     - **Motivation**: Avoids infinite regress (e.g., Aristotle’s *regress of causes*).  
     - **Counterexample**: Quantum entanglement or holistic metaphysics (Schaffer 2010).  
     - **Negotiability**: Contested. Anti-foundationalists (e.g., Priest 2014) allow infinite chains.

  ---

  ### **Unity vs. Plurality**
  8. **Unity/Plurality**  
     - **Requirement**: Must specify if grounding is a single relation (e.g., Schaffer 2009) or a family (e.g., causal, logical, moral grounding; Wilson 2014).  
     - **Motivation**: *Test case*: Is ⟨{Socrates} exists⟩ grounded in ⟨Socrates exists⟩ (set membership) analogous to ⟨Wrongness⟩ grounded in ⟨Pain⟩ (moral)?  
     - **Negotiability**: Contested. Pluralists argue relations are heterogenous; unitarians seek a common core.

  ---

  ### **The Regress Problem: Grounding Grounding Facts**
  9. **Ungrounded Grounds**  
     - **Requirement**: Must explain the status of facts like ⟨A grounds B⟩.  
     - **Options**:  
       - *Ungrounded*: Fundamental (violates well-foundedness if widespread).  
       - *Self-Grounded*: Rejected by irreflexivity.  
       - *Grounded*: ⟨A grounds B⟩ grounded in A and B (e.g., Bennett 2011).  
     - **Tension (Irreflexivity + Transitivity + Grounded Grounding)**:  
       If (1) A grounds B, and (2) ⟨A grounds B⟩ is grounded in C, then by transitivity, C grounds B. But if C = A or B, irreflexivity fails. If C is new, regress begins.  
     - **Motivation**: Rosen’s (2010) *statue and clay*: If ⟨Statue exists because Clay exists⟩ is itself grounded, what grounds it?  

  ---

  ### **Test Cases (Must Get Right)**
  10. **Conjunctions**  
      - **Requirement**: ⟨P∧Q⟩ grounded in ⟨P⟩ and ⟨Q⟩ collectively.  
      - **Motivation**: Explains why we cite conjuncts to explain a conjunction.  

  11. **Disjunctions**  
      - **Requirement**: ⟨P∨Q⟩ grounded in ⟨P⟩ if true (or ⟨Q⟩, but not both unless overdetermined).  
      - **Motivation**: ⟨The coin landed heads∨tails⟩ is grounded solely in ⟨It landed heads⟩.  

  12. **Determinates/Determinables**  
      - **Requirement**: ⟨X is crimson⟩ grounds ⟨X is red⟩ (determinate → determinable).  
      - **Motivation**: Crimson explains red, not vice versa.  

  13. **Existentials**  
      - **Requirement**: ⟨∃x Fx⟩ grounded in ⟨Fa⟩ for some a.  
      - **Motivation**: "Why is there a cat?" is explained by "Garfield is a cat."  

  ---

  ### **The Field-Narrowing Requirement: Hyperintensionality**
  **Why it rules out the most theories**:  
  - Denying hyperintensionality reduces grounding to necessary equivalence (e.g., □(A ↔ B)). This collapses:  
    - ⟨2+2=4⟩ and ⟨Hesperus is Phosphorus⟩ into the same ground.  
    - Moral facts and their physical grounds into one relation.  
  - **Eliminated theories**:  
    - Modal reductionism (grounding = necessitation + priority).  
    - Coarse-grained truthmaker semantics.  
    - Any theory that can’t distinguish ⟨A⟩ from ⟨⌜A⌝ is true⟩.  
  - *Why it’s non-negotiable*: Grounding’s primary role is explaining fine-grained dependence. Without hyperintensionality, it loses its theoretical purpose.

  ---

  ### **Key Tensions & Trade-Offs**
  | Desiderata Conflict                  | Consequence                              | Resolution Paths                          |
  |--------------------------------------|------------------------------------------|-------------------------------------------|
  | **Irreflexivity + Transitivity + Grounded Grounding** | Forces infinite regress or fundamental grounding facts. | Accept well-foundedness (terminate chains) or reject transitivity. |
  | **Transitivity + Disjunction Test**  | Transitivity fails for "A grounds ⟨A∨B⟩, ⟨A∨B⟩ grounds ⟨⌜A∨B⌝ is true⟩" | Reject transitivity (common) or revise truth grounding. |
  | **Unity vs. Test Cases**             | Can one relation cover sets, morals, and disjunctions? | Pluralism (multiple relations) or unify via formal operators. |

  ---

  **Bottom Line**:  
  - **Non-negotiable**: Explanatory role, irreflexivity, asymmetry, hyperintensionality, necessitation.  
  - **Most field-narrowing**: **Hyperintensionality** (rules out modal/reductive theories).  
  - **Hottest debate**: **Transitivity** and **well-foundedness** (affects structure of reality).  
  - **Landmine**: The grounding regress problem. If you insist all facts are grounded, prepare to defend infinite chains or reject transitivity.  

  Before taking a position, stress-test your view on conjunctions, disjunctions, and the grounding of ⟨A grounds B⟩. The toughest trade-off is transitivity vs. well-foundedness in regress scenarios.
