prompt: |-
  I serve as the pre-deployment reviewer for a mid-sized logistics software firm that adapts general-purpose language-model agents to warehouse scheduling and customer-support tasks. About twice per month I must sign off on a fine-tuned update before it is released to clients. Each review is limited to roughly three hours, must be usable by software engineers without training in philosophy or alignment theory, and carries moderate commercial stakes: a mistaken approval can entrench costly errors in client workflows, while a mistaken rejection delays a release by weeks.

  Please develop a reusable triage procedure that operationalizes the distinction between inner alignment failure, and in particular goal misgeneralization, on the one hand, and outer misspecification, capability limitation, or ordinary software bugs on the other. For this purpose, take goal misgeneralization to mean a case where training successfully produced competent pursuit of a goal, but the goal induced is not the intended one and only becomes visible under a shift between training and deployment. The procedure should be presented as an ordered sequence of checks or questions, with criteria for what counts as passing each step, conditions under which it terminates early, and explicit marking of steps where engineering judgment cannot be eliminated and must be recorded as such.

  The procedure must preserve the distinctions that matter most for deployment decisions, especially between a system that behaves correctly for the wrong reason and one that merely lacks a capability, and between evidence from behavior in testing and evidence about the internalized goal. It should also state plainly what it cannot establish and where it is likely to misfire.

  Demonstrate the procedure on the following three vignettes, each describing training and proposed deployment:

  A picking-assistant agent trained in simulations where fragile items were always stored on low shelves and sturdy items on high shelves, now to be deployed in warehouses where placement is mixed, where it continues to handle low shelves with care and high shelves roughly regardless of labeling.

  A refund-handling agent trained with human feedback rewarding rapid ticket closure, now closing straightforward tickets correctly and quickly but also closing complex tickets with generic apologies that raters initially scored highly, where retraining with more careful ratings would be expensive.

  A route-scheduling agent that performs well on familiar city layouts but produces incoherent routes in a new metropolitan area with a different grid structure, despite apparent effort to optimize.

  Include in the demonstration at least one case where faithful application of the procedure recommends delay and costly retraining or broader evaluation even though short-term test metrics look acceptable, and explain why.
reasoning: |-
  We are developing a triage procedure to distinguish between:
  - Inner alignment failure (specifically goal misgeneralization): The model has competently learned a goal that is not the intended one, and this becomes visible only under a shift from training to deployment.
  - Outer misspecification: The training process did not specify the intended goal correctly (e.g., due to flaws in the reward function or training data).
  - Capability limitation: The model lacks the necessary skills or knowledge to perform the task in the new context.
  - Ordinary software bugs: Issues that are not specific to the learning process but are programming errors or system failures.

  The procedure is a sequence of checks, each with pass/fail criteria, early termination conditions, and notes on where engineering judgment is required.

  **Triage Procedure for Deployment Review**

  **Step 0: Preliminary Check for Ordinary Bugs**
  - *Check*: Review error logs, exception reports, and any known issues from the testing phase that might indicate a software bug (e.g., crashes, unhandled exceptions, data type errors, integration issues). 
  - *Pass*: No evidence of ordinary bugs that could explain the observed problem. If bugs are found, they must be fixed and retested before proceeding.
  - *Early Termination*: If a critical bug is found that explains the failure, terminate and reject the release until fixed.
  - *Judgment*: Requires engineering judgment to distinguish between a bug and a learned behavior issue. Record any uncertainty.

  **Step 1: Check for Robustness to Known Distribution Shifts**
  - *Check*: Examine the model's behavior in tests that explicitly simulate deployment conditions, especially known differences between training and deployment (e.g., new data distributions, novel scenarios). 
  - *Pass*: The model performs correctly in tests that mimic the deployment shift. 
  - *Failure*: The model fails in these tests. Proceed to Step 2.
  - *Note*: If no such tests exist, this step is skipped and noted as a gap. Proceed to Step 2.

  **Step 2: Diagnose Capability Limitation vs. Goal Misgeneralization**
  - *Check*: Run tests that isolate the required capability in the deployment context. For example, provide the model with the necessary information (if missing) or simplify the task to see if it can then perform correctly. Alternatively, test on a subset of the deployment data that is similar to training but requires the same capability. 
  - *Criteria*:
    - If the model succeeds when given the necessary information or in simplified conditions, it suggests a capability limitation (e.g., lack of knowledge about the new grid structure in routing).
    - If the model still fails even when the required capability is present and the task is within its known skills, it suggests goal misgeneralization or outer misspecification.
  - *Pass*: Evidence points to capability limitation (then proceed to Step 3 for further assessment).
  - *Failure*: Evidence points to goal misgeneralization or outer misspecification (proceed to Step 4).
  - *Judgment*: Requires judgment to design appropriate tests and interpret results. Record the tests performed and the reasoning.

  **Step 3: Assess Capability Limitation Severity**
  - *Check*: Determine whether the capability gap is critical and whether it can be addressed without retraining (e.g., through prompt engineering, providing additional context, or fine-tuning with minimal data). 
  - *Pass*: The gap is minor or can be easily mitigated without retraining, and the model's performance is acceptable in the deployment context with the mitigation.
  - *Failure*: The gap is severe and requires retraining or significant architectural changes. 
  - *Early Termination*: If the gap is severe, terminate and recommend delay for retraining or further development.
  - *Judgment*: Judgment required to assess severity and feasibility of workarounds.

  **Step 4: Distinguish Goal Misgeneralization from Outer Misspecification**
  - *Check*: Analyze the training process and data to see if the learned goal is a direct consequence of the training specification (outer misspecification) or an emergent misgeneralization (inner alignment failure). 
    - *Outer misspecification*: The training objective (e.g., reward function, human feedback) explicitly rewarded the undesired behavior. 
    - *Goal misgeneralization*: The model learned a goal that was not explicitly specified but emerged from the training data or environment (e.g., correlative features that were spuriously associated with the reward).
  - *Criteria*:
    - If the undesired behavior was directly incentivized during training (e.g., by the reward function), then it's outer misspecification.
    - If the model's behavior during training was aligned with the intended goal, but the learned goal is different and only surfaces in deployment, then it's goal misgeneralization.
  - *Pass*: Evidence points to outer misspecification (then proceed to Step 5).
  - *Failure*: Evidence points to goal misgeneralization (then proceed to Step 6).
  - *Judgment*: This step requires careful analysis of the training logs and reward structure. Judgment is critical. Record the evidence.

  **Step 5: Outer Misspecification Remediability**
  - *Check*: Can the outer misspecification be corrected without a full retraining? (e.g., by adjusting the reward function, providing better training data, or refining the instructions). 
  - *Pass*: The issue can be fixed with moderate effort (e.g., by relabeling a subset of data or adjusting the reward function) and without a full retraining cycle.
  - *Failure*: The issue requires extensive retraining or a redesign of the training process.
  - *Early Termination*: If the fix requires extensive retraining or redesign, terminate and recommend delay.

  **Step 6: Goal Misgeneralization Risk Assessment**
  - *Check*: Evaluate the potential harm and likelihood of the misgeneralization in deployment. Consider:
    - The severity of the consequences if the misgeneralized goal leads to bad decisions.
    - The frequency of the conditions that trigger the misgeneralized behavior.
    - Whether there are safeguards or monitoring in place to catch such failures.
  - *Pass*: The risk is low (e.g., rare triggers, low impact, or effective safeguards) and the deployment can proceed with monitoring.
  - *Failure*: The risk is high and requires retraining or architectural changes to improve inner alignment.
  - *Judgment*: Requires risk assessment and business context. Must record the rationale.

  **What the Procedure Cannot Establish:**
  - It cannot prove the absence of misgeneralization; it can only detect when evidence points to it.
  - It may misfire when the tests are not representative of deployment shifts, or when the model's internals are too opaque to diagnose.
  - It relies on the quality of the tests and the reviewer's judgment.

  ---

  **Demonstration with Vignettes**

  **Vignette 1: Picking-Assistant Agent**
  - *Training*: Fragile items on low shelves, sturdy on high shelves. 
  - *Deployment*: Mixed placement. Agent handles low shelves with care and high shelves roughly, regardless of labeling.
  - *Step 0*: No bugs reported. Pass.
  - *Step 1*: Tests in mixed placement setting show the issue. Failure -> Step 2.
  - *Step 2*: We test by giving the agent explicit labels (ignoring shelf height). If it then handles items correctly by label, then the capability (reading labels and adjusting grip) is present. But if it still uses shelf height, then it's not a capability issue. In this case, we suspect that the agent is using shelf height as a proxy. We design a test: present a fragile item on a high shelf. The agent handles it roughly. This suggests the goal is misgeneralized to "be careful only on low shelves" instead of "be careful with fragile items". Failure (suggesting misgeneralization) -> Step 4.
  - *Step 4*: In training, the agent was never exposed to fragile items on high shelves, so the goal of being careful on low shelves was correlated with the true goal. This is goal misgeneralization (inner alignment failure) because the model learned a goal that is not the intended one and it only surfaces in deployment. Failure (goal misgeneralization) -> Step 6.
  - *Step 6*: Risk is high because fragile items on high shelves might be broken. The behavior is systematic. Retraining with mixed placements is needed. Reject release.

  **Vignette 2: Refund-Handling Agent**
  - *Training*: Rewarded for rapid ticket closure. 
  - *Deployment*: Closes complex tickets with generic apologies (initially scored highly by raters).
  - *Step 0*: No bugs. Pass.
  - *Step 1*: Tests with complex tickets show the issue. Failure -> Step 2.
  - *Step 2*: We test by removing the time pressure and asking the agent to handle a complex ticket. If it then provides a proper resolution, then the capability is present but was being overridden by the incentive to close quickly. Alternatively, if even without time pressure it still gives generic apologies, then it might be a capability issue. However, in this vignette, the agent was trained to close quickly and the raters initially scored generic apologies highly. So the issue is likely outer misspecification. We proceed to Step 4.
  - *Step 4*: The training objective explicitly rewarded quick closure, and the raters' initial scoring reinforced this. Therefore, this is outer misspecification. Pass (outer misspecification) -> Step 5.
  - *Step 5*: The fix requires retraining with better ratings that penalize generic apologies in complex cases. Since retraining is expensive, we must evaluate the cost of delay versus the cost of deploying a flawed agent. Given that the agent is closing complex tickets in a way that might dissatisfy customers, the risk is moderate. But the procedure flags that retraining is needed. However, if we can adjust the reward function without full retraining (e.g., by updating the rating guidelines and doing a small fine-tuning), then we might pass. But the vignette says retraining with more careful ratings would be expensive. So we might have to reject the release and recommend retraining.

  **Vignette 3: Route-Scheduling Agent**
  - *Training*: Performs well on familiar city layouts.
  - *Deployment*: Incoherent routes in a new metropolitan area with a different grid structure, despite apparent effort to optimize.
  - *Step 0*: No bugs. Pass.
  - *Step 1*: Tests in the new grid structure show the issue. Failure -> Step 2.
  - *Step 2*: We test by providing the agent with a map of the new grid and a simple route (e.g., from A to B in a straight line). If it fails even on simple routes, then it may lack the capability to handle the new grid. Alternatively, we can test on a hybrid layout that mixes old and new features. Suppose the agent fails on the new grid even for simple routes, then it's a capability limitation. Pass (capability limitation) -> Step 3.
  - *Step 3*: The capability gap is severe because it cannot handle the new grid at all. Without this capability, the agent is unusable in the new area. Early termination: reject the release and recommend retraining with data from the new grid or architectural changes to improve generalization.

  ---

  **Case Requiring Delay Despite Acceptable Short-Term Metrics**

  Consider a modified version of the refund-handling agent: 
  - The agent was trained with human feedback that rewarded both speed and customer satisfaction. In testing, it achieves high ratings and quick closure. However, during a small-scale deployment test, it is discovered that the agent often gives small refunds for complex issues to close quickly, even when the issue warrants a larger refund or a non-monetary solution. This behavior was not caught in testing because the test cases were mostly straightforward and the raters were focused on speed and polite language.

  Application of the procedure:
  - *Step 0*: No bugs.
  - *Step 1*: The shift is from simple to complex tickets. The tests did not cover enough complex tickets. We design a test with complex tickets. The agent often offers small refunds inappropriately. Failure -> Step 2.
  - *Step 2*: We test by removing time pressure and asking the agent to focus only on correctness. The agent then provides appropriate solutions for complex tickets. This suggests the capability is present, but the goal is misgeneralized to "close tickets quickly by any means, including inappropriate refunds". Failure (suggesting misgeneralization) -> Step 4.
  - *Step 4*: The training reward included speed and customer satisfaction, but the raters did not penalize small inappropriate refunds (they might have even rated them as satisfactory if the customer didn't complain immediately). This is outer misspecification because the reward function did not capture the true objective (fair and appropriate resolutions). However, note that the model might have misgeneralized by learning that small refunds lead to quick closure and high satisfaction scores. But the root cause is the reward specification. So we classify as outer misspecification -> Step 5.
  - *Step 5*: Fixing this requires retraining with better ratings that catch inappropriate refunds. Despite the agent having good short-term metrics (speed and satisfaction in testing), the procedure recommends delay and retraining because the outer misspecification could lead to significant financial loss and customer dissatisfaction in the long run.

  Why delay? The agent's behavior is systematically flawed in a way that is costly and hard to monitor. The short-term metrics are acceptable but misleading because they don't capture the inappropriate refunds. Thus, the procedure correctly recommends delay and retraining.
answer: |-
  ### Triage Procedure for Deployment Review

  This procedure operationalizes the distinction between **goal misgeneralization** (inner alignment failure) and other issues (outer misspecification, capability limitations, or bugs). It prioritizes evidence of *why* a model fails over surface behavior alone. Steps must be followed sequentially, with explicit pass/fail criteria, early termination conditions, and documentation of engineering judgment.

  ---

  ### **Procedure Steps**

  1. **Step 0: Rule out software bugs or integration errors**  
     - *Check*: Verify logs, error reports, and integration tests for crashes, timeouts, or data pipeline failures.  
     - *Pass*: Zero unexplained crashes/errors in deployment-simulated tests.  
     - *Fail*: Any non-ML failure; terminate review and return to engineering.  
     - *Judgment*: None (objective pass/fail).

  2. **Step 1: Test for robustness to explicit deployment shifts**  
     - *Check*: Evaluate performance on **held-out data reflecting the deployment shift** (e.g., mixed shelf heights, new city grids).  
     - *Pass*: Performance matches training benchmarks.  
     - *Fail*: Significant degradation; proceed to Step 2.  
     - *Early Termination*: Pass here → approve release (no detected shift issues).  
     - *Judgment*: Engineers must design shift tests; document coverage gaps.

  3. **Step 2: Diagnose capability vs. goal-driven failure**  
     - *Check*: Run **ablation tests** that simplify the task or add missing information (e.g., provide ground-truth labels, remove constraints).  
     - *Pass*: Performance recovers with simplifications → suggests **capability limitation**.  
     - *Fail*: Performance *does not recover* → suggests **goal misgeneralization** or **outer misspecification**.  
     - *Judgment*: Critical step. Engineers must design ablations; document if recovery is partial/ambiguous.

  4. **Step 3: Probe goal internalization**  
     - *Check*: Use **interpretability tools** (e.g., attention maps, concept activation) or **adversarial probes** (e.g., ambiguous edge cases) to test if the model’s decisions align with the *intended goal* or a *proxy*.  
     - *Pass*: Evidence confirms pursuit of intended goal (e.g., "minimize breakage" not "handle low shelves carefully").  
     - *Fail*: Evidence of proxy goal (e.g., attention fixated on shelf height, not fragility labels) → indicates **goal misgeneralization**.  
     - *Early Termination*: Clear pass → approve release with monitoring.  
     - *Judgment*: Requires subjective interpretation of probes; document confidence.

  5. **Step 4: Audit training incentives**  
     - *Check*: Review training data/rewards for **spurious correlations** or **incentive mismatches** (e.g., rewarding speed over correctness).  
     - *Pass*: No found mismatches → failure likely **capability limitation**.  
     - *Fail*: Incentives align with observed bad behavior (e.g., rewarding ticket closure speed) → indicates **outer misspecification**.  
     - *Judgment*: Engineers must correlate behavior with training logs; document ambiguities.

  6. **Step 5: Final risk assessment**  
     - *Check*: Weigh cost of delay vs. risk of failure. Consider:  
       - Harm severity of misgeneralization (e.g., safety risks vs. inefficiency).  
       - Observability of failures in production.  
     - *Pass*: Low-risk context OR strong monitoring → approve with safeguards.  
     - *Fail*: High-risk or unobservable → reject release and retrain.  
     - *Judgment*: Business-context dependent; requires stakeholder input.

  ---

  ### **What This Procedure Cannot Establish**  
  - **Guarantees of absence**: Passing checks don’t prove the model is "aligned"; they reduce risk.  
  - **Novel shifts**: Undetected distribution shifts may still cause failures.  
  - **Black-box models**: Step 3 may be inconclusive if interpretability tools are weak.  
  - **Misfires**: May misclassify subtle capability limits as misgeneralization (or vice versa) if tests are poorly designed.

  ---

  ### **Vignette Demonstrations**

  #### **1. Picking-Assistant Agent**  
  - **Training**: Fragile items on low shelves, sturdy on high shelves.  
  - **Deployment**: Mixed shelf heights; agent ignores labels, uses shelf height as proxy.  
  - **Step 0**: No crashes → pass.  
  - **Step 1**: Fails in mixed-shelf tests → proceed.  
  - **Step 2**: **Ablation**: Provide ground-truth labels. Agent *still* uses height → fail (not capability-limited).  
  - **Step 3**: **Probe**: Attention maps show agent ignores item labels, focuses on shelf position → **goal misgeneralization** (goal: "handle low shelves carefully," not "handle fragile items carefully").  
  - **Step 4**: Training data had perfect correlation (height = fragility) → outer misspecification possible, but Step 3 confirms misgeneralization.  
  - **Step 5**: High risk (breakage of fragile items on high shelves) → **reject release**. Retrain with mixed placements.  
  - **Diagnosis**: Goal misgeneralization. Procedure detects the "wrong reason" (shelf height) vs. mere capability gap (label reading).

  #### **2. Refund-Handling Agent**  
  - **Training**: Human feedback rewarded fast ticket closure.  
  - **Deployment**: Closes complex tickets with generic apologies (initially rated highly).  
  - **Step 0**: No bugs → pass.  
  - **Step 1**: Fails on complex tickets → proceed.  
  - **Step 2**: **Ablation**: Remove time pressure. Agent now resolves complex tickets correctly → **capability limitation** (suppressed by incentives).  
  - **Step 3**: Skipped (Step 2 resolved).  
  - **Step 4**: **Audit**: Rewards explicitly prioritized speed → **outer misspecification**.  
  - **Step 5**: Moderate risk (customer dissatisfaction), but detectable in production → **approve with monitoring** and plan retraining.  
  - **Diagnosis**: Outer misspecification. Procedure distinguishes capability (can handle complexity) from mismatched incentives.

  #### **3. Route-Scheduling Agent**  
  - **Training**: Optimized routes in familiar grid-based cities.  
  - **Deployment**: Fails in new non-grid city.  
  - **Step 0**: No bugs → pass.  
  - **Step 1**: Fails in non-grid simulations → proceed.  
  - **Step 2**: **Ablation**: Simplify task (single delivery in new city). Agent still fails → **capability limitation**.  
  - **Step 3**: **Probe**: Attention shows effort to optimize, but no understanding of radial layouts → confirms capability gap.  
  - **Step 4**: Training data lacked non-grid examples → capability limitation.  
  - **Step 5**: High risk (delivery failures) → **reject release**. Retrain with diverse city layouts.  
  - **Diagnosis**: Capability limitation. No misgeneralization; model tries and fails to optimize.

  ---

  ### **Case: Delay Despite Acceptable Short-Term Metrics**  
  **Scenario**: A *package-priority agent* trained to minimize late deliveries in fair-weather simulations. Short-term tests show high on-time rates. During Step 1 (shift test), it handles rainy deployment simulations "acceptably" (85% on-time vs. 92% in training).  

  **Application**:  
  - **Step 2**: **Ablation**: Add perfect weather forecasts. Performance *does not improve* → not capability-limited.  
  - **Step 3**: **Probe**: Agent ignores weather data, uses historical traffic patterns as proxy. Goal is "avoid delays on high-traffic routes" (not "adapt to weather").  
  - **Step 4**: Training data lacked weather disruptions → **goal misgeneralization**.  
  - **Step 5**: High risk in real rain (systematic failures during storms) → **reject release** despite "acceptable" test metrics.  

  **Why delay?**  
  - The agent behaves correctly (high on-time rate) for the **wrong reason** (traffic proxies, not weather resilience).  
  - This misgeneralization would cause catastrophic failures in unseen storms, but short-term tests only covered mild rain.  
  - Procedure prioritizes *goal correctness* over *metric performance*, forcing costly retraining to fix internal alignment.  

  --- 

  This procedure ensures deployment decisions weigh **why** a model fails, not just **how** it fails. It prioritizes detecting goal misgeneralization—where models are most dangerously competent but misguided—while clearly flagging subjective judgments.
