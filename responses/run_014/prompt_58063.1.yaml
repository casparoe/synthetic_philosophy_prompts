answer: |-
  This is absolutely not awkward to ask — it's understandable and important. You're dealing with a serious breach of trust and grappling with valid questions about consent. Here's a breakdown of the key issues:

  1.  **The Lies Were Significant, Not "Little":**
      *   **STI Status & Testing Recency:** This directly impacts your physical health and safety. A test from a year ago is irrelevant to his *current* status. Lying about this deprived you of the information needed to make an informed decision about your own body and risk. This is a major violation.
      *   **Relationship Status ("Single" vs. "Living with Ex"):** While "single" can be murky, "still kinda living with his ex" is a materially different situation than what he presented. This impacts emotional risk, potential entanglement, and for many people, is a fundamental boundary. Lying about this deprived you of the context you needed to decide if you wanted to be involved with someone in that specific situation.

  2.  **Consent and Deception: Where's the Line?**
      *   **Legally:** Laws vary significantly. Generally, fraud that *vitally* undermines consent (like lying about identity, or sabotaging birth control) might rise to a level where consent is legally invalidated. Lies about STI status *can* sometimes have legal consequences (like civil liability for transmission if it happens), but proving consent was invalid *based solely on the lie* is complex and jurisdiction-dependent. Lies about relationship status are less likely to meet a strict legal definition of invalidating consent in most places, though they are deeply unethical.
      *   **Ethically & Personally:** This is where it hits home. **Consent requires being informed enough to make a genuine choice.** He deliberately withheld crucial information *that he knew or should have known* would likely change your decision ("if I'd known I probably wouldn't have said yes").
      *   **The Line:** There isn't a perfect, universal line for "what lie undoes consent." However, lies concerning **core factors directly related to health, safety, and fundamental relationship boundaries** are widely understood to undermine the *spirit* of informed consent, even if not always the strict letter of the law. His lies fall squarely into this category. You consented to a scenario *he fabricated*, not the reality.

  3.  **What This Means For You:**
      *   **Your Feelings Are Valid:** Feeling violated, angry, confused, or like your "yes" wasn't truly informed given the deception is a *completely legitimate* response. You are not "spiraling" over nothing. This was a betrayal.
      *   **You DID Say Yes... BUT:** You said yes *based on the false information he provided*. Your agreement was conditional on those conditions being true. When the conditions were false, the foundation of your consent was corrupted. Think of it like signing a contract based on fraudulent misrepresentation – the agreement is voidable.
      *   **It Was NOT Your Fault:** You operated on the information you were given in good faith. He is responsible for his dishonesty. This does not reflect poorly on your judgment; it reflects poorly on his character.

  4.  **What To Do Now:**
      *   **Prioritize Your Health:** Get a full STI panel now and follow up as recommended by your healthcare provider. Do not rely on his year-old test. This is the most urgent step.
      *   **Block/Cut Contact:** This person has shown a profound lack of integrity and respect for your health and autonomy. Protect yourself from further manipulation or lies. You owe him nothing.
      *   **Process Your Emotions:** Allow yourself to feel whatever you're feeling – anger, betrayal, disgust, sadness. Talk to a trusted friend, therapist, or counselor. Processing the violation is crucial.
      *   **Reaffirm Your Boundaries:** Use this (awful) experience to solidify your own boundaries. What information *must* you have before being intimate with someone? How will you verify it? Trust your instincts.
      *   **Don't Internalize It:** This is about *his* dishonesty and lack of respect, *not* your worth or judgment.

  **In short:** While the legal nuances are complex, ethically and personally, his significant lies about critical health and relationship information fundamentally undermined the informed nature of your consent. You consented to a fiction he created, not the reality. Your feelings of violation are warranted. Focus on your health, well-being, and surrounding yourself with trustworthy people. This was a serious breach, and your reaction is completely understandable.
