  For the pet theory, research shows that confabulation happens in intact brains too. Studies like Gazzaniga's interpreter theory and experiments with choice blindness support this. The activity can highlight that the "talker" invents reasons for actions they didn't initiate, which mirrors normal brain function. The debrief can guide participants to this realization without preaching.

