  1) "No consent needed" fails because divorce courts DO have jurisdiction 
  2) Asset division actually holds up surprisingly well 
  3) Clean break collapses when the kid-state needs training wheels

  Alternative analogies... Corporate demerger handles competence better (spun-off units aren't expected to be instantly autonomous) but weakens the "no consent needed" argument since shareholders vote. Housing coop is elegant for the membership aspect but terrible for debt division. 

  *scribbling mental notes* Must emphasize: the citizenship portability issue breaks the divorce frame completely. Negotiator is trying to smuggle in dual allegiance through an analogy that fundamentally can't see it. That's professionally dangerous.

  User's clearly spotted the cracks in the rhetorical foundation. Smart that they're questioning this now before it becomes a legal liability. Their private alternatives show they've done the homework - just need help pressure-testing.
answer: |-
  Here is a conceptual audit of the "secession as no-fault divorce" analogy, addressing your specific concerns and evaluating its viability:

  ### Explicit Mapping of the Analogy
  | **Divorce Element**        | **Secession Equivalent**                                | **Mapping Purpose**                                                                 |
  |----------------------------|---------------------------------------------------------|-------------------------------------------------------------------------------------|
  | **Two Spouses**            | Regional Government & National Government               | The consenting parties to the original union, now seeking separation.                |
  | **Marriage**               | Political/Constitutional Union                          | The legal bond being dissolved.                                                      |
  | **Matrimonial Property**   | Jointly acquired assets/incurred debts (e.g., infrastructure, sovereign debt) | Basis for equitable division of shared resources/obligations.                       |
  | **Children**               | Citizens (especially vulnerable groups/minorities)      | Dependent parties whose welfare must be protected during separation.                 |
  | **Court**                  | None (or international body/neutral arbitrator)         | Authority overseeing dissolution (weaker in secession).                             |
  | **Clean-Break Order**      | Final settlement ending mutual obligations              | Goal of terminating ongoing fiscal/legal dependencies.                              |

  ### Critical Failures of the Analogy
  **I. Failures Threatening the Three Conclusions:**
  1. **The "Court" Problem:**  
     - **Failure:** Divorce requires judicial approval; secession lacks a sovereign authority binding both parties.  
     - **Threat to Conclusion 1:** Undermines "national parliament’s consent is unnecessary." If divorce requires court sanction, secession logically requires recognition by the existing sovereign (national parliament) or international bodies.  
     - **Implication:** The analogy *contradicts* the claim that consent is irrelevant.

  2. **"Children" as Non-Analogous Dependents:**  
     - **Failure:** Children are passive dependents; citizens in a seceding region are active participants who may retain ties to the "other parent" (national state).  
     - **Threat to Conclusion 3:** A "clean break" ignores that citizens (unlike children) can maintain dual allegiances. The pension/citizenship protocol explicitly violates the clean-break premise.  
     - **Implication:** Forces arbitrary exclusion of citizenship rights from the settlement framework.

  **II. Structurally Significant but Less Damaging Failures:**
  1. **Lack of "Adult Competence":**  
     - **Failure:** Divorcing spouses are presumed functionally autonomous; a new state may lack administrative/fiscal capacity.  
     - **Effect on Conclusion 3:** Does not *defeat* the clean-break goal but **severely constrains it**. The analogy cannot address transitional support or asymmetric dependencies (e.g., a new state requiring fiscal life support).  
     - **Implication:** The clean-break premise becomes aspirational, not operational, without supplementary mechanisms.

  2. **Indivisible Sovereignty vs. Shared Property:**  
     - **Failure:** Matrimonial property is divisible; sovereignty (e.g., airspace, currency) is not.  
     - **Effect:** Complicates asset division but doesn’t directly threaten the conclusions if limited to tangible assets/debts.

  ### Citizenship Portability: The Analogy's Blind Spot
  - **Invisibility in Divorce Frame:** The analogy has **no conceptual space** for portable citizenship. Post-divorce, spouses lose membership rights in each other’s households; dual citizenship is akin to demanding post-marital dining rights in an ex-spouse’s home.  
  - **Implication:** Using divorce to structure citizenship questions **actively misdirects** negotiations. It falsely implies that "clean break" requires severing *all* citizen ties, making your draft protocol appear illogical within the analogy when it is pragmatically necessary.  

  ### Survival of the Three Conclusions
  1. **"Consent Unnecessary" (Conclusion 1):**  
     **❌ Does not survive.** The missing "court" element fatally undermines it. Divorce requires third-party sanction; secession cannot bypass constitutional authority.  

  2. **"Equitable Division of Assets/Debts" (Conclusion 2):**  
     **✅ Survives.** The core of the property division analogy holds, even with sovereignty caveats.  

  3. **"Clean Break Ending Dependency" (Conclusion 3):**  
     **⚠️ Partially survives but is inadequate.** The "adult competence" gap and citizenship portability reveal that "clean break" is a fiction for nascent states. The conclusion must be relaxed to allow phased transitions or asymmetric terms.  

  ### Alternative Analogies: Assessment
  | **Analogy**          | **Supports Negotiator’s Conclusions?**                  | **What Must Be Surrendered**                          |
  |----------------------|---------------------------------------------------------|-------------------------------------------------------|
  | **Corporate Demerger** | 1. ❌ (Dissenting shareholders have rights; demerger requires approval)<br>2. ✅ (Assets/liabilities split)<br>3. ⚠️ (Spin-offs may retain commercial ties) | **Surrender:** "No consent needed" argument. Accepts ongoing operational links (e.g., shared currency). |
  | **Housing Cooperative** | 1. ✅ (Member may unilaterally withdraw)<br>2. ❌ (Withdrawing member gets equity payout, not asset division)<br>3. ✅ (Clean exit) | **Surrender:** Equitable division of joint assets/debts. Debt obligations remain solely with the cooperative. |

  ### Recommendation
  - **Divorce Analogy:** Retain **only for asset/debt division (Conclusion 2)**, but abandon for consent and citizenship.  
  - **Best Alternative:** **Corporate Demerger** best accommodates phased autonomy and shared systems (e.g., pensions), but forces concession on national consent. Avoid the cooperative model—it cannot handle debt division.  
  - **Critical Adjustment:** Acknowledge that "clean break" is a **negotiated outcome**, not an analogical inevitability. Citizenship portability requires a bespoke framework outside any analogy.  

  The divorce analogy is rhetorically vivid but legally deceptive. Its failures in consent and citizenship reveal it as a vehicle for presupposing outcomes rather than deriving them. A hybrid approach—demerger for process/structure, divorce for assets—may be pragmatic, but only with explicit caveats.
