  Hmm, the two critical failure points the user flagged are really significant. The "adult competence" gap torpedoes the clean-break premise - you can't pretend a newborn state is like a divorced adult. And the portable citizenship issue? That's completely invisible in divorce terms; ex-spouses don't keep dining at each other's tables. 

