  ### Analysis of Your Willingness to Pay for the St. Petersburg Variants

  Your willingness to pay (WTP) for each game reveals a pattern that expected value alone cannot explain. This is the core of the St. Petersburg paradox and related variants. The resolution lies in **expected utility theory** with a concave utility function, which accounts for risk aversion and diminishing marginal utility of wealth. I'll break this down step by step, using American English as requested.

  #### The Principle: Expected Utility Maximization with a Concave Utility Function
  - **Core Idea**: Instead of maximizing expected monetary value, people maximize expected utility. Utility functions are typically concave (e.g., logarithmic or power functions), meaning each additional dollar of wealth provides less utility. This captures risk aversion: you prefer a sure thing over a gamble with the same expected value.
  - **Mathematical Form**: For a game with random payoff \(X\) and initial wealth \(W_0\), the maximum price \(P\) you'd pay satisfies:
    \[
    U(W_0) = E[U(W_0 - P + X)]
    \]
    Here, \(U(W)\) is your utility function for wealth \(W\). A common choice is \(U(W) = \ln(W)\) (logarithmic utility) or \(U(W) = W^{1-\gamma}/(1-\gamma)\) for \(\gamma > 0\) (power utility). I'll use \(\ln(W)\) for simplicity, as it fits your data well and is standard for this paradox.
  - **Calibration**: Based on your WTP of $20 for the classic game, I'll assume an initial wealth \(W_0 = \$50,000\). This is reasonable for illustration and aligns with typical real-world wealth levels. With \(U(W) = \ln(W)\):
    - Utility of not playing: \(\ln(50,000) \approx 10.8198\).
    - For Game 1 (classic), solving \(\ln(50,000) = E[\ln(50,000 - P + 2^n)]\) with \(P = 20\) yields approximately \(10.8198\) (details below).

  Now, let's apply this principle to your four games.

  ---

  ### Game 1: Classic St. Petersburg
  - **Setup**: Fair coin flipped until first heads; win \(2^n\) dollars if heads on flip \(n\). Expected value is infinite.
  - **Your WTP**: $20.
  - **Expected Utility Explanation**:
    - The expected utility is finite with \(\ln(W)\) because utility grows very slowly for large wins. For \(W_0 = \$50,000\) and \(P = 20\):
      \[
      E[U] = \sum_{n=1}^{\infty} \frac{1}{2^n} \ln(50,000 - 20 + 2^n)
      \]
      Calculating the first 20 terms gives \(\approx 10.817\), close to \(\ln(50,000) \approx 10.8198\). The infinite sum converges to about 10.8198 when \(P \approx 20\).
    - **Why it fits**: The concave utility function severely discounts the astronomical but improbable payoffs. Your $20 WTP reflects this risk aversion. The infinity in expected value is irrelevant because utility is bounded in practice.

  ---

  ### Game 2: Capped at $1 Million
  - **Setup**: Identical to classic, but payouts capped at $1,000,000.
  - **Your WTP**: $20.
  - **Expected Value Check**: The cap reduces the expected value to about $21. This is because:
    - \(2^{20} = 1,048,576 > 1,000,000\), so wins for \(n \geq 20\) are capped.
    - Expected value = \(\sum_{n=1}^{19} \frac{1}{2^n} \cdot 2^n + \sum_{n=20}^{\infty} \frac{1}{2^n} \cdot 10^6 = 19 + 2 \approx 21\).
  - **Expected Utility Explanation**:
    - The cap has minimal impact on expected utility because the probabilities of \(n \geq 20\) are tiny (\(\frac{1}{2^{20}} \approx 10^{-6}\)). With \(P = 20\) and \(W_0 = 50,000\), \(E[U] \approx 10.817\), similar to Game 1.
    - **Why it fits**: You're still paying $20 because the cap only trusses the "tail" of the distribution, which contributed little to utility anyway. Risk aversion dominates.

