  ### Game 3: Truncated at 100 Flips
  - **Setup**: Coin flipped at most 100 times; win \(2^n\) for heads on flip \(n\), else $0. Expected value = $100.
  - **Your WTP**: $20.
  - **Expected Utility Explanation**:
    - With \(U(W) = \ln(W)\) and \(P = 20\):
      \[
      E[U] = \sum_{n=1}^{100} \frac{1}{2^n} \ln(50,000 - 20 + 2^n) + \frac{1}{2^{100}} \ln(50,000 - 20)
      \]
      The first 10 terms dominate, summing to \(\approx 10.8095\). Including more terms and approximations, \(E[U] \approx 10.817 < \ln(50,000) \approx 10.8198\). To equalize, \(P\) must be slightly less than $20, but it's close.
    - **Why it fits**: The expected value is $100, but the distribution is highly skewed—most of the time, you win a small amount (e.g., $2 with 50% chance), with a tiny chance of a huge win. Concave utility penalizes this skew:
      - Small wins add little utility because \(\ln(W)\) is flatter at higher wealth.
      - The 50% chance of $2 (utility \(\ln(50,000 - 20 + 2) \approx \ln(49,982)\)) is only marginally better than $0.
      - Risk aversion makes you value this gamble far below its $100 expected value.

