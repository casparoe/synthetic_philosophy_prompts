  ### Tension Between Game 3 and Game 4: Why Same Expected Value, Different WTP?
  - **Game 3 (Truncated)**: Expected value = $100, but WTP = $20. The payoff distribution is skewed right with high variance. You have a 50% chance of winning just $2, a 25% chance of $4, and microscopic chances of millions. Concave utility makes you dislike this imbalance—the small likely gains add little utility, and the huge unlikely gains don't compensate enough.
  - **Game 4 (Simple Bet)**: Expected value = $100, but WTP = $90. The payoff distribution is symmetric and low-variance. You have a solid 50% shot at $200, which (due to concave utility) is only slightly less valuable than a sure $100.
  - **Key Insight**: Expected value ignores risk structure. Utility theory captures that you are **risk-averse** and **skewness-averse**. Game 3's skew and variance make it feel riskier, so you discount it heavily.

