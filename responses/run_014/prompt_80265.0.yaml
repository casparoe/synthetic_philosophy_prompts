      \[
      E[U] = \frac{1}{2} \ln(50,000 - 90 + 200) + \frac{1}{2} \ln(50,000 - 90) = \frac{1}{2} \ln(50,110) + \frac{1}{2} \ln(49,910) \approx 10.820
      \]
      This matches \(\ln(50,000) \approx 10.8198\) closely.
    - **Why it fits**: The outcomes are compact ($0 or $200), so there's no extreme skew. The risk premium (discount for uncertainty) is small, and you pay close to the expected value. The gap between $90 and $100 is due to moderate risk aversion—concave utility slightly discounts the gamble.

