  Next, the horrifying outcomes. If the idealized self wants something awful, does CEV say we should accept it? The follow-up needs to address unfalsifiability. Then, whose preferences are included? What about people with mental health issues? The follow-up should push on whether CEV can critique harmful preferences.

  The bridge from human volition to AI's ought is another point. The follow-up needs to question if the is-ought problem is just pushed back. Also, the user mentioned critical edge versus ratifying everyone's idealized self. That's important to cover.

  The user wants fairness, not a roast. So questions should be respectful but probing. They need follow-ups tailored to likely answers. For example, if the guest says coherence avoids circularity by being a fixed point, the follow-up asks if that process is value-neutral. 

