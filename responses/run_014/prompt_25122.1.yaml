answer: |-
  **Decision Tree for the Special Composition Question**

  Q1: Consider the Eiffel Tower and your left shoe (not connected, far apart). Is there a single object made up of just these two things?  
  - **Yes** → Q2  
  - **No** → Q3  

  Q2: Consider a wooden chair (made of multiple parts, like legs and a seat). Is there a single object, the chair?  
  - **Yes** → **Mereological universalism** (any collection of objects composes something).  
  - **No** → *Unoccupied*: Accepts arbitrary scattered fusions (like Eiffel-shoe) but denies ordinary objects (like chairs). No one holds this—it’s implausible to accept gerrymandered objects but reject unified ones.  

  Q3: Consider a wooden chair (made of multiple parts). Is there a single object, the chair?  
  - **No** → Q4  
  - **Yes** → Q5  

  Q4: Consider a living cat (composed of organs, cells, etc.). Is there a single object, the cat?  
  - **No** → **Mereological nihilism** (only simple, partless objects exist; nothing composes anything else).  
  - **Yes** → Q6  

  Q5: Consider a living cat. Is there a single object, the cat?  
  - **No** → *Unoccupied*: Accepts chairs (non-living artifacts) but denies living organisms. No one holds this—it’s deeply counterintuitive to reject cats but accept chairs.  
  - **Yes** → **Moderate restrictivism** (composition occurs for ordinary objects like chairs and cats, but not arbitrary collections like Eiffel-shoe).  

  Q6: Consider a corpse (e.g., a dead cat, with the same parts as before but no longer alive). Is there a single object, the corpse?  
  - **No** → **Van Inwagen’s organicism** (composition occurs only when the parts’ activity constitutes a life).  
  - **Yes** → *Unoccupied*: Accepts living things and corpses but denies other non-living things (like chairs). No one holds this—there’s no clear principle to include corpses but exclude similarly non-living objects (e.g., chairs).  

  ---

  **Notes on Indistinguishable Positions**  
  - **Moderate restrictivism variations**: The tree outputs a single "moderate restrictivism" leaf for simplicity, but real-world moderate views may differ on cases like heaps of sand or corpses. This tree does not distinguish between these sub-variants (e.g., it cannot separate a view accepting corpses from one rejecting them, as long as both accept chairs and cats).  
  - **All occupied positions are separated**: Nihilism, universalism, organicism, and moderate restrictivism are distinguished by the cases used. The unoccupied leaves are included only for logical completeness.  

  **Cases Used**  
  - **Eiffel Tower + shoe**: Tests universalism vs. restrictivism.  
  - **Wooden chair**: Tests nihilism/organicism vs. moderate restrictivism.  
  - **Living cat**: Tests nihilism vs. organicism and confirms moderate restrictivism.  
  - **Corpse**: Tests organicism vs. unoccupied "life + corpse" view.  
  *(Heap of sand not needed to split core positions.)*
