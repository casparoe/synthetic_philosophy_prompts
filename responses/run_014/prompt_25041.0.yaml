prompt: |-
  I've been reading around the meta-problem of consciousness — roughly, the problem of explaining why we think there is a hard problem of consciousness in the first place — and I keep finding that people propose theories of the meta-problem without first being clear about what such a theory is supposed to explain. Before I go any further, I want the desiderata: what must an adequate theory of the meta-problem of consciousness deliver? I mean the full specification — which phenomena it must account for, which judgments and intuitions about consciousness it must explain the presence or absence of, which distinctions it must respect, which empirical results from psychology and neuroscience it cannot contradict, and which explanatory traps it must avoid (for example, explaining our sense that consciousness is mysterious in a way that itself presupposes the very mystery it is meant to explain away). For each requirement, give me the case or consideration that makes it a requirement rather than a mere preference. Then tell me which of these desiderata are non-negotiable — things any theory of the meta-problem simply has to get right — and which are more like commitments of a particular camp (illusionists, realists, phenomenal concept strategists, and so on) that a theory could reasonably reject. I also want to know whether any pair of these desiderata are in tension with each other — whether satisfying one makes it harder or impossible to satisfy another. Finally, tell me which single requirement does the most work in excluding candidate theories, and why. I am less interested in a scorecard of existing views than in the criteria themselves, though a brief indication of where the main approaches stumble would help me see why the criteria matter. Please also tell me which assumptions your list of desiderata depends on — for instance, assumptions about whether the hard problem is real or illusory — and how the list would change if those assumptions were dropped. Respond in the style of an expert writing to a colleague. Think very carefully before answering, and please write in continuous prose only: no headings, no bullet points, no bold text, no tables — just paragraphs, the way you would write an email or a letter.
reasoning: |-
  Okay, the user is diving deep into the meta-problem of consciousness—they want a clear set of desiderata for any theory tackling why we think there's a hard problem. They're frustrated with the lack of clarity in existing literature and want a rigorous framework. 

  First, I need to unpack their request: they want the full specification—phenomena to account for, judgments to explain, empirical constraints, traps to avoid. They also want to know which criteria are non-negotiable versus camp-specific, tensions between desiderata, and which single requirement is the sharpest filter. 

  Hmm, the user is clearly well-read but meticulous. They’re not asking for a survey of theories but for the evaluative scaffolding itself. Their tone suggests impatience with hand-waving—they want philosophical rigor. I should avoid fluff and focus on precision. 

  Key starting point: the meta-problem isn’t about solving consciousness but explaining why we *think* it’s hard. So desiderata must center on psychological/functional explanations of our intuitions. The non-negotiable core? Any theory must explain the *ubiquity* and *resilience* of the hard problem intuition across cultures and contexts, without smuggling in phenomenal properties. If it fails that, it’s circular. 

  But there’s tension here. Explaining the "explanatory gap" feeling (Desideratum 2) might require cognitive mechanisms that, when described, *themselves* feel insufficient—replicating the gap instead of dissolving it. Illusionists embrace this; realists see it as proof the gap is real. 

  The heaviest lift is Desideratum 7: avoiding question-begging. Many theories (especially non-illusionist ones) stumble by implicitly assuming phenomenal consciousness in their explanations—e.g., "we report qualia because we experience them." That’s fatal. This requirement alone filters out naive representationalism or dualist-leaning accounts. 

  Empirical adequacy (Desideratum 4) is another tight constraint. For instance, global workspace theories might explain reportability but not why we feel *that* reportability has a "what-it’s-like" residue. Pathology cases (e.g., blindsight) are landmines here—any theory must align with why patients *deny* experience in blind fields yet process information. 

  Where would the list change if we assumed the hard problem is real? Dramatically. Desideratum 7 (no begging) might relax, allowing that some irreducibility is genuine. But then the meta-problem becomes trivial: we feel a gap because there *is* one. The user likely sees this as unsatisfying—hence their focus on illusionist-leaning frameworks. 

  The user’s demand for tension analysis is sharp. Take "respecting manifest distinctions" (D6) vs. "avoiding mystery-presupposition" (D7). If a theory says we distinguish perception/vivid-imagination because of *phenomenal precision*, it violates D7; if it reduces it to computational differences, it might violate D6 by feeling inadequate. Only a robust cognitive model (e.g., prediction error hierarchies) threads this needle. 

  I’ll close by noting the user’s unspoken need: they want ammunition to critically evaluate papers. By giving them the desiderata hierarchy—with D7 as the litmus test—they can tear down theories that don’t pass structural scrutiny. That’s the real deliverable here.
answer: |-
  Your concern is well-founded: the meta-problem literature often proceeds without rigorously defining success criteria, leading to theories that explain *some* intuitions while neglecting others or begging the question. A robust set of desiderata is essential. Below, I outline the necessary criteria, their justifications, tensions, and dependencies, drawing on the core challenge: explaining why we judge consciousness to pose a hard problem *without presupposing the very phenomenal properties in question*.

  ### Core Desiderata and Their Rationale
  1.  **Explain the Intuition of an Explanatory Gap:** The theory must account for why we persistently feel that physical/functional accounts "leave out" subjective experience (e.g., Mary the neuroscientist, philosophical zombies). *Why required?* This is the *core* intuition defining the hard problem. Failure here renders the theory irrelevant to the meta-problem. Cases like Jackson's Knowledge Argument demonstrate this gap intuition powerfully and commonly. *Non-negotiable.*

  2.  **Explain the "What It’s Like" (WIL) Judgment:** It must explain why we report experiences as having intrinsic, private, qualitative character ("what it is like to see red"). *Why required?* The WIL idiom is the primary linguistic expression of the hard problem intuition. Its ubiquity in discourse (from Nagel to laypeople) demands explanation. *Non-negotiable.*

  3.  **Explain Subjectivity/First-Person Perspective:** The theory must explain why we judge consciousness to be inherently "for me," private, and accessible in a privileged way. *Why required?* Subjectivity is a cornerstone of the hard problem (e.g., the "inverted spectrum" thought experiment relies on private access). Ignoring it leaves a major component unexplained. *Non-negotiable.*

  4.  **Be Empirically Adequate:** The theory’s proposed mechanisms must cohere with established cognitive neuroscience and psychology (e.g., attention, access consciousness, reportability, neural correlates, pathology studies like blindsight). *Why required?* A purely philosophical account risks being untestable or biologically implausible. For instance, any theory must explain why damage to visual cortex (V1) causes reports of visual *experience* loss despite residual function (blindsight). Contradicting robust findings (e.g., the neural basis of access) invalidates the theory. *Non-negotiable.*

  5.  **Explain Resilience and Ubiquity:** It must explain why the hard problem intuition arises robustly across cultures, historical periods (in some form), and individual cognitive variations, and why it resists simple debunking. *Why required?* The intuition isn’t idiosyncratic; it’s widespread and tenacious. A theory attributing it solely to cultural conditioning or philosophical error fails without explaining its cross-cultural recurrence and resistance. *Non-negotiable.*

  6.  **Respect Manifest Distinctions:** The theory must explain why we judge (correctly or not) fundamental differences between, e.g., perception vs. vivid imagination, conscious vs. unconscious processing (e.g., priming), or sensation vs. thought. *Why required?* Our introspective taxonomy drives philosophical distinctions (e.g., phenomenal vs. access consciousness). Ignoring these renders the theory descriptively inadequate. *Non-negotiable.*

  7.  **Avoid Question-Begging / Phenomenal Presupposition:** The explanation *cannot* rely on the existence of intrinsic phenomenal properties or irreducible subjectivity *within its explanatory mechanisms*. *Why required?* This is the cardinal sin. Using phenomenal concepts (e.g., "we report qualia *because* we experience them") to explain the meta-problem simply assumes the explanandum. Chalmers' challenge is to explain the *illusion* (if it is one) without reifying it. *Non-negotiable and the strictest filter.*

  8.  **Explain the Sense of Unity/Integration (Optional but Common):** Many theories also address why consciousness feels unified (the "binding problem" manifest in experience). *Why sometimes included?* Unity is a frequent introspective report tied to the hard problem (e.g., the combination problem in panpsychism). However, it might be less central than WIL or the gap. *Negotiable – a strong theory should address it, but its absence isn’t fatal.*

  9.  **Explain the Sense of Realness/Immediacy (Optional):** Why does conscious experience feel "direct" and "present," unlike abstract thoughts? *Why sometimes included?* This immediacy contributes to the sense that consciousness is fundamental. However, it might be subsumed under WIL judgments. *Negotiable.*

  ### Tensions Between Desiderata
  *   **Respecting Manifest Distinctions (D6) vs. Avoiding Phenomenal Presupposition (D7):** Providing a satisfying explanation for *why* perception feels fundamentally different from imagination often tempts theorists to invoke quasi-phenomenal properties in the explanation (e.g., "perception involves higher-order representations *with qualitative character*"). Maintaining strict adherence to D7 while making D6 feel explanatorily adequate is a major challenge for illusionists.
  *   **Empirical Adequacy (D4) vs. Explaining the Explanatory Gap (D1):** Neuroscience often correlates specific neural processes with reports of conscious experience. However, explaining *why* these processes generate *reports of an explanatory gap* (D1) rather than just reports *of content* requires additional cognitive/computational mechanisms that aren't always directly observable. Bridging the neural correlates to the *gap intuition* is difficult without functional/computational hypotheses that might be hard to test directly.

  ### The Most Excluding Requirement
  **Avoiding Question-Begging (D7)** is the most stringent filter. It immediately disqualifies:
  *   **Naïve Realist/Non-Reductive Explanations:** Simply stating that we report the gap because phenomenal properties are real and irreducible presupposes them.
  *   **Some Phenomenal Concept Strategies (PCS):** If PCS argues that *having* a phenomenal concept *is* (part of) having the experience, it risks circularity. Only PCS versions that provide a wholly non-phenomenal account of acquiring/employing phenomenal concepts survive D7.
  *   **Inadequate Illusionist Accounts:** Illusionist theories that inadvertently smuggle in phenomenal properties (e.g., "the brain *simulates* qualia") fail D7 if "simulation" implies recreating intrinsic properties rather than producing judgments *about* them.

  ### Where Major Approaches Stumble on Desiderata
  *   **Illusionism (e.g., Frankish, Dennett):** Often struggles with D6 (Respecting Manifest Distinctions) and providing an intuitively satisfying account of D1/D2 without triggering the gap feeling anew. Critics argue they don’t fully explain the *force* of the intuition (D5 - Resilience).
  *   **Phenomenal Concept Strategy (PCS - e.g., Loar, Papineau):** Faces D7 head-on. If the "thick" or "direct" nature of phenomenal concepts *presupposes* phenomenality, it fails. Explaining D5 (Ubiquity) – why this conceptual structure arises universally – is also challenging. Can it fully explain D3 (Subjectivity) without residue?
  *   **Realism + Cognitive Limitations (e.g., McGinn, Stoljar):** Often struggles with D4 (Empirical Adequacy) if the limitation is posited as brute or untestable. May also violate D7 if the limitation is defined *in terms of* our inability to grasp how phenomenality arises from physics.
  *   **Higher-Order Thought (HOT) / Global Workspace (GW) as Meta-Problem Solutions:** While explaining access and reportability (part of D6), they often struggle specifically with D1/D2. Why does the meta-cognitive state (HOT) or global availability (GW) generate *judgments of intrinsic qualia* and an *explanatory gap*? Merely explaining reportability doesn’t automatically explain the qualitative *character* ascribed in the report.

  ### Foundational Assumptions & How Desiderata Shift
  My list assumes a **neutral starting point**: the meta-problem is tractable *regardless* of whether the hard problem is real or illusory. The desiderata aim to evaluate theories on their *explanatory adequacy* for the psychological phenomenon of the hard problem intuition.

  *   **If the Hard Problem is Real (Phenomenal Properties Irreducible):** D7 (Avoiding Question-Begging) becomes problematic. A *full* explanation of our judgments might *require* reference to real phenomenal properties. The meta-problem might reduce to: "Why do we correctly recognize this irreducibility?" This drastically weakens D7 or redefines the meta-problem itself. D1, D2, D3, D5 become easier (we intuit the gap because it exists) but explaining D6 (specific distinctions) without simply listing real phenomenal differences becomes harder. The focus shifts towards explaining our *epistemic access* to these properties.
  *   **If Strict Illusionism is Presumed:** D7 becomes paramount. The focus intensifies on finding cognitive mechanisms that robustly generate the *illusion* of irreducibility/qualia (D1, D2, D3) while perfectly respecting D4 and D6 without invoking them. Explaining D5 (Resilience) becomes crucial evidence for the illusionist claim.

  In essence, a robust meta-problem theory must provide a comprehensive, non-question-begging, empirically grounded cognitive account of our most central intuitions about consciousness – most crucially, the persistent sense that something irreducibly subjective is left out by physical science. The challenge is to do this while respecting the texture of our actual psychological landscape. The desiderata above provide the necessary, though daunting, framework for evaluating any serious attempt.
