  For the four requested points:
  1. **Hailsham's economy**: The token system isn't commodification but a *façade* of valuation. Madame's gallery represents external validation the clones crave but which is ultimately extractive. Anderson's modes of valuation apply ironically—art is treated as expressive but is really instrumental for guardians' conscience. Satz's noxiousness criteria fit: the trades exploit vulnerability while masking power imbalance.
  2. **Norfolk trip**: The cassette's resale epitomizes alienation. The clones can't own their past (literally, their lost items), yet others profit from it. Their passive acceptance signals how normalized dispossession is—which indicts non-market appropriation more than markets would.
  3. **Absence of organ markets**: Not pricing organs isn't evasion but Ishiguro's point: the horror lies in the gift-and-duty framework precluding refusal. A market might let clones "sell," but Ishiguro shows the deeper violence is ontological—they're never permitted selves to whom injustice *could* be done. Pricing would distract from this.
  4. **Deferral rumor**: Its falsehood reveals emotion can't ration fairly when power decides what counts as "true love." Unlike markets allocating by willingness-to-pay, it promises agency but delivers arbitrariness, mirroring how society delegates life-value judgments to vague sentiment.

