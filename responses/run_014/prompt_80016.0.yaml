prompt: |-
  I've been thinking on my own about whether it is ever permissible to sacrifice one person to save five, and at a dinner last month my friend shut down the whole question by saying that utilitarianism "disrespects the separateness of persons," as if the phrase settles it. I'm fairly sure the phrase is doing different work in different mouths, and I can't pin down what it is actually claiming. One thing I've noticed: in the classic trolley case, where you divert a runaway trolley from a track with five people onto one with a single person, even someone who adds up welfare says divert — so the separateness objection can't be doing any work there, and it only seems to bite in cases where you use a person as a tool, like killing one healthy stranger to harvest organs for five dying patients. I also keep wondering whether utilitarians already accept separateness in some weak sense, on the view that each person's welfare simply counts once in the total and no one's welfare is double-counted, and whether the phrase only has teeth if it means something stronger — that a person's loss can never be outweighed by greater gain elsewhere, or that welfare isn't fungible across people at all. Could you lay out the different precise claims that "the separateness of persons" might be making, from the trivial to the radical, and say for each which are platitudes, which are substantive and defensible, and which are actually false? I especially want to know which reading, if any, would actually support dismissing utilitarianism in the organ-harvesting case, and which of these my friend was most plausibly invoking when she used the phrase to end the conversation. Please write your answer as continuous prose only — no headings, bullet points, bold text, or tables — the way you would write an email.
