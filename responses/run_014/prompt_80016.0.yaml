answer: |-
  You've put your finger on the core ambiguity surrounding "the separateness of persons" as a critique of utilitarianism. It's indeed a phrase that can mean several distinct things, ranging from observations utilitarians readily accept to radical claims they explicitly reject. Let's break down the possible precise claims it might be making, assess their status, and see which might actually challenge utilitarianism, particularly in the organ-harvesting case, and what your friend likely invoked.

  The most basic, almost trivial, claim is **numerical distinctness**: Persons are separate entities; there isn't one big mind or blob of welfare, but many individual centers of experience. Utilitarians accept this entirely. It's the foundational reason *why* they sum individual welfares – precisely *because* welfare is located in separate persons. Counting each person's welfare once and summing it *presupposes* their separateness. This is a platitude, not a substantive critique. When you wonder if utilitarians accept separateness in a "weak sense" of simply counting each once, this is it, and they do. No one serious disputes this.

  A stronger claim is **welfare non-fungibility across persons**: This holds that the welfare (or loss) of one person *cannot* simply be canceled out or outweighed by the welfare (or gain) of another person, even in aggregate. It suggests that welfare isn't a homogeneous "stuff" that can be freely transferred or aggregated across different individuals like money. This is where the critique starts to bite. Utilitarians explicitly *reject* this view. For them, welfare *is* fungible across persons; a unit of happiness (or reduction of suffering) is morally equivalent regardless of who experiences it. The loss to A *can* be outweighed by gains to B, C, D, E, and F, precisely because the aggregate welfare increases. This fungibility is essential to the utilitarian calculus in both the trolley diversion and the organ-harvesting case. However, whether non-fungibility is *defensible* is highly contested. Critics argue it captures something vital about the irreplaceability of individual experience and the wrongness of treating people as mere vessels for interchangeable welfare units. Utilitarians counter that refusing fungibility leads to absurdities, like refusing to save five lives because it requires "using" resources that could slightly benefit a sixth person elsewhere. This claim is substantive and central to the debate, but utilitarians deny its truth.

  The strongest claim, often lurking behind the phrase, is **inviolability or agent-relative constraints**: This asserts that certain ways of *using* a person, especially as a mere means or causing direct, intended harm to them, are impermissible *even if* doing so maximizes aggregate welfare. It's not just that welfare isn't fungible, but that persons have a special moral status that imposes *constraints* on what can be done *to them* for the greater good. This directly targets the organ-harvesting case. Diverting the trolley might be permissible (even for some non-utilitarians) because it involves *redirecting* an existing threat away from five onto one, arguably without *intending* the one's death as a means or *using* their body. Killing the healthy stranger, however, involves directly, intentionally harming an uninvolved person, using their body and life purely as a tool to save others. This, the claim argues, disrespects their separateness by violating their inherent moral boundary; their life and body are not resources to be sacrificed at the altar of aggregate utility. This is a substantive and powerful claim, defended by deontologists and rights theorists. Utilitarians explicitly *reject* it, arguing that the outcome (five lives saved vs. one lost) is what matters, not the specific causal pathway or intention, provided the net welfare gain is equivalent. They see inviolability as an irrational taboo that worsens outcomes. Defensibility hinges on whether one accepts that consequences are the sole moral currency or whether moral constraints exist independently.

  So, where does this leave your friend and the organ case? The trivial claim (numerical distinctness) does no work against utilitarianism. The welfare non-fungibility claim is a core point of disagreement but doesn't, by itself, explain the *special* wrongness perceived in the organ case versus the trolley diversion. The critique that seems tailored to explain *why* the organ case feels different – and likely what your friend invoked to "settle it" – is the **inviolability/constraint claim**.

  When your friend said utilitarianism "disrespects the separateness of persons" to dismiss the sacrifice question, particularly contrasting with the trolley case you mentioned, she was almost certainly invoking this strongest sense. She meant that utilitarianism fails to recognize the moral barrier prohibiting the direct instrumentalization and destruction of one person, even for a greater aggregate good. It treats persons as fungible containers of value, violating the respect owed to each *as a separate individual* whose life and body are not communal property. This is the interpretation that gives the phrase its rhetorical force in shutting down the conversation – it presents utilitarianism as fundamentally missing something profound about individual moral worth in its relentless focus on aggregate sums. Whether this claim is ultimately *correct* is the heart of the centuries-old debate, but it's certainly the substantive, non-trivial reading that offers a principled reason to reject the utilitarian answer in the organ-harvesting case specifically. Your instinct that it bites hardest when a person is "used as a tool" is precisely right and points directly to this inviolability constraint interpretation. That's likely what your friend had in mind, however succinctly she expressed it.
