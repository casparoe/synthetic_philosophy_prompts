prompt: |-
  I've been reading a lot about time-inconsistent preferences lately — the hyperbolic discounting literature, and the whole "Ulysses contract" and precommitment apparatus that comes up so often on the rationalist forums — and it has me wondering whether it is really the same phenomenon that the philosophers mean by akrasia, or whether we have been quietly conflating two different things. I raised it at a dinner with two friends, and they got into it in a way I could not referee. One, let's call her Mara, keeps insisting that hyperbolic discounting is not akrasia at all; the other, Dev, thinks it is actually a cleaner case of akrasia than the stock "I meant to go to the gym" examples.

  Here is roughly how it went. Mara opened by saying that akrasia, properly understood, is acting against one's own *synchronous* judgment: at the very moment of action, one judges A to be the best thing to do and then does B. Hyperbolic discounting does not produce that. At any given moment the discounting agent's preferences are internally consistent — given where it is on the clock, it genuinely judges the immediate option to be better, and there is no gap between its judgment and its action. What changes is the judgment itself, as time passes, in exactly the way that someone who prefers coffee in the morning and tea in the afternoon does not have a weakness of will but simply has time-indexed preferences. So what we have been calling "weakness of will," she said, is really just ordinary, unremarkable preference change over time, and the label "akrasia" has been doing a lot of work it cannot support.

  Dev pushed back on two fronts. First, he said the synchronous-judgment criterion is too narrow and quietly assumes the very thing in dispute. The hallmark of the hyperbolically discounting agent is that it *knows* its future self will flip: at the planning stage it judges that it would be better to follow the plan, and at the moment of temptation it does the impulsive thing anyway. So there is a violated judgment after all — just a diachronic or higher-order one, a judgment about what the agent ought to do given what it knows about its own future behavior. Second, he said that the move "I override my past self all the time, that is just how I change my mind" is doing too much work. Changing one's mind in light of new evidence is one thing; being systematically captured by a transient, steeply-discounted impulse is another. The signature of the hyperbolic agent, he said, is precisely that it would *pay to precommit* — it would prefer to be a creature that does not have this preference-reversal property, but it cannot bring itself to be one. That "I know I should commit but I cannot" is, he argued, the very signature of weakness of will, not its absence.

  Mara conceded that the agent would pay to precommit, but said that fact does not make it akratic; it only makes the agent's preferences *expensive*, in the way that a person with a strong but mistaken fear of flying is paying a cost. And she returned to the multiple-selves framing: if each time-slice is treated as a distinct agent, then the present slice is not violating any of its *own* judgments at all — it is just a different agent making a different choice, the way I can rationally refuse to honor a promise my younger self made. Dev replied that the multiple-selves framing does not dissolve the problem, it only relocates it. If the present slice is a different agent, then it is *harming* a future slice it genuinely cares about, which is a form of akrasia at the individual level; and the fact that the agent cannot "just make a plan and stick to it" is exactly the weakness of will that Mara wants to deny. They were still going when I had to leave, and I honestly could not tell who was more right. So please go through their exchange and tell me, move by move, who is right about which specific point — and then say what, if anything, both of them are missing.
reasoning: |-
  Okay, the user is grappling with a philosophical debate about whether hyperbolic discounting is the same as akrasia. They presented an argument between Mara and Dev, and I need to dissect each point. Mara argues that hyperbolic discounting isn't akrasia because preferences change synchronously, like preferring coffee in the morning and tea in the afternoon. She says each time-slice is consistent internally, so there's no weakness of will at the moment of action. Dev counters that akrasia involves violating a diachronic judgment—knowing future preferences will flip but acting impulsively anyway. He also points out that the desire to precommit shows a conflict that defines weakness of will.

  First, I need to evaluate Mara's synchronous judgment criterion. Akrasia traditionally involves acting against one's better judgment at the moment. But in hyperbolic discounting, the agent genuinely prefers the immediate reward when the time comes. So Mara's point here seems valid. However, Dev's argument about the planning stage introduces a higher-order judgment. The agent at t0 plans to resist at t1, but at t1, they act against that plan. This resembles akrasia because there's a failure to adhere to a prior commitment, even if the current preference is consistent.

  The multiple-selves framing is tricky. Mara uses it to say each time-slice is a different agent, so no self-contradiction. But Dev argues that the current self harms future selves, which is akratic at the individual level. The inability to stick to plans highlights a weakness. The precommitment point is crucial. The willingness to pay to avoid future temptation indicates a conflict within the agent's preferences over time, suggesting a form of irrationality or lack of self-control.

  I should also consider what both are missing. Mara might be underestimating the diachronic nature of agency. Personal identity over time means that past commitments matter. Dev might not fully address why synchronous consistency isn't sufficient. Additionally, both might overlook that akrasia involves a struggle, which hyperbolic discounting lacks—it's a passive preference shift. The emotional component of traditional akrasia isn't present in the discounting model. Also, the distinction between preference change due to new information versus mere time might be important. Hyperbolic discounting's impulsivity without new data makes it different from rational preference updates.
answer: |-
  Let's break down Mara and Dev's arguments point-by-point, drawing on philosophical distinctions from Davidson, Bratman, Ainslie, and contemporary debates about time-inconsistency. Neither is entirely wrong, but both overlook key nuances.

  ### Mara's Arguments & Where She's Right
  1. **Synchronous judgment criterion**  
     Mara is correct that **classical akrasia** (à la Davidson) requires acting *against your own best judgment at the moment of action*. Hyperbolic discounting doesn't fit this:  
     - At t=1 (temptation moment), the agent *sincerely believes* eating cake > dieting.  
     - This differs from akrasia (e.g., "I know this cake will ruin my diet *right now*, but I eat it anyway").  
     ✅ **Verdict: Mara wins this point.** Time-inconsistent preferences ≠ Davidsonian akrasia.

  2. **Preference change ≠ weakness of will**  
     Mara rightly notes that rational preference shifts (e.g., coffee→tea) aren't akratic. Hyperbolic discounting is a *predictable, structural preference reversal* driven by time, not failure of self-control.  
     ✅ **Verdict: Mara is partially right.** The mechanism is different from impulsive akrasia.

  ### Dev's Arguments & Where He's Right
  1. **Violated diachronic judgment**  
     Dev correctly identifies that hyperbolic discounting violates a **planning-stage commitment**:  
     - At t=0, the agent judges "Stick to diet at t=1" as best *overall*.  
     - At t=1, they act against this prior higher-order judgment.  
     - Philosophers like Bratman argue that *diachronic agency* requires respecting past commitments without new evidence.  
     ✅ **Verdict: Dev wins here.** This aligns with "planning agency" models of weakness of will.

  2. **The precommitment test**  
     Dev's strongest point: The hyperbolic agent **would pay to constrain future choices** (e.g., buying smaller plates). This reveals:  
     - A conflict between "global" and "local" preferences.  
     - The agent feels *trapped* by future irrationality, a hallmark of akrasia.  
     ✅ **Verdict: Dev is right.** This matches Ainslie's view of hyperbolic discounting as "breakdown of will."

  ### Mara's Counterarguments & Weaknesses
  - **"Preferences are just expensive"**: While true, this ignores that akrasia often *manifests* as costly preferences (e.g., addiction). Cost alone doesn't resolve the debate.  
  - **Multiple-selves framing**: Dismisses personal identity over time. If each "self" is independent, responsibility dissolves—but we hold people accountable for broken commitments.  
  ❌ **Flaw: Overly narrow definition of akrasia.**

  ### Dev's Counterarguments & Weaknesses
  - **"Harming future selves"**: While compelling, this assumes a unified self—begging the question against Mara's framing.  
  - **"Can't stick to plans"**: Not unique to akrasia (e.g., I might abandon a plan due to new information).  
  ❌ **Flaw: Conflates time-inconsistency with traditional willpower failure.**

  ### What Both Are Missing
  1. **Two types of akrasia?**  
     Philosophers distinguish:  
     - **Synchronic akrasia**: Acting against *current* judgment (Mara's focus).  
     - **Diachronic akrasia**: Violating prior commitments *without new reasons* (Dev's focus).  
     Hyperbolic discounting fits the latter—a form of "procedural irrationality" (R. Holton).

  2. **The role of affect**  
     Traditional akrasia involves *emotional struggle* (guilt, conflict). Hyperbolic discounting can be coldly mechanical—no inner battle. Mara underplays this; Dev overstates it.

  3. **Self-binding as diagnostic**  
     The willingness to precommit *is* evidence of akrasia. As Elster argues: Only agents who distrust their future selves seek constraints. Mara dismisses this too quickly.

  4. **The "no new information" clause**  
     Key to Dev's point: The reversal occurs *only because time passed*, not new data. Mara's coffee/tea analogy fails here—hyperbolic discounting isn't a genuine preference shift.

  ### Synthesis: Who's More Right?
  - **On definition**: Mara is technically correct that hyperbolic discounting ≠ synchronic akrasia.  
  - **On phenomenology**: Dev is right that it *functions* as weakness of will in real life (precommitment desires, self-sabotage).  
  - **Overall**: **Dev's position is stronger philosophically**. Hyperbolic discounting is a *structural form of diachronic akrasia*—it captures why we feel "weak-willed" when abandoning long-term plans for immediate rewards. Mara's view reduces agency to atomic moments, ignoring how identity depends on honoring past/future selves.

  ### Practical Resolution
  Your friends are debating two paradigms:  
  - **Mara**: Akrasia as *synchronic failure* (philosophy-first).  
  - **Dev**: Akrasia as *diachronic self-undermining* (behavioral-economics-first).  
  Both occur, but hyperbolic discounting better explains *planned self-sabotage* (e.g., "I'll diet tomorrow" → eats cake today). Calling it "akrasia" remains useful—provided we specify it's the *temporal* subtype. The key insight both miss: **The hyperbolically discounting agent isn't weak at t=1; they were *overconfident* at t=0 about controlling future impulses.** The flaw is in planning, not (just) execution.
