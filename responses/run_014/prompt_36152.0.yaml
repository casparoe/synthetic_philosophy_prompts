prompt: |-
  Hey, I need your help thinking something through. You're a professional philosopher who specializes in population ethics and value theory, so please really lean into that. Think carefully before you answer, and feel free to brainstorm out loud a bit first before locking anything in.

  Background: I'm a software engineer, no philosophy training beyond half-reading a Wikipedia page. But I ran into the "repugnant conclusion" thing (the Parfit one, where you end up having to say a gigantic population of people whose lives are barely worth living is better than a smaller happy one) and it broke my brain a little. I went looking for "the right theory" and found out there are like a dozen of them (total utilitarianism, average views, critical-level views, person-affecting views, lexical views...) and every single one seems to make somebody furious. So before I waste my life reading papers defending each one, I want to work backwards: what should a theory of "which population is better" actually have to deliver before it's even worth considering? Basically I want a spec. Like, if I were writing acceptance tests for a theory, what are the tests?

  So write me the desiderata list. For each requirement: state it, then give the case or consideration that motivates it (a lot of these will be little thought experiments with two populations A and B -- that's fine, but keep them concrete, like "10 billion at 8/10 quality of life vs 10^15 at 0.001/10"). And importantly, tell me which requirements are genuinely non-negotiable and which are just the pet obsession of one camp. I genuinely don't know, so don't hedge -- if you think, say, the intuition behind the repugnant conclusion itself is just a bug in human psychology that a good theory should override, say that.

  A few things I specifically want in the list, because I keep going back and forth on whether they belong:

  1. Transitivity -- if A is better than B and B is better than C, A has to be better than C. As an engineer this feels like table stakes to me, but is it? I've heard some people bite weird bullets here.
  2. Something like "adding people with lives worth living, without making anyone worse off, shouldn't make things worse" -- a coworker of mine says any theory that denies this is insane, but I've also read that accepting it plus a couple of other innocuous-looking things *forces* the repugnant conclusion. Is that actually a proven thing or just internet lore? If the desiderata are jointly unsatisfiable, I want to know which ones to drop, that's honestly the part I care about most.
  3. Whether "better" has to mean better *for* anyone. Like, if no individual person exists in both population A and population B, in what sense is one "better"? Is a theory that just refuses to compare them copping out or being honest?

  Also flag any pair of desiderata you suspect can't be satisfied together. Then, briefly -- like a paragraph max, don't turn this into a literature review -- say how total utilitarianism and average utilitarianism do against your list, so I can see the list actually being used to reject something.

  One more constraint: no reading lists, no citations, no "see Parfit 1984". I want the ideas, not the bibliography. And don't assume I know jargon -- if you use a term like "person-affecting" or "lexical threshold", explain it in plain words on first use. Take your time and get the requirements right; the scoring bit is an afterthought.
reasoning: |-
  Okay, the user is a software engineer who's encountered the repugnant conclusion and is overwhelmed by the various population ethics theories. They want a set of clear desiderata to evaluate these theories, like acceptance tests in software. Let me start by recalling what the repugnant conclusion is—Parfit's idea that a huge population with barely worthwhile lives could be better than a small happy one. The user's main goal is to figure out what a good population theory must satisfy and where compromises might be necessary.

  First, I need to list the desiderata. The user mentioned transitivity, adding people with positive lives not making things worse, and whether "better" needs to be better for someone. Let me expand on these. Transitivity seems essential, but there are theories like Temkin's that reject it. However, for a coherent framework, it might be non-negotiable. Then there's the Mere Addition principle: adding happy people without harming others should improve things. But this leads to the repugnant conclusion, so it's a key conflict point.

  The user also wants to know if comparisons between disjoint populations are possible. Person-affecting views say no, but that might be too restrictive. Other important points include avoiding the repugnant conclusion itself, not leading to extinction (Sadistic Conclusion), and respecting equality. Asymmetry between creating happy versus unhappy lives is another consideration; maybe avoiding suffering is more critical than adding happiness.

  I should structure each desideratum with a clear name, description, case example, and negotiability. For instance, Non-Anti-Egalitarianism could use the example of redistributing resources to raise the worst-off. That seems non-negotiable. Then, test cases like the Repugnant Conclusion and the Mere Addition Paradox will highlight conflicts.

  The user’s deeper needs: they want a practical framework to navigate theories without getting bogged down in academic debates. They might feel frustrated by conflicting theories and seek clarity on which principles are essential versus optional. Also, understanding where trade-offs lie (e.g., dropping Mere Addition to avoid repugnance) is crucial for them.

  I recall that Arrhenius proved no theory can satisfy all desiderata. So, I’ll list the core requirements and note which ones conflict. For example, Transitivity + Mere Addition + Quality over Quantity leads to contradiction. The user needs to know which desiderata are incompatible, helping them decide which to prioritize.

  Finally, evaluating Total and Average Utilitarianism against the list will show how each fails certain tests. Total Utilitarianism accepts the repugnant conclusion, while Average might prefer a small happy group over a larger, slightly less happy one. Highlighting these trade-offs will give the user a clear comparison.

  I need to keep jargon minimal. Explain terms like "person-affecting" simply. Also, avoid citations as requested. Focus on clear examples and logical conflicts. Ensure each desideratum is motivated by a concrete case, like the 10 billion at 8/10 vs. massive population at 0.001/10 for the repugnant conclusion.

  In summary, the user needs a structured, no-nonsense guide to population ethics' core principles, where they conflict, and how major theories stack up. This will empower them to critically assess different theories without exhaustive reading.
answer: |-
  Here's a specification ("acceptance test suite") for a population axiology, based on core ethical intuitions and logical constraints. Desiderata are ranked by negotiability, with core conflicts highlighted.

  ### Core Desiderata (Generally Non-Negotiable)

  1.  **Non-Explosive Misery (Avoid Hellscapes):**
      *   *Description:* A world with vast suffering is worse than a world with no one, or a world with minor suffering.
      *   *Test Case:* Population H: 10^15 people living in constant, excruciating agony (-1000/10 QoL). Population E: Empty world (0 people). Population M: 1 person with mild discomfort (-1/10 QoL).
      *   *Requirement:* E > H and M > H. A theory allowing H to be best fails catastrophically.
      *   *Negotiability:* **Non-Negotiable.** Failing this is usually disqualifying.

  2.  **Positive Existence (Worthwhile Lives are Good):**
      *   *Description:* Adding people whose lives are genuinely worthwhile (positive wellbeing), *without harming existing people*, makes the outcome better *or at least not worse*.
      *   *Test Case:* Population A: 1 billion happy people (10/10). Population A+: A + 1 billion additional happy people (10/10). (No one in A is harmed).
      *   *Requirement:* A+ ≥ A (Better or equal). Denying this suggests creating happy people is bad or neutral, which is deeply counterintuitive.
      *   *Negotiability:* **Non-Negotiable for most.** (But see Conflict Zone below).

  3.  **Non-Anti-Egalitarianism (Equality Matters):**
      *   *Description:* Holding average wellbeing constant, a more equal distribution is better than a less equal one. Reducing inequality by raising the worst-off is good.
      *   *Test Case:* Population U: 10 billion people at 5/10 QoL (perfect equality). Population I: 5 billion at 9/10, 5 billion at 1/10 (same average: 5/10).
      *   *Requirement:* U > I. A theory claiming I is better ignores the suffering of the worst-off.
      *   *Negotiability:* **Non-Negotiable for most.** Prioritizing equality is central to many ethical views.

  4.  **Asymmetry (Avoiding Harm > Creating Benefit):**
      *   *Description:* The duty to avoid creating a miserable life is stronger than the duty to create a happy life. Not creating a happy person is not bad in the same way creating a miserable person is bad.
      *   *Test Case:* Choice 1: Create a happy child (10/10) OR create no child. Choice 2: Create a miserable child (-10/10) OR create no child.
      *   *Requirement:* Choice 1: Creating the child is *good*, but *not* creating it is *not bad*. Choice 2: Creating the child is *very bad*, not creating it is *good* (or at least neutral). A theory demanding we create happy people regardless of context (or equating not-creating-happy with creating-miserable) is problematic.
      *   *Negotiability:** **Strongly Preferred, often Non-Negotiable.** Rejecting this leads to demanding procreation or equating omissions with acts.

  5.  **Avoid the Sadistic Conclusion:**
      *   *Description:* Adding people with *negative* wellbeing (lives not worth living) should not be better than adding people with *positive* wellbeing, all else equal.
      *   *Test Case:* Start with Population B: 1 billion at 5/10. Option 1: Add 1 billion people at +1/10 (positive lives). Option 2: Add 1 billion people at -1/10 (negative lives).
      *   *Requirement:* (B + Option 1) > (B + Option 2). A theory claiming adding miserable people is better than adding happy people is "sadistic".
      *   *Negotiability:* **Non-Negotiable.** Failing this is widely seen as absurd.

  ### Important But Negotiable Desiderata (Often Conflict-Prone)

  6.  **Transitivity:**
      *   *Description:* If A > B and B > C, then A > C. Essential for coherent, rational choice.
      *   *Test Case:* If theory says A (10 billion @ 7/10) > B (20 billion @ 6/10) and B > C (40 billion @ 5.5/10), then it must say A > C.
      *   *Negotiability:* **Strongly Preferred (Core for rationality), but some bite the bullet.** Violations make decision-making chaotic. Most theories uphold it.

  7.  **Quality over Quantity / Avoid the Repugnant Conclusion:**
      *   *Description:* A large population where lives are barely worth living is *not* better than a much smaller population with very high quality lives.
      *   *Test Case:* Population A: 10 billion flourishing lives (9/10). Population Z: 10^15 (a quadrillion) lives barely worth living (0.001/10).
      *   *Requirement:* A > Z. Accepting Z > A is the "Repugnant Conclusion".
      *   *Negotiability:* **Highly Desired, but often sacrificed.** This is the core tension. Many theories *must* accept it if they hold Positive Existence and Transitivity. Rejecting it usually means rejecting one of those or adding complexity.

  8.  **Non-Existence Independence:**
      *   *Description:* The value of adding a person shouldn't depend on unrelated people who exist elsewhere. Comparisons between groups should focus on the people involved.
      *   *Test Case:* Compare two futures from our current world: Future X: Add 1 million happy people (8/10). Future Y: Add 1 million slightly happier people (8.1/10). This comparison shouldn't change based on whether trillions of aliens exist in Andromeda with low wellbeing.
      *   *Requirement:* X vs Y should be the same regardless of Andromeda aliens. A theory where adding the 8.1/10 group is worse if aliens exist is counterintuitive.
      *   *Negotiability:* **Desired, often sacrificed.** Total Utilitarianism fails this spectacularly.

  9.  **Person-Affecting Compatibility:**
      *   *Description:* "Better" should mean better *for* someone. If populations A and B contain completely different people, comparing them as "better" or "worse" simpliciter might be incoherent. Value depends on how individuals fare.
      *   *Test Case:* Population Alpha (on Earth): 1 billion happy people. Population Beta (on Mars): 1 billion different happy people (same average). Is one "better"?
      *   *Requirement:* Theories should either explain how one *is* better for someone (difficult with disjoint groups), or acknowledge the comparison is problematic/moot. Denying *any* comparison between disjoint groups might be too restrictive.
      *   *Negotiability:* **Deeply Contested.** "Impersonal" theories (like Total Util) reject this requirement. "Person-Affecting" theories embrace it but struggle with many comparisons.

  ### The Conflict Zone (Impossibility Theorems)

  *   **The Core Problem:** **Arrhenius's Impossibility Theorem** (and others) rigorously prove that **no population axiology can simultaneously satisfy all of the following:**
      1.  **Positive Existence** (A+ ≥ A)
      2.  **Non-Anti-Egalitarianism** (U > I)
      3.  **Avoidance of the Repugnant Conclusion** (A > Z)
      4.  **A strong quality constraint** (e.g., that a sufficiently good life for a few is better than many barely-worthwhile lives).
      5.  **Transitivity**
      6.  **Some basic continuity/domain assumptions** (e.g., wellbeing can vary continuously).
  *   **Consequence:** You **must** sacrifice at least one desideratum. This is not internet lore, it's a major result in population ethics.
  *   **Common Sacrifices:**
      *   **Total Utilitarianism:** Sacrifices *Avoid Repugnant Conclusion* (embraces A < Z) and *Non-Existence Independence*.
      *   **Average Utilitarianism:** Sacrifices *Positive Existence* (A+ might be worse than A if it lowers the average) and *Non-Anti-Egalitarianism* (can prefer I over U).
      *   **Critical-Level Theories:** Sacrifice *Person-Affecting Compatibility* and sometimes flirt with *Sadistic Conclusion* or *Repugnance* depending on level.
      *   **Person-Affecting Views:** Sacrifice *Transitivity* and the ability to make many comparisons (like A vs Z).
      *   **Lexical Views (prioritize wellbeing above a high threshold):** Can sacrifice *Continuity* and sometimes *Positive Existence* for low-positive lives.

  ### Scoring Two Major Theories Against the Spec

  1.  **Total Utilitarianism (TU): Good = Sum of all wellbeing.**
      *   **Passes:** Positive Existence (A+ > A), Non-Explosive Misery (H is worst), Transitivity, Non-Anti-Egalitarianism (if sum is equal, prefers equality? Not inherently - fails strict test unless combined), Avoids Sadistic Conclusion.
      *   **Fails Catastrophically:** Avoid Repugnant Conclusion (Definitely says Z > A). Fails Non-Existence Independence (Value of Earth depends on alien wellbeing). Fails Person-Affecting Compatibility (Value is impersonal sum). Fails Asymmetry (Not creating a happy person *is* bad, equivalent to creating a miserable one? Debate exists, but often leans impersonal).

  2.  **Average Utilitarianism (AU): Good = Average wellbeing.**
      *   **Passes:** Avoid Repugnant Conclusion (A > Z easily), Non-Explosive Misery (H has terrible average), Avoids Sadistic Conclusion (Adding positives raises avg, negatives lowers it), Transitivity.
      *   **Fails Catastrophically:** Positive Existence (Adding happy people *lowers* the average if they are less happy than current average? A+ < A if new people <10/10). Fails Non-Anti-Egalitarianism (Prefers I over U if averages are equal? I has same average, no preference for equality). Fails Asymmetry (Not creating happy people avoids lowering average = good? Creating miserable people lowers avg = bad. Complex fit, but not core). Fails Non-Existence Independence (Average depends on unrelated populations).

  ### Summary of Key Trade-offs

  *   **Non-Negotiable (Usually):** Non-Explosive Misery, Avoid Sadistic Conclusion, Non-Anti-Egalitarianism, Asymmetry. Positive Existence is *almost* non-negotiable but forces hard choices.
  *   **Crux of Conflict:** You **cannot** have *Positive Existence*, *Avoid Repugnant Conclusion*, *Transitivity*, and *Strong Quality Priority* together. You **must** drop one.
  *   **Deep Question:** Is "better" fundamentally *person-affecting* (about welfare of individuals) or *impersonal* (about states of affairs)? This shapes what sacrifices seem acceptable.
  *   **Engineer's Lens:** Think of this as an impossibility theorem. Your desiderata list defines constraints. Arrhenius proves some combinations are logically inconsistent. You need to decide which constraint to relax. There's no "correct" answer, only trade-offs based on deeper values. Total Util prioritizes existence and sum, sacrificing repugnance avoidance. Average Util prioritizes quality and repugnance avoidance, sacrificing positive addition. Other theories try different relaxations (e.g., Critical-Level drops person-affecting, Lexical views drop continuity/strong addition). The "spec" reveals the unavoidable engineering compromises.
