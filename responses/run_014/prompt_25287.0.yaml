prompt: |-
  Hey — I'm a journalist who covers the science beat, and I'm working on a longread about the evolutionary psychology wars. I've been reporting on this for a while and I've sort of accumulated a set of views, but I've never actually checked whether they're consistent with each other. Before I write this piece I want someone to audit my position. Here's where I've landed:

  (1) The adaptationist program — the approach of assuming a psychological trait is an adaptation and then working backwards to figure out the selection pressures that shaped it — is a legitimate and productive research strategy. You've got to start somewhere, and reverse-engineering is how you generate testable hypotheses.

  (2) That said, I think a very large fraction of specific evolutionary psychology hypotheses — the stuff about mate preferences, cheater-detection modules, waist-to-hip ratio preferences, sex differences in jealousy — are basically just-so stories. They're underdetermined by the available evidence and often formulated in ways that make them unfalsifiable in practice.

  (3) Evolutionary psychology should be held to exactly the same epistemic standards as other historical sciences like paleontology, geology, or cosmology. No special skepticism, but also no special pleading.

  (4) When an evolutionary hypothesis makes a surprising, non-obvious prediction that gets confirmed empirically, that's strong evidence for it. This is how historical sciences make progress, and evo psych should be no different.

  (5) The charge that evolutionary psychology rationalizes the status quo or provides scientific cover for regressive politics is a political objection, not an epistemic one. It shouldn't affect our assessment of whether the science is good science.

  (6) Cross-cultural consistency of a psychological trait is decent evidence that it has an evolved basis, but it's not decisive — convergent cultural evolution can produce similar patterns independently.

  (7) The reverse-engineering approach — inferring ancestral selection pressures from the structure of present-day psychological mechanisms — can yield genuine knowledge even when we don't have independant evidence about ancestral environments. The design of the mechanism itself tells you something about what it was designed for.

  Go through these and tell me which pairs are genuinely in tension and which only look like they are. Rank the real tensions by severity, and for each one say what the cheapest fix would be — which commitment I'd have to modify or drop, and what it would cost me. Don't just flag every pair; some of these sit together fine and I need to know which ones do. Keep it to 500 words max — I have a deadline.
reasoning: |-
  Okay, the user is a science journalist working on a piece about evolutionary psychology. They've outlined seven positions they've developed and want me to audit them for internal consistency. This is a sophisticated request that requires careful philosophical and scientific analysis.

  First I need to understand their core concerns. They've clearly done extensive research but are worried about potential contradictions in their synthesized position. The deadline constraint means I must prioritize the most critical tensions while acknowledging where their views cohere well.

  Looking at their seven points, several pairings deserve attention. Point 1 defends adaptationism as a valid starting point, while point 2 criticizes many specific hypotheses as "just-so stories." This creates tension around evidence thresholds - what distinguishes legitimate reverse-engineering from unfalsifiable speculation? The key is recognizing that point 1 describes methodology while point 2 addresses empirical execution.

  Points 3 and 4 present an interesting interplay. Demanding equal standards for historical sciences (point 3) while emphasizing predictive success as validation (point 4) is consistent but raises the bar. This actually strengthens their position by requiring evo psych to meet paleontology's rigor - where predictive tests (like fossil discoveries confirming evolutionary hypotheses) are gold standards.

  Point 5's insulation of science from politics seems robust but could use nuance. While political criticism shouldn't dictate epistemic assessment, we must acknowledge how research questions get framed. This doesn't undermine their core argument though.

  The cross-cultural evidence discussion (point 6) wisely balances evidentiary value with limitations. It complements point 7's focus on reverse-engineering, though we should note that both approaches become stronger when combined - convergent design features across cultures plus functional analysis provide mutual reinforcement.

  The most significant tension emerges between their defense of reverse-engineering without independent environmental data (point 7) and their criticism of underdetermined hypotheses (point 2). The cheapest fix involves moderating point 7 to acknowledge that reverse-engineering gains credibility when correlated with other evidence streams, without abandoning its core validity.

  Throughout this, I must respect their expertise by avoiding oversimplification while meeting the 500-word constraint. The analysis should empower them to refine arguments without compromising their thoughtful synthesis.
answer: |-
  Here's your position audit, prioritizing genuine tensions and fixes:

  **Severe Tension: Points 2 & 7**
  *   **Conflict:** Point 7 claims reverse-engineering mechanisms *alone* yields "genuine knowledge" about ancestral function without independent environmental evidence. Point 2 argues many specific evo psych hypotheses are underdetermined "just-so stories," precisely because they often *rely solely* on reverse-engineering current mechanisms without sufficient independent constraints or falsifiability.
  *   **Cheapest Fix:** Moderate Point 7. Acknowledge that while reverse-engineering *suggests* function and *generates* hypotheses, calling inferences derived *solely* from it "genuine knowledge" is overreach without strong cross-validation (e.g., cross-cultural consistency *plus* specific predictions *plus* independent evidence where possible). This strengthens Point 2's critique without abandoning the core value of reverse-engineering for hypothesis generation (Point 1). **Cost:** Slightly weakens the strongest claim for reverse-engineering's standalone power.

  **Moderate Tension: Points 1 & 2**
  *   **Conflict:** Point 1 champions the adaptationist/reverse-engineering strategy as "legitimate and productive." Point 2 argues its *output* (many specific hypotheses) is often unscientific ("just-so stories"). This highlights the gap between methodology aspiration and execution.
  *   **Fix:** Refine Point 1's scope. Emphasize it's a starting point *for generating testable hypotheses*, not a license for unsupported storytelling. Explicitly state that its legitimacy *depends* on rigorous adherence to the standards demanded in Points 3 & 4. **Cost:** None. This simply clarifies the necessary link between methodology and epistemic rigor.

  **Minor Tension / Nuance Needed: Points 4 & 6**
  *   **Conflict:** Not a direct contradiction, but Point 4 (confirmed surprising predictions = strong evidence) sets a high bar. Point 6 (cross-cultural consistency = decent evidence) sets a lower bar. Over-reliance on Point 6 could conflict with Point 4's standard.
  *   **Fix:** Refine Point 6. Explicitly state cross-cultural consistency is *suggestive* but insufficient *alone* for strong evidence without converging lines (e.g., specific predictions tested). Frame it as one piece of evidence needing integration (e.g., with Point 4 or Point 7's design analysis). **Cost:** Slightly downgrades the evidential weight of cross-cultural consistency alone, making it consistent with Point 4's higher standard.

  **Consistent Pairings:**
  *   **1 & 3/4:** Point 1 (methodology) is justified *by* holding evo psych to the standards of other historical sciences (Point 3), where generating hypotheses from observed phenomena (like reverse-engineering) and testing via predictions (Point 4) is core practice.
  *   **2 & 3:** Point 2's critique *is* applying the same epistemic standards (Point 3) – demanding falsifiability and sufficient evidence, which many hypotheses fail.
  *   **3 & 4:** This is the core of historical science methodology – same standards (3) achieved through predictive testing (4).
  *   **3 & 5:** Holding to epistemic standards (3) inherently separates scientific assessment from political objections (5).
  *   **1 & 4:** Reverse-engineering (1) *aims* to generate testable predictions (4). Point 4 validates the strategy when successful.
  *   **6 & 7:** Both are types of evidence (universality, design features) converging on possible adaptation.

  **Summary of Fixes:**
  1.  **Moderate Point 7:** Reverse-engineering is powerfully suggestive for hypothesis generation, but "genuine knowledge" requires more than just the mechanism alone.
  2.  **Clarify Point 1:** Legitimacy of adaptationism hinges on generating *testable* hypotheses meeting standards (Points 3 & 4).
  3.  **Refine Point 6:** Cross-cultural consistency is decent *suggestive* evidence, but strong evidence requires convergence (e.g., with Point 4 predictions).

  These tweaks resolve the key tensions while preserving your core defense of the methodology, demand for rigor, separation from politics, and nuanced view of evidence.
