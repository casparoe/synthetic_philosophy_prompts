answer: |-
  ### Table: Readings of "Better Than is Transitive"

  | Reading label                              | Precise claim                                                                                                                               | Trivial, substantive, or false | Vulnerable to spectrum arguments? | Would it rescue the seminar argument? |
  |--------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------|-----------------------------------|---------------------------------------|
  | **Logical transitivity of the predicate**  | For all alternatives \(A, B, C\), if \(A \succ B\) and \(B \succ C\), then \(A \succ C\) (where \(\succ\) is the "better than" relation). | Substantive                   | Yes: Spectrum cases directly challenge this by presenting intuitive failures of transitivity. | No: Spectrum cases are explicit counterexamples to this claim; dismissing them requires denying the intuitions, not asserting transitivity. |
  | **Formal requirement of rational choice**  | Rational agents must have a transitive \(\succ\) to avoid money pumps/cyclic preferences.                                                  | Substantive                   | Indirectly: Spectrum cases may force irrational cycles, but transitivity is imposed to prevent this. | Partially: It defends transitivity as a tool to avoid incoherence, but sidesteps whether spectrum cases reflect genuine moral conflicts. |
  | **Transitivity of a specific metric**      | If "better than" is defined by a real-valued function \(U\) (e.g., total utility), then \(U(X) > U(Y)\) implies \(X \succ Y\), and \(>\) is transitive by math. | Trivial (mathematically)      | No: Spectrum cases challenge whether \(U\) captures "all-things-considered" betterness (e.g., ignores distribution). | No: Spectrum arguments often reject the metric (e.g., rejecting total utilitarianism), making this irrelevant. |
  | **Conceptual truth of betterness**         | Transitivity is analytic to the concept of "better than": denying it is self-contradictory.                                                | False                         | Yes: Spectrum cases exploit moral ambiguities (e.g., aggregation) where intuitions violate transitivity without contradiction. | No: Begs the question—it assumes the concept is transitive, but spectrum cases question whether "better than" is univocal in such chains. |
  | **Transitivity under fixed principles**    | If a consistent principle (e.g., Pareto) governs all comparisons, then \(\succ\) derived from it is transitive.                             | Substantive                   | Only if the principle fails: Spectrum cases (e.g., pain increments) may exhaust or contradict the principle. | No: Spectrum arguments often show no single principle resolves the chain (e.g., Pareto + anti-repugnance conflict). |
  | **Transitivity as a normative ideal**      | We ought to adopt a transitive \(\succ\) (even if intuitions rebel) to preserve rational choice.                                          | Substantive                   | No: Treats transitivity as a goal, not a fact; spectrum cases highlight the cost (e.g., repugnant conclusions). | Yes: It reframes the debate, urging revision of intuitions to "save" rationality. But this is persuasive only if rationality is prioritized over moral intuitions. |

  ---

  ### Analysis of the Real Work in Population Ethics

  In population ethics and social choice, the **normative ideal** reading (last row) is doing the heavy lifting when people invoke transitivity. Advocates treat transitivity as a non-negotiable requirement for coherent decision-making, arguing that any failure (e.g., spectrum cases) exposes flaws in our intuitions, not in transitivity itself. This reading is *substantive but contested*: it holds that we must "clean up" judgments (e.g., by accepting the Repugnant Conclusion) to avoid irrationality. However, it risks being question-begging—spectrum arguments like Parfit's or Temkin's aim to show that betterness is *inherently non-transitive* when comparing qualitatively distinct outcomes (e.g., mild vs. intense suffering). If moral truth is complex and context-dependent, transitivity may be a useful heuristic rather than an axiom. Thus, while the slogan serves as a bulwark against moral messiness, its truth depends on whether rationality demands simplicity over fidelity to nuanced judgments. In practice, spectrum arguments survive because they expose tensions the slogan cannot dissolve without dismissing moral intuition.
