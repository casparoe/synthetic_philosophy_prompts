  The scent of warm milk and sleep clung to Clara’s hair as David smoothed it back from her forehead. Her breaths, deep and even now, ruffled the worn cotton of his t-shirt where her head rested against his chest. Six years old. A constellation of freckles bridged her nose, a feature utterly absent in either him or his wife, Sarah. A unique signature. *Her* signature.

  The thought landed with its usual, quiet thud. It wasn’t just that she *was* Clara. It was that she was *this* Clara. The precise combination of egg and sperm, conceived on a slightly chilly Tuesday in March, not the potentially sun-warmed Saturday in April they’d almost waited for.

  Sarah was out, finally getting the haircut she’d postponed for months. The house hummed with a deep silence, broken only by Clara’s rhythmic breathing and the distant sigh of the refrigerator. It was in this stillness that the familiar, formless ache bloomed in David’s chest. Guilt, but guilt searching desperately for a crime.

  He looked down at Clara’s peaceful face. She’d had a hard day at school. A math worksheet had stumped her, and recess had dissolved into tears over a misunderstanding about a game. Her small hand, clutching his shirt, felt impossibly fragile. The ache sharpened.

  *If we’d waited,* he thought, the well-worn path opening in his mind. *Just that one year. I’d have gotten the promotion. We’d have had the bigger house, closer to the better school district. More savings. Less stress.*

  He pictured it: A different house, quieter streets, a sunnier classroom. He imagined a different child, walking confidently through those imagined halls. Smarter? Happier? Easier? The image shimmered, enticing. *She wouldn’t struggle like this. She wouldn’t come home crying.*

  Then, as always, the ground gave way. *That child… wouldn’t be Clara.*

  The imagined child dissolved like smoke. There was no "she" in that other timeline who could have been Clara, just better off. There was only *not-Clara*. A different person entirely. A child who would never know the specific cadence of Sarah’s laugh, or the way David always pretended the remote control was an alien communicator. A child who wouldn’t have *this* particular constellation of freckles, *this* stubborn cowlick at the crown of her head, *this* inexplicable love for pickled onions.

  He tried another angle, tightening his arm around her sleeping form. *I brought her into a harder life than she deserved. I made her existence… less than it could have been.*

  The words felt solid for a moment. Accusatory. But then they, too, crumbled. Less than *what*? Compared to *whom*? The only alternative to *this* life, *Clara’s* life, was no life at all. There was no benchmark child living a charmed parallel existence whom he’d deprived. There was only void. Clara’s existence, with its math struggles and recess tears, wasn’t "less than" some nonexistent ideal; it was simply *hers*. The only one she could ever have.

  He remembered the agonizing discussions before conceiving. The pros and cons lists. The fear of financial instability warring with the biological clock’s insistent tick. They’d chosen "now." He’d convinced Sarah, really. He’d been impatient, maybe a little scared of waiting, of the uncertainty stretching further.

  *I robbed her,* the guilt whispered, shifting shape again. *I robbed her of… potential. Of a smoother path.*

  But potential for *what*? For *whom*? The potential inherent in Clara – her kindness, her fierce determination when building block towers, her sudden, insightful questions about where clouds go at night – that potential existed *because* she was Clara, conceived when she was. Change the timing, change the biological dice roll, and that specific potential vanished, replaced by someone else’s entirely different set of possibilities. He hadn’t robbed *Clara* of anything; he’d simply rolled the cosmic dice and *Clara* had emerged.

  He stroked her hair again, the softness a tangible anchor. He loved her with a ferocity that terrified him sometimes. He loved *this* child, the only one who could ever be his daughter. Not a concept, not a potential, but *her*: the one who snored softly against his chest, whose eyelashes lay like dark feathers on her cheeks, who had cried over math today but would beam triumphantly when she finally conquered it tomorrow.

  The guilt didn’t vanish. It remained, a heavy, amorphous presence in his chest. But it had no target. Every accusation he tried to level at himself dissolved the moment he aimed it. *I hurt her* – but without existence, there is no ‘her’ to hurt. *I should have given her better* – but ‘better’ requires a different recipient, a different person entirely. *I made the wrong choice* – but the ‘wrongness’ wasn’t measured against Clara’s well-being; it was measured against the ghost of a child who never was and never could be.

  He pressed his lips gently to Clara’s warm forehead. She stirred slightly, murmuring nonsense, her fingers tightening briefly on his shirt before relaxing again.

  The silence deepened. The refrigerator sighed. David held his daughter, the only daughter possible, born of that specific, irreversible choice. The guilt remained, a hole shaped exactly like the ghost of every child who wasn't Clara. And the only thing that filled it, imperfectly, completely, was the warm, breathing weight of the child who was. He closed his eyes, breathing in the scent of milk and sleep, the unbearable specificity of her presence, and the profound, unresolvable ache of having created the only world in which she could exist.
