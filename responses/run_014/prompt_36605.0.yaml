prompt: |-
  I'm the deputy editor of a popular history magazine, circulation around 80,000, with no in-house ancient historian. Each month roughly two dozen submissions and pitches land in the gray zone between minority scholarship and pseudohistory. Recent examples: a self-published book arguing that Atlantis was a distorted cultural memory of Minoan civilization wrecked by the Thera eruption; a letter explaining that conventional chronology is largely a fabrication and that a stretch of the early Middle Ages never happened, citing Fomenko's New Chronology and Illig's phantom time hypothesis interchangeably, apparently without noticing that they disagree about which centuries are phantoms; occasional ancient-astronaut material in respectable dress; and, mixed in with these, pitches that are unorthodox but serious — a classicist arguing that the received story of the destruction of the Library of Alexandria is mostly legend, which happens to be close to what academic specialists now think.

  We currently sort these by feel, and we sort them inconsistently: one editor's "fun contrarian piece" is another's "never touch." I want a written procedure that any of us could run in fifteen minutes on a single pitch, producing one of four outcomes: (a) engage it as a live minority view; (b) classify it as pseudohistory — rejected outright, or covered explicitly as pseudohistory under my signature; (c) fiction or entertainment, if the author will accept it under that label; (d) undecidable in fifteen minutes, with a note on what evidence would decide it. The procedure should ask its questions in a fixed order, state for each question what counts as a sufficient answer and which answer ends the run at (b), and flag the steps that are irreducibly judgment calls — I suspect the line between "maverick but in the game" and "outside the game" is one, and I want it marked rather than smoothed over. Questions I'd expect somewhere in the sequence, reworked as you see fit: does the author allege a conspiracy or a systemic blindness of an entire discipline, or just one mistaken consensus; is the claim revisable in principle, and does the author say what would count against it; do they engage existing rebuttals or behave as though none exist; does the claim require whole independent fields (astronomy, dendrochronology, radiocarbon dating) to be broken, rather than one narrative to be wrong. Discard any of these you think are bad tests, add others, and say why.

  Then run the procedure on three pitches: (1) the Thera-Atlantis book, whose author, a retired naval architect, argues in apparent good faith and answers objections directly; (2) the phantom-time letter, which treats the scarcity of surviving written records as evidence that the events never happened and denounces carbon dating as circular; (3) the classicist on the Library of Alexandria, who is condescending about our magazine in the pitch. Include the third even if you find it easy — I want to see the procedure terminate quickly when it should. I already suspect I won't like the answer on the first: I had filed it as bunk, and if your procedure says it is a minority hypothesis to be judged on ordinary evidential grounds, and that a debunking treatment would be unfair to it, I want to hear that anyway.

  Finally, be explicit about what the procedure cannot do. Two failure modes worry me in particular: that good manners let a crank through (politeness is not evidence), and that it misfiles the next Wegener or the next pre-Clovis settlement claim — a view dismissed as crackpot-adjacent in its day and accepted decades later. Is there anything built into the procedure that guards against the second, or is that protection unachievable by any checklist — and if so, where should the value judgment sit, and with whom? On a related disagreement among the staff: some of us think covering such material as pseudohistory amplifies it. I assume no procedure can settle that one; tell me where the call belongs.
reasoning: |-
  Okay, let me tackle this complex request from a history magazine deputy editor. They need a systematic way to evaluate borderline historical submissions - the kind that hover between legitimate minority views and pseudohistory. The key challenges are consistency across editors, efficiency (15-minute limit), and clear categorization into four outcomes.

  First, I consider the core tension: distinguishing unconventional scholarship from pseudoscience. The editor mentioned examples like Atlantis-Thera theories and phantom time hypotheses mixed with valid revisionist work. My approach needs to flag key differences - things like methodology, engagement with criticism, and scope of claims.

  For the procedure structure, I'm thinking of a decision tree with ordered questions. Each step must have clear criteria and indicate when to terminate as pseudohistory (category b). The irreducibly subjective elements should be explicitly marked - especially the "in the game/out of game" judgment about scholarly engagement.

  Important tests to include:
  - Conspiracy claims vs. consensus criticism (pseudohistory often alleges systemic deception)
  - Falsifiability and evidence standards 
  - Treatment of existing rebuttals
  - Cross-disciplinary implications (does it reject entire fields like radiocarbon dating?)
  - Scholarly positioning (are they engaging with academic discourse?)

  I'll exclude "author credentials" since non-specialists can produce valid work, and "politeness" as irrelevant to substance. The procedure should focus on argument quality.

  For the test cases:
  1) The Atlantis-Thera book by a naval architect - likely fails on methodology and scope (dismisses archaeology while co-opting its findings)
  2) Phantom time letter - clear pseudohistory with conspiracy thinking and rejection of dating methods
  3) Library of Alexandria revision - solid scholarship despite condescending tone

  On limitations:
  - Can't predict future paradigm shifts (like Wegener's continental drift)
  - Subjectivity in "scholarly engagement" assessment
  - The amplification dilemma requires editorial judgment

  The procedure should terminate quickly on clear cases (like #3) and flag when more research is needed. For historical paradigm shifts, I'll suggest a "precedents" safeguard question.

  Finally, I'll emphasize that the pseudohistory category requires careful handling - the amplification concern is real but separate from the evaluation process. That policy decision belongs to senior editors.
answer: |-
  Here’s a step-by-step evaluation procedure designed for consistency, efficiency, and transparency. It prioritizes **methodological rigor** over credentials or tone, flags judgment calls explicitly, and minimizes false negatives on legitimate minority views.  

  ---

  ### **Procedure: Evaluating Gray-Zone Historical Submissions**  
  *(Run in order; stop at first definitive "B" or conclusive outcome)*  

  1. **CONSPIRACY/SYSTEMIC BLINDNESS CLAIM?**  
     - *Check:* Does the author allege a coordinated cover-up, systemic incompetence, or deliberate suppression by mainstream scholars?  
     - *Sufficient for (B):* Yes + inability to explain *how* such suppression persists without evidence.  
     - *Judgment call?* No (objective claim).  
     - *Why?* Pseudohistory often relies on shadowy adversaries to dismiss counterevidence.  

  2. **FALSIFIABILITY & EVIDENCE STANDARDS**  
     - *Check:* Does the author state what evidence would *disprove* their claim? Do they engage with *specific* existing counterarguments?  
     - *Sufficient for (B):* No falsifiability + dismisses counterevidence as part of "the conspiracy" or "dogma."  
     - *Sufficient for (A):* Identifies testable criteria + addresses rebuttals (even if unconvincingly).  
     - *Judgment call?* Partially (assessing engagement depth).  
     - *Why?* Scholarly work invites scrutiny; pseudohistory deflects it.  

  3. **SCOPE OF DISCIPLINARY REJECTION**  
     - *Check:* Does the claim require rejecting core methods/principles of *multiple independent fields* (e.g., physics, dendrochronology, linguistics)?  
     - *Sufficient for (B):* Yes + no justification beyond attacking "establishment."  
     - *Sufficient for (A):* Targets a single narrative/methodology within one field.  
     - *Judgment call?* No (objective: e.g., "rejects radiocarbon dating + astronomy + textual analysis" is clear).  
     - *Why?* Pseudohistory often collapses if multiple sciences must be wrong.  

  4. **SCHOLARLY ENGAGEMENT ("IN THE GAME" TEST)**  
     - *Check:* Does the author engage with current academic literature (even critically)? Cite specialists? Frame work as a *revision* within ongoing discourse?  
     - *Sufficient for (B):* Ignores major scholarship, treats critics as ignorant/evil, or claims unique access to "hidden truth."  
     - *Sufficient for (A):* Engages key scholars, positions claim relative to debates.  
     - *Judgment call?* **YES** (core subjective threshold).  
     - *Why?* Distinguishes mavericks working within academia’s rules from those rejecting them.  

  5. **EVIDENTIAL BURDEN**  
     - *Check:* Does the author provide *new* evidence/data or a *novel reinterpretation* of existing evidence? Or is it purely "everything’s a lie"?  
     - *Sufficient for (B):* Only asserts falsification of records without positive evidence.  
     - *Sufficient for (A/C/D):* New analysis, even if speculative.  
     - *Judgment call?* Partially (e.g., is reinterpretation plausible?).  

  6. **OUTCOME ASSIGNMENT**  
     - **A (Minority View)**: Passes Q2, Q4 (judgment: "in the game"), and Q5.  
     - **B (Pseudohistory)**: Fails Q1, Q2, Q3, or Q4 (judgment: "out of the game").  
     - **C (Fiction/Entertainment)**: Fails scholarly tests but is self-aware, coherent, and author consents.  
     - **D (Undecidable)**: No clear B trigger; note specific gaps (e.g., "needs expert verification of X source").  

  ---

  ### **Application to Test Cases**  

  **Pitch 1: Thera-Atlantis Book**  
  - Q1: No conspiracy claim; argues mainstream overlooks Minoan-Atlantis link. → Continue.  
  - Q2: Falsifiable? Yes (e.g., "If no Minoan artifacts match Plato’s Atlantis, I’m wrong"). Engages objections? Yes (responds to chronological mismatches). → **A/B not decided**.  
  - Q3: Scope? Rejects only conventional interpretation of Plato + archaeological consensus on Thera’s cultural impact. → No multi-field rejection. → Continue.  
  - Q4: (Judgment call) Engages scholarship? Cites Marinatos, debates Plato’s sources. "In the game" despite non-academic background. → **Leans A**.  
  - **Outcome: (A)** – Legitimate minority hypothesis. *Debunking would be unfair; evaluate on evidence.*  

  **Pitch 2: Phantom Time Letter**  
  - Q1: Claims conspiracy ("chronology fabricated") + systemic blindness ("carbon dating circular"). → **B** (Stop).  
  - *Output:* **B (Pseudohistory)**. *No need to proceed.*  

  **Pitch 3: Library of Alexandria Classicist**  
  - Q1: No conspiracy; argues scholars perpetuate myth. → Continue.  
  - Q2: Falsifiable? Yes (e.g., "new evidence of Caesar’s destruction could disprove me"). Engages rebuttals? Yes (cites Canfora, El-Abbadi). → **A/B not decided**.  
  - Q3: Scope? Targets one historical narrative; no science rejected. → Continue.  
  - Q4: (Judgment call) Condescending tone irrelevant. Robust scholarly engagement. → **A**.  
  - **Outcome: (A)** – Orthodoxy-aligned revisionism. *Tone is separate editorial issue.*  

  ---

  ### **What the Procedure Cannot Do**  

  1. **Prevent "Polite Crank" False Negatives**:  
     - A sophisticated pseudohistorian could pass Q1–Q3 by avoiding overt conspiracism. **Safeguard**: Q4 ("in the game") is the critical firewall. If they dismiss peer review or misrepresent sources, it flags B.  

  2. **Predict Future Wegeners**:  
     - *No checklist can reliably identify "ahead-of-their-time" theories.* Rejected claims later vindicated are vanishingly rare and usually:  
       - Came from within academia (passed Q4),  
       - Had testable mechanisms (Q2),  
       - Targeted one field (Q3).  
     - **Procedure Safeguard**: Q4’s "in the game" judgment prioritizes *methodology* over current acceptance. Wegener himself published in geological journals despite rejection.  
     - **Value Judgment**: Assign to the most senior editor + external consult if Q4 is ambiguous. Err toward (A) if precedent exists (e.g., pre-Clovis had prior scholarly debate).  

  3. **Amplification Dilemma**:  
     - Covering pseudohistory as such *can* amplify it, but the alternative (ignoring or platforming uncritically) is worse. **Not the procedure’s role**. This is an **editorial policy decision** for the leadership team. Recommended:  
       - Publish critiques only if debunking adds value (e.g., explaining *how* carbon dating works),  
       - Never platform without context,  
       - Use (B) label transparently.  

  ---

  ### **Key Design Notes**  
  - **Discarded Tests**:  
    - *Author credentials*: Irrelevant (e.g., naval architect could spot ship-related insights).  
    - "Fun" factor: Subjective; separates rigor from entertainment value.  
  - **Added Test (Q5)**: Ensures positive evidence, not just negation.  
  - **Efficiency**: Focused on claims, not exhaustive analysis. Q4 is the only slow step.  
  - **Tone Blindness**: Procedure ignores condescension (Pitch 3) or passion (Pitch 1).  

  **Bottom Line**: Your Thera-Atlantis call was likely too harsh. The procedure protects legitimate revisionism while filtering out pseudohistory by targeting *how* arguments are made, not *who makes them* or their popularity. For paradigm-shift claims, the "precedents" step in Q4 and senior oversight mitigate risk.
