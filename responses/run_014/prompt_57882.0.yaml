  We are designing a decision procedure for determining whether an omission should be counted as a cause in a safety incident. The procedure must handle the philosophical difficulties of causation by omission, including the over-permissiveness of counterfactual dependence, the risk of conflating causal and moral judgments, and the distinction between actively producing an outcome and failing to prevent it.

  The procedure will be structured as a flowchart with steps. At each step, we ask a question and based on the answer, we either terminate (with a finding of no causation by omission), mark the issue as requiring evaluative judgment, or proceed to the next step.

  Key principles:
  1. We want to avoid listing every omission that would have prevented the outcome (over-permissiveness of counterfactual dependence).
  2. We will use norms and reasonable expectations to discipline the counterfactual reasoning, but we must be cautious not to turn causal judgments into moral judgments.
  3. We preserve the distinction between active production and mere failure to prevent.

  The procedure will have the following steps:

  **Step 1: Counterfactual Dependence**
     - **Question:** Would the outcome (or a materially similar harm) have been prevented if the agent had performed the omitted action?
     - **Sufficient Answer:** The answer must be "yes" with a high degree of confidence based on the available evidence (e.g., incident reports, expert analysis, simulation). If the answer is "no" or "uncertain", then the omission is not a cause and we stop (no causation by omission).
     - **Termination:** If the answer is "no" or "uncertain", the omission is not a cause. Exit the procedure for this omission.

  **Step 2: Reasonable Expectation of Action**
     - **Question:** At the time of the omission, was there a reasonable expectation that the agent would perform the action? Consider:
          a. Explicit rules or procedures requiring the action.
          b. Implicit norms of the job role or industry standards.
          c. Contextual factors (e.g., workload, available information, time constraints).
     - **Sufficient Answer:** If there was an explicit requirement (a), then the answer is "yes". If not, we must consider (b) and (c). If the requirement was vague or contested, we mark this step as requiring evaluative judgment.
     - **Termination:** If the answer is "no", then the omission is not a cause. Exit.
     - **Requires Judgment:** If the expectation is based on implicit norms and contextual factors and is not clear-cut, mark for evaluative judgment.

  **Step 3: Distinction Between Active Production and Failure to Prevent**
     - **Question:** Did the omission consist of a failure to intervene in an ongoing process that was already on course to cause the outcome, or was the omission part of a chain that actively produced the outcome? (Note: This step is to capture the intuition that some omissions are more "active" than others, but in practice, we are trying to avoid over-broadening by focusing on whether the omission was a necessary link in the chain that produced the outcome in the particular circumstances.)
     - **Reframed Question (to avoid metaphysical issues):** Was the omitted action one that the agent was expected to take as part of a routine or scheduled process that, if performed, would have broken the chain of events leading to the outcome? Or was the omission a failure to respond to a specific, unfolding situation?
