answer: |-
  ### Decision Procedure for Causation by Omission in Safety Incidents  
  This procedure translates philosophical challenges into a reusable checklist. It addresses:  
  - **Counterfactual over-permissiveness** by adding filters.  
  - **Normative judgments** by separating factual inquiries from evaluative steps.  
  - **Active production vs. failure to prevent** via proximity analysis.  

  **Key Definitions:**  
  - **Agent:** Human or automated system with capacity to act.  
  - **Omission:** Failure to perform a specific, identifiable action.  
  - **Outcome:** Actual harm or near-miss condition (not hypothetical scenarios).  

  ---

  ### Decision Procedure Flowchart  
  *Apply to each omission independently. Maximum 45 minutes per case.*  

  #### **Step 1: Counterfactual Dependence**  
  **Question:** *If the agent had performed the action, would the specific outcome (or materially similar harm) have been prevented with ≥90% confidence?*  
  - **Sufficient Answer:**  
    - *Yes:* Supported by evidence (e.g., simulation, engineering analysis, historical data).  
    - *No/Uncertain:* Inconclusive records, conflicting expert views, or <90% confidence.  
  **Termination:** If **no/uncertain** → *No causation by omission*. Stop for this omission.  
  **Proceed:** If **yes** → Go to Step 2.  

  #### **Step 2: Actionability at Time of Omission**  
  **Question:** *At the exact time of omission, could the agent have physically/computationally performed the action?*  
  - **Sufficient Answer:**  
    - *Yes:* Agent had functional capacity, access, and situational awareness (per logs, sensor data).  
    - *No:* Agent incapacitated, lacked tools/data, or action was impossible (e.g., system offline).  
  **Termination:** If **no** → *No causation by omission*. Stop.  
  **Proceed:** If **yes** → Go to Step 3.  

  #### **Step 3: Proximate Context**  
  **Question:** *Was the omission temporally and operationally proximate to the outcome?*  
  - **Criteria:**  
    - **Temporal:** ≤1 operational cycle (e.g., same shift, same journey, maintenance interval).  
    - **Contextual:** Directly tied to the process that produced the outcome (e.g., monitoring *this* train, inspecting *this* track).  
  - **Sufficient Answer:**  
    - *Yes:* Omission occurred within the same causal chain (e.g., dispatcher monitoring the train *during* the incident).  
    - *No:* >1 operational cycle removed (e.g., training omitted years prior) or unrelated context.  
  **Termination:** If **no** → *No causation by omission*. Stop.  
  **Proceed:** If **yes** → Go to Step 4.  

  #### **Step 4: Reasonable Expectation (Judgment Gate)**  
  **Question:** *Was there a clear, pre-existing expectation for the agent to act?*  
  - **Evidence Review:**  
    - **Explicit:** Rules, checklists, or contracts mandating the action.  
    - **Implicit:** Industry standards, job descriptions, or prior consistent practice.  
  - **Judgment Required If:**  
    - Expectation was vague, contested, or context-dependent (e.g., discretionary rules, unwritten norms).  
    - Conflicting evidence about what was "reasonable" (e.g., heat restrictions vs. inspection standards).  
  **Termination:** If expectation **absent or negligible** → *No causation by omission*. Stop.  
  **Proceed:** If expectation **clear and documented** → Go to Step 5.  
  **Stop for Judgment:** If unclear → *Mark as "Requires Evaluative Judgment."* Consult operations director.  

  #### **Step 5: Causal vs. Blame Distinction**  
  **Question:** *Does labeling this omission as a "cause" conflate with blame?*  
  - **Test:**  
    - If the omission *actively created a new risk* (e.g., disabling a safety system) → **Cause**.  
    - If the omission *failed to mitigate an existing risk* (e.g., not issuing a warning) → **Cause only if** Step 4 expectation was **non-discretionary** (e.g., "must" not "may").  
  - **Judgment Required If:**  
    - Ambiguous whether the omission *created* or *failed to mitigate* risk.  
    - Discretionary actions with high stakes (e.g., slow orders in marginal conditions).  
  **Output:**  
    - If passes test → *Causation by omission confirmed*.  
    - If fails test → *No causation by omission*.  
  **Stop for Judgment:** If ambiguous → *Mark as "Requires Evaluative Judgment."*  

  ---

  ### Application to Cases  
  **Case 1: Freight Train Overshoot**  
  - **Omission 1:** Dispatcher did not issue discretionary slow order.  
    - **Step 1:** Yes. Slow order would likely have prevented overspeed.  
    - **Step 2:** Yes. Dispatcher was monitoring the train.  
    - **Step 3:** Yes. Omission during the train’s descent.  
    - **Step 4:** **Judgment Required.** Rule book says "permitted but not required." No explicit expectation.  
      *Director’s Judgment:* Discretionary norms in heavy rain with degraded brakes may imply expectation.  
    - **Step 5:** Omission failed to mitigate existing risk. Cause **only if** Step 4 deems expectation non-discretionary.  
      *Verdict:* **Cause** (if judgment affirms expectation).  
  - **Omission 2:** Automated advisory muted for maintenance.  
    - **Step 1:** Uncertain. No evidence muted advisory *would* have prompted dispatcher.  
    - **Termination:** **No causation.**  

  **Case 2: Joint Bar Derailment**  
  - **Omission 1:** Inspector shortened walking inspection.  
    - **Step 1:** Yes. Full inspection likely detects crack.  
    - **Step 2:** Yes. Inspector physically capable.  
    - **Step 3:** Yes. Inspection immediately prior to failure.  
    - **Step 4:** **Judgment Required.** Heat restrictions vs. inspection completeness. Contested expectation.  
      *Director’s Judgment:* If rules require completion regardless of heat, expectation exists.  
    - **Step 5:** Omission actively created risk (undetected defect). → **Cause.**  
  - **Omission 2:** Auditor did not notice shortened inspection.  
    - **Step 1:** Yes. Detection could have triggered repair.  
    - **Step 2:** Yes. Auditor had paperwork.  
    - **Step 3:** Yes. Audit within 48 hours.  
    - **Step 4:** **Judgment Required.** Was auditing for completeness or accuracy? Duty vague.  
      *Director’s Judgment:* If role is clerical (checkboxes), not causal. If role is verification, causal.  
      *Verdict:* **No causation** (typical audit roles are clerical).  

  **Case 3: Blocked Emergency Exit**  
  - **Omission:** Station team did not clear leaves.  
    - **Step 1:** Yes. Clearing would have prevented blockage.  
    - **Step 2:** Yes. Team had access and tools.  
    - **Step 3:** Yes. Omission ongoing until drill.  
    - **Step 4:** **Clear Expectation.** Industry standards require unobstructed exits.  
    - **Step 5:** Omission created new risk (blocked exit). → **Cause.**  
    *Note:* Outcome is the blocked exit (near-miss condition), not hypothetical deaths.  

  ---

  ### Limitations and Failure Modes  
  1. **What the Procedure Cannot Settle:**  
     - **Joint Necessity:** Multiple omissions where *all* must change to prevent the outcome (e.g., both inspector and auditor needed to act). Procedure may exclude all.  
     - **Probabilistic Outcomes:** Omissions that only alter outcome likelihood (e.g., 60% chance of prevention).  
     - **Vague Norms:** Discretionary actions with no precedents (e.g., "monitor proactively").  

  2. **Where It Misfires:**  
     - **Over-Broad Inclusion:** If expectations are too rigidly defined (e.g., including distant training omissions via Step 4 misapplication).  
     - **Under-Broad Exclusion:** In joint-necessity cases or probabilistic harms.  
     - **Automated Systems:** Fails if "reasonable expectation" for algorithms is ambiguous (e.g., AI muting itself during maintenance).  

  **Final Sign-Off:** Operations director resolves judgment gates, ensuring consistency. Procedure accepts unintuitive results (e.g., Case 2 auditor excluded) to avoid conflating cause with blame.
