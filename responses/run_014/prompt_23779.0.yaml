answer: |-
  Here’s a complete exam package tailored to your requirements, designed to force nuanced engagement with PBR and its implications.

  ---

  ### Essay Question (for take-home final, ~3-hour expected effort)
  **"The Pusey-Barrett-Rudolph (PBR) theorem claims to rule out ψ-epistemic models under certain assumptions. Critically evaluate this claim by addressing the following:  
  (i) Explain which *specific premise(s)* of PBR a defender of ψ-epistemic models must reject to avoid the theorem’s conclusion, and discuss the conceptual cost of each such rejection.  
  (ii) Analyze how Spekkens’ toy model (a ψ-epistemic model) evades the PBR theorem while reproducing many quantum phenomena, yet fails to reproduce others (e.g., Bell nonlocality). What does this asymmetry suggest about the assumptions underlying PBR?  
  (iii) Does QBism resolve the ψ-ontic/ψ-epistemic debate by accepting or rejecting PBR’s conclusion? Justify your answer with reference to QBist philosophy."**  
  *(Word limit: 1200 words)*  

  ---

  ### Model Answer (Target: ~700 words)  
  **(i) Premise rejection and costs**  
  The PBR theorem proves that quantum states must be "ψ-ontic" (directly corresponding to reality) in any ontological model satisfying two core premises:  
  - **Realism**: Systems possess a determinate ontic state λ, independent of measurement.  
  - **Preparation Independence (PI)**: Independently prepared systems have uncorrelated ontic states (λ₁⊗λ₂ for systems 1 and 2).  

  A ψ-epistemicist (who views quantum states as knowledge about an underlying reality) *must* reject PI to evade PBR. Rejecting realism would abandon ontological models entirely, collapsing the framework. Denying PI allows λ-states of independently prepared systems to be correlated "behind the scenes," preventing the overlap that PBR exploits. However, this incurs a **heavy cost**: it violates classical intuitions that independently prepared systems are physically uncorrelated. This implies retroactive causal influences or global constraints on preparations, eroding the explanatory power of hidden variables.  

  **(ii) Spekkens’ model: Evasion and asymmetry**  
  Spekkens’ toy model (STM) is explicitly ψ-epistemic: multiple quantum states (e.g., |+x⟩ and |+z⟩) overlap on the same epistemic (knowledge-based) state λ. It reproduces quantum phenomena like no-cloning, teleportation, and interference. Crucially, STM evades PBR by **rejecting PI** – its underlying "ontic states" exhibit hidden correlations even for independently prepared systems. However, STM cannot reproduce Bell nonlocality or contextuality. This asymmetry is revealing: PBR’s PI assumption implicitly encodes a **classicality constraint** about separable realities. Violations of Bell inequalities require *nonlocal* correlations incompatible with PI’s separable λ-states. Thus, STM’s evasion of PBR (via PI rejection) and its failure to model nonlocality highlight that **non-classical correlations (Bell/contextuality) are the price of ψ-epistemicism under local realism**. PBR’s conclusion holds only if we demand separable ontic states for independent preparations – a demand quantum nonlocality already challenges.  

  **(iii) QBism: Rejecting the framework**  
  QBism does not "resolve" the debate by accepting/rejecting PBR’s conclusion; it **rejects the ontological models framework** entirely. QBism views quantum states as *agents’ subjective beliefs* (not representations of reality) and measurements as experiences updating those beliefs. Since PBR assumes an agent-independent λ (realism) and PI, QBism denies the premises’ applicability. For QBists, "ψ-epistemic" is trivially true (states are epistemic by definition), but PBR’s machinery – designed for agent-independent ontologies – is irrelevant. The "cost" here is radical: it abandons objective descriptions of quantum systems prior to measurement, prioritizing a Bayesian, participatory worldview over ontology.  

  **Conclusion**  
  PBR’s significance lies not in disproving ψ-epistemicism *simpliciter*, but in forcing a trade-off: ψ-epistemic models require rejecting preparation independence (invoking fine-tuning or non-separability), or abandoning ontological realism altogether (as in QBism). The Spekkens model exemplifies this, sacrificing nonlocality to preserve epistemicity within a local framework. PBR thus sharpens, but does not settle, the core tension between quantum nonlocality and classical intuitions about independent realities.  

  ---

  ### Marking Scheme (Total: 25 points)  
  **A. Addressing PBR premises and costs (10 points)**  
  - **Top (8–10)**: Explicitly names *Preparation Independence (PI)* as the key premise to reject (not realism). Clearly explains cost: PI rejection implies non-separable/retrocausal λ-states for "independent" preparations, undermining classical separability. Mentions realism is framework-defining; rejecting it exits ontological models.  
  - **Competent (5–7)**: Identifies PI but vague on cost. May misprioritize realism as rejectable premise.  
  - **Weak (<5)**: Fails to specify PI; vague on "assumptions" or misstates theorem.  

  **B. Spekkens’ model analysis (8 points)**  
  - **Top (7–8)**: Notes STM is ψ-epistemic *and* evades PBR via PI rejection. Explains STM reproduces quantum phenomena (e.g., no-cloning) *but not Bell/contextuality*. Clearly states asymmetry implies **nonlocality is the barrier to ψ-epistemic models satisfying PI** (or: PI enforces local realism incompatible with quantum correlations).  
  - **Competent (5–6)**: Identifies STM as ψ-epistemic and evasion mechanism but superficial on asymmetry (e.g., "STM isn’t fully quantum"). Weak link to PBR’s assumptions.  
  - **Weak (<5)**: Omits PI rejection in STM or fails to note missing phenomena.  
  - ***Common botch***: Claiming STM "violates PBR" or "is counterexample to PBR" without noting its evasion *requires* PI rejection (and thus isn’t a counterexample within PBR’s framework).  

  **C. QBism’s stance (4 points)**  
  - **Top (4)**: States QBism rejects the ontological models framework. Explains it views states as subjective, so "epistemic" is trivial, but PBR’s realist ontology (λ-states) is irrelevant. Notes QBism doesn’t engage with the PBR dichotomy.  
  - **Competent (2–3)**: Recognizes QBism avoids the debate but doesn’t articulate *why* (framework rejection).  
  - **Weak (0–1)**: Calls QBism "ψ-epistemic" without context or claims it "accepts PBR."  

  **D. Clarity/Structure (3 points)**  
  - Logical flow, concision, technical terms defined.  

  ---

  ### Why This Works  
  - **Forces PBR engagement**: Students can’t just summarize Harrigan-Spekkens; they must dissect *which* premise is deniable (PI) and *why* it’s costly.  
  - **Leverages Spekkens’ model**: The asymmetry (reproduces teleportation but not Bell) directly probes the tension between PI and nonlocality – the core insight.  
  - **Handles QBism precisely**: By framing it as framework rejection, students can’t pigeonhole it as "epistemic."  
  - **Grading precision**: Rubric ties points to *specific claims* about PI, STM’s limitations, and QBism’s framework denial. Top answers must connect STM’s missing phenomena to PI’s role in enforcing local realism.  

  This setup ensures students grapple with PBR’s *conditional* nature: ψ-epistemic models survive only by sacrificing separability (à la STM) or reality (à la QBism).
