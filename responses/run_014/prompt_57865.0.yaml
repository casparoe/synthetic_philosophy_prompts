answer: |-
  The rain lashed against the steamed-up windows of the Kirkgate Community Hub, Leeds. Inside, Maya wiped condensation from her forehead with the back of her hand, the damp chill already seeping into her bones despite the October afternoon. Her domain – the foodbank distribution centre – hummed with the low thrum of the struggling walk-in fridge. It was limping along, a technician had confirmed yesterday, held together by duct tape and desperation. Winter was coming, and without a proper fix, it wouldn’t last a month. Two hundred local families relied on the chilled perishables it stored.

  On her cluttered desk lay two pieces of paper. One was the invoice: **£4,000**. Replace the compressor, seals, the lot. Guaranteed. The fridge would work. Food would be safe. People would eat.

  The other was a slightly crumpled leaflet thrust into her hand that morning by Leo, a bright-eyed, slightly-too-confident final-year Economics student from the university. His pitch had been rapid-fire, earnest, and dizzying. He was developing an early-warning agricultural model, leveraging AI and obscure satellite data. The dream? To predict regional crop failures years in advance, enabling interventions to prevent famines. His prototype needed funding. **£4,000**. Exactly.

  “Look, Maya,” he’d said, leaning over her desk, his fingers tapping the leaflet. “I know it sounds wild, but the *scale*... just consider the *scale*! If this works – I mean, *really* scales up globally – it could prevent a major famine. Conservatively? Saving two million lives.”

  Maya had snorted. “And the chance of that? Honestly?”

  Leo hadn’t flinched. “Okay, realistically? Right now? Slim. Very slim. Maybe… one in five million? But that’s the point of the prototype! To prove the concept, attract bigger funding. The *expected value*, Maya! You *have* to consider it!”

  He’d scribbled on the leaflet margin:

  > **Potential Benefit:** 2,000,000 lives saved.
  > **Probability:** 1 / 5,000,000.
  > **Expected Value:** (2,000,000) * (1 / 5,000,000) = **0.4 lives saved**.

  “See?” Leo pointed triumphantly. “0.4 lives! Now, fixing your fridge feeds, what, two hundred families? Say four people per family? That’s eight hundred people helped directly, sure. But how do you value that against *saving lives*? It’s food security, not pulling people from burning buildings. The *expected value* of giving me the £4,000 is saving 0.4 lives. The *expected value* of fixing the fridge? Harder to quantify in lives, but even if you argued it *indirectly* saves lives through preventing malnutrition-related illnesses… the numbers just don’t compete! Point four actual expected *lives saved* versus… well, definitely fewer than that, realistically, from a fridge repair.”

  Maya stared at the calculation. **Two million lives. One in five million chance. 0.4.** The cold logic of it settled over her like the damp chill from the faulty fridge. It was absurdly tiny, that probability. Like winning the lottery while being struck by lightning on a Tuesday. Yet, the sheer magnitude of the potential upside – *two million lives* – seemed, mathematically, to dwarf the certain, immediate, but undeniably smaller good right in front of her. The fanaticism of it tugged at her. Was she prioritising the tangible, the local, the *now*, simply because she couldn’t grasp the scale of the potential future? Was she letting sentiment blind her to the rational, probabilistic truth laid bare by Leo’s neat equation? **0.4 lives saved expected, versus feeding 800 people for a season.** The numbers whispered seductively: *Think bigger. Think probabilistically. The tiny chance, multiplied by the colossal payoff, outweighs the certain modest good.*

  She leaned back, the worn office chair groaning. For a moment, in the quiet hum of the hub, surrounded by the reality of food parcels and benefit forms, Leo’s argument held a strange, crystalline rationality. It wasn't about *likelihood* in the everyday sense; it was about the mathematical *weight* of possibilities across vast scales. Sacrificing the certain good of the fridge for the minuscule chance of an astronomical future good became, bizarrely, the *logically correct* choice according to this relentless maximisation of expected value. The fanaticism felt almost… pure. Unburdened by the messy constraints of the immediate and the visible.

  The moment shattered as the door to the distribution area banged open. Mrs Henderson shuffled in, her thin coat soaked, pushing a battered buggy containing not just a toddler but several bags destined for the donation point. Her face was pinched with cold and exhaustion. Dave, one of the regular volunteers, hurried over.

  “Alright, Mrs H? Bit damp out there! Come on, let’s get you sorted. Right, we’ve got that UHT milk you needed, and some decent tins coming through… oh, and thanks for those bags, love.” He peered into the buggy. “Ooh, little Jacob looks peaky. Bit of a cough?”

  Mrs Henderson nodded, her eyes flickering towards the humming fridge room. “Just a cold, Dave, thanks. Doctor says keep him warm and fed. These yoghurts you had last week… they went down a treat. He kept ‘em down, you know? Better than milk sometimes.”

  Maya watched Dave gently help unload the donation bags, his voice low and reassuring. He guided Mrs Henderson towards the fresh produce section, housed entirely within the walk-in fridge currently operating on borrowed time. Maya’s gaze fixed on little Jacob, bundled up but pale, his eyes wide and tired. The yoghurts. The fresh veg. The chilled meat alternatives that were vital for some families. All of it relied utterly on that fridge functioning through the winter. **Two hundred families. Now. Here.** Not a probability. A certainty.

  The absurdity hit her like a physical wave. **£4,000.** Hand it over to Leo? A boy barely out of his teens with a spreadsheet and a one-in-five-million dream? While Mrs Henderson and little Jacob and a hundred others like them shivered, waiting for food that would rot without cold storage? While the certainty of helping her community, her neighbours, people whose names and faces she knew, was traded for a statistical phantom – **point four of a life**, abstracted across continents and years? The fanatical pull of the infinitesimal chance suddenly seemed not rational, but monstrously irresponsible. A dereliction of duty dressed up in elegant algebra. Saving potential millions *somewhere, someday* meant abandoning the actual hundreds *here, today*. The sheer, visceral immediacy of the need in her cramped, rain-lashed hub made Leo’s global calculus feel like a cruel joke.

  Maya looked down at the invoice and the leaflet. The numbers still glared back: **0.4.** And **200 families.** The cold, fanatical logic of expected value maximisation warred violently with the warm, messy, undeniable reality of the community shivering outside her office door, reliant on a failing fridge. She picked up the phone, her finger hovering over the keypad. The invoice needed paying. Leo deserved an answer. The rain drummed its insistent rhythm against the glass. Maya took a deep breath, the weight of the choice pressing down, the neat resolution Leo’s maths promised feeling impossibly distant, replaced only by the grinding tension between two irreconcilable scales of good.
