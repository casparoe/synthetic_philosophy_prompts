prompt: |-
  I sit on my company's forecasting committee, which produces the probability estimates the board uses for capital allocation, and this quarter we have to put a number on whether our new logistics platform will be live by year-end. We're deadlocked on which base rate to anchor on, and I think the disagreement is really about how specific our reference class should be. One faction wants to use the industry-wide on-time delivery rate for projects of this size, which comes out to about 55% on a sample of a few hundred projects, but our stack and our team are unusual in ways that rate probably doesn't capture. Another faction wants to use our own internal track record for similar platforms, which is 6 out of 8 — more directly relevant, but a small enough sample that one bad quarter moves the number a lot. A third faction, mostly the PM, argues the project is genuinely novel and we should just take her subjective judgment (roughly 85%) at face value, which I suspect is a polite way of abandoning the reference-class approach altogether. I was talking this through with a colleague over lunch who keeps saying we should just weight the classes by sample size, and I'm not sure that's coherent, because the narrower classes are precisely the ones where the sample size is small.

  Can you draft the committee's decision memo recommending which reference class — or what principled combination of them — we should use for this particular estimate? I need the reasoning to be something we could actually stand behind in front of the board, and I'd like an honest treatment of the strongest case for the approach we end up not adopting, because the PM will be in the room and she's sharp.
reasoning: |-
  Okay, the user is part of a forecasting committee that needs to estimate the probability of their new logistics platform going live by year-end. The committee is deadlocked on which reference class to use for their base rate. There are three factions: one advocating for an industry-wide rate (55% based on hundreds of projects), another preferring the company's internal track record (6 out of 8 successes, 75%), and the PM arguing for her subjective judgment (85%) since the project is novel.

  First, I need to understand the core issue. The disagreement is about how specific the reference class should be. The industry rate has a large sample size but may not account for the company's unique stack and team. The internal data is more relevant but has a small sample size, making it volatile. The PM's subjective estimate, while considering novelty, lacks objectivity and could be biased.

  The user's colleague suggests weighting by sample size, but the user is concerned because the narrower classes have smaller samples. Weighting solely by sample size would heavily favor the industry data, which might not be appropriate given its potential lack of relevance. The key here is balancing relevance with reliability. 

  The user needs a principled approach that can be defended to the board. They also want to address the PM's viewpoint respectfully since she'll be present. The memo should acknowledge the strengths and weaknesses of each approach and propose a combined method that mitigates their individual weaknesses.

  Looking deeper, the user might be seeking a method that incorporates both data and expert judgment without appearing arbitrary. They need credibility and transparency. The board likely wants a robust, defensible estimate that considers all perspectives but isn't swayed by internal politics. 

  A Bayesian approach comes to mind. Starting with the industry prior (55%) and updating with internal data. This uses the large sample as a foundation but adjusts for the company's specific performance. The PM's judgment could be included as a sensitivity analysis rather than directly in the base rate. This way, her input is valued without overriding the data. 

  Calculating the Bayesian posterior: prior of 55% with 6 successes out of 8. Using a beta distribution, the posterior would be around 61.5%. This is more stable than the internal 75% because the prior pulls it towards the industry average, accounting for the small sample size. 

  The memo should present this as a blended approach, emphasizing that it's grounded in data while adjusting for company-specific factors. Addressing the PM's view by suggesting her judgment inform risk factors or be used in scenario planning. This respects her expertise without compromising the reference-class methodology. 

  Also, highlighting the risks of each approach: industry data may not reflect company strengths, internal data's volatility, and subjective judgment's potential bias. Recommending continuous updates as the project progresses to refine the estimate. 

  Finally, ensuring the memo is clear, structured, and anticipates board questions. Including a table comparing methods and a decision summary for clarity. Acknowledging the PM's argument honestly but showing why the blended approach is more reliable.
answer: |-
  ## Committee Decision Memo: Reference Class Selection for Logistics Platform Go-Live Probability Estimate

  **To:** Forecasting Committee Members  
  **From:** [Your Name], Chair, Forecasting Committee  
  **Date:** October 26, 2023  
  **Subject:** Recommended Approach for Estimating Probability of Logistics Platform Go-Live by Year-End  

  ### 1. Background & Objective
  This memo outlines the committee's recommended approach for estimating the probability that our new logistics platform achieves operational go-live by December 31, 2023. We acknowledge significant disagreement regarding the appropriate base rate ("reference class") to anchor this estimate. Our objective is to adopt a method that is both **principled** (grounded in statistical reasoning) and **defensible** (transparent about strengths/weaknesses) for Board review.

  ### 2. Summary of Faction Positions & Their Core Merits
  *   **Faction A (Industry-Wide Rate - 55%):**  
      *   **Argument:** Uses a large sample (N=~200-300 projects) of similar-sized industry implementations. Offers statistical stability and reduces idiosyncratic bias.
      *   **Strongest Case:** Large-N data provides the most reliable anchor against cognitive biases like over-optimism. It inherently captures systemic risks (e.g., vendor delays, integration complexities) common across the industry that our internal team might overlook.
      *   **Key Limitation:** May inadequately reflect our specific advantages (e.g., unique tech stack, experienced team cohesion) or disadvantages not captured in generic industry data.

  *   **Faction B (Internal Track Record - 75%):**  
      *   **Argument:** Uses our direct experience (6 successes / 8 attempts) on "similar" past platform launches. Maximizes relevance to our specific context.
      *   **Strongest Case:** Directly reflects our organization's actual capabilities, processes, culture, and historical performance. Captures factors unique to *us* better than any external benchmark.
      *   **Key Limitation:** Extremely small sample size (N=8). A single additional success/failure changes the point estimate dramatically (~12.5%). "Similar" is subjective; past projects may not be perfectly analogous.

  *   **Faction C (PM Subjective Judgment - 85%):**  
      *   **Argument:** This project's specific novel elements (e.g., [mention 1-2 specifics if possible, otherwise "novel integration approach/scale"]) make it unique. The PM's deep operational knowledge provides the best assessment.
      *   **Strongest Case:** Expert intuition can synthesize unique project factors, team dynamics, and real-time progress invisible to aggregate statistics. Essential for genuinely novel situations lacking direct precedents.
      *   **Key Limitation:** Highly susceptible to optimism bias, motivated reasoning, and lack of calibration. Difficult to audit or defend objectively. Abandons the empirical discipline of reference class forecasting.

  ### 3. Analysis of the Core Challenge: Specificity vs. Reliability
  The fundamental tension lies in the trade-off between **specificity** (how well the reference class matches *this exact* project context) and **reliability** (the statistical robustness of the estimate derived from the class). 

  *   **Narrower Classes (Internal, PM Judgment):** Higher specificity but lower reliability (small N, subjectivity).
  *   **Broader Classes (Industry):** Higher reliability (large N) but lower specificity (may mask unique factors).

  Weighting *solely* by sample size favors the broad class excessively, as it ignores the critical value of relevance. Conversely, relying *only* on the small internal sample ignores statistical noise. Pure subjectivity removes empirical grounding.

  ### 4. Recommended Approach: A Principled Bayesian Synthesis
  After careful consideration, the committee recommends a **Bayesian Synthesis** of Faction A (Industry) and Faction B (Internal) data. This approach formally combines the two empirical datasets in a statistically coherent manner, using the industry data as a prior belief updated by our internal evidence.

  *   **Rationale:**
      1.  **Industry Data as Prior:** The large-N industry rate (55%) provides a stable, evidence-based starting point ("prior probability"), representing the base chance of success before considering our specific attributes.
      2.  **Internal Data as Likelihood:** Our internal track record (6/8 successes) provides specific evidence about *our* performance relative to the industry. This evidence "updates" the prior.
      3.  **Posterior Probability:** The result is a weighted average where the industry data stabilizes the small internal sample, and the internal data shifts the estimate towards our unique performance. This balances specificity and reliability mathematically.
      4.  **Formula (Simplified Beta-Binomial Conjugate Prior):**
          *   Prior (Industry): Assumed equivalent to ~55 successes in 100 trials (Alpha_prior = 55, Beta_prior = 45).
          *   Likelihood (Internal): 6 successes, 2 failures.
          *   Posterior: Alpha_posterior = 55 + 6 = 61, Beta_posterior = 45 + 2 = 47.
          *   **Posterior Mean Estimate = Alpha_posterior / (Alpha_posterior + Beta_posterior) = 61 / (61 + 47) ≈ 56.5%**
      5.  **Transparency:** The calculation and inputs are explicit and auditable.

  *   **Recommended Point Estimate:** **56.5%** (Rounded to **57%** for reporting clarity).

  *   **Addressing Faction C (PM Judgment - 85%):** While the PM's deep expertise is invaluable, incorporating an 85% subjective estimate directly into the base rate calculation lacks a replicable statistical foundation and risks significant optimism bias. **However, the PM's insights are crucial for risk assessment and scenario planning.** We strongly recommend:
      *   Using the PM's judgment to identify *specific mitigating factors* or *key risks* that could cause actual performance to deviate from the base rate (e.g., "Novel component X is de-risked due to Y, potentially increasing probability by 10%" or "Critical dependency Z is high-risk, potentially decreasing probability by 15%").
      *   Presenting the 57% base rate alongside clearly labeled *scenarios* informed by the PM's assessment (e.g., "Optimistic Scenario (Incorporating Mitigating Factors): 70%", "Pessimistic Scenario (Key Risks Realized): 40%").
      *   Tasking the PM with ongoing monitoring of the specific novel elements she identified to trigger formal forecast updates if their risk profile changes materially.

  ### 5. Justification for Recommended Approach
  1.  **Empirically Grounded:** Uses all available objective data (industry and internal).
  2.  **Statistically Principled:** Applies a well-established method (Bayesian updating) to combine data sources coherently, directly addressing the small-N problem of the internal data.
  3.  **Balances Specificity & Reliability:** Leverages the relevance of internal data while benefiting from the stability of industry data.
  4.  **Transparent & Defensible:** Inputs and calculation are clear. Allows the Board to see the contribution of both internal performance and industry norms.
  5.  **Incorporates Expertise Constructively:** Channels the PM's vital insights into risk identification and scenario analysis, where subjective judgment adds the most value without undermining the empirical anchor.
  6.  **Mitigates Bias:** Reduces the influence of both organizational over-optimism and excessive reliance on generic benchmarks.

  ### 6. Limitations & Caveats
  *   The industry data, while large-sample, may not perfectly reflect current market conditions or the precise nature of "project size" categorization.
  *   Defining "similar" internal projects involves judgment; the committee reviewed past projects and confirms these 8 represent the closest analogues.
  *   The Bayesian model assumes the industry and internal data represent comparable success criteria. Minor variations exist but are deemed acceptable.
  *   **This is a base rate, not a final forecast.** It should be the starting point for discussing specific project risks and opportunities identified by the team (including the PM) during the committee meeting. The final probability estimate presented to the Board may be adjusted within a limited range (+/- 5-10%) based on compelling, documented arguments about unique current factors, provided they are *not already reflected* in the internal track record.

  ### 7. Recommendation
  The Forecasting Committee recommends adopting the **Bayesian Synthesis** approach, yielding a **base rate probability of 57%** for the logistics platform achieving go-live by year-end. This estimate will serve as the anchor for our final deliberation, incorporating specific risk/opportunity assessments led by the Project Manager.

  **Decision:** Approve the recommended approach and base rate for final committee deliberation and risk adjustment.

  ---

  **Attachment:** Comparative Table of Approaches  

  | Approach                | Point Estimate | Key Strength                     | Key Weakness                     | Statistical Coherence |
  | :--------------------- | :------------- | :------------------------------- | :------------------------------- | :-------------------- |
  | Industry-Wide (Faction A) | 55%            | High reliability (Large N)       | Low specificity (Unique factors) | High                 |
  | Internal Track (Faction B) | 75%            | High specificity (Our context)   | Low reliability (Small N)        | Moderate (Small N)   |
  | PM Judgment (Faction C) | 85%            | Captures unique novelty          | High susceptibility to bias      | Low                  |
  | **Recommended Bayesian** | **57%**        | **Balances specificity/reliability** | **Relies on quality of inputs**  | **High**             |

  This memo provides a robust, defensible foundation for our estimate. It honors the valuable perspectives of all factions while adhering to a transparent, statistically sound methodology suitable for Board scrutiny.
