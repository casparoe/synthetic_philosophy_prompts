answer: |-
  Okay, let's untangle this! Your professor is right – this *is* "the whole point" because understanding this distinction reveals the deep connection between rationality (never playing dominated strategies), beliefs (about what opponents will do), and equilibrium concepts like Nash. We'll use concrete examples and build step-by-step.

  **The Core Problem: Why Allow Mixed Strategies for Strict Dominance?**

  You thought: "Strictly dominated means some single pure strategy beats it no matter what." **This is often true, but crucially, NOT always.** There are strategies where *no single pure strategy* is always better, but a *mix* of your pure strategies *is* always better.

  **Example 1: The Modified Matching Pennies**
  Imagine this simple 2-player game (Player 1 Rows, Player 2 Columns):

  ```
           Player 2
          L      R
      ---------------
  P1 U | 1,-1 | -1,1  |
  l1 D | -1,1 | 1,-1  |
      ---------------
  ```

  *   **Pure Strategy Analysis:** Look at Player 1's strategies.
      *   If Player 2 plays L: U gives 1, D gives -1. U better.
      *   If Player 2 plays R: U gives -1, D gives 1. D better.
      *   **No single pure strategy** (U or D) is *always* better than the other. Neither U nor D is strictly dominated by the *other pure strategy*.
  *   **Mixed Strategy Analysis:** Consider Player 1 playing a mixed strategy: 50% U, 50% D (flipping a fair coin).
      *   Expected Payoff if Player 2 plays L: (0.5 * 1) + (0.5 * -1) = 0
      *   Expected Payoff if Player 2 plays R: (0.5 * -1) + (0.5 * 1) = 0
      *   Now, compare this to Player 1 playing, say, **U**:
          *   If Player 2 plays L: U gets 1 > 0 (mixed gets 0)
          *   **But**, If Player 2 plays R: U gets -1 < 0 (mixed gets 0)
          *   U is *not* beaten by the mixed strategy *everywhere*. It wins sometimes, loses sometimes. So the mixed strategy doesn't strictly dominate U (or D).

  **Example 2: Where Mixed Strict Dominance Appears**
  Slightly modify the payoffs for Player 1 only:

  ```
           Player 2
          L      R
      ---------------
  P1 U | 1,-1 | -1,1  |
  l1 D | -2,1 | 2,-1  |
      ---------------
  ```

  *   **Pure Strategy Analysis (Player 1):**
      *   If Player 2 plays L: U (1) vs D (-2) -> U better.
      *   If Player 2 plays R: U (-1) vs D (2) -> D better.
      *   **Still, no single pure strategy** strictly dominates the other.
  *   **Mixed Strategy Analysis (Player 1):** Consider playing 50% U and 50% D.
      *   Expected Payoff vs L: (0.5 * 1) + (0.5 * -2) = -0.5
      *   Expected Payoff vs R: (0.5 * -1) + (0.5 * 2) = 0.5
  *   **Now Compare to Playing Pure U:**
      *   Payoff vs L: U=1 > Mixed=-0.5
      *   Payoff vs R: U=-1 < Mixed=0.5
      *   **U is NOT dominated by the 50/50 mix.** It wins sometimes.
  *   **Find a Dominating Mix:** Try a different mix: 60% U, 40% D.
      *   Exp. Payoff vs L: (0.6 * 1) + (0.4 * -2) = 0.6 - 0.8 = -0.2
      *   Exp. Payoff vs R: (0.6 * -1) + (0.4 * 2) = -0.6 + 0.8 = 0.2
  *   **Compare to Playing Pure D:**
      *   Payoff vs L: D = -2 < Mixed = -0.2
      *   Payoff vs R: D = 2 > Mixed = 0.2
      *   **D is NOT dominated by the 60/40 mix.** It wins sometimes.
  *   **The Key Insight:** Now compare playing **Pure U** to playing **Pure D**:
      *   U vs L: 1 > D's -2
      *   U vs R: -1 < D's 2
      *   Neither pure strategy beats the other everywhere. **But**, what if we compare playing **Pure U** to playing a mixed strategy that puts **ALL weight on D**? (i.e., just play D). Then:
          *   U vs L: 1 > D's -2 -> U better
          *   U vs R: -1 < D's 2 -> D better
          *   Still not dominated.
  *   **Strict Dominance by a Mixed Strategy:** Consider the mixed strategy **σ = (0% U, 100% D)**. This is just playing pure D. Does it strictly dominate U?
      *   D vs L: -2 < U vs L: 1 -> U better, so NO.
  *   **Finally, the Winning Mix:** Consider the mixed strategy **σ* = (0.4 U, 0.6 D)**.
      *   Exp. Payoff vs L: (0.4 * 1) + (0.6 * -2) = 0.4 - 1.2 = **-0.8**
      *   Exp. Payoff vs R: (0.4 * -1) + (0.6 * 2) = -0.4 + 1.2 = **0.8**
  *   **Compare to Playing Pure U:**
      *   U vs L: 1 > -0.8? **NO! 1 > -0.8 is TRUE. U is better here.** Still not dominated.
  *   **Compare to Playing Pure D:**
      *   D vs L: -2 > -0.8? **NO! -2 < -0.8** -> Mixed is better.
      *   D vs R: 2 > 0.8? **YES! 2 > 0.8** -> D is better here. **STILL NOT!**

  **We need a mix that beats the target strategy in *every* column.** Let's target **Pure U**. We need a mix σ such that:
  *   σ's Exp vs L > U's Payoff vs L (which is 1)
  *   σ's Exp vs R > U's Payoff vs R (which is -1)

  Assume σ = (p U, (1-p) D), where p is the prob of playing U.
  *   Exp vs L: p * 1 + (1-p) * (-2) = p - 2 + 2p = 3p - 2
  *   Exp vs R: p * (-1) + (1-p) * 2 = -p + 2 - 2p = 2 - 3p

  We need:
  1.  3p - 2 > 1   --> 3p > 3 --> p > 1
  2.  2 - 3p > -1  --> -3p > -3 --> p < 1 (multiply by -1, flip inequality)

  p > 1 and p < 1 is impossible. **Pure U cannot be strictly dominated by ANY mixed strategy in this game!** (Nor can D). This example was meant to show the *possibility*, but my initial modification didn't create it. Let's fix that.

  **Example 3: The Classic Mixed Dominance Example (The "Mickey Mouse" Game)**

  ```
           Player 2
          L      M      R
      --------------------
  P1 U |  4,?  | 0,?  | 1,?  |
  l1 M |  0,?  | 4,?  | 1,?  |
  l1 D |  1,?  | 1,?  | 2,?  |
      --------------------
  ```

  *(Player 2's payoffs don't matter for whether Player 1's D is dominated, as dominance depends only on the player's own payoffs)*

  *   **Pure Strategy Analysis (Player 1):**
      *   Compare D to U:
          *   vs L: D=1 < U=4 -> U better
          *   vs M: D=1 < U=0? **NO, 1 > 0** -> D better
          *   vs R: D=2 > U=1 -> D better
          *   U does not dominate D.
      *   Compare D to M:
          *   vs L: D=1 > M=0 -> D better
          *   vs M: D=1 < M=4 -> M better
          *   vs R: D=2 > M=1 -> D better
          *   M does not dominate D.
  *   **Mixed Strategy Analysis (Player 1):** Consider playing 50% U and 50% M (σ = (0.5 U, 0.5 M, 0 D)).
      *   Exp. Payoff vs L: (0.5 * 4) + (0.5 * 0) = 2
      *   Exp. Payoff vs M: (0.5 * 0) + (0.5 * 4) = 2
      *   Exp. Payoff vs R: (0.5 * 1) + (0.5 * 1) = 1
  *   **Compare to Playing Pure D:**
      *   D vs L: 1 < Mixed=2
      *   D vs M: 1 < Mixed=2
      *   D vs R: 2 > Mixed=1
      *   **D still wins when Player 2 plays R.**
  *   **Find the Dominating Mix:** We need a mix of U and M that also beats D when Player 2 plays R. We need more weight on U when R is played. But we need it to beat D *everywhere*. Try σ* = (0.4 U, 0.6 M, 0 D).
      *   Exp vs L: (0.4*4) + (0.6*0) = 1.6
      *   Exp vs M: (0.4*0) + (0.6*4) = 2.4
      *   Exp vs R: (0.4*1) + (0.6*1) = 1.0
      *   Compare to D: D=1 vs L < 1.6? Yes! D=1 vs M < 2.4? Yes! D=2 vs R > 1.0? **Yes! 2 > 1.0**. Still not.
  *   **The Solution:** Increase the weight on U relative to M. Try σ* = (0.6 U, 0.4 M, 0 D).
      *   Exp vs L: (0.6*4) + (0.4*0) = 2.4
      *   Exp vs M: (0.6*0) + (0.4*4) = 1.6
      *   Exp vs R: (0.6*1) + (0.4*1) = 1.0
      *   Compare to D: D=1 < 2.4 (L)? Yes. D=1 < 1.6 (M)? Yes. D=2 > 1.0 (R)? **STILL YES!**
  *   **Finally, Success:** We need the mix to beat D when Player 2 plays R. D pays 2 vs R. The mix of U and M only pays 1 vs R. **We need a mix that pays *more than 2* vs R? But U only pays 1 vs R, M only pays 1 vs R. Any mix of U and M can only pay 1 vs R!** 1 < 2. **D wins against any mix of U and M when Player 2 plays R.**

  **Ah-Ha! So D *cannot* be dominated by a mix of U and M!** Correct. In this game, D is not strictly dominated by any mixed strategy. It's a best response if Player 2 plays R.

  **Example 4: A Game Where Mixed Strict Dominance Works**
  Modify the last column:

  ```
           Player 2
          L      M      R
      --------------------
  P1 U |  4,?  | 0,?  | 5,?  |  // Changed R payoff for U to 5
  l1 M |  0,?  | 4,?  | 5,?  |  // Changed R payoff for M to 5
  l1 D |  1,?  | 1,?  | 2,?  |
      --------------------
  ```

  *   **Pure Strategy Analysis:** Same as before. Neither U nor M dominates D pure (D wins vs M when L is played, vs U when M is played).
  *   **Mixed Strategy Analysis:** Consider σ* = (0.5 U, 0.5 M, 0 D).
      *   Exp vs L: (0.5*4) + (0.5*0) = 2
      *   Exp vs M: (0.5*0) + (0.5*4) = 2
      *   Exp vs R: (0.5*5) + (0.5*5) = 5
  *   **Compare to Playing Pure D:**
      *   D vs L: 1 < 2
      *   D vs M: 1 < 2
      *   D vs R: 2 < 5
      *   **In EVERY possible column (for every possible move by Player 2), the mixed strategy σ* gives Player 1 a HIGHER payoff than playing pure D.** Therefore, D is **strictly dominated** by the mixed strategy σ* = (0.5 U, 0.5 M).

  **Why "Never a Best Response" ≡ "Strictly Dominated by a Mixed Strategy"**

  This is the deep equivalence. Let `s_i` be one of player `i`'s pure strategies.

  1.  **If `s_i` is strictly dominated by a mixed strategy `σ_i`, then `s_i` is never a best response.**
      *   **Why?** Suppose `s_i` *was* a best response to some belief `μ_i` (a probability distribution over opponents' strategy profiles). This means `s_i` gives at least as high an expected payoff against `μ_i` as *any other* strategy of player `i`.
      *   But if `s_i` is strictly dominated by `σ_i`, then `σ_i` gives a strictly higher payoff than `s_i` **against *every* pure strategy profile of the opponents**.
      *   Therefore, `σ_i` also gives a strictly higher *expected* payoff than `s_i` against the belief `μ_i` (since expectation is a weighted average, and strict inequality holds for every point in the average).
      *   This contradicts the assumption that `s_i` was a best response to `μ_i`! (Because `σ_i` is better). Therefore, `s_i` cannot be a best response to *any* belief `μ_i`.

  2.  **If `s_i` is never a best response, then `s_i` is strictly dominated by some mixed strategy `σ_i`.**
      *   **Why? (Intuition):** Imagine the set of all possible expected payoffs player `i` can get from their pure strategies, as the opponents' play varies (this is like the set of payoff vectors player `i` can achieve). The strategies that *are* best responses lie on the "upper envelope" of this set. A strategy that is *never* a best response lies strictly *below* this upper envelope across all possible opponent plays (beliefs).
      *   Because the set of mixed strategies is convex (you can take probability-weighted averages), there exists a mixed strategy (a point on a line segment connecting other pure strategies) that "sticks out" above this never-best-response strategy `s_i` in *every* direction (i.e., for every possible opponent action). This is a consequence of the Separating Hyperplane Theorem in convex analysis.
      *   **In simpler terms:** If there's no belief where `s_i` is best, then there must be *some* mix of your other strategies that *always* does better than `s_i`, no matter what the opponents do. That mix `σ_i` strictly dominates `s_i`.

  **Iterated Elimination: Strict vs. Weak and Order Dependence**

  *   **Strict Dominance (using mixed strategies allowed):**
      *   **Order Independence:** The process is order independent. It doesn't matter in which order you eliminate strictly dominated strategies; you'll always end up with the same set of strategies at the end.
      *   **Why?** Because of the "never a best response" equivalence. Eliminating a strictly dominated strategy is the same as eliminating a strategy that is *never* rational to play (it's never a best response to *any* belief about opponents). Removing a strategy that is never rational doesn't change what is rational for the remaining players. If a strategy was never a best response originally, it certainly won't become one after removing another player's never-best-response strategy. The property "never a best response" is robust to the removal of other strictly dominated strategies. Nash equilibria are always contained within the set surviving iterated strict dominance.
  *   **Weak Dominance:**
      *   **Order Dependence:** The final set of surviving strategies can depend on the *order* in which you eliminate weakly dominated strategies.
      *   **Why? The Indifference Problem:** A weakly dominated strategy `w_i` *can* be a best response, but only when you are *indifferent* between `w_i` and the dominating strategy `d_i` (or mix) for the specific actions opponents are playing. If you eliminate `w_i` first, `d_i` remains. But if you eliminate `d_i` first (perhaps because `d_i` itself is weakly dominated by something else in a different part of the game), then `w_i` might survive and potentially be part of a Nash equilibrium.

  **Example 5: Battle of the Sexes (Order Dependence of Weak Elimination)**

  ```
           Player 2 (Wife)
          Ballet    Football
      --------------------------
  P1  Bal |  2, 1  |  0, 0  |
  l   Foot|  0, 0  |  1, 2  |
  y   --------------------------
  e   (Husband)
  r
  1
  ```

  *   **Nash Equilibria:** (Ballet, Ballet) and (Football, Football), and a mixed strategy equilibrium.
  *   **Weak Dominance:**
      *   For Husband: Playing *pure* Ballet weakly dominates playing *pure* Football? No.
          *   If Wife plays Ballet: Bal=2 > Foot=0 -> Bal better.
          *   If Wife plays Football: Bal=0 < Foot=1 -> Foot better.
      *   For Husband: **Is pure Football weakly dominated by pure Ballet?**
          *   If Wife plays Ballet: Bal=2 > Foot=0 -> Bal strictly better.
          *   If Wife plays Football: Bal=0 < Foot=1 -> Foot strictly better. **No weak dominance.**
      *   **But...** Consider the Husband playing a mixed strategy, say 100% Ballet (σ_H = Ballet). Does this *weakly dominate* pure Football?
          *   Vs Wife Ballet: σ_H gets 2 >= Foot gets 0 (True)
          *   Vs Wife Football: σ_H gets 0 <= Foot gets 1? **0 <= 1 is True, but it's not *greater than or equal*; it's *less than*. Weak dominance requires `>=` in all cases and `>` in at least one.** σ_H Ballet gets 0 vs Wife Football, which is *less* than Foot's 1. So σ_H (Ballet) does *not* weakly dominate Foot.
      *   **Weak Dominance Appears:** Consider the Husband playing a mixed strategy σ_H = (0.5 Ballet, 0.5 Football). Expected Payoffs:
          *   Vs Wife Ballet: (0.5 * 2) + (0.5 * 0) = 1
          *   Vs Wife Football: (0.5 * 0) + (0.5 * 1) = 0.5
          *   Compare to Husband playing **pure Football**:
              *   Vs Wife Ballet: Foot=0 < Mixed=1 -> Mixed better
              *   Vs Wife Football: Foot=1 > Mixed=0.5 -> Foot better **Not weak dominance.**
      *   **Revelation:** **In this standard Battle of the Sexes, neither pure strategy is weakly dominated (by pure or mixed) for either player!** My earlier thought was wrong. We need a different example.

  **Example 6: Order Dependence Illustrated (Modified Game)**

  Add a third strategy, "Stay Home" (S), for both players with low payoffs:

  ```
            Player 2 (Wife)
          Bal     Foot     S
      ---------------------------
  P1  Bal | 2,1  | 0,0   | 0,0  |
  l   Foot| 0,0  | 1,2   | 0,0  |
  y   S   | 0,0  | 0,0   | 0,0  |
  e   ---------------------------
  r
  1
  ```

  *   **Nash Equilibria:** Still (Bal, Bal), (Foot, Foot). (S, S) is also Nash but worse.
  *   **Weak Dominance:**
      *   **"Stay Home" (S) is weakly dominated FOR BOTH PLAYERS.** For the Husband:
          *   Playing pure Ballet weakly dominates S: Ballet gets >=0 in all cases, and gets 2 > 0 if Wife plays Ballet.
          *   Playing pure Football also weakly dominates S: Football gets >=0 in all cases, and gets 1 > 0 if Wife plays Football.
          *   Playing *any* mix of Ballet and Football weakly dominates S (as long as the mix puts 0 weight on S).
      *   The pure coordination strategies (Bal, Foot) are not dominated.
  *   **Iterated Elimination - Order 1 (Eliminate S First):**
      1.  Eliminate S for Husband (weakly dominated by Bal, or Foot, or any mix).
      2.  Eliminate S for Wife (weakly dominated by Bal or Foot).
      3.  Reduced game is the standard Battle of the Sexes: {(Bal, Bal), (Bal, Foot), (Foot, Bal), (Foot, Foot)}. Both (Bal, Bal) and (Foot, Foot) survive. **Both pure Nash survive.**
  *   **Iterated Elimination - Order 2 (Eliminate a Coordination Strategy First):**
      1.  Suppose we try to eliminate Husband's Football first. Is it weakly dominated? Compare to Ballet:
          *   Vs Wife Bal: Bal=2 > Foot=0 -> Bal better.
          *   Vs Wife Foot: Bal=0 < Foot=1 -> Foot better.
          *   Vs Wife S: Bal=0 = Foot=0 -> Equal.
          *   **Not weakly dominated by Ballet.** (It does worse sometimes, better sometimes). Similarly, not dominated by S or mixes yet.
      2.  **But**, is Husband's Football weakly dominated by a mixed strategy? Consider σ_H = (0.5 Bal, 0.5 S). Exp Payoffs:
          *   Vs Wife Bal: (0.5*2) + (0.5*0) = 1 > Foot=0
          *   Vs Wife Foot: (0.5*0) + (0.5*0) = 0 = Foot=1? 0 < 1 -> Worse! Not dominance.
      3.  **Weak Dominance Path:** Notice that **S** is weakly dominated. Suppose we **don't** eliminate S yet. Consider if Husband believes Wife would *never* play S. Then Husband faces only Bal/Foot. In this *restricted* game, Husband's Football is *not* weakly dominated by Ballet (as in standard BoS). **We need a different order.**
      4.  **Eliminate Wife's Football First?** Is it weakly dominated? Compare to Ballet:
          *   Vs Hus Bal: Bal=1 > Foot=0? Wife Payoffs: Ballet gives her 1, Football gives her 0 -> Bal better.
          *   Vs Hus Foot: Bal=0 < Foot=2 -> Foot better.
          *   Vs Hus S: Bal=0 = Foot=0 -> Equal.
          *   Not weakly dominated.
      5.  **The Crucial Order:** Start by eliminating **Husband's "Ballet"** first as weakly dominated? Is it?
          *   Compare to S: Ballet weakly dominates S (as above), so Ballet isn't dominated *by* S.
          *   Compare to Football: As above, neither weakly dominates the other.
          *   Compare to a mix? Hard to find one that weakly dominates Ballet.
      6.  **Success Scenario:** Suppose we first eliminate **Wife's S** (weakly dominated by Bal or Foot). Now Wife only has Bal/Foot. In this reduced game, eliminate **Husband's S** (weakly dominated by Bal or Foot). Now we have standard BoS. **Both Nash survive.**
      7.  **Order that Kills a Nash:** Suppose we first eliminate **Husband's S** (weakly dominated by Bal or Foot). The game reduces to:
          ```
                    Wife
                Bal     Foot     S
              --------------------
          Hus Bal| 2,1  | 0,0   | 0,0  |
             Foot| 0,0  | 1,2   | 0,0  |
              --------------------
          ```
          *   Now, look at **Wife's S**. In this reduced game, what weakly dominates Wife's S?
              *   Vs Hus Bal: Wife S gets 0. Wife Bal gets 1 > 0. Wife Foot gets 0 = 0.
              *   Vs Hus Foot: Wife S gets 0. Wife Bal gets 0 = 0. Wife Foot gets 2 > 0.
              *   **Neither Wife Bal nor Wife Foot *weakly dominates_ S alone.** Wife Bal beats S only if Hus plays Bal. Wife Foot beats S only if Hus plays Foot.
              *   **However, consider Wife playing a mixed strategy σ_W = (0.5 Bal, 0.5 Foot)**. Expected Payoffs:
                  *   Vs Hus Bal: (0.5 * 1) + (0.5 * 0) = 0.5 > Wife S=0
                  *   Vs Hus Foot: (0.5 * 0) + (0.5 * 2) = 1.0 > Wife S=0
              *   So, in this reduced game (after Husband S is eliminated), Wife's S is **weakly dominated** by the mixed strategy σ_W = (0.5 Bal, 0.5 Foot). Eliminate Wife's S.
          *   Reduced game is now:
              ```
                        Wife
                    Bal     Foot
                  ---------------
              Hus Bal| 2,1  | 0,0  |
                 Foot| 0,0  | 1,2  |
                  ---------------
              ```
              *   Now, **Husband's Ballet is weakly dominated by Husband's Football?**
                  *   Vs Wife Bal: Bal=2 > Foot=0 -> Bal better.
                  *   Vs Wife Foot: Bal=0 < Foot=1 -> Foot better. **Not dominated.**
              *   **But, eliminate Wife's Football first?** Is it weakly dominated by Wife's Ballet?
                  *   Vs Hus Bal: Bal=1 > Foot=0 -> Bal better.
                  *   Vs Hus Foot: Bal=0 < Foot=2 -> Foot better. **Not dominated.**
              *   **Eliminate Husband's Football:** Is it weakly dominated by Husband's Ballet?
                  *   Vs Wife Bal: Bal=2 > Foot=0 -> Bal better.
                  *   Vs Wife Foot: Bal=0 < Foot=1 -> Foot better. **Not dominated.**
              *   **Eliminate Wife's Ballet:** Is it weakly dominated by Wife's Football?
                  *   Vs Hus Bal: Bal=1 > Foot=0 -> Bal better.
                  *   Vs Hus Foot: Bal=0 < Foot=2 -> Foot better. **Not dominated.**
          *   **We cannot eliminate anything else!** The surviving strategies are: Husband {Bal, Foot}, Wife {Bal, Foot}. Both pure Nash (Bal, Bal) and (Foot, Foot) are still here. This order didn't kill one.
      8.  **Order that KILLS (Foot, Foot):** Start by eliminating **Wife's Football** first. But is it weakly dominated *initially*? As before, no. We need a different initial step.
      9.  **True Order Dependence:** The classic example often involves more strategies. The core point remains: **Because a weakly dominated strategy `w_i` *can* be a best response (when the dominating strategy `d_i` yields the *same* payoff), eliminating `d_i` first (perhaps based on its weakness elsewhere) can leave `w_i` intact, potentially preserving a Nash equilibrium involving `w_i`. Eliminating `w_i` first removes that equilibrium.** Finding a minimal example is tricky, but the logic is sound.

  **Summary & The Big Picture**

  1.  **Mixed Strategies for Strict Dominance:** Are necessary because some strategies (`D` in Example 4) are suboptimal no matter what opponents do, but *no single pure strategy* consistently beats them. Only a mix can "cover all bases" strictly better. This is why the definition allows mixed dominating strategies.
  2.  **"Never a Best Response" ≡ "Strictly Dominated by a Mixed Strategy":** This is the profound link. A rational player, who forms beliefs and plays a best response, would *never* play a strictly dominated strategy (because there's always something better, no matter the belief). Conversely, if a strategy is never best, rationality demands something else *is* always better, and that "something else" can be found within the convex hull (mixed strategies) of your pure strategies.
  3.  **Iterated Elimination - Why Strict is Safe, Weak is Not:**
      *   **Strict (Mixed):** Eliminates "never best responses." Removing something that's never rational doesn't change what *is* rational for others. Surviving strategies are the only candidates for rational play/best responses/Nash. Order independent.
      *   **Weak:** Eliminates strategies that are "sometimes best responses, but only when indifferent." Removing one can remove the *indifference condition* that made another strategy a best response. Removing a different one first might preserve that indifference condition and the associated best response/Nash. Order dependent. Can eliminate Nash equilibria (if you eliminate the strategy involved in the equilibrium before eliminating others).

  **Professor's "Whole Point":** This equivalence (`strictly dominated by mixed` <=> `never best response`) bridges the two fundamental ideas in non-cooperative game theory:
  1.  **Rationality:** Players don't play strictly dominated strategies (they are never best responses).
  2.  **Equilibrium (Nash):** Players play mutual best responses.

  Iterated strict dominance (in mixed strategies) uses rationality to narrow down the strategies that could *possibly* be played in *any* Nash equilibrium. Weak dominance lacks this robust connection to best responses due to indifference, making it a less reliable solution concept. Understanding this distinction is crucial for grasping how rationality connects to equilibrium predictions in games.
