prompt: |-
  hey so im co running a workhop for about 22 first year undergrads, half CS half philosophy, 70 minutes total, and I want a runnable in class game that makes them feel the frame problem instead of just hearing a definition

  here is the setup I have in mind, feel free to tweak it: a dumb campus kiosk bot has to do three tiny jobs - keep clean mugs on shelf A, keep the cart out of the doorway, and keep an accurate count of spoons. Teams take turns writing rule cards for the bot and then another team has to execute them completely literally while I keep throwing in small side changes like a mug cracks, someone borrows the cart, spoons get moved to washbin, that sort of thing. I want them to discover on their own that listing extra do not change notes blows up and still misses stuff, without me naming the problem up front. The takeaway for them should be why relevance is the hard part, why you cannot fix commonsense updating just by adding more persistence rules.

  can you give me full rules, materials needed, teams and roles, a points system with no real money, a minute by minute plan for the 70 minutes, plus a debrief that maps specific moments in the game to parts of the idea. Also tell me what will predictably go wrong the first time I run this activty and how to handle it, and be honest about which part of the frame problem the game cannot reproduce and I will have to just explain.

  one more thing, please flag clearly what is settled vs what is genuinely contested among people who actually work on this area, and do not present a contested view as if it is the consensus.

  and at the very end after the main plan, add a compact summary table with these five columns: Phase, Minutes, Facilitator Move, Student Trap To Watch For, Which Bit Of The Problem It Shows. One row per phase is fine.
reasoning: |-
  We are designing an in-class game to illustrate the frame problem for first-year undergraduates (half CS, half philosophy). The goal is to have students experience the issue of commonsense reasoning about change without explicitly defining the frame problem upfront.

  ### Core Concept
  The **frame problem** (in AI and philosophy) is about how to efficiently represent which things remain unchanged when an action is performed, without having to list all non-changes explicitly. The challenge is that the set of things that *don't* change is vast, and we rely on "common sense" to avoid listing them all.

  ### Game Setup: "The Campus Kiosk Bot"
  - **Scenario**: A dumb bot (rule-based) must maintain three simple goals:
    1. Keep clean mugs on shelf A.
    2. Keep the cart out of the doorway (i.e., in its designated spot).
    3. Keep an accurate count of spoons (i.e., track the number of spoons in the kiosk).
  - **Gameplay**: Teams of students write rule cards for the bot. Another team (or the same team) must execute the rules literally while the facilitator (you) introduces small changes (e.g., a mug cracks, someone borrows the cart, spoons are moved to the washbin). The rules must be executed step-by-step without any interpretation beyond what is written.

  ### Materials
  - **Rule cards**: Index cards or sticky notes for writing rules.
  - **Physical or visual props**:
    - A small shelf (or a box labeled "Shelf A") for mugs.
    - A few mugs (can be paper cutouts or real mugs if available).
    - A cart (a small box or a toy cart).
    - A doorway (marked with tape on the floor).
    - Spoons (or paper cutouts) and a washbin (a box labeled "washbin").
    - A whiteboard or large paper to track the spoon count and other state changes.
  - **Timer**: To keep track of time during rounds.

  ### Teams and Roles
  - **Number of teams**: 3-4 teams (each with 5-6 students).
  - **Roles per round**:
    - **Rule Writers (1 team)**: Write rules for the bot on rule cards. They have limited time (e.g., 5 minutes) to write as many rules as they want but must be specific and literal.
    - **Rule Executors (another team)**: Execute the rules exactly as written, without adding any interpretation. They must follow the rules step-by-step when the facilitator introduces a change.
    - **Observers (the rest)**: Watch for issues and take notes. They can be called upon during debrief.
  - **Rotation**: Rotate roles each round so every team gets to write and execute.

  ### Game Rounds
  - Each round has two phases: 
    1. **Rule Writing**: One team writes rules.
    2. **Rule Execution**: Another team executes the rules while the facilitator introduces a change. The execution must be done in front of the class.

  ### Points System (Non-Monetary)
  - **Rule Writers**:
    - +1 point per rule that successfully handles a change (if the rule is triggered and the goal is maintained).
    - -1 point per rule that causes an incorrect action (e.g., moves a mug when it shouldn't) or fails to handle a change (leading to a goal violation).
  - **Rule Executors**:
    +1 point for correctly executing the rules (as written) without adding interpretation.
    -1 point if they deviate from the written rules (even if it would be "smarter").
  - **Observers**:
    +1 point for identifying an unhandled change that leads to a goal violation (if they raise it during execution and it's confirmed).
    +1 point for suggesting a new rule (in a subsequent round) that would have fixed a problem without causing a blow-up.

  ### Minute-by-Minute Plan (70 minutes total)

  | Phase | Minutes | Activity |
  |-------|---------|----------|
  | **Introduction** | 0-5 | Explain the scenario and the bot's three goals. Emphasize that the bot is literal and must be given explicit rules. Introduce the roles (Rule Writers, Rule Executors, Observers). |
  | **Round 1 Setup** | 5-10 | Assign roles: Team 1 writes rules. Teams 2 and 3 are Observers. Team 2 will execute in Round 1. |
  | **Round 1: Rule Writing** | 10-15 | Team 1 writes rules (5 minutes). They can write as many rules as they want. Example: "If a mug is dirty, move it to washbin." |
  | **Round 1: Rule Execution** | 15-25 | Team 2 executes the rules. Facilitator starts with the initial state (all goals met). Then, introduce a change: "A mug cracks." The executors must follow the rules. If no rule addresses it, the goal is violated. Observers watch. (10 minutes) |
  | **Round 2 Setup** | 25-30 | Rotate roles: Team 2 writes rules. Team 3 executes. Team 1 observes. |
  | **Round 2: Rule Writing** | 30-35 | Team 2 writes rules, possibly adding more to fix previous issues. |
  | **Round 2: Rule Execution** | 35-45 | Facilitator introduces two changes: (1) "Someone borrows the cart" (so it's no longer in its spot) and (2) "Spoons are moved to the washbin." (10 minutes) |
  | **Round 3 Setup** | 45-50 | Rotate: Team 3 writes rules. Team 1 executes. Team 2 observes. |
  | **Round 3: Rule Writing** | 50-55 | Team 3 writes rules. |
  | **Round 3: Rule Execution** | 55-65 | Facilitator introduces a change that might cause a cascade: "A clean mug is placed on shelf B by a human." Then, "The washbin is emptied (including any spoons)." (10 minutes) |
  | **Debrief** | 65-70 | Whole class discussion. Map the game to the frame problem. |

  ### Debrief Structure
  1. **What happened?** 
     - Ask each team: What went well? What went wrong? 
     - Highlight moments when:
       - Rules were too specific and missed a change (e.g., cracked mug not handled).
       - Rules caused unintended actions (e.g., a rule about moving dirty mugs also moved a cracked mug?).
       - Rules became too many and conflicted (e.g., a rule to move the cart back conflicted with a rule about spoon counting?).
  2. **Map to the frame problem**:
     - **Why did the bot fail?** It needed rules for every little change, and even then, new changes broke it.
     - **The explosion of rules**: When teams tried to add rules for every "do not change" (persistence), they still missed things. The number of rules grew, and conflicts arose.
     - **The core issue**: We cannot list every non-change. Common sense tells us what is relevant, but the bot doesn't have that.
  3. **What is the frame problem?** (Now define it)
     - In AI: How do we represent the effects of actions without having to explicitly state all the things that stay the same?
     - In philosophy: How do we account for relevance in reasoning about change?
  4. **Contested vs. Settled** (Be clear):
     - **Settled**: The frame problem is a fundamental challenge in AI (especially symbolic AI) and philosophy of mind. It shows the difficulty of formalizing commonsense reasoning.
     - **Contested**: 
       - Whether the frame problem is solvable without embodiment or learning (some argue neural networks/learning-based approaches avoid it, others disagree).
       - Whether it is a problem for AI in general or only for certain architectures (e.g., classical planning).
       - The exact relationship to the "qualification problem" (listing all preconditions) and the "ramification problem" (indirect effects) is sometimes debated.

  ### What the Game Cannot Reproduce
  - The game simplifies the frame problem to a tractable scale. In reality, the number of potential state variables is enormous. The game cannot fully convey the combinatorial explosion, but it hints at it.
  - The game does not address how modern AI (e.g., machine learning) might approach this differently (e.g., by learning from data). You may need to explain that in the debrief.

  ### Predictable Problems and Solutions
  1. **Problem**: Teams write vague rules (e.g., "keep the area clean").  
     **Solution**: Enforce that rules must be specific and executable (e.g., "if you see an object in the doorway that is the cart, move it to the cart spot"). If a rule is vague, the executors should ask for clarification, and if still vague, skip it (and the team loses points).

  2. **Problem**: Executors add common sense.  
     **Solution**: Remind them the bot is literal. Deduct points if they deviate. Have observers watch for this.

  3. **Problem**: The game bogs down in rule writing or execution.  
     **Solution**: Strict time limits. If a rule is too long, it's invalid. Keep rounds moving.

  4. **Problem**: Students get stuck on one goal and ignore others.  
     **Solution**: As facilitator, introduce changes that affect multiple goals (e.g., moving the cart might involve spoons if a spoon was on the cart).

  5. **Problem**: The game becomes chaotic.  
     **Solution**: Use a whiteboard to track state (e.g., mug locations, cart location, spoon count) so everyone can see.

  ### Summary Table

  | Phase          | Minutes | Facilitator Move                                                                 | Student Trap To Watch For                                                         | Which Bit of the Problem It Shows                                                                 |
  |----------------|---------|----------------------------------------------------------------------------------|-----------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------|
  | Introduction   | 0-5     | Set up goals and rules. Emphasize literal execution.                             | Students might not grasp the strict literalism.                                   | The need for explicit rules.                                                                      |
  | Rule Writing   | 5-15, 25-35, 50-55 | Circulate, enforce specificity, and time limit.                                  | Writing too few rules or overly broad rules.                                      | The difficulty of anticipating all changes.                                                       |
  | Rule Execution | 15-25, 35-45, 55-65 | Introduce changes (e.g., cracked mug, cart borrowed, spoons moved). Track state. | Executors adding common sense; writers not covering changes.                      | How rules fail to handle unanticipated changes; explosion of rules.                               |
  | Debrief        | 65-70   | Guide discussion: Ask about failures and rule growth. Define frame problem.      | Students may focus on "smarter rules" instead of the inherent scaling issue.      | Why relevance is hard: we can't list all non-changes, and adding more rules doesn't fully solve.  |

  By the end, students should feel the frustration of trying to write exhaustive rules and see that even with many rules, unexpected changes cause failures. This sets the stage for understanding why the frame problem is hard and why common sense is not just a big list of rules.
answer: |-
  ### Game Plan: "The Literal Bot Lab"  
  **Goal:** Students experience the frame problem through iterative rule-writing for a bot managing a campus kiosk. The bot must handle 3 goals:  
  1. **Mugs:** Keep clean mugs on Shelf A (max 3).  
  2. **Cart:** Keep the cart out of the doorway (designated spot: "Cart Zone").  
  3. **Spoons:** Track spoon count accurately (start: 5 spoons).  

  **Materials:**  
  - Whiteboard/projector (track state: mug locations, cart position, spoon count).  
  - Index cards (for rules) + markers.  
  - Props: Paper cutouts for mugs (labeled M1–M3), cart, spoons; tape marks for "Doorway," "Shelf A," "Cart Zone," "Washbin."  

  ---

  ### Teams & Roles (22 students)  
  - **3 teams (7–8 students each):**  
    - **Team A:** Rule Writers (5 min to draft rules).  
    - **Team B:** Rule Executors (act as the "bot," follow rules verbatim).  
    - **Team C:** Observers (track failures, suggest fixes later).  
    *Rotate roles each round.*  

  ---

  ### Rules & Points System  
  - **Rule Constraints:**  
    - Rules must be **atomic** (e.g., "IF [condition] THEN [action]").  
    - No "common sense" (e.g., "IF mug cracked THEN discard" is valid; "IF something is broken THEN fix it" is invalid).  
  - **Points (bragging rights):**  
    | Action | Points |  
    |--------|--------|  
    | Goal maintained during a change | +1 per goal |  
    | Rule successfully triggered | +1 per rule |  
    | Unhandled change violates goal | -2 per goal |  
    | Rule causes unintended side effect | -1 per effect |  
    | Observer catches a flaw | +1 per catch |  

  ---

  ### Minute-by-Minute Plan  
  **Total: 70 min**  

  | Time  | Phase               | Activity |  
  |-------|---------------------|----------|  
  | 0–5   | **Intro**          | Explain the bot’s 3 goals. Demo initial state: 3 clean mugs on Shelf A, cart in Cart Zone, 5 spoons. Emphasize: "The bot is *literal*—it only does what the rules say!" |  
  | 5–15  | **Round 1 Setup**  | Team A writes rules (5 min). *Facilitator tip:* Nudge them toward minimal rules (e.g., "IF mug NOT on Shelf A THEN move to Shelf A"). Team B prepares to execute. Team C observes. |  
  | 15–25 | **Round 1 Execution** | Team B enacts rules. **Change 1:** Facilitator moves cart to doorway. *Do rules move it back?* **Change 2:** A mug cracks. *Is it removed?* Track spoon count. |  
  | 25–40 | **Round 2 Setup**  | Rotate roles (B writes, C executes, A observes). Teams add rules to fix Round 1 issues (e.g., "IF cart in doorway THEN move to Cart Zone"). |  
  | 40–50 | **Round 2 Execution** | **Change 1:** Spoons moved to washbin. **Change 2:** Cart borrowed (disappears). **Change 3:** New dirty mug appears. *Do rules overshoot? (e.g., spoon-count rule deletes mugs?)* |  
  | 50–60 | **Round 3 Setup**  | Rotate roles (C writes, A executes, B observes). Teams add "persistence rules" (e.g., "IF spoon moved THEN update count"). |  
  | 60–65 | **Round 3 Execution** | **Change 1:** Clean mug placed on Shelf B. **Change 2:** Wind blows cart 1 foot. **Change 3:** Spoons vanish from washbin. *Does rule bloat cause conflicts?* |  
  | 65–70 | **Debrief**        | Discuss: "Why did the bot fail despite more rules?" Map to frame problem (see below). |  

  ---

  ### Debrief: Mapping Game to Frame Problem  
  **Key Moments & Insights:**  
  - **Round 1 Failure (e.g., cracked mug ignored):** Shows the **qualification problem**—rules didn’t anticipate *all* preconditions for "mug on shelf."  
  - **Round 2 Failure (e.g., spoon rule breaks mug count):** Illustrates the **ramification problem**—unintended side effects from narrow rules.  
  - **Round 3 Failure (e.g., wind-blown cart not handled):** Reveals the **core issue**—you can’t list every "do not change" (*persistence*) rule.  
  - **Observer Catch (e.g., "What if a spoon is broken?"):** Highlights **relevance blindness**—the bot can’t infer what matters.  

  **Takeaway:**  
  > "Adding more rules *kinda* helps but creates new bugs. Commonsense requires knowing what *doesn’t* need to change—and that’s computationally explosive to specify. Relevance is the hard part!"  

  ---

  ### What the Game *Can’t* Reproduce  
  - **The combinatorial explosion:** Real-world states are infinite; the game simplifies to 3 goals.  
    *➔ Explain afterward:* "In reality, you’d need rules for *every object* × *every state*—like ‘IF spoon NOT moved, THEN count unchanged’ for spoons, mugs, carts, doors..."  
  - **Modern AI approaches:** The game uses symbolic rules (like 1980s AI). Today’s ML systems *learn* relevance from data—but still struggle with novel cases.  

  ---

  ### Contested vs. Settled in Frame Problem Research  
  | Aspect                     | Settled Consensus                                                                 | Contested Views                                                                 |  
  |----------------------------|-----------------------------------------------------------------------------------|---------------------------------------------------------------------------------|  
  | **Core challenge**         | Explicitly specifying persistence is intractable for real-world agents.           | Whether it’s *fundamentally* unsolvable (e.g., some argue neural nets avoid it). |  
  | **Relevance**              | Determining relevance requires non-rule-based inference (e.g., probabilistic).     | How to formalize relevance (e.g., logic-based vs. embodied cognition approaches). |  
  | **AI impact**              | A critical flaw in classical symbolic AI.                                         | Whether it’s still relevant for modern AI (e.g., LLMs handle it implicitly).     |  

  *Note: Emphasize that "no silver bullet exists" during debrief.*  

  ---

  ### Predictable Problems & Fixes  
  1. **Problem:** Teams write vague rules (e.g., "Keep things tidy").  
     *Fix:* Reject non-atomic rules. Example: "IF mug dirty THEN move to washbin" is ok; "Keep shelf clean" is not.  
  2. **Problem:** Executors use common sense (e.g., moving the cart without a rule).  
     *Fix:* Enforce literalism—award negative points, have observers police this.  
  3. **Problem:** Rule explosion slows the game.  
     *Fix:* Cap rules at 5 per round. Say: "The bot has limited memory!"  
  4. **Problem:** Students blame "bad rules," not the framework.  
     *Fix:* In debrief, ask: "Could *any* rule set cover all changes? What would it take?"  

  ---

  ### Summary Table  

  | Phase             | Minutes | Facilitator Move                                | Student Trap to Watch For                          | Which Bit of the Problem It Shows                     |  
  |-------------------|---------|-------------------------------------------------|---------------------------------------------------|-------------------------------------------------------|  
  | **Intro**         | 0–5     | Demo goals; stress bot literalism.              | Assuming the bot "understands" context.           | Need for explicit rules.                              |  
  | **Rule Writing**  | 5–15, 25–40, 50–60 | Enforce atomic rules; reject vagueness.         | Overlooking edge cases (e.g., "cracked mug").     | Qualification problem (unstated preconditions).       |  
  | **Execution**     | 15–25, 40–50, 60–65 | Introduce changes; track state visibly.         | Executors improvising ("common sense creep").     | Ramification problem (side effects).                 |  
  | **Observer Input**| All rounds | Award points for catching flaws.              | Focusing only on their team’s rules.              | Relevance blindness (what *should* be inferred?).    |  
  | **Debrief**       | 65–70   | Link failures to frame problem; contrast with human reasoning. | Proposing "just add more rules" as a solution. | Combinatorial explosion of persistence axioms.       |  

  ---  
  **Run it, then reveal the term:** After the game, say: "What you experienced is called *the frame problem*—and it’s why AI can’t ‘just’ use common sense." This creates an "aha!" moment.
