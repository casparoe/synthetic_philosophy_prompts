prompt: |-
  I'm a PhD student working at the intersection of decision theory and ethics, and I've spent the better part of the last year trying to figure out where I stand on expected value fanaticism. The position, as I've come to understand it, is roughly this: if you accept that the rational choice is the one that maximizes expected value, and you refuse to place any principled upper bound on either the probability scale or the value scale, then you are committed to letting vanishingly small probabilities of arbitrarily large payoffs dominate your practical reasoning. A one-in-a-googolplex chance of preventing an astronomical amount of suffering would, on this view, outweigh the certain prevention of a single headache — and indeed would outweigh any finite amount of ordinary suffering prevented with certainty. I find myself drawn to the view because the alternatives seem to involve either an unmotivated cap on value (why this bound rather than that one?) or a departure from expected value maximization that looks ad hoc when examined closely. And I'm not satisfied by appeals to what we would or wouldn't do in practice; the view is making a claim about the structure of practical rationality, not about human psychology.

  What I want — and what I haven't found a clear treatment of — is a systematic map of what would count against this position. Not a list of objections I can bat away, but an honest survey of the evidence, arguments, formal results, and conceptual considerations that should genuinely move someone who currently accepts fanatical expected value reasoning. I want to know which defeaters would be decisive (they would force me to abandon the view), which would be merely awkward (they would require significant qualification but leave something recognizable intact), and which are often presented as defeaters but on closer inspection beg the question or miss the point. I'm especially interested in whether the view makes any predictions that differ from its rivals in a way that could in principle be checked — or whether it has been insulated against empirical disconfirmation entirely. If the latter, I want to know whether that insulation is a problem for a view about the norms of practical reason, or whether it's exactly what we should expect. And I'd like to know which of these costs the view's defenders would themselves concede as genuine, as opposed to what critics claim the view is committed to.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a PhD student at the intersection of decision theory and ethics, grappling with expected value fanaticism. The core issue is how tiny probabilities of immense payoffs can dominate practical reasoning. They want a systematic map of counterarguments, categorized by how damaging they are to the position.  

  First, I need to recall the key components of expected value fanaticism. It relies on unbounded utility functions and strict expected utility maximization. The user seems drawn to it because alternatives either impose arbitrary bounds or deviate from expected utility in ways that seem ad hoc. Their frustration with practical objections makes sense—they’re focused on normative rationality, not psychology.  

  The user’s explicit request is for a taxonomy of defeaters: decisive, awkward, or question-begging. But deeper needs might include clarity on whether the view is falsifiable, and if not, whether that’s acceptable for a normative theory. They might also be seeking reassurance that their attraction to fanaticism isn’t naive—they want to confront the strongest counterarguments fairly.  

  I should structure the response around defeaters. Decisive ones could include formal incoherences like infinitarian paralysis or violations of dominance principles. Awkward ones might involve intuitive repugnance or action-guidance failures. Question-begging objections often rely on preexisting intuitions that fanaticism rejects.  

  Empirical unfalsifiability is tricky. Normative theories often aren’t testable, but fanaticism’s insulation might be extreme if it dismisses all real-world stakes. Defenders might argue this is inevitable—any non-fanatical view must arbitrarily bound value or probability, which is itself unmotivated.  

  I should also note where defenders concede ground. For instance, Bostrom acknowledges Pascalian problems but sees bounded utility as worse. Others might accept "awkward" costs like moral repugnance as necessary trade-offs.  

  The user might be wrestling with meta-normative questions too: If fanaticism can’t be disproven, is that a virtue (consistency) or vice (unfalsifiable dogma)? I’ll need to balance technical rigor with their existential stake in this as a researcher.  

  Finally, I’ll emphasize that "decisive" defeaters are rare—most arguments force trade-offs between theoretical purity and practicability. The real cost of fanaticism may be how much common sense it must jettison to stay consistent.
answer: |-
  Your quest for a rigorous audit of expected value fanaticism (EVF) is precisely the right approach. Below is a systematic map of defeaters, categorized by their force and nature, drawing on decision theory, ethics, formal philosophy, and meta-normative considerations. Defenders like Nick Bostrom, Toby Ord, and proponents of strong longtermism often acknowledge these as genuine costs, even if they consider alternatives worse.

  ### I. Decisive Defeaters (Potentially Force Abandonment)
  These challenge the *internal coherence* or *foundational compatibility* of EVF with core rational requirements:

  1.  **Infinitarian Paralysis (Incoherence Arguments):**
      *   **Problem:** If utilities are truly unbounded *and* probabilities can be arbitrarily small, EVF can generate situations where *every* available action has infinite expected value (EV), making rational choice impossible. (e.g., St. Petersburg-like variations with multiple infinite-EV options).
      *   **Why Decisive?** If EVF renders rational choice impossible in principle (not just computationally difficult), it fails as a normative guide. Defenders *must* impose *some* structural constraint (e.g., a finite universe, a privileged probability measure) to avoid this, undermining pure unboundedness.
      *   **Defender Concession:** Bostrom ("Infinite Ethics") explicitly wrestles with this, seeking aggregation methods for infinite worlds. Many concede pure unboundedness needs refinement to avoid paralysis.

  2.  **Violation of Statewise Dominance:**
      *   **Problem:** EVF can recommend an action A over B even if, *in every single possible state of the world*, action B yields a better outcome than action A, *except* in one state with an astronomically low probability and astronomically high payoff favoring A.
      *   **Why Decisive?** Statewise dominance is a fundamental, almost axiomatic principle of rational choice under uncertainty. Violating it seems patently irrational. If EVF forces this violation, it clashes with a bedrock requirement most find non-negotiable.
      *   **Defender Response:** Often involves biting the bullet, arguing that dominance is less fundamental than maximizing EV *if* utilities/probs are unbounded. This is a major cost.

  ### II. Awkward Defeaters (Require Significant Qualification)
  These don't destroy the view but make it deeply counterintuitive, impractical, or force complex modifications:

  3.  **The Problem of Fanatical Threats (Pascal's Mugging & Extortion):**
      *   **Problem:** EVF makes agents vulnerable to coercion by agents threatening arbitrarily bad outcomes with arbitrarily small probabilities unless a ransom is paid. Any entity can fabricate a credible-sounding threat with tiny p and immense disutility.
      *   **Why Awkward?** It renders agents practically exploitable and paralyzes action, as resources must perpetually be diverted to counter every conceivable fanatical threat. Defenders must introduce complex decision rules to filter "sane" vs. "insane" probabilities/utilities, risking arbitrariness.
      *   **Defender Concession:** Widely acknowledged as a major practical flaw. Responses include lexical thresholds (ignore probs below 1/googol), epistemic filters (demanding extraordinary evidence), or contextual boundedness, but these often feel ad hoc.

  4.  **Action Guidance Failure / Normative Irrelevance:**
      *   **Problem:** EVF provides *no usable guidance* for any real-world decision. Calculating googolplex-level probabilities or comparing astronomical utilities is impossible. If a theory cannot guide action *in principle* for finite agents, its normative status is questionable.
      *   **Why Awkward?** Normative theories should ideally connect to practice. EVF severs this link entirely. Defenders must embrace a stark separation between "true" rationality (EVF) and practical deliberation (bounded proxies), raising questions about the point of the normative theory.
      *   **Defender Response:** Often concede this, arguing normative truth isn't defined by human cognitive limits. Bounded rationality is a *separate* problem. The cost is accepting a "true" rationality forever inaccessible.

  5.  **Moral Repugnance & Intuition Pump Failures:**
      *   **Problem:** Sacrificing any finite good (e.g., curing all current cancer) for a minuscule chance of preventing infinite suffering feels morally monstrous, not just counterintuitive. Intuition pumps vividly highlight this repugnance.
      *   **Why Awkward?** While intuitions aren't decisive, widespread, strong moral revulsion towards a theory's implications is significant evidence against it, especially in ethics. EVF requires systematically overriding deep-seated moral intuitions about proportionality and non-fanatical concern.
      *   **Defender Response:** Often bite the bullet, arguing common sense morality is mistaken when scaled up. This is a major cost requiring justification (e.g., analogies to scope neglect).

  6.  **Metanormative Instability:**
      *   **Problem:** Why should *expected value maximization* be the sacrosanct principle, especially when it leads to fanaticism? Alternatives exist (e.g., risk-weighted expected utility, rank-dependent utility, satisficing, maximin relative to a benchmark). Insisting on EV maximization *despite* fanaticism can seem like fetishizing a specific formalization.
      *   **Why Awkward?** It forces defenders into a defensive position where the core commitment (unbounded EV maximization) must be justified *over* alternative decision rules that avoid fanaticism without obvious arbitrariness. The justification often becomes circular or relies on intuitions EVF elsewhere overrides.
      *   **Defender Response:** Argue alternatives either sneak in bounds (arbitrary) or violate other core rational constraints (e.g., independence axioms). The debate hinges on which axioms are truly non-negotiable.

  ### III. Question-Begging or Misaimed Defeaters
  Common objections that defenders legitimately dismiss as missing the point:

  7.  **"We Can't Calculate/Practically Implement It":**
      *   **Why Question-Begging?** EVF explicitly addresses the *structure of rationality*, not implementation. This objection conflates normative theory with descriptive psychology or computational feasibility. Defenders readily concede impracticality but deem it irrelevant to normative truth.
  8.  **"It Leads to Absurd Choices (like ignoring a burning child)":**
      *   **Why Misaimed?** Defenders argue that in the real world, the probability of a genuinely fanatical payoff *outweighing* the immediate moral catastrophe is effectively zero or requires evidence beyond any reasonable credence. The objection relies on unrealistic/impossible scenarios or misapplies the theory to contexts where fanatical probabilities/utilities aren't credibly present. EVF doesn't demand ignoring *actual* certainties or high probabilities for *hypothetical* fanaticism.
  9.  **"Value Must Be Bounded Because X (e.g., neuroscience, physics)":**
      *   **Why Question-Begging?** This assumes a physicalist or naturalistic bound on value, which EVF explicitly rejects as unmotivated within normative decision/ethics theory. The defender argues value is a normative concept, not constrained by physical facts about brains or the universe. Imposing such a bound *is* the alternative position needing justification.

  ### IV. Empirical Unfalsifiability: Problem or Virtue?
  *   **The Charge:** EVF seems insulated from empirical disconfirmation. No real-world observation can refute it because it dominates only in realms of probability/value far beyond empirical access. Any failure to act fanatically can be attributed to our inability to access the relevant probabilities/utilities, not the theory's falsity.
  *   **Defender Response (Concession & Defense):**
      *   **Concession:** Defenders concede EVF is empirically unfalsifiable in the traditional sense. Its domain is the space of logically possible lotteries, most of which are inaccessible.
      *   **Defense:**
          1.  **Normative Expectation:** Normative theories (like logic, math) often aren't empirically falsifiable; their justification is conceptual/axiomatic. EVF's insulation is a feature, not a bug, of its normative nature.
          2.  **Cost of Alternatives:** The main argument *for* EVF is the perceived higher cost of the alternatives (arbitrary bounds or abandoning EV maximization). Insulation is the price paid to avoid those costs.
          3.  **Indirect Constraint:** While not falsifiable, EVF's *prescriptions* for accessible decisions must still cohere with broader normative commitments and avoid internal incoherence (like the decisive defeaters above). Its plausibility rests on its theoretical virtues within the normative domain.
  *   **Is it a Problem?** For those demanding normative theories be grounded in or constrained by empirical reality, yes. It risks making EVF an untethered formalism. For those prioritizing internal consistency and avoiding seemingly arbitrary constraints within the normative framework, the insulation is necessary and acceptable. The debate hinges on meta-normative views about the sources of justification.

  ### Key Takeaways from Defender Perspectives
  1.  **Decisive Costs Acknowledged:** Paralysis (Infinite Ethics problem) and dominance violations are recognized as severe, potentially fatal flaws requiring non-trivial solutions (e.g., domain restrictions, aggregation rules).
  2.  **Awkward Costs Embraced:** Practical irrelevance, vulnerability to mugging, and moral repugnance are often accepted as necessary prices to pay for avoiding what they see as the *greater* arbitrariness or irrationality of imposing bounds or abandoning EV maximization. They view the alternatives as having *worse* foundational problems.
  3.  **Core Justification:** The defense rests heavily on a negative argument: *Any* alternative (bounded utility, non-EV-maximizing rules) inevitably introduces an element that appears arbitrary or violates other seemingly fundamental axioms of rationality when scrutinized. EVF is seen as the only position that avoids *this* type of arbitrariness, even at the cost of counterintuitive implications.
  4.  **Role of Intuition:** Defenders often argue that our anti-fanatical intuitions result from evolved heuristics ill-suited to reasoning about extremes of scale, analogous to how naive physics intuitions fail at relativistic speeds.

  Your challenge is to weigh the genuine decisiveness of the incoherence/dominance problems against the defender's attempts to resolve them, and then to judge whether the significant awkward costs (repugnance, impracticality, mugging) are indeed a *lesser* evil than the perceived arbitrariness of the alternatives. The empirical unfalsifiability is likely a permanent feature, making the debate primarily one of theoretical virtue and meta-normative commitment.
