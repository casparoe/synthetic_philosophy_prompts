prompt: |-
  I'm a software engineer building decision-support tools, and I keep running into the concept of bounded rationality — in papers on human decision-making, in AI design, and in arguments about why satisficing beats optimizing. But the term seems to cover a lot of ground, and before I lean on it in my own work I want to know what a theory of bounded rationality actually has to deliver to count as adequate. Write the desiderata: what phenomena must it explain, what cases must it get right, what distinctions must it respect, and what results from psychology or computer science must it be consistent with? For each requirement, give the consideration or motivating case behind it, and flag which are non-negotiable and which are merely preferences of one research program. I am especially interested in whether any subset of these desiderata is jointly unsatisfiable — for instance, is there a tension between descriptive accuracy about human behavior and normative usefulness for designing better systems? If you can, briefly score the main approaches (Simon's satisficing, heuristics-and-biases, ecological rationality, rational inattention, and so on) against the list, but the requirements themselves are what I am after.
reasoning: |-
  Okay, the user is a software engineer building decision-support tools. They've encountered the concept of bounded rationality in various contexts—human decision-making papers, AI design, and arguments for satisficing over optimizing. They want to understand what makes a theory of bounded rationality adequate. Specifically, they're asking for desiderata: what such a theory must explain, which cases it should handle, distinctions to respect, and consistency requirements. They also want to know about potential tensions between desiderata, like descriptive accuracy versus normative usefulness.

  First, I need to outline the core requirements for a theory of bounded rationality. The user mentioned Simon's satisficing, heuristics-and-biases, ecological rationality, and rational inattention. Each of these approaches addresses different aspects. Simon focused on cognitive limits and satisficing. Heuristics-and-biases highlights systematic errors. Ecological rationality looks at how heuristics succeed in specific environments. Rational inattention deals with information costs. The desiderata should cover all these angles.

  The user's deeper need might be to ensure their decision-support tools are both realistic and effective. They need a theory that accurately models human behavior (descriptive) but also provides guidelines for improving decisions (normative). The tension between these two is crucial. For example, if a theory is too descriptive, it might not offer improvement strategies. If too normative, it might ignore how humans actually decide.

  Non-negotiable desiderata would include explaining cognitive limits and adaptation to the environment. These are foundational. Without them, the theory isn't about bounded rationality. Distinctions like satisficing vs. optimizing and heuristic vs. algorithmic are also key. Consistency with cognitive psychology and neuroscience is non-negotiable for credibility.

  Cases to handle: routine decisions, high-stakes choices under time pressure, and information overload scenarios. If a theory can't explain why someone uses a heuristic in a crisis, it's inadequate. Also, it must account for why satisficing works better than optimizing when resources are limited.

  Tensions arise between descriptive and normative goals. Heuristics-and-biases is strong descriptively but may not guide design. Ecological rationality bridges both by focusing on environment fit. Rational inattention is prescriptive but might miss emotional factors. The user needs to know which theories balance these aspects for their tools.

  Scoring the approaches: Simon's satisficing explains satisficing but misses biases. Heuristics-and-biases describes errors but not adaptive use. Ecological rationality shows when heuristics work, useful for tool design. Rational inattention is great for info costs but less on heuristics. Each has strengths and gaps.

  The user might also care about computational feasibility. Can the theory be implemented in their tools? Ecological rationality offers simple heuristics, which are easier to code. Rational inattention requires cost-benefit analysis, which might be complex. They need a theory that's both accurate and implementable.

  In summary, the theory must explain limits, adaptation, satisficing, handle key cases, respect distinctions, and be consistent with empirical data. Balancing descriptive and normative aspects is tricky, but ecological rationality and rational inattention offer paths. The user should consider hybrid approaches for their tools, leveraging strengths from each theory.
answer: |-
  Below is a structured set of desiderata for a theory of bounded rationality, categorized by what it **must explain**, **handle**, **respect**, and **be consistent with**. I've flagged non-negotiables (core to the concept) vs. preferences (specific research agendas), highlighted tensions, and provided brief scores for major approaches.

  ---

  ### **Core Desiderata for a Bounded Rationality Theory**

  #### **1. Must Explain: The Core Phenomenon of Cognitive/Resource Limits**
      - **Phenomenon**: Why agents *systematically* fail to optimize (e.g., ignore information, use shortcuts, settle for "good enough").
      - **Motivation**: Simon's original critique: humans lack unlimited computational power, time, and information. Optimization is often infeasible.
      - **Non-negotiable**: Any theory denying this ceases to be about *bounded* rationality.

  #### **2. Must Handle: Satisficing as a Core Strategy**
      - **Case**: Decisions where agents stop searching for alternatives upon finding one that meets an *aspiration level* (e.g., accepting a "decent" job offer).
      - **Motivation**: Ubiquitous in human behavior; explains how decisions are made under constraints without exhaustive search.
      - **Non-negotiable**: Central to Simon's definition; alternatives must be addressed.

  #### **3. Must Respect: The Distinction Between Optimizing vs. Satisficing**
      - **Why**: Optimizing requires global comparison; satisficing uses local thresholds. Confusing them misrepresents human cognition.
      - **Non-negotiable**: Blurring this undermines the theory's purpose.

  #### **4. Must Be Consistent With: Cognitive Psychology & Neuroscience**
      - **Key Results**: Working memory limits (Miller's Law), attention bottlenecks (e.g., inattentional blindness), fast/slow thinking (Kahneman's System 1/2).
      - **Motivation**: Bounded rationality must align with how brains actually process information.
      - **Non-negotiable**: Contradicting robust cognitive science invalidates the theory.

  ---

  ### **Critical Tensions & Trade-offs**
  - **Descriptive vs. Normative Tension**:  
    - *Conflict*: Theories accurate about human behavior (e.g., heuristics-and-biases) often highlight *errors*, making them poor guides for designing "better" systems. Normative theories (e.g., rational inattention) may prescribe optimal shortcuts but fail to describe actual human behavior.  
    - *Resolution*: Ecological rationality bridges this by showing heuristics *can* be optimal *in specific environments*, offering both descriptive and design insights.

  - **Accuracy vs. Tractability Trade-off**:  
    Explaining nuanced behavior (e.g., emotion-driven decisions) risks computational irrelevance. Highly tractable models (e.g., threshold rules) may oversimplify.

  ---

  ### **Additional Desiderata (Varying by Research Program)**

  #### **5. Must Explain: When and Why Heuristics Succeed or Fail**
      - **Phenomena**: Fast-and-frugal heuristics beating complex models in uncertain environments (e.g., recognition heuristic); biases like overconfidence or framing effects.
      - **Motivation**: Heuristics aren't universally "bad" — context determines performance.
      - **Preference**: Core to ecological rationality; less emphasized in rational inattention.

  #### **6. Must Handle: Adaptation to Environments**
      - **Case**: How agents learn aspiration levels (e.g., raising standards after repeated success) or switch heuristics based on feedback (e.g., reinforcement learning).
      - **Motivation**: Real-world agents adapt; static models are unrealistic.
      - **Preference**: Central to ecological rationality; implicit in Simon.

  #### **7. Must Respect: The Role of Information Costs**
      - **Distinction**: Rational ignorance (deliberately ignoring costly info) vs. cognitive inability to process available info.
      - **Motivation**: Critical for designing tools that reduce decision costs (e.g., automated filtering).
      - **Preference**: Core to rational inattention; background in others.

  #### **8. Must Be Consistent With: Behavioral Economics Results**
      - **Key Results**: Prospect theory (loss aversion), hyperbolic discounting, endowment effect.
      - **Motivation**: Bounded rationality must explain why deviations from neoclassical norms *persist*.
      - **Preference**: Vital for heuristics-and-biases; ecological rationality addresses some (e.g., via environmental mismatch).

  #### **9. Must Handle: Scalability to Complex, Dynamic Systems**
      - **Case**: Decisions in multi-agent systems (e.g., markets) or under changing rules (e.g., policy shifts).
      - **Motivation**: Tools must support real-world dynamism, not just lab experiments.
      - **Preference**: Often implicit; explicit in computational models like agent-based simulations.

  #### **10. Must Respect: The Designer's vs. User's Perspective**
      - **Distinction**: A theory should guide *designing tools for boundedly rational users* without assuming users will optimize the tool's output.
      - **Motivation**: Tools fail when they ignore users' cognitive constraints (e.g., overwhelming dashboards).
      - **Non-negotiable for applied work**.

  ---

  ### **Scoring Major Approaches**
  *(✓ = Strong, ~ = Mixed, ✗ = Weak)*

  | **Approach**              | **Cognitive Limits** | **Satisficing** | **Heuristic Success/Failure** | **Adaptation** | **Info Costs** | **Behavioral Consistency** | **Normative Use** |
  |---------------------------|----------------------|-----------------|-------------------------------|----------------|----------------|----------------------------|-------------------|
  | **Simon's Satisficing**   | ✓✓✓                  | ✓✓✓             | ✗                             | ~              | ~              | ~                          | ~                |
  | **Heuristics-and-Biases** | ✓✓✓                  | ~               | ✗ (focuses on failures)       | ✗              | ✗              | ✓✓✓                        | ✗                |
  | **Ecological Rationality**| ✓✓                   | ✓✓              | ✓✓✓                           | ✓✓             | ~              | ✓                          | ✓✓✓              |
  | **Rational Inattention**  | ✓✓ (via costs)       | ~               | ✗                             | ✗              | ✓✓✓            | ✗                          | ✓✓✓              |
  | **Computational Models**  | ✓✓✓                  | ✓               | ~                             | ✓✓             | ~              | ~                          | ✓✓               |

  - **Key Takeaways**:
    - **Simon**: Foundational but underspecified on *which* heuristics and *when*.
    - **Heuristics-and-Biases**: Strong descriptively, weak normatively (portrays heuristics as flaws).
    - **Ecological Rationality**: Best at bridging descriptive/normative gap via environment-heuristic fit.
    - **Rational Inattention**: Normatively powerful for info-sensitive domains (e.g., UI design), but ignores psychology.
    - **Hybrid Needed**: No single theory satisfies all desiderata. For tool design, **ecological rationality + rational inattention** offers the strongest foundation.

  ---

  ### **Non-Negotiable vs. Preferences Summary**
  - **Non-Negotiables**: Explain resource limits, handle satisficing, respect satisficing/optimizing distinction, align with cognitive science.
  - **Preferences**: Explaining heuristic ecology (ecological rationality), formal info costs (rational inattention), or cataloging biases (heuristics-and-biases).

  For your work, prioritize theories that **respect cognitive limits while offering design prescriptions** (ecological rationality excels here). The tension between descriptive accuracy and normative power is real but surmountable by focusing on *environments* where simple rules outperform complex optimization—a key insight for building effective decision-support tools.
