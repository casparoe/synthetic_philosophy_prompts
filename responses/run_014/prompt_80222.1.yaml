answer: |-
  Here’s a brutally honest ranking of objections to Solomonoff induction (SI) and Kolmogorov complexity (K) as the "right" formalization of Occam’s razor, from most to least fatal. I’ll flag which objections defenders explicitly acknowledge and which they downplay or reframe:

  ### **Fatal Defeaters (If True)**
  1. **The Computability Assumption in Optimality Proofs**  
     - **The Objection**: SI’s celebrated *asymptotic optimality* (merging of beliefs with true data) **assumes the environment is computable**. If reality contains uncomputable elements (e.g., true randomness, hypercomputational processes), SI fails *in principle* — it can’t even converge to the truth in the limit.  
     - **Why Fatal**: Undermines the core promise of SI as a "gold standard" for inference. If the universe isn’t computable, SI isn’t just impractical — it’s *wrong*.  
     - **Defender Response**:  
       - *Owns up?* **Yes, explicitly**. Proponents (e.g., Hutter) concede this.  
       - *Rebuttal*: "No evidence suggests uncomputable physics exists; Occam’s razor favors computable hypotheses." Still, this is a fatal *conditional* flaw.

  ### **Deeply Problematic (Philosophically Awkward)**
  2. **Kolmogorov Simplicity ≠ Scientific Simplicity**  
     - **The Objection**: K-complexity is **orthogonal to human scientific "simplicity"**. A 3-line regex can encode noise indistinguishable from randomness (high K), while a 10,000-line program for Newtonian mechanics has low K. Scientists prefer *compressible patterns* (e.g., smooth functions, symmetries), but K rewards *any* short program — even one outputting "random"-looking data if concisely specified.  
     - **Why Problematic**: Makes SI’s "simplicity prior" scientifically alien. A K-simple hypothesis may be a chaotic, uninterpretable program with no resemblance to scientific models.  
     - **Defender Response**:  
       - *Owns up?* **Grudgingly, but reframes it**. Acknowledges the mismatch, but argues:  
         - Science *is* about compression (low K is the *only* rigorization of "simplicity").  
         - Human simplicity is psychological, not epistemic.  
         - SI *would* favor Newton over noise *if Newton has lower K*.  
       - **Concession**: K-simplicity doesn’t align with *procedural* simplicity (e.g., few parameters) or intelligibility.

  ### **Technically Awkward (Managed but Not Solved)**
  3. **The Universal Prior is a Semimeasure**  
     - **The Objection**: The Solomonoff prior (M) sums to **< 1** over all infinite sequences (a semimeasure). This implies SI assigns positive probability to the possibility that **computation halts prematurely** (i.e., "no more data"), which is ontologically strange.  
     - **Why Awkward**: Forces an inelegant renormalization in practice. Also suggests SI embeds a metaphysical bias toward "computations ending."  
     - **Defender Response**:  
       - *Owns up?* **Explicitly, but dismisses severity**.  
       - *Rebuttal*: "It’s still a *semicomputable* semimeasure — the best possible. Renormalization doesn’t break asymptotic properties." Seen as a technical footnote, not a conceptual flaw.

  4. **Non-Invariance of K Under UTM Choice**  
     - **The Objection**: K depends on the choice of Universal Turing Machine (UTM). While *asymptotically* equivalent (O(1) difference), **for finite data, simplicity rankings can flip** based on UTM.  
     - **Why Awkward**: Undermines "objective" simplicity. Two rational agents with different UTMs could have opposite priors.  
     - **Defender Response**:  
       - *Owns up?* **Acknowledges, but minimizes**. Argues:  
         - Asymptotic results (e.g., optimality) are UTM-invariant.  
         - For finite data, *all* methods depend on subjective choices (e.g., language for Bayes).  
         - Fix a "natural" UTM (e.g., x86) as a reference.  
       - **Cost**: Makes SI less "absolute" than it appears — but defenders see this as unavoidable.

  ### **Defender Ranking of Severity**
  Proponents of SI/K-complexity would rank these as:  
  1. **Computability Assumption**: A legitimate, explicit limitation.  
  2. **Semimeasure Issue**: A technical annoyance with workarounds.  
  3. **UTM-Dependence**: A quirk of finite inference, not unique to SI.  
  4. **Simplicity Mismatch**: Not a bug — it *corrects* human intuitions.  

  ### **The Unspoken Tension**
  The deepest objection isn’t on your list: **SI trivializes epistemology**. It assumes all knowledge reduces to binary sequence prediction via Turing machines. But science involves causal explanation, intervention, and abstract laws — none of which SI *naturally* captures. Defenders retort: "If it’s *possible* to know, SI learns it." Yet this feels like formalizing inference by assuming away its hardest parts.

  **Bottom line**: If you grant a computable universe, SI survives — but its "simplicity" is alien, and its elegance is asymptotic. The fatal flaw is buried in the premise: *Is reality a computable sequence?* If not, SI collapses. If it is, SI reigns — awkwardly.
