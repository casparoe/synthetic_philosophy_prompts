  I keep landing on the view that Solomonoff induction is the right way to formalize idealized inference and Kolmogorov complexity is the right notion of simplicity, so that Occam's razor just collapses into 'shorter programs get higher prior.' I know it's uncomputable and I'm fine treating it as a limit case, so skip that. What would actually count against it? I want the objections a committed algorithmic-information person would concede, not the ones they'd wave away: does the fact that the universal prior is only a semimeasure actually bite, what does the non-invariance of K under the choice of universal machine really cost, does the assymptotic optimality result quietly assume the environment is computable, and does the razor-as-prior story survive the fact that Kolmogorov 'simple' is basicly orthogonal to 'simple' the way a scientist means it? Rank the defeaters from fatal to just awkward, and say which of these the defenders would themselves own up to.
