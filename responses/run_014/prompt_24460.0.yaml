prompt: |-
  ok so i'm a third-year phd student in epistemology and my advisor suggested i work on moral testimony for my dissertation -- specifically the question of whether moral testimony can be a source of moral knowledge as opposed to just moral belief. i've got about two and a half years before i need to defend and my background is more in social epistemology than metaethics so i'm a little lost in the weeds already. there's a bunch of sub-questions in play: the tranmission problem (does moral knowledge via testimony transmit practical reasons or does the chain break at the testimonial link?), the balance-of-reasons question (do i inherit the expert's reasons or do i just have the meta-reason that they said so?), whether moral expertise even exists in the relevant sense (is it more like scientific expertise or more like aesthetic connoisseurship?), and a few others i probably haven't thought of. which of these do you think is most worth working on first and why? i want a defended ordering not a survey: for each, explain why it's upstream or downstream of the others, how tracable it is for someone without a deep metaethics background, and what a positive or negative result would actually look like. also flag if you think i'm framing the whole thing wrong and the real question is something else entirely. think very carefully before answering. respond in the style of an expert epistemologist advising a junior colleague over coffee.
reasoning: |-
  Okay, let me approach this like an advisor guiding a junior colleague through dissertation planning. The student is a third-year PhD in epistemology working on moral testimony, specifically whether it can yield moral knowledge rather than just belief. They're feeling lost among several sub-questions and need a prioritized research sequence.

  First, I need to understand their situation: they have 2.5 years until defense, with background in social epistemology rather than metaethics. Their key sub-questions are:
  - Transmission problem (practical reasons via testimony)
  - Balance-of-reasons (inheriting vs. meta-reasons)
  - Nature of moral expertise (scientific vs. aesthetic model)
  - Others they haven't considered

  The core request is for a defended ordering that explains:
  1. Upstream/downstream relationships between questions
  2. Tractability without deep metaethics background
  3. What positive/negative results would look like
  4. Potential reframing if necessary

  I should start by identifying the most foundational issue. The nature of moral expertise seems upstream because:
  - It determines whether testimony can transmit knowledge at all
  - Different expertise models imply different transmission mechanisms
  - Resolving this avoids presuppositions in other debates

  For tractability, the expertise question can be handled through conceptual analysis and analogical reasoning (science vs. aesthetics) without requiring heavy metaethics. A positive result would be establishing moral expertise exists in a testimonial-relevant sense; negative would show it's categorically impossible.

  Next priority is the transmission problem, as it directly builds on expertise. If expertise exists, we can ask whether knowledge transmission includes practical reasons. This is downstream but central to the knowledge/belief distinction. Tractability is moderate - requires engaging with practical reason literature but avoids deepest metaethics. Positive result shows transmission preserves action-guiding force; negative reveals a break requiring first-person engagement.

  The balance-of-reasons question should come last as it's most metaethically loaded. Whether we inherit reasons depends on internalism/externalism debates and requires heavy lifting in reasons theory. It's downstream of transmission - if reasons don't transmit at all, inheritance is moot. Tractability is lowest for their background; positive result would show testimonial knowledge provides identical reasons as direct knowledge.

  Important framing note: They're right to focus on knowledge vs. mere belief, but the transmission of practical authority is the real pivot. The core question isn't just "can we know" but "can testimonial moral knowledge play the same functional role as direct moral knowledge?" This reframe connects epistemology to moral philosophy's action-guiding concerns.

  Additional considerations:
  - Should flag the non-identity problem (Hopkins) as it bridges expertise and transmission
  - Might suggest starting with aesthetic testimony literature as a model
  - Should emphasize building metaethics competence gradually through focused reading

  The proposed sequence creates a natural dissertation arc: establish expertise exists → show it transmits knowledge with practical force → then address reasons-inheritance. This gives solid grounding before tackling more contentious issues.
answer: |-
  Right, I see where you are. Moral testimony is a fantastic choice—right at the knife-edge of social and moral epistemology. I’ve advised three dissertations on adjacent topics, and the key is *ordering*. You’re juggling live wires, but some must be handled first or they’ll short-circuit the others. Let’s break this down with your constraints: **tractability without deep metaethics**, **upstream/downstream dependencies**, and **actionable results**. I’ll give you a defended sequence, then flag a framing tweak.

  ### Core Sequence: Start Here, Build Outward
  1. **The Nature of Moral Expertise**  
     *Why upstream?* This is the bedrock. If moral expertise doesn’t exist in a testimonial-relevant sense, *all other questions evaporate*. You can’t transmit nonexistent knowledge, inherit nonexistent reasons, or debate balance-of-reasons without agents who qualify as experts. It’s logically prior.  
     *Tractability:* High for your background. Leverage social epistemology (Goldman on experts, Zagzebski on epistemic authority) and analogical reasoning (science vs. aesthetics). Avoid diving into moral realism/anti-realism by focusing on *functional* expertise: What would make someone a reliable moral testifier?  
     *Positive Result:* Moral expertise resembles scientific expertise in key ways (e.g., trackable reliability, corrigible methods).  
     *Negative Result:* Moral expertise is purely aesthetic (idiosyncratic, non-generalizable) or impossible (e.g., no shared "moral facts" to track).  
     *Why first?* A negative result here ends the project early (saving you years!), but a positive result scaffolds everything else.  

  2. **The Transmission Problem**  
     *Why next?* If expertise exists, *can it transmit not just belief but knowledge with practical force?* This is the core of your "knowledge vs. belief" question. If transmission fails, "balance-of-reasons" is moot—you’d only have inert belief.  
     *Tractability:* Moderate. Focus on epistemology of testimony (Fricker, Lackey) and practical reason (Setiya, Raz). Sidestep deep metaethics by treating "practical reasons" procedurally: Does moral testimony generate *action-guiding commitments* for the hearer?  
     *Positive Result:* Moral testimony transmits knowledge *and* its practical force (e.g., you inherit an obligation to φ if the expert testifies "you must φ").  
     *Negative Result:* Testimony transmits belief/knowledge but *severs* practical force (e.g., "I know stealing is wrong via testimony, but I need my *own* reason not to steal").  
     *Dependency:* Requires a prior account of expertise. If expertise is aesthetic-like, transmission likely fails (you can’t "delegate" taste).  

  3. **Balance-of-Reasons**  
     *Why last?* This is downstream and metaethics-heavy. If transmission succeeds, *how* do the expert’s reasons become yours? If transmission fails, this question doesn’t arise.  
     *Tractability:* Low for you now. Requires grappling with moral psychology (internalism/externalism) and reason-theory (Parfit, Scanlon). Start with simpler cases: testimonial knowledge in medicine (inheriting evidence) vs. law (inheriting authority).  
     *Positive Result:* Testimony transfers the expert’s *first-order reasons* (e.g., their evidence for φ’s wrongness becomes your reason).  
     *Negative Result:* You only gain a *meta-reason* ("they’re reliable, so I should φ"), leaving a gap between knowledge and motivation.  
     *Dependency:* Presupposes expertise and successful transmission.  

  ### Framing Check: A Crucial Tweak
  You’re framing this as "moral testimony as a *source* of knowledge," but the real pivot is **whether testimonial moral knowledge *preserves the functional role* of moral knowledge**. Moral knowledge is typically seen as *necessarily action-guiding*. So the burning question is:  
  > **Can moral testimony yield knowledge that *directly* engages practical reason, or does it produce a "detached" cognitive state?**  

  This reframe centers your project on the *practicality* of moral knowledge—which is why the transmission problem is your linchpin. If you solve that, the dissertation writes itself.  

  ### Strategic Advice
  - **Month 1–6:** Hammer expertise. Start with the aesthetic analogy (Hills, McGonigal) vs. scientific (Sliwa, Enoch). If you conclusively show expertise is impossible, pivot to *why* this is so—it’s still a dissertation.  
  - **Key Bridge:** Read **Robert Hopkins** on moral testimony and the "non-identity problem"—he links expertise to transmission cleanly.  
  - **Metaethics Lite:** Scan Copp’s *Morality in a Natural World* for a naturalist take, or Dancy’s *Moral Reasons* for reasons-focused work. Don’t get bogged down in realism/expressivism wars.  
  - **Endgame:** A negative transmission result + positive expertise result is *more* publishable than all-positive. It forces a hard question: "Why does moral knowledge resist testimony when other domains don’t?"  

  You’re not lost—you’ve mapped the jungle. Start with expertise because it’s the tide: if it’s out, the boats (transmission, reasons) can’t float. If it’s in, sail to transmission. And reframe around practicality; that’s where epistemology and ethics meet explosively. Now, go refill your coffee—and draft that expertise chapter by Friday.  

  *PS: If your advisor pushes back on sequencing, ask them: "Should I assume moral expertise exists, or prove it first?" That usually settles it.*
