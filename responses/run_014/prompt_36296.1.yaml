  Note: Some branches might be rare (like the moral illusion view), and some views might be placed in multiple leaves (like the threshold view appearing in different branches). Also, the tree may not perfectly capture every nuance, but it is built from case judgments.

  We also note that the tree might not distinguish between the threshold view and the splitter view in some cases, but the questions are designed to pull apart the main positions.

  Finally, we advise the novelist to test the tree with the cases and see if it sorts the group members as expected.
