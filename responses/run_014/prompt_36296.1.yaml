  Below is a decision tree designed to sort ethical positions on your kidney donation case (and related scenarios) based on concrete judgments rather than labels. It starts from the shared intuition that donating the kidney was *good*, then branches on diagnostic questions where views genuinely diverge. The tree is built from logical space first, with named positions mapped to the leaves afterward. Each node uses plain English and real cases from your book (kidney donation, grenade jump, panhandler) to keep it grounded. Contested philosophical questions (e.g., the link between praiseworthiness and duty) are explicitly flagged at nodes. Leaves include all requested views, and I've noted where the tree might be "blunt" (i.e., unable to distinguish certain views).

  ---

  ### **Moral Decision Tree: The Kidney Donation & Beyond**
  *Start here. Answer each question based on your intuitive judgments about the cases. Use the specific scenarios provided.*

  #### **Case 1: The Kidney Donation**  
  *A healthy woman in her late 50s donates a kidney to a stranger met online. Surgery has a 0.1% death risk. Her daughter feels betrayed, believing she chose a stranger over family. You all agree the act was "good."*  

  #### **Case 2: The Grenade Jump**  
  *A soldier jumps on a live grenade to save 5 comrades, with a 99% death risk. (A backstory event in your book.)*  

  #### **Case 3: The Panhandler**  
  *Your protagonist walks past a panhandler while late for a dialysis appointment. Helping would cost $5 and 2 minutes, but she omits it to avoid being late.*  

  ---

  ### **THE TREE**  
  **Start at Question 1.**

  #### **Question 1: Blame for Omission in Kidney Case**  
  *Is it morally **blameworthy** for someone (healthy, low-risk surgery) to **decline** donating the kidney to the stranger?*  
  - **YES** → Go to Question 2A  
  - **NO** → Go to Question 2B  

  *(Note: This tests whether the act is seen as "optional." Positions split here: Singer-ish views often say "YES," while others say "NO.")*  

  ---

  #### **Question 2A (If "YES" to Q1): Cost Threshold Test**  
  *Would it **still be blameworthy** to decline if the surgery had a **5% death risk** (not 0.1%)?*  
  - **YES** → Go to Question 3A  
  - **NO** → **Leaf: THRESHOLD VIEW**  

  **Explanation of Leaf: THRESHOLD VIEW**  
  - Obligation exists only below a cost ceiling (e.g., low risk = duty, high risk = optional).  
  - **Kidney Case (5% risk):** Not blameworthy to omit (cost too high).  
  - **Grenade Case:** Not blameworthy to omit (extreme cost).  
  - **Panhandler Case:** Likely blameworthy to omit (low cost).  
  - *Named positions:* Moderate utilitarians, cost-sensitive deontologists.  
  - *Contested:* Where the threshold lies (morality vs. psychology).  

  ---

  #### **Question 3A (If "YES" to Q2A): Praise Without Exceeding Duty?**  
  *Can an act be **morally praiseworthy** even if it is **merely fulfilling a duty** (i.e., required and blameworthy to omit)?*  
  - **YES** → **Leaf: SINGER-ISH DENIAL**  
  - **NO** → **Leaf: DUTY-OR-PRAISE COLLAPSE**  

  **Explanation of Leaves:**  
  - **SINGER-ISH DENIAL:**  
    - Supererogation is an illusion. If net good > net harm, it’s a duty (blameworthy to omit). Praise is possible for fulfilling duties.  
    - **Kidney Case (0.1% risk):** Blameworthy to omit.  
    - **Grenade Case:** Blameworthy *not* to jump (if net lives saved > 1).  
    - **Panhandler Case:** Blameworthy to omit (low cost, high good).  
    - *Named positions:* Hardline utilitarianism (à la Singer), effective altruism.  
  - **DUTY-OR-PRAISE COLLAPSE:**  
    - No distinct supererogatory category. Acts are either duties (blameworthy to omit, not praiseworthy) or neutral/permissible.  
    - **Kidney/Grenade Cases:** Praiseworthiness implies it *wasn’t* a duty (but you said omission is blameworthy—contradiction likely).  
    - *Rare view; flags inconsistency in judgments.*  

  ---

  #### **Question 2B (If "NO" to Q1): Blame in Panhandler Case**  
  *In the **Panhandler Case**, is it morally **blameworthy** to walk past without helping?*  
  - **YES** → Go to Question 3B  
  - **NO** → Go to Question 4  

  *(Note: Tests if low-cost help is seen as obligatory. Splits "latitude" views from classic supererogation.)*  

  ---

  #### **Question 3B (If "YES" to Q2B): Grenade as Duty?**  
  *In the **Grenade Case**, is it **blameworthy** to **not jump** on the grenade?*  
  - **YES** → **Leaf: SPLITTER VIEW (Duty in Extremes)**  
  - **NO** → **Leaf: KANTIAN LATITUDE**  

  **Explanation of Leaves:**  
  - **SPLITTER VIEW (Duty in Extremes):**  
    - "Supererogation" wrongly lumps different acts. Kidney donation (routine sacrifice) is optional; grenade jumps (heroic emergencies) are duties.  
    - **Kidney Case:** *Not* blameworthy to omit (optional).  
    - **Grenade Case:** Blameworthy to omit (duty in crisis).  
    - **Panhandler Case:** Blameworthy to omit (low cost = duty).  
    - *Named positions:* Role-based deontologists (e.g., soldiers "owe" sacrifice), emergency-obsessed theorists.  
  - **KANTIAN LATITUDE:**  
    - Duties are "wide" and imperfect (e.g., "help others" allows discretion). "Beyond the call" means choosing strenuous fulfillment of a duty.  
    - **Kidney/Panhandler Cases:** Not blameworthy to omit (discretion allowed), but donating/helping is praiseworthy.  
    - **Grenade Case:** Praiseworthy but not required (cost exceeds reasonable discretion).  
    - *Named positions:* Kantians, rule-utilitarians with flexibility.  

  ---

  #### **Question 4 (If "NO" to Q2B): Praise in Kidney Case**  
  *Is donating the kidney **morally praiseworthy**?*  
  - **YES** → Go to Question 5  
  - **NO** → **Leaf: MORAL ILLUSION**  

  **Explanation of Leaf: MORAL ILLUSION**  
  - Only three categories: duties (blame omissible), permissions (blameless), excuses (exemptions). No "praiseworthy" beyond this.  
  - **Kidney/Grenade Cases:** Permissible but not praiseworthy (just "good").  
  - **Panhandler Case:** Permissible to omit.  
  - *Named positions:* Austere meta-ethicists, Hobbesian minimalists.  

  ---

  #### **Question 5 (If "YES" to Q4): Praise Requires Exceeding Duty?**  
  *Does the **praiseworthiness** of the kidney donation **depend on it exceeding a duty**? (i.e., If it were a duty, would it lose its praiseworthiness?)*  
  - **YES** → **Leaf: CLASSIC SUPEREROGATION**  
  - **NO** → **Leaf: SPLITTER VIEW (Praise Without Duty)**  

  **Explanation of Leaves:**  
  - **CLASSIC SUPEREROGATION:**  
    - Supererogation is a fourth category: optional, good, praiseworthy to do, blameless to omit.  
    - **Kidney/Grenade Cases:** Praiseworthy but blameless to omit.  
    - **Panhandler Case:** Blameless to omit (low cost ≠ duty).  
    - *Named positions:* Standard ethics textbooks, moderate deontologists.  
  - **SPLITTER VIEW (Praise Without Duty):**  
    - Kidney donation (personal sacrifice) is praiseworthy but optional; grenade jumps (supreme sacrifice) are in a separate, "heroic" category.  
    - **Kidney Case:** Praiseworthy, not a duty.  
    - **Grenade Case:** *Also* praiseworthy, but may see it as qualitatively "beyond" kidney donation.  
    - **Panhandler Case:** Not praiseworthy, not a duty.  
    - *Named positions:* Phenomenological splitters (e.g., David Heyd).  

  ---

  ### **Key Notes on Ambiguities & Blunt Edges**  
  1. **Kantian Latitude vs. Classic Supererogation:**  
     - The tree *might* conflate these if users judge "praiseworthiness without exceeding duty" differently (Q5). In practice, Kantians often see supererogation as *part* of duty, while classic views see it *beyond* duty.  

  2. **Singer-ish vs. Threshold:**  
     - Q2A cleanly splits them: Threshold views always say "NO" to blame at high cost (5% risk). Singer-ish views say "YES."  

  3. **Moral Illusion vs. Other "NO Praise" Views:**  
     - Moral Illusion (Q4→NO) denies praise as a moral category. Others might deny praise for other reasons (e.g., "not effortful").  

  4. **Panhandler as Litmus Test:**  
     - Only Singer-ish and Threshold views call omitting low-cost help (panhandler) *blameworthy*. Others permit it.  

  5. **Grenade Disagreements:**  
     - Splitters see it as a duty (Q3B→YES); others don’t. Classic/Kantian views see it as praiseworthy but optional.  

  ---

  ### **How to Use This Tree**  
  1. **Print and distribute** at your session.  
  2. **Have each member work through the tree silently**, answering questions for all three cases.  
  3. **Compare leaves**—this exposes whether disagreements are about labels or core judgments.  
  4. **Flag blunt edges:** If two members reach the same leaf but still disagree, note where the tree is too coarse (e.g., Q5’s contested link between praise and duty).  

  This tree prioritizes your diagnostic goals: it starts concrete, avoids jargon, and forces positions to reveal themselves through cases. It won’t resolve every philosophical nuance, but it will map the battlefield—and maybe spare you a fourth session of talking past each other. Good luck!
