answer: |-
  ## Research Proposal: Wellbeing Shape and the Repugnant Conclusion in Population Axiology

  **1. The question, stated precisely**
  This research asks whether incorporating the *within-life temporal distribution of wellbeing* – specifically, the variance, presence of peaks, and pattern of highs and lows – into population axiology can provide a principled escape route from the repugnant conclusion that avoids the pitfalls of existing alternatives. Can an axiology that values not just the *total* wellbeing within a life, but also its *shape*, coherently reject the repugnance of a world containing trillions of lives barely worth living, while also avoiding equally repugnant or counterintuitive implications elsewhere, and retain sufficient comparability and decision-guiding power for practical application?

  **2. Why the existing debate leaves it open**
  The repugnant conclusion starkly exposes the tension between our intuitions: valuing total wellbeing implies accepting the vast, barely-positive population (Z), while valuing average wellbeing avoids Z but rejects intuitively better worlds where adding good lives decreases the average. Person-affecting views struggle to explain the value of bringing new, worthwhile lives into existence at all. Critical-level theories, adding a positive wellbeing threshold a life must exceed to count positively, avoid Z but face the "sadistic conclusion" where adding lives *below* the critical level but *above* zero can be worse than adding lives *far below* zero, violating strong intuitions. Lexical-threshold views, where lives above a very high wellbeing level are infinitely more valuable, avoid Z but seem arbitrary, struggle with spectrum cases (is a life just below the threshold infinitely worse than one just above?), and potentially undervalue large benefits below the threshold. The impossibility theorems formalize this dilemma: they prove no axiology satisfying a small set of seemingly reasonable conditions (like avoiding the repugnant conclusion and the sadistic conclusion, or respecting Pareto principles) can exist. Crucially, *all* these established escape routes and the constraints defined by the impossibility results focus exclusively on aggregate wellbeing measures *between* lives (totals, averages, critical levels, thresholds) or on the identity of affected individuals. None interrogate the internal *structure* or *temporal pattern* of wellbeing *within* a single life as a relevant factor for evaluating population outcomes. The debate implicitly assumes that only the net sum of momentary wellbeing across a life matters, overlooking the possibility that *how* that sum is achieved – through sustained mediocrity, profound suffering offset by ecstasy, or consistent mild contentment – might influence its moral weight in population comparisons. This within-life dimension remains unexplored territory in formal axiology.

  **3. Approach**
  This research will develop and evaluate novel population axiologies explicitly sensitive to the temporal distribution of wellbeing within lives, testing their ability to navigate the repugnant conclusion and related paradoxes.

  *   **Month 1: Formalizing Wellbeing Shape:** The primary task is to rigorously define the properties of wellbeing distribution within a life relevant to axiology. Key concepts requiring formalization include:
      *   *Variance:* Capturing the spread of wellbeing levels over time (e.g., a life fluctuating wildly vs. one of stable contentment).
      *   *Peak Presence/Height:* Formalizing the existence and magnitude of significant positive wellbeing episodes.
      *   *Trough Depth/Avoidance:* Formalizing the existence and severity of significant negative episodes.
      *   *Pattern Recognition:* Defining metrics for sequences (e.g., prolonged suffering followed by redemption vs. consistent mild positivity). This involves adapting tools from time-series analysis or developing bespoke mathematical representations of wellbeing trajectories, moving beyond the simple scalar sum.

  *   **Month 2: Developing Candidate Shape-Sensitive Axiologies:** Building on the formalizations from Month 1, I will construct specific axiologies incorporating wellbeing shape. Potential candidates include:
      *   *Peak-Weighted Totalism:* Modifying totalism by weighting moments of high wellbeing more heavily than moments of low wellbeing (or vice versa) in the sum.
      *   *Variance-Adjusted Totals:* Applying a penalty or bonus to the total sum based on the variance (e.g., penalizing high variance due to deep troughs, or rewarding it due to high peaks).
      *   *Trough-Avoidance Prioritization:* Axiologies where the primary goal is minimizing the existence or depth of negative wellbeing troughs across the population, with positive peaks contributing secondary value.
      *   *Minimum Episode Guarantees:* Views requiring, for a life to count positively, not just a net positive total, but the presence of at least one episode exceeding a certain wellbeing threshold (a "meaningful peak").
      *   *Lexicality within Lives:* Views where achieving a certain peak wellbeing level within a life makes that life lexically superior to lives lacking such a peak, regardless of total sum. Each candidate will be defined with precise aggregation rules for comparing populations.

  *   **Month 3: Testing Against Adequacy Constraints:** Each candidate axiology will be rigorously tested against established adequacy conditions and impossibility results to assess viability:
      *   *Repugnant Conclusion:* Does it avoid endorsing Z over A? Under what interpretations of "barely worth living"?
      *   *Other Paradoxes:* Does it avoid the Sadistic Conclusion? Does it respect plausible Pareto principles (e.g., if everyone is better off, the outcome is better)? Does it handle the Mere Addition Paradox and Non-Identity Problem coherently?
      *   *Impossibility Constraints:* Which of the standard conditions used in impossibility theorems (e.g., Non-Anti-Egalitarianism, General Non-Extreme Priority) does the axiology satisfy or violate? Can it satisfy the core intuitions behind avoiding the Repugnant and Sadistic Conclusions without falling foul of these theorems?
      *   *Novel Repugnance:* Does it generate new, potentially repugnant implications specific to its shape-sensitivity (e.g., preferring a world with few lives consisting solely of one ecstatic moment)?

  **4. What a result would look like**
  *   **Success Case:** The ideal outcome is a shape-sensitive axiology that demonstrably rejects the repugnant conclusion when "barely worth living" implies a *uniformly* drab life lacking significant positive peaks, while potentially accepting it (or finding it less repugnant) if "barely worth living" describes a life with significant highs compensating for lows. Crucially, this axiology must achieve this without violating other strong, independent intuitions captured by adequacy conditions (e.g., avoiding the sadistic conclusion, respecting Pareto improvements). It would offer a principled distinction grounded in the qualitative experience within a life, not an arbitrary threshold or aggregation rule.
  *   **Instructive Failure Case:** A likely alternative outcome is that shape-sensitivity, while modifying the repugnant conclusion, generates its own counterintuitive implications. For example, an axiology heavily weighting peaks might endorse a "World of Spikes": a vast population whose lives consist of one intensely ecstatic moment surrounded by neutral or mildly negative existence, judged superior to a smaller population with high, sustained wellbeing. This "Ecstatic Repugnance" would be philosophically revealing, demonstrating that shifting focus to within-life distribution doesn't eliminate difficult trade-offs but relocates them. It would force a deeper discussion about what truly constitutes a life "worth adding" – is it the net sum, the peak experience, the lack of deep suffering, or something else?

  **5. Failure conditions and scope**
  The primary failure condition is that no compelling, independently motivated principle for incorporating wellbeing shape is found. The strongest objection – that shape-sensitivity is ad hoc unless justified beyond its convenient conclusion – must be confronted head-on. Success requires finding motivations rooted in theories of wellbeing (e.g., peak-end rule, the importance of narrative unity, the disvalue of suffering intensity) or decision theory under uncertainty. A related risk is that formalization proves intractable or yields only complex, impractical models. Three months part-time is sufficient for a robust exploration: formalizing key shape concepts (Month 1), building and sketching implications of 2-3 core axiologies (Month 2), and testing them against the repugnant conclusion and 1-2 other major paradoxes/impossibility constraints (Month 3). However, it will *not* allow for: 1) Comprehensive testing against *all* known impossibility theorems and paradoxes; 2) Developing fully worked-out numerical models for grantmaking; 3) Deep engagement with the metaphysics of personal identity over time which underpins the "shape" concept. The focus will be on establishing the philosophical viability and core implications of the approach, not producing a finalized decision algorithm.

  **6. Why this matters for grantmaking**
  Our foundation allocates millions to improve lives. The repugnant conclusion isn't abstract; it directly challenges how we compare interventions. Funding a deworming program benefiting a million children slightly (marginally improving health, slightly boosting school attendance) versus funding a fewer life-saving surgeries represents exactly the trade-off between many small benefits and fewer large ones. If our cost-effectiveness model implicitly endorses the logic leading to the repugnant world Z, it may systematically undervalue interventions creating profound, life-changing impacts for individuals. Conversely, if we reject totalism without a principled alternative, we risk undervaluing highly scalable interventions delivering modest but widespread gains. This research probes whether the *kind* of benefit matters – not just its size and number. Does creating a life with moments of significant joy or relief hold different weight than creating a life of unbroken, minimal contentment, even if the totals are equal? The answer shapes real choices: should we prioritize preventing deep suffering, enabling peak experiences, or maximizing uniform contentment? Developing a more nuanced ethical framework strengthens the justification for our funding priorities and ensures our model aligns with deeper values about what makes a life genuinely better.**
