  They want to know if any requirements are jointly unsatisfiable. For example, maintaining both unity as non-illusory and accounting for confabulation might conflict. Also, the user questions whether insisting on a real self is a non-eliminativist bias. I should argue that demanding a self isn't necessary if the theory explains the phenomena without it.

