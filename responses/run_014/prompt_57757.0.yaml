  We are creating an exam question on Galen Strawson's Basic Argument, with a twist involving an infinitely old agent who has always been reshaping her character. The question must be self-contained and test the students' understanding of the mechanism of the argument, specifically addressing two key issues: (1) whether the argument demands termination of the regress (a first self-forming act) or origination (self-creation ex nihilo), and (2) whether moral responsibility is a matter of degrees or a threshold property.

  The question should also require students to consider what a reasons-responsiveness theorist must concede about desert.

  Structure of the response:
  1. The exact question as it will appear.
  2. A model answer of about 700 words, argued (not bullet points), no references.
  3. A detailed marking scheme in JSON format.

  Let's design the question first:

  **Question:**

  Consider the following argument (inspired by Galen Strawson’s “Basic Argument”): For an agent to be truly morally responsible for how she acts, she must be truly morally responsible for how she is, in the relevant mental respects. But to be responsible for how she is, she must have formed herself from a previous state for which she was responsible, and so on, ad infinitum. This regress terminates only in the impossible demand for self-creation ex nihilo. Therefore, true moral responsibility is impossible.

  Now imagine an agent, Vesper, who has existed for an infinite past. At each of infinitely many earlier stages, Vesper deliberately reshaped her own character in ways for which she was, by hypothesis, responsible. Thus, for every state of her character, there is an earlier state she formed responsibly, and there is no first such act and no moment at which she brought herself into being.

  (a) Does the Basic Argument require that the chain of responsibility terminate (i.e., that there be a first self-forming act) or that there be origination (self-creation ex nihilo)? Explain the implications for Vesper: if the argument requires termination, does she meet the condition? If it requires origination, does the infinite regress of self-formings satisfy it?

  (b) Is true moral responsibility, as the Basic Argument conceives it, a quantity that admits of degrees (so that a finite agent who has partially self-formed might be partially responsible) or a threshold property (lost entirely if the boundary condition of self-creation fails)? What does your answer imply for ordinary practices of blame?

  (c) What must a theorist who grounds moral responsibility solely in an agent’s responsiveness to reasons (and not in origination) concede about the notion of desert?

  ---

  **Model Answer (approx. 700 words):**

  The Basic Argument against moral responsibility, as presented, hinges on two key demands: the regress of responsibility for one's character and the termination of that regress in self-creation. The case of Vesper, an infinitely existing agent who has always been responsibly reshaping her character, tests these demands. This essay will address (a) the nature of the argument's requirement (termination vs. origination) and its implications for Vesper, (b) whether responsibility admits of degrees or is a threshold property, and (c) the implications for a reasons-responsiveness account of responsibility.

  (a) The Basic Argument requires origination, not merely termination. The regress arises because responsibility for an action requires responsibility for the character that produced it. If that character was formed by a prior action, then responsibility for the prior action is required, and so on. The argument claims that this chain must end in an act of self-creation — an act that is not determined by any prior state of the agent. Termination at a first self-forming act would not suffice because that first act would itself require a prior responsible agent to perform it. Hence, the argument requires that the agent be the ultimate originator of herself, which is impossible because it would entail an act without any prior causes (ex nihilo). 

  Vesper's infinite regress of self-formings does not meet this demand. Even though every character state is the result of a prior responsible act, there is no point at which Vesper originates herself. Every act of self-formation is determined by a prior state of Vesper, so the chain extends infinitely backward without ever escaping the determinative influence of a prior state. Thus, Vesper fails to be truly morally responsible because she never originates her character; she only modifies it from prior states that she did not create.

  (b) The Basic Argument conceives true moral responsibility as a threshold property, not one admitting of degrees. The argument concludes that responsibility is impossible because the condition of self-creation is unsatisfiable. If responsibility were a matter of degrees, then even if full self-creation is impossible, we might have partial responsibility. But the argument does not allow for this: it states that without being responsible for how one is, one cannot be responsible for what one does. The failure at the origin — the lack of self-creation — means that the entire chain is undermined. Thus, responsibility is an all-or-nothing property: one either meets the condition of being the ultimate originator or one does not. Since no one meets it, no one is truly responsible.

  This has radical implications for ordinary blame. If the argument is sound, then our practices of blaming and praising are fundamentally mistaken. We might still hold people accountable for practical reasons (e.g., to encourage good behavior), but we cannot say they truly deserve blame or praise in a deep moral sense. Blame would be a tool for social regulation, not a response to genuine desert.

  (c) A theorist who grounds moral responsibility solely in an agent’s responsiveness to reasons (and rejects the need for origination) must concede that the notion of desert is weaker than what the Basic Argument assumes. Such a theorist (e.g., a Strawsonian or a compatibilist) might argue that responsibility requires only that an agent’s actions flow from her own reasons-responsive mechanisms. However, without origination, the agent’s character — including her reasons-responsive mechanisms — is ultimately a product of factors beyond her control (e.g., genetics, environment, or in Vesper's case, an infinite regress of prior self-formations). Therefore, the desert attached to her actions is not ultimate or absolute. It is conditional and perhaps only forward-looking: we might say an agent deserves blame only in the sense that it is appropriate to modify her attitudes or behavior, not that she is the ultimate source of her wrongdoing. The reasons-responsiveness account thus offers a notion of desert that is compatible with determinism but sacrifices the idea of ultimate responsibility.

  In conclusion, the Basic Argument demands origination, and Vesper’s infinite regress fails to provide it. Responsibility is a threshold property, so the failure at the origin means no one is truly responsible. This undermines desert-based blame, leaving only pragmatic justifications. A reasons-responsiveness account avoids the regress but must concede that desert is not ultimate.

  ---

  **Marking Scheme (JSON):**

  We'll break the answer into components. Total marks: 25.

  Components (5 parts, because (a) has two subpoints and (b) and (c) are separate):

  1. (a) Correctly identifies that the argument requires origination (not just termination).
  2. (a) Correctly applies to Vesper: infinite regress does not meet the origination demand.
  3. (b) Correctly identifies responsibility as a threshold property and explains why.
  4. (b) Correctly draws the implication for ordinary blame (that it lacks true desert).
  5. (c) Correctly states the concession about desert that a reasons-responsiveness theorist must make.

  But note: the question has three parts: (a), (b), (c). We can break (a) into two (termination/origination and Vesper) and (b) into two (threshold and blame). (c) is one.

  So let's have five components.

  We'll assign marks as follows:
  - Component 1: 5 marks
  - Component 2: 5 marks
  - Component 3: 5 marks
  - Component 4: 5 marks
  - Component 5: 5 marks
  Total: 25.

  But note: the marking scheme must have five components. We'll make:

  Component 1: Part (a) first part (termination vs origination)
  Component 2: Part (a) second part (Vesper)
  Component 3: Part (b) first part (degrees vs threshold)
  Component 4: Part (b) second part (implication for blame)
  Component 5: Part (c) (reasons-responsiveness concession)

  Now, for each component, we need:
  - id: e.g., "a1", "a2", "b1", "b2", "c"
  - tests: the specific distinction it isolates
  - marks: integer
  - must_do: what the student must do to get any marks at all
  - full_marks_requires: what is required for full marks
  - common_error: a typical mistake
  - error_cost: how many marks are lost for that error

  Also, we need:
  - A_vs_B: for the top grades (say A vs B), what moves separate them? We'll set A as the highest.
  - hard_caps: conditions that cap the mark (e.g., if they restate the regress without addressing the distinctions, they get a maximum of 10).

  Finally, the paragraph about the deciding sentence.

