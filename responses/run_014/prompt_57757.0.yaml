answer: |-
  ### 1. Exam Question  
  **Philosophy 450: Free Will and Moral Responsibility  
  Final Examination**  

  **Question 3 (25 marks):**  
  Consider Galen Strawson’s Basic Argument against moral responsibility: For an agent to be truly morally responsible for her actions, she must be truly responsible for her character (in relevant mental respects). This demands a regress of prior responsible self-formations, terminating only in self-creation *ex nihilo*—which is impossible. Thus, true moral responsibility cannot exist.  

  Now imagine **Vesper**, an agent who has existed for an infinite past. At every prior stage, Vesper deliberately reshaped her own character in ways for which she was fully responsible. There is no first act of self-formation and no moment of initial self-creation—only an endless chain of responsible self-modifications.  

  (a) Does the Basic Argument require that the chain of responsibility **terminate** (i.e., have a first self-forming act) or that it achieve **origination** (self-creation *ex nihilo*)? Explain whether Vesper satisfies either demand.  
  (b) Does the Basic Argument treat true moral responsibility as admitting **degrees** (so partial self-formation yields partial responsibility) or as a **threshold property** (lost entirely if self-creation fails)? What does this imply for ordinary blame?  
  (c) What must a theorist who grounds responsibility in **reasons-responsiveness** (not origination) concede about the notion of **desert**?  

  ---  
  ### 2. Model Answer (700 words)  

  The Basic Argument’s regress arises from a conceptual boundary condition: responsibility for actions requires responsibility for character. Vesper’s infinite history of self-formation tests whether the regress *must terminate* in a first act or *must achieve* self-creative origination. I argue the argument demands **origination**, not mere termination. Termination—a first responsible act—fails because that act would itself require a prior character for which Vesper is not responsible. Only origination (*ex nihilo* self-creation) would halt the regress, but this is impossible. Vesper’s infinite chain of modifications, however complete, never escapes determination by a prior state. Every act inherits traits from an earlier self she did not create. Thus, Vesper fails the origination demand. The infinitude of her self-formations is irrelevant; without an uncaused beginning, she is not truly responsible.  

  This reveals responsibility in the Basic Argument as a **threshold property**, not admitting degrees. The threshold is the boundary condition of ultimate origination: crossing it requires self-creation. Since this is unattainable, responsibility is binary—either fully present or fully absent. Partial self-formation in finite agents (e.g., a reformed liar who now acts honestly) cannot yield "partial responsibility" because the regress still traces back to unchosen initial conditions (e.g., genetics or upbringing). Degrees would only apply if responsibility were quantitative (e.g., "more self-formation = more responsibility"), but the argument’s logic is structural: if the foundation (self-creation) fails, the entire edifice collapses. Consequently, ordinary blame loses its grounding in desert. Blame may still serve practical purposes—e.g., reinforcing norms or rehabilitating offenders—but it cannot be justified as *deserved* retribution. Without the threshold of origination, blame is merely instrumental, not a moral response to true responsibility.  

  A reasons-responsiveness theorist—who holds agents responsible if they act from rational evaluation of reasons, regardless of their causal history—must concede that **desert is not ultimate**. Such a view avoids the regress by rejecting origination: responsibility depends only on present psychological capacities. However, because reasons-responsiveness is itself shaped by factors beyond the agent’s control (e.g., Vesper’s infinitely prior character or a finite agent’s upbringing), the theorist must admit that blame cannot appeal to *metaphysical desert*. Desert becomes pragmatic: we say an agent "deserves" blame only in the forward-looking sense that it is appropriate to modify behavior or express societal values. This forfeits the retributive core of desert—the idea that wrongdoers intrinsically *owe* suffering for their actions. Thus, while reasons-responsiveness salvages responsibility as a practical concept, it abandons the deep moral desert the Basic Argument targets.  

  In sum, the Basic Argument requires origination, which Vesper’s infinite regress cannot provide. Responsibility is a threshold property, rendering ordinary blame desertless. Reasons-responsiveness accounts replace desert with pragmatic justification.  

  ---  
  ### 3. Marking Scheme  
  ```json
  {
    "total_marks": 25,
    "components": [
      {
        "id": "a_demand",
        "tests": "Distinguishes termination (first act) vs. origination (self-creation ex nihilo) as the argument's requirement.",
        "marks": 6,
        "must_do": ["State which demand the argument requires"],
        "full_marks_requires": "Clear explanation that origination is required because termination leaves the first act unexplained.",
        "common_error": "Equates termination (having a first act) with satisfying the argument.",
        "error_cost": "Lose 4 marks if termination is incorrectly asserted; lose 2-3 if undecided."
      },
      {
        "id": "a_vesper",
        "tests": "Applies demand to Vesper: whether infinite regress satisfies termination/origination.",
        "marks": 5,
        "must_do": ["Address Vesper's case"],
        "full_marks_requires": "States Vesper fails origination (chain avoids termination but not determinism by prior states).",
        "common_error": "Claims infinite regress solves the problem by avoiding a first act.",
        "error_cost": "Lose 3 marks if Vesper is deemed responsible; lose 2 if termination is misapplied."
      },
      {
        "id": "b_degrees_threshold",
        "tests": "Identifies responsibility as threshold (binary) or degrees (scalar).",
        "marks": 5,
        "must_do": ["Choose threshold or degrees"],
        "full_marks_requires": "Explicit threshold verdict, explaining that self-creation failure voids all responsibility.",
        "common_error": "Assumes partial self-formation grants partial responsibility.",
        "error_cost": "Lose 3 marks for 'degrees'; lose 1-2 if incomplete."
      },
      {
        "id": "b_blame_implication",
        "tests": "Draws implication for blame: loss of desert vs. instrumental retention.",
        "marks": 5,
        "must_do": ["State an implication for blame"],
        "full_marks_requires": "Links threshold failure to desertless blame (instrumental only).",
        "common_error": "Says blame remains unaffected due to practicality alone.",
        "error_cost": "Lose 3 marks if desert is retained; lose 2 if unclear."
      },
      {
        "id": "c_desert_concession",
        "tests": "States what reasons-responsiveness theorist must concede about desert.",
        "marks": 4,
        "must_do": ["Address desert"],
        "full_marks_requires": "Concedes desert is non-ultimate (pragmatic/forward-looking, not retributive).",
        "common_error": "Claims reasons-responsiveness retains full desert.",
        "error_cost": "Lose 3 marks if no concession; lose 2 if incomplete."
      }
    ],
    "A_vs_B": {
      "A_requires": [
        "Explicitly ties Vesper's failure to lack of origination (not termination)",
        "Threshold conclusion with chain-collapse metaphor",
        "Desert loss in blame tied to threshold failure",
        "Concession: reasons-responsiveness abandons retributive desert"
      ],
      "B_typically": [
        "Correctly identifies origination but vague on Vesper",
        "Threshold stated without explanation of structural failure",
        "Blame implication: instrumental but not desert-specific",
        "Concession: desert weakened but not redefined"
      ]
    },
    "hard_caps": [
      {
        "condition": "Misreads Vesper as solving the regress (e.g., 'infinite chain = no problem')",
        "maximum_mark": 15
      },
      {
        "condition": "Treats responsibility as degrees without addressing threshold logic",
        "maximum_mark": 18
      },
      {
        "condition": "Omits part (c) entirely",
        "maximum_mark": 20
      }
    ]
  }
  ```  

  **Deciding Sentence for First-Class Standard:**  
  The sentence most critical for a first-class mark is: **"Responsibility is a threshold property [...] if the foundation (self-creation) fails, the entire edifice collapses."** It crystallizes the argument’s structural logic and forces coherence in parts (b) and (c). A script missing this insight cannot resolve Vesper’s paradox or blame’s fate.
