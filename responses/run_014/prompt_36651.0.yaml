prompt: |-
  I'm a doctoral student in formal epistemology, and I've been asked to take a fifty-minute seminar for second-year undergraduates on the idea that credences can be assessed by accuracy alone — that there is a purely epistemic sense in which one set of degrees of belief is better or worse than another, quite apart from whether holding them pays off in any decision. The students have done a term of intro logic and know basic probability, but no decision theory and no formal epistemology. Don't explain the material to me; plan how I should teach it. Specifically: what has to be established first before the notion of an accuracy measure can even be introduced without seeming arbitrary (I suspect they need to see why the naive idea of just counting how many beliefs came true fails for degrees of belief, but you tell me what the real dependency is); the single worked example that should carry the whole session, what it must have and what it must avoid — I'm inclined towards a weather forecaster issuing probabilities over a season, but flag if that imports problems the students will trip over; the misconceptions they will predictably form and exactly where in the sequence each should be pre-empted — I'm expecting at least some of them thinking that accuracy permits being certain of everything, some thinking the whole thing is covertly about betting and bookmakers, and some thinking that because different scoring rules rank different credence assignments differently, the framework is arbitrary in a way that undermines it; how I should handle the prudential/epistemic distinction when someone raises the gambler who profits from overconfidence; and what I should openly decline to cover at this level, saying so to them. Finish with one question I could pose in the last five minutes whose answer would show me whether the core idea — that accuracy is an expectation over possible worlds rather than a count of hits — has actually landed rather than having been nodded along to.
reasoning: |-
  Okay, I need to help this doctoral student plan a seminar on assessing credences by accuracy alone for second-year undergrads. They've had intro logic and basic probability, but no decision theory or formal epistemology. The key is to structure this carefully because accuracy measures might seem arbitrary if not introduced properly.

  First, I need to figure out the dependencies. The student mentioned that the naive idea of counting true beliefs fails for degrees of belief. That's spot on. So, I should start by showing why all-or-nothing beliefs don't work for credences. For example, a weather forecaster who's 90% confident it will rain might be right if it rains, but if we just count true beliefs, we lose the nuance of confidence levels. A binary approach doesn't capture degrees. Establishing this contrast is crucial before introducing accuracy measures.

  Next, the worked example. The student suggested a weather forecaster over a season. That's good because it's relatable and allows for multiple predictions. But I must avoid pitfalls. Students might think the forecaster can just predict 100% for everything they believe, but that's where proper scoring rules come in. The example needs to show that accuracy isn't about being right or wrong but about how well the credences match the actual outcomes. Using a quadratic scoring rule (like Brier score) would demonstrate penalizing overconfidence. For instance, predicting 90% rain and it rains gives a better score than predicting 50% if the actual probability was high. The example should include multiple days, different predictions, and show scoring over time to emphasize expected accuracy.

  Now, misconceptions. Students might think accuracy means always being certain. But that's risky because if you're wrong, the penalty is high. The forecaster example can show that being less certain (e.g., 60%) when unsure is better than being overly confident. Another misconception is linking this to betting. I need to explicitly separate epistemic and prudential reasons. If a gambler profits from overconfidence, that's about practical success, not accuracy. Emphasize that we're evaluating beliefs based on truth, not gains. Also, the issue of different scoring rules leading to different rankings. I should acknowledge that while rules vary, they all agree that the true probability is optimal, so the framework isn't arbitrary. Mention Brier and log scores but focus on one to avoid confusion.

  Handling the prudential/epistemic distinction is important. If a student brings up the gambler, explain that making money doesn't mean accurate beliefs; it could be luck or risk-seeking behavior. Accuracy is about calibration to truth, not outcomes. Use an analogy: a stopped clock is right twice a day but isn't accurate overall.

  What to omit? Don't dive into Dutch books, coherence theorems, or representation theorems. Also, skip the debate between epistemic utility theory and Bayesianism. Mention that scoring rules can vary but stress that all reasonable ones reward matching true probabilities.

  Finally, the check-for-understanding question. Something like: "If a forecaster always predicts 100% for actual outcomes and 0% otherwise, are they accurate? Why not?" The answer should highlight that while they might get some right, the high confidence in wrong predictions leads to poor accuracy scores, showing that accuracy is about expected performance across worlds, not just counting hits.

  I should structure the seminar step-by-step: start with the problem of binary beliefs vs. credences, introduce the forecaster example, explain scoring rules, address misconceptions as they arise, clarify the epistemic focus, and end with the question to assess understanding.
answer: |-
  Here’s a structured 50-minute seminar plan focusing on clarity, conceptual dependencies, and preempting pitfalls. Prioritize **intuition-building** over formalism.

  ---

  ### **Seminar Structure**  
  **(Total: 50 mins)**  
  **Goals:** Establish that (1) credences require *graded* accuracy assessment, (2) accuracy is measured by scoring rules, (3) this is epistemic (truth-directed), not prudential.

  ---

  ### **Part 1: Why "Counting True Beliefs" Fails for Credences**  
  **(15 mins)**  
  *Dependency:* Students must grasp why credences *demand* a non-binary accuracy measure.  
  - **Hook (3 mins):**  
    - *Example:* A weather forecaster assigns 90% credence to rain tomorrow. It rains. Was she "more accurate" than if she’d assigned 50%? What if it *doesn’t* rain?  
    - Contrast with binary beliefs: "It will rain" is simply true/false. But with *degrees*, we need to quantify "how close" the credence was to truth.  
  - **Key Insight (10 mins):**  
    - Use a simple **3-day forecast example** (rain/no rain):  
      - *Forecaster A:* [Rain: 100%, Rain: 100%, No rain: 100%] → Actual: [Rain, Rain, Rain] → "2/3 correct"?  
      - *Forecaster B:* [Rain: 80%, Rain: 80%, Rain: 80%] → Actual: [Rain, Rain, Rain] → Intuitively better than A?  
    - **Problem:** Naive counting ignores confidence. A was *wrong* on day 3 but claimed certainty. B was modestly correct throughout.  
    - **Conclusion:** We need a tool that rewards *matching confidence to truth* and penalizes over/underconfidence.  

  ---

  ### **Part 2: Core Idea – Accuracy as a Scoring Rule**  
  **(20 mins)**  
  *Worked Example:* **Weather Forecaster over 3 Days** (simple, visual, avoids irrelevant complexity).  
  - **Setup (5 mins):**  
    - Define a **scoring rule** (Brier score): For credence *p* in event *E*, score = `(1 − (1 − outcome)²)` if *E* happens, else `(1 − (0 − p)²)`. (Simplify notation: outcome = 1 if true, 0 if false).  
    - *Day 1:* Forecaster predicts rain at 90%. Actual: Rain.  
      - Score = `(1 − (1 − 0.9)²) = 1 − (0.1)² = 0.99`.  
    - *Day 2:* Predicts rain at 10%. Actual: No rain.  
      - Score = `(1 − (0 − 0.1)²) = 1 − (0.1)² = 0.99`.  
    - *Day 3:* Predicts rain at 100%. Actual: No rain.  
      - Score = `(1 − (0 − 1)²) = 1 − (1)² = 0`.  
    - **Total accuracy:** Sum scores → 0.99 + 0.99 + 0 = **1.98**.  
  - **Why This Works (5 mins):**  
    - Visualize scores: Plot confidence vs. outcome on a graph. Emphasize:  
      - Best score when credence = 1 and true, or 0 and false.  
      - Worst score when maximally wrong (e.g., 100% credence, false).  
      - *Modest* credences (e.g., 60%) are "safer" than extreme ones.  
  - **Contrast with Naive Counting (5 mins):**  
    - Forecaster A (above) would score lower than B using Brier score.  
    - **Crucial:** Accuracy isn’t "how many you got right" but **"how well your credences matched reality"** across possibilities.  
  - **Misconception Preemption (5 mins):**  
    - *"Why not always be 100% certain?"* → Show Day 3: Wrong certainty nukes your score.  
    - *"Isn’t this just betting?"* → **Explicitly separate:** "We’re *only* evaluating truth-closeness. Betting profits involve risk tolerance (e.g., a gambler might win by overconfidence—but that doesn’t make her *accurate*)."  

  ---

  ### **Part 3: Epistemic vs. Prudential & Handling Objections**  
  **(10 mins)**  
  - **Prudential/Epistemic Distinction (5 mins):**  
    - *When a student raises "gambler who profits from overconfidence":*  
      - **Acknowledge:** Yes, in betting, overconfidence *can* sometimes win (e.g., high-risk, high-reward).  
      - **Clarify:** But accuracy scoring cares *only* about **calibration to truth**. A credence of 90% in a false proposition is *epistemically defective* even if it made money.  
      - **Analogy:** A stopped clock is "accurate" twice a day but isn’t a *reliable time-teller*. Accuracy scoring evaluates reliability.  
  - **Arbitrariness Worry (5 mins):**  
    - *"Different rules (Brier, log) rank forecasts differently!"*  
      - **Response:** All "proper" scoring rules agree on one thing: **your own credences expect your own scores to be best.**  
      - *Simple demo:* If you *truly* believe rain at 70%, then 70% minimizes your *expected* Brier score. Other rules agree.  
      - **Takeaway:** Rules vary in *how* they penalize, but all reward *sincerity* (credence = true chance).  

  ---

  ### **What to Omit**  
  **(Announce upfront)**  
  - "We won’t cover:  
    - Dutch books or coherence → (this is about *truth*, not avoiding betting losses).  
    - How scoring rules *derive* from axioms → (that’s grad-level!).  
    - Objections like ‘truth isn’t the only epistemic good’ → (today’s focus: accuracy as *one* clear standard)."  

  ---

  ### **Check-for-Understanding Question**  
  **(Final 5 mins)**  
  **Question:**  
  > *"Forecaster X always assigns 100% credence to every outcome that happens and 0% to others. Forecaster Y always assigns 60% to outcomes that happen and 40% to others. Over 100 days, X gets 70 predictions 'right' (i.e., events they assigned 100% to occurred), while Y gets 70 'right' (events they assigned >50% to occurred). Who is more accurate? Why?"*  

  **Why this works:**  
  - Tests if they grasp that accuracy ≠ counting "hits" (both have 70 "right").  
  - Correct answer: **Y is more accurate** because X’s wrong predictions (30 days) are maximally inaccurate (score = 0), while Y’s wrong predictions still retain some accuracy (e.g., 40% credence in a false event scores higher than 0%).  
  - If they appeal to "expected score over possibilities" or "penalizing extreme errors," the core idea has landed.  

  ---

  ### **Key Teaching Principles**  
  - **Avoid:** Derivations, decision theory, probability axioms.  
  - **Emphasize visuals:** Sketch score curves, forecast tables.  
  - **Pause for misconceptions:** After introducing scoring, explicitly ask: *"Why not just be certain of everything?"* and discuss.  
  - **Anchor in one example:** The 3-day weather case should be referenced in every section.  

  This plan balances conceptual rigor with accessibility, leveraging intuition to sidestep technical barriers while firmly establishing accuracy as an epistemic norm.
