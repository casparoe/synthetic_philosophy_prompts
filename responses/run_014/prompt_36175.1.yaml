prompt: |-
  Me and a friend have this long-running thing where she calls stuff socially constructed or not, and I've kept a list of her verdicts over the years. Some new cases have come up and I want to predict what she'll say before I ask, because I've started to suspect she isn't running just one rule.

  Her record so far:

  - money: constructed (her gloss: it only works because everyone goes along with it)
  - race: constructed (her gloss: the underlying variation is real, but the boxes are ours)
  - gender: constructed
  - mountains: not constructed (they'd be there with or without us)
  - gold: not constructed (it's an element, it is what it is regardless of anyone)
  - the flu: not constructed (the virus is just out there doing its thing)
  - weeds: constructed (no weed-fact in nature, a weed is just a plant in the wrong place relative to a garden)
  - chess: constructed, but she says this one differently, like "that one's just made up, doesnt even need the word"

  The new cases, none of which shes ruled on:

  1. Brain death. The biology is real, but the criteria for when someone counts as dead got written by committees, in an era when transplant surgeons wanted clarity about when organs could be taken. Is the kind "dead" out there like the flu virus, or is the cutoff ours?
  2. Species. Nature obviously produces the variation, but the line between one species and the next is famously a judgement call — lumpers and splitters disagree, and the boundary gets set by convention. Does she say the kind lion is out there like gold, or boxed in like race?
  3. The mean high-water line. In a lot of coastal places the law says private property ends where the average high tide reaches, so who owns the dry sand depends on a number a surveyor computes from years of tide charts. The tides are clearly not ours; the line on the chart clearly is. Constructed or not?
  4. ADHD. A category that didn't exist under that name a few decades ago, whose criteria have been rewritten several times, and where getting the label seems to change how people behave and think of themselves.

  What will she say on each? Honestly I'm less interested in the four answers than in what rule shes actually running. To me it looks like she might be running two rules at once without noticing — one for things made up out of nothing (chess, money) and one for things that are there anyway but get boxed by us (race, weeds) — and I can't tell which one she'd extend to the new cases. Or maybe its genuinely one rule and I'm missing what it is. So: what are the candidate rules that fit her record, what does each of them predict for the four new cases, which of the four does the best job of splitting the rules apart, what's your best guess overall and why, and if you could ask her one further case to settle which rule she's really on, what would it be?
reasoning: |-
  Okay, the user has this ongoing debate with their friend about what's socially constructed and what's not. They've kept a list of her verdicts and want to predict her answers for four new cases. But more importantly, they want to figure out what rule she's actually using, since they suspect it might be two different rules combined.

  Looking at her past judgments: Money, race, gender, weeds, and chess are constructed. Mountains, gold, and the flu are not. Her reasons vary. For money, it's because everyone agrees on its value. Race is real variation but boxes are human-made. Weeds are just plants in the wrong place. Chess is "made up." On the other hand, mountains and gold exist independently, and the flu virus is just doing its thing.

  The new cases are brain death, species, the mean high-water line, and ADHD. Each has elements that are real (biology, tides) and elements that are human-defined (criteria, legal boundaries, diagnostic labels). The user is trying to see if she'll apply the "made up" rule or the "boxing" rule to these.

  I need to consider possible rules she might be using. Rule A: If something depends entirely on human agreement or invention, it's constructed (like money or chess). Rule B: If humans create categories or boundaries around something that exists independently, it's constructed (like race or weeds). Or maybe she's using Rule C: If the essence exists without humans, it's not constructed, but human classifications are constructed. Or Rule D: If it's defined by function or purpose relative to humans, it's constructed.

  Applying these rules to the new cases will show differences. For brain death, Rule A might say not constructed because biology is real, but Rule B would say the criteria are constructed. Species is tricky—Rule A might say not constructed if species are seen as natural kinds, but Rule B would say the boundaries are constructed. The mean high-water line: the tides are natural, but the legal line is human-made. ADHD: the symptoms exist, but the category and criteria are defined by humans.

  The user wants to know which cases best differentiate between the rules. Brain death and species might be key because they straddle the line between natural existence and human definition. For example, if she says brain death is constructed, she's likely using Rule B. If not, Rule A.

  My best guess is she's using Rule B—focusing on human categorization. That fits her past answers: race and weeds are categorized by humans, while mountains and gold aren't. So for the new cases, she'd likely say brain death, species (boundaries), mean high-water line, and ADHD are constructed. But species might be an exception if she sees them as natural kinds.

  To settle which rule she's using, I'd propose a case like "pain." Pain has a biological basis but its interpretation and expression are influenced by culture. If she says constructed, she's emphasizing categorization/interpretation (Rule B). If not, she's focusing on the physical reality (Rule A or C). That could clarify her underlying rule.
answer: |-
  Based on her record and reasoning, your suspicion is spot-on: she's almost certainly applying **two distinct (but related) rules** simultaneously. Let's break down the candidate rules, their predictions, and how the new cases help distinguish them.

  ### Candidate Rules That Fit Her Record

  1.  **Rule A (Human Invention/Agreement Dependence):** "Is this thing fundamentally created by and dependent on human agreement, practice, or invention to exist *as that specific thing*?"
      *   Fits: Money (requires agreement), Chess (invented rules), Weeds (depends on human purpose/location).
      *   Doesn't Fit: Mountains (exist physically), Gold (element), Flu (virus exists), Race/Gender (she called them constructed, but their *underlying basis* exists physically - variation/biology).

  2.  **Rule B (Human Categorization/Boundary Drawing):** "Does the *category, boundary, or meaning* applied to a phenomenon depend on human decisions, conventions, purposes, or perspectives, even if the underlying phenomenon exists independently?"
      *   Fits: Race ("boxes are ours"), Gender (constructed category/meaning), Weeds ("plant in the wrong place" - categorization by human purpose), Chess (invented category/system). Money also fits here (value/meaning assigned).
      *   Doesn't Fit: Mountains (category "mountain" maps cleanly to a physical feature), Gold (category "gold" maps cleanly to an element), Flu (category "flu" maps cleanly to a virus).

  3.  **Rule C (Essentialism):** "Does the *core essence or existence* of the thing fundamentally depend on human minds/society?"
      *   Fits: Mountains (No), Gold (No), Flu (No), Race (Underlying variation is real - No), Weeds (No plant essence is "weed" - Yes).
      *   Doesn't Fit: Money (Yes - essence is social agreement), Chess (Yes), Gender (She called it constructed, implying its "essence" isn't purely biological). This rule struggles with her verdicts on Race and Gender.

  4.  **Rule D (Functional Relativity):** "Is the thing defined primarily by its *function or purpose relative to human activity*, rather than inherent physical properties?"
      *   Fits: Money (medium of exchange), Weeds (unwanted plant), Chess (game).
      *   Doesn't Fit: Mountains (defined by physical properties), Gold (element), Flu (biological agent). Fits Race/Gender poorly (she acknowledges underlying physical reality).

  **Analysis:** Rule C (Essentialism) and Rule D (Functional Relativity) fit her "Not Constructed" cases well but struggle significantly with her "Constructed" cases like Race and Gender. Rule A (Invention/Agreement) fits Money, Chess, and Weeds well but struggles with Race and Gender (their *basis* isn't invented). **Rule B (Categorization/Boundary Drawing) fits *all* her verdicts best.** It explains why Race, Gender, and Weeds are constructed (human-defined boxes/purpose) while Mountains, Gold, and the Flu are not (categories map directly to physical phenomena). Chess and Money fit under Rule B as extreme cases where the entire category/system is human-constructed.

  ### Predictions for New Cases Under Candidate Rules

  | New Case          | Rule A (Invention) | Rule B (Categorization) | Rule C (Essentialism) | Rule D (Function) |
  | :---------------- | :----------------- | :---------------------- | :------------------- | :---------------- |
  | **1. Brain Death** | **NOT Constructed** (Biology is real) | **CONSTRUCTED** (Cutoff defined by human committee/purpose) | **NOT Constructed?** (Biological cessation is real) | **CONSTRUCTED?** (Definition serves human legal/medical purpose) |
  | **2. Species**     | **NOT Constructed?** (Evolution produces distinct groups) | **CONSTRUCTED** (Boundaries are human conventions/lumping-splitting) | **NOT Constructed** (Evolution creates distinct lineages - "essence") | **NOT Constructed?** (Defined by reproductive isolation - a biological "function") |
  | **3. Mean High-Water** | **CONSTRUCTED** (The *line* is calculated/defined for law) | **CONSTRUCTED** (The specific *legal boundary* is human-defined) | **NOT Constructed?** (Average tides exist) | **CONSTRUCTED** (Defined for the *purpose* of property law) |
  | **4. ADHD**        | **CONSTRUCTED** (Category/label invented recently) | **CONSTRUCTED** (Criteria/definition is human convention, label changes experience) | **NOT Constructed?** (Underlying neurobiology is real) | **CONSTRUCTED** (Defined by functional impairment relative to societal norms) |

  ### Which Cases Best Split the Rules Apart

  1.  **Brain Death:** This is the **strongest differentiator**. Rule A (Invention) strongly predicts **NOT Constructed** (the biological reality exists). Rule B (Categorization) strongly predicts **CONSTRUCTED** (the *definition* of death for this purpose is a human convention set by committee). Rules C & D are less clear/more mixed.
  2.  **Species:** This is also a **very strong differentiator**, especially between Rule B and Rule C. Rule B (Categorization) strongly predicts **CONSTRUCTED** (boundaries are conventional). Rule C (Essentialism) strongly predicts **NOT Constructed** (species are natural kinds/lineages). Rule A is unclear, Rule D leans Not Constructed.

  ### Best Guess Overall & Why

  *   **Best Guess Rule:** She is primarily running **Rule B (Human Categorization/Boundary Drawing)**. This consistently explains her existing verdicts:
      *   Race/Gender/Weeds: Underlying reality exists, but the *categories/meaning/boundaries* are human-made.
      *   Mountains/Gold/Flu: The categories map directly and uncontroversially to physical phenomena.
      *   Money/Chess: Extreme cases where the entire category/system is a human construct (no underlying "natural kind").
  *   **Predictions for New Cases (Based on Rule B):**
      1.  **Brain Death: CONSTRUCTED.** (The *criteria* for declaring death in this context are a human convention).
      2.  **Species: CONSTRUCTED.** (The *boundaries* between species are human judgments/conventions, despite the underlying variation being real).
      3.  **Mean High-Water Line: CONSTRUCTED.** (The *specific legal boundary* calculated from tide data is a human-defined construct for property law).
      4.  **ADHD: CONSTRUCTED.** (The *diagnostic category, criteria, and label* are human conventions that shape experience, despite underlying neurobiological differences being real).

  ### The Settling Case: Pain

  To definitively determine if Rule B (Categorization) is her core rule versus Rule C (Essentialism) or Rule A (Invention), ask her about:

  *   **Pain:** "Is the *experience* of pain socially constructed? The biological mechanisms (nociception) are real, but how we interpret, express, label, and respond to pain signals is heavily influenced by culture, expectations, and context. Does the *kind* 'pain' exist solely in the biology, or is the experience shaped by our concepts?"

  **Why this settles it:**

  *   **Rule B (Categorization) Prediction: CONSTRUCTED (at least partially).** She should say the *experience and meaning* of pain involves significant human categorization and social shaping, even if the biological signal is real. This mirrors her view on gender/race (biology + social meaning).
  *   **Rule C (Essentialism) Prediction: NOT Constructed.** She would likely argue the essential experience of pain is a direct biological given, downplaying the social/cognitive mediation.
  *   **Rule A (Invention) Prediction: NOT Constructed.** She would argue the biological sensation exists independently of human agreement about it.

  Her answer to "Pain" would strongly confirm or refute the primacy of Rule B (Categorization/Meaning) in her framework. If she says pain is *not* constructed, it suggests she reverts to Rule C (Essentialism) when faced with core biological experiences, weakening the Rule B hypothesis. If she acknowledges a constructed element, it solidifies Rule B as her core principle.
