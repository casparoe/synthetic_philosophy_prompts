answer: |-
  Okay, strap in — I ran this exact gambit last semester, and it was messy but glorious. Here’s how to make it sing without fancy tech, just index cards and student buy-in. The key is forcing them into the *frustration* of underdetermination, not just the theory.  

  **Setup:**  
  Split your 14 into three groups: two small teams of "linguists" (say, 4 each) and one group of "informants" (6 students). Hand the informants their **secret manuals** *before* the activity starts, while the linguists plan elsewhere. Use rabbit pictures (print identical pairs: e.g., 10 cards showing the same rabbit at different life stages, plus 5 non-rabbit animals). The manuals:  

  - **Manual A (for half the informants):** Say "Gavagai!" ONLY if the linguist points to a picture containing a *whole rabbit*. For *any* rabbit-stage (baby/adult) or non-rabbit, say "Blicket!".  
  - **Manual B (for the other informants):** Say "Gavagai!" ONLY if the linguist points to a picture containing a *rabbit in its current temporal stage*. For the *same rabbit* at a different stage (e.g., if you’ve seen its baby photo before) or a non-rabbit, say "Blicket!".  

  *Why this works:* Manual A tracks the rabbit as an enduring object. Manual B tracks instantaneous rabbit-stages. Crucially, when linguists point to a rabbit *for the first time*, both manuals say "Gavagai!" — it’s only on *re-pointing* to the *same rabbit* later that Manual B flips to "Blicket!" (because it’s now a "new stage"). But linguists won’t know to test re-pointing yet.  

  **Timeline:**  
  - **0–10 min:** Intro. Frame it: "You’re linguists documenting ‘Gavagai.’ Your tools: pointing, hearing ‘Gavagai’ or ‘Blicket,’ and sheer grit." Assign groups (linguists plan; informants read manuals quietly). Stress: informants can *only* say those two words.  
  - **10–40 min:** Fieldwork. Each linguist team questions their informant group (3 informants per team, to avoid one-person bias). Give each team identical picture sets. *Crucially:* Let linguists test freely — pointing to animals, repeating points, etc. They’ll likely:  
    - Point to rabbit → "Gavagai!"  
    - Point to squirrel → "Blicket!"  
    - Re-point to same rabbit *immediately* → still "Gavagai!" (Manual B only objects after time passes or a stage change).  
    Most teams will miss re-pointing to the *same rabbit* after a delay (e.g., 5 min later), where Manual B says "Blicket!" for the "new stage." Without prompting, they’ll assume "Gavagai = rabbit."  
  - **40–55 min:** Team synthesis. Linguists build a "dictionary entry" for "Gavagai." They’ll almost certainly converge on "rabbit" (or "animal," but rabbit dominates).  
  - **55–70 min:** Showdown. Each team presents their definition. They’ll boast about consistency. THEN: reveal the manuals. Jaw-drop moment — both fit all *initial* data, but define "Gavagai" differently (whole object vs. temporal slice).  
  - **70–90 min:** Debrief. Hammer Quine’s point:  

  **Debrief Script:**  
  "Remember when Team 2 re-pointed to the adult rabbit 10 minutes in and got ‘Blicket’? That was Manual B in action — the ‘stage’ had changed. But Team 1’s informants (Manual A) kept saying ‘Gavagai’ for that same rabbit. Neither team *tested re-pointing over time* because nothing in the stimuli suggested it mattered. That’s **stimulus meaning** — assent/dissent patterns tied to sensory input. Your tests all probed ‘Is this a rabbit NOW?’ But Quine says no ostension (pointing) can fix whether ‘Gavagai’ tracks the rabbit’s enduring identity or just its current time-slice. Why? Because any new test (e.g., pointing tomorrow) just adds more stimuli that both manuals can interpret *consistently within their own framework*. Manual A sees the same rabbit; Manual B sees a new stage. No ‘further pointing session’ can break the tie — it’s a holistic web of meanings, not a direct label-referent chain."  

  **Predictable Disaster & Fix:**  
  First run, linguists will *ignore re-pointing* and assume static meanings. They’ll leave thinking, "We just needed more tests!" So: pre-brief the informants HARD. Drill them: "If Manual B, you MUST say ‘Blicket’ when re-shown the *same rabbit* after time passes or if they mention its past stage." Plant a savvy informant to *volunteer* re-pointing if linguists stall ("What if I show you this rabbit again?"). Also, wander and whisper prompts: "Team 2, did you test the baby rabbit card from earlier?"  

  **Where the Game Falls Short:**  
  It *feels* like indeterminacy hinges on incomplete ostension — "If only we’d pointed more, we’d know!" But Quine’s real point is stronger: even with *all possible* behavioral data (not just pointing), translation is indeterminate because meaning isn’t fixed by stimuli alone. The rabbit/stage manuals aren’t just "unverified" — they’re *empirically equivalent* yet *logically incompatible*. Our game can’t simulate Quine’s deeper claim: that the *totality of physical facts* (all speech dispositions across time) underdetermines meaning. We make it about "missing evidence," but Quine says no evidence *could* fix it. Address this head-on: "Today felt like we lacked data. Quine argues that even with infinite data, the web of language has no unique ‘correct’ translation."  

  **Final Tip:**  
  Bring a whiteboard. When teams present, map their tests to Quine’s "stimulus conditions." Seeing the *identical* data columns for both manuals drives home the horror. And watch for that moment when a linguist groans, "We could’ve asked forever and still been wrong!" That’s the win.  

  You’ve got this. It’s chaos with payoff. Let me know how the rabbit-hunt goes.  

  — Sal
