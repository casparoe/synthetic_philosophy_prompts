prompt: |-
  I'm a backend engineer with zero formal training in any of this, so bear with me. Every quarter my team votes on which of ~5 candidate features we should build, and I've been reading about voting impossibility results because I want to pick a mechanism that doesn't get gamed. I keep running into two theorems that seem to be the same thing, which is odd because I thought they were seperate results: Arrow's theorem and the Gibbard–Satterthwaite theorem. My current understanding is that Arrow says no full-ranking social welfare function on unrestricted domains can satisfy Pareto efficiency, independence of irrelevant alternatives, and non-dictatorship, while Gibbard–Satterthwaite says no single-outcome voting scheme on unrestricted domains can be Pareto efficient, strategy-proof, and non-dictatorial. But I've also seen people say that G–S is basically Arrow's theorem for voting schemes, and that under Pareto efficiency, IIA and strategy-proofness are equivalent for choice functions. Is that right? If so, which direction of implication actually holds, and what's the real difference between the two results — is one strictly stronger, or is it just that they're about different objects (complete rankings vs. picking a single winner)?

  The practical side matters more to me, though: our candidate pool is small and changes every quarter, and honestly our preferences look roughly single-peaked along a "safe incremental change vs. risky big bet" axis. Does the theorem even bite in a case like that? I have a vague sense that majority rule becomes manipulation-free when preferences are single-peaked, but I'm not sure if that's definately an actual result or just a folk theorem. And what do people actually do in small-group settings like ours — is there a mechanism that's good enough (not dictatorial, not obviously gameable), or is the honest answer that we should just have a meeting and let the loudest person win?
