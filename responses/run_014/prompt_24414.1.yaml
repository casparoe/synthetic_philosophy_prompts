prompt: |-
  I've been trying to figure out where I actually land on the line between "you should do this" and "youd be a hero for doing it, but I can't fault you for not doing it," because I keep getting inconsistent answers. Let me dump my gut calls and you tell me what principle, if any, is doing the work underneath.

  Giving up my seat on a packed bus to an old lady: I think I should. If I don't, people give me looks, but I'm not a bad person. And no special praise for doing it either — it's just the minimum, the floor.

  Donating a kidney to a dying stranger I've never met: praiseworthy, and I'm not a bad person for not doing it. Big gap from the bus.

  A drowning kid in a shallow pond, I'd just get my shoes wet: I should save them, and if I don't I'm a bad person. (The famous one, right.)

  Saving that same kid when it costs me my career: praiseworthy, but I'm not a bad person for walking away.

  Now here's where I get stuck. Donating a kidney to a dying stranger feels supereragatory — great, but no blame for not. But donating a kidney to my own dying child? I feel like refusing that is blameworthy, like a failure of obligation, not just a missed chance to be a hero. Same act, same cost to me, the only thing that changed is who's on the table. I can't reconcile that with the stranger case at all.

  And a second thing that bugs me: I think a person who never does anything above the minimum — never gives up a seat, never donates, never helps anyone past what they're strictly required to — is a pretty bad person. But if "above the minimum" acts are by definition not required, then what exactly am I blaming them for? They did everything they were supposed to.

  And I can't find the line on money. I feel like giving, say, $100 a month to a charity that actually saves lives is something I should do. $1,000 a month feels like heroism. But $500? I genuinely can't say, and I don't feel like there's a fact of the matter I'm just failing to see.

  So: is there a principle that gets all of this, or at least most of it? What does it say about cases I haven't listed — like a professional lifeguard, or someone who's contractually obligated to help? And honestly, which of my calls above does your principle force me to drop?

  Format request: lead with your bottom line in the first sentence, then give me the reasoning. No preamble, no restating my question.
reasoning: |-
  Okay, the user is really struggling with the line between moral obligations and supererogatory acts. They've presented several scenarios where their intuition conflicts. Let me start by breaking down each example they gave.

  First, the bus seat. They think it's the minimum requirement, but not doing it doesn't make someone bad. Then donating a kidney to a stranger is supererogatory, but to their child it's obligatory. The drowning child in the shallow pond is obligatory unless the cost is too high, like losing a career. The user is stuck on why the relationship changes the obligation for the same act. 

  Next, they mention someone who never goes beyond the minimum. They feel such a person is bad, but if supererogatory acts aren't required, how can you blame them? This points to a possible inconsistency. Also, the money donation amounts—$100 feels obligatory, $1000 heroic, but $500 is unclear. The user needs a principle that explains all these cases.

  The assistant's answer uses the principle of relational proximity. The closer the relationship, the stronger the duty. That explains why donating to a child is obligatory but to a stranger isn't. For the shallow pond, proximity is physical closeness creating a temporary duty. The professional lifeguard has a role-based duty. 

  The user's conflict about the minimum vs. supererogatory acts might be addressed by the idea that minimal decency includes some positive duties, not just avoiding harm. Never helping could violate basic decency if it involves neglecting relational duties. 

  The cost threshold also matters. High personal cost can shift an act from obligatory to supererogatory. But for close relations, even high costs might not remove the duty. For the lifeguard, contractual duty overrides personal cost. 

  The money example lacks a clear line because it depends on individual capacity and relational factors. The principle accommodates this by considering personal context. 

  The user might need to adjust their view that not donating a kidney to a stranger isn't blameworthy. The principle suggests that without relational proximity, it remains supererogatory. But for their child, refusal is blameworthy due to the parent-child bond. 

  The assistant's principle also implies that failing to meet relational duties makes someone blameworthy. So a person who never helps anyone might neglect relational obligations, making them "bad" in specific contexts, even if not all supererogatory acts are required. 

  Overall, the relational proximity framework seems to resolve most of the user's conflicts by tying duties to relationships and context, while allowing cost to modulate obligations.
answer: |-
  **Your intuitions are largely explained by a principle of relational proximity modified by cost thresholds, where duties arise from specific connections (kinship, physical immediacy, role) and diminish as personal sacrifice escalates.**  

  ### How This Principle Works:  
  1. **Relational Proximity Creates Obligation:**  
     - **Parent/Child:** Your duty to donate a kidney to your child stems from the inherent responsibility of kinship. Refusal violates a core relational obligation.  
     - **Stranger:** No inherent relationship → no default duty → supererogatory.  
     - **Shallow Pond:** Physical immediacy creates a *temporary* "relational" duty (you’re the only one present who can act). Walking away breaches this situational bond.  

  2. **Cost Thresholds Modify Obligation:**  
     - **Low Cost:** Saving a child in a pond (wet shoes) is obligatory—minimal sacrifice doesn’t override the situational duty.  
     - **High Cost:** Saving that child at career-loss shifts the act to supererogatory—extreme sacrifice dissolves the obligation.  
     - **Kidney Donation:** High physical/emotional cost for a stranger lacks proximity, so no duty. For your child, proximity *overrides* the high cost, maintaining obligation.  

  3. **The "Minimum Decency" Baseline:**  
     - Giving your bus seat is a *low-cost, low-proximity* duty. It’s obligatory not because of relationship, but because it’s a minimal burden in a shared social space. Failing this repeatedly suggests a deficit in basic decency.  
     - Someone who *never* helps (bus seats, small charities) fails this baseline. "Doing everything required" includes low-cost positive duties in communal contexts—not just avoiding harm.  

  4. **Money Donations:**  
     - No fixed line. Relational proximity (e.g., donating to save *your* community vs. strangers) and cost relative to your capacity matter.  
     - **$100/month:** Likely obligatory if low burden for you and high-impact (relational duty to humanity-at-large when cost is trivial).  
     - **$1,000/month:** Supererogatory if it imposes significant strain.  
     - **$500/month:** Context-dependent. If it forces you to skip meals, supererogatory; if it’s 0.5% of your income, obligatory.  

  ### Resolving Your Conflicts:  
  - **Kidney to Stranger vs. Child:** Proximity (kinship) makes the difference. The cost is identical, but the relational duty to your child is non-negotiable.  
  - **"Never Helps" Person:** Blameworthy for violating low-cost social duties (bus seat, small kindnesses), not for skipping supererogatory acts.  
  - **Shallow Pond with Career Loss:** Correctly supererogatory—cost threshold overrides situational proximity.  

  ### Cases You Haven’t Listed:  
  - **Professional Lifeguard:** Role-based proximity creates obligation. Drowning child *on duty*? Obligatory, even at moderate risk. *Off duty*? Situational proximity applies, but high cost (e.g., career-ending injury) may shift to supererogatory.  
  - **Contractual Obligation:** Creates artificial "proximity." Failing to help when contractually bound is blameworthy (e.g., a bodyguard ignoring an attack).  

  ### Which Intuition Must Be Dropped?  
  You must drop the idea that **"no special praise for giving up a bus seat"** is universal. In societies where this isn’t normative (e.g., cities with no seating etiquette), it *could* be supererogatory. The duty arises from shared social context, not the act itself.  

  **Bottom Line:** Obligation flows from relational ties (blood, physical presence, role) and scales inversely with sacrifice; supererogation fills the gap when ties are weak or costs are high.
