  We are going to translate the debate about the Identity of Indiscernibles into model-theoretic terms.

  Key elements:

  1. **Leibniz's Principle (Identity of Indiscernibles):** 
     - Monadic version: If two objects share all monadic properties, then they are identical.
     - Relational version: If two objects share all properties (including relational ones), then they are identical.

  2. **Max Black's counterexample:**
     - A universe with two perfectly identical spheres, symmetric in every respect. 
     - The universe is symmetric about the midpoint between the two spheres. 
     - Black claims that the two spheres are distinct but share all properties.

  3. **Standard replies:**
     - Restriction to natural or fundamental properties (to avoid triviality).
     - The objection that the spheres are distinguishable by their spatial relations (e.g., one is to the left of the other if we introduce a coordinate system) — but note that in Black's symmetric universe, there is no absolute left or right without breaking the symmetry.

  Model-theoretic translation:

  - **Structures:** A structure M = (D, I) where D is a domain and I an interpretation of a set of symbols (function, relation, constant symbols). We consider first-order logic.

  - **Properties:** In model theory, properties are captured by formulas. 
     - Monadic properties: unary formulas φ(x).
     - Relational properties: formulas with more free variables, but we can also consider properties defined by formulas with parameters? 

  - **Indiscernibility:** Two elements a, b in D are indiscernible (relative to a set of formulas) if they satisfy the same formulas in that set. 
     - We can consider:
          * Absolute indiscernibility: same for all formulas (with no parameters? or with parameters from the empty set?).
          * Indiscernibility relative to a language (set of symbols) and a set of parameters.

  - **Automorphisms:** An automorphism of M is a bijection f: D → D that preserves the structure (i.e., for any relation R, (a1,...,an) in R iff (f(a1),...,f(an)) in R; similarly for functions and constants). 

  Black's counterexample in model-theoretic terms:

  - Consider a language L with a binary relation for distance (or a metric) and perhaps a constant for the midpoint? But note: Black's universe has two spheres and nothing else. We can set up:

     - Domain: {a, b, c} where a and b are the spheres, and c is the midpoint? Or we can have a symmetric metric space.

