prompt: |-
  spent the last three hours arguing with a friend about advance directives and I still feel like I'm the one who's wrong even though I can't say why. Her position is basically that honoring a living will is just respecting the person, full stop — the competent them wrote it down, so the incapacitated them has to follow it, and anyone who hesitates is really just letting a doctor take over. And I get it, I do, it sounds airtight. But the case that keeps bugging me: the person with late-stage Alzheimer's who's actually not suffering, who's calm and even kind of settled, but whose directive from ten years ago says 'do not keep me alive if I can't recognize my own family.' What exactly gives the sharp ten-years-ago version of them the right to veto the content version of them? And here's the part that really throws me — we don't let a person do this anywhere else. A competent adult can't sign a contract now that binds their future self to, say, work for a year at a pittance, or to never quit a job, or to be their kid's guardian no matter what; the future self gets to change their mind about pretty much everything, a promise can be broken, a preference can be revised. So why is the one domain where the past self gets iron-clad, enforceable authority over the present self the one where the present self is least capable of objecting? I think the whole practice of advance directives quietly presupposes some particular theory of what makes a person the the same person over time, and that the theory it needs isn't the one we actually use for contracts or promises or just changing your mind. Can you reconstruct what view of personal identity and self-continuity the advance-directive practice strictly requires, seperate that from what it merely fits well with, point out where it contradicts how we treat the same person's commitments in every other context, and tell me what would have to change if we forced ourselves to use one consistent view of the self across all of it?
reasoning: |-
  Okay, this user has been in a three-hour argument about advance directives, specifically troubled by the case of an Alzheimer's patient who isn't suffering but whose past directive demands withdrawal of care. They feel their friend's "respect autonomy" position seems airtight but clashes with how we treat future selves in other contexts like contracts. 

  Hmm, their frustration is palpable - they can't articulate why they feel wrong but sense a philosophical inconsistency. The core tension they're wrestling with is actually brilliant: why do we grant past selves despotic power only when the present self is voiceless? 

  Let me unpack their layered request. First, they want the implicit theory of personal identity in advance directives exposed. Second, they want it contrasted with contract law's view of future selves. Third, they need inconsistencies highlighted. Finally, they're asking for a thought experiment: what if we applied one consistent theory of self across domains?

  *scratches head* The friend's position relies on what philosophers call the "precedent autonomy" view - that the competent self owns all future versions. But the dementia case reveals its flaws: that smiling Alzheimer's patient feeding birds isn't the same person who drafted the directive. Their objection about contract law is spot-on - we always privilege present autonomy except here. 

  *stares at ceiling* The contradiction is jarring: in contracts, we say "you can't bind future you" because we value ongoing agency. In directives, we say "past you binds present you" precisely when agency is gone. The switch happens at the moment of incompetence - but why does losing capacity retroactively empower a ghost version of yourself? 

  *scribbles notes* For a consistent view: If we applied contract law's "present self sovereignty" to directives, we'd ignore past wishes if the patient seems content. But that feels wrong too - what about the terrified pre-dementia self? Alternatively, if we let contracts bind future selves absolutely... yikes, that's indentured servitude. 

  *sighs* No wonder they're troubled - both positions have moral costs. The compromise might lie in Ulysses contracts: binding only for irreversible states where the past self reasonably predicted suffering. But that smiling dementia patient? They break the model. Maybe we need to admit that continuity isn't binary but graded - and at some point, the calm late-stage patient is a different self entitled to peace. 

  *adjusts glasses* Final thought: This isn't just philosophy. If we changed policies to match the contract view, directives would become non-binding requests. That terrifies autonomy purists. But forcing consistency might humanize how we treat the demented - not as vessels for a dead self's orders, but as beings with current interests. Even if... especially if... they've forgotten drafting the document that could kill them.
answer: |-
  You've hit on one of the deepest philosophical tensions in medical ethics. Your intuition is correct: Advance directives rely on a specific, controversial view of personal identity that we reject in nearly every other legal and social context. Let's reconstruct the required theory, separate it from common justifications, expose the contradictions, and explore the implications of consistency.

  ### The View of Personal Identity **Strictly Required** by Advance Directives
  1.  **The "Lockean Memory Criterion" on Steroids:** Advance directives implicitly demand an *extreme* version of Locke's view that personal identity resides in psychological continuity (memories, beliefs, intentions). Crucially, it prioritizes *one specific moment* (the competent drafting self) as the *only* "real" person. The future incapacitated self isn't a different person with new rights; it's merely the *residue* of the past self, lacking standing to countermand its prior orders.
  2.  **Temporal Sovereignty of the Past Self:** The competent past self is granted absolute, irrevocable authority over the biological future entity inhabiting the same body, *specifically* when that future entity lacks competence. The past self "owns" the future biological life.
  3.  **Identity as Static Preference Set:** The person is defined by a fixed set of values and preferences held at peak competence. Subsequent changes due to disease (like finding peace in dementia) are seen not as authentic developments of the self, but as *corruptions* or *losses* of the true self. The directive preserves the "authentic" self against the "inauthentic" future state.
  4.  **The Competence Threshold as an Identity Cliff:** Crossing the threshold of legal competence (as defined when drafting) doesn't just change decision-making capacity; it fundamentally alters the moral status of the entity. The incompetent self loses its claim to be the "principal" and becomes a ward of its past self's instructions.

  ### What Advance Directives **Fit Well With** (But Don't Strictly Require)
  *   **Respect for Autonomy (Generally):** Valuing self-determination.
  *   **Avoiding Suffering:** Preventing unwanted medical interventions.
  *   **Burden on Families/Society:** Avoiding prolonged, costly care contrary to prior wishes.
  *   **Practicality:** Needing clear, documentable instructions for clinicians.
  *   **Fear of Future States:** The understandable desire to control one's fate if facing potential indignity.

  ### The Glaring Contradiction with Other Contexts
  Your contract law example is precisely on point. Here's the inconsistency laid bare:

  | **Context**               | **Treatment of Future Self**                                | **Underlying Principle**                                     |
  | :------------------------ | :---------------------------------------------------------- | :----------------------------------------------------------- |
  | **Advance Directives**    | **Past Self Binds Future Self Absolutely.** The incompetent present self has *no* standing to override prior instructions, even if content. | "Peak Competence Self" is the true self; later incapacity invalidates current preferences. |
  | **Contracts & Promises**  | **Future Self Can Renegotiate/Break.** Future self has full rights to quit jobs, break leases, dissolve partnerships, change guardianship preferences (if competent). Contracts limiting future freedom (e.g., indentured servitude) are void. | **Present Self Sovereignty:** The competent self *at any given time* has ultimate authority over its current commitments and future promises. Competence *now* trumps promises made *then*. |
  | **Changing Preferences**  | We accept that people change their minds about careers, relationships, values, etc. We don't hold them hostage to past declarations. | **Ongoing Autonomy:** Identity is dynamic; preferences evolve; current convictions matter most. |

  **The Crux:** Advance directives uniquely create an *irrevocable power of attorney granted by Past Self to Past Self over Future Self*, enforceable *only* when the Future Self is incapable of objecting. In every other domain, the competent Present Self can always dissolve commitments made by its past self. The Alzheimer's patient who is calm and settled *is* experiencing a form of well-being, but the directive system declares that this well-being is irrelevant because the "real person" (the past self) didn't want it.

  ### What Would Change with a Consistent View of the Self
  Forcing consistency across all domains would require choosing one fundamental principle and applying it universally:

  1.  **If We Applied "Present Self Sovereignty" (Like Contracts) to Advance Directives:**
      *   Directives would become **non-binding expressions of preference**, similar to a letter stating future wishes about a job or relationship.
      *   A currently incompetent patient's *apparent well-being and lack of distress* (like the calm Alzheimer's patient) would be **paramount**. Care could not be withdrawn solely based on a past directive if the patient *now* seems content.
      *   Surrogates/doctors would primarily assess *current interests* ("Substituted Judgment" based on past wishes would weaken; "Best Interests" based on current state would dominate).
      *   **Consequence:** The terrified competent self loses certainty. Their fear of future indignity could not be "locked in." The demented self's present contentment would override past dread.

  2.  **If We Applied "Past Self Binding" (Like Directives) to Contracts/Promises:**
      *   Contracts could enforce truly irrevocable commitments: lifelong indentured servitude, unbreakable marriage vows, mandatory lifelong guardianship arrangements.
      *   Changing your mind based on new experiences or values would carry far less weight. "You signed it, you must abide by it, forever."
      *   **Consequence:** Individual freedom and adaptability would be massively curtailed. Society would become rigid and potentially oppressive.

  ### The Uncomfortable Reality & Possible Middle Ground
  The inconsistency exists because advance directives grapple with an intractable problem: **protecting the profound fear and values of the competent self facing potential future horror, while not tyrannizing the potentially content (though incompetent) future self.** We prioritize the first in directives and the second everywhere else.

  **A More Consistent (But Messier) Approach?** We might move towards a system that:
  *   Treats directives as **strong, rebuttable presumptions**, not absolute commands.
  *   Explicitly requires surrogates/doctors to weigh **both** the past self's documented wishes **and** the *current experience* of the patient (evidence of suffering vs. contentment).
  *   For conditions like dementia, develops more nuanced directives addressing *specific states* (e.g., "withdraw care only if I show persistent signs of distress/pain, not simply because I'm demented").
  *   Acknowledges that the "self" changes profoundly in severe dementia, and the moral claim of the *current* sentient being, even if incompetent, deserves significant weight against the wishes of a self that no longer exists psychologically.

  Your unease stems from recognizing this deep tension. Advance directives don't just respect autonomy; they enact a specific, contestable philosophical stance about identity and authority over time that contradicts our treatment of selves in every other aspect of life. The calm Alzheimer's patient enjoying the sunlight *is* a challenge to the system's foundational assumptions. Your friend's "full stop" position ignores this profound philosophical and ethical complexity.
