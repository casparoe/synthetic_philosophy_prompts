prompt: |-
  I teach an upper-level metaphysics seminar — 14 students, one 80-minute session — on the special composition question: under what conditions do some things compose one further thing? Design an in-class game in which students staff the customs checkpoint of a small fictional republic where import duty is levied per object: whatever crosses the border as a single thing pays one fee, and officers are personally fined whenever an appeals court overturns one of their rulings.

  Smugglers (role-played by a rotating subset of the students, with their own payoff scheme) arrive with trays of carefully engineered arrangements: two bricks resting in contact, three planks nailed at a single corner, a mobile held together by one drop of glue, seven pebbles arranged in a perfect circle, a live fish swimming in water scooped from the far bank. The officers must rule on each shipment, but the game only ends when they publish a customs code: a general, non-circular criterion that decides every past and future case. The smugglers' firm prospers precisely by probing whatever vagueness or circularity the code contains — so the students should feel the pressure toward either "everything composed of nothing in contact counts" or "nothing counts" as the only codes that survive litigation.

  Please provide the full rules, the materials list, a payoff scheme requiring no real money, a timeline for the session, and a debrief that maps particular moments in the game onto the main candidate answers — universalism, nihilism, and the life-based restrictionism — with students constructing the positions themselves rather than hearing them named first. Tell me what will predictably go wrong the first time I run it and how to handle it, and be explicit about the one feature of the debate the game cannot reproduce: that the universalist insists there was never a real decision to make at the border, since composition is not a matter of policy at all. Suggest how I should supply that point, and to whom it will feel like cheating.
reasoning: |-
  We are designing an in-class game for an 80-minute metaphysics seminar on the special composition question. The game will have two main roles: customs officers and smugglers. The goal is for the officers to develop a customs code (a general, non-circular criterion for when composition occurs) that can withstand challenges by smugglers who present borderline cases. The game will illustrate the pressures toward universalism (everything composes something) or nihilism (nothing composes) as the only stable positions.

  ## Game Rules

  ### Roles
  1. **Customs Officers**: A group of 4-5 students (rotating if needed) who inspect shipments and decide whether the shipment is one object (paying one duty fee) or multiple objects (each paying a fee). They must also write a customs code (a general criterion) by the end of the game.
  2. **Smugglers**: The remaining students (9-10) will form teams of 1-2. Each team is a "smuggler" who brings a "shipment" (a described or physical arrangement of objects) to the checkpoint. They aim to get as many shipments as possible classified as one object (to pay less duty) but without being caught in a way that leads to a successful appeal (which would fine the officer and not charge the smuggler for that shipment? Actually, the rules state the officers are fined if overturned, but the smuggler's payoff should be designed to encourage probing the boundaries). We'll design a payoff scheme for smugglers that rewards successful challenges to the code.

  ### Setup
  - **Materials**:
    - A list of pre-designed shipments (see examples below). Alternatively, allow smugglers to design their own within constraints? But to save time, we'll have pre-designed ones and maybe allow one or two custom ones later.
    - A whiteboard or shared document for the customs code.
    - A timer.
    - Scoreboard for officers (fines) and smugglers (successful shipments and successful appeals).
    - Optional: physical props for shipments (like bricks, planks, glue, pebbles, a fish in a bowl? But for simplicity, we can use descriptions and pictures).

  - **Initial Setup**:
    - Assign roles: 4-5 officers, the rest smugglers. Rotate officers every few shipments so everyone gets a turn? But the game ends when the code is published, so maybe have a fixed set of officers until the code is written, then rotate? Alternatively, have one officer panel for the whole game to maintain continuity. Given time, we'll have one panel of 4-5 officers for the whole game. The rest are smugglers, each of whom gets to present at least one shipment.

  ### Game Flow
  1. **Introduction (5 minutes)**: Explain roles and rules. Emphasize that the officers must write a customs code by the end of the game that must cover all cases without circularity or vagueness.
  2. **Round 1: Initial Rulings (20 minutes)**:
     - Each smuggler (or team) presents a shipment to the officers. They describe it (or show a picture) and declare how they want it classified (as one object or many? Actually, the smuggler's interest is to have it classified as one object to pay less. But the officers must rule independently). The officers have 2 minutes per shipment to rule (one object or many) and justify briefly. The ruling is recorded.
  3. **Round 2: Appeals (15 minutes)**:
     - After all initial shipments are ruled on, the smugglers can choose up to 3 shipments to appeal. The appeal is a 3-minute argument by the smuggler and a 2-minute rebuttal by the officer who made the ruling (or a representative). Then, the class (acting as the appeals court) votes by majority whether to uphold or overturn the ruling. If overturned, the officer is fined (see payoff). The appeal must be based on the customs code (if one exists at this point) or on consistency with prior rulings. Note: The officers haven't written the code yet, so in the first round of appeals, they must rely on precedents. This will push them to write a code.
  4. **Round 3: Drafting the Customs Code (15 minutes)**:
     - The officers must draft a general, non-circular criterion for composition. They write it on the board. They can use the experience from the rulings and appeals. The code must be in writing and clear.
  5. **Round 4: New Shipments (10 minutes)**:
     - Smugglers present 2-3 new shipments (designed to challenge the new code). The officers rule immediately using the code. Then, appeals can be made (same as before, but now based on the code). The class votes on appeals.
  6. **Round 5: Final Challenge (5 minutes)**:
     - The officers present the final code. The smugglers have one last chance to present a shipment that they think the code cannot handle without circularity or vagueness. The officers rule, and if appealed, the class votes. This is the ultimate test.

  ### Payoff Scheme (no real money)
  - **Officers**: Start with 100 points. They are fined 10 points for each overturned ruling. If by the end of the game they have a code that survives all challenges (including the final one) without being overturned in the last round, they get 50 points bonus. So, maximum 150, minimum 0.
  - **Smugglers**: Each smuggler (or team) starts with 0 points. For each shipment initially ruled as one object (and not appealed, or upheld on appeal), they get 10 points (because they paid only one duty). If they successfully appeal (overturn) a ruling that went against them (i.e., if they presented as one object but were ruled as many, and they appeal and win), they get 20 points (because they avoid duty and the officer is fined). Additionally, if in the final challenge the code is overturned, every smuggler gets 30 points.

  ### Timeline (80 minutes)
  - 0-5: Introduction and role assignment.
  - 5-25: Round 1 (Initial Rulings). 12 shipments (if 12 smugglers) at ~1.5 minutes each? That's 18 minutes. We have 14 students: 5 officers and 9 smugglers (so 9 shipments). 1.5 minutes per shipment: 13.5 minutes. Let's say 15 minutes for Round 1.
    - Adjust: 9 shipments at 2 minutes each: 18 minutes. We'll do 2 minutes per shipment (including presentation and ruling). So 5-23: Round 1.
  - 23-38: Round 2 (Appeals). 3 appeals: 5 minutes per appeal (3 min argument + 2 min rebuttal + 1 min vote) = 15 minutes.
  - 38-53: Round 3 (Drafting the Code). 15 minutes.
  - 53-63: Round 4 (New Shipments). 2-3 new shipments (we'll do 2). 4 minutes per shipment (presentation and ruling) = 8 minutes, then 2 appeals (if any) at 5 minutes each? But we have only 10 minutes. Let's do 2 shipments (4 minutes total for presentation and ruling) and then one appeal (5 minutes). Total 9 minutes. So 53-62.
  - 62-72: Round 5 (Final Challenge). One shipment. Presentation (1 min), ruling (1 min), appeal if any (5 minutes). Total 7 minutes. Then 72-80: Debrief.

  ### Debrief (8 minutes)
  - Map the game to the philosophical positions:
    - **Universalism**: The position that every plurality of objects composes a further object. In the game, this would be the customs code that says "any collection of objects, no matter how arranged, composes one object." This code is easy to apply and hard to challenge because every shipment is one object. But note: the universalist in philosophy doesn't think composition is a matter of convention. In the game, the officers are forced to make a convention. We must point out that the universalist philosopher would say that the customs officers are not creating composition by fiat; they are merely recognizing what is already there. The game cannot reproduce this because in the game, the officers are making a policy decision.
    - **Nihilism**: The position that no collection of objects composes a further object. The code would say "no shipment is one object; every shipment is multiple objects." This also avoids appeals because every ruling is consistent. But again, the nihilist philosopher doesn't think composition is a matter of policy.
    - **Restrictionism**: The officers might try to write a code that allows composition only in specific conditions (like when the parts are bonded, or when they form a living thing). But the smugglers will present borderline cases (like the fish in water, or the mobile with one drop of glue) that challenge the code. The appeals court (the class) will often overturn rulings because the code is vague or circular. This leads to fines and pushes the officers toward one of the extreme positions.

  - Highlight particular moments in the game:
    - When the officers tried a restrictionist code (e.g., "things in contact compose one object") and then were challenged by the two bricks in contact (which they ruled as one) versus the three planks nailed at a single corner (which they might rule as one or many? and the circle of pebbles? not in contact? or only point contact?).
    - The live fish in water: does the water count as part of the fish? If the code says "living things are one object", then the fish is one. But what about the water? The smuggler might claim the fish and the water together as one shipment? Or separately? This tests the boundaries of life-based restrictionism.

  ### What will go wrong the first time?
  1. **Time management**: The rounds may run over. Solution: Use a timer visibly and be strict. Cut off discussions when time is up.
  2. **Officers struggle to write a code**: They might get stuck in debate. Solution: Encourage them to start with a simple rule and refine it. Remind them that they can change the code later if needed (but they will be fined for past overturned rulings? The fines are for past rulings, so changing the code doesn't undo fines. They must live with the past rulings under the old code).
  3. **Appeals court (class) may not vote in a way that reflects the philosophy**: They might vote based on sympathy or fun. Solution: Remind the class that they are a court of law and must base their decision solely on the code (if it exists) or consistency with prior rulings. The instructor can guide by asking: "Does the code clearly cover this case? Is the ruling consistent with how a similar case was ruled?"
  4. **Smugglers may not design challenging shipments**: Pre-design a set of shipments to ensure a range of cases. Use the examples given (bricks, planks, mobile, circle of pebbles, fish) and add more (e.g., a pile of sand, a watch with removable parts, a tree with leaves, a human with clothes). Have these ready to give to smugglers.

  ### The one feature the game cannot reproduce
  The universalist (and nihilist) metaphysical position holds that composition is not a matter of convention or policy. In the game, the officers are making a policy. This might feel like cheating to the universalist because the game sets up composition as a matter of decision, but the universalist philosopher denies that. We should explicitly point this out in the debrief.

  ### How to supply that point
  During the debrief, say:
  "In the game, we set up the customs officers as having the power to decide when composition occurs. But in the philosophical debate, the universalist (and the nihilist) argues that composition is not a matter of decision. The universalist thinks that whenever there are some things, there is automatically a further thing composed of them. The customs officers, in this view, are not creating the composite object by their ruling; they are merely recognizing what is already there. Similarly, the nihilist thinks that there are no composite objects at all, so the officers are either recognizing that (if they rule as nihilist) or making a mistake (if they rule otherwise). The game cannot capture this because we are forced to have a policy. In reality, the universalist would say, there was never a real decision to make at the border; the object either exists or it doesn't, independently of what we say."

  ### Who will feel like it's cheating?
  Students who are drawn to universalism might feel that the game is rigged because it forces them to make a decision that they think is not really theirs to make. They might also feel that the appeals court is arbitrary. We must acknowledge this and explain that the game is designed to illustrate the practical difficulties of restrictionism, and that the only ways to avoid these difficulties in the game are to adopt universalism or nihilism as policies.

  ## Pre-designed Shipments (examples)
  1. Two bricks resting in contact (side by side).
  2. Three planks nailed together at a single corner (so they are connected but not rigid).
  3. A mobile (e.g., made of sticks and strings) held together by one drop of glue at one joint.
  4. Seven pebbles arranged in a perfect circle (each pebble touching two others? or just placed in a circle with gaps?).
  5. A live fish in a bowl of water (the water was scooped from the far bank, so it's part of the shipment).
  6. A sand castle (a pile of sand shaped like a castle).
  7. A disassembled watch (all parts in a bag).
  8. A watch assembled and working.
  9. A tree with leaves and roots (presented without soil? or with a clump of soil?).
  10. A human being (a student volunteer? or a doll?) wearing clothes and holding a bag.
  11. A chain (each link is separate but interlocked).
  12. A statue made of Legos (snapped together).

  We can assign these to smugglers. The first five are from the prompt, the rest are added.

  This design should create an engaging and instructive game that illuminates the special composition question.
answer: |-
  Below is a complete design for your in-class game, optimized for an 80-minute session with 14 students. It emphasizes experiential learning, pressure toward universalism/nihilism, and a debrief linking gameplay to metaphysics. The core tension: officers must write a watertight customs code ("composition criterion") while smugglers exploit ambiguities, mirroring philosophical challenges to restrictionism.

  ---

  ### **Game Title**: Borderline Realities: The Composition Customs Game  
  **Objective**: Officers must publish a non-circular customs code defining when "parts compose a whole object," surviving appeals. Smugglers profit by exposing vagueness in rulings/codes.  

  ---

  ### **Materials List**  
  - **Physical Props** (use simple, reusable items):  
    - 2 bricks, 3 wooden planks, 1 small mobile (e.g., paper clips + string), 7 pebbles, 1 live fish in a water-filled jar (or a plant in soil if ethics preclude animals), 1 bag of sand, 1 disassembled toy watch, 1 assembled watch, 1 Lego structure, 1 nail + hammer (for planks).  
    - **Trays** to display arrangements (e.g., cafeteria trays).  
  - **Documents**:  
    - **Smuggler Dossiers**: Pre-written shipment descriptions (see examples below).  
    - **Customs Code Poster**: Large paper for officers to draft the final code.  
    - **Scoreboard**: Tally fines (officers) and profits (smugglers).  
  - **Timers**: For rulings and appeals.  

  ---

  ### **Roles & Payoff Scheme (No Real Money)**  
  - **Customs Officers (4 students)**:  
    - **Duty**: Inspect shipments, rule "one object" (fee: 1 credit) or "multiple objects" (fee: 1 credit per part).  
    - **Fines**: Lose 5 points per overturned ruling.  
    - **Win Condition**: Publish a code surviving all appeals. Gain 20 points if successful.  
    - **Starting Points**: 50 points (representing salary).  

  - **Smugglers (10 students in 5 pairs)**:  
    - **Duty**: Present shipments, appeal unfavorable rulings.  
    - **Profits**:  
      - +10 points if shipment ruled "one object."  
      - +15 points if appeal overturns an officer's ruling (refund + bonus).  
      - +5 points per shipment that exploits vagueness in the final code (awarded post-game).  
    - **Win Condition**: Maximize points. Top smugglers earn "Smuggling Baron" title.  

  - **Appeals Court (All non-officer students)**: Vote to uphold/overturn rulings. Majority decides.  

  ---

  ### **Shipment Examples**  
  Pre-designed to probe classic metaphysical edge cases:  
  1. **Bricks**: Two bricks touching.  
  2. **Corner Planks**: Three planks nailed at one corner.  
  3. **Fragile Mobile**: Mobile held by one drop of glue.  
  4. **Pebble Circle**: Seven pebbles in a perfect ring (no adhesive).  
  5. **Fish & Water**: Live fish in water from the "far bank."  
  6. **Sand Castle**: Molded sand pile.  
  7. **Watch Parts**: Disassembled watch in a box.  
  8. **Living Plant**: Plant with roots in soil.  
  9. **Lego House**: Snap-together blocks.  
  10. **Statue & Base**: Clay figure glued to a wood base.  

  *Smugglers may modify one shipment mid-game to target the draft code (e.g., add/remove glue).*  

  ---

  ### **Timeline (80 Minutes Total)**  
  1. **Setup (5 min)**:  
     - Assign roles: 4 officers, 10 smugglers (5 pairs).  
     - Distribute props and dossiers.  
     - Explain rules and scoring.  

  2. **Round 1: Initial Inspections (25 min)**:  
     - Smugglers present 5 shipments (2 min each).  
     - Officers rule immediately ("one" or "many") + 30-second justification.  
     - *Example*: Officers rule "one object" for planks (contact) but "many" for pebbles (no bonding).  

  3. **Round 2: Appeals (15 min)**:  
     - Smugglers appeal up to 3 unfavorable rulings (3 min per appeal: 1-min smuggler argument, 1-min officer defense, 1-min court vote).  
     - Fines/profits applied immediately.  

  4. **Round 3: Code Drafting (15 min)**:  
     - Officers draft a customs code (e.g., "Contact + bonding" or "No compositions"). Must be general and non-circular.  
     - Smugglers design one new "code-buster" shipment.  

  5. **Round 4: Final Challenge (15 min)**:  
     - Officers publish code. Smugglers present 2 new shipments (including code-buster).  
     - Officers rule using the code. Appeals occur for these rulings.  

  6. **Game End**: Officers win if their code survives all appeals; else, smugglers win.  

  ---

  ### **Debrief: Mapping Game to Metaphysics (5 min)**  
  Link game events to philosophical positions **without naming them first**. Have students articulate the views:  
  - **"Everything Composes" (Universalism)**:  
    > "When officers defaulted to 'one object' for all shipments to avoid fines, they echoed universalism. But did this feel arbitrary? Like there was no real *difference* between a fish and scattered pebbles?"  
    - **Game Trigger**: Officers rush to a lax code after losing points to appeals.  

  - **"Nothing Composes" (Nihilism)**:  
    > "When officers ruled 'many objects' on everything—even the fish—to avoid appeals, they mimicked nihilism. But then the 'fish' paid per scale! Is that intuitive?"  
    - **Game Trigger**: Strict rulings on bonded objects (e.g., glued mobile) get overturned, pushing officers toward radical caution.  

  - **"Only Some Things Compose" (Restrictionism)**:  
    > "When officers said 'bonded things count,' the glued mobile passed, but the pebble circle failed. Then the appeals court overturned the mobile ruling—why? Because 'bonded' was vague! Restrictionism collapses under borderline cases."  
    - **Game Trigger**: Shipments like the fish (life) or planks (partial bonding) expose circularity (e.g., "What counts as *real* bonding?").  

  - **Life-Based Restrictionism Spotlight**:  
    > "The fish shipment split the court: Is the water part of the fish? Is life special? But if officers wrote 'life composes,' would a dead fish count? What about a virus?"  

  **Conclude**: "The game pressures you toward universalism or nihilism because restrictionist codes are vulnerable to appeals. But in real metaphysics, restrictionists argue we *can* draw non-arbitrary lines—it’s just hard!"  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem**: Officers draft a vague code (e.g., "when parts seem unified").  
    - **Fix**: Enforce a "no circularity/vagueness" rule. Reject codes using words like "object," "whole," or "seem."  

  - **Problem**: Smugglers dominate appeals, demoralizing officers.  
    - **Fix**: Cap appeals at 3 initially. Remind officers: publishing a code stops future fines.  

  - **Problem**: Students fixate on scoring, not metaphysics.  
    - **Fix**: In debrief, ask: "When did your rulings feel arbitrary? Why?"  

  - **Problem**: Time runs short during inspections.  
    - **Fix**: Use a visible timer. Prioritize 5 shipments in Round 1; skip repeats.  

  ---

  ### **The Unreproducible Debate Element & How to Address It**  
  - **The Issue**: Universalism holds that composition is **mind-independent**—not a "policy" we invent. The game frames it as a convention, which universalists reject.  
  - **Why It Feels Like Cheating**: Students favoring universalism will protest: "We’re not *deciding* if composition happens—it just *does*! Appeals shouldn’t override reality."  
  - **How to Supply the Point**:  
    1. **During Code Drafting**: Ask officers, "Does your code *create* objects, or describe what’s already there?"  
    2. **In Debrief**: Say:  
       > "Notice: the game treats composition as a policy choice. But the universalist philosopher says this is wrong—composition isn’t up to us. There was always a composite object at the border; officers just failed to see it. The court’s appeals are irrelevant to metaphysics, though crucial for gameplay."  
  - **Who Will Protest**: Intuitively realist students (often universalism-leaning) and those annoyed by the scoring. Validate them: "Yes, this is the game’s limitation. It forces a pragmatic compromise metaphysics might reject."  

  ---

  This design forces students into the nihilism/universalism dichotomy through gameplay, making abstract positions visceral. The unreproducible universalist objection becomes a teachable moment about metaphysics vs. convention. Run it as-is, and debrief thoroughly!
