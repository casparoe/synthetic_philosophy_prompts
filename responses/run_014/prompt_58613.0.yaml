prompt: |-
  I am a software engineer with no formal philosophy background, and I live in a twelve-unit housing cooperative that shares several expensive things we maintain ourselves: two cargo e-bikes with a shared charging dock, a basement workshop with a resin printer I helped set up, and a courtyard garden with a drip system on a timer I programmed. Upkeep is voluntary on paper at about two hours a month per household logged in a shared spreadsheet I built, plus chipping in for filament, brake pads, and plants, but in practice about half the households log almost nothing, bikes are often returned uncharged or with flat tires, and the printer is often left messy with empty spools.

  I have kept doing my full share and fixing small things as I see them because I like the garden and use the bikes for daycare pickup, yet lately I feel taken advantage of and I am debating whether to scale my effort back to roughly the building average until we adopt a firmer system, while two neighbors are pushing competing fixes for a vote next month, one a system of monthly usage credits that decay if you do not do maintenance and the other a rotating monitor role with a modest opt-out fee that funds repairs. I was discussing this with friends and one said I should keep cooperating unconditionally to set a good example while another said matching what others actually do is the only fair move, and I find the second view tempting but also worry it just accelerates the slide where everything becomes unusable.

  Please act as a professional philosopher with expertise in cooperation and shared resources, think carefully through the tradeoffs before you settle, including private brainstorming first if helpful, and then give me a committed recommendation about what I personally should do over the next three months and which of the two proposed systems I should support, with definite reasons rather than a balanced overview that leaves the choice to me. Present your answer as a numbered list with exactly five items, each item one or two sentences long, with no introduction or conclusion outside that list.
reasoning: |-
  Okay, let me approach this methodically. The user presents a classic cooperation dilemma with tangible real-world consequences. As someone living in this cooperative, they're experiencing firsthand the tension between individual rationality and collective benefit - a dynamic well-documented in game theory and political philosophy.

  First, I need to map the key philosophical frameworks applicable here. The tragedy of the commons immediately comes to mind, where unregulated shared resources get depleted. But this situation has more nuance: it's not depletion but neglect and maintenance shirking. Elinor Ostrom's work on governing commons through collective action seems particularly relevant here, especially since the cooperative already has some self-organization mechanisms.

  The user's personal dilemma centers on whether to continue cooperating fully or scale back to the group average. Kantian ethics would argue for maintaining cooperation as a categorical imperative, while consequentialism might justify matching others' efforts to avoid exploitation. But I should also consider virtue ethics - what kind of community member does the user want to be?

  Looking at the proposed solutions: the usage credit system resembles a tit-for-tat strategy known to sustain cooperation in repeated games, while the monitor role creates accountability through rotation. Both have merits, but the credit system's decay mechanism cleverly addresses procrastination in maintenance tasks.

  For the immediate three-month plan, the user needs an approach that prevents system collapse while encouraging reform. Continuing full cooperation risks burnout, but sudden withdrawal could trigger collapse. The recommendation should balance these while actively pushing for institutional change.

  The voting decision requires evaluating which system better aligns with Ostrom's design principles for sustainable commons. The credit system's direct link between use and maintenance responsibility seems more robust than the opt-out fee, which might enable continued free-riding through payment.
answer: |-
  Here is my analysis and recommendation:

  1.  **Scale back your contributions to the building average immediately** to avoid resentment and burnout; this preserves your capacity to lead institutional change while signaling the unsustainable status quo.
  2.  **Invest your conserved effort exclusively in advocating for and refining one of the formal systems**; direct your voluntary labor toward fixing the governance structure, not compensating for its absence.
  3.  **Support and actively refine the monthly usage credits system**; it directly ties resource access to maintenance contribution, creating a fairer link between use and upkeep than the opt-out fee which permits paid free-riding.
  4.  **Document specific neglect incidents for three months** to provide concrete evidence during the vote; this counters arguments that problems are overstated and demonstrates the necessity for change.
  5.  **Conditionally resume full cooperative levels only *after* the new system is implemented and functioning**, ensuring your effort reinforces a sustainable structure rather than enabling dysfunction.
