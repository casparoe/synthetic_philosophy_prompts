answer: |-
  ### Examination Question  
  **Time Allowed:** 45 minutes  
  **Total Marks:** 25  

  ---

  **Question:**  
  Analyze the case below using the *causal-role account* (defended by Cummins) and the *etiological account* (defended by Millikan) of biological function. Address each part in sequence.  

  **Case Summary:**  
  - A soil bacterium’s surface coat ("mantle") evolved to resist a now-extinct phage.  
  - The mantle is now essential for surviving seasonal desiccation.  
  - Two populations exist:  
    - **Population W**: Wild-type, never artificially selected.  
    - **Population L**: Lab-derived from W, selected for 300 generations for desiccation tolerance. Mantle gene sequence is identical to W.  
  - **Mantle effects**: Confers desiccation tolerance, stiffens cell envelope (against osmotic shock), provides nitrogen to kin when lysed, binds zinc, increases mass/settling rate.  
  - **Mutant**: A single-base deletion truncates the mantle. Mutants retain all effects *except* desiccation tolerance. Under wet conditions, mutants have equal fitness to normal cells; under drying, mutants die.  

  **Parts to Address:**  
  1. **Function Attribution (6 marks)**  
     Using *only* the etiological account’s criteria, list which mantle effects count as functions in W and in L.  
     Using *only* the causal-role account’s criteria, list which mantle effects count as functions in W and in L.  
     *(Base answers strictly on each theory’s stated principles; do not appeal to intuition.)*  

  2. **Theoretical Disagreement (4 marks)**  
     Explain why the two accounts *must* disagree on whether molecule-for-molecule identical cells in W and L have identical functions, despite their identical mantle proteins and mutant behaviors.  

  3. **Repair Assessment (10 marks)**  
     A causal-role theorist proposes this repair: "Anchor function to effects that coats of this type *typically produce in the species*." Assess whether this repair:  
     (i) Collapses into the etiological account, **OR**  
     (ii) Cannot deliver malfunction in the mutant.  
     Defend *one* of these conclusions using the case.  

  4. **Pluralism Verdict (5 marks)**  
     Does this case license pluralism (i.e., that both accounts are valid for different purposes)? Justify your position using *one* specific conflict from Part 1 or 3.  

  ---

  ### Model Answer (785 words)  
  **Part 1: Function Attribution**  
  *Etiological Account (Millikan):* Functions are effects that explain a trait’s selection history.  
  - **In W**: Only phage resistance is a function. The trait fixed in W’s lineage *because* it conferred phage resistance (historical cause). Desiccation tolerance, though vital now, played no role in selection (the phage was extinct post-fixation). Stiffness, nitrogen, zinc, and settling are non-functional side effects.  
  - **In L**: Only desiccation tolerance is a function. L underwent 300 generations of artificial selection *for* desiccation tolerance. Though the gene is identical to W, L’s history redefines its function. Other effects remain side effects.  
  *Causal-Role Account (Cummins):* Functions are causal contributions to a containing system’s capacity, relative to analytical interests.  
  - **In both W and L**: *All* effects (desiccation tolerance, stiffness, nitrogen, zinc, settling) are functions. Each contributes to capacities like "survival in arid habitats" (desiccation tolerance), "structural integrity" (stiffness), "nutrient cycling" (nitrogen), "metal homeostasis" (zinc), or "ecological sedimentation" (settling). The account is indifferent to history.  

  **Part 2: Theoretical Disagreement**  
  The accounts disagree because function identity depends on fundamentally distinct criteria. Etiological functions are defined by historical selection pressures: W’s mantle was selected for phage resistance, L’s for desiccation tolerance, making their functions differ despite identical molecules. Causal-role functions, however, depend only on current causal contributions within a system. Since both populations exhibit identical mantle biochemistry and mutant behaviors (e.g., mutants fail identically under drying), all causal effects are identical. Thus, causal-role attributes identical functions, while etiological attributes divergent ones.  

  **Part 3: Repair Assessment**  
  The proposed repair—anchoring function to what mantles "typically do in the species"—collapses into the etiological account and fails to deliver mutant malfunction.  
  - **Collapse into etiology**: "Typical" behavior implies a statistical or historical norm. For W, "typical" must reference wild populations, where the mantle’s most common selective history is phage resistance. For L, "typical" reflects lab-selected desiccation tolerance. This smuggles in historical norms, reducing causal-role to etiological criteria. The repair abandons causal-role’s core tenet (interest-relative analysis) by substituting "typicality," which is either arbitrary (if not historical) or etiological (if based on lineage).  
  - **Failure on malfunction**: The mutant retains all typical mantle effects *except* desiccation tolerance. Under the repair:  
    - In L, desiccation tolerance is "typical," so the mutant malfunctions by failing to confer it.  
    - In W, however, desiccation tolerance is *not* "typical" (as phage resistance defines the historical norm). The mutant still performs stiffness, nitrogen release, etc.—all "typical" W effects. Thus, in W, the mutant shows *no malfunction*: it contributes identically to all capacities a wild analyst might prioritize (e.g., osmotic stability). Only by illicitly borrowing L’s "typical" desiccation tolerance (importing history) can malfunction be assigned in W. The repair cannot ground norms for malfunction without circularly relying on etiology.  

  **Part 4: Pluralism Verdict**  
  The case does *not* license pluralism. Part 3 exposes an irreconcilable conflict: malfunction requires normative standards that causal-role cannot provide without etiological criteria. In W, the mutant’s failure under drying is malfunction *only* if desiccation tolerance is normative. Yet for causal-role (even repaired), norms are interest-relative: if analysts prioritize osmotic stability (unaffected in mutants), no malfunction exists. Etiology, conversely, grounds malfunction objectively: in L, mutants fail at their selected function (desiccation tolerance); in W, they fail at nothing selected (only a novel pressure). Adopting pluralism here obscures this normative gap, mistaking a theoretical defect for compatibility. Function attributions must explain malfunction robustly—etiology succeeds, causal-role fails.  

  ---

  ### Marking Scheme (25 marks)  
  **Part 1: Function Attribution (6 marks)**  
  - *Etiological in W* (1.5 marks):  
    - ✓: Phage resistance *only* (historical selection).  
    - ✗: Includes desiccation/stiffness/etc. (ignores history).  
  - *Etiological in L* (1.5 marks):  
    - ✓: Desiccation tolerance *only* (artificial selection).  
    - ✗: Includes phage resistance (ignores L’s distinct history).  
  - *Causal-Role in W/L* (3 marks):  
    - ✓: All effects listed as functions (capacity contributions).  
    - ✗: Omits ≥1 effect or imports history (e.g., "only desiccation").  

  **Part 2: Theoretical Disagreement (4 marks)**  
  - ✓: Identifies history-dependence (etiological) vs. current contributions (causal-role) (2 marks).  
  - ✓: Notes identical molecules/mutant behaviors force causal-role identity but etiological difference (2 marks).  
  - ✗: Attributes disagreement to "context" without theoretical criteria.  

  **Part 3: Repair Assessment (10 marks)**  
  - *Choice of (i) or (ii)* (1 mark): ✓ Clear selection.  
  - *Collapse into etiology* (if chosen) (5 marks):  
    - ✓: "Typical" implies historical/statistical norms (3 marks).  
    - ✓: Reduces to etiological criteria (2 marks).  
    - ✗: Treats "typical" as non-historical.  
  - *Failure on malfunction* (if chosen) (5 marks):  
    - ✓: In W, mutant performs all "typical" effects; no malfunction (3 marks).  
    - ✓: Repair requires borrowing L’s norm for W (2 marks).  
    - ✗: Assumes desiccation is "typical" in W.  
  - *Defense depth* (4 marks): ✓ Uses case details (e.g., mutant in W vs. L; identical molecules).  

  **Part 4: Pluralism Verdict (5 marks)**  
  - ✓: Rejects pluralism (1 mark).  
  - ✓: Cites Part 3’s malfunction conflict (2 marks).  
  - ✓: Explains normative gap in causal-role (2 marks).  
  - ✗: Advocates pluralism without addressing malfunction.  

  ---

  ### Differentiation: First-Class vs. Competent Second-Class Scripts  
  A **first-class script** (≥20 marks) isolates the *normalization problem*: it proves that causal-role’s "repair" cannot ground malfunction non-circularly (e.g., noting mutants in W lack a selected failure point) and identifies how "typicality" smuggles in history. It uses the case symmetrically (e.g., contrasting mutant outcomes in W vs. L) to force theoretical tensions. A **competent second-class script** (14–19 marks) accurately applies both accounts to the case but misses the depth of Part 3’s collapse/failure. It may note the malfunction challenge superficially (e.g., "norms are tricky") without showing *why* the repair’s norms are arbitrary or etiological, or it defends pluralism weakly by listing differences rather than conflicts.
