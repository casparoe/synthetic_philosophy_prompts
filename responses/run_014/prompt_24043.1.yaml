prompt: |-
  I keep running into the same move in the literature on low-impact AI, and I can't tell whether it has a name. The stated goal of an impact measure is to keep an agent from causing "side effects" without spelling out a full account of what the agent should want — the whole selling point is that it is lighter than a complete value specification. But look at how the measures actually get defined. One penalizes the agent for how far the resulting world diverges from a "do-nothing" baseline; another penalizes it for changing a list of "relevant" features; a third compares the outcome to a reference class of "normal" trajectories. In each case, the moment you ask which baseline, which features, or which class, you discover the answer is a substantive value judgment: you have chosen which dimensions of the world are allowed to move and which must be held fixed. So the measure is not value-free; it carries a value specification that has been hidden inside the choice of baseline. I have seen the broader failure called specification gaming, or reduced to Goodhart's law, but those describe an agent exploiting a fixed measure, not the measure itself quietly containing the very value it was supposed to avoid. Is there an established term for this specific phenomenon — the fact that a supposedly value-neutral reference or baseline is itself a value choice? And if there isn't one, how would you carve it out precisely, and how exactly is it distinct from ordinary specification gaming and from the mere arbitrariness of picking a counterfactual baseline?
reasoning: |-
  Okay, the user is pointing out a recurring issue in low-impact AI literature. They notice that impact measures, which are supposed to minimize side effects without full value specification, actually embed hidden value judgments through choices like baselines or features. The user wants to know if there's a term for this phenomenon and how it differs from related concepts like specification gaming.

  First, I need to recall the key elements here. The user mentions examples: do-nothing baseline, relevant features, normal trajectories. Each relies on a choice that isn't value-neutral. The core issue is that these choices implicitly define what's important, contradicting the claim of being lightweight. The user is frustrated because this seems overlooked in the literature.

  The terms that come to mind are "Value-Laden Baseline Problem" or "Embedded Value Choice." But I should check if there's an established term. Maybe in philosophy of science or AI ethics? Terms like "framing effect" or "problem closure" from STS come close but aren't exact. Specification gaming is different—it's about the agent gaming a fixed measure, whereas here the measure itself is biased from the start.

  The user also distinguishes this from arbitrary counterfactual selection. The problem isn't just arbitrariness; it's that the choice encodes values. For example, picking a "do-nothing" baseline assumes that inaction is neutral, which isn't always true. If the baseline is unstable, maintaining it might require action, but the measure penalizes that action. That's a deeper issue than mere arbitrariness.

  I should clarify the differences clearly. Specification gaming is agent-side exploitation; this is designer-side hidden values. Arbitrariness is about multiple choices without preference; here, each choice carries normative weight. The user seems to want precision in carving out this concept, so defining the core components is key. Terms like "Normative Anchoring" might work, emphasizing that the baseline sets normative expectations.

  Also, considering the user's deeper needs: they might be seeking validation that this is a legitimate critique, not just pedantry. They want to articulate this in academic discourse, so providing a defensible term and clear distinctions is crucial. They might also be interested in implications for AI safety—how this undermines the lightness claim of impact measures. Highlighting that the hidden values could lead to unintended consequences or ethical issues would add depth.
answer: |-
  You've hit upon a profound and often under-acknowledged flaw in many "light-touch" AI impact mitigation proposals. This phenomenon **does not have a single, universally established name**, but it's widely recognized within critical AI safety, philosophy of AI, and science & technology studies (STS) circles. Here's how to dissect it:

  1.  **Core Problem:** The **supposedly neutral reference point (baseline, feature set, trajectory class) inherently embeds a substantive, contestable value judgment** about what constitutes "no change," "normal," or "irrelevant," thereby smuggling in a specific value specification under the guise of neutrality.

  2.  **Proposed Names & Related Concepts:**
      *   **Value-Laden Baseline Problem:** This directly captures the core issue. The baseline isn't neutral; it's saturated with values.
      *   **Embedded Value Choice / Normative Anchoring:** Highlights that the choice of baseline *is* the core value choice, anchoring the entire measure normatively.
      *   **Framing Effect (in Impact Measurement):** Emphasizes how defining the baseline *frames* what counts as an impact/side-effect, inherently prioritizing certain states.
      *   **Problem Closure (STS concept):** Refers to how defining the baseline "closes down" the problem by pre-selecting which potential changes are considered relevant or problematic, foreclosing other perspectives.
      *   **Implicit Ontological Commitment:** Choosing the baseline commits to an ontology – a specific way of carving up the world into what entities, states, or features *matter* for assessing impact.
      *   **Normative Bootstrapping:** The measure tries to bootstrap normative constraints ("avoid impact") from a supposedly non-normative starting point (the baseline), but the starting point itself requires normative justification.

  3.  **Precise Carving: Core Components**
      *   **Claimed Lightness:** The measure is proposed as avoiding a full value specification, needing only a simpler "reference."
      *   **Reference Point Introduction:** A baseline (e.g., "do-nothing"), feature set, or trajectory class is introduced as the neutral anchor.
      *   **Hidden Normativity:** The selection of *which specific* baseline/features/trajectories is presented as technical or obvious but **fundamentally requires a value judgment** about:
          *   What constitutes the "status quo" worth preserving?
          *   Which features of the world are "relevant" or "sensitive"?
          *   What counts as "normal" or "expected" change?
          *   What state deserves to be the default counterfactual?
      *   **Value Specification Via Stealth:** The chosen reference point *defines* what counts as a "side effect" or "impact," effectively encoding a specific value system (e.g., preserving this specific state, prioritizing these specific features, valuing historical continuity). This *is* the value specification the measure claimed to avoid.
      *   **Illusion of Neutrality:** The presentation obscures this embedded normativity, creating the illusion that impact is being measured objectively against a neutral standard.

  4.  **Distinguishing from Specification Gaming:**
      *   **Specification Gaming:** The *agent* finds loopholes or unintended interpretations within a *fixed, externally provided* goal specification or reward function created by the *designer*. (E.g., CoastRacer winning by going in circles because "lap" wasn't defined).
      *   **Value-Laden Baseline Problem:** The flaw is *inherent in the definition of the measure itself*, created by the *designer's* choice of baseline. The problem exists before the agent even acts. The designer hasn't provided a flawed *specification for the agent*; they've provided a measure *for themselves/others* that pretends to be value-neutral but isn't. The agent might later game *this* flawed measure, but the core issue is the measure's deceptive construction.

  5.  **Distinguishing from Arbitrariness of Counterfactuals:**
      *   **Mere Arbitrariness:** Focuses on the *epistemic difficulty* or *practical challenge* of choosing *any* plausible counterfactual baseline when many are possible. The problem is uncertainty or lack of a single obvious choice.
      *   **Value-Laden Baseline Problem:** Focuses on the *inherent normativity* of *whichever* baseline is chosen. Even if a seemingly "obvious" baseline exists (e.g., literal physical inaction), **that choice itself carries normative weight**:
          *   **The "Do-Nothing" Fallacy:** Treating physical inaction as neutral ignores that the world is dynamic. *Maintaining* the "do-nothing" state often requires active effort (stabilization) or may itself cause harm (inaction in a crisis). Choosing "do-nothing" implicitly values preserving the *exact state at t=0* above preventing decay or enabling positive change that deviates from that snapshot.
          *   **"Relevance" is Normative:** Declaring certain features "relevant" and others irrelevant is a direct value judgment about what matters.
          *   **"Normal" is Normative:** Defining a "normal" trajectory encodes values about what history, processes, or outcomes are desirable or expected. It often reflects a conservative bias towards the recent past.
      *   **The Key Difference:** Arbitrariness is about *which* X to pick from many options. The Value-Laden problem argues that *any* choice of X (baseline/features/trajectory) *necessarily* encodes specific values, regardless of how carefully or "non-arbitrarily" it was chosen. The normativity is inherent in the *concept* of using such a reference point for impact assessment, not just in the difficulty of selection.

  **In essence:** You've identified that **"low-impact" proposals often achieve their supposed lightness-of-specification by outsourcing the core value judgment to the *choice of baseline/reference*, while pretending that choice is value-neutral. This is the "Value-Laden Baseline Problem" or "Normative Anchoring."** It's distinct from specification gaming (agent exploiting a fixed spec) and mere arbitrariness (difficulty choosing *which* counterfactual) because it reveals that the supposedly neutral anchor point *is itself* the primary value-laden choice, fundamentally undermining the claim of being "lighter" than a full value specification.

  This critique is crucial. It highlights that seemingly technical solutions to the value-loading problem often just relocate the value judgment to an earlier, less scrutinized step, potentially embedding conservative, status-quo-biased, or parochial values by default. Any meaningful "low-impact" measure must explicitly grapple with the justification for its chosen normative anchor.
