prompt: |-
  I'm the person who ended up with the made-up title of "narrative standards reviewer" at a mid-size game studio — basically I read every mission script, trailer line, and achievement description for our war games and flag stuff before it goes up to the creative director, who has final say. We're about a year out from shipping a realistic-ish contemporary-war single-player campaign, and I get maybe six to eight mission beats a month across my desk plus marketing copy, with roughly 45 minutes per beat. The people writing these are good writers with zero philosophy background, and they hate being told "it's complicated," so whatever I hand them has to be runnable: a list of questions in a fixed order, what counts as a passing answer to each, the points where the thing just gets a no, and the points where it has to kick upstairs to the creative director because it's a values call and not something a checklist can settle.

  The reason I need this is that the studio has an official house principle we've been operating under, which I'll call the Symmetry Default: unless a beat explicitly earns an exception, combatants on both sides get presented as equally entitled to be fighting and equally worth mourning, and the game never invites the player to condemn an individual enemy soldier on account of whose war he's serving in. It was a deliberate choice. We got hammered a few years back by an academic who said our "everyone's just a soldier doing his job" framing effectively laundered an invasion, and then last year by a veterans group who said the mission that lingered on one enemy conscript's life treated our own guys as objects with no interiority, and I still cant articulate why both complaints are aimed at the same underlying argument. The philosophy underneath it, as best I understand: there's the older view that soldiers on either side of a war stand in the same moral position, that a man fighting for an unjust cause isn't a criminal because he's acting as the instrument of a state inside a set of conventions everyone benefits from, and that this equality is what makes the rules of war workable at all — you can't get an army to accept limits on how it fights while simultaneously telling its soldiers they're murderers for showing up. And then there's the revisionist line that liability to be killed tracks whether the threat you pose is itself justified, so a soldier fighting a war of aggression doesn't really have a moral right to kill the people defending themselves, and the symmetry is a legal and practical fiction rather than the truth, its a thing we agree to pretend, not a thing that's so. I don't need the procedure to referee that argument or point me at anybody to read. I need it to be honest about which side of the argument our Symmetry Default is quietly smuggling in, and to tell a writer when a beat can keep leaning on the default and when the default is going to produce something false or ugly.

  So: write me the procedure. Questions in a fixed order, each with a short note on what a good answer looks like and what a non-answer looks like, the places where it stops at cut-or-rewrite, and the places where it hands the decision to a human because it's judgment wearing a checklist costume — mark those explicitly rather than burying them. Then run it on three things that are actually sitting on my desk right now. One: a mission where the player's side is clearly the invader and the setpiece is a night raid on a checkpoint held by very young conscripts, shown joking around and reading letters home, with no dialogue indicating they know their country started it. Two: a mission where the enemy commander the player finally kills has been established across four hours of play as personally responsible for massacres, including against his own people. Three: a trailer line, something like "no heroes, no villains, only survivors," laid over a montage that cuts between both armies. At least one of those should come out in a way I'm not going to like — I'd rather the procedure bite on our signature beat than flatter us. And finish with what the procedure flat out can't do: the cases where two honest writers will run it and land in different places, the beats it will misjudge, and the spots where it's really just encoding my taste and calling it method.
reasoning: |-
  Okay, the user is a "narrative standards reviewer" at a game studio working on a realistic contemporary war game. They need a structured procedure to evaluate mission scripts, trailer lines, etc., based on their studio's "Symmetry Default" principle. This principle states that both sides should be presented as equally entitled to fight and equally worth mourning, unless explicitly earned otherwise. 

  The user has faced criticism from both an academic and a veterans group, highlighting a tension they can't fully articulate. They mentioned two philosophical views: the traditional symmetry in war ethics and the revisionist view that questions moral equality for aggressors. 

  The user needs a practical checklist that:
  1. Honestly identifies which philosophical stance the Symmetry Default aligns with (spoiler: it's the traditional one).
  2. Flags when leaning on the default creates narrative problems (false/ugly outcomes).
  3. Provides clear pass/fail criteria and escalation points.
  4. Is applied to three real examples (invasion mission, war criminal kill, trailer line).

  I should design the procedure as a step-by-step questionnaire with:
  - Specific questions in fixed order
  - Notes on good/bad answers
  - Clear "cut/rewrite" triggers
  - Marked "human judgment" points
  - Brutally honest application to their examples (especially making one fail)

  The procedure must also confess its limitations:
  - Where subjectivity creeps in
  - Cases it can't resolve
  - Where it's just codifying personal taste

  Key philosophical insight: The Symmetry Default implicitly endorses the traditional view (moral equality of soldiers) by making it the baseline. The revisionist view would require explicit justifications for symmetry.

  For the three test cases:
  1. Invasion mission (young conscripts): Should FAIL - default creates false equivalence
  2. War criminal kill: Should PASS with notes - default doesn't apply to commanders
  3. Trailer line: Should FAIL - "no heroes/villains" undermines established atrocities

  The limitations section needs to highlight:
  - Subjectivity in "justified asymmetry" calls
  - Tone/context judgment calls
  - Inability to resolve thematic coherence
  - Personal bias in "ugly" determinations

  I should structure this like a real QA checklist - something the user can literally print and use. The tone should be professional but acknowledge the underlying tensions (e.g., "This is where we admit our Default isn't neutral").
answer: |-
  Here's your narrative evaluation procedure, designed as a runnable checklist with explicit judgment flags, limitations disclosure, and brutal honesty about your studio's philosophical position. The Symmetry Default **explicitly endorses the traditional view of moral equality among soldiers** (the "instrument of the state" argument). It treats revisionism (liability tracks justification) as the exception requiring explicit narrative justification.

  ---

  ### **Narrative Standards Evaluation Procedure v1.0 (Symmetry Default)**  
  **Core Principle:** *Unless explicitly earned, all combatants are morally equal: equally entitled to fight, equally worth mourning. Individual condemnation requires personal wrongdoing (beyond following orders).*  

  #### **Questions (Fixed Order):**  
  1. **"Does this beat involve combatants as active participants?"**  
     - *Good Answer:* Clearly identifies which characters are combatants (e.g., "enemy conscripts," "friendly spec-ops").  
     - *Non-Answer:* Vague terms like "people," "fighters," or "characters" without context.  
     - **→ If NO:** Exit procedure (not applicable). **→ If YES:** Proceed.  

  2. **"Does the beat depict actions/personality of individual combatants?"**  
     - *Good Answer:* Lists specific depictions (e.g., "enemy soldiers joke while cleaning weapons," "friendly sniper hesitates before shot").  
     - *Non-Answer:* "Shows soldiers as human" (too vague).  
     - **→ If NO:** Symmetry Default applies automatically. **PASS**.  
     **→ If YES:** Proceed.  

  3. **"Do any combatants commit *personal* atrocities (torture, massacre of civilians, war crimes) *as individuals*?"**  
     - *Good Answer:* Cites specific scripted acts (e.g., "Commander executes prisoner").  
     - *Non-Answer:* "They’re the invading army" (collective guilt).  
     - **→ If YES:** Symmetry Default **DOES NOT APPLY** to those individuals. Proceed to Q4.  
     **→ If NO:** Proceed to Q5.  

  4. **[JUDGMENT CALL]** "Does the beat *unambiguously* frame the atrocity as condemnable?"  
     - *Good Answer:* Script/direction shows consequence, victim POV, or explicit condemnation.  
     - *Non-Answer:* Glorifies the act or treats it as "badass."  
     - **→ PASS if clear condemnation; REWRITE if ambiguous; ESCALATE to Creative Director if condemnation risks tone misalignment.**  

  5. **"Does the beat *explicitly* assign collective guilt (e.g., 'they deserve this for starting the war')?"**  
     - *Good Answer:* Quotes dialogue/narration (e.g., "Intel says these conscripts volunteered for the invasion").  
     - *Non-Answer:* "They’re the enemy faction."  
     - **→ If YES:** REWRITE (violates Symmetry Default). **→ If NO:** Proceed.  

  6. **[JUDGMENT CALL]** "Does the beat *accidentally* imply collective guilt through framing, tone, or contrast?"  
     - *Red Flags:*  
       - Only one side gets humanizing details (e.g., only enemy conscripts read letters home; friendlies are voiceless).  
       - Player faction acts defensively; enemy faction acts aggressively *without* Q3 atrocities.  
       - Music/cinematography glorifies player actions while vilifying identical enemy actions.  
     - *Good Answer:* Notes symmetric framing (e.g., "both sides shown as tired; similar lighting").  
     - **→ PASS if symmetric; REWRITE if asymmetric; ESCALATE if asymmetry is intentional (requires CD approval).**  

  7. **"Does the beat mourn combatant deaths?"**  
     - *Good Answer:* Identifies method (e.g., "slow-mo funeral shot," "ally says 'they had families'").  
     - *Non-Answer:* "It’s war, so deaths are sad."  
     - **→ If NO:** Proceed.  
     **→ If YES:** Proceed to Q8.  

  8. **"Is mourning applied equally to both sides?"**  
     - *Good Answer:* Compares examples (e.g., "friendly and enemy deaths both get quiet score").  
     - *Non-Answer:* "We mourn all soldiers."  
     - **→ If YES:** PASS. **→ If NO:** REWRITE (violates Default).  

  ---

  ### **Application to Your Cases**  

  #### **Case 1: Night Raid on Young Conscripts**  
  - Q1: **YES** (enemy conscripts).  
  - Q2: **YES** (joking, reading letters).  
  - Q3: **NO** (no personal atrocities).  
  - Q5: **NO** ("no dialogue indicating they know their country started it" → avoids collective guilt).  
  - Q6: **[JUDGMENT CALL]** **FAIL**. *Why:* Humanizes *only* enemy conscripts (letters, camaraderie). Player’s faction (invaders) get no equivalent interiority → implies "our side are faceless tools; theirs are tragic victims." **VERDICT: REWRITE.** Add parallel scene showing player’s squad as equally human *before* raid.  

  #### **Case 2: Killing the Enemy Commander (Personal Atrocities)**  
  - Q1: **YES** (commander).  
  - Q2: **YES** (established across 4 hours).  
  - Q3: **YES** (massacres, including own people).  
  - Q4: **[JUDGMENT CALL]** **PASS**. *Why:* Commander is individually culpable. Symmetry Default doesn’t apply. *Risk:* If his death isn’t framed as justice (e.g., player tortures him), it may violate studio tone. **Recommendation:** Ensure death scene emphasizes consequence, not catharsis → **ESCALATE to CD for tone check.**  

  #### **Case 3: Trailer Line ("No heroes, no villains, only survivors")**  
  - Q1: **YES** (montage of both armies).  
  - Q2: **NO** (no individual actions depicted).  
  - Q5: **NO** (no collective guilt).  
  - Q6: **[JUDGMENT CALL]** **FAIL**. *Why:* Line claims moral equivalence ("no villains"), but montage includes factions where one is the *established aggressor*. Revisionists would argue aggressors *are* morally distinct → **Default smuggles in traditional view, but line states it as universal truth.** **VERDICT:** REWRITE. Trailer can *show* symmetry (montage) but can’t *declare* it as fact without clashing with story. Try: "In war, survival has many faces."  

  ---

  ### **What the Procedure Can’t Do**  
  1. **Judge Tone Nuance:** Two writers may agree a beat "condemns an atrocity" (Q4) but disagree on whether it feels exploitative vs. sobering.  
  2. **Resolve Thematic Conflicts:** If a mission *requires* collective guilt for historical accuracy (e.g., depicting Nazis), the procedure will flag it as "REWRITE" → Human override needed.  
  3. **Define "Ugly":** Calling a beat "ugly" is subjective taste masked as method (e.g., lingering on a child soldier’s death may be "honest" to one writer, "gratuitous" to another).  
  4. **Handle Meta-Narratives:** The procedure evaluates beats in isolation. A beat may pass alone but undermine symmetry when *contrasted* with others (e.g., only enemies get PTSD scenes).  
  5. **Override Creative Direction:** If the CD *wants* a mission to vilify conscripts, the procedure can’t stop it—only force an "ESCALATE" paper trail.  

  **Final Note:** This procedure exposes your Default as a *defense* of traditional soldierly innocence. When writers chafe at its constraints, remind them: **You’re not asking them to avoid moral complexity—you’re asking them to *earn* asymmetry.** The Default is the baseline; violating it demands the same rigor as any other narrative choice.
