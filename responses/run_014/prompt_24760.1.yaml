answer: |-
  Here's a precise principle capturing your verdicts, resolving the Newton/caloric tension, and showing how it strengthens (but doesn't fully "save") the no-miracles defense:

  **The Structural Continuity Principle (SCP):**
  An unobservable posit *P* of a successful but superseded theory *T_old* **survives** in successor theory *T_new* if and only if:
  1.  **Referential Continuity:** *P* (or its core defining properties/relations) is *directly referential* within *T_old*'s framework (i.e., it wasn't purely an eliminable calculational device or misidentified placeholder).
  2.  **Pattern Preservation:** The *causal-structural role* played by *P* within the domain of *T_old*'s empirical success is preserved in *T_new*, either by:
      *   *(a) Entity Survival:* An entity in *T_new* ontologically corresponds to *P* and plays a sufficiently similar role.
      *   *(b) Emergent Realization:* The *structural pattern* of interactions/behaviors associated with *P* emerges in *T_new* under relevant conditions (often as a limit or approximation), even if realized by fundamentally different entities/mechanisms.
  3.  **Explanatory Fidelity:** *T_new* explains the success of *T_old* *primarily by invoking the preserved structure/pattern/entity* (clause 2), not merely by showing *T_old* was accidentally correct or by invoking wholly unrelated features.

  **Applying SCP to Your Cases:**

  1.  **Newtonian Gravitation (Mass, Gravity, Spacetime) -> GR: SURVIVAL**
      *   *(Ref Cont):* Mass, gravity (force), absolute space/time were intended as fundamental referents.
      *   *(Pattern Pres - b):* The *structural pattern* of gravitational attraction (inverse square law, orbits, tides) emerges perfectly in the weak-field, low-velocity limit of GR. Mass-energy sources curvature, which dictates geodesics – preserving the causal structure of motion under gravity. Spacetime geometry (though radically reconceived) preserves the structural role of the arena.
      *   *(Exp Fid):* GR *explains* Newton's success *by* showing how its structural pattern emerges from curvature in specific limits.

  2.  **Phlogiston -> Oxygen Theory: NO SURVIVAL**
      *   *(Ref Cont FAIL):* Phlogiston was intended as a fundamental substance released during combustion/calcination. However, its core defining properties (negative mass, principle of inflammability) were fundamentally mistaken referents.
      *   *(Pattern Pres FAIL):* The purported causal-structural role (substance *leaving* during combustion) is *reversed* (oxygen *joining*). No entity or structural pattern in oxygen theory corresponds to phlogiston's role.
      *   *(Exp Fid FAIL):* Oxygen theory explains the old successes (weight gain in calcination, smelting) by invoking oxygen absorption/release, wholly unrelated to phlogiston.

  3.  **Caloric -> Kinetic Theory: PARTIAL SURVIVAL (Temp, Heat Flow, Equilibrium) / NO (Caloric Fluid)**
      *   **Caloric Fluid: NO SURVIVAL**
          *   *(Ref Cont):* Caloric was intended as a fundamental fluid/substance.
          *   *(Pattern Pres FAIL):* Its purported causal-structural role (conserved substance flowing from hot to cold) is *fundamentally incorrect*. Heat is kinetic energy, not a conserved fluid; flow is statistical, not substance transfer.
          *   *(Exp Fid FAIL):* Kinetic theory explains phenomena by molecular motion, not by invoking anything resembling caloric flow.
      *   **Temperature, Heat Flow, Thermal Equilibrium: SURVIVAL**
          *   *(Ref Cont):* These were core referential concepts describing states and processes.
          *   *(Pattern Pres - b):* The *structural patterns* are preserved: Temperature corresponds to mean kinetic energy (preserving ordering/equilibrium conditions). Heat flow corresponds to net energy transfer due to microscopic collisions/radiation (preserving directionality and equilibrium tendencies). Thermal equilibrium emerges statistically.
          *   *(Exp Fid):* Kinetic theory explains why these patterns held in caloric theory *by* showing how they emerge statistically from molecular motion.

  4.  **Luminiferous Aether -> SR: NO SURVIVAL (Aether) / SURVIVAL (EM Field)**
      *   **Aether: NO SURVIVAL**
          *   *(Ref Cont):* Intended as fundamental medium.
          *   *(Pattern Pres FAIL):* Its purported causal-structural role (absolute rest frame, mechanical wave medium) is *eliminated*. SR has no privileged frame; EM waves are fundamental excitations of the field, not vibrations of a medium.
          *   *(Exp Fid FAIL):* SR/EM explains the success of aether-based EM *despite* the aether, by showing Lorentz invariance and field ontology suffice.
      *   **EM Field: SURVIVAL**
          *   *(Ref Cont):* EM field was a core posit in aether-based EM (Maxwell).
          *   *(Pattern Pres - a):* The EM field entity itself survives fundamentally intact in SR/Relativistic EM, playing the *identical causal-structural role* in describing forces and radiation. (Its transformation properties are refined, but its core role is preserved).
          *   *(Exp Fid):* SR/EM explains the success of Maxwell's theory *by* preserving the field ontology and laws (modulo relativity).

  5.  **Miasma -> Germ Theory: NO SURVIVAL (by SCP)**
      *   *(Ref Cont):* Miasma was intended as a fundamental referent (poisonous air/vapors).
      *   *(Pattern Pres FAIL):* Its purported causal-structural role (disease caused by *qualities* of bad air originating from decay) is *fundamentally incorrect*. Germs are specific *entities* transmitted by various routes (not inherently tied to "bad air").
      *   *(Exp Fid FAIL):* Germ theory explains disease patterns by specific pathogens and transmission mechanisms, not by invoking miasmatic qualities. The *very weak* similarity ("invisible agents") fails clause 2 – the causal *mechanism* and *nature* of the "agent" is utterly different. Miasma was about *air quality*; germs are about *biological agents*.

  **Resolving the Newton/Caloric Contrast:**
  *   **Newton:** The *structural pattern* of gravitational interaction (clause 2b) is preserved *exactly* in the relevant limit. The *equations* surviving is strong evidence for pattern preservation.
  *   **Caloric Fluid:** There is *no* preserved structural pattern corresponding to a conserved fluid substance flowing from hot to cold. The *equations* (e.g., Fourier's heat equation) survive, but they describe the *emergent pattern* (heat flow/temp gradient), not the *ontological posit* (caloric fluid). SCP distinguishes between the survival of *patterns* (clause 2b - temp/flow) and the survival of *specific ontological posits* (clause 2a - caloric fluid fails). Newton's masses/spacetime pass 2b; caloric fluid fails completely.

  **Application: Electron in Classical E&M -> Quantum Field Theory (QFT)**
  *   *(Ref Cont):* The classical electron was intended as a fundamental point particle with charge and mass.
  *   *(Pattern Pres):* **PARTIAL/B QUALIFIED SURVIVAL.** The *structural pattern* of a localized source of charge interacting via the EM field *emerges* in QFT. The electron is a fundamental excitation (quantum) of the electron field. Its charge, spin, and lepton number are preserved. Its interactions (Coulomb law, radiation) emerge from QED in appropriate limits (e.g., non-relativistic, tree-level). *However*, key aspects change: it's fundamentally a field excitation, not a point particle; its position/momentum obey uncertainty; self-energy/infinitudes are handled differently; virtual processes exist. The *core causal-structural role* (source of EM field, responds to EM field, carrier of charge/spin) is preserved, but the *nature* of the entity and its dynamics are quantum/field-theoretic.
  *   *(Exp Fid):* QFT explains the success of classical E&M (e.g., atomic spectra, circuits, radiation) *by* quantizing the fields and showing how classical behavior emerges statistically or in macroscopic limits, preserving the electron's role.
  *   **SCP Verdict:** **SURVIVAL (via Clause 2b - Emergent Realization of the Pattern/Role).** The electron *as a specific fundamental particle with charge* survives, though its ontological nature is quantum-field-theoretic. This is analogous to how mass/spacetime survive structurally in GR, not as Newtonian absolutes.

  **Which of Your Verdicts Does SCP Challenge?**
  *   **Miasma:** SCP clearly dictates **NO SURVIVAL**. Your uncertainty is resolved against survival. The "weak sense" of invisible agents is insufficient; the causal-structural role (bad air -> disease) is fundamentally misidentified compared to germs (specific pathogen -> specific disease via specific transmission).
  *   **Caloric Partial:** SCP *supports* your partial verdict but *refines* it: Caloric fluid definitely **NO**, Temperature/Heat Flow/Equilibrium definitely **YES (Pattern Survival)**. Your uncertainty about calling it "partial" is justified; it *is* partial, but with a clear distinction *why* (entity vs. pattern).

  **Impact on No-Miracles and "Roughly True":**
  1.  **Strengthens No-Miracles:** SCP replaces the vague "roughly true" with the more precise "structurally continuous." The "miracle" is that successful theories consistently latch onto *causal-structural patterns in nature* that persist across theory change (Clause 2b), even when specific ontologies change (Clause 2a failures). This explains success without requiring full referential truth. The survival of *patterns* (Newtonian gravity, temperature, EM field, electron charge) is non-miraculous if they reflect reality.
  2.  **Shows "Roughly True" is Problematic but Salvageable:** "Roughly true" *is* vague, often conflating entity survival (rare) with pattern survival (common). SCP disentangles this. It shows that the *core realist intuition* – that success indicates contact with reality – is defensible if focused on *preserved structure* (Structural Realism). However, it concedes that "truth" about *specific unobservable entities* (phlogiston, caloric fluid, aether) is often *not* preserved. "Roughly true" needs reinterpretation as "capturing approximately correct *structural relations* within its domain."
  3.  **Doesn't Fully Invalidate Pessimism:** The pessimist can still argue: (a) Future theories might break *all* structural continuities (unlikely given history), or (b) SCP itself might be abandoned. However, SCP provides a robust, historically grounded defense against the strongest pessimistic induction by showing *what kind* of continuity exists and why it supports realism about structure.

  **In essence:** SCP provides a precise principle matching your judgments, resolves your core tension by distinguishing entity vs. pattern survival via limiting cases, rejects miasma survival, supports electron survival structurally, and refines the no-miracles argument towards structural realism, acknowledging but mitigating the vagueness of "roughly true."
