answer: |-
  Below is a complete in-class activity designed to experientially introduce the discursive dilemma (doctrinal paradox) without pre-lecture. Students will discover the inconsistency through voting and tallying, followed by a structured debrief.

  ---

  ### **Scenario: "TechSafe Surveillance System"**
  **Context**: A university committee must decide whether to install AI-powered security cameras in dorm common areas.  
  **Policy**: Installation requires two conditions:  
  1. **P1 (Privacy Standard)**: The system must comply with *all* campus privacy guidelines.  
  2. **P2 (Effectiveness Standard)**: The system must reduce reported thefts by *at least 30%* based on pilot data.  
  **Conclusion (C)**: Install the system.  

  **Logical Rule**: C is approved *only if both P1 and P2 are true* (C ≡ P1 ∧ P2). Share this policy on the board.  

  ---

  ### **Procedure**  
  1. **Distribute Role Cards (5 min)**:  
     Give each student 1 of 4 card types (preassigned to ensure vote distribution). Cards include:  
     - **Type A (4 students)**: Believes P1 *true*, P2 *true* → Supports installation (C *true*).  
       *"Pilot data shows 35% theft reduction; system encrypts all data per guidelines."*  
     - **Type B (5 students)**: Believes P1 *true*, P2 *false* → Opposes installation (C *false*).  
       *"System encrypts data (meets privacy), but pilot data only shows 15% theft reduction."*  
     - **Type C (5 students)**: Believes P1 *false*, P2 *true* → Opposes installation (C *false*).  
       *"Pilot data shows 40% theft reduction, but system shares data with police (violates privacy)."*  
     - **Type D (2 students)**: Believes P1 *false*, P2 *false* → Opposes installation (C *false*).  
       *"Data sharing violates privacy; theft reduction only 10%."*  

  2. **Voting Rounds (15 min)**:  
     - Vote **secretly via paper slips** for P1, P2, and C *separately*. Tally each publicly:  
       - **P1**: "Does the system meet all privacy guidelines?"  
       - **P2**: "Did thefts decrease by ≥30% in the pilot?"  
       - **C**: "Should the system be installed?"  
     - **Tally Predictions**:  
       - P1: A(4Y) + B(5Y) = **9 Yes** (majority: 9/16)  
       - P2: A(4Y) + C(5Y) = **9 Yes** (majority: 9/16)  
       - C: A(4Y) = **4 Yes** vs. 12 No → **12 No** (majority: 12/16).  

  3. **Reveal & Discuss Inconsistency (10 min)**:  
     - Show tallies. Ask: *"The majority approved P1 and P2. Why did the majority reject C?"*  
     - Let students notice: Policy requires *both* P1 and P2 for C, but only 4 students (Type A) met both.  

  ---

  ### **Debrief: Mapping to the Discursive Dilemma (15 min)**  
  1. **Formal Structure**:  
     - **Premises**: P1, P2 (logically independent).  
     - **Conclusion**: C = P1 ∧ P2 (C true *iff* both premises true).  
     - **Individual Judgments**: Each student consistently applied the policy (e.g., Type B: P1∧¬P2 → ¬C).  
     - **Aggregation Problem**:  
       - Majority voting on *each proposition*: P1 (9Y), P2 (9Y) → C *should* be 9Y.  
       - Majority voting on *conclusion*: C (4Y) → Contradiction.  

  2. **Core Insight**:  
     - The group accepted the premises but rejected the conclusion *despite the logical rule*.  
     - Cause: **Premise-based vs. conclusion-based aggregation** produce conflicting outcomes.  
       - Premise-based: "If P1 and P2 pass, C must pass" (logical but overrides direct C vote).  
       - Conclusion-based: "Follow the direct C vote" (ignores premise logic).  
     - **Paradox**: No aggregation method satisfies all democratic criteria (e.g., majority rule + logical consistency).  

  ---

  ### **Predictable Challenges & Mitigations**  
  1. **Students don’t notice inconsistency**:  
     - *Mitigation*: Ask leading Qs: *"How many approved P1? P2? If both passed, what should C be? What was the actual C vote?"*  

  2. **Students challenge the logical rule**:  
     - *Mitigation*: Stress the policy upfront (C ≡ P1 ∧ P2). Reiterate that role cards followed this rule.  

  3. **Votes don’t match distribution**:  
     - *Mitigation*: Use numbered role cards to track votes. If discrepancies, use the moment: *"In real groups, disagreements about facts cause this too!"*  

  4. **Spoilers name "discursive dilemma" early**:  
     - *Mitigation*: Preface activity: *"Don’t label concepts yet—experience the puzzle first."*  

  ---

  ### **What the Activity Can’t Capture**  
  - **General Impossibility**: The activity shows *one* inconsistency instance. It cannot demonstrate the **formal impossibility theorem** (List & Pettit, 2002) that *no* aggregation rule (majority, unanimity, etc.) can *always* avoid such inconsistencies while respecting basic fairness.  
    - *Example*: Even unanimous individual judgments can clash in larger groups.  
  - **Broader Scope**: Real dilemmas involve 3+ premises, non-binary choices, or dynamic discussion—simplified here for clarity.  

  ---

  ### **Timing & Materials**  
  - **Time**: 45 min (activity) + 15 min (debrief) = 60 min total.  
  - **Materials**:  
    - Role cards (4 types, preassigned ratios).  
    - Voting slips (3 rounds).  
    - Board for tallies and policy rule.  
  - **Flex**: Adjust card ratios for absentees (e.g., for 14 students: A=4, B=4, C=4, D=2 → P1=8Y, P2=8Y, C=4Y).  

  This activity forces students to confront the paradox through self-created data, setting the stage for deeper theory in later sessions.
