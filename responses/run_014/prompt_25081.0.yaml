prompt: |-
  So my friends and I are starting a co-living house — six of us on the lease, but three more are "maybe" and will decide in a couple months, and two partners of leaseholders will basically live there half the week even though they're not on the lease. We want to make decisions democratically about house rules, chores, guests, etc. But we're stuck on the most basic thing: who even gets a vote? If we put it to a vote among the six leaseholders to decide whether the partners and the maybes get a vote, that seems circular — like we're already assuming the answer by who we let into the room. But I can't think of a non-arbitrary way to draw the line. How do we solve this?
reasoning: |-
  Okay, the user is trying to figure out a fair way to set up their co-living house's voting system. They have six leaseholders, three "maybes" who might join later, and two partners who will stay half the week. The main problem is deciding who gets to vote on house rules without being arbitrary.

  First, I need to break down the groups. The leaseholders are the core—legally responsible and living there full-time. They should definitely have voting rights. The "maybes" are uncertain; including them now could cause issues if they leave. The partners aren't on the lease and only part-time, so their stake is different.

  The user mentioned the circular problem: letting leaseholders vote on others' rights might seem biased. They want a democratic process that feels fair to everyone. The deeper need here is creating a sense of inclusion while maintaining order and preventing future conflicts.

  I should consider different voting tiers. Core members get full votes. Provisional status for maybes makes sense—they can observe but not decide until committed. Partners might have input but not votes, especially since they aren't there full-time. 

  Also, the user might be worried about resentment. If partners influence decisions without accountability, leaseholders might feel it's unfair. Clear boundaries now can prevent that. Having a re-evaluation clause adds flexibility when situations change, like if a maybe becomes a permanent resident.

  Another angle: decision types. Splitting issues into categories (e.g., financial vs. guest policies) allows tailored involvement. Partners could weigh in on social rules but not financial ones. This addresses the user's need for practicality without excluding people entirely.

  The key is balancing structure with adaptability. Starting with a solid foundation for the current leaseholders, then creating pathways for others to earn voting rights as they commit. This approach meets the immediate need for clarity and the unspoken need for harmony and fairness in the household.
answer: |-
  This is a classic "constitutional dilemma" – how do you decide the rules for deciding the rules? It's great you're recognizing the circularity! Here's a structured approach to break the deadlock:

  **Core Principle: Voting Rights Should Align with Commitment & Impact**

  The fairest foundation ties voting power to:
  1.  **Legal Responsibility:** Who is on the hook financially/legally? (Leaseholders)
  2.  **Full-Time Residence:** Who lives there *all the time*? (Leaseholders + committed "maybes" later)
  3.  **Long-Term Stake:** Who has committed to being there for the long haul? (Leaseholders + committed "maybes" later)
  4.  **Direct Impact:** Who is most affected by *all* house rules? (Primarily full-time residents)

  **Proposed Solution: Tiered Membership & Phased Voting Rights**

  1.  **Founding Vote (Establishing the Constitution):**
      *   **Who Votes:** Only the **six leaseholders**. They are the only ones legally bound and fully committed *right now*.
      *   **What They Vote On:** The initial "House Constitution" which defines:
          *   **Core Membership:** Leaseholders = Full Voting Members.
          *   **Provisional Membership:** Status for the "maybes". Define what triggers becoming a Full Voting Member (e.g., signing a lease addendum, paying full deposit/rent, committing by X date).
          *   **Partner/Resident Guest Status:** Define this category (e.g., someone staying 3+ nights/week regularly, not on lease). Define their rights/responsibilities: **Input? Yes. Vote? No.** Define limits (e.g., maximum overnight stays without becoming Provisional).
          *   **Voting Thresholds:** How decisions are made (simple majority? supermajority? consensus? for different types of decisions).
          *   **Amendment Process:** How to change this constitution later (e.g., requires 75% of Full Voting Members).
          *   **House Rules Framework:** Core principles for chores, guests, noise, shared expenses, conflict resolution, etc. (Details can be fleshed out later with wider input).

      *   **Why this isn't circular:** You are acknowledging the *current reality* – only 6 are legally and fully committed. You are *explicitly defining* the path for others to gain voting rights in the future under agreed-upon rules.

  2.  **Integrating "Maybes" (Provisional Members):**
      *   **Status:** They are "Provisional Members" until they formally commit (sign lease, pay, etc.).
      *   **Rights:** Invited to house meetings, encouraged to give input, expected to follow house rules while visiting/staying temporarily.
      *   **Voting:** **No vote** until they become Full Voting Members per the Constitution.
      *   **Decision Point:** When they decide to join, they automatically become Full Voting Members per the rules established by the Founding Vote.

  3.  **Integrating Partners/Resident Guests:**
      *   **Status:** Defined as "Resident Guests" or "Partners" in the Constitution.
      *   **Rights & Responsibilities:**
          *   **Input:** Strongly encouraged to attend meetings and voice opinions, especially regarding rules impacting shared spaces and communal life.
          *   **Chores:** Should absolutely be included fairly in chore rotations while they are present.
          *   **Guests:** Must follow house guest policies; may have limits on bringing *their own* overnight guests.
          *   **Financial Contributions:** Should contribute fairly to shared consumables (toilet paper, cleaning supplies, maybe some utilities) – define this. *Not* rent (that's the leaseholder's responsibility).
      *   **Voting:** **No formal vote.** They are not financially liable, not there full-time, and haven't made the same long-term commitment. Their influence comes through discussion and persuasion, not binding votes.
      *   **Path Forward:** If a partner wants to move in full-time and become a leaseholder, they follow the process defined for "maybes" to become Full Voting Members.

  **Addressing Potential Objections & Ensuring Fairness:**

  *   **"But the partners live here half the time! Shouldn't they vote?"** Their impact is significant, but less than full-time residents. Giving them a vote *now* potentially gives two votes to one leaseholder household and blurs financial responsibility. Input + chore responsibility addresses their impact fairly. *The constitution can be amended later* if the situation changes significantly.
  *   **"What if the maybes feel excluded?"** Be transparent: "Right now, only the leaseholders are legally bound. We're setting up fair rules *now* so that *when* you commit, you become a full member with voting rights immediately. We absolutely want your input as we build this." Involve them informally.
  *   **"This seems messy with different tiers."** It's actually *less* messy than ambiguity. Clear roles prevent resentment. "Full Member," "Provisional Member," and "Resident Guest" are well-defined statuses.
  *   **"What about specific decisions?"** Your constitution can define different processes:
      *   **Full Member Votes:** Core rules, finances, adding new leaseholders, major changes.
      *   **Input from All:** Chore systems, social events, minor rule tweaks, guest policies (Resident Guests especially impacted).
      *   **House Meetings:** Hold regular meetings where *everyone* present (Full Members, Provisional Members, Resident Guests) is encouraged to discuss issues openly. Voting only happens among Full Members if required by the constitution.

  **Key Actions to Take:**

  1.  **The Six Leaseholders:** Schedule a dedicated meeting *just for you six*.
  2.  **Draft a Proposal:** Sketch out the concepts above (Tiers, Founding Vote content) before the meeting.
  3.  **Discuss & Refine:** Have a thorough discussion. Aim for consensus among the six on the core framework.
  4.  **Founding Vote:** Hold a formal vote (majority or supermajority as you agree) to adopt the initial House Constitution.
  5.  **Communicate:** Clearly explain the agreed-upon system to the "maybes" and partners. Emphasize it's the starting point, designed to be fair and adaptable as people commit.
  6.  **Re-evaluate:** Schedule a review of the constitution (e.g., in 6 months) once the "maybes" have decided and you've lived with the system.

  By starting with a clear, democratically established framework *among the core committed group*, you break the circularity. You create a defined path for others to gain rights through commitment, ensuring stability and fairness without arbitrary exclusion. Good luck with your co-living adventure!
