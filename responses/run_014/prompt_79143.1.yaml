prompt: |-
  ok so this is for a debate thing at school and i keep getting stuck. the motion is basically "you should be allowed to sell your kidney / your plasma / your spot in the queue" and every time i say the kidney thing feels different from selling your labour or your old bike, someone says oh so you just find it icky, thats not an argument. which, fine, maybe. but i want to know what an actual answer would have to do before i go picking one, so can you write me the spec for it? like what does any decent theory of "this market is repugant / selling this should be illegal" have to get right. not the theories themselves, the checklist, thats the bit i definately need.

  cases i think it has to handle, tell me what im missing:
  - kidney sales, and plasma, and paying someone to be in a risky medical trial
  - price gouging for bottled water after a hurricane, which the econ kids insist is actually good
  - vote selling, which everyone hates but nobody can say why cleanly
  - and two i thought of: (a) a rich guy pays a hospital charity for the right to be the one who donates a kidney, so no money goes to any seller, the money flows the other way, and yet it still feels off; (b) hiring professional mourners, which is a real job in some places and seems fine, versus buying someone elses apology and giving it to the person you wronged, which seems much worse. so is selling a feeling a different kind of thing from selling an object?

  then the distinctions it cant flatten: the desperate seller (would be fixed by making them not desperate) vs the good being cheapened just by having a price on it (wouldnt be fixed by that); objection to the sale vs objection to the price (a medal for five quid seems worse than a medal for five hundred); wrong for the seller vs wrong for the rest of us, or for the whole institution; and disgust as evidence that somethings wrong vs disgust as the thing the theory is supposed to explain away.

  and one fact it cant contradict: repugnance moves. whole markets that were scandalous a century ago are boring now, and the reverse happens too. so it cant just say repugnant = wrong, and it also cant just say repugnance is always a mistake.

  what i most want: which of these are real requirements and which are just what one side wants to be true, whether some pair of them cant both be satisfied (i have a hunch that "explain why kidney sales are wrong" and "dont just launder disgust" cant both hold, but you tell me), and which single requirement knocks out the most of the usual answers.

  last thing, and i mean this: say what would change your mind. which counterexample or argument would move a requirement off your list, and where do you think your list is most likely to be wrong. hard cap 800 words, a list is fine, dont go over.
reasoning: |-
  Okay, the user is preparing for a school debate on whether selling certain things like kidneys or plasma should be allowed. They're struggling because opponents dismiss their discomfort as mere "ickiness," so they need a structured checklist to evaluate theories about why certain markets are repugnant. 

  First, I need to understand their core request: they want a spec—a set of criteria any decent theory must satisfy—not the theories themselves. They’ve listed cases (kidneys, price gouging, vote selling) and distinctions (desperation vs. cheapening, objection to sale vs. price). They also emphasize that repugnance changes over time, so the theory must account for that. 

  The user’s deeper need seems to be clarity and rigor. They’re frustrated with shallow rebuttals ("that’s just icky") and want intellectual scaffolding to defend their intuition. They might also feel outmatched by econ-focused peers who prioritize efficiency, so the spec should validate normative concerns without relying on disgust. 

  Key challenges: 
  - Balancing moral intuition with logical consistency. 
  - Explaining why some sales feel wrong even without desperation (e.g., the rich guy buying donation rights). 
  - Navigating tensions (e.g., "kidneys are wrong" vs. "don’t just cite disgust"). 

  I’ll structure the spec as a numbered list of requirements, grouping them logically. The "must handle" cases test coverage; the "must distinguish" section ensures nuance; the "must account for" items address dynamism and meta-issues. 

  For the "what would change my mind" part: I’ll note where the requirements might be too strict (e.g., if a theory explains organ sales without desperation but fails on vote selling). The rich donor case is a litmus test—if a theory can’t handle it, it’s probably incomplete. 

  Word count is tight, so I’ll avoid examples in the requirements and save elaboration for the rationale. The tone should be academic but accessible—this is for a debate, not a philosophy journal.
answer: |-
  Here’s a spec for a defensible theory of market repugnance. Any credible framework must satisfy these core requirements:

  **I. Must Handle These Cases Without Contradiction:**
  1.  **Kidney Sales:** Explain prohibition without relying solely on harm/exploitation (since regulated markets *could* mitigate desperation).
  2.  **Plasma Sales:** Explain widespread acceptance (in many places) despite similarities to kidney sales (bodily substance, potential seller vulnerability).
  3.  **Risky Medical Trial Participation:** Explain why payment is often accepted but kidney sales aren't, despite shared risk/vulnerability.
  4.  **Post-Disaster Price Gouging:** Explain why efficiency arguments (allocating scarce water) feel insufficient or wrong to many.
  5.  **Vote Selling:** Explain the near-universal condemnation, even if votes were sold securely/covertly without direct harm.
  6.  **Rich Guy Buying Donation Rights (Charity Auction):** Explain the unease despite no direct payment to a "seller" and charity benefit.
  7.  **Professional Mourners:** Explain general acceptability (as paid emotional labor).
  8.  **Buying/Selling an Apology:** Explain why this feels fundamentally different/worse than professional mourning.

  **II. Must Cleanly Distinguish These Concerns:**
  1.  **Desperation/Coercion (Context):** Wrongness due to the seller's vulnerable state (potentially fixable by improving context).
  2.  **Commodification/Objectification (Nature of Good):** Wrongness inherent in attaching a price, cheapening the good's meaning/value (unfixable by improving seller context).
  3.  **Objection to the *Sale* vs. Objection to the *Price*:** Why selling a medal feels wrong regardless of price, while selling a painting might only feel wrong if undervalued.
  4.  **Wrong for the Seller vs. Harm to Society/Institutions:** Does the act primarily degrade the seller, or does it corrupt a vital social practice (e.g., democracy, medicine, human dignity)?
  5.  **Disgust as Symptom vs. Disgust as Justification:** Does disgust *indicate* an underlying wrong, or is it merely the phenomenon to be explained (or even an irrational bias)?

  **III. Must Account for These Meta-Features:**
  1.  **Dynamic Repugnance:** Explain why repugnance evolves (e.g., life insurance, mortgages, paid surrogacy becoming accepted; indentured servitude becoming unacceptable).
  2.  **Not Just "Ickiness":** Avoid relying *solely* on visceral disgust ("yuck factor") as the *reason* for wrongness. It must point to a deeper normative principle.
  3.  **Compatibility with Accepted Markets:** Cannot condemn all markets (e.g., labor, used goods) or become universally anti-market. Must identify a *relevant difference*.

  **IV. Rationale & Tensions:**
  *   **Real Requirements:** I-VI are core tests of explanatory power. VII-VIII test nuance. Meta-features (especially 1 & 2) are essential for credibility.
  *   **Likely Tensions:**
      *   **Kidney Prohibition vs. Anti-Disgust-Laundering:** This *is* possible. A theory could argue kidney sales inherently commodify the human body/degrade dignity (*Commodification*), irrespective of disgust. Disgust might be a *consequence* of recognizing this commodification. Plasma sales might be distinguished by lesser bodily integrity violation or greater social benefit perception.
      *   **Rich Donor Case (VI) vs. Simplicity:** This case is crucial. Most simplistic theories (only harm/desperation) fail here. A successful theory *must* grapple with commodification/institutional corruption here.
  *   **Knockout Requirement:** **Distinguishing Desperation from Commodification (II.1 vs. II.2)**. Theories failing this (e.g., reducing *all* repugnance to potential exploitation) cannot handle cases like the rich donor, vote selling, or cheapened medals. **The Rich Donor Case (I.6) itself is a major filter.**

  **V. What Would Change My Mind (Weak Points in the Spec):**
  1.  **Over-Demanding on Commodification?** If a compelling theory convincingly argues that *all* apparent commodification objections in cases like kidneys/votes/apologies *can* be reduced to hidden harms, coercion, or institutional collapse (not inherent wrongness), II.2 might be unnecessary. (My bet: This fails on the Rich Donor case).
  2.  **Professional Mourners vs. Apology Sales (I.7 vs. I.8):** If a clear, normatively significant distinction between selling *performative* emotion (mourning) and selling *authentic* relational repair (apology) cannot be sustained, this pair might need revision or removal. Is authenticity the key difference?
  3.  **Dynamic Repugnance (III.1) Scope:** Is the requirement too vague? A theory offering a *framework* for understanding change (e.g., shifting notions of dignity, new technology revealing harms, changing social priorities) might suffice without predicting specific shifts.
  4.  **Price Gouging (I.4):** Does a theory *really* need to explain the *feeling* as wrong, or just justify the common legal/policy response? If a theory powerfully justifies price caps *without* invoking repugnance (e.g., pure anti-exploitation), maybe the "feeling" is secondary. (But the spec aims to explain the *repugnance*, not just policy).

  **Where My List is Most Likely Wrong:** Potentially underestimating how effectively "institutional corruption" (II.4) can explain *all* the cases without needing strong inherent commodification (II.2). Maybe the Rich Donor case *does* corrupt healthcare allocation systems significantly enough. This is the core battleground.
