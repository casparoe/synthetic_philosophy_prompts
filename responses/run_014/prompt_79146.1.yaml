prompt: |-
  Ok so my philosophy club just did the Twin Earth thing where Putnam asks you to imagine a planet that looks exactly like ours, and the people there call the stuff in their lakes water, except it turns out their stuff isnt H2O, its some other chemical, and the question is whether their word means the same as ours. I get that the answer is supposed to be no, because what a word refers to gets fixed by the environment and not by whats inside your head. Fine, I buy it.

  What I want is to run that machinery on something that actually happened: the 2006 IAU vote where Pluto got demoted. Heres the facts as I understand them, and if I've got them wrong just say so and keep going: to be a planet now you have to orbit the sun, be massive enough that gravity has rounded you out, and have cleared the neighborhood around your orbit of other junk. Pluto fails the third one because it shares its zone with a bunch of other icy bodies, so it got moved into a new box called dwarf planet, along with Ceres and Eris. Only a small fraction of the IAU's members actually voted, and plenty of planetary scientists, including people who study Pluto for a living, still call it a planet. So nothing out in space changed at all, Pluto is the same ball of ice it always was, but the word changed.

  Analyze this both ways, the theory on the case and the case on the theory:

  1. If externalism is right, was it true in 1990 that Pluto is a planet, and false now? Or was it always false, the way that whales are fish was always false? Which of those does the theory actually commit you to, and does it matter who's doing the talking, the experts or the rest of us who just go along with whatever the experts say (the division of linguistic labor thing)? And does it matter that the change came out of a vote, where a big part of the motivation was that we dont want forty planets in the textbooks? Is the reference getting fixed by nature here, or by us?

  2. Heres the bit I actually care about. Suppose the IAU had voted the other way and Pluto stayed a planet. Same world, same objects, same orbits, only the committee vote differs. Does planet mean the same thing in that world? Environmental externalism seems to say yes, because the stuff out there is identical, so the extension is identical. But the Burge arthritis case seems to say no, because what your word means depends on the norms of your community, and communities can differ. So does this case support environmental externalism, support social externalism, or drive a wedge between them? Be specific about what each one predicts about the counterfactual IAU, dont just tell me both of them are externalist.

  3. Compare it to cases where we revised a terms extension because we found out the world wasnt what we thought, like jade turning out to be two different minerals, or whales turning out not to be fish. Is the Pluto case that kind of case or a different kind? And if its a different kind, what does that tell us about whether planet is a natural kind term at all, or whether its a category we invented for convenience, and if its the latter then what was the externalist argument even about?

  4. Then be honest with me: does this case definately confirm externalism, embarrass it, or is it something the theory never thought about and just goes silent on? If it goes silent, point at exactly which step has nothing to say here.

  Dont give me a reading list or names of papers, I only want the argument, and dont just tell me its controversial which definition of planet is right. I know that. I want to know what the theory of meaning says about the controversy, and what the controversy shows about the theory.
reasoning: |-
  Okay, let me work through this user's philosophical puzzle step by step. They're clearly deeply engaged with Putnam's Twin Earth thought experiment and now want to apply externalist semantics to the real-world Pluto controversy. 

  First, I need to unpack their layered questions carefully. The user understands externalism's core claim - that meaning depends on external factors rather than individual mental states - but is testing its limits with a case where human decisions seem to override physical reality. 

  For question 1, I'm considering how externalism handles changing definitions. If "planet" was defined by observable properties pre-2006, then Pluto was correctly classified under that definition. But after the IAU vote, the term's meaning shifted to include orbital clearance. This seems like a case of semantic change through stipulation rather than discovery of new facts. 

  Question 2 is particularly interesting. The user presents a perfect test case: identical physical reality but different vote outcome. Environmental externalism would say the meaning stays the same since nothing physical changed, but social externalism would say the meaning differs because expert norms changed. This tension reveals how the Pluto case challenges pure environmental externalism.

  For question 3, I should contrast this with cases like whales/fish where reclassification reflected better understanding of biological reality. The Pluto vote wasn't about discovering new facts about Pluto, but about drawing taxonomic boundaries differently. This suggests "planet" may be more like "continent" than "water" - a human construct rather than natural kind.

  Finally, for question 4, I need to assess whether this embarrasses externalism. Actually, it might strengthen social externalism while showing environmental externalism's limits for institutional categories. The key insight is that different terms have different "anchoring" mechanisms - natural kinds in physical reality, institutional kinds in social practices.

  The user seems frustrated with hand-wavy answers, so I'll be precise about what each theory predicts. They're clearly comfortable with technical philosophy but want concrete analysis, not citations. I should avoid academic jargon while maintaining rigor, and acknowledge that this case reveals complexities in externalism rather than refuting it entirely.
answer: |-
  Let's break this down step by step, applying externalist machinery to Pluto's demotion. Forget textbook controversies – we're pressure-testing *meaning* here.

  **1. Externalism Applied to Pluto's History**  
  - **Pre-2006 Status**: Under externalism, *if* "planet" referred to any sun-orbiting, rounded body (the pre-IAU working definition), then Pluto *was* correctly called a planet. Reference was fixed by observable properties (orbit, roundness), regardless of later discoveries about its neighborhood.  
  - **Post-2006 Status**: After the IAU vote, the term's meaning *changed* via stipulation. Pluto is now excluded because "planet" requires orbital clearance. This isn't like "whales aren't fish" (a *discovery* about biological reality). It's a *redefinition* based on scientific utility.  
  - **Linguistic Labor & Expertise**: Externalism (via Putnam/Burge) says reference depends on the *community of experts*. Pre-vote, planetary scientists loosely used "planet" for Pluto. Post-vote, the *institutional authority* (IAU) refined the term, binding the linguistic community. Laypeople defer to this expertise – so *their* word "planet" now has a different extension too, via division of labor.  
  - **Nature vs. Us?**: Here, reference is fixed *socially-institutionally*, not by nature alone. The vote wasn't discovering Pluto's essence; it was drawing a taxonomic boundary for practical reasons (avoiding 40+ planets). Physical reality (Pluto's mass, orbit) constrained the options, but didn't dictate the outcome.

  **2. Counterfactual Vote & Externalism's Split Personality**  
  - **Environmental Externalism (Putnam-style)**: Predicts *same meaning* in both worlds. Identical physical configurations → identical extensions. "Planet" picks out the same objects regardless of IAU vote. Pluto's orbital neighborhood is unchanged.  
  - **Social Externalism (Burge-style)**: Predicts *different meaning* in the counterfactual world. If the IAU votes to keep Pluto, the *expert norms* differ → the communal concept "planet" includes Pluto. Meaning is constituted by social practice.  
  - **The Wedge**: This case *drives a wedge* between the two:  
    - If meaning tracks *only physical environment*, the vote is irrelevant → environmental externalism says meaning is identical.  
    - If meaning tracks *communal norms*, the vote is decisive → social externalism says meaning differs.  
  - **Verdict**: The Pluto case *supports social externalism* and *embarrasses pure environmental externalism*. Why? Because "planet" is not a natural kind like "water." Its boundaries are negotiated by experts for scientific purposes. The vote changing the extension *without physical change* shows meaning is socially anchored.

  **3. Pluto vs. Jade/Whales: Taxonomy vs. Discovery**  
  - **Jade/Whales (Discovery Cases)**:  
    - "Jade": We discovered two distinct minerals (jadeite/nephrite) *causally responsible* for the surface properties we called "jade." The *extension split* based on hidden structure.  
    - "Whales": We discovered cetaceans' biological lineage (mammals, not fish) → corrected a *false belief* about their essential properties.  
    - These are *natural kind* terms whose references were *misidentified* initially.  
  - **Pluto (Stipulation Case)**:  
    - No new discovery *about Pluto itself* motivated the change. We knew about its orbit/Kuiper Belt neighbors pre-2006. The IAU *redefined the category* for pragmatic reasons (classification utility).  
    - **Crucially**: Pluto doesn't *lack* some hidden "planet essence." "Planet" isn't a natural kind with a microstructural essence. It's a *functional/pragmatic category* we invented.  
  - **Implication**: "Planet" is **not a natural kind term**. It's a *human-defined taxonomic category*, like "continent" or "mountain." Its reference is fixed by *convention*, not microstructure. Externalism still applies (meaning is external to individual minds!), but it's *socially* external, not environmentally essentialist. The original Twin Earth argument was about natural kinds ("water"); Pluto shows externalism extends to institutional kinds too.

  **4. Does This Confirm or Embarrass Externalism?**  
  - **Confirms Social Externalism**: This case *strengthens* Burge-style social externalism. The shift in Pluto's status shows meaning depends on expert community norms – even when the physical world is unchanged.  
  - **Embarrasses *Pure* Environmental Externalism**: Putnam's original framework (meaning fixed *only* by physical environment) *goes silent* here. Step where it fails: **Environmental externalism assumes meaning is anchored in *causal-historical chains linked to natural kinds*.** "Planet" isn't a natural kind; it's an institutional kind. When the "stuff" isn't microstructurally essential, but socially defined, environmental externalism lacks the tools to explain meaning change via vote.  
  - **Not an Embarrassment for Externalism *Generally***: The case shows externalism must encompass *social facts* as meaning-determining. It doesn't refute externalism; it refines it. Externalism succeeds by showing meaning isn't "in the head" – the IAU vote is a *public, external event* that changed linguistic practice.  

  **The Takeaway**: Pluto isn't Twin Earth. It reveals that:  
  1. Not all terms are natural kinds; some are institutional categories ("planet," "recession," "planet").  
  2. For institutional kinds, *social externalism* governs meaning – expert norms and authority fix reference.  
  3. Environmental externalism still applies to natural kinds ("water," "gold"), but Pluto shows its *limits*.  
  4. The controversy shows externalism is *modular*: it handles different terms via different mechanisms (causal chains for natural kinds, expert norms for institutional kinds). The Pluto case doesn't break externalism; it showcases its flexibility beyond Putnam's original thought experiment.
