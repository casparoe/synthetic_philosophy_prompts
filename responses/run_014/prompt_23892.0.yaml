answer: |-
  Based on your precise description and careful distinctions, the pattern you identify lacks a single, universally accepted technical term in political philosophy or legal theory. It sits at the intersection of several concepts but is distinct from each. After considering the core mechanism – **the transformation of an originally unjust/forceful origin into legitimacy primarily through the sheer passage of time, habitual acceptance, and the sedimentation of custom, explicitly rejecting the perpetual validity of the initial force itself** – I propose the term:

  **Chronocratic Legitimation** (from Greek *chronos* = time, and *kratos* = power/rule/strength)

  **Definition:** Chronocratic Legitimation is an argumentative strategy asserting that the legitimacy of a political or legal order, initially established by unjust force (conquest, usurpation, enclosure, etc.), arises not from the original act nor solely from present efficacy, but specifically from the *temporal duration* of its existence and the consequent development of custom, habitual obedience, settled expectations, and social integration. The original violence is acknowledged but rendered normatively inert by time's transformative power.

  **Distinguishing Chronocratic Legitimation from Neighboring Concepts:**

  1.  **"Right of the Strongest":** Explicitly rejected by Chronocratic Legitimation. The defender concedes the original act was mere force, *not* right. Legitimacy is derived *laterally* from time/habit, not vertically from the inherent rightfulness of the initial conquest. (Contrasts with Thrasymachus, some realist readings of Machiavelli).
  2.  **Descriptive Historical Violence:** Chronocratic Legitimation goes beyond description; it is a *justificatory* move. It uses the *fact* of temporal passage as the *reason* for legitimacy *now*. The violence is the starting point, not the justification.
  3.  **De Jure / De Facto Distinction:** While relying on the *de facto* (what *is* established), Chronocratic Legitimation explicitly argues that the *de facto* state *becomes* de jure (legitimate *right*) *because* of its longevity and customary acceptance. Time bridges the gap.
  4.  **Hobbesian Conventionism:** Hobbes locates legitimacy in the *present* act of authorization (express or tacit) constituting the sovereign, making justice/injustice creatures of the *current* sovereign command. Chronocratic Legitimation locates it in the *historical process* itself – the *accumulated weight* of time and habit – independent of any specific founding covenant *or* current commands. The passage of time *does the authorizing work* retrospectively.
  5.  **Technical Prescription (Adverse Possession, Usucapio):** This is the *closest legal analogue* and a key *instance* of Chronocratic Legitimation applied specifically to property. However, Chronocratic Legitimation is broader:
      *   **Scope:** Prescription is a specific legal doctrine with defined elements (possession must be adverse, open, notorious, continuous, for a statutory period). Chronocratic Legitimation is a general philosophical and rhetorical strategy applicable to entire political regimes, legal systems, territorial claims, and social norms.
      *   **Mechanism:** Prescription often relies on legal fictions (e.g., presumed grant) or policy goals (quieting titles). Chronocratic Legitimation posits a more fundamental normative transformation wrought by time itself.
      *   **Acknowledgment:** Prescription often doesn't require acknowledging the original wrong; possession starts the clock. Chronocratic Legitimation explicitly *acknowledges* the initial injustice but declares it irrelevant due to time.

  **Assessment: Genuine Legitimacy or Rhetorical Laundering?**

  This is the core tension. Chronocratic Legitimation occupies an ambiguous space, likely containing elements of both:

  *   **The Case for Genuine Legitimacy:**
      *   **Stability and Order:** The primary normative good served is social peace and stability. Uprooting *any* long-established order, regardless of origin, risks chaos and greater injustice. Legitimacy, in this view, is inherently linked to providing a stable framework for social life. Time signifies successful integration and the absence of sustained, widespread resistance.
      *   **Settled Expectations:** Over time, people build lives, investments, and relationships based on the existing order. Respecting these deeply ingrained expectations is a significant moral good. Disrupting them based on ancient wrongs can create new injustices. Legitimacy arises from protecting this web of reliance.
      *   **Epistemic Function:** Time can act as a filter or discovery mechanism. An order that persists and gains customary acceptance *might* indicate it possesses functional virtues (efficiency, adaptability, perceived fairness by participants) that weren't apparent at its violent birth. Its survival suggests a degree of tacit consent or adaptation.
      *   **Social Integration:** The original act of force creates a rupture. Time allows for the development of shared traditions, identities, and institutions that bind people together *within* the new order. Legitimacy arises from this evolved social fabric, not the rupture.
      *   **Overcoming Founding Paradox:** All foundations, even consensual ones, face a potential infinite regress or performative contradiction. Time provides a pragmatic "solution" by shifting the basis of legitimacy away from the always-problematic origin to the evolved present reality.

  *   **The Case for Rhetorical Laundering:**
      *   **Moral Stasis:** If the original act was unjust, why does mere duration cleanse it? This seems like moral evasion. Injustice doesn't magically become justice because it's old. This reduces legitimacy to successful usurpation.
      *   **Consent by Coercion or Habituation:** Custom and habit can arise from resignation, coercion, indoctrination, or simply the lack of alternatives, not genuine acceptance. Habitual obedience ≠ normative consent. It confuses *is* with *ought*.
      *   **Freezing Injustice:** It privileges the status quo, potentially entrenching deep structural inequalities derived from the original violence (e.g., dispossessed groups). Time becomes a tool for the powerful to solidify gains.
      *   **Lack of Critical Function:** It provides no standard for evaluating the *content* of the order beyond its age and acceptance. An oppressive but stable regime benefits as much as a benign one. It stifles reform based on principle.
      *   **Pascal's Point:** It confirms Pascal's suspicion that "justice" is merely force that has grown old. It *is* a sophisticated laundering operation, dressing power in the robes of tradition.

  **Synthesizing View (Modified Humean):** Chronocratic Legitimation *can* generate a *form* of genuine legitimacy, but it is *instrumental* and *conditional*, not inherent or absolute. Its legitimacy rests on its *functional capacity to provide the goods of social order, stability, and the protection of settled expectations*. However, this legitimacy is always provisional and vulnerable to being overridden if:
  1.  The order perpetuates *ongoing, severe injustice* traceable to and unmitigated since the founding.
  2.  The "custom" is demonstrably maintained by active suppression rather than habituation within a tolerable framework.
  3.  The passage of time has *not* dissolved epistemic uncertainty or integrated the dispossessed; the original wrong remains a live, unhealed wound for significant groups.

  **Time's Role:** Time primarily functions as:
  *   A *stabilizer* of expectations and social relations.
  *   A *generator* of customary practices and identities.
  *   A *filter* for institutional viability (though not necessarily moral worth).
  *   An *epistemic solvent* for the unknowability of original intentions/alternatives, gradually replacing the need for justification by origin with justification by present function and integration.

  **Boundary Cases and Failure Conditions:**

  1.  **Applicability:**
      *   **Property Rights:** The *clearest* and most legally formalized application (prescription/adverse possession). The arguments from stability and settled expectations are very strong here.
      *   **Political Authority:** The core domain of your examples (Pascal, Rousseau's target). Chronocratic Legitimation is frequently invoked here, but the legitimacy claims are more complex, involving collective identity, ongoing consent (or lack thereof), and the potential for ongoing systemic injustice.
      *   **International Practice/Normative Custom:** International law explicitly recognizes "customary international law" formed by state practice (*opinio juris*) over time. This is a direct application. However, its legitimacy is often contested, especially when the practice originated in power imbalances (e.g., colonial-era norms). It works best for procedural or technical norms, less well for deeply contested substantive justice claims.
      *   **Social Norms/Traditions:** Also applicable. Norms once imposed (e.g., linguistic, religious) can become legitimate parts of a culture through time and habituation, though subject to the same critiques.

  2.  **Failure Conditions (What Breaks the Conversion):**
      *   **Persistent Injustice:** If the foundational injustice *continues* to manifest in systematic, unaddressed oppression or dispossession of identifiable groups, time does not legitimize; it compounds the wrong. (e.g., apartheid, ongoing occupation without integration/rights).
      *   **Lack of Integration/Habituation:** If the conquered/defeated group maintains a distinct, unintegrated identity and *persistently* rejects the legitimacy of the order, the "custom" is not truly shared. Time alone doesn't create legitimacy if a significant portion of the governed never accepted or habituated to the system.
      *   **Epistemic Suppression:** If the true history of violent founding is actively suppressed or mythologized, preventing societal recognition and potential reconciliation, the legitimacy derived from time is suspect. Honest acknowledgment is often a prerequisite for time's "cleansing" effect.
      *   **Ongoing Coercion:** If the order relies on continuous, overt repression to maintain itself, rather than evolving into a system where obedience is largely habitual or based on perceived benefits, the passage of time signifies mere endurance, not legitimacy.
      *   **Fundamental Illegitimacy of Origin:** Some argue certain acts (genocide, total conquest aiming at annihilation) are so heinous that they create a "stain" no amount of time can cleanse. The legitimacy of the resulting order is forever contested. (This is highly contentious but represents an absolute boundary claim).
      *   **Violation of Peremptory Norms (Jus Cogens):** In international law, norms like prohibitions on genocide or slavery are considered non-derogable. A "custom" violating these, even if long-practiced, cannot gain legitimacy. Time is powerless here.

  **Conclusion:**

  Chronocratic Legitimation ("time legitimizes") is a pervasive and powerful argumentative strategy distinct from mere might-makes-right or technical prescription. While it invokes genuine goods like stability and settled expectations, its claim to confer moral legitimacy is fundamentally ambivalent. It functions best when the passage of time has genuinely healed wounds, integrated populations, and allowed functional institutions to emerge that serve the governed. It functions as laundering when it obscures ongoing injustice, entrenches unaddressed dispossession, or mistakes enforced habituation for genuine acceptance. Its legitimacy is thus contingent, instrumental, and forever vulnerable to the re-emergence of the foundational violence it seeks to bury, or the persistence of injustice it fails to rectify. Its power lies not in moral magic, but in the human need for order and the undeniable weight of the lived present shaped by the past.
