prompt: |-
  I am a high school junior serving as parliamentarian for our student council, and I am trying to turn what we studied about ancient Athens into something my council can actually use.

  We discussed three failures of Athenian democracy in class. In the first, the assembly angrily voted to punish a rebellious allied city with extreme severity and then, after a night of reflection and a second debate, reversed itself the next day. In the second, the assembly was persuaded by enthusiastic speeches to approve a large, distant military expedition, brushed aside warnings from more cautious and experienced commanders about cost, distance, and poor information, and suffered a catastrophe. In the third, a large citizen jury convicted a philosopher who questioned conventional views and annoyed prominent people, on broad charges of impiety and corrupting the young.

  Our council meets for about forty-five minutes each Tuesday with thirty members between the ages of fourteen and eighteen. We decide matters such as dance budgets under two thousand dollars, spirit week plans, and recommendations to the administration on phone use and club funding. None of us has training in history or philosophy, our faculty advisor must sign off on any action, and we are under constant pressure to vote quickly when feelings run high. I need a reusable procedure, not advice on a single vote: a step-by-step checklist or flowchart in words that a chair with no background in theory could follow in real time and that would fit on one page if summarized.

  Please design that procedure so it preserves the core lessons of the three Athenian cases while dropping details that do not transfer to a school setting. It should specify in order the questions to ask, what counts as a sufficient answer at each step, when a vote must be delayed to a second meeting, when dissenting or expert voices must be heard, and what protections apply when the target of a proposal is an unpopular person or view. Mark clearly the points where judgment cannot be eliminated and must be exercised by the chair or advisor.

  Then run the procedure step by step on three live proposals: a proposal to ban phones during lunch immediately after a cheating incident, where sponsors demand a same-day vote while anger is high; a proposal to spend most of our annual budget on an ambitious overnight leadership retreat in another city, promoted with great enthusiasm while warnings from the treasurer and advisor about cost and logistics are being dismissed as negativity; and a proposal to remove our newspaper representative from the council after an editorial sharply criticizing the council and administration, on grounds of disloyalty and bad character. Include at least one application where the procedure blocks or delays what I and a majority currently want, and conclude with an honest statement of what the procedure cannot do and where it is likely to misfire.
reasoning: |-
  Okay, the user is a high school junior who's the parliamentarian for their student council. They're trying to apply lessons from ancient Athenian democracy failures to their council's procedures. The three Athenian cases they studied involve impulsive decisions: punishing a city harshly then reversing, launching a disastrous expedition despite warnings, and convicting a philosopher for unpopular views. 

  The student council has 30 members aged 14-18, meets for 45 minutes weekly, and handles relatively small-scale issues like dance budgets and spirit week plans. They need a practical, reusable procedure that fits on one page, accounts for real-world constraints (time pressure, emotional debates, faculty advisor oversight), and specifically addresses: delay mechanisms for heated votes, mandatory consideration of dissenting views, and protections for unpopular individuals/ideas.

  Hmm... the core Athenian lessons distilled for teens would be: 1) Cooling-off periods prevent rage-driven decisions (Case 1), 2) Enthusiasm ≠ viability - must address concrete risks (Case 2), 3) Minority views need procedural shields (Case 3). The challenge is packaging this into bite-sized steps without academic jargon.

  For structure, I'm considering a 3-phase flow with clear off-ramps: Pre-Vote Scrutiny → Substantive Debate → Final Safeguards. Key mechanics would include: 
  - Automatic 24hr delay if vote targets a person/unpopular view OR if >1/3 demand delay
  - Mandatory "devil's advocate" questions from chair when warnings exist
  - Minority right to submit alternative proposals
  - Advisor veto point only at high-risk decisions

  Testing it against their live examples: 
  1) Phone ban after cheating incident - procedure should force cooling-off period despite majority anger 
  2) Expensive retreat - must require written risk assessment before vote 
  3) Removing newspaper rep - strongest protections kick in since it targets a person for their speech

  Biggest limitations will be: 
  - Teens (or adults!) gaming the "unpopular view" criteria 
  - Advisor overreach potentially undermining student autonomy 
  - Time constraints making thorough debate impossible

  ...But the real win isn't perfection - it's creating moments where someone can say "Wait, is this like Athens?" That metacognition is the goal.
answer: |-
  Here’s a reusable, one-page procedure distilled from Athens' lessons, designed for high-speed student councils. Key principles: **delay impulse**, **force scrutiny**, **protect dissent**, and **require evidence**.

  ---

  ### **Student Council Decision-Making Safeguard Procedure**  
  *(For chairs & advisors; apply to all substantive votes)*  

  #### **STEP 1: PRE-VOTE SCRUTINY (Before debate)**  
  Ask:  
  > *"Could this decision: (a) Punish a person/group? (b) Spend >15% of our budget? (c) Ignore specific warnings?"*  
  **➜ If YES to ANY:** Proceed to Step 2. **➜ If NO:** Skip to standard debate/vote.  

  #### **STEP 2: SUBSTANTIVE DEBATE REQUIREMENTS**  
  **A. Target Protection (If punishing a person/group):**  
     - Chair *must* ask: *"What specific rule was broken? Is there written evidence?"*  
     - Target (or defender) gets 3 minutes to respond.  
     - **Vote delay REQUIRED:** 24 hours minimum if evidence is disputed OR no written rule exists.  

  **B. Cost/Risk Assessment (If major spending/ignored warnings):**  
     - Chair *must* ask: *"What are the top 3 risks? How will we pay for this without harming other priorities?"*  
     - Treasurer/logistics lead gets 3 minutes to present concerns.  
     - **Vote delay REQUIRED:** If risks are unaddressed OR funding source unclear.  

  **C. Dissent Safeguard (For all proposals):**  
     - If >⅓ of council requests delay, vote *must* be postponed to next meeting.  
     - Minority view (if any) gets 2 minutes after majority speaks.  

  #### **STEP 3: POST-DEBATE CHECK (Before voting)**  
  Chair confirms:  
  1. Evidence was heard for punitive actions (Step 2A).  
  2. Risks/funding were addressed (Step 2B).  
  3. No valid delay request is pending (Step 2C).  
  **➜ If ANY unmet:** Delay vote. **➜ If ALL met:** Proceed to vote.  

  #### **ADVISOR ROLE:**  
  - **MUST BLOCK** votes that skipped required steps.  
  - **MAY SUGGEST** delays if procedural flaws exist.  
  - **JUDGMENT CALLS:** Chair/advisor jointly decide disputes over "evidence," "risk severity," or "dissent validity."  

  ---

  ### **Application to Live Proposals**  

  #### **1. Phone Ban After Cheating Incident**  
  - **Step 1:** YES (punishes students; ignores warnings about anger-driven haste).  
  - **Step 2A:** Target Protection applies.  
    - Ask: *"Which rule did lunchtime phone use violate? Evidence linking phones to cheating?"*  
    - Likely outcome: No written rule banning lunch phones; evidence circumstantial.  
    - **VERDICT:** **Vote DELAYED 24hrs+** to draft evidence-based policy. *Blocks impulsive majority demand.*  

  #### **2. Expensive Leadership Retreat**  
  - **Step 1:** YES (spends >15% budget; ignores treasurer/advisor warnings).  
  - **Step 2B:** Cost/Risk applies.  
    - Ask: *"Top 3 risks? How fund without cutting other events?"*  
    - If sponsors dismiss risks: *"Unaddressed risk = automatic delay."*  
    - Treasurer *must* present cost breakdown.  
    - **VERDICT:** **Vote DELAYED** until written risk plan (transport, safety, full budget impact) is submitted.  

  #### **3. Removing Newspaper Representative**  
  - **Step 1:** YES (punishes person; targets dissent).  
  - **Step 2A:** Target Protection applies.  
    - Ask: *"Which council rule did the editorial violate? Evidence of 'disloyalty'?"*  
    - Rep/defender speaks: *"Criticism ≠ disloyalty; editorial is protected speech."*  
    - **VERDICT:** **Vote DELAYED 24hrs+**. If no smoking-gun rule violation, advisor should veto as unlawful retaliation.  

  ---

  ### **What This Procedure CANNOT Do**  
  1. **Fix apathy or bad faith:** Won’t force members to research risks or listen honestly.  
  2. **Replace wisdom:** Chair/advisor judgment is irreplaceable in interpreting "evidence" or "risk."  
  3. **Prevent popularity contests:** If majority insists after delays, poor decisions may pass (e.g., funding a popular but risky event).  
  4. **Handle emergencies:** For true crises (e.g., safety issues), advisor may override.  

  **Likely Misfires:**  
  - Members may exploit "dissent safeguard" to delay minor votes.  
  - Advisors might overreach if "joint judgment" becomes authoritarian.  
  - Time constraints could force rushed scrutiny (prioritize Step 2A/2B).  

  **Athenian Core Preserved:**  
  - **Impulse control** (reversing Mytilene decision).  
  - **Respect for expertise** (ignoring Sicily warnings).  
  - **Shielding dissent** (Socrates trial).  

  Print this, tape it to the gavel, and empower your chair to say: *"Per procedure, we pause here."*
