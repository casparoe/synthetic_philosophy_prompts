  Similarly, P(working) = 0.80, P(broken) = 0.20

  So P(says_good | good) = (0.90)(0.80) + (0.50)(0.20) = 0.72 + 0.10 = 0.82

  Now, P(says_good | defective) = P(says_good | defective, working) * P(working) + P(says_good | defective, broken) * P(broken)

