  Now, let's evaluate each method.

  **Method 1: trust_it**

  Assume the tester is working, so we use the 90% accuracy directly.

  If tester is working and says "good", P(good | says_good, working) = P(says_good | good, working) * P(good) / P(says_good | working)

  But P(says_good | good, working) = 0.90 (since 90% accurate, so if good, it says good 90% of time)

  P(says_good | defective, working) = 0.10 (false negative, but since it says good, we care about when defective)

  Better to use Bayes' theorem.

  P(good | says_good, working) = [P(says_good | good, working) * P(good)] / P(says_good | working)

  P(says_good | working) = P(says_good | good, working) * P(good) + P(says_good | defective, working) * P(defective)

  = (0.90 * 0.95) + (0.10 * 0.05)  // when working, if good, 90% says good; if defective, 10% says good (false negative)

  Calculate:

  P(says_good | working) = (0.90)(0.95) + (0.10)(0.05) = 0.855 + 0.005 = 0.86

  Then P(good | says_good, working) = (0.90 * 0.95) / 0.86 = 0.855 / 0.86 ≈ 0.994186

  About 0.994

