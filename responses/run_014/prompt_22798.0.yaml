  **Method 3: flatten_test**

  First, average the tester's accuracy across working and broken cases to get one effective test.

  What is the overall probability that the tester says "good" when the bulb is good?

  P(says_good | good) overall.

  This depends on the state of the tester.

  P(says_good | good) = P(says_good | good, working) * P(working) + P(says_good | good, broken) * P(broken)

