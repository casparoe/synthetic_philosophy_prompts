  **Method 2: average_posteriors**

  Here, we compute posterior assuming working, posterior assuming broken, then average with weights 0.8 and 0.2.

  First, posterior if working: we have P(good | says_good, working) = 0.994 as above.

  Now, if broken: tester is random, 50/50, so it gives no information. Therefore, P(good | says_good, broken) = P(good) = 0.95, because the test is useless.

