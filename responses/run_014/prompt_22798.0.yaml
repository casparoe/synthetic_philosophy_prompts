  So P(says_good | defective) = (0.10)(0.80) + (0.50)(0.20) = 0.08 + 0.10 = 0.18

  Now, with this effective test, we do plain Bayes.

  P(good | says_good) = [P(says_good | good) * P(good)] / P(says_good)

  P(says_good) = P(says_good | good) * P(good) + P(says_good | defective) * P(defective) = (0.82)(0.95) + (0.18)(0.05)

