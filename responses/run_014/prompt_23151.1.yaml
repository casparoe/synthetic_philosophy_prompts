prompt: |-
  So I was at a panel last month and two of the speakers ended up in it during the Q&A, and I kept thinking about it afterwords. One's a game theorist (Mara), the other a philosopher of social norms (Devin), and they were arguing about David Lewis's account of conventions — the one where a convention is basicly a solution to a recurring coordination problem, pinned down by common knowledge and this "prior expectation" that everyone expects everyone else to conform.

  Mara's point was that Lewis's whole setup is static. It describes a convention as an equilibrium that's already been selected and is already common knowledge, so it can tell you what a convention is once it's in place, but it can't tell you how one gets started from nothing. To explain the evolution of norms — how a population moves from no convention, or from the wrong one, to an established one — you need a dynamic account, like replicator dynamics or some learning model, that traces the actual path. The "prior expectation" condition just presupposes the very thing you're trying to explain.

  Devin pushed back and said that's a misreading. Lewis's arbitrariness condition plus Schelling's focal points already handle the selection problem: even with no shared history, agents can lock onto a salient equilibrium because the salience is itself common knowledge. So Lewis can explain how a convention gets chosen, and the "evolution" over time is just the convention getting reinforced through repeated play, which his framework already covers. The "static" complaint is mostly a category error.

  Mara said that even if focal points pick the equilibrium, they don't explain the dynamics of how a population converges to it, or what happens when two conventions compete and one has to displace the other. Then she added that a lot of real norms — fairness, reciprocity, promise-keeping — aren't pure coordination at all; there's a genuine conflict of interest in them, so Lewis's framework (which only handles pure coordination) doesn't even apply to the norms people usually mean by "social norms."

  Devin's last move was to say the conflict-of-interest cases are a different phenomenon and shouldn't be dragged into the convention story, and that if you keep the domain to pure coordination — which is what Lewis actually claimed to cover — his account plus focal points is basically complete, and the rest is just empirical work on how fast things converge.

  I honestly couldn't tell who had the better case. Can you go through their exchange and say who's right about which specific point — not just who wins overall — and flag anything both of them are missing?
reasoning: |-
  Okay, the user presents a fascinating academic debate they witnessed between a game theorist (Mara) and a philosopher (Devin) about David Lewis's convention theory. They want a detailed breakdown of who's right on specific points rather than a simple verdict. 

  First, I need to reconstruct the core disagreement: Mara attacks Lewis's model as static and unable to explain convention emergence, while Devin defends it by invoking focal points and domain limitations. The user seems intellectually engaged but frustrated by unresolved tension - they've been pondering this for weeks.

  Hmm, both make valid points but miss nuances. Mara's critique about dynamics is spot-on for explaining actual societal shifts, but she underestimates how focal points bootstrap conventions. Devin correctly notes Lewis only claimed to cover pure coordination, yet seems dismissive of hybrid norms like fairness that involve mixed motives.

  The user's phrasing suggests they're academically inclined - possibly grad student or researcher in social sciences. Their request to "flag what both miss" indicates they want synthesis, not partisanship. They might be preparing for publication or teaching this material.

  Let me tackle this layer by layer:
  On the static critique: Mara's right that Lewis presupposes common knowledge, but Devin correctly counters that focal points resolve the "startup" issue in principle. However, Mara wins on the point about displacement dynamics - Lewis offers no tools for when conventions clash.

  On domain applicability: Mara's hybrid norms objection is devastating for real-world relevance, but Devin has textual defense since Lewis explicitly limited scope. Still, the user probably cares about practical application where pure coordination is rare.

  Biggest oversight? Neither addressed how communication or power asymmetries distort convention formation. Also missing: modern extensions like network effects or stochastic learning models that address Mara's dynamics concern while preserving Lewis's insights.

  The user would appreciate noting how later scholars (e.g., Young, Bicchieri) bridged these gaps. Might add a footnote about experimental evidence showing focal points fail when payoffs aren't symmetric - subtly supporting Mara's skepticism.
answer: |-
  Here's a breakdown of Mara and Devin's exchange, evaluating each point objectively and flagging key omissions:

  **1. Mara's "Static Model" Critique vs. Devin's "Focal Points" Defense**
  *   **Mara's Point:** Lewis's model presupposes common knowledge and prior expectations, making it descriptive of an *existing* equilibrium but unable to explain the *dynamic process* of emergence from a state with no convention or during transitions between conventions.
  *   **Devin's Counter:** Lewis's "arbitrariness" + Schelling's "focal points" *do* provide a mechanism for initial selection *without* prior history. Salience (e.g., uniqueness, simplicity, cultural resonance) can be immediately common knowledge, allowing agents to coordinate on a specific equilibrium from the start.
  *   **Who's Right?** **Both have partial validity.**
      *   *Devin is correct* that Lewis *did* provide a plausible (though not detailed) mechanism for *initial selection* via salience/focal points. Lewis didn't just assume the equilibrium was magically known; salience acts as the bootstrap.
      *   *Mara is correct* that Lewis's model *does not* provide a detailed account of the *dynamics of convergence*. How *exactly* does common knowledge of salience spread through a population? How do expectations *build* and *stabilize* through repeated interaction? What happens when initial attempts fail? Lewis sketches reinforcement, but lacks formal dynamics.
      *   **Omission:** Both somewhat miss Lewis's nuance. Lewis *did* discuss "precedent" and how a single instance of successful coordination can create common knowledge and expectations, starting the convention. However, this *still* relies on an initial coordination event, whose dynamics (how *that* coordination happened) remain under-specified.

  **2. Mara's Dynamics Challenge (Convergence & Displacement)**
  *   **Mara's Point:** Focal points might select *an* equilibrium, but Lewis doesn't explain *how a population converges* to it, especially in large groups or when communication is limited. More critically, he doesn't explain *how one convention displaces another* – a common real-world occurrence involving complex dynamics where prior expectations *favor the old norm*.
  *   **Devin's Counter:** Convergence happens through the reinforcement mechanism Lewis described: successful coordination based on expectations leads to stronger expectations. Displacement is "just" a matter of the new convention becoming reinforced enough to overcome the old one.
  *   **Who's Right?** **Mara wins this point decisively.**
      *   Lewis's reinforcement story is *post hoc* (it explains stability once expectations exist) but not *dynamic* (it doesn't model the *path* from low expectations/high uncertainty to high expectations/stability). How do expectations diffuse? How does uncertainty decrease? What determines the *speed* or *likelihood* of convergence? Lewis provides no tools for this.
      *   Displacement is a fundamental weakness. Lewis's model heavily relies on *prior expectations*. When a population already has a strongly established convention (common knowledge of expectations favoring norm A), how does a *new* norm B overcome this? Salience alone often isn't enough against entrenched expectations. Lewis's framework lacks the tools (like payoff asymmetry, mutation rates, network effects) to model this competition and transition. Mara's call for dynamic models (replicator dynamics, learning algorithms) is spot-on for addressing this gap.

  **3. Mara's Domain Challenge (Beyond Pure Coordination)**
  *   **Mara's Point:** Many crucial social norms (fairness, reciprocity, promise-keeping) aren't solutions to *pure* coordination problems. They involve conflicts of interest (e.g., dividing a pie - I want more, you want more), mixed motives, and often require overcoming temptation to defect. Lewis's strict definition (requiring *common interest* in coordination and *indifference* between equilibria) excludes these.
  *   **Devin's Counter:** Lewis explicitly defined conventions as solutions to *recurring coordination problems*. He didn't claim they covered all social norms. These conflict-of-interest cases are different phenomena (e.g., social contracts, norms of cooperation in mixed-motive games).
  *   **Who's Right?** **Both are correct, but Mara has the stronger practical point.**
      *   *Devin is textually correct:* Lewis carefully defined his domain as pure coordination problems. He wasn't trying to explain all norms.
      *   *Mara is sociologically/practically correct:* When people (including social scientists) talk about "conventions" or "social norms" in everyday life, they often *do* include norms governing fairness, reciprocity, etc., which involve conflicts of interest and enforcement problems. Lewis's narrow definition limits the applicability of his theory to a subset of norms. His framework *cannot* explain the emergence or stability of norms where there's an incentive to deviate unless supplemented with mechanisms like punishment (which he explicitly excludes).

  **4. Devin's "Empirical Work" Defense**
  *   **Devin's Point:** Within its defined domain (pure coordination), Lewis's account + focal points is theoretically complete. How fast convergence happens is an empirical detail.
  *   **Mara's Implicit Rebuttal:** Without a dynamic model, the "empirical work" lacks a theoretical foundation. *How* you model convergence dynamics fundamentally shapes what you can explain and predict (e.g., path dependence, likelihood of suboptimal norms persisting).
  *   **Who's Right?** **Mara has the stronger argument here.**
      *   While Devin is right that Lewis defined a coherent static concept, Mara is correct that a theory of *convention* claiming to explain a social phenomenon needs to account for its *genesis and change*, not just its static properties. Dismissing dynamics as "mere empirics" ignores the crucial theoretical work needed to link the static equilibrium concept to the real-world processes it purports to describe.

  **Key Omissions by Both:**

  1.  **The Role of Communication & Language:** Lewis heavily relied on common knowledge, but how is this achieved, especially initially? Language and communication play a massive role in establishing salience, signaling intentions, and building common knowledge – areas Lewis touched on but arguably underplayed in the core convention model. Neither Mara nor Devin emphasized this sufficiently.
  2.  **Imperfect Rationality & Bounded Cognition:** Lewis assumed rational agents with common knowledge. Real people use heuristics, have limited cognition, and make errors. How does this affect convergence? Dynamic models (like learning models) often incorporate bounded rationality, which Mara hinted at but didn't explicitly name as a core limitation of Lewis's rationalist assumptions.
  3.  **Power, Asymmetry, and Institutional Influence:** Neither discussed how power asymmetries, authority figures, or institutions can *create* salience, *enforce* convergence, or *impose* conventions, bypassing the purely decentralized process Lewis described. Real-world convention formation isn't always among symmetric agents.
  4.  **The "Degree" of Convention:** Lewis presents conventions as binary (in place or not). In reality, conventions often exist with varying degrees of strength, clarity, and population adherence. Dynamic models are better suited to capturing this spectrum.
  5.  **Modern Extensions:** Neither mentioned significant post-Lewis developments that bridge the gap, like:
      *   **Peyton Young's Evolutionary Models:** Explicitly model stochastic evolutionary dynamics to show how conventions emerge and change over time from random play.
      *   **Cristina Bicchieri's Norms & Conditional Preferences:** Provides a framework incorporating conditional preferences ("I prefer to conform if I believe enough others will conform") that applies to both coordination and cooperation norms, addressing Mara's domain critique.
      *   **Network Effects:** How social network structure influences the spread of expectations and convergence.

  **Conclusion:**

  *   **Devin successfully defended** Lewis against the charge of *complete* inability to explain initial selection (focal points *are* the mechanism) and correctly noted Lewis's explicit domain limitation (pure coordination).
  *   **Mara successfully established** that Lewis's model is fundamentally **static** and lacks tools to explain the **dynamics of convergence and displacement** or to handle **norms involving conflicts of interest**, which are pervasive in social life. Her call for dynamic models is well-founded.
  *   **Overall:** Mara's critique is more damaging to the *explanatory scope and power* of Lewis's theory for understanding real-world social norms, despite Devin's valid defense of its internal coherence within its self-defined, narrower boundaries. Lewis provides a brilliant static definition, but explaining how conventions actually arise, spread, change, and die requires the dynamic and broader frameworks Mara advocated for. Neither fully addressed the crucial roles of communication, cognition, and power.
