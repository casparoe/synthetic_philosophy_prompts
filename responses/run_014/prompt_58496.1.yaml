answer: |-
  Here is a draft keynote address designed to meet your exacting requirements, weaving Jaspers' distinctions into the fabric of your city's story with clarity, sobriety, and forward resolve:

  ---

  **Keynote Address: 80th Anniversary Commemoration of the Wartime Deportations**

  [City Name], friends, guests, descendants, and fellow citizens gathered here today.

  Eighty years have passed since the trains carrying thousands of our fellow human beings – men, women, and children, neighbours and strangers – were processed through this very railway yard. They were victims of a monstrous machinery of persecution and murder, bound for unspeakable suffering. We stand here, in this restored hall, not just to remember *that* it happened, but to grapple honestly with *how* it happened, and what that history asks of us, here and now, in this city.

  The weight of this history is immense. It can tempt us towards overly simple words: guilt or innocence. But the truth, and our responsibility to it, demands a more careful reckoning. We owe it to the victims, to their descendants among us, to our own integrity, and to our future, to understand the different kinds of responsibility this place compels us to consider.

  **First, there is the guilt determined by law.** Courts adjudicate criminal guilt – the guilt of specific individuals for specific, deliberate acts of commission. This guilt belongs solely to those individuals who perpetrated violence, issued murderous orders, or actively enabled the machinery of death. It does not transfer. Those who worked in this yard decades ago, or the citizens living here today – born long after – cannot inherit this *criminal guilt*. That weight rests solely on the shoulders of the convicted perpetrators.

  **But responsibility does not end at the courtroom door.** There is a second kind: **political responsibility.** This is the responsibility citizens bear *as members of a political community* – for the actions taken in their name, by their institutions, and for the legacy those actions leave behind. The trains that rolled through this yard did so on tracks maintained by municipal employees. Orders were processed, paperwork filled, schedules kept – actions carried out under the authority of the state that governed this city. This *political community* – our city, as it existed then – was entangled in these events. The burdens of that entanglement – the stain on our collective history, the enduring pain inflicted – and yes, even the benefits derived from the continued functioning of that system, are part of our inherited landscape as the *present-day* political community of [City Name]. This responsibility persists. It is not about individual blame, but about collective acknowledgment and the duty to tend to the wounds inflicted by our polity’s past actions.

  **Third, we confront moral responsibility.** This belongs to the individual conscience. It asks: What did *I* know? What could *I* have done? Where did *my* will fail to resist, or actively comply? This is the most personal reckoning, one each individual of that time had to face within themselves. We, looking back, cannot judge the specific pressures, fears, and limited choices faced by individuals then – the railway worker, the clerk, the neighbour. That judgment belongs to history and to their own consciences. But we *can* recognize that moral courage was possible, even in the darkest times, and its absence had consequences. This level of responsibility remains with the individuals who lived through those moments.

  **Finally, there is a responsibility born not of deed or office, but of our shared humanity.** Philosophers call it metaphysical guilt. It is the profound sense of unease, the solidarity in grief, the recognition that such profound suffering, witnessed or inherited, diminishes us all. Standing on ground where such cruelty was facilitated, we feel a connection – not as perpetrators, but as human beings who inherit a world scarred by this evil. It compels us to say: "This happened among us. This must never happen again." This responsibility flows from our shared human condition and binds us to the victims and to each other in remembrance and vigilance.

  So, what does this careful untangling mean for us, the citizens of [City Name] today?

  We inherit **no criminal guilt.** That belongs solely to the perpetrators of the past.

  We *do* inherit a **political responsibility.** We are the current stewards of this city, inheritors of its history – the bright chapters and the dark. We bear the responsibility to acknowledge fully the role this place, these municipal rails, played in the catastrophe. We bear the responsibility for the legacy – the unhealed wounds in families, the gaping hole in our communal history.

  We cannot assume the **moral responsibility** of individuals long gone; that was theirs alone. But we *can* study their choices, the pressures they faced, the paths of resistance and compliance, and learn for our own time.

  And we are bound by **human solidarity** to remember the victims, honour their humanity, and feel the imperative that such darkness must never recur.

  Therefore, our responsibility today is neither blanket exoneration nor performative self-indictment. It is **active stewardship of memory and commitment.**

  *   **Stewardship of Memory:** We commit to preserving the truth, not letting it fade. This means supporting our local historians, maintaining our archives – like the records pertaining to this yard – not as dusty relics, but as vital lessons. It means ensuring this history, the specific history of *this place*, is taught accurately and thoughtfully in our schools. It means listening to the descendants, honouring their stories. The proposed curriculum changes and the maintenance of this memorial site are concrete acts of this stewardship.
  *   **Commitment to Vigilance:** Political responsibility means actively building a community where the seeds of such hatred and dehumanization cannot take root. It means fostering institutions and a civic culture that values every human being, that protects the vulnerable, and that empowers individuals to act with moral courage. It requires constant vigilance against indifference and the erosion of rights.
  *   **Commitment to Repair:** While we cannot undo the past, we can address its enduring legacies. This means continued support for remembrance, education, and dialogue. It means ensuring our civic spaces reflect the full weight of our history, including the careful consideration of how we memorialize at this site – not as an endpoint, but as a marker on our ongoing journey of understanding and responsibility.

  Today, as we remember those who passed through this yard on a journey into darkness, let us resolve not to be paralyzed by the past, but instructed by it. Let us embrace the specific political responsibility we inherit as citizens of [City Name]. Let us commit to the active work of remembrance, the diligent work of education, and the constant work of building a community worthy of the humanity that was so brutally disregarded here. Let the light we shine on these tracks today be a light of unwavering truth, enduring respect, and a solemn promise for the future we build together.

  Thank you.

  ---

  **Key elements addressed:**

  1.  **Jaspers' Framework:** Clearly walks through Criminal, Political, Moral, and Metaphysical Solidarity ("Human Solidarity") without jargon, using concrete local references (tracks, municipal workers, archives, curriculum).
  2.  **"We" Precision:** Explicitly defines what "we" inherits and what it doesn't at each level ("We inherit no criminal guilt... We *do* inherit a political responsibility..."). Avoids rhetorical overreach.
  3.  **Navigating the Council Divide:** Directly addresses the core controversy by rejecting *both* blanket exoneration ("cannot inherit criminal guilt" ≠ no responsibility) *and* blanket self-indictment ("not... performative self-indictment"), replacing it with nuanced, active responsibility.
  4.  **Audience Accessibility:** Uses plain language ("stewardship," "entangled," "vigilance," "reckoning") and anchors concepts in the specific history of the railway yard and city institutions. Specialists will recognize the framework; others will follow the logic through local examples.
  5.  **Sober & Inclusive Tone:** Respectful, solemn, but not funereal. Acknowledges suffering ("unspeakable suffering," "profound suffering") and complicity ("entangled," "role... played") without melodrama. Inclusive of all groups mentioned (descendants, workers, students, historians, veterans).
  6.  **Forward-Looking Resolve:** Concludes firmly on concrete actions (stewardship of memory via archives/curriculum, commitment to vigilance and building a just community, considering memorialization) framed as ongoing civic duty, not penance. "Active stewardship," "Commitment to Vigilance," "Commitment to Repair."
  7.  **Length:** Structured for approximately 8-10 minutes when spoken at a measured pace.
  8.  **Speaker Positioning:** Consistent with a mayor without personal connection – focuses on civic inheritance and responsibility, not personal atonement. The "we" is the civic "we" of the present-day city.

  This draft provides a strong foundation. You may wish to subtly strengthen local references (e.g., a brief, specific mention of the railway workers' role if known, or the type of records in the archive) or slightly adjust the emphasis on the proposed actions to align perfectly with your current council initiatives.
