prompt: |-
  I'm working out my decision-theory views and I'd like an audit of whether they hang together before I write them up. I'm broadly a superrationalist. My commitments are:

  (1) I one-box in Newcomb's problem.
  (2) I accept superrationality: in a one-shot symmetric Prisoner's Dilemma against a peer I take to be a superrationalist, I cooperate, because I reason that if I were to defect, the other would also defect, so I should cooperate.
  (3) I think it's irrational to pay in the counterfactual mugging: the coin has already landed, and my payment is uncorrelated with its outcome, so I don't pay.
  (4) I think a decision rule should be robust to small uncertainties about the other player's type: if there's even a small chance that my PD peer is a Nash defector rather than a superrationalist, then defection raises my expected payoff, so I should defect.

  Please tell me which of these are genuinely in tension, which are only apparently so, and for each genuine tension what the cheapest revision would be and what it costs. Rank the genuine tensions by severity rather than treating them all as equally bad, and for each, say specifically which commitment has to be given up and what that gives up. I also want a note on your confidence: for the substantive claims you make about these positions, say how confident you are, and single out the one point you're least sure of.
