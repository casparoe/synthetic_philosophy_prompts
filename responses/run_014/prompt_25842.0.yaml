answer: |-
  The two-tiered standard of proof in common-law systems presents a rich case study for epistemology, revealing tensions between stakes-sensitive and stakes-invariant views of justification. Below is a reconstruction of the implicit epistemology, distinguishing necessary presuppositions from compatible interpretations, and identifying areas of underdetermination.

  ### 1. **The Core Tension: Stakes-Sensitive vs. Stakes-Invariant Justification**
     - **Stakes-Sensitive View (SSV)**:  
       The practice *fits well* with the idea that epistemic standards shift with practical stakes (a form of *pragmatic encroachment* in epistemology). Here, the same evidence might justify belief for civil liability (where the cost of error is financial) but not for criminal conviction (where error risks liberty and reputation). The asymmetry suggests that "sufficient evidence" is context-dependent: what counts as "knowing" the defendant caused harm depends on what’s at stake.  
       - *Presupposition?* The practice **does not strictly presuppose SSV** but is *highly congruent* with it. SSV explains why the *same fact-finder* might demand higher certainty when stakes are high.

     - **Stakes-Invariant View (SIV)**:  
       The practice can be explained by treating standards of proof as *decision-theoretic thresholds* rather than shifting epistemic standards. On this view, the evidence justifies a fixed degree of belief (e.g., "60% likely" for preponderance; ">90% likely" for beyond reasonable doubt). The legal system then sets *action thresholds* based on societal values: we require near-certainty to impose criminal penalties but accept lower confidence for civil liability.  
       - *Presupposition?* SIV is **equally compatible** with the practice. The system may presuppose only that *institutional rules* respond to stakes, not that knowledge itself is stakes-relative.

  ### 2. **Consistency with Other Legal Principles**
     - **Judges Ignoring Consequences in Legal Interpretation**:  
       When judges determine "what the law is," they are instructed to avoid consequentialist reasoning. This reflects a commitment to *legal objectivity* and *rule-of-law values* (consistency, predictability). Crucially, this applies to *legal* questions, not *factual* ones. The standards of proof govern factual determinations, where stakes are inherently tied to outcomes. **No inconsistency**: The law separates epistemic/practical stakes in *fact-finding* from neutrality in *legal interpretation*.

     - **Shared Rules of Evidence**:  
       Common rules (e.g., hearsay exclusions) apply to civil/criminal cases, suggesting uniform epistemic norms for *admissibility*. Yet the *sufficiency* standard differs. This aligns with **SIV**: evidence is evaluated identically, but the *confidence threshold* for acting varies. SSV can also accommodate this if "sufficiency" is distinct from "admissibility," but it requires more nuance.

  ### 3. **What the Practice Strictly Presupposes**
     - **Minimal Commitments**:  
       1. **Asymmetric Error Costs**: False convictions are deemed *morally worse* than false civil liabilities.  
       2. **Degrees of Confidence**: Factual judgments admit of gradation (not binary "true/false").  
       3. **Institutional Design**: Legal rules can permissibly prioritize reducing one type of error (false convictions) over another (false acquittals/civil errors).  
       *These presuppositions are neutral between SSV and SIV.*

     - **No Necessary Epistemic Commitment**:  
       The system does *not* presuppose that "knowledge" is stakes-relative. It only requires that *the level of certainty demanded for state action* varies with consequences. Even if knowledge is invariant, the law can demand higher certainty when risks are grave.

  ### 4. **Philosophical Underdetermination**
     - **The Threshold Question**:  
       The practice is **underdetermined** regarding whether evidentiary thresholds reflect:  
       - (a) A shift in *what counts as justified belief* (SSV), or  
       - (b) A fixed epistemic state with variable *action-guiding rules* (SIV).  
       Either model justifies the asymmetry equally well. The law’s silence on this implies institutional pragmatism, not epistemological resolution.

     - **"Knowledge" in Legal Contexts**:  
       The system avoids claiming defendants are "known" guilty in civil but not criminal cases. It speaks only of *meeting burdens of proof*. This suggests **SIV is the implicit default**: the law regulates decisions, not the metaphysics of knowledge.

     - **Broader Epistemic Implications**:  
       The practice *challenges* radical invariantism (which denies stakes ever affect justification) but is *compatible* with both moderate pragmatic encroachment and rigid invariantism + contextual decision rules.

  ### 5. **Synthesis: A Hybrid Implicit Epistemology**
  The legal system’s epistemology is best reconstructed as **pragmatically pluralist**:  
  - **Evidence Evaluation (Stakes-Invariant)**: Rules of evidence/reasoning apply uniformly (supporting SIV).  
  - **Sufficiency Thresholds (Stakes-Sensitive)**: The *quantum* of evidence required scales with consequences (congruent with SSV).  

  This hybrid view distinguishes *factual justification* (governed by logic/evidence) from *procedural justification* (governed by social risk). The asymmetry in standards thus reflects institutional risk allocation, not necessarily a relativistic view of knowledge. However, it remains philosophically open whether stakes influence the *epistemic status* of beliefs or only the *practical license to act* on them.

  ### Conclusion
  The practice presupposes that **practical stakes determine how much certainty is required for state intervention**, but not that knowledge itself is stakes-relative. It is equally consistent with:  
  - A stakes-invariant epistemology + variable decision thresholds (SIV), or  
  - A weak pragmatic encroachment view where high stakes raise justificatory demands (SSV).  

  The underdetermination lies in whether "sufficiency of evidence" is an epistemic or practical norm. Legal systems prioritize reducing catastrophic errors over epistemological purity, leaving the metaphysics of justification deliberately unaddressed.
