answer: |-
  Based on your friend's track record and her role-based Confucian framework, I'll analyze the implicit rules, predict her responses to the new cases, compare alternative rules, and propose a decisive test case. Her approach consistently prioritizes **relational hierarchy + lived intimacy**, not just formal roles. Role definitions (e.g., "parent") are weighted by emotional closeness and history.

  ### Core Patterns from Past Verdicts:
  1. **Hierarchy overrules circumstance**: Family roles (parent, spouse, child, sibling) systematically outrank friends, even when claims are comparable.  
  2. **Lived intimacy > nominal roles**: Within categories, depth/tenure of relationship decides (e.g., 20-year friend > 2-year acquaintance).  
  3. **Parental supremacy**: Mother trumped spouse-equivalent claims (son’s event) and close friends. Siblings also outrank friends.  
  4. **Friendship as lowest tier**: Friends are expected to understand deferrals to family, and deeper friendships have priority over shallow ones.  

  ---

  ### Predictions for New Cases:
  **Case 1 (Department Head vs. Closest Friend in Crisis):**  
  - **Prediction:** She helps her closest friend.  
    - **Why:** The department head is a nominal "ruler-minister" role but lacks emotional closeness ("not close, does not much like"). Meanwhile, the 20-year friend represents the deepest tier of friendship—a role she’s historically prioritized over work obligations. Institutional importance is secondary to lived intimacy; she’d expect the colleague to cover it.  

  **Case 2 (Estranged Sister vs. Closest Friend):**  
  - **Prediction:** She helps her sister.  
    - **Why:** Despite estrangement, the sibling role is sacrosanct in her hierarchy (past verdicts show siblings > friends). "Through no wish of her own" implies she still honors the role’s obligations. The closest friend, while deeply valued, falls below kinship. She’d see reconciling with her sister as a higher duty.  

  ---

  ### Candidate Rules & Their Fit to Past Verdicts:
  Three rules explain her past decisions equally well. All align with her verdicts so far but diverge in the new cases:  

  | **Rule**                     | **Key Mechanism**                                     | **Fit to Past Verdicts**                                                                 | **Prediction: Case 1**      | **Prediction: Case 2**      |
  |------------------------------|-------------------------------------------------------|------------------------------------------------------------------------------------------|------------------------------|------------------------------|
  | **A. Kinship Absolute**      | Blood relations > marital/friend roles. Parent/child > sibling > spouse > friend. Ignores estrangement/closeness. | Explains mother > son, brother > friend, mother > friend. Spouse > friend fits if spouse is "honorary kin." | Friend (no blood tie to boss) | **Sister** (kinship trumps estrangement) |
  | **B. Lived Role Weighting**  | Formal roles + emotional weight. Closeness/duration enhance role obligations. Estrangement weakens roles. | Explains 20-yr friend > 2-yr friend; mother > son (closer?); spouse > friend (deeper bond). | **Friend** (boss lacks closeness) | **Friend** (estrangement weakens sister role; friend has stronger lived bond) |
  | **C. Confucian Five Fixed**  | Strict classical hierarchy: ruler-minister > parent-child > husband-wife > elder-younger sibling > friend. Ignores personal feelings. | Friend always loses to family/spouse; sibling > friend. But mother > spouse? Not explicit in classics. | Boss (ruler-minister > friend) | Sister (sibling role > friend) |

  **Which Rule Fits Best?**  
  - **Rule B (Lived Role Weighting)** is the strongest bet:  
    - It perfectly explains why she prioritized her **mother over her son** (emotional closeness trumps nominal role) and **spouse over a 20-year friend** (marriage as "different order" implies depth, not just formality).  
    - It accounts for **all past cases** without exceptions, while Rule A struggles with spouse>friend (if spouse isn’t "blood") and Rule C struggles with mother>spouse (not in hierarchy).  
  - **Rule C would be her self-described framework**, but her *actions* show flexibility (e.g., no past cases defer to authority figures; kinship often overrides strict role order).  

  **Betting on Rule B:**  
  - **Case 1:** Boss has weak "lived" ruler-minister bond → **friend wins**.  
  - **Case 2:** Sister has nominal role but estrangement ("lived" weakness) vs. friend’s strong lived bond → **close friend wins?** But I predict she chooses sister because kinship *formality* may still dominate here (per mother>son). **Rule B could split either way**, making Case 2 pivotal.  

  ---

  ### A Further Case to Separate Rules:
  To decisively distinguish Rule A (Kinship Absolute) from Rule B (Lived Weighting), propose this:  
  > *"Your mother and spouse both need you urgently for similar, moderate tasks at the same time (e.g., attending medical appointments). You are equally close to both."*  

  - **Rule A (Kinship Absolute):** Chooses **mother** (parent-child > husband-wife).  
  - **Rule B (Lived Weighting):** Might choose **spouse** (if marital bond is deeper in practice) or **mother** (if parental bond is stronger). But past verdicts suggest she’d pick mother, as parental supremacy overrode even her son’s claim.  
  - **Rule C (Five Fixed):** Unclear—classical Confucianism prioritizes parent-child over husband-wife, but she’s never faced this conflict.  

  **Why this works:**  
  - It isolates kinship vs. marital bonds without estrangement/closeness variables.  
  - Her mother>son verdict suggests parental supremacy, but spouse>friend shows marital weight. If she chooses mother, Rule A/B align; if spouse, Rule B wins.  

  ### Conclusion:
  Your friend’s rule is **"Hierarchy of roles, dynamically weighted by emotional closeness and history."** For the new cases:  
  - **Case 1:** She helps the friend (boss lacks lived weight).  
  - **Case 2:** She helps her sister (kinship formality overcomes estrangement).  

  But Case 2 is the true test—if she chooses the friend, Rule B (Lived Weighting) dominates; if sister, Rule A (Kinship Absolute) or Rule C (Five Fixed) does. The mother-vs-spouse case will clarify further. Her philosophy is less about rigid rules than the moral gravity of "thick" relationships.
