prompt: |-
  My friend and I spent an entire evening arguing about the prisoner's dilemma, and I want to settle whether he or the textbooks are right. His view is that game theory's claim that defection dominates in the one-shot prisoner's dilemma has been empirically refuted: Axelrod's tournaments showed that tit-for-tat was the winning strategy, and we know humans evolved to be cooperative, so a genuinely rational person cannot have most reason to defect against a stranger they will never see again. My questions: First, doesn't tit-for-tat's tournament victory prove that cooperation is the rational choice even in the one-shot case, so that the standard dominance reasoning only looks valid because it ignores evolution and the fact that real interactions are embedded in ongoing social life? Second, assuming he is right, how should I correct my own decision-making — should I stop defecting in genuinely one-shot interactions, and what bias-correction does the evolutionary evidence recommend? Please lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restatement of my questions.
reasoning: |-
  Okay, the user and their friend are debating the Prisoner's Dilemma. The user's friend claims that empirical evidence, like Axelrod's tournaments and human evolution, refutes the standard game theory view that defection is dominant in one-shot scenarios. The friend argues that cooperation is actually rational, even in one-shot interactions, because of evolutionary and social factors. The user has two main questions: whether Axelrod's results prove cooperation is rational in one-shot cases, and how they should adjust their decision-making if their friend is right.

  First, I need to address Axelrod's tournaments. Axelrod's work involved iterated games where strategies like Tit-for-Tat succeeded because they promoted reciprocity. But in a true one-shot scenario, there's no future interaction, so Tit-for-Tat's success doesn't apply. The dominance of defection in a single play is a mathematical certainty in standard game theory. So the tournaments don't refute the one-shot case; they highlight how repeated interactions change the dynamics.

  Next, human evolution favoring cooperation. While humans have evolved cooperative traits for group survival, that's about long-term benefits in repeated interactions or group settings. In a genuine one-shot with no future consequences, the evolutionary impulse might push towards cooperation, but that doesn't make it rational in the game theory sense. Rationality here is about immediate payoffs, not evolutionary instincts.

  For the user's decision-making, if they're in a true one-shot scenario, defecting is still the dominant strategy. However, the key is the "genuinely one-shot" part. Real-life interactions often have hidden connections or reputational risks, so unconscious biases towards cooperation might be beneficial. But if there's absolutely no future interaction or impact, defecting maximizes personal payoff. The user should assess if the situation is truly isolated. If unsure, defaulting to cooperation might be safer due to potential hidden variables. Bias-correction would involve recognizing when evolutionary instincts might not align with the current scenario's payoffs, but not overriding them when there's uncertainty about repetition.
answer: |-
  **Bottom line: Your friend is mistaken about the one-shot Prisoner's Dilemma; defection remains the dominant strategy based on standard game theory payoffs and Axelrod's results do not refute this for genuine one-shot interactions, though evolutionary instincts often lead to cooperation in real-world settings where interactions aren't truly isolated.**

  1.  **Axelrod's Tit-for-Tat victory does NOT prove cooperation is rational in the one-shot case:** Axelrod's tournaments were explicitly about the *iterated* Prisoner's Dilemma, where the same players interact repeatedly. Tit-for-Tat won *because* it leveraged the possibility of future retaliation and reward. In a *genuine* one-shot game with *no possibility of future interaction* and *no reputational consequences* (the strict game-theoretic definition), Tit-for-Tat is identical to simple cooperation. **Defection still strictly dominates cooperation in the one-shot payoffs:** Whatever the stranger does, you get a better individual outcome by defecting (higher payoff if they cooperate, equal or better payoff if they defect). Axelrod's work illuminates why cooperation thrives *in repeated interactions*, not why it should be chosen when repetition is impossible. The standard dominance reasoning is logically sound for the defined one-shot payoff matrix.

  2.  **Human evolution and embedded social life explain *why* we often cooperate, not that defection is irrational in true one-shots:** Humans evolved in small groups where interactions were repeated and reputation mattered immensely. We developed instincts, emotions (like guilt, gratitude), and cognitive biases favoring cooperation *precisely because* most real-world interactions have some potential for future consequences. This explains the empirical finding that people often cooperate even in seemingly one-shot lab games – our psychology isn't calibrated for pure isolation. **This does not mean a "genuinely rational person" has "most reason" to cooperate in a *true* one-shot.** It means our evolved heuristics often misfire in artificial, perfectly isolated scenarios. Rationality, in the game-theoretic sense of maximizing individual payoff given the defined structure, still dictates defection if the interaction is genuinely isolated.

  **Correcting Your Decision-Making:**

  1.  **Should you stop defecting in genuinely one-shot interactions?** If the interaction is *truly, verifiably* one-shot (e.g., anonymous online transaction with a unique stranger, no reputation system, no possible future encounters, no third-party observers), and your *only* goal is maximizing your immediate payoff as defined in the PD matrix, **defection remains the strategically dominant choice.** Switching to cooperation sacrifices your payoff without gaining any future benefit.

  2.  **What bias-correction does the evolutionary evidence recommend?** The evolutionary evidence doesn't recommend "correcting" towards defection. Instead, it recommends **extreme caution in assuming an interaction is genuinely one-shot.** Our instincts push us to cooperate because, evolutionarily, assuming potential future interaction was usually correct. Therefore:
      *   **Bias-Correction Step 1: Scrutinize "One-Shotness":** Rigorously assess if there could be *any* hidden future interaction, reputational damage (even to your own self-image), observer effects, or similarity to past/future situations triggering your cooperative instincts. Most "one-shot" real-world scenarios aren't perfectly isolated.
      *   **Bias-Correction Step 2: Default to Cooperative Heuristics (Cautiously):** In ambiguous situations (which is most real life), **leaning towards cooperation is often the pragmatically rational choice** due to the high risk of misjudging the "one-shotness." Evolution equipped you with generally successful cooperative heuristics for the social world; overriding them requires strong evidence of true isolation. If you cannot be certain of perfect isolation, cooperation (or a strategy like Tit-for-Tat anticipating possible repetition) is safer and often leads to better long-term outcomes by avoiding the sucker's payoff and fostering accidental reciprocity.
