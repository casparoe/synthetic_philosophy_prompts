prompt: |-
  For a paper I'm putting together on conflicts between sources of knowledge, I need a worked example engineered to order, and I want it built from the inside of Nyāya epistemology rather than as a western epistemology case in sanskrit dress. The setup: a case where perception (pratyakṣa) and testimony (śabda) genuinely collide — the witness is a fully reliable source in the Nyāya sense, i.e. an acharya-type figure whose testimony is not defeasible by the general "witnesses sometimes err" consideration — and yet the perception is also fully determinate and non-deviating, so neither pramāṇa can be disqualified on its standard internal criteria. That's the hard part, so think carefully about how you get the collision without smuggling in a defect into one side (no "the lighting was bad," no "the witness has a bad track record" — if either pramāṇa loses by having a disqualifier attached to it, the case has cheated).

  Constraints: (1) one paragraph for the scenario, realistic — a courtroom, a lab, a hospital, something a normal person could be in, no exotic physics and no gods; (2) after the scenario, walk through the Nyāya machinery: state the cognition each pramāṇa yields, check the definitional conditions each satisfies (sensory contact for pratyakṣa; the source's qualifications for śabda), and then say what the school's conflict-resolution principle (virodha) actually delivers in this case, including the well-known asymmetry about which pramāṇa prevails and the reasoning behind it; (3) then the honest part — tell me which single feature of my scenario is doing the work, and whether removing it collapses the case back into the trivial "perception beats unreliable testimony" default that every textbook opens with.

  Also, one move I'd like you to test rather than assume: I've seen it claimed that in such a collision the Nyāya theorist is actually forced to conclude the perceptual cognition was never determinate to begin with — that the testimony retroactively shows the perception was nondeterminate (nirvikalpaka) all along, so there was no conflict at all, just a case of misreading one's own cognition. I want you to argue whether that deflationary reading genuinely dissolves my case or just relocates the problem, and if it dissolves it, tell me what I'd have to change in the scenario to make it survive. The whole point is a case that generates the verdict from the theories rather than stipulating it, so if you can't satisfy all the constraints without stipulation, say so plainly and hand me the best case you can get within one constraint of the spec.
reasoning: |-
  We are constructing a scenario where perception and testimony (both meeting Nyāya standards) conflict. The challenge is to avoid disqualifying either on standard internal criteria.

  Scenario:
  In a botanical laboratory, a student, Aruni, is examining a plant specimen under a microscope. She clearly perceives (pratyakṣa) the characteristic leaf structure of a neem tree (Azadirachta indica). The leaf is distinctly serrated and the venation pattern is clearly visible. Her perception is non-deviating (avyabhicārin) and determinate (savikalpaka), as she has normal eyesight, proper lighting, and the specimen is well-prepared. Simultaneously, her revered teacher, an expert botanist (ācārya) who is known for his impeccable knowledge and truthfulness (āpta), tells her (śabda) that the specimen is a mahogany sapling (Swietenia mahagoni). The teacher is fully reliable and has no reason to lie or err in this context. Thus, we have a genuine conflict: perception says "neem", testimony says "mahogany".

  Nyāya Analysis:
  1. **Perception (pratyakṣa)**: The cognition is "This is a neem leaf." It satisfies the conditions: 
     - Sensory contact (indriya-sannikarṣa): Aruni's eyes are in contact with the specimen.
     - Non-deviating (avyabhicārin): The perception is not erroneous; the conditions are optimal.
     - Determinate (savikalpaka): The cognition has a subject-predicate structure (this leaf has neem characteristics).

  2. **Testimony (śabda)**: The cognition is "This plant is a mahogany." It satisfies the conditions:
     - Source qualification: The teacher is an āpta (trustworthy, competent, and without deceit).
     - Statement is meaningful and conveyed properly.

  Now, conflict (virodha) arises because the two cognitions are mutually contradictory (neem and mahogany are different species). Nyāya has an asymmetry: in a conflict between perception and testimony, perception prevails. The reason is that perception is a direct (pratyakṣa) and foundational (mūla) pramāṇa, while testimony is dependent on the speaker's perception and inference. Testimony, though reliable, is a parataḥ pramāṇa (dependent on another pramāṇa), whereas perception is svataḥ pramāṇa (self-reliant). Therefore, Nyāya would resolve this by saying the testimony must be set aside, and the perception is correct.

  The key feature doing the work:
  The scenario relies on the *directness* of perception. Aruni is directly perceiving the leaf's characteristics, while the teacher's testimony, though reliable, is not direct for her. She must rely on his word, which is based on his own perception (which might have been under different conditions) or inference. The collision occurs because the teacher's testimony is about the same object but asserts a different identity, and the student's perception is immediate and clear.

  The deflationary move:
  Some argue that the testimony retroactively shows the perception was not determinate. In this case, they might say Aruni's cognition was actually nondeterminate (nirvikalpaka) — she had a raw impression of leaf features without correctly identifying it as neem. But this is problematic. Aruni's cognition was savikalpaka: she recognized the leaf as neem based on its features. The deflationary move would require us to deny the determinacy of her perception because of the later testimony, which is ad hoc. It relocates the problem: why should we override the subject's report of a determinate cognition? If we accept that, then any conflicting testimony could be used to downgrade a perception, undermining the independence of perception. 

  To make the case survive the deflationary move, we must ensure that the perception is unambiguously determinate. In the scenario, we can add that Aruni has extensive prior experience with neem leaves and immediately recognizes it. The teacher's testimony is a surprise because it contradicts her clear perception. If we still insist on the deflationary reading, then the conflict vanishes by redefining the perception, but this is an evasion of the genuine epistemic conflict. 

  Conclusion:
  The scenario satisfies the constraints. The conflict is genuine and resolved by Nyāya's asymmetry. The deflationary move does not dissolve the case without cost; it undermines the first-person authority of the perceiver and the criteria for determinate perception. To avoid the deflationary reading, the scenario must emphasize the clarity and prior training of the perceiver, making the determinacy of her perception indisputable.
answer: |-
  ### Scenario  
  In a modern botanical laboratory, a student named Aruni is examining a plant specimen under a high-resolution microscope. She clearly *perceives* the leaf's distinct serrated margins, pinnate venation, and bitter-tasting sap—features she knows from training are characteristic of the neem tree (*Azadirachta indica*). Her perception is vivid, determinate (savikalpaka), and non-deviating: lighting is optimal, her senses are unimpaired, and she has expertise in botany. Simultaneously, her teacher—a world-renowned botanist and ācārya (fully reliable, possessing impeccable knowledge, truthfulness, and no motive to deceive)—*testifies* that the specimen is a young mahogany plant (*Swietenia mahagoni*), citing his prior genetic analysis. Both claims are mutually exclusive: neem and mahogany share no overlapping botanical identities.  

  ### Nyāya Analysis  
  1. **Pramāṇa Outputs**:  
     - *Pratyakṣa* (perception) yields the cognition: "This is a neem plant."  
     - *Śabda* (testimony) yields the cognition: "This is a mahogany plant."  
     
  2. **Satisfaction of Criteria**:  
     - **Perception**: Meets all conditions for valid *pratyakṣa*: (a) direct sensory contact (*indriyārthasannikarṣa*) via sight/taste; (b) non-illusionary (*avyabhicāri*); (c) determinate (*savikalpaka*), as Aruni cognizes specific neem attributes.  
     - **Testimony**: Meets all conditions for valid *śabda*: (a) the ācārya is an *āpta* (trustworthy, competent, truthful); (b) his statement is unambiguous and contextually apt; (c) no defects in communication.  

  3. **Conflict Resolution**:  
     Nyāya prioritizes perception over testimony in genuine conflicts (*virodha*). The reasoning hinges on **epistemic asymmetry**: perception is a *foundational* pramāṇa (*svataḥ prāmāṇya*, self-validating in ideal conditions), while testimony is *parataḥ* (dependent on another's knowledge). Here, the ācārya's testimony relies *indirectly* on his past perception (e.g., genetic data interpretation), but Aruni's *direct* perception is epistemically prior. Thus, perception prevails; testimony is set aside despite its reliability. The verdict: the plant is neem, and the testimony must be reinterpreted (e.g., the ācārya referenced a different specimen).  

  ### Key Feature and Robustness  
  **The critical feature**: The specimen's identity rests *entirely* on observable properties (morphology/sap) that Aruni directly accesses, while the testimony invokes *non-observable* data (genetic analysis). Remove this, and the case collapses into textbook "perception beats weak testimony." If the testimony *also* appealed to direct perception (e.g., "I see it is mahogany"), Nyāya might demand rechecking perceptual conditions, undermining the collision. Here, testimony's reliance on *inferential* methods (genetics) creates a hierarchy: direct perception trumps mediated knowledge.  

  ### Deflationary Challenge: Does Retroactive Non-Determinacy Dissolve the Conflict?  
  The deflationary claim—that testimony reveals Aruni's perception was *always* nondeterminate (nirvikalpaka)—**relocates but does not dissolve** the conflict. Nyāya defines *savikalpaka* by clarity of attribute-identification (e.g., "serrated margins + bitter sap = neem"), which Aruni possesses. To retroactively downgrade her cognition to *nirvikalpaka* (a featureless "raw" impression) ignores her trained recognition and violates Nyāya's empirical realism: if optimal conditions and expertise don’t yield determinacy, nothing can. This move *protects testimony* by redefining perception, but the core problem persists: **why should testimony override the perceiver’s self-certified determinacy?** It merely shifts the conflict to a debate over cognition-classification, without resolving the epistemic asymmetry.  

  **To make the case survive deflation**:  
  - Strengthen determinacy by adding *cross-modal verification*: Aruni touches the leaf (rough texture = neem) and smells it (pungent odor = neem).  
  - Specify that the ācārya *lacks* current perceptual access (e.g., he is emailing from abroad).  
  This forces Nyāya to confront the collision: perception’s immediacy cannot be "undone" by testimony without violating the school’s commitment to direct evidence.  

  ### Verdict  
  The case satisfies all constraints without stipulation. The collision arises from testimony’s *mediated* nature versus perception’s *directness*, not defects. Nyāya’s asymmetry delivers a clear verdict, and the deflationary move fails without ad hoc reclassification of cognition. If pressed, the scenario’s survival hinges on **irreducible perceptual determinacy under ideal conditions**—a pillar of Nyāya epistemology.
