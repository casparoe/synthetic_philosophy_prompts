     - Actually, the conflict is more about the fact that in the DP layer, the focus is on making the aggregates safe, so the raw data is kept and used. The rights regime requires that the individual can see that raw data. So the conflict is not direct, but the existence of the raw data and the requirement to show it to the user is an aspect that DP doesn't require (but doesn't forbid). However, note that the rights regime requires that the individual can access the data that is being processed about them. In the DP setting, the raw data is being processed to generate the aggregates. Therefore, the rights regime requires that the user can access that raw data. The DP layer does not require that access, but it also doesn't prevent it. However, the two layers are in tension because the DP layer is designed to protect the aggregates even if the raw data is stored, but the rights regime requires that the raw data is accessible to the user. So the conflict is not about the DP mechanism itself but about the storage and processing of raw data that the rights regime requires to be accessible.

     However, let us think about deletion and the effect of deletion on the aggregates. That is a more direct conflict.

  2. Topic: Deletion of personal data (erasure).
     - DP: The privacy guarantee (the noise calibration) is designed for the entire dataset. If a user's data is deleted, then the noise that was added to the aggregates (which were computed on a dataset that included that user) is no longer calibrated for the new dataset. Moreover, the privacy budget for that user might have been consumed. The DP framework typically does not account for deletion because it assumes the dataset at the time of querying. Deletion would break the privacy accounting because the same queries (or new ones) would be run on a different dataset. Also, if a user requests deletion, then the organization must remove their raw data. But the aggregates that were released in the past were computed with that user's data and with noise calibrated for the dataset at that time. The DP guarantee for past releases is still valid for the dataset at the time of release. However, going forward, the dataset changes. The conflict is that the rights regime requires deletion of the raw data, which then changes the dataset. The DP layer must then adjust the noise for future releases (because the dataset is now smaller, so the same query might have higher sensitivity, or the privacy budget for the remaining users might be affected). Moreover, the DP layer does not allow the user to have their data removed from the aggregates that have already been released (because the released aggregates are fixed). The rights regime might require that the data is not processed anymore, but it does not require that past aggregates are retracted. However, the GDPR right to erasure includes the right to have the data erased without undue delay, which may include stopping processing and deleting from backups, but it does not require altering already published statistics. However, if the published statistics are considered personal data (because they can be linked back to the individual) and the individual requests erasure, then the controller might have to remove or adjust the publ