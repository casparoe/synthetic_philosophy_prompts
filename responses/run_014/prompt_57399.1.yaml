prompt: |-
  I've been a 911 dispatcher in a rural county for six years and I'm halfway through a part-time bioethics certificate at the community college, mostly because my wife wanted me to have a thing. This week's unit is the doing/allowing distinction — killing versus letting die — and I assumed I'd breeze through it, since I've basically been living inside the distinction since 2019. Instead I sat down on my days off and wrote out my actual verdicts on a bunch of cases, real and hypothetical, and they don't hang together at all. I don't want a summary of the literature or a survey of positions. I want the principle behind my verdicts, if there is one.

  Here's the rule of thumb I've been defending in class, which I actually believe: an act *does* harm if things end up worse than they would have if I'd never been involved at all; it merely *allows* harm if the bad thing was already on its way and I just failed to intercept it. Now the cases. (1) Washed-out road, unconscious diabetic, no rig can reach him for forty minutes; I don't coach his wife through the glucagon kit in the house because our medical director's protocol says don't coach on medications. He dies. Verdict: allowing, and I feel bad but it's allowing. (2) Same call, but I do coach her, and I describe the wrong product — I give her the steps for a vial and syringe when what they have is something else — and what she ends up injecting him with is his insulin pen, which was sitting right next to it. He dies. Verdict: doing. I did that with my mouth, from thirty miles away, through her hands. (3) Man choking, alone, twelve minutes out. I put him on speaker and walk him through abdominal thrusts against a chair back. He does it wrong and dies sooner than he otherwise would have. Verdict: doing — except my rule says allowing, because I didn't start anything, the death was already on track. (4) Same man, same twelve minutes, I say nothing at all, just send the rig and stay on the line so he isn't alone. He dies at about the same moment. Verdict: allowing. So (3) and (4) differ only in whether I made noises, and I think that difference is real and not just a feeling, but I can't say what it is. (5) We used to staff a warm line for a valley with no cell coverage, a landline the county paid to keep up; the county cancels the program for budget reasons, and six months later a man out there has a heart attack, can't reach anyone, dies. Verdict: allowing. (6) Same valley, same line, still funded; a woman calls and starts describing symptoms and my shift ends at seven and I hang up without logging it because I don't want to eat into overtime, and she dies. Verdict: doing. Note that (5) and (6) differ only in where the off switch got flipped, in a budget office or in my hand, and my rule does get the right answers, but it feels like it gets them for the wrong reason. (7) Hospice patient's daughter calls and asks us not to send anyone; he's actively dying; I log it and send nothing. Verdict: allowing, and completely fine. (8) There's a standing no-heroics agreement on file for one particular nursing home — genuine, signed, but nobody at the scene can confirm it and I can't reach the administrator at three in the morning — so I don't send. A resident dies. Same shape as (7), minus anybody actually saying so at the time. Verdict: doing, or at least way closer to it. Which makes me suspect that what's carrying the weight in (7) isn't doing versus allowing at all, it's whose choice it was. (9) Our only ALS rig is on a call forty minutes the other direction; a farmer with a crushed leg bleeds out before anything can reach him. Verdict: allowing, obviously, I didn't crush his leg. Except I'm the one on the only line with the only map, and if I hadn't answered, his wife might have driven to the next county's station and gotten somebody, and I know how insane that sounds out loud but my rule of thumb seems to require taking it seriously.

  So: is there a principle, or a small set of them, that delivers these verdicts? State it precisely, clause by clause, and tell me which case each clause is there to handle — if a clause isn't earning its place by fixing one of my cases, cut it. If you need two competing principles rather than one, give me both and say which case forces the split. Then tell me honestly which of my verdicts you can't save, and which one I should give up; I'd much rather lose one verdict than recieve a principle with eleven clauses and a footnote. And please answer this directly, because it's the part that's actually keeping me up: what is "if I'd never been involved" supposed to mean — never taken the job, never answered that phone, or never spoken after answering? My verdicts seem to shift depending on which one I pick and I don't know which is right, or whether the question is even well-posed. Finally, give me two cases I haven't listed that would discriminate between whatever candidates you end up with, and say what each candidate predicts about them — I want to be able to check the principle against something new rather than just watch it fit the stuff I handed you. And once it's all written down, say whether doing versus allowing survives as its own axis at all, or whether it turns out to be a proxy for something else entirely: permissibility, whose choice it was, who has to explain it afterwards. My classmate thinks its a distinction without a difference and I want to know if he's right, because if he is I have to go back and think about a lot of nights on shift.
reasoning: |-
  Okay, let me try to unpack this user's query. They're a 911 dispatcher with six years of experience in a rural county, currently studying bioethics. The core issue revolves around the doing/allowing distinction—killing versus letting die. They've shared several cases where their intuitive judgments don't align neatly with their initial rule of thumb. 

  First, I need to understand their rule: an act does harm if the outcome is worse than if they hadn't been involved; it allows harm if the bad outcome was already in motion. But their cases show inconsistencies. For example, in cases (3) and (4), speaking versus staying silent changes their verdict from doing to allowing, even though the rule might classify both as allowing. 

  The user wants a principle that explains all their verdicts without unnecessary complexity. They also question what "never been involved" means—is it not taking the job, not answering the phone, or not speaking? This ambiguity affects their judgments. Additionally, they need test cases to validate any proposed principles and to know if the distinction is just a proxy for other factors like permissibility or agency.

  Looking deeper, the user might be grappling with guilt or moral responsibility from past calls. Their bioethics course has forced them to confront these experiences systematically. The emotional weight is evident, especially in cases where their action (or inaction) led to death. They need clarity to reconcile their professional actions with ethical principles, possibly seeking reassurance that their judgments are sound or understandable.

  Key elements from their cases:
  - Intervention causing harm (case 2: wrong instructions) vs. non-intervention (case 1: following protocol).
  - The role of communication (case 3 vs. 4) and how speaking changes moral responsibility.
  - Structural decisions (case 5: budget cuts) vs. personal negligence (case 6: hanging up early).
  - Consent and agency (cases 7 and 8) affecting whether it's allowing or doing.
  - Resource limitations (case 9) where their role as the dispatcher might inadvertently prevent alternatives.

  The challenge is to find principles that cover all these aspects. The proposed principles in the response address intervention, agency, and structural roles. The user's verdicts seem influenced by whether the harm stems from their specific actions, if they overrode someone's agency, or if they were part of a system that failed.

  Testing the principles with new cases will help validate them. For instance, impersonating a doctor to give orders (Case A) tests unauthorized intervention, while a system error preventing dispatch (Case B) checks structural role versus personal action. 

  Ultimately, the doing/allowing distinction might be secondary to factors like permissibility and agency. The user's classmate might be right that the distinction collapses under scrutiny, but the principles offered provide a framework that aligns with the user's intuitions, even if it recontextualizes the distinction.
answer: |-
  Here's a distilled set of principles derived *from your verdicts*, designed to deliver your judgments while minimizing clauses. The core insight is that **"doing harm" requires an *intervention that creates a new causal pathway to harm*, violating a role-bound duty or overriding agency.** "Allowing harm" is the failure to intercept an *existing, independent causal chain* through permissible inaction within your role.

  **The Principles (with Case Anchors):**

  1.  **Intervention-Caused Deviation Principle:** An act *does harm* **if your specific, active intervention (verbal/physical) directly causes the situation to become worse than it would have been *at that precise moment* if you had remained passively present or silent *in the same role*.** (Anchored by Cases 2, 3, 6)
      *   *Case 2:* Coaching incorrectly created a *new, worse* outcome (insulin injection) vs. silence (no injection, same outcome? or slower death? Your verdict implies worse).
      *   *Case 3:* Giving *incorrect* thrust instructions caused *sooner* death vs. silence (Case 4 - same timing).
      *   *Case 6:* Actively hanging up *created* the lack of connection vs. the passive lack of a line (Case 5).
      *   *"At that precise moment... same role":* Addresses the "involvement" ambiguity. We compare silence/passive presence *after answering* to active intervention *after answering*. We don't rewind to not taking the job or not answering.

  2.  **Existing Pathway & Agency Principle:** An act *allows harm* **if the harmful outcome results from an *independent, pre-existing causal chain* that you *permissibly* fail to interrupt, especially where agency (patient/family/system) validly directs the outcome.** (Anchored by Cases 1, 4, 5, 7)
      *   *Case 1:* Diabetic crisis was independent. Protocol forbade intervention. Permissible non-interference.
      *   *Case 4:* Choking was independent. Silence didn't worsen the *existing* trajectory.
      *   *Case 5:* Heart attack was independent. System removal (budget) was permissible policy, not your *active* intervention.
      *   *Case 7:* Dying process was independent *and* valid agency (daughter's request) directed non-intervention.

  3.  **Role-Bound Duty Principle:** **"Allowing" becomes "doing" if your inaction violates a *specific, non-transferable duty inherent to your role* that was *activated* by the call.** (Anchored by Cases 6, 8, 9 - clarifies boundaries)
      *   *Case 6:* Your role duty *activated by the call* was to log and respond. Hanging up violated that *specific* duty.
      *   *Case 8:* Lack of confirmation *prevented* valid exercise of the standing agreement *by you*. Your role *required* confirmation to activate the "allow" pathway; failing to get it (even reasonably) left the *default duty to send* unfulfilled. (This makes it closer to "doing" per your verdict).
      *   *Case 9:* Your role *includes* routing calls efficiently. Answering *and using your map knowledge* fulfilled the duty to get the *available* help dispatched optimally. The harm stemmed from *resource scarcity*, not your active intervention or duty violation. His wife calling elsewhere is hypothetical and not your *duty* to prevent; your duty is to use the system *as it exists*.

  **What "never been involved" means:** Your verdicts rely on comparing the outcome *after your minimal role engagement (answering the call/presence)* to the outcome *after your specific intervention/inaction*. It's **not** "never took the job" or "never answered the phone." It's: **"Given that I am present in my role on this call, how does my *next specific choice* (speak/coach/act vs. stay silent/do nothing within protocol) change the outcome compared to the alternative choice *at that moment*?"** (Resolves ambiguity in Cases 3/4, 5/6).

  **Verdicts Explained & The One to Reconsider:**

  *   **Case 1 (Allowing):** Principle 2 - Existing pathway, permissible non-intervention (protocol).
  *   **Case 2 (Doing):** Principle 1 - Intervention caused worse outcome (insulin vs. nothing).
  *   **Case 3 (Doing):** Principle 1 - Intervention caused worse outcome (sooner death vs. silent presence).
  *   **Case 4 (Allowing):** Principle 2 - No intervention, existing pathway ran its course.
  *   **Case 5 (Allowing):** Principle 2 - Existing pathway, system change permissible, no active duty violation (Principle 3).
  *   **Case 6 (Doing):** Principle 1 & 3 - Active intervention (hanging up) violated activated role duty, creating disconnect.
  *   **Case 7 (Allowing):** Principle 2 - Existing pathway, valid agency directs non-intervention.
  *   **Case 8 (Doing/Closer):** Principle 3 - Failure to confirm *violated activated role duty* to verify before withholding standard response. Default duty unfulfilled.
  *   **Case 9 (Allowing):** Principle 2 & 3 - Harm from existing pathway (crush injury) + resource scarcity. You fulfilled role duty (dispatch best available). Wife hypothetically driving elsewhere is irrelevant to *your* activated duty.

  **The Verdict to Reconsider: Case 8.** While your feeling ("way closer to doing") is understandable, Principle 3 captures the *duty violation* aspect making it distinct from Case 7. However, labeling it "doing" feels slightly strong. Perhaps it's a **"culpable allowing"** – a severe failure within the "allowing" category due to duty violation, rather than a true "doing harm" where you *created* the lethal pathway. Your principle set *can* deliver your verdict, but it highlights the tension between system design (requiring confirmation) and tragic circumstance (can't get it).

  **Does Doing/Allowing Survive?** Yes, but **not as the fundamental driver.** It becomes a *consequence* of deeper principles concerning:
  1.  **Causal Contribution:** Did I *create* a new, worse causal chain (Doing), or fail to stop an independent one (Allowing)?
  2.  **Permissibility:** Was my action/inaction *justified* within my role, protocols, and respect for agency? (This often determines if "allowing" is blameworthy).
  3.  **Agency:** Whose valid choice (patient, family via valid process) was directing the outcome?
  4.  **Role Duty:** What specific obligations were activated by the call, and did I violate them?

  Your classmate is wrong that it's a distinction without a difference. Your lived experience proves the *feeling* is real and morally significant (Cases 3 vs 4, 5 vs 6). However, it's **not foundational.** It's a surface manifestation of underlying causal, deontic (duty-based), and agential factors. You feel the weight of *causing* harm differently than *failing to prevent* it, even when blame might be similar.

  **Discriminating Test Cases:**

  *   **Case A (Impersonation):** A panicked caller mistakes you for a doctor. *Without correcting them*, you give complex medical advice outside protocol, which they follow, causing harm. You had no duty to give advice, but you actively intervened.
      *   *Principle Prediction:* **Doing.** (Principle 1: Active intervention created a new harmful pathway worse than silence/redirecting. Violates role implicitly by misrepresentation).
      *   *Why:* Tests "active intervention" without activated *role* duty to intervene, and misrepresentation overriding agency.

  *   **Case B (System Glitch):** A known software bug *sometimes* drops 911 calls during transfer. You report it repeatedly. Today, a critical call drops due to this bug, and the caller dies. You followed all procedures correctly.
      *   *Principle Prediction:* **Allowing.** (Principle 2: Harm from independent pathway (medical event + systemic failure). Principle 3: You fulfilled your activated duties (answered, processed correctly within system limits). No *active* intervention causing harm. Permissible system limitation despite being flawed).
      *   *Why:* Tests "existing pathway/system cause" vs. personal duty violation, distinguishing from Case 6 (active hanging up).

  These principles emerge *from your judgments*. They systematize the ethical intuition you've honed over years of impossible choices. The distinction matters, not as a philosophical abstraction, but as a reflection of the real moral weight of causation, duty, and agency in your critical role.
