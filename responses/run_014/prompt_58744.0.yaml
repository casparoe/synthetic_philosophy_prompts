prompt: |-
  Please develop a reusable diagnostic procedure for my incident-triage team grounded in the distinction between physical, design, and intentional ways of predicting system behavior, together with the notion of a real pattern as a regularity that supports reliable prediction even when it abstracts from underlying detail.

  I am the triage lead for a logistics company operating about sixty autonomous mobile robots in two warehouses. My team of shift technicians reviews ten to twenty incident flags per day, deciding how to characterize each anomaly, what fix to attempt, and what to escalate. Stakes are moderate to high: mischaracterization causes repeated downtime, while an unsafe physical fault sent back into service could injure staff. Each triage decision must be made in about fifteen minutes by technicians with practical robotics maintenance experience but no background in philosophy. Any decision to return a robot to service after a safety-relevant flag requires sign-off from our safety officer, who is not present at triage.

  For our purposes, please take the three ways of predicting as follows: the physical way predicts from material states and laws, such as voltages, friction, and code execution; the design way predicts from functions and normal operation, such as what a lidar unit or path planner is supposed to do and how it fails; the intentional way predicts by treating the system as pursuing goals on the basis of information, such as avoiding obstacles to complete deliveries efficiently. A pattern is real for us when it lets technicians predict better than chance in a way that holds up across similar situations, even if it omits lower-level detail.

  Please provide a step-by-step procedure that such technicians can follow without appeal to theory, specifying the questions to ask in order, what counts as passing each test, when to remain with one predictive approach and when to switch to another, and where the procedure requires stopping for safety review or for explicit value judgment rather than further technical analysis. Mark clearly the points where technician judgment cannot be eliminated and the simplifications most likely to cause the procedure to misfire.

  Then demonstrate the procedure on the following three invented incidents, showing your work at each step: first, Unit 14 repeatedly halts for several seconds at the same aisle intersection whenever a human-driven forklift passes nearby, then resumes without error logs; second, Unit 07, after a routine map update, begins taking a loop that is thirty percent longer but avoids a newly marked pedestrian zone, increasing fleet congestion; third, Unit 22 intermittently pushes an empty pallet a short distance, stops, reverses, and repeats, generating motor-overheat warnings. Include at least one application where following the procedure requires a result the team will find unwelcome, such as grounding a robot for detailed physical inspection even though a simpler goal-based interpretation predicts its behavior well, or refusing to authorize a quick software rollback without further analysis.

  Conclude with an explicit statement of what the procedure cannot do.

  Please organize your response in the following sections in this order, keeping roughly to the suggested lengths: Context and Working Definitions, about 200 words, restating the three predictive approaches and the criterion for a useful pattern in technician-friendly language; The Triage Procedure, about 600 to 800 words, presented as numbered steps with pass-fail criteria and escalation points; Worked Applications, about 600 to 800 words total, applying the procedure to the three incidents above; Judgment Points and Predictable Misfires, about 250 words; Limits of the Procedure, about 150 words.
reasoning: |-
  We are developing a diagnostic procedure for triaging incidents with autonomous mobile robots (AMRs) in a logistics warehouse setting. The procedure is grounded in three predictive approaches: physical, design, and intentional, and uses the concept of a "real pattern" (a reliable regularity that supports prediction despite abstracting from details). The goal is to help technicians with practical maintenance experience but no philosophy background to make safe and effective triage decisions in about 15 minutes per incident.

  **Context and Working Definitions (approx. 200 words):**

  We predict robot behavior in three ways:

  1. **Physical Prediction:** We look at the robot's material components and physical laws. Examples: checking battery voltage, motor temperatures, sensor readings, or code execution steps. It's about the "nuts and bolts" – what the parts are doing right now.

  2. **Design Prediction:** We think about what each part is designed to do and how it normally works or fails. Examples: knowing that a lidar sensor should detect obstacles within 2 meters, or that a navigation algorithm should recalculate a path when blocked. It's about the intended function of the system and common failure modes.

  3. **Intentional Prediction:** We treat the robot as if it has goals and makes decisions based on information. Examples: predicting that the robot will avoid a newly marked pedestrian zone to be safe, or that it will try to complete deliveries efficiently. It's about understanding the robot's "purpose" and how it might behave to achieve its goals.

  A **real pattern** is a consistent behavior we observe that helps us predict what the robot will do next, even if we don't know every detail. For example, if a robot always stops for 5 seconds when near a forklift, that's a pattern we can use to predict future stops. We trust a pattern if it has been reliable in the past and works in similar situations.

  **The Triage Procedure (approx. 600-800 words):**

  This procedure is a step-by-step guide for technicians. It starts with the intentional approach (as it's often the quickest and most intuitive) and then moves to design and physical as needed. Safety-critical steps are marked. At any step, if a safety risk is identified (e.g., potential for harm to people or property), the robot must be grounded (taken out of service) and the safety officer must be notified.

  **Step 1: Intentional Check - Does the robot's behavior make sense as goal-directed action?**
     - **Question:** "Given the robot's task (e.g., deliver goods from A to B) and its environment, is the observed behavior a reasonable way to achieve its goals or avoid problems? Does the robot seem to be acting on understandable information?"
     - **Pass:** The behavior is predictable and explainable by the robot's goals and environment. Example: taking a longer route to avoid a pedestrian zone.
     - **Fail:** The behavior doesn't make sense for the robot's goals (e.g., stopping for no clear reason, moving erratically when no obstacles are present) or appears to ignore critical information (e.g., not stopping for a person).
     - **Action on Pass:** Proceed to Step 2 to check for unintended consequences or design flaws.
     - **Action on Fail:** Proceed to Step 3 (Design Check) to look for functional issues.
     - **Safety Note:** If the robot shows any unsafe intentional behavior (e.g., ignoring obstacles, moving toward people aggressively), immediately ground the robot and escalate to the safety officer. Do not proceed to next steps until safety officer reviews.

  **Step 2: Design Check - Is the behavior within normal functional parameters or a known failure mode?**
     - **Question:** "Is this behavior a normal function of the system, a known error (e.g., from past bugs), or a failure of a specific component? Does it match how the system is designed to work or fail?"
     - **Pass:** The behavior is either by design (e.g., a safety feature) or matches a documented failure mode (e.g., a sensor dropout pattern). Example: a known issue where path planning avoids pedestrian zones even if it causes congestion.
     - **Fail:** The behavior is not documented, or it's an unknown/unexpected failure. Example: an undocumented pattern of stopping near forklifts.
     - **Action on Pass:** If the behavior is safe and expected, you may clear the incident (with notes). If it's a known failure, apply the standard fix (e.g., reset, patch) and monitor. If there are safety concerns (even if by design), proceed to Step 4 (Safety Review).
     - **Action on Fail:** Proceed to Step 3 (Physical Check) to look for underlying hardware or low-level software issues.

  **Step 3: Physical Check - Is there an underlying physical cause?**
     - **Question:** "Could the behavior be caused by a hardware fault, environmental interference, or low-level software error? Look for abnormal physical states (e.g., overheating, sensor noise, voltage drops)."
     - **Pass:** You find a physical cause that explains the behavior (e.g., a dirty sensor, a loose wire, a motor drawing too much current). Example: motor-overheat warnings due to a stuck wheel.
     - **Fail:** No clear physical cause is found within the triage time limit, or the physical data is normal.
     - **Action on Pass:** Attempt a physical fix (e.g., clean sensor, replace part) if safe and within scope. If the fix is complex or safety-critical, ground the robot and escalate to maintenance. If the fix resolves the issue, clear the incident. If not, go back to Step 1.
     - **Action on Fail:** The issue is not resolved. Proceed to Step 4 (Safety Review) and consider grounding the robot for deeper analysis.

  **Step 4: Safety Review and Escalation**
     - **Trigger:** 
       - Any step identifies a potential safety risk (e.g., robot might harm a person, damage property, or the cause is unknown and could be unsafe).
       - The procedure has not resolved the issue and the robot is behaving unpredictably.
     - **Actions:** 
       - Ground the robot immediately (remove from service).
       - Notify the safety officer for sign-off before returning to service.
       - Document all findings and decisions.
       - Escalate to engineering for root cause analysis if needed.

  **Pattern Use Throughout:**
     - Look for real patterns: If you see a regularity (e.g., "every time X happens, the robot does Y"), use it to predict and diagnose. If the pattern is reliable, it can guide you even without knowing why. But if the pattern breaks (e.g., the robot does Y in a new situation where it shouldn't), go back to the predictive steps.

  **Switching Between Approaches:**
     - Start with intentional (Step 1) because it's fast and often sufficient for operational issues.
     - If intentional fails (behavior doesn't make sense), go to design (Step 2) to check for functional issues.
     - If design fails (not a known issue), go to physical (Step 3) to look for hardware or low-level causes.
     - If any step passes but there are safety concerns, go to Safety Review (Step 4).
     - If a step is inconclusive, move to the next. Do not loop without progress for more than 15 minutes.

  **Worked Applications (approx. 600-800 words total):**

  **Incident 1: Unit 14 repeatedly halts for several seconds at the same aisle intersection whenever a human-driven forklift passes nearby, then resumes without error logs.**

  - **Step 1 (Intentional Check):** Does the behavior make sense? Yes. The robot might be yielding to the forklift as an obstacle. This is a reasonable goal-directed action (safety and efficiency). **Pass.** Proceed to Step 2.
  - **Step 2 (Design Check):** Is this by design or a known failure? We check documentation: 
    - If the system is designed to stop for moving obstacles (like forklifts) and then resume, this is by design. **Pass.**
    - However, we note that there are no error logs, which might be expected for a normal stop. Also, the stop is prolonged and only at one location. This might indicate an undocumented issue (e.g., a sensor blind spot at that intersection). **Fail** (if not documented as expected). 
    - Since it's not a clear pass (due to lack of logs and location-specific behavior), we proceed to Step 3.
  - **Step 3 (Physical Check):** Look for physical causes. Check sensor data (lidar, cameras) at that intersection: 
    - If we find that the forklift's shape or movement causes temporary sensor interference (e.g., reflection from a metal rack), that's a physical cause. **Pass.**
    - Alternatively, if the physical data is clean and the stop is purely algorithmic (e.g., the path planner is overly cautious at that junction), we might not find a physical fault. **Fail.**
    - **Result (assuming we find no physical fault):** We have an intentional pass (it makes sense) but design and physical fail. Since the behavior is predictable (real pattern: stops when forklift passes) and safe (it stops and resumes), we might clear it as a "design quirk" and log it for engineering review. However, because it's location-specific and could cause congestion or be a symptom of a sensor issue, we might ground the robot for a sensor inspection (if safety officer requires). 
    - **Safety Note:** The robot stops and resumes without logs, which is safe in this instance. But if the stop pattern is abnormal (e.g., too long, or in an unsafe location), we might escalate to safety officer. In this case, we note the pattern and monitor, but do not ground immediately. We document and escalate for design review.

  **Incident 2: Unit 07, after a routine map update, begins taking a loop that is thirty percent longer but avoids a newly marked pedestrian zone, increasing fleet congestion.**

  - **Step 1 (Intentional Check):** Does the behavior make sense? Yes. The robot is avoiding a pedestrian zone to comply with safety rules. It's goal-directed: efficiency is reduced for safety. **Pass.** Proceed to Step 2.
  - **Step 2 (Design Check):** Is this by design? Yes. The map update included a new pedestrian zone, and the path planner is designed to avoid it. **Pass.** 
    - However, the consequence (increased congestion) is an operational issue. We must check if this is a known trade-off or if the design allows for optimization (e.g., could the robot take a slightly different route that is safer and less congested?).
    - **Action:** Since it's by design and safe, we do not ground the robot. But we escalate to operations/engineering for a design review (e.g., adjust path planning parameters to minimize congestion while maintaining safety). This is not a triage fix, so we clear the incident with a note.

  **Incident 3: Unit 22 intermittently pushes an empty pallet a short distance, stops, reverses, and repeats, generating motor-overheat warnings.**

  - **Step 1 (Intentional Check):** Does the behavior make sense? No. Pushing an empty pallet, stopping, and reversing is not a normal goal-directed action for a delivery robot. It's wasteful and causes overheating. **Fail.** Proceed to Step 2.
  - **Step 2 (Design Check):** Is this a known failure mode? Check logs and past incidents: 
    - If we have a known issue where pallet detection fails (e.g., the robot thinks the pallet is loaded when it's empty), then it might be trying to adjust the pallet position. **Pass** (if documented).
    - If not, **Fail.** Proceed to Step 3.
    - **Assume it's not documented:** We go to Step 3.
  - **Step 3 (Physical Check):** Look for physical causes: 
    - Check the pallet sensor: if dirty or faulty, it might misread the pallet as loaded. 
    - Check the motor currents: if high during pushing, it might indicate mechanical resistance (e.g., a stuck wheel or pallet caught on something).
    - **Pass if:** We find a dirty sensor or a mechanical issue. Fix: clean sensor or clear obstruction.
    - **Fail if:** No physical cause found. 
    - **Result (assume we find the pallet sensor is faulty):** We replace the sensor and test. If resolved, clear. If not, we ground the robot for deeper inspection.
    - **Safety Note:** The motor-overheat warnings indicate a risk of fire or damage. Even if we find a physical cause, we must ensure the fix is safe. We also note that the behavior could cause the robot to push objects unpredictably, posing a trip hazard. Therefore, we ground the robot until fixed and tested. Safety officer sign-off may be required if the fix is temporary.

  **Unwelcome Result Example (from Incident 3):** 
  - Suppose during Step 1 (Intentional) we note that the robot might be trying to adjust the pallet (so it almost passes intentional). But the repeated pushing and overheating is abnormal. We move to Step 2 and find no known issue. In Step 3, we cannot find a physical cause in 15 minutes. The procedure requires grounding the robot for detailed inspection (Step 4) even though the intentional interpretation (adjusting the pallet) is plausible. This is unwelcome because it takes the robot out of service, but necessary because the overheating is a safety risk and the cause is unknown.

  **Judgment Points and Predictable Misfires (approx. 250 words):**

  **Judgment Points:**
  - **Step 1 (Intentional):** Technicians must judge if behavior is "reasonable" for the robot's goals. This relies on their operational experience. There is no strict rule; two technicians might disagree.
  - **Step 2 (Design):** Knowing what is "by design" or a "known failure" requires familiarity with system documentation and past incidents. If documentation is poor, this step may fail incorrectly.
  - **Step 3 (Physical):** Deciding what physical data is abnormal (e.g., "is this voltage drop significant?") requires technical skill. Some issues (e.g., intermittent faults) may be missed in 15 minutes.
  - **Safety Calls:** Any decision about potential harm is subjective. Technicians must err on the side of caution.

  **Predictable Misfires:**
  - **Over-reliance on Patterns:** If a pattern is real but temporary (e.g., a sensor fault that only occurs in cold temperatures), it might be missed or overgeneralized.
  - **Intentional Misinterpretation:** Treating a physical fault as goal-directed (e.g., a robot circling due to a stuck wheel might be misinterpreted as "searching").
  - **Design Blind Spots:** If a failure mode is not documented, the design check might pass incorrectly (e.g., a new software bug).
  - **Time Pressure:** Physical checks might be superficial, missing subtle issues (e.g., a frayed wire not visible without disassembly).
  - **Unwelcome Grounding:** The procedure may ground robots for safety when the issue is minor, causing unnecessary downtime.

  **Limits of the Procedure (approx. 150 words):**

  This procedure cannot:
  1. **Replace Deep Analysis:** It is for triage, not root cause. Complex issues require engineering investigation.
  2. **Handle Novel Situations:** It relies on known patterns and documentation. Unprecedented failures may be misdiagnosed.
  3. **Eliminate Judgment:** Technicians must make calls on safety, reasonableness, and abnormality.
  4. **Guarantee Safety:** It reduces risk but cannot foresee all hazards (e.g., a rare physical fault that only manifests under untested conditions).
  5. **Solve Systemic Problems:** Issues like fleet congestion due to design choices require higher-level optimization, not triage.
  6. **Work Without Data:** It assumes access to logs, sensor data, and documentation. If these are missing, the procedure may fail.

  The procedure is a tool to structure triage, but it is only as good as the technician's skill, the available information, and the organization's support for safety and documentation.
answer: |-
  ### Context and Working Definitions (approx. 200 words)  
  **Three Ways to Predict Robot Behavior:**  
  1. **Physical Prediction:** Focus on the robot’s hardware, software code, and physical laws (e.g., battery voltage, motor heat, sensor readings, or code execution). Ask: *"What raw data or components are acting up?"*  
  2. **Design Prediction:** Focus on what the robot’s parts are *meant* to do and how they typically fail (e.g., a lidar sensor should detect obstacles within 2 meters; if it doesn’t, it’s a sensor failure). Ask: *"Is this a normal function or a known glitch?"*  
  3. **Intentional Prediction:** Treat the robot like it has goals (e.g., "deliver goods quickly and safely"). Predict based on what it "should" do to achieve those goals (e.g., rerouting to avoid a crowded area). Ask: *"Does this behavior make sense for the robot’s job?"*  

  **Real Pattern:** A consistent, repeatable behavior that helps you predict outcomes *reliably* (e.g., "Robot stops near forklifts every time"), even if you don’t know the exact cause. Trust it only if it holds across similar incidents.  

  **Safety Rule:** If a fault *could* hurt someone (e.g., unexpected movement, overheating), ground the robot and call the safety officer—no exceptions.  

  ---  

  ### The Triage Procedure (approx. 750 words)  
  **Goal:** Diagnose in ≤15 min using three prediction approaches. Start simple (intentional), escalate complexity only if needed. Safety checks override all steps.  

  #### Step 1: Intentional Check (Goal-Based Prediction)  
  - **Question:** "Does this behavior make sense for the robot’s task? Could it be trying to achieve a goal (e.g., safety, efficiency) or reacting to new information?"  
  - **Pass Criteria:** Behavior aligns with a clear goal (e.g., avoiding obstacles, saving battery).  
  - **Fail Criteria:** Behavior seems pointless, irrational, or misaligned with goals (e.g., stopping for no reason).  
  - **Actions:**  
    - **Pass:** Proceed to Step 2.  
    - **Fail:** Skip to Step 3 (Design Check).  
    - **Safety Escalation:** If behavior is unsafe (e.g., ignoring people, erratic moves), **ground robot immediately** and notify safety officer. Do not proceed.  

  #### Step 2: Design Check (Function-Based Prediction)  
  - **Question:** "Is this behavior part of normal operation, a known bug, or a component failure? Check logs/docs for similar past issues."  
  - **Pass Criteria:** Matches a documented function (e.g., "software update changed routing rules") or known failure (e.g., "motor overload error code X means bearing wear").  
  - **Fail Criteria:** No matches in logs/docs; behavior is new or undocumented.  
  - **Actions:**  
    - **Pass:** If safe and expected, apply standard fix (e.g., reset, patch). If safe but undesirable (e.g., congestion), log for engineering review.  
    - **Fail:** Proceed to Step 3 (Physical Check).  
    - **Safety Escalation:** If design pass reveals *new* risks (e.g., "bypassing safety zones"), **ground robot** and escalate.  

  #### Step 3: Physical Check (Hardware/Code-Based Prediction)  
  - **Question:** "Could a physical flaw cause this? Check sensor data, voltages, temps, or code snippets for abnormalities."  
  - **Pass Criteria:** Physical evidence explains behavior (e.g., lidar glitch when voltage drops below 11V).  
  - **Fail Criteria:** No clear physical cause found in 5 min of checks.  
  - **Actions:**  
    - **Pass:** If fix is quick/safe (e.g., clean sensor), do it and retest. If complex (e.g., motor replacement), ground robot and escalate to maintenance.  
    - **Fail:** Proceed to Step 4 (Safety Hold).  
    - **Safety Escalation:** If physical issue *could* cause harm (e.g., overheating), **ground robot** immediately.  

  #### Step 4: Safety Hold & Escalation  
  - **Trigger:**  
    - Unresolved after Step 3.  
    - Any step flagged a safety risk.  
    - Technician judgment calls for caution.  
  - **Actions:**  
    - **Ground robot** and tag for inspection.  
    - Notify safety officer for mandatory sign-off before return.  
    - Escalate to engineers for deep dive.  

  #### Key Rules  
  - **Pattern Use:** If you spot a real pattern (e.g., "fault occurs only near metal shelves"), use it to skip steps—but verify it’s reliable (holds 3+ times).  
  - **Switching Approaches:**  
    - Start at Step 1 (intentional) for speed.  
    - Switch to design (Step 2) if behavior seems illogical.  
    - Switch to physical (Step 3) if design docs lack answers.  
    - Never loop back—escalate to Step 4 if stuck.  
  - **Time Saver:** If a step passes but reveals a *new* problem (e.g., intentional pass but safety risk), jump to Safety Hold.  

  ---  

  ### Worked Applications (approx. 700 words)  

  #### Incident 1: Unit 14 halts at aisle intersection when forklifts pass, then resumes.  
  - **Step 1 (Intentional):** *Does this make sense?* Yes—robot may be yielding for safety. **Pass.** Proceed.  
  - **Step 2 (Design):** *Is this normal or documented?* Check logs: No errors logged. Not a known issue. **Fail.** Proceed.  
  - **Step 3 (Physical):** *Physical cause?* Check sensor data: Lidar shows brief interference when forklift passes (metal causes false obstacle?). Voltage/temps normal. **Pass** (pattern: sensor interference).  
  - **Action:** Real pattern ("stops near forklifts") predicts safely. Fix: Shield lidar or adjust sensitivity. *No safety hold* (resumes without errors).  
  - **Why unwelcome?** Technicians might skip Step 3 since intentional/design seem fine—but physical check caught sensor flaw that could worsen.  

  #### Incident 2: Unit 07 takes 30% longer route after map update, avoiding pedestrian zone.  
  - **Step 1 (Intentional):** *Does this make sense?* Yes—robot prioritizes safety over speed. **Pass.** Proceed.  
  - **Step 2 (Design):** *Is this normal?* Check update notes: Map flags pedestrian zones as no-go. **Pass** (by design).  
  - **Action:** Expected behavior. No fix needed. Log congestion issue for software team. *Do not ground.*  
  - **Why unwelcome?** Team may want a quick software rollback to reduce congestion, but procedure blocks it—design pass confirms it’s intentional and safe.  

  #### Incident 3: Unit 22 pushes empty pallet, stops, reverses, repeats; motor overheats.  
  - **Step 1 (Intentional):** *Does this make sense?* No—no goal served by pushing/stopping. Overheating is irrational. **Fail.** Skip to Step 3 (physical first—overheating is urgent).  
  - **Step 3 (Physical):** *Physical cause?* Check motor current: Spikes during pushes. Pallet sensor misreads load (dirt? fault?). Code shows no errors. **Pass** (sensor/motor issue).  
  - **Safety Escalation:** Overheating could cause fire; pallet-pushing risks collisions. **Ground robot immediately** per Step 4.  
  - **Action:** Technicians clean sensor—but procedure *still requires safety officer sign-off* due to risk.  
  - **Why unwelcome?** Physical fix seems easy, but procedure demands safety review—delays return but prevents liability if fault recurs.  

  ---  

  ### Judgment Points and Predictable Misfires (approx. 250 words)  
  **Where Judgment is Unavoidable:**  
  1. **Intentional "Reasonableness":** Deciding if behavior "makes sense" (e.g., Is halting near forklifts *too* cautious? Depends on warehouse context).  
  2. **Pattern Reliability:** Judging if a pattern is "real" (e.g., "Forklift halts occur 90% of the time" vs. "once"). Requires experience.  
  3. **Safety Margins:** Is overheating "moderate" or "critical"? Technicians must err toward caution.  
  4. **Documentation Gaps:** If design docs are outdated, Step 2 may pass/fail incorrectly.  

  **Predictable Misfires:**  
  - **Over-Reliance on Intentional:** A logical-seeming behavior (e.g., robot taking a long route) might hide a physical flaw (e.g., GPS drift). Skipping physical checks risks missed faults.  
  - **Pattern Overextension:** Assuming a pattern (e.g., "sensor glitch near metal") applies universally, but it fails in new areas (e.g., near wet floors).  
  - **Time Pressure:** In Step 3, superficial checks (e.g., skipping voltage tests) might miss intermittent issues.  
  - **False Economy:** Technicians may resist grounding robots (Incident 3) for "minor" issues, but procedure enforces it—causing short-term downtime but preventing crises.  

  ---  

  ### Limits of the Procedure (approx. 150 words)  
  This procedure **cannot**:  
  1. **Replace Expert Analysis:** Deep root causes (e.g., software bugs) require engineers, not 15-minute triage.  
  2. **Handle Novel Failures:** If a flaw has no pattern and defies all three approaches (e.g., quantum interference), escalation is mandatory.  
  3. **Override Human Values:** Trade-offs (e.g., "safety vs. delivery speed") need manager/safety officer input; the procedure flags these but doesn’t resolve them.  
  4. **Compensate for Bad Data:** With incomplete logs or sensor gaps, predictions fail.  
  5. **Predict Rare Events:** "Real patterns" require repetition; one-off anomalies may be misjudged.  
  6. **Ensure Perfection:** It reduces—not eliminates—risk. Human judgment remains the weakest link.  

  **Final Note:** This procedure optimizes for safety and speed but is a starting point—not a substitute for thorough investigations or system improvements.
