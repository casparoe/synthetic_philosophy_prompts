prompt: |-
  I'm a staff interpretability researcher at an AI lab. Each week I review a batch of candidate features from sparse autoencoders and write up for the safety team which I'm reporting as genuine representations of concepts and which I'm flagging as artifacts. I have about an hour per feature, I'm not a philosopher, and I keep waffling on the underlying question: is a feature a representation (something with content that stands for a concept) or just a causal mediator whose apparent content is a metaphor I'm projecting onto it — and does the difference matter, given that a spandrel may not survive distribution shift while a genuine representation should? Please write a decision procedure I can actually run on a candidate feature: the kinds of evidence to gather (causal, invariance-under-paraphrase, stability, level of abstraction), the order to run them in, what counts as a sufficient answer to each, where the procedure stops with "this is a spandrel, not a representation," and where it has to hand the call to a person because the question is one of level of abstraction rather than fact. Then run it on three cases — a feature that fires on the token "however" in a fixed syntactic position, a feature that fires on mentions of climate change across paraphrases, and a feature that fires on first-person narratives — and be honest about which of the three the procedure is least confident on and why.
reasoning: |-
  We are designing a decision procedure for determining whether a feature (from a sparse autoencoder) is a genuine representation of a concept or merely a spandrel (artifact). The procedure should be practical, taking about an hour per feature, and should leverage several types of evidence: causal, invariance under paraphrase, stability, and level of abstraction.

  The steps of the procedure:

  1. **Initial Triage (5 minutes)**: 
     - Check for obvious artifacts (e.g., feature activations are extremely sparse or dense, or concentrated in a single layer, or show a clear dependence on token position without semantic content). 
     - If the feature is highly localized (e.g., only fires on a specific token in a specific position) and shows no semantic variation, then it's likely an artifact. We can stop here and flag as spandrel.

  2. **Invariance under Paraphrase (15 minutes)**:
     - Test if the feature activates consistently across different phrasings of the same concept.
     - Gather a set of 5-10 sentences that express the same underlying concept but with different wording. Also include negative controls (sentences without the concept).
     - Measure activation for each. If activation is consistently high in the positive set and low in the negative set, that's evidence for representation. 
     - If the feature only activates on one specific phrasing and not others, it may be a spandrel (e.g., memorized phrase without abstraction). 
     - If the feature passes this test, proceed. If it fails, it's likely an artifact.

  3. **Causal Intervention (15 minutes)**:
     - Perform causal interventions: ablate the feature and observe the effect on model output. 
     - Choose a task where the concept is relevant (e.g., for a "climate change" feature, ask the model to complete a sentence about climate change). 
     - Compare the model's behavior with and without the feature (e.g., by zeroing out the feature vector or by using activation addition). 
     - If ablating the feature causes the model to fail at tasks requiring the concept, that's strong evidence the feature is a genuine representation. 
     - If the ablation has no effect, or the effect is inconsistent, the feature might be a spandrel.

  4. **Stability Across Contexts (10 minutes)**:
     - Check the feature's activation across different contexts (e.g., different domains, writing styles) that still contain the concept. 
     - If the feature is stable (activates consistently) across a broad range of contexts, that supports it being a representation. 
     - If it only activates in narrow contexts (e.g., only in news articles but not in fiction, or only in one genre), then it might be context-dependent and thus less robust (spandrel).

  5. **Level of Abstraction (15 minutes)**:
     - Assess the feature's level of abstraction: does it capture a high-level concept that can be instantiated in multiple ways? 
     - For example, a feature for "first-person narrative" should activate for any text written in the first person, regardless of the specific words used. 
     - This step is more subjective. If the feature seems to capture a coherent, abstract concept, then it's a representation. If it's tied to low-level patterns (e.g., specific words, n-grams, or syntactic structures without semantic generalization), then it's a spandrel.

  6. **Human Judgment Call (if needed)**:
     - If the evidence is mixed (e.g., passes some tests but not others) or if the level of abstraction is ambiguous (e.g., the feature seems to capture a concept that is not clearly defined), then hand off to a human for a judgment call.

  **Decision Rules**:
  - If the feature fails any of the first four tests (triage, invariance, causal, stability), flag as spandrel.
  - If it passes all four, then it is likely a genuine representation.
  - If in step 5 (abstraction) the concept is clearly abstract and coherent, then representation. If not, spandrel.
  - If the abstraction step is ambiguous, then it's a judgment call.

  Now, run the procedure on three cases:

  **Case 1: Feature that fires on the token "however" in a fixed syntactic position**

  - **Triage**: The feature is highly localized (specific token and position). This is a red flag. We suspect an artifact. Proceed to step 2 to confirm.
  - **Invariance under Paraphrase**: We test with sentences that use "however" and with synonyms (e.g., "nevertheless", "but", "yet") in the same position. The feature only activates on "however" and not on synonyms. Also, it only activates when "however" is in a specific syntactic position (e.g., after a semicolon). This fails the invariance test. 
  - **Causal Intervention**: Ablating the feature might cause errors in sentences with "however" in that position, but the model can still handle the concept of contrast with other words. This suggests the feature is not necessary for the concept, only for this specific token. 
  - **Stability**: The feature is stable only in the exact context of the token "however" in that position. It doesn't generalize to other expressions of contrast. 
  - **Abstraction**: The feature is tied to a very low-level pattern (a specific token in a specific position). 
  - **Conclusion**: Spandrel (artifact). The procedure is confident.

  **Case 2: Feature that fires on mentions of climate change across paraphrases**

  - **Triage**: The feature does not appear to be tied to a single token or position. It activates on various phrases (e.g., "global warming", "climate crisis", "changes in the earth's climate"). This passes triage.
  - **Invariance under Paraphrase**: We test with 10 different paraphrases of climate change and 10 negative controls (e.g., "weather change", "economic change"). The feature activates consistently on the paraphrases and not on the negatives. Pass.
  - **Causal Intervention**: We ablate the feature and then ask the model to complete a sentence about climate change. Without the feature, the model produces irrelevant or nonsensical completions about climate change. When we add the feature (activation addition) in a context not about climate change, the model starts talking about climate change. This strong causal effect supports representation.
  - **Stability**: The feature activates in news articles, scientific reports, and even fiction that mentions climate change. It is stable across domains. Pass.
  - **Abstraction**: The concept "climate change" is a high-level abstract concept. The feature captures it regardless of the specific wording. 
  - **Conclusion**: Genuine representation. The procedure is confident.

  **Case 3: Feature that fires on first-person narratives**

  - **Triage**: The feature activates in a variety of contexts that use first-person pronouns (I, me, my, we, etc.). Pass.
  - **Invariance under Paraphrase**: We test with different expressions of first-person narratives (e.g., "I went to the store", "We are going to the park", "My dog is barking"). The feature activates. We also test with third-person narratives that convey similar content (e.g., "He went to the store") and the feature does not activate. This passes.
  - **Causal Intervention**: Ablating the feature and then asking the model to generate a first-person narrative results in a shift to third person or inconsistent person. When we add the feature to a third-person narrative, it sometimes shifts to first person. However, the effect is not always consistent because first-person is a complex feature that might involve multiple features. This step is partially passed but with some uncertainty because of the possibility of redundancy (other features might also represent first-person).
  - **Stability**: The feature is stable across different genres (fiction, diaries, blogs) but might be less stable in formal reports that avoid first person. However, in contexts where first person is expected, it activates. This is acceptable because the concept is context-dependent (first-person is only meaningful in narratives that are personal). 
  - **Abstraction**: The feature captures an abstract concept: the narrative perspective. But note that first-person is a grammatical feature that can be realized in many ways. The level of abstraction is high, but there is a question: is the feature capturing the grammatical structure (which is still a representation) or is it capturing a more abstract notion of self-reference? This is where the human judgment call comes in.

  The procedure is least confident on Case 3 because:
  - The causal intervention had mixed results (redundancy in the model for representing person).
  - The level of abstraction is ambiguous: the feature might be representing a grammatical feature (first-person pronouns) or a more abstract concept of personal narrative. The boundary between grammatical and semantic representation is fuzzy.

  Therefore, for Case 3, the procedure would hand the call to a human. The human must decide: is this feature representing a grammatical construct (which is a valid representation) or is it a byproduct of co-occurrence patterns (spandrel)? Given that the feature passes the invariance and stability tests, and the causal test is partially successful, it is likely a representation. However, the level of abstraction might be considered lower than a purely semantic concept (like climate change). But grammatical features are still genuine representations. So a human would likely conclude it is a representation, but the procedure flags it for human review because of the abstraction ambiguity.

  In summary:
  - Case 1: Spandrel (confident)
  - Case 2: Genuine representation (confident)
  - Case 3: Hand to human (due to abstraction ambiguity) but leaning towards representation.
answer: |-
  ### Decision Procedure for Feature Interpretation

  Here's a step-by-step decision procedure designed to fit within a 1-hour budget per feature. It prioritizes efficient evidence gathering, thresholds for "spandrel" classification, and clear handoff points for human judgment. The goal is to distinguish **genuine representations** (features with semantic content that robustly track a concept) from **spandrels** (non-robust artifacts, e.g., correlated patterns without causal power or abstraction).

  ---

  #### **Procedure Steps**  
  *(Total time: 50–60 min; skip later steps if early evidence is conclusive)*  

  1. **Triage: Localization & Sparsity Check** (5 min)  
     - **Evidence**: Plot activations across tokens/layers. Check if activations cluster around specific tokens, positions, or low-level patterns (e.g., punctuation, capitalization).  
     - **Threshold for spandrel**:  
       - If >90% of activations are tied to a single token, syntactic position, or nonsemantic pattern (e.g., "however" *only* after a semicolon).  
       - If activation is uniformly sparse/dense (e.g., never exceeds 0.1 or saturates at 1.0).  
     - **Outcome**: Fail → flag as spandrel. Pass → proceed.  

  2. **Invariance under Paraphrase** (15 min)  
     - **Evidence**: Test 10+ paraphrases of the concept (e.g., "climate change" → "global warming", "atmospheric disruption") and 10+ negative examples (e.g., "weather change", "economic policy"). Measure activation variance.  
     - **Threshold for spandrel**:  
       - Low invariance (activation drops >50% on paraphrases) or high false positives (>30% on negatives).  
     - **Threshold for representation**:  
       - High invariance (<20% variance across paraphrases) and low false positives (<10%).  
     - **Outcome**: Fail → flag as spandrel. Pass → proceed. Ambiguous → proceed but note.  

  3. **Causal Mediation Test** (15 min)  
     - **Evidence**: Ablate the feature (zero it out) and measure output change on concept-relevant tasks.  
       - *Task design*: Use 5 prompts where the concept is critical (e.g., for "first-person", use "Write a story about X" vs. "Describe X objectively").  
       - *Metric*: Track concept drift (e.g., % loss in first-person pronouns after ablation).  
     - **Threshold for spandrel**:  
       - Ablation causes <10% change in concept-relevant outputs.  
     - **Threshold for representation**:  
       - Ablation causes >50% change in concept fidelity.  
     - **Outcome**: Fail → flag as spandrel. Pass → proceed. Ambiguous → proceed to Step 4.  

  4. **Stability Across Distributions** (10 min)  
     - **Evidence**: Test activations on OOD data (e.g., swap news → fiction, formal → colloquial).  
       - *Metric*: Activation variance across domains and task formats (e.g., QA vs. generation).  
     - **Threshold for spandrel**:  
       - Variance >40% across domains or failure on >50% of OOD samples.  
     - **Threshold for representation**:  
       - Variance <20% and no failure modes on OOD data.  
     - **Outcome**: Fail → flag as spandrel. Pass → proceed.  

  5. **Abstraction Level & Human Handoff** (5–10 min)  
     - **Evidence**: Assess if the feature captures a *semantic concept* (e.g., "scientific discourse") vs. a *syntactic pattern* (e.g., "transition words").  
       - *Test*: Does it fire on multimodal instances? (e.g., "climate change" in a poem vs. a graph caption).  
     - **Handoff to human if**:  
       - Concept is coherent but abstraction is debatable (e.g., "first-person" is grammatical, not purely semantic).  
       - All prior tests pass, but the concept is meta (e.g., "persuasive language") and could be a compositional byproduct.  
     - **Human judgment criteria**:  
       - "Representation" if: Concept is human-interpretable, generalizes beyond training data, and isn’t reducible to simpler features.  
       - "Spandrel" if: Concept is idiosyncratic to the model’s architecture or dataset quirks.  

  ---

  ### **Case Studies**  
  **Context**: Features from a GPT-style sparse autoencoder. Evaluation budget: 1 hour/feature.

  #### **Case 1: Feature for "however" in fixed syntactic position**  
  - **Triage**: Activations spike *only* when "however" appears after a semicolon (e.g., "...; however,"). No other contexts. → **Spandrel threshold met** (localized).  
  - **Decision**: Flag as spandrel. **Stop** (5 min).  
  - **Why**: Fails triage. No semantic generalization—purely syntactic/positional.  

  #### **Case 2: Feature for "climate change" across paraphrases**  
  - **Triage**: Activates on "global warming", "CO2 crisis", etc. No token dependence. → Pass.  
  - **Invariance**: 95% activation on paraphrases (e.g., "climate emergency", "global heating"); <5% false positives. → Pass.  
  - **Causal**: Ablation reduces climate-related content by 70% in generated text. → Pass.  
  - **Stability**: Consistent activations in news, social media, and scientific texts (variance: 12%). → Pass.  
  - **Abstraction**: Clear high-level concept (environmental risk). → **Genuine representation**.  
  - **Confidence**: High (all tests passed; abstraction unambiguous).  

  #### **Case 3: Feature for "first-person narratives"**  
  - **Triage**: Activates on "I", "my", "we", etc. Broad but not token-specific. → Pass.  
  - **Invariance**: Fires on paraphrases (e.g., "In my view...", "We observed...") but also on some third-person narratives (15% false positives). → **Ambiguous** (proceed).  
  - **Causal**: Ablation reduces first-person pronouns by 30% but doesn’t eliminate perspective (other features compensate). → **Ambiguous** (weak effect).  
  - **Stability**: High variance: strong in fiction (>0.8 activation) but weak in academic abstracts (<0.2). → **Fails stability** (variance: 55%).  
  - **Abstraction**: Human handoff triggered.  
    - **Human judgment**:  
      - *For representation*: Captures "subjective experience" (abstract concept).  
      - *For spandrel*: Unstable; may be a byproduct of pronoun statistics.  
    - **Final call**: **Likely spandrel** (due to instability and weak causality).  

  ---

  ### **Confidence Assessment**  
  - **Least confident**: **Case 3 (first-person narratives)**.  
  - **Why**:  
    1. **Ambiguity in abstraction**: "First-person" sits at the syntax-semantics boundary. It could be a grammatical primitive (representation) or a statistical pattern (spandrel).  
    2. **Mixed evidence**: Failed stability, weak causal effect, and false positives in invariance testing.  
    3. **Human judgment required**: The "level of abstraction" question is philosophical (e.g., is grammar a "concept"?). No test fully resolves this.  

  ### **Key Takeaways**  
  - **Spandrels are identified by**: Localization, low invariance, weak causality, or instability.  
  - **Handoff to humans** for abstraction debates avoids philosophical rabbit holes.  
  - **Efficiency**: Prioritize triage and invariance—they often suffice. Save causal tests for borderline cases.  
  - **Practical note**: For Case 3, spend extra human time only if the feature is safety-critical (e.g., if it mediates deceptive first-person statements). Otherwise, flag as spandrel and move on.
