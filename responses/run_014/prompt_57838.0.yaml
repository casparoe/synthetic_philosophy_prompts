answer: |-
  Here’s a 6-question quiz designed to reveal students’ underlying views on the species problem using real-world cases. Each question presents a scenario with four options (A–D) aligned with major species concepts. The **scoring key** maps responses to concepts and notes ambiguities.

  ---

  ### **Species Concept Sorting Quiz**
  **Instructions:** For each scenario, pick the statement that *best* reflects your view. Be honest—there are no right or wrong answers!

  1. **Ring Species (e.g., Ensatina salamanders):**  
     Adjacent populations interbreed, but populations at opposite ends of the ring do not.  
     A. *The ends are separate species—they can’t interbreed.*  
     B. *The entire ring is one species—gene flow connects them all.*  
     C. *End populations are distinct based on traits/ecology, so they’re separate species.*  
     D. *Drawing a boundary is arbitrary—labels are human conventions.*  

  2. **Asexual Dandelions:**  
     Dandelions reproduce clonally (no interbreeding), yet form distinct morphological groups.  
     A. *They aren’t "species" in the biological sense—interbreeding is essential.*  
     B. *They’re species based on shared evolutionary history.*  
     C. *They’re species if they form ecologically/morphologically distinct groups.*  
     D. *"Species" here is just a useful label for similar organisms.*  

  3. **Fertile Hybrid Cichlids:**  
     Two cichlid groups (isolated recently) interbreed and produce fertile hybrids in captivity.  
     A. *They’re one species—fertile hybrids prove no reproductive isolation.*  
     B. *They’re separate species—they evolved independently.*  
     C. *They’re separate species if they differ morphologically/ecologically in the wild.*  
     D. *Hybridization doesn’t matter—groupings are practical for study.*  

  4. **Gradual Fossil Series:**  
     Fossils show a continuum of forms between ancestor and descendant with no clear breaks.  
     A. *Species can’t be defined here—reproductive isolation isn’t observable.*  
     B. *Divide into species based on branching points in the lineage.*  
     C. *Divide based on measurable trait differences (e.g., skull shape).*  
     D. *Any division is arbitrary—fossil "species" are just conveniences.*  

  5. **Conceptual Question: Species Reality**  
     A. *Species must be real, discrete units in nature (not just human ideas).*  
     B. *Species are real as distinct evolutionary lineages.*  
     C. *Species are real if defined by shared traits/ecological roles.*  
     D. *Species don’t need to be "real"—they’re useful groupings for humans.*  

  6. **Island Colonization:**  
     Birds on an island look similar to the mainland population but have unique adaptations.  
     A. *They’re a new species if reproductively isolated (e.g., by ocean).*  
     B. *They’re a new species because they represent an independent lineage.*  
     C. *They’re a new species if traits/ecology differ significantly.*  
     D. *We might call them a species for research, but it’s not objective.*  

  ---

  ### **Scoring Key**
  Tally responses for A, B, C, and D. The **highest score** indicates the student’s dominant view:  
  - **Mostly A: Biological Species Concept (BSC)**  
    Focus on interbreeding/reproductive isolation.  
  - **Mostly B: Phylogenetic Species Concept (PSC)**  
    Focus on shared evolutionary history/lineages.  
  - **Mostly C: Morphological/Ecological Species Concept (MSC)**  
    Focus on observable traits, ecology, or adaptation.  
  - **Mostly D: Deflationary/Nominalist (NOM)**  
    Species as human constructs for convenience.  

  ---

  ### **Ambiguities and Limitations**  
  1. **BSC vs. PSC in hybrids (Q3):**  
     - If hybrids are fertile (A), BSC may lump them as one species.  
     - PSC (B) often splits them due to independent evolution.  
     *Quiz can’t distinguish if a student prioritizes "lineages" over "isolation" here.*  

  2. **PSC vs. MSC in fossils (Q4) or dandelions (Q2):**  
     - PSC (B) and MSC (C) often overlap if traits define lineages.  
     *Quiz leans PSC if "lineage" is mentioned (B), MSC if "traits/ecology" dominate (C).*  

  3. **Realism (A/B/C) vs. Nominalism (D) in Q5:**  
     - A, B, and C all reflect realism (species are real) but differ in *why*.  
     *Quiz groups all realism together but distinguishes sub-views via other questions.*  

  4. **Ring species (Q1):**  
     - BSC (A) and PSC (B) conflict: A splits the ends, B lumps the ring.  
     *Quiz can’t capture hybrid views (e.g., "incipient species").*  

  ---

  ### **How to Use**  
  - **Discussion Starter:** Have students self-score, then debate in groups.  
  - **Reveal Biases:** Highlights if students default to BSC (common in intro courses) or NOM.  
  - **Clarify Concepts:** Use cases to explain why no single definition works universally.  

  This quiz avoids label-matching by forcing students to *apply* their intuitions to messy cases—exposing whether they prioritize reproduction, lineages, traits, or utility.
