  ### Thought Experiment: The Mimicry Moth and the Nightjar

  In a tropical forest, a species of nightjar bird has evolved to hunt moths at dusk. Initially, the nightjars targeted only edible moths (species *Edibilis*), which have a distinctive wing pattern: a bright orange spot on a gray background. The nightjars’ visual system produces a neural state type, N, triggered by this pattern, leading to a dive-catch response. Over time, a toxic moth species (*Toxica*) evolves mimicry, developing an identical orange spot to deter predators. Due to recent environmental changes, *Toxica* moths now vastly outnumber *Edibilis* in the nightjars’ habitat. On a typical evening, a nightjar’s state N is triggered by a *Toxica* moth. Crucially, the nightjar lineage has no historical exposure to *Toxica*—the mimicry is novel, and natural selection has not yet adapted state N to discriminate between the moths. State N was selected solely for detecting *Edibilis* in the past, but in the current ecology, it is causally dependent on the orange spot alone, as this spot reliably appears on both moth types and always triggers N. For this token instance of state N (caused by *Toxica*), Dretske’s and Millikan’s theories diverge on content assignment.

  ### Analysis of Content Assignment
  **Dretske’s Causal Theory (counterfactual causal dependence):**  
  Dretske assigns content based on the causal-informational link established during the state’s acquisition. State N was *acquired* phylogenetically through evolution to covary with the orange spot—initially carried by *Edibilis*. However, Dretske emphasizes *current* counterfactual dependencies: what the state reliably indicates in its present environment. In the new ecology, state N is triggered *whenever* the orange spot is present, regardless of moth species, and would not fire if the spot were absent (e.g., on spotless moths). It is now causally dependent on the spot itself, not *Edibilis*, as spotless *Edibilis* moths (if they existed) would not trigger N, while spotted *Toxica* reliably do. Thus, Dretske assigns the content **presence of an orange spot** to this token state. The state accurately represents the spot but misrepresents if interpreted as *Edibilis*—though Dretske treats the spot as the content, as it is the property the state directly depends on.

  **Millikan’s Teleosemantics (selection history of the state type):**  
  Millikan assigns content based on the *proper function* of state N, determined by its evolutionary selection history. State N was selected *only* for its role in detecting *Edibilis* moths—ancestral nightjars produced N in response to *Edibilis*, and this led to successful feeding, which enhanced fitness. The orange spot was merely a reliable indicator of *Edibilis* during selection; it was not the target. The state’s function is to indicate *Edibilis*, and any triggering by *Toxica* is a malfunction. Thus, Millikan assigns the content **presence of *Edibilis*** to this token state. The state misrepresents because *Toxica* is present, but the content is fixed by historical success conditions, not current dependencies.

  ### Structural Feature Causing Divergence
  The divergence stems from **the conflict between current causal dependencies and historical selection pressures**. Dretske prioritizes the state’s present counterfactual dependence on a detectable property (the orange spot), which is stable and reliable in the new environment. Millikan prioritizes the state type’s historical function (detecting *Edibilis*), which is unchanged by recent ecological shifts. If we remove this conflict—for example, by making *Toxica* moths present during the evolutionary history—selection could have refined state N to discriminate spot-bearing moths, aligning both theories on content like "edible moth" or "orange spot." Similarly, if current dependencies matched history (e.g., only *Edibilis* moths existed), both theories would assign "*Edibilis*" or "orange spot" as content.

  ### Defense Against the Case
  **A Dretskean defending against teleosemantics:**  
  A Dretskean might argue that Millikan’s appeal to selection history overlooks the *individual token’s* causal role. State N’s triggering is now lawfully dependent on the orange spot, not *Edibilis*—spotless *Edibilis* would not cause N, falsifying Millikan’s assigned content. Millikan conflates the state’s *etiology* (why it exists) with its *current indication* (what it signals). In this context, *Edibilis* is not causally relevant; the spot alone explains state N’s occurrence. Teleosemantics thus imposes an irrelevant historical "purpose" detached from the token’s actual informational link.

  **A Millikanian defending against the causal theory:**  
  A Millikanian might dispute Dretske’s reading of causal dependence. State N’s function is not to detect spots but to secure nutrition; spots are just a *local sign* of prey. Dretske’s focus on proximal properties (the spot) ignores the state’s *systemic role* in the nightjar’s behavior—dive-catching is only adaptive if it targets edible moths. The spot-based content is too indeterminate; it could apply to any orange-spotted object (e.g., flowers), making misrepresentation inexplicable. Dretske’s theory misidentifies the state type by isolating it from its evolved motivational context: hunger, not mere spot-detection, drives state N.
