prompt: |-
  I work in the secretariat of a national equality commission — small country, just call it the Commission — that issues non-binding opinions on whether proposed quota schemes in public and publicly funded institutions square with our equality statute. The statute is maddeningly short: it permits measures aimed at substantive equality so long as they are appropriate, proportionate and time-limited, and then it stops. Ten years of opinions have built up a body of precedent, but the Commission has never written down the rule its actually running, so every new file restarts the same argument from scratch. I have to draft a note for Thursday and I want to know what we should say to be consistent with ourselves rather than with our politics.

  Our record so far, compressed as best I can:
  1. Approved a floor requiring roughly two fifths of seats on state-owned company boards to go to each gender, enforced by a hard sanction and a two-year compliance window. No end date.
  2. Rejected reserving a third of promotions into the senior civil-service grade for members of a long-excluded group, on the ground that entry-level posts for that group were already reserved and the shortfall at the senior grade had largely closed.
  3. Approved a rule requiring party candidate lists in closed-list elections to alternate genders all the way down.
  4. Rejected a municipal fire brigade's plan to reserve a quarter of entry posts for residents of two named districts, even though applicants from those districts passed the same physical test at the same rate as everyone else, because the plan had no end date and no review.
  5. Approved with conditions a scholarship fund for first-generation university students, capped at 15% of the fund, reviewed every five years against whether the gap had closed.
  6. Rejected a conservatoire's proposal to reserve 20% of its places for applicants from the poorest fifth of postcodes, where admission is by audition, saying the measure would interfere with assessing the very thing the institution exists to select for.
  7. Approved a tie-break: where two candidates land within one point of each other on the same exam, preference goes to the one from the group underrepresented at that grade, and the rule lapses automatically the moment representation reaches parity.
  8. Rejected a requirement that employers above fifty staff reserve 5% of all vacancies for people with disabilities, enforced by a levy, noting that a levy lets an employer buy its way out so the reserve wasnt binding on anybody.

  The new file. A public medical school, funded by us, admits through a single national exam that ranks every applicant. It wants to reserve 25% of its places for applicants who grew up in three regions that are badly under-doctored. Those regions supply about 24% of the applicant pool but hold 8% of the places, and their applicants score within a couple of points of the national median on that same exam. The school's stated aim is not compensation for anything anyone did to those regions — it's that graduates from there go back and practise there, and it wants to attach a bond that waives tuition for reserved-place students who take up a post in the region within five years of qualifying. There's a seven-year sunset with a mandatory review at year four. The people displaced are individually ranked applicants who would otherwise have had a place, and one of them has already written to us; separately, applicants from a fourth region that is served just as badly but is not on the list say they've been left out arbitrarily.

  So, what should we say? I want (a) the candidate rules that are each consistent with all eight precedents — I can think of a "was there identified discrimination by the state" rule, an "is the shortfall unexplained among people who have already cleared the same bar" rule, a "does it end" rule, and something about how many named individuals get displaced, but tell me which of those genuinely survive the whole list and build better ones where mine don't; (b) for each surviving rule, what it predicts for the medical school file, as a table so I can see exactly where they come apart; (c) your recommendation, with the single closest precedent named and an honest account of what has to be distinguished to get there; and (d) whichever way we go, the principle we would be committing ourselves to, phrased so that we couldn't quietly reverse it next year without someone noticing. Also tell me which of the eight is the outlier we'll eventually have to explain away, and give me one further hypothetical file — concrete enough that I could actually table it at a meeting — that would split the surviving rules from each other. My colleague Marta thinks it's a clear approve because of the sunset and I think she's underweighting #6, but I could be wrong about that as well. No need for foreign case law or a reading list, just the reasoning worked through.
reasoning: |-
  Hmm, the user works for a national equality commission and needs to draft a consistent opinion on a medical school quota proposal. They've provided eight precedents and want a structured analysis that reconciles all past decisions. Let me unpack this carefully.

  First, the precedents show clear patterns:
  - Time limits are non-negotiable (rejected #4 for lack of sunset, approved #5/#7 with sunsets)
  - Proportionality matters (rejected #2 when shortfall was closing, rejected #8 with buy-out loophole)
  - Academic/merit integrity is protected (approved tie-break in #7 but rejected #6 for auditions)
  - Group definition must be justified (rejected #4's arbitrary districts)

  The medical school case has strong points: sunset clause, regional need (not historical discrimination), and applicants from target regions perform near national median. But red flags: displaces higher-ranked candidates (like #6's concern) and excludes equally underserved Region 4 (like #4's arbitrariness).

  Building rules that fit all eight:
  1. The Sunset Rule: Must have end date/review mechanism. Medical school passes (7yr sunset + review).
  2. The Proportionality Rule: Gap must be significant and persistent. Here 8% vs 24% applicant share is stark.
  3. The Merit Integrity Rule: Can't compromise core selection criteria. Problematic - reserving 25% places conflicts with exam ranking like #6.
  4. The Targeting Rule: Group definition must be evidence-based. Fails - excluding Region 4 is arbitrary.

  Rules split on outcome: Sunset/Proportionality support approval, but Merit/Targeting suggest rejection. Precedent #6 (conservatoire) is closest but distinguishable - medical training has public service dimension unlike pure merit-based auditions. However, the arbitrary exclusion of Region 4 is fatal under #4 precedent.

  Recommended rejection with guidance: Medical school must either adjust quota to tie-break system (#7 style) or include all underserved regions. This commits to "No quota without complete coverage of equally eligible groups." Outlier is #1 (no sunset on board quotas) - will need future explanation about transitional governance roles.

  Hypothetical test: University reserves 10% engineering seats for rural students with sunset, but rural applicants already outperform urban peers on entrance math scores. Splits rules - Proportionality sees no gap, but Sunset/Targeting would approve otherwise.
answer: |-
  Here’s a principled framework derived from your precedents, applied rigorously to the medical school case:

  ### (a) Rules Consistent with All 8 Precedents  
  1. **Proportionality Rule**: The gap addressed must be significant, persistent, and not self-correcting. (*Rejected #2, #4; Approved #1, #5, #7*)  
  2. **Sunset Rule**: Measures must have a fixed end date and periodic review tied to gap closure. (*Rejected #4, #8; Approved #5, #7*)  
  3. **Merit Integrity Rule**: Cannot override core merit-based selection criteria where merit is the institution’s defining purpose. (*Rejected #6; Approved #3, #7*)  
  4. **Targeting Rule**: The beneficiary group must be defined by verifiable disadvantage, excluding equally eligible groups arbitrarily. (*Rejected #4; Approved #5*)  

  *(Note: "Identified discrimination" fails due to #5; "individual displacement" fails as #1/#3 displace individuals.)*

  ---

  ### (b) Prediction Table for Medical School Proposal  
  | Rule                | Prediction | Reasoning |  
  |---------------------|------------|-----------|  
  | **Proportionality** | ✅ Approve | Gap is severe (8% vs. 24% applicant share), persistent, and applicants near median score show capacity. |  
  | **Sunset**          | ✅ Approve | 7-year sunset + review meets #5/#7 standard. |  
  | **Merit Integrity** | ❌ Reject  | Overrides ranking on core admission exam (like #6’s audition interference). |  
  | **Targeting**       | ❌ Reject  | Excludes equally underserved Region 4 arbitrarily (like #4’s districts). |  

  **Split**: 2–2 (approve/reject).

  ---

  ### (c) Recommendation & Closest Precedent  
  **Verdict**: **Reject**  
  - **Closest Precedent**: **#6 (Conservatoire)**.  
  - **Distinguishing**: Both override core selection criteria (#6: auditions; here: exam ranking). The medical school’s public service aim doesn’t negate that admissions are exam-defined, just as auditions define the conservatoire.  
  - **Honest Distinction Needed**: #5 (scholarship) didn’t override academic criteria; #7 (tie-break) minimally interfered. Here, 25% reservation displaces higher-scoring candidates outright.  

  **Why Marta is Half-Right**: Sunset satisfies temporal conditions (#4), but doesn’t resolve merit/targeting flaws (#6, #4).  

  ---

  ### (d) Binding Principle to Adopt  
  > "**Quotas may redress representational gaps only where:  
  > (i) the selection mechanism is not intrinsically merit-defining;  
  > (ii) all equally eligible groups are included; and  
  > (iii) interference with individual ranking is marginal (e.g., tie-breaks).**"  

  *This prevents reversal without confronting #6 (merit integrity) or #4 (arbitrary exclusion).*

  ---

  ### Outlier Precedent  
  **#1 (Board Quotas)**: Contradicts **Sunset Rule** (no end date) and **Merit Integrity Rule** (board seats imply merit-based selection). *You’ll eventually need to confine it to "transitional governance roles" or overrule it.*  

  ---

  ### Hypothetical File to Split Surviving Rules  
  **Proposal**: A national physics olympiad team reserves 30% of spots for applicants from rural schools (scoring within 5% of cutoff), with 10-year sunset.  
  - **Background**: Rural applicants are 10% of qualifiers but 35% of population; urban counterparts outperform by 8% on average.  
  - **Split**:  
    - *Proportionality/Sunset Rules*: Approve (gap + sunset).  
    - *Merit Integrity/Targeting Rules*: Reject (overrides competition ranking (#6) and excludes equally scoring peri-urban applicants (#4)).  

  This forces a choice between gap-redressing and merit/targeting principles.  

  ---  
  **Final Note**: The medical school’s bond/tuition waiver is commendable but irrelevant to quota legality under your precedents. Recommend rejecting *this specific quota* but endorsing the bond system as a non-discriminatory alternative. Precedents point to rejection—consistency demands it.
