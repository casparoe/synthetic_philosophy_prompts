prompt: |-
  I'm a second year PhD student and my committee wants a dissertation proposal by the end of the term, and the one part of Scanlons contractualism i keep coming back to is the aggregation problem — basically how a pairwise, person-by-person theory is supposed to handle many small harms versus one large one. Can you tell me what you think the main open questions are in that area, and which two or three i should actually build a dissertation around? I want the ordering defended, not just a list: what makes a question worth three years of work (how important it is, how tractable it is, how neglected it is, and how much other work in the area depends on getting it right), and what would change your ranking if things developed a certain way over the next couple of years. I dont need a reading list or citations, just the reasoning about what deserves attention and why.
