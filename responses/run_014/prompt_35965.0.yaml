answer: |-
  Your diagnosis is sharp: the stalemate stems from **three intertwined yet distinct disputes**, masquerading as one. Neither side moves because they answer different core questions while talking past each other on shared concerns like explanation. Here's the breakdown:

  1.  **The Metasemantic Question:** *What is the nature of our concept/predicate 'true'?*
      *   **Deflationist Answer:** 'True' is a logical device for disquotation, endorsement, and generalization over propositions/utterances. Its *meaning and function* are exhaustively captured by the equivalence schema (e.g., "Snow is white" is true iff snow is white). There is no substantive *property* denoted beyond this expressive role.
      *   **Inflationist Answer:** 'True' denotes a genuine, substantive property (correspondence, coherence, superassertibility, etc.) shared by truth-bearers. The schema is merely a consequence or partial test of this property, not its essence.

  2.  **The Metaphysical Question:** *Is there an explanatorily potent property of truth?*
      *   **Deflationist Answer:** No. Any apparent explanation (e.g., "True beliefs are useful") reduces to non-truth-theoretic facts ("Believing *that snow is white* is useful *because snow is white*, and useful because of how the world is and what we need"). Invoking 'truth' adds nothing but semantic ascent.
      *   **Inflationist Answer:** Yes. Truth is a *unified, explanatory property*. It explains why diverse true beliefs (scientific, moral, mathematical) all tend to be successful/stable/useful *in virtue of being true*. It explains logical validity (preserving truth). It explains what successful representation across languages shares. The schema alone cannot provide this unifying explanation.

  3.  **The Meta-Philosophical Question:** *What counts as a "theory of truth"?*
      *   **Deflationist View:** A theory of the *predicate* 'true' – its function and rules of use. This *is* the theory of truth.
      *   **Inflationist View:** A theory of the *property* truth – its nature, grounds, and explanatory power. A theory merely about the predicate is insufficient.

  **The Stalemate Explained:**

  *   **Talking Past:** Deflationists primarily address Question 1. Inflationists primarily address Question 2. Each sees the other as missing the point. When inflationists point to explanatory roles (Q2), deflationists reinterpret them as reducible via disquotation (Q1 answer). When deflationists emphasize the predicate's function (Q1), inflationists see it as irrelevant to the property's nature (Q2).
  *   **The Explanation Impasse:** This *is* substantive, but hinges on the prior splits. Deflationists demand *causal* or *reductive* explanations where 'truth' is eliminable. Inflationists offer *constitutive* or *unifying* explanations where 'truth' names the relevant common feature irreducible to specific non-semantic facts. This disagreement reflects deeper divides about the nature of explanation itself (e.g., must explanations always be reductive?).
  *   **The Schema's Generality Argument:** Inflationists argue you need a robust truth predicate to state the generality of the schema itself ("Everything Aristotle said is true"). Deflationists counter that a disquotational device *just is* sufficient for this expressive role (Q1). Inflationists see this as parasitic on the very property they're defending (Q2).

  **Pathways to Progress:**

  1.  **Sharper Distinctions:** Explicitly separate the three questions. Frame debates as: "Is your claim about the predicate (Q1), the property (Q2), or what counts as theory (Q3)?"
  2.  **Targeted Test Cases:** Focus on specific "explanatory role" claims where deflationist reduction seems strained. Can deflationism genuinely explain the *normativity* of truth (why we *ought* to believe truths) or logical validity *without* smuggling in a substantive property? Can inflationism show its property *adds* genuine explanatory power beyond redescribing the non-semantic facts?
  3.  **Reformulate the Core Question:** Shift the debate to: "**What work, if any, *irreducibly requires* attributing a substantive property 'truth', beyond the expressive functions captured by disquotation and generalization?**" Test proposed work rigorously.
  4.  **Meta-Explanation Debate:** Engage directly on the nature of explanation required. Must explanations involving truth be reductive? Can unifying/constitutive explanations be legitimate even if non-causal?

  **Conclusion:** The debate is partly verbal (Q1 vs. Q2/Q3) and partly substantive (the nature of explanation required for Q2). Real progress demands disentangling these strands. It's not a placeholder; the questions matter. But moving forward requires acknowledging the distinct projects: deflationism offers a powerful account of the *predicate*'s logic, while inflationism seeks an account of a *property* unifying diverse phenomena. Success lies in showing whether, where, and why one project fails where the other succeeds on *shared* explanatory ground, under agreed-upon standards of explanation.
