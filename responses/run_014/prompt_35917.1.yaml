prompt: |-
  I've been trying to work out from my gut reactions when everyday conventions are actual moral obligations, and especially when visitors have to follow local ones as opposed to their own. Here's my set of verdicts. Cutting in at the bakery when there's a long queue: not fine, even though nothing in the law says anything about queues. An American dining in the US and leaving no tip: not fine, even though the menu price is technically the "real" price and tipping is officially voluntary. That same tourist tipping a server in Japan: not an obligation at all — I've been told it can even cause embarrassment — so for the visitor the obligation seems to flip with the local convention, whatever it happens to be. Standing on the wrong side of a Tokyo escalator (I've read they stand left there, and in Osaka it's the reverse, which nobody can explain to me): fine, a bit clueless, but I wouldn't call it wrong. A German visitor in Boston at 2am standing at a don't-walk signal with no car in sight while locals stream past: not wrong, just odd — no obligation to break a rule just to fit in. But the same kind of person crossing against the light in Germany while schoolkids look on: wrong, actually wrong, not merely embarrassing. Taking your shoes off in a Japanese home even though at home you never do: obligatory for the visitor. At a market stall in a country where there is no queue, just a general crush of people pushing forward, the visitor who politely hangs back and never gets served is not a sucker, and the locals pushing are not being unfair — so local practice sometimes seems to set what's allowed rather than what's required, but the American in Germany had to respect the light even though plenty of locals cross on amber, which sure looks like the same thing. Also: I think the US tipping system is a bad system, and I still think stiffing the server is wrong — but I'm not sure whether a local who sincerely thinks a convention is unjust is allowed to unilaterally opt out of it, or only to complain while complying.

  So my question: is there a principle that gets all or nearly all of these? The pattern I half see is that conventions bind when they're doing cooperative work like dividing a burden or supporting somebody's livelihood (the queue, the tip) and merely coordinate when they're not (escalator side), but then the traffic-light pair bothers me, because both lights look like pure coordination to me and yet the verdicts come out different. And there's a case I keep going back and forth on, so tell me what the principle says about it: a vegetarian visiting somewhere as a guest where refusing offered meat would be a serious affront to the host — can they decline, or does the local convention override the home one there the way it did with the shoes? If you can't save every verdict, tell me which ones to drop, and please state whatever principle you end up with precisely enough to say what it'd rule on a case I haven't listed. (Also, jsut to be clear, I don't want "when in Rome" as the answer — I already know that one, and I can't get it to match my own verdicts.)
reasoning: |-
  Okay, the user is wrestling with how to navigate moral obligations versus local conventions when traveling or interacting with different cultures. They've listed several scenarios where their gut reactions differ, and they're seeking a unified principle that explains all these judgments. 

  First, I notice their examples cluster around three types of situations: resource allocation (bakery queue, market crush), symbolic reciprocity (tipping, shoe removal), and coordination norms (escalators, traffic lights). The tipping cases are particularly interesting because they reveal a tension—the user condemns skipping tips in the US but accepts not tipping in Japan, despite both being "voluntary" systems. 

  The traffic light paradox stands out as their core frustration. Why is the German tourist crossing against the light in Germany "wrong" while standing obediently at an empty Boston intersection is merely "odd"? Both involve rule-following, but the weight of obligation shifts. I suspect this hinges on whether the norm serves a moral purpose (preventing harm to children observing) versus pure coordination (no actual danger at 2am). 

  Their unresolved vegetarian dilemma is telling. They intuitively feel shoe removal in Japan is obligatory but hesitate when personal ethics (vegetarianism) clash with hospitality customs. This suggests their underlying concern is about harm—physical or social—versus personal conviction. 

  The user clearly rejects simplistic "when in Rome" solutions. They want nuance: why some conventions create moral duties (tipping sustains livelihoods) while others don't (escalator sides). Their market stall example shows they recognize conventions can define fairness itself—yet they balk at applying this to the traffic light case. 

  What they might not articulate is that they're actually probing two things: (1) when conventions generate moral obligations beyond practicality, and (2) whether visitors get "moral discounts." Their examples reveal they assign stronger duties to norms that prevent tangible harm (server's income, children's safety) versus those avoiding mere awkwardness (escalator mishaps). 

  For the vegetarian case, the harm principle I'm considering would likely say: declining meat is permitted if the refusal avoids serious ethical violation (e.g., religious prohibition) but not for mild preference, since the social harm of insulting a host outweighs personal discomfort. But they'd need to weigh how severe the affront is versus how core the dietary restriction is. 

  The real test might be a new case: say, a business visitor in Saudi Arabia refusing to let a female colleague enter a building first (if local gender norms demand men precede women). The harm principle would likely call that refusal obligatory—not because the norm is good, but because violating it might cause her professional harm. Whereas in Sweden, following that same chivalric norm might cause offense. Context is king.
answer: |-
  You've hit on a fascinating and complex problem in practical ethics and social norms. Your intuitions are largely consistent, and a refined principle *can* capture most of your verdicts – though the traffic light case might require a slight adjustment or acceptance of a nuance. Here's a principle that fits your core intuitions:

  **The Cooperative Harm Avoidance Principle (CHAP):**

  > **A visitor is morally obligated to follow a local convention when:**
  > **1.  The convention serves a core cooperative function (allocating scarce resources, enabling fair compensation, preventing significant harm, or expressing essential respect); AND**
  > **2.  Violating it would likely cause identifiable harm (material, social, or dignitary) to specific individuals or undermine the cooperative system itself; AND**
  > **3.  The cost of compliance to the visitor is reasonable.**

  **Where this principle *doesn't* create an obligation:**
  > If the convention is purely coordinative (solving a mere arbitrary choice problem without deeper cooperative stakes), or the potential harm from violation is negligible or primarily only to the violator (embarrassment, inefficiency), then compliance is polite but not obligatory.

  **Applying CHAP to Your Cases:**

  1.  **Cutting in at the bakery:**
      *   **Cooperative Function:** Fair allocation of scarce resource (service time) & burden-sharing (waiting).
      *   **Harm:** Direct harm to those bypassed (longer wait, frustration), undermines fairness of the queue system.
      *   **Cost:** Minimal (waiting).
      *   **Verdict:** **Obligatory.** (Matches yours)

  2.  **American not tipping in US:**
      *   **Cooperative Function:** Enabling fair compensation for service workers whose wages are structured assuming tips.
      *   **Harm:** Direct financial harm to the server (lost expected income), undermines the wage system they rely on.
      *   **Cost:** Minimal (modest financial outlay).
      *   **Verdict:** **Obligatory.** (Matches yours)

  3.  **American tipping in Japan:**
      *   **Cooperative Function:** *None* (system doesn't rely on it). Actually *disrupts* the local compensation norm (salaries) and cultural understanding of service/gratitude.
      *   **Harm:** Causes social harm/embarrassment to server (confusion, potential offense, feeling obligated), disrupts the cooperative system.
      *   **Cost:** Compliance (tipping) itself *causes* harm. Non-compliance avoids harm.
      *   **Verdict:** **Obligation to *NOT* tip.** (Matches yours - flips obligation)

  4.  **Wrong side on Tokyo escalator:**
      *   **Cooperative Function:** Purely coordinative (efficient flow). No resource allocation, compensation, or deep respect involved.
      *   **Harm:** Primarily inefficiency or minor annoyance. Harm is diffuse and minor. Embarrassment is mostly the violator's.
      *   **Cost:** Compliance is easy, but non-compliance isn't deeply harmful.
      *   **Verdict:** **Not obligatory (but polite to comply).** (Matches yours - "fine, clueless")

  5.  **German in Boston at 2am at Don't Walk:**
      *   **Cooperative Function:** Safety coordination. **BUT**, context matters critically.
      *   **Harm:** *Actual risk of harm is near zero* (no cars). Social harm is minimal/none (locals stream past).
      *   **Cost:** Compliance (waiting) is minor inconvenience.
      *   **Verdict:** **Not obligatory to cross against the light, but also not obligatory to wait.** Waiting is rule-following but not morally required *in this specific context*. Harm avoidance function is inactive. (Matches your "not wrong, just odd" for waiting).

  6.  **German crossing against light in Germany with schoolkids:**
      *   **Cooperative Function:** Safety coordination *and* modeling behavior crucial for public safety.
      *   **Harm:** **Significant potential harm:** Undermines the norm for vulnerable observers (children), increasing *their* future risk. Sets a dangerous example.
      *   **Cost:** Compliance (waiting) is minor inconvenience.
      *   **Verdict:** **Obligatory to wait.** The *modeling* aspect activates the harm prevention function strongly. (Matches your "wrong").

  7.  **Shoes off in Japanese home:**
      *   **Cooperative Function:** Expresses essential respect for cleanliness and the sanctity of the private space (cultural significance), maintains hygiene.
      *   **Harm:** Causes dignitary harm/offense to hosts (disrespect for their home/customs), potential material harm (dirty floors).
      *   **Cost:** Minimal (removing shoes).
      *   **Verdict:** **Obligatory.** (Matches yours)

  8.  **Market stall crush vs. hanging back:**
      *   **Cooperative Function:** Defines the local method for fair(ish) resource allocation in high-demand, low-order scenarios. The "crush" *is* the convention.
      *   **Harm:** Hanging back *outside* the convention harms *only the visitor* (they don't get served). Pushing *within* the convention doesn't cause unfair harm *under this specific system*. Forcing queueing might actually *harm* the locals by disrupting their efficient system.
      *   **Cost:** Compliance (pushing) might be uncomfortable for the visitor, but is reasonable to access the good.
      *   **Verdict:** **No obligation to hang back; obligation is to participate in the local allocation method (push) to get served.** Locals aren't unfair *within their system*. Visitor isn't a "sucker" for hanging back, but they aren't fulfilling an obligation by doing so; they are simply opting out. (Matches your description: local practice sets what's *allowed*, not necessarily a strict "requirement" beyond participation for access).

  9.  **American in Germany crossing on amber (while locals do):**
      *   **Cooperative Function:** Safety coordination.
      *   **Harm:** Crossing *on amber* within the norm? Minimal if locals do it. **BUT**, if the visitor misjudges safety or timing *because* they are unfamiliar, risk increases. More importantly, consistent flouting of *red* (like the German in Germany case) would be harmful.
      *   **Verdict:** **CHAP suggests:** Crossing *on amber* alongside locals, where it's the norm and safe, is likely *not* a violation of obligation (similar to the Boston 2am case - the harm prevention function is contextually minimized). Crossing against a *red* light, especially when others wait, *would* be problematic (like the German in Germany case). This might slightly differ from your implication that it's clearly "respect the light", but CHAP explains *why* context matters even for lights.

  10. **Local opting out of "unjust" convention (e.g., tipping):**
      *   CHAP suggests opting out *is* problematic if the convention meets CHAP criteria (cooperative function, harm caused by violation).
      *   **Harm:** Stiffing the server *still causes direct financial harm to that worker*, regardless of systemic critique. The cooperative function (compensation) is still active.
      *   **Action:** The local's obligation is to *work to change the system* (protest, lobby, patronize non-tipping establishments) *while complying* to avoid harming individuals trapped within it, *or* to clearly opt-out entirely (e.g., avoid sit-down restaurants relying on tips). Unilateral stiffing harms the vulnerable server without effectively changing the system. (Matches your sense it's wrong even if the system is bad).

  **The Vegetarian Guest Case:**

  *   **Cooperative Function:** Expressing essential hospitality, gratitude, and respect within the host's culture. Preserving social harmony.
  *   **Harm:** Refusing core hospitality (especially if meat is central) causes significant dignitary harm and social rupture to the host. Signals rejection of their generosity/culture.
  *   **Cost:** Significant ethical compromise for the vegetarian (violating core belief).
  *   **CHAP Analysis & Verdict:** This is a **hard conflict**. CHAP highlights the *significant harm* refusal causes. However, the *cost* to the visitor (violating deeply held ethical/religious principles) is also very high. CHAP doesn't automatically override this.
  *   **Resolution:** The visitor should:
      1.  **Communicate respectfully in advance** if possible (explaining dietary restriction as a core belief, not rejection of host).
      2.  **Frame refusal extremely carefully** if surprised ("This looks wonderful, and I'm deeply grateful. Please understand, I have a lifelong personal commitment/promise not to eat meat, it's nothing to do with your hospitality, which means so much.").
      3.  **Focus on participation:** Eat other offered foods enthusiastically.
      4.  **Accept consequences gracefully** if offense is taken despite efforts.
  *   **CHAP Conclusion:** The obligation to avoid severe social harm is strong, but the visitor *can* decline if the ethical cost is *exceptionally* high (e.g., religious prohibition vs. mild preference). However, this requires immense care, communication, and acceptance of potential friction. It's not as clear-cut as removing shoes. **The visitor isn't *fully* obligated to eat the meat, but they *are* obligated to handle the refusal in a way that minimizes harm as much as possible, recognizing significant offense might still occur.** The local convention doesn't automatically override a fundamental ethical commitment, but it demands a heavy burden of care from the guest.

  **Refinements and Nuance:**

  *   **Reasonable Cost:** This is crucial. CHAP doesn't demand unreasonable sacrifice (e.g., bankrupting oneself to tip, violating core religious tenets).
  *   **Knowledge:** Obligation assumes the visitor knows or should reasonably know the convention. A truly clueless first-time visitor gets more leeway than someone informed.
  *   **Modeling Behavior:** As in the schoolkids/traffic light case, norms gain moral weight when violations encourage harmful behavior in vulnerable others.
  *   **Systemic Harm:** Violating norms that sustain fragile cooperative systems (like tipping-based wages) is more serious than violating purely coordinative ones.

  **The Traffic Light "Problem" Revisited:**
  CHAP explains the difference through **contextual harm** and **modeling**. In Boston at 2am, no cars, no observers: no significant harm possible, pure coordination inactive. In Germany with schoolkids: violation models dangerous behavior, creating significant *future* harm potential. The *light itself* is coordinative, but the *act of violating it* in specific contexts creates harm that activates the obligation. Your verdicts are consistent: it's the *harm potential in context* that differs.

  This principle captures the core of your intuitions across diverse cases, providing a framework beyond simple "When in Rome" by focusing on the *function* and *consequences* of conventions.
