  The core tension here is between internal consistency (rationality as coherence) and instrumental success (rationality as winning). Parfit and Kavka expose this beautifully. But recent work has moved toward embedded agency—how humans actually function in messy environments. Maybe that's where the energy is.

  For open questions, I'm thinking: 
  First, the Meta-Commitment Problem—how do we formalize binding yourself to irrationality without infinite regress? 
  Second, the Realism Gap—what happens when we move from toy models to noisy real-world decisions? 
  Third, Identity and Fragmentation—does the "self" need to be unified for these paradoxes to matter?

  Which one to pick? Meta-Commitments might be too technical. Realism Gap feels impactful but broad. Identity Fragmentation is hot right now—tying into predictive processing, mental models. Plus it connects to psychiatry and AI alignment. That's dissertation gold.

  Wait—should I acknowledge the "sideshow" worry? Absolutely. These puzzles are stress-tests for theories. But the real action is in resource-rational models and ecological rationality. Still, solving these could reshape the fundamentals. 

  The student seems sharp. They want upstream questions with escape hatches—answers that matter even if boring. Identity Fragmentation delivers that. If it turns out unified agency isn't necessary, that's still a bombshell for ethics and AI. 

  Tools-wise, they can handle formal modeling but shouldn't drown in it. Philosophy of mind meets computational psychiatry—that's tractable for them. And it's not niche; it's where moral psychology is heading.

