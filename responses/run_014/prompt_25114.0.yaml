  I'm a PhD student trying to settle on a dissertation topic somewhere in the neighborhood of rational irrationality — Parfit's hitchhiker, Kavka's toxin puzzle, the general question of whether it can ever be rational to make yourself irrational. I've got about four years and a background in philosophy with some formal training in decision theory. What do you think are the three or four most important open conceptual questions in this area right now, and which one would you actually build a dissertation around? I want the reasoning, not just a list: which questions are upstream of others, which are tractable with the tools someone like me would have, and which ones would still matter to the broader debate even if the answer came out the boring way. Also, I'm worried this whole area might be a sideshow — that the real action is somewhere else in practical rationality and these puzzles are just edge cases. If you think that, say so and tell me where the real action is.
