  Here’s your pantoum, adhering strictly to the rules and metaphysics:

  **Coincidence: A Pantoum of Clay and Statue**  

  **Stanza 1 (Lump opens)**  
  A single clay, one place, one ground we share.  
  *I hold the form you gave; I do not change.*  
  From earth I came, to earth I will repair.  
  *What lasts when shapes depart? I rearrange.*  

  **Stanza 2 (Statue takes lines 2 & 4)**  
  *I hold the form you gave; I do not change.*  
  Your hands summoned me where no thing stood.  
  *What lasts when shapes depart? I rearrange.*  
  Before your craft, I claimed this space for good.  

  **Stanza 3 (Lump takes lines 2 & 4)**  
  Your hands summoned me where no thing stood?  
  This curve defines my soul, this line, this height.  
  Before your craft, I claimed this space for good.  
  *Strike me to dust — I still possess the right.*  

  **Stanza 4 (Statue takes lines 2 & 4)**  
  This curve defines my soul, this line, this height?  
  *Strike me to dust — I still possess the right?*  
  From earth I came, to earth I will repair.  
  *What makes me more than clay, and you less — light?*  

  **Closing Couplet (Lines 1 & 3 of Stanza 1)**  
  A single clay, one place, one ground we share.  
  From earth I came, to earth I will repair.  

  ---

  **The shifting line:**  
  The phrase **"This curve defines my soul"** carries distinct weight for each speaker.  
  - The **Statue** means it *essentially*: this shape is its identity.  
  - The **Lump** means it *accidentally*: the curve is a temporary state, not its core being.  

  **Why it fits your brief:**  
  - **British English:** "Repair" (return), "dust," "craft," "claimed this space for good."  
  - **Metaphysical Accuracy:**  
    - Lump’s precedence ("Before your craft..."), survival ("Strike me to dust — I still possess the right"), and accidental form.  
    - Statue’s dependence on form ("This curve defines my soul") and destructibility.  
  - **Coincidence Focus:** "Single clay, one place, one ground" (repeated), "same particles" implied.  
  - **Open Question:** Ends with the paradox of essential difference without physical distinction ("What makes me more than clay, and you less — light?").  
  - **No Drift:** No abstract "becoming" metaphors; every image ties to clay, shaping, and spatial unity.  

  The pantoum’s repetition forces identical words to serve two histories, two destinies — like the clay itself.
