prompt: |-
  I'm a high school junior, and I'm stuck on a negotiation with my friend and would like a careful second opinion. Over the past year, my friend and I have been building a small app together: I wrote essentially all of the code, and he handled the design, the marketing, and the customer relationships. We've just decided to sell it, and a company has offered $60,000 for the whole package. The buyer doesn't care how we divide that $60,000, so in principle we are free to split it any way we like. The problem is that we can't agree on the division.

  His proposal is a straight 50/50 split, on the grounds that each of us gave up roughly the same number of hours over the year, and he believes that is the only fair way to divide it. I've been uncomfortable with that, though, because I have a concrete outside option: I know a startup that would pay me $30,000 for the codebase alone if I walked away. He has told me that the most he could do on his own — take the design assets and the customer relationships to a local client — would bring in about $5,000. I can't quite articulate why his 50/50 feels wrong to me; on the surface, the idea that equal hours should mean an equal share sounds reasonable, and I don't want to come across as greedy. I have a vague sense that game theorists have developed a formal way to think about exactly this kind of problem — two people dividing a surplus when they have different walk-away options — and I'm wondering whether any of those methods would actually recommend a specific split here, or whether they merely say that any split in some range is defensible.

  If there is a defensible answer, what dollar split does it give, and what is the reasoning behind it? If you work through the formal options, please give, for each theory you consider, the specific dollar split it recommends and a one-sentence explanation of why it produces that number, and say whether his equal-split argument comes out as the right one under any of them. (For context: we've known each other since middle school, and I value the friendship, which is part of why I've been reluctant to push back hard.)
reasoning: |-
  Okay, let me try to figure this out. The user is a high school junior who built an app with a friend. They're selling it for $60k and can't agree on how to split the money. The friend wants a 50/50 split because they spent equal hours. The user wrote all the code and has an outside offer of $30k for the codebase. The friend can only get $5k with his part. 

  First, I need to understand why the user feels 50/50 isn't fair despite the equal hours. The key points here are the outside options. The user's BATNA is $30k, while the friend's is $5k. In negotiation theory, these alternatives should influence the split. 

  The equal hours argument doesn't account for the value each brought. The user's code is worth more, proven by the outside offer. The friend's contributions—design, marketing, customer relations—are valuable but not as much without the code. 

  Looking at game theory models: The Nash Bargaining Solution would add the BATNAs to the surplus and split the remainder. So $30k + $5k = $35k, leaving $25k surplus. Split that in half: $12.5k each. Then add BATNAs back: user gets $42.5k, friend $17.5k. Shapley Value considers each player's marginal contribution. Adding the user first: $60k minus friend's $5k = $55k. Adding friend first: $60k minus user's $30k = $30k. Average those: user gets $42.5k, friend $17.5k. Equal Sacrifice suggests each gives up the same amount relative to their BATNA. User gives up 14.3% of their BATNA, friend gives up 14.3% of theirs. So user gets 85.7% of $30k = $25.7k? Wait, that doesn't sound right. Let me recalculate. 

  Actually, Equal Sacrifice would set the loss as a percentage. If total is $60k, user's share minus BATNA, friend's share minus BATNA. But the percentages should be equal. So if user gets X, friend gets 60-X. Then (X - 30k)/30k = ((60k - X) - 5k)/5k? Solving that equation: (X-30)/30 = (55-X)/5. Multiply both sides by 30: X-30 = 6*(55-X). X-30=330-6X. 7X=360. X=51.428k. So user gets $51.4k, friend $8.6k. But that seems skewed. Maybe I made a mistake. 

  Alternatively, the Equal Percentage Gain. Each gets the same percentage increase over BATNA. So user's gain: (X - 30)/30, friend's gain: ((60-X)-5)/5. Set those equal: (X-30)/30 = (55-X)/5. Same as above? No, that's the same equation. So same result. But that gives user $51.4k, which is much higher. But the Shapley and Nash both gave around $42k. 

  The user mentioned valuing the friendship. So pushing for Nash or Shapley's $42.5k might be better than Equal Sacrifice's $51k, which could feel unfair to the friend. The 50/50 split ignores BATNAs completely. The friend might not realize how much the user's outside option affects the fairness. 

  Also, the user might feel guilty for not valuing the friend's time equally. But hours don't equal value. The market determines value through outside offers. The code is worth more. The friend's argument hinges on time, but in business, contribution value matters more. 

  Another angle: without the user's code, the friend's assets are worth $5k. Without the friend, the user's code is worth $30k. Together, they get $60k. So the synergy is $25k ($60k - $35k). Splitting that equally means $12.5k each. So user gets $30k + $12.5k = $42.5k, friend gets $5k + $12.5k = $17.5k. That seems the most logical. 

  The user should explain this using the outside options. Emphasize that it's not about hours but the value each brings to the table. The friendship might be preserved if the split is based on objective measures rather than subjective feelings. Suggesting $45k/$15k as a compromise could work, closer to the theoretical $42.5k but slightly more for the friend. 

  The user needs to communicate without sounding greedy. Highlight that both are benefiting: friend gets $17.5k vs. $5k alone, which is 250% more. User gets $42.5k vs. $30k, 41.7% more. The friend's percentage gain is higher, which might make the split feel fairer.
answer: |-
  This is a classic bargaining problem, and game theory provides clear frameworks to resolve it fairly. Your intuition is correct: **equal hours alone don't determine fairness when outside options (BATNAs - Best Alternative To a Negotiated Agreement) differ**. Let's analyze the theories, their recommended splits, and whether your friend's 50/50 holds up.

  ### Core Data
  *   **Total Sale Value:** $60,000
  *   **Your BATNA:** $30,000 (Codebase sale to startup)
  *   **Friend's BATNA:** $5,000 (Selling design/assets locally)
  *   **"Combined BATNA":** $35,000 ($30k + $5k)
  *   **Surplus Value from Cooperation:** $60k - $35k = $25k (This is the extra value created *only* by you two working together).

  ### Game Theory Solutions & Recommended Splits

  1.  **Nash Bargaining Solution (Focus: Fair Surplus Division)**
      *   **Split:** **You: $42,500 | Friend: $17,500**
      *   **Reasoning:** Each party gets their BATNA plus half of the surplus value created by cooperation ($25k / 2 = $12.5k each).
      *   **Equal-Split Valid? NO.** It ignores the significant difference in BATNAs ($30k vs $5k).

  2.  **Shapley Value (Focus: Marginal Contribution)**
      *   **Split:** **You: $42,500 | Friend: $17,500**
      *   **Reasoning:** Calculates your average marginal contribution across all possible team formation orders (You alone: $30k; Friend added: $60k - $30k = $30k gain; Friend alone: $5k; You added: $60k - $5k = $55k gain; Average: ($30k + $55k)/2 = $42.5k for you, ($30k + $5k)/2 = $17.5k for friend).
      *   **Equal-Split Valid? NO.** Your marginal contribution to the combined value is significantly higher than your friend's.

  3.  **Equal Sacrifice / Equal Percentage Gain (Focus: Proportional Benefit)**
      *   **Split:** **You: $51,429 | Friend: $8,571** (See calculation below)
      *   **Reasoning:** Each party receives the *same percentage gain* above their BATNA (Formula: `(Your Share - Your BATNA) / Your BATNA = (Friend's Share - Friend's BATNA) / Friend's BATNA`).
      *   **Equal-Split Valid? NO.** It requires you to sacrifice a much smaller *percentage* of your potential gain than your friend would under 50/50.

      *Calculation:*
      *   Let `Y` be your share, `F` be friend's share (Y + F = $60,000).
      *   `(Y - 30,000) / 30,000 = (F - 5,000) / 5,000`
      *   Substitute `F = 60,000 - Y`:
          `(Y - 30,000) / 30,000 = (60,000 - Y - 5,000) / 5,000`
          `(Y - 30,000) / 30,000 = (55,000 - Y) / 5,000`
      *   Cross-multiply: `5,000(Y - 30,000) = 30,000(55,000 - Y)`
          `5,000Y - 150,000,000 = 1,650,000,000 - 30,000Y`
      *   Combine terms: `5,000Y + 30,000Y = 1,650,000,000 + 150,000,000`
          `35,000Y = 1,800,000,000`
          `Y = 1,800,000,000 / 35,000 = 51,428.57` (~$51,429)
          `F = 60,000 - 51,429 = 8,571`

  ### Analysis & Recommendation

  *   **The Theories Agree (Mostly):** Both Nash and Shapley strongly converge on **$42,500 / $17,500**. This split:
      *   Gives you your BATNA + half the surplus ($30k + $12.5k).
      *   Gives your friend their BATNA + half the surplus ($5k + $12.5k).
      *   Recognizes the $25k surplus exists *only* because you cooperated, so splitting *that* equally is fair.
      *   Reflects your significantly stronger bargaining position due to your $30k BATNA.
  *   **Equal Hours Isn't the Right Metric:** Effort matters, but the *market value* of your respective contributions (proven by your BATNAs) is the critical factor for dividing the *financial proceeds*. Your code is demonstrably worth much more independently.
  *   **50/50 is Not Supported:** None of the standard fairness models support a straight 50/50 split given the vast difference in outside options. It undervalues your contribution's standalone worth.
  *   **Equal Sacrifice is an Outlier:** While mathematically valid, $51k/$9k feels lopsided in practice and doesn't align as well with the cooperative surplus concept central to Nash/Shapley. It's less commonly used as the primary fairness benchmark in this context.

  **Actionable Advice & Talking Points:**

  1.  **Propose the Nash/Shapley Split ($42.5k / $17.5k):** This is the most defensible fair split based on established theory. Frame it positively:
      *   "I've thought a lot about fairness, considering *both* our time and what we could get on our own. My research on fair division suggests a split like $42.5k for me and $17.5k for you. Here's why..."
  2.  **Explain the Logic Clearly:**
      *   "Separately, our work is worth $30k (my code) + $5k (your assets) = $35k."
      *   "Together, we created $60k. That means our *partnership* generated an extra $25k in value."
      *   "Splitting *that extra $25k* equally ($12.5k each) means I get $30k + $12.5k = $42.5k, and you get $5k + $12.5k = $17.5k. This way, we both benefit equally from having worked together."
  3.  **Highlight Your Friend's Benefit:** "This means you walk away with $17.5k instead of $5k – that's a $12.5k gain just from us partnering! I gain $12.5k over my solo option too."
  4.  **Acknowledge Effort, Prioritize Value:** "I know we both put in huge hours, and your work on design/marketing was essential to get us to $60k. *But* the market shows the codebase has a much higher standalone value ($30k vs $5k). This split respects both our contributions *and* that reality."
  5.  **Consider a Small Compromise (If Needed for Friendship):** If $42.5k/$17.5k feels too stark initially, propose **$40k / $20k**. This still gives you a fair $10k surplus (over $30k BATNA) and gives your friend a very generous $15k surplus (over $5k BATNA) – 3x their solo value! It moves slightly towards 50/50 while acknowledging your stronger position.
  6.  **Avoid:** Saying 50/50 is "unfair" outright. Instead, explain why the *market value* of contributions, proven by BATNAs, must be part of the equation alongside effort.

  **Conclusion:** Game theory strongly supports your feeling that a 50/50 split is not equitable here. The fair and theoretically grounded splits center around **$42,500 for you and $17,500 for your friend**, based on respecting BATNAs and equally splitting the surplus value created by your partnership. Propose this (or $40k/$20k as a friendship-preserving compromise) using the clear BATNA + Surplus logic. This approach is objective, based on market realities, and ensures both partners benefit significantly from the cooperation. Good luck!
