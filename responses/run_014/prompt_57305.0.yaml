  Tone-wise, zero winks. The humor is in the mismatch: a volcano complaining about unfair performance reviews. Anchoring jokes in famous but loosely referenced events (Tambora 1815, "Strain Gamma" plague) keeps it accessible. 

  Final touch: The employee ID (VULC-7) and unit names ("Exogenous Inputs") add verisimilitude. The development plan’s absurd deliverables ("secure notarized deposition from atmospheric circulation") underline the satire’s point: we demand impossible rigor from non-human "actors" while letting human decisions off easy. 

  This should work. The user gets a handout that’s academically sharp but never lectures—exactly what they need to fuel those coffee-break arguments.
