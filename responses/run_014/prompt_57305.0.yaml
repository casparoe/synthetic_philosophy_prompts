  Hmm, the challenge is crafting something that feels authentically corporate (rating scales, competencies) while skewering academic practices. The volcanic eruption as a "mid-career employee" is brilliant—it lets me lampoon how historians treat environmental forces as capricious actors. For the firm, "Axiom Historical Outcomes" sounds suitably pretentious, with departments like "Causal Attribution" to mimic real academic silos. 

  For the competencies, I’ll parody common critique points: 
