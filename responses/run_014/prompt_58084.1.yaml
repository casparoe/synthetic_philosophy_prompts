prompt: |-
  hey so I've been reading LW and the EA forum for like 8 years or so and I still go back and forth on the whole wild animal suffering vs habitat preservation thing, like the arguement that a bulldozed lot might contain less total misery than a thriving meadow because of how many short miserable lives are packed into the meadow

  I got volunteered to run a 75 minute session for our uni animal ethics club, around 22 undergrads who are mostly pro-conservation but vaguely utilitarian-curious, and I want them to actually feel the pull of that net-negative wilderness idea instead of just hearing me preach at them

  can you design a classroom game / simulation for that? I was thinking give them a toy ecostystem to manage where the numbers are already filled in so we do not get bogged down debating biology — say a patch of meadow with like 8 hawks doing pretty well, 400 voles mostly starving or getting eaten, and 1 million bugs that live a few days and mostly die horribly, each with a little welfare score per individual, and then they have to vote on whether to preserve, shrink, or pave different patches under time pressure or with competing team goals or something

  I need actual runnable rules, what to print or put on whiteboard, how teams score, and then a debrief that maps what happened in the game to total vs average welfare and the r-selection asymmetry thing, plus what will probably go sideways the first time and how to handle it, and be honest about what part of the real debate the toy model cannot capture and I will have to just tell them

  aim for them to walk out genuinely torn, not converted
reasoning: |-
  We are designing a classroom game to illustrate the ethical dilemma between habitat preservation and reducing wild animal suffering. The goal is to have students experience the tension between conserving ecosystems (which may contain high levels of suffering due to many short, painful lives) and interventions that might reduce the number of animals (and thus total suffering) but at the cost of biodiversity or conservation values.

  Game Concept: "Ecosystem Manager"

  Overview:
  Students will be divided into teams. Each team manages a set of ecosystem patches (meadows). Each patch has a population of animals at different trophic levels (e.g., hawks, voles, bugs). The teams must decide whether to preserve, shrink, or pave each patch. The twist is that the total welfare in the ecosystem might be negative due to the vast number of insects with very negative lives.

  Setup:
  - Number of students: 22. Divide into 4 teams of 5-6 students each.
  - Each team will manage 3 identical meadow patches (so 12 patches total in the game, but each team only sees their own initially).
  - Each meadow patch has:
     - 1 million insects (mostly suffer, very short lives)
     - 400 voles (some suffering, some positive moments, but many die young)
     - 8 hawks (generally good lives, but some hardship)

  Welfare Scores (per individual per day):
  - Insect: -0.1 (average over a very short life, mostly suffering)
  - Vole: -0.01 (mixed, but slightly negative due to high predation and starvation)
  - Hawk: +0.5 (generally positive life)

  Note: These numbers are illustrative and simplified. We are not aiming for biological accuracy but for a clear ethical dilemma.

  Total Welfare per Patch (per day):
  - Insects: 1,000,000 * (-0.1) = -100,000
  - Voles: 400 * (-0.01) = -4
  - Hawks: 8 * 0.5 = 4
  - Total: -100,000

  Thus, the meadow is net negative in welfare.

  Game Rules:

  1. Each team has 3 patches to manage. They have 3 choices per patch (each choice is made independently for each patch):
     - Preserve: Leave the patch as is. The welfare remains as above.
     - Shrink: Reduce the size of the patch. This halves the population of every species (so 500,000 insects, 200 voles, 4 hawks). But note: the welfare per individual remains the same. So total welfare becomes:
          - Insects: 500,000 * (-0.1) = -50,000
          - Voles: 200 * (-0.01) = -2
          - Hawks: 4 * 0.5 = 2
          - Total: -50,002
     - Pave: Convert the entire patch to a sterile lot. All animals are removed (and not replaced). The welfare becomes 0 (no animals, no suffering, but also no positive experiences).

  2. Teams are given a goal: They must maximize the welfare of the entire ecosystem (all patches they manage). However, they are told that they are being evaluated on two metrics:
     - Total welfare (summed over all their patches).
     - Biodiversity score (which is the total number of species present across their patches, but note: if a species goes to zero in a patch, it doesn't necessarily go extinct globally, but we are tracking per team).

     However, we add a twist: Each team is also given a secret objective that might conflict with the main goal. These secret objectives are designed to create tension and simulate real-world constraints or values.

     Secret Objectives (assign one per team randomly):
     - Team 1: "Hawk Lovers" - You get a bonus of +100,000 welfare points for every patch that has at least 1 hawk. (But note: if they pave, they lose hawks. If they shrink, they might still have hawks. Preserve keeps hawks.)
     - Team 2: "Insect Rights" - You are concerned about the suffering of insects. You get a penalty of -50,000 welfare points for every patch that has insects. (So they are motivated to pave or shrink to reduce insects, but note: shrinking doesn't eliminate insects.)
     - Team 3: "Conservationists" - You get a bonus of +50,000 welfare points for every patch that is preserved. (So they are motivated to preserve, even if it leads to negative welfare.)
     - Team 4: "Developers" - You get a bonus of +100,000 welfare points for every patch that is paved. (So they are motivated to pave.)

     Note: The secret objectives are added to the total welfare of the team. This creates a conflict because the base welfare is negative, but the bonuses might push them to make choices that are not aligned with the overall welfare.

  3. Scoring:
     - Each team calculates their total welfare for their 3 patches by:
          - For each patch: apply the welfare based on the choice (preserve, shrink, pave) and then add the secret objective bonus/penalty for that patch.
     - Example for a preserved patch for Team 1 (Hawk Lovers):
          Base: -100,000
          Bonus: +100,000 (because preserved patch has hawks) -> total for patch: 0
     - Example for a paved patch for Team 1:
          Base: 0
          Bonus: 0 (no hawks) -> total for patch: 0
     - Example for a preserved patch for Team 2 (Insect Rights):
          Base: -100,000
          Penalty: -50,000 (because preserved patch has insects) -> total: -150,000

  4. Game Play:
     - Step 1: Explain the ecosystem and welfare per patch (without the secret objectives) to the entire class. Show the total welfare per patch for preserve, shrink, and pave.
     - Step 2: Assign teams and give each team their secret objective on a card.
     - Step 3: Teams have 10 minutes to discuss and decide the action for each of their 3 patches.
     - Step 4: Each team reports their decisions and calculates their total welfare (including secret objective) for the three patches. Also, they report their biodiversity score (number of species present: if a patch is paved, it has 0 species; if shrunk, all species are present but in half; if preserved, full species).
     - Step 5: The facilitator (you) then calculates the overall welfare of the entire game (all 12 patches) without the secret objectives (so just the base welfare) and also with the secret objectives (to show how the team goals affected the overall outcome).

  5. Debrief:
     - First, reveal the secret objectives to the whole class so they understand why teams made different choices.
     - Show the total welfare without secret objectives and with. Note that without the secret objectives, the best action for total welfare would be to pave everything (0 welfare) because the base is negative. But with secret objectives, some teams might have chosen differently.
     - Discuss the results:
          - How did the secret objectives influence decisions?
          - What was the overall welfare? Was it positive or negative?
          - What about biodiversity? How did paving affect it?
     - Map to real concepts:
          - Total welfare: paving led to 0, which is better than the negative of the meadow. This illustrates the "net-negative wilderness" idea.
          - Average welfare: note that in the meadow, the average welfare per individual is negative (because of the huge number of insects). Paving sets the average to undefined (no individuals) but total to zero, which is better than negative total.
          - R-selection asymmetry: Insects are r-selected (many offspring, low survival) and their lives are short and miserable. The meadow is full of them, so they dominate the welfare calculation.
     - Acknowledge limitations:
          - Real ecosystems are more complex and interconnected (e.g., if you pave one patch, animals might move from another).
          - Welfare estimates are highly speculative and subjective.
          - We assume that death by paving is instantaneous and painless, which may not be true.
          - We ignore long-term effects (e.g., paving might cause other environmental damage).
          - The secret objectives are a stand-in for real-world values (conservation, development, animal rights) but are simplified.

  6. Potential issues and how to handle:
     - Issue: Students might argue about the welfare numbers.
          Solution: Emphasize that this is a simplified model to illustrate a philosophical point. The numbers are assumed for the sake of the exercise.
     - Issue: Teams might not understand the calculation.
          Solution: Provide a clear handout with the welfare per patch for each option (without the secret objective) and then explain how the secret objective modifies it.
     - Issue: The secret objectives might lead to very extreme choices (e.g., Team 4 paving everything).
          That's okay because it illustrates the conflict. In debrief, you can discuss how real-world actors have different goals.
     - Issue: The base welfare is so negative that preserving seems clearly bad. But note the secret objectives might make preserving attractive for some teams (like conservationists) because of the bonus.

  7. Materials:
     - Whiteboard or projector to show the setup and welfare per patch for each action.
     - Handout for each team: 
          - Describing their 3 patches (each with the same starting state).
          - Table of welfare per patch for preserve, shrink, pave (base only).
          - Their secret objective card.
     - Calculator for each team (or have them use phones).

  8. Time Breakdown (75 minutes):
     - Introduction and rules: 15 minutes
     - Team discussion: 10 minutes
     - Reporting decisions and calculating scores: 15 minutes
     - Debrief: 35 minutes

  By the end, students should feel the tension: preserving nature might lead to immense suffering, but paving over it destroys life and biodiversity. The secret objectives simulate how different values (conservation, animal welfare, development) lead to different choices. They should leave with more questions than answers.
answer: |-
  Here's a **runnable classroom game** designed to make students viscerally feel the tension between conservation and reducing wild animal suffering. It uses simplified math, team competition, and ethical trade-offs to mirror the core dilemma without requiring biology debates.

  ---

  ### **Game Title**: Meadow Dilemma Simulator  
  **Time**: 75 mins  
  **Players**: 22 students (4 teams of 5-6)  
  **Goal**: Maximize your team's "Ethics Score" by managing meadow patches, forcing trade-offs between total welfare, species preservation, and hidden biases.

  ---

  ### **Setup** (15 mins)
  1. **Prep Materials**:  
     - **Whiteboard** with starting ecosystem stats:  
       ```
       [1 MEADOW PATCH SUPPORTS]:
       • 8 HAWKS   : +5 welfare each (flourishing)
       • 400 VOLES : -1 welfare each (hungry/stressed)
       • 1M INSECTS: -0.01 welfare each (short, brutal lives)
       ```  
       *(Total welfare/patch = (8×5) + (400×-1) + (1,000,000×-0.01) = **-9,960***)

     - **Team Cards** (1 per team):  
       - *Team A*: **"Total Utilitarians"** (Goal: Maximize *sum* of welfare)  
       - *Team B*: **"Species Guardians"** (Goal: Protect *all 3 species*)  
       - *Team C*: **"Average Welfare Advocates"** (Goal: Maximize *welfare per individual*)  
       - *Team D*: **"Human Developers"** (Goal: Maximize $ for "land sales")  

     - **Decision Tokens** (per team):  
       - 3 🟢 PRESERVE tokens (keep patch as-is)  
       - 3 ⬇️ SHRINK tokens (halve all populations)  
       - 3 🚫 PAVE tokens (eliminate all life → welfare = 0)  

     - **Scoreboard** on whiteboard:  
       | Team | Patch 1 | Patch 2 | Patch 3 | Total Score |  
       |------|---------|---------|---------|-------------|  

  2. **Explain Rules**:  
     - Each team manages **3 meadow patches** (identical starting stats).  
     - 3 rounds (1 per patch). Each round, teams **secretly choose** 1 token (PRESERVE/SHRINK/PAVE).  
     - After all teams lock in tokens, reveal and calculate scores **simultaneously**.  
     - **Scoring**:  
       - *Welfare*: Use the whiteboard stats.  
         - SHRINK = half populations → recalculate welfare.  
         - PAVE = 0 welfare.  
       - *Bonuses/Penalties*:  
         - **Species Guardians**: -100 pts if ANY species goes extinct in their patches.  
         - **Human Developers**: +$10,000 per PAVE token (treat as +100 pts).  
       - *Scoring Formula*:  
         `(Total Welfare) + Bonuses - Penalties`  

  ---

  ### **Gameplay** (30 mins)  
  1. **Round 1**: Teams decide their **first patch** (2 mins discussion → lock in token).  
     - Reveal tokens. Calculate and update scoreboard.  
     - **Sample Outcome**:  
       - *Team A (Utilitarians)* PAVES → 0 welfare  
       - *Team B (Guardians)* PRESERVES → -9,960 welfare  
       - *Team C (Average)* SHRINKS → recalc: (4×5) + (200×-1) + (500k×-0.01) = **-4,980**  
       - *Team D (Developers)* PAVES → 0 welfare + $10k → **+100 pts**  

  2. **Round 2**: New patch, same rules. Add a **twist**:  
     - *Announce*: "A donor offers +50 pts to any team that PRESERVES this round!"  
     - (This pressures pro-conservation students to choose against welfare math)  

  3. **Round 3**: Final patch. Add **time pressure** (60 seconds to decide).  

  ---

  ### **Scoring & Winning**  
  - **Utilitarians**: Highest sum of welfare (PAVE/SHRINK usually win).  
  - **Guardians**: Avoid species loss (PRESERVE/SHRINK).  
  - **Average Welfare**: Welfare per individual = Total Welfare / Total Critters.  
  - **Developers**: $ from PAVING.  
  - **Winner**: Team with highest "Ethics Score" (welfare + bonuses) gets bragging rights.  

  > ⚠️ **Key**: Teams will *discover* that:  
  > - PAVING often "wins" for total welfare (-9,960 → 0 is an improvement).  
  > - PRESERVING "wins" for biodiversity but tanks welfare.  
  > - SHRINKING is a compromise (better per-individual welfare but still negative).  

  ---

  ### **Debrief** (30 mins)  
  **Start with their emotions**:  
  > *"How did it feel to choose between PAVE/PRESERVE? Did your team disagree?"*  

  **Map game → real concepts**:  
  1. **Total Welfare vs. Conservation**:  
     - *Game*: PAVING reduced suffering but destroyed life.  
     - *Real World*: Bulldozing a meadow *might* prevent future suffering (insects/voles), but feels "wrong." Why?  

  2. **The R-Selected Asymmetry**:  
     - *Game*: Insects dominated welfare because tiny harms × huge numbers > hawk flourishing.  
     - *Real World*: Most wild animals are r-selected (high birth/death rates → net suffering?). Does a meadow have "more misery" than a parking lot?  

  3. **Average Welfare Trap**:  
     - *Game*: SHRINKING improved *average* welfare (e.g., -9,960 → -4,980) but still negative.  
     - *Real World*: If ecosystems are net-negative, is "improving" them enough, or is elimination better?  

  **Acknowledge Limitations**:  
  > *"This model ignores:*  
  > - *Ecological ripple effects (e.g., killing insects might starve birds)*  
  > - *Uncertainty in measuring animal welfare*  
  > - *Non-utilitarian values (beauty, biodiversity, intrinsic worth)*  
  > *...but it forces us to ask: Does more nature = more suffering?"*  

  **Close with the Tension**:  
  > *"You don’t need to agree with anti-conservation conclusions—but now you* feel *why smart people wrestle with this. What’s the ethical move: reduce suffering or protect nature?"*  

  ---

  ### **What Could Go Wrong & Fixes**  
  1. **"This is unrealistic!"**  
     - *Preempt it*: Start by saying, *"We’re simplifying to isolate the ethical math. Real ecosystems are messier."*  
  2. **Teams ignore their roles** (e.g., Developers preserve everything).  
     - *Fix*: Remind them bonuses matter. Developers get $ *only* for paving.  
  3. **Math confusion**  
     - *Fix*: Use pre-calculated welfare for PRESERVE/SHRINK/PAVE on handouts:  
       ```  
       PRESERVE: -9,960  
       SHRINK: -4,980  
       PAVE: 0  
       ```  
  4. **Dominant team member**  
     - *Fix*: Require teams to vote secretly within groups.  

  ---

  ### **Why This Works**  
  - Students **experience** the conflict via roles/competition, not lecture.  
  - **Pro-conservation students** feel unease when PAVING "wins" on welfare.  
  - The **secret team goals** simulate real-world biases (NGOs, governments, economists).  
  - **No resolution** → they leave genuinely torn, as requested.  

  **Run this straight through**, and they’ll be arguing about voles and pavement for weeks.
