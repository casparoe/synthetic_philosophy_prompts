  The common knowledge requirements are even more absurd. Real agents don't have infinite recursion capabilities to model each other's beliefs perfectly. In distributed systems, communication costs and latency make exchanging full posteriors impractical. Plus, modern ML models (especially black-box NNs) can't even articulate their own posteriors coherently. 

