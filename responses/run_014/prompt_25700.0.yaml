prompt: |-
  I keep noticing a pattern in how people's contributions to discussions get treated, and I'm wondering if there's a name for it in philosophy. It goes like this: someone from a marginalized group describes an experience — say, a woman describing a sexist interaction at work. People accept the description: yes, that happened, we believe you. But then when she offers an analysis of what it means — why it happened, what it says about the workplace culture, what should be done — suddenly she's "too close to it" to be objective, and her analysis is treated as speculative or biased. Meanwhile, someone with no direct experience of the thing offers an analysis, and that's taken seriously as "having perspective" or "being able to see the big picture."

  I've seen versions of this with disabled people describing accessibility problems (their descriptions are accepted, their proposed solutions are dismissed as not understanding the constraints), with people of color describing racist incidents (the incident is accepted, the claim that it's systemic is treated as overreach), and with patients describing symptoms to doctors (the symptoms are recorded, the patient's theory about what's wrong is ignored).

  It's not quite testimonial injustice, because the testimony about the bare facts is believed. And it's not quite hermeneutical injustice, because the person has the concepts and is offering an interpretation — it's just being dismissed. It's like a division of epistemic labor where one group gets assigned the role of data provider and another group gets to be the theorist. Does this have a name? If not, what's the best way to characterize it and how does it relate to the standard categories of epistemic injustice?
reasoning: |-
  Okay, I need to tackle this user's query about a pattern they've noticed in discussions. They're describing a situation where marginalized individuals share their experiences and those facts are accepted, but when they try to analyze or interpret those experiences, their insights are dismissed as biased. Meanwhile, outsiders' analyses are taken seriously. The user wants to know if there's a philosophical term for this and how it relates to epistemic injustice.

  First, I recall the concepts of epistemic injustice. Miranda Fricker's work comes to mind. Testimonial injustice is about credibility deficits due to prejudice, but here the facts are believed, so it doesn't fit perfectly. Hermeneutical injustice involves lacking the concepts to understand one's experiences, but the user says the person has the concepts—they're just ignored. So neither term fully captures this phenomenon.

  The user mentions it's like a division of epistemic labor. That makes me think of standpoint theory. Sandra Harding and others talk about how marginalized groups have unique insights due to their position. But here, those insights are dismissed. So maybe it's about epistemic exploitation or epistemic appropriation. Epistemic exploitation is when marginalized people are expected to educate others, but their deeper analyses aren't valued. Appropriation is when their ideas are taken without credit. Both seem relevant here.

  Also, there's the concept of epistemic privilege—outsiders being seen as more objective. This ties into the idea of the "view from nowhere." Outsiders are assumed unbiased while insiders are "too close." But standpoint theory argues that marginalized perspectives can offer more objective insights. The user's scenario flips that, privileging outsiders.

  Another angle is epistemic paternalism. Doctors dismissing patients' self-diagnoses is a classic example. The professional assumes they know better, ignoring the patient's lived experience. This connects to credentialism, where only certain credentials are trusted.

  I should also consider the user's deeper needs. They might be seeking validation of their observation and tools to articulate it. They could be experiencing this personally or aiming to advocate in discussions. Providing terms helps them label the issue, which empowers them to address it.

  Putting it all together, the core issue is the selective acceptance of marginalized voices: facts are taken, but interpretations are dismissed. This fits under epistemic injustice but needs a specific framing. Terms like epistemic appropriation, hermenutical marginalization, and epistemic exploitation are useful. Highlighting the relationship to standpoint theory and epistemic privilege clarifies why this is unjust. The user might benefit from knowing how to counter this in discussions, using these concepts to challenge the dismissal of insider analyses.
answer: |-
  You've identified a crucial and pervasive pattern of epistemic injustice that sits at the intersection of several concepts. While there isn't a single universally agreed-upon term *yet*, it's actively discussed and analyzed within philosophy, critical theory, and social epistemology. Here's a breakdown of how to characterize it and its relation to standard categories:

  1.  **Core Characterization:** This is a pattern of **Selective Epistemic Credibility Granting and Epistemic Appropriation**.
      *   **Selective Credibility:** Marginalized individuals are granted credibility *only* for the "raw data" of their experience (the *what happened*), but denied credibility for the interpretation, analysis, meaning, or solution derived *from* that experience (the *why it matters, what it means, what should be done*).
      *   **Epistemic Appropriation:** The marginalized person's experience is treated as mere "data points" to be handed over to others (often those occupying positions of structural privilege or institutional authority) who are then deemed the legitimate interpreters and analysts. The marginalized person's own hermeneutical labor is devalued or erased.

  2.  **Why Standard Categories Don't Quite Fit (But Are Related):**
      *   **Testimonial Injustice (Fricker):** As you noted, this involves a credibility deficit *based on prejudice*. Your scenario involves a *partial* testimonial injustice. Credibility *is* granted for the factual description, but *withheld* for the interpretation/solution. The prejudice manifests in the assumption that lived experience inherently clouds judgment for analysis, while distance grants objectivity. It's a *subset* or *specific form* of testimonial injustice focused on the interpretive dimension.
      *   **Hermeneutical Injustice (Fricker):** This involves lacking the shared conceptual resources to make sense of your experience. Here, the marginalized person *does* possess and articulate the concepts and interpretation. The injustice lies in the *dismissal* and *devaluation* of that interpretation by the dominant group, who control the accepted hermeneutical framework. It's less about lacking the tools and more about the tools being rejected because of *who* wields them. Some call this **Hermeneutical Marginalization** or **Hermeneutical Disregard**.
      *   **Epistemic Exploitation (Berenstain):** This concept is highly relevant. Nora Berenstain defines it as: "the phenomenon whereby privileged persons compel marginalized persons to educate them... [and] the epistemic resources that the marginalized person produces are then used... without crediting the labor that produced them." Your pattern is a form of epistemic exploitation where the marginalized person is expected to provide the "data" (their painful experience), but their analysis/solution is appropriated or dismissed, while privileged individuals use that data for their own theorizing without acknowledging the source's interpretive work.

  3.  **Key Concepts and Useful Frameworks:**
      *   **Epistemic Privilege/Objectivity Myth:** This pattern relies on the flawed assumption that distance from an experience grants superior objectivity ("the view from nowhere"), while closeness inherently creates bias. Standpoint epistemology (Harding, Hartsock, Collins) powerfully argues the *opposite*: that marginalized standpoints can offer *more* objective and critical insights into social structures precisely *because* of their lived experience and need to understand the dominant system to survive within it. Dismissing their analysis upholds the myth of privileged objectivity.
      *   **Epistemic Appropriation:** This occurs when the ideas, interpretations, or solutions generated by marginalized thinkers are ignored or dismissed when *they* present them, but later adopted, repackaged, and credited to others (often privileged individuals) who are then seen as insightful. Your scenario is the first step: dismissal paving the way for potential appropriation.
      *   **Epistemic Paternalism:** This involves overriding someone's judgment about their own situation or knowledge for their supposed "own good." Dismissing a patient's self-diagnosis or a marginalized person's analysis of their oppression often carries this paternalistic tone: "They don't *really* understand the bigger picture/system/constraints like we (the privileged/experts) do."
      *   **Credentialism/Positional Epistemic Authority:** Authority to interpret is often granted based on institutional credentials (academic degrees, professional titles) or social position (being part of the dominant group) rather than the relevant lived experience or demonstrable insight. The doctor, the manager, the academic theorist without lived experience is granted interpretive authority over the patient, the employee, the person experiencing racism.

  4.  **Potential Labels & How to Frame It:**
      *   **Interpretive Credibility Deficit:** Highlights the specific lack of credibility granted to the interpretive part of testimony.
      *   **Hermeneutical Disregard:** Emphasizes the dismissal of the marginalized person's act of meaning-making.
      *   **Epistemic Extraction/Data Mining:** Focuses on the taking of the experience as raw data while discarding the source's analysis.
      *   **Theorist/Data Provider Divide:** Directly names the artificial separation of epistemic roles you identified.
      *   **A Specific Form of Testimonial Injustice:** Focusing on the prejudice against the *interpretive capacity* of marginalized speakers.
      *   **A Specific Form of Epistemic Exploitation:** Focusing on the compulsory provision of experience-data without recognition of interpretive labor.

  **Conclusion and Relation to Standard Categories:**

  The pattern you describe is best understood as a **complex hybrid injustice** that draws from and combines elements of:

  *   **Testimonial Injustice:** (Specifically, a credibility deficit applied to interpretive statements based on prejudicial assumptions about bias).
  *   **Hermeneutical Injustice/Marginalization:** (The devaluation and dismissal of the marginalized person's *act* of interpretation within the social hermeneutical landscape).
  *   **Epistemic Exploitation:** (The expectation to provide the raw material of experience without recognition or acceptance of the analysis/solutions derived from it).
  *   **The Critique of Privileged Objectivity:** (Challenging the flawed assumption that distance grants superior analytical insight).

  It exposes how systems of privilege maintain control not only over who is believed about facts but crucially over *who gets to define what those facts mean and what should be done about them*. It's a mechanism for preserving the epistemic authority of dominant groups while superficially appearing to acknowledge marginalized experiences.

  When discussing this, **"interpretive credibility deficit"** or **"hermeneutical disregard"** paired with **"epistemic appropriation/exploitation"** are likely the most precise and philosophically grounded ways to characterize it. Framing it as a **specific form of testimonial injustice focused on analysis** or **a manifestation of epistemic exploitation** also effectively connects it to the established literature on epistemic injustice. Your description of the "theorist/data provider divide" is also an excellent and clear way to encapsulate the core dynamic.
