  First, I need to understand the context deeply. The city already had a three-year pilot scheme with licensing, health exams, and safety requirements. The inspection reports show high compliance and no substantiated coercion or trafficking in licensed venues. However, outreach workers note that the unlicensed sector is harder to monitor. The public consultation revealed a sharp divide: a moral majority disapproves of paid sex itself, citing community cohesion, while workers, health officials, and some residents emphasize autonomy, safety under licensing, and no direct harm to third parties. The police are neutral but warn about high enforcement costs and displacement effects if criminalized.

