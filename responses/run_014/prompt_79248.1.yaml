prompt: |-
  Hi — I'm a third-year philosophy PhD, my area is formal epistemology / Bayesian confirmation, and I've got a question that's been bugging me at the seams of my work.

  Quick setup so we're on the same page (I'd rather state it than assume you've got it loaded): the "old evidence" problem is roughly this — if you already know E, your credence in E is 1, and conditionalizing on E leaves everything where it was, so a fact you already knew can never confirm a hypothesis H, no matter how well H predicts E and how badly H's rivals do. That feels wrong, since a lot of good science looks like a theory explaining some anomaly everyone already knew about. There are fixes floating around (update on the newly-noticed entailment from H to E rather than on E itself; or ask what your credence in H would have been had you not already known E), but that's not really what I want to ask about.

  Put on your philosopher-of-science hat. Here's the practice I want you to interrogate. In stats/ML there's an iron rule: you never evaluate a model on data it was trained on — you hold out a test set, and a pattern that only shows up in data the model already saw doesn't count as a real discovery. The same norm runs through empirical science: preregistration, the demand that a hypothesis make a novel prediction, reviewers who get suspicious when the data were already sitting in the drawer when the hypothesis was dreamt up. Call it the novelty norm: evidence only confirms a hypothesis if the evidence is new — held out, or not already known at the time the hypothesis was fixed.

  What I want: treat the novelty norm as the object of study, and reconstruct the theory of confirmation it presupposes. Specifically —

  (a) Does the practice strictly need that theory, or is it merely compatible with it? I can see at least two very seperate stories: one is the Bayesian probability-1 point (known evidence literally can't move credences); the other is that a hypothesis fitted to data is chosen post hoc, so the "confirmation" is a selection artifact rather than a probability fact. Those strike me as different diagnoses with different consequences. Which one does the practice actually commit you to, and could it get by on some third story instead?

  (b) I suspect the norm quietly runs together three senses of "old" — old to the individual agent, old to the hypothesis (it was formulated with an eye on the evidence), and old to the relevant community. Do these come apart in cases that matter? Does the practice's implicit theory need them to line up, or does it fall apart where they split?

  (c) Suppose we adopt one of the Bayesian fixes so old evidence can confirm. Does the novelty norm collapse, or survive in modified form — and if it survives, what is it now tracking, if not confirmation?

  Don't hand me a menu and let me pick. I want your verdict: which theory the norm presupposes, whether that theory is defensible, and where you think I've got it wrong. Take your time — start by brainstorming what "confirmation" would have to mean for the novelty norm to be more than a useful heuristic, then commit. If you think the norm is philosophically confused, just say so and defend it. Flag anything you're unsure about, and tell me if I've misstated the old evidence problem itself. No citations needed — I'm not asking for a reading list.
reasoning: |-
  Okay, let's tackle this philosophy PhD candidate's question about the novelty norm in scientific confirmation. They're deep into formal epistemology and Bayesian confirmation theory, so I need to meet them at their level while dissecting this practice-driven puzzle.

  First, the core tension they're highlighting is fascinating: the "old evidence problem" in Bayesianism says known evidence can't change credences (since P(E)=1), yet scientific practice demands novelty for confirmation. The user wants me to reverse-engineer the philosophical commitments behind this practice norm. 

  Hmm, let's unpack their three sub-questions systematically. For (a), they're right that there are two distinct justifications floating around: the strict Bayesian probability-1 argument versus the methodological worry about post-hoc fitting. I think the practice implicitly leans harder on the latter. When researchers insist on preregistration or holdout data, they're not usually thinking about probability axioms—they're trying to prevent themselves from cheating by overfitting. That's a pragmatic concern about inference reliability, not a theorem of probability theory. 

  But is that the whole story? I recall that Gelman and Shalizi have written about how all models are post-hoc to some extent—science is inherently exploratory. Yet the novelty norm persists. This suggests the practice isn't purely about avoiding logical incoherence (Bayesian credence updates) but about enforcing a epistemological hygiene standard. 

  Moving to (b): the user's suspicion about conflated "oldness" concepts feels spot-on. Consider a thought experiment: Dr. Chen formulates hypothesis H after seeing dataset D1, but keeps it secret. Later, Dr. Singh independently discovers D1 and proposes H. When Dr. Chen reveals their prior work, does D1 confirm H for the community? The norm would still discount it—suggesting "old to community" matters more than individual knowledge. But if confirmation is about individual credences (as per strict Bayesianism), this seems inconsistent. The practice seems to presuppose a more social epistemology where "known" means public knowledge.

  For (c), if we adopt a Bayesian fix like Garber's entailment solution (updating on H⊨E rather than E itself), does novelty still matter? Surprisingly yes—because the overfitting risk remains. Even if your credence in H moves when you realize it predicts known evidence, that update might still be "cheap" if H was reverse-engineered from E. So the norm survives but shifts from confirming evidence to protecting inference integrity.

  *Pausing to check if I'm being consistent*... Earlier I said the practice prioritizes methodology over probability theory, but here I'm saying both concerns coexist. Actually that's coherent: the novelty norm serves dual purposes—preventing Bayesian incoherence (when P(E)=1) and preventing methodological artifacts. The latter justification is more robust across different confirmation theories.

  Where does this leave us? My verdict:
  - The norm presupposes a hybrid theory: partly Bayesian (avoiding probability-1 stagnation), but more deeply rooted in error-statistical philosophy (à la Mayo) where confirmation requires severe testing.
  - It's defensible not because of probability axioms, but because it mitigates human inference biases in hypothesis generation.
  - The user might be underestimating how deeply the "old to community" aspect is baked in—this isn't just about individual rationality but scientific communalism.

  *Final gut check*: Am I being too dismissive of the Bayesian angle? After all, if we fully solved the old evidence problem via logical learning, wouldn't novelty become redundant? But no—because even then, a hypothesis designed to fit existing data hasn't proven predictive power. The core insight is that confirmation requires risk: H must stick its neck out. That's what novelty enforces, regardless of your probability kinematics.

  Right, time to structure this into a tight response. The user asked for commitment, not caveats—so I'll lead with the hybrid theory claim and defend it against alternatives.
answer: |-
  You're pressing on a foundational tension where statistical practice and confirmation theory grind against each other. The novelty norm *is* philosophically loaded, and I'll argue it commits to a hybrid error-statistical/structural account of confirmation—not pure Bayesianism—and survives even if we "fix" the old evidence problem. Let's dissect it.

  ### (a) The Core Justification: Selection Artifact Trumps Probability-1  
  The novelty norm **does not strictly need** the Bayesian probability-1 argument. While that problem *motivates* philosophers, practitioners care about **inferential integrity**. The driving force is avoiding *ad hoc* hypothesis tuning. When a model or theory is retrofitted to data, its apparent fit is epistemically hollow—it hasn't risked falsification. This is a **severity requirement** (Mayo 1996) masquerading as a novelty rule.  

  - **Probability-1 is insufficient**: Even if we resolve the old evidence problem (e.g., via Garber's entailment solution), practitioners would still demand novel testing. Why? Because learning that *H* entails *E* (when *E* is known) is computationally trivial if *H* was constructed *post hoc* to entail *E*. The "confirmation" is an artifact of the hypothesis-generation process.  
  - **Selection artifact is necessary**: The norm targets **researcher degrees of freedom**. Preregistration, holdout data, and novel predictions constrain the hypothesis space *before* data inspection. This prevents *H* from being a product of overfitting or cherry-picking. The Bayesian probability-1 problem is a symptom, not the disease.  

  **Verdict**: The practice presupposes an **error-statistical theory of confirmation** (à la Deborah Mayo). Confirmation requires that *H* passes a test with high severity—i.e., it would probably not have passed if false. Novelty ensures the test isn't circular or self-serving.  

  ### (b) "Oldness" Trilemma: Community Trumps Agent  
  Your three senses of "old" **come apart critically**, and the norm prioritizes **community-temporal novelty** over individual or hypothetical novelty. Consider:  

  1. **Old to agent**: You privately know *E*, but the community doesn't. You publish *H* predicting *E*. The norm rejects this as non-novel—*even for you*.  
  2. **Old to hypothesis**: *H* was formulated knowing *E*, but *E* is new to the community. The norm still discounts it (e.g., "HARKing" criticism).  
  3. **Old to community**: *E* is public knowledge pre-dating *H*. Here the norm is strictest.  

  **Crucial case**: Suppose *H* is proposed *without* access to *E* (e.g., due to data partitioning), but *E* was technically "known" to others. The norm relaxes—it cares whether *the formulator* had access. This exposes a **methodological individualism**: novelty is judged relative to the epistemic state of the hypothesis *originator* at the time of *H*'s fixation. Yet the *enforcement* of the norm (e.g., peer review) relies on community awareness.  

  **Verdict**: The norm requires **alignment between formulator ignorance and community novelty**. If *H*'s author knew *E* or could have tuned *H* to *E*, confirmation is void—even if *E* is "new" to others. The theory presupposes that confirmation requires **authentic prediction**, not just entailment.  

  ### (c) The Norm Survives Bayesian Fixes—But Shifts Ground  
  Adopt Garber's solution: update on the discovery that *H* ⊢ *E*, not on *E* itself. Now old evidence *can* confirm. **Yet the novelty norm persists**. Why? Because its primary goal isn't to resolve credence updates—it's to block **confirmation laundering**.  

  - **What it now tracks**: **Inferential robustness**. Fitting *H* to existing *E* makes the entailment unsurprising; testing on novel *E* ensures *H* captures stable patterns. In ML terms: holdout data estimates *generalization error*, not likelihood.  
  - **Modified form**: Novelty becomes a **proxy for test severity**. We allow "old" evidence to confirm *if* it wasn't used to specify *H*'s parameters (e.g., using pre-registered analyses on existing data). The norm evolves into: **no double-counting of evidence for model specification and testing**.  

  **Example**: Kepler's laws confirming Newtonian mechanics. *Even if* Newton knew Kepler's data, the *derivation* of ellipses from inverse-square gravity was a severe test—it wasn't curve-fitting but showing Kepler's patterns *must* hold under *F=GMm/r²*. Novelty here is about the *direction of implication*, not temporal newness.  

  ### My Verdict  
  - **Presupposed theory**: The novelty norm assumes a **severity-focused confirmation theory** where:  
    - Confirmation requires *risky predictions* (Popperian influence).  
    - "Old evidence" isn't the problem—*opportunistic hypothesis selection* is.  
    - Bayesian updates are insufficient; we need **procedural safeguards** against noise mining.  
  - **Defensibility**: This is **largely defensible** but needs refinement. The norm is heuristic for a deeper epistemic principle: **lateral constraints on hypothesis space** (to avoid overfitting the hypothesis-generating process itself). It’s not that old evidence *can’t* confirm—it’s that *undisciplined use* of old evidence corrupts inference.  
  - **Where you might misstep**: You’re underweighting **researcher degrees of freedom** as the core issue. The old evidence problem is a Bayesian framing of a wider inferential hazard. Bayesian fixes address credence dynamics but not the *generative* problem of *H* being cooked to fit *E*.  

  **Final take**: The novelty norm is philosophically coherent *only* if we see science as a process of constraining *both* data and hypothesis formation to force severe tests. It’s not about temporal sequence—it’s about *logical and procedural independence*. Drop the "novelty" label; call it the **no-peeking principle**.  

  If you disagree, I’m ready to go another round—this is meaty stuff. Where’s your intuition pushing back?
