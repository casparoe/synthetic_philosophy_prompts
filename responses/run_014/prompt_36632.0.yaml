answer: |-
  Here is a distilled set of adequacy criteria for an account of realization, designed to anchor your seminar unit. Each criterion is grounded in the core functionalist motivations and potential pitfalls you outlined, with the motivating case or consideration specified.

  ---

  ### **Standard of Adequacy for Realization: Core Requirements**

  1.  **Handle Asymmetrical Cross-Classification:**
      *   **Requirement:** The account must accommodate both (a) *Multiple Realizability*: A single higher-level property-type (e.g., `pain`) being realized by distinct, heterogeneous lower-level property-types (e.g., neural configurations in humans, octopi, AIs). (b) *Multiple Realization*: A single lower-level property-token (or type) realizing multiple distinct higher-level property-tokens (or types) simultaneously (e.g., a specific neural state token realizing `pain`, `a representation of tissue damage`, and `a desire for relief`).
      *   **Motivating Case:** To block type-identification of higher-level properties with lower-level properties and uphold the autonomy of special sciences. Failure collapses realization into identity or makes higher-level properties inexplicably sparse.

  2.  **Respect Causal Inheritance Without Collapse:**
      *   **Requirement:** The account must explain how the causal powers of a realized property instance are *determined by* or *dependent upon* the causal powers of its realizer instance(s), ensuring the realized property is not epiphenomenal. Crucially, it must do this *without* implying that the realized property *is identical to* its realizer, thereby preserving its distinctness and the autonomy it was meant to secure.
      *   **Motivating Case:** To avoid epiphenomenalism (violating causal efficacy) on one side and reductionism/vacuousness (violating autonomy) on the other. The "powers exhaustion" intuition is strong, but letting it dictate identity destroys the relation's purpose.

  3.  **Distinguish Realization from Neighboring Relations:**
      *   **Requirement:** The account must clearly differentiate realization from:
          *   *Causation*: Realization is constitutive, not causal sequence.
          *   *Supervenience*: Realization should explain *why* supervenience holds (the dependency), not merely assert covariance.
          *   *Token Identity*: Realization must allow realized property tokens to be distinct from their realizer tokens (even if co-located).
          *   *Mechanistic/Part-Whole Constitution*: While closely related (especially in sciences), realization is typically seen as a specific *kind* of functional-role-filling constitution; the account should clarify the relationship or distinction.
      *   **Motivating Case:** Conceptual clarity and avoiding fallacies of equivocation. Much confusion and invalid argument in the literature stems from conflating these relations, each with different implications for autonomy, reduction, and causation.

  4.  **Specify the "Size" and "Shape" of Realizers:**
      *   **Requirement:** The account must explicitly state what *kinds* of entities can serve as realizers: only intrinsic properties of individuals? Properties plus relations? Properties of parts? Ensemble/collective properties of systems? It must also clarify the implications of this stance for whether realization is strictly "downward" (only lower-level properties realize higher-level ones) or if same-level or even upward realization is possible.
      *   **Motivating Case:** To address debates about whether macro-properties can be realized by relational/structural properties (e.g., `being a predator` realized by organism-level properties + ecological relations), or by properties of micro-constituents directly, and whether this impacts claims about "levels" and reduction.

  5.  **Clarify Token vs. Type Multiple Realizability (MR):**
      *   **Requirement:** The account must precisely disambiguate claims about:
          *   *Token-MR*: A single higher-level property-token (this instance of pain) could have been realized by a different lower-level property-token (a different neural state).
          *   *Type-MR*: A single higher-level property-type (pain) is actually realized by diverse lower-level property-types across individuals/species/times (human C-fibers, octopus ganglia, silicon circuits).
      *   **Motivating Case:** Preventing talking past each other. Arguments *for* functionalism often rely on Type-MR, while objections about causal efficacy or over-determination often focus on Token-MR. An adequate account must handle both or justify focusing on one.

  ---

  ### **Philosophical Work on the Requirements**

  *   **Genuine Desiderata vs. Potentially Questionable Constraints:**
      *   **Likely Genuine:** Requirements 1 (Cross-Classification), 3 (Distinction from Neighbors), and 5 (Token/Type Disambiguation) seem core to the very *concept* of realization as intended to do the functionalist work. Without them, the relation fails its primary job or becomes ambiguous. Requirement 2 (Causal Inheritance w/o Collapse) is also fundamental, reflecting the non-negotiable need for causal efficacy within a broadly physicalist framework.
      *   **Potentially Contentious:** Requirement 4 (Size/Shape of Realizers) involves substantive metaphysical choices. Insisting realizers *must* be intrinsic properties of individuals stacks the deck against structuralist or externalist views. Demanding realization *must* be strictly downward (lower -> higher) rules out accounts allowing for same-level realization. **The key contentious element is the implicit demand within Requirement 2 for "no emergent powers"** – the idea that realized properties bring *no fundamentally new causal powers* not already present in the realizer's powers. While this is a core tenet of *physicalism* and thus central for *physicalist* functionalism, it *is* a substantive commitment. An account allowing for genuinely novel, strongly emergent powers at higher levels might satisfy other criteria but would be rejected by physicalists. This demand *is* a "physicalist's wish," but it's arguably *essential* for realization to function as the lynchpin of *non-reductive physicalism* – the dominant framework motivating functionalism in the metaphysics of science. An account violating this would likely be seen as abandoning the physicalist project realization was meant to serve.

  *   **Tensions and Potential Incompatibilities:**
      *   The most significant tension is between **Requirement 2 (Causal Inheritance w/o Collapse)** and the **autonomy aspect of Requirement 1**. How can a property be both (a) distinct and autonomous (not identical, supporting special sciences) and (b) have *all* its causal powers exhaustively determined by the powers of its realizer? If the realized property's causal contribution is *nothing over and above* the realizer's contribution, doesn't that make it either identical or epiphenomenal? This is the **Exclusion Problem** looming large. Any adequate account *must* navigate this narrow path, explaining how distinctness and causal efficacy co-exist without over-determination or collapse.
      *   Requirement 4 (Size/Shape) can also create tension with Requirement 1 (Cross-Classification). If realizers are defined very broadly (e.g., including complex relational/ensemble properties), it might make Type-MR less common than functionalists assume, potentially threatening autonomy. Conversely, a very narrow view (only intrinsic micro-properties) might make explaining the realization of clearly relational higher-level properties difficult.

  *   **The Single Most Excluding Requirement:**
      *   **Requirement 1 (Asymmetrical Cross-Classification - especially Multiple Realization)** is likely the most effective filter, excluding the most otherwise plausible accounts.
          *   **Why?** Simple identity theories, type-type reductionism, and straightforward supervenience accounts (without a constitutive dependency story) fail the Multiple Realizability leg. They cannot handle diverse realizers.
          *   More subtly, many initially attractive "flat" functionalist or causal role accounts struggle badly with **Multiple Realization** (one realizer for many realized properties). They often either (a) implausibly deny that a single realizer *can* simultaneously realize multiple distinct properties, (b) collapse the realized properties into each other (violating distinctness), or (c) struggle to individuate the realized properties solely based on the *same* causal role filler. Accounts focusing only on token realization or mechanistic composition often stumble here, failing to capture the functionalist's need for *types* realized multiply *and* multiplicly realized. This requirement exposes accounts that are too coarse-grained or lack the resources to handle the complexity of layered functional organization.

  ---

  This framework provides the critical lens. Students can now evaluate any account by asking: Does it clearly satisfy 1-5? Where does it stumble? How does it navigate the tension between 1 and 2? Does its stance on 4 help or hinder? Does it clarify or obscure 5? The scorecard writes itself against these criteria, revealing the deep challenges in making realization bear the weight functionalism places upon it. Focus your class time on how Requirement 1 (Multiple Realization specifically) trips up many contenders and how Requirement 2 forces accounts onto the horns of the exclusion dilemma.
