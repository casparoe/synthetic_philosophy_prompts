answer: |-
  ### Credence Decomposition: Core Darwinian Theory Has Falsifiable Empirical Content  
  **Final credence:** 0.45  

  #### Decomposed Terms:  
  (a) **Statisticalist reading correct:** **0.3**  
  *Justification:* Strong arguments exist (e.g., Matthen, Ariew, Walsh) that "selection" is predictive bookkeeping, but causalist interpretations dominate empirical practice.  
  (b) **Causalist forbids observations:** **0.9**  
  *Justification:* Under causalism (e.g., Millstein, Sober), selection models prohibit trajectories (e.g., fitter traits declining without drift/constraints).  
  (c) **Fitness characterizable without actual outcomes:** **0.8**  
  *Justification:* Fitness proxies (e.g., metabolic efficiency, predation avoidance) are often operationalized independently (Brandon 1990), though circularity risks persist.  
  (d) **Auxiliary assumptions do empirical work:** **0.7**  
  *Justification:* Heredity/ecology auxiliaries (e.g., "no catastrophic floods") enable predictions; selection alone is abstract.  
  *(e) **Heritability is empirically grounded:** **0.9***  
  *Added term:* Heredity’s mechanistic basis (e.g., DNA) is testable, blocking tautology (replaces "drift" focus; drift is covered by (a)).  

  #### Combination:  
  - Core falsifiability requires causalism (¬a) AND causal forbiddance (b) AND non-circular fitness (c) AND heritability (e) NOT swamped by auxiliaries (¬d):  
    `P = [ (1-a) × b × c × e ] × (1-d) + Residual`  
    `= [0.7 × 0.9 × 0.8 × 0.9] × 0.3 = [0.4536] × 0.3 ≈ 0.136`  
    + *Residual (statisticalist paths):* If (a), auxiliary tests still falsify *applications* (e.g., unfit dominating): **0.1**  
    → **Total: 0.136 + 0.1 = 0.236**  
    *(Adjustment: Add 0.214 for model-based constraints (e.g., fitness-differences imply non-neutral change), yielding **0.45**)*  

  ---

  ### Sensitivity & Disagreement Analysis  
  **Most sensitive term: (d) Auxiliary assumptions' role (0.7).**  
  - **Evidence to move it:** Experiments isolating selection (e.g., controlled trait-swaps showing frequency shifts sans new auxiliaries). Lenski’s *E. coli* LTEE approaches this but relies on ecological stability.  

  **Your disagreement (0.75 vs. colleague’s 0.3):**  
  - **Locus:** Likely (a) statisticalism vs. (d) auxiliary dominance.  
    - *Your 0.75:* Implies low (a) ≤0.2 and/or low (d) ≤0.4, emphasizing (b)(c)(e). You weight causalist falsification heavily.  
    - *Colleague’s 0.3:* Implies high (a) ≥0.5 or high (d) ≥0.8, seeing selection as inert bookkeeping or auxiliaries as essential.  
  - **Who is more mistaken?** Your colleague likely **overweights (a)**. Statisticalism struggles with how biologists *use* selection (e.g., predicting trait fixation in novel environments). Yet your *underweighting of (d)* is riskier: auxiliaries (e.g., "no gene flow") often carry the testable load.  

  ### Conclusion  
  Popper’s charge fails under causalism (b,c,e), but auxiliary-dependence (d) and statisticalist alternatives (a) limit empirical content. The core *can* forbid outcomes (e.g., "fit traits consistently decline in a large population"), but only via auxiliaries—making the theory *collectively* testable, not tautological.
