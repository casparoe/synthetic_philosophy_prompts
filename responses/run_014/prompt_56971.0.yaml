prompt: |-
  I am in my third year of a philosophy of science PhD programme and I am drafting the survey chapter of my prospectus on verisimilitude. I have spent the past three weeks in the technical literature and my notes have become an undifferentiated heap — constituent structures, normalised difference measures over possible worlds, weighted averages of true and false content, and a great many inequalities I can verify but no longer interpret. Before I commit to writing anything, I want to know what I should have been asking of an account of truthlikeness all along. So: write the desiderata. Give me the specification any adequate account of closeness to the truth has to meet, with the purpose fixed as follows. I want an account strong enough to underwrite the scientific realist claim that a successor theory can be nearer the truth than its predecessor even when neither is true, and strong enough to be used comparatively inside an actual dispute about theory choice, rather than one that merely licenses the truism that true theories are better than false ones. One caution about me: I came into philosophy from forecast verification work, so I am instinctively drawn to numerical measures with metric properties, and I would like you to tell me plainly if that instinct is smuggling in a requirement rather than reflecting one.

  For each requirement, give me the case or consideration that motivates it — the concrete verdicts that would come out wrong if the requirement were dropped, not just its statement — and mark it non-negotiable, negotiable, or a preference of a particular research programme that has been promoted to a requirement. Candidates I suspect belong on the list, and that I want you either to justify or to reject: that an account must order falsehoods among themselves; that it must allow a precise falsehood to be closer to the whole truth than a vague or trivial truth; that truthlikeness must come apart from logical probability, so that the aim of inquiry is not the most probable statements; that it must not collapse into empirical adequacy, coherence with the evidence, or mere consistency; that it must say something definite about tautologies and contradictions; that it must behave sensibly under conjunction and disjunction, including the question whether adding a true conjunct to a theory can ever make it less truthlike; that the resulting ordering must be stable when the same subject matter is described in a different but intertranslatable vocabulary or carved up more finely; and that it must be usable from inside inquiry, in the sense that we can sometimes have evidence we are getting closer without already knowing the truth. Add anything important I have omitted, and do not spare any of the above if it turns out to be bogus.

  Then the part I most want: the joint-satisfiability analysis. Tell me which subsets of these requirements cannot all be met at once, and for each clash what exactly breaks and why — I have in mind the classical result that on Popper's own definition no false statement can have positive verisimilitude, and the complaint that constituent- or possible-worlds-based measures deliver different orderings depending on how the language carves up the space. If the list is inconsistent, that is a result and I want it stated as one: identify the single requirement that does the most work in eliminating candidate accounts, and say which requirement a scientific realist should be prepared to abandon, together with what the abandonment costs the claim about progress across theory change. Finish with a paragraph each, no scorecard, on how the three broad families of proposal — the content approach, the consequence approach, and the likeness or similarity approach — fare against the list. Please do not give me a bibliography, a reading list, or citations; I already have the literature, and what I lack is the standard of assessment.
reasoning: |-
  Okay, the user is a third-year PhD student in philosophy of science, focusing on verisimilitude for their prospectus survey chapter. They've been deep in technical literature for weeks and feel overwhelmed by the complexity. Their notes are a jumbled heap of structures, measures, and formulas they can verify but no longer interpret. They need clarity on the core desiderata for an account of truthlikeness before they start writing.

  The key purpose they emphasize is supporting scientific realism: showing how a successor theory can be closer to truth than its predecessor even when both are false. They want this to be applicable in actual theory choice disputes, not just stating the obvious that true theories are better. They also mention coming from a forecast verification background, so they have an instinct for numerical metrics but want to know if that's biasing them.

  They listed several candidate requirements they suspect should be on the list and asked for justification or rejection. These include ordering falsehoods, allowing precise falsehoods to be closer than vague truths, separating truthlikeness from probability, avoiding collapse into empirical adequacy or consistency, handling tautologies/contradictions properly, sensible behavior under logical operations, stability across vocabularies, and usability from inside inquiry.

  I need to structure the desiderata clearly. For each, I'll state the requirement, explain the motivation with concrete cases, and classify it as non-negotiable, negotiable, or program-specific. Then I'll analyze which subsets conflict, focusing on joint satisfiability issues like language dependence and Popper's original flaw. Finally, I'll assess how the three main approaches (content, consequence, likeness) fare against these requirements.

  The user explicitly said not to provide citations or bibliography since they already have the literature—they want evaluation standards. So I'll avoid any references and focus entirely on conceptual analysis. Their background in forecast verification suggests they'll appreciate precise, structured reasoning but might need warnings about metric over-assumptions.

  For the desiderata, I should include what they mentioned plus critical additions they might have missed, like handling partial truths or semantic depth. The conflicts section is crucial—they want to know where theories break and which requirement causes the most trouble. I should highlight the language variance problem as a major joint satisfiability failure and suggest that semantic stability might be the requirement to relax, though it costs something for realism.

  In assessing the three approaches, I'll be honest about their trade-offs without favoring one. The content approach struggles with likeness, consequence with language dependence, and likeness with logical operations. The conclusion should help them see that no approach satisfies everything, so their prospectus will need to position their chosen account by what it sacrifices.

  Throughout, I'll maintain an academic but approachable tone, respecting their expertise while providing the clarity they seek. They're clearly frustrated with the undifferentiated heap of notes, so my response should model the structured thinking they need.
answer: |-
  Here is a distilled list of desiderata for an account of verisimilitude, grounded in your core aim of underwriting scientific realism about progress through false theories and enabling actual comparative judgments. Each requirement is motivated by concrete failures and classified. Conflicts and the assessment of approaches follow.

  ---

  ### **Core Desiderata for Verisimilitude**

  1.  **Non-Trivial Comparability of False Theories (Non-negotiable):**
      *   *Requirement:* Must define a *partial ordering* among false theories (not just "true > false").
      *   *Motivation:* Without this, the core realist claim collapses. If two false theories T1 and T2 are incomparable or equally distant, we cannot say which represents progress (e.g., Newton vs. Descartes on gravity; Phlogiston vs. Preformationism in early chemistry). Accounts that only compare theories to the truth (or only true vs. false) fail here.
      *   *Your Candidate:* "Must order falsehoods among themselves" - **Justified (Core)**.

  2.  **Truth Supremacy (Non-negotiable):**
      *   *Requirement:* The whole truth is more truthlike than any false theory.
      *   *Motivation:* The fundamental aim. If a false theory could be *closer* than the whole truth, the concept loses its normative force for inquiry. Popper's initial definition famously violated this (allowing false theories to be "closer" than truths in some cases).
      *   *Your Candidate:* Implicit in the truism, but needs explicit statement.

  3.  **Value of Truth Content over Falsity Content (Negotiable - but core to most realist accounts):**
      *   *Requirement:* Increasing true consequences (without increasing false ones) should increase verisimilitude. Decreasing false consequences (without decreasing true ones) should increase verisimilitude.
      *   *Motivation:* Captures the intuition that having *more* right and *less* wrong is better. Failure: If adding a true conjunct *decreased* truthlikeness (e.g., T & "The moon is made of green cheese" being *worse* than T alone, even if T is false but otherwise good), the account is counterintuitive. If a theory with vast false content could be highly truthlike, realism struggles.
      *   *Your Candidate:* Covered under "behave sensibly under conjunction". Adding a true conjunct *should not* decrease truthlikeness. **Justified (Core intuition)**. (Precise formulation is tricky).

  4.  **Superiority of Precise Falsehoods over Vague Truths (Non-negotiable for Realism):**
      *   *Requirement:* A precise, informative, but false theory can be closer to the truth than a true but extremely weak or vacuous theory (e.g., a tautology).
      *   *Motivation:* Essential for progress narratives. Einstein's GR (false in some domains) is vastly more truthlike than "Either GR is true or it isn't". If only truth mattered, we'd aim for trivial truths. Failure: Accounts where only truth matters (logical probability maximization) or where content is ignored collapse here.
      *   *Your Candidate:* "Must allow a precise falsehood to be closer... than a vague or trivial truth" - **Justified (Non-negotiable for realism)**.

  5.  **Separation from Logical Probability (Non-negotiable):**
      *   *Requirement:* Truthlikeness must be distinct from, and often inversely related to, logical probability.
      *   *Motivation:* The most probable statements are typically weak and uninformative (tautologies). The aim of science is highly informative, deep truths, not just safety. Failure: If maximizing truthlikeness meant maximizing probability, science would degenerate into stating trivialities. Real progress involves risky, informative, low-probability conjectures.
      *   *Your Candidate:* "Must come apart from logical probability" - **Justified (Non-negotiable)**.

  6.  **Separation from Empirical Adequacy/Coherence (Non-negotiable):**
      *   *Requirement:* Truthlikeness must be distinct from empirical adequacy (fitting all actual data) or mere coherence with current evidence.
      *   *Motivation:* Realism claims we approach *truth*, not just saving phenomena. Two empirically adequate but mutually incompatible theories (e.g., future-converging alternatives) cannot *both* be maximally truthlike. A theory could fit all data by luck or limited scope but be fundamentally wrong (e.g., Ptolemy with enough epicycles *can* be empirically adequate locally). Truthlikeness must capture *why* we think GR is deeper than a curve-fitting exercise, even if both fit the data.
      *   *Your Candidate:* "Must not collapse into empirical adequacy..." - **Justified (Non-negotiable for realism)**.

  7.  **Stability Under Logical Operations (Negotiable - Form/Scope Dependent):**
      *   *Requirement:* The account should handle basic logical operations (conjunction, disjunction) intuitively. Key questions: Can adding a true conjunct *ever* decrease verisimilitude? Can adding a false conjunct *ever* increase it? How does the truthlikeness of A relate to A∨B?
      *   *Motivation:* Theories are complex conjunctions. Adding a true but irrelevant conjunct (e.g., T & "There are 10^23 stars") *shouldn't* make T worse if T was already highly truthlike. Adding a false conjunct *should* make it worse. However, adding a highly *relevant* true conjunct should improve a weak theory. Disjunction dilemmas: "The sky is blue" is more truthlike than "The sky is blue or 2+2=5", which is more truthlike than "2+2=5", but less than the simple truth.
      *   *Your Candidate:* Included. **Justified (Important, but precise constraints negotiable)**. Absolute prohibitions (e.g., "adding true conjunct *never* decreases") may be too strict for nuanced accounts.

  8.  **Value of Contradictions (Non-negotiable):**
      *   *Requirement:* Contradictions must be minimally truthlike (worse than any consistent theory).
      *   *Motivation:* Contradictions entail everything, true and false. They are the epistemic nadir. Any account placing a contradiction above a consistent falsehood is defective. Tautologies should be better than contradictions but worse than informative truths and many falsehoods.
      *   *Your Candidate:* Implied in "say something definite". **Justified (Non-negotiable)**.

  9.  **Language/Conceptual Scheme Invariance (Non-negotiable in principle, Problematic in practice):**
      *   *Requirement:* The verisimilitude ordering of theories should not change merely because the same subject matter is described using a different but intertranslatable vocabulary or a finer/coarser conceptual scheme.
      *   *Motivation:* Truthlikeness should be about the world, not our language. Failure: If switching from a language with predicates {Blue, Green} to one with {Blue, Green, Turquoise} changes whether Newton is closer to truth than Aristotle, the account is language-dependent and unsuitable for objective realism. This is the Achilles' heel of many possible-world and constituent-based approaches.
      *   *Your Candidate:* Included ("stable when... carved up more finely"). **Justified (Non-negotiable ideal, often violated)**.

  10. **Epistemic Accessibility (Negotiable - Degree/Scope):**
      *   *Requirement:* We must sometimes be able to have justified evidence (fallible, non-conclusive) that we are *making progress* (increasing verisimilitude) *without* knowing the full truth.
      *   *Motivation:* Required for the account to guide actual inquiry and theory choice. If we can *only* assess progress *after* knowing the truth, the concept is useless for practicing scientists. Evidence like novel predictive success, unifying power, or solving anomalies should count as indicators. Doesn't require *measuring* verisimilitude, only having grounds for comparative judgments (T2 > T1).
      *   *Your Candidate:* Included ("usable from inside inquiry"). **Justified (Crucial for applicability)**.

  11. **Semantic Depth / Non-Superficiality (Important Addition):**
      *   *Requirement:* Truthlikeness should reflect the *depth* or *centrality* of truths/falsehoods within the theory's structure, not just counting surface consequences. Getting fundamental laws right should matter more than getting peripheral details right (though both matter).
      *   *Motivation:* Without this, a theory that gets many trivial observational truths right but botches core mechanisms could be deemed highly truthlike, undermining the realist intuition about theoretical progress (e.g., a sophisticated phenomenology vs. a deep but slightly flawed atomic theory). Pure consequence-counting accounts fail here.

  ---

  ### **Joint Satisfiability Analysis: The Conflicts**

  The most profound conflict arises between **Language Invariance (9)** and the **Value of Content/Specificity (3, 4, 7)** within **structural approaches** (constituents, possible worlds, consequence-based).

  *   **The Conflict:** Structural approaches define truthlikeness based on the logical structure of statements (atoms, consequences). However, this structure depends on the language's primitive predicates/vocabulary. Finer-grained languages create more possible states (worlds/constituents) and more potential consequences. This changes the "distance" metrics and consequence sets, potentially altering the ordering (T1 > T2 in L1, T2 > T1 in L2).
  *   **What Breaks:** Requirement 9 is violated. The ordering becomes relative to the expressive resources of the language, not just the world. This undermines the objective, language-independent realism sought.
  *   **The Key Culprit:** **Language/Conceptual Scheme Invariance (9)**. It's the requirement that structurally-defined accounts struggle most to satisfy while maintaining specificity and content sensitivity. Relaxing it (accepting language-relativity) is costly for realism's objectivity. Strengthening it often forces accounts towards overly coarse-grained or non-structural (e.g., similarity-based) approaches, which have their own problems.

  **Other Notable Conflicts/Tensions:**

  *   **Content vs. Likeness:** Emphasizing true/false *content* (Requirement 3) can clash with intuitive *likeness* (e.g., "3.141" is intuitively closer to π than "3.000", even if both are equally false and have similar logical content). Pure content approaches struggle with likeness; pure likeness approaches struggle with logical structure/consequences.
  *   **Precision vs. Accessibility:** Highly precise, metric measures (your instinct) satisfying many desiderata rigorously (like specific distance functions in likeness approaches) often make **Epistemic Accessibility (10)** harder. Knowing *exactly* how close we are is implausible; knowing we're *closer* might be tractable with coarser, comparative judgments.
  *   **Conjunction Troubles:** Strict adherence to "adding a true conjunct never decreases verisimilitude" (a strong reading of 3/7) can conflict with **Semantic Depth (11)**. Adding a true but wildly irrelevant or distracting conjunct *should* arguably not *improve* a highly truthlike theory, even if it doesn't strictly *decrease* it. Some accounts struggle to handle this nuance.

  **The Single Most Troublesome Requirement:** **Language Invariance (9)**. It consistently eliminates otherwise promising structural accounts and forces significant compromises. For a scientific realist prioritizing objectivity, abandoning it is deeply problematic, as it concedes that truthlikeness is partly linguistic/conventional. The cost is high: progress claims become relative to a chosen conceptual scheme, weakening the realist's claim about convergence towards the *mind-independent* truth. The realist *must* either find a way to satisfy it robustly (e.g., via a privileged ontology or similarity in *property* space) or argue that a suitably stable language is used in mature science.

  ---

  ### **Assessment of Broad Approaches**

  1.  **Content Approach (Popperian, Miller, initial Tichý/Niiniluoto):** Focuses on comparing sets of true and false consequences.
      *   **Strengths:** Handles **Truth Supremacy (2)**, **Separation from Probability (5)** & **Empirical Adequacy (6)** well in principle. Can justify **Comparability of False Theories (1)** and **Superiority of Precise Falsehoods over Trivial Truths (4)**. Clear on **Contradictions (8)**.
      *   **Weaknesses:** Gravely struggles with **Language Invariance (9)** (consequence sets change with language). Often ignores **Semantic Depth (11)** (counts all consequences equally). **Conjunction/Disjunction (7)** handling is notoriously problematic (adding truths can be bad? Disjunctions can be too good?). **Epistemic Accessibility (10)** is challenging (identifying *all* consequences is impossible).

  2.  **Consequence Approach (Refinements of Content, e.g., Schurz/Weingartner):** Focuses on *relevant* or *non-redundant* consequences to avoid content approach pitfalls.
      *   **Strengths:** Mitigates some **Conjunction/Disjunction (7)** problems of naive content approaches. Better handles **Superiority of Precise Falsehoods (4)** without trivial disjunctions dominating. Retains core strengths of **Comparability (1)**, **Supremacy (2)**, **Separation (5, 6)**, **Contradictions (8)**.
      *   **Weaknesses:** **Language Invariance (9)** remains a severe challenge (relevance can be language-sensitive). **Semantic Depth (11)** is still difficult (are fundamental laws "more relevant"?). Defining "relevance" precisely is complex. **Epistemic Accessibility (10)** is still limited (knowing all relevant consequences is hard).

  3.  **Likeness/Similarity Approach (Tichý, Oddie, Niiniluoto later, Nimiluoto):** Defines distance between theories and truth based on similarity of states/models/properties.
      *   **Strengths:** Naturally handles **Comparability (1)**, **Superiority of Precise Falsehoods (4)** (distance metrics allow fine-grained comparison), and **Language Invariance (9)** *if* based on underlying properties/states, not syntactic descriptions. Can incorporate **Semantic Depth (11)** via weighting fundamental properties. Satisfies **Truth Supremacy (2)**, **Separation (5, 6)**, **Contradictions (8)** in well-defined metrics. Offers potential for **Epistemic Accessibility (10)** via approximate models.
      *   **Weaknesses:** Defining the *correct* similarity metric and weighting of properties is deeply problematic and often seems ad-hoc. Struggles with **Logical Operations (7)** – the distance between complex statements (conjunctions/disjunctions) isn't easily derived from atomic distances. Can be computationally complex. Risk of **collapsing into model-theoretic fit** if not careful about separating truthlikeness from mere empirical adequacy within the model space.

  **No approach satisfies all desiderata perfectly.** The Likeness approach arguably comes closest for realism by tackling Language Invariance head-on via similarity in property space, but at the cost of introducing the difficult metaphysics of similarity metrics. The refined Consequence approach offers logical rigor but remains vulnerable to language dependence. The choice involves prioritizing which conflicts are least damaging to the intended application (scientific realism and theory change). Your background in metrics is a strength for assessing Likeness approaches, but be wary of assuming metric properties are *necessary*; robust *orderings* might suffice for realism.
