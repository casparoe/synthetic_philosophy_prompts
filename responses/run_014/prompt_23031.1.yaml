  Okay, let me start by unpacking the user's query. They're a retired physicist who spent 35 years in a lab, now diving into Hobbes' Leviathan, specifically chapters 4 and 5, and De Corpore. They're stuck on Hobbes' take on geometry, axioms, and reasoning as computation. 

  First, I need to recall Hobbes' key points here. He argues that geometric truths aren't innate but built from definitions, reasoning is just adding/subtracting names, and axioms are propositions that become obvious once words are understood. The user is confused about how Hobbes treats common notions like "the whole is greater than the part." They thought axioms were self-evident truths, but Hobbes seems to reduce them to linguistic tautologies. 

  The user's main questions are: Is their reading fair? Why does Hobbes make this move? Does it demote axioms or make geometry reliable? And how does "computation" actually work in deriving theorems like Pythagoras?

  Hmm, the user is clearly coming from a physics background where measurement and empirical evidence matter. They might be grappling with Hobbes' nominalism—seeing math as human-constructed versus discovered. Their deeper interest might be how this nominalist view affects Hobbes' political philosophy in Leviathan. They want to understand the math foundation before tackling the political part.

  I should confirm that yes, their reading is spot-on. Hobbes is indeed demoting axioms to linguistic conventions. For him, "the whole is greater than the part" is true by definition once "whole" and "part" are understood. This isn't about discovering reality but setting rules for reasoning. 

  Why does Hobbes do this? It's to make geometry certain and immune to skepticism. By grounding it in definitions we control, he avoids debates over innate ideas or sensory reliability. This is crucial for his political project, where he wants similar certainty in defining sovereignty or contracts.

  On computation: Hobbes is overly optimistic. He imagines syllogistic deduction from definitions can grind out complex theorems, but in practice, math involves intuitive leaps and creative constructions. Still, his core insight—that math is deductive and rule-based—was ahead of his time and influenced later formal systems.

  The user might also be subtly asking if Hobbes' math model holds up today. The answer is mixed: modern logic validates his computational view (e.g., in proof theory), but Gödel incompleteness shows limits he didn't foresee. And axioms aren't just arbitrary—they're chosen for fruitfulness, not just consistency.

  Finally, linking to politics: Hobbes needs geometry as a template. Just as geometric truths follow from definitions, political truths (like "sovereign power must be absolute") should follow from defined terms (e.g., "state of nature"). If math weren't certain, his whole project might crumble. 

  I should emphasize that Hobbes isn't dismissing axioms as trivial—he's redefining their role. They're the bedrock *because* they're tautological, making them incorruptible. That’s why geometry is his ideal science. 

  The user’s physics background might make them wary of this. They’re used to axioms corresponding to physical reality (like Euclid’s lines matching space). But Hobbes separates math from physics entirely—it’s a closed system of signs. That’s the leap they need to make. 

  I’ll structure this clearly: affirm their reading, explain Hobbes’ motives, address computation’s limits, and hint at the political stakes—without diving into Leviathan’s politics yet. They want the math foundation solid first.
answer: |-
  Your reading is spot-on and captures the radical core of Hobbes's nominalism and his vision of geometry as the model for *scientia* (demonstrative knowledge). Let's unpack his treatment of axioms ("common notions"), the nature of reasoning, and the implications:

  1.  **Demoting Axioms to Linguistic Conventions? Yes, but...**
      *   **The Linguistic Core:** Hobbes absolutely argues that axioms like "the whole is greater than the part" are *not* innate ideas nor self-evident truths about an external reality discovered by pure intuition. Their truth arises *solely* from the signification (meaning) we have assigned to the words "whole" and "part" by definition.
      *   **Tautology, Not Discovery:** You're correct. For Hobbes, understanding the definitions makes the proposition *necessarily* true, but only *because* we defined the terms that way. It's a truth about the *relationship between names/concepts we created*, not a direct revelation of a metaphysical truth about "wholes" and "parts" existing independently of language.
      *   **Not *Just* Verbal Conventions (The Crucial "But..."):** Hobbes doesn't see this as a *demotion* rendering axioms trivial. Instead, it's precisely this linguistic grounding that **makes geometry certain and reliable**. Why?
          *   **Control and Certainty:** Because the definitions (and thus the axioms derived from them) are human constructs under our *control*, they are immune to the uncertainty of sensory experience or the vagaries of innate ideas. We know them with absolute certainty *because we made them*.
          *   **The Foundation of "Science":** These definition-derived tautologies become the **indubitable starting points** for the deductive chain. They are the bedrock upon which the entire edifice of geometric certainty is built. Without these secure, conventional foundations, true *scientia* would be impossible. Geometry is the only "science" because it's the only field where this chain of definitions and deductions built upon them is rigorous enough to yield absolute certainty.

  2.  **Reasoning as Computation: How Literal?**
      *   **The Core Mechanistic Vision:** Hobbes is indeed proposing a highly mechanistic view: reasoning is the manipulation of names (signs) according to fixed rules (like addition/subtraction of concepts). Defining a line establishes the concept "line"; definitions of "point," "straight," etc., establish other concepts. Reasoning ("reckoning") combines and separates these conceptual building blocks based on their definitions.
      *   **Generating the Pythagorean Theorem: Optimistic, But Flawed:** Hobbes *did* believe the Pythagorean theorem could, in principle, be derived mechanically from definitions (like "point," "line," "right angle," "square") and the common notions treated as definitional tautologies. He saw Euclid's demonstrations as exemplifying this computational process.
      *   **The Reality Gap:** Here's where Hobbes's picture collides with mathematical practice:
          *   **Gap 1: The Need for Constructions:** Deriving non-trivial theorems like Pythagoras requires more than just manipulating definitions syllogistically. It requires **geometric constructions** (drawing lines, circles, etc.). For Hobbes, constructions are also part of the computational process – they are acts of *defining* new entities (e.g., "let there be a circle with center A and radius AB") whose properties then flow from the definitions. However, the *creative insight* needed to devise the *correct* construction that unlocks the proof is not easily reduced to mere name addition/subtraction. It feels like discovery, not just computation.
          *   **Gap 2: Implicit Assumptions:** Euclid's system (and any geometric system) relies on assumptions not explicitly stated as definitions or common notions, particularly concerning continuity, order, and congruence (e.g., SAS congruence is a postulate, not derived from definitions). Hobbes's system struggles to account for the necessity of these without smuggling in intuitive spatial knowledge.
          *   **Gap 3: The Role of Intuition:** While Hobbes banishes intuition from the *foundations* (replacing it with definitions), the *process* of following a proof, understanding why a construction works, or seeing the validity of a step often involves a spatial or logical intuition that feels irreducible to mere symbol shuffling. Mathematicians *do* manipulate symbols, but they also rely on pattern recognition, visualization, and conceptual understanding that go beyond pure syntax.

  3.  **Survival of Hobbes's Picture & Link to Politics:**
      *   **Enduring Insights:**
          *   **Formal Systems:** Hobbes's vision is a powerful precursor to modern formal logic and the idea of axiomatic systems. The notion that mathematics operates within a system defined by initial conventions (definitions, axioms, rules of inference) and derives truths *internally* through deduction is foundational.
          *   **Certainty through Convention:** His insight that certainty in mathematics arises from adherence to self-imposed rules and definitions, rather than direct correspondence with reality, remains influential (though debated).
          *   **Symbolic Manipulation:** Large swathes of mathematics *can* be understood as rule-governed manipulation of symbols, especially in algebra, logic, and formal verification.
      *   **Limitations Exposed:**
          *   Gödel's Incompleteness Theorems fundamentally limit the kind of complete, mechanical derivation Hobbes envisioned for complex systems like arithmetic (let alone geometry with its implicit assumptions).
          *   The creative, intuitive, and constructive aspects of mathematical discovery/practice are not fully captured by the "reckoning" model.
          *   Modern views of axioms often see them as fruitful *choices* based on experience and desired outcomes, not *only* as definitional tautologies (though consistency is key).
      *   **The Crucial Link to Leviathan's Politics:** This is absolutely central.
          *   **The Model:** Geometry provides the blueprint for *scientia*. Hobbes aims to build political philosophy with the same certainty.
          *   **Definitions as Foundation:** Just as geometry starts with definitions of "point," "line," etc., political philosophy must start with precise definitions of foundational concepts: "Person," "Covenant," "Commonwealth," "Sovereign," "Right of Nature," "Law of Nature." These definitions are not discovered; they are *established by the philosopher* as the necessary starting points.
          *   **Deduction as Legitimation:** Political truths (e.g., the necessity of absolute sovereignty, the obligations of subjects) must then be deduced *computationally* from these foundational definitions and the "common notions" (which, in politics, might be basic principles of human motivation derived from his mechanistic psychology, like the desire for self-preservation). The sovereign's power isn't justified by divine right or ancient custom; it's logically deduced as the necessary consequence of defining humans in a state of nature and the requirement for peace.
          *   **Certainty vs. Contingency:** The *certainty* of the geometric conclusion (if you accept the definitions) is what Hobbes desperately wants for his political conclusions. If geometry's certainty rests on controlled definitions and computation, then so too can the science of politics. This demystifies politics, removing it from theology or vague tradition, and grounds it in human reason operating on clear definitions. The alternative, for Hobbes, is the chaos of the state of nature – the political equivalent of mathematical incoherence.

  **In Summary:**

  *   **Axioms:** Yes, Hobbes reduces them to definitional tautologies ("truths of speech"). This isn't a demotion but the *source* of geometric certainty. We know them *because we made the rules*.
  *   **Computation:** Reasoning is the mechanistic manipulation of names/concepts based on definitions. He genuinely believed complex theorems like Pythagoras *could* be derived this way, though the need for constructions and implicit assumptions reveals limitations in his purely linguistic/syllogistic model.
  *   **Survival:** Hobbes's core insight – that mathematics derives certainty from defined terms and rule-based deduction within a closed system – was profound and influential, foreshadowing formal logic. However, the full practice of mathematics involves elements (intuition, construction, creativity) not fully reducible to his model, and Gödel later showed fundamental limits.
  *   **Link to Politics:** This geometric model is **absolutely essential** to *Leviathan*. Hobbes aims to build political philosophy *as* a demonstrative science. The sovereign's absolute authority is presented not as an opinion or tradition, but as the logically *necessary* conclusion deduced from the definitions of human nature and the state of nature, just as Pythagoras is deduced from the definitions of points and lines. The certainty of geometry is the aspiration and the justification for his entire political project. Understanding his philosophy of mathematics is key to understanding why he believed his political conclusions were not just desirable, but *inevitably true* once the correct definitions were established and the computation performed.
