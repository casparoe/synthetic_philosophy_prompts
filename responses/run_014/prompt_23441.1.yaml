answer: |-
  Here's a concise argument for your reading group, focusing on the group-theoretic essence of Banach-Tarski:

  **Core Argument:** Banach-Tarski is fundamentally a demonstration of the **non-amenability** of the rotation group SO(3), not primarily an indictment of the Axiom of Choice (AC). The paradox arises because SO(3) lacks a specific measure-theoretic property, forcing us to choose between a fully general measure and paradoxical decompositions.

  **Key Points:**

  1.  **The Measure-Theoretic Ideal:** Imagine a finitely additive measure (think "volume") defined on *every* subset of the unit sphere S² that is:
      *   **Rotation-Invariant:** Rotating a set doesn't change its measure.
      *   **Normalized:** The whole sphere has measure 1.
      Such a measure would be the ideal geometric "volume" for all subsets.

  2.  **The Measure-Theoretic Obstruction:** Banach-Tarski shows that if such a universal measure existed, it would lead to a contradiction (1 = measure(Sphere) = measure(2 Spheres) = 2). Therefore, **no such measure can exist.** This is the core impossibility revealed by the paradox.

  3.  **The Group-Theoretic Source: Non-Amenability:** Why does this impossibility arise? Because SO(3) contains a subgroup isomorphic to the free group F₂ on two generators (say, rotations A and B). Crucially, **F₂ is non-amenable**.
      *   **Non-Amenability Defined:** A group is *amenable* if it admits a finitely additive, left-invariant probability measure defined on *all* its subsets. F₂ famously does not.
      *   **The Connection:** The "paradoxicality" of F₂'s action *is* its non-amenability. Von Neumann showed that a group is amenable *if and only if* it admits no paradoxical decomposition (using its own action on itself). Banach-Tarski leverages this:
          *   The paradoxical decomposition of S² is constructed by exploiting the action of this F₂ subgroup.
          *   The sphere is partitioned into orbits under F₂. Sets within one orbit are equidecomposable. The paradoxical nature of F₂ itself (stemming from its non-amenability) is then transferred to the sphere via this action.
          *   **The Link:** The non-existence of an invariant measure *on F₂ itself* (non-amenability) directly causes the non-existence of an invariant measure *on the sphere* under the action of F₂ (and thus SO(3)), making the geometric paradox possible.

  4.  **AC's Role: The Set-Theoretic Tool:** The Axiom of Choice is used primarily for one crucial step: selecting a single point (a representative) from each orbit of the F₂ action on the sphere. This is necessary to form the specific pieces of the decomposition from these uncountably many orbits. AC provides the set of representatives; the decomposition is then built using the group action on these representatives and their orbits. **AC enables the *construction* of the paradoxical sets given the group action, but the *possibility* of paradox stems from the non-amenable group structure.**

  5.  **The Local Cost: Restricting the Measure:** To avoid the paradox and regain a consistent notion of volume, we must restrict the domain of our measure. We accept that a universal measure on *all* subsets is impossible. Instead, we define a countably additive, rotation-invariant measure only on the **Borel sets** (or Lebesgue-measurable sets). This σ-algebra is generated by the topology and is compatible with the continuous action of SO(3). While it excludes the non-constructible, "wild" sets built using AC and the F₂ action, it provides a rich and useful domain where geometric intuition holds. **The "cost" of avoiding paradox is acknowledging that measure theory applies robustly only to well-behaved (Borel/Lebesgue) sets, a consequence of the rotation group's non-amenability.**

  **Conclusion:** Banach-Tarski highlights that the structure of SO(3) (specifically, containing a non-amenable F₂ subgroup) **inherently prevents** the existence of a geometrically reasonable, finitely additive measure defined on *all* subsets of the sphere. AC is the tool that lets us manifest this inherent impossibility as a concrete decomposition paradox. The deeper lesson is about the interplay between group actions, measure, and geometric intuition: non-amenable group actions fundamentally constrain our ability to define consistent global measures, forcing us to limit the domain of "measurable" sets. Banach-Tarski is a theorem about the geometry and algebra of rotations, revealing non-amenability as the core obstruction.
