answer: |-
  Here is a systematized set of desiderata for an adequate account of corruption, anchored by your stylized cases, with analysis of constraints and tensions:

  ### I. Core Desiderata (Non-Negotiable)
  1.  **Explain Universal Phenomena:**
      *   **Phenomena:** Moral outrage, loss of public trust, institutional decay, diversion of resources from public goals, creation of unfair advantage, distortion of decision-making.
      *   **Rationale:** Any viable theory must explain why corruption is consistently viewed as harmful across diverse societies, even if manifestations differ. It must capture the core pathology.
      *   **Case Anchors:** Explains outrage in Case A (nepotism bypassing rules), potential harm in Case B (distorting future care?), and systemic damage in Case C (resource misallocation, exclusion).

  2.  **Correctly Decide Core Cases (Universal Condemnation):**
      *   **Cases:** Must unequivocally classify large-scale, self-enriching bribery, extortion, and grand embezzlement of public funds as corruption in *any* context.
      *   **Rationale:** Establishes a minimal universal baseline. Failure here renders the account practically useless for cross-societal comparison or reform targeting the most damaging acts.
      *   **Case Anchor:** Case C *must* be condemned as corruption if it involves significant personal gain or blatant theft, regardless of coalition needs. If purely communal distribution without personal gain, it still likely fails other desiderata (public purpose, fairness).

  3.  **Preserve Key Distinctions:**
      *   **Distinctions:**
          *   *Public Role vs. Private Capacity:* Actions taken *qua* official vs. private citizen.
          *   *Gift vs. Bribe:* Spontaneous gratitude vs. payment for specific (mis)use of office.
          *   *Legitimate Favor vs. Corrupt Favor:* Helping someone navigate complex rules vs. breaking rules for them.
          *   *Social Obligation vs. Corrupt Exchange:* Fulfilling kinship/community duties privately vs. leveraging public office to fulfill them.
          *   *Reform vs. Systemic Dysfunction:* Addressing corruption vs. addressing the broken rules/institutions that incentivize it.
      *   **Rationale:** Essential for precise diagnosis and targeted reform. Blurring these leads to misidentification and ineffective solutions.
      *   **Case Anchors:** Crucial for analyzing Case B (gift vs. expectation?) and Case A/C (private obligation vs. public duty violation).

  4.  **Accommodate Empirical Constraints on Reciprocity & Obligation:**
      *   **Constraints:**
          *   *Reciprocity Norms:* Vary widely (e.g., immediate quid-pro-quo vs. diffuse long-term obligation). A theory cannot assume Western, impersonal market norms.
          *   *Obligation Frameworks:* Kinship, patronage, ethnicity, or communal ties create powerful moral/social obligations competing with formal public duty. A theory must recognize this tension exists.
      *   **Rationale:** To avoid cultural imperialism and irrelevance. An account must be able to *analyze* how these norms interact with public office, even if it ultimately condemns specific interactions as corrupt *within context*.
      *   **Case Anchors:** Essential for understanding the *motivations* and *social acceptability* in Case A (kinship obligation), Case B (gratitude/reciprocity norm), and Case C (communal/patronage obligation). A theory must explain *why* these acts occur and might be locally justified, even if corrupt.

  ### II. Anchoring via Stylized Cases
  *   **Case A (Fee Waiver for Cousin):**
      *   **Phenomena:** Violates fairness, rule of law, trust in impartial administration.
      *   **Decision:** Likely corrupt (violates public duty for private/familial gain), but theory must grapple with kinship obligation constraint.
      *   **Distinction:** Tests Private Obligation vs. Public Duty distinction.
  *   **Case B (Nurse Accepts Produce):**
      *   **Phenomena:** Potential distortion of care, creates subtle obligation/expectation, blurs professional boundary.
      *   **Decision:** Highly context-dependent (value, timing, expectation, local norms). Theory *must* accommodate ambiguity, not force a binary.
      *   **Distinction:** Tests Gift vs. Bribe distinction; highlights Reciprocity Norm constraint.
  *   **Case C (Minister Channels Contracts):**
      *   **Phenomena:** Gross misallocation, exclusion, subversion of public purpose, sustains dysfunctional system, erodes legitimacy.
      *   **Decision:** *Must* be condemned as corruption (violates public purpose, fairness, likely involves quid-pro-quo for power). Coalition sustenance is a *consequence*, not a justification within a corruption definition.
      *   **Distinction:** Tests Public Purpose vs. Private/Communal Gain; highlights Obligation Framework constraint but shows its limits.

  ### III. Institutional Outlook Commitments (Negotiable)
  These reflect priorities and value judgments about *ideal* governance, not the core pathology:
  5.  **Public Interest/Purpose:** Defining corruption as a deviation from a (theoretically defined) "public interest" or the formal purpose of the office/institution.
      *   **Rationale:** Focuses on the *functional* harm to collective goals.
      *   **Outlook:** Reflects a Weberian/legal-rational ideal. Controversial if "public interest" is contested or institutions are illegitimate.
      *   **Case Impact:** Strongly condemns A & C; ambiguous on B if care wasn't affected.
  6.  **Impartiality/Fairness:** Defining corruption as violating the principle of equal treatment or impartiality in the exercise of public authority.
      *   **Rationale:** Captures the core injustice.
      *   **Outlook:** Reflects liberal democratic ideals. May clash with strong communal obligation norms.
      *   **Case Impact:** Condemns A & C; condemns B if gifts lead to preferential treatment.
  7.  **Principal-Agent Fidelity:** Defining corruption as the agent (official) betraying the principal (public/citizen) for unauthorized gain.
      *   **Rationale:** Clear economic/contractual logic.
      *   **Outlook:** Assumes a clear, legitimate principal-agent relationship. Struggles with weak states, contested legitimacy, or diffuse principals.
      *   **Case Impact:** Condemns A & C; condemns B if acceptance violates formal rules or implied duty.

  ### IV. Tensions and Eliminating Definitions
  *   **Key Tension (Potentially Jointly Unsatisfiable):**
      *   **Universal Applicability/Non-Ethnocentrism (Desideratum 4)** vs. **Precise Distinctions (Desideratum 3) / Strong Public Interest Focus (Commitment 5)**.
      *   **Why:** Truly accommodating diverse reciprocity/obligation norms (e.g., where kinship duty *is* paramount) can blur the Public/Private distinction and challenge strict "public interest" definitions. A definition precise enough for legal reform in a Weberian state might be irrelevant or overly broad in a highly communal society. Achieving perfect cross-cultural precision without some minimal universal normative stance (like condemning massive theft) is extremely difficult.
  *   **Most Eliminative Requirement:**
      *   **Accommodating Empirical Constraints on Reciprocity & Obligation (Desideratum 4)** eliminates the largest class of familiar definitions.
      *   **Why:** Most common definitions (especially legalistic or principal-agent) implicitly assume:
          *   A clear separation of public office and private life/obligations.
          *   Impersonal, rule-bound administration as the norm.
          *   Reciprocity is suspect or confined to market-like exchanges.
      *   Definitions that cannot handle the moral weight of kinship obligation (Case A), the ambiguity of gift-giving (Case B), or the systemic function of patronage (Case C) in contexts where these are deeply embedded social norms fail this requirement. They are often ethnocentric (usually Western-centric) and lack the analytical tools to explain corruption in societies where the formal state is weak or overlaid on strong informal networks.
