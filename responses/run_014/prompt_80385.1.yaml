answer: |-
  ## Research Proposal: Decomposing the Boundary Problem - Franchise vs. Jurisdiction in Democratic Theory

  **1. The Precise Research Question:**

  Does resolving the "boundary problem" in democratic theory require distinguishing two distinct normative questions: (A) the *franchise question* (Who qualifies for voting rights within a specific democratic unit?), and (B) the *jurisdictional question* (Whose interests must be legitimately considered and whose lives are legitimately bound by the decisions of that unit?), such that different principles (e.g., "all-able-to-affect" for franchise, "all-affected" for jurisdiction) provide the correct answers to these separate questions, thereby dissolving apparent conflicts and resolving the "unbounded demos" objection?

  **2. The Problem and Existing Positions:**

  The "boundary problem" – determining who constitutes "the people" (demos) entitled to collective self-rule – is a foundational challenge in democratic theory. Existing dominant principles offer competing, seemingly mutually exclusive answers, but this project contends they fail because they conflate two distinct dimensions:

  *   **Territorial Residence:** This principle defines the demos based on physical presence within a bounded geographic space. While it provides a clear administrative boundary and addresses stability concerns, it is widely criticized for normatively arbitrariness. Why should lines on a map definitively determine political inclusion? Crucially, it leaves both questions inadequately addressed: It *assumes* jurisdiction follows territory (which is contested) and uses territory as a rough proxy for franchise, ignoring affected non-residents and potentially including long-term residents who are disenfranchised.
  *   **Civic Citizenship:** This defines the demos based on legal status (citizenship). Like territory, it provides administrative clarity but faces severe normative challenges regarding exclusion (denying franchise to long-term resident non-citizens demonstrably affected by decisions) and inclusion (granting franchise to non-resident citizens minimally affected). It primarily addresses franchise *as currently constituted*, not providing a normative foundation for *who should be* a citizen or addressing the jurisdictional scope of decisions impacting non-citizens.
  *   **The All-Affected Principle (AAP):** Often presented as the most normatively compelling, AAP holds that "all those affected by a decision should have a say in it." However, its application is fiercely contested. The core critique, widely acknowledged, is the "unbounded demos" problem: causation chains are potentially infinite (e.g., butterfly effect), making the set of "affected" individuals impossibly large and dynamic for practical franchise. This project argues the principle is fundamentally *misapplied* when used as a direct franchise criterion. Instead, it contends AAP offers the correct answer to the *jurisdictional* question: a decision's legitimacy *requires* that the interests of all significantly affected parties are considered and accounted for, regardless of their franchise status.
  *   **The All-Able-To-Affect Principle (AATP):** This principle, often proposed as a solution to AAP's unboundedness, suggests that the demos should consist of those capable of participating in the collective decision-making process (e.g., through sustained interaction, reciprocity). While it addresses practical feasibility for franchise, it faces criticism for potentially excluding vulnerable or remotely affected groups. Crucially, this project posits that AATP is best understood as answering the *franchise* question, focusing on who can reasonably be included as active participants in the self-governing unit.

  **The Apparent Conflict & Proposed Resolution:** The debate often pits AAP against AATP as competing solutions to the *same* problem (defining the franchise demos), leading to an apparent stalemate: AAP seems normatively ideal but practically impossible, while AATP seems practical but normatively deficient for excluding the affected. This project argues the conflict arises from a category error. AAP is not primarily a franchise principle; it's a *jurisdictional legitimacy* principle. AATP is a plausible *franchise* principle. They answer different questions. AAP demands that decision-makers *account for* the interests of the affected (jurisdiction), while AATP defines *who gets to be* those decision-makers (franchise). The "unbounded demos" objection only fatally undermines AAP if it is forced to answer the franchise question; understood as a jurisdictional principle, an unbounded set of affected individuals is not a problem for defining the *franchise*, but a requirement for the *legitimacy* of the decision-making process.

  **3. Methodology: Conceptual Analysis and Case Testing**

  This project employs rigorous conceptual analysis within the tradition of analytical political philosophy:

  *   **Conceptual Decomposition:** Precisely define and distinguish the core concepts: "franchise," "jurisdiction," "legitimacy," "affectedness" (intensity, foreseeability), and "ability-to-affect" (understood as capacity for sustained political participation/reciprocity within a specific unit).
  *   **Argument Reconstruction and Pressure:** Reconstruct the standard arguments for each principle (Territorial, Civic, AAP, AATP). Systematically demonstrate how each, when pressed, either implicitly relies on the franchise/jurisdiction distinction or collapses under the weight of counter-examples precisely because it fails to make this distinction. Target key AAP defenses against the unboundedness charge to show they often implicitly shift towards jurisdictional concerns.
  *   **Puzzle Case Application:** Test the proposed decomposition against challenging cases to refine the concepts and demonstrate its explanatory power:
      *   **Non-resident workers:** A state passes a tax law significantly impacting cross-border commuters. *AAP (Jurisdiction):* Their interests must be accounted for (e.g., via bilateral agreements, representation in relevant committees). *AATP (Franchise):* They likely lack sustained capacity to participate fully in the state's political life; franchise may remain with citizens/residents. The gap is bridged by accountability mechanisms, not franchise expansion.
      *   **Transboundary Environmental Regulation (e.g., river pollution):** Downstream communities in another state are severely affected. *AAP (Jurisdiction):* Their interests are paramount for legitimacy, requiring international negotiation, representation, or strong oversight. *AATP (Franchise):* Including them directly in the upstream state's franchise is impractical; solutions lie in intergovernmental frameworks or empowered transnational bodies where *they* *do* have franchise.
      *   **Resident Non-Citizens:** Long-term immigrants subject to laws but lacking voting rights. *AAP (Jurisdiction):* Their significant affectedness demands their interests be robustly represented (e.g., local voting rights, consultative bodies, strong rights protections). *AATP (Franchise):* Arguments can be made that sustained residence *does* establish "ability-to-affect" through social ties and participation capacity, potentially justifying franchise expansion *here*.
  *   **Contingency Planning:** If the decomposition fails under scrutiny, potential outcomes include: (1) Refining the definitions of "affected" and "able-to-affect" to better distinguish them; (2) Acknowledging a necessary but complex interdependence between the principles that doesn't collapse into conflation; (3) Concluding that the distinction, while valid, doesn't fully resolve the boundary problem but provides crucial clarity for partial solutions. The project would document this failure and its implications honestly.

  **4. Success and Failure Criteria:**

  *   **Success:** The project succeeds if it can persuasively:
      1.  Demonstrate that the conflation of franchise and jurisdiction is a genuine and problematic feature of the existing boundary problem literature.
      2.  Clearly articulate and defend the distinct normative logic underpinning the franchise question vs. the jurisdictional question.
      3.  Show that assigning AAP primarily to jurisdiction and AATP primarily to franchise resolves the apparent conflict between them and provides a more coherent framework for addressing the unbounded demos objection.
      4.  Successfully apply the decomposed framework to the key puzzle cases, showing how it offers clearer normative guidance than the conflated approaches.
      5.  Articulate the mechanisms (representation, accountability, institutional design) required to bridge the normative gap between the jurisdictional set (affected) and the franchise set (able-to-affect).
  *   **Failure:** The project fails if:
      1.  The distinction between franchise and jurisdiction is shown to be normatively insignificant or already fully acknowledged and addressed in the literature.
      2.  The proposed assignment (AAP for jurisdiction, AATP for franchise) cannot withstand conceptual counter-arguments or leads to clearly normatively undesirable outcomes in the test cases.
      3.  The "unbounded demos" objection can be shown to still fatally undermine the framework, even with the decomposition.
      4.  The distinction proves unable to generate clearer normative guidance for resolving boundary disputes than existing conflated approaches.

  **5. Scope Assessment and Feasibility for a 7,000-Word Semester Paper:**

  This project is ambitious but feasible for a 7,000-word graduate seminar paper within one semester, provided scope is carefully managed.

  *   **Feasible Core:** The core conceptual work – defining the distinction, arguing for the conflation in existing literature, resolving the AAP/AATP apparent conflict, and applying the framework to 2-3 core puzzle cases (e.g., non-resident workers, resident non-citizens, and one transboundary case) – is achievable.
  *   **Essential Cuts to Maintain Feasibility:**
      *   **Deep Dives into All Existing Principles:** While critiquing territorial/civic principles for conflation, sustained, detailed refutation of each will be minimized in favor of focusing the critique on how they fail *because* of the conflation, using AAP/AATP as the primary contrasting examples.
      *   **Comprehensive Literature Review:** The literature review will be focused tightly on establishing the *existence* of the conflation regarding AAP and AATP, not a full historiography of the boundary problem.
      *   **Numerous Test Cases:** Limiting analysis to 3 primary, contrasting puzzle cases is essential. Exploring more nuanced variations or less clear-cut examples must be avoided.
      *   **Full Institutional Design:** While mentioning mechanisms like representation/accountability is crucial, a detailed blueprint for institutional solutions bridging the franchise-jurisdiction gap is beyond scope. The focus remains on establishing the *need* for such mechanisms, not their precise form.
      *   **Empirical Analysis:** The paper remains purely normative/conceptual. No empirical case studies assessing real-world implementations will be included.
      *   **Alternative Solutions:** While acknowledging them, extensive engagement with other proposed solutions to the boundary problem (e.g., "constituency"-based approaches, federated systems) will be limited unless directly relevant to challenging the franchise/jurisdiction distinction.
  *   **Realistic Focus:** The paper will prioritize establishing the conceptual distinction and its value in resolving the AAP/AATP conflict and the unboundedness objection. Demonstrating its applicability through a few key cases will suffice to show its potential, without aiming for exhaustive coverage.

  This proposal outlines a path to rigorously develop the initial hunch into a novel contribution to the boundary problem debate, offering conceptual clarity and a potential resolution to a persistent theoretical stalemate, while respecting the constraints of a graduate seminar paper.
