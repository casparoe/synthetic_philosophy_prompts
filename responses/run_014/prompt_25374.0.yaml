answer: |-
  Here’s a decision tree for the dirty hands problem, designed to sort readers based on their intuitions about cases. It follows strict logical branching and flags key philosophical positions, empty branches, and ambiguities.

  ---

  ### **DIRTY HANDS DECISION TREE**  
  *Start with a case where a political leader commits an act that would be morally wrong for an ordinary citizen (e.g., torturing a terrorist to prevent an attack).*

  #### **1. Can this act ever be morally justifiable for a political leader?**  
     - **NO** → **Moral Absolutist (Leaf 1)**  
       *Position: Leaders are bound by the same moral rules as citizens. No justification for "necessary evils."*  
       *(e.g., Kantian deontology, pacifism)*  
     
     - **YES** → Proceed to Question 2.

  #### **2. If the act was the *right call* (necessary to prevent greater harm), does moral "remainder" (guilt, regret, character stain) still properly attach to the agent?**  
     - **NO** → **Pure Consequentialist (Leaf 2)**  
       *Position: Justification washes the act clean. No residue of wrongness. Feeling guilt is irrational.*  
       *(e.g., utilitarian pragmatism)*  
     
     - **YES** → Proceed to Question 3.

  #### **3. Should the public blame or punish the leader for the act, even while acknowledging it was necessary?**  
     - **NO** → **Tragic Responsibility (Leaf 3)**  
       *Position: The leader must act and bear inner guilt, but public punishment is inappropriate. The burden is existential, not legal.*  
       *(e.g., Weberian "ethic of responsibility," some versions of virtue ethics)*  
     
     - **YES** → **Walzerian Dirty Hands (Leaf 4)**  
       *Position: The leader *must* do the act *and* be blamed/punished. Guilt and public sanction are inseparable from justified wrongs.*  
       *(e.g., Walzer: "We punish the leader to reaffirm our shared values.")*  

  ---

  ### **ADDITIONAL COHERENT POSITIONS (Fallout from Logical Space)**  
  - **Institutional Role-Based (Leaf 5)**  
    *Reached via: Q1=YES, Q2=NO*  
    *Position: Leaders are justified by role obligations, but no guilt attaches because they fulfilled their duty. Morality is role-relative.*  
    *(e.g., Hobbesian realism, Machiavellianism)*  
    *Branch path: Q1=YES → Q2=NO (no remainder)*  

  - **Expressive Blame (Leaf 6)**  
    *Reached via: Q1=YES → Q2=YES → Q3=YES*  
    *Position: Public blame is essential not for retribution, but to express societal condemnation of the act, even if necessary.*  
    *(e.g., communicative theories of punishment)*  
    *Note: Overlaps with Walzer but emphasizes symbolism over justice.*  

  ---

  ### **EMPTY BRANCHES & WHY**  
  - **Branch: Q1=YES → Q2=NO → Q3=YES**  
    *(Permissible without moral remainder, BUT public blame/punishment justified)*  
    *Why empty?* If no moral residue exists (Q2=NO), justifying blame/punishment requires an alternative rationale (e.g., deterrence). No major theorists defend this *as a moral stance* since Q2=NO implies the act is morally purified.  

  - **Branch: Q1=YES → Q2=YES → Q3=NO → "But the leader should be punished"**  
    *(Tragic guilt exists, but no public blame → then sudden reversal)*  
    *Why empty?* Logically incoherent. If Q3=NO rejects blame, appending punishment contradicts the branch’s premises.  

  ---

  ### **UNCLEARLY SEPARATED LEAVES**  
  The tree **cannot cleanly separate**:  
  - **Walzerian Dirty Hands (Leaf 4)** and **Expressive Blame (Leaf 6)**.  
    *Why?* Both endorse blame/punishment (Q3=YES) but for different reasons. Walzer ties blame to moral culpability; Leaf 6 treats blame as symbolic. In practice, respondents may conflate them.  

  - **Pure Consequentialist (Leaf 2)** and **Institutional Role-Based (Leaf 5)**.  
    *Why?* Both answer Q2=NO (no guilt), but Leaf 2 focuses on outcomes, while Leaf 5 focuses on role obligations. Users may agree on cases but diverge on rationale.  

  ---

  ### **TREE SUMMARY**  
  ```mermaid
  graph TD
  A[Q1: Justifiable for leader?] -->|No| L1[Moral Absolutist]
  A -->|Yes| B[Q2: Moral remainder?]
  B -->|No| C[Q3: Public blame/punish?]
  C -->|No| L2[Pure Consequentialist]
  C -->|Yes| EMPTY["EMPTY BRANCH (see note)"]
  B -->|Yes| D[Q3: Public blame/punish?]
  D -->|No| L3[Tragic Responsibility]
  D -->|Yes| L4[Walzerian Dirty Hands / L6 Expressive Blame]
  ```

  ---

  ### **KEY FOR HANDOUT**  
  - Test intuitions with **specific cases** (e.g., *"Should a mayor torture a bomber to find a hidden nuke?"*).  
  - Positions like **"Institutional Role-Based" (Leaf 5)** emerge when users say, *"It’s their job—no guilt needed."*  
  - **"Tragic Responsibility" (Leaf 3)** captures those who say, *"They must live with guilt, but we shouldn’t punish them."*  
  - **Flag Walzer (Leaf 4)**: If users insist *"They must do it AND we must punish them,"* they’re here.  

  This tree forces users to confront tensions between justification, guilt, and blame—revealing where their intuitions align with (or defy) classical theories.
