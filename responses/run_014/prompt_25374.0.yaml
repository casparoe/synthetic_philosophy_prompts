  I should include other positions like the institutional role view (duty-based, no guilt) and the expressive blame view (blame as societal condemnation). Need to check if all branches are covered and if the tree accurately reflects the literature. Also, ensure the questions are case-based to avoid labels, as the user specified. Testing the tree with hypothetical scenarios would help users self-identify their stance.

