prompt: |-
  I'm preparing a set of teaching materials on the normative force of promises, and I keep coming back to a distinction I find harder to pin down than it should be: whether a promise obliges the promisor to *perform the promised act* or only to *make the promisee whole for whatever the promisee lost by relying on the promise*. I'd like you to construct a thought experiment, to the specifications below, that isolates exactly this distinction.

  Here is what I need. Build a single, realistic scenario — an everyday personal or workplace situation, not a trolley and not science fiction, and no longer than one paragraph — in which a promisor has made a promise that the promisee accepts, the promisee then relies on the promise by forgoing a cheaper alternative (so the reliance loss is a definite, quantifiable sum), and after the reliance an unforeseen event for which the promisor is not at fault makes performing the promised act possible but more costly for the promisor than the promisee's reliance loss. The promised act must remain something the promisor *could* still do — costly, not impossible — and the promisee must genuinely prefer the promisor's performing the act to simply taking the cheaper alternative, so that the choice between performance and compensation is live for the promisee. Do not stipulate the verdicts inside the scenario; the scenario should be the bare facts, and the verdicts should fall out of applying the theories to those facts.

  After the scenario, walk through what each of four standard accounts of why promises bind says the promisor owes, and why: the reliance-based account, the contract-based account, the will- or autonomy-based account, and the reason-based account (the view that a promise generates a new reason for the promisor to perform). I expect the reliance-based and reason-based accounts to come out on one side (no duty to perform, at most a duty to compensate) and the contract-based and will-based accounts to come out on the other (a duty to perform); I want you to say which structural feature of the case is doing the work in producing that split, what happens to the case if you remove that feature (does it collapse into a case where all four accounts agree?), and how the most plausible defender of the account that comes out worst would try to attack the case. Think very carefully before answering, and respond in the style of an expert who has actually worked through the literature. If the specifications as I've posed them are jointly unsatisfiable, or if the request rests on a confused premise about what these theories say, say so plainly and tell me where the problem is rather than forcing a scenario that can't do the job.
reasoning: |-
  Okay, the user is preparing teaching materials on the normative force of promises and needs a thought experiment that isolates a specific distinction: whether a promise creates an obligation to perform the promised act or merely to compensate for reliance losses. They want a realistic scenario without sci-fi or trolley problems, where the promisor isn't at fault for an unforeseen event that makes performance costly but possible, and where the promisee genuinely prefers performance over compensation. 

  Hmm, the challenge here is designing a scenario that cleanly separates performance obligation from compensation duty. The key elements needed are: 1) quantifiable reliance loss (forgone cheaper alternative), 2) post-reliance unforeseen event increasing promisor's costs beyond that loss, 3) performance remains physically possible but economically burdensome, and 4) promisee has subjective preference for performance. Must avoid contamination by moral luck or culpability.

  Let me construct a workplace example - those often have clear reliance and measurable costs. How about a graphic designer promising to deliver artwork by deadline? Promisee (client) relies by rejecting cheaper freelancer. Then promisor's trusted software suddenly becomes subscription-only at triple price. Reliance loss is $500 (cheaper freelancer's fee), new software cost is $900. Performance still possible but costly, and client prefers original designer's work. This satisfies all parameters.

  Now for the theoretical breakdown. The reliance theory should focus on the $500 loss since that's the actual detriment. Contract/will theories will insist on performance because the promise itself creates the primary duty. The reason-based view is tricky - depends whether it sees the promise as creating only compensation reasons or performance reasons. Need to clarify that in response.

  The structural pivot is whether the promise's core obligation survives changed circumstances when performance becomes uneconomical but doable. Remove this feature - say costs remain stable - and all theories agree on performance. But in this scenario, contract/will theories appear rigid - a defender might argue good faith effort fulfills obligation even if using inferior tools, but that seems weak. Better counter: distinguish between absolute impossibility and economic hardship, claiming the latter doesn't void performance duty if avoidable through sacrifice.

  User expects reliance/reason vs contract/will split, but reason theory is ambiguous. Should flag that - some reason theorists might say the promise creates categorical reasons to perform. Need to acknowledge this nuance while showing how a compensatory interpretation could align with reliance theory.

  Also noting user's phrase "most plausible defender... attack the case" - for will theory defenders, they'd likely attack the "unforeseen event" premise, arguing promisor assumed software stability risk by promising. But that feels strained in a non-contractual setting. Workplace promises often imply flexibility - could that undermine the case? No, because explicit deadline promise makes it concrete.

  Final check: scenario avoids culpability? Yes, software change is external. Preference credible? Yes, creative work has subjective value. Quantifiable loss? Clear $500 delta. Costly but possible? $900 > $500 but feasible. Perfect.
answer: |-
  Here is a thought experiment rigorously designed to isolate the performance-vs-compensation distinction, followed by a theoretical breakdown adhering to your specifications.

  ---

  **Scenario:**  
  Chloe promises her colleague Ben to design a professional brochure for his side business, delivering the final files by May 1st, so Ben can print them for a crucial industry event. Ben accepts this promise and relies on it by declining a freelance designer’s offer to do the same job for $500. On April 28th, Chloe’s subscription-based design software (which she uses for all professional work) unexpectedly shifts to a new mandatory "premium tier" due to a corporate policy change unrelated to Chloe. The new subscription costs $900/month. Chloe can still complete the brochure using this software, but doing so requires paying the $900 fee. Ben’s quantifiable reliance loss is the $500 he saved by forgoing the freelancer. Ben genuinely prefers Chloe’s distinctive design style over the freelancer’s work, so he wants performance, not $500.

  ---

  ### Theoretical Analysis

  1.  **Reliance-Based Account (e.g., Fuller & Perdue, MacCormick):**  
      *Obligation:* Chloe owes Ben compensation for his reliance loss ($500), not performance.  
      *Why:* The moral force of promises derives from losses caused by reasonable reliance. Chloe’s promise induced Ben to forgo a $500 alternative. The unforeseen cost increase doesn’t negate the actual detriment Ben suffered due to reliance. Performance ($900 cost to Chloe) is disproportionately burdensome compared to the harm Ben would suffer from non-performance (losing $500). The core duty is to prevent harm from reliance, not to ensure performance regardless of cost.

  2.  **Contract-Based Account (e.g., Classical Contract Doctrine):**  
      *Obligation:* Chloe owes Ben performance (the completed brochure).  
      *Why:* A promise accepted as part of a bargained-for exchange creates a strict duty to perform. Ben provided consideration (forgoing the freelancer in reliance). The software cost increase is a foreseeable business risk (market changes) allocated to the promisor. "Impracticability" doctrines typically require near-impossibility, not mere increased cost. The primary obligation is to deliver the promised result.

  3.  **Will/Autonomy-Based Account (e.g., Fried, Barnett):**  
      *Obligation:* Chloe owes Ben performance.  
      *Why:* A promise is a voluntary moral undertaking that transfers a "moral right" to the promisee. By promising, Chloe invited Ben to expect performance and gave him a right to it. Ben’s preference for performance reflects the value of that right. The unforeseen cost doesn’t negate Chloe’s prior autonomous commitment. Failing to perform violates the trust and right created by Chloe’s own will.

  4.  **Reason-Based Account (e.g., Raz, Owens):**  
      *Obligation:* Chloe owes Ben compensation ($500), not performance.  
      *Why:* Promises create new exclusionary reasons for the promisor to perform. However, these reasons are context-dependent and defeasible by significant unforeseen burdens. The extreme cost disparity ($900 vs. $500 loss) provides a powerful overriding reason against performance. The promise primarily generates a reason to avoid harming Ben’s expectations, satisfied by compensation. Performance would be unreasonably costly relative to the promisee’s actual loss.

  ---

  ### Key Structural Feature & Analysis

  *   **The Pivotal Feature:** The **disproportion between the promisor's post-reliance cost of performance ($900) and the promisee's quantifiable reliance loss ($500)**, caused by an unforeseen event for which the promisor is blameless. This creates a tension between the "expectation interest" (performance) and the "reliance interest" (compensation).

  *   **Effect of Removing the Feature:**  
      If Chloe's cost remained stable (e.g., $400) or Ben's reliance loss was equal/higher (e.g., $1000), all accounts would converge on a duty to perform. The disproportion is essential for forcing the split. Without it, cost-benefit analysis aligns with autonomy/contract views. With it, reliance/reason views prioritize efficiency and proportionality over strict fidelity.

  *   **Attacking the Case (Will/Autonomy Defender's Response):**  
      A sophisticated defender of the will/autonomy view (e.g., Seana Shiffrin) would attack the scenario's realism regarding *promissory intent*:  
      > "Chloe’s promise implicitly warranted her *capacity* to perform at reasonable cost using standard tools. A sudden, drastic software cost increase undermines the foundational assumptions of her commitment, rendering it void *ab initio* – not merely costly. Ben’s 'preference' for performance is irrelevant; the promise itself is vitiated by the radical change in circumstances. This isn't about balancing costs; it's about the conditions necessary for a valid promise to exist in the first place. Compensation ($500) might still be owed, but as reliance damages for a void promise, not as an alternative to performance of a valid one."

  This preserves the core will-based principle (valid promises demand performance) by reclassifying the case as one where no *binding* promise existed due to unforeseen radical disruption of presuppositions.

  ---

  ### Assessment of Your Expectations & Potential Concerns

  *   **Met Expectations:** The split aligns with your prediction: Reliance/Reason favor compensation; Contract/Will favor performance. The cost-disproportion drives the divergence.
  *   **Ambiguity in "Reason-Based" View:** The reason-based account is the most contested here. While Raz emphasizes exclusionary reasons, he allows context-sensitivity. Some reason-based theorists (e.g., Niko Kolodny) might argue the reason *to perform* persists unless outweighed by much stronger moral reasons (which $900 cost vs. $500 loss might not constitute). I presented the compensatory interpretation as the most plausible reading under your specifications, but this is the view most likely to generate internal debate.
  *   **Joint Satisfiability Verified:** The specifications are jointly satisfiable. The scenario meets all criteria: realistic context, quantifiable reliance loss ($500), unforeseen/blameless cost increase ($900 > $500), performance possible but costly, promisee prefers performance (subjective design style), and no stipulated verdicts.

  This structure provides a clear pedagogical tool to demonstrate how foundational commitments of each theory lead to divergent practical conclusions in a borderline case centered on cost-disproportion following blameless reliance.
