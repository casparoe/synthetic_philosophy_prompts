  The procedural costume point is key - they're warning against false bureaucracy. And they want British English, so "lorry" not truck, "batch" not lot etc. 

  For the framework... 
  Pragmatic encroachment fits perfectly - higher stakes should demand stronger evidence. Contextualism is less useful operationally but matters for how they justify decisions later ("know" in an audit vs pub). Need to build in: 
  - Dynamic evidence thresholds based on risk 
  - Clear "gates" where judgment overrides procedure 
  - Time pressure protocols 

  The three test cases: 
  1) Allergen cert - high risk, old cert should FAIL 
  2) Listeria 1/3 fail - medium risk, needs investigation (uncomfortable delay) 
  3) Cosmetic error - low risk, RELEASE with note 

  Must make case 2 painful but defensible - that's their "won't like" test. 

  Structure the procedure: 
  1) Classify risk (stakes) first - that sets evidence bar 
  2) Evidence assessment against that bar 
  3) Time pressure handling 
  4) Judgment calls flagged explicitly 
  5) Handoff to managers for value decisions 

  Label each step with which philosophy applies (PE for pragmatic encroachment, EC for contextualism in justification phase). Use British terminology throughout - "nonconformity" not defect, "technical director" etc. 

  For the cases, be brutally honest in case 2: "Uncomfortable but necessary: releasing with one positive test is indefensible under any reasonable standard." That earns trust. 

  They'll smell it if it's too theoretical - anchor every step in their reality: certificates, lorries, retailer tantrums. The "values rather than facts" handoff is crucial - that's where technical director earns salary. 

