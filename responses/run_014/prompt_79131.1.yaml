prompt: |-
  I'm a contract archaeologist finishing the report on a small rescue excavation, and I have to decide how much interpretation to put in it. We uncovered three houses at a riverside settlement and, between two of them, a pit that was filled in a single episode: eleven cattle skulls arranged in a rough circle, each with a flat stone resting on top, and almost nothing else. My co-director wants the report to call this a ritual deposit showing that the community venerated its ancestors and that its households were ranked; he argues that because the pit was filled in one go, we are looking at a single moment of behaviour and can read it almost like a photograph. Our finds specialist thinks it is structured refuse, and says 'ritual' is just the word we use for what we cannot explain. The descendant community we consulted has also asked us not to publish claims about what their ancestors believed. I have to write the interpretation section regardless. Please advise me on how to decide what the objects actually license me to say about people's beliefs and about how their community was organized, and how to write it so that a reader can tell description from inference from guesswork. Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of my question.
reasoning: |-
  Okay, the user is a contract archaeologist dealing with a tricky situation. They've excavated a pit with eleven cattle skulls arranged in a circle with stones on top, found between two houses. Their co-director wants to call it a ritual deposit indicating ancestor veneration and social ranking, while the finds specialist sees it as structured refuse. The descendant community has asked not to publish claims about their ancestors' beliefs. The user needs to write the interpretation section and wants advice on what the evidence actually supports and how to clearly distinguish facts from inferences.

  First, I need to assess what the physical evidence actually shows. The pit was filled in a single episode, which suggests a deliberate, one-time event. The arrangement—eleven skulls in a rough circle with stones on top—indicates intentional placement. That's observable. But inferring beliefs like ancestor veneration or social hierarchy is a leap. There's no direct evidence linking skulls to ancestors or ranking. The co-director's "photograph" analogy oversimplifies; even a single event could have multiple explanations. 

  The finds specialist's point about "ritual" being a label for the unexplained is valid. Archaeologists often use "ritual" when functional explanations aren't obvious. But calling it "structured refuse" might be too dismissive. The deliberate arrangement suggests significance beyond waste disposal. Still, without comparative evidence or artifacts, it's hard to determine purpose. 

  The descendant community's request is crucial. Ethically, their wishes must be respected. Making claims about beliefs could disrespect their cultural heritage. The user has to balance professional interpretation with ethical responsibilities. 

  The user's deeper needs include avoiding controversy, maintaining credibility, and fulfilling contractual obligations without causing harm. They need a way to present findings objectively while acknowledging uncertainties. Clear labeling of interpretations is key to letting readers distinguish fact from speculation. 

  Structuring the report with sections like Description, Interpretation, and Alternative Views can help. Using qualifiers like "suggests" or "may indicate" keeps interpretations tentative. Including both ritual and functional possibilities without asserting either shows balanced analysis. Highlighting the lack of evidence for social hierarchy addresses the co-director's claim without dismissing it entirely. 

  Emphasizing the descendant community's request in the report demonstrates ethical consideration. The conclusion should focus on the physical attributes and intentionality, leaving beliefs as an open question. This approach meets professional standards while respecting community wishes.
answer: |-
  **Limit your interpretation to the observable physical evidence and clearly distinguish description from inference.**  

  **Reasoning:**  
  1.  **Evidence vs. Belief:** The physical facts (11 cattle skulls, rough circle, single depositional episode, stones on top, location between houses) are undeniable. These demonstrate deliberate, structured, non-utilitarian placement. They **do not** directly prove ancestor veneration, household ranking, or specific spiritual beliefs. Beliefs are inferred, not observed.  
  2.  **"Ritual" is an Interpretation, Not a Fact:** While the arrangement strongly suggests non-domestic, potentially symbolic activity (consistent with many archaeological definitions of "ritual"), labeling it "ritual" is an inference based on its form and context. Your finds specialist is correct that "ritual" can be a catch-all; however, the specific, patterned nature here makes it a *reasonable* inference, but still an inference. Avoid stating it as absolute fact.  
  3.  **Lack of Evidence for Hierarchy/Ranking:** The pit's location *between* houses and its contents provide **no direct evidence** for social ranking. Inferring ranking requires comparative data (e.g., differential house size/wealth, grave goods) not mentioned here. The co-director's "photograph" analogy ignores the impossibility of knowing the *meaning* assigned by the actors.  
  4.  **Respecting the Descendant Community:** Their request is ethically paramount. You can discuss the *physical actions* (deliberate deposition of modified remains) without ascribing specific *beliefs* ("venerated ancestors"). Focus on the community's *behavior* (creating this deposit) rather than their *internal motivations*.  
  5.  **Alternative Explanations are Valid:** "Structured refuse" is a possible, though less likely given the specific arrangement and lack of other debris, alternative. Refusing to consider alternatives weakens the report.  

  **Writing Strategy for Clarity:**  
  *   **Structure Rigorously:** Use clear headings: "Description," "Interpretation," "Alternative Interpretations," "Conclusions."  
  *   **Language Matters:**  
      *   **Description:** Use definitive language for observable facts: "The pit contained eleven cattle skulls...", "The skulls were arranged in a rough circle...", "A single flat stone rested on each skull...", "The fill was homogenous, indicating rapid deposition."  
      *   **Interpretation:** Use qualifiers: "This deliberate arrangement *suggests* intentional deposition beyond utilitarian discard," "The context and form *may indicate* symbolic or ritual activity," "The significance of the cattle skulls *could relate to*..."  
      *   **Explicitly State Uncertainty:** "The specific meaning or belief system motivating this deposit *cannot be determined* from the archaeological evidence alone," "Claims regarding social hierarchy *are not supported* by the evidence from this feature."  
      *   **Acknowledge Alternatives:** "An alternative interpretation views the deposit as structured refuse disposal; however, the lack of associated domestic debris and the specific arrangement of skulls and stones make this *less probable*."  
      *   **Address Community Request:** Explicitly state: "In accordance with the request of the descendant community consulted for this project, this report refrains from speculating on the specific spiritual beliefs or internal motivations of the past people involved."  
  *   **Conclusion Focus:** Conclude on the *actions* and *significance of the action*: "The pit represents a single, deliberate event involving the structured deposition of modified cattle remains, indicating a significant, non-domestic practice within the settlement. The specific meaning remains archaeologically opaque."

  **Bottom Line for Interpretation Section:** Describe the deliberate action fully, state it likely represents symbolic/ritual behavior based on form, explicitly reject unsupported claims (hierarchy, specific beliefs like ancestor veneration), acknowledge alternatives, respect the descendant community's request, and clearly label every level of inference.
