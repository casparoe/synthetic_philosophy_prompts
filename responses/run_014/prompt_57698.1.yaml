prompt: |-
  I teach a graduate seminar on the Essays and I'm in the middle of a running argument with two of my TAs, who are convinced Montaigne is just a cultural relativist ahead of his time — they read the cannibals essay, hear him say that every one of us calls barbarous whatever isn't his own custom, and stop right there. I don't think that's the right label, and I don't think it's even the interesting question. So for next week I want to treat him as a judge with a track record instead of as a slogan, and spring on the seminar a case he never had to rule on, and see which account of his method actually predicts his verdict. I've written the rulings out as carefully as I can below — everything you need is in here, so you don't have to go hunting, and I'm not after quotations or chapter references, just the reasoning.

  Here's the record. On the peoples of the Brazilian coast: he reports that they take prisoners in war, keep them well for months, then kill, roast and eat them, and that they think it far worse to lacerate and torture a body that still feels than to eat one that is dead — and his verdict is that by the standard of reason we may call them barbarous, but that we outdo them in every kind of barbarity, and he lists the rack, the burnings, and the religious wars to prove it. On evidence: he says he would rather trust one plain honest man who reports only what he saw with his own eyes than the cosmographers who fill the gaps with invention, and his whole account leans on a servant of his who lived ten or twelve years in those parts. On their poetry: he turns a war song and a love song into French and rates them against the Greek lyric poets with no discount for who sang them. On their marriages, their long communal houses, their lack of trade, metal, agriculture and magistrates: he describes all of it without scandal and not without some envy. On the three visitors he met at Rouen as boys, through an interpreter: he records their two pieces of bewilderment — that grown armed men would take orders from a beardless child king, and that there were men starving at the gates while others went armed and well fed — and he's cross with himself for never having had the rest of their comments written down. On the conquest: his verdict is that what undid those peoples was not superior courage but bad faith, that they were bought and undone by men who came under the flag of trade and then betrayed the hospitality they'd been given, and that our vices and our diseases finished the job. Then two things elsewhere in the book that pull the other way. In the essay on custom he insists custom gets its grip on us by degrees — the woman in his story who carried a calf every day until she could carry the full-grown bull — and he counsels against lightly overturning a law once it is established, whatever its defects. And in the essay on cruelty he says his horror of bloodshed is not a reasoned virtue at all but a matter of temperament, that he cannot watch a chicken killed or hear a hare crying in the teeth of the hounds, and he openly doubts whether a man is any the better for a distaste he never chose.

  The new case is this. A design student — it's modelled on a real bioart piece I saw a few years ago — has grown a steak in a lab from cells donated by a living volunteer, who is healthy, who consents, and who intends to eat it herself at a ticketed gallery dinner with the whole process documented and disclosed. Nothing is killed, nobody is hurt, nobody is deceived, and biologically the meat is her own. Half my seminar already insists this is the one form of cannibalism that can't be objected to, since every objection has to bottom out either in a victim or in a lie. So: predict Montaigne's verdict, and lay out the candidate rules his record above is jointly consistent with — I can see three or four and I suspect you'll turn up ones I've missed. For each rule, say what it delivers on this case and how confident you'd be in that delivery. Then commit to a single best guess and defend it, which means dealing with the fact that the cruelty-first rule and the custom rule point in opposite directions here while the appeal-to-nature strand seems to cut both ways depending on whether you take his temperament remarks as evidence or as confession. Finally, name the follow-up case I should bring in the week after: a second, minimally different case that would seperate the top two rules, so that whichever way he goes on it one of them is refuted. And be honest with me at the end — if he does condemn the steak, is that a genuine problem for the TAs' relativist reading, or just proof that they grabbed the wrong name for something he's actually doing?
reasoning: |-
  Hmm, the user is a professor teaching a graduate seminar on Montaigne's Essays, locked in a debate with TAs who see Montaigne as a cultural relativist. They want to move beyond labels by presenting a hypothetical bioart case—lab-grown human steak for self-consumption—to test Montaigne's actual judicial pattern. The challenge is to predict his verdict based on his documented rulings, extract consistent principles, and design a follow-up case to refine the interpretation.

  First, unpacking Montaigne's record: His Brazilian ethnography shows layered judgment—condemning torture more than ritual cannibalism, valuing eyewitness testimony, appreciating indigenous poetry without exoticism. Key tensions emerge: 1) His cruelty aversion seems visceral rather than moral (confessed temperament), 2) Custom's weight increases with time (bull-carrying analogy), 3) Nature appears as both instinct (bloodshed horror) and rational standard (critique of European "barbarity"). 

  For the bioart case, three core principles surface:
  1) Anti-Cruelty Principle (strong): Since no suffering occurs, this likely gets a pass. Confidence: High—it directly mirrors his distinction between killing and post-mortem acts.
  2) Custom-Bound Stability Principle (medium): Lab meat disrupts deeply embedded food taboos. Confidence: Medium—he'd hesitate but not absolutely forbid, unlike overturning long-standing laws.
  3) Natural Sentiment Principle (ambiguous): His chicken/hare example suggests disgust might overwhelm reason here, but he's skeptical of such reactions as virtue. Confidence: Low—internally conflicted evidence.

  Best guess: Montaigne condemns it, not on relativist grounds but via the Custom-Bound Stability Principle. Why? The act violates a "bull-carried" taboo—even without victims, it risks eroding social cohesion. His self-doubt about temperament wouldn't override this; he'd see the gallery spectacle as reckless innovation. 

  Follow-up case: A dying patient consents to be eaten post-mortem by culturally willing recipients. This isolates Custom vs. Cruelty principles—if he permits it, Custom rules; if not, Cruelty (disgust) dominates. 

  Finally, relativism: If he condemns the steak, it doesn't refute relativism per se—he consistently uses external standards (reason, nature). The TAs mistake his cross-cultural comparison for relativism when he's actually benchmarking against a higher universal ethic. Their error is taking "barbarous" as purely perspectival rather than dialectical.
answer: |-
  Based on Montaigne's record, here's the reasoning for his verdict on the lab-grown steak, the candidate rules derived from his essays, and the follow-up case to test them:

  **Candidate Rules Consistent with Montaigne's Record:**
  1.  **The Anti-Cruelty Primacy Rule:** Actions causing *unnecessary suffering* (physical or psychological torment) are barbarous. Where no suffering exists, an act loses its primary barbarity. Confidence in application: **High**. *Verdict for steak: Permissible.* No suffering occurs to donor, animal, or deceived party. Directly aligns with his distinction between eating the dead and torturing the living in the cannibals essay and his temperamental horror of inflicted pain.
  2.  **The Custom-Bound Stability Rule:** Long-established customs/laws, however flawed, create social stability and identity. Overturning them lightly risks greater harm than tolerating their defects. Confidence in application: **Medium-High**. *Verdict for steak: Condemnable.* Cannibalism taboos are deeply embedded "bulls" carried by society for millennia. Disrupting this purely for novelty/gallery spectacle, even without victims, is reckless social experimentation. Rooted in his "bull-carrying" analogy and caution against rapid legal change.
  3.  **The Natural Sentiment Rule:** Deep-seated, involuntary human aversions (like disgust at bloodshed or cannibalism) carry moral weight, even if "unreasoned," because they reflect a fundamental aspect of human nature. Confidence in application: **Medium-Low** (due to his skepticism). *Verdict for steak: Condemnable.* The instinctive revulsion at consuming human flesh (even lab-grown, even self-consumed) is a powerful natural sentiment akin to his inability to watch an animal killed. He doubts its *virtue* but acknowledges its *force*.
  4.  **The Bad Faith/Harm Rule:** Acts involving deceit, betrayal of trust, exploitation, or the introduction of corrupting vices/diseases are barbarous. Confidence in application: **Low** for this case. *Verdict for steak: Neutral/Permissible?* The case explicitly avoids deception, betrayal, or harm. This rule seems inapplicable here unless stretched to see the *concept* as inherently corrupting, but his record focuses on concrete harms from bad faith.

  **Best Guess & Defense: Montaigne would *condemn* the steak.**  
  *   **Why Cruelty-First Doesn't Win:** While the absence of suffering is significant, Montaigne's record shows he doesn't *only* care about cruelty. His Brazilian verdict condemns European barbarity *despite* acknowledging the Tupinambá's cruelty (eating the dead). He uses multiple lenses. The lack of suffering here removes the *primary* barbarity but doesn't automatically sanctify the act.
  *   **Why Custom-Bound Stability Prevails:** The gallery dinner deliberately targets and violates one of humanity's most profound and widespread taboos – cannibalism – purely for intellectual/artistic provocation. This is the epitome of "lightly overturning" a deeply entrenched custom. Montaigne's emphasis on the *gradual*, identity-forming power of custom (the bull) and the danger of arbitrary disruption outweighs the lack of immediate victim here. He would see it as a dangerous frivolity, akin to the folly of the religious wars fought over doctrinal novelties, potentially eroding a fundamental social restraint.
  *   **Nature's Ambiguity Managed:** His temperamental aversion to bloodshed (the cruelty confession) *reinforces* the power of natural sentiment *against* the steak. While he doubts its status as *chosen virtue*, he doesn't dismiss its reality or social function. The act deliberately triggers this deep-seated revulsion, which Montaigne would see as significant evidence of its problematic nature. The appeal to nature here cuts *against* the steak, aligning with custom.

  **Follow-Up Case (Testing Anti-Cruelty vs. Custom-Bound Stability):**  
  **The Dying Wish Donation:** A terminally ill patient, fully lucid and consenting, requests that after their natural death from the disease, their body be processed (via ethical, painless means like high-heat cremation/pulverization) into nutrient bars to be consumed by consenting, culturally willing participants in a private, solemn ceremony honoring the deceased's belief in bodily recycling. No deception, no suffering caused by the act itself, profound cultural/religious significance for participants.  
  *   **Anti-Cruelty Primacy Rule:** Permissible (No suffering caused by the act).
  *   **Custom-Bound Stability Rule:** Condemnable (Still overturns the deep taboo against consuming human remains, even with consent and solemnity).
  *   **Why it Separates:** This case removes the "frivolity" of the art piece and adds significant cultural weight/solemnity akin to the Tupinambá ritual (which Montaigne contextualized). If Montaigne condemns the art steak but permits this, **Custom-Bound Stability** is weakened (the core taboo violation remains). If he condemns *both*, **Custom-Bound Stability** is strongly confirmed. If he permits both, **Anti-Cruelty Primacy** wins.

  **The TA's Relativism Problem:**  
  If Montaigne condemns the steak, it's **a genuine problem for a *simple* cultural relativist reading, but not proof they are entirely wrong about his method.**  
  *   **The Problem:** A strict relativist ("barbarous is merely not our custom") would expect Montaigne to say the steak is only "barbarous" to those who find it revolting, and permissible to those who don't. His condemnation would imply a *transcultural* standard – likely rooted in the profound weight of long-established custom itself, the power of natural sentiment, or the social danger of arbitrary disruption. He's judging the act *against* something beyond mere local opinion.
  *   **What They Grabbed:** They correctly identified his **methodological relativism** – his insistence on seeing other cultures through *their* logic and context before judging (as with the Tupinambá), and his critique of European hypocrisy. This *is* a core part of his approach.
  *   **What They Missed:** Montaigne isn't a *moral* relativist. He uses cross-cultural comparison not to say "all is equal," but to:  
      1.  **Unmask European hypocrisy/barbarity** (the cannibals vs. torture).  
      2.  **Identify transcultural touchstones** (aversion to *cruelty*, the functional value of *stability*, perhaps *reason* itself when stripped of prejudice).  
      3.  **Benchmark against "Nature"** (human temperament, functional social organization like the Tupinambá communal life he admired).  
  His verdicts arise from applying these comparative insights to arrive at judgments that often criticize his *own* culture more harshly, but still employ standards he believes have broader validity than mere custom. Condemning the steak wouldn't make him an absolutist, but it shows his relativism is a tool for critique, not a conclusion that suspends all judgment. The TAs mistook the *starting point* of his inquiry (understand others on their terms) for the *endpoint* (therefore no judgments possible). His record shows the endpoint is a more nuanced, self-critical, but still judgmental, application of reason and observation to human affairs.
