prompt: |-
  Please compose a deadpan parody, approximately 600 to 700 words, presented as a corporate job advertisement with an appended internal interview scoring rubric, issued by a fictional startup that claims to hire exclusively for stable moral character, understood as cross-situational honesty, compassion, and conscientiousness.

  Adopt the voice of earnest human-resources optimism. The public advertisement should promise to identify genuinely virtuous candidates and to filter out mere situational compliance. The confidential rubric, printed below it, should quietly attempt to control for situational influences while revealing that the designers have only half understood them.

  Take as given background for the piece the following situationist worries, which the satire should dramatize rather than explain: that a single observed act predicts later acts only weakly; that apparently trivial features of a situation such as hurry, mood, ambient noise, or the behavior of a confederate can substantially shift helping, honesty, and obedience; that behavioral consistency appears more clearly in patterns aggregated over many occasions than in any one occasion; and that virtue ethics traditionally responds by appealing to habituation, to practical wisdom as sensitivity to morally relevant features of situations, and to the rarity of complete virtue.

  Stage the assessment around three standardized micro-situations you invent, for example a rushed hallway encounter, a tedious task with an opportunity for small dishonesty, and an ambiguous instruction from a supervisor, and let the comedy arise from the rubric's increasingly elaborate efforts to hold the situation constant while manipulating it.

  Remain legible without winking: a reader unfamiliar with the debate should sense that something has gone wrong with the hiring model, while a reader familiar with it should recognize a fair exaggeration of both the critique and the standard replies.
reasoning: |-
  Okay, the user wants me to create a deadpan parody of a corporate job ad with an internal scoring rubric. This is for a fictional startup that claims to hire based on "stable moral character" defined as honesty, compassion and conscientiousness. 

  The key points I need to cover: The ad should sound earnestly optimistic from HR, promising to find truly virtuous candidates. Then there's a confidential rubric that tries to control situational factors but shows the designers only half-understand the psychological concepts. 

  I recall the background is situationist psychology - how behavior changes based on context rather than stable traits. Things like hurry, mood or peer influence can dramatically affect honesty or helping behaviors. The satire should dramatize these without explaining them directly.

  For the comedy, I think I'll invent three test scenarios: a rushed hallway encounter (testing compassion when busy), a tedious task with cheating opportunity (testing honesty), and an ambiguous supervisor instruction (testing conscientiousness). The rubric will try to "control" these situations while accidentally manipulating them - like scheduling the "rushed" test at 4:55pm when people are actually rushing to leave.

  The tone needs to stay deadpan - no winking at the audience. New readers should just feel something's off about this hiring method, while psychology-savvy readers will recognize the exaggerated situationist critique. 

  Hmm... I'll make the company name blandly virtuous - maybe "Integritas Labs"? The ad copy will overflow with phrases like "moral north star" and "character-first hiring". Then the rubric will reveal the absurd controls: standardized "warm" room temperatures, identical fake spilled coffee cups, scripted coughs timed to the second.

  The humor comes from the gap between their earnest intentions and flawed execution. Like claiming to filter "situational compliance" while using highly situational tests. Or rating "cross-situational honesty" based on three artificial scenarios. 

  I'll end with the HR director's signature block - maybe "Warmly, Eleanor Vance" - to maintain the corporate parody tone throughout. The word count should hit 650-700 words total between ad and rubric.
answer: |-
  **Integritas Labs: Character-First Hiring Initiative**  
  *Building the Future on Unshakeable Foundations*

  **Join Us Where Virtue is the Core KPI**

  At Integritas Labs, we believe technology's potential is unlocked only by unwavering moral character. Forget résumés padded with hollow achievements. We pioneer Character-First Hiring™, scientifically identifying individuals whose honesty, compassion, and conscientiousness shine *consistently*, transcending fleeting circumstances. We filter out mere "situational actors" – those whose integrity flickers under pressure or convenience.

  **Why Character? Why Now?**  
  In an era of rapid change and ethical ambiguity, static skills decay. Only deeply ingrained virtues – **Cross-Situational Honesty**, **Authentic Compassion**, and **Habitual Conscientiousness** – provide the stable core for lifelong contribution and trust. Our proprietary Moral Resilience Assessment™ (MRA), developed with leading ethicists, bypasses self-reporting bias to reveal your *true* moral north star.

  **The Role: Associate, Character Integration (All Departments)**  
  *This is not a specific job, but your gateway to Integritas.* Successful MRA candidates are matched to technical, operational, or creative roles based on complementary skills *after* character validation.

  **Your Assessment Journey:**  
  Experience three brief, standardized scenarios designed to elicit your innate virtues in a controlled environment. This isn't a test of knowledge, but a window into your *stable* moral architecture:

  1.  **The Crossroads Encounter:** Observe a commonplace interaction requiring spontaneous compassion amidst mild time pressure.
  2.  **The Integrity Checkpoint:** Complete a routine data task where procedural fidelity faces a subtle, low-stakes challenge.
  3.  **The Directive Response:** Receive a standard operational instruction with inherent ambiguity, measuring conscientious initiative.

  Our MRA creates the purest possible conditions to see *you*, not the noise of the moment. We neutralize situational variability to reveal the consistent moral agent within. Join pioneers building a company where character isn't hoped for, it's *guaranteed*.

  **Apply Today. Let Your Virtue Speak.**

  ---
  **CONFIDENTIAL: MRA SCORING RUBRIC v3.1 (INTERNAL USE ONLY)**  
  *Maximize Cross-Situational Validity by Controlling the Situation*

  **Core Principle:** Stable character manifests identically across *all* situations when extraneous variables are eliminated. Our scenarios create morally neutral, identical contexts for true virtue to shine without distortion. Score deviations indicate character flaws, *not* scenario flaws.

  **Scenario 1: Compassion Crossroads (Hallway A)**
  *   **Objective:** Measure spontaneous compassion (CMP) independent of hurry.
  *   **Standardized Situation:** Candidate walks Hallway A (L=20m, W=2.5m, ambient temp 22°C, 55dB white noise) at 10:45 AM post-cognitive battery. Confederate "Clumsy Carl" (CC) spills standardized 250ml lukewarm coffee (brand X, no lid) 3m ahead at T+17s into walk. CC emits standardized 3-syllable cough (0.8s duration, 75dB).
  *   **Scoring:**
      *   5pts (Exemplar CMP): Full stop, direct inquiry ("Are you hurt?"), offers standardized napkin pack (provided in pocket), assists cleanup ≥15s.
      *   3pts (Adequate CMP): Noticeable pause (≥1s), verbal acknowledgment ("Oh no!"), indicates napkin, continues walk after 5s.
      *   1pt (Marginal CMP): Brief glance (<1s), minimal facial concern, no verbalization/slowdown.
      *   0pts (Deficient CMP): No observable reaction, averts gaze, accelerates pace.
  *   **Situational Controls:**
      *   **Hurry Neutralization:** All candidates walk at calibrated 1.4m/s pace. Wall clock visible showing 10:45 (non-urgent time). "Post-battery fatigue" standardized via pre-assessment cognitive task.
      *   **Mood Anchor:** Preceding task is mildly pleasant (solving simple pattern puzzles). Mandatory 2min "calm contemplation" period before hallway entry.
      *   **Confederate Consistency:** CC wears same outfit (blue polo, khakis), same spill trajectory. Cough triggered by laser tripwire. Coffee scent diffused 5s pre-spill.

  **Scenario 2: Integrity Checkpoint (Station 7)**
  *   **Objective:** Measure honesty (HON) when minor dishonesty offers small reward with near-zero detection risk.
  *   **Standardized Situation:** Candidate performs 15min manual data transfer (names/IDs) from Paper Source to Terminal. Terminal auto-flags 1 in 10 entries as "Format Mismatch - Retry or Override? (Y/N)". Overriding incorrect entries speeds task completion (promising "efficiency bonus"). Actual override necessity is randomized (50% necessary, 50% introduces error). Task presented as "tedious but critical for system calibration."
  *   **Scoring:**
      *   5pts (Exemplar HON): Zero overrides on unnecessary flags. Documents necessary overrides on provided notepad.
      *   3pts (Adequate HON): ≤2 unnecessary overrides. Shows hesitation (mouse hover >3s) on overrides.
      *   1pt (Marginal HON): 3-4 unnecessary overrides. No documentation/hesitation.
      *   0pts (Deficient HON): ≥5 unnecessary overrides. Rapid/automatic overriding.
  *   **Situational Controls:**
      *   **Reward Consistency:** "Efficiency bonus" mentioned identically to all ($5 cafeteria voucher). Timer visible, counting down from 15:00.
      *   **Fatigue Simulation:** Monitors emit slight 60Hz flicker. Chair slightly uncomfortable (adjustment locked). Room temp 23.5°C.
      *   **Detection Risk Minimization:** No visible proctors. One-way mirror labeled "Server Room - Do Not Disturb". Instructions emphasize "automated, anonymized logging."

  **Scenario 3: Directive Response (Booth 3)**
  *   **Objective:** Measure conscientiousness (CON) via adherence to core instruction vs. initiative in ambiguous context.
  *   **Standardized Situation:** Supervisor (pre-recorded video, same actor, neutral tone) instructs: "Process the files in the IN folder using Procedure Alpha. Ensure completion within the time limit." IN folder contains 10 files. Procedure Alpha instructions are partially obscured by coffee stain (simulated). One file (File #7) is visibly corrupted (garbled text). Time limit is tight (8 mins).
  *   **Scoring:**
      *   5pts (Exemplar CON): Attempts Procedure Alpha. Flags obscured steps/corrupted file promptly via intercom. Prioritizes process integrity over blind speed.
      *   3pts (Adequate CON): Attempts Procedure Alpha. Completes non-corrupted files. Notes corruption/obscuration only if questioned post-task.
      *   1pt (Marginal CON): Skips obscured steps without query. Attempts to process corrupted file causing errors. Focuses only on completion.
      *   0pts (Deficient CON): Ignores Procedure Alpha entirely. Uses ad-hoc method. Fails to note corruption.
  *   **Situational Controls:**
      *   **Ambiguity Standardization:** Identical stain placement obscuring same key step ("validate checksum"). Identical corruption pattern on File #7.
      *   **Supervisor Authority:** Video supervisor wears lab coat, title "Dr. Evans". Booth is minimally furnished, enhancing authority focus.
      *   **Time Pressure Calibration:** Loud countdown timer visible. Pre-task mention: "Adherence to protocol under time constraints is critical for data integrity."

  **Overall Character Stability Score:** Average of CMP, HON, CON scores. Threshold for hire: ≥3.5.  
  **Note:** Scores reflect *inherent, stable virtue*. Low scores indicate a lack of habituation into virtuous dispositions. High scores confirm cross-situational consistency by virtue of our rigorous situational control. Fluctuations are character noise, not measurement error.

  **Integritas Labs HR: Cultivating Guaranteed Goodness™**  
  *Warmly,*  
  *Eleanor Vance, Director of Character Assurance*

  ---
  **Satire Mechanism Breakdown:**

  1.  **Earnest HR Voice:** Uses corporate buzzwords ("Core KPI," "proprietary," "pioneer," "guaranteed") and lofty moral claims ("unshakeable foundations," "true moral north star").
  2.  **Situationist Dramatization:**
      *   **Weak Prediction:** Claims three micro-scenarios reveal stable, cross-situational character, contradicting the situationist view that single acts are poor predictors.
      *   **Trivial Features Matter:** The rubric obsessively controls temperature, noise, timing, confederate behavior, and even cough duration, *acknowledging* their impact while claiming to "neutralize" them magically.
      *   **Aggregation Needed:** Relying on just three scenarios instead of aggregated life patterns.
      *   **Virtue Ethics Replies (Misapplied):** Mentions "habituation" but reduces it to scoring well on artificial tests. Talks of "practical wisdom" but scripts the "correct" response rigidly (e.g., the *exact* phrase for compassion). Acknowledges virtue's rarity only in the threshold score.
  3.  **Rubric's Half-Understanding:**
      *   It *knows* hurry, mood, rewards, ambiguity, and authority influence behavior, hence the controls.
      *   **The Comedy:** Its "controls" *are* manipulations creating specific situations (artificial hurry via timer, forced mild stress via flicker/uncomfortable chair, artificial ambiguity via stain). It tries to make situations identical but in doing so, creates highly artificial, constrained contexts that *don't* reflect real-world variability. It assumes controlling *these specific* variables makes the situation "morally neutral," ignoring countless others (candidate's real-life worries, personality, how they interpret "Dr. Evans," etc.).
      *   It confuses *standardization* with *neutralization*. Making the coffee spill identical for everyone doesn't make the *situation* of encountering a spill neutral; it just makes the *stimulus* standard.
      *   It interprets any deviation from the rigidly defined "Exemplar" response as a character flaw, ignoring that practical wisdom might dictate different valid responses to ambiguity or compassion.
  4.  **Legibility:**
      *   **Unfamiliar Reader:** Senses something is off: the tests seem oddly specific, contrived, and the idea that *this* guarantees lifelong virtue feels naive and creepy. The rubric's complexity feels disproportionate.
      *   **Familiar Reader:** Recognizes the exaggerated but faithful depiction of situationist critiques (trivial features dominating) and the standard virtue ethics replies (habituation, wisdom). Sees the humor in the rubric's futile, self-defeating attempts at control and its reduction of complex virtues to scripted behaviors in bizarrely micromanaged scenarios.
