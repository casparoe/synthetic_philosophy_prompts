  We are going to design an in-class activity where students, in small groups, try to build a scoring rule for two groups (Group A and Group B) that satisfies three fairness properties: 
   1. Calibration within groups (if the model assigns a risk score of R, then approximately R% of those people should reoffend/have the positive outcome)
   2. Equal false positive rates (FPR) across groups (same proportion of actually negative cases in each group are falsely predicted as positive)
   3. Equal false negative rates (FNR) across groups (same proportion of actually positive cases in each group are falsely predicted as negative)

   However, we will rig the base rates (the proportion of positive outcomes) to be different between the two groups. The impossibility theorem states that when base rates differ, it is impossible to satisfy all three properties simultaneously.

   Activity Design:
   - We will have two groups: Group A (with a high base rate) and Group B (with a low base rate).
   - We are going to simulate a simplified version of a recidivism prediction scenario (like COMPAS) but abstracted to a binary classification problem.

   Materials:
   1. Two sets of cards (or tokens) for each group, representing the actual outcomes. For example:
      - Group A: 80% positive (say, 16 positive and 4 negative) -> base rate 80%
      - Group B: 30% positive (say, 6 positive and 14 negative) -> base rate 30%
      Total: 40 individuals (20 per group). We can adjust the numbers for manageability.

   2. Each card should have a unique identifier (like a number) and the actual outcome (positive or negative). The students will not see the actual outcomes until the end (or until they are revealed step by step?).

   3. Scoring sheets for each group to assign scores and then set thresholds to make binary decisions.

   4. A worksheet to record the scores, thresholds, and then compute the three fairness metrics.

   Roles (if useful, for groups of 4-5 students):
   - Facilitator: guides the group through the steps, keeps time.
   - Data Keeper: records the scores and decisions.
   - Statistician: computes the fairness metrics.
   - Skeptic: questions whether the group is meeting all criteria and pushes for adjustments.

   Alternatively, we can let all students participate in all steps without strict roles.

   Stakes: We don't use real money. Instead, we can frame it as a challenge: "Your goal is to design a scoring system that meets all three fairness criteria. The group that gets the closest wins a prize (e.g., candy, or just bragging rights)."

   Timeline (75 minutes total):
   1. Introduction (5 mins): Explain the scenario and the three fairness properties without mentioning the impossibility. Present the two groups and the base rates (but don't reveal the actual outcomes yet). Explain that they have to assign a score (from 0 to 100) to each individual that represents the risk of positive outcome (e.g., recidivism). Then they must choose a threshold (the same for both groups) to convert the score into a binary prediction (above threshold = predict positive, below = predict negative).

