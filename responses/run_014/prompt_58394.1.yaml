answer: |-
  Here’s a focused, action-oriented prospectus draft centered on your "future-proofness" intuition. It avoids rehashing standard debates and zeroes in on your novel operational approach.

  ---

  **Dissertation Prospectus: Projectibility as Future-Proofness in the Goodman Problem**

  **1. Core Research Question:**  
  What is the minimal operational asymmetry between projectible (e.g., "green") and non-projectible (e.g., "grue") predicates, revealed *not* by past data or metaphysical simplicity, but by the adjustments required to maintain predictive calibration *after* a critical temporal discontinuity (e.g., 2030) without presupposing the predicate’s validity?

  **2. Why Standard Approaches Leave the Problem Open:**  
  Existing responses to Goodman’s "new riddle of induction" rely on:  
  - **Naturalness/Simplicity:** Claims that "green" is metaphysically simpler or more natural than "grue." *Problem:* This is either question-begging (defining "natural" to favor "green") or lacks independent operational criteria.  
  - **Past Track Record:** Assumes past predictive success favors "green." *Problem:* "Grue" has identical past success by construction.  
  - **Linguistic Practice:** Argues "grue" is parasitic on "green/blue." *Problem:* This doesn’t explain *why* such parasitism undermines projectibility.  
  *All fail to provide a non-circular, dynamic criterion grounded in how predicates behave under future evidence shifts.*

  **3. The Core Idea: Projectibility as Calibration Maintenance Cost**  
  We reframe projectibility as *future-proofness*: A predicate is projectible if, after a discontinuity (e.g., 2030), a learner using it can maintain predictive calibration with minimal, epistemically conservative adjustments (e.g., updating parameters *within* the predicate’s framework). Non-projectible predicates require radical, framework-abandoning shifts indistinguishable from adopting a new predicate.  
  - **Operational Test:** Compare two minimal AI learners:  
    - **Learner G:** Uses "green" (predicts emeralds remain green post-2030).  
    - **Learner GR:** Uses "grue" (predicts emeralds turn blue post-2030).  
    Post-2030, both observe new data (eeralds remain green). Each learner must *modify its model* to stay calibrated (minimize prediction error) using only:  
    (a) Parameter updates (e.g., adjusting confidence weights),  
    (b) Adding auxiliary hypotheses *consistent with their core predicate*.  
  **Hypothesis:** Learner G maintains calibration with low-cost adjustments (e.g., slightly increasing error tolerance). Learner GR requires high-cost changes (e.g., redefining "grue" or adding complex hypotheses contradicting its core definition), functionally equivalent to abandoning "grue."

  **4. Three-Month Work Plan (Conceptual Focus):**  
  **Phase 1: Formalize Learners & Calibration (Weeks 1-4)**  
  - Week 1: Define minimal learner architectures (e.g., Bayesian agents with simple hypothesis spaces: G: {All emeralds green}, GR: {All emeralds grue}).  
  - Week 2: Define "calibration maintenance" formally (e.g., minimizing cumulative prediction error over N observations post-2030 under a loss function).  
  - Week 3: Define permissible "adjustments":  
    - *Low-Cost:* Tuning parameters (e.g., prior strength, noise tolerance).  
    - *High-Cost:* Adding auxiliary hypotheses (e.g., "unless exposed to spacetime anomaly X"), requiring independent justification.  
  - Week 4: Formalize "adjustment cost" metric (e.g., complexity of auxiliary hypotheses, magnitude of parameter shifts, computational steps).  

  **Phase 2: Simulate Post-Discontinuity Dynamics (Weeks 5-8)**  
  - Week 5: Model Learner G’s response to post-2030 green data (e.g., minor Bayesian updating of priors/likelihoods; no core change).  
  - Week 6: Model Learner GR’s response to post-2030 green data (e.g., must explain why "grue" objects appear green: invent auxiliary hypotheses like "color perception failed," "time discontinuity didn’t occur").  
  - Week 7: Quantify calibration success & adjustment costs for both learners under identical data streams.  
  - Week 8: Test robustness: Vary learner architectures (e.g., frequentist models), discontinuity types (spatial, material), and data noise.  

  **Phase 3: Generalize & Test Limits (Weeks 9-12)**  
  - Week 9: Apply framework to other Goodman-style predicates (e.g., "emerose" = red if observed on Monday, green otherwise).  
  - Week 10: Explore if "cost asymmetry" holds for *non-time-indexed* gruelike predicates (e.g., "gred" = green if in Ecuador, red otherwise).  
  - Week 11: Identify edge cases where asymmetry collapses (e.g., if Learner GR’s auxiliary hypothesis is independently verified).  
  - Week 12: Synthesize criteria for "future-proofness": When does adjustment cost signal non-projectibility? Draft core argument.  

  **5. Why This Approach (Instead of Rehashing Predicates):**  
  This method bypasses semantic debates by:  
  - **Focusing on Actions:** It examines *what learners must do* to survive new evidence, not inherent properties of predicates.  
  - **Quantifying Epistemic Friction:** "Grue" imposes higher operational costs post-discontinuity, revealing a concrete asymmetry absent in past data.  
  - **Demanding Conservatism:** Learners cannot "cheat" by adopting ad hoc fixes indistinguishable from switching predicates (e.g., GR can’t just say "use green now").  

  **6. Success Criteria:**  
  - **Strong Result:** Demonstrable, quantifiable asymmetry in calibration maintenance cost favoring projectible predicates across varied models/discontinuities. A formal criterion for "epistemic future-proofness" emerges.  
  - **Moderate Result:** Asymmetry exists but depends heavily on learner architecture/adjustment rules, revealing context-specific projectibility.  
  - **Clear Deliverable:** A rigorous operational definition of projectibility grounded in dynamic resilience, transcending the "grue" stalemate.  

  **7. Failure Criteria:**  
  - **Symmetry:** If both learners require equally complex/radical adjustments post-discontinuity, the asymmetry dissolves.  
  - **Triviality:** If "adjustment cost" always reduces to pre-defined simplicity (e.g., GR’s fix is complex *because* "grue" was complex), the approach regresses to standard views.  
  - **Circularity:** If rules for "permissible adjustments" implicitly favor projectible predicates (e.g., banning GR’s auxiliary hypotheses while allowing G’s minor updates *without independent justification*).  

  **8. Summer Scope & Feasibility:**  
  - **Scope:** Purely conceptual/modelling work. No empirical data collection or exhaustive literature review required.  
  - **Feasibility:** Focused on formalizing 2-3 learner models and simulating their post-2030 behavior. Analysis uses existing tools (Bayesian updating, complexity metrics).  
  - **Risks Mitigated:** Edge cases (Week 11) test robustness; failure conditions (Sec 7) provide clear stopping points.  

  ---

  **Key Advantages of This Draft:**  
  - **Novelty:** Shifts focus from "what predicates *are*" to "how predicates *perform under stress*."  
  - **Precision:** Demands formal definitions of "calibration maintenance" and "adjustment cost."  
  - **Doability:** Breaks down summer work into weekly conceptual tasks (model-building, simulation, stress-testing).  
  - **Exit Ramps:** Explicit failure criteria prevent rabbit holes. Even a negative result (symmetry) advances the debate.  
  - **No Lit Dependence:** Stands on its own conceptual footing; citations (Goodman, Lewis, formal learning theory) can be added later.  

  **Next Step for You:** Flesh out the learner models in Week 1 (e.g., "A Learner G is a Bayesian agent with hypothesis h_G: P(color=green | time) = 1 ∀t"). This grounds the abstraction.
