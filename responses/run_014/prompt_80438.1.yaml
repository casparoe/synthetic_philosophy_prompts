prompt: |-
  So, weird new hobby: I retired from chemistry about two years ago and have been falling down the rabbit hole of philosophy of science lately, and a friend who teaches asked me to help grade a stack of exam scripts this week. Intro cognitive science class, short answer question, worth 10 marks. The question was:

  "In one page or less: describe the Wason selection task, state what Cosmides and Tooby (1992) found when they presented it in a social-contract frame, and evaluate wether this evidence really supports the claim that humans have a dedicated cognitive module for detecting cheaters in social exchange, or whether it is consistent with domain-general pragmatic reasoning."

  Here's one student's answer, verbatim:

  "The Wason selection task shows people four cards, each with a value on one side and a value on the other, plus a rule of the form 'if a card has property P on one side, then it has property Q on the other.' The participant may turn over any cards they like, and the task is to turn over exactly those that could show the rule is false. On the original abstract versions (a vowel on one side implies an even number on the other) most people do badly: they turn over the P card and the Q card, and miss the not-Q card, which is the only other card that matters.

  Cosmides and Tooby (1992) replaced the abstract content with a social one. In the version I was given, the rule was 'if you are over 20, then you may drink beer,' and the four cards showed 25, 18, beer, and soda. Here the same people who failed the abstract version reliably picked 18 and beer. Their explanation is that natural selection built us a dedicated module for detecting cheaters in social exchange, and the social-contract frame switches that module on, so the reasoning looks easy even though the logical structure is identical to the abstract case.

  I would say this is a classic just-so story: you can always invent a story about why we have a cheater detector, but the story does the explaining, not the evidence. Also, the task is easy in the social version because it lets people use real-world knowledge about bars and ID checks, which is just pragmatic reasoning with familiar content, not a special module at all."

  Can you give this a grade out of 10 and then walk through it point by point, saying for each claim whether it is right, wrong, or muddled, and why? I want to see exactly what would go in the margin comments, not just a verdict. And be specific about which parts of the last two paragraphs, if any, get the Cosmides-and-Tooby claim wrong rather than merely incomplete. No need to be gentle; the student is an adult.
reasoning: |-
  Okay, the user is a retired chemistry professor who's now grading cognitive science exams. They've shared a student's answer about the Wason selection task and Cosmides and Tooby's cheater detection hypothesis, asking for a detailed critique and grade. 

  Hmm, this is interesting - the user clearly knows their science but might be less familiar with cognitive psychology nuances. They want surgical precision: not just a grade but line-by-line annotations showing where the student nails it, oversimplifies, or misses key points. The "no need to be gentle" suggests they value rigor over hand-holding. 

  First, let's unpack the student's response. The Wason task description is textbook-perfect - concise yet complete. Full marks there. The Cosmides summary is mostly accurate but skips crucial details: they didn't just swap abstract for social content; they meticulously varied contexts (social contracts vs precautionary rules) to isolate cheater detection. The student oversimplifies the evolutionary argument as a "just-so story" - fair critique but ignores Cosmides' cross-cultural consistency evidence. 

  Ah, the pragmatic reasoning counterargument! The student lands a solid punch here, but fails to acknowledge that Cosmides tested familiarity controls (e.g., unfamiliar tribal rules still triggered cheater detection). That's a major omission - it weakens their "real-world knowledge" rebuttal. 

  Grade-wise... 7/10 feels right. Strong fundamentals but the critical evaluation lacks depth. Margin comments should spotlight: 
  - Praise for flawless task description 
  - Flagging the missing methodological nuance in Cosmides 
  - Noting that "just-so story" dismisses testable evolutionary predictions 
  - Highlighting the uncontrolled familiarity variable as a missed opportunity for deeper critique 

  The user's phrasing - "weird new hobby" - hints they're enjoying this intellectual detour. Might appreciate subtle nods to philosophy of science angles, like how Cosmides straddles adaptationism vs domain-general debates. No need to flatter though; their request for harshness means we should be brutally precise.
answer: |-
  Here's a granular breakdown and grade for the student's answer, followed by specific margin comments:

  **Grade: 7/10**

  **Breakdown & Margin Comments:**

  1.  **"The Wason selection task shows people four cards... could show the rule is false."**
      *   **Verdict:** **Correct & Clear.**
      *   **Comment:** Excellent concise description of the core task structure, logic, and typical failure pattern on the abstract version. Precise identification of the P, Q, and crucially, the neglected not-Q card.

  2.  **"On the original abstract versions... which is the only other card that matters."**
      *   **Verdict:** **Correct.**
      *   **Comment:** Accurate summary of poor performance on the abstract task and the common error (selecting P & Q instead of P & not-Q). Correct that not-Q (along with P) is necessary to falsify the rule.

  3.  **"Cosmides and Tooby (1992) replaced the abstract content with a social one."**
      *   **Verdict:** **Accurate but Incomplete.**
      *   **Comment:** Correct that they used social content, but crucially, it was framed as a specific **social contract** (permission rule: benefit requires meeting a requirement). This framing is essential to their hypothesis, not just any "social" content.

  4.  **"In the version I was given, the rule was 'if you are over 20, then you may drink beer'... 25, 18, beer, and soda."**
      *   **Verdict:** **Correct Example.**
      *   **Comment:** Accurate concrete example of a social contract version. Cards correctly identified as: P (over 20/25), not-P (under 20/18), Q (beer), not-Q (soda).

  5.  **"Here the same people who failed the abstract version reliably picked 18 and beer."**
      *   **Verdict:** **Mostly Correct, Slightly Muddled.**
      *   **Comment:** Correct that performance dramatically improves in this framing. However:
          *   "18 and beer" is slightly ambiguous. "18" is **not-P** (underage) and "beer" is **Q** (benefit taken). The *correct* choices are **P (25/over 20)** and **not-Q (soda/not beer)** to check for underage drinkers (cheaters: not-P taking Q) and those over 20 not drinking beer (irrelevant to cheating). The student likely *meant* "16" or "underage" and "beer", implying checking the age of the beer-drinker and the drink of the underage person, which *is* correct (P and not-Q). However, stating "18 and beer" literally lists not-P and Q, which is the *common error* on the abstract task. **This phrasing is technically incorrect/misleading.** They should have said "the underage person and the beer drinker" or "the 16/18 card and the beer card" with the implication of checking them *for potential cheating* (which requires turning P and not-Q). Assuming they meant the *correct* cards based on context, but the phrasing is poor.
          *   The comparison "same people" is often true anecdotally but C&T's main evidence comes from group comparisons showing a massive performance *difference* between abstract and social contract versions across participants, not necessarily strict within-subject.

  6.  **"Their explanation is that natural selection built us a dedicated module... the reasoning looks easy even though the logical structure is identical to the abstract case."**
      *   **Verdict:** **Accurate Summary of C&T's Claim.**
      *   **Comment:** Perfectly captures the core of C&T's evolutionary psychology explanation: a domain-specific "cheater detection" module activated by social contract rules, solving the isomorphic logic problem easily.

  7.  **"I would say this is a classic just-so story: you can always invent a story about why we have a cheater detector, but the story does the explaining, not the evidence."**
      *   **Verdict:** **Partially Valid Critique, but Overly Simplistic/Dismissive of the Evidence.**
      *   **Comment:** Fair point that evolutionary explanations *can* be post-hoc "just-so stories". However, C&T didn't *just* invent a story; they provided **empirical evidence** (the dramatic performance shift *specifically* with social contract rules compared to abstract and other semantically rich rules like precautionary) as support *for* that story. The evidence *is* doing work. Your critique needs to engage with *why* their evidence might be insufficient to prove the module claim, not just dismiss it as a story.

  8.  **"Also, the task is easy in the social version because it lets people use real-world knowledge about bars and ID checks, which is just pragmatic reasoning with familiar content, not a special module at all."**
      *   **Verdict:** **Valid Alternative Explanation, but Ignores Key C&T Evidence.**
      *   **Comment:** This is a strong counter-argument (domain-general pragmatic reasoning). **However, you miss a critical point from Cosmides and Tooby (1992): they explicitly tested the "familiarity/content" hypothesis.** They used social contract rules set in *unfamiliar* cultural contexts (e.g., tribal rules about eating cassava root and having tattoos). Performance *remained high* despite the unfamiliarity. C&T argued this shows it's the *structure* (social exchange/cheater detection) triggering the reasoning, not just familiarity or real-world knowledge. You should address this counter-evidence to their counter-argument.

  **Summary of Strengths and Weaknesses for Grading (7/10):**

  *   **Strengths (Why not lower):**
      *   Excellent, concise description of the Wason task and typical abstract performance. (Shows understanding)
      *   Correct identification of the social contract example and the improved performance. (Shows understanding)
      *   Accurate summary of C&T's core evolutionary module claim. (Shows understanding)
      *   Identifies a valid major criticism (just-so story risk) and proposes a strong alternative explanation (pragmatic reasoning). (Shows critical thinking)
  *   **Weaknesses (Why not higher):**
      *   **Muddled Card Selection (Point 5):** The phrasing "18 and beer" is technically incorrect and suggests confusion between the not-P card and the critical not-Q card, or at least very poor expression. This is a substantive error in describing the key result.
      *   **Incomplete Representation of C&T (Points 3 & 8):** Fails to emphasize the *specificity* of the **social contract** frame (not just any social content) and crucially **omits C&T's key evidence against the familiarity/pragmatic knowledge explanation** (unfamiliar cultural contexts). This weakens the evaluation.
      *   **Oversimplified Critique (Point 7):** Dismisses C&T's hypothesis as *merely* a "just-so story" without adequately acknowledging that their empirical findings (the specific pattern of performance differences) *are* the evidence offered in support of it. The critique needs more nuance.
      *   **Evaluation Could Be Deeper:** While the domain-general alternative is mentioned, the evaluation doesn't fully grapple with the *strength* of C&T's evidence for domain-specificity (beyond just the existence of an alternative explanation) or other critiques (e.g., definitions of "module", alternative domain-specific explanations like deontic logic).

  **Final Verdict Justification:** The answer demonstrates a solid grasp of the task, the C&T finding, and the core debate. However, the error in describing the card selection in the key result, the omission of critical counter-evidence presented by C&T themselves regarding familiarity, and the slightly superficial dismissal of the EP argument prevent it from scoring higher. 7/10 reflects good foundational knowledge but significant room for improvement in precision, completeness, and depth of critical evaluation.
