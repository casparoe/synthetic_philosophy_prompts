prompt: |-
  I'm not a researcher in this area, but I've been reading on my own about inverse reinforcement learning and the idea that we can figure out what someone actually wants simply by watching how they behave — the claim, roughly, that a person's preferences are written into their actions and we just have to read them off. I came to this through the AI-alignment debate, where IRL is often offered as a way to learn human values from examples of human action, and the more I read the more I suspect there's a serious problem I don't quite understand: it looks to me like the very same behavior could be produced by a bunch of different underlying reward functions, so I'm not sure how we could ever pin down the one that is "really" the person's preference. It matters to me because I keep seeing IRL proposed as a genuine solution to the value-learning problem, and I want to understand how much of that proposal is doing real work versus how much is just a sophisticated restatement of "watch and imitate."

  So please make this concrete rather than just agreeing with me in the abstract. Give me a specific, self-contained example — feel free to construct one, using a simple setting like a person or a robot moving through a small grid or a kitchen — in which two very different reward functions are both fully consistent with the same observed behavior, but would lead the person to act differently in some new situation that wasn't in the observations, so that the observations alone cannot tell you which reward function is the right one. Then, in plain terms, explain what this example shows about the claim that we can "read off" someone's real preferences from their actions, and whether there are any standard ways the IRL literature tries to break the tie between the competing reward functions — and, if so, what assumptions those tie-breakers quietly bake in.
