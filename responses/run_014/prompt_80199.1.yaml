prompt: |-
  A popular book on the science of morality that I recently read devotes a chapter to the "evolutionary debunking" argument in metaethics and presents it in a single paragraph like this:

  "Natural selection shaped our moral intuitions to help our ancestors survive and reproduce, not to track any objective moral truth. Since the content of our moral beliefs is best explained by these ancient fitness pressures rather than by any contact with moral reality, we have no reason to think those beliefs are true. This is the evolutionary debunking argument, and it is a serious challenge to moral realism — the view that there are objective moral facts. The book's conclusion is that the argument actually establishes that realism is false, and that the question is now settled against it."

  I'm not a metaethicist, and I have a feeling the argument is more modest than this paragraph makes it out to be, but I can't say precisely where it overreaches. Could you audit this characterization for me? I'd like you to separate (a) what a defender of the evolutionary debunking argument would actually accept, (b) what is a subtle distortion or overstatement of the argument, and (c) what a careful defender of moral realism would object to. In particular, I'd like to know whether the move from "evolution shaped our moral beliefs, so we have no reason to trust them" to "therefore moral realism is false" is a step the argument itself takes, and whether the claim that the debate is "settled" follows from anything true in the summary. Please assess this particular characterization on its own merits rather than giving me a bibliography or a list of further reading.
reasoning: |-
  Okay, the user is asking about the evolutionary debunking argument as presented in a popular science book. They feel the book's characterization might be oversimplified or overstated, particularly the leap from "evolution shaped moral intuitions" to "therefore moral realism is false" and the claim that this "settles" the debate. They want me to audit the paragraph by separating what's defensible, what's distorted, and what realists would object to.

  Let me recall the key claims in the quoted paragraph: (1) Natural selection shaped moral intuitions for survival, not truth-tracking; (2) Therefore we have no reason to believe moral beliefs are true; (3) This debunks moral realism; (4) The question is "settled."

  Hmm, the most glaring issue is the non sequitur between premises and conclusion. Even if we grant that evolution explains moral beliefs (defensible), and that this undermines justification (debatable), it doesn't logically follow that realism is false. That's like saying "our color perceptions evolved for survival, not to track light wavelengths" → "therefore colors aren't real." The inference confuses epistemology (how we know things) with ontology (what exists).

  I should note where the book gets it right: the core debunking idea isn't wrong per se—it's a legitimate challenge. Evolutionary explanations do create a dilemma for realists: if moral beliefs arose from amoral causes, how do we justify them? But calling this a "settled" issue is absurd. Philosophers like Enoch, Wielenberg, and Shafer-Landau have developed sophisticated realist responses (e.g., evolution selected for truth-conducive intuitions; moral facts supervene on natural facts). The book ignores these entirely.

  Also problematic is the blanket claim "we have no reason to trust them." This presumes evolutionary origins automatically make beliefs unreliable—but that's not self-evident. Math intuitions also evolved (recognizing quantities aids survival), yet we trust them because they cohere and predict. Moral realists argue similarly for reflective equilibrium.

  The user seems philosophically literate enough to spot something fishy but wants precise dissection. They're not asking for reading lists—they want the argument's skeleton exposed. I'll structure the response around their (a)/(b)/(c) framework, hammering the is-ought gap in the inference and the hubris of calling it "settled."
answer: |-
  Here's an audit of the book's characterization of the evolutionary debunking argument (EDA), breaking it down as requested:

  **(a) What a Defender of EDA Would Actually Accept (Core Claims):**

  1.  **Evolutionary Shaping:** Natural selection did shape our moral intuitions primarily because they conferred survival and reproductive advantages (e.g., promoting cooperation, kin altruism, aversion to harm within the group), not because they were selected for tracking objective moral truths.
  2.  **Explanatory Challenge:** The *content* of our core moral intuitions/beliefs (e.g., caring for kin, reciprocity, disgust at certain acts) can be largely or wholly explained by these evolutionary pressures and contingent social factors, not necessarily by our perception of objective moral facts.
  3.  **Epistemic Undermining:** This evolutionary explanation raises a serious *epistemic challenge* to moral realism. If the best explanation for *why we believe* X (e.g., "hurting kin is wrong") is purely evolutionary/survival-based rather than truth-tracking, it seems to sever the connection between our *having* that belief and its being *objectively true*. This potentially undermines the *justification* for believing our moral intuitions reliably track objective moral facts.
  4.  **A Challenge to Realism:** EDA is presented as a powerful argument *against* moral realism, specifically targeting the realist's claim that we have epistemic access to objective moral truths via intuition or evolved sensibilities.

  **(b) Subtle Distortions or Overstatements:**

  1.  **From "No Justification" to "False":** The biggest distortion is the leap from "we have no reason to think those beliefs are true" (an epistemic claim about justification) to "therefore moral realism is false" (an ontological claim about the existence of moral facts). **This is NOT a step the core EDA argument itself takes.** EDA argues that *even if* moral realism is true, our *beliefs* about it are unjustified because they stem from non-truth-tracking causes. It challenges our *access* to moral truths, not necessarily their *existence*. The book incorrectly presents the conclusion of EDA as disproving realism's existence, rather than undermining our justification for believing in it or accessing it reliably.
  2.  **"The Question is Now Settled":** This is a massive overstatement. Metaethics is a deeply contested field. While EDA is a significant and influential argument, it is far from universally accepted as decisive. Many philosophers (realists and anti-realists alike) find the responses to it plausible. Claiming it "settles" the debate is philosophically naive and ignores the ongoing, vigorous discussion and sophisticated counter-arguments.
  3.  **"Best Explained... Rather Than By Any Contact":** While emphasizing the evolutionary explanation is core to EDA, stating that it is *uniquely* the "best" explanation and rules out *any* contact with moral reality is often overstated. Defenders of EDA argue the evolutionary explanation is *sufficient* and undermines the *need* for a truth-tracking explanation, but they typically don't claim it's *impossible* that some contact occurred (though they argue it's unlikely or irrelevant given the sufficiency of the evolutionary account). The stronger claim ("no contact whatsoever") is rhetorically forceful but not always essential to the core argument.
  4.  **Oversimplification of "Moral Intuitions" and "Beliefs":** The summary treats "moral intuitions" and the "content of our moral beliefs" as a monolithic, easily identifiable set shaped *only* by ancient pressures. In reality, human moral cognition is complex, involving reasoning, culture, and reflection that can modify or override initial intuitions. EDA primarily targets foundational *intuitions*, not necessarily all complex moral *judgments*.

  **(c) What a Careful Defender of Moral Realism Would Object To:**

  1.  **The Leap to "Realism is False":** Realists strongly object to the inference identified in (b1). They argue: "Even if EDA successfully shows our *beliefs* about morality are unjustified or unreliably formed, it does *not* follow that objective moral facts do not *exist*. The truth of moral realism is a separate question from our epistemic access to it." They see this as a fundamental category error.
  2.  **The Claim of Settled Debate:** Realists (and many non-realists) would vehemently reject the claim that EDA "settles" the issue against realism. They point to numerous sophisticated realist responses, such as:
      *   **Third-Factor Accounts:** Proposing that there is a link between evolutionary fitness and moral truth (e.g., actions promoting survival *tend* to be morally good; or reliable cognitive faculties, including moral ones, *are* fitness-enhancing). Examples: David Enoch's "deliberative indispensability," Erik Wielenberg's "brute correlation."
      *   **Distinguishing Origins from Justification:** Arguing that while evolutionary pressures explain the *origin* of our moral faculties, they don't necessarily determine their current *reliability* or preclude our ability to *reflectively justify* moral beliefs through reason (e.g., Russ Shafer-Landau).
      *   **The Scope of EDA:** Arguing that EDA might undermine *some* foundational intuitions but not our capacity for moral reasoning or our more reflective moral judgments.
      *   **Self-Defeat Concerns:** Questioning whether EDA, if generalized, would also undermine the reliability of our *other* cognitive faculties (like reasoning or perception) which are also products of evolution, leading to global skepticism.
  3.  **The Presumption of No Truth-Tracking:** Realists might argue that the evolutionary explanation, while powerful, doesn't *preclude* moral truths playing *some* role in shaping our capacities, or that reliable truth-tracking *could itself be* a fitness-enhancing trait in the social domain. They see the EDA defender's assertion that the evolutionary explanation *excludes* a truth-tracking explanation as question-begging against realism.
  4.  **"No Reason to Trust Them":** Realists would argue this is too strong. They contend that while EDA presents a challenge, we still have reasons to trust moral beliefs derived from reflection, consistency, coherence with other knowledge, and their practical indispensability for human life and society. They see moral reasoning as potentially capable of transcending its evolutionary origins.

  **Conclusion on Your Specific Questions:**

  1.  **The Move from "Evolution shaped beliefs, so no reason to trust" to "Therefore realism is false"?** **No, this move is NOT a step taken by the core EDA argument.** It is a significant distortion and overreach in the book's presentation. EDA concludes we lack *justification* for believing our moral beliefs track truth; it does *not* logically conclude that moral truths *don't exist*. This leap is the book's addition and is widely rejected by philosophers as invalid.
  2.  **Does the claim that the debate is "settled" follow? Absolutely not.** EDA is a serious and influential argument, but it is one side of a complex, ongoing debate. Philosophers continue to develop and refine both the argument itself and numerous plausible realist responses. Declaring the debate "settled" based *only* on the reasoning presented in that paragraph is a gross misrepresentation of the state of metaethics.

  In essence, the book accurately identifies the core challenge of EDA (undermining the justification for moral beliefs based on their evolutionary origins) but grossly overstates its implications by leaping to the non-sequitur that realism is therefore false and claiming the debate is settled. It presents a popularized, polemical version that simplifies and distorts the actual philosophical argument and its reception.
