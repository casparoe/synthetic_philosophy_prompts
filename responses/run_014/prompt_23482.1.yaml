answer: |-
  Your conceptual challenge centers on whether pragmatic factors affect the *nature* of knowledge itself or merely the *appropriateness of ascribing* it. Let's clarify this using a simple case, then address self-knowledge and the three views you specified.

  ### Core Case: Identical Epistemic Position, Divergent Stakes
  **Scenario:**  
  - **Low-Stakes (LS):** Sarah casually wonders if the bank is open Saturday. She has a reliable memory of seeing Saturday hours posted last week. No urgent need; if wrong, she’ll return Monday.  
  - **High-Stakes (HS):** Same evidence, same reliability. But Sarah must deposit a check by Saturday to avoid foreclosure. If wrong, she loses her home.  

  **Problem:**  
  - If pragmatic encroachment holds, Sarah *knows* in LS but *does not know* in HS, despite identical evidence/reliability. This suggests practical stakes affect knowledge itself. But how can her *epistemic achievement* change without new evidence?  

  ---

  ### Three Views on What Varies with Stakes  
  1. **Speaker-Sensitive Contextualism**  
     - **Claim:** "S knows p" is true/false relative to the *speaker's* context (e.g., their stakes, conversational norms).  
     - **Case Application:**  
       - If *you* (low-stakes speaker) say "Sarah knows," it’s **true** (LS standards apply).  
       - If a *loan officer* (high-stakes) says "Sarah knows," it’s **false** (HS standards apply).  
     - **Self-Knowledge Problem:**  
       - Sarah in HS might think, "I know the bank is open." But if her *own* high stakes raise the epistemic standard for *all* speakers, her self-ascription ("I know") is **false**. This undermines her self-knowledge: she can’t correctly affirm knowledge *even if she reflects carefully*.  
       - *Rebuttal:* Contextualists often argue self-ascriptions use the *subject’s* context. Sarah in HS would say "I don’t know" because *her* standards are high. But this blurs into subject-sensitive views (see below).  

  2. **Subject-Sensitive Invariantism (SSI)**  
     - **Claim:** "S knows p" is true/false relative to *S’s* practical situation. Truth is *invariant* across speakers but *sensitive* to the subject’s stakes.  
     - **Case Application:**  
       - In LS: "Sarah knows" is **true** (her stakes are low).  
       - In HS: "Sarah knows" is **false** (her stakes are high), *regardless of who asserts it*.  
     - **Self-Knowledge Problem:**  
       - In HS, Sarah *does not know p*. Can she know *that* she doesn’t know?  
       - **Objection:** If she recognizes her high stakes, she might suspend belief, so she *correctly* believes she lacks knowledge. But if she *ignores* her stakes, she might falsely believe she knows.  
       - *Defender’s Response:* Knowledge requires proper sensitivity to stakes. In HS, Sarah *should* seek more evidence; if she doesn’t, her belief isn’t justified, so she *can’t* know p or know that she doesn’t know. Self-knowledge survives only if she’s aware of her practical context.  

  3. **Pragmatic Encroachment on Knowledge Itself**  
     - **Claim:** Knowledge is *constitutively* practical. Stakes alter the *epistemic conditions* for knowledge (e.g., required justification level).  
     - **Case Application:**  
       - In LS: Sarah’s evidence suffices for knowledge.  
       - In HS: The *same evidence* is insufficient because risk tolerance is lower.  
     - **Self-Knowledge Problem:**  
       - Sarah in HS might introspect and think, "My evidence hasn’t changed, so I know." But if high stakes *objectively* raise the justification threshold, she’s wrong.  
       - *Defender’s Response:* Self-knowledge requires grasping *all* knowledge conditions, including practical ones. Sarah can know she lacks knowledge by recognizing her stakes demand more evidence.  

  ---

  ### Resolving the Self-Knowledge Tension  
  **The Core Issue:**  
  If knowledge depends on stakes, how can Sarah *know* her own knowledge state when stakes change? For example:  
  - In LS, Sarah knows p. She might truly say, "I know p."  
  - In HS, if she no longer knows p, can she know *that* she doesn’t know?  

  **Pragmatic Encroachment Responses:**  
  1. **Stakes as Part of the "Knowing" Relation:**  
     - Knowing *that you know p* (KKp) requires assessing your epistemic situation *under current stakes*. If Sarah in HS understands her evidence is now insufficient, she can know she lacks knowledge.  
     - *Analogy:* Just as you can know your umbrella is insufficient for a hurricane (though adequate for drizzle), Sarah can know her evidence is insufficient for high stakes.  

  2. **Denying Stakes Affect Introspection:**  
     - Sarah’s *awareness of her evidence* remains constant, but knowledge requires *acting appropriately* on that evidence given stakes. In HS, she *should* doubt, and this doubt blocks KKp.  

  **Avoiding "Irrelevant Speaker" Dependence:**  
  - Both SSI and pragmatic encroachment tie truth to the *subject’s* stakes, not the speaker’s. This prevents a speaker’s arbitrary context from dictating whether Sarah knows.  

  ---

  ### Why Your Friend’s Speech-Act View Isn’t Enough  
  Treating "S knows p" as a speech act (e.g., licensing action, closing inquiry) explains *why* we ascribe knowledge variably but doesn’t resolve whether Sarah’s epistemic state *actually changes*. Consider:  
  - If knowledge ascriptions *only* regulate action (e.g., "You know p" ≈ "Act on p!"), then in HS, we shouldn’t say "Sarah knows" because acting on p is risky.  
  - **But:** This leaves untouched whether Sarah *possesses knowledge* in a stakes-invariant sense. If she does, pragmatic encroachment is merely linguistic. If not, speech-act views must still explain *what knowledge is*.  

  ---

  ### Key Takeaways for Your Seminar  
  1. **Pragmatic Encroachment vs. Contextualism:**  
     - Encroachment claims stakes affect knowledge *itself* (making it partly practical).  
     - Contextualism claims stakes affect the *semantics* of "knows."  

  2. **Self-Knowledge Survival:**  
     - All pragmatic views can salvage self-knowledge by arguing subjects must factor stakes into their epistemic self-assessment. Sarah’s ability to know *that_ she knows requires her to appreciate her practical context.  

  3. **Which View Best Avoids Irrelevance?**  
     - **Speaker-sensitive contextualism** fails—it makes Sarah’s knowledge depend on others’ needs.  
     - **Subject-sensitive invariantism/pragmatic encroachment** succeed by tethering knowledge to the subject’s own practical reality.  

  **Simple Resolution:** Imagine knowledge as a *license to act*. In LS, Sarah’s evidence grants her a license; in HS, the same evidence doesn’t because the cost of error is too high. On this view, self-knowledge requires Sarah to track not just her evidence, but whether it licenses action *in her current situation*. This preserves the unity of her epistemic achievement while acknowledging stakes transform its practical significance.
