  ### Why This Fits
  - **Recursive categorical buffering** explicitly names the pattern:  
    - *Recursive*: Critiques trigger repeated rounds of sub-categorization.  
    - *Categorical*: Focuses on demographic groupings (e.g., cohorts).  
    - *Buffering*: The new sub-categories "shield" the original category from criticism while amplifying its institutional footprint.  
  - It accounts for all three elements you noted: methodological circularity, persistence/layering, and external reinforcement.  
  - This concept draws from philosophy of social science (e.g., critique of reification) and sociology of knowledge (e.g., institutional adoption), but synthesizes them into a novel framework for demography and audience research.  

  Use this to analyze cases like "Xennials" buffering "Millennials" or "Zillennials" buffering "Gen Z"—each sub-cohort is a product of the same machinery it critiques, yet entrenches the broader system.
