prompt: |-
  You are a philosopher of social science who also knows how birth-cohort categories get used in market research, polling, and journalism. Think carefully, and sketch a list of candidate concepts to yourself before committing to an answer. Please write in American English.

  I work in audience research and keep running into a pattern I have no name for. It goes like this. A birth-year bracket is in wide use — say, people born in a given sixteen-year stretch — with a bundle of traits attached to it (student debt, delayed homebuying, phone habits). Someone objects that the bracket is arbitrary and that the traits really belong only to its later members. Rather than drop the bracket, the discussion produces a narrower bracket straddling the boundary, presented as more accurate, which leaves the original category untouched. The same thing then happens at the far end of the preceding bracket, and again with the newest cohort, so that every criticized category sprouts one or two flanking sub-categories.

  Three things strike me about it. First, the sub-categories are built with exactly the machinery the critic objected to — another round-numbered year cutoff, another trait bundle — so the objection is answered by more of the thing it was an objection to. Second, the coarse categories are never retired; they simply acquire an outer layer of narrower ones, and the whole scheme looks more empirically articulated after each round of criticism than before. Third, outside the argument, the new finer labels get picked up by advertisers, HR decks, and news desks, so the scheme gains institutional footing precisely as it is being attacked.

  I know the folk idea that a label can shape the people it is applied to, and I know roughly what an ad hoc rescue looks like, but neither seems to be this. Is there an established concept — in philosophy of social science, sociology of knowledge, or the methodology of demography — that names this specific defensive pattern? I am not after the bare label: I want the carving.

  Format: a short prose discussion, then (1) a table of candidates with the columns concept | field of origin | what it does explain | where my description diverges | verdict (fits / near miss / no), and (2) a JSON object for the label you would endorse or coin, with the fields name, definition, necessary_conditions (array of strings), sufficient_conditions (array of strings), boundary_cases (array of objects with case, counts_as_instance, why), and related_but_distinct (array of objects with concept, difference).
reasoning: |-
  We are dealing with a phenomenon in social categorization where broad birth cohort categories (e.g., generational labels like Millennials) are criticized for being arbitrary and not uniformly applicable, leading to the creation of narrower sub-cohorts at the boundaries. However, the original categories remain in use, and the process repeats, resulting in a layered structure of categories that becomes more complex without abandoning the original broad categories. The new sub-categories are created using the same method that was criticized (arbitrary cutoffs and trait bundling), and the entire system gains institutional traction even as it is being criticized.

  Key features of the phenomenon:
  1. **Defensive sub-categorization**: When a broad category is challenged for being arbitrary and not uniformly applicable (especially at its boundaries), the response is to create new sub-categories that address only the boundary issues, without discarding the original category.
  2. **Persistence of original categories**: The original broad category remains in use, now alongside the new sub-categories.
  3. **Institutional entrenchment**: The new sub-categories are adopted by various institutions (advertising, HR, media), which reinforces the entire categorical system.
  4. **Methodological circularity**: The sub-categories are constructed using the same arbitrary methods (round-numbered year cutoffs, trait bundling) that were the subject of the original critique.

  Now, let's consider established concepts that might relate to this pattern:

  1. **Reification** (in social science): Treating abstract concepts (like social categories) as if they are real, concrete entities. While this might explain the persistence of categories, it doesn't capture the dynamic of creating sub-categories in response to criticism.

  2. **Boundary work** (sociology of science): The process by which groups create, maintain, and break down boundaries to establish authority or legitimacy. This might be relevant to the creation of new boundaries, but it typically occurs in scientific controversies and doesn't necessarily involve the layering of categories without retiring the old ones.

  3. **Categorical stretching** (social science methodology): When a category is extended to cover cases that don't quite fit, potentially diluting its meaning. This is the opposite of what is happening here, where instead of stretching, we are creating new sub-categories.

  4. **Ad hoc hypothesis** (philosophy of science): Adding an auxiliary hypothesis to save a theory from falsification. This is similar in that it's a defensive move, but it typically applies to scientific theories and not to the structure of social categories. Also, the creation of sub-categories is more about refining the category than adding an auxiliary hypothesis.

  5. **Conceptual gerrymandering** (philosophy of language/social science): This term is not standard, but it might be coined to describe the arbitrary redrawing of category boundaries to serve practical purposes (like political gerrymandering). It captures the arbitrary boundary setting but may not encompass the entire pattern.

  6. **Generational webbing** (not established): This is a made-up term. It doesn't exist as an established concept.

  7. **Cohort fragmentation** (demography): The process by which a birth cohort is divided into smaller groups. However, this is a neutral term and doesn't capture the defensive aspect or the institutional entrenchment.

  8. **Institutional isomorphism** (sociology): The process by which organizations in a field become similar. This might explain the adoption by advertisers, HR, etc., but doesn't address the creation of sub-categories in response to criticism.

  9. **Semantic drift** (linguistics): The evolution of word meanings. Not directly applicable.

  10. **Cohort splitting** (not established): Similar to fragmentation.

  After reflection, the phenomenon seems to be a specific form of **categorical defense mechanism** that involves **recursive boundary refinement**. However, I am not aware of an established term that exactly captures this.

  Let me propose a new term: **Recursive Cohort Elaboration (RCE)**.

  Definition: A defensive pattern in social categorization where criticisms of a broad birth cohort category's arbitrariness and non-uniformity are addressed by creating one or more narrower sub-cohort categories at the boundaries, using the same arbitrary methods, while preserving the original category. This leads to a layered categorical structure that becomes more complex and gains institutional adoption, thereby reinforcing the entire system.

  Necessary conditions:
  - Existence of a broad, socially constructed category (e.g., a generational label) that is in wide use.
  - Criticism that the category is arbitrary and that the traits attributed to it are not uniformly distributed (especially at the boundaries).
  - Response to criticism by creating new sub-categories at the boundaries without abandoning the original category.
  - The new sub-categories are constructed using the same kind of arbitrary cutoffs and trait bundling.
  - The new sub-categories are adopted by institutional actors (media, marketing, etc.), reinforcing the system.

  Sufficient conditions: 
  If the above process occurs and then repeats at the boundaries of adjacent categories (or the same category at the other end), leading to a multi-layered structure.

  Boundary cases:
  - Case: A critic points out that the category is arbitrary, and in response, the original category is abandoned and replaced by a completely new set of categories. 
    - Counts as instance? No, because the original category is not preserved.
  - Case: A new sub-category is created without any criticism, just for more granular analysis. 
    - Counts as instance? No, because it lacks the defensive response to criticism.
  - Case: The new sub-category is created using a different methodology (e.g., statistical clustering) rather than the same arbitrary method. 
    - Counts as instance? No, because one of the necessary conditions is that the same arbitrary method is used.

  Related but distinct concepts:
  - **Ad hoc rescue**: In philosophy of science, an auxiliary hypothesis added to save a theory from falsification. Difference: RCE is about social categories and involves creating new sub-categories (not just auxiliary hypotheses) and institutional adoption.
  - **Reification**: Treating social constructs as natural kinds. Difference: RCE is a dynamic process of category refinement and institutionalization, while reification is a static error.
  - **Boundary work**: In sociology, efforts to create, maintain, or break boundaries to establish authority. Difference: Boundary work is about demarcating science from non-science, and it doesn't necessarily involve the recursive layering of categories without retiring the old ones.

  Now, for the table of candidate concepts:

  | concept               | field of origin          | what it does explain                                          | where my description diverges                                 | verdict   |
  |-----------------------|--------------------------|--------------------------------------------------------------|---------------------------------------------------------------|-----------|
  | Reification           | Social science           | Treating social constructs as real entities, leading to persistence. | Does not explain the creation of sub-categories in response to criticism. | near miss |
  | Boundary work         | Sociology of science     | How boundaries are drawn to establish authority.             | Typically about science/non-science, not about intra-category refinement in demography. | near miss |
  | Ad hoc hypothesis     | Philosophy of science    | Adding auxiliary hypotheses to rescue a theory.              | Applies to theories, not social categories; no institutional adoption aspect. | near miss |
  | Categorical stretching | Social science          | Extending a category to include new cases.                   | This is the opposite: we are not stretching but creating sub-categories. | no        |
  | Institutional isomorphism | Sociology            | Why organizations adopt similar practices.                   | Explains adoption but not the creation of sub-categories defensively. | near miss |
  | Cohort fragmentation  | Demography               | Breaking a cohort into smaller groups.                       | Neutral term; doesn't capture the defensive aspect or institutional entrenchment. | no        |

  Since none fit perfectly, I endorse coining a new term: **Recursive Cohort Elaboration**.

