  2. Branching Timelines (BT): Going back creates or enters a new timeline where changes are possible without affecting the original.
  3. No Backward Travel (NBT): Travel to the past is impossible.
  4. Anything-Goes Single-Timeline (AGST): Even outright contradictions can happen in a single timeline.

  We have three fixed scenarios (toolbox, prevention, picnic) and six more to cover the necessary ground.

