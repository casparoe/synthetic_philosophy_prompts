  - Else if Q3=C and Q7=A, then AGST.

  - Else, look at majority.

  But to make it objective, we'll provide a scoring grid in the key.

  Now, for the scoring explanation:

  Logical combinations:

  The questions allow for various combinations. The four positions we defined cover the main ones. However, there might be combinations that are not covered, such as:

  - Someone who believes in a single timeline but allows for changes with some mechanism (like AGST) but not full contradictions? That's not one of the four.

  Or someone who believes in branching but only for major changes? Our BT doesn't distinguish.

  We'll note in the key.

  Scoring Key:

  Step 1: If you answered A to Question 1, your position is "No Backward Travel" (NBT). Stop here.

  Step 2: For the remaining, consider your answers to the following key questions:

  - If you answered B to Question 3 and B to Question 4, then you are likely "Branching Timelines" (BT).

  - If you answered A to Question 3 and C to Question 7, then you are likely "Fixed Single-Timeline" (FST).

  - If you answered C to Question 3 and A to Question 7, then you are likely "Anything-Goes Single-Timeline" (AGST).

  Step 3: If you don't fit neatly, or if there are ties, consider the following:

  - FST typically chooses: Q2B, Q3A, Q4C, Q5A, Q6B, Q7C, Q8A, Q9A
  - BT typically chooses: Q2C, Q3B, Q4B, Q5B, Q6C, Q7B, Q8B, Q9B
  - AGST typically chooses: Q2B, Q3C, Q4C, Q5C, Q6B, Q7A, Q8A, Q9C

  Count how many of your answers match each typical pattern. The position with the most matches is your leaf.

  Note: 
  - The combination that is not covered: for example, someone who believes in a single timeline and also believes that changes are possible without contradiction (like the picnic going unnoticed) but also allows for bootstrap paradoxes (like the toolbox) and rejects the prevention paradox by saying it's impossible (Q3A) would be FST. But if they allow the prevention to happen with a resolution (Q3C), then AGST.

  - Some combinations might be unattractive or unexplored. For instance, believing in branching but also that the picnic must have changed history (Q4A) is not typical for BT. It might be unexplored.

  - The quiz might not cleanly separate FST and AGST on the picnic and toolbox, but the prevention and grandparent questions are key.

  Summary Table:

  | Position label          | Typical answer pattern | Core commitment in one sentence | Story moment it finds hardest to handle |
  |--------------------------|------------------------|----------------------------------|------------------------------------------|
  | Fixed Single-Timeline (FST) | Q1:B/C, Q2:B, Q3:A, Q4:C, Q5:A, Q6:B, Q7:C, Q8:A, Q9:A | The timeline is fixed and consistent; what happened, happened. | A story where someone apparently changes the past without any mechanism to prevent the change. |
  | Branching Timelines (BT) | Q1:B/C, Q2:C, Q3:B, Q4:B, Q5:B, Q6:C, Q7:B, Q8:B, Q9:B | Time travel to the past creates or moves to a new, independent timeline. | A story where the traveler returns to the exact same present despite changes, or where timelines interact. |
  | No Backward Travel (NBT) | Q1:A, and often A in other questions | Backward time travel is simply impossible. | Any story that presents backward time travel as possible. |
  | Anything-Goes Single-Timeline (AGST) | Q1:B/C, Q2:B, Q3:C, Q4:C, Q5:C, Q6:B, Q7:A, Q8:A, Q9:C | A single timeline can tolerate inconsistencies and changes. | A story that emphasizes strict logical consistency without any resolution to contradictions. |

  Note: The hardest story moment for FST is when a change seems to occur (like prevention) because they must explain why it didn't. For BT, it might be when the new timeline is identical (butterfly effect). For NBT, any time travel. For AGST, a story that insists on no contradictions.

