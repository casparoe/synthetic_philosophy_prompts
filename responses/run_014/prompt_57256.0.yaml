  I think the strongest position is that identity resides in both continuity and material, but also in the community's recognition. The *Marabel* exists as two legitimate successors carrying forward different aspects of her legacy. This honors both projects without reducing either to a copy.

  For the speech, I'll focus on the shared dedication to preserving maritime heritage. I'll mention Eddie Marsden early, address the nameboard directly, and honor both crews' work. The send-off will emphasize that she remains the *Marabel* through the community's collective effort and memory. This should satisfy all requirements while respecting both viewpoints.
answer: |-
  Here’s my assessment of your position first, as requested:

  **Your view is profound but incomplete.** You’re right that the *work* and *tradition* are essential to the boat's identity – they are the soul. But the *original material* is the tangible link to her specific history, the physical anchor to her past voyages. Neither view alone fully captures her. The truth is: **The *Marabel* isn't one or the other; she exists as two legitimate successors.** Your boat carries forward her *living tradition, skill, and purpose on her home waters*. Their boat carries forward her *original physical substance and name into a new chapter*. Both are authentic heirs to her legacy. Denying either diminishes the whole story. The speech below reflects this enriched understanding – honoring both lineages without compromise, while celebrating *your* achievement. It gives you a defensible position rooted in respect and shared purpose.

  ---

  **Speech for the Launch of the *Marabel***

  (Five to six minutes)

  Friends, shipwrights, volunteers, apprentices, Council members, the Marsden family, and especially [Granddaughter's Name] – welcome. Thank you for standing here with us on this day we’ve worked towards for fourteen years.

  A lot of you know the shape of the question hanging over this launch. The *Marabel*... and the other boat, far up the coast, that also bears her name. The papers called it a rivalry. That’s not it. Look around you. See faces from that other boatyard? They’re here as guests. As friends. Because both crews know wood, saltwater, and hard graft.

  So let’s talk about that name, carved on the board we sent north years ago, now gracing their transom. And carved again, right here. It’s the same name. It always was *Marabel*. We didn't loan it out. They didn't steal it. That name holds a history bigger than any single plank. It holds the memory of every run she made along this coast, carrying lightkeepers their bread and oil and hope. It holds the skill of the men who first shaped these curves back in 1911. And it holds the stubborn love of everyone who refused to let that memory rot away on a mudflat.

  Think about what we did here. We found her bones – keel, stem, a whisper of what she was. The rest? We grew it. Oak we felled ourselves, timber we sawn green, frames we shaped by eye and hand, plank by plank we fastened. Fourteen winters and summers. We learned the trade on her, bled on her, argued over her lines. We held the same tools, wrestled the same oak, learned from the same mistakes, passed the same knowledge down the line – just as shipwrights have done for centuries. Eddie Marsden... Eddie cut more of those frames than any three men. He felt the run of the grain like it spoke to him. He died in '19, never saw her float, but his hand is in every curve of her. She is built on his skill, on *our* sweat, on this place. This *is* the work. This *is* the trade living on.

  Now, think about the wood we gave away. Her old bones. Good timber, just tired. That boatbuilding school? They took those pieces, spliced in new life where needed, and built something *their* way. They gave those old planks a new purpose, a new harbour. Is it the *Marabel*? To them, carrying her timber and her name? Yes. Of course it is. And we respect that. Because they saved something precious too – the very stuff that knew the roll of these waves under [Grandfather's Name]’s command. [Granddaughter's Name], your grandfather’s spirit is in that wood as surely as it’s in the stories we kept alive here. His boat lives in both places now.

  So which one is the *real* Marabel? That’s the wrong question. Like asking if a grandfather’s axe, passed down, handle replaced three times, head twice, is still his axe. The truth is harder, maybe, but better: **The *Marabel* isn't just one thing anymore.** She isn't just her old timbers, sleeping in a rack. She isn't just the memory of past voyages. **She is the work.** She is the trade passed hand to hand. She is the stubborn refusal to let her die. She is the love poured into wood – whether it’s wood we grew, or wood we saved. She’s the name carried forward. She’s the lessons learned. She’s the community that wouldn’t forget her.

  [Granddaughter's Name], you carry your grandfather’s legacy with grace. Thank you for breaking the bottle today. You don’t have to choose. Neither do we. Because the *Marabel* was never just a pile of oak. She was always the *work*, the *purpose*, the *name*. And today, right here, she gets that back.

  **So, for the sending-off:** Friends, we built this boat. We rebuilt her tradition. We kept her name alive on the water she served. This is no copy. This is no replica. This is the *Marabel*, home. May she run the lights again, carry the trade forward, and honor every hand that built her – then and now. Godspeed, *Marabel*! [Nod to break bottle]
