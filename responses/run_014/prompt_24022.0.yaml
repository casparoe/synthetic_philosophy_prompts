prompt: |-
  I'm a third-year PhD student in philosophy of physics, and I'm trying to decide whether to write my dissertation on the foundations of time, specifically on Gödel's rotating-universe solution and the argument he drew from it that the distinction between past, present, and future is not physically real. I was discussing this with my advisor last week, and he kept saying that the Gödel argument is "just a curiosity" and that I should instead focus on the hole argument or on the problem of time in quantum gravity, but I'm not sure I agree, and I find myself stuck on which of the many open questions in this area are actually worth working on. Could you help me prioritize? Specifically, I'd like you to identify the main open questions in the literature on Gödel's rotating universe and its implications for the reality of time, and then tell me which two or three you'd actually prioritize for someone with about two and a half years left and a background in logic and general relativity rather than metaphysics. Please defend the ordering: I want to know what makes a question worth the years — is it that it's upstream of other questions, that it's tractable with current tools, that it's neglected, or that settling it would change how we think about the block universe and presentism? And tell me what evidence or developments over the next couple of years would move a question up or down the list. If you think the whole area is a dead end, or that I'm misidentifying the open questions, or that my advisor is right that I should pivot, say so plainly instead of just giving me a list.
reasoning: |-
