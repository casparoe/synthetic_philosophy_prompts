  Hmm, the user's frustration resonates - this is a classic theoretical knot. They mention their study group devolved into arguments, which suggests they need to see how experts might navigate this. The fishing case is perfect: it's spatially bounded yet transboundary in impact, forcing confrontation with both principles' limits. 

  I should note their professor's "flip-flopping" might actually be pedagogical - showing how each principle collapses under pressure. The user seems to want the same intellectual rigor but in digestible form. Their request for "no resolution" is wise; premature solutions would betray the complexity. 

