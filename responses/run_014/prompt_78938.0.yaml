  ### Decision Tree: Is DNA Really a Code?  
  **Instructions:** Start at the root (Question 1). Answer each question based on concrete cases. Follow the arrows to your position. Each leaf names a stance and its "awkward swallow" (a challenge it must accept).  

  ---

  #### **Question 1: Synthetic Genome (Case E)**  
  *A lab assembles a bacterial genome from scratch (no evolutionary history). When inserted into a cell, it produces proteins identically to natural DNA. Is this a "code" in the **engineering sense**?*  
  - **Yes** (Systematic mapping: Triplets → amino acids, like a cipher) → **Question 2**  
  - **No** (No mapping/no rules) → **Position: *Drop the Metaphor***  
    - *Awkward swallow:* We must explain genetics *without* terms like "code" or "information," even for engineered genomes.  
  - **Unclear** → **Question 4**  

  #### **Question 2: Codon Reassignment (Case A)**  
  *In a yeast lineage, codon "CUG" switched from encoding leucine to serine. Identical DNA triplet, different output. Does this break the "code"?*  
  - **Yes** (Mapping isn’t fixed; context matters) → **Question 3**  
  - **No** (Rules still exist, just changed) → **Position: *Engineering Code Only***  
    - *Awkward swallow:* "Information" is assigned by *us*—DNA has no intrinsic meaning, even though cells "follow" it.  

  #### **Question 3: Methylation Mark (Case D)**  
  *A mouse inherits a methylation mark (not a DNA change) that silences a growth gene, causing dwarf offspring. Does this mark carry "information"?*  
  - **Yes** (It specifies an outcome) → **Position: *Developmental System Bearer***  
    - *Awkward swallow:* DNA isn’t special—information is distributed (e.g., epigenetics, proteins).  
  - **No** (Only DNA does) → **Question 5**  

  #### **Question 4: Non-Transcribed DNA (Case C)**  
  *A human has 10,000 base pairs of "junk DNA" that never transcribes. Does this segment encode "information"?*  
  - **Yes** (It might regulate/have hidden functions) → **Question 5**  
  - **No** (It does nothing) → **Position: *Causal Specificity***  
    - *Awkward swallow:* "Information" just means "this DNA bit *causes* that outcome"—non-coding DNA is irrelevant noise.  

  #### **Question 5: Unexpressed Gene (Case F)**  
  *A human cell has a gene for insulin, but a missing transcription factor prevents expression. Does DNA "specify" the protein?*  
  - **Yes** (Like a blueprint: the *plan* exists) → **Position: *Genuine Aboutness***  
    - *Awkward swallow:* DNA has intrinsic meaning (e.g., "insulin" is *about* blood sugar), even when unused.  
  - **No** (Like a recipe: needs *ingredients/timing*) → **Position: *Developmental System Bearer***  
    - *Awkward swallow:* DNA is one ingredient—information emerges from the *whole system* (e.g., epigenetics, environment).  

  ---

  ### Key  
  - **Cases referenced:**  
    - **A:** Codon reassignment (e.g., yeast CUG→serine).  
    - **C:** Non-transcribed "junk DNA."  
    - **D:** Inherited methylation altering phenotype.  
    - **E:** Synthetic genome with no evolution.  
    - **F:** Gene not expressed due to missing factor.  
  - **Positions covered:**  
    - `Genuine Aboutness`: DNA has semantic content ("aboutness").  
    - `Engineering Code Only`: Systematic mapping, but meaning is observer-assigned.  
    - `Causal Specificity`: DNA is a difference-making cause.  
    - `Developmental System Bearer`: Whole system (not just DNA) bears information.  
    - `Drop the Metaphor`: Reject "code/information" talk entirely.  
  - **Extra positions:** `Causal Specificity` splits from **Q4**; `Drop the Metaphor` from **Q1**.  

  ### Diagnostics  
  - **Unseparable positions:**  
    - *Genuine Aboutness* and *Engineering Code Only*: If you accept "aboutness," you bypass engineering-only (tree forces a choice at **Q1**).  
  - **Empty/awkward combinations:**  
    - **Q1 → No + Q4 → Yes**: Incoherent (denies *all* code but attributes info to non-functional DNA).  
    - **Q2 → No + Q5 → No**: Unattractive (insists DNA is a fixed code but denies it specifies outcomes).  
  - **Why concrete cases?** Avoids abstract debates—e.g., **Case F** forces blueprint-vs-recipe clarity.  

  ---  
  **Fit**: Designed for 2-page A4 handout.  
  **Next steps**: Use this to assign positions in your discussion!
