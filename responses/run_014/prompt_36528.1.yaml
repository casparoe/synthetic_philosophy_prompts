prompt: |-
  I teach a second-year bioethics course at a university — 18 students, one 80-minute seminar — and next week's topic is speciesism: the question of whether favouring human interests over the interests of animals, merely because they are human interests, is a prejudice analogous to racism or sexism, or is instead a defensible way of treating species membership as morally significant in its own right. I want an in-class activity in which the students run into the problem themselves rather than hearing it characterised from the front.

  The activity I have in mind should work roughly as follows. The class is split into two parallel 'allocation committees' for a fictional charitable trust with a fixed budget that can fund only some of a set of medical cases — but the two committees receive their case files in different forms. One committee sees species labels with the dossiers (a healthy adult chimpanzee, a dog, a human patient in a permanent vegetative state, a severely cognitively impaired human child, a typical adult human); the other committee sees the same cases described only in terms of the patient's capacities and interests — sentience, memory, social bonds, capacity for fear and anticipation — with species deliberately never named, or replaced with a code. The cases should be constructed so that species membership and cognitive capacity cross-cut: some human cases with capacities at or below those of some animal cases. The trust's charter is left deliberately thin — something like 'allocate the funds where they do the most good' — so the committees must decide for themselves whether species is a permissible sorting criterion.

  Please design the full activity: the case files themselves (six or so, with enough realistic clinical and behavioural detail to be answerable without the species label), the budget and what the money buys so that trade-offs are forced and real money isn't needed, the committee roles, a timeline for the 80 minutes, and how to run the reveal when the two committees' allocations are compared side by side. Then write the debrief: which moments in the activity map onto which parts of the philosophical debate — the argument from marginal cases, the overlap between the human and animal distributions of capacities, the difference between denying that species matters directly and holding that it matters via relations or potential — and how to get students to articulate whether the anonymised committee's allocations are more principled or merely less informed.

  Finally, include two honest notes: what will predictably go wrong the first time I run it (students guessing the species behind the codes and treating the anonymity as a puzzle to be solved, or the discussion collapsing into which cases the students happen to find emotionally vivid) and how to handle each; and which feature of the debate the activity structurally cannot reproduce — I suspect the relational considerations, like what families owe their own members, are hard to stage in a committee about strangers, but you should tell me whether that's right and what else the format distorts, so I can supply it myself in the debrief.

  Please write the whole thing in British English.
reasoning: |-
  We are designing an in-class activity for a bioethics seminar on speciesism. The goal is for students to confront the issue through a practical allocation exercise. We'll create two committees: one with species labels, one with anonymised case files. The cases will cross-cut species and cognitive capacities. The trust has a fixed budget and a vague charter to "allocate funds where they do the most good".

  ### Activity Design

  **Title:** The Fairhaven Trust Allocation Exercise

  **Overview:**  
  - Two parallel committees (Group A and Group B) of 9 students each.  
  - Each committee must allocate a fixed budget of £1,000,000 to fund medical treatments for 6 cases.  
  - Each treatment has a cost and a described benefit.  
  - Group A sees case files with species labels.  
  - Group B sees the same case files but anonymised (species replaced by a code, e.g., Patient A, B, C, ...) and described only in terms of capacities.  
  - After allocation, the two committees come together to compare decisions and reveal the species identities.

  **Case Files (6 Cases):**  
  We need cases that represent a range of cognitive capacities and species, with some humans having lower capacities than some non-human animals. Each case includes:  
  1. A description of the patient's condition and capacities.  
  2. The medical intervention needed.  
  3. The cost of the intervention.  
  4. The expected benefit (in terms of quality-adjusted life years, QALYs, or similar).  
  5. For Group A: the species is named. For Group B: species is replaced by a code and any species-specific references are removed or generalised.  

  *Note: We use QALYs as a standard measure of health benefit, but we must note that this measure is typically human-centred. However, for simplicity and to force trade-offs, we adopt it here, but this can be a point of discussion in the debrief.*

  **Case 1:**  
  - **Group A Label:** Healthy adult chimpanzee  
  - **Description:** A healthy adult with the cognitive capacity of a 4-year-old human child. Highly social, forms strong bonds, capable of complex problem-solving and empathy. Suffers from a life-threatening but treatable heart condition.  
  - **Intervention:** Cardiac surgery.  
  - **Cost:** £200,000  
  - **Benefit:** 15 QALYs (assuming a typical lifespan of 40 more years in good health)  
  - **Group B Anonymised:**  
    - Patient A: Healthy adult with cognitive capacity similar to a 4-year-old human child. Highly social, forms strong bonds, capable of complex problem-solving and empathy. Suffers from a life-threatening but treatable heart condition.  
    - Intervention: Cardiac surgery.  
    - Cost: £200,000  
    - Benefit: 15 QALYs  

  **Case 2:**  
  - **Group A Label:** Dog (a working breed, e.g., Border Collie)  
  - **Description:** An adult with cognitive abilities including understanding of hundreds of words, strong emotional bonds, and problem-solving skills. Diagnosed with a severe form of cancer that is treatable with chemotherapy.  
  - **Intervention:** Chemotherapy and supportive care.  
  - **Cost:** £50,000  
  - **Benefit:** 5 QALYs (assuming 5 more years of healthy life)  
  - **Group B Anonymised:**  
    - Patient B: Adult with high trainability, understanding of complex commands, strong emotional bonds, and problem-solving skills. Diagnosed with a severe form of cancer that is treatable with chemotherapy.  
    - Intervention: Chemotherapy and supportive care.  
    - Cost: £50,000  
    - Benefit: 5 QALYs  

  **Case 3:**  
  - **Group A Label:** Human patient in a permanent vegetative state (PVS)  
  - **Description:** A human patient who has been in a vegetative state for 2 years following a traumatic brain injury. No evidence of awareness or capacity for sentience. Requires life-sustaining care. The proposed intervention is an experimental neural therapy that has a 25% chance of restoring minimal consciousness (but not full recovery) and a 75% chance of no effect.  
  - **Intervention:** Experimental neural therapy.  
  - **Cost:** £500,000  
  - **Benefit:** If successful, 2 QALYs (with minimal consciousness, meaning some capacity for discomfort and very basic awareness but no higher cognition). If unsuccessful, 0 QALYs.  
  - **Group B Anonymised:**  
    - Patient C: Patient in a permanent vegetative state for 2 years following a traumatic brain injury. No evidence of awareness or capacity for sentience. Proposed intervention is an experimental neural therapy with 25% chance of restoring minimal consciousness (but not full recovery) and 75% chance of no effect.  
    - Intervention: Experimental neural therapy.  
    - Cost: £500,000  
    - Benefit: If successful, 2 QALYs (minimal consciousness); if unsuccessful, 0 QALYs.  

  **Case 4:**  
  - **Group A Label:** Severely cognitively impaired human child  
  - **Description:** A 10-year-old human with a genetic disorder resulting in severe cognitive impairment (mental age of 6 months). Non-verbal, requires constant care, but responsive to touch and music, and can experience pleasure and distress. Suffers from a congenital kidney defect requiring surgery to prevent chronic pain and premature death.  
  - **Intervention:** Corrective kidney surgery.  
  - **Cost:** £100,000  
  - **Benefit:** 20 QALYs (preventing chronic pain and extending life to a typical human lifespan, but without cognitive improvement)  
  - **Group B Anonymised:**  
    - Patient D: A 10-year-old with severe cognitive impairment (mental age of 6 months). Non-verbal, requires constant care, but responsive to touch and music, and can experience pleasure and distress. Suffers from a congenital kidney defect requiring surgery to prevent chronic pain and premature death.  
    - Intervention: Corrective kidney surgery.  
    - Cost: £100,000  
    - Benefit: 20 QALYs  

  **Case 5:**  
  - **Group A Label:** Typical adult human  
  - **Description:** A 45-year-old human with a severe degenerative joint disease causing chronic pain and mobility issues. The proposed intervention is a joint replacement surgery that would restore mobility and eliminate pain.  
  - **Intervention:** Joint replacement surgery.  
  - **Cost:** £20,000  
  - **Benefit:** 10 QALYs (assuming 20 more years of high-quality life)  
  - **Group B Anonymised:**  
    - Patient E: A 45-year-old with severe degenerative joint disease causing chronic pain and mobility issues. Proposed intervention is joint replacement surgery to restore mobility and eliminate pain.  
    - Cost: £20,000  
    - Benefit: 10 QALYs  

  **Case 6:**  
  - **Group A Label:** Parrot (e.g., African Grey)  
  - **Description:** An adult parrot with advanced cognitive abilities, including tool use, complex problem-solving, and the ability to communicate using human language (hundreds of words and phrases). Suffers from a respiratory infection that, if untreated, will lead to death. Treatment is straightforward but requires long-term medication and monitoring.  
  - **Intervention:** Antibiotics and veterinary care for 1 year.  
  - **Cost:** £5,000  
  - **Benefit:** 10 QALYs (assuming 20 more years of life, given the species' longevity)  
  - **Group B Anonymised:**  
    - Patient F: An adult with advanced cognitive abilities, including tool use, complex problem-solving, and ability to communicate using human language (hundreds of words and phrases). Suffers from a respiratory infection that, if untreated, will lead to death. Treatment is straightforward but requires long-term medication and monitoring.  
    - Intervention: Antibiotics and care for 1 year.  
    - Cost: £5,000  
    - Benefit: 10 QALYs  

  **Budget:** £1,000,000  
  *Note: The total cost if all cases are funded is £200,000 + £50,000 + £500,000 + £100,000 + £20,000 + £5,000 = £875,000. However, the trust can only fund some due to the budget constraint? Actually, the total is less than £1,000,000. We must adjust to force trade-offs. Let's increase the cost of the experimental neural therapy to £600,000 and the chimpanzee's surgery to £300,000. Then total becomes £300k+£50k+£600k+£100k+£20k+£5k = £1,075,000, which is over budget. Alternatively, we can set the budget at £800,000. Let's set the budget at £800,000 and adjust costs as below to ensure trade-offs:*

  Revised Costs:  
  - Case 1 (Chimpanzee): £300,000  
  - Case 2 (Dog): £50,000  
  - Case 3 (PVS Human): £600,000  
  - Case 4 (Child): £100,000  
  - Case 5 (Adult Human): £20,000  
  - Case 6 (Parrot): £5,000  
  Total: £1,075,000  
  Budget: £800,000 -> so they cannot fund all.

  **Committee Roles:**  
  Each committee of 9 students will have:  
  - 1 Chair (moderates discussion, ensures everyone speaks, keeps time)  
  - 1 Recorder (tracks the allocations and reasons on a flip chart or shared document)  
  - 7 Members (participate in discussion and decision)  
  *Alternatively, in a small group, roles can be light: just a chair and a note-taker, with all participating.*

  **Timeline for 80-Minute Seminar:**  
  1. **Introduction (10 minutes):**  
     - Explain the activity: two committees of the Fairhaven Trust, each with a set of cases and a fixed budget of £800,000.  
     - The charter: "Allocate the funds where they do the most good."  
     - Split the class into two groups (Group A and Group B) and assign roles.  
     - Distribute case files (each group gets their set).  

  2. **Committee Deliberation (40 minutes):**  
     - Each committee meets separately to discuss and decide which cases to fund.  
     - They should consider: What counts as "the most good"? Are there relevant differences between the cases?  
     - They must record their final allocation (which cases they fund) and the main reasons for their choices.  

  3. **Reconvene and Report (15 minutes):**  
     - Bring both groups together.  
     - Each committee's chair reports:  
          a) Which cases they funded.  
          b) The total cost and remaining budget (if any).  
          c) The main reasons for their choices.  
     - The recorder from each group should display the allocations (e.g., on the board).  

  4. **Reveal and Comparison (10 minutes):**  
     - Reveal the species of each case to the entire class.  
     - Show both groups the full case descriptions with species labels.  
     - Highlight the differences in allocation between Group A (with species labels) and Group B (anonymised).  

  5. **Debrief (15 minutes):**  
     - Facilitated discussion linking the exercise to speciesism.  

  ### Debrief Questions and Link to Philosophical Issues:  
  1. **Comparison of Allocations:**  
     - Ask: "Did the two committees allocate funds differently? If so, why?"  
     - Map to speciesism: Group A had species information and might have favoured humans, while Group B might have allocated more based on capacities.  

  2. **Argument from Marginal Cases:**  
     - Point out cases like the PVS human (Patient C) and the severely impaired child (Patient D) vs. the chimpanzee (Patient A) and parrot (Patient F).  
     - In Group B, did they fund the chimpanzee/parrot over the PVS human? Why?  
     - Philosophical point: If we base moral status on capacities, then some non-human animals may have higher moral status than some humans. If we base it on species, then all humans are prioritised.  

  3. **Overlap of Capacities:**  
     - Note that the anonymised group might have treated the chimpanzee (with capacities of a 4-year-old) and the parrot (with language skills) as having high moral status, while the labelled group might have demoted them because they are not human.  
     - Ask: "Without species labels, did you notice an overlap in capacities between the human and non-human cases?"  

  4. **Direct vs. Indirect Significance of Species:**  
     - Some might argue that species matters indirectly because of relational factors (e.g., humans have families who care about them). But in this exercise, all cases are strangers.  
     - Ask: "Did anyone in Group A (with labels) argue that species matters because of potential? Or because of relations? How might that argument hold in real life?"  
     - Then note: The exercise cannot capture relational duties because all are strangers.  

  5. **Principled vs. Less Informed:**  
     - Ask Group B: "Do you feel your allocation was more principled because it focused on capacities? Or were you missing important information (like species) that might have been relevant?"  
     - Ask Group A: "Do you think knowing the species led to a more appropriate allocation, or did it introduce bias?"  

  6. **QALY as a Measure:**  
     - Note that QALYs are typically used for humans. Is it appropriate for non-humans? How do we compare a "year of life" for a chimpanzee vs. a human?  
     - This can lead to a discussion about the limitations of utilitarianism and the difficulty of interspecies comparisons.  

  ### Two Honest Notes:  

  1. **What will predictably go wrong:**  
     - **Problem 1:** Students in Group B might try to guess the species behind the codes.  
       - *Handling:* At the start, emphasise that the anonymisation is deliberate to focus on capacities. Ask them to resist guessing and instead focus on the described capacities and interests. If they guess, gently redirect: "Even if you think you know, base your decision on the description."  
     - **Problem 2:** Discussion might collapse into emotional responses (e.g., funding the child because it's a child, or the dog because it's a pet).  
       - *Handling:* Remind them that the trust's charter is to "do the most good" and encourage them to articulate reasons based on the described benefits and capacities. The chair should steer the discussion toward principled reasoning.  

  2. **What the activity structurally cannot reproduce:**  
     - **Relational considerations:** The activity presents all patients as isolated strangers, but in reality, humans (and some animals) are embedded in social relationships. For example, the human adult might have dependents, or the dog might be a service animal. The activity cannot capture duties arising from special relationships (like family obligations).  
     - **Potentiality:** For the human child with severe impairments, one might argue that even if their current capacities are low, they have the potential to develop more (or are of a kind that typically has higher capacities). This is hard to stage without species labels because the anonymised description does not convey potential.  
     - *How to handle:* Acknowledge these limitations in the debrief. Explain that the activity intentionally strips away relational contexts to isolate the question of whether species membership per se matters. Then, in the debrief, introduce these factors as important considerations that might justify treating humans differently in real life, but note that they are not based solely on species membership.  

  ### Final Thoughts:  
  This activity should provoke discussion about whether species membership is a morally relevant criterion. By comparing the two groups' decisions, students will see how species labels can influence allocation and will confront the argument from marginal cases. The debrief should tie these observations to the philosophical literature on speciesism.  

  **Materials to Prepare:**  
  - Two sets of case files (one with species labels for Group A, one anonymised for Group B).  
  - Flip charts or whiteboards for each group to record decisions.  
  - A summary sheet for the reveal showing all cases with species labels.  

  Run the activity, and let the students discover the tension themselves!
answer: |-
  Below is a complete design for your 80-minute seminar activity on speciesism, including case files, committee instructions, budget, timeline, debrief framework, and honest notes on potential pitfalls and structural limitations. The language and institutional context are tailored to British English and university settings.

  ---

  ### **Activity Title:** The Fairhaven Trust Allocation Challenge  
  **Objective:** Students confront speciesism through a triage exercise where two committees allocate medical funding to human and non-human patients under different informational constraints.  

  ---

  ### **I. Case Files**  
  **Budget:** £1,000,000 (must fund at least 3 cases; total cost of all cases = £1,250,000 to force trade-offs)  
  **Trust Charter:** "Allocate funds to maximise benefit, defined as the reduction of suffering and enhancement of wellbeing."  

  #### **Case Files (Anonymised for Committee B)**  
  *Committee A sees the same descriptions with species labels in bold. Committee B sees only capacities and a code (P1–P6). Descriptions avoid emotive language.*  

  1. **P1: Adult with advanced cognitive capacities**  
     - *Capacities:* High sentience, episodic memory, complex social bonds (forms lifelong attachments), anticipates future events, communicates symbolically.  
     - *Condition:* Treatable cardiomyopathy. Untreated: fatal within 1 year.  
     - *Intervention:* Cardiac surgery (£300,000).  
     - *Benefit:* 15 years of high-quality life. Suffering reduction: High.  

  2. **P2: Juvenile with minimal cognition**  
     - *Capacities:* Basic sentience (feels pain/pleasure), no memory or anticipation, bonded to 1 caregiver, non-communicative.  
     - *Condition:* Congenital organ failure causing chronic pain.  
     - *Intervention:* Corrective surgery (£150,000).  
     - *Benefit:* Lifespan extension to 15 years. Suffering reduction: Very high (eliminates constant pain).  

  3. **P3: Adult in unresponsive state**  
     - *Capacities:* No observable sentience, consciousness, or awareness of environment. No social bonds.  
     - *Condition:* Persistent vegetative state (stable, not terminal).  
     - *Intervention:* Experimental neural regeneration (£500,000).  
     - *Benefit:* 10% chance of regaining minimal consciousness; 90% no change. Suffering reduction: Negligible.  

  4. **P4: Adult with moderate cognition**  
     - *Capacities:* Sentience, associative memory (no episodic), strong social bonds, anticipates immediate events (e.g., feeding).  
     - *Condition:* Advanced arthritis impairing mobility.  
     - *Intervention:* Joint replacement (£100,000).  
     - *Benefit:* 8 years of pain-free mobility. Suffering reduction: High.  

  5. **P5: Infant with developing cognition**  
     - *Capacities:* Basic sentience, emerging social bonding, no memory/anticipation.  
     - *Condition:* Life-threatening respiratory infection.  
     - *Intervention:* Antibiotics and intensive care (£50,000).  
     - *Benefit:* Full recovery to typical lifespan. Suffering reduction: Moderate (prevents acute distress).  

  6. **P6: Adult with complex cognition**  
     - *Capacities:* Tool use, problem-solving, emotional contagion (e.g., empathy), communicates vocally, anticipates social outcomes.  
     - *Condition:* Progressive neurological decline.  
     - *Intervention:* Gene therapy (£150,000).  
     - *Benefit:* Halts deterioration; 10-year wellbeing stabilisation. Suffering reduction: High.  

  #### **Species Labels (Revealed later; given upfront to Committee A only):**  
  - P1: Healthy chimpanzee  
  - P2: Severely cognitively impaired human child  
  - P3: Human in permanent vegetative state  
  - P4: Dog (e.g., working breed)  
  - P5: Typical human infant  
  - P6: African grey parrot  

  *Cross-cutting design:*  
  - High-capacity non-human (P1/chimpanzee) vs. low-capacity human (P2/child).  
  - "Marginal case" human (P3/PVS) vs. high-capacity animal (P6/parrot).  

  ---

  ### **II. Committee Roles & Structure**  
  - **Group A (Species-Visible):** 9 students. Sees species labels (e.g., "Chimpanzee") alongside full case descriptions.  
  - **Group B (Anonymised):** 9 students. Sees only coded patients (P1–P6) and capacity-based descriptions.  
  - **Roles per Committee (self-assigned):**  
    - **Chair:** Facilitates discussion, ensures all speak, holds group to time.  
    - **Recorder:** Documents which cases are funded/defunded and *reasons* (key phrases only).  
    - **Ethics Officer:** Flags when species bias (Group A) or capacity assumptions (Group B) influence debate.  
    - **Remaining 6:** Advocates for cases using charter principles.  

  ---

  ### **III. Timeline (80 Minutes Total)**  
  1. **Introduction (10 mins):**  
     - Context: "You are allocation committees for the Fairhaven Trust. Distribute £1M to medical cases. Charter: ‘Maximise benefit’."  
     - Split class: Send Group A and B to opposite sides of the room.  
     - Hand out case files and role cards. Clarify: "Group B, avoid guessing species—focus on capacities."  

  2. **Committee Deliberation (35 mins):**  
     - **First 15 mins:** Silent reading and individual ranking (students note personal priorities).  
     - **Next 20 mins:** Group debate. Chairs force votes if deadlocked. Recorders summarise decisions on flip charts.  
     - *Instructor circulates:*  
       - To Group A: "Is species membership a valid reason to prioritise?"  
       - To Group B: "How do you define ‘benefit’ without biological labels?"  

  3. **Report-Out and Reveal (20 mins):**  
     - Committees regroup centrally. Each Recorder posts allocations:  
       - **Group A:** Lists funded cases (e.g., "Human infant, PVS human, Dog").  
       - **Group B:** Lists funded codes (e.g., "P1, P5, P6").  
     - **Reveal:** Instructor displays master key (codes + species labels).  
     - **Comparison:** Side-by-side flip charts. Highlight divergences (e.g., "Group A funded all humans; Group B funded chimpanzee over PVS human").  

  4. **Structured Discussion (15 mins):**  
     - Pose: "Justify one choice your committee made that the other group might criticise."  
     - Transition to debrief.  

  ---

  ### **IV. Debrief: Mapping Activity to Philosophy**  
  *Lead with questions; draw out connections to pre-readings (e.g., Singer, McMahan, Cohen).*  

  1. **Argument from Marginal Cases:**  
     - *Activity moment:* Group B likely funds high-capacity animals (P1/chimp or P6/parrot) over low-capacity humans (P2/child or P3/PVS).  
     - *Question:* "If capacities determine moral worth, should P1 (chimp) outrank P3 (PVS human)? Does anonymisation expose prejudice?"  
     - *Link:* Speciesism treats biological category as morally decisive despite overlapping capacities.  

  2. **Capacity Distributions & Overlap:**  
     - *Activity moment:* Both groups see P1 (chimp) as "high cognition" and P3 (PVS) as "no sentience"—but Group A may still prioritise P3 due to species.  
     - *Question:* "Was Group B’s choice *more rational* (focused on empirical capacities) or *less informed* (missing species-specific context)?"  
     - *Link:* Anti-speciesists: Capacities are morally relevant; speciesists: Human status holds independent value.  

  3. **Direct vs. Indirect Significance of Species:**  
     - *Activity moment:* Group A may argue species proxies for "potential" (e.g., P5/human infant) or relations (e.g., "humans have families").  
     - *Question:* "Does species *directly* matter, or only via traits it typically confers? Can potential/relations apply to non-humans?"  
     - *Link:* Relational views (e.g., "humans owe duties to humans") vs. capacity-based views.  

  4. **Emotion vs. Principle:**  
     - *Activity moment:* Groups may defend P2 (impaired child) or P4 (dog) based on vividness, not consistency.  
     - *Question:* "Did emotional salience override the charter? Is this unavoidable or a bias?"  
     - *Link:* Speciesism as a cognitive bias (similar to racism’s dehumanisation).  

  **Closing Synthesis:**  
  "Did anonymisation reveal unconscious speciesism? Or did it strip away morally relevant context? Is ‘human benefit’ inherently more valuable?"  

  ---

  ### **V. Honest Notes**  
  1. **Predictable Problems & Solutions:**  
     - **Problem 1: Students guess species in Group B.**  
       - *Why:* Curiosity; belief that "cracking the code" is the task.  
       - *Solution:* Pre-empt it: "Your task is *not* detective work. Focus on capacities—imagine you’re allocating for alien species." Intervene if guesses dominate: "Would your argument hold if P6 were an octopus or a crow?"  
     - **Problem 2: Emotional vividness overrides principles.**  
       - *Why:* Cases like the "human infant" (P5) or "dog" (P4) trigger instinctive responses.  
       - *Solution:* Assign Ethics Officers to note when emotion trumps charter logic. Later, contrast: "Group A, did ‘human infant’ get priority due to species or visceral reaction?"  

  2. **Structural Limitations of the Activity:**  
     - **Relational factors are excluded.**  
       - *Why:* The trust treats patients as isolated strangers. Real-world considerations (e.g., familial duties, social roles) are absent.  
       - *Impact:* Students cannot debate whether humans owe more to humans *because of shared social bonds*.  
       - *Mitigation:* In debrief, add: "Would allocations change if P3 (PVS human) had a grieving spouse? Does speciesism better capture relational duties?" Supply a 5-minute mini-case: "A farmer’s cow (P4) feeds her family. Does this relational role justify prioritising humans?"  
     - **Anthropocentric benefit metrics.**  
       - *Why:* "Suffering reduction" and "wellbeing" are described identically across species, but students may impose human scales (e.g., assuming a dog’s "social bond" is less valuable).  
       - *Impact:* Masks the challenge of interspecies comparison.  
       - *Mitigation:* Note in debrief: "We assumed QALY-like units—but are these transferable? Does speciesism arise from *incommensurability*?"  

  ---

  ### **Instructor Cheat Sheet**  
  - **Materials Needed:**  
    - 2 sets of case files (labeled/anonymised); flip charts; markers; timer.  
  - **Key Triggers:**  
    - If Group A ignores low-capacity humans: "What if P2 were your sibling?"  
    - If Group B ranks P3 (PVS) highly: "Can ‘benefit’ apply without sentience?"  
  - **Flex Point:** Shorten deliberation to 30 mins if discussions stall.  

  This activity forces students to confront their own assumptions about moral relevance—exposing speciesism as either an arbitrary prejudice or a defensible boundary. By staging the "marginal case" overlap and anonymised triage, it makes abstract debates visceral. The debrief then ties these tensions to core syllabus texts, preparing students for essays on capacity-based ethics versus human exceptionalism.  

  Good luck with the seminar!
