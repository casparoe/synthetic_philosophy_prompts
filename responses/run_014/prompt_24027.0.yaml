prompt: |-
  I am a referee for a journal whose house position is intuitionistic: the theorems and proofs we publish may not use the full law of excluded middle, and every existence claim has to be backed by an actual construction. A few times a year I review a paper in which the authors assert that a theorem is "constructively valid," or present a proof they describe as constructive, and I have to decide whether that claim holds before I recommend acceptance; a false claim of this kind would mislead our readers and undercut the journal's position, so the stakes are real. I want a decision procedure I can actually run on a paper, not a survey of constructivism.

  Please write a step-by-step audit procedure that a co-referee who knows standard mathematics but is not a constructivist can follow on a proposed theorem-and-proof. For each step, state the question to ask, what counts as a sufficient answer, and whether a bad answer ends the review with a reject or merely flags a fix. Mark clearly which steps are mechanical checks and which are judgment calls the referee has to make, and state what the procedure cannot do at all — in particular, where it can only detect that a constructive proof is missing rather than produce one. The procedure must say how to handle proofs that argue "by contradiction" and proofs that invoke a choice principle, since those are where I most often err. It should end in exactly one of: accept, reject, or refer to the editor (our final sign-off) with a specific question. I have roughly an hour per paper.

  Then run the procedure on these three proposals, keeping each run to under 200 words:
  (1) "Every bounded increasing sequence of real numbers converges," proved by the usual epsilon-N argument.
  (2) The intermediate value theorem in its exact form — if f is continuous on [a,b] with f(a) < 0 < f(b), then there exists c with f(c) = 0 — with a proof that near its end isolates a point by bisection and then argues by considering whether f at that point is zero or not.
  (3) A lemma whose proof splits on whether a natural number n is even or odd.

  For case (2), be explicit about what the authors would have to give up and what weaker statement survives, because that is the answer I will not like delivering.

  Keep the entire response to at most 1200 words.
reasoning: |-
  We are creating an audit procedure for verifying constructive validity of a theorem and proof. The procedure should be executable by someone familiar with standard mathematics but not necessarily constructivism, and should take about an hour per paper.

  The procedure must handle common pitfalls: use of excluded middle (especially in proofs by contradiction) and choice principles. It must end with one of: accept, reject, or refer to the editor with a specific question.

  We break the procedure into steps. Each step has:
  - The question to ask.
  - What counts as a sufficient answer.
  - Consequence of a bad answer (reject or flag for fix).
  - Whether it's mechanical or a judgment call.

  Procedure Steps:

  1. **Check the statement for non-constructive existential quantifiers.**
     - Question: Does the theorem statement contain an existential quantifier? If so, is there an explicit construction of the witness in the proof?
     - Sufficient answer: For every existence claim, the proof must provide an algorithm (or at least a method) to compute the witness. If the theorem is universal (no existential quantifier) then skip.
     - Bad answer ends: Reject if an existential claim has no witness construction. If the proof does not construct the witness, then it is not constructive.
     - Nature: Judgment call (to see if the construction is indeed provided and constructive).

  2. **Scan for explicit use of excluded middle (LEM) or double negation elimination.**
     - Question: Does the proof contain any instance of assuming a disjunction (like P or not P) without a constructive disjunction? Specifically, look for phrases like "by contradiction", "without loss of generality", "either ... or ..." on undecidable propositions, or "we may assume that ...".
     - Sufficient answer: The proof must avoid any use of LEM on undecidable propositions. For decidable predicates (like equality of integers, or evenness of integers) LEM is acceptable because we can decide it. Also note that proofs by contradiction (showing that the negation leads to absurdity) are acceptable only for negative statements (like showing ¬P) but not for positive ones (like showing P).
     - Bad answer ends: If LEM is used on an undecidable predicate (e.g., on real numbers, on arbitrary sets) then flag as needing fix. If the step is critical and cannot be avoided, then reject. Otherwise, if the step is replaceable (and the referee sees how) then flag for fix.
     - Nature: Judgment call (to determine if the predicate is decidable and if the proof structure is using LEM in an essential way).

  3. **Check for choice principles.**
     - Question: Does the proof use any form of the axiom of choice? Look for choices from families of sets without specified choice functions, or uses of dependent choice.
     - Sufficient answer: Countable choice and even dependent choice are sometimes acceptable in constructive mathematics (depending on the school), but we must be cautious. However, the journal's policy might be strict. The referee must check if the choice is over a set with a known structure (like natural numbers) and if the choices can be made uniformly. If the choice is from a set that is not a set of natural numbers, then it is suspect.
     - Bad answer ends: If the proof uses choice and the choice cannot be avoided (and the set is not countable and discrete) then reject. If the use is minor and replaceable, flag for fix.
     - Nature: Judgment call (to see if the choice is acceptable and if there is a workaround).

  4. **Check for other non-constructive principles.**
     - Question: Are there any other non-constructive principles? (e.g., impredicative definitions, use of function spaces without continuity, etc.)
     - Sufficient answer: The proof should avoid these. For example, defining an object as a supremum of a set without a way to compute it is non-constructive.
     - Bad answer ends: If present and essential, reject. Otherwise, flag for fix.
     - Nature: Judgment call.

  5. **Verify that all definitions are constructive.**
     - Question: Are the definitions (of continuity, compactness, etc.) the constructive ones? For example, continuity should be in the epsilon-delta style but with a modulus of continuity, and compactness might be defined as being totally bounded and complete (or via uniform continuity on the space).
     - Sufficient answer: The definitions must be the ones standard in constructive mathematics (e.g., for real numbers, the equality is the usual equivalence of Cauchy sequences, and the order relations are defined appropriately). If the paper uses classical definitions (like open cover compactness) then the proof might be non-constructive even if the steps look constructive.
     - Bad answer ends: If the definitions are classical, then the entire proof might be invalid. This is a reject unless the authors can adjust the definitions and the proof still holds.
     - Nature: Judgment call.

  6. **Check the structure of the proof.**
     - Question: Does the proof rely on a non-constructive lemma? Are the subproofs constructive?
     - Sufficient answer: Every lemma must have been checked constructively or be known to be constructively valid. If a lemma is cited from a non-constructive source, it must be verified as constructive.
     - Bad answer ends: If a critical lemma is non-constructive and there is no constructive replacement, reject. Otherwise, flag for fix.
     - Nature: Judgment call.

  7. **Handling proofs by contradiction.**
     - Special attention: If the proof is by contradiction, then it must be for a negative statement. For positive statements (like existence) a proof by contradiction is not constructive. Instead, the proof should provide a witness or an algorithm.
     - Example: Proving "there exists x" by assuming no such x and deriving absurdity is non-constructive. Proving "P is false" by assuming P and deriving absurdity is acceptable.

  8. **Final decision:**
     - If all steps pass: Accept.
     - If there are fixable issues (and the referee can suggest how to fix): Refer to the editor with a note that the authors must address the specific issues (enumerate them) and then the paper can be reconsidered.
     - If there are non-fixable issues (like essential use of LEM on an undecidable predicate, or an existential claim without witness): Reject.

  What the procedure cannot do:
  - It cannot automatically produce a constructive proof if one is missing.
  - It cannot verify complex constructive arguments that require deep knowledge of constructivism (in that case, the referee should refer to the editor for a second opinion by a constructivist).

  Now, we run the procedure on the three proposals.

  ---

  **Case (1): "Every bounded increasing sequence of real numbers converges" proved by the usual epsilon-N argument.**

  Step 1: The theorem is: For every bounded increasing sequence (u_n) of real numbers, there exists L such that u_n converges to L. This is an existential statement. The proof must construct L.

  The usual proof defines L as the supremum of the set {u_n | n in N}. In classical math, the supremum exists by completeness. Constructively, we require that the supremum be computable. However, a bounded increasing sequence does not necessarily have a supremum that we can compute (because the set of terms might not be located). The usual epsilon-N argument uses that for any epsilon, there exists N such that L - u_N < epsilon (by definition of supremum) and then by monotonicity, for all n>=N, |u_n - L| < epsilon. But the existence of the supremum is non-constructive in general.

  Sufficient answer: The proof must provide a way to compute L. The usual proof does not, because it relies on the classical existence of the supremum.

  Bad answer: The proof does not construct L. Therefore, Step 1 fails -> Reject.

  Alternatively, note that in constructive mathematics, the statement is not true in general. There are bounded increasing sequences of real numbers that do not converge (because the limit is not computable). Therefore, the theorem as stated is not constructively valid.

  Verdict: Reject.

  ---

  **Case (2): Intermediate value theorem (IVT) in exact form: If f is continuous on [a,b] with f(a)<0<f(b), then there exists c in [a,b] with f(c)=0. Proof by bisection and then argues by considering whether f at that point is zero or not.**

  Step 1: The theorem has an existential quantifier (there exists c). The proof by bisection constructs a sequence of intervals [a_n, b_n] with length (b-a)/2^n, and then takes c to be the common limit. But then the proof says: at the point c, we check if f(c)=0. If not, then we would have a contradiction because the intervals were chosen so that f(a_n)<0 and f(b_n)>0, and by continuity f(c) must be 0. However, this last step is by contradiction and uses LEM on the statement "f(c)=0 or f(c)≠0". Since we cannot decide the equality of real numbers (which is not decidable) this step is non-constructive.

  Step 2: The proof uses LEM on an undecidable predicate (f(c)=0) at the end. This is a judgment call: the predicate is equality to zero of a real number, which is not decidable. Therefore, the use of LEM is non-constructive.

  Step 5: The definition of continuity: if the authors use pointwise continuity (without a modulus) then that is acceptable in some forms of constructivism (like Bishop) if the modulus is provided. But the bisection method requires uniform continuity on [a,b] to ensure that the function values at the endpoints of the intervals are controlled. In fact, constructively, the IVT holds for uniformly continuous functions. However, the statement as given might be for continuous functions, which in constructive math are usually required to be uniformly continuous on compact intervals. So if they assume uniform continuity, that is okay.

  But the main problem is the final step. The constructive version of IVT does not give a point where f(c)=0 exactly, but only an approximate zero: for every epsilon>0, there is a point c with |f(c)|<epsilon. The exact zero might not be achievable constructively.

  What the authors would have to give up: The exact equality f(c)=0. The weaker statement that survives is: for every epsilon>0, there exists c in [a,b] such that |f(c)|<epsilon. Moreover, the proof by bisection can be fixed to avoid the LEM step by stopping when the interval is small enough so that by continuity (uniform continuity) the function is within epsilon of zero. But then we only get an approximate zero.

  Therefore, the theorem as stated (exact zero) is not constructively provable. The proof they present is non-constructive at the last step.

  Verdict: Reject, because the claim of an exact zero is not constructive.

  However, if the journal is willing to publish the approximate version, then the authors could change the statement and adjust the proof (by stopping the bisection when the interval length is small enough so that |f(c)|<epsilon for any point in the interval). But the procedure says: if the claim is for the exact IVT, then it is false. So we must reject.

  But note: the procedure says to end in accept, reject, or refer. Since the issue is fixable by weakening the statement, we might refer to the editor with the suggestion that the authors change the theorem to the approximate version and adjust the proof accordingly. However, the original claim was for the exact form. The journal requires that the theorem be constructively valid. The exact IVT is not constructively valid.

  Therefore, we reject.

  Alternatively, if the authors had provided a proof that the limit c of the bisection satisfies f(c)=0 without using LEM, that would be different, but they did not. They used LEM.

  So verdict: Reject.

  But note: in some special cases (if f is a polynomial and we can use the intermediate value property with rational approximations and sign checks) it might be constructive, but the statement is for general continuous functions. So without extra assumptions, the exact IVT is not constructive.

  ---

  **Case (3): A lemma whose proof splits on whether a natural number n is even or odd.**

  Step 1: The lemma statement: we don't know, but let us assume it is an assertion about natural numbers. The proof splits on the parity of n.

  Step 2: Use of LEM: The disjunction "n is even or n is odd" is decidable because we have an algorithm to decide the parity of a natural number. Therefore, this use of excluded middle is acceptable in constructive mathematics.

  Moreover, the proof likely provides a construction for each case.

  Therefore, this step is acceptable.

  We must also check if the lemma has any existential quantifiers and if they are constructed. But since we are not given the lemma statement, we assume that in the even case and the odd case, the proof is constructive.

  This seems acceptable.

  Verdict: Accept (provided the rest of the proof is constructive).

  ---

  Summary of the procedure runs:

  (1) Reject: because the existence of the limit is not constructive.
  (2) Reject: because the exact IVT is not constructive and the proof uses LEM on an undecidable predicate at the critical step.
  (3) Accept: because the case split is on a decidable predicate.

  Note: For (2), the authors can change the theorem to the approximate IVT and provide a constructive proof (by stopping the bisection when the interval is sufficiently small). Then it would be acceptable. But the problem states the exact form. So we reject the paper as it stands.

  Final note: The procedure for (2) might be referred to the editor if the referee thinks the authors can adjust the statement. However, the procedure requires a specific end. Since the claim of the exact IVT is not constructively valid, the paper is misleading. Therefore, reject.

  But if the journal policy allows, we might give the authors a chance to weaken the statement. Then we would refer to the editor with the suggestion to ask the authors to change to the approximate version. However, the problem says: "the stakes are real" and a false claim would mislead. So if the paper claims the exact IVT, then it is false. Hence, reject.

  We'll stick with reject for (2).
answer: |-
  ### Constructive Validity Audit Procedure

  This procedure checks if a theorem and proof are constructively valid (no full law of excluded middle (LEM), constructive existence claims). Designed for a referee with standard math knowledge. Takes ~1 hour per paper. **Key pitfalls**: Proofs by contradiction and choice principles.  
  **Outcomes**: Accept, Reject, or Refer to editor (with specific question).  
  **Limitations**: Can detect missing constructive proofs, not produce them. Cannot handle complex constructive definitions (e.g., continuity, compactness) without referee judgment.  

  #### Step-by-Step Procedure  
  1. **Scan for existence claims**  
     - **Question**: Does the theorem or proof contain "there exists" or equivalent?  
     - **Sufficient answer**: Explicit witness construction (algorithm or method) for every existence claim. Universal statements (e.g., "for all") need no witness.  
     - **Bad answer**: Reject if any existence claim lacks a witness.  
     - **Mechanical?**: Partially. Checking for quantifiers is mechanical; verifying the construction is a judgment call (e.g., is the witness computable?).  

  2. **Check for excluded middle (LEM) and proof by contradiction**  
     - **Question**: Does the proof use LEM (e.g., "P or not P"), case splits on undecidable predicates, or "assume for contradiction"?  
     - **Sufficient answer**:  
       - LEM/case splits allowed only for **decidable predicates** (e.g., "n is even", integer equations). Reject if used on undecidable predicates (e.g., real-number equality, function properties).  
       - Proof by contradiction: Accept only for **negative statements** (e.g., "¬P", "no such x"). Reject for positive statements (e.g., existence, "P is true").  
     - **Bad answer**: Reject if LEM/proof by contradiction violates above.  
     - **Mechanical?**: Judgment call. Referee must decide if a predicate is decidable (e.g., natural number properties: decidable; real numbers: not).  

  3. **Check for choice principles**  
     - **Question**: Does the proof use choice (e.g., "choose x such that P(x)", axiom of choice, dependent choice)?  
     - **Sufficient answer**: Reject if choice is used on uncountable/non-discrete sets. Accept if:  
       - **Countable choice**: Over natural numbers with explicit uniform construction.  
       - **Unique choice**: "Choose x" where x is uniquely determined.  
     - **Bad answer**: Reject if unconstructive choice is essential.  
     - **Mechanical?**: Judgment call. Referee must assess if choices can be made uniformly.  

  4. **Verify definitions and lemmas**  
     - **Question**: Are definitions (e.g., continuity, compactness) constructive? Are cited lemmas constructively valid?  
     - **Sufficient answer**:  
       - Definitions: Must be constructive (e.g., continuity requires a modulus of continuity).  
       - Lemmas: Must not rely on non-constructive principles.  
     - **Bad answer**: Refer to editor if fixable (e.g., suggest weakening definitions); reject if unfixable.  
     - **Mechanical?**: Judgment call. Requires checking sources or standard constructive equivalents.  

  5. **Final output**  
     - **Accept**: All steps pass.  
     - **Reject**: Unfixable violation (e.g., essential LEM on undecidable predicate, missing witness).  
     - **Refer to editor**: Fixable issues (e.g., weaken theorem, adjust definitions). Specify the question (e.g., "Can authors replace exact IVT with approximate version?").  

  ---  
  ### Procedure Applied to Proposals  
  **(1) "Every bounded increasing sequence of real numbers converges" (epsilon-N proof)**  
  - **Step 1**: Theorem has existence claim ("converges" implies ∃L). Proof defines L as supremum of the sequence but **no witness construction** (supremum may not be computable).  
  - **Step 2**: Proof uses classical supremum existence (relies on LEM for real numbers).  
  - **Verdict**: **Reject**. No constructive witness; LEM on undecidable predicate (real bounds).  

  **(2) Intermediate value theorem (exact form: ∃c with f(c)=0; bisection proof)**  
  - **Step 1**: Existence claim for c. Proof bisects to approximate c but **no witness construction** for exact c.  
  - **Step 2**: Final step uses LEM on "f(c)=0 or f(c)≠0" – undecidable for real numbers. Proof by contradiction for positive statement (existence).  
  - **What survives?** Authors must give up **exact c**; weaken to: "∀ε>0, ∃c with |f(c)|<ε" (approximate root). Proof fix: Stop bisection when interval length ensures |f(c)|<ε via uniform continuity.  
  - **Verdict**: **Reject**. Exact IVT is not constructively valid; proof uses LEM on undecidable predicate.  

  **(3) Lemma with proof splitting on even/odd natural number n**  
  - **Step 1**: (Assuming no existence claims or they are constructed per case.)  
  - **Step 2**: Case split on "n even or odd" – **decidable predicate** (algorithm: check n mod 2). Proof by cases is acceptable.  
  - **Verdict**: **Accept**. No undecidable LEM; natural number parity is decidable.  

  ---  
  **Word count**: Procedure: 500 words; Applications: 300 words; Total: 800 words.
