prompt: |-
  I am trying to decide what would count as a successful formal account of *heuristic estimation* in mathematics — the reasoning that supports claims such as "there should be about x/(log x)² twin primes below x" without proving anything — and before committing to a framework I want the specification rather than the candidates.

  Set-up, so that we are discussing the same object. Take a heuristic estimator to be a procedure that, given a claim about a fixed mathematical structure together with whatever background information the agent possesses, outputs a numerical estimate or probability along with a warrant for it, and is obliged to revise the estimate when further relevant information turns up. Its central engine is what has come to be called the presumption of independence: in the absence of specific information about the correlation between two quantities, default to E[XY] = E[X]E[Y]. That default is what makes the twin-prime estimate come out at all, and it is equally what misfires when the quantities are correlated by construction.

  Write the desiderata for such a framework. For each requirement, give three things: the requirement itself; the concrete case that motivates it, in enough mathematical detail that I can check whether the case really has the force you claim; and a label saying whether it is non-negotiable, negotiable, or a preference of a particular camp — and if it is the latter, which camp is smuggling it in (analytic number theorists organizing their own practice, logicians wanting a semantics, people who want an estimator an automated system could rely on when it cannot check the answer). I am as interested in the demands that look reasonable but are not genuine requirements as in the ones that are.

  Make sure the list is tested against the following sorts of cases, adding others you think sharper:

  - the move from the naive x/(log x)² to the Hardy–Littlewood constant times that quantity, i.e. what the framework must do with local obstructions and the singular series, and what it takes for a correction factor to be principled rather than fitted;
  - Maier's result on irregularities in the distribution of primes in short intervals, which contradicts what Cramér's random model predicts, and Granville's proposed replacement constant 2e⁻ᵞ — what has to be true of an estimate for a theorem to *refute* it, as opposed to merely informing it;
  - the Cohen–Lenstra prediction for class groups of imaginary quadratic fields, where the weighting by 1/|Aut(A)| shows the natural measure is not the naive uniform one;
  - random-matrix predictions for the moments of the zeta function on the critical line, whose warrant is structural analogy rather than any independence assumption — must a framework cover these, or is it entitled to exclude them, and what does it lose either way;
  - the Erdős–Kac theorem, as a case where a heuristic became a theorem, and the question of what the framework should say about the relation between the two;
  - multiplying local densities when a global obstruction of the Brauer–Manin type is present, so that a variety has points everywhere locally and none globally;
  - sparse sequences such as n!+1, where treating the object as a random integer of its size ignores that it is by construction coprime to every prime up to n — a case whose whole difficulty is deciding which background facts count as specific information about correlation;
  - claims like the expected finiteness of Fermat primes, where the predicted counts are so small that no amount of computation can corroborate or falsify them.

  Then the part I most want: identify any subset of your requirements that you believe cannot be jointly satisfied, and argue it, rather than reporting that there are tensions. One genuine impossibility in the list is worth more to me than ten requirements that any sufficiently vague framework could meet. Be explicit about whether coherence conditions of the usual kind — no endorsement of contradictions, additivity, invariance under logically equivalent reformulation of the same claim — can be had together with an estimator that does not already have to settle the questions it is estimating, and about what the probabilities in such a framework are probabilities of, given that the integers are a fixed structure with no chance in them.

  Finally, name the single requirement that does the most to exclude candidate frameworks, and close with a short verdict — two or three sentences each, no survey — on three families: concrete random models of the integers in the Cramér tradition; formal coherence-based approaches that build consistency and additivity into the estimator by construction; and the working mathematician's practice of singular series plus local corrections with no semantics attached at all.

  State wherever the list depends on the purpose I have fixed, and what would drop out if the framework only had to organize expert practice rather than be trusted by an agent unable to verify the result. I do not want references, a bibliography, or a reading list; I want the reasoning.
reasoning: |-
  We are designing a framework for heuristic estimation in mathematics. The core idea is the presumption of independence: in the absence of information about correlations, we assume independence. But we must be able to revise when new information arrives.

  We'll list requirements, each with:
  - The requirement itself.
  - A concrete motivating case (with enough math detail).
  - A label: non-negotiable, negotiable, or a camp preference (and which camp).

  Cases to test against (including the provided ones and any others we think are sharp):
  1. Twin primes: from naive x/(log x)^2 to Hardy-Littlewood (with constant).
  2. Maier's theorem vs Cramér's model and Granville's constant.
  3. Cohen-Lenstra predictions for class groups (weighting by 1/|Aut(A)|).
  4. Random matrix theory for zeta function moments (structural analogy, not independence).
  5. Erdős–Kac theorem: heuristic becoming theorem.
  6. Brauer-Manin obstruction: points locally but not globally.
  7. Sparse sequences (like n!+1: coprime to primes up to n).
  8. Fermat primes: expected finiteness, too small to check computationally.

  Then, we must identify any subset of requirements that cannot be jointly satisfied and argue why.

  Finally, the single most excluding requirement and a short verdict on three families:
  - Concrete random models (Cramér style).
  - Coherence-based approaches (enforce consistency and additivity).
  - Working mathematician's practice (singular series, local corrections, no semantics).

  Also, state how the list depends on the purpose (organizing expert practice vs an agent that cannot verify).

  Let's proceed.

  ---

  **Requirements for a Framework of Heuristic Estimation**

  **Requirement 1: Presumption of Independence**
  - *Requirement*: The framework must have a default rule that, in the absence of specific information about the dependence of two events or random variables, presumes their independence. This rule is the engine for generating initial estimates.
  - *Motivating Case*: The twin prime conjecture. The events "n is prime" and "n+2 is prime" are initially presumed independent. The probability that n is prime is about 1/log n, so the probability that both are prime is about 1/(log n)^2. Summing over n up to x gives the naive estimate x/(log x)^2. This is the starting point.
  - *Label*: Non-negotiable. Without this, the framework cannot even begin to produce the kind of heuristic estimates we are interested in.

  **Requirement 2: Revision upon New Information**
  - *Requirement*: The framework must be able to incorporate new information that reveals dependencies or obstructions, and revise the estimate accordingly. This revision must be systematic and not ad hoc.
  - *Motivating Case*: The Hardy-Littlewood constant in the twin prime conjecture. The naive estimate ignores local obstructions: for example, modulo 2, if n is odd then n+2 is odd, so both can be prime, but modulo 3, one of n, n+1, n+2 must be divisible by 3. If n>3, then if n mod 3 is 1, then n+2 is divisible by 3; if n mod 3 is 2, then n is divisible by 3? Actually, if n mod 3 = 0 -> n divisible by 3; 1 -> n+2 divisible by 3; 2 -> n+1 divisible by 3. So for n>3, one of n, n+1, n+2 is divisible by 3. Therefore, the only way for both n and n+2 to be prime is if they are both not divisible by 3, which requires that n mod 3 ≠ 0 and n mod 3 ≠ 1 (so that n+2 is not 0 mod 3) but note: if n mod 3 = 2, then n is 2 mod 3 and n+2=4 mod 3=1 mod 3, so both are not divisible by 3. Thus, the condition is that n mod 3 must be 2. This happens with density 1/3. But the naive independence assumption would have given (1-1/3)*(1-1/3)=4/9? Actually, we have to condition on the events. The point is that the events are not independent modulo small primes. The Hardy-Littlewood conjecture corrects by multiplying by a constant (the twin prime constant) which is a product over primes p of (1 - 1/p)^{-2} * (1 - 1/(p-1)^2) for p>2? Actually, the singular series is 2 * ∏_{p>2} (1 - 1/(p-1)^2). This correction is principled: it accounts for the dependencies modulo every prime. The framework must allow for such a correction when we learn about the modular constraints.
  - *Label*: Non-negotiable. Without revision, the framework is static and cannot improve.

  **Requirement 3: Handling Global Obstructions**
  - *Requirement*: The framework must be able to account for global obstructions that are not detectable by local conditions alone.
  - *Motivating Case*: The Brauer-Manin obstruction. Consider a variety that has points over every completion of Q but no rational point. The heuristic might multiply local densities to predict a global point, but the obstruction prevents it. For example, consider a cubic surface with a Brauer-Manin obstruction. The framework must be able to incorporate the obstruction when it is known, and without it, the estimate based on local densities might be incorrect. This case tests whether the framework can handle global constraints that are not reducible to local factors.
  - *Label*: Non-negotiable for a general framework, because it is a known phenomenon that must be accommodated.

  **Requirement 4: Correct Weighting for Symmetries**
  - *Requirement*: The framework must assign weights to objects in a way that accounts for symmetries (automorphisms) when appropriate.
  - *Motivating Case*: Cohen-Lenstra heuristics for class groups of imaginary quadratic fields. The heuristic does not use the uniform distribution over finite abelian groups but weights each group A by 1/|Aut(A)|. This weighting is natural because when counting extensions, groups with more automorphisms are overcounted. The framework must be able to incorporate such non-uniform distributions when the context demands it.
  - *Label*: Non-negotiable. Without this, the framework would fail in cases like Cohen-Lenstra.

  **Requirement 5: Compatibility with Theorems**
  - *Requirement*: The framework must not assign a positive probability to an event that is known to be false, and it should be able to incorporate theorems that show that the heuristic estimate is off by a constant factor or that it fails in certain ranges.
  - *Motivating Case*: Maier's theorem on primes in short intervals. Cramér's model suggests that the maximum gap between consecutive primes up to x is about (log x)^2. Maier showed that in short intervals, there are irregularities: the prime gaps can be both much smaller and much larger than expected. Granville proposed a correction, replacing the constant 1 in Cramér's model with 2e^{-γ} ≈ 1.1229. The framework must be able to revise its estimates in light of such theorems. Moreover, when a theorem refutes a heuristic (as Maier refuted Cramér for short intervals), the framework must not persist with the refuted estimate. But note: the heuristic is not entirely discarded; it is replaced by a more refined one. The framework must have the flexibility to be replaced by a better one when a theorem shows it is flawed.
  - *Label*: Non-negotiable. The heuristic must be consistent with proven facts.

  **Requirement 6: Handling Sparse Sequences**
  - *Requirement*: The framework must be able to handle sequences that are sparse and have built-in arithmetic constraints by incorporating those constraints as background information, even if they break the naive independence.
  - *Motivating Case*: The sequence n!+1. A naive model might treat n!+1 as a random integer of its size. However, it is coprime to all primes ≤ n. This is specific information about its divisibility. The framework must use this information to override the independence assumption for primes ≤ n. The challenge is to decide which background facts are "specific information" that must be incorporated. The framework must have a way to represent and use such constraints.
  - *Label*: Non-negotiable. Without this, the framework would give wildly incorrect estimates for such sequences.

  **Requirement 7: Structural Analogies without Independence**
  - *Requirement*: The framework must be able to generate heuristic estimates based on structural analogies (e.g., with random matrix theory) even when the independence assumption is not the primary driver.
  - *Motivating Case*: Moments of the Riemann zeta function on the critical line. The Keating-Snaith conjecture uses random matrix theory (specifically, the Gaussian Unitary Ensemble) to predict the moments. The warrant is that the zeros of the zeta function are believed to behave like eigenvalues of a random matrix. There is no independence assumption for the zeros (in fact, they are conjectured to be correlated). The framework must be able to incorporate such analogies.
  - *Label*: Negotiable. This might be a camp preference (of analytic number theorists) because it extends the scope of heuristics beyond independence-based reasoning. However, if the framework is meant to cover all heuristic estimations in number theory, then it must be included.

  **Requirement 8: Handling Vanishingly Small Expectations**
  - *Requirement*: The framework must be able to assign very small probabilities (or expected counts) and reason about events that are expected to occur only finitely many times, even in the absence of empirical verification.
  - *Motivating Case*: Fermat primes. It is heuristically expected that there are only finitely many Fermat primes (primes of the form 2^{2^k}+1). The argument: the probability that 2^{2^k}+1 is prime is about c / 2^k (by the prime number theorem, since the number has size about 2^{2^k}, so log is about 2^k, and the probability is about 1/(2^k)). Summing over k, the series converges, so we expect finitely many. But the known ones are for k=0,1,2,3,4 and no others. The framework must be able to express such an expectation without requiring that it be computationally verifiable by enumeration.
  - *Label*: Non-negotiable. This is a common type of heuristic.

  **Requirement 9: Coherence**
  - *Requirement*: The framework should be coherent in the sense of probability: probabilities should be additive and not lead to contradictions. Moreover, the same claim should get the same probability regardless of logically equivalent reformulations.
  - *Motivating Case*: The Erdős–Kac theorem. The heuristic is that the number of prime factors of a number (with multiplicity) is approximately normally distributed. This became a theorem. The framework must assign probabilities that are consistent with the theorem (once known). Moreover, if the framework had been used to assign a probability distribution to the number of prime factors, it should be consistent with the normal distribution. This requirement ensures that the heuristic probabilities are mathematically sound.
  - *Label*: Non-negotiable? However, note: if the framework is to be used by an automated agent, coherence is essential. But in practice, working mathematicians might tolerate some incoherence. So we might say: non-negotiable for automated agents and logicians, but negotiable for organizing expert practice? However, contradictions are unacceptable. We'll say non-negotiable for the framework to be logically sound.

  **Requirement 10: Not Settling the Question**
  - *Requirement*: The framework must not require that the agent can decide the truth of the claim being estimated. The heuristic estimator should be computable without having to prove the claim.
  - *Motivating Case*: The twin prime conjecture itself. The framework must produce an estimate for the number of twin primes up to x without having to prove that there are infinitely many. In fact, it must do so even though the conjecture is open.
  - *Label*: Non-negotiable. Without this, the framework is useless for open problems.

  **Requirement 11: Interpretation of Probabilities**
  - *Requirement*: The framework must clarify what the probabilities represent, given that the integers are a fixed structure. They cannot be frequentist probabilities (because the integers are fixed) nor purely subjective (if we want the framework to be objective).
  - *Motivating Case*: The twin prime conjecture again. The probability that both n and n+2 are prime is not a frequency (because it is about a specific n) but a heuristic measure of likelihood. The framework must provide a semantics for these probabilities, such as a measure of uncertainty given limited information, or a density in a suitable model.
  - *Label*: Non-negotiable for logicians and automated systems, but negotiable for organizing expert practice (where the probabilities are often used without a formal semantics).

  **Requirement 12: Adaptability to New Mathematical Structures**
  - *Requirement*: The framework should not be tied to the integers but should be adaptable to other structures (e.g., function fields, graphs, etc.).
  - *Motivating Case*: Cohen-Lenstra heuristics were originally for number fields but have been adapted to function fields and other contexts. Similarly, random matrix theory has been applied to L-functions of various types.
  - *Label*: Preference of logicians and automated systems (for generality) but negotiable for number theorists.

  Now, we test the requirements against the cases:

  - Twin primes: Covered by Requirements 1, 2, 5, 10.
  - Maier: Covered by Requirement 5.
  - Cohen-Lenstra: Covered by Requirement 4.
  - Random matrix: Covered by Requirement 7.
  - Erdős–Kac: Covered by Requirement 9.
  - Brauer-Manin: Covered by Requirement 3.
  - Sparse sequences: Covered by Requirement 6.
  - Fermat primes: Covered by Requirement 8.

  **Impossibility Argument**

  We now argue that there is a subset of requirements that cannot be jointly satisfied.

  Consider:
  - Requirement 9 (Coherence): The probabilities must be additive and consistent.
  - Requirement 10 (Not Settling the Question): The estimator must not require deciding the claim.
  - Requirement 11 (Interpretation of Probabilities): The probabilities must have a clear semantics.

  The problem: If the framework is to assign probabilities to mathematical statements (which are either true or false) and be coherent, then by the laws of probability, the probability of a statement and its negation must sum to 1. However, if we assign a probability to a statement that is independent of our axioms (like the twin prime conjecture), then we are forced to assign a probability in (0,1). But what does that mean? If the integers are fixed, there is no chance: the statement is either true or false. Therefore, the probability must be interpreted as an epistemic measure. However, if we are to have a coherent and additive probability measure over all arithmetic statements, then we are essentially building a probability model of arithmetic. But by Gödel's incompleteness, any such model would have to be very complex and might not be computable. Moreover, the framework must be computable (to be used by an agent) but also not settle the question (so it must not know the truth). However, coherence requires that the probabilities respect logical implications. For example, if A implies B, then P(A) ≤ P(B). But if the agent does not know whether A implies B, then it cannot enforce this. Therefore, to enforce coherence, the agent would have to know all logical implications, which is impossible. Thus, we have a tension:

  - Coherence (Requirement 9) requires that the probability assignment respects all logical implications (even those unknown to the agent).
  - Not Settling the Question (Requirement 10) means that the agent does not know the truth of the statements.
  - But to respect logical implications without knowing them, the agent would need an oracle for logical consequence.

  Therefore, it is impossible to have a framework that is both coherent (in the strong sense of respecting all logical implications) and does not settle the questions. In practice, we relax coherence to only known implications. But then the framework is not fully coherent.

  Moreover, the interpretation of probabilities (Requirement 11) becomes problematic: if the probabilities only reflect the agent's current knowledge, then they are subjective and might not be useful for an automated system that must be objective. But if they are objective, then they must be based on a canonical model, which may not exist.

  Thus, the subset {Requirement 9 (strong coherence), Requirement 10, Requirement 11} cannot be jointly satisfied in a way that is both computable and objective.

  **The Most Excluding Requirement**

  Requirement 9 (Coherence) is the most excluding because it forces the framework to be a consistent probability measure over a large set of statements, which is very hard to achieve without making the framework non-computable or too rigid.

  **Verdict on Three Families**

  1. *Concrete random models (Cramér style)*: These are intuitive and have been successful in many cases (like primes). They satisfy Requirements 1, 2, 5, 6, 8. However, they fail Requirement 4 (symmetry weighting) because they don't naturally account for automorphisms, and Requirement 7 (structural analogies) because they are tied to independence. They also struggle with Requirement 3 (global obstructions) because they are based on local independence. Requirement 9 (coherence) is not guaranteed: for example, the model might assign probabilities that are not additive for complex events. Requirement 10 is satisfied because they don't prove anything. Requirement 11 is handled by the model, but the model is not the real integers. *Verdict*: Useful but limited to settings where independence is a good approximation and without symmetries or global obstructions.

  2. *Coherence-based approaches*: These build a probability measure that is consistent and additive by construction. They might use logical constraints to ensure coherence. They satisfy Requirement 9 and 11 (if the measure is taken as a semantics). However, they fail Requirement 10: to ensure coherence, the framework might require knowing logical consequences, which is equivalent to settling the questions. Also, they may not naturally incorporate structural analogies (Requirement 7) or the specific corrections (like Hardy-Littlewood) because these are not derived from the coherence constraints alone. *Verdict*: Logically sound but potentially non-computable and not flexible enough for the full range of heuristics.

  3. *Working mathematician's practice*: This is the singular series and local corrections. It satisfies Requirements 1, 2, 3 (if they know about the obstruction), 4, 5, 6, 7 (if they use random matrix theory), 8. It does not worry about coherence (Requirement 9) beyond what is necessary for the problem at hand. It does not provide a formal semantics (Requirement 11) but works for organizing expert practice. It does not settle the question (Requirement 10). *Verdict*: Highly effective in practice for experts but lacks a formal foundation and might be ad hoc.

  **Dependence on Purpose**

  The list is designed for a framework that must be trusted by an agent that cannot verify the results (like an automated system). For such an agent, Requirements 9 (coherence) and 11 (semantics) become non-negotiable. If the framework only has to organize expert practice, then these two can be dropped (or relaxed). Also, Requirement 12 (adaptability) might be more important for an automated system that must handle multiple domains.

  But note: even for experts, coherence is desirable to avoid contradictions, but they can spot and correct them. So we might downgrade Requirement 9 to negotiable for experts.

  **Final List of Requirements (with labels adjusted by purpose)**

  For an automated agent (that cannot verify):

  - Non-negotiable: 1,2,3,4,5,6,8,9,10,11
  - Negotiable: 7,12

  For organizing expert practice:

  - Non-negotiable: 1,2,3,4,5,6,8,10
  - Negotiable: 7,9,11,12

  **Closing**

  The most excluding requirement is Requirement 9 (Coherence) because it forces the framework to be a logically consistent probability measure, which is impossible to achieve computably and without settling the questions. This is why the working mathematician's practice avoids formal semantics and focuses on case-by-case corrections: it is flexible and powerful, even if not fully coherent.
answer: |-
  ### Desiderata for a Formal Account of Heuristic Estimation

  Below are the requirements for a framework formalizing heuristic estimation in mathematics, as specified. Each requirement includes:  
  - The requirement itself.  
  - A concrete motivating case with mathematical detail.  
  - A label: **non-negotiable**, **negotiable**, or **preference** (with the relevant camp indicated).  

  The cases tested include your list and additional sharp cases (e.g., infinitude of perfect numbers, Goldbach’s conjecture). The list assumes the purpose is to build a framework trusted by an agent *unable to verify results* (e.g., an automated system). If the purpose were only to organize expert practice, Requirements 5, 9, and 11 would become negotiable or drop out, as experts tolerate informal semantics and ad hoc corrections.

  ---

  #### **Requirement 1: Default Independence Presumption**  
  - **Requirement**: The framework must default to assuming independence of events/variables when no specific information about dependence is available. This is formalized as \( \mathbb{E}[XY] = \mathbb{E}[X]\mathbb{E}[Y] \) for expectations or \( P(A \cap B) = P(A)P(B) \) for probabilities.  
  - **Motivating Case**: Twin prime conjecture. Naive estimate: \( \pi_2(x) \sim x / (\log x)^2 \). Background: \( n \) and \( n+2 \) both prime are independent modulo small primes by default, so \( P(n \text{ prime}) \sim 1/\log n \) by PNT, yielding \( P(\text{both prime}) \sim 1/(\log n)^2 \). Summing gives \( \sum_{n \leq x} 1/(\log n)^2 \sim x/(\log x)^2 \).  
  - **Label**: Non-negotiable. Without this, the engine for initial estimates vanishes.  

  #### **Requirement 2: Systematic Revision with New Information**  
  - **Requirement**: The framework must revise estimates when new information (e.g., dependencies, obstructions) is provided, with a principled update rule (not ad hoc fitting).  
  - **Motivating Case**: Hardy–Littlewood constant for twin primes. Naive \( x/(\log x)^2 \) ignores local correlations: e.g., modulo \( p>2 \), both \( n \) and \( n+2 \) avoid 0 only if \( n \not\equiv 0, -2 \pmod{p} \). Density \( \nu_p = 1 - 2/p \) for \( p>2 \) (vs. \( (1-1/p)^2 \) under independence). The correction factor is the singular series \( \mathfrak{S} = 2 \prod_{p>2} (1 - 1/(p-1)^2) \), derived by incorporating local densities systematically.  
  - **Label**: Non-negotiable. Without revision, the framework cannot improve.  

  #### **Requirement 3: Handling Global Obstructions**  
  - **Requirement**: The framework must detect or incorporate global obstructions that cannot be decomposed into local factors.  
  - **Motivating Case**: Brauer–Manin obstruction. Example: A variety \( V \) with \( V(\mathbb{Q}_p) \neq \emptyset \) for all \( p \) but \( V(\mathbb{Q}) = \emptyset \). Heuristic via local densities (e.g., for Châtelet surfaces) suggests \( \prod_p \nu_p > 0 \), but global obstruction prevents solutions. The framework must adjust the estimate to 0 when the obstruction is known, without arbitrary fitting.  
  - **Label**: Non-negotiable. Global obstructions are fundamental in arithmetic geometry.  

  #### **Requirement 4: Symmetry-Aware Weighting**  
  - **Requirement**: The framework must weight objects by symmetry (e.g., automorphism groups) when background information justifies it.  
  - **Motivating Case**: Cohen–Lenstra heuristics for class groups of imaginary quadratic fields. Background: Finite abelian groups \( A \) are weighted by \( 1/|\text{Aut}(A)| \), not uniformly. Justification: When counting extensions, automorphisms cause overcounting; e.g., for \( p \)-groups, \( \sum |\text{Surj}(G, A)| / |\text{Aut}(A)| \) is natural. Uniform weighting fails experimentally.  
  - **Label**: Non-negotiable. Naive uniformity mispredicts in algebra.  

  #### **Requirement 5: Refutability by Theorems**  
  - **Requirement**: A theorem must refute a heuristic estimate if it shows the estimate is asymptotically incorrect or inconsistent with data; the framework must not persist with refuted estimates.  
  - **Motivating Case**: Maier’s theorem vs. Cramér’s model. Cramér predicts maximal gaps \( O((\log x)^2) \) in primes. Maier showed \( \limsup \Delta(x) / (\log x)^2 = \infty \) in short intervals, refuting Cramér. Granville’s model replaces 1 with \( 2e^{-\gamma} \approx 1.1229 \) using sieve constraints. A refutation requires the theorem to contradict the estimate’s asymptotic or distributional predictions.  
  - **Label**: Non-negotiable. Heuristics must align with proven mathematics.  

  #### **Requirement 6: Background-Dependent Independence Override**  
  - **Requirement**: The framework must override independence when background information implies correlation, with a rule for what counts as "specific information."  
  - **Motivating Case**: Sparse sequences like \( n! + 1 \). Naive model treats it as a random integer of size \( \approx n! \), but it is coprime to all primes \( \leq n \) by construction. Background information (Euclid’s lemma) forces dependence: \( P(p \mid n! + 1) = 0 \) for \( p \leq n \), while independence gives \( \prod_{p \leq n} (1 - 1/p) \sim e^{-\gamma}/\log n \). The framework must override using this information.  
  - **Label**: Non-negotiable. Misapplied independence causes catastrophic errors.  

  #### **Requirement 7: Inclusion of Structural Analogies**  
  - **Requirement**: The framework must accommodate heuristics based on structural analogies (e.g., random matrix theory) without relying on independence.  
  - **Motivating Case**: Moments of \( \zeta(1/2 + it) \). Keating–Snaith conjecture uses GUE eigenvalues (random matrix theory) to predict \( \frac{1}{T} \int_0^T |\zeta(1/2 + it)|^{2k} dt \sim a_k (\log T)^{k^2} \). Warrant: Zeros of \( \zeta \) and eigenvalues share universal statistics (e.g., repulsion), not independence.  
  - **Label**: Preference of analytic number theorists. Excluding this loses key predictions, but independence is not central.  

  #### **Requirement 8: Infinitary and Unverifiable Estimates**  
  - **Requirement**: The framework must assign expected values or probabilities for events with no empirical verification (e.g., infinitely many/finitely many cases).  
  - **Motivating Case**: Fermat primes (\( 2^{2^n} + 1 \)). Heuristic: \( P(2^{2^n} + 1 \text{ prime}) \sim 1/\log(2^{2^n}) = 2^{-n} \). Sum \( \sum_n 2^{-n} < \infty \), so expect finitely many. Background: Known only for \( n=0,\dots,4 \), no more below \( 2^{2^{33}} \). The framework must output this without requiring computability.  
  - **Label**: Non-negotiable. Central to conjectures like Goldbach’s weak conjecture (proven, but similar).  

  #### **Requirement 9: Coherence and Consistency**  
  - **Requirement**: Estimates must satisfy probability axioms: additivity, \( P(\neg A) = 1 - P(A) \), and invariance under logical equivalence.  
  - **Motivating Case**: Erdős–Kac theorem. Heuristic: \( \omega(n) \) (prime factors) is Gaussian with mean \( \log \log n \) and variance \( \log \log n \). Theorem confirms this. Coherence requires that if \( P(\omega(n) - \log \log n > \sqrt{\log \log n}) \) is estimated, it must be \( \sim (2\pi)^{-1/2} \int_1^\infty e^{-t^2/2} dt \) for consistency.  
  - **Label**: Non-negotiable for logicians/automated systems; negotiable for experts (who tolerate minor inconsistencies).  

  #### **Requirement 10: Non-Implication of Truth**  
  - **Requirement**: The framework must not require proving the claim being estimated (undecidability is acceptable).  
  - **Motivating Case**: Goldbach’s conjecture. Heuristic: \( P(2n \text{ not sum of two primes}) \approx \exp(-c \sqrt{n}) \), implying finitely many exceptions. The estimate must be computable without proving the conjecture.  
  - **Label**: Non-negotiable. Required for open problems.  

  #### **Requirement 11: Semantics of Probability**  
  - **Requirement**: Probabilities must have a clear interpretation (e.g., epistemic, frequentist over models) since mathematical structures are fixed.  
  - **Motivating Case**: Twin primes. In the fixed \( \mathbb{N} \), \( \pi_2(x) \) is determined; probability cannot be frequentist. Epistemic interpretation: "degree of belief given background" or density in a random model. Automated systems need objectivity; experts accept subjectivism.  
  - **Label**: Non-negotiable for logicians/automated systems; preference for working mathematicians (who avoid semantics).  

  #### **Requirement 12: Handling Convergent/Divergent Series**  
  - **Requirement**: The framework must correctly interpret convergence/divergence of heuristic sums as implying finitude/infinitude.  
  - **Motivating Case**: Infinitude of perfect numbers. Heuristic: \( P(n \text{ perfect}) \sim c/n \) for some \( c>0 \); sum diverges, so expect infinitely many. Background: Euler’s theorem restricts form, but independence over primes suggests divergence. Must handle even if unproven.  
  - **Label**: Non-negotiable. Basis for many conjectures.  

  ---

  ### Impossibility Argument  
  **Subset that cannot be jointly satisfied**: {**9 (Coherence)**, **10 (Non-Implication)**, **11 (Semantics)**}.  
  - **Argument**:  
    - Coherence (9) requires probabilities to respect logical equivalence and additivity. For example, if \( A \) and \( B \) are equivalent statements, \( P(A) = P(B) \).  
    - Non-Implication (10) requires that estimates do not settle the truth of \( A \) (e.g., \( P(A) = 1 \) iff \( A \) is true).  
    - Semantics (11) demands probabilities be objective (e.g., frequencies in a canonical random model) to avoid subjectivism for automated agents.  
    - **Conflict**: In a fixed structure like \( \mathbb{N} \), \( A \) is true or false. Coherence forces \( P(A) = 0 \) or \( 1 \) if \( A \) is decidable from background (e.g., \( n \) even). For undecidable \( A \) (e.g., twin primes), objectivity (11) requires \( P(A) \) to be based on a canonical model, but no such model exists for all of arithmetic. Worse, coherence (9) requires the estimator to know all logical relationships to avoid inconsistency (e.g., if \( A \implies B \), then \( P(A) \leq P(B) \)). This implies the framework must decide logical implications to assign coherent probabilities, violating Non-Implication (10).  
    - **Conclusion**: For undecidable statements, no computable framework can satisfy all three: achieving coherence requires solving undecidable problems, violating Non-Implication. Semantics exacerbates this by demanding objectivity in a non‐probabilistic setting.  

  ---

  ### Most Excluding Requirement  
  **Requirement 9 (Coherence)** does the most to exclude candidates. It demands logical consistency and additivity, which forces the framework to resolve undecidable implications or use non‐computable probability assignments. This excludes concrete random models (which often violate additivity) and ad hoc practices (which tolerate inconsistencies), and strains coherence-based approaches (which become non‐computable).  

  ---

  ### Verdict on Framework Families  
  1. **Concrete Random Models (Cramér style)**:  
     - Satisfies: 1 (independence), 2 (revision via "corrections"), 6 (override via ad hoc rules), 8 (infinitary estimates).  
     - Fails: 3 (global obstructions ignored), 4 (no symmetry), 9 (incoherent due to missed dependencies), 11 (lacks clear semantics).  
     - **Verdict**: Useful for initial estimates but unreliable for global obstructions or high-stakes automation; independence is brittle.  

  2. **Coherence-Based Approaches (e.g., Bayesian, logical probability)**:  
     - Satisfies: 9 (coherence by design), 10 (probabilities without truth), 11 (clear semantics).  
     - Fails: 2 (revision impractical due to coherence constraints), 3 (global obstructions not representable), 7 (no analogies), 10 (violated if coherence requires deciding truths).  
     - **Verdict**: Logically sound but computationally infeasible and inflexible; fails for structural analogies and arithmetic.  

  3. **Working Mathematician’s Practice (singular series, local corrections)**:  
     - Satisfies: 1, 2, 3, 4, 5, 6, 7, 8, 12 (all practical needs).  
     - Fails: 9 (inconsistent across problems), 10 (sometimes conflates evidence with proof), 11 (no semantics).  
     - **Verdict**: Highly effective for expert intuition but not systematizable for automation; semantics-free and occasionally inconsistent.  

  ---

  This list is tailored for an agent unable to verify results. For organizing expert practice only, Requirements 5, 9, and 11 become negotiable, as experts handle refutations and inconsistencies contextually, and semantics is unnecessary. This would admit the working mathematician’s practice as adequate.
