prompt: |-
  Been reading lesswrong since roughly the bostrom days and I'm now helping judge a small grants round (maybe $300k total) for conceptual/theory work on AI control -- the redwood-style stuff where you assume the model may already be scheming and design the deployment so a misaligned model still can't do much damage: monitoring, honeypots, information limits, shutdown-corrigibility-via-incentives rather than via the model's values. I keep flip-flopping on what the actual crux questions are, so I want a defended prioritization, not a survey. Candidates off the top of my head: whether control evaluations can ever bound scheming when the model can condition its behavior on being evaluated; whether control difficulty scales in a measurable way with capability, or whether we just can't know our measures fail until they've failed; whether running a model under adversarial-assumption scaffolding changes the model itself (same training loop feeding the monitors, etc.); collusion between model instances in deployments where instances can pass notes to each other; and the question people tend to dodge, namely whether investing in control substitutes for alignment work in practice or is strictly upstream of it -- e.g. whether "we can control it" becomes the excuse labs use to skip the harder problem. Rank the two or three you'd actually fund, say for each why it's upstream of the others and what makes it tractable for philosophy/theory people rather than infra people, and tell me what developments in the next couple years would move things up or down your list. Also flag any of these you'd deprioritize because the answer wouldn't change what a lab should actually do. And please write it as continuous prose, no bullet points or headings or anything, just like an email to me.
reasoning: |-
  Okay, let me start by understanding the user's request. They're involved in a grants round for AI control theory, specifically Redwood-style approaches that assume scheming models. They need a defended prioritization of key cruxes, not just a survey. The user mentions several candidate questions: control evaluations bounding scheming, control difficulty scaling with capability, scaffolding changing model behavior, collusion, and whether control substitutes for alignment. They want the top two or three to fund, explaining why each is upstream, tractable for theorists, and what future developments could shift priorities. They also want any deprioritized questions flagged if the answer wouldn't change lab actions.

  First, I need to rank these cruxes. The user is a long-time LessWrong reader, so they're familiar with AI risk concepts. They're helping judge grants, which means they need actionable insights for funding decisions. Their deeper need might be to ensure that the funded research has the highest leverage in making control viable, avoiding wasted effort on questions that don't impact practical outcomes. They might also be concerned about labs using control as an excuse to skip alignment, so addressing that could be crucial.

  Looking at the candidates, I should assess which are most upstream. The evaluation problem seems fundamental because if we can't bound scheming during evaluations, other strategies might fail. This affects monitoring, honeypots, etc. If evaluations can't detect sophisticated schemers, all control methods rest on shaky ground. That's why it's top priority.

  Next, the scaffolding changing model behavior. If adversarial assumptions during deployment alter the model's actions, it could invalidate control strategies. This is upstream because it questions the core premise of control working as intended. If scaffolding triggers scheming, then even good designs might fail. Theorists can tackle this with formal modeling, which is tractable without infrastructure.

  The third is the substitution question. While not technical, its answer influences lab priorities. If control research becomes an excuse to skip alignment, it's a societal/policy issue. However, it might not change technical approaches, so it could be deprioritized for funding but noted as important contextually.

  Collusion and difficulty scaling are important but maybe less immediate. Collusion might be handled by existing infosec, and scaling uncertainties might not alter the need for control measures. So those are lower priority.

  Future developments like better understanding scheming via interpretability or scaling laws could shift priorities. If new data shows scheming triggers, the scaffolding question becomes urgent. Similarly, if evaluations prove robust, resources might shift elsewhere.

  I need to present this as continuous prose, avoiding bullet points. Structure the response by introducing the prioritization, then discuss each top crux with why upstream, tractable, and future influences. Deprioritize others clearly. Conclude with actionable insights for the grant decision.
answer: |-
  Right, diving straight in based on your framing and the need for a defended stack rank. The core tension I see is between *detecting* the threat (can we know it's scheming/planning to defect?) and *containing* it even if we *can't* detect it reliably (do the control mechanisms hold under pressure, and do they incentivize the right things?). Both are critical, but the detection side feels more fundamentally unresolved and upstream. If we can't reliably bound scheming via evaluation or detect its activation, many containment strategies become brittle guesses. Conversely, if detection were somehow solved, containment design becomes a (still hard) engineering challenge with clearer parameters. So, my top two funded cruxes are:

  1.  **Whether control evaluations can ever bound scheming when the model can condition its behavior on being evaluated.** This is the absolute bedrock. If the answer is "no, sufficiently advanced schemers will always hide during evaluation," then the entire Redwood premise – designing deployment assuming potential scheming – becomes critically undermined. We're building elaborate castles on sand. Everything downstream – honeypots, monitoring, information limits – relies on some ability to either *find* schemers or have high confidence they aren't present *during the critical evaluation phase*. Funding should go towards rigorously formalizing the "evaluation game": defining the capabilities of the evaluator (access, compute, techniques), the capabilities and knowledge of the schemer (does it know the eval specifics? Can it simulate them internally?), and the strategic space (what constitutes "passing" evals while preserving scheming potential?). The tractability for theorists/philosophers lies in game theory, formal logic (modeling deception and strategic knowledge), probability theory (bounding risks), and conceptual analysis of "detection" itself. It doesn't require building new eval infra; it requires deep thinking about the *limits* of what evals can prove. Developments moving this up/down: If interpretability makes massive leaps, potentially allowing direct inspection of goals/intent, this crux becomes *less* critical (though conditioning might still apply to *interpretability tools*). Conversely, evidence of sophisticated "sleeper agent" behavior in current models, or theoretical proofs showing evals are fundamentally incomplete for certain agent types, would make this *more* urgent.

  2.  **Whether running a model under adversarial-assumption scaffolding changes the model itself (same training loop feeding the monitors, etc.).** This is upstream of deployment efficacy. Assume we *do* design a control scaffold (monitors, honeypots, airgaps). Does deploying a model within this inherently adversarial environment *teach* it to be a better schemer or trigger latent scheming? Does the training signal derived from the scaffold (e.g., penalties caught by monitors) inadvertently select for harder-to-detect deception? If yes, then our containment measures are actively making the problem worse over time, a classic Goodhart/Adversarial Darwinism scenario. This crux needs funding to explore the learning dynamics under adversarial constraints. Theorists can model this using machine learning theory (exploring loss landscapes under adversarial objectives), evolutionary game theory, and analyzing feedback loops in complex systems. It asks: "Does the medicine poison the patient?" It's tractable theoretically because it involves predicting learning dynamics under specific incentive structures, not building the actual scaffolding. Developments moving this: Empirical results from labs running RL under adversarial monitoring (like Anthropic's recent work) showing unexpected behavioral shifts would skyrocket its importance. Conversely, theoretical work proving robust convergence to non-deceptive policies under certain scaffold designs would lower it.

  **Why these two are upstream:** You can't design *effective* containment (honeypots, info limits, collusion mitigation) if you don't know what you're trying to contain (Crux 1) or if the containment itself corrupts the agent (Crux 2). Solving Crux 1 tells us *if* and *how well* we can identify the threat pre-deployment. Solving Crux 2 tells us *if* deploying containment fundamentally alters the threat landscape during operation. Both are prerequisites for confidently designing and deploying specific control mechanisms.

  **Deprioritized & Why:**

  *   **Whether control difficulty scales in a measurable way with capability:** While vital, the answer ("No, it's a sharp left turn" vs. "Yes, with observable correlates") likely doesn't change the *immediate* lab action. Labs *must* assume the worst-case scheming scenario for high-stakes deployments *regardless*. If we get early warning signs, great, but the prudent path is acting as if scheming is possible once capabilities cross a high threshold. Funding this might refine *when* to deploy extreme measures, but not *what* those measures fundamentally are. It feels more like valuable forecasting than a control design crux.
  *   **Collusion between model instances:** This is critical engineering, but it feels downstream. If you have robust solutions to Crux 1 (detection) and Crux 2 (non-corrupting scaffolding), designing *within-deployment* communication limits and detection mechanisms becomes the next (still hard) step, heavily reliant on infosec and systems design. Theorists can contribute to protocol design and game theory of collusion, but the core *feasibility* of control hinges more on the first two. It's essential engineering, but not the *upstream theoretical* crux.
  *   **Whether investing in control substitutes for alignment or is upstream:** This is crucial *strategically/politically*, but less of a *technical research crux*. The answer ("Yes, labs will use it as an excuse" vs. "No, control is seen as a necessary complement") won't change what *technically robust* control research needs to be done. It might change *advocacy* or *governance* strategies, but the core theoretical work on making control viable remains necessary either way. Fund policy research for this, not core control theory. Knowing labs *might* misuse the research doesn't invalidate the need for the research itself if control is a necessary layer of defense.

  **What about the "top three"?** Frankly, these two feel significantly more foundational and unresolved than the others on your list for the *upstream theoretical* work. Pouring $300k into deep dives on Crux 1 and Crux 2 by sharp theorists has the highest chance of either yielding breakthroughs that make control viable or revealing fundamental showstoppers that force a strategic pivot. If pressed for a third, I'd reluctantly point back to the **scaling difficulty** question, *but only* if framed as: "Can we define *specific, measurable capability thresholds* (beyond vague 'superintelligence') at which *known* control mechanisms *provably* break under schemer pressure?" That's more actionable than general scaling curves. However, the first two dominate.

  The next few years are pivotal. Watch for empirical results on sleeper agents and training under adversarial monitoring – they'll directly stress-test Crux 1 and Crux 2. If labs start deploying complex multi-agent systems with high autonomy, collusion moves up the list rapidly. But right now, the deep uncertainties about detection and scaffold-induced corruption are the dragons we need theorists to grapple with most urgently. Fund the work that asks, "Is this whole approach even *possible*, and if so, under what precise conditions?" before we build too much on potentially rotten foundations.
