answer: |-
  Below is a decision tree designed to clarify the core conceptual distinctions in bankroll management for sports betting, based on your model's edge, risk tolerance, and goals. The tree prioritizes logical coherence, growth-rate math correctness, and the Kelly criterion's properties. It addresses the key dispute around fractional vs. full Kelly by isolating uncertainty asymmetry (overbetting destroys growth, underbetting merely slows it) and risk aversion.

  ### **Decision Tree: Bankroll Sizing for Sports Betting**
  **Start:** "I have a model with a perceived small edge. How much of my bankroll should I bet per event?"

  1. **Is your model's edge *statistically validated* with low uncertainty?**  
     (Validation = tested on out-of-sample data, large sample size, narrow confidence intervals.)  
     - **No (high uncertainty, small sample, or unvalidated model)** → Go to 2.  
     - **Yes (low uncertainty, robust evidence)** → Go to 3.  

  2. **Is your point estimate of edge clearly positive?**  
     (e.g., Expected value > 0, but confidence interval includes negative values.)  
     - **No (edge near zero or negative)** → **Leaf A: No-bet / Wait**.  
       *Most awkward commitment:* Forgoing potential gains while gathering data, despite your model's optimism.  
     - **Yes (edge likely positive, but magnitude uncertain)** → **Leaf B: Fractional Kelly (low: 0.1–0.25x)**.  
       *Most awkward commitment:* Betting tiny amounts despite your confidence, as insurance against overestimation.  

  3. **Are you *risk-neutral* and solely focused on long-run growth?**  
     (Indifferent to drawdowns, no emotional/financial ruin risk, infinite horizon assumed.)  
     - **No (you care about drawdowns, ruin risk, or finite horizons)** → Go to 4.  
     - **Yes (growth-maximizing, infinite horizon)** → Go to 5.  

  4. **Is your primary concern avoiding ruin *or* hitting a short-term target?**  
     - **Avoiding ruin (drawdown-averse)** → **Leaf C: Fractional Kelly (moderate: 0.25–0.5x)**.  
       *Most awkward commitment:* Explicitly sacrificing growth for safety, guaranteeing slower wealth accumulation.  
     - **Hitting a finite target (e.g., double bankroll in 6 months)** → **Leaf D: Goal-optimized sizing (often 0.1–0.4x Kelly)**.  
       *Most awkward commitment:* Complex, non-Kelly math; may underperform long-run growth if target is missed.  

  5. **Can you access leverage below your expected return rate?**  
     (e.g., Borrowing at 2% while your edge yields 5%.)  
     - **No (typical for small bankrolls)** → **Leaf E: Full Kelly**.  
       *Most awkward commitment:* High volatility (e.g., 13% chance of halving bankroll before doubling) and non-zero ruin risk.  
     - **Yes (rare, high-edge edge case)** → **Leaf F: Leveraged over-Kelly (>1x)**.  
       *Most awkward commitment:* Extreme risk of ruin (> full Kelly) if edge is overestimated or leverage costs rise.  

  ---

  ### **Key Clarifications & Disagreement Resolution**
  - **Fractional vs. Full Kelly Disagreement**:  
    - Lives at **Node 2 (uncertain edge)** and **Node 3 (risk aversion)**.  
    - **Why fractional advocates are right about robustness**:  
      Kelly math shows overbetting (e.g., full Kelly with overestimated edge) causes *negative* long-run growth and high ruin risk. Underbetting (fractional Kelly) only reduces growth rate proportionally to the fraction squared (e.g., 0.5x Kelly → 75% growth rate). Fractional Kelly is a hedge against estimation error.  
    - **Why full Kelly advocates are right about optimality**:  
      With *validated edges* and *no risk concerns* (Node 3 → Yes), full Kelly uniquely maximizes asymptotic growth. Fractional Kelly is suboptimal here.  

  - **Incoherent/Unexplored Combinations**:  
    - **"High uncertainty + Full Kelly"**: Not a leaf—betting full Kelly with uncertain edges risks ruin (growth turns negative if edge is overestimated by ~15%). Mathematically incoherent.  
    - **"Leverage without validated edge"**: Not a leaf—combining leverage and uncertainty amplifies ruin risk. Practically unattractive.  

  - **Indistinguishable Leaves**:  
    - **Leaf C (fractional for drawdowns) and Leaf D (goal-optimized)** often converge to similar fractions (e.g., 0.3x Kelly). They diverge only for specific targets (e.g., "hit $10k in 3 months" requires custom sizing).  

  ### **How to Use This Tree**
  1. **Assess your edge rigorously**: Calculate confidence intervals for your model's predictions. If uncertainty is high (e.g., 95% CI includes negative EV), you're at Node 2.  
  2. **Be honest about risk tolerance**: If a 30% drawdown would stress you or force you to stop, you're not risk-neutral (Node 3 → No).  
  3. **Revisit as conditions change**: Moving from Leaf B (low fractional) to Leaf E (full Kelly) is rational if validation improves.  

  This tree resolves contradictions by separating *edge uncertainty* (where fractional Kelly is mathematically necessary for robustness) from *risk preferences* (where it's a conscious trade-off). Full Kelly is optimal only when uncertainty is negligible and you're truly risk-neutral—a rare combination.
