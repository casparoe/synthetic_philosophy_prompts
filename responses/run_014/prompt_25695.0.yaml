  ### Adversarial Collaboration Document: Humean vs. Anti-Humean Metaphysics of Laws of Nature  

  **Introduction**  
  This document represents a collaborative effort between a proponent of Humeanism (hereafter "Humean") and a proponent of anti-Humeanism (hereafter "anti-Humean") regarding the metaphysics of laws of nature. Both parties seek to clarify agreements, disagreements, and cruxes in good faith, without caricature or dismissal of the other’s position. The goal is to sharpen the debate, not to resolve it.  

  ---

  ### 1. Agreed Claims  
  Both parties endorse the following substantive claims, which narrow the dispute by identifying common ground. Each claim is accepted in the parties' own terms:  

  1. **Objective Success of Science**: The empirical success of science (e.g., in prediction, explanation, and technological application) must be accommodated by any account of laws. However, this success does not entail that laws *must* be metaphysically primitive or that they *must* govern; it is neutral between Humean and anti-Humean interpretations.  
  2. **Supervenience Base**: All facts about the laws of nature supervene on the totality of particular matters of fact (the "Humean mosaic"). For the Humean, this is constitutive; for the anti-Humean, this is a minimal constraint, but supervenience does not preclude laws being ontologically additional.  
  3. **Counterfactual Support**: Laws of nature support counterfactual conditionals (e.g., "If this match were struck, it would light") in a way that accidental regularities do not. Any viable account must explain this difference.  
  4. **Distinction Between Laws and Accidents**: There is a non-arbitrary, objective distinction between laws (e.g., Newton’s law of gravitation) and accidental regularities (e.g., "All gold cubes are smaller than 1 km³"). This distinction is not merely epistemic.  
  5. **Non-Violation in Actuality**: Laws are never violated in the actual world. Accounts must explain why violations are absent without appealing to circularity or triviality.  
  6. **Uninstantiated Laws**: Laws can exist even if they lack instances (e.g., a law governing a particle that never exists). Both parties agree such laws are meaningful, but disagree on their metaphysical basis.  
  7. **Non-Anthropogenicity**: Laws are mind-independent; they do not depend on human conceptualization, language, or psychology.  
  8. **Scientific Discoverability**: Laws are discovered a posteriori through scientific investigation, not deduced a priori.  

  ---

  ### 2. Disagreements Table  
  The table below outlines key disputes. Each position is formulated to be endorsed by its proponent and charitably represents the opposing view.  

  | Issue | Humean Position | Anti-Humean Position |  
  |-------|----------------|----------------------|  
  | **Governing vs. Describing** | Laws are descriptions of patterns in the Humean mosaic; they summarize what occurs but do not govern, produce, or constrain events. Governing language is a useful fiction for predictive purposes. | Laws govern the behavior of entities; they are metaphysically primitive relations (e.g., necessitation relations among universals) that actively produce, constrain, or underwrite regularities in the mosaic. |  
  | **Basis of the Law/Accident Distinction** | The distinction between laws and accidents is derived from the Best Systems Account (BSA): a regularity is a law iff it is an axiom (or theorem) of the deductive system that best balances simplicity and informativeness for the mosaic. The distinction is not primitive. | The distinction between laws and accidents is primitive or grounded in irreducible metaphysical structure (e.g., universals-related-by-necessitation). It cannot be reduced to systemic virtues like simplicity, as these are epistemic, not ontological. |  
  | **Conceivability of Same Mosaic, Different Laws** | Worlds with identical Humean mosaics but different laws are conceivable and metaphysically possible. For example, a mosaic could be systematized by two equally "best" but incompatible systems, yielding different laws. | Worlds with identical mosaics but different laws are inconceivable. The mosaic is produced by governing laws; identical mosaics imply identical laws, as laws fix the mosaic’s structure. A mosaic without governing laws is unintelligible. |  
  | **Circularity in Explanation** | Humeanism avoids circularity: laws explain events by showing how they fit into the mosaic’s overall pattern. For instance, explaining a falling apple via gravity cites a pattern in the mosaic, not a governing force. This is non-circular as the mosaic is explanatorily prior. | Humean explanation is circular: laws are derived from the mosaic but are then used to explain the mosaic (e.g., "The apple fell because of gravity," where gravity is a pattern in the falling). Only anti-Humeanism avoids this by treating laws as prior explainers. |  
  | **Natural Properties in the BSA** | The BSA’s reliance on "natural properties" (e.g., mass, charge) does not concede to anti-Humeanism. Natural properties are patterns of resemblance in the mosaic, not primitive modal structures. They earn their status through their role in maximizing simplicity and strength. | The BSA’s appeal to natural properties implicitly concedes anti-Humeanism, as these properties must be objectively privileged (e.g., for defining simplicity). This privileges structure in the mosaic that cannot be earned without circularity or covertly invoking modality. |  

  ---

  ### 3. Cruxes  
  Cruxes are sub-questions that could force one side to revise its position if resolved. For each, both parties agree on the relevance of the test case/consideration and state their predictions.  

  1. **Crux: Conceivability of a Lawless but Regular World**  
     - **Relevant Test Case**: Is a world conceivable where events exhibit robust regularities (e.g., sequences resembling gravitational attraction) but no laws exist?  
     - **Humean Prediction**: Yes, such a world is conceivable and possible. Regularities are brute patterns; laws are our summaries, so a "lawless" world is just one where no non-trivial best system exists (e.g., due to extreme disorder). The mosaic alone suffices for regularity.  
     - **Anti-Humean Prediction**: No, such a world is inconceivable. Regularities require a metaphysical ground (e.g., governing laws) to be non-accidental. A "lawless" world would reduce to chaos or incoherence.  

  2. **Crux: Natural Properties Without Modality**  
     - **Relevant Test Case**: Can a principled distinction between natural (e.g., mass) and non-natural (e.g., grue) properties be drawn without invoking primitive modality, laws, or universals?  
     - **Humean Prediction**: Yes, via objective resemblances in the mosaic. Natural properties maximize systemic virtues (simplicity/strength) in the BSA. For example, "mass" is natural because it simplifies descriptions of motion, not because it is intrinsically modal.  
     - **Anti-Humean Prediction**: No, any distinction relies on primitive modal structure (e.g., properties that "support" laws). Without this, the BSA cannot non-arbitrarily privilege certain properties, leading to triviality (e.g., gruesome systems).  

  3. **Crux: Direction of Explanation**  
     - **Relevant Test Case**: In scientific practice, do laws explain regularities, or do regularities explain laws? Consider a case like radioactive decay: do decay regularities exist because of a law, or is the law a summary of the regularities?  
     - **Humean Prediction**: Regularities explain laws. Laws are descriptive tools; decay regularities are fundamental, and the "law" is a shorthand for these patterns. Explanation runs from mosaic to laws.  
     - **Anti-Humean Prediction**: Laws explain regularities. The decay law governs and produces the observed regularities; without it, the regularity would be accidental. Explanation runs from laws to mosaic.  

  ---

  ### 4. Assessment of Verbal Disputes  
  After discussion, the parties agree that **no core disagreement is merely verbal**. While terminology differs (e.g., "govern" or "necessitation"), these terms map to substantive metaphysical commitments that survive translation:  
  - **Surviving Disagreements**:  
    - The ontological status of laws (e.g., whether laws are additions to the mosaic) remains irreducibly contentious, even when "governance" is cashed out as "productive causation" (anti-Humean) versus "systematization" (Humean).  
    - The direction of explanation (Crux 3) and the conceivability of lawless worlds (Crux 1) reflect factual divergences about metaphysical possibility.  
  - **Dissolving Disagreements**:  
    - Claims that laws are "objective" or "mind-independent" (per Agreed Claims) are non-contentious once definitions are aligned.  
    - "Supervenience" (Agreed Claim 2) is shared but interpreted differently (e.g., anti-Humeans see it as consistency with the mosaic, not reduction).  

  **Conclusion**: The collaborators affirm that residual disagreements are substantive, with both sides acknowledging costs: Humeans accept that the BSA risks subjectivity in "simplicity," while anti-Humeans accept that primitive governing laws are unobservable. The cruxes above provide a framework for future inquiry.  

  ---  
  *Document co-authored in good faith by the Humean and anti-Humean parties, without adjudication.*
