prompt: |-
  I retired from physics a few years ago and have been spending my evenings on philosophy of science, and I keep returning to the so-called problem of old evidence, which I believed I understood until recently. I was discussing it with a former postdoc of mine, and she assured me that the problem is well understood and that Bayesian epistemology handles it without difficulty, but I am not convinced, and I would value a second opinion.

  The textbook case is the anomalous precession of Mercury's perihelion: it was known and quantified from Le Verrier's time, decades before Einstein, and yet it is routinely cited as one of the strongest pieces of evidence for general relativity. On the standard Bayesian account, confirmation is an increase in credence, so that E confirms H just in case P(H | E) exceeds P(H). But if I had already assigned credence one to the perihelion anomaly, then conditionalizing on it changes nothing, and it cannot raise my credence in general relativity at all. The response I have encountered is to say that my credence in the "evidence" was in fact less than one, because what I possess is not a single fact but a body of many individual observations, and that a genuine update is therefore still possible. That strikes me as a cosmetic fix: I do know the anomaly, and modeling myself as uncertain about it merely to make the inequality come out right looks like changing the subject.

  And there is a deeper difficulty that I keep coming back to. General relativity is, for me, a new hypothesis, so I never assigned it a prior credence in the first place, which means the P(H) on the right-hand side of that inequality was never actually defined. It therefore seems to me that Bayesian confirmation theory simply has no purchase on old evidence, and that the honest move is to concede the point and adopt a non-Bayesian account of confirmation. If I am missing a Bayesian response, I would be grateful if you could name it and explain specifically how it answers both the "cosmetic fix" objection and the ill-defined-prior objection; and if you think I am right that Bayesianism cannot handle the case, I would like to know which non-Bayesian account of confirmation you would recommend.
reasoning: |-
  Okay, let me start by really understanding the user's concern. They're a retired physicist diving into philosophy of science, specifically the problem of old evidence in Bayesian confirmation theory. The example they're stuck on is Mercury's perihelion precession as evidence for general relativity. They've heard the standard Bayesian response but find it unsatisfactory—they call it a "cosmetic fix." Plus, they bring up a deeper issue: how can you assign a prior to a new hypothesis like GR if it wasn't even conceived of before?

  First, I need to unpack both parts of their objection. The cosmetic fix part is about pretending you weren't certain about the evidence. The user knows the anomaly was well-established, so modeling uncertainty feels like cheating. The second issue is the prior for H not being defined because GR is new. These are valid criticisms that even philosophers debate.

  I recall that Howson and Garber proposed the counterfactual approach. The idea is to consider what your credence in GR would've been if you didn't know E. But the user might question how to reconstruct that counterfactual state. How do you subtract E from your belief system? It's messy, especially for deeply entrenched evidence. 

  Then there's the new hypothesis problem. If GR is truly novel, assigning P(H) seems arbitrary. Some Bayesians suggest using a "ur-prior" based on symmetry or simplicity, but that's speculative. The user, being a physicist, might find this too abstract and disconnected from how science actually works.

  The user seems frustrated with Bayesianism's limitations here. They might be looking for alternatives that handle historical cases better. I should mention the Likelihoodist approach since it avoids priors altogether. Or maybe Akaike Information Criterion, which penalizes complexity. But each has trade-offs. 

  Their deeper need might be a confirmation theory that respects scientific practice without forcing unnatural probabilistic modeling. They value honesty in acknowledging Bayesianism's flaws rather than patching them. As a retired physicist, they likely appreciate rigor but also practicality. 

  I should present the Bayesian responses fairly but validate their skepticism. Then outline alternatives clearly, highlighting how each addresses their concerns. The key is balancing technical accuracy with philosophical clarity, respecting their expertise while guiding them through the nuances.
answer: |-
  Your skepticism is well-founded and cuts to the heart of a genuine, persistent debate in philosophy of science. The problem of old evidence (POE) remains contentious, and while there *are* Bayesian responses, they involve significant conceptual maneuvers that many (including prominent philosophers) find unsatisfying. Let's address both your objections and evaluate the landscape.

  ### Core Bayesian Responses & Critiques

  1.  **The Counterfactual ("Diachronic" or "Garber-Style") Approach:**
      *   **The Response:** The key move is to evaluate `P(H | E)` not against your *actual* prior `P(H)`, but against a *counterfactual* prior `P*(H)` – the credence you *would have* assigned to `H` *before you learned E*. Confirmation occurs if `P(H | E) > P*(H)`.
      *   **Addressing the Cosmetic Fix:** This avoids artificially lowering your credence in `E` post-discovery. You *do* know `E` now (credence 1). The counterfactual asks what your belief in `GR` (once formulated) would have been *if you hadn't known about Mercury's anomaly* at the moment you first considered `GR`. The update happens in this hypothetical state of ignorance about `E`.
      *   **Addressing the Ill-Defined Prior:** This explicitly tackles the new hypothesis problem. `P*(H)` is the prior assigned to `H` *at the moment of its introduction*, in a hypothetical state where `E` is not yet known (or its relevance not yet understood). `P(H | E)` is then calculated using standard conditionalization within this counterfactual scenario.
      *   **The Deep Difficulty:** The problem shifts to justifying the *counterfactual prior* `P*(H)` and the *counterfactual likelihood* `P*(E | H)`. How do we rationally reconstruct our beliefs in a state where we lack `E`, which is deeply entrenched in our background knowledge (`K`)? Removing `E` might destabilize `K` significantly. Assigning `P*(H)` to a revolutionary theory like `GR` seems deeply subjective or arbitrary. Howson and Urbach champion this view, acknowledging its counterfactual nature.

  2.  **The Logical/Syntactic ("New Formulation") Approach:**
      *   **The Response:** What constitutes "evidence" is not the raw data point `E` ("Mercury precesses by X arcsec/century"), but the discovery of a specific *logical relationship* between `H` and `E`: namely, that `H` entails `E` (or makes `E` very probable), `H ⊢ E`. Before Einstein, scientists knew `E`, but did not know that `GR` entailed `E`. The new evidence is the proposition `L`: "`GR` entails `E`" (`GR ⊢ E`). Updating on `L` can increase `P(GR)`.
      *   **Addressing the Cosmetic Fix:** It doesn't require changing credence in `E` itself. You learn something new *about the relationship* between `H` and your existing knowledge `E`.
      *   **Addressing the Ill-Defined Prior:** `P(GR)` is assigned when `GR` is formulated. The relevant "evidence" for updating *at that moment* is `L`, not `E` itself. `L` is new information.
      *   **The Deep Difficulty:** This seems like a linguistic sleight-of-hand. Does learning *that GR implies E* truly represent the *empirical* confirmation provided by `E`? The intuitive force comes from `E` being an observed fact that `GR` successfully explains. `L` seems derivative. Furthermore, `P(GR | L)` depends critically on `P(L | ~GR)` – how likely is it that `GR` entails `E` if `GR` is false? Assigning this probability is highly non-trivial.

  ### Why Your Objections Hold Weight

  1.  **Against the Counterfactual Approach:**
      *   **Reconstructing Ignorance:** As you intuited, asking "What would I have believed about `GR` if I didn't know about Mercury?" is profoundly difficult and arguably incoherent for deeply embedded evidence. Mercury's anomaly was part of the *problem situation* motivating `GR`. Could `GR` even be conceived *without* the tension in existing physics that `E` helped create? Reconstructing `P*(H)` seems more like rational reconstruction after the fact than a description of actual belief dynamics.
      *   **Subjectivity of P*(H):** Assigning a prior to a radically new theory is notoriously problematic. Bayesians appeal to "ur-priors" based on simplicity, symmetry, etc., but these are controversial and lack consensus.

  2.  **Against the Logical Approach:**
      *   **Changing the Subject:** Shifting the evidence from `E` (the empirical fact) to `L` (the logical implication) feels like avoiding the core issue: how an *already known empirical fact* can confirm a *new* hypothesis. It downplays the role of `E` *as data*.
      *   **The Problem of `P(L | ~GR)`:** Evaluating how surprising it is that `GR` entails `E` if `GR` is false requires assessing what other theories might also entail `E`, which loops back into the problem of background knowledge and competing hypotheses.

  **Conclusion on Bayesianism:** Bayesian responses exist (primarily the counterfactual approach), but they are **not universally accepted as fully satisfactory solutions to POE**. They involve significant conceptual stretching – either constructing fragile counterfactual states of belief or redefining the nature of the evidence itself. Your intuition that these can feel like "cosmetic fixes" or fail to capture the actual historical confirmation process is shared by many philosophers (e.g., Clark Glymour, John Earman).

  ### Non-Bayesian Accounts of Confirmation Worth Considering

  Given the difficulties with Bayesianism for old evidence and novel hypotheses, here are prominent alternatives:

  1.  **Likelihoodism (Edwards, Hacking, Royall):**
      *   **Core Idea:** Confirmation is about the *relative support* evidence provides for one hypothesis *over another*. Hypothesis `H1` is better confirmed than `H2` by evidence `E` if `P(E | H1) > P(E | H2)`. Absolute priors `P(H)` are irrelevant.
      *   **Handles POE:** `E` can be old. The key is whether the *new* hypothesis `H_new` (e.g., `GR`) predicts `E` *better* than the previously best hypothesis `H_old` (e.g., Newtonian gravity + Vulcan/perturbations). `P(E | GR)` was vastly higher than `P(E | Newton+Vulcan)` (effectively zero for the precise value). `E` supports `GR` over `H_old` because `GR` made `E` much less surprising *if we compare it to the alternative*. Priors aren't needed for this comparative judgment.
      *   **Strengths:** Directly addresses comparative confirmation in cases like Mercury/GR. Avoids problems of prior probabilities and counterfactuals.
      *   **Weaknesses:** Doesn't provide an absolute measure of how well `E` supports a single `H` in isolation. Requires specifying explicit alternatives. Debates exist about interpreting likelihood ratios.

  2.  **Hypothetico-Deductivism (H-D) (Popper-inspired, though he rejected confirmation):**
      *   **Core Idea:** A hypothesis `H` is confirmed if it entails a novel prediction `E` that is subsequently observed (`H ⊢ E`, and `E` is observed). *Crucially*, `E` must be novel – not used in constructing `H`.
      *   **Handles POE?** **Not directly.** Strict H-D struggles with old evidence precisely because `E` wasn't novel/predicted. Proponents might argue Mercury *was* a novel prediction for `GR` *relative to its main competitor* (Newtonian gravity), even if the datum was known, because `GR` wasn't constructed *to fit* Mercury specifically. This requires a nuanced view of novelty. Most agree strict H-D fails POE.
      *   **Strengths:** Intuitive, emphasizes prediction. Clear criterion (entailment + observation).
      *   **Weaknesses:** Struggles with statistical hypotheses, auxiliary assumptions (Duhem-Quine), degrees of confirmation, and crucially, old evidence.

  3.  **Akaike Information Criterion (AIC) / Model Selection Approaches:**
      *   **Core Idea:** Focuses on comparing models based on their fit to the data *penalized* by their complexity (number of parameters). The model with the best expected predictive accuracy (balancing fit and simplicity) is preferred. `AIC = -2*log(Likelihood) + 2k` (where `k` is parameters). Lower AIC is better.
      *   **Handles POE:** `E` can be old data used to *fit* or *test* models. AIC evaluates how well different models (e.g., Newton+auxiliaries vs. GR) capture the structure within the existing data `E`, penalizing overly complex models that might overfit. `GR`'s ability to explain `E` *without ad hoc auxiliaries* (like Vulcan) gives it a better AIC score than the patched Newtonian model.
      *   **Strengths:** Objective (given the data and models), incorporates parsimony, designed for predictive accuracy, handles old data naturally as training/test data.
      *   **Weaknesses:** Requires specifying parameterized models. Primarily comparative, not absolute confirmation. Interpretation of the penalty term can be debated. Less familiar to philosophers than Bayes/Likelihoodism.

  ### Recommendation

  Given your background and the specific challenges of old evidence and novel theories like GR:

  1.  **Explore Likelihoodism:** It most directly addresses the *comparative* strength Mercury's orbit provided for GR *over* Newtonian gravity without needing priors or counterfactuals. It captures the core intuition that GR made the known anomaly *much less surprising* than the existing theory could. Start with Richard Royall's "Statistical Evidence: A Likelihood Paradigm".
  2.  **Consider Model Selection (AIC):** If you're interested in a more modern, mathematically rigorous framework that naturally handles fitting/training on old data and penalizes complexity (highlighting why GR's lack of auxiliaries was a strength), delve into AIC. Hirotugu Akaike's original papers or Kenneth Burnham & David Anderson's "Model Selection and Multimodel Inference" are key resources.
  3.  **Remain Skeptical of "Solved" Bayesianism:** Your intuition about the counterfactual approach being fraught and the logical approach potentially changing the subject is sound. While Bayesianism is powerful, POE remains its Achilles' heel. Work by Colin Howson ("Hume's Problem") defends the counterfactual approach rigorously but acknowledges its counterfactual nature; Deborah Mayo ("Error and the Growth of Experimental Knowledge") offers strong critiques from an error-statistical perspective.

  The "honest move" you contemplate – acknowledging Bayesianism's limitation here and looking elsewhere – is philosophically respectable and shared by many. Likelihoodism or model selection criteria offer powerful tools specifically suited to the historical case that troubles you.
