prompt: |-
  For several years a small reading group I belong to has kept returning to Parfit's hitchhiker and to the wider family of cases in which it seems rational to become the sort of agent who would act irrationally in a one-off choice. The basic case is familiar: you are stranded, a driver offers a ride on condition that you pay later, you know you will never see the driver again and that no sanction can reach you, and you also know that only someone disposed to pay will get the ride in the first place. We have added two variants that have made the argument worse rather than better. In the first, the driver can see a cheap but imperfect signal of your disposition, so the question becomes whether the signal or the disposition is doing the rationalizing. In the second, the hitchhiker is not one person but a small group that must decide together whether to cultivate a reputation for paying, which raises the question whether the rationality at issue belongs to individuals, groups, or practices. The group divides into three camps and none has moved in months. The first says the case shows that decision theory must evaluate dispositions or policies rather than isolated acts, so paying is rational as part of the policy that secures the ride. The second says that is a confusion: the disposition may be causally advantageous, but the act of paying, once it is chosen, is still irrational, and the theory should say so plainly; what we have is a case where it is rational to be irrational. The third says both sides are answering the wrong question, because the promise is not a one-off act but a move in a social practice of promising, and the real question is what the practice requires of someone who has already accepted its benefits. Every reply is anticipated, and the exchange now feels less like an unfinished argument than like arguments that have stopped touching.

  I want a diagnosis rather than a verdict. Is this a substantive disagreement about the correct theory of rational choice, a verbal dispute about whether the word rational attaches to acts or to dispositions, or two or three different questions being asked under one heading—one about the causal efficacy of character, one about the logic of counterfactual commitment, one about the norms internal to promising? Is a hidden formal or empirical question doing the work, perhaps about whether the disposition is detectable or about how to model subjunctive dependence? And given your diagnosis, what would count as progress: a distinction, a formal result, a change of question, or an argument that no progress should be expected because the camps start from intuitions that cannot be argued for? I am especially interested in whether the impasse survives once we separate the question of what it is rational to do from the question of what it is rational to be, and whether the practice-based reading changes the kind of disagreement or merely relocates it. Please engage the camps as I have described them, and be concrete about what each side would have to give up for the debate to move.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're part of a reading group stuck on Parfit's hitchhiker and its variants. The core issue is whether it's rational to develop a disposition that leads to an irrational act in a one-off scenario. The group has three camps: one focusing on policies, one on acts, and one on social practices. The user wants a diagnosis, not a verdict, to understand why the impasse persists and how to move forward.

  First, I need to identify the root of the disagreement. The camps seem to be talking past each other because they're operating on different levels of analysis. The policy camp is evaluating rationality at the level of dispositions over time, while the act camp insists on the rationality of individual actions. The practice camp shifts the focus to normative frameworks. This suggests a meta-problem: conflating descriptive and normative dimensions.

  The user mentioned two variants. The first adds a detectable signal, which complicates whether the signal or the disposition is rationalizing. The second involves a group, raising questions about collective rationality. These variants add layers but don't resolve the core issue. The signal variant introduces empirical uncertainty about detectability, while the group scenario introduces agency problems—individual vs. collective rationality.

  The user's deeper need might be to find a pathway for their group to make progress. They might feel frustrated with circular arguments and want tools to reframe the discussion. They also hint at separating "rational to do" from "rational to be," which could be key. 

  Looking at possible solutions, the camps need to acknowledge their different premises. The act camp must accept that dispositions can be rational even if acts aren't, under certain frameworks. The policy camp needs to admit that their view changes the subject from act-based rationality. The practice camp must clarify if their approach is descriptive or normative.

  Progress might come from formalizing the variants. For the signal case, using Bayesian models to show how detectability affects rationality assessments. For the group scenario, game theory could model individual vs. group incentives. Introducing empirical evidence on reputation or social norms might also help, moving the debate from abstract to concrete.

  Another angle is distinguishing between rationality types: instrumental vs. normative. If the practice camp is arguing from a normative stance, they need to justify why the practice's norms override individual instrumental rationality. This ties into the user's question about separating "rational to do" from "rational to be."

  The user also wonders if the impasse is substantive, verbal, or different questions under one heading. It's likely all three. Substantive on what rationality applies to, verbal on definitions, and different questions about causation, counterfactuals, and norms. Untangling these requires explicit framework definitions upfront.

  In summary, the diagnosis is a multi-level conflation. Progress demands clarifying frameworks, accepting shifted questions, and using formal models for variants. The user's group might benefit from agreeing on terminology and scope before re-engaging with the cases. Highlighting the distinction between rationality of acts versus dispositions could break the deadlock, especially if empirical data or formal results are introduced.
answer: |-
  Your group's impasse is profound because it stems from **conflated levels of analysis, divergent foundational commitments, and unrecognized shifts in the object of evaluation**. This isn't a single disagreement but a nesting of distinct (though related) disputes. Here's a diagnosis and path forward:

  ### Core Diagnosis: Three Incommensurable Frames
  1.  **The Policy Camp:** Evaluates **temporal extended agency**. Rationality applies to *plans, dispositions, or strategies* across time. Paying is rational *as a constitutive part* of the only strategy that secures the ride. They answer: *"What strategy maximizes expected utility for an agent over relevant possible futures?"*
  2.  **The Act Camp:** Evaluates **momentary choice**. Rationality applies to *specific acts* given *actual* options and information at the decision point. Paying (post-ride) costs with zero benefit is irrational. They answer: *"What act maximizes utility *now*, given fixed past choices and future consequences?"*
  3.  **The Practice Camp:** Evaluates **normative coherence within a social institution**. Rationality is adherence to the constitutive norms of a practice (promising) one has voluntarily engaged with. Paying is required by the internal logic of the practice itself. They answer: *"What does fidelity to this social practice demand of an agent who has invoked/benefited from it?"*

  These aren't just answering different questions; they operate in different **ontological spaces** (dispositions, acts, institutional facts) with different **temporal scopes** (long-term, punctate, rule-bound). Calling them all "rationality" obscures this.

  ### Why the Variants Worsen the Impasse
  1.  **Imperfect Signal:** Introduces **empirical uncertainty** about causation/detectability. This *seems* like progress but actually amplifies confusion:
      *   **Policy Camp:** Sees it as refining the "investment in reputation" model (costly signals, screening). Still rational to cultivate the disposition/signal.
      *   **Act Camp:** Sees it as weakening the causal link. If the signal isn't perfectly tied to the *actual* disposition to pay, the irrationality of paying *now* is even clearer.
      *   **Practice Camp:** Sees signals as irrelevant noise. The normative commitment (promise) stands regardless of how it was signaled or detected.
      *   ***Hidden Question:*** *"How reliably do signals track underlying dispositions, and does this reliability affect the rational basis for action/commitment?"* This is empirical/model-specific, not resolvable by pure theory.
  2.  **Small Group:** Introduces **collective action & agency**:
      *   **Policy Camp:** Faces the "we/me" problem. Cultivating a *group* reputation is rational for the *group*, but individual defection (not paying) might be instrumentally rational *for an individual* if others uphold the reputation. Requires modeling group agency or super-individual rationality (hard to swallow for individualists).
      *   **Act Camp:** Individual irrationality persists. Coordinating to *all* act irrationally (pay) doesn't make the individual act rational.
      *   **Practice Camp:** Strengthens the institutional view. Promising *as a group* binds individuals to collective norms. Breaking the promise undermines the *group's* standing within the practice.
      *   ***Hidden Question:*** *"Can groups be genuine agents with rational obligations distinct from the sum of individual obligations?"* This is metaphysical/social ontological.

  ### Is it Substantive, Verbal, or Different Questions?
  It is **all three simultaneously**:
  1.  **Substantive:** Deep disagreement exists about the *primary locus* of rational evaluation (acts vs. strategies vs. normative roles).
  2.  **Verbal:** Using "rational" unqualified masks the shift between "instrumentally optimal long-term strategy" (Policy), "utility-maximizing punctate choice" (Act), and "normatively coherent role-performance" (Practice). These are distinct concepts.
  3.  **Different Questions:** The camps are literally asking:
      *   Policy: "What should I *become* to navigate repeated interactions?"
      *   Act: "What should I *do* right now?"
      *   Practice: "What does my *social role* demand I do?"

  ### The Role of "Rational to Do" vs. "Rational to Be"
  **This distinction is crucial but insufficient alone.** Separating them clarifies:
  *   **Policy Camp:** Argues it's rational *to be* the type who pays (because that disposition gets you the ride), even though the act of paying itself is irrational *to do* in isolation.
  *   **Act Camp:** Agrees! But insists DT must primarily judge acts (*doing*), so highlighting the disposition's rationality (*being*) doesn't redeem the act's irrationality.
  *   **Practice Camp:** Argues that within the practice, paying *is* rational *to do* because it fulfills the obligation incurred by accepting the ride (a benefit tied to the practice). "Rational to be" (having a virtuous character) might be secondary.

  **The Impasse Survives Separation:** The Act Camp still denies that DT should *recommend* becoming someone who performs irrational acts, even if beneficial. The Policy Camp insists DT *must* recommend such dispositions to be useful. The Practice Camp says both miss the normative force of the practice itself.

  ### The Practice-Based Shift: Relocation, Not Resolution
  The Practice Camp relocates the disagreement **from instrumental rationality to normative authority**:
  *   **New Question:** "Does participation in a beneficial social practice (like promising) generate *sui generis* rational obligations that override or reconfigure straightforward instrumental calculations?"
  *   **New Disagreement:** The Act/Policy Camps likely see practices as *tools* for instrumental gain (Policy: useful fictions; Act: potentially irrational constraints). The Practice Camp sees them as sources of *genuine reasons*. This is a fundamental meta-ethical/philosophical split about the nature of reasons and normativity.

  ### What Counts as Progress? Concrete Steps for Each Camp
  Progress requires **explicit framework negotiation** and **concession**:

  1.  **For the Policy Camp:**
      *   **Must Concede:** That standard act-based DT *does* condemn the act of paying as irrational *under its own definition*. Framing this as "rational to be irrational" is provocative but accurate *within act-DT*.
      *   **Path Forward:** Argue decisively *why* DT *should* primarily evaluate strategies/dispositions (e.g., "Act-DT is self-defeating in dynamic/interactive contexts"). Formal results (e.g., evolutionary game theory showing TFT-like "irrational" reciprocation dominates) or causal decision theory refinements (modeling subjunctive dependence of past opportunities on future choices) *could* help here. Distinguish *evaluating strategies* from *redeeming acts*.
  2.  **For the Act Camp:**
      *   **Must Concede:** That rigid act-based DT renders agents *predictably exploitable* and unable to secure beneficial long-term outcomes in strategic interactions like the hitchhiker case. Calling paying irrational doesn't solve the hitchhiker's core dilemma.
      *   **Path Forward:** Engage directly with *whether rationality should incorporate temporally extended agency*. Can act-DT be *reformed* (e.g., sophisticated choice, resolute choice) to handle these cases without abandoning the punctate act? Or must it accept that its recommendations can be self-undermining? Analyze variants with perfect detection vs. noise rigorously.
  3.  **For the Practice Camp:**
      *   **Must Concede:** That framing this *solely* as about "promising" might sidestep the core *instrumental* puzzle Parfit posed. The driver might not care about promises; they care about getting paid. Is the practice fundamental or epiphenomenal?
      *   **Path Forward:** Defend the *authority* of practice-generated reasons against instrumentalism. Argue *why* fidelity to the practice is rationally obligatory *even if* instrumental gains are secured or lost. Distinguish clearly between the *instrumental benefits* of the practice existing and the *normative reasons* it generates for participants. Engage with the group variant: How do practices bind individuals within collectives?

  ### The Path Forward
  1.  **Reframe Explicitly:** Start every discussion by stating: "Are we asking what the rational *act* is at T2 (paying), what the rational *disposition* is to cultivate at T1 (honesty), or what the rational *fulfillment of a promissory obligation* is?"
  2.  **Tackle the Variants Sequentially:**
      *   **Signal Variant:** Build a simple formal model (Bayesian updating, signaling games). Does detectability change the *rationality of cultivating the disposition* (Policy) or just make it *cheaper*? Does it make the act of paying *less irrational* (Act) by introducing doubt about sanctions? Agree on model assumptions first.
      *   **Group Variant:** Use game theory (repeated PD, coordination game). Is "group rationality" reducible? Does it require modeling collective agency? Does the practice create a correlated equilibrium?
  3.  **Seek Formal/Empirical Grounding:** Instead of pure intuition-pumping, look for:
      *   Evolutionary models showing which strategies (dispositions) dominate.
      *   Experiments on commitment, reputation, and promise-keeping in one-shot scenarios.
      *   Formal results on the limits of act-utilitarianism/standard DT in sequential games.
  4.  **Accept Pluralism (Tragically):** Recognize that "rationality" might be fundamentally pluralistic. The camps may reflect irreconcilable intuitions about agency and normativity. Progress might be understanding *why* the disagreement persists, not resolving it. The true insight of Parfit's case might be exposing this fracture in the concept of rationality itself.

  The impasse persists because each camp defends a coherent but partial perspective on rational agency. Movement requires confronting the **meta-question**: "What *is* the primary object and scope of rational evaluation in dynamic, social contexts?" Until this is addressed, arguments will continue to "stop touching."
