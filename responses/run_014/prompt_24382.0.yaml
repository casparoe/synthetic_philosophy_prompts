  ### Decision Procedure for Model Selection Based on Occam's Razor Principles

  **Core Philosophy**:  
  We balance fit and simplicity using **Minimum Description Length (MDL)**—a computable proxy for Kolmogorov complexity. MDL measures the "cost" of describing both the model *and* the data it misfits. We avoid parameter counting by focusing on **effective complexity** (structure + parameters). Solomonoff induction and Kolmogorov complexity are uncomputable, so MDL with BIC (Bayesian Information Criterion) is our load-bearing proxy.

  ---

  ### The Procedure: 6 Steps (Fixed Order)  
  *Run for two candidate models. Time: <15 min.*

  1. **Check Generating Mechanism**  
     *Question: "Are the model's parameters generated by a predefined formula (e.g., polynomial, Fourier series)?"*  
     - **Good-enough answer**:  
       - Yes: Proceed to Step 2.  
       - No: Skip to Step 3.  
       - Unclear mechanism (e.g., custom code): **STOP → Judgment call**.  
     - *Why?* We need to distinguish structured complexity (low cost) vs. arbitrary complexity (high cost).

  2. **Count Hyperparameters for Generated Models**  
     *Question: "How many free parameters define the generating formula?"*  
     - **Good-enough answer**: Integer count (e.g., a linear rule `w_i = a + b*i` has 2 hyperparameters).  
     - *Why?* Generated parameters aren't independent; hyperparameters measure true complexity.

  3. **Count Raw Parameters for Non-Generated Models**  
     *Question: "How many free parameters are set independently?"*  
     - **Good-enough answer**: Integer count (e.g., hand-tuned weights).  
     - *Why?* No compression here—each parameter adds to complexity.

  4. **Compute Effective Complexity (k_eff)**  
     - **Formula**:  
       - If **generated**: `k_eff = hyperparameter count` (from Step 2).  
       - If **not generated**: `k_eff = raw parameter count` (from Step 3).  
     - *Why?* This penalizes arbitrary complexity but rewards structured simplicity.

  5. **Calculate BIC Scores**  
     - **Formula**:  
       `BIC = n * ln(SSE) + k_eff * ln(n)`  
       - `n`: Number of data points.  
       - `SSE`: Sum of squared errors (fit quality).  
       - `k_eff`: From Step 4.  
     - *Why BIC?* Approximates MDL. Lower BIC = better trade-off.

  6. **Compare BIC and Decide**  
     - **Rule**:  
       - If `|BIC₁ - BIC₂| > 10`: **Clear winner** (choose lower BIC).  
       - If `2 ≤ |BIC₁ - BIC₂| ≤ 10`: **Leans toward winner** (lower BIC).  
       - If `|BIC₁ - BIC₂| < 2`: **STOP → Too close, judgment call**.  
     - *Thresholds*: Based on evidence strength (Kass & Raftery, 1995).  
     - *Value judgment*: If models differ in interpretability/risk, **human decides** at this step.

  ---

  ### Justification for the PM (1-Paragraph Script)  
  > "We pick models that balance accuracy and simplicity to avoid overfitting—like preferring a short, precise instruction over a long, convoluted one. Our math scores each model by how well it fits historical data *and* how easy it is to describe. The winner is the model with the best overall score under this standard industry method. This ensures robust performance in live trading."

  ---

  ### Case Studies  

  #### Case 1: 3-Parameter Model (A) vs. 12-Parameter Model (B)  
  - **Model A**: No generating mechanism → `k_eff = 3`.  
  - **Model B**: No generating mechanism → `k_eff = 12`.  
  - **Data**: `n = 1,000`, `SSE_A = 2.50`, `SSE_B = 2.45` (B fits slightly better).  
  - **BIC Calculation**:  
    - `BIC_A = 1000 * ln(2.50) + 3 * ln(1000) = 1000*0.916 + 3*6.907 = 916 + 20.7 = 936.7`  
    - `BIC_B = 1000 * ln(2.45) + 12 * ln(1000) = 1000*0.896 + 12*6.907 = 896 + 82.9 = 978.9`  
  - **Difference**: `|936.7 - 978.9| = 42.2 > 10` → **Clear win for Model A**.  
  - **Why you won't love it**: Model B fits better, but its complexity cost dwarfs the tiny fit gain.  

  #### Case 2: 100-Parameter Model (C) vs. 5-Parameter Model (D)  
  - **Model C**: Parameters generated by `w_i = 0.5 * i` (linear rule) → `k_eff = 1` (hyperparameter: slope).  
  - **Model D**: Hand-tuned weights → `k_eff = 5`.  
  - **Data**: `n = 1,000`, `SSE_C = 1.80`, `SSE_D = 2.10` (C fits better).  
  - **BIC Calculation**:  
    - `BIC_C = 1000 * ln(1.80) + 1 * ln(1000) = 1000*0.588 + 6.907 = 588 + 6.9 = 594.9`  
    - `BIC_D = 1000 * ln(2.10) + 5 * ln(1000) = 1000*0.742 + 5*6.907 = 742 + 34.5 = 776.5`  
  - **Difference**: `|594.9 - 776.5| = 181.6 > 10` → **Clear win for Model C**.  
  - **Why you won't love it**: 100 parameters *feel* risky, but the generating rule makes it simpler than the 5-parameter model.  

  ---

  ### Where the Procedure Can Misfire  
  1. **Non-Gaussian Errors**: BIC assumes Gaussian residuals. If your data has fat tails or outliers, use a robust fit metric (e.g., Huber loss) instead of SSE.  
  2. **Overly Simple Generators**: A generating rule (e.g., `w_i = constant`) might be too rigid. If the data rejects it, the fit cost (`SSE`) will tank BIC.  
  3. **Small Data**: BIC is asymptotic. For `n < 100`, use AICc (Akaike with correction).  
  4. **Ad-Hoc Mechanisms**: Custom generators require manual complexity scoring → **judgment call**.  

  ### Final Advice  
  - **Predefine generating functions** (e.g., linear/polynomial rules) to avoid ambiguity.  
  - When BIC is close (`|Δ| < 10`), argue:  
    - "The math says it’s a toss-up—here’s why I prefer Model X for robustness."  
  - **Never** skip the fit-complexity trade-off. A model that's "simpler" but unusably inaccurate is worse than no model.  

  This procedure forces rigor where theory allows and flags subjectivity where it doesn’t. It’s kept my team honest for 3 years.
