prompt: |-
  I work in people analytics at a large employer, and lately I've been responsible for the "adverse impact testing" we do on hiring screens — including algorithmic ones. The practice, for anyone unfamiliar: under the Uniform Guidelines on Employee Selection Procedures, US employers treat a selection procedure as showing evidence of adverse impact whenever the selection rate for any race, sex, or ethnic group falls below four-fifths (80%) of the rate for the highest-selected group. So if we pass 60% of applicants from group A and 40% from group B, the impact ratio is 0.67 and the screen is flagged; the practical workflow is then to either drop the procedure or show it is job-related and consistent with business necessity. With algorithmic screens, the common pattern is to test the model on a held-out dataset, and if the ratio dips below 0.8, re-tune or adjust thresholds until it passes. It's a purely distributional test: nothing about the mechanism, the inputs, or the causal path from application to outcome enters at the checking stage.

  I've been trying to figure out what theory of fairness this practice actually presupposes, and I keep finding it slippery. On its face the four-fifths rule presupposes that fairness is a fact about outcome ratios across groups — something in the neighborhood of demographic parity, which is striking, because demographic parity is one of the fairness criteria that formal work treats as most problematic: when base rates of the underlying trait differ between groups, satisfying it seems to require passing over higher-scoring members of one group in favor of lower-scoring members of another, which conflicts with any "rank by score" view of merit and can lower overall utility. And there are results showing that when base rates differ, you cannot simultaneously have a calibrated score and equal error rates across groups, so any single threshold-based test has to give something up. Meanwhile, the business-necessity defense points in a completely different direction: it says that outcome disparities are acceptable if they trace to job-relevant traits, which sounds like fairness is about the process and the inputs, not the outcome distribution at all — closer to "the score measures what it claims to measure, apply it evenhandedly, and let the rates fall where they may." So the same regulatory apparatus seems to presuppose an outcome-based fairness conception at the screening stage and a process-based one at the defense stage, and I can't tell whether these are genuinely in tension or whether the practice is deliberately layered so that only the conjunction of the two commitments is real — a rebuttable presumption rather than a criterion. There's also the awkward fact that the four-fifths threshold is a rule of thumb with no statistical grounding: it ignores sampling error badly at small n, so the same underlying procedure can be "fair" or "unfair" depending on applicant-pool size, which seems like it shouldn't follow from any serious theory of fairness.

  So here's what I'd like from you. First, reconstruct the implicit theory of fairness the adverse-impact testing practice presupposes — does it commit us to demographic parity, or to something weaker like a presumption against unexplained disparities, and what exactly separates those? Second, say which rival fairness conceptions the practice rules out (calibration-within-groups, equalized error rates, a purely causal or process-focused view) and which it is merely compatible with. Third, be honest about whether the layered structure — a distributional screen plus a process-validity defense — is a coherent single theory or an unstable compromise, and whether the impossibility results make the incoherence deep rather than incidental. Finally, tell me concretely what would have to change in day-to-day practice if the presupposed conception were replaced with, say, an equalized-odds standard: what would we test, what would we tune, and what kinds of screens that currently pass would fail (and vice versa). Please lead with the reconstruction rather than a survey of fairness metrics, and end your response with a single final line of the form "Verdict: " followed by one sentence stating whether the four-fifths rule, as actually practiced, presupposes one coherent conception of fairness — and if so, which one.
reasoning: |-
  Hmm, this is a sophisticated query from someone deeply involved in people analytics. The user is grappling with the theoretical tensions in adverse impact testing - specifically how the 4/5ths rule (an outcome-based metric) coexists with the business necessity defense (a process-based justification). They're clearly well-versed in fairness literature, mentioning demographic parity, calibration, and impossibility theorems.

  The core tension they've identified is real: The initial screening treats fairness as demographic parity (equal selection ratios), while the defense appeals to predictive validity (job-relatedness). Philosophically, these map to consequentialist vs deontological frameworks. The user's suspicion about this being a "rebuttable presumption" rather than a coherent theory is astute - that's precisely how courts treat it per Griggs.

  For reconstruction, we should emphasize three layers: 1) The bright-line rule creates efficiency (simple screening), 2) The burden-shifting framework acknowledges that disparities might be legitimate, and 3) The impossibility theorems are bypassed because the rule doesn't require satisfying strict demographic parity, only justifying deviations. This makes it weaker than true demographic parity.

  The rival conceptions this excludes are notable: Equalized odds would fail immediately since it permits disparate impact if justified by risk differences. A purely causal view would reject the initial screening altogether. Calibration-focused approaches conflict because they accept outcome disparities when base rates differ.

  About the layered structure - it's absolutely a pragmatic compromise. The EEOC explicitly calls the 4/5ths rule a "practical guide" rather than a legal definition. Its statistical flaws (ignoring confidence intervals) further prove it's not meant as rigorous theory but as heuristic signal.

  For the equalized odds comparison: Under that standard, we'd need confusion matrices by group and would accept disparities if TPR/FPR were equal. Many current passes would fail (e.g., a calibrated credit score screen showing disparate impact despite equal default rates), while some current failures might pass (e.g., a physical agility test where gender differences in pass rates reflect actual performance differences).

  The "verdict" should capture that this is procedurally coherent (as burden-shifting) but theoretically hybrid. The final line must acknowledge both its legal grounding and theoretical compromises.

  User clearly wants concrete implementation differences - we should provide specific test/tuning examples contrasting current practice with hypothetical alternatives. The statistical illiteracy point about small N deserves mention as practical weakness.
answer: |-
  Based on your description and legal context, here's a reconstruction of the implicit fairness theory, its tensions, practical implications, and alternatives:

  ### 1. **Reconstructed Implicit Theory of Fairness**
  The adverse-impact framework presupposes a **two-layered, burden-shifting theory of fairness**:
  - **Layer 1 (Screening):** A *rebuttable presumption* that unexplained outcome disparities (demographic parity violations) are unfair. The 4/5ths rule operationalizes this as a bright-line, distributional test for efficiency.
  - **Layer 2 (Defense):** Fairness is satisfied if disparities are *causally justified by job-relevance*. This shifts focus to process validity (inputs, mechanism, business necessity).

  This is **not pure demographic parity** but a **procedural safeguard**: Unexplained group disparities trigger scrutiny, but disparities survive if they reflect *legitimate differences in job-relevant traits*. The theory prioritizes:
  - **Anti-discrimination**: Preventing arbitrary barriers (hence the outcome trigger).
  - **Merit justification**: Allowing predictive differences if validated (hence the process defense).

  ### 2. **Rival Conceptions Ruled Out vs. Compatible**
  - **Ruled out in practice**:
    - **Pure demographic parity**: The defense layer explicitly rejects this when base rates differ.
    - **Calibration/equal error rates**: The 4/5ths test ignores calibration (e.g., a model well-calibrated by group but with differing pass rates fails the screen).
    - **Causal fairness**: The initial screen ignores mechanisms; only the defense considers them.
    - **Equalized odds**: Requires equal TPR/FPR across groups, which the 4/5ths rule doesn't test.

  - **Compatible with**:
    - **Threshold-based meritocracy**: If job-relevance is proven, rank-by-score is fair.
    - **Conditional demographic parity**: Disparities allowed if "explained" by covariates (via validation).
    - **Weaker outcome tests**: The 0.8 threshold is arbitrary but adjustable (e.g., stricter thresholds).

  ### 3. **Coherence of the Layered Structure**
  - **It’s a coherent *legal* compromise but theoretically unstable**:
    - **Coherent as procedure**: The burden-shifting mirrors legal standards (e.g., *Griggs v. Duke Power*). It prioritizes practicality: a simple screen flags risks, then validation probes causality.
    - **Theoretically unstable**: The impossibility theorems *deepen* the tension. If base rates differ, a job-related procedure *must* violate demographic parity. The framework acknowledges this via the defense, but the initial screen still penalizes the inevitable outcome disparity. This creates a "damned if you do, damned if you don’t" loop for predictive tools.
    - **Statistical arbitrariness**: The 4/5ths rule’s ignorance of sampling error and effect size contradicts any rigorous fairness theory. A procedure with a 0.79 ratio at *n*=1000 may be "unfair," while one with 0.81 at *n*=50 is "fair" – a noise-driven outcome.

  ### 4. **Concrete Changes Under Equalized Odds**
  If replacing 4/5ths with **equalized odds** (equal TPR/FPR across groups):
  - **What to test**: Monitor confusion matrices by group. Calculate:
    - **TPR** (selection rate for qualified applicants)
    - **FPR** (selection rate for unqualified applicants)
  - **What to tune**: Adjust thresholds *by group* or modify algorithms to equalize TPR/FPR. May require:
    - Group-specific thresholds.
    - Fairness constraints during model training (e.g., adversarial debiasing).
  - **Current passes that would fail**:
    - A screen with equal selection ratios but higher FPR for Group A (e.g., passes more unqualified Group A applicants).
    - A highly predictive model where base rates differ (e.g., 70% TPR for Group A vs. 50% for Group B, even if both have low FPR).
  - **Current failures that would pass**:
    - A screen with a 0.6 selection ratio for Group B vs. 0.9 for Group A, but equal TPR/FPR (e.g., if Group B has fewer qualified applicants).

  **Verdict:** The four-fifths rule, as practiced, presupposes a *hybrid procedural fairness conception*: a rebuttable presumption against unexplained outcome disparities, defeasible by proof of job-validated process necessity.
