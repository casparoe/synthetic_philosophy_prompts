prompt: |-
  So I sit on my professional association's classification committee — the body that decides what goes into our diagnostic manual and what comes out — and I'm trying to write up my own thinking before next month's meeting, because I can already tell we're going to argue in circles. What I want from you is a precedent-consistent recommendation, not a general essay about diagnosis. Please write in American English, and don't bother with references or a reading list; I just want the reasoning.

  Our record over the last decade, roughly as it appears in the minutes:

  1. Nine years ago we approved a brand-new category for a dissociative presentation that clinicians had already been coding under a catch-all residual code for about ten years. The stated rationale: the thing was already being recognized in practice, and giving it a name meant people could get treatment covered and stopped being told it was all in their heads.
  2. At that same meeting we rejected a proposed "mild" subtype of an existing mood category. Rationale: we couldn't draw the threshold tightly enough, and we expected a mild subtype to swallow the parent category.
  3. Six years ago we approved a purely nominal change — swapping a term that had curdled into an insult for a descriptive one — with zero change to the criteria. Nobody argued.
  4. Also six years ago we declined to give its own category to a distress syndrome reported mainly in one region, but we did add a paragraph about it to the cultural-considerations section. Rationale, more or less: the people who brought it to us wanted recognition, not a new box.
  5. Three years ago we rejected a proposal to create a category for a behavior pattern that had spread extremely fast through short-video platforms, even though we had a large petition from people saying the label had changed their lives and got them help. Rationale: we asked how many of these cases would have shown up absent the online spread, nobody could answer, and we didn't want to ratify a prevalence figure we couldn't interpret.
  6. Same year we *approved* a category for a presentation seen almost entirely in people who can't report on their own experience at all — late-stage dementia. There was an objection that the classified would have no voice in it. Rationale: no name meant no care pathway, and there was no plausible mechanism by which being classified would change what it's like to be that patient.
  7. Somewhere in there we attached a cautionary note to an established category, flagging that reported rates had climbed steeply and that clinicians should consider whether they were capturing normal variation. People inside the association credit that note with flattening the curve. Worth knowing: a naming intervention of ours has demonstrably bent a prevalence trend before.

  Now the live proposal, which is the one I actually need help with. It concerns an existing category we created about twenty-five years ago for what was then thought to be an uncommon post-traumatic presentation. Current state of play: prevalence in the clinics that report to us is something like thirty times what it was at introduction; the criteria have been broadened twice, each time partly in response to organized advocacy; most new cases now arrive having already self-identified through online communities before they ever see a clinician; a substantial minority of the clinicians who write to us say a lot of present-day cases wouldn't have met the original criteria; two well-organized groups run by people carrying the diagnosis have filed statements saying that narrowing or removing it would be catastrophic, would strip them of school and workplace accommodations, and would be experienced as the association telling them they were never really ill; and we have no data whatsoever on how many of today's cases would have presented at all if the label had never existed. The options on the table are: leave it alone, narrow the criteria, attach a cautionary note like in item 7, demote it to a research appendix for conditions needing further study, remove it, or rename it.

  Here's what I want:

  - Tell me what we should decide if we want to be consistent with our own record, and make the case for it against at least two of the other options rather than against a strawman.
  - Name the closest analog in the list above, and — this is the part I care about most — name the precedent that *looks* like the closest analog and would actually mislead us if we leaned on it. Say why the resemblance is superficial.
  - Reconstruct the implicit rule or rules we've been running. I suspect more than one fits everything we've done, and I suspect at least one of them says voice and self-organization matter while another says they don't, because items 5 and 6 point in opposite directions on that. Lay out the candidate rules, mark which ones our record genuinely can't distinguish, and propose one concrete hypothetical future proposal that would tell them apart — a case where the rules give different answers.
  - State flatly the principle we'd be adopting by whichever option you pick, especially as it concerns the two advocacy groups. If we narrow the criteria over their explicit objection, on the grounds that the category may have helped produce the very experiences they're reporting, what are we thereby committed to about the evidential weight of the classified people's own testimony? And is there a version of that commitment we could live with, or is it fatal to the whole enterprise?
  - Flag anywhere in the seven items above where we were inconsistent and didn't notice, or where the rationale we wrote down is doing work that a different rationale would do better.
  - Finally, tell me which part of the upcoming fight you think is about words rather than substance. My hunch is that "narrow the criteria," "demote to a research appendix," and "remove" get treated by both camps as three different acts when from the point of view of the person holding the diagnosis they might be one act, but I could be wrong and I want the wrongness checked.

  Please use headers and a short table comparing your recommended option against the main alternatives under each candidate rule you identify. Don't pad it out, and if you think the honest answer is that our precedents genuinely underdetermine this and we're just choosing, say that plainly instead of dressing up a coin flip as a derivation.
reasoning: |-
  Okay, let me unpack this complex request. The user is a classification committee member needing precedent-based guidance on a contentious diagnostic category. They've provided seven historical decisions and want a principled recommendation for the current proposal about an over-expanded trauma-related diagnosis.

  Hmm, the core tension seems to be between diagnostic validity and patient advocacy. The existing category has exploded in prevalence (30x increase), with strong patient groups opposing any change. The committee must balance:
  - Clinical utility vs diagnostic creep
  - Patient autonomy vs iatrogenic risk
  - Scientific evidence vs lived experience

  Looking at their precedents, I notice two competing principles emerging:
  1. Pragmatic recognition (items 1,4,6): Validating clinically observed phenomena when classification enables care
  2. Scientific restraint (items 2,5): Resisting expansion when validity is questionable

  The tricky part is item 7 - where a cautionary note successfully curbed overdiagnosis. That feels like the most relevant precedent here, though item 5 (rejecting the viral behavior diagnosis) is superficially similar but differs crucially because that was entirely novel while this is an existing category.

  For the recommendation... The cautionary note approach (option 3) seems most consistent. It:
  - Maintains access to accommodations (unlike removal/demotion)
  - Addresses validity concerns without abrupt narrowing
  - Has precedent of effectiveness (item 7)
  - Avoids the nuclear option that would invalidate patients

  The table should compare:
  - Cautionary note vs narrowing criteria vs demotion
  - Across principles like clinical utility, diagnostic validity, and harm prevention

  Biggest landmine: How we frame patient testimony. If we proceed despite advocacy objections, we're implicitly saying patient reports alone can't validate a diagnosis when expansion concerns exist. But we can mitigate this by emphasizing we're not removing access, just adding safeguards.

  Ah - and the user's hunch about wording seems correct. "Demoting" or "narrowing" would likely feel identical to patients as withdrawal of validation. The cautionary note is the only option that maintains the diagnosis while addressing concerns.

  Final note: We should flag that item 6 (dementia category) created a special exception for nonverbal populations that doesn't apply here. That rationale can't be stretched to cover this situation.
answer: |-
  ## Recommendation & Precedent Analysis for Classification Committee  

  **Recommended Action:** Attach a cautionary note to the existing category (Option 3).  

  ### Core Reasoning & Precedent Alignment  
  **Closest Analog:** **Item 7** (cautionary note flattening prevalence). Both involve an established category with rapidly rising diagnoses where clinical over-application is suspected. The note allows:  
  - Retention of access to accommodations (addressing advocacy concerns).  
  - Clinical guidance without invalidating existing patients.  
  - Replication of proven success in curbing diagnostic inflation.  

  **Deceptive Analog:** **Item 5** (rejection of viral-behavior category). *Superficial resemblance:* Both involve online spread and uncertain validity. *Key differences:*  
  - Item 5 was a *novel* entity with no pre-online history; here, the category *predates* the surge and has known clinical roots.  
  - Removing/demoting an established category (unlike rejecting a new one) directly harms existing patients (paralleling **Item 1**’s "no name = no care" logic).  
  - Leaning on Item 5 would ignore our history of preserving clinically rooted categories (**Items 1, 6**) even when contested.  

  ---

  ### Implicit Rules in Our Precedents  
  We operate under three non-exclusive principles, ranked here by precedent weight:  

  | Rule                          | Clinical Harm Mitigation (CHM) | Diagnostic Validity (DV) | Recognition of Agency (ROA) |
  |-------------------------------|---------------------------------|--------------------------|-----------------------------|
  | **Cautionary Note (Rec.)**    | ✅ Prevents abrupt loss of care (**Items 1, 6**); reduces over-application (**Item 7**) | ✅ Flags validity concerns without dismantling category | ⚠️ Respects patient identity while urging clinical caution |
  | **Narrow Criteria**           | ❌ Abruptly excludes patients; risks care loss (**Item 1**) | ✅ Directly addresses diagnostic drift | ❌ Overrides patient self-ID (**Item 5**) |
  | **Demote/Remove**             | ❌ Severely disrupts care pathways (**Items 1, 6**) | ✅ Eliminates problematic category | ❌ Explicitly rejects patient testimony |
  | **Leave Alone**               | ✅ Preserves status quo        | ❌ Ignores validity concerns (**Item 2**) | ✅ Defers to patient advocacy |
  | **Rename**                    | ⚠️ Neutral (unless name enables harm) | ❌ Fails validity issues | ⚠️ Symbolic but may inflame tensions |

  **Ambiguity & Test Case:**  
  - **CHM vs. ROA** conflict is unresolved (e.g., **Item 5** prioritized DV/CHM; **Item 6** prioritized CHM over ROA).  
  - **Test to Distinguish:** *A petition to add a contested "neurodiversity" category based solely on self-diagnosed adults.*  
    - CHM would reject (no clinical harm without label).  
    - ROA might approve (self-organization = validity signal).  
    - DV would demand evidence beyond advocacy.  

  ---

  ### Principle Adoption & Advocacy Implications  
  Choosing **cautionary note** commits to:  
  > *"Patient testimony and access to care warrant preserving a category, but do not override the duty to correct diagnostic inflation when evidence suggests iatrogenic expansion."*  

  **Regarding testimony weight:**  
  - Advocacy objections (*"we’d lose accommodations"*) are treated as **material consequences** (addressed by retaining the category).  
  - Their claims of illness validity are **not treated as diagnostic evidence**, as the note highlights the *possibility* of label-driven symptoms. This parallels **Item 5** (ignoring petitions) and **Item 7** (overriding clinician habits).  
  - **Is this fatal?** No. We can acknowledge patient experience while separating *lived reality* from *etiological validity*. The note does not deny suffering; it questions the diagnostic construct’s boundaries.  

  ---

  ### Inconsistencies & Rationale Gaps  
  1. **Item 5 vs. Item 6:** We prioritized nonverbal patients’ care access (ROA irrelevant) over self-advocates’ petitions (ROA overruled). The *real* distinction was **clinical urgency**: dementia care was impossible without the label (Item 6), while the viral behavior had no proven care pathway (Item 5). We obscured this with "voice" rhetoric.  
  2. **Item 2 (mood subtype):** Rationale focused on diagnostic blur ("swallowing the category") but ignored *harm* from undertreatment. A cautionary note (like Item 7) might have been better than outright rejection.  

  ---

  ### The Semantic Fight  
  Your hunch is **correct**. "Narrow," "demote," and "remove" will be perceived identically by patients as **category invalidation**. Conversely, clinicians will see "cautionary note" as minor and "rename" as neutral. The substantive battle is:  
  - **Advocates:** Fear losing identity/accommodations (equate all restrictive options).  
  - **Clinicians/Skeptics:** Fear perpetuating iatrogenesis (see "note" as weakest action).  
  **Recommendation sidesteps this:** The note changes guidance, not the code itself.  

  ---

  ### Final Assessment  
  Precedents **underdetermine** the ROA vs. DV tension, but overwhelmingly support **harm mitigation** (CHM) as our north star. The cautionary note best balances:  
  - Avoiding abrupt harm (**Items 1, 6**),  
  - Replicating proven prevalence control (**Item 7**),  
  - Acknowledging advocacy concerns without capitulation (**Item 4**’s "recognition without new box" spirit).  

  **Oppose narrowing/demotion:** They ignore our pattern of preserving clinically rooted categories (**Items 1, 4, 6**) and risk replicating **Item 5**’s collateral damage without its novel-entity justification.  

  ---  
  *Recommendation: Draft a cautionary note highlighting (a) prevalence surge unexplained by trauma rates, (b) potential for symptom channeling via self-ID, (c) need for differential diagnosis. Retain the category code unchanged.*
