answer: |-
  I take your point about higher-level physical properties, and I concede that tornadoes, tigers, and twenty-dollar bills are causally efficacious. But this doesn’t undermine exclusion; it reinforces it. These macro-properties are *not* additional, nonphysical forces over and above their microphysical realizers—they *are* the microphysical realizers, just described at a coarser grain. When the tornado demolishes the barn, the causal work is done entirely by the kinetic and structural properties of the air molecules and debris, which constitute the tornado. The property "being a tornado" is nothing but a collective pattern or aggregation of those microphysical properties and their interactions. So there’s no overdetermination here: the tornado’s causal power is identical to the summed causal powers of its physical constituents. This is reduction without elimination—higher-level physical properties inherit their causal status by being reducible to, and metaphysically grounded in, the physical base. 

  But mental properties like pain, under your nonreductive view, are *not* like tornadoes. You insist pain is irreducibly distinct from its neural realizer—it’s a novel, nonphysical property emergent from but not identical to the physical. *That’s* where exclusion bites: if the neural state N is already sufficient to cause my wince, and pain isn’t identical to N (just "realized by" it in some loose, nonreductive sense), then pain adds nothing causal. To avoid overdetermination, you must either reduce pain to N (making it causally efficacious like the tornado) or admit it’s epiphenomenal. Your tornado analogy fails because you’ve smuggled in reduction for physical properties while denying it for mental ones. 

  *(Stepping out briefly: I’m fairly confident this distinction holds, as it’s the core move in defusing the "causal drainage" worry. But I’m least sure about the "tiger as mere aggregation" point—biological properties might resist straightforward reduction. Still, in-character, I’ll stand by it.)* 

  Back in character: So yes, realized physical properties inherit causation via reduction. If you want pain to cause anything, show me how it reduces. Otherwise, you’ve saved the tornado by conceding my reductionism—and doomed the mind.
