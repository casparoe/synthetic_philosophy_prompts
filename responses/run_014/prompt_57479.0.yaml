  Marcus's universal machine objection is stronger. The invariance theorem's constant really does matter at finite data. Dev's "inches vs centimeters" analogy fails because unit conversions are known and precise, whereas the machine constant is unknown and could be massive. That's why it felt shaky to the user - it's a false equivalence.

  When Marcus says the constant leaves open what we want from Occam's razor, he's spot on. Convergence in the limit doesn't help real scientists with finite data. Dev's dominance argument is technically correct but doesn't resolve the practical problem.

