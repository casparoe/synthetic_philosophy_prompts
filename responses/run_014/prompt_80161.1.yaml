  I've landed on a position I want stress-tested, and I want you to think of yourself as a professional philosopher of mind with real expertise in panpsychism, doing a careful adversarial review rather than a summary. The position: panexperientialism -- the term is David Ray Griffin's coinage for Whitehead's view, and I'm using it in that spirit -- i.e., every elementary physical system has some minimal experiential aspect, and macroscopic consciousness is built up from those micro-experiences via a combination mechanism that fuses them into a unified stream. Before you argue, dont just dump the standard objections: start with some brainstorming, list the strongest objections that actually exist, then pick the two or three you think are most dangerous for this view and explain why they're dangerous rather than just stating them. In particular I want to know what would count against it: what observations, arguments, or thought experiments would force a defender to abandon the combination mechanism (or the whole view), what a committed defender would concede is a genuine cost versus what they'd dismiss as a misreading, and whether the view has been qualified into unfalsifiability -- and if it has, whether that's a problem for a view of this kind. Rank the defeaters from fatal to merely awkward.
