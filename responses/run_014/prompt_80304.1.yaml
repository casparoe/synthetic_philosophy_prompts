  Here is the 5-step decision procedure:

  1. **Check group sizes**: For each protected group, verify it has at least 30 instances in the test set. Groups below this threshold are marked "too small" and excluded from automated checks.  
     *Passing*: All groups meet the threshold or are marked "too small".

  2. **Compare base rates**: For non-excluded groups, calculate the actual positive rate (e.g., loan default rate). If the largest group rate minus the smallest is ≤0.01, base rates are "similar"; else, they're "different".  
     *Passing*: Base rates are "similar" OR only one group remains after size checks.

  3. **Test calibration**: For non-excluded groups, bin predictions into 10 deciles. In each bin, ensure the average predicted probability is within ±0.05 of the actual outcome rate.  
     *Passing*: All bins in all groups meet the tolerance OR only "too small" groups exist.

  4. **Test equalized odds**: For non-excluded groups, calculate true positive rates (TPR) and false positive rates (FPR). If TPRs vary by ≤0.05 and FPRs vary by ≤0.05 across groups, it passes.  
     *Passing*: Both TPR and FPR tolerances are met OR only "too small" groups exist.

  5. **Resolve conflicts**:  
     - If any group is "too small": **Hand to human** (insufficient data).  
     - If base rates are "similar" and both Steps 3 & 4 pass: **Approve** the model.  
     - If base rates are "similar" but Steps 3 or 4 fail: **Reject** the model (fix required).  
     - If base rates are "different":  
       - If one metric (calibration or equalized odds) passes and the other fails: **Hand to human** (value judgment on which to prioritize).  
       - If both fail: **Reject** the model.  
       - If both pass: **Hand to human** (unexpected result; likely tolerance error).
