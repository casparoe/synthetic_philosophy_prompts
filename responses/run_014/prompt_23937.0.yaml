prompt: |-
  A popular article I read summarizes updateless decision theory like this: 'UDT says you don't choose actions, you choose algorithms. Instead of asking "what should I do in this situation?", you ask "what algorithm, if I were to install it, would maximize my expected utility?" Once you've picked the algorithm, you just run it. This means UDT never uses counterfactuals — it just computes what would happen if the agent followed each candidate algorithm, which is just a matter of running the simulation. And because the agent's choice is really a choice of code, UDT handles Newcomb's problem by observing that a one-boxing algorithm gets the money, so the agent installs the one-boxing algorithm. The theory is elegant and, unlike causal decision theory, it has no need for the notion of a counterfactual.' The article goes on to claim that this makes UDT a drop-in replacement for causal decision theory in all cases. How much of the summary is right? Go sentence by sentence and tell me what a decision theorist working on updateless decision theory would accept, what they'd wince at, and what is just wrong — and whether the article's later claim about a drop-in replacement follows from anything true in the summary.
reasoning: |-
  We are going to break down the summary sentence by sentence and evaluate each part from the perspective of a decision theorist working on Updateless Decision Theory (UDT). We then consider the claim that UDT is a drop-in replacement for Causal Decision Theory (CDT).

  The summary:

  1. "UDT says you don't choose actions, you choose algorithms."
     - This is a reasonable high-level description. In UDT, the agent selects a policy (or algorithm) that maps observations to actions, rather than choosing an action in a particular situation. The agent commits to an algorithm in advance. However, note that UDT is typically formulated in terms of selecting a mathematical function (the policy) that determines actions for all possible inputs (observations). So, the agent is choosing a function (algorithm) rather than an action.

     - A decision theorist would accept this as a simplified but acceptable starting point.

  2. "Instead of asking 'what should I do in this situation?', you ask 'what algorithm, if I were to install it, would maximize my expected utility?'"
     - This is a good rephrasing of the core idea. UDT evaluates the expected utility of entire algorithms (policies) across all possible situations they might encounter, and then picks the best one. The "install" metaphor might be a bit off because it suggests a physical installation, but the idea of committing to a policy is central.

     - The decision theorist would accept this, though might note that the evaluation of expected utility is done from a prior perspective (without updating on the current situation, hence "updateless").

  3. "Once you've picked the algorithm, you just run it."
     - This is correct. After selecting the best policy, the agent follows it in every situation. The agent does not second-guess the policy when it comes to a particular situation.

     - The decision theorist would accept this.

  4. "This means UDT never uses counterfactuals — it just computes what would happen if the agent followed each candidate algorithm, which is just a matter of running the simulation."
     - This is a bit more nuanced. UDT avoids the kind of counterfactuals that CDT uses (which are causal and often involve breaking the connection between the agent's decision and other variables). Instead, UDT uses logical counterfactuals or simulations to evaluate what would happen if a given algorithm were run in the world. The word "simulation" might be too vague. In formal UDT, the agent considers the logical consequences (in a mathematical sense) of the algorithm being run in the environment.

     - A wince: The statement that UDT "never uses counterfactuals" is too strong. It doesn't use causal counterfactuals (like in CDT), but it does use logical counterfactuals (e.g., what would be the outcome if this algorithm were run). So, it's not that counterfactuals are absent, but the kind is different.

     - Also, note that running a simulation might be an oversimplification. The environment might contain a model of the agent, so the agent must reason about what would happen if it were using a different algorithm. This involves logical deduction and often requires solving a fixed-point equation (because the environment might be simulating the agent, which in turn is simulating the environment, etc.).

  5. "And because the agent's choice is really a choice of code, UDT handles Newcomb's problem by observing that a one-boxing algorithm gets the money, so the agent installs the one-boxing algorithm."
     - This is correct for Newcomb's problem. In Newcomb's, the predictor has already made a prediction based on the algorithm. If the agent chooses an algorithm that one-boxes, then the predictor (if accurate) will have put $1M in the box. If the agent chooses an algorithm that two-boxes, then the predictor will have put nothing in the opaque box. Therefore, the one-boxing algorithm yields $1M, while the two-boxing algorithm yields $1,000. Hence, the agent picks the one-boxing algorithm.

     - A decision theorist would accept this.

  6. "The theory is elegant and, unlike causal decision theory, it has no need for the notion of a counterfactual."
     - The elegance is subjective, but many find the idea of choosing a policy and then following it without updating to be elegant.

     - However, the claim that it has no need for the notion of a counterfactual is problematic. As noted above, UDT does use logical counterfactuals. It avoids the causal counterfactuals that CDT uses, but it still relies on counterfactual reasoning about what would happen if the agent had a different algorithm. Therefore, the statement is incorrect if taken to mean that UDT avoids counterfactuals altogether.

     - A decision theorist would wince at the absolute claim of "no need for counterfactuals". They would clarify that UDT avoids causal counterfactuals and instead uses logical counterfactuals.

  Now, the article's later claim: "this makes UDT a drop-in replacement for causal decision theory in all cases."

  - The summary correctly captures that UDT handles Newcomb's problem correctly (which CDT fails at). However, there are other decision problems where UDT and CDT might differ, and UDT is not without its own challenges.

  - UDT is a more general framework, but it is not a simple drop-in replacement because:

    a. UDT requires the agent to have a model of the entire world (or at least the parts that are relevant) to simulate the consequences of each candidate algorithm. This is computationally intensive and might be infeasible in practice.

    b. There are philosophical and technical challenges in defining logical counterfactuals and the appropriate mathematical formalism.

    c. There are known problems where UDT (at least in its original formulation) may not perform as desired. For example, in some cases, UDT might be exploitable or lead to paradoxical outcomes (though research is ongoing).

    d. CDT is often considered more intuitive for everyday decisions and is easier to compute in practice.

  - Moreover, UDT is not the only alternative to CDT. Other theories, such as Evidential Decision Theory (EDT) and Functional Decision Theory (FDT), exist. FDT is closely related to UDT and sometimes seen as a more recent formulation of similar ideas.

  - Therefore, the claim that UDT is a drop-in replacement in all cases is an overstatement. It is a different framework that solves some problems better than CDT but may have its own issues and might not be straightforward to apply in all situations.

  In summary:

  - Sentences 1, 2, 3, and 5 are acceptable (with minor quibbles about the word "install" in 2 and the example in 5 being correct for Newcomb).
  - Sentence 4 is partially correct but overstates by saying "never uses counterfactuals" and oversimplifies with "just a matter of running the simulation".
  - Sentence 6 is mostly acceptable for elegance but wrong about having no need for counterfactuals.

  The claim about being a drop-in replacement does not follow from the summary because the summary does not address the full range of decision problems, computational feasibility, and other nuances. While UDT is a powerful theory and solves some problems that CDT fails, it is not a drop-in replacement in all cases.
answer: |-
  Let's evaluate the summary sentence by sentence from the perspective of a decision theorist working on Updateless Decision Theory (UDT), and then address the claim about UDT being a "drop-in replacement" for Causal Decision Theory (CDT). I'll note where the summary is accurate, where it might cause discomfort ("wince"), and where it's incorrect. Key UDT references include work by Wei Dai (2009) and Eliezer Yudkowsky.

  ### Sentence-by-Sentence Analysis

  1. **"UDT says you don't choose actions, you choose algorithms."**  
     - **Accept**: This is broadly correct. UDT agents select a fixed *policy* (a mathematical function mapping observations/inputs to actions) *in advance*, rather than deciding actions situationally. The policy is the "algorithm" here.  
     - **Wince**: "Algorithms" is an informal term—UDT formally uses *policies* or *programs*. Also, UDT doesn't literally "choose" at runtime; it precommits to a policy optimized for expected utility.  
     - **Overall**: Accurate, but slightly imprecise.

  2. **"Instead of asking 'what should I do in this situation?', you ask 'what algorithm, if I were to install it, would maximize my expected utility?'"**  
     - **Accept**: Perfectly captures UDT's core. The agent evaluates policies globally by asking: "Which policy, if *always followed*, yields the highest expected utility across all possible worlds I might be in?"  
     - **Wince**: "Install" is metaphorical (no physical installation). Also, UDT assumes the agent can simulate consequences of policies, which requires omniscience about logical implications (a major practical hurdle).  
     - **Overall**: Correct and elegant summary.

  3. **"Once you've picked the algorithm, you just run it."**  
     - **Accept**: This is faithful. After selecting the optimal policy, the agent executes it deterministically. No situational updates or deviations.  
     - **Wince**: None. This is standard. UDT is "updateless" because it ignores context-specific information (like which exact situation the agent is in when acting).  
     - **Overall**: Accurate.

  4. **"This means UDT never uses counterfactuals — it just computes what would happen if the agent followed each candidate algorithm, which is just a matter of running the simulation."**  
     - **Accept**: UDT indeed avoids *causal* counterfactuals (used in CDT). It uses *logical counterfactuals* or simulations to evaluate policies. For example, "If my policy were \(P\), what would the outcome be?" is central.  
     - **Wince**:  
       - "Never uses counterfactuals" is **incorrect**. UDT *relies* on logical counterfactuals (e.g., "What if I were a one-boxer?"). It rejects *causal* counterfactuals (e.g., CDT's "What if I do X, but my past state remains fixed?"), but not counterfactuals generally.  
       - "Just a matter of running the simulation" is a **severe oversimplification**. UDT requires solving complex logical fixed points (e.g., when the environment simulates the agent). This is provably hard (related to halting problems) and not mere "simulation" in a straightforward sense.  
     - **Overall**: Misleading. UDT uses logical counterfactuals and faces computational universality challenges.

  5. **"And because the agent's choice is really a choice of code, UDT handles Newcomb's problem by observing that a one-boxing algorithm gets the money, so the agent installs the one-boxing algorithm."**  
     - **Accept**: This is correct for Newcomb's Problem. UDT compares policies:  
       - One-box policy: Omega predicts one-boxing → $1M reward.  
       - Two-box policy: Omega predicts two-boxing → $1,000 reward.  
       UDT picks the one-box policy for higher expected utility.  
     - **Wince**: "Choice of code" is poetic but fine. Some theorists note that UDT's solution requires the agent to be "predictable" (e.g., Omega must simulate the policy correctly).  
     - **Overall**: Accurate for Newcomb's, but UDT's strength is in *logical* (not just causal) dilemmas.

  6. **"The theory is elegant and, unlike causal decision theory, it has no need for the notion of a counterfactual."**  
     - **Accept**: UDT is elegant (subjective but common praise). It avoids *causal counterfactuals*, a weakness of CDT.  
     - **Wince/Incorrect**:  
       - "No need for the notion of a counterfactual" is **false**. UDT uses *logical counterfactuals* (e.g., implications of mathematical proofs about agent-environment interactions). CDT uses *causal counterfactuals* (modeled via causal graphs), but both use counterfactual reasoning.  
       - Claiming UDT has "no need" for counterfactuals ignores its reliance on logical possibility (e.g., "What if my algorithm output were different?").  
     - **Overall**: Wrong about counterfactuals. Elegance is subjective but uncontroversial.

  ### The Claim: "UDT is a drop-in replacement for CDT in all cases"
  - **Does this follow from the summary?** No, and the claim itself is **overstated**.  
  - **Why:**  
    - **Strengths of UDT**: It solves problems like Newcomb's or logical XOR (where CDT fails) by using policy-level optimization and logical counterfactuals.  
    - **Not a drop-in replacement**:  
      - **Divergences**: CDT and UDT give different answers in some scenarios (e.g., *counterfactual mugging*). UDT may precommit to "irrational" actions (e.g., paying a mugger) if it globally benefits all possible versions of itself.  
      - **Practicality**: UDT requires full logical omniscience to evaluate policies—impossible for real agents. CDT is computationally simpler.  
      - **Philosophical differences**: CDT is grounded in causality; UDT in logical consistency. They aren't interchangeable frameworks.  
      - **Edge cases**: UDT struggles with *anthropic reasoning* (e.g., Sleeping Beauty) and *self-modification* in ways CDT doesn't. Later extensions (e.g., FDT) aim to refine UDT.  
  - **Verdict**: UDT is a powerful *alternative* to CDT for certain problems, but not a universal "drop-in replacement."

  ### Conclusion
  - **Accurate parts**: Sentences 1–3 and 5 capture UDT's spirit well (policy selection, precommitment, Newcomb's solution).  
  - **Inaccurate/misleading**: Sentences 4 and 6 misrepresent counterfactuals (UDT uses logical ones) and oversimplify "simulation."  
  - **Drop-in claim**: Unsupported. UDT solves CDT's flaws in *some* cases but introduces new challenges. It's complementary, not a replacement.  

  For deeper study, see Wei Dai's [original UDT writeup](https://www.lesswrong.com/posts/7XqjLuN4vJtqZJuZt/updateless-decision-theory) or Yudkowsky's discussions on logical decision theories.
