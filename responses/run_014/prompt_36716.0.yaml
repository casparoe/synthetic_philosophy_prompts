  Hmm, the key challenge here is reconstructing the unstated philosophical commitments in legal/medical practices. The user mentions psychological continuity, Dennett's narrative view, and the asymmetry between advance refusals vs. requests. They want to avoid literature surveys and focus on original arguments tailored for physicians and law students.

  First, I should tackle the core question: What makes the earlier and later patient the "same person" in Ulysses contracts? The standard Locke-Parfit psychological continuity theory seems relevant—it could justify privileging the lucid self because psychosis disrupts connectedness. But the user suspects this might be insufficient. 

  Then there's Dennett's narrative model. Here's a puzzle: if both selves are part of the same narrative, why privilege one "chapter" over another? I recall Dennett emphasizes the narrator function—the lucid self constructs the overarching story, including the psychotic episodes as disruptions. That might explain why we defer to the authorial self. 

  But the asymmetry issue is thornier. Why do we honor advance refusals (e.g., no feeding tubes in dementia) more readily than advance requests (e.g., forced treatment in psychosis)? The user's hypothesis about "biographical death" vs. partial subjectivity resonates. In dementia, the narrative self seems permanently dissolved; in psychosis, a distorted but present self exists. But is this coherent? 

  I wonder if Frankfurt's hierarchical theory of desires could help—the lucid self's second-order volitions represent "true" agency, while psychotic refusal reflects first-order impulses disconnected from deeper values. That might ground the asymmetry without metaphysical inconsistency. 

  For the medical audience, concrete hooks matter: capacity assessments treat dementia as global incapacity versus psychosis as fluctuating. Also, the law's fear of paternalism makes enforced treatment (advance requests) feel more violative than withholding care (advance refusals). 

  Ultimately, the practice seems philosophically unstable. To fix it, we might need to abandon strict personal identity arguments and focus on forward-looking interests—e.g., preventing irreversible harm to the patient's life project. But I should flag that this shifts the ethical foundation entirely.
answer: |-
  Here's a reconstruction of the implicit metaphysics of self in Ulysses contracts, designed to meet your requirements for a rigorous yet practice-anchored analysis:

  ### 1. The Implicit Theory of Self in Ulysses Contracts  
  The practice presupposes a **layered psychological continuity theory** with **epistemic and agential privileging**. It requires:  
  - **Minimal metaphysical continuity**: Bodily identity suffices for legal personhood, but the *normative weight* shifts to psychological features.  
  - **Hierarchy of selves**: The lucid self is positioned as the "architect" of identity, while the psychotic self is framed as a "disrupted temporary agent."  
  - **Narrative authority**: The earlier self is seen as possessing privileged access to the *meaning* of future psychotic episodes within the life-narrative.  

  *What it strictly requires*:  
  - That psychosis constitutes a *break* in rational agency severe enough to suspend contemporaneous autonomy claims.  
  - That the pre-psychotic self has greater competence in interpreting the psychotic self's interests.  

  *Where it's underdetermined*:  
  The practice could be licensed by:  
  - A Lockean psychological continuity theory (if psychosis severs connectedness)  
  - A Schechtman-style narrative self-constitution view (the directive maintains narrative coherence)  
  - A Frankfurtian hierarchical will theory (the directive expresses "true" second-order desires)  

  ### 2. Dennett's Narrative Gravity Model: Implications and Tensions  
  - **The promise**: Dennett's "center of narrative gravity" metaphor *could* justify privileging the lucid self if we view psychosis as a narrative rupture where the "narrator function" is impaired. The earlier self authors the framework through which psychotic episodes gain meaning ("the storm chapter").  
  - **The problem**: Dennett's model doesn't inherently privilege any single narrative moment. The psychotic self is *also* generating a narrative (e.g., "I'm being persecuted"). Enforcing the directive becomes an arbitrary elevation of one chapter over another unless we add:  
    - A **reliability condition**: The psychotic narrative is epistemically compromised  
    - An **authorship principle**: Only the meta-narrative voice (the lucid self) can bind the whole story  

  *For your med students*: This maps to clinical reality—psychosis often involves impaired reality-testing, while dementia directives respond to irreversible narrative collapse.

  ### 3. The Asymmetry Problem: Can It Be Coherent?  
  The advance refusal/request asymmetry *can* be grounded in a unified theory if we distinguish **modes of self-disintegration**:  

  | Feature          | Psychosis (Ulysses context)       | Late Dementia (Refusal context)     |
  |------------------|----------------------------------|------------------------------------|
  | **Agency Status** | Partial agent (distorted but present) | Non-agent (biographical death)     |
  | **Narrative Capacity** | Intermittent narrator            | Narrator function extinguished     |
  | **Temporal Perspective** | Embedded in current experience   | No access to past/future selves   |
  | **Clinical Reality** | Fluctuating capacity             | Global incapacity                  

  *The principled distinction*:  
  - In psychosis, the contemporaneous refusal stems from a **deformed but existent agential perspective** whose defiance carries moral weight (hence hesitation about requests).  
  - In dementia, the apparent "consent" to eat lacks **biographical significance**—it's not an expression of any enduring self (making refusals easier to enforce).  

  *The vulnerability*: This relies on contestable empirical claims about dementia consciousness. A consistent psychological continuity theorist might reject both practices.

  ### 4. Philosophical Verdict and Policy Implications  
  **Diagnosis**: No major theory of personal identity *cleanly* justifies the practice. Ulysses contracts implicitly blend:  
  - A metaphysical claim (minimal bodily continuity)  
  - An epistemic claim (earlier self better knows "true" interests)  
  - A pragmatic claim (preventing catastrophic life-disruption)  

  **Prescription for coherent policy**:  
  - **Abandon strict personal identity justifications**. Ground directives in:  
    a) **Best interpretation of extended autonomy** (Christman/Dworkin)  
    b) **Critical interests** (Dworkin): Protecting the patient's life-project from irreversible damage  
    c) **Relational autonomy**: Family/clinician input on which self best reflects "who the patient is"  
  - **Implement procedural safeguards**:  
    - *For Ulysses requests*: Require specificity (exact treatments/trigger symptoms), sunset clauses, and independent verification that current refusal aligns with prior predicted "inauthentic" state  
    - *For all directives*: Mandate capacity assessments documenting the patient's understanding of future self-alteration  

  **Why physicians should care**: This moves debates from abstract metaphysics to concrete clinical markers:  
  > "When we enforce a Ulysses contract, we're not claiming the psychotic patient isn't 'them'—we're claiming their current worldview can't reliably reference the values that constitute their identity. That's why capacity assessment must distinguish between *expressing a preference* and *exercising authentic agency*."

  This framework satisfies your need for argument over survey, using the practice's tensions to reveal deeper commitments while offering actionable refinements for your medical audience.
