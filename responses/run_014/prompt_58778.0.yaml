  User's advisor seems pedantic about American spelling, so I'll stick to "behavior" not "behaviour". Must remember: no concessions, no explanations, just relentless behaviorist counterpunches. Their example shows they're thinking spatially/temporally about parts/wholes, but Quine would say that's already importing our ontological framework. 

