answer: |-
  *(adjusting pipe, voice gravelly)* Kid, you're missing the bedrock. All that gadgetry still gives me **only** more speech dispositions triggered by more elaborate stimulations. The lenses? You infer *he's looking at the whole rabbit*. But "looking at" is mentalistic fluff. I track retinal irradiations and his "yes". The hologram? It triggers the *same stimulus patterns* as a real rabbit for "gavagai". His "no" to the ear? It just means *that specific stimulus configuration* doesn't trigger "gavagai". Doesn't touch whether "gavagai" refers to rabbit, rabbit-stage, or rabbit-appearance. You're smuggling in *your* ontology via the experiments. Behavior remains compatible with countless manuals.

  **You:** But Professor Quine, that seems absurdly skeptical! If I show him a *clearly detached* rabbit foot twitching in isolation and he says "bok" (meaning "no" to "gavagai?"), then show the *intact* rabbit and he says "gavagai", haven't I ruled out "undetached rabbit parts"? His dispositions clearly distinguish attached from detached parts in the stimulus.

  **Quine:** (impatiently) No. You're confusing *stimulus similarity* with *ontological commitment*. His "gavagai" applies to stimulations *like this* (points to intact rabbit). His "bok" applies to stimulations *like that* (points to detached foot). That's **all** the data. You translate those patterns into *your* distinction "attached/detached part". But *his* term "gavagai" could still mean "manifestation of rabbithood" applicable only when parts cohere spatially in a rabbit-shaped pattern. "Undetached" is *your* gloss, not fixed by his behavior. The stimulus patterns don't select *one* ontology.

  **You:** Hold on. What if I teach *him* English? I point to the whole rabbit and say "rabbit," then point to the detached ear and say "not rabbit, that's an ear." He learns. Later, seeing *only* a detached ear, he says "not rabbit." Doesn't this show he grasps the *object* rabbit, not parts or stages?

  **Quine:** (sharply) You've merely described *more complex behavioral conditioning*. You conditioned him to associate "rabbit" with stimulations from rabbit-shaped wholes, and "ear" with stimulations from ear-shaped bits. His utterances conform. But this tells me *nothing* about what *his original terms* like "gavagai" signified in *his* head before conditioning – because there *is* nothing in the head to signify. You've imposed *your* linguistic patterns onto his behavior. The pre-conditioning indeterminacy of *gavagai* remains untouched. Learning *your* language doesn't reveal *his* prior meanings – it erases them.

  **You:** Alright, but surely *simplicity* breaks the tie? "Rabbit" is simpler than "undetached rabbit part" or "rabbit-stage." Isn't the simplest translation manual the right one?

  **Quine:** (firmly) Simplicity is a pragmatic virtue for *us*, the linguists. It helps *us* build a workable manual. But it doesn't correspond to any *factual* difference in the native's meanings. His dispositions underdetermine the translation. One manual posits "rabbit," another "rabbit-stage," both equally compatible with *all possible* stimulus-response data. Simplicity chooses the manual, not the meaning. There *is* no meaning beyond what the manual systematizes. You're mistaking a useful tool for metaphysical truth.

  **You:** Final shot: Doesn't this lead to total linguistic chaos? If I can't even pin down "gavagai," how is *any* translation possible? Doesn't this make communication a miracle?

  **Quine:** (calmly) Not chaos. *Empirical underdetermination*. We translate successfully by tacitly agreeing on a manual that meshes with observable behavior. We project our ontology onto the native because it works for *us*. But alternative manuals, equally adequate to *all possible behavioral evidence*, could attribute wildly different ontologies. The miracle isn't communication; it's that we fool ourselves into thinking there's a unique fact of the matter when there demonstrably isn't. Meaning is public, behavioral, and indeterminate. Deal with it. *(Knocks pipe ash out)* Done?
