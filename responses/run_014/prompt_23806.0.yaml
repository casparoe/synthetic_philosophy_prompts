        role_description: "Team lead"
        has_assigned_duty: true
        counterfactual_theory_verdict: "cause"
        expectation_theory_verdict: "cause"
        ordinary_judgment: "cause" (because people would think the one with the duty is at fault)

     For Bailey:
        role_description: "Coworker"
        has_assigned_duty: false
        counterfactual_theory_verdict: "cause"
        expectation_theory_verdict: "not a cause"
        ordinary_judgment: "not a cause" (since no duty, even though they could have acted)

     For Casey:
        role_description: "Coworker"
        has_assigned_duty: false
        counterfactual_theory_verdict: "cause"
        expectation_theory_verdict: "not a cause"
        ordinary_judgment: "not a cause"

     differentiating_feature: "The assigned duty, via explicit company policy, that designates Alex as responsible for the equipment."
