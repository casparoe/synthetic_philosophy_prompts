prompt: |-
  I have no formal training in philosophy, but a disagreement at work a while back over whose fault a missed deadline really was sent me down a rabbit hole of reading about whether failing to do something can count as a genuine cause of what happens next. Almost everything I have found on this uses some version of the same setup: someone was supposed to water a plant, didn't, and then the point gets made that a stranger on the other side of the world who also didn't water it seems to pass the very same test for being a cause, which can't be right. I understand the puzzle, but I would like to see it worked through on a case that is not already worn smooth from overuse, so that the theories are doing the work rather than being recognized from a summary I have already read.

  Please construct a thought experiment meeting this specification. Set it in an ordinary, present-day workplace or household -- not a hospital ward, a beach with a lifeguard, or anyone's houseplants, since those are the settings every treatment of this topic reaches for. The case must involve exactly three people, all present, all equally capable of performing one and the same preventive action, and all equally aware that it needs doing. Arrange things so that each of the three, taken individually with the other two's inaction held fixed, passes the ordinary counterfactual test for causing the eventual harm: if that one person alone had acted, the harm would not have occurred. Exactly one of the three, and only one, must have been given the job of performing that action beforehand, through an actual assigned role, contract, or explicit prior agreement -- not through being more skilled, closer at hand, or in any way more able than the other two, who must match the duty-bearer in every other respect. In the scenario, nobody acts, and the harm occurs. Keep the scenario itself to one paragraph.

  What I am after is whether two theories of causation really do come apart on a case like this for principled reasons, or whether any apparent difference between them is just smuggled in by how the case is described -- so please do not simply hand me verdicts, show how each one follows from applying the theory to the facts you have stipulated. After the scenario, walk through: (1) what a plain counterfactual theory of causation -- on which one thing causes another just in case the second would not have happened without the first -- says about each of the three people's inaction, and whether that theory has any resources for treating the three differently from one another; (2) what a rival theory, on which an omission is a cause only when the outcome is a departure from what would normally or was expected to happen given people's roles (call this the expectation theory), says about each of the three, and why its verdict differs from the counterfactual theory's verdict in this case; (3) which single feature of the case is doing the work of separating the three people, with confirmation that it is not secretly a difference in skill, proximity, or counterfactual strength; (4) what happens to both theories' verdicts if the assigned duty is taken away from everyone, and separately, what happens if that same duty is extended to all three; and (5) the strongest move available to someone committed to the counterfactual theory who wants to resist the conclusion that all three people equally caused the harm.

  Once you have done all of that, give me a structured summary as a single JSON object using exactly this schema: a field "scenario_label" (string) holding a short name for the case; a field "candidates" holding an array of exactly three objects, one per person, each with "role_description" (string, a short phrase identifying who they are in the scenario), "has_assigned_duty" (true or false), "counterfactual_theory_verdict" ("cause" or "not a cause"), "expectation_theory_verdict" ("cause" or "not a cause"), and "ordinary_judgment" ("cause" or "not a cause", meaning how you expect most people to judge the case before doing any theorizing); a field "differentiating_feature" (string) holding one sentence naming what actually distinguishes the three people; a field "removal_and_addition_test" (string) holding one or two sentences on what happens to each theory's verdict when the duty is stripped from everyone and when it is extended to everyone; a field "counterfactualist_rebuttal" (string) holding the strongest reply available to a defender of the counterfactual theory; and a field "bottom_line" (string) holding a single sentence on what the case shows about the relationship between the two theories.
reasoning: |-
  We are creating a thought experiment in a workplace or household setting with three people.
   The scenario: three people present, equally capable and aware, all must perform a preventive action to avoid harm.
   Each, individually, if they had acted (with others still inactive), would have prevented the harm -> each passes the counterfactual test for causing the harm by omission.
   Exactly one has an assigned duty (via role, contract, or explicit agreement). The other two are identical in every respect except for the duty assignment.
   Harm occurs because nobody acts.

   Scenario: In a modern office, three coworkers (Alex, Bailey, and Casey) are in a conference room preparing for an important client presentation. They have a shared laptop connected to a projector. The laptop battery is low and the power cord is plugged into an outlet that is controlled by a wall switch. All three notice the switch is off and know that if it remains off, the laptop will run out of battery and the presentation will be lost. Each of them is equally close to the switch and equally capable of flipping it on. The company's explicit policy, known to all, states that Alex (as the team lead) is responsible for ensuring the equipment is powered. However, no such duty is assigned to Bailey or Casey. All three assume someone else will do it, and the battery dies, causing the presentation to fail.

   Now, we break down:

   1. Counterfactual theory (plain):
      - For Alex: If Alex had flipped the switch (and Bailey and Casey still did not), the harm would not have occurred -> Alex's inaction is a cause.
      - For Bailey: If Bailey had flipped the switch (and Alex and Casey did not), the harm would not have occurred -> Bailey's inaction is a cause.
      - For Casey: Similarly, if Casey had acted alone, the harm would have been prevented -> Casey's inaction is a cause.
      - The counterfactual theory treats all three inactions as causes. It has no resources to treat them differently because the counterfactual condition (if they had acted, the harm would not have occurred) is true for each.

   2. Expectation theory (omission is a cause only when the outcome departs from what is normally expected given roles):
      - Alex: Had an assigned duty (team lead responsible for equipment). Therefore, the failure to act is a departure from what was expected -> Alex's inaction is a cause.
      - Bailey: No assigned duty. It was not expected of Bailey to flip the switch (even though they could have). The harm occurring without Bailey's action is not a departure from the norm -> Bailey's inaction is not a cause.
      - Casey: Similarly, no assigned duty -> inaction is not a cause.
      - The verdict differs from the counterfactual theory because the expectation theory uses the normative context (roles and expectations) to filter which omissions count as causes.

   3. Differentiating feature: The single feature is the assigned role or duty (via company policy) that applies only to Alex. It is not about skill, proximity, or counterfactual strength because all three are equal in these respects.

   4. Removal and addition tests:
      - If the assigned duty is stripped from everyone (so no one has a duty): 
          - Counterfactual theory: still says all three inactions are causes (each still passes the counterfactual test).
          - Expectation theory: now none has a duty, so none is expected to act? Then none of the inactions would be a cause by the expectation theory.
      - If the same duty is extended to all three (so each has an explicit duty to act):
          - Counterfactual theory: still all three are causes (counterfactual condition unchanged).
          - Expectation theory: now all three are expected to act, so all three inactions are causes.

   5. Counterfactualist rebuttal: The strongest move for a counterfactual theorist who wants to avoid the conclusion that all three equally caused the harm is to argue that we must consider the actual situation in which the three inactions occurred together. The counterfactual test is applied by holding fixed the other inactions. But the counterfactualist might instead consider a more complex counterfactual: what if we had a minimal change? They might say that the inactions are overdetermined and thus none is a cause? But note: in overdetermination where each is sufficient, we do not say none is a cause. Alternatively, they might appeal to the idea of "preemption" but this is symmetric. A better move: argue that causation by omission is not the same as positive causation and that we should only count the absence of the action that was required by duty. But this would be ad hoc without more. Another move: introduce a notion of "responsibility" or "duty" as a separate concept from causation, so that while all three inactions are causes, only Alex is to blame. This preserves the counterfactual theory of causation but allows for normative distinctions.

