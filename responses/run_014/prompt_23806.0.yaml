  ### Thought Experiment: The Overlooked Fire Drill Register  
  In a modern office, three employees—Taylor (the floor safety warden, appointed by company policy), Jordan, and Morgan—are the last to leave a department floor after a fire alarm test. All three see a critical step overlooked: the fire drill participation register remains unsecured on a desk, accessible to unauthorized personnel. Company protocol requires that this sensitive document be locked in a designated cabinet immediately after any drill. Taylor, Jordan, and Morgan are equidistant from the cabinet, equally familiar with the locking mechanism, and each knows the document contains private employee data. If any one of them had locked it (with the other two still inactive), a data breach would have been prevented. No one acts, and the document is stolen overnight, leading to identity theft incidents.  

  ---

  ### Analysis  
  1. **Counterfactual Theory**  
     - **Core Principle**: An omission causes harm if the harm would not have occurred had the person acted (holding others' inaction fixed).  
     - **Taylor**: If Taylor had locked the register (with Jordan and Morgan inactive), the theft would not have occurred. → **Cause**.  
     - **Jordan**: If Jordan had locked it (with Taylor and Morgan inactive), the theft would not have occurred. → **Cause**.  
     - **Morgan**: If Morgan had locked it (with Taylor and Jordan inactive), the theft would not have occurred. → **Cause**.  
     - **Resources for differentiation?** None. The theory treats all three identically because each passes the same counterfactual test.  

  2. **Expectation Theory**  
     - **Core Principle**: An omission causes harm only if the harm stems from a departure from what is normatively expected given the person’s role.  
     - **Taylor**: As the appointed safety warden, locking the register was Taylor’s explicit duty. Failing to act violated expected role-based norms. → **Cause**.  
     - **Jordan**: No assigned role or expectation to act. Jordan’s inaction aligns with typical expectations (employees aren’t default security enforcers). → **Not a cause**.  
     - **Morgan**: Identical to Jordan—no role-based expectation. → **Not a cause**.  
     - **Why verdicts differ?** The counterfactual theory ignores social roles; the expectation theory uses them to filter which omissions "count."  

  3. **Differentiating Feature**  
     - **The assigned duty** (Taylor’s formal safety warden role) is the sole separator. Confirmation:  
       - *Not skill*: All three are equally capable.  
       - *Not proximity*: All are equidistant from the cabinet.  
       - *Not counterfactual strength*: Each inaction identically enables harm (if any one acts, harm is prevented).  

  4. **Testing Modifications**  
     - **Duty stripped from everyone** (no one is safety warden):  
       - *Counterfactual theory*: All three inactions remain causes (unchanged counterfactuals).  
       - *Expectation theory*: No causes (no role creates expectations to act).  
     - **Duty extended to all three** (all are safety wardens):  
       - *Counterfactual theory*: All three inactions remain causes.  
       - *Expectation theory*: All three are causes (each violated role-based expectations).  

  5. **Counterfactualist Rebuttal**  
     - **Strongest move**: Argue that causation is distinct from responsibility. All three inactions are equally *causes* (per counterfactual dependence), but only Taylor is *blameworthy* due to the duty. This preserves the theory’s core while delegating role-based distinctions to moral/legal assessments.  

