     counterfactualist_rebuttal: "The defender of the counterfactual theory can argue that causation is distinct from responsibility: all three inactions are equally causes of the harm, but only Alex is morally or professionally responsible due to the assigned duty."
     bottom_line: "The case shows that the counterfactual theory and the expectation theory yield different verdicts on omissions, and the key difference is that the expectation theory incorporates normative expectations from social roles, while the counterfactual theory does not."

