  The cake analogy might help here - genes are the recipe but environment provides the ingredients. In the uniform suburb, differences come mostly from genetic variation because everyone has similar "ingredients." In the poor district, many lack basic ingredients (nutrition, books, etc.), so giving those would make a huge difference regardless of genetic recipe quality.

  I should also clarify that heritability applies to population variation, not individual fixity. No child has "70% fixed" reading ability - we're talking about what explains differences between kids in that specific setting. The user seems to be personalizing a population statistic.

