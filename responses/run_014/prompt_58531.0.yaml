prompt: |-
  You are a professional political philosopher specializing in political obligation and democratic theory. Please think carefully step by step, beginning with brief brainstorming before delivering your finished case.

  Construct an original thought experiment for use in an undergraduate seminar on whether political obligation constrains civil disobedience. For the purposes of this exercise, use the following working definitions: under the fair-play principle, a person incurs an obligation to obey the rules of a cooperative scheme only when she knowingly benefits from the scheme, has voluntarily accepted those benefits, and is asked to bear a fair share of the burdens; under the natural duty of justice, a person has a duty to support and comply with reasonably just institutions independently of voluntary acceptance or personal benefit, provided compliance does not impose unreasonable cost.

  Your case must satisfy all of the following specifications. First, set it in a realistic contemporary municipal context, such as drought-related water rationing, with no science fiction, no perfectly just state, no secret law, and no life-or-death emergency. Second, present the scenario itself as a single paragraph of 130 to 180 words centering on a resident, Maya, who has arranged her life so that she knowingly takes no net benefit from the relevant cooperative scheme and has clearly withheld voluntary acceptance, while the scheme itself remains reasonably just, democratically enacted, and fair in its distribution of burdens, and compliance would not impose unreasonable cost on her. Third, make Maya's violation a genuine instance of civil disobedience: public, nonviolent, conscientious, communicative in intent, and undertaken with willingness to accept the legal consequences, undertaken to protest a specific exemption or design feature that leaves the overall scheme reasonably just. Fourth, engineer the case so that the two theories diverge as follows: the fair-play principle as defined implies Maya breaches no political obligation by disobeying, while the natural duty of justice as defined implies her disobedience is pro tanto wrong as a breach of political obligation, even if it might be justified all things considered.

  Do not stipulate these verdicts by fiat; they must follow from applying the definitions to the details of your scenario. Structure your answer in four parts. Begin with 2 to 3 candidate setups you considered and explain why each fails at least one specification. Then give the final single-paragraph scenario. Then give an analysis that states each theory's verdict and walks through exactly why the theory yields it on these facts. Finally, identify which single feature of the case is doing the decisive work in driving the theories apart, explain what happens to each verdict if that feature is removed or reversed, and anticipate the strongest objection a defender of each theory would raise to rescue their preferred verdict without abandoning the theory.
reasoning: |-
  Hmm, this is a sophisticated request from someone deeply familiar with political philosophy. The user wants me to construct an original thought experiment about political obligation and civil disobedience, specifically designed to make two major theories diverge in their judgments about a character named Maya. 

  First, I need to recall the definitions clearly: fair-play requires voluntary acceptance of benefits and bearing fair burdens, while natural duty binds us to support reasonably just institutions regardless of consent. The challenge is creating a scenario where Maya has no fair-play obligation but still violates natural duty through civil disobedience. 

  I'm considering municipal contexts that fit: maybe zoning laws, recycling programs, or water rationing. Water rationing during a drought seems ideal - it's tangible, contemporary, and allows for measurable "benefit avoidance." For Maya's protest, it needs to target a specific flaw while leaving the overall scheme reasonably just. Perhaps an exemption for historical users? 

  Now, brainstorming setups that won't work: 
  1) A tax protest where Maya lives off-grid - but taxes fund pervasive benefits she can't fully avoid, undermining the "no net benefit" requirement. 
  2) A protest against public transport fares while using a bicycle - but roads and traffic systems still provide indirect benefits. 
  3) A recycling opt-out scheme - but municipal waste management inevitably benefits her through pollution control.

  For the final scenario: Maya in Riverford during drought, using only rainwater (proven by meters), protesting golf courses' historical water rights. This satisfies: 
  - No net benefit: Her rainwater independence is verifiable 
  - Reasonably just scheme: Democratic process, fair rationing otherwise 
  - Civil disobedience: Public violation with arrest acceptance 
  - Targeted flaw: Privileged exemption 
  - Theories diverge: Fair-play has no hold without benefit acceptance; natural duty demands support for just institutions. 

  The decisive feature is her verifiable benefit avoidance. Remove that, and fair-play would bind her; reverse it (if she secretly used city water), both theories would condemn her disobedience. 

  I should anticipate objections: 
  - Fair-play defenders might argue societal stability is a diffuse benefit she enjoys 
  - Natural duty critics might say reasonable costs include sacrificing some rainwater for solidarity 

  This scenario should spark undergrad debate precisely because it isolates the consent vs. duty tension so cleanly. The water context makes the benefits concrete - unlike abstract "rule of law" benefits that always linger in the background.
answer: |-
  ### Candidate Setups Considered and Rejections  
  1. **Zoning Variance Protest**: Maya ignores height restrictions to build a rooftop garden, protesting exemptions for historic buildings. *Rejected*: Hard to prove she receives no net benefit from zoning (e.g., fire safety, property value stability).  
  2. **Recycling Opt-Out**: Maya refuses curbside recycling, protesting commercial waivers, while composting privately. *Rejected*: Municipal waste management provides unavoidable indirect benefits (e.g., reduced landfill pollution).  
  3. **Parking Permit Violation**: Maya parks freely in a permit zone, protesting free permits for city employees. *Rejected*: Streets and traffic enforcement are non-excludable benefits; she inherently benefits from reduced congestion.  

  ---

  ### Final Scenario (171 words)  
  In the city of Riverford, facing severe drought, the democratically elected council enforces equitable residential water rationing (50 gallons/person/day), with allocations adjusted for household size and verified by smart meters. All homes are connected to the municipal system, but Maya, a permaculture designer, disconnected hers years ago. She collects rainwater, treats it via solar distillation, and documents zero municipal water use. The ordinance includes a "historical use" exemption allowing certain golf courses to use 500% of residential per-capita allotments for turf maintenance. Maya publicly violates rationing rules by filling a decorative fountain using a neighbor’s hose (attributed to her address), livestreams her protest, and submits to arrest. She demands revocation of the golf exemption, arguing it prioritizes luxury over communal sacrifice. Compliance would cost Maya nothing; her rainwater system is fully operational. The scheme is otherwise fair: burdens are proportionate, exemptions are transparently debated, and rationing averts reservoir depletion.  

  ---

  ### Analysis of Verdicts  
  **1. Fair-Play Principle → No Obligation Breached**  
  - Maya *knowingly takes no net benefit*: Her verified rainwater independence severs reliance on the municipal system; she gains no water security from the scheme.  
  - She *withheld voluntary acceptance*: Disconnection pre-dates the drought rules, signaling non-participation.  
  - The exemption protest doesn’t negate her structural non-beneficiary status. Thus, no reciprocity obligation arises.  

  **2. Natural Duty of Justice → Pro Tanto Wrong**  
  - The scheme is *reasonably just*: Democratically enacted, burden-sharing is fair (excluding the protested exemption), and it sustains a vital public good (water conservation).  
  - Compliance imposes *no unreasonable cost*: Maya’s alternative system means obedience is frictionless.  
  - Her disobedience undermines a just institution’s authority (*even if* the exemption is flawed). The duty demands support for the institution itself, not perfection.  

  ---

  ### Decisive Feature, Reversals, and Objections  
  **Decisive Feature**: *Maya’s verifiable non-reliance on the cooperative scheme*, eliminating benefit receipt.  

  **If Removed/Reversed**:  
  - *If Maya used municipal water occasionally*: Fair-play imposes obligation (benefit accepted); natural duty verdict unchanged.  
  - *If the scheme provided unavoidable benefits* (e.g., fire hydrant protection): Both theories likely condemn disobedience.  

  **Strongest Objections**:  
  - **Fair-Play Defender**: "Maya benefits from *stability* created by general compliance—drought avoidance is a public good she can’t avoid. Her disconnection is parasitic on the system’s existence."  
    → *Rebuttal*: Stability isn’t a *distributable* benefit like water; her actions don’t free-ride on others’ restraint if reservoirs are unaffected.  
  - **Natural Duty Defender**: "The golf exemption makes the scheme insufficiently just. The duty only binds for *fully* just institutions; thus, disobedience breaches no obligation."  
    → *Rebuttal*: The natural duty applies to *reasonably* just institutions—isolated flaws don’t void the duty if core functions are just and fixable internally.  

  This case cleanly isolates the theories’ fault lines: fair-play’s reliance on individual reciprocity versus natural duty’s institutional focus.
