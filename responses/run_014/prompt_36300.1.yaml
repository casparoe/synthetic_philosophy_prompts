  ### Analysis of the Blackmail Case

  Your friend's track record indicates she uses a decision theory that accounts for correlations between her actions and external states, even in the absence of causal influence. This aligns with theories like **Evidential Decision Theory (EDT)** or **Updateless Decision Theory (UDT)/Timeless Decision Theory (TDT)**, both of which one-box in Newcomb's problem and cooperate in the twin Prisoner's Dilemma. However, these theories diverge in the blackmail scenario.

  #### Blackmail Scenario Setup Recap
  - The blackmailer sends the letter only if:
    - The house has termites and she predicts your friend won't pay, or
    - The house has no termites and she predicts your friend will pay.
  - The letter's arrival gives **no information** about termites (i.e., the probability of termites remains the prior probability \(p\)).
  - If your friend pays, she loses $100. If she doesn't pay and there are termites, she loses $1000; if no termites, she loses nothing.

  #### Candidate Decision Rules and Predictions
  Two rules fit her track record: **EDT** and **UDT/TDT**. They agree on her past decisions but disagree here.

  1. **Evidential Decision Theory (EDT)**:
     - Chooses actions that provide the best evidence for desirable outcomes.
     - **Prediction for Blackmail**: She **does not pay**.
       - Rationale: Paying is strong evidence that the house has no termites (since the letter is sent when either termites are present and she was predicted not to pay, or no termites and she was predicted to pay). If she pays, it suggests the blackmailer predicted payment, which occurs disproportionately when there are no termites. Not paying is evidence of termites, but the $1000 loss (if termites exist) is outweighed by the high probability of no termites given payment. EDT calculates:
         - Expected utility of paying: Always -$100.
         - Expected utility of not paying: \(-1000 \times P(\text{termites} \mid \text{pay}) \approx -1000 \times \text{low value}\) (since paying is evidence of no termites).
       - If she pays, it would signal (falsely) that termites are unlikely, but EDT ignores this and focuses on the correlation: paying is good news about the absence of termites, making it seem less necessary.

  2. **Updateless/Timeless Decision Theory (UDT/TDT)**:
     - Chooses a policy (rule) that maximizes expected utility across all possible instances, including those with identical reasoning processes (e.g., predictors, twins).
     - **Prediction for Blackmail**: She **pays**.
       - Rationale: She commits to the policy that, if adopted, makes the blackmailer's prediction align with minimizing her losses. By committing to "always pay," the blackmailer will rarely send the letter when there are termites (since "predict pay" + termites = no letter) and often when there are none. This reduces the incidence of the letter in termite-present scenarios. UDT/TDT calculates:
         - With policy "pay": Expected cost = \(P(\text{letter}) \times 100\).
         - With policy "don't pay": Expected cost = \(P(\text{letter} \mid \text{policy}) \times 1000 \times P(\text{termites} \mid \text{letter and policy})\).
       - Committing to "pay" leverages the predictor's reliability to avoid the worst outcomes, similar to one-boxing in Newcomb.

  **Which Rule Fits Her Track Record?**  
  Both fit, but UDT/TDT better explains her cooperation in the twin Prisoner's Dilemma (where logical dependence matters) and voting (where her ballot is part of a broader class of similar decisions). EDT handles Newcomb and voting but struggles with the twin dilemma's logical interdependence.

  **Bet Recommendation**: **UDT/TDT** is more consistent with her history. She cooperates with her twin because they share a decision rule, and she votes because her action is part of a large ensemble of similar voters—both emphasize logical dependencies across instances. UDT/TDT also robustly handles predictors, as in Newcomb.

