  ### Counterfactual Mugging and Smoking Lesion
  To discriminate between EDT and UDT/TDT, we use your queued cases:

  #### Case 1: Counterfactual Mugging
  - **Setup**: Omega flips a fair coin. If tails, Omega gives your friend $10,000. If heads, she must pay Omega $100. The coin lands heads.
  - **Predictions**:
    - **EDT**: She **does not pay**.  
      Paying provides evidence that the coin landed tails (since Omega would only ask for money if heads), but the coin is already heads. Paying $100 when she gains nothing is bad news with no upside.
    - **UDT/TDT**: She **pays**.  
      She commits to the policy "always pay if asked" to incentivize Omega to run the game. If she pays, Omega is more likely to run the game in the future (or in counterfactual branches), making her better off overall.
  - **Discriminatory Power**: **Strong**. UDT/TDT pays to uphold a policy that rewards cooperation across possible worlds, while EDT refuses as paying is bad news given the known outcome.

  #### Case 2: Smoking Lesion
  - **Setup**: Smoking doesn’t cause cancer, but a lesion causes both smoking and cancer. Your friend enjoys smoking.
  - **Predictions**:
    - **EDT**: She **does not smoke**.  
      Smoking is strong evidence of the lesion, which causes cancer. Even though smoking isn’t causal, the correlation makes smoking bad news.
    - **UDT/TDT**: She **smokes**.  
      The lesion is a fixed preexisting condition; smoking doesn’t cause cancer. Since she enjoys smoking, she does it, as her action has no causal effect on cancer.
  - **Discriminatory Power**: **Moderate**. Both theories might agree if she values enjoyment enough, but EDT typically avoids smoking due to correlation, while UDT/TDT ignores non-causal correlations.

  #### Recommended Discriminator: Counterfactual Mugging
  - **Why**: It cleanly separates the rules. 
    - EDT focuses on the current evidence (paying is bad news when heads is known). 
    - UDT/TDT focuses on global policy (paying maintains cooperation in counterfactuals).
  - **Outcome Interpretation**: 
    - If she pays, she likely follows UDT/TDT. 
    - If not, she likely follows EDT.
    
  **Alternative Case for Cleaner Discrimination**: **Transparent Newcomb**  
  - *Setup*: Omega shows your friend the contents of both boxes before she decides.  
  - *Predictions*:  
    - **EDT**: Two-boxes (seeing the money makes taking both boxes good news).  
    - **UDT/TDT**: One-boxes (commits to one-boxing to ensure Omega filled the opaque box richly).  
  - *Why better*: Removes ambiguity about "updates" and directly tests policy-based (UDT/TDT) vs. evidence-based (EDT) reasoning.

