answer: |-
  Below is a practical, step-by-step decision procedure for editors, grounded in linguistics research and designed for deadline use. It prioritizes harm reduction while respecting journalistic integrity, with clear off-ramps for human judgment. Theoretical foundations are distilled into operational rules.

  ---

  ### **Slur Handling Decision Procedure**  
  *(For Editorial Use Under Deadline)*  

  **Core Principle**:  
  Slurs harm via *semantic encoding* (the word itself carries hateful meaning) not just *pragmatic context* (speaker intent). This is why their sting persists in quotes/negation. The procedure identifies when the slur's *semantic harm* outweighs journalistic necessity.  

  **Required Inputs**:  
  1. The sentence containing the contested word  
  2. Speaker identity (who used it originally?)  
  3. Context of utterance (quote, report, analysis, etc.)  
  4. Audience impact assessment (see Step 5)  

  ---

  #### **STEP 1: IS THE WORD A SLUR?**  
  - **Check**: Does the word *historically target* a marginalized group based on race, sexuality, religion, disability, or identity? Is it widely recognized as a slur today? (Consult trusted references: Anti-Defamation League, NAACP, GLAAD glossaries.)  
  - **Sufficient Answer**: YES → Proceed to Step 2.  
    NO → Use standard profanity guidelines (e.g., "damn" may be printable).  
  - **Misfire Warning**: Some reclaimed terms (e.g., queer) may be ambiguous. When in doubt, proceed to Step 2.  

  #### **STEP 2: IS THE WORD BEING *USED* OR *MENTIONED*?**  
  - **Check**:  
    - **USING** = Deploying the slur to insult, refer to people, or express hate (e.g., "Those [slur] are criminals").  
    - **MENTIONING** = Referring to the word *as a word* (e.g., "He called them [slur]," "The term [slur] originated...").  
  - **Sufficient Answer**:  
    - USING → **MASK IT** (e.g., "[slur]"). Proceed to Step 4 ONLY if reporting newsworthy use (e.g., public figure).  
    - MENTIONING → Proceed to Step 3.  
  - **Misfire Warning**: Academic/archival contexts often "mention," but harm can persist.  

  #### **STEP 3: IS MENTIONING *JOURNALISTICALLY NECESSARY*?**  
  - **Check**: Is printing the full slur required to:  
    - Report the news accurately (e.g., a public figure's exact words)?  
    - Provide critical analysis (e.g., linguistic study)?  
    - Honor a subject's reclaimed identity (e.g., activist's self-reference)?  
  - **Sufficient Answer**:  
    - YES → Proceed to Step 4.  
    - NO → **PARAPHRASE** (e.g., "racial slur," "anti-gay epithet"). STOP.  
  - **Misfire Warning**: "Necessity" is subjective. When uncertain, default to paraphrase.  

  #### **STEP 4: CAN HARM BE MITIGATED BY CONTEXT?**  
  - **Check**:  
    - Is the speaker a member of the targeted group *reclaiming* the term?  
    - Is the audience *specialized* (e.g., academic readers) with clear contextual signals?  
    - Is the word *archival/historical* (pre-1950)?  
  - **Sufficient Answer**:  
    - RECLAIMED USE (by in-group speaker) → **RUN VERBATIM** with explanation. STOP.  
    - ACADEMIC/HISTORICAL MENTION → Proceed to Step 5.  
    - ALL OTHER CASES → **MASK IT**. STOP.  
  - **Misfire Warning**: Reclamation is contested within communities. Mask if uneasy.  

  #### **STEP 5: HUMAN JUDGMENT – AUDIENCE HARM ASSESSMENT**  
  - **Check with Standards Desk**:  
    - Could printing the slur:  
      a) Retraumatize vulnerable readers?  
      b) Be weaponized by bad actors?  
      c) Overshadow the journalistic purpose?  
  - **Sufficient Answer**:  
    - LOW RISK → **RUN VERBATIM** with contextual framing (explain why it's printed).  
    - HIGH RISK → **MASK OR PARAPHRASE** even if historically/academically "valid."  
  - **Final Authority**: Standards Editor weighs journalistic value vs. reader harm.  
  - **Misfire Warning**: No linguistic theory can prevent individual trauma. Err on caution.  

  ---

  ### **Procedure Limitations**  
  1. **Cannot Neutralize Trauma**: Seeing the word may harm readers *regardless* of context or intent. Semantics describes *how* slurs offend, but not how to eliminate pain.  
  2. **Cannot Resolve Reclamation Debates**: Some argue reclaimed slurs empower; others see them as harmful. The procedure prioritizes speaker agency (Step 4) but defers to safety (Step 5).  
  3. **Fails on "Borderline" Terms**: Words with shifting status (e.g., "cripple") require cultural consultation.  
  4. **No Immunity for Academia**: Scientific mention (Case 4) still risks harm if readers encounter it unexpectedly.  

  ---

  ### **Case Applications**  
  **CASE 1: Legislator on Hot Mic**  
  - Step 1: Slur (YES).  
  - Step 2: Using (YES) → Mask UNLESS newsworthy.  
  - Step 3: Newsworthiness (YES: public figure's bigotry) → Proceed.  
  - Step 4: Not reclaimed/historical → **MASK** (e.g., "[n-word]"). News value preserved without gratuitous harm.  

  **CASE 2: Activist Self-Reference**  
  - Step 1: Slur (YES).  
  - Step 2: Using, BUT speaker is in-group → Proceed to Step 3.  
  - Step 3: Necessary to honor identity (YES) → Proceed.  
  - Step 4: Reclaimed use → **RUN VERBATIM** + brief context: "Smith, who reclaims the slur used against him..."  
  - Step 5: Flag for sensitivity read by LGBTQ+ staff.  

  **CASE 3: 19th-Century Travel Writer**  
  - Step 1: Slur (YES).  
  - Step 2: Mentioning (historical source) → Proceed to Step 3.  
  - Step 3: Necessary for historical accuracy? (YES, per your instinct) → Proceed.  
  - Step 4: Historical mention → Proceed to Step 5.  
  - Step 5: **HIGH RISK** – Archival slurs can perpetuate stereotypes. **PARAPHRASE** (e.g., "using a racial slur for Indigenous people") or mask. *Your instinct conflicts with harm prevention; historical truth doesn't require reproducing slurs for general audiences.*  

  **CASE 4: Cognitive Science Study**  
  - Step 1: Slur (YES).  
  - Step 2: Mentioning (academic stimulus) → Proceed to Step 3.  
  - Step 3: Necessary for methodology? (YES: stimulus wording is data) → Proceed.  
  - Step 4: Academic mention → Proceed to Step 5.  
  - Step 5: **LOW RISK** with framing → **RUN VERBATIM** but:  
    - Preface with content warning.  
    - Use small caps or quotes (e.g., `the slur "-----" was used in trials`).  

  ---

  ### **Key Takeaways**  
  - **Semantics vs. Pragmatics**: Slurs harm semantically (they encode bigotry), so mention ≠ safety. Pragmatic cues (tone, intent) don't neutralize them.  
  - **When Theory Ends**: Linguistics can identify *why* slurs resist embedding, but not whether to print them. Steps 4–5 handle what theory cannot: lived trauma and editorial duty of care.  
  - **Your Confession**: The travel writer case fails Step 5. Printing historical slurs without urgent need risks harm > educational value. Paraphrasing isn't "lying"; it's contextualizing.  

  **Final Output**: A laminated flowchart with this procedure, paired with training on Step 5 (harm assessment). Update every 6 months with community feedback.
