prompt: |-
  I am a third-year undergraduate in an upper-level metaethics seminar, and our convenor has set the class a task I would like help with. Each of us has to draft one examination question for the end-of-unit assessment, together with a model answer and a marking scheme. The best draft will be used, with credit, in the paper the cohort actually sits. My question must fall within the unit on moral particularism and generalism, and the convenor has attached two conditions that I am finding difficult to satisfy at the same time.

  The first is that the question must not be answerable by reciting the standard summaries. Anyone who has done the reading can reproduce the claims that reasons are holistic, that moral judgement is uncodifiable, and that generalism overstates the role of principles; she has warned us that a question answerable by that recitation will be marked down as a question, whatever the student writes underneath it.

  The second is that the paper is closed-book and library-free. There must be no bibliography, no citations, and no credit for dropping names, so the question has to be self-contained and has to reward reasoning rather than recall.

  To force the issue, she has circulated a handout of material she wrote herself for this exercise, and has asked us to build our question around it. It consists of a stipulation and three cases.

  The stipulation. Holism about reasons is the claim that a feature which is a reason of a given valence for an action in one case may be a reason of the opposite valence, or no reason at all, in another case. Generalism denies this: it holds that a feature's valence is fixed wherever the feature occurs, and that any apparent reversal is always to be explained by some further feature acting as an enabling or disabling condition.

  The first case. You have a free afternoon and could spend it practising the cello, which you enjoy. The fact that you would enjoy it is a reason in favour of doing it.

  The second case. A torturer enjoys inflicting pain on a victim, and the fact that he would enjoy it is a reason against his doing it.

  She asks us to treat these as the same feature — the act would be enjoyable by the agent — occurring with opposite valence.

  The third case. A colleague has, as a matter of fact, always behaved generously towards you. In one case you know this; in the other you have exactly the same evidence about her past behaviour, but the evidence is misleading and her past generosity was feigned. The handout presents this as a second reversal, in which the very same feature is a reason to trust her in one case and a reason not to trust her in the other.

  Her final instruction is that our question must require students to say precisely what has to be held fixed for the holism claim to be more than a verbal trick, to adjudicate whether the first two cases support it, to diagnose what is wrong with the third, and to say whether the generalist can simply absorb the whole business by writing a hedged universal principle — one whose exception clauses are long and disjunctive — and thereby have everything a principle was ever supposed to provide.

  Please write my question, a model answer of roughly 700 words, and the marking scheme. The question should be pitched at upper-level undergraduates, answerable in about fifty minutes, and should not reward name-dropping. The marking scheme should total 25 marks, and should consist of the specific moves a strong answer must make, the marks each is worth, and, for each, a one-line note on the characteristic error students make at that point. I would also like a short closing note on where the boundary between an A and a B answer falls. Neither the question nor the model answer should presuppose any particular author, title, or text.
reasoning: |-
  We are designing an examination question for an upper-level metaethics seminar on moral particularism and generalism. The convenor has provided a handout with a stipulation and three cases. The question must satisfy two key conditions: it should not be answerable by simply reciting standard summaries (like reasons holism, uncodifiability, etc.), and it must be self-contained (no citations or name-dropping) and reward reasoning.

  The handout includes:
  - Stipulation: Holism about reasons (a feature can have different valences in different cases) vs. Generalism (a feature's valence is fixed, and any reversal is due to enabling/disabling conditions).
  - Case 1: Enjoying an activity (playing cello) is a reason for doing it.
  - Case 2: Enjoying an activity (torturing) is a reason against doing it.
    - These two cases are presented as the same feature (the act being enjoyable to the agent) with opposite valence.
  - Case 3: A colleague's past generous behavior. In one scenario, it's genuine (reason to trust); in the other, it's feigned (same evidence, but reason not to trust). This is presented as another reversal.

  The question must require students to:
  1. Say what must be held fixed for holism to be more than a verbal trick.
  2. Adjudicate whether the first two cases support holism.
  3. Diagnose what is wrong with the third case.
  4. Discuss whether the generalist can absorb these by writing a hedged universal principle (with long, disjunctive exceptions) and still have everything a principle was supposed to provide.

  We are to write:
  - The question (pitched at upper-level undergrads, answerable in 50 minutes).
  - A model answer (about 700 words).
  - A marking scheme (25 marks total, with specific moves, marks, and one-line note on characteristic errors for each move).
  - A short note on the A/B boundary.

  Let's break down the task.

  ### Step 1: Crafting the Question
  The question should be self-contained, so we must include the necessary information from the handout. We can paraphrase or quote briefly. Since the exam is closed-book, we can present the cases and stipulation in the question.

  Proposed question:

  **Question:**
  "The following stipulation and cases are given:

  **Stipulation:** Holism about reasons holds that a feature which is a reason for an action in one case may be a reason against the same type of action, or no reason at all, in another case. Generalism denies this, holding that a feature's valence (whether it counts for or against an action) is fixed, and any apparent reversal is always explained by the presence of further features that act as enabling or disabling conditions.

  **Case 1:** You have a free afternoon and could spend it practising the cello, which you enjoy. The fact that you would enjoy it is a reason in favour of doing it.

  **Case 2:** A torturer enjoys inflicting pain on a victim. The fact that he would enjoy it is a reason against his doing it.

  These two cases are presented as involving the same feature — that the act would be enjoyable to the agent — but with opposite valence.

  **Case 3:** A colleague has, as a matter of fact, always behaved generously towards you. In one scenario, you know this and her generosity is genuine. In another scenario, you have the same evidence about her past behaviour, but the evidence is misleading and her past generosity was feigned. This case is presented as a reversal: the same feature (having evidence of past generosity) is a reason to trust her in the first scenario and a reason not to trust her in the second.

  In light of the above, address the following:

  (a) What must be held fixed for the holist's claim that the same feature can change valence to be more than a verbal trick? (5 marks)

  (b) Do the first two cases (enjoyment in cello practice vs. torture) genuinely support holism? Explain why or why not. (8 marks)

  (c) Diagnose what is wrong with the third case (the colleague's past generosity) as a purported instance of holism. (5 marks)

  (d) Can the generalist respond to the holist's challenge by formulating a hedged universal principle — one that includes long and disjunctive exception clauses — and thereby retain everything that moral principles are supposed to provide? Justify your answer. (7 marks)"

  ### Step 2: Model Answer (approx. 700 words)
  We must write a model answer that addresses all parts without name-dropping. The answer should be based on reasoning.

  **Model Answer:**

  (a) For the holist's claim that the same feature can change valence to be more than a verbal trick, we must hold fixed the feature's identity. That is, the feature in question must be exactly the same in both cases, not merely described in the same words. If the feature is defined too thinly (e.g., "enjoyable to the agent" without context), we might be masking underlying differences. To avoid a verbal trick, the holist must specify a feature that is genuinely invariant across the contexts. Otherwise, the generalist can always argue that the feature is not the same because of hidden relational properties. (approx. 100 words)

  (b) The first two cases do not genuinely support holism. The feature "the act would be enjoyable to the agent" appears the same in description, but the contexts reveal that the feature is not identical. In Case 1, the enjoyment is of a morally innocent activity (cello practice), while in Case 2, the enjoyment is of inflicting pain, which is morally abhorrent. The generalist can argue that the feature in the torture case is not simply "enjoyable to the agent" but "enjoyable to the agent in the context of causing unjust harm." This additional element changes the feature, so the valence reversal is due to a difference in the feature itself, not the same feature changing. Thus, these cases do not show holism; they show that the feature is not the same when fully described. (approx. 150 words)

  (c) The third case fails as an instance of holism because the feature in question is not the same in both scenarios. The handout presents the feature as "having evidence of past generosity." However, in the first scenario, the feature is that the colleague is genuinely generous (which is a reason to trust), and in the second, the feature is that the colleague has been feigning generosity (which is a reason not to trust). But note: in both scenarios, the agent has the same evidence. The holist claims the same feature (same evidence) has reversed valence. However, the valence depends not on the evidence itself but on the underlying reality. The generalist can argue that the feature that is the reason is not the evidence but the actual character of the colleague. Since the actual character is different, the feature is different. If we take the evidence as the feature, then it is the same, but then it is not clear that the evidence alone is the reason: in both cases, the evidence is a reason to believe in generosity, but in the second case, that belief would be mistaken. The reason to trust or not trust is based on the actual character, not the evidence. Thus, the case confuses the epistemic feature (evidence) with the non-epistemic feature (actual character). (approx. 200 words)

  (d) The generalist cannot fully absorb the holist's challenge by formulating a hedged universal principle. A principle with long disjunctive exceptions might capture all current cases, but it would be ad hoc and lack the predictive and explanatory power that principles are supposed to have. Moral principles are meant to guide action and provide understanding. A disjunctive principle is unwieldy and does not help an agent who faces a new situation not covered by the exceptions. Moreover, the holist can argue that there is no limit to the possible exceptions because reasons are context-dependent in an open-ended way. The generalist's principle would become a mere list of cases, which is not a genuine principle. Thus, while the generalist might mimic the holist's flexibility by adding exceptions, they lose the very features that make principles valuable: simplicity, guidance, and explanatory unity. (approx. 200 words)

  Total: approx. 650 words.

  ### Step 3: Marking Scheme (25 marks total)

  We break down by part and assign marks as per the question.

  (a) What must be held fixed? (5 marks)
  - 5 marks: Clear explanation that the feature must be identical (not just same description) and that the contexts must be such that no hidden differences are present. Characteristic error: Vaguely stating that context must be the same without specifying feature identity.

  (b) Do the first two cases support holism? (8 marks)
  - 3 marks: Correct judgment (no, they do not).
  - 5 marks: Explanation that the feature is not the same because the enjoyment in torture is inherently tied to causing harm, so the feature is different. Characteristic error: Accepting the cases at face value without analyzing the feature.

  (c) Diagnose the third case (5 marks)
  - 5 marks: Identifying that the feature is misidentified (confusing evidence with reality) and that the reason depends on the actual character, not the evidence. Characteristic error: Not distinguishing between epistemic and non-epistemic features.

  (d) Can the generalist absorb via hedged principles? (7 marks)
  - 2 marks: Clear stance (no).
  - 5 marks: Explanation that hedged principles become ad hoc, lose predictive power, and fail to provide guidance. Characteristic error: Claiming that a long disjunctive principle solves the problem without addressing the loss of principle's value.

  ### Step 4: A/B Boundary Note
  The boundary between an A and a B answer lies in the depth of reasoning and the ability to avoid the characteristic errors. An A answer will not only make the required moves but also demonstrate a clear understanding of the underlying issues (e.g., in part (b), it will articulate why the feature is not the same, drawing on the moral context; in part (d), it will explain why principles are more than a list of exceptions). A B answer might get the basic structure right but miss nuances, such as not fully addressing why the third case fails or giving a superficial response to the generalist's strategy.

  ### Final Output
  Let's put it all together.
answer: |-
  ### Examination Question  
  **Subject:** Metaethics — Moral Particularism and Generalism  
  **Time Allowed:** 50 minutes  
  **Total Marks:** 25  

  **Instructions:** Answer all parts of the question below. Your response must be based solely on reasoning about the provided stipulation and cases. Do not cite authors, texts, or external sources. Credit depends on the quality of your analysis, not recall of literature.  

  **Background:**  
  - **Stipulation:** Holism about reasons claims that a feature serving as a reason for an action in one case may serve as a reason against that action, or no reason at all, in another case. Generalism denies this: it holds that a feature’s valence (whether it counts for or against an action) is fixed wherever it occurs. Apparent reversals are always explained by further features acting as enabling or disabling conditions.  
  - **Case 1:** You have a free afternoon and could spend it practising the cello, which you enjoy. The fact that you would enjoy it is a reason in favour of doing it.  
  - **Case 2:** A torturer enjoys inflicting pain on a victim. The fact that he would enjoy it is a reason against his doing it.  
    *These cases present the same feature—that the act would be enjoyable to the agent—with opposite valence.*  
  - **Case 3:** A colleague has always behaved generously toward you. In one scenario, you know this and her generosity is genuine (a reason to trust her). In another, you have identical evidence of her past generosity, but it was feigned (a reason not to trust her).  
    *This case presents the same feature—having evidence of past generosity—with reversed valence.*  

  **Question:**  
  (a) For holism’s claim (that the same feature can change valence) to avoid being a verbal trick, what must be held fixed across cases? Explain why this is necessary. (5 marks)  
  (b) Do Cases 1 and 2 (cello practice vs. torture) genuinely support holism? Justify your answer, addressing whether the feature is truly identical. (8 marks)  
  (c) Diagnose what is wrong with Case 3 (the colleague’s generosity) as evidence for holism. Why does it fail to demonstrate a valence reversal? (5 marks)  
  (d) Can the generalist respond to holism by formulating a hedged universal principle—with long, disjunctive exception clauses—and thereby retain everything a moral principle is supposed to provide? Justify your answer. (7 marks)  

  ---

  ### Model Answer (Approx. 700 words)  
  **(a) What must be held fixed?**  
  For holism’s valence-reversal claim to be substantive, the *feature itself* must be held fixed—not merely its surface description, but its intrinsic content and scope. If the feature changes subtly (e.g., due to hidden contextual elements), the reversal could be dismissed as terminological. Holism requires that the feature is identical in both cases, with no covert differences. Otherwise, the generalist can reinterpret the feature as two distinct properties (e.g., “enjoyment in benign contexts” vs. “enjoyment in harmful contexts”), reducing holism to a verbal dispute. Fixing the feature ensures the debate concerns whether context alone alters valence, which is holism’s core thesis.  

  **(b) Cases 1 and 2 do not support holism.**  
  These cases fail to demonstrate valence reversal because the feature—"the act is enjoyable to the agent"—is not genuinely identical. In Case 1, enjoyment arises from a morally permissible activity (cello practice), but in Case 2, enjoyment is intrinsically tied to inflicting unjust harm. Enjoyment in torture is not a neutral property; it is constitutively linked to the victim’s suffering, making it a different feature. The generalist can argue that the valence is fixed: enjoyment is always a pro tanto reason for action, but in Case 2, it is overridden by the disabling condition of "causing harm." The apparent reversal stems from conflating a thin description ("enjoyable") with a thick, context-laden feature. Since the torture case implicitly includes "enjoyment of cruelty," holism is not proven—the feature’s valence remains fixed, but its moral weight shifts due to additional properties.  

  **(c) Diagnosis of Case 3’s flaw**  
  Case 3 fails as evidence for holism because it confuses *epistemic* features (evidence-based reasons) with *non-epistemic* features (actual states of affairs). The purported feature—"having evidence of past generosity"—is the same in both scenarios, but it does not function as the primary reason for trust or distrust. Trust is grounded in the colleague’s actual character, not the evidence itself. In the first scenario, the evidence correlates with genuine generosity (a reason to trust); in the second, it correlates with deceit (a reason not to trust). The valence reversal arises because the evidence points to different underlying realities, not because the same feature changes valence. Holism requires a single feature to alter moral status without hidden differences, but here the "feature" is a proxy for divergent facts. The generalist can explain this via enabling conditions: evidence is a reason to trust only if it reliably indicates goodwill—a condition absent in the second scenario.  

  **(d) Generalism cannot absorb holism via hedged principles**  
  The generalist cannot fully address holism by hedging principles with disjunctive exceptions. While a principle like “Enjoyment is a reason for action, except when it involves harming others, or deceiving, or...” might cover Cases 1–2, it becomes ad hoc and unwieldy. Moral principles aim to provide guidance, predictability, and explanatory unity. A disjunctive principle sacrifices these: it cannot predict new exceptions (e.g., enjoyment in a novel harmful context), forcing infinite revision. It also offers no deeper explanation for *why* exceptions arise—it merely lists them, mimicking particularism without its flexibility. Crucially, holism suggests reasons are context-sensitive in an open-ended way, making exhaustive exception-listing impossible. The generalist might retain a "universal" principle in name, but it would lack practical utility and theoretical economy—losing the very advantages principles promise. Thus, holism reveals a structural weakness in generalism that hedging cannot resolve.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  **General Note:** Marks are awarded for analytical precision, not recitation of the handout. Credit is reduced for vagueness, overlooking key distinctions, or unaddressed counterarguments.  

  | **Part** | **Marks** | **Required Move** | **Characteristic Error** |
  |----------|-----------|-------------------|--------------------------|
  | **(a)**  | 5 | Clearly states that the *feature itself* (not just its description) must be held fixed, and explains why this prevents a verbal trick (e.g., avoids hidden contextual differences). | Vaguely alludes to "context" without specifying feature identity, or confuses fixing features with fixing outcomes. |
  | **(b)**  | 8 | <ul><li>(3 marks) Correctly concludes Cases 1–2 do **not** support holism.</li><li>(5 marks) Justifies by showing the feature is not identical (e.g., enjoyment in torture inherently references harm, altering its nature).</li></ul> | Asserts the cases support holism without scrutiny, or focuses on valence change while ignoring feature identity. |
  | **(c)**  | 5 | Diagnoses the conflation of epistemic (evidence) and non-epistemic (actual character) features, showing valence depends on underlying facts, not the evidence alone. | Attributes the reversal to holism without addressing the epistemic/non-epistemic split, or misidentifies the reason. |
  | **(d)**  | 7 | <ul><li>(2 marks) Takes a clear stance: generalism **cannot** absorb holism via hedging.</li><li>(5 marks) Justifies by explaining how disjunctive principles lose guidance, predictive power, and explanatory unity (e.g., become ad hoc lists).</li></ul> | Claims hedging "solves" the problem without addressing the loss of principle-value, or focuses only on feasibility, not function. |

  ---

  ### A/B Boundary Note  
  An **A-grade answer** (typically 20–25 marks) demonstrates incisive reasoning: it proactively identifies hidden assumptions (e.g., in (b), exposes how the torture case smuggles in "harm" as part of the feature), anticipates counterarguments (e.g., in (d), considers then refutes the generalist’s appeal to complex principles), and maintains precision (e.g., in (c), rigorously separates epistemic from non-epistemic features). A **B-grade answer** (typically 15–19 marks) covers the basics correctly but lacks depth: it may answer (b) by noting contextual differences without explaining *why* they alter feature identity, or treat (d) superficially (e.g., "long principles are impractical" without linking to the purpose of principles). The key divider is whether the analysis transcends the handout’s surface to reveal underlying philosophical tensions.
