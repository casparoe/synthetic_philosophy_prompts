answer: |-
  Quine's argument for the indeterminacy of translation aims to establish the **stronger ontological claim** (there is no fact of the matter about reference/meaning), not merely the weaker epistemological claim (evidence underdetermines translation). Here's how the argument works, why Quine moves beyond underdetermination, and how he responds to objections:

  ### 1. **The Core Argument & Why It Targets Ontology**
     - **Behaviorism as Exhaustive**: Quine's foundational premise is that *all facts about linguistic meaning are constituted by dispositions to observable behavior in publicly observable circumstances*. Meaning isn't a hidden mental entity; it's entirely defined by how speakers respond to sensory stimuli (stimulus meaning).
     - **Gavagai's Deeper Lesson**: The "gavagai" rabbit example isn't just about ambiguity ("rabbit" vs. "undetached rabbit part" vs. "rabbithood"). It demonstrates that:
       - All behavioral evidence (assent/dissent to "Gavagai?" in response to rabbit-presentations) is *identical* for these rival translations.
       - No *further behavioral test* can distinguish them. Asking "Is this gavagai the same as that one?" presupposes translation of "same" (which is also indeterminate!).
     - **Holism & the Web of Belief**: Meaning depends on the entire network of sentences a speaker accepts (their "web of belief"). Translation requires mapping this holistically. However, multiple mappings are possible:
       - Preserve stimulus meanings of observation sentences ("Gavagai" = rabbit-present).
       - Systematically adjust translations of theoretical terms ("identity," "object") to compensate elsewhere (e.g., translating "same" oddly to accommodate "gavagai" as rabbit-stage).
     - **The Radical Move**: Since behavior fixes *all* the facts about meaning (per behaviorism), and behavior is compatible with multiple, *mutually incompatible* translation manuals (e.g., one positing rabbits, another rabbit-stages), **there is no fact of the matter** about which manual is correct. It’s not that we lack evidence; it’s that *there’s nothing for the evidence to be evidence of* beyond the behavior itself. Reference is radically relative to the manual.

  ### 2. **Distinguishing Indeterminacy from Underdetermination**
     - **Underdetermination (Epistemic)**: Many scientific theories (e.g., quantum mechanics) are underdetermined by evidence. We acknowledge that one theory *could* be uniquely true, but we lack sufficient evidence to know which.
     - **Indeterminacy (Ontological)**: Translation is *not* like this. There is no "true meaning" or "true reference" lurking beyond behavior. Behavior exhausts meaning. Thus, incompatible manuals aren't rivals for describing a hidden reality; they are *equally valid descriptions* of the *only* reality there is (behavioral dispositions). Quine's analogy: It's like asking which set-theoretic reduction of numbers (von Neumann ordinals vs. Zermelo's) is "really true." Neither is; it's a matter of pragmatic choice.

  ### 3. **Objections & Quine's Responses**
     - **Objection 1: Question-Begging (Assumes Behaviorism)**:
       - *Critic*: Quine assumes behaviorism to prove indeterminacy, but behaviorism is contentious. If meaning involves private mental states or semantic primitives, indeterminacy vanishes.
       - **Quine's Response**: Behaviorism isn't an *assumption*; it's a *consequence* of naturalism. Science studies intersubjectively accessible evidence. Private mental states are irrelevant to meaning because they can't be verified or play a role in public communication. To posit them is unscientific ("myth of the museum"). Naturalism demands we ground meaning in what is observable: behavior.
     - **Objection 2: Indeterminacy is Relative to Behaviorist Semantics**:
       - *Critic*: Indeterminacy only follows if you *define* meaning behaviorally. If meaning is something else (e.g., Platonic form, brain state, causal relation), indeterminacy doesn't hold.
       - **Quine's Response**: This misses the point. Naturalism compels us to accept that the *only scientifically respectable notion of meaning* is behavioral. Alternative "meanings" are either:
         * Unscientific (Platonism, private mentalism).
         * Reducible to behavior (brain states only matter insofar as they cause dispositions).
         * Themselves indeterminate (causal theories of reference succumb to proxy-function arguments - see below).
       - **Proxy Functions**: Quine argues that *even within physics*, reference is indeterminate. Take any ontology (e.g., containing rabbits). You can systematically redefine reference (e.g., map "rabbit" to the *cosmic complement* of a rabbit – the entire universe minus that rabbit). All sentences about rabbits can be reinterpreted as sentences about cosmic complements without changing their truth values. Physics can't fix reference uniquely. **If physics can't fix reference, semantics certainly can't.** This strengthens the ontological claim.

  ### 4. **The Stakes: Epistemic vs. Ontological Reading**
     - **Epistemic (Weaker Claim)**: Meaning/reference is real but unknowable beyond behavioral constraints. Realism about meaning survives.
     - **Ontological (Stronger Claim - Quine's)**: Meaning/reference *itself* is not a real, determinate relation in the world. It's a pragmatic tool relative to a chosen manual. Realism about meaning is false.
     - **Why Quine Insists on Stronger Claim**: His behaviorism + holism + naturalism entail that meaning is *nothing over and above* dispositions to behavior under stimulus conditions. Since these dispositions don't determine a unique translation, there's no further fact. The "stake" is the very existence of meaning as an objective, determinate property of words.

  **In essence**: Quine argues that the behaviorist thesis (meaning = stimulus meaning/dispositions) is mandated by naturalism. Gavagai/holism shows this behavioral basis is insufficient to uniquely determine reference. Therefore, reference is indeterminate *by its very nature* – not just unknown. Objections appealing to non-behavioral meaning are rejected as non-naturalistic. The indeterminacy is thus ontological, marking a profound limitation on the reality of semantic facts, not just our knowledge of them.
