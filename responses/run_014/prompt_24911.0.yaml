answer: |-
  ## Joint Statement: Intellectualist/Anti-Intellectualist Adversarial Collaboration on Knowledge-How

  **Preamble:** We, an intellectualist and an anti-intellectualist, acknowledge the persistent debate concerning the nature of knowledge-how. While fundamental disagreements remain, we agree on several key points about the phenomena, arguments, and requirements for an adequate account. This statement clarifies common ground, precisely locates disagreements, identifies crucial tests, and assesses potential verbal elements.

  ### 1. Agreed Claims (Both Sides Endorse)

      1.  **The Phenomena Require Explanation:** Skilled, flexible, intentional action (e.g., riding a bike, speaking a language fluently, playing chess expertly) involves a cognitive achievement distinct from mere physical ability or luck. Attributing "knowledge-how" captures this achievement.
      2.  **Dissociation Evidence is Evidential:** Cases like amnesiac performers (e.g., HM playing mazes) or experts acting unreflectively demonstrate that the cognitive states guiding successful action can dissociate from the ability to verbally articulate propositions describing that action. This dissociation requires explanation but does not, *by itself*, definitively settle the ontology of knowledge-how.
      3.  **Ryle's Regress Raises a Serious Challenge:** Ryle's argument highlights a potential problem for any account that attempts to explain intelligent action *solely* in terms of the consultation or application of propositional knowledge. An adequate theory must either resolve the regress threat or explain why it is not applicable.
      4.  **Linguistic Data is Ambiguous:** While the surface syntax of knowledge-how ascriptions (e.g., "knows how to φ") resembles embedded question constructions ("knows where/when/why to φ"), this linguistic parallel does not *determine* the underlying metaphysics of the knowledge state. It provides evidence but is not decisive.
      5.  **Over-Intellectualization is a Genuine Risk:** Attributing explicit, occurrent propositional attitudes to agents during the execution of all skilled performances is implausible and misdescribes the phenomenology and cognitive architecture of fluid expertise. Any account must avoid this.
      6.  **Propositional Knowledge is Often Involved:** Propositional knowledge (e.g., about goals, sub-goals, relevant facts) frequently plays a significant role in *acquiring*, *evaluating*, and sometimes *guiding* knowledge-how. An adequate account must accommodate this involvement.
      7.  **"Practical Mode of Presentation" is a Necessary Component for Intellectualism:** If knowledge-how is a species of knowledge-that, the "practical mode of presentation" (MoP) is not a trivial addition but an essential feature required to distinguish knowledge-how from merely knowing *that* a way is a way, and to capture its action-guiding role. An intellectualist theory lacking a robust account of the practical MoP fails.

  ### 2. Precise Disagreements Table

  | Point of Disagreement                                                                 | Intellectualist Position (Acceptable Wording)                                                                                                | Anti-Intellectualist Position (Acceptable Wording)                                                                                                   |
  | :------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Ontological Category of Knowledge-How:**                                         | Knowledge-how is a species of propositional knowledge (knowledge-that), specifically knowledge of an answer to the question "How can I φ?", under a practical mode of presentation. | Knowledge-how is a distinct, non-propositional type of cognitive state, fundamentally constituted by embodied capacities, dispositions, or abilities to perform actions. |
  | **2. Possibility of Reduction:**                                                      | Knowledge-how can be reductively analyzed as propositional knowledge (under a practical MoP) without succumbing to Ryle's regress; the practical MoP resolves the guidance/action problem. | Knowledge-how cannot be reductively analyzed as propositional knowledge; attempts at reduction inevitably succumb to Ryle's regress or fail to capture the constitutive role of dispositions in guiding action. |
  | **3. Explanatory Primacy in Skilled Action:**                                         | The successful execution of φ-ing by an agent S is ultimately explained (non-regressively) by S's possession of relevant propositional knowledge (under a practical MoP) about ways to φ. | The successful execution of φ-ing by an agent S is fundamentally explained by S's possession of non-propositional, embodied capacities/dispositions; propositional knowledge may play auxiliary roles but is not constitutive of the know-how itself nor sufficient for explaining the action. |
  | **4. Relationship to Ability:**                                                       | While distinct from mere physical ability, knowledge-how (as propositional knowledge under a practical MoP) is the cognitive state that, when combined with minimal ability and absence of defeaters, reliably manifests as the ability to φ. | Knowledge-how *is* (or is constituted by) a complex, reliable disposition or ability to perform successfully; it is not merely a cognitive state that *causes* or *manifests as* the ability. |

  ### 3. Crux List: Key Tests for Resolving the Dispute

  | Crux Question                                                                 | Concrete Test/Case/Argument                                                                                                                               | Intellectualist Prediction                                                                                            | Anti-Intellectualist Prediction                                                                                        | Why Crucial?                                                                                                                                 |
  | :---------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Crux 1: Pre-linguistic/Pre-conceptual Know-How**                           | Do pre-linguistic infants or non-human animals exhibiting complex, flexible, intentional, and improvable skills (e.g., tool use in corvids, complex locomotion in infants) possess genuine knowledge-how? | *Yes, but this know-how is constituted by non-linguistic, action-oriented *representations* (propositions under a practical MoP) that they possess.* | *Yes, and this know-how is constituted by non-representational dispositions or sensorimotor capacities, demonstrating knowledge-how without propositional structure.* | Settling this would challenge the necessity of *linguistic* propositions (Int) or affirm the possibility of know-how without *any* propositional structure (Anti-Int). |
  | **Crux 2: AI/LLMs and Genuine Know-How**                                      | Can an AI system (e.g., an LLM, robot controller) that generates successful, flexible behavioral outputs φ, based *only* on statistical patterns in training data *without* internally structured, manipulable propositional attitudes, be correctly said to "know how to φ"? | *No. Outputs may simulate know-how, but lacking propositional knowledge structured under a practical MoP, it lacks genuine understanding or know-how.* | *Potentially Yes. If the system robustly and reliably generates successful, flexible, intentional-seeming action φ, attributing know-how (as a disposition of the system) is warranted, regardless of internal architecture.* | Tests whether propositional structure (Int) or reliable behavioral capacity (Anti-Int) is essential for genuine know-how attribution.        |
  | **Crux 3: Neural Dissociation of Know-How and Declarative Knowledge**         | Can neuroscience identify neural substrates for skilled action (e.g., procedural memory circuits) that operate independently of, and are computationally distinct from, substrates for encoding/recalling declarative propositions (semantic/episodic memory)? | *Yes, but this shows distinct *mechanisms* or *ways of accessing* the same underlying propositional knowledge. The MoP explains the dissociation.* | *Yes, and this provides evidence for distinct *types* of knowledge (propositional vs. non-propositional know-how) realized by distinct neural systems.* | Tests whether neural dissociation supports distinct ontological categories (Anti-Int) or merely distinct access mechanisms/modalities for propositions (Int). |

  ### 4. Assessment of Verbal/Substantive Disagreement

  We agree there is **significant substantive disagreement** at the ontological and explanatory levels (Points 1-3 in the Disagreements Table). The core dispute is whether the cognitive state guiding skilled action *is constitutively* propositional in nature (Intellectualism) or whether it is *sui generis* and non-propositional (Anti-Intellectualism). This disagreement has ramifications for philosophy of mind (nature of mental states), epistemology (structure of knowledge), cognitive science (modeling skill), and AI (requirements for artificial know-how).

  However, we acknowledge a **potential verbal element** concerning the breadth of the term "knowledge":

  *   **Intellectualists** typically reserve "knowledge" (and thus "knowledge-that") for states involving justified, true belief (or a relevant successor concept) that meets certain epistemic standards. They seek to show know-how fits *this specific, demanding concept*.
  *   **Anti-Intellectualists** often employ a broader, more colloquial, or ability-focused sense of "knowledge" when discussing know-how, emphasizing reliable success and guidance over justification or truth conditions in the propositional sense. They argue that know-how is a legitimate *type* of knowledge, distinct from JTB-style propositional knowledge.

  **Resolution of the Verbal Aspect:** If "knowledge" is strictly defined as JTB-style propositional knowledge, then Intellectualism claims knowledge-how *is* that kind of knowledge, while Anti-Intellectualism claims knowledge-how is *not* that kind of knowledge but is a different cognitive achievement still worthy of the label "knowledge" in a broader sense. This makes the disagreement partly terminological: are we using "knowledge" narrowly (JTB) or broadly (including reliable cognitive capacities)? However, even if terminology is clarified, the **substantive ontological and explanatory disagreements** (Is the state propositional? Can it be reduced? Does explaining action require propositions?) remain fully intact. The dispute is not *merely* verbal; it hinges on the fundamental nature of the cognitive state underlying skill.

  **Conclusion:** This collaboration reveals substantial common ground on the phenomena and the challenges facing both theories. The precise disagreements are now sharply delineated, and crucial experiments/cases identified. Progress hinges on resolving the cruxes, particularly concerning non-linguistic cognition, AI architecture, and cognitive neuroscience, while maintaining clarity on the scope of "knowledge."
