  Now for the predictions. Goldhagen's dispositional view would expect near-universal compliance since these men were ideological anti-Semites. Browning's situational perspective would predict many takers for the transfer option to escape moral conflict. 

  The critical feature is the genuinely consequence-free nature of the opt-out. If penalties were implied, the predictions would converge. Goldhagen's supporters might attack this by arguing the transfer request itself carried social stigma, or that those who opted out were still anti-Semites avoiding "dirty work" rather than rejecting the ideology. 

