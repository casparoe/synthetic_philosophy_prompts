prompt: |-
  I'm teaching a graduate seminar on decision theory this term, and we've reached the updateless decision theory literature, and I have to confess the debate has stalled in a way I find genuinely frustrating rather than merely unresolved. Everyone in the room agrees on the setup of Newcomb's problem, and everyone can recite the three standard responses: the causal decision theorist who two-boxes on dominance grounds because the prediction is already fixed in the causal past; the evidentialist who one-boxes because the act is strong evidence of the predictor's output; and the updateless camp (the various UDT, FDT, and TDT formulations) who reframe the question as one about which decision procedure to implement, and one-box on that basis. What I cannot get my students to see is why these three positions keep passing each other on the variants — the cases involving a copy of the agent, the transparent or partially transparent predictors, the cases in which the relevant "algorithm" is genuinely ambiguous — without any of them conceding a single point. My working hypothesis, which I want you to treat as a hypothesis and not as a conclusion, is that the impasse is not really about Newomb at all: I suspect the causal and updateless sides are disagreeing about what the fundamental causal unit is (the isolated decision event versus the reusable decision procedure), and that they are in fact using the word "rational" to mean two different things — "maximizes causal expected utility from the decision point" versus "implements the procedure that, from a god's-eye view, yields the best outcome" — so that they are answering different questions under a single heading.

  What I want is a diagnosis of the *structure* of this disagreement, supported by what each camp actually says and actually relies on, not a survey of the positions and not a verdict on who is right about the boxes. In particular: is the impasse a verbal one (a hidden disagreement about what "rational" or "the same decision situation" even mean), a substantive one about the ontology of decision-making (whether a stable, identifiable "algorithm" is a real, causally efficacious entity or a convenient fiction), or two groups answering different questions under one name? And within the updateless camp itself, I suspect the UDT/FDT/TDT splits are not cosmetic but track a real, still-open technical question about how to formalize the correlation between distinct instances of the same procedure; please say whether that suspicion is right and identify the actual technical crux on which those formulations diverge.

  Think very carefully before answering, and respond in the style of an expert who has worked through the formalism rather than one summarizing a review article. Given your diagnosis, tell me honestly what, if anything, would count as progress — a conceptual distinction, a formal result, a redefinition of the decision problem, or a change of question — or argue that no progress should be expected and say precisely why this disagreement is of the kind that resists resolution.
reasoning: |-
  Okay, let me unpack this. The user is teaching a graduate seminar on decision theory and has hit a wall with the updateless literature. They've outlined three positions—CDT, EDT, and UDT/FDT/TDT—and can't get students to see why these positions talk past each other in variants like copying or transparent predictors. Their hypothesis is that the core disagreement is about what "rational" means: CDT focuses on maximizing utility from the decision point, while updateless approaches care about implementing the best procedure from a god's-eye view.  

  First, I need to verify if the user's hypothesis holds water. From the literature, CDT indeed grounds rationality in causal efficacy at the moment of choice (hence two-boxing), while UDT-type frameworks explicitly reject that temporal framing. The user is spot-on about divergent definitions of "rational." But there's more: updateless theories treat the agent as a mathematical object—a function—which CDT rejects as reification. This isn't just verbal; it's ontological. CDT sees algorithms as descriptions; UDT sees them as causal entities via logical correlation.  

  The variants (e.g., Transparent Newcomb) highlight this. When the predictor shows the agent its own source code, CDT still two-boxes because transparency doesn’t change causal structure. But UDT one-boxes because it identifies with the algorithm being displayed. Same physical setup, different "decision situation" based on whether algorithm identity matters.  

  As for internal UDT/FDT/TDT splits: yes, they're substantive. The crux is how to handle multiple instances. UDT 1.0 naively averages over all instances, leading to issues in asymmetric cases. FDT uses a graph-based model where nodes are decision functions, but defining the right graph is tricky. TDT's counterfactuals depend on proof-theoretic structure. The unresolved technical problem is formalizing "same decision procedure" across contexts—especially when computations are logically entangled but not identical.  

  On resolution prospects: the ontological rift likely won't close. But clarifying formalisms could help. For example, showing that UDT-type coordination achieves Pareto dominance over CDT in multi-agent problems might force CDT to engage. Or proving that no "neutral" decision theory exists without assuming what counts as an agent.  

  User’s frustration is understandable. They’re wrestling with a paradigm clash disguised as a technical debate. The way out isn’t consensus but meta-recognition: these are different tools for different frames. Maybe that’s the pedagogical takeaway—not "who’s right" but "what question are you asking?"  

  (Also, kudos to the user for spotting the algorithm-reification point—that’s unusually sharp for seminar-level discourse.)
answer: |-
  Your hypothesis cuts to the bone of the impasse. The disagreement is **both substantive and ontological**, with divergent definitions of "rationality" masking deeper commitments about agency and causality. Below is a structural diagnosis grounded in formal commitments, followed by the technical crux within the updateless camp and prospects for progress.

  ---

  ### **I. The Core Disagreement: Ontology of Agency**
  **A. Causal Decision Theory (CDT)**  
  - **Fundamental Unit**: The *temporally located decision event*.  
  - **Rationality Defined As**: Maximizing causal expected utility *from within the agent's current state*, given fixed causal structure.  
  - **Formal Reliance**: Causal models (e.g., structural equations, do-calculus). Acts are interventions ($do(A=a)$) severing probabilistic dependencies.  
  - **Response to Variants**:  
    - *Copies*: Treats other instances as causally isolated. In "Dual Newcomb" (two identical agents), two-boxes regardless of the other.  
    - *Transparency*: Predictor's transparency is irrelevant—only causal arrows matter. Still two-boxes.  
    - *Algorithmic Ambiguity*: Rejects the premise; only physical implementation matters, not "algorithmic identity."  

  **B. Updateless Decision Theories (UDT/FDT/TDT)**  
  - **Fundamental Unit**: The *abstract decision procedure* (algorithm) instantiated across time/space.  
  - **Rationality Defined As**: Selecting the *policy* (mapping observations to acts) that maximizes expected utility *from a pre-commitment perspective*, accounting for logical/algorithmic correlations.  
  - **Formal Reliance**:  
    - **UDT**: Averages utility over all mathematical outcomes consistent with the agent's algorithm.  
    - **FDT**: Evaluates acts by simulating counterfactuals about the agent's function in a causal graph *including logical nodes*.  
    - **TDT**: Uses logical counterfactuals conditioned on the agent's program output.  
  - **Response to Variants**:  
    - *Copies*: Treats identical algorithms as logically correlated. One-boxes to coordinate with copies.  
    - *Transparency*: Seeing the prediction binds the agent's output to the predictor's model. One-boxing becomes self-enforcing.  
    - *Algorithmic Ambiguity*: Struggles to define "same algorithm" (see §II).  

  **The Impasse Structure**:  
  - **Not Merely Verbal**: Both sides agree on utility maximization but disagree on the *locus of agency*. CDT anchors agency in a *physical moment*; UDT/FDT anchor it in a *mathematical object* (the algorithm).  
  - **Divergent Questions**:  
    - CDT: "What act *causes* the best outcome now?"  
    - UDT/FDT: "Which *function* (if universally implemented) would yield the best outcomes?"  
  - **Ontological Commitment**: CDT treats the algorithm as a description; UDT/FDT treat it as a *causally potent entity* via logical correlations.  

  ---

  ### **II. Internal Updateless Schism: The Technical Crux**
  The UDT/FDT/TDT split centers on **formalizing logical correlation** and **handling multiple instances**. The unresolved question:  
  > ***How do we define the "same decision procedure" across contexts, and compute counterfactuals when its execution is logically entangled with the environment?***  

  Key divergences:  
  1. **UDT 1.0/1.1** (Wei Dai):  
     - Averages utility over all mathematical structures satisfying the agent's program.  
     - **Problem**: Fails in asymmetric or non-uniform instances (e.g., agent A runs once, agent B runs twice). Overcounting distorts expected utility.  

  2. **FDT** (Yudkowsky, Soares):  
     - Uses a causal graph with nodes for decision functions. Counterfactuals set the function's output.  
     - **Crux**: *Which dependencies belong in the graph?*  
       - Example: In "Counterfactual Mugging," should Omega's prediction be a parent node of the agent's decision? Ad hoc solutions arise.  

  3. **TDT** (Yudkowsky):  
     - Logical counterfactuals conditioned on the agent's output.  
     - **Problem**: *Proof-theoretic limitations*. In complex self-referential problems (e.g., "Agent Simulates Predictor"), the agent cannot prove what its counterfactual self does.  

  **Unresolved Technical Challenge**:  
  - **The Reference Class Problem**: How to partition the multiverse of computations into "instances of me"?  
  - **Logical Uncertainty**: How to handle cases where the agent can't prove correlations (e.g., Gödelian obstacles)?  
  - **Dynamic Consistency**: Can an updateless agent avoid self-modifying mid-episode? (FDT/UDT claim "yes," but formalisms are brittle.)  

  ---

  ### **III. Prospects for Progress**  
  The impasse is **not eternally unresolvable**, but progress requires reframing:  
  1. **Conceptual Distinction**:  
     - Explicitly separate *temporal rationality* (CDT) from *strategic rationality* (UDT/FDT). Treat them as tools for different problems: CDT for isolated actions; UDT/FDT for coordinated systems.  

  2. **Formal Result**:  
     - Prove a **No-Free-Lunch theorem**: Show that no decision theory dominates in all environments without assuming a preferred ontology (e.g., "algorithms exist").  
     - **Current Evidence**: In *acausal trade* games, CDT loses resources to UDT/FDT; in *causal sabotage* games, UDT/FDT precommit to suboptimal acts.  

  3. **Redefine the Problem**:  
     - Shift to **multi-agent decision problems** (e.g., program equilibrium in games). Here, UDT/FDT *objectively outperform* CDT in Pareto efficiency.  
     - Example: Two agents running identical FDT achieve (Cooperate, Cooperate) in a one-shot Prisoner's Dilemma. CDT cannot.  

  4. **Change the Question**:  
     - Instead of "What is rational?" ask **"What agency concept aligns with our goals?"**  
       - *Goal: Avoid regret* → CDT (it never blames itself).  
       - *Goal: Coordinate copies* → UDT/FDT.  

  **Why Resolution is Elusive**:  
  - The theories optimize different *meta-utility functions*:  
    $$ \text{CDT: } \max \, U(\text{outcome} \, | \, do(A)) \quad \text{vs.} \quad \text{UDT/FDT: } \max \, \mathbb{E}[U \, | \, \text{policy} \, \pi] $$  
  - This is not reconcilable without abandoning core axioms.  

  ---

  ### **Honest Recommendation for Your Seminar**  
  Stop debating "who wins Newcomb." Instead:  
  1. **Assign a multi-agent problem** (e.g., *Gary Drescher's "Agent and Omega"* or *a transparent Twin Prisoner's Dilemma*).  
  2. **Force explicit ontology declarations**: "What *is* the agent here—a body, a function, a history?"  
  3. **Compare performance metrics**: Regret, Pareto efficiency, computational tractability.  

  The impasse persists because decision theorists are building different *agency archetypes*, not solving the same puzzle. Acknowledge that, and the debate transforms.
