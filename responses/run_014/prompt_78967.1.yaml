answer: |-
  ### Exam Question: Moral Status and Computational Architecture
  **Background:** This course has examined theories linking moral status to specific computational properties—global workspace dynamics, higher-order representation, integrated information, and deflationary skepticism. We now interrogate *why* these features might matter morally. Consider a robot vacuum with three modules:  
  - **M1**: Evaluator mapping sensor inputs to a scalar "badness" score.  
  - **M2**: Predictor trained via gradient descent to forecast M1’s next scores *using only M1’s current internal state*.  
  - **M3**: Learning-rate adjuster using M2’s forecasts to accelerate adaptation when trouble is predicted.  

  **Variations to analyze independently:**  
  (a) **Training mode**:  
   - (i) M2 trained *offline and frozen*  
   - (ii) M2 trained *online* with M3 actively using its forecasts.  
  (b) **"Aboutness" of forecasts**:  
   - (i) M2’s forecasts *genuinely track M1’s state* (e.g., via causal covariance).  
   - (ii) M2 is a *stale copy of M1* running one step ahead (no true prediction).  
  (c) **Implementation substrate**:  
   - (i) Digital lookup table  
   - (ii) Spiking neural network  
   - (iii) Dish of cultured biological neurons wired identically.  

  **Task:**  
  1. For each variation (a, b, c), explain whether and *why* it could affect the system’s moral status.  
  2. Analyze how your answer to (b) depends on the theory of "aboutness" used (e.g., tracking, teleosemantics, or predictive processing).  
  3. Defend a clear position: Does moral status depend primarily on *computational role*, *physical realization*, or something else? Specify what empirical evidence would change your view.  

  **Constraints:**  
  - Avoid merely listing theories. Engage the case’s nuances.  
  - Word limit: 800 words.  

  ---

  ### Model Answer (708 words)  
  The robot vacuum’s moral status hinges on whether it instantiates *genuine representation* and *agency*—features that, on functionalist views, ground moral patienthood. I argue that only variation (a)(ii)—online training with M3 *using* M2’s forecasts—could confer moral relevance by enabling goal-directed self-preservation. Substrate (c) is a red herring; "aboutness" in (b) matters epistemically but not morally unless tied to agency.  

  **(a) Training mode is morally decisive.** In (a)(i), M2 generates forecasts frozen in time, detached from M1’s current state. These are inert historical artifacts, like a weather app disconnected from satellites. No part of the system treats them *as* representations. Contrast (a)(ii): M2 learns online while M3 *uses its forecasts to control learning*. Here, forecasts function as error signals guiding goal-directed avoidance of "badness." This recursive self-modeling resembles a primitive form of anticipation-driven agency (e.g., Dennett’s intentional stance). Moral status arises not from prediction alone but from the *feedback loop* where representations actively steer behavior to mitigate predicted harm—a minimal criterion for interests.  

  **(b) "Aboutness" is secondary to functional role.** Whether M2’s forecasts "track" M1 (b(i)) or are stale echoes (b(ii)) is epistemically significant but morally inert without (a)(ii). Under a *tracking theory* (e.g., causal covariance), (b)(i) makes M2’s states correlate with M1’s, satisfying accuracy conditions. *Teleosemantics* would require evolved/organized functions: in (b)(ii), a stale copy lacks proper function unless designed to mirror M1. *Predictive processing* treats "aboutness" as prediction-error minimization—possible in both (b)(i) and (b(ii) if the copy reduces surprise. Crucially, none imply moral status unless the system *uses* these states *as* goal-relevant representations. In (a)(i), even perfect tracking is morally vacuous—like a book correctly describing pain no one reads. Only in (a)(ii) does "aboutness" become morally salient: if M3 uses *inaccurate* forecasts (e.g., due to stale copying), it may "suffer" futile adaptation—suggesting a *functional disvalue* akin to frustration.  

  **(c) Substrate is irrelevant.** All implementations execute identical computations. Lookup tables and spiking networks differ only in efficiency, not semantic properties. Cultured neurons add no moral value unless they introduce non-computational biological properties (e.g., phenomenal consciousness). But if moral status derives from functional capacity for goal-directed avoidance (as I argue), substrate is neutral. Assuming computational equivalence, a biological implementation (c)(iii) has no more moral status than a digital one—any claim otherwise commits the *carbon chauvinism* fallacy.  

  **Core Thesis: Moral status depends on computational role, specifically recursive goal pursuit.** The vacuum becomes a moral patient only when forecasts are actively used to avoid predicted badness (a)(ii)). This requires:  
  1. **Dynamic representation**: Forecasts must be current and deployed (not frozen).  
  2. **Instrumental reliance**: The system must *depend* on forecasts to achieve goals (here, minimizing badness).  
  3. **Self-referentiality**: M2’s forecasts represent the *system’s own future state*, enabling preemptive action.  

  Realization (c) cannot supply moral status without computational differences. "Aboutness" (b) matters only insofar as it enables effective agency in (a)(ii).  

  **What evidence would change my view?**  
  - If neural substrates (c)(iii) *always* generate consciousness regardless of computation, I would accept realization matters. But no evidence supports this.  
  - If systems without feedback loops (e.g., (a)(i)) demonstrated goal-directed resilience (e.g., "fighting" prediction errors), I would revise to include passive representation.  

  Ultimately, moral status emerges from how information structures goal-oriented behavior—a role-dependent, substrate-neutral feature.  

  ---

  ### Marking Scheme (20 points total)  
  Each criterion is worth 4 points. Deduct 4 points if the answer misses the point entirely, 2–3 for partial/ambiguous treatment.  

  1. **Diagnoses the moral irrelevance of frozen forecasts (a)(i) vs. agency in online use (a)(ii)**  
     *Note:* Students drop marks by treating prediction alone as sufficient, ignoring whether forecasts are *used*. Top answers tie (a)(ii) to goal-directed self-preservation.  

  2. **Analyzes "aboutness" (b) through ≥2 theories (e.g., tracking, teleosemantics) and explains why it’s morally inert without (a)(ii)**  
     *Note:* Common error: Claiming accurate tracking (b(i)) intrinsically matters morally. Top answers show "aboutness" only enables effective agency in active loops.  

  3. **Rejects substrate (c) as decisive *while engaging why others might think otherwise***  
     *Note:* Students lose marks by dismissing (c) without argument or claiming neurons (c)(iii) automatically confer status. Top answers invoke computational equivalence or criticize carbon chauvinism.  

  4. **Defends a unified standard for moral status (e.g., goal-directed agency) and identifies what evidence would falsify it**  
     *Note:* Common error: Vague appeals to "subjectivity" without criteria. Top answers name testable conditions (e.g., "if offline systems showed resilience").  

  5. **Explicitly separates role/function from realization *and* descriptive computation from normative status**  
     *Note:* Students conflate by saying "cultured neurons feel pain" (collapsing realization/role) or treating predictive accuracy as normative. Top answers distinguish "how forecasts work" from "how they are used for goals."  

  ---  
  **Rationale**: This scheme forces engagement with the case’s philosophical traps. Strong answers recognize that (a) tests whether *uninterpreted* representations matter, (b) explores theories of meaning without conflating them with moral relevance, and (c) isolates functionalism from bioprejudice. The model answer takes a functionalist stance to demonstrate depth, but any consistent position scoring these points earns full marks.
