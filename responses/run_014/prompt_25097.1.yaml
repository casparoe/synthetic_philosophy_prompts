prompt: |-
  At a discussion group I've been attending since retiring from the lab, two regulars got into a sharp exchange about the Condorcet jury theorem and I've been turning it over ever since. I'd like you to adjudicate it move by move.

  (1) David opened by saying the theorem shows that democratic decision-making has a solid epistemic foundation: if each voter has a better-than-even chance of being right on a binary question and they vote independently, then the probability that a majority gets it right converges to certainty as the group grows. He called this a genuine reason to trust democratic outcomes over, say, a single expert.

  (2) Miriam replied that the independence condition makes the whole thing irrelevant to actual politics. Voters read the same outlets, watch the same debates, and talk to each other. Their errors aren't independent — they're correlated. And with correlated errors, she said, adding more voters doesn't add independent signals; it just amplifies whatever shared biases the electorate already has.

  (3) David answered that this is too quick. The theorem only requires conditional independence given the evidence. If voters share information because they're all looking at the same facts, that correlation is fine — it's driven by a common signal, not by copying each other's mistakes. He said the real question is whether, conditional on the evidence available, each voter's judgment is an independent draw from a distribution that's better than chance.

  (4) Miriam came back with two points. First, voters share cognitive architecture — confirmation bias, framing effects, and so on — that isn't driven by evidence at all, so errors remain correlated even conditional on the facts. Second, on many real political questions, voters aren't better than chance in the first place; they're systematically misinformed, and the theorem's p > 0.5 premise fails outright. She said David was defending a theorem that describes a voting body that has never existed.

  I'd like you to go through this exchange step by step and say who has the better of each move, and then give an overall assessment of who is more right. Please take a definite position rather than splitting the difference — I want a committed verdict, with your reasoning at each stage.
reasoning: |-
  Okay, let me tackle this step by step. The user presents a debate between David and Miriam about the Condorcet jury theorem's real-world applicability. David argues it provides an epistemic foundation for democracy, while Miriam claims its assumptions (independence and p>0.5) are unrealistic. 

  First, I need to recall the theorem clearly: it states that with independent voters each having p>0.5 correctness probability, majority accuracy approaches 1 as group size increases. David's opening move (1) is technically correct but oversimplified - he presents the ideal case without addressing practical constraints. Miriam's response (2) hits hard by highlighting correlated errors in real politics, which genuinely threatens the independence assumption. 

  When David counters (3) with conditional independence given evidence, he makes a subtle legal distinction - shared facts ≠ correlated errors. This holds mathematically but feels slippery; he's narrowing the theorem's applicability to evidence-driven scenarios. Miriam's final rebuttal (4) lands two strong punches: cognitive biases violate conditional independence, and voters often have p<0.5 due to misinformation. Her "voting body that never existed" jab exposes how David's defense relies on idealized conditions.

  Overall, Miriam wins on realism while David clings to theoretical purity. Her arguments expose why the theorem fails as a direct justification for democracy: correlated errors from shared biases and systematic misinformation break its core assumptions. I should emphasize that David isn't wrong mathematically, but Miriam forces us to confront the gap between models and messy human voting behavior.

  The user wants a definite verdict, so I'll structure it move-by-move before declaring Miriam more correct overall. Key angles: cognitive psychology undermines conditional independence, and empirical evidence suggests voters frequently fall below p=0.5 threshold. The theorem remains intellectually interesting but politically overclaimed by David.
answer: |-
  Here's a clear, move-by-move adjudication with a definitive verdict:

  **Move 1: David's Opening (Epistemic Foundation)**  
  *David:* Correct in stating the *theorem's formal conclusion*. The Condorcet Jury Theorem (CJT) *does* mathematically prove that under the assumptions (p > 0.5, independence), majority accuracy converges to 1 as group size increases. This *is* a potential epistemic justification for democracy.  
  **Verdict: David wins this move.** He accurately describes the theorem's logic and its implication for idealized group competence.

  **Move 2: Miriam's Rebuttal (Correlated Errors)**  
  *Miriam:* Correctly identifies the **fundamental weakness** of naively applying CJT to real politics. Voter errors *are* highly correlated due to shared information sources, social influence, and common cultural/political narratives. This correlation *does* undermine the "adding independent signals" effect. Amplifying shared biases is a real risk.  
  **Verdict: Miriam wins this move decisively.** She exposes the most critical practical flaw in David's initial application.

  **Move 3: David's Defense (Conditional Independence)**  
  *David:* Makes a valid *technical distinction* but **overstates its real-world relevance**. He's correct that CJT requires *conditional* independence given the evidence (i.e., voters make independent errors *given the same information*). Shared evidence *itself* isn't the problem. However, he glosses over *why* conditional independence fails:  
  1.  **Evidence isn't neutrally perceived:** Voters filter shared evidence through pre-existing biases.  
  2.  **"Evidence" includes misinformation:** The "common signal" is often polluted.  
  **Verdict: Miriam wins this move.** David's point is theoretically sound but fails to address *why* conditional independence is unrealistic. He sidesteps Miriam's core objection about *how* voters process information.

  **Move 4: Miriam's Counter (Cognitive Biases & p<0.5)**  
  *Miriam:* Lands two critical blows:  
  1.  **Cognitive Architecture:** Absolutely correct. Shared cognitive biases (confirmation bias, motivated reasoning, framing effects, tribalism) ensure errors are correlated *even conditional on the evidence*. Two voters seeing the same facts can make the *same* error due to identical biases. This **fatally undermines conditional independence** in practice.  
  2.  **p > 0.5 Premise:** Highly plausible and often supported by empirical political science. On complex issues (e.g., economics, foreign policy), voters frequently lack sufficient knowledge or are systematically misled, making average competence *below* 0.5. The theorem simply doesn't apply if p ≤ 0.5 (majority accuracy can converge to 0!).  
  **Verdict: Miriam wins this move overwhelmingly.** Her arguments directly challenge the core assumptions' validity in real politics.

  **Overall Verdict: Miriam has the much stronger position.**

  *   **Why Miriam Wins:** She correctly identifies that the CJT's core assumptions (**independence** and **p > 0.5**) are profoundly unrealistic for mass democratic politics due to:
      *   **Correlated Errors:** Driven by shared narratives, misinformation ecosystems, social influence, and crucially, **shared cognitive biases** that persist *even conditional on evidence*.
      *   **Systematic Misinformation & Complexity:** On many issues, the electorate demonstrably lacks the competence (p > 0.5) required by the theorem. Voters are often predictably wrong.
  *   **David's Weakness:** He accurately describes the theorem's *mathematical logic* but fails to grapple with the **empirical reality** of voter psychology and information environments. His reliance on "conditional independence given the evidence" ignores how cognitive biases ensure the "conditioning" doesn't create independence. He treats voters like unbiased statistical processors, which they are not.
  *   **The Verdict:** **Miriam is more right.** The Condorcet Jury Theorem, while mathematically elegant and theoretically suggestive, provides a **weak and highly unrealistic epistemic foundation for real-world mass democracy** because its assumptions are systematically violated. It describes a voting body of rational, independent, minimally competent truth-seekers – a body that, as Miriam argues, has never existed in complex modern societies. Democratic outcomes often *do* reflect amplified biases and misinformation, not converging truth. David overclaims the theorem's practical relevance; Miriam correctly exposes its limitations.
