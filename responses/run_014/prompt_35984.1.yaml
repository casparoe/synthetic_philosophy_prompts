  Final top three: \answer{Negation Gatekeeper, Beyond Liar, Ontological Grounding}
answer: |-
  Based on your hunch, I accept the hygiene/ontology distinction as a useful diagnostic tool for prioritizing the field's open questions. Logical hygiene (developing paraconsistent systems to contain inconsistency) is indeed more technically mature, with established logics (e.g., LP, FDE) and applications in databases, legal systems, and epistemology. Ontological dialetheism (the claim that true contradictions exist) remains philosophically underdeveloped, often leaning on semantic paradoxes without robustly extending to other domains. Crucially, conflation between the two is widespread: hygiene successes (e.g., consistent subsets in inconsistent legal codes) are sometimes misconstrued as evidence for ontology, while ontological objections (e.g., "negation isn't genuine") are used to dismiss hygiene. Prioritization should thus focus on questions that: (1) disentangle the projects, (2) advance the underdeveloped ontological front, and (3) resolve gatekeeping issues that block progress elsewhere. Tractability is assessed by whether the question requires philosophical innovation (e.g., conceptual analysis, metaphysical grounding) versus technical logico-mathematical work, and "settlement" means a shift in the debate (e.g., broad acceptance of a position, or abandonment due to decisive counterarguments) rather than perpetual rehashing.

  ### Prioritized Open Questions
  1. **Negation Gatekeeper**  
     - **Project**: Primarily ontological (but hygiene depends on it indirectly).  
     - **Question**: Does paraconsistent negation (e.g., in LP) qualify as genuine negation, or is it a mere technical operator? If it isn't "real" negation, dialetheism cannot coherently assert true contradictions.  
     - **Upstream/Downstream**: Upstream of almost everything. Until resolved, ontological dialetheism is vulnerable to the charge that it merely "changes the subject" (e.g., classical negation is the only real negation, so dialetheists aren't describing contradictions). Also upstream for hygiene, as the intelligibility of paraconsistent systems hinges on this operator's legitimacy.  
     - **Tractability**: High for philosophers (conceptual/logical analysis), moderate for logicians (requires modeling negation's essential properties).  
     - **Settlement**: Consensus that paraconsistent negation either captures the core features of negation (e.g., non-trivializing antithesis) or fails to do so (e.g., it's merely a subcontrary-forming operator). Current stalemate persists due to equivocal intuitions; settlement would involve a definitive account of negation's "essence."  
     - **Why fund**: Without progress here, ontological dialetheism remains stillborn. Hygiene can borrow classical negation, but this question exposes whether dialetheism is a substantive position.

  2. **Beyond Liar**  
     - **Project**: Ontological.  
     - **Question**: Are there sustainable examples of dialetheia beyond semantic paradoxes (e.g., the Liar), such as in law (conflicting obligations), vagueness (borderline contradictions), or physics (quantum indeterminacy)?  
     - **Upstream/Downstream**: Downstream of Negation Gatekeeper (if negation fails, this is moot). Upstream of Ontological Grounding (see below), as concrete examples are needed to motivate and shape dialetheism's metaphysics. Currently, semantic paradoxes dominate the discourse, but their "self-reference frontier" status makes them poor ambassadors for broader ontology.  
     - **Tractability**: High for philosophers (case-building in applied domains), low for logicians/computer scientists (technical tools exist but lack philosophical traction).  
     - **Settlement**: Emergence of widely accepted non-semantic dialetheia (e.g., in jurisprudence or perception) or conclusive arguments that such cases are always best handled by hygiene alone (e.g., via consistent subtheories).  
     - **Why fund**: The field's overreliance on semantic paradoxes invites conflation with hygiene (e.g., "the Liar is just a linguistic glitch"). Broadening the scope forces a direct test of dialetheism's ontological value.

  3. **Ontological Grounding**  
     - **Project**: Ontological.  
     - **Question**: What is the nature of reality such that true contradictions can exist? For instance, are dialetheia grounded in metaphysical indeterminacy, dialetheic properties, or a non-classical structure of facts?  
     - **Upstream/Downstream**: Downstream of Beyond Liar and Negation Gatekeeper. Upstream of practical applications (e.g., if dialetheia are "gappy" states, this affects how we model vagueness). Currently underdeveloped, with debates often lapsing into intuition-mongering.  
     - **Tractability**: Purely philosophical (metaphysical inquiry), requiring no new formal machinery.  
     - **Settlement**: A coherent, non-ad hoc model of dialetheic truthmakers that gains adherents outside dialetheism (e.g., analogous to how possible worlds clarified modal realism).  
     - **Why fund**: Addresses the "quiet split" by forcing ontology to stand independently of hygiene. Without this, dialetheism risks being a purely linguistic or pragmatic position.

  ### Lower-Priority Questions (Deliberately Unfunded Here)
  - **Internal Harmony**: *Question*: Can dialetheism provide a non-trivial account of rational belief revision or inference without explosion? *Project*: Ontological (if about rationality) and hygiene (if about systems). *Why unfunded*: Downstream of Negation Gatekeeper—if negation isn't genuine, this is irrelevant. Also, significant work exists (e.g., adaptive logics), making it less urgent.  
  - **Hygiene Optimization**: *Question*: How to design maximally efficient paraconsistent logics for specific applications (e.g., AI databases)? *Project*: Hygiene. *Why unfunded*: Well-developed and better suited for computer science grants. Funding it here risks conflation (e.g., "better databases imply true contradictions").  
  - **Revenge Immunity**: *Question*: Can dialetheic logics avoid revenge paradoxes (e.g., strengthened Liars) without ad hoc restrictions? *Project*: Both (hygiene for formal soundness, ontology for truth-theory). *Why unfunded*: Highly technical, with diminishing returns; partial solutions exist (e.g., field semantics), and it's secondary if ontology lacks broader motivation.  

  ### Why This Order?
  - **Negation Gatekeeper** is the bottleneck: if paraconsistent negation isn’t genuine, ontology collapses into a notational variant of hygiene. Settling it prevents equivocation and forces clarity.  
  - **Beyond Liar** is the key growth area for ontology: without credible examples outside semantic paradoxes, dialetheism seems unnaturally narrow, reinforcing your concern about underdevelopment.  
  - **Ontological Grounding** builds on the first two: if they succeed, metaphysics becomes urgent; if they fail, it’s moot.  
  - Deprioritizing hygiene-centric questions (e.g., **Hygiene Optimization**) avoids conflation and leverages existing momentum. Leaving **Internal Harmony** unfunded reflects its dependence on earlier ontological wins.  

  This ordering prioritizes disentanglement and ontological development, with settlement criteria ensuring funded work aims for decisive progress, not just incremental debate.

  \answer{Negation Gatekeeper, Beyond Liar, Ontological Grounding}
