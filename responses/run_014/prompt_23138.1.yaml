  I'm a PhD student in formal methods, and I spend most of my time writing machine-checked proofs in Lean. A visiting logician at our group meeting recently said that if the basic axioms of math (ZFC, Peano arithmetic) turn out to be inconsistent, all of this verification work is pointless, and nobody in the room pushed back. I think hes wrong, but I cant quite articulate why, especially since Gödel's second incompleteness theorem means we can't rule the possibility out from inside the system anyway. Please describe the most important implications of the possibility that the basic axioms of math are inconsistent for what we can still trust about machine-checked proofs, and for the difference between a proof that checks and a theorem that is actually true.
