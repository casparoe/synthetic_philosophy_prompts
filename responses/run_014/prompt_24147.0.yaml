     Timeline:

          Minute 0-5: Introduction and assign groups.
          Minute 5-10: Explain scoring and the two voting methods we will use (plurality and runoff). Explain the runoff process.
          Minute 10-20: Plurality voting.
               - First vote: "Vote for your top choice." -> tally -> A wins.
               - Record group points: Alpha:3, Beta:1, Gamma:2.
               - Second vote: "Now, you can change your vote if you want, knowing the previous outcome." 
                     -> let groups discuss for 2 minutes, then vote.
                     -> expect Beta to switch to C -> C wins.
               - Record: Alpha:1, Beta:2, Gamma:3.
          Minute 20-30: Runoff voting.
               - First sincere round: 
                     "Vote for one movie in the first round." -> tally: A:8, B:7, C:5 -> A and B advance.
                     Then second round: "Now vote between A and B." -> tally: A:13 (Alpha and Gamma), B:7 -> A wins.
               - Record points: Alpha:3, Beta:1, Gamma:2.
               - Second chance: 
                     "Now, we'll do runoff again, but you can change your first round vote if you want."
                     -> groups discuss: Beta should decide to vote for C in the first round.
                     -> first round: A:8, C:12 -> A and C advance.
                     -> second round: A vs C -> C wins 12-8.
               - Record points: Alpha:1, Beta:2, Gamma:3.
          Minute 30-40: Debrief.

     Debrief:

          - Ask: In which methods were you able to get a better outcome by voting differently than your true favorite?
          - Explain: This is called strategic voting or manipulation.
          - The Gibbard-Satterthwaite theorem (now reveal the name) says that this is inevitable in any reasonable voting method with 3 or more options.
          - Conditions:
              * At least 3 options.
              * The method respects unanimity (if everyone agrees on #1, that wins) and is not a dictatorship.
              * Then there will be some situations where a voter or group of voters can get a better outcome by voting insincerely.
          - In our activity, we saw two examples: 
              Plurality: 
                  Sincere: A wins -> Beta gets 1 point.
                  Strategic: Beta votes for C -> C wins -> Beta gets 2 points.
              Runoff:
                  Sincere: A wins -> Beta gets 1 point.
                  Strategic: Beta votes for C in the first round -> C wins -> Beta gets 2 points.
          - The theorem doesn't say it happens all the time, but that it can happen in any method.

          Takeaway: We cannot find a perfect voting method that is immune to strategic voting in all circumstances.

     Final note: The activity doesn't prove the theorem (which is very complex) but gives a taste of how manipulation happens and that it's a general issue.

     Now, to make sure they know others' preferences: We told them the group preferences and sizes. So they know the distribution. 

     We are ready.
answer: |-
  ### Model UN Voting Activity: Experiencing Strategic Voting
  **Goal:** Illustrate the inevitability of strategic voting (Gibbard-Satterthwaite theorem) without naming it until debrief.  
  **Takeaway:** No "fair" voting method is immune to manipulation with 3+ options.  
  **Materials:** Whiteboard, markers, paper ballots, group preference cards (optional), timer.

  ---

  ### **Setup** (5 min)
  1. **Choose 3 options** students care about (e.g., movies):  
     - **A** = *Avengers*  
     - **B** = *La La Land*  
     - **C** = *The Dark Knight*  
  2. **Divide students into 3 groups** (by seating or random assignment):  
     - **Group Alpha (8 students):** True ranking: **A > B > C**  
     - **Group Beta (7 students):** True ranking: **B > C > A**  
     - **Group Gamma (5 students):** True ranking: **C > A > B**  
  3. **Reveal preferences publicly** on whiteboard:  
     ```
     Alpha (8): A > B > C  
     Beta (7): B > C > A  
     Gamma (5): C > A > B
     ```  
  4. **Payoff scheme (no money):**  
     - If your **#1 choice wins** → 3 points for your group.  
     - If your **#2 choice wins** → 2 points.  
     - If your **#3 choice wins** → 1 point.  
     **Goal:** Maximize your group’s points.  
  5. **Rules:**  
     - Groups may discuss strategy before voting.  
     - You can lie about your preferences if it helps your group.  

  ---

  ### **Voting Rounds** (30 min total)
  #### **Round 1: Plurality Voting** (10 min)  
  - **Rule:** Each student votes for **one** option. Most votes wins.  
  - **Step 1 (Sincere Voting):**  
    - Groups vote for their true #1 choice.  
    - Tally: A=8, B=7, C=5 → **A wins**.  
    - Points: Alpha=3, Beta=1, Gamma=2.  
  - **Step 2 (Strategic Voting):**  
    - Announce: *"Vote again—change your vote if you think it helps your group."*  
    - Beta realizes: If they vote for **C** instead of B, C wins (C=7+5=12, A=8).  
      - Beta prefers **C** (2 points) over **A** (1 point).  
    - Tally: A=8, B=0, C=12 → **C wins**.  
    - Points: Alpha=1, Beta=2, Gamma=3.  

  #### **Round 2: Runoff Voting** (15 min)  
  - **Rule:**  
    - Round 1: Vote for **one** option. Top 2 advance.  
    - Round 2: Vote between the top 2. Majority wins.  
  - **Step 1 (Sincere Voting):**  
    - Round 1: A=8, B=7, C=5 → **A and B advance**.  
    - Round 2: A vs. B.  
      - Alpha (8) votes A.  
      - Beta (7) votes B.  
      - Gamma (5) prefers A > B → votes A.  
      - Tally: A=13, B=7 → **A wins**.  
    - Points: Alpha=3, Beta=1, Gamma=2.  
  - **Step 2 (Strategic Voting):**  
    - Announce: *"Vote again in Round 1—change your vote if it helps."*  
    - Beta realizes: If they vote for **C** in Round 1, C advances instead of A.  
      - New Round 1: A=8, B=0, C=12 → **A and C advance**.  
      - Round 2: A vs. C.  
        - Alpha (8) votes A.  
        - Beta (7) prefers C > A → votes C.  
        - Gamma (5) votes C.  
        - Tally: C=12, A=8 → **C wins**.  
      - Beta gets 2 points (C is their #2) instead of 1 (A is #3).  
    - Points: Alpha=1, Beta=2, Gamma=3.  

  #### **Round 3 (Optional): Borda Count** (5 min)  
  - **Rule:** Rank all options (2 pts=1st, 1 pt=2nd, 0 pts=3rd). Highest total wins.  
  - **Sincere Outcome:**  
    - A: (8×2) + (5×1) = 21  
    - B: (8×1) + (7×2) = 22  
    - C: (7×1) + (5×2) = 17 → **B wins**.  
  - **Manipulation Opportunity:**  
    - Alpha could rank **B last** to try to elect A, but risks C winning (worse for them).  
    - *Skip revote due to time*—use to highlight complexity.  

  ---

  ### **Debrief** (15 min)  
  1. **What happened?**  
     - In both methods, Beta lied about their #1 choice to get a better outcome (C instead of A).  

  2. **Map to Gibbard-Satterthwaite Theorem:**  
     - **Condition 1:** 3+ options (A, B, C).  
     - **Condition 2:** Methods respected unanimity (if all agreed on #1, it won).  
     - **Condition 3:** No dictatorship (no single voter decided).  
     - **Conclusion:** Manipulation is inevitable—any non-dictatorial method can be "gamed."  

  3. **Why Beta manipulated:**  
     - **Plurality:** Beta voted for C (not their #1) to block A.  
     - **Runoff:** Beta voted for C in Round 1 to change who advanced.  

  4. **Key Insight:**  
     - "Fairness" (unanimity, non-dictatorship) isn’t enough—all methods have loopholes.  
     - **Not a critique of plurality:** Even "better" methods (like runoff) are manipulable.  

  ---

  ### **What Will Go Wrong (And How to Fix)**  
  1. **Problem:** Students won’t lie (e.g., Beta votes sincerely in Round 2).  
     - **Fix:** Remind them: *"Your goal is points for your group, not honesty."* Pre-assign a "Beta leader" to push strategy.  

  2. **Problem:** Groups don’t understand others’ preferences.  
     - **Fix:** Display preferences on the board constantly. Use group leaders to explain incentives.  

  3. **Problem:** Time runs out during runoff rounds.  
     - **Fix:** Skip Borda; focus on plurality/runoff. Use pre-tallied examples if needed.  

  4. **What the Activity Can’t Show:**  
     - The theorem proves manipulation exists for **all** methods—we only tested 2.  
     - Manipulation isn’t always easy (e.g., Borda requires complex coordination).  
     - Some methods are *harder* to manipulate (but still possible).  

  ---

  ### **Final Script for Whiteboard**  
  ```  
  VOTING ACTIVITY RULES  
  Options: A=Avengers, B=La La Land, C=Dark Knight  

  Groups:  
  - Alpha (8): A > B > C  
  - Beta (7): B > C > A  
  - Gamma (5): C > A > B  

  Payoff: #1 choice → 3 pts, #2 → 2 pts, #3 → 1 pt  

  ROUND 1: PLURALITY  
  - Rule: Vote for ONE option. Most votes wins.  
  - Sincere: A wins (A=8, B=7, C=5)  
  - Strategic: Beta votes C → C wins (C=12, A=8)  

  ROUND 2: RUNOFF  
  - Rule: Round 1: Vote for one. Top 2 advance.  
          Round 2: Vote between top 2. Most votes wins.  
  - Sincere: A wins (A vs. B: A=13, B=7)  
  - Strategic: Beta votes C in Round 1 → C vs. A → C wins (C=12, A=8)  

  DEBRIEF:  
  All voting methods can be "gamed" with 3+ options.  
  No perfect "fair" method exists!  
  ```  

  This activity creates a visceral "aha!" moment—students *see* manipulation work. The key is emphasizing group incentives and making preferences public. Run it tightly, and they’ll leave skeptical of "perfect" voting systems!
