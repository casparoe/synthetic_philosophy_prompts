  Lump (Stanza 3), Statue (Stanza 4).**  

  **Stanza 1 (Lump):**  
  I am the ground that holds the form,  
  *This shape is what the hands have wrought.*  
  I bear the weight of change and storm,  
  *One stuff, one place, one lifetime’s thought.*  

  **Stanza 2 (Statue):**  
  *This shape is what the hands have wrought.*  
  I am the meaning in the frame.  
  *One stuff, one place, one lifetime’s thought.*  
  Destroy my lines, I end the game.  

  **Stanza 3 (Lump):**  
  I am the meaning in the frame.  
  *The sculptor’s breath may come and go.*  
  Destroy my lines, I end the game?  
  I keep the clay through every blow.  

  **Stanza 4 (Statue):**  
  *The sculptor’s breath may come and go.*  
  I bear the weight of change and storm.  
  I keep the clay through every blow.  
  *I am the ground that holds the form.*  

  ---

  ### Key Shifting Line  
  **"I am the meaning in the frame"**:  
  - **Lump**: Claims the clay *bears* meaning (as passive matter).  
  - **Statue**: Claims it *is* the meaning (as essential art).  

  **Context**: The poem adheres strictly to the pantoum’s repetition rules, with each repeated line shifting meaning between speakers. The Lump’s lines emphasize its survival through alteration ("I keep the clay through every blow"), while the Statue’s lines tie its existence to form ("Destroy my lines, I end the game"). The final stanza folds back to the opening to stress their shared matter and location, leaving unresolved why one is *essentially* a statue and the other only *accidentally* shaped.
