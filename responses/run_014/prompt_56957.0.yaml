prompt: |-
  You're a social choice theorist who's also sat on real governance committees, and I want the version of this that's more specific than the Gibbard–Satterthwaite spiel that shows up in every voting-reform thread I've ever read. Think it through carefully: before you recommend anything, list every principle that's consistent with our track record, then run each one against the new case.

  I'm on my org's process committee (~900 members). Our precedents so far:

  - Plurality, two nominees: fine.
  - Plurality, five nominees: not fine — we minuted the worry that somebody most members rank last could take it.
  - IRV over those same five: fine, no reason minuted.
  - A deadlocked subcommittee proposed drawing one member's ballot at random and letting it decide the whole thing: not fine. Someone called it a dictatorship wearing a lottery costume.
  - A show-of-hands rule that's trivially gameable: fine for picking meeting times, not fine for the annual budget.
  - A bylaw tweak that made two of five nominees constitutionally unwinnable, though the rule was otherwise anonymous and non-dictatorial: not fine.

  New proposal for the chair election, five nominees: every member places the nominees on a single left–right line, and the nominee sitting at the median of the placed positions wins. It's provably manipulation-proof at the ballot stage (reporting your true spot is dominant), non-dictatorial, and every nominee stays winnable. The catch: the committee has to pick the axis first, in practice one person picks it, and with a badly chosen axis you can elect a nominee that a majority ranks below all four others.

  So — what should we decide if we want to be consistant with ourselves? Which precedent is the closest analog, what principle does each option silently commit us to, and what's the single fact about our past rulings that would best settle which principle we've actually been running all along? No citations needed, I'll add those if I turn this into a memo.
reasoning: |-
  We are given a set of precedents from the organization's history and a new proposal for electing the chair. We need to evaluate the new proposal for consistency with past decisions. Let's list the precedents and the principles they imply, then compare with the new proposal.

  **Precedents and Principles:**

  1. **Plurality, two nominees: fine.**
     - Principle: For two candidates, simple majority rule (which is equivalent to plurality) is well-accepted and strategy-proof in this case. There is no concern about a candidate that is ranked last by a majority winning because with two candidates, the one with the most votes is the majority winner.

  2. **Plurality, five nominees: not fine** — worried that someone most members rank last could win.
     - Principle: The method must not allow a candidate who is the last choice of a majority to win. This is a form of the **Condorcet loser criterion**: a candidate who loses in a head-to-head matchup against every other candidate should not win.

  3. **IRV over five nominees: fine, no reason minuted.**
     - Principle: The method must avoid the problem of a Condorcet loser winning. IRV (Instant Runoff Voting) does not necessarily satisfy the Condorcet criterion (it might not elect a Condorcet winner) but in practice, it often avoids electing a Condorcet loser. The committee accepted IRV without noting any such concern.

  4. **Drawing one member's ballot at random to decide: not fine** — called a "dictatorship wearing a lottery costume".
     - Principle: The method must not be equivalent to a dictatorship (even if randomized). This is a rejection of non-anonymous methods and a requirement of some form of equity (every vote should count, not just one). Also, it must not be arbitrarily concentrated on one voter.

  5. **Show-of-hands rule:**
     - **Fine for meeting times:** Principle: For low-stakes decisions, a simple and gameable method is acceptable.
     - **Not fine for annual budget:** Principle: For high-stakes decisions, the method must not be trivially gameable (i.e., must have some resistance to strategic manipulation).

  6. **Bylaw tweak making two of five nominees constitutionally unwinnable: not fine** (even though anonymous and non-dictatorial).
     - Principle: The method must not exclude candidates arbitrarily (without regard to voter preferences). This is a requirement of **universal admissibility** (all candidates should have a chance to win) or non-imposition (every candidate must be electable in some preference profile).

  **New Proposal: Median Voter Theorem-based System**

  - **How it works:** Each voter places the five nominees on a left-right line. The median position on that line wins.
  - **Properties:**
    - Strategy-proof in terms of reporting the true position (dominant strategy to report honestly) for the given axis.
    - Non-dictatorial and anonymous.
    - Every nominee is winnable (if the axis is chosen appropriately and if voters place that nominee at the median).
  - **Catch:** The committee must pick the axis (in practice, one person picks it). If the axis is badly chosen, it might elect a candidate that a majority ranks below all four others (i.e., a Condorcet loser).

  **Analysis of New Proposal Against Principles:**

  1. **Condorcet Loser Criterion (from Precedent 2):** 
     - The new proposal does not guarantee that a Condorcet loser will not win. If the axis is chosen poorly, the median candidate on that axis might be the Condorcet loser. This violates the principle from Precedent 2.

  2. **Avoiding Dictatorship (from Precedent 4):** 
     - The method itself is non-dictatorial and anonymous. However, the process of choosing the axis might be done by one person. This is not the same as a dictatorship over the ballots, but it does concentrate power in the hands of the axis-chooser. Precedent 4 rejected a random dictatorship because it gave one voter all the power. Here, one person (the axis-chooser) has a different kind of power: they can influence the outcome by setting the axis, which might lead to the election of a candidate that would not win under a different axis. This is a form of agenda control.

  3. **Gameability (from Precedent 5):** 
     - The voting stage is strategy-proof (so not gameable by voters in their placements). However, the axis-setting stage is critical and might be subject to manipulation by the committee (or the person) choosing the axis. This is a form of high-stakes gameability at the setup level, which for a chair election (a high-stakes decision) would be a concern.

  4. **Universal Admissibility (from Precedent 6):** 
     - The method does not make any candidate constitutionally unwinnable. Every candidate can win if they are placed at the median by enough voters (and if the axis is chosen appropriately). This is consistent.

  **Closest Analog Precedent:**

  The closest analog is **Precedent 2 (Plurality with five nominees)** because:

  - Both involve five nominees.
  - Both have the risk of electing a Condorcet loser (in the new proposal, only if the axis is bad, but in plurality, it can happen even with a well-defined axis).

  But note: Precedent 2 rejected plurality because of the Condorcet loser risk. The new proposal also has a Condorcet loser risk (contingent on the axis) and therefore should be subject to the same concern.

  However, Precedent 3 accepted IRV even though IRV can also elect a Condorcet loser in some cases (though it is less likely than in plurality). The committee did not minute any worry about that. So why was IRV accepted? Perhaps because the risk was perceived as low? Or because the method inherently reduces the chance of a Condorcet loser?

  The key difference is that in the new proposal, the risk is introduced by the choice of the axis, which is an external factor. This is a new dimension of vulnerability.

  **The Principle We've Been Running On:**

  Looking at the past rulings, the single most consistent principle that emerges is:

  - **Avoidance of Condorcet Losers:** Precedent 2 explicitly rejects a method because it might elect a Condorcet loser. Precedent 3 (IRV) was accepted without such a note, suggesting that the committee believes IRV does not have a significant risk of that (even though theoretically it can). Precedent 6 also implies that we want the winner to be one that could be the top choice of some configuration (but does not directly address Condorcet loser).

  Additionally, we have:

  - **Non-concentration of power:** Precedent 4 rejects a method that gives one voter all the power.

  **Applying to the New Proposal:**

  - The new proposal risks electing a Condorcet loser if the axis is chosen badly. This violates the Condorcet loser criterion in some scenarios.

  - The method also concentrates power in the axis-chooser (one person) who can potentially manipulate the outcome by choosing an axis that favors a particular candidate. This is similar to the rejection of the random ballot dictatorship (Precedent 4) because it gives one person (or a small group) undue influence.

  Therefore, the new proposal should be **rejected** for two reasons:

  1. It can elect a Condorcet loser (violating the principle from Precedent 2).
  2. The axis-chooser has the power to potentially manipulate the outcome (violating the principle from Precedent 4 about concentration of power).

  **What Single Fact from Past Rulings Best Settles the Principle?**

  The strongest fact is **Precedent 2**: the rejection of plurality for five nominees because of the risk of electing a candidate that most members rank last (a Condorcet loser). This shows that the committee is concerned about the possibility of a Condorcet loser winning. The new proposal, despite its strategy-proofness and other good properties, does not eliminate this risk and in fact introduces a new vulnerability (axis choice) that can lead to that outcome.

  Therefore, to be consistent, the committee should reject the new proposal on the grounds that it does not prevent the election of a Condorcet loser and because it gives undue power to the axis-chooser.

  **Recommendation:**

  Reject the new proposal. The committee should look for a method that satisfies the Condorcet loser criterion (or at least has a very low risk of violating it) and does not concentrate power in an individual for setting critical parameters.

  If the committee wishes to use a spatial method, they might consider using multiple dimensions (if the issue space is multi-dimensional) or a method that is less sensitive to the axis choice. Alternatively, they might use a Condorcet method (which by definition avoids Condorcet losers) if they are willing to accept the complexity.

  But note: the committee accepted IRV, which is not a Condorcet method and can in rare cases elect a Condorcet loser. However, the risk is lower than in plurality. The new proposal's risk is contingent on the axis, which is a new and controllable factor. If the committee trusts the axis-chooser to choose a representative axis, then they might accept it. But past precedents (especially Precedent 4) show a distrust of concentrated power.

  Given the high stakes of a chair election and the precedents, it is safer to reject.

  **Consistency Check:**

  - Precedent 2: Reject because of Condorcet loser risk -> New proposal has that risk (so reject).
  - Precedent 4: Reject because of concentrated power (random dictatorship) -> New proposal has concentrated power in axis-chooser (so reject).

  Thus, the new proposal violates two principles that led to rejections in the past.
answer: |-
  Based on your precedents and the need for consistency, I'll break this down systematically: first, extract the principles from your track record; second, apply them to the new proposal; third, identify the closest analog precedent; and finally, pinpoint the core principle that resolves this. I'll avoid abstract theory and focus on your org's concrete decisions.

  ### Step 1: Principles Extracted from Your Precedents
  Your rulings reveal six implicit principles, ranked by strength (based on how consistently they appear):

  1. **No Condorcet Losers (Strongest Principle)**  
     - From: Rejecting 5-nominee plurality (risk of someone "ranked last by most" winning).  
     - Principle: **A method must not allow a candidate who loses head-to-head against every other candidate to win.** This is non-negotiable for high-stakes elections.  

  2. **Universal Winnability**  
     - From: Rejecting the bylaw tweak that made two nominees "constitutionally unwinnable."  
     - Principle: **Every candidate must have a feasible path to victory under some voter preference profile.** Arbitrary exclusion is unacceptable.  

  3. **No Concentrated Power**  
     - From: Rejecting the random-ballot "dictatorship" and the high-stakes show-of-hands rule.  
     - Principle: **The method must not vest decisive power in one actor (voter or official), even probabilistically or via setup parameters.** Gameable rules are tolerated only for low-stakes decisions.  

  4. **Ballot-Stage Strategy Resistance**  
     - From: Accepting IRV (no minuted worries) vs. rejecting gameable show-of-hands for budgets.  
     - Principle: **For high-stakes votes, the ballot mechanism itself must resist tactical voting.** Low-stakes decisions get leniency.  

  5. **Anonymity & Non-Dictatorship (Baseline)**  
     - From: All accepted methods (plurality/IRV) are anonymous, and the "unwinnable" bylaw was rejected despite being non-dictatorial.  
     - Principle: **Anonymity and non-dictatorship are necessary but insufficient alone.** They don't override other principles.  

  6. **Outcome Robustness**  
     - From: Rejecting plurality for 5 nominees (fragile to vote-splitting) but accepting it for 2 (robust).  
     - Principle: **Methods must produce defensible outcomes across realistic scenarios, not just edge cases.**  

  ### Step 2: Apply Principles to the New Proposal  
  The median-voter proposal: Voters place nominees on a left–right line; the median position wins. It's ballot-stage strategy-proof, non-dictatorial, anonymous, and preserves universal winnability. The catch is the axis choice by one person, risking a Condorcet loser.  

  - **✓ Universal Winnability:** All nominees can win (e.g., if voters place them at the median). *Consistent with your rejection of the "unwinnable" bylaw.*  
  - **✓ Ballot-Stage Strategy Resistance:** Reporting true preferences is dominant. *Consistent with IRV acceptance and show-of-hands rejection for budgets.*  
  - **✓ Anonymity & Non-Dictatorship:** Votes are treated equally; no voter dictates outcomes. *Baseline met.*  
  - **✗ No Condorcet Losers:** **Fails.** If the axis is poorly chosen (e.g., orthogonal to voter preferences), the median winner could lose head-to-head to all others. Example: Voters rank nominees A>B>C>D>E, but the axis forces E to the median. *Directly violates your plurality rejection precedent.*  
  - **✗ No Concentrated Power:** **Fails.** The axis-chooser (likely one person) can manipulate outcomes by selecting a favorable axis. This is functionally identical to "agenda control" in social choice—a form of concentrated power. *Analogous to rejecting "random-ballot dictatorship," where one voter's preferences decide everything. Here, one official's axis choice decides everything.*  
  - **✗ Outcome Robustness:** **Fails.** Susceptible to axis manipulation or misalignment with voter preferences. *Inconsistent with rejecting 5-nominee plurality for fragility.*  

  ### Step 3: Closest Analog Precedent  
  **The 5-nominee plurality rejection is the strongest analog.**  
  - Why? Both cases involve:  
    - A high-stakes election with 5 nominees.  
    - A method that fails the **No Condorcet Losers** principle.  
    - Risk of an "unrepresentative" winner (plurality due to vote-splitting; median due to axis bias).  
  - Key difference: The median system's flaw is *upfront* (axis choice), while plurality's is *in the vote aggregation*. But your precedents treat outcome risks equivalently, regardless of origin (e.g., rejecting gameable show-of-hands for budgets due to risk, not because it *always* fails).  

  The "random-ballot dictatorship" rejection is a secondary analog due to concentrated power, but the Condorcet loser risk dominates here—it's the only principle that directly triggered a rejection for the *same election context* (5 nominees).  

  ### Step 4: Core Principle Settling Consistency  
  **The single fact that best resolves this:** Your rejection of 5-nominee plurality *solely on the risk of electing a Condorcet loser*—despite it being anonymous, non-dictatorial, and strategy-resistant in other ways.  

  - **Why this anchors everything:**  
    - You tolerated IRV (which can *theoretically* elect Condorcet losers but rarely does in practice) because the *minuted concern was explicitly about Condorcet losers*, and IRV mitigates that risk better than plurality.  
    - The median system *introduces a comparable Condorcet loser risk via axis choice*. Even though ballot-stage strategy is robust, your precedents show that ballot-stage properties alone don't override outcome risks (e.g., you rejected the "unwinnable" bylaw despite its anonymity).  
    - **Silent commitment:** By rejecting plurality for Condorcet loser risk and accepting IRV (with no minuted worries), you've prioritized **No Condorcet Losers** over **Ballot-Stage Strategy Resistance** for multi-candidate, high-stakes votes.  

  ### Recommendation: Reject the Proposal  
  To be consistent:  
  1. **Reject the median system** for chair elections. It fails your core principle (No Condorcet Losers) and secondary principle (No Concentrated Power).  
  2. **Stick with IRV** for 5+ nominee elections—it aligns with your history, and no minuted concerns exist.  
  3. **If exploring alternatives**, prioritize methods satisfying No Condorcet Losers (e.g., Condorcet methods like Ranked Pairs) and avoid setups concentrating power (e.g., delegate axis choice to a diverse subcommittee, not one person).  

  #### Why this isn't Gibbard-Satterthwaite redux  
  G-S is about *universal* strategy-proofness being impossible. Your precedents show you accept *pragmatic* strategy resistance (e.g., IRV) but draw the line at outcomes (Condorcet losers) and power concentration. The median system’s ballot-stage strategy-proofness isn’t enough to override your org’s intolerance for bad outcomes.  

  **Final note:** If you implement this, minute the axis choice as a separate vote requiring supermajority approval to dilute power. But given your history, IRV remains the safe choice.
