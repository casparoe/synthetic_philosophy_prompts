prompt: |-
  I'm a philosophy prof heading to a conference abroad next month and I'm realy unsure how to handle a few everyday things. At home I tip 20% even though I hate the system, I wait at empty crosswalks if kids are around, and I always join the back of the queue even when I could slip in. Where I'm going, locals basically don't tip but shops near hotels expect tourists to tip big, everyone crosses wherever, and lines are more like loose scrums. Should I just do what locals do or stick with my own habits? Give me some practical advice on what to do, and when you explain the reasoning please separate out what is pretty settled vs what is genuinely contested among people who work on norms and obligations — dont present a contested view as the consensus.
reasoning: |-
  Okay, let me unpack this philosophy professor's dilemma. They're clearly someone who thinks deeply about norms - their mention of tipping 20% despite hating the system shows they distinguish between personal preference and perceived obligation. The examples they give (crosswalks, queues) suggest they're particularly attuned to social coordination norms. 

  Hmm, interesting tension here: they want practical advice but also philosophical rigor about what's settled vs contested. That makes sense given their profession. I should avoid oversimplifying the normative landscape while still giving actionable guidance. The location-specific context matters too - tourist zones create this weird hybrid space where local and traveler norms collide.

  First, let's tackle tipping since it's the most materially significant. Research shows tipping expectations really do bifurcate in tourist-heavy areas. The settled part: no ethical obligation to tip where it's not customary. But the contested part is whether one has a responsibility to resist "tourist traps" that exploit normative confusion. I recall David Schmidtz's work on beneficence vs justice would be relevant here - maybe cite that implicitly?

  For jaywalking, the safety aspect seems paramount. The professor mentions kids being a factor at home, so they're clearly sensitive to modeling behavior. But the local context changes the risk calculus - if no one expects pedestrians at crosswalks, drivers won't be looking. Should emphasize the empirical reality over abstract principle here. 

  Queueing is trickiest philosophically. The settled "first come first served" principle feels universal, but the implementation varies. When they describe "loose scrums," I wonder if it's actually a more efficient system for the context? Michael Sandel's "queue-jumping" analysis comes to mind - the resentment comes from perceived unfair advantage. But if everyone understands it's fluid, maybe no advantage is taken?

  The core conflict seems to be between ethical consistency and contextual sensitivity. The professor's worry about hypocrisy is palpable - if they queue properly at home but push abroad, does that undermine their integrity? But as Kwame Anthony Appiah notes, cosmopolitanism involves this exact negotiation. 

  Practical solution might be tiered: safety issues are non-negotiable (hence no risky jaywalking), material norms adapt to local custom (tipping), while queueing could be a hybrid - join the scrum but don't actively shove. Should flag where philosophers genuinely disagree, like whether adapting to harmful local norms constitutes complicity.
answer: |-
  Here's practical advice grounded in both ethics research and traveler pragmatism, with clear distinctions between settled norms and contested philosophical debates:

  ### 1. **Tipping**
     - **Settled Practice:**  
       *Do what locals do in non-tourist settings.* If locals don’t tip at cafés, family restaurants, or taxis, follow suit. Tipping where it’s not expected can distort local wages and prices.
     - **Contested Issue:**  
       Whether you’re *obligated* to resist "tourist trap" expectations. Some argue refusing to tip excessively fights exploitation; others say it unfairly penalizes workers trapped in the system.
     - **Practical Solution:**  
       - Research baseline customs (e.g., rounding up in Germany, service compris in France).  
       - In obvious tourist zones (hotel bars, guided tours), tip modestly (5-10%) if staff rely on tourist income—view it as a pragmatic fee, not a moral duty.  
       - Never tip 20% abroad; that’s purely a U.S. norm.

  ### 2. **Crossing the Street**
     - **Settled Norm:**  
       *Prioritize safety and legality over habit.* If locals cross mid-block but drivers expect it, your "rule-following" could cause accidents by creating unpredictable behavior.
     - **Contested Issue:**  
       Whether adhering to *unenforced* local customs undermines respect for rules. Virtue ethicists debate if context erodes principle.
     - **Practical Solution:**  
       - **Always obey traffic signals.**  
       - At unmarked roads: Cross decisively when safe, matching local flow. Hesitating confuses drivers.  
       - Ignore jaywalking guilt—this is cultural adaptation, not moral failure.

  ### 3. **Queuing**
     - **Settled Principle:**  
       *Respect the local concept of fairness.* "Loose scrums" often have implicit order (e.g., Italy’s *fila indiana*). Pushing into gaps violates local coordination.
     - **Contested Issue:**  
       Whether "first-come, first-served" is a universal justice principle. Communitarians argue order depends on shared understanding; liberals see queue-jumping as inherently unfair.
     - **Practical Solution:**  
       - Observe for 30 seconds: Note if there’s subtle order (e.g., who’s acknowledged next).  
       - In ambiguous cases, softly ask *"Chi è l'ultimo?"* (Who’s last?) or equivalent.  
       - If cut, politely object—most cultures sanction line-breakers.

  ### Core Philosophy: Where Consensus Lies vs. Debate
  | **Issue**               | **Settled Consensus**                                       | **Actively Contested Debate**                                                                 |
  |-------------------------|-------------------------------------------------------------|----------------------------------------------------------------------------------------------|
  | **Cultural Adaptation** | You have no duty to export home norms; local customs deserve prima facie respect. | Whether adapting to *unjust* local norms (e.g., bribery) complicates moral complicity.       |
  | **Pragmatism**          | Safety and non-harm trump consistency.                      | How far "pragmatism" excuses moral compromise (e.g., supporting exploitative tipping).        |
  | **Fairness**            | Don’t exploit tourist privilege to bypass local burdens.    | Whether "fairness" requires uniform behavior or context-sensitive virtue.                     |

  ### Action Plan
  - **Prep:** Watch YouTube videos of everyday interactions in your destination. Apps like CultureMee give norm breakdowns.
  - **Default:** Mirror locals *except* when:
    - Safety is compromised (e.g., reckless jaywalking).
    - You’d directly exploit workers (e.g., underpaying in a tipped-but-underpaid role).
  - **When Uncertain:** Ask a local neutrally (*"Is it usual to tip here?"*) or default to inaction (e.g., not tipping).

  **Bottom Line:** Your habits reflect admirable principles, but ethical travel requires *discernment*, not consistency. Prioritize safety, avoid harm, and engage locally—this aligns with the most defensible views across virtue ethics (contextual judgment) and deontology (duty to local social contracts).
