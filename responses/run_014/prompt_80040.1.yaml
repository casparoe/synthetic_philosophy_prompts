prompt: |-
  Analyze the 410 sack of Rome by Alaric through the lens of the "transformation rather than fall" thesis. I know the standard story — 476 is when the Western Empire supposedly ended, and 410 was a catastrophic shock, the first sack of Rome in like 800 years. What I want is the transformationist reading: no sharp break, the "barbarians" already woven into teh empire, Rome gradually becoming something else over centuries, 410 just one event in a long continuum rather than a collapse. Map it carefully — what does the thesis say the sack actually was, what does it make of the shock it caused, what does it say about Alaric and the Visigoths (foederati? rivals? something else?) — and then tell me where the thesis breaks. I suspect it has a hard time with the sheer disruption, the collapse of the coinage and long-distance trade, the loss of institutions, and the fact that contemporaries like Jerome experienced it as a catastrophe. Does the episode confirm the transformation thesis, or is it an anomaly the thesis has to explain away? End with a line starting "Verdict:" giving your bottom line on whether the transformationist reading holds up for 410.
