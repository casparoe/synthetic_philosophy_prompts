prompt: |-
  I've been following the effective-altruism and rationalist discussions for a while now, and I keep seeing the shallow-pond example — you walk past a shallow, muddy pond, you see a child drowning, you can save the child by wading in at the cost of ruining your expensive shoes — used to argue that, if we're serious about consequentialism, we should give much more to the poor, that the moral demand is higher than we think, and that the people who walk past are morally culpable. I also keep hearing the demandingness objection: that if we take the pond seriously, we must give away everything above subsistence, and that this is simply too much. I want to understand how far the pond analogy actually holds. Can you give me the correspondence table — what plays the role of the child, the pond, the passerby, the shallow water, the ruined shoes — and then audit where the mapping breaks? I want you to separate the disanalogies that matter for the intended use (licensing the conclusion that we should give much more) from the ones that don't, identify which features of the pond the analogy quietly imports that the real world of giving lacks, and tell me whether the conclusion survives once the disanalogies are on the table, or whether the analogy was carrying it the whole time. Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating the question.
reasoning: |-
  Okay, the user wants me to analyze the shallow pond analogy used in effective altruism. They're familiar with the argument and the demandingness objection. The core question is how well the analogy maps to real-world charity and whether it truly supports giving more to the poor.

  First, I need to break down the analogy components. The child drowning represents those in extreme poverty facing imminent death. The shallow pond is the situation where aid is possible. The passerby is the potential donor. The ruined shoes symbolize the cost of donating. The ease of saving the child shows how simple interventions can prevent death.

  Now, where does this analogy hold? Proximity and identifiability. In the pond scenario, the child is right there, making the need feel urgent and personal. But in real-world giving, beneficiaries are distant and anonymous. That might reduce emotional urgency. Then there's the certainty of outcome. Saving the child has a guaranteed result, but donations might not due to inefficiencies in charities. Also, the pond is a one-time act, whereas poverty requires sustained efforts. The passerby is the only savior in the analogy, but in reality, many can contribute, which might lead to diffusion of responsibility. The cost is clear and immediate in the pond—ruined shoes—but donating involves opportunity costs that are harder to quantify.

  The user might be grappling with the moral weight of the analogy versus practical realities. They might feel pressured by the analogy but struggle with its demands. Their deeper need could be understanding if the obligation to give remains valid despite these disanalogies. They might also be seeking justification for not giving "enough" or reassurance that their contributions matter even if not perfect.

  The conclusion that we should give more still stands because the core principle—preventable suffering obligates action—is robust. However, the analogy oversimplifies by ignoring systemic issues and scalability. Effective altruism addresses some disanalogies by focusing on cost-effective charities and evidence-based interventions. So while the analogy isn't perfect, it successfully highlights the moral imperative, even if the real-world application requires more nuanced approaches. The user might need validation that their concerns about disanalogies are legitimate but that the ethical core remains strong.
answer: |-
  **The shallow-pond analogy successfully establishes the core moral principle that we have a significant obligation to help prevent severe, easily preventable harm to identifiable others at moderate cost to ourselves, and this principle robustly supports giving more to effective charities addressing extreme poverty, despite several important disanalogies weakening its *intuitive force* but not its *logical core*.**

  Here's the correspondence table and audit of disanalogies:

  | **Analogy Component** | **Real-World Correspondence** | **Holds for Conclusion?** | **Breaks? (Impact on Conclusion)** |
  |------------------------|--------------------------------|---------------------------|-----------------------------------|
  | **Drowning Child**     | People dying preventable deaths (e.g., malaria, diarrhea, starvation) in extreme poverty | **✓ Core** (Severe, preventable harm) | ✗ **Proximity/Identifiability**: Distant/statistical victims lack visceral urgency. *Weakens intuitive pull but not moral weight*. |
  | **Shallow Pond**       | Global context where aid/intervention is possible | **✓ Core** (Situation demanding action) | ✗ **Scale/Complexity**: Poverty is systemic, not isolated. *Requires systemic solutions but doesn't negate individual duty to act*. |
  | **Passerby (You)**     | Affluent individual in a position to donate | **✓ Core** (Agent capable of preventing harm) | ✗ **Uniqueness as Rescuer**: Many potential helpers exist. *Raises free-rider problems but doesn't absolve individual obligation*. |
  | **Shallow Water**      | Low cost/high effectiveness of aid (e.g., bed nets, deworming) | **✓ Core** (Feasible, high-impact intervention) | ✗ **Certainty of Outcome**: Aid efficacy varies (corruption, unintended consequences). *Mitigated by donating to evidence-based charities*. |
  | **Ruined Shoes**       | Financial cost of donating (e.g., $50 for shoes ≈ $5,000/year donation) | **✓ Core** (Moderate personal sacrifice) | ✗ **Scope of Sacrifice**: Sustained giving ≠ one-time act; involves ongoing opportunity costs. *Increases demandingness but doesn't invalidate the duty to give significantly more than most do*. |

  **Key Disanalogies & Their Impact on the "Give More" Conclusion:**

  1.  **Proximity/Identifiability (Breaks):** The pond's immediacy triggers visceral empathy absent for distant, statistical victims. This is a *psychological* disanalogy weakening the analogy's *rhetorical power* and *motivational force*, but not the *moral logic*. The harm (death) is equally severe, and preventability remains.
  2.  **Certainty & Direct Causality (Breaks Partially):** In the pond, saving the child is guaranteed. Aid effectiveness varies. However, evidence for interventions like AMF (Against Malaria Foundation) shows high certainty per dollar for lives saved. This disanalogy *demands selecting effective charities* but doesn't undermine the duty when effectiveness is demonstrable.
  3.  **Scale & Perceived Agency (Breaks):** The passerby is uniquely positioned. Global poverty involves millions of potential helpers, creating diffusion of responsibility. This is a *practical* challenge for mobilizing *sufficient* action, but not an *ethical* excuse for *individual* inaction when one's contribution has predictable positive impact.
  4.  **Sustained vs. One-Off Cost (Breaks):** Ruining shoes is a single act. Addressing poverty requires sustained giving. This significantly *increases demandingness*, making "give to subsistence" seem plausible. However:
      *   The core principle ("prevent severe harm at moderate cost") still demands giving *far more* than typical donations (e.g., 1-10% income vs. ~0.1% average).
      *   "Moderate cost" is relative; giving significantly more than one does now without reaching subsistence is morally required by the principle.
      *   The analogy *overstates* subsistence as the only stopping point – diminishing marginal utility of wealth allows giving more than subsistence while preserving significant well-being.
  5.  **Systemic Causes vs. Accidental Harm (Breaks):** Poverty stems from complex historical/systems factors, not a random accident. This *contextual* difference matters for *policy solutions* but doesn't change the *immediate moral imperative* to save identifiable lives now when possible. We don't let accident victims die while fixing road design.

  **Conclusion's Survival:** The analogy's core logical structure – preventing severe, easily avertable harm to others at moderate personal cost is obligatory – survives the disanalogies. The disanalogies (especially proximity, diffusion of responsibility, and uncertainty) explain *why* we fail to act intuitively as the analogy suggests we should, but they don't provide a *moral justification* for inaction when highly effective interventions exist. The demandingness objection highlights a *practical tension* (how much is "moderate" cost over a lifetime?) but doesn't refute the conclusion that most affluent people should give *significantly more* than they currently do to effective poverty alleviation charities. The analogy's power lies in exposing this inconsistency; its limitations require pragmatism in application, not abandonment of the principle.
