prompt: |-
  So here's my situation: I'm an odds compiler for a small online bookmaker, mostly football. On a normal day I'll price up maybe a dozen markets before kick-off and then babysit the in-play board when the matches go live, which means repricing constantly while bets are still landing. I've been trying to read a bit of the philosophy of probability on my commute, and I gather there's a whole literature about "Dutch books" — betting schemes that guarantee whoever takes the bets loses money no matter how the event turns out — and about what a set of odds has to satisfy to be "coherent". There's also apparently a named update rule for how you should move your numbers when new information arrives mid-event (conditionalisation? something like that). Most of the formalism goes over my head, but the practical point stuck: if my prices aren't consistent with each other, some clever punter can stitch together a few bets with us and lock in a profit at our expense, without needing to know anything about football at all.

  What I want is a procedure the desk can actually run. Constraints: a full check on a market has to take about ten minutes, because we reprice too often for anything slower, and it has to be followable by someone whose maths stops at percentages — one of our lads is brilliant on football but panics the moment fractions appear. The procedure should list the checks in order, say what counts as a pass, and be explicit about what to do when a check fails: can we patch a single price, or does the whole market need suspending while we sort it out? It also needs to cover the awkward cases: bets on combinations of outcomes (someone backs "draw or away win" rather than a single result), accumulators that pull together different markets on the same match, and the in-play situation where a goal goes in and every line has to move at once while the bets keep flooding in. And please be honest about which bits of the procedure are just my judgement dressed up as maths — deciding what the actual probabilities are is surely still down to opinion, and I'd rather the procedure admit that than pretend otherwise. Same for the margin: we build in an overround of around 6%, and I'd like to know whether the checks apply to the raw prices, the margin-inflated ones, or both.

  Then run the procedure on three cases so I can see it work. First, a pre-match situation where we're quoting match odds and a first-goalscorer market on the same game, and I have a nagging feeling the two boards don't agree with each other. Second, in-play: a red card in the 60th minute with the match-odds board open and stakes arriving every second — what exactly do we do, in what order, and how long can things stay live? And third, please include at least one case where the procedure gives an answer I'm not going to like — I suspect there's a scenario where the safe move is to suspend a popular market right at the moment it's taking the most money, which will go down terribly with my manager, so I'd like to see that case worked through honestly rather than softened. Oh, and one admin thing: the whole team is UK-based, so please write the reply in British English. Sorry if that was rambly — happy to clarify any of it, and feel free to tell me if I've misunderstood what the Dutch book idea is actually about, because I definately might have.
reasoning: |-
  Alright, the user is an odds compiler for a small online bookmaker, focusing on football. They need a practical procedure to ensure their odds are "coherent" to avoid Dutch books—situations where bettors can guarantee a profit by exploiting inconsistent odds. They've mentioned key constraints: the check must take about ten minutes, be understandable by someone with basic math skills, cover combination bets and accumulators, and handle in-play scenarios like red cards. Also, they want honesty about where judgment comes in versus strict math.

  First, I need to break down the core requirements. Coherence means the odds must follow probability rules, specifically avoiding arbitrage. The key is ensuring that all implied probabilities sum correctly, especially across related markets like match odds and first goalscorer. The user mentioned a 6% overround, so the procedure must account for the margin-inflated prices, not raw probabilities.

  The user's team might not be strong in math, so the process has to avoid complex calculations. Using percentages and simple additions makes sense. They need clear pass/fail criteria and specific actions for failures. For example, if a combination bet's implied probability exceeds 100% plus margin, that's a fail.

  Handling in-play situations is crucial. When a red card happens, odds need immediate adjustment. Suspending the market might be necessary if inconsistencies are found, but the user is worried about backlash from management. I should include a case where suspension is unavoidable, even if unpopular.

  The three test cases are essential to demonstrate the procedure. Pre-match with match odds and first goalscorer: check if the sum of goalscorer probabilities aligns with the draw probability. If not, adjust the odds. In-play red card: suspend, check coherence, adjust, and relaunch. The third case should force a suspension during high traffic, like accumulators creating arbitrage across markets.

  I should clarify that the margin applies to the implied probabilities. The checks are on the posted odds, not the true probabilities. Judgment comes in setting initial odds, but coherence is a mathematical must. Also, accumulators need checking across markets to ensure no combined arbitrage.

  For the unpopular scenario, if multiple markets like match result and both teams to score have inconsistent odds, a suspension might be needed to fix all lines. That’ll frustrate the manager but is necessary to prevent guaranteed losses. Emphasizing transparency here is key—admitting that math overrides opinion in coherence checks.
answer: |-
  Right, let's get this sorted. You're spot on about the core idea: **coherent odds prevent a "Dutch book" – a combination of bets across your markets that guarantees the punter a profit *regardless of the outcome*, funded purely by your inconsistency.** It's free money for them and a guaranteed loss for you, no football knowledge needed. The maths (mostly probability axioms and Bayes' theorem for updating) underpins it, but we can distill it into practical checks.

  **Core Principle:** The sum of the **implied probabilities** (converted from your odds) for all mutually exclusive outcomes in a single market *must* be greater than 100% (your overround) but *must never* imply a probability greater than 100% for any single outcome or logical combination of outcomes. Crucially, **outcomes linked across different markets must also be consistent**.

  **Key Definitions for the Desk:**
  1.  **Implied Probability (IP):** `IP = 1 / Decimal Odds`. (e.g., 2.0 odds = 1/2.0 = 50%). *This is the cornerstone. Everything hinges on this.*
  2.  **Overround (OR):** Your built-in margin. Target ~6%. Calculated as `(Sum of IPs for all outcomes in a market) - 100%`. (e.g., Sum IPs = 106% -> OR = 6%).
  3.  **Mutually Exclusive Outcomes:** Only one can happen (e.g., Home Win, Draw, Away Win).
  4.  **Exhaustive Outcomes:** Cover all possibilities (e.g., Win/Draw/Loss covers the match result).
  5.  **Logical Combinations:** Outcomes like "Draw or Away Win" (D/AW). Its IP *must* be equal to `IP(Draw) + IP(Away Win)`.

  **The 10-Minute Coherence Check Procedure (Football Focused)**

  **Personnel:** One compiler (you or the football expert). Basic calculator or spreadsheet essential.

  **Input:** Current decimal odds for all outcomes in the markets you're checking (e.g., Match Odds (H, D, A), Correct Score, First Goalscorer (FGS), Over/Under, Both Teams to Score (BTTS), specific player markets).

  **Step 1: Single Market Sanity Check (2 mins per market)**
  *   **Action:** For each market (H/D/A, FGS list, CS list, etc.):
      1.  Calculate the IP for *every* outcome.
      2.  Sum all the IPs.
      3.  Calculate the Overround: `Sum(IPs) - 100%`.
  *   **Pass:** Sum(IPs) > 100% (OR > 0%) AND no single IP >= 100%. (e.g., Sum IPs = 106.3%, all individual IPs < 100% -> PASS).
  *   **Fail:**
      *   *Single IP >= 100%:* **SUSPEND IMMEDIATELY.** This is a critical error. Adjust that single price aggressively downwards.
      *   *Sum(IPs) <= 100%:* **SUSPEND IMMEDIATELY.** You are offering arbitrage on this market alone. Increase prices (lower odds) across the board or decrease the most out-of-line favourites.
  *   **Judgement Call:** The *exact* OR (6.1% vs 5.9%) is your judgement. The *requirement* that OR > 0% and no IP >= 100% is maths.

  **Step 2: Combination Bets *Within* a Market (3 mins)**
  *   **Focus:** Markets where bets like "Draw or Away Win", "Over 1.5 Goals", "BTTS: Yes" are offered explicitly or are easily constructed.
  *   **Action:**
      1.  Identify key combinations (D/AW is crucial in Match Odds, O1.5/U1.5 in Totals, etc.).
      2.  Calculate the IP of the combination *from the odds you are offering for that specific bet* (e.g., Odds for D/AW = 1.80 -> IP(D/AW Bet) = 1/1.80 = 55.56%).
      3.  Calculate the *logical* IP of the combination: `IP(Outcome1) + IP(Outcome2) + ...` (e.g., IP(Draw) + IP(Away Win). Say IP(D) = 30%, IP(A) = 35% -> Logical IP(D/AW) = 65%).
  *   **Pass:** `IP(Combination Bet)` is **very close to** `Logical IP(Combination)`. (e.g., 55.56% vs 65% is a **FAIL**; 62% vs 65% might be acceptable tolerance depending on OR, 64% vs 65% is likely PASS).
  *   **Fail:** `IP(Combination Bet)` << `Logical IP(Combination)`. This means your specific combination bet odds are **too long** (high), making it significantly under-priced compared to the sum of its parts. **ADJUST THE COMBINATION BET ODDS DOWNWARDS (SHORTEN)**. If the discrepancy is massive (>5% absolute difference), consider a brief suspension for that specific combo market while you fix it.
  *   **Judgement Call:** The *tolerance level* for "very close" depends on volatility and your margin. A 1-2% absolute difference might be manageable within a 6% OR. A 5% difference is dangerous. The *requirement* that `IP(Combo Bet) <= Logical IP(Combo)` is strict maths (offering > would guarantee loss if someone bets all parts). We err on making the combo bet odds slightly shorter than the strict sum implies.

  **Step 3: Cross-Market Consistency Check (The Dutch Book Crucible - 5 mins)**
  *   **Focus:** Logically linked markets (e.g., Match Result (H/D/A) + First Goalscorer (FGS); Match Result + Correct Score (CS); Match Result + BTTS; Half-Time/Full-Time + Match Result).
  *   **Action:**
      1.  **Identify Key Links:** For FGS, it's linked to *who wins the match* (or draw). For CS, it's linked to the match result *and* total goals.
      2.  **Check FGS vs. Match Result (Example):**
          *   Calculate `IP(Home Win)` from Match Odds.
          *   Sum the IPs of *all* `Home Player` FGS odds. Call this `SumIP(FGS H Players)`.
          *   **Crucial Point:** `SumIP(FGS H Players)` represents the probability *a home player scores first AND Home wins*. But it *also includes* the probability *a home player scores first AND the match is a Draw or Away Win*. We need to isolate the first part.
          *   **The Check:** `SumIP(FGS H Players)` **must be less than** `IP(Home Win)`. Why? Because if a Home player scores first, Home is more likely to win, but not guaranteed. `SumIP(FGS H Players)` includes scenarios where Home concedes later and draws/loses. Therefore, logically: `SumIP(FGS H Players) < IP(Home Win)`. Similarly, `SumIP(FGS A Players) < IP(Away Win)`. `SumIP(FGS Any Player)` should be close to `1 - IP(No Goalscorer)`.
          *   **Check Specific Outcomes:** Calculate the IP for a specific, probable link. E.g., `IP(Home Win & Harry Kane FGS)` calculated two ways:
              *   From Accumulator: `IP(H Win) * IP(Kane FGS | H Win)` (This is your *judgement* of the conditional probability).
              *   From Cross-Market: `IP(H Win) * [IP(Kane FGS) / SumIP(FGS H Players)]` (This uses your current FGS market as a proxy for conditional probability).
          *   Compare these two IPs. Convert them to fair odds (`1 / IP`) and compare to the accumulator odds you'd offer (or are offering).
  *   **Pass:** Cross-market inequalities hold (`SumIP(FGS H) < IP(H Win)`, etc.) AND specific cross-market IPs are *reasonably consistent* (within ~3-5% absolute IP difference). Accumulator odds imply a combined IP that is *slightly higher* (worse for the punter) than the product of the individual market IPs (building OR on OR).
  *   **Fail:**
      *   *Violated Inequality (e.g., SumIP(FGS H Players) >= IP(Home Win)):* **SERIOUS ERROR. SUSPEND BOTH MARKETS IMMEDIATELY.** This is a flashing red light for a Dutch Book. Punters could bet heavy on all Home FGS players and then bet against Home Win (or on Draw/Away) for a guaranteed profit if Home wins. Requires full reassessment of both markets, starting with FGS prices likely being too short (odds too low) or Home Win odds too long.
      *   *Significant Specific Outcome Mismatch (e.g., Kane H Win accumulator IP much lower via one calculation):* **ADJUST THE MORE LIQUID OR EASIER-TO-MOVE MARKET.** Usually, tweak the FGS price or the accumulator terms. If the mismatch is extreme and liquidity is high, consider a brief suspension of the affected accumulator or the minor market.
  *   **Judgement Call:** Setting the *initial* `IP(H Win)`, `IP(Kane FGS)`, and `IP(Kane FGS | H Win)` is pure football judgement. The *requirement* for the inequalities (`SumIP(FGS H) < IP(H Win)`) and the *need for reasonable consistency* between ways of calculating linked outcomes is maths (avoiding Dutch Books). **The Margin applies to the IPs derived from your posted odds.** You check the coherence of the *prices you've posted*, including your overround.

  **Procedure Summary Table**

  | **Step** | **Check Type** | **Key Action** | **Pass Criteria** | **Fail Action** | **Time (mins)** |
  |----------|----------------|----------------|-------------------|-----------------|----------------|
  | **1**    | Single Market  | Calculate all IPs → Sum → OR | OR > 0%<br>All IPs < 100% | **SUSPEND:**<br>• Single IP ≥100%<br>• OR ≤0% | 2 per market |
  | **2**    | Within-Market Combos | Compare offered combo IP vs sum of component IPs | Offered IP ≈ Logical IP (1-2% tolerance) | **ADJUST:** Shorten combo odds<br>**SUSPEND if >5% discrepancy** | 3 |
  | **3**    | Cross-Market Links | Check inequalities (e.g., ∑FGS_H < IP_H)<br>Compare specific outcome IPs | Inequalities hold<br>Specific IPs consistent (3-5% diff) | **ADJUST:** Tweak relevant markets<br>**SUSPEND BOTH if inequality violated** | 5 |

  **Handling In-Play (Red Card - 60th Minute)**

  1.  **IMMEDIATE ACTION:** Press the "SUSPEND" button on **ALL** active markets for this match. Yes, stakes are pouring in. **This is non-negotiable.** The red card fundamentally changes *everything*. Trading through this without suspension is Russian Roulette with your book.
  2.  **Assess Impact (1 min):** Which markets are most affected? Match Odds, CS, Goals Markets, Cards, Win to Nil? Prioritise these.
  3.  **Run Coherence Checks (8 mins):** Focus intensely on Steps 1 & 3 for the core markets (Match Odds, CS, O/U). Adjust your odds *aggressively* based on the new situation (1 man down = huge shift). **Crucially re-run the cross-market checks (Step 3):** Does `SumIP(FGS H)` still make sense vs the new `IP(H Win)`? (Probably not! Adjust FGS down). Do the new Correct Scores logically sum to the new Match Odds probabilities? Do the new O/U lines fit the expected goal distribution given the red card?
  4.  **Consistency First, Speed Second:** It's better to be suspended for 8 minutes with coherent odds than live for 8 minutes with a Dutchable book. Communicate the suspension clearly on the site ("Market Suspended - Major Incident").
  5.  **Re-Launch (1 min):** Once core markets are coherent and repriced, re-open them simultaneously. Then work on less critical markets (Next Goalscorer, exact minute, etc.), running quicker checks.

  **Case 1: Pre-Match - Match Odds vs. First Goalscorer (Your Nagging Feeling)**
  *   Match Odds: H: 2.10 (IP: 47.6%), D: 3.60 (IP: 27.8%), A: 3.80 (IP: 26.3%) → Sum IP = 101.7% (OR: 1.7% - a bit light, but pass Step 1).
  *   FGS Market: Home Star Striker (HSS): 5.00 (IP: 20%), Other Home Players: Sum IP = 15% (Total SumIP FGS H = 35%). Away Star Striker (ASS): 7.00 (IP: ~14.3%), Other Away Players: Sum IP = 10% (Total SumIP FGS A = 24.3%). No Goalscorer: 11.00 (IP: 9.1%). *Sum All FGS IPs = 35% (H) + 24.3% (A) + 9.1% (No) = 68.4% → OR ~31.6% (High, but passes Step 1).*
  *   **Step 3 Check - Inequality:** `SumIP(FGS H Players) = 35%`. `IP(Home Win) = 47.6%`. 35% < 47.6%? **Yes (Pass).** `SumIP(FGS A Players) = 24.3%` < `IP(Away Win) = 26.3%`? **Yes (Pass).** `SumIP(Any FGS) = 68.4%` ≈ `1 - IP(No Goalscorer) = 100% - 9.1% = 90.9%`? **68.4% vs 90.9% - HUGE MISMATCH! FAIL.**
  *   **Analysis:** Your FGS market massively under-prices the chance of *any* goalscorer compared to the Match Odds + No Goalscorer odds. The No Goalscorer IP (9.1%) implies a 90.9% chance someone scores. But your entire FGS market only sums to 68.4%! This is a major inconsistency.
  *   **Action:** **SUSPEND FGS MARKET.** The prices are too long (high odds, low IPs). You need to significantly shorten the odds (increase IPs) across almost all FGS players, especially the more likely ones, and possibly adjust No Goalscorer slightly. Re-run Step 1 & Step 3 checks before relaunching. Your nagging feeling was right!

  **Case 2: In-Play - Red Card (60th Min)**
  Followed the In-Play procedure above:
  1.  **SUSPEND ALL MARKETS.** (Manager groans, traders curse, but it's essential).
  2.  **Assess:** Red card to Home team. They were slight favourites (H: 2.30, D: 3.50, A: 3.20). Away now strong favourites. Goals markets swing towards Away.
  3.  **Run Checks (Focus: Match Odds, O/U 2.5, Next Goal):**
      *   *Match Odds:* Drastically adjust: H: 6.00 (IP:16.7%), D: 4.50 (IP:22.2%), A: 1.57 (IP:63.7%) → Sum IP = 102.6% (OR:2.6% - Pass Step 1).
      *   *O/U 2.5:* Was 1.90/1.90 pre-red. Adjust based on lowered expectation: Over 2.5: 2.30 (IP:43.5%), Under 2.5: 1.65 (IP:60.6%) → Sum IP=104.1% (Pass Step 1).
      *   *Next Goal:* Home: 5.00 (IP:20%), Away: 1.40 (IP:71.4%), No Goal: 15.00 (IP:6.7%) → Sum IP=98.1% → **FAIL STEP 1 (OR < 0%!)**. Oops, too generous on Away Next Goal.
  4.  **Action:** Adjust Next Goal odds: Away: 1.33 (IP:75.2%), Home: 6.00 (IP:16.7%), No Goal: 13.00 (IP:7.7%) → Sum IP=99.6% (still slightly off, but within tolerance for now). **Cross-Check:** Does `IP(Away Win)` (63.7%) make sense vs `IP(Away Next Goal)` (75.2%)? Yes, logically higher chance they score next than win outright. Relaunch core markets after ~7 minutes suspension. Refine Next Goal and others live with smaller adjustments.

  **Case 3: The Unpopular Suspension (Accumulator Arbitrage)**
  *   **Scenario:** Pre-match. You have very sharp (low margin) prices on a popular match due to high liquidity.
      *   Market A (Match Result): H: 1.95 (IP:51.3%), D: 3.80 (IP:26.3%), A: 4.00 (IP:25.0%) → Sum IP=102.6% (OR:2.6%).
      *   Market B (BTTS): Yes: 1.75 (IP:57.1%), No: 2.10 (IP:47.6%) → Sum IP=104.7% (OR:4.7%).
  *   **Individually:** Both pass Step 1 comfortably.
  *   **The Accumulator Issue:** A clever punter looks at H Win (1.95) and BTTS Yes (1.75). Your offered accumulator odds: `1.95 * 1.75 = 3.4125` (approx 3.40).
  *   **The Coherence Check (Step 3 - Specific Outcome):** What should the IP for "Home Win and BTTS Yes" be?
      *   *Judgement:* You estimate 45% chance of HW, and *if* HW, a 70% chance BTTS happens → `IP(HW & BTTS) = 45% * 70% = 31.5%`. Fair Odds ~3.17.
      *   *From Your Prices:* The *minimum* logical IP for "HW & BTTS" is `max(0, IP(HW) + IP(BTTS Yes) - 100%) = max(0, 51.3% + 57.1% - 100%) = 8.4%` (Fair Odds ~11.90). The *maximum* logical IP is `min(IP(HW), IP(BTTS Yes)) = min(51.3%, 57.1%) = 51.3%` (Fair Odds ~1.95). Your judgement (31.5% / 3.17) sits within this range.
      *   **The Problem:** Your *accumulator odds* (3.40) imply `IP(HW & BTTS) = 1 / 3.40 = 29.4%`. Your *judgement* says 31.5% (Fair Odds 3.17). **You are offering *better* odds (3.40) than your own judgement of the fair price (3.17)!** Worse, compare to the cross-market calculation: `IP(HW) * IP(BTTS Yes) = 51.3% * 57.1% ≈ 29.3%` (Fair Odds ~3.41). Your accumulator odds (3.40) imply *almost exactly* this probability (29.4%), **but you've built NO MARGIN into the accumulator!** (`IP(A) * IP(B)` = 29.3%, Accumulator IP = 29.4%).
  *   **The Dutch Book Risk:** Punters pile into the HW & BTTS Yes accumulator at 3.40. This is essentially a bet on a single outcome ("H Win and Both Teams Score"). You are offering odds with an IP (29.4%) derived directly from the *margin-included* probabilities of the separate markets. **You have applied no *additional* overround to the accumulator itself.** While not a strict arbitrage *yet* (because the outcomes aren't perfectly linked for a guaranteed loss *yet*), you are offering a complex outcome at near zero margin while taking significant risk. If your initial sharp prices are truly efficient, you are barely covering your edge on this popular bet. If your prices have *any* slight inconsistency favouring this combo, or if money floods in, you could be exposed.
  *   **The Unpopular Action:** **SUSPEND THE ACCUMULATOR MARKET (and possibly related combo markets like "Win & BTTS")** for this match. Recalculate the accumulator odds, building in at least a 3-5% overround *on top* of the combined probabilities. Instead of `(1.95 * 1.75) = 3.4125`, offer `(1.95 * 1.75) / 1.04 ≈ 3.28` (adding ~4% OR). **Yes, this means suspending a popular bet taking lots of money at a crucial time. Yes, your manager will hate it.** Explain: "We identified a zero-margin position on a high-risk accumulator. We must protect the book and rebuild margin before reopening. Trading through guarantees giving away value." The maths (coherence and margin application) forces this.

  **Key Takeaways for the Desk:**

  1.  **IP is Everything:** Drill converting odds to IP (`1 / decimal odds`) into everyone. This is the language of coherence.
  2.  **Margin Applies to Posted Prices:** Your checks are on the odds you publish (which include your OR). Coherence is about consistency *between these published odds*.
  3.  **Suspension is Your Friend:** It's not failure; it's responsible trading. Use it when Step 1 fails catastrophically, Step 3 inequalities are violated, or critical accumulators lack margin. "Better safe than Dutch booked."
  4.  **Judgement vs. Maths:** You *judge* the true probabilities and initial prices. The *maths* tells you if those prices, once set and including your margin, are consistent with each other to prevent guaranteed losses. The procedure forces you to check the maths protects your judgement.
  5.  **Cross-Market is Key:** The most dangerous Dutch books lurk between markets (Match Odds + FGS, Match Odds + Correct Score, Win/BTTS accumulators). Prioritise these checks.
  6.  **Speed + Rigour:** 10 minutes is tight. Focus checks on high-risk areas (combos within markets, links between major markets). Suspension buys you time if needed.

  This procedure won't catch every tiny edge, but it will slam the door shut on the most glaring and exploitable inconsistencies that lead to guaranteed losses. It balances practicality with the essential mathematical safeguards. Good luck!
