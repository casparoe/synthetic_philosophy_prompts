   Step 2: Jordan
     - Jordan says that if a fact doesn't move you to value something, then it's not a reason to value it. This is a subjectivist view. However, in philosophy, we often recognize that there can be normative reasons that are not motivating (i.e., external reasons). So Jordan is oversimplifying. Also, the "wrong kind of reasons" problem is a recognized issue, so it's not just confusion. We'll say "mostly wrong".

   Step 3: Sam
