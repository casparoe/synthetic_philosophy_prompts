  Right, structuring this requires reverse-engineering from the knockout punch about falsification. Each preceding question must progressively box in the deflection tactics: start where he's comfortable (audience-relative justification), then escalate to where the moves ring hollow. The self-refutation question needs framing as internal incoherence rather than external competition—that bypasses the "rival theory" deflection. For the coping question, emphasizing predictive success without representation might corner him. And the science/politics disparity should highlight consequences, not ontology. 

  Noteworthy that the user insists on British English phrasing—"whilst," "rubbish" etc.—to match their delivery. Also no biographical fluff; every question must weaponize his own arguments. The follow-ups are crucial: anticipate his rehearsed responses and have logical traps ready. For instance, when he inevitably says pragmatism isn't a theory, the follow-up should demand why anyone should adopt his recommended subject-change over Aquinas's. 

  *checks requirements again* Ah, and the falsifiability finale must force him to concede something could genuinely undermine neopragmatism, or expose its unfalsifiable dogma. That's the mic-drop moment. 

