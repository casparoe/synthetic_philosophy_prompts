  Okay, the user runs a student group focused on rationality and philosophy, with members mainly in their second and third years studying math and philosophy. They have no background in decision theory beyond basics like the Prisoner's Dilemma and Newcomb's problem. The user wants to teach updateless decision theory (UDT) in 90 minutes using a whiteboard, but previous attempts have failed because the explanation sequence was off. They need a solid plan to make the concept click.

  First, I need to understand the main challenges. The audience is familiar with the standard "maximize expected utility given current beliefs" approach. Introducing the idea of choosing a policy before observations might seem pointless to them. The user also wants to address the misconception that updatelessness means never updating on evidence, which is a common confusion. Plus, they need to briefly touch on the difference between the original UDT (full policy commitment) and the refined version (mapping observations to actions) without getting bogged down in details.

  The user is torn between using transparent-box Newcomb or the "chicken with the universe" scenario. Transparent-box Newcomb is a variant where the agent can see the contents before deciding, making it a good test case. The chicken scenario involves a predictor punishing exploitable policies, which might be too complex for an opener. I think starting with transparent-box Newcomb is better because it directly shows the problem with updating: if you see the money, you might one-box, but if you see it's empty, you're tempted to two-box. UDT resolves this by committing to one-box regardless of the observation.

  I need a step-by-step plan that leads the students to realize the necessity of updatelessness. Start with their existing knowledge: expected utility maximization. Use classic Newcomb to highlight the conflict between causal and evidential decision theory. Then introduce transparent-box Newcomb to show how updating leads to suboptimal outcomes. This sets the stage for UDT as the solution.

  Key misconceptions to address: One is that UDT means never updating beliefs. But UDT separates belief updates for prediction from the decision policy. Another is thinking that UDT requires precommitting to specific actions regardless of circumstances, which isn't practical. Clarifying that it's about mapping observations to actions, not ignoring them, is crucial.

  The user also wants to know what to skip in 90 minutes. Avoid deep dives into logical uncertainty, probabilistic UDT, or multiple updateless agents. Focus on the core concept using one strong example. End with a question to check understanding, like how they'd apply UDT to the transparent-box case or a new scenario.

  Structure the session in phases: Problem Setup, Why CDT/EDT Fail Here, UDT as a Solution, Key Clarifications, and Ending Strong. Use the whiteboard to diagram decision trees and compare outcomes. Emphasize that UDT chooses the strategy that leads to the best expected outcome from the start, even if individual actions seem counterintuitive.

  Finally, the chicken scenario could be mentioned as a note but not central. Stress that UDT is about optimal strategies, not ignoring evidence. Make sure to reinforce that observations are still used within the policy, just not as a basis to deviate from the precommitted strategy.
answer: |-
  Here's a battle-tested 90-minute plan designed to make UDT feel *necessary* and intuitive, not arbitrary. The core is **Transparent Boxes Newcomb** – it's the "killer app" for UDT and exposes the flaw in updating *in this specific dependency* perfectly.

  **The Core Sequence: Why "Updateful" Fails Before UDT Shines**

  1.  **Grounding & The Default (5 mins):**
      *   **Start:** "We make decisions based on *what we know*. We see evidence, update beliefs, maximize expected utility. Simple, right? `EU(action | observation)`. This is our CDT/EDT-ish baseline. Let's call this **Updateful Decision Theory** (UDT's evil twin)."
      *   **Whiteboard:** Draw a simple decision tree (e.g., take umbrella/not, see clouds/not). Show belief update based on clouds -> action choice. Label this flow: Observation -> Belief Update -> Action Choice -> Outcome.

  2.  **Classic Newcomb: The Temptation & The Conflict (15 mins):**
      *   **Recap:** "Predictor, Box A ($1M iff predicts 1-box), Box B ($1K). Predictor is near-perfect."
      *   **EDT vs CDT Tension:** "EDT says 1-box: `P($1M | 1-box) >> P($1M | 2-box)`. CDT says 2-box: Your choice *now* can't affect the *past* filling of Box A, so take both."
      *   **Audience Poll:** "Who would 1-box? Who would 2-box? Why?" (Let them argue briefly). Acknowledge the intuitive pull of both sides.
      *   **Key Point:** "Notice: The predictor's accuracy *links* your decision *now* to its prediction *in the past*. Your action is *evidence* about the past state. But CDT refuses to act on that evidence causally. This feels messy."

  3.  **Introduce the Crucial Dependency: Predictor Reacts to *Policy* (5 mins):**
      *   **The Shift:** "What if the predictor isn't predicting your *specific action* on Tuesday, but predicting the *kind of decision-maker* you are? Specifically, the *rule* or *strategy* you use to turn observations into actions?"
      *   **Whiteboard:** Draw a new flow: **Strategy (Policy) ->** Predictor Predicts (based on Policy) -> **Observation** -> Action (via Policy) -> **Outcome**.
      *   **Highlight:** "The predictor sets up the world (Box A filled?) based on *your entire decision rule*, BEFORE you see anything! Your observation (what you see in the boxes) is *downstream* of your policy. This dependency is key."

  4.  **Transparent Boxes Newcomb: Where Updateful Crashes (20 mins)**
      *   **Setup:** "The boxes are made of glass! Before you choose, you *see* whether Box A has $1M or is empty. Predictor is still near-perfect, predicting your *policy*."
      *   **Whiteboard:**
          *   Policy Options: `ALWAYS_1BOX`, `ALWAYS_2BOX`, `SEE_AND_TAKE` (Take Box A only if you see money, else 2-box).
          *   Predictor Prediction: If predicts `ALWAYS_1BOX` -> Fill Box A. If predicts `ALWAYS_2BOX` or `SEE_AND_TAKE` -> Leave Box A empty. (Assume `SEE_AND_TAKE` is recognized as exploitable).
          *   Outcomes Table:
              | Your Policy       | Predictor Predicts | Fills Box A? | You SEE... | You DO... | You GET... |
              | :---------------- | :----------------- | :----------- | :--------- | :-------- | :--------- |
              | `ALWAYS_1BOX`     | `ALWAYS_1BOX`      | YES ($1M)    | $1M        | 1-Box     | **$1M**    |
              | `ALWAYS_2BOX`     | `ALWAYS_2BOX`      | NO ($0)      | $0         | 2-Box     | $1K        |
              | `SEE_AND_TAKE`    | `SEE_AND_TAKE`     | NO ($0)      | $0         | 2-Box     | $1K        |
              | `SEE_AND_TAKE`    | `SEE_AND_TAKE`     | NO ($0)      | $0         | 2-Box     | $1K        | *(Same row twice for emphasis - outcome is always $1K)*
      *   **Analysis:**
          *   "If you commit to `ALWAYS_1BOX`, predictor fills it, you see $1M, you 1-box, get $1M. Great!"
          *   "If you commit to `ALWAYS_2BOX`, predictor leaves it empty, you see $0, you 2-box, get $1K. Bad."
          *   **The Updateful Trap (`SEE_AND_TAKE`):** "Seems smart! *If I see money, I'll 1-box to get it. If I see nothing, I'll 2-box to get the $1K.* But what does the predictor do? It sees this policy is *exploitable* – if it predicts this policy, it leaves Box A empty. *You always see $0*. So you always 2-box and get $1K. Worse than `ALWAYS_1BOX`! Updateful thinking (`EU(action | observation)`) trapped you into a worse outcome *overall* because it ignored the predictor's reaction to your *whole rule*."
      *   **The Pain Point:** "`SEE_AND_TAKE` feels like the rational thing *in the moment* based on what you see ('Why leave money? Why not take the $1K?'). But committing to it *in advance* guarantees the predictor screws you. The *dependency* bites you."

  5.  **Updateless Decision Theory: Choosing the Best Policy (15 mins)**
      *   **The Core Idea:** "UDT says: **Before you see *anything*, before any observation, you choose the *entire policy* (the mapping from possible observations to actions) that leads to the best *expected outcome*, given how the world (e.g., the predictor) reacts to that policy.**"
      *   **Reframing the Choice:** "You're not choosing 'What do I do *now* that I see $0?' You're choosing, right now: 'What kind of decision-maker do I want to *be*? Do I want to be an `ALWAYS_1BOX`-er, an `ALWAYS_2BOX`-er, or a `SEE_AND_TAKE`-er?' You look at the outcome table: `ALWAYS_1BOX` gets $1M, the others get $1K. So you choose to *be* an `ALWAYS_1BOX`-er."
      *   **Whiteboard:** Circle `ALWAYS_1BOX` on the outcome table. Draw a big arrow: "Choose Policy HERE" pointing to the start of the flow diagram (before Predictor acts).
      *   **Crucial Nuance:** "UDT doesn't mean you *literally don't see* the boxes! When you are an `ALWAYS_1BOX`-er, you *do* see the $1M. But your *policy* says 'Always take only Box A', so that's what you do. The observation is an *input* to your pre-chosen policy function, not a reason to *deviate* from it. You *use* the observation, but you don't *update* your *decision rule* based on it."

  6.  **Defusing Misconceptions & Refinements (15 mins)**
      *   **Misconception #1 (Never Update!):** "UDT does **NOT** mean never updating beliefs! *Prediction* still requires updating. If you see dark clouds, you update `P(rain)` and use that to *feed into* your pre-chosen policy. UDT separates *updating beliefs for prediction* from *choosing the decision rule*. You update to *inform* the inputs to your fixed policy function, not to *change* the policy itself mid-game when dependencies exist."
      *   **Misconception #2 (Precommit to Specific Actions):** "UDT doesn't mean precommitting to 'Always carry an umbrella on July 15th, 2025' no matter the weather. It means precommitting to a *function*: 'If I see dark clouds (Observation X), I carry an umbrella (Action Y). If I see clear skies (Observation Z), I leave it (Action W).' It's **mapping observations to actions**."
      *   **Original vs Refined:** "The *original* UDT idea was indeed 'choose your entire policy before *any* observations'. The *refined* version clarifies it's about choosing this mapping function. The core insight – optimizing over mappings considering upstream dependencies – is the same. We're focusing on the refined view: choosing the **function** f(Observation) -> Action."
      *   **"Chicken with the Universe" (Briefly):** "This is just another scenario exploiting the same flaw. A predictor punishes agents using policies that would lead them to 'defect' in a dilemma *if* they saw certain things. Only agents committed to 'cooperate' *regardless* of spurious observations get rewarded. It reinforces the point: exploitable updateful policies lose."

  7.  **What We're NOT Covering (2 mins - Be Explicit)**
      *   "In 90 minutes, we *won't* dive into: Logical uncertainty (what if the predictor's accuracy depends on complex math?), probabilistic UDT, multiple interacting UDT agents, or detailed comparisons to every other decision theory. We're focusing on the *core mechanic*: optimizing policy mappings under dependency."

  8.  **The Understanding Check Question (3 mins - End Here)**
      *   **Pose:** "Imagine you are facing the Transparent Boxes Newcomb problem. You are about to choose your policy. An audience member shouts: *'But if you see Box A is empty, clearly you should two-box and get the $1K! It's right there! Why would you one-box on nothing?!'* How do you, as a UDT agent, explain why you commit to `ALWAYS_1BOX` anyway?"
      *   **What You Want to Hear:** They should articulate:
          1.  The predictor reacts to the *whole policy*, not the momentary action.
          2.  Committing to `SEE_AND_TAKE` (the 'rational' updateful response) guarantees Box A is empty, so you only ever get $1K.
          3.  Committing to `ALWAYS_1BOX` causes Box A to be full, leading to $1M.
          4.  The $1K you see when Box A is empty is tempting, but taking it only happens *because* you chose a policy that made Box A empty in the first place. Choosing `ALWAYS_1BOX` avoids that trap.
          5.  You *do* see the emptiness if it happens, but your policy dictates one-boxing regardless, because deviating would mean you didn't truly commit to the winning policy.

  **Why This Sequence Works & Carrier Example Choice**

  *   **Transparent Boxes is Essential:** It makes the flaw in updateful blindingly obvious. `SEE_AND_TAKE` feels locally rational but is globally disastrous. You *literally see* the consequence of the policy dependency ($0 in Box A). Classic Newcomb lacks this visceral "I see it but can't touch it" tension. Chicken is great but more complex; save it as reinforcement.
  *   **Order is Logical:** Starts with their intuition -> shows conflict -> introduces key dependency (policy matters) -> demonstrates updateful failure spectacularly -> presents UDT as the *only* solution that works -> immediately defuses major misconceptions -> checks understanding via the core dilemma.
  *   **UDT Lands Naturally:** By the time you get to step 5, choosing the policy `ALWAYS_1BOX` feels like the *only* sane choice after seeing the disaster of `SEE_AND_TAKE`. The "point" is proven by the failure of the alternative.
  *   **Misconceptions Preempted:** The structure forces the "never update?" question to arise. Addressing it *right after* explaining UDT, using the umbrella example, and clearly separating belief-update from policy-choice is key. The "precommit to actions" is addressed by constantly emphasizing the *mapping*.
  *   **Realistic Scope:** Focusing 90% on one crystal-clear example (Transparent Boxes) makes the core idea stick. Mentioning Chicken briefly shows it's a general pattern without derailing.

  **Whiteboard Focus:** Use it heavily for the flow diagrams and the Transparent Boxes outcome table. Seeing the dependencies and the hard numbers for the policies is crucial. Good luck! This sequence has worked wonders when I've used it.
