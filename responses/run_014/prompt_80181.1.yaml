  We want to simulate four configurations, each enabling exactly one learning mode and disabling the other three. The four modes are:

  1. **Darwinian**: No within-lifetime learning. Adaptation only by natural selection across generations. Each agent has a fixed behavior (e.g., a fixed movement pattern). When an agent dies (from starvation or old age) or after a fixed generation time, it reproduces (if it has gathered enough energy) and passes its behavior to offspring (with possible mutation). The population adapts by differential survival and reproduction.

