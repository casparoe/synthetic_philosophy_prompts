  3. **Popperian**: Agents can simulate actions internally without real-world consequences. They have an internal model of the world (which might be imperfect) and can test hypotheses (e.g., "if I go to location X, will there be food?") without moving. Only when they are confident do they act. Mistakes in the internal model are cheap (they don't die from a wrong simulation).

  4. **Gregorian**: Agents learn by observing others. They can copy the behavior of successful agents. The behavior spreads through the population without every agent having to discover it independently.

  We need to design the scenario such that we can isolate each mode.

