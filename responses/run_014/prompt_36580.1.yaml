prompt: |-
  I'm teaching a grad seminar on formal epistemology this term, and we just finished objective chance (Lewis's Principal Principle) and are about to do Reflection (van Fraassen). After last week's session a student hung around and asked me something I've been chewing on ever since, and now I want to see how someone else would organize the whole thing. The two principles look structurally parallel: the Principal Principle tells you to set your credences to match what you take the objective chances to be, conditional on that chance assignment, while Reflection tells you to set your current credences to match what you expect your future credences to be, conditional on having them. Chance on one side, your own future self on the other — both are deference principles, just with a different expert.

  But the failure modes are interestingly different, and this is where I want the comparison to bite. The Principal Principle looks broken when the "expert" isn't independent of your evidence — the old undermining problem, where information about how things will actually go bears on what the chances themselves are, so you can't conditionalize on the chance hypothesis and defer to it in one motion. Reflection looks broken in cases where you can foresee your own irrationality: you know that after the third glass of wine you'll be confident you're fine to drive, but you shouldn't defer to that future confidence now. So one natural diagnosis is that both principles are instances of a single deeper rule — something like "defer to X only if you treat X as an expert" — and neither chances nor future selves get that status for free. My student thinks this makes Reflection the more fundamental one, since self-trust is in some sense built into epistemology from the ground up; I keep wanting to say chance is the real expert and my future self is at best a stand-in for it when I expect to be epistemically lucky.

  So here's what I want from you: compare the two principles seriously, not just note the parallel and move on. Is Reflection really just the Principal Principle in a mirror, or is the disanalogy deeper than the shared structure suggests? Which principle is better defended on its home turf, and can either be repaired using the resources of the other — e.g., can the style of fix people proposed for the undermining problem, where you tinker with what exactly you're conditionalizing on, be ported over to handle Reflection's foreseen-irrationality cases? Take a position and defend it; my student and I have gone back and forth for a week and neither of us will budge, so I'm curious what a tiebreaker looks like. Please don't just survey the literature — I want an actual verdict on which deference principle, if either, deserves the status of the more basic one.
reasoning: |-
  Okay, let's tackle this. The user is teaching a formal epistemology seminar and has been debating with a student about the relationship between the Principal Principle (PP) and Reflection. They see both as deference principles but with different experts—chance for PP and future self for Reflection. The key issue is the failure modes: PP breaks with undermining futures, while Reflection fails with foreseen irrationality. The user wants a deep comparison, not just a surface-level parallel, and a verdict on which principle is more fundamental.

  First, I need to recall the core of each principle. PP says current credence should match objective chances conditional on that chance being true. Reflection says current credence should match expected future credences conditional on having them. Both involve conditioning on the expert's opinion. The structural similarity is clear: C(A | ch(A) = x) = x for PP, and C_t(A | C_{t+}(A) = y) = y for Reflection.

  But the failure modes are different. PP's undermining problem happens when evidence about the future affects the chance hypothesis itself. For example, knowing a coin's future outcome might undermine the chance assignment. Reflection fails when you know your future self will be irrational, like after drinking wine. So both require the expert to be independent or trustworthy, but in different ways.

  The user and their student are stuck. The student thinks Reflection is more fundamental because self-trust is basic in epistemology. The user leans towards chance as the real expert. I need to decide which one is more basic. 

  Looking deeper, PP's authority comes from metaphysical grounds—chances govern outcomes. Reflection's authority is epistemic, based on anticipated rationality. When Reflection works, it's because the future self is better informed or rational. But it's derivative because it relies on the future self aligning with evidence, which ties back to chances. 

  Can the fixes for PP be applied to Reflection? For PP, solutions like the New Principle condition on entire chance theories instead of single values. For Reflection, maybe condition on future rationality. But that's tricky—defining rationality without circularity. Reflection's fix might need external standards, like evidence or chances, which loops back to PP. 

  So PP seems more fundamental. Chances are the objective bedrock. Reflection works when the future self is expected to track truth, which depends on evidence and chances. Without PP, Reflection lacks grounding. The foreseen irrationality issue shows that future credences aren't inherently experts; they need to align with reality, which chances describe.

  But the user wants a verdict. I think PP is more basic. It's tied to the world's structure, while Reflection depends on one's epistemic trajectory respecting that structure. Even in self-trust, it's trust in correctly responding to objective factors. So PP underpins a well-functioning Reflection. The student's view has merit—self-trust is central—but it's secondary. Without an objective standard, self-trust could be misplaced. PP provides that standard.
answer: |-
  Here's a comparative analysis of the Principal Principle (PP) and Reflection (RP), arguing that **PP is the more fundamental deference principle**, though both are indispensable and share a common logical structure. The disanalogies in their failure modes reveal why RP *depends* on PP (or a similar objective standard) for its normative force, not vice versa.

  ---

  ### **1. Structural Parallelism: Shared Core Logic**
  Both principles are instances of **expert deference**:
  - **PP**: \( C(A \mid \text{ch}(A) = x) = x \)  
    *Defer to chance: set credence to \( x \) if you know the chance is \( x \).*
  - **RP**: \( C_t(A \mid C_{t+}(A) = y) = y \)  
    *Defer to your future self: set current credence to \( y \) if you know your future credence will be \( y \).*

  **Common structure**: Both require conditioning on a proposition (*chance = x* or *future credence = y*) and setting credences equal to the value specified by that proposition. Both fail when the "expert" is **correlated with evidence you possess** or **unreliable in a way you can anticipate**.

  ---

  ### **2. Divergent Failure Modes: Why They Aren't Symmetric**
  The failures reveal a crucial disanalogy in the *source* of expertise:

  | **Failure Mode**          | **Principal Principle (PP)**                     | **Reflection (RP)**                              |
  |---------------------------|--------------------------------------------------|--------------------------------------------------|
  | **Core Issue**            | *Undermining futures*: Evidence about outcomes bears on chance hypotheses (e.g., a chaotic coin-toss sequence affecting the chance estimate). | *Foreseen irrationality*: Future self is predictably misinformed, biased, or impaired (e.g., wine-induced overconfidence). |
  | **Diagnosis**             | Chance isn't *epistemically independent* of your evidence. | Future self isn't *epistemically superior* or rational. |
  | **Implied Fix**           | Restrict deference to cases where chance is "admissible" (Lewis) or use the *New Principle* (condition on the *entire chance theory*, not single values). | Restrict deference to cases where future self is *rationally improved* (e.g., has more evidence, no cognitive defects). |
  | **Nature of Expertise**   | **Metaphysical**: Chance is an *objective feature of the world* governing frequencies/outcomes. | **Epistemic**: Future self is a *proxy for better-informed rationality*. |

  **Key disanalogy**:  
  - PP fails when chance is *objectively* compromised as an expert (due to metaphysical dependencies).  
  - RP fails when the future self is *subjectively* compromised as an expert (due to anticipated epistemic flaws).  
  **This asymmetry suggests RP’s authority is derivative**: it relies on the future self tracking *something objective* (e.g., truth, evidence, chances), while PP’s authority is grounded in chance’s *metaphysical role*.

  ---

  ### **3. Why PP is More Fundamental**
  #### **A. PP Grounds the Normative Force of RP**
  RP only works if you expect your future self to be *better aligned with reality*. But what does "better aligned" mean? It presupposes an objective standard for credences—precisely what PP provides via chances.  
  - **Example**: You defer to your sober future self because you expect them to *respond correctly to new evidence*, which (via PP) should track chances. If chances didn’t exist, RP would collapse into arbitrary self-trust.  
  - **Defense**: PP is **world-oriented** (chances are "how the world is"), while RP is **process-oriented** (future credences are "how I will respond"). Epistemology requires both, but the process aims at the world.  

  #### **B. RP Can Be Partially Reduced to PP, Not Vice Versa**
  If your future self is rational, their credences will satisfy PP (i.e., they’ll defer to chances). Thus:  
  \[
  \text{RP} \approx C_t(A \mid C_{t+}(A) = y \land \text{PP}_{t+}) = y
  \]  
  ...where \(\text{PP}_{t+}\) means your future self obeys PP. RP *inherits* its force from PP.  
  - **Counterexample**: If future you *violates* PP (e.g., ignores chances), you *shouldn’t* defer to them via RP—confirming that RP’s validity depends on PP-compliance.  
  - **Irreducibility of PP**: Chance deference can’t be reduced to self-deference. Even an ideally rational agent obeys PP *because chances are fundamental*, not because they trust themselves.

  #### **C. Repair Strategies Favor PP’s Primacy**
  - **PP’s Fix (New Principle)**: Handle undermining by conditioning on the *complete chance theory* \(T\):  
    \[ C(A \mid T) = \text{ch}(A \mid T) \]  
    This works because it respects chance’s metaphysical role.  
  - **RP’s Fix (Rational Reflection)**: Restrict to cases where future self is rational:  
    \[ C_t(A \mid C_{t+}(A) = y \land R_{t+}) = y \]  
    ...but \(R_{t+}\) (future rationality) *requires* that \(C_{t+}\) satisfies PP! RP’s fix thus *presupposes* PP. Without an objective standard of rationality (e.g., alignment with chances), "rationality" is circular.

  ---

  ### **4. Verdict: PP as the Bedrock**
  - **PP is more basic**: Its authority stems from the **metaphysical structure of indeterminism**. Chance is the "expert" because it *governs* outcomes.  
  - **RP is derivative**: It’s a heuristic for *expected epistemic improvement*, valid only when your future self is anticipated to track PP or similar objective norms. Self-trust is built into epistemology *only insofar as the self tracks truth*—and truth is mediated by objective chances.  
  - **Why your student is half-right**: Self-trust *is* foundational in *methodology* (we have no other access to truth), but PP is foundational in *metaphysics* (it tells us *why* self-trust is warranted when it is).  

  **Tiebreaker recommendation**: Frame PP as the "constitution" of epistemic norms (defining what rationality *is*), and RP as a "statute" that works only when aligned with the constitution. Both are essential, but PP grounds the system.

  ---

  ### **Teaching Suggestion**
  Use this dialectic:  
  1. Show the structural parallel (both are deference rules).  
  2. Contrast failure modes to reveal RP’s dependence on objective norms.  
  3. Argue that RP *needs* PP to avoid bootstrapping: without chances, "rational" future credences have no target.  
  4. Concede that RP has practical primacy—we *use* it daily—but PP has metaphysical primacy.  

  This satisfies both intuitions: your student’s (self-trust is inescapable) and yours (chance is the real expert), while explaining why they’re not competitors.
