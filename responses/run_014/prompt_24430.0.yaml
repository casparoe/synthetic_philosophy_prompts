  ## The Demandingness Objection: A Confused Revolt Against Moral Reality

  The demandingness objection stands as one of the most persistent challenges to consequentialism, particularly its act-utilitarian variant. It asserts that consequentialism requires agents to sacrifice their personal projects, relationships, and well-being to an excessive, even crushing, degree whenever doing so would produce marginally greater net good. This, critics argue, renders the theory practically untenable and morally alienating, collapsing the vital distinction between obligatory actions and supererogatory ones. While intuitively powerful, I contend this objection fundamentally **rests on a confused, anthropocentric picture of what morality requires** and fails to deliver a fatal blow to sophisticated consequentialist theories. Its force derives primarily from psychological discomfort and unexamined prior moral commitments, not from a sound critique of the consequentialist structure of moral reasoning.

  ### The Objection Articulated and Its Core Arguments

  The objection crystallizes around several key claims:
  1.  **Extreme Sacrifice:** Consequentialism demands constant, life-consuming altruism (e.g., donating all income beyond bare necessities, dedicating life to charity work).
  2.  **Erosion of the Personal:** It leaves no "moral space" for legitimate personal commitments or projects not directly maximizing impartial good.
  3.  **Collapse of Supererogation:** Heroic acts of self-sacrifice become strict obligations, eliminating the category of the morally praiseworthy "above and beyond."
  4.  **The "Ought Implies Can" (OIC) Argument:** Morality cannot coherently demand the impossible or deeply psychologically unsustainable. Constant maximal sacrifice exceeds normal human motivational capacities and psychological resilience, violating OIC.

  ### Consequentialist Defenses: Diagnosis and Refinement

  Consequentialists offer potent responses, revealing the objection's shaky foundations:

  1.  **Rejecting the Confused Picture of "Ought":** The core confusion lies in expecting morality to conform to our desires for comfort and personal flourishing. Morality, from the consequentialist perspective, is fundamentally *impartial* and *outcome-oriented*. Its "ought" tracks the *impersonally best state of affairs*, not the agent's convenience or psychological ease. The sense of "excessive demand" arises precisely because we *prefer* a morality less disruptive to our self-interest. This is not an argument against consequentialism; it's a lament that morality is demanding. As Shelly Kagan forcefully argued, the intuition behind demandingness often relies on an unjustified "appeal to cost," assuming without warrant that personal cost inherently limits obligation. The moral "ought" isn't constrained by what we *want* to do, but by what *objectively needs doing* to alleviate suffering and promote well-being.

  2.  **Refining "Ought Implies Can":** Sidgwick rightly noted that OIC applies primarily to *physical* and *logical* impossibility, not to *difficulty* or *strong disinclination*. While consequentialism might demand actions that are psychologically *hard*, they are rarely *impossible* for most agents. Furthermore, a sophisticated consequentialist theory incorporates *feasibility constraints* within its evaluation of acts. "Can" includes reasonable assessments of psychological strain and long-term effectiveness. Demanding constant burnout may be counterproductive; a sustainable level of giving over a lifetime likely produces more good than a brief, self-destructive spurt. Thus, OIC, properly understood, often mitigates the *practical application* of demands without undermining the *theoretical principle* of maximizing the good. The objection conflates "demanding" with "genuinely impossible."

  3.  **Satisficing Consequentialism (and its Limits):** Michael Slote proposed "satisficing" consequentialism, where agents are obligated only to produce a *good enough* outcome, not the *best possible*. This aims to preserve moral space for the personal. However, this strategy is deeply problematic. It introduces an arbitrary threshold: *why* is *this* level of good "enough" when more preventable suffering exists? It seems inherently unstable and morally complacent. Why is stopping at "enough" praiseworthy when surpassing it is possible? Satisficing often appears as an *ad hoc* concession to the objection rather than a principled development of consequentialism. It sacrifices the core consequentialist insight – that more good is always better, morally speaking – to appease a pre-theoretical desire for less demandingness.

  4.  **The Scalar Approach and the Obligation/Permission Distinction:** A more promising route, championed by Alastair Norcross, is the *scalar* interpretation. Consequentialism fundamentally tells us that acts are better or worse *to the degree* they promote the good. The concept of "obligation" (a deontic "ought") is then layered on top of this scalar evaluation, incorporating considerations of feasibility, personal cost, and rules of thumb for reliable good-promotion in complex social contexts. **This is the key to dissolving the objection.** What critics label "excessively demanding" acts are often *optimal* on the scalar scale but not strictly *obligatory*. Obligation kicks in at a threshold significantly above doing harm but significantly below maximal sacrifice. Giving 10% might be obligatory; giving 50%, while better, might be supererogatory. This distinction isn't arbitrary (like satisficing) but stems from recognizing the psychological and social realities necessary for sustained moral engagement and effective coordination. We *permit* less-than-maximal acts not because they are morally neutral, but because demanding the maximum is often counterproductively rigid.

  5.  **Non-Sacrificial Core (Cottingham):** John Cottingham argues that morality's core function is *prohibiting harm*, not *mandating beneficence*. While consequentialists can acknowledge the psychological salience of harm avoidance, this view severely truncates morality's scope. Preventing easily avoidable suffering *is* a core moral demand, and consequentialism provides the most coherent framework for understanding its extent. Framing demandingness solely as an issue of excessive beneficence ignores that consequentialist demands often stem from the imperative to *prevent* immense harms (e.g., global poverty, preventable disease) that our comfortable lives tacitly perpetuate.

  ### Verdict: The Objection Fails; Scalar/Hybrid Consequentialism Endures

  The demandingness objection, while highlighting the *psychological friction* inherent in confronting the true scale of preventable suffering in the world, **does not succeed as a refutation of consequentialism.** Its power stems from:

  1.  **An Unjustified Expectation:** The desire for a morality that neatly accommodates our self-interest and personal projects without significant disruption.
  2.  **Conflating Difficulty with Impossibility:** Misapplying OIC to psychological reluctance rather than genuine incapacity.
  3.  **Ignoring Consequentialist Resources:** Failing to engage with sophisticated accounts that distinguish scalar goodness from deontic obligation, incorporating feasibility and sustainability.

  The objection reveals more about common moral psychology's limitations than a flaw in consequentialist logic. Morality *is* demanding, especially in an unjust world where immense suffering is preventable at moderate cost to the affluent. To reject consequentialism because it acknowledges this uncomfortable truth is to prioritize comfort over moral reality.

  **What survives is a refined, psychologically and socially realistic consequentialism.** **Scalar consequentialism**, recognizing that moral value comes in degrees, provides the most robust foundation. Upon this, we build a theory of *obligation* that incorporates "ought implies can" in a robust sense (physical/logical possibility plus long-term feasibility), acknowledges the diminishing marginal utility of sacrifice, and employs rules of thumb ("give significantly," "pursue impactful careers") that reliably approximate good promotion in complex social contexts. **Rule consequentialism** also offers a viable path, where rules generating the best overall consequences (including sustaining agent motivation and social cohesion) define obligations, which may not require constant maximal personal sacrifice. Hybrid approaches incorporating agent-centered *prerogatives* (à la Samuel Scheffler), though requiring careful justification within the consequentialist framework, can further delineate the space where personal projects are permitted, even if not optimal, without abandoning the ultimate standard of the good.

  Ultimately, the demandingness objection fails because it mistakes the symptom (our discomfort with impartial morality's requirements) for the disease (a flaw in the theory). Consequentialism, in its most sophisticated scalar or rule-based forms, survives not by denying the demands of impartial benevolence, but by offering a nuanced, actionable, and *true* account of what morality, in a world of profound need, genuinely requires of us. It is not the theory that is confused about "ought"; it is the objection that is confused about the uncompromising nature of moral reality.
