answer: |-
  **Bottom line:** The core tension lies between **structural tolerance** (handling radical glyph variation without predefined parts) and **context sensitivity** (explaining why letter identification is influenced by surrounding letters/words), as these pull towards invariant abstraction and flexible, situated processing respectively, challenging unified accounts.

  ### Desiderata for a Theory of Letterform Categorization (Human Cognition Focus)

  1.  **Novelty Tolerance (First-Exposure Recognition)**  
      *   **Case:** Instantly recognizing an 'a' in a never-before-seen font, without feedback.  
      *   **Requirement:** The theory must explain how invariant conceptual identity is extracted from entirely novel visual forms based purely on structure/relationships, not memorization.  
      *   **Status:** Non-negotiable. Rejects template matching and rigid feature lists.

  2.  **Radical Structural Tolerance (Cross-Style Commonality)**  
      *   **Case:** Recognizing the same letter identity across a single-story `ɑ`, a two-story `a`, and a blackletter `𝖆` (where shared features are minimal/non-obvious).  
      *   **Requirement:** The theory must account for deep commonality despite drastic topological/feature differences, without relying on a fixed set of parts or metrics. It must explain the *limits* of this tolerance (failure point).  
      *   **Status:** Non-negotiable. **Crucially excludes prototype averaging** (which blurs distinct structures), simple feature lists, and rigid structural descriptions. This requirement carries significant weight in excluding common candidates.

  3.  **Robustness to Degradation (Handwriting/Sloppiness)**  
      *   **Case:** Recognizing an 'a' in messy, distorted, fragmented, or sloppy handwriting, up to the point of illegibility.  
      *   **Requirement:** The theory must explain graceful degradation and the specific *kind* of structural integrity that must be preserved for recognition to succeed vs. fail.  
      *   **Status:** Non-negotiable. Challenges template matching and fixed feature thresholds.

  4.  **Orthogonal Extraction of Category and Style**  
      *   **Case:** Instantly recognizing both the specific letter identity ('a') *and* the coherent style/family of a completely novel, invented alphabet (where glyphs share no direct similarity to known letters but form a systematic set).  
      *   **Requirement:** The theory must explain how abstract letter identity ("a-ness") is separated from and extracted concurrently with the abstract stylistic "gestalt" of the entire alphabet. It must specify the relational invariants defining category *and* the relational invariants defining style/family coherence.  
      *   **Status:** Non-negotiable. Directly challenges accounts based solely on holistic similarity or low-level features.

  5.  **Contextual Modulation (Word Superiority & Interaction)**  
      *   **Case:** Letters are identified faster and more accurately within a familiar word context than in isolation.  
      *   **Requirement:** The theory must incorporate how surrounding letters/words influence the perception and categorization of a target glyph. Recognition cannot be purely bottom-up, feedforward processing of the target glyph alone.  
      *   **Status:** Non-negotiable. **Creates tension with Structural Tolerance/Invariance.** A purely invariant structural description struggles to explain why context changes recognition speed/accuracy. This requirement powerfully excludes purely structural or template-based accounts that lack top-down/interactive processing.

  6.  **Case Relationship (Uppercase/Lowercase)**  
      *   **Case:** The relationship between 'A' and 'a' – are they one concept, two linked concepts, or a structured pair?  
      *   **Requirement:** The theory must specify the nature of the representational link between uppercase and lowercase forms of the same letter, accounting for their distinct structures but shared identity/function.  
      *   **Status:** Important, potentially negotiable in detail (different theories may model this link differently), but any theory must address it meaningfully.

  7.  **Descriptive Flexibility (Handling Missing Parts)**  
      *   **Case:** Applying a structural description like "bowl + stem" to a sans-serif 'a' that lacks a distinct stem, or a script 'a' with no clear bowl.  
      *   **Requirement:** The theory must allow structural roles to be fluid, abstract, or relational rather than rigidly defined by specific, local visual features. "Stem" must be a functional/relational role that can be fulfilled in diverse ways or even be absent in valid instances.  
      *   **Status:** Non-negotiable for structural description approaches. **Crucially challenges rigid structural descriptions** and argues for roles defined by relational context within the glyph.

  ### Key Tensions

  *   **Structural Tolerance (2) & Radical Structural Tolerance (3) vs. Context Sensitivity (5):** This is the most significant tension. Achieving robust invariance across wildly different forms (2 & 3) suggests a stable, abstract representation. However, context effects (5) demonstrate that recognition is dynamically influenced by surroundings, implying processing is flexible and situated. A theory must reconcile stable abstract identity with dynamic, context-sensitive processing.
  *   **Orthogonal Extraction (4) vs. Simplicity:** Separating category and style simultaneously from a single novel glyph set demands sophisticated relational processing, challenging simpler similarity-based models.

  ### Requirement Excluding Most Candidates
  **Radical Structural Tolerance (2)** does the most damage to familiar candidates:
  *   **Template Matching:** Utterly fails with novel, structurally distinct glyphs.
  *   **Feature Lists:** Struggles to define a fixed list of necessary/sufficient features common to `ɑ`, `a`, and `𝖆`.
  *   **Prototype Averaging:** Blurs distinct structures (single-story vs. two-story) into an unrecongizable average. Fails to capture discrete structural variants.
  *   **Rigid Structural Descriptions:** Cannot apply a fixed part list (like "bowl + stem") to forms that lack those parts or arrange them fundamentally differently (e.g., blackletter). Requirement (7) specifically targets this weakness.
