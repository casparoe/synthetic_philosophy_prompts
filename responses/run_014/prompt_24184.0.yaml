answer: |-
  After extensive and fruitful adversarial collaboration, we find ourselves aligned on several key points regarding Frankfurt-style cases and the Principle of Alternative Possibilities (PAP), while also acknowledging persistent disagreements that merit further exploration. This joint statement outlines our shared ground, precise differences, and the cruxes where our views diverge, including the cases we agree could test them.  

  We concur that Frankfurt cases are designed to challenge the necessity of alternative possibilities for moral responsibility. These scenarios aim to demonstrate that an agent can be morally responsible for an action even when they lack robust alternative possibilities—typically through a counterfactual intervener who ensures the agent’s decision but never actually interferes. Both sides accept that if successful, such cases would refute PAP as traditionally formulated, which holds that moral responsibility requires the ability to do otherwise. We further agree that the "flicker of freedom" strategy—which identifies residual, non-robust alternatives (e.g., the possibility of acting *differently* in trivial ways, or under intervention) in Frankfurt cases—is a coherent and non-question-begging response. It preserves a minimal alternative possibility, however fleeting, and thus maintains a modified version of PAP. For the semicompatibilist, while these flickers exist, they are irrelevant to responsibility; for the flicker defender, they are sufficient to satisfy PAP’s core requirement.  

  Where we differ centers on two interconnected cruxes. First, we disagree on whether an unexercised alternative possibility—such as those flickers present but never actualized—can bear on moral responsibility at all. The flicker defender holds that the mere *availability* of an alternative, however thin, is necessary for responsibility because it secures the agent’s control over their action; without it, the agent is merely a passive conduit of the actual sequence. The semicompatibilist denies this, arguing that moral responsibility tracks "guidance control" in the actual sequence alone—i.e., the agent’s reasons-responsive mechanism, ownership of the action, and the absence of manipulation—regardless of counterfactual possibilities. For the semicompatibilist, responsibility is grounded in how the action *was* produced, not in what *might* have been.  

  Second, we diverge on the relative weight assigned to the actual sequence versus counterfactual sequences. The semicompatibilist prioritizes the actual sequence exclusively, contending that features of the counterfactual sequences (e.g., what would happen under intervention) are explanatory red herrings; they might illuminate the actual sequence but cannot directly affect responsibility. The flicker defender, conversely, maintains that counterfactual possibilities are constitutive of control: the actual sequence gains its responsibility-conferring status partly because alternative paths were genuinely open, ensuring the agent’s action was not inevitable.  

  To isolate the first crux—whether unexercised alternatives matter—we both accept a modified Frankfurt case as decisive. Imagine an agent, Jones, who deliberates and votes for Candidate A in a deterministic world. Unbeknownst to Jones, a neurosurgeon monitors his brain and would have intervened to force a vote for A if he had shown any inclination toward B. However, Jones votes for A freely. Crucially, the only alternative possibility is a "flicker": Jones could have exhibited a neural precursor to choosing B (triggering intervention), resulting in a coerced vote for A instead of his free one. The flicker defender predicts that Jones is responsible *because* this alternative exists, however minimal. The semicompatibilist predicts Jones is responsible *despite* the flicker, as it plays no role in the actual sequence of reasons-responsive agency. If removing the flicker (e.g., by making the intervention seamless) leaves responsibility intact, it supports semicompatibilism; if it undermines responsibility, it supports the flicker strategy.  

  For the second crux—weight of actual vs. counterfactual sequences—we turn to a twin-worlds case. In World 1, an agent freely decides to φ based on her reasons, with no intervener present; she has robust alternatives. In World 2, the agent identically decides to φ for the same reasons, but a counterfactual intervener lurks (ensuring she cannot do otherwise). The actual sequences are molecule-for-molecule identical. The semicompatibilist predicts responsibility is identical in both worlds because the actual mechanisms are the same; the intervener’s presence is irrelevant. The flicker defender predicts reduced or absent responsibility in World 2 because the counterfactual intervener removes robust alternatives, diminishing control. If responsibility varies across worlds, it favors the flicker defender; if not, semicompatibilism gains ground.  

  In good faith, we recognize these cruxes as the heart of our disagreement. Both sides commit to these cases as fair tests: the flicker defender expects unexercised alternatives to be necessary and counterfactual sequences to affect responsibility, while the semicompatibilist expects neither. We agree that progress hinges on refining these thought experiments and examining empirical work on control intuitions. Despite our differences, this collaboration has sharpened our understanding of what separates us—and what does not. We remain united in the view that moral responsibility demands agential control, but we part ways on whether that control must include alternatives or is fully actualized in the unfolding of the deed itself.  

  With collegial respect,  
  [Defender of PAP via the Flicker Strategy]  
  [Semicompatibilist]
