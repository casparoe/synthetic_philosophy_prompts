prompt: |-
  I moderate a big discussion site — philosophy, science and politics, about forty thousand members — and the thing that eats my week is threads where I can't tell if the two people disagree about the world or are just using a word diffrently: is Pluto a planet, is that group a religion or a cult, does the chatbot understand its own answers. I either lock the thread or let it run, and either way someone says I've silenced a real disagreement, and some of the time they're right. It's a few of these a week, I get five minutes each, I'm not a philosopher, and everything I do can be appealed to a two-person panel, so I want a procedure plus a canned line I can post for each outcome.

  I know metaontology has machinery for this. What I've picked up: some questions are asked inside a framework whose rules are already fixed, others are about whether to adopt the framework at all; two people can mean different things by 'exists' or 'object' and neither of them is wrong; and there's a test where you restate both sides in shared vocabulary and see whether anything is left to argue about. I also get that 'verbal' isn't the same as 'trivial' — calling a group a cult does real work — so 'just semantics' can't be where I stop.

  Turn that into the procedure: the questions in order, what counts as an answer to each, where it says verbal-and-done, where it says real disagreement, where it says verbal-but-worth-having, and where it hands off to me because the question is which meaning we should use rather than which one is true. Then run it on two threads — is Pluto a planet, and does the chatbot understand its own answers — and tell me which verdict I'm going to hate. And what can't it do? Most of my threads feel half verbal and half real and I don't know if that's inside the procedure or outside it. If I have to settle first whether any one vocabulary is the right one before I can run any of this, say so.
reasoning: |-
  Okay, the user is a moderator for a large discussion site with 40k members focused on philosophy, science, and politics. They're struggling with threads where it's unclear if participants are having a substantive disagreement or just using words differently. Examples include debates like "Is Pluto a planet?" or "Does a chatbot understand its own answers?" They need a quick, reliable procedure to handle these cases in about five minutes per thread, with decisions that can withstand appeals to a two-person panel.

  The user mentions some familiarity with metaontology concepts like framework-relative vs. framework-choice questions, different meanings of "exists," and the idea of restating arguments in shared vocabulary. They understand that verbal disputes aren't trivial (e.g., labeling something a "cult" has real-world implications). Their core needs are: a step-by-step procedure, canned responses for different outcomes, and clarity on where semantic differences end and substantive disagreements begin.

  I'm designing a practical procedure based on philosophical tools like David Chalmers' "Verbal Disputes" framework. The key steps should be: 1) Identify the contested term, 2) Check if both sides agree on non-linguistic facts, 3) Attempt to reframe the debate without the term, and 4) Determine if any disagreement persists. The procedure must classify outcomes as: resolved (purely verbal), substantive (real disagreement), or metalinguistic (needing community standards). 

  For the "Pluto" example: The facts about Pluto (size, orbit, etc.) are undisputed. The conflict is whether meeting IAU criteria makes it a "planet." Restating as "Does Pluto meet IAU criteria?" resolves it—clearly verbal. The chatbot example is trickier: While "understanding" is ambiguous, reframing might reveal deeper disputes about consciousness that are substantive. 

  The limitations: Hybrid disputes (part semantic, part factual) are common and messy. The procedure can isolate the semantic layer but can't resolve value-laden metalinguistic debates (e.g., why "planet" criteria should include orbital dominance). The user will likely hate "metalinguistic" verdicts because they require subjective judgment calls about which framework benefits the community—exactly what they wanted to avoid. 

  Canned responses are drafted for each outcome to justify decisions neutrally. The procedure won't handle everything—especially hybrid cases—but it efficiently filters low-hanging fruit. Emphasizing that "semantic ≠ trivial" is crucial to preempt complaints about shutting down important discussions.
answer: |-
  Here's a battle-tested moderation procedure based on metaontological tools, designed for speed and clarity, with canned responses. It focuses on **isolating the semantic core** of a dispute first.

  **The Procedure (5-Minute Version):**

  1.  **Identify the Contested Term(s):** (30 sec) What specific word(s) are causing the friction? (e.g., "planet", "understand", "religion", "cult", "exists"). Look for repeated definitions, clarifications, or "That's not what X means!" statements.
  2.  **Check for Shared Non-Linguistic Facts:** (1 min) *Do both sides largely agree on the observable, measurable, or non-disputed descriptive facts about the case?*
      *   **Yes:** Proceed to Step 3.
      *   **No:** **VERDICT: REAL DISAGREEMENT.** (Locking might be premature; flag for potential deeper factual dispute needing separate moderation).
      *   **Unclear:** **VERDICT: AMBIGUOUS.** (Lock thread citing need for clarification on core facts first. Hard to run procedure without this).
  3.  **Attempt Neutral Restatement:** (2 min) *Can the core disagreement be rephrased without the contested term(s), using only the agreed-upon facts?*
      *   **Yes, and disagreement vanishes:** **VERDICT: PURELY VERBAL (RESOLVED).** Lock thread. Dispute *was* only about word usage.
      *   **Yes, but disagreement persists:** **VERDICT: REAL DISAGREEMENT.** The conflict survives the semantic shift. It's substantive (e.g., about implications, values, interpretations of agreed facts).
      *   **No:** *The disagreement fundamentally hinges on how to define/classify using that term.* Proceed to Step 4.
  4.  **Framework Choice:** (1.5 min) *Is the dispute primarily about:*
      *   **(A) Applying a widely accepted, pre-existing definition/framework?** (e.g., IAU definition of "planet", legal definition of "religion" in a specific jurisdiction).
      *   **(B) Arguing *for* a specific definition/framework itself?** (e.g., "The IAU definition is bad science!", "We *should* define 'cult' based on harm, not doctrine!").
      *   **(A) Outcome:** **VERDICT: VERBAL-AND-DONE (BY FRAMEWORK).** Lock thread. The answer is determined by the agreed/relevant framework. Dispute is *interpretive* but settled by rules.
      *   **(B) Outcome:** **VERDICT: METALINGUISTIC/NORMATIVE.** The *real* argument is about which definition/framework *we should use* and why. This is substantive (about values, goals, consequences of definitions). *This is where you hand off to judgment.* Let it run *if* the discussion remains civil and focuses on the merits of definitions (pragmatic, ethical, functional). Lock it if it devolves into name-calling or repeats the same points endlessly.

  **Canned Responses:**

  *   **VERDICT: PURELY VERBAL (RESOLVED):**
      > "This thread appears to center on differing definitions of the term '[Contested Term]'. Reviewing the discussion, participants largely agree on the underlying facts ([Briefly state agreed facts, e.g., 'Pluto's size, orbit, and location']), but disagree on whether those facts fit the label '[Contested Term]'. As this is primarily a semantic disagreement resolved by clarifying definitions, the thread is being locked to prevent further circular debate. Resources on defining [Contested Term] can be found [Link if available, e.g., IAU page]."
  *   **VERDICT: REAL DISAGREEMENT:**
      > "While terminology ('[Contested Term]') is involved, the core disagreement persists even when restated neutrally ([Brief neutral restatement attempt, e.g., 'whether consciousness is necessary for producing such outputs']). This indicates a substantive difference in interpretation, theory, or perspective that extends beyond semantics. The thread may continue, provided discussion remains constructive and adheres to community guidelines."
  *   **VERDICT: VERBAL-AND-DONE (BY FRAMEWORK):**
      > "The debate hinges on applying the term '[Contested Term]' according to the [Relevant Framework, e.g., 'IAU definition']. Based on the agreed facts ([Brief facts]) and this framework, the classification is clear. Further debate on the classification itself within this framework is circular. The thread is locked. Discussion about the merits *of the framework itself* can be raised in a new thread focusing specifically on that definitional question."
  *   **VERDICT: METALINGUISTIC/NORMATIVE:**
      > "This discussion has moved beyond applying a single definition and is now focused on *which definition or framework for '[Contested Term]' is most appropriate/useful* and why (e.g., based on scientific utility, social impact, ethical considerations). This is a valid and substantive discussion *about language and categorization*. The thread may continue **only if** discussion remains focused on the merits of different definitions (pragmatic, ethical, functional) and avoids personal attacks or repetitive semantic circling. Moderators will be watching closely."
  *   **VERDICT: AMBIGUOUS (Shared Facts Unclear):**
      > "Before the semantic aspect ('[Contested Term]') can be addressed, there appears to be fundamental disagreement or lack of clarity on the underlying non-linguistic facts ([Point to specific confusion, e.g., 'the chatbot's architecture', 'the group's specific practices']). This thread is locked. A new thread focusing *only* on establishing these core facts, backed by credible sources where possible, is needed before debating the appropriate terminology."

  **Application to Examples:**

  1.  **Is Pluto a Planet?**
      *   **Contested Term:** "Planet"
      *   **Shared Non-Linguistic Facts:** Almost always YES (Size, orbit characteristics, location, composition, history of discovery/classification).
      *   **Neutral Restatement:** "Does Pluto meet the IAU criteria for 'planet'?" (Answer: Clearly No). "Should the IAU criteria include orbital dominance?" (Answer: That's a different question!).
      *   **Framework Choice:** Dispute is usually about applying the *IAU definition* (A). Occasionally, it's arguing the IAU definition is bad (B).
      *   **Verdict:** **VERDICT: VERBAL-AND-DONE (BY FRAMEWORK).** (Apply IAU rules to agreed facts). *You'll hate this if people passionately believe arguing the IAU definition *within this thread* is the real point.* Your canned response clarifies they need a *new thread* about the definition itself.
      *   **Canned Response:** (Use VERBAL-AND-DONE template).

  2.  **Does the Chatbot Understand its Own Answers?**
      *   **Contested Term:** "Understand" (or "consciousness", "sentience").
      *   **Shared Non-Linguistic Facts:** Often YES on surface behavior (It generates coherent, contextually relevant responses based on patterns in training data). NO on biological basis (It lacks a human-like brain, subjective experience). *THIS STEP IS CRITICAL & OFTEN MESSY.*
      *   **Neutral Restatement:** *Attempt:* "Does the chatbot produce outputs functionally equivalent to a human who understands the topic, *without* subjective awareness?" OR "Is the internal processing mechanism sufficient for understanding, regardless of subjective feel?"
          *   **Persistence:** Disagreement *will* persist here. Proponents of functionalism ("If it acts like it understands, it does") vs. biological naturalism ("Understanding requires biological consciousness") vs. other theories will still disagree. The disagreement is about the *necessary and sufficient conditions* for "understanding", which is a deep philosophical/scientific question.
      *   **Framework Choice:** N/A (Restatement showed persistence).
      *   **Verdict:** **VERDICT: REAL DISAGREEMENT.** *This is the verdict you might hate* because it's a massive, unresolved philosophical can of worms likely to generate heat. But the procedure correctly identifies it's *not* just about the word "understand"; it's about the nature of cognition and consciousness itself.
      *   **Canned Response:** (Use REAL DISAGREEMENT template).

  **Where it Breaks Down (Limitations):**

  1.  **The "Half-and-Half" Problem:** This is VERY common. The procedure helps *isolate* the semantic layer. Often, after Step 3, you find:
      *   A core substantive disagreement *framed by* a semantic one.
      *   *Outcome:* Use **REAL DISAGREEMENT** verdict, but your canned response *explicitly notes* the semantic component was disentangled ("While definitions of '[Term]' played a role, the core disagreement about [Neutral Restatement] remains substantive"). This justifies not locking purely on semantics.
  2.  **Which Vocabulary is "Right"?** You **do NOT** need to settle this first! The procedure's power is its *neutrality*:
      *   Step 2 focuses on *non-linguistic* facts everyone (mostly) accepts.
      *   Step 3 tries to ditch the contested word *altogether*.
      *   Step 4(A) defers to an *external* framework, avoiding you picking a side.
      *   Only Step 4(B) requires handling the "which meaning *should* we use?" question, and you're explicitly handing it off to the community *as a normative discussion*.
  3.  **Deep Disagreements Masked as Semantic:** Sometimes fundamental worldview clashes hide behind word fights (e.g., materialist vs. dualist views in the chatbot case). The procedure often surfaces this as **REAL DISAGREEMENT** after restatement.
  4.  **"Agreed Facts" Aren't Truly Agreed:** This is the biggest practical hurdle (Step 2). Participants often *think* they agree but subtly disagree on interpretations of evidence. The procedure relies on your best judgment of the *explicitly stated* common ground. If truly ambiguous, use **AMBIGUOUS** verdict.
  5.  **Time & Complexity:** Deep metalinguistic (4B) or complex real disagreements might need more than 5 mins. The procedure aims to give a *defensible categorization* quickly, not resolve the debate itself. Your canned responses provide the rationale for appeal panels.

  **Key Takeaway for Appeals:** Your strength lies in rigorously showing you:
  1.  Identified the contested term.
  2.  Checked for shared non-linguistic facts (or noted ambiguity).
  3.  Attempted a neutral restatement.
  4.  Correctly categorized the *nature* of the remaining disagreement based on steps 3/4.
  This structured approach is far more defensible than "felt like semantics" or "got too heated."

  By using this, you're not silencing disagreement; you're forcing it into its most productive form – either resolving purely semantic noise, clarifying the actual substantive point, or explicitly framing the debate about *how we should define things*, which is often the most valuable (and contentious) discussion of all. The procedure makes your reasoning transparent and focused on the structure of the argument, not its content.
