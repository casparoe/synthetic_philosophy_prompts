answer: |-
  The friend's argument crucially needs reading (c) — the modal fixity of the past — to be both true and substantive.

  **Candidate Readings of "You Can't Change the Past":**

  1.  **Linguistic Triviality (a):** "Changed past" is a contradiction because "past" refers to what *has* happened. To change it implies it was first one way, then another, violating the meaning of "past."
      *   *Status:* Trivially true (analytic).
      *   *Use in Argument:* Useless. It makes the slogan true by definition but doesn't engage the paradox. It doesn't preclude backwards travel *causing* what always was part of the past. The grandfather killer scenario isn't describing a literal "change" in this sense; it's positing an inconsistent causal chain.

  2.  **Causal Asymmetry (b):** No event at time T2 can be a cause of an event at an earlier time T1. Causation only runs forward.
      *   *Status:* Substantive and defensible (based on our causal intuitions and physics), but not universally accepted. Some models of physics (e.g., certain quantum or time-symmetric interpretations) allow formal backwards causation without paradox.
      *   *Use in Argument:* If true, it directly blocks backwards time travel causation (like killing grandfather). However, the friend's argument ("*changing* the past is impossible") doesn't explicitly need this strong causal claim. Modal fixity might be sufficient.

  3.  **Modal Fixity (c):** Past events are necessary/unalterable. Given what has happened, it is now impossible for any later action or event (like a time traveler arriving in 1920) to *make* the past different from what it *actually was/is*. No later intervention can render a past event false.
      *   *Status:* Substantive and widely held (common in "actualist" or "Ockhamist" views of time and modality), but not logically compulsory. It depends heavily on the nature of temporal passage and possibility.
      *   *Use in Argument:* **Essential.** This is the non-trivial core the friend needs. If the past is modally fixed, the grandfather-killer scenario is impossible *because* it requires making the past (grandfather being alive long enough to father the parent) not have been the case. Backwards travel that implies such "making otherwise" is ruled out.

  4.  **Physical Self-Consistency (d):** Any physically possible backwards time journey must be consistent with a single, non-contradictory history. The traveler's actions were always part of the past they travel to (e.g., gun jams, they miss, grandfather was never killed by them). There is no "second try" or alteration.
      *   *Status:* Substantive and defensible within certain physical models (e.g., General Relativity with closed timelike curves). It dissolves the paradox by redefining what "time travel" entails.
      *   *Use in Argument:* Undercuts the friend. If this is true, backwards time travel *is* possible without "changing the past" in the modal sense (c), precisely because the "change" never happens; the history is consistent. The slogan "can't change the past" becomes trivially true *if* time travel occurs, but doesn't prove time travel is impossible.

  5.  **Epistemic Limitation (e):** Even if the past were altered, all records, memories, and evidence would change to match the new past, making the change undetectable *after* it occurs.
      *   *Status:* Substantive but largely false or irrelevant. It presupposes the possibility of alteration the other readings deny. If modal fixity (c) holds, alteration is metaphysically impossible, not just undetectable. If alteration *were* possible, detectability is a separate (and difficult) issue.
      *   *Use in Argument:* Irrelevant to the friend's logical point. It addresses evidence, not the metaphysical possibility of change itself.

  **The Changing vs. Affecting Distinction:**
  *   **Changing the Past:** Making it the case that some event E, which *was* fact F at time T, *was not* F at T (or was G instead). Requires altering settled truth values.
  *   **Affecting the Past:** Being a cause (partial or total) of some event E that occurs at an earlier time T, where E *was always* part of the history of the world.
  This **is a real and crucial distinction**. It rescues the self-consistency view (d): backwards time travel allows *affecting* the past (causing what was always there) but not *changing* it (making what was true, false). It dissolves the grandfather paradox *as a logical contradiction* by showing the scenario describes an impossible *change* (grandfather *was* alive → *was* killed before fathering), not a consistent instance of *affecting* (the traveler's arrival and actions *were always* part of the causal chain leading to their own birth, perhaps by failing to kill). The paradox relies on conflating affecting with changing.

  **Verdict on the Friend's Argument:**
  The friend needs the substantive modal fixity thesis (c). If (c) is true, backwards time travel that implies altering what was true is impossible. However, (c) is not a trivial truth; it's a substantive metaphysical commitment. The self-consistency view (d) rejects (c)'s necessity for defining possibility and allows affecting without changing, making backwards travel coherent. The "affecting/changing" distinction highlights this. **Therefore, the friend's argument fails if modal fixity (c) is rejected in favor of a self-consistent "affecting" model.**

  **Least Confident Verdict:** My dismissal of (b) Causal Asymmetry as *not strictly required* for the friend's specific "change" argument. While modal fixity (c) is the direct target, one could argue that backwards causation (b) is so deeply tied to our concept of "change" that rejecting (b) fundamentally alters the meaning of "change the past." If causation is *essentially* forward-directed, then backwards "affecting" might still be seen as a kind of illicit "change," even within a self-consistent model. A strong argument establishing the conceptual incoherence (not just physical implausibility) of *any* form of backwards causation could push (b) from defensible to necessary for the friend's claim, or even make "affecting" indistinguishable from "changing."
