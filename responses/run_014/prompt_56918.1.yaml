prompt: |-
  I'm the person who ended up with the made-up title of "narrative standards reviewer" at a mid-size game studio — basically I read every mission script, trailer line, and achievement description for our war games and flag stuff before it goes up to the creative director, who has final say. We're about a year out from shipping a realistic-ish contemporary-war single-player campaign, and I get maybe six to eight mission beats a month across my desk plus marketing copy, with roughly 45 minutes per beat. The people writing these are good writers with zero philosophy background, and they hate being told "it's complicated," so whatever I hand them has to be runnable: a list of questions in a fixed order, what counts as a passing answer to each, the points where the thing just gets a no, and the points where it has to kick upstairs to the creative director because it's a values call and not something a checklist can settle.

  The reason I need this is that the studio has an official house principle we've been operating under, which I'll call the Symmetry Default: unless a beat explicitly earns an exception, combatants on both sides get presented as equally entitled to be fighting and equally worth mourning, and the game never invites the player to condemn an individual enemy soldier on account of whose war he's serving in. It was a deliberate choice. We got hammered a few years back by an academic who said our "everyone's just a soldier doing his job" framing effectively laundered an invasion, and then last year by a veterans group who said the mission that lingered on one enemy conscript's life treated our own guys as objects with no interiority, and I still cant articulate why both complaints are aimed at the same underlying argument. The philosophy underneath it, as best I understand: there's the older view that soldiers on either side of a war stand in the same moral position, that a man fighting for an unjust cause isn't a criminal because he's acting as the instrument of a state inside a set of conventions everyone benefits from, and that this equality is what makes the rules of war workable at all — you can't get an army to accept limits on how it fights while simultaneously telling its soldiers they're murderers for showing up. And then there's the revisionist line that liability to be killed tracks whether the threat you pose is itself justified, so a soldier fighting a war of aggression doesn't really have a moral right to kill the people defending themselves, and the symmetry is a legal and practical fiction rather than the truth, its a thing we agree to pretend, not a thing that's so. I don't need the procedure to referee that argument or point me at anybody to read. I need it to be honest about which side of the argument our Symmetry Default is quietly smuggling in, and to tell a writer when a beat can keep leaning on the default and when the default is going to produce something false or ugly.

  So: write me the procedure. Questions in a fixed order, each with a short note on what a good answer looks like and what a non-answer looks like, the places where it stops at cut-or-rewrite, and the places where it hands the decision to a human because it's judgment wearing a checklist costume — mark those explicitly rather than burying them. Then run it on three things that are actually sitting on my desk right now. One: a mission where the player's side is clearly the invader and the setpiece is a night raid on a checkpoint held by very young conscripts, shown joking around and reading letters home, with no dialogue indicating they know their country started it. Two: a mission where the enemy commander the player finally kills has been established across four hours of play as personally responsible for massacres, including against his own people. Three: a trailer line, something like "no heroes, no villains, only survivors," laid over a montage that cuts between both armies. At least one of those should come out in a way I'm not going to like — I'd rather the procedure bite on our signature beat than flatter us. And finish with what the procedure flat out can't do: the cases where two honest writers will run it and land in different places, the beats it will misjudge, and the spots where it's really just encoding my taste and calling it method.
reasoning: |-
  Okay, the user is a narrative standards reviewer at a game studio working on a war game. They need a procedure to evaluate mission scripts and marketing copy based on their studio's "Symmetry Default" principle. This principle states that unless explicitly earned, combatants on both sides should be presented as equally entitled to fight and equally worth mourning. The user needs a checklist that's practical, with clear questions, pass/fail criteria, and points where decisions must go to the creative director.

  First, I need to understand the core conflict in the Symmetry Default. The user mentioned two philosophical views: the traditional symmetry of combatants versus the revisionist view that moral liability depends on the justice of the cause. The procedure must identify when the default aligns with or contradicts these views.

  The user provided three examples: a mission with young conscripts unaware of their country's aggression, an enemy commander responsible for massacres, and a trailer line claiming "no heroes, no villains." The procedure should flag issues in these cases, especially where the default might sanitize or misrepresent reality.

  Key elements for the procedure: it must be systematic, with ordered questions, clear pass/fail answers, and explicit points for escalation. The user emphasized honesty about when the Symmetry Default is smuggling in a particular viewpoint. Also, the procedure should highlight where it's judgment-based versus checklist-based.

  For the structure, start with foundational questions about the conflict's presentation, then move to character portrayals, and finally to the overall message. Each question needs a note on what passes, what fails, and when to escalate. The "Kick Upstairs" flag is crucial for values-based decisions.

  Applying the procedure to the examples:
  1. The checkpoint raid mission with young conscripts: the Symmetry Default might misrepresent the invaders as equivalent to defenders. The procedure should flag the lack of context about the war's justice, escalating to the creative director.
  2. The enemy commander: his personal war crimes break the symmetry. The procedure should require explicit exception handling, possibly denying if not addressed.
  3. The trailer line "no heroes, no villains": this enforces symmetry where context might not support it. The procedure should question if the story genuinely lacks moral asymmetry, escalating if not.

  Limitations: The procedure can't resolve deep philosophical disagreements, relies on narrative context, and may encode the reviewer's biases. It might miss nuanced portrayals or struggle with systemic critiques.

  The user's deeper needs include wanting a tool that prevents past criticisms (from academics and veterans) by ensuring the narrative doesn't inadvertently justify aggression or dehumanize soldiers. They need clarity on when the Symmetry Default is appropriate versus when it obscures moral realities. The procedure must balance practicality with ethical scrutiny, helping writers understand the implications without philosophical jargon.
answer: |-
  Here's a procedural checklist designed for efficiency, clarity, and honesty about the Symmetry Default's implications. It explicitly identifies when the Default is being applied and flags where it might conflict with the narrative reality or require a values judgment.

  **Procedure: Symmetry Default Compliance & Narrative Scrutiny Checklist**

  **Core Principle:** This checklist assumes the **Symmetry Default (SD)** is the studio's baseline: Combatants on both sides are presented as equally entitled to fight and equally worth mourning. Individual soldiers are not condemned *solely* for serving their state. The procedure identifies when this framing is stable, when it might be problematic, and when an exception *must* be earned or the Default *cannot* apply.

  **Instructions:** Run each narrative beat (mission script section, trailer line, character description, etc.) through these questions **in order**. Stop at any "**CUT/REWRITE**" or "**KICK UPSTAIRS**" instruction. Document answers briefly.

  ---

  1.  **Is the conflict presented as a symmetrical war between two morally ambiguous sides?**
      *   **Good Answer:** Explicit dialogue, environmental storytelling, or character actions portray both sides as having complex motivations, flaws, and potentially legitimate grievances. The SD feels like a natural fit.
      *   **Non-Answer:** Vague, avoids stating *why* sides are fighting, relies solely on genre tropes. Assumes SD without showing *why* it fits.
      *   **Pass:** Yes, clearly established.
      *   **CUT/REWRITE:** No, the narrative explicitly frames one side as the unambiguous aggressor/invader *or* the unambiguous defender of clear moral good *without* complicating factors. *(SD is unstable here - proceed with caution)*
      *   **KICK UPSTAIRS?** N/A (Binary factual assessment re: narrative presentation).

  2.  **Does the beat depict an *individual enemy soldier* solely as a combatant performing military duties?** (e.g., guarding, patrolling, shooting at player in combat)
      *   **Good Answer:** Soldier is shown performing standard military functions. Dialogue/behavior is professional, weary, scared, or humanly relatable *without* overt ideological zeal or personal sadism. SD applies comfortably.
      *   **Non-Answer:** Soldier is depicted as faceless cannon fodder OR given excessive, incongruous "humanizing" detail that feels forced.
      *   **Pass:** Yes. SD applies cleanly. Proceed.
      *   **CUT/REWRITE:** No. The soldier is explicitly shown committing a *clear* war crime (murdering civilians, torturing POWs) *within this beat* or is given dialogue/actions indicating overt, personal enjoyment of violence or extremist ideology beyond standard military duty. *(SD CANNOT apply to this individual at this moment)*.
      *   **KICK UPSTAIRS?** If the depicted action/ideology is *borderline* (e.g., harsh but arguably legal interrogation, aggressive propaganda speech) – Does this cross the line into *personal* culpability beyond being a soldier?

  3.  **Does the beat depict the *death or suffering* of an enemy combatant?**
      *   **Good Answer:** If death/suffering is shown, it is presented with weight, consequence, or acknowledges the loss without overt glorification of the inflictor. Tone matches SD of loss being universal.
      *   **Non-Answer:** Death is purely celebratory "kill count" fodder OR suffering is lingered on gratuitously/voyeuristically.
      *   **Pass:** Death/suffering is handled with appropriate weight (grimness, exhaustion, brief respect) OR occurs during standard combat without undue focus. SD compatible.
      *   **CUT/REWRITE:** Death/suffering is presented as inherently comedic, deeply satisfying revenge for a *personal* slight against the player character *alone*, or a celebratory "boss kill" moment where the enemy was *purely* evil. *(Contradicts SD's "equally worth mourning")*.
      *   **KICK UPSTAIRS?** If the death is of a major antagonist responsible for *systemic* atrocities (see Q4) – How much weight vs. catharsis is appropriate while *trying* to maintain SD? Is mourning *this specific* enemy even plausible?

  4.  **Is the beat depicting or referencing a character or unit with *established command responsibility* for systemic atrocities (war crimes, massacres, ethnic cleansing)?** (Relies on wider narrative context)
      *   **Good Answer:** "Command Responsibility" is clearly established *prior* in the narrative (briefings, logs, witnessing aftermath). The beat *explicitly* acknowledges their unique culpability if depicting them.
      *   **Non-Answer:** Assumes player knows the backstory OR introduces culpability solely within this beat without prior setup.
      *   **Pass:** Not applicable (character/unit not depicted/referenced OR no established command responsibility).
      *   **CUT/REWRITE:** Character/unit is depicted/referenced *without acknowledging* their established unique culpability AND the beat uses SD framing (e.g., presenting them as "just another soldier"). *(SD cannot erase command responsibility for atrocities - applying it here sanitizes evil)*.
      *   **KICK UPSTAIRS?** **CRITICAL JUNCTION.** If depicting/referencing such a character:
          *   *Does the beat explicitly acknowledge their unique moral status?* (e.g., dialogue condemning *their actions*, framing their death differently, showing dissent among their own ranks). **If YES:** SD *might* still apply to *their soldiers* but likely NOT to the commander themselves. Proceed cautiously.
          *   *Can the SD apply to the soldiers under this commander's orders?* (This is the core philosophical tension - **KICK UPSTAIRS** with clear flag: "SD application to subordinates of known war criminal commander? Requires values call on collective vs. individual responsibility under unlawful orders.").

  5.  **Does the beat make a *general thematic statement* about the conflict (e.g., trailer line, loading screen text, character monologue)?**
      *   **Good Answer:** Statement aligns with the *specific, demonstrated* complexity (or lack thereof) of the conflict as established in the game. SD framing is consistent with the *shown* reality.
      *   **Non-Answer:** Generic statement that could apply to any war, regardless of context. Feels like a thematic "stamp" rather than emerging from narrative.
      *   **Pass:** Statement is specific enough to reflect the game's actual narrative OR is sufficiently vague to avoid contradicting known asymmetry.
      *   **CUT/REWRITE:** Statement *explicitly enforces* SD symmetry ("no heroes, no villains," "both sides are the same," "just soldiers doing their job") when the narrative *has clearly established* significant moral asymmetry (e.g., one side is the unprovoked invader, commands are led by war criminals). *(SD framing becomes dishonest propaganda)*.
      *   **KICK UPSTAIRS?** If the statement is ambiguous or metaphorical – Does its interpretation in *this specific context* (e.g., over a particular montage) risk implying a false equivalence the narrative doesn't support? **Requires judgment on audience perception.**

  **Summary of Stop Points:**
  *   **CUT/REWRITE:** Q1 (No Symmetry), Q2 (Personal War Criminal), Q3 (Glorified Revenge Kill/Gratuitous Suffering), Q4 (Sanitizing War Criminal), Q5 (False Equivalence Statement).
  *   **KICK UPSTAIRS:** Q2 (Borderline Culpability), Q4 (ALL aspects re: Command Responsibility & Subordinates), Q5 (Ambiguous Statement Context).

  ---

  **Application to Your Examples:**

  1.  **Checkpoint Raid on Young Conscripts:**
      *   **Q1:** **CUT/REWRITE.** Player's side is "clearly the invader." Narrative establishes asymmetry (aggressor vs. defender). SD is *not* the stable baseline here; applying it risks laundering the invasion.
      *   **Action:** Script *must* be rewritten to either a) Complicate the invasion (show dissent, dubious motives on player's side, genuine complexity) to potentially pass Q1 later, or b) *Explicitly earn an exception* to the SD by acknowledging the asymmetry (e.g., player character questioning the mission, dialogue showing conscripts *are* misinformed/innocent pawns *of the aggressor*). The current "humanizing without context" approach fails Q1. *You won't like this; it targets a core beat.*

  2.  **Killing the Enemy Commander (Established Mass Murderer):**
      *   **Q1:** Assume passes (war may have complexity elsewhere, but commander's actions are focal here).
      *   **Q2:** **CUT/REWRITE.** This individual is *not* just a soldier performing duties; he's a mass murderer. Depicting his death requires explicit handling.
      *   **Q4:** **KICK UPSTAIRS (CRITICAL JUNCTION).** The beat *must* acknowledge his unique culpability. How? (Tone, dialogue, aftermath). Can SD apply to *his* suffering/death? Almost certainly not ("equally worth mourning" fails). Can SD apply to his *soldiers* present? **KICK UPSTAIRS:** Requires values call on subordinate culpability under his command. *The procedure forces a hard, explicit decision here.*

  3.  **Trailer Line: "No heroes, no villains, only survivors" over both armies:**
      *   **Q5:** **CUT/REWRITE.** This line *explicitly enforces* SD symmetry ("no heroes, no villains"). If the campaign (like Example 1) establishes one side as the clear aggressor/invader, or features commanders like Example 2, this statement becomes **false equivalence**. It contradicts the established narrative reality. *The procedure bites hard here.*

  ---

  **What the Procedure CAN'T Do (Limitations & Biases):**

  1.  **Resolve Deep Philosophy:** It flags the *tension* (especially at Q4 Kick Upstairs), but doesn't *solve* the revisionist vs. traditionalist debate. It forces humans to make the call based on the studio's chosen stance (SD), acknowledging when that stance is under stress.
  2.  **Judge "Quality" or "Taste":** It won't flag something as "bad writing," only where it conflicts with the SD or established facts. A clumsy, non-violent beat passes if it doesn't trigger the stops.
  3.  **Handle Extreme Nuance or Unreliable Narration:** If moral ambiguity is intentionally opaque or filtered through a biased PC, applying the checklist rigidly might misfire. It assumes a relatively objective narrative presentation.
  4.  **Predict Player Interpretation Perfectly:** It assesses based on *what's presented*, but players bring their own baggage. A beat passing Q4 might *still* be read by some as sanitizing (or vice-versa).
  5.  **Eliminate Judgment Calls:** Q4 (Subordinates) and Q5 (Ambiguity) are inherently judgment-based, even marked as "Kick Upstairs." Two honest reviewers might disagree on:
      *   Whether a commander's *specific* depicted action makes them a "personal war criminal" (Q2 Kick Upstairs).
      *   Whether subordinates under a known war criminal commander can *ever* be framed under SD (Q4 Kick Upstairs - the core philosophical split).
      *   Whether a thematic statement in a *specific* montage context implies false equivalence (Q5 Kick Upstairs).
      *   Whether "established command responsibility" is sufficiently clear *to the player at that point* (Q4 Pass/Fail).
  6.  **Encode Your Taste:** The thresholds for "clear war crime" (Q2), "established command responsibility" (Q4), and "significant moral asymmetry" (Q1, Q5) reflect your (and the studio's) interpretation. A more absolutist reviewer might flag more; a more lenient one, less. The procedure makes *where* this encoding happens (the stop points) explicit, rather than burying it.
  7.  **Address Systemic Critique:** It focuses on *depiction*. It won't flag that the *entire conflict premise* might be seen as justifying aggression if the SD is applied uncritically throughout. It tackles beats individually within the given framework.

  **In essence:** This procedure acts as a pressure test for the Symmetry Default. It forces writers (and reviewers) to confront *when* and *why* they are applying it, identifies points where its application might be dishonest or untenable based on the narrative facts, and explicitly elevates the thorniest philosophical/value judgments to the Creative Director. It makes the underlying assumptions and tensions visible within a practical, time-constrained workflow.
