prompt: |-
  A long essay in a general-interest magazine on the history of lying devotes a couple of pages to Augustine, and I would like to know how much of its gloss to trust. The passage runs as follows:

  "For Augustine, a lie is a statement at odds with the facts that is offered as true. What makes it wrong is the injury it inflicts on the person deceived, and so its wrongness comes in degrees proportionate to that injury: a lie that harms nobody is a peccadillo, one that costs a man his reputation is worse, and one that costs a life is the gravest lie there is. This scalar account is what lets Augustine be an absolutist and still look reasonable — he can forbid the lie to the killer at the door precisely because such a lie risks a life, while leaving us free to mislead that killer with a true statement he is likely to misread, or simply to say nothing at all. Consistently with this, he does not count as lies either the remark made in jest, where nobody expects to be believed, or the assertion you sincerely make that happens to turn out false."

  I have never read his two treatises on lying, but two things here strike me as shaky: I had the impression that Augustine located the lie in the gap between what a speaker holds in mind and what he utters rather than in the objective falsity of the utterance, and that the injury he worried about first was the liar's own rather than the victim's. Could you audit the passage claim by claim, separating what a specialist would accept as it stands, what is a defensible simplification, and what reverses or drops something Augustine insists on? In particular: does his ordering of the kinds of lie track harm suffered by the person deceived, and if not, what does it turn on; can he license the deliberately misleading true statement while forbidding the outright false one, given where he puts the lie; and are jest and sincere error set aside for the reason the essay gives? Finally, the essay goes on to conclude that Augustine's absolutism is covertly a harm principle and therefore has nothing distinctive to offer in the case of the murderer at the door. Tell me whether that conclusion follows from Augustine's actual view or only from the summary of it.
reasoning: |-
  Okay, the user is asking about a passage in a magazine essay on Augustine's views on lying. They want to know how accurate the summary is, especially regarding where Augustine locates the essence of lying and what makes it wrong. They mention two points that seem shaky: whether lying is about the speaker's intent versus objective falsity, and whether the primary injury is to the liar or the victim.

  First, I need to recall Augustine's actual positions from his treatises, "De Mendacio" and "Contra Mendacium." I remember that Augustine defines a lie as speaking against one's mind, not just an objectively false statement. So the essay's claim that a lie is "a statement at odds with the facts" is misleading because Augustine focuses on the speaker's internal state. The essay oversimplifies by equating objective falsity with lying, which isn't Augustine's view.

  Next, the essay says the wrongness of lying comes from the harm to the deceived person, with degrees based on injury. But Augustine actually sees the primary wrong as violating divine order and harming the liar's soul. He does categorize lies by severity, but the criteria include the intent and the violation of truth itself, not just harm to others. The eight categories in "De Mendacio" are based on both intent and consequences, so the essay's reduction to just harm is a defensible simplification but misses the theological depth.

  The user questions if Augustine allows misleading true statements while forbidding outright lies. That part seems correct. Augustine makes a clear distinction: intentionally deceiving with a true statement isn't a lie because it doesn't involve speaking against one's mind. The essay's example of misleading the killer at the door aligns with Augustine's view here.

  Regarding jest and sincere error, the essay is right that Augustine excludes them, but the reason isn't just about expectations. Augustine's focus is on the speaker's intent to deceive. In jest, there's no intent to deceive, and in error, there's no intent at all. So the essay's explanation is acceptable but slightly off; it's the absence of intent that matters more than whether others expect belief.

  The essay concludes that Augustine's absolutism is a covert harm principle, making it unhelpful for the murderer at the door scenario. This is incorrect. Augustine forbids all lies absolutely because they violate divine truth, regardless of harm. The harm principle is consequentialist, while Augustine's stance is deontological and theological. The essay's summary misrepresents his absolutism, leading to a flawed conclusion.

  The user needs a detailed audit to separate accurate points, simplifications, and errors. They might be concerned about the reliability of popular interpretations of philosophical texts. Their deeper need could be ensuring academic rigor in sources they reference or understanding Augustine's ethics for their own work. Addressing each claim methodically will help them discern trustworthy analyses and avoid misrepresentations in their use of the material.
answer: |-
  Based on a close reading of Augustine's *De Mendacio* (On Lying) and *Contra Mendacium* (Against Lying), the magazine passage contains significant simplifications and one major misrepresentation regarding the *basis* of Augustine's absolutism. Here's a claim-by-claim audit:

  1.  **"For Augustine, a lie is a statement at odds with the facts that is offered as true."**
      *   **Specialist Verdict: Inaccurate Simplification / Reversal.** Augustine explicitly defines a lie not by objective falsity ("at odds with the facts"), but by the **speaker's intent and knowledge**. His core definition is **speaking against one's mind** (*contra mentem*). A statement is a lie if the speaker *knows or believes* it to be false and *intends* to deceive. An objectively false statement uttered sincerely (in error) is *not* a lie for Augustine. Conversely, an objectively true statement uttered *with the intent to deceive* (while knowing the truth) is *still* potentially sinful deception, though technically *not* a lie under his strict definition (a crucial point the passage gets right later but misstates here).

  2.  **"What makes it wrong is the injury it inflicts on the person deceived..."**
      *   **Specialist Verdict: Reversal / Major Omission.** While Augustine acknowledges harm to others as a *consequence* and a factor in the *gravity* of the sin, it is **not the primary or foundational reason** lying is wrong. Augustine grounds the wrongness of lying **primarily in theology and the nature of the soul's relationship to God**:
          *   **Violation of Truth/God:** Truth is divine; lying is an offense against God, the source of all truth.
          *   **Harming the Liar's Soul:** Lying corrupts the liar's soul, damaging their inner integrity, relationship with God, and capacity for truth. This is often presented as the *first* and most fundamental injury.
          *   **Violation of Social Order:** Lying undermines the trust essential for human society, which reflects divine order.
          *   Harm to the deceived is a *serious consequence*, but the *intrinsic* wrongness stems from the liar's voluntary act against truth and God.

  3.  **"...and so its wrongness comes in degrees proportionate to that injury..."**
      *   **Specialist Verdict: Defensible Simplification (if qualified).** Augustine categorizes lies into 8 types in *De Mendacio*, explicitly ranking their gravity. **Harm to others is a *major factor* in this ranking**, especially for the most severe lies (e.g., lies harming souls, lies causing death). Lies causing greater temporal harm (reputation, life) are indeed worse than "harmless" social lies. However, the ranking **also incorporates**:
          *   The *nature of the truth violated* (lies about religion are gravest).
          *   The *intent* and *malice* behind the lie.
          *   The *relationship* between liar and deceived.
          *   The *context* (e.g., teaching vs. casual conversation).
          So, while harm is a significant *component* of the gravity, it's not the *sole* factor, and the *fundamental* wrongness (the sinfulness itself) applies to all intentional falsehoods.

  4.  **"a lie that harms nobody is a peccadillo, one that costs a man his reputation is worse, and one that costs a life is the gravest lie there is."**
      *   **Specialist Verdict: Defensible Simplification of the Gravity Scale.** This broadly captures the *relative gravity* Augustine assigns based on consequences. He absolutely sees lies causing death or spiritual harm as the worst, and "harmless" lies (like flattery or social white lies) as the least grave *types* of lie. Calling the least grave a "peccadillo" (minor sin) is fair in *relative* terms within the category of lies, though Augustine still insists *all* intentional falsehoods are sins against God.

  5.  **"This scalar account is what lets Augustine be an absolutist and still look reasonable — he can forbid the lie to the killer at the door precisely because such a lie risks a life..."**
      *   **Specialist Verdict: Partial Truth / Misleading.** Augustine is indeed an absolutist: **no intentional false statement (lie) is ever permissible**, even to save a life. He explicitly rejects lying to the killer at the door (*Contra Mendacium*). The scalar account explains *why* this particular lie is so *gravely* evil (because it risks life), reinforcing the prohibition. However, the absolutism is *not primarily* justified by the gravity scale; it's justified by the *intrinsic* sinfulness of all lying against one's mind, regardless of consequences. The gravity scale shows *why* obeying the absolute rule is especially crucial in severe cases.

  6.  **"...while leaving us free to mislead that killer with a true statement he is likely to misread, or simply to say nothing at all."**
      *   **Specialist Verdict: Largely Correct.** This is a crucial and accurate point. Augustine makes a **sharp distinction**:
          *   **Lie (Forbidden):** Intentionally uttering a false statement (*contra mentem*).
          *   **Truthful Deception (Potentially Permissible):** Uttering a *true* statement with the *intention* that the hearer will misunderstand it (e.g., hiding a fugitive and saying truthfully "He is not *here*" meaning under this bed, while knowing the killer will think you mean not in the house). This avoids the formal definition of a lie.
          *   **Silence (Permissible):** Simply refusing to answer.
          He explicitly allows this kind of misleading truthfulness as an alternative to lying, even in dire situations like hiding someone from killers.

  7.  **"Consistently with this, he does not count as lies either the remark made in jest, where nobody expects to be believed, or the assertion you sincerely make that happens to turn out false."**
      *   **Specialist Verdict: Correct Outcome, Slightly Off on Reasons.**
          *   **Jest:** Correctly excluded. Augustine excludes statements where the *speaker* lacks the *intent to deceive* because the context (like jest) makes it clear no assertion of truth is being made. It's the *speaker's* lack of deceptive intent that matters most, though the social context (nobody expects belief) supports this.
          *   **Sincere Error:** Correctly excluded. Augustine requires the speaker to *know or believe* the statement is false *at the time of utterance*. A sincere mistake involves no intent to speak against one's mind; the speaker believes they are speaking truthfully. The objective falsity is irrelevant to the definition of a lie.

  8.  **Essay's Conclusion: "Augustine's absolutism is covertly a harm principle and therefore has nothing distinctive to offer in the case of the murderer at the door."**
      *   **Specialist Verdict: Does Not Follow from Augustine's Actual View; Follows Only from the Essay's Misrepresentation.**
          *   **Why it doesn't follow from Augustine:** Augustine's absolutism is **fundamentally deontological and theological**, not consequentialist. The prohibition is absolute because lying is *intrinsically* a sin against God and truth, corrupting the soul. The harm principle (focusing solely on consequences to others) is alien to his core reasoning. While *gravity* considers harm, the *prohibition itself* does not rest on it. His "distinctive offer" is precisely the **absolute prohibition on the formal lie itself**, countered by the permission of truthful deception and silence.
          *   **Why it follows from the Essay's Summary:** The essay *misrepresented* Augustine's foundation, claiming the wrongness *is* the harm to the deceived and the absolutism is justified by the gravity scale (implying the rule exists *because* of the harm). If that were true, then in the killer-at-the-door scenario, where harm is extreme, the absolutism would indeed seem like just a strict application of the harm principle, offering nothing distinctive. But this conclusion stems from the essay's initial error about the *basis* of Augustine's ethics.

  **Summary of Key Corrections:**

  1.  **The Essence of Lying:** Lies in the *intent to speak falsely* (against one's mind), not objective falsity.
  2.  **The Primary Wrong:** Lies in the offense against God/Truth and the corruption of the *liar's* soul, *not* primarily the harm to the victim (though harm is a serious consequence affecting gravity).
  3.  **The Basis of Absolutism:** Is the *intrinsic* sinfulness of the act defined by intent, *not* a covert harm principle. The gravity scale explains *why* some lies are worse sins, not *why* lying is always forbidden.
  4.  **The Killer at the Door:** Augustine *absolutely forbids* the formal lie. His distinctive contribution is maintaining this absolute ban *while* permitting deceptive use of truth and silence as alternatives. This flows directly from his definition of a lie.

  You were correct to be suspicious about the location of the lie (speaker's mind vs. facts) and the primary injury (liar's soul vs. victim's harm). The essay significantly downplays Augustine's theological foundation and misattributes the source of his absolutism to a scaled harm principle, leading to its flawed final conclusion.
