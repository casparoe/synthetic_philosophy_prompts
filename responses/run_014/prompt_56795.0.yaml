prompt: |-
  I serve on the cause-prioritization committee of a mid-sized foundation. Every application is scored by the committee on three dimensions — importance, tractability, neglectedness — each on a 1-to-10 scale, and the scores are entered in the minutes before the funding decision is taken. Our record over the past three years runs as follows:

  1. Scale-up of a well-evidenced cash-assistance program in a region where several large funders already operate. I = 7, T = 9, N = 2. Rejected.
  2. A novel delivery mechanism for an established vaccine, mid-development. I = 9, T = 4, N = 8. Funded in full.
  3. An advocacy campaign in a policy area already receiving heavy outside attention. I = 6, T = 6, N = 2. Rejected.
  4. A speculative research program with a thin evidence base but a potentially transformative payoff. I = 10, T = 2, N = 8. Funded, though only as a small milestone-gated exploratory grant rather than the full request.
  5. A modest, well-evidenced improvement in a field almost nobody else funds. I = 4, T = 8, N = 7. Funded.
  6. Mid-level technical work, reasonable feasibility, moderate outside attention. I = 8, T = 7, N = 5. Funded.

  Next month we decide an application scored I = 7, T = 7, N = 4. Two contextual details are not captured by those numbers. First, the field contains only four organizations, two of which are the area's largest existing funders, and roughly three years' worth of committed money for comparable work already sits unspent; the applicant states plainly that our grant would be absorbed, but that near-identical projects are funded elsewhere through the end of the decade. Second, two of the seven importance points rest on second-order effects — researchers trained by the project moving on to other cause areas — and the minutes for case 2 record the chair explicitly declining to credit that kind of downstream benefit when scoring.

  What should we decide if we want to be consistent with our own record? In answering, please do the following. Set out the candidate decision rules that our six precedents leave open; my own suspicion is that at least a multiplicative rule, an additive rule, and some treatment of neglectedness as a gate or as a measure of marginal dollars rather than of headcount all survive the record, but tell me if you find others, and tell me if any of these is in fact ruled out. For each surviving rule, state what it implies for this application, and what it implies if the second-order component of the importance score is not credited. Identify which precedent is the closest analog and say whether that analogy is doing any real work or merely restating the rule you have already chosen. Then give me your best guess at the decision, together with your reasons for preferring the rule that generates it over the alternatives — including, if it matters to you, how much parameter slack each rule needs in order to fit all six precedents. Finally, if the record genuinely underdetermines this case, describe a further application, concretely enough that we would recognize it if it arrived, whose outcome would discriminate among the live rules; and state what principle we would be committing ourselves to if we fund, and what different principle we would be committing ourselves to if we refuse.

  Lead with your recommended decision in your first sentence, then give the reasoning; no preamble and no restatement of the question.
reasoning: |-
  Hmm, the user is on a foundation's cause-prioritization committee and wants to ensure consistent decision-making based on past cases. They've provided six precedents with scores on Importance, Tractability, and Neglectedness (all 1-10 scales), and now need to decide on a new application scored I=7, T=7, N=4. There are two key contextual details: existing unspent funds in the field (making it less neglected than N=4 suggests), and 2 importance points relying on second-order effects that were explicitly discounted in a previous case.

  First, I need to identify which decision rules are consistent with all six precedents. Looking at the cases:

  - Case 1: I7 T9 N2 → Rejected (high T but low N seems fatal)
  - Case 2: I9 T4 N8 → Funded (high I and N compensate low T)
  - Case 3: I6 T6 N2 → Rejected (moderate I/T but low N)
  - Case 4: I10 T2 N8 → Partially funded (high I/N but low T gets reduced support)
  - Case 5: I4 T8 N7 → Funded (low I but high T/N)
  - Case 6: I8 T7 N5 → Funded (moderate all)

  Possible rules that fit:
  - **Multiplicative (I×T×N)**: Case 1 would have high product but was rejected, so this needs a threshold or N-gate. If we set a threshold around 200, it fits if N≥3 or similar. Case 1's 126 is below threshold if N<3 is gate.
  - **Additive (I+T+N)**: Case 1 sums to 18 but rejected, Case 2 sums to 21 funded, so needs N-gate or threshold. If threshold ~19 and N≥3, it fits.
  - **Neglectedness gate**: Only fund if N≥X. Cases 1(N2) and 3(N2) rejected, others funded have N≥5 except Case 4(N8) and 5(N7). But Case 6 has N=5 funded, so gate at N≥3? But Case 3 has N=2 rejected. So gate at N≥3 or higher? Case 4 has high N but low T, got partial funding.
  - **Marginal impact adjustment**: Treating N as multiplier for marginal dollars rather than headcount. Low N means less marginal impact per dollar. This could explain Case 1 rejection despite high I/T.

  For the new application (I7 T7 N4):
  - Raw multiplicative: 7×7×4=196
  - Additive: 18
  - With N-gate: N=4 might pass if gate is N≥3 or N≥4?

  But contextual factors:
  1. Field has unspent funds → true neglectedness lower than N=4. Comparable to Case 1 where N=2 was rejected for similar saturation.
  2. 2 importance points from second-order effects → should be discounted as per Case 2 precedent. Adjusted I=5.

  Adjusting scores:
  - True neglectedness: Probably N≤3 given saturation (like Cases 1 and 3)
  - True importance: I=5 (removing second-order points)

  Now applying rules to adjusted scores (I5 T7 N3):
  - Multiplicative: 5×7×3=105 → below typical funded threshold (Cases 2:288, 5:224, 6:280; threshold ~200-250)
  - Additive: 15 → below funded cases (Case 2:21, Case 5:19, Case 6:20)
  - N-gate: N=3 might pass depending on threshold, but Cases 1/3 rejected at N=2, Case 6 funded at N=5. Probably fails if gate is strict.

  Closest analog is Case 3 (I6 T6 N2 rejected) with saturation and low N. Also resembles Case 1.

  If we don't adjust importance, with I7 T7 N3:
  - Mult: 7×7×3=147 → still below threshold
  - Add: 17 → borderline but Case 3 was 14 rejected, Case 6 is 20 funded → likely rejection

  Discriminating case proposal: An application with I=5, T=5, N=9. 
  - Multiplicative (225) would fund if threshold ~200
  - Additive (19) might fund if no N-gate
  - But with strict N-gate, if N=9>threshold, all fund. Need a case with medium scores but high N vs. medium N but higher I/T.

  Better: I=3, T=9, N=8 (like a highly tractable, neglected but low-importance project). 
  - Case 5 was I4 T8 N7 funded, so this might be funded under multiplicative (216) or additive (20). 
  - If rejected, shows higher importance threshold. 
  - If funded, consistent with current rules.

  Principle if fund: We prioritize neglectedness even when absolute impact is moderate. 
  If reject: We require minimum importance regardless of neglectedness.

  My recommendation: Reject, based on adjusted scores falling below thresholds and strong analogy to Case 1 and 3, with neglectedness gate being decisive.
answer: |-
  Reject the application.

  **Candidate decision rules consistent with all six precedents:**  
  1. **Multiplicative rule with neglectedness gate:** Fund if \( I \times T \times N \geq \text{threshold} \) and \( N \geq 3 \).  
     - Threshold range: 180–250 (fits all cases, e.g., Case 1: \( 7 \times 9 \times 2 = 126 \) < threshold → rejected; Case 2: \( 9 \times 4 \times 8 = 288 \) > threshold → funded).  
  2. **Additive rule with neglectedness gate:** Fund if \( I + T + N \geq \text{threshold} \) and \( N \geq 3 \).  
     - Threshold range: 19–21 (e.g., Case 3: \( 6 + 6 + 2 = 14 \) < threshold → rejected; Case 5: \( 4 + 8 + 7 = 19 \) ≥ threshold → funded).  
  3. **Neglectedness as marginal impact (multiplicative adjustment):** Treat \( N \) as a discount factor for marginal utility per dollar (e.g., fund if \( I \times T \times f(N) \geq \text{threshold} \), where \( f(N) \) scales \( N \) to reflect saturation).  
     - \( f(N) \) must fit cases: e.g., \( f(N) = N/2 \) for \( N \leq 4 \), identity otherwise (Case 1: \( 7 \times 9 \times f(2) = 7 \times 9 \times 1 = 63 \) < threshold → rejected; Case 6: \( 8 \times 7 \times f(5) = 8 \times 7 \times 5 = 280 \) > threshold → funded).  
  4. **Neglectedness gate alone:** Fund only if \( N \geq 4 \) (but Case 4 has \( N=8 \) and received reduced funding, implying \( N \) isn’t sufficient alone; thus, \( N \geq 4 \) is necessary but not sufficient).  

  **Ruled-out rules:**  
  - Pure multiplicative or additive without gates (fails Case 1: high \( I \times T \) rejected despite 126 product, and Case 3: sum 14 rejected).  
  - Neglectedness as binary gate at \( N \geq 5 \) (fails Case 5: \( N=7 \) funded, but Case 6: \( N=5 \) funded requires lower gate).  

  **Implications for current application (I=7, T=7, N=4):**  
  - Without adjusting importance:  
    - Multiplicative + gate: \( 7 \times 7 \times 4 = 196 \). With threshold ≤196 and \( N \geq 3 \), fund.  
    - Additive + gate: \( 7 + 7 + 4 = 18 \). With threshold ≤18 and \( N \geq 3 \), reject (since Case 3 sum=14 rejected; 18 is below typical 19–21).  
    - Marginal impact: \( 7 \times 7 \times f(4) \). If \( f(4) = 4 \) (no adjustment), fund if threshold ≤196; if \( f(4) = 2 \) (saturation discount), \( 7 \times 7 \times 2 = 98 \) → likely reject.  
  - After removing second-order importance (adjusted I=5):  
    - Multiplicative + gate: \( 5 \times 7 \times 4 = 140 \). With threshold >140 (e.g., 180–250), reject.  
    - Additive + gate: \( 5 + 7 + 4 = 16 \). With threshold 19–21, reject.  
    - Marginal impact: \( 5 \times 7 \times f(4) \). If \( f(4) = 2 \), \( 5 \times 7 \times 2 = 70 \) → reject.  

  **Closest analog:** Case 1 (I=7, T=9, N=2 rejected). Both have high I/T but low N in saturated fields with unspent funds. The analogy works because:  
  - Context: Case 1 had "several large funders already operate" (like this application’s "two largest funders" and "unspent money").  
  - Outcome: Rejection driven by neglectedness, overriding high I/T.  
  - This isn’t just restating rules—it shows the committee historically prioritizes field saturation over raw scores.  

  **Preferred rule and decision:**  
  Reject, using **neglectedness as a gate with multiplicative scoring**, adjusted for context.  
  - **Rule:** Fund only if \( N \geq 4 \) and \( I \times T \times N \geq 180 \), with \( I \) and \( N \) contextualized for saturation and direct impact.  
  - **Why reject?**  
    - Adjusted scores (I=5, T=7, N=3) accounting for context:  
      - N=3 (not 4) due to "unspent money" and "near-identical projects funded elsewhere" (like Case 1’s N=2).  
      - I=5 (not 7) as second-order effects were discounted in Case 2.  
      - Product: \( 5 \times 7 \times 3 = 105 < 180 \) → below threshold.  
    - **Why this rule over others:**  
      - **Fit:** Needs minimal slack (threshold 180–250 fits all six cases; N-gate at ≥3 fits Cases 1/3 rejected and 2/4/5/6 funded).  
      - **Context sensitivity:** Explicitly accounts for marginal impact (e.g., Case 1 rejection and Case 4 partial funding show dollars matter more in saturated fields).  
      - **Alternatives’ flaws:**  
        - Additive rule ignores compounding effects (underweights low N, e.g., barely fits Case 5).  
        - Pure multiplicative underfits without N-gate (Case 1 should reject).  
        - Marginal-impact variants add unnecessary complexity; the gate + multiplier captures saturation.  

  **If underdetermined, discriminating case:**  
  Propose an application scored **I=3, T=9, N=8** (e.g., scaling a highly tractable, evidence-backed method in a critically neglected area with no existing funders, but low direct importance).  
  - **If funded:** Commits to "neglectedness and tractability can compensate low importance" (favoring multiplicative/marginal-impact rules).  
  - **If rejected:** Commits to "importance is a strict gate" (favoring additive with high I-threshold).  
  This resolves ambiguity: Current rules fund Case 5 (I=4, T=8, N=7), so I=3 tests the lower bound.
